<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日小确幸</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #3a3a3a;
    --text-light: #8a8580;
    --accent: #c4956a;
    --accent-light: #f0e6da;
    --green: #7fb069;
    --green-light: #e8f5e3;
    --shadow: 0 2px 20px rgba(0,0,0,0.06);
    --radius: 16px;
  }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 48px 24px 32px;
    position: relative;
  }

  .header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 2px;
    background: var(--accent);
    border-radius: 1px;
  }

  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  .header .subtitle {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 300;
    letter-spacing: 1px;
  }

  .header .date-display {
    font-size: 12px;
    color: var(--accent);
    margin-top: 12px;
    font-weight: 400;
  }

  /* Main container */
  .container {
    max-width: 420px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* Task Card */
  .task-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
  }

  .task-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), #e8c9a0, var(--accent));
  }

  .task-category {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-light);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
    font-weight: 500;
    letter-spacing: 1px;
  }

  .task-emoji {
    font-size: 48px;
    margin-bottom: 16px;
    display: block;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .task-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 18px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .task-hint {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 12px;
    font-weight: 300;
  }

  /* Buttons */
  .btn-group {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }

  .btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
  }

  .btn-primary:hover {
    background: #b3845a;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(196,149,106,0.3);
  }

  .btn-secondary {
    background: var(--accent-light);
    color: var(--accent);
  }

  .btn-secondary:hover {
    background: #e8ddd0;
  }

  .btn-done {
    background: var(--green);
    color: white;
    width: 100%;
    padding: 16px;
    font-size: 15px;
  }

  .btn-done:hover {
    background: #6d9e58;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(127,176,105,0.3);
  }

  /* Completed state */
  .task-card.completed {
    border: 2px solid var(--green);
  }

  .task-card.completed::before {
    background: var(--green);
  }

  .completed-badge {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--green);
    font-size: 13px;
    font-weight: 500;
    margin-top: 16px;
  }

  .task-card.completed .completed-badge {
    display: flex;
  }

  /* History */
  .history-section {
    margin-top: 36px;
  }

  .history-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .history-title span {
    font-size: 12px;
    color: var(--text-light);
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .history-item {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.04);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.2s ease;
  }

  .history-item:hover {
    transform: translateX(4px);
  }

  .history-item .h-emoji {
    font-size: 24px;
    flex-shrink: 0;
  }

  .history-item .h-text {
    font-size: 13px;
    color: var(--text);
    flex: 1;
    line-height: 1.5;
  }

  .history-item .h-date {
    font-size: 11px;
    color: var(--text-light);
    flex-shrink: 0;
  }

  .history-empty {
    text-align: center;
    padding: 32px 0;
    color: var(--text-light);
    font-size: 13px;
    font-weight: 300;
  }

  /* Share modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.active {
    display: flex;
  }

  .share-card {
    background: linear-gradient(135deg, #faf7f2 0%, #f0e6da 100%);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    position: relative;
  }

  .share-card .sc-emoji {
    font-size: 56px;
    margin-bottom: 16px;
  }

  .share-card .sc-task {
    font-family: 'Noto Serif SC', serif;
    font-size: 17px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 20px;
  }

  .share-card .sc-footer {
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 2px;
  }

  .share-card .sc-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-light);
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 24px;
    padding: 16px;
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0 1px 8px rgba(0,0,0,0.04);
  }

  .stat-item {
    text-align: center;
  }

  .stat-num {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* Animations */
  .fade-in {
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-up {
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .header h1 { font-size: 24px; }
    .container { padding: 20px 16px 48px; }
    .task-card { padding: 28px 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>今日小确幸</h1>
  <div class="subtitle">微小而确实的幸福，每天都在身边</div>
  <div class="date-display" id="dateDisplay"></div>
</div>

<div class="container">
  <!-- Stats -->
  <div class="stats-bar fade-in">
    <div class="stat-item">
      <div class="stat-num" id="streakCount">0</div>
      <div class="stat-label">连续打卡</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="totalCount">0</div>
      <div class="stat-label">累计完成</div>
    </div>
    <div class="stat-item">
      <div class="stat-num" id="weekCount">0</div>
      <div class="stat-label">本周完成</div>
    </div>
  </div>

  <!-- Task Card -->
  <div class="task-card fade-in" id="taskCard" style="margin-top: 20px;">
    <div class="task-category" id="taskCategory">观察自然</div>
    <span class="task-emoji" id="taskEmoji">️</span>
    <div class="task-text" id="taskText">加载中...</div>
    <div class="task-hint" id="taskHint">花两分钟，做一件无用但有趣的小事</div>
    <div class="completed-badge">
      <span>✨</span> 今日已完成
    </div>
    <div class="btn-group" id="btnGroup">
      <button class="btn btn-secondary" onclick="generateTask()">换一个</button>
      <button class="btn btn-primary" onclick="completeTask()">完成打卡</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="history-title">
      近期记录 <span id="historyCount"></span>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">还没有记录，完成第一个小确幸吧 </div>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div class="modal-overlay" id="shareModal">
  <div class="share-card slide-up">
    <button class="sc-close" onclick="closeShare()">&times;</button>
    <div class="sc-emoji" id="shareEmoji">☁️</div>
    <div class="sc-task" id="shareTask">任务内容</div>
    <div class="sc-footer">今日小确幸 · 发现身边的美好</div>
  </div>
</div>

<script>
// Task database
const tasks = [
  // 观察自然
  { category: '观察自然', emoji: '☁️', text: '抬头看看天空，给今天看到的云取个名字', hint: '云的形状每天都在变，今天那朵像什么？' },
  { category: '观察自然', emoji: '', text: '找一片形状特别的叶子，拍下来收藏', hint: '路边、公园、甚至花盆里都可能藏着惊喜' },
  { category: '观察自然', emoji: '', text: '闭上眼睛30秒，数一数周围有几种声音', hint: '风声、鸟鸣、远处的笑声……你平时可能都忽略了' },
  { category: '观察自然', emoji: '🎨', text: '找一找身边今天最温暖的颜色，拍下来', hint: '可能是一束光、一面墙、一杯咖啡' },
  { category: '观察自然', emoji: '🐱', text: '观察一只小动物（猫/鸟/虫子）至少1分钟', hint: '看它怎么走路、怎么休息，像看一部微型纪录片' },
  { category: '观察自然', emoji: '', text: '今天注意一次日出或日落，哪怕只有30秒', hint: '不用特意早起，下班路上抬头看看就好' },
  { category: '观察自然', emoji: '🌸', text: '找一朵今天刚开的花，凑近闻一闻', hint: '小区里、路边、甚至办公桌上的盆栽' },
  { category: '观察自然', emoji: '', text: '观察一滴水的形状——雨滴、露珠、水龙头', hint: '水的表面张力让每一滴都是完美的球体' },

  // 与人互动
  { category: '与人互动', emoji: '💬', text: '给一个很久没联系的朋友发条消息，不用有事', hint: '"突然想到你了"就是最好的开场白' },
  { category: '与人互动', emoji: '', text: '对今天遇到的第一个服务人员真诚地说声谢谢', hint: '收银员、外卖员、保洁阿姨，他们值得被看见' },
  { category: '与人互动', emoji: '📸', text: '给家人或室友拍一张好看的照片，发给他们', hint: '不用摆拍，抓拍最自然的瞬间' },
  { category: '与人互动', emoji: '💌', text: '写一张便签留给某个人，放在ta能看到的地方', hint: '一句话就够了："今天也要开心"' },
  { category: '与人互动', emoji: '👋', text: '对镜子里的自己说一句鼓励的话', hint: '你比自己以为的更棒' },
  { category: '与人互动', emoji: '', text: '帮身边的人一个小忙，哪怕只是递张纸巾', hint: '善意不需要理由' },

  // 记录美好
  { category: '记录美好', emoji: '✍️', text: '写下今天让你微笑的一个瞬间，哪怕很小', hint: '可能是一个表情包、一句歌词、一阵风' },
  { category: '记录美好', emoji: '📷', text: '拍一张今天最好看的光影照片', hint: '阳光穿过树叶、窗帘的投影、路灯下的雨' },
  { category: '记录美好', emoji: '🎵', text: '记录今天听到的一句让你心动的话或歌词', hint: '可能来自播客、广告、路人的对话' },
  { category: '记录美好', emoji: '😊', text: '画一个今天的emoji心情，不用好看，真实就好', hint: '用3个emoji总结今天：天气+心情+一件事' },
  { category: '记录美好', emoji: '', text: '写下此刻最想感谢的一个人，不用告诉ta', hint: '感恩本身就是一种幸福' },
  { category: '记录美好', emoji: '📝', text: '在手机备忘录里写一句"今天的小确幸"', hint: '一个月后回看，你会惊讶于生活的美好' },

  // 趣味挑战
  { category: '趣味挑战', emoji: '✋', text: '用非惯用手写自己的名字，看看有多丑', hint: '大脑会短暂混乱，这感觉其实很有趣' },
  { category: '趣味挑战', emoji: '👃', text: '闭上眼睛吃一口食物，猜猜是什么味道', hint: '味觉在没有视觉干扰时会变得更敏锐' },
  { category: '趣味挑战', emoji: '🌤️', text: '用3个词形容今天的天气，不能重复别人说过的', hint: '"像刚洗完的床单"算一个吗？' },
  { category: '趣味挑战', emoji: '☕', text: '给自己泡一杯平时不会喝的饮品', hint: '换个口味，换个心情' },
  { category: '趣味挑战', emoji: '🎲', text: '做一件平时不会做的小事，比如走一条新路回家', hint: '打破 routine 的瞬间最鲜活' },
  { category: '趣味挑战', emoji: '', text: '深呼吸5次，每次呼气时放下一个烦恼', hint: '不用解决，先放下' },
  { category: '趣味挑战', emoji: '🎭', text: '用夸张的表情拍一张自拍，只给自己看', hint: '成年人也需要释放' },
  { category: '趣味挑战', emoji: '📚', text: '随机翻开一本书，读第一页的第一段', hint: '不管是哪本书，都可能有意外的收获' },
];

// State
let currentTask = null;
let history = [];
let todayCompleted = false;

// Initialize
function init() {
  // Set date
  const now = new Date();
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  document.getElementById('dateDisplay').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${days[now.getDay()]}`;

  // Load history
  loadHistory();

  // Generate today's task
  generateTask();

  // Update stats
  updateStats();
}

function generateTask() {
  const idx = Math.floor(Math.random() * tasks.length);
  currentTask = tasks[idx];

  document.getElementById('taskCategory').textContent = currentTask.category;
  document.getElementById('taskEmoji').textContent = currentTask.emoji;
  document.getElementById('taskText').textContent = currentTask.text;
  document.getElementById('taskHint').textContent = currentTask.hint;

  // Re-trigger animation
  const card = document.getElementById('taskCard');
  card.classList.remove('completed');
  card.style.animation = 'none';
  card.offsetHeight; // trigger reflow
  card.style.animation = 'fadeIn 0.5s ease';

  document.getElementById('btnGroup').style.display = 'flex';
  todayCompleted = false;
}

function completeTask() {
  if (!currentTask) return;
  if (todayCompleted) return;

  todayCompleted = true;
  const now = new Date();
  const record = {
    emoji: currentTask.emoji,
    text: currentTask.text,
    category: currentTask.category,
    date: `${now.getMonth()+1}/${now.getDate()}`,
    timestamp: now.getTime()
  };

  history.unshift(record);
  saveHistory();

  // Update UI
  document.getElementById('taskCard').classList.add('completed');
  document.getElementById('btnGroup').style.display = 'none';

  updateStats();
  renderHistory();

  // Show share modal after a short delay
  setTimeout(() => {
    showShare(record);
  }, 600);
}

function showShare(record) {
  document.getElementById('shareEmoji').textContent = record.emoji;
  document.getElementById('shareTask').textContent = record.text;
  document.getElementById('shareModal').classList.add('active');
}

function closeShare() {
  document.getElementById('shareModal').classList.remove('active');
}

function updateStats() {
  const now = new Date();
  const today = `${now.getMonth()+1}/${now.getDate()}`;

  // Total count
  document.getElementById('totalCount').textContent = history.length;

  // Week count
  const weekAgo = now.getTime() - 7 * 24 * 60 * 60 * 1000;
  const weekTasks = history.filter(h => h.timestamp > weekAgo);
  document.getElementById('weekCount').textContent = weekTasks.length;

  // Streak (simplified)
  let streak = 0;
  const uniqueDays = [...new Set(history.map(h => h.date))];
  // Simple streak calculation
  for (let i = 0; i < uniqueDays.length; i++) {
    streak++;
  }
  if (todayCompleted && !uniqueDays.includes(today)) streak++;
  document.getElementById('streakCount').textContent = Math.min(streak, uniqueDays.length || (todayCompleted ? 1 : 0));
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const countEl = document.getElementById('historyCount');

  if (history.length === 0) {
    list.innerHTML = '<div class="history-empty">还没有记录，完成第一个小确幸吧 ✨</div>';
    countEl.textContent = '';
    return;
  }

  countEl.textContent = `共 ${history.length} 条`;
  list.innerHTML = history.slice(0, 10).map(h => `
    <div class="history-item fade-in">
      <span class="h-emoji">${h.emoji}</span>
      <span class="h-text">${h.text}</span>
      <span class="h-date">${h.date}</span>
    </div>
  `).join('');
}

function saveHistory() {
  try {
    localStorage.setItem('xiaquxing_history', JSON.stringify(history));
  } catch(e) {}
}

function loadHistory() {
  try {
    const saved = localStorage.getItem('xiaquxing_history');
    if (saved) history = JSON.parse(saved);
  } catch(e) {}
}

// Close modal on overlay click
document.getElementById('shareModal').addEventListener('click', function(e) {
  if (e.target === this) closeShare();
});

// Init
init();
</script>

</body>
</html>
