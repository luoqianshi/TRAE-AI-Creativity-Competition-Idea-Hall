<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文献速读拆解助手 - 论文智能梳理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .module-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .module-title {
            font-size: 18px;
            color: #2b6cb0;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #2b6cb0;
            background: #f0f7ff;
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            background: #2b6cb0;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            margin: 0 5px;
        }
        .btn:hover {
            background: #2c5282;
        }
        .result-box {
            min-height: 200px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            white-space: pre-wrap;
            line-height: 1.8;
            color: #333;
        }
        .btn-group {
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI文献速读拆解助手</h1>

        <div class="module-box">
            <div class="module-title">📁 文献上传区域</div>
            <div class="upload-area" id="uploadArea">
                <p>点击或拖拽上传论文/文献文件（PDF/TXT）</p>
                <p style="font-size: 12px; color: #666; margin-top: 8px;">支持批量上传，自动解析文献内容</p>
            </div>
            <input type="file" id="fileInput" hidden accept=".pdf,.txt" multiple>
        </div>

        <div class="module-box">
            <div class="module-title">🤖 AI智能解析结果</div>
            <div class="result-box" id="resultBox">文献解析结果将在此处展示：
1. 论文核心摘要
2. 研究目的与创新点
3. 实验方法与核心结论
4. 关键知识点梳理
5. 文献重难点总结</div>
            <div class="btn-group">
                <button class="btn" id="analyseBtn">一键AI解析</button>
                <button class="btn" id="exportBtn">导出笔记文档</button>
            </div>
        </div>
    </div>

    <script>
        // 上传交互
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const analyseBtn = document.getElementById('analyseBtn');
        const exportBtn = document.getElementById('exportBtn');
        const resultBox = document.getElementById('resultBox');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        // 模拟AI解析功能
        analyseBtn.addEventListener('click', () => {
            resultBox.innerText = "AI解析中，请稍候...";
            setTimeout(() => {
                resultBox.innerText = "【文献智能拆解完成】\n1. 核心摘要：自动提取文献研究主题、研究范围与核心成果\n2. 创新点梳理：归纳文献全新研究方法、突破点与行业价值\n3. 核心结论：整理文献最终实验结果、数据支撑与研究定论\n4. 知识点汇总：提炼专业术语、研究模型、核心理论\n5. 学习建议：针对文献重难点生成针对性学习解读";
            }, 1500);
        });

        // 模拟导出功能
        exportBtn.addEventListener('click', () => {
            alert("笔记文档导出成功！可直接保存使用");
        });
    </script>
</body>
</html>
