<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东京：情谊债务</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0a0a10;--bg2:#12121c;--bg3:#1a1a28;--bg4:#222230;
    --ink:#e8e6f0;--muted:#7878a0;--rule:#2a2a3a;
    --accent:#ff6b8a;--accent2:#7b68ee;--accent3:#ffd700;--accent4:#00d4aa;
    --font:'Noto Sans SC','Microsoft YaHei',sans-serif;
  }
  html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--ink)}

  /* ===== Title Screen ===== */
  #title-screen{
    position:fixed;inset:0;z-index:1000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#0a0a10 0%,#1a1028 30%,#0a0a10 60%,#101020 100%);
    transition:opacity 0.8s ease;
  }
  #title-screen.hidden{opacity:0;pointer-events:none}
  .title-logo{font-size:clamp(2.2rem,5.5vw,4rem);font-weight:700;
    background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent));
    background-size:200% 200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    margin-bottom:0.5rem;letter-spacing:0.08em;
    animation:gradientShift 4s ease infinite}
  @keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .title-sub{color:var(--muted);font-size:clamp(0.8rem,2vw,1rem);margin-bottom:3.5rem;letter-spacing:0.15em;text-transform:uppercase}
  .title-menu{display:flex;flex-direction:column;gap:0.7rem;align-items:center}
  .title-btn{
    background:rgba(10,10,16,0.6);border:1px solid var(--rule);color:var(--muted);
    padding:0.75rem 3rem;font-size:0.92rem;font-family:var(--font);cursor:pointer;
    border-radius:8px;min-width:240px;text-align:center;transition:all 0.35s cubic-bezier(0.4,0,0.2,1);letter-spacing:0.12em;position:relative;overflow:hidden}
  .title-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,107,138,0.1),transparent);transform:translateX(-100%);transition:transform 0.5s}
  .title-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,107,138,0.08);transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,107,138,0.15)}
  .title-btn:hover::before{transform:translateX(100%)}
  .title-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none;box-shadow:none}
  .title-btn:disabled::before{display:none}
  .title-ver{position:absolute;bottom:1.5rem;color:var(--muted);font-size:0.7rem;letter-spacing:0.05em;opacity:0.6}
  .title-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .title-particle{position:absolute;width:3px;height:3px;background:var(--accent);border-radius:50%;opacity:0.3;animation:particleFloat 8s infinite}
  @keyframes particleFloat{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:0.3}90%{opacity:0.3}100%{transform:translateY(-10vh) scale(1);opacity:0}}

  /* ===== Game Screen ===== */
  #game-screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
  #game-screen.active{display:flex;animation:fadeIn 0.5s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  /* BG Layer */
  #bg-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}
  #bg-layer.loaded{opacity:1}
  #bg-layer::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,16,0.2) 0%,rgba(10,10,16,0.1) 40%,rgba(10,10,16,0.5) 80%,rgba(10,10,16,0.85) 100%)}

  /* Vignette overlay */
  #vignette{position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 150px rgba(0,0,0,0.5)}

  /* Character Layer - transparent PNG sprites */
  #char-layer{position:absolute;bottom:0;left:0;right:0;height:95%;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;z-index:2;padding:0 1rem}
  .char-wrap{position:relative;max-height:90%;max-width:35%;display:flex;align-items:flex-end;transition:all 0.6s cubic-bezier(0.4,0,0.2,1);opacity:0;transform:translateY(30px) scale(0.97)}
  .char-wrap.show{opacity:1;transform:translateY(0) scale(1)}
  .char-wrap.left{transform:translateX(-15%)}
  .char-wrap.left.show{transform:translateX(-15%) translateY(0) scale(1)}
  .char-wrap.center{transform:translateX(0)}
  .char-wrap.center.show{transform:translateX(0) translateY(0) scale(1)}
  .char-wrap.right{transform:translateX(15%)}
  .char-wrap.right.show{transform:translateX(15%) translateY(0) scale(1)}
  .char-wrap.exit{opacity:0;transform:translateY(40px) scale(0.95)}
  .char-wrap.focus .char-sprite{filter:drop-shadow(0 8px 25px rgba(0,0,0,0.5)) brightness(1.05)}
  .char-wrap.dim .char-sprite{filter:drop-shadow(0 5px 15px rgba(0,0,0,0.3)) brightness(0.6) saturate(0.7)}
  .char-sprite{max-height:100%;max-width:100%;object-fit:contain;display:block}
  /* Ground shadow ellipse under character feet */
  .char-wrap .char-shadow{position:absolute;left:20%;right:20%;bottom:-4px;height:18px;background:radial-gradient(ellipse at center,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.15) 40%,transparent 75%);filter:blur(6px);pointer-events:none}

  /* Chapter Title */
  #chapter-title{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;
    text-align:center;pointer-events:none;opacity:0;display:none}
  #chapter-title.show{display:block;animation:chapterIn 3s forwards}
  @keyframes chapterIn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.9)}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)}
  }
  .chapter-label{font-size:0.7rem;color:var(--accent);letter-spacing:0.3em;text-transform:uppercase;margin-bottom:0.8rem;font-weight:700}
  .chapter-name{font-size:clamp(1.5rem,4vw,2.5rem);font-weight:700;color:var(--ink);letter-spacing:0.05em}

  /* HUD */
  #hud{position:absolute;top:0;left:0;right:0;padding:0.8rem 1.2rem;display:flex;justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none;opacity:0;transform:translateY(-10px);transition:all 0.5s ease}
  #hud.show{opacity:1;transform:translateY(0)}
  #hud>*{pointer-events:auto}
  .hud-left{display:flex;gap:0.5rem;align-items:flex-start}
  .hud-money{background:rgba(10,10,16,0.85);border:1px solid rgba(255,215,0,0.3);border-radius:8px;padding:0.4rem 0.9rem;font-size:0.78rem;color:var(--accent3);font-weight:600;backdrop-filter:blur(8px);display:flex;align-items:center;gap:0.3rem}
  .hud-money::before{content:'¥';font-size:0.65rem;opacity:0.7}
  .hud-date{background:rgba(10,10,16,0.85);border:1px solid var(--rule);border-radius:8px;padding:0.4rem 0.9rem;font-size:0.78rem;color:var(--muted);backdrop-filter:blur(8px)}
  .hud-debt-btn{background:rgba(10,10,16,0.85);border:1px solid rgba(255,107,138,0.3);border-radius:8px;padding:0.4rem 0.9rem;font-size:0.75rem;color:var(--accent);cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px);font-weight:600}
  .hud-debt-btn:hover{border-color:var(--accent);background:rgba(255,107,138,0.1);transform:translateY(-1px)}
  .hud-debt-btn.pulse{animation:debtPulse 2s infinite}
  @keyframes debtPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,138,0.3)}50%{box-shadow:0 0 0 6px rgba(255,107,138,0)}}
  .hud-btns{display:flex;gap:0.4rem}
  .hud-btn{background:rgba(10,10,16,0.85);border:1px solid var(--rule);border-radius:8px;padding:0.4rem 0.7rem;font-size:0.7rem;color:var(--muted);cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px)}
  .hud-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .hud-btn.active{border-color:var(--accent2);color:var(--accent2)}

  /* Debt Panel */
  #debt-panel{
    position:absolute;top:3.5rem;left:1rem;z-index:10;
    background:rgba(10,10,16,0.95);border:1px solid var(--accent);border-radius:12px;
    padding:1rem 1.2rem;min-width:220px;display:none;
    backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(255,107,138,0.15);
    transform:translateY(-10px);opacity:0;transition:all 0.3s ease
  }
  #debt-panel.show{display:block;animation:panelIn 0.3s forwards}
  @keyframes panelIn{to{opacity:1;transform:translateY(0)}}
  .debt-title{font-size:0.7rem;color:var(--accent);font-weight:700;letter-spacing:0.2em;text-transform:uppercase;margin-bottom:0.8rem;display:flex;align-items:center;gap:0.4rem}
  .debt-title::before{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block}
  .debt-item{display:flex;justify-content:space-between;align-items:center;padding:0.4rem 0;border-bottom:1px solid rgba(42,42,58,0.5);font-size:0.8rem;transition:background 0.2s}
  .debt-item:hover{background:rgba(255,107,138,0.03)}
  .debt-item:last-child{border-bottom:none}
  .debt-name{color:var(--ink);font-weight:500}
  .debt-source{font-size:0.7rem;color:var(--muted);margin-left:0.3rem}
  .debt-grade{font-weight:700;font-size:0.72rem;padding:0.1rem 0.4rem;border-radius:4px;background:rgba(0,0,0,0.3)}
  .grade-s{color:var(--accent3);border:1px solid rgba(255,215,0,0.3)}
  .grade-a{color:var(--accent4);border:1px solid rgba(0,212,170,0.3)}
  .grade-b{color:var(--accent2);border:1px solid rgba(123,104,238,0.3)}
  .grade-c{color:var(--muted);border:1px solid rgba(120,120,160,0.3)}
  .grade-d{color:var(--accent);border:1px solid rgba(255,107,138,0.3)}
  .debt-empty{text-align:center;color:var(--muted);font-size:0.78rem;padding:0.5rem 0;font-style:italic}

  /* Dialog Box */
  #dialog-area{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:0 1.2rem 1.2rem}
  #dialog-box{
    background:linear-gradient(180deg,rgba(10,10,16,0.95) 0%,rgba(15,15,24,0.98) 100%);
    border:1px solid rgba(42,42,58,0.6);border-radius:14px;
    padding:1.4rem 1.8rem;max-width:920px;margin:0 auto;min-height:150px;
    backdrop-filter:blur(16px);cursor:pointer;transition:all 0.3s ease;
    position:relative;box-shadow:0 -10px 40px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.03)}
  #dialog-box::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,107,138,0.3),transparent)}
  #dialog-box:hover{border-color:rgba(255,107,138,0.25);box-shadow:0 -10px 40px rgba(0,0,0,0.3),0 0 20px rgba(255,107,138,0.05),inset 0 1px 0 rgba(255,255,255,0.05)}
  #speaker-name{font-size:0.85rem;font-weight:700;margin-bottom:0.6rem;min-height:1.3em;display:flex;align-items:center;gap:0.5rem}
  #speaker-name::before{content:'';width:3px;height:1em;background:var(--accent);border-radius:2px;display:inline-block}
  #dialog-text{font-size:0.9rem;line-height:1.9;color:var(--ink);min-height:3.6em;letter-spacing:0.02em}
  #dialog-text .char{opacity:0;animation:charIn 0.04s forwards}
  @keyframes charIn{to{opacity:1}}
  #click-indicator{position:absolute;bottom:1rem;right:1.8rem;font-size:0.7rem;color:var(--accent);animation:blink 1.2s infinite;display:flex;align-items:center;gap:0.3rem}
  #click-indicator::after{content:'';width:6px;height:6px;background:var(--accent);border-radius:50%;display:inline-block}
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}

  /* Choices */
  #choices-area{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);z-index:25;display:none;flex-direction:column;gap:0.6rem;width:90%;max-width:620px}
  #choices-area.show{display:flex;animation:choicesIn 0.4s ease}
  @keyframes choicesIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .choice-btn{
    background:linear-gradient(135deg,rgba(10,10,16,0.95),rgba(18,18,28,0.95));
    border:1px solid rgba(42,42,58,0.6);border-radius:10px;
    padding:0.9rem 1.4rem;font-size:0.86rem;color:var(--muted);cursor:pointer;
    transition:all 0.35s cubic-bezier(0.4,0,0.2,1);font-family:var(--font);text-align:left;
    position:relative;overflow:hidden;backdrop-filter:blur(8px)}
  .choice-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity 0.3s}
  .choice-btn:hover{border-color:var(--accent);color:var(--accent);background:linear-gradient(135deg,rgba(255,107,138,0.08),rgba(18,18,28,0.95));transform:translateX(6px);box-shadow:0 4px 20px rgba(255,107,138,0.1)}
  .choice-btn:hover::before{opacity:1}
  .choice-btn .choice-req{font-size:0.7rem;color:var(--accent2);margin-top:0.25rem}
  .choice-btn.locked{opacity:0.35;cursor:not-allowed}
  .choice-btn.locked:hover{border-color:var(--rule);color:var(--muted);transform:none;box-shadow:none}
  .choice-btn.locked::before{display:none}
  .choice-index{position:absolute;right:1rem;top:50%;transform:translateY(-50%);font-size:0.7rem;color:var(--muted);opacity:0.5;font-weight:700}

  /* System Notification */
  #sys-notify{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;
    background:linear-gradient(135deg,rgba(10,10,16,0.98),rgba(18,12,28,0.98));
    border:1px solid rgba(255,107,138,0.4);border-radius:16px;
    padding:2.5rem 3rem;text-align:center;display:none;max-width:90%;width:420px;
    box-shadow:0 0 80px rgba(255,107,138,0.2),0 20px 60px rgba(0,0,0,0.5);
    backdrop-filter:blur(20px)}
  #sys-notify.show{display:block;animation:notifyIn 0.5s cubic-bezier(0.4,0,0.2,1)}
  @keyframes notifyIn{from{opacity:0;transform:translate(-50%,-50%) scale(0.85) translateY(20px)}to{opacity:1;transform:translate(-50%,-50%) scale(1) translateY(0)}}
  .notify-icon{font-size:2rem;margin-bottom:0.8rem}
  .notify-title{font-size:1.15rem;font-weight:700;color:var(--accent);margin-bottom:0.8rem;letter-spacing:0.05em}
  .notify-body{font-size:0.86rem;color:var(--muted);line-height:1.8}
  .notify-reward{color:var(--accent3);font-weight:700}
  .notify-hint{font-size:0.75rem;color:var(--muted);margin-top:1rem;opacity:0.7}

  /* Collection Effect */
  #collect-overlay{
    position:fixed;inset:0;z-index:90;display:none;
    background:rgba(10,10,16,0.88);align-items:center;justify-content:center;
    flex-direction:column;backdrop-filter:blur(8px)}
  #collect-overlay.show{display:flex;animation:fadeIn 0.4s ease}
  .collect-title{font-size:1.4rem;font-weight:700;color:var(--accent);margin-bottom:1.2rem;letter-spacing:0.15em;text-transform:uppercase;display:flex;align-items:center;gap:0.6rem}
  .collect-title::before,.collect-title::after{content:'';width:30px;height:1px;background:linear-gradient(90deg,transparent,var(--accent));display:block}
  .collect-title::after{background:linear-gradient(90deg,var(--accent),transparent)}
  .collect-options{display:flex;flex-direction:column;gap:0.8rem;width:90%;max-width:520px}
  .collect-opt{
    background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--rule);border-radius:12px;
    padding:1.1rem 1.4rem;cursor:pointer;transition:all 0.35s cubic-bezier(0.4,0,0.2,1);font-family:var(--font);
    position:relative;overflow:hidden}
  .collect-opt::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:0;transition:opacity 0.3s}
  .collect-opt:hover{border-color:var(--accent);transform:translateX(6px);box-shadow:0 6px 25px rgba(255,107,138,0.12)}
  .collect-opt:hover::before{opacity:1}
  .collect-opt-name{font-size:1rem;color:var(--ink);font-weight:600;margin-bottom:0.3rem}
  .collect-opt-desc{font-size:0.8rem;color:var(--muted);margin-top:0.3rem;line-height:1.5}
  .collect-opt-reward{font-size:0.78rem;color:var(--accent3);margin-top:0.4rem;font-weight:600;display:flex;align-items:center;gap:0.3rem}
  .collect-opt-reward::before{content:'▸';color:var(--accent3)}

  /* Save/Load Modal */
  #modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,10,16,0.85);display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
  #modal-overlay.show{display:flex;animation:fadeIn 0.3s ease}
  .modal-box{background:linear-gradient(180deg,var(--bg2),var(--bg3));border:1px solid rgba(42,42,58,0.6);border-radius:16px;padding:2rem;width:90%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
  .modal-title{font-size:1.15rem;font-weight:700;margin-bottom:1.2rem;display:flex;align-items:center;gap:0.5rem}
  .modal-title::before{content:'';width:4px;height:1.2em;background:var(--accent);border-radius:2px;display:inline-block}
  .save-slot{
    background:var(--bg);border:1px solid rgba(42,42,58,0.5);border-radius:10px;
    padding:0.9rem 1.1rem;margin-bottom:0.6rem;cursor:pointer;transition:all 0.25s;position:relative;overflow:hidden}
  .save-slot:hover{border-color:var(--accent);background:rgba(255,107,138,0.03);transform:translateX(3px)}
  .save-slot-info{font-size:0.84rem;color:var(--ink);font-weight:500}
  .save-slot-detail{font-size:0.74rem;color:var(--muted);margin-top:0.25rem;display:flex;gap:0.8rem}
  .save-slot.empty{color:var(--muted);font-style:italic;text-align:center;padding:1rem}
  .save-slot-tag{font-size:0.65rem;padding:0.1rem 0.4rem;border-radius:4px;background:rgba(255,107,138,0.1);color:var(--accent);font-weight:600}
  .modal-close{margin-top:1.2rem;background:transparent;border:1px solid var(--rule);color:var(--muted);padding:0.6rem 1.8rem;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:0.85rem;transition:all 0.2s;width:100%}
  .modal-close:hover{border-color:var(--accent);color:var(--accent);background:rgba(255,107,138,0.05)}

  /* Config */
  .config-row{display:flex;justify-content:space-between;align-items:center;padding:0.7rem 0;border-bottom:1px solid rgba(42,42,58,0.4);font-size:0.88rem}
  .config-row:last-child{border-bottom:none}
  .config-label{color:var(--ink);font-weight:500}
  .config-value{color:var(--muted);font-size:0.8rem}
  .config-slider{width:140px;accent-color:var(--accent);cursor:pointer}
  .config-slider::-webkit-slider-thumb{background:var(--accent)}

  /* Auto/Skip indicators */
  #auto-indicator{position:fixed;top:50%;right:1.2rem;transform:translateY(-50%);background:rgba(10,10,16,0.9);border:1px solid var(--accent2);border-radius:8px;padding:0.4rem 0.8rem;font-size:0.72rem;color:var(--accent2);display:none;z-index:15;font-weight:600;letter-spacing:0.1em;backdrop-filter:blur(8px)}
  #auto-indicator.show{display:block;animation:indicatorPulse 2s infinite}
  #skip-indicator{position:fixed;top:calc(50% + 2.5rem);right:1.2rem;transform:translateY(-50%);background:rgba(10,10,16,0.9);border:1px solid var(--accent3);border-radius:8px;padding:0.4rem 0.8rem;font-size:0.72rem;color:var(--accent3);display:none;z-index:15;font-weight:600;letter-spacing:0.1em;backdrop-filter:blur(8px)}
  #skip-indicator.show{display:block;animation:indicatorPulse 1s infinite}
  @keyframes indicatorPulse{0%,100%{opacity:1}50%{opacity:0.5}}

  /* Loading spinner */
  .loading-spinner{width:40px;height:40px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Responsive */
  @media(max-width:768px){
    #dialog-box{padding:1.1rem;min-height:130px;border-radius:12px}
    #dialog-text{font-size:0.84rem}
    .char-sprite{max-width:55%}
    .collect-options{max-width:95%}
    .title-btn{min-width:200px;padding:0.65rem 2rem}
    #hud{padding:0.6rem}
    .hud-btn{padding:0.35rem 0.5rem;font-size:0.65rem}
  }
</style>
</head>
<body>

<!-- Title Screen -->
<div id="title-screen">
  <div class="title-logo">东京：情谊债务</div>
  <div class="title-sub">TOKYO: DEBT OF THE HEART</div>
  <div class="title-menu">
    <button class="title-btn" onclick="startNewGame()">开始游戏</button>

// ===================== ENGINE FUNCTIONS =====================

function removeDebt(target, grade) {
  G.debts = G.debts.filter(d => !(d.target === target && d.grade === grade));
  updateDebtPanel();
}

function updateDebtPanel() {
  const list = document.getElementById('debt-list');
  if(G.debts.length === 0) {
    list.innerHTML = '<div style="font-size:0.78rem;color:var(--muted);text-align:center;padding:0.5rem;">暂无待催收债务</div>';
    return;
  }
  list.innerHTML = G.debts.map(d => `
    <div class="debt-item">
      <span class="debt-name">${getCharName(d.target)}</span>
      <span class="debt-grade grade-${d.grade.toLowerCase()}">${d.grade}级</span>
    </div>
  `).join('');
}

function getCharName(id) {
  const names = {yuuki:'高柳优希',asuka:'明日芽衣',nana:'加藤奈奈',hamasaki:'滨崎末优',kaoru:'山田熏'};
  return names[id] || id;
}

function updateHUD() {
  document.getElementById('hud-money').textContent = `¥ ${G.money.toLocaleString()}`;
  document.getElementById('hud-date').textContent = `${G.month}月 第${G.week}周`;
  updateDebtPanel();
}

function setBG(key) {
  const el = document.getElementById('bg-layer');
  const path = BG[key];
  el.classList.remove('loaded');
  if(path) {
    const img = new Image();
    img.onload = () => {
      el.style.backgroundImage = `url('${path}')`;
      el.classList.add('loaded');
    };
    img.onerror = () => {
      el.style.backgroundImage = 'none';
      el.style.background = 'var(--bg)';
      el.classList.add('loaded');
    };
    img.src = path;
  } else {
    el.style.backgroundImage = 'none';
    el.style.background = 'var(--bg)';
    el.classList.add('loaded');
  }
}

function setChars(chars) {
  const layer = document.getElementById('char-layer');
  layer.innerHTML = '';
  chars.forEach((c, idx) => {
    const wrap = document.createElement('div');
    wrap.className = `char-wrap ${c.pos || 'center'}`;
    wrap.dataset.id = c.id;

    const img = document.createElement('img');
    img.className = 'char-sprite';
    img.src = CHAR[c.id] || '';
    img.alt = c.id;

    const shadow = document.createElement('div');
    shadow.className = 'char-shadow';

    wrap.appendChild(img);
    wrap.appendChild(shadow);

    img.onerror = function() {
      wrap.style.display = 'none';
      const div = document.createElement('div');
      div.style.cssText = `position:absolute;bottom:5%;${c.pos==='left'?'left:10%':c.pos==='right'?'right:10%':'left:50%;transform:translateX(-50%)'};font-size:4rem;font-weight:700;opacity:0.15;text-shadow:0 0 30px rgba(255,107,138,0.3)`;
      const names = {yuuki:'希',asuka:'衣',nana:'奈',hamasaki:'末',kaoru:'熏',takayanagi:'城',takasugi:'介'};
      div.textContent = names[c.id] || '?';
      div.style.color = 'var(--accent)';
      layer.appendChild(div);
    };
    img.onload = function() {
      setTimeout(() => wrap.classList.add('show'), idx * 80);
    };
    layer.appendChild(wrap);
  });
  // Apply focus/dim states
  const total = chars.length;
  const wraps = layer.querySelectorAll('.char-wrap');
  wraps.forEach(w => {
    if(total > 1) {
      w.classList.add('dim');
    } else {
      w.classList.add('focus');
    }
  });
  if(total > 1 && chars[0]) {
    const first = layer.querySelector(`.char-wrap[data-id="${chars[0].id}"]`);
    if(first) { first.classList.remove('dim'); first.classList.add('focus'); }
  }
}

function typeText(text, callback) {
  const el = document.getElementById('dialog-text');
  el.innerHTML = '';
  G.isTyping = true;
  G.currentText = text;
  G.charIndex = 0;

  function typeNext() {
    if(G.charIndex < G.currentText.length) {
      const char = G.currentText[G.charIndex];
      if(char === '\n') {
        el.innerHTML += '<br>';
      } else {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char;
        span.style.animationDelay = '0s';
        el.appendChild(span);
      }
      G.charIndex++;
      G.typingTimer = setTimeout(typeNext, G.textSpeed);
    } else {
      G.isTyping = false;
      if(callback) callback();
    }
  }
  typeNext();
}

function showText(speaker, text) {
  const nameEl = document.getElementById('speaker-name');
  const colors = {
    '星野纯': 'var(--ink)',
    '星野纯（内心）': 'var(--muted)',
    '高柳优希': 'var(--accent)',
    '明日芽衣': 'var(--accent2)',
    '加藤奈奈': 'var(--accent4)',
    '滨崎末优': '#ff8c42',
    '山田熏': 'var(--accent3)',
    '高柳城': '#ff4444',
    '高崎佑介': '#ff6666'
  };
  nameEl.textContent = speaker;
  nameEl.style.color = colors[speaker] || 'var(--ink)';
  typeText(text);
}

function showChoices(choices) {
  const area = document.getElementById('choices-area');
  area.innerHTML = '';
  area.classList.add('show');
  document.getElementById('dialog-box').style.pointerEvents = 'none';

  choices.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'choice-btn' + (c.locked ? ' locked' : '') + (c.highlight ? ' style="border-color:var(--accent);color:var(--accent)"' : '');
    btn.innerHTML = c.text + (c.req ? `<div class="choice-req">${c.req}</div>` : '');
    if(!c.locked) {
      btn.onclick = (e) => {
        e.stopPropagation();
        area.classList.remove('show');
        document.getElementById('dialog-box').style.pointerEvents = 'auto';
        if(c.effect) c.effect();
        if(c.next === '_title') { backToTitle(); return; }
        if(c.next === '_save') { openSave(); return; }
        goToNode(c.next);
      };
    }
    area.appendChild(btn);
  });
}

function showNotify(title, body) {
  const el = document.getElementById('sys-notify');
  document.getElementById('notify-title').textContent = title;
  document.getElementById('notify-body').innerHTML = body;
  el.classList.add('show');
}

function hideNotify() {
  document.getElementById('sys-notify').classList.remove('show');
}

function showCollect(title, options) {
  const overlay = document.getElementById('collect-overlay');
  document.getElementById('collect-title').textContent = title;
  const optArea = document.getElementById('collect-options');
  optArea.innerHTML = '';
  options.forEach(o => {
    const div = document.createElement('div');
    div.className = 'collect-opt' + (o.highlight ? ' style="border-color:var(--accent)"' : '');
    div.innerHTML = `<div class="collect-opt-name">${o.name}</div><div class="collect-opt-desc">${o.desc}</div><div class="collect-opt-reward">${o.reward}</div>`;
    div.onclick = () => {
      overlay.classList.remove('show');
      goToNode(o.next);
    };
    optArea.appendChild(div);
  });
  overlay.classList.add('show');
}

function showChapter(label, name) {
  const el = document.getElementById('chapter-title');
  document.getElementById('chapter-label').textContent = label;
  document.getElementById('chapter-name').textContent = name;
  el.classList.remove('show');
  void el.offsetWidth; // reflow
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}

function goToNode(nodeId) {
  G.currentNode = nodeId;
  const node = SCRIPT[nodeId];
  if(!node) { console.error('Node not found:', nodeId); return; }

  // Apply effects
  if(node.effect) node.effect();

  // Chapter change detection
  if(node.chapter && node.chapter !== G.chapter) {
    G.chapter = node.chapter;
    showChapter(node.chapterLabel || 'CHAPTER', node.chapter);
  }

  // Set BG
  if(node.bg) setBG(node.bg);

  // Set characters
  if(node.chars !== undefined) setChars(node.chars);

  // Update HUD
  updateHUD();

  // Handle different node types
  if(node.type === 'choice') {
    showText(node.speaker, node.text);
    setTimeout(() => showChoices(node.choices), G.textSpeed * node.text.length + 500);
  } else if(node.type === 'notify') {
    showNotify(node.notifyTitle, node.notifyBody);
    // Click to dismiss
    document.getElementById('sys-notify').onclick = () => {
      hideNotify();
      goToNode(node.next);
    };
  } else if(node.type === 'collect') {
    if(node.text) {
      showText(node.speaker, node.text);
      setTimeout(() => showCollect(node.collectTitle, node.collectOptions), G.textSpeed * node.text.length + 500);
    } else {
      document.getElementById('speaker-name').textContent = '';
      document.getElementById('dialog-text').innerHTML = '';
      showCollect(node.collectTitle, node.collectOptions);
    }
  } else {
    showText(node.speaker, node.text);
  }
}

function advanceDialog() {
  if(G.isTyping) {
    // Skip typing animation, show full text
    clearTimeout(G.typingTimer);
    const el = document.getElementById('dialog-text');
    el.innerHTML = G.currentText.replace(/\n/g, '<br>');
    G.isTyping = false;
    return;
  }

  const node = SCRIPT[G.currentNode];
  if(!node || !node.next) return;

  if(node.type === 'notify') return; // handled by click on notify
  if(node.type === 'choice') return; // choices handle navigation
  if(node.type === 'collect') return;

  goToNode(node.next);
}

// ===================== AUTO / SKIP =====================
let autoTimer = null;
function toggleAuto() {
  G.autoMode = !G.autoMode;
  G.skipMode = false;
  document.getElementById('auto-indicator').classList.toggle('show', G.autoMode);
  document.getElementById('skip-indicator').classList.remove('show');
  document.getElementById('btn-auto').classList.toggle('active', G.autoMode);
  document.getElementById('btn-skip').classList.remove('active');
  if(G.autoMode) startAuto();
  else stopAuto();
}

function startAuto() {
  stopAuto();
  autoTimer = setInterval(() => {
    if(!G.isTyping && SCRIPT[G.currentNode] && SCRIPT[G.currentNode].next && SCRIPT[G.currentNode].type === 'normal') {
      advanceDialog();
    }
  }, 2000);
}

function stopAuto() {
  if(autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

function toggleSkip() {
  G.skipMode = !G.skipMode;
  G.autoMode = false;
  stopAuto();
  document.getElementById('skip-indicator').classList.toggle('show', G.skipMode);
  document.getElementById('auto-indicator').classList.remove('show');
  document.getElementById('btn-skip').classList.toggle('active', G.skipMode);
  document.getElementById('btn-auto').classList.remove('active');
  if(G.skipMode) startSkip();
  else stopSkip();
}

let skipTimer = null;
function startSkip() {
  stopSkip();
  skipTimer = setInterval(() => {
    if(SCRIPT[G.currentNode] && SCRIPT[G.currentNode].next && SCRIPT[G.currentNode].type !== 'choice' && SCRIPT[G.currentNode].type !== 'collect') {
      if(G.isTyping) {
        clearTimeout(G.typingTimer);
        const el = document.getElementById('dialog-text');
        el.innerHTML = G.currentText.replace(/\n/g, '<br>');
        G.isTyping = false;
      } else {
        advanceDialog();
      }
    }
  }, 100);
}

function stopSkip() {
  if(skipTimer) { clearInterval(skipTimer); skipTimer = null; }
}

// ===================== DEBT PANEL =====================
function toggleDebtPanel() {
  document.getElementById('debt-panel').classList.toggle('show');
}

// ===================== SAVE / LOAD =====================
function openSave() {
  const modal = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  let html = '<div class="modal-title">💾 存档</div>';
  for(let i = 1; i <= 8; i++) {
    const save = G.saveSlots['slot_'+i];
    if(save) {
      html += `<div class="save-slot" onclick="saveGame(${i})">
        <div class="save-slot-info">存档 ${i} — ${save.chapter}</div>
        <div class="save-slot-detail">${save.date} | ¥${save.money.toLocaleString()} | ${save.time}</div>
      </div>`;
    } else {
      html += `<div class="save-slot empty" onclick="saveGame(${i})">存档 ${i} — 空</div>`;
    }
  }
  html += '<button class="modal-close" onclick="closeModal()">关闭</button>';
  box.innerHTML = html;
  modal.classList.add('show');
}

function openLoad() {
  const modal = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  let html = '<div class="modal-title">📂 读档</div>';
  let hasSave = false;
  for(let i = 1; i <= 8; i++) {
    const save = G.saveSlots['slot_'+i];
    if(save) {
      hasSave = true;
      html += `<div class="save-slot" onclick="loadGame(${i})">
        <div class="save-slot-info">存档 ${i} — ${save.chapter}</div>
        <div class="save-slot-detail">${save.date} | ¥${save.money.toLocaleString()} | ${save.time}</div>
      </div>`;
    }
  }
  if(!hasSave) html += '<div style="color:var(--muted);text-align:center;padding:1rem;">暂无存档</div>';
  html += '<button class="modal-close" onclick="closeModal()">关闭</button>';
  box.innerHTML = html;
  modal.classList.add('show');
}

function saveGame(slot) {
  const now = new Date();
  G.saveSlots['slot_'+slot] = {
    money: G.money,
    day: G.day,
    week: G.week,
    month: G.month,
    chapter: G.chapter,
    debts: [...G.debts],
    affection: {...G.affection},
    flags: {...G.flags},
    currentNode: G.currentNode,
    date: `${now.getMonth()+1}/${now.getDate()}`,
    time: `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`
  };
  localStorage.setItem('tokyo_debt_saves', JSON.stringify(G.saveSlots));
  closeModal();
  // Flash effect
  const notify = document.getElementById('sys-notify');
  document.getElementById('notify-title').textContent = '💾 存档成功';
  document.getElementById('notify-body').textContent = `已保存到存档 ${slot}`;
  notify.classList.add('show');
  setTimeout(() => notify.classList.remove('show'), 1500);
}

function loadGame(slot) {
  const save = G.saveSlots['slot_'+slot];
  if(!save) return;
  Object.assign(G, {
    money: save.money,
    day: save.day,
    week: save.week,
    month: save.month,
    chapter: save.chapter,
    debts: save.debts,
    affection: save.affection,
    flags: save.flags,
    currentNode: save.currentNode
  });
  closeModal();
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.add('active');
  document.getElementById('hud').classList.add('show');
  goToNode(G.currentNode);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// ===================== CONFIG =====================
function openConfig() {
  const modal = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  box.innerHTML = `
    <div class="modal-title">⚙️ 设置</div>
    <div class="config-row">
      <span>文字速度</span>
      <input type="range" class="config-slider" min="10" max="80" value="${G.textSpeed}" oninput="G.textSpeed=parseInt(this.value)">
    </div>
    <div class="config-row">
      <span>自动播放间隔</span>
      <span style="color:var(--muted)">2秒</span>
    </div>
    <button class="modal-close" onclick="closeModal()">关闭</button>
  `;
  modal.classList.add('show');
}

// ===================== TITLE =====================
function startNewGame() {
  Object.assign(G, {
    money: 0, day: 1, week: 1, month: 4, chapter: '序章',
    debts: [], affection: {yuuki:0,asuka:0,nana:0,hamasaki:0,kaoru:0},
    flags: {}, currentNode: null, autoMode: false, skipMode: false
  });
  stopAuto(); stopSkip();
  document.getElementById('auto-indicator').classList.remove('show');
  document.getElementById('skip-indicator').classList.remove('show');
  document.getElementById('btn-auto').classList.remove('active');
  document.getElementById('btn-skip').classList.remove('active');
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.add('active');
  document.getElementById('hud').classList.add('show');
  goToNode('prologue_1');
}

function backToTitle() {
  stopAuto(); stopSkip();
  G.autoMode = false; G.skipMode = false;
  document.getElementById('auto-indicator').classList.remove('show');
  document.getElementById('skip-indicator').classList.remove('show');
  document.getElementById('btn-auto').classList.remove('active');
  document.getElementById('btn-skip').classList.remove('active');
  document.getElementById('game-screen').classList.remove('active');
  document.getElementById('title-screen').classList.remove('hidden');
  document.getElementById('hud').classList.remove('show');
  document.getElementById('debt-panel').classList.remove('show');
  document.getElementById('choices-area').classList.remove('show');
  document.getElementById('bg-layer').classList.remove('loaded');
  document.getElementById('char-layer').innerHTML = '';
  if(Object.keys(G.saveSlots).length > 0) {
    document.getElementById('btn-continue').disabled = false;
  }
}

// ===================== KEYBOARD =====================
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if(document.getElementById('game-screen').classList.contains('active')) {
      advanceDialog();
    }
  }
  if(e.key === 'Escape') {
    if(document.getElementById('modal-overlay').classList.contains('show')) closeModal();
    if(document.getElementById('sys-notify').classList.contains('show')) {
      hideNotify();
      const node = SCRIPT[G.currentNode];
      if(node && node.next) goToNode(node.next);
    }
    if(document.getElementById('collect-overlay').classList.contains('show')) {
      document.getElementById('collect-overlay').classList.remove('show');
    }
  }
  if(e.key === 'a' || e.key === 'A') toggleAuto();
  if(e.key === 's' || e.key === 'S') toggleSkip();
  if(e.key === 'd' || e.key === 'D') toggleDebtPanel();
});
</script>
