<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄习惯引擎 · PomoHabit AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    :root {
      --moss: #3E5F36;
      --leaf: #7FB069;
      --light-leaf: #A8D08D;
      --terracotta: #D97D54;
      --cream: #FDFCF8;
      --ink: #2B2B2B;
      --muted: #8A8A8A;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Noto Sans SC', 'WenQuanYi Micro Hei', sans-serif;
      background: var(--cream);
      color: var(--ink);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* 背景氛围：漂浮光斑 + 纸质噪点 */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 10% 20%, rgba(127, 176, 105, 0.12) 0%, transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(217, 125, 84, 0.10) 0%, transparent 35%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--light-leaf);
      opacity: 0.35;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) scale(0.8); opacity: 0; }
      10% { opacity: 0.35; }
      90% { opacity: 0.35; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    header {
      position: relative;
      z-index: 1;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1100px;
      margin: 0 auto;
    }

    .logo {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1.6rem;
      color: var(--moss);
    }

    .badge {
      background: rgba(127, 176, 105, 0.18);
      color: var(--moss);
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .hero {
      text-align: center;
      margin: 1rem 0 3rem;
    }

    .hero h1 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      margin: 0;
      color: var(--moss);
      letter-spacing: 0.04em;
    }

    .hero p {
      font-size: 1.1rem;
      color: var(--muted);
      margin-top: 0.75rem;
      max-width: 640px;
      margin-inline: auto;
      line-height: 1.8;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 860px) {
      .dashboard { grid-template-columns: 1fr; }
    }

    .card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(127, 176, 105, 0.22);
      border-radius: 24px;
      padding: 1.75rem;
      box-shadow: 0 20px 50px rgba(62, 95, 54, 0.08);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--leaf), var(--terracotta));
    }

    .timer-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-label {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .timer-circle-wrap {
      width: 260px;
      height: 260px;
      position: relative;
      margin: 0.5rem 0;
    }

    .timer-circle-wrap svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-circle-wrap circle {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .timer-bg { stroke: rgba(127, 176, 105, 0.18); }

    .timer-progress {
      stroke: var(--leaf);
      stroke-dasharray: 754;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-time {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 4rem;
      color: var(--moss);
      line-height: 1;
    }

    .timer-mode {
      font-size: 0.9rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .current-task {
      font-size: 0.95rem;
      color: var(--moss);
      margin-top: 0.75rem;
      min-height: 1.4em;
      font-weight: 500;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .btn-primary {
      background: var(--moss);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(62, 95, 54, 0.25);
    }

    .btn-secondary {
      background: #fff;
      color: var(--moss);
      border: 1px solid rgba(62, 95, 54, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(127, 176, 105, 0.08);
    }

    .suggestions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .suggestion {
      background: rgba(217, 125, 84, 0.1);
      color: var(--terracotta);
      border: 1px solid rgba(217, 125, 84, 0.25);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .suggestion:hover {
      background: rgba(217, 125, 84, 0.2);
    }

    .garden-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 360px;
    }

    #tree {
      width: 220px;
      height: 260px;
      overflow: visible;
      transform-origin: bottom center;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .tree-trunk {
      stroke: var(--terracotta);
      stroke-width: 8;
      stroke-linecap: round;
      fill: none;
    }

    .tree-canopy {
      fill: var(--leaf);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center;
    }

    .tree-leaf {
      fill: var(--light-leaf);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .garden-info {
      text-align: center;
      margin-top: 1rem;
    }

    .garden-title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1.4rem;
      color: var(--moss);
      margin-bottom: 0.25rem;
    }

    .garden-sub {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .ai-panel { margin-bottom: 1.5rem; }

    .ai-content {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .ai-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--leaf), var(--terracotta));
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      flex-shrink: 0;
      font-size: 0.85rem;
    }

    .ai-bubble {
      background: #fff;
      border: 1px solid rgba(127, 176, 105, 0.25);
      border-radius: 20px;
      border-top-left-radius: 4px;
      padding: 1rem 1.25rem;
      box-shadow: 0 8px 24px rgba(62, 95, 54, 0.06);
      max-width: 760px;
    }

    .ai-bubble h3 {
      margin: 0 0 0.35rem;
      font-size: 1.05rem;
      color: var(--moss);
    }

    .ai-bubble p {
      margin: 0;
      line-height: 1.7;
      color: var(--ink);
    }

    .task-section { margin-bottom: 1.5rem; }

    .task-input {
      width: 100%;
      padding: 1rem 1.25rem;
      border-radius: 16px;
      border: 1px solid rgba(62, 95, 54, 0.2);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      background: #fff;
      color: var(--ink);
    }

    .task-input:focus {
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(127, 176, 105, 0.15);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 600px) {
      .stats { grid-template-columns: 1fr; }
    }

    .stat-card {
      background: #fff;
      border-radius: 20px;
      padding: 1.25rem;
      text-align: center;
      border: 1px solid rgba(127, 176, 105, 0.15);
    }

    .stat-value {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 2.4rem;
      color: var(--moss);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .celebration {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: none;
    }

    .celebration.active { display: block; }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: pop 0.9s ease-out forwards;
    }

    @keyframes pop {
      0% { transform: scale(0) translateY(0); opacity: 1; }
      100% { transform: scale(1.5) translateY(-120px); opacity: 0; }
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-particles" id="particles"></div>

  <header>
    <div class="logo">番茄习惯引擎</div>
    <span class="badge">AI 自适应番茄钟</span>
  </header>

  <main class="container">
    <section class="hero">
      <h1>种下一颗番茄，收获一片森林</h1>
      <p>不是冷冰冰的倒计时，而是懂你节律的 AI 伙伴。每一次专注都会让你的「习惯花园」生长，AI 会根据你的表现推荐最佳专注时长与任务节奏。</p>
    </section>

    <section class="task-section">
      <input type="text" class="task-input" id="taskInput" placeholder="今天想专注完成什么？例如：写完论文引言、背 50 个单词…" autocomplete="off">
    </section>

    <section class="dashboard">
      <div class="card timer-card">
        <div class="timer-label">AI 建议当前模式</div>
        <div class="timer-circle-wrap">
          <svg viewBox="0 0 260 260">
            <circle class="timer-bg" cx="130" cy="130" r="120"></circle>
            <circle class="timer-progress" id="progressCircle" cx="130" cy="130" r="120"></circle>
          </svg>
          <div class="timer-text">
            <div class="timer-time" id="timeDisplay">25:00</div>
            <div class="timer-mode" id="modeLabel">标准专注 · 25 分钟</div>
          </div>
        </div>
        <div class="current-task" id="currentTask">先输入一个专注目标，再开始吧</div>
        <div class="controls">
          <button class="btn-primary" id="startBtn">开始专注</button>
          <button class="btn-secondary" id="resetBtn">重置</button>
        </div>
        <div class="suggestions">
          <button class="suggestion" data-min="15" data-label="轻量冲刺 · 15 分钟">🍃 15 分钟轻冲刺</button>
          <button class="suggestion" data-min="25" data-label="标准专注 · 25 分钟">🍅 25 分钟番茄</button>
          <button class="suggestion" data-min="45" data-label="深度工作 · 45 分钟">🌳 45 分钟深度</button>
        </div>
      </div>

      <div class="card garden-card">
        <svg id="tree" viewBox="0 0 200 260">
          <path class="tree-trunk" d="M100 260 Q100 190 100 150"></path>
          <g class="tree-canopy">
            <circle cx="100" cy="130" r="48"></circle>
            <circle cx="66" cy="108" r="36"></circle>
            <circle cx="134" cy="108" r="36"></circle>
            <circle cx="100" cy="82" r="40"></circle>
          </g>
          <g class="tree-leaves">
            <circle class="tree-leaf" cx="55" cy="85" r="8"></circle>
            <circle class="tree-leaf" cx="145" cy="80" r="8"></circle>
            <circle class="tree-leaf" cx="80" cy="55" r="7"></circle>
            <circle class="tree-leaf" cx="120" cy="58" r="7"></circle>
            <circle class="tree-leaf" cx="100" cy="45" r="9"></circle>
            <circle class="tree-leaf" cx="60" cy="120" r="7"></circle>
            <circle class="tree-leaf" cx="140" cy="120" r="7"></circle>
            <circle class="tree-leaf" cx="100" cy="100" r="6"></circle>
          </g>
        </svg>
        <div class="garden-info">
          <div class="garden-title">你的专注花园</div>
          <div class="garden-sub" id="gardenSub">完成 0 颗番茄，幼苗刚刚发芽</div>
        </div>
      </div>
    </section>

    <section class="card ai-panel">
      <div class="ai-content">
        <div class="ai-avatar">AI</div>
        <div class="ai-bubble">
          <h3 id="aiTitle">正在分析你的专注习惯…</h3>
          <p id="aiText">开始一次专注，AI 就会记录你的节奏，并给出个性化的时段建议。</p>
        </div>
      </div>
    </section>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-value" id="sessionCount">0</div>
        <div class="stat-label">今日番茄数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="todayMinutes">0</div>
        <div class="stat-label">今日专注分钟</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="streakCount">1</div>
        <div class="stat-label">连续坚持天数</div>
      </div>
    </section>
  </main>

  <div class="celebration" id="celebration"></div>

  <footer>
    PomoHabit AI 创意 Demo · 由 TRAE Work 生成 · 仅供展示
  </footer>

  <script>
    const DEFAULT_FOCUS = 25 * 60;
    let totalTime = DEFAULT_FOCUS;
    let timeLeft = DEFAULT_FOCUS;
    let timer = null;
    let isRunning = false;
    let sessions = 0;
    let todayMinutes = 0;
    let streak = 1;
    let currentTask = '';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const tips = [
      { title: '发现你的晨型节律', text: '过去几天你在 9:00–11:00 的专注完成率最高，建议把高难任务放在上午。' },
      { title: '减少切换损耗', text: '你平均每 7 分钟切换一次注意力，开启「深度模式」后预计每日可多专注 30 分钟以上。' },
      { title: '休息也是生产力', text: '完成 4 个番茄后，AI 建议你进行 15 分钟散步，让大脑更好地整合信息。' },
      { title: '任务难度匹配', text: '复杂任务更适合 45 分钟长时段，轻松事务用 15 分钟快速清空。' },
      { title: '建立稳定锚点', text: '每天在固定时间开始第一个番茄，能显著提升习惯留存率。' }
    ];

    const STORAGE_KEY = 'pomohabit_demo_v1';

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function updateDisplay() {
      document.getElementById('timeDisplay').textContent = formatTime(timeLeft);
      const circumference = 2 * Math.PI * 120; // ~754
      const offset = circumference * (1 - timeLeft / totalTime);
      document.getElementById('progressCircle').style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (isRunning) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      isRunning = true;
      document.getElementById('startBtn').textContent = '暂停';
      timer = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          completeSession();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      document.getElementById('startBtn').textContent = '开始专注';
      clearInterval(timer);
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = totalTime;
      updateDisplay();
    }

    function completeSession() {
      pauseTimer();
      sessions++;
      todayMinutes += Math.floor(totalTime / 60);
      growGarden();
      renderStats();
      saveState();
      playChime();
      showCelebration();
      rotateTip();
      timeLeft = totalTime;
      updateDisplay();
    }

    function growGarden() {
      const tree = document.getElementById('tree');
      const scale = 1 + Math.min(sessions, 12) * 0.05;
      tree.style.transform = `scale(${scale})`;

      const leaves = document.querySelectorAll('.tree-leaf');
      const visible = Math.min(sessions, leaves.length);
      for (let i = 0; i < visible; i++) {
        leaves[i].style.opacity = '1';
      }

      const sub = document.getElementById('gardenSub');
      if (sessions === 0) {
        sub.textContent = '完成 0 颗番茄，幼苗刚刚发芽';
      } else if (sessions < 4) {
        sub.textContent = `完成 ${sessions} 颗番茄，小苗正在舒展枝叶`;
      } else if (sessions < 8) {
        sub.textContent = `完成 ${sessions} 颗番茄，小树日渐茁壮`;
      } else {
        sub.textContent = `完成 ${sessions} 颗番茄，你的专注森林已枝繁叶茂`;
      }
    }

    function renderStats() {
      document.getElementById('sessionCount').textContent = sessions;
      document.getElementById('todayMinutes').textContent = todayMinutes;
      document.getElementById('streakCount').textContent = streak;
    }

    function applySuggestion(min, label) {
      totalTime = min * 60;
      timeLeft = totalTime;
      document.getElementById('modeLabel').textContent = label;
      updateDisplay();
      pauseTimer();
    }

    function rotateTip() {
      const tip = tips[sessions % tips.length];
      document.getElementById('aiTitle').textContent = tip.title;
      document.getElementById('aiText').textContent = tip.text;
    }

    function playChime() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1046.5, audioCtx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
      osc.start();
      osc.stop(audioCtx.currentTime + 1);
    }

    function showCelebration() {
      const cel = document.getElementById('celebration');
      cel.classList.add('active');
      for (let i = 0; i < 30; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.top = Math.random() * 40 + 50 + 'vh';
        c.style.backgroundColor = ['#7FB069', '#D97D54', '#A8D08D'][Math.floor(Math.random() * 3)];
        c.style.animationDelay = Math.random() * 0.3 + 's';
        cel.appendChild(c);
      }
      setTimeout(() => {
        cel.classList.remove('active');
        cel.innerHTML = '';
      }, 1100);
    }

    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 8 + 4;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = Math.random() * 10 + 10 + 's';
        p.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(p);
      }
    }

    function saveState() {
      const data = {
        sessions,
        todayMinutes,
        streak,
        lastDate: new Date().toDateString()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadState() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        const today = new Date().toDateString();
        if (data.lastDate !== today) {
          sessions = 0;
          todayMinutes = 0;
          streak = (data.streak || 1) + 1;
        } else {
          sessions = data.sessions || 0;
          todayMinutes = data.todayMinutes || 0;
          streak = data.streak || 1;
        }
      } catch (e) {
        // ignore corrupt storage
      }
    }

    document.getElementById('startBtn').addEventListener('click', toggleTimer);
    document.getElementById('resetBtn').addEventListener('click', resetTimer);
    document.getElementById('taskInput').addEventListener('input', (e) => {
      currentTask = e.target.value.trim();
      const display = document.getElementById('currentTask');
      display.textContent = currentTask ? `当前任务：${currentTask}` : '先输入一个专注目标，再开始吧';
    });

    document.querySelectorAll('.suggestion').forEach(btn => {
      btn.addEventListener('click', () => {
        const min = parseInt(btn.dataset.min, 10);
        const label = btn.dataset.label;
        applySuggestion(min, label);
      });
    });

    loadState();
    createParticles();
    rotateTip();
    growGarden();
    renderStats();
    updateDisplay();
  </script>
</body>
</html>
