<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>动物乐园学数学</title>
<style>
:root {
  --bg-primary: #FFF8E7;
  --bg-secondary: #E8F5E9;
  --color-accent: #FF6B6B;
  --color-blue: #4FC3F7;
  --color-green: #81C784;
  --color-yellow: #FFD54F;
  --color-orange: #FFB74D;
  --color-purple: #CE93D8;
  --color-pink: #F48FB1;
  --color-red: #EF5350;
  --text-primary: #5D4037;
  --text-secondary: #8D6E63;
  --shadow: 0 4px 15px rgba(0,0,0,0.1);
  --shadow-hover: 0 8px 25px rgba(0,0,0,0.15);
  --radius: 20px;
  --radius-sm: 12px;
  --font-size-title: 2.2rem;
  --font-size-subtitle: 1.4rem;
  --font-size-btn: 1.3rem;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}

/* 页面容器 */
.page{display:none;min-height:100vh;position:relative}
.page.active{display:flex;flex-direction:column}

/* ===== 首页 ===== */
#home-page{background:linear-gradient(180deg,#87CEEB 0%,#E0F7FA 30%,#FFF8E7 60%,#C8E6C9 100%);align-items:center;padding-bottom:30px}
.sky-bg{position:fixed;top:0;left:0;width:100%;height:40vh;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:50%;opacity:.85;animation:cloudFloat linear infinite}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud-1{width:120px;height:50px;top:8%;animation-duration:35s}
.cloud-1::before{width:60px;height:60px;top:-30px;left:20px}
.cloud-1::after{width:80px;height:50px;top:-20px;left:50px}
.cloud-2{width:90px;height:40px;top:15%;animation-duration:45s;animation-delay:-15s}
.cloud-2::before{width:50px;height:50px;top:-25px;left:15px}
.cloud-2::after{width:60px;height:40px;top:-15px;left:35px}
.cloud-3{width:140px;height:55px;top:5%;animation-duration:50s;animation-delay:-25s}
.cloud-3::before{width:70px;height:65px;top:-35px;left:25px}
.cloud-3::after{width:90px;height:55px;top:-25px;left:55px}
@keyframes cloudFloat{0%{left:-200px}100%{left:110vw}}

.rainbow{position:fixed;top:5%;right:-5%;width:300px;height:150px;border-radius:150px 150px 0 0;background:conic-gradient(from 180deg at 50% 100%,rgba(255,0,0,.15),rgba(255,165,0,.15),rgba(255,255,0,.15),rgba(0,128,0,.15),rgba(0,0,255,.15),rgba(75,0,130,.15),rgba(238,130,238,.15),transparent 50%);pointer-events:none;z-index:0;animation:rainbowPulse 4s ease-in-out infinite}
@keyframes rainbowPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

.home-header{position:relative;z-index:1;text-align:center;padding:20px 20px 10px;width:100%}
.star-counter{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border-radius:30px;padding:8px 20px;font-size:1.3rem;font-weight:700;color:#F57F17;box-shadow:var(--shadow);margin-bottom:10px}
.star-counter .star-icon{font-size:1.5rem;animation:starTwinkle 2s ease-in-out infinite}
@keyframes starTwinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.2) rotate(15deg)}}
.home-title{font-size:var(--font-size-title);font-weight:900;color:var(--color-accent);text-shadow:2px 2px 0 rgba(255,107,107,.2);margin:10px 0}
.home-subtitle{font-size:var(--font-size-subtitle);color:var(--text-secondary);margin-bottom:15px}

.welcome-animals{position:relative;z-index:1;display:flex;justify-content:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}
.welcome-animals svg{width:80px;height:80px;animation:animalBounce 2s ease-in-out infinite}
.welcome-animals svg:nth-child(2){animation-delay:.3s}
.welcome-animals svg:nth-child(3){animation-delay:.6s}
.welcome-animals svg:nth-child(4){animation-delay:.9s}
@keyframes animalBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.modules-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;padding:0 15px;width:100%;max-width:700px}
.module-card{background:#fff;border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;gap:8px}
.module-card:hover,.module-card:active{transform:translateY(-5px) scale(1.03);box-shadow:var(--shadow-hover)}
.module-card .module-icon{width:72px;height:72px}
.module-card .module-name{font-size:1.05rem;font-weight:700;color:var(--text-primary)}
.module-card .module-age{font-size:.8rem;color:#fff;border-radius:10px;padding:2px 10px;font-weight:600}
.module-card:nth-child(1){border-bottom:4px solid var(--color-red)}
.module-card:nth-child(1) .module-age{background:var(--color-red)}
.module-card:nth-child(2){border-bottom:4px solid var(--color-blue)}
.module-card:nth-child(2) .module-age{background:var(--color-blue)}
.module-card:nth-child(3){border-bottom:4px solid var(--color-green)}
.module-card:nth-child(3) .module-age{background:var(--color-green)}
.module-card:nth-child(4){border-bottom:4px solid var(--color-orange)}
.module-card:nth-child(4) .module-age{background:var(--color-orange)}
.module-card:nth-child(5){border-bottom:4px solid var(--color-purple)}
.module-card:nth-child(5) .module-age{background:var(--color-purple)}
.module-card:nth-child(6){border-bottom:4px solid var(--color-yellow)}
.module-card:nth-child(6) .module-age{background:#F9A825;color:#fff}
.module-card:nth-child(7){border-bottom:4px solid var(--color-pink)}
.module-card:nth-child(7) .module-age{background:var(--color-pink)}

/* ===== 游戏页面通用 ===== */
.game-page{background:linear-gradient(180deg,#E3F2FD 0%,#FFF8E7 100%)}
.game-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.game-back{background:0 0;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-primary);padding:5px 10px;border-radius:var(--radius-sm);transition:background .2s}
.game-back:hover{background:rgba(0,0,0,.05)}
.game-title{font-size:1.2rem;font-weight:700}
.game-stars{display:flex;align-items:center;gap:4px;font-size:1.1rem;color:#F57F17;font-weight:700}
.game-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:20px}

.game-question{font-size:1.5rem;font-weight:700;text-align:center;color:var(--text-primary);padding:10px 20px;background:rgba(255,255,255,.8);border-radius:var(--radius);box-shadow:var(--shadow)}
.game-display{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:15px;min-height:100px}
.game-options{display:flex;gap:15px;flex-wrap:wrap;justify-content:center}
.option-btn{font-size:var(--font-size-btn);font-weight:700;padding:15px 30px;border:none;border-radius:var(--radius);cursor:pointer;color:#fff;min-width:70px;box-shadow:var(--shadow);transition:transform .15s;line-height:1.3}
.option-btn:active{transform:scale(.95)}
.option-btn:nth-child(1){background:var(--color-blue)}
.option-btn:nth-child(2){background:var(--color-green)}
.option-btn:nth-child(3){background:var(--color-orange)}

.game-progress{display:flex;gap:6px;justify-content:center;margin-top:10px}
.progress-dot{width:12px;height:12px;border-radius:50%;background:#E0E0E0;transition:background .3s}
.progress-dot.done{background:var(--color-green)}
.progress-dot.current{background:var(--color-accent);transform:scale(1.3)}

.game-feedback{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:100}
.feedback-text{font-size:2.5rem;font-weight:900;color:var(--color-green);animation:feedbackPop 1s ease-out forwards;text-shadow:2px 2px 0 rgba(0,0,0,.1)}
@keyframes feedbackPop{0%{transform:scale(0);opacity:0}30%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0}}
.feedback-text.retry{color:var(--color-orange);font-size:1.8rem}

/* 英文标签 */
.en-label{display:inline-block;font-size:.75em;color:var(--color-blue);font-weight:600;margin-left:4px;background:rgba(79,195,247,.12);padding:1px 6px;border-radius:8px;vertical-align:middle;letter-spacing:.5px}

/* 水果/动物名称标签（带英文） */
.name-label{display:flex;flex-direction:column;align-items:center;gap:1px}
.name-label .en-label{margin-left:0;font-size:.7rem;margin-top:1px}

/* 模块1：水果数数 */
.fruit-item{display:flex;flex-direction:column;align-items:center;transition:transform .3s}
.fruit-item svg{width:80px;height:80px}
.fruit-item.bounce{animation:fruitBounce .5s ease}
@keyframes fruitBounce{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(10deg)}60%{transform:scale(.9) rotate(-5deg)}100%{transform:scale(1) rotate(0)}}
.fruit-item.shake{animation:fruitShake .4s ease}
@keyframes fruitShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* 模块2：配对记忆 */
.memory-grid{display:grid;gap:10px;justify-content:center;padding:10px}
.memory-grid.grid-2x4{grid-template-columns:repeat(4,80px)}
.memory-grid.grid-3x4{grid-template-columns:repeat(4,80px)}
.memory-grid.grid-4x4{grid-template-columns:repeat(4,75px)}
.memory-card{width:80px;height:80px;perspective:600px;cursor:pointer}
.memory-grid.grid-4x4 .memory-card{width:75px;height:75px}
.memory-card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.memory-card.flipped .memory-card-inner{transform:rotateY(180deg)}
.memory-card.matched .memory-card-inner{transform:rotateY(180deg)}
.memory-card.matched{animation:matchDance .6s ease}
@keyframes matchDance{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(5deg)}60%{transform:scale(.95) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.memory-card-front,.memory-card-back{position:absolute;width:100%;height:100%;border-radius:var(--radius-sm);backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.memory-card-front{background:linear-gradient(135deg,var(--color-blue),var(--color-purple));box-shadow:var(--shadow)}
.memory-card-front::after{content:'?';font-size:2rem;color:#fff;font-weight:700}
.memory-card-back{background:#fff;transform:rotateY(180deg);box-shadow:var(--shadow)}
.memory-card-back svg{width:65px;height:65px}
.memory-difficulty{display:flex;gap:10px;margin-bottom:15px}
.diff-btn{padding:10px 20px;border:3px solid var(--color-blue);border-radius:var(--radius-sm);background:#fff;font-size:1rem;font-weight:700;cursor:pointer;color:var(--color-blue);transition:all .2s}
.diff-btn.active{background:var(--color-blue);color:#fff}

/* 模块3：大小比较 */
.compare-container{display:flex;align-items:flex-end;justify-content:center;gap:30px;padding:20px}
.compare-item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .3s;padding:15px;border-radius:var(--radius);border:3px solid transparent}
.compare-item:hover{border-color:var(--color-blue);background:rgba(255,255,255,.5)}
.compare-item.grow{animation:growAnim .6s ease}
.compare-item.shrink{animation:shrinkAnim .6s ease}
.compare-item.shake{animation:fruitShake .4s ease}
@keyframes growAnim{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1.1)}}
@keyframes shrinkAnim{0%{transform:scale(1)}50%{transform:scale(.7)}100%{transform:scale(.9)}}

/* 模块4：简单加法 */
.addition-display{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:1.8rem;font-weight:700}
.addition-display svg{width:70px;height:70px}
.addition-op{color:var(--color-accent);font-size:2rem}

/* 模块5：颜色分类 */
.sort-area{width:100%;max-width:500px;position:relative}
.sort-fruits{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;min-height:100px;padding:15px;margin-bottom:20px;background:rgba(255,255,255,.5);border-radius:var(--radius)}
.sort-fruit{cursor:grab;touch-action:none;transition:transform .15s;padding:5px;border-radius:var(--radius-sm)}
.sort-fruit:active{transform:scale(1.15)}
.sort-fruit.dragging{opacity:.4;transform:scale(.9)}
.sort-fruit.placed{display:none}
.sort-baskets{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.sort-basket{width:90px;min-height:90px;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:3px dashed;padding:8px;transition:transform .2s,box-shadow .2s}
.sort-basket.hover{transform:scale(1.08);box-shadow:0 0 15px rgba(0,0,0,.2)}
.sort-basket .basket-label{font-size:.85rem;font-weight:700}
.sort-basket .basket-count{font-size:.9rem}
.sort-basket svg{width:45px;height:45px}

/* 模块6：逻辑排序 */
.sequence-display{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;padding:15px;background:rgba(255,255,255,.8);border-radius:var(--radius)}
.sequence-item svg{width:70px;height:70px}
.sequence-question{width:55px;height:55px;border:3px dashed var(--color-accent);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--color-accent);font-weight:700}
.seq-option-btn{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:var(--font-size-btn);font-weight:700;padding:12px 20px;border:none;border-radius:var(--radius);cursor:pointer;color:#fff;min-width:80px;box-shadow:var(--shadow);transition:transform .15s}
.seq-option-btn:active{transform:scale(.95)}
.seq-option-btn svg{width:60px;height:60px}
.seq-option-btn:nth-child(1){background:var(--color-blue)}
.seq-option-btn:nth-child(2){background:var(--color-green)}
.seq-option-btn:nth-child(3){background:var(--color-orange)}

/* 模块7：减法入门 */
.subtraction-display{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:15px}
.subtraction-animal{transition:all .5s ease}
.subtraction-animal svg{width:75px;height:75px}
.subtraction-animal.run-away{animation:runAway .8s ease forwards}
@keyframes runAway{0%{transform:translateX(0) rotate(0);opacity:1}100%{transform:translateX(150px) rotate(20deg);opacity:0}}
.subtraction-text{font-size:1.3rem;text-align:center;font-weight:700;color:var(--text-secondary);margin-top:5px}

/* 庆祝动画 */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;top:-20px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* 完成弹窗 */
.complete-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:150}
.complete-card{background:#fff;border-radius:var(--radius);padding:30px 40px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);animation:popIn .4s ease}
@keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.complete-card h2{font-size:1.8rem;color:var(--color-accent);margin-bottom:10px}
.complete-card .stars-earned{font-size:2rem;margin:10px 0;animation:starTwinkle 1s ease-in-out infinite}
.complete-card p{font-size:1.1rem;color:var(--text-secondary);margin-bottom:20px}
.complete-card button{padding:12px 30px;font-size:1.2rem;font-weight:700;border:none;border-radius:var(--radius-sm);cursor:pointer;color:#fff;margin:0 5px;transition:transform .15s}
.complete-card button:active{transform:scale(.95)}
.btn-home{background:var(--color-blue)}
.btn-retry{background:var(--color-green)}

/* 拖拽幽灵 */
.drag-ghost{position:fixed;pointer-events:none;z-index:300;transform:scale(1.2);opacity:.85}

/* 响应式 */
@media(max-width:480px){
  :root{--font-size-title:1.6rem;--font-size-subtitle:1.1rem;--font-size-btn:1.1rem}
  .modules-grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 10px}
  .module-card{padding:12px 8px}
  .module-card .module-icon{width:56px;height:56px}
  .module-card .module-name{font-size:.9rem}
  .memory-grid.grid-2x4{grid-template-columns:repeat(4,65px)}
  .memory-grid.grid-3x4{grid-template-columns:repeat(4,65px)}
  .memory-grid.grid-4x4{grid-template-columns:repeat(4,60px)}
  .memory-card{width:65px;height:65px}
  .memory-grid.grid-4x4 .memory-card{width:60px;height:60px}
  .compare-container{gap:15px}
  .option-btn{padding:12px 22px;font-size:1.1rem}
  .fruit-item svg{width:60px;height:60px}
  .addition-display svg{width:55px;height:55px}
  .sort-basket{width:75px;min-height:75px}
  .game-question{font-size:1.2rem;padding:8px 14px}
}
@media(min-width:768px){.modules-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<!-- 首页 -->
<div id="home-page" class="page active">
  <div class="sky-bg">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>
  <div class="rainbow"></div>
  <div class="home-header">
    <div class="star-counter"><span class="star-icon">⭐</span><span id="total-stars">0</span></div>
    <h1 class="home-title">动物乐园学数学</h1>
    <p class="home-subtitle">和动物朋友们一起学数学吧！</p>
  </div>
  <div class="welcome-animals" id="welcome-animals"></div>
  <div class="modules-grid" id="modules-grid"></div>
</div>

<!-- 游戏页面 -->
<div id="game-page" class="page game-page">
  <div class="game-header">
    <button class="game-back" id="btn-back">←</button>
    <span class="game-title" id="game-title"></span>
    <span class="game-stars">⭐ <span id="game-star-count">0</span></span>
  </div>
  <div class="game-body" id="game-body"></div>
</div>

<!-- 弹窗/特效容器 -->
<div id="overlay-container"></div>
<div id="confetti-container" class="confetti-container"></div>
<div id="feedback-container" class="game-feedback"></div>

<script>
/* ==========================================================
   全局状态
   ========================================================== */
const State = {
  stars: parseInt(localStorage.getItem('kidweb_stars') || '0'),
  currentModule: null,
  questionIndex: 0,
  totalQuestions: 5,
  correctCount: 0,
  roundStars: 0,
  locked: false
};

function saveStars() {
  localStorage.setItem('kidweb_stars', State.stars);
  const el = document.getElementById('total-stars');
  if (el) el.textContent = State.stars;
  const gc = document.getElementById('game-star-count');
  if (gc) gc.textContent = State.stars;
}

function addStar(n) {
  n = n || 1;
  State.stars += n;
  State.roundStars += n;
  saveStars();
}

/* ==========================================================
   音效系统 (Web Audio API)
   ========================================================== */
var audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playTone(freq, duration, type, vol) {
  try {
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch(e) {}
}

function sfxCorrect() {
  playTone(523.25, 0.15, 'sine', 0.25);
  setTimeout(function(){ playTone(659.25, 0.15, 'sine', 0.25); }, 120);
  setTimeout(function(){ playTone(783.99, 0.25, 'sine', 0.3); }, 240);
}

function sfxWrong() {
  playTone(330, 0.3, 'triangle', 0.2);
  setTimeout(function(){ playTone(262, 0.4, 'triangle', 0.15); }, 200);
}

function sfxCelebrate() {
  var notes = [523,587,659,698,784,880,988,1047];
  for (var i = 0; i < notes.length; i++) {
    (function(idx){
      setTimeout(function(){ playTone(notes[idx], 0.15, 'sine', 0.2); }, idx * 80);
    })(i);
  }
}

function sfxClick() {
  playTone(880, 0.08, 'sine', 0.15);
}

function sfxFlip() {
  playTone(600, 0.1, 'sine', 0.12);
}

/* ==========================================================
   SVG 图标库
   ========================================================== */

function showPage(id) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function goHome() {
  sfxClick();
  State.currentModule = null;
  State.locked = false;
  cleanupDrag();
  showPage('home-page');
  saveStars();
}

document.getElementById('btn-back').addEventListener('click', goHome);

    {id:'compare', name:'大小比较', enName:'Compare', age:'4-5岁', icon:SVG.bear},

    {id:'sorting', name:'颜色分类', enName:'Sorting', age:'4-5岁', icon:SVG.grape},
    {id:'sequence', name:'逻辑排序', enName:'Pattern', age:'5-6岁', icon:SVG.banana},

function startModule(id) {
  sfxClick();
  State.currentModule = id;
  State.questionIndex = 0;
  State.correctCount = 0;
  State.roundStars = 0;
  State.locked = false;
  showPage('game-page');

  var titles = {
    counting:'水果数数', memory:'动物配对', compare:'大小比较',
    addition:'简单加法', sorting:'颜色分类', sequence:'逻辑排序',
    subtraction:'减法入门'

/* ==========================================================
   反馈与庆祝
   ========================================================== */
function showFeedback(text, isCorrect) {
  var c = document.getElementById('feedback-container');
  c.innerHTML = '<span class="feedback-text ' + (isCorrect ? '' : 'retry') + '">' + text + '</span>';
  setTimeout(function(){ c.innerHTML = ''; }, 1000);
}

function showConfetti() {
  var c = document.getElementById('confetti-container');
  var colors = ['#EF5350','#FFD54F','#66BB6A','#42A5F5','#AB47BC','#FF7043','#F48FB1'];
  var html = '';
  for (var i = 0; i < 60; i++) {
    var left = Math.random() * 100;
    var dur = 1.5 + Math.random() * 2;
    var delay = Math.random() * 0.8;
    var size = 6 + Math.random() * 8;
    var color = colors[Math.floor(Math.random() * colors.length)];
    var shape = Math.random() > 0.5 ? '50%' : '2px';
    html += '<div class="confetti-piece" style="left:' + left + '%;width:' + size + 'px;height:' + size + 'px;background:' + color + ';border-radius:' + shape + ';animation-duration:' + dur + 's;animation-delay:' + delay + 's;"></div>';
  }
  c.innerHTML = html;
  setTimeout(function(){ c.innerHTML = ''; }, 4000);
}

function showComplete(extraStars) {
  extraStars = extraStars || 3;
  addStar(extraStars);
  sfxCelebrate();
  showConfetti();

  var starStr = '';
  for (var i = 0; i < extraStars; i++) starStr += '⭐';

  var c = document.getElementById('overlay-container');
  c.innerHTML =
    '<div class="complete-overlay">' +
      '<div class="complete-card">' +
        '<h2>太棒了！🎉</h2>' +
        '<div class="stars-earned">' + starStr + '</div>' +
        '<p>答对了 ' + State.correctCount + '/' + State.totalQuestions + ' 题，获得 ' + extraStars + ' 颗星星！</p>' +
        '<button class="btn-home" id="btn-complete-home">返回首页</button>' +
        '<button class="btn-retry" id="btn-complete-retry">再玩一次</button>' +
      '</div>' +
    '</div>';

  document.getElementById('btn-complete-home').addEventListener('click', function(){
    c.innerHTML = '';
    goHome();
  });
  document.getElementById('btn-complete-retry').addEventListener('click', function(){
    c.innerHTML = '';
    if (State.currentModule) startModule(State.currentModule);
  });
}

function renderProgress(current, total) {
  var html = '<div class="game-progress">';
  for (var i = 0; i < total; i++) {
    var cls = i < current ? 'done' : i === current ? 'current' : '';
    html += '<div class="progress-dot ' + cls + '"></div>';
  }
  html += '</div>';
  return html;
}

/* ==========================================================
   模块1：水果数数
   ========================================================== */
function renderCounting() {
  State.totalQuestions = 5;
  var q = State.questionIndex;
  if (q >= State.totalQuestions) { showComplete(3); return; }

  var maxNum = q < 2 ? 5 : 10;
  var count = Math.floor(Math.random() * maxNum) + 1;
  var fruitKey = fruitKeys[Math.floor(Math.random() * fruitKeys.length)];
  var fruitName = fruitNames[fruitKey];
  var fruitEnName = fruitEnNames[fruitKey];

  var correct = count;
  var optionsSet = {};
  optionsSet[correct] = true;
  var opts = [correct];
  while (opts.length < 3) {
    var off = Math.floor(Math.random() * 3) + 1;
    var opt = Math.random() > 0.5 ? correct + off : correct - off;
    if (opt > 0 && opt <= 12 && !optionsSet[opt]) {
      optionsSet[opt] = true;
      opts.push(opt);
    }
  }
  opts.sort(function(){ return Math.random() - 0.5; });

  var fruitHtml = '';
  for (var i = 0; i < count; i++) {
    fruitHtml += '<div class="fruit-item">' + SVG[fruitKey] + '<span class="name-label"><span>' + fruitName + '</span><span class="en-label">' + fruitEnName + '</span></span></div>';
  }

  var optsHtml = '';
  for (var i = 0; i < opts.length; i++) {
    optsHtml += '<button class="option-btn" data-val="' + opts[i] + '">' + opts[i] + '</button>';
  }

  var body = document.getElementById('game-body');
  body.innerHTML =
    '<div class="game-question">数一数，有几个' + fruitName + '<span class="en-label">' + fruitEnName + '</span>？</div>' +
    '<div class="game-display" id="fruit-display">' + fruitHtml + '</div>' +
    '<div class="game-options" id="counting-options">' + optsHtml + '</div>' +
    renderProgress(q, State.totalQuestions);

  var btns = document.querySelectorAll('#counting-options .option-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', (function(val, cor){
      return function(){ checkCounting(val, cor); };
    })(opts[i], correct));
  }
}

function checkCounting(selected, correct) {
  if (State.locked) return;
  sfxClick();
  var fruits = document.querySelectorAll('.fruit-item');
  if (selected === correct) {
    State.locked = true;
    sfxCorrect();
    addStar();
    showFeedback('正确！⭐', true);
    for (var i = 0; i < fruits.length; i++) fruits[i].classList.add('bounce');
    State.correctCount++;
    State.questionIndex++;
    setTimeout(function(){ State.locked = false; renderCounting(); }, 1200);
  } else {
    sfxWrong();
    showFeedback('再数数看~', false);
    for (var i = 0; i < fruits.length; i++) {
      fruits[i].classList.add('shake');
      (function(el){ setTimeout(function(){ el.classList.remove('shake'); }, 500); })(fruits[i]);
    }
  }
}

/* ==========================================================
   模块2：动物配对记忆游戏
   ========================================================== */
var memoryState = { pairs:6, flipped:[], matched:{}, locked:false, moves:0, difficulty:1 };

function renderMemory() {
  var body = document.getElementById('game-body');
  body.innerHTML =
    '<div class="memory-difficulty" id="mem-diff">' +
      '<button class="diff-btn' + (memoryState.difficulty===0?' active':'') + '" data-diff="0">简单(4对)</button>' +
      '<button class="diff-btn' + (memoryState.difficulty===1?' active':'') + '" data-diff="1">中等(6对)</button>' +
      '<button class="diff-btn' + (memoryState.difficulty===2?' active':'') + '" data-diff="2">困难(8对)</button>' +
    '</div>' +
    '<div id="memory-grid" class="memory-grid"></div>' +
    '<div style="text-align:center;font-size:1.1rem;color:var(--text-secondary)">翻牌次数：<span id="memory-moves">0</span></div>';

  var diffBtns = document.querySelectorAll('#mem-diff .diff-btn');
  for (var i = 0; i < diffBtns.length; i++) {
    diffBtns[i].addEventListener('click', (function(d){
      return function(){ sfxClick(); memoryState.difficulty = d; renderMemory(); };
    })(parseInt(diffBtns[i].dataset.diff)));
  }

  initMemoryGame();
}

function initMemoryGame() {
  var pairCounts = [4, 6, 8];
  var gridClasses = ['grid-2x4','grid-3x4','grid-4x4'];
  var pairs = pairCounts[memoryState.difficulty];

  memoryState.pairs = pairs;
  memoryState.flipped = [];
  memoryState.matched = {};
  memoryState.locked = false;
  memoryState.moves = 0;

  var grid = document.getElementById('memory-grid');
  grid.className = 'memory-grid ' + gridClasses[memoryState.difficulty];

  var selected = animalKeys.slice(0, pairs);
  var cards = [];
  for (var i = 0; i < selected.length; i++) {
    cards.push(selected[i]);
    cards.push(selected[i]);
  }
  // 洗牌
  for (var i = cards.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
  }

  var html = '';
  for (var i = 0; i < cards.length; i++) {
    html += '<div class="memory-card" data-index="' + i + '" data-animal="' + cards[i] + '">' +
      '<div class="memory-card-inner">' +
        '<div class="memory-card-front"></div>' +
        '<div class="memory-card-back"><div class="name-label">' + SVG[cards[i]] + '<span class="en-label">' + animalEnNames[cards[i]] + '</span></div></div>' +
      '</div></div>';
  }
  grid.innerHTML = html;

  var cardEls = grid.querySelectorAll('.memory-card');
  for (var i = 0; i < cardEls.length; i++) {
    cardEls[i].addEventListener('click', (function(idx){
      return function(){ flipCard(idx); };
    })(i));
  }
}

function flipCard(idx) {
  if (memoryState.locked) return;
  if (memoryState.flipped.indexOf(idx) !== -1) return;
  if (memoryState.matched[idx]) return;

  sfxFlip();
  var card = document.querySelector('.memory-card[data-index="' + idx + '"]');
  card.classList.add('flipped');
  memoryState.flipped.push(idx);

  if (memoryState.flipped.length === 2) {
    memoryState.locked = true;
    memoryState.moves++;
    document.getElementById('memory-moves').textContent = memoryState.moves;

    var a = memoryState.flipped[0];
    var b = memoryState.flipped[1];
    var cardA = document.querySelector('.memory-card[data-index="' + a + '"]');
    var cardB = document.querySelector('.memory-card[data-index="' + b + '"]');

    if (cardA.dataset.animal === cardB.dataset.animal) {
      sfxCorrect();
      addStar();
      memoryState.matched[a] = true;
      memoryState.matched[b] = true;
      setTimeout(function(){
        cardA.classList.add('matched');
        cardB.classList.add('matched');
        memoryState.flipped = [];
        memoryState.locked = false;

        var matchCount = Object.keys(memoryState.matched).length;
        if (matchCount === memoryState.pairs * 2) {
          State.totalQuestions = 1;
          State.correctCount = 1;
          setTimeout(function(){ showComplete(3); }, 500);
        }
      }, 400);
    } else {
      setTimeout(function(){
        cardA.classList.remove('flipped');
        cardB.classList.remove('flipped');
        memoryState.flipped = [];
        memoryState.locked = false;
      }, 800);
    }
  }
}

/* ==========================================================
   模块3：大小比较
   ========================================================== */
function renderCompare() {
  State.totalQuestions = 5;
  var q = State.questionIndex;
  if (q >= State.totalQuestions) { showComplete(3); return; }

  var isBigger = Math.random() > 0.5;
  var question = isBigger ? '哪个更大？' : '哪个更小？';

  var allItems = [];
  for (var i = 0; i < fruitKeys.length; i++) {
    allItems.push({key:fruitKeys[i], svg:SVG[fruitKeys[i]], type:'fruit', name:fruitNames[fruitKeys[i]], enName:fruitEnNames[fruitKeys[i]]});
  }
  for (var i = 0; i < animalKeys.length; i++) {
    allItems.push({key:animalKeys[i], svg:SVG[animalKeys[i]], type:'animal', name:animalNames[animalKeys[i]], enName:animalEnNames[animalKeys[i]]});
  }

  var idx1 = Math.floor(Math.random() * allItems.length);
  var idx2 = idx1;
  while (idx2 === idx1) idx2 = Math.floor(Math.random() * allItems.length);

  var item1 = allItems[idx1];
  var item2 = allItems[idx2];

  var size1 = 55 + Math.floor(Math.random() * 30);
  var size2 = size1 + 20 + Math.floor(Math.random() * 25);

  var biggerIsLeft = size1 > size2;
  var correctSide;
  if (isBigger) {
    correctSide = biggerIsLeft ? 'left' : 'right';
  } else {
    correctSide = biggerIsLeft ? 'right' : 'left';
  }

  var body = document.getElementById('game-body');
  body.innerHTML =
    '<div class="game-question">' + question + '</div>' +
    '<div class="compare-container">' +
      '<div class="compare-item" id="compare-left" data-side="left">' +
        '<div style="width:' + size1 + 'px;height:' + size1 + 'px;display:flex;align-items:center;justify-content:center">' + item1.svg + '</div>' +
        '<span class="name-label"><span style="font-size:.9rem;font-weight:700">' + item1.name + '</span><span class="en-label">' + item1.enName + '</span></span>' +
      '</div>' +
      '<div class="compare-item" id="compare-right" data-side="right">' +
        '<div style="width:' + size2 + 'px;height:' + size2 + 'px;display:flex;align-items:center;justify-content:center">' + item2.svg + '</div>' +
        '<span class="name-label"><span style="font-size:.9rem;font-weight:700">' + item2.name + '</span><span class="en-label">' + item2.enName + '</span></span>' +
      '</div>' +
    '</div>' +
    renderProgress(q, State.totalQuestions);

  document.getElementById('compare-left').addEventListener('click', function(){
    checkCompare('left', correctSide);
  });
  document.getElementById('compare-right').addEventListener('click', function(){
    checkCompare('right', correctSide);
  });
}

function checkCompare(selected, correct) {
  if (State.locked) return;
  sfxClick();
  var el = document.getElementById('compare-' + selected);
  if (selected === correct) {
    State.locked = true;
    sfxCorrect();
    addStar();
    showFeedback('正确！⭐', true);
    el.classList.add('grow');
    State.correctCount++;
    State.questionIndex++;
    setTimeout(function(){ State.locked = false; renderCompare(); }, 1200);
  } else {
    sfxWrong();
    showFeedback('再试一次~', false);
    el.classList.add('shake');
    setTimeout(function(){ el.classList.remove('shake'); }, 500);
  }
}

/* ==========================================================
   模块4：简单加法
   ========================================================== */
function renderAddition() {
  State.totalQuestions = 5;
  var q = State.questionIndex;
  if (q >= State.totalQuestions) { showComplete(3); return; }

  var a = Math.floor(Math.random() * 5) + 1;
  var b = Math.floor(Math.random() * 5) + 1;
  var correct = a + b;
  var fruitKey = fruitKeys[Math.floor(Math.random() * fruitKeys.length)];

  var optionsSet = {};
  optionsSet[correct] = true;
  var opts = [correct];
  while (opts.length < 3) {
    var off = Math.floor(Math.random() * 3) + 1;
    var opt = Math.random() > 0.5 ? correct + off : correct - off;
    if (opt > 0 && opt <= 10 && !optionsSet[opt]) {
      optionsSet[opt] = true;
      opts.push(opt);
    }
  }
  opts.sort(function(){ return Math.random() - 0.5; });

  var leftFruits = '';
  for (var i = 0; i < a; i++) leftFruits += '<span class="name-label">' + SVG[fruitKey] + '<span class="en-label">' + fruitEnNames[fruitKey] + '</span></span>';
  var rightFruits = '';
  for (var i = 0; i < b; i++) rightFruits += '<span class="name-label">' + SVG[fruitKey] + '<span class="en-label">' + fruitEnNames[fruitKey] + '</span></span>';

  var optsHtml = '';
  for (var i = 0; i < opts.length; i++) {
    optsHtml += '<button class="option-btn" data-val="' + opts[i] + '">' + opts[i] + '</button>';
  }

  var body = document.getElementById('game-body');
  body.innerHTML =
    '<div class="game-question">算一算，一共几个' + fruitNames[fruitKey] + '<span class="en-label">' + fruitEnNames[fruitKey] + '</span>？</div>' +
    '<div class="addition-display">' +
      leftFruits +
      '<span class="addition-op">+</span>' +
      rightFruits +
      '<span class="addition-op">=</span>' +
      '<span class="addition-op">?</span>' +
    '</div>' +
    '<div class="game-options" id="addition-options">' + optsHtml + '</div>' +
    renderProgress(q, State.totalQuestions);

  var btns = document.querySelectorAll('#addition-options .option-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', (function(val, cor){
      return function(){ checkAddition(val, cor); };
    })(opts[i], correct));
  }
}

function checkAddition(selected, correct) {
  if (State.locked) return;
  sfxClick();
  if (selected === correct) {
    State.locked = true;
    sfxCorrect();
    addStar();
    showFeedback('正确！⭐', true);
    State.correctCount++;
    State.questionIndex++;
    setTimeout(function(){ State.locked = false; renderAddition(); }, 1200);
  } else {
    sfxWrong();
    showFeedback('再算算看~', false);
  }
}

/* ==========================================================
   模块5：颜色分类
   ========================================================== */
var sortState = { placed:0, total:8, baskets:{}, fruits:[] };
var dragCleanupFns = [];

function cleanupDrag() {
  for (var i = 0; i < dragCleanupFns.length; i++) dragCleanupFns[i]();
  dragCleanupFns = [];
}

function renderSorting() {
  State.totalQuestions = 1;
  cleanupDrag();

  var basketConfig = [
    {color:'#EF5350', name:'红色', enName:'Red', fruits:['apple','strawberry']},
    {color:'#FDD835', name:'黄色', enName:'Yellow', fruits:['banana','pear']},
    {color:'#AB47BC', name:'紫色', enName:'Purple', fruits:['grape']},
    {color:'#FF9800', name:'橙色', enName:'Orange', fruits:['orange']}
  ];

  var fruits = [];
  for (var bi = 0; bi < basketConfig.length; bi++) {
    var b = basketConfig[bi];
    for (var j = 0; j < 2; j++) {
      var fk = b.fruits[Math.floor(Math.random() * b.fruits.length)];
      fruits.push({key:fk, basket:b.name, color:b.color});
    }
  }
  // 洗牌
  for (var i = fruits.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = fruits[i]; fruits[i] = fruits[j]; fruits[j] = tmp;
  }

  sortState = {placed:0, total:fruits.length, baskets:{}, fruits:fruits};
  for (var i = 0; i < basketConfig.length; i++) {
    sortState.baskets[basketConfig[i].name] = {count:0, target:2};
  }

  var fruitsHtml = '';
  for (var i = 0; i < fruits.length; i++) {
    fruitsHtml += '<div class="sort-fruit" data-index="' + i + '" data-basket="' + fruits[i].basket + '" id="sort-fruit-' + i + '"><div class="name-label">' + SVG[fruits[i].key] + '<span class="en-label">' + fruitEnNames[fruits[i].key] + '</span></div></div>';
  }

  var basketsHtml = '';
  for (var i = 0; i < basketConfig.length; i++) {
    var b = basketConfig[i];
    basketsHtml += '<div class="sort-basket" data-basket="' + b.name + '" style="border-color:' + b.color + ';background:' + b.color + '15" id="sort-basket-' + b.name + '">' +
      '<div class="basket-label" style="color:' + b.color + '">' + b.name + '<span class="en-label">' + b.enName + '</span></div>' +
      '<span class="basket-count" id="basket-count-' + b.name + '">0/2</span></div>';
  }

  var body = document.getElementById('game-body');
  body.innerHTML =
    '<div class="game-question">把水果放到对应颜色的篮子里</div>' +
    '<div class="sort-area">' +
      '<div class="sort-fruits" id="sort-fruits">' + fruitsHtml + '</div>' +
      '<div class="sort-baskets" id="sort-baskets">' + basketsHtml + '</div>' +
    '</div>' +
    renderProgress(0, 1);

  initSortDrag();
}

function initSortDrag() {
  var fruitEls = document.querySelectorAll('.sort-fruit');
  var basketEls = document.querySelectorAll('.sort-basket');
  var dragEl = null;
  var ghostEl = null;
  var dragIdx = -1;

  function onStart(e) {
    e.preventDefault();
    var target = e.currentTarget;
    dragIdx = parseInt(target.dataset.index);
    dragEl = target;
    dragEl.classList.add('dragging');

    ghostEl = document.createElement('div');
    ghostEl.classList.add('drag-ghost');
    ghostEl.innerHTML = target.innerHTML;
    ghostEl.style.width = '60px';
    document.body.appendChild(ghostEl);
    moveGhost(e);
  }

  function moveGhost(e) {
    if (!ghostEl) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var y = e.touches ? e.touches[0].clientY : e.clientY;
    ghostEl.style.left = (x - 30) + 'px';
    ghostEl.style.top = (y - 30) + 'px';
  }

  function onMove(e) {
    if (!dragEl) return;
    e.preventDefault();
    moveGhost(e);
  }

  function onEnd(e) {
    if (!dragEl) return;
    var x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    var y = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

    for (var i = 0; i < basketEls.length; i++) {
      var rect = basketEls[i].getBoundingClientRect();
      if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
        var basketName = basketEls[i].dataset.basket;
        var fruitBasket = dragEl.dataset.basket;
        if (basketName === fruitBasket) {
          sfxCorrect();
          addStar();
          sortState.placed++;
          sortState.baskets[basketName].count++;
          document.getElementById('basket-count-' + basketName).textContent =
            sortState.baskets[basketName].count + '/2';
          dragEl.classList.add('placed');
          basketEls[i].classList.add('hover');
          setTimeout((function(b){ return function(){ b.classList.remove('hover'); }; })(basketEls[i]), 300);

          if (sortState.placed >= sortState.total) {
            State.correctCount = 1;
            setTimeout(function(){ showComplete(3); }, 500);
          }
        } else {
          sfxWrong();
          showFeedback('再试试看~', false);
        }
        break;
      }
    }

    if (dragEl) dragEl.classList.remove('dragging');
    if (ghostEl) { ghostEl.remove(); ghostEl = null; }
    dragEl = null;
  }

  for (var i = 0; i < fruitEls.length; i++) {
    fruitEls[i].addEventListener('mousedown', onStart);
    fruitEls[i].addEventListener('touchstart', onStart, {passive:false});
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);

  dragCleanupFns.push(function(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchend', onEnd);
  });
}

/* ==========================================================
   模块6：逻辑排序
   ========================================================== */
function renderSequence() {
  State.totalQuestions = 5;
  var q = State.questionIndex;
  if (q >= State.totalQuestions) { showComplete(3); return; }

  var patterns = ['AB','AAB','ABB','ABC'];
  var patternIdx = Math.min(q, patterns.length - 1);
  var pattern = patterns[patternIdx];

  var shuffled = fruitKeys.slice();
  for (var i = shuffled.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
  }

  var patternFruits = {};
  var chars = pattern.split('');
  var uniqueChars = [];
  for (var i = 0; i < chars.length; i++) {
    if (uniqueChars.indexOf(chars[i]) === -1) uniqueChars.push(chars[i]);
  }
  for (var i = 0; i < uniqueChars.length; i++) {
    patternFruits[uniqueChars[i]] = shuffled[i];
  }

  // 生成序列：2个完整模式 + 不完整部分
  var sequence = [];
  for (var rep = 0; rep < 2; rep++) {
    for (var i = 0; i < pattern.length; i++) {
      sequence.push(patternFruits[pattern[i]]);
    }
  }
  var partial = pattern.slice(0, -1);
  for (var i = 0; i < partial.length; i++) {
    sequence.push(patternFruits[partial[i]]);
  }

  var answer = patternFruits[pattern[pattern.length - 1]];

  var optionsSet = {};
  optionsSet[answer] = true;
  var opts = [answer];
  while (opts.length < 3) {
    var fk = fruitKeys[Math.floor(Math.random() * fruitKeys.length)];
    if (!optionsSet[fk]) {
      optionsSet[fk] = true;
      opts.push(fk);
    }
  }
  opts.sort(function(){ return Math.random() - 0.5; });

  var seqHtml = '';
  for (var i = 0; i < sequence.length; i++) {
    seqHtml += '<div class="sequence-item"><div class="name-label">' + SVG[sequence[i]] + '<span class="en-label">' + fruitEnNames[sequence[i]] + '</span></div></div>';
  }
  seqHtml += '<div class="sequence-question">?</div>';

  var optsHtml = '';
  for (var i = 0; i < opts.length; i++) {
    optsHtml += '<button class="seq-option-btn" data-fruit="' + opts[i] + '">' + SVG[opts[i]] + '<span class="name-label"><span style="font-size:.8rem">' + fruitNames[opts[i]] + '</span><span class="en-label">' + fruitEnNames[opts[i]] + '</span></span></button>';
  }

  var body = document.getElementById('game-body');
  body.innerHTML =
    '<div class="game-question">下一个应该是什么？</div>' +
    '<div class="sequence-display">' + seqHtml + '</div>' +
    '<div class="game-options" id="sequence-options">' + optsHtml + '</div>' +
    renderProgress(q, State.totalQuestions);

  var btns = document.querySelectorAll('#sequence-options .seq-option-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', (function(val, cor){
      return function(){ checkSequence(val, cor); };
    })(opts[i], answer));
  }
}

function checkSequence(selected, correct) {
  if (State.locked) return;
  sfxClick();
  if (selected === correct) {
    State.locked = true;
    sfxCorrect();
    addStar();
    showFeedback('正确！⭐', true);
    State.correctCount++;
    State.questionIndex++;
    setTimeout(function(){ State.locked = false; renderSequence(); }, 1200);
  } else {
    sfxWrong();
    showFeedback('再想想看~', false);
  }
}

/* ==========================================================
   模块7：减法入门
   ========================================================== */
function renderSubtraction() {
  State.totalQuestions = 5;
  var q = State.questionIndex;
  if (q >= State.totalQuestions) { showComplete(3); return; }

  var total = Math.floor(Math.random() * 3) + 3; // 3-5
  var minus = Math.min(total - 1, Math.floor(Math.random() * 2) + 1); // 1-2
  var correct = total - minus;
  var animalKey = animalKeys[Math.floor(Math.random() * animalKeys.length)];

  var optionsSet = {};
  optionsSet[correct] = true;
  var opts = [correct];
  while (opts.length < 3) {
    var opt = Math.floor(Math.random() * 5);
    if (opt >= 0 && !optionsSet[opt]) {
      optionsSet[opt] = true;
      opts.push(opt);
    }
  }
  opts.sort(function(){ return Math.random() - 0.5; });

  var animalsHtml = '';
  for (var i = 0; i < total; i++) {
    animalsHtml += '<div class="subtraction-animal" id="sub-animal-' + i + '"><div class="name-label">' + SVG[animalKey] + '<span class="en-label">' + animalEnNames[animalKey] + '</span></div></div>';
  }

  var optsHtml = '';
  for (var i = 0; i < opts.length; i++) {
    optsHtml += '<button class="option-btn" data-val="' + opts[i] + '">' + opts[i] + '</button>';
  }

  var body = document.getElementById('game-body');
  body.innerHTML =
    '<div class="game-question">' + total + '只' + animalNames[animalKey] + '<span class="en-label">' + animalEnNames[animalKey] + '</span>，走了' + minus + '只，还剩几只？</div>' +
    '<div class="subtraction-display" id="sub-display">' + animalsHtml + '</div>' +
    '<div class="subtraction-text" id="sub-text"></div>' +
    '<div class="game-options" id="subtraction-options">' + optsHtml + '</div>' +
    renderProgress(q, State.totalQuestions);

  var btns = document.querySelectorAll('#subtraction-options .option-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', (function(val, cor, m){
      return function(){ checkSubtraction(val, cor, m); };
    })(opts[i], correct, minus));
  }
}

function checkSubtraction(selected, correct, minus) {
  if (State.locked) return;
  sfxClick();
  if (selected === correct) {
    State.locked = true;
    sfxCorrect();
    addStar();
    showFeedback('正确！⭐', true);
    for (var i = 0; i < minus; i++) {
      var el = document.getElementById('sub-animal-' + i);
      if (el) el.classList.add('run-away');
    }
    State.correctCount++;
    State.questionIndex++;
    setTimeout(function(){ State.locked = false; renderSubtraction(); }, 1500);
  } else {
    sfxWrong();
    showFeedback('再算算看~', false);
  }
}
