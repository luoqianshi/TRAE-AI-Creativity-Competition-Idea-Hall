<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StandAlert - 站立提醒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1::before {
            content: '🧍';
            font-size: 32px;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .picker-wrapper {
            position: relative;
        }

        select {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            appearance: none;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        select:hover {
            border-color: #667eea;
            background: #fff;
        }

        select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: #fff;
        }

        .picker-wrapper::after {
            content: '▼';
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 12px;
            pointer-events: none;
        }

        .divider {
            height: 1px;
            background: #e9ecef;
            margin: 25px 0;
        }

        .work-hours {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }

        .work-hours-title {
            font-size: 15px;
            font-weight: 600;
            color: #666;
            margin-bottom: 12px;
        }

        .work-hours-list {
            font-size: 14px;
            color: #555;
            line-height: 2;
        }

        .work-hours-list span {
            color: #667eea;
            font-weight: 600;
        }

        .status-bar {
            margin-top: 25px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .status-running {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-stopped {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .next-reminder {
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f8f9fa;
            color: #666;
            border: 2px solid #e9ecef;
        }

        .btn-secondary:hover {
            background: #e9ecef;
        }

        .btn:active {
            transform: translateY(0);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.68);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .overlay-text {
            text-align: center;
            margin-bottom: 60px;
            transition: opacity 0.4s ease-out;
        }

        .overlay-text.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 28px;
            font-weight: 500;
            color: white;
            margin-bottom: 16px;
            line-height: 1.4;
            padding: 0 48px;
        }

        .overlay-subtitle {
            font-size: 24px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.92);
            line-height: 1.4;
            padding: 0 48px;
        }

        .countdown {
            font-size: 72px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.95);
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
        }

        .overlay-hint {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 90%;
            max-width: 320px;
            text-align: center;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .modal-message {
            font-size: 15px;
            color: #666;
            margin-bottom: 24px;
        }

        .modal-btn-group {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .modal-btn-confirm:hover {
            opacity: 0.9;
        }

        .modal-btn-cancel {
            background: #f0f0f0;
            color: #666;
        }

        .modal-btn-cancel:hover {
            background: #e0e0e0;
        }

        .hidden {
            display: none !important;
        }

        .current-time {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .overlay-title {
                font-size: 22px;
                padding: 0 20px;
            }

            .overlay-subtitle {
                font-size: 18px;
                padding: 0 20px;
            }

            .countdown {
                font-size: 56px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>StandAlert</h1>
        
        <div class="current-time" id="currentTime"></div>

        <div class="section">
            <div class="section-title">每次站立时间</div>
            <div class="picker-wrapper">
                <select id="standDuration">
                    <option value="1">1 分钟</option>
                    <option value="3">3 分钟</option>
                    <option value="5" selected>5 分钟</option>
                    <option value="10">10 分钟</option>
                    <option value="15">15 分钟</option>
                    <option value="20">20 分钟</option>
                    <option value="30">30 分钟</option>
                </select>
            </div>
        </div>

        <div class="section">
            <div class="section-title">提醒间隔</div>
            <div class="picker-wrapper">
                <select id="reminderInterval">
                    <option value="5">5 分钟</option>
                    <option value="10">10 分钟</option>
                    <option value="15">15 分钟</option>
                    <option value="20">20 分钟</option>
                    <option value="25">25 分钟</option>
                    <option value="30">30 分钟</option>
                    <option value="35">35 分钟</option>
                    <option value="40">40 分钟</option>
                    <option value="45">45 分钟</option>
                    <option value="50">50 分钟</option>
                    <option value="55">55 分钟</option>
                    <option value="60" selected>60 分钟</option>
                </select>
            </div>
        </div>

        <div class="divider"></div>

        <div class="work-hours">
            <div class="work-hours-title">工作时间（固定）</div>
            <div class="work-hours-list">
                <div>上午 9:00 – 11:40</div>
                <div>下午 14:00 – 18:00</div>
                <div>上班期间每 <span id="intervalDisplay">60</span> 分钟提醒一次</div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <span id="statusText">已停止</span>
        </div>

        <div class="next-reminder" id="nextReminder"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn">开始提醒</button>
            <button class="btn btn-secondary" id="stopBtn">停止提醒</button>
        </div>
    </div>

    <div class="overlay hidden" id="overlay">
        <div class="overlay-text" id="overlayText">
            <div class="overlay-title">你已经坐很久了，赶紧起来休息一下吧</div>
            <div class="overlay-subtitle">「喝水」「远眺」「活动腰椎肩颈」</div>
        </div>
        <div class="countdown" id="countdown">05:00</div>
        <div class="overlay-hint">双击屏幕可提前结束休息</div>
    </div>

    <div class="modal hidden" id="modal">
        <div class="modal-content">
            <div class="modal-title">结束休息</div>
            <div class="modal-message">是否需要结束休息？</div>
            <div class="modal-btn-group">
                <button class="modal-btn modal-btn-confirm" id="confirmBtn">是</button>
                <button class="modal-btn modal-btn-cancel" id="cancelBtn">否</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_STAND_DURATION = 'standDurationMinutes';
        const STORAGE_KEY_REMINDER_INTERVAL = 'reminderIntervalMinutes';

        const MORNING_START = { hour: 9, minute: 0 };
        const LUNCH_START = { hour: 11, minute: 40 };
        const AFTERNOON_START = { hour: 14, minute: 0 };
        const WORK_END = { hour: 18, minute: 0 };

        const pollInterval = 60000;

        let timer = null;
        let countdownTimer = null;
        let isRunning = false;
        let isResting = false;
        let restEndDate = null;
        let nextReminderDate = null;

        const standDurationSelect = document.getElementById('standDuration');
        const reminderIntervalSelect = document.getElementById('reminderInterval');
        const intervalDisplay = document.getElementById('intervalDisplay');
        const statusBar = document.getElementById('statusBar');
        const statusText = document.getElementById('statusText');
        const nextReminderElement = document.getElementById('nextReminder');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const overlay = document.getElementById('overlay');
        const overlayText = document.getElementById('overlayText');
        const countdownElement = document.getElementById('countdown');
        const modal = document.getElementById('modal');
        const confirmBtn = document.getElementById('confirmBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const currentTimeElement = document.getElementById('currentTime');

        function loadSettings() {
            const savedDuration = localStorage.getItem(STORAGE_KEY_STAND_DURATION);
            if (savedDuration) {
                standDurationSelect.value = savedDuration;
            }

            const savedInterval = localStorage.getItem(STORAGE_KEY_REMINDER_INTERVAL);
            if (savedInterval) {
                reminderIntervalSelect.value = savedInterval;
            }

            intervalDisplay.textContent = reminderIntervalSelect.value;
        }

        function saveSettings() {
            localStorage.setItem(STORAGE_KEY_STAND_DURATION, standDurationSelect.value);
            localStorage.setItem(STORAGE_KEY_REMINDER_INTERVAL, reminderIntervalSelect.value);
            intervalDisplay.textContent = reminderIntervalSelect.value;
        }

        function updateStatus() {
            if (isRunning) {
                statusBar.className = 'status-bar status-running';
                statusText.textContent = isResting ? '休息中' : '运行中';
            } else {
                statusBar.className = 'status-bar status-stopped';
                statusText.textContent = '已停止';
            }
        }

        function updateNextReminderDisplay() {
            if (!nextReminderDate) {
                nextReminderElement.textContent = '当前非工作时间';
                return;
            }

            const now = new Date();
            const diff = nextReminderDate - now;

            if (diff <= 0) {
                nextReminderElement.textContent = '即将提醒';
                return;
            }

            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);

            if (minutes > 0) {
                nextReminderElement.textContent = `下次提醒：${minutes}分${seconds}秒后`;
            } else {
                nextReminderElement.textContent = `下次提醒：${seconds}秒后`;
            }
        }

        function updateCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            currentTimeElement.textContent = `${hours}:${minutes}:${seconds}`;
        }

        function createDateOnDay(day, hour, minute) {
            const result = new Date(day);
            result.setHours(hour, minute, 0, 0);
            return result;
        }

        function isWithinWorkHours(date) {
            const dayStart = new Date(date);
            dayStart.setHours(0, 0, 0, 0);

            const morningStart = createDateOnDay(dayStart, MORNING_START.hour, MORNING_START.minute);
            const lunchStart = createDateOnDay(dayStart, LUNCH_START.hour, LUNCH_START.minute);
            const afternoonStart = createDateOnDay(dayStart, AFTERNOON_START.hour, AFTERNOON_START.minute);
            const endTime = createDateOnDay(dayStart, WORK_END.hour, WORK_END.minute);

            return (date >= morningStart && date < lunchStart) || (date >= afternoonStart && date < endTime);
        }

        function reminderTimesOnDay(day) {
            const dayStart = new Date(day);
            dayStart.setHours(0, 0, 0, 0);

            const morningStart = createDateOnDay(dayStart, MORNING_START.hour, MORNING_START.minute);
            const lunchStart = createDateOnDay(dayStart, LUNCH_START.hour, LUNCH_START.minute);
            const afternoonStart = createDateOnDay(dayStart, AFTERNOON_START.hour, AFTERNOON_START.minute);
            const endTime = createDateOnDay(dayStart, WORK_END.hour, WORK_END.minute);

            const interval = parseInt(reminderIntervalSelect.value) * 60000;
            const times = [];

            let slot = new Date(morningStart.getTime() + interval);
            while (slot <= lunchStart && slot < endTime) {
                times.push(slot);
                slot = new Date(slot.getTime() + interval);
            }

            slot = new Date(afternoonStart.getTime() + interval);
            while (slot <= endTime) {
                times.push(slot);
                slot = new Date(slot.getTime() + interval);
            }

            return times.sort((a, b) => a - b);
        }

        function nextReminderTimeAfter(date) {
            let searchDate = new Date(date);

            for (let i = 0; i < 3; i++) {
                const candidates = reminderTimesOnDay(searchDate).filter(time => time > date);
                if (candidates.length > 0) {
                    return candidates[0];
                }

                searchDate = new Date(searchDate);
                searchDate.setDate(searchDate.getDate() + 1);
                searchDate.setHours(0, 0, 0, 0);
            }

            return null;
        }

        function updateNextReminderDate() {
            if (isResting && restEndDate) {
                nextReminderDate = restEndDate;
                return;
            }

            const now = new Date();
            nextReminderDate = nextReminderTimeAfter(now);
        }

        function startRest(duration) {
            isResting = true;
            restEndDate = new Date(Date.now() + duration);
            updateStatus();

            overlay.classList.remove('hidden');
            overlayText.classList.remove('hidden');

            setTimeout(() => {
                overlayText.classList.add('hidden');
            }, 5000);

            updateCountdown();
            countdownTimer = setInterval(updateCountdown, 1000);
        }

        function updateCountdown() {
            if (!restEndDate) return;

            const now = new Date();
            const remaining = Math.max(0, Math.ceil((restEndDate - now) / 1000));

            const minutes = Math.floor(remaining / 60);
            const seconds = remaining % 60;

            countdownElement.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (remaining <= 0) {
                endRest();
            }
        }

        function endRest() {
            isResting = false;
            restEndDate = null;

            if (countdownTimer) {
                clearInterval(countdownTimer);
                countdownTimer = null;
            }

            overlay.classList.add('hidden');
            updateStatus();
            updateNextReminderDate();
        }

        function poll() {
            if (!isRunning) return;

            const now = new Date();

            if (isResting && restEndDate) {
                if (now >= restEndDate) {
                    endRest();
                }
                return;
            }

            if (nextReminderDate && now >= nextReminderDate) {
                if (isWithinWorkHours(now)) {
                    const duration = parseInt(standDurationSelect.value) * 60000;
                    startRest(duration);
                }
            }

            updateNextReminderDate();
        }

        function start() {
            if (isRunning) return;

            isRunning = true;
            updateStatus();
            updateNextReminderDate();

            timer = setInterval(() => {
                poll();
                updateNextReminderDisplay();
            }, pollInterval);

            poll();
            updateNextReminderDisplay();
        }

        function stop() {
            if (!isRunning) return;

            isRunning = false;

            if (timer) {
                clearInterval(timer);
                timer = null;
            }

            if (isResting) {
                endRest();
            }

            updateStatus();
            nextReminderElement.textContent = '';
        }

        function showEndRestModal() {
            modal.classList.remove('hidden');
        }

        function hideEndRestModal() {
            modal.classList.add('hidden');
        }

        standDurationSelect.addEventListener('change', saveSettings);

        reminderIntervalSelect.addEventListener('change', () => {
            saveSettings();
            if (isRunning) {
                updateNextReminderDate();
                updateNextReminderDisplay();
            }
        });

        startBtn.addEventListener('click', start);
        stopBtn.addEventListener('click', stop);

        overlay.addEventListener('dblclick', showEndRestModal);

        confirmBtn.addEventListener('click', () => {
            endRest();
            hideEndRestModal();
        });

        cancelBtn.addEventListener('click', hideEndRestModal);

        setInterval(updateCurrentTime, 1000);
        updateCurrentTime();

        loadSettings();
    </script>
</body>
</html>
