<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万古长河 · Rivers of Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  background:#0f0e0c;color:#e8e2d9;overflow:hidden;height:100vh;
}
:root{
  --china:#c45c2e;--china-glow:rgba(196,92,46,0.35);
  --greece:#2a7db5;--greece-glow:rgba(42,125,181,0.35);
  --egypt:#c9a84c;--egypt-glow:rgba(201,168,76,0.35);
  --ink:#1a1814;--parchment:#e8e2d9;--stone:#8a8279;--sand:#2a2723;
  --highlight:#d4a056;--glass:rgba(26,24,20,0.72);
}
h1,h2,h3,h4{font-family:"Noto Serif SC","Source Han Serif SC",serif}

/* ===== 导航 ===== */
.nav{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:1000;
  background:linear-gradient(180deg,rgba(15,14,12,0.95),rgba(15,14,12,0.6));
  backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,160,86,0.08);
  display:flex;align-items:center;justify-content:center;padding:0 32px;
}
.nav-brand{position:absolute;left:32px;display:flex;align-items:center;gap:10px;cursor:pointer;font-family:"Noto Serif SC",serif;font-weight:600;font-size:1.05rem;color:var(--parchment)}
.nav-brand svg{width:22px;height:22px;color:var(--highlight)}
.nav-links{display:flex;gap:16px}
.nav-link{padding:7px 16px;border-radius:6px;text-decoration:none;color:#8a8279;font-size:0.88rem;font-weight:500;transition:all .2s;border:1px solid transparent}
.nav-link:hover,.nav-link.active{color:var(--parchment);background:rgba(212,160,86,0.08);border-color:rgba(212,160,86,0.15)}

/* ===== 视图系统 ===== */
.view{position:fixed;top:56px;left:0;right:0;bottom:0;opacity:0;pointer-events:none;transition:opacity .4s ease;overflow:hidden}
.view.active{opacity:1;pointer-events:auto}

/* ===== 首页 ===== */
#home-view{background:radial-gradient(ellipse at 30% 20%,#1e1a14 0%,#0f0e0c 60%,#0a0908 100%);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-y:auto;padding-bottom:32px}
.hero-particles{position:absolute;inset:0;overflow:hidden;z-index:0}
.hero-particle{position:absolute;border-radius:50%;background:var(--highlight);opacity:0}
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;padding:80px 24px 30px}
.hero-kicker{font-family:"Playfair Display",serif;font-style:italic;color:var(--highlight);font-size:1.1rem;letter-spacing:3px;text-transform:uppercase;margin-bottom:16px;opacity:0;transform:translateY(20px);animation:fadeInUp .8s .2s forwards}
.hero-title{font-size:3.2rem;font-weight:900;color:var(--parchment);line-height:1.15;margin-bottom:16px;letter-spacing:2px;opacity:0;transform:translateY(20px);animation:fadeInUp .8s .4s forwards}
.hero-subtitle{font-size:1.15rem;color:#8a8279;max-width:560px;line-height:1.7;margin-bottom:40px;opacity:0;transform:translateY(20px);animation:fadeInUp .8s .6s forwards}
.hero-tree{display:flex;align-items:center;gap:24px;margin-bottom:40px;opacity:0;animation:fadeInUp .8s .8s forwards}
.hero-node{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;color:#fff;position:relative;box-shadow:0 0 24px rgba(0,0,0,0.4)}
.hero-node::after{content:"";position:absolute;right:-24px;top:50%;width:24px;height:2px;background:linear-gradient(90deg,var(--highlight),transparent)}
.hero-node:last-child::after{display:none}
.hero-cta{padding:14px 40px;border-radius:8px;background:linear-gradient(135deg,var(--highlight),#b0782e);color:#1a1814;font-size:1rem;font-weight:600;border:none;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 24px rgba(212,160,86,0.25);opacity:0;animation:fadeInUp .8s 1s forwards}
.hero-cta:hover{transform:translateY(-2px);box-shadow:0 6px 32px rgba(212,160,86,0.35)}

.civ-grid-section{position:relative;padding:0 48px 48px;z-index:2}
.civ-grid-section h2{font-size:1.1rem;color:#8a8279;margin-bottom:16px;font-weight:400;letter-spacing:2px;text-transform:uppercase}
.civ-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.civ-card{position:relative;border-radius:12px;padding:20px;background:linear-gradient(180deg,rgba(255,255,255,0.06),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:all .3s;overflow:hidden}
.civ-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,0.15);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.civ-card .civ-glow{position:absolute;top:0;left:0;right:0;height:3px;opacity:.7}
.civ-card h3{font-size:1.05rem;margin-bottom:4px;color:var(--parchment)}
.civ-card p{font-size:.8rem;color:#8a8279;margin-bottom:8px}
.civ-card .civ-meta{display:flex;gap:12px;font-size:.72rem;color:#6a6359}
.civ-card.locked{opacity:.45;cursor:not-allowed;background:repeating-linear-gradient(45deg,rgba(255,255,255,0.02),rgba(255,255,255,0.02) 8px,rgba(255,255,255,0.04) 8px,rgba(255,255,255,0.04) 16px)}
.civ-card.locked:hover{transform:none;border-color:rgba(255,255,255,0.06)}

@keyframes fadeInUp{to{opacity:1;transform:translateY(0)}}

/* ===== 探索页 ===== */
#explore-view{display:flex}
.exp-sidebar{width:260px;background:linear-gradient(180deg,#161412,#0f0e0c);border-right:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;flex-shrink:0}
.exp-sidebar h4{padding:20px 20px 12px;font-size:.75rem;color:#6a6359;text-transform:uppercase;letter-spacing:2px;font-weight:500}
.exp-civ-item{display:flex;align-items:center;gap:12px;padding:10px 16px;margin:0 8px 4px;border-radius:8px;cursor:pointer;transition:all .2s;border:1px solid transparent}
.exp-civ-item:hover{background:rgba(255,255,255,0.03)}
.exp-civ-item.active{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.08)}
.exp-civ-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.exp-civ-info{flex:1}
.exp-civ-name{font-size:.95rem;font-weight:600;color:var(--parchment)}
.exp-civ-era{font-size:.75rem;color:#6a6359}
.exp-divider{height:1px;background:rgba(255,255,255,0.06);margin:8px 16px}

.exp-main{flex:1;position:relative;overflow:hidden;background:#0f0e0c}
.exp-toolbar{position:absolute;top:12px;left:12px;right:420px;z-index:10;display:flex;justify-content:space-between;align-items:center}
.exp-modes{display:flex;gap:4px;background:rgba(255,255,255,0.04);padding:4px;border-radius:8px;border:1px solid rgba(255,255,255,0.06)}
.exp-mode-btn{padding:6px 14px;border-radius:6px;border:none;background:transparent;color:#6a6359;font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:inherit}
.exp-mode-btn.active{background:rgba(255,255,255,0.08);color:var(--parchment);box-shadow:0 1px 4px rgba(0,0,0,0.2)}
.exp-fit-btn{width:32px;height:32px;border-radius:6px;border:none;background:rgba(255,255,255,0.04);color:#6a6359;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,0.06)}
.exp-fit-btn:hover{background:rgba(255,255,255,0.08);color:var(--parchment)}

#tree-svg{width:100%;height:100%;cursor:grab}
#tree-svg:active{cursor:grabbing}
#tree-g{transition:transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94)}

.exp-tooltip{position:absolute;background:rgba(20,18,14,0.95);border:1px solid rgba(212,160,86,0.2);border-radius:10px;padding:12px 16px;max-width:280px;pointer-events:none;opacity:0;z-index:50;transition:opacity .15s;box-shadow:0 8px 32px rgba(0,0,0,0.4);backdrop-filter:blur(8px)}
.exp-tooltip.show{opacity:1}
.exp-tooltip-title{font-weight:600;color:var(--parchment);margin-bottom:2px;font-size:.9rem}
.exp-tooltip-time{color:var(--highlight);font-size:.78rem;margin-bottom:6px}
.exp-tooltip-summary{color:#a0988a;font-size:.82rem;line-height:1.5}
.exp-tooltip-events{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.exp-tooltip-event-chip{padding:2px 8px;border-radius:10px;background:rgba(212,160,86,0.12);color:var(--highlight);font-size:.7rem}

.exp-panel{width:420px;background:linear-gradient(180deg,#161412,#0f0e0c);border-left:1px solid rgba(255,255,255,0.05);overflow-y:auto;flex-shrink:0}
.panel-civ{padding:24px}
.panel-civ-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.panel-civ-bar{width:4px;height:40px;border-radius:2px}
.panel-civ-name{font-size:1.3rem;font-weight:700;color:var(--parchment)}
.panel-civ-era{font-size:.82rem;color:#6a6359}
.panel-civ-desc{font-size:.88rem;line-height:1.8;color:#a0988a;margin-bottom:20px}
.panel-civ-stats{display:flex;flex-direction:column;gap:10px}
.panel-stat{display:flex;justify-content:space-between;font-size:.84rem}
.panel-stat-label{color:#6a6359}
.panel-stat-value{color:var(--parchment);font-weight:500}

.panel-node{padding:20px}
.panel-back{display:flex;align-items:center;gap:6px;background:none;border:none;color:#6a6359;font-size:.82rem;cursor:pointer;margin-bottom:16px;padding:4px 0;font-family:inherit}
.panel-back:hover{color:var(--parchment)}
.nd-pill{display:inline-block;padding:3px 12px;border-radius:12px;font-size:.72rem;font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.nd-title{font-size:1.2rem;font-weight:700;color:var(--parchment);margin-bottom:4px;line-height:1.3}
.nd-time{font-size:.85rem;color:#6a6359;margin-bottom:10px}
.nd-summary{font-size:.9rem;line-height:1.7;color:#a0988a;margin-bottom:14px}
.nd-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.nd-tag{padding:4px 10px;border-radius:10px;background:rgba(255,255,255,0.05);font-size:.75rem;color:#8a8279;border:1px solid rgba(255,255,255,0.06)}

.nd-section{border-top:1px solid rgba(255,255,255,0.06)}
.nd-toggle{width:100%;display:flex;align-items:center;gap:8px;padding:14px 0;background:none;border:none;font-size:.88rem;font-weight:600;color:var(--parchment);cursor:pointer;font-family:inherit;text-align:left}
.nd-toggle svg{transition:transform .2s;width:16px;height:16px;color:#6a6359}
.nd-toggle.open svg{transform:rotate(180deg)}
.nd-body{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:.88rem;line-height:1.8;color:#a0988a}
.nd-body.open{max-height:800px;padding-bottom:16px}
.nd-body a{color:var(--highlight);text-decoration:none}
.nd-body a:hover{text-decoration:underline}

.nd-conn-item{padding:8px 12px;border-radius:8px;background:rgba(255,255,255,0.04);margin-bottom:8px;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,0.04);font-size:.85rem}
.nd-conn-item:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.1)}
.nd-conn-item small{color:#6a6359;font-size:.75rem;margin-left:6px}
.nd-conn-section{margin-bottom:10px;font-size:.8rem;color:#6a6359;font-weight:600}

.event-banner{padding:12px 16px;background:linear-gradient(90deg,rgba(212,160,86,0.12),rgba(212,160,86,0.04));border-left:3px solid var(--highlight);margin-bottom:16px;border-radius:0 8px 8px 0}
.event-banner-title{font-weight:600;color:var(--highlight);font-size:.88rem;margin-bottom:2px}
.event-banner-time{font-size:.78rem;color:#8a8279}
.event-banner-desc{font-size:.82rem;color:#a0988a;margin-top:6px;line-height:1.5}

/* SVG 节点样式 */
.tree-link{fill:none;stroke-linecap:round;transition:stroke .3s}
.tree-link.main{stroke-width:2.5}
.tree-link.branch{stroke-width:1.5;stroke-dasharray:5 5}
.tree-link.event{stroke-width:1;stroke-dasharray:3 3;opacity:.5}
.tree-node-group{cursor:pointer}
.tree-node-rect{transition:all .25s cubic-bezier(.34,1.56,.64,1)}
.tree-node-group:hover .tree-node-rect{filter:brightness(1.15)}
.tree-node-group.selected .tree-node-rect{stroke:var(--highlight);stroke-width:2;filter:drop-shadow(0 0 8px rgba(212,160,86,.3))}
.tree-node-group.dimmed{opacity:.25}
.tree-node-text{pointer-events:none;font-family:"Noto Sans SC",sans-serif}
.branch-btn{cursor:pointer}
.branch-btn:hover circle{fill:var(--highlight)}

/* ===== 对照页 ===== */
#compare-view{background:#0f0e0c;overflow-y:auto}
.compare-inner{max-width:1200px;margin:0 auto;padding:40px 32px}
.compare-title{font-size:2rem;font-weight:700;text-align:center;margin-bottom:32px;color:var(--parchment)}
.compare-slots{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:32px}
.compare-slot{width:320px;height:140px;border:2px dashed rgba(255,255,255,0.12);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;background:rgba(255,255,255,0.02)}
.compare-slot:hover{border-color:rgba(212,160,86,0.4);background:rgba(212,160,86,0.03)}
.compare-slot.filled{border-style:solid;border-color:rgba(255,255,255,0.15);background:rgba(255,255,255,0.04)}
.compare-slot .slot-name{font-size:1.3rem;font-weight:700}
.compare-slot .slot-era{font-size:.85rem;color:#6a6359;margin-top:4px}
.compare-vs{font-family:"Playfair Display",serif;font-size:2rem;font-weight:700;color:#6a6359}
.compare-dims{display:flex;justify-content:center;gap:8px;margin-bottom:28px}
.compare-dim{padding:8px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);color:#8a8279;font-size:.88rem;cursor:pointer;font-family:inherit;transition:all .2s}
.compare-dim.active{background:rgba(212,160,86,0.15);color:var(--highlight);border-color:rgba(212,160,86,0.3)}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.compare-col-header{text-align:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.compare-col-name{font-size:1.15rem;font-weight:700}
.compare-col-bar{width:40px;height:3px;border-radius:2px;margin:8px auto 0}
.compare-node-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;margin-bottom:12px;transition:all .2s}
.compare-node-card:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1)}
.compare-node-time{font-size:.78rem;color:#6a6359;margin-bottom:4px}
.compare-node-title{font-weight:600;color:var(--parchment);margin-bottom:6px}
.compare-node-summary{font-size:.84rem;color:#8a8279;line-height:1.5}
.compare-conclusion{margin-top:28px;padding:20px;background:rgba(212,160,86,0.06);border-radius:12px;border:1px solid rgba(212,160,86,0.12);text-align:center;font-size:.95rem;color:#a0988a;line-height:1.7;font-style:italic}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:2000;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:linear-gradient(180deg,#1e1a14,#161412);border-radius:16px;padding:28px;width:90%;max-width:480px;border:1px solid rgba(255,255,255,0.08);box-shadow:0 24px 64px rgba(0,0,0,0.5)}
.modal h3{margin-bottom:20px;font-size:1.2rem;color:var(--parchment)}
.modal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.modal-opt{padding:18px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03);text-align:center;cursor:pointer;transition:all .2s}
.modal-opt:hover{border-color:var(--highlight);background:rgba(212,160,86,0.05)}
.modal-opt-dot{width:20px;height:20px;border-radius:50%;margin:0 auto 8px}
.modal-opt-name{font-weight:600;color:var(--parchment);font-size:.9rem}
.modal-close{width:100%;padding:10px;border:none;background:rgba(255,255,255,0.05);border-radius:8px;color:#6a6359;cursor:pointer;font-family:inherit;font-size:.9rem}
.modal-close:hover{background:rgba(255,255,255,0.08)}

/* ===== 滚动条 ===== */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

/* 连线高亮与流动效果 */
.tree-link.highlight{stroke:var(--highlight)!important;opacity:1!important;filter:drop-shadow(0 0 4px rgba(212,160,86,0.5));stroke-width:3}
.tree-link.flow{animation:linkPulse 2s ease-in-out infinite}
@keyframes linkPulse{0%,100%{stroke-width:2.5;opacity:.7}50%{stroke-width:4;opacity:1}}
.tree-link.dimmed{opacity:.1!important}

/* 起点未来节点 */
.tree-origin-rect{animation:originPulse 3s ease-in-out infinite}
.tree-future-rect{animation:futurePulse 3s ease-in-out infinite}
@keyframes originPulse{0%,100%{stroke-opacity:0.3}50%{stroke-opacity:0.6}}
@keyframes futurePulse{0%,100%{stroke-opacity:0.2}50%{stroke-opacity:0.5}}
/* 概览面板朝代列表 */
.panel-civ-eras{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)}
.panel-era-chip{font-size:.72rem;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,0.05);color:#9a948a;border:1px solid rgba(255,255,255,0.08);white-space:nowrap}
/* 起点未来展示 */
.panel-origin-future{display:flex;align-items:center;gap:10px;margin:12px 0;padding:10px;background:rgba(212,160,86,0.04);border-radius:10px;border:1px solid rgba(212,160,86,0.1)}
.panel-of-item{display:flex;align-items:center;gap:8px;flex:1}
.panel-of-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.panel-of-label{font-size:.82rem;color:#c9c3ba;font-weight:500;line-height:1.3}
.panel-of-label small{display:block;font-size:.7rem;color:#8a8279;margin-top:2px}
.panel-of-arrow{color:#8a8279;font-size:.9rem}

/* 侧边栏图腾 */
.exp-civ-totem{width:44px;height:54px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid;flex-shrink:0;margin-right:6px;overflow:hidden}
.exp-civ-item.active .exp-civ-totem{border-color:transparent!important;background:rgba(255,255,255,0.08)!important}
/* 面板横幅 */
.panel-banner{height:100px;border-radius:12px;background-size:cover;background-position:center;margin:0 0 12px 0;position:relative;overflow:hidden}
.panel-banner-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(18,16,14,.95) 100%)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    <span>万古长河</span>
  </div>
  <div class="nav-links">
    <a href="#" class="nav-link active" data-target="home" onclick="go('home');return false">首页</a>
    <a href="#" class="nav-link" data-target="explore" onclick="go('explore');return false">探索</a>
    <a href="#" class="nav-link" data-target="compare" onclick="go('compare');return false">长河对照</a>
  </div>
</nav>

<!-- 首页 -->
<section id="home-view" class="view active">
  <div class="hero-particles" id="hero-particles"></div>
  <div class="hero-content">
    <div class="hero-kicker">Rivers of Time</div>
    <h1 class="hero-title">纵览万古文明<br>长河奔流不息</h1>
    <p class="hero-subtitle">纵贯五千年，一览世界文明的源流与交汇</p>

wikipedia.org/wiki/changping_battle"}]},{"id":"qin_shihuang_figure","title":"秦始皇嬴政","time_label":"前259年","year":-259,"category":"figure","subcategory":"帝王","summary":"中国历史上第一位皇帝，以铁腕手段开创大一统帝国模式。","detail":"秦始皇（嬴政）十三岁即位，三十九岁完成统一。他以法家为治国纲领，废分封设郡县、书同文车同轨、统一货币度量衡。北筑长城防匈奴，南修灵渠通百越。虽然秦朝仅历二世而亡，但秦始皇开创的制度框架被此后两千年中国历代王朝沿用。","impact_tags":["制度整合","文化认同","行政效率提升"],"related_nodes":["qin_unification","great_wall","terracotta_army"],"prerequisites":["qin_unification"],"unlocks":[],"world_event_links":[],"layout":{"layer":3,"lane":"branch_3","role":"branch"},"confidence":"high","sources":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/qin_shihuang_figure"}]},{"id":"dujiangyan","title":"都江堰水利工程","time_label":"前256年","year":-256,"category":"technology","subcategory":"水利工程","summary":"李冰主持修建的无坝引水工程，使成都平原成为天府之国。","detail":"都江堰利用岷江出山口的地形，以鱼嘴分水堤、飞沙堰溢洪道、宝瓶口进水口三大主体工程，实现了自动分水、排沙、引水。这一工程至今仍在使用，是人类水利工程史上的奇迹。","impact_tags":["技术扩散","城市化"],"related_nodes":["iron_agriculture","qin_unification"],"prerequisites":["iron_agriculture"],"unlocks":[],"world_event_links":[],"layout":{"layer":3,"lane":"branch_4","role":"branch"},"confidence":"high","sources":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/dujiangyan"}]},{"id":"han_centralization","title":"汉代中央集权巩固","time_label":"前141年","year":-141,"category":"politics","subcategory":"郡国并行","summary":"汉武帝推行推恩令、盐铁官营，独尊儒术，巩固了大一统帝国的制度框架。","detail":"汉朝在秦制基础上进行调整，郡国并行逐渐转向全面郡县。汉武帝独尊儒术、推行推恩令削弱诸侯，建立刺史监察和盐铁官营体系。这一系列改革使中央集权在大国规模上得以稳定运行。","impact_tags":["制度整合","行政效率提升","文化认同"],"related_nodes":["qin_unification","tang_golden_age","paper_invention","han_wudi","sima_qian","buddhism_intro","daoism_origin","chibi_battle"],"prerequisites":["qin_unification"],"unlocks":["tang_golden_age","paper_invention","han_wudi","sima_qian","buddhism_intro","daoism_origin","chibi_battle"],"world_event_links":[],"layout":{"layer":4,"lane":"main","role":"milestone"},"confidence":"high","sources":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/han_centralization"}]},{"id":"han_wudi","title":"汉武帝刘彻","time_label":"前141年","year":-141,"category":"figure","subcategory":"帝王","summary":"雄才大略的汉朝皇帝，北击匈奴、打通西域、独尊儒术，奠定中华帝国基本格局。","detail":"汉武帝在位五十四年，北击匈奴至漠北（卫青、霍去病），南平百越，东定朝鲜，西通西域（张骞）。政治上推行推恩令、建立刺史制度；经济上盐铁官营、均输平准；文化上独尊儒术。中国历史上'汉族'、'汉字'的称谓正源自这个伟大的朝代。","impact_tags":["制度整合","军事优势","文化认同"],"related_nodes":["han_centralization","silk_road","sima_qian"],"prerequisites":["han_centralization"],"unlocks":["silk_road"],"world_event_links":[],"layout":{"layer":4,"lane":"branch_2","role":"branch"},"confidence":"high","sources":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/han_wudi"}]},{"id":"sima_qian","title":"司马迁与史记","time_label":"前104年","year":-104,"category":"figure","subcategory":"史学家","summary":"《史记》开创纪传体通史体例，'史家之绝唱，无韵之离骚'。","detail":"司马迁继承父志著《史记》，上起黄帝下至汉武帝，三千余年历史尽纳其中。全书130篇52万字，以本纪、世家、列传、表、书五种体例构建了中国正史的基本范式。他忍辱负重完成巨著的经历，本身就是中国士人精神气节的象征。","impact_tags":["知识传播","文化认同"],"related_nodes":["han_centralization"],"prerequisites":["han_centralization"],"unlocks":[],"world_event_links":[],"layout":{"layer":4,"lane":"branch_3","role":"branch"},"confidence":"high","sources":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/sima_qian"}]},{"id":"silk_road","title":"丝绸之路","time_label":"前114年","year":-114,"category":"economy","subcategory":"跨大陆贸易","summary":"张骞通西域后形成的跨大陆贸易通道，连接中国与中亚、地中海世界。","detail":"汉武帝时期张骞两次出使西域，打通了从长安经中亚至地中海东岸的贸易通道。丝绸、茶叶、瓷器西传，葡萄、胡桃、佛教东渐。这条通道不仅是商品网络，更是技术、宗教与疾病传播的走廊。","impact_tags":["贸易网络","文化认同"],"related_nodes":["qin_unification","paper_money","zheng_he","zhang_qian"],"prerequisites":["qin_unification","han_wudi"],"unlocks":["paper_money","zhang_qian","zheng_he"],"world_event_links":["silk_road_event"],"layout":{"layer":4,"lane":"branch_4","role":"branch"},"confidence":"high","sources":[{"label":"Wikipedia","url":"https://en.wikipedia.org/wiki/silk_road"}]},{"id":"zhang_qian","title":"张骞通西域","time_label":"前138年","year":-138,"category":"figure","subcategory":"探险家","summary":"凿空西域的先行者，打通了中原与中亚的直接联系。","detail":"张骞 function go(view,param){
  $$('.view').forEach(v=>v.classList.remove('active'));
  $(`#${view}-view`).classList.add('active');
  $$('.nav-link').forEach(l=>l.classList.toggle('active',l.dataset.target===view));
  if(view==='home')renderHome();
  if(view==='explore')initExplore(param||currentCivId);
  if(view==='compare')initCompare();
}

function renderHome(){
  const g=$('#home-civ-grid');
  if(!g.children.length){
    DATA.civilizations.forEach((c,i)=>{

      d.onclick=()=>go('explore',c.id);

    [{n:'古罗马',t:'法律与工程的帝国典范',nodes:12},{n:'古印度',t:'宗教与数学的南亚源泉',nodes:11},{n:'波斯',t:'宽容与驿道的洲际桥梁',nodes:10}].forEach((l,i)=>{

      d.innerHTML=`<h3>${l.n}</h3><p>${l.t}</p><div class="civ-meta"><span>即将开放 · ${l.nodes} 节点</span></div>`;
      g.appendChild(d);
    });
  }
  const pc=$('#hero-particles');
  if(!pc.children.length){
    for(let i=0;i<30;i++){
      const p=document.createElement('div');p.className='hero-particle';
      const s=Math.random()*3+1;
      p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation:particleFloat ${8+Math.random()*12}s ${Math.random()*5}s infinite linear;opacity:${Math.random()*.4+.1}`;

    style.textContent='@keyframes particleFloat{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-40vh) translateX(20px)}100%{transform:translateY(-80vh) translateX(-20px);opacity:0}}';

      el.style.animation=`fadeInUp .5s ${1.2+i*.2}s forwards`;el.style.opacity='0';
      ht.appendChild(el);

function renderPanelNode(node){

  const catColor=CAT_COLOR[node.category];

  const unlocks=node.unlocks.length?`<div class="nd-conn-section">解锁节点</div>`+node.unlocks.map(uid=>{const n=getNode(currentCivId,uid);return n?`<div class="nd-conn-item" onclick="selectNode('${uid}')">${n.title}<small>${n.time_label}</small></div>`:''}).join(''):'';
  const wevents=node.world_event_links.length?`<div class="nd-conn-section">关联世界事件</div>`+node.world_event_links.map(eid=>{const e=getEvent(eid);return e?`<div class="nd-conn-item">${e.title}<small>${e.time_label}</small></div>`:''}).join(''):'';
  const sources=node.sources.map(s=>`<div style="margin-bottom:6px"><a href="${s.url}" target="_blank">${s.label}</a></div>`).join('');
  $('#exp-panel').innerHTML=`${evs}<div class="panel-node"><button class="panel-back" onclick="clearSelection()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 返回概览</button><span class="nd-pill" style="background:${catColor}1A;color:${catColor}">${CAT_NAME[node.category]}${node.subcategory?' · '+node.subcategory:''}</span><div class="nd-title">${node.title}</div><div class="nd-time">${node.time_label}</div><div class="nd-summary">${node.summary}</div><div class="nd-tags">${node.impact_tags.map(t=>`<span class="nd-tag">${t}</span>`).join('')}</div><div class="nd-section"><button class="nd-toggle" onclick="toggleNd(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg> 详细说明</button><div class="nd-body"><p>${node.detail}</p></div></div><div class="nd-section"><button class="nd-toggle" onclick="toggleNd(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg> 关联与影响</button><div class="nd-body">${prereq}${unlocks}${wevents}</div></div><div class="nd-section"><button class="nd-toggle" onclick="toggleNd(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg> 来源与可信度</button><div class="nd-body"><div style="margin-bottom:10px"><span style="display:inline-block;padding:3px 12px;border-radius:12px;background:${node.confidence==='high'?'rgba(94,201,137,0.12)':'rgba(201,168,76,0.12)'};color:${node.confidence==='high'?'#5ec989':'#c9a84c'};font-size:.75rem;font-weight:600">可信度：${node.confidence==='high'?'高':'中'}</span></div>${sources}</div></div></div>`;
}
window.toggleNd=function(btn){const body=btn.nextElementSibling;const open=body.classList.toggle('open');btn.classList.toggle('open',open);};
window.selectNode=function(nid){
  selectedNodeId=nid;
  const civ=getCiv(currentCivId);
  const node=getNode(currentCivId,nid);
  if(node){
    if(treeMode==='events'){
      const bChildren=civ.nodes.filter(x=>x.prerequisites.includes(nid)&&x.layout.lane!=='main');
      if(bChildren.length)expandedBranches.add(nid);
    }
  }
  renderTree();
  if(node){
    renderPanelNode(node);
    autoZoomToNode(nid);
  }
};
window.clearSelection=function(){
  selectedNodeId=null;
  if(treeMode==='events')expandedBranches.clear();
  renderTree();
  renderPanelCiv(getCiv(currentCivId));
};
window.setTreeMode=function(m){treeMode=m;$$('.exp-mode-btn').forEach(b=>b.classList.toggle('active',b.textContent===(m==='standard'?'标准':m==='milestones'?'关键节点':'事件联动')));renderTree();};
window.treeFit=function(){const svg=$('#tree-svg');const gw=svg.clientWidth,gh=svg.clientHeight;let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;nodePos.forEach(p=>{minX=Math.min(minX,p.x-90);minY=Math.min(minY,p.y-40);maxX=Math.max(maxX,p.x+90);maxY=Math.max(maxY,p.y+40);});const cw=maxX-minX||400,ch=maxY-minY||300;const s=Math.min(gw/cw,gh/ch,.85)*.9;zoom=Math.max(.4,Math.min(2,s));panX=(gw-cw*zoom)/2-minX*zoom;panY=(gh-ch*zoom)/2-minY*zoom;updateTransform();};

function getVisibleNodes(civ){
  if(treeMode==='milestones'){
    const keyIds=new Set();
    civ.nodes.forEach(n=>{if(n.layout.role==='root'||n.layout.role==='milestone')keyIds.add(n.id);});
    civ.nodes.forEach(n=>{if(n.prerequisites.some(pid=>keyIds.has(pid)))keyIds.add(n.id);});
    return civ.nodes.filter(n=>keyIds.has(n.id));
  }
  return civ.nodes.filter(n=>{if(n.layout.lane==='main')return true;return n.prerequisites.some(pid=>expandedBranches.has(pid));});
}
function computeLayout(civ){
  const visible=getVisibleNodes(civ);const byLayer=new Map();visible.forEach(n=>{const l=n.layout.layer;if(!byLayer.has(l))byLayer.set(l,[]);byLayer.get(l).push(n);});
  const pos=new Map();const lh=160,cx=500,off=280;
  byLayer.forEach((nodes,layer)=>{nodes.forEach(n=>{let x=cx;if(n.layout.lane==='branch_1')x=cx+off;if(n.layout.lane==='branch_2')x=cx-off;if(n.layout.lane==='branch_3')x=cx+off*1.6;const y=80+layer*lh;pos.set(n.id,{x,y,node:n});});});
  nodePos=pos;return pos;
}
function renderTree(){
  const g=$('#tree-g');g.innerHTML='';const civ=getCiv(currentCivId);const pos=computeLayout(civ);
  civ.nodes.forEach(node=>{const fp=pos.get(node.id);if(!fp)return;node.unlocks.forEach(uid=>{const tp=pos.get(uid);if(!tp)return;const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',bezier(fp.x,fp.y+36,tp.x,tp.y-36));const isB=node.layout.lane!==tp.node.layout.lane;path.classList.add('tree-link',isB?'branch':'main');path.style.stroke=isB?'#555':civ.color;path.style.opacity=isB?'.4':'.7';path.dataset.from=node.id;path.dataset.to=uid;g.appendChild(path);});});
  pos.forEach((p,nid)=>{const n=p.node;const isSel=selectedNodeId===nid;const isDim=selectedNodeId&&selectedNodeId!==nid&&!isRelated(selectedNodeId,nid,civ);
    const gNode=document.createElementNS('http://www.w3.org/2000/svg','g');gNode.classList.add('tree-node-group');if(isSel)gNode.classList.add('selected');if(isDim)gNode.classList.add('dimmed');gNode.setAttribute('transform',`translate(${p.x},${p.y})`);
    const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',-80);rect.setAttribute('y',-36);rect.setAttribute('width',160);rect.setAttribute('height',72);rect.setAttribute('rx',10);rect.classList.add('tree-node-rect');rect.setAttribute('fill','rgba(30,28,24,0.92)');rect.setAttribute('stroke',isSel?'#d4a056':'rgba(255,255,255,0.08)');rect.setAttribute('stroke-width',isSel?2:1);gNode.appendChild(rect);
    const cat=document.createElementNS('http://www.w3.org/2000/svg','text');cat.setAttribute('x',-70);cat.setAttribute('y',-20);cat.setAttribute('fill',CAT_COLOR[n.category]);cat.setAttribute('font-size',9);cat.setAttribute('font-weight','600');cat.classList.add('tree-node-text');cat.textContent=CAT_NAME[n.category];gNode.appendChild(cat);
    const title=document.createElementNS('http://www.w3.org/2000/svg','text');title.setAttribute('x',0);title.setAttribute('y',-2);title.setAttribute('text-anchor','middle');title.setAttribute('fill','#e8e2d9');title.setAttribute('font-size',12);title.setAttribute('font-weight','600');title.classList.add('tree-node-text');title.textContent=n.title;gNode.appendChild(title);
    const time=document.createElementNS('http://www.w3.org/2000/svg','text');time.setAttribute('x',0);time.setAttribute('y',16);time.setAttribute('text-anchor','middle');time.setAttribute('fill','#8a8279');time.setAttribute('font-size',10);time.classList.add('tree-node-text');time.textContent=n.time_label;gNode.appendChild(time);
    gNode.addEventListener('click',e=>{e.stopPropagation();selectNode(nid);});
    gNode.addEventListener('mouseenter',e=>{const r=gNode.getBoundingClientRect();showTooltip(n,r.left+r.width/2,r.top);});
    gNode.addEventListener('mouseleave',hideTooltip);
    g.appendChild(gNode);
    const bChildren=civ.nodes.filter(x=>x.prerequisites.includes(nid)&&x.layout.lane!=='main');
    const hidden=bChildren.filter(x=>!pos.has(x.id));
    const showBranchBtn=treeMode==='standard'&&bChildren.length&&(hidden.length||expandedBranches.has(nid));
    if(showBranchBtn){
      const tg=document.createElementNS('http://www.w3.org/2000/svg','g');tg.classList.add('branch-btn');tg.setAttribute('transform',`translate(${p.x+70},${p.y+10})`);
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',10);c.setAttribute('fill',hidden.length?'#555':'#d4a056');tg.appendChild(c);
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');txt.setAttribute('text-anchor','middle');txt.setAttribute('dy','3');txt.setAttribute('fill','#fff');txt.setAttribute('font-size',12);txt.setAttribute('font-family','Inter');txt.textContent=hidden.length?'+':'−';tg.appendChild(txt);
      tg.addEventListener('click',e=>{e.stopPropagation();if(expandedBranches.has(nid))expandedBranches.delete(nid);else expandedBranches.add(nid);renderTree();});
      g.appendChild(tg);
    }
  });
  // 高亮与选中节点相关的连线
if(selectedNodeId){
  g.querySelectorAll('.tree-link').forEach(link=>{
    const from=link.dataset.from,to=link.dataset.to;
    if(from===selectedNodeId||to===selectedNodeId){link.classList.add('highlight','flow');}
    else{link.classList.add('dimmed');}
  });
}

  }
})();
updateTransform();setTimeout(()=>{if(!panX&&!panY)treeFit();},50);
}
function bezier(x1,y1,x2,y2){const my=(y1+y2)/2;return `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;}
function autoZoomToNode(nid){
  const civ=getCiv(currentCivId);
  const np=nodePos.get(nid);if(!np)return;
  const children=civ.nodes.filter(x=>x.prerequisites.includes(nid));
  let ids=[nid];children.forEach(c=>ids.push(c.id));
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  ids.forEach(id=>{const p=nodePos.get(id);if(p){minX=Math.min(minX,p.x-110);minY=Math.min(minY,p.y-55);maxX=Math.max(maxX,p.x+110);maxY=Math.max(maxY,p.y+55);}});
  const svg=$('#tree-svg');const gw=svg.clientWidth,gh=svg.clientHeight;
  const cw=maxX-minX||400,ch=maxY-minY||300;
  let s;
  if(children.length===0){s=Math.min(gw/400,gh/300,1.3);}
  else{s=Math.min(gw/cw,gh/ch,.9)*.88;}
  zoom=Math.max(.5,Math.min(2,s));
  panX=(gw-cw*zoom)/2-minX*zoom;
  panY=(gh-ch*zoom)/2-minY*zoom;
  updateTransform();
}
function isRelated(selId,testId,civ){const sel=getNode(currentCivId,selId);if(!sel)return false;if(sel.related_nodes.includes(testId)||sel.prerequisites.includes(testId)||sel.unlocks.includes(testId))return true;return false;}
function updateTransform(){$('#tree-g').setAttribute('transform',`translate(${panX},${panY}) scale(${zoom})`);}
function showTooltip(node,x,y){const t=$('#exp-tooltip');t.innerHTML=`<div class="exp-tooltip-title">${node.title}</div><div class="exp-tooltip-time">${node.time_label}</div><div class="exp-tooltip-summary">${node.summary}</div>${node.world_event_links.length?'<div class="exp-tooltip-events">'+node.world_event_links.map(eid=>{const e=getEvent(eid);return e?`<span class="exp-tooltip-event-chip">${e.title}</span>`:''}).join('')+'</div>':''}`;const r=$('.exp-main').getBoundingClientRect();t.style.left=(x-r.left+12)+'px';t.style.top=(y-r.top+12)+'px';t.classList.add('show');}
function hideTooltip(){$('#exp-tooltip').classList.remove('show');}

const tsvg=$('#tree-svg');
if(tsvg){
  tsvg.addEventListener('mousedown',e=>{if(e.target.closest('.tree-node-group')||e.target.closest('.branch-btn'))return;isDrag=true;dragMoved=false;dragStart={x:e.clientX-panX,y:e.clientY-panY};tsvg.style.cursor='grabbing';});
  window.addEventListener('mousemove',e=>{if(!isDrag)return;dragMoved=true;panX=e.clientX-dragStart.x;panY=e.clientY-dragStart.y;updateTransform();});
  window.addEventListener('mouseup',()=>{isDrag=false;tsvg.style.cursor='grab';});
  tsvg.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY>0?.9:1.1;zoom=Math.max(.4,Math.min(2.5,zoom*d));updateTransform();},{passive:false});
  tsvg.addEventListener('dblclick',treeFit);
// 点击节点外空白处退出面板
const expMain=$('.exp-main');
if(expMain){
  expMain.addEventListener('click',e=>{
    if(dragMoved)return;
    if(!e.target.closest('.tree-node-group')&&!e.target.closest('.branch-btn')&&!e.target.closest('#exp-panel')){
      clearSelection();
      treeFit();
    }
  });
}
}

function initCompare(){
  renderCompareSlots();
  renderCompareDims();
  if(compareState.a&&compareState.b)renderComparison();
}
function renderCompareSlots(){
  const el=$('#compare-slots');el.innerHTML='';
  ['a','b'].forEach(slot=>{
    const civ=compareState[slot]?getCiv(compareState[slot]):null;
    const d=document.createElement('div');d.className='compare-slot'+(civ?' filled':'');
    if(civ){d.innerHTML=`<div class="slot-name" style="color:${civ.color}">${civ.name}</div><div class="slot-era">${civ.era}</div>`;}else{d.innerHTML='<span style="color:#6a6359">选择文明 '+slot.toUpperCase()+'</span>';}
    d.onclick=()=>{compareSlot=slot;openCivModal();};
    el.appendChild(d);
  });
  const vs=document.createElement('div');vs.className='compare-vs';vs.textContent='VS';el.appendChild(vs);
}
function renderCompareDims(){
  const el=$('#compare-dims');el.innerHTML=DIMS.map(d=>`<button class="compare-dim ${compareState.dim===d.id?'active':''}" onclick="setCompareDim('${d.id}')">${d.name}</button>`).join('');
}
window.setCompareDim=function(id){compareState.dim=id;initCompare();};
function openCivModal(){
  const mg=$('#modal-grid');mg.innerHTML='';
  DATA.civilizations.forEach(c=>{
    const d=document.createElement('div');d.className='modal-opt';
    d.innerHTML=`<div class="modal-opt-dot" style="background:${c.color}"></div><div class="modal-opt-name">${c.name}</div>`;
    d.onclick=()=>{compareState[compareSlot]=c.id;if(compareState.a===compareState.b){alert('请选择两个不同的文明');compareState[compareSlot]=null;}closeCivModal();initCompare();};
    mg.appendChild(d);
  });
  $('#civ-modal').classList.add('show');
}
window.closeCivModal=function(){$('#civ-modal').classList.remove('show');};
function renderComparison(){
  const ca=getCiv(compareState.a),cb=getCiv(compareState.b);
  if(!ca||!cb)return;
  const dim=DIMS.find(d=>d.id===compareState.dim);
  const na=ca.nodes.filter(n=>n.category===compareState.dim).sort((a,b)=>a.year-b.year);
  const nb=cb.nodes.filter(n=>n.category===compareState.dim).sort((a,b)=>a.year-b.year);
  $('#compare-results').innerHTML=`<div class="compare-grid"><div><div class="compare-col-header"><div class="compare-col-name" style="color:${ca.color}">${ca.name}</div><div class="compare-col-bar" style="background:${ca.color}"></div></div>${na.map(n=>`<div class="compare-node-card"><div class="compare-node-time">${n.time_label}</div><div class="compare-node-title">${n.title}</div><div class="compare-node-summary">${n.summary}</div></div>`).join('')}</div><div><div class="compare-col-header"><div class="compare-col-name" style="color:${cb.color}">${cb.name}</div><div class="compare-col-bar" style="background:${cb.color}"></div></div>${nb.map(n=>`<div class="compare-node-card"><div class="compare-node-time">${n.time_label}</div><div class="compare-node-title">${n.title}</div><div class="compare-node-summary">${n.summary}</div></div>`).join('')}</div></div><div class="compare-conclusion">${generateConclusion(ca,cb,na,nb,dim.name)}</div>`;
}
function generateConclusion(a,b,na,nb,dn){
  if(!na.length&&!nb.length)return`两文明在${dn}维度上暂无可直接对照的公开节点。`;
  return`${a.name}与${b.name}在${dn}维度上各有${na.length}个与${nb.length}个关键节点。${na.length?a.name+'的「'+na[0].title+'」':''}${na.length&&nb.length?'与':''}${nb.length?b.name+'的「'+nb[0].title+'」':''}展现了不同文明面对相似挑战时的独特路径选择。`;
}

renderHome();
</script>
