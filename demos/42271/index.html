<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>萌趣番茄工作清单 - 艾森豪威尔专注日程管理</title>
  <meta name="description" content="一个充满可爱卡通风格的番茄钟工作清单应用。集成艾森豪威尔工作四象限、番茄钟自动流转结算、温和提示音及萌宠背景切换，帮助您高效专注。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Utilities -->
  <div class="floating-settings">
    <!-- Quick Test Mode Toggle -->
    <button class="settings-btn" id="btn-toggle-test" title="快速测试模式 (10秒番茄钟)" aria-label="Toggle test mode">
      🧪
    </button>
    <!-- Background Switcher Toggle -->
    <button class="settings-btn" id="btn-toggle-bg" title="更换背景" aria-label="Change background">
      🎨
    </button>
  </div>

  <!-- Background Switcher Dropdown -->
  <div class="bg-menu" id="bg-menu">
    <div class="bg-option active" data-bg="bg_cute_cat" role="button" tabindex="0">
      <img src="assets/bg_cute_cat.png" alt="猫咪工位">
      <span>懒懒猫咪 🐱</span>
    </div>
    <div class="bg-option" data-bg="bg_cute_rabbit" role="button" tabindex="0">
      <img src="assets/bg_cute_rabbit.png" alt="兔子花园">
      <span>粉黛兔兔 🐰</span>
    </div>
    <div class="bg-option" data-bg="bg_cute_stars" role="button" tabindex="0">
      <img src="assets/bg_cute_stars.png" alt="星空梦境">
      <span>捕星小熊 🐻</span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="app-container" id="app-container">
    
    <!-- Left Pane: Focus Timer Dashboard -->
    <aside class="timer-pane">
      <div class="logo-section">
        <h1 class="logo-title">萌趣清单</h1>
        <p class="logo-subtitle">今日专注，从每个小番茄开始</p>
      </div>

      <!-- Cute Animal Face Clock -->
      <div class="clock-container">
        <div class="ear-inner-left"></div>
        <div class="ear-inner-right"></div>
        <div class="clock-face">
          <div class="clock-eye left"></div>
          <div class="clock-eye right"></div>
          <div class="clock-blush left"></div>
          <div class="clock-blush right"></div>
          <div class="clock-mouth"></div>
        </div>
        <div class="clock-timer" id="clock-timer">25:00</div>
        <div class="clock-state" id="clock-state">Focus</div>
      </div>

      <!-- Currently Focus Task -->
      <div class="focus-task-container">
        <div class="focus-task-title">当前专注于</div>
        <div class="focus-task-name" id="focus-task-name">请从右侧列表选择任务开始</div>
        <button class="btn-enter-fullscreen" id="btn-enter-fullscreen" type="button">📺 全屏专注</button>
      </div>

      <!-- Controls -->
      <div class="timer-controls">
        <button class="btn-timer secondary" id="btn-timer-reset" title="重置番茄钟" aria-label="Reset timer">
          <svg viewBox="0 0 24 24">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          </svg>
        </button>
        <button class="btn-timer primary" id="btn-timer-toggle" title="开始/暂停专注" aria-label="Start or pause timer">
          <svg viewBox="0 0 24 24" id="play-pause-icon">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
        <button class="btn-timer secondary" id="btn-timer-skip" title="跳过该阶段" aria-label="Skip stage">
          <svg viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Right Pane: Eisenhower Task Manager -->
    <main class="tasks-pane">
      <!-- Test Mode Banner -->
      <div class="test-banner" id="test-banner" style="display: none;">
        <span>🧪 <b>快速测试模式已开启：</b>番茄钟缩短为 10秒，休息缩短为 3秒。</span>
        <button id="btn-close-test-banner">关闭</button>
      </div>

      <!-- Add Task Form Card -->
      <form class="add-task-form" id="add-task-form" onsubmit="event.preventDefault();">
        <div class="form-row-1">
          <input type="text" class="input-task-name" id="task-name-input" placeholder="写下你想专注的事情..." required maxlength="40">
          <button type="submit" class="btn-add-submit" id="btn-add-submit" title="添加任务" aria-label="Add task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </button>
        </div>
        <div class="form-row-2">
          <!-- Urgency & Importance Selection -->
          <div class="form-group">
            <label class="form-label" for="task-quadrant-select">轻重缓急：</label>
            <select class="custom-select" id="task-quadrant-select">
              <option value="urgent-important">🔴 紧急且重要 (立即做)</option>
              <option value="important-not">🟡 重要但不紧急 (计划做)</option>
              <option value="urgent-not">🔵 紧急但不重要 (授权做)</option>
              <option value="not-not">🟢 不紧急不重要 (暂缓做)</option>
            </select>
          </div>
          <!-- Pomodoro Estimate -->
          <div class="form-group">
            <span class="form-label">预计番茄：</span>
            <div class="tomato-selector" id="tomato-selector">
              <button type="button" class="tomato-select-btn active" data-val="1">🍅</button>
              <button type="button" class="tomato-select-btn" data-val="2">🍅</button>
              <button type="button" class="tomato-select-btn" data-val="3">🍅</button>
              <button type="button" class="tomato-select-btn" data-val="4">🍅</button>
              <button type="button" class="tomato-select-btn" data-val="5">🍅</button>
            </div>
          </div>
        </div>
      </form>

      <!-- Quadrants Switch Tabs -->
      <nav class="quadrant-tabs" id="quadrant-tabs">
        <div class="tab-item urgent-important active" data-tab="urgent-important" role="tab" aria-selected="true">
          <span>🔴 紧急重要</span>
          <span class="tab-badge" id="badge-ui">0</span>
        </div>
        <div class="tab-item important-not" data-tab="important-not" role="tab" aria-selected="false">
          <span>🟡 重要非紧急</span>
          <span class="tab-badge" id="badge-in">0</span>
        </div>
        <div class="tab-item urgent-not" data-tab="urgent-not" role="tab" aria-selected="false">
          <span>🔵 紧急非重要</span>
          <span class="tab-badge" id="badge-un">0</span>
        </div>
        <div class="tab-item not-not" data-tab="not-not" role="tab" aria-selected="false">
          <span>🟢 随缘放置</span>
          <span class="tab-badge" id="badge-nn">0</span>
        </div>
        <div class="tab-item completed" data-tab="completed" role="tab" aria-selected="false">
          <span>✅ 已完成</span>
          <span class="tab-badge" id="badge-comp">0</span>
        </div>
      </nav>

      <!-- Scrollable Tasks List Area -->
      <div class="tasks-scroll-area">
        <div class="tasks-list" id="tasks-list">
          <!-- Dynamically Rendered Tasks Go Here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Fullscreen Focus Overlay -->
  <div class="focus-overlay" id="focus-overlay">
    <!-- Close/Exit Button -->
    <button class="exit-focus-btn" id="btn-exit-focus" title="退出全屏专注" aria-label="Exit fullscreen focus">✕</button>
    
    <div class="focus-overlay-content">
      <div class="focus-task-header">✨ 正在专注中 ✨</div>
      <h2 class="focus-overlay-task-name" id="overlay-task-name">任务名称</h2>
      
      <!-- Larger Cute Animal Clock -->
      <div class="clock-container large-clock">
        <div class="ear-inner-left"></div>
        <div class="ear-inner-right"></div>
        <div class="clock-face">
          <div class="clock-eye left"></div>
          <div class="clock-eye right"></div>
          <div class="clock-blush left"></div>
          <div class="clock-blush right"></div>
          <div class="clock-mouth"></div>
        </div>
        <div class="clock-timer" id="overlay-clock-timer">25:00</div>
        <div class="clock-state" id="overlay-clock-state">Focus</div>
      </div>
      
      <!-- Overlay controls -->
      <div class="timer-controls large-controls">
        <button class="btn-timer secondary large" id="btn-overlay-skip" title="提前结束并结算" aria-label="Skip or finish early">
          <svg viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
        <button class="btn-timer primary large" id="btn-overlay-toggle" title="暂停/继续" aria-label="Pause or resume timer">
          <svg viewBox="0 0 24 24" id="overlay-play-pause-icon">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Completion Settle Modal Overlay -->
  <div class="modal-overlay" id="settle-modal">
    <div class="cute-modal">
      <div class="modal-mascot">🎉</div>
      <h2 class="modal-title">专注时间结束啦！</h2>
      <p class="modal-text">做得非常好，你刚才完成了这一个番茄钟：</p>
      <div class="modal-task-box" id="settle-task-name">
        写写日记
      </div>
      <p class="modal-text">这个任务已经顺利完成了么？</p>
      <div class="modal-buttons">
        <button class="btn-modal success" id="btn-settle-completed">完成了！✨</button>
        <button class="btn-modal danger" id="btn-settle-continue">未完成，下个继续 🍅</button>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
