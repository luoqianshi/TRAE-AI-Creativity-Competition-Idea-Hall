<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄专注 - Pomodoro Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep: #0f1a12;
    --bg-card: #1a2b1e;
    --bg-card-hover: #223628;
    --fg: #e8efe4;
    --fg-muted: #8fa88a;
    --accent: #e74c3c;
    --accent-glow: rgba(231, 76, 60, 0.35);
    --accent-soft: #ff6b5a;
    --green-bright: #4caf50;
    --green-soft: #2e7d32;
    --border: rgba(255,255,255,0.06);
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --font-display: 'DM Serif Display', serif;
    --font-body: 'Noto Sans SC', sans-serif;
  }

  html { font-size: 16px; }

  body {
    font-family: var(--font-body);
    background: var(--bg-deep);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== Background Atmosphere ===== */
  body::before {
    content: '';
    position: fixed;
    top: -30%; left: -20%;
    width: 70vw; height: 70vw;
    background: radial-gradient(circle, rgba(46,125,50,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%; right: -15%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, rgba(231,76,60,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .noise-overlay {
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  /* ===== Layout ===== */
  .app-container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 20px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== Header ===== */
  .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding: 0 4px;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 20px var(--accent-glow);
    position: relative;
    overflow: hidden;
  }
  .brand-icon::after {
    content: '';
    position: absolute;
    top: 4px; left: 6px;
    width: 8px; height: 4px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: rotate(-20deg);
  }
  .brand-title {
    font-family: var(--font-display);
    font-size: 1.35rem;
    letter-spacing: 0.5px;
    color: var(--fg);
  }
  .header-date {
    font-size: 0.8rem;
    color: var(--fg-muted);
    font-weight: 300;
  }

  /* ===== Mode Tabs ===== */
  .mode-tabs {
    display: flex;
    gap: 6px;
    background: var(--bg-card);
    border-radius: 50px;
    padding: 4px;
    margin-bottom: 40px;
    border: 1px solid var(--border);
  }
  .mode-tab {
    padding: 10px 22px;
    border-radius: 50px;
    border: none;
    background: transparent;
    color: var(--fg-muted);
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .mode-tab:hover {
    color: var(--fg);
  }
  .mode-tab.active {
    background: var(--accent);
    color: #fff;
    font-weight: 500;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .mode-tab.active[data-mode="break"] {
    background: var(--green-soft);
    box-shadow: 0 4px 16px rgba(46,125,50,0.35);
  }
  .mode-tab.active[data-mode="longbreak"] {
    background: #1565c0;
    box-shadow: 0 4px 16px rgba(21,101,192,0.35);
  }

  /* ===== Timer Circle ===== */
  .timer-section {
    position: relative;
    width: 280px;
    height: 280px;
    margin-bottom: 36px;
  }
  .timer-bg-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.04);
  }
  .timer-progress-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  .timer-progress-ring svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .timer-progress-ring circle {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s ease;
  }
  .timer-progress-ring .track {
    stroke: rgba(255,255,255,0.05);
  }
  .timer-progress-ring .progress {
    stroke: var(--accent);
    filter: drop-shadow(0 0 10px var(--accent-glow));
    transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
  }
  .timer-progress-ring .progress.break-mode {
    stroke: var(--green-bright);
    filter: drop-shadow(0 0 10px rgba(76,175,80,0.4));
  }
  .timer-progress-ring .progress.longbreak-mode {
    stroke: #42a5f5;
    filter: drop-shadow(0 0 10px rgba(66,165,245,0.4));
  }

  .timer-inner {
    position: absolute;
    inset: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, var(--bg-card-hover), var(--bg-card));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    box-shadow: inset 0 2px 20px rgba(0,0,0,0.3);
  }
  .timer-time {
    font-family: var(--font-display);
    font-size: 3.6rem;
    letter-spacing: 2px;
    line-height: 1;
    margin-bottom: 6px;
    color: var(--fg);
  }
  .timer-label {
    font-size: 0.75rem;
    color: var(--fg-muted);
    font-weight: 300;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Breathing animation when running */
  .timer-section.running .timer-inner {
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: inset 0 2px 20px rgba(0,0,0,0.3), 0 0 0 0 transparent; }
    50% { box-shadow: inset 0 2px 20px rgba(0,0,0,0.3), 0 0 40px rgba(231,76,60,0.1); }
  }
  .timer-section.running.break-active .timer-inner {
    animation: breathe-green 4s ease-in-out infinite;
  }
  @keyframes breathe-green {
    0%, 100% { box-shadow: inset 0 2px 20px rgba(0,0,0,0.3), 0 0 0 0 transparent; }
    50% { box-shadow: inset 0 2px 20px rgba(0,0,0,0.3), 0 0 40px rgba(76,175,80,0.12); }
  }

  /* ===== Controls ===== */
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 40px;
  }
  .btn {
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-secondary {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--bg-card);
    color: var(--fg-muted);
    font-size: 1.1rem;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: var(--bg-card-hover);
    color: var(--fg);
    transform: scale(1.08);
  }
  .btn-primary {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 1.5rem;
    box-shadow: 0 6px 24px var(--accent-glow);
    position: relative;
    overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  }
  .btn-primary:hover {
    transform: scale(1.06);
    box-shadow: 0 8px 32px var(--accent-glow);
  }
  .btn-primary:active {
    transform: scale(0.96);
  }
  .btn-primary.break-mode {
    background: var(--green-soft);
    box-shadow: 0 6px 24px rgba(46,125,50,0.35);
  }
  .btn-primary.longbreak-mode {
    background: #1565c0;
    box-shadow: 0 6px 24px rgba(21,101,192,0.35);
  }

  .btn-icon {
    width: 20px; height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .btn-primary .btn-icon {
    width: 28px; height: 28px;
    stroke-width: 2.5;
  }

  /* ===== Task Input ===== */
  .task-section {
    width: 100%;
    margin-bottom: 28px;
  }
  .task-section label {
    display: block;
    font-size: 0.72rem;
    color: var(--fg-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 400;
  }
  .task-input-wrapper {
    position: relative;
  }
  .task-input {
    width: 100%;
    padding: 14px 18px;
    padding-right: 50px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 0.9rem;
    outline: none;
    transition: all 0.3s ease;
  }
  .task-input::placeholder {
    color: rgba(143,168,138,0.5);
  }
  .task-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(231,76,60,0.1);
  }
  .task-add-btn {
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    transition: all 0.2s ease;
  }
  .task-add-btn:hover {
    background: var(--accent-soft);
    transform: translateY(-50%) scale(1.05);
  }

  /* ===== Task List ===== */
  .task-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 32px;
  }
  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: all 0.3s ease;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-item:hover {
    background: var(--bg-card-hover);
  }
  .task-item.completed {
    opacity: 0.45;
  }
  .task-item.completed .task-text {
    text-decoration: line-through;
  }
  .task-check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--fg-muted);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s ease;
    color: transparent;
    font-size: 0.7rem;
  }
  .task-check:hover {
    border-color: var(--green-bright);
  }
  .task-item.completed .task-check {
    background: var(--green-bright);
    border-color: var(--green-bright);
    color: #fff;
  }
  .task-text {
    flex: 1;
    font-size: 0.88rem;
    color: var(--fg);
    font-weight: 300;
  }
  .task-pomodoros {
    font-size: 0.7rem;
    color: var(--accent-soft);
    background: rgba(231,76,60,0.12);
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .task-delete {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--fg-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    opacity: 0;
    transition: all 0.2s ease;
  }
  .task-item:hover .task-delete {
    opacity: 1;
  }
  .task-delete:hover {
    background: rgba(231,76,60,0.15);
    color: var(--accent);
  }

  /* ===== Stats Panel ===== */
  .stats-panel {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }
  .stats-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .stats-title {
    font-family: var(--font-display);
    font-size: 1.15rem;
  }
  .stats-period {
    font-size: 0.72rem;
    color: var(--fg-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    text-align: center;
    padding: 16px 8px;
    background: rgba(255,255,255,0.02);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .stat-value {
    font-family: var(--font-display);
    font-size: 1.8rem;
    color: var(--fg);
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat-value.accent { color: var(--accent-soft); }
  .stat-value.green { color: var(--green-bright); }
  .stat-label {
    font-size: 0.68rem;
    color: var(--fg-muted);
    letter-spacing: 0.5px;
  }

  /* Weekly chart */
  .weekly-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
    height: 100px;
    padding-top: 10px;
  }
  .chart-bar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    height: 100%;
    justify-content: flex-end;
  }
  .chart-bar {
    width: 100%;
    max-width: 32px;
    border-radius: 6px 6px 2px 2px;
    background: linear-gradient(to top, var(--accent), var(--accent-soft));
    min-height: 4px;
    transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }
  .chart-bar::after {
    content: attr(data-value);
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.6rem;
    color: var(--fg-muted);
    white-space: nowrap;
  }
  .chart-day {
    font-size: 0.65rem;
    color: var(--fg-muted);
    letter-spacing: 0.5px;
  }
  .chart-bar-wrapper.today .chart-bar {
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* ===== Settings Panel ===== */
  .settings-toggle {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 100;
  }
  .settings-panel {
    position: fixed;
    top: 0; right: -360px;
    width: 340px;
    height: 100vh;
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    z-index: 99;
    padding: 32px 24px;
    transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    overflow-y: auto;
  }
  .settings-panel.open {
    right: 0;
  }
  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 98;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .settings-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .settings-close {
    position: absolute;
    top: 20px; right: 20px;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    transition: all 0.2s ease;
  }
  .settings-close:hover {
    background: var(--bg-card-hover);
    color: var(--fg);
  }
  .settings-title {
    font-family: var(--font-display);
    font-size: 1.3rem;
    margin-bottom: 28px;
  }
  .setting-group {
    margin-bottom: 24px;
  }
  .setting-label {
    font-size: 0.72rem;
    color: var(--fg-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-name {
    font-size: 0.88rem;
    color: var(--fg);
    font-weight: 300;
  }
  .setting-control {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .setting-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-deep);
    color: var(--fg-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.2s ease;
  }
  .setting-btn:hover {
    background: var(--bg-card-hover);
    color: var(--fg);
  }
  .setting-value {
    font-size: 0.9rem;
    color: var(--fg);
    min-width: 30px;
    text-align: center;
    font-weight: 500;
  }

  /* Toggle switch */
  .toggle-switch {
    width: 44px; height: 24px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    cursor: pointer;
    position: relative;
    transition: background 0.3s ease;
    border: none;
  }
  .toggle-switch.active {
    background: var(--green-soft);
  }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.3s ease;
  }
  .toggle-switch.active::after {
    transform: translateX(20px);
  }

  /* ===== Toast Notification ===== */
  .toast-container {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    padding: 14px 24px;
    border-radius: 50px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--fg);
    font-size: 0.85rem;
    box-shadow: var(--shadow);
    animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
    white-space: nowrap;
    backdrop-filter: blur(12px);
  }
  .toast.success { border-color: var(--green-bright); }
  .toast.info { border-color: var(--accent); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-16px); }
  }

  /* ===== Completion Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 150;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    max-width: 360px;
    width: 90%;
    transform: scale(0.9);
    transition: transform 0.3s ease;
    box-shadow: var(--shadow);
  }
  .modal-overlay.show .modal {
    transform: scale(1);
  }
  .modal-icon {
    font-size: 3rem;
    margin-bottom: 16px;
    display: block;
  }
  .modal-title {
    font-family: var(--font-display);
    font-size: 1.4rem;
    margin-bottom: 8px;
  }
  .modal-text {
    font-size: 0.88rem;
    color: var(--fg-muted);
    font-weight: 300;
    margin-bottom: 24px;
    line-height: 1.6;
  }
  .modal-btn {
    padding: 12px 32px;
    border-radius: 50px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-body);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .modal-btn:hover {
    transform: scale(1.04);
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .modal-btn.green {
    background: var(--green-soft);
  }

  /* ===== Responsive ===== */
  @media (max-width: 500px) {
    .app-container { padding: 16px 16px 32px; }
    .timer-section { width: 240px; height: 240px; }
    .timer-time { font-size: 3rem; }
    .stats-grid { gap: 8px; }
    .stat-value { font-size: 1.5rem; }
    .settings-panel { width: 100%; right: -100%; }
  }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  /* ===== Floating particles ===== */
  .particles {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(231,76,60,0.15);
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }

  /* ===== Empty state ===== */
  .empty-state {
    text-align: center;
    padding: 24px;
    color: var(--fg-muted);
    font-size: 0.82rem;
    font-weight: 300;
    opacity: 0.6;
  }

  /* ===== Session dots ===== */
  .session-dots {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    justify-content: center;
  }
  .session-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    transition: all 0.3s ease;
  }
  .session-dot.filled {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }
</style>
</head>
<body>

<div class="noise-overlay"></div>
<div class="particles" id="particles"></div>
<div class="toast-container" id="toastContainer"></div>

<!-- Settings -->
<button class="btn btn-secondary settings-toggle" onclick="toggleSettings()" title="设置">
  <svg class="btn-icon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
</button>

<div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
<div class="settings-panel" id="settingsPanel">
  <button class="settings-close" onclick="toggleSettings()">&times;</button>
  <div class="settings-title">专注设置</div>

  <div class="setting-group">
    <span class="setting-label">时间配置</span>
    <div class="setting-row">
      <span class="setting-name">专注时长</span>
      <div class="setting-control">
        <button class="setting-btn" onclick="adjustSetting('focus', -5)">-</button>
        <span class="setting-value" id="focusVal">25</span>
        <button class="setting-btn" onclick="adjustSetting('focus', 5)">+</button>
        <span style="font-size:0.75rem;color:var(--fg-muted)">分钟</span>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-name">短休息</span>
      <div class="setting-control">
        <button class="setting-btn" onclick="adjustSetting('shortBreak', -1)">-</button>
        <span class="setting-value" id="shortBreakVal">5</span>
        <button class="setting-btn" onclick="adjustSetting('shortBreak', 1)">+</button>
        <span style="font-size:0.75rem;color:var(--fg-muted)">分钟</span>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-name">长休息</span>
      <div class="setting-control">
        <button class="setting-btn" onclick="adjustSetting('longBreak', -5)">-</button>
        <span class="setting-value" id="longBreakVal">15</span>
        <button class="setting-btn" onclick="adjustSetting('longBreak', 5)">+</button>
        <span style="font-size:0.75rem;color:var(--fg-muted)">分钟</span>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-name">长休息间隔</span>
      <div class="setting-control">
        <button class="setting-btn" onclick="adjustSetting('longBreakInterval', -1)">-</button>
        <span class="setting-value" id="longBreakIntervalVal">4</span>
        <button class="setting-btn" onclick="adjustSetting('longBreakInterval', 1)">+</button>
        <span style="font-size:0.75rem;color:var(--fg-muted)">轮</span>
      </div>
    </div>
  </div>

  <div class="setting-group">
    <span class="setting-label">提示与提醒</span>
    <div class="setting-row">
      <span class="setting-name">声音提醒</span>
      <button class="toggle-switch active" id="soundToggle" onclick="toggleSound()"></button>
    </div>
    <div class="setting-row">
      <span class="setting-name">自动开始下一轮</span>
      <button class="toggle-switch" id="autoStartToggle" onclick="toggleAutoStart()"></button>
    </div>
  </div>

  <div class="setting-group" style="margin-top:32px;">
    <button class="modal-btn" style="width:100%;background:var(--bg-deep);border:1px solid var(--border);color:var(--fg-muted);" onclick="resetStats()">重置统计数据</button>
  </div>
</div>

<!-- Completion Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <span class="modal-icon" id="modalIcon">🍅</span>
    <div class="modal-title" id="modalTitle">专注完成！</div>
    <div class="modal-text" id="modalText">你已完成一个番茄钟，休息一下吧。</div>
    <button class="modal-btn" id="modalBtn" onclick="closeModal()">开始休息</button>
  </div>
</div>

<!-- Main App -->
<div class="app-container">
  <header class="header">
    <div class="header-brand">
      <div class="brand-icon">🍅</div>
      <span class="brand-title">番茄专注</span>
    </div>
    <span class="header-date" id="headerDate"></span>
  </header>

  <!-- Mode Tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="focus" onclick="switchMode('focus')">专注</button>
    <button class="mode-tab" data-mode="break" onclick="switchMode('break')">短休息</button>
    <button class="mode-tab" data-mode="longbreak" onclick="switchMode('longbreak')">长休息</button>
  </div>

  <!-- Session Dots -->
  <div class="session-dots" id="sessionDots"></div>

  <!-- Timer -->
  <div class="timer-section" id="timerSection">
    <div class="timer-bg-ring"></div>
    <div class="timer-progress-ring">
      <svg viewBox="0 0 280 280">
        <circle class="track" cx="140" cy="140" r="132"></circle>
        <circle class="progress" id="progressCircle" cx="140" cy="140" r="132"
          stroke-dasharray="829.38" stroke-dashoffset="0"></circle>
      </svg>
    </div>
    <div class="timer-inner">
      <div class="timer-time" id="timerDisplay">25:00</div>
      <div class="timer-label" id="timerLabel">准备专注</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-secondary" onclick="resetTimer()" title="重置">
      <svg class="btn-icon" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg>
    </button>
    <button class="btn btn-primary" id="mainBtn" onclick="toggleTimer()">
      <svg class="btn-icon" id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg class="btn-icon" id="pauseIcon" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <button class="btn btn-secondary" onclick="skipTimer()" title="跳过">
      <svg class="btn-icon" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
    </button>
  </div>

  <!-- Task Input -->
  <div class="task-section">
    <label>当前任务</label>
    <div class="task-input-wrapper">
      <input type="text" class="task-input" id="taskInput" placeholder="输入你的专注任务..." maxlength="50"
        onkeydown="if(event.key==='Enter')addTask()">
      <button class="task-add-btn" onclick="addTask()">+</button>
    </div>
  </div>

  <!-- Task List -->
  <div class="task-list" id="taskList">
    <div class="empty-state" id="emptyState">添加一个任务开始专注吧</div>
  </div>

  <!-- Stats Panel -->
  <div class="stats-panel">
    <div class="stats-header">
      <span class="stats-title">今日统计</span>
      <span class="stats-period" id="statsPeriod"></span>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value accent" id="statPomodoros">0</div>
        <div class="stat-label">完成番茄</div>
      </div>
      <div class="stat-card">
        <div class="stat-value green" id="statMinutes">0</div>
        <div class="stat-label">专注分钟</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statTasks">0</div>
        <div class="stat-label">完成任务</div>
      </div>
    </div>
    <div class="weekly-chart" id="weeklyChart"></div>
  </div>
</div>

<script>
// ===== State =====
const state = {
  mode: 'focus', // focus | break | longbreak
  isRunning: false,
  timeLeft: 25 * 60,
  totalTime: 25 * 60,
  interval: null,
  sessionCount: 0,
  currentTaskId: null,
  tasks: [],
  settings: {
    focus: 25,
    shortBreak: 5,
    longBreak: 15,
    longBreakInterval: 4,
    sound: true,
    autoStart: false
  },
  stats: {
    pomodoros: 0,
    minutes: 0,
    tasksCompleted: 0,
    weekly: [0, 0, 0, 0, 0, 0, 0]
  }
};

// ===== Init =====
function init() {
  loadState();
  updateDate();
  renderSessionDots();
  renderTasks();
  updateStats();
  renderWeeklyChart();
  createParticles();
  updateTimerDisplay();
  updateProgressRing();
}

function loadState() {
  try {
    const saved = localStorage.getItem('pomodoro_state');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.settings) Object.assign(state.settings, data.settings);
      if (data.stats) Object.assign(state.stats, data.stats);
      if (data.tasks) state.tasks = data.tasks;
      if (data.sessionCount !== undefined) state.sessionCount = data.sessionCount;
    }
    // Check if it's a new day
    const today = new Date().toDateString();
    const lastDay = localStorage.getItem('pomodoro_lastDay');
    if (lastDay !== today) {
      // Shift weekly data
      state.stats.weekly.shift();
      state.stats.weekly.push(0);
      state.stats.pomodoros = 0;
      state.stats.minutes = 0;
      state.stats.tasksCompleted = 0;
      localStorage.setItem('pomodoro_lastDay', today);
    }
  } catch(e) {}
  updateSettingsUI();
}

function saveState() {
  try {
    localStorage.setItem('pomodoro_state', JSON.stringify({
      settings: state.settings,
      stats: state.stats,
      tasks: state.tasks,
      sessionCount: state.sessionCount
    }));
  } catch(e) {}
}

// ===== Date =====
function updateDate() {
  const now = new Date();
  const opts = { month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('headerDate').textContent = now.toLocaleDateString('zh-CN', opts);
  document.getElementById('statsPeriod').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
}

// ===== Timer =====
function toggleTimer() {
  if (state.isRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (state.timeLeft <= 0) return;
  state.isRunning = true;
  updateTimerUI();
  document.getElementById('timerSection').classList.add('running');
  if (state.mode !== 'focus') {
    document.getElementById('timerSection').classList.add('break-active');
  }

  state.interval = setInterval(() => {
    state.timeLeft--;
    updateTimerDisplay();
    updateProgressRing();

    if (state.timeLeft <= 0) {
      completeTimer();
    }
  }, 1000);
}

function pauseTimer() {
  state.isRunning = false;
  clearInterval(state.interval);
  updateTimerUI();
  document.getElementById('timerSection').classList.remove('running', 'break-active');
}

function resetTimer() {
  pauseTimer();
  const times = {
    focus: state.settings.focus * 60,
    break: state.settings.shortBreak * 60,
    longbreak: state.settings.longBreak * 60
  };
  state.timeLeft = times[state.mode];
  state.totalTime = times[state.mode];
  updateTimerDisplay();
  updateProgressRing();
  document.getElementById('timerLabel').textContent = getModeLabel();
}

function skipTimer() {
  completeTimer();
}

function completeTimer() {
  pauseTimer();

  if (state.settings.sound) {
    playNotificationSound();
  }

  if (state.mode === 'focus') {
    state.sessionCount++;
    state.stats.pomodoros++;
    state.stats.minutes += state.settings.focus;
    state.stats.weekly[6]++;

    // Update task pomodoro count
    if (state.currentTaskId) {
      const task = state.tasks.find(t => t.id === state.currentTaskId);
      if (task) task.pomodoros++;
    }

    renderSessionDots();
    updateStats();
    saveState();

    // Show modal
    const isLongBreak = state.sessionCount % state.settings.longBreakInterval === 0;
    showModal(
      '🍅',
      '专注完成！',
      `太棒了！你已完成第 ${state.sessionCount} 个番茄钟，累计专注 ${state.stats.minutes} 分钟。${isLongBreak ? '该进行一次长休息了。' : '休息一下吧。'}`,
      isLongBreak ? '开始长休息' : '开始休息',
      isLongBreak ? 'green' : '',
      () => {
        if (isLongBreak) {
          switchMode('longbreak');
        } else {
          switchMode('break');
        }
        if (state.settings.autoStart) startTimer();
      }
    );
  } else {
    // Break completed
    showModal(
      '🌿',
      '休息结束',
      '精力已恢复，准备好开始新一轮专注了吗？',
      '开始专注',
      '',
      () => {
        switchMode('focus');
        if (state.settings.autoStart) startTimer();
      }
    );
  }
}

function switchMode(mode) {
  if (state.isRunning) pauseTimer();
  state.mode = mode;

  const times = {
    focus: state.settings.focus * 60,
    break: state.settings.shortBreak * 60,
    longbreak: state.settings.longBreak * 60
  };
  state.timeLeft = times[mode];
  state.totalTime = times[mode];

  // Update tabs
  document.querySelectorAll('.mode-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.mode === mode);
  });

  // Update button color
  const mainBtn = document.getElementById('mainBtn');
  mainBtn.className = 'btn btn-primary';
  if (mode === 'break') mainBtn.classList.add('break-mode');
  if (mode === 'longbreak') mainBtn.classList.add('longbreak-mode');

  // Update progress ring color
  const circle = document.getElementById('progressCircle');
  circle.className = 'progress';
  if (mode === 'break') circle.classList.add('break-mode');
  if (mode === 'longbreak') circle.classList.add('longbreak-mode');

  // Update timer section class
  const section = document.getElementById('timerSection');
  section.classList.remove('break-active');
  if (mode !== 'focus') section.classList.add('break-active');

  updateTimerDisplay();
  updateProgressRing();
  document.getElementById('timerLabel').textContent = getModeLabel();
}

function getModeLabel() {
  const labels = { focus: '准备专注', break: '短休息', longbreak: '长休息' };
  return labels[state.mode];
}

function updateTimerDisplay() {
  const mins = Math.floor(state.timeLeft / 60);
  const secs = state.timeLeft % 60;
  document.getElementById('timerDisplay').textContent =
    `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

  // Update page title
  if (state.isRunning) {
    document.title = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')} - 番茄专注`;
  } else {
    document.title = '番茄专注 - Pomodoro Focus';
  }
}

function updateProgressRing() {
  const circle = document.getElementById('progressCircle');
  const circumference = 2 * Math.PI * 132; // 829.38
  const progress = state.totalTime > 0 ? (state.totalTime - state.timeLeft) / state.totalTime : 0;
  circle.style.strokeDashoffset = circumference * (1 - progress);
}

function updateTimerUI() {
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  if (state.isRunning) {
    playIcon.style.display = 'none';
    pauseIcon.style.display = 'block';
    document.getElementById('timerLabel').textContent =
      state.mode === 'focus' ? '专注中...' : '休息中...';
  } else {
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
    document.getElementById('timerLabel').textContent = getModeLabel();
  }
}

// ===== Session Dots =====
function renderSessionDots() {
  const container = document.getElementById('sessionDots');
  const interval = state.settings.longBreakInterval;
  const current = state.sessionCount % interval;
  let html = '';
  for (let i = 0; i < interval; i++) {
    html += `<div class="session-dot ${i < current ? 'filled' : ''}"></div>`;
  }
  container.innerHTML = html;
}

// ===== Tasks =====
function addTask() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) return;

  const task = {
    id: Date.now(),
    text: text,
    completed: false,
    pomodoros: 0
  };
  state.tasks.unshift(task);
  input.value = '';

  if (!state.currentTaskId) {
    state.currentTaskId = task.id;
  }

  renderTasks();
  saveState();
  showToast('任务已添加', 'success');
}

function toggleTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (task) {
    task.completed = !task.completed;
    if (task.completed) {
      state.stats.tasksCompleted++;
      if (state.currentTaskId === id) {
        // Find next incomplete task
        const next = state.tasks.find(t => !t.completed && t.id !== id);
        state.currentTaskId = next ? next.id : null;
      }
    }
    renderTasks();
    updateStats();
    saveState();
  }
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  if (state.currentTaskId === id) {
    const next = state.tasks.find(t => !t.completed);
    state.currentTaskId = next ? next.id : null;
  }
  renderTasks();
  saveState();
}

function selectTask(id) {
  state.currentTaskId = id;
  renderTasks();
}

function renderTasks() {
  const container = document.getElementById('taskList');
  const emptyState = document.getElementById('emptyState');

  if (state.tasks.length === 0) {
    container.innerHTML = '<div class="empty-state">添加一个任务开始专注吧</div>';
    return;
  }

  let html = '';
  state.tasks.forEach(task => {
    const isActive = task.id === state.currentTaskId;
    html += `
      <div class="task-item ${task.completed ? 'completed' : ''} ${isActive ? 'active-task' : ''}"
           style="${isActive && !task.completed ? 'border-color: var(--accent);' : ''}"
           onclick="selectTask(${task.id})">
        <button class="task-check" onclick="event.stopPropagation();toggleTask(${task.id})">
          ${task.completed ? '✓' : ''}
        </button>
        <span class="task-text">${escapeHtml(task.text)}</span>
        ${task.pomodoros > 0 ? `<span class="task-pomodoros">🍅 ${task.pomodoros}</span>` : ''}
        <button class="task-delete" onclick="event.stopPropagation();deleteTask(${task.id})">&times;</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== Stats =====
function updateStats() {
  document.getElementById('statPomodoros').textContent = state.stats.pomodoros;
  document.getElementById('statMinutes').textContent = state.stats.minutes;
  document.getElementById('statTasks').textContent = state.stats.tasksCompleted;
}

function renderWeeklyChart() {
  const container = document.getElementById('weeklyChart');
  const days = ['一', '二', '三', '四', '五', '六', '日'];
  const today = new Date().getDay(); // 0=Sun
  const todayIndex = today === 0 ? 6 : today - 1;

  let html = '';
  for (let i = 0; i < 7; i++) {
    const val = state.stats.weekly[i] || 0;
    const maxVal = Math.max(...state.stats.weekly, 1);
    const height = Math.max(4, (val / maxVal) * 80);
    const isToday = i === todayIndex;
    html += `
      <div class="chart-bar-wrapper ${isToday ? 'today' : ''}">
        <div class="chart-bar" data-value="${val}" style="height:${height}px"></div>
        <span class="chart-day">${days[i]}</span>
      </div>
    `;
  }
  container.innerHTML = html;
}

// ===== Settings =====
function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  const overlay = document.getElementById('settingsOverlay');
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
}

function adjustSetting(key, delta) {
  const limits = {
    focus: { min: 5, max: 90 },
    shortBreak: { min: 1, max: 30 },
    longBreak: { min: 5, max: 60 },
    longBreakInterval: { min: 2, max: 8 }
  };
  const lim = limits[key];
  state.settings[key] = Math.max(lim.min, Math.min(lim.max, state.settings[key] + delta));
  updateSettingsUI();

  // Update timer if not running
  if (!state.isRunning) {
    const times = {
      focus: state.settings.focus * 60,
      break: state.settings.shortBreak * 60,
      longbreak: state.settings.longBreak * 60
    };
    state.timeLeft = times[state.mode];
    state.totalTime = times[state.mode];
    updateTimerDisplay();
    updateProgressRing();
  }

  if (key === 'longBreakInterval') renderSessionDots();
  saveState();
}

function updateSettingsUI() {
  document.getElementById('focusVal').textContent = state.settings.focus;
  document.getElementById('shortBreakVal').textContent = state.settings.shortBreak;
  document.getElementById('longBreakVal').textContent = state.settings.longBreak;
  document.getElementById('longBreakIntervalVal').textContent = state.settings.longBreakInterval;

  const soundToggle = document.getElementById('soundToggle');
  soundToggle.classList.toggle('active', state.settings.sound);

  const autoToggle = document.getElementById('autoStartToggle');
  autoToggle.classList.toggle('active', state.settings.autoStart);
}

function toggleSound() {
  state.settings.sound = !state.settings.sound;
  document.getElementById('soundToggle').classList.toggle('active', state.settings.sound);
  saveState();
}

function toggleAutoStart() {
  state.settings.autoStart = !state.settings.autoStart;
  document.getElementById('autoStartToggle').classList.toggle('active', state.settings.autoStart);
  saveState();
}

function resetStats() {
  state.stats = { pomodoros: 0, minutes: 0, tasksCompleted: 0, weekly: [0,0,0,0,0,0,0] };
  state.sessionCount = 0;
  updateStats();
  renderWeeklyChart();
  renderSessionDots();
  saveState();
  showToast('统计数据已重置', 'info');
  toggleSettings();
}

// ===== Modal =====
function showModal(icon, title, text, btnText, btnClass, callback) {
  document.getElementById('modalIcon').textContent = icon;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalText').textContent = text;
  const btn = document.getElementById('modalBtn');
  btn.textContent = btnText;
  btn.className = 'modal-btn ' + btnClass;
  btn.onclick = () => {
    closeModal();
    if (callback) callback();
  };
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ===== Toast =====
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ===== Sound =====
function playNotificationSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.2);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.2 + 0.5);
      osc.start(ctx.currentTime + i * 0.2);
      osc.stop(ctx.currentTime + i * 0.2 + 0.5);
    });
  } catch(e) {}
}

// ===== Particles =====
function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 15; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDuration = (15 + Math.random() * 25) + 's';
    particle.style.animationDelay = Math.random() * 20 + 's';
    particle.style.width = particle.style.height = (2 + Math.random() * 3) + 'px';
    const colors = [
      'rgba(231,76,60,0.12)',
      'rgba(76,175,80,0.1)',
      'rgba(255,255,255,0.06)'
    ];
    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
    container.appendChild(particle);
  }
}

// ===== Keyboard Shortcuts =====
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    toggleTimer();
  }
  if (e.code === 'KeyR') {
    resetTimer();
  }
  if (e.code === 'KeyS') {
    skipTimer();
  }
});

// ===== Start =====
init();
