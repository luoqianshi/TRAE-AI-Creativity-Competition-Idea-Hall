    }

    .completed-item .poem-author {
      font-size: 12px;
      color: var(--muted);
    }

    .completed-item .badge-earned {
      font-size: 20px;
    }

    .encouragement {
      background: linear-gradient(135deg, #f6ffed 0%, #e6f7ff 100%);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      margin-top: 20px;
      border: 2px dashed var(--success);
    }

    .encouragement p {
      font-size: 15px;
      font-weight: 600;
      color: #389e0d;
    }

    /* ===== Star Animation ===== */
    .star-earned {
      position: fixed;
      font-size: 40px;
      pointer-events: none;
      z-index: 1000;
      animation: starFly 1.2s ease-out forwards;
    }

    @keyframes starFly {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.2) rotate(180deg); opacity: 1; }
      100% { transform: scale(0.5) rotate(360deg) translateY(-100px); opacity: 0; }
    }

    /* ===== Confetti ===== */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      pointer-events: none;
      z-index: 999;
      animation: confettiFall 2s ease-out forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg2);
      border-radius: 20px;
      padding: 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }

    .modal-overlay.show .modal-content {
      transform: scale(1);
    }

    .modal-emoji {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .modal-content h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-content p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .poem-grid { grid-template-columns: 1fr; }
      .comic-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
      .header-content { flex-direction: column; gap: 8px; }
      .app-header { padding: 12px 16px; }
      .nav-tabs { top: 90px; }
      .detail-header h2 { font-size: 22px; }
      .poem-content { font-size: 18px; }
      .blank-verse { font-size: 18px; }
      .module-tab { padding: 8px 12px; font-size: 12px; }
    }

    @media (min-width: 601px) and (max-width: 768px) {
      .poem-grid { grid-template-columns: repeat(2, 1fr); }
      .comic-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ===== Utility ===== */
    .text-center { text-align: center; }
    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .hidden { display: none !important; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
  </style>

      { type: 'verse', question: '哪一句诗出自《静夜思》？', options: ['床前明月光，', '白毛浮绿水，', '春眠不觉晓，'], correct: 0, poem: 'jingyesi' },

          </div>
          <div class="module-tab" data-module="ordering" onclick="switchModule('ordering')">
            <span class="tab-icon">🔀</span> 诗句排序
          </div>
          <div class="module-tab" data-module="fillblank" onclick="switchModule('fillblank')">
            <span class="tab-icon">✏️</span> 缺字填空
          </div>
        </div>

        <div class="module-content active" id="module-comic">
          ${renderComicModule(poem)}
        </div>
        <div class="module-content" id="module-memory">
          ${renderMemoryModule(poem)}
        </div>
        <div class="module-content" id="module-ordering">
          ${renderOrderingModule(poem)}
        </div>
        <div class="module-content" id="module-fillblank">
          ${renderFillBlankModule(poem)}
        </div>
      `;
    }

    function switchModule(moduleName) {
      state.currentModule = moduleName;
      document.querySelectorAll('.module-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.module-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`[data-module="${moduleName}"]`).classList.add('active');
      document.getElementById(`module-${moduleName}`).classList.add('active');
    }

    function renderComicModule(poem) {
      return `
        <div class="game-container">
          <div class="game-title">🎨 连环画阅读 · 看图学诗句</div>
          <div class="comic-grid">
            ${poem.comic.map((scene, i) => `
              <div class="comic-card" style="animation-delay:${i*0.1}s">
                <div class="comic-scene">${scene.scene}</div>
                <h4>画面 ${i+1}：${scene.title}</h4>
                <p>${scene.desc}</p>
                <div class="comic-verse">${scene.verse}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderMemoryModule(poem) {
      return `
        <div class="memory-card">
          <h3>🧠 ${poem.title} · 趣味记忆图</h3>
          <p style="font-size:13px;color:var(--muted);margin-bottom:16px">看着这些关键词，你能想起整首诗吗？</p>
          <div class="memory-keywords">
            ${poem.memoryKeywords.map(k => `
              <div class="keyword-bubble">
                <span>${k.emoji}</span>
                <span>${k.word}</span>
              </div>
            `).join('')}
          </div>
          <div class="memory-tip">
            💡 记忆小技巧：先看图想画面，再连起来念诗句！
          </div>
        </div>
      `;
    }

    // ==================== Ordering Game ====================
    function renderOrderingModule(poem) {
      const gameKey = `${poem.id}_ordering`;
      const isCompleted = state.completedGames[gameKey];

      return `
        <div class="game-container">
          <div class="game-title">🔀 诗句排序 · 把诗句按正确顺序排列</div>
          <div id="orderingArea">
            <p style="text-align:center;color:var(--muted);margin-bottom:16px;font-size:14px">
              点击下方诗句，按正确顺序选择
            </p>
            <div class="answer-slots" id="answerSlots">
              ${poem.content.map(() => `
                <div class="answer-slot">点击右侧诗句填入</div>
              `).join('')}
            </div>
            <div class="verse-options" id="verseOptions">
              ${poem.orderingGame.verses.map((v, i) => `
                <div class="verse-option" data-index="${i}" onclick="selectVerse(this, ${i})">${v}</div>
              `).join('')}
            </div>
            <div class="game-controls">
              <button class="btn btn-secondary" onclick="resetOrdering()">🔄 重置</button>
              <button class="btn btn-primary" onclick="checkOrdering('${poem.id}')">✅ 检查答案</button>
            </div>
            <div class="game-feedback" id="orderingFeedback"></div>
          </div>
          ${isCompleted ? `
            <div class="text-center mt-16" style="padding:20px;background:var(--success-light);border-radius:12px;border:1px solid var(--success)">
              <div style="font-size:32px;margin-bottom:8px">🎉</div>
              <div style="font-weight:700;color:var(--success)">你已经完成这个挑战了！</div>
              <div style="font-size:13px;color:var(--muted);margin-top:4px">获得 1 颗 ⭐</div>
            </div>
          ` : ''}
        </div>
      `;
    }

    let selectedVerses = [];

    function selectVerse(el, index) {
      const poem = poems.find(p => p.id === state.currentPoemId);
      if (!poem) return;
      if (state.completedGames[`${poem.id}_ordering`]) return;

      if (el.classList.contains('selected')) {
        el.classList.remove('selected');
        selectedVerses = selectedVerses.filter(v => v !== index);
      } else if (selectedVerses.length < poem.content.length) {
        el.classList.add('selected');
        selectedVerses.push(index);
      }

      updateAnswerSlots(poem);
    }

    function updateAnswerSlots(poem) {
      const slots = document.querySelectorAll('.answer-slot');
      slots.forEach((slot, i) => {
        if (i < selectedVerses.length) {
          slot.textContent = poem.orderingGame.verses[selectedVerses[i]];
          slot.classList.add('filled');
        } else {
          slot.textContent = '点击右侧诗句填入';
          slot.classList.remove('filled');
        }
      });
    }

    function resetOrdering() {
      selectedVerses = [];
      document.querySelectorAll('.verse-option').forEach(el => el.classList.remove('selected', 'correct', 'wrong', 'disabled'));
      document.querySelectorAll('.answer-slot').forEach((slot, i) => {
        slot.textContent = '点击右侧诗句填入';
        slot.classList.remove('filled');
      });
      document.getElementById('orderingFeedback').classList.remove('show', 'success', 'error');
    }

    function checkOrdering(poemId) {
      const poem = poems.find(p => p.id === poemId);
      const feedback = document.getElementById('orderingFeedback');

      if (selectedVerses.length !== poem.content.length) {
        feedback.textContent = '❌ 请先选择所有诗句';
        feedback.className = 'game-feedback show error';
        return;
      }

      const isCorrect = selectedVerses.every((v, i) => v === poem.orderingGame.correctOrder[i]);

      if (isCorrect) {
        feedback.textContent = '🎉 回答正确！通关成功 +1 星！';
        feedback.className = 'game-feedback show success';

        document.querySelectorAll('.verse-option').forEach(el => el.classList.add('disabled'));

        if (!state.completedGames[`${poemId}_ordering`]) {
          state.completedGames[`${poemId}_ordering`] = true;
          state.stars++;
          if (!state.completedPoems.includes(poemId)) {
            state.completedPoems.push(poemId);
          }
          saveState();
          showStarAnimation();
          showModal('🎉', '恭喜通关！', `你成功完成了《${poem.title}》的诗句排序挑战，获得 1 颗星星！`);
        }
      } else {
        feedback.textContent = '❌ 顺序不对哦，再试试看！';
        feedback.className = 'game-feedback show error';

        // Highlight wrong ones
        const options = document.querySelectorAll('.verse-option');
        selectedVerses.forEach((v, i) => {
          if (v !== poem.orderingGame.correctOrder[i]) {
            options[v].classList.add('wrong');
          } else {
            options[v].classList.add('correct');
          }
        });
      }
    }

    // ==================== Fill Blank Game ====================
    function renderFillBlankModule(poem) {
      const gameKey = `${poem.id}_fillblank`;
      const isCompleted = state.completedGames[gameKey];

      return `
        <div class="game-container">
          <div class="game-title">✏️ 缺字填空 · 选择正确的字词填入空白</div>
          <div id="fillblankArea">
            <div class="blank-verse" id="blankVerse">
              ${poem.fillBlankGame.verses.map((v, i) => `
                <div>
                  ${v.text.replace('____', `<span class="blank-slot" id="blank-${i}" onclick="selectBlank(${i})">____</span>`)}
                </div>
              `).join('')}
            </div>
            <div class="blank-options" id="blankOptions">
              ${poem.fillBlankGame.options.map((opt, i) => `
                <div class="blank-option" data-opt="${opt}" onclick="fillBlank('${opt}')">${opt}</div>
              `).join('')}
            </div>
            <div class="game-controls">
              <button class="btn btn-secondary" onclick="resetFillBlank()">🔄 重置</button>
              <button class="btn btn-primary" onclick="checkFillBlank('${poem.id}')">✅ 检查答案</button>
            </div>
            <div class="game-feedback" id="fillblankFeedback"></div>
          </div>
          ${isCompleted ? `
            <div class="text-center mt-16" style="padding:20px;background:var(--success-light);border-radius:12px;border:1px solid var(--success)">
              <div style="font-size:32px;margin-bottom:8px">🎉</div>
              <div style="font-weight:700;color:var(--success)">你已经完成这个挑战了！</div>
              <div style="font-size:13px;color:var(--muted);margin-top:4px">获得 1 颗 ⭐</div>
            </div>
          ` : ''}
        </div>
      `;
    }

    let currentBlankIndex = 0;
    let blankAnswers = {};
    let selectedBlankIdx = null;

    function selectBlank(index) {
      selectedBlankIdx = index;
      document.querySelectorAll('.blank-slot').forEach((el, i) => {
        el.style.borderColor = i === index ? 'var(--accent2)' : '';
        el.style.background = i === index ? '#fff7e6' : '';
      });
    }

    function fillBlank(option) {
      const poem = poems.find(p => p.id === state.currentPoemId);
      if (!poem || state.completedGames[`${poem.id}_fillblank`]) return;

      if (selectedBlankIdx === null) {
        // Auto select first empty
        for (let i = 0; i < poem.fillBlankGame.verses.length; i++) {
          if (!blankAnswers[i]) {
            selectedBlankIdx = i;
            break;
          }
        }
      }

      if (selectedBlankIdx !== null) {
        blankAnswers[selectedBlankIdx] = option;
        const slot = document.getElementById(`blank-${selectedBlankIdx}`);
        if (slot) {
          slot.textContent = option;
          slot.classList.add('filled');
        }

        // Mark option as used
        document.querySelectorAll('.blank-option').forEach(el => {
          if (el.dataset.opt === option) {
            el.classList.add('used');
          }
        });

        // Auto select next empty
        let nextIdx = null;
        for (let i = 0; i < poem.fillBlankGame.verses.length; i++) {
          if (!blankAnswers[i]) {
            nextIdx = i;
            break;
          }
        }
        selectedBlankIdx = nextIdx;
        if (nextIdx !== null) {
          document.querySelectorAll('.blank-slot').forEach((el, i) => {
            el.style.borderColor = i === nextIdx ? 'var(--accent2)' : '';
            el.style.background = i === nextIdx ? '#fff7e6' : '';
          });
        }
      }
    }

    function resetFillBlank() {
      blankAnswers = {};
      selectedBlankIdx = null;
      const poem = poems.find(p => p.id === state.currentPoemId);
      if (!poem) return;

      poem.fillBlankGame.verses.forEach((v, i) => {
        const slot = document.getElementById(`blank-${i}`);
        if (slot) {
          slot.textContent = '____';
          slot.classList.remove('filled');
          slot.style.borderColor = '';
          slot.style.background = '';
        }
      });

      document.querySelectorAll('.blank-option').forEach(el => el.classList.remove('used'));
      document.getElementById('fillblankFeedback').classList.remove('show', 'success', 'error');
    }

    function checkFillBlank(poemId) {
      const poem = poems.find(p => p.id === poemId);
      const feedback = document.getElementById('fillblankFeedback');

      const allFilled = poem.fillBlankGame.verses.every((_, i) => blankAnswers[i]);
      if (!allFilled) {
        feedback.textContent = '❌ 请填完所有空白';
        feedback.className = 'game-feedback show error';
        return;
      }

      const isCorrect = poem.fillBlankGame.verses.every((v, i) => blankAnswers[i] === v.answer);

      if (isCorrect) {
        feedback.textContent = '🎉 全部正确！通关成功 +1 星！';
        feedback.className = 'game-feedback show success';

        if (!state.completedGames[`${poemId}_fillblank`]) {
          state.completedGames[`${poemId}_fillblank`] = true;
          state.stars++;
          if (!state.completedPoems.includes(poemId)) {
            state.completedPoems.push(poemId);
          }
          saveState();
          showStarAnimation();
          showModal('🎉', '恭喜通关！', `你成功完成了《${poem.title}》的缺字填空挑战，获得 1 颗星星！`);
        }
      } else {
        feedback.textContent = '❌ 有些答案不对，再想想看！';
        feedback.className = 'game-feedback show error';
      }
    }

    // ==================== Challenge ====================
    function renderChallenge() {
      const container = document.getElementById('challengeContent');

      if (!state.challengeState || state.challengeState.finished) {
        container.innerHTML = `
          <div class="challenge-intro">
            <h2>⚔️ 准备好挑战了吗？</h2>
            <p>随机 5 道题目，检验你对 3 首古诗的掌握程度</p>
            <button class="btn btn-primary mt-16" style="max-width:200px;margin:16px auto 0" onclick="startChallenge()">
              🚀 开始闯关
            </button>
          </div>
        `;
      } else {
        renderQuizQuestion();
      }
    }

    function startChallenge() {
      const shuffled = [...challengeQuestions].sort(() => Math.random() - 0.5);
      state.challengeState = {
        questions: shuffled.slice(0, 5),
        currentIndex: 0,
        score: 0,
        answers: [],
        finished: false
      };
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const container = document.getElementById('challengeContent');
      const quiz = state.challengeState;
      const q = quiz.questions[quiz.currentIndex];
      const progress = ((quiz.currentIndex) / quiz.questions.length) * 100;

      container.innerHTML = `
        <div class="quiz-container">
          <div class="quiz-progress">
            <span style="font-size:13px;font-weight:600">题目 ${quiz.currentIndex + 1} / ${quiz.questions.length}</span>
            <div class="quiz-progress-bar">
              <div class="quiz-progress-fill" style="width:${progress}%"></div>
            </div>
            <span style="font-size:13px">⭐ ${state.stars}</span>
          </div>
          <div class="quiz-question">${q.question}</div>
          <div class="quiz-options">
            ${q.options.map((opt, i) => `
              <div class="quiz-option" onclick="selectQuizAnswer(${i})" data-index="${i}">${opt}</div>
            `).join('')}
          </div>
          <div class="game-feedback" id="quizFeedback"></div>
        </div>
      `;
    }

    function selectQuizAnswer(index) {
      const quiz = state.challengeState;
      if (!quiz || quiz.finished) return;

      const q = quiz.questions[quiz.currentIndex];
      const options = document.querySelectorAll('.quiz-option');
      const feedback = document.getElementById('quizFeedback');

      options.forEach((el, i) => {
        el.style.pointerEvents = 'none';
        if (i === q.correct) {
          el.classList.add('correct');
        } else if (i === index && i !== q.correct) {
          el.classList.add('wrong');
        }
      });

      const isCorrect = index === q.correct;
      if (isCorrect) {
        quiz.score++;
        feedback.textContent = '✅ 回答正确！';
        feedback.className = 'game-feedback show success';
      } else {
        feedback.textContent = '❌ 回答错误，正确答案是：' + q.options[q.correct];
        feedback.className = 'game-feedback show error';
      }

      quiz.answers.push({ question: quiz.currentIndex, correct: isCorrect });

      setTimeout(() => {
        quiz.currentIndex++;
        if (quiz.currentIndex >= quiz.questions.length) {
          finishChallenge();
        } else {
          renderQuizQuestion();
        }
      }, 1500);
    }

    function finishChallenge() {
      const quiz = state.challengeState;
      quiz.finished = true;

      const earnedStars = quiz.score >= 4 ? 2 : quiz.score >= 2 ? 1 : 0;
      state.stars += earnedStars;
      saveState();

      const container = document.getElementById('challengeContent');
      let emoji = quiz.score === 5 ? '🏆' : quiz.score >= 3 ? '🌟' : '💪';
      let message = quiz.score === 5 ? '太厉害了！全部答对！' : quiz.score >= 3 ? '表现不错，继续加油！' : '再复习一下，下次一定能更好！';

      container.innerHTML = `
        <div class="result-card">
          <div class="result-emoji">${emoji}</div>
          <h2>闯关完成！</h2>
          <div class="result-score">${quiz.score} / ${quiz.questions.length}</div>
          <div class="result-stars">${'⭐'.repeat(earnedStars)}${ earnedStars === 0 ? '💨' : ''}</div>
          <div class="result-message">${message}<br>本轮获得 ${earnedStars} 颗星星</div>
          <button class="btn btn-primary" style="max-width:200px;margin:0 auto" onclick="startChallenge()">🔄 再挑战一次</button>
          <button class="btn btn-secondary mt-16" style="max-width:200px;margin:8px auto 0" onclick="switchView('home')">🏠 返回古诗馆</button>
        </div>
      `;

      if (earnedStars > 0) {
        showStarAnimation();
        showConfetti();
      }
    }

    // ==================== Progress ====================
    function renderProgress() {
      const container = document.getElementById('progressContent');
      const completedCount = state.completedPoems.length;
      const progressPercent = (completedCount / 116) * 100;

      container.innerHTML = `
        <div class="progress-hero">
          <div class="big-number">${completedCount}</div>
          <div class="progress-label">已学习 / 116 首目标</div>
          <div class="progress-bar-large">
            <div class="fill" style="width:${progressPercent}%"></div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">⭐</div>
            <div class="stat-value">${state.stars}</div>
            <div class="stat-label">获得星星</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🎯</div>
            <div class="stat-value">${completedCount}</div>
            <div class="stat-label">已通关</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📖</div>
            <div class="stat-value">${Object.keys(state.completedGames).length}</div>
            <div class="stat-label">完成挑战</div>
          </div>
        </div>

        <div class="completed-list">
          <h3>📚 已通关诗词</h3>
          ${state.completedPoems.length > 0 ? state.completedPoems.map(id => {
            const poem = poems.find(p => p.id === id);
            return poem ? `
              <div class="completed-item">
                <div>
                  <div class="poem-name">${poem.emoji} ${poem.title}</div>
                  <div class="poem-author">${poem.dynasty} · ${poem.author}</div>
                </div>
                <div class="badge-earned">🏅</div>
              </div>
            ` : '';
          }).join('') : '<p style="color:var(--muted);text-align:center;padding:12px">还没有通关任何诗词，快去开始学习吧！</p>'}
        </div>

        <div class="encouragement">
          <p>🌟 每天学一首，点亮诗词星球 🌟</p>
        </div>
      `;
    }

    // ==================== Effects ====================
    function showStarAnimation() {
      const star = document.createElement('div');
      star.className = 'star-earned';
      star.textContent = '⭐';
      star.style.left = (window.innerWidth / 2 - 20) + 'px';
      star.style.top = (window.innerHeight / 2 - 20) + 'px';
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 1200);
    }

    function showConfetti() {
      const colors = ['#4a90d9', '#f5a623', '#52c41a', '#ff4d4f', '#ffc53d', '#9b59b6'];
      for (let i = 0; i < 30; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * window.innerWidth + 'px';
        piece.style.top = '-10px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        piece.style.animationDelay = Math.random() * 0.5 + 's';
        piece.style.animationDuration = (1.5 + Math.random()) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2500);
      }
    }

    function showModal(emoji, title, message) {
      document.getElementById('modalEmoji').textContent = emoji;
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    // ==================== Start ====================
    init();
  </script>
</body>
</html>
