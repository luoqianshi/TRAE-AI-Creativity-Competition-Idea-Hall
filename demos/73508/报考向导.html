<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>报考向导</title>
  <style>
    :root {
      --bg-primary: #fdf9f3;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #4a6fa5;
      --accent-light: #e6f0ff;
      --border: #e0e0e0;
      --shadow: 0 2px 8px rgba(0,0,0,0.06);
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    .dark-theme {
      --bg-primary: #1a1d25;
      --bg-card: #252a35;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --accent: #6ab7ff;
      --accent-light: #0d2b45;
      --border: #3a4050;
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 12px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .selector-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      justify-content: center;
    }

    .selector-label {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    select {
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--bg-card);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
      min-width: 140px;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.1);
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .card-header {
      padding: 16px 20px;
      background: var(--accent-light);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title i {
      font-size: 1.2rem;
    }

    .countdown {
      background: #fff8e1;
      color: #e65100;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .card-body {
      padding: 20px;
    }

    .step-list {
      list-style: none;
    }

    .step-item {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      transition: var(--transition);
    }

    .step-item:last-child {
      border-bottom: none;
    }

    .step-item:hover {
      background-color: rgba(74, 111, 165, 0.03);
    }

    .step-number {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-light);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      margin-top: 4px;
    }

    .step-content {
      flex: 1;
    }

    .step-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 1.05rem;
    }

    .step-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 10px;
    }

    .step-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-btn {
      background: var(--accent-light);
      color: var(--accent);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
      font-weight: 600;
    }

    .action-btn:hover {
      background: var(--accent);
      color: white;
    }

    .screenshot-preview {
      margin-top: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      max-width: 100%;
      background: #f9f9f9;
      display: none;
    }

    .screenshot-header {
      background: #f0f0f0;
      padding: 8px 12px;
      font-size: 0.8rem;
      color: #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .screenshot-body {
      position: relative;
      padding: 20px;
      min-height: 180px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #777;
    }

    .red-frame {
      position: absolute;
      border: 3px solid #e53935;
      border-radius: 4px;
      pointer-events: none;
      z-index: 2;
    }

    .frame-1 { top: 40px; left: 30%; width: 120px; height: 40px; }
    .frame-2 { top: 100px; right: 20%; width: 180px; height: 50px; }
    .frame-3 { bottom: 40px; left: 25%; width: 200px; height: 45px; }

    .theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
      font-size: 1.2rem;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state p {
      margin-top: 12px;
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .selector-group {
        flex-direction: column;
        align-items: stretch;
      }

      h1 {
        font-size: 1.5rem;
      }

      .card-header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

      .step-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .step-number {
        margin-top: 0;
      }
    }

    @media (min-width: 601px) {
      .step-item {
        align-items: flex-start;
      }

      .step-content {
        padding-left: 8px;
      }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>报考向导</h1>
      <p class="subtitle">输入考试类型和所在城市，获取专属报名流程图 —— 步骤清晰、时间明确、截图指引</p>
    </header>

    <div class="selector-group">
      <div>
        <label class="selector-label">考试类型</label>
        <select id="examSelect">
          <option value="">请选择考试类型</option>
          <option value="zhongkao">中考</option>
          <option value="gaokao">高考</option>
          <option value="zikaosheng">自考</option>
        </select>
      </div>
      <div>
        <label class="selector-label">所在城市</label>
        <select id="citySelect">
          <option value="">请选择城市</option>
          <option value="shanghai">上海</option>
          <option value="henan">河南</option>
          <option value="guangdong">广东</option>
        </select>
      </div>
    </div>

    <div id="resultArea">
      <div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#ccc"/>
        </svg>
        <h3>请选择考试类型与城市</h3>
        <p>例如：上海中考、河南高考、广东自考</p>
      </div>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle">☀️</button>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const examSelect = document.getElementById('examSelect');
      const citySelect = document.getElementById('citySelect');
      const resultArea = document.getElementById('resultArea');
      const themeToggle = document.getElementById('themeToggle');

      // 主题切换
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-theme');
        themeToggle.innerHTML = '🌙';
      }

      themeToggle.addEventListener('click', () => {
        if (document.body.classList.contains('dark-theme')) {
          document.body.classList.remove('dark-theme');
          localStorage.setItem('theme', 'light');
          themeToggle.innerHTML = '☀️';
        } else {
          document.body.classList.add('dark-theme');
          localStorage.setItem('theme', 'dark');
          themeToggle.innerHTML = '🌙';
        }
      });

      // 模拟数据（3种组合）
      const mockData = {
        'shanghai-zhongkao': {
          title: '上海中考报名流程',
          countdown: '距截止还有 7 天',
          steps: [
            {
              num: 1,
              title: '登录“上海市招考院”官网',
              desc: '打开浏览器，访问 https://www.shmeea.edu.cn',
              actions: ['拍照→裁剪→点“上传”按钮']
            },
            {
              num: 2,
              title: '上传学籍证明（PDF格式）',
              desc: '文件名需含考生姓名，大小不超过2MB',
              actions: ['拍这里看示例']
            },
            {
              num: 3,
              title: '填写户籍信息并确认',
              desc: '如户口在外地，需同步上传《居住证》正反面',
              actions: ['拍这里看示例']
            },
            {
              num: 4,
              title: '打印准考证（3月15日起）',
              desc: '务必使用A4纸黑白打印，不可缩放',
              actions: ['拍这里看示例']
            }
          ]
        },
        'henan-gaokao': {
          title: '河南高考报名流程',
          countdown: '距截止还有 12 天',
          steps: [
            {
              num: 1,
              title: '到户籍所在地中学现场确认',
              desc: '携带身份证、户口本原件，无需提前预约',
              actions: ['拍这里看示例']
            },
            {
              num: 2,
              title: '网上填报基本信息',
              desc: '注意：民族、政治面貌必填，不可为空',
              actions: ['拍这里看示例']
            },
            {
              num: 3,
              title: '上传近期免冠白底证件照',
              desc: '分辨率300dpi，尺寸358×441像素',
              actions: ['拍这里看示例']
            }
          ]
        },
        'guangdong-zikaosheng': {
          title: '广东自考报名流程',
          countdown: '距截止还有 3 天',
          steps: [
            {
              num: 1,
              title: '注册广东省自学考试管理系统账号',
              desc: '手机号需实名认证，接收短信验证码',
              actions: ['拍这里看示例']
            },
            {
              num: 2,
              title: '选择本次报考科目（最多4门）',
              desc: '缴费成功后不可修改，建议先查考试安排表',
              actions: ['拍这里看示例']
            },
            {
              num: 3,
              title: '上传身份证正反面扫描件',
              desc: 'JPG格式，单张≤1MB，确保四角完整',
              actions: ['拍这里看示例']
            }
          ]
        }
      };

      // 渲染流程卡
      function renderCard(data) {
        const card = document.createElement('div');
        card.className = 'card fade-in';

        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `
          <div class="card-title">${data.title}</div>
          <div class="countdown">${data.countdown}</div>
        `;

        const body = document.createElement('div');
        body.className = 'card-body';

        const list = document.createElement('ul');
        list.className = 'step-list';

        data.steps.forEach((step, idx) => {
          const item = document.createElement('li');
          item.className = 'step-item';

          const screenshotId = `screenshot-${idx}`;

          item.innerHTML = `
            <div class="step-number">${step.num}</div>
            <div class="step-content">
              <div class="step-title">${step.title}</div>
              <div class="step-desc">${step.desc}</div>
              <div class="step-actions"></div>
              <div class="screenshot-preview" id="${screenshotId}">
                <div class="screenshot-header">
                  <span>手机屏幕示意</span>
                  <button class="close-screenshot" data-target="${screenshotId}">×</button>
                </div>
                <div class="screenshot-body">
                  <div class="red-frame frame-1"></div>
                  <div class="red-frame frame-2"></div>
                  <div class="red-frame frame-3"></div>
                  <div>红色方框处即为本步骤操作位置</div>
                </div>
              </div>
            </div>
          `;

          const actionsDiv = item.querySelector('.step-actions');
          step.actions.forEach(action => {
            const btn = document.createElement('button');
            btn.className = 'action-btn';
            btn.textContent = action;
            if (action === '拍这里看示例') {
              btn.addEventListener('click', () => {
                const preview = document.getElementById(screenshotId);
                preview.style.display = 'block';
                preview.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              });
            }
            actionsDiv.appendChild(btn);
          });

          const closeBtn = item.querySelector('.close-screenshot');
          closeBtn.addEventListener('click', () => {
            document.getElementById(screenshotId).style.display = 'none';
          });

          list.appendChild(item);
        });

        body.appendChild(list);
        card.appendChild(header);
        card.appendChild(body);

        resultArea.innerHTML = '';
        resultArea.appendChild(card);
      }

      // 事件监听
      examSelect.addEventListener('change', updatePreview);
      citySelect.addEventListener('change', updatePreview);

      function updatePreview() {
        const exam = examSelect.value;
        const city = citySelect.value;
        if (!exam || !city) return;

        const key = `${city}-${exam}`;
        const data = mockData[key];
        if (data) {
          renderCard(data);
        } else {
          resultArea.innerHTML = `
            <div class="empty-state">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#e53935"/>
              </svg>
              <h3>暂未支持该组合</h3>
              <p>目前仅支持：上海中考、河南高考、广东自考</p>
            </div>
          `;
        }
      }
    });
  </script>
</body>
</html>
