    // 生成Likert量表题目
    function generateLikert(startText, count) {
      const texts = [startText];
      const baseTexts = [
        '我能很好地处理压力', '我善于与人沟通', '我有明确的目标',
        '我能够坚持完成任务', '我对生活感到满意', '我对自己有信心',
        '我善于发现问题', '我能够独立思考', '我有良好的习惯',
        '我能够接受批评', '我善于学习新知识', '我有创造力',
        '我能够控制情绪', '我善于分析问题', '我有责任感',
        '我能够与他人合作', '我有积极的态度', '我善于规划',
        '我能够适应变化', '我有良好的心态', '我善于表达',
        '我有耐心', '我做事认真', '我能够自律', '我有好奇心',
        '我善于观察', '我有幽默感', '我能够宽容', '我有毅力',
        '我善于倾听', '我有同情心', '我能够信任他人', '我有主见',
        '我善于反思', '我有自律性'
      ];
      for (let i = 0; i < count - 1; i++) {
        texts.push(baseTexts[i % baseTexts.length]);
      }
      return texts.map((text, idx) => ({
        id: `q${idx}`,
        text: text,
        options: [
          { id: 'a', text: '非常符合', value: 5 },
          { id: 'b', text: '比较符合', value: 4 },
          { id: 'c', text: '一般', value: 3 },
          { id: 'd', text: '不太符合', value: 2 },
          { id: 'e', text: '完全不符合', value: 1 },
        ]
      }));
    }

    // 生成反向Likert量表题目
    function generateReverseLikert(startText, count) {
      return generateLikert(startText, count).map(q => ({
        ...q,
        options: q.options.map(opt => ({
          ...opt,
          value: 6 - opt.value
        }))
      }));
    }

    // 生成IQ选择题
    function generateIQ() {
      const questions = [
        { text: '1, 4, 9, 16, 25, ?', options: ['30', '36', '49', '64'], answer: 1 },
        { text: '如果所有A是B，所有B是C，那么所有A是C。这是什么逻辑?', options: ['肯定前件', '传递律', '逆否命题', '换位法'], answer: 1 },
        { text: '一个三角形内角和是多少度?', options: ['90°', '180°', '270°', '360°'], answer: 1 },
        { text: '如果今天是周五，100天后是周几?', options: ['周五', '周六', '周日', '周一'], answer: 2 },

    function getTotalQuestions() {

    // ============ 存储管理 ============
    const Storage = {
      KEY: 'body_exam_data',
      get() {
        try {
          const data = localStorage.getItem(this.KEY);
          return data ? JSON.parse(data) : null;
        } catch { return null; }
      },
      set(data) {
        localStorage.setItem(this.KEY, JSON.stringify(data));
      }
    };

    // ============ 上下文 ============
    const AppContext = createContext();

    function AppProvider({ children }) {
      const [user, setUser] = useState(null);
      const [theme, setTheme] = useState('dark');
      const [results, setResults] = useState([]);
      const [achievements, setAchievements] = useState([]);

      useEffect(() => {
        const data = Storage.get();
        if (data) {
          setUser(data.user);
          setResults(data.results || []);
          setAchievements(data.achievements || []);
        }
        document.documentElement.classList.toggle('dark', theme === 'dark');
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
      }, [theme]);

      const saveData = (newUser, newResults, newAchievements) => {
        const data = {
          user: newUser || user,
          results: newResults || results,
          achievements: newAchievements || achievements
        };
        Storage.set(data);
      };

      const login = (username) => {
        const newUser = { username, createdAt: new Date().toISOString(), totalScore: 0 };
        setUser(newUser);
        saveData(newUser, [], []);
        return newUser;
      };

      const logout = () => {
        setUser(null);
        localStorage.removeItem(Storage.KEY);
      };

      const addResult = (result) => {
        const newResults = [...results, { ...result, id: Date.now(), completedAt: new Date().toISOString() }];
        setResults(newResults);
        const newTotal = (user?.totalScore || 0) + result.score;
        const updatedUser = { ...user, totalScore: newTotal };
        setUser(updatedUser);
        saveData(updatedUser, newResults, achievements);
        checkAchievements(newResults, updatedUser);
      };

      const checkAchievements = (res, usr) => {
        const newAchievements = [...achievements];
        if (res.length >= 1 && !newAchievements.includes('first_test')) newAchievements.push('first_test');
        if (res.length >= 10 && !newAchievements.includes('test_master')) newAchievements.push('test_master');
        if (usr.totalScore >= 500 && !newAchievements.includes('high_scorer')) newAchievements.push('high_scorer');
        if (res.length >= 50 && !newAchievements.includes('test_expert')) newAchievements.push('test_expert');
        setAchievements(newAchievements);
        saveData(usr, res, newAchievements);
      };

      const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

      return (
        <AppContext.Provider value={{ 
          user, login, logout, theme, toggleTheme, 
          results, achievements, addResult 
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    // ============ 工具函数 ============
    function shuffleArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = shuffled[i];
        shuffled[i] = shuffled[j];
        shuffled[j] = temp;
      }
      return shuffled;
    }

    function getScoreLevel(score, max) {
      const ratio = score / max;
      if (ratio >= 0.9) return { level: '优秀', color: 'text-green-400', desc: '表现非常出色！' };
      if (ratio >= 0.7) return { level: '良好', color: 'text-blue-400', desc: '表现不错，还有提升空间' };
      if (ratio >= 0.5) return { level: '中等', color: 'text-yellow-400', desc: '处于中等水平' };
      return { level: '需加强', color: 'text-red-400', desc: '建议多加练习' };
    }

                            <span className={`text-sm ${level.color}`}>{level.level}</span>
                          </div>
                          <div className="flex justify-between text-sm text-slate-400">
                            <span>得分: {r.score}/{test?.maxScore}</span>
                            <span>{new Date(r.completedAt).toLocaleDateString()}</span>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 测试页
    function TestPage({ test, onComplete, onBack }) {
      const { addResult } = useContext(AppContext);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [answers, setAnswers] = useState({});
      const [timeLeft, setTimeLeft] = useState(test.timeLimit || 0);
      const [lives, setLives] = useState(test.lives || 0);
      const [showResult, setShowResult] = useState(false);
      const [questions, setQuestions] = useState([]);

      useEffect(() => {
        setQuestions(shuffleArray([...test.questions]));
      }, [test]);

      useEffect(() => {
        if (timeLeft > 0 && !showResult) {
          const timer = setTimeout(() => setTimeLeft(t => t - 1), 1000);
          return () => clearTimeout(timer);
        } else if (timeLeft === 0 && test.timeLimit) {
          handleComplete();
        }
      }, [timeLeft, showResult, test.timeLimit]);

      const currentQ = questions[currentIdx];
      const progress = ((currentIdx + 1) / questions.length) * 100;

      const handleSelect = (optionValue) => {
        const newAnswers = { ...answers, [currentIdx]: optionValue };
        setAnswers(newAnswers);

        // 检查是否答错（有正确答案的题目）
        if (currentQ.options?.find(o => o.value > 0)) {
          const correct = currentQ.options.find(o => o.value > 0);
          if (optionValue !== correct.value && test.hasLife) {
            if (lives <= 1) {
              handleComplete();
              return;
            }
            setLives(l => l - 1);
          }
        }

        // 延迟跳转
        setTimeout(() => {
          if (currentIdx < questions.length - 1) {
            setCurrentIdx(i => i + 1);
          } else {
            handleComplete();
          }
        }, 300);
      };

      const handleComplete = () => {
        let score = 0;
        questions.forEach((q, idx) => {
          const answer = answers[idx];
          if (answer !== undefined) {
            const opt = q.options?.find(o => o.value > 0);
            if (opt) {
              score += answer === opt.value ? (opt.value > 1 ? 2 : 1) : 0;
            } else {
              score += answer;
            }
          }
        });
        const result = { testId: test.id, testName: test.name, score, maxScore: test.maxScore, answers: Object.values(answers) };
        addResult(result);
        setShowResult(true);
      };

      const formatTime = (s) => {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return `${m}:${sec.toString().padStart(2, '0')}`;
      };

      if (showResult) {
        const score = results => {
          let s = 0;
          questions.forEach((q, idx) => {
            const answer = answers[idx];
            if (answer !== undefined) {
              const opt = q.options?.find(o => o.value > 0);
              if (opt) s += answer === opt.value ? (opt.value > 1 ? 2 : 1) : 0;
              else s += answer;
            }
          });
          return s;
        };
        const finalScore = results?.score || 0;
        const level = getScoreLevel(finalScore, test.maxScore);
        
        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex items-center justify-center p-4">
            <div className="w-full max-w-md text-center">
              <div className="text-8xl mb-6">🎉</div>
              <h2 className="text-2xl font-bold mb-2">测试完成！</h2>
              <p className="text-slate-400 mb-6">{test.name}</p>
              <div className={`text-6xl font-bold mb-2 ${level.color}`}>{finalScore}</div>
              <p className="text-slate-400 mb-2">满分 {test.maxScore}</p>
              <p className={`text-lg ${level.color} mb-6`}>{level.level} · {level.desc}</p>
              <div className="space-y-3">
                <button onClick={onBack} className="w-full py-3 bg-indigo-500 hover:bg-indigo-600 rounded-xl font-semibold transition">
                  返回首页
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (!currentQ) return <div className="min-h-screen bg-slate-900 flex items-center justify-center">加载中...</div>;

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100">
          {/* 顶部栏 */}
          <header className="sticky top-0 z-50 glass border-b border-slate-700/50">
            <div className="max-w-2xl mx-auto px-4 py-3">
              <div className="flex items-center justify-between mb-2">
                <button onClick={onBack} className="text-slate-400 hover:text-white">← 返回</button>
                <span className="font-medium">{test.name}</span>
                <div className="flex items-center gap-3">
                  {test.timeLimit && (
                    <span className={`px-3 py-1 rounded-full text-sm ${timeLeft < 30 ? 'bg-red-500/20 text-red-400' : 'bg-slate-700'}`}>
                      ⏱️ {formatTime(timeLeft)}
                    </span>
                  )}
                  {test.hasLife && (
                    <span className="px-3 py-1 bg-red-500/20 text-red-400 rounded-full text-sm">
                      ❤️ {lives}
                    </span>
                  )}
                </div>
              </div>
              <div className="h-2 bg-slate-700 rounded-full overflow-hidden">
                <div className="h-full bg-indigo-500 transition-all duration-300" style={{ width: `${progress}%` }} />
              </div>
              <div className="text-center text-sm text-slate-400 mt-1">
                {currentIdx + 1} / {questions.length}
              </div>
            </div>
          </header>

          {/* 题目内容 */}
          <div className="max-w-2xl mx-auto px-4 py-8">
            <h2 className="text-xl font-medium mb-8 text-center leading-relaxed">
              {currentQ.text}
            </h2>

            {/* 选项 */}
            <div className="space-y-3">
              {currentQ.options?.map((opt, idx) => (
                <button
                  key={opt.id}
                  onClick={() => handleSelect(opt.value)}
                  className={`w-full p-4 rounded-xl text-left transition border ${
                    answers[currentIdx] === opt.value 
                      ? 'bg-indigo-500/20 border-indigo-500' 
                      : 'bg-slate-800 border-slate-700 hover:border-slate-600'
                  }`}
                >
                  <span className={`inline-block w-8 h-8 rounded-full text-center leading-8 mr-3 ${
                    answers[currentIdx] === opt.value ? 'bg-indigo-500 text-white' : 'bg-slate-700'
                  }`}>
                    {String.fromCharCode(65 + idx)}
                  </span>
                  {opt.text}
                </button>
              ))}
            </div>

            {/* 导航按钮 */}
            <div className="flex justify-between mt-8">
              <button
                onClick={() => setCurrentIdx(i => Math.max(0, i - 1))}
                disabled={currentIdx === 0}
                className="px-6 py-3 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl transition"
              >
                ← 上一题
              </button>
              {currentIdx < questions.length - 1 ? (
                <button
                  onClick={() => setCurrentIdx(i => i + 1)}
                  className="px-6 py-3 gradient-primary rounded-xl font-semibold hover:opacity-90 transition"
                >
                  下一题 →
                </button>
              ) : (
                <button
                  onClick={handleComplete}
                  className="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 rounded-xl font-semibold transition"
                >
                  完成测试 ✓
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============ 主应用 ============
    function App() {
      const [page, setPage] = useState('login');
      const [currentTest, setCurrentTest] = useState(null);
      const { user, login, logout } = useContext(AppContext);

      useEffect(() => {
        if (user) setPage('home');
        else setPage('login');
      }, [user]);

      const handleLogin = (username) => {
        login(username);
        setPage('home');
      };

      const handleSelectTest = (test) => {
        setCurrentTest(test);
        setPage('test');
      };

      const handleBack = () => {
        setCurrentTest(null);
        setPage('home');
      };

      if (page === 'login') {
        return <LoginPage onLogin={handleLogin} />;
      }

      if (page === 'test' && currentTest) {
        return <TestPage test={currentTest} onBack={handleBack} />;
      }

      return <HomePage onSelectTest={handleSelectTest} />;
    }

    // 渲染
    function Root() {
      return (
        <AppProvider>
          <App />
        </AppProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
  </script>
</body>
</html>
