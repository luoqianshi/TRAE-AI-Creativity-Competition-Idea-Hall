<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拾光记 · AI日记助手</title>
    <style>
        /* ========== 全局 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #d9c5b0;
            --primary-deep: #b8a088;
            --bg: #faf5ef;
            --card-bg: #ffffff;
            --text: #2c241c;
            --text-light: #6b5d4e;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.03);
            --radius: 28px;
            --radius-sm: 16px;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px 12px 80px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 420px;
            width: 100%;
            background: var(--bg);
            border-radius: 40px;
            position: relative;
        }

        /* ========== 顶部 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-brand .icon {
            font-size: 2rem;
            line-height: 1;
        }

        .header-brand h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #1f1a14;
        }

        .header-brand h1 span {
            font-weight: 400;
            font-size: 0.7rem;
            background: #e5d9cd;
            padding: 2px 12px;
            border-radius: 40px;
            margin-left: 6px;
            color: #4d3f31;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 30px;
            transition: 0.15s;
        }

        .header-actions button:hover {
            background: #e8ddd1;
        }

        /* ========== 输入区 ========== */
        .input-area {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .input-area:focus-within {
            border-color: var(--primary-deep);
            box-shadow: 0 8px 30px rgba(184, 160, 136, 0.12);
        }

        .input-top {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        .input-top .tag-select {
            background: #f0e9e0;
            border: none;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #3f352b;
            font-weight: 500;
            outline: none;
            cursor: pointer;
        }

        .input-top .tag-select option {
            background: white;
        }

        .input-top .mood-btns {
            display: flex;
            gap: 4px;
            margin-left: auto;
        }

        .input-top .mood-btns button {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 30px;
            transition: 0.1s;
            opacity: 0.5;
        }

        .input-top .mood-btns button.active {
            opacity: 1;
            background: #f0e9e0;
            transform: scale(1.1);
        }

        .input-area textarea {
            width: 100%;
            border: none;
            resize: none;
            font-size: 0.98rem;
            font-family: inherit;
            padding: 4px 0;
            background: transparent;
            outline: none;
            color: var(--text);
            min-height: 72px;
            line-height: 1.6;
        }

        .input-area textarea::placeholder {
            color: #b3a697;
            font-weight: 300;
        }

        .input-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            border-top: 1px solid #f0e9e0;
            padding-top: 12px;
        }

        .input-bottom .tools {
            display: flex;
            gap: 12px;
        }

        .input-bottom .tools button {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.15s;
            padding: 2px;
        }

        .input-bottom .tools button:hover {
            opacity: 1;
        }

        .input-bottom .btn-save {
            background: var(--primary-deep);
            color: white;
            border: none;
            padding: 8px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(184, 160, 136, 0.25);
        }

        .input-bottom .btn-save:hover {
            transform: scale(0.96);
            background: #a68b77;
        }

        .input-bottom .btn-save:active {
            transform: scale(0.92);
        }

        /* ========== AI 提示条 ========== */
        .ai-hint {
            background: #f4ede6;
            border-radius: var(--radius-sm);
            padding: 10px 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #4d3f31;
            border-left: 4px solid var(--primary-deep);
            animation: fadeSlide 0.4s ease;
        }

        .ai-hint .sparkle {
            font-size: 1.2rem;
        }

        .ai-hint .text {
            flex: 1;
        }

        .ai-hint .text strong {
            color: #2c241c;
        }

        .ai-hint .btn-close {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0.5;
            padding: 0 4px;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 统计卡片 ========== */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 12px 10px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .stat-card .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c241c;
            line-height: 1.2;
        }

        .stat-card .label {
            font-size: 0.7rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        .stat-card .emoji {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 2px;
        }

        /* ========== 记忆列表 ========== */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 14px;
        }

        .section-title h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .filter {
            font-size: 0.75rem;
            color: var(--text-light);
            background: #eee7df;
            padding: 2px 14px;
            border-radius: 40px;
            cursor: pointer;
            border: none;
        }

        .memory-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .memory-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
            transition: 0.15s;
            animation: cardIn 0.3s ease;
        }

        .memory-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }

        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .memory-card .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .memory-card .meta .tag {
            background: #f0e9e0;
            padding: 0 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #4d3f31;
        }

        .memory-card .content {
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .memory-card .content .ai-tag {
            display: inline-block;
            background: #eae1d6;
            color: #5b4d3d;
            font-size: 0.65rem;
            padding: 0 10px;
            border-radius: 40px;
            margin-right: 6px;
            font-weight: 500;
        }

        .memory-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f3ede6;
            font-size: 0.7rem;
            color: var(--text-light);
        }

        .memory-card .footer .mood {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .memory-card .footer .actions button {
            background: transparent;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.4;
            transition: 0.1s;
            padding: 0 4px;
        }

        .memory-card .footer .actions button:hover {
            opacity: 0.9;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }

        .empty-state .big {
            font-size: 3.6rem;
            margin-bottom: 12px;
            display: block;
        }

        .empty-state p {
            font-size: 0.95rem;
        }

        /* ========== 底部导航 ========== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 252, 249, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            padding: 10px 12px 20px;
            border-top: 1px solid #ede6dc;
            max-width: 420px;
            margin: 0 auto;
            border-radius: 40px 40px 0 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03);
        }

        .bottom-nav .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            font-size: 0.65rem;
            color: var(--text-light);
            gap: 2px;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 30px;
            transition: 0.15s;
            font-family: inherit;
        }

        .bottom-nav .nav-item .icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .bottom-nav .nav-item.active {
            color: var(--text);
            font-weight: 500;
        }

        .bottom-nav .nav-item.active .icon {
            transform: scale(1.05);
        }

        .bottom-nav .nav-item:hover {
            background: #f0e9e0;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 440px) {
            .stats-row {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 6px;
            }
            .stat-card .num {
                font-size: 1.2rem;
            }
            .input-area textarea {
                font-size: 0.92rem;
                min-height: 60px;
            }
            .header-brand h1 {
                font-size: 1.2rem;
            }
        }

        /* 语音脉冲动画 */
        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #b8a088;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
            margin-right: 6px;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.6);
                opacity: 0.2;
            }
        }

        .recording-active .pulse-dot {
            background: #e06050;
        }

        /* toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c241c;
            color: #f5ede4;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 0.9rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
            max-width: 90%;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ===== 顶部 ===== -->
        <header class="header">
            <div class="header-brand">
                <span class="icon">📖</span>
                <h1>拾光记 <span>AI 日记</span></h1>
            </div>
            <div class="header-actions">
                <button onclick="showToast('📊 本周情绪报告已生成')" title="周报">📊</button>
                <button onclick="showToast('🔍 搜索记忆碎片')" title="搜索">🔍</button>
            </div>
        </header>

        <!-- ===== 输入区 ===== -->
        <div class="input-area" id="inputArea">
            <div class="input-top">
                <select class="tag-select" id="tagSelect">
                    <option value="✨ 灵感">✨ 灵感</option>
                    <option value="💭 碎碎念">💭 碎碎念</option>
                    <option value="📸 日常">📸 日常</option>
                    <option value="❤️ 心情">❤️ 心情</option>
                    <option value="🌱 成长">🌱 成长</option>
                </select>
                <div class="mood-btns" id="moodBtns">
                    <button data-mood="😊" class="active">😊</button>
                    <button data-mood="😌">😌</button>
                    <button data-mood="🤔">🤔</button>
                    <button data-mood="🥰">🥰</button>
                    <button data-mood="😢">😢</button>
                </div>
            </div>
            <textarea id="entryInput" placeholder="今天有什么想记录的？灵感、情绪、或一句碎碎念 …" rows="2"></textarea>
            <div class="input-bottom">
                <div class="tools">
                    <button onclick="toggleVoice()" id="voiceBtn" title="语音输入">🎤</button>
                    <button onclick="showToast('🖼️ 添加图片 (模拟)')" title="添加图片">🖼️</button>
                    <button onclick="showToast('📍 添加位置 (模拟)')" title="位置">📍</button>
                </div>
                <button class="btn-save" id="saveBtn">✨ 记录</button>
            </div>
        </div>

        <!-- ===== AI 提示条 ===== -->
        <div class="ai-hint" id="aiHint">
            <span class="sparkle">✨</span>
            <span class="text"><strong>AI 灵感</strong> 今天天气很好，记得记录下这份心情哦</span>
            <button class="btn-close" onclick="document.getElementById('aiHint').style.display='none'">✕</button>
        </div>

        <!-- ===== 统计 ===== -->
        <div class="stats-row">
            <div class="stat-card">
                <span class="emoji">📝</span>
                <div class="num" id="totalCount">0</div>
                <div class="label">记忆碎片</div>
            </div>
            <div class="stat-card">
                <span class="emoji">🔥</span>
                <div class="num" id="streakCount">0</div>
                <div class="label">连续记录</div>
            </div>
            <div class="stat-card">
                <span class="emoji">🏷️</span>
                <div class="num" id="tagCount">0</div>
                <div class="label">标签种类</div>
            </div>
        </div>

        <!-- ===== 记忆列表 ===== -->
        <div class="section-title">
            <h2>📜 时光碎片</h2>
            <button class="filter" onclick="showToast('📅 按时间筛选 (模拟)')">全部 ▾</button>
        </div>

        <div class="memory-list" id="memoryList">
            <!-- 动态渲染 -->
        </div>

        <!-- ===== 底部导航 ===== -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="showToast('🏠 首页')">
                <span class="icon">🏠</span>
                <span>首页</span>
            </button>
            <button class="nav-item" onclick="showToast('📅 时光轴')">
                <span class="icon">📅</span>
                <span>时光轴</span>
            </button>
            <button class="nav-item" onclick="showToast('📊 情绪分析')">
                <span class="icon">📊</span>
                <span>情绪</span>
            </button>
            <button class="nav-item" onclick="showToast('👤 我的')">
                <span class="icon">👤</span>
                <span>我的</span>
            </button>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ============================================================
        //  数据层
        // ============================================================
        let memories = [];
        let selectedMood = '😊';
        let isRecording = false;
        let voiceInterval = null;

        // 从 localStorage 读取
        function loadData() {
            try {
                const saved = localStorage.getItem('shiguang_memories');
                if (saved) {
                    memories = JSON.parse(saved);
                } else {
                    // 初始示例数据
                    memories = [{
                        id: Date.now() - 3600000 * 2,
                        content: '下午在咖啡馆写稿，窗外的梧桐叶被风吹落，像一只慢动作的蝴蝶。突然想到，秋天的温柔大概就藏在这些细微的瞬间里。',
                        tag: '🍂 日常',
                        mood: '😌',
                        time: new Date(Date.now() - 3600000 * 2).toLocaleString('zh-CN'),
                        timestamp: Date.now() - 3600000 * 2
                    }, {
                        id: Date.now() - 3600000 * 5,
                        content: '读完了《夜晚的潜水艇》，那种孤独又辽阔的感觉让人着迷。书里说“我们每个人都有一艘潜水艇”，我想我的那艘可能还在深海里航行。',
                        tag: '📚 灵感',
                        mood: '🤔',
                        time: new Date(Date.now() - 3600000 * 5).toLocaleString('zh-CN'),
                        timestamp: Date.now() - 3600000 * 5
                    }, {
                        id: Date.now() - 3600000 * 10,
                        content: '今天和妈妈视频，她给我看了小时候的相册。那些泛黄的照片里，藏着好多被遗忘的故事。忽然觉得，记忆是需要被温柔打捞的。',
                        tag: '❤️ 心情',
                        mood: '🥰',
                        time: new Date(Date.now() - 3600000 * 10).toLocaleString('zh-CN'),
                        timestamp: Date.now() - 3600000 * 10
                    }];
                }
            } catch (e) {
                memories = [];
            }
            // 确保按时间排序（最新在前）
            memories.sort((a, b) => b.timestamp - a.timestamp);
            renderAll();
        }

        function saveData() {
            try {
                localStorage.setItem('shiguang_memories', JSON.stringify(memories));
            } catch (e) {}
            renderAll();
        }

        // ============================================================
        //  渲染
        // ============================================================
        function renderAll() {
            renderStats();
            renderList();
        }

        function renderStats() {
            const total = memories.length;
            document.getElementById('totalCount').textContent = total;

            // 连续记录 (模拟: 如果今天有记录则显示连续天数)
            const today = new Date().toDateString();
            const todayEntries = memories.filter(m => new Date(m.timestamp).toDateString() === today);
            const streak = todayEntries.length > 0 ? Math.min(memories.length, 7) : 0;
            document.getElementById('streakCount').textContent = streak;

            // 标签种类
            const tags = new Set(memories.map(m => m.tag));
            document.getElementById('tagCount').textContent = tags.size;
        }

        function renderList() {
            const list = document.getElementById('memoryList');
            if (memories.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <span class="big">🌱</span>
                        <p>还没有记忆碎片<br>写下今天的第一笔吧</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = memories.map((m, index) => `
                <div class="memory-card" style="animation-delay: ${index * 0.04}s">
                    <div class="meta">
                        <span>${m.time || new Date(m.timestamp).toLocaleString('zh-CN')}</span>
                        <span class="tag">${m.tag || '📝 记录'}</span>
                    </div>
                    <div class="content">
                        ${m.content}
                    </div>
                    <div class="footer">
                        <span class="mood">
                            <span>${m.mood || '😊'}</span>
                            <span style="margin-left:6px;opacity:0.6;">${getMoodLabel(m.mood)}</span>
                        </span>
                        <div class="actions">
                            <button onclick="deleteMemory(${m.id})" title="删除">🗑️</button>
                            <button onclick="showToast('📌 已收藏 (模拟)')" title="收藏">⭐</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getMoodLabel(mood) {
            const map = {
                '😊': '开心',
                '😌': '平静',
                '🤔': '思考',
                '🥰': '感动',
                '😢': '感伤'
            };
            return map[mood] || '心情';
        }

        // ============================================================
        //  操作
        // ============================================================
        function addMemory(content, tag, mood) {
            if (!content || content.trim() === '') {
                showToast('✍️ 写点什么再记录吧');
                return false;
            }

            const entry = {
                id: Date.now(),
                content: content.trim(),
                tag: tag || '📝 记录',
                mood: mood || '😊',
                time: new Date().toLocaleString('zh-CN'),
                timestamp: Date.now()
            };

            memories.unshift(entry);
            saveData();
            showToast('✨ 记忆已保存，AI 正在整理...');
            // 模拟AI 提示
            setTimeout(() => {
                showToast('🧠 AI 已为这条记忆生成关联标签');
            }, 600);
            return true;
        }

        function deleteMemory(id) {
            if (confirm('确定要删除这条记忆吗？')) {
                memories = memories.filter(m => m.id !== id);
                saveData();
                showToast('🗑️ 已删除');
            }
        }

        // ============================================================
        //  交互
        // ============================================================
        // 情绪按钮
        document.querySelectorAll('#moodBtns button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#moodBtns button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedMood = this.dataset.mood;
            });
        });

        // 保存按钮
        document.getElementById('saveBtn').addEventListener('click', function() {
            const input = document.getElementById('entryInput');
            const tagSelect = document.getElementById('tagSelect');
            const content = input.value;
            const tag = tagSelect.value;
            const mood = selectedMood;

            if (addMemory(content, tag, mood)) {
                input.value = '';
                // 触发 AI 提示更新
                updateAIHint();
            }
        });

        // 回车快捷保存 (Ctrl+Enter)
        document.getElementById('entryInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                document.getElementById('saveBtn').click();
            }
        });

        // ============================================================
        //  语音模拟
        // ============================================================
        function toggleVoice() {
            const btn = document.getElementById('voiceBtn');
            const input = document.getElementById('entryInput');

            if (isRecording) {
                // 停止
                isRecording = false;
                clearInterval(voiceInterval);
                btn.textContent = '🎤';
                btn.style.color = '';
                showToast('⏹️ 语音已停止');
                document.getElementById('inputArea').classList.remove('recording-active');
                // 模拟识别结果
                const mockTexts = [
                    '今天阳光很好，走在路上闻到桂花香，突然觉得生活很美好。',
                    '刚刚看到一个小朋友在喂鸽子，那种纯真的快乐好有感染力。',
                    '读了一篇关于时间流逝的文章，有点伤感，但也很温暖。'
                ];
                const randomText = mockTexts[Math.floor(Math.random() * mockTexts.length)];
                if (input.value.trim() === '') {
                    input.value = randomText;
                    showToast('🎙️ 语音识别完成 (模拟)');
                }
                return;
            }

            // 开始录音 (模拟)
            isRecording = true;
            btn.textContent = '⏹️';
            btn.style.color = '#e06050';
            document.getElementById('inputArea').classList.add('recording-active');
            showToast('🎙️ 正在录音... 点击停止');

            // 模拟脉冲动画 (通过dot)
            let dots = 0;
            voiceInterval = setInterval(() => {
                dots = (dots + 1) % 4;
                const dotStr = '.'.repeat(dots) + ' '.repeat(3 - dots);
                // 不直接修改input，保持干净
            }, 400);
        }

        // ============================================================
        //  AI 提示更新
        // ============================================================
        function updateAIHint() {
            const hint = document.getElementById('aiHint');
            const msgs = [
                '✨ <strong>AI 洞察</strong> 你最近多次提到“秋天”，要不要创建一个专属合集？',
                '🌱 <strong>AI 提醒</strong> 今天的记录很有温度，继续保持哦！',
                '📚 <strong>AI 推荐</strong> 根据你的记录，推荐阅读《追忆似水年华》',
                '🎨 <strong>AI 灵感</strong> 你记录的这些碎片，可以拼成一首小诗呢',
            ];
            const random = msgs[Math.floor(Math.random() * msgs.length)];
            hint.querySelector('.text').innerHTML = random;
            hint.style.display = 'flex';
        }

        // ============================================================
        //  Toast
        // ============================================================
        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2200);
        }

        // ============================================================
        //  初始化
        // ============================================================
        loadData();

        // 每分钟更新一次时间显示 (模拟实时)
        setInterval(() => {
            renderList();
        }, 60000);

        // 初始AI提示
        setTimeout(() => {
            const hint = document.getElementById('aiHint');
            hint.querySelector('.text').innerHTML =
                '✨ <strong>AI 早安</strong> 今天有什么想记录的吗？每一刻都值得被珍藏。';
        }, 800);

        console.log('📖 拾光记 · AI 日记助手 已加载');
        console.log('💡 提示: 点击🎤模拟语音输入, Ctrl+Enter快速保存');
    </script>

</body>
