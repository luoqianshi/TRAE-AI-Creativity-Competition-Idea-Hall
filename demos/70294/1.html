<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸鱼大师</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        /* 主界面 - 摸鱼页面 */
        .main-box {
            width: 100vw;
            height: 100vh;
            background-color: #f5f7fa;
            padding: 40px;
            display: block;
        }
        .title {
            font-size: 32px;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .tip {
            text-align: center;
            color: #e74c3c;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .game-list {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .game-item {
            width: 180px;
            height: 120px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #34495e;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-item:hover {
            background: #ecf0f1;
        }
        .time-box {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: #2980b9;
        }
        /* 伪装界面 - Excel */
        .excel-mask {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: none;
            padding: 10px;
        }
        .excel-top {
            height: 30px;
            background: #217346;
            color: #fff;
            line-height: 30px;
            padding-left: 10px;
            font-size: 14px;
        }
        .excel-table {
            width: 100%;
            height: calc(100vh - 40px);
            border-collapse: collapse;
        }
        .excel-table td {
            border: 1px solid #ccc;
            width: 80px;
            height: 25px;
        }
        /* 伪装界面 - PPT */
        .ppt-mask {
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: none;
            padding: 10px;
        }
        .ppt-top {
            height: 30px;
            background: #d24726;
            color: #fff;
            line-height: 30px;
            padding-left: 10px;
            font-size: 14px;
        }
        .ppt-content {
            width: 100%;
            height: calc(100vh - 40px);
            border: 1px solid #ccc;
            margin-top: 10px;
            background: #f9f9f9;
        }
    </style>
</head>
<body>
    <!-- 主界面 -->
    <div class="main-box" id="main">
        <h1 class="title">摸鱼大师</h1>
        <p class="tip">⚠️ 双击页面任意位置，一键切换办公伪装界面</p>
        <div class="game-list">
            <div class="game-item">休闲消消乐</div>
            <div class="game-item">经典五子棋</div>
            <div class="game-item">趣味拼图</div>
            <div class="game-item">数字小游戏</div>
        </div>
        <div class="time-box">放松计时：<span id="timer">00:00</span></div>
    </div>

    <!-- Excel 伪装页 -->
    <div class="excel-mask" id="excel">
        <div class="excel-top">Microsoft Excel</div>
        <table class="excel-table">
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        </table>
    </div>

    <!-- PPT 伪装页 -->
    <div class="ppt-mask" id="ppt">
        <div class="ppt-top">Microsoft PowerPoint</div>
        <div class="ppt-content"></div>
    </div>

    <script>
        // 获取DOM元素
        const main = document.getElementById('main');
        const excel = document.getElementById('excel');
        const ppt = document.getElementById('ppt');
        const timerDom = document.getElementById('timer');
        let timer = null;
        let second = 0;

        // 计时功能
        function startTimer() {
            timer = setInterval(() => {
                second++;
                let m = Math.floor(second / 60).toString().padStart(2, '0');
                let s = (second % 60).toString().padStart(2, '0');
                timerDom.innerText = `${m}:${s}`;
            }, 1000);
        }
        startTimer();

        // 双击切换伪装界面 循环切换：主界面 → Excel → PPT → 主界面
        let status = 0;
        document.addEventListener('dblclick', () => {
            main.style.display = 'none';
            excel.style.display = 'none';
            ppt.style.display = 'none';
            status++;
            if (status === 1) {
                excel.style.display = 'block';
            } else if (status === 2) {
                ppt.style.display = 'block';
            } else {
                main.style.display = 'block';
                status = 0;
            }
        });
    </script>
</body>
</html>
