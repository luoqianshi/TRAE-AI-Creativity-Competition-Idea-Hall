        '标注：高可信（原文用四电极体系）'
      ]};
    }
    return { query: query, duration: '1.0s', resultCount: 0, items: [] };
  }

  function integrationReply(agentId, userText) {
    var topic = userText.replace(/^(帮我|请|麻烦)?(查一下|查询|搜索|查找|查|找一下|找|总结一下|归纳一下|总结|归纳|研究一下|调研一下|深入研究|研究|调研|读一下|陪读|读)/, '').trim() || '这个话题';
    if (agentId === 'search') return '查到了，关于「' + topic + '」，目前主流观点是：界面阻抗受测量方法影响很大，四电极体系下 LiNbO₃ 涂层可降低约 10×，但两电极测量会高估。需要我把这几条整理成对比卡片吗？';
    if (agentId === 'summary') return '总结完成。核心要点已抽取为 5 张卡片，挂在你的「固态电池」主线下，要看看吗？';
    if (agentId === 'research') return '研究告一段落。我整理了 3 个争议点和 1 个待验证项，放在控制台的「研究」任务里，你可以随时介入追问。';
    if (agentId === 'reader') return '陪读完成关键章节。已抽取 4 张关键论点卡片，其中 LiNbO₃ 涂层数据我标了「高可信」。继续读还是先聊聊？';
    return '完成了。';
  }

  function updateSendState() {
    var i = chatInput();
    var btn = $('[data-chat-send]');
    if (!i || !btn) return;
    var has = i.value.trim().length > 0 || chatAttachments.length > 0;
    btn.disabled = !has;
  }

  function renderAttachTray() {
    var tray = $('[data-chat-tray]');
    if (!tray) return;
    tray.innerHTML = chatAttachments.map(function (a, idx) {
      return '<span class="nb-chat__att-chip">' + (a.kind === 'image' ? IC.image() : IC.pdf()) + '<span>' + escapeHtml(a.label) + '</span>' +
        '<button data-action="remove-attach" data-idx="' + idx + '" aria-label="移除">×</button></span>';
    }).join('');
    tray.style.display = chatAttachments.length ? 'flex' : 'none';
    updateSendState();
  }

  function addAttachment(kind, label) {
    chatAttachments.push({ kind: kind, label: label });
    renderAttachTray();
    toast('已添加 ' + label);
  }

  /* ---- @ 引用 ---- */

  function mentionEl() { return $('[data-mention]'); }

  function openMention(query) {
    var box = mentionEl();
    if (!box) return;
    var notes = (mock().notes || []).filter(function (n) { return !query || n.title.indexOf(query) >= 0; }).slice(0, 6);
    if (!notes.length) { closeMention(); return; }
    box.innerHTML = notes.map(function (n) {
      return '<button class="nb-mention__item" data-action="pick-mention" data-title="' + escapeHtml(n.title) + '">' +
        escapeHtml(n.title) + '<small>' + escapeHtml((n.tags || []).slice(0, 2).join(' · ')) + '</small></button>';
    }).join('');
    box.classList.add('is-open');
  }

  function closeMention() { var box = mentionEl(); if (box) box.classList.remove('is-open'); }

  function currentMentionQuery() {
    var ta = chatInput();
    if (!ta) return null;
    var pos = ta.selectionStart;
    var val = ta.value.slice(0, pos);
    var m = val.match(/@([^@\s《》]{0,20})$/);
    return m ? { query: m[1], start: pos - m[0].length } : null;
  }

  function insertMention(title) {
    var ta = chatInput();
    if (!ta) return;
    var info = currentMentionQuery();
    var insert = '@《' + title + '》 ';
    if (info) {
      ta.value = ta.value.slice(0, info.start) + insert + ta.value.slice(ta.selectionStart);
    } else {
      ta.value += insert;
    }
    var np = (info ? info.start : ta.value.length - insert.length) + insert.length;
    ta.focus();
    ta.setSelectionRange(np, np);
    closeMention();
    updateSendState();
  }

  function sendChat() {
    var i = chatInput();
    if (!i) return;
    var text = i.value.trim();
    var atts = chatAttachments.slice();
    if (!text && !atts.length) return;
    pushMessage('user', text || '（附件）', atts);
    if (planState) handlePlanningUserMessage(text);
    else if (redesignState) handleWorkspaceRedesignMessage(text);
    i.value = '';
    chatAttachments = [];
    renderAttachTray();
    closeMention();
    updateSendState();
    var echo = text;
    /* redesign 模式：handler 已同步发出操作回复，直接返回，不再 typing */
    if (redesignState) return;
    /* planning 模式不走子智能体调度，由 mockAiReply 的 planning 分支回复 */
    var subAgent = planState ? null : detectSubAgent(echo);
    if (subAgent) {
      /* 调度透明化：先插入 pending 调度状态消息，1.5s 后转完成态 + 林发整合消息 */
      var dispatchMsg = { role: 'dispatch', agentId: subAgent, userText: echo, status: 'pending', expanded: false };
      chatMessages.push(dispatchMsg);
      var dbox = chatMsgs();
      if (dbox) { dbox.insertAdjacentHTML('beforeend', renderMessage(dispatchMsg)); }
      scrollChatBottom();
      window.setTimeout(function () {
        dispatchMsg.status = 'done';
        dispatchMsg.result = subAgentMockResult(subAgent, echo);
        rerenderDispatch(dispatchMsg);
        window.setTimeout(function () {
          pushMessage('ai', integrationReply(subAgent, echo), []);
        }, 280);
      }, 1500);
    } else {
      var typingEl = showTyping();
      window.setTimeout(function () {
        removeTyping(typingEl);
        pushMessage('ai', mockAiReply(echo), []);
      }, 900);
    }
  }

  /* ----------------------------- planning：任务计划状态条 ----------------------------- */

  var PLAN_TYPES = ['custom', '整理笔记', '总结', '深度分析', '陪读 PDF'];
  var PLAN_FREQS = ['一次性', '每日', '每周'];

  function planTypeLabel(t) { return t === 'custom' ? '选择类型…' : t; }

  function makePlanState(draft) {
    draft = draft || {};
    var s = { type: draft.type || 'custom', title: draft.title || '', chips: [], freq: draft.freq || '一次性' };
    if (draft.sourceNotes && draft.sourceNotes.length) s.chips.push('已关联 ' + draft.sourceNotes.length + ' 篇笔记');
    if (draft.topic) { if (!s.title) s.title = draft.topic; s.chips.push(draft.topic); }
    if (draft.pdf) s.chips.push(draft.pdf);
    return s;
  }

  function planSummary() {
    if (!planState) return '';
    var summary = planState.type !== 'custom' ? planState.type : '未定类型';
    if (planState.chips.length) summary += ' · ' + planState.chips.length + ' 项';
    return summary;
  }

  function linOpening(plan) {
    if (plan.type === '陪读 PDF') return '我来陪你读这份 PDF。你希望这次阅读的重点是什么？是关键概念、实验方法，还是论点梳理？';
    if (plan.type === '整理笔记') return '整理这批笔记时，你更想按主题归档，还是按时间线梳理脉络？';
    if (plan.type === '总结') return '我们来设计一个总结任务。你想总结的范围是最近一周，还是某个特定主题？';
    if (plan.type === '深度分析') return '我们来设计一个深度分析任务。你想聚焦的主题是什么？需要看数据、观点，还是找缺口？';
    return '我们来设计一个任务。你希望让林帮你做什么？整理笔记 / 总结 / 深度分析 / 陪读 PDF ？';
  }

  function showPlanbar() {
    var bar = $('[data-chat-planbar]');
    if (bar) { bar.hidden = false; bar.classList.remove('is-collapsed'); }
    renderPlanbar();
  }
  function hidePlanbar() {
    var bar = $('[data-chat-planbar]');
    if (bar) { bar.hidden = true; bar.classList.remove('is-collapsed'); bar.innerHTML = ''; }
  }

  function updatePlanbarSummary() {
    var sumEl = $('.nb-planbar__summary');
    if (sumEl) sumEl.textContent = planSummary();
  }

  function planField(label, control) {
    return '<div class="nb-planbar__field"><span class="nb-planbar__label">' + label + '</span>' + control + '</div>';
  }

  function renderPlanbar() {
    var bar = $('[data-chat-planbar]');
    if (!bar || !planState) return;
    var typeOpts = PLAN_TYPES.map(function (t) {
      return '<option value="' + escapeHtml(t) + '"' + (planState.type === t ? ' selected' : '') + '>' + escapeHtml(planTypeLabel(t)) + '</option>';
    }).join('');
    var freqOpts = PLAN_FREQS.map(function (f) {
      return '<option value="' + escapeHtml(f) + '"' + (planState.freq === f ? ' selected' : '') + '>' + escapeHtml(f) + '</option>';
    }).join('');
    var chipsHtml = planState.chips.map(function (c) {
      return '<span class="nb-planbar__chip">' + escapeHtml(c) + '</span>';
    }).join('') + '<button class="nb-planbar__addchip" type="button" data-action="plan-add-chip">' + IC.plus() + ' 添加笔记</button>';

    bar.innerHTML =
      '<div class="nb-planbar">' +
      '<div class="nb-planbar__head">' +
      '<button class="nb-planbar__close" type="button" data-action="exit-planning" aria-label="退出任务设计">' + IC.close() + '</button>' +
      '<button class="nb-planbar__title" type="button" data-action="toggle-planbar">' +
      IC.spark() +
      '<span class="nb-planbar__title-text">任务计划草案</span>' +
      '<span class="nb-planbar__summary">' + escapeHtml(planSummary()) + '</span>' +
      '<span class="nb-planbar__chev">' + IC.chev() + '</span>' +
      '</button>' +
      '</div>' +
      '<div class="nb-planbar__body">' +
      planField('类型', '<select class="nb-planbar__control" data-plan="type">' + typeOpts + '</select>') +
      planField('标题', '<input class="nb-planbar__control" data-plan="title" value="' + escapeHtml(planState.title) + '" placeholder="给任务起个名字…">') +
      planField('关联', '<div class="nb-planbar__chips" data-plan="chips">' + chipsHtml + '</div>') +
      planField('频次', '<select class="nb-planbar__control" data-plan="freq">' + freqOpts + '</select>') +
      '</div>' +
      '<button class="nb-btn nb-btn--primary nb-planbar__confirm' + (planReady ? ' is-ready' : '') + '" type="button" data-action="confirm-plan">确认创建任务</button>' +
      '</div>';
  }

  function onPlanbarChange(e) {
    if (!planState) return;
    var t = e.target;
    if (!t || !t.hasAttribute || !t.hasAttribute('data-plan')) return;
    var key = t.getAttribute('data-plan');
    if (key === 'type') planState.type = t.value;
    else if (key === 'freq') planState.freq = t.value;
    renderPlanbar();
  }
  function onPlanbarInput(e) {
    if (!planState) return;
    var t = e.target;
    if (!t || !t.hasAttribute || !t.hasAttribute('data-plan')) return;
    if (t.getAttribute('data-plan') === 'title') {
      planState.title = t.value;
      updatePlanbarSummary();
    }
  }

  function handlePlanningUserMessage(text) {
    planUserMsgCount++;
    var changed = false;
    if (/主题/.test(text)) {
      planState.type = '整理笔记';
      if (planState.chips.indexOf('按主题') < 0) { planState.chips.push('按主题'); changed = true; }
    }
    var numMatch = text.match(/(\d+)\s*篇/);
    if (numMatch) {
      planState.chips = planState.chips.filter(function (c) { return !/^已关联/.test(c); });
      planState.chips.push('已关联 ' + numMatch[1] + ' 篇笔记');
      changed = true;
    }
    if (/每天|每日/.test(text)) { planState.freq = '每日'; changed = true; }
    else if (/每周/.test(text)) { planState.freq = '每周'; changed = true; }
    if (/总结/.test(text)) { planState.type = '总结'; changed = true; }
    if (/分析/.test(text)) { planState.type = '深度分析'; changed = true; }
    if (/陪读/.test(text)) { planState.type = '陪读 PDF'; changed = true; }
    if (changed) renderPlanbar();

    if (planUserMsgCount >= 2 && !planReady) {
      planReady = true;
      var btn = $('.nb-planbar__confirm');
      if (btn) btn.classList.add('is-ready');
    }
  }

  function planDraftFromAssignType(t) {
    if (t === 'organize') return { type: '整理笔记', sourceNotes: ['昨天新增 5 篇'] };
    if (t === 'analyze') return { type: '深度分析', topic: '界面阻抗' };
    if (t === 'pdf') return { type: '陪读 PDF', pdf: '锂电池综述.pdf' };
    if (t === 'summary') return { type: '总结', topic: '群组热议' };
    return { type: 'custom' };
  }

  function addPlannedTask(plan, name) {
    var typeKey = plan.type !== 'custom' ? plan.type : '整理';
    var relateCount = plan.chips.length || 1;
    TASKS.todo.unshift({
      id: 'tp' + Date.now(),
      type: typeKey,
      prio: 'mid',
      name: name,
      count: '关联 ' + relateCount + ' 项',
      assigned: '刚刚由你与林设计',
      plan: plan.freq !== '一次性' ? '频次：' + plan.freq : '等你空闲时开始'
    });
  }

  /* ----------------------------- workspace-redesign：AI 可编辑工作台（Task 1.A.13） -----------------------------
   * 林在对话中真实修改 widgets state（移除/隐藏/加回/加大），用户可应用、撤销或取消（恢复快照）。
   * -------------------------------------------------------------------------- */
  var redesignUndoTimer = null;

  function startWorkspaceRedesign() {
    redesignState = {
      log: [],
      snapshot: state.widgets.map(function (w) { return JSON.parse(JSON.stringify(w)); }),
      history: []
    };
  }

  function widgetNameByType(t) {
    return ({ todo: '待办', chat: '对话', hotspot: '今日热点', recall: '笔记回顾', free: '便签', 'ai-suggestion': 'AI 建议' })[t] || t;
  }

  function showRedesignPlanbar() {
    var bar = $('[data-chat-planbar]');
    if (bar) { bar.hidden = false; bar.classList.remove('is-collapsed'); }
    renderRedesignPlanbar();
  }
  function hideRedesignPlanbar() {
    var bar = $('[data-chat-planbar]');
    if (bar) { bar.hidden = true; bar.classList.remove('is-collapsed'); bar.innerHTML = ''; }
  }

  function renderRedesignPlanbar() {
    var bar = $('[data-chat-planbar]');
    if (!bar || !redesignState) return;
    var logHtml;
    if (redesignState.log.length) {
      logHtml = redesignState.log.map(function (l) {
        return '<div class="nb-rdp__log-line">· ' + escapeHtml(l) + '</div>';
      }).join('');
    } else {
      logHtml = '<div class="nb-rdp__log-line nb-rdp__log-line--empty">· (等待你的指示)</div>';
    }
    bar.innerHTML =
      '<div class="nb-planbar nb-rdp">' +
      '<div class="nb-planbar__head">' +
      '<button class="nb-planbar__close" type="button" data-action="exit-redesign" aria-label="退出工作台调整">' + IC.close() + '</button>' +
      '<div class="nb-planbar__title"><span class="nb-planbar__title-text">✦ 工作台调整</span></div>' +
      '</div>' +
      '<div class="nb-rdp__body">' +
      '<div class="nb-rdp__section-label">操作记录</div>' +
      '<div class="nb-rdp__log">' + logHtml + '</div>' +
      '</div>' +
      '<button class="nb-btn nb-btn--primary nb-rdp__apply" type="button" data-action="apply-redesign">应用更改</button>' +
      '</div>';
  }

  function handleWorkspaceRedesignMessage(text) {
    if (!redesignState) return;
    /* 撤销优先 */
    if (/撤销|撤回|退回/.test(text)) { undoLastRedesign(); return; }

    var changed = false;
    var reply = null;

    /* 太乱/简化 → 移除今日热点 + 笔记回顾 */
    if (/太乱|简化|太多|精简/.test(text)) {
      var removedNames = [];
      var removedSnap = [];
      state.widgets.forEach(function (w) {
        if ((w.type === 'hotspot' || w.type === 'recall') && !w.hidden) {
          removedNames.push(widgetNameByType(w.type));
          removedSnap.push(JSON.parse(JSON.stringify(w)));
        }
      });
      if (removedSnap.length) {
        state.widgets = state.widgets.filter(function (w) { return !(w.type === 'hotspot' || w.type === 'recall'); });
        redesignState.history.push({ type: 'remove', widgets: removedSnap });
        redesignState.log.push('移除 ' + removedNames.join(' / '));
        reply = '好的，我把' + removedNames.join('和') + '移除了，工作台清爽多了。还需要再简化吗？';
        changed = true;
      }
    }
    /* 专注/写作 → 隐藏除 todo/ai-suggestion/chat 外的组件 */
    else if (/专注|写作|聚焦/.test(text)) {
      var hiddenIds = [];
      state.widgets.forEach(function (w) {
        if (['hotspot', 'recall', 'free'].indexOf(w.type) >= 0 && !w.hidden) { w.hidden = true; hiddenIds.push(w.id); }
      });
      if (hiddenIds.length) {
        redesignState.history.push({ type: 'hide', ids: hiddenIds });
        redesignState.log.push('聚焦写作：隐藏热点 / 回顾 / 便签');
        reply = '好的，我让工作台更聚焦写作——只留待办、对话和 AI 建议。写完想恢复随时说「加回」。';
        changed = true;
      }
    }
    /* 加大 X / X 大一点 */
    else if (/(加大|大一点|放大|更大|调高|更高)/.test(text)) {
      var resizeMap = { '待办': 'todo', '热点': 'hotspot', '回顾': 'recall', '便签': 'free', '建议': 'ai-suggestion', '对话': 'chat' };
      Object.keys(resizeMap).forEach(function (kw) {
        if (changed) return;
        if (text.indexOf(kw) >= 0) {
          var t = resizeMap[kw];
          var target = null;
          for (var i = 0; i < state.widgets.length; i++) {
            if (state.widgets[i].type === t && !state.widgets[i].hidden) { target = state.widgets[i]; break; }
          }
          if (target) {
            var oldH = target.height || 240;
            target.height = Math.min(400, oldH + 80);
            redesignState.history.push({ type: 'resize', id: target.id, oldH: oldH });
            redesignState.log.push('加大 ' + kw + '（→ ' + target.height + 'px）');
            reply = '好的，我把' + kw + '加大了，现在 ' + target.height + 'px 高，看得更清楚。';
            changed = true;
          }
        }
      });
    }
    /* 加 X / 加回 X / 恢复 */
    else if (/加|恢复|回来/.test(text)) {
      var addMap = { '待办': 'todo', '热点': 'hotspot', '回顾': 'recall', '便签': 'free', '建议': 'ai-suggestion', '对话': 'chat' };
      var addedKws = [];
      Object.keys(addMap).forEach(function (kw) {
        if (text.indexOf(kw) < 0) return;
        var t = addMap[kw];
        var items = [];
        state.widgets.forEach(function (w) {
          if (w.type === t && w.hidden) { w.hidden = false; items.push({ id: w.id, kind: 'unhide' }); }
        });
        if (items.length) {
          redesignState.history.push({ type: 'add', items: items });
          redesignState.log.push('加回 ' + kw);
          addedKws.push(kw);
        } else {
          var existed = state.widgets.some(function (w) { return w.type === t; });
          if (!existed) {
            var nw = newWidgetDefault(t);
            state.widgets.push(nw);
            redesignState.history.push({ type: 'add', items: [{ id: nw.id, kind: 'create' }] });
            redesignState.log.push('新增 ' + kw);
            addedKws.push(kw);
          }
        }
      });
      if (addedKws.length) {
        reply = '好的，我把' + addedKws.join('、') + '加回来了。';
        changed = true;
      }
    }

    if (changed) {
      renderRedesignPlanbar();
      showRedesignUndoToast();
      pushMessage('ai', reply || '好的，已调整。', []);
    } else {
      pushMessage('ai', '嗯，你想怎么调整？可以说「太乱了简化一下」「专注写作」，或者「加回热点」「加大待办」。', []);
    }
  }

  function undoLastRedesign() {
    if (!redesignState || !redesignState.history.length) {
      pushMessage('ai', '没有可撤销的调整了。', []);
      return;
    }
    var last = redesignState.history.pop();
    var undone = redesignState.log.pop();
    if (last.type === 'remove') {
      last.widgets.forEach(function (snap) {
        var exists = state.widgets.some(function (w) { return w.id === snap.id; });
        if (!exists) state.widgets.push(JSON.parse(JSON.stringify(snap)));
      });
    } else if (last.type === 'hide') {
      last.ids.forEach(function (id) { var f = findWidget(id); if (f) f.w.hidden = false; });
    } else if (last.type === 'add') {
      last.items.forEach(function (it) {
        if (it.kind === 'unhide') { var f = findWidget(it.id); if (f) f.w.hidden = true; }
        else { var f2 = findWidget(it.id); if (f2) state.widgets.splice(f2.i, 1); }
      });
    } else if (last.type === 'resize') {
      var fr = findWidget(last.id);
      if (fr) fr.w.height = last.oldH;
    }
    redesignState.log.push('撤销：' + (undone || '上一步'));
    renderRedesignPlanbar();
    pushMessage('ai', '好，我撤销了「' + (undone || '上一步') + '」。', []);
  }

  /* ---- Task 1.A.12：工作台组件 · 长按进入编辑态 + 拖拽手柄调高度 ---- */
  function bindWidgetInteractions() {
    var root = $('[data-nb-root]');
    if (!root) return;
    var pressTimer = null;
    var pressedCard = null;
    var pressX = 0;
    var pressY = 0;
    var drag = null;
    var editingId = null;

    function pointOf(e) {
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    function isInteractive(t) {
      return !!(t.closest('[data-action], input, textarea, [contenteditable="true"], .nb-wmenu, a') ||
                t.closest('button:not(.nb-widget__handle)'));
    }
    function enterEdit(card, id) {
      $all('.nb-widget.is-editing').forEach(function (c) { c.classList.remove('is-editing'); });
      card.classList.add('is-editing');
      editingId = id;
    }
    function exitEdit() {
      $all('.nb-widget.is-editing').forEach(function (c) { c.classList.remove('is-editing'); });
      editingId = null;
    }

    function down(e) {
      var handle = e.target.closest('[data-widget-handle]');
      if (handle && editingId) {
        var hc = handle.closest('.nb-widget');
        if (!hc) return;
        var hid = handle.getAttribute('data-widget-handle');
        var p = pointOf(e);
        drag = { id: hid, card: hc, startY: p.y, startH: parseInt(hc.style.height, 10) || 240 };
        hc.classList.add('is-dragging');
        if (e.cancelable) e.preventDefault();
        return;
      }
      var card = e.target.closest('.nb-widget');
      if (!card) { if (editingId) exitEdit(); return; }
      if (isInteractive(e.target)) return;
      pressedCard = card;
      var p2 = pointOf(e);
      pressX = p2.x; pressY = p2.y;
      if (pressTimer) clearTimeout(pressTimer);
      var idForEdit = card.getAttribute('data-widget');
      pressTimer = setTimeout(function () {
        enterEdit(card, idForEdit);
        toast('拖拽右下角手柄调整高度，点空白退出');
        pressedCard = null;
      }, 500);
    }

    function move(e) {
      if (drag) {
        var p = pointOf(e);
        var dy = p.y - drag.startY;
        var nh = Math.max(120, Math.min(400, drag.startH + dy));
        drag.card.style.height = nh + 'px';
        var badge = drag.card.querySelector('.nb-widget__height-badge');
        if (badge) badge.textContent = nh + 'px';
        if (e.cancelable) e.preventDefault();
        return;
      }
      if (pressedCard && pressTimer) {
        var p2 = pointOf(e);
        if (Math.abs(p2.x - pressX) > 10 || Math.abs(p2.y - pressY) > 10) {
          clearTimeout(pressTimer);
          pressTimer = null;
          pressedCard = null;
        }
      }
    }

    function up() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (drag) {
        var nh = parseInt(drag.card.style.height, 10) || 240;
        if (drag.id === 'ai-carousel') {
          state.aiCarouselHeight = nh;
        } else {
          var f = findWidget(drag.id);
          if (f) f.w.height = nh;
        }
        drag.card.classList.remove('is-dragging');
        drag = null;
      }
      pressedCard = null;
    }

    root.addEventListener('touchstart', down, { passive: false });
    root.addEventListener('touchmove', move, { passive: false });
    root.addEventListener('touchend', up);
    root.addEventListener('touchcancel', up);
    root.addEventListener('mousedown', down);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  /* ----------------------------- 事件委托 ----------------------------- */

  function onClick(e) {
    var target = e.target;

    var mentionItem = target.closest('[data-action="pick-mention"]');
    if (mentionItem) { insertMention(mentionItem.getAttribute('data-title')); return; }

    var actEl = target.closest('[data-action]');
    if (!actEl) {
      if (!target.closest('[data-wmenu]')) closeAllWidgetMenus();
      return;
    }
    var action = actEl.getAttribute('data-action');

    switch (action) {
      case 'open-agent': pushView('agent'); break;
      case 'back-workbench': popView(); break;
      case 'open-chat': pushView('chat'); break;
      case 'open-workspace-redesign': pushView('chat', { mode: 'workspace-redesign' }); break;
      case 'open-chatlist': pushView('chatlist'); break;
      case 'new-chat': pushView('chat', { new: true }); break;
      case 'open-chat-by-id': {
        var cid = actEl.getAttribute('data-id');
        pushView('chat', { chatId: cid });
        break;
      }
      case 'open-settings': toast('设置（占位）'); break;
      case 'open-overview':
        if (window.ZX_OVERVIEW) window.ZX_OVERVIEW.open();
        break;
      case 'kanban-tab': {
        /* 点页签 → 翻到对应列 */
        var kIdx = parseInt(actEl.getAttribute('data-idx'), 10) || 0;
        var kBox = $('[data-kanban]');
        if (kBox) {
          var left = kIdx * kBox.clientWidth;
          if (kBox.scrollTo) kBox.scrollTo({ left: left, behavior: 'smooth' }); else kBox.scrollLeft = left;
        }
        setActiveKanbanTab(kIdx);
        break;
      }

      case 'open-template': pushView('template'); break;
      case 'pick-template': {
        var pkey = actEl.getAttribute('data-key');
        if (window.ZX_EDITOR) {
          window.ZX_EDITOR.open(pkey);
          /* 编辑器是独立 overlay（z-index 60），退出模板视图栈回到工作台；
             这样关闭编辑器时直接回到工作台，而非卡在模板选择页 */
          popView();
        } else {
          toast('编辑器加载中...');
        }
        break;
      }
      case 'ai-pick-template': {
        var sug = $('[data-template-suggest]');
        if (sug) sug.classList.add('is-show');
        break;
      }
      case 'dismiss-template-suggest': {
        var sug2 = $('[data-template-suggest]');
        if (sug2) sug2.classList.remove('is-show');
        break;
      }

      case 'toggle-planbar': {
        var pbar = $('[data-chat-planbar]');
        if (pbar) pbar.classList.toggle('is-collapsed');
        break;
      }
      case 'plan-add-chip': {
        if (!planState) break;
        var hadRel = -1;
        for (var ci = planState.chips.length - 1; ci >= 0; ci--) { if (/^已关联/.test(planState.chips[ci])) { hadRel = ci; break; } }
        if (hadRel >= 0) {
          var cm = planState.chips[hadRel].match(/(\d+)/);
          var cn = cm ? (parseInt(cm[1], 10) + 1) : 2;
          planState.chips[hadRel] = '已关联 ' + cn + ' 篇笔记';
        } else {
          planState.chips.push('已关联 1 篇笔记');
        }
        renderPlanbar();
        break;
      }
      case 'exit-planning': {
        var hadPlan = !!planState;
        planState = null; planReady = false; planUserMsgCount = 0;
        hidePlanbar();
        setChatTop('林', '在线 · 你的工作伙伴');
        if (hadPlan) {
          toast('已保存任务草稿，可稍后继续设计');
          pushMessage('ai', '好，我们换个节奏。需要再设计任务时随时叫我。');
        }
        break;
      }
      case 'confirm-plan': {
        if (!planReady || !planState) { toast('再聊几句，把任务设计完整'); break; }
        var taskName = planState.title || (planState.type !== 'custom' ? planState.type + '任务' : '新任务');
        var returnToAgent = stack.length >= 2 && stack[stack.length - 2] === 'agent';
        addPlannedTask(planState, taskName);
        planState = null; planReady = false; planUserMsgCount = 0;
        toast('已创建任务：' + taskName, true);
        popView();
        if (returnToAgent) renderKanban();
        break;
      }

      /* ---- Task 1.A.13：工作台调整的应用 / 取消 / 撤销 ---- */
      case 'apply-redesign': {
        if (!redesignState) break;
        redesignState = null;
        if (redesignUndoTimer) { clearTimeout(redesignUndoTimer); redesignUndoTimer = null; }
        var applyToast = $('[data-toast]'); if (applyToast) { applyToast.classList.remove('is-show', 'nb-toast--undo'); applyToast.innerHTML = ''; }
        hideRedesignPlanbar();
        setChatTop('林', '在线 · 你的工作伙伴');
        toast('工作台已按林的调整更新', true);
        popView();
        renderWidgets();
        break;
      }
      case 'exit-redesign': {
        if (redesignState && redesignState.snapshot) {
          state.widgets = redesignState.snapshot;
        }
        redesignState = null;
        if (redesignUndoTimer) { clearTimeout(redesignUndoTimer); redesignUndoTimer = null; }
        var exitToast = $('[data-toast]'); if (exitToast) { exitToast.classList.remove('is-show', 'nb-toast--undo'); exitToast.innerHTML = ''; }
        hideRedesignPlanbar();
        setChatTop('林', '在线 · 你的工作伙伴');
        popView();
        renderWidgets();
        break;
      }
      case 'undo-redesign': {
        undoLastRedesign();
        break;
      }

      case 'toggle-dispatch': {
        var did = actEl.getAttribute('data-id');
        for (var di = 0; di < chatMessages.length; di++) {
          if (chatMessages[di] && chatMessages[di]._domId === did) {
            chatMessages[di].expanded = !chatMessages[di].expanded;
            rerenderDispatch(chatMessages[di]);
            break;
          }
        }
        break;
      }
      case 'toggle-taskchip': {
        var chipBox = $('[data-chat-taskchip]');
        if (chipBox && !chipBox.hidden) chipBox.classList.toggle('is-collapsed');
        break;
      }
      case 'close-taskchip': {
        var chipBox2 = $('[data-chat-taskchip]');
        if (chipBox2) { chipBox2.hidden = true; chipBox2.classList.remove('is-collapsed'); chipBox2.innerHTML = ''; }
        break;
      }

      case 'open-add-widget': renderAddWidgetList(); openSheet('add-widget'); break;
      case 'pick-widget': {
        var type = actEl.getAttribute('data-type');
        state.widgets.push(newWidgetDefault(type));
        renderWidgets();
        closeSheet();
        toast('已添加「' + (WIDGET_META[type] ? WIDGET_META[type].chip : type) + '」组件');
        break;
      }

      case 'widget-menu': {
        var id = actEl.getAttribute('data-id');
        var menu = actEl.parentElement.querySelector('[data-wmenu]');
        var isOpen = menu && menu.classList.contains('is-open');
        closeAllWidgetMenus();
        if (menu && !isOpen) { menu.classList.add('is-open'); menu.setAttribute('data-for', id); }
        e.stopPropagation();
        break;
      }
      case 'w-delete': { removeWidgetById(currentMenuId(actEl)); closeAllWidgetMenus(); toast('已删除组件'); break; }
      case 'w-pin': { pinWidgetById(currentMenuId(actEl)); closeAllWidgetMenus(); toast('已置顶'); break; }
      case 'w-todo': { convertToTodo(currentMenuId(actEl)); closeAllWidgetMenus(); toast('已转为待办'); break; }
      case 'w-settings': closeAllWidgetMenus(); toast('组件设置（占位）'); break;

      case 'sug-start': {
        var w = findWidget(actEl.getAttribute('data-id'));
        var draft = planDraftFromAssignType(w ? w.w.assignType : null);
        pushView('chat', { mode: 'planning', planDraft: draft });
        break;
      }
      case 'sug-ignore': {
        var igId = actEl.getAttribute('data-id');
        var igSlide = actEl.closest('[data-slide-id]');
        if (igSlide) {
          igSlide.style.transition = 'opacity .2s ease, transform .2s ease';
          igSlide.style.opacity = '0';
          igSlide.style.transform = 'scale(0.96)';
          window.setTimeout(function () { removeWidgetById(igId); toast('已忽略该建议'); }, 200);
        } else {

      case 'todo-toggle': {
        var f = findWidget(actEl.getAttribute('data-id'));
        var idx = parseInt(actEl.getAttribute('data-idx'), 10);
        if (f && f.w.type === 'todo') { f.w.items[idx].done = !f.w.items[idx].done; renderWidgets(); }
        break;
      }
      case 'todo-add': {
        var fa = findWidget(actEl.getAttribute('data-id'));
        if (fa && fa.w.type === 'todo') { fa.w.items.push({ text: '新待办事项', done: false }); renderWidgets(); }

      }

      case 'open-hot': toast('进入热点预览（占位）'); break;
      case 'open-recall': {
        var note = actEl.getAttribute('data-note');
        var nn = noteById(note);
        toast('打开笔记：《' + (nn ? nn.title.slice(0, 12) + '…' : '—') + '》（占位）');
        break;
      }

      case 'open-assign': pushView('chat', { mode: 'planning', planDraft: { type: 'custom' } }); break;
      case 'close-sheet': closeSheet(); break;

      case 'open-sub-agent': {
        var sid = actEl.getAttribute('data-id');
        var sa = AGENTS[sid];
        toast(sa ? ('打开「' + sa.name + '」智能体最近子会话（占位）') : '子会话（占位）', true);
        break;
      }
      case 'open-task': {
        var tid = actEl.getAttribute('data-id');
        renderDetail(tid);
        pushView('detail');
        break;
      }
      case 'back-agent': popView(); break;
      case 't-detail': {
        var card = actEl.closest('[data-id]');
        if (card) { renderDetail(card.getAttribute('data-id')); pushView('detail'); }
        break;
      }
      case 't-pause': toast('已暂停任务'); break;
      case 't-start': toast('任务已开始，林开始工作'); break;
      case 't-edit': toast('编辑任务（占位）'); break;
      case 't-product': toast('查看产物（占位）'); break;
      case 't-redo': toast('已重新指派任务'); break;

      case 'd-pause': toast('已暂停'); break;
      case 'd-resume': toast('已继续'); break;
      case 'd-takeover': toast('已接手任务'); break;
      case 'd-chat': {
        var dTid = currentDetailTaskId;
        pushView('chat', dTid ? { taskId: dTid } : { new: true });
        break;
      }
      case 'd-delete': popView(); toast('任务已删除'); break;

      case 'chat-send': sendChat(); break;
      case 'chat-attach-pdf': addAttachment('pdf', 'battery-review.pdf'); break;
      case 'chat-attach-image': addAttachment('image', 'impedance-curve.png'); break;
      case 'chat-tool-note': {
        var ta = chatInput();
        if (ta) { ta.focus(); var p = ta.selectionStart; ta.value = ta.value.slice(0, p) + '@' + ta.value.slice(p); ta.setSelectionRange(p + 1, p + 1); openMention(''); }
        break;
      }
      case 'remove-attach': {
        var ri = parseInt(actEl.getAttribute('data-idx'), 10);
        chatAttachments.splice(ri, 1); renderAttachTray(); break;
      }
      case 'noop': break;
    }

  function socialBtn(key, num, label) {

  function animateBars(ctx) {
    var bars = $all('[data-pct]', ctx);
    var fn = function () {
      bars.forEach(function (bar) {
        bar.style.width = bar.getAttribute('data-pct') + '%';
      });
    };
    if (window.requestAnimationFrame) {
      window.requestAnimationFrame(function () { window.requestAnimationFrame(fn); });
    } else {

  /* ----------------------------- 渲染：数据卡片 ----------------------------- */
  function renderDataCards() {
    var host = $('[data-pf-cards]');
    if (!host) return;

    MOCK_PROFILE.assets.forEach(function (a) {
      html += ''
        + '<button class="pf-card pf-card--' + a.key + '" data-pf-asset="' + a.key + '">'
        +   '<span class="pf-card__icon">' + zicon(a.icon, 18) + '</span>'

        +   '<span class="pf-card__label">' + escapeHtml(a.label) + '</span>'
        + '</button>';

  }

  /* ----------------------------- 渲染：创作列表 ----------------------------- */
  function renderCreation() {
    var host = $('[data-pf-creation]');
    if (!host) return;
    var html = '<section class="pf-section">'
      + '<div class="pf-section__head"><h3 class="pf-section__title">我的创作</h3></div>'
      + '<div class="pf-tabs" data-pf-tabs>'
      + CREATION_TABS.map(function (t) {
          return '<button class="pf-tab' + (t.key === activeTab ? ' is-active' : '') + '" data-pf-tab="' + t.key + '">' + t.label + '</button>';
        }).join('')
      + '</div>'
      + '<div class="pf-list" data-pf-crelist></div>'
      + '</section>';
    host.innerHTML = html;
    renderCreationList();
  }

  function renderCreationList() {
    var list = $('[data-pf-crelist]');
    if (!list) return;
    var items = MOCK_PROFILE.creation[activeTab] || [];
    var html = '';
    /* 闭环 ⑤：notes tab 顶部展示 bridge 已发布笔记，点击「继续编辑」回编辑器 */
    if (activeTab === 'notes') {
      var bridgeNotes = (window.ZX_BRIDGE && window.ZX_BRIDGE.getPublishedNotes()) || [];
      bridgeNotes.forEach(function (n) {
        html += '<div class="pf-cre pf-cre--draft" data-bridge-id="' + n.id + '">'
          +  '<div class="pf-cre__row">'
          +    '<h4 class="pf-cre__title">' + escapeHtml(n.title) + '</h4>'
          +    '<button class="pf-cre__edit" data-bridge-edit="' + n.id + '">' + IC.pencil(13) + '继续编辑</button>'
          +  '</div>'
          +  '<p class="pf-cre__excerpt">' + escapeHtml(n.summary) + '</p>'
          +  '<div class="pf-cre__meta"><span class="zx-fingerprint zx-fingerprint--me">我·已发布</span><span>·</span><span>' + escapeHtml(n.time || '刚刚') + '</span><span>·</span><span>' + (n.likes || 0) + ' 赞同</span></div>'
          + '</div>';
      });
    }
    if (!items.length && !html) {
      list.innerHTML = '<div class="pf-empty">这里还空着，去创作吧</div>';
      return;
    }
    html += items.map(function (it, i) { return renderCreItem(it, i); }).join('');
    list.innerHTML = html;
  }

  function renderCreItem(it, i) {
    if (it.type === 'draft') {
      return ''
        + '<div class="pf-cre pf-cre--draft" data-pf-item="' + i + '">'
        +   '<div class="pf-cre__row">'
        +     '<h4 class="pf-cre__title">' + escapeHtml(it.title) + '</h4>'
        +     '<button class="pf-cre__edit" data-pf-edit="' + i + '">' + IC.pencil(13) + '继续编辑</button>'
        +   '</div>'
        +   '<p class="pf-cre__excerpt">' + escapeHtml(it.excerpt) + '</p>'
        +   '<div class="pf-cre__meta"><span>' + escapeHtml(it.words) + '</span><span>·</span><span>更新于 ' + escapeHtml(it.updated) + '</span></div>'
        + '</div>';
    }
    if (it.type === 'debate') {
      return ''
        + '<div class="pf-cre pf-cre--debate" data-pf-item="' + i + '">'
        +   '<div class="pf-cre__row">'
        +     '<h4 class="pf-cre__title">' + escapeHtml(it.title) + '</h4>'
        +     '<span class="pf-cre__stance pf-cre__stance--' + it.stance + '">' + escapeHtml(it.stanceLabel) + '</span>'
        +   '</div>'
        +   '<div class="pf-cre__meta">'
        +     '<span>' + IC.like(12) + formatK(it.likes) + ' 赞成</span>'
        +     '<span>·</span><span>' + escapeHtml(it.time) + '</span>'
        +   '</div>'
        + '</div>';
    }
    var fp = it.fingerprint ? '<span class="zx-fingerprint zx-fingerprint--' + it.fingerprint + '">' + escapeHtml(it.fpLabel || '') + '</span>' : '';
    return ''
      + '<div class="pf-cre pf-cre--' + (it.type === 'fav' ? 'fav' : 'note') + '" data-pf-item="' + i + '">'
      +   '<h4 class="pf-cre__title">' + escapeHtml(it.title) + '</h4>'
      +   (it.excerpt ? '<p class="pf-cre__excerpt">' + escapeHtml(it.excerpt) + '</p>' : '')
      +   '<div class="pf-cre__meta">'
      +     fp
      +     (it.likes != null ? '<span>' + IC.like(12) + formatK(it.likes) + '</span>' : '')
      +     (it.comments != null ? '<span>' + IC.comment(12) + it.comments + '</span>' : '')
      +     (it.sediment != null ? '<span>' + IC.sediment(12) + formatK(it.sediment) + '</span>' : '')
      +     '<span>·</span><span>' + escapeHtml(it.time || '') + '</span>'
      +     (it.author ? '<span>·</span><span>' + escapeHtml(it.author) + '</span>' : '')
      +   '</div>'
      + '</div>';
  }

  function switchTab(key) {
    activeTab = key;
    $all('[data-pf-tab]').forEach(function (t) {
      t.classList.toggle('is-active', t.getAttribute('data-pf-tab') === key);
    });
    renderCreationList();
  }

  function scrollToCreation() {
    var host = $('[data-pf-creation]');
    if (host && host.scrollIntoView) host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ----------------------------- 渲染：工作流 ----------------------------- */
  function renderWorkflows() {
    var host = $('[data-pf-workflows]');
    if (!host) return;
    var html = '<section class="pf-section">'
      + '<div class="pf-section__head">'
      +   '<h3 class="pf-section__title">我的工作流</h3>'
      +   '<button class="pf-section__action" data-pf-flow-new>' + IC.plus(13) + '新建</button>'
      + '</div>'
      + '<div class="pf-flow-row">';
    MOCK_PROFILE.workflows.forEach(function (w, i) {
      html += ''
        + '<button class="pf-flow" data-pf-flow="' + i + '">'
        +   '<span class="pf-flow__icon">' + zicon(w.icon, 18) + '</span>'
        +   '<h4 class="pf-flow__name">' + escapeHtml(w.name) + '</h4>'
        +   '<p class="pf-flow__desc">' + escapeHtml(w.desc) + '</p>'
        +   '<span class="pf-flow__uses">已用 ' + w.uses + ' 次</span>'
        + '</button>';
    });
    html += '</div></section>';
    host.innerHTML = html;
  }

  /* ----------------------------- 渲染：成就 ----------------------------- */
  function renderAchievements() {
    var host = $('[data-pf-achievements]');
    if (!host) return;
    var unlocked = MOCK_PROFILE.achievements.filter(function (a) { return a.unlocked; }).length;
    var total = MOCK_PROFILE.achievements.length;
    var html = '<section class="pf-section">'
      + '<div class="pf-section__head">'
      +   '<h3 class="pf-section__title">成就 <span class="pf-section__count">' + unlocked + '/' + total + '</span></h3>'
      +   '<button class="pf-section__action" data-pf-ach-all>查看全部</button>'
      + '</div>'
      + '<div class="pf-ach-row">';
    MOCK_PROFILE.achievements.forEach(function (a, i) {
      var locked = !a.unlocked;
      var styleColor = (a.color && !locked) ? ' style="color:' + a.color + '"' : '';
      html += ''
        + '<button class="pf-ach' + (locked ? ' is-locked' : '') + '" data-pf-ach="' + i + '">'
        +   '<span class="pf-ach__medal"' + styleColor + '>' + IC[a.icon](26)
        +     '<span class="pf-ach__lock">' + IC.lock(11) + '</span>'
        +   '</span>'
        +   '<p class="pf-ach__name">' + escapeHtml(a.name) + '</p>'
        + '</button>';
    });
    html += '</div></section>';
    host.innerHTML = html;
  }

  /* ----------------------------- 渲染：设置子页 ----------------------------- */
  function renderSettings() {
    var host = $('[data-pf-settings-body]');
    if (!host) return;
    var html = '';
    MOCK_PROFILE.settings.forEach(function (g) {
      html += '<div class="pf-settings-group">'
        + (g.label ? '<p class="pf-settings-group__label">' + escapeHtml(g.label) + '</p>' : '')
        + '<div class="pf-settings-list">';
      g.items.forEach(function (it) {
        var danger = it.danger ? ' pf-settings-item--danger' : '';
        var iconHtml = IC[it.icon] ? IC[it.icon](17) : zicon(it.icon, 17);
        html += ''
          + '<button class="pf-settings-item' + danger + '" data-pf-setting="' + escapeHtml(it.key) + '">'
          +   '<span class="pf-settings-item__icon">' + iconHtml + '</span>'
          +   '<span class="pf-settings-item__main">'
          +     '<span class="pf-settings-item__name">' + escapeHtml(it.name) + '</span>'
          +     (it.hint ? '<span class="pf-settings-item__hint">' + escapeHtml(it.hint) + '</span>' : '')
          +   '</span>'
          +   '<span class="pf-settings-item__chev">' + IC.chev(16) + '</span>'
          + '</button>';
      });
      html += '</div></div>';
    });
    host.innerHTML = html;
  }

  /* ----------------------------- 交互 ----------------------------- */
  function openSettings() { var r = $('[data-pf-root]'); if (r) r.classList.add('is-settings'); }
  function closeSettings() { var r = $('[data-pf-root]'); if (r) r.classList.remove('is-settings'); }

  function toast(msg) {
    var t = $('[data-pf-toast]');
    if (!t) return;
    t.innerHTML = '<span class="pf-toast__ico">' + IC.spark(14) + '</span>' + escapeHtml(msg);
    t.classList.add('is-show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('is-show'); }, 1800);
  }

  function settingName(key) {
    var name = key;
    MOCK_PROFILE.settings.forEach(function (g) {
      g.items.forEach(function (it) { if (it.key === key) name = it.name; });
    });
    return name;
  }

  function delegate(root) {
    root.addEventListener('click', function (e) {
      var node;
      if ((node = e.target.closest('[data-action="settings"]'))) { openSettings(); return; }
      if ((node = e.target.closest('[data-action="switch-account"]'))) { toast('切换账号（demo）'); return; }
      if ((node = e.target.closest('[data-action="scan"]'))) { toast('扫一扫（demo）'); return; }

      if ((node = e.target.closest('[data-pf-settings-close]'))) { closeSettings(); return; }

      if ((node = e.target.closest('[data-pf-auth-toggle]'))) {
        var row = $('[data-pf-auth-row]');
        if (row) row.classList.toggle('is-open');
        return;
      }

      if ((node = e.target.closest('[data-pf-social]'))) {
        var sk = node.getAttribute('data-pf-social');
        var map = { following: '关注列表', followers: '粉丝列表', likes: '获赞记录' };
        toast((map[sk] || '列表') + '（demo）');
        return;
      }

      if ((node = e.target.closest('[data-pf-asset]'))) {
        var k = node.getAttribute('data-pf-asset');
        if (k === 'notes') { switchTab('notes'); scrollToCreation(); return; }
        if (k === 'debates') { switchTab('debates'); scrollToCreation(); return; }
        toast(k === 'teams' ? '我的团队（demo）' : '列表（demo）');
        return;
      }

      if ((node = e.target.closest('[data-pf-tab]'))) {
        switchTab(node.getAttribute('data-pf-tab'));
        return;
      }

      if ((node = e.target.closest('[data-bridge-edit]'))) {
        e.stopPropagation();
        var bid = node.getAttribute('data-bridge-edit');
        if (window.ZX_BRIDGE) window.ZX_BRIDGE.openNoteInEditor(bid);
        else toast('编辑器加载中…');
        return;
      }

      if ((node = e.target.closest('[data-pf-edit]'))) {
        e.stopPropagation();
        toast('继续编辑草稿（demo）');
        return;
      }

      if ((node = e.target.closest('[data-pf-item]'))) {
        toast('打开内容（demo）');
        return;
      }

      if ((node = e.target.closest('[data-pf-flow-new]'))) { toast('新建工作流（demo）'); return; }
      if ((node = e.target.closest('[data-pf-flow]'))) {
        var fi = +node.getAttribute('data-pf-flow');
        toast('触发「' + MOCK_PROFILE.workflows[fi].name + '」');
        return;
      }

      if ((node = e.target.closest('[data-pf-ach-all]'))) { toast('成就墙（demo）'); return; }
      if ((node = e.target.closest('[data-pf-ach]'))) {
        var ai = +node.getAttribute('data-pf-ach');
        var a = MOCK_PROFILE.achievements[ai];
        toast(a.unlocked ? ('已获得：' + a.name) : ('未解锁：' + a.name));
        return;
      }

      if ((node = e.target.closest('[data-pf-setting]'))) {
        var key = node.getAttribute('data-pf-setting');
        if (key === 'logout') { toast('已退出登录（demo）'); return; }
        toast('打开「' + settingName(key) + '」（demo）');
        return;
      }
    });
  }

  /* ----------------------------- 初始化 ----------------------------- */
  function renderAll() {
    renderHero();
    renderDataCards();
    renderCreation();
    renderWorkflows();
    renderAchievements();
    renderSettings();
  }

  function init() {
    var root = $('[data-pf-root]');
    if (!root) return;
    renderAll();
    delegate(root);
  }

  window.ZX_PROFILE = { init: init, mock: MOCK_PROFILE };

  /* 闭环：切回个人页时刷新创作列表（让新发布的笔记出现） */
  window.addEventListener('zx-tab-active', function (e) {
    if (e.detail && e.detail.tab === 'profile') {
      try { renderCreationList(); } catch (x) {}
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

/* =========================================================================
 * 「知行」App 本体 Demo —— Phase 3 / 发布页逻辑（publish.js）
 * -------------------------------------------------------------------------
 * 职责：
 *   1. 发布页视图栈：main → repo / drafts / history / commit（均右入，可叠加）
 *   2. 发布操作卡：草稿选择 · 公有/私有/团队 segment · 受众 · 标签 · commit message
 *   3. 变更预览 diff（源码 / 预览 切换 · 折叠展开）
 *   4. 仓库列表（搜索 + 排序）→ 仓库详情（分支 · git log commit 历史）
 *   5. 最近活动时间线（发布/编辑/合并/回滚/AI 改动，AI 用鎏金 ✦）
 *   6. 发布确认模态 + Toast
 * 依赖：../demo/shared/icons.js（ZX.icon）· 内联 MOCK_REPOS / MOCK_COMMITS / MOCK_DRAFTS
 * 挂载：window.ZX_PUBLISH
 * 约束：原生 JS + 事件委托，无框架，无 alert/prompt/confirm
 * =======================================================================*/

(function () {
  'use strict';

  /* ----------------------------- 工具 ----------------------------- */

  function $(sel, ctx) { return (ctx || document).querySelector(sel); }
  function $all(sel, ctx) { return Array.prototype.slice.call((ctx || document).querySelectorAll(sel)); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }

  function svg(inner, size) {
    size = size || 22;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + inner + '</svg>';
  }
  function zicon(name, size) { return (window.ZX && typeof window.ZX.icon === 'function') ? window.ZX.icon(name, size || 22) : svg('', size); }

  var IC = {
    drafts:  function () { return svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'); },
    clock:   function () { return svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'); },
    globe:   function () { return svg('<circle cx="12" cy="12" r="8"/><path d="M4 12h16"/><path d="M12 4c2.5 2.4 2.5 13.6 0 16M12 4c-2.5 2.4-2.5 13.6 0 16"/>'); },

        '<p class="pub-commit-row__msg">' + escapeHtml(c.message) + '</p>' +
        '<div class="pub-commit-row__meta">' +
          '<span class="pub-commit-row__hash">' + c.hash + '</span>' +
          '<span class="pub-commit-row__author">' + escapeHtml(c.author || '我') + '</span>' +
          '<span>' + escapeHtml(c.time) + '</span>' +
          head +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function statHTML(num, lbl) {
    return '<div class="pub-detail-stat"><span class="pub-detail-stat__num">' + num + '</span><span class="pub-detail-stat__lbl">' + lbl + '</span></div>';
  }

  function synthesizeCommitDiff(c) {
    if (c.type === 'ai') {
      return [
        { type: 'ctx', text: '// 第二段 · 润色' },
        { type: 'del', text: '优势主要集中在：高电导率、易加工。' },
        { type: 'add', text: '优势可拆解为五点：① 高离子电导率 ② 良好可塑性 ...' },
        { type: 'ai',  text: '林润色：将「主要集中在」改为「可拆解为五点」，更结构化。' }
      ];
    }
    if (c.type === 'merge') {
      return [
        { type: 'ctx', text: 'Merge branch「界面修饰」into main' },
        { type: 'add', text: '+ 4 行来自「界面修饰」分支的界面涂层内容' },
        { type: 'mod', text: '~ 第二章与第三章顺序微调' }
      ];
    }
    if (c.type === 'rollback') {
      return [
        { type: 'del', text: '误删「界面阻抗」一节的内容已撤销' },
        { type: 'add', text: '回滚至 c1d8a9b，恢复 12 行正文' }
      ];
    }
    return [
      { type: 'ctx', text: '# ' + c.message },
      { type: 'add', text: '+ 新增内容段落，建立结构骨架' }
    ];
  }

  /* ----------------------------- 渲染：主视图 ----------------------------- */

  function renderMain() {
    var html =
      '<div class="pub-sec"><div data-pub-action></div></div>' +
      '<div class="pub-sec">' +
        '<div class="pub-sec-head"><h3 class="pub-sec-title pub-sec-title--gold">本次变更</h3></div>' +
        '<div data-pub-diff></div>' +
      '</div>' +
      '<div class="pub-sec">' +
        '<div class="pub-sec-head">' +
          '<h3 class="pub-sec-title pub-sec-title--indigo">我的仓库 <span class="pub-mono" style="font-size:12px;color:var(--neutral-500)" data-pub-repo-count></span></h3>' +
          '<div class="pub-sec-tools"><button class="pub-sec-tool" data-pub-act="repo-sort"><span data-ic="branch"></span><span data-pub-repo-sort-label>' + sortLabel(state.repoSort) + '</span></button></div>' +
        '</div>' +
        '<div class="pub-searchbar"><span data-ic="search"></span><input data-pub-repo-search placeholder="搜索仓库..." aria-label="搜索仓库"></div>' +
        '<div data-pub-repos></div>' +
      '</div>' +
      '<div class="pub-sec">' +
        '<div class="pub-sec-head"><h3 class="pub-sec-title">最近活动</h3></div>' +
        '<div class="pub-timeline" data-pub-timeline>' + MOCK_ACTIVITY.map(tlItemHTML).join('') + '</div>' +
      '</div>';
    var mainScroll = $('[data-pub-main-scroll]');
    if (!mainScroll) { return; }
    mainScroll.innerHTML = html;
    renderAction();
    renderDiff();
    renderRepos();
    updateDraftsCount();
    injectIcons();
  }

  function renderAction() {
    var d = currentDraft();
    var audienceField = '<div class="pub-field' + (state.visibility === 'public' ? '' : ' is-hidden') + '" data-pub-audience-field>' +
      '<span class="pub-field__label">受众范围</span>' + audienceSegmentHTML() + '</div>';

    var html =
      '<div class="pub-action">' +
        '<h3 class="pub-action__title">准备好<em>发布</em>了？</h3>' +
        '<div class="pub-draft-card" data-pub-act="pick-draft" data-draft-id="' + d.id + '">' +
          '<div class="pub-draft-card__thumb">' + IC.edit() + '</div>' +
          '<div class="pub-draft-card__body">' +
            '<p class="pub-draft-card__title">' + escapeHtml(d.title) + '</p>' +
            '<div class="pub-draft-card__meta">最后修改 ' + escapeHtml(d.lastModified) + ' · <span class="pub-mono">+' + d.diff.additions + ' −' + d.diff.deletions + '</span></div>' +
          '</div>' +
          '<span class="pub-draft-card__chev">' + IC.chev() + '</span>' +
        '</div>' +
        '<div class="pub-field"><span class="pub-field__label">可见性</span>' + visSegmentHTML() + '</div>' +
        audienceField +
        '<div class="pub-field"><span class="pub-field__label">标签</span><div class="pub-tags" data-pub-tags>' + tagsHTML() + '</div></div>' +
        '<div class="pub-field">' +
          '<span class="pub-field__label">Commit message</span>' +
          '<textarea class="pub-commit-input" data-pub-commit-input rows="2" placeholder="一句话描述这次改动...">' + escapeHtml(state.commitMsg) + '</textarea>' +
          '<div class="pub-commit-foot"><span>将作为 <span class="pub-mono" data-pub-commit-hash>' + commitHashPreview() + '</span> 提交至 main</span><span data-pub-commit-count>' + state.commitMsg.length + ' 字</span></div>' +
        '</div>' +
        '<button class="pub-btn-publish" data-pub-act="publish">' + IC.check() + ' 发布</button>' +
      '</div>';
    var actionBox = $('[data-pub-action]');
    if (actionBox) actionBox.innerHTML = html;
  }

  function renderDiff() {
    var d = currentDraft();
    var lines = d.diff.lines;
    var short = lines.length <= 5;
    var stats = '<span class="add">+' + d.diff.additions + '</span> <span class="del">−' + d.diff.deletions + '</span> <span class="mod">~' + d.diff.modifications + '</span>';
    var diffCls = 'pub-diff' + (state.diffMode === 'preview' ? ' is-preview' : '') + (short ? ' is-short' : '');
    var html =
      '<div class="' + diffCls + '">' +
        '<div class="pub-diff__head">' +
          '<div class="pub-diff__stats">' + stats + '</div>' +
          '<div class="pub-diff-toggle">' +
            '<button class="pub-diff-toggle__btn' + (state.diffMode === 'source' ? ' is-active' : '') + '" data-pub-act="diff-mode" data-val="source">源码</button>' +
            '<button class="pub-diff-toggle__btn' + (state.diffMode === 'preview' ? ' is-active' : '') + '" data-pub-act="diff-mode" data-val="preview">预览</button>' +
          '</div>' +
        '</div>' +
        '<div class="pub-diff__body' + (state.diffExpanded ? ' is-expanded' : '') + (short ? ' is-short' : '') + '" data-pub-diff-body>' + diffSourceHTML(lines) + '</div>' +
        '<div class="pub-diff-preview' + (state.diffMode === 'preview' ? ' is-on' : '') + '">' + diffPreviewHTML(lines) + '</div>' +
        '<div class="pub-diff-foot">' +
          '<button class="pub-diff-expand' + (state.diffExpanded ? ' is-open' : '') + '" data-pub-act="diff-expand">' + IC.chev() + ' ' + (state.diffExpanded ? '收起' : '展开全部 ' + lines.length + ' 行') + '</button>' +
        '</div>' +
      '</div>';
    var diffBox = $('[data-pub-diff]');
    if (diffBox) diffBox.innerHTML = html;
  }

  function renderRepos() {
    var list = MOCK_REPOS.slice();
    var q = state.repoSearch.trim().toLowerCase();
    if (q) {
      list = list.filter(function (r) {
        return (r.name + ' ' + r.displayName + ' ' + r.desc + ' ' + r.topic).toLowerCase().indexOf(q) >= 0;
      });
    }
    if (state.repoSort === 'stars') { list.sort(function (a, b) { return b.stars - a.stars; }); }
    else if (state.repoSort === 'name') { list.sort(function (a, b) { return a.displayName.localeCompare(b.displayName, 'zh'); }); }

    var html = list.length ? list.map(repoCardHTML).join('') : '<div class="pub-empty">没有匹配的仓库</div>';
    var box = $('[data-pub-repos]');
    if (box) box.innerHTML = html;
    var countEl = $('[data-pub-repo-count]');
    if (countEl) countEl.textContent = '· ' + list.length;
  }

  function updateDraftsCount() {
    var el = $('[data-pub-drafts-count]');
    if (el) el.textContent = MOCK_DRAFTS.length;
  }

  /* ----------------------------- 渲染：子视图 ----------------------------- */

  function renderDrafts() {
    var html;
    if (!MOCK_DRAFTS.length) {
      html = '<div class="pub-empty">没有未发布的草稿<br>去笔记本写点什么吧</div>';
    } else {
      html = MOCK_DRAFTS.map(function (d) {
        return '<div class="pub-draft-row">' +
          '<div class="pub-draft-row__body">' +
            '<h3 class="pub-draft-row__title">' + escapeHtml(d.title) + '</h3>' +
            '<p class="pub-draft-row__meta">最后修改 ' + escapeHtml(d.lastModified) + ' · <span class="pub-mono">+' + d.diff.additions + ' −' + d.diff.deletions + '</span> · ' + escapeHtml((d.tags || []).join(' / ')) + '</p>' +
            '<div class="pub-draft-row__actions">' +
              '<button class="pub-draft-mini pub-draft-mini--edit" data-pub-act="draft-edit" data-draft-id="' + d.id + '">' + IC.edit() + ' 继续编辑</button>' +
              '<button class="pub-draft-mini pub-draft-mini--publish" data-pub-act="draft-publish" data-draft-id="' + d.id + '">' + IC.upload() + ' 发布</button>' +
              '<button class="pub-draft-mini pub-draft-mini--del" data-pub-act="draft-delete" data-draft-id="' + d.id + '">' + IC.del() + ' 删除</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    $('[data-pub-drafts-body]').innerHTML = html;
  }

  function renderHistory() {
    var html = '<div class="pub-sec-head"><h3 class="pub-sec-title">全局活动 · ' + MOCK_ACTIVITY.length + ' 条</h3></div>' +
      '<div class="pub-timeline">' + MOCK_ACTIVITY.map(tlItemHTML).join('') + '</div>';
    $('[data-pub-history-body]').innerHTML = html;
  }

  function renderRepoDetail(repo) {
    var nameEl = $('[data-pub-repo-name]');
    if (nameEl) nameEl.textContent = repo.displayName;
    var html =
      '<div class="pub-detail-info">' +
        '<h3 class="pub-detail-info__name">' + escapeHtml(repo.displayName) + ' ' + visChipHTML(repo.visibility) + ' ' + typeChipHTML(repo.type) + '</h3>' +
        '<p class="pub-detail-info__desc">' + escapeHtml(repo.desc) + '</p>' +
        '<div class="pub-detail-stats">' +
          statHTML(repo.stars, 'Stars') +
          statHTML(repo.forks, 'Forks') +
          statHTML(repo.commitCount, 'Commits') +
          statHTML(repo.branch, '默认分支') +
        '</div>' +
      '</div>' +
      '<div class="pub-branchbar">' +
        '<span class="pub-branchbar__branch">' + IC.branch() + escapeHtml(repo.branch) + '</span>' +
        '<button class="pub-branchbar__new" data-pub-act="new-branch">' + IC.plus() + ' 新建分支</button>' +
      '</div>' +
      '<div class="pub-sec-head"><h3 class="pub-sec-title pub-sec-title--indigo">Commit 历史</h3></div>' +
      '<div class="pub-commit-list">' + repo.commits.map(commitRowHTML).join('') + '</div>';
    $('[data-pub-repo-body]').innerHTML = html;
  }

  function renderCommitDetail(payload) {
    var repo = payload && payload.repo;
    var hash = payload && payload.hash;
    var c = findCommitInRepo(repo, hash) || { hash: hash || '------', message: '（无提交信息）', author: '我', time: '-', type: 'edit' };
    var initial = (c.author || '我').slice(0, 1);
    var color = c.authorColor || '#1D5B7A';
    var lines = synthesizeCommitDiff(c);
    var head =
      '<div class="pub-commit-detail-head">' +
        '<div class="pub-commit-detail-head__hash">' + c.hash + '</div>' +
        '<h2 class="pub-commit-detail-head__msg">' + escapeHtml(c.message) + '</h2>' +
        '<div class="pub-commit-detail-head__meta">' +
          '<span class="pub-commit-row__dot" style="background:' + color + ';width:22px;height:22px;font-size:11px">' + escapeHtml(initial) + '</span>' +
          '<span>' + escapeHtml(c.author || '我') + '</span><span>·</span>' +
          '<span>' + escapeHtml(c.time) + '</span><span>·</span>' +
          '<span>' + escapeHtml(repo ? repo.name : '—') + '</span>' +
        '</div>' +
      '</div>';
    var body =
      '<div class="pub-diff-block">' +
        '<div class="pub-diff-block__head">变更 · ' + lines.length + ' 行</div>' +
        '<div class="pub-diff-block__body">' + diffSourceHTML(lines) + '</div>' +
      '</div>';
    $('[data-pub-commit-body]').innerHTML = head + body;
  }

  /* ----------------------------- 图标注入 ----------------------------- */

  function injectIcons() {
    if (!root) return;
    $all('[data-ic]', root).forEach(function (s) {
      var name = s.getAttribute('data-ic');
      if (IC[name]) s.innerHTML = IC[name]();
    });
  }

  /* ----------------------------- 视图栈 ----------------------------- */

  function viewEl(name) { return $('.pub-view[data-view="' + name + '"]', root); }

  function applyStack() {
    var set = {};
    stack.forEach(function (e) { set[e.name] = true; });
    $all('.pub-view', root).forEach(function (v) {
      v.classList.toggle('is-on', !!set[v.getAttribute('data-view')]);
    });
    var top = stack[stack.length - 1];
    if (top.name === 'drafts') renderDrafts();
    else if (top.name === 'history') renderHistory();
    else if (top.name === 'repo') { currentRepo = top.payload; renderRepoDetail(top.payload); }
    else if (top.name === 'commit') renderCommitDetail(top.payload);

    var topEl = viewEl(top.name);
    if (topEl) { var sc = $('.pub-scroll', topEl); if (sc) sc.scrollTop = 0; }
  }

  function openSub(name, payload) {
    stack.push({ name: name, payload: payload });
    applyStack();
  }

  function back() {
    if (stack.length > 1) { stack.pop(); applyStack(); }
  }

  /* ----------------------------- 业务动作 ----------------------------- */

  function selectDraft(id) {
    var d = null;
    for (var i = 0; i < MOCK_DRAFTS.length; i++) { if (MOCK_DRAFTS[i].id === id) d = MOCK_DRAFTS[i]; }
    if (!d) return;
    state.selectedDraftId = id;
    state.visibility = d.visibility;
    state.audience = d.audience;
    state.tags = d.tags.slice();
    state.commitMsg = '';
    state._tagInputOpen = false;
    renderAction();
    renderDiff();
  }

  function deleteDraft(id) {
    MOCK_DRAFTS = MOCK_DRAFTS.filter(function (d) { return d.id !== id; });
    updateDraftsCount();
    renderDrafts();
    if (state.selectedDraftId === id && MOCK_DRAFTS.length) { selectDraft(MOCK_DRAFTS[0].id); }
    toast('草稿已删除');
  }

  function setVisibility(v) {
    state.visibility = v;
    $all('[data-pub-vis-segment] .pub-segment__btn', root).forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-val') === v);
    });
    var af = $('[data-pub-audience-field]', root);
    if (af) af.classList.toggle('is-hidden', v !== 'public');
  }

  function setAudience(a) {
    state.audience = a;
    $all('[data-pub-audience-segment] .pub-segment__btn', root).forEach(function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-val') === a);
    });
  }

  function renderTags() {
    var box = $('[data-pub-tags]', root);
    if (box) box.innerHTML = tagsHTML();
  }

  function openTagInput() {
    state._tagInputOpen = true;
    renderTags();
    var inp = $('[data-pub-tag-input]', root);
    if (inp) inp.focus();
  }

  function addTag(t) {
    t = (t || '').trim();
    if (!t) return;
    if (state.tags.indexOf(t) >= 0) { state._tagInputOpen = false; renderTags(); return; }
    state.tags.push(t);
    state._tagInputOpen = false;
    renderTags();
  }

  function removeTag(t) {
    state.tags = state.tags.filter(function (x) { return x !== t; });
    renderTags();
  }

  function cycleRepoSort() {
    var order = ['recent', 'stars', 'name'];
    var idx = order.indexOf(state.repoSort);
    state.repoSort = order[(idx + 1) % order.length];
    var lbl = $('[data-pub-repo-sort-label]', root);
    if (lbl) lbl.textContent = sortLabel(state.repoSort);
    renderRepos();
  }

  function openCommitFromCurrentRepo(hash) {
    if (!currentRepo) return;
    openSub('commit', { repo: currentRepo, hash: hash });
  }

  function openCommitFromActivity(hash, repoName) {
    openSub('commit', { repo: findRepoByName(repoName), hash: hash });
  }

  /* ----------------------------- 模态 + Toast ----------------------------- */

  function openModal() {
    var d = currentDraft();
    var commitTxt = state.commitMsg.trim();
    var commitCell = commitTxt ? escapeHtml(commitTxt) : '<span style="color:var(--neutral-500)">（未填写，将使用：「' + escapeHtml(d.commitHint || '更新内容') + '」）</span>';
    var html =
      '<div class="pub-modal__row"><dt>草稿</dt><dd>' + escapeHtml(d.title) + '</dd></div>' +
      '<div class="pub-modal__row"><dt>Commit</dt><dd>' + commitCell + '</dd></div>' +
      '<div class="pub-modal__row"><dt>可见性</dt><dd>' + visChipHTML(state.visibility) + ' ' + escapeHtml(visLabel(state.visibility)) + '</dd></div>' +
      (state.visibility === 'public' ? '<div class="pub-modal__row"><dt>受众</dt><dd>' + escapeHtml(audienceLabel(state.audience)) + '</dd></div>' : '') +
      '<div class="pub-modal__row"><dt>标签</dt><dd>' + (state.tags.length
        ? state.tags.map(function (t) { return '<span class="pub-tag-chip">' + escapeHtml(t) + '</span>'; }).join('')
        : '<span style="color:var(--neutral-500)">无</span>') + '</dd></div>';
    var sum = $('[data-pub-modal-summary]', root);
    if (sum) sum.innerHTML = html;
    var m = $('[data-pub-modal]', root);
    if (m) m.classList.add('is-open');
  }

  function closeModal() {
    var m = $('[data-pub-modal]', root);
    if (m) m.classList.remove('is-open');
  }

  function confirmPublish() {
    closeModal();
    var d = currentDraft();
    toast('已发布「' + d.title + '」 · ' + visLabel(state.visibility) + ' · ' + commitHashPreview(), true);
    /* 闭环 ①：写入 bridge，广场 Feed 会置顶、个人页「我的创作」会出现 */
    if (window.ZX_BRIDGE && d) {
      window.ZX_BRIDGE.publish({
        title: d.title,
        excerpt: d.excerpt || d.summary || '',
        tags: state.tags && state.tags.length ? state.tags.slice() : ['我的发布'],
        visibility: state.visibility
      });
    }
    state.commitMsg = '';
    state.diffExpanded = false;
    renderAction();
    renderDiff();
  }

  function toast(msg, spark) {
    var t = $('[data-pub-toast]', root);
    if (!t) return;
    t.innerHTML = (spark ? '<span class="pub-toast__spark">' + IC.spark() + '</span>' : '') + '<span>' + msg + '</span>';
    t.classList.add('is-show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('is-show'); }, 2600);
  }

  /* ----------------------------- 事件 ----------------------------- */

  function closestAct(node) {
    while (node && node !== root) {
      if (node.getAttribute && node.getAttribute('data-pub-act')) return node;
      node = node.parentNode;
    }
    return null;
  }

  function onClick(e) {
    var t = closestAct(e.target);
    if (!t) return;
    var act = t.getAttribute('data-pub-act');
    switch (act) {
      case 'drafts': openSub('drafts'); break;
      case 'history': openSub('history'); break;
      case 'back': back(); break;
      case 'more': toast('仓库菜单（演示）'); break;
      case 'new-branch': toast('新建分支（演示）'); break;
      case 'vis': setVisibility(t.getAttribute('data-val')); break;
      case 'audience': setAudience(t.getAttribute('data-val')); break;
      case 'tag-add': openTagInput(); break;
      case 'tag-remove': removeTag(t.getAttribute('data-tag')); break;
      case 'diff-expand': state.diffExpanded = !state.diffExpanded; renderDiff(); break;
      case 'diff-mode': state.diffMode = t.getAttribute('data-val'); renderDiff(); break;
      case 'publish': openModal(); break;
      case 'modal-cancel': closeModal(); break;
      case 'modal-confirm': confirmPublish(); break;
      case 'pick-draft': openSub('drafts'); break;
      case 'draft-edit': toast('跳转笔记本继续编辑（演示）'); break;
      case 'draft-publish': selectDraft(t.getAttribute('data-draft-id')); back(); toast('已选为待发布草稿'); break;
      case 'draft-delete': deleteDraft(t.getAttribute('data-draft-id')); break;
      case 'open-repo': { var r = findRepoById(t.getAttribute('data-repo-id')); if (r) openSub('repo', r); break; }
      case 'open-commit': openCommitFromCurrentRepo(t.getAttribute('data-hash')); break;
      case 'tl-item': openCommitFromActivity(t.getAttribute('data-hash'), t.getAttribute('data-repo')); break;
      case 'repo-sort': cycleRepoSort(); break;
      default: break;
    }
  }

  function onInput(e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    if (t.getAttribute('data-pub-commit-input') !== null) {
      state.commitMsg = t.value;
      var cnt = $('[data-pub-commit-count]', root); if (cnt) cnt.textContent = t.value.length + ' 字';
      var hp = $('[data-pub-commit-hash]', root); if (hp) hp.textContent = commitHashPreview();
    } else if (t.getAttribute('data-pub-repo-search') !== null) {
      state.repoSearch = t.value;
      renderRepos();
    }
  }

  function onKeydown(e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    if (t.getAttribute('data-pub-tag-input') !== null) {
      if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); addTag(t.value); }
      else if (e.key === 'Escape' || e.keyCode === 27) { state._tagInputOpen = false; renderTags(); }
      return;
    }
    if ((e.key === 'Escape' || e.keyCode === 27)) {
      var m = $('[data-pub-modal]', root);
      if (m && m.classList.contains('is-open')) { closeModal(); }
    }
  }

  /* ----------------------------- 初始化 ----------------------------- */

  function init() {
    root = $('[data-pub-root]');
    if (!root) return;
    renderMain();
    root.addEventListener('click', onClick);
    root.addEventListener('input', onInput);
    root.addEventListener('keydown', onKeydown);
  }

  var api = {
    init: init,

 * =======================================================================*/

(function () {
  'use strict';

  /* ----------------------------- 工具函数 ----------------------------- */
  function $(sel, ctx) { return (ctx || document).querySelector(sel); }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });

  function svg(inner, size) {
    size = size || 22;

  /* 自绘 icon（共享库未覆盖部分） */
  var IC = {

    like: function (n) { return zicon('like', n || 16); },
    comment: function (n) { return zicon('comment', n || 16); },
    share: function (n) { return zicon('share', n || 16); },
    plus: function (n) { return zicon('plus', n || 13); },
    check: function (n) { return zicon('check', n || 13); },
    close: function (n) { return zicon('close', n || 13); },
    clock: function (n) { return svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>', n); },
    bell: function (n) { return svg('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9z"/><path d="M10 21h4"/>', n); },
    more: function (n) { return svg('<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>', n); },
    bookmark: function (n) { return svg('<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>', n); },
    flame: function (n) { return svg('<path d="M12 3c.5 3-2 4.5-2 7a2 2 0 0 0 4 0c0-.8-.3-1.4-.5-2 2 1.5 3.5 3.8 3.5 6.5a5 5 0 0 1-10 0c0-3.5 3-5.5 3-9 0-1 .8-2 2-2.5z"/>', n); },
    at: function (n) { return svg('<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>', n); },
    graph: function (n) { return zicon('graph', n || 18); },
    book: function (n) { return svg('<path d="M4 19.5V5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1-2-1.5z"/><path d="M8 7h8M8 11h6"/>', n); },
    grid: function (n) { return svg('<rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>', n); },
    list: function (n) { return svg('<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.5"/><circle cx="3.5" cy="12" r="1.5"/><circle cx="3.5" cy="18" r="1.5"/>', n); },
    swap: function (n) { return svg('<path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/>', n); }
  };

  /* ----------------------------- Mock 数据访问 ----------------------------- */
  function mock() {
    return window.ZX_MOCK || (window.ZX && window.ZX.mock) || { notes: [], debates: {}, users: [], feed: {} };
  }
  function noteById(id) {
    var n = mock().notes || [];
    for (var i = 0; i < n.length; i++) { if (n[i].id === id) return n[i]; }
    return null;
  }
  function userById(id) {
    var u = mock().users || [];
    for (var i = 0; i < u.length; i++) { if (u[i].id === id) return u[i]; }
    return { id: id, name: '未知', initials: '?', avatarColor: '#6B655C', authority: 0, domain: '', bio: '' };
  }
  function debateByNote(noteId) {
    var d = mock().debates || {};
    return d[noteId] || null;
  }

  /* 头像 HTML */
  function avatar(user, size) {
    size = size || 24;
    var fontSize = Math.max(9, Math.round(size * 0.46));
    return '<span class="sq-avatar" style="width:' + size + 'px;height:' + size + 'px;'
      + 'background:' + (user.avatarColor || '#1D5B7A') + ';'
      + 'font-size:' + fontSize + 'px">'
      + escapeHtml(user.initials || (user.name || '?').charAt(0))
      + '</span>';

  /* 字符串 hash → 用于稳定的伪随机 */
  function hash(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }

  function formatCount(n) {
    if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }

  /* 计算笔记正反方人数（无 debate 数据时按 likes/dislikes 回退） */
  function debateStats(note) {
    var d = debateByNote(note.id);
    if (d) {
      var total = note.commentCount || (d.pros.length + d.cons.length) * 20;
      return {
        pro: Math.round(total * d.proPercent / 100),
        con: Math.round(total * d.conPercent / 100),
        proPercent: d.proPercent,
        conPercent: d.conPercent,
        hasDebate: true
      };
    }
    return {
      pro: note.likes || 0,
      con: note.dislikes || 0,
      proPercent: note.likes ? Math.round(note.likes * 100 / (note.likes + note.dislikes + 1)) : 50,
      conPercent: note.dislikes ? Math.round(note.dislikes * 100 / (note.likes + note.dislikes + 1)) : 50,
      hasDebate: false
    };
  }

  /* ----------------------------- 状态 ----------------------------- */
  var state = {
    mode: 'xhs',             // 'xhs' | 'zh'
    stack: ['feed'],
    viewParams: {},
    debateTab: 'pro',        // 详情页当前正反 tab
    followed: {},            // authorId -> bool
    likedNotes: {},          // noteId -> bool
    likedComments: {},       // commentId -> bool
    bookmarked: {},          // noteId -> bool
    searchHistory: ['界面阻抗', 'LiNbO₃ 涂层', '钠枝晶'],
    searchKw: '',
    initialized: false
  };

  var MAX_STACK = 5;
  var AXIS = { feed: 'none', detail: 'right', search: 'right', notif: 'right' };
  var EXIT_BY_AXIS = { right: 'left', none: 'none' };

  /* 流向 → 主标签 + 封面图标 */
  var STREAM_META = {
    knowledge:  { tag: '知识', icon: function () { return IC.book(); } },
    creation:   { tag: '创作', icon: function () { return IC.flame(); } },
    review:     { tag: '复盘', icon: function () { return IC.clock(); } },
    discussion: { tag: '讨论', icon: function () { return IC.graph(); } }
  };

  /* ----------------------------- 视图栈 ----------------------------- */
  function viewEl(name) { return $('.sq-view[data-view="' + name + '"]'); }

  function applyStack() {
    $all('.sq-view').forEach(function (v) {
      v.classList.remove('is-on', 'is-covered');
      v.removeAttribute('data-exit');
    });
    stack.forEach(function (name, i) {
      var v = viewEl(name);
      if (!v) return;
      if (i === stack.length - 1) v.classList.add('is-on');
      else v.classList.add('is-covered');
    });
    if (stack.length >= 2) {
      var top = stack[stack.length - 1];
      var under = viewEl(stack[stack.length - 2]);
      if (under) under.setAttribute('data-exit', EXIT_BY_AXIS[AXIS[top]] || 'none');
    }
  }

  function pushView(name, params) {
    if (stack[stack.length - 1] === name && !params) return;
    if (stack.length >= MAX_STACK) {
      toast('页面栈已满，请先返回');
      return;
    }
    stack.push(name);
    state.viewParams[name] = params || null;
    applyStack();
    afterEnter(name, params);
  }

  function popView() {
    if (stack.length <= 1) return;
    var leaving = stack.pop();
    state.viewParams[leaving] = null;
    applyStack();
  }

  function afterEnter(name, params) {
    if (name === 'detail') renderDetail(params && params.noteId);
    if (name === 'search') renderSearch();
    if (name === 'notif') renderNotif();
  }

  /* ----------------------------- Toast ----------------------------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('[data-sq-toast]');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('is-show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('is-show'); }, 1800);
  }

  /* ----------------------------- Feed 顶栏 ----------------------------- */
  function renderFeedTop() {
    var top = $('[data-sq-feed-top]');

    top.innerHTML =

  /* TikTok 风格悬浮切换钮：点一下翻转 图卡 ⇄ 长文 */
  function renderModeFab() {

  /* ----------------------------- Feed 列表 ----------------------------- */
  function feedNotes() {
    var m = mock();
    var notes = m.notes || [];
    // 闭环 ③：bridge 里「我」的发布置顶显示（带 _bridge 标记）
    var bridgeNotes = (window.ZX_BRIDGE && window.ZX_BRIDGE.getPublishedNotes()) || [];
    var ordered = bridgeNotes.slice();
    var seen = {};
    bridgeNotes.forEach(function (n) { seen[n.id] = true; });
    var feed = m.feed || {};
    ['discussion', 'knowledge', 'creation', 'review'].forEach(function (stream) {
      (feed[stream] || []).forEach(function (id) {
        if (seen[id]) return;
        seen[id] = true;
        for (var i = 0; i < notes.length; i++) {
          if (notes[i].id === id) { ordered.push(notes[i]); break; }
        }
      });
    });
    // 补齐未命中的（确保 6-8 条）
    notes.forEach(function (n) {
      if (ordered.length >= 8) return;
      if (!seen[n.id]) { seen[n.id] = true; ordered.push(n); }
    });
    return ordered.slice(0, 8);
  }

  function renderFeed() {

  /* 图卡瀑布流卡片 */
  function renderXhsCard(note) {

    var meta = STREAM_META[stream] || STREAM_META.knowledge;
    // 用 hash 给每张卡一个稳定的封面高度，制造 masonry 参差
    var heights = [136, 156, 176, 196, 216];

    var liked = state.likedNotes[note.id];
    var tag = (note.tags && note.tags[0]) || meta.tag;

    return '<article class="sq-xhs-card zx-reveal" data-action="open-note" data-id="' + note.id + '" style="--i:' + (hash(note.id) % 6) + '" role="button" tabindex="0">'

  function renderDebateList(note, side) {

  function renderComment(c, side, idx) {

  /* 无 debate 时造的两条 mock 评论 */

  /* ----------------------------- 搜索子页 ----------------------------- */
  var HOT_SEARCH = [

    'SEI 膜', 'LiNbO₃ 涂层', '宁德时代', '半固态', 'QuantumScape', 'EIS 等效电路'

  function renderSearchBody() {
    var body = $('[data-sq-search-body]');
    if (!body) return;

    if (!kw) {
      var histHtml = state.searchHistory.length

          + '<h4 class="sq-search__h">热门搜索</h4>'

            + HOT_SEARCH.map(function (k, idx) {

              }).join('')
