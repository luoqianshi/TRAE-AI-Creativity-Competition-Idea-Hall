<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>知行 · Zhixing — App 本体 Demo</title>
  <meta name="description" content="知行 App 本体 Demo · Phase 0：手机外壳 + 5 tab 导航 + 5 占位页。墨韵 · 星图设计语言。">
  <meta name="theme-color" content="#0E0D0B">

  <style>
/* ===== design-tokens.css ===== */
/* design-tokens.css — 「知行」设计令牌：色彩 / 间距 / 圆角 / 阴影 / 缓动，以及浅深双色语义变量 */

:root {
  /* ===== 色彩系统 ===== */
  /* 墨色系：深色模式主背景与文本 */
  --ink-900: #0E0D0B; /* 深色模式主背景、文本 */
  --ink-700: #2A2724; /* 次级背景、卡片描边 */

  /* 纸色系：浅色模式主背景 */
  --paper-50: #FAF6EE;  /* 浅色模式主背景 */
  --paper-100: #F1EADB; /* 次级背景、卡片底 */

  /* 朱砂系：事实 / 信任 / 关键 CTA */
  --cinnabar-500: #C1272D;
  --cinnabar-300: #E58A8E;

  /* 黛青系：知识 / 链接 / 赞同侧 */
  --indigo-500: #1D5B7A;
  --indigo-400: #3E8DB0;

  /* 鎏金系：权威分 / 高亮 / 勋章 */
  --gold-500: #C7A24A;

  /* 中性色：次要文本 */
  --neutral-500: #6B655C;

  /* 派别色：赞成（黛青）/ 反对（赤陶，刻意避开朱砂） */
  --pro: var(--indigo-500);
  --con: #B4602C;

  /* ===== 间距系统 ===== */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;
  --sp-8: 64px;

  /* ===== 圆角 ===== */
  --r-0: 0;
  --r-1: 4px;
  --r-2: 8px;
  --r-3: 12px;
  --r-full: 999px;

  /* ===== 阴影 ===== */
  --shadow-paper: 0 1px 3px rgba(14, 13, 11, 0.06), 0 4px 16px rgba(14, 13, 11, 0.04);
  --shadow-float: 0 8px 24px rgba(14, 13, 11, 0.12), 0 16px 48px rgba(14, 13, 11, 0.08);
  --shadow-deep: 0 0 60px rgba(193, 39, 45, 0.08), 0 0 120px rgba(29, 91, 122, 0.06);

  /* ===== 缓动与时长 ===== */
  --ease-zx: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 160ms;
  --dur-base: 320ms;
  --dur-slow: 640ms;

  /* ===== 语义变量（浅色模式默认：纸色基底 + 墨色文本） ===== */
  --bg: var(--paper-50);
  --fg: var(--ink-900);
  --card-bg: var(--paper-100);
  --border: var(--ink-700);
}

/* 深色模式覆盖：纸色与墨色互换，基底翻转为墨色系 */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: var(--ink-900);
    --fg: var(--paper-50);
    --card-bg: var(--ink-700);
    --border: var(--ink-700);
  }
}

/* ===== typography.css ===== */
/* typography.css — 「知行」字体引入与基础排版：宋体展示 / 黑体正文 / 等宽数据 */

@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap");

:root {
  /* 展示字体：思源宋体优先，西文回退 Fraunces */
  --font-display: "Source Han Serif SC", "Noto Serif SC", "Songti SC", "Fraunces", "Cormorant Garamond", serif;
  /* 正文字体：思源黑体优先 */
  --font-body: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "IBM Plex Sans", system-ui, sans-serif;
  /* 等宽字体：数据 / 指纹 / 权威分 */
  --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", "Consolas", monospace;
}

/* 基础正文：黑体 16px，行高 1.75，开启 palt 改善中日韩混排密度 */
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  color: var(--fg);
  font-feature-settings: "palt" 1;
}

/* 一级标题：宋体展示 */
h1 {
  font-family: var(--font-display);
  font-size: 28px;
  line-height: 1.25;
}

/* 二级标题：宋体展示 */
h2 {
  font-family: var(--font-display);
  font-size: 22px;
  line-height: 1.3;
}

/* 桌面端标题放大 */
@media (min-width: 768px) {
  h1 {
    font-size: 48px;
  }
  h2 {
    font-size: 32px;
  }
}

/* 正文长读：宋体，18px，行高 1.85，最大 68 字符宽 */
.zx-prose {
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1.85;
  max-width: 68ch;
}

/* 元信息：黑体小字，次要色，微字距 */
.zx-meta {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--neutral-500);
  letter-spacing: 0.02em;
}

/* 数据 / 指纹 / 权威分：等宽 */
.zx-mono {
  font-family: var(--font-mono);
}

/* 首字下沉：4em 朱砂左浮 */
.zx-dropcap::first-letter {
  font-size: 4em;
  color: var(--cinnabar-500);
  float: left;
}

/* ===== motion.css ===== */
/* motion.css — 「知行」动效系统：墨滴扩散 / 节点呼吸 / 交错显现 / 争论涟漪，附 reduced-motion 降级 */

/* 1. 墨滴入水扩散：多层径向渐变（朱砂 + 黛青 + 透明）由 0 缩放至满幅并淡出 */
@keyframes ink-spread {
  0% {
    background-size: 0% 0%, 0% 0%, 0% 0%;
    opacity: 1;
  }
  100% {
    background-size: 100% 100%, 100% 100%, 100% 100%;
    opacity: 0;
  }
}

/* 墨滴载体：朱砂 + 黛青 + 透明 三层径向渐变 */
.zx-ink-spread {
  background-image:
    radial-gradient(circle, rgba(193, 39, 45, 0.55) 0%, rgba(193, 39, 45, 0) 70%),
    radial-gradient(circle, rgba(29, 91, 122, 0.45) 0%, rgba(29, 91, 122, 0) 70%),
    radial-gradient(circle, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0) 100%);
  background-repeat: no-repeat;
  background-position: center;
  animation: ink-spread var(--dur-slow) var(--ease-zx) forwards;
}

/* 2. 节点呼吸：透明度 0.85 → 1 → 0.85，scale 1 → 1.04 → 1，周期 3.2s */
@keyframes node-breathe {
  0%, 100% {
    opacity: 0.85;
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.04);
  }
}

.zx-node-breathe {
  animation: node-breathe 3.2s var(--ease-zx) infinite;
}

/* 3. 交错显现：依序入场，步进由 --i 控制 */
.zx-reveal {
  opacity: 0;
  transform: translateY(8px);
  animation: zx-reveal-in var(--dur-base) var(--ease-zx) forwards;
  animation-delay: calc(var(--i, 0) * 80ms);
}

@keyframes zx-reveal-in {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* 4. 争论涟漪：多层径向渐变旋转 + 模糊扩散，用于论点展开 */
@keyframes ink-ripple {
  0% {
    transform: rotate(0deg) scale(0.8);
    filter: blur(0px);
    opacity: 0.9;
  }
  50% {
    filter: blur(2px);
    opacity: 1;
  }
  100% {
    transform: rotate(180deg) scale(1.4);
    filter: blur(6px);
    opacity: 0;
  }
}

.zx-ink-ripple {
  background-image:
    radial-gradient(circle, rgba(193, 39, 45, 0.40) 0%, rgba(193, 39, 45, 0) 60%),
    radial-gradient(circle, rgba(29, 91, 122, 0.35) 0%, rgba(29, 91, 122, 0) 60%);
  background-repeat: no-repeat;
  background-position: center;
  animation: ink-ripple var(--dur-slow) var(--ease-zx) forwards;
}

/* 5. 全局降级：尊重 prefers-reduced-motion，所有动画近乎瞬时并显式关闭墨效 */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01s !important;
  }

  .zx-ink-spread,
  .zx-node-breathe,
  .zx-ink-ripple,
  .zx-reveal {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}

/* ===== components.css ===== */
/* components.css — 「知行」共享组件库：权威徽章 / 内容指纹 / 笔记卡 / 标签 / 图标按钮 / 容器；首部聚合引入三大基础样式 */



/* WCAG AA：gold-500 在浅色 paper 上对比度仅 ~2.2:1，小号文本须使用更深的 gold-700 */
:root {
  --gold-700: #7E6A2A; /* ≈ 5.1:1 on paper-50 */
}

/* ===== 权威分徽章：鎏金描边 + 星标 ===== */
.zx-authority-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 2px 8px;
  border-radius: var(--r-full);
  border: 1px solid var(--gold-500);
  background: rgba(199, 162, 74, 0.08);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--gold-700);
}
@media (prefers-color-scheme: dark) {
  .zx-authority-badge { color: var(--gold-500); }
}

/* 王冠 / 星形 icon 占位 */
.zx-authority-badge::before {
  content: "★";
  font-size: 11px;
}

/* ===== 内容指纹标签：基础 chip ===== */
.zx-fingerprint {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--r-1);
  font-family: var(--font-mono);
  font-size: 11px;
}

/* 人写：朱砂系 */
.zx-fingerprint--human {
  background: rgba(193, 39, 45, 0.08);
  color: var(--cinnabar-500);
}

/* 人机共创：黛青系 */
.zx-fingerprint--cocreate {
  background: rgba(29, 91, 122, 0.08);
  color: var(--indigo-500);
}

/* AI + PDF：鎏金系（浅色模式用 gold-700 以达 WCAG AA） */
.zx-fingerprint--ai-pdf {
  background: rgba(199, 162, 74, 0.14);
  color: var(--gold-700);
}
@media (prefers-color-scheme: dark) {
  .zx-fingerprint--ai-pdf { background: rgba(199, 162, 74, 0.10); color: var(--gold-500); }
}

/* AI 纯生成：中性系 */
.zx-fingerprint--ai {
  background: rgba(107, 101, 92, 0.14);
  color: var(--neutral-500);
}

/* ===== 笔记卡片：左侧 4px 色带 + 标题 / 元信息 / 摘要 ===== */
.zx-note-card {
  padding: var(--sp-5);
  background: var(--card-bg);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-paper);
  border-left: 4px solid transparent;
}

/* 知识卡：黛青色带 */
.zx-note-card--knowledge {
  border-left-color: var(--indigo-500);
}

/* 创作卡：朱砂色带 */
.zx-note-card--creation {
  border-left-color: var(--cinnabar-500);
}

/* 复盘卡：鎏金色带 */
.zx-note-card--review {
  border-left-color: var(--gold-500);
}

/* 讨论卡：赞成派黛青色带 */
.zx-note-card--discussion {
  border-left-color: var(--pro);
}

/* 标题区：宋体 18px / 600 */
.zx-note-card__title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
}

/* 元信息区 */
.zx-note-card__meta {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--neutral-500);
  letter-spacing: 0.02em;
}

/* 摘要正文：宋体 16px，行高 1.7，最多 4 行省略 */
.zx-note-card__excerpt {
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ===== 实体 / 标签 chip ===== */
.zx-chip {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  background: var(--paper-100);
  border-radius: var(--r-full);
  font-size: 12px;
}

/* hover 时朱砂下划线 */
.zx-chip:hover {
  text-decoration: underline;
  text-decoration-color: var(--cinnabar-500);
}

/* ===== 图标按钮：44×44 触控热区 ===== */
.zx-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  cursor: pointer;
}

.zx-icon-btn:hover {
  background: rgba(0, 0, 0, 0.05);
}

/* focus-visible 显示朱砂 2px 聚焦环 */
.zx-icon-btn:focus-visible {
  outline: 2px solid var(--cinnabar-500);
  outline-offset: 2px;
}

/* ===== 通用容器：1200px 居中 ===== */
.zx-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: var(--sp-4);
}

/* ===== shell.css ===== */
/* =========================================================================
 * 「知行」App 本体 Demo —— Phase 0 / App 外壳样式（shell.css）
 * -------------------------------------------------------------------------
 * 依赖：../demo/shared/components.css（已聚合 design-tokens / typography / motion）
 * 覆盖：手机外框 · 顶部状态栏 · 底部 5-tab 导航 · 5 个占位页
 * 设计语言：墨韵 · 星图（朱砂 / 黛青 / 鎏金 / 赤陶）
 * =======================================================================*/

*,
*::before,
*::after {
  box-sizing: border-box;
}

/* ===== 基底：桌面端深空背景 + 居中手机 ===== */
html,
body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: radial-gradient(ellipse at center, #1A1814 0%, #0E0D0B 70%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 32px 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* 桌面端顶部小贴士 */
.zx-hint {
  margin: 0;
  font-family: var(--font-body);
  font-size: 13px;
  color: rgba(241, 234, 219, 0.42);
  text-align: center;
  letter-spacing: 0.02em;
}

/* ===== 移动端真机：去深空背景、铺满、隐贴士 ===== */
@media (max-width: 600px) {
  body {
    background: var(--paper-50);
    padding: 0;
    gap: 0;
    justify-content: flex-start;
  }
  .zx-hint {
    display: none;
  }
}

/* ===== 手机外框：iPhone 14 Pro 比例 ===== */
.zx-phone {
  position: relative;
  width: 390px;
  height: 844px;
  border-radius: 48px;
  border: 8px solid var(--ink-900);
  background: var(--paper-50);
  box-shadow: 0 32px 64px rgba(0, 0, 0, 0.30), 0 16px 32px rgba(0, 0, 0, 0.20);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

@media (max-width: 600px) {
  .zx-phone {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }
}

/* ===== 顶部状态栏（极简纯产品框，绝对定位顶部） ===== */
.zx-statusbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 26px;
  z-index: 30;
  pointer-events: none;
}

.zx-statusbar__time {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-900);
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}

.zx-statusbar__icons {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-900);
}

.zx-statusbar__icons svg {
  width: 16px;
  height: 16px;
  display: block;
}

/* ===== 屏幕区：撑满状态栏与 tab 之间的可用区域 ===== */
.zx-screen {
  position: relative;
  flex: 1;
  overflow: hidden;
}

/* ===== 占位页：绝对堆叠 + display 切换 ===== */
.zx-page {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding-top: 44px;
  background: var(--paper-50);
}

.zx-page.is-active {
  display: flex;
  animation: zx-page-in 120ms var(--ease-zx);
}

@keyframes zx-page-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* 各页背景视觉差异 */
.zx-page[data-page="square"] {
  background: linear-gradient(180deg, rgba(29, 91, 122, 0.12) 0%, var(--paper-50) 58%);
}
.zx-page[data-page="notebook"] {
  background: var(--paper-50);
}
.zx-page[data-page="publish"] {
  background: var(--paper-50);
}
.zx-page[data-page="friends"] {
  background: var(--paper-50);
}
.zx-page[data-page="profile"] {
  background: linear-gradient(180deg, rgba(199, 162, 74, 0.16) 0%, var(--paper-50) 58%);
}

/* ===== 页面标题栏（44px 高） ===== */
.zx-page__head {
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px 0 20px;
}

.zx-page__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--ink-900);
  letter-spacing: 0.02em;
}

/* 右上角小按键：复用 .zx-icon-btn（44×44 + focus 环），统一墨色描边 */
.zx-page__action {
  color: var(--ink-700);
}

.zx-page__action svg {
  width: 22px;
  height: 22px;
  display: block;
}

/* 笔记本 AI 按键：鎏金描边，呼应「AI 充斥化」哲学 */
.zx-page__action--ai {
  color: var(--gold-700);
}

@media (prefers-color-scheme: dark) {
  .zx-page__action--ai { color: var(--gold-500); }
}

/* ===== 页面正文：居中占位 ===== */
.zx-page__body {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 0 32px 64px;
  text-align: center;
}

.zx-placeholder {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
}

.zx-placeholder__name {
  margin: 0;
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  color: var(--ink-900);
  letter-spacing: 0.04em;
}

.zx-placeholder__sub {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--neutral-500);
  letter-spacing: 0.18em;
}

/* ===== 底部 5-tab 导航 ===== */
.zx-tabbar {
  position: relative;
  height: 84px;
  flex-shrink: 0;
  background: var(--paper-50);
  border-top: 0.5px solid var(--paper-100);
  display: flex;
  z-index: 20;
}

.zx-tab {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding-top: 12px;
  min-height: 60px;
  background: transparent;
  border: none;
  color: var(--neutral-500);
  cursor: pointer;
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}

.zx-tab__icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
}

.zx-tab__icon svg {
  width: 24px;
  height: 24px;
  display: block;
}

.zx-tab__label {
  font-size: 11px;
  line-height: 1;
  letter-spacing: 0.04em;
}

/* 选中态：朱砂 + 顶部 4×24 短条 */
.zx-tab.is-active {
  color: var(--cinnabar-500);
}

.zx-tab.is-active::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 4px;
  border-radius: 0 0 4px 4px;
  background: var(--cinnabar-500);
}

.zx-tab:focus-visible {
  outline: 2px solid var(--cinnabar-500);
  outline-offset: -6px;
  border-radius: 10px;
}

.zx-icon-btn:focus-visible,
.zx-tabbar__fab:focus-visible {
  outline: 2px solid var(--cinnabar-500);
  outline-offset: 2px;
}

/* ===== 中间凸起发布键（FAB） ===== */
.zx-tab--publish {
  justify-content: flex-end;
  padding-top: 0;
}

.zx-tab__fab {
  position: absolute;
  top: -12px;
  left: 50%;
  transform: translateX(-50%);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--cinnabar-500);
  color: var(--gold-500);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 18px rgba(193, 39, 45, 0.40);
  transition: box-shadow var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
}

.zx-tab__fab svg {
  display: block;
}

/* 发布键常驻朱砂；选中时收起顶部短条，改为外发光环 */
.zx-tab--publish.is-active::before {
  display: none;
}

.zx-tab--publish.is-active .zx-tab__fab {
  box-shadow: 0 6px 18px rgba(193, 39, 45, 0.40), 0 0 0 4px rgba(193, 39, 45, 0.16);
  transform: translateX(-50%) scale(1.04);
}

.zx-tab--publish .zx-tab__label {
  position: absolute;
  bottom: 20px;
  left: 0;
  right: 0;
  text-align: center;
}

/* ===== Home Indicator ===== */
.zx-home-indicator {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 134px;
  height: 4px;
  border-radius: 2px;
  background: var(--ink-900);
  z-index: 25;
  pointer-events: none;
}

/* ===== reduced-motion：页面切换瞬时（motion.css 已全局降级，此处显式收尾） ===== */
@media (prefers-reduced-motion: reduce) {
  .zx-page.is-active,
  .zx-tab__fab {
    animation: none !important;
    transition: none !important;
    transform: translateX(-50%) !important;
  }
  .zx-tab--publish.is-active .zx-tab__fab {
    transform: translateX(-50%) !important;
  }
}

/* ===== notebook.css ===== */
/* =========================================================================
 * 「知行」App 本体 Demo —— Phase 1.A / 笔记本（主动工作台 + Agent 控制台）
 * -------------------------------------------------------------------------
 * 依赖：../demo/shared/components.css（tokens / typography / motion）+ ./shell.css
 * 视图栈：workbench（默认）⇄ agent（左入）→ detail（右入）；workbench → chat（下入）
 * 设计语言：墨韵 · 星图（朱砂 / 黛青 / 鎏金 / 赤陶），AI 充斥化而非隐形化
 * =======================================================================*/

.nb-root {
  position: relative;
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--paper-50);
}

.nb-stack {
  position: relative;
  flex: 1;
  overflow: hidden;
}

.nb-view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--paper-50);
  opacity: 0;
  pointer-events: none;
  transition: transform var(--dur-base) var(--ease-zx),
              opacity var(--dur-fast) var(--ease-zx);
  will-change: transform, opacity;
}

.nb-view[data-axis="left"]   { transform: translateX(-100%); }
.nb-view[data-axis="right"]  { transform: translateX(100%); }
.nb-view[data-axis="bottom"] { transform: translateY(100%); }
.nb-view[data-axis="none"]   { transform: translateX(0); }

.nb-view.is-on {
  opacity: 1 !important;
  pointer-events: auto;
  transform: translate(0, 0) !important;
  z-index: 2;
}

.nb-view.is-covered[data-exit="right"] { transform: translateX(30%); opacity: 0; }
.nb-view.is-covered[data-exit="left"]  { transform: translateX(-30%); opacity: 0; }
.nb-view.is-covered[data-exit="up"]    { transform: translateY(-12%); opacity: 0; }
.nb-view.is-covered[data-exit="none"]  { opacity: 0; }

.nb-scroll {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-top: 44px;
}

.nb-iconbtn {
  width: 44px;
  height: 44px;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--ink-700);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx);
}
.nb-iconbtn:hover { background: rgba(14, 13, 11, 0.06); }
.nb-iconbtn svg { width: 22px; height: 22px; display: block; }
.nb-iconbtn:focus-visible { outline: 2px solid var(--cinnabar-500); outline-offset: 2px; }

.nb-iconbtn--ai {
  color: var(--gold-700);
  border: 1px solid var(--gold-500);
  background: rgba(199, 162, 74, 0.08);
  width: 36px;
  height: 36px;
  min-width: 36px;
}
.nb-iconbtn--ai svg { width: 18px; height: 18px; }
.nb-iconbtn--ai:hover { background: rgba(199, 162, 74, 0.16); }

.nb-btn {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  line-height: 1;
  border-radius: var(--r-full);
  padding: 0 16px;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-900);
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx),
              transform var(--dur-fast) var(--ease-zx);
}
.nb-btn:active { transform: scale(0.97); }
.nb-btn--primary { background: var(--cinnabar-500); color: #FFF6EC; }
.nb-btn--primary:hover { background: #A8232A; }
.nb-btn--outline { border-color: var(--cinnabar-500); color: var(--cinnabar-500); background: transparent; }
.nb-btn--ghost { background: var(--paper-100); color: var(--neutral-500); }
.nb-btn--sm { min-height: 30px; padding: 0 12px; font-size: 12px; }
.nb-btn--block { width: 100%; }

.nb-chip-mono {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

/* =========================== 主动工作台 =========================== */

.nb-topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px;
  z-index: 20;
  background: transparent;
  border-bottom: 1px solid transparent;
  transition: background var(--dur-fast) var(--ease-zx),
              border-color var(--dur-fast) var(--ease-zx),
              color var(--dur-fast) var(--ease-zx);
}
.nb-topbar.is-solid {
  background: rgba(250, 246, 238, 0.92);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom-color: var(--paper-100);
}
.nb-topbar__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;

}
.nb-topbar__right { display: flex; align-items: center; gap: 4px; }

.nb-widgets {
  padding: 16px 16px 140px;
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  align-items: start;
}

.nb-widget {
  position: relative;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);

  padding: 14px 14px 14px 17px;
  box-shadow: var(--shadow-paper);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: opacity var(--dur-base) var(--ease-zx),
              transform var(--dur-base) var(--ease-zx),
              box-shadow var(--dur-fast) var(--ease-zx),
              border-color var(--dur-fast) var(--ease-zx);
}
.nb-widget.is-fading { opacity: 0; transform: scale(0.97); }
.nb-widget::before {
  content: "";
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 4px;
  border-radius: 0 4px 4px 0;

}
.nb-widget--ai-suggestion::before { background: var(--gold-500); }
.nb-widget--todo::before { background: var(--cinnabar-500); }
.nb-widget--hotspot::before { background: var(--con); }
.nb-widget--recall::before { background: var(--indigo-500); }
.nb-widget--free::before { background: var(--neutral-500); }

.nb-widget__head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-shrink: 0;
}
.nb-widget__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.nb-widget__body::-webkit-scrollbar { width: 4px; }
.nb-widget__body::-webkit-scrollbar-thumb { background: var(--paper-100); border-radius: 2px; }
.nb-widget__icon {
  display: inline-flex;
  width: 20px;
  height: 20px;
  align-items: center;
  justify-content: center;
  color: var(--ink-700);
  flex-shrink: 0;
}
.nb-widget__icon svg { width: 18px; height: 18px; display: block; }
.nb-widget--ai-suggestion .nb-widget__icon { color: var(--gold-700); }
.nb-widget--todo .nb-widget__icon { color: var(--cinnabar-500); }
.nb-widget--hotspot .nb-widget__icon { color: var(--con); }
.nb-widget--recall .nb-widget__icon { color: var(--indigo-500); }
.nb-widget__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-900);

  min-width: 0;

}
.nb-widget__chip {
  flex-shrink: 0;
  background: rgba(107, 101, 92, 0.12);

}
.nb-widget--ai-suggestion .nb-widget__chip { background: rgba(199, 162, 74, 0.16); color: var(--gold-700); }
.nb-widget--todo .nb-widget__chip { background: rgba(193, 39, 45, 0.10); color: var(--cinnabar-500); }
.nb-widget--hotspot .nb-widget__chip { background: rgba(180, 96, 44, 0.12); color: var(--con); }
.nb-widget--recall .nb-widget__chip { background: rgba(29, 91, 122, 0.10); color: var(--indigo-500); }
.nb-widget__more {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: inline-flex;

  justify-content: center;

.nb-sug__desc {

.nb-todo__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.nb-col--doing .nb-col__title { color: var(--cinnabar-500); }

.nb-col--doing .nb-col__bar { background: var(--cinnabar-500); }
.nb-col--done .nb-col__bar { background: var(--gold-500); }
.nb-col__cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  padding-bottom: 8px;
}

.nb-task {

}
.nb-task__chip {

}
.nb-task__chip svg { width: 12px; height: 12px; display: block; }
.nb-task__top-meta { display: inline-flex; align-items: center; gap: 7px; }
.nb-task__prio {
  width: 8px;
  height: 8px;
  border-radius: var(--r-full);
  background: var(--neutral-500);
  flex-shrink: 0;
}
.nb-task__prio--high { background: var(--cinnabar-500); }
.nb-task__prio--mid { background: var(--gold-500); }
.nb-task__prio--low { background: var(--indigo-500); }
.nb-task__chip--整理 { background: rgba(29, 91, 122, 0.12); color: var(--indigo-500); }
.nb-task__chip--总结 { background: rgba(199, 162, 74, 0.16); color: var(--gold-700); }
.nb-task__chip--分析 { background: rgba(193, 39, 45, 0.10); color: var(--cinnabar-500); }
.nb-task__chip--陪读 { background: rgba(180, 96, 44, 0.12); color: var(--con); }
.nb-task__chip--定时 { background: rgba(107, 101, 92, 0.14); color: var(--neutral-500); }
.nb-task__count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}
.nb-task__name {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-900);
  line-height: 1.4;
}
.nb-task__progress { margin-bottom: 10px; }
.nb-task__barwrap {
  height: 6px;
  background: var(--paper-100);
  border-radius: 3px;
  overflow: hidden;
}
.nb-task__barfill {
  height: 100%;
  background: linear-gradient(90deg, var(--cinnabar-300), var(--cinnabar-500));
  border-radius: 3px;
  transition: width var(--dur-slow) var(--ease-zx);
}
.nb-task__step {
  margin: 8px 0 0;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--ink-700);
}
.nb-task__eta {
  margin: 2px 0 0;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}
.nb-task__meta {
  margin: 0 0 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  line-height: 1.6;
}
.nb-task__product {
  margin: 0 0 10px;
  padding: 8px 10px;
  background: rgba(199, 162, 74, 0.10);
  border-left: 3px solid var(--gold-500);
  border-radius: 6px;
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--gold-700);
}
.nb-task__actions { display: flex; gap: 8px; }
.nb-task__actions .nb-btn { flex: 1; }

/* =========================== 任务详情（占位） =========================== */

.nb-detail__top {
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 6px 0 4px;
  background: var(--paper-50);
  border-bottom: 1px solid var(--paper-100);
}
.nb-detail__title {
  margin: 0;
  flex: 1;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-900);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nb-detail__body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 16px;
}
.nb-detail__section { margin-bottom: 22px; }
.nb-detail__h {
  margin: 0 0 10px;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  color: var(--neutral-500);
  letter-spacing: 0.08em;
}
.nb-detail__param {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid var(--paper-100);
  font-family: var(--font-body);
  font-size: 14px;
}
.nb-detail__param span:first-child { color: var(--neutral-500); }
.nb-detail__param span:last-child { color: var(--ink-900); font-weight: 500; }
.nb-detail__timeline { position: relative; padding-left: 18px; }
.nb-detail__timeline::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: var(--paper-100);
}
.nb-detail__tl-item { position: relative; padding-bottom: 14px; }
.nb-detail__tl-item::before {
  content: "";
  position: absolute;
  left: -18px;
  top: 4px;
  width: 10px;
  height: 10px;
  border-radius: var(--r-full);
  background: var(--paper-50);
  border: 2px solid var(--neutral-500);
}
.nb-detail__tl-item--done::before { background: var(--cinnabar-500); border-color: var(--cinnabar-500); }
.nb-detail__tl-item--curr::before { border-color: var(--gold-500); box-shadow: 0 0 0 4px rgba(199, 162, 74, 0.2); }
.nb-detail__tl-t {
  margin: 0 0 2px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
}
.nb-detail__tl-time {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}
.nb-detail__log {
  padding: 8px 10px;
  background: var(--paper-100);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.7;
  color: var(--ink-700);
}
.nb-detail__log-line { display: flex; gap: 8px; }
.nb-detail__log-time { color: var(--neutral-500); flex-shrink: 0; }
.nb-detail__actions {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--paper-100);
  background: var(--paper-50);
}
.nb-detail__chat-btn {
  width: 100%;
  min-height: 44px;
  font-size: 15px;
  font-weight: 600;
  gap: 8px;
}
.nb-detail__chat-btn svg { width: 18px; height: 18px; }
.nb-detail__row { display: flex; gap: 8px; }
.nb-detail__row .nb-btn { flex: 1; }

/* =========================== 对话子页 =========================== */

/* 修复 2：对话页让出底部 tab bar 中央 "+" 凸起区（凸出 12px + 8px 缓冲） */
.nb-view--chat { padding-bottom: 24px; background: var(--paper-50); }

.nb-chat__top {
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 6px 0 4px;
  background: var(--paper-50);
  border-bottom: 1px solid var(--paper-100);
}
.nb-chat__head { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.nb-chat__avatar {
  width: 30px;
  height: 30px;
  border-radius: var(--r-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(199, 162, 74, 0.16);
  border: 1px solid var(--gold-500);
  color: var(--gold-700);
  flex-shrink: 0;
}
.nb-chat__avatar svg { width: 16px; height: 16px; display: block; }
.nb-chat__name {
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-900);
}
.nb-chat__status {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-700);
}
.nb-chat__msgs {
  flex: 1;
  overflow-y: auto;
  padding: 16px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: linear-gradient(180deg, rgba(199, 162, 74, 0.04), transparent 30%);
}
.nb-msg { display: flex; gap: 8px; max-width: 86%; }
.nb-msg--ai { align-self: flex-start; }
.nb-msg--user { align-self: flex-end; flex-direction: row-reverse; }
.nb-msg__ava {
  width: 28px;
  height: 28px;
  border-radius: var(--r-full);
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.nb-msg--ai .nb-msg__ava { background: var(--cinnabar-500); color: #FFF6EC; font-family: var(--font-display); font-size: 13px; font-weight: 600; }
.nb-msg--user .nb-msg__ava { background: var(--indigo-500); color: #FFF6EC; font-family: var(--font-display); font-size: 13px; font-weight: 600; }
.nb-msg__bubble {
  padding: 10px 13px;
  border-radius: 14px;
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-900);
}
.nb-msg--ai .nb-msg__bubble {
  background: var(--paper-100);
  border-top-left-radius: 4px;
}
.nb-msg--user .nb-msg__bubble {
  background: var(--paper-50);
  border: 1px solid var(--cinnabar-500);
  color: var(--ink-900);
  border-top-right-radius: 4px;
}
.nb-msg__time {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--neutral-500);
  margin-top: 4px;
}
.nb-chip-inline {
  display: inline-flex;
  align-items: center;
  padding: 1px 7px;
  margin: 0 1px;
  border-radius: var(--r-full);
  background: rgba(29, 91, 122, 0.10);
  color: var(--indigo-500);
  font-family: var(--font-display);
  font-size: 13px;
  border: 1px solid rgba(29, 91, 122, 0.2);
}
.nb-msg__attach {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  padding: 6px 9px;
  background: rgba(199, 162, 74, 0.10);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--gold-700);
}
.nb-msg__attach svg { width: 16px; height: 16px; flex-shrink: 0; }

/* AI 正在思考：三个朱砂小圆点错相跳动 */
.nb-typing { display: inline-flex; align-items: center; gap: 8px; }
.nb-typing__dots { display: inline-flex; align-items: center; gap: 4px; }
.nb-typing__dot {
  width: 7px;
  height: 7px;
  border-radius: var(--r-full);
  background: var(--cinnabar-500);
  animation: nb-typing 1s var(--ease-zx) infinite;
}
.nb-typing__dot:nth-child(2) { animation-delay: 0.15s; }
.nb-typing__dot:nth-child(3) { animation-delay: 0.3s; }
.nb-typing__label { font-family: var(--font-body); font-size: 12px; color: var(--neutral-500); }
@keyframes nb-typing {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
  40% { transform: translateY(-4px); opacity: 1; }
}

.nb-chat__tools {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 8px 14px 0;
  overflow-x: auto;
}
.nb-chat__tool {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: var(--r-full);
  background: var(--paper-100);
  border: none;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--ink-700);
  cursor: pointer;
}
.nb-chat__attach-tray {
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  padding: 8px 14px 0;
  flex-wrap: wrap;
}
.nb-chat__att-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px 4px 10px;
  border-radius: var(--r-full);
  background: rgba(199, 162, 74, 0.12);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-700);
}
.nb-chat__att-chip button {
  background: none;
  border: none;
  color: inherit;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0 0 0 2px;
}
.nb-chat__input-row {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--paper-50);
  border-top: 1px solid var(--paper-100);
  position: relative;
}
.nb-chat__attach-btn {
  width: 40px;
  height: 40px;
  min-width: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--paper-100);
  border: none;
  border-radius: var(--r-full);
  color: var(--ink-700);
  cursor: pointer;
}
.nb-chat__attach-btn svg { width: 20px; height: 20px; display: block; }
.nb-chat__input-wrap { flex: 1; position: relative; }
.nb-chat__input {
  width: 100%;
  min-height: 40px;
  max-height: 96px;
  resize: none;
  padding: 10px 14px;
  background: var(--paper-100);
  border: none;
  border-radius: 20px;
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-900);
  outline: none;
}
.nb-chat__send {
  width: 40px;
  height: 40px;
  min-width: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--cinnabar-500);
  border: none;
  border-radius: var(--r-full);
  color: #FFF6EC;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(193, 39, 45, 0.28);
}
.nb-chat__send svg { width: 20px; height: 20px; display: block; }
.nb-chat__send:disabled { background: var(--paper-100); color: var(--neutral-500); box-shadow: none; cursor: default; }

.nb-mention {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(100% + 6px);
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  max-height: 220px;
  overflow-y: auto;
  z-index: 5;
  display: none;
}
.nb-mention.is-open { display: block; }
.nb-mention__item {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 10px 14px;
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--ink-900);
  cursor: pointer;
  border-bottom: 1px solid var(--paper-100);
}
.nb-mention__item:last-child { border-bottom: none; }
.nb-mention__item:hover, .nb-mention__item.is-active { background: var(--paper-100); }
.nb-mention__item small { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--neutral-500); margin-top: 2px; }

/* =========================== 底部模态（Sheet） =========================== */

.nb-sheet {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: none;
}
.nb-sheet.is-open { display: block; }
.nb-sheet__overlay {
  position: absolute;
  inset: 0;
  background: rgba(14, 13, 11, 0.42);
  animation: nb-fade-in var(--dur-fast) var(--ease-zx);
}
.nb-sheet__panel {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-height: 90%;
  display: flex;
  flex-direction: column;
  background: var(--paper-50);
  border-radius: 20px 20px 0 0;
  box-shadow: var(--shadow-float);
  animation: nb-sheet-up var(--dur-base) var(--ease-zx);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes nb-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes nb-sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.nb-sheet__handle {
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--paper-100);
  margin: 10px auto 4px;
}
.nb-sheet__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 18px 12px;
}
.nb-sheet__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--ink-900);
}
.nb-sheet__body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 18px 16px;
  min-height: 120px;
}

.nb-sheet__foot {
  flex-shrink: 0;
  display: flex;
  gap: 10px;
  padding: 12px 18px 16px;
  border-top: 1px solid var(--paper-100);
}
.nb-sheet__foot .nb-btn { flex: 1; min-height: 42px; font-size: 15px; }

.nb-widget-pick-list { display: flex; flex-direction: column; gap: 10px; }
.nb-widget-pick {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--paper-50);
  border: 1.5px solid var(--paper-100);
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
}
.nb-widget-pick:hover { border-color: var(--cinnabar-300); }
.nb-widget-pick__ico {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.nb-widget-pick__ico svg { width: 20px; height: 20px; display: block; }
.nb-widget-pick--ai-suggestion .nb-widget-pick__ico { background: rgba(199, 162, 74, 0.16); color: var(--gold-700); }
.nb-widget-pick--todo .nb-widget-pick__ico { background: rgba(193, 39, 45, 0.10); color: var(--cinnabar-500); }
.nb-widget-pick--hotspot .nb-widget-pick__ico { background: rgba(180, 96, 44, 0.12); color: var(--con); }
.nb-widget-pick--recall .nb-widget-pick__ico { background: rgba(29, 91, 122, 0.10); color: var(--indigo-500); }
.nb-widget-pick--free .nb-widget-pick__ico { background: rgba(107, 101, 92, 0.14); color: var(--neutral-500); }
.nb-widget-pick__name { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--ink-900); }
.nb-widget-pick__desc { font-family: var(--font-body); font-size: 12px; color: var(--neutral-500); margin-top: 2px; }

/* =========================== Toast =========================== */

.nb-toast {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translate(-50%, 16px);
  background: var(--ink-900);
  color: var(--paper-50);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 10px 18px;
  border-radius: var(--r-full);
  box-shadow: var(--shadow-float);
  z-index: 80;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nb-toast.is-show { opacity: 1; transform: translate(-50%, 0); }
.nb-toast__spark { color: var(--gold-500); display: inline-flex; }
.nb-toast__spark svg { width: 14px; height: 14px; display: block; }

/* =========================== 对话页 · 任务上下文 chip 条 =========================== */

.nb-chat__taskchip {
  flex-shrink: 0;
  background: var(--paper-100);
  padding: 8px 10px 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--paper-100);
  overflow: hidden;
  max-height: 80px;
  transition: max-height var(--dur-base) var(--ease-zx),
              padding var(--dur-base) var(--ease-zx);
}
.nb-chat__taskchip[hidden] { display: none; }
.nb-chat__taskchip.is-collapsed { max-height: 36px; padding: 6px 10px 6px 12px; }
.nb-chat__taskchip.is-collapsed .nb-taskchip__meta { display: none; }
.nb-chat__taskchip.is-collapsed .nb-taskchip__icon {
  width: 20px; height: 20px; background: transparent;
}
.nb-chat__taskchip.is-collapsed .nb-taskchip__icon svg { width: 14px; height: 14px; }

.nb-taskchip { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.nb-taskchip__main {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  background: transparent;
  border: none;
  padding: 0;
  cursor: pointer;
  text-align: left;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}
.nb-taskchip__icon {
  width: 32px;
  height: 32px;
  border-radius: var(--r-full);
  background: rgba(199, 162, 74, 0.20);
  color: var(--gold-700);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.nb-taskchip__icon svg { width: 16px; height: 16px; display: block; }
.nb-taskchip__info { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 2px; }
.nb-taskchip__name {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.nb-taskchip__meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  letter-spacing: 0.02em;
}
.nb-taskchip__close {
  width: 44px;

  background: rgba(199, 162, 74, 0.18);
  padding: 1px 7px;
  border-radius: var(--r-full);
  margin-left: 6px;
  font-weight: 400;
  vertical-align: middle;
}
.nb-agent-main__desc {
  margin-top: 3px;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--neutral-500);
  line-height: 1.4;
}
.nb-agent-main__activity {
  margin-top: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}
.nb-agent-main__online {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: rgba(56, 161, 105, 0.12);
  color: #2F855A;
  border-radius: var(--r-full);
  font-family: var(--font-mono);
  font-size: 11px;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}
.nb-dot {
  width: 7px; height: 7px;
  border-radius: var(--r-full);
  background: #38A169;
  box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.2);
}

.nb-agent-subs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.nb-agent-sub {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px;
  background: var(--paper-100);
  border: 1px solid transparent;
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
  min-height: 44px;
  transition: border-color var(--dur-fast) var(--ease-zx),
              background var(--dur-fast) var(--ease-zx);
  -webkit-tap-highlight-color: transparent;
}
.nb-agent-sub:hover { border-color: var(--gold-500); background: rgba(199, 162, 74, 0.08); }
.nb-agent-sub:active { transform: scale(0.98); }
.nb-agent-sub__head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.nb-agent-sub__icon { font-size: 20px; line-height: 1; }
.nb-agent-sub__name {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
}
.nb-agent-sub__count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}

/* Kanban 任务卡 · 执行智能体小标签（Task 1.A.11） */
.nb-task__top-left { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.nb-task__agent {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--neutral-500);
  background: var(--paper-100);
  padding: 2px 7px;
  border-radius: var(--r-full);
  white-space: nowrap;
}

/* =========================== 工作台 · 双列网格 + 长按拖拽手柄（Task 1.A.12） =========================== */

/* 大组件 / 添加组件按钮跨两列 */
.nb-widget--ai-carousel,
.nb-add-widget {
  grid-column: 1 / -1;
}

/* 拖拽手柄：默认隐藏，进入编辑态显示 */
.nb-widget__handle {
  position: absolute;
  right: 6px;
  bottom: 6px;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--neutral-500);
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: var(--r-full);
  opacity: 0;
  cursor: ns-resize;
  z-index: 6;
  transition: opacity var(--dur-fast) var(--ease-zx);
  touch-action: none;
}
.nb-widget__handle svg { width: 16px; height: 16px; display: block; }

/* 高度角标：拖拽时显示当前像素值 */
.nb-widget__height-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 6;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--gold-700);
  background: rgba(199, 162, 74, 0.16);
  padding: 2px 7px;
  border-radius: var(--r-full);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-zx);
}

/* 编辑态：轻微缩放 + 阴影加深 + 鎏金描边 */
.nb-widget.is-editing {
  border-color: var(--gold-500);
  box-shadow: 0 0 0 3px rgba(199, 162, 74, 0.18), var(--shadow-float);
  transform: scale(1.015);
}
.nb-widget.is-editing .nb-widget__handle { opacity: 1; }
.nb-widget.is-dragging {
  transform: scale(1.015);
  box-shadow: 0 0 0 3px rgba(199, 162, 74, 0.28), var(--shadow-float);
}
.nb-widget.is-dragging .nb-widget__height-badge { opacity: 1; }
.nb-widget.is-dragging .nb-widget__handle { opacity: 1; color: var(--gold-700); border-color: var(--gold-500); }

/* 底部按钮区：sticky 堆叠，写新笔记 + 让林调整工作台 */
.nb-workbench__foot {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: rgba(250, 246, 238, 0.92);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--paper-100);
  z-index: 20;
}
.nb-workbench__write {
  width: 100%;
  min-height: 46px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.04em;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(193, 39, 45, 0.20);
}
.nb-workbench__write svg { width: 18px; height: 18px; color: var(--gold-500); }
.nb-workbench__ask {
  width: 100%;
  min-height: 42px;
  font-size: 13px;
  gap: 6px;
  border: 1.5px solid var(--gold-500);
  color: var(--gold-700);
  background: rgba(199, 162, 74, 0.06);
}
.nb-workbench__ask svg { width: 15px; height: 15px; color: var(--gold-500); }
.nb-workbench__ask:hover { background: rgba(199, 162, 74, 0.12); }

/* =========================== workspace-redesign · 工作台调整计划条（Task 1.A.13） =========================== */
.nb-rdp__body {
  padding: 8px 14px 12px;
  border-top: 1px dashed rgba(199, 162, 74, 0.32);
}
.nb-rdp__section-label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.nb-rdp__log {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 28px;
}
.nb-rdp__log-line {
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--ink-900);
  line-height: 1.5;
}
.nb-rdp__log-line--empty { color: var(--neutral-500); }
.nb-rdp__apply {
  margin: 6px 14px 12px;
  min-height: 42px;
  font-size: 15px;
  font-weight: 600;
}
.nb-rdp .nb-planbar__title { cursor: default; }

/* 撤销 toast：突破 pointer-events:none，可被点击 */
.nb-toast--undo {
  pointer-events: auto;
}
.nb-toast--undo:hover { transform: translate(-50%, -1px); }
.nb-toast__undo {
  background: none;
  border: none;
  color: var(--gold-500);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  padding: 0;
  letter-spacing: 0.02em;
}
.nb-toast__undo:hover { color: var(--gold-300); }

/* =========================== reduced-motion：页面栈瞬切 =========================== */
@media (prefers-reduced-motion: reduce) {
  .nb-view,
  .nb-sheet__panel,
  .nb-sheet__overlay,
  .nb-wmenu,
  .nb-toast,
  .nb-chat__taskchip,
  .nb-chat__planbar,
  .nb-aicarousel__dot,
  .nb-tpl-card,
  .nb-template__suggest,
  .nb-widget,
  .nb-widget__handle,
  .nb-widget__height-badge,
  .nb-workbench__write,
  .nb-workbench__ask,
  .nb-agent-sub {
    transition-duration: 0.01s !important;
    animation: none !important;
  }
  .nb-widget.is-editing,
  .nb-widget.is-dragging { transform: none !important; }
}

/* ===== note-editor.css ===== */
/* =========================================================================
 * 「知行」App 本体 Demo —— Phase 1.D / 笔记模板编辑器（note-editor.css）
 * -------------------------------------------------------------------------
 * 4 种模板：纯文档 / 双联阅读 / 无限画布 / 大纲树
 * AI 三姿态协作：旁观插话（鎏金气泡）/ 肩并肩共写（鎏金差异色）/ 按需召唤（行内浮动工具栏）
 * 依赖：../demo/shared/components.css（tokens / typography / motion）+ ./notebook.css
 * 设计语言：墨韵 · 星图（朱砂 CTA / 黛青链接 / 鎏金 AI / 赤陶警示）
 * 约束：手机端单页，全屏覆盖于 notebook section 内（让出 44px 状态栏）
 * 命名空间：所有 class 以 ne- 前缀，避免与 nb-（笔记本）冲突
 * =======================================================================*/

/* =========================== 编辑器根容器 ===========================
 * 全屏覆盖 notebook section，留出顶部 44px 状态栏区域（与 .nb-root 同层）
 */
#nb-editor-root {
  position: absolute;
  left: 0;
  right: 0;
  top: 44px;
  bottom: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  background: var(--paper-50);
  animation: ne-editor-in var(--dur-base) var(--ease-zx);
}
#nb-editor-root[hidden] { display: none; }
@keyframes ne-editor-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =========================== 通用顶栏 =========================== */
.ne-topbar {
  flex-shrink: 0;
  height: 48px;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 4px 0 2px;
  background: rgba(250, 246, 238, 0.94);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--paper-100);
  z-index: 5;
}
.ne-iconbtn {
  width: 44px;
  height: 44px;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--ink-700);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx);
}
.ne-iconbtn:hover { background: rgba(14, 13, 11, 0.06); }
.ne-iconbtn svg { width: 22px; height: 22px; display: block; }
.ne-iconbtn:focus-visible { outline: 2px solid var(--cinnabar-500); outline-offset: 2px; }

.ne-topbar__title-btn {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  padding: 8px 6px;
  cursor: text;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
  border-radius: var(--r-2);
  transition: background var(--dur-fast) var(--ease-zx);
}
.ne-topbar__title-btn:hover { background: rgba(14, 13, 11, 0.04); }
.ne-topbar__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--ink-900);
  letter-spacing: 0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ne-topbar__title-input {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--ink-900);
  letter-spacing: 0.02em;
  padding: 0;
}
.ne-topbar__title-input:focus { color: var(--cinnabar-500); }

/* 顶栏 ✦ AI 按钮：鎏金描边，呼应 AI 充斥化 */
.ne-topbar__ai {
  width: 40px;
  height: 40px;
  min-width: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(199, 162, 74, 0.10);
  border: 1px solid var(--gold-500);
  border-radius: var(--r-full);
  color: var(--gold-700);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
}
.ne-topbar__ai:hover { background: rgba(199, 162, 74, 0.18); }
.ne-topbar__ai:active { transform: scale(0.94); }
.ne-topbar__ai svg { width: 19px; height: 19px; color: var(--gold-500); }
.ne-topbar__ai.is-pressing { background: rgba(199, 162, 74, 0.30); transform: scale(0.94); }

/* 顶栏右侧更多 / 缩放控件容器 */
.ne-topbar__right { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }

/* 缩放控件（canvas 模板） */
.ne-zoom {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: var(--paper-100);
  border-radius: var(--r-full);
  padding: 3px;
}
.ne-zoom__btn {
  width: 32px;
  height: 32px;
  min-height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--ink-700);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 16px;
  line-height: 1;
}
.ne-zoom__btn:hover { background: rgba(14, 13, 11, 0.06); }
.ne-zoom__pct {
  min-width: 44px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-900);
  padding: 0 4px;
}

/* =========================== 主区通用 =========================== */
.ne-main {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}

/* =========================== 通用底栏 =========================== */
.ne-foot {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  background: rgba(250, 246, 238, 0.96);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--paper-100);
  overflow-x: auto;
  scrollbar-width: none;
}
.ne-foot::-webkit-scrollbar { display: none; }
.ne-foot__hint {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0 8px 0 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  white-space: nowrap;
  flex-shrink: 0;
}
.ne-foot__hint kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--paper-100);
  border: 1px solid var(--paper-100);
  border-radius: var(--r-1);
  padding: 1px 5px;
  color: var(--ink-900);
}
.ne-foot__spacer { flex: 1; min-width: 4px; }
.ne-tool {
  flex-shrink: 0;
  min-height: 40px;
  min-width: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 0 12px;
  background: var(--paper-100);
  border: none;
  border-radius: var(--r-full);
  color: var(--ink-700);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
}
.ne-tool:hover { background: rgba(14, 13, 11, 0.10); }
.ne-tool:active { transform: scale(0.95); }
.ne-tool svg { width: 18px; height: 18px; display: block; }
.ne-tool--ai {
  background: rgba(199, 162, 74, 0.12);
  color: var(--gold-700);
  border: 1px solid var(--gold-500);
  padding: 0 14px;
}
.ne-tool--ai svg { width: 16px; height: 16px; color: var(--gold-500); }
.ne-tool--ai.is-pressing { background: rgba(199, 162, 74, 0.30); transform: scale(0.94); }

/* =====================================================================
 * 模板 1：纯文档（doc）
 * ===================================================================*/
.ne-doc {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 20px 20px 120px;
}
.ne-doc__title {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--ink-900);
  outline: none;
  min-height: 32px;
  border: none;
}
.ne-doc__title:empty::before {
  content: attr(data-placeholder);
  color: var(--neutral-500);
  opacity: 0.5;
}
.ne-doc__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 18px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--paper-100);
}
.ne-doc__meta span {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  letter-spacing: 0.02em;
}
.ne-doc__body {
  outline: none;
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink-900);
  min-height: 60vh;
}
.ne-doc__body:focus { outline: none; }
.ne-doc__body p { margin: 0 0 14px; }
.ne-doc__body h2 {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  margin: 22px 0 10px;
  color: var(--ink-900);
}
.ne-doc__body blockquote {
  margin: 0 0 14px;
  padding: 8px 14px;
  border-left: 3px solid var(--indigo-500);
  background: rgba(29, 91, 122, 0.06);
  color: var(--indigo-500);
  border-radius: 0 8px 8px 0;
  font-style: italic;
}
.ne-doc__body pre {
  margin: 0 0 14px;
  padding: 12px 14px;
  background: var(--ink-900);
  color: var(--paper-50);
  border-radius: 10px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  overflow-x: auto;
}
.ne-doc__body code {
  font-family: var(--font-mono);
  font-size: 14px;
  background: var(--paper-100);
  padding: 1px 5px;
  border-radius: var(--r-1);
  color: var(--con);
}
.ne-doc__body pre code { background: transparent; color: inherit; padding: 0; }
.ne-doc__body hr {
  border: none;
  border-top: 1px dashed var(--paper-100);
  margin: 20px 0;
}
.ne-doc__body img {
  max-width: 100%;
  border-radius: 10px;
  display: block;
  margin: 0 0 14px;
}
.ne-doc__body a, .ne-doc__body .ne-wikilink {
  color: var(--indigo-500);
  text-decoration: none;
  border-bottom: 1px dashed var(--indigo-500);
  cursor: pointer;
}

/* =====================================================================
 * 模板 2：双联阅读（reader）—— 手机端上下分（55% / 45%）
 * ===================================================================*/
.ne-reader {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.ne-reader__text {
  flex: 0 0 55%;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 18px 20px 16px;
  background: var(--paper-50);
  font-family: var(--font-display);
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink-900);
  outline: none;
}
.ne-reader__text p { margin: 0 0 14px; }
.ne-reader__text mark {
  background: rgba(29, 91, 122, 0.14);
  color: var(--indigo-500);
  border-radius: var(--r-1);
  padding: 0 2px;
  cursor: pointer;
}
/* 可拖拽分割线 */
.ne-reader__divider {
  flex-shrink: 0;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper-100);
  cursor: ns-resize;
  touch-action: none;
  position: relative;
  border-top: 1px solid var(--paper-100);
  border-bottom: 1px solid var(--paper-100);
}
.ne-reader__divider::before {
  content: "";
  width: 40px;
  height: 4px;
  border-radius: 2px;
  background: var(--neutral-500);
  opacity: 0.4;
}
.ne-reader__divider.is-dragging::before { opacity: 0.9; background: var(--indigo-500); }
.ne-reader__attach {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 16px 16px;
  background: var(--paper-100);
}
.ne-attach__label {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--indigo-500);
  letter-spacing: 0.04em;
}
.ne-attach__label svg { width: 14px; height: 14px; }
.ne-attach__page {
  margin: 0 0 12px;
  padding: 14px;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 12px;
  box-shadow: var(--shadow-paper);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-700);
  position: relative;
}
.ne-attach__page.is-active {
  border-color: var(--indigo-500);
  box-shadow: 0 0 0 3px rgba(29, 91, 122, 0.12), var(--shadow-paper);
}
.ne-attach__page--pdf {
  font-family: var(--font-display);
  color: var(--ink-900);
  line-height: 1.7;
}
.ne-attach__page-tag {
  position: absolute;
  top: 8px;
  right: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--indigo-500);
  background: rgba(29, 91, 122, 0.10);
  padding: 2px 7px;
  border-radius: var(--r-full);
}

/* =====================================================================
 * 模板 3：无限画布（canvas）
 * ===================================================================*/
.ne-canvas {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--paper-50);
  background-image:
    radial-gradient(rgba(180, 96, 44, 0.18) 1px, transparent 1px);
  background-size: 22px 22px;
  touch-action: none;
  cursor: grab;
}
.ne-canvas.is-panning { cursor: grabbing; }
.ne-canvas__pad {
  position: absolute;
  top: 0;
  left: 0;
  transform-origin: 0 0;
  width: 0;
  height: 0;
  will-change: transform;
}
.ne-canvas__svg {
  position: absolute;
  top: 0;
  left: 0;
  overflow: visible;
  pointer-events: none;
}
.ne-canvas__svg path { pointer-events: stroke; }

.ne-block {
  position: absolute;
  min-width: 120px;
  max-width: 240px;
  background: var(--paper-50);
  border: 1.5px solid var(--paper-100);
  border-radius: 12px;
  box-shadow: var(--shadow-paper);
  padding: 12px 14px;
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-900);
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  transition: box-shadow var(--dur-fast) var(--ease-zx),
              border-color var(--dur-fast) var(--ease-zx);
}
.ne-block:active { cursor: grabbing; }
.ne-block.is-selected {
  border-color: var(--con);
  box-shadow: 0 0 0 3px rgba(180, 96, 44, 0.18), var(--shadow-float);
}
.ne-block__type {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--con);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.ne-block__type svg { width: 12px; height: 12px; }
.ne-block--text .ne-block__type { color: var(--neutral-500); }
.ne-block--code {
  background: var(--ink-900);
  color: var(--paper-50);
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
}
.ne-block--code .ne-block__type { color: var(--gold-500); }
.ne-block--link .ne-block__type { color: var(--indigo-500); }
.ne-block--link a { color: var(--indigo-500); text-decoration: none; border-bottom: 1px dashed; }
/* 连接点 */
.ne-block__port {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: var(--r-full);
  background: var(--paper-50);
  border: 2px solid var(--con);
  cursor: crosshair;
  opacity: 0;
  transition: opacity var(--dur-fast) var(--ease-zx);
  z-index: 2;
}
.ne-block.is-selected .ne-block__port,
.ne-canvas.is-linking .ne-block__port { opacity: 1; }
.ne-block__port--e { top: 50%; right: -8px; transform: translateY(-50%); }
.ne-block__port--s { bottom: -8px; left: 50%; transform: translateX(-50%); }
.ne-block__port:hover { background: var(--con); }

/* 画布长按「添加块」菜单 */
.ne-canvas__addmenu {
  position: absolute;
  z-index: 12;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  padding: 6px;
  min-width: 152px;
  display: none;
}
.ne-canvas__addmenu.is-open {
  display: block;
  animation: ne-pop var(--dur-fast) var(--ease-zx);
}
.ne-canvas__additem {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 9px 10px;
  border-radius: var(--r-2);
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-900);
  cursor: pointer;
}
.ne-canvas__additem:hover { background: var(--paper-100); }
.ne-canvas__additem svg { width: 16px; height: 16px; color: var(--con); }

/* 画布右下角缩放指示浮层（小屏时辅助） */
.ne-canvas__hint {
  position: absolute;
  left: 12px;
  bottom: 12px;
  z-index: 8;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  background: rgba(250, 246, 238, 0.85);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  padding: 5px 10px;
  border-radius: var(--r-full);
  border: 1px solid var(--paper-100);
  pointer-events: none;
}

/* =====================================================================
 * 模板 4：大纲树（outline）
 * ===================================================================*/
.ne-outline {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 16px 120px;
}
.ne-outline__nodes { display: flex; flex-direction: column; }
.ne-node {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  position: relative;
  padding: 2px 0;
}
.ne-node__gutter {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
  min-height: 36px;
}
.ne-node__toggle {
  width: 24px;
  height: 24px;
  min-height: 24px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--r-1);
  color: var(--neutral-500);
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-zx);
}
.ne-node__toggle svg { width: 14px; height: 14px; display: block; }
.ne-node__toggle.is-leaf { visibility: hidden; }
.ne-node__toggle.is-collapsed { transform: rotate(-90deg); }
.ne-node__bullet {
  width: 22px;
  height: 22px;
  min-height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.ne-node__bullet::after {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: var(--r-full);
  background: currentColor;
  opacity: 0.7;
}
.ne-node__text {
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-900);
  outline: none;
  padding: 6px 8px;
  border-radius: var(--r-2);
  border: 1px solid transparent;
  min-height: 36px;
  cursor: text;
  -webkit-tap-highlight-color: transparent;
}
.ne-node__text:empty::before {
  content: attr(data-placeholder);
  color: var(--neutral-500);
  opacity: 0.5;
}
.ne-node__text:focus {
  border-color: var(--gold-500);
  background: rgba(199, 162, 74, 0.05);
}
.ne-node__typechip {
  flex-shrink: 0;
  align-self: center;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-family: var(--font-mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 0.02em;
  margin-top: 1px;
}
/* 节点类型色彩：观点(蓝) / 证据(绿→用黛青近义) / 问题(黄→鎏金) / 引用(紫→赤陶) / 待办(中性)
 * 注：设计规范避紫渐变，故"引用"用赤陶、"问题"用鎏金、"证据"用黛青。 */
.ne-node--opinion .ne-node__bullet,
.ne-node--opinion .ne-node__typechip { color: var(--indigo-500); }
.ne-node--opinion .ne-node__typechip { background: rgba(29, 91, 122, 0.10); }

.ne-node--evidence .ne-node__bullet { color: #2F855A; }
.ne-node--evidence .ne-node__typechip { color: #2F855A; background: rgba(56, 161, 105, 0.12); }

.ne-node--question .ne-node__bullet,
.ne-node--question .ne-node__typechip { color: var(--gold-700); }
.ne-node--question .ne-node__typechip { background: rgba(199, 162, 74, 0.16); }

.ne-node--quote .ne-node__bullet,
.ne-node--quote .ne-node__typechip { color: var(--con); }
.ne-node--quote .ne-node__typechip { background: rgba(180, 96, 44, 0.12); }

.ne-node--todo .ne-node__bullet { color: var(--neutral-500); }
.ne-node--todo .ne-node__typechip { color: var(--neutral-500); background: rgba(107, 101, 92, 0.14); }

/* 子节点缩进连接线 */
.ne-node__children {
  display: flex;
  flex-direction: column;
  position: relative;
  margin-left: 12px;
  padding-left: 14px;
}
.ne-node__children::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 0;
  bottom: 14px;
  width: 1.5px;
  background: var(--paper-100);
}
.ne-node.is-dragging { opacity: 0.5; }
.ne-node.is-drop-target > .ne-node__text { box-shadow: 0 0 0 2px var(--gold-500); }

/* 节点类型切换菜单 */
.ne-type-menu {
  position: fixed;
  z-index: 70;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  padding: 6px;
  min-width: 120px;
  display: none;
}
.ne-type-menu.is-open { display: block; animation: ne-pop var(--dur-fast) var(--ease-zx); }
.ne-type-menu__item {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 8px 10px;
  border-radius: var(--r-2);
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-900);
  cursor: pointer;
}
.ne-type-menu__item:hover { background: var(--paper-100); }
.ne-type-menu__dot { width: 8px; height: 8px; border-radius: var(--r-full); flex-shrink: 0; }

/* =====================================================================
 * AI 姿态 1：旁观插话（鎏金轻量建议气泡，内嵌段落下方）
 * ===================================================================*/
.ne-suggest {
  margin: 4px 0 16px;
  padding: 11px 13px;
  background: rgba(199, 162, 74, 0.10);
  border: 1px solid rgba(199, 162, 74, 0.36);
  border-left: 3px solid var(--gold-500);
  border-radius: 12px;
  animation: ne-suggest-in var(--dur-base) var(--ease-zx);
}
@keyframes ne-suggest-in {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.ne-suggest__head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.ne-suggest__ava {
  width: 20px;
  height: 20px;
  border-radius: var(--r-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(199, 162, 74, 0.20);
  color: var(--gold-700);
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}
.ne-suggest__ava svg { width: 13px; height: 13px; color: var(--gold-500); }
.ne-suggest__label {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-700);
  letter-spacing: 0.02em;
}
.ne-suggest__text {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-900);
}
.ne-suggest__actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ne-suggest__btn {
  min-height: 32px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: var(--r-full);
  border: 1px solid var(--gold-500);
  background: transparent;
  color: var(--gold-700);
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-zx);
}
.ne-suggest__btn:hover { background: rgba(199, 162, 74, 0.14); }
.ne-suggest__btn--primary { background: var(--gold-500); color: var(--ink-900); }
.ne-suggest__btn--primary:hover { background: var(--gold-500); filter: brightness(1.05); }
.ne-suggest__btn--ghost { border-color: transparent; color: var(--neutral-500); }
.ne-suggest__btn svg { width: 14px; height: 14px; }

/* =====================================================================
 * AI 姿态 2：肩并肩共写（鎏金差异色输出块）
 * ===================================================================*/
.ne-cowrite {
  margin: 4px 0 16px;
  padding: 13px 15px;
  background: linear-gradient(135deg, rgba(199, 162, 74, 0.14), rgba(199, 162, 74, 0.05));
  border: 1px solid var(--gold-500);
  border-radius: 12px;
  position: relative;
  animation: ne-cowrite-in var(--dur-base) var(--ease-zx);
}
@keyframes ne-cowrite-in {
  from { opacity: 0; transform: translateY(6px) scale(0.99); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.ne-cowrite__head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.ne-cowrite__tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--r-full);
  background: rgba(199, 162, 74, 0.22);
  color: var(--gold-700);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
}
.ne-cowrite__tag svg { width: 11px; height: 11px; color: var(--gold-500); }
.ne-cowrite__mode {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--neutral-500);
}
.ne-cowrite__text {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 15px;
  line-height: 1.75;
  color: var(--ink-900);
}
/* 鎏金差异色：新增文字带鎏金底纹，删除文字带删除线 */
.ne-cowrite__ins {
  background: rgba(199, 162, 74, 0.26);
  border-radius: var(--r-1);
  padding: 0 3px;
  color: var(--ink-900);
}
.ne-cowrite__del {
  text-decoration: line-through;
  text-decoration-color: var(--con);
  color: var(--neutral-500);
  opacity: 0.7;
}
.ne-cowrite__typing {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--gold-700);
}
.ne-cowrite__dots { display: inline-flex; gap: 3px; }
.ne-cowrite__dots span {
  width: 5px; height: 5px; border-radius: var(--r-full);
  background: var(--gold-500);
  animation: ne-cowrite-blink 1s var(--ease-zx) infinite;
}
.ne-cowrite__dots span:nth-child(2) { animation-delay: 0.15s; }
.ne-cowrite__dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes ne-cowrite-blink {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-3px); opacity: 1; }
}
.ne-cowrite__actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ne-cowrite__btn {
  min-height: 34px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: var(--r-full);
  border: 1px solid transparent;
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
}
.ne-cowrite__btn:active { transform: scale(0.96); }
.ne-cowrite__btn svg { width: 14px; height: 14px; }
.ne-cowrite__btn--accept {
  background: var(--cinnabar-500);
  color: #FFF6EC;
}
.ne-cowrite__btn--accept:hover { background: #A8232A; }
.ne-cowrite__btn--reject {
  background: var(--paper-100);
  color: var(--neutral-500);
}
.ne-cowrite__btn--refine {
  background: transparent;
  border-color: var(--gold-500);
  color: var(--gold-700);
}
.ne-cowrite__btn--refine:hover { background: rgba(199, 162, 74, 0.14); }

/* =====================================================================
 * AI 姿态 3：按需召唤（选中文字浮动工具栏 + 行内对话框）
 * ===================================================================*/
.ne-inline-toolbar {
  position: absolute;
  z-index: 65;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  background: var(--ink-900);
  border-radius: var(--r-full);
  box-shadow: var(--shadow-float);
  animation: ne-pop var(--dur-fast) var(--ease-zx);
}
@keyframes ne-pop {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: scale(1); }
}
.ne-inline-toolbar[hidden] { display: none; }
.ne-inline-toolbar__btn {
  min-width: 36px;
  height: 36px;
  min-height: 36px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--paper-50);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.ne-inline-toolbar__btn:hover { background: rgba(255, 255, 255, 0.14); }
.ne-inline-toolbar__btn svg { width: 16px; height: 16px; }
.ne-inline-toolbar__btn--ai {
  color: var(--gold-500);
  border-left: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 0 var(--r-full) var(--r-full) 0;
  margin-left: 2px;
  padding-right: 12px;
}
.ne-inline-toolbar__btn--ai svg { color: var(--gold-500); }

/* 行内对话框（不离开笔记页） */
.ne-inline-chat {
  position: absolute;
  z-index: 66;
  left: 12px;
  right: 12px;
  background: var(--paper-50);
  border: 1px solid var(--gold-500);
  border-radius: 16px;
  box-shadow: var(--shadow-float);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-height: 60%;
  animation: ne-chat-in var(--dur-base) var(--ease-zx);
}
@keyframes ne-chat-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.ne-inline-chat[hidden] { display: none; }
.ne-inline-chat__head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 12px;
  background: rgba(199, 162, 74, 0.10);
  border-bottom: 1px solid var(--paper-100);
}
.ne-inline-chat__ava {
  width: 22px; height: 22px;
  border-radius: var(--r-full);
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(199, 162, 74, 0.22);
  color: var(--gold-700);
}
.ne-inline-chat__ava svg { width: 13px; height: 13px; color: var(--gold-500); }
.ne-inline-chat__title {
  flex: 1;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--gold-700);
}
.ne-inline-chat__close {
  width: 32px; height: 32px; min-height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: var(--r-full);
  color: var(--neutral-500); cursor: pointer;
}
.ne-inline-chat__close svg { width: 16px; height: 16px; }
.ne-inline-chat__quote {
  padding: 8px 12px;
  font-family: var(--font-display);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink-700);
  background: var(--paper-100);
  border-bottom: 1px solid var(--paper-100);
  font-style: italic;
}
.ne-inline-chat__msgs {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ne-inline-chat__msg {
  font-family: var(--font-display);
  font-size: 13px;
  line-height: 1.55;
  padding: 8px 11px;
  border-radius: 12px;
  max-width: 88%;
}
.ne-inline-chat__msg--ai {
  align-self: flex-start;
  background: rgba(199, 162, 74, 0.10);
  border-top-left-radius: 4px;
  color: var(--ink-900);
}
.ne-inline-chat__msg--user {
  align-self: flex-end;
  background: var(--cinnabar-500);
  color: #FFF6EC;
  border-top-right-radius: 4px;
}
.ne-inline-chat__input-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px 10px;
  border-top: 1px solid var(--paper-100);
}
.ne-inline-chat__input {
  flex: 1;
  min-height: 36px;
  padding: 8px 12px;
  background: var(--paper-100);
  border: none;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-900);
  outline: none;
}
.ne-inline-chat__send {
  width: 36px; height: 36px; min-height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--cinnabar-500); border: none; border-radius: var(--r-full);
  color: #FFF6EC; cursor: pointer; flex-shrink: 0;
}
.ne-inline-chat__send svg { width: 16px; height: 16px; }
.ne-inline-chat__apply {
  display: flex;
  gap: 8px;
  padding: 0 12px 12px;
}
.ne-inline-chat__apply .ne-cowrite__btn { flex: 1; justify-content: center; }

/* =====================================================================
 * 斜杠命令菜单（/）与 双链搜索（[[）
 * ===================================================================*/
.ne-slash, .ne-linksearch {
  position: absolute;
  z-index: 64;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
