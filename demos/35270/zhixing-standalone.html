          + '<h4 class="sq-search__h">历史搜索'
            + (state.searchHistory.length ? '<button class="sq-search__h-action" data-action="clear-history">清空</button>' : '')
          + '</h4>'
          + '<ul class="sq-history">' + histHtml + '</ul>'
        + '</div>';
      return;
    }

    // 实时建议：在 mock.notes 标题 / 摘要 / 标签中匹配
    var notes = mock().notes || [];
    var klower = kw.toLowerCase();
    var matches = notes.filter(function (n) {
      var blob = (n.title + ' ' + (n.summary || '') + ' ' + (n.tags || []).join(' ')).toLowerCase();
      return blob.indexOf(klower) !== -1;
    }).slice(0, 6);

    if (!matches.length) {
      body.innerHTML = '<div class="sq-empty">未找到与「' + escapeHtml(kw) + '」相关的内容</div>';
      return;
    }
    body.innerHTML = '<div class="sq-search__section">'
      + '<h4 class="sq-search__h">相关笔记</h4>'
      + '<div class="sq-suggest">'

              + '<span class="sq-suggest__sub">' + (n.commentCount || 0) + ' 评论</span>'
            + '</div>';
          }).join('')
      + '</div>'
    + '</div>';
  }

  function highlight(text, kw) {
    if (!kw) return escapeHtml(text);
    var lower = text.toLowerCase();
    var klower = kw.toLowerCase();
    var idx = lower.indexOf(klower);
    if (idx === -1) return escapeHtml(text);
    return escapeHtml(text.slice(0, idx))
      + '<em>' + escapeHtml(text.slice(idx, idx + kw.length)) + '</em>'
      + escapeHtml(text.slice(idx + kw.length));
  }

  function pushHistory(kw) {
    kw = (kw || '').trim();
    if (!kw) return;
    var idx = state.searchHistory.indexOf(kw);
    if (idx !== -1) state.searchHistory.splice(idx, 1);
    state.searchHistory.unshift(kw);
    if (state.searchHistory.length > 5) state.searchHistory.length = 5;
  }

  /* ----------------------------- 事件委托 ----------------------------- */
  function onFeedClick(e) {
    var t = e.target instanceof Element ? e.target.closest('[data-action]') : null;
    if (!t) return;
    var action = t.getAttribute('data-action');
    var id = t.getAttribute('data-id');
    var mode = t.getAttribute('data-mode');
    var kw = t.getAttribute('data-kw');
    var tab = t.getAttribute('data-tab');
    var tag = t.getAttribute('data-tag');
    var idx = t.getAttribute('data-idx');

    switch (action) {
      case 'open-search': pushView('search'); break;
      case 'open-notif': pushView('notif'); break;
      case 'more': toast('更多功能开发中'); break;
      case 'set-mode': setMode(mode); break;
      case 'toggle-mode': setMode(state.mode === 'xhs' ? 'zh' : 'xhs'); break;
      case 'open-note':
        // 不拦截 like / bookmark 等子按钮
        pushView('detail', { noteId: id });
        break;
      case 'like-note':
        e.preventDefault(); e.stopPropagation();
        state.likedNotes[id] = !state.likedNotes[id];
        toast(state.likedNotes[id] ? '已赞同' : '已取消');
        // 局部刷新当前 feed
        if (stack[stack.length - 1] === 'feed') renderFeed();
        break;
      case 'bookmark-note':
        e.preventDefault(); e.stopPropagation();
        state.bookmarked[id] = !state.bookmarked[id];
        toast(state.bookmarked[id] ? '已收藏' : '已取消收藏');
        if (stack[stack.length - 1] === 'feed') renderFeed();
        break;
      case 'share-note':
        e.preventDefault(); e.stopPropagation();
        toast('链接已复制');
        break;
      case 'pop': popView(); break;
      case 'follow': {
        e.stopPropagation();
        state.followed[id] = !state.followed[id];
        var btn = t;
        btn.classList.toggle('is-on', state.followed[id]);
        btn.innerHTML = state.followed[id] ? IC.check(13) + '已关注' : IC.plus(13) + '关注';
        /* 闭环 ④：写入 bridge，好友页「我的伙伴」会出现该作者 */
        if (window.ZX_BRIDGE) {
          if (state.followed[id]) {
            window.ZX_BRIDGE.follow(id);
            toast('已关注 ' + userById(id).name + ' · 去好友页看看 TA');
          } else {
            window.ZX_BRIDGE.unfollow(id);
            toast('已取消关注');
          }
        } else {
          toast(state.followed[id] ? '已关注 ' + userById(id).name : '已取消关注');
        }
        break;
      }
      case 'like-comment':
        e.stopPropagation();
        state.likedComments[id] = !state.likedComments[id];
        var cmt = t.closest('.sq-cmt');
        if (cmt) {
          t.classList.toggle('is-on', state.likedComments[id]);
          var span = t.querySelector('span');
          if (span) {
            var base = parseInt((t.getAttribute('data-base') || '0'), 10);
            if (!base) {
              var txt = span.textContent || '';
              base = parseInt(txt.replace(/[^\d]/g, ''), 10) || 0;
              t.setAttribute('data-base', base - (state.likedComments[id] ? 1 : 0));
            }
            var cur = base + (state.likedComments[id] ? 1 : 0);
            span.textContent = formatCount(cur);
          }
        }
        break;
      case 'all-comments':
        toast('全部评论区开发中');
        break;
      case 'tag-search':
        e.stopPropagation();
        state.searchKw = tag;
        pushHistory(tag);
        pushView('search');
        break;
      case 'clear-search':
        state.searchKw = '';
        renderSearch();
        break;
      case 'search-kw':
        state.searchKw = kw;
        pushHistory(kw);
        renderSearch();
        break;
      case 'del-history':
        e.stopPropagation();
        state.searchHistory.splice(parseInt(idx, 10), 1);
        renderSearchBody();
        break;
      case 'clear-history':
        state.searchHistory = [];
        renderSearchBody();
        break;
      case 'read-all':
        toast('已全部标为已读');
        $all('.sq-notif__dot').forEach(function (d) { d.classList.add('is-read'); });
        break;
      case 'open-notif-detail':
        toast('通知详情开发中');
        break;
      case 'send-comment': {
        var input = $('[data-sq-comment-input]');
        if (input && input.value.trim()) {
          toast('评论已提交，等待社区审议');
          input.value = '';
        } else {
          toast('请先写点什么');
        }
        break;
      }
      default: break;
    }
  }

  /* 搜索框实时输入 */
  function onSearchInput(e) {
    var t = e.target;
    if (!t || !t.matches || !t.matches('[data-sq-search-input]')) return;
    state.searchKw = t.value || '';
    // 仅在清除按钮存在性上做局部更新；body 全量重渲便宜
    var clear = $('[data-action="clear-search"]');
    if (state.searchKw && !clear) {
      var wrap = t.closest('.sq-search__input-wrap');
      if (wrap) {
        var btn = el('button', 'sq-search__clear', IC.close(11));
        btn.setAttribute('data-action', 'clear-search');
        btn.setAttribute('aria-label', '清空');
        wrap.appendChild(btn);
      }
    } else if (!state.searchKw && clear) {
      clear.parentNode.removeChild(clear);
    }
    renderSearchBody();
  }

  /* 详情页正反 tab 切换 */
  function onDebateTabClick(e) {
    var t = e.target instanceof Element ? e.target.closest('[data-tab]') : null;
    if (!t) return;
    var tab = t.getAttribute('data-tab');
    if (tab === 'pro' || tab === 'con') switchDebateTab(tab);
  }

  /* ----------------------------- 初始化 ----------------------------- */
  function init() {
    if (state.initialized) return;
    state.initialized = true;

    var root = $('[data-sq-root]');
    if (!root) return;

    renderFeedTop();
    renderFeed();

    // 事件委托（绑在根，永久存活）
    root.addEventListener('click', onFeedClick);
    root.addEventListener('input', onSearchInput);
    // 争论 tab：单独委托到 bar 容器
    root.addEventListener('click', function (e) {
      if (e.target instanceof Element && e.target.closest('[data-sq-debate-tabs]')) {
        onDebateTabClick(e);
      }
    });
    // 键盘可达性：role="button" 元素响应 Enter/Space
    root.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var t = e.target instanceof Element ? e.target.closest('[role="button"][data-action]') : null;
      if (!t) return;
      e.preventDefault();
      t.click();
    });

    // 注入 toast 节点
    if (!$('[data-sq-toast]')) {
      var toastEl = el('div', 'sq-toast');
      toastEl.setAttribute('data-sq-toast', '');
      root.appendChild(toastEl);
    }
  }

  /* 暴露 API */
  window.ZX_SQUARE = {
    init: init,
    pushView: pushView,
    popView: popView,
    setMode: setMode,
    state: state
  };

  /* 闭环：切回广场时刷新 Feed（让新发布/关注联动可见） */
  window.addEventListener('zx-tab-active', function (e) {
    if (e.detail && e.detail.tab === 'square') {
      try { renderFeed(); } catch (x) {}
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

 *   5. AI 介入：顶栏 ✦ → 顶部出现「林正在旁观你们的对话」状态条，

 * 依赖：../demo/shared/icons.js（ZX.icon）、../demo/shared/mock-data.js（ZX_MOCK）
 * 挂载：window.ZX_FRIENDS
 * 约束：原生 JS + 事件委托，无框架，无 alert/prompt/confirm
 * =======================================================================*/

(function () {
  'use strict';

  /* ----------------------------- 工具 ----------------------------- */

  function $(sel, ctx) { return (ctx || document).querySelector(sel); }
  function $all(sel, ctx) { return Array.prototype.slice.call((ctx || document).querySelectorAll(sel)); }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function svg(inner, size) {
    size = size || 22;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" '
      + 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" '
      + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'
      + inner + '</svg>';
  }

          + '<div class="fr-debatecard__tag">' + IC.vs() + '争论邀请</div>'
          + '<p class="fr-debatecard__title">' + escapeHtml(m.debateTitle || '一场争论') + '</p>'
          + '<div class="fr-debatecard__bar">'
            + '<div class="fr-debatecard__bar--pro" style="width:' + pro + '%"></div>'
            + '<div class="fr-debatecard__bar--con" style="width:' + con + '%"></div>'
          + '</div>'
          + '<div class="fr-debatecard__stats">'
            + '<span class="fr-debatecard__stats--pro">赞成 ' + pro + '%</span>'
            + '<span class="fr-debatecard__stats--con">反对 ' + con + '%</span>'
          + '</div>'
          + '<button class="fr-debatecard__join" data-action="join-debate">加入这场争论</button>'
        + '</div>';
    } else {
      var safeText = highlightMentions(escapeHtml(m.text || ''));
      contentHtml = '<div class="fr-msg__bubble">' + safeText + '</div>';
    }

    /* 群聊显示发送者名（我的消息不显示） */
    var senderHtml = '';
    if (ctx.isGroup && role !== 'me' && author) {
      senderHtml = '<div class="fr-msg__sender">' + escapeHtml(author.name) + '</div>';
    }

    /* AI 插话前缀 */
    var aiPrefix = '';
    if (role === 'ai') {
      aiPrefix = '<div class="fr-ai-prefix">' + IC.spark() + '林 · 旁观插话</div>';
    }

    return ''
      + '<div class="' + cls + '" data-role="' + role + '">'
        + avaHtml
        + '<div class="fr-msg__col">'
          + senderHtml
          + aiPrefix
          + contentHtml
          + '<div class="fr-msg__time">' + escapeHtml(m.time || '') + '</div>'
        + '</div>'
      + '</div>';
  }

  function highlightMentions(safeHtml) {
    /* safeHtml 已转义；只匹配 @中文/字母数字 字符 */
    return safeHtml.replace(/@([^\s@<>&]{1,12})/g, function (_, name) {
      return '<span class="fr-mention-tag">@' + name + '</span>';
    });
  }

  /* ----------------------------- 状态机 ----------------------------- */

  var state = {
    tab: 'friends',        /* friends | groups */

    peerId: null,

    aiOn: false,           /* 当前聊天页 AI 介入开关 */

  var dom = {};

  /* —— 视图栈切换 —— */
  function showView(name) {
    state.view = name;
    var map = { list: dom.viewList, chat: dom.viewChat, group: dom.viewGroup, add: dom.viewAdd };
    Object.keys(map).forEach(function (k) {
      var v = map[k];
      if (!v) return;
      v.classList.toggle('is-on', k === name);
      v.classList.toggle('is-covered', k !== name && name !== 'list' && k === 'list');
    });
    if (name === 'list') {
      dom.viewList.classList.remove('is-covered');
    }
  }

  /* —— segment 切换 —— */
  function setTab(tab) {
    state.tab = tab;
    var onF = tab === 'friends';
    dom.segFriends.classList.toggle('is-active', onF);
    dom.segGroups.classList.toggle('is-active', !onF);
    dom.tabFriends.style.display = onF ? 'flex' : 'none';
    dom.tabGroups.style.display = onF ? 'none' : 'flex';
    dom.btnAdd.setAttribute('aria-label', onF ? '添加好友' : '新建群聊');
  }

  /* ----------------------------- 渲染：列表 ----------------------------- */

  function renderFriendsList() {
    var q = (state.search.friends || '').trim().toLowerCase();
    /* 闭环 ④：bridge 关注的作者插入「我的伙伴」顶部（去重） */
    var bridgeIds = (window.ZX_BRIDGE && window.ZX_BRIDGE.getFollowingIds()) || [];
    var allPartnerIds = (FRIEND_GROUPS.partners || []).slice();
    bridgeIds.forEach(function (bid) { if (allPartnerIds.indexOf(bid) < 0) allPartnerIds.unshift(bid); });
    var partners = allPartnerIds.map(userById).filter(Boolean);
    var recommends = FRIEND_GROUPS.recommends.slice();

    if (q) {
      partners = partners.filter(function (u) {
        return u.name.toLowerCase().indexOf(q) >= 0
          || (u.domain || '').toLowerCase().indexOf(q) >= 0
          || (u.bio || '').toLowerCase().indexOf(q) >= 0;
      });
      recommends = recommends.filter(function (r) {
        var u = userById(r.id); if (!u) return false;
        return u.name.toLowerCase().indexOf(q) >= 0
          || (u.domain || '').toLowerCase().indexOf(q) >= 0;
      });
    }

    var html = '';
    if (partners.length === 0 && recommends.length === 0) {
      html = emptyHtml('没找到匹配的好友', '试试其它昵称、领域或兴趣标签');
    } else {
      html += '<section class="fr-section">'
        + '<div class="fr-section__head"><h3 class="fr-section__title">我的知识伙伴</h3>'
        + '<span class="fr-section__count">' + partners.length + ' 位</span></div>';
      if (partners.length === 0) {
        html += '<p class="fr-reason" style="padding-left:16px">没有匹配的好友</p>';
      } else {
        partners.forEach(function (u) {
          html += '<button class="fr-row" data-action="open-chat" data-uid="' + u.id + '">'
            + renderFriendRow(u, FRIEND_STATE[u.id])
            + '</button>';
        });
      }
      html += '</section>';

      if (!q) {
        html += '<section class="fr-section">'
          + '<div class="fr-section__head"><h3 class="fr-section__title">推荐关注</h3>'
          + '<span class="fr-section__count">基于笔记相关度</span></div>';
        recommends.forEach(function (r) { html += renderRecommendRow(r); });
        html += '</section>';
      }
    }
    dom.friendsBody.innerHTML = html;
  }

  function renderGroupsList() {
    var q = (state.search.groups || '').trim().toLowerCase();
    var list = MOCK_GROUPS.slice();
    if (q) {
      list = list.filter(function (g) {
        return g.name.toLowerCase().indexOf(q) >= 0
          || g.typeLabel.toLowerCase().indexOf(q) >= 0
          || (g.preview || '').toLowerCase().indexOf(q) >= 0;
      });
    }
    var html = '';
    if (list.length === 0) {
      html = emptyHtml('没有匹配的群聊', '试试群名或群类型');
    } else {
      html += '<section class="fr-section">'
        + '<div class="fr-section__head"><h3 class="fr-section__title">我的群聊</h3>'
        + '<span class="fr-section__count">' + list.length + ' 个</span></div>';
      list.forEach(function (g) { html += renderGroupRow(g); });
      html += '</section>';
    }
    dom.groupsBody.innerHTML = html;
  }

  function renderAddList() {
    var q = (state.search.add || '').trim().toLowerCase();
    var list = addRecommendList();
    if (q) {
      list = list.filter(function (u) {
        return u.name.toLowerCase().indexOf(q) >= 0
          || (u.domain || '').toLowerCase().indexOf(q) >= 0
          || String(u.authority).indexOf(q) >= 0;
      });
    }
    /* 筛选 chip：权威分阈值 / 领域关键词 */
    var filter = state.addFilter || '推荐';
    if (filter && filter !== '推荐') {
      var kw = filter.replace(/\s/g, '');
      var domainKw = ({ '材料学': '材料', '电池工程': '电池', '物理学': '物理', '电化学': '电化学' })[kw];
      list = list.filter(function (u) {
        if (/权威/.test(kw)) { var m = kw.match(/(\d+)/); return m ? u.authority >= parseInt(m[1], 10) : true; }
        if (domainKw) return (u.domain || '').indexOf(domainKw) >= 0;
        return true;
      });
    }
    if (list.length === 0) {
      dom.addBody.innerHTML = emptyHtml('暂无更多推荐', '已经把全部相关研究者都推给你了');
      return;
    }
    var html = '<section class="fr-section">'
      + '<div class="fr-section__head"><h3 class="fr-section__title">为你推荐</h3>'
      + '<span class="fr-section__count">' + list.length + ' 位</span></div>';
    list.forEach(function (u) {
      var reason = u.domain + ' · 权威分 ' + u.authority + ' · ' + (u.bio || '');
      html += renderRecommendRow({ id: u.id, reason: reason });
    });
    html += '</section>';
    dom.addBody.innerHTML = html;
  }

  function emptyHtml(title, sub) {
    return '<div class="fr-empty"><p class="fr-empty__title">' + escapeHtml(title) + '</p>'
      + '<p class="fr-empty__sub">' + escapeHtml(sub) + '</p></div>';
  }

  /* ----------------------------- 渲染：聊天页 ----------------------------- */

  function openChat(peerId) {
    state.peerId = peerId;
    state.aiOn = false;
    state.aiCounters['1on1'] = 0;
    var peer = userById(peerId);
    if (!peer) return;

    /* 顶栏 */
    var st = FRIEND_STATE[peerId] || {};
    var statusText = st.online ? '在线' : (st.last || '离线');
    var statusCls = st.online ? '' : 'is-offline';
    dom.chatTop.innerHTML = ''
      + '<button class="fr-iconbtn" data-action="back-list" aria-label="返回">' + IC.back() + '</button>'
      + '<div class="fr-chat-head">'
        + '<span class="fr-chat-head__ava" style="background:' + (peer.avatarColor || '#6B655C') + '">' + escapeHtml(peer.initials || peer.name) + '</span>'
        + '<div class="fr-chat-head__main">'
          + '<span class="fr-chat-head__name">' + escapeHtml(peer.name) + '</span>'
          + '<span class="fr-chat-head__status ' + statusCls + '">' + escapeHtml(statusText) + ' · 权威 ' + peer.authority + '</span>'
        + '</div>'
      + '</div>'
      + '<button class="fr-ai-btn" data-fr-chat-ai data-action="toggle-ai" data-ctx="1on1" aria-label="林介入对话" aria-pressed="false">' + IC.spark() + '</button>'
      + '<button class="fr-iconbtn" data-action="peer-more" aria-label="更多">' + IC.more() + '</button>';

    /* AI 条初始关闭 */
    dom.chatAiBar.classList.remove('is-on');
    dom.chatAiBar.innerHTML = ''
      + '<span class="fr-ai-bar__spark">' + IC.spark() + '</span>'
      + '<span class="fr-ai-bar__text">林正在旁观你们的对话 · 可随时被 @ 召唤</span>'
      + '<button class="fr-ai-bar__close" data-action="toggle-ai" data-ctx="1on1" aria-label="关闭林旁观">×</button>';

    /* 消息流 */
    var msgs = MOCK_CHATS[peerId] ? MOCK_CHATS[peerId].slice() : [];
    renderChatMessages(msgs, false);
    showView('chat');

    /* 输入框聚焦状态初始化 */
    if (dom.chatInput) { dom.chatInput.value = ''; updateSendState(dom.chatInput, dom.chatSend); }
  }

  function openGroup(groupId) {
    state.groupId = groupId;
    state.aiOn = false;
    state.aiCounters.group = 0;
    var g = null;
    for (var i = 0; i < MOCK_GROUPS.length; i++) { if (MOCK_GROUPS[i].id === groupId) g = MOCK_GROUPS[i]; }
    if (!g) return;

    /* 顶栏 */
    dom.groupTop.innerHTML = ''
      + '<button class="fr-iconbtn" data-action="back-list" aria-label="返回">' + IC.back() + '</button>'
      + '<div class="fr-chat-head">'
        + '<span class="fr-chat-head__ava fr-chat-head__ava--group" style="background:' + g.avatarColor + '">' + escapeHtml(g.avatarText) + '</span>'
        + '<div class="fr-chat-head__main">'
          + '<span class="fr-chat-head__name">' + escapeHtml(g.name) + '</span>'
          + '<span class="fr-chat-head__status">' + g.members.length + ' 位成员 · ' + escapeHtml(g.typeLabel) + '</span>'
        + '</div>'
      + '</div>'
      + '<button class="fr-ai-btn" data-fr-group-ai data-action="toggle-ai" data-ctx="group" aria-label="林介入对话" aria-pressed="false">' + IC.spark() + '</button>'
      + '<button class="fr-iconbtn" data-action="group-settings" aria-label="群设置">' + IC.gear() + '</button>';

    /* 群公告条 */
    dom.groupAnnounce.classList.remove('is-hidden');
    dom.groupAnnounce.innerHTML = ''
      + '<span class="fr-announce__tag">公告</span>'
      + '<span class="fr-announce__text">' + escapeHtml(g.announcement || '') + '</span>';

    /* 共享笔记区入口 */
    var sharedHtml = '';
    (g.sharedNotes || []).forEach(function (nid) {
      var n = noteById(nid); if (!n) return;
      sharedHtml += '<button class="fr-shared__chip" data-action="open-note" data-note-id="' + n.id + '">'
        + IC.doc() + escapeHtml(truncate(n.title, 14)) + '</button>';
    });
    sharedHtml += '<button class="fr-shared__add" data-action="add-shared-note" aria-label="添加共享笔记">' + IC.plus() + '</button>';
    dom.groupShared.innerHTML = sharedHtml;

    /* AI 条 */
    dom.groupAiBar.classList.remove('is-on');
    dom.groupAiBar.innerHTML = ''
      + '<span class="fr-ai-bar__spark">' + IC.spark() + '</span>'
      + '<span class="fr-ai-bar__text">林正在旁观群聊 · 可被 @ 召唤 · 偶尔主动插话</span>'
      + '<button class="fr-ai-bar__close" data-action="toggle-ai" data-ctx="group" aria-label="关闭林旁观">×</button>';

    /* 消息流 */
    var msgs = MOCK_GROUP_CHATS[groupId] ? MOCK_GROUP_CHATS[groupId].slice() : [];
    renderChatMessages(msgs, true, dom.groupMsgs);
    showView('group');

    if (dom.groupInput) { dom.groupInput.value = ''; updateSendState(dom.groupInput, dom.groupSend); }
  }

  function renderChatMessages(msgs, isGroup, target) {
    var host = target || dom.chatMsgs;
    var me = userById(ME_ID);
    var html = '';
    msgs.forEach(function (m) {
      html += renderMessage(m, { isGroup: !!isGroup, me: me });
    });
    host.innerHTML = html;
    /* 滚到底 */
    requestAnimationFrame(function () {
      host.scrollTop = host.scrollHeight;
    });
  }

  function appendMessage(m, isGroup) {
    var host = isGroup ? dom.groupMsgs : dom.chatMsgs;
    var me = userById(ME_ID);
    var node = el('div');
    node.innerHTML = renderMessage(m, { isGroup: !!isGroup, me: me });
    var frag = document.createDocumentFragment();
    while (node.firstChild) frag.appendChild(node.firstChild);
    host.appendChild(frag);
    requestAnimationFrame(function () { host.scrollTop = host.scrollHeight; });
  }

  function truncate(s, n) {
    s = s || '';
    return s.length > n ? s.slice(0, n) + '…' : s;
  }

  /* ----------------------------- AI 介入 ----------------------------- */

  function toggleAI(ctx) {
    state.aiOn = !state.aiOn;
    /* AI 按键是 openChat/openGroup 时动态注入的，每次实时查询 */
    var btn = $(ctx === 'group' ? '[data-fr-group-ai]' : '[data-fr-chat-ai]');
    var bar = ctx === 'group' ? dom.groupAiBar : dom.chatAiBar;
    if (btn) {
      btn.classList.toggle('is-active', state.aiOn);
      btn.setAttribute('aria-pressed', state.aiOn ? 'true' : 'false');
    }
    if (bar) bar.classList.toggle('is-on', state.aiOn);
  }

  function maybeAIInterject(ctx) {
    if (!state.aiOn) return;
    var key = ctx === 'group' ? 'group' : '1on1';
    state.aiCounters[key] = (state.aiCounters[key] || 0) + 1;
    if (state.aiCounters[key] % 2 !== 0) return; /* 每 2 条用户消息插话一次 */

    var pool = ctx === 'group' ? AI_INTERJECTIONS_GROUP : AI_INTERJECTIONS_1ON1;
    var text = pool[(state.aiCounters[key] / 2 - 1) % pool.length];

    /* 思考动画占位 */
    var typingMsg = { role: 'ai', text: '__typing__', time: nowHHMM() };
    appendTyping(ctx);
    setTimeout(function () {
      removeTyping(ctx);
      appendMessage({ role: 'ai', text: text, time: nowHHMM() }, ctx === 'group');
    }, 1100);
  }

  function appendTyping(ctx) {
    var host = ctx === 'group' ? dom.groupMsgs : dom.chatMsgs;
    var node = el('div', 'fr-msg fr-msg--ai', ''
      + '<span class="fr-msg__ava" style="background:var(--gold-500);color:var(--ink-900)">林</span>'
      + '<div class="fr-msg__col">'
      + '<div class="fr-ai-prefix">' + IC.spark() + '林 · 正在思考</div>'
      + '<div class="fr-msg__bubble"><span class="fr-typing"><span class="fr-typing__dots">'
      + '<span class="fr-typing__dot"></span><span class="fr-typing__dot"></span><span class="fr-typing__dot"></span>'
      + '</span></span></div>'
      + '</div>');
    node.setAttribute('data-typing', '1');
    host.appendChild(node);
    requestAnimationFrame(function () { host.scrollTop = host.scrollHeight; });
  }
  function removeTyping(ctx) {
    var host = ctx === 'group' ? dom.groupMsgs : dom.chatMsgs;
    var t = host.querySelector('[data-typing="1"]');
    if (t) t.parentNode.removeChild(t);
  }

  /* ----------------------------- 发送消息 ----------------------------- */

  function sendMessage(ctx) {
    var input = ctx === 'group' ? dom.groupInput : dom.chatInput;
    var sendBtn = ctx === 'group' ? dom.groupSend : dom.chatSend;
    var text = (input.value || '').trim();
    if (!text) return;
    var msg = { role: 'me', text: text, time: nowHHMM() };
    appendMessage(msg, ctx === 'group');

    /* 写回 mock（保证返回时仍可见） */
    if (ctx === 'group') {
      var g = state.groupId;
      (MOCK_GROUP_CHATS[g] = MOCK_GROUP_CHATS[g] || []).push(msg);
    } else {
      var p = state.peerId;
      (MOCK_CHATS[p] = MOCK_CHATS[p] || []).push(msg);
    }

    input.value = '';
    updateSendState(input, sendBtn);
    closeAttachMenu(ctx);
    closeMention();

    /* AI 是否插话 */
    maybeAIInterject(ctx);
  }

  function updateSendState(input, btn) {
    if (!input || !btn) return;
    var has = (input.value || '').trim().length > 0;
    btn.disabled = !has;
  }

  /* ----------------------------- 附件菜单 ----------------------------- */

  function toggleAttachMenu(ctx) {
    var menu = ctx === 'group' ? dom.groupAttachMenu : dom.chatAttachMenu;
    if (!menu) return;
    menu.classList.toggle('is-open');
  }
  function closeAttachMenu(ctx) {
    var menu = ctx === 'group' ? dom.groupAttachMenu : dom.chatAttachMenu;
    if (menu) menu.classList.remove('is-open');
  }

  function attachKind(kind, ctx) {
    closeAttachMenu(ctx);
    var tray = ctx === 'group' ? dom.groupAttachTray : dom.chatAttachTray;
    if (!tray) return;
    var label = '';
    var iconHtml = '';
    if (kind === 'note') {
      var n = noteById('n-solid-battery-impedance');
      label = n ? truncate(n.title, 16) : '笔记';
      iconHtml = IC.note();
    } else if (kind === 'debate') {
      label = '发起一场争论';
      iconHtml = IC.vs();
    } else if (kind === 'image') {
      label = '图片附件';
      iconHtml = IC.image();
    }
    var chip = el('span', 'fr-attach-chip', iconHtml + '<span>' + escapeHtml(label) + '</span>'
      + '<button data-action="remove-attach" aria-label="移除">×</button>');
    tray.appendChild(chip);
    tray.classList.add('is-open');
  }

  /* ----------------------------- @提及（群聊） ----------------------------- */

  function openMention(filter) {
    if (!dom.groupMention) return;
    var group = currentGroup();
    if (!group) return;
    var members = group.members.map(userById).filter(Boolean);
    if (filter) {
      var f = filter.toLowerCase();
      members = members.filter(function (u) { return u.name.toLowerCase().indexOf(f) >= 0; });
    }
    var html = '';
    members.forEach(function (u) {
      html += '<div class="fr-mention__item" data-action="pick-mention" data-uid="' + u.id + '">'
        + '<span class="fr-mention__ava" style="background:' + (u.avatarColor || '#6B655C') + '">' + escapeHtml(u.initials || u.name) + '</span>'
        + '<span class="fr-mention__name">' + escapeHtml(u.name) + '</span>'
        + '</div>';
    });
    if (!html) html = '<div class="fr-mention__item"><span class="fr-mention__name" style="color:var(--neutral-500)">未匹配到成员</span></div>';
    dom.groupMention.innerHTML = html;
    dom.groupMention.classList.add('is-open');
  }
  function closeMention() { if (dom.groupMention) dom.groupMention.classList.remove('is-open'); }

  function currentGroup() {
    for (var i = 0; i < MOCK_GROUPS.length; i++) {
      if (MOCK_GROUPS[i].id === state.groupId) return MOCK_GROUPS[i];
    }
    return null;
  }

  /* ----------------------------- 长按菜单 ----------------------------- */

  var longPressTimer = null;
  var longPressTarget = null;

  function openContextMenu(uid) {
    var u = userById(uid); if (!u) return;
    dom.contextHead.innerHTML = ''
      + avatarHtml(u)
      + '<div><div class="fr-context__name">' + escapeHtml(u.name) + '</div>'
      + '<div class="fr-context__sub">' + escapeHtml(u.domain || '') + ' · 权威 ' + u.authority + '</div></div>';
    dom.contextItems.innerHTML = ''
      + '<button class="fr-context__item" data-action="ctx-remark">' + IC.pencil() + '设置备注名</button>'
      + '<button class="fr-context__item" data-action="ctx-pin">' + IC.pin() + '置顶对话</button>'
      + '<button class="fr-context__item" data-action="ctx-mute">' + IC.forbid() + '消息免打扰</button>'
      + '<button class="fr-context__item fr-context__item--danger" data-action="ctx-delete">' + IC.trash() + '删除好友</button>';
    dom.contextMenu.classList.add('is-open');
    dom.scrim.classList.add('is-open');
  }
  function closeContextMenu() {
    dom.contextMenu.classList.remove('is-open');
    dom.scrim.classList.remove('is-open');
  }

  /* ----------------------------- 事件绑定 ----------------------------- */

  function onInputScrollHeight(input) {
    input.style.height = 'auto';
    input.style.height = Math.min(96, input.scrollHeight) + 'px';
  }

  function bindGlobal() {
    /* segment */
    dom.segFriends.addEventListener('click', function () { setTab('friends'); });
    dom.segGroups.addEventListener('click', function () { setTab('groups'); });

    /* 右上 + */
    dom.btnAdd.addEventListener('click', function () {
      if (state.tab === 'friends') { openAdd(); }
      else { /* 新建群聊：本 demo 复用添加页 */
        openAdd();
      }
    });

    /* 搜索 */
    if (dom.searchFriends) {
      dom.searchFriends.addEventListener('input', function () {
        state.search.friends = dom.searchFriends.value || '';
        renderFriendsList();
      });
    }
    if (dom.searchGroups) {
      dom.searchGroups.addEventListener('input', function () {
        state.search.groups = dom.searchGroups.value || '';
        renderGroupsList();
      });
    }
    if (dom.searchAdd) {
      dom.searchAdd.addEventListener('input', function () {
        state.search.add = dom.searchAdd.value || '';
        renderAddList();
      });
    }

    /* 添加页筛选 chip —— 切换并按筛选重渲列表 */
    if (dom.addFilters) {
      dom.addFilters.addEventListener('click', function (e) {
        var c = e.target.closest('.fr-filter-chip'); if (!c) return;
        $all('.fr-filter-chip', dom.addFilters).forEach(function (x) { x.classList.remove('is-active'); });
        c.classList.add('is-active');
        state.addFilter = c.textContent.trim();
        renderAddList();
      });
    }

    /* 输入框（1对1） */
    if (dom.chatInput) {
      dom.chatInput.addEventListener('input', function () {
        onInputScrollHeight(dom.chatInput);
        updateSendState(dom.chatInput, dom.chatSend);
      });
      dom.chatInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage('1on1');
        }
      });
    }
    if (dom.chatSend) {
      dom.chatSend.addEventListener('click', function () { sendMessage('1on1'); });
    }

    /* 输入框（群聊） + @ 检测 */
    if (dom.groupInput) {
      dom.groupInput.addEventListener('input', function () {
        onInputScrollHeight(dom.groupInput);
        updateSendState(dom.groupInput, dom.groupSend);
        detectMention();
      });
      dom.groupInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage('group');
        }
      });
      dom.groupInput.addEventListener('blur', function () {
        setTimeout(closeMention, 150);
      });
    }
    if (dom.groupSend) {
      dom.groupSend.addEventListener('click', function () { sendMessage('group'); });
    }

    /* scrim 关闭 */
    dom.scrim.addEventListener('click', closeContextMenu);

    /* 事件委托：根级路由（顶栏按钮、行按钮、AI 按键、附件菜单项 等） */
    dom.root.addEventListener('click', onRootClick);

    /* 长按好友行（绑定在 list view，便于 stopPropagation） */
    bindLongPress(dom.friendsBody);

    /* 初始化禁用发送键 */
    updateSendState(dom.chatInput, dom.chatSend);
    updateSendState(dom.groupInput, dom.groupSend);
  }

  function bindLongPress(host) {
    if (!host) return;
    host.addEventListener('touchstart', function (e) {
      var row = e.target.closest('.fr-row'); if (!row) return;
      var uid = row.getAttribute('data-uid');
      if (!uid) return;
      longPressTarget = row;
      longPressTimer = setTimeout(function () {
        if (longPressTarget === row) {
          e.preventDefault();
          openContextMenu(uid);
          if (navigator.vibrate) navigator.vibrate(10);
        }
      }, 550);
    }, { passive: true });
    host.addEventListener('touchend', function () {
      clearTimeout(longPressTimer);
      longPressTarget = null;
    });
    host.addEventListener('touchmove', function () {
      clearTimeout(longPressTimer);
      longPressTarget = null;
    });
    /* 桌面端右键 */
    host.addEventListener('contextmenu', function (e) {
      var row = e.target.closest('.fr-row');
      if (!row) return;
      var uid = row.getAttribute('data-uid'); if (!uid) return;
      e.preventDefault();
      openContextMenu(uid);
    });
  }

  function detectMention() {
    if (!dom.groupInput) return;
    var val = dom.groupInput.value;
    var caret = dom.groupInput.selectionStart || val.length;
    var left = val.slice(0, caret);
    var match = left.match(/@([^\s@]*)$/);
    if (match) {
      openMention(match[1]);
    } else {
      closeMention();
    }
  }

  /* 轻量 toast：friends 模块自带（无独立 toast 元素，动态创建） */
  var frToastEl = null, frToastTimer = null;
  function toast(msg) {
    if (!dom.root) return;
    if (!frToastEl) {
      frToastEl = document.createElement('div');
      frToastEl.className = 'fr-toast';
      dom.root.appendChild(frToastEl);
    }
    frToastEl.textContent = msg;
    frToastEl.classList.add('is-show');
    if (frToastTimer) clearTimeout(frToastTimer);
    frToastTimer = setTimeout(function () { frToastEl.classList.remove('is-show'); }, 2000);
  }

  function onRootClick(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    var ctx = btn.getAttribute('data-ctx');

    switch (action) {
      case 'back-list':
        showView('list');
        closeAttachMenu('1on1'); closeAttachMenu('group'); closeMention();
        break;
      case 'toggle-ai':
        toggleAI(ctx || '1on1');
        break;
      case 'peer-more':
        if (state.peerId) openContextMenu(state.peerId);
        break;
      case 'group-settings': {
        /* 群设置：demo 占位（避免误用残留 peerId 打开错误好友菜单） */
        var g = currentGroup();
        toast(g ? ('群「' + g.name + '」设置（演示）：群名 · 公告 · 成员') : '群设置（演示）');
        break;
      }
      case 'notify':
        toast('通知（演示）：3 条新互动 · 1 个争论邀请');
        break;
      case 'open-chat':
      case 'open-profile':
        openChat(btn.getAttribute('data-uid'));
        break;
      case 'open-group':
        openGroup(btn.getAttribute('data-gid'));
        break;
      case 'follow': {
        e.stopPropagation();
        e.preventDefault();
        btn.classList.toggle('is-following');
        btn.innerHTML = btn.classList.contains('is-following') ? IC.spark() + '已关注' : IC.plus() + '关注';
        break;
      }
      case 'open-note': {
        /* 笔记卡：demo 不跳转，仅关回列表（避免触碰 notebook） */
        flashNoteCard(btn);
        break;
      }
      case 'join-debate':
        flashDebateCard(btn);
        break;
      case 'fr-chat-attach':
      case 'toggle-attach':
        toggleAttachMenu(ctx || '1on1');
        break;
      case 'attach-note':
        attachKind('note', ctx || '1on1');
        break;
      case 'attach-debate':
        attachKind('debate', ctx || '1on1');
        break;
      case 'attach-image':
        attachKind('image', ctx || '1on1');
        break;
      case 'remove-attach': {
        var chip = btn.closest('.fr-attach-chip');
        if (chip && chip.parentNode) chip.parentNode.removeChild(chip);
        break;
      }
      case 'add-shared-note':
        flashSharedAdd(btn);
        break;
      case 'pick-mention': {
        var uid = btn.getAttribute('data-uid');
        var u = userById(uid);
        if (u && dom.groupInput) {
          var v = dom.groupInput.value;
          var c = dom.groupInput.selectionStart || v.length;
          var left = v.slice(0, c).replace(/@([^\s@]*)$/, '@' + u.name + ' ');
          var right = v.slice(c);
          dom.groupInput.value = left + right;
          updateSendState(dom.groupInput, dom.groupSend);
          dom.groupInput.focus();
          var pos = left.length;
          try { dom.groupInput.setSelectionRange(pos, pos); } catch (_) {}
        }
        closeMention();
        break;
      }
      case 'ctx-remark':
      case 'ctx-pin':
      case 'ctx-mute':
      case 'ctx-delete':
      case 'close-context':
        closeContextMenu();
        break;
      default:
        break;
    }
  }

  function flashNoteCard(node) {
    node.style.transition = 'transform 160ms';
    node.style.transform = 'scale(0.97)';
    setTimeout(function () { node.style.transform = ''; }, 160);
  }
  function flashDebateCard(node) {
    var card = node.closest('.fr-debatecard') || node;
    card.style.transition = 'transform 160ms';
    card.style.transform = 'scale(0.97)';
    setTimeout(function () { card.style.transform = ''; }, 160);
  }
  function flashSharedAdd(node) {
    node.style.transition = 'transform 160ms';
    node.style.transform = 'rotate(90deg)';
    setTimeout(function () { node.style.transform = ''; }, 200);
  }

  /* ----------------------------- 添加好友子页 ----------------------------- */

  function openAdd() {
    state.search.add = '';
    if (dom.searchAdd) dom.searchAdd.value = '';
    /* 顶栏返回 + 标题 */
    renderAddList();
    showView('add');
  }

  /* ----------------------------- 初始化 ----------------------------- */

  function buildAttachMenu(items, ctx) {
    return items.map(function (it) {
      return '<button class="fr-attach-menu__item ' + it.cls + '" data-action="' + it.action + '" data-ctx="' + ctx + '">'
        + it.icon + '<span>' + it.label + '</span></button>';
    }).join('');
  }

  function init() {
    cacheDom();
    if (!dom.root) return;

    /* 给输入栏预先填充附件菜单 DOM（供 1对1 / 群聊共用） */
    if (dom.chatAttachMenu && !dom.chatAttachMenu.hasChildNodes()) {
      dom.chatAttachMenu.innerHTML = buildAttachMenu([
        { cls: 'fr-attach-menu__item--note',  action: 'attach-note',  icon: IC.note(),  label: '分享笔记' },
        { cls: 'fr-attach-menu__item--debate',action: 'attach-debate',icon: IC.vs(),   label: '发起争论' },
        { cls: 'fr-attach-menu__item--image', action: 'attach-image', icon: IC.image(), label: '发送图片' }
      ], '1on1');
    }
    if (dom.groupAttachMenu && !dom.groupAttachMenu.hasChildNodes()) {
      dom.groupAttachMenu.innerHTML = buildAttachMenu([
        { cls: 'fr-attach-menu__item--note',  action: 'attach-note',  icon: IC.note(),  label: '分享笔记' },
        { cls: 'fr-attach-menu__item--debate',action: 'attach-debate',icon: IC.vs(),   label: '发起争论' },
        { cls: 'fr-attach-menu__item--image', action: 'attach-image', icon: IC.image(), label: '发送图片' }
      ], 'group');
    }

    /* segment 默认好友 */
    setTab('friends');
    renderFriendsList();
    renderGroupsList();
    renderAddList();
    showView('list');

    bindGlobal();
  }

  /* ----------------------------- 暴露 ----------------------------- */

  window.ZX_FRIENDS = {
    init: init,
    state: state,
    openChat: openChat,
    openGroup: openGroup,
    openAdd: openAdd,
    showList: function () { showView('list'); }
  };

  /* 闭环：切回好友页时刷新伙伴列表（让新关注的作者出现） */
  window.addEventListener('zx-tab-active', function (e) {
    if (e.detail && e.detail.tab === 'friends') {
      try { renderFriendsList(); } catch (x) {}
    }
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

 *   姿态 1 · 旁观插话 —— 写作停顿 > 2s，段落下方出现林的鎏金建议气泡
 *   姿态 2 · 肩并肩共写 —— 接受建议 / 长按 ✦ / 底栏 ✦，林以鎏金差异色输出
 *   姿态 3 · 按需召唤 —— 选中文字 → 行内浮动工具栏 [B][I][✦ 问林] → 行内对话框
 * 设计语言：墨韵 · 星图（朱砂 CTA / 黛青链接 / 鎏金 AI / 赤陶警示）

  function renderBlocks() {

    if (b.type === 'code') {

  function outlineNodeHtml(node) {
    var hasChildren = node.children && node.children.length;

      ? '<div class="ne-node__children">' + node.children.map(outlineNodeHtml).join('') + '</div>'

  function findNode(id, node, parent, idx) {
    node = node || state.outline;
    if (node.id === id) return { node: node, parent: parent, idx: idx };
    if (node.children) {
      for (var i = 0; i < node.children.length; i++) {
        var r = findNode(id, node.children[i], node, i);
        if (r) return r;
      }
    }
    return null;
  }

  function suggestHtml(text) {
    return '<div class="ne-suggest" data-ne-suggest>' +
      '<div class="ne-suggest__head"><span class="ne-suggest__ava">' + IC.spark(13) + '</span><span class="ne-suggest__label">林 · 在旁观</span></div>' +

      '<button class="ne-suggest__btn ne-suggest__btn--ghost" data-action="ne-suggest-dismiss" aria-label="忽略">' + IC.close(14) + '</button>' +
      '</div>' +
      '</div>';
  }

  function maybeShowSuggest() {
    if (!state.suggestOn || state.template !== 'doc') return;
    if (state.suggestActive) return;
    var body = $('[data-ne-docbody]');
    if (!body) return;
    var block = currentEditingBlock();
    if (!block) block = body.lastElementChild || body;
    removeSuggest();
    var text = SUGGEST_POOL[Math.floor(Math.random() * SUGGEST_POOL.length)];
    var node = el('div');
    node.innerHTML = suggestHtml(text);
    var suggest = node.firstElementChild;
    if (block.parentNode === body) {
      block.parentNode.insertBefore(suggest, block.nextSibling);
    } else {
      body.appendChild(suggest);
    }
    state.suggestActive = true;
  }

  function currentEditingBlock() {
    var sel = window.getSelection();
    if (!sel || !sel.anchorNode) return null;
    var n = sel.anchorNode;
    if (n.nodeType === 3) n = n.parentNode;
    while (n && n !== document) {
      if (n.parentNode && n.parentNode.classList && n.parentNode.classList.contains('ne-doc__body')) return n;
      n = n.parentNode;
    }
    return null;
  }

  function removeSuggest() {
    $all('[data-ne-suggest]').forEach(function (s) { if (s.parentNode) s.parentNode.removeChild(s); });
    state.suggestActive = false;
  }

  function scheduleSuggest() {
    if (state.suggestTimer) clearTimeout(state.suggestTimer);
    removeSuggest();
    if (!state.suggestOn || state.template !== 'doc') return;
    state.suggestTimer = setTimeout(function () { maybeShowSuggest(); }, 2000);
  }

  /* =====================================================================
   * AI 姿态 2：肩并肩共写（鎏金差异色输出）
   * ===================================================================*/
  function insertCowrite(mode) {
    if (state.template !== 'doc') {
      toast('肩并肩共写在「纯文档」模板下体验最佳，切过去试试 ✦');
      return;
    }
    var main = $('.ne-main');
    if (!main) return;
    removeSuggest();
    var anchor = $('[data-ne-docbody]');
    if (!anchor) return;

    var pool = mode === 'rewrite' ? COWRITE_REWRITE : COWRITE_EXPAND;
    var item = pool[Math.floor(Math.random() * pool.length)];

    var wrap = el('div');
    wrap.innerHTML = cowriteHtml(mode, item, true);
    var node = wrap.firstElementChild;

    var lastP = anchor.lastElementChild;
    if (lastP) anchor.insertBefore(node, lastP.nextSibling); else anchor.appendChild(node);
    if (node.scrollIntoView) node.scrollIntoView({ behavior: 'smooth', block: 'center' });

    /* 1.1s 后由「正在写」切到正文 */
    setTimeout(function () {
      var typing = $('[data-ne-cowrite-typing]', node);
      var text = $('[data-ne-cowrite-text]', node);
      var actions = $('[data-ne-cowrite-actions]', node);
      if (typing) typing.style.display = 'none';
      if (text) text.style.display = '';
      if (actions) actions.style.display = '';
    }, 1100);
  }

  function cowriteHtml(mode, item, showTypingFirst) {
    var diffHtml;
    if (mode === 'rewrite') {
      diffHtml = '<span class="ne-cowrite__del">' + escapeHtml(item.del) + '</span> <span class="ne-cowrite__ins">' + escapeHtml(item.ins) + '</span>';
    } else {
      diffHtml = '<span class="ne-cowrite__ins">' + escapeHtml(item.ins) + '</span>';
    }
    var modeLabel = mode === 'rewrite' ? '重写' : '展开续写';
    return '<div class="ne-cowrite" data-ne-cowrite>' +
      '<div class="ne-cowrite__head"><span class="ne-cowrite__tag">' + IC.spark(11) + ' 林 · 共写</span><span class="ne-cowrite__mode">' + modeLabel + '</span></div>' +
      '<p class="ne-cowrite__text" data-ne-cowrite-text style="display:' + (showTypingFirst ? 'none' : '') + '">' + diffHtml + '</p>' +
      '<div class="ne-cowrite__typing" data-ne-cowrite-typing style="display:' + (showTypingFirst ? '' : 'none') + '"><span>林正在写</span><span class="ne-cowrite__dots"><span></span><span></span><span></span></span></div>' +
      '<div class="ne-cowrite__actions" data-ne-cowrite-actions style="display:' + (showTypingFirst ? 'none' : '') + '">' +
      '<button class="ne-cowrite__btn ne-cowrite__btn--accept" data-action="ne-cowrite-accept">' + IC.check(14) + ' 接受</button>' +
      '<button class="ne-cowrite__btn ne-cowrite__btn--reject" data-action="ne-cowrite-reject">拒绝</button>' +
      '<button class="ne-cowrite__btn ne-cowrite__btn--refine" data-action="ne-cowrite-refine">' + IC.refresh(14) + ' 再改改</button>' +
      '</div>' +
      '</div>';
  }

  function acceptCowrite(btn) {
    var card = btn.closest('[data-ne-cowrite]');
    if (!card) return;
    /* 把 ins 文本落成普通段落 */
    var ins = $('.ne-cowrite__ins', card);
    var text = ins ? ins.textContent : '';
    var p = '<p>' + escapeHtml(text) + '</p>';
    var body = $('[data-ne-docbody]');
    if (body) {
      body.insertAdjacentHTML('beforeend', p);
    }
    if (card.parentNode) card.parentNode.removeChild(card);
    updateWordCount();
    toast('已采纳林的续写', true);
  }
  function rejectCowrite(btn) {
    var card = btn.closest('[data-ne-cowrite]');
    if (card && card.parentNode) card.parentNode.removeChild(card);
  }
  function refineCowrite(btn) {
    var card = btn.closest('[data-ne-cowrite]');
    if (!card) return;
    /* 重新换一条差异内容 */
    var mode = $('.ne-cowrite__mode', card);
    var isRewrite = mode && /重写/.test(mode.textContent);
    var pool = isRewrite ? COWRITE_REWRITE : COWRITE_EXPAND;
    var item = pool[Math.floor(Math.random() * pool.length)];
    var diffHtml = isRewrite
      ? '<span class="ne-cowrite__del">' + escapeHtml(item.del) + '</span> <span class="ne-cowrite__ins">' + escapeHtml(item.ins) + '</span>'
      : '<span class="ne-cowrite__ins">' + escapeHtml(item.ins) + '</span>';
    var text = $('[data-ne-cowrite-text]', card);
    if (text) text.innerHTML = diffHtml;
  }

  /* =====================================================================
   * AI 姿态 3：按需召唤（行内浮动工具栏 + 行内对话框）
   * ===================================================================*/
  function onSelectionChange() {
    if (!state.open) return;
    var tb = $('[data-ne-inlinetb]');
    if (!tb) return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideInlineToolbar(); return; }
    var range = sel.getRangeAt(0);
    /* 仅当选区在 doc 正文 / reader 正文内时显示 */
    var inDoc = rangeIntersectsEl(range, $('[data-ne-docbody]')) || rangeIntersectsEl(range, $('[data-ne-readertext]'));
    if (!inDoc) { hideInlineToolbar(); return; }
    state.inlineSelText = sel.toString();
    var rect = range.getBoundingClientRect();
    var main = $('.ne-main');
    if (!main) return;
    var mainRect = main.getBoundingClientRect();
    var left = rect.left - mainRect.left + rect.width / 2 - 70;
    var top = rect.top - mainRect.top - 46;
    left = clamp(left, 4, mainRect.width - 144);
    top = Math.max(4, top);
    tb.style.left = left + 'px';
    tb.style.top = top + 'px';
    tb.hidden = false;
  }
  function rangeIntersectsEl(range, elNode) {
    if (!elNode) return false;
    var elRange = document.createRange();
    elRange.selectNodeContents(elNode);
    return range.compareBoundaryPoints(Range.END_TO_START, elRange) <= 0 &&
           range.compareBoundaryPoints(Range.START_TO_END, elRange) >= 0;
  }
  function hideInlineToolbar() { var tb = $('[data-ne-inlinetb]'); if (tb) tb.hidden = true; }

  function openInlineChat() {
    var chat = $('[data-ne-inlinechat]');
    if (!chat) return;
    var main = $('.ne-main');
    var selText = state.inlineSelText || '（未选中文本）';
    state.inlineChatMsgs = [{ role: 'ai', text: '我看了你选中的内容。要展开、润色、找来源，还是关联其它笔记？', time: nowTime() }];
    chat.innerHTML =
      '<div class="ne-inline-chat__head">' +
      '<span class="ne-inline-chat__ava">' + IC.spark(13) + '</span>' +
      '<span class="ne-inline-chat__title">问林</span>' +
      '<button class="ne-inline-chat__close" data-action="ne-inline-close" aria-label="关闭">' + IC.close(16) + '</button>' +
      '</div>' +
      '<div class="ne-inline-chat__quote">' + escapeHtml(selText) + '</div>' +
      '<div class="ne-inline-chat__msgs" data-ne-chatmsgs>' + renderInlineMsgs() + '</div>' +
      '<div class="ne-inline-chat__input-row">' +
      '<input class="ne-inline-chat__input" data-ne-chatinput placeholder="追问林…" aria-label="追问">' +
      '<button class="ne-inline-chat__send" data-action="ne-inline-send" aria-label="发送">' + IC.send(16) + '</button>' +
      '</div>' +
      '<div class="ne-inline-chat__apply">' +
      '<button class="ne-cowrite__btn ne-cowrite__btn--accept" data-action="ne-inline-apply">' + IC.check(14) + ' 应用到选中</button>' +
      '</div>';
    chat.hidden = false;
    chat.style.top = '88px';
    hideInlineToolbar();
    openScrim();
    var input = $('[data-ne-chatinput]');
    if (input) setTimeout(function () { input.focus(); }, 60);
  }
  function closeInlineChat() { var chat = $('[data-ne-inlinechat]'); if (chat) { chat.hidden = true; chat.innerHTML = ''; } }
  function renderInlineMsgs() {
    return state.inlineChatMsgs.map(function (m) {
      return '<div class="ne-inline-chat__msg ne-inline-chat__msg--' + (m.role === 'ai' ? 'ai' : 'user') + '">' + escapeHtml(m.text) + '</div>';
    }).join('');
  }
  function sendInline() {
    var input = $('[data-ne-chatinput]');
    if (!input) return;
    var text = input.value.trim();
    if (!text) return;
    state.inlineChatMsgs.push({ role: 'user', text: text, time: nowTime() });
    input.value = '';
    renderInlineBox();
    setTimeout(function () {
      state.inlineChatMsgs.push({ role: 'ai', text: mockInlineReply(text + ' ' + state.inlineSelText), time: nowTime() });
      renderInlineBox();
    }, 700);
  }
  function renderInlineBox() {
    var box = $('[data-ne-chatmsgs]');
    if (box) { box.innerHTML = renderInlineMsgs(); box.scrollTop = box.scrollHeight; }
  }
  function applyInlineToSelection() {
    var last = state.inlineChatMsgs.filter(function (m) { return m.role === 'ai'; }).pop();
    if (!last) { toast('林还没有可应用的输出'); return; }
    var sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.rangeCount) {
      try { sel.deleteFromDocument(); sel.getRangeAt(0).insertNode(document.createTextNode(last.text)); }
      catch (e) { toast('已生成，请手动粘贴'); }
    } else {
      toast('已生成内容：' + last.text.slice(0, 16) + '…');
    }
    closeInlineChat();
    toast('已应用到选中', true);
  }

  /* =====================================================================

   * ===================================================================*/
  var SLASH_ITEMS = [
    { key: 'h2', name: '标题', hint: '##', icon: IC.type },

  function openLinkSearch(query, anchor) {

    menu.innerHTML = notes.map(function (n, i) {
      return '<button class="ne-linksearch__item' + (i === 0 ? ' is-active' : '') + '" data-action="ne-link-pick" data-title="' + escapeHtml(n.title) + '">' +

  function insertWikiLink(title) {

  function positionNear(menu, anchor, width) {

    menu.style.minWidth = (width || 180) + 'px';
    if (rect) {
      var left = rect.left - mainRect.left;
      var top = rect.bottom - mainRect.top + 6;
      menu.style.left = clamp(left, 4, mainRect.width - (width || 180) - 8) + 'px';
      menu.style.top = top + 'px';
    } else {
      menu.style.left = '16px';
      menu.style.top = '80px';
    }
  }

    $all('.ne-slash.is-open, .ne-linksearch.is-open').forEach(function (m) { m.classList.remove('is-open'); });
    var tm = $('[data-ne-typemenu]'); if (tm) tm.classList.remove('is-open');
    var am = $('[data-ne-addmenu]'); if (am) am.classList.remove('is-open');
    var ap = $('[data-ne-aipanel]'); if (ap) ap.classList.remove('is-open');

  /* =====================================================================
   * Toast（复用 notebook 的 [data-toast]）
   * ===================================================================*/
  var toastTimer = null;
  function toast(msg, withSpark) {
    var t = document.querySelector('[data-toast]');
    if (!t) return;
    t.classList.remove('nb-toast--undo');
    t.innerHTML = (withSpark ? '<span class="nb-toast__spark">' + IC.spark(14) + '</span>' : '') + '<span>' + escapeHtml(msg) + '</span>';
    t.classList.add('is-show');

  /* =====================================================================
   * 遮罩
   * ===================================================================*/
  function openScrim() { var s = $('[data-ne-scrim]'); if (s) s.classList.add('is-open'); }
  function closeScrim() { var s = $('[data-ne-scrim]'); if (s) s.classList.remove('is-open'); }

  /* =====================================================================
   * 字数统计 / 重命名
   * ===================================================================*/
  function updateWordCount() {
    var body = $('[data-ne-docbody]');
    var wc = $('[data-ne-wordcount]');
    if (!body || !wc) return;
    var n = (body.textContent || '').replace(/\s+/g, '').length;
    wc.textContent = n + ' 字';
  }

  function enterRename(btn) {
    var titleEl = $('[data-ne-title]', btn);
    if (!titleEl) return;
    var input = el('input');
    input.className = 'ne-topbar__title-input';
    input.value = state.title;
    input.setAttribute('aria-label', '笔记标题');
    btn.replaceChild(input, titleEl);
    input.focus();
    input.select();
    function commit() {
      state.title = input.value.trim() || '无标题笔记';
      var newTitle = el('span', 'ne-topbar__title', escapeHtml(state.title));
      newTitle.setAttribute('data-ne-title', '');
      if (input.parentNode) btn.replaceChild(newTitle, input);
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
  }

  /* =====================================================================
   * doc 正文：input 监听（停顿建议 / 斜杠 / 双链 / 字数）
   * ===================================================================*/
  function onDocInput() {
    updateWordCount();
    scheduleSuggest();
    detectSlashOrLink();
  }

  function detectSlashOrLink() {
    var body = $('[data-ne-docbody]');
    if (!body) return;
    var sel = window.getSelection();
    if (!sel || !sel.anchorNode) return;
    var node = sel.anchorNode;
    var text = node.nodeType === 3 ? node.textContent.slice(0, sel.anchorOffset) : '';
    /* 斜杠：行首或空格后紧接 / */
    var slash = text.match(/(?:^|\s)\/([^/\s]{0,12})$/);
    var lk = text.match(/\[\[([^\]]{0,16})$/);
    closeAllMenus();
    if (slash) {
      openSlashMenu(getCaretAnchor());
    } else if (lk) {
      openLinkSearch(lk[1], getCaretAnchor());
    }
  }

  function getCaretAnchor() {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return null;
    var range = sel.getRangeAt(0).cloneRange();
    try { range.collapse(true); var rect = range.getClientRects()[0] || range.getBoundingClientRect(); return { getBoundingClientRect: function () { return rect; } }; }
    catch (e) { return null; }
  }

  /* =====================================================================
   * canvas 交互：平移 / 缩放 / 选块 / 拖块 / 连线 / 长按加块
   * ===================================================================*/
  function bindCanvas() {
    var canvas = $('[data-ne-canvas]');
    if (!canvas || canvas.__zxCanvasBound) { applyCanvasTransform(); renderBlocks(); return; }
    canvas.__zxCanvasBound = true;

    var pan = null;
    var blockDrag = null;
    var linking = null;
    var pressTimer = null;
    var pressStart = null;
    var moved = false;

    function pt(e) {
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    function toCanvasCoord(clientX, clientY) {
      var r = canvas.getBoundingClientRect();
      return { x: (clientX - r.left - state.canvas.panX) / state.canvas.scale, y: (clientY - r.top - state.canvas.panY) / state.canvas.scale };
    }

    function down(e) {
      var portEl = e.target.closest('[data-port]');
      if (portEl) {
        linking = { from: parseInt(portEl.getAttribute('data-block'), 10) };
        canvas.classList.add('is-linking');
        if (e.cancelable) e.preventDefault();
        return;
      }
      var blockEl = e.target.closest('[data-block]');
      if (blockEl && !e.target.closest('.ne-block__content[contenteditable]')) {
        var id = parseInt(blockEl.getAttribute('data-block'), 10);
        selectBlock(id);
        var b = blockById(id);
        var p = pt(e);
        blockDrag = { id: id, startX: p.x, startY: p.y, ox: b.x, oy: b.y };
        if (e.cancelable) e.preventDefault();
        return;
      }
      /* 空白处：平移 + 长按加块 */
      var p2 = pt(e);
      pressStart = p2; moved = false;
      pan = { x: p2.x, y: p2.y, panX: state.canvas.panX, panY: state.canvas.panY };
      canvas.classList.add('is-panning');
      if (pressTimer) clearTimeout(pressTimer);
      pressTimer = setTimeout(function () {
        if (!moved && pressStart) {
          var c = toCanvasCoord(pressStart.x, pressStart.y);
          openCanvasAddMenu(c.x, c.y);
        }
      }, 500);
    }
    function move(e) {
      var p = pt(e);
      if (linking) { if (e.cancelable) e.preventDefault(); return; }
      if (blockDrag) {
        var b = blockById(blockDrag.id);
        if (b) {
          b.x = Math.round(blockDrag.ox + (p.x - blockDrag.startX) / state.canvas.scale);
          b.y = Math.round(blockDrag.oy + (p.y - blockDrag.startY) / state.canvas.scale);
          var elDom = canvas.querySelector('[data-block="' + b.id + '"]');
          if (elDom) { elDom.style.left = b.x + 'px'; elDom.style.top = b.y + 'px'; }
          renderLinks();
        }
        if (e.cancelable) e.preventDefault();
        return;
      }
      /* 双指捏合缩放 */
      if (pan && e.touches && e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        var d = Math.hypot(dx, dy);
        if (pan.pinchD == null) pan.pinchD = d;
        else { zoomBy((d - pan.pinchD) / 240); pan.pinchD = d; }
        if (e.cancelable) e.preventDefault();
        return;
      }
      if (pan) {
        if (pressStart && (Math.abs(p.x - pressStart.x) > 8 || Math.abs(p.y - pressStart.y) > 8)) {
          moved = true;
          if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        }
        state.canvas.panX = pan.panX + (p.x - pan.x);
        state.canvas.panY = pan.panY + (p.y - pan.y);
        applyCanvasTransform();
        if (e.cancelable) e.preventDefault();
      }
    }
    function up(e) {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
      if (linking) {
        var p = pt(e);
        var target = document.elementFromPoint(p.x, p.y);
        var tb = target ? target.closest('[data-block]') : null;
        if (tb) {
          var toId = parseInt(tb.getAttribute('data-block'), 10);
          if (toId !== linking.from && !linkExists(linking.from, toId)) {
            state.canvas.links.push({ from: linking.from, to: toId });
            renderLinks();
          }
        }
        linking = null;
        canvas.classList.remove('is-linking');
      }
      blockDrag = null;
      if (pan) { pan = null; canvas.classList.remove('is-panning'); }
      pressStart = null;
    }
    function wheel(e) {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      var delta = e.deltaY > 0 ? -0.1 : 0.1;
      zoomBy(delta);
    }

    canvas.addEventListener('touchstart', down, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', up);
    canvas.addEventListener('mousedown', down);
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
    canvas.addEventListener('wheel', wheel, { passive: false });

    applyCanvasTransform();
    renderBlocks();
  }

  function blockById(id) { for (var i = 0; i < state.canvas.blocks.length; i++) { if (state.canvas.blocks[i].id === id) return state.canvas.blocks[i]; } return null; }
  function linkExists(a, b) { return state.canvas.links.some(function (l) { return (l.from === a && l.to === b) || (l.from === b && l.to === a); }); }
  function selectBlock(id) {
    state.canvas.selected = id;
    $all('[data-block]').forEach(function (b) { b.classList.toggle('is-selected', parseInt(b.getAttribute('data-block'), 10) === id); });
  }
  function zoomBy(delta) {
    state.canvas.scale = clamp(+(state.canvas.scale + delta).toFixed(2), 0.4, 2.4);

  /* ----------------------------- 思维导图：布局算法 -----------------------------
   * 径向布局：中心节点在原点；一级主题等角分布在半径 R1 的圆上（从正上方起逆时针）；
   * 每个一级主题的二级子节点沿「中心→主题」方向的扇形向外展开，分布在半径 R2。
   * 最后统一偏移到正坐标系，得到每个节点在世界中的绝对坐标。
   * -------------------------------------------------------------------------- */

  function layoutMindmap(data) {
    var branches = data.branches || [];
    var N = branches.length;
    var nodes = [];
    var edges = [];
    var byId = {};

    var center = { id: 'center', level: 'center', name: data.center.name, x: 0, y: 0 };
    nodes.push(center); byId.center = center;

    var R1 = 132;
    var R2 = 248;
    var fan = Math.PI / 2.6;

    branches.forEach(function (b, i) {
      var angle = (2 * Math.PI / N) * i - Math.PI / 2;
      var px = R1 * Math.cos(angle);
      var py = R1 * Math.sin(angle);
      var pId = 'p' + i;
      var pNode = { id: pId, level: 'primary', name: b.topic, x: px, y: py, parent: 'center', topic: b.topic, childIds: [] };
      nodes.push(pNode); byId[pId] = pNode;
      edges.push({ from: 'center', to: pId, level: 'l1' });

      var kids = b.children || [];
      var M = kids.length;
      kids.forEach(function (k, j) {
        var ca;
        if (M === 1) ca = angle;
        else ca = angle - fan / 2 + (fan * j / (M - 1));
        var kx = R2 * Math.cos(ca);
        var ky = R2 * Math.sin(ca);
        var sId = pId + '_s' + j;
        var sNode = { id: sId, level: 'secondary', name: k, x: kx, y: ky, parent: pId, topic: b.topic };
        nodes.push(sNode); byId[sId] = sNode;
        pNode.childIds.push(sId);
        edges.push({ from: pId, to: sId, level: 'l2' });
      });
    });

    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(function (n) {
      if (n.x < minX) minX = n.x; if (n.y < minY) minY = n.y;
      if (n.x > maxX) maxX = n.x; if (n.y > maxY) maxY = n.y;
    });
    var pad = 86;
    var offX = -minX + pad;
    var offY = -minY + pad;
    var worldW = (maxX - minX) + pad * 2;
    var worldH = (maxY - minY) + pad * 2;
    nodes.forEach(function (n) { n.sx = n.x + offX; n.sy = n.y + offY; });

    return {
      nodes: nodes, edges: edges, byId: byId,
      worldW: worldW, worldH: worldH,
      centerWX: center.sx, centerWY: center.sy
    };
  }

  function edgePath(from, to) {
    var mx = (from.sx + to.sx) / 2;
    return 'M' + from.sx + ' ' + from.sy +
      ' C ' + mx + ' ' + from.sy + ', ' + mx + ' ' + to.sy + ', ' + to.sx + ' ' + to.sy;
  }

  /* ----------------------------- 渲染：思维导图视图 ----------------------------- */

  function renderMindmapView() {
    if (!world) return;
    mmLayout = layoutMindmap(MOCK_MINDMAP);

    var svgHtml = '<svg class="ov-mm-edges" width="' + mmLayout.worldW + '" height="' + mmLayout.worldH + '" viewBox="0 0 ' + mmLayout.worldW + ' ' + mmLayout.worldH + '">';
    mmLayout.edges.forEach(function (e) {
      var from = mmLayout.byId[e.from], to = mmLayout.byId[e.to];
      if (!from || !to) return;
      var cls = 'ov-mm-edge' + (e.level === 'l1' ? ' ov-mm-edge--l1' : '');
      svgHtml += '<path class="' + cls + '" d="' + edgePath(from, to) + '" data-from="' + e.from + '" data-to="' + e.to + '"></path>';
    });
    svgHtml += '</svg>';

    var sizeMap = { center: 48, primary: 36, secondary: 28 };
    var gapMap = { center: 34, primary: 27, secondary: 21 };
    var nodesHtml = '';
    mmLayout.nodes.forEach(function (n) {
      var size = sizeMap[n.level];
      var left = n.sx - size / 2;
      var top = n.sy - size / 2;
      var inner = '';
      if (n.level === 'center') inner = escapeHtml(n.name);
      else if (n.level === 'primary') inner = escapeHtml(n.name.slice(0, 2));
      nodesHtml += '<div class="ov-mm-node ov-mm-node--' + n.level + '" data-node="' + escapeHtml(n.id) + '" style="left:' + left + 'px;top:' + top + 'px;">' + inner + '</div>';
      nodesHtml += '<div class="ov-mm-label ov-mm-label--' + n.level + '" style="left:' + n.sx + 'px;top:' + (n.sy + gapMap[n.level]) + 'px;">' + escapeHtml(n.name) + '</div>';
    });

    world.innerHTML = svgHtml + nodesHtml;

    requestAnimationFrame(function () {
      requestAnimationFrame(centerMindmap);
    });
  }

  /* ----------------------------- 思维导图：变换 / 手势 ----------------------------- */

  function applyMMTransform() {
    if (!world) return;
    var m = state.mm;
    world.style.transform = 'translate(' + m.tx + 'px,' + m.ty + 'px) scale(' + m.scale + ')';
  }

  function centerMindmap() {
    var canvas = $('[data-ov-mm-canvas]', root);
    if (!canvas || !mmLayout) return;
    var rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    state.mm.scale = 1;
    state.mm.tx = rect.width / 2 - mmLayout.centerWX;
    state.mm.ty = rect.height / 2 - mmLayout.centerWY;
    applyMMTransform();
  }

  function zoomTo(ns, mx, my, oldScale) {
    if (!world) return;
    ns = clamp(ns, 0.4, 2.5);
    var wx = (mx - state.mm.tx) / oldScale;
    var wy = (my - state.mm.ty) / oldScale;
    state.mm.tx = mx - wx * ns;
    state.mm.ty = my - wy * ns;
    state.mm.scale = ns;
    applyMMTransform();
  }

  function zoomBy(factor) {
    var canvas = $('[data-ov-mm-canvas]', root);
    if (!canvas) return;
    var rect = canvas.getBoundingClientRect();
    zoomTo(state.mm.scale * factor, rect.width / 2, rect.height / 2, state.mm.scale);
  }

  function bindMindmapGestures() {
    var canvas = $('[data-ov-mm-canvas]', root);
    if (!canvas || canvas.__ovBound) return;
    canvas.__ovBound = true;

    var pressTimer = null, pressNode = null, pressX = 0, pressY = 0, moved = false;
    var pan = null, pinch = null, mouseDown = false;

    function nodeOf(target) { var n = target.closest ? target.closest('.ov-mm-node') : null; return n; }
    function clearPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } pressNode = null; }
    function startPress(node, x, y) {
      clearPress();
      pressNode = node; pressX = x; pressY = y; moved = false;
      pressTimer = setTimeout(function () {
        if (pressNode && !moved) { showNodeMenu(pressNode, pressX, pressY); clearPress(); }
      }, 500);
    }

    canvas.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        clearPress(); pan = null;
        var a = e.touches[0], b = e.touches[1];
        pinch = { dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), scale: state.mm.scale, mx: (a.clientX + b.clientX) / 2, my: (a.clientY + b.clientY) / 2 };
        return;
      }
      var t = e.touches[0];
      var node = nodeOf(e.target);
      if (node) { startPress(node, t.clientX, t.clientY); }
      else { pan = { x: t.clientX, y: t.clientY, tx: state.mm.tx, ty: state.mm.ty }; canvas.classList.add('is-dragging'); }
    }, { passive: true });

    canvas.addEventListener('touchmove', function (e) {
      if (pinch && e.touches.length === 2) {
        var a = e.touches[0], b = e.touches[1];
        var d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        var ns = clamp(pinch.scale * (d / pinch.dist), 0.4, 2.5);
        var rect = canvas.getBoundingClientRect();
        zoomTo(ns, pinch.mx - rect.left, pinch.my - rect.top, pinch.scale);
        if (e.cancelable) e.preventDefault();
        return;
      }
      if (pan && e.touches.length === 1) {
        var t = e.touches[0];
        state.mm.tx = pan.tx + (t.clientX - pan.x);
        state.mm.ty = pan.ty + (t.clientY - pan.y);
        applyMMTransform();
        if (e.cancelable) e.preventDefault();
        return;
      }
      if (pressNode && e.touches.length === 1) {
        var t2 = e.touches[0];
        if (Math.abs(t2.clientX - pressX) > 10 || Math.abs(t2.clientY - pressY) > 10) { moved = true; clearPress(); }
      }
    }, { passive: false });

    canvas.addEventListener('touchend', function (e) {
      if (pinch && e.touches.length < 2) pinch = null;
      if (pan && e.touches.length === 0) { pan = null; canvas.classList.remove('is-dragging'); }
      if (pressNode && !moved) { selectNode(pressNode); }
      clearPress();
    });

    canvas.addEventListener('mousedown', function (e) {
      mouseDown = true;
      var node = nodeOf(e.target);
      if (node) { startPress(node, e.clientX, e.clientY); }
      else { pan = { x: e.clientX, y: e.clientY, tx: state.mm.tx, ty: state.mm.ty, mouse: true }; canvas.classList.add('is-dragging'); }
    });
    document.addEventListener('mousemove', function (e) {
      if (!mouseDown) return;
      if (pan && pan.mouse) {
        state.mm.tx = pan.tx + (e.clientX - pan.x);
        state.mm.ty = pan.ty + (e.clientY - pan.y);
        applyMMTransform();
      }
      if (pressNode) {
        if (Math.abs(e.clientX - pressX) > 10 || Math.abs(e.clientY - pressY) > 10) { moved = true; clearPress(); }
      }
    });
    document.addEventListener('mouseup', function () {
      mouseDown = false;
      if (pan && pan.mouse) { pan = null; canvas.classList.remove('is-dragging'); }
      if (pressNode && !moved) { selectNode(pressNode); }
      clearPress();
    });

    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      var factor = e.deltaY < 0 ? 1.12 : 0.89;
      zoomTo(state.mm.scale * factor, e.clientX - rect.left, e.clientY - rect.top, state.mm.scale);
    }, { passive: false });
  }
