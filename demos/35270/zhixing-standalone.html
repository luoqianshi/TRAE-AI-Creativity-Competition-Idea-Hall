.sq-history__del svg { width: 13px; height: 13px; }
.sq-history__del:hover { background: rgba(14, 13, 11, 0.06); color: var(--ink-700); }

/* 搜索建议列表 */
.sq-suggest {
  display: flex;
  flex-direction: column;
}
.sq-suggest__item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 4px;
  border-bottom: 0.5px solid rgba(14, 13, 11, 0.06);
  cursor: pointer;
}
.sq-suggest__item svg { width: 16px; height: 16px; color: var(--neutral-500); flex-shrink: 0; }
.sq-suggest__text {
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--ink-900);
}
.sq-suggest__text em {
  font-style: normal;
  color: var(--cinnabar-500);
}
.sq-suggest__sub {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}

.sq-empty {
  padding: 32px 12px;
  text-align: center;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--neutral-500);
}

/* =======================================================================
 * 通知子页
 * =====================================================================*/
.sq-notif__top {
  flex-shrink: 0;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px 0 4px;
  background: var(--paper-50);
  border-bottom: 0.5px solid var(--paper-100);
}
.sq-notif__title {
  flex: 1;
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-900);
}

.sq-notif__body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0 96px;
}

.sq-notif__group-h {
  padding: 14px 18px 6px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  color: var(--neutral-500);
  letter-spacing: 0.06em;
}

.sq-notif__item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 18px;
  background: var(--paper-50);
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-zx);
}
.sq-notif__item:hover { background: var(--paper-100); }
.sq-notif__item .sq-avatar { width: 32px; height: 32px; font-size: 14px; margin-top: 2px; }
.sq-notif__main { flex: 1; min-width: 0; }
.sq-notif__row {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-900);
  line-height: 1.55;
}
.sq-notif__row strong { font-weight: 600; }
.sq-notif__preview {
  margin-top: 4px;
  padding: 6px 10px;
  background: var(--paper-100);
  border-radius: var(--r-2);
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--ink-700);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sq-notif__time {
  margin-top: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}
.sq-notif__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cinnabar-500);
  margin-top: 8px;
  flex-shrink: 0;
}
.sq-notif__dot.is-read { background: transparent; }

/* =======================================================================
 * Toast
 * =====================================================================*/
.sq-toast {
  position: absolute;
  left: 50%;
  bottom: 110px;
  transform: translateX(-50%) translateY(12px);
  background: var(--ink-900);
  color: var(--paper-50);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 8px 16px;
  border-radius: var(--r-full);
  box-shadow: var(--shadow-float);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
  z-index: 50;
  white-space: nowrap;
}
.sq-toast.is-show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* =======================================================================
 * reduced-motion 降级
 * =====================================================================*/
@media (prefers-reduced-motion: reduce) {
  .sq-view,
  .sq-xhs-card,
  .sq-zh-card,
  .sq-iconbtn,
  .sq-seg__btn,
  .sq-action,
  .sq-debate__tab,
  .sq-detail__foot,
  .sq-toast {
    transition: none !important;
    animation: none !important;
  }
}

/* ===== friends.css ===== */
/* =========================================================================
 * 「知行」App 本体 Demo —— Phase 4 / 好友页（friends.css）
 * -------------------------------------------------------------------------
 * 依赖：../demo/shared/components.css（tokens / typography / motion）+ ./shell.css
 * 视图栈：list（默认 · 好友列表 / 群聊列表 segment 切换）
 *         → chat（1对1 · 从右滑入）
 *         → group（群聊 · 从右滑入）
 *         → add（添加好友 · 从右滑入）
 * 设计语言：墨韵 · 星图（朱砂 CTA / 黛青 笔记卡·对方消息 / 鎏金 权威分 / 赤陶 @提及）
 * 哲学：好友是「知识伙伴」而非社交关系；聊天可唤起 AI 旁观（林可主动插话）
 * 约束：不用紫色渐变；不用通用聊天 app 的蓝色气泡；触控热区 ≥ 44×44
 * =======================================================================*/

.fr-root {
  position: relative;
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--paper-50);
}

/* =========================== 视图栈（与 nb-view 同构） =========================== */

.fr-view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--paper-50);
  opacity: 0;
  pointer-events: none;
  transition: transform var(--dur-base) var(--ease-zx),
              opacity var(--dur-fast) var(--ease-zx);
  will-change: transform, opacity;
}
.fr-view[data-axis="none"]  { transform: translateX(0); }
.fr-view[data-axis="right"] { transform: translateX(100%); }

.fr-view.is-on {
  opacity: 1 !important;
  pointer-events: auto;
  transform: translate(0, 0) !important;
  z-index: 2;
}
.fr-view.is-covered { opacity: 0.4; }

/* =========================== 顶栏（44px） =========================== */

.fr-topbar {
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding: 0 4px 0 6px;
  background: var(--paper-50);
  border-bottom: 1px solid transparent;
}

.fr-iconbtn {
  width: 44px;
  height: 44px;
  min-width: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--ink-700);
  cursor: pointer;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx);
}
.fr-iconbtn:hover { background: rgba(14, 13, 11, 0.06); }
.fr-iconbtn svg { width: 22px; height: 22px; display: block; }
.fr-iconbtn:focus-visible { outline: 2px solid var(--cinnabar-500); outline-offset: 2px; }

/* 通知红点 */
.fr-iconbtn__dot {
  position: absolute;
  top: 8px;
  right: 9px;
  min-width: 8px;
  height: 8px;
  padding: 0 2px;
  border-radius: var(--r-full);
  background: var(--cinnabar-500);
  border: 1.5px solid var(--paper-50);
}

/* 中间 segment：好友 / 群聊 */
.fr-segment {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 4px;
  margin: 0 4px;
  background: var(--paper-100);
  border-radius: var(--r-full);
}
.fr-segment__btn {
  flex: 1;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  color: var(--neutral-500);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx),
              color var(--dur-fast) var(--ease-zx),
              box-shadow var(--dur-fast) var(--ease-zx);
}
.fr-segment__btn.is-active {
  background: var(--paper-50);
  color: var(--ink-900);
  box-shadow: var(--shadow-paper);
}
.fr-segment__btn__count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--cinnabar-500);
}
.fr-segment__btn.is-active .fr-segment__btn__count { color: var(--cinnabar-500); }

/* =========================== 搜索框 =========================== */

.fr-tab {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.fr-search {
  flex-shrink: 0;
  padding: 8px 14px 6px;
  background: var(--paper-50);
}
.fr-search__field {
  position: relative;
  display: flex;
  align-items: center;
}
.fr-search__field svg {
  position: absolute;
  left: 12px;
  width: 16px;
  height: 16px;
  color: var(--neutral-500);
  pointer-events: none;
}
.fr-search__input {
  width: 100%;
  height: 36px;
  padding: 0 12px 0 34px;
  background: var(--paper-100);
  border: 1px solid transparent;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--ink-900);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-zx),
              background var(--dur-fast) var(--ease-zx);
}
.fr-search__input::placeholder { color: var(--neutral-500); }
.fr-search__input:focus {
  background: var(--paper-50);
  border-color: var(--cinnabar-500);
}

/* =========================== 列表通用 =========================== */

.fr-list {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 4px 0 calc(96px + env(safe-area-inset-bottom));
}
.fr-list::-webkit-scrollbar { width: 4px; }
.fr-list::-webkit-scrollbar-thumb { background: var(--paper-100); border-radius: 2px; }

.fr-section {
  margin-top: 12px;
}
.fr-section__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 16px 4px;
}
.fr-section__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--neutral-500);
  letter-spacing: 0.06em;
}
.fr-section__count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}

/* —— 好友行 —— */
.fr-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  min-height: 64px;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx);
  position: relative;
}
.fr-row:hover { background: rgba(14, 13, 11, 0.03); }
.fr-row:active { background: rgba(14, 13, 11, 0.06); }
.fr-row:focus-visible { outline: 2px solid var(--cinnabar-500); outline-offset: -2px; }

.fr-avatar {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: var(--r-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: #FFF6EC;
  position: relative;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
}
.fr-avatar--group {
  border-radius: 12px;
  font-size: 16px;
}
.fr-avatar__online {
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 11px;
  height: 11px;
  border-radius: var(--r-full);
  background: var(--indigo-400);
  border: 2px solid var(--paper-50);
}
.fr-avatar__online.is-offline { background: var(--neutral-500); opacity: 0.5; }

.fr-row__main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.fr-row__top {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.fr-row__name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-900);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fr-row__authority {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 1px 6px;
  border-radius: var(--r-full);
  background: rgba(199, 162, 74, 0.14);
  color: var(--gold-700);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.02em;
  flex-shrink: 0;
}
.fr-row__authority::before { content: "★"; font-size: 9px; }

.fr-row__sub {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--neutral-500);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fr-row__domain {
  color: var(--indigo-500);
}
.fr-row__preview {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fr-row__meta {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.fr-row__time {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  letter-spacing: 0.02em;
}
.fr-row__unread {
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: var(--r-full);
  background: var(--cinnabar-500);
  color: #FFF6EC;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.fr-row__unread--muted {
  background: var(--neutral-500);
  opacity: 0.5;
}

/* —— 推荐关注的「关注」按钮 —— */
.fr-follow {
  flex-shrink: 0;
  min-height: 30px;
  padding: 0 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: var(--cinnabar-500);
  color: #FFF6EC;
  border: none;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx),
              transform var(--dur-fast) var(--ease-zx);
}
.fr-follow:active { transform: scale(0.96); }
.fr-follow.is-following {
  background: var(--paper-100);
  color: var(--neutral-500);
}
.fr-follow svg { width: 12px; height: 12px; }

/* —— 群类型徽标 —— */
.fr-grouptype {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: var(--r-1);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.fr-grouptype--study { background: rgba(29, 91, 122, 0.12); color: var(--indigo-500); }
.fr-grouptype--topic { background: rgba(180, 96, 44, 0.14); color: var(--con); }
.fr-grouptype--project { background: rgba(199, 162, 74, 0.16); color: var(--gold-700); }

/* —— 推荐理由（小字） —— */
.fr-reason {
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--neutral-500);
  line-height: 1.5;
  padding-left: 60px;
  padding-right: 16px;
  margin-top: -4px;
  padding-bottom: 6px;
}
.fr-reason::before { content: "↳ "; color: var(--indigo-400); }

/* —— 空状态 —— */
.fr-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 60px 32px;
  text-align: center;
  color: var(--neutral-500);
}
.fr-empty__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-700);
}
.fr-empty__sub {
  margin: 0;
  font-family: var(--font-body);
  font-size: 12px;
}

/* =========================== 长按菜单 =========================== */

.fr-context {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--paper-50);
  border-radius: 16px 16px 0 0;
  box-shadow: var(--shadow-float);
  padding: 8px 8px calc(12px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform var(--dur-base) var(--ease-zx);
  z-index: 40;
}
.fr-context.is-open { transform: translateY(0); }
.fr-context__head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px 12px;
  border-bottom: 1px solid var(--paper-100);
  margin-bottom: 6px;
}
.fr-context__name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-900);
}
.fr-context__sub {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--neutral-500);
}
.fr-context__item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: transparent;
  border: none;
  border-radius: 10px;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--ink-900);
  cursor: pointer;
  min-height: 44px;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.fr-context__item:hover { background: rgba(14, 13, 11, 0.04); }
.fr-context__item--danger { color: var(--cinnabar-500); }
.fr-context__item svg { width: 18px; height: 18px; flex-shrink: 0; }
.fr-context__close {
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  background: var(--paper-100);
  border: none;
  border-radius: 10px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-700);
  cursor: pointer;
}

.fr-scrim {
  position: absolute;
  inset: 0;
  background: rgba(14, 13, 11, 0.32);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-base) var(--ease-zx);
  z-index: 35;
}
.fr-scrim.is-open { opacity: 1; pointer-events: auto; }

/* =========================== 聊天页（1对1 / 群聊 共用） =========================== */

.fr-chat-top {
  height: 44px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px 0 4px;
  background: var(--paper-50);
  border-bottom: 1px solid var(--paper-100);
}
.fr-chat-head {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.fr-chat-head__ava {
  width: 30px;
  height: 30px;
  border-radius: var(--r-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 600;
  color: #FFF6EC;
  flex-shrink: 0;
}
.fr-chat-head__ava--group { border-radius: 8px; }
.fr-chat-head__main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.fr-chat-head__name {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-900);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fr-chat-head__status {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--indigo-500);
  letter-spacing: 0.02em;
}
.fr-chat-head__status.is-offline { color: var(--neutral-500); }

/* AI 介入按键：鎏金描边（呼应「工作伙伴」哲学） */
.fr-ai-btn {
  width: 36px;
  height: 36px;
  min-width: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(199, 162, 74, 0.08);
  border: 1px solid var(--gold-500);
  border-radius: var(--r-full);
  color: var(--gold-700);
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx),
              box-shadow var(--dur-fast) var(--ease-zx);
}
.fr-ai-btn svg { width: 18px; height: 18px; display: block; }
.fr-ai-btn:hover { background: rgba(199, 162, 74, 0.16); }
.fr-ai-btn.is-active {
  background: var(--gold-500);
  color: var(--ink-900);
  box-shadow: 0 0 0 4px rgba(199, 162, 74, 0.16);
}

/* —— 群公告条 —— */
.fr-announce {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: rgba(199, 162, 74, 0.10);
  border-bottom: 1px solid rgba(199, 162, 74, 0.20);
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--gold-700);
  overflow: hidden;
}
.fr-announce__tag {
  flex-shrink: 0;
  padding: 1px 6px;
  background: var(--gold-500);
  color: var(--ink-900);
  border-radius: var(--r-1);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.fr-announce__text {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* —— 共享笔记入口（群聊顶部 chip 行） —— */
.fr-shared {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  overflow-x: auto;
  border-bottom: 1px solid var(--paper-100);
  background: var(--paper-50);
}
.fr-shared::-webkit-scrollbar { display: none; }
.fr-shared__chip {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px 4px 8px;
  background: rgba(29, 91, 122, 0.10);
  border: 1px solid rgba(29, 91, 122, 0.20);
  border-radius: var(--r-full);
  font-family: var(--font-display);
  font-size: 12px;
  color: var(--indigo-500);
  cursor: pointer;
}
.fr-shared__chip svg { width: 12px; height: 12px; }
.fr-shared__add {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--paper-100);
  border: none;
  border-radius: var(--r-full);
  color: var(--neutral-500);
  cursor: pointer;
}
.fr-shared__add svg { width: 14px; height: 14px; }

/* —— AI 旁观状态条 —— */
.fr-ai-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  background: linear-gradient(90deg, rgba(199, 162, 74, 0.14), rgba(199, 162, 74, 0.06));
  border-bottom: 1px solid rgba(199, 162, 74, 0.24);
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--gold-700);
  max-height: 0;
  padding-top: 0;
  padding-bottom: 0;
  border-bottom-width: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height var(--dur-base) var(--ease-zx),
              opacity var(--dur-fast) var(--ease-zx),
              padding var(--dur-base) var(--ease-zx);
}
.fr-ai-bar.is-on {
  max-height: 60px;
  opacity: 1;
  padding-top: 7px;
  padding-bottom: 7px;
  border-bottom-width: 1px;
}
.fr-ai-bar__spark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  color: var(--gold-700);
}
.fr-ai-bar__spark svg { width: 14px; height: 14px; display: block; }
.fr-ai-bar__text { flex: 1; min-width: 0; }
.fr-ai-bar__close {
  background: none;
  border: none;
  color: var(--gold-700);
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  padding: 2px 4px;
}

/* =========================== 消息流 =========================== */

.fr-msgs {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background:
    linear-gradient(180deg, rgba(29, 91, 122, 0.04), transparent 24%),
    var(--paper-50);
}
.fr-msgs::-webkit-scrollbar { width: 4px; }
.fr-msgs::-webkit-scrollbar-thumb { background: var(--paper-100); border-radius: 2px; }

/* 系统消息：居中 */
.fr-sysmsg {
  align-self: center;
  padding: 4px 12px;
  background: var(--paper-100);
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--neutral-500);
  letter-spacing: 0.02em;
  max-width: 86%;
  text-align: center;
}

/* 日期分隔 */
.fr-datebreak {
  align-self: center;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--neutral-500);
  padding: 2px 8px;
  letter-spacing: 0.06em;
}

/* 普通消息 */
.fr-msg {
  display: flex;
  gap: 8px;
  max-width: 84%;
  align-items: flex-end;
}
.fr-msg--peer { align-self: flex-start; }
.fr-msg--me { align-self: flex-end; flex-direction: row-reverse; }
.fr-msg__ava {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border-radius: var(--r-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  color: #FFF6EC;
  flex-shrink: 0;
}
.fr-msg__col { display: flex; flex-direction: column; gap: 3px; min-width: 0; max-width: 100%; }
.fr-msg--me .fr-msg__col { align-items: flex-end; }
.fr-msg__sender {
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--neutral-500);
  padding: 0 4px;
}
.fr-msg__bubble {
  padding: 9px 13px;
  border-radius: 14px;
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink-900);
  word-break: break-word;
}
/* 对方：paper-100 气泡（朱砂淡色被刻意避开，保留给"我的"以建立归属感对照） */
.fr-msg--peer .fr-msg__bubble {
  background: var(--paper-100);
  border-top-left-radius: 4px;
}
/* 我的：朱砂淡色气泡 */
.fr-msg--me .fr-msg__bubble {
  background: rgba(193, 39, 45, 0.10);
  border: 1px solid rgba(193, 39, 45, 0.22);
  border-top-right-radius: 4px;
}
.fr-msg__time {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--neutral-500);
  padding: 0 4px;
  letter-spacing: 0.02em;
}

/* @提及在消息内的高亮（赤陶色） */
.fr-mention-tag {
  display: inline;
  color: var(--con);
  font-weight: 600;
  background: rgba(180, 96, 44, 0.10);
  padding: 0 3px;
  border-radius: 3px;
}

/* =========================== 特殊消息卡 =========================== */

/* 笔记分享卡：黛青色带 */
.fr-notecard {
  width: 100%;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-left: 3px solid var(--indigo-500);
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-zx),
              box-shadow var(--dur-fast) var(--ease-zx);
}
.fr-notecard:hover { transform: translateY(-1px); box-shadow: var(--shadow-paper); }
.fr-notecard__tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--indigo-500);
  letter-spacing: 0.04em;
  margin-bottom: 5px;
}
.fr-notecard__tag svg { width: 11px; height: 11px; }
.fr-notecard__title {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
  line-height: 1.4;
}
.fr-notecard__excerpt {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 12px;
  line-height: 1.55;
  color: var(--neutral-500);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.fr-notecard__cta {
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--indigo-500);
  font-weight: 500;
}

/* 争论邀请卡：朱砂色带 + 赞成/反对分布条 */
.fr-debatecard {
  width: 100%;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-left: 3px solid var(--cinnabar-500);
  border-radius: 10px;
  padding: 10px 12px;
  cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-zx),
              box-shadow var(--dur-fast) var(--ease-zx);
}
.fr-debatecard:hover { transform: translateY(-1px); box-shadow: var(--shadow-paper); }
.fr-debatecard__tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--cinnabar-500);
  letter-spacing: 0.04em;
  margin-bottom: 5px;
}
.fr-debatecard__tag svg { width: 11px; height: 11px; }
.fr-debatecard__title {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
  line-height: 1.4;
}
.fr-debatecard__bar {
  display: flex;
  height: 8px;
  border-radius: var(--r-full);
  overflow: hidden;
  margin-bottom: 6px;
  background: var(--paper-100);
}
.fr-debatecard__bar--pro { background: var(--indigo-500); }
.fr-debatecard__bar--con { background: var(--con); }
.fr-debatecard__stats {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  margin-bottom: 8px;
}
.fr-debatecard__stats--pro { color: var(--indigo-500); }
.fr-debatecard__stats--con { color: var(--con); }
.fr-debatecard__join {
  width: 100%;
  height: 30px;
  background: var(--cinnabar-500);
  color: #FFF6EC;
  border: none;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.fr-debatecard__join:active { transform: scale(0.98); }

/* AI 插话消息（鎏金色带 · 区别于人类消息） */
.fr-msg--ai .fr-msg__bubble {
  background: rgba(199, 162, 74, 0.10);
  border: 1px solid rgba(199, 162, 74, 0.28);
  border-top-left-radius: 4px;
}
.fr-msg--ai .fr-msg__ava {
  background: var(--gold-500);
  color: var(--ink-900);
}
.fr-msg--ai .fr-msg__sender { color: var(--gold-700); }
.fr-ai-prefix {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--gold-700);
  margin-bottom: 4px;
  padding: 0 4px;
}
.fr-ai-prefix svg { width: 10px; height: 10px; }

/* AI 正在旁观 · 思考三点 */
.fr-typing { display: inline-flex; align-items: center; gap: 6px; padding: 0 4px; }
.fr-typing__dots { display: inline-flex; gap: 3px; }
.fr-typing__dot {
  width: 5px;
  height: 5px;
  border-radius: var(--r-full);
  background: var(--gold-700);
  animation: fr-typing 1s var(--ease-zx) infinite;
}
.fr-typing__dot:nth-child(2) { animation-delay: 0.15s; }
.fr-typing__dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes fr-typing {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-3px); opacity: 1; }
}

/* =========================== 输入栏 =========================== */

.fr-input-row {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
  background: var(--paper-50);
  border-top: 1px solid var(--paper-100);
  position: relative;
}
.fr-attach-btn {
  width: 40px;
  height: 40px;
  min-width: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--paper-100);
  border: none;
  border-radius: var(--r-full);
  color: var(--ink-700);
  cursor: pointer;
  flex-shrink: 0;
}
.fr-attach-btn svg { width: 20px; height: 20px; display: block; }
.fr-attach-btn:hover { background: rgba(14, 13, 11, 0.08); }
.fr-input-wrap { flex: 1; position: relative; }
.fr-input {
  width: 100%;
  min-height: 40px;
  max-height: 96px;
  resize: none;
  padding: 10px 14px;
  background: var(--paper-100);
  border: 1px solid transparent;
  border-radius: 20px;
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink-900);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-zx),
              background var(--dur-fast) var(--ease-zx);
}
.fr-input:focus { background: var(--paper-50); border-color: var(--cinnabar-500); }
.fr-send {
  width: 40px;
  height: 40px;
  min-width: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--cinnabar-500);
  border: none;
  border-radius: var(--r-full);
  color: #FFF6EC;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(193, 39, 45, 0.28);
  flex-shrink: 0;
  transition: background var(--dur-fast) var(--ease-zx),
              transform var(--dur-fast) var(--ease-zx);
}
.fr-send:active { transform: scale(0.96); }
.fr-send svg { width: 20px; height: 20px; display: block; }
.fr-send:disabled {
  background: var(--paper-100);
  color: var(--neutral-500);
  box-shadow: none;
  cursor: default;
}

/* —— 附件托盘 —— */
.fr-attach-tray {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: 8px 12px 0;
  flex-wrap: wrap;
  background: var(--paper-50);
  max-height: 0;
  overflow: hidden;
  transition: max-height var(--dur-base) var(--ease-zx);
}
.fr-attach-tray.is-open { max-height: 120px; }
.fr-attach-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px 4px 8px;
  background: var(--paper-100);
  border-radius: var(--r-full);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gold-700);
}
.fr-attach-chip svg { width: 12px; height: 12px; }

/* —— 附件菜单（@ 关键帧） —— */
.fr-attach-menu {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(100% + 6px);
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  padding: 6px;
  display: none;
  z-index: 12;
}
.fr-attach-menu.is-open { display: block; }
.fr-attach-menu__item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: transparent;
  border: none;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-900);
  cursor: pointer;
  min-height: 40px;
  text-align: left;
}
.fr-attach-menu__item:hover { background: rgba(14, 13, 11, 0.04); }
.fr-attach-menu__item svg { width: 16px; height: 16px; flex-shrink: 0; }
.fr-attach-menu__item--note svg { color: var(--indigo-500); }
.fr-attach-menu__item--debate svg { color: var(--cinnabar-500); }
.fr-attach-menu__item--image svg { color: var(--con); }

/* —— @提及成员列表 —— */
.fr-mention {
  position: absolute;
  left: 8px;
  right: 8px;
  bottom: calc(100% + 4px);
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 12px;
  box-shadow: var(--shadow-float);
  max-height: 220px;
  overflow-y: auto;
  padding: 4px;
  display: none;
  z-index: 12;
}
.fr-mention.is-open { display: block; }
.fr-mention__item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 8px;
  cursor: pointer;
  min-height: 36px;
}
.fr-mention__item:hover { background: rgba(14, 13, 11, 0.04); }
.fr-mention__ava {
  width: 24px;
  height: 24px;
  border-radius: var(--r-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  color: #FFF6EC;
  flex-shrink: 0;
}
.fr-mention__name {
  font-family: var(--font-display);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-900);
}

/* =========================== 添加好友子页 =========================== */

.fr-add-head {
  flex-shrink: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 6px 0 4px;
  background: var(--paper-50);
  border-bottom: 1px solid var(--paper-100);
}
.fr-add-title {
  flex: 1;
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-900);
  padding-left: 4px;
}
.fr-add-filters {
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  padding: 8px 14px;
  overflow-x: auto;
  background: var(--paper-50);
  border-bottom: 1px solid var(--paper-100);
}
.fr-add-filters::-webkit-scrollbar { display: none; }
.fr-filter-chip {
  flex-shrink: 0;
  padding: 4px 12px;
  border-radius: var(--r-full);
  background: var(--paper-100);
  border: none;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--ink-700);
  cursor: pointer;
}
.fr-filter-chip.is-active {
  background: var(--cinnabar-500);
  color: #FFF6EC;
}

/* =========================== reduced-motion 降级 =========================== */

@media (prefers-reduced-motion: reduce) {
  .fr-view,
  .fr-context,
  .fr-scrim,
  .fr-ai-bar,
  .fr-attach-tray,
  .fr-row,
  .fr-msg__bubble,
  .fr-notecard,
  .fr-debatecard,
  .fr-send,
  .fr-follow {
    transition: none !important;
    animation: none !important;
  }
  .fr-typing__dot { animation: none !important; opacity: 0.7; }
}

/* =========================== 轻量 toast =========================== */
.fr-toast {
  position: absolute;
  left: 50%;
  bottom: 96px;
  transform: translate(-50%, 8px);
  background: var(--ink-900);
  color: var(--paper-50);
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.4;
  padding: 9px 16px;
  border-radius: var(--r-full);
  box-shadow: var(--shadow-float);
  opacity: 0;
  pointer-events: none;
  z-index: 80;
  max-width: 80%;
  text-align: center;
  transition: opacity var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
}
.fr-toast.is-show { opacity: 0.96; transform: translate(-50%, 0); }

/* =========================== a11y：键盘焦点环 ===========================
 * 补齐 friends.css 缺失的 :focus-visible（沿用 .fr-iconbtn 的朱砂焦点环）
 * ====================================================================== */
.fr-follow:focus-visible,
.fr-ai-btn:focus-visible,
.fr-send:focus-visible,
.fr-attach-btn:focus-visible,
.fr-segment__btn:focus-visible,
.fr-debatecard__join:focus-visible,
.fr-context__item:focus-visible,
.fr-filter-chip:focus-visible,
.fr-mention__item:focus-visible {
  outline: 2px solid var(--cinnabar-500);
  outline-offset: 2px;
}

/* ===== publish.css ===== */
/* =========================================================================
 * 「知行」App 本体 Demo —— Phase 3 / 发布页（publish.css）
 * -------------------------------------------------------------------------
 * 依赖：../demo/shared/components.css（tokens / typography / motion）+ ./shell.css
 * 设计哲学：发布 = 类 GitHub 的版本管理（公有/私有可控 · 变更可追溯）
 * 视图栈：main（默认）→ repo / drafts / history / commit（均右入）
 * 设计语言：墨韵 · 星图（朱砂 CTA / 黛青 链接·分支 / 鎏金 新增·AI·公有 / 赤陶 删除·私有）
 * =======================================================================*/

/* =========================== 根容器 + 视图栈 =========================== */

.pub-root {
  position: relative;
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: var(--paper-50);
}

.pub-view {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--paper-50);
  opacity: 0;
  pointer-events: none;
  transform: translateX(100%);
  transition: transform var(--dur-base) var(--ease-zx),
              opacity var(--dur-fast) var(--ease-zx);
  will-change: transform, opacity;
}
.pub-view[data-axis="none"] { transform: translateX(0); }
.pub-view.is-on {
  opacity: 1 !important;
  pointer-events: auto;
  transform: translateX(0) !important;
  z-index: 2;
}

.pub-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 4px 14px 120px;
}

/* =========================== 顶栏（44px） =========================== */

.pub-topbar {
  flex-shrink: 0;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6px;
  background: rgba(250, 246, 238, 0.92);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--paper-100);
  z-index: 5;
}

.pub-topbar__btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 36px;
  padding: 0 10px;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--ink-700);
  font-family: var(--font-body);
  font-size: 14px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx);
}
.pub-topbar__btn:hover { background: rgba(14, 13, 11, 0.06); }
.pub-topbar__btn:active { transform: scale(0.96); }
.pub-topbar__btn:focus-visible { outline: 2px solid var(--cinnabar-500); outline-offset: 2px; }
.pub-topbar__btn svg { width: 20px; height: 20px; display: block; }

.pub-topbar__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-900);
  letter-spacing: 0.04em;
}

.pub-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: var(--r-full);
  background: var(--cinnabar-500);
  color: #FFF6EC;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
}

/* =========================== 区块通用 =========================== */

.pub-sec { margin-top: 18px; }
.pub-sec:first-child { margin-top: 8px; }

.pub-sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 2px 10px;
}
.pub-sec-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-900);
  letter-spacing: 0.03em;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pub-sec-title::before {
  content: "";
  width: 3px;
  height: 14px;
  border-radius: 2px;
  background: var(--cinnabar-500);
}
.pub-sec-title--gold::before { background: var(--gold-500); }
.pub-sec-title--indigo::before { background: var(--indigo-500); }
.pub-sec-title--con::before { background: var(--con); }

.pub-sec-tools {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pub-sec-tool {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 28px;
  padding: 0 8px;
  background: var(--paper-100);
  border: 1px solid transparent;
  border-radius: var(--r-full);
  color: var(--neutral-500);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pub-sec-tool:hover { color: var(--ink-900); }
.pub-sec-tool svg { width: 14px; height: 14px; display: block; }

/* =========================== 区块 1：发布操作卡 =========================== */

.pub-action {
  background: var(--card-bg);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-paper);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.pub-action::before {
  content: "";
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, var(--cinnabar-500), var(--gold-500));
}

.pub-action__title {
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--ink-900);
}
.pub-action__title em {
  font-style: normal;
  color: var(--cinnabar-500);
}

/* 当前草稿缩略 */
.pub-draft-card {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 10px;
  margin-bottom: 14px;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease-zx);
}
.pub-draft-card:hover { border-color: var(--cinnabar-300); }
.pub-draft-card__thumb {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 8px;
  background: linear-gradient(135deg, rgba(29, 91, 122, 0.16), rgba(199, 162, 74, 0.18));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--indigo-500);
}
.pub-draft-card__thumb svg { width: 22px; height: 22px; display: block; }
.pub-draft-card__body { flex: 1; min-width: 0; }
.pub-draft-card__title {
  margin: 0 0 3px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pub-draft-card__meta {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--neutral-500);
  display: flex;
  align-items: center;
  gap: 6px;
}
.pub-draft-card__meta .pub-mono { color: var(--gold-700); }
.pub-draft-card__chev {
  align-self: center;
  color: var(--neutral-500);
}
.pub-draft-card__chev svg { width: 18px; height: 18px; display: block; }

/* 字段标签 */
.pub-field { margin-bottom: 14px; }
.pub-field.is-hidden { display: none; }
.pub-field__label {
  display: block;
  margin: 0 0 6px;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--neutral-500);
  letter-spacing: 0.04em;
}

/* segment 控件（公有/私有/团队 · 受众） */
.pub-segment {
  display: flex;
  background: var(--paper-100);
  border-radius: var(--r-full);
  padding: 3px;
  gap: 2px;
}
.pub-segment__btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 34px;
  padding: 0 8px;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--neutral-500);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-fast) var(--ease-zx), color var(--dur-fast) var(--ease-zx), box-shadow var(--dur-fast) var(--ease-zx);
  white-space: nowrap;
}
.pub-segment__btn svg { width: 15px; height: 15px; display: block; }
.pub-segment__btn.is-active {
  background: var(--paper-50);
  color: var(--ink-900);
  box-shadow: var(--shadow-paper);
}

/* segment 语义高亮（选中态色带） */
.pub-segment--vis .pub-segment__btn[data-val="public"].is-active  { color: var(--gold-700); }
.pub-segment--vis .pub-segment__btn[data-val="private"].is-active { color: var(--con); }
.pub-segment--vis .pub-segment__btn[data-val="team"].is-active    { color: var(--indigo-500); }

/* 标签编辑区 */
.pub-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.pub-tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 6px 5px 10px;
  background: rgba(29, 91, 122, 0.10);
  border: 1px solid rgba(29, 91, 122, 0.22);
  border-radius: var(--r-full);
  color: var(--indigo-500);
  font-family: var(--font-body);
  font-size: 12px;
  line-height: 1;
}
.pub-tag-chip__x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: var(--indigo-500);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pub-tag-chip__x:hover { background: rgba(29, 91, 122, 0.16); }
.pub-tag-chip__x svg { width: 12px; height: 12px; display: block; }

.pub-tag-add {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 28px;
  padding: 0 10px;
  background: transparent;
  border: 1px dashed var(--neutral-500);
  border-radius: var(--r-full);
  color: var(--neutral-500);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pub-tag-add:hover { border-color: var(--indigo-500); color: var(--indigo-500); }
.pub-tag-add svg { width: 13px; height: 13px; display: block; }

.pub-tag-input {
  flex: 0 1 140px;
  height: 28px;
  padding: 0 10px;
  background: var(--paper-50);
  border: 1px solid var(--indigo-500);
  border-radius: var(--r-full);
  color: var(--ink-900);
  font-family: var(--font-body);
  font-size: 12px;
  outline: none;
}

/* commit message 输入框（思源宋体） */
.pub-commit-input {
  width: 100%;
  min-height: 64px;
  padding: 10px 12px;
  background: var(--paper-50);
  border: 1px solid var(--paper-100);
  border-radius: 10px;
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.6;
  color: var(--ink-900);
  resize: none;
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-zx);
}
.pub-commit-input::placeholder { color: var(--neutral-500); font-family: var(--font-display); }
.pub-commit-input:focus { border-color: var(--cinnabar-500); }

.pub-commit-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}
.pub-commit-foot .pub-mono { color: var(--gold-700); }

/* 大发布按钮（朱砂实色） */
.pub-btn-publish {
  width: 100%;
  min-height: 48px;
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--cinnabar-500);
  color: #FFF6EC;
  border: none;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(193, 39, 45, 0.28);
  -webkit-tap-highlight-color: transparent;
  transition: transform var(--dur-fast) var(--ease-zx), box-shadow var(--dur-fast) var(--ease-zx), background var(--dur-fast) var(--ease-zx);
}
.pub-btn-publish:hover { background: #A8232A; }
.pub-btn-publish:active { transform: scale(0.98); }
.pub-btn-publish svg { width: 18px; height: 18px; display: block; }
.pub-btn-publish:focus-visible { outline: 2px solid var(--ink-900); outline-offset: 3px; }

/* =========================== 区块 2：变更预览 diff =========================== */

.pub-diff {
  background: var(--card-bg);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-paper);
  overflow: hidden;
}
.pub-diff__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 0.5px solid var(--paper-100);
}
.pub-diff__stats {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
}
.pub-diff__stats .add { color: var(--gold-700); }
.pub-diff__stats .del { color: var(--con); }
.pub-diff__stats .mod { color: #B89020; }

.pub-diff-toggle {
  display: inline-flex;
  background: var(--paper-100);
  border-radius: var(--r-full);
  padding: 2px;
}
.pub-diff-toggle__btn {
  min-height: 26px;
  padding: 0 10px;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--neutral-500);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pub-diff-toggle__btn.is-active {
  background: var(--paper-50);
  color: var(--ink-900);
  box-shadow: var(--shadow-paper);
}

.pub-diff__body {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.7;
  max-height: 112px;       /* 折叠 ≈ 5 行 */
  overflow: hidden;
  transition: max-height var(--dur-base) var(--ease-zx);
  position: relative;
}
.pub-diff__body.is-expanded { max-height: 1200px; }
/* 预览模式：隐藏源码区与展开按钮 */
.pub-diff.is-preview .pub-diff__body,
.pub-diff.is-preview .pub-diff-foot { display: none; }
/* 短 diff：无需展开 */
.pub-diff.is-short .pub-diff-foot { display: none; }
.pub-diff__body::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 56px;
  background: linear-gradient(180deg, transparent, var(--card-bg));
  pointer-events: none;
  opacity: 1;
  transition: opacity var(--dur-fast) var(--ease-zx);
}
.pub-diff__body.is-expanded::after,
.pub-diff__body.is-short::after { opacity: 0; }

.pub-diff-line {
  display: flex;
  align-items: flex-start;
  padding: 1px 12px;
  white-space: pre-wrap;
  word-break: break-word;
}
.pub-diff-line__sign {
  flex-shrink: 0;
  width: 16px;
  text-align: center;
  opacity: 0.7;
  user-select: none;
}
.pub-diff-line__txt { flex: 1; min-width: 0; }

.pub-diff-line--ctx  { color: var(--neutral-500); }
.pub-diff-line--add  { background: rgba(199, 162, 74, 0.16); color: var(--ink-900); }
.pub-diff-line--add  .pub-diff-line__sign { color: var(--gold-700); }
.pub-diff-line--del  { background: rgba(180, 96, 44, 0.14); color: var(--ink-900); }
.pub-diff-line--del  .pub-diff-line__sign { color: var(--con); }
.pub-diff-line--mod  { background: rgba(184, 144, 32, 0.16); color: var(--ink-900); }
.pub-diff-line--mod  .pub-diff-line__sign { color: #B89020; }
.pub-diff-line--ai   { background: rgba(199, 162, 74, 0.10); }
.pub-diff-line--ai   .pub-diff-line__sign { color: var(--gold-700); }

/* diff 预览态（渲染视图） */
.pub-diff-preview {
  padding: 12px 14px;
  font-family: var(--font-display);
  font-size: 14px;
  line-height: 1.75;
  color: var(--ink-900);
  display: none;
}
.pub-diff-preview.is-on { display: block; }
.pub-diff-preview del {
  background: rgba(180, 96, 44, 0.16);
  color: var(--con);
  text-decoration: line-through;
  padding: 0 2px;
  border-radius: 3px;
}
.pub-diff-preview ins {
  background: rgba(199, 162, 74, 0.20);
  color: var(--gold-700);
  text-decoration: none;
  padding: 0 2px;
  border-radius: 3px;
}
.pub-diff-preview mark {
  background: rgba(184, 144, 32, 0.20);
  color: inherit;
  padding: 0 2px;
  border-radius: 3px;
}

.pub-diff-foot {
  display: flex;
  justify-content: center;
  padding: 8px;
  border-top: 0.5px solid var(--paper-100);
}
.pub-diff-expand {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 32px;
  padding: 0 14px;
  background: transparent;
  border: none;
  border-radius: var(--r-full);
  color: var(--indigo-500);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pub-diff-expand:hover { background: rgba(29, 91, 122, 0.08); }
.pub-diff-expand svg { width: 14px; height: 14px; display: block; transition: transform var(--dur-fast) var(--ease-zx); }
.pub-diff-expand.is-open svg { transform: rotate(180deg); }

/* =========================== 区块 3：仓库列表 =========================== */

.pub-repo-list { display: flex; flex-direction: column; gap: 10px; }

.pub-repo-card {
  background: var(--card-bg);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-paper);
  padding: 12px 14px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: border-color var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
  -webkit-tap-highlight-color: transparent;
}
.pub-repo-card:hover { border-color: var(--indigo-400); }
.pub-repo-card:active { transform: scale(0.99); }

.pub-repo__head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.pub-repo__ico { color: var(--indigo-500); display: inline-flex; }
.pub-repo__ico svg { width: 17px; height: 17px; display: block; }
.pub-repo__name {
  margin: 0;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--indigo-500);
  letter-spacing: 0.01em;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pub-repo__stars {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--neutral-500);
}
.pub-repo__stars svg { width: 14px; height: 14px; display: block; color: var(--gold-500); }

.pub-repo__desc {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: 13px;
  line-height: 1.6;
  color: var(--ink-700);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.pub-repo__foot {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}
.pub-repo__branch {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--indigo-500);
}
.pub-repo__branch svg { width: 13px; height: 13px; display: block; }
.pub-repo__commit-hash {
  color: var(--neutral-500);
}
.pub-repo__commit-msg {
  font-family: var(--font-display);
  color: var(--ink-700);
  max-width: 120px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pub-repo__time { margin-left: auto; }
.pub-repo__typechip { margin-left: 4px; }

/* 可见性 chip + 类型 chip */
.pub-vis-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.pub-vis-chip svg { width: 12px; height: 12px; display: block; }
.pub-vis-chip--public  { background: rgba(199, 162, 74, 0.16); color: var(--gold-700); }
.pub-vis-chip--private { background: rgba(180, 96, 44, 0.14); color: var(--con); }
.pub-vis-chip--team    { background: rgba(29, 91, 122, 0.12); color: var(--indigo-500); }

.pub-type-chip {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 11px;
  background: var(--paper-100);
  color: var(--neutral-500);
}
.pub-type-chip--note       { background: rgba(193, 39, 45, 0.10); color: var(--cinnabar-500); }
.pub-type-chip--debate     { background: rgba(29, 91, 122, 0.12); color: var(--indigo-500); }
.pub-type-chip--collection { background: rgba(199, 162, 74, 0.16); color: var(--gold-700); }

/* 仓库搜索框 */
.pub-searchbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  height: 34px;
  background: var(--paper-100);
  border-radius: var(--r-full);
  margin-bottom: 12px;
}
.pub-searchbar svg { width: 16px; height: 16px; display: block; color: var(--neutral-500); }
.pub-searchbar input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--ink-900);
}
.pub-searchbar input::placeholder { color: var(--neutral-500); }

/* 空态 */
.pub-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--neutral-500);
  font-family: var(--font-body);
  font-size: 13px;
}

/* =========================== 区块 4：活动时间线 =========================== */

.pub-timeline {
  position: relative;
  padding-left: 22px;
}
.pub-timeline::before {
  content: "";
  position: absolute;
  left: 7px;
  top: 6px;
  bottom: 6px;
  width: 2px;
  background: linear-gradient(180deg, var(--paper-100), var(--paper-100) 80%, transparent);
}

.pub-tl-item {
  position: relative;
  padding: 8px 0 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pub-tl-item:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0.5px;
  background: var(--paper-100);
  margin-left: -22px;
}
.pub-tl-item__dot {
  position: absolute;
  left: -22px;
  top: 10px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--paper-50);
  border: 2px solid var(--neutral-500);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.pub-tl-item__dot svg { width: 9px; height: 9px; display: block; }
.pub-tl-item--publish .pub-tl-item__dot { border-color: var(--cinnabar-500); color: var(--cinnabar-500); }
.pub-tl-item--edit    .pub-tl-item__dot { border-color: var(--indigo-500); color: var(--indigo-500); }
.pub-tl-item--merge   .pub-tl-item__dot { border-color: #7B5A8A; color: #7B5A8A; }
.pub-tl-item--rollback .pub-tl-item__dot { border-color: var(--con); color: var(--con); }
.pub-tl-item--ai      .pub-tl-item__dot { border-color: var(--gold-500); color: var(--gold-700); background: rgba(199, 162, 74, 0.14); }

.pub-tl-item__row1 {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}
.pub-tl-item__hash {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--indigo-500);
  background: rgba(29, 91, 122, 0.08);
  padding: 1px 6px;
  border-radius: 4px;
}
.pub-tl-item__type {
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--neutral-500);
}
.pub-tl-item__time {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}
.pub-tl-item__title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink-900);
}
.pub-tl-item__repo {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  margin-top: 2px;
}
/* AI 改动：鎏金 ✦ 标识 */
.pub-tl-item--ai .pub-tl-item__title::before {
  content: "✦ ";
  color: var(--gold-700);
  font-weight: 700;
}

/* =========================== 子页：仓库详情 =========================== */

.pub-detail-info {
  background: var(--card-bg);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-paper);
  padding: 14px;
  margin-bottom: 14px;
}
.pub-detail-info__name {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--ink-900);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.pub-detail-info__desc {
  margin: 0 0 10px;
  font-family: var(--font-display);
  font-size: 13px;
  line-height: 1.65;
  color: var(--ink-700);
}
.pub-detail-stats {
  display: flex;
  gap: 14px;
  padding-top: 10px;
  border-top: 0.5px solid var(--paper-100);
}
.pub-detail-stat { display: flex; flex-direction: column; gap: 1px; }
.pub-detail-stat__num {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 500;
  color: var(--ink-900);
  line-height: 1.1;
}
.pub-detail-stat__lbl {
  font-family: var(--font-body);
  font-size: 11px;
  color: var(--neutral-500);
}

/* 分支选择条 */
.pub-branchbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: var(--card-bg);
  border-radius: var(--r-2);
  box-shadow: var(--shadow-paper);
  margin-bottom: 12px;
}
.pub-branchbar__branch {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: rgba(29, 91, 122, 0.10);
  border: 1px solid rgba(29, 91, 122, 0.22);
  border-radius: var(--r-full);
  color: var(--indigo-500);
  font-family: var(--font-mono);
  font-size: 12px;
}
.pub-branchbar__branch svg { width: 13px; height: 13px; display: block; }
.pub-branchbar__new {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 30px;
  padding: 0 10px;
  background: transparent;
  border: 1px dashed var(--neutral-500);
  border-radius: var(--r-full);
  color: var(--neutral-500);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
}
.pub-branchbar__new:hover { border-color: var(--indigo-500); color: var(--indigo-500); }
.pub-branchbar__new svg { width: 13px; height: 13px; display: block; }

/* commit 历史列表（git log 风格） */
.pub-commit-list { display: flex; flex-direction: column; }
.pub-commit-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 4px;
  border-bottom: 0.5px solid var(--paper-100);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.pub-commit-row:hover { background: rgba(29, 91, 122, 0.04); }
.pub-commit-row__dot {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  color: #FFF6EC;
}
.pub-commit-row__body { flex: 1; min-width: 0; }
.pub-commit-row__msg {
  margin: 0 0 3px;
  font-family: var(--font-display);
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink-900);
}
.pub-commit-row--ai .pub-commit-row__msg::before {
  content: "✦ ";
  color: var(--gold-700);
}
.pub-commit-row__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
  flex-wrap: wrap;
}
.pub-commit-row__hash { color: var(--indigo-500); }
.pub-commit-row__author { color: var(--ink-700); }

/* commit 详情 diff（复用 .pub-diff-line） */
.pub-commit-detail-head {
  background: var(--card-bg);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-paper);
  padding: 14px;
  margin-bottom: 12px;
}
.pub-commit-detail-head__hash {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--indigo-500);
  margin-bottom: 6px;
}
.pub-commit-detail-head__msg {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-900);
  line-height: 1.45;
}
.pub-commit-detail-head__meta {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--neutral-500);
}

.pub-diff-block {
  background: var(--card-bg);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-paper);
  overflow: hidden;
}
.pub-diff-block__head {
  padding: 8px 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--neutral-500);
  border-bottom: 0.5px solid var(--paper-100);
  background: var(--paper-100);
}
.pub-diff-block__body { padding: 6px 0; }

/* =========================== 子页：草稿 =========================== */

.pub-draft-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  background: var(--card-bg);
  border-radius: var(--r-3);
  box-shadow: var(--shadow-paper);
  margin-bottom: 10px;
  border-left: 4px solid var(--gold-500);
}
.pub-draft-row__body { flex: 1; min-width: 0; }
.pub-draft-row__title {
  margin: 0 0 4px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-900);
  line-height: 1.4;
}
.pub-draft-row__meta {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--neutral-500);
  margin-bottom: 8px;
}
.pub-draft-row__actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pub-draft-mini {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 30px;
  padding: 0 12px;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  border: 1px solid transparent;
  -webkit-tap-highlight-color: transparent;
}
.pub-draft-mini svg { width: 13px; height: 13px; display: block; }
.pub-draft-mini--edit    { background: var(--paper-100); color: var(--ink-700); }
.pub-draft-mini--publish { background: var(--cinnabar-500); color: #FFF6EC; }
.pub-draft-mini--del     { background: transparent; border-color: var(--con); color: var(--con); }

/* =========================== 通用 mono / 段落按钮 =========================== */

.pub-mono { font-family: var(--font-mono); }

.pub-linkbtn {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: transparent;
  border: none;
  color: var(--indigo-500);
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: var(--r-full);
  -webkit-tap-highlight-color: transparent;
}
.pub-linkbtn:hover { background: rgba(29, 91, 122, 0.08); }

/* =========================== 发布确认模态（居中卡片） =========================== */

.pub-modal {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.pub-modal.is-open { display: flex; }
.pub-modal__overlay {
  position: absolute;
  inset: 0;
  background: rgba(14, 13, 11, 0.46);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: pub-fade-in var(--dur-fast) var(--ease-zx);
}
.pub-modal__dialog {
  position: relative;
  width: 100%;
  max-width: 320px;
  background: var(--paper-50);
  border-radius: 18px;
  box-shadow: var(--shadow-float);
  padding: 20px 18px 16px;
  animation: pub-modal-pop var(--dur-base) var(--ease-zx);
  border: 1px solid var(--paper-100);
}
@keyframes pub-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pub-modal-pop {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.pub-modal__stamp {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(193, 39, 45, 0.10);
  color: var(--cinnabar-500);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
}
.pub-modal__stamp svg { width: 24px; height: 24px; display: block; }
.pub-modal__title {
  margin: 0 0 14px;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  color: var(--ink-900);
  text-align: center;
}
.pub-modal__summary {
  background: var(--paper-100);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 16px;
  font-size: 13px;
}
.pub-modal__row {
  display: flex;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 0.5px dashed var(--paper-50);
}
.pub-modal__row:last-child { border-bottom: none; }
.pub-modal__row dt {
  flex-shrink: 0;
  width: 64px;
  margin: 0;
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--neutral-500);
}
.pub-modal__row dd {
  margin: 0;
  flex: 1;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--ink-900);
  word-break: break-word;
}
.pub-modal__row dd .pub-vis-chip { margin-right: 4px; }
.pub-modal__row dd .pub-tag-chip { background: rgba(29, 91, 122, 0.10); }

.pub-modal__foot { display: flex; gap: 10px; }
.pub-modal__btn {
  flex: 1;
  min-height: 44px;
  border-radius: var(--r-full);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  -webkit-tap-highlight-color: transparent;
  transition: transform var(--dur-fast) var(--ease-zx), background var(--dur-fast) var(--ease-zx);
}
.pub-modal__btn:active { transform: scale(0.97); }
.pub-modal__btn--cancel { background: var(--paper-100); color: var(--ink-700); }
.pub-modal__btn--confirm { background: var(--cinnabar-500); color: #FFF6EC; box-shadow: 0 4px 12px rgba(193, 39, 45, 0.24); }
.pub-modal__btn--confirm:hover { background: #A8232A; }

/* =========================== Toast =========================== */

.pub-toast {
  position: absolute;
  left: 50%;
  bottom: 100px;
  transform: translate(-50%, 16px);
  background: var(--ink-900);
  color: var(--paper-50);
  font-family: var(--font-body);
  font-size: 13px;
  padding: 10px 18px;
  border-radius: var(--r-full);
  box-shadow: var(--shadow-float);
  z-index: 80;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-zx), transform var(--dur-fast) var(--ease-zx);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.pub-toast.is-show { opacity: 1; transform: translate(-50%, 0); }

      title: noteData.title || '无标题笔记',
      summary: noteData.excerpt || noteData.summary || '我刚发布的笔记，欢迎讨论。',

      tags: noteData.tags && noteData.tags.length ? noteData.tags : ['我的发布'],

      debates: noteData.debates || [
        { stance: 'pro', count: 2 },
        { stance: 'con', count: 1 }
      ],
      time: nowLabel(),
      template: noteData.template || 'doc',
      visibility: noteData.visibility || 'public',
      _bridge: true
    };
    published.unshift(n);
    emit('publish', n);
    return n;
  }

  function getPublishedNotes() { return published.slice(); }

  function getNoteById(id) {
    for (var i = 0; i < published.length; i++) { if (published[i].id === id) return published[i]; }
    return null;
  }

  /* ----------------------------- 关注（写） ----------------------------- */
  function follow(authorId) {
    if (!authorId || following.indexOf(authorId) >= 0) return false;
    following.push(authorId);
    emit('follow', authorId);
    return true;
  }
  function unfollow(authorId) {
    var i = following.indexOf(authorId);
    if (i < 0) return false;
    following.splice(i, 1);
    emit('unfollow', authorId);
    return true;
  }
  function isFollowing(authorId) { return following.indexOf(authorId) >= 0; }
  function getFollowingIds() { return following.slice(); }

  /* ----------------------------- tab 切换（复制 shell route） ----------------------------- */
  function switchTab(name) {
    var tabs = document.querySelectorAll('.zx-tab');
    var pages = document.querySelectorAll('.zx-page');
    tabs.forEach(function (t) {
      var on = t.getAttribute('data-tab') === name;
      t.classList.toggle('is-active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    pages.forEach(function (p) {
      p.classList.toggle('is-active', p.getAttribute('data-page') === name);
    });
  }

  /* ----------------------------- 用编辑器打开笔记（闭环终点） -----------------------------
   * 个人页"我的创作"点击 → 切 notebook tab → 开编辑器加载该笔记
   */
  function openNoteInEditor(noteId) {
    var n = getNoteById(noteId);
    switchTab('notebook');
    setTimeout(function () {
      if (window.ZX_OVERVIEW && window.ZX_OVERVIEW.isOpen && window.ZX_OVERVIEW.isOpen()) {
        window.ZX_OVERVIEW.close();
      }
      if (window.ZX_EDITOR) {
        window.ZX_EDITOR.open(n ? (n.template || 'doc') : 'doc', {
          noteId: noteId,
          title: n ? n.title : '我的笔记'
        });
      }
    }, 140);
  }

  /* ----------------------------- 事件系统 ----------------------------- */
  function on(event, fn) {
    (listeners[event] = listeners[event] || []).push(fn);
  }
  function off(event, fn) {
    var arr = listeners[event];
    if (!arr) return;
    if (!fn) { listeners[event] = []; return; }
    var i = arr.indexOf(fn);
    if (i >= 0) arr.splice(i, 1);
  }
  function emit(event, data) {
    (listeners[event] || []).forEach(function (fn) {
      try { fn(data); } catch (e) { /* 静默，避免一个 tab 的错影响其它 */ }
    });
  }

  /* ----------------------------- 调试用：预置一条 demo 数据 -----------------------------
   * 让闭环"开箱即用"——打开广场就能看到一条"我"的发布，不依赖先走发布流程
   * （真实流程：用户在发布 tab commit 后也会写入这里）
   */
  function seed() {
    if (published.length === 0) {

        time: '1 小时前',
        template: 'doc',
        visibility: 'public',
        _bridge: true
      });
    }
  }
  seed();

    publish: publish,
    getPublishedNotes: getPublishedNotes,
    getNoteById: getNoteById,
    follow: follow,
    unfollow: unfollow,
    isFollowing: isFollowing,
    getFollowingIds: getFollowingIds,
    switchTab: switchTab,
    openNoteInEditor: openNoteInEditor,
    on: on,
    off: off
  };
})();

/* =========================================================================
 * 「知行」App 本体 Demo —— Phase 0 / App 外壳逻辑（shell.js）
 * -------------------------------------------------------------------------
 * 职责：
 *   1. 注入 ZX.icon 库图标（tab：graph / comment / fingerprint；标题栏：search / spark）
 *   2. 状态栏实时时间（HH:MM，每 30s 刷新一次）
 *   3. 5-tab 路由：display 切换 + is-active + aria-selected
 *   4. 初始化默认进入「笔记本」页（非广场）
 * 依赖：../demo/shared/icons.js（window.ZX.icon）、../demo/shared/mock-data.js
 * =======================================================================*/

(function () {
  'use strict';

  var DEFAULT_PAGE = 'notebook';

  /* ZX.icon 注入映射：优先复用共享图标库 */
  var TAB_ICONS = {
    square: 'graph',
    friends: 'comment',
    profile: 'fingerprint'
  };
  var HEAD_ICONS = {
    square: 'search',
    notebook: 'spark'
  };

  function injectIcons() {
    if (!window.ZX || typeof window.ZX.icon !== 'function') { return; }

    Object.keys(TAB_ICONS).forEach(function (page) {
      var slot = document.querySelector('[data-tab-icon="' + page + '"]');
      if (slot) { slot.innerHTML = window.ZX.icon(TAB_ICONS[page], 24); }
    });

    Object.keys(HEAD_ICONS).forEach(function (page) {
      var slot = document.querySelector('[data-head-icon="' + page + '"]');
      if (slot) { slot.innerHTML = window.ZX.icon(HEAD_ICONS[page], 22); }
    });
  }

  /* 状态栏时间：HH:MM（24h，等宽 tabular） */
  function tick() {
    var el = document.querySelector('.zx-statusbar__time');
    if (!el) { return; }
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, '0');
    var mm = String(d.getMinutes()).padStart(2, '0');
    el.textContent = hh + ':' + mm;
  }

  function route(name) {
    var tabs = document.querySelectorAll('.zx-tab');
    var pages = document.querySelectorAll('.zx-page');

    tabs.forEach(function (tab) {
      var on = tab.getAttribute('data-tab') === name;
      tab.classList.toggle('is-active', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
    });

    pages.forEach(function (page) {
      page.classList.toggle('is-active', page.getAttribute('data-page') === name);
    });

    /* 闭环支持：切 tab 后通知各 tab 刷新自己的列表（关注/发布联动） */
    setTimeout(function () {
      try { window.dispatchEvent(new CustomEvent('zx-tab-active', { detail: { tab: name } })); } catch (e) {}
    }, 60);
  }

  function bindTabs() {
    var tabs = document.querySelectorAll('.zx-tab');
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        route(tab.getAttribute('data-tab'));
      });
    });
  }

  function init() {
    injectIcons();
    bindTabs();
    tick();
    setInterval(tick, 30000);
    route(DEFAULT_PAGE);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

      toast('页面栈已满（最多 ' + MAX_STACK + ' 层），请先返回');
      return;

    stack.push(name);
    viewParams[name] = params || null;
    applyStack();
    afterTransition(name, params);
  }

  }
