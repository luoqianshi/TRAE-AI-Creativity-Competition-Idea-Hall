      font-size: 0.7rem; padding: 3px 10px; border-radius: 12px; background: var(--accent-light);
      color: var(--accent); font-weight: 500;

    .progress-wrap { margin: 16px 0; }

    /* Growth View */
    .room-scene {
      background: linear-gradient(180deg, #e8f5e8 0%, #f0f7f0 60%, #d4e8d4 100%);
      border-radius: var(--radius); height: 320px; position: relative; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center; padding-bottom: 30px;

    /* Achievements */
    .achieve-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .achieve-card {

      cursor: pointer; transition: all 0.2s; font-weight: 500;
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(92,184,92,0.35); }

    .btn-secondary { background: var(--bg); color: var(--muted); border: 1px solid var(--rule); }
    .btn-secondary:hover { border-color: var(--accent2); color: var(--accent); }

    /* Animations */
    @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .pop { animation: pop 0.3s ease; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .float { animation: float 3s ease-in-out infinite; }

    /* Responsive */
    @media (max-width: 600px) {

    }

    /* Before/After Slider */
    .compare-wrap { position: relative; height: 200px; border-radius: var(--radius-sm); overflow: hidden; margin-top: 12px; }

<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon">🌱</div>
        <div class="logo-text">roomBloom</div>
      </div>
      <p class="tagline">让房间整理，像养花一样治愈</p>
      <div class="stats-bar">
        <div class="stat">🌿 连续打卡 <b id="streak">3</b> 天</div>
        <div class="stat">✅ 已完成 <b id="completed">12</b> 个任务</div>
        <div class="stat">🏆 解锁成就 <b id="achievements">5</b> 个</div>
      </div>
    </header>

    <!-- Navigation -->
    <nav class="nav">
      <button class="nav-btn active" data-section="diagnosis" onclick="switchTab('diagnosis')">🔍 诊断台</button>
      <button class="nav-btn" data-section="calendar" onclick="switchTab('calendar')">📅 绽放日历</button>
      <button class="nav-btn" data-section="growth" onclick="switchTab('growth')">🌸 养成视图</button>
      <button class="nav-btn" data-section="achieve" onclick="switchTab('achieve')">🏅 成就花园</button>
    </nav>

    <!-- Diagnosis Section -->
    <section id="diagnosis" class="section active">
      <div class="card">
        <div class="card-title">🏠 选择你的房间类型</div>
        <div class="room-grid">
          <div class="room-card" data-room="bedroom" onclick="selectRoom('bedroom')">
            <div class="room-icon">🛏️</div>
            <div class="room-name">卧室</div>
            <div class="room-desc">打造舒适睡眠空间</div>
          </div>
          <div class="room-card" data-room="living" onclick="selectRoom('living')">
            <div class="room-icon">🛋️</div>
            <div class="room-name">客厅</div>
            <div class="room-desc">营造温馨会客氛围</div>
          </div>
          <div class="room-card" data-room="kitchen" onclick="selectRoom('kitchen')">
            <div class="room-icon">🍳</div>
            <div class="room-name">厨房</div>
            <div class="room-desc">整洁高效的烹饪区</div>
          </div>
          <div class="room-card" data-room="study" onclick="selectRoom('study')">
            <div class="room-icon">📚</div>
            <div class="room-name">书房</div>
            <div class="room-desc">专注力提升工作区</div>
          </div>
        </div>
      </div>

      <div class="card" id="task-card" style="display:none;">
        <div class="card-title">📋 你的专属整理方案</div>
        <div class="progress-wrap">
          <div class="progress-label"><span>整理进度</span><span id="progress-text">0%</span></div>
          <div class="progress-track"><div class="progress-fill" id="progress-bar" style="width:0%"></div></div>
        </div>
        <div class="task-list" id="task-list"></div>
      </div>
    </section>

    <!-- Calendar Section -->
    <section id="calendar" class="section">
      <div class="card">
        <div class="card-title">📅 绽放日历 · <span id="cal-month"></span></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="card">
        <div class="card-title">📌 今日任务</div>
        <div class="task-list" id="today-tasks"></div>
      </div>
    </section>

    <!-- Growth Section -->
    <section id="growth" class="section">
      <div class="card">
        <div class="card-title">🌸 你的植物成长中</div>
        <div class="room-scene">
          <div class="room-floor"></div>
          <div class="room-illust" id="room-bg">🏠</div>
          <div class="plant-container">
            <div class="plant-leaves" id="plant-leaves"></div>
            <div class="plant-stem" id="plant-stem" style="height:20px;"></div>
            <div class="flower" id="flower">
              <div class="flower-center"></div>
            </div>
            <div class="pot"></div>
          </div>
        </div>
        <div class="growth-info">
          <div class="growth-stat">植物高度<b id="plant-height">2cm</b></div>
          <div class="growth-stat">叶片数量<b id="leaf-count">0</b></div>
          <div class="growth-stat">绽放阶段<b id="bloom-stage">种子</b></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">🔄 整理前后对比</div>
        <div class="compare-wrap" id="compare-wrap">
          <div class="compare-before"><div class="room-illust">😵‍💫</div></div>
          <div class="compare-after" id="compare-after"><div class="room-illust">😌</div></div>
          <div class="compare-slider" id="compare-slider"></div>
        </div>
      </div>
    </section>

    <!-- Achievements Section -->
    <section id="achieve" class="section">
      <div class="card">
        <div class="card-title">🏅 成就花园</div>
        <div class="achieve-grid" id="achieve-grid"></div>
      </div>
      <div class="card">
        <div class="card-title">📊 整理历程</div>
        <div class="growth-info">
          <div class="growth-stat">累计整理<b id="total-time">3.5h</b></div>
          <div class="growth-stat">完成任务<b id="total-tasks">12</b></div>
          <div class="growth-stat">整洁度评分<b id="clean-score">68</b></div>
        </div>
      </div>
    </section>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">🎉 恭喜解锁！</h3>
      <p id="modal-body">你完成了第一个整理任务，植物开始发芽了！</p>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="closeModal()">太棒了！</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Data =====
    const roomTasks = {
      bedroom: [
        { text: '整理床铺，更换干净床单', tag: '基础', done: true },
        { text: '清理床头柜杂物', tag: '收纳', done: true },
        { text: '整理衣柜，分类衣物', tag: '深度', done: false },
        { text: '清扫地面灰尘', tag: '清洁', done: false },
        { text: '整理梳妆台护肤品', tag: '收纳', done: false },
      ],
      living: [
        { text: '整理沙发靠垫和毯子', tag: '基础', done: true },
        { text: '收纳茶几上的杂物', tag: '收纳', done: false },
        { text: '整理电视柜线缆', tag: '深度', done: false },
        { text: '擦拭家具表面', tag: '清洁', done: false },
        { text: '整理书架和读物', tag: '收纳', done: false },
      ],
      kitchen: [
        { text: '清洗餐具并归位', tag: '基础', done: false },
        { text: '清理台面油渍', tag: '清洁', done: false },
        { text: '整理冰箱过期食品', tag: '收纳', done: false },
        { text: '清洁灶台和油烟机', tag: '深度', done: false },
        { text: '整理调料架', tag: '收纳', done: false },
      ],
      study: [
        { text: '整理桌面文具', tag: '基础', done: false },
        { text: '分类归档文件', tag: '收纳', done: false },
        { text: '清理电子设备线缆', tag: '深度', done: false },
        { text: '擦拭显示器和键盘', tag: '清洁', done: false },
        { text: '整理书架书籍', tag: '收纳', done: false },
      ]
    };

    const achievements = [
      { icon: '🌱', name: '初次萌芽', desc: '完成第1个任务', unlocked: true },
      { icon: '🌿', name: '嫩叶初展', desc: '完成5个任务', unlocked: true },
      { icon: '🌷', name: '含苞待放', desc: '完成10个任务', unlocked: true },
      { icon: '🌸', name: '春花绽放', desc: '完成20个任务', unlocked: false },
      { icon: '🌻', name: '向阳而生', desc: '连续打卡3天', unlocked: true },
      { icon: '🌳', name: '枝繁叶茂', desc: '连续打卡7天', unlocked: false },
      { icon: '🏠', name: '一尘不染', desc: '单个房间100%完成', unlocked: false },
      { icon: '🏆', name: '整理大师', desc: '解锁所有房间', unlocked: false },
      { icon: '💎', name: '完美绽放', desc: '完成所有成就', unlocked: false },
    ];

    let currentRoom = 'bedroom';
    let tasks = JSON.parse(JSON.stringify(roomTasks[currentRoom]));

    // ===== Navigation =====
    function switchTab(section) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(section).classList.add('active');
      document.querySelector(`[data-section="${section}"]`).classList.add('active');
      if (section === 'calendar') renderCalendar();
      if (section === 'growth') updatePlant();
      if (section === 'achieve') renderAchievements();
    }

    // ===== Diagnosis =====
    function selectRoom(room) {
      currentRoom = room;
      tasks = JSON.parse(JSON.stringify(roomTasks[room]));
      document.querySelectorAll('.room-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`[data-room="${room}"]`).classList.add('selected');
      document.getElementById('task-card').style.display = 'block';
      renderTasks();
      showToast(`已选择「${roomName(room)}」，生成整理方案中...`);
      setTimeout(() => showToast('✅ 整理方案已生成！开始你的绽放之旅吧'), 800);
    }

    function roomName(key) {
      const names = { bedroom: '卧室', living: '客厅', kitchen: '厨房', study: '书房' };
      return names[key] || key;
    }

    function renderTasks() {
      const list = document.getElementById('task-list');
      const doneCount = tasks.filter(t => t.done).length;
      const pct = Math.round((doneCount / tasks.length) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').textContent = pct + '%';

      list.innerHTML = tasks.map((t, i) => `
        <div class="task-item">
          <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask(${i})">${t.done ? '✓' : ''}</div>
          <div class="task-text ${t.done ? 'done' : ''}">${t.text}</div>
          <span class="task-tag">${t.tag}</span>
        </div>
      `).join('');

      document.getElementById('completed').textContent = doneCount;
      updateStats();
    }

    function toggleTask(idx) {
      tasks[idx].done = !tasks[idx].done;
      renderTasks();
      if (tasks[idx].done) {
        showToast('🌱 任务完成！植物获得养分~');
        checkMilestones();
      }
    }

    // ===== Calendar =====
    function renderCalendar() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      document.getElementById('cal-month').textContent = `${year}年${month + 1}月`;

      const headers = ['日','一','二','三','四','五','六'];
      let html = headers.map(h => `<div class="cal-header">${h}</div>`).join('');

      for (let i = 0; i < firstDay; i++) html += `<div class="cal-day"></div>`;

      const hasTaskDays = [3, 5, 8, 12, 15, 18, 22, 25, 28];
      const doneDays = [3, 5, 8, 12];

      for (let d = 1; d <= daysInMonth; d++) {
        const isToday = d === now.getDate();
        const hasTask = hasTaskDays.includes(d);
        const done = doneDays.includes(d);
        const cls = ['cal-day', isToday ? 'today' : '', hasTask ? 'has-task' : '', done ? 'done' : ''].join(' ');
        html += `<div class="${cls}">${d}</div>`;
      }

      document.getElementById('cal-grid').innerHTML = html;

      // Today's tasks
      const todayList = document.getElementById('today-tasks');
      const todayTasks = tasks.slice(0, 3);
      todayList.innerHTML = todayTasks.map((t, i) => `
        <div class="task-item">
          <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleTask(${i}); setTimeout(()=>switchTab('calendar'),300)">${t.done ? '✓' : ''}</div>
          <div class="task-text ${t.done ? 'done' : ''}">${t.text}</div>
          <span class="task-tag">${t.tag}</span>
        </div>
      `).join('');
    }

    // ===== Growth =====
    function updatePlant() {
      const doneCount = tasks.filter(t => t.done).length;
      const pct = doneCount / tasks.length;
      const stemHeight = 20 + Math.round(pct * 120);
      document.getElementById('plant-stem').style.height = stemHeight + 'px';
      document.getElementById('plant-height').textContent = Math.round(stemHeight / 10) + 'cm';

      // Leaves
      const leafCount = Math.floor(pct * 6);
      document.getElementById('leaf-count').textContent = leafCount;
      const leavesContainer = document.getElementById('plant-leaves');
      leavesContainer.innerHTML = '';
      for (let i = 0; i < leafCount; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf show';
        leaf.style.left = (i % 2 === 0 ? -18 : 6) + 'px';
        leaf.style.top = (-10 - i * 12) + 'px';
        leaf.style.transform = `rotate(${i % 2 === 0 ? -30 : 30}deg)`;
        leavesContainer.appendChild(leaf);
      }

      // Flower
      const flower = document.getElementById('flower');
      if (pct >= 1) {
        flower.classList.add('show');
        // Add petals
        const center = flower.querySelector('.flower-center');
        center.innerHTML = '';
        for (let i = 0; i < 6; i++) {
          const petal = document.createElement('div');
          petal.className = 'petal';
          petal.style.transform = `translate(-50%, -100%) rotate(${i * 60}deg)`;
          center.appendChild(petal);
        }
      } else {
        flower.classList.remove('show');
      }

      // Stage
      const stages = ['种子', '萌芽', '幼苗', '成长', '茁壮', '含苞', '绽放'];
      const stageIdx = Math.min(Math.floor(pct * 6), 6);
      document.getElementById('bloom-stage').textContent = stages[stageIdx];
    }

    // Compare slider
    let isDragging = false;
    const compareWrap = document.getElementById('compare-wrap');
    const compareAfter = document.getElementById('compare-after');
    const compareSlider = document.getElementById('compare-slider');

    compareSlider.addEventListener('mousedown', () => isDragging = true);
    document.addEventListener('mouseup', () => isDragging = false);
    compareWrap.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = compareWrap.getBoundingClientRect();
      let x = ((e.clientX - rect.left) / rect.width) * 100;
      x = Math.max(10, Math.min(90, x));
      compareAfter.style.clipPath = `inset(0 ${100 - x}% 0 0)`;
      compareSlider.style.left = x + '%';
    });

    // ===== Achievements =====
    function renderAchievements() {
      const grid = document.getElementById('achieve-grid');
      const doneCount = tasks.filter(t => t.done).length;

      // Update unlock status
      achievements[1].unlocked = doneCount >= 5;
      achievements[2].unlocked = doneCount >= 10;
      achievements[3].unlocked = doneCount >= 20;
      achievements[6].unlocked = doneCount === tasks.length && doneCount > 0;

      grid.innerHTML = achievements.map(a => `
        <div class="achieve-card ${a.unlocked ? '' : 'locked'}">
          <div class="achieve-icon">${a.icon}</div>
          <div class="achieve-name">${a.name}</div>
          <div class="achieve-desc">${a.desc}</div>
        </div>
      `).join('');

      document.getElementById('achievements').textContent = achievements.filter(a => a.unlocked).length;
      document.getElementById('total-tasks').textContent = doneCount;
      document.getElementById('clean-score').textContent = Math.round((doneCount / tasks.length) * 100) || 0;
    }

    function checkMilestones() {
      const doneCount = tasks.filter(t => t.done).length;
      if (doneCount === 1) showModal('🌱 初次萌芽', '你完成了第一个整理任务，植物开始发芽了！');
      else if (doneCount === 5) showModal('🌿 嫩叶初展', '已完成5个任务，植物长出了嫩叶！');
      else if (doneCount === tasks.length) showModal('🌸 完美绽放', '太棒了！所有任务完成，你的植物完全绽放了！');
    }

    // ===== UI Utilities =====
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function showModal(title, body) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function updateStats() {
      const doneCount = tasks.filter(t => t.done).length;
      document.getElementById('completed').textContent = doneCount;
      document.getElementById('achievements').textContent = achievements.filter(a => a.unlocked).length;
    }

    // ===== Init =====
    selectRoom('bedroom');
  </script>
</body>
</html>
