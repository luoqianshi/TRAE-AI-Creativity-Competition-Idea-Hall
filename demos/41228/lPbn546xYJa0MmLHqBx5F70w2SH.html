<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>专升本备考助手</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937}
header{background:linear-gradient(135deg,#4f46e5,#06b6d4);color:white;padding:36px 20px;text-align:center}
header h1{margin:0;font-size:32px}
header p{opacity:.9}
.container{max-width:1100px;margin:auto;padding:24px}
.card{background:white;border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
label{display:block;margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:15px}
button{border:0;border-radius:12px;padding:12px 18px;background:#4f46e5;color:white;font-weight:700;cursor:pointer;margin-top:14px}
button:hover{background:#4338ca}
.badge{display:inline-block;background:#eef2ff;color:#4338ca;padding:6px 10px;border-radius:999px;font-size:13px;margin:4px}
.plan-item{border-left:5px solid #4f46e5;padding:12px;background:#f9fafb;border-radius:12px;margin:10px 0}
.progress-wrap{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#06b6d4)}
.chat{background:#f9fafb;border-radius:14px;padding:14px;min-height:120px}
.ai{background:#eef2ff;padding:12px;border-radius:12px;margin-top:10px}
footer{text-align:center;color:#6b7280;padding:24px}
</style>
</head>
<body>

<header>
  <h1>专升本备考助手</h1>
  <p>AI 陪你上岸，一站式备考规划与学习工具</p>
  <span class="badge">智能规划</span>
  <span class="badge">知识点问答</span>
  <span class="badge">进度追踪</span>
</header>

<div class="container">

  <div class="card">
    <h2>🎯 智能备考规划</h2>
    <div class="grid">
      <div>
        <label>目标院校</label>
        <input id="school" placeholder="例如：XX大学">
      </div>
      <div>
        <label>目标专业</label>
        <input id="major" placeholder="例如：计算机科学与技术">
      </div>
      <div>
        <label>距离考试天数</label>
        <input id="days" type="number" placeholder="例如：120">
      </div>
      <div>
        <label>基础水平</label>
        <select id="level">
          <option>基础较弱</option>
          <option>基础一般</option>
          <option>基础较好</option>
        </select>
      </div>
    </div>
    <button onclick="generatePlan()">生成我的备考计划</button>
    <div id="plan"></div>
  </div>

  <div class="card">
    <h2>🤖 AI 知识点问答</h2>
    <label>选择科目</label>
    <select id="subject">
      <option>英语</option>
      <option>高等数学</option>
      <option>大学语文</option>
      <option>专业课</option>
    </select>
    <label>输入你的问题</label>
    <textarea id="question" rows="4" placeholder="例如：英语长难句怎么分析？"></textarea>
    <button onclick="askAI()">向 AI 提问</button>
    <div class="chat" id="answer">AI 老师会在这里为你讲解知识点，并配合例题帮助理解。</div>
  </div>

  <div class="card">
    <h2>📊 学习进度追踪</h2>
    <div class="grid">
      <div>
        <label>今日学习时长（小时）</label>
        <input id="hours" type="number" step="0.5">
      </div>
      <div>
        <label>今日完成科目</label>
        <input id="doneSubject" placeholder="例如：英语、高数">
      </div>
    </div>
    <button onclick="saveProgress()">记录今日学习</button>
    <p>累计学习时长：<b id="totalHours">0</b> 小时</p>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p id="encourage">坚持打卡，你正在离上岸更近一步。</p>
  </div>

  <div class="card">
    <h2>🌱 产品价值</h2>
    <p>
      专升本备考助手面向正在备战专升本的学生与职场提升人群，
      通过 AI 个性化规划、知识点讲解和学习进度可视化，帮助用户减少迷茫感，
      提升复习效率，缓解备考焦虑。
    </p>
  </div>

</div>

<footer>
  专升本是一场孤独的战役，但你不是一个人在坚持。
</footer>

<script>
let total = Number(localStorage.getItem("studyHours") || 0);
updateProgress();

function generatePlan(){
  const school = document.getElementById("school").value || "目标院校";
  const major = document.getElementById("major").value || "目标专业";
  const days = Number(document.getElementById("days").value || 90);
  const level = document.getElementById("level").value;

  const base = Math.floor(days * 0.45);
  const strengthen = Math.floor(days * 0.35);
  const sprint = days - base - strengthen;

  document.getElementById("plan").innerHTML = `
    <h3>你的专属备考方案</h3>
    <p>目标：${school} · ${major}｜当前基础：${level}｜剩余 ${days} 天</p>
    <div class="plan-item"><b>第一阶段：基础轮（${base}天）</b><br>梳理教材框架，完成英语词汇、高数基础公式、语文重点篇目和专业课核心概念。</div>
    <div class="plan-item"><b>第二阶段：强化轮（${strengthen}天）</b><br>按题型专项训练，整理错题本，每周进行一次阶段测试。</div>
    <div class="plan-item"><b>第三阶段：冲刺轮（${sprint}天）</b><br>真题模拟、查漏补缺、背诵高频考点，调整作息和考试状态。</div>
  `;
}

function askAI(){
  const subject = document.getElementById("subject").value;
  const q = document.getElementById("question").value || "请帮我讲解一个重要知识点";

  const templates = {
    "英语":"建议先判断句子主干，再分析从句、非谓语和修饰成分。例题：The book that you recommended yesterday is very useful. 主干是 The book is useful。",
    "高等数学":"解题时先判断题型，再选择公式。例题：求函数极限时，可优先尝试代入、因式分解、洛必达法则。",
    "大学语文":"复习时要抓作者、作品、主题、艺术特色。答题要做到观点明确、结合文本、语言规范。",
    "专业课":"建议建立知识框架，把零散概念放进章节体系中理解，再通过真题确认高频考点。"
  };

  document.getElementById("answer").innerHTML = `
    <div class="ai">
      <b>问题：</b>${q}<br><br>
      <b>AI 讲解：</b>${templates[subject]}<br><br>
      <b>学习建议：</b>把这个知识点整理进错题本，明天复习时再做一次同类题。
    </div>
  `;
}

function saveProgress(){
  const h = Number(document.getElementById("hours").value || 0);
  total += h;
  localStorage.setItem("studyHours", total);
  updateProgress();
}

function updateProgress(){
  document.getElementById("totalHours").innerText = total;
  const percent = Math.min(total / 200 * 100, 100);
  document.getElementById("progressBar").style.width = percent + "%";

  if(total >= 100){
    document.getElementById("encourage").innerText = "太棒了！你已经完成了大量积累，继续冲刺上岸！";
  }else if(total >= 30){
    document.getElementById("encourage").innerText = "状态不错，保持节奏，复习成果正在显现。";
  }
}
</script>

</body>
</html>
