<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邻攀 - 附近攀岩馆查询与约课 Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            font-size: 14px;
            padding-bottom: 80px;
        }
        .app-container {
            max-width: 420px;
            margin: 0 auto;
            background: #f5f7fa;
            min-height: 100vh;
        }
        /* 顶部导航 */
        .header {
            background: #2563eb;
            color: #fff;
            padding: 40px 20px 20px;
            border-radius: 0 0 20px 20px;
        }
        .header h1 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .search-box {
            background: #fff;
            border-radius: 30px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            padding-left: 8px;
        }
        /* 功能标签 */
        .tab-wrap {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            background: #fff;
            margin: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .tab-item {
            color: #666;
            font-size: 13px;
        }
        .tab-item.active {
            color: #2563eb;
            font-weight: bold;
        }
        /* 场馆卡片 */
        .card {
            background: #fff;
            margin: 15px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .card-img {
            width: 100%;
            height: 140px;
            background: #cce0ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-size: 16px;
        }
        .card-body {
            padding: 15px;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .distance {
            color: #10b981;
            font-size: 12px;
        }
        .card-desc {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .card-tag {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .tag {
            background: #f0f6ff;
            color: #2563eb;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .card-btn {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-outline {
            border: 1px solid #2563eb;
            color: #2563eb;
        }
        .btn-fill {
            background: #2563eb;
            color: #fff;
        }
        /* 底部导航 */
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #eee;
        }
        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        .nav-item.active {
            color: #2563eb;
        }
        /* 约课弹窗模拟 */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99;
            align-items: center;
            justify-content: center;
        }
        .popup-box {
            width: 85%;
            max-width: 360px;
            background: #fff;
            border-radius: 16px;
            padding: 20px;
        }
        .popup-box h3 {
            text-align: center;
            margin-bottom: 15px;
        }
        .course-item {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .popup-btn {
            margin-top: 15px;
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 顶部头部 -->
    <div class="header">
        <h1>邻攀｜找到身边的攀岩馆</h1>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" placeholder="搜索攀岩馆 / 课程">
        </div>
    </div>

    <!-- 功能分类 -->
    <div class="tab-wrap">
        <div class="tab-item active">附近场馆</div>
        <div class="tab-item">课程预约</div>
        <div class="tab-item">会员中心</div>
        <div class="tab-item">攀岩组队</div>
    </div>

    <!-- 场馆列表 Demo -->
    <div class="card">
        <div class="card-img">攀岩场馆实景图</div>
        <div class="card-body">
            <div class="card-title">
                <span>极限攀岩运动空间（万象店）</span>
                <span class="distance">0.8km</span>
            </div>
            <div class="card-desc">室内抱石、难度攀岩、专业教练执教，适合新手入门与进阶训练</div>
            <div class="card-tag">
                <span class="tag">新手友好</span>
                <span class="tag">可约课</span>
                <span class="tag">有年卡</span>
            </div>
            <div class="card-btn">
                <div class="btn btn-outline" onclick="openPopup()">查看课程</div>
                <div class="btn btn-fill">导航前往</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-img">攀岩场馆实景图</div>
        <div class="card-body">
            <div class="card-title">
                <span>城市攀岩俱乐部（科创店）</span>
                <span class="distance">2.1km</span>
            </div>
            <div class="card-desc">专业赛事级岩壁、团建场地齐全，支持团体预约、私教一对一</div>
            <div class="card-tag">
                <span class="tag">团建优选</span>
                <span class="tag">专业私教</span>
                <span class="tag">月卡可用</span>
            </div>
            <div class="card-btn">
                <div class="btn btn-outline" onclick="openPopup()">查看课程</div>
                <div class="btn btn-fill">导航前往</div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="footer-nav">
        <div class="nav-item active">首页</div>
        <div class="nav-item">约课</div>
        <div class="nav-item">会员</div>
        <div class="nav-item">我的</div>
    </div>

    <!-- 约课弹窗 -->
    <div class="popup" id="coursePopup">
        <div class="popup-box">
            <h3>可选课程预约</h3>
            <div class="course-item">
                <strong>新手入门体验课</strong>
                <p>适合零基础 | 90分钟 | 含装备</p>
            </div>
            <div class="course-item">
                <strong>进阶攀岩团课</strong>
                <p>适合有基础 | 120分钟 | 小班教学</p>
            </div>
            <div class="course-item">
                <strong>一对一私教</strong>
                <p>专属指导 | 定制训练计划</p>
            </div>
            <button class="popup-btn" onclick="closePopup()">确认预约（Demo）</button>
        </div>
    </div>
</div>

<script>
    // 简单弹窗交互 Demo
    function openPopup(){
        document.getElementById("coursePopup").style.display = "flex";
    }
    function closePopup(){
        document.getElementById("coursePopup").style.display = "none";
        alert("预约成功！Demo 交互完成");
    }
</script>

</body>
</html>
