<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>动物岛英语冒险 - 幼儿英语启蒙互动学习小游戏</title>
    <style>
        :root {
            --primary: #19c8b9;
            --primary-hover: #3dd4c6;
            --primary-active: #11a89b;
            --primary-bg: #e6f9f6;
            --text: #794f27;
            --text-body: #725d42;
            --text-secondary: #9f927d;
            --bg: #f8f8f0;
            --bg-content: rgb(247, 243, 223);
            --border: #c4b89e;
            --border-hover: #a89878;
            --border-strong: #9f927d;
            --success: #6fba2c;
            --warning: #f5c31c;
            --error: #e05a5a;
            --focus-yellow: #ffcc00;
            --shadow-btn: #bdaea0;
            --r-sm: 12px;
            --r-base: 18px;
            --r-lg: 24px;
            --r-pill: 50px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
            --d-base: 0.25s;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', 'Noto Sans SC', -apple-system, sans-serif;
            font-weight: 500;
            color: var(--text-body);
            background: var(--bg);
            min-height: 100vh;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            padding: 20px;
        }

        .header h1 {
            color: var(--text);
            font-weight: 800;
            font-size: 2.5rem;
            letter-spacing: 0.02em;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .tabs {
            background: var(--bg-content);
            border: 2px solid var(--border-strong);
            border-radius: var(--r-lg);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .tabs-list {
            display: flex;
            padding: 16px;
            gap: 6px;
            background: rgba(255,255,255,0.6);
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
        }

        .tab-item {
            padding: 8px 16px;
            border-radius: var(--r-pill);
            color: var(--text-body);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--d-base) var(--ease);
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 14px;
        }

        .tab-item:hover {
            background: rgba(25,200,185,0.1);
        }

        .tab-item.active {
            background: var(--primary);
            color: #fff;
            font-weight: 700;
        }

        .tabs-content {
            padding: 24px;
        }

        .card {
            background: var(--bg-content);
            padding: 20px 24px;
            border-radius: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(114,93,66,0.1);
        }

        .card-pattern {
            background:
                radial-gradient(circle, rgba(25, 200, 185, 0.18) 1.5px, transparent 1.5px) 0 0/28px 28px,
                radial-gradient(circle, rgba(100, 220, 210, 0.12) 1px, transparent 1px) 7px 7px/14px 14px,
                #e6f9f6;
            border: 1.5px solid #19c8b9;
            color: #0a6b62;
        }

        .card-app-yellow {
            background:
                radial-gradient(circle, rgba(247, 205, 103, 0.18) 1.5px, transparent 1.5px) 0 0/28px 28px,
                radial-gradient(circle, rgba(255, 220, 150, 0.12) 1px, transparent 1px) 7px 7px/14px 14px,
                #fff8e0;
            border: 1.5px solid #f7cd67;
            color: #8a6010;
        }

        .card-app-pink {
            background:
                radial-gradient(circle, rgba(248, 166, 178, 0.18) 1.5px, transparent 1.5px) 0 0/28px 28px,
                radial-gradient(circle, rgba(255, 200, 210, 0.12) 1px, transparent 1px) 7px 7px/14px 14px,
                #fde4e8;
            border: 1.5px solid #f8a6b2;
            color: #a85565;
        }

        .card-app-green {
            background:
                radial-gradient(circle, rgba(138, 198, 138, 0.18) 1.5px, transparent 1.5px) 0 0/28px 28px,
                radial-gradient(circle, rgba(180, 220, 180, 0.12) 1px, transparent 1px) 7px 7px/14px 14px,
                #e8f5e8;
            border: 1.5px solid #8ac68a;
            color: #205020;
        }

        .card-app-blue {
            background:
                radial-gradient(circle, rgba(136, 157, 240, 0.18) 1.5px, transparent 1.5px) 0 0/28px 28px,
                radial-gradient(circle, rgba(180, 200, 255, 0.12) 1px, transparent 1px) 7px 7px/14px 14px,
                #e8ecff;
            border: 1.5px solid #889df0;
            color: #3040a0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.02em;
            border: 2px solid transparent;
            border-radius: var(--r-pill);
            cursor: pointer;
            transition: all var(--d-base) var(--ease);
            user-select: none;
            outline: none;
        }

        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .btn-primary {
            height: 45px;
            padding: 0 24px;
            font-size: 14px;
            color: var(--text);
            background: var(--bg);
            border-color: var(--bg);
            box-shadow: 0 5px 0 0 var(--shadow-btn);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 0 0 var(--shadow-btn);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            box-shadow: 0 1px 0 0 var(--shadow-btn);
            transform: translateY(2px);
        }

        .btn-default {
            height: 45px;
            padding: 0 24px;
            font-size: 14px;
            color: var(--text-body);
            background: var(--bg);
            border-color: var(--border-strong);
            box-shadow: 0 2px 4px 0 rgba(61,52,40,0.06);
        }

        .btn-default:hover {
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 3px 10px 0 rgba(61,52,40,0.10);
            transform: translateY(-1px);
        }

        .btn-large {
            height: 48px;
            padding: 0 32px;
            font-size: 16px;
            border-radius: var(--r-lg);
        }

        .btn-success {
            height: 45px;
            padding: 0 24px;
            font-size: 14px;
            color: #fff;
            background: var(--success);
            border-color: var(--success);
            box-shadow: 0 5px 0 0 #5a9e1e;
        }

        .btn-success:hover {
            box-shadow: 0 6px 0 0 #5a9e1e;
            transform: translateY(-1px);
        }

        .letter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .letter-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-content);
            border: 2px solid var(--border);
            border-radius: var(--r-base);
            cursor: pointer;
            transition: all var(--d-base) var(--ease);
            user-select: none;
        }

        .letter-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(25,200,185,0.2);
        }

        .letter-card.active {
            background: var(--primary);
            border-color: var(--primary-active);
            color: #fff;
        }

        .letter-card.learned {
            background: var(--success);
            border-color: #5a9e1e;
            color: #fff;
        }

        .letter-card .letter {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
        }

        .letter-card .word {
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #f0ece2;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border);
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            border-radius: 8px;
            transition: width 0.5s ease;
        }

        .welcome-section {
            text-align: center;
            padding: 20px;
        }

        .welcome-animals {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-content);
            padding: 16px 24px;
            border-radius: var(--r-base);
            margin-bottom: 16px;
            border: 2px solid var(--border);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1rem;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .match-item {
            padding: 20px;
            background: var(--bg-content);
            border: 2px solid var(--border);
            border-radius: var(--r-base);
            text-align: center;
            cursor: pointer;
            transition: all var(--d-base) var(--ease);
        }

        .match-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .match-item.selected {
            background: var(--primary-bg);
            border-color: var(--primary);
        }

        .match-item.correct {
            background: #e6f9e6;
            border-color: var(--success);
        }

        .match-item.wrong {
            background: #ffe6e6;
            border-color: var(--error);
        }

        .match-item .emoji {
            font-size: 3rem;
            margin-bottom: 8px;
        }

        .match-item .text {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .pronunciation-card {
            text-align: center;
            padding: 30px;
        }

        .pronunciation-card .emoji {
            font-size: 4rem;
            margin-bottom: 16px;
        }

        .pronunciation-card .word {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .pronunciation-card .phonetic {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(40, 30, 20, 0.45);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-content);
            padding: 48px;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .title-ribbon {
            display: inline-flex;
            align-items: center;
            height: 2.5em;
            padding: 0 1.6em;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.04em;
            position: relative;
            margin-bottom: 16px;
        }

        .title-ribbon .ribbon-text {
            font-weight: 900;
            z-index: 4;
            position: relative;
        }

        .title-ribbon .ribbon-bg {
            position: absolute;
            inset: 0 0.1em;
            border-radius: 0.2em;
            z-index: 3;
            transform: perspective(11.5em) rotateX(3deg);
        }

        .title-ribbon-blue .ribbon-bg { background: #889df0; }
        .title-ribbon-blue .ribbon-text { color: #fff; }

        .title-ribbon-pink .ribbon-bg { background: #f8a6b2; }
        .title-ribbon-pink .ribbon-text { color: #fff; }

        .title-ribbon-yellow .ribbon-bg { background: #f7cd67; }
        .title-ribbon-yellow .ribbon-text { color: #725d42; }

        .title-ribbon-green .ribbon-bg { background: #8ac68a; }
        .title-ribbon-green .ribbon-text { color: #fff; }

        .feedback {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: var(--r-pill);
            font-weight: 600;
            z-index: 1001;
            animation: slideDown 0.3s ease;
        }

        .feedback-success { background: var(--success); color: #fff; }
        .feedback-error { background: var(--error); color: #fff; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-bounce { animation: bounce 1s ease-in-out infinite; }

        .goal-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .goal-card {
            text-align: center;
            padding: 20px;
        }

        .goal-card .icon { font-size: 2rem; margin-bottom: 8px; }
        .goal-card .label { font-weight: 700; }

        .complete-section {
            text-align: center;
            padding: 40px;
        }

        .complete-section .big-emoji { font-size: 4rem; margin-bottom: 20px; }
        .complete-section h2 { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 12px; }
        .complete-section p { font-size: 1.1rem; margin-bottom: 16px; }

        .wallet {
            display: inline-block;
            background: #b3a046;
            padding: 12px 24px;
            border-radius: 999px;
            color: #fff;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 0.04em;
            text-shadow: 0 2px 0 rgba(91,78,30,0.55);
            box-shadow: 0 6px 14px rgba(91,78,30,0.18);
        }

        @media (max-width: 768px) {
            .page { padding: 16px; }
            .header h1 { font-size: 1.8rem; }
            .letter-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
            .letter-card .letter { font-size: 1.5rem; }
            .match-grid { grid-template-columns: 1fr; }
            .welcome-title { font-size: 1.5rem; }
            .tabs-list { justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============================================
        // Game Data
        // ============================================
        var LETTERS_DATA = [
            { letter: 'A', word: 'Apple', emoji: '🍎' },
            { letter: 'B', word: 'Banana', emoji: '🍌' },
            { letter: 'C', word: 'Cat', emoji: '🐱' },
            { letter: 'D', word: 'Dog', emoji: '🐶' },
            { letter: 'E', word: 'Elephant', emoji: '🐘' },
            { letter: 'F', word: 'Fish', emoji: '🐟' },
            { letter: 'G', word: 'Grape', emoji: '🍇' },
            { letter: 'H', word: 'House', emoji: '🏠' },
            { letter: 'I', word: 'Ice cream', emoji: '🍦' },
            { letter: 'J', word: 'Juice', emoji: '🧃' },
            { letter: 'K', word: 'Kite', emoji: '🪁' },
            { letter: 'L', word: 'Lion', emoji: '🦁' },
            { letter: 'M', word: 'Moon', emoji: '🌙' },
            { letter: 'N', word: 'Nest', emoji: '🪹' },
            { letter: 'O', word: 'Orange', emoji: '🍊' },
            { letter: 'P', word: 'Panda', emoji: '🐼' },
            { letter: 'Q', word: 'Queen', emoji: '👸' },
            { letter: 'R', word: 'Rainbow', emoji: '🌈' },
            { letter: 'S', word: 'Sun', emoji: '☀️' },
            { letter: 'T', word: 'Tiger', emoji: '🐯' },
            { letter: 'U', word: 'Umbrella', emoji: '☂️' },
            { letter: 'V', word: 'Violin', emoji: '🎻' },
            { letter: 'W', word: 'Whale', emoji: '🐋' },
            { letter: 'X', word: 'Xylophone', emoji: '🎵' },
            { letter: 'Y', word: 'Yacht', emoji: '⛵' },
            { letter: 'Z', word: 'Zebra', emoji: '🦓' }
        ];

        var MATCHING_PAIRS = [
            { emoji: '🐶', word: 'Dog', options: ['Dog', 'Cat', 'Bird', 'Fish'] },
            { emoji: '🐱', word: 'Cat', options: ['Cat', 'Dog', 'Tiger', 'Lion'] },
            { emoji: '🍎', word: 'Apple', options: ['Apple', 'Banana', 'Orange', 'Grape'] },
            { emoji: '🍌', word: 'Banana', options: ['Banana', 'Apple', 'Mango', 'Peach'] },
            { emoji: '🏠', word: 'House', options: ['House', 'School', 'Park', 'Shop'] },
            { emoji: '☀️', word: 'Sun', options: ['Sun', 'Moon', 'Star', 'Cloud'] },
            { emoji: '🐘', word: 'Elephant', options: ['Elephant', 'Lion', 'Tiger', 'Bear'] },
            { emoji: '🌈', word: 'Rainbow', options: ['Rainbow', 'Cloud', 'Rain', 'Snow'] }
        ];

        var PRONUNCIATION_WORDS = [
            { word: 'Hello', emoji: '👋', phonetic: '/həˈloʊ/' },
            { word: 'Thank you', emoji: '🙏', phonetic: '/θæŋk juː/' },
            { word: 'Goodbye', emoji: '👋', phonetic: '/ɡʊdˈbaɪ/' },
            { word: 'Please', emoji: '😊', phonetic: '/pliːz/' },
            { word: 'Sorry', emoji: '😔', phonetic: '/ˈsɒri/' },
            { word: 'Yes', emoji: '✅', phonetic: '/jes/' },
            { word: 'No', emoji: '❌', phonetic: '/noʊ/' },
            { word: 'Love', emoji: '❤️', phonetic: '/lʌv/' }
        ];

        // ============================================
        // App State
        // ============================================
        var state = {
            activeTab: 'welcome',
            totalScore: 0,
            learnedLetters: [],
            selectedLetter: null,
            matchingIndex: 0,
            matchingScore: 0,
            selectedOption: null,
            matchResult: null,
            pronunciationIndex: 0,
            pronunciationScore: 0,
            isListening: false,
            showModal: false,
            feedback: null
        };

        // ============================================
        // Helper Functions
        // ============================================
        function $(id) { return document.getElementById(id); }

        function render() {
            var root = $('root');
            root.innerHTML = '';

            // Feedback
            if (state.feedback) {
                var feedbackEl = document.createElement('div');
                feedbackEl.className = 'feedback feedback-' + state.feedback.type;
                feedbackEl.textContent = state.feedback.message;
                root.appendChild(feedbackEl);
                setTimeout(function() {
                    state.feedback = null;
                    if (feedbackEl.parentNode) feedbackEl.parentNode.removeChild(feedbackEl);
                }, 2000);
            }

            var page = document.createElement('div');
            page.className = 'page';

            // Header
            var header = document.createElement('div');
            header.className = 'header';
            header.innerHTML = '<h1>🏝️ 动物岛英语冒险</h1><p>在可爱的动物朋友陪伴下，快乐学习英语！</p>';
            page.appendChild(header);

            // Stats bar
            var statsBar = document.createElement('div');
            statsBar.className = 'stats-bar';
            statsBar.innerHTML = '<div class="stat-item">⭐ 总得分: ' + state.totalScore + '</div>' +
                '<div class="wallet">🪙 ' + state.totalScore + '</div>';
            page.appendChild(statsBar);

            // Tabs
            var tabs = document.createElement('div');
            tabs.className = 'tabs';

            var tabsList = document.createElement('div');
            tabsList.className = 'tabs-list';
            var tabItems = [
                { key: 'welcome', label: '🏠 首页' },
                { key: 'letters', label: '🔤 字母学习' },
                { key: 'matching', label: '🎯 单词配对' },
                { key: 'pronunciation', label: '🎤 发音练习' }
            ];
            tabItems.forEach(function(item) {
                var btn = document.createElement('button');
                btn.className = 'tab-item' + (state.activeTab === item.key ? ' active' : '');
                btn.textContent = item.label;
                btn.onclick = function() {
                    state.activeTab = item.key;
                    render();
                };
                tabsList.appendChild(btn);
            });
            tabs.appendChild(tabsList);

            var tabsContent = document.createElement('div');
            tabsContent.className = 'tabs-content';

            // Render content based on active tab
            if (state.activeTab === 'welcome') {
                renderWelcome(tabsContent);
            } else if (state.activeTab === 'letters') {
                renderLetters(tabsContent);
            } else if (state.activeTab === 'matching') {
                renderMatching(tabsContent);
            } else if (state.activeTab === 'pronunciation') {
                renderPronunciation(tabsContent);
            }

            tabs.appendChild(tabsContent);
            page.appendChild(tabs);
            root.appendChild(page);

            // Modal
            if (state.showModal) {
                renderModal(root);
            }
        }

        function renderWelcome(container) {
            var section = document.createElement('div');
            section.className = 'welcome-section';
            section.innerHTML = '<div class="welcome-animals animate-bounce">🐱 🐶 🐰 🐻 🦊</div>' +
                '<h2 class="welcome-title">欢迎来到动物岛英语冒险！</h2>' +
                '<p class="welcome-subtitle">在可爱的动物朋友陪伴下，一起快乐学习英语吧！这里有字母学习、单词配对、发音练习等有趣的游戏哦！</p>';

            var btnGroup = document.createElement('div');
            btnGroup.style.cssText = 'display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:24px 0';

            var btn1 = createButton('开始字母学习 A B C', 'btn btn-primary btn-large', function() {
                state.activeTab = 'letters';
                render();
            });
            btnGroup.appendChild(btn1);

            var btn2 = createButton('单词配对游戏', 'btn btn-default btn-large', function() {
                state.activeTab = 'matching';
                render();
            });
            btnGroup.appendChild(btn2);

            var btn3 = createButton('发音练习', 'btn btn-default btn-large', function() {
                state.activeTab = 'pronunciation';
                render();
            });
            btnGroup.appendChild(btn3);
            section.appendChild(btnGroup);

            // Goals
            var titleDiv = document.createElement('div');
            titleDiv.style.marginTop = '32px';
            titleDiv.innerHTML = '<div class="title-ribbon title-ribbon-blue"><div class="ribbon-bg"></div><span class="ribbon-text">今日学习目标</span></div>';

            var goalCards = document.createElement('div');
            goalCards.className = 'goal-cards';
            goalCards.innerHTML = '<div class="card card-app-pink goal-card"><div class="icon">🔤</div><div class="label">学习26个字母</div></div>' +
                '<div class="card card-app-yellow goal-card"><div class="icon">🎯</div><div class="label">完成8组配对</div></div>' +
                '<div class="card card-app-green goal-card"><div class="icon">🎤</div><div class="label">练习8个单词发音</div></div>';
            titleDiv.appendChild(goalCards);
            section.appendChild(titleDiv);

            container.appendChild(section);
        }

        function renderLetters(container) {
            // Title
            var titleDiv = document.createElement('div');
            titleDiv.innerHTML = '<div class="title-ribbon title-ribbon-blue"><div class="ribbon-bg"></div><span class="ribbon-text">🔤 字母学习</span></div>';
            container.appendChild(titleDiv);

            // Progress
            var progressDiv = document.createElement('div');
            progressDiv.innerHTML = '<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-weight:600">学习进度</span><span style="font-weight:600;color:var(--primary)">' + state.learnedLetters.length + '/26</span></div>';
            var progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';
            var progressFill = document.createElement('div');
            progressFill.className = 'progress-fill';
            progressFill.style.width = (state.learnedLetters.length / 26 * 100) + '%';
            progressBar.appendChild(progressFill);
            progressDiv.appendChild(progressBar);
            container.appendChild(progressDiv);

            // Letter grid
            var grid = document.createElement('div');
            grid.className = 'letter-grid';
            LETTERS_DATA.forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'letter-card';
                if (state.learnedLetters.indexOf(item.letter) >= 0) {
                    card.className += ' learned';
                }
                if (state.selectedLetter && state.selectedLetter.letter === item.letter) {
                    card.className += ' active';
                }
                card.innerHTML = '<div class="letter">' + item.letter + '</div><div class="word">' + item.word + '</div>';
                card.onclick = function() {
                    state.selectedLetter = item;
                    if (state.learnedLetters.indexOf(item.letter) < 0) {
                        state.learnedLetters.push(item.letter);
                        state.feedback = { message: '太棒了！你学会了字母 ' + item.letter + '！', type: 'success' };
                    }
                    render();
                };
                grid.appendChild(card);
            });
            container.appendChild(grid);

            // Selected letter detail
            if (state.selectedLetter) {
                var detail = document.createElement('div');
                detail.className = 'card card-pattern';
                detail.style.cssText = 'text-align:center;margin-top:20px';
                detail.innerHTML = '<div style="font-size:3rem;margin-bottom:12px">' + state.selectedLetter.emoji + '</div>' +
                    '<div style="font-size:2rem;font-weight:800;margin-bottom:8px">' + state.selectedLetter.letter + '</div>' +
                    '<div style="font-size:1.5rem;font-weight:600">' + state.selectedLetter.word + '</div>';
                container.appendChild(detail);
            }

            // Complete button
            if (state.learnedLetters.length === 26) {
                var completeDiv = document.createElement('div');
                completeDiv.style.cssText = 'text-align:center;margin-top:24px';
                var completeBtn = createButton('完成字母学习！进入配对游戏 🎉', 'btn btn-success btn-large', function() {
                    state.totalScore += 26;
                    state.activeTab = 'matching';
                    render();
                });
                completeDiv.appendChild(completeBtn);
                container.appendChild(completeDiv);
            }
        }

        function renderMatching(container) {
            var pair = MATCHING_PAIRS[state.matchingIndex];

            // Title
            var titleDiv = document.createElement('div');
            titleDiv.innerHTML = '<div class="title-ribbon title-ribbon-yellow"><div class="ribbon-bg"></div><span class="ribbon-text">🎯 单词配对</span></div>';
            container.appendChild(titleDiv);

            if (state.matchingIndex >= MATCHING_PAIRS.length) {
                // Game complete
                var completeDiv = document.createElement('div');
                completeDiv.className = 'complete-section';
                completeDiv.innerHTML = '<div class="big-emoji">🎉</div>' +
                    '<h2>恭喜完成配对游戏！</h2>' +
                    '<p>你答对了 ' + state.matchingScore + '/' + MATCHING_PAIRS.length + ' 题！</p>' +
                    '<div class="wallet">⭐ ' + (state.matchingScore * 10) + '</div>';
                var continueBtn = createButton('继续学习发音 🎤', 'btn btn-success btn-large', function() {
                    state.totalScore += state.matchingScore * 10;
                    state.activeTab = 'pronunciation';
                    render();
                });
                continueBtn.style.marginTop = '20px';
                completeDiv.appendChild(continueBtn);
                container.appendChild(completeDiv);
                return;
            }

            // Stats
            var statsDiv = document.createElement('div');
            statsDiv.style.cssText = 'display:flex;justify-content:space-between;margin-bottom:16px';
            statsDiv.innerHTML = '<div class="stat-item">⭐ 得分: ' + state.matchingScore + '</div>' +
                '<div class="stat-item">📝 题目: ' + (state.matchingIndex + 1) + '/' + MATCHING_PAIRS.length + '</div>';
            container.appendChild(statsDiv);

            // Question card
            var questionCard = document.createElement('div');
            questionCard.className = 'card card-pattern';
            questionCard.style.cssText = 'text-align:center;margin-bottom:20px';
            questionCard.innerHTML = '<div style="font-size:4rem;margin-bottom:12px">' + pair.emoji + '</div>' +
                '<p style="font-size:1.2rem;font-weight:600">这个图片对应的英文单词是什么？</p>';
            container.appendChild(questionCard);

            // Options
            var optionsGrid = document.createElement('div');
            optionsGrid.className = 'match-grid';
            pair.options.forEach(function(option) {
                var item = document.createElement('div');
                item.className = 'match-item';
                if (state.selectedOption === option) {
                    item.className += state.matchResult === 'correct' ? ' correct' : ' wrong';
                }
                item.innerHTML = '<div class="text">' + option + '</div>';
                item.onclick = function() {
                    if (state.selectedOption) return;
                    state.selectedOption = option;
                    if (option === pair.word) {
                        state.matchResult = 'correct';
                        state.matchingScore++;
                        state.feedback = { message: '正确！太聪明了！🎉', type: 'success' };
                        setTimeout(function() {
                            state.matchingIndex++;
                            state.selectedOption = null;
                            state.matchResult = null;
                            render();
                        }, 1000);
                    } else {
                        state.matchResult = 'wrong';
                        state.feedback = { message: '再想想哦！💪', type: 'error' };
                        setTimeout(function() {
                            state.selectedOption = null;
                            state.matchResult = null;
                            render();
                        }, 1000);
                    }
                    render();
                };
                optionsGrid.appendChild(item);
            });
            container.appendChild(optionsGrid);
        }

        function renderPronunciation(container) {
            var word = PRONUNCIATION_WORDS[state.pronunciationIndex];

            // Title
            var titleDiv = document.createElement('div');
            titleDiv.innerHTML = '<div class="title-ribbon title-ribbon-green"><div class="ribbon-bg"></div><span class="ribbon-text">🎤 发音练习</span></div>';
            container.appendChild(titleDiv);

            if (state.pronunciationIndex >= PRONUNCIATION_WORDS.length) {
                // Complete
                var completeDiv = document.createElement('div');
                completeDiv.className = 'complete-section';
                completeDiv.innerHTML = '<div class="big-emoji">🎉 🐱 🎉</div>' +
                    '<h2>恭喜完成所有学习！</h2>' +
                    '<p>太棒了！你完成了今天的所有学习任务！</p>' +
                    '<p>你获得了 <strong style="color:var(--primary)">' + state.totalScore + '</strong> 个星星奖励！</p>' +
                    '<div class="wallet">⭐ ' + state.totalScore + '</div>';
                container.appendChild(completeDiv);
                return;
            }

            // Stats
            var statsDiv = document.createElement('div');
            statsDiv.style.cssText = 'display:flex;justify-content:space-between;margin-bottom:16px';
            statsDiv.innerHTML = '<div class="stat-item">🎤 练习: ' + (state.pronunciationIndex + 1) + '/' + PRONUNCIATION_WORDS.length + '</div>' +
                '<div class="stat-item">⭐ 得分: ' + state.pronunciationScore + '</div>';
            container.appendChild(statsDiv);

            // Pronunciation card
            var pronCard = document.createElement('div');
            pronCard.className = 'card card-app-blue pronunciation-card';
            pronCard.innerHTML = '<div class="emoji">' + word.emoji + '</div>' +
                '<div class="word">' + word.word + '</div>' +
                '<div class="phonetic">' + word.phonetic + '</div>';
            container.appendChild(pronCard);

            // Listen button
            var btnDiv = document.createElement('div');
            btnDiv.style.cssText = 'text-align:center;margin-top:20px';
            var listenBtn = createButton(state.isListening ? '正在听...' : '点击跟读 🎤', 'btn btn-primary btn-large', function() {
                if (state.isListening) return;
                state.isListening = true;
                render();
                setTimeout(function() {
                    state.isListening = false;
                    state.pronunciationScore++;
                    state.totalScore += 10;
                    state.feedback = { message: '发音很棒！继续保持！🎉', type: 'success' };
                    setTimeout(function() {
                        state.pronunciationIndex++;
                        render();
                    }, 1000);
                    render();
                }, 2000);
            });
            listenBtn.style.minWidth = '200px';
            btnDiv.appendChild(listenBtn);
            container.appendChild(btnDiv);

            // Tips
            var tips = document.createElement('div');
            tips.style.cssText = 'text-align:center;margin-top:16px';
            tips.innerHTML = '<p style="color:var(--text-secondary)">点击按钮，跟着读出单词，系统会评估你的发音哦！</p>';
            container.appendChild(tips);
        }

        function renderModal(root) {
            var backdrop = document.createElement('div');
            backdrop.className = 'modal-backdrop';
            backdrop.onclick = function() {
                state.showModal = false;
                render();
            };

            var content = document.createElement('div');
            content.className = 'modal-content';
            content.onclick = function(e) { e.stopPropagation(); };
            content.innerHTML = '<div style="font-size:3rem;margin-bottom:16px">🎉</div>' +
                '<h2 style="font-size:1.5rem;font-weight:800;color:var(--text);margin-bottom:12px">恭喜完成所有学习！</h2>' +
                '<p style="margin-bottom:16px">你获得了 <strong style="color:var(--primary)">' + state.totalScore + '</strong> 个星星奖励！</p>' +
                '<div class="wallet">⭐ ' + state.totalScore + '</div>';

            var closeBtn = createButton('太棒了！', 'btn btn-primary btn-large', function() {
                state.showModal = false;
                render();
            });
            closeBtn.style.marginTop = '20px';
            content.appendChild(closeBtn);

            backdrop.appendChild(content);
            root.appendChild(backdrop);
        }

        function createButton(text, className, onclick) {
            var btn = document.createElement('button');
            btn.className = className;
            btn.textContent = text;
            btn.onclick = onclick;
            return btn;
        }

        // ============================================
        // Initialize
        // ============================================
        render();
    </script>
</body>
</html>
