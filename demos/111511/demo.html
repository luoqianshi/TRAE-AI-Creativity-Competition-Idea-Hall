<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI自习规划助手</title>
<style>
:root{
--primary:#3563e9;
--light:#f4f7ff;
--gray:#e6ecf8;
--text:#222;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei}
body{background:var(--light);padding:24px;color:var(--text)}
.wrap{max-width:1300px;margin:0 auto}
header{text-align:center;margin-bottom:32px}
header h1{color:var(--primary);margin-bottom:6px}
.layout{display:grid;grid-template-columns:360px 1fr;gap:26px}
@media(max-width:780px){.layout{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 14px rgba(53,99,233,0.1)}
.title{font-size:19px;color:var(--primary);margin-bottom:18px;font-weight:bold}
input,textarea{width:100%;padding:12px;border:1px solid var(--gray);border-radius:10px;margin-bottom:14px;font-size:14px}
textarea{min-height:100px;resize:none}
button{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;cursor:pointer}
.btn-main{background:var(--primary);color:#fff}
.btn-mini{width:auto;padding:7px 12px;margin:4px;background:#e6ecf8}
.timer-box{text-align:center;padding:20px 0}
.time-num{font-size:64px;color:var(--primary);margin:12px 0}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--light);border-radius:10px;margin-bottom:8px}
.chart-area{margin-top:20px;height:160px;display:flex;align-items:flex-end;gap:6px;padding:10px;background:var(--light);border-radius:12px}
.bar{width:12%;background:var(--primary);border-radius:4px 4px 0 0}
.empty-tip{text-align:center;color:#999;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>AI自习规划助手</h1>
<p>专注计时｜学习计划｜错题归档｜时长统计</p>
</header>
<div class="layout">
<!--左侧：计时+计划录入-->
<div>
<div class="card">
<div class="title">番茄专注计时器</div>
<div class="timer-box">
<div class="time-num" id="timerText">25:00</div>
<div>
<button class="btn-mini" onclick="startTimer()">开始</button>
<button class="btn-mini" onclick="pauseTimer()">暂停</button>
<button class="btn-mini" onclick="resetTimer()">重置</button>
</div>
</div>
</div>
<div class="card" style="margin-top:24px">
<div class="title">今日学习计划</div>
<input id="planInput" placeholder="输入学习任务">
<button class="btn-main" onclick="addPlan()">添加任务</button>
<div id="planList"></div>
</div>
</div>
<!--右侧：错题本+学习统计-->
<div>
<div class="card">
<div class="title">错题笔记归档</div>
<input id="qTitle" placeholder="错题知识点">
<textarea id="qContent" placeholder="题目、错误原因、正确思路"></textarea>
<button class="btn-main" onclick="addQuestion()">保存错题</button>
<div id="questionList"></div>
</div>
<div class="card" style="margin-top:24px">
<div class="title">本周学习时长统计</div>
<div class="chart-area" id="chartBox">
<div class="bar" style="height:20%"></div>
<div class="bar" style="height:40%"></div>
<div class="bar" style="height:28%"></div>
<div class="bar" style="height:65%"></div>
<div class="bar" style="height:50%"></div>
<div class="bar" style="height:35%"></div>
<div class="bar" style="height:78%"></div>
</div>
<p style="text-align:center;margin-top:12px;color:#666">自动记录每日专注时长</p>
</div>
</div>
</div>
</div>

<script>
// 计时器逻辑
let timerMin = 25;
let timerSec = 0;
let timerRun = null;
const timerDom = document.getElementById("timerText");
function renderTimer(){
    let m = String(timerMin).padStart(2,"0");
    let s = String(timerSec).padStart(2,"0");
    timerDom.innerText = `${m}:${s}`;
}
function startTimer(){
    clearInterval(timerRun);
    timerRun = setInterval(()=>{
        if(timerSec===0){
            if(timerMin===0){clearInterval(timerRun);alert("专注时间结束！");return}
            timerMin--;timerSec=59;
        }else timerSec--;
        renderTimer();
    },1000)
}
function pauseTimer(){clearInterval(timerRun)}
function resetTimer(){
    clearInterval(timerRun);
    timerMin=25;timerSec=0;renderTimer();
}
renderTimer();

// 本地存储
const PLAN_KEY = "studyPlanData";
const Q_KEY = "questionData";
let planList = JSON.parse(localStorage.getItem(PLAN_KEY))||[];
let questionList = JSON.parse(localStorage.getItem(Q_KEY))||[];

// 学习计划
function savePlan(){localStorage.setItem(PLAN_KEY,JSON.stringify(planList))}
function addPlan(){
    const val = document.getElementById("planInput").value.trim();
    if(!val)return alert("请输入任务");
    planList.push(val);
    savePlan();renderPlan();
    document.getElementById("planInput").value=""
}
function delPlan(i){
    planList.splice(i,1);savePlan();renderPlan();
}
function renderPlan(){
    const wrap = document.getElementById("planList");
    if(planList.length===0){wrap.innerHTML="<div class='empty-tip'>暂无计划</div>";return}
    let html = "";
    planList.forEach((item,i)=>{
        html += `<div class="list-item">${item}<button class="btn-mini" onclick="delPlan(${i})">删除</button></div>`
    })
    wrap.innerHTML = html;
}
renderPlan();

// 错题本
function saveQ(){localStorage.setItem(Q_KEY,JSON.stringify(questionList))}
function addQuestion(){
    let t = document.getElementById("qTitle").value.trim();
    let c = document.getElementById("qContent").value.trim();
    if(!t)return alert("填写知识点标题");
    questionList.push({title:t,content:c});
    saveQ();renderQ();
    document.getElementById("qTitle").value="";
    document.getElementById("qContent").value=""
}
function delQ(i){
    questionList.splice(i,1);saveQ();renderQ();
}
function renderQ(){
    const wrap = document.getElementById("questionList");
    if(questionList.length===0){wrap.innerHTML="<div class='empty-tip'>暂无错题记录</div>";return}
    let html = "";
    questionList.forEach((item,i)=>{
        html += `<div class="list-item"><div><strong>${item.title}</strong><p style="font-size:13px;color:#666">${item.content}</p></div><button class="btn-mini" onclick="delQ(${i})">删除</button></div>`
    })
    wrap.innerHTML = html;
}
renderQ();
</script>
</body>
</html>
