<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>饭荒终结者 - FridgeFeast 原型展示</title>
    <style>
        :root {
            --primary: #4CAF50;
            --bg: #f5f7f6;
            --card: #ffffff;
            --text: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .phone-mockup {
            width: 375px;
            height: 680px;
            background: var(--card);
            border: 12px solid #222;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 20px 15px 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .content {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
        }
        .section-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tag {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag.active {
            background: #e8f5e9;
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-generate {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #f9f9f9;
            border-left: 4px solid var(--primary);
            display: none;
        }
        .result-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="phone-mockup">
        <div class="header">🥑 饭荒终结者 (FridgeFeast)</div>
        <div class="content">
            <p style="font-size: 13px; color: #888; text-align: center; margin-top: 0;">💡 勾选你冰箱里剩下的食材，让 AI 施展魔法</p>
            
            <div class="section-title">我的冰箱里还有：</div>
            <div class="tags-container">
                <div class="tag" onclick="toggleTag(this)">🥚 鸡蛋</div>
                <div class="tag" onclick="toggleTag(this)">🍅 番茄</div>
                <div class="tag" onclick="toggleTag(this)">🍞 吐司</div>
                <div class="tag" onclick="toggleTag(this)">🥦 西兰花</div>
                <div class="tag" onclick="toggleTag(this)">🥩 吃剩的牛肉</div>
                <div class="tag" onclick="toggleTag(this)">🧅 洋葱</div>
            </div>

            <button class="btn-generate" onclick="generateRecipe()">✨ AI 秒出食谱</button>

            <div class="result-box" id="result">
                <div class="result-title">🎯 AI 推荐：孤独行者的法式番茄滑蛋多士</div>
                <p style="font-size: 13px; line-height: 1.5; color: #555; margin: 0;">
                    <strong>做法：</strong>番茄切丁炒软，倒入蛋液快速翻炒至半熟出锅。将牛肉切丝铺在烤过的吐司上，盖上番茄滑蛋。全程只需 5 分钟，完美消耗 3 种临期食材！
                </p>
            </div>
        </div>
    </div>

    <script>
        function toggleTag(el) {
            el.classList.toggle('active');
        }
        function generateRecipe() {
            const result = document.getElementById('result');
            result.style.display = 'block';
            result.style.animation = 'fadeIn 0.5s';
        }
    </script>
</body>
</html>
