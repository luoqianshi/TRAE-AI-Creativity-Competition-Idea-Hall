<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ETF量化策略收益概况</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #fff;
            padding: 10px;
        }
        /* 顶部标签栏 */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 12px;
        }
        .tab-item {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            color: #666;
        }
        .tab-item.active {
            color: #f03e3e;
            border-bottom: 2px solid #f03e3e;
        }
        /* 指标行 */
        .index-row {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .index-card {
            text-align: center;
        }
        .index-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .index-value {
            font-size: 16px;
            color: #f03e3e;
            font-weight: 500;
        }
        /* 图例 */
        .legend-wrap {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red {background:#f03e3e;}
        .dot-blue {background:#4096ff;}
        .dot-yellow {background:#ffb800;}
        .dot-lightred {background:#f88;}
        /* 图表容器 */
        .chart-box {
            width: 100%;
            height: 420px;
            border: 1px solid #eee;
            position: relative;
            overflow: hidden;
        }
        /* 仓位小图 */
        .position-chart {
            width: 100%;
            height: 80px;
            margin-top: 8px;
            border: 1px solid #eee;
        }
    </style>
</head>
<body>
    <!-- 顶部标签 -->
    <div class="tab-bar">
        <div class="tab-item active">收益概况</div>
        <div class="tab-item">交易详情</div>
        <div class="tab-item">每日持仓和收益</div>
        <div class="tab-item">输出日志</div>
    </div>

    <!-- 顶部指标栏 -->
    <div class="index-row">
        <div class="index-card">
            <div class="index-label">累计收益率</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">年化收益率</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">基准收益率</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">阿尔法</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">贝塔</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">夏普比率</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">胜率</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">盈亏比</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">收益波动率</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">信息比率</div>
            <div class="index-value">--</div>
        </div>
        <div class="index-card">
            <div class="index-label">最大回撤</div>
            <div class="index-value">--</div>
        </div>
    </div>

    <!-- 图例 -->
    <div class="legend-wrap">
        <div class="legend-item">
            <span class="legend-dot dot-red"></span>
            <span>策略收益率</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot dot-blue"></span>
            <span>基准收益率</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot dot-yellow"></span>
            <span>相对收益率</span>
        </div>
        <div class="legend-item">
            <span class="legend-dot dot-lightred"></span>
            <span>仓位</span>
        </div>
    </div>

    <!-- 主收益图表区域 -->
    <div class="chart-box">
        <!-- 坐标轴网格占位，仅还原界面结构 -->
        <svg width="100%" height="100%" viewBox="0 0 1000 400">
            <!-- Y轴刻度 -->
            <text x="30" y="30" font-size="12" fill="#666">180%</text>
            <text x="30" y="70" font-size="12" fill="#666">150%</text>
            <text x="30" y="110" font-size="12" fill="#666">120%</text>
            <text x="30" y="150" font-size="12" fill="#666">90%</text>
            <text x="30" y="190" font-size="12" fill="#666">60%</text>
            <text x="30" y="230" font-size="12" fill="#666">30%</text>
            <text x="30" y="270" font-size="12" fill="#666">0%</text>
            <text x="20" y="310" font-size="12" fill="#666">-30%</text>
            <!-- X轴时间刻度占位 -->
            <text x="40" y="330" font-size="11" fill="#666">2019-01-02</text>
            <text x="120" y="330" font-size="11" fill="#666">2019-04-18</text>
            <text x="200" y="330" font-size="11" fill="#666">2019-07-31</text>
            <text x="280" y="330" font-size="11" fill="#666">2019-11-14</text>
            <text x="360" y="330" font-size="11" fill="#666">2020-03-02</text>
            <text x="440" y="330" font-size="11" fill="#666">2020-06-12</text>
            <text x="520" y="330" font-size="11" fill="#666">2020-09-22</text>
            <text x="600" y="330" font-size="11" fill="#666">2021-01-07</text>
            <text x="680" y="330" font-size="11" fill="#666">2021-04-23</text>
            <text x="760" y="330" font-size="11" fill="#666">2021-08-05</text>
            <text x="840" y="330" font-size="11" fill="#666">2021-11-22</text>
            <text x="920" y="330" font-size="11" fill="#666">2022-03-08</text>
            <!-- 网格横线 -->
            <line x1="50" y1="30" x2="980" y2="30" stroke="#eee" stroke-width="1"/>
            <line x1="50" y1="70" x2="980" y2="70" stroke="#eee" stroke-width="1"/>
            <line x1="50" y1="110" x2="980" y2="110" stroke="#eee" stroke-width="1"/>
            <line x1="50" y1="150" x2="980" y2="150" stroke="#eee" stroke-width="1"/>
            <line x1="50" y1="190" x2="980" y2="190" stroke="#eee" stroke-width="1"/>
            <line x1="50" y1="230" x2="980" y2="230" stroke="#eee" stroke-width="1"/>
            <line x1="50" y1="270" x2="980" y2="270" stroke="#eee" stroke-width="1"/>
            <line x1="50" y1="310" x2="980" y2="310" stroke="#eee" stroke-width="1"/>
        </svg>
    </div>

    <!-- 底部仓位小图表 -->
    <div class="position-chart">
        <svg width="100%" height="100%" viewBox="0 0 1000 80">
            <text x="30" y="20" font-size="11" fill="#666">80%</text>
            <text x="30" y="35" font-size="11" fill="#666">60%</text>
            <text x="30" y="50" font-size="11" fill="#666">40%</text>
            <text x="30" y="65" font-size="11" fill="#666">20%</text>
            <!-- 仓位底色条占位 -->
            <rect x="50" y="10" width="930" height="60" fill="#fef0f0" opacity="0.4"/>
            <rect x="50" y="68" width="930" height="12" fill="#c6f0f0" opacity="0.5"/>
        </svg>
    </div>
</body>
</html>
