<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FF8C42" />
<title>Petwhisper - AI 宠物翻译官</title>
<meta name="description" content="你拍一张，它说一句。AI 帮你读懂宠物的心情。" />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --w50:#FFFBF7; --w100:#FFF8F0; --w200:#FFE8D6; --w300:#FFD4B3;
  --b300:#FFB880; --b400:#FFA060; --b500:#FF8C42; --b600:#E67330;
  --t50:#EAF3FD; --t100:#D4E7FB; --t500:#4A90D9; --t600:#3B78B5;
  --fd:'ZCOOL KuaiLe','Nunito',system-ui,sans-serif;
  --fb:'Nunito','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fb);background:var(--w100);min-height:100vh;overflow-x:hidden;color:#374151}
.grain{position:fixed;inset:0;opacity:.03;pointer-events:none;z-index:9999;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:0;pointer-events:none}
.blob1{top:-80px;right:-80px;width:320px;height:320px;background:rgba(255,160,96,.3)}
.blob2{bottom:-128px;left:-128px;width:384px;height:384px;background:rgba(74,144,217,.2)}
.container{max-width:420px;margin:0 auto;padding:0 24px;position:relative;z-index:10}
.fd{font-family:var(--fd)}
.hidden{display:none!important}
.flex{display:flex}.flex-col{flex-direction:column}
.items-center{align-items:center}.justify-center{justify-content:center}
.justify-between{justify-content:space-between}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.w-full{width:100%}.h-full{height:100%}
.max-w-md{max-width:420px}.mx-auto{margin:0 auto}
.text-center{text-align:center}
.text-sm{font-size:14px}.text-lg{font-size:18px}
.text-xl{font-size:20px}.text-2xl{font-size:24px}.text-3xl{font-size:30px}
.font-bold{font-weight:700}.font-medium{font-weight:500}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.mb-8{margin-bottom:32px}.mb-10{margin-bottom:40px}
.mt-4{margin-top:16px}.mt-8{margin-top:32px}.mt-16{margin-top:64px}
.py-8{padding:32px 0}.pb-24{padding-bottom:96px}.pb-32{padding-bottom:128px}
.px-6{padding:0 24px}.p-6{padding:24px}
.space-y-4>*+*{margin-top:16px}.space-y-6>*+*{margin-top:24px}
.relative{position:relative}.absolute{position:absolute}.fixed{position:fixed}
.inset-0{inset:0}.top-0{top:0}.bottom-0{bottom:0}.left-0{left:0}.right-0{right:0}
.z-50{z-index:50}.z-40{z-index:40}
.rounded-full{border-radius:50%}.rounded-2xl{border-radius:16px}
.rounded-pill{border-radius:999px}.rounded-card{border-radius:24px}
.bg-white{background:white}.bg-w50{background:var(--w50)}.bg-t50{background:var(--t50)}
.bg-w100{background:var(--w100)}
.shadow-card{box-shadow:0 8px 40px rgba(255,140,66,.15)}
.shadow-sm{box-shadow:0 2px 8px rgba(0,0,0,.06)}
.shadow-lg{box-shadow:0 10px 30px rgba(0,0,0,.1)}
.overflow-hidden{overflow:hidden}.overflow-x-auto{overflow-x:auto}
.scrollbar-hide::-webkit-scrollbar{display:none}
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
.flex-shrink-0{flex-shrink:0}
.cursor-pointer{cursor:pointer}
.border{border:1px solid var(--w200)}.border-t{border-top:1px solid var(--w200)}
.opacity-0{opacity:0}.opacity-100{opacity:1}
.transition-all{transition:all .2s ease}.transition-opacity{transition:opacity .3s ease}
.hover\:scale-105:hover{transform:scale(1.05)}
.active\:scale-95:active{transform:scale(.95)}
.btn-p{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px 24px;background:linear-gradient(135deg,var(--b400),var(--b500));color:white;font-weight:700;font-size:18px;border-radius:999px;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(255,140,66,.3);transition:all .2s}
.btn-p:hover{box-shadow:0 12px 30px rgba(255,140,66,.4);transform:translateY(-2px)}
.btn-p:active{transform:scale(.98)}
.btn-s{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px 24px;background:white;color:var(--b500);font-weight:700;font-size:18px;border-radius:999px;border:2px solid var(--w300);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:all .2s}
.btn-s:hover{box-shadow:0 8px 20px rgba(0,0,0,.12);border-color:var(--b300)}
.btn-s:active{transform:scale(.98)}
.card{background:white;border-radius:24px;box-shadow:0 8px 40px rgba(255,140,66,.15);overflow:hidden}
.divider{display:flex;align-items:center;gap:16px;margin:24px 0}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--w300),transparent)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes pawSpin{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes bounceSoft{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.a-fade{animation:fadeIn .6s ease-out forwards}
.a-slide{animation:slideUp .5s ease-out forwards}
.a-scale{animation:scaleIn .4s ease-out forwards}
.a-paw{animation:pawSpin 2s ease-in-out infinite}
.a-bounce{animation:bounceSoft 2s ease-in-out infinite}
.a-pulse{animation:pulse 2s ease-in-out infinite}
.logo{display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}
.logo-icon{width:48px;height:48px;background:linear-gradient(135deg,var(--b400),var(--b500));border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,140,66,.3)}
.logo-icon svg{width:24px;height:24px;fill:white}
.logo-text{font-family:var(--fd);font-size:30px;color:var(--b600);letter-spacing:2px}
.slogan{font-size:14px;color:var(--b400);font-weight:500;margin-top:-8px}
.hero-title{font-family:var(--fd);font-size:32px;color:#1F2937;line-height:1.3;margin-bottom:12px}
.hero-sub{font-size:14px;color:#6B7280}
.empty{text-align:center;padding:48px 24px;background:rgba(255,255,255,.5);backdrop-filter:blur(4px);border-radius:16px}
.empty-icon{width:64px;height:64px;margin:0 auto 16px;background:rgba(255,232,214,.5);border-radius:50%;display:flex;align-items:center;justify-content:center}
.empty-icon svg{width:32px;height:32px;color:var(--b400)}
.empty p{font-size:14px;color:#9CA3AF}
.empty p+p{font-size:12px;margin-top:4px}
.hist-card{width:128px;flex-shrink:0;position:relative;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);cursor:pointer;transition:all .2s}
.hist-card:hover{box-shadow:0 8px 20px rgba(0,0,0,.12)}
.hist-card img{width:100%;height:128px;object-fit:cover}
.hist-card .ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent)}
.hist-card .info{position:absolute;bottom:8px;left:8px;right:8px;color:white}
.hist-card .mood{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
.hist-card .time{font-size:10px;opacity:.8;margin-top:2px}
.hist-del{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;cursor:pointer;border:none}
.hist-card:hover .hist-del{opacity:1}
.hist-del:hover{background:rgba(239,68,68,.8)}
.loading-spinner{width:112px;height:112px;position:relative;margin:0 auto 32px}
.loading-ring{position:absolute;inset:0;background:linear-gradient(135deg,var(--b300),var(--b500));border-radius:50%;opacity:.3;animation:pulse 2s ease-in-out infinite}
.loading-paw{position:absolute;inset:8px;background:linear-gradient(135deg,var(--b400),var(--b500));border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,140,66,.4)}
.loading-paw svg{width:48px;height:48px;fill:white;animation:pawSpin 2s ease-in-out infinite}
.fdots{position:absolute;inset:0}
.fdots .dot{position:absolute;border-radius:50%;animation:bounceSoft 2s ease-in-out infinite}
.dot1{top:-8px;right:-8px;width:20px;height:20px;background:#FDE047;animation-delay:0s}
.dot2{bottom:-4px;left:-12px;width:16px;height:16px;background:#F9A8D4;animation-delay:.3s}
.dot3{top:50%;right:-16px;width:12px;height:12px;background:#93C5FD;animation-delay:.6s}
.pulse-dots{display:flex;justify-content:center;gap:8px;margin-top:32px}
.pulse-dots .dot{width:8px;height:8px;background:var(--b400);border-radius:50%;animation:bounceSoft 1s ease-in-out infinite}
.pulse-dots .dot:nth-child(2){animation-delay:.15s}
.pulse-dots .dot:nth-child(3){animation-delay:.3s}
.photo-box{position:relative;aspect-ratio:1;background:var(--w200);overflow:hidden}
.photo-box img{width:100%;height:100%;object-fit:cover}
.mood-tag{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(255,255,255,.95);border-radius:24px;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.mood-tag .emoji{font-size:28px}
.mood-tag .mt{display:flex;flex-direction:column}
.mood-tag .m1{font-size:14px;font-weight:700;color:#1F2937}
.mood-tag .m2{font-size:11px;color:#6B7280}
.date-tag{position:absolute;bottom:16px;right:16px;padding:6px 12px;background:rgba(255,255,255,.95);border-radius:16px;font-size:12px;color:#6B7280;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.nav-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);backdrop-filter:blur(4px);border-radius:50%;border:none;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-btn:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.nav-btn:active{transform:scale(.95)}
.nav-title{font-family:var(--fd);font-size:20px;color:var(--b600)}
.quote{background:var(--w50);border-radius:16px;padding:20px;position:relative}
.quote::before{content:'"';position:absolute;top:4px;left:12px;font-size:48px;color:var(--w300);font-family:serif}
.quote::after{content:'"';position:absolute;bottom:-16px;right:12px;font-size:48px;color:var(--w300);font-family:serif;transform:rotate(180deg)}
.quote p{padding-left:24px;padding-right:8px;line-height:1.6;font-size:16px;color:#374151;font-weight:500}
.tip-box{background:var(--t50);border-radius:16px;padding:16px;display:flex;gap:12px}
.tip-icon{width:40px;height:40px;background:var(--t100);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tip-content h4{font-size:14px;font-weight:700;color:var(--t600);margin-bottom:4px}
.tip-content p{font-size:14px;color:#4B5563;line-height:1.5}
.mood-row{display:flex;align-items:center;gap:12px}
.mood-emoji{width:32px;text-align:center;font-size:18px}
.mood-bar-wrap{flex:1}
.mood-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.mood-label span:first-child{color:#4B5563;font-weight:500}
.mood-label span:last-child{color:var(--b500);font-weight:700}
.mood-bar{height:8px;background:var(--w200);border-radius:4px;overflow:hidden}
.mood-fill{height:100%;background:linear-gradient(90deg,var(--b300),var(--b500));border-radius:4px;width:0%;transition:width 1s ease-out}
.float-bar{position:fixed;bottom:0;left:0;right:0;display:flex;gap:12px;padding:16px 24px 24px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);z-index:40;border-top:1px solid var(--w200)}
.float-bar-inner{max-width:420px;margin:0 auto;width:100%;display:flex;gap:12px}
.float-bar button{flex:1;padding:14px 20px;border-radius:999px;font-weight:700;font-size:16px;border:none;cursor:pointer;transition:all .2s}
.float-bar .btn-retake{background:var(--w100);color:var(--b600)}
.float-bar .btn-share{background:linear-gradient(135deg,var(--b400),var(--b500));color:white;box-shadow:0 4px 12px rgba(255,140,66,.3)}
.float-bar button:active{transform:scale(.98)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:60;animation:fadeIn .3s ease-out}
.modal-box{width:100%;max-width:420px;background:var(--w100);border-radius:24px 24px 0 0;padding-bottom:32px;animation:slideUp .3s ease-out;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--w200)}
.modal-head h3{font-size:18px;font-weight:700;color:#1F2937}
.close-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--w200);border-radius:50%;border:none;cursor:pointer;transition:all .2s}
.close-btn:hover{background:var(--w300)}
.poster-box{aspect-ratio:9/16;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.15);margin-bottom:16px}
.poster-box img{width:100%;height:100%;object-fit:cover}
.share-actions{display:flex;gap:12px}
.share-actions button{flex:1;padding:14px 20px;border-radius:999px;font-weight:700;font-size:16px;border:2px solid var(--w300);background:white;color:var(--b500);cursor:pointer;transition:all .2s}
.share-actions button.primary{background:linear-gradient(135deg,var(--b400),var(--b500));color:white;border:none;box-shadow:0 4px 12px rgba(255,140,66,.3)}
.share-actions button:active{transform:scale(.98)}
.section-title{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.section-title svg{width:20px;height:20px;color:var(--b400)}
.section-title h3{font-weight:700;color:#1F2937}
.like-active svg{fill:#ef4444!important;stroke:#ef4444!important}
</style>
</head>
<body>
<div class="grain"></div>
<div class="blob blob1"></div>
<div class="blob blob2"></div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="albumInput" accept="image/*" class="hidden">

<div id="app">

<div id="homeView">
  <div class="container py-8 pb-24">
    <header class="text-center mb-10 a-fade">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 20C9.5 20 8 18.5 8 16.5C8 14.5 9.5 13 12 13C14.5 13 16 14.5 16 16.5C16 18.5 14.5 20 12 20Z"/><circle cx="7" cy="9" r="2.5"/><circle cx="17" cy="9" r="2.5"/><circle cx="5" cy="14" r="2"/><circle cx="19" cy="14" r="2"/></svg>
        </div>
        <span class="logo-text">Petwhisper</span>
      </div>
      <p class="slogan">你拍一张，它说一句</p>
    </header>

    <div class="text-center mb-10 a-slide" style="animation-delay:.1s">
      <h2 class="hero-title">你家毛孩子<br>现在在想什么？</h2>
      <p class="hero-sub">上传一张照片，AI 帮你读懂它</p>
    </div>

    <div class="space-y-4 mb-10 a-slide" style="animation-delay:.2s">
      <button class="btn-p" onclick="triggerCamera()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        拍照上传
      </button>
      <button class="btn-s" onclick="triggerAlbum()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        从相册选择
      </button>
    </div>

    <div class="a-slide" style="animation-delay:.3s">
      <div class="divider">
        <div class="divider-line"></div>
        <span class="text-sm" style="color:#9CA3AF">最近解读</span>
        <div class="divider-line"></div>
      </div>
      <div id="historyList" class="flex gap-4 overflow-x-auto scrollbar-hide pb-2" style="margin:0 -24px;padding:0 24px"></div>
    </div>

    <div class="mt-16 text-center a-fade" style="animation-delay:.5s">
      <p style="font-size:12px;color:#9CA3AF">Powered by AI · 仅本地处理，保护隐私</p>
    </div>
  </div>
</div>

<div id="loadingView" class="hidden">
  <div class="container" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <div class="loading-spinner">
      <div class="loading-ring"></div>
      <div class="loading-paw">
        <svg viewBox="0 0 24 24"><path d="M12 20C9.5 20 8 18.5 8 16.5C8 14.5 9.5 13 12 13C14.5 13 16 14.5 16 16.5C16 18.5 14.5 20 12 20Z"/><circle cx="7" cy="9" r="2.5"/><circle cx="17" cy="9" r="2.5"/><circle cx="5" cy="14" r="2"/><circle cx="19" cy="14" r="2"/></svg>
      </div>
      <div class="fdots">
        <div class="dot dot1"></div>
        <div class="dot dot2"></div>
        <div class="dot dot3"></div>
      </div>
    </div>
    <h2 class="fd text-2xl a-pulse" style="color:var(--b600);margin-bottom:12px">正在偷偷读取它的想法…</h2>
    <p class="text-sm" style="color:#6B7280">AI 正在观察你的毛孩子~</p>
    <div class="pulse-dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</div>

<div id="resultView" class="hidden pb-32">
  <div class="container">
    <div class="nav">
      <button class="nav-btn" onclick="goHome()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="nav-title">心情报告</h1>
      <button id="likeBtn" class="nav-btn" onclick="toggleLike()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
    </div>
  </div>

  <div class="max-w-md mx-auto px-6 mt-4">
    <div class="card a-scale">
      <div class="photo-box">
        <img id="resultPhoto" src="" alt="Pet">
        <div class="mood-tag">
          <span class="emoji" id="resultEmoji">😄</span>
          <div class="mt">
            <span class="m1" id="resultMood">超级开心</span>
            <span class="m2">毛孩子</span>
          </div>
        </div>
        <div class="date-tag" id="resultDate"></div>
      </div>

      <div class="p-6 space-y-6">
        <div class="quote">
          <p id="resultMonologue"></p>
        </div>

        <div>
          <div class="section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <h3>情绪指数</h3>
          </div>
          <div class="space-y-4" id="moodBars"></div>
        </div>

        <div class="tip-box">
          <div class="tip-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--t500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
          </div>
          <div class="tip-content">
            <h4>小贴士</h4>
            <p id="resultTip"></p>
          </div>
        </div>
      </div>

function formatTime(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff/60000)+'分钟前';
  if (diff < 86400000) return Math.floor(diff/3600000)+'小时前';
  if (diff < 604800000) return Math.floor(diff/86400000)+'天前';
  return (d.getMonth()+1)+'月'+d.getDate()+'日';
}

function formatDate(ts) {
  const d = new Date(ts);
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}

function rgbToHsl(r, g, b) {
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h=0,s=0;const l=(max+min)/2;
  if(max!==min){
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){
      case r:h=((g-b)/d+(g<b?6:0))/6;break;
      case g:h=((b-r)/d+2)/6;break;
      case b:h=((r-g)/d+4)/6;break;
    }
  }
  return {h:h*360,s:s*100,l:l*100};
}

function getDominantColor(imageData) {
  const data = imageData.data;
  const buckets = {};
  const step = 4;
  for (let i=0;i<data.length;i+=4*step) {
    const r=Math.floor(data[i]/32)*32;
    const g=Math.floor(data[i+1]/32)*32;
    const b=Math.floor(data[i+2]/32)*32;
    const k=r+','+g+','+b;
    if(buckets[k]){buckets[k].c++;buckets[k].r+=data[i];buckets[k].g+=data[i+1];buckets[k].b+=data[i+2];}
    else buckets[k]={c:1,r:data[i],g:data[i+1],b:data[i+2]};
  }
  let mc=0,col={r:255,g:200,b:150};
  for(const k in buckets){
    if(buckets[k].c>mc){mc=buckets[k].c;col={r:Math.round(buckets[k].r/buckets[k].c),g:Math.round(buckets[k].g/buckets[k].c),b:Math.round(buckets[k].b/buckets[k].c)};}
  }
  const hsl=rgbToHsl(col.r,col.g,col.b);
  const hex='#'+col.r.toString(16).padStart(2,'0')+col.g.toString(16).padStart(2,'0')+col.b.toString(16).padStart(2,'0');
  return {...hsl,hex};
}

function analyzeBrightness(l){return l>60?'bright':l>35?'medium':'dark';}
function analyzeTemperature(h,s){if(s<15)return'neutral';if(h>=20&&h<=200)return'warm';return'cool';}

function randItem(arr){return arr[Math.floor(Math.random()*arr.length)];}

function generateScores(bright,temp,sat){
  const base=50;const v=()=>Math.floor(Math.random()*30-15);
  let happy=base+v(),curious=base+v(),relaxed=base+v(),hungry=base+v();
  if(bright==='bright'){happy+=15;curious+=10;relaxed-=10;}
  else if(bright==='dark'){relaxed+=20;happy-=10;hungry+=5;}
  if(temp==='warm'){happy+=10;hungry+=10;relaxed-=5;}
  else if(temp==='cool'){relaxed+=15;curious+=5;happy-=5;}
  if(sat>50){curious+=10;happy+=5;}
  const total=happy+curious+relaxed+hungry;const scale=280/total;
  return{
    happy:Math.min(100,Math.max(10,Math.round(happy*scale))),
    curious:Math.min(100,Math.max(10,Math.round(curious*scale))),
    relaxed:Math.min(100,Math.max(10,Math.round(relaxed*scale))),
    hungry:Math.min(100,Math.max(10,Math.round(hungry*scale))),
  };
}

function determineMood(scores,bright,temp){
  const moods=[
    {name:'happy',score:scores.happy},
    {name:'curious',score:scores.curious},
    {name:'relaxed',score:scores.relaxed},
    {name:'hungry',score:scores.hungry},
  ].sort((a,b)=>b.score-a.score);
  let dm=moods[0].name;
  if(bright==='dark'&&scores.relaxed>60)dm=Math.random()>.5?'sleepy':'relaxed';
  if(temp==='cool'&&scores.happy<50)dm=Math.random()>.5?'cool':'relaxed';
  if(scores.happy>75&&scores.curious>65)dm=Math.random()>.5?'excited':'happy';
  return dm;
}

function analyzePetImage(src){
  return new Promise((resolve)=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d');
      const ms=200;let w=img.width,h=img.height;
      if(w>h){h=(h/w)*ms;w=ms;}else{w=(w/h)*ms;h=ms;}
      canvas.width=w;canvas.height=h;
      ctx.drawImage(img,0,0,w,h);
      const imgData=ctx.getImageData(0,0,w,h);
      const dc=getDominantColor(imgData);
      const bright=analyzeBrightness(dc.l);
      const temp=analyzeTemperature(dc.h,dc.s);
      const scores=generateScores(bright,temp,dc.s);
      const dm=determineMood(scores,bright,temp);
      const mi=moodLabels[dm];
      const mono=randItem(monologuePool[dm]);
      const tip='💡 '+randItem(tipPool[dm]);
      resolve({
        mood:mi.label,moodEmoji:mi.emoji,scores,
        monologue:mono,tip,dominantColor:dc.hex,
        brightness:bright,temperature:temp,
      });
    };
    img.onerror=()=>{
      const moods=Object.keys(moodLabels);
      const rm=moods[Math.floor(Math.random()*moods.length)];
      const mi=moodLabels[rm];
      resolve({
        mood:mi.label,moodEmoji:mi.emoji,
        scores:{happy:40+Math.floor(Math.random()*40),curious:40+Math.floor(Math.random()*40),relaxed:40+Math.floor(Math.random()*40),hungry:40+Math.floor(Math.random()*40)},
        monologue:randItem(monologuePool[rm]),
        tip:'💡 '+randItem(tipPool[rm]),
        dominantColor:'#FFB880',brightness:'medium',temperature:'warm',
      });
    };
    img.src=src;
  });
}

function generatePoster(){
  const canvas=document.getElementById('posterCanvas');
  const ctx=canvas.getContext('2d');
  const w=750,h=1334;
  canvas.width=w;canvas.height=h;

  const grad=ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#FFF8F0');
  grad.addColorStop(1,'#FFE8D6');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);

  ctx.beginPath();ctx.arc(w+100,-100,300,0,Math.PI*2);
  ctx.fillStyle='rgba(255,140,66,0.15)';ctx.fill();
  ctx.beginPath();ctx.arc(-100,h+100,400,0,Math.PI*2);
  ctx.fillStyle='rgba(74,144,217,0.1)';ctx.fill();

  const img=new Image();img.crossOrigin='anonymous';
  img.onload=()=>{
    const ps=550,px=(w-ps)/2,py=180;
    
    ctx.save();
    ctx.beginPath();
    roundRect(ctx,px-15,py-15,ps+30,ps+30,32);
    ctx.fillStyle='#FFFFFF';
    ctx.shadowColor='rgba(255,140,66,0.2)';
    ctx.shadowBlur=40;ctx.shadowOffsetY=10;
    ctx.fill();ctx.restore();

    ctx.save();
    ctx.beginPath();
    roundRect(ctx,px,py,ps,ps,24);
    ctx.clip();

    const ir=img.width/img.height;
    let dw=ps,dh=ps,dx=px,dy=py;
    if(ir>1){dw=ps*ir;dx=px-(dw-ps)/2;}
    else{dh=ps/ir;dy=py-(dh-ps)/2;}
    ctx.drawImage(img,dx,dy,dw,dh);
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    roundRect(ctx,px+30,py+30,200,70,35);
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.shadowColor='rgba(0,0,0,0.1)';
    ctx.shadowBlur=20;ctx.shadowOffsetY=4;
    ctx.fill();ctx.restore();

    ctx.font='bold 48px sans-serif';
    ctx.fillText(currentAnalysis.moodEmoji,px+50,py+78);
    ctx.font='bold 28px sans-serif';
    ctx.fillStyle='#333';
    ctx.fillText(currentAnalysis.mood,px+110,py+75);

    const my=py+ps+80;
    ctx.font='bold 36px sans-serif';
    ctx.fillStyle='#FF8C42';
    ctx.fillText('"',100,my);

    ctx.font='28px sans-serif';
    ctx.fillStyle='#555';
    const words=currentAnalysis.monologue.split('');
    let line='',ly=my+10,mw=w-200,lh=44;
    for(let i=0;i<words.length;i++){
      const tl=line+words[i];
      if(ctx.measureText(tl).width>mw&&i>0){
        ctx.fillText(line,100,ly);line=words[i];ly+=lh;
      }else line=tl;
    }
    ctx.fillText(line,100,ly);

    const ty=ly+60;
    ctx.save();
    ctx.beginPath();
    roundRect(ctx,100,ty,w-200,100,20);
    ctx.fillStyle='rgba(74,144,217,0.1)';
    ctx.fill();ctx.restore();

    ctx.font='24px sans-serif';
    ctx.fillStyle='#4A90D9';
    ctx.fillText('💡 小贴士',130,ty+40);

    ctx.font='22px sans-serif';
    ctx.fillStyle='#666';
    const tipText=currentAnalysis.tip.replace('💡 ','');
    let tl='',tly=ty+75,tmw=w-260;
    for(let i=0;i<tipText.length;i++){
      const t=tl+tipText[i];
      if(ctx.measureText(t).width>tmw&&i>0){
        ctx.fillText(tl,130,tly);tl=tipText[i];tly+=32;
      }else tl=t;
    }
    ctx.fillText(tl,130,tly);

    const by=h-140;
    ctx.beginPath();
    ctx.arc(w/2-100,by+40,50,0,Math.PI*2);
    ctx.fillStyle='#FF8C42';ctx.fill();

    ctx.font='bold 36px sans-serif';
    ctx.fillStyle='#FF8C42';
    ctx.fillText('Petwhisper',w/2-20,by+35);
    ctx.font='20px sans-serif';
    ctx.fillStyle='#999';
    ctx.fillText('AI 宠物翻译官 · 你拍一张，它说一句',w/2-20,by+65);

    const qs=100,qx=w-130,qy=h-170;
    ctx.save();
    ctx.beginPath();
    roundRect(ctx,qx,qy,qs,qs,12);
    ctx.fillStyle='#FFF';
    ctx.shadowColor='rgba(0,0,0,0.1)';
    ctx.shadowBlur=10;
    ctx.fill();ctx.restore();

    ctx.fillStyle='#333';
    ctx.font='16px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('扫码体验',qx+qs/2,qy+qs/2+6);
    ctx.textAlign='left';

    document.getElementById('posterImg').src=canvas.toDataURL('image/png');
  };
  img.src=currentPhoto;
}

function roundRect(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function downloadPoster(){
  const src=document.getElementById('posterImg').src;
  if(!src)return;
  const a=document.createElement('a');
  a.download='petwhisper-'+currentRecord.id+'.png';
  a.href=src;
  a.click();
}

async function copyPoster(){
  const src=document.getElementById('posterImg').src;
  if(!src)return;
  try{
    const res=await fetch(src);
    const blob=await res.blob();
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    alert('海报已复制到剪贴板！');
  }catch(e){
    console.error(e);
    alert('复制失败，请长按图片保存');
  }
}

init();
</script>
