<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吃啥好 · 健康美食决策器</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #10B981;
  --primary-light: #34D399;
  --primary-dark: #059669;
  --primary-bg: #ECFDF5;
  --ink: #065F46;
  --ink-light: #047857;
  --muted: #6EE7B7;
  --bg: #F0FDF4;
  --card: #ffffff;
  --border: #A7F3D0;
  --green: #10B981;
  --green-bg: #ECFDF5;
  --yellow: #F59E0B;
  --yellow-bg: #FEF3C7;
  --red: #EF4444;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 4px 16px rgba(16, 185, 129, 0.08);
  --shadow-lg: 0 12px 40px rgba(16, 185, 129, 0.15);
  --max-width: 390px;
}
html { font-size: 16px; }
body {
  font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
  background: linear-gradient(135deg, #F0FDF4 0%, #ECFDF5 50%, #F0FDF4 100%);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* ===== Phone Shell ===== */
.phone-wrapper {
  position: relative;
  width: var(--max-width);
  height: 844px;
  background: #000;
  border-radius: 50px;
  padding: 12px;
  box-shadow: 
    0 30px 60px rgba(16, 185, 129, 0.2),
    0 10px 30px rgba(0, 0, 0, 0.15),
    inset 0 0 0 3px #1F2937;
}

.phone-shell {
  position: relative;
  width: 100%;
  height: 100%;
  background: #000;
  border-radius: 40px;
  overflow: hidden;
}

.phone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 150px;
  height: 30px;
  background: #000;
  border-radius: 0 0 20px 20px;
  z-index: 1000;
}

.phone-screen {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 40px;
  position: relative;
}
input, button, textarea { font-family: inherit; font-size: inherit; border: none; outline: none; }
button { cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
button:active { transform: scale(0.96); }
.app {
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, #F0FDF4 0%, #ECFDF5 100%);
  position: relative;
  padding-bottom: 90px;
  padding-top: 50px;
  overflow-y: auto;
  overflow-x: hidden;
}

/* ===== Pages ===== */
.page { display: none; padding: 20px 16px; }
.page.active { display: block; }

/* ===== Header ===== */
.page-header {
  text-align: center;
  padding: 12px 0 8px;
}
.page-header h1 {
  font-size: 1.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.page-header .sub {
  font-size: 0.85rem;
  color: var(--muted);
  margin-top: 4px;
}

/* ===== Home Page ===== */
.home-hero {
  text-align: center;
  padding: 40px 20px 30px;
}
.home-hero .question {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
}
.home-hero .question .emoji {
  font-size: 2.2rem;
}
.home-hero .desc {
  font-size: 0.9rem;
  color: var(--ink-light);
  margin-bottom: 32px;
}
.home-actions {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 0 20px;
}
.btn-big {
  padding: 18px 24px;
  border-radius: var(--radius);
  font-size: 1.05rem;
  font-weight: 700;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  letter-spacing: -0.3px;
}
.btn-random {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  box-shadow: 
    0 8px 24px rgba(16, 185, 129, 0.35),
    0 4px 12px rgba(16, 185, 129, 0.2);
}
.btn-recommend {
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--border);
  box-shadow: var(--shadow);
}
.btn-big .icon { font-size: 1.4rem; }

.home-stats {
  margin: 30px 16px 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 16px 12px;
  text-align: center;
  box-shadow: var(--shadow);
  border: 1px solid rgba(16, 185, 129, 0.08);
}
.stat-card .num {
  font-size: 1.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-card .label {
  font-size: 0.75rem;
  color: var(--ink-light);
  margin-top: 4px;
  font-weight: 500;
}

.home-recent {
  margin: 24px 16px 0;
}
.home-recent h3 {
  font-size: 0.9rem;
  color: var(--ink-light);
  margin-bottom: 10px;
}
.recent-item {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}
.recent-item .info { flex: 1; }
.recent-item .name { font-weight: 600; font-size: 0.95rem; }
.recent-item .meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.recent-item .stars { color: var(--yellow); font-size: 0.8rem; }

/* ===== Spin Page ===== */
.spin-container {
  text-align: center;
  padding: 10px 0;
}
.spin-filter {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.filter-chip {
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 0.8rem;
  background: var(--card);
  color: var(--ink-light);
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.filter-chip.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.wheel-wrapper {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 0 auto 24px;
}
#wheelCanvas {
  width: 300px;
  height: 300px;
}
.wheel-pointer {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 24px solid var(--primary);
  z-index: 10;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
}
.wheel-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  z-index: 5;
}
.spin-btn {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  padding: 18px 56px;
  border-radius: 100px;
  font-size: 1.05rem;
  font-weight: 700;
  box-shadow: 
    0 10px 30px rgba(16, 185, 129, 0.35),
    0 4px 12px rgba(16, 185, 129, 0.2);
  letter-spacing: -0.3px;
}
.spin-btn:active { transform: scale(0.96); }
.spin-btn:disabled {
  opacity: 0.5;
  box-shadow: none;
}
.spin-hint {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 12px;
}

/* Spin Result Modal */
.result-modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
}
.result-modal.show { display: flex; }
.result-card {
  background: white;
  border-radius: 28px;
  padding: 36px 28px 28px;
  text-align: center;
  max-width: 340px;
  width: 100%;
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 
    0 25px 50px rgba(0, 0, 0, 0.2),
    0 0 0 1px rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(16, 185, 129, 0.1);
}
@keyframes popIn {
  from { transform: scale(0.7); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.result-card .result-emoji {
  font-size: 3.5rem;
  margin-bottom: 8px;
}
.result-card .result-label {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 4px;
}
.result-card .result-name {
  font-size: 1.6rem;
  font-weight: 800;
  margin-bottom: 12px;
}
.result-card .result-tags {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.result-card .result-tag {
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 100px;
  background: var(--primary-bg);
  color: var(--primary);
}
.result-card .result-meta {
  font-size: 0.85rem;
  color: var(--ink-light);
  margin-bottom: 20px;
}
.result-card .result-actions {
  display: flex;
  gap: 10px;
}
.result-card .btn-eat {
  flex: 1;
  padding: 12px;
  border-radius: 100px;
  background: var(--primary);
  color: white;
  font-weight: 700;
  font-size: 0.9rem;
}
.result-card .btn-reroll {
  flex: 1;
  padding: 12px;
  border-radius: 100px;
  background: var(--bg);
  color: var(--ink);
  font-weight: 600;
  font-size: 0.9rem;
}
.result-card .btn-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg);
  font-size: 1rem;
  color: var(--muted);
}
.result-card { position: relative; }

/* ===== Recommend Page ===== */
.recommend-container {
  padding: 10px 0;
}
.recommend-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 32px 24px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  margin-bottom: 16px;
  border: 1px solid rgba(16, 185, 129, 0.08);
}
.recommend-card .rec-emoji {
  font-size: 3rem;
  margin-bottom: 8px;
}
.recommend-card .rec-label {
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 4px;
}
.recommend-card .rec-name {
  font-size: 1.5rem;
  font-weight: 800;
  margin-bottom: 10px;
}
.recommend-card .rec-reason {
  display: inline-block;
  font-size: 0.78rem;
  padding: 4px 12px;
  border-radius: 100px;
  background: var(--green-bg);
  color: var(--green);
  margin-bottom: 14px;
}
.recommend-card .rec-tags {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.recommend-card .rec-tag {
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 100px;
  background: var(--primary-bg);
  color: var(--primary);
}
.recommend-card .rec-meta {
  font-size: 0.85rem;
  color: var(--ink-light);
  margin-bottom: 18px;
}
.recommend-card .rec-actions {
  display: flex;
  gap: 10px;
}
.recommend-card .btn-eat-rec {
  flex: 1;
  padding: 12px;
  border-radius: 100px;
  background: var(--primary);
  color: white;
  font-weight: 700;
  font-size: 0.9rem;
}
.recommend-card .btn-skip {
  flex: 1;
  padding: 12px;
  border-radius: 100px;
  background: var(--bg);
  color: var(--ink);
  font-weight: 600;
  font-size: 0.9rem;
}
.recommend-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.recommend-empty .emoji { font-size: 3rem; margin-bottom: 12px; }

/* ===== Menu Page ===== */
.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
}
.menu-header h2 { font-size: 1.3rem; font-weight: 800; }
.menu-header .count {
  font-size: 0.8rem;
  color: var(--muted);
}
.menu-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.menu-tabs::-webkit-scrollbar { display: none; }
.menu-tab {
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 0.82rem;
  white-space: nowrap;
  background: var(--card);
  color: var(--ink-light);
  border: 1px solid var(--border);
}
.menu-tab.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.dish-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dish-card {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 16px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  box-shadow: var(--shadow);
  position: relative;
  border: 1px solid rgba(16, 185, 129, 0.06);
  transition: all 0.2s ease;
}
.dish-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}
.dish-card .dish-emoji {
  font-size: 2rem;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--primary-bg) 0%, #D1FAE5 100%);
  border-radius: 14px;
  flex-shrink: 0;
}
.dish-card .dish-info { flex: 1; min-width: 0; }
.dish-card .dish-name {
  font-weight: 700;
  font-size: 0.95rem;
  margin-bottom: 4px;
}
.dish-card .dish-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.dish-card .dish-cat {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 100px;
  background: var(--border);
  color: var(--ink-light);
}
.dish-card .dish-stars { font-size: 0.78rem; color: var(--yellow); }
.dish-card .dish-price { font-size: 0.75rem; color: var(--muted); }
.dish-card .dish-tags {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.dish-card .dish-tag {
  font-size: 0.68rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--green-bg);
  color: var(--green);
}
.dish-card .dish-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}
.dish-card .dish-actions button {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--bg);
  font-size: 0.85rem;
}
.dish-card .dish-actions .btn-del { color: var(--red); }

.fab {
  position: absolute;
  bottom: 100px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  font-size: 1.8rem;
  box-shadow: 
    0 12px 32px rgba(16, 185, 129, 0.4),
    0 4px 12px rgba(16, 185, 129, 0.25);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 300;
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.9rem; }

/* ===== Add/Edit Modal ===== */
.form-modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 100;
  padding: 20px;
  overflow-y: auto;
}
.form-modal.show { display: block; }
.form-sheet {
  background: white;
  border-radius: 28px;
  max-width: 360px;
  margin: 20px auto;
  padding: 28px 24px;
  animation: slideUp 0.3s ease;
  box-shadow: 
    0 25px 50px rgba(0, 0, 0, 0.2),
    0 0 0 1px rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(16, 185, 129, 0.1);
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.form-sheet h2 {
  font-size: 1.2rem;
  font-weight: 800;
  margin-bottom: 20px;
  text-align: center;
}
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink-light);
  margin-bottom: 6px;
}
.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  background: var(--bg);
  transition: border 0.2s;
}
.form-group input:focus,
.form-group textarea:focus {
  border-color: var(--primary);
  background: white;
}
.cat-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.cat-option {
  padding: 10px 20px;
  border-radius: 100px;
  font-size: 0.85rem;
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--ink-light);
  transition: all 0.2s ease;
  font-weight: 500;
}
.cat-option.active {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border-color: transparent;
  color: white;
  box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
}
.tag-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.tag-option {
  padding: 8px 14px;
  border-radius: 100px;
  font-size: 0.8rem;
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--ink-light);
  transition: all 0.2s ease;
  font-weight: 500;
}
.tag-option.active {
  background: var(--green-bg);
  border-color: var(--primary);
  color: var(--primary);
}
.star-rating {
  display: flex;
  gap: 6px;
}
.star-rating .star {
  font-size: 1.6rem;
  color: var(--border);
  cursor: pointer;
  transition: color 0.15s;
}
.star-rating .star.active { color: var(--yellow); }
.form-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
}
.form-actions button {
  flex: 1;
  padding: 14px;
  border-radius: 100px;
  font-weight: 700;
  font-size: 0.95rem;
}
.btn-save { background: var(--primary); color: white; }
.btn-cancel { background: var(--bg); color: var(--ink-light); }

/* ===== History Page ===== */
.history-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.history-group h4 {
  font-size: 0.85rem;
  color: var(--ink-light);
  margin-bottom: 8px;
  font-weight: 600;
}
.history-item {
  background: var(--card);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
}
.history-item .h-emoji {
  font-size: 1.5rem;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary-bg);
  border-radius: 10px;
  flex-shrink: 0;
}
.history-item .h-info { flex: 1; }
.history-item .h-name { font-weight: 600; font-size: 0.9rem; }
.history-item .h-meta { font-size: 0.72rem; color: var(--muted); }
.history-item .h-del {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  font-size: 0.8rem;
}

/* ===== Tab Bar ===== */
.tab-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  width: 100%;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  display: flex;
  padding: 10px 0 20px;
  border-top: 1px solid rgba(16, 185, 129, 0.1);
  z-index: 50;
}
.tab-item {
  flex: 1;
  text-align: center;
  padding: 6px 0;
  color: var(--ink-light);
  opacity: 0.6;
  transition: all 0.2s ease;
}
.tab-item.active { 
  color: var(--primary); 
  opacity: 1;
}
.tab-item .tab-icon { font-size: 1.5rem; }
.tab-item .tab-label { 
  font-size: 0.7rem; 
  font-weight: 600; 
  margin-top: 2px;
}

/* ===== Toast ===== */
.toast {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 10px 20px;
  border-radius: 100px;
  font-size: 0.85rem;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ===== Misc ===== */
.section-title {
  font-size: 0.85rem;
  color: var(--ink-light);
  margin: 20px 0 10px;
  font-weight: 600;
}
</style>
</head>
<body>
<div class="phone-wrapper">
  <div class="phone-shell">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="app" id="app">

  <!-- ===== Home Page ===== -->
  <div class="page active" id="page-home">
    <div class="home-hero">
      <div class="question"><span class="emoji">🥗</span> 今天吃啥？</div>
      <p class="desc">把健康美食存进来，让每一顿都吃得营养又开心</p>
    </div>
    <div class="home-actions">
      <button class="btn-big btn-random" onclick="navigateTo('spin')">
        <span class="icon">🎲</span> 随机抽一个
      </button>
      <button class="btn-big btn-recommend" onclick="navigateTo('recommend')">
        <span class="icon">💚</span> 健康推荐
      </button>
    </div>
    <div class="home-stats" id="homeStats"></div>
    <div class="home-recent" id="homeRecent"></div>
  </div>

  <!-- ===== Spin Page ===== -->
  <div class="page" id="page-spin">
    <div class="page-header">
      <h1>🎲 随机抽一个</h1>
      <p class="sub">每一种选择都是美味与健康</p>
    </div>
    <div class="spin-container">
      <div class="spin-filter" id="spinFilter">
        <button class="filter-chip active" data-filter="all">全部</button>
        <button class="filter-chip" data-filter="外卖">外卖</button>
        <button class="filter-chip" data-filter="自己做">自己做</button>
        <button class="filter-chip" data-filter="堂食">堂食</button>
      </div>
      <div class="wheel-wrapper">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
        <div class="wheel-center">🥗</div>
      </div>
      <button class="spin-btn" id="spinBtn" onclick="spinWheel()">开始转！</button>
      <p class="spin-hint" id="spinHint">点击按钮，让转盘决定今天吃啥</p>
    </div>
  </div>

  <!-- ===== Recommend Page ===== -->
  <div class="page" id="page-recommend">
    <div class="page-header">
      <h1>💚 健康推荐</h1>
      <p class="sub">为你精选健康美味的选择</p>
    </div>
    <div class="recommend-container" id="recommendContainer">
    </div>
  </div>

  <!-- ===== Menu Page ===== -->
  <div class="page" id="page-menu">
    <div class="menu-header">
      <h2>🥗 健康菜单</h2>
      <span class="count" id="menuCount"></span>
    </div>
    <div class="menu-tabs" id="menuTabs">
      <button class="menu-tab active" data-cat="all">全部</button>
      <button class="menu-tab" data-cat="外卖">外卖</button>
      <button class="menu-tab" data-cat="自己做">自己做</button>
      <button class="menu-tab" data-cat="堂食">堂食</button>
    </div>
    <div class="dish-list" id="dishList"></div>
    <button class="fab" onclick="openForm()">+</button>
  </div>

  <!-- ===== History Page ===== -->
  <div class="page" id="page-history">
    <div class="page-header">
      <h1>💚 健康足迹</h1>
      <p class="sub">记录每一次健康美味</p>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- ===== Tab Bar ===== -->
  <div class="tab-bar">
    <div class="tab-item active" data-page="home" onclick="navigateTo('home')">
      <div class="tab-icon">🏠</div>
      <div class="tab-label">首页</div>
    </div>
    <div class="tab-item" data-page="menu" onclick="navigateTo('menu')">
      <div class="tab-icon">📖</div>
      <div class="tab-label">菜单</div>
    </div>
    <div class="tab-item" data-page="history" onclick="navigateTo('history')">
      <div class="tab-icon">📅</div>
      <div class="tab-label">记录</div>
    </div>
  </div>

  <!-- ===== Result Modal ===== -->
  <div class="result-modal" id="resultModal">
    <div class="result-card">
      <button class="btn-close" onclick="closeResult()">✕</button>
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <div class="result-label">今天就吃这个！</div>
      <div class="result-name" id="resultName"></div>
      <div class="result-tags" id="resultTags"></div>
      <div class="result-meta" id="resultMeta"></div>
      <div class="result-actions">
        <button class="btn-reroll" onclick="closeResult(); spinWheel();">换一个</button>
        <button class="btn-eat" onclick="markAsEatenFromResult()">就吃它了</button>
      </div>
    </div>
  </div>

  <!-- ===== Form Modal ===== -->
  <div class="form-modal" id="formModal">
    <div class="form-sheet">
      <h2 id="formTitle">添加菜品</h2>
      <div class="form-group">
        <label>菜名 *</label>
        <input type="text" id="dishName" placeholder="比如：黄焖鸡米饭" maxlength="20">
      </div>
      <div class="form-group">
        <label>分类 *</label>
        <div class="cat-options" id="catOptions">
          <button class="cat-option active" data-cat="外卖">外卖</button>
          <button class="cat-option" data-cat="自己做">自己做</button>
          <button class="cat-option" data-cat="堂食">堂食</button>
        </div>
      </div>
      <div class="form-group">
        <label>评分</label>
        <div class="star-rating" id="starRating">
          <span class="star active" data-val="1">★</span>
          <span class="star active" data-val="2">★</span>
          <span class="star active" data-val="3">★</span>
          <span class="star active" data-val="4">★</span>
          <span class="star active" data-val="5">★</span>
        </div>
      </div>
      <div class="form-group">
        <label>价格（元）</label>
        <input type="number" id="dishPrice" placeholder="大概多少钱" min="0" step="0.5">
      </div>
      <div class="form-group">
        <label>标签（可多选）</label>
        <div class="tag-options" id="tagOptions">
          <button class="tag-option" data-tag="辣">辣</button>
          <button class="tag-option" data-tag="清淡">清淡</button>
          <button class="tag-option" data-tag="快手">快手</button>
          <button class="tag-option" data-tag="硬菜">硬菜</button>
          <button class="tag-option" data-tag="健康">健康</button>
          <button class="tag-option" data-tag="罪恶">罪恶</button>
          <button class="tag-option" data-tag="下饭">下饭</button>
          <button class="tag-option" data-tag="汤面">汤面</button>
        </div>
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="dishNote" placeholder="比如：微辣、少放葱" maxlength="50">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeForm()">取消</button>
        <button class="btn-save" id="btnSave" onclick="saveDish()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast"></div>

</div>

<script>
// ===== Data Layer =====
var STORAGE_KEY = 'chishahao_data_v1';

var defaultDishes = [
  { id: 1, name: '黄焖鸡米饭', cat: '外卖', rating: 5, price: 22, tags: ['下饭','辣'], note: '微辣', emoji: '🍗', lastEaten: null, createdAt: Date.now() - 86400000 * 10 },
  { id: 2, name: '兰州拉面', cat: '外卖', rating: 4, price: 18, tags: ['汤面','快手'], note: '', emoji: '🍜', lastEaten: null, createdAt: Date.now() - 86400000 * 8 },
  { id: 3, name: '番茄炒蛋', cat: '自己做', rating: 5, price: 8, tags: ['快手','健康','下饭'], note: '', emoji: '🍅', lastEaten: null, createdAt: Date.now() - 86400000 * 5 },
  { id: 4, name: '酸菜鱼', cat: '自己做', rating: 5, price: 35, tags: ['硬菜','辣','下饭'], note: '买黑鱼', emoji: '🐟', lastEaten: null, createdAt: Date.now() - 86400000 * 3 },
  { id: 5, name: '麦当劳巨无霸', cat: '外卖', rating: 4, price: 28, tags: ['快手','罪恶'], note: '', emoji: '🍔', lastEaten: null, createdAt: Date.now() - 86400000 * 7 },
  { id: 6, name: '火锅', cat: '堂食', rating: 5, price: 80, tags: ['硬菜','辣'], note: '周末去', emoji: '🍲', lastEaten: null, createdAt: Date.now() - 86400000 * 15 },
  { id: 7, name: '寿司', cat: '堂食', rating: 4, price: 60, tags: ['清淡','健康'], note: '', emoji: '🍣', lastEaten: null, createdAt: Date.now() - 86400000 * 20 },
  { id: 8, name: '蛋炒饭', cat: '自己做', rating: 4, price: 5, tags: ['快手','下饭'], note: '加火腿肠', emoji: '🍚', lastEaten: null, createdAt: Date.now() - 86400000 * 2 },
  { id: 9, name: '螺蛳粉', cat: '外卖', rating: 5, price: 20, tags: ['辣','汤面','罪恶'], note: '加鸭脚', emoji: '🍜', lastEaten: null, createdAt: Date.now() - 86400000 * 6 },
  { id: 10, name: '沙拉', cat: '自己做', rating: 3, price: 15, tags: ['健康','清淡'], note: '', emoji: '🥗', lastEaten: null, createdAt: Date.now() - 86400000 * 1 }
];

var data = {
  dishes: [],
  history: [],
  nextId: 1
};

function loadData() {
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      data = JSON.parse(saved);
    } catch(e) {
      data = { dishes: defaultDishes.slice(), history: [], nextId: 11 };
    }
  } else {
    data = { dishes: defaultDishes.slice(), history: [], nextId: 11 };
    saveData();
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ===== Navigation =====
function navigateTo(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  var tab = document.querySelector('.tab-item[data-page="' + page + '"]');
  if (tab) tab.classList.add('active');
  window.scrollTo(0, 0);

  if (page === 'home') renderHome();
  if (page === 'menu') renderMenu();
  if (page === 'history') renderHistory();
  if (page === 'spin') drawWheel();
  if (page === 'recommend') renderRecommend();
}

// ===== Home Page =====
function renderHome() {
  var stats = document.getElementById('homeStats');
  var dishCount = data.dishes.length;
  var weekCount = getWeekHistoryCount();
  var avgRating = getAvgRating();
  stats.innerHTML =
    '<div class="stat-card"><div class="num">' + dishCount + '</div><div class="label">道菜</div></div>' +
    '<div class="stat-card"><div class="num">' + weekCount + '</div><div class="label">本周吃了</div></div>' +
    '<div class="stat-card"><div class="num">' + avgRating + '</div><div class="label">平均评分</div></div>';

  var recent = document.getElementById('homeRecent');
  var recentHistory = data.history.slice(-3).reverse();
  if (recentHistory.length === 0) {
    recent.innerHTML = '<h3>最近吃的</h3><p style="color:var(--muted);font-size:0.85rem;">还没有记录，去转一个吧！</p>';
  } else {
    var html = '<h3>最近吃的</h3>';
    recentHistory.forEach(function(h) {
      var dish = findDish(h.dishId);
      if (!dish) return;
      html += '<div class="recent-item">' +
        '<div class="info"><div class="name">' + dish.emoji + ' ' + dish.name + '</div>' +
        '<div class="meta">' + formatDate(h.date) + ' · ' + dish.cat + '</div></div>' +
        '<div class="stars">' + '★'.repeat(dish.rating) + '</div></div>';
    });
    recent.innerHTML = html;
  }
}

function getWeekHistoryCount() {
  var weekAgo = Date.now() - 7 * 86400000;
  return data.history.filter(function(h) { return h.date >= weekAgo; }).length;
}

function getAvgRating() {
  if (data.dishes.length === 0) return '-';
  var sum = data.dishes.reduce(function(s, d) { return s + d.rating; }, 0);
  return (sum / data.dishes.length).toFixed(1);
}

// ===== Spin Page =====
var currentFilter = 'all';
var spinning = false;
var currentRotation = 0;

document.getElementById('spinFilter').addEventListener('click', function(e) {
  if (e.target.classList.contains('filter-chip')) {
    document.querySelectorAll('.filter-chip').forEach(function(c) { c.classList.remove('active'); });
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    drawWheel();
  }
});

function getFilteredDishes() {
  if (currentFilter === 'all') return data.dishes;
  return data.dishes.filter(function(d) { return d.cat === currentFilter; });
}

function drawWheel() {
  var canvas = document.getElementById('wheelCanvas');
  var ctx = canvas.getContext('2d');
  var cx = 150, cy = 150, radius = 145;
  ctx.clearRect(0, 0, 300, 300);

  var dishes = getFilteredDishes();
  if (dishes.length === 0) {
    ctx.fillStyle = '#f0eae5';
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#b5ada8';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🥗 暂无菜品', cx, cy + 5);
    ctx.fillText('先去菜单添加吧', cx, cy + 25);
    return;
  }

  var n = dishes.length;
  var anglePer = (Math.PI * 2) / n;
  var colors = ['#4CAF50','#81C784','#66BB6A','#43A047','#8BC34A','#9CCC65','#7CB342','#CDDC39','#D4E157','#C0CA33'];

  for (var i = 0; i < n; i++) {
    var startAngle = i * anglePer + currentRotation - Math.PI / 2;
    var endAngle = startAngle + anglePer;
    ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    // text
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(startAngle + anglePer / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'white';
    ctx.font = 'bold 12px sans-serif';
    var text = dishes[i].name;
    if (text.length > 6) text = text.substring(0, 6) + '..';
    ctx.fillText(text, radius - 10, 5);
    ctx.restore();
  }

  // outer ring
  ctx.strokeStyle = '#4CAF50';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.stroke();
}

function spinWheel() {
  if (spinning) return;
  var dishes = getFilteredDishes();
  if (dishes.length === 0) {
    showToast('这个分类下还没有菜品，先去添加吧');
    return;
  }
  if (dishes.length === 1) {
    showResult(dishes[0]);
    return;
  }

  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('spinHint').textContent = '转动中...';

  var n = dishes.length;
  var anglePer = (Math.PI * 2) / n;
  var targetIndex = Math.floor(Math.random() * n);
  // pointer is at top (0deg = -PI/2 in canvas). We need target sector center under pointer.
  // sector i center angle = i * anglePer + anglePer/2 (from -PI/2)
  // we want this to be at 0 (top), so rotation = -(i * anglePer + anglePer/2)
  // plus extra full rotations
  var extraRotations = 5 + Math.random() * 3; // 5-8 full rotations
  var targetAngle = -(targetIndex * anglePer + anglePer / 2);
  var finalRotation = extraRotations * Math.PI * 2 + targetAngle;

  var startRotation = currentRotation;
  var totalChange = finalRotation - (startRotation % (Math.PI * 2));
  // normalize: ensure we always spin forward
  while (totalChange < Math.PI * 4) totalChange += Math.PI * 2;

  var duration = 3500;
  var startTime = null;

  function animate(ts) {
    if (!startTime) startTime = ts;
    var elapsed = ts - startTime;
    var progress = Math.min(elapsed / duration, 1);
    // ease out cubic
    var eased = 1 - Math.pow(1 - progress, 3);
    currentRotation = startRotation + totalChange * eased;
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('spinHint').textContent = '点击按钮，让转盘决定今天吃啥';
      // determine which dish is at pointer
      var normalizedRot = ((currentRotation % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      // pointer at top = 0 angle from -PI/2
      // sector i starts at i*anglePer - PI/2 + rotation
      // pointer at angle 0 (from -PI/2 reference, so actual = -PI/2)
      // find which sector contains the pointer
      var pointerAngle = (Math.PI * 2 - normalizedRot) % (Math.PI * 2);
      var landedIndex = Math.floor(pointerAngle / anglePer) % n;
      showResult(dishes[landedIndex]);
    }
  }
  requestAnimationFrame(animate);
}

function showResult(dish) {
  document.getElementById('resultEmoji').textContent = dish.emoji;
  document.getElementById('resultName').textContent = dish.name;
  var tagsHtml = '';
  dish.tags.forEach(function(t) {
    tagsHtml += '<span class="result-tag">' + t + '</span>';
  });
  if (dish.cat) tagsHtml = '<span class="result-tag">' + dish.cat + '</span>' + tagsHtml;
  document.getElementById('resultTags').innerHTML = tagsHtml;
  var meta = '★'.repeat(dish.rating);
  if (dish.price) meta += ' · 约' + dish.price + '元';
  if (dish.note) meta += ' · ' + dish.note;
  document.getElementById('resultMeta').textContent = meta;
  document.getElementById('resultModal').classList.add('show');
}

function closeResult() {
  document.getElementById('resultModal').classList.remove('show');
}

function markAsEatenFromResult() {
  var name = document.getElementById('resultName').textContent;
  var dish = data.dishes.find(function(d) { return d.name === name; });
  if (dish) {
    addToHistory(dish.id);
    closeResult();
    showToast('已记录：今天吃了' + dish.name);
  }
}

// ===== Recommend Page =====
function renderRecommend() {
  var container = document.getElementById('recommendContainer');
  if (data.dishes.length === 0) {
    container.innerHTML = '<div class="recommend-empty"><div class="emoji">🥗</div><p>还没有菜品，先去菜单添加吧</p></div>';
    return;
  }

  var recommended = getRecommendation();
  if (!recommended) {
    container.innerHTML = '<div class="recommend-empty"><div class="emoji">🥗</div><p>暂无推荐，多添加一些菜品试试</p></div>';
    return;
  }

  var reason = getRecommendReason(recommended);
  var tagsHtml = '';
  recommended.tags.forEach(function(t) {
    tagsHtml += '<span class="rec-tag">' + t + '</span>';
  });

  var meta = '★'.repeat(recommended.rating);
  if (recommended.price) meta += ' · 约' + recommended.price + '元';
  if (recommended.note) meta += ' · ' + recommended.note;

  container.innerHTML =
    '<div class="recommend-card">' +
      '<div class="rec-emoji">' + recommended.emoji + '</div>' +
      '<div class="rec-label">为你推荐</div>' +
      '<div class="rec-name">' + recommended.name + '</div>' +
      '<div class="rec-reason">' + reason + '</div>' +
      '<div class="rec-tags"><span class="rec-tag">' + recommended.cat + '</span>' + tagsHtml + '</div>' +
      '<div class="rec-meta">' + meta + '</div>' +
      '<div class="rec-actions">' +
        '<button class="btn-skip" onclick="skipRecommend()">不喜欢，换一个</button>' +
        '<button class="btn-eat-rec" onclick="eatRecommend()">就吃它了</button>' +
      '</div>' +
    '</div>';

  // store current recommendation for skip logic
  container.dataset.currentId = recommended.id;
}

var recentSkips = [];

function getRecommendation() {
  var candidates = data.dishes.filter(function(d) { return recentSkips.indexOf(d.id) === -1; });
  if (candidates.length === 0) {
    recentSkips = [];
    candidates = data.dishes.slice();
  }

  // score each dish
  var scored = candidates.map(function(d) {
    var score = 0;
    // rating weight: 40%
    score += (d.rating / 5) * 40;
    // recency weight: 40% (longer since last eaten = higher score)
    if (d.lastEaten) {
      var daysSince = (Date.now() - d.lastEaten) / 86400000;
      score += Math.min(daysSince / 14, 1) * 40;
    } else {
      score += 40; // never eaten = max recency score
    }
    // randomness: 20%
    score += Math.random() * 20;
    return { dish: d, score: score };
  });

  scored.sort(function(a, b) { return b.score - a.score; });
  // pick from top 3 randomly to add variety
  var topN = Math.min(3, scored.length);
  var pick = Math.floor(Math.random() * topN);
  return scored[pick].dish;
}

function getRecommendReason(dish) {
  var reasons = [];
  if (dish.rating === 5) reasons.push('你给了5星好评');
  else if (dish.rating >= 4) reasons.push('你评分很高');
  if (!dish.lastEaten) reasons.push('还没吃过');
  else {
    var days = Math.floor((Date.now() - dish.lastEaten) / 86400000);
    if (days >= 14) reasons.push('半个月没吃了');
    else if (days >= 7) reasons.push('一周没吃了');
    else if (days >= 3) reasons.push('几天没吃了');
  }
  if (dish.tags.indexOf('快手') !== -1) reasons.push('快手省时');
  if (dish.tags.indexOf('健康') !== -1) reasons.push('健康选择');

  if (reasons.length === 0) return '随机推荐';
  return reasons.slice(0, 2).join(' · ');
}

function skipRecommend() {
  var container = document.getElementById('recommendContainer');
  var currentId = parseInt(container.dataset.currentId);
  recentSkips.push(currentId);
  if (recentSkips.length > 10) recentSkips.shift();
  renderRecommend();
}

function eatRecommend() {
  var container = document.getElementById('recommendContainer');
  var currentId = parseInt(container.dataset.currentId);
  addToHistory(currentId);
  recentSkips = [];
  showToast('已记录， Enjoy your meal!');
  navigateTo('home');
}

// ===== Menu Page =====
var menuFilter = 'all';

document.getElementById('menuTabs').addEventListener('click', function(e) {
  if (e.target.classList.contains('menu-tab')) {
    document.querySelectorAll('.menu-tab').forEach(function(t) { t.classList.remove('active'); });
    e.target.classList.add('active');
    menuFilter = e.target.dataset.cat;
    renderMenu();
  }
});

function renderMenu() {
  var list = document.getElementById('dishList');
  var count = document.getElementById('menuCount');
  var dishes = menuFilter === 'all' ? data.dishes : data.dishes.filter(function(d) { return d.cat === menuFilter; });
  count.textContent = '共' + dishes.length + '道';

  if (dishes.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">🥗</div><p>' + (menuFilter === 'all' ? '还没有菜品，点击 + 添加' : '这个分类下还没有菜品') + '</p></div>';
    return;
  }

  // sort by rating desc, then name
  dishes.sort(function(a, b) { return b.rating - a.rating || a.name.localeCompare(b.name); });

  var html = '';
  dishes.forEach(function(d) {
    var tagsHtml = '';
    d.tags.forEach(function(t) {
      tagsHtml += '<span class="dish-tag">' + t + '</span>';
    });
    var priceHtml = d.price ? '<span class="dish-price">· ¥' + d.price + '</span>' : '';
    html +=
      '<div class="dish-card">' +
        '<div class="dish-emoji">' + d.emoji + '</div>' +
        '<div class="dish-info">' +
          '<div class="dish-name">' + d.name + (d.note ? ' <span style="font-size:0.75rem;color:var(--muted);font-weight:400;">' + d.note + '</span>' : '') + '</div>' +
          '<div class="dish-meta">' +
            '<span class="dish-cat">' + d.cat + '</span>' +
            '<span class="dish-stars">' + '★'.repeat(d.rating) + '</span>' +
            priceHtml +
          '</div>' +
          (tagsHtml ? '<div class="dish-tags">' + tagsHtml + '</div>' : '') +
        '</div>' +
        '<div class="dish-actions">' +
          '<button onclick="editDish(' + d.id + ')" title="编辑">✏️</button>' +
          '<button class="btn-del" onclick="deleteDish(' + d.id + ')" title="删除">🗑</button>' +
        '</div>' +
      '</div>';
  });
  list.innerHTML = html;
}

// ===== Form =====
var editingId = null;
var selectedCat = '外卖';
var selectedRating = 5;
var selectedTags = [];

function openForm() {
  editingId = null;
  document.getElementById('formTitle').textContent = '添加菜品';
  document.getElementById('dishName').value = '';
  document.getElementById('dishPrice').value = '';
  document.getElementById('dishNote').value = '';
  selectedCat = '外卖';
  selectedRating = 5;
  selectedTags = [];
  updateFormUI();
  document.getElementById('formModal').classList.add('show');
}

function closeForm() {
  document.getElementById('formModal').classList.remove('show');
}

function editDish(id) {
  var dish = findDish(id);
  if (!dish) return;
  editingId = id;
  document.getElementById('formTitle').textContent = '编辑菜品';
  document.getElementById('dishName').value = dish.name;
  document.getElementById('dishPrice').value = dish.price || '';
  document.getElementById('dishNote').value = dish.note || '';
  selectedCat = dish.cat;
  selectedRating = dish.rating;
  selectedTags = dish.tags.slice();
  updateFormUI();
  document.getElementById('formModal').classList.add('show');
}

function updateFormUI() {
  document.querySelectorAll('.cat-option').forEach(function(b) {
    b.classList.toggle('active', b.dataset.cat === selectedCat);
  });
  document.querySelectorAll('.star').forEach(function(s) {
    s.classList.toggle('active', parseInt(s.dataset.val) <= selectedRating);
  });
  document.querySelectorAll('.tag-option').forEach(function(b) {
    b.classList.toggle('active', selectedTags.indexOf(b.dataset.tag) !== -1);
  });
}

document.getElementById('catOptions').addEventListener('click', function(e) {
  if (e.target.classList.contains('cat-option')) {
    selectedCat = e.target.dataset.cat;
    updateFormUI();
  }
});

document.getElementById('starRating').addEventListener('click', function(e) {
  if (e.target.classList.contains('star')) {
    selectedRating = parseInt(e.target.dataset.val);
    updateFormUI();
  }
});

document.getElementById('tagOptions').addEventListener('click', function(e) {
  if (e.target.classList.contains('tag-option')) {
    var tag = e.target.dataset.tag;
    var idx = selectedTags.indexOf(tag);
    if (idx === -1) selectedTags.push(tag);
    else selectedTags.splice(idx, 1);
    updateFormUI();
  }
});

var emojiMap = {
  '鸡': '🍗', '鸭': '🍖', '鱼': '🐟', '虾': '🦐', '蟹': '🦀',
  '面': '🍜', '饭': '🍚', '粉': '🍜', '粥': '🥣', '汤': '🍲',
  '汉堡': '🍔', '薯条': '🍟', '披萨': '🍕', '寿司': '🍣', '沙拉': '🥗',
  '火锅': '🍲', '烧烤': '🍢', '串': '🍢', '饺子': '🥟', '包子': '🥟',
  '蛋糕': '🍰', '奶茶': '🧋', '咖啡': '☕', '茶': '🍵', '果汁': '🧃',
  '蛋': '🍳', '番茄': '🍅', '菜': '🥬', '豆腐': '🍚', '牛肉': '🥩',
  '猪肉': '🥩', '羊肉': '🥩', '排骨': '🍖'
};

function getEmoji(name) {
  for (var key in emojiMap) {
    if (name.indexOf(key) !== -1) return emojiMap[key];
  }
  return '🍽️';
}

function saveDish() {
  var name = document.getElementById('dishName').value.trim();
  if (!name) {
    showToast('请输入菜名');
    return;
  }
  var price = parseFloat(document.getElementById('dishPrice').value) || 0;
  var note = document.getElementById('dishNote').value.trim();

  if (editingId) {
    var dish = findDish(editingId);
    dish.name = name;
    dish.cat = selectedCat;
    dish.rating = selectedRating;
    dish.price = price;
    dish.tags = selectedTags.slice();
    dish.note = note;
    showToast('已更新');
  } else {
    data.dishes.push({
      id: data.nextId++,
      name: name,
      cat: selectedCat,
      rating: selectedRating,
      price: price,
      tags: selectedTags.slice(),
      note: note,
      emoji: getEmoji(name),
      lastEaten: null,
      createdAt: Date.now()
    });
    showToast('已添加：' + name);
  }
  saveData();
  closeForm();
  renderMenu();
}

function deleteDish(id) {
  if (!confirm('确定删除这道菜吗？')) return;
  data.dishes = data.dishes.filter(function(d) { return d.id !== id; });
  saveData();
  renderMenu();
  showToast('已删除');
}

// ===== History =====
function addToHistory(dishId) {
  var dish = findDish(dishId);
  if (!dish) return;
  data.history.push({ dishId: dishId, date: Date.now() });
  dish.lastEaten = Date.now();
  saveData();
}

function renderHistory() {
  var list = document.getElementById('historyList');
  if (data.history.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">🥗</div><p>还没有记录<br>吃完记得来标记一下</p></div>';
    return;
  }

  // group by date
  var groups = {};
  var sorted = data.history.slice().reverse();
  sorted.forEach(function(h) {
    var key = formatDate(h.date);
    if (!groups[key]) groups[key] = [];
    groups[key].push(h);
  });

  var html = '';
  for (var date in groups) {
    html += '<div class="history-group"><h4>' + date + '</h4>';
    groups[date].forEach(function(h) {
      var dish = findDish(h.dishId);
      if (!dish) return;
      html +=
        '<div class="history-item">' +
          '<div class="h-emoji">' + dish.emoji + '</div>' +
          '<div class="h-info">' +
            '<div class="h-name">' + dish.name + '</div>' +
            '<div class="h-meta">' + dish.cat + ' · ' + formatTime(h.date) + '</div>' +
          '</div>' +
          '<button class="h-del" onclick="removeHistory(' + h.date + ')">✕</button>' +
        '</div>';
    });
    html += '</div>';
  }
  list.innerHTML = html;
}

function removeHistory(date) {
  data.history = data.history.filter(function(h) { return h.date !== date; });
  saveData();
  renderHistory();
}

// ===== Utils =====
function findDish(id) {
  return data.dishes.find(function(d) { return d.id === id; });
}

function formatDate(ts) {
  var d = new Date(ts);
  var today = new Date();
  var yesterday = new Date(Date.now() - 86400000);
  if (d.toDateString() === today.toDateString()) return '今天';
  if (d.toDateString() === yesterday.toDateString()) return '昨天';
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}

function formatTime(ts) {
  var d = new Date(ts);
  return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
}

function showToast(msg) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 2000);
}

// ===== Init =====
loadData();
renderHome();
