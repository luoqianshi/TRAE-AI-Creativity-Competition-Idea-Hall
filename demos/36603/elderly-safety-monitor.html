        <input type="text" id="searchInput" placeholder="搜索姓名、住址...">
      </div>
      <select class="filter-select" id="filterRisk">
        <option value="all">全部风险等级</option>
        <option value="high">高风险</option>
        <option value="medium">中风险</option>
        <option value="low">低风险</option>
      </select>
      <select class="filter-select" id="filterStatus">
        <option value="all">全部设备状态</option>
        <option value="online">在线</option>
        <option value="offline">离线</option>
      </select>
      <button class="btn btn-danger" id="btnSimulateAlert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        模拟告警
      </button>
      <button class="btn btn-outline" id="btnExport">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        导出数据
      </button>
    </div>

    <div class="elder-grid" id="elderGrid">
      <!-- Cards will be rendered by JS -->
    </div>
  </section>

</main>

<!-- Alert Modal -->
<div class="modal-overlay" id="alertModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        告警详情
      </h3>
      <button class="modal-close" id="modalClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="alertModalBody">
      <!-- Alert details rendered by JS -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="btnDismiss">标记已处理</button>
      <button class="btn btn-primary" id="btnDispatch">立即派单</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
(function() {
  // ===== Data =====
  var elders = [
    { id: 1, name: '张秀英', age: 82, gender: 'female', address: '幸福社区 3号楼 502室', phone: '138****2356', device: '烟雾传感器', status: 'online', risk: 'high', lastActive: '刚刚', emergency: '李明（儿子） 139****8821' },
    { id: 2, name: '王建国', age: 78, gender: 'male', address: '阳光社区 7号楼 301室', phone: '136****7742', device: '门磁传感器', status: 'online', risk: 'medium', lastActive: '5分钟前', emergency: '王芳（女儿） 137****5533' },
    { id: 3, name: '李淑芬', age: 85, gender: 'female', address: '和谐社区 1号楼 1201室', phone: '135****9918', device: '紧急按钮', status: 'online', risk: 'high', lastActive: '1分钟前', emergency: '李强（儿子） 158****3347' },
    { id: 4, name: '赵德明', age: 76, gender: 'male', address: '幸福社区 5号楼 203室', phone: '133****4456', device: '红外感应', status: 'offline', risk: 'low', lastActive: '2小时前', emergency: '赵敏（女儿） 186****6678' },
    { id: 5, name: '陈玉兰', age: 88, gender: 'female', address: '康乐社区 2号楼 801室', phone: '159****1123', device: '烟雾传感器', status: 'online', risk: 'high', lastActive: '刚刚', emergency: '陈伟（儿子） 135****9945' },
    { id: 6, name: '刘国栋', age: 73, gender: 'male', address: '阳光社区 9号楼 602室', phone: '188****3378', device: '门磁传感器', status: 'online', risk: 'low', lastActive: '10分钟前', emergency: '刘洋（儿子） 136****2214' },
    { id: 7, name: '孙桂兰', age: 80, gender: 'female', address: '和谐社区 4号楼 403室', phone: '137****5567', device: '紧急按钮', status: 'offline', risk: 'medium', lastActive: '30分钟前', emergency: '孙磊（儿子） 155****7789' },
    { id: 8, name: '周志强', age: 75, gender: 'male', address: '康乐社区 6号楼 102室', phone: '150****8890', device: '红外感应', status: 'online', risk: 'low', lastActive: '3分钟前', emergency: '周婷（女儿） 189****1122' },
    { id: 9, name: '吴秀珍', age: 83, gender: 'female', address: '幸福社区 8号楼 1501室', phone: '131****2234', device: '烟雾传感器', status: 'online', risk: 'medium', lastActive: '8分钟前', emergency: '吴刚（儿子） 132****5566' },
    { id: 10, name: '马文华', age: 79, gender: 'male', address: '阳光社区 2号楼 704室', phone: '182****6678', device: '门磁传感器', status: 'online', risk: 'low', lastActive: '15分钟前', emergency: '马丽（女儿） 157****3344' },
    { id: 11, name: '黄桂芳', age: 86, gender: 'female', address: '和谐社区 3号楼 901室', phone: '139****9901', device: '紧急按钮', status: 'online', risk: 'high', lastActive: '刚刚', emergency: '黄涛（儿子） 138****7755' },
    { id: 12, name: '郑福来', age: 77, gender: 'male', address: '康乐社区 10号楼 305室', phone: '156****3345', device: '红外感应', status: 'offline', risk: 'medium', lastActive: '1小时前', emergency: '郑洁（女儿） 133****8899' }
  ];

  var alertTypes = [
    { type: '烟雾传感器触发', level: 'high', desc: '检测到烟雾浓度异常升高，疑似火情。', action: '已通知消防部门及社区值班人员' },
    { type: '紧急按钮按下', level: 'high', desc: '老人按下紧急呼叫按钮，可能需要紧急救助。', action: '已联系社区网格员前往查看' },
    { type: '长时间无活动', level: 'medium', desc: '红外感应器超过12小时未检测到活动。', action: '已通知社区志愿者上门查看' },
    { type: '门磁异常开启', level: 'medium', desc: '深夜时段检测到门窗异常开启。', action: '已通知社区安保人员' },
    { type: '设备离线告警', level: 'low', desc: '监测设备持续离线超过2小时。', action: '已安排技术人员上门检修' }
  ];

  // ===== Render Elder Cards =====
  function renderCards(data) {
    var grid = document.getElementById('elderGrid');
    if (data.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted);font-size:15px;">未找到匹配的老人信息</div>';
      return;
    }
    var html = '';
    data.forEach(function(e) {
      var riskLabel = e.risk === 'high' ? '高风险' : e.risk === 'medium' ? '中风险' : '低风险';
      var riskClass = 'risk-' + e.risk;
      var statusLabel = e.status === 'online' ? '在线' : '离线';
      var statusClass = e.status;
      var initial = e.name.charAt(0);

      html += '<div class="elder-card" data-id="' + e.id + '">' +
        '<div class="elder-card-header">' +
          '<div class="elder-name-row">' +
            '<div class="elder-avatar ' + e.gender + '">' + initial + '</div>' +
            '<div><div class="elder-name">' + e.name + '</div><div class="elder-age">' + e.age + '岁</div></div>' +
          '</div>' +
          '<span class="risk-badge ' + riskClass + '">' + riskLabel + '</span>' +
        '</div>' +
        '<div class="elder-card-body">' +
          '<div class="elder-info-row">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
            e.address +
          '</div>' +
          '<div class="elder-info-row">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2" ry="2"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>' +
            '设备：<span>' + e.device + '</span>' +
          '</div>' +
          '<div class="elder-info-row">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' +
            '联系人：<span>' + e.emergency.split(' ')[0] + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="elder-card-footer">' +
          '<div style="display:flex;flex-direction:column;gap:2px;">' +
            '<div class="device-status ' + statusClass + '"><span class="status-dot ' + statusClass + '"></span>' + statusLabel + '</div>' +
            '<div class="last-active">最近活动：' + e.lastActive + '</div>' +
          '</div>' +
          '<div class="elder-actions">' +
            '<button class="btn-sm" onclick="showDetail(' + e.id + ')">详情</button>' +
            '<button class="btn-sm danger" onclick="triggerAlert(' + e.id + ')">告警</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    });
    grid.innerHTML = html;
  }

  // ===== Filter & Search =====
  function applyFilters() {
    var search = document.getElementById('searchInput').value.toLowerCase();
    var riskFilter = document.getElementById('filterRisk').value;
    var statusFilter = document.getElementById('filterStatus').value;

    var filtered = elders.filter(function(e) {
      var matchSearch = !search || e.name.toLowerCase().indexOf(search) !== -1 || e.address.toLowerCase().indexOf(search) !== -1;
      var matchRisk = riskFilter === 'all' || e.risk === riskFilter;
      var matchStatus = statusFilter === 'all' || e.status === statusFilter;
      return matchSearch && matchRisk && matchStatus;
    });
    renderCards(filtered);
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('filterRisk').addEventListener('change', applyFilters);
  document.getElementById('filterStatus').addEventListener('change', applyFilters);

  // ===== Simulate Alert =====
  document.getElementById('btnSimulateAlert').addEventListener('click', function() {
    var randomElder = elders[Math.floor(Math.random() * elders.length)];
    var randomAlert = alertTypes[Math.floor(Math.random() * alertTypes.length)];
    showAlertModal(randomElder, randomAlert);
  });

  // ===== Trigger Alert for specific elder =====
  window.triggerAlert = function(id) {
    var elder = elders.find(function(e) { return e.id === id; });
    if (!elder) return;
    var randomAlert = alertTypes[Math.floor(Math.random() * alertTypes.length)];
    showAlertModal(elder, randomAlert);
  };

  // ===== Show Detail =====
  window.showDetail = function(id) {
    var elder = elders.find(function(e) { return e.id === id; });
    if (!elder) return;
    showToast('查看 ' + elder.name + ' 的详细信息', 'success');
  };

  // ===== Alert Modal =====
  function showAlertModal(elder, alertInfo) {
    var now = new Date();
    var timeStr = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

    var levelLabel = alertInfo.level === 'high' ? '高危告警' : alertInfo.level === 'medium' ? '中危告警' : '低危告警';

    var body = document.getElementById('alertModalBody');
    body.innerHTML =
      '<div class="alert-level-bar ' + alertInfo.level + '">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
        levelLabel + '：' + alertInfo.type +
      '</div>' +
      '<div class="alert-detail-grid">' +
        '<div class="alert-detail-item"><div class="alert-detail-label">老人姓名</div><div class="alert-detail-value">' + elder.name + '（' + elder.age + '岁）</div></div>' +
        '<div class="alert-detail-item"><div class="alert-detail-label">联系电话</div><div class="alert-detail-value">' + elder.phone + '</div></div>' +
        '<div class="alert-detail-item"><div class="alert-detail-label">居住地址</div><div class="alert-detail-value">' + elder.address + '</div></div>' +
        '<div class="alert-detail-item"><div class="alert-detail-label">紧急联系人</div><div class="alert-detail-value">' + elder.emergency + '</div></div>' +
        '<div class="alert-detail-item"><div class="alert-detail-label">告警设备</div><div class="alert-detail-value">' + elder.device + '</div></div>' +
        '<div class="alert-detail-item"><div class="alert-detail-label">告警时间</div><div class="alert-detail-value">' + timeStr + '</div></div>' +
      '</div>' +
      '<div style="background:var(--bg);padding:12px 14px;border-radius:6px;margin-bottom:1rem;">' +
        '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">告警描述</div>' +
        '<div style="font-size:14px;color:var(--ink);">' + alertInfo.desc + '</div>' +
      '</div>' +
      '<div class="alert-timeline">' +
        '<div class="alert-timeline-title">处理进度</div>' +
        '<div class="timeline-item">' +
          '<div class="timeline-dot active"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></div>' +
          '<div class="timeline-content"><div class="timeline-text">系统检测到异常</div><div class="timeline-time">' + timeStr + '</div></div>' +
        '</div>' +
        '<div class="timeline-item">' +
          '<div class="timeline-dot pending"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>' +
          '<div class="timeline-content"><div class="timeline-text">' + alertInfo.action + '</div><div class="timeline-time">处理中...</div></div>' +
        '</div>' +
        '<div class="timeline-item">' +
          '<div class="timeline-dot done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg></div>' +
          '<div class="timeline-content"><div class="timeline-text" style="color:var(--muted);">等待现场确认</div><div class="timeline-time">待处理</div></div>' +
        '</div>' +
      '</div>';

    document.getElementById('alertModal').classList.add('active');
  }

  // Close modal
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('alertModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  document.getElementById('btnDismiss').addEventListener('click', function() {
    closeModal();
    showToast('告警已标记为已处理', 'success');
  });
  document.getElementById('btnDispatch').addEventListener('click', function() {
    closeModal();
    showToast('工单已派发，请等待处理结果', 'warning');
  });

  function closeModal() {
    document.getElementById('alertModal').classList.remove('active');
  }

  // ===== Toast =====
  function showToast(msg, type) {
    var container = document.getElementById('toastContainer');
    var toast = document.createElement('div');
    toast.className = 'toast ' + (type || '');
    var icon = type === 'success'
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>'
      : type === 'warning'
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>';
    toast.innerHTML = icon + '<span>' + msg + '</span>';
    container.appendChild(toast);
    setTimeout(function() {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(100%)';
      toast.style.transition = 'all 0.3s';
      setTimeout(function() { toast.remove(); }, 300);
    }, 3000);
  }

  // ===== Export =====
  document.getElementById('btnExport').addEventListener('click', function() {
    showToast('数据导出功能已触发，文件生成中...', 'success');
  });

  // ===== Time Update =====
  function updateTime() {
    var now = new Date();
    var str = now.getFullYear() + '年' + pad(now.getMonth() + 1) + '月' + pad(now.getDate()) + '日 ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    document.getElementById('headerTime').textContent = str;
    document.getElementById('updateTime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  updateTime();
  setInterval(updateTime, 1000);

  // ===== Keyboard =====
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  // ===== Init =====
  renderCards(elders);
})();
</script>
</body>
</html>
