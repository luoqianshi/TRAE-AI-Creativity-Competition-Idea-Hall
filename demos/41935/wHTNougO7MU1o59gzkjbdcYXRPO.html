<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鼠标轨迹记录器 · 数字行为日记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: #141a24;
            border-radius: 28px;
            padding: 24px 28px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #2a3344;
        }
        h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }
        h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #8896b0;
            margin-left: 6px;
        }
        .sub {
            color: #6f7d9a;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 3px solid #3b82f6;
            padding-left: 14px;
            background: #1e2633;
            border-radius: 0 10px 10px 0;
            line-height: 1.6;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            margin: 16px 0 20px;
            align-items: center;
        }
        .toolbar button {
            background: #1f2a3a;
            border: none;
            color: #d6deed;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #2f3b50;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .toolbar button:hover {
            background: #2b3a50;
            border-color: #4a5f7a;
            color: #fff;
            transform: scale(1.02);
        }
        .toolbar button.primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }
        .toolbar button.primary:hover {
            background: #2563eb;
        }
        .toolbar button.danger {
            border-color: #b91c1c;
            color: #f87171;
        }
        .toolbar button.danger:hover {
            background: #3b1a1a;
        }
        .status-badge {
            margin-left: auto;
            font-size: 13px;
            background: #1a2330;
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #2d3a4e;
            color: #9aaccc;
        }
        .status-badge .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
            background: #22c55e;
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .canvas-wrapper {
            position: relative;
            background: #0f151e;
            border-radius: 18px;
            border: 1px solid #26303f;
            overflow: hidden;
            margin-top: 6px;
        }
        #canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #0f151e;
            cursor: crosshair;
            touch-action: none;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 24px 48px;
            margin-top: 18px;
            padding: 12px 16px 8px;
            background: #111a24;
            border-radius: 16px;
            font-size: 14px;
            color: #b2c2df;
            border: 1px solid #25303f;
        }
        .stats span {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .stats strong {
            color: #e8edf5;
            font-weight: 500;
            font-size: 18px;
        }
        .stats .label {
            color: #6f7f9c;
            font-size: 13px;
        }
        .footer-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .file-input-wrap {
            position: relative;
            display: inline-block;
        }
        .file-input-wrap input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .container { padding: 16px; }
            .toolbar button { font-size: 13px; padding: 6px 14px; }
            .stats { gap: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        🖱️ 鼠标轨迹记录器
        <small>· 数字行为日记</small>
    </h1>
    <div class="sub">
        ⏺ 实时记录鼠标移动轨迹 · 点击位置 · 支持回放与导出
    </div>

    <div class="toolbar">
        <button id="btnClear" class="danger">🗑️ 清空轨迹</button>
        <button id="btnPlay">▶️ 回放轨迹</button>
        <button id="btnStop" style="display:none;">⏹️ 停止回放</button>
        <button id="btnExport" class="primary">💾 导出 JSON</button>
        <div class="file-input-wrap">
            <button class="primary">📂 导入 JSON</button>
            <input type="file" id="fileInput" accept=".json" />
        </div>
        <span class="status-badge">
            <span class="dot"></span> 记录中
        </span>
    </div>

    <div class="canvas-wrapper">
        <canvas id="canvas" width="1600" height="900"></canvas>
    </div>

    <div class="stats">
        <span><span class="label">📍 轨迹点</span> <strong id="pointCount">0</strong></span>
        <span><span class="label">🖱️ 点击次数</span> <strong id="clickCount">0</strong></span>
        <span><span class="label">⏱️ 记录时长</span> <strong id="duration">0s</strong></span>
        <span style="margin-left:auto; color:#6f7f9c;" id="lastPos">鼠标位置: — , —</span>
    </div>

    <div class="footer-actions">
        <span style="font-size:13px; color:#4f5f7a;">💡 鼠标在画布上移动即可记录 · 点击画布记录点击位置</span>
    </div>
</div>

<script>
    (function() {
        // ----- DOM refs -----
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const pointCountEl = document.getElementById('pointCount');
        const clickCountEl = document.getElementById('clickCount');
        const durationEl = document.getElementById('duration');
        const lastPosEl = document.getElementById('lastPos');

        const btnClear = document.getElementById('btnClear');
        const btnPlay = document.getElementById('btnPlay');
        const btnStop = document.getElementById('btnStop');
        const btnExport = document.getElementById('btnExport');
        const fileInput = document.getElementById('fileInput');

        // ----- state -----
        const points = [];           // [{x, y, t, isClick?}]
        let clicks = [];            // [{x, y}]
        let isRecording = true;
        let startTime = Date.now();
        let animFrameId = null;
        let playInterval = null;
        let isPlaying = false;
        let playIndex = 0;

        // canvas logical size 1600x900
        const W = 1600, H = 900;

        // ----- helpers -----
        function formatDuration(ms) {
            if (ms < 1000) return ms + 'ms';
            const s = Math.floor(ms / 1000);
            if (s < 60) return s + 's';
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return m + 'm ' + sec + 's';
        }

        function updateStats() {
            pointCountEl.textContent = points.length;
            clickCountEl.textContent = clicks.length;
            const elapsed = Date.now() - startTime;
            durationEl.textContent = formatDuration(elapsed);
        }

        // ----- drawing -----
        function draw(highlightIndex = -1) {
            ctx.clearRect(0, 0, W, H);

            // grid (subtle)
            ctx.strokeStyle = '#1c2636';
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= W; x += 80) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, H);
                ctx.stroke();
            }
            for (let y = 0; y <= H; y += 80) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }

            // draw trails (lines)
            if (points.length > 1) {
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    // skip if gap too large (user moved out and back)
                    const dx = p2.x - p1.x, dy = p2.y - p1.y;
                    if (Math.sqrt(dx*dx + dy*dy) > 200) continue;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = (i === highlightIndex || i+1 === highlightIndex) 
                        ? '#facc15' 
                        : '#3b82f6';
                    ctx.lineWidth = (i === highlightIndex || i+1 === highlightIndex) ? 4 : 2.5;
                    ctx.globalAlpha = 0.8;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }

            // draw points (dots)
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                const radius = (i === highlightIndex) ? 7 : 3.5;
                ctx.beginPath();
                ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
                ctx.fillStyle = (i === highlightIndex) ? '#facc15' : '#60a5fa';
                ctx.globalAlpha = (i === highlightIndex) ? 1 : 0.5;
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // draw clicks (red markers)
            for (const c of clicks) {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 16;
                ctx.fill();
                ctx.shadowBlur = 0;
                // inner white dot
                ctx.beginPath();
                ctx.arc(c.x, c.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }

            // show last position
            if (points.length > 0) {
                const last = points[points.length - 1];
                ctx.font = '13px monospace';
                ctx.fillStyle = '#8896b0';
                ctx.fillText(`最后: ${Math.round(last.x)}, ${Math.round(last.y)}`, 20, 30);
            }
        }

        // ----- add point -----
        function addPoint(x, y, isClick = false) {
            if (!isRecording) return;
            // clamp
            const cx = Math.min(W, Math.max(0, x));
            const cy = Math.min(H, Math.max(0, y));
            points.push({ x: cx, y: cy, t: Date.now() });
            if (isClick) {
                clicks.push({ x: cx, y: cy });
            }
            updateStats();
            draw();
        }

        // ----- clear -----
        function clearAll() {
            if (isPlaying) stopPlayback();
            points.length = 0;
            clicks.length = 0;
            startTime = Date.now();
            updateStats();
            draw();
        }

        // ----- playback -----
        function startPlayback() {
            if (points.length < 2) {
                alert('轨迹点太少，至少需要 2 个点才能回放。');
                return;
            }
            if (isPlaying) return;
            isPlaying = true;
            playIndex = 0;
            btnPlay.style.display = 'none';
            btnStop.style.display = 'inline-block';
            isRecording = false;  // pause recording during playback

            let lastTime = performance.now();
            let step = 0;

            function stepForward() {
                if (!isPlaying || playIndex >= points.length) {
                    stopPlayback();
                    return;
                }
                // draw up to current index
                const highlight = playIndex;
                draw(highlight);
                // show progress
                const progress = Math.round((playIndex / points.length) * 100);
                lastPosEl.textContent = `回放 ${progress}%  (${playIndex}/${points.length})`;

                playIndex++;
                // dynamic speed: faster if many points
                const delay = points.length > 500 ? 6 : 12;
                playInterval = setTimeout(stepForward, delay);
            }

            stepForward();
        }

        function stopPlayback() {
            isPlaying = false;
            if (playInterval) {
                clearTimeout(playInterval);
                playInterval = null;
            }
            btnPlay.style.display = 'inline-block';
            btnStop.style.display = 'none';
            isRecording = true;
            lastPosEl.textContent = '回放已停止';
            draw();  // full draw
            updateStats();
        }

        // ----- export / import -----
        function exportData() {
            const data = {
                version: '1.0',
                exportedAt: new Date().toISOString(),
                points: points,
                clicks: clicks,
                startTime: startTime,
                totalPoints: points.length,
                totalClicks: clicks.length
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mouse-trail-${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.points || !Array.isArray(data.points)) {
                        alert('无效的数据文件：缺少 points 数组');
                        return;
                    }
                    if (isPlaying) stopPlayback();
                    points.length = 0;
                    clicks.length = 0;
                    // restore
                    for (const p of data.points) {
                        if (p.x !== undefined && p.y !== undefined) {
                            points.push({ x: p.x, y: p.y, t: p.t || Date.now() });
                        }
                    }
                    if (data.clicks && Array.isArray(data.clicks)) {
                        for (const c of data.clicks) {
                            if (c.x !== undefined && c.y !== undefined) {
                                clicks.push({ x: c.x, y: c.y });
                            }
                        }
                    }
                    startTime = data.startTime || Date.now();
                    updateStats();
                    draw();
                    lastPosEl.textContent = `✅ 导入成功 (${points.length} 点, ${clicks.length} 次点击)`;
                } catch (err) {
                    alert('导入失败: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // ----- canvas events -----
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            return { x, y };
        }

        function onMove(e) {
            const { x, y } = getCanvasCoords(e);
            lastPosEl.textContent = `鼠标位置: ${Math.round(x)} , ${Math.round(y)}`;
            if (isRecording && !isPlaying) {
                addPoint(x, y, false);
            }
        }

        function onCanvasClick(e) {
            if (isPlaying) return;
            const { x, y } = getCanvasCoords(e);
            addPoint(x, y, true);
            // haptic feedback
            lastPosEl.textContent = `🖱️ 点击 at ${Math.round(x)}, ${Math.round(y)}`;
        }

        // ----- init -----
        function init() {
            draw();
            updateStats();

            // mouse & touch
            canvas.addEventListener('mousemove', onMove);
            canvas.addEventListener('click', onCanvasClick);
            canvas.addEventListener('touchmove', onMove, { passive: false });
            canvas.addEventListener('touchstart', (e) => {
                // treat as move + click on touch
                const { x, y } = getCanvasCoords(e);
                addPoint(x, y, true);
                lastPosEl.textContent = `🖱️ 点击 at ${Math.round(x)}, ${Math.round(y)}`;
                e.preventDefault();
            }, { passive: false });

            // buttons
            btnClear.addEventListener('click', () => {
                if (points.length === 0) return;
                if (confirm('清空所有轨迹数据？')) clearAll();
            });

            btnPlay.addEventListener('click', startPlayback);
            btnStop.addEventListener('click', stopPlayback);

            btnExport.addEventListener('click', exportData);

            fileInput.addEventListener('change', (e) => {
                if (fileInput.files && fileInput.files.length > 0) {
                    importData(fileInput.files[0]);
                    fileInput.value = '';
                }
            });

            // auto update stats every 2s
            setInterval(() => {
                if (!isPlaying) updateStats();
            }, 2000);

            // if user leaves page, stop playback
            window.addEventListener('beforeunload', () => {
                if (isPlaying) stopPlayback();
            });
        }

        init();
    })();
</script>
</body>
</html>
