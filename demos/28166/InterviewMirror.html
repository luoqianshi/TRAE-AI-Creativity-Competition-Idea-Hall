<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Mirror - AI 面试复盘教练</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --primary: #1a2a4a;
    --primary-light: #243b66;
    --accent: #f0b429;
    --accent-light: #f5c95c;
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1a2a4a;
    --text-secondary: #5a6a8a;
    --border: #e2e8f0;
    --danger: #e74c3c;
    --success: #27ae60;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  header {
    text-align: center;
    padding: 32px 0 24px;
  }

  header h1 {
    font-size: 2rem;
    color: var(--primary);
    letter-spacing: 1px;
    font-weight: 700;
  }

  header p {
    color: var(--text-secondary);
    margin-top: 6px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(26,42,74,0.08);
    padding: 24px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title .icon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    color: var(--primary);
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 700;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .form-group label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }

  input, select, textarea {
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 0.95rem;
    color: var(--text);
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(240,180,41,0.15);
  }

  textarea { resize: vertical; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    font-family: inherit;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-light);
    box-shadow: 0 4px 12px rgba(26,42,74,0.25);
  }

  .btn-accent {
    background: var(--accent);
    color: var(--primary);
  }

  .btn-accent:hover {
    background: var(--accent-light);
    box-shadow: 0 4px 12px rgba(240,180,41,0.35);
  }

  .btn-danger {
    background: var(--danger);
    color: #fff;
  }

  .btn-danger:hover {
    background: #c0392b;
  }

  .btn-sm { padding: 7px 12px; font-size: 0.85rem; }

  .qa-item {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    background: #fafbfe;
    position: relative;
  }

  .qa-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .qa-num {
    font-weight: 700;
    color: var(--accent);
    font-size: 0.9rem;
  }

  .qa-actions { display: flex; gap: 8px; }

  .scores {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin: 12px 0;
  }

  .score-box {
    background: #fff;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    border: 1.5px solid var(--border);
  }

  .score-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .score-value {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--primary);
  }

  .advice-box {
    background: #fff9e6;
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 10px;
    font-size: 0.9rem;
    color: var(--text);
  }

  .advice-box ul { margin: 6px 0 0 18px; }
  .advice-box li { margin-bottom: 4px; }

  .chart-wrap {
    position: relative;
    height: 320px;
    margin-top: 10px;
  }

  .chart-wrap.line { height: 260px; }

  .empty-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 30px 0;
    font-size: 0.9rem;
  }

  .footer-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 10px;
  }

  @media (max-width: 640px) {
    .scores { grid-template-columns: repeat(2, 1fr); }
    header h1 { font-size: 1.5rem; }
    .chart-wrap { height: 260px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Interview Mirror</h1>
    <p>AI 面试复盘教练 —— 让每一次面试都成为成长的阶梯</p>
  </header>

  <!-- 1. 顶部信息区 -->
  <section class="card">
    <div class="card-title"><span class="icon">1</span>面试信息</div>
    <div class="form-grid">
      <div class="form-group">
        <label>公司名称</label>
        <input type="text" id="company" placeholder="例如：字节跳动">
      </div>
      <div class="form-group">
        <label>应聘职位</label>
        <input type="text" id="position" placeholder="例如：高级产品经理">
      </div>
      <div class="form-group">
        <label>面试日期</label>
        <input type="date" id="interviewDate">
      </div>
      <div class="form-group">
        <label>面试轮次</label>
        <select id="round">
          <option value="初面">初面</option>
          <option value="二面">二面</option>
          <option value="终面">终面</option>
          <option value="HR面">HR面</option>
        </select>
      </div>
    </div>
    <div style="margin-top:16px;">
      <button class="btn btn-primary" onclick="saveInterviewInfo()">保存面试信息</button>
      <span id="infoSaved" style="margin-left:12px;color:var(--success);font-size:0.9rem;display:none;">已保存</span>
    </div>
  </section>

  <!-- 2. 问题复盘区 -->
  <section class="card">
    <div class="card-title"><span class="icon">2</span>问题复盘</div>
    <div id="qaList"></div>
    <button class="btn btn-accent" onclick="addQA()">+ 添加面试问题</button>
  </section>

  <!-- 3. 弱项雷达图 -->
  <section class="card">
    <div class="card-title"><span class="icon">3</span>本次面试能力雷达图</div>
    <div class="chart-wrap">
      <canvas id="radarChart"></canvas>
    </div>
    <div id="radarEmpty" class="empty-state" style="display:none;">暂无评分数据，请先添加并分析问题</div>
  </section>

  <!-- 4. 历史趋势折线图 -->
  <section class="card">
    <div class="card-title"><span class="icon">4</span>面试成长趋势</div>
    <div class="chart-wrap line">
      <canvas id="lineChart"></canvas>
    </div>
    <div id="lineEmpty" class="empty-state" style="display:none;">暂无历史记录，保存面试信息后将自动生成趋势</div>
  </section>

  <!-- 5. 底部操作区 -->
  <section class="card" style="text-align:center;">
    <div class="card-title" style="justify-content:center;"><span class="icon">5</span>操作</div>
    <div class="footer-actions">
      <button class="btn btn-danger" onclick="clearCurrent()">清空本次记录</button>
      <button class="btn btn-primary" onclick="window.print()">打印 / 导出 (Ctrl+P)</button>
    </div>
    <p style="margin-top:14px;color:var(--text-secondary);font-size:0.85rem;">提示：所有数据保存在浏览器本地，不会上传至服务器</p>
  </section>
</div>

<script>
/* ================= 数据存储 ================= */
const STORAGE_KEY = 'interview_mirror_data';
const HISTORY_KEY = 'interview_mirror_history';

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { return []; }
}
function saveHistory(history) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

let appData = loadData();
let qaItems = appData.qa || [];

/* ================= 顶部信息区 ================= */
function initInfo() {
  document.getElementById('company').value = appData.company || '';
  document.getElementById('position').value = appData.position || '';
  document.getElementById('interviewDate').value = appData.date || '';
  document.getElementById('round').value = appData.round || '初面';
}
function saveInterviewInfo() {
  appData.company = document.getElementById('company').value.trim();
  appData.position = document.getElementById('position').value.trim();
  appData.date = document.getElementById('interviewDate').value;
  appData.round = document.getElementById('round').value;
  saveData(appData);
  // 保存到历史
  const history = loadHistory();
  const existing = history.findIndex(h => h.date === appData.date && h.company === appData.company && h.round === appData.round);
  const avg = computeAverageScore();
  const record = {
    date: appData.date || new Date().toISOString().slice(0,10),
    company: appData.company || '未命名',
    position: appData.position || '',
    round: appData.round,
    score: avg
  };
  if (existing >= 0) history[existing] = record; else history.push(record);
  saveHistory(history);
  const badge = document.getElementById('infoSaved');
  badge.style.display = 'inline';
  setTimeout(() => badge.style.display = 'none', 2000);
  renderLineChart();
}

/* ================= 问题复盘区 ================= */
function renderQA() {
  const container = document.getElementById('qaList');
  if (qaItems.length === 0) {
    container.innerHTML = '<div class="empty-state">点击上方按钮添加第一条面试问题</div>';
    return;
  }
  container.innerHTML = qaItems.map((item, idx) => `
    <div class="qa-item" data-index="${idx}">
      <div class="qa-header">
        <span class="qa-num">问题 ${idx + 1}</span>
        <div class="qa-actions">
          <button class="btn btn-sm btn-accent" onclick="analyzeQA(${idx})">分析</button>
          <button class="btn btn-sm btn-danger" onclick="deleteQA(${idx})">删除</button>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label>面试官问题</label>
        <input type="text" value="${escapeHtml(item.question || '')}" onchange="updateQA(${idx},'question',this.value)" placeholder="请输入面试官提出的问题">
      </div>
      <div class="form-group" style="margin-bottom:10px;">
        <label>我的回答</label>
        <textarea rows="5" onchange="updateQA(${idx},'answer',this.value)" placeholder="请回忆并输入你的回答内容">${escapeHtml(item.answer || '')}</textarea>
      </div>
      ${item.scores ? `
        <div class="scores">
          <div class="score-box"><div class="score-label">情境 S</div><div class="score-value">${item.scores.s}</div></div>
          <div class="score-box"><div class="score-label">任务 T</div><div class="score-value">${item.scores.t}</div></div>
          <div class="score-box"><div class="score-label">行动 A</div><div class="score-value">${item.scores.a}</div></div>
          <div class="score-box"><div class="score-label">结果 R</div><div class="score-value">${item.scores.r}</div></div>
        </div>
        <div class="advice-box">
          <strong>AI 改进建议：</strong>
          <ul>${item.advice.map(a => `<li>${a}</li>`).join('')}</ul>
        </div>
      ` : ''}
    </div>
  `).join('');
}

function addQA() {
  qaItems.push({ question: '', answer: '', scores: null, advice: [] });
  saveQA();
  renderQA();
}
function deleteQA(idx) {
  if (!confirm('确定删除这条记录吗？')) return;
  qaItems.splice(idx, 1);
  saveQA();
  renderQA();
  renderRadarChart();
}
function updateQA(idx, field, value) {
  qaItems[idx][field] = value;
  saveQA();
}
function saveQA() {
  appData.qa = qaItems;
  saveData(appData);
}

/* ================= AI 分析（纯前端规则） ================= */
function analyzeQA(idx) {
  const item = qaItems[idx];
  const q = (item.question || '').trim();
  const a = (item.answer || '').trim();
  if (!q || !a) { alert('请先填写问题和回答内容'); return; }

  const len = a.length;
  const lower = a.toLowerCase();

  // 关键词库
  const sKeywords = ['背景','当时','情境','环境','公司','团队','项目','负责','部门','业务','市场','行业','情况','场景'];
  const tKeywords = ['目标','任务','职责','负责','需要','要求','KPI','指标','使命','目的','预期','计划'];
  const aKeywords = ['首先','然后','接着','同时','通过','使用','采用','实施','执行','协调','沟通','推动','组织','带领','解决','分析','设计','开发','优化','迭代'];
  const rKeywords = ['结果','达成','完成','实现','提升','增长','降低','节省','获得','好评','认可','奖励','数据','百分比','%','倍','从','到','最终'];

  const count = (arr) => arr.reduce((sum, kw) => sum + (lower.includes(kw) ? 1 : 0), 0);

  let s = Math.min(10, Math.round(3 + count(sKeywords) * 1.2 + Math.min(len, 200) / 40));
  let t = Math.min(10, Math.round(3 + count(tKeywords) * 1.5 + Math.min(len, 200) / 50));
  let a = Math.min(10, Math.round(3 + count(aKeywords) * 0.9 + Math.min(len, 300) / 60));
  let r = Math.min(10, Math.round(3 + count(rKeywords) * 1.1 + (a.match(/\d+/) ? 2 : 0)));

  // 长度惩罚/奖励
  if (len < 30) { s = Math.max(1, s - 2); t = Math.max(1, t - 2); a = Math.max(1, a - 2); r = Math.max(1, r - 2); }
  else if (len > 150) { a = Math.min(10, a + 1); r = Math.min(10, r + 1); }

  item.scores = { s, t, a, r };

  const advice = [];
  if (s <= 5) advice.push('建议补充具体背景场景，让面试官快速理解上下文');
  if (t <= 5) advice.push('明确阐述你的任务目标和职责边界，突出挑战度');
  if (a <= 5) advice.push('细化行动步骤，多用动词体现你的主动性和方法论');
  if (r <= 5) advice.push('强化结果量化，用数据或事实佐证产出价值');
  if (advice.length === 0) advice.push('回答结构完整，继续保持！可进一步挖掘独特亮点。');
  item.advice = advice;

  saveQA();
  renderQA();
  renderRadarChart();
}

function computeAverageScore() {
  if (qaItems.length === 0) return 0;
  const valid = qaItems.filter(i => i.scores);
  if (valid.length === 0) return 0;
  const sum = valid.reduce((acc, i) => acc + (i.scores.s + i.scores.t + i.scores.a + i.scores.r) / 4, 0);
  return Math.round((sum / valid.length) * 10) / 10;
}

/* ================= 图表 ================= */
let radarChartInst = null;
let lineChartInst = null;

function renderRadarChart() {
  const ctx = document.getElementById('radarChart').getContext('2d');
  const valid = qaItems.filter(i => i.scores);
  const empty = document.getElementById('radarEmpty');
  const canvas = document.getElementById('radarChart');

  if (valid.length === 0) {
    if (radarChartInst) { radarChartInst.destroy(); radarChartInst = null; }
    canvas.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  canvas.style.display = 'block';
  empty.style.display = 'none';

  const avg = (dim) => valid.reduce((sum, i) => sum + i.scores[dim], 0) / valid.length;
  const data = [avg('s'), avg('t'), avg('a'), avg('r')];

  if (radarChartInst) radarChartInst.destroy();
  radarChartInst = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['情境 S', '任务 T', '行动 A', '结果 R'],
      datasets: [{
        label: '平均得分',
        data: data,
        backgroundColor: 'rgba(240,180,41,0.25)',
        borderColor: '#f0b429',
        pointBackgroundColor: '#f0b429',
        pointBorderColor: '#1a2a4a',
        pointRadius: 5,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0, max: 10,
          ticks: { stepSize: 2, color: '#5a6a8a', backdropColor: 'transparent' },
          grid: { color: '#e2e8f0' },
          angleLines: { color: '#e2e8f0' },
          pointLabels: { color: '#1a2a4a', font: { size: 13, weight: '600' } }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}

function renderLineChart() {
  const ctx = document.getElementById('lineChart').getContext('2d');
  const history = loadHistory().sort((a, b) => new Date(a.date) - new Date(b.date));
  const empty = document.getElementById('lineEmpty');
  const canvas = document.getElementById('lineChart');

  if (history.length === 0) {
    if (lineChartInst) { lineChartInst.destroy(); lineChartInst = null; }
    canvas.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  canvas.style.display = 'block';
  empty.style.display = 'none';

  const labels = history.map(h => h.date.slice(5));
  const data = history.map(h => h.score);

  if (lineChartInst) lineChartInst.destroy();
  lineChartInst = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: '综合平均分',
        data: data,
        borderColor: '#1a2a4a',
        backgroundColor: 'rgba(26,42,74,0.08)',
        fill: true,
        tension: 0.3,
        pointBackgroundColor: '#f0b429',
        pointBorderColor: '#1a2a4a',
        pointRadius: 5,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { min: 0, max: 10, ticks: { stepSize: 2, color: '#5a6a8a' }, grid: { color: '#e2e8f0' } },
        x: { ticks: { color: '#5a6a8a' }, grid: { display: false } }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => `综合得分: ${ctx.raw} 分`
          }
        }
      }
    }
  });
}

/* ================= 工具函数 ================= */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function clearCurrent() {
  if (!confirm('确定清空本次面试的所有记录吗？此操作不可恢复。')) return;
  appData = { qa: [] };
  qaItems = [];
  saveData(appData);
  initInfo();
  renderQA();
  renderRadarChart();
}

/* ================= 初始化 ================= */
window.addEventListener('DOMContentLoaded', () => {
  initInfo();
  renderQA();
  renderRadarChart();
  renderLineChart();
});
</script>
</body>
</html>
