<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI预约入园助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="header-icon">🌳</div>
            <h1>AI预约入园</h1>
            <p class="subtitle">智能填写，一键预约</p>
        </header>

        <!-- AI输入区域 -->
        <section class="ai-section">
            <div class="ai-card">
                <div class="ai-header">
                    <span class="ai-badge">AI助手</span>
                    <span class="ai-status">在线</span>
                </div>
                <div class="input-area">
                    <textarea 
                        id="aiInput" 
                        placeholder="例如：我叫张三，手机号13800138000，身份证号110101199001011234，明天上午9点带2个人去科技园区参观"
                        rows="3"
                    ></textarea>
                    <button class="voice-btn" id="voiceBtn" title="语音输入">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                    </button>
                </div>
                <button class="parse-btn" id="parseBtn">
                    <span class="btn-icon">✨</span>
                    智能解析填写
                </button>
                <div class="quick-hints">
                    <span class="hint-label">快捷语句：</span>
                    <span class="hint-tag" data-text="预约明天下午3点，李四，13900139000，带1个人">明天下午3点</span>
                    <span class="hint-tag" data-text="王五预约下周一上午，手机号13700137000，3个人">下周一上午</span>
                    <span class="hint-tag" data-text="帮我预约今天，赵六，13600136000，一个人">今天预约</span>
                </div>
            </div>
        </section>

        <!-- 历史记录 -->
        <section class="history-section" id="historySection">
            <div class="section-title">
                <span>📋 常用信息</span>
                <button class="clear-btn" id="clearHistory">清空</button>
            </div>
            <div class="history-list" id="historyList">
                <!-- 动态生成 -->
            </div>
        </section>

        <!-- 预约表单 -->
        <section class="form-section">
            <div class="section-title">
                <span>📝 预约信息</span>
                <span class="required-hint">* 必填</span>
            </div>
            
            <form id="bookingForm">
                <div class="form-group">
                    <label class="form-label">预约人姓名 <span class="required">*</span></label>
                    <input type="text" id="name" class="form-input" placeholder="请输入姓名">
                    <span class="input-icon">👤</span>
                </div>

                <div class="form-group">
                    <label class="form-label">手机号码 <span class="required">*</span></label>
                    <input type="tel" id="phone" class="form-input" placeholder="请输入手机号" maxlength="11">
                    <span class="input-icon">📱</span>
                </div>

                <div class="form-group">
                    <label class="form-label">身份证号</label>
                    <input type="text" id="idCard" class="form-input" placeholder="请输入身份证号" maxlength="18">
                    <span class="input-icon">🆔</span>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label class="form-label">预约日期 <span class="required">*</span></label>
                        <input type="date" id="date" class="form-input">
                    </div>
                    <div class="form-group half">
                        <label class="form-label">预约时间 <span class="required">*</span></label>
                        <select id="time" class="form-input">
                            <option value="">选择时间</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">入园人数 <span class="required">*</span></label>
                    <div class="number-picker">
                        <button type="button" class="num-btn minus" id="minusBtn">-</button>
                        <input type="number" id="peopleCount" class="num-input" value="1" min="1" max="50" readonly>
                        <button type="button" class="num-btn plus" id="plusBtn">+</button>
                        <span class="people-unit">人</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">预约园区 <span class="required">*</span></label>
                    <select id="park" class="form-input">
                        <option value="">选择园区</option>
                        <option value="tech">科技园区</option>
                        <option value="culture">文化创意园</option>
                        <option value="eco">生态公园</option>
                        <option value="industry">工业园区</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">来访事由</label>
                    <textarea id="reason" class="form-textarea" rows="2" placeholder="请输入来访事由（选填）"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">车牌号（自驾请填）</label>
                    <input type="text" id="carPlate" class="form-input" placeholder="如：京A12345">
                    <span class="input-icon">🚗</span>
                </div>
            </form>
        </section>

        <!-- 提交按钮 -->
        <div class="submit-area">
            <button class="submit-btn" id="submitBtn">
                <span class="btn-icon">✓</span>
                确认预约
            </button>
            <p class="submit-hint">点击确认即表示同意《入园预约协议》</p>
        </div>

        <!-- 成功弹窗 -->
        <div class="modal" id="successModal">
            <div class="modal-content">
                <div class="success-icon">✓</div>
                <h2>预约成功</h2>
                <p class="success-text">您的预约已提交，请留意短信通知</p>
                <div class="booking-info" id="bookingInfo">
                    <!-- 动态生成 -->
                </div>
                <button class="modal-btn" id="modalBtn">我知道了</button>
            </div>
        </div>

        <!-- 加载动画 -->
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>AI正在解析...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
