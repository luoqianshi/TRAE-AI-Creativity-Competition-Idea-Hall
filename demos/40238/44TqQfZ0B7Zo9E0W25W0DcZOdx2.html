<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惠觅 - 实惠生活探索平台</title>
    <style>
        :root {
            --primary-color: #FF9900; /* 充满活力的橙色，代表实惠与烟火气 */
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: #333; padding-bottom: 80px; }
        
        /* 顶部导航 */
        header {
            background: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header h1 { font-size: 20px; font-weight: bold; }
        .wallet { background: rgba(255,255,255,0.3); padding: 5px 10px; border-radius: 15px; font-size: 14px; cursor: pointer;}

        /* 卡片样式 */
        .container { padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.98); }
        .card-img {
            width: 100px; height: 100px;
            background: #eee; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 30px;
        }
        .card-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .card-desc { font-size: 12px; color: #666; line-height: 1.4; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
        .price-tag { color: #e63946; font-weight: bold; font-size: 14px; }

        /* 按钮样式 */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-claim { background: var(--primary-color); }
        .btn-unlock { background: #4CAF50; }
        .btn-locked { background: #ccc; color: #666; cursor: not-allowed; }

        /* 底部弹窗提示 */
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 20px; font-size: 14px; display: none; z-index: 20;
        }
    </style>
</head>
<body>

<header>
    <h1>📍 惠觅</h1>
    <div class="wallet" id="walletDisplay">💰 余额: ¥10.00</div>
</header>

<div class="container" id="cardContainer">
    <!-- 卡片由 JS 动态生成 -->
</div>

<div class="toast" id="toastMsg">操作成功！</div>

<script>
    // 模拟数据
    const spots = [
        { 
            id: 1, 
            title: '老李手工煎饼', 
            desc: '藏在巷子里的绝味煎饼，加两个蛋只要6块钱！', 
            icon: '🥞', 
            cost: 0.5, 
            unlocked: false 
        },
        { 
            id: 2, 
            title: '大学城夜市免费停车点', 
            desc: '晚上8点后开放的隐蔽空地，保安不管，适合摆摊。', 
            icon: '🅿️', 
            cost: 1.0, 
            unlocked: false 
        },
        { 
            id: 3, 
            title: '尾货服装清仓摊', 
            desc: '纯棉T恤10元3件，每天下午5点准时出摊。', 
            icon: '👕', 
            cost: 0.5, 
            unlocked: true // 模拟已解锁状态
        }
    ];

    let balance = 10.00;

    // 渲染卡片
    function renderCards() {
        const container = document.getElementById('cardContainer');
        container.innerHTML = '';
        
        spots.forEach(spot => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // 根据解锁状态决定按钮样式和文字
            let btnHtml = '';
            if (spot.unlocked) {
                btnHtml = `<button class="btn btn-unlock" onclick="showToast('已获取完整地址与联系方式')">查看位置</button>`;
            } else {
                btnHtml = `<button class="btn btn-claim" onclick="claimSpot(${spot.id})">💰 支付 ¥${spot.cost} 认领</button>`;
            }

            card.innerHTML = `
                <div class="card-img">${spot.icon}</div>
                <div class="card-info">
                    <div>
                        <div class="card-title">${spot.title}</div>
                        <div class="card-desc">${spot.unlocked ? spot.desc : '该信息已被保护，支付微量费用即可解锁完整位置与摊主联系方式。'}</div>
                    </div>
                    <div class="card-meta">
                        <span class="price-tag">发现者收益: ¥${(spot.cost * 0.8).toFixed(1)}</span>
                        ${btnHtml}
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 认领/解锁逻辑
    function claimSpot(id) {
        const spot = spots.find(s => s.id === id);
        if (balance >= spot.cost) {
            balance -= spot.cost;
            spot.unlocked = true;
            updateWallet();
            renderCards();
            showToast(`认领成功！已扣除 ¥${spot.cost}`);
        } else {
            showToast('余额不足，请先充值');
        }
    }

    // 更新钱包显示
    function updateWallet() {
        document.getElementById('walletDisplay').innerText = `💰 余额: ¥${balance.toFixed(2)}`;
    }

    // 提示框
    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    // 初始化
    renderCards();
</script>
</body>
</html>
