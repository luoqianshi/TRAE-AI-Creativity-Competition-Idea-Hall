<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContextSpeak - 语境口语陪练</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin:0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:#333; }
        .container { max-width: 400px; margin: 40px auto; background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        header { background: #07c160; color: white; padding: 20px; text-align: center; }
        .scene { padding: 15px; background: #f8f8f8; text-align: center; font-size: 15px; }
        .chat { height: 420px; overflow-y: auto; padding: 20px; background: #f0f0f0; }
        .msg { margin: 12px 0; max-width: 80%; padding: 12px 16px; border-radius: 18px; }
        .user { background: #07c160; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .ai { background: white; border: 1px solid #ddd; border-bottom-left-radius: 4px; }
        .input-area { padding: 15px; background: white; border-top: 1px solid #eee; }
        button { background: #07c160; color: white; border: none; padding: 14px 24px; border-radius: 50px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; }
        .mic { font-size: 28px; }
        .info { font-size: 13px; color: #666; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 ContextSpeak</h1>
            <p>当前场景：<strong>地铁站排队买咖啡</strong></p>
        </header>
        
        <div class="scene">
            <strong>场景：</strong> 你在地铁站附近，想用英语点一杯拿铁<br>
            <small>AI 已根据你的位置和时间生成练习场景</small>
        </div>
        
        <div class="chat" id="chat">
            <div class="msg ai">
                <strong>Barista：</strong> Hi! What can I get for you today?
            </div>
        </div>
        
        <div class="input-area">
            <button onclick="simulateSpeak()">🎤 点击开始语音练习（模拟）</button>
            <div class="info">支持实时语音识别 + 发音评分 + 语法纠正</div>
        </div>
        
        <div class="input-area" style="background:#f8f8f8;">
            <h3 style="margin:8px 0 12px 0; text-align:center;">今日练习记录</h3>
            <p style="text-align:center; color:#07c160; font-size:18px;"><strong>已练习 7 天</strong> | 掌握度 82%</p>
            <button onclick="nextScene()" style="background:#ff9800;">切换新场景练习 →</button>
        </div>
    </div>

    <script>
        function simulateSpeak() {
            const chat = document.getElementById('chat');
            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.innerHTML = `<strong>你：</strong> I'd like a large iced latte, please.`;
            chat.appendChild(userMsg);
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'msg ai';
                aiMsg.innerHTML = `<strong>Barista：</strong> Sure! Anything else?<br><span style="color:#07c160; font-size:13px;">发音评分：92分 | 建议：发音自然，可尝试更流利的表达</span>`;
                chat.appendChild(aiMsg);
                chat.scrollTop = chat.scrollHeight;
            }, 800);
        }

        function nextScene() {
            alert('✅ 已切换新场景：机场安检处用英语沟通（Demo效果）\n\n真实小程序中会根据位置自动切换！');
        }
        
        // 自动欢迎消息
        setTimeout(() => {
            const welcome = document.createElement('div');
            welcome.className = 'msg ai';
            welcome.innerHTML = `<strong>AI陪练：</strong> 你好！当前你在地铁附近，我为你生成了“点咖啡”场景。准备好练习了吗？`;
            document.getElementById('chat').appendChild(welcome);
        }, 600);
    </script>
</body>
</html>
