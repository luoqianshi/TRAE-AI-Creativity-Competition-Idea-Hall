<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能会议助手 Demo</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f7fa;
            color: #333;
        }
        header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .demo-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background: #5a6fd8;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 5px solid #667eea;
            display: none;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🤖 AI 智能会议助手</h1>
        <p>快速整理会议纪要 · 自动提取待办事项</p>
    </header>

    <div class="demo-container">
        <h2>输入会议内容（模拟）</h2>
        <textarea id="input" placeholder="例如：今天讨论了Q3销售目标，团队决定增加市场预算20万，小李负责跟进客户A..."></textarea>
        
        <button onclick="processMeeting()">生成纪要 & 待办</button>

        <div id="result" class="result">
            <h3>📋 会议纪要</h3>
            <div id="summary"></div>
            
            <h3 style="margin-top: 25px;">✅ 行动项 / 待办事项</h3>
            <ul id="todos"></ul>
        </div>
    </div>

    <div class="footer">
        <p>Demo by TRAE AI · 参赛作品（学习工作赛道）</p>
        <p>核心功能通过 TRAE IDE 快速生成</p>
    </div>

    <script>
        function processMeeting() {
            const input = document.getElementById('input').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!input) {
                alert('请输入会议内容！');
                return;
            }

            // 模拟AI处理
            document.getElementById('summary').innerHTML = `
                <p>会议主要讨论了Q3销售目标及相关预算调整。</p>
                <p>团队一致同意增加市场推广预算20万元，以提升品牌曝光。</p>
                <p>会议时长约45分钟，参与人员7人。</p>
            `;
            
            document.getElementById('todos').innerHTML = `
                <li>小李负责跟进客户A，7月5日前提交反馈报告</li>
                <li>市场部在7月10日前制定详细推广方案</li>
                <li>下周三召开复盘会议，评估预算使用效果</li>
            `;
            
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
