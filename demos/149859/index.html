<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funny Music - 情绪音乐推荐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            transition: background 0.8s ease;
            overflow-x: hidden;
            padding-bottom: 120px;
        }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; opacity: 0; }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .container { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 40px 20px 20px; }

        .header { text-align: center; margin-bottom: 44px; }
        .logo { font-size: 48px; margin-bottom: 8px; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .title {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, #e94560, #ff6b6b, #ffa502);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 8px; letter-spacing: 2px;
        }
        .subtitle { font-size: 16px; color: #8899aa; letter-spacing: 3px; }

        .input-section {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 36px 28px; margin-bottom: 36px; transition: all 0.4s ease;
        }
        .section-label { font-size: 14px; color: #8899aa; letter-spacing: 2px; margin-bottom: 18px; }

        .emoji-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 24px; }
        .emoji-btn {
            width: 64px; height: 64px; border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
            font-size: 30px; cursor: pointer; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .emoji-btn:hover {
            border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.1);
            transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .emoji-btn.active {
            border-color: #e94560; background: rgba(233,69,96,0.2);
            box-shadow: 0 0 28px rgba(233,69,96,0.35); transform: translateY(-3px);
        }
        .emoji-btn .label {
            position: absolute; bottom: -22px; font-size: 11px; color: #8899aa;
            white-space: nowrap; opacity: 0; transition: opacity 0.3s;
        }
        .emoji-btn:hover .label, .emoji-btn.active .label { opacity: 1; }

        .text-input-wrapper { display: flex; gap: 12px; }
        .text-input {
            flex: 1; padding: 14px 20px; border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
            color: #fff; font-size: 16px; outline: none; transition: all 0.3s ease; font-family: inherit;
        }
        .text-input::placeholder { color: #556677; }
        .text-input:focus { border-color: #e94560; box-shadow: 0 0 24px rgba(233,69,96,0.2); background: rgba(255,255,255,0.1); }
        .submit-btn {
            padding: 14px 28px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
            letter-spacing: 1px; transition: all 0.3s ease; white-space: nowrap;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(233,69,96,0.4); }
        .submit-btn:active { transform: scale(0.96); }

        .result-section { display: none; animation: fadeInUp 0.6s ease; }
        .result-section.show { display: block; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .mood-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 20px; border-radius: 50px;
            background: rgba(233,69,96,0.15); border: 1px solid rgba(233,69,96,0.3);
            font-size: 14px; margin-bottom: 28px;
        }

        .music-list { display: flex; flex-direction: column; gap: 14px; }
        .music-card {
            display: flex; align-items: center; gap: 16px;
            background: rgba(255,255,255,0.05); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
            padding: 16px 20px; cursor: pointer; transition: all 0.35s ease;
            position: relative; overflow: hidden;
        }
        .music-card::before {
            content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 0;
            background: linear-gradient(90deg, rgba(233,69,96,0.12), transparent);
            transition: width 0.4s ease;
        }
        .music-card:hover::before { width: 100%; }
        .music-card:hover { border-color: rgba(255,255,255,0.2); transform: translateX(6px); box-shadow: 0 6px 28px rgba(0,0,0,0.25); }
        .music-card.playing { border-color: #e94560; box-shadow: 0 0 24px rgba(233,69,96,0.25); }
        .music-card.loading { opacity: 0.6; pointer-events: none; }

        .music-card .cover {
            width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; position: relative; z-index: 1;
            background-size: cover; background-position: center;
        }
        .music-card .info { flex: 1; min-width: 0; z-index: 1; }
        .music-card .info .song-name { font-size: 16px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-card .info .song-desc { font-size: 13px; color: #8899aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-card .play-icon {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(255,255,255,0.1); display: flex;
            align-items: center; justify-content: center; font-size: 16px;
            flex-shrink: 0; z-index: 1; transition: all 0.3s;
        }
        .music-card:hover .play-icon { background: #e94560; color: #fff; }
        .music-card.playing .play-icon { background: #e94560; animation: pulse 1s ease-in-out infinite; }
        .music-card .spinner {
            width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #e94560; border-radius: 50%;
            animation: spin 0.7s linear infinite; display: none;
        }
        .music-card.loading .spinner { display: block; }
        .music-card.loading .play-icon span { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(233,69,96,0.5); }
            50% { box-shadow: 0 0 0 16px rgba(233,69,96,0); }
        }

        /* 底部播放器栏 */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(20,20,40,0.95); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 12px 24px; z-index: 50;
            display: none; align-items: center; gap: 16px;
            animation: slideUp 0.4s ease;
        }
        .player-bar.show { display: flex; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .player-bar .np-cover {
            width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0;
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center; font-size: 22px;
        }
        .player-bar .np-info { flex: 1; min-width: 0; }
        .player-bar .np-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-bar .np-artist { font-size: 12px; color: #8899aa; }
        .player-bar .np-controls { display: flex; align-items: center; gap: 10px; }
        .player-bar button {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); color: #fff; font-size: 16px;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .player-bar button:hover { background: #e94560; }
        .player-bar .btn-special { position: relative; }
        .player-bar .btn-special.listening {
            background: #e94560;
            animation: micPulse 0.7s ease-in-out infinite;
        }
        .player-bar .btn-special.camera-active {
            background: #00b894;
            animation: camPulse 1.5s ease-in-out infinite;
        }
        @keyframes micPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(233,69,96,0.6); }
            50% { box-shadow: 0 0 0 12px rgba(233,69,96,0); }
        }
        @keyframes camPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(0,184,148,0.6); }
            50% { box-shadow: 0 0 0 12px rgba(0,184,148,0); }
        }
        .player-bar .progress-wrap {
            width: 100px; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; cursor: pointer; position: relative;
        }
        .player-bar .progress-fill { height: 100%; background: #e94560; border-radius: 2px; width: 0%; transition: width 0.1s linear; }

        .volume-wrap { display: flex; align-items: center; gap: 6px; }
        .volume-slider {
            -webkit-appearance: none; width: 60px; height: 4px;
            background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: #e94560; cursor: pointer;
        }

        /* 语音浮层 */
        .voice-overlay {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,50,0.95); backdrop-filter: blur(16px);
            border: 1px solid rgba(233,69,96,0.4); border-radius: 20px;
            padding: 16px 28px; z-index: 200;
            display: none; align-items: center; gap: 14px;
            box-shadow: 0 8px 40px rgba(233,69,96,0.3);
            animation: fadeInDown 0.3s ease;
        }
        .voice-overlay.show { display: flex; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .voice-overlay .voice-dot {
            width: 14px; height: 14px; border-radius: 50%; background: #e94560;
            animation: voiceDot 0.6s ease-in-out infinite;
        }
        @keyframes voiceDot {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.4; }
        }
        .voice-overlay .voice-text {
            font-size: 15px; color: #fff; max-width: 440px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .voice-overlay .voice-hint { font-size: 12px; color: #8899aa; }

        /* 摄像头预览窗口 */
        .camera-preview {
            position: fixed; bottom: 100px; right: 20px; z-index: 150;
            width: 180px; height: 135px; border-radius: 16px;
            border: 2px solid rgba(0,184,148,0.5);
            overflow: hidden; display: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            background: #000;
        }
        .camera-preview.show { display: block; }
        .camera-preview video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1);
        }
        .camera-preview .cam-label {
            position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
            font-size: 10px; color: #fff; background: rgba(0,0,0,0.5);
            padding: 2px 10px; border-radius: 10px; white-space: nowrap;
        }
        .camera-preview .gesture-indicator {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            font-size: 40px; opacity: 0; transition: all 0.3s ease; pointer-events: none;
        }
        .camera-preview .gesture-indicator.flash {
            opacity: 1; animation: gesturePop 0.6s ease-out;
        }
        @keyframes gesturePop {
            0% { transform: translate(-50%,-50%) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%,-50%) scale(1.8); opacity: 0; }
        }

        /* 手势方向提示 */
        .gesture-hints {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 18px 20px; margin-top: 8px;
        }
        .gesture-hints .hint-title {
            font-size: 13px; color: #8899aa; margin-bottom: 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .gesture-compass {
            display: grid; grid-template-columns: 60px 60px 60px;
            grid-template-rows: 40px 40px 40px;
            gap: 2px; justify-content: center; margin-bottom: 6px;
        }
        .gesture-compass .cell {
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #8899aa;
            border: 1px solid rgba(255,255,255,0.06); border-radius: 8px;
        }
        .gesture-compass .cell.center { color: #00b894; border-color: rgba(0,184,148,0.3); background: rgba(0,184,148,0.08); }
        .gesture-compass .cell.active { color: #e94560; border-color: rgba(233,69,96,0.3); background: rgba(233,69,96,0.1); }

        /* 语音命令提示 */
        .voice-hints {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px; padding: 18px 20px; margin-top: 8px;
        }
        .voice-hints .hint-title {
            font-size: 13px; color: #8899aa; margin-bottom: 10px;
            display: flex; align-items: center; gap: 6px;
        }
        .voice-hints .hint-tags { display: flex; flex-wrap: wrap; gap: 8px; }
        .voice-hints .hint-tag {
            font-size: 12px; padding: 4px 14px; border-radius: 20px;
            background: rgba(255,255,255,0.06); color: #aab;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .voice-hints .hint-tag.highlight {
            color: #e94560; border-color: rgba(233,69,96,0.3);
            background: rgba(233,69,96,0.1);
        }

        .toast {
            position: fixed; bottom: 100px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(233,69,96,0.95); color: #fff;
            padding: 12px 28px; border-radius: 50px;
            font-size: 14px; font-weight: 500; z-index: 100;
            transition: transform 0.4s ease; pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .footer { text-align: center; padding: 20px; color: #445566; font-size: 13px; letter-spacing: 1px; }

        @media (max-width: 600px) {
            .title { font-size: 26px; }
            .emoji-btn { width: 52px; height: 52px; font-size: 24px; border-radius: 14px; }
            .text-input-wrapper { flex-direction: column; }
            .music-card { padding: 14px 16px; gap: 12px; }
            .music-card .cover { width: 48px; height: 48px; font-size: 24px; border-radius: 10px; }
            .player-bar { padding: 10px 12px; gap: 8px; }
            .player-bar .progress-wrap { width: 60px; }
            .volume-slider { width: 40px; }
            .player-bar button { width: 30px; height: 30px; font-size: 13px; }
            .camera-preview { width: 130px; height: 100px; right: 8px; bottom: 90px; }
        }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>
    <div class="toast" id="toast"></div>

    <!-- 语音浮层 -->
    <div class="voice-overlay" id="voiceOverlay">
        <div class="voice-dot"></div>
        <div>
            <div class="voice-text" id="voiceText">正在聆听...</div>
            <div class="voice-hint">说出指令控制音乐</div>
        </div>
    </div>

    <!-- 摄像头预览 -->
    <div class="camera-preview" id="cameraPreview">
        <video id="camVideo" autoplay playsinline></video>
        <div class="cam-label">✋ 手势控制</div>
        <div class="gesture-indicator" id="gestureIcon"></div>
    </div>
    <!-- MediaPipe 画布（隐藏，只用于计算） -->
    <canvas id="camCanvas" style="display:none;"></canvas>

    <!-- 底部播放器 -->
    <div class="player-bar" id="playerBar">
        <div class="np-cover" id="npCover">🎵</div>
        <div class="np-info">
            <div class="np-name" id="npName">未在播放</div>
            <div class="np-artist" id="npArtist"></div>
        </div>
        <div class="np-controls">
            <button id="btnPrev" title="上一首">⏮</button>
            <button id="btnPlay" title="播放/暂停">▶</button>
            <button id="btnNext" title="下一首">⏭</button>
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span style="font-size:11px;color:#8899aa;min-width:30px;" id="timeDisplay">0:00</span>
            <div class="volume-wrap">
                <span style="font-size:13px;">🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" title="音量">
            </div>
            <button class="btn-special" id="btnMic" title="语音控制">🎤</button>
            <button class="btn-special" id="btnCam" title="手势控制">✋</button>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">🎵</div>
            <h1 class="title">Funny Music</h1>
            <p class="subtitle">用音乐，回应你的每一种情绪</p>
        </header>

        <div class="input-section">
            <p class="section-label">🎭 选择你的情绪</p>
            <div class="emoji-grid" id="emojiGrid">
                <button class="emoji-btn" data-mood="happy">😊<span class="label">开心</span></button>
                <button class="emoji-btn" data-mood="sad">😢<span class="label">悲伤</span></button>
                <button class="emoji-btn" data-mood="angry">😤<span class="label">愤怒</span></button>
                <button class="emoji-btn" data-mood="calm">😌<span class="label">平静</span></button>
                <button class="emoji-btn" data-mood="excited">🤩<span class="label">兴奋</span></button>
                <button class="emoji-btn" data-mood="romantic">🥰<span class="label">浪漫</span></button>
                <button class="emoji-btn" data-mood="lonely">🥺<span class="label">孤独</span></button>
                <button class="emoji-btn" data-mood="energetic">⚡<span class="label">充满能量</span></button>
            </div>

            <p class="section-label" style="margin-top:8px;">✍️ 或直接描述你的心情</p>
            <div class="text-input-wrapper">
                <input type="text" class="text-input" id="textInput" placeholder="例如：今天加班很累，想听点放松的音乐..." maxlength="80">
                <button class="submit-btn" id="submitBtn">🎧 推荐音乐</button>
            </div>

            <!-- 手势提示 -->
            <div class="gesture-hints">
                <div class="hint-title">✋ 手势控制 &nbsp;<span style="font-weight:400;color:#667;">— 点击底部 ✋ 按钮开启摄像头</span></div>
                <div class="gesture-compass">
                    <div class="cell"></div>
                    <div class="cell active">⬆ 音量+</div>
                    <div class="cell"></div>
                    <div class="cell active">⬅ 上一首</div>
                    <div class="cell center">✋</div>
                    <div class="cell active">➡ 下一首</div>
                    <div class="cell"></div>
                    <div class="cell active">⬇ 音量-</div>
                    <div class="cell"></div>
                </div>
                <div style="display:flex;justify-content:center;gap:16px;margin-top:4px;">
                    <span style="font-size:12px;color:#e94560;">✊ 握拳 = 暂停</span>
                    <span style="font-size:12px;color:#00b894;">✋ 张开 = 播放</span>
                </div>
            </div>

            <!-- 语音命令提示 -->
            <div class="voice-hints">
                <div class="hint-title">🎤 语音控制 &nbsp;<span style="font-weight:400;color:#667;">— 点击底部 🎤 按钮开始</span></div>
                <div class="hint-tags">
                    <span class="hint-tag highlight">安静一些</span>
                    <span class="hint-tag highlight">大声一点</span>
                    <span class="hint-tag highlight">换一首</span>
                    <span class="hint-tag highlight">上一首</span>
                    <span class="hint-tag">暂停</span>
                    <span class="hint-tag">继续播放</span>
                    <span class="hint-tag">关闭麦克风</span>
                </div>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <div class="mood-badge" id="moodBadge"></div>
            <div class="music-list" id="musicList"></div>
        </div>

        <footer class="footer">
            Funny Music © 2026 &nbsp;|&nbsp; 用 AI 理解你的情绪，用音乐治愈你的心情
        </footer>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>

    <script>
        // ============ 背景粒子 ============
        (function() {
            const c = document.getElementById('particles');
            const colors = ['#e94560','#ff6b6b','#ffa502','#7bed9f','#70a1ff','#a29bfe','#fd79a8'];
            for (let i=0; i<40; i++) {
                const p = document.createElement('div'); p.className = 'particle';
                const s = Math.random()*4+2;
                p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${Math.random()*10+8}s;animation-delay:${Math.random()*10}s;`;
                c.appendChild(p);
            }
        })();

        // ============ 情绪→音乐映射 ============
        const moodMap = {

            const query = encodeURIComponent(`${songName} ${artist}`);
            const url = `https://itunes.apple.com/search?term=${query}&limit=3&media=music&country=CN`;
            try {
                const resp = await fetch(url); const data = await resp.json();
                if (data.results && data.results.length > 0) {
                    const wp = data.results.filter(r => r.previewUrl);
                    return wp.length > 0 ? wp[0] : data.results[0];
                }
                return null;

            currentTrackIndex = index;

            if (song._previewUrl) {
                playerBar.classList.add('show'); updateCardUI(index);

            }
            const cards = document.querySelectorAll('.music-card');
            if (cards[index]) cards[index].classList.add('loading');
            searchiTunes(song.name, song.artist).then(result => {

        function initSpeechRecognition() {
            if (!SpeechRecognition) {
                btnMic.style.opacity = '0.4'; btnMic.title = '语音识别不可用'; return false;
            }
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN'; recognition.interimResults = true;
            recognition.continuous = true; recognition.maxAlternatives = 1;

            recognition.onresult = (event) => {
                let interim = '', final = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const t = event.results[i][0].transcript.trim();
                    if (event.results[i].isFinal) final += t; else interim += t;
                }
                if (final || interim) voiceText.textContent = final || interim;
                if (final) processVoiceCommand(final);
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') { showToast('🔇 请允许麦克风权限'); stopListening(); }
                else if (event.error === 'network') showToast('⚠️ 语音识别需要网络连接');
            };

            recognition.onend = () => {
                if (isListening) { try { recognition.start(); } catch(e) {} }
            };
            return true;
        }

        function processVoiceCommand(text) {
            const lower = text.toLowerCase();

            const moodKw = { happy:['开心','高兴','快乐'], sad:['悲伤','难过','伤心','忧郁'], angry:['愤怒','生气','暴躁'],

                lonely:['孤独','寂寞'], energetic:['能量','燃','热血','运动'] };
            for (const [m, kws] of Object.entries(moodKw)) {
                if (kws.some(k => lower.includes(k))) {
                    selectMood(m); currentMood = m; renderResults(m, '🎤 语音切换情绪');
                    showToast(`🎤 已切换到「${moodMap[m].label}」情绪`); return;
                }
            }
            if (text.length > 2) showToast(`🎤 听到你说：「${text}」`);
        }

        const GESTURE_COOLDOWN = 800;  // 手势冷却时间 ms

        function initHands() {
            const Hands = window.Hands;
            if (!Hands) {
                btnCam.style.opacity = '0.4'; btnCam.title = '手势控制加载失败';
                console.warn('MediaPipe Hands 未加载');
                return false;
            }
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 0,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5
            });
            hands.onResults(onHandResults);
            return true;
        }

        function onHandResults(results) {
            if (!isCameraOn) return;

            // 在 canvas 上绘制（用于 MediaPipe 内部处理）
            const ctx = camCanvas.getContext('2d');
            ctx.save();
            ctx.clearRect(0, 0, camCanvas.width, camCanvas.height);

            if (results.image) {
                ctx.drawImage(results.image, 0, 0, camCanvas.width, camCanvas.height);
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // 绘制手部关键点连线
                drawHandLandmarks(ctx, landmarks, results.multiHandConnections?.[0] || []);

                // 使用手腕 (landmark 0) 作为追踪点
                const wrist = landmarks[0];
                handHistory.push({ x: wrist.x, y: wrist.y, t: Date.now() });

                // 只保留最近的历史
                if (handHistory.length > HISTORY_SIZE) {
                    handHistory = handHistory.slice(-HISTORY_SIZE);
                }

                // 检测手势
                detectSwipe();
                // 检测握拳/松手
                detectHandPose(landmarks);
            }
            ctx.restore();
        }

        function drawHandLandmarks(ctx, landmarks, connections) {
            // 绘制连线
            if (connections && connections.length > 0) {
                ctx.strokeStyle = '#00b894';
                ctx.lineWidth = 2;
                for (const conn of connections) {
                    const [a, b] = [landmarks[conn[0]], landmarks[conn[1]]];
                    ctx.beginPath();
                    ctx.moveTo(a.x * camCanvas.width, a.y * camCanvas.height);
                    ctx.lineTo(b.x * camCanvas.width, b.y * camCanvas.height);
                    ctx.stroke();
                }
            }
            // 绘制关键点
            for (const lm of landmarks) {
                ctx.fillStyle = '#e94560';
                ctx.beginPath();
                ctx.arc(lm.x * camCanvas.width, lm.y * camCanvas.height, 4, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        function detectSwipe() {
            if (gestureCooldown || handHistory.length < 8) return;

            // 取最近的窗口 (~400ms)
            const now = Date.now();
            const recent = handHistory.filter(h => now - h.t < 500);
            if (recent.length < 6) return;

            const first = recent[0];
            const last = recent[recent.length - 1];
            const dx = last.x - first.x;
            const dy = last.y - first.y;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            // 需要足够的移动量
            if (Math.max(absDx, absDy) < SWIPE_THRESHOLD) return;

            let direction = null;
            if (absDx > absDy) {
                // 水平手势
                direction = dx > 0 ? 'right' : 'left';
            } else {
                // 垂直手势 (注意: y=0 是顶部, 所以 dy<0 是向上)
                direction = dy < 0 ? 'up' : 'down';
            }

            // 触发动作
            executeGesture(direction);

            // 冷却 & 重置
            gestureCooldown = true;
            handHistory = [];
            setTimeout(() => { gestureCooldown = false; }, GESTURE_COOLDOWN);
        }

        function executeGesture(direction) {
            if (currentPlaylist.length === 0) {
                showToast('😅 请先获取音乐推荐');
                return;
            }

            const icons = { up: '⬆', down: '⬇', left: '⬅', right: '➡' };

            switch (direction) {
                case 'up':
                    changeVolume(15);
                    flashGestureIcon('⬆');
                    break;
                case 'down':
                    changeVolume(-15);
                    flashGestureIcon('⬇');
                    break;
                case 'left':
                    playPrev();
                    flashGestureIcon('⬅');
                    break;
                case 'right':
                    playNext();
                    flashGestureIcon('➡');
                    break;
            }
        }

        function detectHandPose(landmarks) {
            // 指尖: 4=拇指, 8=食指, 12=中指, 16=无名指, 20=小指
            // 指根 MCP: 5=食指, 9=中指, 13=无名指, 17=小指
            const fingertips = [8, 12, 16, 20];
            const mcpJoints = [5, 9, 13, 17];

            let fingersCurled = 0;
            for (let i = 0; i < fingertips.length; i++) {
                // 指尖 y > 指根 y 表示手指弯曲（y 轴向下）
                if (landmarks[fingertips[i]].y > landmarks[mcpJoints[i]].y + 0.03) {
                    fingersCurled++;
                }
            }

            let detectedPose;
            if (fingersCurled >= 3) {
                detectedPose = 'fist'; // 握拳：至少3根手指弯曲
            } else if (fingersCurled <= 1) {
                detectedPose = 'open'; // 张开：最多1根手指弯曲
            } else {
                detectedPose = null; // 中间状态
            }

            // 连续稳定帧确认，防止闪烁
            if (detectedPose === lastHandPose) {
                handPoseStableFrames++;
            } else {
                lastHandPose = detectedPose;
                handPoseStableFrames = 1;
                // 未达到稳定帧数前不触发
                if (detectedPose === null && handPoseStableFrames < FIST_STABLE_FRAMES) {
                    return;
                }
            }

            if (handPoseStableFrames === FIST_STABLE_FRAMES) {
                if (detectedPose === 'fist') {
                    executePoseAction('fist');
                } else if (detectedPose === 'open') {
                    executePoseAction('open');
                }
            }
        }

        function executePoseAction(pose) {
            if (currentPlaylist.length === 0) { showToast('😅 请先获取音乐推荐'); return; }

            if (pose === 'fist') {
                if (audio && !audio.paused) {
                    audio.pause();
                    btnPlay.textContent = '▶';
                    updateCardUI(-1);
                    flashGestureIcon('✊');
                    showToast('✊ 握拳 — 已暂停');
                }
            } else if (pose === 'open') {
                if (audio && audio.paused) {
                    audio.play();
                    btnPlay.textContent = '⏸';
                    updateCardUI(currentTrackIndex);
                    flashGestureIcon('✋');
                    showToast('✋ 松手 — 继续播放');
                }
            }
        }

        function flashGestureIcon(icon) {
            gestureIcon.textContent = icon;
            gestureIcon.classList.remove('flash');
            void gestureIcon.offsetWidth;
            gestureIcon.classList.add('flash');
            setTimeout(() => gestureIcon.classList.remove('flash'), 700);
        }

        async function startCamera() {
            if (!hands && !initHands()) {
                showToast('⚠️ 手势识别库加载中，请稍后再试');
                return;
            }
            if (isCameraOn) return;

            try {
                camStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 320, height: 240, facingMode: 'user' }
                });
                camVideo.srcObject = camStream;
                camCanvas.width = 320;
                camCanvas.height = 240;
                cameraPreview.classList.add('show');
                btnCam.classList.add('camera-active');
                isCameraOn = true;
                showToast('✋ 手势控制已开启 — 挥动手掌控制音乐');

                // 开始 MediaPipe 处理循环
                requestAnimationFrame(processCameraFrame);
            } catch (e) {
                console.error('摄像头启动失败:', e);
                showToast('⚠️ 无法访问摄像头，请检查权限');
            }
        }

        function processCameraFrame() {
            if (!isCameraOn) return;
            if (hands && camVideo.readyState >= 2) {
                hands.send({ image: camVideo }).then(() => {
                    if (isCameraOn) requestAnimationFrame(processCameraFrame);
                }).catch(() => {
                    if (isCameraOn) requestAnimationFrame(processCameraFrame);
                });
            } else {
                if (isCameraOn) requestAnimationFrame(processCameraFrame);
            }
        }

        function stopCamera() {
            isCameraOn = false;
            if (camStream) {
                camStream.getTracks().forEach(t => t.stop());
                camStream = null;
            }
            camVideo.srcObject = null;
            cameraPreview.classList.remove('show');
            btnCam.classList.remove('camera-active');
            handHistory = [];
            lastHandPose = null;
            handPoseStableFrames = 0;
            showToast('📷 手势控制已关闭');
        }

        btnCam.addEventListener('click', () => isCameraOn ? stopCamera() : startCamera());

        // 初始化
        initSpeechRecognition();
        initHands();

        window.addEventListener('beforeunload', () => {
            stopAudio(); stopListening(); stopCamera();
        });
    </script>
</body>
</html>
