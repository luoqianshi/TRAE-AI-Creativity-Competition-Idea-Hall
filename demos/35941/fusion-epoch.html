// ---------- 水下场景环境 ----------
let foodParticles = [];      // 绿色食物颗粒 (脉动小圆点)
let rockClusters = [];        // 岩石障碍物: { x, y, r, shade }
let plankton = [];            // 环境浮游微粒，缓慢上浮
const BG_TILE = 200;           // 200x200 背景色块
let dashTrail = [];            // 冲刺拖尾位置历史

function spawnCreature(type, x, y) {
  // 敌人难度按击杀数成长（与进化次数解耦）
  const kills = (typeof player !== 'undefined' && player.kills) ? player.kills : 0;
  const killScale = 1 + Math.floor(kills / 5) * 0.25;      // 每 5 击杀 +25% HP/攻击
  const detectMul = 1 + Math.floor(kills / 10) * 0.15;     // 每 10 击杀 +15% 探测
  return {
    type: type,
    x: x, y: y,
    vx: 0, vy: 0,
    hp: Math.round(type.hp * killScale),
    maxHp: Math.round((type.maxHp !== undefined ? type.maxHp : type.hp) * killScale),
    size: type.size,
    aiTimer: Math.random() * 120,
    hurtFlash: 0,
    stunned: 0,
    poisoned: 0,
    walkFrame: 0,
    walkTimer: Math.random() * 30,
    isBoss: BOSS_TYPES.includes(type),
    attackCd: 0,
    retreatTimer: 0,
    dead: false,
    chargeTimer: type.personality === 'boss' ? 180 : 0,
    chargeDur: 0,
    chargeCooldown: 0,
    isCharging: false,
    detectMul: detectMul,
    atk: Math.round(type.atk * killScale),
  };
}

function populateWorld() {
  creatures = [];
  // 先刷一批胆小/中性生物
  for (let i = 0; i < 10; i++) {
    const type = CREATURE_TYPES[Math.floor(Math.random() * 4)];
    const x = Math.random() * WORLD_W;
    const y = Math.random() * WORLD_H;
    if (Math.hypot(x - player.x, y - player.y) < 300) continue;
    creatures.push(spawnCreature(type, x, y));
  }
  // 再刷凶猛生物（数量少一些）
  for (let i = 0; i < 6; i++) {
    const type = CREATURE_TYPES[4 + Math.floor(Math.random() * 4)];
    const x = Math.random() * WORLD_W;
    const y = Math.random() * WORLD_H;
    if (Math.hypot(x - player.x, y - player.y) < 400) continue;
    creatures.push(spawnCreature(type, x, y));
  }
  // BOSS (只同时存在 1 只)
  bossRespawnTimer = 0;
  const bossType = BOSS_TYPES[Math.floor(Math.random() * BOSS_TYPES.length)];
  const bx = Math.random() < 0.5 ? WORLD_W * 0.2 : WORLD_W * 0.8;
  const by = Math.random() < 0.5 ? WORLD_H * 0.2 : WORLD_H * 0.8;
  creatures.push(spawnCreature(bossType, bx, by));

  // ---- 食物颗粒 (60-80) ----
  foodParticles = [];
  const foodCount = 60 + Math.floor(Math.random() * 21);
  for (let i = 0; i < foodCount; i++) {
    foodParticles.push({
      x: rand(40, WORLD_W - 40),
      y: rand(40, WORLD_H - 40),
      phase: Math.random() * Math.PI * 2,
      size: 3 + Math.random() * 2,
    });
  }

  // ---- 岩石障碍 (8-10 组，每组 5-12 块) ----
  rockClusters = [];
  const clusterCount = 8 + Math.floor(Math.random() * 3);
  for (let c = 0; c < clusterCount; c++) {
    const cx = rand(150, WORLD_W - 150);
    const cy = rand(150, WORLD_H - 150);
    if (Math.hypot(cx - player.x, cy - player.y) < 280) { c--; continue; }
    const n = 5 + Math.floor(Math.random() * 8);
    for (let i = 0; i < n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.random() * 65;
      const rx = clamp(cx + Math.cos(ang) * rad, 20, WORLD_W - 20);
      const ry = clamp(cy + Math.sin(ang) * rad, 20, WORLD_H - 20);
      rockClusters.push({
        x: rx, y: ry,
        r: 10 + Math.random() * 18,
        shade: 0.85 + Math.random() * 0.3,
      });
    }
  }

  // ---- 浮游微粒 (130+) ----
  plankton = [];
  for (let i = 0; i < 135; i++) {
    plankton.push({
      x: Math.random() * WORLD_W,
      y: Math.random() * WORLD_H,
      vx: rand(-0.12, 0.12),
      vy: -rand(0.15, 0.4),
      size: 1 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2,
      kind: Math.random() < 0.55 ? 'green' : (Math.random() < 0.7 ? 'yellow' : 'white'),
    });
  }
}

// 圆与圆碰撞判断
function circleHit(x1, y1, r1, x2, y2, r2) {
  const dx = x1 - x2, dy = y1 - y2;
  const rs = r1 + r2;
  return dx * dx + dy * dy < rs * rs;
}
// 将一个带半径的点推出所有岩石区域 (迭代解算)
function resolveRockCollision(x, y, r) {
  for (let iter = 0; iter < 6; iter++) {
    let moved = false;
    for (const rc of rockClusters) {
      const dx = x - rc.x;
      const dy = y - rc.y;
      const d2 = dx * dx + dy * dy;
      const rr = r + rc.r;
      if (d2 < rr * rr && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        x = rc.x + dx / d * rr;
        y = rc.y + dy / d * rr;
        moved = true;
      }
    }
    if (!moved) break;
  }
  return { x: Math.max(10, Math.min(WORLD_W - 10, x)), y: Math.max(10, Math.min(WORLD_H - 10, y)) };
}

// ---------- 工具 ----------
function rand(a, b) { return a + Math.random() * (b - a); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function spawnParticles(x, y, color, n, speed=2, opts={}) {
  for (let i = 0; i < n; i++) {
    const ang = opts.angle !== undefined ? opts.angle + (i / n) * Math.PI * 2 : Math.random() * Math.PI * 2;
    const spd = opts.spd !== undefined ? opts.spd : rand(speed * 0.5, speed * 1.5);
    particles.push({
      x, y,
      vx: opts.vx !== undefined ? opts.vx : Math.cos(ang) * spd,
      vy: opts.vy !== undefined ? opts.vy : Math.sin(ang) * spd,
      life: opts.life || rand(20, 40),
      maxLife: opts.maxLife || 40,
      color,
      size: opts.size || rand(2, 4),
      shape: opts.shape || 'rect',
      alpha: opts.alpha !== undefined ? opts.alpha : 1,
    });
  }
}

function spawnText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 50, maxLife: 50 });
}

function flashMessage(text) {
  const el = document.getElementById('flash-msg');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
}

// ---------- 摄像机 ----------
let camera = { x: 0, y: 0 };
function updateCamera() {
  camera.x = clamp(player.x - W / 2, 0, WORLD_W - W);
  camera.y = clamp(player.y - H / 2, 0, WORLD_H - H);
}

// ---------- 更新 ----------
function update(dt) {
  if (gameState === 'evolution') {
    // 进化选择时仅更新粒子、动画和 UI
    updateParticles(dt);
    if (player.morphProgress > 0) {
      player.morphProgress = Math.max(0, player.morphProgress - dt);
    }
    updateFloatingTexts(dt);
    updateShake();
    updateUI();
    return;
  }
  if (gameState !== 'playing') return;
  gameTime += dt;

  // 攻击范围上限（平衡）
  player.attackRange = Math.min(110, player.attackRange);

  // 进化冷却倒计时
  if (player.evolveCd > 0) player.evolveCd = Math.max(0, player.evolveCd - dt);

  updatePlayer(dt);
  updateCreatures(dt);
  // Boss 刷新: 同时只存在 1 只，死亡后 20 秒刷新
  const aliveBoss = creatures.find(c => c.isBoss && !c.dead);
  if (!aliveBoss && bossRespawnTimer > 0) {
    bossRespawnTimer = Math.max(0, bossRespawnTimer - dt);
    if (bossRespawnTimer <= 0) {
      const bossType = BOSS_TYPES[Math.floor(Math.random() * BOSS_TYPES.length)];
      const bx = Math.random() < 0.5 ? WORLD_W * 0.2 : WORLD_W * 0.8;
      const by = Math.random() < 0.5 ? WORLD_H * 0.2 : WORLD_H * 0.8;
      creatures.push(spawnCreature(bossType, bx, by));
      flashMessage('⚠ ' + bossType.name + ' 出现了！');
    }
  }

  updateParticles(dt);
  updateProjectiles(dt);
  // 进化动画更新
  if (player.morphProgress > 0) {
    player.morphProgress = Math.max(0, player.morphProgress - dt);
  }
  updateFloatingTexts(dt);
  updateFood(dt);
  updatePlankton(dt);
  updateCamera();
  updateShake();
  checkStage();
  updateUI();
  updateTutorial(dt);
  drawMinimap();

  if (player.hp <= 0) {
    gameState = 'gameover';
    showGameOver();
  }
  if (player.stage >= STAGES.length - 1 && player.dna >= STAGES[STAGES.length - 1].dnaNeeded) {
    gameState = 'victory';
    showVictory();
  }
}

function updateFood(dt) {
  const eatRadius = 40 + player.size * 1.2;
  for (let i = foodParticles.length - 1; i >= 0; i--) {
    const f = foodParticles[i];
    const dx = player.x - f.x, dy = player.y - f.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < eatRadius * eatRadius) {
      player.hp = Math.min(player.maxHp, player.hp + 1);
      player.dna += 1;
      spawnParticles(f.x, f.y, '#88ffaa', 5, 2);
      spawnText(f.x, f.y - 5, '+1', '#88ffaa');
      foodParticles.splice(i, 1);
      if (foodParticles.length < 50 && Math.random() < 0.3) {
        foodParticles.push({
          x: rand(40, WORLD_W - 40),
          y: rand(40, WORLD_H - 40),
          phase: Math.random() * Math.PI * 2,
          size: 3 + Math.random() * 2,
        });
      }
    } else if (d2 < (eatRadius + 80) * (eatRadius + 80)) {
      const d = Math.sqrt(d2);
      f.x += dx / d * 0.8;
      f.y += dy / d * 0.8;
    }
  }
}

function updatePlankton(dt) {
  for (const p of plankton) {
    p.x += p.vx + Math.sin(gameTime * 0.02 + p.phase) * 0.1;
    p.y += p.vy;
    if (p.y < 10) p.y = WORLD_H - 5;
    if (p.y > WORLD_H) p.y = 15;
    if (p.x < 0) p.x = WORLD_W - 5;
    if (p.x > WORLD_W) p.x = 5;
  }
}

function updatePlayer(dt) {
  player.attackCd = Math.max(0, player.attackCd - dt);
  player.attackAnim = Math.max(0, player.attackAnim - dt);
  player.hurtFlash = Math.max(0, player.hurtFlash - dt);
  player.invuln = Math.max(0, player.invuln - dt);
  // 冲刺冷却
  if (player.dashCd > 0) player.dashCd = Math.max(0, player.dashCd - dt);
  // 冲刺持续
  if (player.dashDur > 0) {
    player.dashDur = Math.max(0, player.dashDur - dt);
    // 冲刺拖尾
    dashTrail.push({ x: player.x, y: player.y, life: 10 });
    if (dashTrail.length > 12) dashTrail.shift();
  }
  // 拖尾衰减
  for (let i = dashTrail.length - 1; i >= 0; i--) {
    dashTrail[i].life -= dt;
    if (dashTrail[i].life <= 0) dashTrail.splice(i, 1);
  }

  if (player.regen > 0) {
    player.hp = Math.min(player.maxHp, player.hp + player.regen * dt / 60);
  }

  // 冲刺中: 朝面向方向高速移动
  if (player.dashDur > 0) {
    const dashSpd = player.baseSpeed * player.speedMul * 3.0;
    const nx = player.x + Math.cos(player.facing) * dashSpd;
    const ny = player.y + Math.sin(player.facing) * dashSpd;
    const resolvedX = resolveRockCollision(nx, player.y, player.size);
    const resolved = resolveRockCollision(resolvedX.x, ny, player.size);
    player.x = clamp(resolved.x, 20, WORLD_W - 20);
    player.y = clamp(resolved.y, 20, WORLD_H - 20);
  } else {
    // 正常移动
    const spd = player.baseSpeed * player.speedMul;
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    const len = Math.hypot(dx, dy);
    if (len > 0) {
      dx /= len; dy /= len;
      const nx = player.x + dx * spd;
      const ny = player.y + dy * spd;
      const resolvedX = resolveRockCollision(nx, player.y, player.size);
      const resolved = resolveRockCollision(resolvedX.x, ny, player.size);
      player.x = clamp(resolved.x, 20, WORLD_W - 20);
      player.y = clamp(resolved.y, 20, WORLD_H - 20);
      player.facing = Math.atan2(dy, dx);
      player.walkTimer += dt;
      if (player.walkTimer > 8) {
        player.walkTimer = 0;
        player.walkFrame = (player.walkFrame + 1) % 4;
      }
      if (tutorialState.active) tutorialState.hasMoved = true;
    }
  }
  player.x = clamp(player.x, 20, WORLD_W - 20);
  player.y = clamp(player.y, 20, WORLD_H - 20);

  // 靠近敌人自动攻击
  if (player.attackCd <= 0) {
    for (const c of creatures) {
      if (c.dead) continue;
      const d = Math.hypot(c.x - player.x, c.y - player.y);
      if (d < player.attackRange + c.size * 0.6) {
        doPlayerAttack();
        break;
      }
    }
  }

  if (keys[' ']) {
    // 空格: 冲刺优先, 否则攻击
    if (player.dashCd <= 0 && player.dashDur <= 0) {
      player.dashDur = 12;
      player.dashCd = Math.floor(150 * (player.dashCdMul || 1)); // 应用冷却倍率
      sfxDash();
    } else if (player.attackCd <= 0) {
      doPlayerAttack();
    }
  }
}

function doPlayerAttack() {
  const branch = player.bodyType ? (BODY_DEFS[player.bodyType]?.branch || null) : null;
  player.attackCd = 30 * player.attackCdMul;
  player.attackAnim = 15;
  if (tutorialState.active) tutorialState.hasAttacked = true;

  if (branch === 'predator') {
    doPredatorAttack();
  } else if (branch === 'armor') {
    doArmorAttack();
  } else if (branch === 'psychic') {
    doPsychicAttack();
  } else if (branch === 'stealth') {
    doStealthAttack();
  } else if (branch === 'corrupt') {
    doCorruptAttack();
  } else if (branch === 'crystal') {
    doCrystalAttack();
  } else {
    doGenericAttack();
  }
}

// 通用攻击（无形态/基础形态）
function doGenericAttack() {
  let hit = false;
  for (const c of creatures) {
    if (c.dead) continue;
    const d = dist(player, c);
    if (d < player.attackRange + c.size) {
      c.hp -= player.attack;
      c.hurtFlash = 15;
      c.retreatTimer = 45;
      if (player.venom && c.poisoned <= 0) c.poisoned = 120;
      if (player.burn) c.burnTimer = (c.burnTimer || 0) + 180;
      if (player.stun && Math.random() < 0.35) c.stunned = Math.max(c.stunned || 0, 60);
      spawnParticles(c.x, c.y, c.type.color, 6, 3);
      spawnText(c.x, c.y - c.size - 5, '-' + player.attack, '#ff8888');
      hit = true;
    }
  }
  if (hit) {
    spawnParticles(player.x + Math.cos(player.facing) * 30, player.y + Math.sin(player.facing) * 30, '#ffff88', 5);
    sfxAttackHit();
  }
}

// ========== 掠食系：扇形撕咬 + 连击 ==========
function doPredatorAttack() {
  const angle = player.facing;
  const spread = 1.2; // 120度扇形
  let hitCount = 0;

  // 扇形弧线特效
  drawAttackArc(angle, spread, player.attackRange + 20, 'rgba(255,100,60,0.3)');

  for (const c of creatures) {
    if (c.dead) continue;
    const d = dist(player, c);
    if (d > player.attackRange + c.size) continue;

    const overlap = d < (player.size + c.size) * 0.3;
    if (!overlap) {
      const enemyAngle = Math.atan2(c.y - player.y, c.x - player.x);
      let ad = enemyAngle - angle;
      while (ad > Math.PI) ad -= Math.PI * 2;
      while (ad < -Math.PI) ad += Math.PI * 2;
      if (Math.abs(ad) > spread / 2) continue;
    }

    if (c.lastHitBy === 'player' && (c.comboTimer || 0) > 0) {
      c.comboLevel = Math.min((c.comboLevel || 0) + 1, 3);
    } else {
      c.comboLevel = 1;
    }
    c.comboTimer = 60;
    c.lastHitBy = 'player';

    const dmg = player.attack * (1 + (c.comboLevel - 1) * 0.5);
    c.hp -= dmg;
    c.hurtFlash = 15;
    c.retreatTimer = 45;
    if (player.venom && c.poisoned <= 0) c.poisoned = 120;
    if (player.burn) c.burnTimer = (c.burnTimer || 0) + 180;
    if (player.stun && Math.random() < 0.35) c.stunned = Math.max(c.stunned || 0, 60);

    spawnParticles(c.x, c.y, '#ff6644', 5, 3);
    spawnParticles(c.x, c.y, '#ffeecc', 4, 2);
    spawnText(c.x, c.y - c.size - 5, '-' + Math.round(dmg), '#ff8888');
    if (c.comboLevel >= 3) spawnText(c.x, c.y - c.size - 22, '3x 连击!', '#ffcc00');

    // 二连击（sharp 特质）
    const doubleHit = player.doubleHit || 0;
    if (doubleHit > 0 && Math.random() < doubleHit && !c.dead) {
      const dmg2 = player.attack * 0.6;
      c.hp -= dmg2;
      c.hurtFlash = 10;
      spawnParticles(c.x, c.y, '#ffaa44', 4, 2);
      spawnText(c.x, c.y - c.size - 5, '-' + Math.round(dmg2), '#ffaa44');
    }

    hitCount++;
  }

  if (hitCount > 0) {
    // 身体前突
    player.x = clamp(player.x + Math.cos(angle) * 8, 20, WORLD_W - 20);
    player.y = clamp(player.y + Math.sin(angle) * 8, 20, WORLD_H - 20);
    sfxAttackHit();
    triggerShake(3);
  }
}

// ========== 重甲系：震荡波 AOE + 击退 ==========
function doArmorAttack() {
  // 同心圆震波特效
  const maxR = player.attackRange + player.size;
  for (let ring = 1; ring <= 3; ring++) {
    const prog = ring / 3;
    const r = maxR * prog;
    ctx.save();
    ctx.globalAlpha = 0.25 - prog * 0.1;
    ctx.strokeStyle = '#ffcc44';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x - camera.x, player.y - camera.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  let hitCount = 0;
  for (const c of creatures) {
    if (c.dead) continue;
    const d = dist(player, c);
    if (d > player.attackRange + c.size) continue;

    c.hp -= player.attack;
    c.hurtFlash = 15;
    c.retreatTimer = 45;

    spawnParticles(c.x, c.y, '#ffcc44', 6, 3);
    spawnParticles(c.x, c.y, '#ffee88', 4, 2);
    spawnText(c.x, c.y - c.size - 5, '-' + player.attack, '#ffcc44');
    hitCount++;
  }

  if (hitCount > 0) {
    sfxAttackHit();
    triggerShake(5);
  }
}

// ========== 灵能系：能量弹 + 元素效果 ==========
function doPsychicAttack() {
  const tier = player.bodyType ? (BODY_DEFS[player.bodyType]?.tier || 1) : 1;
  let color, effect, effectColor;
  if (tier <= 1) { color = '#ff8800'; effect = 'burn'; effectColor = '#ff4400'; }
  else if (tier === 2) { color = '#ffff44'; effect = 'chain'; effectColor = '#ffcc00'; }
  else if (tier === 3) { color = '#88ddff'; effect = 'slow'; effectColor = '#44aaff'; }
  else if (tier === 4) { color = '#aa44ff'; effect = 'triple'; effectColor = '#ff44ff'; }
  else { color = '#4422aa'; effect = 'blackhole'; effectColor = '#aa44ff'; }

  projectiles.push({
    x: player.x, y: player.y,
    vx: Math.cos(player.facing) * 5, vy: Math.sin(player.facing) * 5,
    size: 7, color: color, life: 55, tier: tier,
    effect: effect, effectColor: effectColor,
    onHit: function(enemy) {
      enemy.hp -= player.attack;
      enemy.hurtFlash = 15;
      enemy.retreatTimer = 30;
      spawnParticles(enemy.x, enemy.y, color, 10, 4);
      spawnText(enemy.x, enemy.y - enemy.size - 5, '-' + player.attack, color);

      if (effect === 'burn') {
        enemy.burnTimer = (enemy.burnTimer || 0) + 180;
      } else if (effect === 'slow') {
        enemy.speedMul = (enemy.speedMul || 1) * 0.5;
        enemy.slowTimer = 120;
      } else if (effect === 'chain' && tier >= 3) {
        let nearest = null, nearDist = 9999;
        for (const c of creatures) {
          if (c === enemy || c.dead) continue;
          const dd = dist(enemy, c);
          if (dd < nearDist) { nearDist = dd; nearest = c; }
        }
        if (nearest) {
          nearest.hp -= player.attack * 0.5;
          nearest.hurtFlash = 10;
          spawnParticles(nearest.x, nearest.y, color, 4, 2);
          spawnText(nearest.x, nearest.y - nearest.size - 5, '-' + Math.round(player.attack * 0.5), color);
        }
      }
      sfxAttackHit();
    }
  });
}

// ========== 诡秘系：背刺 + 毒刃 ==========
function doStealthAttack() {
  if (!player.stealthed) {
    // 进入潜行
    player.stealthed = true;
    player.stealthTimer = 30;
    player.invuln = 30;
    spawnParticles(player.x, player.y, '#aa44ff', 8, 2);
    return;
  }

  let hitCount = 0;
  const isFromStealth = true;

  for (const c of creatures) {
    if (c.dead) continue;
    const d = dist(player, c);
    if (d > player.attackRange + c.size) continue;

    let dmg = player.attack;
    if (isFromStealth) dmg *= 3;

    // 背刺判定
    const enemyFacing = c.facing || 0;
    const angleToPlayer = Math.atan2(player.y - c.y, player.x - c.x);
    let behindDiff = angleToPlayer - (enemyFacing + Math.PI);
    while (behindDiff > Math.PI) behindDiff -= Math.PI * 2;
    while (behindDiff < -Math.PI) behindDiff += Math.PI * 2;
    if (Math.abs(behindDiff) < 1.0) {
      dmg *= 2;
      spawnText(c.x, c.y - c.size - 22, '背刺!', '#ff66ff');
    }

    c.hp -= dmg;
    c.hurtFlash = 15;
    c.retreatTimer = 30;
    c.poisoned = Math.max(c.poisoned || 0, 180);

    spawnParticles(c.x, c.y, '#aa44ff', 8, 4);
    spawnParticles(c.x, c.y, '#88ff44', 6, 3);
    spawnText(c.x, c.y - c.size - 5, '-' + Math.round(dmg), '#ff66ff');
    if (isFromStealth) spawnText(c.x, c.y - c.size - 22, '潜行!', '#aa44ff');
    hitCount++;
  }

  player.stealthed = false;
  player.stealthTimer = 0;
  if (hitCount > 0) { sfxAttackHit(); triggerShake(2); }
}

// ========== 腐化系：腐化之息 + DOT ==========
function doCorruptAttack() {
  const angle = player.facing;
  const spread = 1.5;

  // 毒雾扇形
  drawAttackArc(angle, spread, player.attackRange + 20, 'rgba(136,255,68,0.3)');

  let hitCount = 0;
  for (const c of creatures) {
    if (c.dead) continue;
    const d = dist(player, c);
    if (d > player.attackRange + c.size) continue;

    const overlap = d < (player.size + c.size) * 0.3;
    if (!overlap) {
      const enemyAngle = Math.atan2(c.y - player.y, c.x - player.x);
      let ad = enemyAngle - angle;
      while (ad > Math.PI) ad -= Math.PI * 2;
      while (ad < -Math.PI) ad += Math.PI * 2;
      if (Math.abs(ad) > spread / 2) continue;
    }

    c.hp -= player.attack * 0.5;
    c.hurtFlash = 15;
    c.retreatTimer = 45;
    c.corruptLayers = Math.min((c.corruptLayers || 0) + 1, 5);
    c.corruptTimer = 300;

    spawnParticles(c.x, c.y, '#88ff44', 6, 2);
    spawnParticles(c.x, c.y, '#44aa22', 4, 2);
    spawnText(c.x, c.y - c.size - 5, '-' + Math.round(player.attack * 0.5), '#88ff44');
    hitCount++;
  }

  if (hitCount > 0) sfxAttackHit();
}

// ========== 晶体系：棱镜光束（穿透） ==========
function doCrystalAttack() {
  const angle = player.facing;
  const tier = player.bodyType ? (BODY_DEFS[player.bodyType]?.tier || 1) : 1;
  const beamCount = tier <= 1 ? 1 : (tier <= 3 ? 3 : (tier <= 4 ? 5 : 7));

  for (let b = 0; b < beamCount; b++) {
    const beamAngle = angle + (b - (beamCount - 1) / 2) * 0.15;
    const endX = player.x + Math.cos(beamAngle) * player.attackRange * 2;
    const endY = player.y + Math.sin(beamAngle) * player.attackRange * 2;
    const sx = player.x - camera.x;
    const sy = player.y - camera.y;
    const ex = endX - camera.x;
    const ey = endY - camera.y;

    // 画光束
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = b % 2 === 0 ? '#88ccff' : '#ffffff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(Math.floor(sx), Math.floor(sy));
    ctx.lineTo(Math.floor(ex), Math.floor(ey));
    ctx.stroke();
    // 光束内芯
    ctx.globalAlpha = 0.4;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.floor(sx), Math.floor(sy));
    ctx.lineTo(Math.floor(ex), Math.floor(ey));
    ctx.stroke();
    ctx.restore();

    // 检测命中
    for (const c of creatures) {
      if (c.dead) continue;
      const d = distToLine(c.x, c.y, player.x, player.y, endX, endY);
      if (d > c.size + 5) continue;

      c.hp -= player.attack;
      c.hurtFlash = 15;
      c.retreatTimer = 45;
      c.crystallized = 120;

      spawnParticles(c.x, c.y, '#ffffff', 4, 3);
      spawnParticles(c.x, c.y, '#88ccff', 4, 3);
      spawnText(c.x, c.y - c.size - 5, '-' + player.attack, '#88ccff');
    }
  }

  sfxAttackHit();
  triggerShake(2);
}

// ========== 子弹系统更新 ==========
function updateProjectiles(dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt;

    let hit = false;
    for (const c of creatures) {
      if (c.dead) continue;
      if (dist(p, c) < p.size + c.size) {
        if (p.onHit) p.onHit(c);
        hit = true;
        break;
      }
    }

    if (hit || p.life <= 0 || p.x < 0 || p.x > WORLD_W || p.y < 0 || p.y > WORLD_H) {
      if (hit) spawnParticles(p.x, p.y, p.color, 4, 2);
      projectiles.splice(i, 1);
    } else {
      spawnParticles(p.x, p.y, p.color, 1, 0.5);
    }
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    const px = p.x - camera.x;
    const py = p.y - camera.y;
    ctx.save();
    ctx.globalAlpha = p.life / 55;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(px - p.size), Math.floor(py - p.size), p.size * 2, p.size * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.floor(px - p.size / 2), Math.floor(py - p.size / 2), p.size, p.size);
    ctx.restore();
  }
}

// ========== 辅助函数 ==========
// 计算点到线段的距离
function distToLine(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  const t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// 画扇形攻击特效
function drawAttackArc(angle, spread, range, color) {
  const px = player.x - camera.x;
  const py = player.y - camera.y;
  ctx.save();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(px, py);
  ctx.arc(px, py, range, angle - spread / 2, angle + spread / 2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function updateCreatures(dt) {
  for (const c of creatures) {
    if (c.dead) continue;
    c.hurtFlash = Math.max(0, c.hurtFlash - dt);
    c.stunned = Math.max(0, c.stunned - dt);
    c.attackCd = Math.max(0, c.attackCd - dt);
    c.retreatTimer = Math.max(0, c.retreatTimer - dt);

    if (c.poisoned > 0) {
      c.poisoned -= dt;
      if (Math.random() < 0.1) {
        c.hp -= 0.5;
        spawnParticles(c.x, c.y, '#aa66ff', 2, 1);
      }
    }

    // 燃烧 DOT（灵能火焰）
    if ((c.burnTimer || 0) > 0) {
      c.burnTimer -= dt;
      if (Math.random() < 0.08) {
        c.hp -= 0.8;
        spawnParticles(c.x, c.y, '#ff4400', 2, 1);
      }
      if (c.burnTimer <= 0) c.burnTimer = 0;
    }

    // 减速效果（灵能冰霜 / 晶体）
    if ((c.slowTimer || 0) > 0) {
      c.slowTimer -= dt;
      if (c.slowTimer <= 0) { c.speedMul = 1; c.slowTimer = 0; }
    }

    // 腐化 DOT（腐化系）
    if ((c.corruptTimer || 0) > 0) {
      c.corruptTimer -= dt;
      if (Math.random() < 0.06 && (c.corruptLayers || 0) > 0) {
        c.hp -= c.corruptLayers * 0.3;
        spawnParticles(c.x, c.y, '#88ff44', 2, 1);
      }
      if (c.corruptTimer <= 0) { c.corruptLayers = 0; c.corruptTimer = 0; }
    }

    // 结晶效果（晶体系）
    if ((c.crystallized || 0) > 0) {
      c.crystallized -= dt;
      if (c.crystallized <= 0) c.crystallized = 0;
    }

    const d = dist(c, player);
    const personality = c.type.personality;
    const dm = c.detectMul || 1;
    const playerDm = player.detectMul || 1; // apex_hunter 设置的玩家侦测倍率

    // ---- 根据性格确定侦测范围与行为 ----
    // 基础侦测距离（缩小）：胆小生物老远就会看到你并跑；凶猛生物也不会隔屏就冲
    let detectRange, attackRange;
    if (personality === 'scared') {
      detectRange = (player.stealth ? 70 : 150) * dm / playerDm;
      attackRange = 0;
    } else if (personality === 'neutral') {
      detectRange = (player.stealth ? 50 : 110) * dm / playerDm;
      attackRange = c.size + 24;
    } else if (personality === 'aggressive') {
      detectRange = (player.stealth ? 80 : 170) * dm / playerDm;
      attackRange = c.size + 28;
    } else {
      // boss
      detectRange = (player.stealth ? 200 : 280) * dm / playerDm;
      attackRange = c.size + 20;
    }

    if (c.stunned <= 0) {
      // 受击后退：所有生物被攻击后都会短暂退避（包括 Boss）
      if (c.retreatTimer > 0) {
        const backX = (c.x - player.x) / (d + 0.01);
        const backY = (c.y - player.y) / (d + 0.01);
        const retreatMul = personality === 'boss' ? 0.05 : 0.15;
        c.vx += backX * c.type.speed * retreatMul;
        c.vy += backY * c.type.speed * retreatMul;
      } else if (d < detectRange) {
        const spd = c.type.speed;
        const dx = (player.x - c.x) / d;
        const dy = (player.y - c.y) / d;

        if (personality === 'scared') {
          // 胆小 —— 逃离玩家
          c.vx -= dx * spd * 0.35;
          c.vy -= dy * spd * 0.35;
        } else if (personality === 'neutral') {
          // 中性 —— 只有玩家非常近才反击，否则保持观望/慢慢靠近
          if (d < attackRange * 0.9) {
            c.vx += dx * spd * 0.2;
            c.vy += dy * spd * 0.2;
          } else {
            // 慢悠悠游荡（更频繁+更快+微偏转）
            c.aiTimer -= dt;
            if (c.aiTimer <= 0) {
              c.aiTimer = rand(30, 90);
              const s = c.type.speed * 0.6;
              const ang = Math.random() * Math.PI * 2;
              c.vx = Math.cos(ang) * s;
              c.vy = Math.sin(ang) * s;
            } else if (Math.random() < 0.02) {
              const ang = Math.atan2(c.vy, c.vx) + (Math.random() - 0.5) * 0.5;
              const s = Math.hypot(c.vx, c.vy);
              if (s > 0) {
                c.vx = Math.cos(ang) * s;
                c.vy = Math.sin(ang) * s;
              }
            }
          }
        } else if (personality === 'aggressive') {
          // 凶猛 —— 追击并攻击
          c.vx += dx * spd * 0.32;
          c.vy += dy * spd * 0.32;
        } else {
          // ===== Boss AI: 巡逻 / 追击 / 冲锋 =====
          // Boss 在激活范围外: 慢速巡逻
          if (d >= 500) {
            c.aiTimer -= dt;
            if (c.aiTimer <= 0) {
              c.aiTimer = rand(90, 180);
              const ps = c.type.speed * 0.35;
              c.vx = rand(-ps, ps);
              c.vy = rand(-ps, ps);
            }
            // 保持面向玩家（但不走）
            c.facing = Math.atan2(player.y - c.y, player.x - c.x);
          } else {
            // 500px 内: 激活追击（速度降低）
            const chaseSpd = c.type.speed * 0.7;

            // 冲锋冷却中: 减速移动
            if (c.chargeCooldown > 0) {
              c.vx += dx * chaseSpd * 0.1;
              c.vy += dy * chaseSpd * 0.1;
            }

            // 冲锋持续中: 高速冲向玩家
            if (c.chargeDur > 0) {
              c.chargeDur = Math.max(0, c.chargeDur - dt);
              c.isCharging = true;
              c.vx += dx * chaseSpd * 3;
              c.vy += dy * chaseSpd * 3;
            } else {
              c.isCharging = false;
              // 正常追击（速度降低）
              c.vx += dx * chaseSpd * 0.2;
              c.vy += dy * chaseSpd * 0.2;
            }

            // 冲锋计时: 每 5 秒 (300帧) 触发一次冲锋（降低频率）
            if (c.chargeDur <= 0 && c.chargeCooldown <= 0) {
              c.chargeTimer = Math.max(0, c.chargeTimer - dt);
              if (c.chargeTimer <= 0) {
                // 触发冲锋: 持续 20 帧
                c.chargeDur = 20;
                c.chargeTimer = 300; // 重置 5 秒计时
                c.chargeCooldown = 0;
              }
            } else if (c.chargeDur <= 0) {
              // 冲锋结束后的 2 秒冷却
              c.chargeCooldown = Math.max(0, c.chargeCooldown - dt);
            }

            c.walkTimer += dt;
            if (c.walkTimer > 8) {
              c.walkTimer = 0;
              c.walkFrame = (c.walkFrame + 1) % 4;
            }
          }
        }

        c.walkTimer += dt;
        if (c.walkTimer > 10) {
          c.walkTimer = 0;
          c.walkFrame = (c.walkFrame + 1) % 4;
        }

        // 攻击判定：只有凶猛生物和 boss 会主动打；中性生物接触时也会被动反击一下
        if (attackRange > 0 && d < attackRange && c.attackCd <= 0 && player.invuln <= 0) {
          let willAttack = true;
          if (personality === 'neutral') willAttack = Math.random() < 0.3; // 中性生物反击概率更低
          if (willAttack) {
            // 闪避判定
            const evade = player.evade || 0;
            if (evade > 0 && Math.random() < evade) {
              spawnParticles(player.x, player.y, '#66ffcc', 8, 3);
              spawnText(player.x, player.y - 20, '闪避!', '#66ffcc');
              player.invuln = 20; // 短暂无敌
              c.attackCd = personality === 'boss' ? 130 : (personality === 'aggressive' ? 110 : 150);
            } else {
              const dmg = Math.ceil((c.atk || c.type.atk) * (player.damageMul || 1));
              player.hp -= dmg;
              player.hurtFlash = 20;
              player.invuln = 45;
              spawnParticles(player.x, player.y, '#ff4466', 8, 4);
              spawnText(player.x, player.y - 20, '-' + dmg, '#ff4466');
              sfxPlayerHurt();
              triggerShake(c.isBoss ? 6 : 4);
              c.attackCd = personality === 'boss' ? 130 : (personality === 'aggressive' ? 110 : 150);
            }
          }
        }
      } else {
        // 远处游荡（更快+更频繁转向+随机偏转）
        c.aiTimer -= dt;
        if (c.aiTimer <= 0) {
          c.aiTimer = rand(30, 90);
          const s = c.type.speed * 0.6;
          const ang = Math.random() * Math.PI * 2;
          c.vx = Math.cos(ang) * s;
          c.vy = Math.sin(ang) * s;
        } else if (Math.random() < 0.02) {
          const ang = Math.atan2(c.vy, c.vx) + (Math.random() - 0.5) * 0.5;
          const s = Math.hypot(c.vx, c.vy);
          if (s > 0) {
            c.vx = Math.cos(ang) * s;
            c.vy = Math.sin(ang) * s;
          }
        }
      }
    }

    // 阻尼（快速衰减，避免被打飞）
    c.vx *= 0.8;
    c.vy *= 0.8;
    // 分轴应用岩石碰撞，使生物能沿岩石滑动
    const nextX = c.x + c.vx;
    const resolvedX = resolveRockCollision(nextX, c.y, c.size);
    c.x = resolvedX.x;
    c.y = resolvedX.y;
    const nextY = c.y + c.vy;
    const resolvedXY = resolveRockCollision(c.x, nextY, c.size);
    c.x = resolvedXY.x;
    c.y = resolvedXY.y;
    c.x = clamp(c.x, 20, WORLD_W - 20);
    c.y = clamp(c.y, 20, WORLD_H - 20);

    if (c.hp <= 0 && !c.dead) {
      c.dead = true;
      c.fuseTimer = 180; // 3 秒后可融合闪烁期 (60fps 单位)
      player.kills++;
      spawnParticles(c.x, c.y, c.type.color, 20, 4);
      spawnParticles(c.x, c.y, '#ffff88', 12, 5);
      sfxEnemyDeath();

      // ---- 连杀 combo 系统 ----
      player.comboTimer = 90; // 1.5 秒
      player.combo = (player.combo || 0) + 1;
      // combo 奖励: 每层 +3% DNA，上限 5 层 (最多 +15%)
      const comboLayers = Math.min(player.combo - 1, 5);
      const comboBonus = comboLayers > 0 ? Math.ceil(c.type.dna * 0.03 * comboLayers) : 0;

      if (c.isBoss) {
        player.dna += c.type.dna + comboBonus;
        // 每击杀 +0.5 攻击 +2 生命（打怪自然成长）
        player.attack += 0.5;
        player.maxHp += 2;
        player.hp = Math.min(player.hp + 2, player.maxHp);
        // Boss 死亡特效: 40 金色粒子 + 25 紫色粒子爆发 + 剧烈屏幕震动
        spawnParticles(c.x, c.y, '#ffdd44', 40, 6);
        spawnParticles(c.x, c.y, '#aa44ff', 25, 5);
        triggerShake(12);
        spawnText(c.x, c.y - c.size - 30, '+' + c.type.dna + ' DNA', '#ffdd00');
        spawnText(c.x, c.y - c.size - 48, '+' + (comboBonus > 0 ? comboBonus + ' (x' + player.combo + ')' : ''), '#ff8800');
        flashMessage('击败 ' + c.type.name + '! +' + c.type.dna + ' DNA');
        // Boss 20 秒后刷新
        bossRespawnTimer = 1200; // 20 秒 (60fps)
        // Boss 也进入融合流程（按 F 选择性状）
        fusionPending = { creature: c };
        flashMessage('按 F 融合 ' + c.type.name);
      } else {
        player.dna += c.type.dna + comboBonus;
        // 每击杀 +0.5 攻击 +2 生命（打怪自然成长）
        player.attack += 0.5;
        player.maxHp += 2;
        player.hp = Math.min(player.hp + 2, player.maxHp);
        if (comboBonus > 0) spawnText(c.x, c.y - c.size - 24, '🔥' + player.combo + 'x! +' + comboBonus, '#ff8800');
        fusionPending = { creature: c };
        flashMessage('按 F 融合 ' + c.type.name);
      }
    }

    // ---- 死亡生物: 倒计时 fuseTimer ----
    if (c.dead && c.fuseTimer > 0) {
      c.fuseTimer -= 1;
    }
  }

  // ---- 从数组移除 fuseTimer 到期且未融合的死亡敌人 ----
  creatures = creatures.filter(c => !c.dead || (fusionPending && fusionPending.creature === c) || c.fuseTimer > 0);

  // ---- 连杀 combo 倒计时 ----
  if (player.comboTimer > 0) {
    player.comboTimer--;
    if (player.comboTimer <= 0) {
      player.combo = 0;
    }
  }

  // ---- 极小敌人 (体型 < 玩家25%) 靠近时秒杀 ----
  const tinyThreshold = player.size * 0.25;
  for (const c of creatures) {
    if (c.dead) continue;
    if (c.size < tinyThreshold) {
      const d = Math.hypot(c.x - player.x, c.y - player.y);
      if (d < player.size + c.size + 5) {
        c.hp = 0; // 触发死亡
      }
    }
  }

  // 生成新生物 (降低频率和上限)
  if (creatures.filter(c => !c.dead).length < 12 && Math.random() < 0.005) {
    const type = CREATURE_TYPES[Math.floor(Math.random() * CREATURE_TYPES.length)];
    let x, y, tries = 0;
    do {
      x = Math.random() * WORLD_W;
      y = Math.random() * WORLD_H;
      tries++;
    } while (dist({x, y}, player) < 500 && tries < 20);
    if (tries < 20) creatures.push(spawnCreature(type, x, y));
  }
}

function tryFusion() {
  if (!fusionPending || gameState !== 'playing') return;
  if (player.evolveCd > 0) {
    flashMessage('进化冷却中... ' + Math.ceil(player.evolveCd / 60) + 's');
    return;
  }
  showFusionModal(fusionPending.creature);
}

function applyTrait(traitKey) {
  const t = TRAIT_DEFS[traitKey];
  if (!t) return;
  player.evolveCd = 180; // 融合冷却 3 秒
  player.fusionCount++;

  // === 仅应用特殊效果标志（无任何攻击/血量/范围数值加成） ===
  // 玩家属性 (攻击/生命) 由打怪自然成长 +0.5/+2，与融合/进化无关
  switch (traitKey) {
    case 'regen':    player.regen += 1; break;          // 持续回血
    case 'venom':    player.venom = true; break;        // 攻击附加中毒
    case 'flame':    player.burn = true; break;          // 攻击附加灼烧 DOT
    case 'electric': player.stun = true; break;          // 攻击概率麻痹
    case 'stealth':  player.stealth = true; break;       // 降低被敌人侦测
    case 'tough':    player.damageMul = 0.85; break;     // 减伤 15%
    case 'big':      player.sizeMul *= 1.15; break;       // 仅变大
    case 'fast':     player.speedMul = Math.min(1.5, player.speedMul * 1.15); break; // 移动速度 +15%
    case 'sharp':    player.doubleHit = 0.2; break;        // 20% 概率二连击
    case 'agile':    player.evade = 0.25; break;            // 25% 概率闪避伤害
  }

  // 记录累计 trait 点数（驱动视觉层叠加：尾迹/甲壳/尖刺/火焰粒子等）
  if (player.traitPoints.hasOwnProperty(traitKey)) {
    player.traitPoints[traitKey]++;
  }
  if (!player.traits.includes(traitKey)) {
    player.traits.push(traitKey);
  }

  // DNA 在击杀时已获得，这里只加少量
  player.dna += 5;
  spawnParticles(player.x, player.y, t.color, 30, 5);
  flashMessage('融合! 获得 ' + t.name);
  sfxFusion();
  fusionPending = null;
}

// ---------- 突破进化特质定义 ----------
// 突破 = 融合次数为 3 的倍数时触发；金色版本强化版（仍是特效挂件，无攻击/生命加成）
const BREAKTHROUGH_TRAITS = {
  dash_master: { name: '瞬步精通', icon: '⚡', desc: '移动速度+25%，冲刺冷却-40%', color: '#ffff44',
    apply: s => { s.speedMul = Math.min(1.8, s.speedMul * 1.25); s.dashCdMul = 0.6; } },
  iron_skin:   { name: '铁壁之躯', icon: '🛡️', desc: '受到伤害减少50%', color: '#aaccff',
    apply: s => { s.damageMul = 0.5; } },
  vorpal:      { name: '剧毒之噬', icon: '☠️', desc: '攻击必定附加剧毒', color: '#aa66ff',
    apply: s => { s.venom = true; /* traitPoints.venom += 2 */ } },
  apex_hunter: { name: '猎手本能', icon: '🦅', desc: '敌人侦测范围缩小50%', color: '#ff8844',
    apply: s => { s.detectMul = 2; } },
  osmotic:     { name: '渗透再生', icon: '💚', desc: '生命恢复速度翻倍', color: '#44ffaa',
    apply: s => { s.regen += 1; /* traitPoints.regen += 2 */ } },
};

function showFusionModal(creature) {
  gameState = 'fusion';
  const type = creature.type;
  const traits = type.traits;
  const modal = document.getElementById('modal');
  const content = document.getElementById('modal-content');

  // 判断是否为突破进化: 每 3 次融合触发一次 (fusionCount 自增后 % 3 === 0)
  // 当前 fusionCount 是尚未自增的"已融合次数"，下次完成后会变成 fusionCount+1
  // 因此 (fusionCount + 1) % 3 === 0 ⇒ 即 fusionCount % 3 === 2
  const isBreakthrough = ((player.fusionCount + 1) % 3) === 0;
  if (isBreakthrough) {
    player.breakthroughCount++;
    // fusionCount 由 chooseTrait/applyTrait 统一处理
  }

  const breakthroughOptions = isBreakthrough ? Object.keys(BREAKTHROUGH_TRAITS) : [];
  const normalTraits = traits;

  let cardClass = isBreakthrough ? 'fusion-card breakthrough' : 'fusion-card';
  let subtitle = isBreakthrough
    ? '★ 突 破 进 化 ★ · 进化冷却 ' + Math.ceil((player.evolveCd || 0) / 60) + 's 后恢复'
    : '融合 ' + (player.fusionCount + 1) + ' · 进化冷却 ' + Math.ceil((player.evolveCd || 0) / 60) + 's';

  let html = `
    <div class="${cardClass}">
      <div class="fusion-header">
        <div class="fusion-title">◆ 融 合 ◆</div>
        <div class="fusion-enemy">你击败了 <b style="color:${type.color}">${type.name}</b> · DNA +${type.dna}</div>
        <div style="text-align:center;color:${isBreakthrough ? '#ffdd00' : '#a0c0ff'};font-size:11px;margin-top:4px;letter-spacing:2px;">${subtitle}</div>
      </div>
      <div style="text-align:center;color:#a0c0ff;font-size:12px;margin-bottom:12px;">从它的 DNA 中选择一种性状融合到你体内:</div>
      <div class="trait-card">
  `;

  // 突破选项
  if (isBreakthrough) {
    for (const key of breakthroughOptions) {
      const t = BREAKTHROUGH_TRAITS[key];
      html += `
        <div class="trait-option breakthrough-option" onclick="chooseTrait('${key}', true)">
          <div class="trait-option-icon" style="color:${t.color};text-shadow:0 0 12px ${t.color};font-size:40px;">${t.icon}</div>
          <div class="trait-option-body">
            <div class="trait-option-name" style="color:${t.color};font-size:16px;">${t.name}</div>
            <div class="trait-option-desc">${t.desc}</div>
          </div>
        </div>
      `;
    }
  } else {
    for (const tk of normalTraits) {
      const t = TRAIT_DEFS[tk];
      html += `
        <div class="trait-option" onclick="chooseTrait('${tk}', false)">
          <div class="trait-option-icon" style="color:${t.color}">${t.icon}</div>
          <div class="trait-option-body">
            <div class="trait-option-name" style="color:${t.color}">${t.name}</div>
            <div class="trait-option-desc">${t.desc}</div>
          </div>
        </div>
      `;
    }
  }
  html += `</div>
    <div class="fusion-actions">
      <button class="fusion-skip" onclick="skipFusion()">跳过融合 (只吸收 DNA)</button>
    </div>
    </div>
  `;
  content.innerHTML = html;
  modal.classList.add('active');
}

function chooseTrait(key, isBreakthrough) {
  // 进化冷却: 3 秒 = 180 帧 (已由 applyTrait/set; 这里双重保险)
  player.evolveCd = 180;
  if (!isBreakthrough) {
    // applyTrait 内部处理 fusionCount++ 和 evolveCd
    applyTrait(key);
  } else {
    player.fusionCount++; // breakthrough 也计入融合次数
    const t = BREAKTHROUGH_TRAITS[key];
    if (t) {
      t.apply(player);
      // 突破 trait 映射到视觉点数
      const pointMap = { dash_master:'fast', iron_skin:'tough', vorpal:'sharp',
                         apex_hunter:'fast', osmotic:'regen' };
      const pt = pointMap[key];
      if (pt && player.traitPoints.hasOwnProperty(pt)) {
        player.traitPoints[pt] += 2; // 突破 trait 算 2 点
      }
      if (!player.traits.includes('bt_' + key)) {
        player.traits.push('bt_' + key);
      }
      spawnParticles(player.x, player.y, t.color, 40, 6);
      flashMessage('突破! 获得 ' + t.name);
      sfxFusion();
    }
  }
  fusionPending = null;
  closeModal();
}

function skipFusion() {
  player.dna += fusionPending.creature.type.dna;
  player.fusionCount++;
  fusionPending = null;
  closeModal();
  flashMessage('吸收了 DNA');
}


function closeModal() {
  document.getElementById('modal').classList.remove('active');
  gameState = 'playing';
}

function checkStage() {
  if (gameState !== 'playing') return;
  if (evolutionPickingActive) return;
  const targetEvolutions = Math.floor(player.dna / 200);
  if (targetEvolutions > player.evolutionCount) {
    flashMessage('✦ 进化条件达成！当前 DNA ' + player.dna + '，选择新形态');
    showEvolutionPicker();
  }
}

function showStageUpgrade(stageInfo) {
  const el = document.getElementById('stage-flash');
  const title = document.getElementById('stage-flash-title');
  const sub = document.getElementById('stage-flash-sub');
  title.textContent = '◈ 进 化 ' + stageInfo.name + ' ◈';
  title.style.color = stageInfo.color;
  sub.textContent = stageInfo.desc || ('阶段 ' + (player.stage + 1) + ' · 获得更强力量');
  el.classList.add('show');
  setTimeout(() => {
    el.classList.remove('show');
  }, 2500);
}

function updateParticles(dt) {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.92;
    p.vy *= 0.92;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function updateFloatingTexts(dt) {
  for (const t of floatingTexts) {
    t.y -= 0.8;
    t.life -= dt;
  }
  floatingTexts = floatingTexts.filter(t => t.life > 0);
}

// ---------- 渲染 ----------
function draw() {
  ctx.fillStyle = '#0a1528';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(shakeState.x, shakeState.y);

  drawGround();
  drawPlankton();
  drawRocks();
  drawFood();
  drawDashTrail(); // 冲刺拖尾
  drawCreatures();
  drawPlayer();
  drawProjectiles();
  drawParticles();
  drawFloatingTexts();

  if (gameState === 'playing' || gameState === 'fusion') drawAttackArc();

  ctx.restore();

  // ===== Boss 屏幕反馈 =====
  const boss = creatures.find(c => c.isBoss && !c.dead);
  if (boss) {
    const bd = Math.hypot(boss.x - player.x, boss.y - player.y);
    // 红色边缘渐变 (越近越红)
    if (bd < 600) {
      const intensity = clamp(1 - bd / 600, 0, 1);
      const grad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(1, `rgba(180,0,0,${intensity * 0.45})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }
    // 底部警告脉冲文字
    ctx.save();
    const pulse = Math.abs(Math.sin(gameTime * 0.08));
    ctx.globalAlpha = 0.7 + pulse * 0.3;
    ctx.fillStyle = '#ff2222';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 10 + pulse * 8;
    ctx.fillText('⚠ 深渊巨兽正在靠近 ⚠', W / 2, H - 30);
    ctx.restore();
  }
}

function drawGround() {
  // 使用 200x200 色块，做深浅分层模拟水下光影
  const tileSize = BG_TILE;
  const camX = camera.x;
  const camY = camera.y;
  const offsetX = -((camX % tileSize) + tileSize) % tileSize;
  const offsetY = -((camY % tileSize) + tileSize) % tileSize;

  // 只绘制屏幕可见范围内的 tile
  const startCX = Math.floor((camX + offsetX) / tileSize) - 1;
  const endCX = Math.ceil((camX + W) / tileSize) + 1;
  const startCY = Math.floor((camY + offsetY) / tileSize) - 1;
  const endCY = Math.ceil((camY + H) / tileSize) + 1;

  // 基础深海色 (先填一层)
  ctx.fillStyle = '#132036';
  ctx.fillRect(offsetX, offsetY, (endCX - startCX) * tileSize + 4, (endCY - startCY) * tileSize + 4);

  for (let cx = startCX; cx < endCX; cx++) {
    for (let cy = startCY; cy < endCY; cy++) {
      // 基于 tile 坐标的确定性散列
      const hash = ((cx * 73856093) ^ (cy * 19349663)) >>> 0;
      // 基础深度: 上方较亮 (浅水区), 下方较暗 (深水区)
      const depthFactor = clamp(((cy / ((WORLD_H / tileSize) || 1)) * 0.6 + (hash & 15) / 40), 0, 1);
      // 色彩在青蓝到暗蓝之间变化
      const r = Math.floor(18 + depthFactor * 8 + (hash & 7));
      const g = Math.floor(45 + (1 - depthFactor) * 20 + ((hash >> 3) & 7));
      const b = Math.floor(80 + (1 - depthFactor) * 30 + ((hash >> 6) & 15));
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';

      const screenX = cx * tileSize - camX;
      const screenY = cy * tileSize - camY;
      ctx.fillRect(Math.floor(screenX), Math.floor(screenY), tileSize, tileSize);

      // 偶尔在 tile 上画暗斑/亮斑，模拟光影
      const speckle = hash & 63;
      if (speckle < 8) {
        // 较亮的光柱斑点
        ctx.fillStyle = 'rgba(120, 190, 220, 0.07)';
        ctx.fillRect(Math.floor(screenX + (hash % 140)), Math.floor(screenY + ((hash >> 4) % 160)), 30, 60);
      } else if (speckle > 58) {
        // 暗区
        ctx.fillStyle = 'rgba(8, 20, 40, 0.35)';
        ctx.fillRect(Math.floor(screenX + ((hash >> 7) % 120)), Math.floor(screenY + ((hash >> 10) % 150)), 60, 40);
      }
    }
  }

  // 边界
  ctx.strokeStyle = '#4a6aaa';
  ctx.lineWidth = 4;
  ctx.strokeRect(-camera.x, -camera.y, WORLD_W, WORLD_H);
}

// 绘制岩石障碍 (屏幕裁剪)
function drawRocks() {
  const margin = 60;
  for (const rc of rockClusters) {
    const sx = rc.x - camera.x;
    const sy = rc.y - camera.y;
    if (sx < -margin || sx > W + margin || sy < -margin || sy > H + margin) continue;
    // 岩石主体
    drawPixelCircle(sx, sy, rc.r, '#3a2a1c', '#1a1208');
    // 上部高光 (从上方打光)
    drawPixelCircle(sx - rc.r * 0.25, sy - rc.r * 0.35, rc.r * 0.45, '#5a4430', '#3a2a1c');
    // 顶部亮点 (像素化)
    ctx.fillStyle = '#7a6450';
    ctx.fillRect(Math.floor(sx - rc.r * 0.3), Math.floor(sy - rc.r * 0.5), 4, 4);
    ctx.fillRect(Math.floor(sx - rc.r * 0.05), Math.floor(sy - rc.r * 0.55), 3, 3);
    // 底部暗色苔藓
    ctx.fillStyle = '#2a5a3a';
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      ctx.fillRect(Math.floor(sx + Math.cos(a) * rc.r * 0.7 - 2), Math.floor(sy + Math.sin(a) * rc.r * 0.7), 4, 3);
    }
  }
}

// 绘制食物颗粒 (脉动, 屏幕裁剪)
function drawFood() {
  for (const f of foodParticles) {
    const sx = f.x - camera.x;
    const sy = f.y - camera.y;
    if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) continue;
    // 脉动缩放
    const pulse = 1 + Math.sin(gameTime * 0.12 + f.phase) * 0.25;
    const r = f.size * pulse;
    // 外晕
    ctx.fillStyle = 'rgba(120, 255, 160, 0.3)';
    ctx.fillRect(Math.floor(sx - r - 1), Math.floor(sy - r - 1), Math.floor(r * 2 + 2), Math.floor(r * 2 + 2));
    // 主绿
    ctx.fillStyle = '#44cc66';
    ctx.fillRect(Math.floor(sx - r), Math.floor(sy - r), Math.floor(r * 2), Math.floor(r * 2));
    // 高光
    ctx.fillStyle = '#99ffaa';
    ctx.fillRect(Math.floor(sx - r + 1), Math.floor(sy - r + 1), 2, 2);
  }
}

// 绘制浮游微粒 (缓慢上浮, 独立于食物/粒子)
function drawPlankton() {
  for (const p of plankton) {
    const sx = p.x - camera.x;
    const sy = p.y - camera.y;
    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
    const twinkle = 0.6 + Math.sin(gameTime * 0.08 + p.phase) * 0.4;
    ctx.globalAlpha = twinkle;
    if (p.kind === 'green') {
      ctx.fillStyle = '#88ffaa';
    } else if (p.kind === 'yellow') {
      ctx.fillStyle = '#ffee88';
    } else {
      ctx.fillStyle = '#ffffff';
    }
    ctx.fillRect(Math.floor(sx), Math.floor(sy), p.size, p.size);
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  const px = player.x - camera.x;
  const py = player.y - camera.y;
  const bob = Math.sin(player.walkFrame * Math.PI / 2) * 1.2;
  const bodyY = py + bob;

  // === morphType 驱动的进化过渡动画 ===
  if (player.morphProgress > 0 && player.morphType) {
    ctx.save();
    const morphAlpha = player.morphProgress / 35;
    const morphPhase = (35 - player.morphProgress) / 35; // 0→1 表示动画进程
    const shakeX = (Math.random() - 0.5) * (player.morphType === 'predator' ? 8 : 3);
    const shakeY = (Math.random() - 0.5) * (player.morphType === 'predator' ? 8 : 3);

    if (player.morphType === 'predator') {
      // 撕裂：红色闪烁 + 身体颤抖
      ctx.fillStyle = '#ff2200';
      ctx.globalAlpha = morphAlpha * 0.8;
      ctx.fillRect(Math.floor(px + shakeX - 20), Math.floor(bodyY + shakeY - 20), 40, 40);
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = morphAlpha * 0.6;
      ctx.fillRect(Math.floor(px + shakeX - 10), Math.floor(bodyY + shakeY - 10), 20, 20);
    } else if (player.morphType === 'armor') {
      // 装甲合体：金色光芒聚集
      const glowR = 30 + morphPhase * 20;
      const grad = ctx.createRadialGradient(px, bodyY, 0, px, bodyY, glowR);
      grad.addColorStop(0, 'rgba(255,204,68,' + morphAlpha * 0.9 + ')');
      grad.addColorStop(0.5, 'rgba(255,180,50,' + morphAlpha * 0.5 + ')');
      grad.addColorStop(1, 'rgba(200,150,50,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(px - glowR, bodyY - glowR, glowR * 2, glowR * 2);
      // 金属碎片旋转
      ctx.globalAlpha = morphAlpha;
      for (let i = 0; i < 6; i++) {
        const ang = gameTime * 0.15 + (i / 6) * Math.PI * 2;
        const sx = px + Math.cos(ang) * (40 - morphPhase * 30);
        const sy = bodyY + Math.sin(ang) * (40 - morphPhase * 30);
        ctx.fillStyle = '#ffcc44';
        ctx.fillRect(Math.floor(sx - 4), Math.floor(sy - 4), 8, 8);
      }
    } else if (player.morphType === 'psychic') {
      // 元素爆发：旋转光环
      ctx.globalAlpha = morphAlpha * 0.8;
      const ringColors = ['#ff8800', '#ffff44', '#88ddff'];
      for (let ring = 0; ring < 3; ring++) {
        ctx.strokeStyle = ringColors[ring];
        ctx.lineWidth = 3;
        const r = 25 + ring * 15 - morphPhase * 20;
        ctx.beginPath();
        ctx.arc(px, bodyY, r, gameTime * 0.1 + ring, gameTime * 0.1 + ring + Math.PI * 1.5);
        ctx.stroke();
      }
    } else if (player.morphType === 'stealth') {
      // 幻影隐现：淡入淡出
      ctx.globalAlpha = 0.2 + morphPhase * 0.3;
      ctx.fillStyle = '#aa44ff';
      ctx.fillRect(Math.floor(px - 15), Math.floor(bodyY - 15), 30, 30);
      ctx.globalAlpha = 0.1 + morphPhase * 0.2;
      ctx.fillStyle = '#ff66ff';
      ctx.beginPath();
      ctx.arc(px, bodyY, 20 + morphPhase * 10, 0, Math.PI * 2);
      ctx.fill();
    } else if (player.morphType === 'corrupt') {
      // 畸形膨胀
      const swell = 1 + morphPhase * 0.4;
      ctx.globalAlpha = morphAlpha * 0.7;
      ctx.fillStyle = '#88ff44';
      ctx.beginPath();
      ctx.arc(px, bodyY, 18 * swell, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#44aa22';
      ctx.globalAlpha = morphAlpha * 0.5;
      ctx.beginPath();
      ctx.arc(px + 5, bodyY - 3, 6 * swell, 0, Math.PI * 2);
      ctx.fill();
    } else if (player.morphType === 'crystal') {
      // 结晶闪光
      const flash = morphPhase < 0.5 ? (0.5 - morphPhase) * 2 : 0;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = `rgba(255,255,255,${flash + morphPhase * 0.5})`;
      ctx.fillRect(px - 30, bodyY - 30, 60, 60);
      // 菱形碎片
      ctx.globalAlpha = morphAlpha * 0.8;
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const dist = 25 + Math.sin(gameTime * 0.2 + i) * 5;
        const sx = px + Math.cos(ang) * dist;
        const sy = bodyY + Math.sin(ang) * dist;
        ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#88ccff';
        ctx.fillRect(Math.floor(sx - 3), Math.floor(sy - 3), 6, 6);
      }
    }
    ctx.restore();
    // 过渡动画期间不绘制原形态（等待 morphProgress 结束）
    if (player.morphProgress > 10) return;
  }

  if (!player.bodyType) {
    ctx.save();
    if (player.hurtFlash > 0 && Math.floor(player.hurtFlash / 3) % 2 === 0) ctx.globalAlpha = 0.5;
    if (player.invuln > 0 && player.hurtFlash <= 0 && Math.floor(player.invuln / 3) % 2 === 0) ctx.globalAlpha = 0.7;
    if (player.dashDur > 0) { ctx.shadowColor = '#88ffff'; ctx.shadowBlur = 20; }
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(px - 12, py + 14, 24, 4);
    drawPixelCircle(px, bodyY, player.size * player.sizeMul, '#88ffff', '#448888');
    ctx.fillStyle = '#000';
    ctx.fillRect(px - 6 + Math.cos(player.facing) * 2, bodyY - 2 + Math.sin(player.facing) * 2, 3, 3);
    ctx.fillRect(px + 3 + Math.cos(player.facing) * 2, bodyY - 2 + Math.sin(player.facing) * 2, 3, 3);
    ctx.restore();
    return;
  }

  drawEvolvedPlayer(px, bodyY, py);
}

function drawEvolvedPlayer(px, bodyY, py) {
  const bd = BODY_DEFS[player.bodyType];
  if (!bd) return;
  const size = bd.size * player.sizeMul;
  const col = bd.colors;

  ctx.save();
  if (player.hurtFlash > 0 && Math.floor(player.hurtFlash / 3) % 2 === 0) ctx.globalAlpha = 0.5;
  if (player.invuln > 0 && player.hurtFlash <= 0 && Math.floor(player.invuln / 3) % 2 === 0) ctx.globalAlpha = 0.7;
  if (player.dashDur > 0) { ctx.shadowColor = '#88ffff'; ctx.shadowBlur = 20; }

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(px - size * 0.7, py + size * 0.65, size * 1.4, 4);

  const glowR = size * 1.5;
  const grad = ctx.createRadialGradient(px, bodyY, 0, px, bodyY, glowR);
  grad.addColorStop(0, col.glow + '88');
  grad.addColorStop(0.6, col.glow + '22');
  grad.addColorStop(1, col.glow + '00');
  ctx.fillStyle = grad;
  ctx.fillRect(px - glowR, bodyY - glowR, glowR * 2, glowR * 2);

  const tier = bd.tier;
  const s = size;
  const facing = player.facing;

  if (bd.branch === 'predator') {
    // --- 通用基座：椭圆体 + 呼吸脉动 ---
    const breath = Math.sin(gameTime * 0.05) * 2;
    drawPixelEllipse(px, bodyY, s * 1.1, s * 0.75 + breath, col.fill, col.edge);
    drawPixelEllipse(px - 2, bodyY - s * 0.15, s * 0.35, s * 0.2, col.glow, col.fill);

    if (tier === 1) {
      // Tier 1 利齿：黄色横瞳 + 5 颗三角牙 + 4 根背棘
      // 黄色横瞳 (2x5 双眼)
      ctx.fillStyle = '#ffcc44';
      ctx.fillRect(Math.floor(px + Math.cos(facing) * s * 0.2 - 8), Math.floor(bodyY + Math.sin(facing) * s * 0.2 - 2), 5, 3);
      ctx.fillRect(Math.floor(px + Math.cos(facing) * s * 0.2 + 3), Math.floor(bodyY + Math.sin(facing) * s * 0.2 - 2), 5, 3);
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(px + Math.cos(facing) * s * 0.2 - 7), Math.floor(bodyY + Math.sin(facing) * s * 0.2 - 1), 3, 1);
      ctx.fillRect(Math.floor(px + Math.cos(facing) * s * 0.2 + 4), Math.floor(bodyY + Math.sin(facing) * s * 0.2 - 1), 3, 1);
      // 5 颗三角牙（朝 facing 方向）
      const mouthX = px + Math.cos(facing) * s * 0.75;
      const mouthY = bodyY + Math.sin(facing) * s * 0.75;
      const perpX = -Math.sin(facing);
      const perpY = Math.cos(facing);
      for (let ti = 0; ti < 5; ti++) {
        const off = (ti - 2) * 4;
        const tx = mouthX + perpX * off;
        const ty = mouthY + perpY * off;
        ctx.fillStyle = '#ffeecc';
        ctx.fillRect(Math.floor(tx - 2), Math.floor(ty - 2), 4, 4);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(tx - 1), Math.floor(ty - 1), 2, 2);
      }
      // 4 根背棘（顶部）
      for (let si = 0; si < 4; si++) {
        const sox = (si - 1.5) * s * 0.22;
        ctx.fillStyle = '#ff8844';
        ctx.fillRect(Math.floor(px + sox - 2), Math.floor(bodyY - s * 0.8), 4, 6);
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(px + sox - 1), Math.floor(bodyY - s * 0.8 - 3), 2, 3);
      }
    } else if (tier === 2) {
      // Tier 2 猎杀：鳃裂呼吸开合 + 背鳍序列 4 片 + 扇形尾鳍
      // 鳃裂 (facing 左右两侧)
      const gillOn = (Math.floor(gameTime / 25) % 2) === 0;
      const gillBaseX = px - Math.cos(facing) * s * 0.15;
      const gillBaseY = bodyY - Math.sin(facing) * s * 0.15;
      const gperpX = -Math.sin(facing);
      const gperpY = Math.cos(facing);
      for (let gi = 0; gi < 3; gi++) {
        const gOff = (gi - 1) * s * 0.18;
        const gx1 = gillBaseX + gperpX * (s * 0.4 + gOff);
        const gy1 = gillBaseY + gperpY * (s * 0.4 + gOff);
        const gx2 = gillBaseX - gperpX * (s * 0.4 + gOff);
        const gy2 = gillBaseY - gperpY * (s * 0.4 + gOff);
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(gx1 - 5), Math.floor(gy1 - 2), 10, gillOn ? 4 : 2);
        ctx.fillRect(Math.floor(gx2 - 5), Math.floor(gy2 - 2), 10, gillOn ? 4 : 2);
        if (gillOn) {
          ctx.fillStyle = '#ff6644';
          ctx.fillRect(Math.floor(gx1 - 3), Math.floor(gy1 - 1), 6, 1);
          ctx.fillRect(Math.floor(gx2 - 3), Math.floor(gy2 - 1), 6, 1);
        }
      }
      // 4 片背鳍（由前往后增大）
      for (let fi = 0; fi < 4; fi++) {
        const fox = (fi - 1.5) * s * 0.22;
        const fh = 5 + fi * 2;
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(px + fox - 3), Math.floor(bodyY - s * 0.75 - fh), 6, fh + 3);
        ctx.fillStyle = col.fill;
        ctx.fillRect(Math.floor(px + fox - 2), Math.floor(bodyY - s * 0.75 - fh + 1), 4, fh - 1);
      }
      // 扇形尾鳍（12 条辐射矩形）
      const tailX = px - Math.cos(facing) * s * 1.0;
      const tailY = bodyY - Math.sin(facing) * s * 1.0;
      for (let ri = 0; ri < 12; ri++) {
        const rAng = (ri / 11 - 0.5) * 1.6 - facing;
        const rLen = s * (0.5 + 0.3 * Math.cos((ri / 11 - 0.5) * Math.PI));
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(tailX + Math.cos(rAng) * rLen - 2), Math.floor(tailY + Math.sin(rAng) * rLen - 2), 4, 4);
        ctx.fillStyle = col.fill;
        ctx.fillRect(Math.floor(tailX + Math.cos(rAng) * rLen * 0.6 - 2), Math.floor(tailY + Math.sin(rAng) * rLen * 0.6 - 2), 4, 4);
      }
    } else if (tier === 3) {
      // Tier 3 撕裂：下颌突出 + 镰刀背棘弯曲 + 上下各 6 颗外露牙齿
      // 突出下颌（朝 facing 方向延伸）
      const jawX = px + Math.cos(facing) * s * 0.6;
      const jawY = bodyY + Math.sin(facing) * s * 0.6;
      drawPixelEllipse(jawX, jawY, s * 0.55, s * 0.35, col.fill, col.edge);
      // 上下各 6 颗外露牙齿
      const jperpX = -Math.sin(facing);
      const jperpY = Math.cos(facing);
      for (let ti = 0; ti < 6; ti++) {
        const tOff = (ti - 2.5) * 5;
        // 上牙
        const ux = jawX + jperpX * tOff + Math.cos(facing) * s * 0.35;
        const uy = jawY + jperpY * tOff + Math.sin(facing) * s * 0.35;
        // 下牙
        const lx = jawX + jperpX * tOff - Math.cos(facing) * s * 0.1;
        const ly = jawY + jperpY * tOff - Math.sin(facing) * s * 0.1;
        ctx.fillStyle = '#ffeecc';
        ctx.fillRect(Math.floor(ux - 2), Math.floor(uy - 2), 4, 5);
        ctx.fillRect(Math.floor(lx - 2), Math.floor(ly - 2), 4, 5);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(ux - 1), Math.floor(uy - 1), 2, 3);
        ctx.fillRect(Math.floor(lx - 1), Math.floor(ly - 1), 2, 3);
      }
      // 5 根镰刀状弯曲背棘
      for (let si = 0; si < 5; si++) {
        const sox = (si - 2) * s * 0.2;
        const curve = (si === 0 || si === 4) ? 2 : (si === 1 || si === 3 ? 5 : 7);
        ctx.fillStyle = '#ff8844';
        ctx.fillRect(Math.floor(px + sox - 2), Math.floor(bodyY - s * 0.85 - curve), 4, curve + 4);
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(px + sox - 1), Math.floor(bodyY - s * 0.85 - curve - 2), 2, curve + 3);
      }
      // 眼睛
      ctx.fillStyle = col.eye;
      ctx.fillRect(Math.floor(px - 6), Math.floor(bodyY - 2), 3, 3);
      ctx.fillRect(Math.floor(px + 3), Math.floor(bodyY - 2), 3, 3);
    } else if (tier === 4) {
      // Tier 4 深渊猎手：6 对附肢 + 头部扁平 + 蓝色脉动诱饵
      // 6 对附肢（围绕身体）
      for (let ai = 0; ai < 6; ai++) {
        const aAng = facing + (ai / 6) * Math.PI * 2;
        const aBaseX = px + Math.cos(aAng) * s * 0.9;
        const aBaseY = bodyY + Math.sin(aAng) * s * 0.9;
        const swing = Math.sin(gameTime * 0.08 + ai) * 4;
        for (let seg = 0; seg < 3; seg++) {
          const segX = aBaseX + Math.cos(aAng) * (seg * 4 + swing);
          const segY = aBaseY + Math.sin(aAng) * (seg * 4 + swing);
          ctx.fillStyle = col.edge;
          ctx.fillRect(Math.floor(segX - 3), Math.floor(segY - 3), 6, 6);
          ctx.fillStyle = col.fill;
          ctx.fillRect(Math.floor(segX - 2), Math.floor(segY - 2), 4, 4);
        }
      }
      // 扁平头部（沿 facing 方向拉长）
      const headX = px + Math.cos(facing) * s * 0.5;
      const headY = bodyY + Math.sin(facing) * s * 0.5;
      drawPixelEllipse(headX, headY, s * 0.7, s * 0.3, col.fill, col.edge);
      // 蓝色脉动诱饵（facing 前方 + 闪烁）
      const lureOn = (Math.floor(gameTime / 15) % 2) === 0;
      const lureX = px + Math.cos(facing) * s * 1.3;
      const lureY = bodyY + Math.sin(facing) * s * 1.3;
      if (lureOn) {
        ctx.fillStyle = '#66ccff';
        ctx.fillRect(Math.floor(lureX - 4), Math.floor(lureY - 4), 8, 8);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(lureX - 2), Math.floor(lureY - 2), 4, 4);
      } else {
        ctx.fillStyle = '#3366aa';
        ctx.fillRect(Math.floor(lureX - 3), Math.floor(lureY - 3), 6, 6);
      }
      // 两只前视眼
      ctx.fillStyle = col.eye;
      ctx.fillRect(Math.floor(headX + Math.cos(facing) * 8 - 4), Math.floor(headY + Math.sin(facing) * 8 - 2), 3, 3);
      ctx.fillRect(Math.floor(headX + Math.cos(facing) * 8 + 2), Math.floor(headY + Math.sin(facing) * 8 - 2), 3, 3);
    } else {
      // Tier 5 噬星者：三对复眼 + 12 触须独立摆动 + 星云斑点纹理
      // 三对复眼（红蓝金，每对 4 个发光方块）
      const eyeColors = ['#ff3344', '#44ccff', '#ffdd44'];
      for (let ei = 0; ei < 3; ei++) {
        const eAng = facing - Math.PI / 2 + (ei - 1) * Math.PI * 0.25;
        const eCx = px + Math.cos(eAng) * s * 0.75;
        const eCy = bodyY + Math.sin(eAng) * s * 0.75;
        for (let ej = 0; ej < 4; ej++) {
          const jAng = (ej / 4) * Math.PI * 2;
          const jx = eCx + Math.cos(jAng) * 3;
          const jy = eCy + Math.sin(jAng) * 3;
          ctx.fillStyle = eyeColors[ei];
          ctx.fillRect(Math.floor(jx - 2), Math.floor(jy - 2), 4, 4);
          const glowOn = (Math.floor(gameTime / 10 + ej) % 3) === 0;
          if (glowOn) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(Math.floor(jx - 1), Math.floor(jy - 1), 2, 2);
          }
        }
      }
      // 12 条独立摆动触须
      for (let ti = 0; ti < 12; ti++) {
        const tBaseAng = (ti / 12) * Math.PI * 2;
        for (let seg = 0; seg < 4; seg++) {
          const wave = Math.sin(gameTime * 0.1 + ti + seg * 0.5) * 5;
          const segDist = s * 0.9 + seg * 6;
          const segAng = tBaseAng + wave * 0.03;
          const segX = px + Math.cos(segAng) * segDist;
          const segY = bodyY + Math.sin(segAng) * segDist;
          ctx.fillStyle = col.fill;
          ctx.fillRect(Math.floor(segX - 3), Math.floor(segY - 3), 6, 6);
          ctx.fillStyle = col.edge;
          ctx.fillRect(Math.floor(segX - 2), Math.floor(segY - 2), 4, 4);
        }
      }
      // 16 处星云斑点纹理（围绕身体）
      for (let ni = 0; ni < 16; ni++) {
        const nAng = (ni / 16) * Math.PI * 2 + gameTime * 0.005;
        const nR = s * (0.3 + (ni % 3) * 0.15);
        const nx = px + Math.cos(nAng) * nR;
        const ny = bodyY + Math.sin(nAng) * nR;
        ctx.fillStyle = (ni % 4 === 0) ? '#ffaaff' : (ni % 4 === 1 ? '#66aaff' : (ni % 4 === 2 ? '#ffaa66' : '#ffffff'));
        const flick = (Math.floor(gameTime / 6 + ni) % 3);
        if (flick < 2) ctx.fillRect(Math.floor(nx - 1), Math.floor(ny - 1), 2, 2);
      }
    }
  } else if (bd.branch === 'armor') {
    // 基础菱形核心
    drawPixelDiamond(px, bodyY, s * 0.95, col.fill, col.edge);
    drawPixelCircle(px, bodyY, s * 0.2, col.glow, col.fill);

    if (tier === 1) {
      // Tier 1 甲壳：6 块甲板 + 深色缝隙 + 腹部淡色
      // 6 块甲板（六边形环）
      for (let pi = 0; pi < 6; pi++) {
        const pAng = (pi / 6) * Math.PI * 2;
        const ppx = px + Math.cos(pAng) * s * 0.55;
        const ppy = bodyY + Math.sin(pAng) * s * 0.55;
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(ppx - 8), Math.floor(ppy - 8), 16, 16);
        ctx.fillStyle = lightenColor(col.fill, 0.15);
        ctx.fillRect(Math.floor(ppx - 6), Math.floor(ppy - 6), 12, 12);
        ctx.fillStyle = col.glow;
        ctx.fillRect(Math.floor(ppx - 2), Math.floor(ppy - 2), 4, 4);
      }
      // 6 条深色缝隙（每两块之间）
      for (let si = 0; si < 6; si++) {
        const sAng = (si + 0.5) / 6 * Math.PI * 2;
        const spx = px + Math.cos(sAng) * s * 0.55;
        const spy = bodyY + Math.sin(sAng) * s * 0.55;
        ctx.fillStyle = '#111';
        ctx.fillRect(Math.floor(spx - 2), Math.floor(spy - 2), 4, 4);
      }
      // 眼睛
      ctx.fillStyle = col.eye;
      ctx.fillRect(Math.floor(px - 5), Math.floor(bodyY - 2), 3, 3);
      ctx.fillRect(Math.floor(px + 3), Math.floor(bodyY - 2), 3, 3);
    } else if (tier === 2) {
      // Tier 2 尖刺堡垒：金色铆钉结节 + 甲缝发光
      // 甲板块
      for (let pi = 0; pi < 8; pi++) {
        const pAng = (pi / 8) * Math.PI * 2;
        const ppx = px + Math.cos(pAng) * s * 0.7;
        const ppy = bodyY + Math.sin(pAng) * s * 0.7;
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(ppx - 10), Math.floor(ppy - 10), 20, 20);
        ctx.fillStyle = col.fill;
        ctx.fillRect(Math.floor(ppx - 8), Math.floor(ppy - 8), 16, 16);
        // 甲缝发光（每块边缘）
        const seamOn = (Math.floor(gameTime / 20 + pi) % 3) === 0;
        if (seamOn) {
          ctx.fillStyle = col.glow;
          ctx.fillRect(Math.floor(ppx - 10), Math.floor(ppy - 10), 20, 2);
          ctx.fillRect(Math.floor(ppx - 10), Math.floor(ppy + 8), 20, 2);
          ctx.fillRect(Math.floor(ppx - 10), Math.floor(ppy - 10), 2, 20);
          ctx.fillRect(Math.floor(ppx + 8), Math.floor(ppy - 10), 2, 20);
        }
      }
      // 8 个金色铆钉结节（尖刺之间）
      for (let ri = 0; ri < 8; ri++) {
        const rAng = (ri + 0.5) / 8 * Math.PI * 2;
        const rpx = px + Math.cos(rAng) * s * 0.4;
        const rpy = bodyY + Math.sin(rAng) * s * 0.4;
        ctx.fillStyle = '#ffdd66';
        ctx.fillRect(Math.floor(rpx - 3), Math.floor(rpy - 3), 6, 6);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(rpx - 1), Math.floor(rpy - 1), 2, 2);
      }
      // 眼睛
      ctx.fillStyle = col.eye;
      ctx.fillRect(Math.floor(px - 5), Math.floor(bodyY - 2), 3, 3);
      ctx.fillRect(Math.floor(px + 3), Math.floor(bodyY - 2), 3, 3);
    } else if (tier === 3) {
      // Tier 3 铁壁：三层嵌套 + 正面弧盾 + 刮痕纹理
      // 三层嵌套
      drawPixelDiamond(px, bodyY, s * 0.95, col.edge, col.edge);
      drawPixelDiamond(px, bodyY, s * 0.7, col.fill, col.edge);
      drawPixelDiamond(px, bodyY, s * 0.45, lightenColor(col.fill, 0.25), col.edge);
      // 正面弧盾形（朝 facing 方向）
      for (let ai = 0; ai < 7; ai++) {
        const arcAng = -0.9 + (ai / 6) * 1.8;
        const arx = px + Math.cos(facing + arcAng) * s * 1.05;
        const ary = bodyY + Math.sin(facing + arcAng) * s * 1.05;
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(arx - 4), Math.floor(ary - 4), 8, 8);
        ctx.fillStyle = col.glow;
        ctx.fillRect(Math.floor(arx - 2), Math.floor(ary - 2), 4, 4);
      }
      // 10 条随机斜线刮痕
      for (let si = 0; si < 10; si++) {
        const sRand = ((si * 37) % 13) / 12;
        const sAng = sRand * Math.PI * 2;
        const sx = px + Math.cos(sAng) * s * 0.3;
        const sy = bodyY + Math.sin(sAng) * s * 0.3;
        ctx.fillStyle = '#332211';
        ctx.fillRect(Math.floor(sx), Math.floor(sy), 3, 1);
        ctx.fillRect(Math.floor(sx + 1), Math.floor(sy + 1), 3, 1);
      }
      // 眼睛
      ctx.fillStyle = col.eye;
      ctx.fillRect(Math.floor(px - 5), Math.floor(bodyY - 2), 3, 3);
      ctx.fillRect(Math.floor(px + 3), Math.floor(bodyY - 2), 3, 3);
    } else if (tier === 4) {
