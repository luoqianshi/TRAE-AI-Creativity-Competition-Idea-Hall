<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>融合纪元 Fusion Epoch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a15;
    font-family: "Courier New", monospace;
    color: #e0e0ff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
  }
  #game-wrapper {
    position: relative;
    border: 4px solid #3a3a6a;
    box-shadow: 0 0 30px rgba(100, 100, 255, 0.3);
  }
  canvas {
    display: block;
    background: #1a1a2e;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    cursor: crosshair;
  }
  #ui-top {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 14px;
    text-shadow: 2px 2px 0 #000;
  }
  .hp-bar-outer {
    width: 200px;
    height: 20px;
    background: #222;
    border: 2px solid #6a6a9a;
    position: relative;
  }
  .hp-bar-inner {
    height: 100%;
    background: linear-gradient(to right, #ff4466, #ff8844);
    transition: width 0.2s;
  }
  .hp-text {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    text-align: center;
    line-height: 16px;
    color: #fff;
    font-weight: bold;
    text-shadow: 1px 1px 0 #000;
  }
  .dna-bar-outer {
    width: 200px;
    height: 14px;
    background: #222;
    border: 2px solid #6a9a6a;
    margin-top: 4px;
  }
  .dna-bar-inner {
    height: 100%;
    background: linear-gradient(to right, #44ff88, #44ffff);
    transition: width 0.3s;
  }
  #info-right {
    text-align: right;
  }
  #controls-hint {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 12px;
    color: #9090c0;
    pointer-events: none;
    text-shadow: 1px 1px 0 #000;
  }
  #modal {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 10, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  #evolution-panel {
    position: fixed; inset: 0; z-index: 150;
    background: radial-gradient(circle, rgba(20,10,40,0.92), rgba(0,0,0,0.96));
    display: flex; align-items: center; justify-content: center;
  }
  .evol-overlay { text-align: center; max-width: 900px; padding: 20px; }
  .evol-title { font-size: 28px; color: #ffee88; margin-bottom: 8px; text-shadow: 0 0 12px #ffaa00; letter-spacing: 4px; font-weight: bold; }
  .evol-sub { font-size: 14px; color: #aaa; margin-bottom: 30px; letter-spacing: 2px; }
  .evol-cards { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
  .evol-card {
    padding: 20px; border-radius: 10px; min-width: 230px; max-width: 260px;
    cursor: pointer; transition: all 0.15s; position: relative;
    box-shadow: 0 0 25px rgba(255,200,100,0.25);
  }
  .evol-card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 0 40px rgba(255,200,100,0.6); }
  .evol-key { position: absolute; top: 8px; left: 10px; font-size: 22px; color: #ff8844; font-weight: bold; text-shadow: 0 0 8px #ff4400; }
  .evol-name { font-size: 22px; font-weight: bold; color: #fff; margin: 8px 0 4px; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
  .evol-branch { font-size: 12px; color: #cccccc; margin-bottom: 12px; letter-spacing: 1px; }
  .evol-preview {
    width: 80px; height: 80px; margin: 10px auto; border-radius: 50%;
    font-size: 36px; color: #fff; display: flex; align-items: center; justify-content: center;
    animation: evolPulse 1.5s ease-in-out infinite;
  }
  @keyframes evolPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .evol-desc { font-size: 13px; color: #dddddd; margin: 10px 0; min-height: 30px; }
  .evol-stats { font-size: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed rgba(255,255,255,0.25); }
  .evol-hint { font-size: 13px; color: #888; letter-spacing: 2px; }
  #modal.active { display: flex; }
  .modal-box {
    background: #1a1a3a;
    border: 4px solid #6a6aff;
    padding: 24px 32px;
    max-width: 560px;
    box-shadow: 0 0 40px rgba(100, 100, 255, 0.5);
  }
  .modal-title {
    font-size: 22px;
    color: #ffff88;
    margin-bottom: 16px;
    text-align: center;
    letter-spacing: 2px;
  }
  .modal-subtitle {
    font-size: 14px;
    color: #a0a0ff;
    margin-bottom: 16px;
    text-align: center;
  }
  .trait-list {
    display: grid;
    gap: 10px;
    margin: 16px 0;
  }
  .trait-item {
    background: #2a2a4a;
    border: 2px solid #4a4a7a;
    padding: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .trait-item:hover {
    background: #3a3a6a;
    border-color: #8888ff;
    transform: translateX(4px);
  }
  .trait-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    background: #0a0a1a;
    border: 2px solid #5a5a8a;
  }
  .trait-info { flex: 1; }
  .trait-name { color: #ffffaa; font-weight: bold; margin-bottom: 4px; }
  .trait-desc { color: #a0a0c0; font-size: 12px; }
  .skip-btn, .choose-btn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: #3a3a5a;
    border: 2px solid #5a5a8a;
    color: #e0e0ff;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .skip-btn:hover, .choose-btn:hover { background: #4a4a7a; border-color: #8888ff; }
  .gameover-text {
    text-align: center;
    font-size: 28px;
    color: #ff6666;
    margin: 20px 0;
    letter-spacing: 4px;
  }
  .victory-text {
    text-align: center;
    font-size: 28px;
    color: #ffff66;
    margin: 20px 0;
    letter-spacing: 4px;
    text-shadow: 0 0 20px #ffff00;
  }
  #dna-panel {
    position: absolute;
    top: 60px;
    right: 10px;
    background: rgba(10, 10, 30, 0.9);
    border: 2px solid #6a6aff;
    padding: 12px;
    display: none;
    max-width: 240px;
    font-size: 12px;
  }
  #dna-panel.active { display: block; }
  #dna-panel h3 { color: #88ff88; margin-bottom: 8px; font-size: 14px; }
  .dna-trait {
    background: #2a2a4a;
    padding: 6px 8px;
    margin-top: 4px;
    border-left: 3px solid #88ff88;
  }
  .stage-badge {
    display: inline-block;
    background: #ffaa00;
    color: #1a1a2e;
    padding: 2px 10px;
    font-weight: bold;
    margin-top: 4px;
    font-size: 12px;
  }
  #title-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }
  #title-screen.hidden { display: none; }
  .title-main {
    font-size: 48px;
    color: #ffff88;
    letter-spacing: 8px;
    margin-bottom: 8px;
    text-shadow: 4px 4px 0 #ff4488, 8px 8px 20px rgba(255,100,200,0.4);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .title-sub {
    font-size: 18px;
    color: #8888ff;
    margin-bottom: 40px;
    letter-spacing: 4px;
  }
  .title-btn {
    padding: 14px 40px;
    background: #2a2a5a;
    border: 3px solid #8888ff;
    color: #ffff88;
    font-family: inherit;
    font-size: 18px;
    letter-spacing: 4px;
    cursor: pointer;
    margin: 8px;
    transition: all 0.2s;
  }
  .title-btn:hover {
    background: #4a4a8a;
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(136, 136, 255, 0.6);
  }
  .title-desc {
    color: #8080a0;
    font-size: 13px;
    max-width: 500px;
    text-align: center;
    margin-top: 24px;
    line-height: 1.8;
  }
  .flash-text {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    color: #ffff66;
    text-shadow: 3px 3px 0 #ff4400;
    pointer-events: none;
    opacity: 0;
    letter-spacing: 4px;
    z-index: 5;
  }
  .flash-text.show {
    animation: flashMsg 1.8s ease-out;
  }
  @keyframes flashMsg {
    0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
    20% { opacity: 1; transform: translateX(-50%) translateY(0); }
    80% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
  }

  /* --------- 引导提示 --------- */
  #tutorial-hint {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(5, 10, 25, 0.88);
    border: 2px solid #88ccff;
    padding: 10px 24px;
    font-size: 15px;
    color: #e8f0ff;
    letter-spacing: 2px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
    z-index: 4;
    text-shadow: 1px 1px 0 #000;
    white-space: nowrap;
  }
  #tutorial-hint.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #tutorial-hint::before {
    content: '▶';
    color: #ffdd88;
    margin-right: 8px;
  }

  /* --------- 小地图 --------- */
  #minimap-wrap {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 3px solid #6a6aff;
    background: rgba(5, 10, 25, 0.75);
    box-shadow: 0 0 20px rgba(100, 150, 255, 0.3), inset 0 0 20px rgba(0, 0, 30, 0.8);
    overflow: hidden;
    z-index: 3;
    pointer-events: none;
  }
  #minimap {
    width: 150px;
    height: 150px;
    display: block;
  }
  #minimap-label {
    position: absolute;
    left: 50%;
    bottom: -4px;
    transform: translateX(-50%);
    font-size: 10px;
    color: #88aaff;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 #000;
    background: rgba(0, 0, 20, 0.6);
    padding: 2px 8px;
    border-radius: 8px;
  }

  /* --------- 重新设计的 HUD --------- */
  .hud-panel {
    background: linear-gradient(180deg, rgba(10, 15, 35, 0.72), rgba(20, 25, 50, 0.68));
    border: 2px solid #6a6aff;
    padding: 8px 12px;
    border-radius: 4px;
    box-shadow: 0 0 12px rgba(100, 120, 255, 0.25), inset 0 0 8px rgba(0, 0, 0, 0.3);
  }
  .hud-label {
    font-size: 11px;
    color: #aaccff;
    letter-spacing: 2px;
    text-shadow: 1px 1px 0 #000;
  }
  .hp-bar-outer {
    width: 220px;
    height: 18px;
    background: #111;
    border: 2px solid #6a6aff;
    position: relative;
    overflow: hidden;
  }
  .hp-bar-inner {
    height: 100%;
    background: linear-gradient(to right, #ff3355, #ff6633);
    transition: width 0.25s;
    box-shadow: 0 0 8px rgba(255, 60, 80, 0.6) inset;
  }
  .hp-bar-inner::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.25), transparent);
  }
  .hp-text {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    text-align: center;
    line-height: 14px;
    color: #fff;
    font-weight: bold;
    font-size: 11px;
    text-shadow: 1px 1px 0 #000;
    letter-spacing: 1px;
  }
  .dna-bar-outer {
    width: 220px;
    height: 12px;
    background: #111;
    border: 2px solid #44cc66;
    margin-top: 6px;
    overflow: hidden;
    position: relative;
  }
  .dna-bar-inner {
    height: 100%;
    background: linear-gradient(to right, #33ff77, #33ffff);
    transition: width 0.3s;
    box-shadow: 0 0 6px rgba(100, 255, 150, 0.5) inset;
  }
  .dna-bar-inner::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.3), transparent);
  }
  .stage-label-small {
    font-size: 10px;
    color: #ffaa44;
    letter-spacing: 2px;
    margin-top: 4px;
    text-shadow: 1px 1px 0 #000;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .stat-block {
    text-align: center;
    padding: 4px 10px;
    background: rgba(10, 15, 30, 0.5);
    border: 1px solid #555588;
    border-radius: 3px;
  }
  .stat-num {
    font-size: 16px;
    color: #ffff88;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000;
  }

  /* --------- 卡片式融合弹窗 --------- */
  .fusion-card {
    background: linear-gradient(180deg, #1a1a3a, #0e0e22);
    border: 3px solid #8888ff;
    padding: 20px 28px;
    max-width: 600px;
    min-width: 460px;
    box-shadow: 0 0 50px rgba(136, 136, 255, 0.6), inset 0 0 20px rgba(0, 0, 40, 0.5);
    position: relative;
  }
  .fusion-card::before {
    content: '◆ ◆ ◆';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    color: #ffdd66;
    letter-spacing: 12px;
    opacity: 0.7;
  }
  .fusion-header {
    text-align: center;
    padding: 16px 0 12px;
    border-bottom: 1px dashed #555599;
    margin-bottom: 16px;
  }
  .fusion-title {
    font-size: 22px;
    color: #ffff88;
    letter-spacing: 6px;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 #ff4488;
  }
  .fusion-enemy {
    font-size: 14px;
    color: #ffaa88;
    letter-spacing: 2px;
  }
  .fusion-enemy b {
    font-size: 16px;
    color: #ffffff;
  }
  .trait-card {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr;
  }
  .trait-option {
    display: flex;
    align-items: stretch;
    background: linear-gradient(90deg, #1a1a3a, #24244a);
    border: 2px solid #444488;
    padding: 0;
    cursor: pointer;
    transition: all 0.15s;
    overflow: hidden;
    position: relative;
  }
  .trait-option:hover {
    background: linear-gradient(90deg, #22224a, #33336a);
    border-color: #aaaaff;
    box-shadow: 0 0 18px rgba(136, 136, 255, 0.5);
    transform: translateX(4px);
  }
  .trait-option-icon {
    width: 70px;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    background: rgba(0, 0, 20, 0.7);
    border-right: 2px solid #333355;
    text-shadow: 0 0 12px currentColor;
  }
  .trait-option-body {
    flex: 1;
    padding: 10px 14px;
  }
  .trait-option-name {
    font-size: 15px;
    color: #ffffaa;
    font-weight: bold;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .trait-option-desc {
    font-size: 12px;
    color: #b0b0d0;
    line-height: 1.5;
  }
  .fusion-actions {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  .fusion-skip {
    flex: 1;
    padding: 10px;
    background: #333366;
    border: 2px solid #555588;
    color: #aaccff;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .fusion-skip:hover {
    background: #4a4a88;
    border-color: #8888ff;
    color: #ffffff;
  }

  /* 突破进化卡片 (金色边框) */
  .fusion-card.breakthrough {
    border-color: #ffdd00;
    box-shadow: 0 0 60px rgba(255, 220, 0, 0.7), 0 0 20px rgba(255, 150, 0, 0.4);
  }
  .fusion-card.breakthrough::before {
    content: '★ 突 破 进 化 ★';
    color: #ffdd00;
    font-size: 13px;
    letter-spacing: 6px;
  }
  .trait-option.breakthrough-option {
    border-color: #ffaa00;
    background: linear-gradient(90deg, #2a2000, #3a3000);
  }
  .trait-option.breakthrough-option:hover {
    border-color: #ffdd00;
    box-shadow: 0 0 20px rgba(255, 220, 0, 0.6);
  }

  /* 阶段提升全屏提示 */
  #stage-flash {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.75);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #stage-flash.show {
    opacity: 1;
  }
  .stage-flash-inner {
    text-align: center;
    animation: stagePulse 0.5s ease-out;
  }
  @keyframes stagePulse {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .stage-flash-title {
    font-size: 36px;
    letter-spacing: 8px;
    text-shadow: 0 0 30px currentColor;
    margin-bottom: 12px;
  }
  .stage-flash-sub {
    font-size: 20px;
    color: #aaaacc;
    letter-spacing: 4px;
  }

  /* 死亡结算 */
  .death-screen {
    background: linear-gradient(180deg, #0a0010, #150025);
    border: 4px solid #aa0044;
    padding: 32px 40px;
    max-width: 500px;
    box-shadow: 0 0 60px rgba(200, 0, 80, 0.7);
    position: relative;
    text-align: center;
  }
  .death-screen::before {
    content: '✝';
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 48px;
    color: #aa0044;
    text-shadow: 0 0 20px #ff0066;
  }
  .death-title {
    font-size: 28px;
    color: #ff4466;
    letter-spacing: 6px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px #ff0044;
  }
  .death-title-alive {
    font-size: 28px;
    color: #44ffaa;
    letter-spacing: 6px;
    margin-bottom: 8px;
    text-shadow: 0 0 20px #00ff88;
  }
  .death-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
    text-align: left;
  }
  .death-stat {
    background: rgba(30, 0, 50, 0.8);
    border: 1px solid #550044;
    padding: 10px 14px;
    border-radius: 4px;
  }
  .death-stat-label {
    font-size: 11px;
    color: #888;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .death-stat-value {
    font-size: 20px;
    color: #ffffff;
    font-weight: bold;
    text-shadow: 0 0 10px currentColor;
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game" width="800" height="600"></canvas>

  <div id="ui-top">
    <div class="hud-panel" id="info-left">
      <div class="hud-label">◈ 生命 HP</div>
      <div class="hp-bar-outer"><div class="hp-bar-inner" id="hp-bar" style="width:100%"></div><div class="hp-text" id="hp-text">100 / 100</div></div>
      <div class="hud-label" style="color:#88ffaa;margin-top:6px;">◈ DNA 进化</div>
      <div class="dna-bar-outer"><div class="dna-bar-inner" id="dna-bar" style="width:0%"></div></div>
      <div class="stage-label-small" id="stage-text">阶段 1 / 5 · 源质期</div>
      <div id="evolve-cooldown-wrap" style="margin-top:5px;display:none;">
        <div class="hud-label" style="color:#ffdd00;font-size:10px;">◈ 进化冷却</div>
        <div class="dna-bar-outer" style="border-color:#ffdd00;height:10px;">
          <div class="dna-bar-inner" id="evolve-bar" style="width:100%;background:#ffdd00;transition:none;"></div>
        </div>
      </div>
    </div>
    <div class="hud-panel" id="info-right">
      <div class="hud-label" style="color:#ffcc66;">◈ 战绩</div>
      <div class="stat-row" style="margin-top:6px;">
        <div class="stat-block">
          <div style="font-size:10px;color:#aaa;">击杀</div>
          <div class="stat-num" id="kill-count">0</div>
        </div>
        <div class="stat-block">
          <div style="font-size:10px;color:#aaa;">攻击</div>

// ---------- 程序化音效 (Web Audio API) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
// 通用：创建一个带 ADSR 的 oscillator
function playTone({ freq = 440, type = 'sine', duration = 0.15, volume = 0.25, attack = 0.01, decay = 0.08, sustain = 0.5, release = 0.1, freqEnd = null, delay = 0 }) {
  ensureAudio();
  if (!audioCtx) return;
  const start = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  if (freqEnd !== null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), start + duration);
  }
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(volume, start + attack);
  gain.gain.linearRampToValueAtTime(volume * sustain, start + attack + decay);
  gain.gain.linearRampToValueAtTime(0, start + attack + decay + release);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(start);
  osc.stop(start + attack + decay + release + 0.05);
}
// 通用：播放一段带衰减的噪声 (用于打击/受击)
function playNoise({ duration = 0.12, volume = 0.3, filterFreq = 800, filterType = 'lowpass', delay = 0 }) {
  ensureAudio();
  if (!audioCtx) return;
  const bufSize = Math.floor(audioCtx.sampleRate * duration);
  const buffer = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.value = filterFreq;
  const gain = audioCtx.createGain();
  gain.gain.value = volume;
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  const start = audioCtx.currentTime + delay;
  src.start(start);
  src.stop(start + duration + 0.02);
}

// 1. 攻击命中：短促低频 thud + 高频金属音
function sfxAttackHit() {
  ensureAudio(); if (!audioCtx) return;
  playTone({ freq: 180, freqEnd: 60, type: 'sine', duration: 0.08, volume: 0.3, release: 0.06 });
  playTone({ freq: 900, freqEnd: 400, type: 'triangle', duration: 0.06, volume: 0.15, attack: 0.005, release: 0.05 });
  playNoise({ duration: 0.05, volume: 0.15, filterFreq: 1800, filterType: 'highpass' });
}
// 2. 敌人死亡：低沉轰鸣
function sfxEnemyDeath() {
  ensureAudio(); if (!audioCtx) return;
  playTone({ freq: 140, freqEnd: 45, type: 'sawtooth', duration: 0.45, volume: 0.32, attack: 0.02, release: 0.2 });
  playNoise({ duration: 0.35, volume: 0.18, filterFreq: 450, filterType: 'lowpass', delay: 0.02 });
}
// 3. 融合成功：三连上升音阶
function sfxFusion() {
  ensureAudio(); if (!audioCtx) return;
  const base = 440;
  for (let i = 0; i < 3; i++) {
    playTone({ freq: base * Math.pow(1.26, i), type: 'triangle', duration: 0.18, volume: 0.28, attack: 0.02, release: 0.12, delay: i * 0.11 });
    playTone({ freq: base * 2 * Math.pow(1.26, i), type: 'sine', duration: 0.16, volume: 0.15, attack: 0.015, release: 0.1, delay: i * 0.11 });
  }
}
// 4. 阶段提升：琶音 + 低音 drone
function sfxStageUp() {
  ensureAudio(); if (!audioCtx) return;
  // 低音 drone
  playTone({ freq: 110, type: 'sawtooth', duration: 1.1, volume: 0.18, attack: 0.04, release: 0.3 });
  // 琶音
  const notes = [0, 3, 7, 12, 16, 19];
  const root = 220;
  for (let i = 0; i < notes.length; i++) {
    playTone({ freq: root * Math.pow(2, notes[i] / 12), type: 'triangle', duration: 0.2, volume: 0.22, attack: 0.02, release: 0.12, delay: i * 0.12 });
  }
  // 顶部高音 sparkle
  for (let i = 0; i < 4; i++) {
    playTone({ freq: 1200 + i * 250, type: 'sine', duration: 0.15, volume: 0.1, release: 0.1, delay: 0.5 + i * 0.06 });
  }
}
// 5. 受到伤害：刺耳噪声
function sfxPlayerHurt() {
  ensureAudio(); if (!audioCtx) return;
  playNoise({ duration: 0.15, volume: 0.35, filterFreq: 2500, filterType: 'highpass' });
  playTone({ freq: 520, freqEnd: 140, type: 'square', duration: 0.16, volume: 0.22, attack: 0.005, release: 0.08 });
}
function sfxDash() {
  ensureAudio(); if (!audioCtx) return;
  // 冲刺: 高频滑音 + 低频推力

}

// ---------- 屏幕震动 ----------
const shakeState = { t: 0, max: 6, x: 0, y: 0, power: 4 };
function triggerShake(power = 4) {
  shakeState.max = 6;
  shakeState.t = shakeState.max;
  shakeState.power = power;
}
function updateShake() {
  if (shakeState.t > 0) {
    shakeState.t--;
    const k = shakeState.t / shakeState.max;
    shakeState.x = (Math.random() * 2 - 1) * shakeState.power * k;
    shakeState.y = (Math.random() * 2 - 1) * shakeState.power * k;
  } else {
    shakeState.x = 0;
    shakeState.y = 0;
  }
}

function getBranchWeights() {
  const tp = player.traitPoints;
  return {
    predator: Math.max(1, (tp.sharp || 0) + (tp.flame || 0) + (tp.fast || 0) + (tp.agile || 0)),
    armor:    Math.max(1, (tp.tough || 0) + (tp.big || 0)),
    psychic:  Math.max(1, (tp.flame || 0) + (tp.electric || 0) + (tp.regen || 0)),
    stealth:  Math.max(1, (tp.stealth || 0) + (tp.venom || 0) + (tp.fast || 0)),
    corrupt:  Math.max(1, (tp.venom || 0) * 2 + (tp.regen || 0)),
    crystal:  Math.max(1, (tp.sharp || 0) + (tp.tough || 0) + (tp.electric || 0) + 1),
  };
}

// ---------- 实体 ----------
let creatures = [];
let particles = [];
let floatingTexts = [];
let projectiles = [];   // 灵能系/晶体系子弹
let fusionPending = null;
