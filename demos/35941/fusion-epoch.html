        const ang = gameTime * 0.04 + (i / 5) * Math.PI * 2;
        const vx = px + Math.cos(ang) * s * 0.7;
        const vy = bodyY + Math.sin(ang) * s * 0.4;
        ctx.fillStyle = '#44ff44';
        ctx.fillRect(Math.floor(vx - 1), Math.floor(vy - 1), 2, 2);
      }
    } else {
      drawPixelEllipse(px, bodyY, s * 1.25, s * 1.0, col.fill, col.edge);
      drawPixelEllipse(px, bodyY - s * 0.15, s * 0.95, s * 0.65, '#aa6633', col.fill);
      const eyeCount = 8;
      for (let i = 0; i < eyeCount; i++) {
        const ang = (i / eyeCount) * Math.PI * 2 + gameTime * 0.01;
        const ex = px + Math.cos(ang) * s * 0.85;
        const ey = bodyY + Math.sin(ang) * s * 0.65;
        ctx.fillStyle = col.eye;
        ctx.fillRect(Math.floor(ex - 3), Math.floor(ey - 3), 6, 6);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(Math.floor(ex - 1), Math.floor(ey - 1), 2, 2);
        if (i % 2 === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(Math.floor(ex), Math.floor(ey), 1, 1);
        }
      }
      for (let i = 0; i < 10; i++) {
        const ang = (i / 10) * Math.PI * 2 + gameTime * 0.03;
        const bx = px + Math.cos(ang) * s * 1.15;
        const by = bodyY + Math.sin(ang) * s * 0.8;
        ctx.fillStyle = col.glow;
        ctx.fillRect(Math.floor(bx - 4), Math.floor(by - 4), 8, 8);
        ctx.fillStyle = '#44cc44';
        ctx.fillRect(Math.floor(bx - 2), Math.floor(by - 2), 4, 4);
        ctx.fillStyle = '#88ff88';
        ctx.fillRect(Math.floor(bx - 1), Math.floor(by - 1), 2, 2);
      }
      for (let t = 0; t < 14; t++) {
        const ang = (t / 14) * Math.PI * 2;
        const baseX = px + Math.cos(ang) * s * 1.15;
        const baseY = bodyY + Math.sin(ang) * s * 0.95;
        for (let seg = 1; seg <= 4; seg++) {
          const sx = baseX + Math.cos(ang) * s * 0.25 * seg + Math.sin(gameTime * 0.1 + t + seg) * 4;
          const sy = baseY + Math.sin(ang) * s * 0.25 * seg + Math.sin(gameTime * 0.1 + t + seg) * 4;
          ctx.fillStyle = t % 2 === 0 ? col.fill : '#552200';
          ctx.fillRect(Math.floor(sx - 3), Math.floor(sy - 3), 6, 6);
          if (seg === 4) {
            ctx.fillStyle = col.glow;
            ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
          }
        }
      }
      for (let i = 0; i < 14; i++) {
        const ang = (i / 14) * Math.PI * 2 + gameTime * 0.02;
        const sx = px + Math.cos(ang) * s * 1.7;
        const sy = bodyY + Math.sin(ang) * s * 1.5;
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = col.glow;
        ctx.fillRect(Math.floor(sx - 3), Math.floor(sy - 3), 6, 6);
      }
      ctx.globalAlpha = 1;
    }
  } else if (bd.branch === 'crystal') {
    if (tier === 1) {
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2 + Math.PI / 8;
        const sx = px + Math.cos(ang) * s;
        const sy = bodyY + Math.sin(ang) * s;
        const prismColors = ['#ff4444', '#ffaa00', '#ffff00', '#44ff44', '#4488ff', '#8844ff', '#ff44ff', '#ffffff'];
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(sx - 3), Math.floor(sy - 3), 6, 6);
        ctx.fillStyle = prismColors[i];
        ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
      }
      drawPixelCircle(px, bodyY, s * 0.85, col.fill, col.edge);
      ctx.fillStyle = col.glow;
      ctx.fillRect(Math.floor(px - s * 0.35), Math.floor(bodyY - s * 0.95), s * 0.7, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px - 2, bodyY - 2, 4, 4);
      for (let i = 0; i < 8; i++) {
        if ((Math.floor(gameTime / 12 + i) % 3) === 0) {
          const ang = (i / 8) * Math.PI * 2 + Math.PI / 8;
          const sx = px + Math.cos(ang) * s * 1.15;
          const sy = bodyY + Math.sin(ang) * s * 1.15;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
        }
      }
    } else if (tier === 2) {
      for (let i = 0; i < 8; i++) {
        const ang = gameTime * 0.03 + (i / 8) * Math.PI * 2;
        const sx = px + Math.cos(ang) * s;
        const sy = bodyY + Math.sin(ang) * s;
        const bandColors = ['#ff4444', '#ffaa00', '#ffff00', '#44ff44', '#4488ff', '#aa44ff', '#ff44ff', '#ffffff'];
        ctx.fillStyle = bandColors[i % 8];
        ctx.fillRect(Math.floor(sx - 4), Math.floor(sy - 4), 8, 8);
        ctx.fillStyle = col.edge;
        ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
      }
      drawPixelCircle(px, bodyY, s * 0.65, col.fill, col.edge);
      drawPixelCircle(px, bodyY, s * 0.35, '#ffffff', col.fill);
      for (let i = 0; i < 8; i++) {
        const ang = gameTime * 0.04 + (i / 8) * Math.PI * 2;
        const sx = px + Math.cos(ang) * s * 0.55;
        const sy = bodyY + Math.sin(ang) * s * 0.55;
        const bandColors = ['#ff4444', '#ffaa00', '#ffff00', '#44ff44', '#4488ff', '#aa44ff', '#ff44ff', '#ffffff'];
        ctx.fillStyle = bandColors[i];
        ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
      }
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const sx = px + Math.cos(ang) * s * 1.2;
        const sy = bodyY + Math.sin(ang) * s * 1.2;
        const bandColors = ['#ff4444', '#ffaa00', '#ffff00', '#44ff44', '#4488ff', '#aa44ff', '#ff44ff', '#ffffff'];
        ctx.fillStyle = bandColors[i];
        ctx.globalAlpha = 0.5 + Math.sin(gameTime * 0.1 + i) * 0.3;
        ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), 4, 4);
      }
      ctx.globalAlpha = 1;
    } else if (tier === 3) {
      ctx.globalAlpha = 0.55;
      drawPixelDiamond(px, bodyY, s * 1.1, col.fill, col.edge);
      ctx.globalAlpha = 1;
      drawPixelDiamond(px, bodyY, s * 0.65, col.glow, col.fill);
      drawPixelCircle(px, bodyY, s * 0.3, '#ffffff', col.glow);
      for (let i = 0; i < 6; i++) {
        const ang = gameTime * 0.02 + (i / 6) * Math.PI * 2;
        const sx = px + Math.cos(ang) * s * 0.85;
        const sy = bodyY + Math.sin(ang) * s * 0.85;
        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.7;
        ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
      }
      ctx.globalAlpha = 1;
      for (let i = 0; i < 10; i++) {
        const ang = gameTime * 0.05 + (i / 10) * Math.PI * 2;
        const sx = px + Math.cos(ang) * s * 1.4;
        const sy = bodyY + Math.sin(ang) * s * 1.4;
        ctx.fillStyle = col.glow;
        ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
      }
      for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2 + Math.PI / 6;
        const sx = px + Math.cos(ang) * s * 0.5;
        const sy = bodyY + Math.sin(ang) * s * 0.5;
        const bandColors = ['#ff4444', '#ffaa00', '#ffff00', '#44ff44', '#4488ff', '#ff44ff'];
        ctx.fillStyle = bandColors[i];
        ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), 4, 4);
      }
    } else if (tier === 4) {
      for (let c = 0; c < 4; c++) {
        const ang = (c / 4) * Math.PI * 2 + gameTime * 0.015;
        for (let seg = 5; seg >= 1; seg--) {
          const segR = s * 0.3 + seg * s * 0.22;
          const sx = px + Math.cos(ang) * segR;
          const sy = bodyY + Math.sin(ang) * segR;
          const segSize = s * (0.35 - seg * 0.03);
          const bandColors = ['#ff4444', '#ffaa00', '#4488ff', '#ff44ff'];
          ctx.fillStyle = seg % 2 === 0 ? bandColors[c] : col.edge;
          ctx.fillRect(Math.floor(sx - segSize), Math.floor(sy - segSize), segSize * 2, segSize * 2);
          if (seg === 5) {
            ctx.fillStyle = col.glow;
            ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), 4, 4);
          }
        }
        const nextAng = ang + Math.PI * 2 / 4;
        const midX = px + Math.cos((ang + nextAng) / 2) * s * 1.3;
        const midY = bodyY + Math.sin((ang + nextAng) / 2) * s * 1.3;
        ctx.fillStyle = col.glow;
        ctx.globalAlpha = 0.5;
        ctx.fillRect(Math.floor(midX - 2), Math.floor(midY - 2), 4, 4);
        ctx.globalAlpha = 1;
      }
      drawPixelCircle(px, bodyY, s * 0.55, '#220066', col.edge);
      drawPixelCircle(px, bodyY, s * 0.3, col.glow, col.fill);
      for (let i = 0; i < 12; i++) {
        const ang = gameTime * 0.08 + (i / 12) * Math.PI * 2;
        const sx = px + Math.cos(ang) * s * 1.8;
        const sy = bodyY + Math.sin(ang) * s * 1.8;
        ctx.fillStyle = col.glow;
        ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
      }
      for (let i = 0; i < 8; i++) {
        const ang = gameTime * 0.04 + (i / 8) * Math.PI * 2;
        const sx = px + Math.cos(ang) * s * 0.7;
        const sy = bodyY + Math.sin(ang) * s * 0.7;
        const bandColors = ['#ff4444', '#ffaa00', '#ffff00', '#44ff44', '#4488ff', '#aa44ff', '#ff44ff', '#ffffff'];
        ctx.fillStyle = bandColors[i];
        ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), 4, 4);
      }
    } else {
      const crystalColors = ['#ff2222', '#ff8800', '#ffff00', '#44ff44', '#4488ff', '#8844ff', '#ff44ff', '#ffffff'];
      for (let c = 0; c < 8; c++) {
        const ang = gameTime * 0.01 + (c / 8) * Math.PI * 2;
        for (let seg = 5; seg >= 1; seg--) {
          const segR = s * 0.4 + seg * s * 0.28;
          const sx = px + Math.cos(ang) * segR;
          const sy = bodyY + Math.sin(ang) * segR;
          const segSize = s * (0.42 - seg * 0.04);
          ctx.fillStyle = crystalColors[c];
          ctx.fillRect(Math.floor(sx - segSize), Math.floor(sy - segSize), segSize * 2, segSize * 2);
          if (seg === 5) {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), 4, 4);
          }
        }
        const beamX = px + Math.cos(ang) * s * 2.8;
        const beamY = bodyY + Math.sin(ang) * s * 2.8;
        ctx.fillStyle = crystalColors[c];
        ctx.globalAlpha = 0.4 + Math.sin(gameTime * 0.1 + c) * 0.2;
        ctx.fillRect(Math.floor((px + beamX) / 2 - 2), Math.floor((bodyY + beamY) / 2 - 2), 4, 4);
        ctx.fillRect(Math.floor(beamX - 1), Math.floor(beamY - 1), 2, 2);
        ctx.globalAlpha = 1;
      }
      drawPixelCircle(px, bodyY, s * 0.75, '#222233', '#000022');
      drawPixelCircle(px, bodyY, s * 0.5, col.fill, col.edge);
      drawPixelCircle(px, bodyY, s * 0.25, '#ffffff', col.fill);
      for (let i = 0; i < 10; i++) {
        const ang = (i / 10) * Math.PI * 2 + gameTime * 0.06;
        const sx = px + Math.cos(ang) * s * 1.2;
        const sy = bodyY + Math.sin(ang) * s * 1.2;
        const bandColors = ['#ff4444', '#ffaa00', '#ffff00', '#44ff44', '#4488ff', '#aa44ff', '#ff44ff', '#ffffff'];
        ctx.fillStyle = bandColors[i % 8];
        ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), 4, 4);
      }
    }
    ctx.fillStyle = col.eye;
    ctx.fillRect(px - 5, bodyY - 2, 3, 3);
    ctx.fillRect(px + 3, bodyY - 2, 3, 3);
  }

  const tps = player.traitPoints;
  const tp_fast = tps.fast || 0;
  const tp_tough = tps.tough || 0;
  const tp_sharp = tps.sharp || 0;
  const tp_venom = tps.venom || 0;
  const tp_regen = tps.regen || 0;
  const tp_flame = tps.flame || 0;
  const tp_electric = tps.electric || 0;
  const tp_stealth = tps.stealth || 0;
  const tp_agile = tps.agile || 0;
  const tp_big = tps.big || 0;

  if (tp_stealth > 0) {
    const newAlpha = Math.max(0.3, ctx.globalAlpha * (1 - tp_stealth * 0.1));
    ctx.globalAlpha = newAlpha;
  }

  if (tp_fast > 0 || tp_agile > 0) {
    const trailCount = tp_fast * 2 + tp_agile * 2;
    const trailAng = facing + Math.PI;
    for (let i = 0; i < Math.min(trailCount, 10); i++) {
      const tx = px + Math.cos(trailAng) * s * (0.8 + i * 0.25) + (Math.random() - 0.5) * 4;
      const ty = bodyY + Math.sin(trailAng) * s * (0.8 + i * 0.25) + (Math.random() - 0.5) * 4;
      ctx.globalAlpha = (0.65 - i * 0.06);
      ctx.fillStyle = tp_agile > tp_fast ? '#88ffdd' : '#88ffff';
      ctx.fillRect(Math.floor(tx - 3), Math.floor(ty - 3), 6, 6);
    }
    ctx.globalAlpha = 1;
  }

  if (tp_tough > 0) {
    const shellCount = Math.min(tp_tough + 4, 10);
    const shellR = s * (1.3 + tp_tough * 0.04);
    for (let i = 0; i < shellCount; i++) {
      const ang = (i / shellCount) * Math.PI * 2;
      const sx = px + Math.cos(ang) * shellR;
      const sy = bodyY + Math.sin(ang) * shellR;
      ctx.fillStyle = i % 2 === 0 ? '#ccaa66' : '#886644';
      ctx.fillRect(Math.floor(sx - 4), Math.floor(sy - 4), 8, 8);
      if (tp_tough >= 3) {
        ctx.fillStyle = '#ffee99';
        ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
      }
    }
  }

  if (tp_sharp > 0) {
    const spikeCount = Math.min(4 + tp_sharp * 2, 12);
    for (let i = 0; i < spikeCount; i++) {
      const ang = (i / spikeCount) * Math.PI * 2 + gameTime * 0.01;
      const sx = px + Math.cos(ang) * s * 1.35;
      const sy = bodyY + Math.sin(ang) * s * 1.35;
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(Math.floor(sx - 4), Math.floor(sy - 4), 8, 8);
      ctx.fillStyle = '#ffcccc';
      ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), 4, 4);
    }
  }

  if (tp_venom > 0) {
    const ringR = s * (1.5 + tp_venom * 0.08) + Math.sin(gameTime * 0.1) * 3;
    const dotCount = Math.min(6 + tp_venom * 2, 14);
    for (let i = 0; i < dotCount; i++) {
      const ang = (i / dotCount) * Math.PI * 2 + gameTime * 0.02;
      const sx = px + Math.cos(ang) * ringR;
      const sy = bodyY + Math.sin(ang) * ringR;
      ctx.globalAlpha = 0.4 + Math.abs(Math.sin(gameTime * 0.08 + i)) * 0.4;
      ctx.fillStyle = '#44cc44';
      ctx.fillRect(Math.floor(sx - 3), Math.floor(sy - 3), 6, 6);
      ctx.fillStyle = '#88ff66';
      ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
    }
    ctx.globalAlpha = 1;
  }

  if (tp_regen > 0) {
    const breathe = Math.sin(gameTime * 0.08) * 0.2 + 0.8;
    const glowR = s * (0.5 + tp_regen * 0.15) * breathe;
    const glowGrad = ctx.createRadialGradient(px, bodyY, 0, px, bodyY, glowR);
    glowGrad.addColorStop(0, 'rgba(120,255,120,0.7)');
    glowGrad.addColorStop(0.5, 'rgba(80,220,80,0.3)');
    glowGrad.addColorStop(1, 'rgba(0,100,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(px - glowR, bodyY - glowR, glowR * 2, glowR * 2);
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = '#88ffaa';
    ctx.fillRect(px - s * 0.4, bodyY - 1, s * 0.8, 2);
    ctx.fillRect(px - 1, bodyY - s * 0.4, 2, s * 0.8);
    ctx.globalAlpha = 1;
  }

  if (tp_flame > 0) {
    const flick = Math.sin(gameTime * 0.3);
    const flameCount = Math.min(4 + tp_flame * 3, 14);
    for (let i = 0; i < flameCount; i++) {
      const ang = gameTime * 0.08 + (i / flameCount) * Math.PI * 2;
      const sx = px + Math.cos(ang) * s * (1.15 + flick * 0.1);
      const sy = bodyY + Math.sin(ang) * s * (1.15 + flick * 0.1);
      ctx.fillStyle = '#ff4400';
      ctx.fillRect(Math.floor(sx - 5), Math.floor(sy - 5), 10, 10);
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(Math.floor(sx - 3), Math.floor(sy - 3), 6, 6);
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(Math.floor(sx - 1), Math.floor(sy - 1), 2, 2);
    }
  }

  if (tp_electric > 0) {
    const arcCount = Math.min(6 + tp_electric * 2, 14);
    for (let i = 0; i < arcCount; i++) {
      const on = (Math.floor(gameTime * 0.5 + i * 1.3) % 5) < (2 + tp_electric);
      if (!on) continue;
      const ang = (i / arcCount) * Math.PI * 2 + Math.sin(gameTime * 0.2 + i) * 0.3;
      const arcR = s * (1.4 + Math.sin(gameTime * 0.15 + i) * 0.15);
      const sx = px + Math.cos(ang) * arcR;
      const sy = bodyY + Math.sin(ang) * arcR;
      ctx.fillStyle = '#ffff44';
      ctx.fillRect(Math.floor(sx - 4), Math.floor(sy - 4), 8, 8);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.floor(sx - 2), Math.floor(sy - 2), 4, 4);
      const lx = px + Math.cos(ang) * arcR * 1.3;
      const ly = bodyY + Math.sin(ang) * arcR * 1.3;
      ctx.fillStyle = '#ffffaa';
      ctx.fillRect(Math.floor(lx - 1), Math.floor(ly - 1), 2, 2);
    }
  }

  if (tp_big > 0) {
    const bigR = s * (1.2 + tp_big * 0.05);
    for (let i = 0; i < 16; i++) {
      const ang = (i / 16) * Math.PI * 2;
      const sx = px + Math.cos(ang) * bigR;
      const sy = bodyY + Math.sin(ang) * bigR;
      ctx.fillStyle = col.edge;
      ctx.fillRect(Math.floor(sx - 3), Math.floor(sy - 3), 6, 6);
    }
  }

  // ========== 进化历史痕迹绘制 ==========
  const prevBranches = player.prevBranches || [];
  const branchDepth = player.branchDepth || {};
  for (const prevBranch of prevBranches) {
    if (prevBranch === bd.branch) continue; // 同分支进化不产生痕迹
    const depth = Math.min(branchDepth[prevBranch] || 1, 3); // 痕迹强度 1~3

    if (prevBranch === 'predator') {
      // 掠食痕迹：残留牙齿/背棘碎片
      for (let i = 0; i < depth; i++) {
        const ang = facing + Math.PI + (i / depth) * Math.PI * 0.8 - 0.4 + Math.sin(gameTime * 0.05 + i) * 0.15;
        const tx = px + Math.cos(ang) * s * 0.75;
        const ty = bodyY + Math.sin(ang) * s * 0.75;
        ctx.fillStyle = 'rgba(255, 136, 68, 0.55)';
        ctx.fillRect(Math.floor(tx - 2), Math.floor(ty - 2), 4, 3);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(tx - 1), Math.floor(ty - 1), 2, 1);
        // 断棘
        if (i === 0) {
          ctx.fillStyle = 'rgba(200, 50, 20, 0.5)';
          ctx.fillRect(Math.floor(tx - 1), Math.floor(ty - 6), 2, 5);
        }
      }
    } else if (prevBranch === 'armor') {
      // 重甲痕迹：残留甲壳碎片
      for (let i = 0; i < depth; i++) {
        const ang = facing + Math.PI * 0.5 + (i / depth) * Math.PI * 1.5;
        const ax = px + Math.cos(ang) * s * 0.9;
        const ay = bodyY + Math.sin(ang) * s * 0.9;
        ctx.fillStyle = 'rgba(170, 136, 68, 0.5)';
        ctx.fillRect(Math.floor(ax - 4), Math.floor(ay - 3), 8, 6);
        ctx.fillStyle = 'rgba(220, 180, 100, 0.3)';
        ctx.fillRect(Math.floor(ax - 2), Math.floor(ay - 1), 4, 2);
        if (depth >= 2) {
          ctx.fillStyle = 'rgba(255, 220, 120, 0.2)';
          ctx.fillRect(Math.floor(ax - 1), Math.floor(ay - 1), 2, 2);
        }
      }
    } else if (prevBranch === 'psychic') {
      // 灵能痕迹：微弱元素粒子环绕
      const ringColors = ['#ff8800', '#ffff44', '#88ddff'];
      for (let i = 0; i < depth; i++) {
        const ang = gameTime * 0.04 + i * (Math.PI * 2 / depth);
        const ppx = px + Math.cos(ang) * s * 1.15;
        const ppy = bodyY + Math.sin(ang) * s * 1.15;
        ctx.fillStyle = ringColors[i % 3] + '88';
        ctx.fillRect(Math.floor(ppx - 2), Math.floor(ppy - 2), 4, 4);
      }
    } else if (prevBranch === 'stealth') {
      // 诡秘痕迹：身体轮廓周期性波纹
      for (let i = 0; i < depth * 2; i++) {
        const ang = gameTime * 0.04 + (i / (depth * 2)) * Math.PI * 2;
        const wx = px + Math.cos(ang) * s * 0.95;
        const wy = bodyY + Math.sin(ang) * s * 0.95;
        const flicker = Math.sin(gameTime * 0.08 + i) > 0 ? 1 : 0.4;
        ctx.globalAlpha = 0.25 * flicker;
        ctx.fillStyle = '#aa88cc';
        ctx.fillRect(Math.floor(wx - 1), Math.floor(wy - 1), 3, 3);
      }
      ctx.globalAlpha = 1;
    } else if (prevBranch === 'corrupt') {
      // 腐化痕迹：暗色疤痕 + 绿色斑点在身体表面
      for (let i = 0; i < depth; i++) {
        const ox = (i % 2 === 0 ? -1 : 1) * s * (0.25 + i * 0.08);
        const oy = (i < 2 ? -1 : 1) * s * 0.15;
        ctx.fillStyle = 'rgba(80, 50, 0, 0.5)';
        ctx.fillRect(Math.floor(px + ox - 3), Math.floor(bodyY + oy - 2), 6, 4);
        ctx.fillStyle = 'rgba(136, 255, 68, 0.25)';
        ctx.fillRect(Math.floor(px + ox - 1), Math.floor(bodyY + oy - 1), 3, 3);
      }
    } else if (prevBranch === 'crystal') {
      // 晶体痕迹：半透明晶体嵌在身体表面
      for (let i = 0; i < depth; i++) {
        const cx = (i % 2 === 0 ? -1 : 1) * s * (0.3 + i * 0.12);
        const cy = (i < 2 ? -1 : 1) * s * 0.25;
        ctx.fillStyle = 'rgba(136, 204, 255, 0.35)';
        ctx.fillRect(Math.floor(px + cx - 3), Math.floor(bodyY + cy - 4), 6, 8);
        ctx.fillRect(Math.floor(px + cx - 4), Math.floor(bodyY + cy - 2), 8, 4);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fillRect(Math.floor(px + cx - 1), Math.floor(bodyY + cy - 2), 2, 2);
      }
    }
  }

  ctx.restore();
}

// ---- 冲刺拖尾渲染 ----
function drawDashTrail() {
  if (dashTrail.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 1; i < dashTrail.length; i++) {
    const prev = dashTrail[i - 1];
    const curr = dashTrail[i];
    const alpha = (curr.life / 10) * 0.7;
    const width = 6 + (curr.life / 10) * 4;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(prev.x - camera.x, prev.y - camera.y);
    ctx.lineTo(curr.x - camera.x, curr.y - camera.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawCreatures() {
  for (const c of creatures) {
    const cx = c.x - camera.x;
    const cy = c.y - camera.y;
    if (cx < -120 || cx > W + 120 || cy < -120 || cy > H + 120) continue;

    if (c.dead) {
      // 死亡敌人: 3 秒可融合闪烁期, 跳过位置修正逻辑只画闪烁
      if (c.fuseTimer > 0) {
        ctx.save();
        ctx.globalAlpha = 0.4 + Math.abs(Math.sin(gameTime * 0.3)) * 0.6;
        ctx.fillStyle = '#ff88ff';
        ctx.font = 'bold 12px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('✦', cx, cy - c.size - 18);
        ctx.font = '9px monospace';
        ctx.fillText(Math.ceil(c.fuseTimer / 60) + 's', cx, cy - c.size - 8);
        ctx.restore();
      }
      continue;
    }

    ctx.save();
    if (c.hurtFlash > 0 && Math.floor(c.hurtFlash / 2) % 2 === 0) {
      ctx.globalAlpha = 0.55;
    }
    if (c.stunned > 0) {
      ctx.fillStyle = '#ffff44';
      ctx.font = '14px monospace';
      ctx.fillText('★', cx - 4, cy - c.size - 10);
    }

    const pers = c.type.personality;
    const d2 = Math.hypot(c.x - player.x, c.y - player.y);
    if (pers === 'scared' && d2 < 200) {
      ctx.fillStyle = '#ffcc00';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!', cx, cy - c.size - 5);
    } else if (pers === 'aggressive' && d2 < 220) {
      ctx.fillStyle = '#ff4444';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('>', cx, cy - c.size - 5);
    }

    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + c.size * 0.7, c.size * 0.9, c.size * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    const bob = Math.sin(c.walkFrame * Math.PI / 2) * 1.2;
    const bodyY = cy + bob;
    const fill = c.type.color;
    const edge = c.type.bodyColor;
    const light = lightenColor(fill, 0.5);
    const shape = c.type.shape;
    const s = c.size;

    // ========= 根据形状绘制不同身体 =========
    if (shape === 'blob') {
      // 小孢胞: 半透明粘液球 + 内部气泡
      ctx.globalAlpha = 0.85;
      drawPixelEllipse(cx, bodyY, s, s * 0.85, fill, edge);
      ctx.globalAlpha = 1;
      // 内部气泡
      ctx.fillStyle = light;
      ctx.fillRect(Math.floor(cx - s * 0.3), Math.floor(bodyY - s * 0.4), 4, 4);
      ctx.fillRect(Math.floor(cx + s * 0.1), Math.floor(bodyY + s * 0.1), 3, 3);
      // 眼睛 (小而圆, 黑白色)
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(cx - s * 0.35 - 2), Math.floor(bodyY), 4, 4);
      ctx.fillRect(Math.floor(cx + s * 0.35 - 2), Math.floor(bodyY), 4, 4);
      ctx.fillStyle = '#fff';
      ctx.fillRect(Math.floor(cx - s * 0.35 - 1), Math.floor(bodyY + 1), 2, 2);
      ctx.fillRect(Math.floor(cx + s * 0.35 - 1), Math.floor(bodyY + 1), 2, 2);

    } else if (shape === 'spike') {
      // 刺甲虫: 椭圆硬壳 + 8 根尖刺
      // 底部尖刺
      ctx.fillStyle = edge;
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const sx = cx + Math.cos(ang) * s * 1.05;
        const sy = bodyY + Math.sin(ang) * s * 0.95;
        ctx.fillRect(Math.floor(sx - 3), Math.floor(sy - 3), 6, 6);
      }
      drawPixelEllipse(cx, bodyY, s, s * 0.75, fill, edge);
      // 壳上高光
      ctx.fillStyle = light;
      ctx.fillRect(Math.floor(cx - s * 0.4), Math.floor(bodyY - s * 0.4), 8, 4);
      // 眼睛（小黑点）
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(cx - s * 0.3), Math.floor(bodyY - 2), 3, 3);
      ctx.fillRect(Math.floor(cx + s * 0.15), Math.floor(bodyY - 2), 3, 3);

    } else if (shape === 'poison') {
      // 毒孢子: 紫色不规则形 + 冒泡的毒气
      drawPixelCircle(cx, bodyY, s, fill, edge);
      // 表面毒泡
      ctx.fillStyle = light;
      ctx.fillRect(Math.floor(cx - s * 0.4), Math.floor(bodyY - s * 0.3), 4, 4);
      ctx.fillRect(Math.floor(cx + s * 0.3), Math.floor(bodyY + s * 0.1), 3, 3);
      ctx.fillRect(Math.floor(cx - s * 0.1), Math.floor(bodyY + s * 0.4), 3, 3);
      // 顶部飘出毒气
      ctx.fillStyle = '#dd88ff';
      for (let i = 0; i < 4; i++) {
        const t = (gameTime * 0.02 + i * 0.3) % 1;
        const gx = cx + Math.sin(i * 1.5) * s * 0.4;
        const gy = bodyY - s * (0.8 + t * 0.6);
        ctx.globalAlpha = 1 - t;
        ctx.fillRect(Math.floor(gx - 2), Math.floor(gy - 2), 4, 4);
      }
      ctx.globalAlpha = 1;
      // 眼睛 - 紫色竖缝
      ctx.fillStyle = '#ff66ff';
      ctx.fillRect(Math.floor(cx - s * 0.35), Math.floor(bodyY - 1), 2, 5);
      ctx.fillRect(Math.floor(cx + s * 0.25), Math.floor(bodyY - 1), 2, 5);

    } else if (shape === 'flame') {
      // 火焰兽: 上方有跳动火焰 + 红色圆身体
      // 身体
      drawPixelEllipse(cx, bodyY, s, s * 0.9, fill, edge);
      // 顶部火焰（多层不同颜色）
      const flick = Math.sin(gameTime * 0.2) * 2;
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(Math.floor(cx - 4), Math.floor(bodyY - s - 2 + flick), 8, 8);
      ctx.fillStyle = '#ff8800';
      ctx.fillRect(Math.floor(cx - 6), Math.floor(bodyY - s + 2 + flick), 12, 6);
      ctx.fillStyle = '#ffff88';
      ctx.fillRect(Math.floor(cx - 2), Math.floor(bodyY - s + flick), 4, 6);
      // 身上燃烧点
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(Math.floor(cx - s * 0.5), Math.floor(bodyY + s * 0.2), 3, 3);
      ctx.fillRect(Math.floor(cx + s * 0.3), Math.floor(bodyY - s * 0.1), 3, 3);
      // 凶眼
      ctx.fillStyle = '#ffff00';
      ctx.fillRect(Math.floor(cx - s * 0.4 - 2), Math.floor(bodyY - 2), 5, 4);
      ctx.fillRect(Math.floor(cx + s * 0.3 - 2), Math.floor(bodyY - 2), 5, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(cx - s * 0.4), Math.floor(bodyY - 1), 2, 2);
      ctx.fillRect(Math.floor(cx + s * 0.3), Math.floor(bodyY - 1), 2, 2);

    } else if (shape === 'bolt') {
      // 雷电虫: 椭圆 + 围绕闪电效果
      drawPixelEllipse(cx, bodyY, s * 0.9, s * 0.7, fill, edge);
      // 闪电围绕
      const t = gameTime * 0.15;
      for (let i = 0; i < 3; i++) {
        const ang = t + (i / 3) * Math.PI * 2;
        const lx = cx + Math.cos(ang) * s * 1.2;
        const ly = bodyY + Math.sin(ang) * s * 0.9;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(lx - 2), Math.floor(ly - 4), 4, 3);
        ctx.fillRect(Math.floor(lx - 1), Math.floor(ly - 1), 2, 4);
      }
      // 眼睛 - 白色发光
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.floor(cx - s * 0.35 - 2), Math.floor(bodyY - 1), 4, 3);
      ctx.fillRect(Math.floor(cx + s * 0.25 - 2), Math.floor(bodyY - 1), 4, 3);

    } else if (shape === 'ghost') {
      // 隐形者: 半透明波浪形幽灵
      ctx.globalAlpha = 0.55;
      // 波浪底部
      drawPixelEllipse(cx, bodyY, s, s * 0.85, fill, edge);
      ctx.globalAlpha = 1;
      // 底部波浪
      ctx.fillStyle = edge;
      for (let i = 0; i < 5; i++) {
        const wx = cx - s + (i / 4) * s * 2;
        ctx.fillRect(Math.floor(wx - 2), Math.floor(bodyY + s * 0.6), 4, 4);
      }
      // 眼睛 - 空黑色空洞 + 绿色小点
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(cx - s * 0.35 - 2), Math.floor(bodyY - 2), 4, 4);
      ctx.fillRect(Math.floor(cx + s * 0.25 - 2), Math.floor(bodyY - 2), 4, 4);
      ctx.fillStyle = '#88ffcc';
      ctx.fillRect(Math.floor(cx - s * 0.35 - 1), Math.floor(bodyY - 1), 2, 2);
      ctx.fillRect(Math.floor(cx + s * 0.25 - 1), Math.floor(bodyY - 1), 2, 2);

    } else if (shape === 'rock') {
      // 石甲巨怪: 不规则大石头 + 棱角
      drawPixelRock(cx, bodyY, s, fill, edge, light);
      // 额外尖角
      ctx.fillStyle = edge;
      ctx.fillRect(Math.floor(cx - s * 0.9), Math.floor(bodyY - s * 0.3), 4, 6);
      ctx.fillRect(Math.floor(cx + s * 0.7), Math.floor(bodyY - s * 0.5), 4, 6);
      ctx.fillRect(Math.floor(cx - s * 0.3), Math.floor(bodyY - s * 1.0), 4, 4);
      // 眼睛 - 红色愤怒小眼睛
      ctx.fillStyle = '#ff2222';
      ctx.fillRect(Math.floor(cx - s * 0.3 - 2), Math.floor(bodyY - 2), 4, 4);
      ctx.fillRect(Math.floor(cx + s * 0.2 - 2), Math.floor(bodyY - 2), 4, 4);
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(cx - s * 0.3), Math.floor(bodyY), 2, 2);
      ctx.fillRect(Math.floor(cx + s * 0.2), Math.floor(bodyY), 2, 2);

    } else if (shape === 'fang') {
      // 迅捷猎手: 菱形尖牙 + 两侧尖刺
      drawPixelDiamond(cx, bodyY, s, fill, edge);
      // 背部尖刺
      ctx.fillStyle = darkenColor(fill, 0.7);
      ctx.fillRect(Math.floor(cx - s * 0.6), Math.floor(bodyY - s * 0.8), 4, 6);
      ctx.fillRect(Math.floor(cx - s * 0.3), Math.floor(bodyY - s * 1.0), 4, 8);
      ctx.fillRect(Math.floor(cx + s * 0.1), Math.floor(bodyY - s * 0.9), 4, 7);
      ctx.fillRect(Math.floor(cx + s * 0.4), Math.floor(bodyY - s * 0.7), 4, 5);
      // 顶部高光
      ctx.fillStyle = light;
      ctx.fillRect(Math.floor(cx - 3), Math.floor(bodyY - s * 0.2), 6, 4);
      // 眼睛 - 狭长凶狠
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(Math.floor(cx - s * 0.45), Math.floor(bodyY), 6, 2);
      ctx.fillRect(Math.floor(cx + s * 0.2), Math.floor(bodyY), 6, 2);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.floor(cx - s * 0.45), Math.floor(bodyY), 2, 2);
      ctx.fillRect(Math.floor(cx + s * 0.2), Math.floor(bodyY), 2, 2);

    } else if (shape === 'boss_core') {
      // 源质领主: 大核心 + 能量光环
      // 外光环 (动画)
      const ringSize = s * 1.3 + Math.sin(gameTime * 0.08) * 3;
      ctx.strokeStyle = light;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.5;
      ctx.beginPath();
      ctx.arc(cx, bodyY, ringSize, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      // 大核心
      drawPixelCircle(cx, bodyY, s, fill, edge);
      drawPixelCircle(cx, bodyY, s * 0.6, light, fill);
      // 内部旋转符号
      const rot = gameTime * 0.05;
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 4; i++) {
        const ang = rot + (i / 4) * Math.PI * 2;
        const px = cx + Math.cos(ang) * s * 0.35;
        const py = bodyY + Math.sin(ang) * s * 0.35;
        ctx.fillRect(Math.floor(px - 2), Math.floor(py - 2), 4, 4);
      }
      // 核心眼
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.floor(cx - 3), Math.floor(bodyY - 3), 6, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(Math.floor(cx - 1), Math.floor(bodyY - 1), 2, 2);

    } else if (shape === 'cthulhu') {
      // 深渊巨兽: 紫黑色九角主体 + 深紫暗色光环 + 5只黄眼 + 6条触手
      const isCharging = c.chargeDur > 0;
      const chargeStretch = isCharging ? 1.6 : 1.0;
      const bodyRy = s * (0.85 * (2 - chargeStretch));
      const bodyRx = s * chargeStretch;

      // 橙色冲锋拖尾
      if (isCharging) {
        for (let t = 0; t < 5; t++) {
          const trailAlpha = 0.6 - t * 0.1;
          const trailOff = (t + 1) * s * 0.5;
          const ang = Math.atan2(-(player.y - c.y), -(player.x - c.x));
          const tx = cx + Math.cos(ang) * trailOff;
          const ty = bodyY + Math.sin(ang) * trailOff * 0.3;
          ctx.globalAlpha = trailAlpha;
          ctx.fillStyle = '#ff6600';
          drawPixelEllipse(tx, ty, s * 0.7 - t * 6, s * 0.5 - t * 4, '#ff4400', '#882200');
        }
        ctx.globalAlpha = 1;
      }

      // 深紫暗色光环
      const haloR = s * 1.6 + Math.sin(gameTime * 0.06) * 4;
      const haloGrad = ctx.createRadialGradient(cx, bodyY, s * 0.8, cx, bodyY, haloR);
      haloGrad.addColorStop(0, 'rgba(40,10,70,0.5)');
      haloGrad.addColorStop(1, 'rgba(20,0,40,0)');
      ctx.fillStyle = haloGrad;
      ctx.fillRect(cx - haloR - 2, bodyY - haloR - 2, haloR * 2 + 4, haloR * 2 + 4);

      // 九角主体 (画 9 个角)
      for (let horn = 0; horn < 9; horn++) {
        const ang = (horn / 9) * Math.PI * 2 + gameTime * 0.008;
        const tipX = cx + Math.cos(ang) * bodyRx * 1.15;
        const tipY = bodyY + Math.sin(ang) * bodyRy * 1.15;
        const baseX = cx + Math.cos(ang) * bodyRx * 0.6;
        const baseY = bodyY + Math.sin(ang) * bodyRy * 0.6;
        ctx.fillStyle = '#221133';
        ctx.fillRect(Math.floor(tipX - 4), Math.floor(tipY - 4), 8, 8);
        ctx.fillStyle = '#442266';
        ctx.fillRect(Math.floor(baseX - 3), Math.floor(baseY - 3), 6, 6);
      }
      // 主体
      drawPixelEllipse(cx, bodyY, bodyRx, bodyRy, '#2a1155', '#110022');
      // 内部发光核
      drawPixelEllipse(cx, bodyY, bodyRx * 0.5, bodyRy * 0.5, '#6633aa', '#330055');

      // 5 只黄色眼睛均匀分布在外圈
      const eyeCount = 5;
      for (let e = 0; e < eyeCount; e++) {
        const ang = (e / eyeCount) * Math.PI * 2 + gameTime * 0.015;
        const er = s * 0.85;
        const ex = cx + Math.cos(ang) * er;
        const ey = bodyY + Math.sin(ang) * er;
        // 眼眶
        ctx.fillStyle = '#000';
        ctx.fillRect(Math.floor(ex - 4), Math.floor(ey - 4), 8, 8);
        // 黄瞳
        ctx.fillStyle = '#ffee00';
        ctx.fillRect(Math.floor(ex - 3), Math.floor(ey - 3), 6, 6);
        // 高光
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(ex - 1), Math.floor(ey - 1), 2, 2);
      }

      // 6 条触手 (sin 波动)
      const tentacleCount = 6;
      for (let t = 0; t < tentacleCount; t++) {
        const baseAng = (t / tentacleCount) * Math.PI * 2;
        const baseTX = cx + Math.cos(baseAng) * bodyRx;
        const baseTY = bodyY + Math.sin(baseAng) * bodyRy;
        const wave = gameTime * 0.08 + t * 1.2;
        // 画 4 节触手
        for (let seg = 0; seg < 4; seg++) {
          const segFrac = (seg + 1) / 4;
          const waveOff = Math.sin(wave + seg * 0.8) * segFrac * 10;
          const perpAng = baseAng + Math.PI / 2;
          const segLen = s * 0.35 * segFrac;
          const segTX = baseTX + Math.cos(baseAng) * segLen * 1.2 + Math.cos(perpAng) * waveOff;
          const segTY = baseTY + Math.sin(baseAng) * segLen * 0.7 + Math.sin(perpAng) * waveOff;
          ctx.fillStyle = seg % 2 === 0 ? '#551188' : '#331166';
          ctx.fillRect(Math.floor(segTX - 3), Math.floor(segTY - 3), 6, 6);
          // 吸盘
          if (seg === 3) {
            ctx.fillStyle = '#7744aa';
            ctx.fillRect(Math.floor(segTX - 2), Math.floor(segTY - 2), 4, 4);
          }
        }
      }
    }

    // ===== 通用: 中毒效果 =====
    if (c.poisoned > 0) {
      ctx.fillStyle = '#aa66ff';
      for (let i = 0; i < 3; i++) {
        const px = cx + Math.cos(gameTime * 0.1 + i * 2) * s * 0.8;
        const py = bodyY + Math.sin(gameTime * 0.15 + i) * s * 0.5 - s;
        ctx.fillRect(Math.floor(px - 1), Math.floor(py - 1), 2, 2);
      }
    }

    ctx.restore();

    // ---- 敌人 HP 条: 红绿渐变填充, Boss 更大 ----
    if (c.hp < c.maxHp) {
      const isBoss = c.isBoss;
      const bw = isBoss ? Math.max(50, c.size * 3) : Math.max(30, c.size * 2);
      const bh = isBoss ? 6 : 4;
      const hy = cy - c.size - 14 - (isBoss ? 4 : 0);
      const hpRatio = Math.max(0, c.hp / c.maxHp);
      // 底色 (深红)
      ctx.fillStyle = '#550000';
      ctx.fillRect(cx - bw / 2 - 1, hy, bw + 2, bh);
      // 填充: 50%以上绿色渐变到红色
      if (hpRatio > 0) {
        const barColor = hpRatio > 0.5
          ? `hsl(${120 * (hpRatio - 0.5) * 2},80%,50%)`
          : `hsl(${120 * hpRatio * 2},80%,50%)`;
        ctx.fillStyle = barColor;
        ctx.fillRect(cx - bw / 2, hy + 1, bw * hpRatio, bh - 2);
        // 高光
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(cx - bw / 2, hy + 1, bw * hpRatio, 1);
      }
    }
  }
}

function drawPixelCircle(cx, cy, r, fill, edge) {
  const step = 2;
  for (let y = -r; y <= r; y += step) {
    for (let x = -r; x <= r; x += step) {
      const d = Math.sqrt(x * x + y * y);
      if (d < r - 2) {
        ctx.fillStyle = fill;
        ctx.fillRect(Math.floor(cx + x), Math.floor(cy + y), step, step);
      } else if (d < r) {
        ctx.fillStyle = edge;
        ctx.fillRect(Math.floor(cx + x), Math.floor(cy + y), step, step);
      }
    }
  }
}

// 像素化椭圆（横向拉长）
function drawPixelEllipse(cx, cy, rx, ry, fill, edge) {
  const step = 2;
  for (let y = -ry; y <= ry; y += step) {
    for (let x = -rx; x <= rx; x += step) {
      const d = Math.sqrt((x * x) / (rx * rx) + (y * y) / (ry * ry));
      if (d < 0.85) {
        ctx.fillStyle = fill;
        ctx.fillRect(Math.floor(cx + x), Math.floor(cy + y), step, step);
      } else if (d < 1) {
        ctx.fillStyle = edge;
        ctx.fillRect(Math.floor(cx + x), Math.floor(cy + y), step, step);
      }
    }
  }
}

// 菱形
function drawPixelDiamond(cx, cy, r, fill, edge) {
  const step = 2;
  for (let y = -r; y <= r; y += step) {
    for (let x = -r; x <= r; x += step) {
      const d = Math.abs(x) / r + Math.abs(y) / r;
      if (d < 0.75) {
        ctx.fillStyle = fill;
        ctx.fillRect(Math.floor(cx + x), Math.floor(cy + y), step, step);
      } else if (d < 1) {
        ctx.fillStyle = edge;
        ctx.fillRect(Math.floor(cx + x), Math.floor(cy + y), step, step);
      }
    }
  }
}

// 矩形石头
function drawPixelRock(cx, cy, r, fill, edge, lighter) {
  const step = 2;
  const rx = r * 1.1;
  const ry = r * 0.85;
  for (let y = -ry; y <= ry; y += step) {
    for (let x = -rx; x <= rx; x += step) {
      const d = Math.pow(Math.abs(x) / rx, 1.4) + Math.pow(Math.abs(y) / ry, 1.4);
      if (d < 0.8) {
        ctx.fillStyle = fill;
        ctx.fillRect(Math.floor(cx + x), Math.floor(cy + y), step, step);
      } else if (d < 1) {
        ctx.fillStyle = edge;
        ctx.fillRect(Math.floor(cx + x), Math.floor(cy + y), step, step);
      }
    }
  }
  // 高光块
  ctx.fillStyle = lighter;
  ctx.fillRect(Math.floor(cx - r * 0.4), Math.floor(cy - r * 0.4), 6, 6);
  ctx.fillRect(Math.floor(cx - r * 0.4 + 6), Math.floor(cy - r * 0.4), 4, 4);
}

function drawAttackArc() {
  if (player.attackAnim <= 0) return;
  const px = player.x - camera.x;
  const py = player.y - camera.y;
  const r = player.attackRange + 20;
  const alpha = player.attackAnim / 15;
  ctx.save();
  ctx.globalAlpha = alpha * 0.4;
  ctx.strokeStyle = '#ffff88';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(px, py, r * (1 - alpha * 0.3), 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const px = p.x - camera.x;
    const py = p.y - camera.y;
    const baseAlpha = p.life / p.maxLife;
    const alpha = baseAlpha * (p.alpha !== undefined ? p.alpha : 1);
    if (alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    const s = p.size;

    switch (p.shape) {
      case 'triangle': {
        // 三角形碎片（predator 锯齿）
        const rot = (p.vx !== 0 ? Math.atan2(p.vy, p.vx) : 0);
        ctx.translate(px, py);
        ctx.rotate(rot);
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(-s * 0.8, s * 0.6);
        ctx.lineTo(s * 0.8, s * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        break;
      }
      case 'diamond': {
        // 菱形（crystal 晶体）
        ctx.fillRect(Math.floor(px - s * 0.4), Math.floor(py - s), Math.floor(s * 0.8), Math.floor(s * 2));
        ctx.fillRect(Math.floor(px - s), Math.floor(py - s * 0.4), Math.floor(s * 2), Math.floor(s * 0.8));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(Math.floor(px - s * 0.2), Math.floor(py - s * 0.5), Math.floor(s * 0.4), Math.floor(s));
        break;
      }
      case 'ghost': {
        // 鬼影残影（stealth 幻影）
        ctx.globalAlpha = alpha * 0.5;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(px, py, s, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = alpha * 0.2;
        ctx.beginPath();
        ctx.arc(px, py, s * 1.4, 0, Math.PI * 2);
        ctx.fill();
        break;
      }
      case 'bubble': {
        // 气泡（corrupt 脓疱）
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 1;
        ctx.globalAlpha = alpha * 0.8;
        ctx.beginPath();
        ctx.arc(px, py, s, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = alpha * 0.3;
        ctx.fill();
        break;
      }
      case 'ring': {
        // 圆环（psychic 能量环）
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, s, 0, Math.PI * 2);
        ctx.stroke();
        break;
      }
      case 'spark': {
        // 火花（armor 金属光点）
        ctx.fillRect(Math.floor(px - s / 2), Math.floor(py - 1), s, 2);
        ctx.fillRect(Math.floor(px - 1), Math.floor(py - s / 2), 2, s);
        break;
      }
      default: {
        // 默认矩形
        ctx.fillRect(Math.floor(px - s / 2), Math.floor(py - s / 2), s, s);
      }
    }
    ctx.restore();
  }
}

function drawFloatingTexts() {
  for (const t of floatingTexts) {
    const tx = t.x - camera.x;
    const ty = t.y - camera.y;
    const alpha = t.life / t.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(t.text, tx, ty);
    ctx.fillText(t.text, tx, ty);
    ctx.restore();
  }
}

// ---------- 颜色工具 ----------
function darkenColor(hex, factor) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgb(' + Math.floor(r * factor) + ',' + Math.floor(g * factor) + ',' + Math.floor(b * factor) + ')';
}
function lightenColor(hex, factor) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return 'rgb(' + Math.min(255, Math.floor(r + (255 - r) * factor)) + ',' +
               Math.min(255, Math.floor(g + (255 - g) * factor)) + ',' +
               Math.min(255, Math.floor(b + (255 - b) * factor)) + ')';
}

// ---------- 引导系统 ----------
const TUTORIAL_STEPS = [
  { key: 'move', text: 'WASD 移动探索' },
  { key: 'attack', text: '靠近敌人会自动攻击' },
  { key: 'fusion', text: '击败敌人后, 按 F 融合吸收性状' },
  { key: 'dna', text: '按 E 查看你的 DNA 图谱' }
];
let tutorialState = {
  active: false,
  index: 0,
  startedAt: 0,
  lastActionTime: 0,
  hasMoved: false,
  hasAttacked: false,
  hasPressedF: false,
  hasPressedE: false
};

function initTutorial() {
  try {
    if (typeof localStorage !== 'undefined') {
      if (localStorage.getItem('fusionEpoch_tutorial_done') === '1') {
        tutorialState.active = false;
        document.getElementById('tutorial-hint').classList.remove('show');
        return;
      }
    }
  } catch (e) {}
  tutorialState = {
    active: true,
    index: 0,
    startedAt: gameTime,
    lastActionTime: gameTime,
    hasMoved: false,
    hasAttacked: false,
    hasPressedF: false,
    hasPressedE: false
  };
  updateTutorialDisplay();
}

function markTutorialComplete() {
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.setItem('fusionEpoch_tutorial_done', '1');
    }
  } catch (e) {}
  document.getElementById('tutorial-hint').classList.remove('show');
  tutorialState.active = false;
}

function updateTutorialDisplay() {
  const hint = document.getElementById('tutorial-hint');
  if (!tutorialState.active || tutorialState.index >= TUTORIAL_STEPS.length) {
    hint.classList.remove('show');
    return;
  }
  hint.textContent = TUTORIAL_STEPS[tutorialState.index].text;
  hint.classList.add('show');
}

function advanceTutorialStep() {
  if (!tutorialState.active) return;
  tutorialState.index++;
  if (tutorialState.index >= TUTORIAL_STEPS.length) {
    markTutorialComplete();
  } else {
    tutorialState.lastActionTime = gameTime;
    updateTutorialDisplay();
  }
}

function updateTutorial(dt) {
  if (!tutorialState.active) return;
  // 每步最多 5 秒, 超过后自动切换
  const elapsed = gameTime - tutorialState.lastActionTime;
  if (elapsed > 300) { // 约 5 秒 (dt in 60fps 单位)
    advanceTutorialStep();
    return;
  }
  // 根据当前步骤检查动作是否完成
  const step = TUTORIAL_STEPS[tutorialState.index];
  if (!step) return;
  if (step.key === 'move' && tutorialState.hasMoved) advanceTutorialStep();
  else if (step.key === 'attack' && tutorialState.hasAttacked) advanceTutorialStep();
  else if (step.key === 'fusion' && tutorialState.hasPressedF) advanceTutorialStep();
  else if (step.key === 'dna' && tutorialState.hasPressedE) advanceTutorialStep();
}

// ---------- 小地图绘制 ----------
let minimapCtx = null;
function ensureMinimap() {
  if (minimapCtx) return;
  const c = document.getElementById('minimap');
  if (c) minimapCtx = c.getContext('2d');
}

function drawMinimap() {
  ensureMinimap();
  if (!minimapCtx) return;
  const size = 150;
  const cx = size / 2, cy = size / 2, r = size / 2 - 4;

  // 先画圆背景
  const ctx = minimapCtx;
  ctx.clearRect(0, 0, size, size);
  // 圆形底
  ctx.fillStyle = 'rgba(10, 15, 35, 0.8)';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  const sx = size / WORLD_W;
  const sy = size / WORLD_H;

  // 世界背景 (浅蓝 tint)
  ctx.fillStyle = 'rgba(40, 60, 100, 0.35)';
  ctx.fillRect(2, 2, WORLD_W * sx - 4, WORLD_H * sy - 4);

  // 绘制岩石 (深色点)
  ctx.fillStyle = 'rgba(90, 70, 50, 0.85)';
  for (const rc of rockClusters) {
    const mx = rc.x * sx;
    const my = rc.y * sy;
    const rr = Math.max(2, rc.r * sx);
    ctx.beginPath();
    ctx.arc(mx, my, rr, 0, Math.PI * 2);
    ctx.fill();
  }

  // 食物 (绿点)
  ctx.fillStyle = '#66ff99';
  for (const f of foodParticles) {
    ctx.fillRect(f.x * sx - 1, f.y * sy - 1, 3, 3);
  }

  // 敌人 (红点/橙点)
  for (const cr of creatures) {
    if (cr.dead) continue;
    ctx.fillStyle = cr.type.color || '#ff5566';
    const cs = Math.min(6, Math.max(3, cr.size / 5));
    ctx.beginPath();
    ctx.arc(cr.x * sx, cr.y * sy, cs, 0, Math.PI * 2);
    ctx.fill();
  }

  // 玩家 (白色较大点)
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#ffff88';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(player.x * sx, player.y * sy, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 摄像机视野框 (淡紫)
  ctx.strokeStyle = 'rgba(200, 180, 255, 0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(camera.x * sx, camera.y * sy, W * sx, H * sy);
}

        bossBadge.textContent = bd < 300 ? '极近!' : (bd < 500 ? '冲锋!' : '在附近');

  // DNA 面板
  const panel = document.getElementById('dna-traits');

    panel.innerHTML = '<div style="color:#666;font-size:11px;">还没有获得任何性状<br>击败生物后按 F 融合</div>';

    }).join('');
  }

// ========== 进化选择系统 ==========
let evolutionOptions = null;
let evolutionPickingActive = false;

// 根据当前吞噬倾向生成 3 个形态选项
function generateEvolutionOptions() {
  // 基于 traitPoints 加权 + 当前已解锁情况
  const weights = getBranchWeights();
  const branches = Object.keys(weights);

  // 进化顺序限制：第N次进化只能选 tier N（必须按顺序解锁）
  const evolCount = player.evolutionCount;
  // 已解锁的 tier：evolutionCount=0时只能选tier1，evolutionCount=1时只能选tier2...
  const unlockedTiers = evolCount; // 0-based: 0=只能tier1, 1=只能tier2 ...

  // 收集所有可用形态（未拥有的，且 tier 不超过已解锁上限）
  const available = [];
  for (const [id, def] of Object.entries(BODY_DEFS)) {
    if (player.unlockedBodies.includes(id)) continue;
    if (def.tier > unlockedTiers + 1) continue; // tier 不能超过"已进化次数+1"
    available.push(id);
  }

  if (available.length === 0) {
    // 全部解锁了，允许升级已有形态到更高 tier
    for (const [id, def] of Object.entries(BODY_DEFS)) {
      if (def.tier > unlockedTiers + 1) continue;
      available.push(id);
    }
  }

  // 从可用形态中按分支权重随机选 3 个
  const options = [];
  const used = new Set();
  const shuffled = available.slice().sort(() => Math.random() - 0.5);

  for (const id of shuffled) {
    if (options.length >= 3) break;
    const def = BODY_DEFS[id];
    if (!def) continue;
    // 同一分支已在选项中出现过则跳过（避免重复）
    const branchKey = def.branch + '_' + def.tier;
    if (used.has(branchKey)) continue;
    options.push(id);
    used.add(branchKey);
  }

  // 如果选项不足 3 个，补齐（放宽分支限制）
  let attempts = 0;
  while (options.length < 3 && available.length > 0 && attempts < 20) {
    const pick = available[Math.floor(Math.random() * available.length)];
    if (!options.includes(pick)) options.push(pick);
    attempts++;
  }

  return options;
}

function getBranchWeights() {
  const tp = player.traitPoints;
  return {
    predator: 1 + (tp.sharp || 0) + (tp.fast || 0),
    armor:    1 + (tp.tough || 0) + (tp.big || 0),
    psychic:  1 + (tp.flame || 0) + (tp.electric || 0) + (tp.regen || 0),
    stealth:  1 + (tp.stealth || 0) + (tp.venom || 0),
    corrupt:  1 + (tp.venom || 0),
    crystal:  1,
  };
}

// 显示进化选择面板
function showEvolutionPicker() {
  if (evolutionPickingActive) return;
  evolutionPickingActive = true;
  evolutionOptions = generateEvolutionOptions();
  gameState = 'evolution';
  // 显示 HTML 面板
  const panel = document.getElementById('evolution-panel');
  if (panel) {
    const cards = evolutionOptions.map((id, idx) => {
      const def = BODY_DEFS[id];
      if (!def) return '';
      return `
        <div class="evol-card" onclick="pickEvolution(${idx})" style="background: linear-gradient(135deg, ${def.colors.fill}22, ${def.colors.edge}33); border: 3px solid ${def.colors.glow};">
          <div class="evol-key">[${idx + 1}]</div>
          <div class="evol-name">${def.name}</div>
          <div class="evol-branch">${def.branchName} · 阶 ${def.tier}</div>
          <div class="evol-preview" style="background: radial-gradient(circle, ${def.colors.glow} 0%, ${def.colors.fill} 40%, ${def.colors.edge} 100%); box-shadow: 0 0 20px ${def.colors.glow};">
            ◆
          </div>
          <div class="evol-desc">${def.desc}</div>
          <div class="evol-stats">融合特质获得属性成长</div>
        </div>
      `;
    }).join('');
    panel.innerHTML = `
      <div class="evol-overlay">
        <div class="evol-title">◈ 选 择 进 化 形 态 ◈</div>
        <div class="evol-sub">当前 DNA: ${player.dna} · 进化次数: ${player.evolutionCount}</div>
        <div class="evol-cards">${cards}</div>
        <div class="evol-hint">按 1 / 2 / 3 选择一个形态永久改变外形</div>
      </div>
    `;
    panel.style.display = 'flex';
  }
}

// 选择形态
function pickEvolution(idx) {
  if (!evolutionPickingActive) return;
  const bodyId = evolutionOptions[idx];
  if (!bodyId) return;
  applyEvolution(bodyId);
}

function applyEvolution(bodyId) {
  const def = BODY_DEFS[bodyId];
  if (!def) return;

  // === 进化历史痕迹记录（在改变形态前保存旧状态）===
  const prevBodyType = player.bodyType;
  if (prevBodyType && prevBodyType !== bodyId) {
    const prevDef = BODY_DEFS[prevBodyType];
    if (prevDef) {
      player.evolutionHistory.push(prevBodyType);
      player.prevBranches.push(prevDef.branch);
      if (player.prevBranches.length > 3) player.prevBranches.shift();
    }
  }
  // 累加当前分支深度（当前阶数越高，痕迹越明显）
  player.branchDepth[def.branch] = (player.branchDepth[def.branch] || 0) + def.tier;

  player.bodyType = bodyId;
  if (!player.unlockedBodies.includes(bodyId)) {
    player.unlockedBodies.push(bodyId);
  }
  player.evolutionCount++;

  // 属性加成已移除（进化只改变外观和攻击方式）
  // 玩家属性通过打怪自然成长：每击杀 +0.5 攻击 / +2 生命

  // === 分支进化动画 ===
  const branch = def.branch;
  player.morphType = branch;
  player.morphProgress = 35;

  // 各分支专属粒子特效
  if (branch === 'predator') {
    // 撕裂重生：红色锯齿碎片 + 血腥粒子
    spawnParticles(player.x, player.y, '#ff2200', 30, 6);
    spawnParticles(player.x, player.y, '#cc0000', 20, 4);
    // 三角形碎片飞溅
    for (let i = 0; i < 14; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 3 + Math.random() * 5;
      particles.push({ x: player.x, y: player.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 35, maxLife: 35, color: '#ff4444', size: 4 + Math.random() * 4, shape: 'triangle' });
    }
    sfxAttackHit();
  } else if (branch === 'armor') {
    // 装甲合体：金色光点从四周飞入 + 火花
    for (let i = 0; i < 18; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * 180;
      particles.push({ x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist, vx: -Math.cos(ang) * 4, vy: -Math.sin(ang) * 4, life: 40, maxLife: 40, color: '#ffcc44', size: 4, shape: 'spark' });
    }
    // 碎片旋转合拢
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      particles.push({ x: player.x + Math.cos(ang) * 60, y: player.y + Math.sin(ang) * 60, vx: -Math.cos(ang) * 2, vy: -Math.sin(ang) * 2, life: 30, maxLife: 30, color: '#aa8844', size: 6, shape: 'rect' });
    }
    sfxFusion();
  } else if (branch === 'psychic') {
    // 元素爆发：三色能量环旋转收缩
    const ringColors = ['#ff8800', '#ffff44', '#88ddff'];
    for (let ring = 0; ring < 3; ring++) {
      for (let i = 0; i < 12; i++) {
        const ang = (i / 12) * Math.PI * 2 + ring * 0.5 + gameTime * 0.1;
        const dist = 40 + ring * 25;
        particles.push({ x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist, vx: -Math.cos(ang) * 1.5, vy: -Math.sin(ang) * 1.5, life: 30, maxLife: 30, color: ringColors[ring], size: 5, shape: 'ring' });
      }
    }
    spawnParticles(player.x, player.y, '#ffffff', 15, 3);
    sfxStageUp();
  } else if (branch === 'stealth') {
    // 幻影隐现：半透明残影 + 紫色光晕
    for (let i = 0; i < 4; i++) {
      const offX = (Math.random() - 0.5) * 60;
      const offY = (Math.random() - 0.5) * 60;
      particles.push({ x: player.x + offX, y: player.y + offY, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, life: 40, maxLife: 40, color: '#aa44ff', size: 12 + i * 5, alpha: 0.5, shape: 'ghost' });
    }
    spawnParticles(player.x, player.y, '#ff66ff', 12, 2);
    // 无音效（安静）
  } else if (branch === 'corrupt') {
    // 畸形变异：绿色气泡上浮 + 脓疱破裂
    for (let i = 0; i < 22; i++) {
      const ang = Math.random() * Math.PI * 2;
      const dist = Math.random() * 15;
      particles.push({ x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist, vx: (Math.random() - 0.5) * 2, vy: -(1.5 + Math.random() * 2.5), life: 35, maxLife: 35, color: Math.random() < 0.5 ? '#88ff44' : '#44aa22', size: 4 + Math.random() * 6, shape: 'bubble' });
    }
    sfxPlayerHurt();
  } else if (branch === 'crystal') {
    // 晶化生长：白色菱形向外辐射
    for (let i = 0; i < 20; i++) {
      const ang = (i / 20) * Math.PI * 2;
      const spd = 1.5 + Math.random() * 2.5;
      particles.push({ x: player.x, y: player.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 30, maxLife: 30, color: i % 2 === 0 ? '#ffffff' : '#88ccff', size: 5 + Math.random() * 5, shape: 'diamond' });
    }
    // 闪白提示
    flashMessage('✦ 结晶 ✦');
    sfxDash();
  } else {
    // 默认通用动画
    spawnParticles(player.x, player.y, def.colors.glow, 40, 6);
    spawnParticles(player.x, player.y, def.colors.fill, 25, 4);
    sfxStageUp();
  }

  triggerShake(8);
  flashMessage('◈ 进化为 ' + def.name + ' ◈');

  // 关闭面板
  evolutionPickingActive = false;
  evolutionOptions = null;
  const panel = document.getElementById('evolution-panel');
  if (panel) panel.style.display = 'none';
  gameState = 'playing';
}
</script>
</body>
</html>
