<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>休三招聘 · Web 原型</title>
  <style>
    :root{--navy:#1f2a5a;--navy2:#182247;--ink:#172033;--muted:#5d6678;--paper:#f6f5f1;--surface:#fff;--line:#e5e7eb;--gold:#d89b2b;--green:#2e7d63;--orange:#c66a3b;--red:#b94343;--shadow:0 10px 30px rgba(23,32,51,.06)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}.serif,h1,h2,h3{font-family:"Noto Serif SC","Songti SC",serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:68px;border-bottom:1px solid var(--line);background:#ffffffeb;backdrop-filter:blur(12px);display:flex;align-items:center;gap:32px;padding:0 max(28px,calc((100vw - 1280px)/2));position:sticky;top:0;z-index:10}.brand{font:700 20px/1 "Noto Serif SC","Songti SC",serif;color:var(--navy);white-space:nowrap}.brand i{display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:50%;margin:0 4px 6px}.nav{display:flex;align-items:stretch;gap:24px;height:68px;flex:1}.nav button,.ghost{background:none;border:0;color:var(--muted);padding:0}.nav button.active{color:var(--navy);font-weight:700;border-bottom:2px solid var(--gold)}.top-right{display:flex;align-items:center;gap:14px}.avatar{width:32px;height:32px;border-radius:50%;background:#e7ebf5;color:var(--navy);display:grid;place-items:center;font-weight:700}.shell{max-width:1280px;margin:auto;padding:28px 24px 64px}.page-head{display:flex;align-items:end;justify-content:space-between;margin:6px 0 22px}.page-head h1{font-size:30px;line-height:1.2;margin:0;color:var(--navy)}.page-head p{color:var(--muted);margin:6px 0 0}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.pad{padding:22px}.grid{display:grid;gap:18px}.two{grid-template-columns:1.6fr .9fr}.three{grid-template-columns:repeat(3,1fr)}.split{display:grid;grid-template-columns:250px 1fr 280px;gap:18px}.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:9px;padding:10px 15px;font-weight:700}.btn:hover{background:var(--navy2)}.btn.secondary{background:#fff;color:var(--navy)}.btn.gold{background:var(--gold);border-color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}.pill{display:inline-flex;gap:5px;align-items:center;border-radius:99px;padding:4px 9px;font-size:12px;background:#f0f2f7;color:#45516f}.pill.gold{background:#fff4dc;color:#8b6316}.pill.green{background:#e9f5ef;color:#21634d}.pill.orange{background:#fff1eb;color:#a8532d}.pill.red{background:#fceeee;color:#9d3838}.muted{color:var(--muted)}.tiny{font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title h2{margin:0;font-size:20px;color:var(--navy)}.icon{display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy)}.input,select,textarea{width:100%;border:1px solid #d8dce5;border-radius:9px;background:#fff;padding:10px 11px;color:var(--ink)}.input:focus,select:focus,textarea:focus{outline:2px solid #dfe4f6;border-color:var(--navy)}label{display:block;font-weight:700;margin:0 0 7px}.field{margin:0 0 16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:14px}.divider{height:1px;background:var(--line);margin:18px 0}.notice{padding:12px 14px;border-radius:10px;background:#fff8e9;color:#785b1c;font-size:13px}.success{padding:12px 14px;border-radius:10px;background:#e9f5ef;color:#21634d;font-size:13px}.sidebar{padding:16px}.sidebar button{display:block;width:100%;text-align:left;padding:10px;border:0;border-radius:8px;background:none;color:var(--muted)}.sidebar button.active,.sidebar button:hover{color:var(--navy);background:#eef1f8;font-weight:700}.job{padding:18px;border-bottom:1px solid var(--line)}.job:last-child{border-bottom:0}.job h3{margin:4px 0 3px;color:var(--navy);font-size:19px}.job:hover{background:#fbfcff}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px}.signal{position:relative;min-height:330px;overflow:hidden;background:linear-gradient(145deg,#1f2a5a,#2c3b73);color:#fff;border-radius:24px;padding:34px}.signal:before,.signal:after{content:"";position:absolute;border:1px solid #ffffff36;border-radius:50%;width:390px;height:390px;right:-115px;top:-68px}.signal:after{width:270px;height:270px;right:-56px;top:-7px;border-color:#d89b2b99}.signal>*{position:relative;z-index:1}.orb{width:76px;height:76px;border-radius:50%;border:2px solid #e8c36f;box-shadow:0 0 0 11px #ffffff14,0 0 0 23px #ffffff0d,0 0 35px #d89b2b77;margin-bottom:28px;animation:pulse 3.2s ease-in-out infinite}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.chip{border:1px solid #cfd5e4;border-radius:99px;background:#fff;padding:7px 11px;color:#46516b}.signal .chip{background:#ffffff12;border-color:#ffffff38;color:#fff}.ask{display:flex;gap:9px;background:#fff;border-radius:12px;padding:8px;margin-top:22px}.ask input{border:0;padding:8px;min-width:0}.ask input:focus{outline:0}.ask button{border:0;border-radius:8px;background:var(--gold);color:#382805;padding:0 14px;font-weight:700}.stat{padding:17px}.stat strong{display:block;font:700 29px/1.2 "Noto Serif SC","Songti SC",serif;color:var(--navy);margin:7px 0}.company{padding:18px}.company h3{font-size:19px;margin:8px 0;color:var(--navy)}.feed{padding:17px;border-bottom:1px solid var(--line)}.feed:last-child{border:0}.feed h3{margin:0 0 8px;font-size:16px}.rating{color:var(--gold);letter-spacing:2px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;background:#fafbfc}.table th,.table td{padding:12px;border-bottom:1px solid var(--line)}.table tr:hover td{background:#fbfcff}.stage{display:flex;gap:4px;align-items:center}.stage b{width:24px;height:4px;border-radius:9px;background:#dfe4eb}.stage b.on{background:var(--gold)}.banner{padding:18px 20px;background:#edf1fb;border:1px solid #dfe5f5;border-radius:14px;color:#33436e}.modal-bg{position:fixed;inset:0;background:#17203370;display:grid;place-items:center;z-index:30;padding:20px}.modal{max-width:520px;width:100%;background:#fff;border-radius:16px;padding:26px;box-shadow:0 20px 60px #0004}.modal h2{margin:0 0 8px;color:var(--navy)}.toast{position:fixed;right:24px;bottom:24px;background:#172033;color:#fff;padding:13px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50}.landing{min-height:100vh;background:var(--paper)}.landing .top{position:static}.hero{max-width:1280px;margin:auto;min-height:690px;padding:78px 24px;display:grid;grid-template-columns:1fr .86fr;gap:56px;align-items:center}.hero h1{font-size:58px;line-height:1.12;color:var(--navy);margin:12px 0 18px}.hero p{font-size:18px;color:var(--muted);max-width:570px}.hero-visual{min-height:470px;border-radius:30px;background:#202b5c;position:relative;overflow:hidden;padding:38px;color:#fff}.hero-visual:before,.hero-visual:after{content:"";position:absolute;border:1px solid #ffffff2d;border-radius:50%;width:560px;height:560px;right:-240px;top:-130px}.hero-visual:after{width:370px;height:370px;right:-145px;top:-30px;border-color:#d89b2b99}.hero-visual .orb{margin-top:86px;width:100px;height:100px}.hero-visual p{color:#dfe5ff;font-size:15px}.role{display:flex;gap:12px;margin-top:28px}.role .btn{min-width:125px}.auth{max-width:470px;margin:58px auto}.steps{display:flex;gap:9px;margin:0 0 22px}.steps span{padding:5px 9px;border-radius:99px;background:#eef1f8;color:#526080;font-size:12px}.steps span.on{background:#fff4dc;color:#8b6316}.check{display:flex;gap:8px;margin:8px 0;align-items:flex-start}.audit{border-left:2px solid #d8dde8;padding-left:14px}.audit div{margin:0 0 14px}.hide{display:none}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 14px #ffffff14,0 0 0 30px #ffffff0b,0 0 45px #d89b2baa}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:900px){.top{padding:0 16px;gap:14px}.nav{gap:10px}.nav button:nth-child(n+4){display:none}.shell{padding:20px 14px}.two,.three,.split,.hero{grid-template-columns:1fr}.hero{padding:46px 20px}.hero h1{font-size:42px}.hero-visual{min-height:330px}.table{font-size:12px;display:block;overflow:auto}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const S={route:'P01',toast:'',modal:null,query:'',applied:false,reviewed:false,cert:'基础认证',reduced:false};
    const nav=[['P03','找职位'],['P07','找企业'],['P08','作息认证'],['P09','职场社区'],['P04','企业入驻']];
    const jobs=[['产品设计师','上海 · 徐汇','18–28K·14薪','双休认证','云岚科技','2小时前'],['前端工程师','杭州 · 西湖','20–32K·15薪','三休先锋','和光设计','今天 09:20'],['用户研究员','北京 · 海淀','16–25K·13薪','双休认证','漫游网络','昨天']];    
    const go=r=>{S.route=r;S.modal=null;render();window.scrollTo(0,0)};
    const toast=t=>{S.toast=t;render();setTimeout(()=>{S.toast='';render()},2400)};
    const button=(t,fn,cls='btn')=>`<button class="${cls}" onclick="${fn}">${t}</button>`;
    const badges=(a)=>a.map(x=>`<span class="pill ${x.includes('三休')?'gold':x.includes('持续')||x.includes('验证')?'green':''}">${x}</span>`).join('');
    const topBar=()=>`<header class="top"><button class="brand" onclick="go('P03')">休<i></i>三招聘</button><nav class="nav">${nav.map(n=>`<button class="${S.route===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav><div class="top-right"><button class="ghost" onclick="go('P14')">通知 · 2</button><button class="avatar" onclick="go('P10')">周</button></div></header>`;
    const side=(items,active)=>`<aside class="card sidebar">${items.map(x=>`<button class="${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}${x[2]?` <span class="pill gold">${x[2]}</span>`:''}</button>`).join('')}</aside>`;
    const jobCard=(j,i=0)=>`<article class="job"><div class="between"><div><h3>${j[0]}</h3><div class="muted">${j[4]} · 已通过 ${j[3]}</div></div>${button('查看岗位',`go('P06')`,'btn secondary')}</div><div class="meta"><span>${j[1]}</span><b style="color:var(--navy)">${j[2]}</b><span>${j[5]}</span></div><div class="chips">${badges([j[3],'五险一金','员工验证福利'])}</div></article>`;
    const companyHead=()=>`<div class="card pad"><div class="between"><div><div class="row"><span class="pill green">✓ ${S.cert}</span><span class="pill gold">双休</span><span class="muted tiny">认证更新于 2026-07-12</span></div><h1 style="font-size:30px;margin:12px 0 5px">云岚科技</h1><p class="muted">企业服务 · 200–499人 · 上海徐汇</p></div><div class="row">${button('收藏企业',"toast('已加入企业收藏')",'btn secondary')}${button('查看在招职位',"go('P06')")}</div></div><div class="divider"></div><div class="row">${badges(['工作日：周一至周五','10:00–18:30','加班可调休','远程协作每周 1 天'])}</div></div>`;
    function landing(){return `<div class="landing">${topBar()}<main class="hero"><section><div class="tiny" style="color:var(--gold);font-weight:700;letter-spacing:.12em">只向双休 / 三休企业开放</div><h1>让休息，成为<br>找工作的第一条件。</h1><p>先看企业作息认证、福利来源和员工体验，再决定是否投递。我们把招聘信息中最容易被忽略的部分，放到最前面。</p><div class="role">${button('我要找工作',"go('P03')")}${button('企业申请入驻',"go('P04')",'btn secondary')}</div><div class="chips"><span class="pill green">认证企业 128 家</span><span class="pill gold">三休先锋 17 家</span><span class="pill">演示数据</span></div></section><aside class="hero-visual"><div class="orb"></div><div class="tiny" style="color:#e8c36f">休三顾问 · 已准备就绪</div><h2 style="font-size:30px;margin:8px 0">今天，想把时间留给什么？</h2><p>告诉我你的城市、岗位或作息底线。我会整理条件并带你查看可验证的信息。</p><div class="ask"><input placeholder="例如：找杭州三休的产品岗位" oninput="S.query=this.value"><button onclick="go('P03')">开始</button></div></aside></main></div>`}
    function home(){return `${topBar()}<main class="shell"><section class="signal"><div class="orb"></div><div class="tiny" style="color:#e8c36f">休三顾问 · 规则化演示</div><h1 style="color:#fff;font-size:38px;margin:8px 0">先把你的时间，<br>留给值得的工作。</h1><p style="color:#dfe5ff;max-width:530px">我能帮你筛选岗位、比较企业、整理投递草稿；涉及投递、点评和举报时，会先请你确认。</p><div class="chips"><button class="chip" onclick="ask('帮我筛选上海双休岗位')">筛选上海双休岗位</button><button class="chip" onclick="ask('比较云岚科技和和光设计')">比较两家企业</button><button class="chip" onclick="go('P11')">完善求职偏好</button></div><div class="ask"><input id="askInput" value="${S.query}" placeholder="说说你想找怎样的工作" oninput="S.query=this.value"><button onclick="ask(S.query)">发送</button></div></section><section class="grid three" style="margin-top:18px"><div class="card stat"><span class="muted">已认证企业</span><strong>128</strong><span class="pill green">本周新增 6 家</span></div><div class="card stat"><span class="muted">三休先锋岗位</span><strong>46</strong><span class="pill gold">查看岗位</span></div><div class="card stat"><span class="muted">员工验证福利</span><strong>1,632</strong><span class="pill">来自演示反馈</span></div></section><section class="grid two" style="margin-top:18px"><div class="card"><div class="section-title pad"><h2>为你推荐</h2><button class="ghost" onclick="go('P05')">查看全部 →</button></div>${jobs.slice(0,2).map(jobCard).join('')}</div><div class="card pad"><div class="section-title"><h2>今天的企业话题</h2><button class="ghost" onclick="go('P09')">进入社区 →</button></div><div class="feed"><b># 双休是否真的兑现？</b><p class="muted">如何从认证口径和员工反馈中读出例外情况</p><span class="tiny">42 人参与讨论</span></div><div class="feed"><b># 校招生如何看福利</b><p class="muted">社保、公积金和加班补偿分别该怎么问</p><span class="tiny">28 人收藏</span></div></div></section></main>`}
    function ask(q){S.query=q||'杭州 三休 产品';S.route='P05';toast(`已整理条件：${S.query}`);render()}
    function search(){return `${topBar()}<main class="shell"><div class="page-head"><div><h1>找到适合你的工作</h1><p>全部数据为原型演示；认证状态会在真实平台随复核更新。</p></div>${button('让顾问帮我筛选',"go('P03')",'btn secondary')}</div><div class="split">${side([['P05','筛选条件'],['P07','企业认证'],['P08','福利与口碑']], 'P05')}<section class="card"><div class="pad"><div class="row"><input class="input" value="${S.query||'产品 / 前端 / 用户研究'}" oninput="S.query=this.value"><select><option>上海</option><option>杭州</option><option>全国</option></select>${button('搜索',"toast('已刷新演示职位')")}</div><div class="chips">${['双休认证','三休先锋','五险一金','加班补偿','员工验证福利'].map(x=>`<button class="chip" onclick="toast('已应用筛选：${x}')">${x}</button>`).join('')}</div></div><div class="banner" style="margin:0 18px 10px">顾问理解：<b>${S.query||'产品 / 前端 / 用户研究'}</b> · 优先展示已认证企业和已验证福利信息。你可以随时调整条件。</div>${jobs.map(jobCard).join('')}</section><aside class="card pad"><h3 style="margin-top:0">认证怎么看？</h3><p class="muted">基础认证代表材料审核通过；持续认证会结合复核和反馈更新。</p><div class="divider"></div><span class="pill green">✓ 基础认证</span><p class="tiny muted">制度及主体材料已审核</p><span class="pill gold">三休先锋</span><p class="tiny muted">展示明确工作日与例外说明</p></aside></div></main>`}
    function jobDetail(){return `${topBar()}<main class="shell"><div class="grid two"><section class="card pad"><div class="between"><div><span class="pill gold">三休先锋</span><h1 style="margin:12px 0 7px">前端工程师</h1><div class="meta"><b style="color:var(--navy)">20–32K · 15薪</b><span>杭州 · 西湖</span><span>3–5年</span><span>本科</span></div></div><button class="icon" onclick="toast('已收藏岗位')">☆</button></div><div class="divider"></div><h2>岗位职责</h2><p>参与招聘信息、企业可信档案与员工口碑模块的前端实现，和产品、设计共同完善可理解的作息与福利信息展示。</p><h2>作息与福利</h2><div class="notice"><b>企业认证口径：</b>周一至周四工作，周五为团队弹性学习日；业务紧急时按制度申请调休与补偿。岗位描述已通过一致性校验。</div><div class="chips">${badges(['三休先锋','远程协作','五险一金','年度学习预算','员工验证福利'])}</div><h2>任职要求</h2><p>熟悉 React、TypeScript 和现代前端工程化；重视可访问性、信息密度和真实用户反馈。</p></section><aside class="grid"><div class="card pad"><h2 style="margin-top:0">投递前确认</h2><p class="muted">你将向和光设计提交当前简历。企业只能查看你主动投递的版本。</p>${S.applied?`<div class="success">✓ 已投递。可在“我的求职中心”查看状态。</div>${button('查看投递进度',"go('P10')",'btn secondary')}`:button('选择简历并投递',"S.modal='apply';render()")}<button class="ghost" style="margin-top:14px" onclick="go('P11')">先完善简历 →</button></div><div class="card pad"><h3 style="margin-top:0">和光设计</h3><p class="muted">体验设计 · 100–199人</p>${badges(['持续认证','三休先锋'])}<div class="divider"></div><button class="ghost" onclick="go('P07')">查看企业档案、口碑与福利 →</button></div><div class="card pad"><button class="ghost" onclick="go('P13')">岗位信息有问题？保密反馈 →</button></div></aside></div></main>`}
    function company(){return `${topBar()}<main class="shell">${companyHead()}<div class="grid two" style="margin-top:18px"><section class="grid"><div class="card pad"><div class="section-title"><h2>在招职位</h2><button class="ghost" onclick="go('P05')">全部 5 个岗位 →</button></div>${jobs.slice(0,2).map(jobCard).join('')}</div><div class="card pad"><div class="section-title"><h2>制度说明</h2><span class="pill green">平台审核</span></div><p><b>双休：</b>周一至周五 10:00–18:30，午休 1.5 小时。</p><p><b>加班：</b>临时项目须记录；优先调休，无法调休时提供补偿。</p><p><b>例外岗位：</b>客户支持团队设轮值，排班规则已公开。</p><button class="ghost" onclick="go('P13')">发现制度与实际不符？保密举报 →</button></div></section><aside class="grid"><div class="card pad"><div class="section-title"><h2>福利来源</h2><button class="ghost" onclick="go('P08')">查看全部 →</button></div><p>五险一金 <span class="pill green">员工验证 18</span></p><p>远程协作 <span class="pill green">员工验证 12</span></p><p>学习预算 <span class="pill">企业自述</span></p></div><div class="card pad"><h2>员工体验</h2><div class="rating">★★★★☆</div><p class="muted">反馈样本 8 份，未展示综合分</p><p>“固定下班时间基本能兑现，忙的时候会提前说明调休安排。”</p><button class="ghost" onclick="go('P08')">查看点评与企业回应 →</button></div><div class="card pad"><h2>相关社区讨论</h2><p class="muted">“云岚的客户支持轮值是怎样安排的？”</p><button class="ghost" onclick="go('P09')">进入企业社区 →</button></div></aside></div></main>`}

pan class="pill">已投递</span></td><td><button class="ghost" onclick="toast('已打开简历预览（演示）')">查看简历</button></td></tr></table></div>`,voice:`<div class="grid two"><div class="card pad"><h2>待回应点评</h2><p>“学习预算申请流程是否需要直属主管批准？”</p><textarea rows="5" placeholder="填写公开回应，平台审核通过后展示。"></textarea><div style="margin-top:12px">${button('提交回应',"toast('回应已提交审核')")}</div></div><div class="card pad"><h2>认证与内容申诉</h2><p class="muted">申诉不等于删除用户内容。请提交具体理由和受限材料说明。</p>${button('发起申诉',"go('P13')",'btn secondary')}</div></div>`}[type];return `${topBar()}<main class="shell"><div class="page-head"><div><h1>云岚科技 · 招聘工作台</h1><p>演示企业管理员视图</p></div><span class="pill green">基础认证有效</span></div><div class="split">${side(eSide,{'dash':'P16','profile':'P17','jobs':'P18','candidates':'P19','voice':'P20'}[type])}<section>${content}</section><aside class="card pad"><h2>认证状态</h2><span class="pill green">✓ 基础认证</span><p class="muted">资料变更、定期复核或有效举报可能更新公开状态。</p><div class="divider"></div><h3>提醒</h3><p class="tiny muted">前台信息只能以审核通过版本为准。</p></aside></div></main>`}
    const oSide=[['P21','审核总览'],['P22','企业与认证','6'],['P23','职位审核','3'],['P24','内容与举报','9'],['P25','数据与审计']];
    function ops(type='dash'){const content={dash:`<div class="grid three">${[['待审核企业','6','含 2 个补件'],['待审职位','3','1 个存在制度不一致'],['内容与案件','9','2 个高风险线索']].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong><span class="pill orange">${x[2]}</span></div>`).join('')}</div><div class="card pad" style="margin-top:18px"><h2>风险提醒</h2><p>云岚科技收到 2 条关于轮值安排的结构化反馈，可创建认证复核任务。</p>${button('查看内容审核',"go('P24')",'btn secondary')}</div>`,cert:`<div class="card pad"><div class="between"><div><h2>云岚科技 · 认证复核</h2><p class="muted">主体、制度与受限材料仅在此审核视图可见。</p></div><span class="pill orange">需复核</span></div><div class="grid two"><div><h3>企业申报制度</h3><p>周一至周五 10:00–18:30；客户支持轮值，调休规则公开。</p><h3>复核线索</h3><p>2 条员工反馈提及轮值安排，均未主张强制加班。</p></div><div class="notice">演示材料：营业执照.pdf、制度摘录.pdf<br>真实环境需受限存储与审计访问。</div></div><div class="divider"></div>${button('维持认证',"S.cert='持续认证';toast('已记录维持认证决定');render()")} ${button('要求补件',"toast('已向企业发送补件请求')",'btn secondary')} ${button('暂停认证',"toast('暂停认证需要二次确认（演示）')",'btn secondary')}<div class="audit" style="margin-top:22px"><div><b>07-15 10:24 · 审核员 小许</b><p class="muted tiny">创建复核任务，关联两条结构化员工反馈。</p></div></div></div>`,jobReview:`<div class="card pad"><h2>职位审核 · 前端工程师</h2><div class="grid two"><div><h3>职位描述</h3><p>周一至周四工作，周五为弹性学习日；紧急项目可安排调休。</p></div><div><h3>企业认证制度</h3><p>当前为双休认证。企业尚未提交三休制度变更。</p><span class="pill red">存在不一致</span></div></div><div class="notice">处理建议：要求企业修改职位文案，或先完成企业作息制度变更审核。</div><div style="margin-top:14px">${button('要求修改',"toast('已退回职位并附带原因')")} ${button('通过',"toast('不允许：存在认证不一致')",'btn secondary')}</div></div>`,content:`<div class="card pad"><div class="between"><div><h2>内容与举报审核</h2><p class="muted">所有处理需记录理由；不得自动处罚。</p></div><span class="pill orange">高风险线索</span></div><div class="divider"></div><p><b>员工点评：</b>“轮值安排有时会临时调整，希望提前通知。”</p><p><b>验证等级：</b><span class="pill green">在职员工 · 已验证</span></p><p><b>可见范围：</b>公开点评；关联举报材料仅审核员可见。</p><div class="notice">该内容未包含隐私或严重未核实指控；建议发布，并创建企业复核任务查看轮值制度。</div><div style="margin-top:14px">${button('发布并创建复核',"toast('已发布内容，复核任务已创建')")} ${button('退回修改',"toast('已退回并说明原因')",'btn secondary')}</div></div>`,audit:`<div class="card"><div class="pad between"><h2 style="margin:0">运营数据与审计记录</h2><span class="pill">演示数据</span></div><table class="table"><tr><th>时间</th><th>对象</th><th>操作</th><th>操作者</th><th>理由</th></tr><tr><td>07-15 10:24</td><td>云岚科技</td><td>创建认证复核</td><td>小许</td><td>关联员工反馈</td></tr><tr><td>07-15 09:40</td><td>前端工程师</td><td>退回职位</td><td>小许</td><td>作息制度不一致</td></tr><tr><td>07-14 16:18</td><td>点评 #R-021</td><td>公开发布</td><td>小林</td><td>完成脱敏审核</td></tr></table></div>`}[type];return `${topBar()}<main class="shell"><div class="page-head"><div><h1>平台运营审核台</h1><p>演示审核员视图 · 所有决定需人工处理并写入审计记录。</p></div><span class="pill red">今日高优先级 2</span></div><div class="split">${side(oSide,{'dash':'P21','cert':'P22','jobReview':'P23','content':'P24','audit':'P25'}[type])}<section>${content}</section><aside class="card pad"><h2>处理原则</h2><p class="muted">认证结论、用户公开内容和举报案件分别处理；举报人身份不向企业公开。</p><p class="tiny muted">当前为原型演示，数据不代表真实平台结论。</p></aside></div></main>`}
    function modal(){if(!S.modal)return '';if(S.modal==='apply')return `<div class="modal-bg"><section class="modal"><h2>确认投递</h2><p class="muted">将向和光设计投递“前端工程师”岗位。企业仅可查看你主动提交的当前简历版本。</p><div class="notice">投递后无法由数字人顾问撤回；请确认岗位、企业和简历内容。</div><div class="row" style="margin-top:18px">${button('确认投递',"S.applied=true;S.modal=null;toast('投递成功，已同步到求职中心');render()")}${button('返回检查',"S.modal=null;render()",'btn secondary')}</div></section></div>`;return `<div class="modal-bg"><section class="modal"><h2>确认提交点评</h2><p class="muted">你提交的内容会先进入人工审核。公开时将展示匿名昵称、就业状态和验证等级，不展示你的身份信息。</p><div class="row">${button('确认提交',"S.reviewed=true;S.modal=null;toast('点评已进入审核队列');render()")}${button('继续修改',"S.modal=null;render()",'btn secondary')}</div></section></div>`}
    function render(){let p={P01:landing,P02:()=>`${topBar()}<main class="shell auth"><section class="card pad"><h1>登录休三招聘</h1><p class="muted">本原型使用固定 Mock 验证码：123456</p><div class="field"><label>手机号</label><input class="input" value="13800008821"></div><div class="field"><label>验证码</label><div class="row"><input class="input" placeholder="输入 123456"><button class="btn secondary" onclick="toast('验证码已发送：123456')">获取验证码</button></div></div><p class="tiny"><input type="checkbox" checked> 我已阅读平台规则和隐私说明</p>${button('登录并进入找工作',"go('P03')")}<div class="divider"></div><button class="ghost" onclick="go('P15')">我是企业管理员 →</button><br><button class="ghost" onclick="go('P21')">我是审核员（演示入口） →</button></section></main>`,P03:home,P04:enterpriseLanding,P05:search,P06:jobDetail,P07:company,P08:reviews,P09:community,P10:seeker,P11:resume,P12:submitReview,P13:report,P14:settings,P15:certification,P16:()=>enterprise('dash'),P17:()=>enterprise('profile'),P18:()=>enterprise('jobs'),P19:()=>enterprise('candidates'),P20:()=>enterprise('voice'),P21:()=>ops('dash'),P22:()=>ops('cert'),P23:()=>ops('jobReview'),P24:()=>ops('content'),P25:()=>ops('audit')}[S.route];document.getElementById('app').innerHTML=p()+modal()+(S.toast?`<div class="toast">${S.toast}</div>`:'')}

    window.go = go;
