<!DOCTYPE html>

  <title>幸运抽签 - 数字 & 对象抽取工具</title>

  <style>

  <style>

    input[type="number"],

    /* Spinning animation for draw button */
    .slot-numbers {
      display: flex;

<body>
  <div class="container">

    <!-- Header -->
    <header class="header">
      <h1>幸运抽签</h1>
      <p>随机抽取数字或对象，让选择不再纠结</p>
    </header>

    <!-- Mode Switcher -->
    <div class="mode-switcher">
      <div class="mode-slider" id="modeSlider"></div>
      <button class="mode-btn active" id="modeNumber" onclick="switchMode('number')">抽数字</button>
      <button class="mode-btn" id="modeItem" onclick="switchMode('item')">抽对象</button>
    </div>

    <!-- Number Draw Panel -->
    <div class="panel active" id="panelNumber">
      <div class="card">
        <div class="card-title">
          <span class="icon icon-number">1..N</span>
          数字范围设置
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">最小值</label>
            <input type="number" id="numMin" value="1" placeholder="1">
          </div>
          <div class="form-group">
            <label class="form-label">最大值</label>
            <input type="number" id="numMax" value="50" placeholder="50">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span class="icon icon-number">x</span>
          抽取数量
        </div>
        <div class="form-group">
          <input type="number" id="numCount" value="5" min="1" placeholder="抽取个数">
        </div>
      </div>

      <button class="btn-draw btn-draw-number" id="btnDrawNumber" onclick="startDrawNumber()">
        开始抽签
      </button>
    </div>

    <!-- Item Draw Panel -->
    <div class="panel" id="panelItem">
      <div class="card">
        <div class="card-title">
          <span class="icon icon-item">A..Z</span>
          候选对象
        </div>
        <div class="form-group">
          <label class="form-label">每行输入一个对象，例如：</label>
          <textarea id="itemList" placeholder="张三&#10;李四&#10;王五&#10;赵六&#10;孙七"></textarea>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span class="icon icon-item">x</span>
          抽取数量
        </div>
        <div class="form-group">
          <input type="number" id="itemCount" value="2" min="1" placeholder="抽取个数">
        </div>
      </div>

      <button class="btn-draw btn-draw-item" id="btnDrawItem" onclick="startDrawItem()">
        开始抽签
      </button>
    </div>

    <!-- Result -->
    <div class="result-card" id="resultCard" style="display:none;">
      <div class="result-header">
        <span id="resultLabel">抽取结果</span>
        <button class="btn-reset" onclick="clearResult()">清除</button>
      </div>
      <div class="result-body" id="resultBody">
        <div class="slot-numbers" id="slotNumbers"></div>
      </div>
    </div>

    <!-- History -->
    <div class="history-section" id="historySection" style="display:none;">
      <div class="history-title">&#128338; 抽签历史</div>
      <div class="history-list" id="historyList"></div>
    </div>

  </div>

  <script>
    /* === State === */
    var currentMode = 'number';
    var isDrawing = false;
    var history = [];

    /* === Mode Switching === */
    function switchMode(mode) {
      if (isDrawing) return;
      currentMode = mode;
      var slider = document.getElementById('modeSlider');
      if (mode === 'number') {
        slider.classList.remove('right');
        document.getElementById('modeNumber').classList.add('active');
        document.getElementById('modeItem').classList.remove('active');
        document.getElementById('panelNumber').classList.add('active');
        document.getElementById('panelItem').classList.remove('active');
      } else {
        slider.classList.add('right');
        document.getElementById('modeNumber').classList.remove('active');
        document.getElementById('modeItem').classList.add('active');
        document.getElementById('panelNumber').classList.remove('active');
        document.getElementById('panelItem').classList.add('active');
      }
    }

    /* === Ripple effect === */
    document.querySelectorAll('.btn-draw').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        var r = document.createElement('span');
        r.className = 'ripple';
        this.appendChild(r);
        setTimeout(function() { r.remove(); }, 600);
      });
    });

    /* === Number Draw === */
    function startDrawNumber() {
      if (isDrawing) return;

      var min = parseInt(document.getElementById('numMin').value);
      var max = parseInt(document.getElementById('numMax').value);
      var count = parseInt(document.getElementById('numCount').value);

      if (isNaN(min) || isNaN(max) || isNaN(count)) {
        shakeButton('btnDrawNumber');
        return;
      }
      if (min > max) { var t = min; min = max; max = t; }
      if (count < 1) count = 1;
      var poolSize = max - min + 1;
      if (count > poolSize) count = poolSize;

      // Generate unique random results
      var pool = [];
      for (var i = min; i <= max; i++) pool.push(i);
      var results = [];
      for (var j = 0; j < count; j++) {
        var idx = Math.floor(Math.random() * pool.length);
        results.push(pool[idx]);
        pool.splice(idx, 1);
      }

      animateSlots(results, 'number');
    }

    /* === Item Draw === */
    function startDrawItem() {
      if (isDrawing) return;

      var raw = document.getElementById('itemList').value.trim();
      if (!raw) { shakeButton('btnDrawItem'); return; }

      var items = raw.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
      if (items.length === 0) { shakeButton('btnDrawItem'); return; }

      var count = parseInt(document.getElementById('itemCount').value);
      if (isNaN(count) || count < 1) count = 1;
      if (count > items.length) count = items.length;

      // Deduplicate then draw
      var unique = [];
      var seen = {};
      items.forEach(function(it) {
        if (!seen[it]) { seen[it] = true; unique.push(it); }
      });
      if (count > unique.length) count = unique.length;

      var results = [];
      var pool = unique.slice();
      for (var i = 0; i < count; i++) {
        var idx = Math.floor(Math.random() * pool.length);
        results.push(pool[idx]);
        pool.splice(idx, 1);
      }

      animateSlots(results, 'item');
    }

    /* === Slot Animation === */
    function animateSlots(results, type) {
      isDrawing = true;
      var btn = type === 'number' ? 'btnDrawNumber' : 'btnDrawItem';
      document.getElementById(btn).classList.add('drawing');

      var resultCard = document.getElementById('resultCard');
      resultCard.style.display = 'block';

      document.getElementById('resultLabel').textContent =
        type === 'number' ? '数字抽取结果' : '对象抽取结果';

      var slotContainer = document.getElementById('slotNumbers');
      slotContainer.innerHTML = '';

      // Create slots
      var slots = [];
      var minVal = 1, maxVal = 100;
      if (type === 'number') {
        minVal = Math.min.apply(null, results);
        maxVal = Math.max.apply(null, results);
      }

      for (var i = 0; i < results.length; i++) {
        var slot = document.createElement('div');
        slot.className = 'slot-number';
        slot.textContent = type === 'number'
          ? randomInt(minVal, maxVal)
          : '?';
        slotContainer.appendChild(slot);
        slots.push(slot);
      }

      // Spin animation
      var spinInterval = setInterval(function() {
        slots.forEach(function(s) {
          if (!s.classList.contains('settled-number') && !s.classList.contains('settled-object')) {
            s.classList.add('spinning');
            s.textContent = type === 'number'
              ? randomInt(minVal, maxVal)
              : results[Math.floor(Math.random() * results.length)];
          }
        });
      }, 60);

      // Settle one by one
      results.forEach(function(val, idx) {
        var settleClass = type === 'number' ? 'settled-number' : 'settled-object';
        setTimeout(function() {
          slots[idx].classList.remove('spinning');
          slots[idx].classList.add(settleClass);
          slots[idx].textContent = val;
        }, 400 + idx * 350);
      });

      // Finish
      var totalTime = 400 + results.length * 350 + 200;
      setTimeout(function() {
        clearInterval(spinInterval);
        isDrawing = false;
        document.getElementById(btn).classList.remove('drawing');
        addHistory(results, type);
      }, totalTime);
    }

    /* === Clear Result === */
    function clearResult() {
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('slotNumbers').innerHTML = '';
    }

    /* === History === */
    function addHistory(results, type) {
      var now = new Date();
      var timeStr = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      history.unshift({ results: results, type: type, time: timeStr });
      if (history.length > 10) history.pop();
      renderHistory();
    }

    function renderHistory() {
      var section = document.getElementById('historySection');
      var list = document.getElementById('historyList');
      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }
      section.style.display = 'block';
      list.innerHTML = '';
      history.forEach(function(h) {
        var div = document.createElement('div');
        div.className = 'history-item';
        var label = h.type === 'number' ? '数字' : '对象';
        div.innerHTML =
          '<span class="results">[' + label + '] ' + h.results.join(', ') + '</span>' +
          '<span class="time">' + h.time + '</span>';
        list.appendChild(div);
      });
    }

    /* === Utilities === */
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function pad(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    function shakeButton(id) {
      var btn = document.getElementById(id);
      btn.style.animation = 'none';
      btn.offsetHeight; // trigger reflow
      btn.style.animation = 'shake 0.4s ease';
      setTimeout(function() { btn.style.animation = ''; }, 400);
    }
  </script>

  <style>
    @keyframes shake {
