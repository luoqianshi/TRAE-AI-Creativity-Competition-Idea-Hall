<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银发绿洲 - 模拟挂号沙盒</title>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .mobile-simulator {
            width: 375px;
            height: 667px;
            background-color: #ffffff;
            border: 8px solid #333;
            border-radius: 36px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px 10px;
            font-size: 22px;
            font-weight: bold;
        }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .guide-box {
            background-color: #e8f5e9;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            padding: 15px;
            color: #2e7d32;
            font-size: 18px;
            line-height: 1.5;
            position: relative;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        .btn {
            background-color: #f1f1f1;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            font-size: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-active {
            background-color: #ffffff;
            border: 2px solid #4CAF50;
            color: #4CAF50;
            font-weight: bold;
        }
        .btn-wrong {
            background-color: #ffebee;
            border: 2px solid #f44336;
            color: #d32f2f;
        }
        .screen {
            display: none;
            height: 100%;
            flex-direction: column;
        }
        .screen.active {
            display: flex;
        }
        .footer {
            text-align: center;
            padding: 15px;
            background-color: #f9f9f9;
            border-top: 1px solid #eee;
        }
        .reset-btn {
            background-color: #607d8b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="mobile-simulator">
    <!-- 欢迎界面 -->
    <div id="screen1" class="screen active">
        <div class="header">银发绿洲 - 练习模式</div>
        <div class="content" style="justify-content: center; align-items: center; text-align: center;">
            <div style="font-size: 60px; margin-bottom: 20px;">🏥</div>
            <h2 style="font-size: 24px; margin-bottom: 10px;">网上挂号模拟器</h2>
            <p style="font-size: 18px; color: #666; margin-bottom: 40px;">这里是安全的练习区，<br>怎么点都不会扣钱哦！</p>
            <div class="btn btn-active" style="width: 80%; background-color: #4CAF50; color: white;" onclick="nextScreen(2)">
                开始练习挂号
            </div>
        </div>
    </div>

    <!-- 选择科室界面 -->
    <div id="screen2" class="screen">
        <div class="header">第一步：选择科室</div>
        <div class="content">
            <div class="guide-box">
                <strong>爷爷奶奶，请看这里：</strong><br>
                今天我们胃不太舒服，请点击下方绿色边框的【消化内科】按钮。点错了也没关系！
            </div>
            <div class="btn" onclick="showError(this)">心血管内科</div>
            <div class="btn btn-active" onclick="nextScreen(3)">消化内科 (请点我)</div>
            <div class="btn" onclick="showError(this)">骨科</div>
        </div>
        <div class="footer">
            <button class="reset-btn" onclick="resetApp()">重新开始</button>
        </div>
    </div>

    <!-- 成功提示界面 -->
    <div id="screen3" class="screen">
        <div class="header">练习成功</div>
        <div class="content" style="justify-content: center; align-items: center; text-align: center;">
            <div style="font-size: 80px; margin-bottom: 20px;">🎉</div>
            <h2 style="font-size: 28px; color: #4CAF50; margin-bottom: 10px;">太棒啦！</h2>
            <p style="font-size: 20px; color: #333; line-height: 1.5;">您已经学会了如何选择科室。<br>在这个沙盒里，您可以大胆尝试任何新功能。</p>
        </div>
        <div class="footer">
            <button class="reset-btn" onclick="resetApp()">再练习一次</button>
        </div>
    </div>
</div>

<script>
    function nextScreen(screenNum) {
        // 隐藏所有屏幕
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        // 显示目标屏幕
        document.getElementById('screen' + screenNum).classList.add('active');
    }

    function showError(element) {
        element.classList.add('btn-wrong');
        element.innerHTML = "点错了，不会扣钱，请点绿色的按钮";
        setTimeout(() => {
            element.classList.remove('btn-wrong');
            if(element.innerText.includes("心血管")) element.innerHTML = "心血管内科";
            if(element.innerText.includes("骨科")) element.innerHTML = "骨科";
        }, 2000);
    }

    function resetApp() {
        // 恢复初始状态
        document.querySelectorAll('.btn').forEach(btn => {
            btn.classList.remove('btn-wrong');
        });
        document.querySelectorAll('.btn').forEach((btn, index) => {
             if(index === 1) btn.innerHTML = "心血管内科";
             if(index === 3) btn.innerHTML = "骨科";
        });
        nextScreen(1);
    }
</script>

</body>
</html>
