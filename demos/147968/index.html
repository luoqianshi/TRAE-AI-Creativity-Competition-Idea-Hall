<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战火突击 - Battle Strike</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #gameCanvas { display: block; background: #0f0f1a; }
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; }
        .crosshair::before, .crosshair::after { content: ''; position: absolute; background: #ff4444; }
        .crosshair::before { width: 2px; height: 20px; top: 0; left: 9px; }
        .crosshair::after { width: 20px; height: 2px; top: 9px; left: 0; }
        .crosshair::before { animation: pulse 1s infinite; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .health-bar { position: absolute; top: 20px; left: 20px; width: 200px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; }
        .health-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ffaa00); width: 100%; transition: width 0.3s; }
        
        .score { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px #00ffff; }
        
        .start-screen, .game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
        .title { font-size: 48px; color: #ff4444; margin-bottom: 20px; text-shadow: 0 0 20px #ff4444; }
        .subtitle { font-size: 18px; color: #aaa; margin-bottom: 40px; }
        .btn { padding: 15px 40px; font-size: 20px; background: linear-gradient(45deg, #ff4444, #ff6600); border: none; border-radius: 30px; color: #fff; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn:hover { transform: scale(1.1); box-shadow: 0 0 20px #ff4444; }
        
        .kill-count { color: #00ff00; font-size: 36px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="uiLayer">
        <div class="crosshair"></div>
        <div class="health-bar">
            <div class="health-fill" id="healthFill"></div>
        </div>
        <div class="score">分数: <span id="scoreDisplay">0</span></div>
        
        <div class="start-screen" id="startScreen">
            <div class="title">战火突击</div>
            <div class="subtitle">Battle Strike</div>
            <button class="btn" id="startBtn">开始游戏</button>
            <div style="color: #888; margin-top: 30px; font-size: 14px;">WASD 移动 | 鼠标 瞄准 | 左键 射击</div>
        </div>
        
        <div class="game-over-screen" id="gameOverScreen" style="display: none;">
            <div class="title">游戏结束</div>
            <div class="kill-count" id="finalScore">0</div>
            <button class="btn" id="restartBtn">重新开始</button>
        </div>
    </div>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
