<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日省·复盘迭代器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
/* ============ CSS Variables ============ */
:root {
  --color-primary: #E8842A;
  --color-primary-dark: #C96E1F;
  --color-primary-light: #F5A85A;
  --color-secondary: #2D1B0E;
  --color-bg: #FFF8F0;
  --color-bg-alt: #F5EDE0;
  --color-card: #FFFFFF;
  --color-card-border: #E8DCC8;
  --color-text: #2D1B0E;
  --color-text-secondary: #7A6B5A;
  --color-text-light: #B5A898;
  --color-accent-green: #2D6A4F;
  --color-accent-green-light: #52B788;
  --color-accent-red: #C94A4A;
  --color-accent-blue: #4A7BC9;
  --color-accent-purple: #8A6BC9;
  --color-amber-100: #FFF3E0;
  --color-amber-200: #FFE0B2;
  --color-amber-300: #FFCC80;
  --shadow-sm: 0 1px 3px rgba(45, 27, 14, 0.08);
  --shadow-md: 0 4px 12px rgba(45, 27, 14, 0.1);
  --shadow-lg: 0 8px 30px rgba(45, 27, 14, 0.12);
  --shadow-glow: 0 0 20px rgba(232, 132, 42, 0.15);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --font-display: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --max-width: 800px;
  --nav-height: 64px;
}

/* ============ Reset & Base ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background-color: var(--color-bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(232, 132, 42, 0.03) 0%, transparent 100%),
    url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
  color: var(--color-text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--color-primary); text-decoration: none; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }

/* ============ Utilities ============ */
.container { max-width: var(--max-width); margin: 0 auto; padding: 0 20px; }
.page { display: none; animation: fadeIn 0.5s ease; }
.page.active { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

/* ============ Typography ============ */
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.3; color: var(--color-secondary); }
h1 { font-size: 2rem; font-weight: 900; letter-spacing: 0.02em; }
h2 { font-size: 1.5rem; font-weight: 700; }
h3 { font-size: 1.2rem; font-weight: 600; }
h4 { font-size: 1rem; font-weight: 600; }

/* ============ Navigation ============ */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-height);
  background: rgba(255, 248, 240, 0.92);
  backdrop-filter: blur(16px) saturate(180%);
  -webkit-backdrop-filter: blur(16px) saturate(180%);
  border-bottom: 1px solid var(--color-card-border);
  display: flex; align-items: center;
}
.nav-inner {
  max-width: var(--max-width); margin: 0 auto; padding: 0 20px;
  width: 100%; display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  font-family: var(--font-display); font-size: 1.2rem; font-weight: 700;
  color: var(--color-secondary); display: flex; align-items: center; gap: 8px;
}
.nav-brand i { color: var(--color-primary); font-size: 1.1rem; }
.nav-links { display: flex; gap: 4px; }
.nav-link {
  padding: 8px 14px; border-radius: var(--radius-md);
  font-size: 0.85rem; font-weight: 500; color: var(--color-text-secondary);
  transition: var(--transition); display: flex; align-items: center; gap: 6px;
}
.nav-link:hover { color: var(--color-primary); background: var(--color-amber-100); }
.nav-link.active { color: var(--color-primary); background: var(--color-amber-200); }
.nav-link i { font-size: 0.9rem; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 28px; border-radius: var(--radius-md);
  font-size: 0.95rem; font-weight: 600; font-family: var(--font-body);
  transition: var(--transition); border: none;
  position: relative; overflow: hidden;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
  pointer-events: none;
}
.btn-primary {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: #fff; box-shadow: var(--shadow-md);
}
.btn-primary:hover {
  transform: translateY(-2px); box-shadow: var(--shadow-lg);
}
.btn-primary:active { transform: translateY(0); }
.btn-secondary {
  background: var(--color-bg-alt); color: var(--color-text-secondary);
  border: 1px solid var(--color-card-border);
}
.btn-secondary:hover { background: var(--color-amber-100); color: var(--color-primary); }
.btn-sm { padding: 8px 16px; font-size: 0.85rem; border-radius: var(--radius-sm); }
.btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 50%; }

/* ============ Cards ============ */
.card {
  background: var(--color-card); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); border: 1px solid var(--color-card-border);
  padding: 24px; transition: var(--transition);
  position: relative; overflow: hidden;
}
.card:hover { box-shadow: var(--shadow-md); }
.card-glow { border-color: var(--color-primary-light); box-shadow: var(--shadow-glow); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-header h3 { display: flex; align-items: center; gap: 8px; }

/* ============ Inputs ============ */
.input-group { margin-bottom: 16px; }
.input-group label {
  display: block; font-size: 0.85rem; font-weight: 500;
  color: var(--color-text-secondary); margin-bottom: 6px;
}
input[type="text"], textarea {
  width: 100%; padding: 12px 16px; border: 1px solid var(--color-card-border);
  border-radius: var(--radius-sm); font-family: var(--font-body);
  font-size: 0.9rem; background: var(--color-bg); color: var(--color-text);
  transition: var(--transition); resize: vertical;
}
input[type="text"]:focus, textarea:focus {
  outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(232, 132, 42, 0.12);
}
textarea { min-height: 80px; }

/* ============ Slider ============ */
.slider-group { margin-bottom: 16px; }
.slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.slider-header label { font-size: 0.85rem; font-weight: 500; color: var(--color-text-secondary); }
.slider-value { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; color: var(--color-primary); }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
  border-radius: 3px; background: linear-gradient(90deg, var(--color-amber-200) 0%, var(--color-primary) 100%);
  outline: none; transition: var(--transition);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--color-primary); cursor: pointer;
  box-shadow: 0 2px 6px rgba(232, 132, 42, 0.3); transition: var(--transition);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary);
  cursor: pointer; border: none;
}

/* ============ Main Content ============ */
.main-content { padding-top: calc(var(--nav-height) + 20px); padding-bottom: 40px; }

/* ============ Home Page ============ */
.home-hero {
  text-align: center; padding: 60px 20px 40px; position: relative;
}
.home-hero::before {
  content: ''; position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(232, 132, 42, 0.06) 0%, transparent 70%);
  pointer-events: none;
}
.home-hero h1 { font-size: 2.4rem; margin-bottom: 8px; }
.home-hero .subtitle { color: var(--color-text-secondary); font-size: 1rem; margin-bottom: 8px; }
.home-hero .date-display { font-size: 0.85rem; color: var(--color-text-light); margin-bottom: 24px; }
.streak-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 16px; border-radius: 20px;
  background: linear-gradient(135deg, var(--color-amber-100) 0%, var(--color-amber-200) 100%);
  font-size: 0.85rem; font-weight: 600; color: var(--color-primary-dark); margin-bottom: 24px;
}
.streak-badge i { color: var(--color-primary); }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card {
  text-align: center; padding: 16px 12px;
  background: var(--color-card); border-radius: var(--radius-md);
  border: 1px solid var(--color-card-border);
}
.stat-card .stat-icon { font-size: 1.4rem; color: var(--color-primary); margin-bottom: 4px; }
.stat-card .stat-value { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; color: var(--color-secondary); }
.stat-card .stat-label { font-size: 0.75rem; color: var(--color-text-light); }

.home-actions { text-align: center; margin: 32px 0; }
.home-actions .btn { font-size: 1.1rem; padding: 16px 40px; border-radius: var(--radius-xl); }
.home-actions .btn i { font-size: 1rem; }

.recent-list { margin-top: 24px; }
.recent-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--color-card-border); cursor: pointer; transition: var(--transition);
}
.recent-item:hover { padding-left: 8px; }
.recent-item:last-child { border-bottom: none; }
.recent-date { font-size: 0.85rem; color: var(--color-text-light); min-width: 80px; }
.recent-scores { display: flex; gap: 6px; }
.recent-score { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; color: #fff; }
.recent-score.work { background: var(--color-primary); }
.recent-score.life { background: var(--color-accent-green); }
.recent-score.hobby { background: var(--color-accent-blue); }
.recent-preview { font-size: 0.85rem; color: var(--color-text-secondary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============ Review Page ============ */
.review-header { margin-bottom: 24px; }
.review-header h2 { font-size: 1.8rem; }
.review-header .review-date { color: var(--color-text-light); font-size: 0.9rem; }

.dimension-card {
  margin-bottom: 16px; border: 1px solid var(--color-card-border);
  border-radius: var(--radius-lg); overflow: hidden; transition: var(--transition);
}
.dimension-card.active { border-color: var(--color-primary-light); box-shadow: var(--shadow-glow); }
.dimension-header {
  padding: 16px 20px; display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none; transition: var(--transition);
  background: var(--color-card);
}
.dimension-header:hover { background: var(--color-amber-100); }
.dimension-icon {
  width: 36px; height: 36px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 1rem; color: #fff; flex-shrink: 0;
}
.dimension-icon.work { background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%); }
.dimension-icon.life { background: linear-gradient(135deg, var(--color-accent-green) 0%, var(--color-accent-green-light) 100%); }
.dimension-icon.hobby { background: linear-gradient(135deg, var(--color-accent-blue) 0%, #6BA3E0 100%); }
.dimension-name { font-weight: 600; flex: 1; }
.dimension-arrow { color: var(--color-text-light); transition: var(--transition); }
.dimension-card.active .dimension-arrow { transform: rotate(180deg); }
.dimension-body { display: none; padding: 0 20px 20px; background: var(--color-card); }
.dimension-card.active .dimension-body { display: block; }

.review-actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.review-actions .btn { flex: 1; min-width: 140px; }

/* ============ Report Page ============ */
.report-date { color: var(--color-text-light); font-size: 0.85rem; margin-bottom: 20px; }

.analysis-grid { display: grid; gap: 16px; margin-bottom: 24px; }
.analysis-card {
  padding: 20px; border-radius: var(--radius-md); border-left: 4px solid;
}
.analysis-card.highlight { border-color: var(--color-accent-green); background: rgba(45, 106, 79, 0.04); }
.analysis-card.weakness { border-color: var(--color-accent-red); background: rgba(201, 74, 74, 0.04); }
.analysis-card.improve { border-color: var(--color-accent-blue); background: rgba(74, 123, 201, 0.04); }
.analysis-card h4 { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.analysis-card p { font-size: 0.9rem; color: var(--color-text-secondary); line-height: 1.7; }

.action-plan { margin-top: 24px; }
.action-item {
  display: flex; align-items: flex-start; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--color-card-border);
}
.action-item:last-child { border-bottom: none; }
.action-check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--color-card-border);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  flex-shrink: 0; margin-top: 2px; transition: var(--transition);
}
.action-check:hover { border-color: var(--color-primary); }
.action-check.done { background: var(--color-accent-green); border-color: var(--color-accent-green); color: #fff; }
.action-check.done i { font-size: 0.7rem; }
.action-text { font-size: 0.9rem; color: var(--color-text-secondary); flex: 1; }
.action-text.done { text-decoration: line-through; color: var(--color-text-light); }
.action-add-text {
  width: 100%; padding: 10px 16px; border: 1px dashed var(--color-card-border);
  border-radius: var(--radius-sm); font-size: 0.9rem; background: transparent;
  color: var(--color-text-light); transition: var(--transition);
}
.action-add-text:focus { border-color: var(--color-primary); color: var(--color-text); outline: none; }

/* ============ History Page ============ */
.history-header { margin-bottom: 24px; }
.history-header h2 { font-size: 1.8rem; }

.heatmap-container {
  background: var(--color-card); border-radius: var(--radius-lg);
  border: 1px solid var(--color-card-border); padding: 20px; margin-bottom: 24px;
  overflow-x: auto;
}
.heatmap-title { font-family: var(--font-display); font-weight: 600; margin-bottom: 16px; font-size: 1rem; }
.heatmap-grid { display: flex; flex-direction: column; gap: 3px; min-width: 600px; }
.heatmap-row { display: flex; gap: 3px; }
.heatmap-label { width: 30px; font-size: 0.65rem; color: var(--color-text-light); display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; }
.heatmap-cell {
  width: 14px; height: 14px; border-radius: 3px; background: var(--color-bg-alt);
  position: relative; cursor: pointer; transition: var(--transition);
}
.heatmap-cell:hover { transform: scale(1.3); z-index: 2; }
.heatmap-cell[data-level="1"] { background: #FFE0B2; }
.heatmap-cell[data-level="2"] { background: #FFCC80; }
.heatmap-cell[data-level="3"] { background: #FFB74D; }
.heatmap-cell[data-level="4"] { background: #F57C00; }
.heatmap-cell[data-level="5"] { background: #E65100; }
.heatmap-tooltip {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--color-secondary); color: #fff; font-size: 0.7rem;
  padding: 4px 10px; border-radius: 6px; white-space: nowrap; pointer-events: none;
  opacity: 0; transition: var(--transition); z-index: 10;
}
.heatmap-cell:hover .heatmap-tooltip { opacity: 1; }
.heatmap-legend { display: flex; align-items: center; gap: 6px; margin-top: 12px; justify-content: flex-end; font-size: 0.75rem; color: var(--color-text-light); }
.heatmap-legend .legend-cell { width: 12px; height: 12px; border-radius: 2px; }

.chart-container {
  background: var(--color-card); border-radius: var(--radius-lg);
  border: 1px solid var(--color-card-border); padding: 20px; margin-bottom: 24px;
}
.chart-container canvas { max-height: 280px; }

/* ============ Achievements Page ============ */
.achievements-header { margin-bottom: 24px; }
.achievements-header h2 { font-size: 1.8rem; }
.achievements-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.achievement-item {
  text-align: center; padding: 20px 12px; border-radius: var(--radius-lg);
  background: var(--color-card); border: 1px solid var(--color-card-border);
  transition: var(--transition);
}
.achievement-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.achievement-item.locked { opacity: 0.5; filter: grayscale(1); }
.achievement-icon {
  width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 10px;
  display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  color: #fff;
}
.achievement-item.locked .achievement-icon { background: var(--color-bg-alt); color: var(--color-text-light); }
.achievement-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
.achievement-desc { font-size: 0.75rem; color: var(--color-text-light); }

/* ============ Empty State ============ */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--color-text-light);
}
.empty-state i { font-size: 3rem; margin-bottom: 16px; opacity: 0.4; }
.empty-state p { font-size: 0.95rem; }

/* ============ Toast ============ */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  padding: 12px 24px; border-radius: var(--radius-md);
  background: var(--color-secondary); color: #fff; font-size: 0.9rem;
  box-shadow: var(--shadow-lg); z-index: 200; opacity: 0;
  transition: var(--transition); pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast i { margin-right: 8px; }

/* ============ Modal ============ */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(45, 27, 14, 0.5);
  backdrop-filter: blur(4px); z-index: 300; display: none;
  align-items: center; justify-content: center; animation: fadeIn 0.3s ease;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--color-card); border-radius: var(--radius-xl);
  padding: 32px; max-width: 400px; width: 90%; text-align: center;
  box-shadow: var(--shadow-lg); animation: modalSlideUp 0.4s ease;
}
.modal-icon { font-size: 3rem; margin-bottom: 16px; }
.modal h3 { margin-bottom: 8px; }
.modal p { color: var(--color-text-secondary); margin-bottom: 20px; font-size: 0.9rem; }

/* ============ Animations ============ */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalSlideUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
@keyframes confetti-fall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 1; } 100% { transform: translateY(200px) rotate(720deg); opacity: 0; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.animate-float { animation: float 3s ease-in-out infinite; }
.animate-pulse { animation: pulse 2s ease-in-out infinite; }

/* ============ Confetti ============ */
.confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
.confetti-piece {
  position: absolute; width: 10px; height: 10px; border-radius: 2px;
  animation: confetti-fall 1.5s ease-in-out forwards;
}

/* ============ Responsive ============ */
@media (max-width: 640px) {
  h1 { font-size: 1.6rem; }
  h2 { font-size: 1.3rem; }
  .home-hero h1 { font-size: 1.8rem; }
  .home-hero { padding: 40px 16px 30px; }
  .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-card { padding: 12px 8px; }
  .stat-card .stat-value { font-size: 1.2rem; }
  .nav-link span { display: none; }
  .nav-link { padding: 8px 12px; }
  .nav-link i { font-size: 1.1rem; }
  .achievements-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { padding: 16px; }
  .dimension-header { padding: 12px 16px; }
  .dimension-body { padding: 0 16px 16px; }
  .review-actions .btn { min-width: 100%; }
  .heatmap-cell { width: 12px; height: 12px; }
  .heatmap-label { width: 24px; font-size: 0.6rem; }
}
</style>
</head>
<body>

<!-- ============ Navigation ============ -->
<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <i class="fa-solid fa-rotate-left"></i>
      日省

<script>
/* ============================================================
   Data Manager
   ============================================================ */
const DataManager = {
  getReviews() {
    try { return JSON.parse(localStorage.getItem('daily_reviews') || '{}'); }
    catch { return {}; }
  },
  setReviews(data) {
    localStorage.setItem('daily_reviews', JSON.stringify(data));
  },
  getReview(date) {
    return this.getReviews()[date] || null;
  },
  saveReview(date, data) {
    const reviews = this.getReviews();
    reviews[date] = { ...data, updatedAt: new Date().toISOString() };
    this.setReviews(reviews);
  },
  getAchievements() {
    try { return JSON.parse(localStorage.getItem('achievements') || '[]'); }
    catch { return []; }
  },
  setAchievements(data) {
    localStorage.setItem('achievements', JSON.stringify(data));
  },
  getSetting(key, def) {
    try {
      const s = JSON.parse(localStorage.getItem('user_settings') || '{}');
      return s[key] !== undefined ? s[key] : def;
    } catch { return def; }
  },
  setSetting(key, value) {
    try {
      const s = JSON.parse(localStorage.getItem('user_settings') || '{}');
      s[key] = value;
      localStorage.setItem('user_settings', JSON.stringify(s));
    } catch {}
  },
  getAllReviews() {
    const reviews = this.getReviews();
    return Object.entries(reviews)
      .map(([date, data]) => ({ date, ...data }))
      .sort((a, b) => b.date.localeCompare(a.date));
  }
};

/* ============================================================
   Router
   ============================================================ */
function navigateTo(page) {
  window.location.hash = page;
}

function handleRoute() {
  const hash = window.location.hash.slice(1) || 'home';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

  const page = document.getElementById(`page-${hash}`);
  if (page) {
    page.classList.add('active');
    const link = document.querySelector(`.nav-link[data-route="${hash}"]`);
    if (link) link.classList.add('active');
  }

  // Page-specific init
  switch (hash) {
    case 'home': initHome(); break;
    case 'review': initReview(); break;
    case 'report': initReport(); break;
    case 'history': initHistory(); break;
    case 'achievements': initAchievements(); break;
  }
}

window.addEventListener('hashchange', handleRoute);
window.addEventListener('load', handleRoute);

/* ============================================================
   Toast
   ============================================================ */
let toastTimer = null;
function showToast(message, icon = 'fa-circle-check') {
  const toast = document.getElementById('toast');
  toast.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ============================================================
   Modal
   ============================================================ */
function showModal(icon, title, desc) {
  document.getElementById('modal-icon').textContent = icon;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-desc').textContent = desc;
  document.getElementById('achievement-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('achievement-modal').classList.remove('active');
}

/* ============================================================
   Confetti
   ============================================================ */
function fireConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#E8842A', '#F5A85A', '#2D6A4F', '#52B788', '#4A7BC9', '#8A6BC9', '#C94A4A'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.top = '-10px';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.width = (Math.random() * 8 + 4) + 'px';
    piece.style.height = (Math.random() * 8 + 4) + 'px';
    piece.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
    piece.style.animationDelay = (Math.random() * 0.5) + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 3000);
  }
}

/* ============================================================
   Date Helpers
   ============================================================ */
function getToday() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function formatDateCN(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 周${weekdays[d.getDay()]}`;
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 6) return '夜深了，复盘一下今天的点滴';
  if (h < 9) return '早安，复盘昨天的收获';
  if (h < 12) return '上午好，回顾一下今天的进展';
  if (h < 14) return '午后小憩，做个复盘吧';
  if (h < 18) return '下午好，记录今天的收获';
  if (h < 21) return '傍晚时分，复盘一下今日';
  return '晚上好，复盘今天的成长';
}

function getWeekRange() {
  const now = new Date();
  const dayOfWeek = now.getDay();
  const diff = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const monday = new Date(now);
  monday.setDate(now.getDate() - diff);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  return {
    start: monday.toISOString().slice(0, 10),
    end: sunday.toISOString().slice(0, 10)
  };
}

/* ============================================================
   Analysis Engine
   ============================================================ */
const AnalysisEngine = {
  generate(review) {
    const highlights = [];
    const weaknesses = [];
    const improvements = [];

    const scores = [
      { name: '工作/学习', score: review.workScore, key: 'work' },
      { name: '生活/健康', score: review.lifeScore, key: 'life' },
      { name: '爱好/兴趣', score: review.hobbyScore, key: 'hobby' }
    ];

    // Highlights
    scores.forEach(s => {
      if (s.score >= 8) {
        highlights.push(`${s.name}表现出色（${s.score}分），继续保持！`);
      } else if (s.score >= 6) {
        highlights.push(`${s.name}表现良好（${s.score}分），有提升空间。`);
      }
    });

    // Content-based highlights
    if (review.workContent && review.workContent.length > 5) {
      highlights.push(`工作/学习有具体记录：「${review.workContent.slice(0, 20)}${review.workContent.length > 20 ? '...' : ''}」`);
    }
    if (review.hobbyContent && review.hobbyContent.length > 5) {
      highlights.push(`在爱好上投入了时间，值得鼓励！`);
    }

    // Weaknesses
    scores.forEach(s => {
      if (s.score <= 4) {
        weaknesses.push(`${s.name}得分较低（${s.score}分），需要重点关注。`);
      }
    });
    if (review.lifeScore < 6) {
      weaknesses.push('生活/健康维度需要更多关注，注意劳逸结合。');
    }
    if (!review.hobbyContent || review.hobbyContent.length < 3) {
      weaknesses.push('今天似乎没有在爱好上投入时间，适当的放松也很重要。');
    }

    // Improvements
    if (review.workScore < 7) {
      improvements.push('工作/学习：尝试使用番茄工作法提升专注力，设定明确的小目标。');
    }
    if (review.lifeScore < 7) {
      improvements.push('生活/健康：保证充足睡眠，适当运动，注意饮食均衡。');
    }
    if (review.hobbyScore < 7) {
      improvements.push('爱好/兴趣：每天留出30分钟给喜欢的事情，让生活更有色彩。');
    }

    if (highlights.length === 0) highlights.push('今天是一个新的开始，记录本身就是进步！');
    if (weaknesses.length === 0) weaknesses.push('今天整体表现不错，继续保持当前状态！');
    if (improvements.length === 0) improvements.push('无需特别改进，享受当前的良好状态吧！');

    return { highlights, weaknesses, improvements };
  },

  generateActionPlan(review) {
    const plans = [];
    if (review.workScore < 7) {
      plans.push('使用番茄工作法，设定25分钟专注时间');
    }
    if (review.lifeScore < 7) {
      plans.push('安排30分钟的运动或散步');
    }
    if (review.hobbyScore < 7) {
      plans.push('留出30分钟做自己喜欢的事情');
    }
    if (review.reflection && review.reflection.length > 3) {
      plans.push('将今日感悟转化为实际行动');
    }
    if (plans.length === 0) {
      plans.push('继续保持今天的良好状态');
      plans.push('尝试新的挑战，突破舒适区');
    }
    return plans;
  }
};

/* ============================================================
   Achievement System
   ============================================================ */
const AchievementDefs = [
  { id: 'first_review', name: '初次复盘', desc: '完成第一次复盘', icon: '🌟', check: (r, stats) => stats.total >= 1 },
  { id: 'streak_3', name: '三日坚持', desc: '连续复盘3天', icon: '🔥', check: (r, stats) => stats.streak >= 3 },
  { id: 'streak_7', name: '一周达人', desc: '连续复盘7天', icon: '⭐', check: (r, stats) => stats.streak >= 7 },
  { id: 'streak_14', name: '半月之星', desc: '连续复盘14天', icon: '🌙', check: (r, stats) => stats.streak >= 14 },
  { id: 'streak_30', name: '月度冠军', desc: '连续复盘30天', icon: '👑', check: (r, stats) => stats.streak >= 30 },
  { id: 'total_5', name: '五谷丰登', desc: '累计复盘5次', icon: '🌾', check: (r, stats) => stats.total >= 5 },
  { id: 'total_10', name: '十全十美', desc: '累计复盘10次', icon: '💎', check: (r, stats) => stats.total >= 10 },
  { id: 'total_30', name: '三十而立', desc: '累计复盘30次', icon: '🏆', check: (r, stats) => stats.total >= 30 },
  { id: 'perfect_day', name: '完美一天', desc: '三个维度均获得9分以上', icon: '💯', check: (r, stats) => r.workScore >= 9 && r.lifeScore >= 9 && r.hobbyScore >= 9 },
  { id: 'balanced', name: '均衡发展', desc: '三个维度评分都在7分以上', icon: '⚖️', check: (r, stats) => r.workScore >= 7 && r.lifeScore >= 7 && r.hobbyScore >= 7 },
  { id: 'deep_reflect', name: '深度思考', desc: '今日感悟超过50字', icon: '🧠', check: (r, stats) => r.reflection && r.reflection.length >= 50 },
  { id: 'week_full', name: '全勤一周', desc: '一周7天全部复盘', icon: '📅', check: (r, stats) => stats.weekFull },
];

function checkAchievements(review) {
  const allReviews = DataManager.getAllReviews();
  const streak = calculateStreak(allReviews);
  const total = allReviews.length;

  const weekRange = getWeekRange();
  const weekReviews = allReviews.filter(r => r.date >= weekRange.start && r.date <= weekRange.end);
  const weekFull = weekReviews.length >= 7;

  const stats = { streak, total, weekFull };
  const currentAchievements = DataManager.getAchievements();
  const unlockedIds = new Set(currentAchievements.map(a => a.id));
  let newAchievements = [];

  AchievementDefs.forEach(def => {
    if (!unlockedIds.has(def.id) && def.check(review, stats)) {
      const ach = {
        id: def.id,
        name: def.name,
        desc: def.desc,
        icon: def.icon,
        unlocked: true,
        unlockedAt: new Date().toISOString()
      };
      currentAchievements.push(ach);
      newAchievements.push(ach);
    }
  });

  if (newAchievements.length > 0) {
    DataManager.setAchievements(currentAchievements);
    // Show first new achievement
    const ach = newAchievements[0];
    setTimeout(() => {
      showModal(ach.icon, `🎉 成就解锁：${ach.name}`, ach.desc);
      fireConfetti();
    }, 500);
  }

  return newAchievements;
}

function calculateStreak(reviews) {
  if (reviews.length === 0) return 0;
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().slice(0, 10);
    if (reviews.some(r => r.date === dateStr)) {
      streak++;
    } else if (i > 0) {
      break;
    }
  }
  return streak;
}

/* ============================================================
   Home Page
   ============================================================ */
function initHome() {
  const allReviews = DataManager.getAllReviews();
  const streak = calculateStreak(allReviews);
  const total = allReviews.length;

  // Streak badge
  document.getElementById('streak-count').textContent = streak;

  // Greeting
  document.getElementById('greeting').textContent = getGreeting();

  // Date
  document.getElementById('today-display').textContent = formatDateCN(getToday());

  // Stats
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-streak').textContent = streak;

  if (total > 0) {
    const avg = allReviews.reduce((s, r) => {
      return s + ((r.workScore || 0) + (r.lifeScore || 0) + (r.hobbyScore || 0)) / 3;
    }, 0) / total;
    document.getElementById('stat-avg').textContent = avg.toFixed(1);
  } else {
    document.getElementById('stat-avg').textContent = '-';
  }

  // Recent list
  const recentContainer = document.getElementById('recent-list');
  const recent = allReviews.slice(0, 10);

  if (recent.length === 0) {
    recentContainer.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-book-open"></i>
        <p>还没有复盘记录，开始你的第一次复盘吧</p>
      </div>`;
    return;
  }

  recentContainer.innerHTML = recent.map(r => {
    const scores = [
      { key: 'work', label: '工', class: 'work', score: r.workScore || 0 },
      { key: 'life', label: '生', class: 'life', score: r.lifeScore || 0 },
      { key: 'hobby', label: '爱', class: 'hobby', score: r.hobbyScore || 0 }
    ];
    const preview = r.reflection || r.workContent || '';
    return `
      <div class="recent-item" onclick="viewReport('${r.date}')">
        <span class="recent-date">${formatDateCN(r.date)}</span>
        <div class="recent-scores">
          ${scores.map(s => `<span class="recent-score ${s.class}">${s.score}</span>`).join('')}
        </div>
        <span class="recent-preview">${preview.slice(0, 30)}${preview.length > 30 ? '...' : ''}</span>
      </div>`;
  }).join('');
}

function viewReport(date) {
  document.getElementById('report-date-picker').value = date;
  navigateTo('report');
  loadReport();
}

/* ============================================================
   Review Page
   ============================================================ */
function initReview() {
  const today = getToday();
  document.getElementById('review-date').textContent = formatDateCN(today);

  // Check if already reviewed today
  const existing = DataManager.getReview(today);
  if (existing) {
    document.getElementById('input-work-content').value = existing.workContent || '';
    document.getElementById('input-life-content').value = existing.lifeContent || '';
    document.getElementById('input-hobby-content').value = existing.hobbyContent || '';
    document.getElementById('input-reflection').value = existing.reflection || '';

    document.querySelectorAll('.dimension-slider').forEach(sl => {
      const dim = sl.dataset.dimension;
      const val = existing[dim + 'Score'] || 5;
      sl.value = val;
      document.getElementById(`${dim}-score-display`).textContent = val;
    });
  } else {
    // Reset
    document.getElementById('input-work-content').value = '';
    document.getElementById('input-life-content').value = '';
    document.getElementById('input-hobby-content').value = '';
    document.getElementById('input-reflection').value = '';
    document.querySelectorAll('.dimension-slider').forEach(sl => {
      sl.value = 5;
      const dim = sl.dataset.dimension;
      document.getElementById(`${dim}-score-display`).textContent = '5';
    });
  }
}

function toggleDimension(header) {
  const card = header.closest('.dimension-card');
  card.classList.toggle('active');
}

function updateSliderDisplay(slider) {
  const dim = slider.dataset.dimension;
  document.getElementById(`${dim}-score-display`).textContent = slider.value;
}

function getReviewData() {
  return {
    workContent: document.getElementById('input-work-content').value.trim(),
    lifeContent: document.getElementById('input-life-content').value.trim(),
    hobbyContent: document.getElementById('input-hobby-content').value.trim(),
    workScore: parseInt(document.querySelector('.dimension-slider[data-dimension="work"]').value),
    lifeScore: parseInt(document.querySelector('.dimension-slider[data-dimension="life"]').value),
    hobbyScore: parseInt(document.querySelector('.dimension-slider[data-dimension="hobby"]').value),
    reflection: document.getElementById('input-reflection').value.trim(),
    createdAt: new Date().toISOString()
  };
}

function saveReview() {
  const today = getToday();
  const data = getReviewData();
  DataManager.saveReview(today, data);
  checkAchievements(data);
  showToast('复盘已保存', 'fa-floppy-disk');
  navigateTo('home');
}

function saveAndAnalyze() {
  const today = getToday();
  const data = getReviewData();
  DataManager.saveReview(today, data);
  checkAchievements(data);
  showToast('复盘已保存，正在生成分析报告', 'fa-wand-magic-sparkles');
  // Generate action plan
  const plans = AnalysisEngine.generateActionPlan(data);
  DataManager.setSetting(`plan_${today}`, plans);
  navigateTo('report');
  document.getElementById('report-date-picker').value = today;
  loadReport();
}

/* ============================================================
   Report Page
   ============================================================ */
function initReport() {
  const today = getToday();
  document.getElementById('report-date-picker').value = today;
  loadReport();
}

function loadReport() {
  const date = document.getElementById('report-date-picker').value;
  const review = DataManager.getReview(date);

  document.getElementById('report-date').textContent = `${formatDateCN(date)} 的复盘分析`;

  const container = document.getElementById('report-content');

  if (!review) {
    container.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-file-lines"></i>
        <p>该日期暂无复盘记录</p>
      </div>`;
    return;
  }

  const analysis = AnalysisEngine.generate(review);
  const savedPlans = DataManager.getSetting(`plan_${date}`, []);
  const plans = savedPlans.length > 0 ? savedPlans : AnalysisEngine.generateActionPlan(review);

  // Save plans if not saved
  if (savedPlans.length === 0) {
    DataManager.setSetting(`plan_${date}`, plans);
  }

  const scores = [
    { label: '工作/学习', score: review.workScore, color: 'var(--color-primary)' },
    { label: '生活/健康', score: review.lifeScore, color: 'var(--color-accent-green)' },
    { label: '爱好/兴趣', score: review.hobbyScore, color: 'var(--color-accent-blue)' }
  ];

  const avgScore = ((review.workScore || 0) + (review.lifeScore || 0) + (review.hobbyScore || 0)) / 3;

  container.innerHTML = `
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px;">
      ${scores.map(s => `
        <div style="flex:1;min-width:100px;text-align:center;padding:12px;background:var(--color-bg);border-radius:var(--radius-md);">
          <div style="font-size:0.75rem;color:var(--color-text-light);margin-bottom:4px;">${s.label}</div>
          <div style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:${s.color};">${s.score}</div>
        </div>
      `).join('')}
      <div style="flex:1;min-width:100px;text-align:center;padding:12px;background:var(--color-amber-100);border-radius:var(--radius-md);">
        <div style="font-size:0.75rem;color:var(--color-text-light);margin-bottom:4px;">综合评分</div>
        <div style="font-family:var(--font-display);font-size:1.8rem;font-weight:700;color:var(--color-primary)">${avgScore.toFixed(1)}</div>
      </div>
    </div>

    <div class="analysis-grid">
      <div class="analysis-card highlight">
        <h4><i class="fa-solid fa-sun" style="color:var(--color-accent-green)"></i> 今日亮点</h4>
        <ul style="list-style:none;">
          ${analysis.highlights.map(h => `<li style="padding:4px 0;font-size:0.9rem;color:var(--color-text-secondary);">• ${h}</li>`).join('')}
        </ul>
      </div>
      <div class="analysis-card weakness">
        <h4><i class="fa-solid fa-cloud-rain" style="color:var(--color-accent-red)"></i> 待改进</h4>
        <ul style="list-style:none;">
          ${analysis.weaknesses.map(w => `<li style="padding:4px 0;font-size:0.9rem;color:var(--color-text-secondary);">• ${w}</li>`).join('')}
        </ul>
      </div>
      <div class="analysis-card improve">
        <h4><i class="fa-solid fa-arrow-trend-up" style="color:var(--color-accent-blue)"></i> 优化方向</h4>
        <ul style="list-style:none;">
          ${analysis.improvements.map(i => `<li style="padding:4px 0;font-size:0.9rem;color:var(--color-text-secondary);">• ${i}</li>`).join('')}
        </ul>
      </div>
    </div>

    <div class="action-plan">
      <h4 style="margin-bottom:12px;"><i class="fa-solid fa-list-check" style="color:var(--color-primary)"></i> 明日迭代计划</h4>
      <div id="action-list">
        ${plans.map((plan, idx) => `
          <div class="action-item" data-plan-idx="${idx}">
            <div class="action-check" onclick="toggleAction(this)">
              <i class="fa-solid fa-check"></i>
            </div>
            <span class="action-text">${plan}</span>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:12px;">
        <input type="text" class="action-add-text" placeholder="+ 添加自定义计划..." onkeydown="addActionPlan(event)">
      </div>
    </div>

    ${review.reflection ? `
    <div style="margin-top:20px;padding:16px;background:var(--color-amber-100);border-radius:var(--radius-md);border-left:4px solid var(--color-primary);">
      <div style="font-size:0.8rem;color:var(--color-text-light);margin-bottom:4px;"><i class="fa-solid fa-quote-left"></i> 今日感悟</div>
      <div style="font-size:0.95rem;color:var(--color-text-secondary);font-style:italic;">${review.reflection}</div>
    </div>` : ''}
  `;
}

function toggleAction(el) {
  el.classList.toggle('done');
  const text = el.nextElementSibling;
  if (text) text.classList.toggle('done');
}

function addActionPlan(e) {
  if (e.key !== 'Enter') return;
  const input = e.target;
  const text = input.value.trim();
  if (!text) return;

  const date = document.getElementById('report-date-picker').value;
  const plans = DataManager.getSetting(`plan_${date}`, []);
  plans.push(text);
  DataManager.setSetting(`plan_${date}`, plans);
  input.value = '';
  loadReport();
  showToast('已添加计划项', 'fa-plus');
}

/* ============================================================
   History Page
   ============================================================ */
let trendChartInstance = null;
let radarChartInstance = null;

function initHistory() {
  renderHeatmap();
  renderTrendChart();
  renderRadarChart();
}

function renderHeatmap() {
  const container = document.getElementById('heatmap');
  const allReviews = DataManager.getAllReviews();
  const reviewMap = {};
  allReviews.forEach(r => {
    const total = (r.workScore || 0) + (r.lifeScore || 0) + (r.hobbyScore || 0);
    reviewMap[r.date] = Math.round(total / 3);
  });

  const today = new Date();
  const startDate = new Date(today);
  startDate.setDate(today.getDate() - 111); // ~16 weeks
  startDate.setDate(startDate.getDate() - startDate.getDay());

  // Build weeks
  const weeks = [];
  let cursor = new Date(startDate);
  while (cursor <= today) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(cursor);
      week.push(d.toISOString().slice(0, 10));
      cursor.setDate(cursor.getDate() + 1);
    }
    weeks.push(week);
  }

  const dayLabels = ['', '一', '', '三', '', '五', ''];

  container.innerHTML = weeks.map((week, wi) => `
    <div class="heatmap-row">
      ${wi === 0 ? dayLabels.map((l, di) => `<div class="heatmap-label">${l}</div>`).join('') : `<div class="heatmap-label"></div>`.repeat(7)}
      ${week.map(date => {
        const score = reviewMap[date];
        const level = score ? Math.min(Math.ceil(score / 2), 5) : 0;
        const isFuture = date > getToday();
        return `
          <div class="heatmap-cell" data-level="${isFuture ? 0 : level}" style="${isFuture ? 'opacity:0.2;cursor:default;' : ''}">
            <div class="heatmap-tooltip">${date}: ${score ? score + '分' : '无记录'}</div>
          </div>`;
      }).join('')}
    </div>
  `).join('');
}

function renderTrendChart() {
  const ctx = document.getElementById('trend-chart').getContext('2d');
  const allReviews = DataManager.getAllReviews().reverse().slice(-30);

  if (trendChartInstance) trendChartInstance.destroy();

  if (allReviews.length === 0) {
    ctx.canvas.parentNode.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-chart-line"></i>
        <p>暂无数据，开始复盘后趋势图将自动生成</p>
      </div>`;
    return;
  }

  const labels = allReviews.map(r => r.date.slice(5));

  trendChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '工作/学习',
          data: allReviews.map(r => r.workScore || 0),
          borderColor: '#E8842A',
          backgroundColor: 'rgba(232,132,42,0.1)',
          fill: true,
          tension: 0.4,
          pointRadius: 3,
        },
        {
          label: '生活/健康',
          data: allReviews.map(r => r.lifeScore || 0),
          borderColor: '#2D6A4F',
          backgroundColor: 'rgba(45,106,79,0.1)',
          fill: true,
          tension: 0.4,
          pointRadius: 3,
        },
        {
          label: '爱好/兴趣',
          data: allReviews.map(r => r.hobbyScore || 0),
          borderColor: '#4A7BC9',
          backgroundColor: 'rgba(74,123,201,0.1)',
          fill: true,
          tension: 0.4,
          pointRadius: 3,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 16, font: { family: 'Noto Sans SC' } } }
      },
      scales: {
        y: { min: 0, max: 10, ticks: { stepSize: 2 } },
        x: { grid: { display: false } }
      }
    }
  });
}

function renderRadarChart() {
  const ctx = document.getElementById('radar-chart').getContext('2d');
  const allReviews = DataManager.getAllReviews();

  if (radarChartInstance) radarChartInstance.destroy();

  if (allReviews.length === 0) {
    ctx.canvas.parentNode.innerHTML = `
      <div class="empty-state">
        <i class="fa-solid fa-chart-pie"></i>
        <p>暂无数据，开始复盘后均衡度图将自动生成</p>
      </div>`;
    return;
  }

  const avgWork = allReviews.reduce((s, r) => s + (r.workScore || 0), 0) / allReviews.length || 0;
  const avgLife = allReviews.reduce((s, r) => s + (r.lifeScore || 0), 0) / allReviews.length || 0;
  const avgHobby = allReviews.reduce((s, r) => s + (r.hobbyScore || 0), 0) / allReviews.length || 0;

  radarChartInstance = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['工作/学习', '生活/健康', '爱好/兴趣'],
      datasets: [{
        label: '平均评分',
        data: [avgWork, avgLife, avgHobby],
        backgroundColor: 'rgba(232,132,42,0.15)',
        borderColor: '#E8842A',
        pointBackgroundColor: '#E8842A',
        pointBorderColor: '#fff',
        pointHoverRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false }
      },
      scales: {
        r: {
          min: 0,
          max: 10,
          ticks: { stepSize: 2, font: { size: 10 } },
          pointLabels: { font: { family: 'Noto Sans SC', size: 12 } }
        }
      }
    }
  });
}

   Achievements Page
   ============================================================ */
function initAchievements() {
  const container = document.getElementById('achievements-grid');
  const achievements = DataManager.getAchievements();
  const unlockedIds = new Set(achievements.map(a => a.id));

  container.innerHTML = AchievementDefs.map(def => {
    const unlocked = unlockedIds.has(def.id);
    const ach = achievements.find(a => a.id === def.id);
    return `
      <div class="achievement-item ${unlocked ? '' : 'locked'}">
        <div class="achievement-icon">${def.icon}</div>
        <div class="achievement-name">${def.name}</div>
        <div class="achievement-desc">${def.desc}</div>
      </div>`;
  }).join('');
}
