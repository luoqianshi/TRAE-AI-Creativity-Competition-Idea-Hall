      label.addEventListener('mouseleave', () => {
        sliderTrack.style.borderColor = modelColors[currentModel] + 'bb';
        sliderTrack.style.boxShadow = '';
      });
      sliderLabels.appendChild(label);
    });
    updateSliderUI(currentModel);
  }

  function updateSliderUI(modelName) {
    const idx = MODEL_ORDER.indexOf(modelName);
    if (idx < 0) return;
    const total = MODEL_ORDER.length;
    const pct = ((idx + 0.5) / total) * 100;
    sliderThumb.style.left = pct + '%';
    sliderThumb.style.background = modelColors[modelName] + '26';
    sliderTrack.style.borderColor = modelColors[modelName] + 'bb';

    sliderLabels.querySelectorAll('.slider-label').forEach(l => l.classList.remove('active'));
    const activeLabel = sliderLabels.querySelector(`[data-model="${modelName}"]`);
    if (activeLabel) activeLabel.classList.add('active');
  }

  buildSlider();
  setProgress(68, '模型选择器构建完成');

  // ==================== SLIDER DRAG & SNAP ====================
  setProgress(70, '正在初始化交互事件…');
  let sliderDragging = false;
  let sliderStartX = 0;
  let sliderMoved = false;
  let sliderSnappedIdx = -1;
  let sliderPrimed = false;
  const SNAP_THRESHOLD = 0.06;
  const DRAG_THRESHOLD = 3;

  function getSliderOptionCenters() {
    const total = MODEL_ORDER.length;
    const centers = [];
    for (let i = 0; i < total; i++) {
      centers.push((i + 0.5) / total);
    }
    return centers;
  }

  function pctFromEvent(e) {
    const rect = sliderTrack.getBoundingClientRect();
    const clientX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  }

  function findNearestSnap(pct) {
    const centers = getSliderOptionCenters();
    let bestIdx = 0;
    let bestDist = Infinity;
    for (let i = 0; i < centers.length; i++) {
      const d = Math.abs(pct - centers[i]);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    }
    return { idx: bestIdx, dist: bestDist, center: centers[bestIdx] };
  }

  function sliderStart(e) {
    sliderDragging = true;
    sliderMoved = false;
    sliderPrimed = false;
    sliderStartX = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    sliderThumb.classList.add('pressing');
    sliderThumb.classList.remove('snapping');
    applyThumbScale(sliderHoverT, true);
    applySliderGlow(sliderHoverT, true);
    sliderMove(e);
  }

  function sliderMove(e) {
    if (!sliderDragging) return;
    e.preventDefault();
    const cx = e.clientX != null ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    if (!sliderMoved && Math.abs(cx - sliderStartX) < DRAG_THRESHOLD) return;
    if (!sliderPrimed) {
      sliderThumb.style.transition = 'none';
      void sliderThumb.offsetLeft;
      sliderThumb.style.transition = 'left 0.3s cubic-bezier(0.25,0.1,0.25,1), background 0.3s ease, transform 0.15s cubic-bezier(0.22,0.61,0.36,1), box-shadow 0.15s ease';
      sliderPrimed = true;
    }
    sliderMoved = true;
    const halfThumb = 0.5 / MODEL_ORDER.length;
    const pct = Math.max(halfThumb, Math.min(1 - halfThumb, pctFromEvent(e)));
    const snap = findNearestSnap(pct);
    if (snap.dist < SNAP_THRESHOLD) {
      sliderThumb.style.left = (snap.center * 100) + '%';
      sliderThumb.style.background = modelColors[MODEL_ORDER[snap.idx]] + '26';
      sliderSnappedIdx = snap.idx;
    } else {
      sliderThumb.style.left = (pct * 100) + '%';
      sliderSnappedIdx = -1;
    }
  }

  function sliderEnd(e) {
    if (!sliderDragging) return;
    sliderDragging = false;
    sliderThumb.classList.remove('pressing');
    applyThumbScale(sliderHoverT, false);
    applySliderGlow(sliderHoverT, false);

    if (!sliderMoved) {
      const label = (e.target || (e.changedTouches && e.changedTouches[0] && document.elementFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY)));
      const lbl = label && label.closest ? label.closest('.slider-label') : null;
      if (lbl && lbl.dataset.model) {
        sliderThumb.style.transition = 'left 0.55s cubic-bezier(0.25,0.1,0.25,1), background 0.55s ease';
        setModel(lbl.dataset.model);
      }
      sliderThumb.classList.add('snapping');
      setTimeout(() => {
        sliderThumb.classList.remove('snapping');
        sliderThumb.style.transition = '';
      }, 600);
      return;
    }

    sliderThumb.classList.add('snapping');
    sliderThumb.style.transition = 'left 0.55s cubic-bezier(0.25,0.1,0.25,1), background 0.55s ease';
    let targetModel;
    if (sliderSnappedIdx >= 0) {
      targetModel = MODEL_ORDER[sliderSnappedIdx];
    } else {
      const pct = pctFromEvent(e.changedTouches ? e.changedTouches[0] : e);
      const snap = findNearestSnap(pct);
      targetModel = MODEL_ORDER[snap.idx];
    }
    setModel(targetModel);
    sliderSnappedIdx = -1;
    setTimeout(() => {
      sliderThumb.classList.remove('snapping');
      sliderThumb.style.transition = '';
    }, 600);
  }

  sliderTrack.addEventListener('mousedown', sliderStart);
  function sliderForceEnd() {
    if (!sliderDragging) return;
    const pct = parseFloat(sliderThumb.style.left) / 100 || 0.5;
    const snap = findNearestSnap(pct);
    const targetModel = MODEL_ORDER[snap.idx];
    sliderDragging = false;
    sliderThumb.classList.remove('pressing');
    applyThumbScale(sliderHoverT, false);
    applySliderGlow(sliderHoverT, false);
    sliderThumb.classList.add('snapping');
    sliderThumb.style.transition = 'left 0.55s cubic-bezier(0.25,0.1,0.25,1), background 0.55s ease';
    setModel(targetModel);
    setTimeout(() => {
      sliderThumb.classList.remove('snapping');
      sliderThumb.style.transition = '';
    }, 600);
  }

  window.addEventListener('mousemove', sliderMove);
  window.addEventListener('mouseup', sliderEnd);
  document.addEventListener('mouseout', e => {
    if (!e.relatedTarget && !e.toElement) sliderForceEnd();
  });
  window.addEventListener('blur', sliderForceEnd);
  sliderTrack.addEventListener('touchstart', sliderStart, { passive: false });
  window.addEventListener('touchmove', sliderMove, { passive: false });
  window.addEventListener('touchend', sliderEnd);

  const SLIDER_HOVER_MAX_SCALE = 1.08;
  const SLIDER_PRESS_EXTRA_SCALE = 1.15;
  const SLIDER_HOVER_DIST = 120;

  function applySliderGlow(t, pressed) {
    if (pressed) {
      const borderAlpha = 0.6 + t * 0.4;
      sliderThumb.style.borderColor = 'rgba(255,255,255,' + borderAlpha.toFixed(2) + ')';
      sliderThumb.style.boxShadow = '0 0 16px rgba(255,255,255,' + (0.3 + t * 0.35).toFixed(2) + ')';
    } else if (t > 0) {
      const borderAlpha = 0.45 + t * 0.35;
      sliderThumb.style.borderColor = 'rgba(255,255,255,' + borderAlpha.toFixed(2) + ')';
      sliderThumb.style.boxShadow = '0 0 10px rgba(255,255,255,' + (t * 0.3).toFixed(2) + ')';
    } else {
      sliderThumb.style.borderColor = '';
      sliderThumb.style.boxShadow = '';
    }
  }

  function applyThumbScale(t, pressed) {
    const baseScale = 1 + (SLIDER_HOVER_MAX_SCALE - 1) * t;
    const finalScale = pressed ? baseScale * SLIDER_PRESS_EXTRA_SCALE : baseScale;
    sliderThumb.style.transform = 'translateX(-50%) scale(' + finalScale.toFixed(4) + ')';
  }

  let sliderHoverT = 0;

  window.addEventListener('mousemove', e => {
    const rect = sliderThumb.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = Math.max(0, Math.abs(e.clientX - cx) - rect.width / 2);
    const dy = Math.max(0, Math.abs(e.clientY - cy) - rect.height / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    const t = Math.max(0, 1 - dist / SLIDER_HOVER_DIST);
    sliderHoverT = t;
    applyThumbScale(t, sliderDragging);
    applySliderGlow(t, sliderDragging);
  });

  document.addEventListener('mouseleave', () => {
    sliderHoverT = 0;
    applyThumbScale(0, false);
    applySliderGlow(0, false);
  });

  sliderTrack.addEventListener('touchstart', () => {
    applyThumbScale(1, true);
    applySliderGlow(1, true);
  }, { passive: true });

  sliderTrack.addEventListener('touchend', () => {
    applyThumbScale(0, false);
    applySliderGlow(0, false);
  }, { passive: true });

  // ==================== HAND GESTURE ====================
  setProgress(72, '正在初始化手势识别模块…');

  function initHands() {
    const Hands = window.Hands;
    if (!Hands) {
      handsLoadState = 'failed';
      return;
    }

    handsLoadState = 'loading';

    try {
      handsInstance = new Hands({
        locateFile: (f) => window.__MP_BASE + '/hands@0.4/' + f
      });
      handsInstance.setOptions({
        maxNumHands: 1, modelComplexity: 0,
        minDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
      });
      handsInstance.onResults(onHandResults);
      if (isFileProtocol) {
        handsLoadState = 'done';
      } else {
        handsLoadState = 'loading';
        handsInstance.initialize().then(function() {
          handsLoadState = 'done';
        }).catch(function(e) {
          console.error('Hands model init failed:', e);
          handsLoadState = 'failed';
        });
      }
    } catch (e) {
      console.error('MediaPipe Hands creation failed:', e);
      handsLoadState = 'failed';
    }
  }

  function initCamera() {
    camLoadState = 'loading';
    camToggle.title = '获取摄像头权限…';
    const constraints = {
      video: {
        width: { ideal: 480 },
        height: { ideal: 360 },
        facingMode: 'user',
        frameRate: { ideal: 30 }
      }
    };
    navigator.mediaDevices.getUserMedia(constraints).then(function (stream) {
      camVideo.srcObject = stream;
      camVideo.setAttribute('playsinline', '');
      camVideo.setAttribute('webkit-playsinline', '');
      return camVideo.play();
    }).then(function () {
      camWrap.classList.remove('off');
      const Camera = window.Camera;
      if (!Camera) throw new Error('Camera utils missing');
      let handProcessing = false;
      cameraUtils = new Camera(camVideo, {
        onFrame: () => {
          if (!handProcessing && camVideo.readyState >= 2 && handsInstance) {
            handProcessing = true;
            handsInstance.send({ image: camVideo }).then(() => {
              handProcessing = false;
            }).catch(() => { handProcessing = false; });
          }
        },
        width: 480,
        height: 360,
      });
      cameraUtils.start();
      cameraEnabled = true;
      camLoadState = 'done';
      camLabel.textContent = '镜头开关';
      camToggle.title = '摄像头：已开启';
    }).catch(function (err) {
      console.warn('Camera failed:', err);
      camLoadState = 'failed';
      camToggle.classList.remove('on');
      camToggle.title = '无相机权限';
      camLabel.textContent = '无相机权限';
      cameraEnabled = false;
    });
  }

  function findRightHand(results) {
    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
      trackedHandIdx = -1;
      return -1;
    }
    const hands = results.multiHandLandmarks;
    if (trackedHandIdx >= 0 && trackedHandIdx < hands.length) {
      return trackedHandIdx;
    }
    trackedHandIdx = 0;
    return 0;
  }

  function distance(a,b) {
    const dx=a.x-b.x, dy=a.y-b.y, dz=(a.z||0)-(b.z||0);
    return Math.sqrt(dx*dx+dy*dy+dz*dz);
  }

  function onHandResults(results) {
    const handIdx = findRightHand(results);
    if (handIdx < 0) {
      handDetected = false;
      isOneFinger = false;
      isPointing = false;
      isPinching = false;
      return;
    }

    handDetected = true;
    lastControlSource = 'hand';
    const lm = results.multiHandLandmarks[handIdx];

    const indexExtended = lm[8].y < lm[5].y;
    const middleExtended = lm[12].y < lm[10].y;
    const ringExtended = lm[16].y < lm[14].y;
    const pinkyExtended = lm[20].y < lm[18].y;

    const thumbTip = lm[4];
    const indexTip = lm[8];
    const middleTip = lm[12];
    const ringTip = lm[16];
    const pinkyTip = lm[20];
    const wrist = lm[0];
    const middleBase = lm[9];

    const dist48  = distance(thumbTip, indexTip);
    const dist412 = distance(thumbTip, middleTip);
    const dist416 = distance(thumbTip, ringTip);
    const dist420 = distance(thumbTip, pinkyTip);
    const palmRef = distance(wrist, middleBase);

    const indexMCP = lm[5];
    const indexTipToMCP = distance(indexTip, indexMCP);
    const indexTrulyExtended = indexTipToMCP > palmRef * 0.45;

    const thumbMCP = lm[2];
    const thumbTipToMCP = distance(thumbTip, thumbMCP);
    const thumbTrulyExtended = thumbTipToMCP > palmRef * 0.28;

    const thumbIndexDist = distance(thumbTip, indexTip);
    isTwoFingerPinch = indexTrulyExtended && !middleExtended &&
                       thumbIndexDist < palmRef * 0.35 && 
                       !ringExtended && !pinkyExtended;

    let avgDist;
    let isFakePinch = isTwoFingerPinch;
    if (isFakePinch) {
      avgDist = (dist416 + dist420) * 0.5;
    } else if (indexTrulyExtended) {
      avgDist = (dist412 + dist416 + dist420) / 3;
    } else {
      avgDist = (thumbIndexDist + dist412 + dist416 + dist420) * 0.25;
    }
    const norm = palmRef > 0.001 ? avgDist / palmRef : 0.5;
    const handGestureValue = THREE.MathUtils.clamp((norm - 0.29) / 1.0, 0.0, 1.0);

    isPinching = thumbTrulyExtended && isTwoFingerPinch;
    
    if (lastControlSource !== 'wheel' && !isPointing) {
      rawGestureTarget += (handGestureValue - rawGestureTarget) * 0.25;
      actualGesturePercent = rawGestureTarget * 100;
      lastControlSource = 'hand';
    }

    rawPinchDist = thumbIndexDist;
    smoothPinchDist += (rawPinchDist - smoothPinchDist) * PINCH_SMOOTH;

    const pinchOpenThreshold = 0.15;
    const rawPinchPct = smoothPinchDist >= pinchOpenThreshold ? 0 :
                        Math.round((1 - smoothPinchDist / pinchOpenThreshold) * 100);
    pinchPercent = Math.max(0, Math.min(100, rawPinchPct));

    const PINCH_FULL_TRIGGER = 50;
    mappedPinchValue = Math.min(100, (pinchPercent / PINCH_FULL_TRIGGER) * 100);

    const middleCurled = lm[12].y > lm[10].y;
    const ringCurled = lm[16].y > lm[14].y;
    const pinkyCurled = lm[20].y > lm[18].y;
    isOneFinger = indexTrulyExtended && middleCurled && ringCurled && pinkyCurled;
    isPointing = isOneFinger && !isPinching;
    
    if (mappedPinchValue >= 99 && pinchArmed && !isTransitioning && !pinchTriggered && isPinching) {
      const ci = MODEL_ORDER.indexOf(currentModel);
      const next = MODEL_ORDER[(ci+1)%MODEL_ORDER.length];
      setModel(next);
      pinchArmed = false;
      pinchTriggered = true;
    }
    if (mappedPinchValue < 5) {
      pinchArmed = true;
    }

    const rawFingerX = lm[8].x;
    const rawFingerY = lm[8].y;

    if (!handTrackingReady) {
      smoothFingerX = rawFingerX;
      smoothFingerY = rawFingerY;
      prevFingerX = rawFingerX;
      prevFingerY = rawFingerY;
      handTrackingReady = true;
      lastHandTime = performance.now();
    } else {
      const now = performance.now();
      const handDt = lastHandTime > 0 ? (now - lastHandTime) / 1000 : HAND_DT_REF;
      lastHandTime = now;
      const dtNorm = HAND_DT_REF / Math.max(handDt, HAND_DT_REF);

      smoothFingerX += (rawFingerX - smoothFingerX) * FINGER_SMOOTH;
      smoothFingerY += (rawFingerY - smoothFingerY) * FINGER_SMOOTH;
      let dx = (smoothFingerX - prevFingerX) * dtNorm;
      let dy = (smoothFingerY - prevFingerY) * dtNorm;
      const HAND_DEAD_ZONE = 0.03;
      if (Math.abs(dx) < HAND_DEAD_ZONE) dx = 0;
      if (Math.abs(dy) < HAND_DEAD_ZONE) dy = 0;
      prevFingerX = smoothFingerX;
      prevFingerY = smoothFingerY;
      smoothRotDeltaX += (dx - smoothRotDeltaX) * 0.25;
      smoothRotDeltaY += (dy - smoothRotDeltaY) * 0.25;
    }

    if (!palmActive) palmActive = true;
  }

  // ==================== MOUSE ====================
  setProgress(74, '正在初始化鼠标控制…');
  let mouseX = 0.5;
  let mouseY = 0.5;
  let prevMouseX = 0.5;
  let mouseButton = 0;
  let mouseActive = false;
  let mouseIdleTimer = 0;
  const MOUSE_IDLE_TIMEOUT = 0.6;

  let prevMouseY = 0.5;

  window.addEventListener('mousemove', e => {
    const nx = e.clientX / window.innerWidth;
    const ny = 1 - e.clientY / window.innerHeight;
    const dx = nx - prevMouseX;
    const dy = ny - prevMouseY;
    prevMouseX = nx;
    prevMouseY = ny;
    mouseX = nx;
    mouseY = ny;

    if (!mouseEnabled) return;
    if (!sliderDragging && (e.target.closest('#panel') || e.target.closest('#model-slider-wrap'))) return;
    mouseActive = true;
    mouseIdleTimer = MOUSE_IDLE_TIMEOUT;
    lastControlSource = 'mouse';
    if (mouseButton === 1) {
      if (Math.abs(dx) > 0.001) rotDeltaY += dx * 8 * 0.7;
      if (Math.abs(dy) > 0.001) rotDeltaX -= dy * 5 * 0.7;
    } else {
      if (Math.abs(dx) > 0.001) rotDeltaY += dx * 8 * 0.1715;
      if (Math.abs(dy) > 0.001) rotDeltaX -= dy * 5 * 0.1715;
    }
  });

  window.addEventListener('mousedown', e => {
    if (e.button === 2) {
      const ci = MODEL_ORDER.indexOf(currentModel);
      setModel(MODEL_ORDER[(ci + 1) % MODEL_ORDER.length]);
      return;
    }
    if (!mouseEnabled) return;
    if (e.target.closest('#panel') || e.target.closest('#model-slider-wrap')) return;
    mouseButton = e.button === 0 ? 1 : 0;
  });

  window.addEventListener('mouseup', () => {
    mouseButton = 0;
  });

  document.addEventListener('mouseout', e => {
    if (!e.relatedTarget && !e.toElement) {
      mouseButton = 0;
    }
  });

  window.addEventListener('blur', () => {
    mouseButton = 0;
  });

  window.addEventListener('contextmenu', e => e.preventDefault());

  setProgress(76, '正在初始化触屏控制…');
  let touchMode = 'none';
  let singleTouchPrevX = 0;
  let singleTouchPrevY = 0;
  let prevPinchDist = 0;
  let isTouching = false;

  function getTouchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  window.addEventListener('touchstart', e => {
    if (e.target.closest('#panel') || e.target.closest('#model-slider-wrap')) return;
    isTouching = true;
    lastControlSource = 'touch';

    if (e.touches.length === 1) {
      touchMode = 'single';
      singleTouchPrevX = e.touches[0].clientX / window.innerWidth;
      singleTouchPrevY = 1 - e.touches[0].clientY / window.innerHeight;
    } else if (e.touches.length >= 2) {
      e.preventDefault();
      touchMode = 'pinch';
      prevPinchDist = getTouchDist(e.touches);
    }
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (!isTouching) return;
    if (!sliderDragging && (e.target.closest('#panel') || e.target.closest('#model-slider-wrap'))) return;
    e.preventDefault();
    lastControlSource = 'touch';

    if (e.touches.length === 1) {
      if (touchMode === 'pinch') {
        touchMode = 'single';
        singleTouchPrevX = e.touches[0].clientX / window.innerWidth;
        singleTouchPrevY = 1 - e.touches[0].clientY / window.innerHeight;
        return;
      }
      touchMode = 'single';
      const nx = e.touches[0].clientX / window.innerWidth;
      const ny = 1 - e.touches[0].clientY / window.innerHeight;
      const dx = nx - singleTouchPrevX;
      const dy = ny - singleTouchPrevY;
      singleTouchPrevX = nx;
      singleTouchPrevY = ny;
      rotDeltaY += dx * 6;
      rotDeltaX -= dy * 4;
    } else if (e.touches.length >= 2) {
      const currentDist = getTouchDist(e.touches);
      if (touchMode !== 'pinch') {
        touchMode = 'pinch';
        prevPinchDist = currentDist;
        return;
      }
      if (prevPinchDist > 10) {
        const delta = (currentDist - prevPinchDist) / window.innerHeight * 2;
        rawGestureTarget = THREE.MathUtils.clamp(rawGestureTarget + delta, 0, 1);
        actualGesturePercent = rawGestureTarget * 100;
        prevPinchDist = currentDist;
      }
    }
  }, { passive: false });

  window.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
      isTouching = false;
      touchMode = 'none';
      prevPinchDist = 0;
    } else if (e.touches.length === 1) {
      touchMode = 'single';
      singleTouchPrevX = e.touches[0].clientX / window.innerWidth;
      singleTouchPrevY = 1 - e.touches[0].clientY / window.innerHeight;
      prevPinchDist = 0;
    }
  }, { passive: true });

  window.addEventListener('touchcancel', () => {
    isTouching = false;
    touchMode = 'none';
    prevPinchDist = 0;
  }, { passive: true });

  // ==================== ANIMATION LOOP ====================
  const clock = new THREE.Clock();
  let timeAccum = 0;
  const _tmpQuat = new THREE.Quaternion();
  const _tmpAxis = new THREE.Vector3();

  function setIfDiff(el, prop, val) {
    if (prop === 'textContent') {
      if (el._t !== val) { el._t = val; el.textContent = val; }
    } else if (prop === 'style.width') {
      if (el._sw !== val) { el._sw = val; el.style.width = val; }
    } else if (prop === 'style.opacity') {
      if (el._so !== val) { el._so = val; el.style.opacity = val; }
    } else if (prop === 'style.background') {
      if (el._sb !== val) { el._sb = val; el.style.background = val; }
    } else if (prop === 'style.color') {
      if (el._sc !== val) { el._sc = val; el.style.color = val; }
    }
  }

  function easeInOutCubic(t) {
    return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);
    timeAccum += dt;

    drawStarfield();

    if (mouseActive) {
      mouseIdleTimer -= dt;
      if (mouseIdleTimer <= 0) {
        mouseActive = false;
        mouseIdleTimer = 0;
      }
    }

    if (lastControlSource === 'wheel') {
      wheelControlTimer -= dt;
      if (wheelControlTimer <= 0) {
        if (handDetected) lastControlSource = 'hand';
        else lastControlSource = isMobileDevice ? 'touch' : 'mouse';
      }
    }

    if (!handDetected && pinchPercent > 0) {
      pinchPercent = Math.max(0, pinchPercent - dt * 150);
      mappedPinchValue = Math.min(100, (pinchPercent / 35) * 100);
    }



    let gestureTarget = (!cameraEnabled && lastControlSource === 'hand') ? 0 : rawGestureTarget;

    const GESTURE_SPEED = 6.0;
    if (gestureValue < gestureTarget) gestureValue = Math.min(gestureValue + GESTURE_SPEED * dt, gestureTarget);
    else if (gestureValue > gestureTarget) gestureValue = Math.max(gestureValue - GESTURE_SPEED * dt, gestureTarget);

    const uiTarget = gestureTarget <= 0.12 ? 0 : (gestureTarget - 0.12) / 0.88;
    uiGestureValue += (uiTarget - uiGestureValue) * Math.min(1, GESTURE_SPEED * dt);

    if (isTransitioning) {
      transitionT += dt / TRANSITION_DURATION;
      if (transitionT >= 1) {
        transitionT = 1;
        isTransitioning = false;
        particleGeo.attributes.position.array.set(particleGeo.attributes.aDst.array);
        particleGeo.attributes.position.needsUpdate = true;
      }
      particleUniforms.uTransitionT.value = transitionT;
      const targetSF = 0.65 + 0.35 * Math.cos(transitionT * Math.PI * 2);
      transitionScaleFactor += (targetSF - transitionScaleFactor) * 16 * dt;
    } else {
      transitionScaleFactor += (1.0 - transitionScaleFactor) * 4 * dt;
    }

    const spread = (0.4845 + uiGestureValue * 2.3697765) * transitionScaleFactor;
    const scale  = (0.548494375 + uiGestureValue * 1.1017125) * transitionScaleFactor;

    particleUniforms.uTime.value = timeAccum;
    particleUniforms.uGesture.value = uiGestureValue;
    particleUniforms.uSpread.value = spread;
    particleUniforms.uBaseScale.value = scale;

    particleGroup.scale.setScalar(scale);

    if (handDetected && !isPinching) {
      rotDeltaX = 0;
      rotDeltaY = 0;
      const targetYaw = -(smoothFingerX - 0.5) * Math.PI * 1.6;
      const targetPitch = (smoothFingerY - 0.5) * Math.PI * 1.2;
      const tq = new THREE.Quaternion();
      _tmpAxis.set(0, 1, 0);
      tq.setFromAxisAngle(_tmpAxis, targetYaw);
      _tmpAxis.set(1, 0, 0);
      _tmpQuat.setFromAxisAngle(_tmpAxis, targetPitch);
      tq.multiply(_tmpQuat);
      particleGroup.quaternion.slerp(tq, 3.0 * dt);
    } else if (rotDeltaX !== 0 || rotDeltaY !== 0) {
      const consume = 1 - Math.exp(-12 * dt);
      const stepX = rotDeltaX * consume;
      const stepY = rotDeltaY * consume;
      _tmpAxis.set(1, 0, 0);
      _tmpQuat.setFromAxisAngle(_tmpAxis, stepX);
      particleGroup.quaternion.premultiply(_tmpQuat);
      _tmpAxis.set(0, 1, 0);
      _tmpQuat.setFromAxisAngle(_tmpAxis, stepY);
      particleGroup.quaternion.premultiply(_tmpQuat);
      rotDeltaX -= stepX;
      rotDeltaY -= stepY;
      if (Math.abs(rotDeltaX) < 1e-6) rotDeltaX = 0;
      if (Math.abs(rotDeltaY) < 1e-6) rotDeltaY = 0;
    }

    if (!handDetected && mouseButton === 0 && !isTouching && !mouseActive) {
      handLostTimer += dt;
      if (handLostTimer > 0.5) {
        _tmpAxis.set(1, 0, 0);
        _tmpQuat.setFromAxisAngle(_tmpAxis, autoRotSpeedY * dt);
        particleGroup.quaternion.premultiply(_tmpQuat);
        _tmpAxis.set(0, 1, 0);
        _tmpQuat.setFromAxisAngle(_tmpAxis, autoRotSpeedX * dt);
        particleGroup.quaternion.premultiply(_tmpQuat);
        _tmpAxis.set(0, 0, 1);
        _tmpQuat.setFromAxisAngle(_tmpAxis, autoRotSpeedZ * dt);
        particleGroup.quaternion.premultiply(_tmpQuat);
      }
    } else if (handDetected) {
      handLostTimer = 0;
    }

    // --- Gesture bar (smooth display + transition-aware) ---
    const barInputVal = rawGestureTarget <= 0.12 ? 0 : (rawGestureTarget - 0.12) / 0.88;
    const rawBarVal = barInputVal * transitionScaleFactor;
    displayGestureBarValue += (rawBarVal - displayGestureBarValue) * Math.min(1, 20 * dt);
    const barVal = displayGestureBarValue >= 0.97 ? 100 : Math.max(0, Math.floor(displayGestureBarValue * 100 + 0.5));
    const gestureBarW = barVal + '%';
    setIfDiff(gestureBar, 'style.width', gestureBarW);

    let gestureLabelStr;
    if (handsLoadState === 'loading') {
      gestureLabelStr = '正在加载手势模型';
    } else if (handDetected && rawGestureTarget > 0.7) {
      gestureLabelStr = '手掌张开 — 扩散中';
      setIfDiff(gestureLabelText, 'style.color', 'var(--particle-color)');
    } else if (handDetected && rawGestureTarget < 0.25) {
      gestureLabelStr = '手掌收拢 — 收缩中';
      setIfDiff(gestureLabelText, 'style.color', 'var(--particle-color)');
    } else if (handDetected) {
      gestureLabelStr = '手势识别中…';
      setIfDiff(gestureLabelText, 'style.color', 'var(--particle-color)');
    } else if (lastControlSource === 'hand') {
      gestureLabelStr = '等待手势';
      setIfDiff(gestureLabelText, 'style.color', 'var(--text-dim)');
    } else if (lastControlSource === 'touch') {
      gestureLabelStr = '触屏';
      setIfDiff(gestureLabelText, 'style.color', 'var(--text-dim)');
    } else {
      gestureLabelStr = '鼠标';
      setIfDiff(gestureLabelText, 'style.color', 'var(--text-dim)');
    }
    setIfDiff(gestureLabelText, 'textContent', gestureLabelStr);

    const gestureValStr = cameraEnabled ? (Math.round(actualGesturePercent) + '%') : '';
    setIfDiff(gestureActualVal, 'textContent', gestureValStr);

    // --- Left-center pinch bar (mapped) ---
    displayPinchPercent += (mappedPinchValue - displayPinchPercent) * Math.min(1, 20 * dt);
    pinchBar.style.width = Math.max(0, Math.round(displayPinchPercent)) + '%';

    if (pinchTriggered && mappedPinchValue < 5) {
      pinchTriggered = false;
    }

    const isFist = handDetected && rawGestureTarget < 0.15;

    pinchActualVal.textContent = cameraEnabled ? (Math.round(pinchPercent) + '%') : '';

    if (cameraEnabled && !handDetected && lastControlSource === 'hand') {
      pinchBar.style.background = 'rgba(255,255,255,0.06)';
      pinchLabelText.textContent = '等待手势';
      pinchLabelText.style.color = 'var(--text-dim)';
      pinchActualVal.textContent = '';
    } else if (cameraEnabled && !handDetected && lastControlSource === 'touch') {
      pinchBar.style.background = 'rgba(255,255,255,0.06)';
      pinchLabelText.textContent = '触屏';
      pinchLabelText.style.color = 'var(--text-dim)';
      pinchActualVal.textContent = '';
    } else if (cameraEnabled && !handDetected) {
      pinchBar.style.background = 'rgba(255,255,255,0.06)';
      pinchLabelText.textContent = '鼠标';
      pinchLabelText.style.color = 'var(--text-dim)';
      pinchActualVal.textContent = '';
    } else if (pinchTriggered) {
      pinchBar.style.background = 'linear-gradient(90deg, #ffab40, #ffd740)';
      pinchLabelText.textContent = '松开手以重新切换';
      pinchLabelText.style.color = '#ffab40';
    } else if (handDetected && pinchPercent > 5) {
      pinchBar.style.background = 'linear-gradient(90deg, color-mix(in srgb, var(--particle-color) 60%, #7c4dff), var(--particle-color))';
      pinchLabelText.textContent = isPinching ? '捏合中-准备切换' : '捏合中…';
      pinchLabelText.style.color = 'var(--particle-color)';
    } else if (handDetected && isPointing) {
      pinchBar.style.background = 'rgba(128,128,128,0.3)';
      pinchLabelText.textContent = '单指-操控旋转';
      pinchLabelText.style.color = '#888';
      pinchActualVal.textContent = '';
    } else if (handDetected && gestureValue > 0.5) {
      pinchBar.style.background = 'rgba(128,128,128,0.3)';
      pinchLabelText.textContent = '手掌张开 — 暂不可切换';
      pinchLabelText.style.color = '#888';
    } else if (isFist) {
      pinchBar.style.background = 'rgba(255,255,255,0.06)';
      pinchLabelText.textContent = '握拳中 — 不可切换';
      pinchLabelText.style.color = 'var(--text-dim)';
    } else {
      pinchBar.style.background = 'rgba(255,255,255,0.12)';
      pinchLabelText.textContent = pinchArmed ? '就绪 — 双指捏合切换' : '张开手指以重新启用';
      pinchLabelText.style.color = 'var(--particle-color)';
    }

    if (!cameraEnabled) {
      pinchBar.style.width = '0%';
      pinchBar.style.background = 'rgba(255,255,255,0.06)';
      pinchLabelText.textContent = '无相机权限';
      pinchLabelText.style.color = 'var(--text-dim)';
      pinchActualVal.textContent = '';
    }

    const COLOR_LERP_DURATION = 0.55;
    if (particleUniforms.uColorT.value < 1.0) {
      particleUniforms.uColorT.value = Math.min(particleUniforms.uColorT.value + dt / COLOR_LERP_DURATION, 1.0);
    }

    renderer.render(scene, camera);
  }

  // ==================== UI HANDLERS ====================
  function updateParticleColorCSS(colorVal) {
    const root = document.documentElement;
    root.style.setProperty('--particle-color', colorVal);
    const hex = colorVal.replace('#', '');
    const r = parseInt(hex.substring(0, 2), 16);
    const g = parseInt(hex.substring(2, 4), 16);
    const b = parseInt(hex.substring(4, 6), 16);
    root.style.setProperty('--particle-color-alpha-10', `rgba(${r},${g},${b},0.1)`);
    root.style.setProperty('--particle-color-alpha-20', `rgba(${r},${g},${b},0.2)`);
    root.style.setProperty('--particle-color-alpha-30', `rgba(${r},${g},${b},0.3)`);
    root.style.setProperty('--particle-color-alpha-45', `rgba(${r},${g},${b},0.45)`);
  }

  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      sw.classList.add('swatch-flash');
      setTimeout(() => sw.classList.remove('swatch-flash'), 550);
      const colorVal = sw.dataset.color;
      updateParticleColorCSS(colorVal);
      const newColor = new THREE.Color(colorVal);
      const fromColor = particleUniforms.uColorFrom.value;
      const toColor = particleUniforms.uColorTo.value;
      particleUniforms.uColorFrom.value.copy(toColor);
      particleUniforms.uColorTo.value.copy(newColor);
      particleUniforms.uColorT.value = 0;
      const panel = document.getElementById('panel');
      panel.style.borderWidth = '3.5px';
      setTimeout(() => panel.style.borderWidth = '2.5px', 200);
    });
  });

  mouseToggle.addEventListener('click', () => {
    mouseEnabled = !mouseEnabled;
    if (mouseEnabled) {
      mouseToggle.classList.add('on');
      mouseToggle.title = '指针操控：已启用';
    } else {
      mouseToggle.classList.remove('on');
      mouseToggle.title = '指针操控：已禁用';
    }
  });

  const camToggle = document.getElementById('cam-toggle');
  const camLabel = document.getElementById('cam-label');
  let camPreviewEnabled = true;
  camToggle.addEventListener('click', () => {
    camPreviewEnabled = !camPreviewEnabled;
    if (camPreviewEnabled) {
      camToggle.classList.add('on');
      camToggle.title = '摄像头预览：已开启';
      camWrap.style.display = 'block';
    } else {
      camToggle.classList.remove('on');
      camToggle.title = '摄像头预览：已关闭';
      camWrap.style.display = 'none';
    }
  });

  const PANEL_GLOW_DIST = 180;
  window.addEventListener('mousemove', e => {
    const rect = panel.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = Math.max(0, Math.abs(e.clientX - cx) - rect.width / 2);
    const dy = Math.max(0, Math.abs(e.clientY - cy) - rect.height / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    const isInside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
    const t = isInside ? 1 : Math.max(0, 1 - dist / PANEL_GLOW_DIST);
    document.documentElement.style.setProperty('--panel-glow-intensity', t.toFixed(3));
  });

  document.addEventListener('mouseleave', () => {
    document.documentElement.style.setProperty('--panel-glow-intensity', '0');
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    particleUniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2);
    initStarfield();
  });

  window.addEventListener('keydown', e => {
    switch (e.key.toLowerCase()) {
      case '1': setModel('saturn');    break;
      case '2': setModel('sphere');    break;
      case '3': setModel('dualsphere'); break;
      case '4': setModel('heart');     break;
      case '5': setModel('star');      break;
      case '6': setModel('threebody'); break;
      case 'h': panel.classList.toggle('hidden'); break;
    }
  });

  window.addEventListener('wheel', e => {
    if (e.target.closest('#panel')) return;
    e.preventDefault();

    lastControlSource = 'wheel';
    wheelControlTimer = WHEEL_CONTROL_TIMEOUT;
    const delta = -e.deltaY * 0.001;
    rawGestureTarget = THREE.MathUtils.clamp(rawGestureTarget + delta, 0, 1);
    actualGesturePercent = rawGestureTarget * 100;
  }, { passive: false });

  // ==================== STARTUP ====================
  function start() {
    setProgress(78, '正在预热渲染管线…');

    requestAnimationFrame(function warmup() {
      setProgress(80, '正在执行首次渲染…');
      renderer.render(scene, camera);
      setProgress(82, '渲染管线预热完成');

      if (isMobileDevice || !navigator.onLine) {
        handsLoadState = 'failed';
        camLoadState = 'failed';
        if (isMobileDevice) {
          setProgress(90, '移动端模式，跳过手势识别…');
        } else {
          setProgress(90, '未连接网络，跳过手势识别…');
        }
      } else {
        setProgress(84, '正在初始化摄像头与手势识别…');
        try {
          initHands();
          initCamera();
        } catch (e) {
          handsLoadState = 'failed';
          camLoadState = 'failed';
        }
      }

      var startTime = performance.now();
      var MAX_WAIT = 6000;
      var lastProgress = 84;
      var entered = false;

      function doEnter() {
        if (entered) return;
        entered = true;
        if (!isFileProtocol) {
          try { fetch('/shutdown'); } catch (e) {}
        }
        setProgressImpl(100, '加载完成');
        setTimeout(function() {
          loadingEl.classList.add('hidden');
          animate();
        }, 300);
      }

      function checkReady() {
        if (entered) return;
        var elapsed = performance.now() - startTime;
        var camFailed = camLoadState === 'failed';
        var camDone = camLoadState === 'done';
        var handsFailed = handsLoadState === 'failed';
        var handsDone = handsLoadState === 'done';

        var timeRatio = Math.min(elapsed / MAX_WAIT, 1);
        var asyncProgress = 84 + timeRatio * 10;
        if (asyncProgress > lastProgress) {
          lastProgress = asyncProgress;
          setProgress(Math.min(94, asyncProgress));
        }

        if (camFailed) {
          setProgress(98, '摄像头不可用，立即进入…');
          setTimeout(doEnter, 200);
          return;
        }

        if (camLoadState === 'loading' && handsLoadState === 'loading') {
          setProgress(Math.max(lastProgress, 86), '正在下载手势识别模型…');
        } else if (camLoadState === 'loading') {
          setProgress(Math.max(lastProgress, 88), '正在请求摄像头权限…');
        } else if (camDone && handsLoadState === 'loading') {
          setProgress(Math.max(lastProgress, 90), '正在加载手势识别模型…');
        }

        if (handsFailed) {
          setProgress(96, '手势模型加载失败，继续进入…');
          setTimeout(doEnter, 300);
          return;
        }

        if (camDone && handsDone) {
          setProgress(98, '手势识别就绪');
          setTimeout(doEnter, 300);
          return;
        }

        if (elapsed > MAX_WAIT) {
          setProgressImpl(96, '加载超时，继续进入…');
          doEnter();
          return;
        }

        setTimeout(checkReady, 80);
      }

      function setProgressImpl(pct, msg) {
        targetProgress = Math.max(targetProgress, pct);
        displayProgress = pct;
        if (progressAnimFrame) {
          cancelAnimationFrame(progressAnimFrame);
          progressAnimFrame = null;
        }
        lastProgressTime = 0;
        updateProgressUI();
        if (msg) loadingMsg.textContent = msg;
      }

      setTimeout(checkReady, 150);
    });
  }
  start();

})();
</script>
</body>
</html>
