<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<title>3D 粒子交互系统</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: rgba(15, 15, 30, 0.65);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e0e0e0;
    --text-dim: rgba(224, 224, 224, 0.55);
    --accent: #00e5ff;
    --accent2: #7c4dff;
    --danger: #ff5252;
    --radius: 18px;
    --transition: 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    --particle-color: #00e5ff;
    --particle-color-alpha-10: rgba(0, 229, 255, 0.1);
    --particle-color-alpha-20: rgba(0, 229, 255, 0.2);
    --particle-color-alpha-30: rgba(0, 229, 255, 0.3);
    --particle-color-alpha-45: rgba(0, 229, 255, 0.45);
    --panel-glow-intensity: 0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    color-scheme: dark;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: radial-gradient(ellipse at 30% 40%, #0d1025 0%, #060812 45%, #020510 100%);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
    overscroll-behavior: none;
    -ms-scroll-chaining: none;
  }

  canvas { display: block; }

  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  #container {
    position: fixed;
    inset: 0;
    z-index: 1;
    will-change: transform;
    transform: translateZ(0);
  }

  #bg-glow {
    position: fixed;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
    will-change: transform, opacity;
    animation: breathe 8s ease-in-out infinite;
  }

  #bg-glow2 {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,77,255,0.05) 0%, transparent 70%);
    top: 30%;
    left: 70%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 0;
    will-change: transform, opacity;
    animation: breathe 10s ease-in-out 3s infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
  }

  /* ---- Loading ---- */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  #loading .loading-title {
    font-size: 22px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: 0.08em;
  }

  #loading .progress-wrap {
    width: min(320px, 70vw);
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }

  #loading .progress-track {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  #loading .progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    position: relative;
    overflow: hidden;
  }
  #loading .progress-bar::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
    animation: shimmer 2s infinite;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #loading .progress-bar.active::before {
    opacity: 1;
  }
  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 100%; }
  }

  #loading .progress-particles {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    pointer-events: none;
    width: 0;
    height: 0;
  }
  #loading .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 4px var(--accent), 0 0 8px rgba(0,229,255,0.3);
    animation: particleDrift 1s ease-out forwards;
  }
  @keyframes particleDrift {
    0% { opacity: 0.8; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
  }

  #loading .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }
  #loading .msg {
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 0.04em;
  }
  #loading .msg.error { color: var(--danger); }
  #loading .progress-pct {
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
    min-width: 36px;
    text-align: right;
  }

  /* ---- UI Panel ---- */
  #panel {
    position: fixed;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 2.5px solid color-mix(in srgb, var(--particle-color) calc(15% + var(--panel-glow-intensity) * 60%), rgba(255,255,255,0.08));
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    width: 220px;
    min-width: 220px;
    max-width: 220px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04), 0 0 calc(var(--panel-glow-intensity) * 20px) color-mix(in srgb, var(--particle-color) calc(var(--panel-glow-intensity) * 50%), transparent);
    transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, border-width 0.2s ease;
    box-sizing: border-box;
  }
  #panel.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(-10px); }
  #panel:hover {
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04), 0 0 18px color-mix(in srgb, var(--particle-color) 50%, transparent), inset 0 0 10px color-mix(in srgb, var(--particle-color) 30%, transparent);
    border-color: var(--particle-color);
  }

  .panel-section { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .toggle-row .panel-label {
    flex: 1;
    text-align: left;
    margin: 0;
    font-size: 10px;
  }

  .panel-label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-dim);
  }

  /* ---- Color picker ---- */
  .color-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    justify-items: center;
  }
  .color-swatch {
    width: clamp(20px, 13%, 28px);
    aspect-ratio: 1;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.28s cubic-bezier(0.22,0.61,0.36,1),
                box-shadow 0.28s ease,
                border-color 0.28s ease;
    flex-shrink: 0;
    position: relative;
    forced-color-adjust: none;
  }
  .color-swatch:hover {
    transform: scale(1.18);
    box-shadow: 0 0 18px currentColor;
  }
  .color-swatch.active { border-color: currentColor; box-shadow: 0 0 14px currentColor; }

  @keyframes swatchFlash {
    0%   { box-shadow: 0 0 14px currentColor, 0 0 0 0px currentColor; }
    100% { box-shadow: 0 0 14px currentColor, 0 0 0 14px transparent; }
  }
  .color-swatch.swatch-flash {
    animation: swatchFlash 0.55s ease-out;
  }


  /* ---- Gesture bars ---- */
  #gesture-bar-wrap {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  #gesture-bar {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--particle-color) 60%, #7c4dff), var(--particle-color));
    transition: width 0.2s cubic-bezier(0.22, 0.61, 0.36, 1), background 0.5s ease;
    width: 0%;
  }

  #pinch-bar-wrap {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  #pinch-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.2s cubic-bezier(0.22, 0.61, 0.36, 1), background 0.3s ease;
    width: 0%;
    position: relative;
    z-index: 1;
  }

  #gesture-label {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 300;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    overflow: hidden;
  }
  #gesture-label-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #gesture-actual-val {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 300;
    flex-shrink: 0;
    text-align: right;
    min-width: 32px;
  }

  #pinch-label {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 300;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    overflow: hidden;
  }
  #pinch-label-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #pinch-actual-val {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 300;
    flex-shrink: 0;
    text-align: right;
    min-width: 32px;
  }

  #trans-label {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 300;
  }

  /* ---- Mouse Toggle ---- */
  .mouse-icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                border-color 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    flex-shrink: 0;
  }
  .mouse-icon-btn:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.3);
  }
  .mouse-icon-btn.on {
    background: var(--particle-color-alpha-20);
    border-color: var(--particle-color-alpha-45);
    box-shadow: 0 0 14px var(--particle-color-alpha-30);
  }
  .mouse-icon-btn.on svg {
    stroke: var(--particle-color);
  }
  .mouse-icon-btn svg {
    stroke: rgba(255,255,255,0.5);
    transition: stroke 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .mouse-icon-btn .slash {
    opacity: 0;
  }
  .mouse-icon-btn:not(.on) .mouse-body {
    stroke: rgba(255,255,255,0.25);
  }

  .cam-icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .cam-icon-btn:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.3);
  }
  .cam-icon-btn.on {
    background: var(--particle-color-alpha-20);
    border-color: var(--particle-color-alpha-45);
    box-shadow: 0 0 14px var(--particle-color-alpha-30);
  }
  .cam-icon-btn.on svg {
    stroke: var(--particle-color);
  }
  .cam-icon-btn svg {
    stroke: rgba(255,255,255,0.5);
    transition: stroke 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .cam-icon-btn:not(.on) svg {
    stroke: rgba(255,255,255,0.25);
  }

  /* ---- Model Slider (Bottom-Left) ---- */
  #model-slider-wrap {
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 10;
  }
  #model-slider-track {
    position: relative;
    width: 460px;
    height: 46px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 2.5px solid rgba(255,255,255,0.18);
    border-radius: 23px;
    cursor: pointer;
    overflow: visible;
    transition: border-color 0.35s ease, box-shadow 0.35s ease;
  }
  #model-slider-thumb {
    position: absolute;
    width: calc(100% / 6);
    height: 100%;
    border-radius: 23px;
    left: 8.33%;
    transform: translateX(-50%) scale(1);
    border: 2.5px solid rgba(255,255,255,0.45);
    transition: left 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                background 0.45s cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 0.2s cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 0.25s ease,
                border-color 0.25s ease;
    pointer-events: none;
    z-index: 2;
  }
  #model-slider-thumb::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: -1;
  }
  #model-slider-thumb.pressing {
    transform: translateX(-50%) scale(1.1);
    box-shadow: 0 0 20px rgba(255,255,255,0.15);
    transition: left 0.08s linear,
                background 0.2s ease,
                transform 0.15s cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 0.15s ease;
  }
  #model-slider-thumb.snapping {
    transition: left 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                background 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 0.2s cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 0.2s ease;
  }
  #model-slider-labels {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0;
    gap: 3px;
    pointer-events: none;
    z-index: 4;
  }
  .slider-label {
    font-size: 14px;
    color: var(--text-dim);
    transition: color 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                text-shadow 0.35s cubic-bezier(0.22, 0.61, 0.36, 1),
                transform 0.35s cubic-bezier(0.22, 0.61, 0.36, 1);
    cursor: pointer;
    pointer-events: auto;
    text-align: center;
    flex: 1;
    line-height: 46px;
    position: relative;
    transform: scale(1) translateY(0);
  }
  .slider-label.active {
    color: var(--label-color, #fff);
  }
  .slider-label:hover {
    color: var(--label-color, #fff);
    text-shadow: 0 0 16px var(--label-color, #fff);
    transform: scale(1.08) translateY(-2px);
  }

  /* ---- Webcam preview ---- */
  #cam-wrap {
    position: fixed;
    bottom: 24px; right: 24px;
    z-index: 10;
    width: 140px;
    height: 100px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #000;
    opacity: 0.45;
    transition: opacity 0.3s ease,
                bottom 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                right 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                width 0.55s cubic-bezier(0.22, 0.61, 0.36, 1),
                height 0.55s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  #cam-wrap:hover { opacity: 0.9; }
  #cam-wrap video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #cam-wrap.off { opacity: 0; pointer-events: none; }

  /* ---- Responsive ---- */
  @media (max-width: 600px) {
    #panel {
      left: max(8px, env(safe-area-inset-left));
      width: 175px;
      min-width: 175px;
      max-width: 175px;
      padding: 14px 10px 12px;
      gap: 10px;
      border-radius: 14px;
    }
    .panel-label { font-size: 9px; }
    #cam-wrap {
      width: 100px; height: 70px;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 56px);
      right: max(12px, env(safe-area-inset-right));
    }
    #model-slider-wrap {
      left: max(8px, env(safe-area-inset-left));
      bottom: max(14px, env(safe-area-inset-bottom));
    }
    #model-slider-track { width: calc(100vw - 40px); max-width: 460px; height: 40px; }
    .slider-label { font-size: 12px; line-height: 40px; }
    #loading .loading-title { font-size: 18px; }
    #loading .progress-wrap { width: min(260px, 75vw); }
    #loading .msg { font-size: 12px; }
    #loading .progress-pct { font-size: 12px; }
  }

  @media (max-width: 700px) and (min-width: 601px) {
    #cam-wrap {
      bottom: 82px;
      right: 20px;
    }
  }

  @media (max-height: 500px) and (orientation: landscape) {
    #panel {
      top: 8px;
      left: 8px;
      transform: none;
      flex-direction: row;
      flex-wrap: wrap;
      width: auto;
      min-width: auto;
      max-width: 50vw;
      padding: 10px;
      gap: 8px;
    }
    #model-slider-wrap {
      bottom: 6px;
      left: 8px;
    }
    #model-slider-track { height: 36px; }
    .slider-label { font-size: 11px; line-height: 36px; }
    #cam-wrap { width: 80px; height: 56px; bottom: 52px; right: 8px; }
  }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div id="bg-glow"></div>
<div id="bg-glow2"></div>
<div id="container"></div>

<div id="loading">
  <div class="loading-title">3D 粒子交互系统</div>
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar">
        <div class="progress-particles" id="progress-particles"></div>
      </div>
    </div>
    <div class="progress-info">
      <div class="msg" id="loading-msg">正在初始化…</div>
      <div class="progress-pct" id="progress-pct">0%</div>
    </div>
  </div>
</div>

<div id="panel">
  <div class="panel-section">
    <span class="panel-label">粒子颜色</span>
    <div class="color-row" id="color-row">
      <span class="color-swatch active" data-color="#00e5ff" style="background:#00e5ff;color:#00e5ff"></span>
      <span class="color-swatch" data-color="#ff4081" style="background:#ff4081;color:#ff4081"></span>
      <span class="color-swatch" data-color="#ffab40" style="background:#ffab40;color:#ffab40"></span>
      <span class="color-swatch" data-color="#69f0ae" style="background:#69f0ae;color:#69f0ae"></span>
      <span class="color-swatch" data-color="#7c4dff" style="background:#7c4dff;color:#7c4dff"></span>
      <span class="color-swatch" data-color="#ffffff" style="background:#ffffff;color:#ffffff"></span>
    </div>
  </div>

  <div class="panel-section">
    <span class="panel-label">粒子开合</span>
    <div id="gesture-bar-wrap"><div id="gesture-bar" style="width:0%"></div></div>
    <div id="gesture-label"><span id="gesture-label-text">等待手势输入…</span><span id="gesture-actual-val"></span></div>
  </div>

  <div class="panel-section">
    <span class="panel-label">捏合切换</span>
    <div id="pinch-bar-wrap"><div id="pinch-bar" style="width:0%"></div></div>
    <div id="pinch-label"><span id="pinch-label-text">张开手指以启用</span><span id="pinch-actual-val"></span></div>
  </div>

  <div class="panel-section">
    <div class="toggle-row">
      <span class="panel-label" id="control-label">指针操控</span>
      <div id="mouse-toggle" class="mouse-icon-btn on" title="指针操控：已启用">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
          <rect class="mouse-body" x="6" y="2" width="12" height="18" rx="6"/>
          <path class="mouse-body" d="M12 6v4"/>
          <line class="slash" x1="3" y1="3" x2="21" y2="21"/>
        </svg>
      </div>
    </div>
    <div class="toggle-row">
      <span class="panel-label" id="cam-label">镜头开关</span>
      <div id="cam-toggle" class="cam-icon-btn on" title="摄像头：已开启">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
          <path d="M23 7l-7 5 7 5V7z"/>

<script>
(async function() {
  'use strict';

  const container = document.getElementById('container');
  const loadingEl = document.getElementById('loading');
  const loadingMsg = document.getElementById('loading-msg');
  const progressBar = document.getElementById('progress-bar');
  const progressPct = document.getElementById('progress-pct');
  const progressParticles = document.getElementById('progress-particles');
  const panel = document.getElementById('panel');

  let displayProgress = 0;
  let targetProgress = 0;
  let progressAnimFrame = null;
  let lastParticleTime = 0;
  let lastProgressTime = 0;
  const PROGRESS_SPEED = 12;

  function spawnParticle() {
    const now = Date.now();
    if (now - lastParticleTime < 60) return;
    lastParticleTime = now;

    const particle = document.createElement('div');
    particle.className = 'particle';

    const size = 1.5 + Math.random() * 2;
    const angle = -Math.PI + (Math.random() - 0.5) * 1.2;
    const distance = 15 + Math.random() * 25;
    const tx = Math.cos(angle) * distance;
    const ty = Math.sin(angle) * distance;

    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    particle.style.setProperty('--tx', tx + 'px');
    particle.style.setProperty('--ty', ty + 'px');
    particle.style.left = '0px';
    particle.style.top = (Math.random() - 0.5) * 6 + 'px';

    progressParticles.appendChild(particle);

    setTimeout(() => {
      if (particle.parentNode) {
        particle.parentNode.removeChild(particle);
      }
    }, 1000);
  }

  function animateProgress(timestamp) {
    if (!lastProgressTime) lastProgressTime = timestamp;
    const dt = Math.min((timestamp - lastProgressTime) / 1000, 0.1);
    lastProgressTime = timestamp;

    if (Math.abs(displayProgress - targetProgress) < 0.2 && dt > 0) {
      displayProgress = targetProgress;
      updateProgressUI();
      progressAnimFrame = null;
      lastProgressTime = 0;
      return;
    }

    const diff = targetProgress - displayProgress;
    const lerpStep = diff * (1 - Math.exp(-6 * dt));
    const minStep = PROGRESS_SPEED * dt;
    const step = Math.max(lerpStep, minStep);
    displayProgress = Math.min(displayProgress + step, targetProgress);
    updateProgressUI();

    if (displayProgress > 0 && displayProgress < 100) {
      spawnParticle();
    }

    progressAnimFrame = requestAnimationFrame(animateProgress);
  }

  function updateProgressUI() {
    const val = Math.max(0, Math.min(100, Math.round(displayProgress)));
    progressBar.style.width = val + '%';
    progressPct.textContent = val + '%';
    if (val > 0 && val < 100) {
      progressBar.classList.add('active');
    } else {
      progressBar.classList.remove('active');
    }
  }

  function setProgress(pct, msg) {
    targetProgress = Math.max(targetProgress, pct);
    if (!progressAnimFrame && targetProgress > displayProgress) {
      lastProgressTime = 0;
      progressAnimFrame = requestAnimationFrame(animateProgress);
    }
    if (msg) loadingMsg.textContent = msg;
  }

  function setProgressImmediate(pct, msg) {
    targetProgress = Math.max(targetProgress, pct);
    displayProgress = targetProgress;
    if (progressAnimFrame) {
      cancelAnimationFrame(progressAnimFrame);
      progressAnimFrame = null;
    }
    lastProgressTime = 0;
    updateProgressUI();
    if (msg) loadingMsg.textContent = msg;
  }

  function setLoadMsg(msg) {
    if (loadingMsg) loadingMsg.textContent = msg;
  }
  setProgress(1, '正在初始化渲染引擎…');
  const gestureBar = document.getElementById('gesture-bar');
  const gestureLabelText = document.getElementById('gesture-label-text');
  const gestureActualVal = document.getElementById('gesture-actual-val');
  const pinchBar = document.getElementById('pinch-bar');
  const pinchLabelText = document.getElementById('pinch-label-text');
  const pinchActualVal = document.getElementById('pinch-actual-val');
  const camWrap = document.getElementById('cam-wrap');
  const camVideo = document.getElementById('cam-video');
  const sliderThumb = document.getElementById('model-slider-thumb');
  const sliderLabels = document.getElementById('model-slider-labels');
  const mouseToggle = document.getElementById('mouse-toggle');
  const starfieldCanvas = document.getElementById('starfield');

  // ==================== STARFIELD BACKGROUND ====================
  setProgress(2, '正在初始化星空背景…');
  const starfieldCtx = starfieldCanvas.getContext('2d');
  const bgStars = [];
  const meteors = [];
  let meteorTimer = 0;

  function initStarfield() {
    starfieldCanvas.width = window.innerWidth;
    starfieldCanvas.height = window.innerHeight;
    bgStars.length = 0;
    for (let i = 0; i < 200; i++) {
      bgStars.push({
        x: Math.random() * starfieldCanvas.width,
        y: Math.random() * starfieldCanvas.height,
        r: Math.random() * 1.4 + 0.3,
        a: Math.random() * 0.5 + 0.2,
        twinkle: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.02 + 0.005,
        vx: (Math.random() - 0.5) * 0.15,
        vy: (Math.random() - 0.5) * 0.1,
      });
    }
  }
  initStarfield();
  setProgress(4, '星空背景初始化完成');

  function spawnMeteor() {
    const w = starfieldCanvas.width;
    const h = starfieldCanvas.height;
    const fromLeft = Math.random() > 0.5;
    const startX = fromLeft ? -100 : w + 100;
    const startY = Math.random() * h * 0.4 - 50;
    meteors.push({
      x: startX,
      y: startY,
      vx: (fromLeft ? 1 : -1) * (1.2 + Math.random() * 1.6),
      vy: 0.6 + Math.random() * 0.8,
      len: 100 + Math.random() * 120,
      width: 0.5 + Math.random() * 0.6,
    });
  }

  function drawStarfield() {
    const w = starfieldCanvas.width;
    const h = starfieldCanvas.height;
    starfieldCtx.clearRect(0, 0, w, h);

    for (const s of bgStars) {
      s.twinkle += s.speed;
      s.x += s.vx;
      s.y += s.vy;
      if (s.x < -5) s.x = w + 5;
      if (s.x > w + 5) s.x = -5;
      if (s.y < -5) s.y = h + 5;
      if (s.y > h + 5) s.y = -5;
      const alpha = s.a * (0.6 + 0.4 * Math.sin(s.twinkle));
      starfieldCtx.beginPath();
      starfieldCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      starfieldCtx.fillStyle = `rgba(180,200,255,${alpha})`;
      starfieldCtx.fill();
    }

    meteorTimer += 1;
    if (meteorTimer > 300 + Math.random() * 400) {
      spawnMeteor();
      meteorTimer = 0;
    }

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx;
      m.y += m.vy;

      if (m.x < -200 || m.x > w + 200 || m.y > h + 100) {
        meteors.splice(i, 1);
        continue;
      }

      const tailX = m.x - m.vx * m.len * 0.25;
      const tailY = m.y - m.vy * m.len * 0.25;
      const grad = starfieldCtx.createLinearGradient(m.x, m.y, tailX, tailY);
      grad.addColorStop(0, 'rgba(255,255,255,0.9)');
      grad.addColorStop(0.3, 'rgba(180,210,255,0.5)');
      grad.addColorStop(1, 'rgba(100,150,255,0)');

      starfieldCtx.beginPath();
      starfieldCtx.moveTo(m.x, m.y);
      starfieldCtx.lineTo(tailX, tailY);
      starfieldCtx.strokeStyle = grad;
      starfieldCtx.lineWidth = m.width;
      starfieldCtx.lineCap = 'round';
      starfieldCtx.stroke();

      starfieldCtx.beginPath();
      starfieldCtx.arc(m.x, m.y, m.width * 1.5, 0, Math.PI * 2);
      starfieldCtx.fillStyle = 'rgba(255,255,255,0.8)';
      starfieldCtx.fill();
    }
  }

  // ==================== THREE.JS SETUP ====================
  setProgress(6, '正在加载三维引擎…');
  const THREE = await import('three');
  setProgress(6, '正在创建三维场景…');
  const scene = new THREE.Scene();

  setProgress(8, '正在配置相机参数…');
  const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 0.8, 16);
  camera.lookAt(0, 0, 0);

  setProgress(10, '正在初始化 WebGL 渲染器…');
  const renderer = new THREE.WebGLRenderer({ 
    antialias: true, 
    alpha: true,
    powerPreference: 'high-performance',
  });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);
  setProgress(14, '渲染器初始化完成');

  setProgress(16, '正在生成粒子纹理…');
  const glowTex = (() => {
    const s = 128;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = s;
    const ctx = canvas.getContext('2d');
    const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0,     'rgba(255,255,255,1)');
    g.addColorStop(0.08,  'rgba(255,255,255,0.95)');
    g.addColorStop(0.25,  'rgba(255,255,255,0.6)');
    g.addColorStop(0.5,   'rgba(255,255,255,0.15)');
    g.addColorStop(0.75,  'rgba(255,255,255,0.02)');
    g.addColorStop(1,     'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    const t = new THREE.CanvasTexture(canvas);
    t.needsUpdate = true;
    return t;
  })();
  setProgress(20, '粒子纹理生成完成');

  // ==================== STATE ====================
  setProgress(22, '正在配置系统参数…');
  const PARTICLE_COUNT = 12000;

  let currentModel = 'saturn';
  let gestureValue = 0;
  let uiGestureValue = 0;
  let rawGestureTarget = 0;
  let actualGesturePercent = 0;
  let displayGestureBarValue = 0;
  const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 2 && !/Windows|Macintosh|Linux|CrOS/i.test(navigator.userAgent));
  let cameraEnabled = true;
  let handsInstance = null;
  let cameraUtils = null;

  let isTransitioning = false;
  let transitionT = 1;
  const TRANSITION_DURATION = 1.3;
  let transitionScaleFactor = 1.0;

  let pinchPercent = 0;
  let mappedPinchValue = 0;
  let displayPinchPercent = 0;
  let pinchArmed = true;
  let pinchTriggered = false;
  let rawPinchDist = 1;
  let smoothPinchDist = 1;
  const PINCH_SMOOTH = 0.3;

  let palmActive = false;
  let rotDeltaX = 0;
  let rotDeltaY = 0;
  let smoothRotDeltaX = 0;
  let smoothRotDeltaY = 0;
  let trackedHandIdx = -1;
  let isOneFinger = false;
  let isPointing = false;
  let isPinching = false;
  let isFiveFingerPinch = false;
  let isTwoFingerPinch = false;
  let autoRotSpeedY = 0.50;
  let autoRotSpeedX = 0.24;
  let autoRotSpeedZ = 0.16;
  let handDetected = false;
  let handLostTimer = 0;
  let prevFingerX = 0.5;
  let prevFingerY = 0.5;
  let smoothFingerX = 0.5;
  let smoothFingerY = 0.5;
  const FINGER_SMOOTH = 0.35;
  let handTrackingReady = false;
  let lastHandTime = 0;
  const HAND_DT_REF = 1 / 30;
  let mouseEnabled = true;

  let handsLoadState = 'pending';
  let camLoadState = 'pending';

  const isFileProtocol = window.__IS_FILE_PROTOCOL === true;
  const cameraRestricted = isMobileDevice || !navigator.onLine;

  let lastControlSource = isMobileDevice ? 'touch' : 'mouse';
  let wheelControlTimer = 0;
  const WHEEL_CONTROL_TIMEOUT = 1.5;

  const MODEL_ORDER = ['saturn', 'sphere', 'dualsphere', 'heart', 'star', 'threebody'];
  const modelNames = { saturn: '土星环', sphere: '水晶球体', dualsphere: '双星互存', heart: '浪漫爱心', star: '璀璨星芒', threebody: '三环旋绕' };
  const modelColors = { saturn: '#ffab40', sphere: '#40c4ff', heart: '#ff5252', star: '#ffd740', threebody: '#7c4dff', dualsphere: '#1de9b6' };

  // ==================== PARTICLE GROUP ====================
  setProgress(28, '正在创建粒子系统…');
  const particleGroup = new THREE.Group();
  scene.add(particleGroup);

  setProgress(30, '正在初始化粒子几何体…');
  const particleGeo = new THREE.BufferGeometry();
  const colorVariationV  = new Float32Array(PARTICLE_COUNT);
  const colorVariationHS = new Float32Array(PARTICLE_COUNT);
  const sizeAttr = new Float32Array(PARTICLE_COUNT);

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    colorVariationV[i] = 0.7 + Math.random() * 0.3;
    colorVariationHS[i] = (Math.random() - 0.5) * 0.1;
    sizeAttr[i] = 0.06 + Math.random() * 0.09;
  }

  setProgress(34, '正在分配粒子属性缓冲区…');
  particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PARTICLE_COUNT * 3), 3));
  particleGeo.setAttribute('aDst', new THREE.BufferAttribute(new Float32Array(PARTICLE_COUNT * 3), 3));
  particleGeo.setAttribute('aVariationV',  new THREE.BufferAttribute(colorVariationV, 1));
  particleGeo.setAttribute('aVariationHS', new THREE.BufferAttribute(colorVariationHS, 1));
  particleGeo.setAttribute('aSize',        new THREE.BufferAttribute(sizeAttr, 1));

  setProgress(36, '正在配置粒子着色器参数…');
  const particleUniforms = {
    uTime:          { value: 0 },
    uGesture:       { value: 0 },
    uSpread:        { value: 0.57 },
    uBaseScale:     { value: 1.0 },
    uColorFrom:     { value: new THREE.Color('#00e5ff') },
    uColorTo:       { value: new THREE.Color('#00e5ff') },
    uColorT:        { value: 1.0 },
    uTransitionT:   { value: 1.0 },
    uGlowTex:       { value: glowTex },
    uPixelRatio:    { value: Math.min(window.devicePixelRatio, 2) },
  };

  const particleMat = new THREE.ShaderMaterial({
    uniforms: particleUniforms,
    vertexShader: `
      uniform float uTime;
      uniform float uGesture;
      uniform float uSpread;
      uniform float uBaseScale;
      uniform vec3  uColorFrom;
      uniform vec3  uColorTo;
      uniform float uColorT;
      uniform float uTransitionT;
      uniform float uPixelRatio;

      attribute float aVariationV;
      attribute float aVariationHS;
      attribute float aSize;
      attribute vec3 aDst;

      varying vec3 vColor;
      varying float vAlpha;

      float easeInOutCubic(float t) {
        return t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) / 2.0;
      }

      void main() {
        vec3 pos = mix(position, aDst, easeInOutCubic(uTransitionT));

        float wx = sin(uTime * 1.3 + pos.y * 0.6) * 0.01 * uGesture;
        float wy = cos(uTime * 1.1 + pos.x * 0.5) * 0.01 * uGesture;
        float wz = sin(uTime * 1.5 + pos.z * 0.55) * 0.01 * uGesture;
        pos = pos * uSpread + vec3(wx, wy, wz);

        vec3 lerpedColor = mix(uColorFrom, uColorTo, easeInOutCubic(clamp(uColorT, 0.0, 1.0)));
        vec3 c = lerpedColor * aVariationV + aVariationHS;
        vColor = clamp(c, 0.0, 1.0);

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        float sizeAttenuation = 300.0 / -mvPosition.z;
        gl_PointSize = aSize * uBaseScale * sizeAttenuation * uPixelRatio;
        gl_PointSize = clamp(gl_PointSize, 1.0, 64.0);

        vAlpha = 0.85;
        gl_Position = projectionMatrix * mvPosition;
      }
    `,
    fragmentShader: `
      uniform sampler2D uGlowTex;
      varying vec3 vColor;
      varying float vAlpha;

      void main() {
        vec4 texColor = texture2D(uGlowTex, gl_PointCoord);
        gl_FragColor = vec4(vColor, texColor.a * vAlpha);
      }
    `,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
  });
  setProgress(42, '着色器材质创建完成');

  setProgress(44, '正在构建粒子网格…');
  const particles = new THREE.Points(particleGeo, particleMat);
  particleGroup.add(particles);
  setProgress(46, '粒子系统构建完成');

  // ==================== MODEL GENERATORS ====================
  setProgress(48, '正在定义模型生成器…');
  function randomOnSphere(r) {
    const u = Math.random() * 2 - 1;
    const theta = Math.random() * Math.PI * 2;
    const s = Math.sqrt(1 - u * u);
    return { x: r * s * Math.cos(theta), y: r * s * Math.sin(theta), z: r * u };
  }

  function generateSaturn(out) {
    const tgt = out;
    const innerC = Math.floor(PARTICLE_COUNT * 0.45);
    for (let i = 0; i < innerC; i++) {
      const p = randomOnSphere(3.2);
      tgt[i*3]=p.x; tgt[i*3+1]=p.y; tgt[i*3+2]=p.z;
    }
    const tilt = 0.45, iR = 4.4, oR = 6.8;
    const ringC = PARTICLE_COUNT - innerC;
    for (let i = 0; i < ringC; i++) {
      const idx = innerC + i;
      const a = Math.random() * Math.PI * 2;
      const r = iR + Math.random() * (oR - iR);
      const yOff = (Math.random()-0.5)*0.35;
      const fall = 1 - Math.abs(r-(iR+oR)/2)/((oR-iR)/2);
      const fy = yOff*(0.6+0.4*fall);
      tgt[idx*3]=r*Math.cos(a); tgt[idx*3+1]=fy;
      tgt[idx*3+2]=r*Math.sin(a)*Math.cos(tilt)-fy*Math.sin(tilt);
    }
  }

  function generateSphere(out) {
    const tgt = out;
    const shC = Math.floor(PARTICLE_COUNT*0.7);
    for (let i=0;i<shC;i++) {
      const p=randomOnSphere(5.5);
      tgt[i*3]=p.x; tgt[i*3+1]=p.y; tgt[i*3+2]=p.z;
    }
    for (let i=0;i<PARTICLE_COUNT-shC;i++) {
      const idx=shC+i;
      const p=randomOnSphere(3.2+Math.random()*2.3);
      tgt[idx*3]=p.x; tgt[idx*3+1]=p.y; tgt[idx*3+2]=p.z;
    }
  }

  function generateHeart(out) {
    const tgt = out;
    const S = 3.0;
    for (let i=0;i<PARTICLE_COUNT;i++) {
      const t = Math.random()*Math.PI*2;
      const fill = 0.12 + Math.random()*0.88;
      const hx = 16*Math.pow(Math.sin(t),3);
      const hy = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      const px = hx/16 * fill;
      const py = hy/16 * fill;
      const jx = (Math.random()-0.5)*0.22*(1-fill*0.5);
      const jy = (Math.random()-0.5)*0.22*(1-fill*0.5);
      const edgeFactor = 1 - Math.abs(fill - 0.5) * 1.6;
      const jz = (Math.random()-0.5)*1.6*edgeFactor;
      tgt[i*3]   = (px + jx)*S;
      tgt[i*3+1] = (py + jy)*S;
      tgt[i*3+2] = jz*S;
    }
  }

  function generateStar(out) {
    const tgt = out;
    const scale = 7;
    const points = 5;
    const zDepth = 4.5;
    for (let i=0;i<PARTICLE_COUNT;i++) {
      const arm = Math.floor(Math.random()*points);
      const baseAngle = (arm/points)*Math.PI*2 - Math.PI/2;
      const r = Math.random()*scale;
      const spreadAngle = (Math.random()-0.5)*0.35;
      const a = baseAngle + spreadAngle;
      const tipFactor = 1 - Math.pow(r/scale, 0.55);
      const thickness = tipFactor * 2.2 + 0.3;
      const zOff = (Math.random()-0.5)*thickness*zDepth;
      const phi = Math.acos(2*Math.random()-1);
      const theta = Math.random()*Math.PI*2;
      const shellR = thickness*0.55;
      const sx = shellR*Math.sin(phi)*Math.cos(theta);
      const sy = shellR*Math.sin(phi)*Math.sin(theta);
      const sz = shellR*Math.cos(phi);
      tgt[i*3]   = Math.cos(a)*r + sx;
      tgt[i*3+1] = Math.sin(a)*r + sy;
      tgt[i*3+2] = zOff + sz;
    }
  }

  function generateThreeBody(out) {
    const tgt = out;
    const perOrbit = Math.floor(PARTICLE_COUNT / 3);
    for (let o = 0; o < 3; o++) {
      const baseTiltX = o * (Math.PI * 2 / 3);
      const baseTiltY = o * (Math.PI * 2 / 5);
      const orbitRadius = 3.5 + o * 1.8;
      const start = o * perOrbit;
      const end = o === 2 ? PARTICLE_COUNT : start + perOrbit;
      for (let i = start; i < end; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = orbitRadius + (Math.random() - 0.5) * 1.6;
        const h = (Math.random() - 0.5) * 0.7;
        const cx = r * Math.cos(angle);
        const cy = h;
        const cz = r * Math.sin(angle);
        const rotX = baseTiltX + (Math.random() - 0.5) * 0.35;
        const rotY = baseTiltY + (Math.random() - 0.5) * 0.35;
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const rx = cx * cosY + cz * sinY;
        const rz = -cx * sinY + cz * cosY;
        tgt[i*3]   = rx;
        tgt[i*3+1] = cy * cosX - rz * sinX;
        tgt[i*3+2] = cy * sinX + rz * cosX;
      }
    }
  }

  function generateDualSphere(out) {
    const tgt = out;
    const outerR = 7.2;
    const outerCount = Math.floor(PARTICLE_COUNT * 0.55);
    for (let i = 0; i < outerCount; i++) {
      const p = randomOnSphere(outerR);
      const jx = (Math.random() - 0.5) * 0.35;
      const jy = (Math.random() - 0.5) * 0.35;
      const jz = (Math.random() - 0.5) * 0.35;
      tgt[i*3] = p.x + jx;
      tgt[i*3+1] = p.y + jy;
      tgt[i*3+2] = p.z + jz;
    }
    const innerR = 2.6;
    const innerCount = PARTICLE_COUNT - outerCount;
    for (let i = 0; i < innerCount; i++) {
      const idx = outerCount + i;
      const p = randomOnSphere(innerR * (0.7 + Math.random() * 0.3));
      tgt[idx*3] = p.x;
      tgt[idx*3+1] = p.y;
      tgt[idx*3+2] = p.z;
    }
  }

  function generateModel(modelName, out) {
    switch (modelName) {
      case 'saturn':    generateSaturn(out);    break;
      case 'sphere':    generateSphere(out);    break;
      case 'heart':     generateHeart(out);     break;
      case 'star':      generateStar(out);      break;
      case 'threebody': generateThreeBody(out); break;
      case 'dualsphere': generateDualSphere(out); break;
    }
  }

  function setModel(modelName) {
    const posArray = particleGeo.attributes.position.array;
    const dstArray = particleGeo.attributes.aDst.array;
    const uT = particleUniforms.uTransitionT.value;

    if (modelName === currentModel && uT >= 1.0) return;

    if (uT < 1.0) {
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        const e = easeInOutCubic(uT);
        posArray[i] = posArray[i] + (dstArray[i] - posArray[i]) * e;
      }
      particleGeo.attributes.position.needsUpdate = true;
    }

    generateModel(modelName, dstArray);
    particleGeo.attributes.aDst.needsUpdate = true;
    currentModel = modelName;

    if (uT < 1.0 && transitionT >= 0.5) {
      transitionT = 1.0 - transitionT;
    } else if (uT >= 1.0) {
      transitionT = 0;
    }
    isTransitioning = true;
    particleUniforms.uTransitionT.value = transitionT;

    const baseSpeed = 0.4;
    const randAngle = Math.random() * Math.PI * 2;
    autoRotSpeedY = baseSpeed * Math.cos(randAngle);
    autoRotSpeedX = baseSpeed * 0.5 * Math.sin(randAngle);
    autoRotSpeedZ = baseSpeed * 0.3 * Math.cos(randAngle * 0.7);

    updateSliderUI(modelName);
  }

  function setModelInstant(modelName) {
    const posArray = particleGeo.attributes.position.array;
    const dstArray = particleGeo.attributes.aDst.array;

    currentModel = modelName;
    generateModel(modelName, posArray);
    dstArray.set(posArray);
    particleGeo.attributes.position.needsUpdate = true;
    particleGeo.attributes.aDst.needsUpdate = true;
    isTransitioning = false;
    transitionT = 1;
    particleUniforms.uTransitionT.value = 1.0;

    particleGroup.quaternion.identity();
    rotDeltaX = 0;
    rotDeltaY = 0;

    const baseSpeed = 0.4;
    const randAngle = Math.random() * Math.PI * 2;
    autoRotSpeedY = baseSpeed * Math.cos(randAngle);
    autoRotSpeedX = baseSpeed * 0.5 * Math.sin(randAngle);
    autoRotSpeedZ = baseSpeed * 0.3 * Math.cos(randAngle * 0.7);

    updateSliderUI(modelName);
  }

  const sliderTrack = document.getElementById('model-slider-track');

  setProgress(58, '正在生成初始粒子模型…');
  setModelInstant('saturn');
  setProgress(62, '初始模型生成完成');

  // ==================== MODEL SLIDER ====================
  setProgress(64, '正在构建模型选择器…');
  function buildSlider() {
    sliderLabels.innerHTML = '';
    MODEL_ORDER.forEach((m) => {
      const label = document.createElement('span');
      label.className = 'slider-label';
      label.textContent = modelNames[m];
      label.dataset.model = m;
      label.style.setProperty('--label-color', modelColors[m]);
      label.addEventListener('mouseenter', () => {
        sliderTrack.style.borderColor = modelColors[m] + 'ee';
        sliderTrack.style.boxShadow = '0 0 18px ' + modelColors[m] + '80, inset 0 0 10px ' + modelColors[m] + '40';
