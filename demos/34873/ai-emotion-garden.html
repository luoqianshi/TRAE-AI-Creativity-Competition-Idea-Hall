const MOOD_DATA = {

    flowerName: "雨后蓝玫",
    texts: [
      "难过没关系的，眼泪会浇灌出更柔软的你。\n这朵花替我抱抱你，慢慢来，没有人在催你。",
      "今天的你，已经很努力了。\n允许自己难过，就像允许花朵在雨里低头——它不是凋谢，只是在休息。",

let currentMood = null;
let currentFlowerData = null;

/* ---------- 心情选择 ---------- */
const moodGrid = document.getElementById('moodGrid');
moodGrid.addEventListener('click', e=>{
  const chip = e.target.closest('.mood-chip');
  if(!chip) return;
  document.querySelectorAll('.mood-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentMood = chip.dataset.mood;
});

/* ---------- 生成花朵 ---------- */
document.getElementById('generateBtn').addEventListener('click', generate);
document.getElementById('regenBtn').addEventListener('click', generate);

function generate(){
  if(!currentMood){
    shake(document.getElementById('moodGrid'));
    alert('请先选择今天的心情哦 🌷');
    return;
  }
  const data = MOOD_DATA[currentMood];
  const userText = document.getElementById('moodText').value.trim();

  // 随机选择文案 & 花瓣数
  const text = data.texts[Math.floor(Math.random()*data.texts.length)];
  const petalCount = 5 + Math.floor(Math.random()*4); // 5~8 瓣
  const rotateOffset = Math.random()*30;

  currentFlowerData = {
    mood: currentMood,
    label: data.label,
    flowerName: data.flowerName,
    palette: data.palette,
    text, userText, petalCount, rotateOffset
  };

  renderFlower(currentFlowerData);

  // 显示文字
  document.getElementById('moodTag').textContent = data.label + ' · ' + data.flowerName;
  document.getElementById('healText').textContent = text;
  const echo = document.getElementById('userEcho');
  if(userText){
    echo.style.display = 'block';
    echo.textContent = '“' + userText + '”';
  }else{
    echo.style.display = 'none';
  }

  const card = document.getElementById('resultCard');
  card.classList.remove('show'); // 重置动画
  void card.offsetWidth;
  card.classList.add('show');
  card.scrollIntoView({behavior:'smooth', block:'center'});
}

function shake(el){
  el.animate([
    {transform:'translateX(0)'},
    {transform:'translateX(-6px)'},
    {transform:'translateX(6px)'},
    {transform:'translateX(0)'}
  ],{duration:300});
}

/* ---------- 渲染 SVG 花朵 ---------- */
function renderFlower(d){
  const stage = document.getElementById('flowerStage');
  const {petal, petal2, center, leaf} = d.palette;
  const n = d.petalCount;
  const rotOffset = d.rotateOffset;

  let petals = '';
  for(let i=0;i<n;i++){
    const rot = (360/n)*i + rotOffset;
    const fill = i%2===0 ? petal : petal2;
    petals += `<ellipse class="petal" cx="0" cy="-32" rx="14" ry="28" fill="${fill}"
                style="--rot:${rot}deg; animation-delay:${0.1+i*0.08}s;
                       transform: rotate(${rot}deg) scale(0);"/>`;
  }

  // 叶子
  const leaves = `
    <path class="leaf" d="M -6,40 Q -28,30 -34,55 Q -16,52 -6,40 Z" fill="${leaf}"/>
    <path class="leaf" d="M 6,40  Q 28,30 34,55  Q 16,52 6,40 Z" fill="${leaf}" style="animation-delay:.35s;"/>
  `;

  const sparkles = `
    <circle class="sparkle" cx="-50" cy="-50" r="2.5" fill="#fff" style="animation-delay:.5s"/>
    <circle class="sparkle" cx="55"  cy="-30" r="2"   fill="#fff" style="animation-delay:1.1s"/>
    <circle class="sparkle" cx="40"  cy="50"  r="2.2" fill="#fff" style="animation-delay:1.7s"/>
    <circle class="sparkle" cx="-40" cy="40"  r="1.8" fill="#fff" style="animation-delay:2.0s"/>
  `;

  stage.style.background =
    `radial-gradient(circle at 50% 55%, ${d.palette.bg} 0%, rgba(255,255,255,0) 75%)`;

  stage.innerHTML = `
    <svg viewBox="-80 -80 160 160" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="20" x2="0" y2="60" stroke="${leaf}" stroke-width="3" stroke-linecap="round"/>
      ${leaves}
      <g>${petals}</g>
      <circle class="center-circle" cx="0" cy="0" r="11" fill="${center}"/>
      <circle class="center-circle" cx="0" cy="0" r="5"  fill="#fff" style="animation-delay:1.1s"/>
      ${sparkles}
    </svg>
  `;
}

document.getElementById('posterBtn').addEventListener('click', generatePoster);

function showLoader(text){
  document.getElementById('loaderText').textContent = text || '处理中…';
  document.getElementById('loader').classList.add('show');
}
function hideLoader(){
  document.getElementById('loader').classList.remove('show');
}

function generatePoster(){
  if(!currentFlowerData){ alert('请先生成花朵呀～'); return; }
  showLoader('海报正在轻轻绽放中…');

  setTimeout(()=>{
    try{
      const canvas = document.getElementById('posterCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const d = currentFlowerData;

      // ---- 背景渐变 ----
      const grad = ctx.createLinearGradient(0,0,W,H);
      grad.addColorStop(0, '#fde7f3');
      grad.addColorStop(0.5, '#e8def8');
      grad.addColorStop(1, '#dbeaff');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,W,H);

      // 装饰圆
      drawBlurCircle(ctx, 100, 120, 240, '#ffd5e5', 0.5);
      drawBlurCircle(ctx, W-120, H-160, 280, '#c9e3ff', 0.5);
      drawBlurCircle(ctx, W-180, 200, 180, '#d8c8ff', 0.5);

      // 白色卡片
      ctx.save();
      roundRect(ctx, 60, 60, W-120, H-120, 40);
      ctx.fillStyle = 'rgba(255,255,255,0.78)';
      ctx.shadowColor = 'rgba(184,162,255,0.25)';
      ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
      ctx.fill();
      ctx.restore();

      // ---- 标题 ----
      ctx.textAlign='center';
      ctx.fillStyle = '#9b8fae';
      ctx.font = '600 26px ' + getCSSFont();
      ctx.fillText('AI 情绪花园', W/2, 150);

      ctx.fillStyle = '#6a5d7b';
      ctx.font = '700 44px ' + getCSSFont();
      ctx.fillText('今天的我，是一朵', W/2, 220);
      ctx.fillStyle = '#b8a2ff';
      ctx.fillText(d.flowerName, W/2, 280);

      // ---- 花朵 ----
      drawFlower(ctx, W/2, 480, 160, d);

      // ---- 心情标签 ----
      ctx.font = '600 22px ' + getCSSFont();
      const tagText = d.label;
      const tagW = ctx.measureText(tagText).width + 50;
      const tagX = (W - tagW)/2, tagY = 700;
      const tagGrad = ctx.createLinearGradient(tagX, 0, tagX+tagW, 0);
      tagGrad.addColorStop(0,'#ffd5e5'); tagGrad.addColorStop(1,'#d8c8ff');
      ctx.fillStyle = tagGrad;
      roundRect(ctx, tagX, tagY, tagW, 50, 25); ctx.fill();
      ctx.fillStyle = '#6a5d7b';
      ctx.fillText(tagText, W/2, tagY+33);

      // ---- 治愈文案 ----
      ctx.fillStyle = '#6a5d7b';
      ctx.font = '400 26px ' + getCSSFont();
      const lines = wrapText(ctx, d.text, W-220);
      let ty = 820;
      lines.forEach(line=>{
        ctx.fillText(line, W/2, ty);
        ty += 42;
      });

      // 用户原话
      if(d.userText){
        ty += 20;
        ctx.fillStyle = '#9b8fae';
        ctx.font = 'italic 400 22px ' + getCSSFont();
        const userLines = wrapText(ctx, '“'+d.userText+'”', W-260);
        userLines.forEach(line=>{
          ctx.fillText(line, W/2, ty);
          ty += 36;
        });
      }

      // ---- 底部 ----
      ctx.fillStyle = '#b8a2ff';
      ctx.font = '500 20px ' + getCSSFont();
      const dateStr = new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
      ctx.fillText('🌷 ' + dateStr + ' · 一朵属于你的花', W/2, H-110);

      ctx.fillStyle = '#9b8fae';
      ctx.font = '400 16px ' + getCSSFont();
      ctx.fillText('AI 情绪花园 · Made with 💜', W/2, H-80);

      // 下载
      const link = document.createElement('a');
      link.download = `情绪花园_${d.flowerName}_${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();

      hideLoader();
    }catch(err){
      console.error(err);
      hideLoader();
      alert('海报生成失败：'+err.message);
    }
  }, 600);
}

function getCSSFont(){
  return '"PingFang SC","Microsoft YaHei","Helvetica Rounded","Comic Sans MS",sans-serif';
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBlurCircle(ctx, x, y, r, color, alpha){
  const g = ctx.createRadialGradient(x,y,0, x,y,r);
  g.addColorStop(0, hexToRgba(color, alpha));
  g.addColorStop(1, hexToRgba(color, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
}

function hexToRgba(hex, a){
  hex = hex.replace('#','');
  const r = parseInt(hex.substring(0,2),16);
  const g = parseInt(hex.substring(2,4),16);
  const b = parseInt(hex.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawFlower(ctx, cx, cy, size, d){
  const {petal, petal2, center, leaf} = d.palette;
  const n = d.petalCount;
  const rotOffset = d.rotateOffset * Math.PI/180;

  // 茎和叶
  ctx.strokeStyle = leaf;
  ctx.lineWidth = 6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx, cy+size*0.15); ctx.lineTo(cx, cy+size*0.55); ctx.stroke();

  // 叶
  ctx.fillStyle = leaf;
  ctx.beginPath();
  ctx.moveTo(cx-6, cy+size*0.32);
  ctx.quadraticCurveTo(cx-size*0.32, cy+size*0.25, cx-size*0.40, cy+size*0.50);
  ctx.quadraticCurveTo(cx-size*0.18, cy+size*0.45, cx-6, cy+size*0.32);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx+6, cy+size*0.32);
  ctx.quadraticCurveTo(cx+size*0.32, cy+size*0.25, cx+size*0.40, cy+size*0.50);
  ctx.quadraticCurveTo(cx+size*0.18, cy+size*0.45, cx+6, cy+size*0.32);
  ctx.fill();

  // 花瓣
  for(let i=0;i<n;i++){
    const angle = (Math.PI*2/n)*i + rotOffset;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.fillStyle = i%2===0 ? petal : petal2;
    ctx.beginPath();
    ctx.ellipse(0, -size*0.42, size*0.18, size*0.36, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // 花蕊
  ctx.fillStyle = center;
  ctx.beginPath(); ctx.arc(cx,cy,size*0.16,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(cx,cy,size*0.07,0,Math.PI*2); ctx.fill();

  // 闪光
  ctx.fillStyle = '#ffffff';
  [[-size*0.6,-size*0.55,3],[size*0.65,-size*0.3,2.5],[size*0.5,size*0.4,2.8],[-size*0.5,size*0.3,2]]
    .forEach(([x,y,r])=>{
      ctx.beginPath(); ctx.arc(cx+x, cy+y, r, 0, Math.PI*2); ctx.fill();
    });
}

function wrapText(ctx, text, maxWidth){
  const lines = [];
  const paragraphs = text.split('\n');
  paragraphs.forEach(p=>{
    let line = '';
    for(let i=0;i<p.length;i++){
      const test = line + p[i];
      if(ctx.measureText(test).width > maxWidth && line){
        lines.push(line);
        line = p[i];
      }else{
        line = test;
      }
    }
    if(line) lines.push(line);
  });
  return lines;
}
