<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>开封管家 - 物品保质期管理助手</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 防止iOS Safari中点击延迟 */
      * {
        touch-action: manipulation;
      }

      /* 自定义动画 */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      .slide-up {
        animation: slideUp 0.3s ease-out;
      }
      .slide-in {
        animation: slideIn 0.3s ease-out;
      }
      .scale-in {
        animation: scaleIn 0.3s ease-out;
      }
      .pulse-warning {
        animation: pulse 2s infinite;
      }
      .bounce {
        animation: bounce 1s ease-in-out;
      }

      /* 滚动条样式 */
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      /* 模态框背景 */
      .modal-backdrop {
        background-color: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(8px);
      }

      /* 底部导航栏固定 */
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 50;
      }

      /* 页面内容区域 */
      .page-content {
        padding-bottom: 80px;
        min-height: 100vh;
      }

      /* 浮动按钮 */
      .fab {
        position: fixed;
        bottom: 90px;
        right: 20px;
        z-index: 40;
      }

      /* 卡片触摸效果 */
      .card-touch {
        transition: all 0.2s ease;
      }

      .card-touch:active {
        transform: scale(0.98);
        opacity: 0.9;
      }

      /* 底部导航项 */
      .nav-item {
        transition: all 0.3s ease;
      }

      .nav-item.active {
        color: #3b82f6;
      }

      .nav-item:not(.active) {
        color: #9ca3af;
      }

      /* 页面切换 */
      .page {
        display: none;
      }

      .page.active {
        display: block;
      }

      /* iOS风格的日期选择器 */
      input[type="date"] {
        -webkit-appearance: none;
        appearance: none;
      }

      /* 安全区域适配 */
      @supports (padding-bottom: env(safe-area-inset-bottom)) {
        .bottom-nav {
          padding-bottom: env(safe-area-inset-bottom);
        }
        .page-content {
          padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }
        .fab {
          bottom: calc(90px + env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 font-sans antialiased">
    <!-- 首页 -->
    <div id="homePage" class="page active page-content">
      <!-- 顶部标题栏 -->
      <header
        class="bg-gradient-to-r from-blue-500 to-indigo-600 px-4 pt-12 pb-6 sticky top-0 z-30"
      >
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-2xl font-bold text-white">📦 开封管家</h1>
          <button onclick="switchPage('stats')" class="text-white opacity-80">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              ></path>
            </svg>
          </button>
        </div>

        <!-- 搜索栏 -->
        <div class="relative">
          <input
            type="text"
            id="searchInput"
            class="w-full bg-white/20 backdrop-blur text-white placeholder-white/70 px-4 py-3 rounded-xl border-0 focus:outline-none focus:ring-2 focus:ring-white/50"
            placeholder="搜索物品..."
          />
          <svg
            class="absolute right-4 top-3.5 w-5 h-5 text-white/70"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            ></path>
          </svg>
        </div>

        <!-- 快速筛选 -->
        <div class="flex gap-2 mt-3 overflow-x-auto pb-1">
          <button
            onclick="filterByStatus('')"
            class="filter-btn active px-4 py-2 bg-white/30 text-white rounded-full text-sm whitespace-nowrap"
          >
            全部
          </button>
          <button
            onclick="filterByStatus('normal')"
            class="filter-btn px-4 py-2 bg-white/20 text-white rounded-full text-sm whitespace-nowrap"
          >
            正常
          </button>
          <button
            onclick="filterByStatus('expiring')"
            class="filter-btn px-4 py-2 bg-white/20 text-white rounded-full text-sm whitespace-nowrap"
          >
            即将过期
          </button>
          <button
            onclick="filterByStatus('expired')"
            class="filter-btn px-4 py-2 bg-white/20 text-white rounded-full text-sm whitespace-nowrap"
          >
            已过期
          </button>
        </div>
      </header>

      <!-- 物品列表 -->
      <div class="px-4 py-4">
        <!-- 分类筛选 -->
        <div class="flex gap-2 mb-4 overflow-x-auto">
          <button
            onclick="filterByCategory('')"
            class="category-btn active flex items-center gap-1 px-3 py-2 bg-blue-100 text-blue-600 rounded-lg text-sm whitespace-nowrap"
          >
            全部类别
          </button>
          <button
            onclick="filterByCategory('化妆品')"
            class="category-btn flex items-center gap-1 px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm whitespace-nowrap"
          >
            💄 化妆品
          </button>
          <button
            onclick="filterByCategory('药品')"
            class="category-btn flex items-center gap-1 px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm whitespace-nowrap"
          >
            💊 药品
          </button>
          <button
            onclick="filterByCategory('厨房用品')"
            class="category-btn flex items-center gap-1 px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm whitespace-nowrap"
          >
            🍳 厨房用品
          </button>
          <button
            onclick="filterByCategory('食品')"
            class="category-btn flex items-center gap-1 px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm whitespace-nowrap"
          >
            🍎 食品
          </button>
          <button
            onclick="filterByCategory('日用品')"
            class="category-btn flex items-center gap-1 px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm whitespace-nowrap"
          >
            🧴 日用品
          </button>
          <button
            onclick="filterByCategory('其他')"
            class="category-btn flex items-center gap-1 px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm whitespace-nowrap"
          >
            📦 其他
          </button>
        </div>

        <!-- 物品卡片列表 -->
        <div id="itemList" class="space-y-3">
          <!-- 物品卡片将通过JavaScript动态生成 -->
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="hidden text-center py-16">
          <div
            class="w-32 h-32 mx-auto mb-4 bg-gray-100 rounded-full flex items-center justify-center"
          >
            <svg
              class="w-16 h-16 text-gray-300"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
              ></path>
            </svg>
          </div>
          <p class="text-gray-500 text-lg font-medium">暂无记录</p>
          <p class="text-gray-400 text-sm mt-2">点击下方按钮添加物品</p>
        </div>
      </div>
    </div>

    <!-- 添加页面 -->
    <div id="addPage" class="page page-content">
      <!-- 顶部标题栏 -->
      <header
        class="bg-white px-4 pt-12 pb-4 sticky top-0 z-30 border-b border-gray-100"
      >
        <div class="flex items-center justify-between">
          <button onclick="switchPage('home')" class="text-gray-600">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
          </button>
          <h1 class="text-lg font-semibold text-gray-800">添加物品</h1>
          <div class="w-6"></div>
        </div>
      </header>

      <!-- 添加表单 -->
      <div class="px-4 py-6">
        <form id="addForm" class="space-y-5">
          <!-- 物品名称 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              物品名称
            </label>
            <input
              type="text"
              id="itemName"
              required
              class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-base"
              placeholder="例如：雅诗兰黛精华"
            />
          </div>

          <!-- 物品类别 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              物品类别
            </label>
            <div class="grid grid-cols-3 gap-2">
              <button
                type="button"
                onclick="selectCategory('化妆品')"
                class="category-select-btn flex flex-col items-center justify-center py-3 bg-gray-50 rounded-xl border-2 border-transparent"
              >
                <span class="text-2xl mb-1">💄</span>
                <span class="text-xs text-gray-600">化妆品</span>
              </button>
              <button
                type="button"
                onclick="selectCategory('药品')"
                class="category-select-btn flex flex-col items-center justify-center py-3 bg-gray-50 rounded-xl border-2 border-transparent"
              >
                <span class="text-2xl mb-1">💊</span>
                <span class="text-xs text-gray-600">药品</span>
              </button>
              <button
                type="button"
                onclick="selectCategory('厨房用品')"
                class="category-select-btn flex flex-col items-center justify-center py-3 bg-gray-50 rounded-xl border-2 border-transparent"
              >
                <span class="text-2xl mb-1">🍳</span>
                <span class="text-xs text-gray-600">厨房用品</span>
              </button>
              <button
                type="button"
                onclick="selectCategory('食品')"
                class="category-select-btn flex flex-col items-center justify-center py-3 bg-gray-50 rounded-xl border-2 border-transparent"
              >
                <span class="text-2xl mb-1">🍎</span>
                <span class="text-xs text-gray-600">食品</span>
              </button>
              <button
                type="button"
                onclick="selectCategory('日用品')"
                class="category-select-btn flex flex-col items-center justify-center py-3 bg-gray-50 rounded-xl border-2 border-transparent"
              >
                <span class="text-2xl mb-1">🧴</span>
                <span class="text-xs text-gray-600">日用品</span>
              </button>
              <button
                type="button"
                onclick="selectCategory('其他')"
                class="category-select-btn flex flex-col items-center justify-center py-3 bg-gray-50 rounded-xl border-2 border-transparent"
              >
                <span class="text-2xl mb-1">📦</span>
                <span class="text-xs text-gray-600">其他</span>
              </button>
            </div>
            <input type="hidden" id="itemCategory" required />
          </div>

          <!-- 开封日期 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              开封日期
            </label>
            <input
              type="date"
              id="openDate"
              required
              class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-base"
            />
          </div>

          <!-- 保质期天数 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              保质期（天）
            </label>
            <input
              type="number"
              id="shelfLife"
              required
              min="1"
              class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-base"
              placeholder="例如：180"
            />
            <!-- 快捷选项 -->
            <div class="flex gap-2 mt-2">
              <button
                type="button"
                onclick="setShelfLife(30)"
                class="px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-xs"
              >
                30天
              </button>
              <button
                type="button"
                onclick="setShelfLife(90)"
                class="px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-xs"
              >
                90天
              </button>
              <button
                type="button"
                onclick="setShelfLife(180)"
                class="px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-xs"
              >
                180天
              </button>
              <button
                type="button"
                onclick="setShelfLife(365)"
                class="px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-xs"
              >
                365天
              </button>
            </div>
          </div>

          <!-- 备注 -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">
              备注（可选）
            </label>
            <textarea
              id="itemNote"
              rows="3"
              class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-base resize-none"
              placeholder="添加备注信息..."
            ></textarea>
          </div>

          <!-- 提交按钮 -->
          <button
            type="submit"
            class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-4 rounded-xl font-medium text-base active:scale-98 transition-transform shadow-lg"
          >
            保存记录
          </button>
        </form>
      </div>
    </div>

    <!-- 统计页面 -->
    <div id="statsPage" class="page page-content">
      <!-- 顶部标题栏 -->
      <header
        class="bg-gradient-to-r from-indigo-500 to-purple-600 px-4 pt-12 pb-6 sticky top-0 z-30"
      >
        <div class="flex items-center justify-between mb-4">
          <button onclick="switchPage('home')" class="text-white">
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 19l-7-7 7-7"
              ></path>
            </svg>
          </button>
          <h1 class="text-lg font-semibold text-white">数据统计</h1>
          <div class="w-6"></div>
        </div>
      </header>

      <!-- 统计内容 -->
      <div class="px-4 py-6">
        <!-- 总览卡片 -->
        <div class="grid grid-cols-3 gap-3 mb-6">
          <div class="bg-white rounded-xl p-4 text-center shadow-sm">
            <div class="text-3xl font-bold text-blue-600 mb-1" id="totalCount">
              0
            </div>
            <div class="text-xs text-gray-500">总记录</div>
          </div>
          <div class="bg-white rounded-xl p-4 text-center shadow-sm">
            <div
              class="text-3xl font-bold text-yellow-600 mb-1"
              id="expiringCount"
            >
              0
            </div>
            <div class="text-xs text-gray-500">即将过期</div>
          </div>
          <div class="bg-white rounded-xl p-4 text-center shadow-sm">
            <div class="text-3xl font-bold text-red-600 mb-1" id="expiredCount">
              0
            </div>
            <div class="text-xs text-gray-500">已过期</div>
          </div>
        </div>

        <!-- 分类统计 -->
        <div class="bg-white rounded-xl p-4 shadow-sm mb-6">
          <h3 class="text-base font-semibold text-gray-800 mb-4">分类统计</h3>
          <div id="categoryStats" class="space-y-3">
            <!-- 分类统计将通过JavaScript动态生成 -->
          </div>
        </div>

        <!-- 操作按钮 -->
        <div class="space-y-3">
          <button
            onclick="deleteExpiredItems()"
            class="w-full bg-red-50 text-red-600 py-4 rounded-xl font-medium text-base active:scale-98 transition-transform"
          >
            清除所有过期物品
          </button>
          <button
            onclick="exportData()"
            class="w-full bg-gray-50 text-gray-600 py-4 rounded-xl font-medium text-base active:scale-98 transition-transform"
          >
            导出数据备份
          </button>
        </div>
      </div>
    </div>

    <!-- 浮动添加按钮 -->
    <button
      onclick="switchPage('add')"
      class="fab bg-gradient-to-r from-blue-500 to-indigo-600 w-14 h-14 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-transform"
    >
      <svg
        class="w-7 h-7 text-white"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 4v16m8-8H4"
        ></path>
      </svg>
    </button>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav bg-white border-t border-gray-200 px-6 py-2">
      <div class="flex justify-around items-center">
        <button
          onclick="switchPage('home')"
          class="nav-item active flex flex-col items-center py-2"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            ></path>
          </svg>
          <span class="text-xs mt-1">首页</span>
        </button>
        <button
          onclick="switchPage('add')"
          class="nav-item flex flex-col items-center py-2"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            ></path>
          </svg>
          <span class="text-xs mt-1">添加</span>
        </button>
        <button
          onclick="switchPage('stats')"
          class="nav-item flex flex-col items-center py-2"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
            ></path>
          </svg>
          <span class="text-xs mt-1">统计</span>
        </button>
      </div>
    </nav>

    <!-- 编辑模态框 -->
    <div id="editModal" class="fixed inset-0 z-50 hidden">
      <div
        class="modal-backdrop absolute inset-0"
        onclick="closeEditModal()"
      ></div>
      <div
        class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl z-10 slide-up max-h-[90vh] overflow-y-auto"
      >
        <!-- 拖动指示器 -->
        <div class="flex justify-center pt-3 pb-2">
          <div class="w-12 h-1 bg-gray-300 rounded-full"></div>
        </div>

        <div class="px-4 pb-6">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-gray-800">编辑记录</h3>
            <button onclick="closeEditModal()" class="text-gray-400 p-2">
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                ></path>
              </svg>
            </button>
          </div>

          <form id="editForm" class="space-y-4">
            <input type="hidden" id="editId" />

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                物品名称
              </label>
              <input
                type="text"
                id="editName"
                required
                class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                物品类别
              </label>
              <select
                id="editCategory"
                required
                class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="化妆品">💄 化妆品</option>
                <option value="药品">💊 药品</option>
                <option value="厨房用品">🍳 厨房用品</option>
                <option value="食品">🍎 食品</option>
                <option value="日用品">🧴 日用品</option>
                <option value="其他">📦 其他</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                开封日期
              </label>
              <input
                type="date"
                id="editOpenDate"
                required
                class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                保质期（天）
              </label>
              <input
                type="number"
                id="editShelfLife"
                required
                min="1"
                class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">
                备注
              </label>
              <textarea
                id="editNote"
                rows="2"
                class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
              ></textarea>
            </div>

            <div class="flex gap-3 pt-2">
              <button
                type="button"
                onclick="deleteItemFromEdit()"
                class="flex-1 px-4 py-3 bg-red-50 text-red-600 rounded-xl font-medium"
              >
                删除
              </button>
              <button
                type="submit"
                class="flex-1 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium"
              >
                保存
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 提示消息 -->
    <div id="toast" class="fixed top-4 left-4 right-4 z-50 hidden">
      <div
        class="bg-gray-800 text-white rounded-xl p-4 flex items-center justify-center space-x-2 fade-in"
      >
        <span id="toastIcon" class="text-xl"></span>
        <span id="toastMessage" class="text-sm"></span>
      </div>
    </div>

    <script>
      /**
       * 开封管家 - 物品保质期管理助手（移动端APP版）
       * 主要功能：添加、编辑、删除、筛选物品记录，自动计算到期时间并提醒
       */

      // ==================== 全局变量 ====================
      let currentCategoryFilter = "";
      let currentStatusFilter = "";
      let selectedCategory = "";
      let currentEditId = "";

      // ==================== 页面切换 ====================

      /**
       * 切换页面
       * @param {string} pageName - 页面名称：home/add/stats
       */
      function switchPage(pageName) {
        // 隐藏所有页面
        document.querySelectorAll(".page").forEach((page) => {
          page.classList.remove("active");
        });

        // 显示目标页面
        document.getElementById(pageName + "Page").classList.add("active");

        // 更新底部导航状态
        document.querySelectorAll(".nav-item").forEach((item) => {
          item.classList.remove("active");
        });

        const navItems = document.querySelectorAll(".nav-item");
        const pageIndex = { home: 0, add: 1, stats: 2 };
        navItems[pageIndex[pageName]].classList.add("active");

        // 控制浮动按钮显示
        const fab = document.querySelector(".fab");
        if (pageName === "home") {
          fab.style.display = "flex";
        } else {
          fab.style.display = "none";
        }

        // 如果切换到添加页面，设置默认日期
        if (pageName === "add") {
          document.getElementById("openDate").value = new Date()
            .toISOString()
            .split("T")[0];
          // 清空表单
          document.getElementById("addForm").reset();
          document.getElementById("itemCategory").value = "";
          document.querySelectorAll(".category-select-btn").forEach((btn) => {
            btn.classList.remove("border-blue-500");
            btn.classList.add("border-transparent");
          });
        }

        // 如果切换到统计页面，更新统计数据
        if (pageName === "stats") {
          updateCategoryStats();
        }
      }

      // ==================== 数据管理 ====================

      /**
       * 从localStorage获取所有物品记录
       * @returns {Array} 物品记录数组
       */
      function getItems() {
        const items = localStorage.getItem("expiryManager_items");
        return items ? JSON.parse(items) : [];
      }

      /**
       * 保存物品记录到localStorage
       * @param {Array} items - 物品记录数组
       */
      function saveItems(items) {
        localStorage.setItem("expiryManager_items", JSON.stringify(items));
      }

      /**
       * 生成唯一ID
       * @returns {string} 唯一ID
       */
      function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
      }

      // ==================== 日期计算 ====================

      /**
       * 计算到期日期
       * @param {string} openDate - 开封日期
       * @param {number} shelfLife - 保质期天数
       * @returns {string} 到期日期
       */
      function calculateExpiryDate(openDate, shelfLife) {
        const date = new Date(openDate);
        date.setDate(date.getDate() + parseInt(shelfLife));
        return date.toISOString().split("T")[0];
      }

      /**
       * 计算剩余天数
       * @param {string} expiryDate - 到期日期
       * @returns {number} 剩余天数
       */
      function calculateDaysLeft(expiryDate) {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const expiry = new Date(expiryDate);
        expiry.setHours(0, 0, 0, 0);
        const diffTime = expiry - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays;
      }

      /**
       * 获取物品状态
       * @param {number} daysLeft - 剩余天数
       * @returns {Object} 状态对象
       */
      function getItemStatus(daysLeft) {
        if (daysLeft < 0) {
          return { type: "expired", text: "已过期", color: "red" };
        } else if (daysLeft <= 7) {
          return { type: "expiring", text: "即将过期", color: "yellow" };
        } else {
          return { type: "normal", text: "正常", color: "green" };
        }
      }

      // ==================== 渲染函数 ====================

      /**
       * 获取类别图标
       * @param {string} category - 类别名称
       * @returns {string} 图标
       */
      function getCategoryIcon(category) {
        const icons = {
          化妆品: "💄",
          药品: "💊",
          厨房用品: "🍳",
          食品: "🍎",
          日用品: "🧴",
          其他: "📦",
        };
        return icons[category] || "📦";
      }

      /**
       * 获取状态样式
       * @param {string} statusType - 状态类型
       * @returns {Object} 样式对象
       */
      function getStatusStyles(statusType) {
        const styles = {
          expired: {
            bg: "bg-red-50",
            border: "border-red-200",
            badge: "bg-red-100 text-red-700",
            text: "text-red-600",
            progressBg: "bg-red-200",
            progressFill: "bg-red-500",
          },
          expiring: {
            bg: "bg-yellow-50",
            border: "border-yellow-200",
            badge: "bg-yellow-100 text-yellow-700",
            text: "text-yellow-600",
            progressBg: "bg-yellow-200",
            progressFill: "bg-yellow-500",
          },
          normal: {
            bg: "bg-white",
            border: "border-gray-100",
            badge: "bg-green-100 text-green-700",
            text: "text-green-600",
            progressBg: "bg-green-200",
            progressFill: "bg-green-500",
          },
        };
        return styles[statusType] || styles.normal;
      }

      /**
       * 渲染物品卡片（移动端风格）
       * @param {Object} item - 物品对象
       * @returns {string} HTML字符串
       */
      function renderItemCard(item) {
        const expiryDate = calculateExpiryDate(item.openDate, item.shelfLife);
        const daysLeft = calculateDaysLeft(expiryDate);
        const status = getItemStatus(daysLeft);
        const styles = getStatusStyles(status.type);
        const icon = getCategoryIcon(item.category);

        // 计算进度百分比
        const totalDays = parseInt(item.shelfLife);
        const usedDays = totalDays - daysLeft;
        const progressPercent = Math.min(
          Math.max((usedDays / totalDays) * 100, 0),
          100,
        );

        // 格式化日期
        const formatDate = (dateStr) => {
          const date = new Date(dateStr);
          return `${date.getMonth() + 1}月${date.getDate()}日`;
        };

        // 状态文本
        let statusText = "";
        if (daysLeft < 0) {
          statusText = `已过期 ${Math.abs(daysLeft)} 天`;
        } else if (daysLeft === 0) {
          statusText = "今天到期";
        } else {
          statusText = `剩余 ${daysLeft} 天`;
        }

        // 是否显示警告动画
        const warningClass = status.type === "expired" ? "pulse-warning" : "";

        return `
                <div onclick="openEditModal('${item.id}')" 
                    class="${styles.bg} ${styles.border} border rounded-2xl p-4 card-touch slide-in ${warningClass}">
                    <!-- 头部：图标和名称 -->
                    <div class="flex items-start justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm">
                                <span class="text-2xl">${icon}</span>
                            </div>
                            <div>
                                <h3 class="font-semibold text-gray-800 text-base">${escapeHtml(item.name)}</h3>
                                <p class="text-xs text-gray-500 mt-1">${item.category}</p>
                            </div>
                        </div>
                        <span class="px-2 py-1 ${styles.badge} rounded-full text-xs font-medium">
                            ${status.text}
                        </span>
                    </div>
                    
                    <!-- 进度条 -->
                    <div class="mb-3">
                        <div class="h-2 ${styles.progressBg} rounded-full overflow-hidden">
                            <div class="h-full ${styles.progressFill} rounded-full transition-all duration-300" 
                                style="width: ${progressPercent}%"></div>
                        </div>
                    </div>
                    
                    <!-- 底部信息 -->
                    <div class="flex items-center justify-between">
                        <div class="text-xs text-gray-500">
                            <span>开封：${formatDate(item.openDate)}</span>
                            <span class="mx-2">·</span>
                            <span>到期：${formatDate(expiryDate)}</span>
                        </div>
                        <div class="${styles.text} font-semibold text-sm">
                            ${statusText}
                        </div>
                    </div>
                    
                    ${
                      item.note
                        ? `
                        <div class="mt-2 pt-2 border-t border-gray-100">
                            <p class="text-xs text-gray-500 italic">"${escapeHtml(item.note)}"</p>
                        </div>
                    `
                        : ""
                    }
                </div>
            `;
      }

      /**
       * 渲染物品列表
       */
      function renderItemList() {
        const items = getItems();
        const searchTerm = document
          .getElementById("searchInput")
          .value.toLowerCase();

        // 筛选物品
        let filteredItems = items.filter((item) => {
          const matchSearch = item.name.toLowerCase().includes(searchTerm);
          const matchCategory =
            !currentCategoryFilter || item.category === currentCategoryFilter;

          let matchStatus = true;
          if (currentStatusFilter) {
            const expiryDate = calculateExpiryDate(
              item.openDate,
              item.shelfLife,
            );
            const daysLeft = calculateDaysLeft(expiryDate);
            const status = getItemStatus(daysLeft);
            matchStatus = status.type === currentStatusFilter;
          }

          return matchSearch && matchCategory && matchStatus;
        });

        // 排序：过期 > 即将过期 > 正常
        filteredItems.sort((a, b) => {
          const expiryA = calculateExpiryDate(a.openDate, a.shelfLife);
          const expiryB = calculateExpiryDate(b.openDate, b.shelfLife);
          const daysLeftA = calculateDaysLeft(expiryA);
          const daysLeftB = calculateDaysLeft(expiryB);
          return daysLeftA - daysLeftB;
        });

        const itemList = document.getElementById("itemList");
        const emptyState = document.getElementById("emptyState");

        if (filteredItems.length === 0) {
          itemList.innerHTML = "";
          emptyState.classList.remove("hidden");
        } else {
          emptyState.classList.add("hidden");
          itemList.innerHTML = filteredItems
            .map((item) => renderItemCard(item))
            .join("");
        }

        // 更新统计
        updateStatistics(items);
      }

      /**
       * 更新统计信息
       * @param {Array} items - 物品数组
       */
      function updateStatistics(items) {
        let expired = 0;
        let expiring = 0;

        items.forEach((item) => {
          const expiryDate = calculateExpiryDate(item.openDate, item.shelfLife);
          const daysLeft = calculateDaysLeft(expiryDate);
          const status = getItemStatus(daysLeft);

          if (status.type === "expired") expired++;
          else if (status.type === "expiring") expiring++;
        });

        document.getElementById("totalCount").textContent = items.length;
        document.getElementById("expiringCount").textContent = expiring;
        document.getElementById("expiredCount").textContent = expired;
      }

      /**
       * 更新分类统计
       */
      function updateCategoryStats() {
        const items = getItems();
        const categories = [
          "化妆品",
          "药品",
          "厨房用品",
          "食品",
          "日用品",
          "其他",
        ];
        const statsContainer = document.getElementById("categoryStats");

        let html = "";
        categories.forEach((category) => {
          const categoryItems = items.filter(
            (item) => item.category === category,
          );
          const count = categoryItems.length;
          const icon = getCategoryIcon(category);

          if (count > 0) {
            html += `
                        <div class="flex items-center justify-between py-2">
                            <div class="flex items-center gap-2">
                                <span class="text-lg">${icon}</span>
                                <span class="text-sm text-gray-700">${category}</span>
                            </div>
                            <span class="text-sm font-semibold text-gray-800">${count} 件</span>
                        </div>
                    `;
          }
        });

        if (html === "") {
          html =
            '<p class="text-sm text-gray-500 text-center py-4">暂无数据</p>';
        }

        statsContainer.innerHTML = html;
      }

      /**
       * HTML转义
       * @param {string} text - 需要转义的文本
       * @returns {string} 转义后的文本
       */
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }

      // ==================== 筛选功能 ====================

      /**
       * 按类别筛选
       * @param {string} category - 类别
       */
      function filterByCategory(category) {
        currentCategoryFilter = category;

        // 更新按钮状态
        document.querySelectorAll(".category-btn").forEach((btn) => {
          btn.classList.remove("active", "bg-blue-100", "text-blue-600");
          btn.classList.add("bg-gray-100", "text-gray-600");
        });

        event.target.classList.remove("bg-gray-100", "text-gray-600");
        event.target.classList.add("active", "bg-blue-100", "text-blue-600");

        renderItemList();
      }

      /**
       * 按状态筛选
       * @param {string} status - 状态
       */
      function filterByStatus(status) {
        currentStatusFilter = status;

        // 更新按钮状态
        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.remove("active", "bg-white/30");
          btn.classList.add("bg-white/20");
        });

        event.target.classList.remove("bg-white/20");
        event.target.classList.add("active", "bg-white/30");

        renderItemList();
      }

      // ==================== 添加功能 ====================

      /**
       * 选择类别
       * @param {string} category - 类别
       */
      function selectCategory(category) {
        selectedCategory = category;
        document.getElementById("itemCategory").value = category;

        // 更新按钮状态
        document.querySelectorAll(".category-select-btn").forEach((btn) => {
          btn.classList.remove("border-blue-500");
          btn.classList.add("border-transparent");
        });

        event.target
          .closest(".category-select-btn")
          .classList.remove("border-transparent");
        event.target
          .closest(".category-select-btn")
          .classList.add("border-blue-500");
      }

      /**
       * 设置保质期快捷值
       * @param {number} days - 天数
       */
      function setShelfLife(days) {
        document.getElementById("shelfLife").value = days;
      }

      /**
       * 添加物品
       * @param {Event} e - 表单提交事件
       */
      function addItem(e) {
        e.preventDefault();

        const name = document.getElementById("itemName").value.trim();
        const category = document.getElementById("itemCategory").value;
        const openDate = document.getElementById("openDate").value;
        const shelfLife = document.getElementById("shelfLife").value;
        const note = document.getElementById("itemNote").value.trim();

        if (!name || !category || !openDate || !shelfLife) {
          showToast("请填写所有必填项", "error");
          return;
        }

        const item = {
          id: generateId(),
          name,
          category,
          openDate,
          shelfLife: parseInt(shelfLife),
          note,
          createdAt: new Date().toISOString(),
        };

        const items = getItems();
        items.push(item);
        saveItems(items);

        // 切换到首页
        switchPage("home");
        renderItemList();
        showToast("添加成功！", "success");
      }

      // ==================== 编辑功能 ====================

      /**
       * 打开编辑模态框
       * @param {string} id - 物品ID
       */
      function openEditModal(id) {
        const items = getItems();
        const item = items.find((i) => i.id === id);

        if (!item) {
          showToast("未找到该记录", "error");
          return;
        }

        currentEditId = id;

        document.getElementById("editId").value = item.id;
        document.getElementById("editName").value = item.name;
        document.getElementById("editCategory").value = item.category;
        document.getElementById("editOpenDate").value = item.openDate;
        document.getElementById("editShelfLife").value = item.shelfLife;
        document.getElementById("editNote").value = item.note || "";

        document.getElementById("editModal").classList.remove("hidden");
      }

      /**
       * 关闭编辑模态框
       */
      function closeEditModal() {
        document.getElementById("editModal").classList.add("hidden");
        currentEditId = "";
      }

      /**
       * 保存编辑
       * @param {Event} e - 表单提交事件
       */
      function saveEdit(e) {
        e.preventDefault();

        const id = document.getElementById("editId").value;
        const name = document.getElementById("editName").value.trim();
        const category = document.getElementById("editCategory").value;
        const openDate = document.getElementById("editOpenDate").value;
        const shelfLife = document.getElementById("editShelfLife").value;
        const note = document.getElementById("editNote").value.trim();

        if (!name || !category || !openDate || !shelfLife) {
          showToast("请填写所有必填项", "error");
          return;
        }

        const items = getItems();
        const index = items.findIndex((i) => i.id === id);

        if (index === -1) {
          showToast("未找到该记录", "error");
          return;
        }

        items[index] = {
          ...items[index],
          name,
          category,
          openDate,
          shelfLife: parseInt(shelfLife),
          note,
          updatedAt: new Date().toISOString(),
        };

        saveItems(items);
        closeEditModal();
        renderItemList();
        showToast("修改成功！", "success");
      }

      /**
       * 从编辑模态框删除物品
       */
      function deleteItemFromEdit() {
        if (currentEditId) {
          deleteItem(currentEditId);
          closeEditModal();
        }
      }

      /**
       * 删除物品
       * @param {string} id - 物品ID
       */
      function deleteItem(id) {
        const items = getItems();
        const filteredItems = items.filter((i) => i.id !== id);
        saveItems(filteredItems);
        renderItemList();
        showToast("删除成功！", "success");
      }

      /**
       * 清除所有过期物品
       */
      function deleteExpiredItems() {
        const items = getItems();
        const expiredItems = items.filter((item) => {
          const expiryDate = calculateExpiryDate(item.openDate, item.shelfLife);
          const daysLeft = calculateDaysLeft(expiryDate);
          return daysLeft < 0;
        });

        if (expiredItems.length === 0) {
          showToast("没有过期物品", "info");
          return;
        }

        const filteredItems = items.filter((item) => {
          const expiryDate = calculateExpiryDate(item.openDate, item.shelfLife);
          const daysLeft = calculateDaysLeft(expiryDate);
          return daysLeft >= 0;
        });

        saveItems(filteredItems);
        renderItemList();
        updateCategoryStats();
        showToast(`已删除 ${expiredItems.length} 个过期物品`, "success");
      }

      /**
       * 导出数据
       */
      function exportData() {
        const items = getItems();
        if (items.length === 0) {
          showToast("暂无数据可导出", "info");
          return;
        }

        const dataStr = JSON.stringify(items, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = `开封管家_数据备份_${new Date().toISOString().split("T")[0]}.json`;
        a.click();

        URL.revokeObjectURL(url);
        showToast("数据已导出", "success");
      }

      /**
       * 显示提示消息
       * @param {string} message - 消息内容
       * @param {string} type - 消息类型
       */
      function showToast(message, type = "info") {
        const toast = document.getElementById("toast");
        const toastIcon = document.getElementById("toastIcon");
        const toastMessage = document.getElementById("toastMessage");

        const icons = {
          success: "✅",
          error: "❌",
          info: "ℹ️",
        };

        toastIcon.textContent = icons[type] || icons.info;
        toastMessage.textContent = message;

        toast.classList.remove("hidden");

        setTimeout(() => {
          toast.classList.add("hidden");
        }, 2000);
      }

      // ==================== 事件监听 ====================

      // 页面加载完成后初始化
      document.addEventListener("DOMContentLoaded", function () {
        // 渲染列表
        renderItemList();

        // 添加表单提交
        document.getElementById("addForm").addEventListener("submit", addItem);

        // 编辑表单提交
        document
          .getElementById("editForm")
          .addEventListener("submit", saveEdit);

        // 搜索输入
        document
          .getElementById("searchInput")
          .addEventListener("input", renderItemList);

        // 点击ESC关闭模态框
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            closeEditModal();
          }
        });
      });
    </script>
  </body>
</html>
