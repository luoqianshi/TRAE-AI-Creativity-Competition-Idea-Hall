<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即客TODO - 响铃即结束，专注这一刻</title>
<style>
  :root {
    --bg: #FAF7F2;
    --bg-dark: #1E1E2E;
    --card: #FFFFFF;
    --card-dark: #2A2A3C;
    --text: #2D2D3A;
    --text-dark: #E8E8ED;
    --text-muted: #9B9BA8;
    --orange: #FF7A2F;
    --orange-light: #FFF0E6;
    --green: #2ECC71;
    --green-light: #E8FAF0;
    --ring-bg: #E8E5DF;
    --ring-bg-dark: #3A3A4E;
    --danger: #E74C3C;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
    --radius: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.3s, color 0.3s;
  }
  body.dark { background: var(--bg-dark); color: var(--text-dark); }
  .container {
    width: 100%;
    max-width: 480px;
    padding: 0 20px 100px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0 12px;
  }
  .app-name {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .app-name span { color: var(--orange); }
  .top-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 40px; height: 40px;
    border: none; border-radius: 12px;
    background: var(--card);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: var(--shadow);
    transition: transform 0.15s;
  }
  body.dark .icon-btn { background: var(--card-dark); }
  .icon-btn:active { transform: scale(0.92); }

  /* Stats */
  .stats-row {
    display: flex; gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    flex: 1;
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    transition: background 0.3s;
  }
  body.dark .stat-card { background: var(--card-dark); }
  .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 800; }
  .stat-value.orange { color: var(--orange); }
  .stat-value.green { color: var(--green); }

  /* Timer Ring */
  .timer-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 8px 0 20px;
    position: relative;
  }
  .timer-ring-wrapper {
    position: relative;
    width: 240px; height: 240px;
  }
  .timer-ring-wrapper svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: var(--ring-bg); stroke-width: 10; }
  body.dark .ring-bg { stroke: var(--ring-bg-dark); }
  .ring-progress {
    fill: none;
    stroke: var(--orange);
    stroke-width: 10;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s linear;
  }
  .ring-progress.completed { stroke: var(--green); }
  .timer-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .timer-digits {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .timer-hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* Flash animation for alarm */
  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .timer-section.alarming .timer-ring-wrapper {
    animation: flash 0.5s ease-in-out 6;
  }
  .timer-section.alarming .timer-digits {
    color: var(--green);
  }

  /* Current Task */
  .current-task {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    transition: all 0.3s;
  }
  body.dark .current-task { background: var(--card-dark); }
  .current-task-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .current-task-name {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 12px;
    word-break: break-all;
  }
  .current-task-actions { display: flex; gap: 8px; }
  .task-btn {
    flex: 1;
    height: 44px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
  }
  .task-btn:active { transform: scale(0.95); }
  .task-btn.pause { background: var(--orange-light); color: var(--orange); }
  body.dark .task-btn.pause { background: #3D2A1A; }
  .task-btn.resume { background: var(--orange); color: #fff; }
  .task-btn.giveup { background: #FEE; color: var(--danger); }
  body.dark .task-btn.giveup { background: #3D1A1A; }

  /* Input Area */
  .input-section {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
    transition: all 0.3s;
  }
  body.dark .input-section { background: var(--card-dark); }
  .input-section.disabled { opacity: 0.5; pointer-events: none; }
  .task-input {
    width: 100%;
    height: 44px;
    border: 2px solid var(--ring-bg);
    border-radius: 12px;
    padding: 0 14px;
    font-size: 15px;
    font-weight: 500;
    background: transparent;
    color: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  body.dark .task-input { border-color: var(--ring-bg-dark); }
  .task-input:focus { border-color: var(--orange); }
  .task-input::placeholder { color: var(--text-muted); }
  .time-presets {
    display: flex;
    gap: 8px;
    margin: 12px 0;
    flex-wrap: wrap;
  }
  .time-btn {
    height: 36px;
    padding: 0 14px;
    border: 2px solid var(--ring-bg);
    border-radius: 10px;
    background: transparent;
    font-size: 13px;
    font-weight: 700;
    color: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  body.dark .time-btn { border-color: var(--ring-bg-dark); }
  .time-btn.active { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }
  body.dark .time-btn.active { background: #3D2A1A; }
  .time-btn:active { transform: scale(0.95); }
  .custom-time-input {
    width: 60px; height: 36px;
    border: 2px solid var(--ring-bg);
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    background: transparent;
    color: inherit;
    outline: none;
  }
  body.dark .custom-time-input { border-color: var(--ring-bg-dark); }
  .custom-time-input:focus { border-color: var(--orange); }
  .start-btn {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 14px;
    background: var(--orange);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(255,122,47,0.35);
  }
  .start-btn:active { transform: scale(0.97); }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--card);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  body.dark .tabs { background: var(--card-dark); }
  .tab {
    flex: 1;
    height: 40px;
    border: none;
    border-radius: 12px;
    background: transparent;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active { background: var(--orange); color: #fff; }

  /* Task List */
  .task-list { flex: 1; }
  .task-item {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.3s;
    animation: slideIn 0.3s ease;
  }
  body.dark .task-item { background: var(--card-dark); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-item.removing {
    animation: slideOut 0.3s ease forwards;
  }
  @keyframes slideOut {
    to { opacity: 0; transform: translateX(40px); height: 0; padding: 0; margin: 0; overflow: hidden; }
  }
  .task-check {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2.5px solid var(--ring-bg);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    transition: all 0.2s;
  }
  body.dark .task-check { border-color: var(--ring-bg-dark); }
  .task-check.done { border-color: var(--green); background: var(--green); color: #fff; }
  .task-info { flex: 1; min-width: 0; }
  .task-info-name {
    font-size: 15px;
    font-weight: 600;
    word-break: break-all;
  }
  .task-info-name.done-text { text-decoration: line-through; color: var(--text-muted); }
  .task-info-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .task-delete {
    width: 32px; height: 32px;
    border: none; border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .task-delete:hover { background: #FEE; color: var(--danger); }
  body.dark .task-delete:hover { background: #3D1A1A; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }
  .empty-state-icon { font-size: 36px; margin-bottom: 8px; }

  /* Slogan */
  .slogan {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    text-align: center;
    padding: 14px;
    font-size: 12px;
    color: var(--text-muted);
    background: linear-gradient(transparent, var(--bg));
    pointer-events: none;
  }
  body.dark .slogan { background: linear-gradient(transparent, var(--bg-dark)); }

  /* Toast */
  .toast-container {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--green);
    color: #fff;
    padding: 14px 24px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    box-shadow: var(--shadow-lg);
    animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
    white-space: nowrap;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-20px); }
  }

  /* Responsive */
  @media (min-width: 600px) {
    .container { padding-top: 20px; }
    .timer-ring-wrapper { width: 280px; height: 280px; }
    .timer-digits { font-size: 60px; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="app-name">即客<span>TODO</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">今日完成</div>
      <div class="stat-value green" id="todayDone">0 项</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">累计专注</div>
      <div class="stat-value orange" id="totalFocus">0 分钟</div>
    </div>
  </div>

  <!-- Timer Ring -->
  <div class="timer-section" id="timerSection">
    <div class="timer-ring-wrapper">
      <svg viewBox="0 0 200 200">
        <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88"
          stroke-dasharray="553" stroke-dashoffset="0"></circle>
      </svg>
      <div class="timer-center">
        <div class="timer-digits" id="timerDigits">00:00</div>
        <div class="timer-hint" id="timerHint">输入任务，即刻开始</div>
      </div>
    </div>
  </div>

  <!-- Current Task -->
  <div class="current-task" id="currentTaskSection" style="display:none;">
    <div class="current-task-label">进行中</div>
    <div class="current-task-name" id="currentTaskName"></div>
    <div class="current-task-actions">
      <button class="task-btn pause" id="pauseBtn" onclick="togglePause()">暂停</button>
      <button class="task-btn giveup" onclick="giveUpTask()">放弃</button>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-section" id="inputSection">
    <input class="task-input" id="taskInput" placeholder="输入任务描述..." maxlength="50">
    <div class="time-presets">
      <button class="time-btn" data-min="3" onclick="selectTime(3, this)">3min</button>
      <button class="time-btn" data-min="5" onclick="selectTime(5, this)">5min</button>
      <button class="time-btn" data-min="10" onclick="selectTime(10, this)">10min</button>
      <button class="time-btn" data-min="15" onclick="selectTime(15, this)">15min</button>
      <input class="custom-time-input" id="customTime" type="number" min="1" max="120" placeholder="自定义" oninput="selectCustomTime()">
      <span style="font-size:12px;color:var(--text-muted);align-self:center;">分钟</span>
    </div>
    <button class="start-btn" id="startBtn" onclick="startTask()">开始计时</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('todo', this)">待办</button>
    <button class="tab" onclick="switchTab('doing', this)">进行中</button>
    <button class="tab" onclick="switchTab('done', this)">已完成</button>
  </div>

  <!-- Task List -->
  <div class="task-list" id="taskList"></div>
</div>

<!-- Slogan -->
<div class="slogan">响铃即结束，专注这一刻。</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ========== Data Layer ==========
const STORAGE_KEY = 'jike_todo_data';
let state = {
  tasks: [],        // { id, name, duration, status:'todo'|'doing'|'done', createdAt, completedAt, elapsed }
  currentId: null,
  isPaused: false,
  selectedTime: 0
};
let timerInterval = null;
let remainingSeconds = 0;
let totalSeconds = 0;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.tasks = saved.tasks || [];
      // Archive tasks completed > 24h
      const now = Date.now();
      state.tasks = state.tasks.filter(t => {
        if (t.status === 'done' && t.completedAt) {
          return (now - t.completedAt) < 86400000;
        }
        return true;
      });
      // Check if there's a running task
      const doing = state.tasks.find(t => t.status === 'doing');
      if (doing) {
        state.currentId = doing.id;
        // Calculate remaining time
        const elapsed = Math.floor((now - doing.resumeTimestamp) / 1000) + (doing.elapsedBeforeResume || 0);
        const totalDur = doing.duration * 60;
        remainingSeconds = Math.max(0, totalDur - elapsed);
        totalSeconds = totalDur;
        if (remainingSeconds <= 0) {
          completeTask(doing.id);
        } else {
          startTimerLoop();
        }
      }
    }
  } catch(e) { console.error(e); }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks: state.tasks }));
}

// ========== Time Selection ==========
function selectTime(min, btn) {
  state.selectedTime = min;
  document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('customTime').value = '';
}

function selectCustomTime() {
  const val = parseInt(document.getElementById('customTime').value);
  if (val > 0 && val <= 120) {
    state.selectedTime = val;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
  }
}

// ========== Task Creation ==========
function startTask() {
  const name = document.getElementById('taskInput').value.trim();
  if (!name) { document.getElementById('taskInput').focus(); return; }
  if (!state.selectedTime) { showToast('请选择时长'); return; }
  if (state.tasks.find(t => t.status === 'doing')) { showToast('已有进行中的任务'); return; }

  const task = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name,
    duration: state.selectedTime,
    status: 'doing',
    createdAt: Date.now(),
    completedAt: null,
    resumeTimestamp: Date.now(),
    elapsedBeforeResume: 0
  };
  state.tasks.unshift(task);
  state.currentId = task.id;
  state.isPaused = false;

  totalSeconds = task.duration * 60;
  remainingSeconds = totalSeconds;

  saveState();
  startTimerLoop();
  renderAll();

  // Reset input
  document.getElementById('taskInput').value = '';
  state.selectedTime = 0;
  document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('customTime').value = '';
}

// ========== Timer ==========
function startTimerLoop() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state.isPaused) return;
    remainingSeconds--;
    updateTimerDisplay();
    if (remainingSeconds <= 0) {
      clearInterval(timerInterval);
      completeTask(state.currentId);
    }
  }, 1000);
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const min = Math.floor(remainingSeconds / 60);
  const sec = remainingSeconds % 60;
  document.getElementById('timerDigits').textContent =
    String(min).padStart(2, '0') + ':' + String(sec).padStart(2, '0');

  // Progress ring
  const circumference = 2 * Math.PI * 88; // ~553
  const progress = totalSeconds > 0 ? (totalSeconds - remainingSeconds) / totalSeconds : 0;
  const offset = circumference * (1 - progress);
  const ring = document.getElementById('ringProgress');
  ring.style.strokeDashoffset = offset;
  ring.classList.toggle('completed', remainingSeconds <= 0 && totalSeconds > 0);

  // Hint
  const doing = state.tasks.find(t => t.id === state.currentId);
  if (doing) {
    document.getElementById('timerHint').textContent = doing.name;
  } else if (remainingSeconds <= 0 || totalSeconds <= 0) {
    document.getElementById('timerHint').textContent = '输入任务，即刻开始';
  }
}

function togglePause() {
  state.isPaused = !state.isPaused;
  const btn = document.getElementById('pauseBtn');
  if (state.isPaused) {
    btn.textContent = '继续';
    btn.className = 'task-btn resume';
    clearInterval(timerInterval);
  } else {
    btn.textContent = '暂停';
    btn.className = 'task-btn pause';
    // Update resume timestamp
    const task = state.tasks.find(t => t.id === state.currentId);
    if (task) {
      task.elapsedBeforeResume = (task.duration * 60) - remainingSeconds;
      task.resumeTimestamp = Date.now();
      saveState();
    }
    startTimerLoop();
  }
}

function giveUpTask() {
  clearInterval(timerInterval);
  const task = state.tasks.find(t => t.id === state.currentId);
  if (task) {
    task.status = 'todo';
    task.resumeTimestamp = null;
    task.elapsedBeforeResume = 0;
  }
  state.currentId = null;
  state.isPaused = false;
  remainingSeconds = 0;
  totalSeconds = 0;
  saveState();
  renderAll();
}

// ========== Complete Task ==========
function completeTask(taskId) {
  clearInterval(timerInterval);
  const task = state.tasks.find(t => t.id === taskId);
  if (!task) return;

  task.status = 'done';
  task.completedAt = Date.now();
  state.currentId = null;
  state.isPaused = false;
  remainingSeconds = 0;
  totalSeconds = 0;

  // Alarm
  playAlarm();
  // Flash
  const section = document.getElementById('timerSection');
  section.classList.add('alarming');
  setTimeout(() => section.classList.remove('alarming'), 3000);

  // Toast
  const timeStr = new Date(task.completedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  showToast(`🎉 叮！'${task.name}'已完成，干得漂亮！`);

  saveState();
  renderAll();
}

// ========== Alarm Sound ==========
function playAlarm() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playTone = (freq, startTime, dur) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
      osc.start(startTime);
      osc.stop(startTime + dur);
    };
    const now = ctx.currentTime;
    playTone(880, now, 0.2);
    playTone(1100, now + 0.25, 0.2);
    playTone(1320, now + 0.5, 0.4);
  } catch(e) {
    // Fallback: flash animation already handled
  }
}

// ========== Delete Task ==========
function deleteTask(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) {
    el.classList.add('removing');
    setTimeout(() => {
      state.tasks = state.tasks.filter(t => t.id !== id);
      saveState();
      renderAll();
    }, 300);
  } else {
    state.tasks = state.tasks.filter(t => t.id !== id);
    saveState();
    renderAll();
  }
}

// ========== Tabs ==========
let currentTab = 'todo';
function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderTaskList();
}

// ========== Render ==========
function renderAll() {
  renderStats();
  renderCurrentTask();
  renderInputSection();
  updateTimerDisplay();
  renderTaskList();
}

function renderStats() {
  const today = new Date().toDateString();
  const todayDone = state.tasks.filter(t => t.status === 'done' && new Date(t.completedAt).toDateString() === today);
  document.getElementById('todayDone').textContent = todayDone.length + ' 项';

  const totalMin = todayDone.reduce((sum, t) => sum + t.duration, 0);
  document.getElementById('totalFocus').textContent = totalMin + ' 分钟';
}

function renderCurrentTask() {
  const doing = state.tasks.find(t => t.status === 'doing');
  const section = document.getElementById('currentTaskSection');
  if (doing) {
    section.style.display = '';
    document.getElementById('currentTaskName').textContent = doing.name;
    const btn = document.getElementById('pauseBtn');
    if (state.isPaused) {
      btn.textContent = '继续';
      btn.className = 'task-btn resume';
    } else {
      btn.textContent = '暂停';
      btn.className = 'task-btn pause';
    }
  } else {
    section.style.display = 'none';
  }
}

function renderInputSection() {
  const doing = state.tasks.find(t => t.status === 'doing');
  document.getElementById('inputSection').classList.toggle('disabled', !!doing);
}

function renderTaskList() {
  const list = document.getElementById('taskList');
  let items = state.tasks.filter(t => t.status === currentTab);

  if (items.length === 0) {
    const icons = { todo: '📋', doing: '⏳', done: '🏆' };
    const msgs = { todo: '暂无待办任务', doing: '暂无进行中任务', done: '暂无已完成任务' };
    list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">${icons[currentTab]}</div>${msgs[currentTab]}</div>`;
    return;
  }

  list.innerHTML = items.map(task => {
    if (task.status === 'done') {
      const timeStr = new Date(task.completedAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      return `<div class="task-item" data-id="${task.id}">
        <div class="task-check done">✓</div>
        <div class="task-info">
          <div class="task-info-name done-text">${escHtml(task.name)}</div>
          <div class="task-info-meta">${task.duration}min · ${timeStr}完成</div>
        </div>
      </div>`;
    } else if (task.status === 'doing') {
      return `<div class="task-item" data-id="${task.id}">
        <div class="task-check" style="border-color:var(--orange);">⏱</div>
        <div class="task-info">
          <div class="task-info-name">${escHtml(task.name)}</div>
          <div class="task-info-meta">${task.duration}min · 进行中</div>
        </div>
      </div>`;
    } else {
      return `<div class="task-item" data-id="${task.id}">
        <div class="task-check"></div>
        <div class="task-info">
          <div class="task-info-name">${escHtml(task.name)}</div>
          <div class="task-info-meta">${task.duration}min</div>
        </div>
        <button class="task-delete" onclick="deleteTask('${task.id}')" title="删除">✕</button>
      </div>`;
    }
  }).join('');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ========== Toast ==========
function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ========== Theme ==========
function initTheme() {
  const saved = localStorage.getItem('jike_theme');
  if (saved === 'dark') document.body.classList.add('dark');
  updateThemeIcon();
}
document.getElementById('themeToggle').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  localStorage.setItem('jike_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
  updateThemeIcon();
});
function updateThemeIcon() {
  document.getElementById('themeToggle').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
}

// ========== Init ==========
initTheme();
loadState();
renderAll();

// Enter key to start
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') startTask();
});
</script>
</body>
</html>
