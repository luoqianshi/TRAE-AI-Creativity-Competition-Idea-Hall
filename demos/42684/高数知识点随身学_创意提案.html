<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>高数知识点随身学</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937}
header{background:linear-gradient(135deg,#1a3a5c,#4a90d9);color:white;padding:36px 20px;text-align:center}
header h1{margin:0;font-size:32px}
header p{opacity:.9}
.badge{display:inline-block;background:rgba(255,255,255,0.2);color:white;padding:6px 10px;border-radius:999px;font-size:13px;margin:4px}
.container{max-width:1100px;margin:auto;padding:24px}
.card{background:white;border-radius:18px;padding:22px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
label{display:block;margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:15px;font-family:inherit}
textarea{resize:vertical}
button{border:0;border-radius:12px;padding:12px 18px;background:#1a3a5c;color:white;font-weight:700;cursor:pointer;margin-top:14px;font-size:15px;transition:background .2s}
button:hover{background:#0f2a44}
.chat{background:#f9fafb;border-radius:14px;padding:14px;min-height:100px;line-height:1.7}
.ai{background:#e8edf5;padding:14px;border-radius:12px;margin-top:10px;border-left:4px solid #1a3a5c}
.ai strong{color:#1a3a5c}
.progress-wrap{height:18px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#1a3a5c,#4a90d9);transition:width .4s}
.tip{background:#fef9e7;padding:12px 16px;border-radius:12px;border-left:4px solid #f39c12;margin:8px 0}
.fav-item{display:inline-block;background:#e8edf5;color:#1a3a5c;padding:4px 12px;border-radius:999px;margin:4px;font-size:13px}
footer{text-align:center;color:#6b7280;padding:24px}
</style>
</head>
<body>

<header>
  <h1>高数知识点随身学</h1>
  <p>AI 帮你攻克极限 · 导数 · 积分</p>
  <span class="badge">知识点讲解</span>
  <span class="badge">易混对比</span>
  <span class="badge">进度追踪</span>
</header>

<div class="container">

  <!-- 模块1：AI 知识点讲解 -->
  <div class="card">
    <h2>AI 知识点讲解</h2>
    <label>选择知识类型</label>
    <select id="knowType">
      <option>极限</option>
      <option>导数</option>
      <option>积分</option>
      <option>级数</option>
      <option>微分方程</option>
    </select>
    <label>输入你想学的知识点</label>
    <textarea id="knowInput" rows="3" placeholder="例如：洛必达法则的使用条件 / 泰勒展开的核心思想 / 换元积分法怎么用"></textarea>
    <button onclick="askKnowledge()">向 AI 提问</button>
    <div class="chat" id="knowAnswer">AI 老师会为你清晰讲解知识点，配合典型例题帮助理解。</div>
  </div>

  <!-- 模块2：易混概念对比 -->
  <div class="card">
    <h2>易混概念对比</h2>
    <p style="color:#6b7280;font-size:14px">专门解决"这两个到底有什么区别"</p>
    <div class="grid">
      <div>
        <label>概念 A</label>
        <input id="conceptA" placeholder="例如：可导">
      </div>
      <div>
        <label>概念 B</label>
        <input id="conceptB" placeholder="例如：连续">
      </div>
    </div>
    <button onclick="compareConcept()">对比分析</button>
    <div class="chat" id="compareAnswer">AI 会从定义、条件、关系三个维度帮你区分易混概念。</div>
  </div>

  <!-- 模块3：公式速查 -->
  <div class="card">
    <h2>公式速查</h2>
    <p style="color:#6b7280;font-size:14px">分类整理核心公式，点击查看推导思路</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">
      <button class="secondary" onclick="showFormula('limit')" style="background:#e8edf5;color:#1a3a5c;margin:0;padding:8px 16px;font-size:13px">极限</button>
      <button class="secondary" onclick="showFormula('derivative')" style="background:#e8edf5;color:#1a3a5c;margin:0;padding:8px 16px;font-size:13px">导数</button>
      <button class="secondary" onclick="showFormula('integral')" style="background:#e8edf5;color:#1a3a5c;margin:0;padding:8px 16px;font-size:13px">积分</button>
      <button class="secondary" onclick="showFormula('series')" style="background:#e8edf5;color:#1a3a5c;margin:0;padding:8px 16px;font-size:13px">级数</button>
    </div>
    <div class="chat" id="formulaDisplay">点击上方分类查看对应的核心公式和推导思路。</div>
  </div>

  <!-- 模块4：学习进度追踪 -->
  <div class="card">
    <h2>学习进度追踪</h2>
    <div class="grid">
      <div>
        <label>今日学习时长（小时）</label>
        <input id="hours" type="number" step="0.5">
      </div>
      <div>
        <label>今日掌握知识点数</label>
        <input id="points" type="number" placeholder="例如：3">
      </div>
    </div>
    <button onclick="saveProgress()">记录今日学习</button>
    <p>累计掌握知识点：<b id="totalPoints">0</b> 个</p>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <p id="encourage">持续积累，高数没有那么难。</p>
  </div>

  <!-- 模块5：收藏夹 -->
  <div class="card">
    <h2>收藏夹</h2>
    <p style="color:#6b7280;font-size:14px">点击下方按钮收藏当前查看的公式或知识点</p>
    <button onclick="addFavorite()" style="background:#4a90d9">收藏当前内容</button>
    <div id="favList" style="margin-top:12px;min-height:40px">
      <span style="color:#9ca3af;font-size:14px">还没有收藏内容，开始学习吧</span>
    </div>
  </div>

</div>

<footer>
  高数是一道坎，但你不是一个人在战斗。
</footer>

<script>
let totalPoints = Number(localStorage.getItem("mathPoints") || 0);
let favorites = JSON.parse(localStorage.getItem("mathFavs") || "[]");
let currentFormula = "";

updateProgress();
renderFavs();

function askKnowledge() {
  const type = document.getElementById("knowType").value;
  const q = document.getElementById("knowInput").value || "请帮我讲解一个重要概念";

  const knowledgeMap = {
    "极限": "极限是研究函数在某一点附近的变化趋势。核心思想：无限逼近。例题：lim(x→0) sinx/x = 1，可用夹逼定理证明。",
    "导数": "导数表示函数在某一点的瞬时变化率，几何意义是切线斜率。例题：求 y=x² 的导数，结果为 2x。",
    "积分": "积分是导数的逆运算，用于求曲线下面积。例题：∫x²dx = x³/3 + C，注意别忘了常数 C。",
    "级数": "级数是将数列求和，核心是判断收敛性。例题：等比级数 ∑q^n 当 |q|<1 时收敛，和为 a/(1-q)。",
    "微分方程": "微分方程是含有导数的方程，用于描述变化规律。例题：dy/dx = 2x 的通解为 y = x² + C。"
  };

  const detail = knowledgeMap[type] || "这个知识点很重要，建议从定义入手理解。";

  document.getElementById("knowAnswer").innerHTML = `
    <div class="ai">
      <strong>问题：</strong>${q}<br><br>
      <strong>AI 讲解：</strong>${detail}<br><br>
      <strong>学习建议：</strong>看完讲解后找 3 道同类题练习，巩固理解。
    </div>
  `;
  currentFormula = detail;
}

function compareConcept() {
  const a = document.getElementById("conceptA").value || "概念 A";
  const b = document.getElementById("conceptB").value || "概念 B";

  const compareMap = {
    "可导,连续": "可导一定连续，但连续不一定可导。可导要求左右导数存在且相等，连续只要求左右极限相等且等于函数值。",
    "连续,可导": "可导一定连续，但连续不一定可导。可导要求左右导数存在且相等，连续只要求左右极限相等且等于函数值。",
    "收敛,绝对收敛": "绝对收敛一定收敛，但收敛不一定绝对收敛。绝对收敛是加绝对值后收敛，条件收敛是原级数收敛但加绝对值发散。",
    "绝对收敛,收敛": "绝对收敛一定收敛，但收敛不一定绝对收敛。绝对收敛是加绝对值后收敛，条件收敛是原级数收敛但加绝对值发散。"
  };

  const key1 = a + "," + b;
  const key2 = b + "," + a;
  let result = compareMap[key1] || compareMap[key2] || 
    `"${a}" 与 "${b}" 的区别：建议从定义入手，先明确各自的前提条件，再对比适用范围和结论。可结合具体例题理解。`;

  document.getElementById("compareAnswer").innerHTML = `
    <div class="ai">
      <strong>对比分析：</strong><br><br>
      ${result}
    </div>
  `;
  currentFormula = result;
}

function showFormula(type) {
  const formulas = {
    "limit": "【极限核心公式】\n• lim(x→0) sinx/x = 1\n• lim(x→0) (1-cosx)/x = 0\n• lim(x→∞) (1+1/x)^x = e\n推导思路：利用夹逼定理或等价无穷小替换。",
    "derivative": "【导数核心公式】\n• (x^n)' = nx^(n-1)\n• (sinx)' = cosx\n• (cosx)' = -sinx\n• (e^x)' = e^x\n• (lnx)' = 1/x\n推导思路：利用定义法或复合函数求导法则。",
    "integral": "【积分核心公式】\n• ∫x^n dx = x^(n+1)/(n+1) + C\n• ∫sinx dx = -cosx + C\n• ∫cosx dx = sinx + C\n• ∫e^x dx = e^x + C\n• ∫1/x dx = ln|x| + C\n推导思路：记住导数的逆运算，多做换元练习。",
    "series": "【级数核心公式】\n• 等比级数：∑q^n = a/(1-q)，|q|<1\n• p-级数：∑1/n^p，p>1时收敛\n• 调和级数：∑1/n 发散\n推导思路：利用比较判别法或比值判别法判断敛散性。"
  };

  const content = formulas[type] || "请选择有效分类";
  document.getElementById("formulaDisplay").innerHTML = `
    <div class="ai">
      <strong>${type === 'limit' ? '极限' : type === 'derivative' ? '导数' : type === 'integral' ? '积分' : '级数'}核心公式</strong><br><br>
      ${content.replace(/\n/g, '<br>')}
    </div>
  `;
  currentFormula = content;
}

function saveProgress() {
  const h = Number(document.getElementById("hours").value || 0);
  const p = Number(document.getElementById("points").value || 0);
  if (h > 0 || p > 0) {
    totalPoints += p;
    localStorage.setItem("mathPoints", totalPoints);
    updateProgress();
    document.getElementById("encourage").innerText = h > 0 ? `今日学习 ${h} 小时，掌握 ${p} 个知识点，继续加油！` : "又进步了一点，坚持就是胜利。";
  } else {
    alert("请至少填写学习时长或知识点数");
  }
}

function updateProgress() {
  document.getElementById("totalPoints").innerText = totalPoints;
  const percent = Math.min(totalPoints / 50 * 100, 100);
  document.getElementById("progressBar").style.width = percent + "%";

  if (totalPoints >= 40) {
    document.getElementById("encourage").innerText = "太棒了！你已经掌握了大量高数知识，离目标越来越近了！";
  } else if (totalPoints >= 20) {
    document.getElementById("encourage").innerText = "状态不错，保持节奏，高数能力正在稳步提升。";
  } else if (totalPoints >= 10) {
    document.getElementById("encourage").innerText = "好的开始是成功的一半，继续积累知识点吧。";
  } else {
    document.getElementById("encourage").innerText = "每天学一点，高数没有那么难。";
  }
}

function addFavorite() {
  if (currentFormula && currentFormula.length > 5) {
    if (!favorites.includes(currentFormula)) {
      favorites.push(currentFormula);
      localStorage.setItem("mathFavs", JSON.stringify(favorites));
      renderFavs();
    } else {
      alert("该内容已在收藏夹中");
    }
  } else {
    alert("请先生成知识点或公式内容再收藏");
  }
}

function renderFavs() {
  const container = document.getElementById("favList");
  if (favorites.length === 0) {
    container.innerHTML = '<span style="color:#9ca3af;font-size:14px">还没有收藏内容，开始学习吧</span>';
    return;
  }
  container.innerHTML = favorites.map((item, idx) => 
    `<span class="fav-item" onclick="removeFav(${idx})" style="cursor:pointer">✕ ${item.substring(0, 20)}${item.length > 20 ? '...' : ''}</span>`
  ).join('');
}

function removeFav(idx) {
  favorites.splice(idx, 1);
  localStorage.setItem("mathFavs", JSON.stringify(favorites));
  renderFavs();
}

// 回车键触发查询
document.getElementById("knowInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    askKnowledge();
  }
});
</script>

</body>
</html>
