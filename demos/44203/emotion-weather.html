<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情绪天气预报</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);

  /* Warm cream base */
  --bg-warm: oklch(96% 0.012 85);
  --text-primary: oklch(22% 0.02 85);
  --text-secondary: oklch(45% 0.03 80);
  --text-muted: oklch(62% 0.02 80);
  --card-bg: oklch(98% 0.005 85);
  --card-border: oklch(88% 0.008 80);
  --card-shadow: oklch(20% 0.01 85 / 8%);
  --accent-amber: oklch(65% 0.18 75);
  --accent-coral: oklch(55% 0.2 25);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: clamp(15px, 1vw + 0.5rem, 18px); }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: var(--bg-warm);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

/* ── Sky Canvas ── */
.sky-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  transition: background 1.2s var(--ease-out-quart);
  background: linear-gradient(180deg,
    oklch(92% 0.06 95) 0%,
    oklch(96% 0.02 85) 60%,
    oklch(98% 0.01 85) 100%
  );
}

/* Weather state backgrounds */
.sky-canvas[data-weather="sunny"] {
  background: linear-gradient(180deg,
    oklch(85% 0.14 95) 0%,
    oklch(92% 0.08 85) 40%,
    oklch(97% 0.02 80) 80%,
    oklch(95% 0.04 140) 100%
  );
}
.sky-canvas[data-weather="cloudy"] {
  background: linear-gradient(180deg,
    oklch(82% 0.03 250) 0%,
    oklch(88% 0.03 240) 40%,
    oklch(94% 0.02 230) 80%,
    oklch(92% 0.04 200) 100%
  );
}
.sky-canvas[data-weather="rain"] {
  background: linear-gradient(180deg,
    oklch(55% 0.03 255) 0%,
    oklch(65% 0.04 250) 30%,
    oklch(75% 0.03 245) 60%,
    oklch(82% 0.02 240) 100%
  );
}
.sky-canvas[data-weather="storm"] {
  background: linear-gradient(180deg,
    oklch(28% 0.04 280) 0%,
    oklch(38% 0.05 275) 30%,
    oklch(50% 0.04 270) 60%,
    oklch(60% 0.03 260) 100%
  );
}
.sky-canvas[data-weather="sunset"] {
  background: linear-gradient(180deg,
    oklch(55% 0.18 45) 0%,
    oklch(65% 0.15 55) 25%,
    oklch(75% 0.1 70) 50%,
    oklch(85% 0.06 80) 75%,
    oklch(92% 0.03 85) 100%
  );
}
.sky-canvas[data-weather="rainbow"] {
  background: linear-gradient(180deg,
    oklch(78% 0.06 280) 0%,
    oklch(82% 0.05 260) 30%,
    oklch(88% 0.04 200) 55%,
    oklch(92% 0.03 140) 75%,
    oklch(96% 0.02 85) 100%
  );
}

/* ── Clouds ── */
.clouds-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.cloud {
  position: absolute;
  background: radial-gradient(ellipse at 40% 35%, oklch(98% 0.005 85) 0%, oklch(92% 0.008 85 / 70%) 50%, transparent 70%);
  border-radius: 50%;
  filter: blur(2px);
  opacity: 0;
  transition: opacity 0.8s var(--ease-out-quart);
}
.cloud-1 { width: 300px; height: 90px; top: 8%; left: -100px; animation: cloudDrift1 28s linear infinite; }
.cloud-2 { width: 200px; height: 65px; top: 18%; left: -80px; animation: cloudDrift2 22s linear infinite; animation-delay: -8s; }
.cloud-3 { width: 250px; height: 75px; top: 5%; left: -120px; animation: cloudDrift3 32s linear infinite; animation-delay: -15s; }
.cloud-4 { width: 180px; height: 55px; top: 25%; left: -90px; animation: cloudDrift1 25s linear infinite; animation-delay: -4s; }

@keyframes cloudDrift1 { to { transform: translateX(calc(100vw + 400px)); } }
@keyframes cloudDrift2 { to { transform: translateX(calc(100vw + 300px)); } }
@keyframes cloudDrift3 { to { transform: translateX(calc(100vw + 500px)); } }

/* ── Sun ── */
.sun {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  top: 6%;
  right: 12%;
  width: 100px;
  height: 100px;
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 1s var(--ease-out-quart), transform 1s var(--ease-out-quart);
}
.sun-core {
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, oklch(95% 0.2 85), oklch(88% 0.18 80), oklch(80% 0.15 75));
  border-radius: 50%;
  box-shadow: 0 0 60px oklch(85% 0.2 80 / 50%), 0 0 120px oklch(82% 0.15 70 / 25%);
  animation: sunPulse 4s ease-in-out infinite;
}
@keyframes sunPulse {
  0%, 100% { box-shadow: 0 0 60px oklch(85% 0.2 80 / 50%), 0 0 120px oklch(82% 0.15 70 / 25%); }
  50% { box-shadow: 0 0 80px oklch(85% 0.2 80 / 60%), 0 0 150px oklch(82% 0.15 70 / 35%); }
}

/* ── Rain ── */
.rain-layer {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.8s var(--ease-out-quart);
}
.raindrop {
  position: absolute;
  width: 2px;
  background: linear-gradient(transparent, oklch(80% 0.04 240 / 60%));
  animation: rainFall linear infinite;
}
@keyframes rainFall {
  0% { transform: translateY(-10vh); opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateY(105vh); opacity: 0; }
}

/* ── Lightning ── */
.lightning {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background: oklch(95% 0.05 85 / 0%);
  transition: background 0.1s;
  opacity: 0;
}
.lightning.flash { background: oklch(95% 0.05 85 / 12%); }

/* ── Rainbow ── */
.rainbow {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  width: 500px;
  height: 250px;
  top: 25%;
  left: 50%;
  transform: translateX(-50%) scale(0);
  opacity: 0;
  transition: transform 1.5s var(--ease-out-expo), opacity 0.8s var(--ease-out-quart);
  border-radius: 50% 50% 0 0;
  background: conic-gradient(
    from 180deg at 50% 100%,
    oklch(70% 0.2 30) 0deg,
    oklch(70% 0.2 50) 15deg,
    oklch(70% 0.2 90) 30deg,
    oklch(70% 0.2 145) 45deg,
    oklch(70% 0.2 210) 60deg,
    oklch(70% 0.2 270) 75deg,
    oklch(70% 0.15 310 / 50%) 90deg,
    transparent 90deg
  );
  -webkit-mask: radial-gradient(ellipse at 50% 100%, black 60%, transparent 72%);
  mask: radial-gradient(ellipse at 50% 100%, black 60%, transparent 72%);
}

/* ── Stars (for storm) ── */
.stars-layer {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1s var(--ease-out-quart);
}
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: oklch(90% 0.02 85);
  border-radius: 50%;
}

/* ── Main Content ── */
.container {
  position: relative;
  z-index: 10;
  max-width: 720px;
  margin: 0 auto;
  padding: clamp(2rem, 6vw, 4rem) clamp(1.25rem, 4vw, 2rem);
}

/* ── Header ── */
.header {
  text-align: center;
  margin-bottom: clamp(2rem, 5vw, 3.5rem);
}
.badge {
  display: inline-block;
  font-family: 'Noto Serif SC', serif;
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-secondary);
  border: 1px solid oklch(80% 0.03 80);
  border-radius: 100px;
  padding: 0.35em 1.2em;
  margin-bottom: 1.2rem;
  animation: fadeSlideUp 0.8s var(--ease-out-expo) both;
}
h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1.15;
  color: var(--text-primary);
  animation: fadeSlideUp 0.8s var(--ease-out-expo) 0.1s both;
}
.subtitle {
  font-size: 1.05rem;
  color: var(--text-secondary);
  margin-top: 0.6rem;
  max-width: 36ch;
  margin-inline: auto;
  font-weight: 300;
  animation: fadeSlideUp 0.8s var(--ease-out-expo) 0.2s both;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Emotion Selector ── */
.emotion-selector {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: clamp(0.6rem, 1.5vw, 1rem);
  margin-bottom: clamp(2rem, 4vw, 3rem);
  animation: fadeSlideUp 0.8s var(--ease-out-expo) 0.3s both;
}
.emotion-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: clamp(0.8rem, 2vw, 1.1rem) 0.5rem;
  border-radius: 18px;
  border: 1.5px solid var(--card-border);
  background: var(--card-bg);
  cursor: pointer;
  transition: all 0.3s var(--ease-out-quart);
  position: relative;
  overflow: hidden;
}
.emotion-card::before {
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.3s var(--ease-out-quart);
  border-radius: 16px;
}
.emotion-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px var(--card-shadow);
  border-color: oklch(75% 0.06 80);
}
.emotion-card.active {
  border-color: var(--accent-amber);
  border-width: 2px;
  box-shadow: 0 4px 20px oklch(60% 0.15 75 / 18%);
  background: oklch(94% 0.06 85);
}
.emotion-card.active::before {
  opacity: 1;
  background: linear-gradient(135deg, oklch(80% 0.1 80 / 15%), oklch(90% 0.05 85 / 10%));
}
.emotion-emoji { font-size: clamp(1.8rem, 4vw, 2.4rem); line-height: 1; }
.emotion-label {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-secondary);
  letter-spacing: 0.04em;
}
.emotion-card.active .emotion-label { color: var(--text-primary); font-weight: 600; }

/* ── Weather Report ── */
.report-section {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.7s var(--ease-out-expo);
  pointer-events: none;
}
.report-section.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.report-card {
  background: oklch(98% 0.003 85 / 85%);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 24px;
  padding: clamp(1.5rem, 4vw, 2.5rem);
  border: 1px solid oklch(88% 0.01 85 / 50%);
  box-shadow: 0 4px 32px oklch(20% 0.01 85 / 6%);
}

.weather-forecast {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(1.4rem, 3.5vw, 2rem);
  font-weight: 700;
  line-height: 1.4;
  margin-bottom: 1rem;
}
.weather-desc {
  font-size: 1rem;
  color: var(--text-secondary);
  font-weight: 400;
  line-height: 1.8;
  max-width: 50ch;
}
.weather-stats {
  display: flex;
  gap: 1.5rem;
  margin-top: 1.5rem;
  flex-wrap: wrap;
}
.stat-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text-secondary); }
.stat-value { font-weight: 700; color: var(--text-primary); font-size: 1.1rem; font-family: 'Noto Serif SC', serif; }

/* ── Prescription ── */
.prescription {
  margin-top: 1.8rem;
  padding-top: 1.5rem;
  border-top: 1px solid oklch(88% 0.008 85);
}
.prescription h3 {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 0.8rem;
}
.prescription-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.prescription-list li {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  font-size: 0.92rem;
  color: var(--text-secondary);
  padding: 0.5rem 0.8rem;
  border-radius: 10px;
  background: oklch(94% 0.01 85 / 50%);
  transition: background 0.2s;
}
.prescription-list li:hover { background: oklch(90% 0.02 85 / 50%); }
.prescription-icon { font-size: 1.2rem; flex-shrink: 0; }

/* ── Share CTA ── */
.share-cta {
  margin-top: 2rem;
  text-align: center;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.6s var(--ease-out-expo) 0.3s;
}
.report-section.visible .share-cta {
  opacity: 1;
  transform: translateY(0);
}
.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.8rem 2rem;
  border-radius: 100px;
  border: none;
  background: oklch(28% 0.02 85);
  color: oklch(95% 0.01 85);
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s var(--ease-out-quart);
  letter-spacing: 0.03em;
}
.share-btn:hover {
  background: oklch(22% 0.02 85);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px oklch(20% 0.01 85 / 20%);
}
.share-btn:active { transform: scale(0.97); }

/* ── Reset Button ── */
.reset-hint {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.82rem;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.2s;
  user-select: none;
}
.reset-hint:hover { color: var(--text-secondary); }

/* ── Footer ── */
.footer {
  text-align: center;
  margin-top: clamp(3rem, 8vw, 5rem);
  font-size: 0.78rem;
  color: var(--text-muted);
  letter-spacing: 0.04em;
  animation: fadeSlideUp 0.8s var(--ease-out-expo) 0.4s both;
}

/* ── Visibility Toggles ── */
.show-sun .sun { opacity: 1; transform: scale(1); }
.show-clouds .cloud { opacity: 1; }
.show-rain .rain-layer { opacity: 1; }
.show-storm .stars-layer { opacity: 1; }
.show-rainbow .rainbow { transform: translateX(-50%) scale(1); opacity: 0.7; }

/* ── Responsive ── */
@media (max-width: 500px) {
  .emotion-selector { grid-template-columns: repeat(3, 1fr); }
  .weather-stats { flex-direction: column; gap: 0.5rem; }
}
</style>
</head>
<body>

<!-- Sky Canvas -->
<div class="sky-canvas" id="skyCanvas"></div>

<!-- Clouds -->
<div class="clouds-layer" id="cloudsLayer">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>
</div>

<!-- Sun -->
<div class="sun" id="sun">
  <div class="sun-core"></div>
</div>

<!-- Rain -->
<div class="rain-layer" id="rainLayer"></div>

<!-- Lightning -->
<div class="lightning" id="lightning"></div>

<!-- Rainbow -->
<div class="rainbow" id="rainbow"></div>

<!-- Stars -->
<div class="stars-layer" id="starsLayer"></div>

<!-- Main Content -->
<div class="container">
  <header class="header">
    <div class="badge">TRAE AI 创造力大赛 · 生活娱乐赛道</div>

  <!-- Emotion Cards -->
  <div class="emotion-selector" id="emotionSelector">
    <button class="emotion-card" data-emotion="sunny" aria-label="元气满满">
      <span class="emotion-emoji">☀️</span>
      <span class="emotion-label">元气满满</span>
    </button>
    <button class="emotion-card" data-emotion="cloudy" aria-label="平静放松">
      <span class="emotion-emoji">⛅</span>
      <span class="emotion-label">平静放松</span>
    </button>
    <button class="emotion-card" data-emotion="rain" aria-label="有点emo">
      <span class="emotion-emoji">🌧️</span>
      <span class="emotion-label">有点emo</span>
    </button>
    <button class="emotion-card" data-emotion="storm" aria-label="焦虑破防">
      <span class="emotion-emoji">⛈️</span>

    <button class="emotion-card" data-emotion="sunset" aria-label="疲惫躺平">
      <span class="emotion-emoji">🌅</span>
      <span class="emotion-label">疲惫躺平</span>
    </button>
    <button class="emotion-card" data-emotion="rainbow" aria-label="期待兴奋">
      <span class="emotion-emoji">🌈</span>
      <span class="emotion-label">期待兴奋</span>
    </button>
  </div>

  <!-- Weather Report -->
  <div class="report-section" id="reportSection">
    <div class="report-card">
      <div class="weather-forecast" id="weatherForecast"></div>
      <div class="weather-desc" id="weatherDesc"></div>
      <div class="weather-stats" id="weatherStats"></div>
      <div class="prescription">
        <h3>情绪处方</h3>
        <ul class="prescription-list" id="prescriptionList"></ul>
      </div>
    </div>
    <div class="share-cta">
      <button class="share-btn" onclick="handleShare()">
        <span>📤</span> 分享我的情绪天气
      </button>
    </div>
    <div class="reset-hint" onclick="resetWeather()">← 换一种情绪试试？</div>
  </div>

  <footer class="footer">
    <p>TRAE AI 创造力大赛 · 情绪天气预报 · 让每一种情绪都被看见</p>
  </footer>
</div>

// ── State ──
let currentWeather = null;
const skyCanvas = document.getElementById('skyCanvas');
const cloudsLayer = document.getElementById('cloudsLayer');
const sun = document.getElementById('sun');
const rainLayer = document.getElementById('rainLayer');
const lightning = document.getElementById('lightning');
const rainbow = document.getElementById('rainbow');
const starsLayer = document.getElementById('starsLayer');
const reportSection = document.getElementById('reportSection');

// ── Build rain drops ──
function buildRaindrops() {
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 120; i++) {
    const drop = document.createElement('div');
    drop.className = 'raindrop';
    drop.style.left = Math.random() * 100 + '%';
    drop.style.height = (8 + Math.random() * 16) + 'px';
    drop.style.animationDuration = (0.4 + Math.random() * 0.6) + 's';
    drop.style.animationDelay = Math.random() * 1.5 + 's';
    fragment.appendChild(drop);
  }
  rainLayer.appendChild(fragment);
}

// ── Build stars ──
function buildStars() {
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 40 + '%';
    star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
    star.style.animation = `twinkle ${2 + Math.random() * 3}s ease-in-out infinite`;
    star.style.animationDelay = Math.random() * 3 + 's';
    fragment.appendChild(star);
  }
  starsLayer.appendChild(fragment);
}

// ── Lightning effect ──
let lightningInterval;
function startLightning() {
  lightningInterval = setInterval(() => {
    lightning.classList.add('flash');
    setTimeout(() => lightning.classList.remove('flash'), 80 + Math.random() * 120);
  }, 2000 + Math.random() * 4000);
}
function stopLightning() {
  clearInterval(lightningInterval);
  lightning.classList.remove('flash');
}

// ── Set Weather ──
function setWeather(weatherKey) {
  const data = weatherData[weatherKey];
  if (!data) return;

  currentWeather = weatherKey;

  // Remove all visibility classes
  document.body.classList.remove('show-sun', 'show-clouds', 'show-rain', 'show-storm', 'show-rainbow');

  // Reset layers
  stopLightning();
  lightning.style.opacity = '0';
  rainLayer.style.opacity = '0';
  starsLayer.style.opacity = '0';
  rainbow.style.transform = 'translateX(-50%) scale(0)';
  rainbow.style.opacity = '0';
  sun.style.opacity = '0';
  sun.style.transform = 'scale(0.5)';

  // Sky
  skyCanvas.setAttribute('data-weather', data.weather);

  // Apply weather-specific
  switch (weatherKey) {
    case 'sunny':
      document.body.classList.add('show-sun');
      document.body.classList.add('show-clouds');
      cloudsLayer.querySelectorAll('.cloud').forEach(c => c.style.opacity = '0.3');
      break;
    case 'cloudy':
      document.body.classList.add('show-clouds');
      cloudsLayer.querySelectorAll('.cloud').forEach(c => c.style.opacity = '0.8');
      break;
    case 'rain':
      document.body.classList.add('show-clouds', 'show-rain');
      cloudsLayer.querySelectorAll('.cloud').forEach(c => c.style.opacity = '0.9');
      break;
    case 'storm':
      document.body.classList.add('show-clouds', 'show-rain', 'show-storm');
      cloudsLayer.querySelectorAll('.cloud').forEach(c => c.style.opacity = '1');
      lightning.style.opacity = '1';
      startLightning();
      break;
    case 'sunset':
      document.body.classList.add('show-sun');
      sun.querySelector('.sun-core').style.background = 'radial-gradient(circle, oklch(80% 0.18 40), oklch(70% 0.15 35), oklch(55% 0.12 25))';
      sun.querySelector('.sun-core').style.boxShadow = '0 0 80px oklch(70% 0.2 35 / 50%), 0 0 160px oklch(65% 0.18 30 / 25%)';
      sun.style.top = '35%';
      sun.style.right = '20%';
      break;
    case 'rainbow':
      document.body.classList.add('show-rainbow');
      setTimeout(() => {
        rainbow.style.transform = 'translateX(-50%) scale(1)';
        rainbow.style.opacity = '0.7';
      }, 200);
      break;
  }

  // Update report
  document.getElementById('weatherForecast').textContent = data.forecast;
  document.getElementById('weatherDesc').textContent = data.desc;

  const statsHtml = data.stats.map(s =>
    `<div class="stat-item"><span>${s.label}</span><span class="stat-value">${s.value}</span></div>`
  ).join('');
  document.getElementById('weatherStats').innerHTML = statsHtml;

  const prescriptionHtml = data.prescription.map(p =>
    `<li><span class="prescription-icon">${p.icon}</span>${p.text}</li>`
  ).join('');
  document.getElementById('prescriptionList').innerHTML = prescriptionHtml;

  // Show report
  requestAnimationFrame(() => {
    reportSection.classList.add('visible');
  });

  // HACK: Reset sun for sunset
  if (weatherKey !== 'sunset') {
    sun.querySelector('.sun-core').style.background = '';
    sun.querySelector('.sun-core').style.boxShadow = '';
    sun.style.top = '6%';
    sun.style.right = '12%';
  }
}

// ── Handle card click ──
document.getElementById('emotionSelector').addEventListener('click', (e) => {
  const card = e.target.closest('.emotion-card');
  if (!card) return;

  // Update active state
  document.querySelectorAll('.emotion-card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');

  setWeather(card.dataset.emotion);
});

// ── Share ──
function handleShare() {
  const shareText = document.getElementById('weatherForecast').textContent;
  if (navigator.share) {
    navigator.share({
      title: '情绪天气预报',
      text: '🌤️ ' + shareText + ' | 来测测你此刻的情绪天气 →',
    }).catch(() => {});
  } else {
    navigator.clipboard.writeText('🌤️ ' + shareText + '\n来情绪天气预报，看看你的心情是什么天气 →').then(() => {
      alert('已复制分享文案到剪贴板 📋');
    });
  }
}

// ── Reset ──
function resetWeather() {
  currentWeather = null;
  document.querySelectorAll('.emotion-card').forEach(c => c.classList.remove('active'));
  document.body.classList.remove('show-sun', 'show-clouds', 'show-rain', 'show-storm', 'show-rainbow');
  stopLightning();
  lightning.style.opacity = '0';
  rainLayer.style.opacity = '0';
  starsLayer.style.opacity = '0';
  rainbow.style.transform = 'translateX(-50%) scale(0)';
  rainbow.style.opacity = '0';
  sun.style.opacity = '0';
  sun.style.transform = 'scale(0.5)';
  skyCanvas.removeAttribute('data-weather');
  reportSection.classList.remove('visible');
}

// ── Init ──
buildRaindrops();
buildStars();

// Twinkle keyframe injection
const twinkleStyle = document.createElement('style');
twinkleStyle.textContent = '@keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }';
document.head.appendChild(twinkleStyle);
</script>
