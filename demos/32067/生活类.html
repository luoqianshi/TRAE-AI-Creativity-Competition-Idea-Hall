<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>不时不食 · AI节气餐桌</title>
    <style>
        :root {
            --bg: #f5f0e8;
            --card: #ffffff;
            --text: #3d3226;
            --sub: #8b7355;
            --accent: #7ebc59;
            --accent2: #e8b44b;
            --border: #e0d5c1;
            --shadow: 0 4px 20px rgba(0,0,0,0.06);
            --radius: 20px;
            --spring1: #f0e6d3;
            --spring2: #e8f5e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #f7f3ea 0%, #ede4d4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: var(--shadow), 0 20px 60px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.8);
        }

        /* 顶部 */
        .header {
            padding: 24px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #7ebc59, #5a9e3e);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 12px rgba(126, 188, 89, 0.3);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: #3d3226;
            letter-spacing: 1px;
        }

        .logo-sub {
            font-size: 11px;
            color: #8b7355;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f5d5a0, #e8b44b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(232, 180, 75, 0.3);
        }

        /* 节气卡片 */
        .solar-term-card {
            margin: 20px 20px;
            background: linear-gradient(135deg, #e8f5e0 0%, #f0f7e8 40%, #fef9f0 100%);
            border-radius: var(--radius);
            padding: 22px 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .solar-term-card::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(126,188,89,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .solar-date {
            font-size: 12px;
            color: #7ebc59;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .solar-name {
            font-size: 28px;
            font-weight: 800;
            color: #3d3226;
            letter-spacing: 2px;
        }

        .solar-tagline {
            font-size: 13px;
            color: #6b5d4f;
            margin-top: 4px;
            font-weight: 400;
        }

        .solar-advice {
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.7);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: #5a4a3a;
        }

        .solar-advice .icon {
            font-size: 18px;
        }

        /* 功能区 */
        .section-title {
            padding: 0 24px;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #3d3226;
        }

        .section-title .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }

        /* AI 拍照入口 */
        .scan-area {
            margin: 0 20px 16px;
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px dashed var(--accent);
        }

        .scan-area:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.1);
            border-color: #5a9e3e;
        }

        .scan-icon-wrap {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #e8f5e0, #c8e6c0);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            flex-shrink: 0;
        }

        .scan-info h4 {
            font-size: 15px;
            font-weight: 700;
            color: #3d3226;
            margin-bottom: 3px;
        }

        .scan-info p {
            font-size: 12px;
            color: #8b7355;
            line-height: 1.4;
        }

        .scan-arrow {
            margin-left: auto;
            font-size: 18px;
            color: #7ebc59;
            flex-shrink: 0;
        }

        /* 推荐食谱列表 */
        .recipe-list {
            margin: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 24px;
        }

        .recipe-card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            gap: 14px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .recipe-card:hover {
            border-color: #e0d5c1;
            transform: translateX(2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
        }

        .recipe-emoji {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #fef9f0, #fdf3e0);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
        }

        .recipe-detail {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }

        .recipe-name {
            font-size: 16px;
            font-weight: 700;
            color: #3d3226;
        }

        .recipe-desc {
            font-size: 12px;
            color: #8b7355;
            line-height: 1.5;
        }

        .recipe-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .tag {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .tag-season {
            background: #e8f5e0;
            color: #5a9e3e;
        }

        .tag-benefit {
            background: #fef3e0;
            color: #c8872b;
        }

        .tag-easy {
            background: #e8f0fe;
            color: #4a7fcf;
        }

        /* 底部导航 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 14px 20px 20px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(224, 213, 193, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #b5a58a;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-item.active {
            color: #7ebc59;
            font-weight: 600;
        }

        .nav-item .nav-icon {
            font-size: 20px;
        }

        .nav-item.active .nav-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #7ebc59;
            margin-top: -2px;
        }

        /* 响应式 */
        @media (max-width: 440px) {
            .container {
                border-radius: 24px;
            }
            .solar-name {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部 -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">🌿</div>
                <div>
                    <div class="logo-text">不时不食</div>
                    <div class="logo-sub">AI节气餐桌</div>
                </div>
            </div>
            <div class="profile-avatar">👤</div>
        </div>

        <!-- 节气卡片 -->
        <div class="solar-term-card">
            <div class="solar-date">2026年 · 6月21日 — 7月6日</div>
            <div class="solar-name">🌾 芒种</div>
            <div class="solar-tagline">“芒种不种，再种无用” · 宜清补、祛湿</div>
            <div class="solar-advice">
                <span class="icon">💡</span>
                <span>芒种时节湿热交加，饮食宜清淡，多吃绿豆、薏米、苦瓜、鸭肉，少食油腻辛辣。</span>
            </div>
        </div>

        <!-- 拍照识别区 -->
        <div class="section-title">
            <span class="dot"></span> AI 食材识别
        </div>
        <div class="scan-area" id="scanBtn" onclick="handleScan()">
            <div class="scan-icon-wrap">📸</div>
            <div class="scan-info">
                <h4>拍照识别食材</h4>
                <p>拍下你手边的食材，AI 告诉你适合做什么节气菜</p>
            </div>
            <div class="scan-arrow">→</div>
        </div>

        <!-- 今日推荐 -->
        <div class="section-title">
            <span class="dot"></span> 今日芒种推荐
        </div>
        <div class="recipe-list">
            <!-- 食谱1 -->
            <div class="recipe-card" onclick="showToast('已加入菜单：薏米冬瓜老鸭汤 🍲')">
                <div class="recipe-emoji">🍲</div>
                <div class="recipe-detail">
                    <div class="recipe-name">薏米冬瓜老鸭汤</div>
                    <div class="recipe-desc">清热祛湿、滋阴养胃，芒种必备汤品</div>
                    <div class="recipe-tags">
                        <span class="tag tag-season">应季</span>
                        <span class="tag tag-benefit">祛湿</span>
                        <span class="tag tag-easy">一锅炖</span>
                    </div>
                </div>
            </div>

            <!-- 食谱2 -->
            <div class="recipe-card" onclick="showToast('已加入菜单：苦瓜炒蛋 🥒')">
                <div class="recipe-emoji">🥒</div>
                <div class="recipe-detail">
                    <div class="recipe-name">苦瓜炒蛋</div>
                    <div class="recipe-desc">清心降火，简单快手，夏季餐桌常客</div>
                    <div class="recipe-tags">
                        <span class="tag tag-season">应季</span>
                        <span class="tag tag-benefit">降火</span>
                        <span class="tag tag-easy">5分钟</span>
                    </div>
                </div>
            </div>

            <!-- 食谱3 -->
            <div class="recipe-card" onclick="showToast('已加入菜单：绿豆百合粥 🥣')">
                <div class="recipe-emoji">🥣</div>
                <div class="recipe-detail">
                    <div class="recipe-name">绿豆百合粥</div>
                    <div class="recipe-desc">清甜解暑，早晚一碗，安稳度夏</div>
                    <div class="recipe-tags">
                        <span class="tag tag-season">应季</span>
                        <span class="tag tag-benefit">解暑</span>
                        <span class="tag tag-easy">电饭煲</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <span class="nav-icon">🏠</span>
                <span>首页</span>
                <span class="nav-dot"></span>
            </div>
            <div class="nav-item" onclick="showToast('发现更多节气食谱 🔍')">
                <span class="nav-icon">🔍</span>
                <span>发现</span>
            </div>
            <div class="nav-item" onclick="handleScan()">
                <span class="nav-icon">📸</span>
                <span>识别</span>
            </div>
            <div class="nav-item" onclick="showToast('我的菜篮子 🧺')">
                <span class="nav-icon">🧺</span>
                <span>菜篮</span>
            </div>
            <div class="nav-item" onclick="showToast('个人中心 👤')">
                <span class="nav-icon">👤</span>
                <span>我的</span>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0); background: rgba(0,0,0,0.8); color: white; padding: 14px 24px; border-radius: 30px; font-size: 14px; z-index: 999; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; white-space: nowrap;">
    </div>

    <script>
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.transform = 'translate(-50%,-50%) scale(1)';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.transform = 'translate(-50%,-50%) scale(0)';
            }, 1500);
        }

        function handleScan() {
            showToast('📸 正在打开相机...\n对准食材，AI 即刻识别');
        }

        // 模拟页面加载后的微动效
        document.querySelectorAll('.recipe-card').forEach((card, i) => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            setTimeout(() => {
                card.style.transition = 'all 0.5s ease';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100 * i);
        });

        console.log('🌿 不时不食 · AI节气餐桌');
        console.log('创意方案：结合传统二十四节气与AI图像识别');
        console.log('目标用户：20-35岁都市独居青年及双职工家庭');
        console.log('商业价值：食谱推荐 → 食材采购 → 厨房用品带货闭环');
        console.log('社会价值：弘扬非遗节气文化，改善国民亚健康状态');
    </script>
</body>
</html>
