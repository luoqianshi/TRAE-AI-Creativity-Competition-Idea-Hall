<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent · 工作台 - 萌新写作营</title>
<style>
:root {
  --primary: #FF7A00;
  --primary-light: #FF9D40;
  --primary-dark: #E06A00;
  --purple: #7C4DFF;
  --purple-light: #9D7AFF;
  --purple-dark: #5E35B1;
  --bg-darkest: #0f0f1a;
  --bg-dark: #1a1a2e;
  --bg-medium: #16213e;
  --bg-card: #1e1e36;
  --bg-input: #252540;
  --bg-hover: #2a2a45;
  --text-primary: #e8e8f0;
  --text-secondary: #a0a0b8;
  --text-muted: #6a6a80;
  --border: #2a2a40;
  --border-light: #3a3a55;
  --success: #4CAF50;
  --success-bg: rgba(76, 175, 80, 0.15);
  --danger: #EF5350;
  --danger-bg: rgba(239, 83, 80, 0.15);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  --shadow: 0 4px 16px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --sidebar-width: 320px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font);
  background: var(--bg-darkest);
  color: var(--text-primary);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== HEADER ===== */
.header {
  flex-shrink: 0;
  background: linear-gradient(135deg, #2d1b69 0%, #1a0a3e 40%, #16213e 100%);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 100;
  position: relative;
  overflow: hidden;
}
.header::before {
  content: '';
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 50%, rgba(124, 77, 255, 0.12) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 50%, rgba(255, 122, 0, 0.06) 0%, transparent 60%);
  pointer-events: none;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
  z-index: 1;
}
.header-logo {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--purple-light), #B388FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
}
.header-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 1;
}
.header-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  font-family: var(--font);
}
.header-btn:hover {
  background: rgba(255,255,255,0.1);
  color: var(--text-primary);
  border-color: var(--purple);
}
.header-btn.primary {
  background: var(--purple);
  border-color: var(--purple);
  color: #fff;
}
.header-btn.primary:hover {
  background: var(--purple-light);
  border-color: var(--purple-light);
}
.save-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  background: var(--bg-input);
}
.save-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse-dot 2s infinite;
}
.save-dot.saving { background: var(--primary); animation: blink-dot 0.5s infinite; }
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@keyframes blink-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

/* ===== MAIN LAYOUT ===== */
.main-container {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--bg-dark);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform var(--transition);
}
.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.notebook-select {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  outline: none;
  transition: border-color var(--transition);
}
.notebook-select:focus { border-color: var(--purple); }
.notebook-select option {
  background: var(--bg-dark);
  color: var(--text-primary);
}

.section-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.section-tab {
  padding: 6px 12px;
  border: 1px solid transparent;
  border-radius: 20px;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
  font-family: var(--font);
}
.section-tab:hover { color: var(--text-secondary); background: var(--bg-hover); }
.section-tab.active {
  background: rgba(124, 77, 255, 0.15);
  color: var(--purple-light);
  border-color: rgba(124, 77, 255, 0.3);
}

.section-content {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 10px 12px;
}
.section-textarea {
  flex: 1;
  width: 100%;
  padding: 12px;
  background: var(--bg-input);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font);
  line-height: 1.7;
  resize: none;
  outline: none;
  transition: border-color var(--transition);
}
.section-textarea:focus { border-color: var(--purple); }
.section-textarea::placeholder { color: var(--text-muted); }
.section-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== CHAT AREA ===== */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg-medium);
}

/* ===== MODEL SELECTOR ===== */
.model-bar {
  flex-shrink: 0;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-dark);
}
.model-bar-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.model-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.model-card {
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-card);
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
}
.model-card:hover {
  border-color: var(--border-light);
  background: var(--bg-hover);
}
.model-card.selected {
  border-color: var(--purple);
  background: rgba(124, 77, 255, 0.08);
  box-shadow: 0 0 16px rgba(124, 77, 255, 0.15);
}
.model-card.selected::after {
  content: '✓';
  position: absolute;
  top: 8px; right: 10px;
  font-size: 12px;
  color: var(--purple-light);
  font-weight: 700;
}
.model-card-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.model-card-tag {
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg-input);
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
  margin-bottom: 6px;
}
.model-card-desc {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ===== CHAT HISTORY ===== */
.chat-history {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chat-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  text-align: center;
  gap: 12px;
}
.chat-empty-icon {
  font-size: 48px;
  opacity: 0.4;
}
.chat-empty-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-secondary);
}
.chat-empty-desc {
  font-size: 13px;
  max-width: 420px;
  line-height: 1.6;
}

/* Messages */
.message {
  display: flex;
  gap: 12px;
  animation: msg-in 0.3s ease-out;
  max-width: 100%;
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.message.user { flex-direction: row-reverse; }
.message-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
}
.message.user .message-avatar { background: var(--primary); color: #fff; }
.message.agent .message-avatar { background: var(--purple); color: #fff; }
.message-bubble {
  max-width: 72%;
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user .message-bubble {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border-bottom-right-radius: var(--radius-sm);
}
.message.agent .message-bubble {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border-light);
  border-bottom-left-radius: var(--radius-sm);
}
.message-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity var(--transition);
}
.message:hover .message-actions { opacity: 1; }
.message.user .message-actions { justify-content: flex-end; }
.msg-action-btn {
  padding: 3px 8px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font);
}
.msg-action-btn:hover { color: var(--text-primary); border-color: var(--purple); }

/* Typing indicator */
.typing-indicator {
  display: flex;
  gap: 12px;
  padding: 8px 0;
}
.typing-dots {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 14px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: typing-bounce 1.4s infinite ease-in-out;
}
.typing-dot:nth-child(1) { animation-delay: 0s; }
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ===== CHAT INPUT ===== */
.chat-input-area {
  flex-shrink: 0;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg-dark);
}
.chat-input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.chat-input {
  flex: 1;
  padding: 12px 16px;
  background: var(--bg-input);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font);
  line-height: 1.5;
  resize: none;
  outline: none;
  min-height: 44px;
  max-height: 140px;
  transition: border-color var(--transition);
}
.chat-input:focus { border-color: var(--purple); }
.chat-input::placeholder { color: var(--text-muted); }
.send-btn {
  width: 44px; height: 44px;
  border: none;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--purple), var(--purple-dark));
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: all var(--transition);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.send-btn:hover {
  background: linear-gradient(135deg, var(--purple-light), var(--purple));
  box-shadow: 0 4px 14px rgba(124, 77, 255, 0.35);
}
.send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  box-shadow: none;
}
.chat-hint {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--text-muted);
}
.chat-hint kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 2px 6px;
  background: var(--bg-input);
  border: 1px solid var(--border-light);
  border-radius: 4px;
  font-size: 10px;
  font-family: var(--font);
}

/* ===== DATA INDICATOR ===== */
.data-indicator {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--bg-darkest);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-muted);
}
.data-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.data-badge.good { background: var(--success-bg); color: var(--success); }
.data-badge.warn { background: var(--danger-bg); color: var(--danger); }

/* ===== TOAST ===== */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  color: #fff;
  animation: toast-in 0.3s ease-out, toast-out 0.3s ease-in 2.5s forwards;
  box-shadow: var(--shadow-lg);
  max-width: 350px;
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--purple); }
@keyframes toast-in { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toast-out { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 5000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fade-in 0.2s ease-out;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-dark);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-xl);
  padding: 24px;
  max-width: 480px;
  width: 90%;
  box-shadow: var(--shadow-lg);
}
.modal-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 8px;
}
.modal-desc {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
  line-height: 1.6;
}
.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}
.modal-btn {
  padding: 8px 20px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius-sm);
  font-size: 13px;
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font);
  background: var(--bg-input);
  color: var(--text-primary);
}
.modal-btn:hover { border-color: var(--purple); }
.modal-btn.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}
.modal-btn.danger:hover { background: #C62828; }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .model-cards { grid-template-columns: repeat(2, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 200; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
  .sidebar-overlay { display: none; }
  .sidebar-overlay.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
  .mobile-menu-btn {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    width: 36px; height: 36px;
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.04);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 18px;
  }
  .message-bubble { max-width: 85%; }
}

@media (max-width: 600px) {
  .model-cards { grid-template-columns: 1fr 1fr; gap: 6px; }
  .model-card { padding: 10px; }
  .model-card-name { font-size: 13px; }
  .model-card-desc { font-size: 10px; }
  .chat-history { padding: 10px 12px; }
  .chat-input-area { padding: 10px 12px; }
  .header { padding: 8px 12px; }
  .header-logo { font-size: 15px; }
  .header-btn { padding: 5px 10px; font-size: 11px; }
  .sidebar { width: 100%; max-width: 320px; }
}

.mobile-menu-btn { display: none; }
.hidden-input { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <button class="mobile-menu-btn" onclick="toggleSidebar()" title="菜单">☰</button>
    <span class="header-logo">🧠 Agent · 工作台</span>
    <span class="header-subtitle">萌新写作营</span>
  </div>
  <div class="header-right">
    <span class="save-indicator" id="saveIndicator">
      <span class="save-dot" id="saveDot"></span>
      <span id="saveText">已保存</span>
    </span>
    <button class="header-btn" onclick="exportData()" title="导出数据">📥 导出</button>
    <button class="header-btn" onclick="triggerImport()" title="导入数据">📤 导入</button>
    <input type="file" id="importFileInput" class="hidden-input" accept=".json" onchange="importData(event)">
    <button class="header-btn" onclick="clearHistory()" title="清除当前对话">🗑️ 清除对话</button>
    <button class="header-btn" onclick="goBack()" title="返回主站">← 返回主站</button>
  </div>
</header>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- MAIN CONTAINER -->
<div class="main-container">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">📓 笔记本</div>
      <select class="notebook-select" id="notebookSelect" onchange="switchNotebook()">
        <option value="">-- 选择笔记本 --</option>
      </select>
    </div>
    <div class="section-tabs" id="sectionTabs">
      <button class="section-tab active" data-section="outline" onclick="switchSection('outline')">📋 大纲</button>
      <button class="section-tab" data-section="worldview" onclick="switchSection('worldview')">🌍 世界观</button>
      <button class="section-tab" data-section="characters" onclick="switchSection('characters')">👤 人物</button>
      <button class="section-tab" data-section="notes" onclick="switchSection('notes')">📝 笔记</button>
      <button class="section-tab" data-section="content" onclick="switchSection('content')">📖 正文</button>
    </div>
    <div class="section-content">
      <div class="section-label" id="sectionLabel">📋 大纲</div>
      <textarea class="section-textarea" id="sectionTextarea"
        placeholder="在此编辑内容...&#10;&#10;自动保存已启用，输入后 0.5 秒自动保存到本地存储。"></textarea>
    </div>
  </aside>

  <!-- CHAT AREA -->
  <div class="chat-area">
    <!-- MODEL SELECTOR -->
    <div class="model-bar">
      <div class="model-bar-label">选择 AI 导师模型</div>
      <div class="model-cards" id="modelCards">
        <div class="model-card selected" data-model="deepseek" onclick="selectModel('deepseek', this)">
          <div class="model-card-name">🧠 推理导师</div>
          <div class="model-card-desc">擅长搭建框架骨架、世界观设定、逻辑推演</div>
        </div>
        <div class="model-card" data-model="kimi" onclick="selectModel('kimi', this)">
          <div class="model-card-name">📐 框架导师</div>
          <div class="model-card-desc">擅长查阅上下文资料、整理文献、甄别数据</div>
        </div>
        <div class="model-card" data-model="gpt4o" onclick="selectModel('gpt4o', this)">
          <div class="model-card-name">✍️ 文案导师</div>
          <div class="model-card-desc">擅长文字润色、对话生成、情感渲染</div>
        </div>
        <div class="model-card" data-model="claude" onclick="selectModel('claude', this)">
          <div class="model-card-name">🔍 分析导师</div>
          <div class="model-card-desc">擅长深度分析、拆解技巧、毒点检测</div>

    </div>

    <!-- CHAT HISTORY -->
    <div class="chat-history" id="chatHistory">
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty-icon">💬</div>
        <div class="chat-empty-title">欢迎使用 AI Agent 工作台</div>
        <div class="chat-empty-desc">选择一个 AI 导师模型，然后输入你的写作问题。各个导师各有所长，可根据需求随时切换。你的笔记本内容已自动加载，导师可以结合上下文提供建议。</div>
      </div>
    </div>

    <!-- CHAT INPUT -->
    <div class="chat-input-area">
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" rows="1"
          placeholder="输入你的写作问题，AI 导师将为你解答..."
          onkeydown="handleChatKeydown(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送 (Enter)">➤</button>
      </div>
      <div class="chat-hint">
        <span>按 <kbd>Enter</kbd> 发送</span>
        <span>按 <kbd>Shift + Enter</kbd> 换行</span>
        <span style="margin-left:auto;">消息仅保存在本地浏览器</span>
      </div>
    </div>
  </div>
</div>

<!-- DATA INDICATOR -->
<div class="data-indicator" id="dataIndicator">
  数据状态加载中...
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- MODAL (hidden by default) -->
<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-desc" id="modalDesc"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
// ===== Cross-frame navigation =====
function goBack() {
  if (window.parent !== window) {
    window.parent.postMessage({ action: 'closeWorkbench' }, '*');
  } else {
    window.location.href = 'mengxin-writer-camp.html';
  }
}
(function() {
'use strict';

// ===== STORAGE KEYS =====
const KEYS = {
  LOGGED_IN: 'mxcw_logged_in',
  NOTEBOOKS: 'mxcw_notebooks',
  AGENT_CREATED: 'mxcw_agent_created',
  CHAT_HISTORY: 'mxcw_agent_chat_history',
  CHAT_INPUT_DRAFT: 'mxcw_agent_chat_draft',
  SELECTED_MODEL: 'mxcw_agent_selected_model',
  SELECTED_NOTEBOOK: 'mxcw_agent_selected_notebook',
  ACTIVE_SECTION: 'mxcw_agent_active_section'
};

// ===== STATE =====
let state = {
  loggedIn: false,
  notebooks: [],
  agentCreated: false,
  selectedNotebookId: null,
  activeSection: 'outline',
  selectedModel: 'deepseek',
  chatHistory: [],
  isSending: false,
  saveTimer: null
};

// ===== DOM REFS =====
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const dom = {
  sidebar: $('#sidebar'),
  sidebarOverlay: $('#sidebarOverlay'),
  notebookSelect: $('#notebookSelect'),
  sectionTabs: $('#sectionTabs'),
  sectionLabel: $('#sectionLabel'),
  sectionTextarea: $('#sectionTextarea'),
  modelCards: $('#modelCards'),
  chatHistory: $('#chatHistory'),
  chatEmpty: $('#chatEmpty'),
  chatInput: $('#chatInput'),
  sendBtn: $('#sendBtn'),
  saveDot: $('#saveDot'),
  saveText: $('#saveText'),
  dataIndicator: $('#dataIndicator'),
  toastContainer: $('#toastContainer'),
  modalOverlay: $('#modalOverlay'),
  modalTitle: $('#modalTitle'),
  modalDesc: $('#modalDesc'),
  modalActions: $('#modalActions'),
  importFileInput: $('#importFileInput')
};

// ===== INIT =====
function init() {
  loadFromStorage();
  renderNotebooks();
  renderModelCards();
  renderChatHistory();
  renderDataIndicator();
  updateSaveStatus('saved');
  restoreChatDraft();
  if (state.selectedNotebookId) {
    loadSectionContent();
    updateSectionLabel();
  }
}

function loadFromStorage() {
  try {
    state.loggedIn = localStorage.getItem(KEYS.LOGGED_IN) === 'true';
    const nbRaw = localStorage.getItem(KEYS.NOTEBOOKS);
    state.notebooks = nbRaw ? JSON.parse(nbRaw) : [];
    if (!Array.isArray(state.notebooks)) state.notebooks = [];
    state.agentCreated = localStorage.getItem(KEYS.AGENT_CREATED) === 'true';
    const savedNotebook = localStorage.getItem(KEYS.SELECTED_NOTEBOOK);
    state.selectedNotebookId = savedNotebook || (state.notebooks.length > 0 ? state.notebooks[0].id : null);
    state.activeSection = localStorage.getItem(KEYS.ACTIVE_SECTION) || 'outline';
    state.selectedModel = localStorage.getItem(KEYS.SELECTED_MODEL) || 'deepseek';
    const chatRaw = localStorage.getItem(KEYS.CHAT_HISTORY);
    state.chatHistory = chatRaw ? JSON.parse(chatRaw) : [];
    if (!Array.isArray(state.chatHistory)) state.chatHistory = [];
  } catch(e) {
    console.error('Failed to load from localStorage:', e);
    state.notebooks = [];
    state.chatHistory = [];
  }
}

function saveToStorage(key, value) {
  try {
    if (typeof value === 'string') {
      localStorage.setItem(key, value);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  } catch(e) {
    showToast('存储空间不足，请清理数据', 'error');
    console.error('Failed to save to localStorage:', e);
  }
}

// ===== NOTEBOOK RENDERING =====
function renderNotebooks() {
  const sel = dom.notebookSelect;
  sel.innerHTML = '<option value="">-- 选择笔记本 --</option>';
  state.notebooks.forEach(nb => {
    const opt = document.createElement('option');
    opt.value = nb.id;
    opt.textContent = nb.title || nb.name || ('笔记本 ' + nb.id);
    if (nb.id === state.selectedNotebookId) opt.selected = true;
    sel.appendChild(opt);
  });
  updateSectionLabel();
}

function switchNotebook() {
  state.selectedNotebookId = dom.notebookSelect.value || null;
  saveToStorage(KEYS.SELECTED_NOTEBOOK, state.selectedNotebookId || '');
  loadSectionContent();
  updateSectionLabel();
}

function updateSectionLabel() {
  const labels = { outline: '📋 大纲', worldview: '🌍 世界观', characters: '👤 人物', notes: '📝 笔记', content: '📖 正文' };
  dom.sectionLabel.textContent = labels[state.activeSection] || state.activeSection;
  // Also update tab active state
  $$('.section-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.section === state.activeSection);
  });
}

// ===== SECTION TABS =====
function switchSection(section) {
  state.activeSection = section;
  saveToStorage(KEYS.ACTIVE_SECTION, section);
  updateSectionLabel();
  loadSectionContent();
}

function loadSectionContent() {
  if (!state.selectedNotebookId) {
    dom.sectionTextarea.value = '';
    dom.sectionTextarea.placeholder = '请先选择一个笔记本';
    return;
  }
  // Find the notebook
  const nb = state.notebooks.find(n => n.id === state.selectedNotebookId);
  if (!nb) {
    dom.sectionTextarea.value = '';
    dom.sectionTextarea.placeholder = '笔记本未找到';
    return;
  }
  // Load content from notebook's sections
  const sections = nb.sections || {};
  const content = sections[state.activeSection] || '';
  dom.sectionTextarea.value = content;
  dom.sectionTextarea.placeholder = '在此编辑内容...\n\n自动保存已启用，输入后 0.5 秒自动保存到本地存储。';
}

function saveSectionContent() {
  if (!state.selectedNotebookId) return;
  const nb = state.notebooks.find(n => n.id === state.selectedNotebookId);
  if (!nb) return;
  if (!nb.sections) nb.sections = {};
  nb.sections[state.activeSection] = dom.sectionTextarea.value;
  saveToStorage(KEYS.NOTEBOOKS, state.notebooks);
  updateSaveStatus('saving');
}

// Debounced auto-save
dom.sectionTextarea.addEventListener('input', () => {
  updateSaveStatus('unsaved');
  if (state.saveTimer) clearTimeout(state.saveTimer);
  state.saveTimer = setTimeout(() => {
    saveSectionContent();
  }, 500);
});

// ===== MODEL SELECTION =====
function renderModelCards() {
  $$('.model-card').forEach(card => {
    card.classList.toggle('selected', card.dataset.model === state.selectedModel);
  });
}

function selectModel(model, el) {
  state.selectedModel = model;
  saveToStorage(KEYS.SELECTED_MODEL, model);
  $$('.model-card').forEach(card => card.classList.remove('selected'));
  el.classList.add('selected');
}

// ===== CHAT HISTORY =====
function renderChatHistory() {
  dom.chatHistory.innerHTML = '';
  if (state.chatHistory.length === 0) {
    dom.chatHistory.innerHTML = `
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty-icon">💬</div>
        <div class="chat-empty-title">欢迎使用 AI Agent 工作台</div>
        <div class="chat-empty-desc">选择一个 AI 导师模型，然后输入你的写作问题。各个导师各有所长，可根据需求随时切换。你的笔记本内容已自动加载，导师可以结合上下文提供建议。</div>
      </div>`;
  } else {
    state.chatHistory.forEach((msg, idx) => {
      appendMessageToDOM(msg, idx);
    });
    scrollChatToBottom();
  }
}

function appendMessageToDOM(msg, idx) {
  const emptyEl = dom.chatHistory.querySelector('.chat-empty');
  if (emptyEl) emptyEl.remove();
  const div = document.createElement('div');
  div.className = 'message ' + msg.role;
  div.innerHTML = `
    <div class="message-avatar">${msg.role === 'user' ? '👤' : '🤖'}</div>
    <div>
      <div class="message-bubble">${escapeHtml(msg.content)}</div>
      ${msg.role === 'user' ? '' : `<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${escapeHtml(msg.modelName || 'AI 导师')} · ${escapeHtml(msg.timestamp || '')}</div>`}
      <div class="message-actions">
        <button class="msg-action-btn" onclick="copyMessage(${idx})">📋 复制</button>
        <button class="msg-action-btn" onclick="deleteMessage(${idx})">🗑️ 删除</button>
      </div>
    </div>`;
  dom.chatHistory.appendChild(div);
}

function scrollChatToBottom() {
  dom.chatHistory.scrollTop = dom.chatHistory.scrollHeight;
}

function addMessage(role, content, modelName) {
  const msg = {
    role: role,
    content: content,
    modelName: modelName || '',
    timestamp: new Date().toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' })
  };
  state.chatHistory.push(msg);
  saveToStorage(KEYS.CHAT_HISTORY, state.chatHistory);
  appendMessageToDOM(msg, state.chatHistory.length - 1);
  scrollChatToBottom();
}

// ===== SEND MESSAGE =====
function sendMessage() {
  const input = dom.chatInput;
  const text = input.value.trim();
  if (!text || state.isSending) return;

  state.isSending = true;
  dom.sendBtn.disabled = true;
  input.value = '';
  autoResizeTextarea(input);
  saveChatDraft();

  // Add user message
  addMessage('user', text);

  // Get model info
  const modelInfo = getModelInfo(state.selectedModel);

  // Show typing indicator
  showTypingIndicator();

  // Get notebook context for the agent
  const context = getNotebookContext();

  // Simulate AI response (in production, this would call an API)
  simulateAIResponse(text, modelInfo, context);
}

function getModelInfo(modelKey) {
  const models = {
    deepseek: { name: '🧠 推理导师', tag: '推理导师', specialty: '框架骨架、世界观设定、逻辑推演' },
    kimi: { name: '📐 框架导师', tag: '框架导师', specialty: '查阅上下文资料、整理文献、甄别数据' },
    gpt4o: { name: '✍️ 文案导师', tag: '文案导师', specialty: '文字润色、对话生成、情感渲染' },
    claude: { name: '🔍 分析导师', tag: '分析导师', specialty: '深度分析、拆解技巧、毒点检测' }
  };
  return models[modelKey] || models.deepseek;
}

function getNotebookContext() {
  if (!state.selectedNotebookId) return null;
  const nb = state.notebooks.find(n => n.id === state.selectedNotebookId);
  if (!nb) return null;
  const sections = nb.sections || {};
  return {
    title: nb.title || nb.name || '未命名',
    outline: sections.outline || '',
    worldview: sections.worldview || '',
    characters: sections.characters || '',
    notes: sections.notes || '',
    content: sections.content || ''
  };
}

function showTypingIndicator() {
  const emptyEl = dom.chatHistory.querySelector('.chat-empty');
  if (emptyEl) emptyEl.remove();
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="message-avatar" style="background:var(--purple);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;">🤖</div>
    <div class="typing-dots">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>`;
  dom.chatHistory.appendChild(div);
  scrollChatToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function simulateAIResponse(userText, modelInfo, context) {
  // Simulate network delay
  const delay = 800 + Math.random() * 1500;
  setTimeout(() => {
    removeTypingIndicator();
    const response = generateSimulatedResponse(userText, modelInfo, context);
    addMessage('agent', response, modelInfo.name);
    state.isSending = false;
    dom.sendBtn.disabled = false;
    dom.chatInput.focus();
  }, delay);
}

function generateSimulatedResponse(userText, modelInfo, context) {
  const responses = {
    deepseek: [
      '让我从整体框架来分析你的问题。首先，我们需要明确故事的核心冲突和主线脉络。建议从以下角度梳理：\n\n**1. 主线梳理**\n明确主角目标 → 设置阻碍 → 设计转折 → 规划高潮 → 落点收束\n\n**2. 世界观锚点**\n你的设定中，最核心的世界观规则是什么？这条规则是否自洽？\n\n**3. 逻辑链条**\n检查每一个情节转折是否有足够的铺垫和动机支撑。前后因果需要环环相扣。',
      '从逻辑推演的角度看，你的设定存在一些可以优化的地方：\n\n**核心矛盾**：主角的动机是否足够强？读者需要感受到"不得不"的驱动力。\n\n**框架建议**：采用三幕式结构来重新组织你的大纲：\n- 第一幕：建立日常 + 打破日常（激励事件）\n- 第二幕：升级冲突 + 至暗时刻\n- 第三幕：最终决战 + 新的平衡'
    ],
    kimi: [
      '我查阅了相关的写作资料和经典案例，为你整理了以下参考资料：\n\n**参考作品分析**：\n- 《XXX》的叙事结构值得借鉴，其使用了双线叙事\n- 同类型作品中，角色弧光的设计可以参考《YYY》\n\n**数据支撑**：\n该类题材在近年的读者偏好中，倾向于以下元素：强代入感、快节奏、反转密集。建议在前三章建立足够的悬念钩子。',
      '根据我整理的上文内容，我注意到以下几个要点：\n\n**文献整合**：\n你之前的笔记中提到了三个关键设定点，它们之间的关联可以这样优化...\n\n**数据甄别**：\n你引用的某条资料可能存在问题，让我们重新核实一下源头。'
    ],
    gpt4o: [
      '让我为你的文字做一些润色：\n\n**原文**：他走在街上，感觉很冷。\n**润色后**：寒风如刀片般划过他的脸颊，他将双手深深插进大衣口袋，呼出的白雾在昏黄路灯下飘散。\n\n**优化要点**：\n1. 具象化感受，用细节代替抽象描述\n2. 调动五感：视觉、听觉、触觉\n3. 加入环境互动，让人物与场景产生关联\n4. 控制节奏，短句制造紧张感，长句渲染氛围',
      '对话场景的情感渲染可以这样优化：\n\n**情感层次**：\n1. 表层对话 — 人物说了什么\n2. 潜台词 — 人物真正想表达什么\n3. 肢体语言 — 微表情和动作出卖真实情绪\n\n建议在每次对话后，加入一个"未说出口"的内心独白片段，让读者感受到情感的张力。'
    ],
    claude: [
      '我来对你的这段内容做一个深度分析：\n\n**结构拆解**：\n1. 开篇的钩子力度：★★★☆☆（中等偏上，但可以在第二句加入更强的悬念）\n2. 信息节奏：前段密集，中段略有拖沓，后段节奏回升\n3. 角色立体度：主角的个性在第3段才初步展现，建议提前\n\n**毒点检测**：\n- ⚠️ 第5段存在"说教感"，建议改为角色通过行动展现观点\n- ⚠️ 女主角的工具人倾向：她目前只服务于推动剧情，缺乏独立人格',
      '让我拆解一下你的写作技巧运用情况：\n\n**已掌握的技巧**：\n✓ 场景氛围营造\n✓ 对话的节奏控制\n\n**待提升的技巧**：\n✗ 视角一致性（第2段和第4段有轻微视角跳转）\n✗ 伏笔密度（目前仅埋下1处伏笔，建议增加到3-5处）\n\n**改进方案**：\n在后三章中，可以尝试"草蛇灰线"的手法...'
    ]
  };

  const modelResponses = responses[state.selectedModel] || responses.deepseek;
  const baseResponse = modelResponses[Math.floor(Math.random() * modelResponses.length)];

  let preamble = '';
  if (context && context.outline) {
    preamble = `（已参考你的笔记本「${context.title}」中的大纲内容）\n\n`;
  } else if (context) {
    preamble = `（已参考你的笔记本「${context.title}」的内容）\n\n`;
  }

  return preamble + baseResponse + '\n\n---\n💡 提示：以上为模拟回复。在实际使用中，此处将调用 AI API 获得真实回复。你可以切换上方的导师模型来获得不同风格的指导。';
}

// ===== CHAT INPUT =====
function handleChatKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResizeTextarea(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
}

dom.chatInput.addEventListener('input', () => {
  autoResizeTextarea(dom.chatInput);
  saveChatDraft();
});

function restoreChatDraft() {
  const draft = localStorage.getItem(KEYS.CHAT_INPUT_DRAFT);
  if (draft) {
    dom.chatInput.value = draft;
    autoResizeTextarea(dom.chatInput);
  }
}

function saveChatDraft() {
  localStorage.setItem(KEYS.CHAT_INPUT_DRAFT, dom.chatInput.value);
}

// ===== SAVE STATUS =====
function updateSaveStatus(status) {
  const dot = dom.saveDot;
  const text = dom.saveText;
  dot.classList.remove('saving');
  switch(status) {
    case 'saving':
      dot.classList.add('saving');
      text.textContent = '保存中...';
      break;
    case 'unsaved':
      text.textContent = '未保存';
      break;
    case 'saved':
    default:
      text.textContent = '已保存';
      break;
  }
  // Auto-reset to saved after a moment
  if (status === 'saving') {
    setTimeout(() => {
      if (text.textContent === '保存中...') {
        dot.classList.remove('saving');
        text.textContent = '已保存';
      }
    }, 1000);
  }
}

// ===== DATA INDICATOR =====
function renderDataIndicator() {
  const parts = [];
  if (state.loggedIn) {
    parts.push('<span class="data-badge good">✅ 已登录</span>');
  } else {
    parts.push('<span class="data-badge warn">⚠ 未登录</span>');
  }
  parts.push(`<span class="data-badge good">📓 ${state.notebooks.length} 个笔记本</span>`);
  if (state.agentCreated) {
    parts.push('<span class="data-badge good">🤖 Agent 已创建</span>');
  }
  parts.push(`<span class="data-badge good">💬 ${state.chatHistory.length} 条对话</span>`);
  if (state.selectedNotebookId) {
    const nb = state.notebooks.find(n => n.id === state.selectedNotebookId);
    if (nb) {
      parts.push(`<span style="color:var(--purple-light);font-size:11px;">当前: ${escapeHtml(nb.title || nb.name || '未命名')}</span>`);
    }
  }
  dom.dataIndicator.innerHTML = parts.join(' ');
}

// ===== IMPORT / EXPORT =====
function exportData() {
  const data = {
    version: '1.0',
    exportedAt: new Date().toISOString(),
    loggedIn: state.loggedIn,
    notebooks: state.notebooks,
    agentCreated: state.agentCreated,
    chatHistory: state.chatHistory,
    selectedModel: state.selectedModel,
    selectedNotebookId: state.selectedNotebookId,
    activeSection: state.activeSection
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mengxin-writer-workbench-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('数据导出成功', 'success');
}

function triggerImport() {
  dom.importFileInput.click();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      // Validate
      if (!data.version) throw new Error('无效的数据格式');
      // Show confirmation
      showConfirmModal(
        '确认导入数据',
        `即将导入 ${data.notebooks?.length || 0} 个笔记本、${data.chatHistory?.length || 0} 条对话记录。当前数据将被覆盖，确定继续吗？`,
        () => {
          // Apply import
          if (data.loggedIn !== undefined) localStorage.setItem(KEYS.LOGGED_IN, String(data.loggedIn));
          if (data.notebooks) localStorage.setItem(KEYS.NOTEBOOKS, JSON.stringify(data.notebooks));
          if (data.agentCreated !== undefined) localStorage.setItem(KEYS.AGENT_CREATED, String(data.agentCreated));
          if (data.chatHistory) localStorage.setItem(KEYS.CHAT_HISTORY, JSON.stringify(data.chatHistory));
          if (data.selectedModel) localStorage.setItem(KEYS.SELECTED_MODEL, data.selectedModel);
          if (data.selectedNotebookId) localStorage.setItem(KEYS.SELECTED_NOTEBOOK, data.selectedNotebookId);
          if (data.activeSection) localStorage.setItem(KEYS.ACTIVE_SECTION, data.activeSection);
          // Reload state
          loadFromStorage();
          renderNotebooks();
          renderModelCards();
          renderChatHistory();
          renderDataIndicator();
          loadSectionContent();
          updateSectionLabel();
          updateSaveStatus('saved');
          showToast('数据导入成功！页面已刷新', 'success');
        }
      );
    } catch(err) {
      showToast('导入失败：文件格式不正确', 'error');
      console.error('Import error:', err);
    }
  };
  reader.readAsText(file);
  // Reset input
  event.target.value = '';
}

// ===== CLEAR HISTORY =====
function clearHistory() {
  showConfirmModal(
    '清除对话记录',
    '确定要清除当前所有的对话记录吗？此操作不可撤销。笔记本内容不会受影响。',
    () => {
      state.chatHistory = [];
      saveToStorage(KEYS.CHAT_HISTORY, []);
      renderChatHistory();
      renderDataIndicator();
      showToast('对话记录已清除', 'info');
    }
  );
}

// ===== MESSAGE ACTIONS =====
window.copyMessage = function(idx) {
  const msg = state.chatHistory[idx];
  if (!msg) return;
  navigator.clipboard.writeText(msg.content).then(() => {
    showToast('已复制到剪贴板', 'success');
  }).catch(() => {
    showToast('复制失败', 'error');
  });
};

window.deleteMessage = function(idx) {
  if (idx < 0 || idx >= state.chatHistory.length) return;
  state.chatHistory.splice(idx, 1);
  saveToStorage(KEYS.CHAT_HISTORY, state.chatHistory);
  renderChatHistory();
  renderDataIndicator();
  showToast('消息已删除', 'info');
};

// ===== TOAST =====
function showToast(message, type) {
  type = type || 'info';
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = message;
  dom.toastContainer.appendChild(toast);
  setTimeout(() => {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 3000);
}

// ===== MODAL =====
function showConfirmModal(title, desc, onConfirm) {
  dom.modalTitle.textContent = title;
  dom.modalDesc.textContent = desc;
  dom.modalActions.innerHTML = `
    <button class="modal-btn" onclick="closeModal()">取消</button>
    <button class="modal-btn danger" id="modalConfirmBtn">确认</button>`;
  dom.modalOverlay.style.display = 'flex';
  document.getElementById('modalConfirmBtn').addEventListener('click', () => {
    closeModal();
    if (onConfirm) onConfirm();
  });
}

window.closeModal = function() {
  dom.modalOverlay.style.display = 'none';
};

// Close modal on overlay click
dom.modalOverlay.addEventListener('click', function(e) {
  if (e.target === dom.modalOverlay) closeModal();
});

// ===== SIDEBAR TOGGLE (mobile) =====
window.toggleSidebar = function() {
  dom.sidebar.classList.toggle('open');
  dom.sidebarOverlay.classList.toggle('open');
};

// ===== KEYBOARD SHORTCUTS =====
document.addEventListener('keydown', function(e) {
  // Escape to close sidebar on mobile
  if (e.key === 'Escape') {
    if (dom.sidebar.classList.contains('open')) {
      toggleSidebar();
    }
    if (dom.modalOverlay.style.display === 'flex') {
      closeModal();
    }
  }
});

// ===== UTILS =====
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

// ===== AUTO-SAVE PERIODIC =====
setInterval(() => {
  if (state.selectedNotebookId && dom.sectionTextarea.value !== '') {
    const nb = state.notebooks.find(n => n.id === state.selectedNotebookId);
    if (nb) {
      if (!nb.sections) nb.sections = {};
      if (nb.sections[state.activeSection] !== dom.sectionTextarea.value) {
        nb.sections[state.activeSection] = dom.sectionTextarea.value;
        saveToStorage(KEYS.NOTEBOOKS, state.notebooks);
      }
    }
  }
}, 5000);

// ===== INIT =====
init();

// Make functions globally accessible
window.sendMessage = sendMessage;
window.selectModel = selectModel;
window.switchNotebook = switchNotebook;
window.switchSection = switchSection;
window.handleChatKeydown = handleChatKeydown;
window.exportData = exportData;
window.triggerImport = triggerImport;
window.importData = importData;
window.clearHistory = clearHistory;

console.log('🧠 AI Agent 工作台已就绪');
console.log('  登录状态:', state.loggedIn ? '已登录' : '未登录');
console.log('  笔记本数量:', state.notebooks.length);
console.log('  对话记录:', state.chatHistory.length);
console.log('  当前模型:', state.selectedModel);
console.log('  当前笔记本:', state.selectedNotebookId || '未选择');

})();
</script>
</body>
