le:"大模型选择建议",content:["Claude：适合复杂的页面布局和多步骤交互，理解需求最准确，做完整功能模块时首选。","GPT-4：适合数据密集型页面（如表格、报表、仪表盘），代码生成速度快。","通义千问 / 文心一言：适合中文场景的原型，对国内业务术语理解更好，适合快速出第一版。","DeepSeek / Kimi：适合小修小补和快速迭代，修改响应快，适合调样式、改文案。","建议：复杂模块用 Claude/GPT-4，日常调整用 DeepSeek/Kimi，中文业务场景优先用通义千问。"]},{title:"做完原型后：什么时候切设计图",content:["原型验证通过、需求基本确定后，再进入设计阶段。","如果原型改动还很大（如页面结构经常变），先不要出设计图，否则设计白做。","产品版本打 tag 后（如 v0.5-orders），可以拿着原型给设计团队做 UI 设计。","设计完成后，可以让 AI 按设计图调整 CSS 样式和配色，不需要重写逻辑。"]},{title:"如何描述页面间的联动需求",content:['列表页点"查看"跳到详情页：告诉 AI "列表页每行有个查看按钮，点击后跳到详情页，带上当前行的 id"。','搜索条件跨页保持：告诉 AI "在首页搜了关键词，跳到搜索结果页时要保留这个关键词"。','不同角色的页面差异：告诉 AI "管理员能看到删除按钮，普通用户看不到，帮我模拟两种角色的页面"。','页面跳转后的反馈：告诉 AI "提交表单成功后跳回列表页，并在顶部显示成功提示"。']},{title:"快速生成变体页面",content:['已有订单详情页，需要订单编辑页？直接说"基于详情页，做一个编辑页，表单字段可修改"。','已有列表页，需要审批页？说"基于订单列表，去掉搜索和新增按钮，增加审批通过/驳回按钮"。','已有后台管理页，需要移动端页？说"把当前页面改成移动端适配，单列布局，底部固定操作栏"。']},{title:"如何给 AI 看竞品参考",content:["截取竞品的完整页面截图，用箭头标注你想参考的交互点。",'说明具体要参考什么："参考飞书审批的审批流组件，不要参考它的配色"。',"也可以发竞品的产品文档链接，让 AI 读取后提取交互模式。",'不要只发一张图，配文字说明："参考这个页面的筛选区域布局，改为左右结构"。']},{title:"Mock 数据的高级用法",content:["模拟不同状态：如订单有 5 种状态（待付款、已付款、已发货、已完成、已取消），让 AI 在 mock 数据中每种状态生成 2-3 条数据。","模拟分页：让 AI 生成 50+ 条数据，测试分页和滚动加载效果。","模拟空态：让 AI 提供空数据场景，测试页面无数据时的展示。","模拟错误态：让 AI 偶尔返回错误，测试错误提示和重试机制。"]},{title:"多人协作建议",content:["不要多人同时在一个页面上修改，按页面分配负责人。","每个人在自己的分支上开发，完成后合并到 main。","需要共享某个模块时，先让 AI 把公共组件提取到 components/ 下，再同步给其他人。","设计稿和原型版本通过 tag 名称对齐（如 v0.3-orders 对应设计稿 Orders-v3）。"]},{title:"从原型到开发交接",content:["原型稳定后，让 AI 生成一份开发文档（docs/DEV.md），包含：页面清单、数据结构、API 接口定义、状态管理说明。","导出 mock 数据给后端作为接口参考。","原型中的 services/ 层可以作为后端接口的契约，后端按 service 函数的签名来实现 API。","把 tag 标记的稳定版本给开发团队，不要在开发中途改原型。"]}];function n1(){return h.jsxs("div",{className:"space-y-6 max-w-5xl",children:[h.jsxs("div",{children:[h.jsx("h1",{className:"text-2xl font-bold text-foreground",children:"使用帮助"}),h.jsx("p",{className:"mt-1 text-muted-foreground",children:"产品经理使用本脚手架的完整指南"})]}),h.jsxs(ft,{children:[h.jsx(ot,{children:h.jsxs(Tt,{className:"flex items-center gap-2",children:[h.jsx(Ah,{className:"w-5
