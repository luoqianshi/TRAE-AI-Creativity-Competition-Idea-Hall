<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专注精灵 FocusPet - Trae创造力大赛</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .pet-float {
            animation: float 3s ease-in-out infinite;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100 min-h-screen flex items-center justify-center font-sans text-gray-800">

    <div class="glass-panel rounded-3xl shadow-2xl w-full max-w-md p-8 m-4 relative overflow-hidden">
        <!-- 顶部信息 -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold text-indigo-600">专注精灵 <i class="fa-solid fa-leaf text-green-500"></i></h1>
                <p class="text-xs text-gray-500 mt-1">Trae 创造力大赛演示原型</p>
            </div>
            <div class="bg-yellow-100 text-yellow-600 px-3 py-1 rounded-full text-sm font-semibold shadow-sm">
                <i class="fa-solid fa-star"></i> 能量: <span id="energy-score">0</span>
            </div>
        </div>

        <!-- 宠物展示区 -->
        <div class="bg-white rounded-2xl p-6 shadow-inner mb-8 text-center relative border-2 border-indigo-50">
            <div id="pet-container" class="text-8xl pet-float transition-all duration-300">
                😴
            </div>
            <p id="pet-status" class="mt-4 text-indigo-400 font-medium tracking-wide">小精灵正在休息...</p>
            
            <!-- 经验条 -->
            <div class="w-full bg-gray-100 rounded-full h-2.5 mt-4">
                <div id="exp-bar" class="bg-gradient-to-r from-green-400 to-blue-500 h-2.5 rounded-full" style="width: 10%"></div>
            </div>
            <p class="text-xs text-gray-400 mt-1 text-right">等级 Lv.1</p>
        </div>

        <!-- 番茄钟区域 -->
        <div class="text-center mb-8">
            <div id="timer" class="text-6xl font-black text-gray-700 font-mono tracking-wider mb-6">
                25:00
            </div>
            <div class="flex justify-center space-x-4">
                <button id="start-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white w-14 h-14 rounded-full shadow-lg transition-transform transform hover:scale-105 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-play"></i>
                </button>
                <button id="pause-btn" class="bg-orange-400 hover:bg-orange-500 text-white w-14 h-14 rounded-full shadow-lg transition-transform transform hover:scale-105 flex items-center justify-center text-xl hidden">
                    <i class="fa-solid fa-pause"></i>
                </button>
                <button id="reset-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-600 w-14 h-14 rounded-full shadow-md transition-transform transform hover:scale-105 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <!-- 任务目标 -->
        <div class="bg-indigo-50 rounded-xl p-4">
            <h3 class="text-sm font-semibold text-indigo-800 mb-2"><i class="fa-solid fa-crosshairs"></i> 当前目标</h3>
            <input type="text" placeholder="输入你要专注的任务..." class="w-full bg-transparent border-b border-indigo-200 focus:border-indigo-500 outline-none text-gray-700 py-1 transition-colors">
        </div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        let isRunning = false;
        let energy = 0;

        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const petContainer = document.getElementById('pet-container');
        const petStatus = document.getElementById('pet-status');
        const energyScore = document.getElementById('energy-score');
        const expBar = document.getElementById('exp-bar');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                startBtn.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
                
                // 改变宠物状态
                petContainer.textContent = '🤓';
                petStatus.textContent = '小精灵陪你一起努力中！';
                petStatus.classList.replace('text-indigo-400', 'text-green-500');

                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        completeFocus();
                    }
                }, 1000);
            }
        }

        function pauseTimer() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timerId);
                startBtn.classList.remove('hidden');
                pauseBtn.classList.add('hidden');
                
                // 改变宠物状态
                petContainer.textContent = '🥺';
                petStatus.textContent = '小精灵等你回来哦...';
                petStatus.classList.replace('text-green-500', 'text-orange-400');
            }
        }

        function resetTimer() {
            isRunning = false;
            clearInterval(timerId);
            timeLeft = 25 * 60;
            updateDisplay();
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            
            // 恢复宠物初始状态
            petContainer.textContent = '😴';
            petStatus.textContent = '小精灵正在休息...';
            petStatus.classList.replace('text-green-500', 'text-indigo-400');
            petStatus.classList.replace('text-orange-400', 'text-indigo-400');
        }

        function completeFocus() {
            isRunning = false;
            startBtn.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
            
            // 完成状态
            petContainer.textContent = '🥳';
            petStatus.textContent = '太棒了！专注完成！';
            petStatus.classList.replace('text-green-500', 'text-pink-500');
            
            // 增加能量
            energy += 50;
            energyScore.textContent = energy;
            
            // 增加经验条
            let currentWidth = parseInt(expBar.style.width);
            expBar.style.width = Math.min(currentWidth + 20, 100) + '%';
            
            alert('恭喜你完成了一次深度专注！小精灵获得了 50 点能量！');
            resetTimer();
        }

        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);

        // 初始化
        updateDisplay();
    </script>
</body>
</html>
