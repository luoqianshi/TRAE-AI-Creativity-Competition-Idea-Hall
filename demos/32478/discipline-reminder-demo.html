<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自律提醒器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f13;--card:#1a1a24;--card-hover:#22223a;--accent:#ff6b35;--accent-light:#ff8f60;
  --danger:#ef4444;--success:#22c55e;--text:#f0f0f5;--text-secondary:#8b8b9e;
  --border:#2a2a3e;--input-bg:#12121a;--shadow:0 4px 24px rgba(0,0,0,.4);
}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

header{padding:20px 20px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:var(--bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
header h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent),#ff4757);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header .header-right{display:flex;align-items:center;gap:12px}
.perm-badge{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--border);color:var(--text-secondary);cursor:pointer;transition:.2s}
.perm-badge.granted{background:rgba(34,197,94,.15);color:var(--success)}
.add-btn{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#ff4757);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,107,53,.3);transition:.2s}
.add-btn:hover{transform:scale(1.06);box-shadow:0 6px 20px rgba(255,107,53,.4)}

.content{flex:1;padding:16px 16px 100px;overflow-y:auto}

.empty-state{text-align:center;padding:80px 20px;animation:fadeIn .5s}
.empty-icon{font-size:64px;margin-bottom:16px;filter:grayscale(.3)}
.empty-state h2{font-size:18px;margin-bottom:8px;color:var(--text)}
.empty-state p{color:var(--text-secondary);font-size:14px;line-height:1.6}

.reminder-list{display:flex;flex-direction:column;gap:12px}
.reminder-card{background:var(--card);border-radius:16px;padding:16px;border:1px solid var(--border);transition:.25s;cursor:default;animation:slideUp .4s ease}
.reminder-card:hover{background:var(--card-hover);border-color:rgba(255,107,53,.2);transform:translateY(-1px);box-shadow:var(--shadow)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.type-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.type-icon.exercise{background:rgba(255,107,53,.15)}
.type-icon.study{background:rgba(99,102,241,.15)}
.type-icon.water{background:rgba(56,189,248,.15)}
.type-icon.rest{background:rgba(168,85,247,.15)}
.type-icon.sleep{background:rgba(139,92,246,.15)}
.type-icon.custom{background:rgba(34,197,94,.15)}
.card-info{flex:1;min-width:0}
.card-name{font-size:15px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.card-meta .time-badge{background:var(--input-bg);padding:2px 8px;border-radius:6px;font-weight:500;color:var(--accent-light)}
.card-meta .repeat-badge{color:var(--text-secondary)}

.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#333;border-radius:24px;transition:.3s}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#888;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px);background:#fff}

.card-message{font-size:13px;line-height:1.6;color:var(--accent-light);background:var(--input-bg);border-radius:10px;padding:10px 12px;margin-bottom:10px;border-left:3px solid var(--accent);position:relative}
.card-message .msg-label{position:absolute;top:-8px;left:10px;font-size:10px;background:var(--card);padding:0 6px;color:var(--text-secondary);border-radius:4px}

.card-actions{display:flex;gap:8px;justify-content:flex-end}
.card-actions button{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:4px}
.card-actions button:hover{background:var(--border);color:var(--text)}
.card-actions .test-btn:hover{border-color:var(--accent);color:var(--accent)}
.card-actions .edit-btn:hover{border-color:#6366f1;color:#818cf8}
.card-actions .delete-btn:hover{border-color:var(--danger);color:var(--danger)}
.card-actions .preview-btn:hover{border-color:var(--success);color:var(--success)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.modal-overlay.active{display:flex}
.modal{width:100%;max-width:480px;background:var(--card);border-radius:24px 24px 0 0;padding:0;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease}
.modal-header{padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:18px;font-weight:700}
.close-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--border);color:var(--text-secondary);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.close-btn:hover{background:var(--danger);color:#fff}
.modal-body{padding:16px 20px 32px}
.form-group{margin-bottom:18px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-secondary)}
.form-group input[type="text"],.form-group input[type="time"],.form-group select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font-size:14px;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,107,53,.1)}

.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-option{padding:10px 8px;border-radius:12px;border:1px solid var(--border);background:var(--input-bg);text-align:center;cursor:pointer;transition:.2s;font-size:13px}
.type-option:hover{border-color:var(--accent)}
.type-option.active{border-color:var(--accent);background:rgba(255,107,53,.1);color:var(--accent-light)}
.type-option .type-emoji{font-size:22px;display:block;margin-bottom:4px}

.repeat-options{display:flex;gap:8px}
.repeat-option{flex:1;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--input-bg);text-align:center;cursor:pointer;transition:.2s;font-size:13px}
.repeat-option:hover{border-color:var(--accent)}
.repeat-option.active{border-color:var(--accent);background:rgba(255,107,53,.1);color:var(--accent-light)}

.form-actions{display:flex;gap:10px;margin-top:24px}
.btn-primary{flex:1;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),#ff4757);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;box-shadow:0 4px 16px rgba(255,107,53,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,107,53,.4)}
.btn-secondary{flex:1;padding:14px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-secondary:hover{background:var(--border)}
.btn-test{padding:14px 20px;border-radius:14px;border:1px solid var(--success);background:rgba(34,197,94,.08);color:var(--success);font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-test:hover{background:rgba(34,197,94,.15)}

.preview-box{background:var(--input-bg);border-radius:12px;padding:14px;margin-top:8px;border-left:3px solid var(--accent);min-height:60px;font-size:13px;line-height:1.6;color:var(--accent-light);animation:fadeIn .3s}

.toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;max-width:420px;width:calc(100% - 40px)}
.toast{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);animation:slideDown .3s ease;display:flex;align-items:center;gap:12px}
.toast-icon{font-size:24px;flex-shrink:0}
.toast-content{flex:1}
.toast-title{font-size:13px;font-weight:600;margin-bottom:2px}
.toast-body{font-size:12px;color:var(--accent-light);line-height:1.4}
.toast.removing{animation:fadeOut .3s ease forwards}

.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 env(safe-area-inset-bottom,8px);z-index:50}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;border-radius:12px;cursor:pointer;transition:.2s;color:var(--text-secondary);font-size:11px;border:none;background:none}
.tab-item.active{color:var(--accent)}
.tab-item .tab-icon{font-size:20px}

.stats-section{margin-top:20px}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat-value{font-size:26px;font-weight:700;background:linear-gradient(135deg,var(--accent),#ff4757);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:11px;color:var(--text-secondary);margin-top:4px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-20px)}}

@media(prefers-color-scheme:light){
  :root{--bg:#f5f5f7;--card:#fff;--card-hover:#fafafa;--border:#e5e5ea;--input-bg:#f0f0f5;--text:#1a1a2e;--text-secondary:#6b6b80;--shadow:0 4px 24px rgba(0,0,0,.08)}
  .card-message{background:#fff5f0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>自律提醒器</h1>
    <div class="header-right">
      <span class="perm-badge" id="permBadge" onclick="requestPerm()">通知权限</span>
      <button class="add-btn" onclick="openModal()" title="新增提醒">+</button>
    </div>
  </header>

  <div class="content" id="mainContent">
    <div class="stats-section" id="statsSection"></div>
    <div id="reminderList"></div>
  </div>

  <div class="tab-bar">
    <button class="tab-item active" onclick="switchTab('home')"><span class="tab-icon">🏠</span>首页</button>
    <button class="tab-item" onclick="switchTab('stats')"><span class="tab-icon">📊</span>统计</button>
    <button class="tab-item" onclick="switchTab('settings')"><span class="tab-icon">⚙️</span>设置</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新增提醒</h2>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>提醒名称</label>
        <input type="text" id="reminderName" placeholder="例如：下午运动时间">
      </div>
      <div class="form-group">
        <label>提醒类型</label>
        <div class="type-grid" id="typeGrid"></div>
      </div>
      <div class="form-group">
        <label>提醒时间</label>
        <input type="time" id="reminderTime" value="09:00">
      </div>
      <div class="form-group">
        <label>重复方式</label>
        <div class="repeat-options" id="repeatOptions"></div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;justify-content:space-between">
          启用提醒
          <div class="toggle-switch">
            <input type="checkbox" id="reminderEnabled" checked>
            <span class="toggle-slider" onclick="this.previousElementSibling.click()"></span>
          </div>
        </label>
      </div>
      <div class="form-group">
        <label>文案预览 <span style="font-weight:400;cursor:pointer" onclick="refreshPreview()">🔄 刷新</span></label>
        <div class="preview-box" id="previewBox">选择提醒类型后，此处预览文案...</div>
      </div>
      <div class="form-actions">
        <button class="btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn-test" onclick="testNotification()">🔔 测试</button>
        <button class="btn-primary" onclick="saveReminder()">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}

function generateMessage(type){
  const t=TEMPLATES[type]||TEMPLATES.custom;
  const now=new Date();
  const h=now.getHours();
  let timeStr='';
  if(h>=5&&h<9)timeStr='早上好';
  else if(h>=9&&h<12)timeStr='上午了';
  else if(h>=12&&h<14)timeStr='中午了';
  else if(h>=14&&h<18)timeStr='下午了';
  else if(h>=18&&h<22)timeStr='晚上了';
  else timeStr='夜深了';
  const num=Math.floor(Math.random()*30)+5;
  const names=['小王','小李','老张','小陈','小刘','阿杰','小杨','阿明'];
  const name=rand(names);
  const opening=rand(t.openings).replace('下午四点了！',timeStr+'！');
  return `${opening}${rand(t.comparisons).replace('你的同事',name).replace('隔壁老王',name).replace('别人',name)}${rand(t.urgents)}${rand(t.calls)}`;
}

function formatTime(t){const[h,m]=t.split(':');return`${h}:${m}`}

function getRepeatLabel(key){const r=REPEATS.find(r=>r.key===key);return r?r.label:'每天'}

function getTypeInfo(key){const t=TYPES.find(t=>t.key===key);return t||TYPES[5]}

function save(){localStorage.setItem('reminders',JSON.stringify(reminders))}

function refreshPreview(){
  const msg=generateMessage(selectedType);
  document.getElementById('previewBox').textContent=msg;
}

function scheduleAll(){
  activeTimers.forEach(t=>clearTimeout(t));
  activeTimers=[];
  reminders.filter(r=>r.enabled).forEach(r=>{
    scheduleOne(r);
  });
}

function scheduleOne(r){
  const[now,parts]=[[new Date()],r.time.split(':')];
  const[h,m]=[parseInt(parts[0]),parseInt(parts[1])];
  const target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0);
  let delay=target-now;
  if(delay<0)delay+=86400000;
  if(r.repeat==='weekday'&&now.getDay()===0||now.getDay()===6){delay+=86400000;if(now.getDay()===6)delay+=86400000}
  if(r.repeat==='weekend'&&(now.getDay()>=1&&now.getDay()<=5)){const d=6-now.getDay();delay=d*86400000+(target-new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0))}
  if(r.repeat==='once'&&delay<0)return;

  const timer=setTimeout(()=>{
    showToast(getTypeInfo(r.type).emoji,r.name,generateMessage(r.type));
    if(r.repeat==='once'){
      r.enabled=false;
      save();
      render();
    }else{
      scheduleOne(r);
    }
  },delay);
  activeTimers.push(timer);
}

function requestPerm(){
  if('Notification'in window){
    Notification.requestPermission().then(p=>{
      notifPermission=p;
      updatePermBadge();
    });
  }else{
    notifPermission='granted';
    updatePermBadge();
  }
}

function updatePermBadge(){
  const b=document.getElementById('permBadge');
  if(notifPermission==='granted'){b.textContent='✓ 通知已开启';b.classList.add('granted')}
  else{b.textContent='通知权限';b.classList.remove('granted')}
}

function showToast(icon,title,body){
  const c=document.getElementById('toastContainer');
  const d=document.createElement('div');
  d.className='toast';
  d.innerHTML=`<span class="toast-icon">${icon}</span><div class="toast-content"><div class="toast-title">${title}</div><div class="toast-body">${body}</div></div>`;
  c.appendChild(d);

  if(notifPermission==='granted'&&document.hidden){
    new Notification(title,{body,icon:''});
  }

  setTimeout(()=>{d.classList.add('removing');setTimeout(()=>d.remove(),300)},5000);
  setTimeout(()=>{d.classList.add('removing');setTimeout(()=>d.remove(),300)},5000);
}

function render(){
  const list=document.getElementById('reminderList');
  if(reminders.length===0){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">🎯</div><h2>还没有提醒</h2><p>点击右上角 + 按钮添加你的第一条自律提醒<br>让AI紧迫感文案帮你保持动力！</p></div>`;
  }else{
    list.innerHTML=`<div class="reminder-list">${reminders.map(r=>{
      const ti=getTypeInfo(r.type);
      return `<div class="reminder-card">
        <div class="card-top">
          <div class="type-icon ${r.type}">${ti.emoji}</div>
          <div class="card-info">
            <div class="card-name">${r.name}</div>
            <div class="card-meta">
              <span class="time-badge">${formatTime(r.time)}</span>
              <span class="repeat-badge">${getRepeatLabel(r.repeat)}</span>
            </div>
          </div>
          <div class="toggle-switch">
            <input type="checkbox" ${r.enabled?'checked':''} onchange="toggleReminder('${r.id}')">
            <span class="toggle-slider" onclick="this.previousElementSibling.click()"></span>
          </div>
        </div>
        <div class="card-message"><span class="msg-label">AI 紧迫感文案</span>${generateMessage(r.type)}</div>
        <div class="card-actions">
          <button class="preview-btn" onclick="previewMsg('${r.id}',this)">🔄 换一条</button>
          <button class="test-btn" onclick="testOne('${r.id}')">🔔 测试</button>
          <button class="edit-btn" onclick="editReminder('${r.id}')">✏️ 编辑</button>
          <button class="delete-btn" onclick="deleteReminder('${r.id}')">🗑</button>
        </div>
      </div>`;
    }).join('')}</div>`;
  }
  renderStats();
}

function renderStats(){
  const sc=document.getElementById('statsSection');
  const total=reminders.length;
  const active=reminders.filter(r=>r.enabled).length;
  const types=new Set(reminders.map(r=>r.type)).size;
  sc.innerHTML=`<div class="stats-grid">
    <div class="stat-card"><div class="stat-value">${total}</div><div class="stat-label">总提醒数</div></div>
    <div class="stat-card"><div class="stat-value">${active}</div><div class="stat-label">活跃提醒</div></div>
    <div class="stat-card"><div class="stat-value">${types}</div><div class="stat-label">提醒类型</div></div>
    <div class="stat-card"><div class="stat-value">50+</div><div class="stat-label">文案模板</div></div>
  </div>`;
}

function toggleReminder(id){
  const r=reminders.find(r=>r.id===id);
  if(r){r.enabled=!r.enabled;save();render();scheduleAll()}
}

function previewMsg(id,btn){
  const r=reminders.find(r=>r.id===id);
  if(!r)return;
  const card=btn.closest('.reminder-card');
  const msgEl=card.querySelector('.card-message');
  const labelEl=msgEl.querySelector('.msg-label');
  const newMsg=generateMessage(r.type);
  msgEl.innerHTML='';
  msgEl.textContent=newMsg;
  msgEl.prepend(labelEl);
  msgEl.style.animation='none';
  msgEl.offsetHeight;
  msgEl.style.animation='fadeIn .3s';
}

function testOne(id){
  const r=reminders.find(r=>r.id===id);
  if(r)showToast(getTypeInfo(r.type).emoji,r.name,generateMessage(r.type));
}

function editReminder(id){
  const r=reminders.find(r=>r.id===id);
  if(!r)return;
  editingId=id;
  document.getElementById('modalTitle').textContent='编辑提醒';
  document.getElementById('reminderName').value=r.name;
  document.getElementById('reminderTime').value=r.time;
  document.getElementById('reminderEnabled').checked=r.enabled;
  selectedType=r.type;
  selectedRepeat=r.repeat;
  renderTypeGrid();
  renderRepeatOptions();
  refreshPreview();
  document.getElementById('modalOverlay').classList.add('active');
}

function deleteReminder(id){
  reminders=reminders.filter(r=>r.id!==id);
  save();render();scheduleAll();
}

function openModal(){
  editingId=null;
  document.getElementById('modalTitle').textContent='新增提醒';
  document.getElementById('reminderName').value='';
  document.getElementById('reminderTime').value='09:00';
  document.getElementById('reminderEnabled').checked=true;
  selectedType='exercise';
  selectedRepeat='daily';
  renderTypeGrid();
  renderRepeatOptions();
  refreshPreview();
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('active');
}

function renderTypeGrid(){
  document.getElementById('typeGrid').innerHTML=TYPES.map(t=>
    `<div class="type-option ${selectedType===t.key?'active':''}" onclick="selectType('${t.key}')"><span class="type-emoji">${t.emoji}</span>${t.label}</div>`
  ).join('');
}

function renderRepeatOptions(){
  document.getElementById('repeatOptions').innerHTML=REPEATS.map(r=>
    `<div class="repeat-option ${selectedRepeat===r.key?'active':''}" onclick="selectRepeat('${r.key}')">${r.label}</div>`
  ).join('');
}

function selectType(key){selectedType=key;renderTypeGrid();refreshPreview()}
function selectRepeat(key){selectedRepeat=key;renderRepeatOptions()}

function saveReminder(){
  const name=document.getElementById('reminderName').value.trim();
  const time=document.getElementById('reminderTime').value;
  const enabled=document.getElementById('reminderEnabled').checked;
  if(!name){showToast('⚠️','请输入名称','提醒名称不能为空');return}

  if(editingId){
    const r=reminders.find(r=>r.id===editingId);
    if(r){Object.assign(r,{name,type:selectedType,time,repeat:selectedRepeat,enabled,updatedAt:Date.now()})}
  }else{
    reminders.push({id:genId(),name,type:selectedType,time,repeat:selectedRepeat,enabled,createdAt:Date.now(),updatedAt:Date.now()});
  }
  save();render();scheduleAll();closeModal();
  showToast(getTypeInfo(selectedType).emoji,editingId?'提醒已更新':'提醒已创建',name);
}

function testNotification(){
  const name=document.getElementById('reminderName').value.trim()||'测试提醒';
  const msg=generateMessage(selectedType);
  showToast(getTypeInfo(selectedType).emoji,name,msg);
  if(notifPermission==='granted'&&document.hidden){
    new Notification(name,{body:msg});
  }
}

function switchTab(tab){
  document.querySelectorAll('.tab-item').forEach((el,i)=>{
    el.classList.toggle('active',['home','stats','settings'][i]===tab);
  });
  if(tab==='stats'){
    document.getElementById('statsSection').scrollIntoView({behavior:'smooth'});
  }
}

function addDefaults(){
  if(reminders.length===0){
    reminders=[
      {id:genId(),name:'下午健身时间',type:'exercise',time:'16:00',repeat:'daily',enabled:true,createdAt:Date.now(),updatedAt:Date.now()},
      {id:genId(),name:'AI课程学习',type:'study',time:'20:00',repeat:'weekday',enabled:true,createdAt:Date.now(),updatedAt:Date.now()},
      {id:genId(),name:'记得喝水',type:'water',time:'10:00',repeat:'daily',enabled:true,createdAt:Date.now(),updatedAt:Date.now()},
      {id:genId(),name:'眼睛休息一下',type:'rest',time:'14:00',repeat:'weekday',enabled:true,createdAt:Date.now(),updatedAt:Date.now()},
      {id:genId(),name:'早睡提醒',type:'sleep',time:'23:00',repeat:'daily',enabled:false,createdAt:Date.now(),updatedAt:Date.now()}
    ];
    save();
  }
}

// Monitor time and trigger notifications
setInterval(()=>{
  const now=new Date();
  const ct=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const day=now.getDay();
  reminders.filter(r=>r.enabled&&r.time===ct&&now.getSeconds()===0).forEach(r=>{
    if(r.repeat==='daily')triggerReminder(r);
    else if(r.repeat==='weekday'&&day>=1&&day<=5)triggerReminder(r);
    else if(r.repeat==='weekend'&&(day===0||day===6))triggerReminder(r);
    else if(r.repeat==='once'){triggerReminder(r);r.enabled=false;save();render()}
  });
},1000);

function triggerReminder(r){
  showToast(getTypeInfo(r.type).emoji,r.name,generateMessage(r.type));
  if(notifPermission==='granted'&&document.hidden){
    new Notification(r.name,{body:generateMessage(r.type)});
  }
}

// Init
if('Notification'in window){notifPermission=Notification.permission}
updatePermBadge();
addDefaults();
render();
scheduleAll();
</script>
</body>
</html>
