<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵伴·MeowPal - 有猫的陪伴，生活更有规律</title>
    <style>
        :root {
            --primary: #FF9F43;
            --primary-dark: #E8891A;
            --secondary: #FF6B6B;
            --accent: #4ECDC4;
            --warm: #FFEAA7;
            --soft: #F5F0E8;
            --dark: #2D3436;
            --text: #636E72;
            --success: #00B894;
            --warning: #FDCB6E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
            background: linear-gradient(135deg, #FFF9E6 0%, #FFE8D6 100%);
            min-height: 100vh;
            color: var(--dark);
            overflow-x: hidden;
        }

        .app-container {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            position: relative;
            box-shadow: 0 0 50px rgba(255, 159, 67, 0.2);
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 20px;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
        }

        .cat-area {
            position: relative;
            height: 280px;
            background: linear-gradient(180deg, #FFF5E6 0%, #FFE8D6 100%);
            overflow: hidden;
        }

        .room-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #FFF5E6 0%, #FFE8D6 100%);
        }

        .cat-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            transition: all 0.3s;
        }

        .cat-container:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .cat-svg {
            width: 200px;
            height: 180px;
        }

        @keyframes catIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes catTail {
            0%, 100% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
        }

        @keyframes catBlink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        @keyframes catPurr {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .cat-body {
            animation: catIdle 3s ease-in-out infinite;
        }

        .cat-tail {
            transform-origin: bottom center;
            animation: catTail 2s ease-in-out infinite;
        }

        .cat-eye {
            animation: catBlink 4s infinite;
        }

        .cat-container.petting .cat-body {
            animation: catPurr 0.3s ease-in-out infinite;
        }

        .status-bubble {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .status-bubble.show {
            opacity: 1;
            top: -70px;
        }

        .status-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid white;
        }

        .interaction-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: var(--soft);
        }

        .interact-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .interact-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 159, 67, 0.3);
        }

        .interact-btn:active {
            transform: scale(0.95);
        }

        .interact-btn span {
            font-size: 0.65rem;
            color: var(--text);
            margin-top: 2px;
        }

        .modules-container {
            padding: 15px;
        }

        .module-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .module-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .module-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .module-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .module-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
        }

        .module-subtitle {
            font-size: 0.8rem;
            color: var(--text);
        }

        .alarm-module .module-icon {
            background: linear-gradient(135deg, #FFE082 0%, #FFD54F 100%);
        }

        .alarm-time {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }

        .time-input {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--dark);
            background: var(--soft);
            border: none;
            border-radius: 15px;
            padding: 10px 15px;
            width: 90px;
            text-align: center;
            font-family: inherit;
        }

        .time-separator {
            font-size: 2rem;
            color: var(--text);
        }

        .alarm-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
        }

        .toggle-switch {
            width: 55px;
            height: 30px;
            background: #ddd;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: var(--success);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle-switch.active::after {
            left: 27px;
        }

        .focus-module .module-icon {
            background: linear-gradient(135deg, #FF9F43 0%, #FF6B6B 100%);
        }

        .timer-display {
            text-align: center;
            margin: 20px 0;
        }

        .timer-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0deg, var(--soft) 0deg);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .timer-inner {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-time {
            font-size: 2rem;
            font-weight: bold;
            color: var(--dark);
        }

        .timer-label {
            font-size: 0.8rem;
            color: var(--text);
        }

        .focus-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .control-btn {
            padding: 12px 30px;
            border-radius: 25px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .control-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .control-btn.secondary {
            background: var(--soft);
            color: var(--text);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 159, 67, 0.3);
        }

        .meal-module .module-icon {
            background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%);
        }

        .meal-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .meal-card {
            background: var(--soft);
            border-radius: 15px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .meal-card:hover {
            transform: translateY(-3px);
        }

        .meal-card.completed {
            border-color: var(--success);
            background: rgba(0, 184, 148, 0.1);
        }

        .meal-card .emoji {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .meal-card .name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark);
        }

        .meal-card .time {
            font-size: 0.75rem;
            color: var(--text);
            margin-top: 3px;
        }

        .meal-card .status {
            font-size: 0.7rem;
            color: var(--success);
            margin-top: 5px;
        }

        .growth-module .module-icon {
            background: linear-gradient(135deg, #A8E6CF 0%, #88D8B0 100%);
        }

        .growth-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .growth-stat {
            background: var(--soft);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }

        .growth-stat .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .growth-stat .label {
            font-size: 0.75rem;
            color: var(--text);
        }

        .growth-bar {
            margin-top: 15px;
        }

        .growth-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 12px;
            background: var(--soft);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 420px;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 12px;
        }

        .nav-item.active {
            background: rgba(255, 159, 67, 0.1);
        }

        .nav-item .icon {
            font-size: 1.5rem;
        }

        .nav-item .label {
            font-size: 0.7rem;
            color: var(--text);
            margin-top: 3px;
        }

        .nav-item.active .label {
            color: var(--primary);
            font-weight: 600;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: white;
            border-radius: 25px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            transform: scale(0.9);
            transition: all 0.3s;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .modal-text {
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 12px 40px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 159, 67, 0.4);
        }

        .cat-butt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
        }

        .cat-butt-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .cat-butt {
            width: 300px;
            height: 250px;
        }

        .focus-message {
            color: white;
            font-size: 1.2rem;
            margin-top: 20px;
            text-align: center;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .notification-icon {
            font-size: 1.5rem;
        }

        .notification-text {
            font-size: 0.9rem;
            color: var(--dark);
        }

        .bottom-spacer {
            height: 80px;
        }

        @media (max-width: 420px) {
            .app-container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-top">
                <div class="logo">
                    <span>🐱</span>
                    <span>喵伴</span>
                </div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <span>❤️</span>
                        <span id="intimacy">85</span>
                    </div>
                    <div class="stat-item">
                        <span>🐟</span>
                        <span id="coins">128</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="cat-area">
            <div class="room-bg"></div>
            <div class="status-bubble" id="statusBubble">喵~ 主人好！</div>
            <div class="cat-container" id="catContainer" onclick="petCat()">
                <svg class="cat-svg" viewBox="0 0 200 180">
                    <g class="cat-tail">
                        <path d="M160 140 Q180 120, 175 90 Q172 70, 185 60" fill="none" stroke="#FF9F43" stroke-width="12" stroke-linecap="round"/>
                    </g>
                    <g class="cat-body">
                        <ellipse cx="100" cy="130" rx="60" ry="40" fill="#FF9F43"/>
                        <ellipse cx="60" cy="155" rx="20" ry="15" fill="#FF9F43"/>
                        <ellipse cx="140" cy="155" rx="20" ry="15" fill="#FF9F43"/>
                        <ellipse cx="75" cy="155" rx="15" ry="12" fill="#FFB366"/>
                        <ellipse cx="125" cy="155" rx="15" ry="12" fill="#FFB366"/>
                        <circle cx="100" cy="80" r="45" fill="#FF9F43"/>
                        <polygon points="60,50 70,15 85,45" fill="#FF9F43"/>
                        <polygon points="140,50 130,15 115,45" fill="#FF9F43"/>
                        <polygon points="65,45 72,22 80,42" fill="#FFB3B3"/>
                        <polygon points="135,45 128,22 120,42" fill="#FFB3B3"/>
                        <g class="cat-eye">
                            <ellipse cx="80" cy="75" rx="10" ry="12" fill="white"/>
                            <ellipse cx="120" cy="75" rx="10" ry="12" fill="white"/>
                            <circle cx="82" cy="77" r="6" fill="#2D3436"/>
                            <circle cx="122" cy="77" r="6" fill="#2D3436"/>
                            <circle cx="84" cy="74" r="2" fill="white"/>
                            <circle cx="124" cy="74" r="2" fill="white"/>
                        </g>
                        <ellipse cx="100" cy="92" rx="5" ry="4" fill="#FF6B6B"/>
                        <path d="M95 98 Q100 103, 105 98" fill="none" stroke="#2D3436" stroke-width="2" stroke-linecap="round"/>
                        <line x1="55" y1="85" x2="75" y2="88" stroke="#2D3436" stroke-width="1.5"/>
                        <line x1="55" y1="92" x2="75" y2="92" stroke="#2D3436" stroke-width="1.5"/>
                        <line x1="55" y1="99" x2="75" y2="96" stroke="#2D3436" stroke-width="1.5"/>
                        <line x1="145" y1="85" x2="125" y2="88" stroke="#2D3436" stroke-width="1.5"/>
                        <line x1="145" y1="92" x2="125" y2="92" stroke="#2D3436" stroke-width="1.5"/>
                        <line x1="145" y1="99" x2="125" y2="96" stroke="#2D3436" stroke-width="1.5"/>
                        <ellipse cx="65" cy="90" rx="8" ry="5" fill="#FFB3B3" opacity="0.6"/>
                        <ellipse cx="135" cy="90" rx="8" ry="5" fill="#FFB3B3" opacity="0.6"/>
                    </g>
                </svg>
            </div>
        </div>

        <div class="interaction-bar">
            <button class="interact-btn" onclick="feedCat()">
                🍖
                <span>喂食</span>
            </button>
            <button class="interact-btn" onclick="playCat()">
                🧶
                <span>玩耍</span>
            </button>
            <button class="interact-btn" onclick="cleanCat()">
                🛁
                <span>洗澡</span>
            </button>
            <button class="interact-btn" onclick="sleepCat()">
                💤
                <span>睡觉</span>
            </button>
        </div>

        <div class="modules-container">
            <div class="module-card alarm-module" id="alarmModule">
                <div class="module-header">
                    <div class="module-icon">🌅</div>
                    <div>
                        <div class="module-title">晨间唤醒</div>
                        <div class="module-subtitle">猫咪的生物钟叫醒服务</div>
                    </div>
                </div>
                <div class="alarm-time">
                    <input type="number" class="time-input" id="alarmHour" value="07" min="0" max="23">
                    <span class="time-separator">:</span>
                    <input type="number" class="time-input" id="alarmMinute" value="00" min="0" max="59">
                </div>
                <div class="alarm-toggle">
                    <span>开启闹钟</span>
                    <div class="toggle-switch" id="alarmToggle" onclick="toggleAlarm()"></div>
                </div>
            </div>

            <div class="module-card focus-module">
                <div class="module-header">
                    <div class="module-icon">🎯</div>
                    <div>
                        <div class="module-title">专注时刻</div>
                        <div class="module-subtitle">猫臀封印术 · 番茄钟</div>
                    </div>
                </div>
                <div class="timer-display">
                    <div class="timer-circle" id="timerCircle">
                        <div class="timer-inner">
                            <div class="timer-time" id="timerDisplay">25:00</div>
                            <div class="timer-label">专注时间</div>
                        </div>
                    </div>
                </div>
                <div class="focus-controls">
                    <button class="control-btn secondary" onclick="resetTimer()">重置</button>
                    <button class="control-btn primary" id="timerBtn" onclick="toggleTimer()">开始专注</button>
                </div>
            </div>

            <div class="module-card meal-module">
                <div class="module-header">
                    <div class="module-icon">🍽️</div>
                    <div>
                        <div class="module-title">饮食管理</div>
                        <div class="module-subtitle">投喂与被投喂</div>
                    </div>
                </div>
                <div class="meal-cards">
                    <div class="meal-card" id="breakfast" onclick="checkMeal('breakfast')">
                        <div class="emoji">🌅</div>
                        <div class="name">早餐</div>
                        <div class="time">07:30</div>
                        <div class="status"></div>
                    </div>
                    <div class="meal-card" id="lunch" onclick="checkMeal('lunch')">
                        <div class="emoji">☀️</div>
                        <div class="name">午餐</div>
                        <div class="time">12:00</div>
                        <div class="status"></div>
                    </div>
                    <div class="meal-card" id="dinner" onclick="checkMeal('dinner')">
                        <div class="emoji">🌙</div>
                        <div class="name">晚餐</div>
                        <div class="time">18:30</div>
                        <div class="status"></div>
                    </div>
                </div>
            </div>

            <div class="module-card growth-module">
                <div class="module-header">
                    <div class="module-icon">📈</div>
                    <div>
                        <div class="module-title">成长日记</div>
                        <div class="module-subtitle">小橘的成长记录</div>
                    </div>
                </div>
                <div class="growth-stats">
                    <div class="growth-stat">
                        <div class="value" id="focusCount">12</div>
                        <div class="label">专注次数</div>
                    </div>
                    <div class="growth-stat">
                        <div class="value" id="earlyDays">8</div>
                        <div class="label">早起天数</div>
                    </div>
                    <div class="growth-stat">
                        <div class="value" id="mealStreak">5</div>
                        <div class="label">按时吃饭</div>
                    </div>
                    <div class="growth-stat">
                        <div class="value" id="catAge">幼猫</div>
                        <div class="label">成长阶段</div>
                    </div>
                </div>
                <div class="growth-bar">
                    <div class="growth-bar-label">
                        <span>成长值</span>
                        <span id="growthPercent">35%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="growthBar" style="width: 35%"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-spacer"></div>

        <nav class="bottom-nav">
            <div class="nav-item active">
                <span class="icon">🏠</span>
                <span class="label">首页</span>
            </div>
            <div class="nav-item" onclick="showNotification('📊', '统计功能开发中...')">
                <span class="icon">📊</span>
                <span class="label">统计</span>
            </div>
            <div class="nav-item" onclick="showNotification('🏆', '成就功能开发中...')">
                <span class="icon">🏆</span>
                <span class="label">成就</span>
            </div>
            <div class="nav-item" onclick="showNotification('⚙️', '设置功能开发中...')">
                <span class="icon">⚙️</span>
                <span class="label">设置</span>
            </div>
        </nav>
    </div>

    <div class="cat-butt-overlay" id="catButtOverlay">
        <svg class="cat-butt" viewBox="0 0 300 250">
            <path d="M150 200 Q200 180, 220 140 Q235 110, 260 100" fill="none" stroke="#FF9F43" stroke-width="20" stroke-linecap="round"/>
            <ellipse cx="150" cy="150" rx="120" ry="80" fill="#FF9F43"/>
            <ellipse cx="70" cy="200" rx="35" ry="25" fill="#FF9F43"/>
            <ellipse cx="230" cy="200" rx="35" ry="25" fill="#FF9F43"/>
            <ellipse cx="150" cy="130" rx="40" ry="30" fill="#FFB366" opacity="0.5"/>
            <circle cx="150" cy="200" r="25" fill="#FFB366"/>
        </svg>
        <div class="focus-message">
            <div style="font-size: 1.5rem; margin-bottom: 10px;">🐱 专注中...</div>
            <div id="focusTimerDisplay">25:00</div>
            <div style="font-size: 0.9rem; margin-top: 10px; opacity: 0.7;">猫咪正在监督你哦~</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">🐱</div>
            <div class="modal-title" id="modalTitle">标题</div>
            <div class="modal-text" id="modalText">内容</div>
            <button class="modal-btn" id="modalBtn" onclick="closeModal()">确定</button>
        </div>
    </div>

    <div class="notification" id="notification">
        <span class="notification-icon" id="notificationIcon">🐱</span>
        <span class="notification-text" id="notificationText">提示信息</span>
    </div>

    <script>
        var state = {
            intimacy: 85,
            coins: 128,
            alarmEnabled: false,
            alarmTime: { hour: 7, minute: 0 },
            timerRunning: false,
            timerSeconds: 1500,
            timerInterval: null,
            focusCount: 12,
            earlyDays: 8,
            mealStreak: 5,
            growthValue: 35,
            meals: {
                breakfast: false,
                lunch: false,
                dinner: false
            }
        };

        function updateDisplay() {
            document.getElementById('intimacy').textContent = state.intimacy;
            document.getElementById('coins').textContent = state.coins;
            document.getElementById('focusCount').textContent = state.focusCount;
            document.getElementById('earlyDays').textContent = state.earlyDays;
            document.getElementById('mealStreak').textContent = state.mealStreak;
            document.getElementById('growthPercent').textContent = state.growthValue + '%';
            document.getElementById('growthBar').style.width = state.growthValue + '%';
            
            var age = '幼猫';
            if (state.growthValue >= 80) age = '成年猫';
            else if (state.growthValue >= 50) age = '青少年';
            else if (state.growthValue >= 20) age = '小猫';
            document.getElementById('catAge').textContent = age;
        }

        function petCat() {
            var cat = document.getElementById('catContainer');
            var bubble = document.getElementById('statusBubble');
            
            cat.classList.add('petting');
            
            var messages = [
                '喵~ 好舒服！',
                '呼噜呼噜~',
                '再摸摸下巴~',
                '主人最好了！',
                '喵喵喵~',
                '好幸福喵~'
            ];
            
            bubble.textContent = messages[Math.floor(Math.random() * messages.length)];
            bubble.classList.add('show');
            
            state.intimacy = Math.min(100, state.intimacy + 1);
            updateDisplay();
            
            setTimeout(function() {
                cat.classList.remove('petting');
            }, 2000);
            
            setTimeout(function() {
                bubble.classList.remove('show');
            }, 3000);
        }

        function feedCat() {
            if (state.coins < 5) {
                showModal('😿', '小鱼干不够了', '猫咪饿了...快去专注赚小鱼干吧！');
                return;
            }
            
            state.coins -= 5;
            state.intimacy = Math.min(100, state.intimacy + 3);
            updateDisplay();
            
            showModal('😋', '喂食成功', '猫咪开心地吃起了猫粮~\n亲密度 +3');
        }

        function playCat() {
            state.intimacy = Math.min(100, state.intimacy + 2);
            updateDisplay();
            
            showModal('🧶', '玩耍时间', '猫咪追着毛线球跑来跑去~\n亲密度 +2');
        }

        function cleanCat() {
            state.intimacy = Math.min(100, state.intimacy + 1);
            updateDisplay();
            
            showModal('🛁', '洗澡时间', '猫咪虽然不太喜欢洗澡，\n但变得更干净了~');
        }

        function sleepCat() {
            showModal('💤', '睡觉时间', '猫咪蜷成一团睡着了~\n晚安，明天见！');
        }

        function toggleAlarm() {
            var toggle = document.getElementById('alarmToggle');
            state.alarmEnabled = !state.alarmEnabled;
            
            if (state.alarmEnabled) {
                toggle.classList.add('active');
                var hour = document.getElementById('alarmHour').value.padStart(2, '0');
                var minute = document.getElementById('alarmMinute').value.padStart(2, '0');
                showNotification('⏰', '闹钟已设置 ' + hour + ':' + minute);
            } else {
                toggle.classList.remove('active');
                showNotification('⏰', '闹钟已关闭');
            }
        }

        function toggleTimer() {
            var btn = document.getElementById('timerBtn');
            var overlay = document.getElementById('catButtOverlay');
            
            if (!state.timerRunning) {
                state.timerRunning = true;
                btn.textContent = '暂停';
                overlay.classList.add('show');
                
                state.timerInterval = setInterval(function() {
                    state.timerSeconds--;
                    updateTimerDisplay();
                    
                    if (state.timerSeconds <= 0) {
                        completeFocus();
                    }
                }, 1000);
            } else {
                state.timerRunning = false;
                btn.textContent = '继续';
                clearInterval(state.timerInterval);
                overlay.classList.remove('show');
            }
        }

        function resetTimer() {
            state.timerRunning = false;
            state.timerSeconds = 1500;
            clearInterval(state.timerInterval);
            document.getElementById('timerBtn').textContent = '开始专注';
            document.getElementById('catButtOverlay').classList.remove('show');
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            var minutes = Math.floor(state.timerSeconds / 60);
            var seconds = state.timerSeconds % 60;
            var display = minutes.toString().padStart(2, '0') + ':' + seconds.toString().padStart(2, '0');
            
            document.getElementById('timerDisplay').textContent = display;
            document.getElementById('focusTimerDisplay').textContent = display;
            
            var progress = (1500 - state.timerSeconds) / 1500 * 360;
            document.getElementById('timerCircle').style.background = 
                'conic-gradient(var(--primary) ' + progress + 'deg, var(--soft) ' + progress + 'deg)';
        }

        function completeFocus() {
            clearInterval(state.timerInterval);
            state.timerRunning = false;
            state.timerSeconds = 1500;
            
            document.getElementById('catButtOverlay').classList.remove('show');
            document.getElementById('timerBtn').textContent = '开始专注';
            updateTimerDisplay();
            
            state.focusCount++;
            state.coins += 10;
            state.growthValue = Math.min(100, state.growthValue + 2);
            updateDisplay();
            
            showModal('🎉', '专注完成！', '太棒了！猫咪伸了个懒腰~\n获得 10 个小鱼干！');
        }

        function checkMeal(mealType) {
            if (state.meals[mealType]) {
                showNotification('🍽️', '这顿已经吃过啦~');
                return;
            }
            
            state.meals[mealType] = true;
            state.mealStreak++;
            state.intimacy = Math.min(100, state.intimacy + 2);
            state.coins += 5;
            state.growthValue = Math.min(100, state.growthValue + 1);
            
            var card = document.getElementById(mealType);
            card.classList.add('completed');
            card.querySelector('.status').textContent = '✓ 已打卡';
            
            updateDisplay();
            
            var mealNames = {
                breakfast: '早餐',
                lunch: '午餐',
                dinner: '晚餐'
            };
            
            showModal('🍽️', mealNames[mealType] + '打卡成功！', '猫咪也开心地吃起了猫粮~\n亲密度 +2，小鱼干 +5');
        }

        function showModal(icon, title, text) {
            document.getElementById('modalIcon').textContent = icon;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        function showNotification(icon, text) {
            var notification = document.getElementById('notification');
            document.getElementById('notificationIcon').textContent = icon;
            document.getElementById('notificationText').textContent = text;
            
            notification.classList.add('show');
            
            setTimeout(function() {
                notification.classList.remove('show');
            }, 3000);
        }

        document.addEventListener('visibilitychange', function() {
            if (state.timerRunning && document.hidden) {
                clearInterval(state.timerInterval);
                state.timerRunning = false;
                state.timerSeconds = 1500;
                
                document.getElementById('catButtOverlay').classList.remove('show');
                document.getElementById('timerBtn').textContent = '开始专注';
                updateTimerDisplay();
                
                showModal('😿', '专注失败', '猫咪被甩飞了！\n下次要专心哦~');
            }
        });

        updateDisplay();
        
        setInterval(function() {
            if (!state.timerRunning && Math.random() > 0.7) {
                var messages = [
                    '喵~ 主人~',
                    '想玩毛线球~',
                    '肚子饿了...',
                    '主人最棒了！',
                    '喵喵喵~'
                ];
                var bubble = document.getElementById('statusBubble');
                bubble.textContent = messages[Math.floor(Math.random() * messages.length)];
                bubble.classList.add('show');
                setTimeout(function() {
                    bubble.classList.remove('show');
                }, 3000);
            }
        }, 15000);
    </script>
</body>
</html>
