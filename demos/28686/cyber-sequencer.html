<body>
  <div class="scanlines"></div>
  <div class="app">
    <header>
      <div>
        <h1>CYBER SEQUENCER</h1>
        <div class="subtitle">极简方块音序器 · 本地音频合成 · 赛博朋克风格</div>
      </div>
    </header>

    <section class="transport">
      <div class="control-group">
        <button id="playBtn" class="primary">▶ 播放</button>
      </div>
      <div class="control-group">
        <label for="bpm">BPM</label>
        <input id="bpm" type="range" min="40" max="220" value="120">
        <span id="bpmVal">120</span>
      </div>
      <div class="control-group">
        <label for="swing">摇摆</label>
        <input id="swing" type="range" min="0" max="80" value="0">
        <span id="swingVal">0%</span>
      </div>
      <div class="control-group">
        <label for="volume">音量</label>
        <input id="volume" type="range" min="0" max="100" value="70">
        <span id="volVal">70%</span>
      </div>
      <div class="control-group">
        <button id="clearBtn" class="danger">清空</button>
      </div>
    </section>

    <div id="sequencer" class="sequencer"></div>
    <div class="beat-markers">
      <span></span>
      <div class="beat-numbers" id="beatNumbers"></div>
    </div>

    <section class="storage">
      <button id="saveBtn">保存到本地</button>
      <button id="loadBtn">读取本地</button>
      <button id="exportBtn">导出 JSON</button>
      <label for="importFile" style="margin:0;">导入 JSON</label>
      <input id="importFile" type="file" accept=".json,application/json">
    </section>

    <footer class="app-footer">
      所有数据保存在浏览器 localStorage 中，刷新页面不会丢失。
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    (function() {
      const ROWS = 8;
      const STEPS = 16;
      const LOOKAHEAD = 0.1; // 秒
      const SCHEDULE_AHEAD = 0.15;

      // 8 行对应 C 小调五声音阶，从低到高
      const SCALE_FREQS = [
        261.63, // C4
        311.13, // Eb4
        349.23, // F4
        392.00, // G4
        466.16, // Bb4
        523.25, // C5
        622.25, // Eb5
        698.46  // F5
      ];

      const TIMBRES = [
        { id: 'sine', label: '正弦波' },
        { id: 'square', label: '方波' },
        { id: 'sawtooth', label: '锯齿波' },
        { id: 'triangle', label: '三角波' },
        { id: 'noise', label: '噪声' },
        { id: 'kick', label: '底鼓' },
        { id: 'snare', label: '军鼓' },
        { id: 'hihat', label: '踩镲' }
      ];

      const DEFAULT_STATE = {
        bpm: 120,
        swing: 0,
        volume: 70,
        grid: Array.from({ length: ROWS }, () => Array(STEPS).fill(false)),
        timbres: Array(ROWS).fill('square')
      };

      let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      let audioCtx = null;
      let masterGain = null;
      let isPlaying = false;
      let currentStep = -1;
      let nextNoteTime = 0;
      let stepIndex = 0;
      let timerID = null;

      const sequencerEl = document.getElementById('sequencer');
      const beatNumbersEl = document.getElementById('beatNumbers');
      const playBtn = document.getElementById('playBtn');
      const bpmInput = document.getElementById('bpm');
      const bpmVal = document.getElementById('bpmVal');
      const swingInput = document.getElementById('swing');
      const swingVal = document.getElementById('swingVal');
      const volInput = document.getElementById('volume');
      const volVal = document.getElementById('volVal');
      const clearBtn = document.getElementById('clearBtn');
      const saveBtn = document.getElementById('saveBtn');
      const loadBtn = document.getElementById('loadBtn');
      const exportBtn = document.getElementById('exportBtn');
      const importFile = document.getElementById('importFile');
      const toastEl = document.getElementById('toast');

      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = state.volume / 100;
        masterGain.connect(audioCtx.destination);
      }

      function resumeAudio() {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function updateVolume() {
        if (masterGain) masterGain.gain.value = state.volume / 100;
      }

      // 音色合成
      function createNoiseBuffer() {
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        return buffer;
      }

      function playTone(timbre, freq, time, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = timbre;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(masterGain);

        const d = duration || 0.15;
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.35, time + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, time + d);
        osc.start(time);
        osc.stop(time + d + 0.02);
      }

      function playNoise(time, duration, filterType, filterFreq) {
        const buffer = createNoiseBuffer();
        const src = audioCtx.createBufferSource();
        src.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = filterType || 'lowpass';
        filter.frequency.value = filterFreq || 1000;
        const gain = audioCtx.createGain();
        src.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);

        const d = duration || 0.15;
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.35, time + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, time + d);
        src.start(time);
        src.stop(time + d + 0.02);
      }

      function playKick(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.15);
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.8, time + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(time);
        osc.stop(time + 0.2);
      }

      function playSnare(time) {
        playNoise(time, 0.12, 'bandpass', 1800);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = 180;
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.25, time + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(time);
        osc.stop(time + 0.12);
      }

      function playHiHat(time) {
        playNoise(time, 0.05, 'highpass', 8000);
      }

      function playRow(row, time) {
        const timbre = state.timbres[row];
        const freq = SCALE_FREQS[row];
        switch (timbre) {
          case 'sine':
          case 'square':
          case 'sawtooth':
          case 'triangle':
            playTone(timbre, freq, time, 0.18);
            break;
          case 'noise':
            playNoise(time, 0.18, 'lowpass', freq * 2);
            break;
          case 'kick':
            playKick(time);
            break;
          case 'snare':
            playSnare(time);
            break;
          case 'hihat':
            playHiHat(time);
            break;
        }
      }

      function stepTime() {
        const secondsPerBeat = 60 / state.bpm;
        const base = secondsPerBeat / 4; // 16分音符
        const swingRatio = state.swing / 100;
        // 偶数步（第2、4...个16分音符）延迟
        if (stepIndex % 2 === 1) {
          return base + base * swingRatio * 0.5;
        }
        return base - base * swingRatio * 0.33;
      }

      function scheduleStep(step, time) {
        // 更新 UI
        const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
        setTimeout(() => {
          setCurrentStep(step);
        }, delay);

        for (let r = 0; r < ROWS; r++) {
          if (state.grid[r][step]) {
            playRow(r, time);
          }
        }
      }

      function advance() {
        nextNoteTime += stepTime();
        stepIndex = (stepIndex + 1) % STEPS;
      }

      function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
          scheduleStep(stepIndex, nextNoteTime);
          advance();
        }
      }

      function start() {
        initAudio();
        resumeAudio();
        if (isPlaying) return;
        isPlaying = true;
        stepIndex = 0;
        nextNoteTime = audioCtx.currentTime + 0.05;
        timerID = setInterval(scheduler, LOOKAHEAD * 1000);
        playBtn.textContent = '⏸ 暂停';
        playBtn.classList.add('active');
      }

      function stop() {
        if (!isPlaying) return;
        isPlaying = false;
        clearInterval(timerID);
        timerID = null;
        playBtn.textContent = '▶ 播放';
        playBtn.classList.remove('active');
        setCurrentStep(-1);
      }

      function togglePlay() {
        if (isPlaying) stop(); else start();
      }

      function setCurrentStep(step) {
        if (currentStep === step) return;
        const prev = currentStep;
        currentStep = step;
        if (prev >= 0) {
          const cells = sequencerEl.querySelectorAll(`[data-step="${prev}"]`);
          cells.forEach(c => c.classList.remove('current'));
        }
        if (step >= 0) {
          const cells = sequencerEl.querySelectorAll(`[data-step="${step}"]`);
          cells.forEach(c => c.classList.add('current'));
        }
      }

      function buildGrid() {
        sequencerEl.innerHTML = '';
        beatNumbersEl.innerHTML = '';

        for (let s = 0; s < STEPS; s++) {
          const span = document.createElement('span');
          span.textContent = (s % 4 === 0) ? (s / 4 + 1) : '';
          beatNumbersEl.appendChild(span);
        }

        for (let r = 0; r < ROWS; r++) {
          const row = document.createElement('div');
          row.className = 'row';

          const head = document.createElement('div');
          head.className = 'row-head';

          const label = document.createElement('span');
          label.className = 'row-label';
          label.textContent = 'R' + (r + 1);

          const timbreSelect = document.createElement('select');
          timbreSelect.className = 'row-timbre';
          timbreSelect.setAttribute('aria-label', '第 ' + (r + 1) + ' 行音色');
          TIMBRES.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.id;
            opt.textContent = t.label;
            if (state.timbres[r] === t.id) opt.selected = true;
            timbreSelect.appendChild(opt);
          });
          timbreSelect.addEventListener('change', () => {
            state.timbres[r] = timbreSelect.value;
          });

          head.appendChild(label);
          head.appendChild(timbreSelect);
          row.appendChild(head);

          const steps = document.createElement('div');
          steps.className = 'steps';
          for (let s = 0; s < STEPS; s++) {
            const cell = document.createElement('button');
            cell.className = 'cell' + (state.grid[r][s] ? ' active' : '');
            cell.setAttribute('aria-label', '行 ' + (r + 1) + ' 第 ' + (s + 1) + ' 步');
            cell.dataset.row = r;
            cell.dataset.step = s;
            cell.addEventListener('click', () => {
              initAudio();
              resumeAudio();
              state.grid[r][s] = !state.grid[r][s];
              cell.classList.toggle('active', state.grid[r][s]);
              // 触发即时试听
              if (state.grid[r][s]) playRow(r, audioCtx.currentTime);
            });
            steps.appendChild(cell);
          }
          row.appendChild(steps);
          sequencerEl.appendChild(row);
        }
      }

      function refreshGrid() {
        // 仅刷新单元格活跃状态，保留 DOM 结构
        for (let r = 0; r < ROWS; r++) {
          for (let s = 0; s < STEPS; s++) {
            const cell = sequencerEl.querySelector(`.cell[data-row="${r}"][data-step="${s}"]`);
            if (cell) cell.classList.toggle('active', state.grid[r][s]);
          }
        }
        // 刷新音色选择
        sequencerEl.querySelectorAll('.row-timbre').forEach((sel, i) => {
          sel.value = state.timbres[i];
        });
      }

      function updateControls() {
        bpmInput.value = state.bpm;
        bpmVal.textContent = state.bpm;
        swingInput.value = state.swing;
        swingVal.textContent = state.swing + '%';
        volInput.value = state.volume;
        volVal.textContent = state.volume + '%';
        updateVolume();
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(() => toastEl.classList.remove('show'), 2000);
      }

      function saveLocal() {
        try {
          localStorage.setItem('cyberSequencer_state', JSON.stringify(state));
          showToast('已保存到本地');
        } catch (e) {
          showToast('保存失败：' + e.message);
        }
      }

      function loadLocal() {
        try {
          const raw = localStorage.getItem('cyberSequencer_state');
          if (!raw) { showToast('没有本地存档'); return; }
          const parsed = JSON.parse(raw);
          applyState(parsed);
          showToast('已读取本地存档');
        } catch (e) {
          showToast('读取失败：' + e.message);
        }
      }

      function exportJSON() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cyber-sequencer-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('已导出 JSON');
      }

      function importJSON(file) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            applyState(parsed);
            showToast('导入成功');
          } catch (e) {
            showToast('导入失败：' + e.message);
          }
        };
        reader.readAsText(file);
      }

      function applyState(parsed) {
        if (parsed && typeof parsed === 'object') {
          state.bpm = Math.min(220, Math.max(40, Number(parsed.bpm) || 120));
          state.swing = Math.min(80, Math.max(0, Number(parsed.swing) || 0));
          state.volume = Math.min(100, Math.max(0, Number(parsed.volume) || 70));
          if (Array.isArray(parsed.grid) && parsed.grid.length === ROWS &&
              parsed.grid.every(row => Array.isArray(row) && row.length === STEPS)) {
            state.grid = parsed.grid.map(row => row.map(v => !!v));
          }
          if (Array.isArray(parsed.timbres) && parsed.timbres.length === ROWS) {
            state.timbres = parsed.timbres.map(t => TIMBRES.some(x => x.id === t) ? t : 'square');
          }
          updateControls();
          refreshGrid();
        }
      }

      function clearGrid() {
        state.grid = Array.from({ length: ROWS }, () => Array(STEPS).fill(false));
        refreshGrid();
        showToast('已清空');
      }

      // 事件绑定
      playBtn.addEventListener('click', togglePlay);

      bpmInput.addEventListener('input', () => {
        state.bpm = Number(bpmInput.value);
        bpmVal.textContent = state.bpm;
      });

      swingInput.addEventListener('input', () => {
        state.swing = Number(swingInput.value);
        swingVal.textContent = state.swing + '%';
      });

      volInput.addEventListener('input', () => {
        state.volume = Number(volInput.value);
        volVal.textContent = state.volume + '%';
        updateVolume();
      });

      clearBtn.addEventListener('click', clearGrid);
      saveBtn.addEventListener('click', saveLocal);
      loadBtn.addEventListener('click', loadLocal);
      exportBtn.addEventListener('click', exportJSON);
      importFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) importJSON(file);
        importFile.value = '';
      });

      // 键盘快捷键：空格播放/暂停
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'SELECT' && e.target.tagName !== 'INPUT') {
          e.preventDefault();
          togglePlay();
        }
      });

      // 初始化
      buildGrid();
      updateControls();
      // 页面加载时自动读取本地存档
      const auto = localStorage.getItem('cyberSequencer_state');
      if (auto) {
        try { applyState(JSON.parse(auto)); } catch (e) {}
      }
    })();
  </script>
</body>
</html>
