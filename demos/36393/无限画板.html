  if(e.key==='Shift'){S.shiftDown=true;return}
  if(e.key==='Alt'){S.altDown=true;return}
  if((e.key==='t'||e.key==='T')&&!e.ctrlKey&&!e.metaKey){if(isEditing())return;e.preventDefault();toggleTextMode();return}
  if(e.key==='Escape'){
    if(_maskState){closeMask();updateShortcuts();return}
    if(_cutoutState){closeCutout();return}
    S.textMode=false;btnTxt.classList.remove('active');mb.style.display='none';vp.style.cursor='default';desel();return;
  }
  if(e.key==='Delete'||e.key==='Backspace'){if(isEditing())return;if(S.selIds.size>0){e.preventDefault();pushUndo();rmSelItems()}}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){S.spaceDown=false;if(!S.panning&&!S.textMode)vp.style.cursor='default';sp.style.opacity=''}
  if(e.key==='Control'||e.key==='Meta')S.ctrlDown=false;
  if(e.key==='Shift')S.shiftDown=false;
  if(e.key==='Alt'){S.altDown=false;hideAltMenuNow()}
});

// ═══════ Toolbar auto-hide ═══════
let _tbTimer=null;
function showTb(){clearTimeout(_tbTimer);toolbar.classList.add('visible')}
function hideTb(){clearTimeout(_tbTimer);_tbTimer=setTimeout(function(){if(!toolbar.matches(':hover'))toolbar.classList.remove('visible')},300)}
document.addEventListener('mousemove',e=>{if(e.clientY<50)showTb();else hideTb()});
toolbar.addEventListener('mouseenter',showTb);
toolbar.addEventListener('mouseleave',hideTb);

// ═══════ Dynamic Shortcuts Panel (上下文感知 + 操作时自动隐藏) ═══════
let _spHideTimer=null;
let _spHoverImg=false; // 光标是否在图片上
function skRow(key,desc){return '<div class="sk-row"><span class="sk-key">'+key+'</span><span class="sk-desc">'+desc+'</span></div>'}
function updateShortcuts(){
  if(_maskState){
    // 去水印蒙版模式
    sp.innerHTML=skRow('Ctrl+Z','撤销笔画')+skRow('Ctrl+⇧+Z','回退笔画')+skRow('涂抹','标记水印')+skRow('Esc','退出');
    sp.style.maxWidth='200px';
    return;
  }
  if(_cutoutState){
    // 抠图交互模式
    sp.innerHTML=skRow('左键','保留对象')+skRow('右键','排除区域')+skRow('Esc','退出');
    sp.style.maxWidth='200px';
    return;
  }
  if(_spHoverImg){
    // 仅在光标停在图片上时显示 Alt 抠图/去水印提示
    let rows=skRow('Alt','悬停弹出 抠图/去水印')+skRow('Ctrl+拖','移动');
    if(S.selIds.size>1)rows+=skRow('四角拖动','等比缩放');
    else rows+=skRow('四角拖动','缩放');
    sp.innerHTML=rows;
    sp.style.maxWidth='220px';
    return;
  }
  // 画布默认：不显示 Alt 抠图提示
  sp.innerHTML=skRow('T','添加文字')+skRow('Ctrl+拖动','移动元素')+skRow('Ctrl+滚轮','缩放画布')+skRow('Space+拖动','平移')+skRow('Shift+拖动','框选多个');
  sp.style.maxWidth='230px';
}
function hideSp(){clearTimeout(_spHideTimer);_spHideTimer=setTimeout(()=>sp.classList.add('hidden'),180)}
function showSp(){clearTimeout(_spHideTimer);sp.classList.remove('hidden')}
// 操作时隐藏快捷键面板
function spBusy(){hideSp()}
function spIdle(){showSp();updateShortcuts()}
// 检测光标是否在图片上
document.addEventListener('mousemove',e=>{
  const itEl=e.target.closest?e.target.closest('.ci-img'):null;
  const wasHover=_spHoverImg;
  _spHoverImg=!!itEl;
  if(wasHover!==_spHoverImg)updateShortcuts();
});
updateShortcuts();

// ═══════ Mouse ═══════
vp.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(e.target.classList.contains('rh')){e.preventDefault();startResize(e.target.dataset.dir,e);return}
  if(S.spaceDown){e.preventDefault();startPan(e);return}
  // Remove 3D interactivity when clicking outside 3D elements
  if(!e.target.closest('.ci-3d')){
    S.items.forEach(it=>{
      if(it.type==='3d'&&it.el.classList.contains('interactive')){
        it.el.classList.remove('interactive');
        if(it.viewer3D)it.viewer3D.controls.enabled=false;
      }
    });
  }
  // Alt+click on image 已改为 Alt+hover 自动弹出（见 checkAltHover）
  if(S.altDown){
    // 如果点击的是Alt菜单本身，让按钮点击正常触发
    if(altMenu.contains(e.target))return;
    e.preventDefault();
    const itEl=e.target.closest('.ci');
    if(!itEl){
      // Alt+drag on empty: start alt box select
      startBoxSel(e,true);return;
    }else{
      // Alt+点击图片：若已在多选中则对全部操作，否则只选此图并弹出菜单
      const it=itByEl(e.target);
      if(it&&it.type==='image'){
        if(!S.selIds.has(it.id)){
          S.selIds.forEach(sid=>{const t=getIt(sid);if(t&&t.type==='text'&&t.el.classList.contains('editing'))stopEdit(t)});
          S.selIds.clear();S.selIds.add(it.id);it.el.style.zIndex=S.nzi++;updSelOv();
        }
        showAltMenu(e.clientX,e.clientY);
        return;
      }
    }
  }
  if(S.shiftDown&&!e.target.closest('.ci')){e.preventDefault();startBoxSel(e);return}
  const itEl=e.target.closest('.ci');
  if(S.textMode&&!itEl){
    e.preventDefault(); // CRITICAL: prevent browser from stealing focus
    pushUndo(); // 撤销支持
    const w=s2w(e.clientX,e.clientY);addText(w.x,w.y);
    S.textMode=false;btnTxt.classList.remove('active');mb.style.display='none';vp.style.cursor='default';return;
  }
  if(itEl){
    if(S.textMode){S.textMode=false;btnTxt.classList.remove('active');mb.style.display='none';vp.style.cursor='default'}
    const it=itByEl(e.target);if(!it)return;
    if(S.shiftDown){if(S.selIds.has(it.id)){S.selIds.delete(it.id)}else{S.selIds.add(it.id);it.el.style.zIndex=S.nzi++}updSelOv();return}
    if(S.ctrlDown){
      if(!S.selIds.has(it.id)){S.selIds.add(it.id);it.el.style.zIndex=S.nzi++;updSelOv()}
      S.selIds.forEach(sid=>{const t=getIt(sid);if(t&&t.type==='text'&&t.el.classList.contains('editing'))stopEdit(t)});
      e.preventDefault();startDrag(e);
    }else{
      selItem(it.id);
      if(it.type==='text'){
        if(!it.el.classList.contains('editing')){setTimeout(()=>startEdit(it),0)}
        else if(document.activeElement!==it.el){setTimeout(()=>it.el.focus(),0)}
      }
    }
    return;
  }
  desel();
});

document.addEventListener('mousemove',e=>{
  if(S.resizing){doResize(e);return}if(S.panning){doPan(e);return}if(S.dragging){doDrag(e);return}if(S.boxSel){doBoxSel(e);return}
  // Alt+hover 自动弹出抠图/去水印菜单
  if(S.altDown&&!_maskState){checkAltHover(e)}
  if(S.spaceDown)vp.style.cursor='grab';else if(S.textMode)vp.style.cursor='text';else if(S.altDown)vp.style.cursor='crosshair';else if(S.shiftDown)vp.style.cursor='crosshair';
  else{const itEl=e.target.closest('.ci');vp.style.cursor=(itEl&&S.ctrlDown)?'move':'default'}
});

document.addEventListener('mouseup',e=>{
  if(S.resizing){S.resizing=false;if(S.selIds.size===1){const it=getIt([...S.selIds][0]);if(it&&it.type==='text')autoH(it)}spIdle()}
  if(S.panning){S.panning=false;vp.style.cursor=S.spaceDown?'grab':(S.textMode?'text':'default');spIdle()}
  if(S.dragging){S.dragging=false;S.dragStarts=null;spIdle()}
  if(S.boxSel){endBoxSel(e);spIdle()}
});

vp.addEventListener('wheel',doZoom,{passive:false});

// ═══════ Drag & Drop ═══════
let dc=0;
vp.addEventListener('dragenter',e=>{e.preventDefault();dc++;dz.classList.add('show')});
vp.addEventListener('dragover',e=>e.preventDefault());
vp.addEventListener('dragleave',e=>{e.preventDefault();dc--;if(dc<=0){dc=0;dz.classList.remove('show')}});
vp.addEventListener('drop',e=>{e.preventDefault();dc=0;dz.classList.remove('show');if(e.dataTransfer.files.length)loadFiles(e.dataTransfer.files,e.clientX,e.clientY)});

// ═══════ Paste ═══════
document.addEventListener('paste',e=>{
  if(isEditing())return;
  const cd=e.clipboardData;if(!cd)return;
  // Check for images first
  const items=cd.items;
  if(items){
    for(let i=0;i<items.length;i++){
      if(items[i].type.indexOf('image')!==-1){
        const blob=items[i].getAsFile();
        pushUndo(); // 撤销支持
        _dropPos={x:_lastMouseWorld.x,y:_lastMouseWorld.y};
        processFile(blob);return;
      }
    }
  }
  // Check for text
  const text=cd.getData('text/plain');
  if(text&&text.trim()){
    pushUndo(); // 撤销支持
    const it=mkItem('text',_lastMouseWorld.x,_lastMouseWorld.y,240,40);
    it.el.style.fontSize=S.fontSize+'px';it.el.style.color=S.fontColor;
    it.el.style.fontWeight=S.fontBold?'bold':'normal';
    it.el.style.fontFamily='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
    it.fontSize=S.fontSize;it.color=S.fontColor;it.bold=S.fontBold;
    it.el.innerText=text;
    autoH(it);selItem(it.id);
  }
});

// Track mouse position for paste placement
vp.addEventListener('mousemove',e=>{_lastMouseWorld=s2w(e.clientX,e.clientY)});

// ═══════ Text input auto-height ═══════
cl.addEventListener('input',e=>{const itEl=e.target.closest('.ci-txt');if(!itEl)return;const it=getIt(+itEl.dataset.id);if(it)autoH(it)});

// ═══════ Export PNG ═══════
function exportPNG(){
  if(S.items.length===0)return;et.style.display='block';
  setTimeout(()=>{try{_doExport()}catch(err){console.error(err);et.style.display='none'}},60);
}
function _doExport(){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  S.items.forEach(it=>{minX=Math.min(minX,it.x);minY=Math.min(minY,it.y);maxX=Math.max(maxX,it.x+it.width);maxY=Math.max(maxY,it.y+it.height)});
  const pad=80;minX-=pad;minY-=pad;maxX+=pad;maxY+=pad;
  const cw=maxX-minX,ch=maxY-minY,ex=Math.min(3,12000/Math.max(cw,ch,1));
  const cvs=document.createElement('canvas');cvs.width=Math.ceil(cw*ex);cvs.height=Math.ceil(ch*ex);
  const ctx=cvs.getContext('2d');ctx.scale(ex,ex);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cw,ch);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  S.items.forEach(it=>{
    const ix=it.x-minX,iy=it.y-minY;
    if(it.type==='image'){const img=it.el.querySelector('img');if(img&&img.complete&&img.naturalWidth>0)ctx.drawImage(img,ix,iy,it.width,it.height)}
    else if(it.type==='video'){const video=it.el.querySelector('video');if(video&&video.readyState>=2){try{ctx.drawImage(video,ix,iy,it.width,it.height)}catch(e){}}}
    else if(it.type==='3d'){if(it.viewer3D&&it.viewer3D.renderer){try{ctx.drawImage(it.viewer3D.renderer.domElement,ix,iy,it.width,it.height)}catch(e){}}}
    else if(it.type==='text')_renderTxt(ctx,it,ix,iy);
  });
  cvs.toBlob(blob=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='canvas-'+Date.now()+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);et.style.display='none'},'image/png');
}
function _renderTxt(ctx,it,ox,oy){
  const fs=it.fontSize||28,bold=it.bold?'bold ':'';
  const ff='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
  ctx.font=bold+fs+'px '+ff;ctx.fillStyle=it.color||'#000000';ctx.textBaseline='top';
  const lh=fs*1.45,px=8,py=4,maxW=it.width-px*2;if(maxW<=0)return;
  const text=it.el.innerText||it.el.textContent||'';const paras=text.split('\n');let cy=oy+py;
  paras.forEach(para=>{if(para===''){cy+=lh;return}const chars=[...para];let line='';
    for(let i=0;i<chars.length;i++){const ch=chars[i];const test=line+ch;if(ctx.measureText(test).width>maxW&&line!==''){ctx.fillText(line,ox+px,cy);line=ch;cy+=lh}else{line=test}}
    if(line){ctx.fillText(line,ox+px,cy);cy+=lh}
  });
}

// ═══════ Init ═══════
function init(){
  S.ox=window.innerWidth/2;S.oy=window.innerHeight/2;applyTf();updBg();
  // 从保存的数据恢复
  if(window._savedData&&window._savedData.items){
    const d=window._savedData;
    S.scale=d.scale||1;S.ox=d.ox||S.ox;S.oy=d.oy||S.oy;
    applyTf();updBg();
    d.items.forEach(item=>{
      const el=document.createElement('div');
      el.className='ci ci-'+(item.type==='image'?'img':(item.type==='video'?'video':(item.type==='3d'?'3d':'txt')));
      const id=S.nid++;el.dataset.id=id;
      el.style.left=item.x+'px';el.style.top=item.y+'px';
      el.style.width=item.width+'px';el.style.height=item.height+'px';el.style.zIndex=S.nzi++;
      const it={id,type:item.type,x:item.x,y:item.y,width:item.width,height:item.height,el};
      if(item.type==='image'){
        const img=document.createElement('img');img.src=item.src;img.draggable=false;
        el.appendChild(img);it.imgSrc=item.src;
      }else if(item.type==='video'){
        const v=document.createElement('video');v.src=item.src;v.controls=true;v.style.width='100%';v.style.height='100%';
        el.appendChild(v);it.videoSrc=item.src;
      }else if(item.type==='3d'){
        it.modelData=item.src;it.modelExt=item.ext;
        const badge=document.createElement('div');badge.className='badge-3d';badge.textContent='3D · '+item.ext.toUpperCase();el.appendChild(badge);
        ensureThree().then(M=>init3DViewer(it,M)).catch(e=>console.error('3D restore error:',e));
      }else if(item.type==='text'){
        el.style.fontSize=item.fontSize+'px';el.style.color=item.color;el.style.fontWeight=item.bold?'bold':'normal';
        el.style.fontFamily='-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif';
        el.innerText=item.content;it.fontSize=item.fontSize;it.color=item.color;it.bold=item.bold;
      }
      S.items.push(it);cl.appendChild(el);
    });
  }
}
init();window.addEventListener('resize',()=>{
  updBg();updSelOv();
  // 抠图交互模式：重新计算图片显示尺寸并重绘
  if(_cutoutState&&_cutoutState.imgCanvas){
    const cs=_cutoutState;
    const nw=cs.imgW,nh=cs.imgH;
    const maxW=window.innerWidth-80,maxH=window.innerHeight-120;
    let dw=nw,dh=nh;
    if(dw>maxW){dh=dh*(maxW/dw);dw=maxW}
    if(dh>maxH){dw=dw*(maxH/dh);dh=maxH}
    cs.dispW=dw;cs.dispH=dh;
    cs.imgX=(window.innerWidth-dw)/2;cs.imgY=(window.innerHeight-dh)/2+10;
    cs.scale=dw/nw;
    cutoutCv.width=window.innerWidth;cutoutCv.height=window.innerHeight;
    drawCutoutCanvas();
  }
});

})();
