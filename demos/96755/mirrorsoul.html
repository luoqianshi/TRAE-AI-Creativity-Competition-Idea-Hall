<script>
// Tarot cards data
const tarotCards = [
  { emoji: '🌟', name: '星星', advice: '今天适合相信自己的直觉。保持希望，你的愿望正在靠近。今天的小确幸可能来自一个陌生人的善意。', tags: ['希望', '灵感', '治愈'] },
  { emoji: '☀️', name: '太阳', advice: '能量充沛的一天！适合做重要决定或开启新计划。自信是你的武器，勇敢表达你的想法。', tags: ['成功', '活力', '喜悦'] },
  { emoji: '🌙', name: '月亮', advice: '有些事还看不清楚，不要急于下结论。倾听内心的声音，今天适合独处和内省。', tags: ['直觉', '潜意识', '等待'] },
  { emoji: '💀', name: '死神', advice: '不是结束，而是蜕变。放下不再适合你的东西，无论是习惯、关系还是想法，为新的可能腾出空间。', tags: ['转变', '放下', '新生'] },
  { emoji: '⚖️', name: '正义', advice: '因果平衡的一天。你过去的付出会得到回报，做出决定时要考虑长远影响。', tags: ['公平', '因果', '决策'] },
  { emoji: '❤️', name: '恋人', advice: '重要的选择正在面前。跟随内心的声音，无论是爱情还是人生方向，真诚比权衡更重要。', tags: ['爱情', '选择', '真诚'] },
  { emoji: '👑', name: '皇帝', advice: '掌控感回归。今天适合规划和执行，用理性和纪律来应对挑战。你的领导力会被看见。', tags: ['权威', '秩序', '掌控'] },
  { emoji: '🧙', name: '魔术师', advice: '你拥有实现目标的所有资源。创造力爆棚，把想法变成行动的最佳时机。', tags: ['创造', '行动', '资源'] },
  { emoji: '🌊', name: '倒吊人', advice: '换个角度看问题。暂停不是放弃，而是为了更好地前进。今天适合停下来反思。', tags: ['暂停', '视角', '牺牲'] },
];

let currentMode = 'tarot';
let coinTosses = [];
let photoCount = 0;

// === Mode Selection ===
function selectMode(chip, mode) {
  document.querySelectorAll('.mode-chip').forEach(c => c.classList.remove('selected'));
  chip.classList.add('selected');
  currentMode = mode;
  document.getElementById('tarotMode').style.display = mode === 'tarot' ? 'block' : 'none';
  document.getElementById('coinMode').style.display = mode === 'coin' ? 'block' : 'none';
  document.getElementById('photoMode').style.display = mode === 'photo' ? 'block' : 'none';
  if (mode === 'tarot') initTarot();
}

// === Tarot ===
function initTarot() {
  const grid = document.getElementById('cardsGrid');
  document.getElementById('tarotResult').classList.remove('show');
  document.getElementById('tarotLoading').classList.remove('show');
  document.getElementById('shuffleBtn').style.display = 'inline-block';

  const shuffled = [...tarotCards].sort(() => Math.random() - 0.5).slice(0, 3);
  grid.innerHTML = shuffled.map((card, i) => `
    <div class="tarot-card" id="card${i}" onclick="flipCard(${i})">
      <div class="tarot-card-inner">
        <div class="tarot-card-front">
          <span style="font-size:18px">✦</span>
          <span style="font-size:10px;color:var(--accent);margin-top:2px">?</span>
        </div>
        <div class="tarot-card-back">
          <div class="card-emoji">${card.emoji}</div>
          <div class="card-name">${card.name}</div>
        </div>
      </div>
    </div>
  `).join('');

  // Store card data for flip
  grid._cards = shuffled;
}

function flipCard(idx) {
  const cardEl = document.getElementById('card' + idx);
  if (cardEl.classList.contains('flipped')) return;

  cardEl.classList.add('flipped');

  const card = document.getElementById('cardsGrid')._cards[idx];
  const result = document.getElementById('tarotResult');
  result.innerHTML = `
    <div class="fortune-card-name">${card.name}</div>
    <div class="fortune-card-emoji">${card.emoji}</div>
    <div class="fortune-advice">${card.advice}</div>
    <div class="fortune-tags">
      ${card.tags.map(t => `<span class="fortune-tag">${t}</span>`).join('')}
    </div>
  `;
  result.classList.add('show');
}

function reshuffleTarot() {
  document.querySelectorAll('.tarot-card').forEach(c => c.classList.remove('flipped'));
  document.getElementById('tarotResult').classList.remove('show');
  initTarot();
}

// === Coin Toss ===
function tossCoin(num) {
  if (coinTosses.length >= 3) return;

  const coin = document.getElementById('coin' + num);
  coin.classList.add('tossing');
  coin.style.pointerEvents = 'none';

  setTimeout(() => {
    coin.classList.remove('tossing');
    coin.style.pointerEvents = 'auto';
    const result = Math.random() > 0.5 ? '正面' : '反面';
    coin.textContent = result === '正面' ? '☀️' : '🌑';
    coinTosses.push(result);

    const resultDiv = document.getElementById('coinResult');
    resultDiv.textContent = coinTosses.map((r, i) => `第${i+1}次: ${r}`).join('  |  ');

    if (coinTosses.length === 3) {
      const positiveCount = coinTosses.filter(r => r === '正面').length;
      let advice;
      if (positiveCount === 3) {
        advice = '三圣杯（笑杯）—— 神明对你微笑，所问之事将顺利达成。大胆前行吧。';
      } else if (positiveCount === 2) {
        advice = '两正一反（圣杯）—— 此乃吉兆，神明应允。事情会朝着好的方向发展，但需要你付出努力。';
      } else if (positiveCount === 1) {
        advice = '一正两反（阴杯）—— 时机未到，或方向有偏。建议重新审视问题，等待更好的时机。';
      } else {
        advice = '三反（怒杯）—— 神明不悦，此事不宜。暂停当前计划，反思初心，改日再问。';
      }
      document.getElementById('coinAdvice').textContent = advice;
    }
  }, 1000);
}

function resetCoins() {
  coinTosses = [];
  document.getElementById('coin1').textContent = '🪙';
  document.getElementById('coin2').textContent = '🪙';
  document.getElementById('coinResult').textContent = '';
  document.getElementById('coinAdvice').textContent = '';
}

// === Photo Divination ===
const photoScenes = [
  { emoji: '🌿', name: '绿植', desc: '你拍下的绿色植物暗示着成长与生机。今天适合关注健康和个人发展，播下一颗种子，耐心等待它发芽。' },
  { emoji: '☕', name: '咖啡杯', desc: '日常的温暖物件。你也许需要放慢脚步，享受当下。一杯咖啡的时间里，答案会自动浮现。' },
  { emoji: '📖', name: '书本', desc: '知识与智慧在召唤你。今天适合学习或阅读，书中的某一页可能会给你关键的启发。' },
  { emoji: '🐱', name: '小动物', desc: '小动物是灵性的使者。它提醒你保持好奇心和柔软，用直觉而非理性来感知今天的世界。' },
  { emoji: '🌅', name: '天空', desc: '广阔的天空暗示着无限可能。放下对细节的执着，从更高的视角看待问题，答案就在那里。' },
  { emoji: '💧', name: '水', desc: '水代表情感流动。今天适合处理人际关系，表达真实的感受。让情绪像水一样自然流淌。' },
];

function simulatePhoto() {
  if (photoCount >= 3) return;

  photoCount++;
  document.getElementById('photoCountText').textContent = `已拍 ${photoCount}/3 张`;

  // Simulate a "photo"
  const scene = photoScenes[Math.floor(Math.random() * photoScenes.length)];
  const preview = document.getElementById('photoPreview');
  const upload = document.getElementById('photoUpload');

  upload.style.display = 'none';
  preview.classList.add('show');

  // Create a colored placeholder
  const canvas = document.createElement('canvas');
  canvas.width = 280; canvas.height = 280;
  const ctx = canvas.getContext('2d');
  const hue = Math.floor(Math.random() * 360);
  ctx.fillStyle = `hsl(${hue}, 30%, 15%)`;
  ctx.fillRect(0, 0, 280, 280);
  ctx.font = '80px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(scene.emoji, 140, 130);
  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#C084FC';
  ctx.fillText(scene.name, 140, 185);
  document.getElementById('photoImg').src = canvas.toDataURL();

  // Update dots
  document.querySelectorAll('#photoDots .photo-dot').forEach((dot, i) => {
    if (i < photoCount) dot.classList.add('filled');
  });

  // If all 3 photos taken, show AI result
  if (photoCount >= 3) {
    document.getElementById('photoLoading').classList.add('show');
    setTimeout(() => {
      document.getElementById('photoLoading').classList.remove('show');
      const result = document.getElementById('photoResult');
      const chosen = photoScenes[Math.floor(Math.random() * photoScenes.length)];
      result.innerHTML = `
        <div class="fortune-card-name">${chosen.name} 的启示</div>
        <div class="fortune-card-emoji">${chosen.emoji}</div>
        <div class="fortune-advice">${chosen.desc}</div>
        <div class="fortune-tags">
          <span class="fortune-tag">今日运势</span>
          <span class="fortune-tag">${['宜', '慎', '吉'][Math.floor(Math.random()*3)]}</span>
          <span class="fortune-tag">生活记录</span>
        </div>
      `;
      result.classList.add('show');
      document.getElementById('photoResetBtn').style.display = 'inline-block';
    }, 1500);
  } else {
    // Show upload again for next photo
    setTimeout(() => {
      preview.classList.remove('show');
      upload.style.display = 'flex';
    }, 1200);
  }
}

function resetPhotos() {
  photoCount = 0;
  document.getElementById('photoCountText').textContent = '已拍 0/3 张';
  document.getElementById('photoUpload').style.display = 'flex';
  document.getElementById('photoPreview').classList.remove('show');
  document.getElementById('photoResult').classList.remove('show');
  document.getElementById('photoResetBtn').style.display = 'none';
  document.querySelectorAll('#photoDots .photo-dot').forEach(d => d.classList.remove('filled'));
}

// Init
initTarot();
</script>
