<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>「息」· 三分钟呼吸冥想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0a0f1a;
  --ink-mid:#121a2e;
  --ink-light:#1a2540;
  --moon:#e8e0d4;
  --moon-dim:#a09888;
  --breath:#5ba4a4;
  --breath-glow:#7ec8c8;
  --warm:#d4a574;
  --warm-dim:#b08858;
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
}
html,body{
  width:100%;height:100%;overflow:hidden;
  font-family:var(--sans);
  background:var(--ink);
  color:var(--moon);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ===== 背景氛围层 ===== */
.atmosphere{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  overflow:hidden;
}
.atmosphere::before{
  content:'';position:absolute;
  width:140%;height:140%;top:-20%;left:-20%;
  background:
    radial-gradient(ellipse 600px 600px at 50% 45%, rgba(91,164,164,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 400px 400px at 30% 60%, rgba(212,165,116,0.04) 0%, transparent 60%),
    radial-gradient(ellipse 300px 300px at 70% 30%, rgba(91,164,164,0.03) 0%, transparent 60%);
  animation:atmosFloat 20s ease-in-out infinite;
}
@keyframes atmosFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(2%,-1%) scale(1.02)}
  66%{transform:translate(-1%,2%) scale(0.98)}
}

/* 星尘粒子 */
.stardust{
  position:fixed;inset:0;z-index:0;pointer-events:none;
}
.stardust span{
  position:absolute;
  width:2px;height:2px;
  background:var(--moon);
  border-radius:50%;
  opacity:0;
  animation:twinkle var(--dur) var(--delay) ease-in-out infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(0.5)}
  50%{opacity:var(--op);transform:scale(1)}
}

/* ===== 页面容器 ===== */
.page{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  transition:opacity 1.2s ease, visibility 0s 1.2s;
}
.page.active{
  opacity:1;visibility:visible;
  transition:opacity 1.2s ease, visibility 0s 0s;
}

/* ===== 欢迎页 ===== */
.welcome-brand{
  text-align:center;
  animation:fadeUp 1.5s ease-out;
}
.brand-char{
  font-family:var(--serif);
  font-size:clamp(80px,20vw,140px);
  font-weight:200;
  color:var(--moon);
  line-height:1;
  letter-spacing:0.1em;
  margin-bottom:16px;
  text-shadow:0 0 60px rgba(91,164,164,0.15);
}
.brand-sub{
  font-family:var(--serif);
  font-size:clamp(14px,3.5vw,18px);
  font-weight:300;
  color:var(--moon-dim);
  letter-spacing:0.3em;
  margin-bottom:48px;
}
.brand-line{
  width:40px;height:1px;
  background:linear-gradient(90deg,transparent,var(--breath),transparent);
  margin:0 auto 32px;
}
.brand-slogan{
  font-family:var(--serif);
  font-size:clamp(15px,3.8vw,20px);
  font-weight:300;
  color:var(--moon-dim);
  letter-spacing:0.15em;
  margin-bottom:64px;
  opacity:0;
  animation:fadeUp 1.5s ease-out 0.6s forwards;
}

/* ===== 按钮 ===== */
.btn{
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;
  padding:16px 48px;
  font-family:var(--serif);
  font-size:16px;font-weight:400;
  letter-spacing:0.2em;
  color:var(--moon);
  background:transparent;
  border:1px solid rgba(232,224,212,0.2);
  border-radius:60px;
  cursor:pointer;
  overflow:hidden;
  transition:all 0.6s ease;
  opacity:0;
  animation:fadeUp 1.5s ease-out 1s forwards;
}
.btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(91,164,164,0.1),rgba(212,165,116,0.05));
  opacity:0;transition:opacity 0.6s ease;
  border-radius:60px;
}
.btn:hover::before,.btn:active::before{opacity:1}
.btn:hover{
  border-color:rgba(91,164,164,0.4);
  box-shadow:0 0 30px rgba(91,164,164,0.1);
  transform:translateY(-1px);
}
.btn:active{transform:translateY(0)}

.btn-small{
  padding:12px 36px;
  font-size:14px;
  letter-spacing:0.15em;
}

/* ===== 准备页 ===== */
.prepare-content{
  text-align:center;
  max-width:320px;
  padding:0 24px;
}
.prepare-step{
  margin-bottom:40px;
  opacity:0;
  animation:fadeUp 1s ease-out forwards;
}
.prepare-step:nth-child(1){animation-delay:0.3s}
.prepare-step:nth-child(2){animation-delay:0.8s}
.prepare-step:nth-child(3){animation-delay:1.3s}
.prepare-icon{
  font-size:32px;
  margin-bottom:14px;
  display:block;
}
.prepare-title{
  font-family:var(--serif);
  font-size:20px;font-weight:400;
  color:var(--moon);
  letter-spacing:0.1em;
  margin-bottom:10px;
}
.prepare-desc{
  font-size:14px;
  color:rgba(232,224,212,0.7);
  line-height:2;
  letter-spacing:0.05em;
}
.prepare-timer{
  margin-top:48px;
  font-family:var(--serif);
  font-size:14px;
  color:var(--breath);
  letter-spacing:0.15em;
  opacity:0;
  animation:fadeUp 1s ease-out 1.8s forwards;
}

/* ===== 冥想页 ===== */
.meditation-container{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  width:100%;height:100%;
  position:relative;
}

/* 呼吸圆环 */
.breath-circle-wrap{
  position:relative;
  width:clamp(200px,55vw,280px);
  height:clamp(200px,55vw,280px);
  display:flex;align-items:center;justify-content:center;
}
.breath-ring{
  position:absolute;inset:0;
  border-radius:50%;
  border:1px solid rgba(91,164,164,0.15);
  transition:all var(--breath-dur,4s) cubic-bezier(0.4,0,0.2,1);
}
.breath-ring-inner{
  position:absolute;
  inset:15%;
  border-radius:50%;
  border:1px solid rgba(91,164,164,0.1);
  transition:all var(--breath-dur,4s) cubic-bezier(0.4,0,0.2,1);
}
.breath-glow{
  position:absolute;
  inset:20%;
  border-radius:50%;
  background:radial-gradient(circle,rgba(91,164,164,0.08) 0%,transparent 70%);
  transition:all var(--breath-dur,4s) cubic-bezier(0.4,0,0.2,1);
  filter:blur(20px);
}
.breath-core{
  position:absolute;
  width:12px;height:12px;
  border-radius:50%;
  background:var(--breath);
  box-shadow:0 0 20px rgba(91,164,164,0.4),0 0 60px rgba(91,164,164,0.15);
  transition:all var(--breath-dur,4s) cubic-bezier(0.4,0,0.2,1);
}

/* 吸气状态 */
.breathing-in .breath-ring{
  transform:scale(1.15);
  border-color:rgba(91,164,164,0.35);
  box-shadow:0 0 40px rgba(91,164,164,0.08);
}
.breathing-in .breath-ring-inner{
  transform:scale(1.2);
  border-color:rgba(91,164,164,0.25);
}
.breathing-in .breath-glow{
  transform:scale(1.3);
  background:radial-gradient(circle,rgba(91,164,164,0.15) 0%,transparent 70%);
}
.breathing-in .breath-core{
  transform:scale(1.8);
  box-shadow:0 0 30px rgba(91,164,164,0.6),0 0 80px rgba(91,164,164,0.2);
}

/* 屏息状态 */
.breathing-hold .breath-ring{
  border-color:rgba(212,165,116,0.3);
  box-shadow:0 0 40px rgba(212,165,116,0.06);
}
.breathing-hold .breath-core{
  box-shadow:0 0 25px rgba(212,165,116,0.5),0 0 60px rgba(212,165,116,0.15);
  background:var(--warm);
}

/* 呼气状态 */
.breathing-out .breath-ring{
  transform:scale(0.9);
  border-color:rgba(91,164,164,0.1);
}
.breathing-out .breath-ring-inner{
  transform:scale(0.85);
}
.breathing-out .breath-glow{
  transform:scale(0.7);
  opacity:0.5;
}
.breathing-out .breath-core{
  transform:scale(0.8);
  box-shadow:0 0 15px rgba(91,164,164,0.3),0 0 40px rgba(91,164,164,0.1);
}

/* 呼吸文字 */
.breath-text{
  position:absolute;
  bottom:-60px;
  left:50%;transform:translateX(-50%);
  font-family:var(--serif);
  font-size:clamp(20px,5vw,26px);
  font-weight:400;
  letter-spacing:0.3em;
  color:var(--moon);
  white-space:nowrap;
  transition:opacity 0.8s ease;
  text-shadow:0 0 20px rgba(91,164,164,0.3);
}

/* 计时器 */
.meditation-timer{
  position:absolute;
  top:clamp(40px,8vh,80px);
  left:50%;transform:translateX(-50%);
  text-align:center;
}
.timer-text{
  font-family:var(--serif);
  font-size:clamp(28px,7vw,42px);
  font-weight:200;
  color:var(--moon);
  letter-spacing:0.1em;
  opacity:0.7;
}
.timer-label{
  font-size:11px;
  color:var(--moon-dim);
  letter-spacing:0.3em;
  margin-top:4px;
  opacity:0.5;
}

/* 轮次指示 */
.round-dots{
  position:absolute;
  bottom:clamp(30px,6vh,60px);
  display:flex;gap:12px;
  align-items:center;
}
.round-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:rgba(232,224,212,0.15);
  transition:all 0.6s ease;
}
.round-dot.done{
  background:var(--breath);
  box-shadow:0 0 8px rgba(91,164,164,0.3);
}
.round-dot.current{
  background:var(--breath);
  box-shadow:0 0 12px rgba(91,164,164,0.5);
  transform:scale(1.4);
}

/* ===== 结束页 ===== */
.end-content{
  text-align:center;
  max-width:320px;
  padding:0 24px;
}
.end-icon{
  font-size:48px;
  margin-bottom:24px;
  opacity:0;
  animation:fadeUp 1s ease-out 0.3s forwards;
}
.end-title{
  font-family:var(--serif);
  font-size:clamp(22px,5.5vw,28px);
  font-weight:300;
  color:var(--moon);
  letter-spacing:0.15em;
  margin-bottom:16px;
  opacity:0;
  animation:fadeUp 1s ease-out 0.6s forwards;
}
.end-message{
  font-size:14px;
  color:var(--moon-dim);
  line-height:2;
  letter-spacing:0.05em;
  margin-bottom:48px;
  opacity:0;
  animation:fadeUp 1s ease-out 0.9s forwards;
}
.end-stats{
  display:flex;gap:32px;
  justify-content:center;
  margin-bottom:48px;
  opacity:0;
  animation:fadeUp 1s ease-out 1.2s forwards;
}
.stat-item{text-align:center}
.stat-value{
  font-family:var(--serif);
  font-size:24px;font-weight:300;
  color:var(--breath);
  letter-spacing:0.05em;
}
.stat-label{
  font-size:11px;
  color:var(--moon-dim);
  letter-spacing:0.2em;
  margin-top:4px;
}
.end-actions{
  display:flex;flex-direction:column;gap:16px;
  align-items:center;
  opacity:0;
  animation:fadeUp 1s ease-out 1.5s forwards;
}
.btn-ghost{
  padding:10px 24px;
  font-family:var(--serif);
  font-size:13px;
  letter-spacing:0.15em;
  color:var(--moon-dim);
  background:transparent;
  border:none;
  cursor:pointer;
  transition:color 0.4s ease;
}
.btn-ghost:hover{color:var(--moon)}

/* ===== 底部信息 ===== */
.footer-info{
  position:fixed;
  bottom:12px;left:50%;transform:translateX(-50%);
  font-size:10px;
  color:rgba(232,224,212,0.2);
  letter-spacing:0.15em;
  white-space:nowrap;
  z-index:10;
}

/* ===== 音频控制 ===== */
.audio-toggle{
  position:fixed;
  top:16px;right:16px;
  width:36px;height:36px;
  border-radius:50%;
  border:1px solid rgba(232,224,212,0.1);
  background:rgba(10,15,26,0.6);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  z-index:20;
  transition:all 0.4s ease;
  color:var(--moon-dim);
  font-size:14px;
}
.audio-toggle:hover{
  border-color:rgba(232,224,212,0.25);
  color:var(--moon);
}
.audio-toggle.muted{opacity:0.4}

/* ===== 动画 ===== */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
@keyframes pulse{
  0%,100%{opacity:0.5}
  50%{opacity:1}
}

/* ===== 设置面板 ===== */
.settings-panel{
  position:fixed;
  bottom:0;left:0;right:0;
  background:linear-gradient(to top,var(--ink) 60%,transparent);
  padding:40px 24px 32px;
  z-index:15;
  transform:translateY(100%);
  transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);
}
.settings-panel.open{transform:translateY(0)}
.settings-title{
  font-family:var(--serif);
  font-size:14px;
  color:var(--moon-dim);
  letter-spacing:0.2em;
  text-align:center;
  margin-bottom:24px;
}
.settings-option{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid rgba(232,224,212,0.06);
}
.settings-option:last-child{border:none}
.settings-label{
  font-size:13px;
  color:var(--moon-dim);
  letter-spacing:0.05em;
}
.settings-value{
  display:flex;align-items:center;gap:8px;
}
.settings-btn{
  width:32px;height:32px;
  border-radius:50%;
  border:1px solid rgba(232,224,212,0.15);
  background:transparent;
  color:var(--moon-dim);
  font-size:14px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.3s ease;
}
.settings-btn:hover{
  border-color:rgba(91,164,164,0.4);
  color:var(--moon);
}
.settings-num{
  font-family:var(--serif);
  font-size:16px;
  color:var(--moon);
  min-width:24px;
  text-align:center;
}
.settings-unit{
  font-size:11px;
  color:var(--moon-dim);
  margin-left:2px;
}

/* ===== 进度弧 ===== */
.progress-arc{
  position:absolute;
  inset:-4px;
  border-radius:50%;
}
.progress-arc svg{
  width:100%;height:100%;
  transform:rotate(-90deg);
}
.progress-arc circle{
  fill:none;
  stroke-linecap:round;
  transition:stroke-dashoffset 1s linear;
}

/* ===== 倒计时覆盖 ===== */
.countdown-overlay{
  position:fixed;inset:0;z-index:25;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,15,26,0.9);
  opacity:0;visibility:hidden;
  transition:opacity 0.5s ease, visibility 0s 0.5s;
}
.countdown-overlay.active{
  opacity:1;visibility:visible;
  transition:opacity 0.5s ease, visibility 0s 0s;
}
.countdown-num{
  font-family:var(--serif);
  font-size:clamp(60px,18vw,100px);
  font-weight:200;
  color:var(--moon);
  animation:countPulse 1s ease-out;
}
@keyframes countPulse{
  0%{opacity:0;transform:scale(0.5)}
  50%{opacity:1;transform:scale(1.1)}
  100%{opacity:0.8;transform:scale(1)}
}

/* ===== 响应式微调 ===== */
@media(max-height:600px){
  .breath-circle-wrap{
    width:clamp(150px,40vw,200px);
    height:clamp(150px,40vw,200px);
  }
  .breath-text{bottom:-40px;font-size:14px}
  .meditation-timer{top:24px}
}
</style>
</head>
<body>

<!-- 背景氛围 -->
<div class="atmosphere"></div>
<div class="stardust" id="stardust"></div>

<!-- 音频开关 -->
<button class="audio-toggle" id="audioToggle" title="音效开关">♪</button>

<!-- ===== 欢迎页 ===== -->
<div class="page active" id="pageWelcome">
  <div class="welcome-brand">
    <div class="brand-char">息</div>
    <div class="brand-sub">三分钟呼吸冥想</div>
    <div class="brand-line"></div>
    <div class="brand-slogan">闭上眼，给自己三分钟</div>
    <button class="btn" id="btnStart">开始冥想</button>
  </div>
</div>

<!-- ===== 准备页 ===== -->
<div class="page" id="pagePrepare">
  <div class="prepare-content">
    <div class="prepare-step">
      <span class="prepare-icon">🪑</span>
      <div class="prepare-title">调整坐姿</div>
      <div class="prepare-desc">双脚平放地面，脊背自然挺直<br>双手轻放在大腿上</div>
    </div>
    <div class="prepare-step">
      <span class="prepare-icon">👁️</span>
      <div class="prepare-title">轻闭双眼</div>
      <div class="prepare-desc">缓缓闭上眼睛<br>让视线自然下垂</div>
    </div>
    <div class="prepare-step">
      <span class="prepare-icon">🌬️</span>
      <div class="prepare-title">自然呼吸</div>
      <div class="prepare-desc">用鼻子缓缓吸气，再慢慢呼出<br>不刻意控制，让呼吸自然流淌</div>
    </div>
    <div class="prepare-timer" id="prepareTimer">即将开始…</div>
  </div>
</div>

<!-- ===== 倒计时 ===== -->
<div class="countdown-overlay" id="countdownOverlay">
  <div class="countdown-num" id="countdownNum">3</div>
</div>

<!-- ===== 冥想页 ===== -->
<div class="page" id="pageMeditation">
  <div class="meditation-container">
    <div class="meditation-timer">
      <div class="timer-text" id="medTimer">3:00</div>
      <div class="timer-label">剩余时间</div>
    </div>

    <div class="breath-circle-wrap" id="breathCircle">
      <div class="breath-ring"></div>
      <div class="breath-ring-inner"></div>
      <div class="breath-glow"></div>
      <div class="breath-core"></div>
      <div class="breath-text" id="breathText">吸气</div>
    </div>

    <div class="round-dots" id="roundDots"></div>
  </div>
</div>

<!-- ===== 结束页 ===== -->
<div class="page" id="pageEnd">
  <div class="end-content">
    <div class="end-icon">🌿</div>
    <div class="end-title">欢迎回来</div>
    <div class="end-message">
      三分钟的静坐，<br>
      是送给忙碌自己的一份礼物。<br>
      愿你带着这份平静，<br>
      从容面对下午的每一刻。
    </div>
    <div class="end-stats">
      <div class="stat-item">
        <div class="stat-value" id="statCycles">0</div>
        <div class="stat-label">呼吸周期</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statTime">3:00</div>
        <div class="stat-label">冥想时长</div>
      </div>
    </div>
    <div class="end-actions">
      <button class="btn" id="btnRestart">再来一次</button>
      <button class="btn-ghost" id="btnBack">返回首页</button>
    </div>
  </div>
</div>

<!-- 底部 -->
<div class="footer-info">「息」· 为忙碌的你而设计</div>

<script>
(function(){
  'use strict';

  // ===== 配置 =====
  const CONFIG = {
    totalSeconds: 180,        // 总时长3分钟
    prepareSeconds: 8,        // 准备页停留
    countdownSeconds: 3,      // 倒计时
    breathIn: 4,              // 吸气秒数
    breathHold: 2,            // 屏息秒数
    breathOut: 4,             // 呼气秒数
    // 一个完整周期 = 4+2+4 = 10秒, 3分钟约18个周期
  };

  // ===== 状态 =====
  let state = {
    currentPage: 'welcome',
    audioEnabled: true,
    timerInterval: null,
    breathInterval: null,
    remainingSeconds: CONFIG.totalSeconds,
    completedCycles: 0,
    totalCycles: 0,
    startTime: null,
  };

  // ===== DOM =====
  const $ = id => document.getElementById(id);
  const pages = {
    welcome: $('pageWelcome'),
    prepare: $('pagePrepare'),
    meditation: $('pageMeditation'),
    end: $('pageEnd'),
  };

  // ===== 星尘粒子 =====
  function createStardust(){
    const container = $('stardust');
    const count = 30;
    for(let i = 0; i < count; i++){
      const span = document.createElement('span');
      span.style.left = Math.random()*100 + '%';
      span.style.top = Math.random()*100 + '%';
      span.style.setProperty('--dur', (4+Math.random()*6)+'s');
      span.style.setProperty('--delay', (Math.random()*5)+'s');
      span.style.setProperty('--op', (0.15+Math.random()*0.35).toString());
      span.style.width = (1+Math.random()*2)+'px';
      span.style.height = span.style.width;
      container.appendChild(span);
    }
  }

  // ===== 音频（Web Audio API 生成柔和音调） =====
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playTone(freq, duration, vol=0.08, type='sine'){
    if(!state.audioEnabled) return;
    try{
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + 0.3);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration);
    }catch(e){}
  }
  function playBreathIn(){ playTone(220, CONFIG.breathIn + 0.5, 0.06, 'sine'); }
  function playBreathHold(){ playTone(330, CONFIG.breathHold + 0.3, 0.04, 'sine'); }
  function playBreathOut(){ playTone(165, CONFIG.breathOut + 0.5, 0.06, 'sine'); }
  function playChime(){
    playTone(523, 2, 0.1, 'sine');
    setTimeout(()=> playTone(659, 2, 0.08, 'sine'), 200);
    setTimeout(()=> playTone(784, 2.5, 0.06, 'sine'), 400);
  }

  // ===== 页面切换 =====
  function showPage(name){
    Object.values(pages).forEach(p => p.classList.remove('active'));
    pages[name].classList.add('active');
    state.currentPage = name;
  }

  // ===== 倒计时 =====
  function showCountdown(cb){
    const overlay = $('countdownOverlay');
    const numEl = $('countdownNum');
    overlay.classList.add('active');
    let count = CONFIG.countdownSeconds;
    numEl.textContent = count;
    playTone(440, 0.5, 0.06);

    const iv = setInterval(()=>{
      count--;
      if(count > 0){
        numEl.textContent = count;
        // 重新触发动画
        numEl.style.animation = 'none';
        numEl.offsetHeight; // reflow
        numEl.style.animation = '';
        playTone(440, 0.5, 0.06);
      } else {
        clearInterval(iv);
        overlay.classList.remove('active');
        if(cb) cb();
      }
    }, 1000);
  }

  // ===== 准备页 =====
  function startPrepare(){
    showPage('prepare');
    let sec = CONFIG.prepareSeconds;
    const timerEl = $('prepareTimer');
    timerEl.textContent = `即将开始…`;

    setTimeout(()=>{
      showCountdown(()=>{
        startMeditation();
      });
    }, (CONFIG.prepareSeconds - CONFIG.countdownSeconds) * 1000);
  }

  // ===== 冥想核心 =====
  function startMeditation(){
    showPage('meditation');
    state.remainingSeconds = CONFIG.totalSeconds;
    state.completedCycles = 0;
    state.totalCycles = 0;
    state.startTime = Date.now();

    // 创建轮次指示点（18个周期）
    const dotsEl = $('roundDots');
    dotsEl.innerHTML = '';
    const maxDots = 18;
    for(let i = 0; i < maxDots; i++){
      const dot = document.createElement('div');
      dot.className = 'round-dot';
      dotsEl.appendChild(dot);
    }

    updateTimerDisplay();
    startBreathCycle();

    // 主计时器
    state.timerInterval = setInterval(()=>{
      state.remainingSeconds--;
      updateTimerDisplay();
      if(state.remainingSeconds <= 0){
        endMeditation();
      }
    }, 1000);
  }

  function updateTimerDisplay(){
    const m = Math.floor(state.remainingSeconds / 60);
    const s = state.remainingSeconds % 60;
    $('medTimer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }

  // ===== 呼吸循环 =====
  function startBreathCycle(){
    const circle = $('breathCircle');
    const textEl = $('breathText');
    const dotsEl = $('roundDots');
    const dots = dotsEl.querySelectorAll('.round-dot');

    function breathIn(){
      if(state.currentPage !== 'meditation') return;
      circle.className = 'breath-circle-wrap breathing-in';
      textEl.textContent = '吸气';
      textEl.style.opacity = '1';
      playBreathIn();

      // 更新当前轮次点
      const idx = state.totalCycles % dots.length;
      dots.forEach((d,i) => d.classList.remove('current'));
      if(dots[idx]) dots[idx].classList.add('current');

      state.breathInterval = setTimeout(breathHold, CONFIG.breathIn * 1000);
    }

    function breathHold(){
      if(state.currentPage !== 'meditation') return;
      circle.className = 'breath-circle-wrap breathing-hold';
      textEl.textContent = '屏息';
      playBreathHold();
      state.breathInterval = setTimeout(breathOut, CONFIG.breathHold * 1000);
    }

    function breathOut(){
      if(state.currentPage !== 'meditation') return;
      circle.className = 'breath-circle-wrap breathing-out';
      textEl.textContent = '呼气';
      playBreathOut();
      state.breathInterval = setTimeout(()=>{
        // 完成一个周期
        state.completedCycles++;
        state.totalCycles++;
        const idx = (state.totalCycles - 1) % dots.length;
        if(dots[idx]){
          dots[idx].classList.remove('current');
          dots[idx].classList.add('done');
        }
        if(state.currentPage === 'meditation'){
          breathIn();
        }
      }, CONFIG.breathOut * 1000);
    }

    breathIn();
  }

  // ===== 结束冥想 =====
  function endMeditation(){
    clearInterval(state.timerInterval);
    clearTimeout(state.breathInterval);

    const elapsed = Math.round((Date.now() - state.startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;

    $('statCycles').textContent = state.completedCycles;
    $('statTime').textContent = `${m}:${s.toString().padStart(2,'0')}`;

    playChime();

    setTimeout(()=>{
      showPage('end');
    }, 1500);
  }

  // ===== 事件绑定 =====
  $('btnStart').addEventListener('click', ()=>{
    playTone(440, 0.3, 0.05);
    startPrepare();
  });

  $('btnRestart').addEventListener('click', ()=>{
    playTone(440, 0.3, 0.05);
    startPrepare();
  });

  $('btnBack').addEventListener('click', ()=>{
    playTone(440, 0.3, 0.05);
    showPage('welcome');
  });

  $('audioToggle').addEventListener('click', ()=>{
    state.audioEnabled = !state.audioEnabled;
    $('audioToggle').classList.toggle('muted', !state.audioEnabled);
    $('audioToggle').textContent = state.audioEnabled ? '♪' : '♪';
  });

  // ===== 初始化 =====
  createStardust();

  // 防止微信内嵌浏览器滚动弹跳
  document.body.addEventListener('touchmove', e => {
    if(e.target === document.body) e.preventDefault();
  }, {passive: false});

})();
</script>
</body>
</html>
