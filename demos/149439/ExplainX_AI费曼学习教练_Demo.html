<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExplainX：AI 费曼学习教练 Demo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #697386;
      --primary: #5b6cff;
      --primary-dark: #3949d6;
      --green: #16a34a;
      --orange: #f59e0b;
      --red: #ef4444;
      --line: #e6e9f2;
      --soft: #eef1ff;
      --shadow: 0 20px 60px rgba(35, 46, 85, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(91, 108, 255, 0.2), transparent 34%),
        linear-gradient(135deg, #f7f9ff 0%, #eef2ff 45%, #f8fbff 100%);
      min-height: 100vh;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 38px 0 54px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: stretch;
      margin-bottom: 26px;
    }

    .hero-card,
    .panel,
    .coach-card {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .hero-card {
      padding: 38px;
      overflow: hidden;
      position: relative;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -70px;
      top: -70px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(91,108,255,0.18), rgba(22,163,74,0.12));
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--primary-dark);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.05;
      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
      margin: 0;
      max-width: 680px;
    }

    .flow {
      display: grid;
      gap: 12px;
      padding: 28px;
    }

    .flow-step {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 16px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .step-num {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
    }

    .flow-step strong {
      display: block;
      margin-bottom: 4px;
    }

    .flow-step span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .workspace {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      padding: 26px;
    }

    .panel h2,
    .coach-card h2 {
      margin: 0 0 18px;
      font-size: 22px;
    }

    label {
      display: block;
      color: #334155;
      font-weight: 700;
      margin: 18px 0 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 15px;
      font-size: 15px;
      outline: none;
      color: var(--text);
      background: #fff;
      transition: 0.18s ease;
      font-family: inherit;
    }

    textarea {
      min-height: 190px;
      resize: vertical;
      line-height: 1.7;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(91, 108, 255, 0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 15px;
      padding: 13px 18px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: 0.18s ease;
    }

    .primary {
      background: var(--primary);
      color: #fff;
    }

    .primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .ghost {
      background: #f1f4fb;
      color: #334155;
    }

    .ghost:hover {
      background: #e7ebf5;
    }

    .coach-card {
      padding: 26px;
      min-height: 560px;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 480px;
      text-align: center;
      color: var(--muted);
      border: 2px dashed #d9def0;
      border-radius: 22px;
      padding: 28px;
      background: rgba(255, 255, 255, 0.45);
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .score-wrap {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 22px;
      align-items: center;
      padding: 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #f8faff, #eef2ff);
      border: 1px solid #dfe4ff;
      margin-bottom: 18px;
    }

    .score-circle {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--primary) 0deg, var(--primary) var(--angle), #e5e7eb var(--angle), #e5e7eb 360deg);
      position: relative;
    }

    .score-circle::before {
      content: "";
      position: absolute;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #fff;
    }

    .score-text {
      position: relative;
      text-align: center;
      font-weight: 900;
      font-size: 32px;
      color: var(--primary-dark);
    }

    .score-text small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    .diagnosis-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .diagnosis-desc {
      color: var(--muted);
      line-height: 1.65;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 16px 0;
    }

    .mini-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      background: #fff;
    }

    .mini-card h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .mini-card ul {
      margin: 0;
      padding-left: 19px;
      color: #46556b;
      line-height: 1.7;
      font-size: 14px;
    }

    .question-box {
      border-radius: 20px;
      padding: 18px;
      background: #101827;
      color: #fff;
      margin-top: 16px;
    }

    .question-box h3 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .question {
      padding: 13px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.1);
      margin: 10px 0;
      line-height: 1.55;
    }

    .question-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .question-actions button {
      padding: 10px 13px;
      background: #ffffff;
      color: #111827;
    }

    .report {
      border-top: 1px solid var(--line);
      margin-top: 18px;
      padding-top: 18px;
    }

    .report h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .report p {
      color: #46556b;
      line-height: 1.7;
      margin: 0 0 10px;
    }

    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      padding: 7px 10px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3949d6;
      font-size: 13px;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%) translateY(20px);
      background: #111827;
      color: #fff;
      padding: 12px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s ease;
      box-shadow: 0 18px 45px rgba(17,24,39,0.24);
      z-index: 99;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .hero,
      .workspace,
      .score-wrap,
      .grid {
        grid-template-columns: 1fr;
      }

      .score-circle {
        margin: 0 auto;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-card">
        <div class="badge">学习工作赛道 Demo · ExplainX</div>
        <h1>AI 费曼学习教练</h1>
        <p class="subtitle">
          这不是一个直接给答案的学习工具，而是一个“逼你讲明白”的 AI 教练。
          用户用自己的话解释知识点，AI 通过评分、追问、纠错和复盘，帮助用户识别“假性理解”。
        </p>
      </div>

      <div class="hero-card flow">
        <div class="flow-step">
          <div class="step-num">1</div>
          <div><strong>选择知识点</strong><span>输入你正在学习的概念、理论、公式或方法。</span></div>
        </div>
        <div class="flow-step">
          <div class="step-num">2</div>
          <div><strong>用自己的话解释</strong><span>像教别人一样表达，不依赖标准答案。</span></div>
        </div>
        <div class="flow-step">
          <div class="step-num">3</div>
          <div><strong>AI 追问与诊断</strong><span>判断是否说清楚、是否有例子、是否存在逻辑漏洞。</span></div>
        </div>
        <div class="flow-step">
          <div class="step-num">4</div>
          <div><strong>生成复盘报告</strong><span>输出掌握点、盲区、下一步学习建议。</span></div>
        </div>
      </div>
    </section>

    <section class="workspace">
      <div class="panel">
        <h2>学生端输入</h2>

        <div class="row">
          <div>
            <label for="topic">学习知识点</label>
            <input id="topic" placeholder="例如：过拟合、牛顿第二定律、边际效用" />
          </div>
          <div>
            <label for="level">当前水平</label>
            <select id="level">
              <option>刚开始学</option>
              <option selected>基本学过</option>
              <option>准备考试</option>
              <option>需要讲给别人听</option>
            </select>
          </div>
        </div>

        <label for="explain">请用自己的话解释这个知识点</label>
        <textarea id="explain" placeholder="试着像给同学讲解一样说明：它是什么、为什么重要、怎么用、能不能举一个例子。"></textarea>

        <div class="buttons">
          <button class="primary" onclick="analyze()">开始 AI 诊断</button>
          <button class="ghost" onclick="fillSample()">填入示例</button>
          <button class="ghost" onclick="resetDemo()">清空</button>
        </div>
      </div>

      <div class="coach-card">
        <h2>AI 教练反馈</h2>
        <div id="result" class="empty">
          <div>
            <strong>等待你的解释</strong>
            <span>输入一个知识点和你的解释后，AI 会生成理解评分、追问问题和复盘报告。</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast">已生成新的追问</div>

  <script>
    const topicEl = document.getElementById("topic");
    const explainEl = document.getElementById("explain");
    const levelEl = document.getElementById("level");
    const resultEl = document.getElementById("result");
    const toastEl = document.getElementById("toast");

    function fillSample() {
      topicEl.value = "机器学习中的过拟合";
      levelEl.value = "基本学过";
      explainEl.value = "过拟合就是模型在训练数据上表现很好，但是到了新的数据上表现不好。它像是学生把答案背下来了，但没有真正理解题目。过拟合通常是因为模型太复杂、训练数据太少，或者训练时间太长。解决方法可以是增加数据、简化模型、正则化，或者用验证集提前停止训练。";
      analyze();
    }

    function resetDemo() {
      topicEl.value = "";
      explainEl.value = "";
      levelEl.value = "基本学过";
      resultEl.className = "empty";
      resultEl.innerHTML = `
        <div>
          <strong>等待你的解释</strong>
          <span>输入一个知识点和你的解释后，AI 会生成理解评分、追问问题和复盘报告。</span>
        </div>
      `;
    }

    function analyze() {
      const topic = topicEl.value.trim() || "这个知识点";
      const text = explainEl.value.trim();
      const level = levelEl.value;

      if (!text) {
        showToast("请先输入你的解释");
        return;
      }

      const metrics = evaluateText(text);
      const score = Math.min(96, Math.max(28, metrics.score));
      const angle = Math.round(score / 100 * 360);
      const diagnosis = getDiagnosis(score);
      const strengths = getStrengths(metrics, topic);
      const gaps = getGaps(metrics, topic);
      const questions = getQuestions(metrics, topic, level);

      resultEl.className = "";
      resultEl.innerHTML = `
        <div class="score-wrap">
          <div class="score-circle" style="--angle:${angle}deg">
            <div class="score-text">${score}<small>理解指数</small></div>
          </div>
          <div>
            <div class="diagnosis-title">${diagnosis.title}</div>
            <p class="diagnosis-desc">${diagnosis.desc}</p>
            <div class="pill-list">
              <span class="pill">费曼表达</span>
              <span class="pill">追问训练</span>
              <span class="pill">盲区诊断</span>
            </div>
          </div>
        </div>

        <div class="grid">
          <div class="mini-card">
            <h3>已经掌握</h3>
            <ul>${strengths.map(item => `<li>${item}</li>`).join("")}</ul>
          </div>
          <div class="mini-card">
            <h3>理解盲区</h3>
            <ul>${gaps.map(item => `<li>${item}</li>`).join("")}</ul>
          </div>
        </div>

        <div class="question-box">
          <h3>AI 教练追问</h3>
          ${questions.map(q => `<div class="question">${q}</div>`).join("")}
          <div class="question-actions">
            <button onclick="nextQuestion()">继续追问</button>
            <button onclick="rewriteAdvice()">帮我优化表达</button>
          </div>
        </div>

        <div class="report">
          <h3>学习复盘报告</h3>
          <p>${buildReport(score, topic, metrics)}</p>
          <p><strong>下一步建议：</strong>${buildSuggestion(score, metrics)}</p>
        </div>
      `;
    }

    function evaluateText(text) {
      const len = text.length;
      const hasExample = /例如|比如|像是|好比|举例|生活中|案例|假设/.test(text);
      const hasCause = /因为|所以|导致|原因|因此|本质|核心|关键/.test(text);
      const hasUse = /用于|应用|解决|方法|可以|作用|适合|场景/.test(text);
      const hasCompare = /区别|相比|不同|相同|不是|而是|类似/.test(text);
      const hasStructure = /第一|第二|首先|其次|最后|包括|分为|步骤/.test(text);

      let score = 25;
      score += Math.min(25, Math.floor(len / 12));
      if (hasExample) score += 15;
      if (hasCause) score += 13;
      if (hasUse) score += 12;
      if (hasCompare) score += 8;
      if (hasStructure) score += 6;
      if (len < 45) score -= 8;

      return { len, hasExample, hasCause, hasUse, hasCompare, hasStructure, score };
    }

    function getDiagnosis(score) {
      if (score >= 85) {
        return {
          title: "理解较扎实，可以进入表达训练",
          desc: "你的解释已经覆盖了概念含义、原因或应用，接下来需要训练更简洁、更有说服力的表达。"
        };
      }
      if (score >= 68) {
        return {
          title: "基本理解，但还不够费曼",
          desc: "你已经说出主要意思，但解释中还需要更多生活化例子、边界条件或反向辨析。"
        };
      }
      if (score >= 50) {
        return {
          title: "存在假性理解风险",
          desc: "你可能记住了一些关键词，但还没有把它们组织成清晰、可讲给别人听的解释。"
        };
      }
      return {
        title: "当前解释偏模糊",
        desc: "建议先用一句话说清楚它是什么，再补充一个例子和一个应用场景。"
      };
    }

    function getStrengths(metrics, topic) {
      const arr = [];
      if (metrics.len > 80) arr.push(`愿意展开解释“${topic}”，不是只写关键词。`);
      if (metrics.hasExample) arr.push("解释中使用了例子或类比，有助于降低理解门槛。");
      if (metrics.hasCause) arr.push("提到了原因、机制或本质，说明开始理解背后的逻辑。");
      if (metrics.hasUse) arr.push("能够联系应用场景，说明不只是记忆概念。");
      if (metrics.hasCompare) arr.push("尝试通过对比说明边界，有助于避免概念混淆。");
      if (!arr.length) arr.push("你已经迈出了主动表达的第一步，这是费曼学习法的关键。");
      return arr.slice(0, 4);
    }

    function getGaps(metrics, topic) {
      const arr = [];
      if (!metrics.hasExample) arr.push(`缺少一个能让初学者听懂“${topic}”的生活化例子。`);
      if (!metrics.hasCause) arr.push("缺少“为什么会这样”的解释，容易停留在表面定义。");
      if (!metrics.hasUse) arr.push("缺少应用场景，暂时还看不出这个知识点能解决什么问题。");
      if (!metrics.hasCompare) arr.push("缺少相近概念对比，考试或迁移应用时可能混淆。");
      if (metrics.len < 70) arr.push("解释偏短，可能还没有形成完整表达链条。");
      if (!arr.length) arr.push("主要问题不是理解不足，而是可以继续提升表达的简洁度和准确度。");
      return arr.slice(0, 4);
    }

    function getQuestions(metrics, topic, level) {
      const questions = [];
      if (!metrics.hasExample) questions.push(`如果要向一个完全没学过的人解释“${topic}”，你能举一个生活中的例子吗？`);
      if (!metrics.hasCause) questions.push(`“${topic}”背后的原因或机制是什么？为什么它会成立？`);
      if (!metrics.hasUse) questions.push(`在什么场景下需要用到“${topic}”？它能解决什么具体问题？`);
      if (!metrics.hasCompare) questions.push(`“${topic}”最容易和哪个概念混淆？它们的区别是什么？`);
      questions.push(`请你用不超过 30 秒的话，再解释一次“${topic}”。这次要更简单、更像讲给同学听。`);
      if (level === "准备考试") questions.push(`如果考试换一种问法考“${topic}”，你觉得最可能怎么出题？`);
      return questions.slice(0, 4);
    }

    function buildReport(score, topic, metrics) {
      if (score >= 85) {
        return `你对“${topic}”的理解已经比较完整，具备向他人解释的基础。当前最值得提升的是表达压缩能力：用更短的话讲清楚定义、机制和例子。`;
      }
      if (score >= 68) {
        return `你对“${topic}”有基本理解，但还存在“知道大概意思，却讲得不够清楚”的情况。建议补充例子、应用场景和概念对比。`;
      }
      if (score >= 50) {
        return `你对“${topic}”可能处在半理解状态，已经接触过相关关键词，但解释链条还不完整。需要先建立“是什么、为什么、怎么用”的结构。`;
      }
      return `你目前对“${topic}”的解释还比较模糊，建议先回到基础定义，再尝试用一句话和一个例子重新表达。`;
    }

    function buildSuggestion(score, metrics) {
      const tips = [];
      if (!metrics.hasExample) tips.push("补充一个生活化例子");
      if (!metrics.hasCause) tips.push("说明背后的原因或机制");
      if (!metrics.hasUse) tips.push("写出一个真实应用场景");
      if (!metrics.hasCompare) tips.push("和一个相近概念做对比");
      if (!tips.length) tips.push("尝试把解释压缩成 3 句话");
      if (score < 60) tips.push("先不要急着刷题，先重新组织定义");
      return tips.join("，") + "。";
    }

    function nextQuestion() {
      const topic = topicEl.value.trim() || "这个知识点";
      const pool = [
        `如果把“${topic}”画成一张图，你会画出哪些部分？`,
        `请你指出一个关于“${topic}”的常见误解，并说明为什么错。`,
        `如果别人反驳你的解释，你会用什么例子证明自己？`,
        `请用“小学生也能听懂”的方式重新解释“${topic}”。`,
        `学会“${topic}”之后，最直接能解决的一个问题是什么？`
      ];
      const q = pool[Math.floor(Math.random() * pool.length)];
      const box = document.querySelector(".question-box");
      if (box) {
        const div = document.createElement("div");
        div.className = "question";
        div.textContent = q;
        const actions = box.querySelector(".question-actions");
        box.insertBefore(div, actions);
        showToast("已生成新的追问");
      }
    }

    function rewriteAdvice() {
      const topic = topicEl.value.trim() || "这个知识点";
      const box = document.querySelector(".report");
      if (!box) return;
      const p = document.createElement("p");
      p.innerHTML = `<strong>表达模板：</strong>“${topic}”可以先用一句话定义，再说明它为什么重要，最后用一个例子证明你真的理解。推荐结构：它是什么 → 为什么会这样 → 举个例子 → 容易和什么混淆。`;
      box.appendChild(p);
      showToast("已生成表达优化建议");
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1800);
    }
  </script>
</body>
</html>
