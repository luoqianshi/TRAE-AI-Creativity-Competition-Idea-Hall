<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>昆虫大战 - 基因改造机械对决</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep-black: #0a0a0f;
      --neon-cyan: #00f0ff;
      --energy-purple: #bf00ff;
      --alert-orange: #ff6b00;
      --metal-silver: #c0c0c0;
      --dark-purple: #1a0a2e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--deep-black);
      min-height: 100vh;
      overflow-x: hidden;
      color: white;
    }

    /* 背景粒子 */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--neon-cyan);
      animation: float 8s infinite;
      opacity: 0.6;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.6; }
      25% { transform: translateY(-30px) translateX(10px); opacity: 1; }
      50% { transform: translateY(-60px) translateX(-10px); opacity: 0.4; }
      75% { transform: translateY(-30px) translateX(20px); opacity: 0.8; }
    }

    /* 扫描线效果 */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.1) 2px,
        rgba(0, 0, 0, 0.1) 4px
      );
    }

    /* 主容器 */
    .game-container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* 标题 */
    .game-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--energy-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
      animation: titleGlow 2s ease-in-out infinite alternate;
      letter-spacing: 4px;
    }

    @keyframes titleGlow {
      0% { filter: drop-shadow(0 0 10px var(--neon-cyan)); }
      100% { filter: drop-shadow(0 0 30px var(--energy-purple)); }
    }

    .subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.2rem;
      color: var(--metal-silver);
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    /* 选择阶段 */
    .selection-phase {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
    }

    .phase-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      color: var(--neon-cyan);
      margin-bottom: 30px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .insects-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      width: 100%;
      padding: 20px;
    }

    .insect-card {
      background: linear-gradient(145deg, rgba(26, 10, 46, 0.8), rgba(10, 10, 15, 0.9));
      border: 2px solid var(--metal-silver);
      border-radius: 15px;
      padding: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .insect-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.1), transparent);
      transition: left 0.5s ease;
    }

    .insect-card:hover::before {
      left: 100%;
    }

    .insect-card:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), inset 0 0 30px rgba(0, 240, 255, 0.1);
      transform: translateY(-5px);
    }

    .insect-card.fire:hover { border-color: var(--alert-orange); box-shadow: 0 0 30px rgba(255, 107, 0, 0.4); }
    .insect-card.ice:hover { border-color: #00f0ff; }
    .insect-card.thunder:hover { border-color: #ffdd00; box-shadow: 0 0 30px rgba(255, 221, 0, 0.4); }

    .insect-visual {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      position: relative;
    }

    .insect-svg {
      width: 100%;
      height: 100%;
    }

    .insect-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 5px;
      color: var(--neon-cyan);
    }

    .insect-name-en {
      font-size: 0.8rem;
      text-align: center;
      color: var(--metal-silver);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .insect-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--metal-silver);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .stat-value.hp { color: #ff4444; }
    .stat-value.atk { color: var(--alert-orange); }
    .stat-value.def { color: var(--neon-cyan); }
    .stat-value.spd { color: #44ff44; }

    .insect-skill {
      margin-top: 15px;
      padding: 10px;
      background: rgba(191, 0, 255, 0.2);
      border: 1px solid var(--energy-purple);
      border-radius: 8px;
      text-align: center;
    }

    .skill-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      color: var(--energy-purple);
    }

    /* 战斗阶段 */
    .battle-phase {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
    }

    .battle-arena {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      width: 100%;
      padding: 30px;
      position: relative;
    }

    .battle-arena::before {
      content: 'VS';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--energy-purple);
      text-shadow: 0 0 20px var(--energy-purple);
    }

    .fighter {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background: linear-gradient(145deg, rgba(26, 10, 46, 0.6), rgba(10, 10, 15, 0.8));
      border: 2px solid var(--metal-silver);
      border-radius: 15px;
    }

    .fighter-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      margin-bottom: 15px;
    }

    .fighter.player .fighter-name { color: var(--neon-cyan); }
    .fighter.enemy .fighter-name { color: var(--alert-orange); }

    .fighter-visual {
      width: 150px;
      height: 150px;
      margin-bottom: 20px;
      animation: idle 2s ease-in-out infinite;
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .hp-bar-container {
      width: 100%;
      margin-bottom: 10px;
    }

    .hp-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .hp-bar {
      width: 100%;
      height: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid var(--metal-silver);
      border-radius: 10px;
      overflow: hidden;
    }

    .hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff4444, #ff6644);
      transition: width 0.5s ease;
      box-shadow: 0 0 10px #ff4444;
    }

    /* 战斗信息 */
    .battle-log {
      width: 100%;
      max-width: 600px;
      margin: 20px 0;
      padding: 15px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--energy-purple);
      border-radius: 10px;
      max-height: 120px;
      overflow-y: auto;
    }

    .log-entry {
      font-size: 0.9rem;
      padding: 5px 0;
      border-bottom: 1px solid rgba(192, 192, 192, 0.2);
      animation: logFade 0.3s ease;
    }

    @keyframes logFade {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .log-entry.damage { color: #ff4444; }
    .log-entry.player-turn { color: var(--neon-cyan); }
    .log-entry.enemy-turn { color: var(--alert-orange); }

    /* 操作按钮 */
    .action-buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      padding: 15px 40px;
      border: 2px solid var(--neon-cyan);
      background: transparent;
      color: var(--neon-cyan);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn:hover {
      background: var(--neon-cyan);
      color: var(--deep-black);
      box-shadow: 0 0 30px var(--neon-cyan);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-attack {
      border-color: var(--alert-orange);
      color: var(--alert-orange);
    }

    .btn-attack:hover {
      background: var(--alert-orange);
      color: var(--deep-black);
      box-shadow: 0 0 30px var(--alert-orange);
    }

    /* 伤害数字 */
    .damage-number {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: #ff4444;
      text-shadow: 0 0 10px #ff4444, 2px 2px 0 #000;
      pointer-events: none;
      animation: damageFloat 1s ease-out forwards;
      z-index: 100;
    }

    @keyframes damageFloat {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      50% { opacity: 1; transform: translateY(-50px) scale(1.5); }
      100% { opacity: 0; transform: translateY(-100px) scale(0.5); }
    }

    /* 攻击动画 */
    .attacking {
      animation: attack 0.5s ease;
    }

    @keyframes attack {
      0% { transform: translateX(0); }
      50% { transform: translateX(100px) scale(1.2); }
      100% { transform: translateX(0); }
    }

    .attacking-enemy {
      animation: attackEnemy 0.5s ease;
    }

    @keyframes attackEnemy {
      0% { transform: translateX(0); }
      50% { transform: translateX(-100px) scale(1.2); }
      100% { transform: translateX(0); }
    }

    /* 结果弹窗 */
    .result-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      justify-content: center;
      align-items: center;
      animation: modalFade 0.5s ease;
    }

    @keyframes modalFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-content {
      text-align: center;
      padding: 50px;
      background: linear-gradient(145deg, var(--dark-purple), var(--deep-black));
      border: 3px solid var(--energy-purple);
      border-radius: 20px;
      box-shadow: 0 0 50px var(--energy-purple);
      animation: resultPop 0.5s ease;
    }

    @keyframes resultPop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .result-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .result-title.victory {
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
    }

    .result-title.defeat {
      background: linear-gradient(135deg, #ff4444, #ff0000);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .result-message {
      font-size: 1.2rem;
      color: var(--metal-silver);
      margin-bottom: 30px;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .game-title { font-size: 2rem; }
      .insects-grid { grid-template-columns: 1fr; gap: 20px; }
      .battle-arena { grid-template-columns: 1fr; gap: 30px; }
      .battle-arena::before { display: none; }
    }

    /* 昆虫SVG样式 */
    .insect-body { fill: #2a2a35; stroke: var(--metal-silver); stroke-width: 2; }
    .insect-eye { fill: var(--neon-cyan); filter: drop-shadow(0 0 5px var(--neon-cyan)); }
    .insect-fire .insect-body { fill: #3a2020; stroke: var(--alert-orange); }
    .insect-fire .insect-eye { fill: var(--alert-orange); filter: drop-shadow(0 0 5px var(--alert-orange)); }
    .insect-thunder .insect-body { fill: #2a2a10; stroke: #ffdd00; }
    .insect-thunder .insect-eye { fill: #ffdd00); filter: drop-shadow(0 0 5px #ffdd00); }
  </style>
</head>
<body>
  <div id="particles"></div>
  <div class="scanlines"></div>

  <div class="game-container">
    <h1 class="game-title">昆虫大战</h1>
    <p class="subtitle">基因改造机械对决</p>

    <!-- 选择阶段 -->
    <div id="selectionPhase" class="selection-phase">
      <h2 class="phase-title">// 选择你的昆虫 //</h2>
      <div class="insects-grid">
        <div class="insect-card fire" data-insect="0" onclick="selectInsect(0)">
          <div class="insect-visual">
            <svg class="insect-svg" viewBox="0 0 100 100">
              <!-- 烈焰螳螂 -->
              <ellipse class="insect-body" cx="50" cy="55" rx="25" ry="20"/>
              <ellipse class="insect-body" cx="50" cy="35" rx="15" ry="12"/>
              <circle class="insect-eye" cx="45" cy="32" r="4"/>
              <circle class="insect-eye" cx="55" cy="32" r="4"/>
              <!-- 镰刀前肢 -->
              <path class="insect-body" d="M25 50 Q10 40 5 25" stroke-width="4" fill="none"/>
              <path class="insect-body" d="M75 50 Q90 40 95 25" stroke-width="4" fill="none"/>
              <!-- 火焰装饰 -->
              <path d="M35 20 Q40 10 45 20" stroke="#ff6b00" stroke-width="2" fill="none"/>
              <path d="M55 20 Q60 10 65 20" stroke="#ff6b00" stroke-width="2" fill="none"/>
              <path d="M30 70 Q35 80 40 70" stroke="#ff6b00" stroke-width="2" fill="none"/>
              <path d="M60 70 Q65 80 70 70" stroke="#ff6b00" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div class="insect-name">烈焰螳螂</div>
          <div class="insect-name-en">Fire Mantis</div>
          <div class="insect-stats">
            <div class="stat"><span class="stat-label">HP</span><span class="stat-value hp">120</span></div>
            <div class="stat"><span class="stat-label">ATK</span><span class="stat-value atk">45</span></div>
            <div class="stat"><span class="stat-label">DEF</span><span class="stat-value def">20</span></div>
            <div class="stat"><span class="stat-label">SPD</span><span class="stat-value spd">30</span></div>
          </div>
          <div class="insect-skill">
            <span class="skill-name">烈焰斩</span>
          </div>
        </div>

        <div class="insect-card ice" data-insect="1" onclick="selectInsect(1)">
          <div class="insect-visual">
            <svg class="insect-svg" viewBox="0 0 100 100">
              <!-- 寒霜蜂后 -->
              <ellipse class="insect-body" cx="50" cy="60" rx="20" ry="25"/>
              <ellipse class="insect-body" cx="50" cy="35" rx="12" ry="10"/>
              <circle class="insect-eye" cx="45" cy="33" r="3"/>
              <circle class="insect-eye" cx="55" cy="33" r="3"/>
              <!-- 翅膀 -->
              <ellipse cx="30" cy="45" rx="15" ry="25" fill="rgba(0,240,255,0.3)" stroke="#00f0ff" stroke-width="1"/>
              <ellipse cx="70" cy="45" rx="15" ry="25" fill="rgba(0,240,255,0.3)" stroke="#00f0ff" stroke-width="1"/>
              <!-- 冰晶装饰 -->
              <path d="M40 15 L45 5 L50 15 L55 5 L60 15" stroke="#00f0ff" stroke-width="2" fill="none"/>
              <path d="M35 85 L40 75 L45 85" stroke="#00f0ff" stroke-width="2" fill="none"/>
              <path d="M55 85 L60 75 L65 85" stroke="#00f0ff" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div class="insect-name">寒霜蜂后</div>
          <div class="insect-name-en">Ice Queen Bee</div>
          <div class="insect-stats">
            <div class="stat"><span class="stat-label">HP</span><span class="stat-value hp">90</span></div>
            <div class="stat"><span class="stat-label">ATK</span><span class="stat-value atk">30</span></div>
            <div class="stat"><span class="stat-label">DEF</span><span class="stat-value def">25</span></div>
            <div class="stat"><span class="stat-label">SPD</span><span class="stat-value spd">50</span></div>
          </div>
          <div class="insect-skill">
            <span class="skill-name">冰晶穿刺</span>
          </div>
        </div>

        <div class="insect-card thunder" data-insect="2" onclick="selectInsect(2)">
          <div class="insect-visual">
            <svg class="insect-svg" viewBox="0 0 100 100">
              <!-- 雷霆甲虫 -->
              <ellipse class="insect-body" cx="50" cy="55" rx="30" ry="25"/>
              <ellipse class="insect-body" cx="50" cy="30" rx="18" ry="15"/>
              <circle class="insect-eye" cx="42" cy="28" r="4"/>
              <circle class="insect-eye" cx="58" cy="28" r="4"/>
              <!-- 盔甲纹理 -->
              <path d="M25 50 L50 65 L75 50" stroke="#ffdd00" stroke-width="2" fill="none"/>
              <path d="M30 60 L50 72 L70 60" stroke="#ffdd00" stroke-width="2" fill="none"/>
              <!-- 雷电符号 -->
              <path d="M48 10 L52 10 L50 18 L54 18 L46 28 L48 20 L44 20 Z" fill="#ffdd00"/>
              <path d="M45 75 L48 68 L52 68 L50 75" stroke="#ffdd00" stroke-width="2" fill="none"/>
              <!-- 腿部 -->
              <path d="M20 55 L10 50" stroke="#c0c0c0" stroke-width="3"/>
              <path d="M80 55 L90 50" stroke="#c0c0c0" stroke-width="3"/>
              <path d="M22 65 L12 65" stroke="#c0c0c0" stroke-width="3"/>
              <path d="M78 65 L88 65" stroke="#c0c0c0" stroke-width="3"/>
            </svg>
          </div>
          <div class="insect-name">雷霆甲虫</div>
          <div class="insect-name-en">Thunder Beetle</div>
          <div class="insect-stats">
            <div class="stat"><span class="stat-label">HP</span><span class="stat-value hp">150</span></div>
            <div class="stat"><span class="stat-label">ATK</span><span class="stat-value atk">25</span></div>
            <div class="stat"><span class="stat-label">DEF</span><span class="stat-value def">45</span></div>
            <div class="stat"><span class="stat-label">SPD</span><span class="stat-value spd">20</span></div>
          </div>
          <div class="insect-skill">
            <span class="skill-name">雷霆冲击</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 战斗阶段 -->
    <div id="battlePhase" class="battle-phase">
      <div class="battle-arena">
        <div class="fighter player" id="playerFighter">
          <div class="fighter-name" id="playerName">烈焰螳螂</div>
          <div class="fighter-visual" id="playerVisual"></div>
          <div class="hp-bar-container">
            <div class="hp-label">
              <span>HP</span>
              <span id="playerHpText">120 / 120</span>
            </div>
            <div class="hp-bar">
              <div class="hp-fill" id="playerHpBar" style="width: 100%"></div>
            </div>
          </div>
        </div>

        <div class="fighter enemy" id="enemyFighter">
          <div class="fighter-name" id="enemyName">寒霜蜂后</div>
          <div class="fighter-visual" id="enemyVisual"></div>
          <div class="hp-bar-container">
            <div class="hp-label">
              <span>HP</span>
              <span id="enemyHpText">90 / 90</span>
            </div>
            <div class="hp-bar">
              <div class="hp-fill" id="enemyHpBar" style="width: 100%"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="battle-log" id="battleLog"></div>

      <div class="action-buttons" id="actionButtons">
        <button class="btn btn-attack" id="attackBtn" onclick="playerAttack()">攻击</button>
      </div>
    </div>

    <!-- 结果弹窗 -->
    <div id="resultModal" class="result-modal">
      <div class="result-content">
        <h2 class="result-title" id="resultTitle">胜利</h2>
        <p class="result-message" id="resultMessage">恭喜你击败了对手！</p>
        <button class="btn" onclick="restartGame()">再来一局</button>
      </div>
    </div>
  </div>

  <script>
    // 昆虫数据
    const INSECTS = [
      {
        id: 0,
        name: '烈焰螳螂',
        nameEn: 'Fire Mantis',
        hp: 120,
        maxHp: 120,
        attack: 45,
        defense: 20,
        speed: 30,
        skill: '烈焰斩',
        element: 'fire'
      },
      {
        id: 1,
        name: '寒霜蜂后',
        nameEn: 'Ice Queen Bee',
        hp: 90,
        maxHp: 90,
        attack: 30,
        defense: 25,
        speed: 50,
        skill: '冰晶穿刺',
        element: 'ice'
      },
      {
        id: 2,
        name: '雷霆甲虫',
        nameEn: 'Thunder Beetle',
        hp: 150,
        maxHp: 150,
        attack: 25,
        defense: 45,
        speed: 20,
        skill: '雷霆冲击',
        element: 'thunder'
      }
    ];

    // 游戏状态
    let gameState = {
      phase: 'select',
      playerInsect: null,
      enemyInsect: null,
      turn: 'player',
      log: []
    };

    // 粒子背景
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (5 + Math.random() * 5) + 's';
        if (Math.random() > 0.5) {
          particle.style.background = '#bf00ff';
          particle.style.boxShadow = '0 0 6px #bf00ff';
        }
        container.appendChild(particle);
      }
    }

    // 获取昆虫SVG
    function getInsectSVG(insect, size = 150) {
      const svgMap = {
        0: `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
          <ellipse cx="50" cy="55" rx="25" ry="20" fill="#3a2020" stroke="#ff6b00" stroke-width="2"/>
          <ellipse cx="50" cy="35" rx="15" ry="12" fill="#3a2020" stroke="#ff6b00" stroke-width="2"/>
          <circle cx="45" cy="32" r="4" fill="#ff6b00" filter="drop-shadow(0 0 5px #ff6b00)"/>
          <circle cx="55" cy="32" r="4" fill="#ff6b00" filter="drop-shadow(0 0 5px #ff6b00)"/>
          <path d="M25 50 Q10 40 5 25" stroke="#ff6b00" stroke-width="4" fill="none"/>
          <path d="M75 50 Q90 40 95 25" stroke="#ff6b00" stroke-width="4" fill="none"/>
          <path d="M35 20 Q40 10 45 20" stroke="#ff6b00" stroke-width="2" fill="none"/>
          <path d="M55 20 Q60 10 65 20" stroke="#ff6b00" stroke-width="2" fill="none"/>
        </svg>`,
        1: `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
          <ellipse cx="50" cy="60" rx="20" ry="25" fill="#1a2a3a" stroke="#00f0ff" stroke-width="2"/>
          <ellipse cx="50" cy="35" rx="12" ry="10" fill="#1a2a3a" stroke="#00f0ff" stroke-width="2"/>
          <circle cx="45" cy="33" r="3" fill="#00f0ff" filter="drop-shadow(0 0 5px #00f0ff)"/>
          <circle cx="55" cy="33" r="3" fill="#00f0ff" filter="drop-shadow(0 0 5px #00f0ff)"/>
          <ellipse cx="30" cy="45" rx="15" ry="25" fill="rgba(0,240,255,0.3)" stroke="#00f0ff" stroke-width="1"/>
          <ellipse cx="70" cy="45" rx="15" ry="25" fill="rgba(0,240,255,0.3)" stroke="#00f0ff" stroke-width="1"/>
          <path d="M40 15 L45 5 L50 15 L55 5 L60 15" stroke="#00f0ff" stroke-width="2" fill="none"/>
        </svg>`,
        2: `<svg width="${size}" height="${size}" viewBox="0 0 100 100">
          <ellipse cx="50" cy="55" rx="30" ry="25" fill="#2a2a10" stroke="#ffdd00" stroke-width="2"/>
          <ellipse cx="50" cy="30" rx="18" ry="15" fill="#2a2a10" stroke="#ffdd00" stroke-width="2"/>
          <circle cx="42" cy="28" r="4" fill="#ffdd00" filter="drop-shadow(0 0 5px #ffdd00)"/>
          <circle cx="58" cy="28" r="4" fill="#ffdd00" filter="drop-shadow(0 0 5px #ffdd00)"/>
          <path d="M25 50 L50 65 L75 50" stroke="#ffdd00" stroke-width="2" fill="none"/>
          <path d="M48 10 L52 10 L50 18 L54 18 L46 28 L48 20 L44 20 Z" fill="#ffdd00"/>
          <path d="M20 55 L10 50" stroke="#c0c0c0" stroke-width="3"/>
          <path d="M80 55 L90 50" stroke="#c0c0c0" stroke-width="3"/>
        </svg>`
      };
      return svgMap[insect.id];
    }

    // 选择昆虫
    function selectInsect(index) {
      gameState.playerInsect = JSON.parse(JSON.stringify(INSECTS[index]));

      // 随机选择敌人
      let enemyIndex;
      do {
        enemyIndex = Math.floor(Math.random() * 3);
      } while (enemyIndex === index);
      gameState.enemyInsect = JSON.parse(JSON.stringify(INSECTS[enemyIndex]));

      // 决定先手
      gameState.turn = gameState.playerInsect.speed >= gameState.enemyInsect.speed ? 'player' : 'enemy';

      startBattle();
    }

    // 开始战斗
    function startBattle() {
      document.getElementById('selectionPhase').style.display = 'none';
      document.getElementById('battlePhase').style.display = 'flex';

      // 初始化战斗UI
      document.getElementById('playerName').textContent = gameState.playerInsect.name;
      document.getElementById('enemyName').textContent = gameState.enemyInsect.name;
      document.getElementById('playerVisual').innerHTML = getInsectSVG(gameState.playerInsect);
      document.getElementById('enemyVisual').innerHTML = getInsectSVG(gameState.enemyInsect);

      updateHpDisplay();

      // 清空战斗日志
      document.getElementById('battleLog').innerHTML = '';

      addLog(`${gameState.playerInsect.name} vs ${gameState.enemyInsect.name}!`, 'system');
      addLog(`${gameState.turn === 'player' ? gameState.playerInsect.name : gameState.enemyInsect.name} 先手攻击！`, 'system');

      updateActionButtons();
    }

    // 更新HP显示
    function updateHpDisplay() {
      const playerHpPercent = (gameState.playerInsect.hp / gameState.playerInsect.maxHp) * 100;
      const enemyHpPercent = (gameState.enemyInsect.hp / gameState.enemyInsect.maxHp) * 100;

      document.getElementById('playerHpBar').style.width = Math.max(0, playerHpPercent) + '%';
      document.getElementById('enemyHpBar').style.width = Math.max(0, enemyHpPercent) + '%';
      document.getElementById('playerHpText').textContent = `${Math.max(0, gameState.playerInsect.hp)} / ${gameState.playerInsect.maxHp}`;
      document.getElementById('enemyHpText').textContent = `${Math.max(0, gameState.enemyInsect.hp)} / ${gameState.enemyInsect.maxHp}`;
    }

    // 添加战斗日志
    function addLog(message, type = '') {
      const log = document.getElementById('battleLog');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = '> ' + message;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    // 更新操作按钮
    function updateActionButtons() {
      const attackBtn = document.getElementById('attackBtn');
      attackBtn.disabled = gameState.turn !== 'player' || gameState.phase !== 'battle';
    }

    // 玩家攻击
    function playerAttack() {
      if (gameState.turn !== 'player') return;

      const damage = calculateDamage(gameState.playerInsect, gameState.enemyInsect);

      // 攻击动画
      const playerVisual = document.getElementById('playerVisual');
      playerVisual.classList.add('attacking');

      setTimeout(() => {
        playerVisual.classList.remove('attacking');
        gameState.enemyInsect.hp -= damage;

        showDamageNumber('enemyFighter', damage);
        addLog(`${gameState.playerInsect.name} 使用 ${gameState.playerInsect.skill}！造成 ${damage} 点伤害！`, 'player-turn');
        updateHpDisplay();

        if (gameState.enemyInsect.hp <= 0) {
          endGame(true);
        } else {
          gameState.turn = 'enemy';
          updateActionButtons();
          setTimeout(enemyTurn, 1000);
        }
      }, 500);
    }

    // 敌人回合
    function enemyTurn() {
      if (gameState.phase !== 'battle') return;

      const damage = calculateDamage(gameState.enemyInsect, gameState.playerInsect);

      // 攻击动画
      const enemyVisual = document.getElementById('enemyVisual');
      enemyVisual.classList.add('attacking-enemy');

      setTimeout(() => {
        enemyVisual.classList.remove('attacking-enemy');
        gameState.playerInsect.hp -= damage;

        showDamageNumber('playerFighter', damage);
        addLog(`${gameState.enemyInsect.name} 使用 ${gameState.enemyInsect.skill}！造成 ${damage} 点伤害！`, 'enemy-turn');
        updateHpDisplay();

        if (gameState.playerInsect.hp <= 0) {
          endGame(false);
        } else {
          gameState.turn = 'player';
          updateActionButtons();
        }
      }, 500);
    }

    // 伤害计算
    function calculateDamage(attacker, defender) {
      const baseDamage = attacker.attack - Math.floor(defender.defense / 2);
      const variance = Math.floor(Math.random() * 10) - 5;
      return Math.max(1, baseDamage + variance);
    }

    // 显示伤害数字
    function showDamageNumber(targetId, damage) {
      const target = document.getElementById(targetId);
      const rect = target.getBoundingClientRect();

      const damageEl = document.createElement('div');
      damageEl.className = 'damage-number';
      damageEl.textContent = '-' + damage;
      damageEl.style.left = (rect.left + rect.width / 2) + 'px';
      damageEl.style.top = (rect.top + rect.height / 2) + 'px';
      document.body.appendChild(damageEl);

      setTimeout(() => damageEl.remove(), 1000);
    }

    // 结束游戏
    function endGame(victory) {
      gameState.phase = 'result';

      const modal = document.getElementById('resultModal');
      const title = document.getElementById('resultTitle');
      const message = document.getElementById('resultMessage');

      if (victory) {
        title.textContent = '胜利';
        title.className = 'result-title victory';
        message.textContent = `${gameState.playerInsect.name} 击败了 ${gameState.enemyInsect.name}！`;
      } else {
        title.textContent = '失败';
        title.className = 'result-title defeat';
        message.textContent = `${gameState.enemyInsect.name} 击败了 ${gameState.playerInsect.name}...`;
      }

      modal.style.display = 'flex';
    }

    // 重新开始
    function restartGame() {
      document.getElementById('resultModal').style.display = 'none';
      document.getElementById('battlePhase').style.display = 'none';
      document.getElementById('selectionPhase').style.display = 'flex';

      gameState = {
        phase: 'select',
        playerInsect: null,
        enemyInsect: null,
        turn: 'player',
        log: []
      };
    }

    // 初始化
    createParticles();
  </script>
</body>
</html>
