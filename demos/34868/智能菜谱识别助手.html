    .upload-zone {
      position: relative;

      background:
        linear-gradient(135deg, rgba(232, 248, 238, .86), rgba(255, 255, 255, .74)),
        repeating-linear-gradient(45deg, transparent 0 16px, rgba(34, 163, 90, .035) 16px 32px);
      transition: border-color .25s var(--ease), background .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease);

    .upload-zone.dragover {
      border-color: var(--accent);
      background:
        linear-gradient(135deg, rgba(222, 247, 230, .98), rgba(255, 255, 255, .86)),

    }

    }

    .meta {

      gap: 8px;

    }

    .meta span {

    .favorite {

    }

    .favorite:hover {

    }

    .favorite.saved {
      color: #ffffff;
      background: linear-gradient(135deg, #ff6b6b, #f06595);
      animation: heartBeat .38s var(--ease);
    }

    .details {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .42s var(--ease);
    }

    .recipe-card.open .details {
      grid-template-rows: 1fr;
    }

    .details-inner {
      overflow: hidden;
    }

    .details-content {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--rule);
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 18px;
    }

    .detail-block {
      border-radius: 18px;
      padding: 16px;
      background: var(--bg);
    }

    .detail-block h4 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .detail-block ul,
    .detail-block ol {
      margin: 0;
      padding-left: 20px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 10;
      padding: 13px 18px;
      border-radius: 999px;
      color: #ffffff;
      background: rgba(23, 51, 40, .92);
      box-shadow: 0 18px 42px rgba(23, 51, 40, .22);
      transform: translate(-50%, 24px);
      opacity: 0;
      pointer-events: none;
      transition: transform .28s var(--ease), opacity .28s var(--ease);
      font-weight: 800;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes scan {
      0%, 100% { transform: translateY(0); opacity: .45; }
      50% { transform: translateY(72px); opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    @keyframes heartBeat {
      0% { transform: scale(1); }
      45% { transform: scale(1.22); }
      100% { transform: scale(1); }
    }

    @media (max-width: 960px) {
      .hero,
      .workspace {
        grid-template-columns: 1fr;
      }

      .upload-card {
        position: relative;
        top: auto;
      }

      .upload-zone {
        min-height: 300px;
      }
    }

    @media (max-width: 680px) {
      .app {
        width: min(100% - 24px, 1180px);
        padding-top: 14px;
      }

      .hero-card,
      .side-card,
      .upload-card,
      .result-panel {
        border-radius: 24px;
      }

      .hero-card {
        min-height: auto;
      }

      .recipes-grid {
        grid-template-columns: 1fr;
      }

      .recipe-card.open {
        grid-column: auto;
      }

      .details-content {
        grid-template-columns: 1fr;
      }

      .section-head,
      .ingredient-title,
      .recipe-top {
        align-items: flex-start;
      }

      .section-head {
        flex-direction: column;
      }

      .hero-actions,
      .upload-actions {
        flex-direction: column;
      }

      .primary-btn,
      .ghost-btn {
        width: 100%;
      }

      .recipe-cover {
        height: 155px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

<body>
  <main class="app">
    <section class="hero" aria-label="应用介绍">
      <div class="hero-card">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M7 3v8M11 3v8M9 3v18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M16 4c2.2 1.4 3.4 3.5 3.4 6.3 0 2.4-.9 4.2-2.4 5.2V21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          智能识别 · 家常菜推荐
        </div>
        <h1>智能菜谱识别助手</h1>
        <p>上传一张冰箱食材照片，系统会模拟识别可用食材，并推荐简单易做的家常菜。无需后端接口，所有交互都在浏览器中完成。</p>
        <div class="hero-actions">
          <button class="primary-btn" id="heroUploadBtn" type="button">立即上传食材照片</button>
          <button class="ghost-btn" id="demoBtn" type="button">查看示例推荐</button>
        </div>
      </div>
      <aside class="side-card" aria-label="功能亮点">
        <div class="kitchen-illustration" aria-hidden="true">
          <div class="plate">
            <span class="food-dot tomato"></span>
            <span class="food-dot egg"></span>
            <span class="food-dot potato"></span>
            <span class="food-dot pepper"></span>
          </div>
        </div>
        <div class="tips">
          <div class="tip"><span></span>支持点击上传与拖拽上传</div>
          <div class="tip"><span></span>模拟识别食材并生成推荐</div>
          <div class="tip"><span></span>菜谱详情展开顺滑自然</div>
        </div>
      </aside>
    </section>

    <section class="workspace" aria-label="菜谱识别工作区">
      <div class="upload-card">
        <input class="file-input" id="fileInput" type="file" accept="image/*" />
        <label class="upload-zone" id="uploadZone" for="fileInput">
          <img id="previewImage" alt="已上传的食材照片预览" />
          <span class="upload-content">
            <span class="upload-icon" aria-hidden="true">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
                <path d="M12 15V4m0 0 4 4m-4-4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M5 14v3a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <strong class="upload-title">上传冰箱食材照片</strong>
            <p class="upload-hint">点击此区域选择图片，或将图片拖拽到这里。上传后会模拟识别食材并推荐菜谱。</p>
          </span>
        </label>
        <div class="upload-actions">
          <button class="primary-btn" id="chooseBtn" type="button">选择图片</button>
          <button class="ghost-btn" id="resetBtn" type="button">重新上传</button>
        </div>
      </div>

      <div class="result-panel">
        <div class="section-head">
          <div>
            <p class="section-kicker">Recipe Assistant</p>
            <h2>识别结果与菜谱推荐</h2>
          </div>
          <button class="small-btn" id="quickRecognizeBtn" type="button">模拟识别</button>
        </div>

        <div class="empty-state" id="emptyState">
          <div>
            <svg width="74" height="74" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 10c0-4 3.4-7 8-7s8 3 8 7c0 5-3.7 10-8 10s-8-5-8-10Z" stroke="currentColor" stroke-width="1.8"/>
              <path d="M8.5 10.5h.01M15.5 10.5h.01M9 15c1.7 1 4.3 1 6 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <h3>先上传一张食材照片</h3>
            <p>这里会展示识别出的食材标签和推荐菜谱。</p>
          </div>
        </div>

        <div class="loading" id="loadingState">
          <div>
            <div class="spinner-wrap" aria-hidden="true">
              <div class="spinner"></div>
              <div class="scan-line"></div>
            </div>
            <h3>正在识别食材...</h3>
            <p>正在分析照片中的食材组合，请稍候。</p>
          </div>
        </div>

        <div class="results" id="results">
          <div class="ingredient-box">
            <div class="ingredient-title">
              <h3>识别出的食材</h3>
              <span class="confidence">模拟置信度 96%</span>
            </div>
            <div class="tags" id="ingredientTags"></div>
          </div>

          <div class="section-head">
            <div>
              <p class="section-kicker">Recommended</p>
              <h2>适合今天做的家常菜</h2>
            </div>
          </div>
          <div class="recipes-grid" id="recipesGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">已收藏菜谱</div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadZone = document.getElementById('uploadZone');
    const previewImage = document.getElementById('previewImage');
    const chooseBtn = document.getElementById('chooseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const heroUploadBtn = document.getElementById('heroUploadBtn');
    const demoBtn = document.getElementById('demoBtn');
    const quickRecognizeBtn = document.getElementById('quickRecognizeBtn');
    const emptyState = document.getElementById('emptyState');
    const loadingState = document.getElementById('loadingState');
    const results = document.getElementById('results');
    const ingredientTags = document.getElementById('ingredientTags');
    const recipesGrid = document.getElementById('recipesGrid');
    const toast = document.getElementById('toast');

    const ingredients = ['西红柿', '鸡蛋', '土豆', '青椒'];

    const recipes = [
      {
        name: '西红柿炒鸡蛋',
        time: '12 分钟',
        difficulty: '简单',
        taste: '酸甜开胃',
        palette: ['#ff8787', '#ffd43b', '#51cf66'],
        seasonings: ['盐 适量', '白糖 少许', '葱花 少许', '食用油 适量'],
        materials: ['西红柿 2 个', '鸡蛋 3 个', '葱花 少许'],
        steps: ['西红柿洗净切块，鸡蛋打散备用。', '热锅倒油，先将鸡蛋炒至凝固后盛出。', '锅中留底油炒软西红柿，加入盐和少许白糖。', '倒回鸡蛋快速翻炒，撒葱花后出锅。']
      },
      {
        name: '青椒土豆丝',
        time: '15 分钟',
        difficulty: '简单',
        taste: '清爽脆嫩',
        palette: ['#69db7c', '#ffd8a8', '#94d82d'],
        seasonings: ['盐 适量', '米醋 1 勺', '生抽 半勺', '蒜末 少许'],
        materials: ['土豆 2 个', '青椒 1 个', '蒜 2 瓣'],
        steps: ['土豆切细丝，用清水冲洗掉表面淀粉。', '青椒切丝，蒜切末。', '热锅冷油爆香蒜末，加入土豆丝大火快炒。', '加入青椒丝、盐、米醋和生抽，炒匀即可。']
      },
      {
        name: '番茄土豆炖蛋',
        time: '22 分钟',
        difficulty: '中等',
        taste: '浓郁下饭',
        palette: ['#ff6b6b', '#fab005', '#f08c00'],
        seasonings: ['盐 适量', '生抽 1 勺', '胡椒粉 少许', '清水 半碗'],
        materials: ['西红柿 1 个', '土豆 1 个', '鸡蛋 2 个'],
        steps: ['土豆切小块，西红柿切丁，鸡蛋煎成荷包蛋。', '锅中炒出番茄汁，加入土豆块翻炒。', '加入清水、生抽和盐，炖至土豆软糯。', '放入煎蛋再炖 3 分钟，撒胡椒粉即可。']
      },
      {
        name: '青椒炒鸡蛋',
        time: '10 分钟',
        difficulty: '简单',
        taste: '鲜香快手',
        palette: ['#40c057', '#ffe066', '#2f9e44'],
        seasonings: ['盐 适量', '生抽 少许', '食用油 适量'],
        materials: ['青椒 2 个', '鸡蛋 3 个'],
        steps: ['青椒去籽切块，鸡蛋加少许盐打散。', '热锅倒油，先炒鸡蛋至蓬松后盛出。', '锅中再放少许油，青椒炒至断生。', '倒入鸡蛋和少许生抽，快速翻炒均匀。']
      },
      {
        name: '家常地三鲜简化版',
        time: '25 分钟',
        difficulty: '中等',
        taste: '咸鲜软糯',
        palette: ['#d8a75f', '#51cf66', '#ff922b'],
        seasonings: ['盐 适量', '生抽 1 勺', '蚝油 1 勺', '淀粉水 少许'],
        materials: ['土豆 2 个', '青椒 1 个', '西红柿 半个'],
        steps: ['土豆切块煎至表面金黄，青椒切片。', '锅中放入西红柿炒出少量汁水。', '加入土豆和青椒，放生抽、蚝油和盐调味。', '淋入少量淀粉水收汁，翻炒均匀出锅。']
      }
    ];

    function recipeSvg(recipe, index) {
      const [a, b, c] = recipe.palette;
      return `
        <svg class="recipe-art" viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${recipe.name}示意图">
          <defs>
            <linearGradient id="g${index}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${a}"/>
              <stop offset="58%" stop-color="${b}"/>
              <stop offset="100%" stop-color="${c}"/>
            </linearGradient>
            <filter id="s${index}" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#173328" flood-opacity=".18"/>
            </filter>
          </defs>
          <rect width="520" height="260" fill="url(#g${index})" opacity=".22"/>
          <circle cx="410" cy="42" r="82" fill="${c}" opacity=".18"/>
          <circle cx="90" cy="218" r="116" fill="#ffffff" opacity=".38"/>
          <g filter="url(#s${index})">
            <ellipse cx="260" cy="147" rx="150" ry="72" fill="#ffffff"/>
            <ellipse cx="260" cy="141" rx="112" ry="46" fill="${a}" opacity=".86"/>
            <circle cx="221" cy="127" r="28" fill="${b}"/>
            <circle cx="292" cy="153" r="24" fill="${c}"/>
            <rect x="252" y="94" width="34" height="102" rx="17" fill="#ffffff" opacity=".45" transform="rotate(22 269 145)"/>
            <path d="M146 78c40 28 82 32 126 12" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity=".6"/>
          </g>
        </svg>
      `;
    }

    function setState(state) {
      emptyState.style.display = state === 'empty' ? 'grid' : 'none';
      loadingState.classList.toggle('active', state === 'loading');
      results.classList.toggle('active', state === 'results');
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function renderIngredients() {
      ingredientTags.innerHTML = ingredients.map((item, index) => (
        `<span class="tag" style="animation-delay:${index * 70}ms">${item}</span>`
      )).join('');
    }

    function renderRecipes() {
      recipesGrid.innerHTML = recipes.map((recipe, index) => `
        <article class="recipe-card" data-index="${index}" style="animation-delay:${index * 80}ms" tabindex="0" aria-expanded="false">
          <div class="recipe-cover">
            ${recipeSvg(recipe, index)}
            <span class="badge">推荐菜谱</span>
          </div>
          <div class="recipe-body">
            <div class="recipe-top">
              <div>
                <h3>${recipe.name}</h3>
                <div class="meta">
                  <span>⏱ ${recipe.time}</span>
                  <span>⭐ ${recipe.difficulty}</span>
                  <span>🍃 ${recipe.taste}</span>
                </div>
              </div>
              <button class="favorite" type="button" aria-label="收藏${recipe.name}" title="收藏菜谱">♡</button>
            </div>
            <div class="details">
              <div class="details-inner">
                <div class="details-content">
                  <div class="detail-block">
                    <h4>所需食材</h4>
                    <ul>${recipe.materials.map(item => `<li>${item}</li>`).join('')}</ul>
                  </div>
                  <div class="detail-block">
                    <h4>调料与步骤</h4>
                    <ul>${recipe.seasonings.map(item => `<li>${item}</li>`).join('')}</ul>
                    <ol>${recipe.steps.map(step => `<li>${step}</li>`).join('')}</ol>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </article>
      `).join('');
    }

    function simulateRecognize() {
      setState('loading');
      window.setTimeout(() => {
        renderIngredients();
        renderRecipes();
        setState('results');
        results.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 1250);
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('请上传图片文件');
        return;
      }

      const reader = new FileReader();
      reader.onload = event => {
        previewImage.src = event.target.result;
        uploadZone.classList.add('has-image');
        simulateRecognize();
      };
      reader.readAsDataURL(file);
    }

    chooseBtn.addEventListener('click', () => fileInput.click());
    heroUploadBtn.addEventListener('click', () => {
      uploadZone.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => fileInput.click(), 400);
    });
    demoBtn.addEventListener('click', simulateRecognize);
    quickRecognizeBtn.addEventListener('click', simulateRecognize);

    resetBtn.addEventListener('click', () => {
      fileInput.value = '';
      previewImage.removeAttribute('src');
      uploadZone.classList.remove('has-image', 'dragover');
      recipesGrid.innerHTML = '';
      ingredientTags.innerHTML = '';
      setState('empty');
      showToast('已重置，可以重新上传');
    });

    fileInput.addEventListener('change', event => handleFile(event.target.files[0]));

    ['dragenter', 'dragover'].forEach(eventName => {
      uploadZone.addEventListener(eventName, event => {
        event.preventDefault();
        uploadZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadZone.addEventListener(eventName, event => {
        event.preventDefault();
        uploadZone.classList.remove('dragover');
      });
    });

    uploadZone.addEventListener('drop', event => {
      const file = event.dataTransfer.files[0];
      handleFile(file);
    });

    recipesGrid.addEventListener('click', event => {
      const favoriteBtn = event.target.closest('.favorite');
      const card = event.target.closest('.recipe-card');
      if (!card) return;

      if (favoriteBtn) {
        event.stopPropagation();
        favoriteBtn.classList.toggle('saved');
        favoriteBtn.textContent = favoriteBtn.classList.contains('saved') ? '♥' : '♡';
        showToast(favoriteBtn.classList.contains('saved') ? '已收藏菜谱' : '已取消收藏');
        return;
      }

      const isOpen = card.classList.contains('open');
      document.querySelectorAll('.recipe-card.open').forEach(item => {
        item.classList.remove('open');
        item.setAttribute('aria-expanded', 'false');
      });

      if (!isOpen) {
        card.classList.add('open');
        card.setAttribute('aria-expanded', 'true');
      }
    });

    recipesGrid.addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const card = event.target.closest('.recipe-card');
      if (!card || event.target.closest('.favorite')) return;
      event.preventDefault();
      card.click();
    });
  </script>
</body>
</html>
