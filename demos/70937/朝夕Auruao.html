<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="朝夕·Aurora — 碧山玉色，沉浸专注。一款集任务管理、番茄专注、闯关模式、日历视图、看板统计、音乐播放于一体的桌面每日计划应用。">
    <meta name="theme-color" content="#2E7D32">
    <title>朝夕 · Aurora — 碧山玉色，沉浸专注</title>
    <style>
        /* ═══════════════════════════════════════════
               1. 设计令牌 (CSS变量)
               ═══════════════════════════════════════════ */
        :root {
            --bishan: #2E7D32;
            --bishan-light: #4CAF50;
            --bishan-dark: #1B5E20;
            --bishan-bg: rgba(46, 125, 50, 0.10);
            --gold: #E6C070;
            --gold-light: #F0D48A;
            --fog: #8BAEB5;
            --yuse: #F1F7F0;
            --yuse-glass: rgba(241, 247, 240, 0.65);
            --yuse-glass2: rgba(241, 247, 240, 0.82);
            --text-1: #25412B;
            --text-2: #5C6C62;
            --text-3: #8A9B8D;
            --border-glass: rgba(255, 255, 255, 0.25);
            --border-card: rgba(46, 125, 50, 0.08);
            --shadow-card: 0 16px 48px -12px rgba(37, 65, 43, 0.15), 0 12px 32px -8px rgba(230, 192, 112, 0.08);
            --shadow-hover: 0 24px 64px -16px rgba(37, 65, 43, 0.22), 0 16px 40px -10px rgba(230, 192, 112, 0.14);
            --shadow-sm: 0 2px 6px rgba(37, 65, 43, 0.06);
            --shadow-md: 0 8px 24px -4px rgba(37, 65, 43, 0.10);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 26px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ═══════════════════════════════════════════
               2. Reset & 基础样式
               ═══════════════════════════════════════════ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background:
                linear-gradient(rgba(46, 125, 50, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 125, 50, 0.04) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.5) 0%, transparent 70%),
                radial-gradient(ellipse at 85% 90%, rgba(46, 125, 50, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 15% 10%, rgba(230, 192, 112, 0.10) 0%, transparent 40%),
                #F1F7F0;
            background-size: 24px 24px, 24px 24px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            background-attachment: fixed;
            color: var(--text-1);
            min-height: 100vh;
            position: relative;
            line-height: 1.6;
            font-size: 0.9rem;
            font-weight: 400;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.06;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
            background-repeat: repeat;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }
        h3 {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0;
            line-height: 1.4;
        }
        .body-text {
            font-size: 0.9rem;
            font-weight: 400;
            line-height: 1.6;
        }
        .caption {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-3);
        }

        /* ═══════════════════════════════════════════
               3. 毛玻璃卡片
               ═══════════════════════════════════════════ */
        .glass-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F5FAF3 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(46, 125, 50, 0.08);
            box-shadow:
                0 16px 48px -12px rgba(37, 65, 43, 0.15),
                0 12px 32px -8px rgba(230, 192, 112, 0.08),
                inset 2px 0 0 rgba(255, 255, 255, 0.9),
                inset 0 2px 0 rgba(255, 255, 255, 0.7);
            border-radius: var(--radius-lg);
            transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
            will-change: transform, box-shadow;
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow:
                0 24px 64px -16px rgba(37, 65, 43, 0.22),
                0 16px 40px -10px rgba(230, 192, 112, 0.14),
                inset 2px 0 0 rgba(255, 255, 255, 0.95),
                inset 0 2px 0 rgba(255, 255, 255, 0.8);
        }

        /* ═══════════════════════════════════════════
               4. 页面容器
               ═══════════════════════════════════════════ */
        .page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 48px;
            position: relative;
            z-index: 1;
        }

        /* ═══════════════════════════════════════════
               5. 导航栏
               ═══════════════════════════════════════════ */
        .navbar {
            position: sticky;
            top: 16px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 24px;
            border-radius: var(--radius-lg);
            margin-bottom: 40px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--bishan);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            flex-shrink: 0;
        }

        .navbar-brand svg {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 8px 20px;
            border-radius: 10px;
            color: var(--text-2);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.25s var(--ease);
            white-space: nowrap;
            outline: none;
            position: relative;
        }

        .nav-btn:hover {
            background: rgba(46, 125, 50, 0.06);
            color: var(--text-1);
            transform: translateY(-1px);
        }

        .nav-btn:focus-visible {
            outline: 2px solid var(--bishan-light);
            outline-offset: 2px;
            border-radius: 10px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-card);
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            color: var(--text-2);
            font-size: 1.1rem;
            transition: all 0.25s var(--ease);
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            margin-left: 4px;
            outline: none;
            font-family: inherit;
        }

        .theme-toggle:hover {
            background: rgba(46, 125, 50, 0.06);
            color: var(--text-1);
            transform: translateY(-1px);
        }

        .theme-toggle:focus-visible {
            outline: 2px solid var(--bishan-light);
            outline-offset: 2px;
            border-radius: 10px;
        }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
        }

        /* ═══════════════════════════════════════════
               6. Hero 区
               ═══════════════════════════════════════════ */
        .hero-section {
            text-align: center;
            padding-top: 60px;
            margin-bottom: 32px;
        }

        .hero-slogan {
            color: var(--gold);
            margin-bottom: 32px;
        }

        .hero-subtitle {
            color: var(--text-2);
            margin-top: 40px;
            max-width: 680px;
            margin-left: auto;
            margin-right: auto;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 0;
        }

        .feature-card {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            text-align: center;
            cursor: default;
        }

        .feature-card .feature-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .feature-card .feature-icon svg {
            width: 40px;
            height: 40px;
            display: block;
        }

        .feature-card h3 {
            color: var(--text-1);
            margin-top: 14px;
            margin-bottom: 0;
        }

        /* ═══════════════════════════════════════════
               7. 山脉闯关区
               ═══════════════════════════════════════════ */
        .mountain-section {
            margin-top: 56px;
            text-align: center;
        }

        .mountain-section h2 {
            color: var(--text-1);
            margin-bottom: 8px;
        }

        .mountain-section .mountain-subtitle {
            color: var(--text-2);
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        .mountain-svg-wrap {
            background: var(--yuse-glass2);
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            border: 1px solid var(--border-card);
            border-radius: var(--radius-xl);
            padding: 32px 20px 40px;
            box-shadow: var(--shadow-md);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .mountain-svg-wrap svg {
            display: block;
            width: 100%;
            height: auto;
            max-width: 800px;
            margin: 0 auto;
            min-width: 600px;
        }

        .mountain-cta {
            display: inline-block;
            margin-top: 24px;
            color: var(--bishan);
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 24px;
            background: rgba(46, 125, 50, 0.06);
            transition: all 0.3s var(--ease);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .mountain-cta:hover {
            background: rgba(46, 125, 50, 0.12);
            border-color: rgba(46, 125, 50, 0.2);
            transform: translateY(-2px);
        }

        /* ═══════════════════════════════════════════
               8. 信任标识区
               ═══════════════════════════════════════════ */
        .trust-section {
            margin-top: 60px;
        }

        .trust-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .trust-card {
            padding: 32px 24px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .trust-card .trust-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .trust-card .trust-icon svg {
            width: 32px;
            height: 32px;
            display: block;
        }

        .trust-card h3 {
            color: var(--text-1);
            margin: 0;
        }

        .trust-card .caption {
            color: var(--text-3);
            margin: 0;
            line-height: 1.5;
        }

        /* ═══════════════════════════════════════════
               9. Footer
               ═══════════════════════════════════════════ */
        .site-footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            color: var(--text-3);
        }

        .site-footer .copyright {
            margin: 0 0 6px;
        }

        .site-footer .tagline {
            margin: 0;
            color: var(--text-3);
        }

        /* ═══════════════════════════════════════════
               10. 滚动进入动画
               ═══════════════════════════════════════════ */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 交错延迟 */
        .features-grid .feature-card:nth-child(1) {
            transition-delay: 0.05s;
        }
        .features-grid .feature-card:nth-child(2) {
            transition-delay: 0.10s;
        }
        .features-grid .feature-card:nth-child(3) {
            transition-delay: 0.15s;
        }
        .features-grid .feature-card:nth-child(4) {
            transition-delay: 0.20s;
        }
        .features-grid .feature-card:nth-child(5) {
            transition-delay: 0.25s;
        }
        .features-grid .feature-card:nth-child(6) {
            transition-delay: 0.30s;
        }

        .trust-grid .trust-card:nth-child(1) {
            transition-delay: 0.05s;
        }
        .trust-grid .trust-card:nth-child(2) {
            transition-delay: 0.15s;
        }
        .trust-grid .trust-card:nth-child(3) {
            transition-delay: 0.25s;
        }

        /* ═══════════════════════════════════════════
               11. 山脉SVG — 节点hover tooltip
               ═══════════════════════════════════════════ */
        .mountain-node-done {
            cursor: pointer;
            position: relative;
        }

        .mountain-node-done:hover+.node-tooltip,
        .node-tooltip:hover {
            opacity: 1;
            visibility: visible;
        }

        /* ═══════════════════════════════════════════
               12. 暗色模式
               ═══════════════════════════════════════════ */
        [data-theme="dark"] {
            --yuse-glass: rgba(31, 43, 35, 0.88);
            --yuse-glass2: rgba(31, 43, 35, 0.94);
            --text-1: #FFFFFF;
            --text-2: #D0D8D2;
            --text-3: #8BA090;
            --border-glass: rgba(76, 175, 80, 0.08);
            --border-card: rgba(76, 175, 80, 0.06);
            --shadow-card: 0 16px 48px -12px rgba(0, 0, 0, 0.40), 0 4px 16px rgba(10, 17, 13, 0.3);
            --shadow-hover: 0 24px 64px -16px rgba(0, 0, 0, 0.50), 0 8px 24px rgba(10, 17, 13, 0.4);
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.20);
            --shadow-md: 0 8px 24px -4px rgba(0, 0, 0, 0.25);
        }

        [data-theme="dark"] .glass-card {
            background: linear-gradient(135deg, #1F2B23 0%, #253028 100%);
            box-shadow:
                0 16px 48px -12px rgba(0, 0, 0, 0.40),
                0 4px 16px rgba(10, 17, 13, 0.3),
                inset 1px 0 0 rgba(255, 255, 255, 0.04),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        [data-theme="dark"] .glass-card:hover {
            box-shadow:
                0 24px 64px -16px rgba(0, 0, 0, 0.50),
                0 8px 24px rgba(10, 17, 13, 0.4),
                inset 1px 0 0 rgba(255, 255, 255, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        [data-theme="dark"] body {
            background:
                linear-gradient(rgba(54, 76, 58, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(54, 76, 58, 0.03) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 70%),
                radial-gradient(ellipse at 85% 90%, rgba(46, 125, 50, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 15% 10%, rgba(230, 192, 112, 0.03) 0%, transparent 40%),
                #161E18;
        }

        [data-theme="dark"] body::before {
            opacity: 0.04;
        }

        [data-theme="dark"] .mountain-svg-wrap {
            background: rgba(31, 43, 35, 0.88);
            border-color: rgba(76, 175, 80, 0.08);
        }

        [data-theme="dark"] .nav-btn:hover {
            background: rgba(76, 175, 80, 0.10);
        }

        [data-theme="dark"] .theme-toggle:hover {
            background: rgba(76, 175, 80, 0.10);
        }

        [data-theme="dark"] .mountain-cta {
            background: rgba(76, 175, 80, 0.12);
            color: #8BC34A;
        }

        [data-theme="dark"] .mountain-cta:hover {
            background: rgba(76, 175, 80, 0.20);
            border-color: rgba(76, 175, 80, 0.3);
        }

        [data-theme="dark"] .feature-card h3,
        [data-theme="dark"] .trust-card h3 {
            color: #FFFFFF;
        }

        /* ═══════════════════════════════════════════
               13. 响应式
               ═══════════════════════════════════════════ */
        @media (max-width: 1279px) and (min-width: 769px) {
            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .trust-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .trust-grid .trust-card:last-child {
                grid-column: 1 / -1;
                max-width: 400px;
                justify-self: center;
                width: 100%;
            }
            .mountain-svg-wrap svg {
                min-width: 500px;
            }
        }

        @media (max-width: 768px) {
            .page {
                padding: 20px 16px;
            }
            .features-grid {
                grid-template-columns: 1fr;
            }
            .trust-grid {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 1.8rem;
            }
            h2 {
                font-size: 1.3rem;
            }
            h3 {
                font-size: 1rem;
            }
            .navbar {
                padding: 0 14px;
                height: 56px;
                top: 8px;
                border-radius: var(--radius-md);
                margin-bottom: 24px;
            }
            .navbar-brand {
                font-size: 1.05rem;
                gap: 6px;
            }
            .navbar-brand svg {
                width: 26px;
                height: 26px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 0.78rem;
            }
            .theme-toggle {
                padding: 6px 10px;
                font-size: 0.95rem;
            }
            .hero-section {
                padding-top: 20px;
            }
            .hero-slogan {
                margin-bottom: 20px;
            }
            .hero-subtitle {
                margin-top: 28px;
                font-size: 0.85rem;
            }
            .feature-card {
                min-height: 110px;
                padding: 20px 16px;
            }
            .mountain-svg-wrap {
                padding: 16px 8px 24px;
                border-radius: var(--radius-md);
            }
            .mountain-svg-wrap svg {
                min-width: 480px;
            }
            .mountain-section {
                margin-top: 36px;
            }
            .trust-section {
                margin-top: 36px;
            }
            .trust-card {
                padding: 24px 16px;
            }
            .site-footer {
                margin-top: 28px;
            }
            .navbar-nav {
                gap: 1px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0 8px;
                height: 50px;
                top: 4px;
                border-radius: var(--radius-sm);
                gap: 2px;
            }
            .navbar-brand {
                font-size: 0.9rem;
                gap: 4px;
            }
            .navbar-brand svg {
                width: 22px;
                height: 22px;
            }
            .nav-btn {
                padding: 5px 8px;
                font-size: 0.7rem;
                border-radius: 8px;
            }
            .theme-toggle {
                padding: 5px 7px;
                font-size: 0.85rem;
                border-radius: 8px;
                margin-left: 1px;
            }
        }

        /* ═══════════════════════════════════════════
               14. 打印样式
               ═══════════════════════════════════════════ */
        @media print {
            .navbar,
            .theme-toggle,
            .mountain-cta,
            .animate-on-scroll {
                animation: none !important;
                transition: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
            .navbar {
                position: static;
                box-shadow: none;
                border: 1px solid #ccc;
            }
            .glass-card {
                box-shadow: none;
                border: 1px solid #ddd;
                break-inside: avoid;
            }
            body::before {
                display: none;
            }
            body {
                background: #fff;
                color: #000;
            }
            .mountain-svg-wrap svg {
                min-width: auto;
                max-width: 100%;
            }
            @page {
                margin: 2cm;
            }
        }

        /* ═══════════════════════════════════════════
               15. 焦点可见样式
               ═══════════════════════════════════════════ */
        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--bishan-light);
            outline-offset: 3px;
            border-radius: 4px;
        }

        .glass-card:focus-within {
            outline: 2px solid rgba(46, 125, 50, 0.3);
            outline-offset: 4px;
            border-radius: var(--radius-lg);
        }

        /* 跳过导航链接（无障碍） */
        .skip-link {
            position: absolute;
            top: -100px;
            left: 16px;
            background: var(--bishan);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            z-index: 200;
            font-weight: 600;
            text-decoration: none;
            transition: top 0.3s;
            font-size: 0.9rem;
        }
        .skip-link:focus {
            top: 10px;
        }
    </style>
</head>
<body>
    <!-- 跳过导航链接（无障碍） -->
    <a href="#hero" class="skip-link" aria-label="跳转到主内容">跳转到主内容</a>

    <div class="page">

    <script>
        /* ═══════════════════════════════════════════
              最小化 JS
              ═══════════════════════════════════════════ */
        (function() {
            // 1. 主题切换
            const themeToggle = document.getElementById('themeToggle');
            const htmlEl = document.documentElement;
            const iconSun = themeToggle.querySelector('.icon-sun');
            const iconMoon = themeToggle.querySelector('.icon-moon');

            // 从 localStorage 读取主题偏好
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                htmlEl.setAttribute('data-theme', 'dark');
                iconSun.style.display = 'none';
                iconMoon.style.display = 'block';
                themeToggle.setAttribute('aria-label', '切换亮色模式');
            } else {
                htmlEl.setAttribute('data-theme', 'light');
                iconSun.style.display = 'block';
                iconMoon.style.display = 'none';
                themeToggle.setAttribute('aria-label', '切换暗色模式');
            }

            themeToggle.addEventListener('click', function() {
                const currentTheme = htmlEl.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    htmlEl.setAttribute('data-theme', 'light');
                    localStorage.setItem('theme', 'light');
                    iconSun.style.display = 'block';
                    iconMoon.style.display = 'none';
                    themeToggle.setAttribute('aria-label', '切换暗色模式');
                } else {
                    htmlEl.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    iconSun.style.display = 'none';
                    iconMoon.style.display = 'block';
                    themeToggle.setAttribute('aria-label', '切换亮色模式');
                }
            });

            // 2. 导航按钮平滑滚动
            const navButtons = document.querySelectorAll('.nav-btn[data-scroll]');
            navButtons.forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-scroll');
                    const target = document.getElementById(targetId);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
            });

            // 3. 滚动进入动画 (Intersection Observer)
            const animatedElements = document.querySelectorAll('.animate-on-scroll');
            if ('IntersectionObserver' in window) {
                const observerOptions = {
                    root: null,
                    rootMargin: '0px 0px -40px 0px',
                    threshold: 0.1
                };

                const observer = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            // 可见后不再观察
                            observer.unobserve(entry.target);
                        }
                    });
                }, observerOptions);

                animatedElements.forEach(function(el) {
                    observer.observe(el);
                });
            } else {
                // 降级：直接显示所有元素
                animatedElements.forEach(function(el) {
                    el.classList.add('visible');
                });
            }

            // 4. 山脉已完成节点的 hover tooltip 效果
            const doneNodes = document.querySelectorAll('.mountain-node-done');
            doneNodes.forEach(function(node) {
                node.addEventListener('mouseenter', function() {
                    this.style.cursor = 'pointer';
                    const circle = this.querySelector('circle');
                    if (circle) {
                        circle.setAttribute('stroke', '#F0D48A');
                        circle.setAttribute('stroke-width', '4');
                    }
                });
                node.addEventListener('mouseleave', function() {
                    const circle = this.querySelector('circle');
                    if (circle) {
                        circle.setAttribute('stroke', '#F1F7F0');
                        circle.setAttribute('stroke-width', '3');
                    }
                });
            });

            // 5. 锁定节点的 cursor 样式
            const lockedNodes = document.querySelectorAll('.mountain-svg-wrap g[aria-label$="锁定"]');
            lockedNodes.forEach(function(node) {
                node.style.cursor = 'not-allowed';
            });
        })();
    </script>
