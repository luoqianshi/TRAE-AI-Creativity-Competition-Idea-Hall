// ====== Drag & Drop ======
const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', (e) => {
  e.preventDefault(); uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
  if (!files.length) return;
  // Simulate upload with progress
  showProgress();
  let progress = 0;
  const interval = setInterval(() => {
    progress += 15;
    document.getElementById('progressFill').style.width = Math.min(progress, 95) + '%';
    document.getElementById('progressText').textContent = `正在分析 ${files.length} 个文件... ${Math.min(progress, 95)}%`;
    if (progress >= 95) {
      clearInterval(interval);
      setTimeout(() => {
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('progressText').textContent = '分析完成!';
        // Generate random results based on file count
        const results = generateRandomResults(files.length);
        showResults(results);
      }, 500);
    }
  }, 200);
}

  const statuses = ['pass', 'warning', 'critical'];

    const status = statuses[Math.floor(Math.random() * statuses.length)];

      filename: `上传发票_${String(i+1).padStart(3, '0')}.pdf`,
      status: status,
      riskScore: status === 'pass' ? Math.floor(Math.random() * 20) : status === 'warning' ? Math.floor(Math.random() * 30) + 30 : Math.floor(Math.random() * 20) + 70,
      fields: {
        "发票类型": "增值税普通发票", "发票代码": `0440${Math.floor(Math.random()*90+10)}${Math.floor(Math.random()*9000000+1000000)}`,
        "发票号码": String(Math.floor(Math.random()*90000000+10000000)), "开票日期": "2026-05-27",
        "购买方": "北京云图信息技术有限公司", "购买方税号": "91110108MA01L8X93K",
        "销售方": "上海星辰科技有限公司", "销售方税号": "91310115MA1H8N2P5R",
        "不含税金额": `¥${(Math.random()*50000+1000).toFixed(2)}`, "税率": "9%",
        "税额": `¥${(Math.random()*5000+100).toFixed(2)}`, "价税合计": `¥${(Math.random()*55000+1100).toFixed(2)}`
      },
      findings: status === 'pass' ? [{ level: "pass", message: "所有稽核项通过,未发现异常" }] :
        status === 'warning' ? [
          { level: "warning", message: "购买方纳税人识别号格式异常", expected: "15/18/20位", actual: "格式有误" },
          { level: "pass", message: "发票代码格式正确" }
        ] : [
          { level: "critical", message: "该发票与已录入发票重复", expected: "唯一", actual: "重复" },
          { level: "pass", message: "发票代码格式正确" },
          { level: "pass", message: "金额勾稽校验通过" }
        ]
    });
  }
  return results;
}

function showProgress() {
  document.getElementById('progressArea').classList.add('active');
  document.getElementById('resultsArea').classList.remove('active');
  document.getElementById('progressFill').style.width = '0%';
}

function loadDemo(type) {
  showProgress();
  let progress = 0;
  const interval = setInterval(() => {
    progress += 20;
    document.getElementById('progressFill').style.width = Math.min(progress, 95) + '%';
    document.getElementById('progressText').textContent = `正在分析... ${Math.min(progress, 95)}%`;
    if (progress >= 95) {
      clearInterval(interval);
      setTimeout(() => {
        document.getElementById('progressFill').style.width = '100%';
        document.getElementById('progressText').textContent = '分析完成!';
        showResults(DEMO_INVOICES[type] || []);
      }, 300);
    }
  }, 150);
}

function showResults(invoices) {
  if (!invoices.length) {
    document.getElementById('invoiceList').innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无发票数据</p></div>';
    document.getElementById('resultsArea').classList.add('active');
    return;
  }

  // Stats
  const total = invoices.length;
  const pass = invoices.filter(i => i.status === 'pass').length;
  const warning = invoices.filter(i => i.status === 'warning').length;
  const critical = invoices.filter(i => i.status === 'critical').length;
  const avgRisk = Math.round(invoices.reduce((s, i) => s + i.riskScore, 0) / total);

  document.getElementById('statsSummary').innerHTML = `
    <div class="stat-card"><div class="num blue">${total}</div><div class="label">总发票数</div></div>
    <div class="stat-card"><div class="num green">${pass}</div><div class="label">稽核通过</div></div>
    <div class="stat-card"><div class="num yellow">${warning}</div><div class="label">存在风险</div></div>
    <div class="stat-card"><div class="num red">${critical}</div><div class="label">严重异常</div></div>
    <div class="stat-card"><div class="num blue">${avgRisk}</div><div class="label">平均风险分</div></div>
  `;

  // Invoice list
  document.getElementById('invoiceList').innerHTML = invoices.map((inv, idx) => `
    <div class="invoice-item" id="inv-${idx}">
      <div class="invoice-header" onclick="toggleInvoice(${idx})">
        <div class="status-dot ${inv.status}"></div>
        <div class="filename">${inv.filename}</div>
        <span class="badge ${inv.status}">${inv.status === 'pass' ? '稽核通过' : inv.status === 'warning' ? '存在风险' : '严重异常'}</span>
        <span class="risk-score">风险: ${inv.riskScore}</span>
        <span class="toggle">▼</span>
      </div>
      <div class="invoice-detail">
        <div class="invoice-detail-inner">
          <div class="fields-grid">
            ${Object.entries(inv.fields).map(([k, v]) => `<div class="field-item"><span class="field-label">${k}</span><span class="field-value">${v}</span></div>`).join('')}
          </div>
          <div class="findings-title">稽核发现 (${inv.findings.length}项)</div>
          ${inv.findings.map(f => `
            <div class="finding-item ${f.level}">
              <div class="dot"></div>
              <div>
                <div>${f.message}</div>
                ${f.expected ? `<div style="font-size:0.75rem;opacity:0.8;margin-top:0.2rem;">期望: ${f.expected}${f.actual ? ' | 实际: ' + f.actual : ''}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `).join('');

  document.getElementById('resultsArea').classList.add('active');
}

function toggleInvoice(idx) {
  const el = document.getElementById('inv-' + idx);
  el.classList.toggle('expanded');
}
</script>
</body>
</html>
