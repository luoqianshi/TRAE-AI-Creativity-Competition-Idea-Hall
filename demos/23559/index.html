<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心流加速器 - Flow Accelerator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --accent-color: #a855f7;
            --bg-dark: #0f0f1a;
            --bg-card: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .app-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .timer-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 40px;
        }

        .timer-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--primary-color), var(--secondary-color), var(--accent-color), var(--primary-color));
            opacity: 0.2;
            animation: spin 20s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .timer-inner {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .mode-indicator {
            position: absolute;
            top: 20px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .mode-indicator.study {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .mode-indicator.break {
            background: linear-gradient(135deg, var(--success-color), #16a34a);
            color: white;
        }

        .time-display {
            font-size: 64px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .time-label {
            font-size: 14px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .speed-indicator {
            position: absolute;
            bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .speed-icon {
            width: 16px;
            height: 16px;
            border: 2px solid var(--primary-color);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .speed-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .progress-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-circle {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 942;
            stroke-dashoffset: 942;
            transition: stroke-dashoffset 0.1s ease;
            filter: drop-shadow(0 0 8px var(--primary-color));
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 320px;
        }

        .mode-tabs {
            display: flex;
            gap: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-card);
            color: var(--text-secondary);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .time-settings {
            display: flex;
            gap: 12px;
        }

        .time-btn {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: var(--text-primary);
        }

        .time-btn.active {
            border-color: var(--primary-color);
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary-color);
        }

        .speed-settings {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .speed-btn {
            padding: 10px 16px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: transparent;
            color: var(--text-secondary);
        }

        .speed-btn.active {
            border-color: var(--accent-color);
            background: rgba(168, 85, 247, 0.2);
            color: var(--accent-color);
        }

        .action-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
        }

        .action-btn:active {
            transform: translateY(0);
        }

        .action-btn.reset {
            background: var(--bg-card);
            color: var(--text-secondary);
            box-shadow: none;
        }

        .flow-messages {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .flow-message {
            padding: 12px 24px;
            background: rgba(15, 15, 26, 0.9);
            border: 1px solid var(--primary-color);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-primary);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 20px;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .stats-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 8px;
        }

        .stats-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stats-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .focus-level {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 16px;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .focus-bar {
            width: 80px;
            height: 6px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .focus-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .focus-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .stats-panel, .focus-level {
                display: none;
            }

            .timer-container {
                width: 280px;
                height: 280px;
            }

            .time-display {
                font-size: 56px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="stars-bg" id="stars-bg"></div>
    
    <div class="app-container">
        <div class="header">
            <div class="logo">Flow Accelerator</div>
            <h1 class="title">心流加速器</h1>
            <p class="subtitle">沉浸式时间感知计时器</p>
        </div>

        <div class="timer-container">
            <div class="timer-ring"></div>
            <svg class="progress-ring" viewBox="0 0 320 320">
                <circle class="progress-circle" cx="160" cy="160" r="150"></circle>
            </svg>
            <div class="timer-inner">
                <div class="mode-indicator" id="mode-indicator">学习模式</div>
                <div class="time-display" id="time-display">25:00</div>
                <div class="time-label" id="time-label">剩余时间</div>
                <div class="speed-indicator" id="speed-indicator">
                    <div class="speed-icon"></div>
                    <span class="speed-text">1x</span>
                </div>
            </div>
        </div>

        <div class="controls-container">
            <div class="mode-tabs">
                <button class="tab-btn active" id="study-tab">学习</button>
                <button class="tab-btn" id="break-tab">休息</button>
            </div>

            <div class="time-settings">
                <button class="time-btn active" data-time="25">25分</button>
                <button class="time-btn" data-time="45">45分</button>
                <button class="time-btn" data-time="60">60分</button>
            </div>

            <div class="speed-settings" id="speed-settings">
                <button class="speed-btn" data-speed="1">1x</button>
                <button class="speed-btn active" data-speed="5">5x</button>
                <button class="speed-btn" data-speed="10">10x</button>
                <button class="speed-btn" data-speed="20">20x</button>
            </div>

            <button class="action-btn" id="start-btn">开始专注</button>
            <button class="action-btn reset" id="reset-btn">重置</button>
        </div>
    </div>

    <div class="focus-level">
        <div class="focus-text">专注度</div>
        <div class="focus-bar">
            <div class="focus-fill" id="focus-fill"></div>
        </div>
    </div>

    <div class="stats-panel">
        <div class="stats-title">今日统计</div>
        <div class="stats-item">
            <span class="stats-label">专注时长</span>
            <span class="stats-value" id="stats-focus">0小时</span>
        </div>
        <div class="stats-item">
            <span class="stats-label">完成任务</span>
            <span class="stats-value" id="stats-tasks">0个</span>
        </div>
        <div class="stats-item">
            <span class="stats-label">心流次数</span>
            <span class="stats-value" id="stats-flows">0次</span>
        </div>
    </div>

    <div class="flow-messages" id="flow-messages"></div>

    <script>
        const starsBg = document.getElementById('stars-bg');
        const timeDisplay = document.getElementById('time-display');
        const timeLabel = document.getElementById('time-label');
        const modeIndicator = document.getElementById('mode-indicator');
        const speedIndicator = document.getElementById('speed-indicator');
        const speedText = speedIndicator.querySelector('.speed-text');
        const progressCircle = document.querySelector('.progress-circle');
        const focusFill = document.getElementById('focus-fill');
        const flowMessages = document.getElementById('flow-messages');
        
        const studyTab = document.getElementById('study-tab');
        const breakTab = document.getElementById('break-tab');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        
        const statsFocus = document.getElementById('stats-focus');
        const statsTasks = document.getElementById('stats-tasks');
        const statsFlows = document.getElementById('stats-flows');

        const speedSettings = document.getElementById('speed-settings');
        const timeBtns = document.querySelectorAll('.time-btn');
        const speedBtns = speedSettings.querySelectorAll('.speed-btn');

        let currentMode = 'study';
        let currentTime = 25 * 60;
        let totalTime = 25 * 60;
        let currentSpeed = 5;
        let isRunning = false;
        let intervalId = null;
        let focusLevel = 0;
        
        let todayStats = {
            focusTime: 0,
            tasks: 0,
            flows: 0
        };

        function createStars() {
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.opacity = Math.random() * 0.5 + 0.3;
                starsBg.appendChild(star);
            }
        }

        function updateTimeDisplay() {
            const minutes = Math.floor(currentTime / 60);
            const seconds = currentTime % 60;
            timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            const progress = (totalTime - currentTime) / totalTime;
            progressCircle.style.strokeDashoffset = 942 * (1 - progress);
        }

        function updateSpeedDisplay() {
            speedText.textContent = currentMode === 'study' ? `${currentSpeed}x` : '1x';
            if (currentMode === 'study' && currentSpeed > 1) {
                speedIndicator.style.display = 'flex';
            } else {
                speedIndicator.style.display = 'none';
            }
        }

        function updateFocusLevel() {
            if (isRunning) {
                const progress = (totalTime - currentTime) / totalTime;
                focusLevel = Math.min(100, progress * 100);
                focusFill.style.width = focusLevel + '%';
            }
        }

        function addFlowMessage(message) {
            const msg = document.createElement('div');
            msg.className = 'flow-message';
            msg.textContent = message;
            flowMessages.appendChild(msg);
            
            setTimeout(() => {
                msg.style.opacity = '0';
                msg.style.transform = 'translateY(-20px)';
                setTimeout(() => msg.remove(), 500);
            }, 2000);
        }

        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.textContent = '暂停';
            
            if (currentMode === 'study') {
                addFlowMessage('✨ 心流模式已开启，专注开始！');
                todayStats.flows++;
                statsFlows.textContent = `${todayStats.flows}次`;
            } else {
                addFlowMessage('☕ 休息时间到，放松身心吧！');
            }

            intervalId = setInterval(() => {
                const decrement = currentMode === 'study' ? currentSpeed : 1;
                currentTime = Math.max(0, currentTime - decrement);
                
                updateTimeDisplay();
                updateFocusLevel();
                
                if (currentTime <= 0) {
                    stopTimer();
                    
                    if (currentMode === 'study') {
                        todayStats.tasks++;
                        todayStats.focusTime += totalTime;
                        statsTasks.textContent = `${todayStats.tasks}个`;
                        const hours = Math.floor(todayStats.focusTime / 3600);
                        const minutes = Math.floor((todayStats.focusTime % 3600) / 60);
                        statsFocus.textContent = minutes > 0 ? `${hours}小时${minutes}分` : `${hours}小时`;
                        
                        addFlowMessage('🎉 太棒了！完成一轮专注！');
                        setTimeout(() => {
                            switchMode();
                            startTimer();
                        }, 2000);
                    } else {
                        addFlowMessage('⏰ 休息结束，准备下一轮！');
                        setTimeout(() => {
                            switchMode();
                            startTimer();
                        }, 2000);
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            isRunning = false;
            startBtn.textContent = '继续';
            
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        function resetTimer() {
            stopTimer();
            currentTime = totalTime;
            focusLevel = 0;
            focusFill.style.width = '0%';
            updateTimeDisplay();
            startBtn.textContent = '开始专注';
        }

        function switchMode() {
            if (currentMode === 'study') {
                setMode('break');
                totalTime = 5 * 60;
                currentTime = 5 * 60;
            } else {
                setMode('study');
                totalTime = 25 * 60;
                currentTime = 25 * 60;
            }
            updateTimeDisplay();
        }

        function setMode(mode) {
            currentMode = mode;
            
            if (mode === 'study') {
                studyTab.classList.add('active');
                breakTab.classList.remove('active');
                modeIndicator.textContent = '学习模式';
                modeIndicator.className = 'mode-indicator study';
                speedSettings.style.display = 'flex';
            } else {
                studyTab.classList.remove('active');
                breakTab.classList.add('active');
                modeIndicator.textContent = '休息模式';
                modeIndicator.className = 'mode-indicator break';
                speedSettings.style.display = 'none';
            }
            
            updateSpeedDisplay();
        }

        studyTab.addEventListener('click', () => {
            if (!isRunning) {
                setMode('study');
                totalTime = 25 * 60;
                currentTime = 25 * 60;
                updateTimeDisplay();
            }
        });

        breakTab.addEventListener('click', () => {
            if (!isRunning) {
                setMode('break');
                totalTime = 5 * 60;
                currentTime = 5 * 60;
                updateTimeDisplay();
            }
        });

        timeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isRunning && currentMode === 'study') {
                    timeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    totalTime = parseInt(btn.dataset.time) * 60;
                    currentTime = totalTime;
                    updateTimeDisplay();
                }
            });
        });

        speedBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isRunning) {
                    speedBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSpeed = parseInt(btn.dataset.speed);
                    updateSpeedDisplay();
                }
            });
        });

        startBtn.addEventListener('click', () => {
            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', resetTimer);

        createStars();
        updateTimeDisplay();
        updateSpeedDisplay();
    </script>
</body>
</html>
