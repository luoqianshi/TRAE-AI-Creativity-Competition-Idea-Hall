:root{

}
body{font-family:'Inter',system-ui,sans-serif;background:var(--g50);color:var(--g800);line-height:1.5;overflow:hidden;height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:13px}

/* ===== LOGIN ===== */

.login-card{background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:48px;width:400px;position:relative;z-index:1}
.login-card h1{font-size:28px;font-weight:800;color:#fff;margin-bottom:4px}
.login-card h1 span{color:var(--lime)}
.login-card .sub{font-size:13px;color:var(--g400);margin-bottom:32px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--g400);margin-bottom:6px}
.login-field input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#fff;font-size:14px;outline:none;transition:border-color .2s}
.login-field input:focus{border-color:var(--lime)}
.login-field input::placeholder{color:var(--g500)}
.login-btn{width:100%;padding:12px;border-radius:10px;background:var(--lime);color:var(--g900);font-size:14px;font-weight:700;margin-top:8px;transition:all .2s}
.login-btn:hover{background:var(--lime-d);transform:translateY(-1px);box-shadow:0 4px 16px rgba(198,244,50,0.3)}
.login-hint{text-align:center;margin-top:16px;font-size:11px;color:var(--g500)}

/* ===== APP LAYOUT ===== */
.app{display:none;height:100vh}
.app.active{display:flex}
.login-page.hidden{display:none}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--g200);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden}
.sidebar-brand{padding:16px 20px;font-size:20px;font-weight:800;color:var(--g900);border-bottom:1px solid var(--g100)}
.sidebar-brand span{color:var(--lime)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.sidebar-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--g500);transition:all .15s;margin-bottom:2px}
.sidebar-nav a:hover{background:var(--g100);color:var(--g700)}
.sidebar-nav a.active{background:rgba(198,244,50,0.1);color:var(--g900);font-weight:600}
.sidebar-nav a .icon{width:20px;text-align:center;font-size:15px}
.sidebar-user{padding:12px 16px;border-top:1px solid var(--g100);display:flex;align-items:center;gap:10px}
.sidebar-user .avatar{width:32px;height:32px;border-radius:8px;background:var(--lime);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--g900)}
.sidebar-user .info{flex:1}
.sidebar-user .info .name{font-size:13px;font-weight:600;color:var(--g900)}
.sidebar-user .info .role{font-size:11px;color:var(--g400)}
.sidebar-user .logout{font-size:11px;color:var(--g400);padding:4px 8px;border-radius:6px;transition:all .15s}
.sidebar-user .logout:hover{background:var(--g100);color:var(--coral)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.header{height:var(--header-h);background:#fff;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.header .page-title{font-size:15px;font-weight:700;color:var(--g900)}
.header .actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--lime);color:var(--g900)}
.btn-primary:hover{background:var(--lime-d)}
.btn-secondary{background:var(--g100);color:var(--g700);border:1px solid var(--g200)}
.btn-secondary:hover{background:var(--g200)}
.btn-ghost{color:var(--g500)}
.btn-ghost:hover{background:var(--g100)}
.btn-danger{background:rgba(252,129,129,0.1);color:#dc2626}
.btn-danger:hover{background:rgba(252,129,129,0.2)}
.btn-sm{padding:5px 10px;font-size:11px}

.content{flex:1;overflow-y:auto;padding:24px}

/* ===== COMPONENTS ===== */
.card{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:20px;transition:all .2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.04)}
.card-title{font-size:14px;font-weight:700;color:var(--g900);margin-bottom:4px}
.card-sub{font-size:12px;color:var(--g400);margin-bottom:16px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.badge-lime{background:rgba(198,244,50,0.15);color:#4a7a00}
.badge-teal{background:rgba(79,209,197,0.15);color:#0d9488}
.badge-amber{background:rgba(246,173,85,0.15);color:#c2702e}
.badge-coral{background:rgba(252,129,129,0.15);color:#dc2626}
.badge-purple{background:rgba(129,140,248,0.15);color:#6366f1}
.badge-gray{background:var(--g100);color:var(--g600)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
.stat-card{display:flex;align-items:center;gap:14px}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.stat-value{font-size:24px;font-weight:800;color:var(--g900);line-height:1}
.stat-label{font-size:11px;color:var(--g400);margin-top:2px}
.stat-change{font-size:11px;font-weight:600;margin-top:4px}
.stat-change.up{color:#22c55e}
.stat-change.down{color:var(--coral)}

.table{width:100%;border-collapse:collapse}
.table th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--g400);padding:10px 14px;text-align:left;border-bottom:1px solid var(--g200);background:var(--g50)}
.table td{font-size:13px;color:var(--g700);padding:10px 14px;border-bottom:1px solid var(--g100)}
.table tr:hover td{background:var(--g50)}
.table .actions{display:flex;gap:4px}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}

/* Toggle */
.toggle{position:relative;width:36px;height:20px;border-radius:10px;cursor:pointer;transition:background .2s}
.toggle.on{background:var(--lime)}
.toggle.off{background:var(--g300)}
.toggle .knob{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .2s}
.toggle.on .knob{left:18px}
.toggle.off .knob{left:2px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center}
.modal-bg.active{display:flex}
.modal-box{background:#fff;border-radius:16px;width:520px;max-height:80vh;overflow-y:auto;animation:modalIn .2s ease}

.modal-body{padding:20px 24px}
.field{margin-bottom:14px}

.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lime)}
.field textarea{resize:vertical;min-height:60px}
.modal-body .field{margin-bottom:14px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--g100);display:flex;justify-content:flex-end;gap:8px}

.toast{position:fixed;top:20px;right:20px;z-index:300;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;animation:toastIn .3s ease;pointer-events:none}
.toast-success{background:#22c55e}
.toast-error{background:var(--coral)}

.chart-bar{position:absolute;bottom:0;border-radius:6px 6px 0 0;transition:height .6s ease}
.chart-line{position:absolute;width:100%;height:100%}

/* Radar placeholder */
.radar-placeholder{width:200px;height:200px;margin:0 auto;position:relative}
.radar-bg{position:absolute;inset:0;border-radius:50%;border:1px solid var(--g200)}
.radar-bg:nth-child(2){inset:25%}
.radar-bg:nth-child(3){inset:50%}

/* Page specific */
.page{display:none}
.page.active{display:block}

/* Progress bar */
.progress{height:6px;border-radius:3px;background:var(--g100);overflow:hidden}
.progress-bar{height:100%;border-radius:3px;transition:width .6s ease}

/* Animations */
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Responsive */
@media(max-width:768px){
  .sidebar{display:none}
  .grid-3,.grid-4{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}

</style>
</head>

// ===== AUTH =====
function doLogin(){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  navigate('dashboard');
}
function doLogout(){
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginPage').classList.remove('hidden');
}

// ===== NAVIGATION =====
const pageTitles = {dashboard:'总览',monitor:'多维度监测',diagnosis:'智能诊断',strategy:'策略中心',content:'内容生成',distribution:'分发管理',alerts:'风险预警',competitors:'竞品分析',reports:'报告中心',settings:'系统设置'};

function navigate(page){
  document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  document.getElementById('pageTitle').textContent = pageTitles[page]||'';
  renderPage(page);
}

document.getElementById('sidebarNav').addEventListener('click',e=>{
  const a = e.target.closest('a');
  if(a){e.preventDefault();navigate(a.dataset.page)}
});

// ===== TOAST =====
function toast(msg,type='success'){
  const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2500);
}

// ===== MODAL =====
function openModal(title,bodyHTML,footHTML){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHTML;
  document.getElementById('modalFoot').innerHTML=footHTML||'';
  document.getElementById('modalBg').classList.add('active');
}
function closeModal(){document.getElementById('modalBg').classList.remove('active')}
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target===document.getElementById('modalBg'))closeModal()});

// ===== RENDER PAGES =====
function renderPage(page){
  const c=document.getElementById('content');

  if(renderers[page]) renderers[page](c,ha);
  c.querySelectorAll('.fade-in').forEach((el,i)=>{el.style.animationDelay=i*50+'ms'});
}

    <div class="card"><div class="stat-card"><div class="stat-icon" style="background:rgba(246,173,85,.15)">🟠</div><div><div class="stat-value">${counts.orange}</div><div class="stat-label">重要预警</div></div></div></div>
    <div class="card"><div class="stat-card"><div class="stat-icon" style="background:rgba(246,224,94,.2)">🟡</div><div><div class="stat-value">${counts.yellow}</div><div class="stat-label">提示预警</div></div></div></div>
  </div>
  <div class="card fade-in">
    <table class="table"><thead><tr><th>预警</th><th>级别</th><th>平台</th><th>时间</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${mockData.alerts.map(a=>`<tr>
      <td style="font-weight:600">${a.title}</td>
      <td><span class="badge badge-${alertLevelLabels[a.level].t}">${alertLevelLabels[a.level].l}</span></td>
      <td>${a.platform}</td><td>${a.time}</td>
      <td><span class="badge badge-${a.status==='resolved'?'lime':a.status==='processing'?'amber':'gray'}">${a.status==='resolved'?'已解决':a.status==='processing'?'处理中':'待处理'}</span></td>
      <td class="actions">
        <button class="btn btn-sm btn-secondary" onclick="showAlertDetail('${a.id}')">详情</button>

function showAlertDetail(id){

function deleteAlert(id){
