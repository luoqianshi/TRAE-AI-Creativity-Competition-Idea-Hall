<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周末去哪儿</title>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF6EF;
      --card-bg: #FFFFFF;
      --primary: #8DB596;
      --primary-dark: #6B9A76;
      --accent: #E8A87C;
      --text: #4A4A48;
      --text-light: #8C8C8A;
      --shadow: rgba(0, 0, 0, 0.06);
      --shadow-hover: rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text);
    }

    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    /* 顶部标题区域 */
    .header {
      margin-bottom: 48px;
      position: relative;
    }

    .header-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    .header-icon::before,
    .header-icon::after {
      content: '';
      position: absolute;
      background: var(--primary);
      border-radius: 50% 0 50% 0;
    }

    .header-icon::before {
      width: 28px;
      height: 40px;
      top: 4px;
      left: 6px;
      transform: rotate(-25deg);
      opacity: 0.8;
    }

    .header-icon::after {
      width: 22px;
      height: 32px;
      top: 10px;
      right: 8px;
      transform: rotate(15deg);
      opacity: 0.6;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 2.4rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-light);
      font-weight: 400;
    }

    /* 按钮区域 */
    .button-area {
      margin-bottom: 36px;
    }

    .decide-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 18px 56px;
      font-size: 1.15rem;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 500;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(141, 181, 150, 0.35);
      transition: all 0.3s ease;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }

    .decide-btn:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(141, 181, 150, 0.45);
    }

    .decide-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(141, 181, 150, 0.35);
    }

    .decide-btn::after {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-left: 10px;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
      box-shadow: -6px 2px 0 -2px rgba(255,255,255,0.5), 4px -4px 0 -3px rgba(255,255,255,0.4);
      vertical-align: middle;
      animation: sparkle 1.5s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .decide-btn.shaking {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(0); }
      15% { transform: translateX(-6px) rotate(-2deg); }
      30% { transform: translateX(5px) rotate(2deg); }
      45% { transform: translateX(-4px) rotate(-1deg); }
      60% { transform: translateX(3px) rotate(1deg); }
      75% { transform: translateX(-2px) rotate(0); }
    }

    /* 结果卡片区域 */
    .result-area {
      min-height: 180px;
      perspective: 1000px;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 8px 32px var(--shadow);
      opacity: 0;
      transform: rotateX(-90deg) translateY(20px);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      border: 1px solid rgba(141, 181, 150, 0.15);
    }

    .result-card.show {
      opacity: 1;
      transform: rotateX(0) translateY(0);
    }

    .result-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: var(--primary);
      border-radius: 0 0 4px 4px;
      opacity: 0.4;
    }

    .recommendation {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .recommendation .label {
      color: var(--primary-dark);
      font-weight: 500;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 6px;
    }

    .recommendation .place {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 1.6rem;
      color: var(--primary-dark);
    }

    .recommendation .reason {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-light);
    }

    .tips {
      font-size: 0.85rem;
      color: var(--accent);
      padding-top: 16px;
      border-top: 1px dashed rgba(232, 168, 124, 0.3);
      line-height: 1.6;
    }

    .tips::before {
      content: '小贴士：';
      font-weight: 500;
      opacity: 0.8;
    }

    /* 空状态提示 */
    .placeholder {
      color: var(--text-light);
      font-size: 0.9rem;
      padding: 40px 20px;
      opacity: 0.6;
    }

    .placeholder-icon {
      width: 36px;
      height: 36px;
      margin: 0 auto 12px;
      border: 3px solid var(--primary);
      border-radius: 50%;
      position: relative;
      opacity: 0.4;
      animation: bounce 2s infinite;
    }

    .placeholder-icon::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -40%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 10px solid var(--primary);
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* 底部小字 */
    .footer {
      margin-top: 48px;
      font-size: 0.75rem;
      color: var(--text-light);
      opacity: 0.5;
    }

    /* 响应式 */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.9rem;
      }
      .decide-btn {
        padding: 16px 44px;
        font-size: 1.05rem;
      }
      .result-card {
        padding: 24px 20px;
      }
      .recommendation .place {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon"></div>
      <h1>周六早上，去哪晃悠？</h1>
      <p class="subtitle">不想做决定？让我来</p>
    </div>

    <div class="button-area">
      <button class="decide-btn" id="decideBtn">帮我决定</button>
    </div>

    <div class="result-area" id="resultArea">
      <div class="placeholder">
        <div class="placeholder-icon"></div>
        点一下按钮，给你变个周末计划出来
      </div>
    </div>

    <div class="footer"> made with caffeine & boredom</div>
  </div>

  <script>
    const places = [
      {
        name: '西岸美术馆',
        reason: '人少，适合发呆',
        tips: '下午四点后光线最好，拍照不用滤镜'
      },
      {
        name: '独立咖啡馆（随便哪家）',
        reason: '角落里有插座和 WiFi',
        tips: '带本书，点杯拿铁，可以假装文艺一下午'
      },
      {
        name: '城市绿道',
        reason: '空气清新，走路不费脑子',
        tips: '戴耳机听播客，走着走着就清爽了'
      },
      {
        name: '旧书店',
        reason: '翻别人不要的书，像寻宝',
        tips: '别急着买，先站着看完第三章'
      },
      {
        name: '河边长椅',
        reason: '免费，没人打扰',
        tips: '带点小零食，看鸭子打架比刷手机有趣'
      },
      {
        name: '社区公园',
        reason: '看小朋友追泡泡很治愈',
        tips: '周末上午去，能蹭到摆摊的煎饼果子'
      },
      {
        name: '楼顶天台',
        reason: '视野好，风也大',
        tips: '傍晚去，等一场不用花钱的日落'
      },
      {
        name: '菜市场（真的）',
        reason: '比超市热闹，烟火气足',
        tips: '买两根黄瓜回家，假装自己要做饭'
      },
      {
        name: '24 小时便利店',
        reason: '凌晨去有种世界尽头的浪漫',
        tips: '关东煮要萝卜和魔芋丝，懂的人都懂'
      },
      {
        name: '家附近的林荫道',
        reason: '不花钱，也不用想',
        tips: ' earbuds 一戴，谁都不爱，走路就行'
      },
      {
        name: '美术馆或画廊',
        reason: '看不懂也没关系，安静就好',
        tips: '穿舒服的鞋，有的馆地板比画还硬'
      },
      {
        name: '大学 campus',
        reason: '年轻的气息，食堂还便宜',
        tips: '假装自己是学生，混进图书馆 nap 一下'
      }
    ];

    let lastIndex = -1;
    let isAnimating = false;

    const btn = document.getElementById('decideBtn');
    const resultArea = document.getElementById('resultArea');

    btn.addEventListener('click', () => {
      if (isAnimating) return;
      isAnimating = true;

      // 按钮摇晃动画
      btn.classList.add('shaking');
      setTimeout(() => btn.classList.remove('shaking'), 500);

      // 隐藏旧结果
      const oldCard = resultArea.querySelector('.result-card');
      if (oldCard) {
        oldCard.classList.remove('show');
      }

      // 随机选一个（尽量不重复）
      let idx;
      do {
        idx = Math.floor(Math.random() * places.length);
      } while (idx === lastIndex && places.length > 1);
      lastIndex = idx;

      const place = places[idx];

      // 创建新卡片
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="recommendation">
          <span class="label">推荐你去：</span>
          <span class="place">${place.name}</span>
          <span class="reason">（${place.reason}）</span>
        </div>
        <div class="tips">${place.tips}</div>
      `;

      // 先清空，插入新卡片
      setTimeout(() => {
        resultArea.innerHTML = '';
        resultArea.appendChild(card);

        // 强制重绘后触发动画
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            card.classList.add('show');
          });
        });

        isAnimating = false;
      }, oldCard ? 300 : 0);
    });
  </script>
</body>
</html>
