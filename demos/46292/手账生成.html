<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* Happy Life - Warm Handcrafted Journal Style */
/* Brand CSS Variables */

:root {
  /* Brand Prefix: hl */
  --hl-primary: #E8985E;
  --hl-primary-light: #F2B88A;
  --hl-primary-lighter: #FAE5D0;
  --hl-primary-lightest: #FFF6EE;
  --hl-primary-dark: #C47A45;

  /* Warm Neutrals */
  --hl-bg: #FFFAF5;
  --hl-bg-alt: #FFF3EA;
  --hl-surface: #FFFFFF;
  --hl-surface-alt: #FFF8F2;
  --hl-surface-hover: #FFF0E6;

  --hl-text: #4A3728;
  --hl-text-secondary: #7A6558;
  --hl-text-tertiary: #A89385;
  --hl-text-inverse: #FFFFFF;

  --hl-border: #E8D5C4;
  --hl-border-light: #F0E4D8;

  /* Accent */
  --hl-accent-green: #7EB09B;
  --hl-accent-green-light: #D4EDE0;
  --hl-accent-rose: #D4838F;
  --hl-accent-rose-light: #F2DDE1;
  --hl-accent-sky: #7BA3B5;
  --hl-accent-sky-light: #D6E8F0;

  /* State Colors */
  --hl-state-success: #6B9F78;
  --hl-state-warning: #D4A037;
  --hl-state-error: #C46060;
  --hl-state-info: #6B8FB5;

  /* Typography */
  --hl-font-display: 'Noto Serif SC', 'Georgia', serif;
  --hl-font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --hl-font-hand: 'Caveat', 'Ma Shan Zheng', cursive;

  --hl-text-xs: 0.75rem;
  --hl-text-sm: 0.875rem;
  --hl-text-base: 1rem;
  --hl-text-lg: 1.125rem;
  --hl-text-xl: 1.25rem;
  --hl-text-2xl: 1.5rem;
  --hl-text-3xl: 2rem;

  --hl-leading-tight: 1.25;
  --hl-leading-normal: 1.6;
  --hl-leading-relaxed: 1.8;

  /* Spacing */
  --hl-space-xs: 4px;
  --hl-space-sm: 8px;
  --hl-space-md: 12px;
  --hl-space-base: 16px;
  --hl-space-lg: 24px;
  --hl-space-xl: 32px;
  --hl-space-2xl: 48px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Shadow - static surfaces use border-first */
  --hl-shadow-sm: 0 1px 2px rgba(74, 55, 40, 0.04);
  --hl-shadow-md: 0 2px 8px rgba(74, 55, 40, 0.05);
  --hl-shadow-float: 0 8px 24px rgba(74, 55, 40, 0.08);

  /* Depth */
  --hl-depth-border: 1px solid var(--hl-border);
  --hl-depth-border-light: 1px solid var(--hl-border-light);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--hl-primary);
    --color-border: var(--hl-border);
  }
  @layer base {
    body { background: var(--hl-surface); color: var(--hl-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background: var(--hl-bg); font-family: var(--hl-font-body);">

        <!-- Top Bar -->
        <header class="sticky top-0 z-30 flex items-center px-4 h-14 border-b" style="background: rgba(255,250,245,0.92); backdrop-filter: blur(8px); border-color: var(--hl-border-light);">
            <button class="flex items-center justify-center w-8 h-8 rounded-lg" style="background: var(--hl-surface);" data-dom-id="back-generate" aria-label="返回">
                <i data-lucide="chevron-left" class="w-5 h-5" style="color: var(--hl-text);"></i>
            </button>
            <h1 class="flex-1 text-center text-base font-semibold truncate" style="color: var(--hl-text); font-family: var(--hl-font-body); letter-spacing: -0.01em;">选择手账风格</h1>
            <div class="w-8"></div>
        </header>

        <!-- Content Area -->
        <div class="px-4 pt-5 pb-28">

            <!-- AI Status Indicator -->
            <div class="flex items-center gap-2 mb-5">
                <span class="relative flex h-5 w-5">
                    <span class="absolute inset-0 rounded-full opacity-60" style="background: var(--hl-primary-light); animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite;"></span>
                    <i data-lucide="sparkles" class="relative w-4 h-4 m-auto block" style="color: var(--hl-primary-dark);"></i>
                </span>
                <span class="text-sm" style="color: var(--hl-primary-dark); font-family: var(--hl-font-body);">AI 正在为您排版...</span>
            </div>

            <!-- Horizontal Scrollable Template Cards -->
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2 -mx-4 px-4 snap-x snap-mandatory">

                <!-- Template 1: 温馨日常 (Selected/Active) -->
                <div class="shrink-0 w-[140px] snap-start relative">
                    <div class="rounded-lg overflow-hidden cursor-pointer" style="border: 2px solid var(--hl-primary); background: var(--hl-surface);">
                        <!-- Mini journal preview -->
                        <div class="p-3">
                            <!-- Date header -->
                            <div class="text-xs mb-2" style="color: var(--hl-primary-dark); font-family: var(--hl-font-hand); font-size: 0.8rem;">2026.06.26</div>
                            <!-- Photo placeholder -->
                            <div class="w-full h-14 rounded" style="background: linear-gradient(135deg, var(--hl-primary-lighter) 0%, var(--hl-accent-rose-light) 100%);"></div>
                            <!-- Text line placeholders -->
                            <div class="mt-2 space-y-1.5">
                                <div class="h-1.5 w-full rounded-full" style="background: var(--hl-border-light);"></div>
                                <div class="h-1.5 w-4/5 rounded-full" style="background: var(--hl-border-light);"></div>
                            </div>
                            <!-- Washi tape decoration -->
                            <div class="absolute -top-1 -right-1 w-8 h-3 rounded-sm" style="background: var(--hl-accent-rose); opacity: 0.5; transform: rotate(12deg);"></div>
                        </div>
                        <!-- Checkmark badge -->
                        <div class="absolute top-2 right-2 flex items-center justify-center w-5 h-5 rounded-full" style="background: var(--hl-primary);">
                            <i data-lucide="check" class="w-3 h-3" style="color: var(--hl-text-inverse);"></i>
                        </div>
                    </div>
                    <p class="text-center text-xs font-medium mt-2 truncate" style="color: var(--hl-text);">温馨日常</p>
                </div>

                <!-- Template 2: 清新文艺 -->
                <div class="shrink-0 w-[140px] snap-start">
                    <div class="rounded-lg overflow-hidden cursor-pointer" style="border: 1px solid var(--hl-border-light); background: var(--hl-surface);">
                        <!-- Mini journal preview -->
                        <div class="p-3">
                            <div class="text-xs mb-2" style="color: var(--hl-text-tertiary); font-family: var(--hl-font-hand); font-size: 0.8rem;">2026.06.26</div>
                            <!-- Minimal layout -->
                            <div class="flex gap-1.5">
                                <div class="w-1/2 h-16 rounded" style="background: var(--hl-accent-green-light);"></div>
                                <div class="w-1/2 space-y-1.5">
                                    <div class="h-1.5 w-full rounded-full" style="background: var(--hl-border-light);"></div>
                                    <div class="h-1.5 w-full rounded-full" style="background: var(--hl-border-light);"></div>
                                    <div class="h-1.5 w-3/4 rounded-full" style="background: var(--hl-border-light);"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="text-center text-xs font-medium mt-2 truncate" style="color: var(--hl-text-secondary);">清新文艺</p>
                </div>

                <!-- Template 3: 活力彩色 -->
                <div class="shrink-0 w-[140px] snap-start">
                    <div class="rounded-lg overflow-hidden cursor-pointer" style="border: 1px solid var(--hl-border-light); background: var(--hl-surface);">
                        <!-- Mini journal preview -->
                        <div class="p-3">
                            <div class="text-xs mb-2" style="color: var(--hl-text-tertiary); font-family: var(--hl-font-hand); font-size: 0.8rem;">2026.06.26</div>
                            <!-- Colorful grid layout -->
                            <div class="grid grid-cols-2 gap-1.5">
                                <div class="h-9 rounded" style="background: var(--hl-primary-lightest);"></div>
                                <div class="h-9 rounded" style="background: var(--hl-accent-sky-light);"></div>
                                <div class="h-9 rounded" style="background: var(--hl-accent-green-light);"></div>
                                <div class="h-9 rounded" style="background: var(--hl-accent-rose-light);"></div>
                            </div>
                            <div class="mt-2 h-1.5 w-full rounded-full" style="background: var(--hl-border-light);"></div>
                        </div>
                    </div>
                    <p class="text-center text-xs font-medium mt-2 truncate" style="color: var(--hl-text-secondary);">活力彩色</p>
                </div>

            </div>

            <!-- Selected Template Expanded Preview -->
            <div class="mt-5 rounded-lg overflow-hidden" style="background: var(--hl-surface); border: 1px solid var(--hl-border-light);">

                <!-- Template label -->
                <div class="flex items-center justify-between px-4 pt-4 pb-2">
                    <div>
                        <h2 class="text-sm font-semibold" style="color: var(--hl-text);">温馨日常</h2>
                        <p class="text-xs mt-0.5" style="color: var(--hl-text-tertiary);">适合日常记录、家庭时光</p>
                    </div>
                    <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs whitespace-nowrap" style="background: var(--hl-primary-lightest); color: var(--hl-primary-dark);">已选择</span>
                </div>

                <!-- Journal layout preview card -->
                <div class="mx-4 mb-4 rounded-md overflow-hidden relative" style="background: var(--hl-surface-alt); border: 1px solid var(--hl-border-light);">

                    <!-- Date header -->
                    <div class="px-3 pt-3 pb-2">
                        <span class="text-sm" style="color: var(--hl-primary-dark); font-family: var(--hl-font-hand); font-size: 1rem;">2026 年 6 月 26 日 · 周五</span>
                    </div>

                    <!-- Photo row -->
                    <div class="px-3 pb-2">
                        <div class="flex gap-2">
                            <div class="flex-1 h-20 rounded" style="background: linear-gradient(135deg, var(--hl-primary-lighter) 0%, var(--hl-accent-rose-light) 100%);"></div>
                            <div class="w-[60px] h-20 rounded" style="background: linear-gradient(135deg, var(--hl-accent-sky-light) 0%, var(--hl-accent-green-light) 100%);"></div>
                        </div>
                    </div>

                    <!-- Washi tape decoration strip 1 -->
                    <div class="absolute top-8 -left-0.5 w-6 h-2.5 rounded-sm" style="background: var(--hl-accent-rose); opacity: 0.35; transform: rotate(-3deg);"></div>

                    <!-- Text line placeholders -->
                    <div class="px-3 pb-3 space-y-2">
                        <div class="h-1.5 w-full rounded-full" style="background: var(--hl-border-light);"></div>
                        <div class="h-1.5 w-full rounded-full" style="background: var(--hl-border-light);"></div>
                        <div class="h-1.5 w-3/4 rounded-full" style="background: var(--hl-border-light);"></div>
                    </div>

                    <!-- Washi tape decoration strip 2 -->
                    <div class="absolute bottom-6 -right-0.5 w-8 h-2.5 rounded-sm" style="background: var(--hl-accent-green); opacity: 0.3; transform: rotate(5deg);"></div>

                    <!-- Another photo placeholder -->
                    <div class="px-3 pb-3">
                        <div class="w-2/3 h-14 rounded" style="background: linear-gradient(135deg, var(--hl-primary-lightest) 0%, var(--hl-accent-green-light) 100%);"></div>
                    </div>

                    <!-- More text lines -->
                    <div class="px-3 pb-3 space-y-2">
                        <div class="h-1.5 w-full rounded-full" style="background: var(--hl-border-light);"></div>
                        <div class="h-1.5 w-5/6 rounded-full" style="background: var(--hl-border-light);"></div>
                    </div>

                </div>
            </div>

        </div>

        <!-- Bottom Fixed Bar -->
        <div class="fixed bottom-0 inset-x-0 z-30 border-t px-4 pb-4 pt-3" style="background: rgba(255,250,245,0.95); backdrop-filter: blur(8px); border-color: var(--hl-border-light);">
            <div class="flex gap-3">
                <button class="flex-1 inline-flex items-center justify-center h-11 rounded-lg text-sm font-medium whitespace-nowrap transition-colors" style="background: transparent; border: 1px solid var(--hl-border); color: var(--hl-text-secondary);">
                    重新选择
                </button>
                <button class="flex-1 inline-flex items-center justify-center h-11 rounded-lg text-sm font-medium whitespace-nowrap transition-colors" style="background: var(--hl-primary); border: none; color: var(--hl-text-inverse);" data-dom-id="btn-preview">
                    预览手账
                </button>
            </div>
        </div>

        <!-- Custom styles for decorations and animations -->
        <style>
            @keyframes pulse {
                0%, 100% { opacity: 0.6; transform: scale(1); }
                50% { opacity: 0.3; transform: scale(0.92); }
            }
        </style>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
