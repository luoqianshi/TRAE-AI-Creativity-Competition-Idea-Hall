<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* Happy Life - Warm Handcrafted Journal Style */
/* Brand CSS Variables */

:root {
  /* Brand Prefix: hl */
  --hl-primary: #E8985E;
  --hl-primary-light: #F2B88A;
  --hl-primary-lighter: #FAE5D0;
  --hl-primary-lightest: #FFF6EE;
  --hl-primary-dark: #C47A45;

  /* Warm Neutrals */
  --hl-bg: #FFFAF5;
  --hl-bg-alt: #FFF3EA;
  --hl-surface: #FFFFFF;
  --hl-surface-alt: #FFF8F2;
  --hl-surface-hover: #FFF0E6;

  --hl-text: #4A3728;
  --hl-text-secondary: #7A6558;
  --hl-text-tertiary: #A89385;
  --hl-text-inverse: #FFFFFF;

  --hl-border: #E8D5C4;
  --hl-border-light: #F0E4D8;

  /* Accent */
  --hl-accent-green: #7EB09B;
  --hl-accent-green-light: #D4EDE0;
  --hl-accent-rose: #D4838F;
  --hl-accent-rose-light: #F2DDE1;
  --hl-accent-sky: #7BA3B5;
  --hl-accent-sky-light: #D6E8F0;

  /* State Colors */
  --hl-state-success: #6B9F78;
  --hl-state-warning: #D4A037;
  --hl-state-error: #C46060;
  --hl-state-info: #6B8FB5;

  /* Typography */
  --hl-font-display: 'Noto Serif SC', 'Georgia', serif;
  --hl-font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --hl-font-hand: 'Caveat', 'Ma Shan Zheng', cursive;

  --hl-text-xs: 0.75rem;
  --hl-text-sm: 0.875rem;
  --hl-text-base: 1rem;
  --hl-text-lg: 1.125rem;
  --hl-text-xl: 1.25rem;
  --hl-text-2xl: 1.5rem;
  --hl-text-3xl: 2rem;

  --hl-leading-tight: 1.25;
  --hl-leading-normal: 1.6;
  --hl-leading-relaxed: 1.8;

  /* Spacing */
  --hl-space-xs: 4px;
  --hl-space-sm: 8px;
  --hl-space-md: 12px;
  --hl-space-base: 16px;
  --hl-space-lg: 24px;
  --hl-space-xl: 32px;
  --hl-space-2xl: 48px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Shadow - static surfaces use border-first */
  --hl-shadow-sm: 0 1px 2px rgba(74, 55, 40, 0.04);
  --hl-shadow-md: 0 2px 8px rgba(74, 55, 40, 0.05);
  --hl-shadow-float: 0 8px 24px rgba(74, 55, 40, 0.08);

  /* Depth */
  --hl-depth-border: 1px solid var(--hl-border);
  --hl-depth-border-light: 1px solid var(--hl-border-light);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--hl-primary);
    --color-border: var(--hl-border);
  }
  @layer base {
    body { background: var(--hl-surface); color: var(--hl-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen pb-24" style="background: var(--hl-bg);">

        <!-- Top Header -->
        <header class="sticky top-0 z-20 px-5 pt-3 pb-3" style="background: var(--hl-bg);">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm" style="color: var(--hl-text-secondary);">2026年6月26日 星期五</p>
                    <h1 class="text-lg font-semibold mt-0.5" style="color: var(--hl-text); font-family: var(--hl-font-display);">下午好，小明</h1>
                </div>
                <button class="flex items-center justify-center w-9 h-9" style="color: var(--hl-text-secondary);" aria-label="通知">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Action Button -->
            <button
                data-dom-id="nav-organize"
                class="mt-3 flex items-center justify-center px-5 py-2 text-sm font-medium whitespace-nowrap"
                style="background: var(--hl-primary); color: var(--hl-text-inverse); border-radius: var(--radius-full);"
            >
                <i data-lucide="sparkles" class="w-4 h-4 mr-1.5"></i>
                智能整理
            </button>
        </header>

        <!-- Month Section Header -->
        <section class="px-5 pt-6 pb-4">
            <div class="flex items-center gap-3">
                <h2 class="text-xl font-semibold" style="color: var(--hl-text); font-family: var(--hl-font-display);">六月</h2>
                <div class="flex-1 h-px" style="background: var(--hl-primary-lighter);"></div>
            </div>
        </section>

        <!-- Timeline -->
        <section class="px-5">

            <!-- Entry 1 -->
            <div class="flex gap-3">
                <!-- Date Marker -->
                <div class="flex flex-col items-center pt-1 shrink-0 w-12">
                    <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: var(--hl-primary);"></div>
                    <div class="flex-1 w-px mt-1" style="background: var(--hl-border);"></div>
                    <span class="mt-1 text-xs whitespace-nowrap" style="color: var(--hl-text-tertiary); font-family: var(--hl-font-hand);">6月22日</span>
                </div>

                <!-- Card -->
                <a
                    href="#"
                    data-dom-id="home-entry-card"
                    class="flex-1 rounded-lg p-3 mb-4 block"
                    style="background: var(--hl-surface); border: 1px solid var(--hl-border-light); border-radius: var(--radius-lg); transition: transform 240ms cubic-bezier(.2,.8,.2,1);"
                    onmouseover="this.style.transform='translateY(-1px)'"
                    onmouseout="this.style.transform='translateY(0)'"
                >
                    <!-- Thumbnail placeholder -->
                    <div
                        class="w-full h-32 mb-3 rounded-md overflow-hidden"
                        style="background: linear-gradient(135deg, var(--hl-primary-lighter) 0%, var(--hl-surface-alt) 60%, var(--hl-bg-alt) 100%);"
                    >
                        <div class="flex items-center justify-center h-full" style="color: var(--hl-primary-light);">
                            <i data-lucide="coffee" class="w-8 h-8 opacity-40"></i>
                        </div>
                    </div>
                    <h3 class="text-sm font-semibold truncate" style="color: var(--hl-text);">周末的咖啡时光</h3>
                    <p class="text-xs mt-1 line-clamp-2" style="color: var(--hl-text-secondary); line-height: 1.6;">在街角的咖啡馆遇见了老朋友，点了一杯拿铁，聊了整整一个下午</p>
                    <div class="flex gap-1.5 mt-2.5 flex-wrap">
                        <span class="inline-flex items-center px-2 py-0.5 text-xs whitespace-nowrap" style="background: var(--hl-primary-lightest); color: var(--hl-primary-dark); border-radius: var(--radius-sm);">生活记录</span>
                        <span class="inline-flex items-center px-2 py-0.5 text-xs whitespace-nowrap" style="background: var(--hl-accent-green-light); color: var(--hl-accent-green); border-radius: var(--radius-sm);">好心情</span>
                    </div>
                </a>
            </div>

            <!-- Entry 2 -->
            <div class="flex gap-3">
                <div class="flex flex-col items-center pt-1 shrink-0 w-12">
                    <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: var(--hl-accent-rose);"></div>
                    <div class="flex-1 w-px mt-1" style="background: var(--hl-border);"></div>
                    <span class="mt-1 text-xs whitespace-nowrap" style="color: var(--hl-text-tertiary); font-family: var(--hl-font-hand);">6月19日</span>
                </div>

                <div class="flex-1 rounded-lg p-3 mb-4" style="background: var(--hl-surface); border: 1px solid var(--hl-border-light); border-radius: var(--radius-lg);">
                    <div
                        class="w-full h-32 mb-3 rounded-md overflow-hidden"
                        style="background: linear-gradient(135deg, var(--hl-accent-rose-light) 0%, var(--hl-surface-alt) 60%, var(--hl-bg) 100%);"
                    >
                        <div class="flex items-center justify-center h-full" style="color: var(--hl-accent-rose); opacity: 0.4;">
                            <i data-lucide="book-open" class="w-8 h-8"></i>
                        </div>
                    </div>
                    <h3 class="text-sm font-semibold truncate" style="color: var(--hl-text);">读完了一本好书</h3>
                    <p class="text-xs mt-1 line-clamp-2" style="color: var(--hl-text-secondary); line-height: 1.6;">终于把《百年孤独》读完了，马尔克斯的文字让人沉醉</p>
                    <div class="flex gap-1.5 mt-2.5 flex-wrap">
                        <span class="inline-flex items-center px-2 py-0.5 text-xs whitespace-nowrap" style="background: var(--hl-accent-rose-light); color: var(--hl-accent-rose); border-radius: var(--radius-sm);">阅读</span>
                        <span class="inline-flex items-center px-2 py-0.5 text-xs whitespace-nowrap" style="background: var(--hl-accent-sky-light); color: var(--hl-accent-sky); border-radius: var(--radius-sm);">感悟</span>
                    </div>
                </div>
            </div>

            <!-- Entry 3 -->
            <div class="flex gap-3">
                <div class="flex flex-col items-center pt-1 shrink-0 w-12">
                    <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: var(--hl-accent-green);"></div>
                    <div class="flex-1 w-px mt-1" style="background: var(--hl-border);"></div>
                    <span class="mt-1 text-xs whitespace-nowrap" style="color: var(--hl-text-tertiary); font-family: var(--hl-font-hand);">6月15日</span>
                </div>

                <div class="flex-1 rounded-lg p-3 mb-4" style="background: var(--hl-surface); border: 1px solid var(--hl-border-light); border-radius: var(--radius-lg);">
                    <div
                        class="w-full h-32 mb-3 rounded-md overflow-hidden"
                        style="background: linear-gradient(135deg, var(--hl-accent-green-light) 0%, var(--hl-surface-alt) 60%, var(--hl-bg) 100%);"
                    >
                        <div class="flex items-center justify-center h-full" style="color: var(--hl-accent-green); opacity: 0.4;">
                            <i data-lucide="trees" class="w-8 h-8"></i>
                        </div>
                    </div>
                    <h3 class="text-sm font-semibold truncate" style="color: var(--hl-text);">公园里的晨跑</h3>
                    <p class="text-xs mt-1 line-clamp-2" style="color: var(--hl-text-secondary); line-height: 1.6;">清晨六点起床去了公园，空气清新，跑了五公里感觉很棒</p>
                    <div class="flex gap-1.5 mt-2.5 flex-wrap">
                        <span class="inline-flex items-center px-2 py-0.5 text-xs whitespace-nowrap" style="background: var(--hl-accent-green-light); color: var(--hl-accent-green); border-radius: var(--radius-sm);">运动</span>
                        <span class="inline-flex items-center px-2 py-0.5 text-xs whitespace-nowrap" style="background: var(--hl-primary-lightest); color: var(--hl-primary-dark); border-radius: var(--radius-sm);">健康生活</span>
                    </div>
                </div>
            </div>

            <!-- Entry 4 (last, no line below) -->
            <div class="flex gap-3">
                <div class="flex flex-col items-center pt-1 shrink-0 w-12">
                    <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background: var(--hl-accent-sky);"></div>
                    <div class="flex-1 w-px mt-1" style="background: var(--hl-border);"></div>
                    <span class="mt-1 text-xs whitespace-nowrap" style="color: var(--hl-text-tertiary); font-family: var(--hl-font-hand);">6月10日</span>
                </div>

                <div class="flex-1 rounded-lg p-3 mb-2" style="background: var(--hl-surface); border: 1px solid var(--hl-border-light); border-radius: var(--radius-lg);">
                    <div
                        class="w-full h-32 mb-3 rounded-md overflow-hidden"
                        style="background: linear-gradient(135deg, var(--hl-accent-sky-light) 0%, var(--hl-surface-alt) 60%, var(--hl-bg) 100%);"
                    >
                        <div class="flex items-center justify-center h-full" style="color: var(--hl-accent-sky); opacity: 0.4;">
                            <i data-lucide="palette" class="w-8 h-8"></i>
                        </div>
                    </div>
                    <h3 class="text-sm font-semibold truncate" style="color: var(--hl-text);">水彩画练习</h3>
                    <p class="text-xs mt-1 line-clamp-2" style="color: var(--hl-text-secondary); line-height: 1.6;">尝试用水彩画了一幅春天的风景，色彩还不太熟练</p>
                    <div class="flex gap-1.5 mt-2.5 flex-wrap">
                        <span class="inline-flex items-center px-2 py-0.5 text-xs whitespace-nowrap" style="background: var(--hl-accent-sky-light); color: var(--hl-accent-sky); border-radius: var(--radius-sm);">手绘</span>
                        <span class="inline-flex items-center px-2 py-0.5 text-xs whitespace-nowrap" style="background: var(--hl-accent-rose-light); color: var(--hl-accent-rose); border-radius: var(--radius-sm);">创作</span>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 border-t flex items-center justify-around" style="background: var(--hl-surface); border-color: var(--hl-border-light); padding-bottom: env(safe-area-inset-bottom, 8px);">
        <button class="flex flex-col items-center justify-center py-2 px-3 min-w-0" style="color: var(--hl-primary);">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-xs mt-0.5 whitespace-nowrap">首页</span>
        </button>
        <button class="flex flex-col items-center justify-center py-2 px-3 min-w-0" style="color: var(--hl-text-tertiary);">
            <i data-lucide="folder-heart" class="w-5 h-5"></i>
            <span class="text-xs mt-0.5 whitespace-nowrap">整理</span>
        </button>
        <button class="flex flex-col items-center justify-center py-2 px-3 min-w-0" data-dom-id="tab-library" style="color: var(--hl-text-tertiary);">
            <i data-lucide="image" class="w-5 h-5"></i>
            <span class="text-xs mt-0.5 whitespace-nowrap">素材库</span>
        </button>
        <button class="flex flex-col items-center justify-center py-2 px-3 min-w-0" data-dom-id="tab-profile" style="color: var(--hl-text-tertiary);">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-xs mt-0.5 whitespace-nowrap">我的</span>
        </button>
    </nav>

    <script>lucide.createIcons();</script>
</body>
</html>
