<!DOCTYPE html>
<html lang="en" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <style id="theme-vars">
/* Happy Life - Warm Handcrafted Journal Style */
/* Brand CSS Variables */

:root {
  /* Brand Prefix: hl */
  --hl-primary: #E8985E;
  --hl-primary-light: #F2B88A;
  --hl-primary-lighter: #FAE5D0;
  --hl-primary-lightest: #FFF6EE;
  --hl-primary-dark: #C47A45;

  /* Warm Neutrals */
  --hl-bg: #FFFAF5;
  --hl-bg-alt: #FFF3EA;
  --hl-surface: #FFFFFF;
  --hl-surface-alt: #FFF8F2;
  --hl-surface-hover: #FFF0E6;

  --hl-text: #4A3728;
  --hl-text-secondary: #7A6558;
  --hl-text-tertiary: #A89385;
  --hl-text-inverse: #FFFFFF;

  --hl-border: #E8D5C4;
  --hl-border-light: #F0E4D8;

  /* Accent */
  --hl-accent-green: #7EB09B;
  --hl-accent-green-light: #D4EDE0;
  --hl-accent-rose: #D4838F;
  --hl-accent-rose-light: #F2DDE1;
  --hl-accent-sky: #7BA3B5;
  --hl-accent-sky-light: #D6E8F0;

  /* State Colors */
  --hl-state-success: #6B9F78;
  --hl-state-warning: #D4A037;
  --hl-state-error: #C46060;
  --hl-state-info: #6B8FB5;

  /* Typography */
  --hl-font-display: 'Noto Serif SC', 'Georgia', serif;
  --hl-font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --hl-font-hand: 'Caveat', 'Ma Shan Zheng', cursive;

  --hl-text-xs: 0.75rem;
  --hl-text-sm: 0.875rem;
  --hl-text-base: 1rem;
  --hl-text-lg: 1.125rem;
  --hl-text-xl: 1.25rem;
  --hl-text-2xl: 1.5rem;
  --hl-text-3xl: 2rem;

  --hl-leading-tight: 1.25;
  --hl-leading-normal: 1.6;
  --hl-leading-relaxed: 1.8;

  /* Spacing */
  --hl-space-xs: 4px;
  --hl-space-sm: 8px;
  --hl-space-md: 12px;
  --hl-space-base: 16px;
  --hl-space-lg: 24px;
  --hl-space-xl: 32px;
  --hl-space-2xl: 48px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Shadow - static surfaces use border-first */
  --hl-shadow-sm: 0 1px 2px rgba(74, 55, 40, 0.04);
  --hl-shadow-md: 0 2px 8px rgba(74, 55, 40, 0.05);
  --hl-shadow-float: 0 8px 24px rgba(74, 55, 40, 0.08);

  /* Depth */
  --hl-depth-border: 1px solid var(--hl-border);
  --hl-depth-border-light: 1px solid var(--hl-border-light);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--hl-primary);
    --color-border: var(--hl-border);
  }
  @layer base {
    body { background: var(--hl-bg); color: var(--hl-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pb-20">
      <!-- User Profile Header -->
      <section class="px-4 pt-6 pb-2">
        <div class="flex flex-col items-center gap-3">
          <div class="w-16 h-16 rounded-full flex items-center justify-center text-xl font-semibold" style="background-color: var(--hl-primary); color: var(--hl-text-inverse); font-family: var(--hl-font-display);">明</div>
          <div class="text-center">
            <h1 class="text-lg font-semibold truncate" style="color: var(--hl-text); font-family: var(--hl-font-display);">小明</h1>
            <p class="text-xs mt-0.5" style="color: var(--hl-text-tertiary);">加入 Happy Life 186 天</p>
          </div>
        </div>
      </section>

      <!-- Stats Cards (Journal Sticker Style) -->
      <section class="px-4 py-4">
        <div class="grid grid-cols-3 gap-3">
          <!-- 手账数 -->
          <div class="relative flex flex-col items-center py-4 px-2 rounded-lg" style="background-color: var(--hl-primary-lightest); border: 1.5px dashed var(--hl-primary-light);">
            <div class="absolute top-1.5 left-1.5 w-1.5 h-1.5 rounded-full" style="background-color: var(--hl-primary-light);"></div>
            <div class="absolute top-1.5 right-1.5 w-1 h-1 rounded-full" style="background-color: var(--hl-primary-light);"></div>
            <div class="absolute bottom-1.5 left-3 w-1 h-1 rounded-full" style="background-color: var(--hl-primary-light);"></div>
            <span class="text-2xl font-bold font-variant-numeric tabular-nums whitespace-nowrap" style="color: var(--hl-primary); font-family: var(--hl-font-hand); font-size: 1.75rem;">32</span>
            <span class="text-xs mt-1 whitespace-nowrap" style="color: var(--hl-text-tertiary);">手账数</span>
          </div>
          <!-- 素材数 -->
          <div class="relative flex flex-col items-center py-4 px-2 rounded-lg" style="background-color: var(--hl-accent-green-light); border: 1.5px dashed var(--hl-accent-green);">
            <div class="absolute top-1.5 left-1.5 w-1.5 h-1.5 rounded-full" style="background-color: var(--hl-accent-green);"></div>
            <div class="absolute top-1.5 right-1.5 w-1 h-1 rounded-full" style="background-color: var(--hl-accent-green);"></div>
            <div class="absolute bottom-1.5 left-3 w-1 h-1 rounded-full" style="background-color: var(--hl-accent-green);"></div>
            <span class="text-2xl font-bold font-variant-numeric tabular-nums whitespace-nowrap" style="color: var(--hl-accent-green); font-family: var(--hl-font-hand); font-size: 1.75rem;">128</span>
            <span class="text-xs mt-1 whitespace-nowrap" style="color: var(--hl-text-tertiary);">素材数</span>
          </div>
          <!-- 收藏 -->
          <div class="relative flex flex-col items-center py-4 px-2 rounded-lg" style="background-color: var(--hl-accent-rose-light); border: 1.5px dashed var(--hl-accent-rose);">
            <div class="absolute top-1.5 left-1.5 w-1.5 h-1.5 rounded-full" style="background-color: var(--hl-accent-rose);"></div>
            <div class="absolute top-1.5 right-1.5 w-1 h-1 rounded-full" style="background-color: var(--hl-accent-rose);"></div>
            <div class="absolute bottom-1.5 left-3 w-1 h-1 rounded-full" style="background-color: var(--hl-accent-rose);"></div>
            <span class="text-2xl font-bold font-variant-numeric tabular-nums whitespace-nowrap" style="color: var(--hl-accent-rose); font-family: var(--hl-font-hand); font-size: 1.75rem;">15</span>
            <span class="text-xs mt-1 whitespace-nowrap" style="color: var(--hl-text-tertiary);">收藏</span>
          </div>
        </div>
      </section>

      <!-- Menu List -->
      <section class="px-4 pb-4">
        <div class="rounded-lg overflow-hidden" style="background-color: var(--hl-surface); border: 1px solid var(--hl-border-light);">
          <!-- 我的手账 -->
          <a class="flex items-center justify-between px-4 py-3.5 transition-colors duration-150" style="border-bottom: 1px solid var(--hl-border-light);" href="#">
            <div class="flex items-center gap-3 min-w-0">
              <i data-lucide="book-open" class="w-5 h-5 shrink-0" style="color: var(--hl-primary);"></i>
              <span class="text-sm truncate" style="color: var(--hl-text);">我的手账</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--hl-text-tertiary);"></i>
          </a>
          <!-- 收藏夹 -->
          <a class="flex items-center justify-between px-4 py-3.5 transition-colors duration-150" style="border-bottom: 1px solid var(--hl-border-light);" href="#">
            <div class="flex items-center gap-3 min-w-0">
              <i data-lucide="heart" class="w-5 h-5 shrink-0" style="color: var(--hl-accent-rose);"></i>
              <span class="text-sm truncate" style="color: var(--hl-text);">收藏夹</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--hl-text-tertiary);"></i>
          </a>
          <!-- 存储空间 -->
          <div class="flex items-center justify-between px-4 py-3.5" style="border-bottom: 1px solid var(--hl-border-light);">
            <div class="flex items-center gap-3 min-w-0">
              <i data-lucide="hard-drive" class="w-5 h-5 shrink-0" style="color: var(--hl-accent-sky);"></i>
              <span class="text-sm truncate" style="color: var(--hl-text);">存储空间</span>
            </div>
          </div>
          <!-- Storage Progress Bar -->
          <div class="px-4 pb-3.5">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs" style="color: var(--hl-text-tertiary);">1.2GB / 5GB</span>
              <span class="text-xs" style="color: var(--hl-text-tertiary);">24%</span>
            </div>
            <div class="h-1.5 rounded-full overflow-hidden" style="background-color: var(--hl-bg-alt);">
              <div class="h-full rounded-full" style="width: 24%; background-color: var(--hl-primary);"></div>
            </div>
          </div>
          <!-- 提醒设置 -->
          <a class="flex items-center justify-between px-4 py-3.5 transition-colors duration-150" style="border-bottom: 1px solid var(--hl-border-light);" href="#">
            <div class="flex items-center gap-3 min-w-0">
              <i data-lucide="bell" class="w-5 h-5 shrink-0" style="color: var(--hl-accent-green);"></i>
              <span class="text-sm truncate" style="color: var(--hl-text);">提醒设置</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--hl-text-tertiary);"></i>
          </a>
          <!-- 主题风格 -->
          <a class="flex items-center justify-between px-4 py-3.5 transition-colors duration-150" style="border-bottom: 1px solid var(--hl-border-light);" href="#">
            <div class="flex items-center gap-3 min-w-0">
              <i data-lucide="palette" class="w-5 h-5 shrink-0" style="color: var(--hl-primary);"></i>
              <span class="text-sm truncate" style="color: var(--hl-text);">主题风格</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--hl-text-tertiary);"></i>
          </a>
          <!-- 分享给朋友 -->
          <a class="flex items-center justify-between px-4 py-3.5 transition-colors duration-150" href="#">
            <div class="flex items-center gap-3 min-w-0">
              <i data-lucide="share-2" class="w-5 h-5 shrink-0" style="color: var(--hl-primary-light);"></i>
              <span class="text-sm truncate" style="color: var(--hl-text);">分享给朋友</span>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 shrink-0" style="color: var(--hl-text-tertiary);"></i>
          </a>
        </div>
      </section>

      <!-- Bottom Links -->
      <section class="px-4 py-6 flex flex-col items-center gap-3">
        <a href="#" class="text-xs transition-colors duration-150" style="color: var(--hl-text-tertiary);">关于 Happy Life</a>
        <a href="#" class="text-xs transition-colors duration-150" style="color: var(--hl-text-tertiary);">退出登录</a>
      </section>

      <!-- Bottom Tab Bar -->
      <nav class="fixed bottom-0 left-0 right-0 z-30" style="background-color: var(--hl-surface); border-top: 1px solid var(--hl-border-light);">
        <div class="flex items-center justify-around h-14">
          <a href="#" data-dom-id="tab-home-profile" class="flex flex-col items-center gap-0.5 min-w-0 px-3">
            <i data-lucide="home" class="w-5 h-5" style="color: var(--hl-text-tertiary);"></i>
            <span class="text-xs whitespace-nowrap" style="color: var(--hl-text-tertiary);">首页</span>
          </a>
          <a href="#" data-dom-id="tab-organize-profile" class="flex flex-col items-center gap-0.5 min-w-0 px-3" style="display: none;">
            <i data-lucide="folder-open" class="w-5 h-5" style="color: var(--hl-text-tertiary);"></i>
            <span class="text-xs whitespace-nowrap" style="color: var(--hl-text-tertiary);">整理</span>
          </a>
          <div class="flex flex-col items-center gap-0.5 min-w-0 px-3">
            <i data-lucide="user" class="w-5 h-5" style="color: var(--hl-primary);"></i>
            <span class="text-xs font-semibold whitespace-nowrap" style="color: var(--hl-primary);">我的</span>
          </div>
          <a href="#" class="flex flex-col items-center gap-0.5 min-w-0 px-3">
            <i data-lucide="image" class="w-5 h-5" style="color: var(--hl-text-tertiary);"></i>
            <span class="text-xs whitespace-nowrap" style="color: var(--hl-text-tertiary);">素材库</span>
          </a>
        </div>
      </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
