<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>启动页</title>
    <style id="theme-vars">
/* Happy Life - Warm Handcrafted Journal Style */
/* Brand CSS Variables */

:root {
  /* Brand Prefix: hl */
  --hl-primary: #E8985E;
  --hl-primary-light: #F2B88A;
  --hl-primary-lighter: #FAE5D0;
  --hl-primary-lightest: #FFF6EE;
  --hl-primary-dark: #C47A45;

  /* Warm Neutrals */
  --hl-bg: #FFFAF5;
  --hl-bg-alt: #FFF3EA;
  --hl-surface: #FFFFFF;
  --hl-surface-alt: #FFF8F2;
  --hl-surface-hover: #FFF0E6;

  --hl-text: #4A3728;
  --hl-text-secondary: #7A6558;
  --hl-text-tertiary: #A89385;
  --hl-text-inverse: #FFFFFF;

  --hl-border: #E8D5C4;
  --hl-border-light: #F0E4D8;

  /* Accent */
  --hl-accent-green: #7EB09B;
  --hl-accent-green-light: #D4EDE0;
  --hl-accent-rose: #D4838F;
  --hl-accent-rose-light: #F2DDE1;
  --hl-accent-sky: #7BA3B5;
  --hl-accent-sky-light: #D6E8F0;

  /* State Colors */
  --hl-state-success: #6B9F78;
  --hl-state-warning: #D4A037;
  --hl-state-error: #C46060;
  --hl-state-info: #6B8FB5;

  /* Typography */
  --hl-font-display: 'Noto Serif SC', 'Georgia', serif;
  --hl-font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --hl-font-hand: 'Caveat', 'Ma Shan Zheng', cursive;

  --hl-text-xs: 0.75rem;
  --hl-text-sm: 0.875rem;
  --hl-text-base: 1rem;
  --hl-text-lg: 1.125rem;
  --hl-text-xl: 1.25rem;
  --hl-text-2xl: 1.5rem;
  --hl-text-3xl: 2rem;

  --hl-leading-tight: 1.25;
  --hl-leading-normal: 1.6;
  --hl-leading-relaxed: 1.8;

  /* Spacing */
  --hl-space-xs: 4px;
  --hl-space-sm: 8px;
  --hl-space-md: 12px;
  --hl-space-base: 16px;
  --hl-space-lg: 24px;
  --hl-space-xl: 32px;
  --hl-space-2xl: 48px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Shadow - static surfaces use border-first */
  --hl-shadow-sm: 0 1px 2px rgba(74, 55, 40, 0.04);
  --hl-shadow-md: 0 2px 8px rgba(74, 55, 40, 0.05);
  --hl-shadow-float: 0 8px 24px rgba(74, 55, 40, 0.08);

  /* Depth */
  --hl-depth-border: 1px solid var(--hl-border);
  --hl-depth-border-light: 1px solid var(--hl-border-light);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--hl-primary);
    --color-border: var(--hl-border);
  }
  @layer base {
    body { background: var(--hl-surface); color: var(--hl-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
      <section class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden">
        <!-- Full-bleed background image with warm gradient overlay -->
        <div class="absolute inset-0 z-0">
          <img
            src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" data-b64-id="__b64_0"
            alt="温暖手账背景"
            class="w-full h-full object-cover"
          >
          <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(232,152,94,0.35) 0%, rgba(255,250,245,0.95) 70%, rgba(255,250,245,1) 100%);"></div>
        </div>

        <!-- Centered brand content -->
        <div class="relative z-10 flex flex-col items-center px-8 text-center">
          <!-- Decorative hand-drawn ring around logo area -->
          <div class="relative mb-6">
            <div class="w-24 h-24 rounded-full flex items-center justify-center" style="background: var(--hl-primary-lightest); border: 2px dashed var(--hl-primary-light);">
              <svg class="w-12 h-12" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M14 12 C14 8 20 6 24 6 C28 6 34 8 34 12 C34 22 30 28 24 36 C18 28 14 22 14 12Z" stroke="var(--hl-primary)" stroke-width="2" fill="var(--hl-primary-lighter)" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 14 L24 20 L28 14" stroke="var(--hl-primary-dark)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="20" cy="30" r="2" fill="var(--hl-accent-rose)"/>
                <circle cx="28" cy="32" r="1.5" fill="var(--hl-accent-green)"/>
                <circle cx="24" cy="26" r="1" fill="var(--hl-accent-sky)"/>
              </svg>
            </div>
            <!-- Small decorative dots -->
            <span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full" style="background: var(--hl-accent-rose);"></span>
            <span class="absolute -bottom-2 -left-2 w-2 h-2 rounded-full" style="background: var(--hl-accent-green);"></span>
          </div>

          <!-- App name in display serif -->
          <h1
            class="font-bold tracking-tight leading-tight"
            style="font-family: var(--hl-font-display); font-size: clamp(32px, 10vw, 48px); color: var(--hl-text); text-wrap: balance; word-break: keep-all;"
          >
            Happy Life
          </h1>

          <!-- Subtitle in hand-written style -->
          <p
            class="mt-3 tracking-wide"
            style="font-family: var(--hl-font-hand); font-size: var(--hl-text-xl); color: var(--hl-primary-dark);"
          >
            记录生活的每一刻
          </p>

          <!-- Decorative washi tape element -->
          <div class="mt-8 flex items-center gap-2 opacity-40">
            <span class="block w-8 h-0.5" style="background: var(--hl-primary-light);"></span>
            <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 8 L8 4 L13 8 L8 12 Z" fill="var(--hl-primary-light)" stroke="var(--hl-primary)" stroke-width="0.5"/>
            </svg>
            <span class="block w-8 h-0.5" style="background: var(--hl-primary-light);"></span>
          </div>
        </div>

        <!-- Bottom CTA area -->
        <div class="absolute bottom-12 z-10 flex flex-col items-center gap-4 w-full px-8">
          <!-- Small hand-drawn doodle decoration -->
          <div class="flex items-center gap-3 opacity-30">
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4 16 C4 10 6 6 10 4 C14 6 16 10 16 16" stroke="var(--hl-primary)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
              <path d="M7 16 C7 12 9 9 10 8 C11 9 13 12 13 16" stroke="var(--hl-accent-green)" stroke-width="1" fill="none" stroke-linecap="round"/>
            </svg>
            <span class="block w-12 h-px" style="background: var(--hl-border);"></span>
            <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <circle cx="8" cy="8" r="3" stroke="var(--hl-accent-rose)" stroke-width="1" fill="none"/>
              <circle cx="8" cy="8" r="1" fill="var(--hl-accent-rose)"/>
            </svg>
            <span class="block w-12 h-px" style="background: var(--hl-border);"></span>
            <svg class="w-5 h-5" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M6 14 C8 6 12 6 14 14" stroke="var(--hl-accent-sky)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
            </svg>
          </div>

          <!-- CTA Button -->
          <a
            data-dom-id="splash-start"
            href="#page-home"
            class="inline-flex items-center justify-center whitespace-nowrap rounded-full font-semibold tracking-wide transition-all duration-200 cursor-pointer"
            style="background: var(--hl-primary); color: var(--hl-text-inverse); font-family: var(--hl-font-body); font-size: var(--hl-text-lg); padding: 14px 40px; box-shadow: var(--hl-shadow-md);"
            onmouseover="this.style.background='var(--hl-primary-dark)'; this.style.transform='translateY(-1px)';"
            onmouseout="this.style.background='var(--hl-primary)'; this.style.transform='translateY(0)';"
            onmousedown="this.style.transform='translateY(0)';"
            onmouseup="this.style.transform='translateY(-1px)';"
          >
            开始记录
          </a>

          <p class="text-xs" style="color: var(--hl-text-tertiary); font-family: var(--hl-font-body);">
            用心感受，温暖记录
          </p>
        </div>
      </section>
    </main>
    <script>lucide.createIcons();</script>

<script>
(function(){

  function toBlob(uri){
    var m=uri.match(/^data:([^;]+);base64,(.+)$/);
    if(!m)return null;
    try{
      var b=atob(m[2]),a=new Uint8Array(b.length);
