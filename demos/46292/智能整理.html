<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能整理</title>
    <style id="theme-vars">
/* Happy Life - Warm Handcrafted Journal Style */
/* Brand CSS Variables */

:root {
  /* Brand Prefix: hl */
  --hl-primary: #E8985E;
  --hl-primary-light: #F2B88A;
  --hl-primary-lighter: #FAE5D0;
  --hl-primary-lightest: #FFF6EE;
  --hl-primary-dark: #C47A45;

  /* Warm Neutrals */
  --hl-bg: #FFFAF5;
  --hl-bg-alt: #FFF3EA;
  --hl-surface: #FFFFFF;
  --hl-surface-alt: #FFF8F2;
  --hl-surface-hover: #FFF0E6;

  --hl-text: #4A3728;
  --hl-text-secondary: #7A6558;
  --hl-text-tertiary: #A89385;
  --hl-text-inverse: #FFFFFF;

  --hl-border: #E8D5C4;
  --hl-border-light: #F0E4D8;

  /* Accent */
  --hl-accent-green: #7EB09B;
  --hl-accent-green-light: #D4EDE0;
  --hl-accent-rose: #D4838F;
  --hl-accent-rose-light: #F2DDE1;
  --hl-accent-sky: #7BA3B5;
  --hl-accent-sky-light: #D6E8F0;

  /* State Colors */
  --hl-state-success: #6B9F78;
  --hl-state-warning: #D4A037;
  --hl-state-error: #C46060;
  --hl-state-info: #6B8FB5;

  /* Typography */
  --hl-font-display: 'Noto Serif SC', 'Georgia', serif;
  --hl-font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --hl-font-hand: 'Caveat', 'Ma Shan Zheng', cursive;

  --hl-text-xs: 0.75rem;
  --hl-text-sm: 0.875rem;
  --hl-text-base: 1rem;
  --hl-text-lg: 1.125rem;
  --hl-text-xl: 1.25rem;
  --hl-text-2xl: 1.5rem;
  --hl-text-3xl: 2rem;

  --hl-leading-tight: 1.25;
  --hl-leading-normal: 1.6;
  --hl-leading-relaxed: 1.8;

  /* Spacing */
  --hl-space-xs: 4px;
  --hl-space-sm: 8px;
  --hl-space-md: 12px;
  --hl-space-base: 16px;
  --hl-space-lg: 24px;
  --hl-space-xl: 32px;
  --hl-space-2xl: 48px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Shadow - static surfaces use border-first */
  --hl-shadow-sm: 0 1px 2px rgba(74, 55, 40, 0.04);
  --hl-shadow-md: 0 2px 8px rgba(74, 55, 40, 0.05);
  --hl-shadow-float: 0 8px 24px rgba(74, 55, 40, 0.08);

  /* Depth */
  --hl-depth-border: 1px solid var(--hl-border);
  --hl-depth-border-light: 1px solid var(--hl-border-light);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--hl-primary);
    --color-border: var(--hl-border);
  }
  @layer base {
    body { background: var(--hl-bg); color: var(--hl-text); font-family: var(--hl-font-body); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="pb-24">
        <!-- Top Bar -->
        <header class="sticky top-0 z-30 flex h-14 items-center px-4 border-b" style="background: rgba(255,250,245,0.92); backdrop-filter: blur(8px); border-color: var(--hl-border-light);">
            <button data-dom-id="back-organize" class="inline-flex h-9 w-9 items-center justify-center rounded-lg" style="background: var(--hl-surface); border: 1px solid var(--hl-border-light);" aria-label="返回">
                <i data-lucide="arrow-left" class="h-5 w-5" style="color: var(--hl-text);"></i>
            </button>
            <h1 class="flex-1 text-center text-lg font-semibold truncate" style="color: var(--hl-text); font-family: var(--hl-font-body); letter-spacing: -0.01em;">智能整理</h1>
            <div class="w-9"></div>
        </header>

        <!-- Content Area -->
        <div class="px-4 pt-5 space-y-5">

            <!-- Upload Area -->
            <section class="rounded-xl overflow-hidden" style="background: var(--hl-surface); border: 1px solid var(--hl-border-light);">
                <button class="w-full flex flex-col items-center justify-center py-8 px-4 gap-3 cursor-pointer" aria-label="点击添加照片或视频" style="border: 2px dashed var(--hl-border); border-radius: 0;">
                    <div class="flex items-center justify-center w-12 h-12 rounded-xl" style="background: var(--hl-primary-lightest);">
                        <i data-lucide="camera" class="h-6 w-6" style="color: var(--hl-primary);"></i>
                    </div>
                    <span class="text-sm whitespace-nowrap" style="color: var(--hl-text-tertiary);">点击添加照片或视频</span>
                    <div class="flex items-center justify-center w-8 h-8 rounded-lg" style="background: var(--hl-primary-lighter);">
                        <i data-lucide="plus" class="h-4 w-4" style="color: var(--hl-primary);"></i>
                    </div>
                </button>
            </section>

            <!-- Photo Grid Preview -->
            <section>
                <div class="grid grid-cols-3 gap-2">
                    <div class="aspect-square rounded-lg" style="background: linear-gradient(135deg, var(--hl-primary-lighter) 0%, var(--hl-primary-light) 100%);"></div>
                    <div class="aspect-square rounded-lg" style="background: linear-gradient(135deg, var(--hl-accent-green-light) 0%, var(--hl-accent-green) 60%);"></div>
                    <div class="aspect-square rounded-lg" style="background: linear-gradient(135deg, var(--hl-accent-sky-light) 0%, var(--hl-accent-sky) 60%);"></div>
                    <div class="aspect-square rounded-lg" style="background: linear-gradient(135deg, var(--hl-accent-rose-light) 0%, var(--hl-accent-rose) 60%);"></div>
                    <div class="aspect-square rounded-lg" style="background: linear-gradient(135deg, var(--hl-surface-alt) 0%, var(--hl-primary-lighter) 80%);"></div>
                    <div class="aspect-square rounded-lg" style="background: linear-gradient(135deg, var(--hl-primary-lightest) 0%, var(--hl-bg-alt) 100%);"></div>
                </div>
            </section>

            <!-- Text Input Section -->
            <section class="rounded-xl p-3" style="background: var(--hl-surface); border: 1px solid var(--hl-border);">
                <textarea rows="4" placeholder="记录这一刻的心情..." class="w-full resize-none text-sm placeholder-opacity-60 outline-none" style="color: var(--hl-text); background: transparent; font-family: var(--hl-font-body); line-height: 1.6;"></textarea>
            </section>

            <!-- Category Tags -->
            <section>
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <span class="shrink-0 inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style="background: var(--hl-primary-lighter); color: var(--hl-primary-dark);">日常</span>
                    <span class="shrink-0 inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style="background: var(--hl-accent-rose-light); color: var(--hl-accent-rose);">美食</span>
                    <span class="shrink-0 inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style="background: var(--hl-accent-sky-light); color: var(--hl-accent-sky);">旅行</span>
                    <span class="shrink-0 inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style="background: var(--hl-accent-green-light); color: var(--hl-accent-green);">工作</span>
                    <span class="shrink-0 inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style="background: var(--hl-primary-lightest); color: var(--hl-text-secondary);">家庭</span>
                    <span class="shrink-0 inline-flex items-center px-3 py-1.5 rounded-lg text-sm font-medium whitespace-nowrap" style="background: var(--hl-accent-green-light); color: var(--hl-state-success);">运动</span>
                </div>
            </section>

            <!-- Date Picker Row -->
            <section class="flex items-center gap-3 rounded-xl px-4 py-3" style="background: var(--hl-surface); border: 1px solid var(--hl-border-light);">
                <i data-lucide="calendar" class="h-5 w-5 shrink-0" style="color: var(--hl-text-tertiary);"></i>
                <span class="text-sm truncate" style="color: var(--hl-text-secondary);">2026年6月26日</span>
                <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 ml-auto" style="color: var(--hl-text-tertiary);"></i>
            </section>

        </div>

        <!-- Bottom Fixed CTA Bar -->
        <div class="fixed bottom-0 inset-x-0 z-30 px-4 pt-3 pb-5" style="background: linear-gradient(to top, var(--hl-bg) 70%, transparent 100%);">
            <button data-dom-id="btn-generate" class="w-full h-12 rounded-xl text-base font-semibold whitespace-nowrap" style="background: var(--hl-primary); color: var(--hl-text-inverse);">
                生成手账
            </button>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
