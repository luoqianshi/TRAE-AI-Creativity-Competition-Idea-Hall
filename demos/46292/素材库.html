<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>素材库</title>
    <style id="theme-vars">
/* Happy Life - Warm Handcrafted Journal Style */
/* Brand CSS Variables */

:root {
  /* Brand Prefix: hl */
  --hl-primary: #E8985E;
  --hl-primary-light: #F2B88A;
  --hl-primary-lighter: #FAE5D0;
  --hl-primary-lightest: #FFF6EE;
  --hl-primary-dark: #C47A45;

  /* Warm Neutrals */
  --hl-bg: #FFFAF5;
  --hl-bg-alt: #FFF3EA;
  --hl-surface: #FFFFFF;
  --hl-surface-alt: #FFF8F2;
  --hl-surface-hover: #FFF0E6;

  --hl-text: #4A3728;
  --hl-text-secondary: #7A6558;
  --hl-text-tertiary: #A89385;
  --hl-text-inverse: #FFFFFF;

  --hl-border: #E8D5C4;
  --hl-border-light: #F0E4D8;

  /* Accent */
  --hl-accent-green: #7EB09B;
  --hl-accent-green-light: #D4EDE0;
  --hl-accent-rose: #D4838F;
  --hl-accent-rose-light: #F2DDE1;
  --hl-accent-sky: #7BA3B5;
  --hl-accent-sky-light: #D6E8F0;

  /* State Colors */
  --hl-state-success: #6B9F78;
  --hl-state-warning: #D4A037;
  --hl-state-error: #C46060;
  --hl-state-info: #6B8FB5;

  /* Typography */
  --hl-font-display: 'Noto Serif SC', 'Georgia', serif;
  --hl-font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --hl-font-hand: 'Caveat', 'Ma Shan Zheng', cursive;

  --hl-text-xs: 0.75rem;
  --hl-text-sm: 0.875rem;
  --hl-text-base: 1rem;
  --hl-text-lg: 1.125rem;
  --hl-text-xl: 1.25rem;
  --hl-text-2xl: 1.5rem;
  --hl-text-3xl: 2rem;

  --hl-leading-tight: 1.25;
  --hl-leading-normal: 1.6;
  --hl-leading-relaxed: 1.8;

  /* Spacing */
  --hl-space-xs: 4px;
  --hl-space-sm: 8px;
  --hl-space-md: 12px;
  --hl-space-base: 16px;
  --hl-space-lg: 24px;
  --hl-space-xl: 32px;
  --hl-space-2xl: 48px;

  /* Radius */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Shadow - static surfaces use border-first */
  --hl-shadow-sm: 0 1px 2px rgba(74, 55, 40, 0.04);
  --hl-shadow-md: 0 2px 8px rgba(74, 55, 40, 0.05);
  --hl-shadow-float: 0 8px 24px rgba(74, 55, 40, 0.08);

  /* Depth */
  --hl-depth-border: 1px solid var(--hl-border);
  --hl-depth-border-light: 1px solid var(--hl-border-light);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--hl-primary);
    --color-border: var(--hl-border);
  }
  @layer base {
    body { background: var(--hl-surface); color: var(--hl-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen" style="background-color: var(--hl-bg); padding-bottom: 80px;">

        <!-- Top Bar -->
        <header class="sticky top-0 z-20 flex items-center justify-between px-4 h-14" style="background-color: rgba(255, 250, 245, 0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hl-border-light);">
            <h1 class="text-lg font-semibold tracking-tight truncate" style="color: var(--hl-text); font-family: var(--hl-font-display);">素材库</h1>
            <button class="inline-flex items-center justify-center w-9 h-9 rounded-lg shrink-0" style="color: var(--hl-text-secondary);" aria-label="搜索">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Filter Tabs Row (Journal Tab Style) -->
        <nav class="px-4 pt-4 pb-2">
            <div class="flex gap-1 overflow-x-auto no-scrollbar">
                <button class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-medium" style="background-color: var(--hl-primary-lightest); color: var(--hl-primary-dark); border-bottom: 2px solid var(--hl-primary);">全部</button>
                <button class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-medium" style="background-color: var(--hl-accent-green-light); color: var(--hl-accent-green);">照片</button>
                <button class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-medium" style="background-color: var(--hl-accent-sky-light); color: var(--hl-accent-sky);">视频</button>
                <button class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-medium" style="background-color: var(--hl-accent-rose-light); color: var(--hl-accent-rose);">文字</button>
                <button class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-medium" style="background-color: var(--hl-accent-green-light); color: var(--hl-accent-green); opacity: 0.6;">手账</button>
            </div>
        </nav>

        <!-- Stats Bar -->
        <div class="px-4 py-2">
            <p class="text-xs" style="color: var(--hl-text-tertiary);">128 张照片 · 12 个视频 · 45 条文字</p>
        </div>

        <!-- Date Group: 六月 2026 -->
        <section class="px-4 mb-5">
            <div class="flex items-center gap-2 mb-3">
                <div class="w-2 h-2 rounded-full" style="background-color: var(--hl-primary);"></div>
                <h2 class="text-sm font-semibold" style="color: var(--hl-text);">六月 2026</h2>
                <div class="flex-1 h-px" style="background-color: var(--hl-border-light);"></div>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(135deg, #F2B88A 0%, #FAE5D0 50%, #E8985E 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(160deg, #D4EDE0 0%, #7EB09B 60%, #4A3728 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden relative" style="background: linear-gradient(135deg, #D6E8F0 0%, #7BA3B5 60%, #4A3728 100%);">
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: rgba(255,255,255,0.7);">
                            <i data-lucide="play" class="w-4 h-4" style="color: var(--hl-text);"></i>
                        </div>
                    </div>
                </div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(180deg, #FFF6EE 0%, #F2DDE1 50%, #D4838F 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(135deg, #E8D5C4 0%, #7A6558 60%, #4A3728 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(160deg, #FAE5D0 0%, #C47A45 50%, #4A3728 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(135deg, #D4EDE0 0%, #FFF6EE 40%, #F2B88A 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden relative" style="background: linear-gradient(180deg, #D6E8F0 0%, #7BA3B5 70%, #4A3728 100%);">
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: rgba(255,255,255,0.7);">
                            <i data-lucide="play" class="w-4 h-4" style="color: var(--hl-text);"></i>
                        </div>
                    </div>
                </div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(135deg, #F2DDE1 0%, #FAE5D0 50%, #E8985E 100%);"></div>
            </div>
        </section>

        <!-- Date Group: 五月 2026 -->
        <section class="px-4 mb-5">
            <div class="flex items-center gap-2 mb-3">
                <div class="w-2 h-2 rounded-full" style="background-color: var(--hl-accent-green);"></div>
                <h2 class="text-sm font-semibold" style="color: var(--hl-text);">五月 2026</h2>
                <div class="flex-1 h-px" style="background-color: var(--hl-border-light);"></div>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(135deg, #D4A037 0%, #FAE5D0 50%, #FFF6EE 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(160deg, #7EB09B 0%, #D4EDE0 60%, #FFF8F2 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(135deg, #FFF3EA 0%, #F2B88A 50%, #C47A45 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(180deg, #E8D5C4 0%, #A89385 50%, #4A3728 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(135deg, #F2DDE1 0%, #D4838F 50%, #7A6558 100%);"></div>
                <div class="aspect-square rounded-lg overflow-hidden" style="background: linear-gradient(160deg, #FFF6EE 0%, #E8985E 40%, #C47A45 100%);"></div>
            </div>
        </section>

        <!-- FAB -->
        <button data-dom-id="tab-organize-library" class="fixed bottom-24 right-4 z-30 w-12 h-12 rounded-full flex items-center justify-center shadow-lg" style="background-color: var(--hl-primary); color: var(--hl-text-inverse);" aria-label="添加素材">
            <i data-lucide="plus" class="w-5 h-5"></i>
        </button>

        <!-- Bottom Tab Bar -->
        <nav class="fixed bottom-0 inset-x-0 z-30 flex items-center justify-around border-t" style="height: 64px; background-color: var(--hl-surface); border-color: var(--hl-border-light); padding-bottom: env(safe-area-inset-bottom, 0px);">
            <button data-dom-id="tab-home-library" class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--hl-text-tertiary);">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px]">首页</span>
            </button>
            <div class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--hl-primary);">
                <i data-lucide="image" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium">素材库</span>
            </div>
            <div class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--hl-text-tertiary);">
                <i data-lucide="folder-open" class="w-5 h-5"></i>
                <span class="text-[10px]">整理</span>
            </div>
            <div class="flex flex-col items-center justify-center gap-0.5 flex-1 h-full" style="color: var(--hl-text-tertiary);">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px]">我的</span>
            </div>
        </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
