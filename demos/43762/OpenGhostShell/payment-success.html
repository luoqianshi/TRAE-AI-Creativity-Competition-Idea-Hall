<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - GhostShell</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Helvetica Neue', sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B2B, #F7931E);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 28px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .credit {
            display: inline-block;
            background: #1e3a1e;
            color: #4ade80;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'SF Mono', 'Menlo', monospace;
            margin: 16px 0;
        }
        .hint {
            font-size: 12px;
            color: #555;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h1>Payment Successful!</h1>
        <p>Your token credit has been added to your account.</p>
        <div class="credit">+ $5.00</div>
        <p>You can now return to GhostShell and continue chatting.<br>Credit will be used automatically after the daily free limit.</p>
        <p class="hint">You can close this page now.</p>
    </div>
</body>
</html>
