<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostShell — Shell</title>
    <meta name="description" content="A full transcript of a conversation with Shell in GhostShell." />
    <link rel="icon" type="image/png" href="../images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="hero-nav" id="nav">
      <a href="../index.html" class="brand"><img src="../images/logo.png" alt="GhostShell" /><span>GhostShell</span></a>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../features.html">Features</a>
        <a href="./en.html" class="nav-active">Shell</a>
      </div>
      <button class="hamburger" type="button" onclick="toggleMobile()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </nav>
    <div class="mobile-overlay" id="mobileOverlay" onclick="toggleMobile()"></div>
    <div class="mobile-panel" id="mobilePanel">
      <a href="../index.html" onclick="toggleMobile()">Home</a>
      <a href="../features.html" onclick="toggleMobile()">Features</a>
      <a href="./en.html" onclick="toggleMobile()">Shell</a>
    </div>

    <header class="page-hero">
      <div class="kicker">Transcript</div>
      <h1>Shell</h1>
      <p class="subtitle">A real conversation with the companion inside the GhostShell terminal (English UI).</p>
    </header>

    <div class="shell-page">
      <div class="inner">
        <section class="chat-card">
          <div class="messages" data-messages></div>
          <footer class="footer">
            <span class="note" data-count>Loading transcript…</span>
            <a class="lang-link" href="./index.html">中文</a>
          </footer>
        </section>
      </div>
    </div>

    <footer class="site-footer">
      <p>© 2026 GhostShell</p>
    </footer>

    <script>
      function toggleMobile() {
        var p = document.getElementById("mobilePanel");
        var o = document.getElementById("mobileOverlay");
        p.classList.toggle("open");
        o.classList.toggle("show");
        document.body.style.overflow = p.classList.contains("open") ? "hidden" : "";
      }
    </script>
    <script src="./chat-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
