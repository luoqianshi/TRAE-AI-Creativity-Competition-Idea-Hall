<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航迹预测可视化演示系统 - TRAE Work 生成</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #f4f7fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 20, 50, 0.15);
            overflow: hidden;
            padding: 30px;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #0b1e3a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #5e6f8d;
            font-size: 16px;
            margin-bottom: 25px;
            border-left: 4px solid #2a7de1;
            padding-left: 16px;
            background: #f0f5ff;
            border-radius: 0 8px 8px 0;
            line-height: 1.6;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
        }
        @media (max-width: 800px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Canvas 区域 */
        .canvas-wrapper {
            background: #fafcff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 12px;
            position: relative;
        }
        #trajectoryCanvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            background: white;
            border-radius: 12px;
            cursor: crosshair;
            touch-action: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .canvas-tip {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #4a5a72;
            padding: 0 6px;
        }
        .canvas-tip span:first-child::before {
            content: "🖱️ ";
        }
        .canvas-tip span:last-child::before {
            content: "💡 ";
        }

        /* 右侧面板 */
        .panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: #f8faff;
            border-radius: 16px;
            padding: 18px 20px;
            border: 1px solid #e9edf4;
        }
        .card h3 {
            font-size: 15px;
            font-weight: 600;
            color: #1a2b4a;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card h3 i {
            font-style: normal;
            background: #dce5f5;
            border-radius: 20px;
            padding: 0 10px;
            font-size: 12px;
            color: #1f3a6b;
        }
        .param-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .param-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .param-item label {
            font-size: 14px;
            color: #2d405c;
        }
        .param-item input[type="range"] {
            width: 100px;
            accent-color: #2a7de1;
        }
        .param-item .value {
            font-weight: 600;
            color: #0b1e3a;
            min-width: 30px;
            text-align: right;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .btn {
            flex: 1;
            padding: 10px 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
            color: #1f3a6b;
            border: 1px solid #ccd7e8;
        }
        .btn-primary {
            background: #1f3a6b;
            color: white;
            border: 1px solid #1f3a6b;
        }
        .btn-primary:hover {
            background: #2a4d84;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(31, 58, 107, 0.2);
        }
        .btn-secondary {
            background: #e9edf4;
            border: 1px solid #d0d9e6;
        }
        .btn-secondary:hover {
            background: #dce4f0;
        }
        .btn-danger {
            background: #fce8e8;
            border-color: #f5c2c2;
            color: #a53b3b;
        }
        .btn-danger:hover {
            background: #fad4d4;
        }

        /* 数据展示 */
        .data-box {
            background: white;
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            max-height: 160px;
            overflow-y: auto;
            font-size: 13px;
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            color: #1e2f4a;
            line-height: 1.7;
        }
        .data-box .empty {
            color: #8a9bb0;
            font-style: italic;
        }
        .data-box .highlight {
            color: #c44536;
            font-weight: 600;
        }
        .data-box .pred {
            color: #1f7b4d;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            background: #f0f5ff;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #2d405c;
            margin-top: 8px;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #7a8aa3;
            border-top: 1px solid #e9edf4;
            padding-top: 18px;
        }
        .footer a {
            color: #1f3a6b;
            text-decoration: none;
        }
        /* 滚动条美化 */
        .data-box::-webkit-scrollbar {
            width: 5px;
        }
        .data-box::-webkit-scrollbar-track {
            background: #eef2f7;
        }
        .data-box::-webkit-scrollbar-thumb {
            background: #c1cdde;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✈️ 航迹预测可视化演示</h1>
    <div class="subtitle">
        点击画布绘制历史轨迹 → 点击「预测」生成未来航迹 · 科研演示 · TRAE Work 生成
    </div>

    <div class="main-grid">
        <!-- 左侧 画布 -->
        <div class="canvas-wrapper">
            <canvas id="trajectoryCanvas" width="600" height="600"></canvas>
            <div class="canvas-tip">
                <span>点击画布添加轨迹点</span>
                <span>拖动可微调 · 右键删除最近点</span>
            </div>
        </div>

        <!-- 右侧面板 -->
        <div class="panel">
            <!-- 参数 -->
            <div class="card">
                <h3>⚙️ 参数调节 <i>模拟</i></h3>
                <div class="param-group">
                    <div class="param-item">
                        <label for="stepsSlider">预测步长</label>
                        <input type="range" id="stepsSlider" min="3" max="30" value="12">
                        <span class="value" id="stepsValue">12</span>
                    </div>
                    <div class="param-item">
                        <label for="confSlider">置信度</label>
                        <input type="range" id="confSlider" min="50" max="100" value="85">
                        <span class="value" id="confValue">85%</span>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="predictBtn">🔮 预测</button>
                    <button class="btn btn-secondary" id="clearBtn">🗑️ 清除轨迹</button>
                    <button class="btn btn-danger" id="undoBtn">↩️ 撤销</button>
                </div>
            </div>

            <!-- 数据展示 -->
            <div class="card" style="flex:1;">
                <h3>📊 轨迹数据</h3>
                <div class="data-box" id="dataDisplay">
                    <span class="empty">点击画布添加轨迹点 …</span>
                </div>
                <div class="status-bar">
                    <span id="pointCount">轨迹点: 0</span>
                    <span id="predStatus">预测: 未执行</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        本演示由 TRAE Work 生成 · 模拟航迹预测算法 · 仅供创意展示
    </div>
</div>

<script>
    (function() {
        // ---------- DOM refs ----------
        const canvas = document.getElementById('trajectoryCanvas');
        const ctx = canvas.getContext('2d');
        const dataDisplay = document.getElementById('dataDisplay');
        const pointCountSpan = document.getElementById('pointCount');
        const predStatusSpan = document.getElementById('predStatus');

        const stepsSlider = document.getElementById('stepsSlider');
        const stepsValue = document.getElementById('stepsValue');
        const confSlider = document.getElementById('confSlider');
        const confValue = document.getElementById('confValue');

        const predictBtn = document.getElementById('predictBtn');
        const clearBtn = document.getElementById('clearBtn');
        const undoBtn = document.getElementById('undoBtn');

        // ---------- 状态 ----------
        let historyPoints = [];           // {x, y} 画布坐标 (0~1 归一化)
        let predictedPoints = [];         // 预测点 {x, y}
        let isPredicting = false;

        // 画布尺寸 (逻辑尺寸 600x600)
        const W = 600, H = 600;

        // ---------- 辅助函数 ----------
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = W / rect.width;
            const scaleY = H / rect.height;
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            return { x: Math.min(W, Math.max(0, x)), y: Math.min(H, Math.max(0, y)) };
        }

        // 绘制函数
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // 网格
            ctx.strokeStyle = '#eef2f7';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 10; i++) {
                const pos = i * 60;
                ctx.beginPath();
                ctx.moveTo(pos, 0);
                ctx.lineTo(pos, H);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, pos);
                ctx.lineTo(W, pos);
                ctx.stroke();
            }

            // 历史轨迹
            if (historyPoints.length > 0) {
                // 连线
                ctx.beginPath();
                ctx.moveTo(historyPoints[0].x, historyPoints[0].y);
                for (let i = 1; i < historyPoints.length; i++) {
                    ctx.lineTo(historyPoints[i].x, historyPoints[i].y);
                }
                ctx.strokeStyle = '#1f3a6b';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 点
                for (let i = 0; i < historyPoints.length; i++) {
                    const p = historyPoints[i];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = (i === historyPoints.length - 1) ? '#c44536' : '#1f3a6b';
                    ctx.fill();
                    ctx.shadowColor = 'rgba(0,0,0,0.1)';
                    ctx.shadowBlur = 4;
                }
                ctx.shadowBlur = 0;
            }

            // 预测轨迹
            if (predictedPoints.length > 0) {
                // 预测连线 (虚线)
                ctx.beginPath();
                ctx.moveTo(historyPoints.length > 0 ? historyPoints[historyPoints.length-1].x : predictedPoints[0].x,
                           historyPoints.length > 0 ? historyPoints[historyPoints.length-1].y : predictedPoints[0].y);
                for (let i = 0; i < predictedPoints.length; i++) {
                    ctx.lineTo(predictedPoints[i].x, predictedPoints[i].y);
                }
                ctx.strokeStyle = '#1f7b4d';
                ctx.lineWidth = 3;
                ctx.setLineDash([6, 6]);
                ctx.stroke();
                ctx.setLineDash([]);

                // 预测点 (空心)
                for (let i = 0; i < predictedPoints.length; i++) {
                    const p = predictedPoints[i];
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 7, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#1f7b4d';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(31, 123, 77, 0.15)';
                    ctx.fill();
                }
            }

            // 图例
            ctx.font = '12px "Segoe UI", sans-serif';
            ctx.fillStyle = '#2d405c';
            if (historyPoints.length > 0) {
                ctx.fillStyle = '#1f3a6b';
                ctx.beginPath();
                ctx.arc(20, 20, 5, 0, 2*Math.PI);
                ctx.fill();
                ctx.fillStyle = '#2d405c';
                ctx.fillText('历史轨迹', 32, 25);
            }
            if (predictedPoints.length > 0) {
                ctx.fillStyle = '#1f7b4d';
                ctx.beginPath();
                ctx.arc(20, 44, 5, 0, 2*Math.PI);
                ctx.stroke();
                ctx.fillStyle = '#2d405c';
                ctx.fillText('预测轨迹', 32, 49);
            }
        }

        // 更新数据展示
        function updateDataDisplay() {
            let html = '';
            if (historyPoints.length === 0 && predictedPoints.length === 0) {
                html = '<span class="empty">点击画布添加轨迹点 …</span>';
            } else {
                if (historyPoints.length > 0) {
                    html += `<div style="margin-bottom:6px;"><strong>历史点 (${historyPoints.length})</strong></div>`;
                    historyPoints.forEach((p, i) => {
                        html += `P${i+1}: (${p.x.toFixed(1)}, ${p.y.toFixed(1)})  `;
                        if ((i+1)%3 === 0) html += '<br>';
                    });
                }
                if (predictedPoints.length > 0) {
                    html += `<div style="margin-top:10px;color:#1f7b4d;"><strong>预测点 (${predictedPoints.length})</strong></div>`;
                    predictedPoints.forEach((p, i) => {
                        html += `<span class="pred">F${i+1}</span>: (${p.x.toFixed(1)}, ${p.y.toFixed(1)})  `;
                        if ((i+1)%3 === 0) html += '<br>';
                    });
                }
            }
            dataDisplay.innerHTML = html;
            pointCountSpan.textContent = `轨迹点: ${historyPoints.length}`;
            predStatusSpan.textContent = predictedPoints.length > 0 ? `预测: ${predictedPoints.length} 个点` : '预测: 未执行';
        }

        // ---------- 预测模拟 ----------
        function generatePrediction() {
            if (historyPoints.length < 2) {
                alert('至少需要 2 个历史点才能预测');
                return;
            }
            const steps = parseInt(stepsSlider.value);
            // 简单外推：使用最后两个点的方向 + 随机扰动 (模拟不确定性)
            const last = historyPoints[historyPoints.length-1];
            const prev = historyPoints[historyPoints.length-2];
            const dx = last.x - prev.x;
            const dy = last.y - prev.y;
            const len = Math.sqrt(dx*dx + dy*dy);
            if (len < 1) {
                // 如果点重合，随机方向
                const angle = Math.random() * 2 * Math.PI;
                const dx2 = Math.cos(angle);
                const dy2 = Math.sin(angle);
                const newPoints = [];
                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    const noise = 0.2 * (1 - t) * (Math.random() - 0.5);
                    newPoints.push({
                        x: Math.min(W, Math.max(0, last.x + dx2 * 20 * i + noise * 30)),
                        y: Math.min(H, Math.max(0, last.y + dy2 * 20 * i + noise * 30))
                    });
                }
                predictedPoints = newPoints;
            } else {
                const normDx = dx / len;
                const normDy = dy / len;
                const stepLen = Math.min(30, len * 1.2);
                const newPoints = [];
                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    const noise = 0.25 * (1 - t) * (Math.random() - 0.5);
                    const x = last.x + normDx * stepLen * i + noise * 25;
                    const y = last.y + normDy * stepLen * i + noise * 25;
                    newPoints.push({
                        x: Math.min(W, Math.max(0, x)),
                        y: Math.min(H, Math.max(0, y))
                    });
                }
                predictedPoints = newPoints;
            }
            draw();
            updateDataDisplay();
        }

        // ---------- 事件绑定 ----------
        // 添加点
        function addPoint(e) {
            if (isPredicting) return;
            const pos = getCanvasCoords(e);
            // 避免过于密集 (距离 < 5 忽略)
            if (historyPoints.length > 0) {
                const last = historyPoints[historyPoints.length-1];
                const dist = Math.hypot(pos.x - last.x, pos.y - last.y);
                if (dist < 5) return;
            }
            historyPoints.push(pos);
            // 如果有预测，清除预测
            predictedPoints = [];
            draw();
            updateDataDisplay();
        }

        canvas.addEventListener('click', addPoint);
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            addPoint(e);
        }, { passive: false });

        // 右键删除最近点
        canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            if (historyPoints.length > 0) {
                historyPoints.pop();
                predictedPoints = [];
                draw();
                updateDataDisplay();
            }
        });

        // 撤销按钮
        undoBtn.addEventListener('click', function() {
            if (historyPoints.length > 0) {
                historyPoints.pop();
                predictedPoints = [];
                draw();
                updateDataDisplay();
            }
        });

        // 清除
        clearBtn.addEventListener('click', function() {
            historyPoints = [];
            predictedPoints = [];
            draw();
            updateDataDisplay();
        });

        // 预测
        predictBtn.addEventListener('click', function() {
            if (historyPoints.length < 2) {
                alert('请至少绘制 2 个轨迹点');
                return;
            }
            generatePrediction();
        });

        // 滑块显示
        stepsSlider.addEventListener('input', function() {
            stepsValue.textContent = this.value;
        });
        confSlider.addEventListener('input', function() {
            confValue.textContent = this.value + '%';
        });

        // 额外功能：键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                predictBtn.click();
            }
            if (e.key === 'z' && e.ctrlKey) {
                undoBtn.click();
            }
            if (e.key === 'c' && e.ctrlKey) {
                clearBtn.click();
            }
        });

        // 初始化
        draw();
        updateDataDisplay();

        // 用于响应的窗口重绘
        window.addEventListener('resize', draw);
    })();
</script>
</body>
</html>
