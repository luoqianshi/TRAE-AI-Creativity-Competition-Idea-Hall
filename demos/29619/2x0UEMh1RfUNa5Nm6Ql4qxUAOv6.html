    h+=`</tbody></table>`;
  }
  h+=`</div></section>`;
  return h;
}

function initFocus(){updateFocusDisplay();}
function setFocusMode(m){
  focusMode=m;if(m==='pomodoro'){focusGoalMin=25;focusSec=25*60;}else if(m==='stopwatch'){focusGoalMin=25;focusSec=25*60;}else{focusGoalMin=0;focusSec=0;}
  renderAll();setTimeout(()=>scrollToSection('focus'),100);
}
function setFocusGoal(m){focusGoalMin=m;focusSec=m*60;renderAll();setTimeout(()=>scrollToSection('focus'),100);}
function updateFocusProject(){focusBigPlanId=document.getElementById('focusPlanSelect')?.value||'';focusProjectName='';renderAll();setTimeout(()=>scrollToSection('focus'),100);}

function toggleFocus(){focusRunning?stopFocus():startFocus();}
function startFocusOnTask(id){
  const p=DATA.dailyPlans.find(x=>x.id===id);if(!p)return;
  focusBigPlanId=p.bigPlanId||'';
  focusProjectName=p.projectName||'';
  focusLinkedTaskId=id;
  startFocus();
}
function startFocus(){
  if(focusRunning)return;focusRunning=true;
  if(focusMode==='countup')focusSec=0;else if(focusSec===0)focusSec=focusGoalMin*60;
  const st=nowStr(),sd=todayStr();
  focusTimer=setInterval(()=>{
    if(focusMode==='countup')focusSec++;else{focusSec--;if(focusSec<=0){stopFocus();showToast('⏰ 时间到！专注完成','success');return;}}
    updateFocusDisplay();
  },1000);
  focusTimer._st=st;focusTimer._sd=sd;renderAll();setTimeout(()=>scrollToSection('focus'),100);
}
function stopFocus(){
  if(!focusRunning)return;clearInterval(focusTimer);focusRunning=false;
  const dur=focusMode==='countup'?focusSec:(focusGoalMin*60-Math.max(0,focusSec));
  const durMin=Math.round(dur/60);
  if(dur>30){
    const sess={id:genId(),date:focusTimer._sd||todayStr(),startTime:focusTimer._st||nowStr(),durationSec:dur,mode:focusMode,bigPlanId:focusBigPlanId,projectName:focusProjectName,quality:0};
    DATA.focusSessions.push(sess);
    if(focusBigPlanId&&focusProjectName){
      const bp=DATA.bigPlans.find(x=>x.id===focusBigPlanId);if(bp){const pr=bp.projects.find(p=>p.name===focusProjectName);if(pr)pr.investedMin+=durMin;}
    }
    if(focusLinkedTaskId){
      const dp=DATA.dailyPlans.find(p=>p.id===focusLinkedTaskId);
      if(dp){
        if(dp.taskTimers&&dp.taskTimers.running){
          if(dp.taskTimers.interval)clearInterval(dp.taskTimers.interval);
          dp.taskTimers.running=false;
        }
        dp.actualMin=(dp.actualMin||0)+durMin;
        if(dp.actualMin>=(dp.plannedMin||1)*.9)dp.done=true;
        if(dp.done){showToast('🎉 任务「'+(dp.content||'').slice(0,20)+'」已完成！','success');}
        if(dp.taskTimers&&dp.taskTimers.realStartTime){
          var startDate=new Date(dp.taskTimers.realStartTime);
          var newSlot=fmtHM(startDate)+'-'+fmtHM(new Date());
          if(!dp.timeSlot||!dp.timeSlot.trim()){dp.timeSlot=newSlot;}
        }
        delete dp.taskTimers;
        // 联动更新资料 investedMin
        if(dp.linkedResourceId){
          var res=DATA.resources.find(function(x){return x.id===dp.linkedResourceId;});
          if(res){res.investedMin=(res.investedMin||0)+durMin;}
        }
      }
      focusLinkedTaskId='';
    }else{
      const t=todayStr();const dp=DATA.dailyPlans.find(p=>p.date===t&&p.bigPlanId===focusBigPlanId&&p.projectName===focusProjectName&&!p.done);
      if(dp){dp.actualMin=(dp.actualMin||0)+durMin;if(dp.actualMin>=dp.plannedMin*.9)dp.done=true;}
    }
    saveData();showReflection(sess.id);
    // Pomodoro: start rest after focus
    if(focusMode==='pomodoro'){
      showToast('🍅 番茄钟完成！休息5分钟','success');
      setTimeout(()=>startRestTimer(),1200);
    }
  }else{
    focusLinkedTaskId='';
  }
  focusSec=focusMode==='countup'?0:(focusGoalMin*60);renderAll();
}

function showReflection(sid){
  const s=DATA.focusSessions.find(x=>x.id===sid);if(!s)return;
  let h=`<h3>🍊 专注质量评价</h3><p style="margin-bottom:16px;color:var(--text-secondary);">完成了 ${fmtClock(s.durationSec)} 的专注学习</p>`;
  h+=`<div class="stars-row" id="refStars">`;
  for(let i=1;i<=5;i++)h+=`<button class="star-btn" onclick="setRefStar('${sid}',${i})">⭐</button>`;
  h+=`</div>`;
  h+=`<div style="text-align:center;margin-top:8px;color:var(--text-muted);font-size:12px;" id="refHint">点击星星评分</div>`;
  h+=`<div class="bar"><button class="btn btn-outline btn-sm" onclick="closeModal();renderAll();">跳过</button></div>`;
  openModal(h);
}
function setRefStar(sid,star){
  const s=DATA.focusSessions.find(x=>x.id===sid);if(s){s.quality=star;saveData();}
  document.querySelectorAll('#refStars .star-btn').forEach((b,i)=>b.classList.toggle('active',i<star));
  document.getElementById('refHint').textContent=['','效率较低 😔','需要改进 😐','一般般 🙂','不错 👍','太棒了 🔥'][star];
}

// ==================== BGM & REST ====================
function toggleBGMDropdown(e){e.stopPropagation();const d=document.getElementById('bgmDropdown');if(d)d.style.display=d.style.display==='none'?'block':'none';}
document.addEventListener('click',()=>{const d=document.getElementById('bgmDropdown');if(d)d.style.display='none';});

function setBGM(mode){
  bgmMode=mode;
  const audio=document.getElementById('bgmAudio');
  const source=document.getElementById('bgmSource');
  if(mode==='none'||!bgmUrls[mode]){
    audio.pause();audio.currentTime=0;
  }else{
    if(bgmUrls[mode]){
      source.src=bgmUrls[mode];
      audio.load();
      audio.play().catch(()=>{/* User interaction required */});
    }
  }
  renderAll();setTimeout(()=>scrollToSection('focus'),100);
}

function startRestTimer(){
  if(restRunning)return;
  restRunning=true;restSec=5*60; // 5 min rest
  const displayEl=document.getElementById('restTimerDisplay');
  restTimer=setInterval(()=>{
    restSec--;
    if(displayEl)displayEl.textContent=fmtClock(restSec);
    if(restSec<=0){
      stopRestTimer();
      // Play rest end sound
      try{const audio=document.getElementById('restAudio');if(audio){audio.currentTime=0;audio.play().catch(()=>{});}}catch(e){}
      showToast('休息结束，继续加油！🍊','success');
    }
  },1000);
  renderAll();setTimeout(()=>scrollToSection('focus'),100);
}

function stopRestTimer(){
  if(restTimer)clearInterval(restTimer);restTimer=null;
  if(restRunning){
    // Track rest session in today's focus sessions
    const restDuration=5*60-Math.max(0,restSec);
    if(restDuration>10){
      const t=todayStr();
      const lastSession=DATA.focusSessions.filter(s=>s.date===t).pop();
      if(lastSession){lastSession.restCount=(lastSession.restCount||0)+1;lastSession.restSec=(lastSession.restSec||0)+restDuration;}
    }
    saveData();
  }
  restRunning=false;restSec=0;
  renderAll();setTimeout(()=>scrollToSection('focus'),100);
}

// ==================== PLANS (Big Plans + Eisenhower) ====================
function renderPlans(){
  let h=`<section class="section" id="plans">`;
  // Eisenhower — show sub-projects in each quadrant
  h+=`<div class="card"><div class="card-header"><span class="card-title">🗂️ 学习计划（四象限）</span><button class="btn btn-primary btn-sm" onclick="showBPForm()">+ 新增计划</button></div>`;
  const qs=[
    {k:'q1',t:'🔴 紧急且重要',c:'q1'},{k:'q2',t:'🟠 重要不紧急',c:'q2'},
    {k:'q3',t:'🔵 紧急不重要',c:'q3'},{k:'q4',t:'⚪ 不紧急不重要',c:'q4'},
  ];
  h+=`<div class="quad-grid">`;
  qs.forEach(q=>{
    const plans=DATA.bigPlans.filter(p=>(p.quadrant||'q2')===q.k);
    h+=`<div class="quad-cell ${q.c}"><h4>${q.t}</h4>`;
    let hasAny=false;
    plans.forEach(bp=>{
      (bp.projects||[]).forEach(pr=>{
        hasAny=true;
        const tp=bp.totalTasks||1;const prPct=Math.round((bp.completedTasks||0)/tp*100);
        h+=`<div class="sub-card" onclick="editSubProject('${bp.id}','${escapeHtml(pr.name).replace(/'/g,"\\'")}')">`;
        h+=`<div class="sub-plan">📌 ${escapeHtml(bp.name)}</div>`;
        h+=`<div class="sub-name">${escapeHtml(pr.name)}</div>`;
        h+=`<div class="sub-row"><div class="sub-bar"><div class="sub-fill" style="width:${prPct}%;"></div></div><span style="font-size:10px;color:var(--text-muted);">${prPct}%</span></div>`;
        h+=`<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">⏱ ${fmtMin(pr.investedMin||0)}</div>`;
        h+=`<div class="sub-actions"><button class="btn btn-primary btn-sm" style="font-size:10px;padding:2px 8px;" onclick="event.stopPropagation();focusOnSubProject('${bp.id}','${escapeHtml(pr.name).replace(/'/g,"\\'")}')">▶ 专注</button></div>`;
        h+=`</div>`;
      });
    });
    if(!hasAny)h+=`<div style="font-size:12px;color:var(--text-muted);padding:6px;">暂无子项目</div>`;
    h+=`</div>`;
  });
  h+=`</div></div>`;

  // Accordion list for all plans
  h+=`<div class="card"><div class="card-header"><span class="card-title">📋 全部计划</span></div>`;
  h+=`<div class="plans-accordion">`;
  DATA.bigPlans.forEach(bp=>{
    const pct=calcPct(bp.completedTasks,bp.totalTasks);
    const ti=bp.projects.reduce((a,x)=>a+(x.investedMin||0),0);
    h+=`<div class="acc-item" id="acc-${bp.id}">`;
    h+=`<div class="acc-header" onclick="toggleAccordion('${bp.id}')">`;
    h+=`<span class="acc-arrow">▶</span>`;
    h+=`<span style="font-weight:600;font-size:13px;flex:1;">${escapeHtml(bp.name)}</span>`;
    h+=`<span class="tag ${subjTagClass(bp.subjectId)}">${subjName(bp.subjectId)}</span>`;
    h+=`<span style="font-size:11px;color:var(--text-muted);min-width:32px;text-align:right;">${pct}%</span>`;
    h+=`</div>`;
    h+=`<div class="acc-body">`;
    (bp.projects||[]).forEach(pr=>{
      h+=`<div class="sub-card" style="cursor:default;">`;
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;">`;
      h+=`<span class="sub-name" style="margin:0;">${escapeHtml(pr.name)}</span>`;
      h+=`<span style="font-size:11px;color:var(--text-muted);">⏱ ${fmtMin(pr.investedMin||0)}</span>`;
      h+=`</div>`;
      h+=`<div class="sub-actions">`;
      h+=`<button class="btn btn-primary btn-sm" style="font-size:10px;padding:2px 8px;" onclick="focusOnSubProject('${bp.id}','${escapeHtml(pr.name).replace(/'/g,"\\'")}')">▶ 专注</button>`;
      h+=`<button class="btn btn-outline btn-sm" style="font-size:10px;padding:2px 8px;" onclick="editSubProject('${bp.id}','${escapeHtml(pr.name).replace(/'/g,"\\'")}')">✏️</button>`;
      h+=`<button class="btn btn-outline btn-sm" style="font-size:10px;padding:2px 8px;color:var(--red);border-color:var(--red);" onclick="deleteSubProject('${bp.id}','${escapeHtml(pr.name).replace(/'/g,"\\'")}')">🗑</button>`;
      h+=`</div></div>`;
    });
    if(!bp.projects||bp.projects.length===0)h+=`<div style="font-size:12px;color:var(--text-muted);padding:6px 0;">暂无子项目 <button class="btn btn-outline btn-sm" style="font-size:10px;" onclick="addProject('${bp.id}')">+ 添加</button></div>`;
    else h+=`<button class="btn btn-outline btn-sm" style="font-size:10px;margin-top:4px;" onclick="addProject('${bp.id}')">+ 添加子项目</button>`;
    h+=`</div></div>`;
  });
  if(DATA.bigPlans.length===0)h+=`<div style="padding:16px;text-align:center;color:var(--text-muted);">暂无计划，点击上方按钮创建</div>`;
  h+=`</div></div>`;
  // === Gantt Chart ===
  const plansWithDates=DATA.bigPlans.filter(bp=>bp.startDate&&bp.endDate);
  if(plansWithDates.length>0){
    const ganttStart=plansWithDates.reduce((a,bp)=>bp.startDate<a?bp.startDate:a,todayStr());
    const ganttEnd=plansWithDates.reduce((a,bp)=>bp.endDate>a?bp.endDate:a,'2026-01-01');
    const ganttDays=getDaysBetween(ganttStart,ganttEnd)+1;
    const todayOffset=getDaysBetween(ganttStart,todayStr());
    if(ganttDays>0&&ganttDays<2000){
      h+=`<div class="card"><div class="card-header"><span class="card-title">📅 计划甘特图</span><span style="font-size:11px;color:var(--text-muted);">${ganttStart} → ${ganttEnd}</span></div>`;
      h+=`<div style="overflow-x:auto;padding-bottom:8px;">`;
      h+=`<div style="min-width:${Math.max(400,ganttDays*2.5)}px;">`;
      h+=`<div style="display:flex;font-size:9px;color:var(--text-muted);padding:2px 100px 4px 0;border-bottom:1px solid var(--border-light);margin-bottom:2px;">`;
      let cm='';let cmStart=0;
      for(let d=0;d<ganttDays;d++){
        const dd=shiftDate(ganttStart,d);const m=dd.slice(0,7);
        if(m!==cm||d===ganttDays-1){
          if(cm&&cmStart<d)h+=`<div style="flex:${d-cmStart};min-width:0;text-align:left;">${cm.slice(5)}月</div>`;
          cm=m;cmStart=d;
        }
      }
      if(cmStart<ganttDays)h+=`<div style="flex:${ganttDays-cmStart};min-width:0;text-align:left;">${cm.slice(5)}月</div>`;
      h+=`</div>`;
      h+=`<div style="position:relative;">`;
      if(todayOffset>=0&&todayOffset<ganttDays){
        h+=`<div style="position:absolute;left:calc(100px + ${((todayOffset+0.5)/ganttDays*100).toFixed(2)}%);top:0;bottom:0;width:2px;background:var(--red);z-index:3;opacity:.6;" title="今天"></div>`;
      }
      plansWithDates.forEach((bp,i)=>{
        const startOff=getDaysBetween(ganttStart,bp.startDate);
        const bpDays=Math.max(1,getDaysBetween(bp.startDate,bp.endDate)+1);
        const pct=calcPct(bp.completedTasks,bp.totalTasks);
        const alpha=0.5+(i%plansWithDates.length)*0.08;
        h+=`<div style="display:flex;align-items:center;height:30px;margin-bottom:4px;">`;
        h+=`<div style="width:100px;font-size:10px;font-weight:600;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:6px;text-align:right;line-height:1.1;" title="${escapeHtml(bp.name)}">${escapeHtml(bp.name.slice(0,8))}</div>`;
        h+=`<div style="flex:1;position:relative;height:100%;">`;
        h+=`<div style="position:absolute;left:${(startOff/ganttDays*100).toFixed(2)}%;width:${Math.max(0.5,(bpDays/ganttDays*100).toFixed(2))}%;top:4px;bottom:4px;background:rgba(249,115,22,${alpha.toFixed(2)});border:1px solid rgba(234,88,12,${Math.min(1,alpha+0.2).toFixed(2)});border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:${alpha>0.65?'#fff':'var(--orange-700)'};font-weight:500;overflow:hidden;white-space:nowrap;" title="${escapeHtml(bp.name)}: ${bp.startDate}→${bp.endDate} · 进度${pct}%">`;
        if(bpDays>ganttDays*0.05)h+=`${pct}%`;
        h+=`</div></div></div>`;
      });
      h+=`</div></div></div>`;
    }
  }
  h+=`</section>`;
  return h;
}

function initPlans(){}

function refreshPlans(){
  const section=document.getElementById('plans');
  if(section){section.outerHTML=renderPlans();}
}

function toggleAccordion(bpid){
  const item=document.getElementById('acc-'+bpid);
  if(item)item.classList.toggle('open');
}

function focusOnSubProject(bpId,prName){
  focusBigPlanId=bpId;
  focusProjectName=prName;
  renderAll();
  setTimeout(function(){scrollToSection('focus');},100);
}

function editSubProject(bpId,prName){
  const bp=DATA.bigPlans.find(function(x){return x.id===bpId;});
  if(!bp)return;
  const pr=bp.projects.find(function(p){return p.name===prName;});
  if(!pr)return;
  let h=`<h3>编辑子项目</h3>`;
  h+=`<p style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">所属计划: ${escapeHtml(bp.name)}</p>`;
  h+=`<div class="form-group"><label>名称</label><input id="esp_n" value="${escapeHtml(pr.name)}"></div>`;
  h+=`<div class="form-group"><label>已投入时长(分钟)</label><input type="number" id="esp_m" value="${pr.investedMin||0}" min="0"></div>`;
  h+=`<div class="bar"><button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" onclick="saveSubProject('${bpId}','${escapeHtml(prName).replace(/'/g,"\\'")}')">保存</button></div>`;
  openModal(h);
}

function saveSubProject(bpId,oldName){
  const bp=DATA.bigPlans.find(function(x){return x.id===bpId;});
  if(!bp)return;
  const pr=bp.projects.find(function(p){return p.name===oldName;});
  if(!pr)return;
  const newName=document.getElementById('esp_n')?.value||'';
  const newMin=parseInt(document.getElementById('esp_m')?.value||'0');
  if(!newName.trim()){showToast('请输入名称','error');return;}
  pr.name=newName.trim();
  pr.investedMin=newMin;
  saveData();closeModal();refreshPlans();
}

function deleteSubProject(bpId,prName){
  if(!confirm('删除子项目 “'+prName+'”?'))return;
  const bp=DATA.bigPlans.find(function(x){return x.id===bpId;});
  if(!bp)return;
  bp.projects=bp.projects.filter(function(p){return p.name!==prName;});
  saveData();refreshPlans();
}

function saveBP(eid){
  const d={name:document.getElementById('bpf_n')?.value||'',desc:document.getElementById('bpf_d')?.value||'',subjectId:document.getElementById('bpf_s')?.value||DATA.subjects[0]?.id||'',startDate:document.getElementById('bpf_sd')?.value||'',endDate:document.getElementById('bpf_ed')?.value||'',totalTasks:parseInt(document.getElementById('bpf_tt')?.value||'10'),completedTasks:parseInt(document.getElementById('bpf_ct')?.value||'0'),targetMin:parseInt(document.getElementById('bpf_tm')?.value||'3600'),quadrant:document.getElementById('bpf_q')?.value||'q2'};

function updateBPC(id){const bp=DATA.bigPlans.find(x=>x.id===id);if(bp){bp.completedTasks=parseInt(document.getElementById('bpd_ct')?.value||'0');saveData();closeModal();refreshPlans();}}
function deleteBP(id){if(!confirm('删除计划？'))return;DATA.bigPlans=DATA.bigPlans.filter(x=>x.id!==id);DATA.dailyPlans.forEach(p=>{if(p.bigPlanId===id)p.bigPlanId='';});saveData();closeModal();refreshPlans();}
function addProject(id){const n=prompt('子项目名称:');if(!n||!n.trim())return;const bp=DATA.bigPlans.find(x=>x.id===id);if(bp&&!bp.projects.find(p=>p.name===n.trim())){bp.projects.push({name:n.trim(),investedMin:0});saveData();}refreshPlans();}

// ==================== PHASE GOALS ====================
function renderPhaseGoals(){
  let h=`<section class="section" id="phase">`;
  h+=`<div class="card"><div class="card-header"><span class="card-title">🎯 阶段目标</span><button class="btn btn-primary btn-sm" onclick="showPhaseGoalForm()">+ 添加阶段</button></div>`;
  const pgs=[...DATA.phaseGoals].sort((a,b)=>a.order-b.order);
  if(pgs.length===0){
    h+=`<div class="empty-state"><p>还没有阶段目标</p><p style="font-size:12px;color:var(--text-muted);">设置阶段目标来组织你的备考进程</p></div>`;
  }else{
    pgs.forEach(pg=>{
      const daysLeft=getDaysBetween(todayStr(),pg.endDate);
      const isActive=todayStr()>=pg.startDate&&todayStr()<=pg.endDate;
      const isPast=todayStr()>pg.endDate;
      const linkedPlans=pg.bigPlanIds?.map(id=>DATA.bigPlans.find(bp=>bp.id===id)).filter(Boolean)||[];
      const totalPct=linkedPlans.length?Math.round(linkedPlans.reduce((a,bp)=>a+calcPct(bp.completedTasks,bp.totalTasks),0)/linkedPlans.length):0;
      h+=`<div class="item-card" style="${isActive?'border-color:var(--orange-400);background:var(--orange-50);':''}${isPast?'opacity:.6;':''}">`;
      h+=`<div style="display:flex;justify-content:space-between;align-items:center;">`;
      h+=`<div><span style="font-weight:600;font-size:15px;">${isActive?'🟠':isPast?'✅':''} ${escapeHtml(pg.name)}</span>`;
      if(isActive)h+=`<span class="tag orange" style="margin-left:6px;">进行中</span>`;
      if(isPast&&pg.done)h+=`<span class="tag green" style="margin-left:6px;">已完成</span>`;
      h+=`</div>`;
      h+=`<span style="font-size:12px;color:var(--text-muted);">${pg.startDate} → ${pg.endDate}${isActive?' · 剩余'+daysLeft+'天':''}</span>`;
      h+=`</div>`;
      if(pg.desc)h+=`<p style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${escapeHtml(pg.desc)}</p>`;
      if(linkedPlans.length>0){
        h+=`<div style="margin-top:8px;"><div class="progress-bar"><div class="progress-fill orange" style="width:${totalPct}%;"></div></div></div>`;
        h+=`<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);">关联计划：`;
        linkedPlans.forEach(bp=>h+=`<span class="tag ${subjTagClass(bp.subjectId)}">${escapeHtml(bp.name)} (${calcPct(bp.completedTasks,bp.totalTasks)}%)</span>`);
        h+=`</div>`;
      }
      h+=`<div style="margin-top:8px;display:flex;gap:6px;">`;
      h+=`<button class="btn btn-sm btn-outline" onclick="showPhaseGoalForm('${pg.id}')">✏️</button>`;
      if(!pg.done)h+=`<button class="btn btn-sm btn-primary" onclick="markPhaseDone('${pg.id}')">✅ 标记完成</button>`;
      h+=`<button class="btn btn-sm btn-outline" style="color:var(--red);border-color:var(--red);" onclick="deletePhaseGoal('${pg.id}')">🗑</button>`;
      h+=`</div></div>`;
    });
  }
  h+=`</div></section>`;
  return h;
}

let knowledgeTreeSubject='';

function renderTreeNode(node,level,sid){
  const kt=DATA.knowledgeTree[sid]||{};
  const mastery=kt._mastery||{};
  const key=node.name;
  const m=mastery[key]||0;
  const cls=m>=2?'mastered':m>=1?'learning':'weak';
  const dot=m>=2?'green':m>=1?'orange':m>=0?'gray':'red';
  let h=`<div class="tree-node ${m>0?cls:''}" style="${level>0?'margin-left:'+(level*24)+'px;':''}font-size:${level===0?'14px':'13px'};" onclick="cycleKnowledgeMastery('${sid}','${key.replace(/'/g,"\\'")}')">`;
  h+=`<span class="tn-dot ${dot}"></span>${escapeHtml(node.name)}`;
  if(m>=2)h+=` <span style="font-size:10px;color:var(--green);">✓</span>`;
  if(m===1)h+=` <span style="font-size:10px;color:var(--orange-400);">~</span>`;
  h+=`</div>`;
  if(node.children)node.children.forEach(c=>{h+=renderTreeNode(c,level+1,sid);});
  return h;
}

function cycleKnowledgeMastery(sid,nodeName){
  if(!DATA.knowledgeTree)DATA.knowledgeTree={};
  if(!DATA.knowledgeTree[sid])DATA.knowledgeTree[sid]=getDefaultKnowledgeTree(sid,'');
  if(!DATA.knowledgeTree[sid]._mastery)DATA.knowledgeTree[sid]._mastery={};
  const m=DATA.knowledgeTree[sid]._mastery;
  m[nodeName]=((m[nodeName]||0)+1)%3;
  saveData();renderAll();
}

function addKnowledgeNode(sid){
  const path=document.getElementById('ktn_path')?.value?.trim()||'';
  const name=document.getElementById('ktn_name')?.value?.trim();
  if(!name){showToast('请输入节点名','error');return;}
  if(!DATA.knowledgeTree)DATA.knowledgeTree={};
  if(!DATA.knowledgeTree[sid])DATA.knowledgeTree[sid]=getDefaultKnowledgeTree(sid,'');
  const tree=DATA.knowledgeTree[sid];
  if(!path){
    if(!tree.children)tree.children=[];
    tree.children.push({name});
  }else{
    const parts=path.split('/');
    let node=tree;
    for(const p of parts){
      if(!node.children)node.children=[];
      let found=node.children.find(c=>c.name===p);
      if(!found){found={name:p};node.children.push(found);}
      node=found;
    }
    if(!node.children)node.children=[];
    node.children.push({name});
  }
  saveData();renderAll();showToast('节点已添加','success');
}

}

async function startPDFAnalysis(){
  const file=document.getElementById('pdfFileInput')?.files?.[0];
  if(!file){showToast('请先选择PDF文件','error');return;}
  const sid=knowledgeTreeSubject||DATA.subjects[0]?.id||'s1';
  const rangeRadio=document.querySelector('input[name="pdfRange"]:checked');
  const maxPages=parseInt(rangeRadio?.value||'10')||0;

  const btn=document.getElementById('startAnalysisBtn');
  btn.disabled=true;btn.textContent='分析中…';
  const prog=document.getElementById('uploadProgress');
  prog.classList.add('active');
  const s1=document.getElementById('step1');const s2=document.getElementById('step2');const s3=document.getElementById('step3');

  // Step 1
  s1.classList.add('active');
  let text;
  try{
    text=await extractTextFromPDF(file,maxPages||10);
    s1.classList.remove('active');s1.classList.add('done');
  }catch(e){
    s1.classList.remove('active');
    showToast('PDF提取失败: '+e.message,'error');
    btn.disabled=false;btn.textContent='开始分析';
    prog.classList.remove('active');
    return;
  }

  // Step 2
  s2.classList.add('active');
  let tree;
  try{
    tree=await analyzePDFWithAI(text,sid);
    s2.classList.remove('active');s2.classList.add('done');
  }catch(e){
    s2.classList.remove('active');s2.classList.add('done');
    s2.querySelector('.step-dot').style.background='var(--orange-400)';
    showToast('AI分析失败，已根据文本格式生成基础结构，请手动调整','info');
  }

  // Step 3
  s3.classList.add('active');
  if(!tree){
    try{tree=localParsePDF(text);}catch(e2){tree={name:'导入的知识树',children:[{name:'解析失败，请手动编辑'}]};}
  }
  s3.classList.remove('active');s3.classList.add('done');

  const action=confirm('是否替换当前知识树？\n\n"确定"=替换当前树\n"取消"=合并到现有树（同名节点合并，新节点追加）');
  if(action){
    DATA.knowledgeTree[sid]=tree;
  }else{
    if(!DATA.knowledgeTree)DATA.knowledgeTree={};
    if(!DATA.knowledgeTree[sid])DATA.knowledgeTree[sid]=getDefaultKnowledgeTree(sid);
    mergeKnowledgeTrees(DATA.knowledgeTree[sid],tree);
  }
  saveData();closeModal();refreshKnowledgeTree();
  showToast('知识树已生成！','success');
}

async function extractTextFromPDF(file,maxPages){
  const timeout=10000;
  const result=await Promise.race([
    (async()=>{
      const arrayBuffer=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=function(){resolve(reader.result);};
        reader.onerror=function(){reject(new Error('文件读取失败'));};
        reader.readAsArrayBuffer(file);
      });
      const loadingTask=pdfjsLib.getDocument({data:arrayBuffer});
      const pdf=await loadingTask.promise;
      const totalPages=Math.min(maxPages||pdf.numPages,pdf.numPages);
      let fullText='';
      for(let i=1;i<=totalPages;i++){
        const page=await pdf.getPage(i);
        const content=await page.getTextContent();
        const pageText=content.items.map(function(item){return item.str;}).join(' ');
        fullText+='\n--- 第'+i+'页 ---\n'+pageText;
      }
      return fullText;
    })(),
    new Promise(function(_,reject){setTimeout(function(){reject(new Error('提取超时'));},timeout);})
  ]);
  return result;
}

async function analyzePDFWithAI(text,subjectId){
  const cfg=DATA.aiConfig||{};
  if(!cfg.apiEndpoint||!cfg.apiKey){
    throw new Error('AI未配置');
  }
  const prompt='你是一名考研辅导专家。以下是一本教材/教辅的文本内容（部分），请提取出它的章节知识点结构，以JSON格式返回，格式为：{ "name": "根节点", "children": [ { "name": "子节点", "children": [...] } ] }。最大深度4层。只返回JSON，不要任何其他文字。\n\n文本内容：\n'+text.substring(0,6000);
  const controller=new AbortController();
  const timeoutId=setTimeout(function(){controller.abort();},10000);
  try{
    const resp=await fetch(cfg.apiEndpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},
      body:JSON.stringify({
        model:cfg.model||'gpt-4o-mini',
        messages:[{role:'user',content:prompt}],
        temperature:0.3,
        max_tokens:4000
      }),
      signal:controller.signal
    });
    clearTimeout(timeoutId);
    if(!resp.ok)throw new Error('API返回错误: '+resp.status);
    const data=await resp.json();
    const content=data.choices?.[0]?.message?.content||'';
    const jsonMatch=content.match(/\{[\s\S]*\}/);
    if(jsonMatch){
      const parsed=JSON.parse(jsonMatch[0]);
      if(parsed.name&&parsed.children)return parsed;
    }
    throw new Error('AI返回格式不正确');
  }catch(e){
    clearTimeout(timeoutId);
    throw e;
  }
}

function localParsePDF(text){
  const lines=text.split('\n').filter(function(l){return l.trim();});
  const root={name:'导入的知识树',children:[]};
  let currentChapter=null;
  let currentSection=null;
  const chapterRe=/^(第[一二三四五六七八九十\d]+[章节篇部]|Chapter\s*\d+|CH\s*\d+|Part\s*\d+|Unit\s*\d+)/i;
  const sectionRe=/^(\d+[\.\-\、\s]\s*|\([一二三四五六七八九十\d]+\)\s*|[一二三四五六七八九十][\、\．\.\s])/;
  lines.forEach(function(line){
    const trimmed=line.trim();
    if(!trimmed||trimmed.length<2)return;
    if(chapterRe.test(trimmed)){
      currentChapter={name:trimmed.substring(0,50),children:[]};
      root.children.push(currentChapter);
      currentSection=null;
    }else if(sectionRe.test(trimmed)&&currentChapter){
      currentSection={name:trimmed.substring(0,50),children:[]};
      currentChapter.children.push(currentSection);
    }else if(currentSection){
      currentSection.children.push({name:trimmed.substring(0,40)});
    }else if(currentChapter){
      currentChapter.children.push({name:trimmed.substring(0,40)});
    }
  });
  if(root.children.length===0){
    root.children.push({name:'自动解析的章节',children:lines.slice(0,30).map(function(l){return {name:l.trim().substring(0,40)};})});
  }
  return root;
}

function mergeKnowledgeTrees(existing,newTree){
  if(!newTree.children)return;
  if(!existing.children)existing.children=[];
  newTree.children.forEach(function(newChild){
    const found=existing.children.find(function(c){return c.name===newChild.name;});
    if(found){
      mergeKnowledgeTrees(found,newChild);
    }else{
      existing.children.push(JSON.parse(JSON.stringify(newChild)));
    }
  });
}

  // 知识点列表

    h+=`<div class="empty-state"><p style="font-size:13px;">还没有知识点，点击"+ 知识点"创建</p><p style="font-size:11px;color:var(--text-muted);">知识点是知识库的中间层，组织下属的知识单元</p></div>`;
    if(!DATA.knowledgePoints.some(p=>p.subjectId===sid)){createDefaultKnowledgePoints(sid);}
  }

  points.filter(p=>!p.parentId).forEach(kp=>{
    const childPts=points.filter(p=>p.parentId===kp.id);
    const kpUnits=units.filter(u=>u.pointId===kp.id);
    const allUnits=[...kpUnits];
    childPts.forEach(cp=>allUnits.push(...units.filter(u=>u.pointId===cp.id)));

    const avgMastery=allUnits.length>0?Math.round(allUnits.reduce((s,u)=>s+(u.mastery||0),0)/allUnits.length):0;

    h+=`<div class="kp-group"><div class="kp-group-header" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
      <span>📌 ${escapeHtml(kp.name)} ${'⭐'.repeat(kp.importance||1)}</span>
      <span style="font-size:.75rem;color:var(--text-muted);">${allUnits.length}单元 · 掌握${avgMastery}%
      <button class="btn btn-sm btn-outline" style="padding:0 4px;font-size:10px;margin-left:4px;" onclick="event.stopPropagation();showKPointForm('${kp.id}')">✏️</button>
      <button class="btn btn-sm btn-outline" style="padding:0 4px;font-size:10px;color:var(--red);" onclick="event.stopPropagation();deleteKPoint('${kp.id}')">×</button>
      <span class="kp-toggle">▼</span></span>
    </div><div class="kp-group-body">`;

    [...kpUnits, ...allUnits.filter(u=>childPts.some(cp=>cp.id===u.pointId))].forEach(u=>{
      const mCls=u.mastery>=80?'mastered':u.mastery>=40?'learning':'weak';
      const mLabel=u.mastery>=80?'已掌握':u.mastery>=40?'学习中':'薄弱';
      const mColor=u.mastery>=80?'var(--green)':u.mastery>=40?'var(--orange-400)':'var(--red)';
      h+=`<div class="ku-card ${mCls}" onclick="toggleKUDetail('${u.id}')">
        <div class="ku-header">
          <span class="ku-title">${escapeHtml(u.title||u.name)}</span>
          <span class="ku-mastery" style="background:${mColor}15;color:${mColor};">${mLabel} ${u.mastery||0}%</span>
        </div>
        <div class="ku-content" id="kuContent_${u.id}">${u.content?escapeHtml(u.content.slice(0,200)):'暂无内容，点击编辑'}</div>
        <div class="ku-actions">
          <button class="btn btn-sm btn-outline" onclick="event.stopPropagation();showKUnitForm('${u.id}')">✏️</button>
          <button class="btn btn-sm btn-outline" onclick="event.stopPropagation();cycleKUMastery('${u.id}')">📈 掌握</button>
          <button class="btn btn-sm btn-outline" style="color:var(--red);" onclick="event.stopPropagation();deleteKUnit('${u.id}')">🗑</button>
          ${kv2Point?'':`<span style="font-size:.7rem;color:var(--text-muted);">${childPts.find(cp=>cp.id===u.pointId)?.name||kp.name}</span>`}
        </div>
      </div>`;
    });

    if(kpUnits.length===0)h+=`<div style="padding:8px;font-size:.78rem;color:var(--text-muted);">暂无知识单元</div>`;
    h+=`</div></div>`;
  });

  h+=`</div></section>`;
  return h;
}

function createDefaultKnowledgePoints(sid){
  const defaults={s1:[{name:'词汇',importance:3},{name:'语法',importance:3},{name:'阅读',importance:3},{name:'写作',importance:2},{name:'翻译',importance:2}],s2:[{name:'马原',importance:2},{name:'毛中特',importance:3},{name:'史纲',importance:2},{name:'思修',importance:1},{name:'时政',importance:3}],s3:[{name:'高数',importance:3},{name:'线代',importance:3},{name:'概率',importance:3}],s4:[{name:'核心概念',importance:3},{name:'重点章节',importance:3},{name:'计算应用',importance:2},{name:'论述分析',importance:2}]};
  (defaults[sid]||[{name:'基础知识',importance:1}]).forEach(d=>{
    DATA.knowledgePoints.push({id:genId(),name:d.name,subjectId:sid,parentId:'',importance:d.importance||1});
  });
  saveData();
}

function showKPointForm(eid){
  const kp=eid?DATA.knowledgePoints.find(x=>x.id===eid):null;
  const sid=kv2Subject||DATA.subjects[0]?.id||'s1';
  let h=`<h3>${kp?'编辑':'新建知识点'}</h3>`;
  h+=`<div class="form-group"><label>名称</label><input id="kpf_name" value="${kp?escapeHtml(kp.name):''}"></div>`;
  h+=`<div class="form-group"><label>重要程度</label><select id="kpf_imp">`;
  [1,2,3,4,5].forEach(i=>h+=`<option value="${i}" ${(kp&&kp.importance===i)?'selected':''}>${'⭐'.repeat(i)}</option>`);
  h+=`</select></div>`;
  h+=`<div class="bar"><button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" onclick="saveKPoint('${eid||''}','${sid}')">保存</button></div>`;
  openModal(h);
}

function saveKPoint(eid,sid){
  const name=document.getElementById('kpf_name')?.value?.trim();
  const imp=parseInt(document.getElementById('kpf_imp')?.value||'1');
  if(!name){showToast('名称不能为空','error');return;}
  if(eid){const kp=DATA.knowledgePoints.find(x=>x.id===eid);if(kp){kp.name=name;kp.importance=imp;}}
  else DATA.knowledgePoints.push({id:genId(),name,subjectId:sid,parentId:'',importance:imp});
  saveData();closeModal();renderAll();
}

function deleteKPoint(id){
  if(!confirm('删除知识点将同时删除其下所有知识单元，确认？'))return;
  DATA.knowledgePoints=DATA.knowledgePoints.filter(x=>x.id!==id);
  DATA.knowledgeUnits=DATA.knowledgeUnits.filter(x=>x.pointId!==id);
  saveData();renderAll();
}

function showKUnitForm(eid){
  const ku=eid?DATA.knowledgeUnits.find(x=>x.id===eid):null;
  const sid=kv2Subject||DATA.subjects[0]?.id||'s1';
  const points=DATA.knowledgePoints.filter(p=>p.subjectId===sid);
  if(points.length===0){showToast('请先创建知识点','error');return;}
  let h=`<h3>${ku?'编辑':'新建知识单元'}</h3>`;
  h+=`<div class="form-group"><label>名称</label><input id="kuf_name" value="${ku?escapeHtml(ku.title||ku.name):''}"></div>`;
  h+=`<div class="form-group"><label>知识点</label><select id="kuf_point">`;
  points.forEach(p=>h+=`<option value="${p.id}" ${(ku&&ku.pointId===p.id)?'selected':''}>${escapeHtml(p.name)}</option>`);
  h+=`</select></div>`;
  h+=`<div class="form-group"><label>内容/笔记</label><textarea id="kuf_content" rows="6">${ku?escapeHtml(ku.content||''):''}</textarea></div>`;
  h+=`<div class="form-group"><label>掌握程度 (0-100)</label><input type="range" id="kuf_mastery" min="0" max="100" value="${ku?ku.mastery||0:0}" style="width:100%;">`;
  h+=`<span style="font-size:.8rem;" id="kuf_mastery_val">${ku?ku.mastery||0:0}%</span></div>`;
  h+=`<div class="form-group"><label>标签（逗号分隔）</label><input id="kuf_tags" value="${ku?(ku.tags||[]).join(','):''}"></div>`;
  h+=`<div class="bar"><button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" onclick="saveKUnit('${eid||''}','${sid}')">保存</button></div>`;
  openModal(h);
  document.getElementById('kuf_mastery').addEventListener('input',function(){
    document.getElementById('kuf_mastery_val').textContent=this.value+'%';
  });
}

function saveKUnit(eid,sid){
  const name=document.getElementById('kuf_name')?.value?.trim();
  const pointId=document.getElementById('kuf_point')?.value;
  const content=document.getElementById('kuf_content')?.value||'';
  const mastery=parseInt(document.getElementById('kuf_mastery')?.value||'0');
  const tags=(document.getElementById('kuf_tags')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!name){showToast('名称不能为空','error');return;}
  const point=DATA.knowledgePoints.find(p=>p.id===pointId);
  if(eid){const ku=DATA.knowledgeUnits.find(x=>x.id===eid);if(ku){ku.title=name;ku.content=content;ku.pointId=pointId;ku.pointName=point?.name||'';ku.mastery=mastery;ku.tags=tags;ku.updatedAt=todayStr();}}
  else DATA.knowledgeUnits.push({id:genId(),title:name,name:name,content,pointId,pointName:point?.name||'',subjectId:sid,mastery,tags,createdAt:todayStr(),updatedAt:todayStr()});
  saveData();closeModal();renderAll();
}

function cycleKUMastery(id){
  const ku=DATA.knowledgeUnits.find(x=>x.id===id);
  if(!ku)return;
  const levels=[0,30,60,85,100];
  const idx=levels.indexOf(ku.mastery||0);
  ku.mastery=levels[(idx+1)%levels.length];
  ku.updatedAt=todayStr();
  saveData();renderAll();
}

function toggleKUDetail(id){
  const el=document.getElementById('kuContent_'+id);
  if(!el)return;
  const ku=DATA.knowledgeUnits.find(x=>x.id===id);
  if(!ku)return;
  const expanded=el.style.webkitLineClamp==='unset';
  if(expanded){el.style.webkitLineClamp='3';el.style.display='-webkit-box';el.textContent=ku.content?ku.content.slice(0,200):'暂无内容';}
  else{el.style.webkitLineClamp='unset';el.style.display='block';el.textContent=ku.content||'暂无内容';}
}

function deleteKUnit(id){
  if(!confirm('删除知识单元？'))return;
  DATA.knowledgeUnits=DATA.knowledgeUnits.filter(x=>x.id!==id);
  saveData();renderAll();
}

function renderAiMessage(m){
  const isUser=m.role==='user';
  let content=m.content;
  if(!isUser){
    content=content
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/^### (.+)$/gm,'<h4>$1</h4>')
      .replace(/^## (.+)$/gm,'<h3>$1</h3>')
      .replace(/^# (.+)$/gm,'<h2>$1</h2>')
      .replace(/^- (.+)$/gm,'<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>')
      .replace(/\n\n/g,'<br><br>')
      .replace(/\n/g,'<br>');
  }else{content=escapeHtml(content);}
  return `<div class="ai-msg ${isUser?'user':'bot'}"><div class="ai-msg-avatar">${isUser?'我':'AI'}</div><div class="ai-msg-body"><div class="ai-msg-content">${content}</div><div class="ai-msg-time">${m.time||''}</div></div></div>`;
}

function saveAiConfig(){
  DATA.aiConfig.apiEndpoint=document.getElementById('aiEndpoint')?.value?.trim()||'https://api.openai.com/v1';
  DATA.aiConfig.apiKey=document.getElementById('aiKey')?.value?.trim()||'';
  DATA.aiConfig.model=document.getElementById('aiModel')?.value?.trim()||'gpt-4o-mini';
  DATA.aiConfig.enabled=!!DATA.aiConfig.apiKey;
  saveData();showToast(DATA.aiConfig.enabled?'AI 配置已保存！':'API Key 为空，请填入 Key 后使用');
  document.querySelector('.ai-config-section')?.removeAttribute('open');
}

function addAiMessage(role,content){
  const msg={role,content,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})};
  DATA.aiChatHistory.push(msg);
  if(DATA.aiChatHistory.length>100)DATA.aiChatHistory=DATA.aiChatHistory.slice(-100);
  aiMessages=DATA.aiChatHistory;
  saveData();
}

async function sendAiMessage(){
  const input=document.getElementById('aiInput');
  if(!input)return;
  const text=input.value.trim();
  if(!text)return;
  if(!DATA.aiConfig.apiKey){showToast('请先配置 AI API Key','error');return;}

  addAiMessage('user',text);
  input.value='';
  renderAll();setTimeout(()=>scrollToSection('ai'),100);
  const loading=document.getElementById('aiLoading');
  const btn=document.getElementById('aiSendBtn');
  if(loading)loading.style.display='flex';
  if(btn)btn.disabled=true;

  try{
    const systemPrompt='你是"所愿必橙"考研学习系统的 AI 助手。你的角色是帮助考研学生高效学习。请用 Markdown 格式回答，语言简洁有力，鼓励学生。';
    const res=await fetch(DATA.aiConfig.apiEndpoint.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+DATA.aiConfig.apiKey},
      body:JSON.stringify({model:DATA.aiConfig.model,store:true,messages:[{role:'system',content:systemPrompt},...DATA.aiChatHistory.slice(-20).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}))]})
    });
    if(!res.ok){const err=await res.text();throw new Error('API错误('+res.status+'): '+err.slice(0,200));}
    const json=await res.json();
    const reply=json.choices[0]?.message?.content||json.choices?.[0]?.text||'';
    if(!reply)throw new Error('未收到AI回复');
    addAiMessage('assistant',reply);
  }catch(err){
    addAiMessage('assistant','❌ 请求失败: '+(err instanceof Error?err.message:String(err)));
  }
  renderAll();setTimeout(()=>scrollToSection('ai'),100);
}

async function aiQuickAction(action){
  if(!DATA.aiConfig.apiKey){showToast('请先配置 AI API Key','error');return;}
  let prompt='',systemExtra='';

  if(action==='analyze-wrong'){
    if(DATA.wrongQuestions.length===0){showToast('暂无错题记录','error');return;}
    const wq=DATA.wrongQuestions[DATA.wrongQuestions.length-1];
    const subj=DATA.subjects.find(s=>s.id===wq.subjectId);
    prompt=`请分析以下错题：\n科目：${subj?.name||'未知'}\n题目：${wq.question}\n答案：${wq.answer||'未填写'}\n错误标签：${wq.errorTag||'无'}\n已复习：${wq.reviewCount||0}次\n\n请给出：1.错误原因分析 2.知识点梳理 3.解题技巧 4.同类题型提醒`;
    systemExtra='你是考研辅导专家。请深度分析错题。';
  }else if(action==='generate-questions'){
    const units=DATA.knowledgeUnits||[];
    if(units.length===0){showToast('暂无知识单元，请先在知识库中添加','error');return;}
    const ku=units[units.length-1];
    prompt=`请根据以下知识单元生成3道练习题（含答案和解析）：\n知识单元：${ku.title||ku.name}\n内容：${ku.content||'无'}\n要求：题目有代表性，适合考研风格`;
    systemExtra='你是考研出题专家。请生成高质量练习题。';
  }else if(action==='study-suggestion'){
    const tf=getTodayFocusMin();const wf=getWeekFocusMin();
    const tasks=DATA.dailyPlans.filter(p=>p.date===todayStr());
    const done=tasks.filter(p=>p.done).length;
    const wrongCount=DATA.wrongQuestions.length;
    prompt=`请根据以下学习数据给出个性化备考建议：\n考试日期：${DATA.examDate}\n今日专注：${fmtMin(tf)}\n本周累计：${fmtMin(wf)}\n今日任务完成：${done}/${tasks.length}\n错题总数：${wrongCount}\n连续打卡：${DATA.streak||0}天\n\n请给出具体可执行的改进方案。`;
    systemExtra='你是考研规划顾问。请给出鼓励为主的建议。';
  }else if(action==='daily-plan'){
    prompt=`请根据以下信息为我生成今天的学习计划：\n考试日期：${DATA.examDate}\n科目：${DATA.subjects.map(s=>s.name+'目标'+s.targetScore+'分').join('、')}\n\n请给出3-5个具体任务，每个包含：任务名称、预计用时、优先级。`;
    systemExtra='你是考研学习规划师。请给出具体可执行的任务。';
  }

  addAiMessage('user',prompt.slice(0,100)+'…');
  renderAll();setTimeout(()=>scrollToSection('ai'),100);
  const loading=document.getElementById('aiLoading');
  if(loading)loading.style.display='flex';

  try{
    const systemPrompt='你是"所愿必橙"考研学习系统的 AI 助手。'+systemExtra;
    const res=await fetch(DATA.aiConfig.apiEndpoint.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+DATA.aiConfig.apiKey},
      body:JSON.stringify({model:DATA.aiConfig.model,messages:[{role:'system',content:systemPrompt},{role:'user',content:prompt}]})
    });
    if(!res.ok){const err=await res.text();throw new Error('API错误('+res.status+'): '+err.slice(0,200));}
    const json=await res.json();
    const reply=json.choices[0]?.message?.content||json.choices?.[0]?.text||'';
    addAiMessage('assistant',reply||'未收到回复');
  }catch(err){
    addAiMessage('assistant','❌ '+ (err instanceof Error?err.message:String(err)));
  }
  renderAll();setTimeout(()=>scrollToSection('ai'),100);
}

  }else{
    entries.forEach(e=>{
      const moods={happy:'😊',neutral:'😐',tired:'😫',motivated:'💪',satisfied:'🥳',anxious:'😰'};
      h+=`<div class="diary-card" onclick="showDiaryForm('${e.id}')">`;
      h+=`<div class="diary-card-header"><span class="diary-card-date">📅 ${e.date}</span><span class="diary-card-mood">${moods[e.mood]||'📝'}</span></div>`;
      h+=`<div class="diary-card-content">${escapeHtml(e.content||'').slice(0,200)}</div>`;
      if(e.tags&&e.tags.length>0){
        h+=`<div class="diary-card-tags">${e.tags.map(t=>`<span class="diary-tag">#${escapeHtml(t)}</span>`).join('')}</div>`;
      }
      h+=`</div>`;
    });
  }
  h+=`</div>`;

  // 迷你日历
  h+=`<div class="diary-calendar"><div class="card"><div class="card-header"><span class="card-title">📅 学习日历</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;margin-bottom:8px;">`;
  h+=`<button class="btn btn-sm btn-outline" onclick="diaryViewMonth=shiftMonth(diaryViewMonth,-1);renderAll();setTimeout(()=>scrollToSection('diary'),100);">◀</button>`;
  h+=`<span style="font-weight:700;font-size:.85rem;">${diaryViewMonth}</span>`;
  h+=`<button class="btn btn-sm btn-outline" onclick="diaryViewMonth=shiftMonth(diaryViewMonth,1);renderAll();setTimeout(()=>scrollToSection('diary'),100);">▶</button></div>`;
  h+=renderMiniCalendar(diaryViewMonth,entries);
  h+=`</div></div></div></div></section>`;
  return h;
}

function renderMiniCalendar(month,entries){
  const diaryDates=new Set(entries.map(e=>e.date));
  const today=todayStr();
  let h=`<div class="calendar-mini">`;
  ['日','一','二','三','四','五','六'].forEach(d=>h+=`<div class="cal-day-header">${d}</div>`);
  const [y,m]=month.split('-').map(Number);
  const firstDay=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();

  for(let i=0;i<firstDay;i++)h+=`<div class="cal-day"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls=['cal-day'];
    if(ds===today)cls.push('today');
    if(diaryDates.has(ds))cls.push('has-diary');
    h+=`<div class="${cls.join(' ')}" onclick="diaryDateFilter='${ds}';renderAll();setTimeout(()=>scrollToSection('diary'),100);" title="${diaryDates.has(ds)?'有日记':'无记录'}">${d}</div>`;
  }
  h+=`</div>`;
  return h;
}

function shiftMonth(ym,delta){
  const [y,m]=ym.split('-').map(Number);
  const d=new Date(y,m-1+delta,1);
  return d.toISOString().slice(0,7);
}

let diaryDateFilter='';

function showDiaryForm(eid){

  const moods=[{v:'happy',l:'😊 开心'},{v:'motivated',l:'💪 充满动力'},{v:'satisfied',l:'🥳 满足'},{v:'neutral',l:'😐 平静'},{v:'tired',l:'😫 疲惫'},{v:'anxious',l:'😰 焦虑'}];

function saveDiary(eid){
  const date=document.getElementById('df_date')?.value||todayStr();
  const mood=document.getElementById('df_mood')?.value||'neutral';
  const content=document.getElementById('df_content')?.value||'';
  const tags=(document.getElementById('df_tags')?.value||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!content.trim()){showToast('内容不能为空','error');return;}
  if(eid){const e=DATA.diaryEntries.find(x=>x.id===eid);if(e){e.date=date;e.mood=mood;e.content=content;e.tags=tags;}}
  else DATA.diaryEntries.push({id:genId(),date,mood,content,tags,createdAt:new Date().toISOString()});

}

function deleteDiary(id){
  if(!confirm('删除这篇日记？'))return;
  DATA.diaryEntries=DATA.diaryEntries.filter(x=>x.id!==id);
  saveData();renderAll();
}

// ==================== EXAMS ====================
let examSubjectFilter='';
let examTypeFilter='';

function refreshExams(){
  const section=document.getElementById('exams');
  if(section){section.outerHTML=renderExams();}
}

function renderExams(){
  let h=`<section class="section" id="exams">`;

  // ---- Subject Summary Cards ----
  h+=`<div class="exam-summary-grid">`;
  DATA.subjects.forEach(function(s){
    const exams=DATA.mockExams.filter(function(e){return e.subjectId===s.id;});
    const sorted=[...exams].sort(function(a,b){return b.date.localeCompare(a.date);});
    const latest=sorted[0];
    const sum=exams.reduce(function(a,e){return a+calcPct(e.score||0,e.total||100);},0);
    const avgRate=exams.length>0?Math.round(sum/exams.length):0;
    const targetScore=s.targetScore||0;
    const total=latest?latest.total||100:100;
    const latestScore=latest?latest.score||0:0;
    const gap=latestScore-targetScore;

    let suggestion='';
    if(exams.length>=2){
      const recent=exams.slice(0,2);
      const allAbove=recent.every(function(x){
        return calcPct(x.score||0,x.total||100)>=(targetScore/total*100)+5;
      });
      const allBelow=recent.every(function(x){
        return calcPct(x.score||0,x.total||100)<=(targetScore/total*100)-10;
      });
      if(allAbove)suggestion='<div style="font-size:10px;color:var(--green);margin-top:2px;">💡 可考虑提高目标分</div>';
      if(allBelow)suggestion='<div style="font-size:10px;color:var(--red);margin-top:2px;">⚠️ 需加强复习</div>';
    }

    const cardColor=s.color||'blue';
    const isActive=examSubjectFilter===s.id;
    h+=`<div class="exam-summary-card${isActive?' active':''}" onclick="examSubjectFilter=examSubjectFilter==='${s.id}'?'':'${s.id}';refreshExams();" style="cursor:pointer;border-left:3px solid var(--${cardColor});">`;
    h+=`<div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;">${escapeHtml(s.name)}</div>`;
    h+=`<div style="font-size:22px;font-weight:700;color:var(--text);">${latest?latestScore+'<span style="font-size:14px;color:var(--text-muted);">/'+total+'</span>':'--/--'}</div>`;
    h+=`<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">最近模考 · 均分率 <b style="color:${avgRate>=80?'var(--green)':avgRate>=60?'var(--orange-500)':'var(--red)'};">${avgRate}%</b></div>`;
    if(targetScore>0&&latest){
      if(gap>=0)h+=`<div style="font-size:11px;color:var(--green);margin-top:3px;">✅ 已超${gap}分</div>`;
      else h+=`<div style="font-size:11px;color:var(--red);margin-top:3px;">🎯 目标${targetScore}，差${Math.abs(gap)}分</div>`;
    }
    h+=suggestion;
    h+=`</div>`;
  });
  h+=`</div>`;

  // ---- Filter Bar + Table Card ----
  h+=`<div class="card"><div class="card-header"><span class="card-title">📝 模考成绩</span><span style="display:flex;gap:6px;flex-wrap:wrap;">`;
  h+=`<button class="btn btn-primary btn-sm" onclick="showExamForm()">+ 录入成绩</button>`;
  h+=`</span></div>`;

  // Subject filter row
  h+=`<div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;">`;
  h+=`<button class="btn btn-sm ${!examSubjectFilter?'btn-primary':'btn-outline'}" onclick="examSubjectFilter='';refreshExams();">全部科目</button>`;
  DATA.subjects.forEach(function(s){
    h+=`<button class="btn btn-sm ${examSubjectFilter===s.id?'btn-primary':'btn-outline'}" onclick="examSubjectFilter='${s.id}';refreshExams();">${escapeHtml(s.name)}</button>`;
  });
  h+=`</div>`;

  // Type filter row
  h+=`<div style="margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;">`;
  h+=`<button class="btn btn-sm ${!examTypeFilter?'btn-primary':'btn-outline'}" onclick="examTypeFilter='';refreshExams();">全部类型</button>`;
  ['真题','模拟卷','章节测验'].forEach(function(t){
    h+=`<button class="btn btn-sm ${examTypeFilter===t?'btn-primary':'btn-outline'}" onclick="examTypeFilter='${t}';refreshExams();">${t}</button>`;
  });
  h+=`</div>`;

  // Filter exams
  let exams=[...DATA.mockExams];
  if(examSubjectFilter)exams=exams.filter(function(e){return e.subjectId===examSubjectFilter;});
  if(examTypeFilter)exams=exams.filter(function(e){return (e.type||'模拟卷')===examTypeFilter;});
  exams.sort(function(a,b){return b.date.localeCompare(a.date);});

  if(exams.length===0){
    h+=`<div class="empty-state"><div class="empty-icon">📝</div><p>暂无符合条件的模考记录</p></div>`;
  }else{
    h+=`<div style="overflow-x:auto;"><table><thead><tr><th>日期</th><th>类型</th><th>科目</th><th>成绩</th><th>满分</th><th>得分率</th><th>目标</th><th>差距</th><th>趋势</th><th></th></tr></thead><tbody>`;
    exams.forEach(function(e){
      const subj=DATA.subjects.find(function(s){return s.id===e.subjectId;});
      const rate=calcPct(e.score||0,e.total||100);
      const gap=(e.score||0)-(subj?.targetScore||0);
      const targetScore=subj?.targetScore||0;
      const total=e.total||100;
      const targetRate=total>0?Math.round(targetScore/total*100):0;
      const belowTarget=targetScore>0&&rate<targetRate;

      const progress=renderExamProgress(e);

      const examType=e.type||'模拟卷';
      const typeColors={真题:'blue',模拟卷:'orange',章节测验:'purple'};
      const typeColor=typeColors[examType]||'gray';

      const rowStyle=belowTarget?'background:var(--red-bg);':'';

      h+=`<tr style="${rowStyle}">`;
      h+=`<td>${e.date}</td>`;
      h+=`<td><span class="tag ${typeColor}">${examType}</span></td>`;
      h+=`<td><span class="tag ${subjTagClass(e.subjectId)}">${subjName(e.subjectId)}</span></td>`;
      h+=`<td style="font-weight:700;font-size:15px;">${e.score||0}</td>`;
      h+=`<td>${total}</td>`;
      h+=`<td><span class="tag ${rate>=80?'green':rate>=60?'orange':'red'}">${rate}%</span></td>`;
      h+=`<td style="font-size:12px;color:var(--text-muted);">${targetScore||'--'}</td>`;
      h+=`<td style="color:${gap>=0?'var(--green)':'var(--red)'};font-weight:600;">${gap>=0?'+'+gap:gap}</td>`;
      h+=`<td style="font-size:13px;">${progress}</td>`;
      h+=`<td style="white-space:nowrap;">`;
      h+=`<button class="btn btn-sm btn-outline" style="padding:2px 6px;font-size:10px;" onclick="showErrorForm('','${e.subjectId}')" title="添加错题">➕错题</button>`;
      h+=`<button class="btn btn-sm btn-outline" style="padding:2px 6px;font-size:10px;" onclick="showExamForm('${e.id}')">✏️</button>`;
      h+=`<button class="btn btn-sm btn-outline" style="color:var(--red);border-color:var(--red);padding:2px 6px;font-size:10px;" onclick="deleteExam('${e.id}')">🗑</button>`;
      h+=`</td></tr>`;
    });
    h+=`</tbody></table></div>`;
  }
  h+=`</div>`;

  // ---- Trend Chart ----
  if(DATA.mockExams.length>0){
    h+=`<div class="card" style="margin-top:20px;"><div class="card-header">`;
    h+=`<span class="card-title">📈 成绩趋势</span>`;
    h+=`<div style="display:flex;gap:6px;align-items:center;">`;
    h+=`<button class="btn btn-sm ${examTrendRange==='all'?'btn-primary':'btn-outline'}" onclick="examTrendRange='all';refreshExams();">全部</button>`;
    h+=`<button class="btn btn-sm ${examTrendRange==='week'?'btn-primary':'btn-outline'}" onclick="examTrendRange='week';refreshExams();">本周</button>`;
    h+=`<button class="btn btn-sm ${examTrendRange==='month'?'btn-primary':'btn-outline'}" onclick="examTrendRange='month';refreshExams();">本月</button>`;
    h+=`<label style="display:flex;align-items:center;gap:3px;font-size:11px;cursor:pointer;margin-left:6px;color:var(--text-secondary);user-select:none;">`;
    h+=`<input type="checkbox" ${examCompareMode?'checked':''} onchange="examCompareMode=this.checked;refreshExams();" style="width:13px;height:13px;cursor:pointer;">对比上周期</label>`;
    h+=`</div></div>`;
    h+=`<div class="chart-wrap"><canvas id="examTrendChart" height="260"></canvas></div></div>`;
  }

  h+=`</section>`;

  if(DATA.mockExams.length>0){
    setTimeout(function(){initExamChart();},200);
  }

  return h;
}

function renderExamProgress(e){
  const sameSubj=DATA.mockExams.filter(function(x){
    return x.subjectId===e.subjectId&&x.date<e.date;
  }).sort(function(a,b){return b.date.localeCompare(a.date);});
  if(sameSubj.length===0)return'';
  const prev=sameSubj[0];
  const prevRate=calcPct(prev.score||0,prev.total||100);
  const curRate=calcPct(e.score||0,e.total||100);
  const diff=curRate-prevRate;
  if(diff>0)return`<span style="color:var(--green);font-weight:600;">↑${diff}%</span>`;
  if(diff<0)return`<span style="color:var(--red);font-weight:600;">↓${Math.abs(diff)}%</span>`;
  return`<span style="color:var(--text-muted);">→0</span>`;
}

function initExamChart(){
  const canvas=document.getElementById('examTrendChart');
  if(!canvas)return;
  if(window._examChart)window._examChart.destroy();

  let allExams=[...DATA.mockExams].sort(function(a,b){return a.date.localeCompare(b.date);});
  if(allExams.length===0)return;

  const now=new Date();const t=todayStr();
  let rangeStart='';
  if(examTrendRange==='week'){
    const d=new Date(now);d.setDate(d.getDate()-d.getDay()+1);rangeStart=d.toISOString().slice(0,10);
  }else if(examTrendRange==='month'){
    rangeStart=t.slice(0,7)+'-01';
  }
  let sorted=allExams;let prevSorted=[];
  if(rangeStart){sorted=allExams.filter(function(e){return e.date>=rangeStart;});}

  if(examCompareMode&&rangeStart){
    if(examTrendRange==='week'){
      const prevStart=shiftDate(rangeStart,-7);
      const prevEnd=shiftDate(rangeStart,-1);
      prevSorted=allExams.filter(function(e){return e.date>=prevStart&&e.date<=prevEnd;});
    }else if(examTrendRange==='month'){
      const m=rangeStart.slice(0,7);
      const prevM=shiftDate(m+'-01',-1).slice(0,7);
      prevSorted=allExams.filter(function(e){return e.date>=prevM+'-01'&&e.date<rangeStart;});
    }
  }

  const allDates=[...new Set(sorted.map(function(e){return e.date;}))].sort();
  const colors={blue:'#3b82f6',orange:'#f97316',purple:'#a855f7',green:'#22c55e'};
  const lightColors={blue:'rgba(59,130,246,.3)',orange:'rgba(249,115,22,.3)',purple:'rgba(168,85,247,.3)',green:'rgba(34,197,94,.3)'};
  const datasets=[];

  DATA.subjects.forEach(function(s){
    const pts=sorted.filter(function(e){return e.subjectId===s.id;});
    if(pts.length<2)return;

    const color=colors[s.color]||'#f97316';
    const lightColor=lightColors[s.color]||'rgba(249,115,22,.3)';

    const data=allDates.map(function(d){
      const match=pts.find(function(e){return e.date===d;});
      return match?calcPct(match.score||0,match.total||100):null;
    });

    datasets.push({
      label:s.name,
      data:data,
      borderColor:color,
      backgroundColor:color,
      tension:0.4,
      pointRadius:5,
      pointHoverRadius:7,
      spanGaps:false,
      order:2
    });

    const smaData=data.map(function(v,i){
      if(v===null)return null;
      var windowVals=[];
      for(var j=Math.max(0,i-2);j<=i;j++){
        if(data[j]!==null)windowVals.push(data[j]);
      }
      if(windowVals.length<2)return null;
      return Math.round(windowVals.reduce(function(a,b){return a+b;},0)/windowVals.length);
    });
    datasets.push({
      label:s.name+' 3次均线',
      data:smaData,
      borderColor:lightColor,
      backgroundColor:'transparent',
      borderDash:[5,4],
      borderWidth:1.5,
      tension:0.4,
      pointRadius:0,
      spanGaps:true,
      order:1
    });

    const targetScore=s.targetScore||0;
    if(targetScore>0){
      const subjTotal=pts[0]?.total||100;
      const targetRateVal=subjTotal>0?Math.round(targetScore/subjTotal*100):targetScore;
      datasets.push({
        label:s.name+' 目标',
        data:allDates.map(function(){return targetRateVal;}),
        borderColor:color,
        backgroundColor:'transparent',
        borderDash:[8,4],
        borderWidth:1,
        pointRadius:0,
        spanGaps:true,
        order:0
      });
    }
  });

  // Previous period comparison
  if(examCompareMode&&prevSorted.length>0){
    const prevDates=[...new Set(prevSorted.map(function(e){return e.date;}))].sort();
    DATA.subjects.forEach(function(s){
      const pts=prevSorted.filter(function(e){return e.subjectId===s.id;});
      if(pts.length===0)return;
      const color=colors[s.color]||'#f97316';
      const data=prevDates.map(function(d){
        const match=pts.find(function(e){return e.date===d;});
        return match?calcPct(match.score||0,match.total||100):null;
      });
      datasets.push({
        label:s.name+' 上期',
        data:data,
        borderColor:color,
        backgroundColor:'transparent',
        borderDash:[3,3],
        tension:0.4,
        borderWidth:1.5,
        pointRadius:4,
        spanGaps:false,
        order:3
      });
    });
  }

  if(datasets.length===0)return;

  window._examChart=new Chart(canvas,{
    type:'line',
    data:{labels:allDates,datasets:datasets},
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{
          position:'bottom',
          labels:{boxWidth:12,font:{size:10},padding:14,usePointStyle:true,
            filter:function(item){
              return !item.text.includes('均线')&&!item.text.includes('目标');
            }
          }
        },
        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+ctx.parsed.y+'%';}}}
      },
      scales:{
        y:{min:0,max:100,ticks:{callback:function(v){return v+'%';},stepSize:10},
          grid:{color:'rgba(0,0,0,.06)'}}
      }
    }
  });
}

function showExamForm(eid){
  const e=eid?DATA.mockExams.find(function(x){return x.id===eid;}):null;
  const examType=e?e.type||'模拟卷':'模拟卷';
  let h=`<h3>${e?'编辑':'录入模考成绩'}</h3>`;
  h+=`<div class="form-group"><label>日期</label><input type="date" id="exf_d" value="${e?e.date:todayStr()}"></div>`;
  h+=`<div class="form-group"><label>科目</label><select id="exf_s">`;DATA.subjects.forEach(function(s){h+=`<option value="${s.id}" ${(e&&e.subjectId===s.id)?'selected':''}>${escapeHtml(s.name)}</option>`;});h+=`</select></div>`;
  h+=`<div class="form-group"><label>类型</label><select id="exf_tp"><option value="模拟卷" ${examType==='模拟卷'?'selected':''}>模拟卷</option><option value="真题" ${examType==='真题'?'selected':''}>真题</option><option value="章节测验" ${examType==='章节测验'?'selected':''}>章节测验</option></select></div>`;
  h+=`<div class="form-group"><label>得分/满分</label><div style="display:flex;gap:8px;"><input type="number" id="exf_sc" value="${e?e.score||0:0}" step="0.5" placeholder="得分"><span>/</span><input type="number" id="exf_to" value="${e?e.total||100:100}" placeholder="满分"></div></div>`;
  h+=`<div class="form-group"><label>备注</label><textarea id="exf_nt" placeholder="错题原因、考试感受等">${escapeHtml(e?e.notes||'':'')}</textarea></div>`;
  h+=`<div class="bar"><button class="btn btn-outline btn-sm" onclick="closeModal()">取消</button><button class="btn btn-primary btn-sm" onclick="saveExam('${eid||''}')">保存</button></div>`;
  openModal(h);
}

function saveExam(eid){
  const d={
    date:document.getElementById('exf_d')?.value||todayStr(),
    subjectId:document.getElementById('exf_s')?.value||DATA.subjects[0]?.id||'',
    type:document.getElementById('exf_tp')?.value||'模拟卷',
    score:parseFloat(document.getElementById('exf_sc')?.value||'0'),
    total:parseInt(document.getElementById('exf_to')?.value||'100'),
    notes:document.getElementById('exf_nt')?.value||''
  };
  if(eid){const e=DATA.mockExams.find(function(x){return x.id===eid;});if(e)Object.assign(e,d);}
  else DATA.mockExams.push({id:genId(),...d});
  saveData();closeModal();refreshExams();
}

let errorFilter='',errorReviewFilter=false,errorBatchMode=false;
let errorStatsView=false;
let tempFilesQuestion=[],tempFilesAnswer=[];
let examTrendRange='all'; // 'all'|'week'|'month'
let examCompareMode=false;

function refreshErrors(){
  const section=document.getElementById('errors');
  if(section){section.outerHTML=renderErrors();}
  setTimeout(function(){loadAttachmentsForDisplay();},100);
}

function loadAttachmentsForDisplay(){
  var containers=document.querySelectorAll('.att-display');
  containers.forEach(function(container){
    var errorId=container.getAttribute('data-error-id');
    var field=container.getAttribute('data-field');
    if(!errorId||!field)return;
    AttachmentDB.load(errorId,field).then(function(items){
      if(!items||items.length===0)return;
      var h='';
      items.forEach(function(item){
        if(item.type&&item.type.startsWith('image/')){
          var url=URL.createObjectURL(item.blob);
          h+='<span class="att-display-item"><img src="'+escapeHtml(url)+'" alt="'+escapeHtml(item.name)+'" data-obj-url="'+escapeHtml(url)+'" title="'+escapeHtml(item.name)+'"></span>';
        }else{
          var url=URL.createObjectURL(item.blob);
          var name=(item.name||'file');
          var dn=name.length>15?name.substring(0,15)+'...':name;
          h+='<a class="att-display-link" href="'+escapeHtml(url)+'" download="'+escapeHtml(name)+'" data-obj-url="'+escapeHtml(url)+'">📄 '+escapeHtml(dn)+'</a>';
        }
      });
      container.innerHTML=h;
    }).catch(function(){});
  });
}

function renderErrors(){
  let h=`<section class="section" id="errors">`;
  h+=`<div class="card"><div class="card-header"><span class="card-title">❌ 错题本</span><span style="display:flex;gap:6px;flex-wrap:wrap;">`;
  h+=`<button class="btn btn-primary btn-sm" onclick="showErrorForm()">+ 添加错题</button>`;
  h+=`<button class="btn btn-sm btn-outline" onclick="toggleErrorStats()">📊 统计视图</button>`;
  h+=`<button class="btn btn-sm btn-outline" onclick="toggleErrorBatchMode()">${errorBatchMode?'❌ 取消选择':'☑️ 批量选择'}</button>`;
  h+=`<button class="btn btn-sm btn-outline" onclick="printErrors()">🖨️ 打印/导出</button>`;
  h+=`</span></div>`;

  // Review reminder
  const today=todayStr();
  const overdueCount=DATA.wrongQuestions.filter(function(e){return e.nextReviewDate&&e.nextReviewDate<=today;}).length;
  if(overdueCount>0&&!errorReviewFilter){
    h+=`<div class="warn-banner" onclick="errorReviewFilter=true;refreshErrors();">📅 今天有 ${overdueCount} 道错题需要复习（点击筛选）</div>`;
  }
  if(errorReviewFilter){
    h+=`<div class="warn-banner" onclick="errorReviewFilter=false;refreshErrors();">📅 正在显示待复习错题 · 共 ${overdueCount} 道（点击取消筛选）</div>`;
  }

  // Statistics view
  if(errorStatsView){
    h+=renderErrorStats();
  }else{
    // Filter buttons
    h+=`<div style="margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;">`;
    h+=`<button class="btn btn-sm ${!errorFilter?'btn-primary':'btn-outline'}" onclick="errorFilter='';refreshErrors();">全部</button>`;
    DATA.subjects.forEach(function(s){
      h+=`<button class="btn btn-sm ${errorFilter===s.id?'btn-primary':'btn-outline'}" onclick="errorFilter='${s.id}';refreshErrors();">${escapeHtml(s.name)}</button>`;
    });
    h+=`</div>`;

    let errs=DATA.wrongQuestions;
    if(errorFilter)errs=errs.filter(function(e){return e.subjectId===errorFilter;});
    if(errorReviewFilter)errs=errs.filter(function(e){return e.nextReviewDate&&e.nextReviewDate<=today;});
    errs=[...errs].sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'');});

    if(errs.length===0)h+=`<div class="empty-state"><p>暂无错题</p></div>`;
    else {
      // Batch mode: select all checkbox
      if(errorBatchMode){
        h+=`<div style="margin-bottom:8px;"><label style="font-size:12px;cursor:pointer;"><input type="checkbox" class="error-checkbox" onchange="toggleSelectAllErrors(this)"> 全选</label></div>`;
      }
      errs.forEach(function(e){
        const isOverdue=e.nextReviewDate&&e.nextReviewDate<=today;
        h+=`<div class="error-card ${(e.reviewCount||0)>0?'reviewed':''}${isOverdue?' overdue':''}" id="ecard-${e.id}">`;
        h+=`<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">`;
        if(errorBatchMode)h+=`<input type="checkbox" class="error-checkbox" data-eid="${e.id}" onchange="updateBatchCount()">`;
        h+=`<span class="tag ${subjTagClass(e.subjectId)}">${subjName(e.subjectId)}</span>`;
        if(e.knowledgeTag)h+=`<span class="tag purple">${escapeHtml(e.knowledgeTag)}</span>`;
        h+=renderErrorTag(e);
        h+=`</div><span style="font-size:11px;color:var(--text-muted);">复习${e.reviewCount||0}次 · ${e.nextReviewDate||'--'}</span></div>`;
        h+=`<div style="font-weight:600;margin-bottom:4px;">📝 ${escapeHtml(e.question||'')}</div>`;
        if(e.questionAttachments&&e.questionAttachments.length>0)h+=`<div class="att-section">📎 题目附件 (${e.questionAttachments.length})</div><div class="att-display" data-error-id="${e.id}" data-field="question"></div>`;
        if(e.answer)h+=`<div style="font-size:12px;color:var(--green);">✅ ${escapeHtml(e.answer)}</div>`;
        if(e.answerAttachments&&e.answerAttachments.length>0)h+=`<div class="att-section">📎 答案附件 (${e.answerAttachments.length})</div><div class="att-display" data-error-id="${e.id}" data-field="answer"></div>`;
        h+=`<div style="margin-top:8px;display:flex;gap:6px;"><button class="btn btn-sm btn-outline" onclick="reviewError('${e.id}')">🔄 复习</button><button class="btn btn-sm btn-outline" onclick="showErrorRecommendations('${e.id}')">📚 同类推荐</button><button class="btn btn-sm btn-outline" onclick="showErrorForm('${e.id}')">✏️</button><button class="btn btn-sm btn-outline" style="color:var(--red);border-color:var(--red);" onclick="deleteError('${e.id}')">🗑</button></div></div>`;
      });
    }

    // Batch action bar
    if(errorBatchMode){
      h+=`<div class="batch-bar" id="batchBar"><span class="selected-count" id="batchCount">已选 0 项</span>`;
      h+=`<button class="btn btn-sm btn-outline" style="color:var(--red);border-color:var(--red);" onclick="batchDeleteErrors()">批量删除</button>`;
      h+=`<select id="batchRetag" class="btn btn-sm btn-outline" style="padding:4px 8px;" onchange="batchRetagErrors(this.value);this.value='';"><option value="">批量修改标签</option><option value="概念不清">概念不清</option><option value="计算失误">计算失误</option><option value="审题错误">审题错误</option><option value="知识点遗忘">知识点遗忘</option><option value="其他">其他</option></select>`;
      h+=`</div>`;
    }
  }
  h+=`</div></section>`;
  return h;
}

function renderErrorTag(e){
  if(!e.errorTag)return'';
  const map={概念不清:'concept',计算失误:'calc',审题错误:'read',知识点遗忘:'forget',其他:'other'};
  const cls=map[e.errorTag]||'other';
  const label=e.errorTag==='其他'&&e.errorTagCustom?e.errorTagCustom:e.errorTag;
  return` <span class="error-tag ${cls}">${escapeHtml(label)}</span>`;
}

function renderErrorStats(){
  let h=`<div class="stats-grid">`;
  h+=`<div class="stat-cell"><h4 style="font-size:13px;margin-bottom:10px;">📊 按科目分布</h4><div class="chart-wrap chart-half"><canvas id="errPieChart"></canvas></div></div>`;
  h+=`<div class="stat-cell"><h4 style="font-size:13px;margin-bottom:10px;">📊 按错误原因</h4><div class="chart-wrap"><canvas id="errBarChart"></canvas></div></div>`;
  h+=`</div>`;
  const tagCount={};
  DATA.wrongQuestions.forEach(function(e){
    if(e.knowledgeTag){tagCount[e.knowledgeTag]=(tagCount[e.knowledgeTag]||0)+1;}
  });

function toggleSelectAllErrors(checkbox){

  updateBatchCount();
}

function updateBatchCount(){

}

function getSelectedErrorIds(){
  const ids=[];
  document.querySelectorAll('.error-checkbox[data-eid]:checked').forEach(function(cb){ids.push(cb.getAttribute('data-eid'));});
  return ids;
}

function batchDeleteErrors(){
  const ids=getSelectedErrorIds();
  if(ids.length===0){showToast('请先选择错题','error');return;}
  if(!confirm('确定删除所选的 '+ids.length+' 道错题？'))return;
  ids.forEach(function(id){AttachmentDB.removeByErrorId(id);});
  DATA.wrongQuestions=DATA.wrongQuestions.filter(function(e){return ids.indexOf(e.id)===-1;});
  saveData();refreshErrors();showToast('已删除','success');
}

function batchRetagErrors(tag){
  if(!tag)return;
  const ids=getSelectedErrorIds();
  if(ids.length===0){showToast('请先选择错题','error');return;}
  DATA.wrongQuestions.forEach(function(e){if(ids.indexOf(e.id)!==-1){e.errorTag=tag;if(tag!=='其他')e.errorTagCustom='';}});
  saveData();refreshErrors();showToast('已更新标签: '+tag,'success');
}

function toggleErrCustomTag(){
  const sel=document.getElementById('erf_et');
  const grp=document.getElementById('errCustomTagGroup');
  if(grp)grp.style.display=sel&&sel.value==='其他'?'block':'none';
}

function addAttachment(type){
  var input=document.createElement('input');
  input.type='file';input.accept='image/*,.pdf,.doc,.docx';input.multiple=true;
  input.onchange=function(){
    var arr=type==='question'?tempFilesQuestion:tempFilesAnswer;
    Array.from(input.files).forEach(function(f){
      if(f.size>10*1024*1024){showToast('文件 '+f.name+' 过大，请压缩后上传','error');return;}
      arr.push(f);
    });
    renderAttachmentPreviews(type);
  };
  input.click();
}

function renderAttachmentPreviews(type){
  var container=document.getElementById(type+'AttachmentsPreview');
  if(!container)return;
  var arr=type==='question'?tempFilesQuestion:tempFilesAnswer;
  // 释放旧的 object URLs
  container.querySelectorAll('img[data-obj-url]').forEach(function(img){
    URL.revokeObjectURL(img.getAttribute('data-obj-url'));
  });
  var h='';
  arr.forEach(function(f,i){
    var isImg=f.type&&f.type.startsWith('image/');
    if(isImg){
      var url=URL.createObjectURL(f);
      h+='<div class="att-preview-item"><img src="'+escapeHtml(url)+'" data-obj-url="'+escapeHtml(url)+'" alt=""><button class="att-delete-btn" onclick="removeAttachment(\''+type+'\','+i+')">&times;</button></div>';
    }else{
      var name=f.name||'file';
      var displayName=name.length>20?name.substring(0,20)+'...':name;
      var sizeStr=f.size>1024*1024?(f.size/(1024*1024)).toFixed(1)+'MB':(f.size/1024).toFixed(1)+'KB';
      h+='<div class="att-preview-item"><div class="file-card"><span class="file-icon">📄</span><span>'+escapeHtml(displayName)+' ('+sizeStr+')</span></div><button class="att-delete-btn" onclick="removeAttachment(\''+type+'\','+i+')">&times;</button></div>';
    }
  });
  container.innerHTML=h;
}

function removeAttachment(type,index){
  var arr=type==='question'?tempFilesQuestion:tempFilesAnswer;
  arr.splice(index,1);
  renderAttachmentPreviews(type);
}

function uploadAttachmentsForError(errorId){
  return AttachmentDB.remove(errorId,'question').then(function(){
    return AttachmentDB.remove(errorId,'answer');
  }).then(function(){
    return Promise.all([
      AttachmentDB.save(errorId,'question',tempFilesQuestion),
      AttachmentDB.save(errorId,'answer',tempFilesAnswer)
    ]);
  }).then(function(){
    var e=DATA.wrongQuestions.find(function(x){return x.id===errorId;});
    if(e){
      e.questionAttachments=tempFilesQuestion.map(function(f){return {name:f.name};});
      e.answerAttachments=tempFilesAnswer.map(function(f){return {name:f.name};});
    }
    return Promise.resolve();
  });
}

function saveError(eid){
  var btn=document.getElementById('errSaveBtn');if(btn){btn.disabled=true;btn.textContent='保存中...';}
  var d={question:document.getElementById('erf_q')?.value||'',answer:document.getElementById('erf_a')?.value||'',subjectId:document.getElementById('erf_s')?.value||DATA.subjects[0]?.id||'',knowledgeTag:document.getElementById('erf_k')?.value||'',source:document.getElementById('erf_src')?.value||'',errorTag:document.getElementById('erf_et')?.value||'',errorTagCustom:(document.getElementById('erf_et')?.value==='其他'?(document.getElementById('erf_etc')?.value||''):'')};
  if(!d.question.trim()){showToast('请输入题目','error');if(btn){btn.disabled=false;btn.textContent='保存';}return;}
  var errorId=eid||genId();
  d.questionAttachments=tempFilesQuestion.map(function(f){return {name:f.name};});
  d.answerAttachments=tempFilesAnswer.map(function(f){return {name:f.name};});
  if(eid){var e=DATA.wrongQuestions.find(function(x){return x.id===eid;});if(e)Object.assign(e,d);}
  else DATA.wrongQuestions.push({id:errorId,...d,reviewCount:0,nextReviewDate:todayStr(),createdAt:todayStr()});
  if(d.knowledgeTag&&d.subjectId){
    if(!DATA.knowledgeTree)DATA.knowledgeTree={};
    if(!DATA.knowledgeTree[d.subjectId])DATA.knowledgeTree[d.subjectId]=getDefaultKnowledgeTree(d.subjectId,'');
    if(!DATA.knowledgeTree[d.subjectId]._mastery)DATA.knowledgeTree[d.subjectId]._mastery={};
    DATA.knowledgeTree[d.subjectId]._mastery[d.knowledgeTag]=0;
    ensureKnowledgeNode(DATA.knowledgeTree[d.subjectId],d.knowledgeTag);
  }
  uploadAttachmentsForError(errorId).then(function(){

function ensureKnowledgeNode(tree,name){
  if(!tree.children)tree.children=[];
  if(!tree.children.find(function(c){return c.name===name;})){
    tree.children.push({name:name});
  }
}

function aiAnalyzeError(){

  const a=document.getElementById('erf_a')?.value?.trim()||'';
  const btn=document.getElementById('aiAnalyzeBtn');
  btn.textContent='⏳ 分析中…';btn.disabled=true;
  const cfg=DATA.aiConfig||{};
  if(!cfg.apiEndpoint||!cfg.apiKey){

  }
  const msg='这是一道考研题，请只返回它考察的知识点名称（5个字以内，如"不定积分""虚拟语气"）。\n题目：'+q+(a?'\n答案：'+a:'');
  fetch(cfg.apiEndpoint,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},

function renderResFileArea(r){
  var area=document.getElementById('resFileArea');if(!area)return;
  var existingFile=(r&&r.file)?r.file:null;
  if(tempResFile){
    var sizeStr=tempResFile.size>1024*1024?(tempResFile.size/(1024*1024)).toFixed(1)+'MB':(tempResFile.size/1024).toFixed(1)+'KB';

      '<span style="font-size:13px;">📄 '+escapeHtml(tempResFile.name)+' ('+sizeStr+')</span>'+

  }else if(existingFile){
    var esize=existingFile.size>1024*1024?(existingFile.size/(1024*1024)).toFixed(1)+'MB':(existingFile.size/1024).toFixed(1)+'KB';
    area.innerHTML='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'+
      '<span style="font-size:13px;">📄 '+escapeHtml(existingFile.name)+' ('+esize+')</span>'+

  }else{
    area.innerHTML='<button type="button" class="btn btn-sm btn-outline" onclick="uploadResFile()">📎 上传 PDF/文档</button>'+

  }

function uploadResFile(){
  var input=document.createElement('input');
  input.type='file';input.accept='.pdf,.doc,.docx,.ppt,.pptx';
  input.onchange=function(){
    var f=input.files[0];
    if(!f)return;
    if(f.size>50*1024*1024){showToast('文件过大，请压缩后上传（≤50MB）','error');return;}
    tempResFile=f;renderResFileArea(null);
  };
  input.click();
}

function saveRes(eid){
  var btn=document.getElementById('resSaveBtn');if(btn){btn.disabled=true;btn.textContent='保存中...';}
  var d={name:document.getElementById('resf_n')?.value||'',type:document.getElementById('resf_t')?.value||'其他',subjectId:document.getElementById('resf_s')?.value||DATA.subjects[0]?.id||'',progress:parseInt(document.getElementById('resf_p')?.value||'0'),investedMin:parseInt(document.getElementById('resf_im')?.value||'0'),startDate:todayStr()};
  if(!d.name.trim()){showToast('请输入名称','error');if(btn){btn.disabled=false;btn.textContent='保存';}return;}
  var resourceId=eid||genId();
  var oldRes=eid?DATA.resources.find(function(x){return x.id===eid;}):null;
  var wasAttached=oldRes&&oldRes.fileAttached;

  if(eid){if(oldRes)Object.assign(oldRes,d);}
  else DATA.resources.push({id:resourceId,...d,file:null,fileAttached:false});

  var filePromise;
  if(tempResFile){
    var delPromise=wasAttached?AttachmentDB.removeResourceFile(resourceId):Promise.resolve();
    filePromise=delPromise.then(function(){return AttachmentDB.saveResourceFile(resourceId,tempResFile);}).then(function(){
      var res=DATA.resources.find(function(x){return x.id===resourceId;});
      if(res){res.file={name:tempResFile.name,type:tempResFile.type,size:tempResFile.size};res.fileAttached=true;}
    });
  }else if(tempResFileDeleted&&wasAttached){
    filePromise=AttachmentDB.removeResourceFile(resourceId).then(function(){
      var res=DATA.resources.find(function(x){return x.id===resourceId;});
      if(res){res.file=null;res.fileAttached=false;}
    });
  }else{filePromise=Promise.resolve();}

  filePromise.then(function(){
    saveData();closeModal();refreshResources();
    showToast('已保存','success');
  }).catch(function(err){
    saveData();closeModal();refreshResources();
    showToast('文件保存失败，资料信息已保存','error');
  });
}

function deleteRes(id){
  if(!confirm('删除？'))return;
  var r=DATA.resources.find(function(x){return x.id===id;});
  if(r&&r.fileAttached){AttachmentDB.removeResourceFile(id).catch(function(){});}
  DATA.resources=DATA.resources.filter(function(x){return x.id!==id;});
  saveData();refreshResources();
}
