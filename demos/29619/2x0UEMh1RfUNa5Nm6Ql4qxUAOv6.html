<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>所愿必橙 · 考研学习系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
</script>
<style>
/* ========== CSS Variables ========== */
:root {
  --orange-50:#fff7ed; --orange-100:#ffedd5; --orange-200:#fed7aa; --orange-300:#fdba74;
  --orange-400:#fb923c; --orange-500:#f97316; --orange-600:#ea580c; --orange-700:#c2410c;
  --bg:#faf8f5; --surface:#ffffff; --sidebar-bg:#1c1917; --sidebar-text:#a8a29e; --sidebar-active:#ffffff;
  --text:#292524; --text-secondary:#78716c; --text-muted:#a8a29e;
  --border:#e7e5e4; --border-light:#f0eeec;
  --accent:var(--orange-500); --accent-light:var(--orange-400); --accent-bg:var(--orange-50);
  --green:#22c55e; --green-bg:#f0fdf4;
  --red:#ef4444; --red-bg:#fef2f2;
  --purple:#a855f7; --purple-bg:#faf5ff;
  --blue:#3b82f6; --blue-bg:#eff6ff;
  --radius:16px; --radius-sm:12px; --radius-xs:8px; --radius-full:9999px;
  --shadow-xs:0 1px 2px rgba(0,0,0,.04); --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow:0 4px 16px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04);
  --shadow-lg:0 12px 32px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.04);
  --glass-bg:rgba(255,255,255,.72); --glass-border:rgba(0,0,0,.06);
  --sidebar-w:220px;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --transition-fast:150ms ease; --transition-base:250ms ease; --transition-slow:400ms cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:#1c1917; --surface:#292524; --sidebar-bg:#0f0d0b; --sidebar-text:#78716c; --sidebar-active:#faf8f5;
  --text:#faf8f5; --text-secondary:#a8a29e; --text-muted:#78716c; --border:#44403c; --border-light:#383432;
  --accent-bg:#2d1a0a; --green-bg:#052e16; --red-bg:#2d0a0a; --purple-bg:#1a0a2e; --blue-bg:#0a1a3e;
  --shadow-xs:0 1px 2px rgba(0,0,0,.2); --shadow-sm:0 1px 3px rgba(0,0,0,.3); --shadow:0 4px 16px rgba(0,0,0,.4); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  --glass-bg:rgba(41,37,36,.75); --glass-border:rgba(255,255,255,.06);
}
/* ========== 护眼模式 (Eye-Care) ========== */
[data-theme="eye-care"] {
  --bg:#f5f0e1; --surface:#fff8ef; --sidebar-bg:#3d2e1f; --sidebar-text:#a89880; --sidebar-active:#fff8ef;
  --text:#3d2e1f; --text-secondary:#5c4a35; --text-muted:#8b7d6e;
  --border:#d8ccb8; --border-light:#e8ded0;
  --accent:#e07830; --accent-light:#f09040; --accent-bg:#f5e6d0;
  --green:#5a8a3c; --green-bg:#edf5e5;
  --red:#c0443c; --red-bg:#faeae8;
  --purple:#7e5aa0; --purple-bg:#f2edf7;
  --blue:#4a82c4; --blue-bg:#e8f0fa;
  --shadow-xs:0 1px 2px rgba(80,50,20,.06); --shadow-sm:0 1px 3px rgba(80,50,20,.08),0 1px 2px rgba(80,50,20,.04);
  --shadow:0 4px 16px rgba(80,50,20,.08),0 1px 4px rgba(80,50,20,.04);
  --shadow-lg:0 12px 32px rgba(80,50,20,.1),0 2px 8px rgba(80,50,20,.05);
  --glass-bg:rgba(255,248,239,.78); --glass-border:rgba(180,160,130,.18);
}

/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:24px;}
body{
  font-family:var(--font-sans);background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.6;display:flex;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#d6d3d1;border-radius:3px;}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#57534e;}
[data-theme="eye-care"] ::-webkit-scrollbar-thumb{background:#c8b898;}

/* ========== Sidebar ========== */
.sidebar{
  width:var(--sidebar-w);background:var(--sidebar-bg);color:var(--sidebar-text);
  position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;
  overflow-y:auto;transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.sidebar-brand{padding:28px 22px 20px;}
.sidebar-brand .logo{
  font-size:21px;font-weight:800;color:var(--sidebar-active);display:flex;align-items:center;gap:8px;
  letter-spacing:.5px;
}
.sidebar-brand .logo .dot{
  width:10px;height:10px;border-radius:50%;background:var(--orange-500);
  box-shadow:0 0 12px rgba(249,115,22,.5);
}
.sidebar-brand .subtitle{font-size:11px;color:var(--sidebar-text);margin-top:4px;letter-spacing:.5px;}
.sidebar-nav{flex:1;padding:8px 0;}
.sidebar-nav a{
  display:flex;align-items:center;gap:10px;padding:10px 22px;color:var(--sidebar-text);
  text-decoration:none;font-size:13.5px;transition:all .2s;border-left:3px solid transparent;
  cursor:pointer;position:relative;
}
.sidebar-nav a:hover{color:var(--sidebar-active);background:rgba(255,255,255,.04);}
.sidebar-nav a.active{color:var(--sidebar-active);background:rgba(249,115,22,.12);border-left-color:var(--orange-500);font-weight:600;}
.sidebar-nav a .nav-dot{font-size:17px;width:24px;text-align:center;flex-shrink:0;}
.sidebar-footer{
  padding:18px 22px;border-top:1px solid rgba(255,255,255,.06);
  font-size:10.5px;color:var(--sidebar-text);letter-spacing:.5px;
}

/* ========== Main ========== */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;}
.topbar{
  background:var(--glass-bg);border-bottom:1px solid var(--glass-border);
  padding:14px 28px;display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  transition:background var(--transition-base);
}
.topbar-title{font-size:17px;font-weight:700;color:var(--orange-600);}
.topbar-actions{display:flex;gap:10px;align-items:center;}
/* Global Search */
.search-wrap{position:relative;}
.search-input{
  padding:7px 12px 7px 32px;border-radius:20px;border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);font-family:inherit;font-size:12.5px;
  width:180px;transition:all var(--transition-fast);outline:none;
}
.search-input:focus{width:240px;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.1);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-muted);pointer-events:none;}
.search-results{
  display:none;position:absolute;top:100%;left:0;right:0;margin-top:6px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-lg);max-height:360px;overflow-y:auto;z-index:100;min-width:280px;
}
.search-results.open{display:block;}
.search-results .sr-item{
  display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;
  font-size:12.5px;transition:background var(--transition-fast);border-bottom:1px solid var(--border-light);
}
.search-results .sr-item:hover{background:var(--accent-bg);}
.search-results .sr-item .sr-type{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;flex-shrink:0;}
.sr-highlight{background:var(--orange-200);border-radius:2px;padding:0 2px;}
.search-empty{padding:16px;text-align:center;color:var(--text-muted);font-size:12px;}
.topbar-time{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
.menu-toggle{display:none;background:none;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:4px;}

.content{padding:28px;max-width:1200px;margin:0 auto;}

/* ========== Section Styles ========== */
.section{margin-bottom:40px;scroll-margin-top:24px;}
.section-header{
  display:flex;align-items:center;gap:12px;margin-bottom:20px;
}
.section-header .section-icon{
  width:40px;height:40px;border-radius:var(--radius-xs);display:flex;align-items:center;
  justify-content:center;font-size:20px;background:var(--orange-50);color:var(--orange-600);
}
.section-header h2{font-size:22px;font-weight:700;letter-spacing:-.3px;}
.section-header .section-badge{
  font-size:12px;color:var(--text-muted);background:var(--border-light);
  padding:4px 12px;border-radius:20px;margin-left:auto;
}

/* ========== Cards ========== */
.card{
  background:var(--surface);border-radius:var(--radius);padding:24px;
  border:1px solid var(--border);box-shadow:var(--shadow-xs);margin-bottom:20px;
  transition:box-shadow var(--transition-base),transform var(--transition-base);
}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.card-title{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;}

/* ========== Grids ========== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}

/* ========== Hero Section ========== */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:36px;}
.hero-welcome{
  background:linear-gradient(135deg,#f97316,#ea580c,#c2410c);color:#fff;
  border-radius:var(--radius);padding:32px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 8px 32px rgba(249,115,22,.25);position:relative;overflow:hidden;
}
.hero-welcome::after{
  content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;
  background:rgba(255,255,255,.06);border-radius:50%;
}
.hero-welcome .greeting{font-size:14px;opacity:.85;margin-bottom:4px;}
.hero-welcome .app-name{font-size:36px;font-weight:900;letter-spacing:1px;margin-bottom:6px;}
.hero-welcome .motto{font-size:13px;opacity:.7;font-style:italic;}
.hero-countdown{
  background:var(--surface);border-radius:var(--radius);padding:28px;text-align:center;
  border:2px solid var(--orange-100);display:flex;flex-direction:column;justify-content:center;
  align-items:center;gap:8px;
}
.hero-countdown .countdown-label{font-size:13px;color:var(--text-secondary);}
.hero-countdown .countdown-days{font-size:64px;font-weight:900;color:var(--orange-600);line-height:1;letter-spacing:-2px;}
.hero-countdown .countdown-date{font-size:12px;color:var(--text-muted);}

/* ========== Stats Row ========== */
.stats-row{display:flex;gap:16px;margin-bottom:36px;flex-wrap:wrap;}
.stat-card{
  flex:1;min-width:130px;background:var(--surface);border-radius:var(--radius);
  padding:18px 22px;border:1px solid var(--border);box-shadow:var(--shadow-xs);
  display:flex;align-items:center;gap:14px;transition:all .2s;
}
.stat-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.stat-card .stat-icon{
  width:44px;height:44px;border-radius:var(--radius-xs);display:flex;
  align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.stat-card .stat-icon.orange{background:var(--orange-50);color:var(--orange-600);}
.stat-card .stat-icon.green{background:var(--green-bg);color:var(--green);}
.stat-card .stat-icon.purple{background:var(--purple-bg);color:var(--purple);}
.stat-card .stat-icon.blue{background:var(--blue-bg);color:var(--blue);}
.stat-card .stat-info{min-width:0;}
.stat-card .stat-val{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.5px;}
.stat-card .stat-lbl{font-size:11.5px;color:var(--text-muted);white-space:nowrap;}

/* ========== Buttons ========== */
.btn{
  padding:8px 18px;border-radius:var(--radius-xs);border:none;cursor:pointer;
  font-size:13px;font-family:inherit;font-weight:500;transition:all .2s;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  letter-spacing:.2px;
}
.btn-primary{background:var(--orange-500);color:#fff;box-shadow:0 2px 8px rgba(249,115,22,.25);}
.btn-primary:hover{background:var(--orange-600);box-shadow:0 4px 12px rgba(249,115,22,.35);transform:translateY(-1px);}
.btn-outline{background:transparent;color:var(--text-secondary);border:1.5px solid var(--border);}
.btn-outline:hover{background:var(--bg);border-color:var(--orange-300);color:var(--orange-600);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px;}
.btn-lg{padding:12px 28px;font-size:15px;font-weight:600;border-radius:var(--radius-xs);}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{opacity:.9;}

/* ========== Tags ========== */
.tag{
  display:inline-block;padding:3px 10px;border-radius:16px;font-size:11px;font-weight:500;
  letter-spacing:.2px;
}
.tag.orange{background:var(--orange-50);color:var(--orange-700);}
.tag.green{background:var(--green-bg);color:#16a34a;}
.tag.purple{background:var(--purple-bg);color:var(--purple);}
.tag.blue{background:var(--blue-bg);color:var(--blue);}
.tag.red{background:var(--red-bg);color:var(--red);}
.tag.gray{background:var(--border-light);color:var(--text-muted);}

/* ========== Progress ========== */
.progress-bar{height:8px;background:var(--border-light);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.4,0,.2,1);}
.progress-fill.orange{background:linear-gradient(90deg,var(--orange-400),var(--orange-500));}
.progress-fill.green{background:linear-gradient(90deg,#4ade80,#22c55e);}
.progress-fill.blue{background:linear-gradient(90deg,#60a5fa,#3b82f6);}
.progress-fill.purple{background:linear-gradient(90deg,#a78bfa,#8b5cf6);}

/* ========== Tables ========== */
table{width:100%;border-collapse:collapse;}
th,td{padding:11px 14px;text-align:left;font-size:13px;border-bottom:1px solid var(--border-light);}
th{
  color:var(--text-muted);font-weight:600;font-size:11.5px;background:var(--bg);
  white-space:nowrap;letter-spacing:.3px;text-transform:uppercase;
}
tr:hover td{background:var(--orange-50);}
[data-theme="dark"] tr:hover td{background:rgba(249,115,22,.04);}

/* ========== Habit Grid ========== */
.habit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.habit-chip{
  display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;
  transition:all .25s;user-select:none;
}
.habit-chip:hover{border-color:var(--orange-300);box-shadow:var(--shadow-sm);}
.habit-chip.done{background:var(--orange-50);border-color:var(--orange-300);}
.habit-chip .hc-check{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0;
  font-size:13px;color:transparent;
}
.habit-chip.done .hc-check{background:var(--orange-500);border-color:var(--orange-500);color:#fff;}
.habit-chip .hc-name{font-size:13px;font-weight:500;}
.habit-chip .hc-streak{font-size:10px;color:var(--text-muted);margin-left:auto;}
.habit-chip{position:relative;}
.hc-edit-btn{
  position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;
  border:none;background:transparent;color:var(--text-muted);font-size:11px;
  cursor:pointer;display:none;align-items:center;justify-content:center;
  transition:all var(--transition-fast);line-height:1;
}
.habit-chip:hover .hc-edit-btn,.hc-edit-btn:hover{display:flex;}
.hc-edit-btn:hover{background:var(--border-light);color:var(--accent);}

/* ========== Focus Panel ========== */
.focus-panel{
  background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;
  border-radius:var(--radius);padding:36px 32px;text-align:center;
  box-shadow:0 8px 32px rgba(249,115,22,.2);
}
.focus-timer{
  font-size:72px;font-weight:900;letter-spacing:2px;font-variant-numeric:tabular-nums;
  margin:16px 0;line-height:1;
}
.focus-mode-btns,.focus-dur-btns{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap;}
.focus-mode-btns button,.focus-dur-btns button{
  padding:7px 18px;border-radius:20px;border:1.5px solid rgba(255,255,255,.4);
  background:transparent;color:#fff;cursor:pointer;font-size:12.5px;font-family:inherit;
  transition:all .2s;
}
.focus-mode-btns button:hover,.focus-dur-btns button:hover,
.focus-mode-btns button.active,.focus-dur-btns button.active{
  background:rgba(255,255,255,.18);border-color:#fff;font-weight:600;
}
.focus-main-btn{
  padding:15px 52px;border-radius:30px;border:none;font-size:18px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .3s;
  background:#fff;color:var(--orange-600);box-shadow:0 6px 24px rgba(0,0,0,.12);
  letter-spacing:.5px;
}
.focus-main-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.18);}
.focus-main-btn.running{background:#fff;color:var(--red);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 6px 24px rgba(239,68,68,.3);}50%{box-shadow:0 6px 36px rgba(239,68,68,.55);}}

/* ========== Quad Grid (Eisenhower) ========== */
.quad-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.quad-cell{
  background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);
  padding:20px;min-height:150px;
}
.quad-cell.q1{border-color:#fca5a5;background:#fef2f2;}.quad-cell.q2{border-color:#fdba74;background:#fff7ed;}
.quad-cell.q3{border-color:#93c5fd;background:#eff6ff;}.quad-cell.q4{border-color:var(--border);}
.quad-cell h4{font-size:14px;margin-bottom:10px;}

.sub-card{padding:10px 12px;margin-bottom:6px;background:var(--surface);border-radius:10px;cursor:pointer;border:1px solid var(--border);transition:all .2s;}
.sub-card:hover{border-color:var(--orange-200);box-shadow:var(--shadow-sm);}
.sub-card .sub-plan{font-size:10px;color:var(--text-muted);margin-bottom:3px;}
.sub-card .sub-name{font-weight:600;font-size:13px;margin-bottom:4px;}
.sub-card .sub-row{display:flex;align-items:center;gap:8px;margin-top:3px;}
.sub-card .sub-bar{flex:1;height:4px;background:var(--border-light);border-radius:2px;overflow:hidden;}
.sub-card .sub-fill{height:100%;background:var(--orange-500);border-radius:2px;transition:width .3s;}
.sub-card .sub-actions{display:flex;gap:4px;margin-top:6px;}

.plans-accordion{border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.acc-item{border-bottom:1px solid var(--border);}
.acc-item:last-child{border-bottom:none;}
.acc-header{padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .2s;user-select:none;}
.acc-header:hover{background:var(--orange-50);}
.acc-arrow{transition:transform .25s;font-size:11px;color:var(--text-muted);display:inline-block;width:14px;text-align:center;}
.acc-item.open .acc-arrow{transform:rotate(90deg);}
.acc-body{display:none;padding:0 16px 14px 42px;}
.acc-item.open .acc-body{display:block;}

.progress-bar{height:6px;background:var(--border-light);border-radius:4px;overflow:hidden;}

/* ========== Toast ========== */
.toast{
  position:fixed;top:24px;right:24px;z-index:300;padding:12px 22px;
  border-radius:var(--radius-xs);color:#fff;font-size:13px;font-weight:500;
  box-shadow:var(--shadow-lg);transform:translateX(130%);transition:transform var(--transition-slow);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.toast.show{transform:translateX(0);}
.toast.success{background:var(--green);}.toast.error{background:var(--red);}.toast.info{background:var(--orange-500);}

/* ========== Modal (Glassmorphism) ========== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:200;display:none;align-items:center;justify-content:center;
  animation:fadeIn var(--transition-fast) ease;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--surface);border-radius:var(--radius);padding:28px;
  min-width:440px;max-width:680px;max-height:85vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);border:1px solid var(--border);
  animation:slideUp var(--transition-base) cubic-bezier(.4,0,.2,1);
}
.modal h3{font-size:18px;font-weight:700;margin-bottom:20px;color:var(--orange-700);}
.modal .bar{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;}

/* ========== PDF Upload Modal ========== */
.upload-zone{
  border:2px dashed var(--border);border-radius:var(--radius-sm);padding:32px;
  text-align:center;cursor:pointer;transition:all .2s;background:var(--bg);
}
.upload-zone:hover{border-color:var(--orange-400);background:var(--orange-50);}
.upload-zone input[type="file"]{display:none;}
.upload-progress{margin:16px 0;display:none;}
.upload-progress.active{display:block;}
.upload-progress .progress-step{
  display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;color:var(--text-secondary);
}
.upload-progress .progress-step .step-dot{
  width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;
}
.upload-progress .progress-step.done .step-dot{background:var(--green);}
.upload-progress .progress-step.active .step-dot{
  background:var(--orange-500);animation:pulse-dot 1s infinite;
}
.upload-progress .progress-step.active{color:var(--orange-600);font-weight:600;}
.pdf-options{display:flex;gap:12px;margin:12px 0;}
.pdf-options label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;}

/* ========== Forms ========== */
.form-group{margin-bottom:15px;}
.form-group label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px;font-weight:500;}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 13px;border-radius:var(--radius-xs);border:1.5px solid var(--border);
  font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--text);
  transition:border-color .2s;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(249,115,22,.12);
  transition:border-color var(--transition-fast),box-shadow var(--transition-fast);
}
.form-group textarea{resize:vertical;min-height:75px;}

/* ========== Empty State ========== */
.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px;opacity:.7;}
.empty-state p{font-size:13.5px;margin-bottom:14px;}

/* ========== Cards for items ========== */
.item-card{
  padding:16px 18px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:10px;background:var(--surface);transition:all var(--transition-base);
}
.item-card:hover{border-color:var(--orange-200);box-shadow:var(--shadow);transform:translateY(-1px);}

/* ========== Plans Kanban Grid ========== */
.plans-kanban-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.plans-kanban-col{border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);}
.plans-kanban-header{padding:12px 14px;border-bottom:1.5px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.plans-kanban-card{padding:12px 14px;border-bottom:1px solid var(--border);transition:background .2s;cursor:pointer;}
.plans-kanban-card:last-child{border-bottom:none;}
.plans-kanban-card:hover{background:var(--orange-50, rgba(249,115,22,.08));}
.plans-kanban-empty{padding:20px;text-align:center;font-size:12px;color:var(--text-muted);}

/* ========== Stars ========== */
.stars-row{display:flex;gap:6px;justify-content:center;margin:8px 0;}
.star-btn{font-size:30px;cursor:pointer;background:none;border:none;transition:all .2s;filter:grayscale(1);padding:2px;}
.star-btn:hover,.star-btn.active{filter:none;transform:scale(1.15);}

/* ========== Error Card ========== */
.error-card{
  padding:16px 18px;border-left:4px solid var(--red);
  background:var(--surface);border-radius:var(--radius-sm);
  border:1.5px solid var(--border);margin-bottom:10px;
}
.error-card.reviewed{border-left-color:var(--green);}
.error-card.overdue{border-left-color:var(--orange-500);box-shadow:0 0 0 1px var(--orange-200);}
.error-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500;}
.error-tag.concept{background:#faf5ff;color:#a855f7;}
.error-tag.calc{background:#fef2f2;color:#ef4444;}
.error-tag.read{background:#fff7ed;color:#f97316;}
.error-tag.forget{background:#eff6ff;color:#3b82f6;}
.error-tag.other{background:#f5f5f4;color:#78716c;}
.att-preview-item{position:relative;display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:8px;border:1px solid var(--border);background:var(--bg);}
.att-preview-item img{width:60px;height:60px;object-fit:cover;border-radius:6px;}
.att-preview-item .file-card{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:11px;color:var(--text-secondary);}
.att-preview-item .file-card .file-icon{font-size:20px;}
.att-delete-btn{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.att-display-item{display:inline-flex;align-items:center;gap:4px;margin:4px 6px 4px 0;}
.att-display-item img{width:48px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer;transition:transform .2s;}
.att-display-item img:hover{transform:scale(2.5);z-index:100;box-shadow:var(--shadow-lg);}
.att-display-link{font-size:12px;color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.att-display-link:hover{text-decoration:underline;}
.att-section{margin-top:6px;font-size:12px;color:var(--text-muted);}
.warn-banner{
  padding:10px 16px;border-radius:10px;margin-bottom:12px;
  background:var(--orange-50);border:1px solid var(--orange-200);
  font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;
}
.warn-banner:hover{background:var(--orange-100);}
.batch-bar{
  position:sticky;bottom:0;z-index:50;margin-top:12px;
  padding:12px 18px;background:var(--surface);border:1.5px solid var(--orange-300);
  border-radius:var(--radius-sm);display:flex;gap:8px;align-items:center;
  box-shadow:var(--shadow-lg);flex-wrap:wrap;
}
.batch-bar .selected-count{font-weight:600;font-size:13px;color:var(--orange-600);}
.error-checkbox{width:16px;height:16px;cursor:pointer;accent-color:var(--orange-500);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.stats-grid .stat-cell{background:var(--bg);border-radius:var(--radius-sm);padding:14px;}
.top5-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px;}
.top5-item:last-child{border-bottom:none;}
.top5-rank{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:var(--orange-400);}
[data-theme="dark"] .error-tag.concept{background:#1a0a2e;color:#c084fc;}
[data-theme="dark"] .error-tag.calc{background:#2d0a0a;color:#f87171;}
[data-theme="dark"] .error-tag.read{background:#2d1a0a;color:#fb923c;}
[data-theme="dark"] .error-tag.forget{background:#0a1a3e;color:#60a5fa;}
[data-theme="dark"] .error-tag.other{background:#1c1917;color:#a8a29e;}

/* ========== Chart Wraps ========== */
.chart-wrap{position:relative;width:100%;}
.chart-wrap canvas{width:100%!important;}
.chart-half{max-width:360px;margin:0 auto;}

.exam-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.exam-summary-card{background:var(--surface);border-radius:var(--radius-sm);padding:16px;transition:all .2s;box-shadow:var(--shadow-xs);}
.exam-summary-card:hover{box-shadow:var(--shadow);transform:translateY(-2px);}
.exam-summary-card.active{box-shadow:0 0 0 2px var(--orange-500);}

/* ========== Clock iframe ========== */
.clock-iframe-wrap{width:100%;height:180px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);}
.clock-iframe-wrap iframe{width:100%;height:100%;border:none;}

/* ========== Countdown Live ========== */
.countdown-live{display:flex;gap:10px;justify-content:center;align-items:center;padding:20px;}
.countdown-block{text-align:center;min-width:70px;}
.countdown-block .cd-num{
  font-size:56px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,#f97316,#ea580c);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-1px;
}
.countdown-block .cd-lbl{font-size:11px;color:var(--text-muted);margin-top:4px;letter-spacing:.5px;}
.countdown-sep{font-size:40px;color:var(--orange-300);font-weight:300;padding-bottom:12px;}
.countdown-sub{text-align:center;font-size:12px;color:var(--text-muted);margin-top:4px;}

/* ========== Warning Banner ========== */
.warn-banner{
  background:var(--orange-50);border:1.5px solid var(--orange-300);border-radius:var(--radius-sm);
  padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:10px;
  font-size:13px;color:var(--orange-700);animation:slideDown .3s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.warn-banner .warn-close{background:none;border:none;cursor:pointer;font-size:16px;color:var(--orange-500);margin-left:auto;}

/* ========== Achievement Badge ========== */
.achieve-card{
  text-align:center;padding:16px 12px;background:linear-gradient(135deg,var(--orange-50),#fff);
  border:2px solid var(--orange-200);border-radius:var(--radius-sm);transition:all .3s;
}
.achieve-card.locked{opacity:.4;filter:grayscale(.6);}
.achieve-card .ach-icon{font-size:36px;margin-bottom:6px;}
.achieve-card .ach-name{font-size:12px;font-weight:600;}
.achieve-card .ach-date{font-size:10px;color:var(--text-muted);}

/* ========== Knowledge Tree ========== */
.tree-node{padding:8px 14px;margin:4px 0;border-radius:8px;cursor:pointer;font-size:13px;transition:all .2s;}
.tree-node:hover{background:var(--bg);}
.tree-node.mastered{border-left:3px solid var(--green);}
.tree-node.learning{border-left:3px solid var(--orange-400);}
.tree-node.weak{border-left:3px solid var(--red);}
.tree-node .tn-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}
.tree-node .tn-dot.green{background:var(--green);}
.tree-node .tn-dot.orange{background:var(--orange-400);}
.tree-node .tn-dot.red{background:var(--red);}
.tree-node .tn-dot.gray{background:var(--border);}
.tree-indent{margin-left:24px;}

/* ========== Bio Clock Heatmap ========== */
.heatmap-grid{display:grid;grid-template-columns:80px repeat(7,1fr);gap:4px;font-size:11px;align-items:center;}
.heatmap-cell{padding:8px 4px;text-align:center;border-radius:4px;font-weight:500;}
.heatmap-cell.hot{background:#f97316;color:#fff;}
.heatmap-cell.warm{background:#fdba74;color:#7c2d12;}
.heatmap-cell.cool{background:#fed7aa;color:#9a3412;}
.heatmap-cell.cold{background:var(--border-light);color:var(--text-muted);}

/* ========== Lock Mode Overlay ========== */
.lock-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;
  display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;
}
.lock-overlay.active{display:flex;}
.lock-overlay .lock-icon{font-size:64px;margin-bottom:16px;}
.lock-overlay .lock-text{font-size:18px;margin-bottom:8px;}
.lock-overlay .lock-timer{font-size:48px;font-weight:900;font-variant-numeric:tabular-nums;}

/* ========== Kanban Board ========== */
.kanban-board{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;min-height:300px;}
.kanban-column{
  flex:1;min-width:260px;background:var(--border-light);border-radius:var(--radius);
  padding:12px;display:flex;flex-direction:column;transition:background var(--transition-fast);
}
.kanban-column.drag-over{background:var(--accent-bg);box-shadow:inset 0 0 0 2px var(--accent);}
.kanban-col-header{
  display:flex;align-items:center;justify-content:space-between;padding:8px 6px 12px;
  font-size:14px;font-weight:700;letter-spacing:.3px;
}
.kanban-col-header .col-count{font-size:11px;padding:2px 10px;border-radius:12px;font-weight:500;}
.kanban-col-todo .kanban-col-header{border-bottom:2px solid var(--border);}
.kanban-col-todo .col-count{background:var(--border);color:var(--text-secondary);}
.kanban-col-doing .kanban-col-header{border-bottom:2px solid var(--orange-400);}
.kanban-col-doing .col-count{background:var(--orange-100);color:var(--orange-700);}
.kanban-col-done .kanban-col-header{border-bottom:2px solid var(--green);}
.kanban-col-done .col-count{background:var(--green-bg);color:var(--green);}
.kanban-cards{flex:1;display:flex;flex-direction:column;gap:8px;min-height:60px;}
.kanban-card{
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;cursor:grab;transition:all var(--transition-fast);
  box-shadow:var(--shadow-xs);position:relative;
}
.kanban-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.kanban-card.dragging{opacity:.45;transform:rotate(2deg);box-shadow:var(--shadow-lg);cursor:grabbing;}
.kanban-card .kc-priority-bar{
  position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:2px 0 0 2px;
}
.kanban-card .kc-priority-bar.high{background:var(--red);}
.kanban-card .kc-priority-bar.medium{background:var(--orange-400);}
.kanban-card .kc-priority-bar.low{background:var(--blue);}
.kanban-card .kc-time{font-size:10.5px;color:var(--text-muted);margin-bottom:4px;}
.kanban-card .kc-content{font-size:13px;font-weight:500;margin-bottom:6px;line-height:1.5;}
.kanban-card .kc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.kanban-card .kc-duration{font-size:11px;color:var(--text-secondary);background:var(--bg);padding:2px 8px;border-radius:10px;}
.kanban-card .kc-actions{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-light);}
.kanban-empty{text-align:center;padding:24px 12px;color:var(--text-muted);font-size:12px;}

/* ========== Responsive ========== */
@media(max-width:1200px){
  .hero{grid-template-columns:1fr;}
  .grid-4{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}.sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}.menu-toggle{display:block;}
  .grid-2,.grid-3,.grid-4,.quad-grid,.hero,.plans-kanban-grid,.exam-summary-grid{grid-template-columns:1fr 1fr;}
  .content{padding:16px;}
  .stats-row{gap:10px;}.stat-card{min-width:100px;padding:14px;}
  .stat-card .stat-val{font-size:22px;}
  .focus-timer{font-size:48px;}.hero-welcome .app-name{font-size:28px;}
  .modal{min-width:auto;max-width:94vw;padding:20px;}
  .hero-countdown .countdown-days{font-size:48px;}
  th,td{padding:8px 10px;font-size:12px;}
  .sidebar-brand .logo{font-size:18px;}
}
/* ========== Animations ========== */
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{box-shadow:0 6px 24px rgba(239,68,68,.3);}50%{box-shadow:0 6px 36px rgba(239,68,68,.55);}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.35);}50%{box-shadow:0 0 0 8px rgba(249,115,22,0);}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
.skeleton{background:linear-gradient(90deg,var(--border-light) 25%,var(--bg) 50%,var(--border-light) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
.focus-next-btn{
  padding:10px 28px;border-radius:24px;border:2px solid var(--orange-400);font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .3s;
  background:var(--orange-50);color:var(--orange-600);
}
.focus-next-btn:hover{background:var(--orange-100);transform:translateY(-1px);box-shadow:0 4px 16px rgba(249,115,22,.25);}
.focus-linked-dot{display:inline-block;vertical-align:middle;font-size:14px;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ========== 增强知识树 (3层结构) ========== */
.knowledge-v2-header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.knowledge-v2-header .btn.active-subj{box-shadow:0 0 0 2px var(--accent);}
.ku-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px 16px;cursor:pointer;transition:all var(--transition-fast);
  margin-bottom:8px;position:relative;
}
.ku-card:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}
.ku-card.mastered{border-left:3px solid var(--green);}
.ku-card.learning{border-left:3px solid var(--orange-400);}
.ku-card.weak{border-left:3px solid var(--red);}
.ku-card .ku-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.ku-card .ku-title{font-weight:600;font-size:.9rem;}
.ku-card .ku-mastery{font-size:.7rem;padding:2px 8px;border-radius:10px;}
.ku-card .ku-content{font-size:.8rem;color:var(--text-secondary);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.ku-card .ku-actions{display:flex;gap:6px;margin-top:8px;}
.kp-group{margin-bottom:16px;}
.kp-group-header{
  font-weight:700;font-size:.95rem;padding:8px 12px;background:var(--accent-bg);
  border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;
}
.kp-group-header .kp-toggle{font-size:.75rem;transition:transform .2s;}
.kp-group-header.collapsed .kp-toggle{transform:rotate(-90deg);}
.kp-group-body{transition:max-height .3s ease;overflow:hidden;}
.kp-group-body.collapsed{max-height:0 !important;}

/* ========== AI 助手 ========== */
.ai-layout{display:flex;gap:20px;min-height:500px;}
.ai-main{flex:1;display:flex;flex-direction:column;min-width:0;}
.ai-sidebar{width:200px;flex-shrink:0;}
.ai-header{padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.ai-header h3{font-size:1.05rem;margin-bottom:4px;}
.ai-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 0;max-height:55vh;}
.ai-msg{display:flex;gap:8px;max-width:85%;}
.ai-msg.user{align-self:flex-end;flex-direction:row-reverse;}
.ai-msg.bot{align-self:flex-start;}
.ai-msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:#fff;}
.ai-msg.user .ai-msg-avatar{background:var(--accent);}
.ai-msg.bot .ai-msg-avatar{background:linear-gradient(135deg,#667eea,#764ba2);}
.ai-msg-body{min-width:0;}
.ai-msg-content{
  padding:8px 12px;border-radius:14px;font-size:.83rem;line-height:1.55;word-break:break-word;
}
.ai-msg.user .ai-msg-content{background:var(--accent);color:#fff;border-bottom-right-radius:4px;}
.ai-msg.bot .ai-msg-content{background:var(--border-light);color:var(--text);border-bottom-left-radius:4px;}
.ai-msg-time{font-size:.65rem;color:var(--text-muted);margin-top:3px;}
.ai-msg-content h2,.ai-msg-content h3,.ai-msg-content h4{margin:6px 0 3px;}
.ai-msg-content ul,.ai-msg-content ol{margin:3px 0;padding-left:16px;}
.ai-msg-content code{background:rgba(0,0,0,.08);padding:1px 5px;border-radius:3px;font-size:.78rem;}
.ai-msg-content pre{background:#1e293b;color:#e2e8f0;padding:8px 12px;border-radius:8px;font-size:.75rem;overflow-x:auto;margin:6px 0;}
.ai-input-area{padding-top:12px;border-top:1px solid var(--border);margin-top:12px;}
.ai-quick-btns{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ai-quick-btn{
  padding:5px 10px;border:1px solid var(--border);border-radius:16px;background:var(--surface);
  font-size:.75rem;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.ai-quick-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.ai-input-row{display:flex;gap:8px;}
.ai-input{
  flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:8px 12px;
  font-size:.83rem;font-family:inherit;outline:none;transition:border-color .15s;
}
.ai-input:focus{border-color:var(--accent);}
.ai-send-btn{
  width:36px;height:36px;border:none;border-radius:10px;background:var(--accent);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .15s;
}
.ai-send-btn:hover{background:var(--orange-600);}
.ai-send-btn:disabled{opacity:.5;cursor:not-allowed;}
.ai-config-section{
  background:var(--border-light);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;

function fmtClock(s){if(s<0)s=0;const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}

function fileToArrayBuffer(file){return new Promise(function(resolve,reject){const reader=new FileReader();reader.onload=function(){resolve(reader.result);};reader.onerror=function(){reject(reader.error);};reader.readAsArrayBuffer(file);});}

const AttachmentDB = {
  _db: null,
  open: function(){
    if(this._db)return Promise.resolve(this._db);
    var self=this;
    return new Promise(function(resolve,reject){
      var req=indexedDB.open('kaoyan_attachments',2);
      req.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains('files')){db.createObjectStore('files',{keyPath:'id'});}
        if(!db.objectStoreNames.contains('resource_files')){db.createObjectStore('resource_files',{keyPath:'id'});}
      };
      req.onsuccess=function(e){self._db=e.target.result;resolve(self._db);};
      req.onerror=function(e){reject(e.target.error);};
    });
  },
  save: function(errorId,field,fileList){
    var self=this;
    return self.open().then(function(db){
      var files=Array.from(fileList||[]);
      if(files.length===0)return Promise.resolve();
      var promises=files.map(function(f){return fileToArrayBuffer(f).then(function(buf){return {name:f.name,type:f.type,size:f.size,arrayBuffer:buf};});});
      return Promise.all(promises).then(function(records){
        return new Promise(function(resolve,reject){
          var tx=db.transaction('files','readwrite');
          var store=tx.objectStore('files');
          store.put({id:errorId+'_'+field,files:records.map(function(r){return {name:r.name,type:r.type,size:r.size,arrayBuffer:r.arrayBuffer};})});
          tx.oncomplete=function(){resolve();};
          tx.onerror=function(e){reject(e.target.error);};
        });
      });
    });
  },
  load: function(errorId,field){
    return this.open().then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction('files','readonly');
        var store=tx.objectStore('files');
        var req=store.get(errorId+'_'+field);
        req.onsuccess=function(){
          var record=req.result;
          if(!record||!record.files){resolve([]);return;}
          resolve(record.files.map(function(f){
            var blob=new Blob([f.arrayBuffer],{type:f.type||'application/octet-stream'});
            return {name:f.name,type:f.type,size:f.size,blob:blob};
          }));
        };
        req.onerror=function(e){reject(e.target.error);};
      });
    });
  },
  remove: function(errorId,field){
    return this.open().then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction('files','readwrite');
        var store=tx.objectStore('files');
        var req=store.delete(errorId+'_'+field);
        tx.oncomplete=function(){resolve();};
        tx.onerror=function(e){reject(e.target.error);};
      });
    });
  },
  removeByErrorId: function(errorId){
    return Promise.all([this.remove(errorId,'question'),this.remove(errorId,'answer')]).catch(function(){});
  },
  clearAll: function(){
    return this.open().then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction(['files','resource_files'],'readwrite');
        var store1=tx.objectStore('files');
        var store2=tx.objectStore('resource_files');
        store1.clear();store2.clear();
        tx.oncomplete=function(){resolve();};
        tx.onerror=function(e){reject(e.target.error);};
      });
    });
  },
  saveResourceFile: function(resourceId,file){
    var self=this;
    return fileToArrayBuffer(file).then(function(buf){
      return self.open().then(function(db){
        return new Promise(function(resolve,reject){
          var tx=db.transaction('resource_files','readwrite');
          var store=tx.objectStore('resource_files');
          store.put({id:resourceId,file:{name:file.name,type:file.type,size:file.size,arrayBuffer:buf}});
          tx.oncomplete=function(){resolve();};
          tx.onerror=function(e){reject(e.target.error);};
        });
      });
    });
  },
  loadResourceFile: function(resourceId){
    return this.open().then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction('resource_files','readonly');
        var store=tx.objectStore('resource_files');
        var req=store.get(resourceId);
        req.onsuccess=function(){
          var record=req.result;
          if(!record||!record.file){reject(new Error('文件不存在'));return;}
          var blob=new Blob([record.file.arrayBuffer],{type:record.file.type||'application/octet-stream'});
          resolve({name:record.file.name,type:record.file.type,size:record.file.size,blob:blob});
        };
        req.onerror=function(e){reject(e.target.error);};
      });
    });
  },
  removeResourceFile: function(resourceId){
    return this.open().then(function(db){
      return new Promise(function(resolve,reject){
        var tx=db.transaction('resource_files','readwrite');
        var store=tx.objectStore('resource_files');
        var req=store.delete(resourceId);
        tx.oncomplete=function(){resolve();};
        tx.onerror=function(e){reject(e.target.error);};
      });
    });
  }
};

function getWeekFocusMin(){
  const d=new Date();const day=d.getDay()||7;
  const mon=new Date(d);mon.setDate(d.getDate()-day+1);const monS=mon.toISOString().slice(0,10);
  const sun=new Date(d);sun.setDate(d.getDate()+7-day);const sunS=sun.toISOString().slice(0,10);
  let total=0;
  DATA.focusSessions.forEach(s=>{if(s.date>=monS&&s.date<=sunS)total+=Math.round(s.durationSec/60);});
  DATA.dailyPlans.forEach(p=>{if(p.date>=monS&&p.date<=sunS)total+=p.actualMin||0;});
  return total;
}

  DATA.focusSessions.forEach(s=>{if(s.date.startsWith(m))total+=Math.round(s.durationSec/60);});
  DATA.dailyPlans.forEach(p=>{if(p.date.startsWith(m))total+=p.actualMin||0;});
  return total;
}

function computeStreak(){
  let s=0;const d=new Date();
  while(true){
    const ds=d.toISOString().slice(0,10);let has=false;
    if(DATA.habitLogs[ds]&&Object.values(DATA.habitLogs[ds]).some(v=>v))has=true;
    if(!has){DATA.focusSessions.forEach(f=>{if(f.date===ds)has=true;});DATA.dailyPlans.forEach(p=>{if(p.date===ds&&(p.done||p.actualMin>0))has=true;});}
    if(has){s++;d.setDate(d.getDate()-1);}else break;
  }
  return s;
}

    const days=Math.floor(diff/86400000);
    const hours=Math.floor((diff%86400000)/3600000);

// Deviation warning checker
function checkDeviationWarning(){
  if(!DATA.deviationWarnings) DATA.deviationWarnings={};
  const now=Date.now();
  if(DATA.deviationWarnings._dismissed&&now-DATA.deviationWarnings._dismissed<86400000)return '';
  const subjectsToCheck=DATA.subjects.filter(s=>DATA.bigPlans.some(bp=>bp.subjectId===s.id));
  let warnings=[];
  subjectsToCheck.forEach(s=>{
    const plans=DATA.dailyPlans.filter(p=>{
      if(!p.bigPlanId)return false;
      const bp=DATA.bigPlans.find(x=>x.id===p.bigPlanId);
      return bp&&bp.subjectId===s.id;
    });
    if(plans.length<3)return;
    const recent=plans.slice(-6);
    const done=recent.filter(p=>p.done).length;
    const rate=done/recent.length;
    if(rate<0.5){
      const totalPlanned=recent.reduce((a,p)=>a+(p.plannedMin||0),0);
      const suggested=Math.round(totalPlanned*0.8/recent.length);
      warnings.push({subject:s,rate:Math.round(rate*100),suggested});
    }
  });
  if(warnings.length===0)return '';
  const w=warnings[0];
  return `<div class="warn-banner" id="deviationWarning">⚠️ <strong>${w.subject.name}</strong> 近期任务完成率仅 <b>${w.rate}%</b>，建议将每日目标从 <b>${fmtMin(Math.round(DATA.dailyPlans.filter(p=>{const bp=DATA.bigPlans.find(x=>x.id===p.bigPlanId);return bp&&bp.subjectId===w.subject.id;}).slice(-6).reduce((a,p)=>a+(p.plannedMin||0),0)/6))}</b> 调整为 <b>${fmtMin(w.suggested)}</b>/天 <button class="warn-close" onclick="dismissWarning()">✕</button></div>`;
}

function dismissWarning(){
  if(!DATA.deviationWarnings)DATA.deviationWarnings={};
  DATA.deviationWarnings._dismissed=Date.now();saveData();
  const el=document.getElementById('deviationWarning');if(el)el.remove();

    h+=`<div class="empty-state"><div class="empty-icon">🤖</div><p>点击"智能生成"按钮，AI将根据阶段目标、学习进度和艾宾浩斯遗忘曲线为你自动安排今日任务</p><button class="btn btn-primary" onclick="aiGenerateDailyPlan()">✨ 立即生成</button></div>`;
  }

  // Task display: table or kanban
  if(sorted.length===0&&dailyPlanMode==='manual'){
    h+=`<div class="empty-state"><div class="empty-icon">📋</div><p>暂无计划</p><button class="btn btn-primary btn-sm" onclick="showDailyPlanForm()">+ 添加任务</button></div>`;
  }else if(sorted.length>0){
    if(kanbanViewMode==='kanban'){
      h+=renderKanbanBoard(sorted);
    }else{
      h+=renderDailyTable(sorted);
    }
  }else if(sorted.length===0&&kanbanViewMode==='kanban'){
    h+=renderKanbanBoard([]);
  }

  // Planned vs actual history summary (for repeated tasks)
  if(sorted.length>0){
    h+=`<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:8px;font-size:12px;color:var(--text-secondary);">`;
    h+=`💡 <strong>时间预估参考：</strong>`;
    const taskStats=getTaskTimeStats();
    if(Object.keys(taskStats).length===0){
      h+=`完成更多任务后，系统将根据历史数据自动修正预计时长建议。`;
    }else{
      Object.entries(taskStats).slice(0,3).forEach(([name,stat])=>{
        h+=`<span style="margin:0 8px;">「${escapeHtml(name)}」平均实际 <b>${fmtMin(Math.round(stat.avg))}</b>（偏差${stat.deviation>0?'+':''}${Math.round(stat.deviation)}%）</span>`;
      });
    }
    h+=`</div>`;
  }

  h+=`</div></section>`;
  return h;
}

function getTaskTimeStats(){
  const stats={};
  DATA.dailyPlans.forEach(p=>{
    if(!p.content||!p.actualMin||!p.plannedMin)return;
    const key=p.content.slice(0,30);
    if(!stats[key])stats[key]={total:0,count:0,planned:0};
    stats[key].total+=p.actualMin;
    stats[key].count++;
    stats[key].planned+=p.plannedMin;
  });
  const result={};
  Object.entries(stats).forEach(([k,v])=>{
    if(v.count>=2){
      const avg=v.total/v.count;
      const avgPlanned=v.planned/v.count;
      result[k]={avg,deviation:avgPlanned>0?(avg-avgPlanned)/avgPlanned*100:0};
    }
  });
  return result;
}

// AI Daily Plan Generation
function aiGenerateDailyPlan(){
  if(!confirm('AI将根据阶段目标、学习进度和艾宾浩斯遗忘曲线为你生成今日计划，确定？'))return;
  const t=dailyViewDate;
  // Remove existing AI-generated plans for today
  DATA.dailyPlans=DATA.dailyPlans.filter(p=>!(p.date===t&&p.source==='ai'));

  const slots=['08:00-10:00','10:30-12:30','14:00-16:00','16:30-18:00','19:30-21:30','21:30-22:30'];
  const priorities=['high','high','medium','medium','low','low'];
  const newPlans=[];

  // 1. Check active phase goals
  const activePhase=DATA.phaseGoals.filter(pg=>todayStr()>=pg.startDate&&todayStr()<=pg.endDate&&!pg.done);
  // 2. For each phase goal, check linked big plans
  const candidatePlans=[];
  activePhase.forEach(pg=>{
    (pg.bigPlanIds||[]).forEach(bpid=>{
      const bp=DATA.bigPlans.find(x=>x.id===bpid);
      if(bp&&calcPct(bp.completedTasks,bp.totalTasks)<100){
        bp.projects.forEach(pr=>{
          // Check how much has been invested vs target
          const ratio=(bp.targetMin||1)>0?pr.investedMin/bp.targetMin:0;
          if(ratio<1){
            candidatePlans.push({
              content:bp.name+' - '+pr.name,
              bigPlanId:bp.id,
              projectName:pr.name,
              plannedMin:Math.min(120,Math.round((bp.targetMin||3600)*(1-ratio)/30)),
              subjectId:bp.subjectId,
              priority:ratio<0.3?'high':ratio<0.6?'medium':'low',
            });
          }
        });
      }
    });
  });

  // 3. Add Ebbinghaus review tasks
  const ebbTasks=getEbbinghausTasks(t);
  ebbTasks.forEach(et=>{
    candidatePlans.push({
      content:'复习：'+et.name,
      bigPlanId:et.bigPlanId||'',
      projectName:'',
      plannedMin:et.duration||30,
      subjectId:et.subjectId||'',
      priority:'high',
      source:'ebbinghaus',
      ebbinghausRef:et.refId,
    });
  });

  // 4. Sort by priority and distribute to time slots
  const order={high:0,medium:1,low:2};
  candidatePlans.sort((a,b)=>(order[a.priority]||1)-(order[b.priority]||1));

  // 5. Assign to time slots (bio-clock aware)
  const bioClock=DATA.userBioClock||{};
  const defaultBio={0:['英语','政治'],1:['数学'],2:['专业课'],3:['复习','错题'],4:['英语','政治']};
  const slotAssign=[];
  candidatePlans.forEach((cp,i)=>{
    if(i<slots.length){
      const subj=DATA.subjects.find(s=>s.id===cp.subjectId);
      const subjName=subj?subj.name:'';
      // Find best slot for this subject
      let bestSlot=i;
      for(let j=0;j<slots.length;j++){
        const preferred=defaultBio[j]||[];
        if(preferred.some(p=>subjName.includes(p))){bestSlot=j;break;}
      }
      slotAssign.push({...cp,slotIndex:Math.min(bestSlot,slots.length-1)});
    }
  });

  // Deduplicate slots
  const usedSlots={};
  slotAssign.forEach(sa=>{
    let si=sa.slotIndex;
    while(usedSlots[si]&&si<slots.length-1)si++;
    usedSlots[si]=true;
    newPlans.push({
      id:genId(),
      date:t,
      timeSlot:slots[si]||slots[slots.length-1],
      content:sa.content,
      bigPlanId:sa.bigPlanId,
      projectName:sa.projectName,
      plannedMin:sa.plannedMin,
      actualMin:0,
      done:false,
      priority:sa.priority||'medium',
      source:sa.source||'ai',
      ebbinghausRef:sa.ebbinghausRef||'',
    });
  });

  // Remove existing today's AI plans, add new ones
  DATA.dailyPlans=DATA.dailyPlans.filter(p=>!(p.date===t&&(p.source==='ai'||p.source==='ebbinghaus')));
  DATA.dailyPlans.push(...newPlans);

  // Update Ebbinghaus queue
  ebbTasks.forEach(et=>{
    const eq=DATA.ebbinghausQueue.find(q=>q.refId===et.refId&&q.date===t);
    if(eq)eq.injected=true;
  });

  saveData();renderAll();
  setTimeout(()=>scrollToSection('daily'),100);
  showToast(`AI已生成 ${newPlans.length} 个任务`,'success');
}

// Ebbinghaus forgetting curve
function getEbbinghausTasks(date){
  const tasks=[];
  const intervals=[1,2,4,7,15]; // 遗忘曲线复习间隔
  if(!DATA.ebbinghausQueue)DATA.ebbinghausQueue=[];

  // Generate review tasks for: wrong questions, completed daily tasks with knowledge tags, and knowledge tree nodes
  DATA.wrongQuestions.forEach(e=>{
    if(!e.reviewCount)return;
    intervals.forEach((iv,i)=>{
      if(e.reviewCount>i){
        const reviewDate=shiftDate(e.createdAt||todayStr(),iv);
        if(reviewDate===date){
          const existing=DATA.ebbinghausQueue.find(q=>q.refId===e.id&&q.date===date);
          if(!existing||!existing.injected){
            if(!existing)DATA.ebbinghausQueue.push({refId:e.id,date,type:'error',injected:false});
            tasks.push({name:e.question?.slice(0,40)||'错题复习',duration:20,subjectId:e.subjectId,bigPlanId:'',refId:e.id});
          }
        }
      }
    });
  });

  // Knowledge tree nodes marked as learning/weak
  if(DATA.knowledgeTree){
    Object.entries(DATA.knowledgeTree).forEach(([sid,tree])=>{
      const mastery=tree._mastery||{};
      Object.entries(mastery).forEach(([nodeName,m])=>{
        if(m===1){ // learning state - needs review
          const refId=sid+'_'+nodeName;
          if(!DATA.ebbinghausQueue.find(q=>q.refId===refId&&q.date===date&&q.injected)){
            if(!DATA.ebbinghausQueue.find(q=>q.refId===refId&&q.date===date))
              DATA.ebbinghausQueue.push({refId,date,type:'knowledge',injected:false});
            tasks.push({name:nodeName+' (知识复习)',duration:25,subjectId:sid,bigPlanId:'',refId});
          }
        }
      });
    });
  }

  // Daily plans marked for ebbinghaus review
  DATA.dailyPlans.filter(p=>p.done&&p.ebbinghausRef).forEach(p=>{
    intervals.forEach(iv=>{
      const reviewDate=shiftDate(p.date,iv);
      if(reviewDate===date){
        const refId='dp_'+p.id+'_iv'+iv;
        if(!DATA.ebbinghausQueue.find(q=>q.refId===refId&&q.date===date&&q.injected)){
          if(!DATA.ebbinghausQueue.find(q=>q.refId===refId&&q.date===date))
            DATA.ebbinghausQueue.push({refId,date,type:'task',injected:false});
          tasks.push({name:p.content?.slice(0,40)||'任务复习',duration:Math.round(p.plannedMin*0.3),subjectId:DATA.bigPlans.find(bp=>bp.id===p.bigPlanId)?.subjectId||'',bigPlanId:p.bigPlanId||'',refId});
        }
      }
    });
  });

  return tasks;
}

function injectEbbinghausTasks(){
  const t=todayStr();
  const ebbTasks=getEbbinghausTasks(t);
  const slots=['08:00-10:00','10:30-12:30','14:00-16:00','16:30-18:00','19:30-21:30'];
  let added=0;
  ebbTasks.forEach((et,i)=>{
    if(i<slots.length){
      DATA.dailyPlans.push({
        id:genId(),date:t,timeSlot:slots[i],content:'🧠 复习：'+et.name,
        bigPlanId:et.bigPlanId,plannedMin:et.duration,actualMin:0,done:false,
        priority:'high',source:'ebbinghaus',ebbinghausRef:et.refId
      });
      const eq=DATA.ebbinghausQueue.find(q=>q.refId===et.refId&&q.date===t);
      if(eq)eq.injected=true;
      added++;
    }
  });
  saveData();renderAll();
  setTimeout(()=>scrollToSection('daily'),100);
  showToast(`已添加 ${added} 个复习任务`,'success');
}

function renderDailyTable(sorted){
  const sel=`${batchMode?'<th style="width:30px;">☐</th>':''}`;

    const bp=p.bigPlanId?DATA.bigPlans.find(x=>x.id===p.bigPlanId):null;
    const tt=p.taskTimers;
    const isRunning=tt&&tt.running;
    const isPaused=tt&&tt.paused&&!tt.running;
    const planned=p.plannedMin||0,actual=p.actualMin||0;
    const devPct=planned>0?Math.round((actual-planned)/planned*100):0;
    const devCls=Math.abs(devPct)<=10?'green':Math.abs(devPct)<=30?'orange':'red';

    h+=`<tr style="${p.done?'opacity:.55;':''}${p.source==='ebbinghaus'?'border-left:3px solid var(--purple);':''}">`;
    h+=bcb;
    h+=`<td style="font-size:11.5px;white-space:nowrap;">${escapeHtml(p.timeSlot||'--')}</td>`;
    const isFocusLinked=focusLinkedTaskId===p.id&&focusRunning;
    h+=`<td style="font-size:13px;">${escapeHtml(p.content||'--')}${p.source==='ebbinghaus'?' 🧠':''}${isFocusLinked?' <span class="focus-linked-dot" title="专注中" style="animation:pulse-dot 1.2s infinite;">🟠</span>':''}</td>`;

    h+=`<td><span class="tag ${p.priority==='high'?'red':p.priority==='medium'?'orange':'blue'}">${priLabel[p.priority]||'⭐中'}</span></td>`;
    h+=`<td>${fmtMin(planned)}</td><td style="font-weight:600;">${fmtMin(actual)}</td>`;
    h+=`<td style="font-size:11px;color:var(--${devCls});">${actual>0?(devPct>0?'+'+devPct:devPct)+'%':'--'}</td>`;

    if(!p.done){
      if(isRunning){
        timerBtns=`<button class="btn btn-sm btn-primary" onclick="pauseTaskTimer('${p.id}')" style="padding:4px 6px;">⏸ 暂停</button>`;
      }else if(isPaused){
        timerBtns=`<button class="btn btn-sm btn-outline" onclick="resumeTaskTimer('${p.id}')" style="padding:4px 6px;">▶ 继续</button><button class="btn btn-sm btn-outline" onclick="stopTaskTimer('${p.id}')" style="padding:4px 6px;color:var(--red);border-color:var(--red);margin-left:3px;">⏹ 结束</button>`;
      }else{
        timerBtns=`<button class="btn btn-sm btn-outline" onclick="startTaskTimerWithFocus('${p.id}')" style="padding:4px 8px;">▶ 开始</button>`;
      }
    }

    h+=`<td style="white-space:nowrap;">`;
    h+=`<button class="btn btn-sm btn-outline" onclick="showDailyPlanForm('${p.id}')" style="padding:4px 7px;" title="编辑">✏️</button>`;
    h+=`<button class="btn btn-sm btn-outline" onclick="deleteDP('${p.id}')" style="color:var(--red);border-color:var(--red);padding:4px 7px;">🗑</button></td></tr>`;
  });
  h+=`</tbody></table>`;
  return h;
}

function getKanbanStatus(p){
  if(p.status==='todo'||p.status==='doing'||p.status==='done')return p.status;
  if(p.done)return 'done';
  if(p.taskTimers&&p.taskTimers.running)return 'doing';
  return 'todo';
}

function renderKanbanBoard(sorted){
  const cols=[
    {id:'todo',title:'📋 待办',cls:'kanban-col-todo',emptyText:'暂无待办任务'},
    {id:'doing',title:'🔄 进行中',cls:'kanban-col-doing',emptyText:'暂无进行中任务'},

  ];
  let h=`<div class="kanban-board">`;
  cols.forEach(col=>{
    const items=sorted.filter(p=>getKanbanStatus(p)===col.id);
    h+=`<div class="kanban-column ${col.cls}" data-col="${col.id}" ondragover="handleKanbanDragOver(event)" ondragleave="event.currentTarget.classList.remove('drag-over')" ondrop="handleKanbanDrop(event,'${col.id}')">`;

      h+=`<div class="kanban-empty">${col.emptyText}</div>`;
    }else{
      items.forEach(p=>{

        h+=`<div class="kanban-card" draggable="true" id="kcard-${p.id}" ondragstart="handleKanbanDragStart(event,'${p.id}')" ondragend="handleKanbanDragEnd(event)">`;
        h+=`<div class="kc-priority-bar ${p.priority||'medium'}"></div>`;
        if(hasDep){h+=`<div style="font-size:10px;color:var(--orange-500);margin-bottom:2px;">🔗 前置: ${escapeHtml((sorted.find(x=>x.id===p.dependsOn)||{}).content||'').slice(0,20)}${depDone?' ✓':''}</div>`;}
        if(p.timeSlot)h+=`<div class="kc-time">🕐 ${escapeHtml(p.timeSlot)}</div>`;

        h+=`<div class="kc-content">${escapeHtml(p.content||'无标题')}${p.source==='ebbinghaus'?' 🧠':''}${isFocusLinkedK?' <span class="focus-linked-dot" title="专注中" style="animation:pulse-dot 1.2s infinite;">🟠</span>':''}</div>`;
        h+=`<div class="kc-meta">`;
        h+=`<span class="kc-duration">⏱ ${fmtMin(planned)}</span>`;
        if(bp)h+=`<span class="tag ${subjTagClass(bp.subjectId)}" style="font-size:10px;">${escapeHtml(bp.name)}</span>`;
        h+=`</div>`;
        h+=`<div class="kc-actions">`;
        const ttK=p.taskTimers;
        const isRunningK=ttK&&ttK.running;
        const isPausedK=ttK&&ttK.paused&&!ttK.running;
        if(!p.done){
          if(isRunningK){
            h+=`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();pauseTaskTimer('${p.id}')" style="padding:3px 8px;font-size:11px;">⏸ 暂停</button>`;
          }else if(isPausedK){
            h+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();resumeTaskTimer('${p.id}')" style="padding:3px 6px;font-size:11px;">▶ 继续</button>`;
            h+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();stopTaskTimer('${p.id}')" style="padding:3px 6px;font-size:11px;color:var(--red);border-color:var(--red);margin-left:2px;">⏹ 结束</button>`;
          }else{
            h+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();startTaskTimerWithFocus('${p.id}')" style="padding:3px 8px;font-size:11px;">▶ 开始</button>`;
          }
        }
        h+=`<button class="btn btn-sm btn-outline" onclick="event.stopPropagation();showDailyPlanForm('${p.id}')" style="padding:3px 5px;font-size:11px;" title="编辑">✏️</button>`;
        h+=`<input type="checkbox" ${p.done?'checked':''} onchange="kanbanToggleCheck('${p.id}',this.checked)" style="width:15px;height:15px;cursor:pointer;margin-left:auto;" title="标记完成">`;

        h+=`</div></div>`;
      });
    }
    h+=`</div></div>`;
  });
  h+=`</div>`;
  return h;
}

// ==================== DRAG & DROP ====================
let kanbanDragCardId=null;

function handleKanbanDragStart(e,cardId){
  kanbanDragCardId=cardId;
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',cardId);
  setTimeout(()=>{const el=document.getElementById('kcard-'+cardId);if(el)el.classList.add('dragging');},0);
}

function handleKanbanDragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  const col=e.currentTarget;if(col)col.classList.add('drag-over');
}

function handleKanbanDrop(e,newStatus){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!kanbanDragCardId)return;
  const p=DATA.dailyPlans.find(x=>x.id===kanbanDragCardId);
  if(!p)return;
  // Check dependency: can't move to done if dependsOn not done
  if(newStatus==='done'&&p.dependsOn){
    const dep=DATA.dailyPlans.find(x=>x.id===p.dependsOn);
    if(dep&&!dep.done){showToast('请先完成前置任务','error');renderAll();return;}
  }
  p.status=newStatus;
  if(newStatus==='done'){p.done=true;if(p.taskTimers&&p.taskTimers.running)stopTaskTimer(p.id,true);}
  else if(newStatus==='todo'){p.done=false;}
  else if(newStatus==='doing'){p.done=false;}
  // Reset timer state when moving out of doing
  saveData();renderAll();
}

function handleKanbanDragEnd(e){
  if(kanbanDragCardId){const el=document.getElementById('kcard-'+kanbanDragCardId);if(el)el.classList.remove('dragging');}
  kanbanDragCardId=null;
  document.querySelectorAll('.kanban-column').forEach(col=>col.classList.remove('drag-over'));
}

function kanbanToggleCheck(id,checked){
  const p=DATA.dailyPlans.find(x=>x.id===id);if(!p)return;
  if(checked&&p.dependsOn){
    const dep=DATA.dailyPlans.find(x=>x.id===p.dependsOn);
    if(dep&&!dep.done){showToast('请先完成前置任务','error');renderAll();return;}
  }
  p.done=checked;p.status=checked?'done':'todo';
  if(checked&&p.taskTimers&&p.taskTimers.running)stopTaskTimer(p.id,true);
  saveData();renderAll();
  showToast(checked?'任务已完成 ✓':'任务已重新打开','info');
}


// ==================== BATCH OPERATIONS ====================
function toggleBatchMode(){
  batchMode=!batchMode;if(!batchMode)batchSelected={};
  renderAll();setTimeout(()=>scrollToSection('daily'),100);
}
function batchSelectAll(){
  const plans=DATA.dailyPlans.filter(p=>p.date===dailyViewDate);
  plans.forEach(p=>{batchSelected[p.id]=true;});renderAll();setTimeout(()=>scrollToSection('daily'),100);
}
function batchClearAll(){
  batchSelected={};renderAll();setTimeout(()=>scrollToSection('daily'),100);
}
function batchSetDone(){
  const ids=Object.keys(batchSelected).filter(k=>batchSelected[k]);
  if(ids.length===0){showToast('请先选择任务','error');return;}
  let doneCount=0;
  ids.forEach(id=>{
    const p=DATA.dailyPlans.find(x=>x.id===id);
    if(p){p.done=true;p.status='done';doneCount++;}
  });
  batchSelected={};saveData();renderAll();
  showToast(`已批量完成 ${doneCount} 个任务`,'success');
}
function batchDelete(){
  const ids=Object.keys(batchSelected).filter(k=>batchSelected[k]);
  if(ids.length===0){showToast('请先选择任务','error');return;}
  if(!confirm(`确定删除 ${ids.length} 个任务？`))return;
  ids.forEach(id=>{
    const p=DATA.dailyPlans.find(x=>x.id===id);
    if(p){if(!DATA.recycleBin)DATA.recycleBin=[];DATA.recycleBin.push({...p,deletedAt:Date.now()});}
  });
  DATA.dailyPlans=DATA.dailyPlans.filter(x=>!ids.includes(x.id));
  batchSelected={};saveData();renderAll();
  showToast(`已删除 ${ids.length} 个任务（可恢复）`,'info');
}
function batchSetPriority(val){
  if(!val){showToast('请选择优先级','error');return;}
  const ids=Object.keys(batchSelected).filter(k=>batchSelected[k]);

// Per-subject progress (上岸进度条)
function getSubjectProgress(subjectId){
  const plans=DATA.bigPlans.filter(function(bp){return bp.subjectId===subjectId;});
  if(plans.length===0)return{pct:0,invested:0,target:0};
  const target=plans.reduce(function(a,bp){return a+(bp.targetMin||0);},0);
  const invested=plans.reduce(function(a,bp){return a+(bp.projects||[]).reduce(function(s,p){return s+(p.investedMin||0);},0);},0);
  let pct=target>0?Math.round(invested/target*100):0;
  // Also factor in exam scores
  const exams=DATA.mockExams.filter(e=>e.subjectId===subjectId);
  if(exams.length>0){
    const avgScore=exams.reduce((a,e)=>a+calcPct(e.score,e.total),0)/exams.length;
    pct=Math.round(pct*0.7+avgScore*0.3);
  }
  return{pct:Math.min(100,pct),invested,target};
}

// Bio-clock heatmap
function getBioClockData(){
  const bio={};
  for(let h=6;h<24;h++)bio[h]={total:0,quality:0,sessions:0};
  DATA.focusSessions.forEach(s=>{
    const hour=parseInt(s.startTime?.split(':')[0]||'0');
    if(hour>=6&&hour<24){
      bio[hour].total+=Math.round(s.durationSec/60);
      bio[hour].quality+=s.quality||0;
      bio[hour].sessions++;
    }
  });
  return bio;
}

function getBestStudyTime(subjectId){
  const bio=getBioClockData();
  const slots=[];
  for(let h=6;h<24;h++){
    if(bio[h].sessions>0){
      slots.push({hour:h,score:bio[h].total/Math.max(1,bio[h].sessions)*(bio[h].quality/Math.max(1,bio[h].sessions))});
    }
  }
  slots.sort(function(a,b){return b.score-a.score;});
  return slots.slice(0,3);
}

// Lock mode
let lockTimerInterval=null;

function addLockSlot(){
  const start=document.getElementById('ls_start')?.value||'08:00';
  const end=document.getElementById('ls_end')?.value||'11:00';
  if(!DATA.lockSchedule)DATA.lockSchedule=[];
  DATA.lockSchedule.push({start,end});
  saveData();openSettings();
}

function activateLockMode(){
  const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  let targetEnd=null;
  (DATA.lockSchedule||[]).forEach(function(ls){
    const startMin=parseInt(ls.start.split(':')[0])*60+parseInt(ls.start.split(':')[1]);
    const endMin=parseInt(ls.end.split(':')[0])*60+parseInt(ls.end.split(':')[1]);
    if(nowMin>=startMin&&nowMin<endMin){
      const endDate=new Date();endDate.setHours(parseInt(ls.end.split(':')[0]),parseInt(ls.end.split(':')[1]),0,0);
      targetEnd=endDate;
    }
  });
  if(!targetEnd){showToast('当前不在锁机时段内','info');return;}
  const overlay=document.getElementById('lockOverlay');
  if(overlay)overlay.classList.add('active');
  lockTimerInterval=setInterval(function(){
    const diff=Math.max(0,targetEnd-new Date());
    if(diff<=0){deactivateLockMode();return;}
    const h=Math.floor(diff/3600000);const m=Math.floor((diff%3600000)/60000);const s=Math.floor((diff%60000)/1000);
    const el=document.getElementById('lockTimer');if(el)el.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  },1000);
  showToast('已开启锁机模式','info');
}

function deactivateLockMode(){
  if(lockTimerInterval)clearInterval(lockTimerInterval);
  const overlay=document.getElementById('lockOverlay');
  if(overlay)overlay.classList.remove('active');
  showToast('锁机模式已解除','success');
}

function fmtHM(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function startTaskTimer(id){
  const p=DATA.dailyPlans.find(x=>x.id===id);if(!p)return;
  if(!p.taskTimers)p.taskTimers={};
  const now=Date.now();
  p.taskTimers.running=true;p.taskTimers.paused=false;
  p.taskTimers.startTime=now;
  if(!p.taskTimers.realStartTime)p.taskTimers.realStartTime=now;
  if(!p.taskTimers.elapsedSec)p.taskTimers.elapsedSec=0;
  p.taskTimers.interval=setInterval(function(){renderAll();},15000);
  saveData();renderAll();
}
function startTaskTimerWithFocus(id){
  const p=DATA.dailyPlans.find(x=>x.id===id);if(!p)return;
  if(confirm('是否同时开启专注计时？\n（将跳转到专注面板）')){
    focusBigPlanId=p.bigPlanId||'';
    focusProjectName=p.projectName||'';
    focusLinkedTaskId=id;
    startTaskTimer(id);
    scrollToSection('focus');
    setTimeout(function(){if(!focusRunning)startFocus();},400);
  }else{
    startTaskTimer(id);
  }
}
function pauseTaskTimer(id){
  const p=DATA.dailyPlans.find(x=>x.id===id);if(!p||!p.taskTimers||!p.taskTimers.running)return;
  if(p.taskTimers.interval)clearInterval(p.taskTimers.interval);
  p.taskTimers.elapsedSec=(p.taskTimers.elapsedSec||0)+Math.round((Date.now()-p.taskTimers.startTime)/1000);
  p.taskTimers.running=false;p.taskTimers.paused=true;
  saveData();renderAll();
}
function resumeTaskTimer(id){
  const p=DATA.dailyPlans.find(x=>x.id===id);if(!p||!p.taskTimers||!p.taskTimers.paused)return;
  p.taskTimers.running=true;p.taskTimers.paused=false;
  p.taskTimers.startTime=Date.now();
  p.taskTimers.interval=setInterval(function(){renderAll();},15000);
  saveData();renderAll();
}
function stopTaskTimer(id,skipSlot){
  const p=DATA.dailyPlans.find(x=>x.id===id);if(!p||!p.taskTimers)return;
  if(focusRunning&&focusLinkedTaskId===id){
    if(confirm('该任务正在专注计时中，是否同时停止专注？')){
      stopFocus();
      return;
    }
  }
  var totalSec=p.taskTimers.elapsedSec||0;
  if(p.taskTimers.running)totalSec+=Math.round((Date.now()-p.taskTimers.startTime)/1000);
  if(p.taskTimers.interval)clearInterval(p.taskTimers.interval);
  var elapsedMin=Math.round(totalSec/60);
  p.actualMin=(p.actualMin||0)+elapsedMin;if(p.actualMin>=(p.plannedMin||0)*.9)p.done=true;
  if(!skipSlot&&p.taskTimers.realStartTime){
    var startDate=new Date(p.taskTimers.realStartTime);
    var newSlot=fmtHM(startDate)+'-'+fmtHM(new Date());
    if(p.timeSlot&&p.timeSlot.trim()){
      if(confirm('任务已有时段 "'+p.timeSlot+'"，是否覆盖为 "'+newSlot+'"？'))p.timeSlot=newSlot;
    }else{p.timeSlot=newSlot;}
  }
  if(focusLinkedTaskId===id)focusLinkedTaskId='';
  delete p.taskTimers;
  saveData();renderAll();
}

  h+=`<div id="bgmDropdown" style="display:none;position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--surface);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;min-width:140px;">`;

  h+=`</div></div>`;
  h+=`<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">`;
  h+=`<select id="focusPlanSelect" onchange="updateFocusProject()" style="padding:7px 12px;border-radius:8px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:#fff;font-family:inherit;font-size:12px;max-width:180px;">`;
  h+=`<option value="">不关联计划</option>`;
