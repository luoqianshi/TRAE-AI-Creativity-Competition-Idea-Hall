function downloadResourceFile(resourceId){
  AttachmentDB.loadResourceFile(resourceId).then(function(item){
    var url=URL.createObjectURL(item.blob);
    var a=document.createElement('a');
    a.href=url;a.download=item.name;a.click();
    setTimeout(function(){URL.revokeObjectURL(url);},60000);
  }).catch(function(){showToast('文件加载失败','error');});
}

function openResourceAndStartFocus(resourceId){
  var r=DATA.resources.find(function(x){return x.id===resourceId;});
  if(!r){showToast('资料不存在','error');return;}
  AttachmentDB.loadResourceFile(resourceId).then(function(item){
    var url=URL.createObjectURL(item.blob);
    window.open(url,'_blank');
    setTimeout(function(){URL.revokeObjectURL(url);},600000);
  }).catch(function(err){showToast('文件加载失败: '+err.message,'error');return;});

  // 关联今日计划并启动计时
  var t=todayStr();
  var linkedDp=DATA.dailyPlans.find(function(p){return p.date===t&&p.linkedResourceId===resourceId&&!p.done;});
  if(!linkedDp){
    // 自动创建今日任务
    var bp=DATA.bigPlans.find(function(x){return x.subjectId===r.subjectId&&x.completedTasks<x.totalTasks;});
    var bpId=bp?bp.id:(DATA.bigPlans.length>0?DATA.bigPlans[0].id:'');
    var prName='';
    if(bp&&bp.projects&&bp.projects.length>0){
      for(var i=0;i<bp.projects.length;i++){if(bp.projects[i].investedMin<(bp.targetMin||3600)/bp.projects.length||!bp.projects[i].investedMin){prName=bp.projects[i].name;break;}}
      if(!prName)prName=bp.projects[0].name;
    }
    linkedDp={id:genId(),date:t,timeSlot:nowStr()+'-',content:'学习《'+r.name+'》',bigPlanId:bpId,projectName:prName,linkedResourceId:resourceId,plannedMin:60,actualMin:0,done:false,priority:'high'};
    DATA.dailyPlans.push(linkedDp);
  }
  focusBigPlanId=linkedDp.bigPlanId||'';
  focusProjectName=linkedDp.projectName||'';
  focusLinkedTaskId=linkedDp.id;
  saveData();
  startFocus();
}

function generateWeeklyReport(){
  const totalMin=getWeekFocusMin();
  const subjectDist={};DATA.subjects.forEach(s=>subjectDist[s.id]=0);
  DATA.focusSessions.forEach(s=>{
    if(s.bigPlanId){const bp=DATA.bigPlans.find(x=>x.id===s.bigPlanId);if(bp)subjectDist[bp.subjectId]=(subjectDist[bp.subjectId]||0)+Math.round(s.durationSec/60);}
  });
  DATA.dailyPlans.forEach(p=>{if(p.bigPlanId&&p.actualMin){const bp=DATA.bigPlans.find(x=>x.id===p.bigPlanId);if(bp)subjectDist[bp.subjectId]=(subjectDist[bp.subjectId]||0)+p.actualMin;}});
  const topSubj=Object.entries(subjectDist).sort((a,b)=>b[1]-a[1])[0];
  const weakSubj=Object.entries(subjectDist).sort((a,b)=>a[1]-b[1])[0];
  const totalErrors=DATA.wrongQuestions.length;
  const weakPoints=DATA.wrongQuestions.reduce((acc,e)=>{if(e.knowledgeTag){acc[e.knowledgeTag]=(acc[e.knowledgeTag]||0)+1;}return acc;},{});
  const topWeak=Object.entries(weakPoints).sort((a,b)=>b[1]-a[1]).slice(0,3);

  let summary=`本周学习${fmtMin(totalMin)}，`;
  if(topSubj)summary+=`${subjName(topSubj[0])}投入最多(${fmtMin(topSubj[1])})。`;
  summary+=`新增错题${totalErrors}道。`;

  let suggestions='';
  if(weakSubj) suggestions=`建议增加${subjName(weakSubj[0])}学习时间，`;
  if(topWeak.length>0) suggestions+=`重点复习：${topWeak.map(w=>w[0]).join('、')}。`;
  suggestions+='继续保持当前节奏！';

  const report={id:genId(),date:todayStr(),period:'本周报告',summary,totalScore:Math.min(100,Math.round(totalMin/10)),suggestions,subjectDist};
  if(!DATA.reports)DATA.reports=[];
  DATA.reports.push(report);
  saveData();renderAll();showToast('周报已生成！','success');
}

function renderAnalyticsHeatmap(){
  const days=['一','二','三','四','五','六','日'];
  const hours=[];for(let hh=6;hh<=23;hh++)hours.push(hh);
  // Aggregate focus minutes by day-of-week + hour
  const grid={};hours.forEach(hh=>{grid[hh]={};days.forEach((d,i)=>{grid[hh][i]=0;});});
  DATA.focusSessions.forEach(s=>{
    const d=new Date(s.date+'T'+(s.startTime||'08:00'));
    if(isNaN(d.getTime()))return;
    const dayIdx=(d.getDay()+6)%7; // Mon=0
    const hour=d.getHours();if(hour<6||hour>23)return;
    grid[hour][dayIdx]+=Math.round(s.durationSec/60);
  });
  let h=`<div class="card" style="overflow-x:auto;"><div class="card-header"><span class="card-title">🔥 学习热力图（分钟）</span><span style="font-size:11px;color:var(--text-muted);">数据来自专注记录</span></div>`;
  h+=`<div style="display:grid;grid-template-columns:40px repeat(7,1fr);gap:3px;font-size:10.5px;align-items:center;">`;
  // Header row
  h+=`<div></div>`;
  days.forEach(d=>h+=`<div style="text-align:center;font-weight:600;padding:4px 0;color:var(--text-secondary);">周${d}</div>`);
  // Hour rows
  hours.forEach(hh=>{
    h+=`<div style="text-align:right;padding-right:4px;color:var(--text-muted);line-height:1;">${String(hh).padStart(2,'0')}:00</div>`;
    for(let i=0;i<7;i++){
      const v=grid[hh][i]||0;
      let bg,c;
      if(v===0){bg='var(--border-light)';c='transparent'}
      else if(v<=30){bg='#fed7aa';c='var(--orange-600)'}
      else if(v<=60){bg='#fb923c';c='#fff'}
      else{bg='#ea580c';c='#fff'}
      const title=`周${days[i]} ${String(hh).padStart(2,'0')}:00 · ${v}分钟`;
      h+=`<div title="${title}" style="background:${bg};border-radius:3px;text-align:center;padding:7px 2px;font-size:9px;color:${c};font-weight:${v>60?700:400};cursor:default;transition:transform .15s;" onmouseenter="this.style.transform='scale(1.15)'" onmouseleave="this.style.transform='scale(1)'">${v>0?v:''}</div>`;
    }
  });
  h+=`</div>`;
  // Legend
  h+=`<div style="display:flex;gap:10px;align-items:center;margin-top:12px;font-size:10px;color:var(--text-muted);">`;
  h+=`<span>图例：</span>`;
  [{l:'0 min',bg:'var(--border-light)',c:''},{l:'1-30',bg:'#fed7aa',c:''},{l:'30-60',bg:'#fb923c',c:''},{l:'>60',bg:'#ea580c',c:''}].forEach(leg=>{
    h+=`<span style="display:flex;align-items:center;gap:3px;"><span style="width:14px;height:14px;border-radius:3px;background:${leg.bg};display:inline-block;"></span>${leg.l}</span>`;
  });
  h+=`</div></div>`;
  return h;
}

function handleGlobalSearch(){
  const q=document.getElementById('globalSearch')?.value?.trim()||'';
  const panel=document.getElementById('searchResults');if(!panel)return;
  if(q.length<1){panel.classList.remove('open');panel.innerHTML='';return;}
  const results=[];
  const highlight=(text,query)=>{const idx=text.toLowerCase().indexOf(query.toLowerCase());if(idx<0)return text;return text.slice(0,idx)+'<span class="sr-highlight">'+text.slice(idx,idx+query.length)+'</span>'+text.slice(idx+query.length);};
  // Search daily plans
  DATA.dailyPlans.forEach(p=>{
    if(p.content&&p.content.toLowerCase().includes(q.toLowerCase())){
      results.push({type:'task',typeLabel:'任务',typeCls:'orange',text:highlight(escapeHtml(p.content).slice(0,60),q),action:()=>{dailyViewDate=p.date;scrollToSection('daily');setTimeout(()=>highlightTaskRow(p.id),400);},date:p.date});
    }
  });
  // Search wrong questions
  DATA.wrongQuestions.forEach(e=>{
    if(e.question&&e.question.toLowerCase().includes(q.toLowerCase())){
      results.push({type:'error',typeLabel:'错题',typeCls:'red',text:highlight(escapeHtml(e.question).slice(0,60),q),action:()=>{errorFilter=e.subjectId;scrollToSection('errors');},subj:subjName(e.subjectId)});
    }
  });
  // Search resources
  DATA.resources.forEach(r=>{
    if(r.name&&r.name.toLowerCase().includes(q.toLowerCase())){
      results.push({type:'resource',typeLabel:'资料',typeCls:'blue',text:highlight(escapeHtml(r.name),q),action:()=>{resFilter='';scrollToSection('resources');},subj:subjName(r.subjectId)});
    }
  });
  // Search knowledge tree
  if(DATA.knowledgeTree){Object.entries(DATA.knowledgeTree).forEach(([sid,tree])=>{
    if(tree._mastery){Object.keys(tree._mastery).forEach(k=>{
      if(k.toLowerCase().includes(q.toLowerCase())){
        results.push({type:'knowledge',typeLabel:'知识点',typeCls:'purple',text:highlight(escapeHtml(k),q),action:()=>{knowledgeTreeSubject=sid;scrollToSection('knowledge');},subj:subjName(sid)});
      }
    });}
  });}

  if(results.length===0){panel.innerHTML='<div class="search-empty">未找到匹配结果</div>';panel.classList.add('open');return;}
  let h='';
  results.slice(0,15).forEach(r=>{
    h+=`<div class="sr-item" onmousedown="event.preventDefault();" onclick="(${r.action.toString()})();document.getElementById('searchResults').classList.remove('open');">`;
    h+=`<span class="sr-type tag ${r.typeCls}">${r.typeLabel}</span>`;
    h+=`<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.text}</span>`;
    if(r.subj)h+=`<span style="font-size:10px;color:var(--text-muted);">${r.subj}</span>`;
    if(r.date)h+=`<span style="font-size:10px;color:var(--text-muted);">${r.date}</span>`;
    h+=`</div>`;
  });
  panel.innerHTML=h;panel.classList.add('open');
}

// ==================== INIT ====================
function migrateAttachments(){
  if(DATA.attachmentVersion&&DATA.attachmentVersion>=1)return Promise.resolve();
  var toMigrate=[];
  DATA.wrongQuestions.forEach(function(e){
    if((e.questionAttachments&&e.questionAttachments.length>0)||(e.answerAttachments&&e.answerAttachments.length>0)){
      toMigrate.push(e);
    }
  });
  if(toMigrate.length===0){DATA.attachmentVersion=1;saveData();return Promise.resolve();}
  showToast('正在迁移附件到本地数据库...','info');
  var migrateOne=function(index){
    if(index>=toMigrate.length){
      DATA.attachmentVersion=1;saveData();
      showToast('附件迁移完成','success');
      return Promise.resolve();
    }
    var e=toMigrate[index];
    var migrateField=function(field){
      var atts=field==='question'?e.questionAttachments:e.answerAttachments;
      if(!atts||atts.length===0)return Promise.resolve();
      var files=[];
      atts.forEach(function(att){
        if(att.data&&att.data.startsWith('data:')){
          // base64 格式旧数据
          try{
            var parts=att.data.split(',');
            var mime=parts[0].match(/data:([^;]+)/);
            var type=mime?mime[1]:'image/png';
            var byteStr=atob(parts[1]);
            var ab=new ArrayBuffer(byteStr.length);
            var ia=new Uint8Array(ab);
            for(var j=0;j<byteStr.length;j++){ia[j]=byteStr.charCodeAt(j);}
            var blob=new Blob([ab],{type:type});
            files.push(new File([blob],att.name||'image.png',{type:type}));
          }catch(ex){}
        }else if(att.name){
          // 仅有文件名，文件可能已在 IndexedDB
        }
      });
      if(files.length===0)return Promise.resolve();
      return AttachmentDB.save(e.id,field,files);
    };
    return migrateField('question').then(function(){return migrateField('answer');}).then(function(){
      // 清理 base64 数据，只保留文件名
      if(e.questionAttachments)e.questionAttachments=e.questionAttachments.map(function(a){return {name:a.name};});
      if(e.answerAttachments)e.answerAttachments=e.answerAttachments.map(function(a){return {name:a.name};});
      return migrateOne(index+1);
    });
  };
  return migrateOne(0);
}

function init(){
  try{
    document.documentElement.setAttribute('data-theme',DATA.theme);
    const t=todayStr();
    if(DATA.dailyPlans.filter(function(p){return p.date===t;}).length===0&&DATA.bigPlans.length>0){
      var pri=['high','high','medium','medium','low'];
      var slots=['08:00-10:00','10:30-12:30','14:00-16:00','16:30-18:00','19:30-21:30'];
      DATA.bigPlans.slice(0,5).forEach(function(bp,i){
        var proj=(bp.projects&&bp.projects.length>0)?bp.projects[i%bp.projects.length].name:'';
        DATA.dailyPlans.push({id:genId(),date:t,timeSlot:slots[i]||'',content:bp.name+(proj?' - '+proj:''),bigPlanId:bp.id,projectName:proj,plannedMin:120,actualMin:0,done:false,priority:pri[i]||'medium'});
      });
      saveData();
    }
    migrateAttachments().then(function(){
      renderAll();
      if(typeof Notification !== 'undefined' && Notification.permission==='default')Notification.requestPermission();
    });
  }catch(e){
    var area=document.getElementById('contentArea');
    if(area)area.innerHTML='<div style="padding:40px;text-align:center;background:#fff;"><h2 style="color:red;">加载错误</h2><p>'+e.message+'</p><pre style="font-size:11px;text-align:left;max-width:700px;margin:10px auto;overflow:auto;">'+(e.stack||'')+'</pre><button onclick="localStorage.clear();location.reload();" style="padding:10px 20px;background:#f97316;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;">清除数据并刷新</button></div>';
  }
}
init();
</script>
