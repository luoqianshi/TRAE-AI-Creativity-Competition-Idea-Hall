<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊猫背诗 - 智能古诗词背诵助手</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div id="page-home" class="page active">
            <header class="hero">
                <div class="bamboo-decoration left"></div>
                <div class="hero-content">
                    <div class="panda-logo">
                        <div class="panda-face">
                            <div class="ear left"></div>
                            <div class="ear right"></div>
                            <div class="eye-patch left">
                                <div class="eye"></div>
                            </div>
                            <div class="eye-patch right">
                                <div class="eye"></div>
                            </div>
                            <div class="nose"></div>
                            <div class="mouth"></div>
                        </div>
                    </div>
                    <h1 class="title">熊猫背诗</h1>
                    <p class="subtitle">AI语音识别 · 智能纠错 · 快乐背诗</p>
                </div>
                <div class="bamboo-decoration right"></div>
            </header>

            <main class="main-content">
                <div class="search-section">
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" id="searchInput" placeholder="搜索诗名、作者..." />
                    </div>
                </div>

                <div class="filter-section">
                    <div class="filter-tags" id="gradeFilter">
                        <span class="filter-tag active" data-grade="all">全部</span>
                        <span class="filter-tag" data-grade="一年级">一年级</span>
                        <span class="filter-tag" data-grade="二年级">二年级</span>
                        <span class="filter-tag" data-grade="三年级">三年级</span>
                        <span class="filter-tag" data-grade="四年级">四年级</span>
                        <span class="filter-tag" data-grade="五年级">五年级</span>
                        <span class="filter-tag" data-grade="六年级">六年级</span>
                        <span class="filter-tag" data-grade="初中">初中</span>
                        <span class="filter-tag" data-grade="高中">高中</span>
                    </div>
                </div>

                <div class="poem-section">
                    <h2 class="section-title">
                        <span class="title-icon">📜</span>
                        热门必背
                    </h2>
                    <div class="poem-grid" id="poemGrid"></div>
                </div>
            </main>
        </div>

        <div id="page-recite" class="page">
            <div class="recite-header">
                <button class="back-btn" id="backToHome">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m15 18-6-6 6-6"/>
                    </svg>
                    返回
                </button>
                <div class="poem-info">
                    <h2 id="reciteTitle" class="recite-title"></h2>
                    <p id="reciteAuthor" class="recite-author"></p>
                </div>
                <div class="progress-indicator">
                    <span id="progressText">0/0</span>
                </div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="recite-content">
                <div class="poem-display" id="poemDisplay"></div>
                
                <div class="live-feedback">
                    <div class="feedback-label">
                        <span class="mic-indicator" id="micIndicator"></span>
                        <span id="feedbackLabel">点击开始背诵</span>
                    </div>
                    <div class="recognized-text" id="recognizedText"></div>
                </div>

                <div class="panda-companion" id="pandaCompanion">
                    <div class="panda-body">
                        <div class="panda-head">
                            <div class="ear left"></div>
                            <div class="ear right"></div>
                            <div class="eye-patch left"><div class="eye"></div></div>
                            <div class="eye-patch right"><div class="eye"></div></div>
                            <div class="nose"></div>
                            <div class="mouth happy" id="pandaMouth"></div>
                        </div>
                        <div class="panda-tummy"></div>
                    </div>
                    <div class="bubble" id="pandaBubble">准备好背诗了吗？</div>
                </div>
            </div>

            <div class="control-bar">
                <button class="control-btn start-btn" id="startBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    开始背诵
                </button>
                <button class="control-btn demo-btn" id="demoBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    演示模式
                </button>
                <button class="control-btn pause-btn hidden" id="pauseBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16"/>
                        <rect x="14" y="4" width="4" height="16"/>
                    </svg>
                    暂停
                </button>
                <button class="control-btn stop-btn hidden" id="stopBtn">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                    </svg>
                    结束
                </button>
                <button class="control-btn restart-btn hidden" id="restartBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    重新开始
                </button>
            </div>
        </div>

        <div id="page-result" class="page">
            <div class="result-container">
                <div class="result-header">
                    <div class="trophy-icon">🏆</div>
                    <h1 class="result-title">背诵完成！</h1>
                </div>

                <div class="result-stats">
                    <div class="stat-card main-stat">
                        <div class="stat-value" id="accuracyValue">0%</div>
                        <div class="stat-label">正确率</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="durationValue">0s</div>
                        <div class="stat-label">用时</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="correctCount">0/0</div>
                        <div class="stat-label">正确句数</div>
                    </div>
                </div>

                <div class="star-rating" id="starRating"></div>

                <div class="result-poem-info">
                    <h3 id="resultPoemTitle"></h3>
                    <p id="resultPoemAuthor"></p>
                </div>

                <div class="error-section" id="errorSection">
                    <h3 class="error-title">
                        <span>❌</span> 错误详情
                    </h3>
                    <div class="error-list" id="errorList"></div>
                </div>

                <div class="result-actions">
                    <button class="action-btn primary" id="retryBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                        再背一次
                    </button>
                    <button class="action-btn secondary" id="backHomeBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        返回首页
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/poems.js"></script>
    <script src="js/textCompare.js"></script>
    <script src="js/speechRecognition.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
