];

// ============ STATE ============
let state = {
  activeCategory: null,
  searchQuery: '',
  darkMode: false,
  user: null,
  likes: {},
  collects: {},
  shareForm: { title:'', prompt:'', category:'写实', tags:'', negPrompt:'', model:'Stable Diffusion XL', steps:30, sampler:'DPM++ 2M Karras', cfgScale:7, seed:'' },
  loginMode: 'login',
  profileTab: 'uploads',
  advancedOpen: false
};

// ============ UTILS ============
function getImageUrl(item) {
  return `https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=${encodeURIComponent(item.prompt)}&image_size=${item.size}`;
}

function getAspect(item) {
  const s = item.params.size;
  const parts = s.split('x');
  return parseInt(parts[0]) / parseInt(parts[1]);
}

function loadState() {
  try {
    const d = localStorage.getItem('tudin_state');
    if (d) {
      const p = JSON.parse(d);
      state.darkMode = !!p.darkMode;
      state.user = p.user || null;
      state.likes = p.likes || {};
      state.collects = p.collects || {};
    }
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('tudin_state', JSON.stringify({
      darkMode: state.darkMode,
      user: state.user,
      likes: state.likes,
      collects: state.collects
    }));
  } catch(e) {}
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板')).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast('已复制到剪贴板'); } catch(e) { showToast('复制失败'); }
  document.body.removeChild(ta);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--sage-700);color:#fff;padding:10px 24px;border-radius:8px;font-size:14px;z-index:9999;animation:slideUp .3s ease;pointer-events:none;';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1800);
  setTimeout(() => t.remove(), 2200);
}

function isLiked(id) { return !!state.likes[id]; }
function isCollected(id) { return !!state.collects[id]; }
function toggleLike(id) { state.likes[id] = !state.likes[id]; saveState(); }
function toggleCollect(id) { state.collects[id] = !state.collects[id]; saveState(); }

function applyDarkMode() {
  if (state.darkMode) {
    document.documentElement.classList.add('dark');
    document.body.classList.add('dark-mode');
  } else {
    document.documentElement.classList.remove('dark');
    document.body.classList.remove('dark-mode');
  }
}

// ============ ROUTING ============
function getRoute() {
  const h = window.location.hash || '#/';
  if (h === '#/' || h === '#' || h === '') return { page: 'home' };
  const detailMatch = h.match(/^#\/detail\/(.+)$/);
  if (detailMatch) return { page: 'detail', id: detailMatch[1] };
  if (h === '#/share') return { page: 'share' };
  if (h === '#/login') return { page: 'login' };
  if (h === '#/profile') return { page: 'profile' };
  return { page: 'home' };
}

function navigate(hash) {
  window.location.hash = hash;
}

// ============ HOME PAGE ============

      </div>
      <div style="display:flex;justify-content:center;gap:40px;margin-bottom:32px;" class="anim-slide delay-3">
        <div><div style="font-size:28px;font-weight:700;color:${dark?'#d1d7cc':'var(--sage-800)'};">${SEED_DATA.length}</div><div class="text-muted" style="font-size:13px;">提示词</div></div>

function getFilteredData() {
  let data = [...SEED_DATA];
  if (state.activeCategory) data = data.filter(i => i.cat === state.activeCategory);
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    data = data.filter(i =>
      i.title.toLowerCase().includes(q) ||
      i.prompt.toLowerCase().includes(q) ||
      i.tags.some(t => t.toLowerCase().includes(q)) ||
      i.cat.toLowerCase().includes(q) ||
      i.model.toLowerCase().includes(q)
    );
  }
  return data;
}

function buildMasonry(container, items) {
  const dark = state.darkMode;
  const colCount = window.innerWidth >= 1024 ? 4 : window.innerWidth >= 768 ? 3 : 2;
  const cols = Array.from({length: colCount}, () => []);
  const colHeights = new Array(colCount).fill(0);

  items.forEach(item => {
    const aspect = getAspect(item);
    const shortestIdx = colHeights.indexOf(Math.min(...colHeights));
    cols[shortestIdx].push(item);
    colHeights[shortestIdx] += 1 / aspect;
  });

  container.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'display:grid;grid-template-columns:repeat(' + colCount + ',1fr);gap:16px;';

  cols.forEach(col => {
    const colDiv = document.createElement('div');
    colDiv.className = 'masonry-col';
    col.forEach(item => {
      const aspect = getAspect(item);
      const card = document.createElement('div');
      card.className = 'img-card card-bg anim-scale';
      card.innerHTML = `
        <div style="position:relative;padding-top:${(1/aspect)*100}%;">
          <img src="${getImageUrl(item)}" alt="${item.title}" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--sage-100);"/>
        </div>
        <div class="like-btn-overlay">
          <button data-like="${item.id}" style="background:${isLiked(item.id)?'rgba(220,80,80,.9)':'rgba(255,255,255,.9)'};border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;">${isLiked(item.id)?'❤️':'🤍'}</button>
        </div>
        <div class="img-overlay">
          <div style="width:100%;">
            <div style="font-size:14px;font-weight:600;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:11px;color:rgba(255,255,255,.8);background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px;">${item.cat}</span>
              <span style="font-size:11px;color:rgba(255,255,255,.7);">❤️ ${item.likes + (isLiked(item.id)?1:0)}</span>
            </div>
          </div>
        </div>`;
      card.addEventListener('click', (e) => {
        if (e.target.closest('[data-like]')) {
          e.stopPropagation();
          toggleLike(item.id);
          render();
          return;
        }
        navigate('#/detail/' + item.id);
      });
      colDiv.appendChild(card);
    });
    wrapper.appendChild(colDiv);
  });
  container.appendChild(wrapper);
}

// ============ HELPERS ============
function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============ MAIN RENDER ============
function render() {
  applyDarkMode();
  const route = getRoute();
  const root = document.getElementById('root');
  let pageContent = '';

  switch(route.page) {
    case 'home': pageContent = renderHome(); break;
    case 'detail': pageContent = renderDetail(route.id); break;
    case 'share': pageContent = renderShare(); break;
    case 'login': pageContent = renderLogin(); break;
    case 'profile': pageContent = renderProfile(); break;
    default: pageContent = renderHome();
  }

  root.innerHTML = renderNavbar() + pageContent;

  // Post-render: masonry grid
  if (route.page === 'home') {
    const grid = document.getElementById('masonryGrid');
    if (grid) {
      const filtered = getFilteredData();
      if (filtered.length > 0) buildMasonry(grid, filtered);
    }
  }

  attachEvents();
}

// ============ EVENT HANDLING ============
let searchTimer = null;
let resizeTimer = null;

function attachEvents() {
  const root = document.getElementById('root');

  // Search
  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.searchQuery = e.target.value;
        const grid = document.getElementById('masonryGrid');
        const filtered = getFilteredData();
        if (grid) {
          if (filtered.length > 0) buildMasonry(grid, filtered);
          else grid.innerHTML = '';
        }
        // Also toggle empty message
        const existing = grid?.parentElement?.querySelector('[style*="text-align:center"]');
        // Re-render is simpler for empty state
        render();
        // Restore focus
        const si = document.getElementById('searchInput');
        if (si) { si.focus(); si.selectionStart = si.selectionEnd = si.value.length; }
      }, 300);
    });
  }

  // Category filter
  root.querySelectorAll('[data-category]').forEach(el => {
    el.addEventListener('click', () => {
      const cat = el.dataset.category;
      state.activeCategory = cat || null;
      render();
    });
  });

  // Tag search from hero
  root.querySelectorAll('[data-tag]').forEach(el => {
    el.addEventListener('click', () => {
      state.searchQuery = el.dataset.tag;
      render();
      const si = document.getElementById('searchInput');
      if (si) { si.focus(); si.selectionStart = si.selectionEnd = si.value.length; }
    });
  });

  // Tag search from detail
  root.querySelectorAll('[data-tag-search]').forEach(el => {
    el.addEventListener('click', () => {
      state.searchQuery = el.dataset.tagSearch;
      navigate('#/');
    });
  });

  // Copy buttons
  root.querySelectorAll('[data-copy]').forEach(el => {
    el.addEventListener('click', () => {
      copyText(el.dataset.copy);
    });
  });

  // Like/Collect on detail page
  root.querySelectorAll('[data-action="like"]').forEach(el => {
    el.addEventListener('click', () => {
      toggleLike(el.dataset.id);
      render();
    });
  });
  root.querySelectorAll('[data-action="collect"]').forEach(el => {
    el.addEventListener('click', () => {
      toggleCollect(el.dataset.id);
      render();
    });
  });

  // Share page
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  if (dropZone && fileInput) {
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });
  }

  const toggleAdv = document.getElementById('toggleAdvanced');
  if (toggleAdv) {
    toggleAdv.addEventListener('click', () => {
      state.advancedOpen = !state.advancedOpen;
      render();
    });
  }

  const submitShare = document.getElementById('submitShare');
  if (submitShare) {
    submitShare.addEventListener('click', () => {
      const title = document.getElementById('shareTitle')?.value?.trim();
      const prompt = document.getElementById('sharePrompt')?.value?.trim();
      if (!prompt) { showToast('请输入提示词'); return; }
      showToast('分享成功！');
      state.shareForm = { title:'', prompt:'', category:'写实', tags:'', negPrompt:'', model:'Stable Diffusion XL', steps:30, sampler:'DPM++ 2M Karras', cfgScale:7, seed:'' };
      navigate('#/');
    });
  }

  // Login page
  root.querySelectorAll('[data-login-tab]').forEach(el => {
    el.addEventListener('click', () => {
      state.loginMode = el.dataset.loginTab;
      render();
    });
  });

  const authSubmit = document.getElementById('authSubmit');
  if (authSubmit) {
    authSubmit.addEventListener('click', () => {
      const email = document.getElementById('loginEmail')?.value?.trim();
      const password = document.getElementById('loginPassword')?.value?.trim();
      if (!email || !password) { showToast('请填写所有字段'); return; }
      if (state.loginMode === 'register') {
        const username = document.getElementById('regUsername')?.value?.trim();
        if (!username) { showToast('请填写用户名'); return; }
        state.user = { username, email };
        saveState();
        showToast('注册成功！');
        navigate('#/');
      } else {
        state.user = { username: email.split('@')[0], email };
        saveState();
        showToast('登录成功！');
        navigate('#/');
      }
    });
  }

  // Profile page
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', () => {
      state.user = null;
      saveState();
      showToast('已退出登录');
      navigate('#/');
    });
  }

  root.querySelectorAll('[data-profile-tab]').forEach(el => {
    el.addEventListener('click', () => {
      state.profileTab = el.dataset.profileTab;
      render();
    });
  });
}

function handleFile(file) {
  if (!file.type.startsWith('image/')) { showToast('请上传图片文件'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    const preview = document.getElementById('previewArea');
    const img = document.getElementById('previewImg');
    const dropZone = document.getElementById('dropZone');
    if (preview && img && dropZone) {
      img.src = e.target.result;
      preview.style.display = 'block';
      dropZone.style.display = 'none';
    }
  };
  reader.readAsDataURL(file);
}

// Global functions called from inline onclick
window.clearUpload = function() {
  const preview = document.getElementById('previewArea');
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  if (preview) preview.style.display = 'none';
  if (dropZone) dropZone.style.display = '';
  if (fileInput) fileInput.value = '';
};

window.toggleDarkMode = function() {
  state.darkMode = !state.darkMode;
  saveState();
  render();
};

// ============ INIT ============
loadState();
render();

window.addEventListener('hashchange', () => {
  render();
});

window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const route = getRoute();
    if (route.page === 'home') {
      const grid = document.getElementById('masonryGrid');
      if (grid) {
        const filtered = getFilteredData();
        if (filtered.length > 0) buildMasonry(grid, filtered);
      }
    }
  }, 150);
});
</script>
</body>
