<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻夏 - 你的情绪搭子</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 欢迎引导页 -->
    <div id="welcome-page" class="page active">
        <div class="welcome-container">
            <div class="logo-area">
                <div class="logo-icon">🌿</div>
                <h1 class="app-name">轻夏</h1>
                <p class="app-slogan">你的情绪搭子，陪你聊、帮你想、给ta一双翅膀</p>
            </div>
            <div class="feature-cards">
                <div class="feature-card">
                    <div class="feature-icon">💬</div>
                    <div class="feature-title">AI 陪伴聊天</div>
                    <div class="feature-desc">全景式动态陪伴：倾听者、老友、成长搭子，穿透情绪看懂你</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">💝</div>
                    <div class="feature-title">情绪自动捕捉</div>
                    <div class="feature-desc">聊天中自然沉淀情绪，无需额外记录</div>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">✨</div>
                    <div class="feature-title">灵的成长</div>
                    <div class="feature-desc">你的情绪化为灵气，孕育独一无二的灵</div>
                </div>
            </div>
            <button class="btn-primary" onclick="goToChat()">开始体验</button>
            <p class="disclaimer">轻夏是轻心理健康产品，不做治疗诊断</p>
        </div>
    </div>

    <!-- 聊天页面 -->
    <div id="chat-page" class="page">
        <div class="chat-header">
            <div class="back-btn" onclick="goBack()">←</div>
            <div class="chat-title">
                <div class="avatar">🌿</div>
                <div class="chat-info">
                    <div class="chat-name">轻夏</div>
                    <div class="chat-status" id="ai-status">正在倾听...</div>
                </div>
            </div>
            <div class="spirit-mini" id="spirit-mini" title="灵的成长">
                <div class="spirit-dot" id="spirit-dot"></div>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- 消息会动态插入这里 -->
        </div>

        <!-- 情绪捕捉卡片 -->
        <div class="emotion-capture-card" id="emotion-card">
            <div class="emotion-header">
                <span>💝 情绪捕捉</span>
                <button class="close-btn" onclick="closeEmotionCard()">×</button>
            </div>
            <div class="emotion-content">
                <div class="emotion-item">
                    <span class="emotion-label">情绪</span>
                    <span class="emotion-value" id="cap-emotion">-</span>
                </div>
                <div class="emotion-item">
                    <span class="emotion-label">身体状态</span>
                    <span class="emotion-value" id="cap-body">-</span>
                </div>
                <div class="emotion-item">
                    <span class="emotion-label">触发事件</span>
                    <span class="emotion-value" id="cap-trigger">-</span>
                </div>
                <div class="emotion-item">
                    <span class="emotion-label">日记摘要</span>
                    <span class="emotion-value" id="cap-summary">-</span>
                </div>
            </div>
        </div>

        <!-- 灵诞生弹窗 -->
        <div class="spirit-born-modal" id="spirit-born-modal">
            <div class="spirit-born-content">
                <div class="spirit-animation" id="spirit-born-anim">
                    <div class="spirit-orb"></div>
                </div>
                <h3>✨ 灵诞生了</h3>
                <p>你的情绪孕育了一颗纯净的灵</p>
                <p class="spirit-desc">它会陪伴你，吸收你的喜怒哀乐，慢慢成长</p>
                <button class="btn-primary" onclick="closeSpiritBorn()">知道了</button>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="message-input" placeholder="想说点什么...（Enter发送）" maxlength="200">
                <button class="send-btn" onclick="sendMessage()" title="发送（也可以按Enter）">发送</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
