<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回本之路 — AI投资理财陪练</title>
<style>
  /* ===== Reset & Base ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #0a0e27;
    color: #e0e6f0;
    line-height: 1.6;
    overflow-x: hidden;
  }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }

  /* ===== Utility ===== */
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
  .gold { color: #d4a843; }
  .gold-bg { background: linear-gradient(135deg, #d4a843, #f0c95c); }

  /* ===== Navigation ===== */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10, 14, 39, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(212, 168, 67, 0.15);
    transition: box-shadow .3s;
  }
  .nav.scrolled { box-shadow: 0 4px 30px rgba(0,0,0,.4); }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
  }
  .nav-brand { display: flex; align-items: center; gap: 14px; }
  .nav-logo {
    font-size: 22px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(135deg, #d4a843, #f0c95c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .nav-slogan {
    font-size: 13px; color: #8892a8; white-space: nowrap;
  }
  .nav-links { display: flex; gap: 8px; }
  .nav-links a {
    padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
    color: #c0c8d8; transition: all .25s;
  }
  .nav-links a:hover { color: #d4a843; background: rgba(212,168,67,.08); }

  /* Mobile menu toggle */
  .menu-toggle {
    display: none; background: none; border: none; cursor: pointer;
    flex-direction: column; gap: 5px; padding: 4px;
  }
  .menu-toggle span {
    display: block; width: 24px; height: 2px; background: #c0c8d8;
    border-radius: 2px; transition: all .3s;
  }
  .menu-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
  .menu-toggle.active span:nth-child(2) { opacity: 0; }
  .menu-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }

  /* ===== Hero ===== */
  .hero {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 120px 24px 80px;
    position: relative; overflow: hidden;
  }
  /* Animated background particles */
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 600px 600px at 20% 50%, rgba(212,168,67,.06) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 80% 30%, rgba(30,60,140,.15) 0%, transparent 70%),
      radial-gradient(ellipse 400px 400px at 60% 80%, rgba(212,168,67,.04) 0%, transparent 70%);
    animation: heroGlow 8s ease-in-out infinite alternate;
  }
  @keyframes heroGlow {
    0% { opacity: .6; transform: scale(1); }
    100% { opacity: 1; transform: scale(1.05); }
  }
  .hero-content { position: relative; z-index: 1; max-width: 720px; }
  .hero h1 {
    font-size: clamp(32px, 6vw, 56px); font-weight: 800; line-height: 1.2;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #ffffff 30%, #d4a843 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p {
    font-size: clamp(16px, 2.5vw, 20px); color: #8892a8;
    margin-bottom: 40px; line-height: 1.7;
  }
  .btn-primary {
    display: inline-block; padding: 16px 48px; border-radius: 12px;
    font-size: 18px; font-weight: 700; border: none; cursor: pointer;
    background: linear-gradient(135deg, #d4a843, #f0c95c);
    color: #0a0e27; letter-spacing: 1px;
    box-shadow: 0 4px 24px rgba(212,168,67,.3);
    transition: all .3s;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 36px rgba(212,168,67,.45);
  }

  /* ===== Features ===== */
  .features {
    padding: 100px 24px; position: relative;
  }
  .features::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 80%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,168,67,.2), transparent);
  }
  .section-title {
    text-align: center; font-size: clamp(24px, 4vw, 36px); font-weight: 700;
    margin-bottom: 16px;
  }
  .section-sub {
    text-align: center; color: #8892a8; font-size: 16px;
    margin-bottom: 60px; max-width: 560px; margin-left: auto; margin-right: auto;
  }
  .cards {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
  }
  .card {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(212,168,67,.1);
    border-radius: 20px; padding: 40px 32px;
    text-align: center;
    transition: all .35s;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, #d4a843, transparent);
    opacity: 0; transition: opacity .35s;
  }
  .card:hover {
    transform: translateY(-8px);
    border-color: rgba(212,168,67,.3);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .card:hover::before { opacity: 1; }
  .card-icon {
    font-size: 48px; margin-bottom: 20px;
    display: inline-block;
    width: 80px; height: 80px; line-height: 80px;
    border-radius: 20px;
    background: rgba(212,168,67,.08);
  }
  .card h3 {
    font-size: 20px; font-weight: 700; margin-bottom: 12px; color: #f0f4fc;
  }
  .card p {
    font-size: 15px; color: #8892a8; line-height: 1.7;
  }

  /* ===== Stats ===== */
  .stats {
    padding: 80px 24px 100px;
    background: linear-gradient(180deg, transparent, rgba(212,168,67,.03), transparent);
  }
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px;
    text-align: center;
  }
  .stat-item { position: relative; }
  .stat-item:not(:last-child)::after {
    content: ''; position: absolute; right: -20px; top: 10%; height: 80%;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(212,168,67,.2), transparent);
  }
  .stat-number {
    font-size: clamp(40px, 6vw, 64px); font-weight: 800;
    background: linear-gradient(135deg, #d4a843, #f0c95c);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1; margin-bottom: 8px;
  }
  .stat-label { font-size: 16px; color: #8892a8; }

  /* ===== Footer ===== */
  .footer {
    text-align: center; padding: 40px 24px;
    border-top: 1px solid rgba(212,168,67,.1);
    color: #5a6478; font-size: 14px;
  }

  /* ===== Responsive ===== */
  @media (max-width: 900px) {
    .cards { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; }
    .stats-grid { grid-template-columns: 1fr; gap: 36px; }
    .stat-item:not(:last-child)::after { display: none; }
    .nav-slogan { display: none; }
  }
  @media (max-width: 768px) {
    .menu-toggle { display: flex; }
    .nav-links {
      position: fixed; top: 68px; left: 0; right: 0;
      background: rgba(10,14,39,.97); backdrop-filter: blur(12px);
      flex-direction: column; padding: 16px 24px; gap: 4px;
      border-bottom: 1px solid rgba(212,168,67,.1);
      transform: translateY(-120%); opacity: 0;
      transition: all .35s ease;
    }
    .nav-links.open { transform: translateY(0); opacity: 1; }
    .nav-links a { padding: 12px 20px; font-size: 16px; border-radius: 10px; }
    .hero { padding: 100px 20px 60px; min-height: auto; }
    .features { padding: 60px 20px; }
    .stats { padding: 60px 20px 80px; }
  }

  /* ===== Scroll animation ===== */
  .fade-up {
    opacity: 0; transform: translateY(30px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .fade-up.visible { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- Navigation -->
<nav class="nav" id="nav">
  <div class="container nav-inner">
    <div class="nav-brand">
      <span class="nav-logo">回本之路</span>
      <span class="nav-slogan">把每一个迷茫的散户，陪成理性的投资人</span>
    </div>
    <button class="menu-toggle" id="menuToggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="#learn">每日学习</a>
      <a href="#risk">风险实验室</a>
      <a href="#growth">我的成长</a>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero">
  <div class="hero-content">
    <h1>你的AI投资理财陪练伙伴</h1>
    <p>系统学金融知识，理性树风险意识，早日回本</p>
    <a href="#features" class="btn-primary">开始学习</a>
  </div>
</section>

<!-- Features -->
<section class="features" id="features">
  <div class="container">
    <h2 class="section-title fade-up">三大核心功能</h2>
    <p class="section-sub fade-up">AI驱动的沉浸式学习体验，让金融知识不再枯燥</p>
    <div class="cards">
      <div class="card fade-up">
        <div class="card-icon">📚</div>
        <h3>每日财商课</h3>
        <p>AI推送个性化金融知识，5分钟碎片化学习，每天进步一点点</p>
      </div>
      <div class="card fade-up">
        <div class="card-icon">🛡️</div>
        <h3>风险意识实验室</h3>
        <p>模拟极端行情，让风险"看得见"，在安全环境中体验真实市场波动</p>
      </div>
      <div class="card fade-up">
        <div class="card-icon">🎮</div>
        <h3>财商试炼场</h3>
        <p>游戏化闯关测试，边玩边学，在实战中检验和巩固所学知识</p>
      </div>
    </div>
  </div>
</section>

<!-- Stats -->
<section class="stats" id="stats">
  <div class="container">
    <div class="stats-grid">
      <div class="stat-item fade-up">
        <div class="stat-number" data-target="600">0</div>
        <div class="stat-label">覆盖金融知识点</div>
      </div>
      <div class="stat-item fade-up">
        <div class="stat-number" data-target="50">0</div>
        <div class="stat-label">模拟场景</div>
      </div>
      <div class="stat-item fade-up">
        <div class="stat-number" data-target="99">0</div>
        <div class="stat-label">用户好评率 %</div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="footer">
  <p>&copy;2026 回本之路 — 用AI陪每一个投资人理性成长</p>
</footer>

<script>
  // Mobile menu toggle
  const menuToggle = document.getElementById('menuToggle');
  const navLinks = document.getElementById('navLinks');
  menuToggle.addEventListener('click', () => {
    menuToggle.classList.toggle('active');
    navLinks.classList.toggle('open');
  });
  // Close menu on link click
  navLinks.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      menuToggle.classList.remove('active');
      navLinks.classList.remove('open');
    });
  });

  // Nav scroll shadow
  window.addEventListener('scroll', () => {
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
  });

  // Scroll fade-up animation
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

  // Counter animation
  const counterObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        const target = parseInt(el.dataset.target);
        const suffix = el.closest('.stat-item').querySelector('.stat-label').textContent.includes('%') ? '' : '+';
        let current = 0;
        const step = Math.max(1, Math.ceil(target / 60));
        const timer = setInterval(() => {
          current += step;
          if (current >= target) { current = target; clearInterval(timer); }
          el.textContent = current + suffix;
        }, 25);
        counterObserver.unobserve(el);
      }
    });
  }, { threshold: 0.5 });
  document.querySelectorAll('.stat-number').forEach(el => counterObserver.observe(el));
</script>
</body>
</html>
