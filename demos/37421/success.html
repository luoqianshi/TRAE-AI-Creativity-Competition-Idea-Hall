<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络安全宣传片 - 场景3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .success-icon {
            width: 120px;
            height: 120px;
            border: 4px solid #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            animation: scaleIn 0.5s ease-out;
        }
        .success-icon::after {
            content: '✓';
            font-size: 60px;
            color: #00ff88;
        }
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .main-text {
            font-size: 48px;
            font-weight: bold;
            animation: fadeInUp 0.6s ease-out 0.3s both;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .sub-text {
            font-size: 24px;
            color: #00cc6a;
            margin-top: 20px;
            animation: fadeInUp 0.6s ease-out 0.6s both;
        }
        .details {
            margin-top: 40px;
            padding: 20px 40px;
            border: 1px solid #00ff88;
            background: rgba(0, 255, 136, 0.05);
            animation: fadeInUp 0.6s ease-out 0.9s both;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
            min-width: 350px;
        }
        .detail-label {
            color: #666;
        }
        .detail-value {
            color: #00ff88;
        }
        .shield {
            position: absolute;
            font-size: 200px;
            opacity: 0.03;
            animation: rotate 20s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ff88;
            border-radius: 50%;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }
        .restart-hint {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: #333;
            animation: fadeIn 1s ease-out 2s both;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="shield">🛡</div>
    
    <div class="particles" id="particles"></div>
    
    <div class="success-icon"></div>
    
    <div class="main-text">威胁已清除</div>
    <div class="sub-text">系统安全状态：已保护</div>
    
    <div class="details">
        <div class="detail-row">
            <span class="detail-label">清除威胁数</span>
            <span class="detail-value">5 / 5</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">修复漏洞</span>
            <span class="detail-value">12 个</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">防御等级</span>
            <span class="detail-value">MAXIMUM</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">系统状态</span>
            <span class="detail-value">正常运行</span>
        </div>
    </div>
    
    <div class="restart-hint">按 R 键重新开始演示</div>
    
    <script>
        // 生成粒子效果
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 3 + 's';
            particle.style.animationDuration = (2 + Math.random() * 2) + 's';
            particlesContainer.appendChild(particle);
        }
        
        document.addEventListener('keydown', function(e) {
            if (e.code === 'KeyR') {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
