<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Life Replay - AI人生回放</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Microsoft YaHei",sans-serif;
}

body{

    background:
    radial-gradient(circle at top,#1d2b64,#0b1026 60%,#050816);

    color:white;

}

body::before{

content:"";

position:fixed;

left:0;
top:0;
right:0;
bottom:0;

background-image:

radial-gradient(2px 2px at 20% 30%,white,transparent),

radial-gradient(2px 2px at 60% 20%,white,transparent),

radial-gradient(1px 1px at 70% 80%,white,transparent),

radial-gradient(2px 2px at 90% 40%,white,transparent),

radial-gradient(1px 1px at 10% 80%,white,transparent);

opacity:.25;

pointer-events:none;

}

header{

height:70px;

position:fixed;

left:0;

top:0;

right:0;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 40px;

backdrop-filter:blur(20px);

background:rgba(255,255,255,.08);

border-bottom:1px solid rgba(255,255,255,.08);

z-index:100;

}

.logo{

font-size:30px;

font-weight:bold;

letter-spacing:1px;

}

.logo span{

color:#66d6ff;

}

#switchBtn{

padding:12px 26px;

background:#4d7dff;

border:none;

color:white;

border-radius:10px;

cursor:pointer;

font-size:15px;

transition:.35s;

}

#switchBtn:hover{

transform:translateY(-2px);

box-shadow:0 0 20px #4d7dff;

}

.page{

position:absolute;

left:0;

right:0;

top:70px;

bottom:0;

display:none;

}

.active{

display:block;

}

#viewPage{

overflow:auto;

padding:50px;

}

.hero{

text-align:center;

margin-top:20px;

}

.hero h1{

font-size:56px;

margin-bottom:15px;

}

.hero p{

color:#cfd7ff;

font-size:18px;

}

.summary{

width:1000px;

margin:50px auto;

padding:30px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:25px;

box-shadow:0 0 40px rgba(0,0,0,.2);

}

.summary h2{

margin-bottom:20px;

font-size:28px;

}

.summaryGrid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-top:25px;

}

.summaryItem{

padding:20px;

background:rgba(255,255,255,.06);

border-radius:18px;

text-align:center;

}

.summaryItem h3{

font-size:40px;

color:#5ad8ff;

margin-bottom:10px;

}

.timelineWrap{

    width:100%;

    margin-top:70px;

    overflow-x:auto;

    overflow-y:hidden;

    padding-bottom:60px;

    scrollbar-width:thin;

    scrollbar-color:#5ad8ff transparent;

}

.timelineWrap::-webkit-scrollbar{

    height:10px;

}

.timelineWrap::-webkit-scrollbar-thumb{

    background:#5ad8ff;

    border-radius:20px;

}

.timeline{

    position:relative;

    display:flex;

    align-items:center;

    min-width:max-content;

    height:650px;

    padding:0 120px;

}

.line{

    position:absolute;

    left:120px;

    right:120px;

    top:50%;

    height:5px;

    border-radius:50px;

    background:linear-gradient(90deg,#5ad8ff,#4d7dff,#8d5cff);

    box-shadow:

    0 0 15px #5ad8ff,

    0 0 40px rgba(90,216,255,.5);

}

#timelineContainer{

    display:flex;

    position:relative;

    z-index:5;

}

.node{

    position:relative;

    width:280px;

    height:560px;

    margin-right:100px;

    flex-shrink:0;

}

.dot{

    position:absolute;

    left:50%;

    top:50%;

    width:24px;

    height:24px;

    border-radius:50%;

    background:white;

    transform:translate(-50%,-50%);

    box-shadow:

    0 0 15px #5ad8ff,

    0 0 30px #5ad8ff;

}

.dot::after{

    content:"";

    position:absolute;

    left:50%;

    top:50%;

    width:10px;

    height:10px;

    border-radius:50%;

    background:#5ad8ff;

    transform:translate(-50%,-50%);

}

.card{

    position:absolute;

    width:240px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;

    transition:.35s;

    box-shadow:

    0 15px 35px rgba(0,0,0,.25);

}

.card:hover{

    transform:translateY(-12px) scale(1.03);

    box-shadow:

    0 20px 60px rgba(90,216,255,.4);

}

.card img{

    width:100%;

    height:160px;

    object-fit:cover;

}

.info{

    padding:18px;

}

.info h3{

    margin-bottom:10px;

    color:white;

    font-size:20px;

}

.info p{

    color:#d6e6ff;

    margin-top:8px;

    font-size:14px;

    line-height:1.5;

}

.info .tags{

    margin-top:12px;

    display:flex;

    flex-wrap:wrap;

    gap:8px;

}

.info .tag{

    background:rgba(77,125,255,.3);

    padding:4px 10px;

    border-radius:20px;

    font-size:12px;

    color:#5ad8ff;

}

.top{

    bottom:260px;

}

.bottom{

    top:260px;

}

.year{

    position:absolute;

    top:50%;

    transform:translateY(45px);

    width:100%;

    text-align:center;

    color:#8bc5ff;

    font-weight:bold;

    font-size:18px;

}

#adminPage{

    overflow:auto;

    padding:50px;

}

.adminContainer{

    max-width:1200px;

    margin:0 auto;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:40px;

}

.formPanel{

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:25px;

    padding:30px;

    box-shadow:0 0 40px rgba(0,0,0,.2);

}

.formPanel h2{

    margin-bottom:25px;

    font-size:28px;

}

.formGroup{

    margin-bottom:20px;

}

.formGroup label{

    display:block;

    margin-bottom:8px;

    color:#cfd7ff;

    font-size:14px;

}

.formGroup input,
.formGroup textarea{

    width:100%;

    padding:12px 16px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.15);

    border-radius:12px;

    color:white;

    font-size:15px;

    outline:none;

    transition:.3s;

}

.formGroup input:focus,
.formGroup textarea:focus{

    border-color:#5ad8ff;

    box-shadow:0 0 20px rgba(90,216,255,.2);

}

.formGroup textarea{

    resize:vertical;

    min-height:100px;

}

#saveBtn{

    width:100%;

    padding:14px;

    background:linear-gradient(90deg,#5ad8ff,#4d7dff);

    border:none;

    color:white;

    font-size:16px;

    font-weight:bold;

    border-radius:12px;

    cursor:pointer;

    transition:.35s;

}

#saveBtn:hover{

    transform:translateY(-2px);

    box-shadow:0 10px 30px rgba(77,125,255,.4);

}

.imagePreview{

    margin-top:10px;

    border-radius:12px;

    overflow:hidden;

    background:rgba(255,255,255,.06);

}

.imagePreview img{

    width:100%;

    max-height:200px;

    object-fit:cover;

}

.listPanel{

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:25px;

    padding:30px;

    box-shadow:0 0 40px rgba(0,0,0,.2);

    max-height:700px;

    overflow:auto;

}

.listPanel h2{

    margin-bottom:25px;

    font-size:28px;

}

.memoryItem{

    background:rgba(255,255,255,.06);

    border-radius:15px;

    padding:20px;

    margin-bottom:15px;

    display:flex;

    gap:15px;

    align-items:flex-start;

    transition:.3s;

}

.memoryItem:hover{

    background:rgba(255,255,255,.1);

}

.memoryItem img{

    width:80px;

    height:80px;

    object-fit:cover;

    border-radius:10px;

}

.memoryInfo{

    flex:1;

}

.memoryInfo h4{

    font-size:18px;

    margin-bottom:5px;

}

.memoryInfo .date{

    color:#8bc5ff;

    font-size:13px;

    margin-bottom:8px;

}

.memoryInfo .desc{

    color:#cfd7ff;

    font-size:13px;

    line-height:1.4;

}

.memoryActions{

    display:flex;

    gap:8px;

}

.memoryActions button{

    padding:8px 16px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:13px;

    transition:.3s;

}

.editBtn{

    background:#4d7dff;

    color:white;

}

.editBtn:hover{

    background:#3a69e8;

}

.deleteBtn{

    background:#ff4d4d;

    color:white;

}

.deleteBtn:hover{

    background:#e83a3a;

}

.emptyState{

    text-align:center;

    padding:60px 20px;

    color:#cfd7ff;

}

.emptyState p{

    margin-top:10px;

}

</style>

</head>

<body>

    <header>

        <div class="logo">
            Life <span>Replay</span>
        </div>

        <button id="switchBtn">
            后台管理
        </button>

    </header>

    <div id="viewPage" class="page active">

        <div class="hero">

            <h1>AI 人生回放</h1>

            <p>
                Every memory deserves to be remembered.
            </p>

        </div>

        <div class="summary">

            <h2>✨ AI 年度总结</h2>

            <div class="summaryGrid">

                <div class="summaryItem">
                    <h3 id="memoryCount">0</h3>
                    <p>回忆数量</p>
                </div>

                <div class="summaryItem">
                    <h3 id="yearCount">0</h3>
                    <p>年份跨度</p>
                </div>

                <div class="summaryItem">
                    <h3 id="tagCount">0</h3>
                    <p>标签数量</p>
                </div>

                <div class="summaryItem">
                    <h3 id="photoCount">0</h3>
                    <p>照片数量</p>
                </div>

            </div>

        </div>

        <div class="timelineWrap">

            <div class="timeline">

                <div class="line"></div>

                <div id="timelineContainer">

                </div>

            </div>

        </div>

    </div>

    <div id="adminPage" class="page">

        <div class="adminContainer">

            <div class="formPanel">

                <h2>📝 添加/编辑回忆</h2>

                <div class="formGroup">
                    <label>日期</label>
                    <input type="date" id="date">
                </div>

                <div class="formGroup">
                    <label>标题</label>
                    <input type="text" id="title" placeholder="给这个回忆起个名字">
                </div>

                <div class="formGroup">
                    <label>标签（用逗号分隔）</label>
                    <input type="text" id="tags" placeholder="旅行, 生日, 毕业">
                </div>

                <div class="formGroup">
                    <label>描述</label>
                    <textarea id="desc" placeholder="写下你的回忆..."></textarea>
                </div>

                <div class="formGroup">
                    <label>图片</label>
                    <input type="file" id="image" accept="image/*">
                    <div class="imagePreview" id="imagePreview"></div>
                </div>

                <button id="saveBtn">保存回忆</button>

            </div>

            <div class="listPanel">

                <h2>📋 回忆列表</h2>

                <div id="memoryList"></div>

            </div>

        </div>

    </div>

<script>

const STORAGE_KEY = "lifeReplayData";

let memories = [];

let editingIndex = -1;

const switchBtn = document.getElementById("switchBtn");
const viewPage = document.getElementById("viewPage");
const adminPage = document.getElementById("adminPage");

const dateInput = document.getElementById("date");
const titleInput = document.getElementById("title");
const tagInput = document.getElementById("tags");
const descInput = document.getElementById("desc");
const imageInput = document.getElementById("image");
const imagePreview = document.getElementById("imagePreview");

const saveBtn = document.getElementById("saveBtn");

const memoryList = document.getElementById("memoryList");
const timelineContainer = document.getElementById("timelineContainer");

window.onload = () => {

    loadData();

    renderList();

    renderTimeline();

    updateSummary();

};

switchBtn.onclick = () => {

    if(viewPage.classList.contains("active")){

        viewPage.classList.remove("active");

        adminPage.classList.add("active");

        switchBtn.innerText="返回展示";

    }

    else{

        adminPage.classList.remove("active");

        viewPage.classList.add("active");

        switchBtn.innerText="后台管理";

        renderTimeline();

        updateSummary();

    }

}

function saveData(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(memories)

    );

}

function loadData(){

    const data=localStorage.getItem(STORAGE_KEY);

    if(data){

        memories=JSON.parse(data);

    }

}

imageInput.onchange = (e) => {

    const file = e.target.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = (event) => {

            imagePreview.innerHTML = `<img src="${event.target.result}" alt="预览">`;

        };

        reader.readAsDataURL(file);

    }

};

saveBtn.onclick=()=>{

    if(dateInput.value==""){

        alert("请选择日期");

        return;

    }

    if(titleInput.value==""){

        alert("请输入标题");

        return;

    }

    const file=imageInput.files[0];

    if(editingIndex!=-1 && !file){

        memories[editingIndex].date=dateInput.value;

        memories[editingIndex].title=titleInput.value;

        memories[editingIndex].tags=tagInput.value;

        memories[editingIndex].desc=descInput.value;

        finishSave();

        return;

    }

    if(!file){

        alert("请选择图片");

        return;

    }

    const reader=new FileReader();

    reader.onload=e=>{

        const item={

            date:dateInput.value,

            title:titleInput.value,

            tags:tagInput.value,

            desc:descInput.value,

            image:e.target.result

        };

        if(editingIndex==-1){

            memories.push(item);

        }

        else{

            memories[editingIndex]=item;

        }

        finishSave();

    }

    reader.readAsDataURL(file);

}

function finishSave(){

    memories.sort((a,b)=>{

        return new Date(a.date)-new Date(b.date);

    });

    saveData();

    clearForm();

    renderList();

    renderTimeline();

    updateSummary();

    editingIndex=-1;

}

function clearForm(){

    dateInput.value="";

    titleInput.value="";

    tagInput.value="";

    descInput.value="";

    imageInput.value="";

    imagePreview.innerHTML="";

}

function renderList(){

    if(memories.length===0){

        memoryList.innerHTML=`
            <div class="emptyState">
                <h3>还没有回忆</h3>
                <p>在左侧添加你的第一个回忆吧！</p>
            </div>
        `;

        return;

    }

    memoryList.innerHTML = memories.map((memory,index)=>{

        const tags = memory.tags ? memory.tags.split(',').map(t=>t.trim()).filter(t=>t) : [];

        return `
            <div class="memoryItem">
                <img src="${memory.image}" alt="${memory.title}">
                <div class="memoryInfo">
                    <h4>${memory.title}</h4>
                    <div class="date">${memory.date}</div>
                    <div class="desc">${memory.desc || '暂无描述'}</div>
                </div>
                <div class="memoryActions">
                    <button class="editBtn" onclick="editMemory(${index})">编辑</button>
                    <button class="deleteBtn" onclick="deleteMemory(${index})">删除</button>
                </div>
            </div>
        `;

    }).join('');

}

function editMemory(index){

    const memory = memories[index];

    editingIndex = index;

    dateInput.value = memory.date;

    titleInput.value = memory.title;

    tagInput.value = memory.tags || '';

    descInput.value = memory.desc || '';

    imagePreview.innerHTML = `<img src="${memory.image}" alt="预览">`;

    adminPage.scrollTop = 0;

}

function deleteMemory(index){

    if(confirm('确定要删除这个回忆吗？')){

        memories.splice(index,1);

        saveData();

        renderList();

        renderTimeline();

        updateSummary();

    }

}

function renderTimeline(){

    if(memories.length===0){

        timelineContainer.innerHTML = '';

        return;

    }

    timelineContainer.innerHTML = memories.map((memory,index)=>{

        const isTop = index % 2 === 0;

        const year = new Date(memory.date).getFullYear();

        const tags = memory.tags ? memory.tags.split(',').map(t=>t.trim()).filter(t=>t) : [];

        return `
            <div class="node">
                <div class="dot"></div>
                <div class="card ${isTop ? 'top' : 'bottom'}">
                    <img src="${memory.image}" alt="${memory.title}">
                    <div class="info">
                        <h3>${memory.title}</h3>
                        <p>${memory.desc || ''}</p>
                        ${tags.length > 0 ? `<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>` : ''}
                    </div>
                </div>
                <div class="year">${year}</div>
            </div>
        `;

    }).join('');

}

function updateSummary(){

    document.getElementById('memoryCount').textContent = memories.length;

    if(memories.length>0){

        const years = memories.map(m=>new Date(m.date).getFullYear());

        const minYear = Math.min(...years);

        const maxYear = Math.max(...years);

        document.getElementById('yearCount').textContent = maxYear - minYear + 1;

        const allTags = new Set();

        memories.forEach(m=>{

            if(m.tags){

                m.tags.split(',').forEach(t=>{

                    const tag = t.trim();

                    if(tag) allTags.add(tag);

                });

            }

        });

        document.getElementById('tagCount').textContent = allTags.size;

    }

    document.getElementById('photoCount').textContent = memories.length;

}

</script>

</body>

</html>
