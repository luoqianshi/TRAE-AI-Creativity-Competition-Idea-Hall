<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>观象 · 周易 AI 算命系统</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Ma+Shan+Zheng&display=swap');

:root {
  --ink: #1a1a1a;
  --ink-light: #4a4a4a;
  --ink-lighter: #7a7a7a;
  --paper: #f5f0e6;
  --paper-dark: #e8e0d0;
  --paper-darker: #d9cfbc;
  --red-seal: #a23b2c;
  --red-seal-dark: #8b2e22;
  --gold: #b8860b;
  --gold-light: #d4a84b;
  --jade: #4a7c59;
  --jade-light: #6b9b7a;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Serif SC', serif;
  background: var(--paper);
  color: var(--ink);
}

.app-container {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ===== 宣纸纹理背景 ===== */
.paper-bg {
  position: absolute;
  inset: 0;
  background: 
    radial-gradient(ellipse at 20% 30%, rgba(184,134,11,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(162,59,44,0.02) 0%, transparent 50%),
    linear-gradient(180deg, var(--paper) 0%, var(--paper-dark) 100%);
}

.paper-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
}

/* ===== 山水装饰 ===== */
.mountain-decoration {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 200px;
  pointer-events: none;
  opacity: 0.06;
}

/* ===== Onboarding 弹窗 ===== */
.onboarding-overlay {
  position: absolute;
  inset: 0;
  background: rgba(26,26,26,0.6);
  backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.onboarding-card {
  width: 100%;
  max-width: 420px;
  background: var(--paper);
  border-radius: 4px;
  box-shadow: 
    0 20px 60px rgba(0,0,0,0.3),
    inset 0 0 0 1px var(--paper-darker);
  position: relative;
  overflow: hidden;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
}

.onboarding-card::before {
  content: '';
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  bottom: 12px;
  border: 1px solid var(--paper-darker);
  pointer-events: none;
  border-radius: 2px;
}

.onboarding-header {
  padding: 32px 28px 16px;
  text-align: center;
  position: relative;
}

.onboarding-title {
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 4px;
  margin-bottom: 8px;
}

.onboarding-subtitle {
  font-size: 13px;
  color: var(--ink-lighter);
  letter-spacing: 2px;
}

.step-indicator {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
}

.step-dot {
  width: 24px;
  height: 2px;
  background: var(--paper-darker);
  transition: all 0.3s;
}

.step-dot.active {
  background: var(--red-seal);
  width: 32px;
}

.step-dot.completed {
  background: var(--gold);
}

.onboarding-body {
  padding: 20px 28px;
  flex: 1;
  overflow-y: auto;
}

.step-title {
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 6px;
  letter-spacing: 1px;
}

.step-desc {
  font-size: 13px;
  color: var(--ink-lighter);
  margin-bottom: 20px;
  line-height: 1.6;
}

/* 主题选择 */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.theme-item {
  aspect-ratio: 1;
  border: 1px solid var(--paper-darker);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
  background: var(--paper);
  position: relative;
}

.theme-item:hover, .theme-item.selected {
  border-color: var(--red-seal);
  background: rgba(162,59,44,0.05);
}

.theme-item.selected::after {
  content: '✓';
  position: absolute;
  top: 6px;
  right: 8px;
  color: var(--red-seal);
  font-size: 14px;
}

.theme-icon {
  font-size: 28px;
  margin-bottom: 6px;
}

.theme-label {
  font-size: 13px;
  color: var(--ink-light);
  letter-spacing: 1px;
}

/* 输入框 */
.input-field {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--paper-darker);
  border-radius: 4px;
  background: var(--paper);
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--ink);
  resize: none;
  outline: none;
  transition: border-color 0.3s;
  line-height: 1.6;
}

.input-field:focus {
  border-color: var(--gold);
}

textarea.input-field {
  min-height: 100px;
}

/* 心理状态选择 */
.mood-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.mood-item {
  padding: 12px 16px;
  border: 1px solid var(--paper-darker);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 12px;
}

.mood-item:hover, .mood-item.selected {
  border-color: var(--red-seal);
  background: rgba(162,59,44,0.05);
}

.mood-emoji {
  font-size: 20px;
}

.mood-text {
  font-size: 14px;
  color: var(--ink-light);
}

/* 出生信息 */
.birth-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}

.birth-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.birth-label {
  font-size: 12px;
  color: var(--ink-lighter);
}

.birth-input {
  padding: 10px 12px;
  border: 1px solid var(--paper-darker);
  border-radius: 4px;
  background: var(--paper);
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  color: var(--ink);
  outline: none;
}

.birth-input:focus {
  border-color: var(--gold);
}

.precision-slider {
  margin-top: 8px;
}

.precision-labels {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--ink-lighter);
  margin-top: 4px;
}

/* 建议卡 */
.suggestion-section {
  margin-top: 16px;
}

.suggestion-card {
  background: linear-gradient(135deg, rgba(184,134,11,0.08) 0%, rgba(184,134,11,0.03) 100%);
  border: 1px solid rgba(184,134,11,0.2);
  border-radius: 4px;
  padding: 14px;
  margin-bottom: 12px;
}

.suggestion-text {
  font-size: 13px;
  color: var(--ink-light);
  line-height: 1.7;
  margin-bottom: 12px;
  font-style: italic;
}

.suggestion-actions {
  display: flex;
  gap: 8px;
}

.suggestion-btn {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--paper-darker);
  border-radius: 3px;
  background: var(--paper);
  font-family: 'Noto Serif SC', serif;
  font-size: 12px;
  color: var(--ink-light);
  cursor: pointer;
  transition: all 0.2s;
}

.suggestion-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}

.suggestion-btn.primary {
  background: var(--gold);
  border-color: var(--gold);
  color: white;
}

.suggestion-btn.primary:hover {
  background: var(--gold-light);
}

/* 底部按钮 */
.onboarding-footer {
  padding: 16px 28px 28px;
  display: flex;
  gap: 12px;
}

.btn {
  flex: 1;
  padding: 14px 20px;
  border: none;
  border-radius: 4px;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.3s;
}

.btn-secondary {
  background: var(--paper);
  border: 1px solid var(--paper-darker);
  color: var(--ink-light);
}

.btn-secondary:hover {
  border-color: var(--ink-lighter);
}

.btn-primary {
  background: var(--red-seal);
  color: white;
}

.btn-primary:hover {
  background: var(--red-seal-dark);
}

.btn-primary:disabled {
  background: var(--paper-darker);
  cursor: not-allowed;
}

/* ===== 主卦台页面 ===== */
.main-page {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s;
}

.main-page.active {
  opacity: 1;
  pointer-events: all;
}

/* 顶部栏 */
.top-bar {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}

.seal-logo {
  width: 40px;
  height: 40px;
  background: var(--red-seal);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 18px;
  font-weight: 700;
  font-family: 'Ma Shan Zheng', cursive;
  box-shadow: 2px 2px 8px rgba(162,59,44,0.3);
  transform: rotate(-2deg);
}

.top-title {
  font-size: 18px;
  letter-spacing: 6px;
  color: var(--ink);
  font-weight: 500;
}

.mode-toggle {
  display: flex;
  border: 1px solid var(--paper-darker);
  border-radius: 3px;
  overflow: hidden;
}

.mode-btn {
  padding: 6px 12px;
  font-size: 11px;
  border: none;
  background: var(--paper);
  color: var(--ink-lighter);
  font-family: 'Noto Serif SC', serif;
  cursor: pointer;
  transition: all 0.2s;
}

.mode-btn.active {
  background: var(--ink);
  color: var(--paper);
}

/* 太极图 */
.taiji-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 280px;
  height: 280px;
  z-index: 1;
  pointer-events: none;
  opacity: 0.08;
}

.taiji {
  width: 100%;
  height: 100%;
  animation: taijiRotate 30s linear infinite;
}

@keyframes taijiRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* 卦台区域 */
.divination-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  z-index: 5;
}

.hexagram-stand {
  position: relative;
  width: 200px;
  height: 280px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* 签筒 */
.stick-container {
  width: 100px;
  height: 160px;
  position: relative;
  cursor: pointer;
  transition: transform 0.1s;
}

.stick-container.shaking {
  animation: shake 0.1s infinite;
}

@keyframes shake {
  0%, 100% { transform: rotate(-5deg) translateX(-2px); }
  25% { transform: rotate(5deg) translateX(2px); }
  50% { transform: rotate(-3deg) translateX(-1px); }
  75% { transform: rotate(3deg) translateX(1px); }
}

.bamboo-tube {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 140px;
  background: linear-gradient(90deg, #5d4037 0%, #8d6e63 20%, #a1887f 50%, #8d6e63 80%, #5d4037 100%);
  border-radius: 4px 4px 8px 8px;
  box-shadow: 
    inset -4px 0 8px rgba(0,0,0,0.2),
    inset 4px 0 8px rgba(255,255,255,0.1),
    4px 8px 20px rgba(0,0,0,0.2);
}

.bamboo-tube::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 12px;
  background: linear-gradient(90deg, #4e342e 0%, #6d4c41 50%, #4e342e 100%);
  border-radius: 4px 4px 0 0;
}

.bamboo-tube::after {
  content: '卦';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px;
  color: rgba(255,255,255,0.3);
  font-family: 'Ma Shan Zheng', cursive;
}

.sticks {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 2px;
}

.stick {
  width: 4px;
  height: 80px;
  background: linear-gradient(90deg, #d4a84b 0%, #f5d76e 50%, #d4a84b 100%);
  border-radius: 2px 2px 0 0;
  box-shadow: 1px 0 2px rgba(0,0,0,0.2);
}

.stick.falling {
  animation: stickFall 1s ease-out forwards;
}

@keyframes stickFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100px) rotate(45deg); opacity: 0; }
}

/* 卦爻显示 */
.yao-display {
  margin-top: 20px;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  align-items: center;
}

.yao-line {
  height: 8px;
  background: var(--ink);
  border-radius: 2px;
  transition: all 0.4s;
  opacity: 0;
  transform: scaleX(0);
}

.yao-line.yang {
  width: 80px;
}

.yao-line.yin {
  width: 36px;
  position: relative;
}

.yao-line.yin::after {
  content: '';
  position: absolute;
  right: -44px;
  top: 0;
  width: 36px;
  height: 8px;
  background: var(--ink);
  border-radius: 2px;
}

.yao-line.changing {
  background: var(--red-seal);
}

.yao-line.changing::after {
  background: var(--red-seal);
}

.yao-line.visible {
  opacity: 1;
  transform: scaleX(1);
}

.yao-label {
  font-size: 11px;
  color: var(--ink-lighter);
  margin-top: 4px;
  letter-spacing: 1px;
}

/* 操作按钮区 */
.action-area {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
  position: relative;
  z-index: 5;
}

.action-hint {
  font-size: 13px;
  color: var(--ink-lighter);
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.divination-btn {
  padding: 16px 40px;
  border: 2px solid var(--ink);
  background: transparent;
  color: var(--ink);
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  letter-spacing: 4px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}

.divination-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s;
  z-index: -1;
}

.divination-btn:hover::before {
  transform: scaleX(1);
}

.divination-btn:hover {
  color: var(--paper);
}

.divination-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.quick-btn {
  padding: 10px 24px;
  border: 1px solid var(--paper-darker);
  background: transparent;
  color: var(--ink-lighter);
  font-family: 'Noto Serif SC', serif;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.3s;
}

.quick-btn:hover {
  border-color: var(--ink-light);
  color: var(--ink-light);
}

/* 摇卦动画遮罩 */
.shaking-overlay {
  position: absolute;
  inset: 0;
  background: rgba(245,240,230,0.95);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.shaking-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.shaking-text {
  font-size: 18px;
  color: var(--ink);
  letter-spacing: 8px;
  margin-top: 20px;
  animation: pulse 1s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.shaking-taiji {
  width: 120px;
  height: 120px;
  animation: taijiRotate 2s linear infinite;
}

/* ===== 报告页面 ===== */
.report-page {
  position: absolute;
  inset: 0;
  background: var(--paper);
  z-index: 60;
  overflow-y: auto;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s;
}

.report-page.active {
  opacity: 1;
  pointer-events: all;
}

.report-header {
  position: sticky;
  top: 0;
  background: var(--paper);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--paper-darker);
  z-index: 10;
}

.report-back {
  font-size: 14px;
  color: var(--ink-light);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}

.report-title {
  font-size: 16px;
  letter-spacing: 4px;
  color: var(--ink);
}

.report-share {
  font-size: 13px;
  color: var(--red-seal);
  cursor: pointer;
}

.report-content {
  padding: 20px;
  max-width: 500px;
  margin: 0 auto;
}

/* 卦象总览 */
.hexagram-overview {
  text-align: center;
  padding: 30px 20px;
  border-bottom: 1px solid var(--paper-darker);
  margin-bottom: 24px;
}

.hexagram-name {
  font-size: 32px;
  font-weight: 600;
  letter-spacing: 8px;
  margin-bottom: 8px;
  font-family: 'Ma Shan Zheng', cursive;
}

.hexagram-number {
  font-size: 13px;
  color: var(--ink-lighter);
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.hexagram-symbol {
  display: flex;
  flex-direction: column-reverse;
  gap: 6px;
  align-items: center;
  margin: 20px 0;
}

.symbol-line {
  height: 6px;
  background: var(--ink);
  border-radius: 1px;
}

.symbol-line.yang { width: 60px; }
.symbol-line.yin { width: 26px; position: relative; }
.symbol-line.yin::after {
  content: '';
  position: absolute;
  right: -34px;
  width: 26px;
  height: 6px;
  background: var(--ink);
  border-radius: 1px;
}
.symbol-line.changing { background: var(--red-seal); }
.symbol-line.changing::after { background: var(--red-seal); }

.hexagram-tagline {
  font-size: 15px;
  color: var(--ink-light);
  line-height: 1.8;
  margin-top: 16px;
  letter-spacing: 1px;
}

/* 报告区块 */
.report-section {
  margin-bottom: 28px;
}

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 2px;
  color: var(--ink);
}

.section-line {
  flex: 1;
  height: 1px;
  background: var(--paper-darker);
}

.section-number {
  font-size: 12px;
  color: var(--ink-lighter);
  font-family: 'Ma Shan Zheng', cursive;
}

.section-content {
  font-size: 14px;
  line-height: 2;
  color: var(--ink-light);
  padding: 0 4px;
}

.section-content p {
  margin-bottom: 12px;
  text-indent: 2em;
}

/* 五卦展示 */
.five-hexagrams {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 16px 0;
}

.hex-mini {
  text-align: center;
  padding: 12px 4px;
  border: 1px solid var(--paper-darker);
  border-radius: 4px;
  background: var(--paper);
}

.hex-mini-title {
  font-size: 10px;
  color: var(--ink-lighter);
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.hex-mini-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 8px;
  font-family: 'Ma Shan Zheng', cursive;
}

.hex-mini-symbol {
  display: flex;
  flex-direction: column-reverse;
  gap: 3px;
  align-items: center;
}

.mini-line {
  height: 3px;
  background: var(--ink);
  border-radius: 1px;
}

.mini-line.yang { width: 28px; }
.mini-line.yin { width: 12px; position: relative; }
.mini-line.yin::after {
  content: '';
  position: absolute;
  right: -16px;
  width: 12px;

/* 心理指标 */
.psych-indicators {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin: 16px 0;
}

.indicator-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.indicator-label {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--ink-light);
}

.indicator-bar {
  height: 6px;
  background: var(--paper-darker);
  border-radius: 3px;
  overflow: hidden;
}

.indicator-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 1s ease-out;
  width: 0;
}

.indicator-fill.positive { background: var(--jade); }
.indicator-fill.neutral { background: var(--gold); }
.indicator-fill.negative { background: var(--red-seal); }

/* 进退守变矩阵 */
.matrix-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 16px 0;
}

.matrix-item {
  padding: 16px;
  border: 1px solid var(--paper-darker);
  border-radius: 4px;
  text-align: center;
}

.matrix-label {
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  font-family: 'Ma Shan Zheng', cursive;
  letter-spacing: 4px;
}

.matrix-value {
  font-size: 12px;
  color: var(--ink-lighter);
}

.matrix-item.recommended {
  border-color: var(--red-seal);
  background: rgba(162,59,44,0.03);
}

.matrix-item.recommended .matrix-label {
  color: var(--red-seal);
}

/* 动爻 */
.changing-yao {
  padding: 16px;
  background: rgba(162,59,44,0.03);
  border-left: 3px solid var(--red-seal);
  margin: 12px 0;
  border-radius: 0 4px 4px 0;
}

.yao-position {
  font-size: 13px;
  color: var(--red-seal);
  font-weight: 500;
  margin-bottom: 8px;
}

.yao-text {
  font-size: 14px;
  line-height: 1.8;
  color: var(--ink-light);
}

/* 节奏推演 */
.timeline {
  position: relative;
  padding-left: 24px;
  margin: 16px 0;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 6px;
  top: 8px;
  bottom: 8px;
  width: 1px;
  background: var(--paper-darker);
}

.timeline-item {
  position: relative;
  margin-bottom: 20px;
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -22px;
  top: 6px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--paper);
  border: 2px solid var(--gold);
}

.timeline-item.current::before {
  background: var(--red-seal);
  border-color: var(--red-seal);
}

.timeline-phase {
  font-size: 13px;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 4px;
}

.timeline-item.current .timeline-phase {
  color: var(--red-seal);
}

.timeline-desc {
  font-size: 13px;
  color: var(--ink-light);
  line-height: 1.7;
}

.birth-info-card {
  padding: 16px;
  background: var(--paper-dark);
  border-radius: 4px;
  margin: 16px 0;
}

.birth-info-row {

}

}

.birth-info-key {
  color: var(--ink-lighter);
}

.birth-info-value {
  color: var(--ink);

}

  margin: 20px 0;
}

.share-hex-name {

}

}

.share-brand {

}

/* 加载状态 */
.loading-state {
  display: flex;
  flex-direction: column;

  justify-content: center;

}

.loading-spinner {

}

@keyframes spin {

}

.loading-text {
  margin-top: 16px;
  font-size: 13px;
  color: var(--ink-lighter);
  letter-spacing: 2px;
}

/* 四象装饰 */
.four-symbols {

.symbol.east { right: 20px; top: 50%; transform: translateY(-50%); }
.symbol.west { left: 20px; top: 50%; transform: translateY(-50%); }

.onboarding-body::-webkit-scrollbar,
.report-page::-webkit-scrollbar {

// ===== 状态管理 =====
let state = {
  currentStep: 0,
  theme: null,
  experience: '',
  mood: null,
  birthTime: '',
  birthPlace: '',
  gender: '',
  precision: 3,
  worry: '',
  mode: 'template',
  yaos: [], // 摇出的爻: 0=阴, 1=阳, 每个元素 {value:0/1, changing:bool}
  suggestionIndex: 0
};

// ===== Onboarding 逻辑 =====
function initOnboarding() {
  renderStepIndicator();
  renderStep();
}

function renderStepIndicator() {
  const indicator = document.getElementById('stepIndicator');
  indicator.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const dot = document.createElement('div');
    dot.className = 'step-dot';
    if (i === state.currentStep) dot.classList.add('active');
    if (i < state.currentStep) dot.classList.add('completed');
    indicator.appendChild(dot);
  }
}

function renderStep() {
  const body = document.getElementById('onboardingBody');
  const footer = document.getElementById('onboardingFooter');
  
  switch(state.currentStep) {
    case 0: renderThemeStep(body, footer); break;
    case 1: renderExperienceStep(body, footer); break;
    case 2: renderMoodStep(body, footer); break;
    case 3: renderBirthStep(body, footer); break;
    case 4: renderWorryStep(body, footer); break;
  }
  
  renderStepIndicator();
}

function renderThemeStep(body, footer) {
  body.innerHTML = `
    <div class="step-title">第一步：选择主题</div>
    <div class="step-desc">你想问卜什么方面的事情？</div>
    <div class="theme-grid">
      ${Object.entries(THEMES).map(([key, t]) => `
        <div class="theme-item ${state.theme === key ? 'selected' : ''}" onclick="selectTheme('${key}')">
          <div class="theme-icon">${t.icon}</div>
          <div class="theme-label">${t.name}</div>
        </div>
      `).join('')}
    </div>
  `;
  footer.innerHTML = `
    <button class="btn btn-primary" onclick="nextStep()" ${state.theme ? '' : 'disabled'}>下一步</button>
  `;
}

function selectTheme(key) {
  state.theme = key;
  state.suggestionIndex = 0;
  renderStep();
}

function renderExperienceStep(body, footer) {
  const suggestions = SUGGESTIONS[state.theme] || SUGGESTIONS.self;
  const currentSuggestion = suggestions[state.suggestionIndex % suggestions.length];
  
  body.innerHTML = `
    <div class="step-title">第二步：说说你的经历</div>
    <div class="step-desc">简单描述一下你所问之事的背景，越具体卦象越准。</div>
    <textarea class="input-field" id="experienceInput" placeholder="在此输入你的经历和困惑..." oninput="state.experience = this.value">${state.experience}</textarea>
    <div class="suggestion-section">
      <div class="suggestion-card">
        <div class="suggestion-text">"${currentSuggestion}"</div>
        <div class="suggestion-actions">
          <button class="suggestion-btn primary" onclick="applySuggestion('${currentSuggestion.replace(/'/g, "\\'")}')">应用建议</button>
          <button class="suggestion-btn" onclick="clearExperience()">清空自己写</button>
          <button class="suggestion-btn" onclick="refreshSuggestion()">刷新建议</button>
        </div>
      </div>
    </div>
  `;
  footer.innerHTML = `
    <button class="btn btn-secondary" onclick="prevStep()">上一步</button>
    <button class="btn btn-primary" onclick="nextStep()" ${state.experience.trim() ? '' : 'disabled'}>下一步</button>
  `;
}

function applySuggestion(text) {
  state.experience = text;
  renderStep();
  setTimeout(() => {
    const input = document.getElementById('experienceInput');
    if (input) input.focus();
  }, 100);
}

function clearExperience() {
  state.experience = '';
  renderStep();
  setTimeout(() => {
    const input = document.getElementById('experienceInput');
    if (input) input.focus();
  }, 100);
}

function refreshSuggestion() {
  state.suggestionIndex++;
  renderStep();
}

function renderMoodStep(body, footer) {
  body.innerHTML = `
    <div class="step-title">第三步：当前心理状态</div>
    <div class="step-desc">你现在是什么样的心情？诚实地面对自己。</div>
    <div class="mood-list">
      ${MOODS.map(m => `
        <div class="mood-item ${state.mood === m.value ? 'selected' : ''}" onclick="selectMood('${m.value}')">
          <div class="mood-emoji">${m.emoji}</div>
          <div class="mood-text">${m.label}</div>
        </div>
      `).join('')}
    </div>
  `;
  footer.innerHTML = `
    <button class="btn btn-secondary" onclick="prevStep()">上一步</button>
    <button class="btn btn-primary" onclick="nextStep()" ${state.mood ? '' : 'disabled'}>下一步</button>
  `;
}

function selectMood(value) {
  state.mood = value;
  renderStep();
}

function renderBirthStep(body, footer) {
  body.innerHTML = `
    <div class="step-title">第四步：出生信息（选填）</div>
    <div class="step-desc">填写出生信息可以让解卦更贴合你的命盘，不填也无妨。</div>
    <div class="birth-grid">
      <div class="birth-item">
        <label class="birth-label">出生时间</label>
        <input type="datetime-local" class="birth-input" id="birthTime" value="${state.birthTime}" onchange="state.birthTime = this.value">

        <label class="birth-label">性别</label>

function generateYao() {
  // 三枚铜钱法：正面为3，反面为2
  // 三反=老阴(变), 两正一反=少阴, 两反一正=少阳, 三正=老阳(变)
  const coins = [Math.random() < 0.5 ? 2 : 3, Math.random() < 0.5 ? 2 : 3, Math.random() < 0.5 ? 2 : 3];
  const sum = coins[0] + coins[1] + coins[2];
  
  let value, changing;
  if (sum === 6) { // 老阴
    value = 0; changing = true;
  } else if (sum === 7) { // 少阳
    value = 1; changing = false;
  } else if (sum === 8) { // 少阴
    value = 0; changing = false;
  } else { // 老阳 9
    value = 1; changing = true;
  }
  
  return { value, changing };
}

function shakeOneYao() {
  if (state.yaos.length >= 6) return;
  
  const container = document.getElementById('stickContainer');
  container.classList.add('shaking');
  
  // 一根签掉落
  setTimeout(() => {
    const sticks = document.getElementById('sticks');
    if (sticks.children.length > 0) {
      const fallingStick = sticks.children[0];
      fallingStick.classList.add('falling');
      setTimeout(() => fallingStick.remove(), 1000);
    }
  }, 200);
  
  setTimeout(() => {
    container.classList.remove('shaking');
    const yao = generateYao();
    state.yaos.push(yao);
    renderYaos();
    updateActionHint();
    
    if (state.yaos.length >= 6) {
      setTimeout(() => generateReport(), 800);
    }
  }, 600 + Math.random() * 400);
}

function renderYaos() {
  const display = document.getElementById('yaoDisplay');
  display.innerHTML = '';
  state.yaos.forEach((yao, idx) => {
    const line = document.createElement('div');
    line.className = `yao-line ${yao.value ? 'yang' : 'yin'} ${yao.changing ? 'changing' : ''}`;
    display.appendChild(line);
    
    setTimeout(() => line.classList.add('visible'), idx * 100);

  const labels = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
  if (state.yaos.length > 0 && state.yaos.length < 6) {

function updateActionHint() {
  const hint = document.getElementById('actionHint');
  const btn = document.getElementById('mainBtn');

  if (state.yaos.length === 0) {

// ===== 卦象计算 =====
function getHexagram(lines) {
  // lines是从下到上的数组，需要匹配
  const lineValues = lines.map(l => l.value);
  return HEXAGRAMS.find(h => {
    return h.lines.every((v, i) => v === lineValues[i]);
  }) || HEXAGRAMS[0];
}

function getChangedHexagram(lines) {
  // 变卦：老阴变阳，老阳变阴
  const changedLines = lines.map(l => ({
    value: l.changing ? (1 - l.value) : l.value,
    changing: false
  }));
  return getHexagram(changedLines);
}

function getHugua(lines) {
  // 互卦：取2,3,4爻为下卦，3,4,5爻为上卦
  const huLines = [
    lines[1]?.value ?? 0,
    lines[2]?.value ?? 0,
    lines[3]?.value ?? 0,
    lines[2]?.value ?? 0,
    lines[3]?.value ?? 0,
    lines[4]?.value ?? 0
  ].map(v => ({ value: v, changing: false }));
  return getHexagram(huLines);
}

function getCuogua(hex) {
  // 错卦：阴阳全变
  const cuoLines = hex.lines.map(v => ({ value: 1 - v, changing: false }));
  return getHexagram(cuoLines);
}

function getZonggua(hex) {
  // 综卦：上下颠倒
  const zongLines = [...hex.lines].reverse().map(v => ({ value: v, changing: false }));
  return getHexagram(zongLines);
}

function generateIndicators() {
  const moodMap = {
    anxious: { anxiety: 85, hope: 40, control: 25, energy: 50 },
    confused: { anxiety: 60, hope: 50, control: 20, energy: 40 },
    down: { anxiety: 50, hope: 25, control: 30, energy: 20 },
    angry: { anxiety: 70, hope: 30, control: 35, energy: 75 },
    hopeful: { anxiety: 45, hope: 75, control: 50, energy: 70 },
    calm: { anxiety: 25, hope: 60, control: 70, energy: 55 }
  };
  
  const base = moodMap[state.mood] || moodMap.confused;
  const jitter = () => Math.floor(Math.random() * 20 - 10);
  
  return [
    { label: '焦虑指数', value: Math.min(95, Math.max(5, base.anxiety + jitter())), type: 'negative' },
    { label: '希望指数', value: Math.min(95, Math.max(5, base.hope + jitter())), type: 'positive' },
    { label: '掌控感', value: Math.min(95, Math.max(5, base.control + jitter())), type: 'positive' },
    { label: '行动力', value: Math.min(95, Math.max(5, base.energy + jitter())), type: 'neutral' }
  ];
}

function generateMatrix(hex, changingCount) {
  // 根据卦象和动爻数推荐策略
  const goodHex = [1, 11, 14, 15, 24, 32, 35, 42, 46, 50];
  const badHex = [6, 12, 23, 29, 33, 36, 39, 47, 59];
  
  let recommended;
  if (changingCount === 0) {
    recommended = goodHex.includes(hex.id) ? 'hold' : 'change';
  } else if (changingCount <= 2) {
    recommended = goodHex.includes(hex.id) ? 'advance' : 'hold';
  } else if (changingCount <= 4) {
    recommended = 'change';
  } else {
    recommended = 'retreat';
  }
  
  return { recommended };
}

function generateTimeline() {
  const now = new Date();
  const phases = [];
  
  const phaseNames = ['潜龙勿用期', '见龙在田期', '终日乾乾期', '或跃在渊期', '飞龙在天期'];
  const descs = [
    '当下正是沉潜积累之时，不要急于求成。把基础打牢，把心态放平，这段时间的积累会在未来派上用场。',
    '机会开始浮现，但还不到全力出击的时候。保持敏锐，看到机会不要急着扑上去，先观察清楚。',
    '这是最需要谨慎的阶段。每天都要反省自己，做事要勤勉，做人要低调。这个阶段熬过去，就是海阔天空。',
    '到了关键的抉择点。可以尝试跳跃，但要做好失败的准备。进退有据，不要孤注一掷。',
    '时机成熟，可以大展宏图。但要记住物极必反的道理，在巅峰时更要保持清醒。'
  ];
  
  const startIdx = Math.floor(Math.random() * 2);
  
  for (let i = 0; i < 4; i++) {
    const phaseDate = new Date(now);
    phaseDate.setMonth(phaseDate.getMonth() + i * 2);
    
    phases.push({
      phase: `${phaseDate.getMonth()+1}月 · ${phaseNames[(startIdx + i) % 5]}`,
      desc: descs[(startIdx + i) % 5],
      current: i === 0
    });
  }
  
  return phases;
}

function generateTemplateReading(ben, bian, hu, changingCount) {
  const theme = READING_TEMPLATES[state.theme] || READING_TEMPLATES.self;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  
  const matrix = generateMatrix(ben, changingCount);
  const actionKey = matrix.recommended;
  const actionLabels = { advance: '进', retreat: '退', hold: '守', change: '变' };
  
  const yaoExplanations = state.yaos.filter(y => y.changing).map((yao, i) => {
    const pos = state.yaos.indexOf(yao);
    const posNames = ['初爻', '二爻', '三爻', '四爻', '五爻', '上爻'];
    const explanations = [
      `${posNames[pos]}发动，意味着事情才刚刚开始变化，根基处有动向。此时最需要的是稳住心态，不要因为一点风吹草动就乱了阵脚。`,
      `${posNames[pos]}发动，说明你正在进入状态，此时的选择会影响后续的发展。找对位置，看清方向，再稳步前行。`,
      `${posNames[pos]}发动，这是最凶险的位置，处在上下之间，进退两难。此时务必谨慎，不冒进、不退缩，小心驶得万年船。`,
      `${posNames[pos]}发动，你已经过了最艰难的阶段，但还没到放松的时候。继续保持警惕，同时可以开始尝试一些新的可能性。`,
      `${posNames[pos]}发动，这是最好的位置！君位之爻动，说明你已经掌握了主动权，可以大展身手，但切记不要得意忘形。`,
      `${posNames[pos]}发动，事情已经发展到了尾声，该有个结果了。此时要懂得适可而止，功成身退是大智慧。`
    ];
    return explanations[pos];
  });
  
  const shareQuotes = [
    `${ben.tagline}。${theme.action_advice[actionKey].substring(0, 30)}...`,
    `得「${ben.name}」卦，宜${actionLabels[actionKey]}。${ben.tagline.split('，')[1] || ben.tagline}`,
    `观象得「${ben.name}」，${changingCount > 0 ? `${changingCount}爻动，变「${bian.name}」。` : '六爻安静。'} ${ben.tagline}`
  ];
  
  return {
    general: pick(theme.general_intro),
    specific: `你此刻的状态，正应了「${ben.name}」卦的象。`,
    benExplain: `「${ben.name}」者，${ben.tagline}。这正是你当下处境的写照——${pick(theme.psychology).substring(0, 50)}...`,
    bianExplain: changingCount > 0 ? `变卦「${bian.name}」提示你，事情的发展方向是「${bian.tagline}」。这不是定数，而是如果你按照当前状态走下去最可能的结果。` : '',
    psychology: pick(theme.psychology),
    advice: theme.action_advice[actionKey],
    yaoExplanations,
    shareQuote: pick(shareQuotes)
  };
}

async function tryOllamaReading(ben, bian, hu, changingCount) {
  try {
    const prompt = `你是一位精通周易的解卦大师，同时懂得现代心理学。请根据以下信息解卦：
主题：${THEMES[state.theme]?.name}
用户经历：${state.experience}
当前心情：${state.mood}
最担心的事：${state.worry}
本卦：第${ben.id}卦 ${ben.name}，${ben.tagline}
变卦：${changingCount > 0 ? `第${bian.id}卦 ${bian.name}，${bian.tagline}，${changingCount}爻动` : '无动爻'}
互卦：第${hu.id}卦 ${hu.name}

请用富有东方智慧但不迷信的语言，给出：
1. 总解读（150字左右，语气温和克制，不要恐吓）
2. 心理学视角的解读（100字左右，把卦象翻译成心理语言）
3. 具体建议（100字左右，给出进退守变的方向）
4. 一句适合分享的话（30字以内）

要求：稳重、克制、有温度，不要说"大凶""必败"之类的话，而是给出建设性的启发。`;

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    
    const response = await fetch('http://localhost:11434/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'qwen2.5:7b',
        prompt: prompt,
        stream: false
      }),
      signal: controller.signal
    });
    
    clearTimeout(timeoutId);
    
    if (!response.ok) throw new Error('Ollama error');
    
    const data = await response.json();
    const text = data.response || '';
    
    // 简单解析返回内容
    const parts = text.split(/\d\.\s*/).filter(p => p.trim());
    
    return {
      general: parts[0] || '卦象已显，请静心体会。',
      specific: '',
      benExplain: `「${ben.name}」者，${ben.tagline}。`,
      bianExplain: '',
      psychology: parts[1] || '反观内心，答案已在你心中。',
      advice: parts[2] || '顺其自然，为所当为。',
      yaoExplanations: [],
      shareQuote: parts[3] || `${ben.name}卦：${ben.tagline}`
    };
  } catch (e) {
    console.log('Ollama不可用，使用模板模式', e);
    return null;
  }
}

  document.getElementById('reportPage').classList.remove('active');
  // 重置卦
  state.yaos = [];
  document.getElementById('yaoDisplay').innerHTML = '';
  initSticks();
  updateActionHint();
}

function shareReport() {
  // 简单的分享模拟
  const text = `我在「观象」得到一卦，快来看看吧~`;
  if (navigator.share) {
    navigator.share({
      title: '观象·周易AI算命',
      text: text
    }).catch(() => {});
  } else {
    // 复制到剪贴板
    const ta = document.createElement('textarea');
    ta.value = text + ' (截图分享你的卦象吧)';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    alert('已复制分享文案，截图分享你的卦象吧~');
  }
}
