{% extends "base.html" %}
{% block title %}待办事项{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h2 class="card-title">待办事项</h2>
  </div>

  <div class="filter-bar mb-16">
    <button class="btn btn-outline btn-sm active" data-source="all">全部</button>
    <button class="btn btn-outline btn-sm" data-source="sale">小卖部</button>
    <button class="btn btn-outline btn-sm" data-source="express">快递</button>
    <button class="btn btn-outline btn-sm" data-source="board">大屏</button>
  </div>

  <div id="todo-list"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var currentSource = 'all';

  function renderTodos(todos) {
    todos.sort(function(a, b) {
      if (a.is_done !== b.is_done) {
        return a.is_done ? 1 : -1;
      }
      var order = { high: 0, medium: 1 };
      return (order[a.priority] || 2) - (order[b.priority] || 2);
    });

    var container = document.getElementById('todo-list');
    var html = '';

    if (todos.length === 0) {
      html = '<div style="text-align:center;padding:40px;color:var(--gray-400);">暂无待办事项</div>';
    } else {
      todos.forEach(function(todo) {
        var priCls = todo.priority === 'high' ? 'priority-high' : 'priority-medium';
        var doneHtml = '<span class="todo-action">' + (todo.is_done
          ? '<span class="badge badge-green ml-8">已完成</span>'
          : '<button class="btn btn-xs btn-outline ml-8" onclick="event.stopPropagation();markDone(\'' + todo._id + '\')">完成</button>') + '</span>';

        var typeLabels = {
          'expired_wastage': '过期报损',
          'express_timeout': '快递超时',
          'manual_assist': '人工协助'
        };
        var typeLabel = typeLabels[todo.type] || todo.type;

        html +=
          '<div class="mb-16 ' + priCls + '" style="border-left:4px solid;border-radius:4px;background:var(--gray-50);padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08);" data-todo-id="' + todo._id + '">' +
            '<div class="flex flex-between">' +
              '<strong>' + escapeHtml(todo.title) + '</strong>' +
              doneHtml +
            '</div>' +
            '<div style="margin-top:6px;color:var(--gray-600);font-size:14px;">' + escapeHtml(todo.content || '') + '</div>' +
            '<div class="flex flex-between" style="margin-top:10px;font-size:13px;color:var(--gray-500);">' +
              '<div class="flex gap-8">' +
                '<span class="badge badge-blue">' + escapeHtml(todo.source_system) + '</span>' +
                '<span class="badge badge-gray">' + escapeHtml(typeLabel) + '</span>' +
              '</div>' +
              '<div class="flex gap-8">' +
                '<span>' + formatDate(todo.created_at) + '</span>' +
                (todo.related_id ? '<span style="color:var(--gray-400);">#' + escapeHtml(todo.related_id) + '</span>' : '') +
              '</div>' +
            '</div>' +
          '</div>';
      });
    }

    container.innerHTML = html;
  }

  function fetchTodos(source) {
    apiGet('/api/todos?source=' + source).then(function(data) {
      var todos = Array.isArray(data) ? data : (data.todos || data.data || []);
      renderTodos(todos);
    });
  }

  var filterBtns = document.querySelectorAll('.filter-bar .btn');
  filterBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      filterBtns.forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      currentSource = this.dataset.source;
      fetchTodos(currentSource);
    });
  });

  fetchTodos('all');
})();

function markDone(todoId) {
  var card = document.querySelector('[data-todo-id="' + todoId + '"]');
  if (!card) return;
  // 乐观更新：立即变完成
  var btnArea = card.querySelector('.todo-action');
  var doneBadge = '<span class="badge badge-green ml-8">已完成</span>';
  card.style.opacity = '0.55';
  card.style.background = '#f5f5f5';
  btnArea.innerHTML = doneBadge;
  apiPut('/api/todos/' + todoId + '/done', {}).then(function() {
    showToast('已标记完成', 'success');
  }).catch(function() {
    // 回滚
    card.style.opacity = '';
    card.style.background = '';
    btnArea.innerHTML = '<button class="btn btn-xs btn-outline ml-8" onclick="event.stopPropagation();markDone(\'' + todoId + '\')">完成</button>';
    showToast('操作失败', 'error');
  });
}
</script>
{% endblock %}
