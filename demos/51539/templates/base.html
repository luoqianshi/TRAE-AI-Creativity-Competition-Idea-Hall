<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小卖部管理系统 - {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  {% block navbar %}
  <nav class="navbar">
    <div class="nav-brand">小卖部管理系统</div>
    <div class="nav-links" id="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">工作台</a>
      <a href="/products" class="nav-link {% if request.path == '/products' %}active{% endif %}">商品</a>
      <a href="/express" class="nav-link {% if request.path == '/express' %}active{% endif %}">快递</a>
      <a href="/orders" class="nav-link {% if request.path == '/orders' %}active{% endif %}">订单</a>
      <a href="/todos" class="nav-link {% if request.path == '/todos' %}active{% endif %}">待办</a>
      <a href="/audit-log" class="nav-link {% if request.path == '/audit-log' %}active{% endif %}">审计日志</a>
      <a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}">设置</a>
      <a href="/board" target="_blank" class="nav-link">大屏</a>
    </div>
  </nav>
  {% endblock %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container"></div>
  <div id="modal-overlay" class="modal-overlay" style="display:none;"></div>

  <!-- 大屏求助气泡（仅工作人员页面） -->
  <div id="help-bubble" class="help-bubble" style="display:none;" aria-live="assertive">
    <span class="help-bubble-icon">🆘</span>
    <div class="help-bubble-body">
      <div class="help-bubble-title">大屏有顾客请求协助</div>
      <div class="help-bubble-detail" id="help-bubble-detail"></div>
    </div>
    <a href="/todos" class="help-bubble-link">去处理 →</a>
    <button class="help-bubble-close" onclick="dismissHelpBubble()" aria-label="关闭提示">✕</button>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/cart.js"></script>
  <script src="/static/js/remarks.js"></script>
  <script src="/static/js/file-upload.js"></script>
  <script src="/static/js/express-forms.js"></script>
  <script>
   // ── 统一待办提醒气泡（工作人员页面轮询）──
   (function() {
     // 大屏页面不显示气泡
     if (document.getElementById('help-btn')) return;

     var bubble = document.getElementById('help-bubble');
     var bubbleTitle = bubble.querySelector('.help-bubble-title');
     var bubbleDetail = document.getElementById('help-bubble-detail');
     var bubbleIcon = bubble.querySelector('.help-bubble-icon');
     var seenKey = null;
     var dismissed = false;
     var BUBBLE_POLL_MS = 3000;

     window.dismissHelpBubble = function() {
       dismissed = true;
       bubble.style.display = 'none';
     };

     function checkBubble() {
       if (dismissed) return;
       fetch('/api/board/unread-status')
         .then(function(r) { return r.json(); })
         .then(function(data) {
           if (!data.active) {
             bubble.style.display = 'none';
             seenKey = null;
             dismissed = false;
             return;
           }
           // 有待办，获取最高优先级详情
           fetch('/api/board/unread-latest')
             .then(function(r) { return r.json(); })
             .then(function(todo) {
               if (!todo.type) return;
               var key = todo.type + '|' + (todo.related_id || '');

               if (todo.type === 'manual_assist') {
                 // 求助永远第一：醒目样式
                 if (key !== seenKey) {
                   seenKey = key;
                   dismissed = false;
                   bubbleIcon.textContent = '🆘';
                   bubbleTitle.textContent = '大屏有顾客请求协助';
                   bubbleDetail.textContent = todo.related_id ? '单号：' + todo.related_id : '';
                   bubble.style.background = '#991b1b';
                   bubble.style.display = '';
                 }
               } else {
                 // 其他待办：只有没有求助时才显示
                 if (key !== seenKey) {
                   seenKey = key;
                   dismissed = false;
                   bubbleIcon.textContent = '📋';
                   bubbleTitle.textContent = todo.type_label || todo.title;
                   bubbleDetail.textContent = todo.title;
                   bubble.style.background = 'var(--gray-800)';
                   bubble.style.display = '';
                 }
               }
             })
             .catch(function() {});
         })
         .catch(function() {});
     }

     checkBubble();
     setInterval(checkBubble, BUBBLE_POLL_MS);
   })();
   </script>
  {% block scripts %}{% endblock %}
</body>
</html>
