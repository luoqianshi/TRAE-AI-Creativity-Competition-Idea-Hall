{% extends "base.html" %}
{% block title %}商品{% endblock %}

{% block content %}
<style>
.tab-nav { display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
.tab-nav button { padding:8px 16px; border:1px solid var(--gray-300); background:#fff; color:var(--gray-700); border-radius:6px; cursor:pointer; font-size:14px; }
.tab-nav button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.tab-content { display:none; }
.tab-content.active { display:block; }
.cart-item-unit { font-size:12px; color:var(--gray-400); margin-left:4px; }
@media (prefers-color-scheme: dark) {
  .tab-nav button { background:var(--gray-100); color:var(--gray-600); border-color:var(--gray-300); }
}
</style>

<div class="tab-nav" id="tab-nav">
  <button class="active" data-tab="tab-products">商品管理</button>
  <button data-tab="tab-checkout">收银台</button>
</div>

<!-- Tab: 商品管理 -->
<div class="tab-content active" id="tab-products">
  <div class="card">
    <div class="card-header flex flex-between">
      <h2 class="card-title">商品管理</h2>
      <button type="button" class="btn btn-primary" onclick="openCreateModal()">新增商品</button>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchKeyword" class="search-bar form-input" placeholder="搜索商品名称或编码..." onkeydown="if(event.key==='Enter')loadProducts()">
      <label class="form-checkbox">
        <input type="checkbox" id="filterActive" onchange="loadProducts()"> 仅上架
      </label>
      <button class="btn btn-primary" onclick="loadProducts()">搜索</button>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>编码</th>
            <th>名称</th>
            <th>单价</th>
            <th>单位</th>
            <th>库存</th>
            <th>易腐</th>
            <th>散装</th>
            <th>凭证</th>
            <th>备注</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="productTableBody">
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Tab: 收银台 -->
<div class="tab-content" id="tab-checkout">
  <div class="two-col">
    <div>
      <div class="flex flex-between gap-8 mb-16">
        <div class="search-bar" style="flex:1;margin-bottom:0;">
          <input type="text" class="form-input" id="search-input" placeholder="搜索商品..." autocomplete="off">
          <button class="btn btn-primary" id="search-btn">搜索</button>
        </div>
        <button class="btn btn-outline" id="temp-product-btn">临时商品</button>
      </div>
      <div class="product-grid" id="product-grid">
        <div style="grid-column:1/-1;text-align:center;color:var(--gray-400);padding:40px;">输入关键词搜索商品</div>
      </div>
    </div>

    <div class="cart-panel">
      <div class="cart-header">购物车</div>
      <div class="cart-body" id="cart-body">
        <div class="cart-empty">购物车为空</div>
      </div>
      <div class="cart-footer">
        <div class="cart-total" id="cart-total">总计：<span>0 单位商品</span> ¥0.00</div>
        <div class="cart-attachments" id="cart-attachments"></div>
        <div style="margin-bottom:8px;">
          <input type="file" accept="image/*" style="display:none;" id="checkout-file-input" onchange="CartModule.handleUpload(this)">
          <button type="button" class="btn btn-outline btn-sm" id="checkout-upload-btn" onclick="document.getElementById('checkout-file-input').click()">上传凭证</button>
        </div>
        <button class="btn btn-success cart-checkout" id="checkout-btn" disabled>结账</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/products.js"></script>
{% endblock %}
