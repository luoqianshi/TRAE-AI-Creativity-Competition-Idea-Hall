{% extends "base.html" %}
{% block navbar %}{% endblock %}
{% block title %}大屏{% endblock %}

{% block content %}
<style>
/* 大屏专用样式，复用 app.css 变量 */
.board-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 40px 48px 24px;
}

/* 页头 */
.board-header {
  text-align: center;
  margin-bottom: 40px;
}
.board-header h1 {
  font-size: 42px;
  font-weight: 700;
  color: var(--gray-800);
  letter-spacing: 6px;
}
.board-header .subtitle {
  font-size: 15px;
  color: var(--gray-500);
  margin-top: 8px;
  letter-spacing: 2px;
}

/* 搜索栏 */
.board-search {
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: 640px;
  margin: 0 auto 40px;
}
.board-search .form-input {
  flex: 1;
  font-size: 16px;
  padding: 12px 20px;
  border-radius: var(--radius);
}
.board-search-result {
  font-size: 13px;
  color: var(--gray-500);
  text-align: center;
  margin-top: 8px;
  min-height: 20px;
}

/* 主体双栏 */
.board-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  align-items: start;
}
@media (max-width: 900px) {
  .board-grid { grid-template-columns: 1fr; }
}

/* 分组标题 */
.board-section-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--gray-800);
  border-left: 4px solid var(--primary);
  padding-left: 16px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.board-section-title .badge {
  font-size: 13px;
  font-weight: 600;
}

/* 商品卡片 */
.board-product-card {
  padding: 24px 28px;
  margin-bottom: 16px;
}
.board-product-card .prod-name {
  font-size: 22px;
  font-weight: 700;
  color: var(--gray-800);
  margin-bottom: 4px;
}
.board-product-card .prod-code {
  font-size: 12px;
  color: var(--gray-400);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.board-product-card .prod-meta {
  display: flex;
  align-items: center;
  gap: 24px;
  flex-wrap: wrap;
}
.board-product-card .prod-price {
  font-size: 20px;
  font-weight: 700;
  color: var(--danger);
}
.board-product-card .prod-stock {
  font-size: 14px;
  color: var(--gray-600);
  background: var(--gray-50);
  padding: 4px 14px;
  border-radius: 14px;
  font-weight: 600;
}
.board-product-card .prod-stock.low {
  color: var(--danger);
  background: var(--danger-bg);
}
.board-product-card .prod-credential {
  font-size: 12px;
  background: #dbeafe;
  color: var(--primary);
  padding: 4px 12px;
  border-radius: 12px;
  font-weight: 600;
}
.board-product-card .prod-remarks {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--gray-100);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.board-product-card .remark-row {
  display: flex;
  gap: 16px;
  font-size: 14px;
}
.board-product-card .remark-key {
  color: var(--gray-500);
  font-weight: 600;
  min-width: 56px;
}
.board-product-card .remark-val {
  color: var(--gray-700);
  font-weight: 600;
}

/* 包裹网格 */
#packages-container.board-package-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

/* 包裹卡片 */
.board-package-card {
  padding: 24px 28px;
  margin-bottom: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.board-package-card .pkg-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.board-package-card .pkg-id {
  font-size: 12px;
  color: var(--gray-400);
  letter-spacing: 1px;
}
.board-package-card .pkg-badge {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 600;
}
.pkg-badge-receive { background: #dbeafe; color: var(--primary); }
.pkg-badge-send   { background: var(--warning-bg); color: #92400e; }
.board-package-card .pkg-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.board-package-card .pkg-meta-item {
  font-size: 14px;
  color: var(--gray-600);
}
.board-package-card .pkg-fee {
  font-size: 18px;
  font-weight: 700;
  color: var(--danger);
}
.board-package-card .pkg-time {
  font-size: 12px;
  color: var(--gray-400);
  margin-left: auto;
}
.board-package-card .pkg-remarks {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--gray-100);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* 公告区 */
.board-announcement {
  margin-top: 40px;
}
.board-announcement .board-section-title {
  margin-bottom: 20px;
}
.board-announcement .card {
  min-height: 0;
  padding: 0;
  overflow: hidden;
}
.board-announcement iframe {
  width: 100%;
  border: none;
  display: block;
  min-height: 200px;
}

/* 空状态 */
.board-empty {
  text-align: center;
  padding: 48px 24px;
  color: var(--gray-400);
  font-size: 16px;
}

/* 加载状态 */
.board-loading {
  text-align: center;
  padding: 48px 24px;
  color: var(--gray-500);
  font-size: 15px;
}

/* 底部 */
.board-footer {
  text-align: center;
  padding: 32px 0 16px;
  color: var(--gray-400);
  font-size: 13px;
  letter-spacing: 1px;
}
.board-footer .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  margin-right: 6px;
  vertical-align: middle;
}

/* 人工协助按钮 */
.board-help-btn {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 900;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 18px 32px;
  font-size: 22px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #f97316, #dc2626);
  border: none;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(220,38,38,.4);
  animation: pulse-help 2s ease-in-out infinite;
  transition: transform .15s, box-shadow .15s;
}
.board-help-btn:hover,
.board-help-btn:focus-visible {
  transform: scale(1.06);
  box-shadow: 0 8px 32px rgba(220,38,38,.55);
}
.board-help-btn .help-icon {
  font-size: 28px;
  line-height: 1;
}
@keyframes pulse-help {
  0%, 100% { box-shadow: 0 6px 24px rgba(220,38,38,.4); }
  50% { box-shadow: 0 6px 36px rgba(220,38,38,.7); }
}

/* 帮助弹窗 */
.help-modal {
  text-align: center;
  max-width: 400px;
}
.help-modal .help-modal-icon {
  font-size: 56px;
  margin-bottom: 16px;
  display: block;
}
.help-modal .help-modal-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--gray-800);
  margin-bottom: 12px;
}
.help-modal .help-modal-text {
  font-size: 15px;
  color: var(--gray-600);
  line-height: 1.6;
  margin-bottom: 24px;
}
.help-modal .help-modal-timer {
  font-size: 13px;
  color: var(--gray-400);
  margin-top: 12px;
}

/* 搜索栏增强 */
.board-search .search-btn {
  flex-shrink: 0;
  padding: 12px 20px;
  font-size: 16px;
}

/* 无障碍：隐藏但可聚焦 */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
</style>

<div class="board-container">
  <a href="#main-content" class="skip-link">跳到主要内容</a>

  <div class="board-header">
    <h1>小卖部大屏</h1>
    <div class="subtitle">商品及待取快递信息实时展示</div>
  </div>

  <div class="board-search" role="search" aria-label="搜索商品和包裹">
    <label for="search-input" class="sr-only">搜索商品和包裹</label>
    <input type="text" class="form-input" id="search-input" placeholder="搜索商品名称、编码、备注或包裹信息…" autocomplete="off" aria-label="搜索商品名称、编码、备注或包裹信息">
    <button class="btn btn-primary search-btn" id="search-btn" aria-label="搜索" onclick="document.getElementById('search-input').dispatchEvent(new Event('input',{bubbles:true}))">搜索</button>
  </div>
  <div class="board-search-result" id="search-count" aria-live="polite"></div>

  <div id="main-content">
    <!-- 公告区 -->
    <div class="board-announcement" id="announcement-section" role="region" aria-labelledby="announcement-title">
      <h2 class="board-section-title" id="announcement-title">公告</h2>
      <div class="card">
        <div class="board-loading" id="custom-loading">加载中...</div>
        <iframe id="custom-frame" sandbox="allow-same-origin allow-scripts" title="公告内容" style="display:none;"></iframe>
      </div>
    </div>

    <div class="board-grid">
      <!-- 商品区 -->
      <div role="region" aria-labelledby="products-title">
        <h2 class="board-section-title" id="products-title">
          商品价格表
          <span class="badge badge-blue" id="product-badge" aria-label="商品数量">0</span>
        </h2>
        <div id="products-container">
          <div class="board-loading">加载中...</div>
        </div>
      </div>
      <!-- 包裹区 -->
      <div role="region" aria-labelledby="packages-title">
        <h2 class="board-section-title" id="packages-title">
          待取包裹
          <span class="badge badge-green" id="package-badge" aria-label="包裹数量">0</span>
        </h2>
        <div id="packages-container" class="board-package-grid">
          <div class="board-loading">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="board-footer" aria-live="polite" aria-atomic="true">
    <span class="dot"></span><span id="update-time">--</span>
  </div>

  <!-- 人工协助按钮 -->
  <button class="board-help-btn" id="help-btn" aria-label="请求人工协助">
    <span class="help-icon" aria-hidden="true">🆘</span>
    <span>我不会？人工协助！</span>
  </button>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var pollInterval = {{ poll_interval }};
  var pollTimer = null;

  var searchInput    = document.getElementById('search-input');
  var searchCount    = document.getElementById('search-count');
  var productBadge   = document.getElementById('product-badge');
  var packageBadge   = document.getElementById('package-badge');
  var productsEl     = document.getElementById('products-container');
  var packagesEl     = document.getElementById('packages-container');
  var customFrame    = document.getElementById('custom-frame');
  var customLoading  = document.getElementById('custom-loading');
  var updateTimeEl   = document.getElementById('update-time');

  var cachedData = { products: [], packages: [] };
  var searchTimer = null;

  function renderProducts(products) {
    if (!products || products.length === 0) {
      productsEl.innerHTML = '<div class="card board-empty" role="status">暂无商品</div>';
      productBadge.textContent = '0';
      return;
    }
    productBadge.textContent = products.length;
    var html = '';
    for (var i = 0; i < products.length; i++) {
      var p = products[i];
      var ariaLabel = '商品：' + p.name;
      if (p.price !== undefined && p.price !== null) {
        ariaLabel += '，价格' + p.price + '元';
      }
      ariaLabel += '，库存' + p.stock;
      if (p.stock < 10) {
        ariaLabel += '，库存紧张';
      }
      if (p.credential_required) {
        ariaLabel += '，需要凭证';
      }
      html += '<div class="card board-product-card" role="article" aria-label="' + escapeHtml(ariaLabel) + '">';
      if (p.ID) {
        html += '<div class="prod-code">' + escapeHtml(p.ID) + '</div>';
      }
      html += '<div class="prod-name">' + escapeHtml(p.name) + '</div>';
      html += '<div class="prod-meta">';
      if (p.price !== undefined && p.price !== null) {
        html += '<span class="prod-price">&yen;' + escapeHtml(String(p.price)) + '</span>';
      }
      var sc = p.stock < 10 ? ' prod-stock low' : ' prod-stock';
      html += '<span class="' + sc + '">库存 ' + escapeHtml(String(p.stock)) + '</span>';
      if (p.credential_required) {
        html += '<span class="prod-credential">需凭证</span>';
      }
      html += '</div>';
      var remarks = p.remarks || [];
      if (remarks.length > 0) {
        html += '<div class="prod-remarks">';
        for (var j = 0; j < remarks.length; j++) {
          var r = remarks[j];
          html += '<div class="remark-row">';
          html += '<span class="remark-key">' + escapeHtml(String(r.key)) + '</span>';
          html += '<span class="remark-val">' + escapeHtml(r.value != null ? String(r.value) : '-') + '</span>';
          html += '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }
    productsEl.innerHTML = html;
  }

  function renderPackages(packages) {
    if (!packages || packages.length === 0) {
      packagesEl.innerHTML = '<div class="card board-empty" role="status">暂无待取包裹</div>';
      packageBadge.textContent = '0';
      packagesEl.classList.remove('board-package-grid');
      return;
    }
    packagesEl.classList.add('board-package-grid');
    packageBadge.textContent = packages.length;
    var html = '';
    var typeLabels = { receive: '收件', send: '寄件' };
    for (var i = 0; i < packages.length; i++) {
      var pkg = packages[i];

      var pkgAria = '包裹：' + (pkg.ID || '无编号');
      pkgAria += '，' + (typeLabels[pkg.type] || pkg.type);
      if (pkg.recipient_name) {
        pkgAria += '，收件人' + pkg.recipient_name;
      }

      html += '<div class="card board-package-card" role="article" aria-label="' + escapeHtml(pkgAria) + '">';
      html += '<div class="pkg-header">';
      if (pkg.ID) {
        html += '<span class="pkg-id">' + escapeHtml(pkg.ID) + '</span>';
      }
      html += '<span class="pkg-badge pkg-badge-' + escapeHtml(pkg.type) + '">' + (typeLabels[pkg.type] || pkg.type) + '</span>';
      html += '</div>';

      html += '<div class="pkg-meta">';
      if (pkg.recipient_name) {
        html += '<span class="pkg-meta-item">收件人：' + escapeHtml(pkg.recipient_name) + '</span>';
      }
      if (pkg.sender_name) {
        html += '<span class="pkg-meta-item">寄件人：' + escapeHtml(pkg.sender_name) + '</span>';
        if (pkg.sender_phone) {
          html += '<span class="pkg-meta-item">' + escapeHtml(pkg.sender_phone) + '</span>';
        }
      }
      if (pkg.receive_fee) {
        html += '<span class="pkg-fee">&yen;' + escapeHtml(String(pkg.receive_fee)) + '</span>';
      }
      if (pkg.send_fee) {
        html += '<span class="pkg-fee">&yen;' + escapeHtml(String(pkg.send_fee)) + '</span>';
      }
      if (pkg.inbound_time) {
        var d = new Date(pkg.inbound_time);
        if (!isNaN(d.getTime())) {
          var pad2 = function(n) { return n < 10 ? '0' + n : n; };
          var ts = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
          html += '<span class="pkg-time">' + escapeHtml(ts) + '</span>';
        }
      }
      html += '</div>';

      var remarks = pkg.remarks || [];
      if (remarks.length > 0) {
        html += '<div class="pkg-remarks">';
        for (var j = 0; j < remarks.length; j++) {
          var r = remarks[j];
          html += '<div class="remark-row">';
          html += '<span class="remark-key">' + escapeHtml(String(r.key)) + '</span>';
          html += '<span class="remark-val">' + escapeHtml(r.value != null ? String(r.value) : '-') + '</span>';
          html += '</div>';
        }
        html += '</div>';
      }
      html += '</div>';
    }
    packagesEl.innerHTML = html;
  }

  function renderCustomHtml(html) {
    if (!html) {
      customFrame.style.display = 'none';
      customLoading.textContent = '暂无公告';
      customLoading.style.display = '';
      return;
    }
    customLoading.style.display = 'none';
    customFrame.style.display = '';
    customFrame.srcdoc = html;
    customFrame.onload = function() {
      try {
        var doc = customFrame.contentDocument || customFrame.contentWindow.document;
        if (doc && doc.body) {
          customFrame.style.height = doc.body.scrollHeight + 'px';
          customFrame.style.visibility = '';
        }
      } catch(e) {
        customFrame.style.height = '320px';
        customFrame.style.visibility = '';
      }
    };
    customFrame.style.visibility = 'hidden';
    customFrame.style.height = '0';
  }

  function updateTime(isoStr) {
    updateTimeEl.textContent = isoStr ? '最后更新 ' + formatDate(isoStr) : '--';
  }

  function fetchData(searchTerm) {
    var url = '/api/board';
    if (searchTerm) {
      url += '?search=' + encodeURIComponent(searchTerm);
    }
    apiGet(url)
      .then(function(data) {
        cachedData.products = data.products || [];
        cachedData.packages = data.packages || [];
        renderProducts(cachedData.products);
        renderPackages(cachedData.packages);
        updateTime(data.server_time);
        if (searchTerm) {
          var total = cachedData.products.length + cachedData.packages.length;
          searchCount.textContent = '找到 ' + total + ' 条结果';
          document.getElementById('announcement-section').style.display = 'none';
          // 搜索无结果且未求助过，弹出提示
          if (total === 0 && !helpRequested) {
            showNoResultPrompt();
          }
        } else {
          searchCount.textContent = '';
          document.getElementById('announcement-section').style.display = '';
        }
        renderCustomHtml(data.custom_html);
      })
      .catch(function(err) {
        showToast('数据加载失败: ' + err.message, 'error');
      });
  }

  var currentSearch = '';
  var helpRequested = false;

  searchInput.addEventListener('input', function() {
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function() {
      currentSearch = searchInput.value.trim();
      fetchData(currentSearch);
    }, 300);
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (searchTimer) clearTimeout(searchTimer);
      currentSearch = searchInput.value.trim();
      fetchData(currentSearch);
    }
  });

  searchInput.addEventListener('focus', function() { stopPolling(); });
  searchInput.addEventListener('blur', function() {
    fetchData(currentSearch);
    startPolling();
  });

  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(function() {
      fetchData(currentSearch);
      // 如果已请求帮助，周期性检查待办是否已完成
      if (helpRequested) {
        checkHelpStatus();
      }
    }, pollInterval);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  fetchData('');

  // ── 先隐藏按钮，状态确认后再显示（避免刷新闪烁）──
  var helpBtn = document.getElementById('help-btn');
  helpBtn.style.visibility = 'hidden';

  // ── 检查是否有未完成的协助待办（刷新后恢复状态）──
  apiGet('/api/board/help-status')
    .then(function(statusRes) {
      if (statusRes.active) {
        helpRequested = true;
        updateHelpBtnDone();
        console.log('[大屏] 检测到未完成协助待办，按钮已置为已请求状态');
      }
      helpBtn.style.visibility = '';
      startPolling();
    })
    .catch(function() {
      helpBtn.style.visibility = '';
      startPolling();
    });

  // ── 人工协助按钮 ──
  var helpTimer = null;
  var helpCountdown = null;

  // 搜索无结果时弹出求助提示
  function showNoResultPrompt() {
    console.log('[大屏] 搜索无结果，弹出求助提示');
    var modalOverlay = document.getElementById('modal-overlay');
    modalOverlay.innerHTML =
      '<div class="modal help-modal">' +
      '  <span class="help-modal-icon" aria-hidden="true">🔍</span>' +
      '  <h2 class="help-modal-title">没找到？</h2>' +
      '  <p class="help-modal-text">没有找到匹配的结果。<br>是否需要工作人员协助查找？</p>' +
      '  <button class="btn btn-primary" id="help-prompt-call" style="font-size:18px;padding:12px 32px;">🤙 呼叫人工协助</button>' +
      '  <button class="btn btn-outline" id="help-prompt-dismiss" style="margin-left:8px;font-size:16px;padding:10px 24px;">不用了</button>' +
      '</div>';
    modalOverlay.style.display = '';

    if (helpTimer) clearTimeout(helpTimer);
    helpTimer = setTimeout(function() {
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeHelpModal();
      });
    }, 100);

    var callBtn = document.getElementById('help-prompt-call');
    if (callBtn) {
      callBtn.addEventListener('click', function() {
        closeHelpModal();
        requestHelp('搜索建议');
      });
    }

    var dismissBtn = document.getElementById('help-prompt-dismiss');
    if (dismissBtn) {
      dismissBtn.addEventListener('click', closeHelpModal);
    }
  }

  // 实际发起协助请求
  function requestHelp(sourceType) {
    sourceType = sourceType || '手动按钮';
    console.log('[大屏] 顾客请求人工协助，来源：' + sourceType);

    apiPost('/api/board/help-request', { search: currentSearch, source_type: sourceType })
      .then(function(res) {
        console.log('[大屏] 人工协助请求已发送, todo_id:', res.todo_id, ', ticket_no:', res.ticket_no);
        helpRequested = true;

        // 显示弹窗
        var modalOverlay = document.getElementById('modal-overlay');
        modalOverlay.innerHTML =
          '<div class="modal help-modal">' +
          '  <span class="help-modal-icon" aria-hidden="true">👋</span>' +
          '  <h2 class="help-modal-title">已通知工作人员</h2>' +
          '  <p class="help-modal-text">工作人员已收到您的协助请求，请稍候。<br>工作人员将尽快前来协助您。</p>' +
          '  <p class="help-modal-text" style="font-size:13px;color:var(--gray-400);margin-top:-12px;">请求单号：<strong style="color:var(--primary);">' + escapeHtml(res.ticket_no || '') + '</strong></p>' +
          '  <button class="btn btn-primary" id="help-modal-close">我知道了（<span id="help-countdown">10</span>秒后自动关闭）</button>' +
          '  <div class="help-modal-timer">请勿离开，工作人员马上到</div>' +
          '</div>';
        modalOverlay.style.display = '';

        // 倒计时自动关闭
        var seconds = 10;
        var countdownEl = document.getElementById('help-countdown');
        if (helpCountdown) clearInterval(helpCountdown);
        helpCountdown = setInterval(function() {
          seconds--;
          if (countdownEl) countdownEl.textContent = seconds;
          if (seconds <= 0) {
            clearInterval(helpCountdown);
            closeHelpModal();
          }
        }, 1000);

        // 关闭按钮
        var closeBtn = document.getElementById('help-modal-close');
        if (closeBtn) {
          closeBtn.addEventListener('click', closeHelpModal);
        }

        // 点击遮罩关闭
        if (helpTimer) clearTimeout(helpTimer);
        helpTimer = setTimeout(function() {
          modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeHelpModal();
          });
        }, 100);
      })
      .catch(function(err) {
        console.error('[大屏] 人工协助请求失败:', err);
        showToast('请求失败，请重试', 'error');
      });
  }

  helpBtn.addEventListener('click', function() {
    if (helpRequested) {
      // 已经求助过，提示已有请求
      console.log('[大屏] 顾客再次点击按钮，已有请求在处理中');
      showToast('工作人员已收到请求，请耐心等待', 'info');
      return;
    }
    requestHelp('手动按钮');
  });

  function closeHelpModal() {
    if (helpCountdown) { clearInterval(helpCountdown); helpCountdown = null; }
    var modalOverlay = document.getElementById('modal-overlay');
    modalOverlay.style.display = 'none';
    modalOverlay.innerHTML = '';

    // 弹窗关闭后更新按钮状态
    if (helpRequested) {
      updateHelpBtnDone();
    }
  }

  function updateHelpBtnDone() {
    helpBtn.innerHTML = '<span class="help-icon" aria-hidden="true">✅</span><span>不要离开，工作人员已收到请求</span>';
    helpBtn.style.background = 'linear-gradient(135deg, #16a34a, #15803d)';
    helpBtn.style.boxShadow = '0 4px 16px rgba(22,163,74,.35)';
    helpBtn.style.animation = 'none';
    helpBtn.style.cursor = 'not-allowed';
    helpBtn.style.opacity = '0.85';
    helpBtn.title = '工作人员已收到请求，请耐心等待';
    helpBtn.disabled = true;
  }

  function resetHelpBtn() {
    helpRequested = false;
    helpBtn.innerHTML = '<span class="help-icon" aria-hidden="true">🆘</span><span>我不会？人工协助！</span>';
    helpBtn.removeAttribute('style');
    helpBtn.disabled = false;
  }

  function checkHelpStatus() {
    apiGet('/api/board/help-status')
      .then(function(statusRes) {
        if (!statusRes.active && helpRequested) {
          console.log('[大屏] 待办已完成，按钮恢复为初始状态');
          resetHelpBtn();
        }
      })
      .catch(function() {
        // 查询失败静默忽略
      });
  }
})();
</script>
{% endblock %}
