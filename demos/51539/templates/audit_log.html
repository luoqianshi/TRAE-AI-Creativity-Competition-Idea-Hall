{% extends "base.html" %}
{% block title %}审计日志{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h2 class="card-title">审计日志</h2>
  </div>

  <div class="filter-bar mb-16">
    <input type="date" class="form-input" id="date-from" style="width:160px;">
    <span style="color:var(--gray-400);">至</span>
    <input type="date" class="form-input" id="date-to" style="width:160px;">
    <select class="form-select" id="action-filter" style="width:130px;">
      <option value="">全部操作</option>
      <option value="product">商品操作</option>
      <option value="order">订单操作</option>
      <option value="express">快递操作</option>
      <option value="system">系统操作</option>
      <option value="todo">待办</option>
    </select>
    <button class="btn btn-primary btn-sm" onclick="searchAuditLogs()">查询</button>
  </div>

  <div class="table-wrap">
    <table class="table">
      <thead>
        <tr>
          <th style="width:160px;">时间</th>
          <th style="width:100px;">操作类型</th>
          <th style="width:140px;">目标</th>
          <th>摘要</th>
          <th style="width:100px;">金额</th>
        </tr>
      </thead>
      <tbody id="audit-tbody"></tbody>
    </table>
  </div>

  <div class="flex flex-between mt-16" id="pagination" style="display:none;">
    <span id="page-info" style="color:var(--gray-500);font-size:13px;"></span>
    <div class="flex gap-8">
      <button class="btn btn-outline btn-sm" id="prev-btn" onclick="prevPage()">上一页</button>
      <button class="btn btn-outline btn-sm" id="next-btn" onclick="nextPage()">下一页</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  var currentPage = 1;
  var totalPages = 1;
  var pageSize = 50;

  var AUDIT_ACTION_LABELS = {
    'create_product': '创建商品', 'update_product': '更新商品', 'delete_product': '删除商品',
    'product_discontinue': '商品下架', 'product_relist': '商品上架', 'restock': '补货',
    'checkout': '收银结账', 'refund': '订单退款',
    'express_in': '收件入库', 'express_out': '取件出库', 'express_send': '发快递',
    'express_return': '退回', 'express_waste': '报损', 'express_reject': '拒收',
    'express_collect': '揽收', 'express_update': '编辑快递', 'express_force_status': '强制改状态',
    'express_refund': '快递退款',
    'expired_wastage': '过期报损', 'express_timeout_return': '超时退回',
    'batch_waste': '批次报损', 'update_settings': '系统设置',
    'mark_todo_done': '标记完成待办'
  };

  function buildUrl(page) {
    var params = [];
    var dateFrom = document.getElementById('date-from').value;
    var dateTo = document.getElementById('date-to').value;
    var action = document.getElementById('action-filter').value;
    if (dateFrom) params.push('date_from=' + encodeURIComponent(dateFrom));
    if (dateTo) params.push('date_to=' + encodeURIComponent(dateTo));
    if (action) params.push('action=' + encodeURIComponent(action));
    params.push('page=' + page);
    params.push('page_size=' + pageSize);
    return '/api/audit-logs?' + params.join('&');
  }

  function searchAuditLogs() {
    currentPage = 1;
    fetchLogs();
  }

  function prevPage() {
    if (currentPage > 1) { currentPage--; fetchLogs(); }
  }

  function nextPage() {
    if (currentPage < totalPages) { currentPage++; fetchLogs(); }
  }

  function fetchLogs() {
    var tbody = document.getElementById('audit-tbody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--gray-400);">加载中...</td></tr>';

    apiGet(buildUrl(currentPage)).then(function(data) {
      var logs = data.logs || [];
      totalPages = Math.ceil(data.total / pageSize) || 1;

      if (!logs.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--gray-400);padding:40px;">暂无审计记录</td></tr>';
        document.getElementById('pagination').style.display = 'none';
        return;
      }

      tbody.innerHTML = logs.map(function(log) {
        var actionLabel = AUDIT_ACTION_LABELS[log.action] || log.action;
        var amountHtml = log.amount != null ? '<span style="color:var(--danger);font-weight:600;">' + formatMoney(log.amount) + '</span>' : '-';
        return '<tr>' +
          '<td>' + formatDate(log.created_at) + '</td>' +
          '<td><span class="badge badge-blue">' + escapeHtml(actionLabel) + '</span></td>' +
          '<td>' + escapeHtml(log.target_id || '-') + '</td>' +
          '<td>' + escapeHtml(log.summary || '') + '</td>' +
          '<td>' + amountHtml + '</td>' +
        '</tr>';
      }).join('');

      var pagination = document.getElementById('pagination');
      if (totalPages > 1) {
        pagination.style.display = 'flex';
        document.getElementById('page-info').textContent = '共 ' + data.total + ' 条记录，第 ' + currentPage + '/' + totalPages + ' 页';
        document.getElementById('prev-btn').disabled = currentPage <= 1;
        document.getElementById('next-btn').disabled = currentPage >= totalPages;
      } else {
        pagination.style.display = 'none';
      }
    }).catch(function() {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--gray-400);">加载失败</td></tr>';
    });
  }

  // Init
  fetchLogs();

  // Expose for onclick
  window.searchAuditLogs = searchAuditLogs;
  window.prevPage = prevPage;
  window.nextPage = nextPage;
})();
</script>
{% endblock %}
