{% extends "base.html" %}
{% block title %}系统设置{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h2 class="card-title">系统设置</h2>
  </div>
  <div style="padding:20px;max-width:500px;">
    <div class="form-group">
      <label class="form-label" for="settings-deadline-days">默认退回天数</label>
      <p class="text-muted" style="font-size:13px;margin-bottom:8px;">代收入库时截止时间自动预填为「当前时间 + N天」</p>
      <input type="number" id="settings-deadline-days" class="form-input" min="1" value="10" style="width:120px;">
    </div>
    <div class="form-group">
      <label class="form-label" for="settings-receive-fee">默认代收费用（元）</label>
      <p class="text-muted" style="font-size:13px;margin-bottom:8px;">代收入库时费用自动预填，可手动修改</p>
      <input type="number" id="settings-receive-fee" class="form-input" min="0" step="0.01" value="0" style="width:120px;">
    </div>
    <div class="form-group">
      <label class="form-label" for="settings-send-fee">默认发出费用（元）</label>
      <p class="text-muted" style="font-size:13px;margin-bottom:8px;">发快递入库时费用自动预填，可手动修改</p>
      <input type="number" id="settings-send-fee" class="form-input" min="0" step="0.01" value="0" style="width:120px;">
    </div>
    <div class="form-group">
      <label class="form-label" for="settings-custom-html">下游配置（HTML代码）</label>
      <p class="text-muted" style="font-size:13px;margin-bottom:8px;">大屏附的HTML片段</p>
      <textarea id="settings-custom-html" class="form-input" rows="6" style="font-family:monospace;font-size:13px;"></textarea>
    </div>
    <button type="button" class="btn btn-primary" onclick="saveSettings()">保存设置</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
  // Load current settings
  apiGet('/api/settings').then(function(data) {
    document.getElementById('settings-deadline-days').value = data.default_deadline_days || 10;
    document.getElementById('settings-receive-fee').value = data.default_receive_fee || 0;
    document.getElementById('settings-send-fee').value = data.default_send_fee || 0;
    document.getElementById('settings-custom-html').value = data.custom_html || '';
  }).catch(function(e) { console.error(e); });

  window.saveSettings = function() {
    var days = parseInt(document.getElementById('settings-deadline-days').value, 10);
    var receiveFee = parseFloat(document.getElementById('settings-receive-fee').value) || 0;
    var sendFee = parseFloat(document.getElementById('settings-send-fee').value) || 0;
    if (!days || days < 1) {
      showToast('退回天数必须 ≥ 1', 'error');
      return;
    }
    apiPut('/api/settings', {
      default_deadline_days: days,
      default_receive_fee: truncateMoney(receiveFee),
      default_send_fee: truncateMoney(sendFee),
      custom_html: document.getElementById('settings-custom-html').value
    }).then(function() {
      showToast('设置已保存', 'success');
    }).catch(function(e) { console.error(e); });
  };
})();
</script>
{% endblock %}
