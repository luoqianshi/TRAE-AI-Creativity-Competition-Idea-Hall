<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日穿搭 - 虚拟试衣间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #FDF6E3;
      --coral: #FF7F7F;
      --coral-light: #FFB4B4;
      --mint: #98D8C8;
      --mint-light: #B8E8DC;
      --lavender: #E8D5F2;
      --peach: #FFE5D9;
      --text-dark: #2D2D2D;
      --text-light: #6B6B6B;
      --white: #FFFFFF;
      --shadow-sm: rgba(0, 0, 0, 0.05);
      --shadow-md: rgba(0, 0, 0, 0.1);
      --shadow-lg: rgba(0, 0, 0, 0.15);
      --shadow-coral: rgba(255, 127, 127, 0.3);
      --shadow-mint: rgba(152, 216, 200, 0.3);
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #FFF5F0 0%, #FFF9F5 25%, #F0FFF9 50%, #F5F0FF 75%, #FFF0F5 100%);
      min-height: 100vh;
      color: var(--text-dark);
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(255, 127, 127, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(152, 216, 200, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(232, 213, 242, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      max-width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--coral) 0%, #FF9FAA 50%, #FFB4B4 100%);
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 8px 32px var(--shadow-coral);
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      animation: shimmer 8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(5%, 5%); }
    }

    .header h1 {
      font-family: 'Caveat', cursive;
      font-size: 3rem;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15), 0 0 40px rgba(255,255,255,0.3);
      letter-spacing: 3px;
      position: relative;
      display: inline-block;
    }

    .header h1::after {
      content: '✨';
      position: absolute;
      right: -30px;
      top: -5px;
      font-size: 1.2rem;
      animation: sparkle 2s ease-in-out infinite;
    }

    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .header p {
      color: rgba(255,255,255,0.95);
      font-size: 0.95rem;
      margin-top: 6px;
      font-weight: 300;
      letter-spacing: 1px;
      position: relative;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 24px;
      padding-bottom: 110px;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .view {
      display: none;
      animation: fadeSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .view.active {
      display: block;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tab Navigation */
    .tab-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      padding: 14px 20px;
      box-shadow: 0 -8px 32px var(--shadow-md);
      z-index: 100;
      border-radius: 24px 24px 0 0;
      border: 1px solid rgba(255,255,255,0.5);
      border-bottom: none;
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px 20px;
      border-radius: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-light);
      position: relative;
    }

    .tab-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--coral-light), var(--coral));
      border-radius: 16px;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.3s ease;
      z-index: -1;
    }

    .tab-btn:hover {
      color: var(--coral);
      transform: translateY(-2px);
    }

    .tab-btn.active {
      color: white;
    }

    .tab-btn.active::before {
      opacity: 1;
      transform: scale(1);
      box-shadow: 0 4px 16px var(--shadow-coral);
    }

    .tab-btn.active svg {
      transform: scale(1.15);
    }

    .tab-btn svg {
      width: 26px;
      height: 26px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn span {
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* Card Styles */
    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 
        0 8px 32px var(--shadow-md),
        0 0 0 1px rgba(255,255,255,0.8),
        inset 0 0 60px rgba(255,255,255,0.3);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    }

    .card-title {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: var(--coral);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 0 20px var(--shadow-coral);
    }

    .card-title svg {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 4px var(--shadow-coral));
    }

    /* Character Creation */
    .character-preview {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px;
      background: linear-gradient(180deg, rgba(255,245,240,0.8) 0%, rgba(255,255,255,0.9) 100%);
      border-radius: 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .character-preview::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 50% 0%, rgba(255,127,127,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 100%, rgba(152,216,200,0.1) 0%, transparent 50%);
    }

    .character-canvas-wrapper {
      position: relative;
      width: 200px;
      height: 320px;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,0.15));
    }

    .character-canvas {
      width: 100%;
      height: 100%;
      border-radius: 100px;
      background: transparent;
    }

    .face-upload-btn {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px var(--shadow-coral);
      z-index: 10;
    }

    .face-upload-btn:hover {
      transform: translateX(-50%) translateY(-3px);
      box-shadow: 0 8px 24px var(--shadow-coral);
    }

    .face-upload-btn svg {
      width: 16px;
      height: 16px;
    }

    .customize-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .customize-item {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 4px 16px var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .customize-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow-md);
    }

    .customize-item label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 10px;
      font-weight: 500;
    }

    .customize-item select,
    .customize-item input[type="color"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      background: white;
      transition: all 0.2s;
      color: var(--text-dark);
    }

    .customize-item select:focus {
      outline: none;
      border-color: var(--coral);
      box-shadow: 0 0 0 3px var(--shadow-coral);
    }

    .color-picker-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .color-picker-wrapper input[type="color"] {
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow-md);
    }

    .color-presets {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .color-preset {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid white;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 3px 8px var(--shadow-md);
    }

    .color-preset:hover {
      transform: scale(1.2);
      box-shadow: 0 4px 12px var(--shadow-lg);
    }

    .color-preset.selected {
      border-color: var(--coral);
      transform: scale(1.15);
    }

    /* Wardrobe */
    .upload-zone {
      border: 3px dashed var(--mint);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(135deg, rgba(152, 216, 200, 0.1) 0%, rgba(152, 216, 200, 0.05) 100%);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .upload-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--mint-light) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .upload-zone:hover {
      border-color: var(--coral);
      transform: scale(1.02);
      box-shadow: 0 8px 32px var(--shadow-mint);
    }

    .upload-zone:hover::before {
      opacity: 0.3;
    }

    .upload-zone svg {
      width: 56px;
      height: 56px;
      color: var(--mint);
      margin-bottom: 14px;
      transition: all 0.3s ease;
      filter: drop-shadow(0 4px 8px var(--shadow-mint));
      position: relative;
    }

    .upload-zone:hover svg {
      transform: scale(1.1) translateY(-4px);
      color: var(--coral);
    }

    .upload-zone p {
      color: var(--text-light);
      font-size: 0.95rem;
      position: relative;
    }

    .upload-zone span {
      color: var(--coral);
      font-weight: 600;
    }

    .category-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .category-tab {
      padding: 10px 18px;
      border: none;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-light);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255,255,255,0.5);
      font-weight: 500;
    }

    .category-tab:hover {
      background: rgba(255,255,255,0.9);
      transform: translateY(-2px);
    }

    .category-tab.active {
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
      color: white;
      box-shadow: 0 4px 16px var(--shadow-coral);
      border-color: transparent;
    }

    .wardrobe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 16px;
    }

    .clothing-item {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: grab;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 4px 16px var(--shadow-sm);
    }

    .clothing-item:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 12px 32px var(--shadow-lg);
      border-color: var(--coral-light);
    }

    .clothing-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .clothing-item .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
      border: none;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--shadow-coral);
    }

    .clothing-item:hover .delete-btn {
      opacity: 1;
      transform: scale(1);
    }

    .clothing-item .item-name {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      color: white;
      font-size: 0.75rem;
      padding: 20px 8px 8px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 50px;
      color: var(--text-light);
    }

    .empty-state svg {
      width: 72px;
      height: 72px;
      margin-bottom: 14px;
      opacity: 0.4;
    }

    /* Fitting Room */
    .fitting-room {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .fitting-canvas-wrapper {
      flex: 1;
      min-width: 280px;
      background: linear-gradient(180deg, rgba(248,244,239,0.9) 0%, rgba(255,245,240,0.9) 100%);
      border-radius: 28px;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 420px;
      border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 
        inset 0 4px 20px rgba(255,255,255,0.8),
        0 8px 32px var(--shadow-md);
      overflow: hidden;
    }

    .fitting-canvas-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60%;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.8) 0%, transparent 70%);
      pointer-events: none;
    }

    #fittingCanvas {
      max-width: 100%;
      max-height: 380px;
      border-radius: 100px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.1));
    }

    .fitting-widgets {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 10px;
    }

    .widget-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px var(--shadow-md);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255,255,255,0.8);
    }

    .widget-btn:hover {
      transform: scale(1.1);
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
      color: white;
      box-shadow: 0 6px 20px var(--shadow-coral);
    }

    .wardrobe-panel {
      width: 220px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 32px var(--shadow-md);
      max-height: 520px;
      overflow-y: auto;
      border: 1px solid rgba(255,255,255,0.8);
    }

    .wardrobe-panel::-webkit-scrollbar {
      width: 6px;
    }

    .wardrobe-panel::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
      border-radius: 3px;
    }

    .wardrobe-panel::-webkit-scrollbar-thumb {
      background: var(--coral-light);
      border-radius: 3px;
    }

    .wardrobe-panel h3 {
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      color: var(--coral);
      margin-bottom: 14px;
    }

    .outfit-layers {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px dashed rgba(0,0,0,0.08);
    }

    .outfit-layers h4 {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 14px;
      font-weight: 500;
    }

    .layer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.8);
      transition: all 0.2s ease;
    }

    .layer-item:hover {
      background: rgba(255,255,255,0.9);
      transform: translateX(4px);
    }

    .layer-item img {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 2px 8px var(--shadow-sm);
    }

    .layer-item button {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--coral);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .layer-item button:hover {
      background: rgba(255,127,127,0.1);
    }

    .save-outfit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--coral) 0%, #FF8A8A 50%, var(--coral-dark) 100%);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 6px 20px var(--shadow-coral);
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      letter-spacing: 0.5px;
    }

    .save-outfit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px var(--shadow-coral);
    }

    .save-outfit-btn:active {
      transform: translateY(-1px);
    }

    /* History */
    .calendar {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 8px 32px var(--shadow-md);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-header h3 {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: var(--coral);
    }

    .calendar-nav {
      display: flex;
      gap: 10px;
    }

    .calendar-nav button {
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.8);
    }

    .calendar-nav button:hover {
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
      color: white;
      transform: scale(1.1);
      box-shadow: 0 4px 12px var(--shadow-coral);
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .calendar-day-name {
      font-size: 0.8rem;
      color: var(--text-light);
      padding: 10px 0;
      font-weight: 500;
    }

    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      font-weight: 500;
      color: var(--text-dark);
    }

    .calendar-day:hover {
      background: rgba(255,255,255,0.8);
      transform: scale(1.1);
    }

    .calendar-day.today {
      background: linear-gradient(135deg, var(--mint) 0%, var(--mint-dark) 100%);
      color: white;
      box-shadow: 0 4px 12px var(--shadow-mint);
      font-weight: 600;
    }

    .calendar-day.has-outfit::after {
      content: '';
      position: absolute;
      bottom: 4px;
      width: 8px;
      height: 8px;
      background: var(--coral);
      border-radius: 50%;
      box-shadow: 0 2px 6px var(--shadow-coral);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .calendar-day.selected {
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%);
      color: white;
      box-shadow: 0 4px 16px var(--shadow-coral);
    }

    .history-content {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 24px;
      min-height: 220px;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 8px 32px var(--shadow-md);
    }

    .history-content h3 {
      font-family: 'Caveat', cursive;
      font-size: 1.4rem;
      color: var(--coral);
      margin-bottom: 18px;
    }

    .history-outfit {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
      animation: fadeSlideIn 0.3s ease;
    }

    .history-outfit canvas {
      background: linear-gradient(180deg, rgba(248,244,239,0.8) 0%, rgba(255,255,255,0.9) 100%);
      border-radius: 16px;
      max-width: 160px;
      max-height: 220px;
      box-shadow: 0 6px 20px var(--shadow-md);
      border: 2px solid rgba(255,255,255,0.8);
    }

    .history-details {
      flex: 1;
    }

    .history-details p {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .history-details strong {
      color: var(--text-dark);
    }

    .history-empty {
      text-align: center;
      padding: 50px;
      color: var(--text-light);
    }

    .history-empty svg {
      width: 56px;
      height: 56px;
      margin-bottom: 14px;
      opacity: 0.4;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, var(--text-dark) 0%, #1a1a1a 100%);
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 0.9rem;
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      letter-spacing: 0.5px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* File input hidden */
    .file-input {
      display: none;
    }

    /* Dragging state */
    .clothing-item.dragging {
      opacity: 0.5;
      transform: scale(0.95);
    }

    .fitting-canvas-wrapper.drag-over {
      background: linear-gradient(180deg, rgba(152, 216, 200, 0.3) 0%, rgba(152, 216, 200, 0.1) 100%);
    }

    /* Modal */
    #clothingModal {
      backdrop-filter: blur(8px);
    }

    #clothingModal > div {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    #clothingModal input,
    #clothingModal select {
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(0,0,0,0.08);
      border-radius: 14px;
      color: var(--text-dark);
      font-family: inherit;
    }

    #clothingModal input:focus,
    #clothingModal select:focus {
      outline: none;
      border-color: var(--coral);
      box-shadow: 0 0 0 3px var(--shadow-coral);
    }

    #cancelClothing {
      background: rgba(0,0,0,0.05) !important;
      color: var(--text-light) !important;
    }

    #saveClothing {
      background: linear-gradient(135deg, var(--coral) 0%, var(--coral-dark) 100%) !important;
      color: white !important;
      box-shadow: 0 4px 16px var(--shadow-coral);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .header h1 {
        font-size: 2.2rem;
      }

      .main-content {
        padding: 16px;
        padding-bottom: 100px;
      }

      .customize-grid {
        grid-template-columns: 1fr;
      }

      .fitting-room {
        flex-direction: column;
      }

      .wardrobe-panel {
        width: 100%;
        max-height: 320px;
      }

      .fitting-canvas-wrapper {
        min-height: 360px;
      }

      .card {
        padding: 20px;
        border-radius: 20px;
      }

      .card-title {
        font-size: 1.5rem;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--coral-light), var(--coral));
      border-radius: 4px;
    }
  </style>
</head>

  <script>
    // ==================== 数据管理 ====================
    const STORAGE_KEYS = {
      CHARACTER: 'todayfit_character',
      WARDROBE: 'todayfit_wardrobe',
      HISTORY: 'todayfit_history'
    };

    // 默认人物数据
    const defaultCharacter = {
      faceShape: 'oval',
      skinColor: '#FFDCB1',
      hairStyle: 'short',
      hairColor: '#2C1810',
      height: 'medium',
      faceImage: null,
      faceX: 100,
      faceY: 50,
      faceSize: 70
    };

    // 数据加载/保存
    function loadData(key, defaultValue) {
      try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : defaultValue;
      } catch (e) {
        return defaultValue;
      }
    }

    function saveData(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) {
        console.warn('存储失败:', e);
      }
    }

    // ==================== 人物渲染引擎 ====================
    class CharacterEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.character = loadData(STORAGE_KEYS.CHARACTER, defaultCharacter);
        this._loadedImages = {};
        this._dragState = null;
      }

      render() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        
        ctx.clearRect(0, 0, w, h);
        
        const skinColor = this.character.skinColor;
        const hairColor = this.character.hairColor;
        const heightScale = { short: 0.85, medium: 1, tall: 1.15 }[this.character.height];
        
        // 身体比例
        const centerX = w / 2;
        const bodyTop = 85 * heightScale;
        const bodyWidth = 55;
        const bodyHeight = 110 * heightScale;
        const headY = 50;
        const headWidth = this.character.faceShape === 'square' ? 52 : 56;
        const headHeight = this.character.faceShape === 'round' ? 58 : 54;
        
        // ===== 绘制身体（底层）=====
        
        // 腿 - 蓝色牛仔裤
        const legTop = bodyTop + bodyHeight;
        const legWidth = 22;
        const legHeight = 85 * heightScale;
        
        ctx.fillStyle = '#4a6fa5';
        ctx.beginPath();
        ctx.roundRect(centerX - legWidth - 2, legTop, legWidth, legHeight, [0, 0, 8, 8]);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(centerX + 2, legTop, legWidth, legHeight, [0, 0, 8, 8]);
        ctx.fill();
        
        ctx.fillStyle = '#3d5a80';
        ctx.beginPath();
        ctx.roundRect(centerX - 24, legTop - 3, 48, 8, 3);
        ctx.fill();
        
        ctx.strokeStyle = '#3d5a80';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(centerX, legTop);
        ctx.lineTo(centerX, legTop + 20);
        ctx.stroke();
        
        // 鞋子
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.roundRect(centerX - legWidth - 5, legTop + legHeight - 5, legWidth + 3, 15, 4);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(centerX + 2, legTop + legHeight - 5, legWidth + 3, 15, 4);
        ctx.fill();
        
        // 身体 - 白T恤
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(centerX - bodyWidth / 2, bodyTop);
        ctx.lineTo(centerX - bodyWidth / 2 - 8, bodyTop + bodyHeight);
        ctx.lineTo(centerX + bodyWidth / 2 + 8, bodyTop + bodyHeight);
        ctx.lineTo(centerX + bodyWidth / 2, bodyTop);
        ctx.closePath();
        ctx.fill();
        
        ctx.strokeStyle = '#ddd';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        // T恤领口
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.moveTo(centerX - 15, bodyTop);
        ctx.lineTo(centerX, bodyTop + 20);
        ctx.lineTo(centerX + 15, bodyTop);
        ctx.closePath();
        ctx.fill();
        
        // T恤袖子
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(centerX - bodyWidth / 2 - 8, bodyTop + 15, 12, 18, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX + bodyWidth / 2 + 8, bodyTop + 15, 12, 18, 0.3, 0, Math.PI * 2);
        ctx.fill();
        
        // 手臂
        const armY = bodyTop + 30;
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.roundRect(centerX - bodyWidth / 2 - 15, armY, 14, 60 * heightScale, 6);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(centerX + bodyWidth / 2 + 1, armY, 14, 60 * heightScale, 6);
        ctx.fill();
        
        // 脖子
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.roundRect(centerX - 12, bodyTop - 15, 24, 18, 4);
        ctx.fill();
        
        // ===== 绘制脸部 =====
        if (this.character.faceImage) {
          const self = this;
          this._loadImage(this.character.faceImage).then(img => {
            const fx = this.character.faceX;
            const fy = this.character.faceY;
            const fs = this.character.faceSize;
            ctx.drawImage(img, fx - fs / 2, fy - fs / 2, fs, fs);
            // 绘制头发在脸部上面
            this.drawHair(ctx, centerX, headY, hairColor);
          });
        } else {
          // 绘制手绘脸部
          this.drawFace(ctx, centerX, headY, skinColor, hairColor, headWidth, headHeight);
          // 绘制头发
          this.drawHair(ctx, centerX, headY, hairColor);
        }
      }
      
      _loadImage(src) {
        if (this._loadedImages[src]) return Promise.resolve(this._loadedImages[src]);
        return new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            this._loadedImages[src] = img;
            resolve(img);
          };
          img.src = src;
        });
      }
      
      drawFace(ctx, centerX, headY, skinColor, hairColor, headWidth, headHeight) {
        // 脸型
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        if (this.character.faceShape === 'round') {
          ctx.arc(centerX, headY, headHeight / 2, 0, Math.PI * 2);
        } else if (this.character.faceShape === 'square') {
          ctx.roundRect(centerX - headWidth / 2, headY - headHeight / 2, headWidth, headHeight, 10);
        } else {
          ctx.ellipse(centerX, headY, headWidth / 2.2, headHeight / 2, 0, 0, Math.PI * 2);
        }
        ctx.fill();
        
        // 眉毛
        ctx.strokeStyle = hairColor;
        ctx.lineWidth = 2.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(centerX - 22, headY - 12);
        ctx.quadraticCurveTo(centerX - 15, headY - 16, centerX - 8, headY - 12);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(centerX + 8, headY - 12);
        ctx.quadraticCurveTo(centerX + 15, headY - 16, centerX + 22, headY - 12);
        ctx.stroke();
        
        // 眼睛 - 眼白
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.ellipse(centerX - 15, headY, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX + 15, headY, 8, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // 眼珠
        ctx.fillStyle = '#3a3a3a';
        ctx.beginPath();
        ctx.arc(centerX - 15, headY + 1, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(centerX + 15, headY + 1, 4, 0, Math.PI * 2);
        ctx.fill();
        
        // 眼睛高光
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(centerX - 13, headY - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(centerX + 13, headY - 1, 1.5, 0, Math.PI * 2);
        ctx.fill();
        
        // 鼻子
        ctx.strokeStyle = this.darkenColor(skinColor, 0.15);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX, headY + 5);
        ctx.lineTo(centerX - 3, headY + 18);
        ctx.quadraticCurveTo(centerX, headY + 22, centerX + 3, headY + 18);
        ctx.stroke();
        
        // 嘴巴
        ctx.fillStyle = '#e8a0a0';
        ctx.beginPath();
        ctx.ellipse(centerX, headY + 28, 12, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = '#c87878';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(centerX - 10, headY + 28);
        ctx.quadraticCurveTo(centerX, headY + 25, centerX + 10, headY + 28);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(centerX - 8, headY + 28);
        ctx.lineTo(centerX + 8, headY + 28);
        ctx.stroke();
        
        // 耳朵
        ctx.fillStyle = skinColor;
        ctx.beginPath();
        ctx.ellipse(centerX - headWidth / 2 - 3, headY, 6, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(centerX + headWidth / 2 + 3, headY, 6, 10, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      
      drawHair(ctx, centerX, headY, hairColor) {
        if (this.character.hairStyle === 'bald') return;
        
        ctx.fillStyle = hairColor;
        
        if (this.character.hairStyle === 'short') {
          ctx.beginPath();
          ctx.ellipse(centerX, headY - 18, 32, 18, 0, Math.PI, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(centerX - 28, headY - 5, 12, 20, -0.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(centerX + 28, headY - 5, 12, 20, 0.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.character.hairStyle === 'long') {
          ctx.beginPath();
          ctx.ellipse(centerX, headY - 18, 32, 18, 0, Math.PI, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(centerX - 30, headY + 35, 15, 45, -0.15, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.ellipse(centerX + 30, headY + 35, 15, 45, 0.15, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.character.hairStyle === 'curly') {
          for (let i = 0; i < 12; i++) {
            const angle = (i / 12) * Math.PI * 2 - Math.PI / 2;
            const r = 30 + (i % 3) * 5;
            const x = centerX + Math.cos(angle) * r * 0.6;
            const y = headY - 20 + Math.sin(angle) * 15 + (i % 2) * 8;
            ctx.beginPath();
            ctx.arc(x, y, 10 + (i % 3) * 3, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
      
      // 颜色加深辅助函数
      darkenColor(color, amount) {
        const hex = color.replace('#', '');
        const r = Math.max(0, parseInt(hex.substr(0, 2), 16) - Math.round(255 * amount));
        const g = Math.max(0, parseInt(hex.substr(2, 2), 16) - Math.round(255 * amount));
        const b = Math.max(0, parseInt(hex.substr(4, 2), 16) - Math.round(255 * amount));
        return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
      }

      updatePart(part, value) {
        this.character[part] = value;
        saveData(STORAGE_KEYS.CHARACTER, this.character);
        this.render();
      }

      getCharacter() {
        return { ...this.character };
      }

      exportSnapshot() {
        return this.canvas.toDataURL();
      }
    }

    // ==================== 衣柜管理器 ====================
    class WardrobeManager {
      constructor() {
        this.clothes = loadData(STORAGE_KEYS.WARDROBE, []);
        this.pendingImage = null;
      }

      uploadClothing(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            this.pendingImage = e.target.result;
            resolve(e.target.result);
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      saveClothing(name, category) {
        if (!this.pendingImage) return null;
        
        const clothing = {
          id: 'clo_' + Date.now(),
          name: name || '未命名',
          category: category,
          imageData: this.pendingImage,
          uploadDate: new Date().toISOString()
        };
        
        this.clothes.push(clothing);
        saveData(STORAGE_KEYS.WARDROBE, this.clothes);
        this.pendingImage = null;
        return clothing;
      }

      cancelUpload() {
        this.pendingImage = null;
      }

      getAllClothing() {
        return [...this.clothes];
      }

      getByCategory(category) {
        if (category === 'all') return this.getAllClothing();
        return this.clothes.filter(c => c.category === category);
      }

      removeClothing(id) {
        this.clothes = this.clothes.filter(c => c.id !== id);
        saveData(STORAGE_KEYS.WARDROBE, this.clothes);
      }

      getClothingById(id) {
        return this.clothes.find(c => c.id === id);
      }
    }

    // ==================== 穿搭渲染器 ====================
    class OutfitRenderer {
      constructor(canvas, characterEngine, wardrobeManager) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.characterEngine = characterEngine;
        this.wardrobeManager = wardrobeManager;
        this.currentOutfit = {}; // category -> {id, x, y, width, height}
        this._loadedImages = {};
        this._dragState = null; // {category, offsetX, offsetY}
        this._resizeState = null;
      }
      
      getDefaultPosition(category, canvasWidth, canvasHeight) {
        const centerX = canvasWidth / 2;
        const defaults = {
          tops: { x: centerX, y: 120, w: 100, h: 80 },
          pants: { x: centerX, y: 210, w: 80, h: 100 },
          skirts: { x: centerX, y: 195, w: 90, h: 70 },
          shoes: { x: centerX, y: 350, w: 100, h: 40 },
          accessories: { x: centerX, y: 40, w: 60, h: 40 }
        };
        return defaults[category] || { x: centerX, y: 150, w: 80, h: 60 };
      }

      render() {
        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        
        ctx.clearRect(0, 0, w, h);
        
        const charCanvas = this.characterEngine.canvas;
        ctx.drawImage(charCanvas, 0, 0, w, h);
        
        const layerOrder = ['shoes', 'pants', 'skirts', 'tops', 'accessories'];
        const self = this;
        
        layerOrder.forEach(category => {
          const item = this.currentOutfit[category];
          if (item && item.id) {
            const clothing = this.wardrobeManager.getClothingById(item.id);
            if (clothing && clothing.imageData) {
              this._loadImage(clothing.imageData).then(img => {
                const drawX = item.x - item.width / 2;
                const drawY = item.y - item.height / 2;
                ctx.drawImage(img, drawX, drawY, item.width, item.height);
                
                // 如果是当前拖拽的项，绘制边框和调整手柄
                if (this._dragState && this._dragState.category === category) {
                  ctx.strokeStyle = '#FF7F7F';
                  ctx.lineWidth = 2;
                  ctx.strokeRect(drawX, drawY, item.width, item.height);
                  // 调整手柄
                  ctx.fillStyle = '#FF7F7F';
                  ctx.beginPath();
                  ctx.arc(drawX + item.width, drawY + item.height, 6, 0, Math.PI * 2);
                  ctx.fill();
                  ctx.strokeStyle = '#fff';
                  ctx.lineWidth = 2;
                  ctx.stroke();
                }
              });
            }
          }
        });
      }
      
      _loadImage(src) {
        if (this._loadedImages[src]) return Promise.resolve(this._loadedImages[src]);
        return new Promise(resolve => {
          const img = new Image();
          img.onload = () => {
            this._loadedImages[src] = img;
            resolve(img);
          };
          img.src = src;
        });
      }

      addClothing(clothingId) {
        const clothing = this.wardrobeManager.getClothingById(clothingId);
        if (clothing) {
          const def = this.getDefaultPosition(clothing.category, this.canvas.width, this.canvas.height);
          this.currentOutfit[clothing.category] = {
            id: clothingId,
            x: def.x,
            y: def.y,
            width: def.w,
            height: def.h
          };
          this.render();
        }
      }

      removeClothing(category) {
        delete this.currentOutfit[category];
        this.render();
      }

      clearOutfit() {
        this.currentOutfit = {};
        this.render();
      }

      getCurrentOutfit() {
        return { ...this.currentOutfit };
      }

      setOutfit(outfit) {
        this.currentOutfit = { ...outfit };
        this.render();
      }
      
      // 获取鼠标点击在哪个衣物上
      hitTest(x, y) {
        // 反向遍历，上层优先
        const layerOrder = ['accessories', 'tops', 'skirts', 'pants', 'shoes'];
        for (const category of layerOrder) {
          const item = this.currentOutfit[category];
          if (item && item.id) {
            const left = item.x - item.width / 2;
            const right = item.x + item.width / 2;
            const top = item.y - item.height / 2;
            const bottom = item.y + item.height / 2;
            if (x >= left && x <= right && y >= top && y <= bottom) {
              // 检查是否点在调整手柄上（右下角）
              const handleX = right;
              const handleY = bottom;
              const dist = Math.sqrt((x - handleX) ** 2 + (y - handleY) ** 2);
              if (dist <= 10) {
                return { category, type: 'resize' };
              }
              return { category, type: 'move' };
            }
          }
        }
        return null;
      }

      exportSnapshot() {
        return this.canvas.toDataURL();
      }
    }

    // ==================== 历史管理器 ====================
    class HistoryManager {
      constructor(wardrobeManager) {
        this.wardrobeManager = wardrobeManager;
        this.history = loadData(STORAGE_KEYS.HISTORY, {});
        this.currentMonth = new Date();
      }

      saveRecord(date, characterSnapshot, outfit) {
        this.history[date] = {
          date: date,
          characterSnapshot: characterSnapshot,
          outfit: outfit,
          savedAt: new Date().toISOString()
        };
        saveData(STORAGE_KEYS.HISTORY, this.history);
      }

      getRecord(date) {
        return this.history[date] || null;
      }

      getAllRecords() {
        return { ...this.history };
      }

      deleteRecord(date) {
        delete this.history[date];
        saveData(STORAGE_KEYS.HISTORY, this.history);
      }

      getDatesWithOutfits() {
        return Object.keys(this.history);
      }

      getCurrentMonth() {
        return this.currentMonth;
      }

      setMonth(date) {
        this.currentMonth = date;
      }

      getMonthName() {
        return `${this.currentMonth.getFullYear()}年${this.currentMonth.getMonth() + 1}月`;
      }

      getDaysInMonth() {
        const year = this.currentMonth.getFullYear();
        const month = this.currentMonth.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startDayOfWeek = firstDay.getDay();
        
        return { daysInMonth, startDayOfWeek };
      }
    }

    // 获取Canvas内的鼠标坐标
    function getCanvasCoordinates(canvas, clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }
    
    // 统一的Canvas拖拽缩放处理
    function setupCanvasDragResize(canvas, engine, mode) {
      let isDragging = false;
      let isResizing = false;
      let currentTarget = null; // 'face' or category
      let startX = 0, startY = 0;
      let startItemX = 0, startItemY = 0;
      let startWidth = 0, startHeight = 0;
      let startFaceSize = 0;
      
      const getPointerPos = (e) => {
        const touch = e.touches ? e.touches[0] : e;
        return getCanvasCoordinates(canvas, touch.clientX, touch.clientY);
      };
      
      const onPointerDown = (e) => {
        const pos = getPointerPos(e);
        
        if (mode === 'character') {
          // 脸部拖拽
          if (engine.character.faceImage) {
            const fx = engine.character.faceX;
            const fy = engine.character.faceY;
            const fs = engine.character.faceSize;
            const left = fx - fs / 2;
            const right = fx + fs / 2;
            const top = fy - fs / 2;
            const bottom = fy + fs / 2;
            
            // 检查是否点在调整手柄（右下角）
            const handleDist = Math.sqrt((pos.x - right) ** 2 + (pos.y - bottom) ** 2);
            if (handleDist <= 12) {
              isResizing = true;
              currentTarget = 'face';
              startX = pos.x;
              startY = pos.y;
              startFaceSize = fs;
              e.preventDefault();
              return;
            }
            
            // 检查是否点在脸部范围内
            if (pos.x >= left && pos.x <= right && pos.y >= top && pos.y <= bottom) {
              isDragging = true;
              currentTarget = 'face';
              startX = pos.x;
              startY = pos.y;
              startItemX = fx;
              startItemY = fy;
              e.preventDefault();
            }
          }
        } else if (mode === 'outfit') {
          const hit = engine.hitTest(pos.x, pos.y);
          if (hit) {
            currentTarget = hit.category;
            const item = engine.currentOutfit[hit.category];
            startX = pos.x;
            startY = pos.y;
            startItemX = item.x;
            startItemY = item.y;
            startWidth = item.width;
            startHeight = item.height;
            
            // 设置拖拽状态用于显示边框
            engine._dragState = { category: hit.category };
            
            if (hit.type === 'resize') {
              isResizing = true;
            } else {
              isDragging = true;
            }
            e.preventDefault();
          } else {
            // 点击空白处清除选中
            engine._dragState = null;
            engine.render();
          }
        }
      };
      
      const onPointerMove = (e) => {
        if (!isDragging && !isResizing) return;
        
        const pos = getPointerPos(e);
        const dx = pos.x - startX;
        const dy = pos.y - startY;
        
        if (mode === 'character' && currentTarget === 'face') {
          if (isDragging) {
            engine.character.faceX = startItemX + dx;
            engine.character.faceY = startItemY + dy;
          } else if (isResizing) {
            const maxDist = Math.max(Math.abs(dx), Math.abs(dy));
            const newSize = Math.max(30, Math.min(200, startFaceSize + maxDist * (dx > 0 ? 1 : -1)));
            engine.character.faceSize = newSize;
          }
          saveData(STORAGE_KEYS.CHARACTER, engine.character);
          engine.render();
        } else if (mode === 'outfit' && currentTarget) {
          const item = engine.currentOutfit[currentTarget];
          if (!item) return;
          
          if (isDragging) {
            item.x = startItemX + dx;
            item.y = startItemY + dy;
          } else if (isResizing) {
            const scale = 1 + dx / 100;
            const newW = Math.max(20, startWidth * scale);
            const newH = Math.max(20, startHeight * scale);
            item.width = newW;
            item.height = newH;
          }
          engine.render();
        }
        
        e.preventDefault();
      };
      
      const onPointerUp = (e) => {
        if (isDragging || isResizing) {
          if (mode === 'outfit') {
            engine._dragState = null;
            engine.render();
          }
          saveData(STORAGE_KEYS.CHARACTER, engine.character);
        }
        isDragging = false;
        isResizing = false;
        currentTarget = null;
      };
      
      // 鼠标事件
      canvas.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      
      // 触摸事件
      canvas.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);
      
      // 鼠标悬停显示光标
      canvas.addEventListener('mousemove', (e) => {
        const pos = getCanvasCoordinates(canvas, e.clientX, e.clientY);
        if (mode === 'character' && engine.character.faceImage) {
          const fx = engine.character.faceX;
          const fy = engine.character.faceY;
          const fs = engine.character.faceSize;
          const left = fx - fs / 2;
          const right = fx + fs / 2;
          const top = fy - fs / 2;
          const bottom = fy + fs / 2;
          const handleDist = Math.sqrt((pos.x - right) ** 2 + (pos.y - bottom) ** 2);
          if (handleDist <= 12) {
            canvas.style.cursor = 'nwse-resize';
          } else if (pos.x >= left && pos.x <= right && pos.y >= top && pos.y <= bottom) {
            canvas.style.cursor = 'move';
          } else {
            canvas.style.cursor = 'default';
          }
        } else if (mode === 'outfit') {
          const hit = engine.hitTest(pos.x, pos.y);
          if (hit) {
            canvas.style.cursor = hit.type === 'resize' ? 'nwse-resize' : 'move';
          } else {
            canvas.style.cursor = 'default';
          }
        }
      });
    }

    // ==================== 文件上传处理 ====================
    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        handleFile(file);
      }
      e.target.value = '';
    }

    function handleFile(file) {
      wardrobeManager.uploadClothing(file).then(() => {
        document.getElementById('clothingModal').style.display = 'flex';
      });
    }

    // ==================== 渲染函数 ====================
    function switchView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(viewId).classList.add('active');
      document.querySelector(`[data-view="${viewId}"]`).classList.add('active');

      // 每次切换视图时重新渲染
      if (viewId === 'fittingView') {
        outfitRenderer.render();
        renderOutfitLayers();
      }
    }

    function renderWardrobe(category = 'all') {
      const clothes = wardrobeManager.getByCategory(category);
      const emptyState = document.getElementById('emptyWardrobe');
      
      // 移除旧的衣服卡片（保留empty state）
      Array.from(wardrobeGrid.children).forEach(child => {
        if (child.id !== 'emptyWardrobe') {
          child.remove();
        }
      });

      if (clothes.length === 0) {
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      clothes.forEach(clothing => {
        const item = document.createElement('div');
        item.className = 'clothing-item';
        item.draggable = true;
        item.innerHTML = `
          <img src="${clothing.imageData}" alt="${clothing.name}">
          <button class="delete-btn" data-id="${clothing.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
          <div class="item-name">${clothing.name}</div>
        `;

        // 删除功能
        item.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          wardrobeManager.removeClothing(clothing.id);
          renderWardrobe(category);
          renderFittingWardrobe();
          showToast('衣服已删除');
        });

        wardrobeGrid.appendChild(item);
      });
    }

    function renderFittingWardrobe(category = 'all') {
      const clothes = wardrobeManager.getByCategory(category);
      
      fittingWardrobeGrid.innerHTML = '';

      if (clothes.length === 0) {
        fittingWardrobeGrid.innerHTML = '<p style="color:var(--text-light); font-size:0.85rem; text-align:center; padding:20px;">衣柜为空</p>';
        return;
      }

      clothes.forEach(clothing => {
        const item = document.createElement('div');
        item.className = 'clothing-item';
        item.draggable = true;
        item.dataset.id = clothing.id;
        item.innerHTML = `
          <img src="${clothing.imageData}" alt="${clothing.name}" title="${clothing.name}">
        `;

        // 拖拽开始
        item.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/plain', clothing.id);
          item.classList.add('dragging');
        });

        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
        });

        // 点击添加到穿搭
        item.addEventListener('click', () => {
          outfitRenderer.addClothing(clothing.id);
          renderOutfitLayers();
        });

        fittingWardrobeGrid.appendChild(item);
      });
    }

    function renderOutfitLayers() {
      const outfit = outfitRenderer.getCurrentOutfit();
      const categories = {
        tops: '上衣',
        pants: '裤子',
        skirts: '裙子',
        shoes: '鞋子',
        accessories: '配饰'
      };

      const items = Object.entries(outfit);
      
      if (items.length === 0) {
        outfitLayers.innerHTML = '<p style="color:var(--text-light); font-size:0.85rem;">还没有选择衣服</p>';
        return;
      }

      outfitLayers.innerHTML = items.map(([category, id]) => {
        const clothing = wardrobeManager.getClothingById(id);
        return `
          <div class="layer-item">
            <img src="${clothing?.imageData || ''}" alt="${categories[category]}">
            <span>${categories[category]}</span>
            <button onclick="outfitRenderer.removeClothing('${category}'); renderOutfitLayers();">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        `;
      }).join('');
    }

    function renderCalendar() {
      const { daysInMonth, startDayOfWeek } = historyManager.getDaysInMonth();
      const datesWithOutfits = historyManager.getDatesWithOutfits();
      const today = new Date();
      
      document.getElementById('calendarMonth').textContent = historyManager.getMonthName();

      // 移除旧的日期（保留标题行）
      Array.from(calendarGrid.children).forEach(child => {
        if (!child.classList.contains('calendar-day-name')) {
          child.remove();
        }
      });

      // 添加空白
      for (let i = 0; i < startDayOfWeek; i++) {
        const empty = document.createElement('div');
        calendarGrid.appendChild(empty);
      }

      // 添加日期
      for (let day = 1; day <= daysInMonth; day++) {
        const dateEl = document.createElement('div');
        dateEl.className = 'calendar-day';
        dateEl.textContent = day;

        const dateStr = `${historyManager.currentMonth.getFullYear()}-${String(historyManager.currentMonth.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        // 检查是否是今天
        if (historyManager.currentMonth.getFullYear() === today.getFullYear() &&
            historyManager.currentMonth.getMonth() === today.getMonth() &&
            day === today.getDate()) {
          dateEl.classList.add('today');
        }

        // 检查是否有穿搭记录
        if (datesWithOutfits.includes(dateStr)) {
          dateEl.classList.add('has-outfit');
        }

        dateEl.addEventListener('click', () => selectDate(dateStr, dateEl));
        calendarGrid.appendChild(dateEl);
      }
    }

    function selectDate(dateStr, dateEl) {
      // 移除之前的选中
      document.querySelectorAll('.calendar-day.selected').forEach(d => d.classList.remove('selected'));
      dateEl.classList.add('selected');

      renderHistoryContent(dateStr);
    }

    function renderHistoryContent(dateStr = null) {
      const historyEmpty = document.getElementById('historyEmpty');
      const historyOutfit = document.getElementById('historyOutfit');

      if (!dateStr) {
        historyEmpty.style.display = 'block';
        historyOutfit.style.display = 'none';
        return;
      }

      const record = historyManager.getRecord(dateStr);
      
      if (!record) {
        historyEmpty.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          <p>这一天没有穿搭记录</p>
        `;
        historyEmpty.style.display = 'block';
        historyOutfit.style.display = 'none';
        return;
      }

      historyEmpty.style.display = 'none';
      historyOutfit.style.display = 'flex';

      // 创建画布来显示历史穿搭
      const historyCanvas = document.createElement('canvas');
      historyCanvas.width = 150;
      historyCanvas.height = 240;
      const ctx = historyCanvas.getContext('2d');

      // 绘制背景
      ctx.fillStyle = '#f8f4ef';
      ctx.fillRect(0, 0, 150, 240);

      // 加载并绘制
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, 150, 240);
      };
      img.src = record.characterSnapshot;

      const clothingNames = record.outfit ? Object.entries(record.outfit).map(([cat, id]) => {
        const c = wardrobeManager.getClothingById(id);
        return c ? c.name : '';
      }).filter(Boolean).join('、') : '无';

      historyOutfit.innerHTML = '';
      historyOutfit.appendChild(historyCanvas);
      historyOutfit.innerHTML += `
        <div class="history-details">
          <p><strong>日期：</strong>${dateStr}</p>
          <p><strong>穿搭：</strong>${clothingNames}</p>
          <p><strong>保存时间：</strong>${new Date(record.savedAt).toLocaleString()}</p>
        </div>
      `;
    }

    function saveTodayOutfit() {
      const today = new Date();
      const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      
      const outfit = outfitRenderer.getCurrentOutfit();
      
      if (Object.keys(outfit).length === 0) {
        showToast('请先选择衣服');
        return;
      }

      const snapshot = outfitRenderer.exportSnapshot();
      historyManager.saveRecord(dateStr, snapshot, outfit);
      
      renderCalendar();
      showToast('今日穿搭已保存');
    }

    function updateColorPresetSelection(containerId, currentColor) {
      const presets = document.querySelectorAll(`#${containerId} .color-preset`);
      presets.forEach(p => {
        if (p.dataset.color === currentColor) {
          p.style.transform = 'scale(1.2)';
          p.style.boxShadow = '0 0 0 3px var(--coral)';
        } else {
          p.style.transform = '';
          p.style.boxShadow = '';
        }
      });
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // 启动应用
    init();
  </script>
</body>
