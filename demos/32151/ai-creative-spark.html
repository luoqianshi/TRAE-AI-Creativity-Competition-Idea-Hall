<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI灵感碰撞器 - 世界很大，放手去造</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 头部样式 */
        header {
            text-align: center;
            padding: 40px 0;
            position: relative;
        }
        
        .logo {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #e94560, #533483, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 20px;
        }
        
        .theme {
            font-size: 1.8rem;
            color: #e94560;
            font-weight: 600;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* 主要功能区 */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: #e94560;
        }
        
        .card-title {
            font-size: 1.5rem;
            color: #e94560;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .card-icon {
            font-size: 2rem;
        }
        
        /* 灵感生成器 */
        .spark-generator {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2), rgba(83, 52, 131, 0.2));
        }
        
        .generate-btn {
            background: linear-gradient(45deg, #e94560, #533483);
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }
        
        .generate-btn:active {
            transform: scale(0.98);
        }
        
        .spark-result {
            margin-top: 30px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed rgba(233, 69, 96, 0.3);
        }
        
        .spark-idea {
            font-size: 1.4rem;
            line-height: 1.6;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .spark-tags {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .tag {
            background: rgba(233, 69, 96, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(233, 69, 96, 0.5);
        }
        
        /* 创意画布 */
        .canvas-container {
            position: relative;
            min-height: 400px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
        }
        
        #creativeCanvas {
            width: 100%;
            height: 400px;
            cursor: crosshair;
        }
        
        .canvas-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .canvas-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .canvas-btn:hover {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
        }
        
        .canvas-btn.active {
            background: #e94560;
            border-color: #e94560;
        }
        
        /* 灵感收集夹 */
        .favorites-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }
        
        .favorites-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .favorites-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        .favorites-list::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 3px;
        }
        
        .favorite-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border-left: 3px solid #e94560;
        }
        
        .favorite-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .favorite-text {
            flex: 1;
            margin-right: 15px;
        }
        
        .favorite-meta {
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-top: 5px;
        }
        
        .delete-btn {
            background: rgba(233, 69, 96, 0.2);
            border: none;
            color: #e94560;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .delete-btn:hover {
            background: #e94560;
            color: white;
        }
        
        .empty-state {
            text-align: center;
            color: #a0a0a0;
            padding: 40px 20px;
        }
        
        .empty-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        
        /* AI分析区 */
        .ai-analysis {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(15, 52, 96, 0.3), rgba(83, 52, 131, 0.3));
        }
        
        .analysis-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }
        
        .analysis-input:focus {
            outline: none;
            border-color: #e94560;
        }
        
        .analyze-btn {
            background: linear-gradient(45deg, #0f3460, #533483);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .analyze-btn:hover {
            transform: scale(1.05);
        }
        
        .analysis-result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: none;
        }
        
        .analysis-result.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .analysis-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .analysis-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .analysis-label {
            color: #e94560;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #533483);
            border-radius: 4px;
            transition: width 1s ease;
        }
        
        /* 统计信息 */
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }
        
        .stat-label {
            color: #a0a0a0;
            margin-top: 5px;
        }
        
        /* 底部 */
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            color: #a0a0a0;
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        .footer-link {
            color: #e94560;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .footer-link:hover {
            color: #533483;
        }
        
        /* 动画粒子 */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #e94560;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) rotate(720deg);
                opacity: 0;
            }
        }
        
        /* 加载动画 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 通知 */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e94560;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateX(120%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        
        .notification.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>
    
    <!-- 通知 -->
    <div class="notification" id="notification"></div>
    
    <div class="container">
        <!-- 头部 -->
        <header>
            <div class="logo">✨ AI灵感碰撞器</div>
            <div class="subtitle">TRAE AI创造力大赛参赛作品</div>
            <div class="theme">世界很大，放手去造</div>
        </header>
        
        <!-- 灵感生成器 -->
        <div class="card spark-generator">
            <div class="card-title">
                <span class="card-icon">💡</span>
                灵感碰撞器
            </div>
            <p style="color: #a0a0a0; margin-bottom: 20px;">
                随机组合不同领域的概念，碰撞出创意火花
            </p>
            <button class="generate-btn" onclick="generateSpark()">
                🚀 碰撞灵感
            </button>
            <div class="spark-result" id="sparkResult">
                <div class="spark-idea" id="sparkIdea">
                    点击按钮，让AI为你碰撞出无限可能
                </div>
                <div class="spark-tags" id="sparkTags"></div>
            </div>
        </div>
        
        <!-- 主要内容区 -->
        <div class="main-content">
            <!-- 创意画布 -->
            <div class="card">
                <div class="card-title">
                    <span class="card-icon">🎨</span>
                    创意画布
                </div>
                <div class="canvas-container">
                    <canvas id="creativeCanvas"></canvas>
                </div>
                <div class="canvas-controls">
                    <button class="canvas-btn active" onclick="setCanvasMode('draw')">✏️ 绘制</button>
                    <button class="canvas-btn" onclick="setCanvasMode('connect')">🔗 连线</button>
                    <button class="canvas-btn" onclick="setCanvasMode('text')">📝 文字</button>
                    <button class="canvas-btn" onclick="clearCanvas()">🗑️ 清空</button>
                </div>
            </div>
            
            <!-- 灵感收集夹 -->
            <div class="card">
                <div class="card-title">
                    <span class="card-icon">📚</span>
                    灵感收集夹
                </div>
                <div class="favorites-list" id="favoritesList">
                    <div class="empty-state">
                        <div class="empty-icon">💭</div>
                        <p>还没有收集灵感</p>
                        <p style="font-size: 0.9rem; margin-top: 10px;">生成灵感后点击 ❤️ 收藏</p>
                    </div>
                </div>
            </div>
            
            <!-- AI分析区 -->
            <div class="card ai-analysis">
                <div class="card-title">
                    <span class="card-icon">🤖</span>
                    AI创意分析
                </div>
                <p style="color: #a0a0a0; margin-bottom: 20px;">
                    输入你的创意，让AI分析其可行性、创新性和市场潜力
                </p>
                <input type="text" class="analysis-input" id="analysisInput" 
                       placeholder="描述你的创意想法...">
                <button class="analyze-btn" onclick="analyzeIdea()">
                    🔍 开始分析
                </button>
                <div class="analysis-result" id="analysisResult">
                    <div class="analysis-item">
                        <div class="analysis-label">🎯 可行性评估</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="feasibilityBar" style="width: 0%"></div>
                        </div>
                        <div id="feasibilityText" style="color: #a0a0a0; font-size: 0.9rem; margin-top: 5px;"></div>
                    </div>
                    <div class="analysis-item">
                        <div class="analysis-label">💡 创新性评分</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="innovationBar" style="width: 0%"></div>
                        </div>
                        <div id="innovationText" style="color: #a0a0a0; font-size: 0.9rem; margin-top: 5px;"></div>
                    </div>
                    <div class="analysis-item">
                        <div class="analysis-label">📈 市场潜力</div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="marketBar" style="width: 0%"></div>
                        </div>
                        <div id="marketText" style="color: #a0a0a0; font-size: 0.9rem; margin-top: 5px;"></div>
                    </div>
                    <div class="analysis-item">
                        <div class="analysis-label">💡 AI建议</div>
                        <div id="aiSuggestion" style="color: #a0a0a0; line-height: 1.6;"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 统计信息 -->
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="sparkCount">0</div>
                <div class="stat-label">灵感生成</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="favoriteCount">0</div>
                <div class="stat-label">已收藏</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="analysisCount">0</div>
                <div class="stat-label">AI分析</div>
            </div>
        </div>
        
        <!-- 底部 -->
        <footer>
            <p>世界很大，放手去造 | TRAE AI创造力大赛</p>
            <div class="footer-links">
                <a href="#" class="footer-link">了解更多</a>
                <a href="#" class="footer-link">参赛指南</a>
                <a href="#" class="footer-link">创意社区</a>
            </div>
        </footer>
    </div>
    
    <script>
        // 创意数据
        const creativeData = {
            fields: ['教育', '健康', '娱乐', '环保', '社交', '工作', '旅行', '美食', '艺术', '科技', '运动', '音乐'],
            actions: ['优化', '创新', '重构', '简化', '自动化', '智能化', '个性化', '游戏化', '社交化', '可视化'],
            technologies: ['AI', 'AR/VR', '物联网', '区块链', '大数据', '语音识别', '图像识别', '自然语言处理', '机器学习', '边缘计算'],
            scenarios: ['日常生活', '学习成长', '工作效率', '社交互动', '健康管理', '娱乐休闲', '出行导航', '购物消费', '居家生活', '创意表达']
        };
        
        // 统计
        let stats = {
            sparkCount: 0,
            favoriteCount: 0,
            analysisCount: 0
        };
        
        // 收藏的灵感
        let favorites = JSON.parse(localStorage.getItem('creativeSparks') || '[]');
        
        // 画布相关
        let canvas, ctx;
        let canvasMode = 'draw';
        let isDrawing = false;
        let lastX, lastY;
        let nodes = [];
        let connections = [];
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initCanvas();
            initParticles();
            updateFavoritesList();
            updateStats();
        });
        
        // 初始化画布
        function initCanvas() {
            canvas = document.getElementById('creativeCanvas');
            ctx = canvas.getContext('2d');
            
            // 设置画布大小
            const container = canvas.parentElement;
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            
            // 绘制事件
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            
            // 触摸事件支持
            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', stopDrawing);
        }
        
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            startDrawing({ offsetX: x, offsetY: y });
        }
        
        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            draw({ offsetX: x, offsetY: y });
        }
        
        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
            
            if (canvasMode === 'text') {
                const text = prompt('输入文字:');
                if (text) {
                    ctx.font = '16px Microsoft YaHei';
                    ctx.fillStyle = '#e94560';
                    ctx.fillText(text, lastX, lastY);
                    nodes.push({ x: lastX, y: lastY, text: text });
                }
                isDrawing = false;
            }
        }
        
        function draw(e) {
            if (!isDrawing) return;
            
            if (canvasMode === 'draw') {
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(e.offsetX, e.offsetY);
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            [lastX, lastY] = [e.offsetX, e.offsetY];
        }
        
        function stopDrawing() {
            isDrawing = false;
        }
        
        function setCanvasMode(mode) {
            canvasMode = mode;
            document.querySelectorAll('.canvas-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            if (mode === 'connect') {
                canvas.style.cursor = 'pointer';
            } else if (mode === 'text') {
                canvas.style.cursor = 'text';
            } else {
                canvas.style.cursor = 'crosshair';
            }
        }
        
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            nodes = [];
            connections = [];
        }
        
        // 生成灵感
        function generateSpark() {
            const field = randomItem(creativeData.fields);
            const action = randomItem(creativeData.actions);
            const tech = randomItem(creativeData.technologies);
            const scenario = randomItem(creativeData.scenarios);
            
            const templates = [
                `用${tech}技术${action}${field}领域的${scenario}体验`,
                `基于${tech}的${scenario}${field}${action}方案`,
                `${field}+${tech}：重新定义${scenario}${action}`,
                `智能${field}${action}助手，让${scenario}更简单`,
                `${tech}驱动的${field}${action}平台，革新${scenario}`
            ];
            
            const idea = randomItem(templates);
            const tags = [field, tech, action, scenario];
            
            displaySpark(idea, tags);
            stats.sparkCount++;
            updateStats();
        }
        
        function randomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }
        
        function displaySpark(idea, tags) {
            const sparkIdea = document.getElementById('sparkIdea');
            const sparkTags = document.getElementById('sparkTags');
            
            sparkIdea.textContent = idea;
            sparkIdea.style.animation = 'none';
            sparkIdea.offsetHeight; // 触发重绘
            sparkIdea.style.animation = 'fadeInUp 0.5s ease forwards';
            
            sparkTags.innerHTML = tags.map(tag => 
                `<span class="tag">${tag}</span>`
            ).join('') + `<button onclick="addToFavorites('${idea.replace(/'/g, "\\'")}')" 
                          style="background: rgba(233, 69, 96, 0.5); border: none; color: white; 
                                 padding: 8px 16px; border-radius: 20px; cursor: pointer;
                                 transition: all 0.3s ease;">❤️ 收藏</button>`;
        }
        
        // 收藏功能
        function addToFavorites(idea) {
            const favorite = {
                id: Date.now(),
                text: idea,
                date: new Date().toLocaleDateString('zh-CN')
            };
            
            favorites.unshift(favorite);
            localStorage.setItem('creativeSparks', JSON.stringify(favorites));
            
            updateFavoritesList();
            stats.favoriteCount++;
            updateStats();
            
            showNotification('已添加到灵感收集夹！');
        }
        
        function removeFromFavorites(id) {
            favorites = favorites.filter(f => f.id !== id);
            localStorage.setItem('creativeSparks', JSON.stringify(favorites));
            
            updateFavoritesList();
            stats.favoriteCount--;
            updateStats();
            
            showNotification('已从收集夹移除');
        }
        
        function updateFavoritesList() {
            const list = document.getElementById('favoritesList');
            
            if (favorites.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">💭</div>
                        <p>还没有收集灵感</p>
                        <p style="font-size: 0.9rem; margin-top: 10px;">生成灵感后点击 ❤️ 收藏</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = favorites.map(fav => `
                <div class="favorite-item">
                    <div class="favorite-text">
                        <div>${fav.text}</div>
                        <div class="favorite-meta">${fav.date}</div>
                    </div>
                    <button class="delete-btn" onclick="removeFromFavorites(${fav.id})">✕</button>
                </div>
            `).join('');
        }
        
        // AI分析功能
        function analyzeIdea() {
            const input = document.getElementById('analysisInput');
            const idea = input.value.trim();
            
            if (!idea) {
                showNotification('请输入你的创意想法！');
                return;
            }
            
            // 模拟AI分析
            const analysis = simulateAnalysis(idea);
            
            // 显示结果
            const result = document.getElementById('analysisResult');
            result.classList.add('show');
            
            // 更新进度条
            setTimeout(() => {
                document.getElementById('feasibilityBar').style.width = analysis.feasibility + '%';
                document.getElementById('feasibilityText').textContent = analysis.feasibilityText;
            }, 300);
            
            setTimeout(() => {
                document.getElementById('innovationBar').style.width = analysis.innovation + '%';
                document.getElementById('innovationText').textContent = analysis.innovationText;
            }, 600);
            
            setTimeout(() => {
                document.getElementById('marketBar').style.width = analysis.market + '%';
                document.getElementById('marketText').textContent = analysis.marketText;
            }, 900);
            
            setTimeout(() => {
                document.getElementById('aiSuggestion').textContent = analysis.suggestion;
            }, 1200);
            
            stats.analysisCount++;
            updateStats();
            
            showNotification('AI分析完成！');
        }
        
        function simulateAnalysis(idea) {
            const keywords = ['AI', '智能', '创新', '优化', '平台', '助手', '系统', '应用'];
            const hasKeyword = keywords.some(k => idea.includes(k));
            
            const baseScore = hasKeyword ? 70 : 50;
            const randomBonus = Math.floor(Math.random() * 20);
            
            return {
                feasibility: Math.min(baseScore + randomBonus, 95),
                feasibilityText: '技术实现难度适中，建议分阶段开发',
                innovation: Math.min(baseScore + randomBonus + 10, 95),
                innovationText: '创意角度新颖，具有差异化优势',
                market: Math.min(baseScore + randomBonus - 5, 90),
                marketText: '目标用户明确，市场空间较大',
                suggestion: '建议从MVP开始，快速验证核心假设。可以考虑结合AI技术提升用户体验，同时注重数据隐私保护。'
            };
        }
        
        // 更新统计
        function updateStats() {
            document.getElementById('sparkCount').textContent = stats.sparkCount;
            document.getElementById('favoriteCount').textContent = favorites.length;
            document.getElementById('analysisCount').textContent = stats.analysisCount;
        }
        
        // 显示通知
        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }
        
        // 初始化粒子背景
        function initParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }
        
        // 窗口大小改变时重置画布
        window.addEventListener('resize', () => {
            initCanvas();
        });
    </script>
</body>
</html>
