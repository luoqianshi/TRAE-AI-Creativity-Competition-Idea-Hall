    // ===== 时间更新 =====
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const el = $('#header-time');
      if (el) el.textContent = `${Utils.formatDate()} ${h}:${m}`;
    }

    // ===== 厨房端控制器 =====
    const Kitchen = {
      lastCount: 0,
      audioCtx: null,

      // Web Audio API 生成"叮"提示音
      ding(isBad) {
        try {
          if (!this.audioCtx) {
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          const ctx = this.audioCtx;
          const now = ctx.currentTime;

          // 两个音：叮~咚
          const playTone = (freq, startTime, duration, vol) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(vol, startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
          };

          if (isBad) {
            // 差评：低沉急促的警报声
            playTone(800, now, 0.15, 0.3);
            playTone(600, now + 0.15, 0.15, 0.3);
            playTone(800, now + 0.3, 0.2, 0.3);
          } else {
            // 好评/普通：清脆的叮咚声
            playTone(1200, now, 0.3, 0.25);
            playTone(1600, now + 0.1, 0.4, 0.2);
          }
        } catch(e) {
          // 音频不支持就静默
        }
      },

      // 显示通知横幅
      notify(text, isBad) {
        const el = $('#kitchen-notify');
        const txt = $('#notify-text');
        txt.textContent = text;
        el.classList.toggle('good', !isBad);
        el.classList.toggle('bad', isBad);
        // 触发重绘
        void el.offsetWidth;
        el.classList.add('show');
        this.ding(isBad);
        setTimeout(() => el.classList.remove('show'), 4000);
      },

      // 渲染厨房端页面
      render() {
        const today = Utils.formatDate();
        const reviews = Storage.getReviewsByDate(today).sort((a, b) => b.timestamp - a.timestamp);
        const studentReviews = reviews.filter(r => r.role !== 'parent'); // 顶部数字只算学生
        const ratings = studentReviews.map(r => r.rating);
        const badCount = studentReviews.filter(r => r.rating <= 2).length;
        const avg = studentReviews.length ? Utils.average(ratings).toFixed(1) : '-';

        $('#k-total').textContent = studentReviews.length;
        $('#k-avg').textContent = avg;
        $('#k-bad').textContent = badCount;

        const list = $('#kitchen-list');
        if (reviews.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--gray-400);font-size:20px;">暂无评价，等待同学提交...</div>';
          this.lastCount = 0;
          return;
        }

        // 检查是否有新评价
        const newCount = reviews.length - this.lastCount;
        if (this.lastCount > 0 && newCount > 0) {
          const newReviews = reviews.slice(0, newCount);
          const hasBad = newReviews.some(r => r.rating <= 2);
          if (hasBad) {
            this.notify('⚠️ 有同学不满意，快看看！', true);
          } else {
            this.notify(`🔔 收到${newCount}条新评价！`, false);
          }
        }
        this.lastCount = reviews.length;

        // 渲染列表
        const gradeLabels = ['', '一年级', '二年级', '三年级', '四年级', '五年级', '六年级'];
        list.innerHTML = reviews.map(r => {
          const isBad = r.rating <= 2;
          const isGood = r.rating >= 4;
          const cls = isBad ? 'bad' : isGood ? 'good' : '';
          const stars = [1,2,3,4,5].map(i =>
            `<span class="${i <= r.rating ? 'on' : 'off'}">★</span>`
          ).join('');
          const time = new Date(r.timestamp).toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
          const badge = isBad ? '<span class="k-bad-badge">差评！</span>' : '';
          const voiceTag = r.voiceText ? '<span style="font-size:13px;color:var(--info);margin-left:6px;">🎤语音</span>' : '';
          return `
            <div class="k-review-item ${cls}">
              <div class="k-review-top">
                <div>
                  <span class="k-review-name">${r.anonymous ? (r.role === 'parent' ? '🎭 匿名家长' : '🎭 匿名同学') : Utils.escapeHtml(r.studentName)}</span>
                  <span class="k-review-grade">${r.role === 'parent' ? '👨‍👩‍👧 ' + (gradeLabels[r.grade] || '') + '家长' : (gradeLabels[r.grade] || '')}</span>
                  ${badge}${voiceTag}
                </div>
                <div class="k-review-stars">${stars}</div>
              </div>
              ${r.comment ? `<div class="k-review-comment">${Utils.escapeHtml(r.comment)}</div>` : ''}
              <div class="k-review-time">${time}</div>
            </div>
          `;
        }).join('');
      },

      init() {
        // 监听storage事件实现跨窗口实时联动
        window.addEventListener('storage', (e) => {
          // 只在厨房页面且评价数据变化时刷新
          if (Router.currentPage === 'kitchen' && e.key === Storage.KEYS.REVIEWS) {
            this.render();
          }
        });
      }
    };

    // ===== 家长端控制器 =====
    const Parent = {
      selectedRating: 0,

      init() {
        const stars = Utils.$$('#parent-stars .ds');
        stars.forEach(btn => {
          btn.addEventListener('click', () => {
            this.selectedRating = parseInt(btn.dataset.v);
            stars.forEach((b, i) => b.classList.toggle('on', i < this.selectedRating));
          });
        });
        $('#parent-submit').addEventListener('click', () => this.submit());
      },

      submit() {
        const name = $('#parent-name').value.trim();
        const grade = parseInt($('#parent-grade').value);
        const comment = $('#parent-comment').value.trim();
        if (!name) { Utils.showToast('请输入您的姓名', 'error'); return; }
        if (!grade) { Utils.showToast('请选择孩子的年级', 'error'); return; }
        if (!this.selectedRating) { Utils.showToast('请点星星打分', 'error'); return; }

        // 每位家长每天也只能评一次
        const todayStr = Utils.formatDate();
        const already = Storage.getReviewsByDate(todayStr).some(r =>
          r.role === 'parent' && r.studentName === name
        );
        if (already) { Utils.showToast('您今天已经评过啦，明天再来！', 'error'); return; }

        // 情感判断（和学生端同款）
        let sentiment = 'neutral';
        const posCount = AI.wordBank.positive.filter(w => comment.includes(w)).length;
        const negCount = AI.wordBank.negative.filter(w => comment.includes(w)).length;
        if (this.selectedRating >= 4 && posCount >= negCount) sentiment = 'positive';
        else if (this.selectedRating <= 2 || negCount > posCount) sentiment = 'negative';

        Storage.addReview({
          id: Utils.genId(),
          studentName: name,
          role: 'parent',
          anonymous: $('#parent-anon').checked,
          grade,
          rating: this.selectedRating,
          comment,
          voiceText: '',
          dishTags: AI.wordBank.dishes.filter(d => comment.includes(d)),
          dishRatings: [],
          timestamp: Date.now(),
          date: todayStr,
          sentiment
        });

        // 清空表单（保留姓名和年级）
        $('#parent-comment').value = '';
        $('#parent-anon').checked = false;
        this.selectedRating = 0;
        Utils.$$('#parent-stars .ds').forEach(b => b.classList.remove('on'));
        Utils.showToast('评价提交成功，谢谢您！', 'success');
        this.render();
      },

      render() {
        const box = $('#parent-content');
        if (!box) return;
        const today = Utils.formatDate();
        const reviews = Storage.getReviewsByDate(today);
        const studentReviews = reviews.filter(r => r.role !== 'parent'); // 主统计只算学生
        const avg = studentReviews.length ? Utils.average(studentReviews.map(r => r.rating)).toFixed(1) : '-';
        const menu = Storage.getTodayMenu();

        // 每道菜的平均分（来自同学们的按菜打分）
        const dishRows = menu.length ? menu.map(d => {
          const scores = [];
          studentReviews.forEach(r => (r.dishRatings || []).forEach(dr => { if (dr.dishId === d.id) scores.push(dr.rating); }));
          const a = scores.length ? Utils.average(scores) : 0;
          const starStr = a ? '★'.repeat(Math.round(a)) + '☆'.repeat(5 - Math.round(a)) : '';
          return `<div class="p-dish-row">
            <span>${Utils.escapeHtml(d.name)} <span style="font-size:13px;color:var(--gray-500);">${d.category || ''}</span></span>
            <span class="p-dish-stars">${a ? starStr + ' ' + a.toFixed(1) + '分' : '<span style="color:var(--gray-500);font-size:14px;">还没有人打分</span>'}</span>
          </div>`;
        }).join('') : '<div style="color:var(--gray-500);padding:12px;">今天的菜单还没有录入哦，请老师在"菜品管理"里勾选今日菜单。</div>';

        // 按月趋势
        const byMonth = {};
        Storage.getReviews().forEach(r => {
          if (r.role === 'parent') return; // 趋势只算学生
          const m = (r.date || '').slice(0, 7);
          if (!m) return;
          (byMonth[m] = byMonth[m] || []).push(r.rating);
        });
        const months = Object.keys(byMonth).sort().slice(-6);
        let trendHtml = '<div style="color:var(--gray-500);padding:12px;">还没有数据</div>';
        if (months.length) {
          const W = 600, H = 170, padL = 30, padR = 14, padT = 14, padB = 28;
          const pw = W - padL - padR, ph = H - padT - padB;
          let path = '', dots = '', labels = '', grid = '';
          for (let i = 0; i <= 5; i++) {
            const y = padT + ph - (i / 5) * ph;
            grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#eee"/><text x="${padL - 5}" y="${y + 4}" text-anchor="end" font-size="10" fill="#999">${i}</text>`;
          }
          months.forEach((m, i) => {
            const a = Utils.average(byMonth[m]);
            const x = months.length === 1 ? padL + pw / 2 : padL + (i / (months.length - 1)) * pw;
            const y = padT + ph - (a / 5) * ph;
            path += (i === 0 ? 'M' : ' L') + x + ',' + y;
            dots += `<circle cx="${x}" cy="${y}" r="4" fill="#a855f7"/><text x="${x}" y="${y - 8}" text-anchor="middle" font-size="11" fill="#a855f7">${a.toFixed(1)}</text>`;
            labels += `<text x="${x}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#666">${parseInt(m.slice(5), 10)}月</text>`;
          });
          trendHtml = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;">${grid}<path d="${path}" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}</svg>`;
        }

        // 匿名评价墙（家长看不到任何名字，保护所有孩子）
        const wall = reviews
          .filter(r => (r.comment || '').trim())
          .sort((a, b) => b.timestamp - a.timestamp)
          .slice(0, 30)
          .map(r => `<div class="p-review-item">
            ${Utils.escapeHtml(r.comment)}
            <div class="p-review-meta">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)} · ${r.grade}年级${r.role === 'parent' ? '家长' : '同学'} · ${Utils.formatTime(r.timestamp)}</div>
          </div>`).join('') || '<div style="color:var(--gray-500);padding:12px;">今天还没有评价</div>';

        box.innerHTML = `
          <div class="p-section">
            <div class="p-section-title">🍚 今日菜谱 <span style="font-size:14px;font-weight:400;color:var(--gray-500);">今天同学共 ${studentReviews.length} 份评价，平均 ${avg} 星</span></div>
            ${dishRows}
          </div>
          <div class="p-section">
            <div class="p-section-title">📈 每月伙食趋势</div>
            ${trendHtml}
          </div>
          <div class="p-section">
            <div class="p-section-title">💬 同学们怎么说（匿名）</div>
            ${wall}
          </div>
        `;
      }
    };

    // ===== 弹窗遮罩点击关闭 =====
    $('#modal-overlay').addEventListener('click', (e) => {
      if (e.target === $('#modal-overlay')) Utils.closeModal();
    });

    // ===== 应用初始化 =====
    document.addEventListener('DOMContentLoaded', () => {
      Storage.initDefaults();
      Speech.init();
      Student.init();
      Teacher.init();
      Kitchen.init();
      Parent.init();
      Router.init();
      updateTime();
      setInterval(updateTime, 1000);

      // ===== 打开网络同步（bug3修复：以前写好了却忘了调用！）=====
      Sync.onStatusChange = (isServer) => {
        const st = $('#connection-status');
        const txt = $('#conn-text');
        if (!st || !txt) return;
        st.classList.toggle('online', isServer);
        st.classList.toggle('offline', !isServer);
        txt.textContent = isServer ? '已联网' : '单机模式';
      };
      Sync.onDataUpdate = () => {
        // 收到别的设备发来的新数据，自动刷新当前页面
        if (Router.currentPage === 'kitchen') Kitchen.render();
        else if (Router.currentPage === 'teacher') Router.renderTeacherTab();
        else if (Router.currentPage === 'parent') Parent.render();
      };
      Sync.connect();

      // APP启动后首次点击自动进入全屏
      let enteredFullscreen = false;
      const enterFullscreen = () => {
        if (enteredFullscreen) return;
        enteredFullscreen = true;
        const el = document.documentElement;
        const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if (fn) {
          try {
            const result = fn.call(el);
            if (result && result.catch) result.catch(() => {});
          } catch(e) {}
        }
        document.removeEventListener('click', enterFullscreen);
        document.removeEventListener('touchstart', enterFullscreen);
      };
      document.addEventListener('click', enterFullscreen);
      document.addEventListener('touchstart', enterFullscreen);
    });
  </script>
</body>
</html>
