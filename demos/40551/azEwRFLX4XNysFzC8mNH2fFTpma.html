<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 小应用门户</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f6fb;
      --card: #fff;
      --accent: #4f6ef7;
      --text: #1a1f36;
      --sub: #5a6482;
      --border: rgba(0,0,0,0.07);
    }
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; }
    .logo small { display: block; font-size: 11px; color: var(--sub); font-weight: 400; letter-spacing: 3px; margin-top: 4px; }
    .btn-manage {
      padding: 8px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    main { padding: 32px 40px; max-width: 1200px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: var(--card);
      border-radius: 14px;
      padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      position: relative;
    }
    .app-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(79,110,247,0.12); }
    .app-icon { font-size: 36px; margin-bottom: 12px; }
    .app-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .app-desc { font-size: 12px; color: var(--sub); line-height: 1.5; }
    .add-card {
      border: 2px dashed #c5cce0;
      border-radius: 14px;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: var(--sub);
      cursor: pointer;
      min-height: 140px;
    }
    body.manage-mode .add-card { display: flex; }
    body.manage-mode .card-del { display: block; }
    .card-del {
      display: none;
      position: absolute;
      top: 10px; right: 10px;
      width: 24px; height: 24px;
      border: none; border-radius: 50%;
      background: #fee; color: #e53e3e;
      cursor: pointer; font-size: 14px;
    }
    .empty { text-align: center; padding: 60px; color: var(--sub); }
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      width: 420px;
      max-width: 90vw;
    }
    .modal h3 { margin-bottom: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
    .field input, .field textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .emoji-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .emoji-opt { font-size: 20px; cursor: pointer; padding: 4px; border-radius: 6px; }
    .emoji-opt.selected { background: #eef2ff; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .btn { padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-cancel { background: #eee; color: #333; }
    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1f36; color: #fff;
      padding: 10px 20px; border-radius: 8px;
      font-size: 14px; transition: transform .3s;
      z-index: 200;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      AI 小应用门户
      <small>MINI APP PLATFORM</small>
    </div>
    <button class="btn-manage" onclick="toggleManage()">管理应用</button>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">暂无应用，进入管理模式添加</div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modalTitle">添加应用</h3>
      <div class="field"><label>名称</label><input id="fName" /></div>
      <div class="field"><label>地址</label><input id="fUrl" placeholder="http://localhost:3001" /></div>
      <div class="field"><label>描述</label><textarea id="fDesc" rows="2"></textarea></div>
      <div class="field">
        <label>图标</label>
        <div class="emoji-strip" id="emojiStrip"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveApp()">保存</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    var API = location.origin + '/api';
    var apps = [];
    var editingId = null;
    var currentIcon = { type: 'emoji', value: '🚀' };
    var EMOJIS = ['🚀','📊','🔧','⚙️','📋','🖥️','📱','🔍','📦','⚡','📈','💡','📝','👥','🏭'];

    function api(url, opts) {
      return fetch(url, opts).then(function(r) { return r.json(); }).then(function(d) {
        if (!d.success) throw new Error(d.message || '操作失败');
        return d;
      });
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function loadApps() {
      api(API + '/apps').then(function(res) {
        apps = res.data || [];
        render();
      }).catch(function(e) {
        showToast('加载失败: ' + e.message);
        apps = [];
        render();
      });
    }

    function render() {
      var grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('empty').style.display = apps.length ? 'none' : 'block';

      apps.forEach(function(app) {
        var card = document.createElement('div');
        card.className = 'app-card';
        card.innerHTML =
          '<button class="card-del" title="删除">✕</button>' +
          '<div class="app-icon">' + (app.icon && app.icon.value ? app.icon.value : '🔲') + '</div>' +
          '<div class="app-name">' + esc(app.name) + '</div>' +
          '<div class="app-desc">' + esc(app.desc || '') + '</div>';

        card.querySelector('.card-del').onclick = function(e) {
          e.stopPropagation();
          if (!confirm('删除 "' + app.name + '"?')) return;
          api(API + '/apps/' + app.id, { method: 'DELETE' }).then(function() {
            showToast('已删除');
            loadApps();
          });
        };

        card.onclick = function() {
          if (document.body.classList.contains('manage-mode')) {
            openEdit(app);
          } else {
            window.open(app.url, '_blank');
          }
        };
        grid.appendChild(card);
      });

      var add = document.createElement('div');
      add.className = 'add-card';
      add.innerHTML = '<span style="font-size:28px">＋</span><span>添加应用</span>';
      add.onclick = openAdd;
      grid.appendChild(add);
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function toggleManage() {
      if (document.body.classList.contains('manage-mode')) {
        document.body.classList.remove('manage-mode');
        document.querySelector('.btn-manage').textContent = '管理应用';
        return;
      }
      var pwd = prompt('管理密码（留空跳过）:');
      if (pwd === null) return;
      document.body.classList.add('manage-mode');
      document.querySelector('.btn-manage').textContent = '退出管理';
      showToast('已进入管理模式');
    }

    function renderEmojis() {
      var strip = document.getElementById('emojiStrip');
      strip.innerHTML = '';
      EMOJIS.forEach(function(em) {
        var s = document.createElement('span');
        s.className = 'emoji-opt' + (currentIcon.value === em ? ' selected' : '');
        s.textContent = em;
        s.onclick = function() {
          currentIcon = { type: 'emoji', value: em };
          renderEmojis();
        };
        strip.appendChild(s);
      });
    }

    function openAdd() {
      editingId = null;
      currentIcon = { type: 'emoji', value: '🚀' };
      document.getElementById('modalTitle').textContent = '添加应用';
      document.getElementById('fName').value = '';
      document.getElementById('fUrl').value = '';
      document.getElementById('fDesc').value = '';
      renderEmojis();
      document.getElementById('modal').classList.add('open');
    }

    function openEdit(app) {
      editingId = app.id;
      currentIcon = app.icon || { type: 'emoji', value: '🔲' };
      document.getElementById('modalTitle').textContent = '编辑应用';
      document.getElementById('fName').value = app.name;
      document.getElementById('fUrl').value = app.url;
      document.getElementById('fDesc').value = app.desc || '';
      renderEmojis();
      document.getElementById('modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
    }

    function saveApp() {
      var data = {
        name: document.getElementById('fName').value.trim(),
        url: document.getElementById('fUrl').value.trim(),
        desc: document.getElementById('fDesc').value.trim(),
        icon: currentIcon
      };
      if (!data.name || !data.url) { showToast('请填写名称和地址'); return; }

      var req = editingId
        ? api(API + '/apps/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
        : api(API + '/apps', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });

      req.then(function() {
        closeModal();
        showToast(editingId ? '已更新' : '已添加');
        loadApps();
      }).catch(function(e) { showToast(e.message); });
    }

    loadApps();
  </script>
</body>
</html>
