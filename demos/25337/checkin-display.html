      showToast('VIP嘉宾 ' + attendee.name + ' 签到成功！', true);
    } else {
      showToast(attendee.name + ' 签到成功！', false);
    }
  }

  // ===== 更新统计 =====
  function updateStats() {
    document.getElementById('totalCount').textContent = checkedInList.length;
    document.getElementById('vipCount').textContent = checkedInList.filter(function(a) { return a.vipLevel > 0; }).length;
    document.getElementById('onlineCount').textContent = checkedInList.length;
  }

  // ===== 添加漂浮头像 =====
  function addFloatingAvatar(attendee) {
    var area = document.getElementById('floatArea');
    var rect = area.getBoundingClientRect();

    var el = document.createElement('div');
    el.className = 'floating-avatar' + (attendee.vipLevel > 0 ? ' vip' : '');

    var maxX = rect.width - 80;
    var maxY = rect.height - 100;
    var x = Math.random() * Math.max(maxX, 100);
    var y = Math.random() * Math.max(maxY, 100);

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.animationDuration = (Math.random() * 4 + 4) + 's';
    el.style.animationDelay = (Math.random() * 2) + 's';
    el.style.opacity = '0';

    var img = document.createElement('img');
    img.className = 'avatar-img';
    img.src = getAvatarUrl(attendee.name, attendee.id);
    img.alt = attendee.name;
    el.appendChild(img);

    if (attendee.vipLevel > 0) {
      var badge = document.createElement('span');
      badge.className = 'vip-badge level-' + attendee.vipLevel;
      badge.textContent = 'V' + attendee.vipLevel;
      el.appendChild(badge);
    }

    var nameEl = document.createElement('span');
    nameEl.className = 'avatar-name';
    nameEl.textContent = attendee.name;
    el.appendChild(nameEl);

    area.appendChild(el);

    // 入场动画
    setTimeout(function() {
      el.style.opacity = '1';
      el.style.transform = 'scale(1)';
    }, 50);

    floatingElements.push({ el: el, attendee: attendee, x: x, y: y });

    // 缓慢漂移
    startDrift(el, x, y, rect);
  }

  // ===== 头像漂移 =====
  function startDrift(el, startX, startY, areaRect) {
    var currentX = startX;
    var currentY = startY;
    var targetX = startX;
    var targetY = startY;
    var speed = 0.3 + Math.random() * 0.5;

    function updateTarget() {
      targetX = Math.random() * Math.max(areaRect.width - 80, 100);
      targetY = Math.random() * Math.max(areaRect.height - 100, 100);
    }

    setInterval(updateTarget, 8000 + Math.random() * 5000);

    function drift() {
      var dx = targetX - currentX;
      var dy = targetY - currentY;
      var dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 1) {
        currentX += (dx / dist) * speed;
        currentY += (dy / dist) * speed;
      }

      el.style.left = currentX + 'px';
      el.style.top = currentY + 'px';
      requestAnimationFrame(drift);
    }

    requestAnimationFrame(drift);
  }

  // ===== VIP特效 =====
  function showVipEffect(attendee) {
    var color = vipLevelColors[attendee.vipLevel] || '#ffd700';

    // 闪光
    var flash = document.getElementById('vipFlash');
    flash.style.background = 'radial-gradient(circle at center, ' + color + '33 0%, transparent 70%)';
    flash.classList.remove('active');
    void flash.offsetWidth;
    flash.classList.add('active');

    // 粒子爆炸
    createVipParticles(color, attendee.vipLevel);

    // 通知
    showVipNotification(attendee);
  }

  function createVipParticles(color, level) {
    var overlay = document.getElementById('vipEffectOverlay');
    var count = 30 + level * 15;
    var cx = window.innerWidth / 2;
    var cy = window.innerHeight / 2;

    for (var i = 0; i < count; i++) {
      var p = document.createElement('div');
      p.className = 'vip-effect-particle';
      var size = Math.random() * 8 + 3;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = color;
      p.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + color;
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';

      var angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.5;
      var distance = 150 + Math.random() * 300;
      var tx = Math.cos(angle) * distance;
      var ty = Math.sin(angle) * distance;
      var duration = 800 + Math.random() * 600;

      p.style.transition = 'all ' + duration + 'ms cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      overlay.appendChild(p);

      (function(particle, translateX, translateY, dur) {
        setTimeout(function() {
          particle.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(0)';
          particle.style.opacity = '0';
        }, 20);
        setTimeout(function() {
          if (particle.parentNode) particle.parentNode.removeChild(particle);
        }, dur + 100);
      })(p, tx, ty, duration);
    }

    // 额外的星星粒子
    for (var j = 0; j < 10; j++) {
      var star = document.createElement('div');
      star.className = 'vip-effect-particle';
      var starSize = Math.random() * 12 + 6;
      star.style.width = starSize + 'px';
      star.style.height = starSize + 'px';
      star.style.background = '#fff';
      star.style.borderRadius = '2px';
      star.style.boxShadow = '0 0 ' + (starSize * 3) + 'px ' + color + ', 0 0 ' + (starSize) + 'px #fff';
      star.style.left = (cx + (Math.random() - 0.5) * 100) + 'px';
      star.style.top = (cy + (Math.random() - 0.5) * 100) + 'px';

      var starAngle = Math.random() * Math.PI * 2;
      var starDist = 200 + Math.random() * 200;
      var stx = Math.cos(starAngle) * starDist;
      var sty = Math.sin(starAngle) * starDist;
      var starDur = 1000 + Math.random() * 500;

      star.style.transition = 'all ' + starDur + 'ms ease-out';
      overlay.appendChild(star);

      (function(s, sx, sy, sd) {
        setTimeout(function() {
          s.style.transform = 'translate(' + sx + 'px, ' + sy + 'px) rotate(' + (Math.random() * 360) + 'deg) scale(0)';
          s.style.opacity = '0';
        }, 30);
        setTimeout(function() {
          if (s.parentNode) s.parentNode.removeChild(s);
        }, sd + 100);
      })(star, stx, sty, starDur);
    }
  }

  function showVipNotification(attendee) {
    var notif = document.getElementById('vipNotification');
    document.getElementById('notifAvatar').src = getAvatarUrl(attendee.name, attendee.id);
    document.getElementById('notifName').textContent = attendee.name;
    document.getElementById('notifLevel').textContent = vipLevelNames[attendee.vipLevel] + ' · ' + attendee.title + ' @ ' + attendee.company;

    notif.classList.add('show');

    setTimeout(function() {
      notif.classList.remove('show');
    }, 3000);
  }

  // ===== 更新排行榜 =====
  function updateRankList() {
    var vipAttendees = checkedInList.filter(function(a) { return a.vipLevel > 0; });
    vipAttendees.sort(function(a, b) {
      if (b.vipLevel !== a.vipLevel) return b.vipLevel - a.vipLevel;
      return b.score - a.score;
    });

    var list = document.getElementById('rankList');
    list.innerHTML = '';

    if (vipAttendees.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:0.85rem;">等待VIP嘉宾签到...</div>';
      return;
    }

    vipAttendees.forEach(function(a, i) {
      var item = document.createElement('div');
      item.className = 'rank-item';
      if (i === 0) item.classList.add('top-1');
      else if (i === 1) item.classList.add('top-2');
      else if (i === 2) item.classList.add('top-3');
      item.style.animationDelay = (i * 0.08) + 's';

      item.innerHTML =
        '<div class="rank-num">' + (i + 1) + '</div>' +
        '<img class="rank-avatar" src="' + getAvatarUrl(a.name, a.id) + '" alt="' + a.name + '">' +
        '<div class="rank-info">' +
          '<div class="rank-name">' + a.name + '</div>' +
          '<div class="rank-level"><span class="level-tag" style="background:' + vipLevelColors[a.vipLevel] + '">' + vipLevelNames[a.vipLevel] + '</span> · ' + a.title + '</div>' +
        '</div>' +
        '<div class="rank-score">' + a.score.toLocaleString() + '</div>';

      list.appendChild(item);
    });
  }

  // ===== Toast提示 =====
  function showToast(msg, isVip) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast' + (isVip ? ' vip-toast' : '');
    toast.classList.add('show');

    setTimeout(function() {
      toast.classList.remove('show');
    }, 2500);
  }

  // ===== 绘制二维码 =====
  function drawQRCode() {
    var canvas = document.getElementById('qrcodeCanvas');
    var ctx = canvas.getContext('2d');
    var size = 120;
    var cellSize = 4;
    var modules = Math.floor(size / cellSize);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, size, size);

    // 生成伪QR码图案
    var grid = [];
    for (var i = 0; i < modules; i++) {
      grid[i] = [];
      for (var j = 0; j < modules; j++) {
        grid[i][j] = false;
      }
    }

    // 定位图案
    function drawFinder(ox, oy) {
      for (var y = 0; y < 7; y++) {
        for (var x = 0; x < 7; x++) {
          if (y === 0 || y === 6 || x === 0 || x === 6 ||
              (x >= 2 && x <= 4 && y >= 2 && y <= 4)) {
            if (ox + x < modules && oy + y < modules) {
              grid[ox + x][oy + y] = true;
            }
          }
        }
      }
    }

    drawFinder(0, 0);
    drawFinder(modules - 7, 0);
    drawFinder(0, modules - 7);

    // 随机数据区域
    for (var r = 0; r < modules; r++) {
      for (var c = 0; c < modules; c++) {
        if (!grid[r][c]) {
          // 跳过定位图案区域
          var inFinder = (r < 8 && c < 8) || (r < 8 && c >= modules - 8) || (r >= modules - 8 && c < 8);
          if (!inFinder && Math.random() > 0.5) {
            grid[r][c] = true;
          }
        }
      }
    }

    // 绘制
    ctx.fillStyle = '#0a0e1a';
    for (var row = 0; row < modules; row++) {
      for (var col = 0; col < modules; col++) {
        if (grid[row][col]) {
          ctx.fillRect(col * cellSize, row * cellSize, cellSize - 0.5, cellSize - 0.5);
        }
      }
    }

    // 中心Logo
    var logoSize = 24;
    var logoX = (size - logoSize) / 2;
    ctx.fillStyle = '#0a0e1a';
    ctx.beginPath();
    ctx.roundRect(logoX - 2, logoX - 2, logoSize + 4, logoSize + 4, 4);
    ctx.fill();
    ctx.fillStyle = '#00d4ff';
    ctx.beginPath();
    ctx.roundRect(logoX, logoX, logoSize, logoSize, 3);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Outfit, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GTS', size / 2, size / 2);
  }

  // ===== 签到事件绑定 =====
  var input = document.getElementById('checkinInput');
  var btn = document.getElementById('checkinBtn');

  function handleCheckIn() {
    var val = input.value.trim();
    if (!val) return;

    // 按姓名或ID查找
    var attendee = null;
    var numVal = parseInt(val);
    if (!isNaN(numVal)) {
      attendee = attendees.find(function(a) { return a.id === numVal; });
    }
    if (!attendee) {
      attendee = attendees.find(function(a) { return a.name === val; });
    }
    if (!attendee) {
      // 模糊匹配
      attendee = attendees.find(function(a) { return a.name.indexOf(val) !== -1; });
    }

    if (attendee) {
      checkIn(attendee);
      input.value = '';
    } else {
      showToast('未找到该参会人员: ' + val, false);
    }
  }

  btn.addEventListener('click', handleCheckIn);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleCheckIn();
  });

  // ===== 初始化 =====
  function init() {
    initBgParticles();
    drawQRCode();
    updateRankList();

    // 自动模拟签到（每隔几秒签到一人）
    var autoIndex = 0;
    var shuffled = attendees.slice().sort(function() { return Math.random() - 0.5; });

    function autoCheckIn() {
      if (autoIndex < shuffled.length) {
        checkIn(shuffled[autoIndex]);
        autoIndex++;
        setTimeout(autoCheckIn, 2000 + Math.random() * 3000);
      }
    }

    // 3秒后开始自动签到
    setTimeout(autoCheckIn, 3000);
  }

  // roundRect polyfill
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = [r, r, r, r];
      this.moveTo(x + r[0], y);
      this.lineTo(x + w - r[1], y);
      this.quadraticCurveTo(x + w, y, x + w, y + r[1]);
      this.lineTo(x + w, y + h - r[2]);
      this.quadraticCurveTo(x + w, y + h, x + w - r[2], y + h);
      this.lineTo(x + r[3], y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r[3]);
      this.lineTo(x, y + r[0]);
      this.quadraticCurveTo(x, y, x + r[0], y);
      this.closePath();
      return this;
    };
  }

  init();
})();
</script>
