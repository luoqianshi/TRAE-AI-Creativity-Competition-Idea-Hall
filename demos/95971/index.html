<script>
// ====================================================================
// 全局状态
// ====================================================================
const State = {
  user: { display_name: '张老师', grade: '中班', class_name: '阳光班', teacher_name: '张老师' },
  semester: { name: '2025-2026学年第二学期', start: '2025-02-17', end: '2026-06-30' },
  selectedDate: null,
};

// localStorage 持久化
const Store = {
  get(key, def) {
    try { const v = localStorage.getItem('kg_' + key); return v ? JSON.parse(v) : def; }
    catch { return def; }
  },
  set(key, val) { localStorage.setItem('kg_' + key, JSON.stringify(val)); },
  del(key) { localStorage.removeItem('kg_' + key); }
};

// ====================================================================
// Toast 通知
// ====================================================================
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  const box = document.getElementById('toastBox');
  const icon = document.getElementById('toastIcon');
  const text = document.getElementById('toastMsg');
  const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-orange-500' };
  const icons = { success: 'check_circle', error: 'error', info: 'info', warning: 'warning' };
  box.className = `px-4 py-3 rounded-lg shadow-lg text-sm text-white max-w-md flex items-center gap-2 ${colors[type]}`;
  icon.textContent = icons[type];
  text.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
}

// ====================================================================
// 确认对话框
// ====================================================================
function confirmDialog(msg, onConfirm) {
  document.getElementById('confirmMsg').textContent = msg;
  const modal = document.getElementById('confirmModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  const btn = document.getElementById('confirmBtn');
  btn.onclick = () => { closeConfirm(); onConfirm(); };
}
function closeConfirm() {
  const modal = document.getElementById('confirmModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

// ====================================================================
// 侧边栏切换
// ====================================================================
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const main = document.getElementById('content');
  if (sb.classList.contains('-translate-x-full')) {
    sb.classList.remove('-translate-x-full');
    main.classList.add('ml-60');
    main.classList.remove('ml-0');
  } else {
    sb.classList.add('-translate-x-full');
    main.classList.remove('ml-60');
    main.classList.add('ml-0');
  }
}

// ====================================================================
// 导航
// ====================================================================
function navigate(page) {
  document.querySelectorAll('.menu-item').forEach(el => {
    el.classList.remove('bg-blue-50', 'text-blue-700', 'font-semibold');
    el.querySelector('.ms').classList.remove('text-blue-600');
    el.querySelector('.ms').classList.add('text-gray-500');
  });
  const active = document.querySelector(`[data-page="${page}"]`);
  if (active) {
    active.classList.add('bg-blue-50', 'text-blue-700', 'font-semibold');
    active.querySelector('.ms').classList.add('text-blue-600');
    active.querySelector('.ms').classList.remove('text-gray-500');
  }
  const content = document.getElementById('content');
  content.innerHTML = '';
  const fn = Pages[page] || Pages['home'];
  fn(content);
  content.scrollTop = 0;
}

function logout() {
  toast('已退出登录（演示模式）', 'info');
  setTimeout(() => navigate('home'), 500);
}

// ====================================================================
// 辅助函数
// ====================================================================
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function weekdayCN(d) {
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return days[new Date(d).getDay()];
}
function weekNumber(startDate, date) {
  const diff = Math.floor((new Date(date) - new Date(startDate)) / 86400000);
  return Math.max(1, Math.floor(diff / 7) + 1);
}
function setLoading(btn, text) {
  if (text) { btn._origText = btn.innerHTML; btn.innerHTML = `<span class="ms animate-spin" style="font-size:18px">progress_activity</span> ${text}`; btn.disabled = true; }
  else { btn.innerHTML = btn._origText || btn.innerHTML; btn.disabled = false; }
}
function downloadFile(filename, content, mime = 'text/plain') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = el('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function dpUpdateDate() {
  const d = document.getElementById('dp_date').value;
  State.selectedDate = d;
  const wk = weekNumber(State.semester.start, d);
  const wd = weekdayCN(d);
  document.getElementById('dp_weekInfo').textContent = `第 ${wk} 周 ${wd}`;
  // 尝试加载已保存草稿
  const plans = Store.get('dailyPlans', []);
  const plan = plans.find(p => p.plan_date === d);
  if (plan) {
    dpFillForm(plan);
    toast('已加载 ' + d + ' 的草稿', 'info');
  } else {
    dpFillForm({});
  }
}
function dpFillForm(p) {
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = v || ''; };
  set('dp_goal', p.activity_goal); set('dp_prep', p.activity_prep);
  set('dp_key', p.activity_key); set('dp_diff', p.activity_difficult);
  set('dp_adapted', p.activity_process_adapted); set('dp_original', p.activity_process_original);
  set('dp_morning', p.morning_activity); set('dp_talk', p.morning_talk_topic);
  set('dp_area', p.indoor_area); set('dp_outdoor', p.outdoor_activity);
  set('dp_reflection', p.daily_reflection);
}
function dpSplit() {
  const d = State.selectedDate;
  if (!d) { dpMsg('dp_splitMsg', '⚠ 请先选择日期', 'orange'); return; }
  const raw = document.getElementById('dp_raw').value.trim();
  if (!raw) { dpMsg('dp_splitMsg', '⚠ 请先输入教案文本', 'red'); return; }
  const btn = document.getElementById('dp_splitBtn');
  setLoading(btn, 'AI 拆分中');
  dpMsg('dp_splitMsg', 'AI 拆分中，请稍候……', 'blue');
  setTimeout(() => {
    const r = MockAI.splitLessonPlan();
    document.getElementById('dp_goal').value = r.activity_goal;
    document.getElementById('dp_prep').value = r.activity_prep;
    document.getElementById('dp_key').value = r.activity_key;
    document.getElementById('dp_diff').value = r.activity_difficult;
    document.getElementById('dp_adapted').value = r.activity_process_adapted;
    document.getElementById('dp_original').value = r.activity_process_original;
    setLoading(btn);
    dpMsg('dp_splitMsg', '✅ AI 拆分完成，已自动回填以下字段', 'green');
  }, 1800);
}
function dpGenAll() {
  const d = State.selectedDate;
  if (!d) { dpMsg('dp_genAllMsg', '⚠ 请先选择日期', 'orange'); return; }
  const btn = document.getElementById('dp_genAllBtn');
  setLoading(btn, '生成中');
  dpMsg('dp_genAllMsg', 'AI 生成中，请稍候……', 'blue');
  setTimeout(() => {
    const r = MockAI.dailyActivities();
    document.getElementById('dp_morning').value = r.morning_activity;
    document.getElementById('dp_talk').value = r.morning_talk;
    document.getElementById('dp_area').value = r.area_game;
    document.getElementById('dp_outdoor').value = r.outdoor_game;
    setLoading(btn);
    dpMsg('dp_genAllMsg', '✅ 四项内容已全部生成', 'green');
    dpMsg('dp_morningMsg', '✅ 生成完成', 'green');
    dpMsg('dp_talkMsg', '✅ 生成完成', 'green');
    dpMsg('dp_areaMsg', '✅ 生成完成', 'green');
    dpMsg('dp_outdoorMsg', '✅ 生成完成', 'green');
  }, 2200);
}
function dpGenReflection() {
  const btn = document.getElementById('dp_reflectionBtn');
  setLoading(btn, '生成中');
  setTimeout(() => {
    document.getElementById('dp_reflection').value = MockAI.dailyActivities().daily_reflection;
    setLoading(btn);
    dpMsg('dp_reflectionMsg', '✅ 生成完成', 'green');
  }, 1500);
}
function dpSave() {
  const d = State.selectedDate;
  if (!d) { dpMsg('dp_saveMsg', '⚠ 请先选择日期', 'orange'); return; }
  const btn = document.getElementById('dp_saveBtn');
  setLoading(btn, '保存中');
  const plans = Store.get('dailyPlans', []);
  const plan = {
    plan_date: d, week_number: weekNumber(State.semester.start, d), weekday_cn: weekdayCN(d),
    grade: State.user.grade, class_name: State.user.class_name,
    activity_goal: val('dp_goal'), activity_prep: val('dp_prep'), activity_key: val('dp_key'),
    activity_difficult: val('dp_diff'), activity_process_original: val('dp_original'),
    activity_process_adapted: val('dp_adapted'), morning_activity: val('dp_morning'),
    morning_talk_topic: val('dp_talk'), indoor_area: val('dp_area'),
    outdoor_activity: val('dp_outdoor'), daily_reflection: val('dp_reflection'),
  };
  const idx = plans.findIndex(p => p.plan_date === d);
  if (idx >= 0) plans[idx] = plan; else plans.unshift(plan);
  Store.set('dailyPlans', plans);
  setTimeout(() => { setLoading(btn); dpMsg('dp_saveMsg', `✅ 草稿已保存（${d}）`, 'green'); dpRenderHistory(); }, 600);
}
function dpDelete() {
  const d = State.selectedDate;
  if (!d) { dpMsg('dp_saveMsg', '⚠ 请先选择日期', 'orange'); return; }
  confirmDialog(`确定要删除 ${d} 的草稿吗？删除后无法恢复。`, () => {
    let plans = Store.get('dailyPlans', []);
    plans = plans.filter(p => p.plan_date !== d);
    Store.set('dailyPlans', plans);
    dpFillForm({});
    document.getElementById('dp_raw').value = '';
    dpMsg('dp_saveMsg', '✅ 草稿已删除', 'gray');
    dpRenderHistory();
  });
}
function dpExport() {
  const d = State.selectedDate;
  if (!d) { dpMsg('dp_saveMsg', '⚠ 请先选择日期并保存草稿', 'orange'); return; }
  const plans = Store.get('dailyPlans', []);
  const plan = plans.find(p => p.plan_date === d);
  if (!plan) { dpMsg('dp_saveMsg', '⚠ 请先保存草稿再导出', 'orange'); return; }
  const btn = document.getElementById('dp_exportBtn');
  setLoading(btn, '导出中');
  setTimeout(() => {
    const content = dpBuildDoc(plan);
    const filename = `1_1_${plan.grade}_${plan.class_name}_${d.replace(/-/g,'')}_日计划.txt`;
    downloadFile(filename, content);
    setLoading(btn);
    dpMsg('dp_saveMsg', `✅ 已导出：${filename}`, 'green');
  }, 800);
}
function dpBatchExport() {
  const s = document.getElementById('dp_batchStart').value;
  const e = document.getElementById('dp_batchEnd').value;
  if (!s || !e) { dpMsg('dp_batchMsg', '⚠ 请先选择开始日期和结束日期', 'orange'); return; }
  if (s > e) { dpMsg('dp_batchMsg', '⚠ 开始日期不能晚于结束日期', 'orange'); return; }
  const btn = document.getElementById('dp_batchBtn');
  setLoading(btn, '查询中');
  const plans = Store.get('dailyPlans', []).filter(p => p.plan_date >= s && p.plan_date <= e);
  setTimeout(() => {
    if (!plans.length) { setLoading(btn); dpMsg('dp_batchMsg', '⚠ 所选日期范围内无计划记录', 'orange'); return; }
    let content = '';
    plans.forEach(p => { content += dpBuildDoc(p) + '\n\n' + '='.repeat(60) + '\n\n'; });
    const filename = `1_1_${State.user.grade}_${State.user.class_name}_${s.replace(/-/g,'')}_${e.replace(/-/g,'')}_批量日计划.txt`;
    downloadFile(filename, content);
    setLoading(btn);
    dpMsg('dp_batchMsg', `✅ 已导出 ${plans.length} 条计划（${s} ~ ${e}）：${filename}`, 'green');
  }, 1000);
}
function dpBuildDoc(p) {
  return `幼儿园每日活动计划\n\n日期：${p.plan_date}  第${p.week_number}周 ${p.weekday_cn}\n班级：${p.grade} ${p.class_name}\n\n【活动目标】\n${p.activity_goal || ''}\n\n【活动准备】\n${p.activity_prep || ''}\n\n【活动重点】\n${p.activity_key || ''}\n\n【活动难点】\n${p.activity_difficult || ''}\n\n【活动过程（年龄适配改写版）】\n${p.activity_process_adapted || ''}\n\n【晨间活动】\n${p.morning_activity || ''}\n\n【晨间谈话】\n${p.morning_talk_topic || ''}\n\n【室内区域游戏】\n${p.indoor_area || ''}\n\n【户外游戏】\n${p.outdoor_activity || ''}\n\n【一日活动反思】\n${p.daily_reflection || ''}`;
}
function dpRenderHistory() {
  const plans = Store.get('dailyPlans', []);
  const c = document.getElementById('dp_history');
  if (!plans.length) { c.innerHTML = '<p class="text-gray-400 text-sm">暂无历史记录</p>'; return; }
  c.innerHTML = plans.map(p => `
    <div class="bg-white rounded-lg border border-gray-200 p-3 flex justify-between items-center">
      <span class="text-sm text-gray-700">${p.plan_date}  第${p.week_number}周 ${p.weekday_cn}  ${p.grade || ''} ${p.class_name || ''}</span>
      <button onclick="confirmDialog('确定要删除「${p.plan_date}」的活动计划吗？',()=>{let ps=Store.get('dailyPlans',[]);ps=ps.filter(x=>x.plan_date!=='${p.plan_date}');Store.set('dailyPlans',ps);dpRenderHistory();})" class="text-red-500 text-sm hover:underline">删除</button>
    </div>
  `).join('');
}
function dpMsg(id, text, color) {
  const e = document.getElementById(id); if (!e) return;
  const colors = { green: 'text-green-600', red: 'text-red-500', orange: 'text-orange-500', blue: 'text-blue-600', gray: 'text-gray-500' };
  e.className = 'text-sm mt-1 ' + (colors[color] || '');
  e.textContent = text;
}
function val(id) { const e = document.getElementById(id); return e ? e.value : ''; }

function lsAddImage(d) {
  const st = window._lsState.domains[d];
  if (st.raw_images.length >= 3) { toast(d + '领域最多 3 张图片', 'warning'); return; }
  const colors = ['#86efac','#fca5a5','#fcd34d','#93c5fd','#c4b5fd'];
  st.raw_images.push(colors[st.raw_images.length % colors.length]);
  lsRenderDomain(d);
}
function lsPickDomain(d) {
  const y = document.getElementById('ls_d_year_'+d)?.value || new Date().getFullYear();
  const m = parseInt(document.getElementById('ls_d_month_'+d)?.value || 1);
  const dates = [];
  for (let day = 1; day <= 21 && dates.length < 3; day++) {
    const dt = new Date(y, m-1, day);
    const wd = dt.getDay();
    if (wd !== 0 && wd !== 6) dates.push(dt.toISOString().slice(0,10));
  }
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById(`ls_d_date_${d}_${i}`);
    if (el) el.value = dates[i] || '';
  }
  toast(d + '领域工作日已填入，可手动调整', 'success');
}
function lsAutoPick() {
  Object.keys(window._lsState.domains).forEach(d => lsPickDomain(d));

  window._lsState.bulkFiles = Array.from({length:15},(_,i)=>`img${String(i+1).padStart(2,'0')}.jpg`);

function lsBulkImport() {
  if (window._lsState.bulkFiles.length < 15) { toast('一键导入至少需要 15 张照片（当前 '+window._lsState.bulkFiles.length+' 张）', 'warning'); return; }

  domains.forEach((d,di) => {

function lsGenerateDomain(d) {
  const st = window._lsState.domains[d];
  if (st.raw_images.length < 1) { toast(d+'领域请先上传 1~3 张绘画照片', 'warning'); return; }
  const btn = document.getElementById('ls_genBtn_'+d);
  setLoading(btn, '生成中');
  lsMsg('⏳ 正在生成'+d+'领域……', 'info');
  setTimeout(() => {
    const r = MockAI.listeningDomain(d);
    st.goals = r.goals; st.descs = r.descs; st.eval = r.evaluation; st.strategy = r.support_strategy;
    document.getElementById('ls_goals_'+d).value = r.goals;
    r.descs.forEach((desc,i) => { const e = document.getElementById(`ls_desc_${d}_${i}`); if (e) e.value = desc; });
    document.getElementById('ls_eval_'+d).value = r.evaluation;
    document.getElementById('ls_strategy_'+d).value = r.support_strategy;
    setLoading(btn);
    lsMsg(d+'领域生成成功，请检查后保存', 'success');
  }, 1800);
}
function lsGenAll() {
  const btn = document.getElementById('ls_genAllBtn');
  setLoading(btn, '生成中');
  const domains = ['健康','语言','社会','艺术','科学'];
  let done = 0;
  domains.forEach((d, i) => {
    const st = window._lsState.domains[d];
    if (st.raw_images.length < 1) { done++; if (done === domains.length) { setLoading(btn); lsMsg('请先上传照片再生成', 'error'); } return; }
    setTimeout(() => {
      const r = MockAI.listeningDomain(d);
      st.goals = r.goals; st.descs = r.descs; st.eval = r.evaluation; st.strategy = r.support_strategy;
      if (window._lsState.currentDomain === d) lsRenderDomain(d);
      done++;
      if (done >= domains.filter(d2 => window._lsState.domains[d2].raw_images.length).length) {
        setLoading(btn);
        lsMsg('全部领域生成完成，请检查后保存', 'success');
      }
    }, i * 600);
  });
}
function lsCollectDomain(d) {
  const st = window._lsState.domains[d];
  if (!st.raw_images.length && !st.goals) return null;
  return {
    domain: d,
    goals: val('ls_goals_'+d) || st.goals,
    descs: [val('ls_desc_'+d+'_0'),val('ls_desc_'+d+'_1'),val('ls_desc_'+d+'_2')],
    eval: val('ls_eval_'+d) || st.eval,
    strategy: val('ls_strategy_'+d) || st.strategy,
  };
}
function lsSave() {
  const childName = val('ls_child');
  if (!childName) { lsMsg('请填写幼儿姓名', 'error'); return; }
  const btn = document.getElementById('ls_saveBtn');
  setLoading(btn, '保存中');
  const domains = ['健康','语言','社会','艺术','科学'].map(lsCollectDomain).filter(Boolean);
  if (!domains.length) { setLoading(btn); lsMsg('请至少为一个领域上传图片并生成内容', 'error'); return; }

    id: window._lsState.editId || Date.now(),
    obs_year: parseInt(val('ls_year')), obs_month: parseInt(val('ls_month')),
    child_name: childName, grade: State.user.grade, class_name: State.user.class_name,
    observer: val('ls_observer'), adult_count: val('ls_adult'), domains,
  };
  const idx = records.findIndex(r => r.id === rec.id);

function lsRenderHistory() {
  const records = Store.get('listeningRecords', []);
  const c = document.getElementById('ls_history');
  if (!c) return;
  const fy = val('ls_filterYear'); const fm = val('ls_filterMonth'); const fn = val('ls_filterName');
  let filtered = records;
  if (fy) filtered = filtered.filter(r => r.obs_year === parseInt(fy));
  if (fm && fm !== '0') filtered = filtered.filter(r => r.obs_month === parseInt(fm));
  if (fn) filtered = filtered.filter(r => (r.child_name||'').includes(fn));
  if (!filtered.length) { c.innerHTML = '<p class="text-gray-400 text-sm">暂无记录</p>'; return; }

        <input id="set_vUrl" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2" placeholder="视觉模型 API 地址" value="${saved.vUrl || ''}" />
        <input id="set_vModel" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2" placeholder="视觉模型名称 如：gpt-4o / qwen-vl-plus" value="${saved.vModel || ''}" />
        <input id="set_vKey" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2" placeholder="视觉模型 API Key" value="${visionKey}" />
        <p id="set_vMsg" class="text-sm mt-1"></p>
        <div class="flex gap-3 mt-2">
          <button onclick="setSaveVision()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700">保存视觉模型</button>
          <button onclick="setVerifyVision()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm hover:bg-gray-200">验证连接</button>
        </div>
      </div>
      <!-- 数据库配置 -->
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <h2 class="text-lg font-bold text-blue-700 mb-2">数据库配置</h2>
        <p class="text-sm text-gray-500 mb-2">默认使用 SQLite（无需额外配置）。切换到 MySQL 需填写连接信息。</p>
        <div class="flex gap-4 mb-2">
          <label class="flex items-center gap-1 text-sm"><input type="radio" name="dbMode" value="sqlite" checked onchange="document.getElementById('set_mysqlFields').classList.add('hidden')" /> SQLite（内嵌，推荐）</label>
          <label class="flex items-center gap-1 text-sm"><input type="radio" name="dbMode" value="mysql" onchange="document.getElementById('set_mysqlFields').classList.remove('hidden')" /> MySQL（外部数据库）</label>
        </div>
        <div id="set_mysqlFields" class="hidden space-y-2">
          <input type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="服务器地址" value="localhost" />
          <div class="flex gap-2"><input type="text" class="border border-gray-300 rounded-lg px-3 py-2 text-sm w-24" placeholder="端口" value="3306" /><input type="text" class="border border-gray-300 rounded-lg px-3 py-2 text-sm flex-1" placeholder="用户名" value="root" /></div>
          <input type="password" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="密码" />
          <input type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="数据库名" value="kindergarten" />
        </div>
        <p class="text-xs text-amber-600 mt-1">⚠️ 切换数据库后原有数据不会自动迁移，请提前备份。</p>
        <p id="set_dbMsg" class="text-sm mt-2"></p>
        <button onclick="setSaveDB()" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">保存数据库配置</button>
      </div>
      <!-- 端口配置 -->
      <div class="bg-white rounded-xl border border-gray-200 p-4">
        <h2 class="text-lg font-bold text-blue-700 mb-2">应用端口</h2>
        <input id="set_port" type="number" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" value="8080" min="1024" max="65535" placeholder="监听端口" />
        <p id="set_portMsg" class="text-sm mt-2"></p>
        <button onclick="setSavePort()" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">保存端口配置</button>
      </div>
    </div>
  `;
};
function setSaveSem() {
  const s = Store.get('settings', {});
  s.semName = val('set_semName'); s.semStart = val('set_semStart'); s.semEnd = val('set_semEnd');
  Store.set('settings', s);
  State.semester = { name: s.semName, start: s.semStart, end: s.semEnd };
  setMsg('set_semMsg', '学期配置已保存', 'green');
}
function setSaveClass() {
  const s = Store.get('settings', {});
  s.grade = val('set_grade'); s.class = val('set_class'); s.teacher = val('set_teacher');
  s.indoor = val('set_indoor'); s.outdoor = val('set_outdoor');
  Store.set('settings', s);
  State.user.grade = s.grade; State.user.class_name = s.class; State.user.teacher_name = s.teacher;
  setMsg('set_classMsg', '班级配置已保存', 'green');
}
function setSaveAI() {
  const s = Store.get('settings', {});
  s.aiUrl = val('set_aiUrl'); s.aiModel = val('set_aiModel');
  const keyVal = val('set_aiKey');
  if (keyVal && !keyVal.startsWith('sk-****')) s.aiKey = 'sk-****' + keyVal.slice(-4);
  Store.set('settings', s);
  document.getElementById('set_aiKey').value = s.aiKey || 'sk-****';
  setMsg('set_aiMsg', 'AI 接口配置已保存', 'green');
}
function setVerifyAI() {
  setMsg('set_aiMsg', '连接测试中……', 'blue');
  setTimeout(() => setMsg('set_aiMsg', '✓ 连接成功', 'green'), 1500);
}
function setSaveVision() {
  const s = Store.get('settings', {});
  s.vUrl = val('set_vUrl'); s.vModel = val('set_vModel');
  const keyVal = val('set_vKey');
  if (keyVal && !keyVal.startsWith('sk-****')) s.visionKey = 'sk-****' + keyVal.slice(-4);
  Store.set('settings', s);
  document.getElementById('set_vKey').value = s.visionKey || 'sk-****';
  setMsg('set_vMsg', '视觉模型配置已保存', 'green');
}
function setVerifyVision() {
  setMsg('set_vMsg', '连接测试中……', 'blue');
  setTimeout(() => setMsg('set_vMsg', '✓ 视觉模型连接成功', 'green'), 1500);
}
function setSaveDB() {
  setMsg('set_dbMsg', '✅ 数据库配置已保存，需重启应用生效', 'green');
}
function setSavePort() {
  setMsg('set_portMsg', '✅ 端口配置已保存，需重启应用生效', 'green');
}
function setMsg(id, text, color) {
  const e = document.getElementById(id); if (!e) return;
  const colors = { green: 'text-green-600', red: 'text-red-500', blue: 'text-blue-600' };
  e.className = 'text-sm mt-1 ' + (colors[color] || '');
  e.textContent = text;
}
