<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拍画灵感 Demo - 拍照生成简笔画</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f4f6fb;
      color: #222;
    }

    header {
      padding: 28px 16px;
      text-align: center;
      background: linear-gradient(135deg, #6d8cff, #9c6cff);
      color: #fff;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    header p {
      margin: 10px 0 0;
      opacity: 0.95;
      font-size: 16px;
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }

    .panel {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .step {
      background: #f0f3ff;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-size: 15px;
      color: #445;
    }

    .step b {
      color: #5b6ee1;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      border: none;
      outline: none;
      padding: 11px 18px;
      border-radius: 999px;
      cursor: pointer;
      background: #5b6ee1;
      color: #fff;
      font-size: 15px;
      transition: 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(91, 110, 225, 0.3);
    }

    .btn.secondary {
      background: #eef1ff;
      color: #4f5fd5;
    }

    .btn.warning {
      background: #ff8a65;
    }

    .tip {
      color: #666;
      font-size: 14px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .canvas-box {
      background: #fafafa;
      border: 2px dashed #d7dcf5;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      min-height: 360px;
      position: relative;
    }

    .canvas-box h2 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #4f5fd5;
    }

    canvas {
      max-width: 100%;
      border-radius: 12px;
      background: #fff;
      cursor: crosshair;
      box-shadow: inset 0 0 0 1px #e7e7e7;
    }

    #resultCanvas {
      cursor: default;
    }

    .placeholder {
      color: #999;
      margin-top: 110px;
      font-size: 15px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      margin-top: 14px;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 14px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      width: 130px;
    }

    .feature-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .feature {
      background: #f8f9ff;
      border-radius: 14px;
      padding: 14px;
      color: #555;
      font-size: 14px;
    }

    .feature b {
      color: #4f5fd5;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 20px;
    }

    @media (max-width: 850px) {
      .workspace,
      .steps,
      .feature-list {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>拍画灵感 Demo</h1>
    <p>拍照 / 上传图片，框选物体，一键生成简笔画效果</p>
  </header>

  <main class="container">
    <section class="panel">
      <div class="steps">
        <div class="step"><b>1.</b> 上传或拍摄一张图片</div>
        <div class="step"><b>2.</b> 在图片上拖拽框选目标物体</div>
        <div class="step"><b>3.</b> 点击生成，得到简笔画</div>
      </div>

      <div class="toolbar">
        <label class="btn" for="imageInput">上传 / 拍照</label>
        <input id="imageInput" type="file" accept="image/*" capture="environment" />

        <button class="btn secondary" id="sampleBtn">使用示例图</button>
        <button class="btn" id="generateBtn">生成简笔画</button>
        <button class="btn warning" id="clearBtn">清空</button>
        <a class="btn secondary" id="downloadBtn" download="简笔画.png">下载结果</a>

        <span class="tip">提示：在左侧图片中按住鼠标拖动，框选你想转换的物体。</span>
      </div>

      <div class="workspace">
        <div class="canvas-box">
          <h2>原图与框选区域</h2>
          <canvas id="sourceCanvas" width="480" height="360"></canvas>
          <div class="options">
            <label>
              线条强度
              <input id="threshold" type="range" min="20" max="160" value="75" />
              <span id="thresholdValue">75</span>
            </label>
            <label>
              <input id="invertMode" type="checkbox" />
              黑底白线
            </label>
          </div>
        </div>

        <div class="canvas-box">
          <h2>生成的简笔画</h2>
          <canvas id="resultCanvas" width="480" height="360"></canvas>
          <p id="resultTip" class="placeholder">生成结果会显示在这里</p>
        </div>
      </div>

      <div class="feature-list">
        <div class="feature"><b>核心功能：</b>拍照识别生活物体，转化为简洁线条。</div>
        <div class="feature"><b>交互方式：</b>用户手动框选目标，模拟“选定物体”。</div>
        <div class="feature"><b>应用场景：</b>手抄报、课堂板书、儿童绘画、手账素材。</div>
      </div>
    </section>

    <footer>
      本 Demo 使用前端 Canvas 图像处理实现简笔画效果，适合作为创意原型展示。
    </footer>
  </main>

  <script>
    const imageInput = document.getElementById("imageInput");
    const sampleBtn = document.getElementById("sampleBtn");
    const generateBtn = document.getElementById("generateBtn");
    const clearBtn = document.getElementById("clearBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const threshold = document.getElementById("threshold");
    const thresholdValue = document.getElementById("thresholdValue");
    const invertMode = document.getElementById("invertMode");
    const resultTip = document.getElementById("resultTip");

    const sourceCanvas = document.getElementById("sourceCanvas");
    const sourceCtx = sourceCanvas.getContext("2d");

    const resultCanvas = document.getElementById("resultCanvas");
    const resultCtx = resultCanvas.getContext("2d");

    let img = new Image();
    let hasImage = false;

    let selecting = false;
    let startX = 0;
    let startY = 0;
    let selection = null;

    function resetCanvas() {
      sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
      resultCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);

      sourceCtx.fillStyle = "#ffffff";
      sourceCtx.fillRect(0, 0, sourceCanvas.width, sourceCanvas.height);
      resultCtx.fillStyle = "#ffffff";
      resultCtx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

      sourceCtx.fillStyle = "#999";
      sourceCtx.font = "16px Microsoft YaHei";
      sourceCtx.textAlign = "center";
      sourceCtx.fillText("请上传图片或使用示例图", sourceCanvas.width / 2, sourceCanvas.height / 2);

      resultTip.style.display = "block";
      downloadBtn.removeAttribute("href");
      hasImage = false;
      selection = null;
    }

    function fitImageToCanvas(image) {
      const cw = sourceCanvas.width;
      const ch = sourceCanvas.height;
      const ratio = Math.min(cw / image.width, ch / image.height);
      const w = image.width * ratio;
      const h = image.height * ratio;
      const x = (cw - w) / 2;
      const y = (ch - h) / 2;

      sourceCtx.clearRect(0, 0, cw, ch);
      sourceCtx.fillStyle = "#fff";
      sourceCtx.fillRect(0, 0, cw, ch);
      sourceCtx.drawImage(image, x, y, w, h);

      hasImage = true;
      selection = null;
      resultCtx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
      resultCtx.fillStyle = "#fff";
      resultCtx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);
      resultTip.style.display = "block";
    }

    function redrawSource() {
      if (!hasImage) return;
      fitImageToCanvas(img);

      if (selection) {
        sourceCtx.strokeStyle = "#ff4d4f";
        sourceCtx.lineWidth = 3;
        sourceCtx.setLineDash([8, 5]);
        sourceCtx.strokeRect(selection.x, selection.y, selection.w, selection.h);
        sourceCtx.setLineDash([]);

        sourceCtx.fillStyle = "rgba(255, 77, 79, 0.12)";
        sourceCtx.fillRect(selection.x, selection.y, selection.w, selection.h);
      }
    }

    function getMousePos(e) {
      const rect = sourceCanvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (sourceCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (sourceCanvas.height / rect.height)
      };
    }

    function getTouchPos(e) {
      const rect = sourceCanvas.getBoundingClientRect();
      const touch = e.touches[0] || e.changedTouches[0];
      return {
        x: (touch.clientX - rect.left) * (sourceCanvas.width / rect.width),
        y: (touch.clientY - rect.top) * (sourceCanvas.height / rect.height)
      };
    }

    function startSelect(pos) {
      if (!hasImage) return;
      selecting = true;
      startX = pos.x;
      startY = pos.y;
    }

    function moveSelect(pos) {
      if (!selecting || !hasImage) return;

      const x = Math.min(startX, pos.x);
      const y = Math.min(startY, pos.y);
      const w = Math.abs(pos.x - startX);
      const h = Math.abs(pos.y - startY);

      selection = { x, y, w, h };
      redrawSource();
    }

    function endSelect() {
      selecting = false;
      if (selection && (selection.w < 10 || selection.h < 10)) {
        selection = null;
        redrawSource();
      }
    }

    sourceCanvas.addEventListener("mousedown", e => startSelect(getMousePos(e)));
    sourceCanvas.addEventListener("mousemove", e => moveSelect(getMousePos(e)));
    sourceCanvas.addEventListener("mouseup", endSelect);
    sourceCanvas.addEventListener("mouseleave", endSelect);

    sourceCanvas.addEventListener("touchstart", e => {
      e.preventDefault();
      startSelect(getTouchPos(e));
    }, { passive: false });

    sourceCanvas.addEventListener("touchmove", e => {
      e.preventDefault();
      moveSelect(getTouchPos(e));
    }, { passive: false });

    sourceCanvas.addEventListener("touchend", e => {
      e.preventDefault();
      endSelect();
    }, { passive: false });

    imageInput.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = event => {
        img = new Image();
        img.onload = () => fitImageToCanvas(img);
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    sampleBtn.addEventListener("click", () => {
      const sampleSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="600">
          <rect width="100%" height="100%" fill="#f7f0df"/>
          <ellipse cx="410" cy="330" rx="170" ry="130" fill="#f8c471"/>
          <ellipse cx="330" cy="210" rx="55" ry="65" fill="#f8c471"/>
          <ellipse cx="490" cy="210" rx="55" ry="65" fill="#f8c471"/>
          <circle cx="350" cy="300" r="18" fill="#333"/>
          <circle cx="470" cy="300" r="18" fill="#333"/>
          <ellipse cx="410" cy="355" rx="38" ry="26" fill="#fff"/>
          <circle cx="395" cy="350" r="7" fill="#333"/>
          <circle cx="425" cy="350" r="7" fill="#333"/>
          <path d="M350 410 Q410 455 470 410" fill="none" stroke="#333" stroke-width="10" stroke-linecap="round"/>
          <rect x="120" y="390" width="120" height="100" rx="18" fill="#8fd3ff"/>
          <rect x="560" y="390" width="120" height="100" rx="18" fill="#9ee493"/>
          <text x="400" y="560" font-size="30" text-anchor="middle" fill="#777">示例图：请框选小熊头像</text>
        </svg>
      `;

      img = new Image();
      img.onload = () => fitImageToCanvas(img);
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(sampleSvg);
    });

    function generateSketch() {
      if (!hasImage) {
        alert("请先上传或拍摄一张图片。");
        return;
      }

      let area = selection;
      if (!area) {
        area = { x: 0, y: 0, w: sourceCanvas.width, h: sourceCanvas.height };
      }

      const x = Math.max(0, Math.floor(area.x));
      const y = Math.max(0, Math.floor(area.y));
      const w = Math.min(sourceCanvas.width - x, Math.floor(area.w));
      const h = Math.min(sourceCanvas.height - y, Math.floor(area.h));

      if (w <= 0 || h <= 0) {
        alert("请重新框选物体区域。");
        return;
      }

      const imageData = sourceCtx.getImageData(x, y, w, h);
      const data = imageData.data;
      const gray = new Uint8ClampedArray(w * h);

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        gray[i / 4] = 0.299 * r + 0.587 * g + 0.114 * b;
      }

      const output = resultCtx.createImageData(w, h);
      const out = output.data;
      const t = Number(threshold.value);
      const inverted = invertMode.checked;

      for (let yy = 1; yy < h - 1; yy++) {
        for (let xx = 1; xx < w - 1; xx++) {
          const idx = yy * w + xx;

          const gx =
            -gray[(yy - 1) * w + (xx - 1)] +
             gray[(yy - 1) * w + (xx + 1)] +
            -2 * gray[yy * w + (xx - 1)] +
             2 * gray[yy * w + (xx + 1)] +
            -gray[(yy + 1) * w + (xx - 1)] +
             gray[(yy + 1) * w + (xx + 1)];

          const gy =
            -gray[(yy - 1) * w + (xx - 1)] -
             2 * gray[(yy - 1) * w + xx] -
             gray[(yy - 1) * w + (xx + 1)] +
             gray[(yy + 1) * w + (xx - 1)] +
             2 * gray[(yy + 1) * w + xx] +
             gray[(yy + 1) * w + (xx + 1)];

          const magnitude = Math.sqrt(gx * gx + gy * gy);
          const isEdge = magnitude > t;

          const color = inverted
            ? (isEdge ? 255 : 20)
            : (isEdge ? 20 : 255);

          const o = idx * 4;
          out[o] = color;
          out[o + 1] = color;
          out[o + 2] = color;
          out[o + 3] = 255;
        }
      }

      resultCanvas.width = Math.max(240, w);
      resultCanvas.height = Math.max(180, h);

      resultCtx.fillStyle = inverted ? "#141414" : "#ffffff";
      resultCtx.fillRect(0, 0, resultCanvas.width, resultCanvas.height);

      const tempCanvas = document.createElement("canvas");
      tempCanvas.width = w;
      tempCanvas.height = h;
      tempCanvas.getContext("2d").putImageData(output, 0, 0);

      resultCtx.imageSmoothingEnabled = false;
      resultCtx.drawImage(tempCanvas, 0, 0, resultCanvas.width, resultCanvas.height);

      resultTip.style.display = "none";
      downloadBtn.href = resultCanvas.toDataURL("image/png");
    }

    generateBtn.addEventListener("click", generateSketch);

    threshold.addEventListener("input", () => {
      thresholdValue.textContent = threshold.value;
    });

    invertMode.addEventListener("change", () => {
      if (hasImage && resultTip.style.display === "none") {
        generateSketch();
      }
    });

    clearBtn.addEventListener("click", () => {
      img = new Image();
      imageInput.value = "";
      resetCanvas();
    });

    resetCanvas();
  </script>
</body>
</html>
