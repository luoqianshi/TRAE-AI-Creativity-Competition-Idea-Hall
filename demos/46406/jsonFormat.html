<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化工具</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234285f4'/%3E%3Ctext x='16' y='25' font-family='Arial,sans-serif' font-weight='900' font-size='26' fill='%23fff' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #e8eaed;
    display: flex; flex-direction: column;
  }

  /* ====== Top Bar ====== */
  .app-bar {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    height: 38px;
    background: linear-gradient(#fff, #f5f5f5);
    border-bottom: 1px solid #c4c9d2;
    user-select: none;
    font-size: 15px; font-weight: 600; color: #333;
  }

  /* ====== Container: 3 panels side-by-side, always ====== */
  .container {
    flex: 1; display: flex; overflow: hidden;
  }

  /* ====== Panel ====== */
  .panel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; overflow: hidden;
    border-right: 1px solid #c4c9d2;
  }
  .panel:last-child { border-right: none; }

  /* ====== Header ====== */
  .header {
    flex-shrink: 0;
    background: #4285f4; color: #fff;
    padding: 6px 10px;
    display: flex; align-items: center; justify-content: space-between;
    user-select: none;
  }
  .header-left { display: flex; align-items: center; gap: 7px; }
  .header-icons { display: flex; gap: 10px; align-items: center; }
  .header-icon { cursor: pointer; opacity: .82; transition: opacity .15s; font-size: 13px; }
  .header-icon:hover { opacity: 1; }
  .header-title { font-size: 13px; letter-spacing: .3px; opacity: .95; }

  /* ====== Toolbar ====== */
  .toolbar {
    flex-shrink: 0;
    background: #f8f9fa;
    border-bottom: 1px solid #e0e0e0;
    padding: 5px 10px; display: flex; gap: 6px; flex-wrap: wrap;
  }
  .btn {
    padding: 3px 11px; border: 1px solid #ccc; border-radius: 3px;
    background: #fff; font-size: 12px; cursor: pointer; color: #333;
    transition: background .12s, border-color .12s; white-space: nowrap;
  }
  .btn:hover { background: #f0f0f0; border-color: #999; }
  .btn:active { background: #e0e0e0; }
  .btn-primary { background: #4285f4; color: #fff; border-color: #4285f4; }
  .btn-primary:hover { background: #3367d6; border-color: #3367d6; }
  .btn-success { background: #34a853; color: #fff; border-color: #34a853; }
  .btn-success:hover { background: #2d9249; border-color: #2d9249; }
  .btn-copy { background: #fbbc04; color: #222; border-color: #fbbc04; }
  .btn-copy:hover { background: #e0aa00; border-color: #e0aa00; }
  .btn-clear { background: #ea4335; color: #fff; border-color: #ea4335; }
  .btn-clear:hover { background: #d33426; border-color: #d33426; }

  /* ====== Editor area ====== */
  .editor-outer {
    flex: 1; display: flex; overflow: hidden; position: relative;
    min-height: 0;
  }
  .line-numbers {
    width: 44px; background: #f5f5f5;
    border-right: 1px solid #e0e0e0;
    padding: 10px 4px 10px 0;
    font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.65;
    color: #888; text-align: right;
    user-select: none; overflow: hidden; flex-shrink: 0;
    z-index: 2; position: relative;
    white-space: pre;
  }
  .line-numbers .ln-item { display: block; }
  .line-numbers .ln-err { color: #d32f2f; font-weight: 700; }

  .edit-area { flex: 1; position: relative; overflow: hidden; }

  /* Highlight layer (behind) */
  .hl-layer {
    position: absolute; inset: 0;
    padding: 10px 12px;
    font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-all;
    color: #24292e;
    overflow-y: auto; overflow-x: hidden;
    pointer-events: none; z-index: 0;
  }
  .hl-layer .err-line {
    text-decoration: wavy underline #d32f2f;
    text-decoration-skip-ink: none;
    background: rgba(211, 47, 47, .055);
  }

  /* Textarea (on top, transparent) */
  .edit-area textarea {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    padding: 10px 12px;
    font-family: "Cascadia Code", "Fira Code", Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.65;
    tab-size: 2;
    white-space: pre-wrap; word-break: break-all;
    border: none; outline: none; resize: none;
    background: transparent;
    color: transparent; caret-color: #24292e;
    z-index: 1; cursor: text;
  }
  .edit-area textarea::selection {
    color: #24292e;
    background: rgba(66, 133, 244, .25);
  }

  /* ====== Status bar ====== */
  .statusbar {
    flex-shrink: 0;
    background: #f1f3f4; border-top: 1px solid #ddd;
    padding: 3px 10px; font-size: 11px; color: #666;
    display: flex; justify-content: space-between;
    user-select: none;
  }
  .statusbar .err-msg { color: #d32f2f; font-weight: 600; }

  /* ====== Toast ====== */
  .toast {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #323232; color: #fff;
    padding: 10px 24px; border-radius: 4px;
    font-size: 14px; opacity: 0;
    transition: all .25s ease; z-index: 9999; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #d32f2f; }
</style>
</head>
<body>

<div class="container">
  <!-- Panel 1 -->
  <div class="panel" id="panel1">
    <div class="header">
      <div class="header-left"><span class="header-icon">☰</span><span class="header-icon">✎</span></div>
      <span class="header-title">原始 JSON 输入</span>
      <div class="header-icons"><span class="header-icon" onclick="clearPanel(1)">✖</span></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="doFormat(1)">格式化</button>
      <button class="btn btn-success" onclick="doCompress(1)">压缩</button>
      <button class="btn btn-copy" onclick="copyPanel(1)">📋 复制</button>
      <button class="btn btn-clear" onclick="clearPanel(1)">🗑 清空</button>
    </div>
    <div class="editor-outer">
      <div class="line-numbers" id="ln1">1</div>
      <div class="edit-area">
        <div class="hl-layer" id="hl1"></div>
        <textarea id="ta1" placeholder="在此粘贴或输入 JSON 数据..." spellcheck="false"
          oninput="onEditorInput(1)" onscroll="syncScroll(1)" onkeyup="showCursor(1)" onclick="showCursor(1)"></textarea>
      </div>
    </div>
    <div class="statusbar"><span id="pos1">Ln 1, Col 1</span><span id="len1">0 字符</span></div>
  </div>

  <!-- Panel 2 -->
  <div class="panel" id="panel2">
    <div class="header">
      <div class="header-left"><span class="header-icon">☰</span><span class="header-icon">✎</span></div>
      <span class="header-title">格式化结果</span>
      <div class="header-icons"><span class="header-icon" onclick="clearPanel(2)">✖</span></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="doFormat(2)">格式化</button>
      <button class="btn btn-success" onclick="doCompress(2)">压缩</button>
      <button class="btn btn-copy" onclick="copyPanel(2)">📋 复制</button>
      <button class="btn btn-clear" onclick="clearPanel(2)">🗑 清空</button>
    </div>
    <div class="editor-outer">
      <div class="line-numbers" id="ln2">1</div>
      <div class="edit-area">
        <div class="hl-layer" id="hl2"></div>
        <textarea id="ta2" placeholder="格式化后的 JSON 将显示在此..." spellcheck="false"
          oninput="onEditorInput(2)" onscroll="syncScroll(2)" onkeyup="showCursor(2)" onclick="showCursor(2)"></textarea>
      </div>
    </div>
    <div class="statusbar"><span id="pos2">Ln 1, Col 1</span><span id="len2">0 字符</span></div>
  </div>

  <!-- Panel 3 -->
  <div class="panel" id="panel3">
    <div class="header">
      <div class="header-left"><span class="header-icon">☰</span><span class="header-icon">✎</span></div>
      <span class="header-title">压缩结果</span>
      <div class="header-icons"><span class="header-icon" onclick="clearPanel(3)">✖</span></div>
    </div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="doFormat(3)">格式化</button>
      <button class="btn btn-success" onclick="doCompress(3)">压缩</button>
      <button class="btn btn-copy" onclick="copyPanel(3)">📋 复制</button>
      <button class="btn btn-clear" onclick="clearPanel(3)">🗑 清空</button>
    </div>
    <div class="editor-outer">
      <div class="line-numbers" id="ln3">1</div>
      <div class="edit-area">
        <div class="hl-layer" id="hl3"></div>
        <textarea id="ta3" placeholder="压缩后的 JSON 将显示在此..." spellcheck="false"
          oninput="onEditorInput(3)" onscroll="syncScroll(3)" onkeyup="showCursor(3)" onclick="showCursor(3)"></textarea>
      </div>
    </div>
    <div class="statusbar"><span id="pos3">Ln 1, Col 1</span><span id="len3">0 字符</span></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== State ====== */
var errorLine = [0, 0, 0, 0];

/* ====== HTML Escape ====== */
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ====== JSON Error Line Detection ====== */
function findJsonErrorLine(text) {
  try { JSON.parse(text); return 0; }
  catch(e) {
    var m = e.message.match(/position\s+(\d+)/i);
    if (m) {
      var pos = parseInt(m[1]);
      return (text.substring(0, pos).match(/\n/g) || []).length + 1;
    }
    var m2 = e.message.match(/line\s+(\d+)/i);
    if (m2) return parseInt(m2[1]);
    return 1;
  }
}

/* ====== Error message (Chinese) ====== */
function getJsonErrorMsg(text) {
  try { JSON.parse(text); return ''; }
  catch(e) {
    var msg = e.message;
    msg = msg.replace(/Unexpected token/gi, '意外字符');
    msg = msg.replace(/Unexpected end of JSON/gi, 'JSON 意外结束');
    msg = msg.replace(/Unexpected string/gi, '意外字符串');
    msg = msg.replace(/Unexpected number/gi, '意外数字');
    msg = msg.replace(/position/gi, '位置');
    msg = msg.replace(/at position/gi, '于位置');
    msg = msg.replace(/Expected .*? but found/gi, '期望…但实际为');
    return msg;
  }
}

/* ====== Highlight Update ====== */
function updateHighlight(idx) {
  var ta = document.getElementById('ta' + idx);
  var hl = document.getElementById('hl' + idx);
  var val = ta.value;
  var lines = val.split('\n');
  var errLn = errorLine[idx];
  var html = '';
  for (var i = 0; i < lines.length; i++) {
    var content = lines[i].length === 0 ? ' ' : esc(lines[i]);
    html += (i + 1 === errLn)
      ? '<div class="err-line">' + content + '</div>'
      : '<div>' + content + '</div>';
  }
  hl.innerHTML = html;
  hl.scrollTop = ta.scrollTop;
  hl.scrollLeft = ta.scrollLeft;
}

/* ====== Line Numbers ====== */
function updateLines(idx) {
  var ta = document.getElementById('ta' + idx);
  var ln = document.getElementById('ln' + idx);
  var lineCount = (ta.value.match(/\n/g) || []).length + 1;
  var errLn = errorLine[idx];
  var html = '';
  for (var i = 1; i <= lineCount; i++) {
    html += (i === errLn)
      ? '<div class="ln-item ln-err">' + i + '</div>'
      : '<div class="ln-item">' + i + '</div>';
  }
  ln.innerHTML = html;
}

/* ====== Validate ====== */
var validateTimer = [0, 0, 0, 0];
function validate(idx) {
  var ta = document.getElementById('ta' + idx);
  var val = ta.value.trim();
  var sb = document.getElementById('pos' + idx).parentElement;
  if (!val) {
    errorLine[idx] = 0;
    sb.innerHTML = '<span id="pos' + idx + '">Ln 1, Col 1</span><span id="len' + idx + '">0 字符</span>';
    updateHighlight(idx); updateLines(idx);
    return;
  }
  try {
    JSON.parse(val);
    errorLine[idx] = 0;
    sb.innerHTML = '<span id="pos' + idx + '">' + document.getElementById('pos' + idx).textContent + '</span>'
      + '<span id="len' + idx + '" style="color:#34a853;font-weight:600;">✓ JSON 合法  |  ' + ta.value.length + ' 字符</span>';
  } catch(e) {
    errorLine[idx] = findJsonErrorLine(val);
    sb.innerHTML = '<span id="pos' + idx + '">' + document.getElementById('pos' + idx).textContent + '</span>'
      + '<span id="len' + idx + '" class="err-msg">✗ 行' + errorLine[idx] + '：' + esc(getJsonErrorMsg(val)) + '</span>';
  }
  updateHighlight(idx); updateLines(idx);
}

/* ====== On Input (debounced) ====== */
function onEditorInput(idx) {
  clearTimeout(validateTimer[idx]);
  var ta = document.getElementById('ta' + idx);
  var lines = (ta.value.match(/\n/g) || []).length + 1;
  // immediate line number update (one <div> per line)
  var lnHtml = '';
  for (var i = 1; i <= lines; i++) lnHtml += '<div class="ln-item">' + i + '</div>';
  document.getElementById('ln' + idx).innerHTML = lnHtml;
  // immediate highlight (no error check)
  var hl = document.getElementById('hl' + idx);
  var raw = ta.value.split('\n');
  var htm = '';
  for (var j = 0; j < raw.length; j++) htm += '<div>' + (raw[j].length === 0 ? ' ' : esc(raw[j])) + '</div>';
  hl.innerHTML = htm;
  hl.scrollTop = ta.scrollTop;
  // debounced full validation
  validateTimer[idx] = setTimeout(function(i) { validate(i); }, 280, idx);
  showCursor(idx);
}

/* ====== Scroll Sync ====== */
function syncScroll(idx) {
  var ta = document.getElementById('ta' + idx);
  var hl = document.getElementById('hl' + idx);
  var ln = document.getElementById('ln' + idx);
  hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
  ln.scrollTop = ta.scrollTop;
}

/* ====== Cursor Position ====== */
function showCursor(idx) {
  var ta = document.getElementById('ta' + idx);
  if (!document.getElementById('pos' + idx)) return;
  var pre = ta.value.substring(0, ta.selectionStart);
  var parts = pre.split('\n');
  document.getElementById('pos' + idx).textContent = 'Ln ' + parts.length + ', Col ' + (parts[parts.length - 1].length + 1);
}

/* ====== Core Operations: operate on self only ====== */
function tryParseStr(str) {
  str = str.trim();
  if (!str) throw new Error('内容为空');
  return JSON.parse(str);
}

function doFormat(idx) {
  var ta = document.getElementById('ta' + idx);
  try {
    ta.value = JSON.stringify(tryParseStr(ta.value), null, 2);
    onEditorInput(idx); toast('格式化成功');
  } catch(e) { toast('JSON 解析失败：' + e.message, true); }
}

function doCompress(idx) {
  var ta = document.getElementById('ta' + idx);
  try {
    ta.value = JSON.stringify(tryParseStr(ta.value));
    onEditorInput(idx); toast('压缩成功');
  } catch(e) { toast('JSON 解析失败：' + e.message, true); }
}

/* ====== 清空 + Ctrl+Z 一次性还原 ====== */
var clearedSnapshot = {}; // 记录每个面板被清空前的内容，用于 Ctrl+Z 还原（仅一次）

function clearPanel(idx) {
  var ta = document.getElementById('ta' + idx);
  if (!ta.value) return;            // 已是空内容，无需操作
  clearedSnapshot[idx] = ta.value;  // 保存快照，供 Ctrl+Z 还原
  ta.value = '';
  onEditorInput(idx);
}

/* 监听 Ctrl+Z / Cmd+Z：在对应面板有清空快照时一次性还原 */
document.addEventListener('keydown', function(e) {
  var isUndo = (e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z');
  if (!isUndo) return;
  var ae = document.activeElement;
  if (!ae || ae.tagName !== 'TEXTAREA') return;
  // 定位当前聚焦的 textarea 属于哪个面板
  var idx = null;
  for (var i = 1; i <= 3; i++) {
    if (document.getElementById('ta' + i) === ae) { idx = i; break; }
  }
  if (idx === null) return;
  if (clearedSnapshot[idx]) {
    e.preventDefault();              // 阻止浏览器默认撤销，避免冲突
    ae.value = clearedSnapshot[idx]; // 还原清空前内容
    delete clearedSnapshot[idx];     // 删除快照，仅允许还原一次
    onEditorInput(idx);
  }
});

function copyPanel(idx) {
  var ta = document.getElementById('ta' + idx);
  var text = ta.value;
  if (!text) { toast('没有可复制的内容', true); return; }

  // 方案1：优先使用现代 Clipboard API（正常模式）
  if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
    navigator.clipboard.writeText(text).then(function() {
      toast('已复制到剪贴板');
    }).catch(function() {
      // Clipboard API 失败（如隐私模式），降级到 execCommand
      fallbackCopy(text);
    });
  } else {
    // 浏览器不支持 Clipboard API，直接用 fallback
    fallbackCopy(text);
  }
}

/* ====== Fallback: 兼容隐私/无痕模式 ====== */
function fallbackCopy(text) {
  var temp = document.createElement('textarea');
  temp.value = text;
  temp.style.position = 'fixed';
  temp.style.left = '-9999px';
  temp.style.top = '-9999px';
  temp.style.opacity = '0';
  document.body.appendChild(temp);
  temp.focus();
  temp.select();
  temp.setSelectionRange(0, text.length); // 兼容 iOS
  try {
    var ok = document.execCommand('copy');
    document.body.removeChild(temp);
    if (ok) {
      toast('已复制到剪贴板');
    } else {
      toast('复制失败，请手动选择复制', true);
    }
  } catch (e) {
    document.body.removeChild(temp);
    toast('复制失败：' + e.message, true);
  }
}

/* ====== Toast ====== */
function toast(msg, err) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (err ? ' err' : '');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.className = 'toast'; t.classList.remove('show'); }, 2000);
}

/* ====== Tab key support ====== */
document.querySelectorAll('textarea').forEach(function(ta) {
  ta.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = this.selectionStart, en = this.selectionEnd;
      this.value = this.value.substring(0, s) + '  ' + this.value.substring(en);
      this.selectionStart = this.selectionEnd = s + 2;
      onEditorInput(parseInt(this.id.replace('ta','')));
    }
  });
});

/* ====== Init ====== */
for (var i = 1; i <= 3; i++) onEditorInput(i);
</script>
</body>
</html>
