<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山河有故事 - Story of China</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/dist/echarts.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

        :root {
            --primary: #C0392B;
            --primary-light: #E74C3C;
            --primary-dark: #922B21;
            --gold: #D4AF37;
            --gold-light: #F4D03F;
            --bg: #FDFBF7;
            --bg-card: #FFFFFF;
            --text: #2C3E50;
            --text-light: #5D6D7E;
            --border: #E8E4DC;
            --shadow: 0 4px 20px rgba(192, 57, 43, 0.1);
            --shadow-hover: 0 8px 30px rgba(192, 57, 43, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Noto Serif SC', serif;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 2rem 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
        }

        .header-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .map-section {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .map-container {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            overflow: hidden;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: 500;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(192, 57, 43, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--gold);
            color: #333;
        }

        .btn-secondary:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }

        .search-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-input {
            flex: 1;
            padding: 0.7rem 1.2rem;
            border: 2px solid var(--border);
            border-radius: 25px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
        }

        .category-section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--gold);
            border-radius: 2px;
        }

        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .category-tag {
            padding: 0.5rem 1.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .category-tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(192, 57, 43, 0.05);
        }

        .category-tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .hot-cities {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .city-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .city-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
            border-color: var(--gold);
        }

        .city-card h3 {
            color: var(--primary);
            margin-bottom: 0.3rem;
            font-size: 1.1rem;
        }

        .city-card .english {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .city-card .slogan {
            font-size: 0.85rem;
            color: var(--text);
            font-style: italic;
            font-family: 'Noto Serif SC', serif;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 16px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9) translateY(20px);
            transition: all 0.3s ease;
            position: relative;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(192, 57, 43, 0.1);
            color: var(--primary);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--primary);
            color: white;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .modal-header h2 {
            font-size: 2rem;
            margin-bottom: 0.3rem;
        }

        .modal-header .english {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .modal-header .slogan {
            font-size: 1rem;
            font-style: italic;
            font-family: 'Noto Serif SC', serif;
            opacity: 0.9;
        }

        .modal-body {
            padding: 2rem;
        }

        .modal-section {
            margin-bottom: 2rem;
        }

        .modal-section-title {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .story-content {
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text);
            text-align: justify;
        }

        .people-list, .culture-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .people-item, .culture-item {
            padding: 0.5rem 1.2rem;
            background: rgba(192, 57, 43, 0.05);
            border-radius: 20px;
            color: var(--primary);
            font-weight: 500;
        }

        .spots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .spot-card {
            background: var(--bg);
            border-radius: 8px;
            overflow: hidden;
        }

        .spot-image {
            width: 100%;
            height: 100px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
        }

        .spot-info {
            padding: 0.8rem;
        }

        .spot-info h4 {
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
        }

        .spot-info .desc {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .quote-section {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(192, 57, 43, 0.05) 100%);
            padding: 1.5rem;
            border-radius: 12px;
            border-left: 4px solid var(--gold);
        }

        .quote-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            color: var(--text);
            font-style: italic;
            line-height: 1.8;
        }

        .season-badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: var(--gold);
            color: #333;
            border-radius: 20px;
            font-weight: 600;
        }

        .footer {
            background: var(--text);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }

        .footer p {
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .map-container {
                height: 400px;
            }
            
            .hot-cities {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .modal {
                margin: 0.5rem;
                border-radius: 12px;
            }
            
            .modal-header {
                padding: 1.5rem;
            }
            
            .modal-body {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>山河有故事</h1>
            <p class="header-subtitle">点击一座城市，发现一段中国故事</p>
        </div>
    </header>

    <main class="main-container">
        <div class="search-bar">
            <input type="text" class="search-input" placeholder="搜索城市名称或拼音..." id="searchInput">
            <button class="btn btn-primary" onclick="handleSearch()">搜索</button>
        </div>

        <div class="category-section">
            <h3 class="section-title">分类浏览</h3>
            <div class="category-tags" id="categoryTags">
                <span class="category-tag active" onclick="filterByCategory('all')">全部</span>
                <span class="category-tag" onclick="filterByCategory('古都')">古都</span>
                <span class="category-tag" onclick="filterByCategory('三国')">三国</span>
                <span class="category-tag" onclick="filterByCategory('丝绸之路')">丝绸之路</span>
                <span class="category-tag" onclick="filterByCategory('世界遗产')">世界遗产</span>
                <span class="category-tag" onclick="filterByCategory('江南文化')">江南文化</span>
                <span class="category-tag" onclick="filterByCategory('红色文化')">红色文化</span>
                <span class="category-tag" onclick="filterByCategory('茶文化')">茶文化</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-outline" onclick="resetView()">重置视图</button>
            <button class="btn btn-secondary" onclick="randomCity()">随机探索</button>
        </div>

        <div class="map-section">
            <div class="map-container" id="map"></div>
        </div>

        <div class="hot-cities-section">
            <h3 class="section-title">热门城市</h3>
            <div class="hot-cities" id="hotCities">
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>山河有故事 - Story of China | AI驱动的中国城市文化地图探索应用</p>
    </footer>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-header" id="modalHeader">
                <h2 id="modalCityName">城市名称</h2>
                <p class="english" id="modalEnglish">English Name</p>
                <p class="slogan" id="modalSlogan">城市标语</p>
            </div>
            <div class="modal-body" id="modalBody">
            </div>
        </div>
    </div>

    <script>
        const cityData = {

                    { name: "天坛", image: "⛩️", desc: "明清两代皇帝祭天祈谷的场所" }

            "xian": {

                english: "Xi'an",
                slogan: "十三朝古都，千年长安梦。",
                story: "西安，古称长安，是中华文明的重要发祥地。这座城市见证了周、秦、汉、唐等十三个王朝的兴衰，是中国历史上建都朝代最多、建都时间最长的城市。秦始皇兵马俑的发现震惊世界，让人们得以窥见两千多年前的大秦雄风；大雁塔下，玄奘法师的身影仿佛仍在诵读佛经；明城墙的每一块砖，都铭刻着岁月的痕迹。西安，这座古老而又年轻的城市，正以崭新的姿态迎接世界的目光。",

                spots: [

                spots: [

                    { name: "陆家嘴", image: "🏢", desc: "金融中心" },
                    { name: "豫园", image: "🏯", desc: "江南古典园林" },

        const cityGeoMap = {
            "北京": [116.46, 39.92],
            "西安": [108.95, 34.27],
            "杭州": [120.19, 30.26],
            "苏州": [120.62, 31.32],
            "成都": [104.06, 30.57],
            "洛阳": [112.45, 34.62],
            "南京": [118.78, 32.04],
            "敦煌": [94.67, 40.14],
            "青岛": [120.33, 36.07],
            "桂林": [110.29, 25.27],
            "重庆": [106.54, 29.59],
            "上海": [121.48, 31.22]
        };

        let chart;
        let currentCategory = 'all';

        function initMap() {
            chart = echarts.init(document.getElementById('map'));
            
            const mapData = Object.keys(cityData).map(key => {
                const city = cityData[key];
                return {
                    name: city.name,
                    value: city.people.length + city.culture.length + city.spots.length,
                    itemStyle: {
                        color: '#C0392B'
                    }
                };
            });

            const option = {
                backgroundColor: '#FDFBF7',
                title: {
                    text: '中国城市文化地图',
                    subtext: '点击城市查看详情',
                    left: 'center',
                    top: 10,
                    textStyle: {
                        color: '#C0392B',
                        fontFamily: 'Noto Serif SC',
                        fontSize: 18
                    },
                    subtextStyle: {
                        color: '#5D6D7E',
                        fontSize: 12
                    }
                },
                tooltip: {
                    trigger: 'item',
                    formatter: function(params) {
                        if (params.name && cityData[getCityKeyByName(params.name)]) {
                            const city = cityData[getCityKeyByName(params.name)];
                            return `<div style="font-weight:bold;color:#C0392B;">${city.name}</div>
                                    <div style="font-size:12px;color:#5D6D7E;">${city.english}</div>
                                    <div style="font-size:12px;font-style:italic;margin-top:4px;">${city.slogan}</div>`;
                        }
                        return params.name;
                    }
                },
                visualMap: {
                    show: false,
                    min: 0,
                    max: 20,
                    left: 'left',
                    top: 'bottom',
                    text: ['高', '低'],
                    inRange: {
                        color: ['#FADBD8', '#C0392B']
                    }
                },
                series: [
                    {
                        name: '城市文化',
                        type: 'map',
                        mapType: 'china',
                        roam: true,
                        zoom: 1.2,
                        center: [104.114129, 37.550339],
                        itemStyle: {
                            areaColor: '#E8E4DC',
                            borderColor: '#D4AF37',
                            borderWidth: 1
                        },
                        emphasis: {
                            itemStyle: {
                                areaColor: '#FADBD8',
                                borderColor: '#C0392B',
                                borderWidth: 2
                            }
                        },
                        data: mapData,
                        markPoint: {
                            symbol: 'pin',
                            symbolSize: 50,
                            label: {
                                show: true,
                                formatter: '{b}',
                                color: '#C0392B',
                                fontSize: 11,
                                fontWeight: 'bold'
                            },
                            itemStyle: {
                                color: '#D4AF37',
                                borderColor: '#fff',
                                borderWidth: 2
                            },
                            data: Object.keys(cityGeoMap).map(cityName => ({
                                name: cityName,
                                coord: cityGeoMap[cityName]
                            }))
                        }
                    }
                ]
            };

            chart.setOption(option);

            chart.on('click', function(params) {
                if (params.name && cityData[getCityKeyByName(params.name)]) {
                    showCityDetail(getCityKeyByName(params.name));
                }
            });

            window.addEventListener('resize', function() {
                chart.resize();
            });
        }

        function getCityKeyByName(name) {
            return Object.keys(cityData).find(key => cityData[key].name === name);
        }

        function showCityDetail(cityId) {
            const city = cityData[cityId];
            if (!city) return;

            document.getElementById('modalCityName').textContent = city.name;
            document.getElementById('modalEnglish').textContent = city.english;
            document.getElementById('modalSlogan').textContent = city.slogan;

            const bodyContent = `
                <div class="modal-section">
                    <h4 class="modal-section-title">城市故事</h4>
                    <p class="story-content">${city.story}</p>
                </div>
                
                <div class="modal-section">
                    <h4 class="modal-section-title">历史人物</h4>
                    <div class="people-list">
                        ${city.people.map(p => `<span class="people-item">${p}</span>`).join('')}
                    </div>
                </div>
                
                <div class="modal-section">
                    <h4 class="modal-section-title">文化特色</h4>
                    <div class="culture-list">
                        ${city.culture.map(c => `<span class="culture-item">${c}</span>`).join('')}
                    </div>
                </div>
                
                <div class="modal-section">
                    <h4 class="modal-section-title">代表景点</h4>
                    <div class="spots-grid">
                        ${city.spots.map(s => `
                            <div class="spot-card">
                                <div class="spot-image">${s.image}</div>
                                <div class="spot-info">
                                    <h4>${s.name}</h4>
                                    <p class="desc">${s.desc}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                <div class="modal-section">
                    <h4 class="modal-section-title">推荐旅游季节</h4>
                    <span class="season-badge">${city.season}</span>
                </div>
                
                <div class="modal-section">
                    <h4 class="modal-section-title">AI金句</h4>
                    <div class="quote-section">
                        <p class="quote-text">${city.quote}</p>
                    </div>
                </div>
            `;

            document.getElementById('modalBody').innerHTML = bodyContent;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function initHotCities() {
            const hotCitiesContainer = document.getElementById('hotCities');
            const hotCitiesList = ['beijing', 'xian', 'hangzhou', 'suzhou', 'chengdu', 'shanghai'];
            
            hotCitiesContainer.innerHTML = hotCitiesList.map(id => {
                const city = cityData[id];
                return `
                    <div class="city-card" onclick="showCityDetail('${id}')">
                        <h3>${city.name}</h3>
                        <p class="english">${city.english}</p>
                        <p class="slogan">${city.slogan}</p>
                    </div>
                `;
            }).join('');
        }

        function filterByCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.category-tag').forEach(tag => {
                tag.classList.remove('active');
            });
            event.target.classList.add('active');

            if (category === 'all') {
                resetView();
                return;
            }

            const filteredCities = Object.keys(cityData).filter(key => 
                cityData[key].category.includes(category)
            );

            const markPointData = filteredCities.map(key => {
                const city = cityData[key];
                return {
                    name: city.name,
                    coord: cityGeoMap[city.name]
                };
            });

            chart.setOption({
                series: [{
                    markPoint: {
                        data: markPointData
                    }
                }]
            });
        }

        function handleSearch() {
            const input = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!input) return;

            const foundKey = Object.keys(cityData).find(key => 
                cityData[key].name.includes(input) || 
                cityData[key].english.toLowerCase().includes(input)
            );

            if (foundKey) {
                showCityDetail(foundKey);
                document.getElementById('searchInput').value = '';
            } else {
                alert('未找到该城市，请尝试其他名称');
            }
        }

        function resetView() {
            const markPointData = Object.keys(cityGeoMap).map(cityName => ({
                name: cityName,
                coord: cityGeoMap[cityName]
            }));

            chart.setOption({
                series: [{
                    markPoint: {
                        data: markPointData
                    }
                }]
            });

            document.querySelectorAll('.category-tag').forEach(tag => {
                tag.classList.remove('active');
            });
            document.querySelector('.category-tag:first-child').classList.add('active');
            currentCategory = 'all';
        }

        function randomCity() {
            const keys = Object.keys(cityData);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            showCityDetail(randomKey);
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        window.onload = function() {
            initMap();
            initHotCities();
        };
    </script>
</body>
