<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核对系统运维监控平台</title>
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-card: rgba(255,255,255,0.04);
    --glass-bg: rgba(20,20,35,0.55);
    --glass-border: rgba(255,255,255,0.10);
    --glass-border-hover: rgba(255,255,255,0.22);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.3);
    --text-primary: #f0f0f5;
    --text-secondary: #9898a8;
    --text-muted: #5c5c70;
    --accent-green: #30d158;
    --accent-red: #ff453a;
    --accent-yellow: #ffd60a;
    --accent-blue: #0a84ff;
    --accent-purple: #bf5af2;
    --accent-cyan: #64d2ff;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --transition: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Animated background orbs */
  .bg-orbs {
    position: fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  .bg-orbs .orb {
    position: absolute; border-radius:50%; filter:blur(120px); opacity:0.15;
    animation: orbFloat 20s ease-in-out infinite;
  }
  .bg-orbs .orb:nth-child(1) {
    width:600px; height:600px;
    background: radial-gradient(circle, #0a84ff, transparent);
    top:-200px; left:-100px;
    animation-delay:0s;
  }
  .bg-orbs .orb:nth-child(2) {
    width:500px; height:500px;
    background: radial-gradient(circle, #bf5af2, transparent);
    bottom:-150px; right:-80px;
    animation-delay:-7s;
  }
  .bg-orbs .orb:nth-child(3) {
    width:400px; height:400px;
    background: radial-gradient(circle, #30d158, transparent);
    top:50%; left:50%;
    animation-delay:-14s;
  }
  @keyframes orbFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(60px,-40px) scale(1.1); }
    66% { transform: translate(-30px,30px) scale(0.9); }
  }

  /* Main container */
  .app {
    position: relative; z-index:1;
    max-width: 1440px; margin:0 auto; padding: 20px 28px 40px;
  }

  /* --- Header --- */
  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 24px; margin-bottom:24px;
    background: var(--glass-bg);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--glass-shadow);
  }
  .header-left { display:flex; align-items:center; gap:12px; }
  .logo-icon {
    width:36px; height:36px; border-radius:10px;
    background: linear-gradient(135deg, #0a84ff, #bf5af2);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:#fff;
  }
  .header h1 { font-size:18px; font-weight:600; letter-spacing:-0.3px; }
  .header .subtitle { font-size:12px; color:var(--text-secondary); margin-left:4px; }
  .header-right { display:flex; align-items:center; gap:16px; }
  .status-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent-green); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .header-time { font-size:13px; color:var(--text-secondary); }
  .header-user {
    padding:6px 14px; border-radius:20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-border);
    font-size:13px; cursor:pointer;
    transition: var(--transition);
  }
  .header-user:hover { background:rgba(255,255,255,0.1); }

  /* --- Stat Cards Row --- */
  .stat-cards {
    display:grid; grid-template-columns: repeat(4, 1fr); gap:16px; margin-bottom:20px;
  }
  .stat-card {
    background: var(--glass-bg);
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    box-shadow: var(--glass-shadow);
    transition: var(--transition);
    cursor: default;
    position:relative; overflow:hidden;
  }
  .stat-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  }
  .stat-card:hover {
    transform: translateY(-2px);
    border-color: var(--glass-border-hover);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .stat-card .stat-label { font-size:12px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px; }
  .stat-card .stat-value { font-size:36px; font-weight:700; letter-spacing:-1px; line-height:1; }
  .stat-card .stat-sub { font-size:12px; color:var(--text-muted); margin-top:6px; }
  .stat-card.green .stat-value { color:var(--accent-green); }
  .stat-card.blue .stat-value { color:var(--accent-blue); }
  .stat-card.purple .stat-value { color:var(--accent-purple); }
  .stat-card.red .stat-value { color:var(--accent-red); }
  .stat-icon {
    position:absolute; right:18px; top:18px;
    width:40px; height:40px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; opacity:0.7;
  }

  /* --- Main Grid --- */
  .main-grid {
    display:grid;
    grid-template-columns: 1.4fr 1fr;
    grid-template-rows: auto auto;
    gap:16px; margin-bottom:20px;
  }

  /* --- Glass Panel --- */
  .panel {
    background: var(--glass-bg);
    backdrop-filter: blur(30px) saturate(160%);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--glass-shadow);
    overflow:hidden;
  }
  .panel-header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    font-size:13px; font-weight:600; letter-spacing:-0.2px;
  }
  .panel-body { padding:16px 20px; }

  /* Tabs */
  .tabs {
    display:flex; gap:2px; flex-wrap:wrap;
    padding: 4px;
    background: rgba(255,255,255,0.03);
    border-radius: var(--radius-sm);
  }
  .tab {
    padding: 5px 12px; border-radius:8px; font-size:11px;
    cursor:pointer; color:var(--text-secondary);
    transition: var(--transition); white-space:nowrap;
    border: 1px solid transparent;
  }
  .tab:hover { color:var(--text-primary); background:rgba(255,255,255,0.05); }
  .tab.active {
    color:var(--text-primary); background:rgba(255,255,255,0.1);
    border-color: var(--glass-border);
  }

  /* Endpoint cards grid */
  .endpoint-grid {
    display:grid; grid-template-columns: repeat(auto-fill, minmax(165px,1fr));
    gap:8px; max-height:400px; overflow-y:auto;
    padding-right:4px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.08) transparent;
  }
  .endpoint-grid::-webkit-scrollbar { width:4px; }
  .endpoint-grid::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:2px; }
  .endpoint-grid::-webkit-scrollbar-track { background:transparent; }

  .ep-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    transition: var(--transition);
    cursor: pointer;
    position:relative;
  }
  .ep-card:hover {
    background: rgba(255,255,255,0.06);
    border-color: var(--glass-border-hover);
  }
  .ep-card .ep-name { font-size:11px; font-weight:500; color:var(--text-primary); margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ep-card .ep-path { font-size:10px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
  .ep-card .ep-meta { display:flex; align-items:center; justify-content:space-between; }
  .ep-card .ep-time { font-size:10px; color:var(--text-muted); }
  .ep-badge {
    display:inline-block; width:7px; height:7px; border-radius:50%;
  }
  .ep-badge.up { background:var(--accent-green); box-shadow:0 0 6px rgba(48,209,88,0.6); }
  .ep-badge.down { background:var(--accent-red); box-shadow:0 0 6px rgba(255,69,58,0.6); animation: blink 1s ease-in-out infinite; }
  .ep-badge.degraded { background:var(--accent-yellow); box-shadow:0 0 6px rgba(255,214,10,0.6); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Domain health area */
  .domain-row {
    display:flex; flex-direction:column; gap:14px;
  }
  .domain-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-md);
    padding: 16px;
    transition: var(--transition);
  }
  .domain-card:hover { border-color:var(--glass-border-hover); }
  .domain-card .domain-name {
    font-size:14px; font-weight:600; margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }
  .metric-row {
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
  }
  .metric {
    display:flex; flex-direction:column; gap:2px;
  }
  .metric .metric-label { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
  .metric .metric-value { font-size:15px; font-weight:600; }
  .metric .metric-value.warn { color:var(--accent-yellow); }
  .progress-bar {
    width:100%; height:4px; background:rgba(255,255,255,0.06); border-radius:2px;
    margin-top:4px; overflow:hidden;
  }
  .progress-bar .fill {
    height:100%; border-radius:2px; transition:width 0.8s ease;
  }
  .progress-bar .fill.green { background:var(--accent-green); }
  .progress-bar .fill.yellow { background:var(--accent-yellow); }
  .progress-bar .fill.red { background:var(--accent-red); }

  /* Bottom row */
  .bottom-grid {
    display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;
  }

  /* Status list */
  .status-list { display:flex; flex-direction:column; gap:8px; }
  .status-item {
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: var(--radius-sm);
    transition: var(--transition);
  }
  .status-item:hover { background:rgba(255,255,255,0.05); }
  .status-item .si-left { display:flex; align-items:center; gap:10px; }
  .status-item .si-name { font-size:13px; font-weight:500; }
  .status-item .si-meta { font-size:11px; color:var(--text-muted); }
  .status-item .si-right { text-align:right; }
  .status-item .si-value { font-size:14px; font-weight:600; }

  /* Trend chart area */
  .chart-area { width:100%; margin-bottom:20px; }
  .chart-area canvas { width:100%; height:220px; border-radius:var(--radius-sm); }

  /* Operation buttons */
  .ops-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .btn {
    padding: 8px 18px; border-radius:20px; font-size:12px; font-weight:500;
    cursor:pointer; border:1px solid var(--glass-border);
    background: rgba(255,255,255,0.05);
    color:var(--text-primary);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: var(--transition);
    letter-spacing:-0.1px;
    display:flex; align-items:center; gap:6px;
  }
  .btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--glass-border-hover);
    transform: translateY(-1px);
  }
  .btn.danger {
    border-color: rgba(255,69,58,0.3);
    color: var(--accent-red);
  }
  .btn.danger:hover {
    background: rgba(255,69,58,0.12);
    border-color: rgba(255,69,58,0.5);
  }
  .btn.primary {
    background: rgba(10,132,255,0.15);
    border-color: rgba(10,132,255,0.3);
    color: var(--accent-blue);
  }
  .btn.primary:hover {
    background: rgba(10,132,255,0.25);
    border-color: rgba(10,132,255,0.5);
  }

  /* Alerts */
  .alert-list { display:flex; flex-direction:column; gap:6px; }
  .alert-item {
    display:flex; align-items:center; gap:10px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.05);
    background: rgba(255,255,255,0.02);
    transition: var(--transition);
  }
  .alert-item:hover { background:rgba(255,255,255,0.05); }
  .alert-item.critical { border-left:3px solid var(--accent-red); }
  .alert-item.warning { border-left:3px solid var(--accent-yellow); }
  .alert-severity {
    font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px;
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .alert-severity.critical { background:rgba(255,69,58,0.2); color:var(--accent-red); }
  .alert-severity.warning { background:rgba(255,214,10,0.2); color:var(--accent-yellow); }
  .alert-text { flex:1; font-size:12px; }
  .alert-time { font-size:10px; color:var(--text-muted); }
  .btn-ack {
    font-size:10px; padding:4px 10px; border-radius:12px; cursor:pointer;
    border:1px solid rgba(255,255,255,0.1); background:transparent;
    color:var(--text-secondary); transition:var(--transition);
  }
  .btn-ack:hover { background:rgba(255,255,255,0.08); color:var(--text-primary); }

  /* Refresh indicator */
  .refresh-indicator { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); }
  .refresh-dot { width:5px; height:5px; border-radius:50%; background:var(--accent-blue); }

  /* Responsive */
  @media (max-width:1100px) {
    .stat-cards { grid-template-columns: repeat(2, 1fr); }
    .main-grid { grid-template-columns: 1fr; }
    .bottom-grid { grid-template-columns: 1fr; }
  }
  @media (max-width:640px) {
    .stat-cards { grid-template-columns: 1fr; }
    .app { padding:10px; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo-icon">◈</div>
      <div>
        <h1>核对系统运维监控<span class="subtitle">· MonitorLite</span></h1>
      </div>
    </div>
    <div class="header-right">
      <div class="refresh-indicator"><div class="refresh-dot"></div><span id="refreshCountdown">30s后刷新</span></div>
      <div class="status-dot"></div>
      <span style="font-size:13px; color:var(--accent-green);">系统正常</span>
      <span class="header-time" id="headerTime"></span>
      <div class="header-user">👤 admin</div>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="stat-cards">
    <div class="stat-card green">
      <div class="stat-label">接口通过率</div>
      <div class="stat-value" id="passRate">93.8%</div>
      <div class="stat-sub">过去5分钟 · 全量检测</div>
      <div class="stat-icon" style="background:rgba(48,209,88,0.1)">📊</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">接口存活</div>
      <div class="stat-value"><span id="upCount">182</span><span style="font-size:18px;color:var(--text-muted)">/194</span></div>
      <div class="stat-sub"><span style="color:var(--accent-red)" id="downCount">8 故障</span> · <span style="color:var(--accent-yellow)" id="degradedCount">4 降级</span></div>
      <div class="stat-icon" style="background:rgba(10,132,255,0.1)">🔌</div>
    </div>
    <div class="stat-card purple">
      <div class="stat-label">服务域状态</div>
      <div class="stat-value" id="domainStatus">2/2</div>
      <div class="stat-sub">domain1 · domain2 运行中</div>
      <div class="stat-icon" style="background:rgba(191,90,242,0.1)">🖥</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">活跃告警</div>
      <div class="stat-value" id="alertCount">3</div>
      <div class="stat-sub">2 严重 · 1 警告</div>
      <div class="stat-icon" style="background:rgba(255,69,58,0.1)">🔔</div>
    </div>
  </div>

  <!-- Main Grid: Endpoints + Domain Health -->
  <div class="main-grid">
    <!-- Endpoint cards -->
    <div class="panel" style="grid-row:span 2;">
      <div class="panel-header">
        <span>接口状态面板</span>
        <span style="font-size:11px;color:var(--text-muted)" id="lastCheck">上次检测: 10:28:15</span>
      </div>
      <div class="panel-body">
        <div class="tabs" id="moduleTabs">
          <div class="tab active" data-module="all">全部(194)</div>
          <div class="tab" data-module="hdjkgl">核对交换(42)</div>
          <div class="tab" data-module="ywbl">业务办理(35)</div>
          <div class="tab" data-module="kqyhd">跨区域(14)</div>
          <div class="tab" data-module="tjfx">统计分析(19)</div>
          <div class="tab" data-module="jkyj">监控预警(8)</div>
          <div class="tab" data-module="other">其他(76)</div>
        </div>
        <div class="endpoint-grid" id="endpointGrid" style="margin-top:12px;"></div>
      </div>
    </div>

    <!-- Domain Health -->
    <div class="panel">
      <div class="panel-header"><span>服务域健康</span><span style="font-size:10px;color:var(--accent-green)">● 实时</span></div>
      <div class="panel-body">
        <div class="domain-row" id="domainHealth"></div>
      </div>
    </div>

    <!-- Infrastructure -->
    <div class="panel">
      <div class="panel-header"><span>基础设施</span></div>
      <div class="panel-body">
        <div class="status-list" id="infraList"></div>
      </div>
    </div>
  </div>

  <!-- External APIs + Operation buttons -->
  <div class="bottom-grid">
    <div class="panel">
      <div class="panel-header"><span>外部API可达性</span></div>
      <div class="panel-body">
        <div class="status-list" id="extApiList"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><span>运维操作</span></div>
      <div class="panel-body">
        <div class="ops-row">
          <button class="btn danger" onclick="confirmOp('重启 domain1')">⏻ 重启 domain1</button>
          <button class="btn danger" onclick="confirmOp('重启 domain2')">⏻ 重启 domain2</button>
          <button class="btn" onclick="confirmOp('清空domain1连接池')">⟳ 清连接池D1</button>
          <button class="btn" onclick="confirmOp('清空domain2连接池')">⟳ 清连接池D2</button>
        </div>
        <div class="ops-row">
          <button class="btn" onclick="showLogs('domain1')">📋 domain1日志</button>
          <button class="btn" onclick="showLogs('domain2')">📋 domain2日志</button>
          <button class="btn primary" onclick="triggerFullCheck()">⚡ 全量检测</button>
        </div>
        <div id="opResult" style="margin-top:12px;font-size:12px;color:var(--text-secondary);max-height:120px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <!-- Trend Chart -->
  <div class="panel chart-area">
    <div class="panel-header"><span>接口成功率趋势 (近24小时)</span><span style="font-size:11px;color:var(--text-muted)">每5分钟采样</span></div>
    <div class="panel-body">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <!-- Alerts -->
  <div class="panel">
    <div class="panel-header"><span>活跃告警</span><span style="font-size:11px;color:var(--accent-red)">2严重 · 1警告</span></div>
    <div class="panel-body">
      <div class="alert-list" id="alertList"></div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ── Demo Data ──────────────────────────────────
  const modules = ['hdjkgl','hdjkgl','hdjkgl','hdjkgl','hdjkgl','ywbl','ywbl','ywbl','ywbl','kqyhd','kqyhd','tjfx','tjfx','jkyj','jkyj'];
  const paths = [
    '/biz/nu/hdjkgl/s/s/getToken.html',
    '/biz/nu/hdjkgl/s/s/sendInfo.html',
    '/biz/nu/hdjkgl/s/s/checkHYInterface.html',
    '/biz/nu/hdjkgl/s/s/getFangChan.html',
    '/biz/nu/hdjkgl/s/s/getSheBao.html',
    '/biz/nu/ywbl/a/b/list.html',
    '/biz/nu/ywbl/d/a/pushBank.html',
    '/biz/nu/ywbl/d/c/complateHdReport.html',
    '/biz/nu/ywbl/a/c/getFileByPath.html',
    '/biz/nu/kqyhd/sendRequestQry.html',
    '/biz/nu/kqyhd/sendResultDataQry.html',
    '/biz/nu/tjfx/getReport.html',
    '/biz/nu/tjfx/batchCount.html',

  const endpoints = [];

  // Demo infrastructure
  const infra = [
    {name:'KingbaseES (金仓)', type:'DB', host:'10.213.19.144:54321', reachable:true, responseMs:12},
    {name:'Oracle (旧库)', type:'DB', host:'10.213.6.20:1521', reachable:true, responseMs:45},
    {name:'FastDFS Tracker', type:'TCP', host:'10.213.19.143:22122', reachable:true, responseMs:2},
    {name:'SFTP (银行前置机)', type:'SFTP', host:'10.213.19.142:22', reachable:true, responseMs:8},
  ];

  // Demo external APIs
  const extApis = [
    {name:'税务API', url:'15.72.158.72:8081', reachable:true, responseMs:234},
    {name:'社保API', url:'15.72.191.18:8081', reachable:false, responseMs:5000, error:'TIMEOUT'},
    {name:'卫健委API', url:'15.72.191.18:8082', reachable:true, responseMs:189},
    {name:'公安API', url:'15.72.158.72:8081', reachable:true, responseMs:210},
    {name:'房产API', url:'15.72.191.18:8081', reachable:true, responseMs:156},
  ];

  // Demo domains
  const domains = [
    {name:'domain1', port:'8088', running:true, heapUsedMb:1024, heapMaxMb:4096, threads:87, threadPeak:112, gcFgCount:3, gcFgTime:1240},
    {name:'domain2', port:'8089', running:true, heapUsedMb:512, heapMaxMb:2048, threads:42, threadPeak:58, gcFgCount:1, gcFgTime:320},
  ];

  // Demo alerts
  const alerts = [
    {id:1, severity:'CRITICAL', type:'ENDPOINT_DOWN', title:'社保API超时', detail:'15.72.191.18:8081 连续3次连接超时 (>5000ms)', time:'15分钟前', acknowledged:false},
    {id:2, severity:'CRITICAL', type:'ENDPOINT_DOWN', title:'sendInfo接口不可达', detail:'/biz/nu/hdjkgl/s/s/sendInfo.html HTTP 503', time:'22分钟前', acknowledged:false},
    {id:3, severity:'WARNING', type:'HIGH_MEM', title:'domain1堆内存使用率偏高', detail:'当前使用1024MB/4096MB (25%), 线程87/200', time:'8分钟前', acknowledged:false},
  ];

  // ── Render Functions ───────────────────────────
  function renderEndpointGrid(filterModule){
    const grid = document.getElementById('endpointGrid');
    const filtered = filterModule==='all' ? endpoints : endpoints.filter(e=>e.module===filterModule);
    grid.innerHTML = filtered.map(e=>`
      <div class="ep-card" title="${e.path}\n${e.responseMs}ms · ${e.lastCheck}">
        <div class="ep-name">${e.name}</div>
        <div class="ep-path">${e.path.split('/').pop()}</div>
        <div class="ep-meta">
          <span class="ep-time">${e.responseMs}ms</span>
          <span class="ep-badge ${e.status}"></span>
        </div>
      </div>
    `).join('');
    document.getElementById('lastCheck').textContent = '上次检测: '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
  }

  function renderDomainHealth(){
    const container = document.getElementById('domainHealth');
    container.innerHTML = domains.map(d=>{
      const heapPct = Math.round(d.heapUsedMb/d.heapMaxMb*100);
      const heapClass = heapPct>85?'red':heapPct>60?'yellow':'green';
      return `
        <div class="domain-card">
          <div class="domain-name">
            <span class="ep-badge up"></span> ${d.name}
            <span style="font-size:11px;color:var(--text-muted);font-weight:400">:${d.port}</span>
            <span style="font-size:11px;color:var(--accent-green);font-weight:400;margin-left:auto">● RUNNING</span>
          </div>
          <div class="metric-row">
            <div class="metric">
              <span class="metric-label">堆内存</span>
              <span class="metric-value">${d.heapUsedMb}<span style="font-size:11px;color:var(--text-muted)">/${d.heapMaxMb} MB</span></span>
              <div class="progress-bar"><div class="fill ${heapClass}" style="width:${heapPct}%"></div></div>
            </div>
            <div class="metric">
              <span class="metric-label">线程数</span>
              <span class="metric-value">${d.threads}<span style="font-size:11px;color:var(--text-muted)">/峰值${d.threadPeak}</span></span>
            </div>
            <div class="metric">
              <span class="metric-label">Full GC</span>
              <span class="metric-value ${d.gcFgCount>5?'warn':''}">${d.gcFgCount}<span style="font-size:11px;color:var(--text-muted)">次</span></span>
            </div>
            <div class="metric">
              <span class="metric-label">GC耗时</span>
              <span class="metric-value">${(d.gcFgTime/1000).toFixed(1)}<span style="font-size:11px;color:var(--text-muted)">s</span></span>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderInfra(){
    document.getElementById('infraList').innerHTML = infra.map(i=>`
      <div class="status-item">
        <div class="si-left">
          <span class="ep-badge ${i.reachable?'up':'down'}"></span>
          <div>
            <div class="si-name">${i.name}</div>
            <div class="si-meta">${i.host} · ${i.type}</div>
          </div>
        </div>
        <div class="si-right">
          <div class="si-value" style="color:${i.reachable?'var(--accent-green)':'var(--accent-red)'}">${i.reachable?i.responseMs+'ms':'DOWN'}</div>
        </div>
      </div>
    `).join('');
  }

  function renderExtApis(){
    document.getElementById('extApiList').innerHTML = extApis.map(a=>`
      <div class="status-item">
        <div class="si-left">
          <span class="ep-badge ${a.reachable?'up':'down'}"></span>
          <div>
            <div class="si-name">${a.name}</div>
            <div class="si-meta">${a.url}</div>
          </div>
        </div>
        <div class="si-right">
          <div class="si-value" style="color:${a.reachable?'var(--accent-green)':'var(--accent-red)'}">${a.reachable?a.responseMs+'ms':a.error||'DOWN'}</div>
        </div>
      </div>
    `).join('');

  function renderAlerts(){
    document.getElementById('alertList').innerHTML = alerts.map(a=>`
      <div class="alert-item ${a.severity.toLowerCase()}">
        <span class="alert-severity ${a.severity.toLowerCase()}">${a.severity}</span>
        <div class="alert-text">
          <strong>${a.title}</strong>
          <div style="font-size:10px;color:var(--text-muted);margin-top:1px;">${a.detail}</div>
        </div>
        <span class="alert-time">${a.time}</span>
        <button class="btn-ack" onclick="acknowledgeAlert(${a.id})">确认</button>
      </div>
    `).join('');
  }

  // ── Canvas Chart ────────────────────────────────
  function drawTrendChart(){
    const canvas = document.getElementById('trendChart');
    const dpr = window.devicePixelRatio||1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = 220 * dpr;
    canvas.style.width = rect.width+'px';
    canvas.style.height = '220px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    const W = rect.width, H = 220;
    const pad = {top:16, right:20, bottom:32, left:48};
    const pw = W-pad.left-pad.right, ph = H-pad.top-pad.bottom;

    // Generate 24h data (288 points at 5min intervals)
    const points = [];
    for(let i=0;i<288;i++){
      const t = i*5;
      const val = 85+Math.random()*13+(t>200?Math.sin(t/20)*3:0);
      points.push({t, val:Math.min(100,Math.max(70,val))});
    }

    ctx.clearRect(0,0,W,H);

    // Grid lines
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.lineWidth=1;
    for(let i=0;i<=5;i++){
      const y = pad.top + ph*i/5;
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    }

    // Y-axis labels
    ctx.fillStyle='#5c5c70'; ctx.font='10px -apple-system,sans-serif'; ctx.textAlign='right';
    for(let i=0;i<=5;i++){
      const y = pad.top + ph*i/5;
      ctx.fillText(Math.round(100-i*5)+'%', pad.left-6, y+3);
    }

    // X-axis labels
    ctx.textAlign='center';
    for(let h=0;h<=24;h+=4){
      const x = pad.left + pw*h/24;
      ctx.fillText(h+':00', x, H-pad.bottom+14);
    }

    // Gradient fill
    const grad = ctx.createLinearGradient(0,pad.top,0,pad.top+ph);
    grad.addColorStop(0,'rgba(10,132,255,0.25)');
    grad.addColorStop(1,'rgba(10,132,255,0.0)');

    // Draw area
    ctx.beginPath();
    points.forEach((p,i)=>{
      const x = pad.left + pw*i/(points.length-1);
      const y = pad.top + ph*(1-(p.val-70)/30);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.lineTo(pad.left+pw, pad.top+ph);
    ctx.lineTo(pad.left, pad.top+ph);
    ctx.closePath();
    ctx.fillStyle=grad;
    ctx.fill();

    // Draw line
    ctx.beginPath();
    points.forEach((p,i)=>{
      const x = pad.left + pw*i/(points.length-1);
      const y = pad.top + ph*(1-(p.val-70)/30);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle='#0a84ff';
    ctx.lineWidth=2;
    ctx.stroke();

    // Glow effect
    ctx.shadowColor='#0a84ff';
    ctx.shadowBlur=8;
    ctx.strokeStyle='rgba(10,132,255,0.5)';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.shadowBlur=0;

    // Current value dot
    const last = points[points.length-1];
    const lx = pad.left+pw, ly = pad.top+ph*(1-(last.val-70)/30);
    ctx.beginPath(); ctx.arc(lx,ly,4,0,Math.PI*2);
    ctx.fillStyle='#0a84ff'; ctx.fill();
    ctx.beginPath(); ctx.arc(lx,ly,10,0,Math.PI*2);
    ctx.fillStyle='rgba(10,132,255,0.2)'; ctx.fill();
  }

  // ── Interactions ───────────────────────────────
  window.confirmOp = function(name){
    document.getElementById('opResult').innerHTML =
      `<div style="color:var(--accent-yellow)">⚠ 确认执行: ${name}?</div>
       <div style="margin-top:8px;display:flex;gap:8px;">
         <button class="btn danger" onclick="executeOp('${name}')" style="font-size:10px;padding:4px 12px;">确认执行</button>
         <button class="btn" onclick="document.getElementById('opResult').innerHTML=''" style="font-size:10px;padding:4px 12px;">取消</button>
       </div>`;
  };

  window.executeOp = function(name){
    const resultDiv = document.getElementById('opResult');
    resultDiv.innerHTML = `<div style="color:var(--accent-blue)">⟳ 正在执行: ${name}...</div>`;
    setTimeout(()=>{
      resultDiv.innerHTML = `
        <div style="color:var(--accent-green)">✓ ${name} — 执行成功</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:4px;">
          [${new Date().toLocaleTimeString('zh-CN')}] admin 执行了 ${name}
        </div>`;
    }, 1500+Math.random()*1500);
  };

  window.showLogs = function(domain){
    const resultDiv = document.getElementById('opResult');
    const lines = [
      '[2026-07-03T10:28:01.234+0800] [INFO] [http-listener-1] GET /biz/nu/hdjkgl/s/s/getToken.html 200 45ms',
      '[2026-07-03T10:28:05.567+0800] [INFO] [http-listener-2] POST /biz/nu/ywbl/d/a/pushBank.html 200 230ms',
      '[2026-07-03T10:28:12.890+0800] [WARN] [Quartz-Thread-3] Connection pool usage at 75%',
      '[2026-07-03T10:28:30.123+0800] [INFO] [http-listener-4] GET /biz/nu/kqyhd/sendRequestQry.html 200 15ms',
    ];
    resultDiv.innerHTML = `<div style="color:var(--accent-cyan);font-size:11px;font-family:'SF Mono',monospace;white-space:pre-wrap;">${domain} server.log (最近4行):\n${lines.join('\n')}</div>`;
  };

  window.triggerFullCheck = function(){
    const resultDiv = document.getElementById('opResult');
    resultDiv.innerHTML = `<div style="color:var(--accent-blue)">⚡ 全量检测进行中... 194个端点</div>`;
    setTimeout(()=>{
      document.getElementById('upCount').textContent = Math.floor(180+Math.random()*10);
      document.getElementById('downCount').textContent = Math.floor(Math.random()*8)+3+' 故障';
      document.getElementById('degradedCount').textContent = Math.floor(Math.random()*6)+1+' 降级';
      document.getElementById('passRate').textContent = (90+Math.random()*7).toFixed(1)+'%';
      resultDiv.innerHTML = `<div style="color:var(--accent-green)">✓ 全量检测完成 — 194/194 已检测 (耗时 ${Math.floor(8+Math.random()*12)}秒)</div>`;
      renderEndpointGrid('all');
      updateCountdown();
    }, 2500);
  };

  window.acknowledgeAlert = function(id){
    document.getElementById('alertCount').textContent = Math.max(0,parseInt(document.getElementById('alertCount').textContent)-1);
    const items = document.querySelectorAll('.alert-item');
    items.forEach(el=>{ if(el.querySelector('.alert-severity')) el.style.opacity='0.4'; });
  };

  // ── Tab switching ──────────────────────────────
  document.getElementById('moduleTabs').addEventListener('click', function(e){
    if(!e.target.classList.contains('tab')) return;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    e.target.classList.add('active');
    renderEndpointGrid(e.target.dataset.module);
  });

  // ── Countdown Timer ─────────────────────────────
  let countdown=30;
  function updateCountdown(){
    document.getElementById('refreshCountdown').textContent = countdown+'s后刷新';
  }
  setInterval(()=>{
    countdown--;
    if(countdown<=0) countdown=30;
    updateCountdown();
  },1000);

  // ── Clock ───────────────────────────────────────
  function updateClock(){
    document.getElementById('headerTime').textContent =
      new Date().toLocaleString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  setInterval(updateClock,1000);
  updateClock();

  // ── Init ────────────────────────────────────────
  renderEndpointGrid('all');
  renderDomainHealth();
  renderInfra();
  renderExtApis();
  renderAlerts();
  updateCountdown();

  // Draw chart after layout settles
  setTimeout(drawTrendChart,100);
  window.addEventListener('resize', ()=>{ clearTimeout(window._resizeTimer); window._resizeTimer=setTimeout(drawTrendChart,200); });
})();
</script>
