<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 辩论台 — 让思想交锋触手可及</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Orbitron:wght@400;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* ========== CSS Variables ========== */
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111827;
  --bg-card: rgba(17, 24, 39, 0.85);
  --pro-color: #ef4444;
  --pro-glow: rgba(239, 68, 68, 0.4);
  --pro-bg: rgba(239, 68, 68, 0.08);
  --con-color: #3b82f6;
  --con-glow: rgba(59, 130, 246, 0.4);
  --con-bg: rgba(59, 130, 246, 0.08);
  --accent-gold: #f59e0b;
  --accent-gold-glow: rgba(245, 158, 11, 0.3);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --border-subtle: rgba(148, 163, 184, 0.1);
  --border-active: rgba(245, 158, 11, 0.4);
  --font-display: 'Orbitron', sans-serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --font-fun: 'ZCOOL KuaiLe', cursive;
}

/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== Particle Canvas ========== */
#particle-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ========== App Container ========== */
.app-container {
  position: relative;
  z-index: 1;
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px;
  min-height: 100vh;
}

/* ========== Header ========== */
.app-header {
  text-align: center;
  padding: 40px 0 30px;
  position: relative;
}

.app-header::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
}

.logo-area {
  margin-bottom: 12px;
}

.logo-icon {
  font-size: 48px;
  display: inline-block;
  animation: logoFloat 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px var(--accent-gold-glow));
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}

.app-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 5vw, 48px);
  font-weight: 900;
  background: linear-gradient(135deg, var(--pro-color), var(--accent-gold), var(--con-color));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 3px;
  line-height: 1.2;
}

.app-subtitle {
  font-size: 15px;
  color: var(--text-secondary);
  margin-top: 8px;
  font-weight: 300;
  letter-spacing: 4px;
}

/* ========== Topic Input Section ========== */
.topic-section {
  max-width: 800px;
  margin: 30px auto 40px;
  text-align: center;
}

.topic-label {
  font-size: 13px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 16px;
  font-weight: 500;
}

.topic-input-wrapper {
  position: relative;
  display: flex;
  gap: 12px;
  align-items: center;
}

.topic-input {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: 18px 24px;
  font-size: 16px;
  color: var(--text-primary);
  font-family: var(--font-body);
  outline: none;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
}

.topic-input::placeholder {
  color: var(--text-muted);
  font-style: italic;
}

.topic-input:focus {
  border-color: var(--border-active);
  box-shadow: 0 0 30px var(--accent-gold-glow), inset 0 0 20px rgba(245, 158, 11, 0.05);
}

.btn-start {
  background: linear-gradient(135deg, var(--pro-color), #dc2626);
  color: white;
  border: none;
  border-radius: 16px;
  padding: 18px 32px;
  font-size: 16px;
  font-weight: 700;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.3s ease;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}

.btn-start::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left 0.5s ease;
}

.btn-start:hover::before { left: 100%; }

.btn-start:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(239, 68, 68, 0.4);
}

.btn-start:active { transform: translateY(0); }

.btn-start:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* ========== Quick Topics ========== */
.quick-topics {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-top: 16px;
}

.quick-topic {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 20px;
  padding: 6px 16px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: var(--font-body);
}

.quick-topic:hover {
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  background: rgba(245, 158, 11, 0.08);
}

/* ========== Debate Arena ========== */
.debate-arena {
  display: none;
  margin-top: 20px;
}

.debate-arena.active { display: block; }

/* ========== Debate Header ========== */
.debate-header {
  text-align: center;
  margin-bottom: 30px;
  animation: fadeSlideDown 0.6s ease;
}

@keyframes fadeSlideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

.debate-topic-display {
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.debate-topic-display::before {
  content: '⚔ ';
  color: var(--accent-gold);
}

.debate-topic-display::after {
  content: ' ⚔';
  color: var(--accent-gold);
}

.debate-round-info {
  font-size: 13px;
  color: var(--text-muted);
  font-family: var(--font-display);
  letter-spacing: 2px;
}

/* ========== Scoreboard ========== */
.scoreboard {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  margin-bottom: 30px;
  animation: fadeSlideDown 0.6s ease 0.1s both;
}

.score-side {
  text-align: center;
  min-width: 160px;
}

.score-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 3px;
  font-weight: 700;
  margin-bottom: 8px;
}

.score-label.pro { color: var(--pro-color); }
.score-label.con { color: var(--con-color); }

.score-value {
  font-family: var(--font-display);
  font-size: 48px;
  font-weight: 900;
  line-height: 1;
}

.score-value.pro {
  color: var(--pro-color);
  text-shadow: 0 0 30px var(--pro-glow);
}

.score-value.con {
  color: var(--con-color);
  text-shadow: 0 0 30px var(--con-glow);
}

.score-vs {
  font-family: var(--font-display);
  font-size: 20px;
  color: var(--accent-gold);
  font-weight: 700;
  text-shadow: 0 0 20px var(--accent-gold-glow);
}

/* ========== Opinion Bar ========== */
.opinion-bar-wrapper {
  max-width: 600px;
  margin: 0 auto 30px;
  animation: fadeSlideDown 0.6s ease 0.2s both;
}

.opinion-bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.opinion-bar {
  height: 8px;
  background: var(--con-color);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
}

.opinion-bar-fill {
  height: 100%;
  background: var(--pro-color);
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.opinion-bar-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  background: var(--accent-gold);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent-gold-glow);
}

/* ========== Debate Panels ========== */
.debate-panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 30px;
}

@media (max-width: 768px) {
  .debate-panels {
    grid-template-columns: 1fr;
  }
}

.debate-panel {
  border-radius: 20px;
  padding: 24px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
}

.debate-panel.pro {
  background: var(--pro-bg);
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.debate-panel.con {
  background: var(--con-bg);
  border: 1px solid rgba(59, 130, 246, 0.2);
}

.debate-panel.active-turn {
  box-shadow: 0 0 40px var(--pro-glow);
  border-color: var(--pro-color);
}

.debate-panel.con.active-turn {
  box-shadow: 0 0 40px var(--con-glow);
  border-color: var(--con-color);
}

.panel-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border-subtle);
}

.panel-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 900;
  flex-shrink: 0;
}

.panel-avatar.pro {
  background: linear-gradient(135deg, var(--pro-color), #b91c1c);
  box-shadow: 0 0 20px var(--pro-glow);
}

.panel-avatar.con {
  background: linear-gradient(135deg, var(--con-color), #1d4ed8);
  box-shadow: 0 0 20px var(--con-glow);
}

.panel-info h3 {
  font-size: 16px;
  font-weight: 700;
}

.panel-info h3.pro { color: var(--pro-color); }
.panel-info h3.con { color: var(--con-color); }

.panel-info .stance {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.typing-indicator {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 8px 0;
}

.typing-indicator.visible { display: flex; }

.typing-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: typingBounce 1.4s infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

.pro .typing-dot { background: var(--pro-color); }
.con .typing-dot { background: var(--con-color); }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-8px); opacity: 1; }
}

/* ========== Argument Cards ========== */
.arguments-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 500px;
  overflow-y: auto;
  padding-right: 8px;
}

.arguments-list::-webkit-scrollbar {
  width: 4px;
}

.arguments-list::-webkit-scrollbar-track {
  background: transparent;
}

.arguments-list::-webkit-scrollbar-thumb {
  background: var(--text-muted);
  border-radius: 2px;
}

.argument-card {
  background: rgba(0, 0, 0, 0.3);
  border-radius: 14px;
  padding: 18px;
  animation: argumentAppear 0.5s ease;
  position: relative;
}

@keyframes argumentAppear {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.argument-round {
  font-family: var(--font-display);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.argument-text {
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-primary);
}

.argument-text .highlight {
  font-weight: 700;
}

.pro .argument-text .highlight { color: var(--pro-color); }
.con .argument-text .highlight { color: var(--con-color); }

.argument-meta {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border-subtle);
}

.argument-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-secondary);
}

.argument-strength {
  margin-left: auto;
  font-size: 11px;
  color: var(--accent-gold);
  font-weight: 500;
}

/* ========== Voting Section ========== */
.voting-section {
  text-align: center;
  margin-bottom: 30px;
  animation: fadeSlideDown 0.6s ease 0.3s both;
}

.voting-title {
  font-size: 13px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 16px;
}

.voting-buttons {
  display: flex;
  justify-content: center;
  gap: 20px;
}

.vote-btn {
  border: 2px solid;
  border-radius: 14px;
  padding: 14px 36px;
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-body);
  cursor: pointer;
  transition: all 0.3s ease;
  background: transparent;
  position: relative;
  overflow: hidden;
}

.vote-btn.pro {
  border-color: var(--pro-color);
  color: var(--pro-color);
}

.vote-btn.con {
  border-color: var(--con-color);
  color: var(--con-color);
}

.vote-btn:hover {
  transform: translateY(-3px);
}

.vote-btn.pro:hover {
  background: var(--pro-color);
  color: white;
  box-shadow: 0 8px 30px var(--pro-glow);
}

.vote-btn.con:hover {
  background: var(--con-color);
  color: white;
  box-shadow: 0 8px 30px var(--con-glow);
}

.vote-btn.voted {
  opacity: 0.6;
  pointer-events: none;
}

.vote-btn.voted.selected {
  opacity: 1;
  transform: scale(1.05);
}

.vote-btn.pro.voted.selected {
  background: var(--pro-color);
  color: white;
  box-shadow: 0 0 30px var(--pro-glow);
}

.vote-btn.con.voted.selected {
  background: var(--con-color);
  color: white;
  box-shadow: 0 0 30px var(--con-glow);
}

/* ========== Controls ========== */
.controls-section {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}

.ctrl-btn {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 12px 24px;
  font-size: 14px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: var(--font-body);
  display: flex;
  align-items: center;
  gap: 8px;
}

.ctrl-btn:hover {
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  background: rgba(245, 158, 11, 0.05);
}

.ctrl-btn.active {
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  background: rgba(245, 158, 11, 0.1);
}

.ctrl-btn.danger:hover {
  border-color: var(--pro-color);
  color: var(--pro-color);
  background: rgba(239, 68, 68, 0.05);
}

/* ========== Verdict Section ========== */
.verdict-section {
  display: none;
  text-align: center;
  padding: 40px;
  background: var(--bg-card);
  border-radius: 24px;
  border: 1px solid var(--border-active);
  margin-bottom: 40px;
  animation: verdictAppear 0.8s ease;
}

.verdict-section.active { display: block; }

@keyframes verdictAppear {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.verdict-icon {
  font-size: 64px;
  margin-bottom: 16px;
  animation: verdictPulse 2s ease-in-out infinite;
}

@keyframes verdictPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.verdict-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 900;
  color: var(--accent-gold);
  margin-bottom: 12px;
}

.verdict-text {
  font-size: 16px;
  color: var(--text-secondary);
  max-width: 600px;
  margin: 0 auto 24px;
  line-height: 1.8;
}

.verdict-stats {
  display: flex;
  justify-content: center;
  gap: 40px;
}

.verdict-stat {
  text-align: center;
}

.verdict-stat-value {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 900;
}

.verdict-stat-value.pro { color: var(--pro-color); }
.verdict-stat-value.con { color: var(--con-color); }
.verdict-stat-value.gold { color: var(--accent-gold); }

.verdict-stat-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

/* ========== History Log ========== */
.history-section {
  margin-top: 40px;
  padding-top: 30px;
  border-top: 1px solid var(--border-subtle);
}

.history-title {
  font-size: 14px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 3px;
  margin-bottom: 20px;
  text-align: center;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 800px;
  margin: 0 auto;
}

.history-item {
  background: var(--bg-card);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 1px solid transparent;
}

.history-item:hover {
  border-color: var(--border-active);
  transform: translateX(4px);
}

.history-item-icon {
  font-size: 24px;
  flex-shrink: 0;
}

.history-item-info {
  flex: 1;
}

.history-item-topic {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
}

.history-item-meta {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.history-item-result {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 8px;
  font-weight: 600;
}

.history-item-result.pro-win {
  background: rgba(239, 68, 68, 0.15);
  color: var(--pro-color);
}

.history-item-result.con-win {
  background: rgba(59, 130, 246, 0.15);
  color: var(--con-color);
}

.history-item-result.draw {
  background: rgba(245, 158, 11, 0.15);
  color: var(--accent-gold);
}

/* ========== Toast Notification ========== */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.toast {
  background: var(--bg-card);
  border: 1px solid var(--border-active);
  border-radius: 12px;
  padding: 14px 20px;
  font-size: 14px;
  color: var(--text-primary);
  backdrop-filter: blur(10px);
  animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  max-width: 320px;
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(40px); }
}

/* ========== Speed Control ========== */
.speed-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.speed-label {
  font-size: 12px;
  color: var(--text-muted);
}

.speed-slider {
  -webkit-appearance: none;
  width: 80px;
  height: 4px;
  background: var(--border-subtle);
  border-radius: 2px;
  outline: none;
}

.speed-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: var(--accent-gold);
  border-radius: 50%;
  cursor: pointer;
}

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .app-container { padding: 12px; }
  .scoreboard { gap: 20px; }
  .score-value { font-size: 36px; }
  .voting-buttons { flex-direction: column; align-items: center; }
  .verdict-stats { flex-direction: column; gap: 20px; }
  .topic-input-wrapper { flex-direction: column; }
  .btn-start { width: 100%; }
}

/* ========== Utility Animations ========== */
.fade-in {
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.shake {
  animation: shake 0.5s ease;
}

@keyframes shake {

// ========== Particle System ==========
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animationId;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.speedY = (Math.random() - 0.5) * 0.5;
    this.opacity = Math.random() * 0.5 + 0.1;
    const colors = ['239,68,68', '59,130,246', '245,158,11'];
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
      this.reset();
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${this.color},${this.opacity})`;
    ctx.fill();
  }
}

for (let i = 0; i < 80; i++) {
  particles.push(new Particle());
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });

  // Draw connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 120) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(148,163,184,${0.05 * (1 - dist / 120)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
  animationId = requestAnimationFrame(animateParticles);
}
animateParticles();

  con: [
    { text: '我们不能忽视这一方向带来的潜在风险和负面后果。每一个看似美好的提议背后，都隐藏着需要认真审视的代价。理性思考要求我们不仅要看到好处，更要警惕隐患。', tags: ['风险分析', '批判思维'], strength: 84 },
    { text: '从人性和社会学的角度来看，这一观点忽视了人的基本需求和情感因素。技术或制度的变革如果脱离了人的真实感受，最终将适得其反。', tags: ['人文关怀', '社会分析'], strength: 83 },
    { text: '许多看似合理的论点在深入分析后都经不起推敲。因果关系被混淆，相关性和因果性被混为一谈。我们需要更严谨的逻辑，而非感性的判断。', tags: ['逻辑反驳', '方法论'], strength: 85 },
    { text: '世界上没有一刀切的解决方案。不同文化、不同发展阶段、不同个体有着截然不同的需求和条件。将一种模式强加于所有情况，本身就是一种傲慢。', tags: ['多元视角', '文化敏感'], strength: 82 },
    { text: '真正的智慧在于平衡，而非极端。历史上所有持久的解决方案都是妥协的产物——在理想与现实之间找到那个最优的平衡点，才是我们应该追求的。', tags: ['辩证思维', '务实观点'], strength: 87 },
  ]
};

// ========== Debate Engine ==========
let debateState = {
  topic: '',
  round: 0,
  maxRounds: 5,
  proScore: 0,
  conScore: 0,
  proVotes: 50,
  conVotes: 50,
  isRunning: false,
  isPaused: false,
  currentTurn: 'pro',
  hasVoted: false,
  speed: 3,
  arguments: { pro: [], con: [] },
  history: JSON.parse(localStorage.getItem('debateHistory') || '[]'),
  currentTimeout: null,
  typingTimeout: null,
};

function setTopic(topic) {
  document.getElementById('topicInput').value = topic;
  document.getElementById('topicInput').focus();
}

function showToast(message) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function getArgumentsForTopic(topic) {
  // Check if we have specific data for this topic
  for (const key in debateDB) {
    if (topic.includes(key.substring(0, 4)) || key.includes(topic.substring(0, 4))) {
      return debateDB[key];
    }
  }
  // Return generic templates with topic context
  return {
    pro: genericTemplates.pro.map(a => ({
      ...a,
      text: a.text.replace(/这一(观点|方向|趋势|变革)/g, `「${topic}」这一$1`)
    })),
    con: genericTemplates.con.map(a => ({
      ...a,
      text: a.text.replace(/这一(观点|方向)/g, `「${topic}」这一$1`)
    }))
  };
}

async function startDebate() {
  const topic = document.getElementById('topicInput').value.trim();
  if (!topic) {
    showToast('请输入一个辩论话题');
    document.getElementById('topicInput').classList.add('shake');
    setTimeout(() => document.getElementById('topicInput').classList.remove('shake'), 500);
    return;
  }

  // Reset state
  debateState = {
    ...debateState,
    topic,
    round: 0,
    proScore: 0,
    conScore: 0,
    proVotes: 50,
    conVotes: 50,
    isRunning: true,
    isPaused: false,
    currentTurn: 'pro',
    hasVoted: false,
    arguments: { pro: [], con: [] },
  };

  // Update UI
  document.getElementById('topicSection').style.display = 'none';
  document.getElementById('debateArena').classList.add('active');
  document.getElementById('verdictSection').classList.remove('active');
  document.getElementById('debateTopicDisplay').textContent = topic;
  document.getElementById('proArguments').innerHTML = '';
  document.getElementById('conArguments').innerHTML = '';
  document.getElementById('proScore').textContent = '0';
  document.getElementById('conScore').textContent = '0';
  updateOpinionBar();
  resetVoteButtons();

  showToast('辩论开始！正方先行');

  // Start first round
  await delay(800);
  nextRound();
}

function nextRound() {
  if (!debateState.isRunning || debateState.round >= debateState.maxRounds) {
    if (debateState.round >= debateState.maxRounds) {
      endDebate();
    }
    return;
  }

  debateState.round++;
  document.getElementById('debateRoundInfo').textContent = `ROUND ${debateState.round} / ${debateState.maxRounds}`;

  // Pro speaks first
  debateState.currentTurn = 'pro';
  showTyping('pro');
  activatePanel('pro');

  const delayTime = getDelayTime();

  debateState.typingTimeout = setTimeout(() => {
    hideTyping('pro');
    addArgument('pro', debateState.round);
    debateState.proScore += calculateScore('pro', debateState.round);

    setTimeout(() => {
      if (!debateState.isRunning) return;
      // Con responds
      debateState.currentTurn = 'con';
      showTyping('con');
      activatePanel('con');

      debateState.typingTimeout = setTimeout(() => {
        hideTyping('con');
        addArgument('con', debateState.round);
        debateState.conScore += calculateScore('con', debateState.round);
        updateScoreboard();

        // Allow voting after each round
        debateState.hasVoted = false;
        resetVoteButtons();

        // Auto advance to next round
        if (debateState.round < debateState.maxRounds && debateState.isRunning) {
          debateState.currentTimeout = setTimeout(() => {
            if (debateState.isRunning) nextRound();
          }, getDelayTime() * 3);
        }
      }, delayTime);
    }, 600);
  }, delayTime);
}

function getDelayTime() {
  const baseDelays = [3000, 2200, 1500, 1000, 600];
  return baseDelays[debateState.speed - 1] || 1500;
}

function calculateScore(side, round) {
  const args = getArgumentsForTopic(debateState.topic);
  const arg = args[side][(round - 1) % args[side].length];
  let score = Math.round(arg.strength / 20);

  // Opinion influence
  if (side === 'pro') {
    score += Math.round((debateState.proVotes - 50) / 25);
  } else {
    score += Math.round((debateState.conVotes - 50) / 25);
  }

  return Math.max(1, Math.min(8, score));
}

function addArgument(side, round) {
  const args = getArgumentsForTopic(debateState.topic);
  const arg = args[side][(round - 1) % args[side].length];

  // Dynamic text adjustment based on opinion
  let text = arg.text;
  if (side === 'pro' && debateState.proVotes < 40) {
    text += '\n\n我注意到观众中支持反方的声音在增加，这恰恰说明这个话题值得更深入的讨论。让我从另一个角度来阐述...';
  } else if (side === 'con' && debateState.conVotes < 40) {
    text += '\n\n舆论似乎倾向于正方，但这并不意味着真理站在多数人一边。请允许我提出一个不同的视角...';
  }

  const card = document.createElement('div');
  card.className = 'argument-card';
  card.innerHTML = `
    <div class="argument-round">Round ${round}</div>
    <div class="argument-text">${formatText(text)}</div>
    <div class="argument-meta">
      ${arg.tags.map(t => `<span class="argument-tag">${t}</span>`).join('')}
      <span class="argument-strength">说服力 ${arg.strength}</span>
    </div>
  `;

  const list = document.getElementById(`${side}Arguments`);
  list.appendChild(card);
  list.scrollTop = list.scrollHeight;

  debateState.arguments[side].push(arg);
}

function formatText(text) {
  // Highlight key phrases
  const highlights = ['因此', '事实上', '研究表明', '关键在于', '最重要的是', '数据表明', '历史证明', '本质上是'];
  highlights.forEach(h => {
    text = text.replace(new RegExp(h, 'g'), `<span class="highlight">${h}</span>`);
  });
  return text.replace(/\n/g, '<br>');
}

function showTyping(side) {
  document.getElementById(`${side}Typing`).classList.add('visible');
}

function hideTyping(side) {
  document.getElementById(`${side}Typing`).classList.remove('visible');
}

function activatePanel(side) {
  document.getElementById('proPanel').classList.toggle('active-turn', side === 'pro');
  document.getElementById('conPanel').classList.toggle('active-turn', side === 'con');
}

function updateScoreboard() {
  document.getElementById('proScore').textContent = debateState.proScore;
  document.getElementById('conScore').textContent = debateState.conScore;
}

function updateOpinionBar() {
  const total = debateState.proVotes + debateState.conVotes;
  const proPct = Math.round((debateState.proVotes / total) * 100);
  const conPct = 100 - proPct;

  document.getElementById('proPercent').textContent = proPct;
  document.getElementById('conPercent').textContent = conPct;
  document.getElementById('opinionBarFill').style.width = `${proPct}%`;
}

function castVote(side) {
  if (debateState.hasVoted) return;
  debateState.hasVoted = true;

  if (side === 'pro') {
    debateState.proVotes += Math.floor(Math.random() * 8) + 5;
    document.getElementById('votePro').classList.add('voted', 'selected');
    document.getElementById('voteCon').classList.add('voted');
    showToast('你投给了正方！舆论风向已更新');
  } else {
    debateState.conVotes += Math.floor(Math.random() * 8) + 5;
    document.getElementById('voteCon').classList.add('voted', 'selected');
    document.getElementById('votePro').classList.add('voted');
    showToast('你投给了反方！舆论风向已更新');
  }

  updateOpinionBar();
}

function resetVoteButtons() {
  document.getElementById('votePro').classList.remove('voted', 'selected');
  document.getElementById('voteCon').classList.remove('voted', 'selected');
}

function togglePause() {
  debateState.isPaused = !debateState.isPaused;
  const btn = document.getElementById('btnPause');
  if (debateState.isPaused) {
    btn.textContent = '▶ 继续';
    btn.classList.add('active');
    showToast('辩论已暂停');
  } else {
    btn.textContent = '⏸ 暂停';
    btn.classList.remove('active');
    showToast('辩论继续');
  }
}

function updateSpeed(value) {
  debateState.speed = parseInt(value);
}

function skipRound() {
  clearTimeout(debateState.typingTimeout);
  clearTimeout(debateState.currentTimeout);
  hideTyping('pro');
  hideTyping('con');

  // Add arguments immediately
  if (debateState.round < debateState.maxRounds) {
    debateState.round++;
    document.getElementById('debateRoundInfo').textContent = `ROUND ${debateState.round} / ${debateState.maxRounds}`;
    addArgument('pro', debateState.round);
    debateState.proScore += calculateScore('pro', debateState.round);
    addArgument('con', debateState.round);
    debateState.conScore += calculateScore('con', debateState.round);
    updateScoreboard();
    resetVoteButtons();
    showToast(`已跳至第 ${debateState.round} 轮`);

    if (debateState.round < debateState.maxRounds && debateState.isRunning) {
      debateState.currentTimeout = setTimeout(() => {
        if (debateState.isRunning) nextRound();
      }, getDelayTime() * 2);
    }
  }
}

function endDebate() {
  clearTimeout(debateState.typingTimeout);
  clearTimeout(debateState.currentTimeout);
  debateState.isRunning = false;

  hideTyping('pro');
  hideTyping('con');
  document.getElementById('proPanel').classList.remove('active-turn');
  document.getElementById('conPanel').classList.remove('active-turn');

  // Determine winner
  const proScore = debateState.proScore;
  const conScore = debateState.conScore;
  let verdictIcon, verdictTitle, verdictText, resultType;

  if (proScore > conScore) {
    verdictIcon = '🏆';
    verdictTitle = '正方获胜！';
    verdictText = `经过 ${debateState.round} 轮激烈辩论，正方以 ${proScore} 比 ${conScore} 的比分取得胜利。正方辩手凭借严密的逻辑和有力的论据赢得了更多认可。`;
    resultType = 'pro-win';
  } else if (conScore > proScore) {
    verdictIcon = '🏆';
    verdictTitle = '反方获胜！';
    verdictText = `经过 ${debateState.round} 轮激烈辩论，反方以 ${conScore} 比 ${proScore} 的比分取得胜利。反方辩手以深刻的洞察和有力的反驳征服了观众。`;
    resultType = 'con-win';
  } else {
    verdictIcon = '🤝';
    verdictTitle = '势均力敌！';
    verdictText = `经过 ${debateState.round} 轮激烈辩论，双方以 ${proScore} 比 ${conScore} 的比分打成平手。这场辩论展现了双方观点的深度与复杂性，真理往往在两个极端之间。`;
    resultType = 'draw';
  }

  document.getElementById('verdictIcon').textContent = verdictIcon;
  document.getElementById('verdictTitle').textContent = verdictTitle;
  document.getElementById('verdictText').textContent = verdictText;
  document.getElementById('verdictProScore').textContent = proScore;
  document.getElementById('verdictConScore').textContent = conScore;
  document.getElementById('verdictRounds').textContent = debateState.round;
  document.getElementById('verdictSection').classList.add('active');

  // Save to history
  const historyItem = {
    topic: debateState.topic,
    proScore,
    conScore,
    rounds: debateState.round,
    result: resultType,
    date: new Date().toLocaleString('zh-CN'),
  };
  debateState.history.unshift(historyItem);
  if (debateState.history.length > 10) debateState.history.pop();
  localStorage.setItem('debateHistory', JSON.stringify(debateState.history));
  renderHistory();

  // Scroll to verdict
  document.getElementById('verdictSection').scrollIntoView({ behavior: 'smooth' });
}

function resetDebate() {
  document.getElementById('debateArena').classList.remove('active');
  document.getElementById('topicSection').style.display = 'block';
  document.getElementById('topicInput').value = '';
  document.getElementById('topicInput').focus();
  document.getElementById('btnPause').textContent = '⏸ 暂停';
  document.getElementById('btnPause').classList.remove('active');
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const list = document.getElementById('historyList');

  if (debateState.history.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  list.innerHTML = debateState.history.map(item => `
    <div class="history-item" onclick="setTopic('${item.topic.replace(/'/g, "\\'")}')">
      <div class="history-item-icon">${item.result === 'pro-win' ? '🔴' : item.result === 'con-win' ? '🔵' : '🟡'}</div>
      <div class="history-item-info">
        <div class="history-item-topic">${item.topic}</div>
        <div class="history-item-meta">${item.date} · ${item.rounds}轮 · ${item.proScore}:${item.conScore}</div>
      </div>
      <span class="history-item-result ${item.result}">${item.result === 'pro-win' ? '正方胜' : item.result === 'con-win' ? '反方胜' : '平局'}</span>
    </div>
  `).join('');
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// ========== Initialize ==========
document.getElementById('topicInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startDebate();
});

// Render history on load
renderHistory();
</script>
