<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情气象台 - Mood Weather Station</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: #fff;
  overflow-x: hidden;
}
.container { max-width: 900px; margin: 0 auto; padding: 20px; }
header { text-align: center; padding: 40px 20px; }
header h1 { font-size: 2.5rem; background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
header p { opacity: 0.7; font-size: 1.1rem; }

/* 天气画布 */
.weather-canvas {
  position: relative;
  width: 100%;
  height: 400px;
  border-radius: 24px;
  overflow: hidden;
  margin-bottom: 30px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
#weatherScene {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 1s ease;
}

/* 晴天 */
.weather-sunny {
  background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
}
.sun {
  width: 120px; height: 120px;
  background: radial-gradient(circle, #FFD93D 0%, #FF8C00 100%);
  border-radius: 50%;
  box-shadow: 0 0 80px #FFD93D, 0 0 120px rgba(255,217,61,0.5);
  animation: sunPulse 3s ease-in-out infinite;
}
@keyframes sunPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 80px #FFD93D, 0 0 120px rgba(255,217,61,0.5); }
  50% { transform: scale(1.1); box-shadow: 0 0 100px #FFD93D, 0 0 160px rgba(255,217,61,0.6); }
}
.sun-ray {
  position: absolute; width: 200px; height: 200px;
  animation: sunRotate 20s linear infinite;
}
.sun-ray::before {
  content: ''; position: absolute; inset: 0;
  background: repeating-conic-gradient(from 0deg, transparent 0deg 10deg, rgba(255,217,61,0.15) 10deg 20deg);
  border-radius: 50%;
}

/* 多云 */
.weather-cloudy {
  background: linear-gradient(180deg, #B0C4DE 0%, #D3D3D3 100%);
}
.cloud {
  position: absolute;
  background: #fff;
  border-radius: 50px;
  animation: cloudFloat 6s ease-in-out infinite;
}
.cloud::before, .cloud::after {
  content: ''; position: absolute; background: #fff; border-radius: 50%;
}
.cloud-1 { width: 120px; height: 50px; top: 30%; left: 20%; animation-delay: 0s; }
.cloud-1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
.cloud-1::after { width: 45px; height: 45px; top: -20px; left: 55px; }
.cloud-2 { width: 90px; height: 38px; top: 50%; right: 25%; animation-delay: -2s; opacity: 0.8; }
.cloud-2::before { width: 45px; height: 45px; top: -22px; left: 15px; }
.cloud-2::after { width: 35px; height: 35px; top: -15px; left: 42px; }
@keyframes cloudFloat {
  0%, 100% { transform: translateX(0) translateY(0); }
  50% { transform: translateX(20px) translateY(-10px); }
}

/* 雨天 */
.weather-rainy {
  background: linear-gradient(180deg, #4A5568 0%, #2D3748 100%);
}
.rain-container { position: absolute; inset: 0; overflow: hidden; }
.raindrop {
  position: absolute; width: 2px; height: 20px;
  background: linear-gradient(to bottom, transparent, rgba(174,194,224,0.8));
  animation: rainFall linear infinite;
}
@keyframes rainFall {
  0% { transform: translateY(-20px); opacity: 1; }
  100% { transform: translateY(420px); opacity: 0.3; }
}

/* 雪天 */
.weather-snowy {
  background: linear-gradient(180deg, #E8E8E8 0%, #B0BEC5 100%);
}
.snowflake {
  position: absolute; color: #fff; font-size: 16px;
  animation: snowFall linear infinite;
  text-shadow: 0 0 5px rgba(255,255,255,0.8);
}
@keyframes snowFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(420px) rotate(360deg); opacity: 0.4; }
}

/* 雷暴 */
.weather-stormy {
  background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
}
.lightning {
  position: absolute; top: 0; left: 50%;
  width: 4px; height: 150px;
  background: linear-gradient(to bottom, #fff, #E1FF00);
  clip-path: polygon(50% 0%, 40% 35%, 65% 35%, 45% 70%, 70% 70%, 30% 100%, 48% 62%, 28% 62%, 50% 30%, 35% 30%);
  animation: lightningFlash 4s ease-in-out infinite;
  filter: drop-shadow(0 0 20px #E1FF00) drop-shadow(0 0 40px rgba(225,255,0,0.5));
}
@keyframes lightningFlash {
  0%, 89%, 91%, 93%, 95%, 100% { opacity: 0; }
  90%, 92%, 94% { opacity: 1; }
}

/* 情绪选择器 */
.mood-selector { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
.mood-btn {
  padding: 14px 24px; border: 2px solid rgba(255,255,255,0.2);
  border-radius: 16px; background: rgba(255,255,255,0.08);
  color: #fff; cursor: pointer; font-size: 1rem;
  transition: all 0.3s ease; backdrop-filter: blur(10px);
  display: flex; align-items: center; gap: 8px;
}
.mood-btn:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
.mood-btn.active { border-color: #4facfe; background: rgba(79,172,254,0.2); box-shadow: 0 0 20px rgba(79,172,254,0.3); }
.mood-emoji { font-size: 1.5rem; }

/* 日志区域 */
.diary-section { background: rgba(255,255,255,0.06); border-radius: 20px; padding: 30px; backdrop-filter: blur(10px); }
.diary-section h2 { margin-bottom: 20px; font-size: 1.3rem; opacity: 0.9; }
.diary-input {
  width: 100%; min-height: 100px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 14px; padding: 16px; color: #fff; font-size: 1rem;
  resize: vertical; outline: none; transition: border-color 0.3s;
  font-family: inherit;
}
.diary-input:focus { border-color: #4facfe; }
.diary-input::placeholder { color: rgba(255,255,255,0.4); }

.save-btn {
  margin-top: 16px; padding: 12px 32px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none; border-radius: 12px; color: #fff; font-size: 1rem;
  cursor: pointer; transition: all 0.3s;
}
.save-btn:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }

/* 历史记录 */
.history { margin-top: 30px; }
.history h2 { margin-bottom: 16px; font-size: 1.3rem; opacity: 0.9; }
.history-list { display: flex; flex-direction: column; gap: 12px; max-height: 300px; overflow-y: auto; }
.history-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; background: rgba(255,255,255,0.05);
  border-radius: 14px; border-left: 4px solid;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
.history-mood { font-size: 1.8rem; }
.history-text { flex: 1; font-size: 0.95rem; opacity: 0.85; line-height: 1.5; }
.history-date { font-size: 0.8rem; opacity: 0.5; white-space: nowrap; }

/* 天气信息面板 */
.weather-info {
  text-align: center; padding: 20px;
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.3); border-radius: 16px; backdrop-filter: blur(10px);
}
.weather-info .temp { font-size: 3rem; font-weight: bold; }
.weather-info .desc { font-size: 1.1rem; opacity: 0.85; }

.empty-state { text-align: center; padding: 40px; opacity: 0.5; }

/* 统计 */
.stats-bar {
  display: flex; gap: 20px; margin-top: 24px; flex-wrap: wrap; justify-content: center;
}
.stat-card {
  flex: 1; min-width: 140px; padding: 20px;
  background: rgba(255,255,255,0.06); border-radius: 16px; text-align: center;
}
.stat-value { font-size: 2rem; font-weight: bold; }
.stat-label { font-size: 0.85rem; opacity: 0.6; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>心情气象台</h1>
    <p>把你的情绪变成天气，记录每一天的心情变化</p>
  </header>

  <!-- 天气展示区 -->
  <div class="weather-canvas" id="weatherCanvas">
    <div id="weatherScene" class="weather-sunny">
      <div class="sun"></div>
      <div class="sun-ray"></div>
      <div class="weather-info">
        <div class="temp" id="tempDisplay">26°C</div>
        <div class="desc" id="descDisplay">晴朗 · 心情不错</div>
      </div>
    </div>
  </div>

  <!-- 情绪选择 -->
  <div class="mood-selector" id="moodSelector">
    <button class="mood-btn active" data-mood="happy" data-weather="sunny">
      <span class="mood-emoji">😊</span> 开心
    </button>
    <button class="mood-btn" data-mood="calm" data-weather="cloudy">
      <span class="mood-emoji">😌</span> 平静
    </button>
    <button class="mood-btn" data-mood="sad" data-weather="rainy">
      <span class="mood-emoji">😢</span> 难过
    </button>
    <button class="mood-btn" data-mood="anxious" data-weather="stormy">
      <span class="mood-emoji">😰</span> 焦虑
    </button>
    <button class="mood-btn" data-mood="hopeful" data-weather="snowy">
      <span class="mood-emoji">🌟</span> 期待
    </button>
  </div>

  <!-- 记录日记 -->
  <div class="diary-section">
    <h2>今天想记录什么？</h2>
    <textarea class="diary-input" id="diaryInput" placeholder="写下此刻的想法、发生的事情，或者任何你想记录的内容..."></textarea>
    <button class="save-btn" onclick="saveDiary()">保存今天的心情</button>

    <!-- 统计 -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-card"><div class="stat-value" id="totalDays">0</div><div class="stat-label">记录天数</div></div>
      <div class="stat-card"><div class="stat-value" id="happyDays">0</div><div class="stat-label">开心天数</div></div>
      <div class="stat-card"><div class="stat-value" id="streakDays">0</div><div class="stat-label">连续记录</div></div>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="history">
    <h2>心情回顾</h2>
    <div class="history-list" id="historyList">
      <div class="empty-state">还没有记录，开始记录你的第一份心情吧 ✨</div>
    </div>
  </div>
</div>

<script>
const moodConfig = {
  happy:   { weather: 'sunny',  temp: '26°C', desc: '晴朗 · 心情不错',     emoji: '😊', color: '#FFD93D' },
  calm:    { weather: 'cloudy',  temp: '22°C', desc: '多云 · 宁静安详',     emoji: '😌', color: '#94A3B8' },
  sad:     { weather: 'rainy',  temp: '16°C', desc: '下雨 · 需要拥抱',     emoji: '😢', color: '#60A5FA' },
  anxious: { weather: 'stormy', temp: '20°C', desc: '雷暴 · 内心波澜',     emoji: '😰', color: '#A78BFA' },
  hopeful: { weather: 'snowy',  temp: '5°C',  desc: '下雪 · 充满期待',     emoji: '🌟', color: '#E0E7FF' }
};

let currentMood = 'happy';
let diaries = JSON.parse(localStorage.getItem('moodDiaries') || '[]');

// 初始化
function init() {
  renderHistory();
  updateStats();
  bindMoodButtons();
}

function bindMoodButtons() {
  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMood = btn.dataset.mood;
      changeWeather(currentMood);
    });
  });
}

function changeWeather(mood) {
  const config = moodConfig[mood];
  const scene = document.getElementById('weatherScene');
  scene.className = `weather-${config.weather}`;
  scene.innerHTML = '';

  // 根据天气类型渲染不同效果
  if (config.weather === 'sunny') {
    scene.innerHTML = `<div class="sun"></div><div class="sun-ray"></div>`;
  } else if (config.weather === 'cloudy') {
    scene.innerHTML = `<div class="cloud cloud-1"></div><div class="cloud cloud-2"></div>`;
  } else if (config.weather === 'rainy') {
    let drops = '';
    for (let i = 0; i < 80; i++) {
      const left = Math.random() * 100;
      const delay = Math.random() * 2;
      const dur = 0.5 + Math.random() * 0.5;
      drops += `<div class="raindrop" style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    scene.innerHTML = `<div class="rain-container">${drops}</div>`;
  } else if (config.weather === 'snowy') {
    let flakes = '';
    const snowEmojis = ['❄', '❅', '❆', '✦'];
    for (let i = 0; i < 40; i++) {
      const left = Math.random() * 100;
      const delay = Math.random() * 5;
      const dur = 3 + Math.random() * 5;
      const emoji = snowEmojis[Math.floor(Math.random() * snowEmojis.length)];
      flakes += `<div class="snowflake" style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;">${emoji}</div>`;
    }
    scene.innerHTML = `<div class="rain-container">${flakes}</div>`;
  } else if (config.weather === 'stormy') {
    let drops = '';
    for (let i = 0; i < 60; i++) {
      const left = Math.random() * 100;
      const delay = Math.random() * 2;
      const dur = 0.4 + Math.random() * 0.3;
      drops += `<div class="raindrop" style="left:${left}%;animation-duration:${dur}s;animation-delay:${delay}s;"></div>`;
    }
    scene.innerHTML = `<div class="rain-container">${drops}</div><div class="lightning"></div>`;
  }

  scene.innerHTML += `
    <div class="weather-info">
      <div class="temp" id="tempDisplay">${config.temp}</div>
      <div class="desc" id="descDisplay">${config.desc}</div>
    </div>`;
}

function saveDiary() {
  const text = document.getElementById('diaryInput').value.trim();
  if (!text) return alert('请写点什么吧~');

  const diary = {
    id: Date.now(),
    mood: currentMood,
    text: text,
    date: new Date().toLocaleString('zh-CN'),
    timestamp: Date.now()
  };

  diaries.unshift(diary);
  localStorage.setItem('moodDiaries', JSON.stringify(diaries));
  document.getElementById('diaryInput').value = '';
  renderHistory();
  updateStats();

  // 动效反馈
  const btn = document.querySelector('.save-btn');
  btn.textContent = '已保存! ✓';
  btn.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
  setTimeout(() => { btn.textContent = '保存今天的心情'; btn.style.background = ''; }, 2000);
}

function renderHistory() {
  const list = document.getElementById('historyList');
  if (diaries.length === 0) {
    list.innerHTML = '<div class="empty-state">还没有记录，开始记录你的第一份心情吧 ✨</div>';
    return;
  }
  list.innerHTML = diaries.slice(0, 20).map(d => {
    const cfg = moodConfig[d.mood];
    return `<div class="history-item" style="border-left-color: ${cfg.color}">
      <span class="history-mood">${cfg.emoji}</span>
      <span class="history-text">${escapeHtml(d.text)}</span>
      <span class="history-date">${d.date}</span>
    </div>`;
  }).join('');
}

function updateStats() {
  document.getElementById('totalDays').textContent = diaries.length;
  document.getElementById('happyDays').textContent = diaries.filter(d => d.mood === 'happy').length;

  // 计算连续记录天数
  let streak = 0;
  const today = new Date().toDateString();
  if (diaries.length > 0) {
    const lastDate = new Date(diaries[0].timestamp).toDateString();
    if (lastDate === today || lastDate === new Date(Date.now() - 86400000).toDateString()) {
      streak = 1;
      for (let i = 1; i < diaries.length; i++) {
        const prev = new Date(diaries[i-1].timestamp).toDateString();
        const curr = new Date(diaries[i].timestamp).toDateString();
        const diff = (new Date(prev) - new Date(curr)) / 86400000;
        if (diff <= 1.1) streak++; else break;
      }
    }
  }
  document.getElementById('streakDays').textContent = streak;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

init();
</script>
</body>
</html>
