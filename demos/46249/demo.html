<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>信栈 · 今日消息复盘</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════════
       信栈 · Claude Design Style — Soft Pastel Glassmorphism
       ═══════════════════════════════════════════════════════════════ */

    :root {
      --bg:            #f0eeeb;
      --bg-warm:       #f5f2ee;
      --surface:       rgba(255,255,255,0.55);
      --surface-solid: #faf9f7;
      --border:        rgba(255,255,255,0.6);
      --border-subtle: rgba(0,0,0,0.06);
      --text:          #2d2a26;
      --text-secondary:#7a756e;
      --text-muted:    #b0aaa2;
      --accent:        #7c6fe0;
      --accent-light:  #a99bf0;
      --accent-bg:     rgba(124,111,224,0.10);
      --rose:          #e07a8e;
      --rose-bg:       rgba(224,122,142,0.12);
      --sage:          #6db88f;
      --sage-bg:       rgba(109,184,143,0.12);
      --amber:         #d4a054;
      --amber-bg:      rgba(212,160,84,0.12);
      --sky:           #5ba4cf;
      --sky-bg:        rgba(91,164,207,0.12);
      --radius:        20px;
      --radius-sm:     12px;
      --radius-pill:   100px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(124,111,224,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 10%, rgba(224,122,142,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(109,184,143,0.05) 0%, transparent 50%);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.01em;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }

    /* ── Glass Card ── */
    .glass {
      background: var(--surface);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow:
        0 1px 2px rgba(0,0,0,0.04),
        0 4px 16px rgba(0,0,0,0.03),
        inset 0 1px 0 rgba(255,255,255,0.7);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  border-color 0.35s ease;
    }
    .glass:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 32px rgba(124,111,224,0.08),
        0 2px 8px rgba(0,0,0,0.04),
        inset 0 1px 0 rgba(255,255,255,0.8);
      border-color: rgba(124,111,224,0.25);
    }

    /* ── Gradient Text ── */
    .text-gradient {
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(135deg, var(--accent), var(--rose));
    }
    .text-gradient-sage {
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(135deg, var(--sage), var(--sky));
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 24px;
      border-radius: var(--radius-pill);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      border: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff;
      box-shadow: 0 2px 12px rgba(124,111,224,0.25);
    }
    .btn-primary:hover {
      box-shadow: 0 4px 20px rgba(124,111,224,0.35);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-ghost {
      background: var(--surface);
      backdrop-filter: blur(12px);
      color: var(--accent);
      border: 1.5px solid rgba(124,111,224,0.25);
    }
    .btn-ghost:hover {
      background: var(--accent-bg);
      border-color: rgba(124,111,224,0.4);
    }

    /* ── Textarea ── */
    .field {
      width: 100%;
      min-height: 120px;
      padding: 16px 20px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-subtle);
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .field::placeholder { color: var(--text-muted); }
    .field:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,111,224,0.12);
    }

    /* ── Bento Grid ── */
    .bento {
      display: grid;
      gap: 16px;
      max-width: 1120px;
      margin: 0 auto;
    }
    .bento-hero    { grid-column: span 2; }
    .bento-stats   { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .bento-report  { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .bento-charts  { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    @media (max-width: 900px) {
      .bento-hero { grid-column: span 1; }
      .bento-stats { grid-template-columns: repeat(2, 1fr); }
      .bento-report { grid-template-columns: 1fr; }
      .bento-charts { grid-template-columns: 1fr; }
    }

    /* ── Stat Card ── */
    .stat-card {
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::after {
      content: '';
      position: absolute;
      top: -20px; right: -20px;
      width: 60px; height: 60px;
      border-radius: 50%;
      opacity: 0.15;
    }
    .stat-card.accent::after  { background: var(--accent); }
    .stat-card.amber::after   { background: var(--amber); }
    .stat-card.rose::after    { background: var(--rose); }
    .stat-card.sky::after     { background: var(--sky); }
    .stat-value {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .stat-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    /* ── Message Row ── */
    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .msg-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.35);
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .msg-row:hover {
      background: rgba(255,255,255,0.7);
      border-color: var(--border);
    }
    .msg-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .msg-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      min-width: 72px;
    }
    .msg-text {
      flex: 1;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .msg-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Report Cell ── */
    .report-cell {
      padding: 24px;
    }
    .report-cell h3 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .report-icon {
      width: 28px; height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .report-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 0;
    }
    .report-item + .report-item {
      border-top: 1px solid var(--border-subtle);
    }
    .report-item-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
    }

    /* ── Insight ── */
    .insight-bar {
      padding: 20px 24px;
      background: linear-gradient(135deg, rgba(124,111,224,0.06) 0%, rgba(224,122,142,0.06) 100%);
      border: 1px solid rgba(124,111,224,0.12);
      border-radius: var(--radius);
    }

    /* ── Chart ── */
    .chart-wrap { position: relative; height: 240px; }

    /* ── Page Layout ── */
    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* ── Nav ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(240,238,235,0.7);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border-bottom: 1px solid var(--border-subtle);
    }
    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark {
      width: 32px; height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--rose));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }
    .brand-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* ── Section Title ── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .section-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    /* ── Footer ── */
    .foot {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- ═══ Topbar ═══ -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">信</div>
        <div>
          <div class="brand-text">信栈</div>
          <div class="brand-sub">今日消息复盘</div>
        </div>
      </div>
      <span style="font-size: 12px; color: var(--text-muted); font-weight: 500;">Demo v0.1</span>
    </div>
  </header>

  <div class="page">

    <!-- ═══ Hero: Input + Message List (Bento 2-col) ═══ -->
    <div class="bento" style="grid-template-columns: 1fr 1fr; margin-bottom: 16px;">

      <!-- Input -->
      <div class="glass bento-hero" style="padding: 28px;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
          <div>
            <p class="section-label">Step 01</p>
            <h2 class="section-title">消息导入</h2>
          </div>
          <div style="display: flex; gap: 8px;">
            <button id="clearBtn" class="btn btn-ghost" style="padding: 8px 18px; font-size: 13px;">清空</button>
            <button id="loadSampleBtn" class="btn btn-ghost" style="padding: 8px 18px; font-size: 13px;">加载示例</button>
            <button id="parseBtn" class="btn btn-primary" style="padding: 8px 20px; font-size: 13px;">开始解析</button>
          </div>
        </div>
        <textarea id="messageInput" rows="5" class="field" placeholder="粘贴今日消息，每行一条，可用 [高]/[中]/[低] 标记紧急度&#10;例如：[微信] 妈妈：妈妈病了！快来。[高]"></textarea>
        <p style="font-size: 12px; color: var(--text-muted); margin-top: 8px;">支持手动粘贴或点击「加载示例」快速体验</p>
      </div>

      <!-- Message List -->
      <div class="glass" style="padding: 28px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
          <div>
            <p class="section-label">Step 02</p>
            <h2 class="section-title">消息流</h2>
          </div>
          <span id="msgCount" style="font-size: 12px; color: var(--text-muted); font-weight: 500;"></span>
        </div>
        <div id="messageList" class="msg-list" style="flex: 1;">
          <p style="text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 0;">暂无消息</p>
        </div>
      </div>

    </div>

    <!-- ═══ Stat Cards (4-up) ═══ -->
    <div class="bento-stats" style="margin-bottom: 16px;">
      <div class="glass stat-card accent">
        <p class="stat-label">总消息</p>
        <p id="statTotal" class="stat-value text-gradient">0</p>
      </div>
      <div class="glass stat-card amber">
        <p class="stat-label">高紧急</p>
        <p id="statUrgent" class="stat-value" style="color: var(--amber);">0</p>
      </div>
      <div class="glass stat-card rose">
        <p class="stat-label">待回复</p>
        <p id="statReply" class="stat-value" style="color: var(--rose);">0</p>
      </div>
      <div class="glass stat-card sky">
        <p class="stat-label">来源数</p>
        <p id="statSources" class="stat-value text-gradient-sage">0</p>
      </div>
    </div>

    <!-- ═══ Report (3-col) ═══ -->
    <div style="margin-bottom: 16px;">
      <p class="section-label" style="margin-bottom: 8px;">Step 03</p>
      <div class="bento-report">
        <div class="glass report-cell">
          <h3>
            <span class="report-icon" style="background: var(--amber-bg);">
              <svg width="14" height="14" style="color: var(--amber);" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            </span>
            今日高光
          </h3>
          <div id="topHighlights"></div>
        </div>
        <div class="glass report-cell">
          <h3>
            <span class="report-icon" style="background: var(--rose-bg);">
              <svg width="14" height="14" style="color: var(--rose);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </span>
            待回复
          </h3>
          <div id="unrepliedList"></div>
        </div>
        <div class="glass report-cell">
          <h3>
            <span class="report-icon" style="background: var(--accent-bg);">
              <svg width="14" height="14" style="color: var(--accent);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            </span>
            AI 洞察
          </h3>
          <p id="aiInsight" style="font-size: 14px; line-height: 1.6; color: var(--text-secondary);"></p>
        </div>
      </div>
    </div>

    <!-- ═══ Insight Banner ═══ -->
    <div class="insight-bar" style="margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
        <svg width="16" height="16" style="color: var(--accent);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span style="font-size: 13px; font-weight: 600; color: var(--accent);">智能提示</span>
      </div>
      <p id="insightBanner" style="font-size: 14px; line-height: 1.6; color: var(--text-secondary);"></p>
    </div>

    <!-- ═══ Charts (2-col) ═══ -->
    <div>
      <p class="section-label" style="margin-bottom: 8px;">Step 04</p>
      <div class="bento-charts">
        <div class="glass" style="padding: 24px;">
          <h3 style="font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 16px;">消息来源分布</h3>
          <div class="chart-wrap">
            <canvas id="sourceChart"></canvas>
          </div>
        </div>
        <div class="glass" style="padding: 24px;">
          <h3 style="font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 16px;">24 小时消息分布</h3>
          <div class="chart-wrap">
            <canvas id="hourChart"></canvas>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ═══ Footer ═══ -->
  <footer class="foot">信栈 v0.1 · Demo 阶段 · 纯前端模拟数据</footer>

  <script>
    // ═══════════════════════════════════════════
    //  PRESET DATA (DO NOT MODIFY)
    // ═══════════════════════════════════════════
    const SAMPLE_MESSAGES = `[微信] 张老师：今晚的作业记得提交，@全体成员
[邮件] HR-李经理：关于下周一全员会议的通知
[QQ群-班级群] 班长：周五春游报名截止还有 3 天
[短信] 银行：您尾号 1234 信用卡消费 888 元
[微信] 妈妈：周末回家吃饭吗？
[微信] 同事-王五：那个 Excel 表格你方便的时候发我一下
[系统通知] iCloud 存储空间已用 95%
[邮件] 客户-陈总：合同内容还需要再确认一下`;

    const SOURCE_RULES = [
      { key: '微信',     label: '微信',     dot: '#6db88f', pillBg: 'rgba(109,184,143,0.15)', pillText: '#3d8a62' },
      { key: 'QQ',       label: 'QQ',       dot: '#5ba4cf', pillBg: 'rgba(91,164,207,0.15)',  pillText: '#3a7da8' },
      { key: '邮件',     label: '邮件',     dot: '#7c6fe0', pillBg: 'rgba(124,111,224,0.15)', pillText: '#5a4dbf' },
      { key: '短信',     label: '短信',     dot: '#d4a054', pillBg: 'rgba(212,160,84,0.15)',  pillText: '#a67a32' },
      { key: '系统通知', label: '系统通知', dot: '#b0aaa2', pillBg: 'rgba(176,170,162,0.15)', pillText: '#7a756e' },
    ];

    function detectSource(text) {
      for (const rule of SOURCE_RULES) {
        if (text.includes(`[${rule.key}]`) || text.includes(rule.key)) return rule;
      }
      return { key: '其他', label: '其他', dot: '#b0aaa2', pillBg: 'rgba(176,170,162,0.15)', pillText: '#7a756e' };
    }

    function detectPerson(text) {
      const colonIdx = text.indexOf('：');
      const colonIdx2 = text.indexOf(':');
      const idx = colonIdx !== -1 ? colonIdx : (colonIdx2 !== -1 ? colonIdx2 : -1);
      if (idx > 0) {
        const prefix = text.slice(0, idx);
        const bracketEnd = prefix.lastIndexOf(']');
        const name = bracketEnd !== -1 ? prefix.slice(bracketEnd + 1) : prefix;
        return name.replace(/^[-\s]+/, '').trim() || '未知联系人';
      }
      return '未知联系人';
    }

    function detectUrgency(text) {
      // 用户显式标记优先
      if (/\[高\]|【高】|\[紧急\]|【紧急】/.test(text)) {
        return { level: 'high', label: '紧急', pillBg: 'rgba(224,122,142,0.15)', pillText: '#b85a6a' };
      }
      if (/\[中\]|【中】|\[一般\]|【一般】/.test(text)) {
        return { level: 'mid', label: '一般', pillBg: 'rgba(212,160,84,0.15)', pillText: '#a67a32' };
      }
      if (/\[低\]|【低】|\[低优\]|【低优】/.test(text)) {
        return { level: 'low', label: '低优', pillBg: 'rgba(109,184,143,0.15)', pillText: '#3d8a62' };
      }

      // 自动规则兜底
      const high = /紧急|尽快|今晚|马上|立刻|截止|过期|逾期|@全体成员|必须|快来|救命|病危|危险|出事|住院|抢救/;
      const mid = /有空|方便|麻烦|请|一下|确认|问一下/;
      if (high.test(text)) return { level: 'high', label: '紧急', pillBg: 'rgba(224,122,142,0.15)', pillText: '#b85a6a' };
      if (mid.test(text)) return { level: 'mid', label: '一般', pillBg: 'rgba(212,160,84,0.15)', pillText: '#a67a32' };
      return { level: 'low', label: '低优', pillBg: 'rgba(109,184,143,0.15)', pillText: '#3d8a62' };
    }

    function detectNeedsReply(text) {
      return /[?？]|请|麻烦|方便|有空|确认|发我|回复|回我/.test(text);
    }

    function parseMessage(rawText) {
      const text = rawText.trim();
      if (!text) return null;
      const source = detectSource(text);
      const person = detectPerson(text);
      const urgency = detectUrgency(text);
      const needsReply = detectNeedsReply(text);
      let summary = text.replace(/^\[[^\]]+\]\s*/, '');
      if (summary.startsWith(person)) summary = summary.slice(person.length).replace(/^[:：]\s*/, '');
      // 去掉用户紧急度标记，避免显示在摘要里
      summary = summary.replace(/【[^】]+】|\[[^\]]+\]/g, '').trim();
      return { raw: text, source, person, urgency, needsReply, summary };
    }

    function parseAll(textBlock) {
      return textBlock.split(/\n/).map(line => parseMessage(line)).filter(Boolean);
    }

    let sourceChartInstance = null;
    let hourChartInstance = null;

    // ═══════════════════════════════════════════
    //  RENDER: Message List
    // ═══════════════════════════════════════════
    function renderMessageList(messages) {
      const container = document.getElementById('messageList');
      const countEl = document.getElementById('msgCount');
      if (!messages.length) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); font-size: 14px; padding: 40px 0;">暂无消息</p>';
        countEl.textContent = '';
        return;
      }
      countEl.textContent = `${messages.length} 条`;

      const urgencyOrder = { high: 0, mid: 1, low: 2 };
      const sorted = [...messages].sort((a, b) => urgencyOrder[a.urgency.level] - urgencyOrder[b.urgency.level]);

      container.innerHTML = sorted.map(m => `
        <div class="msg-row">
          <span class="msg-dot" style="background: ${m.source.dot};"></span>
          <span class="msg-name">${m.person}</span>
          <span class="msg-text">${m.summary}</span>
          <span class="msg-pill" style="background: ${m.urgency.pillBg}; color: ${m.urgency.pillText};">${m.urgency.label}</span>
          ${m.needsReply ? '<span class="msg-pill" style="background: rgba(224,122,142,0.12); color: #b85a6a;">待回</span>' : ''}
        </div>
      `).join('');
    }

    // ═══════════════════════════════════════════
    //  REPORT
    // ═══════════════════════════════════════════
    function generateReport(messages) {
      const total = messages.length;
      const highCount = messages.filter(m => m.urgency.level === 'high').length;
      const replyCount = messages.filter(m => m.needsReply).length;
      const sourceSet = new Set(messages.map(m => m.source.label));

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statUrgent').textContent = highCount;
      document.getElementById('statReply').textContent = replyCount;
      document.getElementById('statSources').textContent = sourceSet.size;

      const urgencyOrder = { high: 3, mid: 2, low: 1 };
      const top = [...messages].sort((a, b) => urgencyOrder[b.urgency.level] - urgencyOrder[a.urgency.level]).slice(0, 3);
      const unreplied = messages.filter(m => m.needsReply);

      const highlightsEl = document.getElementById('topHighlights');
      highlightsEl.innerHTML = top.length
        ? top.map(m => `
            <div class="report-item">
              <span class="report-item-dot" style="background: ${m.source.dot};"></span>
              <div style="min-width: 0;">
                <span style="font-size: 14px; font-weight: 600; color: var(--text);">${m.person}</span>
                <p style="font-size: 13px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${m.summary}</p>
              </div>
            </div>
          `).join('')
        : '<p style="font-size: 14px; color: var(--text-muted);">暂无</p>';

      const unrepliedEl = document.getElementById('unrepliedList');
      unrepliedEl.innerHTML = unreplied.length
        ? unreplied.map(m => `
            <div class="report-item">
              <span class="report-item-dot" style="background: ${m.source.dot};"></span>
              <div style="min-width: 0;">
                <span style="font-size: 14px; font-weight: 600; color: var(--text);">${m.person}</span>
                <p style="font-size: 13px; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${m.summary}</p>
              </div>
            </div>
          `).join('')
        : '<p style="font-size: 14px; color: var(--text-muted);">全部已回</p>';

      // AI Insight
      const sourceCounts = {};
      messages.forEach(m => { sourceCounts[m.source.label] = (sourceCounts[m.source.label] || 0) + 1; });
      const wxCount = sourceCounts['微信'] || 0;
      const wxRatio = total ? wxCount / total : 0;
      const familyKeywords = ['妈妈', '爸爸', '家人', '爸妈', '老公', '老婆'];
      const familyMsgs = messages.filter(m => familyKeywords.some(k => m.raw.includes(k)));
      const familyUnreplied = familyMsgs.filter(m => m.needsReply);

      let insights = [];
      if (wxRatio > 0.5) {
        insights.push(`今天你的注意力主要被微信占据，${Math.round(wxRatio * 100)}% 的消息来自微信。`);
      }
      if (unreplied.length > 3) {
        insights.push(`有 ${unreplied.length} 条消息等你回复，建议优先处理紧急度高的联系人。`);
      } else if (unreplied.length > 0) {
        insights.push(`有 ${unreplied.length} 条消息可能需要回复。`);
      }
      if (familyMsgs.length && familyUnreplied.length) {
        insights.push('家人今天给你发了消息，记得抽空回应。');
      }
      if (!insights.length) {
        insights.push('今天消息压力较小，继续保持清醒的收件节奏。');
      }
      const insightText = insights.join(' ');
      document.getElementById('aiInsight').textContent = insightText;
      document.getElementById('insightBanner').textContent = insightText;
    }

    // ═══════════════════════════════════════════
    //  CHARTS
    // ═══════════════════════════════════════════
    function getHourFromText(text) {
      const match = text.match(/(\d{1,2})[:：]\d{2}/);
      if (match) return parseInt(match[1], 10);
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = (hash + text.charCodeAt(i)) % 24;
      return hash;
    }

    function renderCharts(messages) {
      if (sourceChartInstance) sourceChartInstance.destroy();
      if (hourChartInstance) hourChartInstance.destroy();
      if (!messages.length) return;

      const sourceCounts = {};
      SOURCE_RULES.forEach(r => sourceCounts[r.label] = 0);
      messages.forEach(m => { sourceCounts[m.source.label] = (sourceCounts[m.source.label] || 0) + 1; });
      const sourceLabels = Object.keys(sourceCounts).filter(k => sourceCounts[k] > 0);
      const sourceData = sourceLabels.map(k => sourceCounts[k]);
      const sourceColors = sourceLabels.map(label => {
        const map = { '微信': '#6db88f', 'QQ': '#5ba4cf', '邮件': '#7c6fe0', '短信': '#d4a054', '系统通知': '#b0aaa2', '其他': '#b0aaa2' };
        return map[label] || '#b0aaa2';
      });

      const hourCounts = new Array(24).fill(0);
      messages.forEach(m => { hourCounts[getHourFromText(m.raw)]++; });
      const currentHour = new Date().getHours();
      const barColors = hourCounts.map((_, h) => h === currentHour ? '#7c6fe0' : 'rgba(124,111,224,0.18)');

      const sourceCtx = document.getElementById('sourceChart').getContext('2d');
      const hourCtx = document.getElementById('hourChart').getContext('2d');

      Chart.defaults.font.family = "'Outfit', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
      Chart.defaults.font.size = 12;
      Chart.defaults.color = '#7a756e';

      sourceChartInstance = new Chart(sourceCtx, {
        type: 'doughnut',
        data: {
          labels: sourceLabels,
          datasets: [{
            data: sourceData,
            backgroundColor: sourceColors,
            borderWidth: 3,
            borderColor: 'rgba(255,255,255,0.8)',
            hoverOffset: 8,
            hoverBorderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '58%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                padding: 16,
                usePointStyle: true,
                pointStyle: 'circle',
                font: { size: 12, weight: '500' },
                color: '#7a756e'
              }
            },
            tooltip: {
              backgroundColor: 'rgba(45,42,38,0.88)',
              cornerRadius: 12,
              padding: { top: 8, bottom: 8, left: 12, right: 12 },
              titleFont: { size: 13, weight: '600' },
              bodyFont: { size: 12 },
              displayColors: true,
              boxPadding: 4
            }
          }
        }
      });

      hourChartInstance = new Chart(hourCtx, {
        type: 'bar',
        data: {
          labels: Array.from({ length: 24 }, (_, i) => `${i}`),
          datasets: [{
            label: '消息数',
            data: hourCounts,
            backgroundColor: barColors,
            borderRadius: 6,
            barPercentage: 0.85
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              grid: { display: false },
              ticks: {
                font: { size: 9 },
                color: '#b0aaa2',
                maxRotation: 0,
                autoSkip: false
              },
              border: { display: false }
            },
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, font: { size: 11 }, color: '#b0aaa2', padding: 6 },
              grid: { color: 'rgba(0,0,0,0.04)', drawTicks: false },
              border: { display: false }
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(45,42,38,0.88)',
              cornerRadius: 12,
              padding: { top: 8, bottom: 8, left: 12, right: 12 },
              titleFont: { size: 13, weight: '600' },
              bodyFont: { size: 12 },
              callbacks: { title: function(items) { return items[0].label + ':00'; } }
            }
          }
        }
      });
    }

    // ═══════════════════════════════════════════
    //  MAIN FLOW
    // ═══════════════════════════════════════════
    let currentMessages = [];

    function runAnalysis() {
      const raw = document.getElementById('messageInput').value;
      const newMessages = parseAll(raw);
      if (!newMessages.length) return;
      currentMessages = [...currentMessages, ...newMessages];
      document.getElementById('messageInput').value = '';
      console.log('Parsed messages:', currentMessages);
      renderMessageList(currentMessages);
      generateReport(currentMessages);
      renderCharts(currentMessages);
    }

    function clearAll() {
      currentMessages = [];
      document.getElementById('messageInput').value = '';
      renderMessageList([]);
      generateReport([]);
      renderCharts([]);
    }

    function loadSamples() {
      currentMessages = parseAll(SAMPLE_MESSAGES);
      document.getElementById('messageInput').value = '';
      console.log('Loaded samples:', currentMessages);
      renderMessageList(currentMessages);
      generateReport(currentMessages);
      renderCharts(currentMessages);
    }

    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('loadSampleBtn').addEventListener('click', loadSamples);
    document.getElementById('parseBtn').addEventListener('click', runAnalysis);
  </script>
</body>
</html>
