<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生避难所 — 你的情绪，AI认真接住</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;600;700&family=Long+Cang&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --night-1:#0b0d1f;
    --night-2:#161433;
    --night-3:#241d49;
    --night-4:#3a2d63;
    --glow:#ffd89b;
    --glow-2:#ff9a6c;
    --glow-3:#ffb4a2;
    --moon:#f4e8c1;
    --pink:#f4a6b8;
    --lilac:#c8a8e9;
    --cream:#f5ecd9;
    --muted:#a89cc4;
    --muted-2:#6e6594;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Noto Serif SC',serif;
    color:var(--cream);
    background:radial-gradient(ellipse at 50% 0%, #241d49 0%, #161433 40%, #0b0d1f 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    line-height:1.8;
    position:relative;
    min-height:100vh;
  }
  /* 星空 canvas */
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  /* 远山剪影 */
  .skyline{
    position:fixed;bottom:0;left:0;width:100%;height:240px;z-index:0;pointer-events:none;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 240' preserveAspectRatio='none'><path d='M0,240 L0,180 L80,160 L160,178 L240,140 L320,170 L420,120 L520,160 L620,130 L740,168 L860,140 L980,176 L1100,142 L1220,170 L1340,150 L1440,176 L1440,240 Z' fill='%23090a18' opacity='.95'/><path d='M0,240 L0,210 L120,196 L260,214 L400,190 L540,210 L680,196 L820,214 L960,196 L1100,214 L1240,196 L1440,212 L1440,240 Z' fill='%23050610' opacity='.9'/></svg>") no-repeat bottom center;
    background-size:cover;
  }
  /* 月亮 */
  .moon{
    position:fixed;top:8%;right:10%;width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff8e0, #f4e8c1 50%, #e8d09a 80%, rgba(244,232,193,0) 100%);
    box-shadow:0 0 60px rgba(244,232,193,.35), 0 0 120px rgba(244,232,193,.18);
    z-index:0;opacity:.9;
  }
  .moon::after{content:'';position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 60% 40%, transparent 60%, rgba(0,0,0,.06) 100%)}

  .wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:56px 24px 80px}

  /* 顶部 */
  header{text-align:center;margin-bottom:40px;animation:fadeDown 1s ease both}
  .logo-orb{
    width:78px;height:78px;margin:0 auto 18px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff2d4, #ffd89b 35%, #ff9a6c 70%, #c2553a 100%);
    box-shadow:0 0 40px rgba(255,154,108,.55), 0 0 90px rgba(255,216,155,.3), inset 0 0 20px rgba(255,255,255,.25);
    position:relative;
    animation:breathe 4s ease-in-out infinite;
  }
  .logo-orb::before{content:'';position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(255,216,155,.2);animation:ripple 4s ease-in-out infinite}
  .logo-orb::after{content:'';position:absolute;inset:-36px;border-radius:50%;border:1px solid rgba(255,216,155,.1);animation:ripple 4s ease-in-out .8s infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes ripple{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.4);opacity:0}}
  h1{
    font-family:'ZCOOL XiaoWei',serif;
    font-size:clamp(34px,6vw,54px);
    letter-spacing:8px;
    background:linear-gradient(180deg,#fff8e0,#ffd89b 60%,#ff9a6c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 30px rgba(255,154,108,.25);
  }
  .tagline{font-family:'Long Cang',cursive;font-size:22px;color:var(--glow);letter-spacing:4px;margin-top:6px;opacity:.85}
  .sub{font-size:13px;color:var(--muted);letter-spacing:6px;margin-top:14px;font-family:'Noto Sans SC';font-weight:300}
  .sub::before,.sub::after{content:'·';margin:0 10px;color:var(--glow-2)}

  /* 倾诉卡 */
  .confess-card{
    background:linear-gradient(160deg, rgba(58,45,99,.55), rgba(22,20,51,.65));
    border:1px solid rgba(255,216,155,.18);
    border-radius:24px;
    padding:30px 30px 26px;
    backdrop-filter:blur(12px);
    box-shadow:0 20px 60px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;
    animation:fadeUp 1s .2s ease both;
  }
  .confess-card::before{
    content:'';position:absolute;inset:-1px;border-radius:24px;padding:1px;
    background:linear-gradient(135deg, rgba(255,216,155,.4), transparent 40%, transparent 60%, rgba(200,168,233,.3));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  .field-label{
    display:flex;align-items:center;gap:10px;
    font-family:'ZCOOL XiaoWei';font-size:18px;color:var(--glow);letter-spacing:2px;margin-bottom:14px;
  }
  .field-label .ln{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,216,155,.3),transparent)}
  textarea{
    width:100%;min-height:120px;resize:vertical;
    background:rgba(11,13,31,.5);
    border:1px solid rgba(255,216,155,.15);
    border-radius:14px;
    padding:16px 18px;
    color:var(--cream);font-family:'Noto Serif SC';font-size:16px;line-height:1.9;
    outline:none;transition:all .3s;
  }
  textarea::placeholder{color:var(--muted-2);font-style:italic}
  textarea:focus{border-color:rgba(255,216,155,.5);box-shadow:0 0 0 3px rgba(255,216,155,.1), inset 0 0 20px rgba(255,154,108,.05)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{
    cursor:pointer;padding:7px 14px;border-radius:20px;
    background:rgba(11,13,31,.4);border:1px solid rgba(168,156,196,.25);
    font-family:'Noto Sans SC';font-size:13px;color:var(--muted);
    transition:all .25s;display:inline-flex;align-items:center;gap:5px;
  }
  .chip:hover{border-color:rgba(255,216,155,.4);color:var(--cream)}
  .chip.active{background:linear-gradient(135deg,rgba(255,154,108,.3),rgba(255,216,155,.15));border-color:rgba(255,216,155,.6);color:var(--glow);box-shadow:0 0 16px rgba(255,154,108,.25)}

  .gen-row{display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap}
  .gen-btn{
    flex:1;min-width:200px;
    padding:16px 24px;
    font-family:'ZCOOL XiaoWei';font-size:20px;letter-spacing:6px;
    color:#2a1a0a;
    background:linear-gradient(135deg,#fff2d4,#ffd89b 50%,#ff9a6c);
    border:none;border-radius:14px;cursor:pointer;
    box-shadow:0 10px 30px rgba(255,154,108,.4), inset 0 1px 0 rgba(255,255,255,.5);
    transition:all .25s;position:relative;overflow:hidden;
  }
  .gen-btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(255,154,108,.55), inset 0 1px 0 rgba(255,255,255,.6)}
  .gen-btn:active{transform:translateY(0)}
  .gen-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .random-btn{
    padding:16px 20px;border-radius:14px;cursor:pointer;
    background:rgba(11,13,31,.4);border:1px solid rgba(168,156,196,.3);
    color:var(--muted);font-family:'Noto Sans SC';font-size:13px;
    transition:all .25s;
  }
  .random-btn:hover{border-color:rgba(255,216,155,.5);color:var(--cream)}

  /* 回应区 */
  .response-wrap{margin-top:36px;display:none;animation:fadeUp .8s ease both}
  .response-wrap.show{display:block}
  .resp-eyebrow{
    text-align:center;font-family:'Long Cang';font-size:20px;color:var(--glow);
    letter-spacing:6px;margin-bottom:18px;opacity:.8;
  }
  .resp-eyebrow::before,.resp-eyebrow::after{content:'❀';color:var(--glow-2);margin:0 12px;font-size:14px}
  .response-card{
    background:linear-gradient(165deg, rgba(58,45,99,.6), rgba(22,20,51,.7));
    border:1px solid rgba(255,216,155,.2);
    border-radius:24px;padding:36px 36px 30px;
    backdrop-filter:blur(12px);
    box-shadow:0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    position:relative;
  }
  .resp-glow{
    position:absolute;top:-40px;left:50%;transform:translateX(-50%);
    width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,154,108,.5), transparent 70%);
    filter:blur(20px);
  }
  .resp-part{margin-bottom:22px;animation:fadeUp .7s ease both}
  .resp-part:last-child{margin-bottom:0}
  .resp-part:nth-child(2){animation-delay:.2s}
  .resp-part:nth-child(3){animation-delay:.4s}
  .resp-part:nth-child(4){animation-delay:.6s}
  .part-label{
    font-family:'Long Cang';font-size:18px;letter-spacing:3px;
    display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;
  }
  .part-label .ic{font-size:16px}
  .part-label.t1{color:var(--pink)}
  .part-label.t2{color:var(--lilac)}
  .part-label.t3{color:var(--glow)}
  .part-text{font-size:17px;line-height:2;color:var(--cream);padding-left:4px}
  .part-text.analogy{font-style:italic;color:#e8dcc4}
  .part-text.warm{font-family:'ZCOOL XiaoWei';font-size:19px;color:var(--glow);letter-spacing:1px}

  .resp-sign{
    text-align:right;margin-top:24px;padding-top:18px;
    border-top:1px dashed rgba(255,216,155,.15);
    font-family:'Long Cang';font-size:18px;color:var(--muted);letter-spacing:2px;
  }
  .resp-sign .seal{color:var(--glow-2)}

  /* 情绪卡片 */
  .card-section{margin-top:40px;display:none;animation:fadeUp .8s .2s ease both}
  .card-section.show{display:block}
  .card-eyebrow{text-align:center;font-family:'ZCOOL XiaoWei';color:var(--muted);font-size:15px;letter-spacing:6px;margin-bottom:18px}
  .card-stage{display:flex;justify-content:center}
  .mood-card{
    width:360px;max-width:100%;aspect-ratio:3/4;border-radius:22px;
    position:relative;overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.5);
    cursor:default;
  }
  .mood-card .bg{position:absolute;inset:0;transition:all .5s}
  .mood-card .orb{
    position:absolute;top:18%;left:50%;transform:translateX(-50%);
    width:130px;height:130px;border-radius:50%;
    filter:blur(2px);
    animation:breathe 5s ease-in-out infinite;
  }
  .mood-card .stars-deco{position:absolute;inset:0}
  .mood-card .stars-deco span{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.7;animation:twinkle 3s ease-in-out infinite}
  .mood-card .quote{
    position:absolute;left:30px;right:30px;bottom:90px;
    font-family:'ZCOOL XiaoWei';font-size:24px;line-height:1.7;color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.5);letter-spacing:2px;
  }
  .mood-card .quote::before{content:'"';font-size:40px;color:rgba(255,255,255,.5);line-height:0;vertical-align:-10px;margin-right:4px}
  .mood-card .signature{
    position:absolute;left:30px;bottom:30px;
    font-family:'Long Cang';font-size:18px;color:rgba(255,255,255,.85);letter-spacing:3px;
  }
  .mood-card .signature::before{content:'';display:inline-block;width:18px;height:1px;background:rgba(255,255,255,.6);vertical-align:middle;margin-right:8px}
  .mood-card .tag{
    position:absolute;top:24px;right:24px;
    font-family:'Noto Sans SC';font-size:11px;letter-spacing:3px;
    color:rgba(255,255,255,.7);padding:4px 10px;border:1px solid rgba(255,255,255,.3);border-radius:12px;
  }

  .card-ops{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
  .op-btn{
    padding:11px 20px;border-radius:12px;cursor:pointer;
    font-family:'Noto Sans SC';font-size:13px;
    border:1px solid rgba(168,156,196,.3);background:rgba(11,13,31,.4);color:var(--muted);
    display:inline-flex;align-items:center;gap:6px;transition:all .25s;
  }
  .op-btn:hover{border-color:rgba(255,216,155,.5);color:var(--cream);background:rgba(255,154,108,.1)}
  .op-btn.primary{background:linear-gradient(135deg,rgba(255,154,108,.3),rgba(255,216,155,.15));border-color:rgba(255,216,155,.5);color:var(--glow)}

  /* 加载 */
  .loading{display:none;text-align:center;padding:30px}
  .loading.show{display:block}
  .load-orb{
    width:60px;height:60px;margin:0 auto 16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff2d4, #ffd89b 40%, #ff9a6c 80%);
    box-shadow:0 0 30px rgba(255,154,108,.5);
    animation:breathe 1.5s ease-in-out infinite;
  }
  .load-text{font-family:'Long Cang';color:var(--glow);font-size:18px;letter-spacing:4px}

  /* 空状态提示 */
  .hint{font-size:12px;color:var(--muted-2);margin-top:12px;text-align:center;font-family:'Noto Sans SC';letter-spacing:1px}

  /* toast */
  .toast{
    position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg,rgba(255,154,108,.95),rgba(255,216,155,.95));
    color:#2a1a0a;padding:12px 26px;border-radius:24px;font-size:14px;font-weight:500;
    box-shadow:0 8px 24px rgba(255,154,108,.4);opacity:0;transition:all .3s;z-index:100;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 动画 */
  @keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}

  footer{text-align:center;padding:40px 20px 20px;color:var(--muted-2);font-size:12px;font-family:'Noto Sans SC';letter-spacing:2px}
  footer .small{font-family:'Long Cang';font-size:16px;color:var(--muted);margin-bottom:6px;letter-spacing:4px}

  @media(max-width:560px){
    .wrap{padding:40px 16px 60px}
    .confess-card,.response-card{padding:24px 20px}
    .mood-card{width:100%}
  }
</style>
</head>

<canvas id="stars"></canvas>
<div class="moon"></div>
<div class="skyline"></div>

<div class="wrap">
  <header>

</div>

<footer>

<script>
/* ============== 星空 ============== */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');
  let W,H,stars;
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;
    stars=Array.from({length:Math.min(160,Math.floor(W*H/9000))},()=>({
      x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.4+.2,
      a:Math.random(),s:Math.random()*.02+.005,
      d:Math.random()<.5?1:-1,
      hue:Math.random()<.15?'rgba(255,216,155,':'rgba(232,213,242,'
    }));
  }
  function draw(){x.clearRect(0,0,W,H);
    stars.forEach(s=>{
      s.a+=s.s*s.d;if(s.a>1){s.a=1;s.d=-1}if(s.a<0){s.a=0;s.d=1}
      x.beginPath();x.arc(s.x,s.y,s.r,0,7);
      x.fillStyle=s.hue+s.a+')';x.fill();
      if(s.r>1){x.beginPath();x.arc(s.x,s.y,s.r*2.5,0,7);x.fillStyle=s.hue+(s.a*.2)+')';x.fill()}
    });
    requestAnimationFrame(draw);
  }
  resize();draw();addEventListener('resize',resize);
})();

/* ============== 情绪库 ============== */
const MOODS=[
  { id:'work', tag:'工作受气', em:'💼', chips:['加班','老板','同事','被骂','领导','项目','上班','开会','甲方','背锅','KPI'],
    theme:['#3a2d63','#1e1b3a'], orb:['#a8b4ff','#6e7bd6'],
    empathy:['我听到了，你今天真的撑得很辛苦。','这种委屈，换谁来都得憋一肚子气。','你不用假装"没事"，在这儿可以"有事"。','被这样对待，难受是正常的，不是你太脆弱。'],
    analogy:['你现在的状态，像一台同时开了28个标签页的浏览器——每个都在转圈，哪个都加载不出来。','这种委屈，像认真做了一上午的PPT，电脑死机前一秒没保存——明明都做了，却像什么都没发生。','你像被甲方改了18版的稿子——最初的热情早没了，只剩"都行你定"的虚无。','你像周一早晨的闹钟，按掉一个又响一个，而你还躺在周日的梦里没醒。'],
    warm:['今晚不用回任何消息，先把这口气喘匀。','今天的事，明天再想。现在的你，只需要躺下来。','你不是不够好，是这个世界今天对你太吵。','把工牌摘下来，今晚你只是你自己。'],
    quote:['被骂的一千次里，\n你撑住的那一次，才是真的你。','工资买的是你的时间，\n买不走你的体面。','你不是在打工，\n你是在打怪。']
  },

const GENERAL=MOODS.find(m=>m.id==='emo');

/* ============== 状态 ============== */
const state={ input:'', moodId:null, lastResp:null };

/* ============== 工具 ============== */
const $=s=>document.querySelector(s);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

/* 识别情绪 */
function detectMood(text){
  if(!text) return pick(MOODS);
  const t=text.toLowerCase();
  let best=null,bestScore=0;
  MOODS.forEach(m=>{
    let score=0;
    m.chips.forEach(c=>{ if(t.includes(c.toLowerCase())) score+=2; });
    // 关键词额外加分
    if(m.id==='work' && /班|薪|职|工|会议|汇报|deadline|ddl/.test(t)) score++;
    if(m.id==='love' && /他|她|喜欢|爱|分手|前任|对象|暗恋|表白/.test(t)) score++;
    if(m.id==='lonely' && /孤独|寂寞|一个人|没人|空|独/.test(t)) score++;
    if(m.id==='tired' && /累|疲惫|撑|熬|躺|没劲|倦/.test(t)) score++;
    if(m.id==='choice' && /选|纠结|犹豫|决定|怎么办|哪个/.test(t)) score++;
    if(m.id==='anxiety' && /焦虑|未来|害怕|担心|前途|迷茫|怎么办/.test(t)) score++;
    if(m.id==='insomnia' && /睡|失眠|夜里|凌晨|醒|梦/.test(t)) score++;
    if(m.id==='doubt' && /没用|废物|差|不行|配不上|不够好|自卑/.test(t)) score++;
    if(m.id==='emo' && /emo|丧|难受|哭|难过|低落|不开心/.test(t)) score++;
    if(score>bestScore){bestScore=score;best=m}
  });
  return bestScore>0?best:pick(MOODS);
}

/* 生成回应 */
function generateResponse(){
  const text=$('#input').value.trim();
  const mood = state.moodId ? MOODS.find(m=>m.id===state.moodId) : detectMood(text);
  const empathy=pick(mood.empathy);
  const analogy=pick(mood.analogy);
  const warm=pick(mood.warm);
  const quote=pick(mood.quote);
  state.lastResp={mood,empathy,analogy,warm,quote};
  return state.lastResp;
}

/* 渲染回应 */
function renderResponse(r){
  $('#rEmpathy').textContent=r.empathy;
  $('#rAnalogy').textContent=r.analogy;
  $('#rWarm').textContent=r.warm;
  $('#response').classList.add('show');
  renderCard(r);
  $('#cardSection').classList.add('show');
}

/* 渲染卡片 */
let cardStarTimer;
function renderCard(r){
  const m=r.mood;
  $('#cardBg').style.background=`linear-gradient(160deg, ${m.theme[0]}, ${m.theme[1]})`;
  $('#cardOrb').style.background=`radial-gradient(circle at 35% 30%, #fff, ${m.orb[0]} 40%, ${m.orb[1]} 80%)`;
  $('#cardOrb').style.boxShadow=`0 0 50px ${m.orb[0]}88, 0 0 100px ${m.orb[1]}44`;
  $('#cardTag').textContent=m.em + ' ' + m.tag;
  // 卡片内繁星
  const sd=$('#cardStars');
  sd.innerHTML='';
  for(let i=0;i<24;i++){
    const s=document.createElement('span');
    s.style.left=Math.random()*100+'%';
    s.style.top=Math.random()*100+'%';
    s.style.animationDelay=Math.random()*3+'s';
    s.style.opacity=Math.random()*.6+.2;
    sd.appendChild(s);
  }
  $('#cardQuote').textContent=r.quote;
}

/* ============== chips ============== */
function renderChips(){
  const box=$('#chips');
  box.innerHTML=MOODS.map(m=>`<span class="chip" data-id="${m.id}">${m.em} ${m.tag}</span>`).join('');
  box.querySelectorAll('.chip').forEach(el=>{
    el.onclick=()=>{
      if(state.moodId===el.dataset.id){state.moodId=null;el.classList.remove('active')}
      else{
        state.moodId=el.dataset.id;
        box.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        el.classList.add('active');
      }
    };
  });
}

/* ============== 交互 ============== */
function doGenerate(){
  const text=$('#input').value.trim();
  if(!text){
    toast('随便说一句就好，哪怕只是"难受"两个字');
    $('#input').focus();
    return;
  }
  $('#genBtn').disabled=true;
  $('#response').classList.remove('show');
  $('#cardSection').classList.remove('show');
  $('#loading').classList.add('show');
  const loadTexts=['正在认真听你说…','把你的话抱在怀里…','点亮一盏灯，等你说完…','整理你心里的毛线团…'];
  $('.load-text').textContent=pick(loadTexts);
  setTimeout(()=>{
    const r=generateResponse();
    renderResponse(r);
    $('#loading').classList.remove('show');
    $('#genBtn').disabled=false;
    // 滚动到回应
    setTimeout(()=>$('#response').scrollIntoView({behavior:'smooth',block:'center'}),100);
  }, 1400);
}

function doRegen(){
  if(!state.lastResp)return;
  const r=generateResponse();
  renderResponse(r);
  toast('换一种接法 ✦');
}
function doRecard(){
  if(!state.lastResp)return;
  // 同情绪换 quote
  const m=state.lastResp.mood;
  let q=pick(m.quote);
  while(q===state.lastResp.quote && m.quote.length>1) q=pick(m.quote);
  state.lastResp.quote=q;
  renderCard(state.lastResp);
  toast('卡片已换 ✦');
}
async function doSave(){
  if(!state.lastResp)return;
  toast('正在生成图片…');
  try{
    const canvas=await html2canvas($('#moodCard'),{scale:2,backgroundColor:null,useCORS:true,logging:false});
    const link=document.createElement('a');
    link.download=`人生避难所_${state.lastResp.mood.tag}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
    toast('卡片已保存 ✦');
  }catch(e){toast('保存失败，请重试');console.error(e)}
}

/* ============== 初始化 ============== */
renderChips();
$('#genBtn').onclick=doGenerate;
$('#regen').onclick=doRegen;
$('#recard').onclick=doRecard;
$('#saveCard').onclick=doSave;
$('#randomBtn').onclick=doRandom;
$('#input').addEventListener('keydown',e=>{ if(e.ctrlKey&&e.key==='Enter'){doGenerate()} });
