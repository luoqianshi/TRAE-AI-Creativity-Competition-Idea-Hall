<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智绘财税 - AI岗位能力画像与学习地图</title>
    <style>
        :root {
            --fiscal-blue: #0F172A;      /* 深蓝底色，代表严谨 */
            --fiscal-gold: #D97706;      /* 金色点缀，代表价值 */
            --accent-cyan: #06B6D4;      /* 科技青，代表AI */
            --card-bg: #1E293B;
            --text-light: #F1F5F9;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Roboto, "Microsoft YaHei", sans-serif; 
            background: var(--fiscal-blue); 
            color: var(--text-light); 
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 顶部导航/标题区 */
        header {
            padding: 80px 20px 60px;
            text-align: center;
            background: radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15), transparent 70%);
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
        }
        h1 { font-size: 3rem; margin-bottom: 15px; letter-spacing: 2px; }
        h1 span { color: var(--fiscal-gold); }
        .subtitle { font-size: 1.2rem; color: var(--text-muted); max-width: 600px; margin: 0 auto; }

        /* 核心容器 */
        .container { max-width: 1000px; margin: 0 auto; padding: 60px 20px; }

        /* 交互演示区 */
        .demo-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .demo-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .demo-title { font-size: 1.5rem; color: var(--accent-cyan); }
        
        /* 模拟雷达图区域 */
        .radar-placeholder {
            width: 100%;
            height: 250px;
            background: rgba(6, 182, 212, 0.05);
            border: 2px dashed rgba(6, 182, 212, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            font-size: 1.1rem;
            margin-bottom: 30px;
            transition: all 0.5s ease;
        }
        .radar-active {
            background: rgba(6, 182, 212, 0.15);
            border-style: solid;
            color: white;
        }

        /* 学习路径节点 */
        .path-nodes { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; }
        .node {
            min-width: 140px;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-left: 3px solid var(--text-muted);
            border-radius: 4px;
            opacity: 0;
            transform: translateX(20px);
            transition: all 0.4s ease;
        }
        .node.show { opacity: 1; transform: translateX(0); }
        .node h4 { font-size: 0.9rem; color: var(--fiscal-gold); margin-bottom: 5px; }
        .node p { font-size: 0.8rem; color: var(--text-muted); }

        /* 操作按钮 */
        .action-btn {
            background: linear-gradient(135deg, var(--accent-cyan), #0891B2);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(6, 182, 212, 0.4); }
        .action-btn:active { transform: scale(0.98); }

        /* 价值板块 */
        .value-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 40px; }
        .value-item { text-align: center; padding: 20px; }
        .value-num { font-size: 2.5rem; font-weight: 700; color: var(--fiscal-gold); }
        .value-label { font-size: 0.9rem; color: var(--text-muted); margin-top: 5px; }

        footer { text-align: center; padding: 40px; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 60px; }

        /* 移动端适配 */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .demo-card { padding: 25px; }
            .path-nodes { flex-direction: column; }
            .node { min-width: 100%; border-left: none; border-top: 3px solid var(--text-muted); }
        }
    </style>
</head>
<body>

<header>
    <h1>智绘<span>财税</span></h1>
    <p class="subtitle">基于LLM的财税岗位能力画像与个性化学习地图引擎<br>让专业成长有迹可循</p>
</header>

<div class="container">
    <div class="demo-card">
        <div class="demo-header">
            <span class="demo-title">📊 智能诊断演示</span>
            <button class="action-btn" id="startBtn">开始AI分析</button>
        </div>

        <div class="radar-placeholder" id="radarBox">
            等待上传岗位JD与员工简历...
        </div>

        <div class="path-nodes" id="pathContainer">
            <!-- 节点将由JS动态生成 -->
        </div>
    </div>

    <div class="value-grid">
        <div class="value-item">
            <div class="value-num">95%</div>
            <div class="value-label">JD能力提取准确率</div>
        </div>
        <div class="value-item">
            <div class="value-num">3x</div>
            <div class="value-label">人才盘点效率提升</div>
        </div>
        <div class="value-item">
            <div class="value-num">100%</div>
            <div class="value-label">个性化路径覆盖</div>
        </div>
    </div>
</div>

<footer>
    AI创意大赛 · 学习工作赛道 · 财税垂直领域解决方案<br>
    © 2024 Fiscal-AI Map System. Powered by LLM.
</footer>

<script>
    const btn = document.getElementById('startBtn');
    const radar = document.getElementById('radarBox');
    const pathBox = document.getElementById('pathContainer');

    // 模拟财税岗位的学习路径数据
    const fiscalPath = [
        { title: '税法新规解读', desc: '2024最新个税/企税政策' },
        { title: '金税四期实务', desc: '数电票与风险预警应对' },
        { title: '财务分析建模', desc: '从核算到管理会计转型' },
        { title: '合规风控演练', desc: '真实案例沙盘推演' }
    ];

    btn.addEventListener('click', () => {
        // 1. 重置状态
        pathBox.innerHTML = '';
        radar.classList.remove('radar-active');
        radar.innerText = '🔄 LLM 正在解析岗位JD...';
        btn.disabled = true;
        btn.innerText = '分析中...';

        // 2. 模拟分析过程
        setTimeout(() => {
            radar.innerText = '🔍 正在比对员工能力缺口...';
        }, 1000);

        setTimeout(() => {
            radar.classList.add('radar-active');
            radar.innerHTML = '✅ <strong>能力画像已生成</strong><br><span style="font-size:0.9rem; opacity:0.8;">识别出 4 项关键能力缺口</span>';
        }, 2200);

        // 3. 动态生成学习路径节点
        setTimeout(() => {
            fiscalPath.forEach((item, index) => {
                const node = document.createElement('div');
                node.className = 'node';
                node.innerHTML = `<h4>${item.title}</h4><p>${item.desc}</p>`;
                pathBox.appendChild(node);
                
                // 依次显示节点
                setTimeout(() => node.classList.add('show'), index * 200);
            });
            btn.disabled = false;
            btn.innerText = '重新分析';
        }, 3000);
    });
</script>

</body>
</html>
