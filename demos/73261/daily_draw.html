<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日抽签</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
        }

        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .date {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        /* 增加平滑过渡 */
        .lottery-box {
            position: relative;
            margin: 20px 0;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            transition: all 0.5s ease;
        }

        /* 隐藏桶的状态 */
        .lottery-box.hide-bucket {
            height: 0;
            margin: 0;
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        .cylinder {
            width: 120px;
            height: 180px;
            background: linear-gradient(135deg, #d4a574 0%, #c4956a 50%, #a67c52 100%);
            border-radius: 10px 10px 30px 30px;
            position: relative;
            box-shadow: 
                inset -10px 0 20px rgba(0, 0, 0, 0.2),
                inset 10px 0 20px rgba(255, 255, 255, 0.2),
                0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .cylinder::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 20px;
            background: linear-gradient(135deg, #8b5a2b, #6b4423);
            border-radius: 5px;
        }

        .cylinder::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 5px;
            background: #3d2914;
            border-radius: 3px;
        }

        .sticks {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: -1;
        }

        .stick {
            width: 8px;
            height: 80px;
            background: linear-gradient(90deg, #f5e6d3, #e8d5b7, #f5e6d3);
            border-radius: 4px;
            position: absolute;
            transform-origin: bottom center;
            box-shadow: inset -1px 0 2px rgba(0, 0, 0, 0.1);
        }

        .stick:nth-child(1) { transform: translateX(-20px) rotate(-10deg); }
        .stick:nth-child(2) { transform: translateX(-10px) rotate(-5deg); }
        .stick:nth-child(3) { transform: translateX(0); }
        .stick:nth-child(4) { transform: translateX(10px) rotate(5deg); }
        .stick:nth-child(5) { transform: translateX(20px) rotate(10deg); }
        .stick:nth-child(6) { transform: translateX(-15px) rotate(-8deg); }
        .stick:nth-child(7) { transform: translateX(15px) rotate(8deg); }

        .flying-stick {
            position: absolute;
            width: 8px;
            height: 80px;
            background: linear-gradient(90deg, #f5e6d3, #e8d5b7, #f5e6d3);
            border-radius: 4px;
            left: 50%;
            bottom: 100px;
            transform: translateX(-50%) rotate(45deg);
            opacity: 0;
            z-index: 3;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) rotate(-1deg); }
            20%, 40%, 60%, 80% { transform: translateX(5px) rotate(1deg); }
        }

        @keyframes flyUp {
            0% { 
                opacity: 1; 
                transform: translateX(-50%) rotate(45deg) translateY(0); 
            }
            100% { 
                opacity: 0; 
                transform: translateX(-50%) rotate(45deg) translateY(-150px); 
            }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 238, 173, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 238, 173, 0.8); }
        }

        .cylinder.shaking {
            animation: shake 0.5s ease-in-out infinite;
        }

        .flying-stick.flying {
            animation: flyUp 0.8s ease-out forwards;
        }

        /* 结果卡片容器 */
        .result-card {
            background: linear-gradient(135deg, #fff8e7 0%, #fff3cd 100%);
            border-radius: 20px;
            padding: 25px;
            margin-top: 10px;
            border: 2px solid #ffd93d;
            
            /* 使用 display: none 配合 opacity 实现丝滑动画 */
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .result-card.show {
            display: block;
            /* 延迟一丁点让 display: block 先生效，从而能触发 transition */
            animation: glow 2s ease-in-out infinite;
        }
        
        .result-card.fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        .result-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .result-title span {
            font-size: 2rem;
        }

        .result-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #34495e;
            margin-bottom: 20px;
            font-style: italic;
            font-weight: bold;
        }

        .result-meaning {
            font-size: 0.95rem;
            color: #7f8c8d;
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
            line-height: 1.6;
        }

        .draw-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(238, 90, 90, 0.4);
            margin-top: 10px;
        }

        .draw-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(238, 90, 90, 0.5);
        }

        .refresh-btn {
            background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(10, 189, 227, 0.4);
            margin-top: 20px;
        }

        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(10, 189, 227, 0.5);
        }

        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #95a5a6;
        }

        .stars {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 1.5rem;
            animation: twinkle 2s ease-in-out infinite;
        }

        .cloud {
            position: absolute;
            top: 40px;
            left: 20px;
            font-size: 1.2rem;
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 2rem; }
            .lottery-box { height: 220px; }
            .cylinder { width: 100px; height: 150px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="stars">✨</div>
        <div class="cloud">☁️</div>
        
        <h1>每日抽签</h1>
        <div class="date" id="date"></div>
        
        <div class="lottery-box" id="lotteryBox">
            <div class="cylinder" id="cylinder">
                <div class="sticks">
                    <div class="stick"></div>
                    <div class="stick"></div>
                    <div class="stick"></div>
                    <div class="stick"></div>
                    <div class="stick"></div>
                    <div class="stick"></div>
                    <div class="stick"></div>
                </div>
            </div>
            <div class="flying-stick" id="flyingStick"></div>
        </div>

        <button class="draw-btn" id="drawBtn">开始抽签</button>

        <div class="result-card" id="resultCard">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-text" id="resultText"></div>
            <div class="result-meaning" id="resultMeaning"></div>
            <button class="refresh-btn" id="refreshBtn">再抽一次</button>
        </div>

        <div class="footer">心诚则灵，每日一签</div>
    </div>

    <script>
        const lots = [
            { title: '大吉', emoji: '🎉', color: '#ff6b6b', text: '春风得意马蹄疾，一日看尽长安花', meaning: '今日运势极佳，心想事成。适合开展新计划、表白、投资等重要事项。贵人相助，诸事顺遂。' },
            { title: '中吉', emoji: '🌟', color: '#feca57', text: '山重水复疑无路，柳暗花明又一村', meaning: '虽有小波折，但终将迎来转机。保持耐心和信心，困难只是暂时的，转机就在前方。' },
            { title: '小吉', emoji: '🌸', color: '#ff9ff3', text: '满园春色关不住，一枝红杏出墙来', meaning: '今日小有收获，适合按部就班地推进计划。人际关系和谐，可能会有意外的小惊喜。' },
            { title: '吉', emoji: '✨', color: '#54a0ff', text: '采菊东篱下，悠然见南山', meaning: '运势平稳，心情舒畅。适合放松身心，享受生活。做事情顺其自然，反而会有好结果。' },
            { title: '末吉', emoji: '🍃', color: '#5f27cd', text: '行到水穷处，坐看云起时', meaning: '今日运势平平，宜静不宜动。遇到问题不要强求，保持平和心态，静待时机。' },
            { title: '小凶', emoji: '⚠️', color: '#ff9f43', text: '欲渡黄河冰塞川，将登太行雪满山', meaning: '今日可能遇到一些阻碍，建议谨慎行事。避免重大决策，多听他人意见，三思而后行。' },
            { title: '中凶', emoji: '🌧️', color: '#576574', text: '黑云压城城欲摧，甲光向日金鳞开', meaning: '今日压力较大，可能面临挑战。但逆境也是成长的机会，保持坚韧，终将突破困境。' },
            { title: '大凶', emoji: '🚫', color: '#2d3436', text: '长风破浪会有时，直挂云帆济沧海', meaning: '今日运势较低，诸事不宜。但塞翁失马，焉知非福。保持乐观，韬光养晦，静待时机。' }
        ];

        const dateEl = document.getElementById('date');
        const lotteryBox = document.getElementById('lotteryBox');
        const cylinderEl = document.getElementById('cylinder');
        const flyingStickEl = document.getElementById('flyingStick');
        const drawBtn = document.getElementById('drawBtn');
        const resultCard = document.getElementById('resultCard');
        const resultTitle = document.getElementById('resultTitle');
        const resultText = document.getElementById('resultText');
        const resultMeaning = document.getElementById('resultMeaning');
        const refreshBtn = document.getElementById('refreshBtn');

        function updateDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            dateEl.textContent = now.toLocaleDateString('zh-CN', options);
        }

        function drawLot() {
            drawBtn.disabled = true;
            cylinderEl.classList.add('shaking');
            
            setTimeout(() => {
                flyingStickEl.classList.add('flying');
            }, 600);

            setTimeout(() => {
                cylinderEl.classList.remove('shaking');
                flyingStickEl.classList.remove('flying');

                const randomLot = lots[Math.floor(Math.random() * lots.length)];
                
                resultTitle.innerHTML = `<span>${randomLot.emoji}</span><span style="color: ${randomLot.color}">${randomLot.title}</span>`;
                resultText.textContent = randomLot.text;
                resultMeaning.textContent = randomLot.meaning;

                // 核心修复：隐藏抽签桶，并优雅淡入结果卡片
                lotteryBox.classList.add('hide-bucket');
                drawBtn.style.display = 'none';
                
                resultCard.classList.add('show');
                setTimeout(() => {
                    resultCard.classList.add('fade-in');
                }, 50);

            }, 1400);
        }

        function reset() {
            resultCard.classList.remove('fade-in');
            
            setTimeout(() => {
                resultCard.classList.remove('show');
                lotteryBox.classList.remove('hide-bucket');
                drawBtn.style.display = 'inline-block';
                drawBtn.disabled = false;
            }, 400);
        }

        drawBtn.addEventListener('click', drawLot);
        refreshBtn.addEventListener('click', reset);

        updateDate();
    </script>
</body>
</html>
