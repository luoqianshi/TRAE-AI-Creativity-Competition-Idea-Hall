<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevShots - 工作台 DEMO</title>
<style>
@font-face {
  font-family: 'Instrument Sans';
  src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Instrument Sans';
  src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 700;
  font-display: swap;
}

:root {
  --bg: #0A0A0F;
  --bg2: #13131A;
  --bg3: #1A1A24;
  --ink: #F0F0F5;
  --muted: #8888A0;
  --rule: #2A2A3A;
  --accent: #6C5CE7;
  --accent2: #0984E3;
  --accent3: #00B894;
  --accent4: #FDCB6E;
  --gradient: linear-gradient(135deg, #6C5CE7 0%, #0984E3 50%, #00B894 100%);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body {
  font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--ink);
  height: 100vh;
  overflow: hidden;
}

/* ===== TOPBAR ===== */
.topbar {
  height: 52px;
  background: var(--bg2);
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  flex-shrink: 0;
}
.topbar .logo {
  font-size: 1.2rem;
  font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.topbar .badge {
  font-size: 0.7rem;
  background: rgba(0, 184, 148, 0.12);
  color: var(--accent3);
  padding: 0.25rem 0.6rem;
  border-radius: 4px;
  border: 1px solid rgba(0, 184, 148, 0.2);
}

/* ===== LAYOUT ===== */
.workspace {
  display: flex;
  height: calc(100vh - 52px);
}

/* ===== LEFT PANEL ===== */
.left-panel {
  width: 320px;
  background: var(--bg2);
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}
.panel-section {
  padding: 1.2rem;
  border-bottom: 1px solid var(--rule);
}
.panel-section:last-child { border-bottom: none; }

.section-title {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 0.8rem;
  font-weight: 600;
}

/* Upload */
.upload-zone {
  border: 2px dashed var(--rule);
  border-radius: 10px;
  padding: 2rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.upload-zone:hover {
  border-color: var(--accent);
  background: rgba(108, 92, 231, 0.04);
}
.upload-zone .upload-icon {
  font-size: 2rem;
  margin-bottom: 0.5rem;
}
.upload-zone p {
  font-size: 0.8rem;
  color: var(--muted);
}
.upload-zone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.thumb-strip {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.8rem;
  flex-wrap: wrap;
}
.thumb-strip .thumb {
  width: 56px;
  height: 56px;
  border-radius: 6px;
  border: 2px solid var(--rule);
  object-fit: cover;
  cursor: pointer;
  transition: border-color 0.2s;
}
.thumb-strip .thumb:hover, .thumb-strip .thumb.active {
  border-color: var(--accent);
}

/* Form */
.form-group { margin-bottom: 1rem; }
.form-group label {
  display: block;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 0.35rem;
}
.form-group input[type="text"],
.form-group textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--rule);
  border-radius: 6px;
  padding: 0.55rem 0.7rem;
  color: var(--ink);
  font-family: inherit;
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input[type="text"]:focus,
.form-group textarea:focus {
  border-color: var(--accent);
}
.form-group textarea {
  resize: vertical;
  min-height: 56px;
}
.char-count {
  font-size: 0.7rem;
  color: var(--muted);
  text-align: right;
  margin-top: 0.2rem;
}

/* Background options */
.bg-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.5rem;
}
.bg-option {
  aspect-ratio: 1;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  position: relative;
}
.bg-option:hover { transform: scale(1.05); }
.bg-option.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.3);
}
.bg-option .check-mark {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 16px;
  height: 16px;
  background: var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.6rem;
  color: white;
  opacity: 0;
}
.bg-option.active .check-mark { opacity: 1; }

/* Solid colors */
.bg-solid-1 { background: #1A1A2E; }
.bg-solid-2 { background: #16213E; }
.bg-solid-3 { background: #0F3460; }
.bg-solid-4 { background: #1B1B2F; }
.bg-solid-5 { background: #2D132C; }
.bg-solid-6 { background: #1A1A1A; }
.bg-solid-7 { background: #0D3B66; }
.bg-solid-8 { background: #1B4332; }

/* Gradients */
.bg-grad-1 { background: linear-gradient(135deg, #6C5CE7 0%, #0984E3 100%); }
.bg-grad-2 { background: linear-gradient(135deg, #E84393 0%, #6C5CE7 100%); }
.bg-grad-3 { background: linear-gradient(135deg, #00B894 0%, #0984E3 100%); }
.bg-grad-4 { background: linear-gradient(135deg, #FDCB6E 0%, #E17055 100%); }
.bg-grad-5 { background: linear-gradient(135deg, #2D3436 0%, #636E72 100%); }
.bg-grad-6 { background: linear-gradient(135deg, #6C5CE7 0%, #E84393 50%, #FDCB6E 100%); }
.bg-grad-7 { background: linear-gradient(135deg, #00CEC9 0%, #6C5CE7 100%); }
.bg-grad-8 { background: linear-gradient(135deg, #2D3436 0%, #0984E3 100%); }

/* ===== CENTER CANVAS ===== */
.center-canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.center-canvas::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(42,42,58,0.3) 1px, transparent 1px),
    linear-gradient(90deg, rgba(42,42,58,0.3) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.phone-frame {
  position: relative;
  width: 280px;
  height: 606px;
  border-radius: 36px;
  background: #1C1C1E;
  padding: 8px;
  box-shadow:
    0 0 0 2px #3A3A3C,
    0 25px 80px rgba(0,0,0,0.6),
    0 0 0 1px rgba(255,255,255,0.05) inset;
  z-index: 1;
  transition: transform 0.3s ease;
}

.phone-frame:hover {
  transform: scale(1.02);
}

.phone-screen {
  width: 100%;
  height: 100%;
  border-radius: 28px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* Screenshot area */
.screenshot-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.screenshot-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.screenshot-area .placeholder {
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
  padding: 2rem;
}

/* Text overlay */
.text-overlay {
  padding: 1.2rem 1.5rem 1.5rem;
  text-align: center;
}

.text-overlay .main-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: white;
  margin-bottom: 0.4rem;
  line-height: 1.3;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.text-overlay .desc-text {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.85);
  line-height: 1.5;
  text-shadow: 0 1px 4px rgba(0,0,0,0.3);
}

/* Notch */
.phone-notch {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 24px;
  background: #1C1C1E;
  border-radius: 0 0 14px 14px;
  z-index: 10;
}

/* ===== RIGHT PANEL ===== */
.right-panel {
  width: 260px;
  background: var(--bg2);
  border-left: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.right-panel .panel-section { padding: 1rem; }

.export-btn {
  width: 100%;
  padding: 0.7rem;
  background: var(--gradient);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 0.6rem;
}
.export-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
}

.info-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--muted);
  padding: 0.4rem 0;
  border-bottom: 1px solid var(--rule);
}
.info-row:last-child { border-bottom: none; }
.info-row span:first-child { color: var(--ink); }

/* Preview list */
.preview-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}
.preview-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.5rem;
  border-radius: 6px;
  background: var(--bg3);
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: all 0.2s;
}
.preview-item:hover, .preview-item.active {
  border-color: var(--accent);
}
.preview-item img {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  object-fit: cover;
  background: var(--bg);
}
.preview-item .p-info {
  flex: 1;
  min-width: 0;
}
.preview-item .p-title {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.preview-item .p-sub {
  font-size: 0.65rem;
  color: var(--muted);
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal-overlay.active { display: flex; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 16px;
  padding: 2rem;
  max-width: 500px;
  width: 90%;
  text-align: center;
}
.modal h3 {
  font-size: 1.2rem;
  margin-bottom: 1rem;
}
.modal p {
  color: var(--muted);
  font-size: 0.9rem;
  margin-bottom: 1.5rem;
}
.modal .modal-actions {
  display: flex;
  gap: 0.8rem;
  justify-content: center;
}
.modal .btn {
  padding: 0.6rem 1.5rem;
  border-radius: 6px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
}
.modal .btn-primary {
  background: var(--gradient);
  color: white;
}
.modal .btn-secondary {
  background: var(--bg3);
  color: var(--ink);
  border: 1px solid var(--rule);
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
  .right-panel { display: none; }
}
@media (max-width: 768px) {
  .left-panel { width: 260px; }
  .phone-frame { width: 220px; height: 476px; }
}
</style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
  <div class="logo">DevShots</div>
  <div class="badge">工作台 DEMO</div>
</div>

<!-- Workspace -->
<div class="workspace">

  <!-- Left Panel -->
  <div class="left-panel">

    <!-- Upload -->
    <div class="panel-section">
      <div class="section-title">上传截图</div>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">&#x1F4F7;</div>
        <p>点击或拖拽上传手机截图<br>支持 JPG / PNG</p>
        <input type="file" id="fileInput" accept="image/*" multiple>
      </div>
      <div class="thumb-strip" id="thumbStrip"></div>
    </div>

    <!-- Text -->
    <div class="panel-section">
      <div class="section-title">文案编辑</div>
      <div class="form-group">
        <label>主标题（6-12字）</label>
        <input type="text" id="mainTitle" placeholder="例如：智能记账助手" maxlength="12">
        <div class="char-count"><span id="titleCount">0</span> / 12</div>
      </div>
      <div class="form-group">
        <label>描述文字（16-36字）</label>
        <textarea id="descText" placeholder="例如：AI 自动识别消费，3秒完成记账，让理财变得轻松简单" maxlength="36"></textarea>
        <div class="char-count"><span id="descCount">0</span> / 36</div>
      </div>
    </div>

    <!-- Background -->
    <div class="panel-section">
      <div class="section-title">纯色背景</div>
      <div class="bg-options" id="solidBgOptions">
        <div class="bg-option bg-solid-1 active" data-bg="solid" data-color="#1A1A2E"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-solid-2" data-bg="solid" data-color="#16213E"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-solid-3" data-bg="solid" data-color="#0F3460"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-solid-4" data-bg="solid" data-color="#1B1B2F"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-solid-5" data-bg="solid" data-color="#2D132C"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-solid-6" data-bg="solid" data-color="#1A1A1A"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-solid-7" data-bg="solid" data-color="#0D3B66"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-solid-8" data-bg="solid" data-color="#1B4332"><span class="check-mark">&#x2713;</span></div>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">渐变背景</div>
      <div class="bg-options" id="gradBgOptions">
        <div class="bg-option bg-grad-1" data-bg="grad" data-grad="linear-gradient(135deg, #6C5CE7 0%, #0984E3 100%)"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-grad-2" data-bg="grad" data-grad="linear-gradient(135deg, #E84393 0%, #6C5CE7 100%)"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-grad-3" data-bg="grad" data-grad="linear-gradient(135deg, #00B894 0%, #0984E3 100%)"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-grad-4" data-bg="grad" data-grad="linear-gradient(135deg, #FDCB6E 0%, #E17055 100%)"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-grad-5" data-bg="grad" data-grad="linear-gradient(135deg, #2D3436 0%, #636E72 100%)"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-grad-6" data-bg="grad" data-grad="linear-gradient(135deg, #6C5CE7 0%, #E84393 50%, #FDCB6E 100%)"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-grad-7" data-bg="grad" data-grad="linear-gradient(135deg, #00CEC9 0%, #6C5CE7 100%)"><span class="check-mark">&#x2713;</span></div>
        <div class="bg-option bg-grad-8" data-bg="grad" data-grad="linear-gradient(135deg, #2D3436 0%, #0984E3 100%)"><span class="check-mark">&#x2713;</span></div>
      </div>
    </div>

  </div>

  <!-- Center Canvas -->
  <div class="center-canvas">
    <div class="phone-frame" id="phoneFrame">
      <div class="phone-notch"></div>
      <div class="phone-screen" id="phoneScreen">
        <div class="screenshot-area" id="screenshotArea">
          <div class="placeholder">
            <div style="font-size:2rem;margin-bottom:0.5rem;">&#x1F4F1;</div>
            上传截图后<br>将在此预览
          </div>
        </div>
        <div class="text-overlay" id="textOverlay">
          <div class="main-title" id="previewTitle">主标题</div>
          <div class="desc-text" id="previewDesc">描述文字将显示在这里</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="panel-section">
      <div class="section-title">导出</div>
      <button class="export-btn" id="exportBtn">&#x1F4E5; 导出 1290x2796 PNG</button>
      <div class="info-row">
        <span>尺寸</span>
        <span>1290 x 2796 px</span>
      </div>
      <div class="info-row">
        <span>比例</span>
        <span>6.7" iPhone 14 Pro Max</span>
      </div>
      <div class="info-row">
        <span>格式</span>
        <span>PNG</span>
      </div>
      <div class="info-row">
        <span>DPI</span>
        <span>72</span>
      </div>
    </div>

    <div class="panel-section">
      <div class="section-title">截图列表</div>
      <div class="preview-list" id="previewList">
        <div class="preview-item active" id="defaultPreview">
          <div style="width:32px;height:32px;border-radius:4px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:0.8rem;">&#x1F4F1;</div>
          <div class="p-info">
            <div class="p-title">截图 1</div>
            <div class="p-sub">待上传</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Export Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>&#x1F389; 截图已生成</h3>
    <p>1290 x 2796 的 App Store 截图已准备就绪，点击下方按钮下载。</p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="downloadBtn">下载 PNG</button>
      <button class="btn btn-secondary" id="closeModal">关闭</button>
    </div>
  </div>
</div>

<script>
(function() {
  // State
  var screenshots = [];
  var activeIndex = -1;
  var currentBg = { type: 'solid', value: '#1A1A2E' };

  // Elements
  var fileInput = document.getElementById('fileInput');
  var uploadZone = document.getElementById('uploadZone');
  var thumbStrip = document.getElementById('thumbStrip');
  var mainTitle = document.getElementById('mainTitle');
  var descText = document.getElementById('descText');
  var titleCount = document.getElementById('titleCount');
  var descCount = document.getElementById('descCount');
  var previewTitle = document.getElementById('previewTitle');
  var previewDesc = document.getElementById('previewDesc');
  var screenshotArea = document.getElementById('screenshotArea');
  var phoneScreen = document.getElementById('phoneScreen');
  var previewList = document.getElementById('previewList');
  var exportBtn = document.getElementById('exportBtn');
  var modalOverlay = document.getElementById('modalOverlay');
  var downloadBtn = document.getElementById('downloadBtn');
  var closeModal = document.getElementById('closeModal');

  // Upload
  uploadZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    uploadZone.style.borderColor = 'var(--accent)';
  });
  uploadZone.addEventListener('dragleave', function() {
    uploadZone.style.borderColor = '';
  });
  uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadZone.style.borderColor = '';
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', function(e) {
    handleFiles(e.target.files);
  });

  function handleFiles(files) {
    Array.from(files).forEach(function(file) {
      if (!file.type.startsWith('image/')) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        screenshots.push({ src: e.target.result, title: '', desc: '' });
        renderThumbs();
        renderPreviewList();
        if (screenshots.length === 1) selectScreenshot(0);
      };
      reader.readAsDataURL(file);
    });
  }

  function renderThumbs() {
    thumbStrip.innerHTML = '';
    screenshots.forEach(function(s, i) {
      var img = document.createElement('img');
      img.src = s.src;
      img.className = 'thumb' + (i === activeIndex ? ' active' : '');
      img.onclick = function() { selectScreenshot(i); };
      thumbStrip.appendChild(img);
    });
  }

  function renderPreviewList() {
    previewList.innerHTML = '';
    screenshots.forEach(function(s, i) {
      var item = document.createElement('div');
      item.className = 'preview-item' + (i === activeIndex ? ' active' : '');
      item.innerHTML =
        '<img src="' + s.src + '" alt="">' +
        '<div class="p-info">' +
          '<div class="p-title">截图 ' + (i + 1) + '</div>' +
          '<div class="p-sub">' + (s.title || '未命名') + '</div>' +
        '</div>';
      item.onclick = function() { selectScreenshot(i); };
      previewList.appendChild(item);
    });
  }

  function selectScreenshot(index) {
    activeIndex = index;
    var s = screenshots[index];
    screenshotArea.innerHTML = '<img src="' + s.src + '" alt="screenshot">';
    mainTitle.value = s.title || '';
    descText.value = s.desc || '';
    updateCounts();
    updatePreviewText();
    renderThumbs();
    renderPreviewList();
  }

  // Text input
  mainTitle.addEventListener('input', function() {
    updateCounts();
    updatePreviewText();
    if (activeIndex >= 0) screenshots[activeIndex].title = mainTitle.value;
    renderPreviewList();
  });
  descText.addEventListener('input', function() {
    updateCounts();
    updatePreviewText();
    if (activeIndex >= 0) screenshots[activeIndex].desc = descText.value;
  });

  function updateCounts() {
    titleCount.textContent = mainTitle.value.length;
    descCount.textContent = descText.value.length;
  }

  function updatePreviewText() {
    previewTitle.textContent = mainTitle.value || '主标题';
    previewDesc.textContent = descText.value || '描述文字将显示在这里';
  }

  // Background selection
  function setupBgOptions(containerId) {
    var container = document.getElementById(containerId);
    container.querySelectorAll('.bg-option').forEach(function(opt) {
      opt.addEventListener('click', function() {
        // Clear all active
        document.querySelectorAll('.bg-option').forEach(function(o) { o.classList.remove('active'); });
        opt.classList.add('active');
        if (opt.dataset.bg === 'solid') {
          currentBg = { type: 'solid', value: opt.dataset.color };
          phoneScreen.style.background = opt.dataset.color;
        } else {
          currentBg = { type: 'grad', value: opt.dataset.grad };
          phoneScreen.style.background = opt.dataset.grad;
        }
      });
    });
  }
  setupBgOptions('solidBgOptions');
  setupBgOptions('gradBgOptions');

  // Export
  exportBtn.addEventListener('click', function() {
    if (activeIndex < 0) {
      alert('请先上传截图');
      return;
    }
    generateScreenshot();
  });

  function generateScreenshot() {
    var canvas = document.createElement('canvas');
    canvas.width = 1290;
    canvas.height = 2796;
    var ctx = canvas.getContext('2d');
    var s = screenshots[activeIndex];

    // Background
    if (currentBg.type === 'grad') {
      var grad = ctx.createLinearGradient(0, 0, 1290, 2796);
      // Parse gradient stops (simplified)
      ctx.fillStyle = '#1A1A2E';
      ctx.fillRect(0, 0, 1290, 2796);
      // Apply gradient overlay
      var tempCanvas = document.createElement('canvas');
      tempCanvas.width = 1290;
      tempCanvas.height = 2796;
      var tctx = tempCanvas.getContext('2d');
      var lg = tctx.createLinearGradient(0, 0, 1290, 2796);
      if (currentBg.value.includes('#6C5CE7') && currentBg.value.includes('#0984E3')) {
        lg.addColorStop(0, '#6C5CE7');
        lg.addColorStop(1, '#0984E3');
      } else if (currentBg.value.includes('#E84393')) {
        lg.addColorStop(0, '#E84393');
        lg.addColorStop(1, '#6C5CE7');
      } else if (currentBg.value.includes('#00B894')) {
        lg.addColorStop(0, '#00B894');
        lg.addColorStop(1, '#0984E3');
      } else if (currentBg.value.includes('#FDCB6E')) {
        lg.addColorStop(0, '#FDCB6E');
        lg.addColorStop(1, '#E17055');
      } else if (currentBg.value.includes('636E72')) {
        lg.addColorStop(0, '#2D3436');
        lg.addColorStop(1, '#636E72');
      } else if (currentBg.value.includes('#00CEC9')) {
        lg.addColorStop(0, '#00CEC9');
        lg.addColorStop(1, '#6C5CE7');
      } else {
        lg.addColorStop(0, '#2D3436');
        lg.addColorStop(1, '#0984E3');
      }
      tctx.fillStyle = lg;
      tctx.fillRect(0, 0, 1290, 2796);
      ctx.drawImage(tempCanvas, 0, 0);
    } else {
      ctx.fillStyle = currentBg.value;
      ctx.fillRect(0, 0, 1290, 2796);
    }

    // Screenshot image
    var img = new Image();
    img.onload = function() {
      // Calculate aspect fit for screenshot area (top ~75%)
      var targetW = 1110;
      var targetH = 1860;
      var targetX = (1290 - targetW) / 2;
      var targetY = 80;
      var scale = Math.min(targetW / img.width, targetH / img.height);
      var drawW = img.width * scale;
      var drawH = img.height * scale;
      var drawX = targetX + (targetW - drawW) / 2;
      var drawY = targetY + (targetH - drawH) / 2;

      // Phone frame
      ctx.fillStyle = '#1C1C1E';
      roundRect(ctx, drawX - 16, drawY - 16, drawW + 32, drawH + 32, 40);
      ctx.fill();
      ctx.strokeStyle = '#3A3A3C';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Notch
      ctx.fillStyle = '#1C1C1E';
      roundRect(ctx, drawX + drawW/2 - 60, drawY - 16, 120, 32, 0, 0, 16, 16);
      ctx.fill();

      // Screenshot
      roundRect(ctx, drawX, drawY, drawW, drawH, 28);
      ctx.save();
      ctx.clip();
      ctx.drawImage(img, drawX, drawY, drawW, drawH);
      ctx.restore();

      // Text overlay
      var title = mainTitle.value || '主标题';
      var desc = descText.value || '';
      var textY = drawY + drawH + 60;

      // Title
      ctx.font = 'bold 64px "Instrument Sans", -apple-system, sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 4;
      ctx.fillText(title, 1290 / 2, textY);

      // Desc
      if (desc) {
        ctx.font = '32px "Instrument Sans", -apple-system, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 2;
        wrapText(ctx, desc, 1290 / 2, textY + 70, 1000, 48);
      }

      ctx.shadowColor = 'transparent';

      // Show modal
      modalOverlay.classList.add('active');

      // Download handler
      downloadBtn.onclick = function() {
        var link = document.createElement('a');
        link.download = 'devshots-appstore-' + Date.now() + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        modalOverlay.classList.remove('active');
      };
    };
    img.src = s.src;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    var words = text.split('');
    var line = '';
    var lines = [];
    for (var i = 0; i < words.length; i++) {
      var testLine = line + words[i];
      var metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && line !== '') {
        lines.push(line);
        line = words[i];
      } else {
        line = testLine;
      }
    }
    lines.push(line);
    lines.forEach(function(l, i) {
      ctx.fillText(l, x, y + i * lineHeight);
    });
  }

  closeModal.addEventListener('click', function() {
    modalOverlay.classList.remove('active');
  });
  modalOverlay.addEventListener('click', function(e) {
    if (e.target === modalOverlay) modalOverlay.classList.remove('active');
  });

})();
</script>
</body>
