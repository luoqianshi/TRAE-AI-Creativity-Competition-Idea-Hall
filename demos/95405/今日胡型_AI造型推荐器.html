<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日胡型 · AI 造型推荐器</title>
  <style>
    :root {
      --bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --success: #34d399;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); margin: 0; font-size: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
    }
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all .2s ease;
      position: relative;
      overflow: hidden;
    }
    .upload-area:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.06); }
    .upload-area input { display: none; }
    .upload-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .upload-text { color: var(--muted); font-size: .95rem; }
    .preview-wrap {
      display: none;
      text-align: center;
      margin-top: 16px;
    }
    .preview-wrap img, .preview-wrap canvas {
      max-width: 100%;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s, opacity .15s;
      margin-top: 16px;
    }
    .btn:hover { transform: translateY(-2px); opacity: .95; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .analysis {
      display: none;
      text-align: center;
    }
    .analysis.active { display: block; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .log { color: var(--muted); font-size: .9rem; min-height: 1.5em; }
    .result { display: none; }
    .result.active { display: block; }
    .tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: .9rem;
      margin-bottom: 12px;
    }
    .face-shape { font-size: 1.6rem; font-weight: 700; margin: 8px 0; }
    .reason { color: var(--muted); font-size: .95rem; line-height: 1.6; }
    .style-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .style-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }
    .style-card:hover, .style-card.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }
    .style-icon { font-size: 2rem; margin-bottom: 8px; }
    .style-name { font-weight: 600; font-size: .95rem; }
    .style-desc { color: var(--muted); font-size: .8rem; margin-top: 4px; }
    .tryon { display: none; margin-top: 24px; text-align: center; }
    .tryon.active { display: block; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
    }
    .control-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: .85rem;
      cursor: pointer;
      transition: .2s;
    }
    .control-btn:hover, .control-btn.active {
      border-color: var(--accent);
      color: var(--accent);
    }
    .report {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 16px;
    }
    .report.active { display: block; }
    .report h3 { margin-top: 0; color: var(--success); }
    .report p { color: var(--muted); font-size: .95rem; line-height: 1.6; }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      margin-top: 40px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>今日胡型</h1>
      <p class="subtitle">AI 胡须造型推荐器 · 上传自拍，找到最适合你的胡型</p>
    </header>

    <section class="card">
      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" />
        <div class="upload-icon">📸</div>
        <div class="upload-text">点击上传正脸自拍，或拖拽图片到此处</div>
        <div class="upload-text" style="font-size: .8rem; margin-top: 8px;">支持 JPG / PNG / WEBP</div>
      </div>
      <div class="preview-wrap" id="previewWrap">
        <canvas id="faceCanvas" width="600" height="600" style="max-width:100%; height:auto;"></canvas>
        <div>
          <button class="btn" id="analyzeBtn">🪒 AI 分析脸型</button>
          <button class="btn btn-secondary" id="reuploadBtn" style="margin-left:10px;">重新上传</button>
        </div>
      </div>
    </section>

    <section class="card analysis" id="analysisCard">
      <div class="spinner"></div>
      <div class="log" id="analysisLog">正在分析面部轮廓...</div>
    </section>

    <section class="card result" id="resultCard">
      <span class="tag" id="faceTag">脸型</span>
      <div class="face-shape" id="faceShape">椭圆脸</div>
      <div class="reason" id="reasonText">你的脸型比例均衡，适合多数胡型。</div>
      <h3 style="margin-top:24px; margin-bottom:8px;">推荐胡型</h3>
      <div class="style-grid" id="styleGrid"></div>
    </section>

    <section class="card tryon" id="tryonCard">
      <h3 style="margin-top:0;">一键试胡</h3>
      <div class="controls" id="styleControls"></div>
      <div class="report" id="reportBox">
        <h3>📋 我的胡型报告</h3>
        <p id="reportText"></p>
        <button class="btn" id="downloadBtn">保存报告</button>
      </div>
    </section>
  </div>

  <footer>
    本页面为 TRAE AI 创造力大赛 · 生活娱乐赛道创意 Demo
  </footer>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const previewWrap = document.getElementById('previewWrap');
    const faceCanvas = document.getElementById('faceCanvas');
    const ctx = faceCanvas.getContext('2d');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const reuploadBtn = document.getElementById('reuploadBtn');
    const analysisCard = document.getElementById('analysisCard');
    const analysisLog = document.getElementById('analysisLog');
    const resultCard = document.getElementById('resultCard');
    const tryonCard = document.getElementById('tryonCard');
    const styleGrid = document.getElementById('styleGrid');
    const styleControls = document.getElementById('styleControls');
    const reportBox = document.getElementById('reportBox');
    const reportText = document.getElementById('reportText');
    const downloadBtn = document.getElementById('downloadBtn');

    let uploadedImage = null;
    let currentStyle = null;
    let faceShapeKey = null;

    const styles = {
      clean: { name: '清爽无胡', icon: '🧼', desc: '干净少年感', color: 'rgba(255,255,255,0.15)' },
      stubble: { name: '短胡渣', icon: '🧔‍♂️', desc: '硬朗自然', color: 'rgba(80,60,50,0.35)' },
      goatee: { name: '山羊胡', icon: '🐐', desc: '拉长下巴线条', color: 'rgba(80,60,50,0.55)' },
      mustache: { name: '八字胡', icon: '🥸', desc: '复古有型', color: 'rgba(80,60,50,0.5)' },
      fullbeard: { name: '络腮胡', icon: '🦁', desc: '成熟气场', color: 'rgba(80,60,50,0.6)' }
    };

    const shapeRules = {
      round: {
        label: '圆脸',
        reason: '你的脸型轮廓圆润，适合用山羊胡或短胡渣增加下巴棱角，避免两侧过于蓬松。',
        best: ['goatee', 'stubble', 'mustache'],
        avoid: ['fullbeard']
      },
      square: {
        label: '方脸',
        reason: '你的下颌线条硬朗，适合短胡渣或络腮胡柔和轮廓，山羊胡也能突出下巴。',
        best: ['stubble', 'fullbeard', 'goatee'],
        avoid: ['mustache']
      },
      long: {
        label: '长脸',
        reason: '你的脸型偏长，络腮胡或八字胡能在视觉上增加横向宽度，避免下巴过尖。',
        best: ['fullbeard', 'mustache', 'stubble'],
        avoid: ['goatee']
      },
      oval: {
        label: '椭圆脸',
        reason: '你的脸型比例均衡，是最百搭的脸型，几乎任何胡型都能驾驭。',
        best: ['stubble', 'goatee', 'fullbeard', 'mustache', 'clean'],
        avoid: []
      },
      heart: {
        label: '心形脸',
        reason: '你的额头较宽、下巴偏尖，短胡渣或络腮胡能增加下巴量感，平衡整体比例。',
        best: ['stubble', 'fullbeard', 'mustache'],
        avoid: ['goatee']
      }
    };

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; });
    uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '';
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handleImage(file);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleImage(e.target.files[0]); });
    reuploadBtn.addEventListener('click', () => { fileInput.click(); });

    function handleImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImage = new Image();
        uploadedImage.onload = () => {
          drawOriginal();
          uploadArea.classList.add('hidden');
          previewWrap.style.display = 'block';
          resultCard.classList.remove('active');
          tryonCard.classList.remove('active');
        };
        uploadedImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function drawOriginal() {
      const w = uploadedImage.width;
      const h = uploadedImage.height;
      const size = 600;
      const scale = Math.max(size / w, size / h);
      const sw = w * scale, sh = h * scale;
      const sx = (size - sw) / 2, sy = (size - sh) / 2;
      faceCanvas.width = size; faceCanvas.height = size;
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, size, size);
      ctx.drawImage(uploadedImage, sx, sy, sw, sh);
    }

    function detectShape() {
      // 模拟 AI：根据图片宽高比推断脸型（演示用）
      const ratio = uploadedImage.width / uploadedImage.height;
      if (ratio > 1.25) return 'square';
      if (ratio < 0.85) return 'long';
      const r = Math.random();
      if (r < 0.3) return 'round';
      if (r < 0.55) return 'oval';
      return 'heart';
    }

    analyzeBtn.addEventListener('click', () => {
      if (!uploadedImage) return;
      analysisCard.classList.add('active');
      resultCard.classList.remove('active');
      tryonCard.classList.remove('active');
      const logs = ['正在定位面部关键点...', '正在分析下颌轮廓...', '正在匹配最佳胡型...', '生成推荐方案中...'];
      let i = 0;
      const timer = setInterval(() => {
        analysisLog.textContent = logs[i] || logs[logs.length - 1];
        i++;
        if (i >= logs.length) {
          clearInterval(timer);
          setTimeout(showResult, 400);
        }
      }, 500);
    });

    function showResult() {
      analysisCard.classList.remove('active');
      resultCard.classList.add('active');
      tryonCard.classList.add('active');
      faceShapeKey = detectShape();
      const rule = shapeRules[faceShapeKey];
      document.getElementById('faceTag').textContent = 'AI 识别脸型';
      document.getElementById('faceShape').textContent = rule.label;
      document.getElementById('reasonText').textContent = rule.reason;
      renderStyleCards(rule);
      renderTryonControls(rule);
      applyStyle(rule.best[0]);
    }

    function renderStyleCards(rule) {
      styleGrid.innerHTML = '';
      rule.best.forEach((key, idx) => {
        const s = styles[key];
        const div = document.createElement('div');
        div.className = 'style-card' + (idx === 0 ? ' active' : '');
        div.innerHTML = `<div class="style-icon">${s.icon}</div><div class="style-name">${s.name}</div><div class="style-desc">${s.desc}</div>`;
        div.addEventListener('click', () => {
          document.querySelectorAll('.style-card').forEach(c => c.classList.remove('active'));
          div.classList.add('active');
          applyStyle(key);
        });
        styleGrid.appendChild(div);
      });
    }

    function renderTryonControls(rule) {
      styleControls.innerHTML = '';
      Object.keys(styles).forEach(key => {
        const s = styles[key];
        const btn = document.createElement('button');
        btn.className = 'control-btn' + (rule.best.includes(key) ? '' : '');
        btn.textContent = s.icon + ' ' + s.name;
        btn.dataset.key = key;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          applyStyle(key);
        });
        styleControls.appendChild(btn);
      });
    }

    function applyStyle(styleKey) {
      currentStyle = styleKey;
      drawOriginal();
      if (styleKey === 'clean') { updateReport(); return; }
      const cx = faceCanvas.width / 2;
      const cy = faceCanvas.height * 0.62;
      const jawW = faceCanvas.width * 0.42;
      const jawH = faceCanvas.height * 0.24;
      ctx.fillStyle = styles[styleKey].color;
      ctx.filter = 'blur(8px)';
      ctx.beginPath();
      switch (styleKey) {
        case 'stubble':
          ctx.ellipse(cx, cy, jawW, jawH * 0.85, 0, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'goatee':
          ctx.ellipse(cx, cy + jawH * 0.3, jawW * 0.35, jawH * 0.7, 0, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'mustache':
          ctx.ellipse(cx - jawW * 0.22, cy - jawH * 0.55, jawW * 0.28, jawH * 0.18, -0.1, 0, Math.PI * 2);
          ctx.ellipse(cx + jawW * 0.22, cy - jawH * 0.55, jawW * 0.28, jawH * 0.18, 0.1, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'fullbeard':
          ctx.ellipse(cx, cy, jawW, jawH, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.ellipse(cx - jawW * 0.22, cy - jawH * 0.55, jawW * 0.26, jawH * 0.16, -0.05, 0, Math.PI * 2);
          ctx.ellipse(cx + jawW * 0.22, cy - jawH * 0.55, jawW * 0.26, jawH * 0.16, 0.05, 0, Math.PI * 2);
          ctx.fill();
          break;
      }
      ctx.filter = 'none';
      updateReport();
    }

    function updateReport() {
      reportBox.classList.add('active');
      const s = styles[currentStyle];
      const shape = shapeRules[faceShapeKey];
      reportText.innerHTML = `识别脸型为 <b>${shape.label}</b>，当前试戴 <b>${s.name}</b>。<br>${shape.reason}<br><br>💡 提示：这只是 AI 创意 Demo，真实剃须前建议先用修容 App 多试几次哦！`;
    }

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = '我的胡型报告.png';
      link.href = faceCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
