<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>非标报价AI 创意提案</title><body style="font-family:Arial,Microsoft YaHei,sans-serif;padding:40px;line-height:1.7;background:#0e1218;color:#edf4ff"><h1>非标报价AI</h1><h2>把老师傅的报价经验，变成可解释的报价草案</h2><p>面向 CNC 加工、模具厂、包装印刷和钣金加工等非标行业。用户输入客户需求后，系统分析工艺、生成报价草案、测算利润、提示风险，并输出可发给客户的报价解释。</p><h3>MVP流程</h3><ol><li>客户需求输入</li><li>AI分析工艺</li><li>生成报价草案</li><li>利润测算</li><li>风险提示</li><li>报价解释</li></ol><p>目标是帮助中小制造企业减少报价慢、报价错、经验不可复制的问题。</p></body></html>
