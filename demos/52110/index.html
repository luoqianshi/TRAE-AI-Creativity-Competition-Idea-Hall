<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>习惯追踪</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        bg: 'hsl(40, 20%, 97%)',
        surface: 'hsl(0, 0%, 100%)',
        text: 'hsl(220, 15%, 20%)',
        'text-muted': 'hsl(220, 10%, 50%)',
        primary: 'hsl(150, 55%, 42%)',
        'primary-light': 'hsl(150, 55%, 95%)',
        accent: 'hsl(200, 60%, 50%)',
        border: 'hsl(220, 15%, 90%)',
        'rate-high': 'hsl(142, 65%, 48%)',
        'rate-mid': 'hsl(38, 85%, 52%)',
        'rate-low': 'hsl(0, 65%, 52%)',
      }
    }
  }
};
</script>
<style>
*, *::before, *::after { box-sizing: border-box; }
img, video { max-width: 100%; height: auto; display: block; }
body { overflow-wrap: break-word; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes checkBounce {
  0% { transform: scale(1); }
  40% { transform: scale(1.25); }
  100% { transform: scale(1); }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes progressFill {
  from { width: 0%; }
}
.animate-fade-in { animation: fadeInUp 0.35s ease-out both; }
.animate-scale-in { animation: scaleIn 0.25s ease-out both; }
.animate-check { animation: checkBounce 0.3s ease-out; }
.animate-slide-down { animation: slideDown 0.25s ease-out both; }
.animate-progress { animation: progressFill 0.6s ease-out both; }

.tab-btn { transition: all 0.2s ease; }
.tab-btn.active { color: hsl(150, 55%, 42%); }
.tab-btn.active .tab-indicator { transform: scaleX(1); }
.tab-indicator { transform: scaleX(0); transition: transform 0.25s ease; }

.habit-check { transition: all 0.2s ease; cursor: pointer; }
.habit-check:hover { transform: scale(1.08); }

.calendar-cell {
  transition: all 0.15s ease;
  aspect-ratio: 1;
}
.calendar-cell:hover { transform: scale(1.05); box-shadow: 0 2px 12px rgba(0,0,0,0.1); }

.modal-overlay {
  transition: opacity 0.25s ease;
}
.modal-overlay.hidden { opacity: 0; pointer-events: none; }
.modal-overlay:not(.hidden) { opacity: 1; }

.stat-tab { transition: all 0.2s ease; }
.stat-tab.active { background: hsl(150, 55%, 42%); color: white; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: hsl(220, 15%, 20%); color: white; padding: 10px 24px;
  border-radius: 8px; font-size: 14px; z-index: 1000;
  animation: fadeInUp 0.3s ease-out;
  pointer-events: none;
}

@media (max-width: 640px) {
  .tab-btn span { font-size: 11px; }
  .calendar-cell { font-size: 12px; }
}
</style>
</head>
<body class="bg-bg text-text min-h-screen font-sans">

<div id="app" class="max-w-3xl mx-auto px-4 pb-24 sm:pb-8">

  <!-- Header -->
  <header class="pt-6 pb-4 sm:pt-8 sm:pb-6">
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">习惯追踪</h1>
    <p class="text-text-muted text-sm mt-1" id="header-date"></p>
  </header>

  <!-- Tab Navigation -->
  <nav class="flex gap-0 border-b border-border mb-6 overflow-x-auto" id="tab-nav">
    <button class="tab-btn active flex flex-col items-center gap-1 px-4 sm:px-6 py-3 relative min-w-0 flex-shrink-0" data-tab="today">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span class="text-xs font-medium">今日</span>
      <div class="tab-indicator absolute bottom-0 left-4 right-4 sm:left-6 sm:right-6 h-0.5 bg-primary rounded-full origin-center"></div>
    </button>
    <button class="tab-btn flex flex-col items-center gap-1 px-4 sm:px-6 py-3 relative min-w-0 flex-shrink-0" data-tab="calendar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="text-xs font-medium">日历</span>
      <div class="tab-indicator absolute bottom-0 left-4 right-4 sm:left-6 sm:right-6 h-0.5 bg-primary rounded-full origin-center"></div>
    </button>
    <button class="tab-btn flex flex-col items-center gap-1 px-4 sm:px-6 py-3 relative min-w-0 flex-shrink-0" data-tab="stats">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="text-xs font-medium">统计</span>
      <div class="tab-indicator absolute bottom-0 left-4 right-4 sm:left-6 sm:right-6 h-0.5 bg-primary rounded-full origin-center"></div>
    </button>
    <button class="tab-btn flex flex-col items-center gap-1 px-4 sm:px-6 py-3 relative min-w-0 flex-shrink-0" data-tab="manage">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      <span class="text-xs font-medium">管理</span>
      <div class="tab-indicator absolute bottom-0 left-4 right-4 sm:left-6 sm:right-6 h-0.5 bg-primary rounded-full origin-center"></div>
    </button>
  </nav>

  <!-- Tab: Today -->
  <section id="tab-today" class="animate-fade-in">
    <div class="bg-surface rounded-2xl p-5 sm:p-6 shadow-sm border border-border mb-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">今日待办</h2>
        <span class="text-sm text-text-muted" id="today-completion-text"></span>
      </div>
      <div class="w-full h-2 bg-border rounded-full overflow-hidden mb-5">
        <div class="h-full bg-primary rounded-full transition-all duration-500 ease-out animate-progress" id="today-progress-bar" style="width: 0%"></div>
      </div>
      <div id="today-habits" class="space-y-2"></div>
      <div id="today-empty" class="text-center py-8 text-text-muted hidden">
        <p class="text-sm">今天没有需要完成的事项</p>
      </div>
    </div>
  </section>

  <!-- Tab: Calendar -->
  <section id="tab-calendar" class="hidden animate-fade-in">
    <div class="bg-surface rounded-2xl p-5 sm:p-6 shadow-sm border border-border">
      <div class="flex items-center justify-between mb-5">
        <button id="cal-prev" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-bg transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2 class="text-lg font-semibold" id="cal-title"></h2>
        <button id="cal-next" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-bg transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center mb-2">
        <span class="text-xs text-text-muted font-medium py-1">日</span>
        <span class="text-xs text-text-muted font-medium py-1">一</span>
        <span class="text-xs text-text-muted font-medium py-1">二</span>
        <span class="text-xs text-text-muted font-medium py-1">三</span>
        <span class="text-xs text-text-muted font-medium py-1">四</span>
        <span class="text-xs text-text-muted font-medium py-1">五</span>
        <span class="text-xs text-text-muted font-medium py-1">六</span>
      </div>
      <div class="grid grid-cols-7 gap-1" id="cal-grid"></div>
      <div class="flex items-center justify-center gap-4 mt-4 text-xs text-text-muted">
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block" style="background:hsl(142,65%,48%)"></span> &ge;80%</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block" style="background:hsl(38,85%,52%)"></span> 50-80%</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block" style="background:hsl(0,65%,52%)"></span> &lt;50%</span>
        <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block border border-border" style="background:transparent"></span> 无数据</span>
      </div>
    </div>
  </section>

  <!-- Tab: Stats -->
  <section id="tab-stats" class="hidden animate-fade-in">
    <div class="bg-surface rounded-2xl p-5 sm:p-6 shadow-sm border border-border mb-4">
      <div class="flex gap-2 mb-5" id="stat-period-tabs">
        <button class="stat-tab active px-4 py-1.5 rounded-full text-sm font-medium border border-border transition-colors" data-period="week">本周</button>
        <button class="stat-tab px-4 py-1.5 rounded-full text-sm font-medium border border-border transition-colors" data-period="month">本月</button>
        <button class="stat-tab px-4 py-1.5 rounded-full text-sm font-medium border border-border transition-colors" data-period="year">本年</button>
      </div>
      <div class="mb-6">
        <h3 class="text-sm font-medium text-text-muted mb-3">各事项完成率</h3>
        <div style="height:260px"><canvas id="chart-bar"></canvas></div>
      </div>
      <div>
        <h3 class="text-sm font-medium text-text-muted mb-3">完成趋势</h3>
        <div style="height:260px"><canvas id="chart-line"></canvas></div>
      </div>
    </div>
  </section>

  <!-- Tab: Manage -->
  <section id="tab-manage" class="hidden animate-fade-in">
    <div class="bg-surface rounded-2xl p-5 sm:p-6 shadow-sm border border-border">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">事项管理</h2>
        <button id="btn-add-habit" class="flex items-center gap-1.5 px-4 py-2 bg-primary text-white rounded-lg text-sm font-medium hover:opacity-90 transition-opacity">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加事项
        </button>
      </div>
      <div id="manage-list" class="space-y-2"></div>
      <div id="manage-empty" class="text-center py-8 text-text-muted hidden">
        <p class="text-sm">还没有添加任何事项</p>
      </div>
    </div>
  </section>
</div>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay hidden fixed inset-0 bg-black/40 z-50 flex items-end sm:items-center justify-center" style="transition:opacity 0.25s ease">
  <div id="modal-content" class="bg-surface rounded-t-2xl sm:rounded-2xl w-full sm:max-w-md p-6 shadow-xl animate-slide-down" style="max-height:90vh;overflow-y:auto">
    <h3 class="text-lg font-semibold mb-4" id="modal-title">添加事项</h3>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-text-muted mb-1">事项名称</label>
        <input id="modal-name" type="text" class="w-full px-3 py-2 border border-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition" placeholder="例如：晨跑">
      </div>
      <div>
        <label class="block text-sm font-medium text-text-muted mb-1">颜色标记</label>
        <div class="flex gap-2 flex-wrap" id="modal-colors">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-text-muted mb-1">重复规则</label>
        <select id="modal-repeat" class="w-full px-3 py-2 border border-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition">
          <option value="daily">每天</option>
          <option value="weekly">每周</option>
          <option value="monthly">每月</option>
          <option value="yearly">每年</option>
        </select>
      </div>
      <div id="modal-weekdays" class="hidden">
        <label class="block text-sm font-medium text-text-muted mb-2">选择星期</label>
        <div class="flex gap-1.5 flex-wrap" id="modal-weekday-options"></div>
      </div>
      <div id="modal-monthdays" class="hidden">
        <label class="block text-sm font-medium text-text-muted mb-2">选择日期（可多选）</label>
        <div class="flex gap-1 flex-wrap" id="modal-monthday-options"></div>
      </div>
      <div id="modal-yearday" class="hidden">
        <label class="block text-sm font-medium text-text-muted mb-1">选择月日</label>
        <input id="modal-yeardate" type="date" class="w-full px-3 py-2 border border-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition">
      </div>
    </div>
    <div class="flex gap-3 mt-6">
      <button id="modal-cancel" class="flex-1 px-4 py-2.5 border border-border rounded-lg text-sm font-medium hover:bg-bg transition-colors">取消</button>
      <button id="modal-save" class="flex-1 px-4 py-2.5 bg-primary text-white rounded-lg text-sm font-medium hover:opacity-90 transition-opacity">保存</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
(function() {
  'use strict';

  // ============ CONSTANTS ============
  const STORAGE_KEY_HABITS = 'habit_tracker_habits';
  const STORAGE_KEY_RECORDS = 'habit_tracker_records';

  const COLOR_OPTIONS = [
    '#f59e0b', '#3b82f6', '#8b5cf6', '#06b6d4', '#ec4899',
    '#10b981', '#ef4444', '#f97316', '#6366f1', '#14b8a6',
    '#e11d48', '#a855f7'
  ];

  const DEFAULT_HABITS = [
    { id: 'h1', name: '早起锻炼', color: '#f59e0b', repeatType: 'daily', repeatDays: [], order: 0 },
    { id: 'h2', name: '阅读30分钟', color: '#3b82f6', repeatType: 'daily', repeatDays: [], order: 1 },
    { id: 'h3', name: '练字', color: '#8b5cf6', repeatType: 'daily', repeatDays: [], order: 2 },
    { id: 'h4', name: '喝水8杯', color: '#06b6d4', repeatType: 'daily', repeatDays: [], order: 3 },
    { id: 'h5', name: '冥想10分钟', color: '#ec4899', repeatType: 'daily', repeatDays: [], order: 4 },
    { id: 'h6', name: '每周大扫除', color: '#10b981', repeatType: 'weekly', repeatDays: [0], order: 5 },
  ];

  const WEEKDAY_NAMES = ['日', '一', '二', '三', '四', '五', '六'];

  // ============ STATE ============
  let habits = [];
  let records = {}; // { 'YYYY-MM-DD': { habitId: true/false } }
  let currentTab = 'today';
  let calYear, calMonth;
  let editingHabitId = null;
  let selectedColor = COLOR_OPTIONS[0];
  let selectedWeekdays = [];
  let selectedMonthdays = [];

  // ============ UTILS ============
  function todayStr() {
    const d = new Date();
    return fmtDate(d);
  }

  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function parseDate(str) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(dateStr, n) {
    const d = parseDate(dateStr);
    d.setDate(d.getDate() + n);
    return fmtDate(d);
  }

  function dayOfWeek(dateStr) {
    return parseDate(dateStr).getDay(); // 0=Sun
  }

  function dateInMonth(y, m, d) {
    return new Date(y, m, d);
  }

  function daysInMonth(y, m) {
    return new Date(y, m + 1, 0).getDate();
  }

  function firstDayOfMonth(y, m) {
    return new Date(y, m, 1).getDay();
  }

  // ============ DATA ============
  function loadData() {
    const h = localStorage.getItem(STORAGE_KEY_HABITS);
    const r = localStorage.getItem(STORAGE_KEY_RECORDS);
    if (h) {
      habits = JSON.parse(h);
    } else {
      habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
      saveHabits();
    }
    if (r) {
      records = JSON.parse(r);
    } else {
      generateMockRecords();
      saveRecords();
    }
  }

  function saveHabits() {
    localStorage.setItem(STORAGE_KEY_HABITS, JSON.stringify(habits));
  }

  function saveRecords() {
    localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
  }

  function generateMockRecords() {
    records = {};
    const today = new Date();
    // Generate 30 days of data
    for (let i = 29; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const ds = fmtDate(d);
      const dow = d.getDay();
      const dayOfMonth = d.getDate();
      const monthDay = `${d.getMonth() + 1}-${dayOfMonth}`;

      records[ds] = {};
      habits.forEach(h => {
        let applies = false;
        switch (h.repeatType) {
          case 'daily':
            applies = true;
            break;
          case 'weekly':
            applies = h.repeatDays.includes(dow);
            break;
          case 'monthly':
            applies = h.repeatDays.includes(dayOfMonth);
            break;
          case 'yearly':
            applies = h.repeatDays.includes(monthDay);
            break;
        }
        if (applies) {
          // Biased random: some habits have higher completion rates
          const baseRate = 0.7 + (h.order % 3) * 0.08;
          records[ds][h.id] = Math.random() < baseRate;
        }
      });
    }
  }

  function getHabitsForDate(dateStr) {
    const dow = dayOfWeek(dateStr);
    const dom = parseDate(dateStr).getDate();
    const md = `${parseDate(dateStr).getMonth() + 1}-${dom}`;
    return habits.filter(h => {
      switch (h.repeatType) {
        case 'daily': return true;
        case 'weekly': return h.repeatDays.includes(dow);
        case 'monthly': return h.repeatDays.includes(dom);
        case 'yearly': return h.repeatDays.includes(md);
        default: return false;
      }
    });
  }

  function getCompletionRate(dateStr) {
    const applicable = getHabitsForDate(dateStr);
    if (applicable.length === 0) return null;
    const dayRecords = records[dateStr] || {};
    let completed = 0;
    applicable.forEach(h => {
      if (dayRecords[h.id] === true) completed++;
    });
    return completed / applicable.length;
  }

  function getRateColor(rate) {
    if (rate === null) return 'transparent';
    if (rate >= 0.8) return 'hsl(142, 65%, 48%)';
    if (rate >= 0.5) return 'hsl(38, 85%, 52%)';
    return 'hsl(0, 65%, 52%)';
  }

  function getRateBgColor(rate) {
    if (rate === null) return 'transparent';
    if (rate >= 0.8) return 'hsla(142, 65%, 48%, 0.15)';
    if (rate >= 0.5) return 'hsla(38, 85%, 52%, 0.15)';
    return 'hsla(0, 65%, 52%, 0.12)';
  }

  // ============ TOAST ============
  function showToast(msg) {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.3s ease';
      setTimeout(() => el.remove(), 300);
    }, 1800);
  }

  // ============ TAB SWITCHING ============
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    document.querySelectorAll('#app > section').forEach(s => s.classList.add('hidden'));
    const section = document.getElementById(`tab-${tab}`);
    section.classList.remove('hidden');
    section.classList.add('animate-fade-in');
    setTimeout(() => section.classList.remove('animate-fade-in'), 350);

    if (tab === 'today') renderToday();
    else if (tab === 'calendar') renderCalendar();
    else if (tab === 'stats') setTimeout(() => renderStats(), 50);
    else if (tab === 'manage') renderManage();
  }

  // ============ TODAY TAB ============
  function renderToday() {
    const ts = todayStr();
    const applicable = getHabitsForDate(ts);
    const dayRecords = records[ts] || {};
    const container = document.getElementById('today-habits');
    const empty = document.getElementById('today-empty');
    const progressBar = document.getElementById('today-progress-bar');
    const completionText = document.getElementById('today-completion-text');

    if (applicable.length === 0) {
      container.innerHTML = '';
      empty.classList.remove('hidden');
      progressBar.style.width = '0%';
      completionText.textContent = '';
      return;
    }

    empty.classList.add('hidden');
    let completed = 0;
    applicable.forEach(h => { if (dayRecords[h.id] === true) completed++; });
    const rate = Math.round((completed / applicable.length) * 100);
    progressBar.style.width = rate + '%';
    completionText.textContent = `${completed}/${applicable.length} 已完成`;

    container.innerHTML = applicable.map((h, i) => {
      const done = dayRecords[h.id] === true;
      return `
        <div class="habit-check flex items-center gap-3 p-3 rounded-xl border border-border hover:border-primary/30 transition-all cursor-pointer animate-fade-in"
             style="animation-delay:${i * 0.04}s; background:${done ? getRateBgColor(1) : 'white'}"
             data-habit-id="${h.id}">
          <div class="w-6 h-6 rounded-md flex-shrink-0 flex items-center justify-center transition-all duration-200"
               style="background:${done ? h.color : 'white'}; border:2px solid ${done ? h.color : '#d1d5db'}">
            ${done ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
          </div>
          <span class="flex-1 text-sm font-medium ${done ? 'line-through text-text-muted' : ''}">${h.name}</span>
          <span class="text-xs px-2 py-0.5 rounded-full" style="background:${h.color}20; color:${h.color}">${getRepeatLabel(h)}</span>
        </div>
      `;
    }).join('');

    // Bind click events
    container.querySelectorAll('.habit-check').forEach(el => {
      el.addEventListener('click', function() {
        const hid = this.dataset.habitId;
        toggleHabit(hid, ts);
      });
    });
  }

  function getRepeatLabel(h) {
    switch (h.repeatType) {
      case 'daily': return '每天';
      case 'weekly': return '每周' + h.repeatDays.map(d => WEEKDAY_NAMES[d]).join('、');
      case 'monthly': return '每月' + h.repeatDays.join('、') + '号';
      case 'yearly': return '每年' + h.repeatDays.join('、');
      default: return '';
    }
  }

  function toggleHabit(habitId, dateStr) {
    if (!records[dateStr]) records[dateStr] = {};
    records[dateStr][habitId] = !records[dateStr][habitId];
    saveRecords();
    renderToday();
    // Also update calendar if visible
    if (currentTab === 'calendar') renderCalendar();
  }

  // ============ CALENDAR TAB ============
  function renderCalendar() {
    const now = new Date();
    if (calYear === undefined) { calYear = now.getFullYear(); calMonth = now.getMonth(); }

    document.getElementById('cal-title').textContent = `${calYear}年 ${calMonth + 1}月`;

    const grid = document.getElementById('cal-grid');
    const firstDay = firstDayOfMonth(calYear, calMonth);
    const totalDays = daysInMonth(calYear, calMonth);
    const todayStrVal = todayStr();

    let html = '';
    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) {
      html += '<div></div>';
    }
    // Day cells
    for (let d = 1; d <= totalDays; d++) {
      const dateStr = fmtDate(new Date(calYear, calMonth, d));
      const rate = getCompletionRate(dateStr);
      const isToday = dateStr === todayStrVal;
      const bgColor = getRateBgColor(rate);
      const dotColor = getRateColor(rate);

      html += `
        <div class="calendar-cell rounded-lg flex flex-col items-center justify-center text-sm cursor-pointer relative
          ${isToday ? 'ring-2 ring-primary ring-offset-1' : ''}"
          style="background:${bgColor}; min-height:40px"
          data-date="${dateStr}">
          <span class="font-medium ${isToday ? 'text-primary' : ''}" style="font-size:13px">${d}</span>
          ${rate !== null ? `<span class="w-1.5 h-1.5 rounded-full mt-0.5" style="background:${dotColor}"></span>` : ''}
        </div>
      `;
    }
    grid.innerHTML = html;

    // Click on day to see details or toggle
    grid.querySelectorAll('.calendar-cell[data-date]').forEach(cell => {
      cell.addEventListener('click', function() {
        const ds = this.dataset.date;
        showDayDetail(ds);
      });
    });
  }

  function showDayDetail(dateStr) {
    const applicable = getHabitsForDate(dateStr);
    const dayRecords = records[dateStr] || {};
    if (applicable.length === 0) {
      showToast('当天没有安排事项');
      return;
    }
    // Quick toggle: just toggle the first uncompleted or show a mini view
    // For simplicity, switch to today tab with that date concept
    // Actually let's just allow toggling from a quick popover
    // For now, switch to today tab (since we only have today view for toggling)
    // Better: create a quick inline toggle
    const allDone = applicable.every(h => dayRecords[h.id] === true);
    if (allDone) {
      showToast('当天全部完成 ✓');
    } else {
      // Toggle the first uncompleted habit
      const undone = applicable.find(h => !dayRecords[h.id]);
      if (undone) {
        toggleHabit(undone.id, dateStr);
        if (currentTab === 'calendar') renderCalendar();
        if (dateStr === todayStr()) renderToday();
      }
    }
  }

  document.getElementById('cal-prev').addEventListener('click', () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });

  // ============ STATS TAB ============
  let currentPeriod = 'week';
  let barChart = null;
  let lineChart = null;

  function renderStats() {
    renderCharts();
  }

  function getPeriodDates(period) {
    const today = new Date();
    const dates = [];
    if (period === 'week') {
      // Last 7 days
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        dates.push(fmtDate(d));
      }
    } else if (period === 'month') {
      // Last 30 days
      for (let i = 29; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        dates.push(fmtDate(d));
      }
    } else {
      // Last 12 months
      for (let i = 11; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
        dates.push(fmtDate(d));
      }
    }
    return dates;
  }

  function getPeriodLabel(period) {
    if (period === 'year') return '月';
    return '日';
  }

  function formatPeriodDate(dateStr, period) {
    if (period === 'year') {
      const [y, m] = dateStr.split('-');
      return `${parseInt(m)}月`;
    }
    const [, m, d] = dateStr.split('-');
    return `${parseInt(m)}/${parseInt(d)}`;
  }

  function renderCharts() {
    const period = currentPeriod;
    const dates = getPeriodDates(period);

    // Bar chart: per-habit completion rate
    const habitRates = habits.map(h => {
      let total = 0;
      let completed = 0;
      dates.forEach(ds => {
        const applicable = getHabitsForDate(ds);
        if (applicable.some(ah => ah.id === h.id)) {
          total++;
          const dr = records[ds] || {};
          if (dr[h.id] === true) completed++;
        }
      });
      return { name: h.name, color: h.color, rate: total > 0 ? Math.round((completed / total) * 100) : 0 };
    });

    const barCtx = document.getElementById('chart-bar').getContext('2d');
    if (barChart) barChart.destroy();
    barChart = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: habitRates.map(h => h.name),
        datasets: [{
          label: '完成率 (%)',
          data: habitRates.map(h => h.rate),
          backgroundColor: habitRates.map(h => h.color + '99'),
          borderColor: habitRates.map(h => h.color),
          borderWidth: 1.5,
          borderRadius: 6,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => `完成率: ${ctx.raw}%`
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            ticks: { callback: v => v + '%', font: { size: 11 } },
            grid: { color: 'hsl(220, 15%, 92%)' }
          },
          x: {
            ticks: { font: { size: 10 }, maxRotation: 45 },
            grid: { display: false }
          }
        }
      }
    });

    // Line chart: daily completion trend
    const trendData = dates.map(ds => {
      const rate = getCompletionRate(ds);
      return rate !== null ? Math.round(rate * 100) : null;
    });

    const lineCtx = document.getElementById('chart-line').getContext('2d');
    if (lineChart) lineChart.destroy();
    lineChart = new Chart(lineCtx, {
      type: 'line',
      data: {
        labels: dates.map(d => formatPeriodDate(d, period)),
        datasets: [{
          label: '完成率 (%)',
          data: trendData,
          borderColor: 'hsl(150, 55%, 42%)',
          backgroundColor: 'hsla(150, 55%, 42%, 0.08)',
          borderWidth: 2.5,
          pointBackgroundColor: 'hsl(150, 55%, 42%)',
          pointRadius: 3,
          pointHoverRadius: 6,
          fill: true,
          tension: 0.35,
          spanGaps: false,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.raw !== null ? `完成率: ${ctx.raw}%` : '无数据'
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            ticks: { callback: v => v + '%', font: { size: 11 } },
            grid: { color: 'hsl(220, 15%, 92%)' }
          },
          x: {
            ticks: { font: { size: 10 }, maxRotation: 45 },
            grid: { display: false }
          }
        }
      }
    });
  }

  document.getElementById('stat-period-tabs').addEventListener('click', function(e) {
    const btn = e.target.closest('.stat-tab');
    if (!btn) return;
    this.querySelectorAll('.stat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    renderCharts();
  });

  // ============ MANAGE TAB ============
  function renderManage() {
    const list = document.getElementById('manage-list');
    const empty = document.getElementById('manage-empty');

    if (habits.length === 0) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }

    empty.classList.add('hidden');
    list.innerHTML = habits.map((h, i) => `
      <div class="flex items-center gap-3 p-3 rounded-xl border border-border animate-fade-in" style="animation-delay:${i * 0.04}s">
        <div class="w-4 h-4 rounded-full flex-shrink-0" style="background:${h.color}"></div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium truncate">${h.name}</p>
          <p class="text-xs text-text-muted">${getRepeatLabel(h)}</p>
        </div>
        <button class="edit-habit w-8 h-8 flex items-center justify-center rounded-lg hover:bg-bg transition-colors flex-shrink-0" data-habit-id="${h.id}" title="编辑">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="delete-habit w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-50 transition-colors flex-shrink-0" data-habit-id="${h.id}" title="删除">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
      </div>
    `).join('');

    // Bind edit
    list.querySelectorAll('.edit-habit').forEach(btn => {
      btn.addEventListener('click', function() {
        openModal(this.dataset.habitId);
      });
    });
    // Bind delete
    list.querySelectorAll('.delete-habit').forEach(btn => {
      btn.addEventListener('click', function() {
        deleteHabit(this.dataset.habitId);
      });
    });
  }

  function deleteHabit(id) {
    if (!confirm('确定要删除这个事项吗？相关记录也会被清除。')) return;
    habits = habits.filter(h => h.id !== id);
    // Clean records
    Object.keys(records).forEach(ds => {
      delete records[ds][id];
      if (Object.keys(records[ds]).length === 0) delete records[ds];
    });
    saveHabits();
    saveRecords();
    renderManage();
    renderToday();
    showToast('事项已删除');
  }

  // ============ MODAL ============
  function openModal(habitId) {
    editingHabitId = habitId;
    const overlay = document.getElementById('modal-overlay');
    const title = document.getElementById('modal-title');

    if (habitId) {
      const h = habits.find(x => x.id === habitId);
      if (!h) return;
      title.textContent = '编辑事项';
      document.getElementById('modal-name').value = h.name;
      selectedColor = h.color;
      selectedWeekdays = h.repeatType === 'weekly' ? [...h.repeatDays] : [];
      selectedMonthdays = h.repeatType === 'monthly' ? [...h.repeatDays] : [];
      document.getElementById('modal-repeat').value = h.repeatType;
      if (h.repeatType === 'yearly' && h.repeatDays.length > 0) {
        const [mo, dy] = h.repeatDays[0].split('-');
        document.getElementById('modal-yeardate').value = `${new Date().getFullYear()}-${mo.padStart(2,'0')}-${dy.padStart(2,'0')}`;
      }
    } else {
      title.textContent = '添加事项';
      document.getElementById('modal-name').value = '';
      selectedColor = COLOR_OPTIONS[0];
      selectedWeekdays = [];
      selectedMonthdays = [];
      document.getElementById('modal-repeat').value = 'daily';
      document.getElementById('modal-yeardate').value = '';
    }

    renderColorOptions();
    renderWeekdayOptions();
    renderMonthdayOptions();
    updateRepeatOptions();
    overlay.classList.remove('hidden');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
    editingHabitId = null;
  }

  function renderColorOptions() {
    const container = document.getElementById('modal-colors');
    container.innerHTML = COLOR_OPTIONS.map(c => `
      <button class="color-option w-8 h-8 rounded-full border-2 transition-all flex items-center justify-center flex-shrink-0"
        style="background:${c}; border-color:${selectedColor === c ? '#333' : 'transparent'}"
        data-color="${c}">
        ${selectedColor === c ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ''}
      </button>
    `).join('');
    container.querySelectorAll('.color-option').forEach(btn => {
      btn.addEventListener('click', function() {
        selectedColor = this.dataset.color;
        renderColorOptions();
      });
    });
  }

  function renderWeekdayOptions() {
    const container = document.getElementById('modal-weekday-options');
    container.innerHTML = WEEKDAY_NAMES.map((name, idx) => `
      <button class="weekday-option w-9 h-9 rounded-lg text-xs font-medium border transition-all flex-shrink-0
        ${selectedWeekdays.includes(idx) ? 'bg-primary text-white border-primary' : 'border-border hover:border-primary/40'}"
        data-day="${idx}">${name}</button>
    `).join('');
    container.querySelectorAll('.weekday-option').forEach(btn => {
      btn.addEventListener('click', function() {
        const day = parseInt(this.dataset.day);
        if (selectedWeekdays.includes(day)) {
          selectedWeekdays = selectedWeekdays.filter(d => d !== day);
        } else {
          selectedWeekdays.push(day);
        }
        renderWeekdayOptions();
      });
    });
  }

  function renderMonthdayOptions() {
    const container = document.getElementById('modal-monthday-options');
    let html = '';
    for (let d = 1; d <= 31; d++) {
      html += `
        <button class="monthday-option w-9 h-9 rounded-lg text-xs font-medium border transition-all flex-shrink-0
          ${selectedMonthdays.includes(d) ? 'bg-primary text-white border-primary' : 'border-border hover:border-primary/40'}"
          data-day="${d}">${d}</button>
      `;
    }
    container.innerHTML = html;
    container.querySelectorAll('.monthday-option').forEach(btn => {
      btn.addEventListener('click', function() {
        const day = parseInt(this.dataset.day);
        if (selectedMonthdays.includes(day)) {
          selectedMonthdays = selectedMonthdays.filter(d => d !== day);
        } else {
          selectedMonthdays.push(day);
        }
        renderMonthdayOptions();
      });
    });
  }

  function updateRepeatOptions() {
    const rt = document.getElementById('modal-repeat').value;
    document.getElementById('modal-weekdays').classList.toggle('hidden', rt !== 'weekly');
    document.getElementById('modal-monthdays').classList.toggle('hidden', rt !== 'monthly');
    document.getElementById('modal-yearday').classList.toggle('hidden', rt !== 'yearly');
  }

  document.getElementById('modal-repeat').addEventListener('change', updateRepeatOptions);

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.getElementById('modal-save').addEventListener('click', function() {
    const name = document.getElementById('modal-name').value.trim();
    if (!name) { showToast('请输入事项名称'); return; }

    const repeatType = document.getElementById('modal-repeat').value;
    let repeatDays = [];

    if (repeatType === 'weekly') {
      repeatDays = [...selectedWeekdays].sort((a, b) => a - b);
      if (repeatDays.length === 0) { showToast('请至少选择一个星期'); return; }
    } else if (repeatType === 'monthly') {
      repeatDays = [...selectedMonthdays].sort((a, b) => a - b);
      if (repeatDays.length === 0) { showToast('请至少选择一个日期'); return; }
    } else if (repeatType === 'yearly') {
      const yd = document.getElementById('modal-yeardate').value;
      if (!yd) { showToast('请选择月日'); return; }
      const [, m, d] = yd.split('-');
      repeatDays = [`${parseInt(m)}-${parseInt(d)}`];
    }

    if (editingHabitId) {
      const h = habits.find(x => x.id === editingHabitId);
      if (h) {
        h.name = name;
        h.color = selectedColor;
        h.repeatType = repeatType;
        h.repeatDays = repeatDays;
      }
      showToast('事项已更新');
    } else {
      const newHabit = {
        id: 'h' + Date.now(),
        name,
        color: selectedColor,
        repeatType,
        repeatDays,
        order: habits.length,
      };
      habits.push(newHabit);
      showToast('事项已添加');
    }

    saveHabits();
    closeModal();
    renderManage();
    renderToday();
  });

  document.getElementById('btn-add-habit').addEventListener('click', () => openModal(null));

  // ============ INIT ============
  function init() {
    loadData();
    const now = new Date();
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    document.getElementById('header-date').textContent =
      `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${WEEKDAY_NAMES[now.getDay()]}`;

    // Tab navigation
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        switchTab(this.dataset.tab);
      });
    });

    // Initial render
    renderToday();

    // Handle window resize for charts
    window.addEventListener('resize', () => {
      if (currentTab === 'stats' && barChart && lineChart) {
        barChart.resize();
        lineChart.resize();
      }
    });
  }

  init();
})();
</script>
</body>
</html>
