<script>
const SHOTS = JSON.parse(document.getElementById('shot-data').textContent);
const list = document.getElementById('shotList');
const iframe = document.getElementById('preview');
const currentTitle = document.getElementById('currentTitle');
const currentMeta = document.getElementById('currentMeta');
function decodeHtml(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function loadShot(i) {
  const shot = SHOTS[i];
  [...document.querySelectorAll('.shotBtn')].forEach((b, idx) => b.classList.toggle('active', idx === i));
  currentTitle.textContent = `${shot.shot_id} · ${shot.title}`;
  currentMeta.textContent = `${shot.duration_sec ? shot.duration_sec + 's · ' : ''}${shot.html_container_ref || ''}`;
  iframe.srcdoc = decodeHtml(shot.html_b64);
}
SHOTS.forEach((shot, i) => {
  const btn = document.createElement('button');
  btn.className = 'shotBtn'; btn.type = 'button';
  btn.innerHTML = `<strong>${shot.shot_id}</strong><span>${shot.title}</span><em>${shot.duration_sec ? shot.duration_sec + 's · ' : ''}${shot.html_container_ref || ''}</em>`;
  btn.onclick = () => loadShot(i);
  list.appendChild(btn);
});
if (SHOTS.length) loadShot(0); else currentTitle.textContent = '未找到镜头';
</script>
</body>
</html>
