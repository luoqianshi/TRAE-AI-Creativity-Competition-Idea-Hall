<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI知识图谱导师</title>
<style>
  :root {
    --bg: #0a0d0c; --surface: #121918; --fg: #e4ece6; --dim: #5e7168;
    --accent: #00d68f; --accent2: rgba(0,214,143,0.12); --warm: #f0a030;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:'PingFang SC','Microsoft YaHei',sans-serif; height:100vh; overflow:hidden; }

  .app { display:flex; flex-direction:column; height:100vh; }

  /* 顶栏 */
  .topbar {
    display:flex; align-items:center; gap:16px; padding:14px 24px;
    background:var(--surface); border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .logo { font-weight:700; font-size:16px; }
  .logo em { font-style:normal; color:var(--accent); }
  .input-group { display:flex; gap:8px; flex:1; max-width:480px; }
  .input-group input {
    flex:1; padding:8px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.04); color:var(--fg); font-size:14px; outline:none;
  }
  .input-group input:focus { border-color:var(--accent); }
  .input-group button {
    padding:8px 20px; border-radius:8px; border:none;
    background:var(--accent); color:#000; font-weight:600; font-size:14px; cursor:pointer;
  }
  .input-group button:hover { opacity:0.85; }
  .chips { display:flex; gap:8px; margin-left:auto; }
  .chip {
    padding:5px 12px; border-radius:20px; font-size:12px; cursor:pointer;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08);
    transition:all .15s;
  }
  .chip:hover { border-color:var(--accent); color:var(--accent); }

  /* 主区域 */
  .main { flex:1; display:flex; position:relative; overflow:hidden; }

  /* 欢迎页 */
  .welcome {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; z-index:5;
    transition:opacity .4s, transform .4s;
  }
  .welcome.hide { opacity:0; transform:translateY(20px); pointer-events:none; }
  .welcome h1 { font-size:28px; font-weight:700; }
  .welcome h1 em { font-style:normal; color:var(--accent); }
  .welcome p { color:var(--dim); font-size:15px; max-width:400px; text-align:center; line-height:1.6; }
  .welcome .input-group { max-width:420px; width:100%; }
  .welcome .suggest { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .welcome .suggest .chip { font-size:13px; padding:6px 14px; }

  /* Canvas */
  .canvas-wrap { flex:1; position:relative; }
  canvas { display:block; width:100%; height:100%; }

  /* 信息面板 */
  .panel {
    width:300px; background:var(--surface); border-left:1px solid rgba(255,255,255,0.06);
    padding:20px; overflow-y:auto; display:none;
  }
  .panel.show { display:block; }
  .panel h3 { font-size:16px; margin-bottom:4px; }
  .panel .status { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; margin:8px 0; }
  .panel .status.completed { background:rgba(0,214,143,0.15); color:var(--accent); }
  .panel .status.current { background:rgba(240,160,48,0.15); color:var(--warm); }
  .panel .status.locked { background:rgba(255,255,255,0.05); color:var(--dim); }
  .panel .desc { color:var(--dim); font-size:13px; line-height:1.6; margin:10px 0; }
  .panel .tags { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
  .panel .tag { padding:2px 8px; border-radius:4px; font-size:11px; background:var(--accent2); color:var(--accent); }
  .panel .btn-row { display:flex; gap:8px; margin-top:14px; }
  .panel .btn {
    flex:1; padding:8px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);
    background:transparent; color:var(--fg); font-size:13px; cursor:pointer; text-align:center;
  }
  .panel .btn.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  .panel .btn:hover { opacity:0.85; }

  /* 底部标签栏 */
  .tabs {
    display:flex; background:var(--surface); border-top:1px solid rgba(255,255,255,0.06);
  }
  .tab {
    flex:1; padding:10px; text-align:center; font-size:13px; cursor:pointer;
    color:var(--dim); border-bottom:2px solid transparent; transition:all .15s;
  }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
  .tab:hover { color:var(--fg); }

  /* 学习路径视图 */
  .path-view { display:none; flex:1; overflow-y:auto; padding:24px; }
  .path-view.show { display:block; }
  .path-view h2 { font-size:20px; margin-bottom:16px; }
  .path-step {
    display:flex; gap:14px; margin-bottom:16px; padding:14px; border-radius:10px;
    background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06);
  }
  .path-step .num {
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; flex-shrink:0;
    background:var(--accent2); color:var(--accent);
  }
  .path-step.completed .num { background:var(--accent); color:#000; }
  .path-step.locked { opacity:0.4; }
  .path-step .info h4 { font-size:14px; margin-bottom:4px; }
  .path-step .info p { font-size:12px; color:var(--dim); }

  /* 测验视图 */
  .quiz-view { display:none; flex:1; overflow-y:auto; padding:24px; }
  .quiz-view.show { display:block; }
  .quiz-card {
    max-width:520px; margin:0 auto; padding:24px; border-radius:12px;
    background:var(--surface); border:1px solid rgba(255,255,255,0.06);
  }
  .quiz-card .topic { font-size:12px; color:var(--accent); margin-bottom:8px; }
  .quiz-card .question { font-size:16px; font-weight:500; margin-bottom:18px; line-height:1.5; }
  .quiz-option {
    padding:12px 16px; border-radius:8px; margin-bottom:8px; cursor:pointer;
    border:1px solid rgba(255,255,255,0.08); font-size:14px; transition:all .15s;
  }
  .quiz-option:hover { border-color:var(--accent); }
  .quiz-option.correct { border-color:var(--accent); background:var(--accent2); }
  .quiz-option.wrong { border-color:#f05050; background:rgba(240,80,80,0.1); }
  .quiz-option.disabled { pointer-events:none; opacity:0.7; }
  .quiz-feedback { margin-top:12px; padding:10px 14px; border-radius:8px; font-size:13px; display:none; }
  .quiz-feedback.show { display:block; }
  .quiz-feedback.correct { background:var(--accent2); color:var(--accent); }
  .quiz-feedback.wrong { background:rgba(240,80,80,0.1); color:#f05050; }
  .quiz-nav { display:flex; gap:8px; margin-top:16px; justify-content:center; }
  .quiz-nav button {
    padding:8px 20px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);
    background:transparent; color:var(--fg); cursor:pointer; font-size:13px;
  }
  .quiz-nav button.primary { background:var(--accent); color:#000; border-color:var(--accent); }

  /* 统计条 */
  .stats {
    position:absolute; top:12px; right:16px; display:flex; gap:16px;
    font-size:12px; color:var(--dim); z-index:2;
  }
  .stats span b { color:var(--fg); }

  /* Toast */
  .toast {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
    padding:10px 24px; border-radius:8px; background:var(--surface);
    border:1px solid rgba(255,255,255,0.1); font-size:13px; opacity:0;
    transition:all .3s; z-index:999; pointer-events:none;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="logo">知识图谱<em>导师</em></div>
    <div class="input-group">
      <input id="search" placeholder="输入学习主题..." value="机器学习" onkeydown="if(event.key==='Enter')go()">

    <div class="chips">

      <span class="chip" onclick="go('Python编程')">Python</span>
      <span class="chip" onclick="go('前端开发')">前端开发</span>
    </div>
  </div>

  <div class="main">
    <div class="welcome" id="welcome">
      <h1>你想学<em>什么</em>？</h1>
      <p>输入任意学习主题，AI 自动生成知识图谱、规划学习路径、创建自适应测验</p>
      <div class="input-group">
        <input id="welcome-input" placeholder="输入学习主题..." value="机器学习" onkeydown="if(event.key==='Enter')go()">
        <button onclick="go()">开始</button>
      </div>
      <div class="suggest">
        <span class="chip" onclick="go('机器学习')">机器学习</span>

        <span class="chip" onclick="go('Python编程')">Python 编程</span>
        <span class="chip" onclick="go('经济学')">经济学</span>
        <span class="chip" onclick="go('心理学')">心理学</span>
      </div>
    </div>

    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="c"></canvas>
      <div class="stats" id="stats" style="display:none">
        <span>节点 <b id="sn">0</b></span>
        <span>关联 <b id="se">0</b></span>
        <span>进度 <b id="sp">0%</b></span>
      </div>
    </div>

    <div class="panel" id="panel">
      <h3 id="pn">节点</h3>
      <div class="status" id="ps">未开始</div>
      <div class="desc" id="pd">点击节点查看详情</div>
      <div class="tags" id="pt"></div>
      <div class="btn-row">
        <button class="btn primary" onclick="markDone()">标记已学</button>
        <button class="btn" onclick="doQuiz()">测验</button>
      </div>
    </div>

    <div class="path-view" id="path-view"></div>
    <div class="quiz-view" id="quiz-view"></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('graph')">🕸️ 知识图谱</div>
    <div class="tab" onclick="switchTab('path')">🗺️ 学习路径</div>
    <div class="tab" onclick="switchTab('quiz')">📝 自适应测验</div>
  </div>
</div>

<div class="toast" id="toast"></div>

const DOMAINS = {
  '编程': {l1:['基础语法','数据结构','核心框架','工程实践'],l2Pre:['入门','进阶','实战']},
  '科学': {l1:['基础理论','实验方法','核心概念','前沿应用'],l2Pre:['原理','方法','应用']},
  '人文': {l1:['历史背景','核心思想','代表人物','现代影响'],l2Pre:['概述','深入','比较']},
  '商业': {l1:['基础概念','核心理论','实践方法','行业案例'],l2Pre:['入门','策略','案例']},
  '通用': {l1:['基础知识','核心概念','实践应用','进阶拓展'],l2Pre:['基础','进阶','实战']},
};

function generateForTopic(topic) {
  if (DB[topic]) return JSON.parse(JSON.stringify(DB[topic]));
  // 简单领域推断
  let domain = '通用';
  if (/编程|开发|代码|程序|语言/.test(topic)) domain = '编程';
  else if (/物理|化学|生物|数学|科学|医学/.test(topic)) domain = '科学';
  else if (/历史|哲学|文学|艺术|文化/.test(topic)) domain = '人文';
  else if (/经济|管理|营销|金融|商业/.test(topic)) domain = '商业';
  const tmpl = DOMAINS[domain];
  const nodes = [{id:'root',label:topic,type:'center',desc:`${topic}的知识体系与学习路径`,related:tmpl.l1.slice(0,2)}];
  const edges = [];
  const path = [];
  tmpl.l1.forEach((l1,i) => {
    const l1Id = `l1_${i+1}`;
    nodes.push({id:l1Id,label:l1,type:'l1',desc:`${topic}的${l1}方向`,related:[topic]});
    edges.push(['root',l1Id]);
    tmpl.l2Pre.forEach((pre,j) => {
      const l2Id = `l2_${i*3+j+1}`;
      nodes.push({id:l2Id,label:`${l1}${pre}`,type:'l2',desc:`${topic}${l1}方向的${pre}内容`,related:[l1]});
      edges.push([l1Id,l2Id]);
      if (path.length < 8) path.push({id:l2Id,title:`${l1}${pre}`,desc:`学习${topic}的${l1}${pre}`,topics:[l1,pre],status:path.length===0?'current':'locked'});
    });
  });
  const quizzes = [
    {topic:tmpl.l1[0],q:`关于${topic}的${tmpl.l1[0]}，以下哪个说法最准确？`,options:[`${topic}不需要${tmpl.l1[0]}`,`${tmpl.l1[0]}是${topic}的核心基础`,`${tmpl.l1[0]}与${topic}无关`,`${tmpl.l1[0]}已经过时`],answer:1,explain:`${tmpl.l1[0]}是学习${topic}的重要基础。`},
    {topic:tmpl.l1[1],q:`${topic}的${tmpl.l1[1]}主要研究什么？`,options:['表面现象','核心规律','历史沿革','市场分析'],answer:1,explain:`${tmpl.l1[1]}关注${topic}的核心规律和内在机制。`},
  ];
  return {nodes,edges,path,quizzes};
}

// ===== 状态 =====
let data = null, nodes = [], edges = [], selected = null, hovered = null, drag = null;
let dragOff = {x:0,y:0}, downPos = {x:0,y:0}, quizIdx = 0, quizCorrect = 0, quizWrong = 0, quizAnswered = new Set();

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ===== Canvas =====
function resize() {
  const wrap = canvas.parentElement;
  const r = wrap.getBoundingClientRect();
  canvas.width = r.width * 2; canvas.height = r.height * 2;
  ctx.setTransform(1,0,0,1,0,0); ctx.scale(2,2);
}

function build() {
  resize();
  const w = canvas.parentElement.getBoundingClientRect();
  const cx = w.width/2, cy = w.height/2;
  nodes = []; edges = [];
  const map = {};
  data.nodes.forEach((n,i) => {
    let x,y;
    if (n.type==='center') { x=cx; y=cy; }
    else if (n.type==='l1') {
      const l1=data.nodes.filter(n=>n.type==='l1'), idx=l1.indexOf(n);
      const a=(idx/l1.length)*Math.PI*2-Math.PI/2, r=Math.min(w.width,w.height)*0.22;
      x=cx+Math.cos(a)*r; y=cy+Math.sin(a)*r;
    } else {
      const l2=data.nodes.filter(n=>n.type==='l2'), idx=l2.indexOf(n);
      const a=(idx/l2.length)*Math.PI*2-Math.PI/6, r=Math.min(w.width,w.height)*0.38;
      x=cx+Math.cos(a)*r; y=cy+Math.sin(a)*r;
    }
    nodes.push({...n,x,y,r:n.type==='center'?12:n.type==='l1'?8:5,alpha:0});
    map[n.id]=nodes.length-1;
  });
  data.edges.forEach(([f,t])=>{ if(map[f]!==undefined&&map[t]!==undefined) edges.push([map[f],map[t]]); });
  // 动画
  let start=null;
  function anim(ts){
    if(!start)start=ts;
    nodes.forEach((n,i)=>{const d=i*50;if(ts-start>d)n.alpha=Math.min(1,(ts-start-d)/300);});
    draw();
    if(!nodes.every(n=>n.alpha>=1))requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
  updateStats();
}

function draw() {
  const w=canvas.parentElement.getBoundingClientRect();
  ctx.clearRect(0,0,w.width,w.height);
  // 网格
  ctx.strokeStyle='rgba(255,255,255,0.02)'; ctx.lineWidth=0.5;
  for(let x=0;x<w.width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,w.height);ctx.stroke();}
  for(let y=0;y<w.height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w.width,y);ctx.stroke();}
  // 边
  for(const[i,j]of edges){
    const a=nodes[i],b=nodes[j],al=Math.min(a.alpha,b.alpha)*0.3;
    if(al<0.01)continue;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=`rgba(0,214,143,${al})`;ctx.lineWidth=1;ctx.stroke();
  }
  // 节点
  for(const n of nodes){
    if(n.alpha<0.01)continue;
    const isH=hovered===n, isS=selected===n, r=n.r+(isH?3:0)+(isS?2:0);
    // 光晕
    if(n.type==='center'||isS){
      ctx.beginPath();ctx.arc(n.x,n.y,r+10,0,Math.PI*2);
      ctx.fillStyle=`rgba(0,214,143,${n.alpha*0.08})`;ctx.fill();
    }
    ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);
    if(n.status==='completed') ctx.fillStyle=`rgba(0,214,143,${n.alpha*0.9})`;
    else if(n.status==='current'||n.status==='in-progress') ctx.fillStyle=`rgba(240,160,48,${n.alpha*0.8})`;
    else ctx.fillStyle=`rgba(90,113,104,${n.alpha*0.6})`;
    if(isS){ctx.shadowColor='rgba(0,214,143,0.5)';ctx.shadowBlur=16;}
    ctx.fill();ctx.shadowBlur=0;
    if(isH||isS){ctx.strokeStyle=`rgba(0,214,143,${n.alpha*0.6})`;ctx.lineWidth=2;ctx.stroke();}
    if(n.alpha>0.3){
      const fs=n.type==='center'?14:n.type==='l1'?12:11;
      ctx.font=`${n.type==='center'?'bold ':''}${fs}px sans-serif`;
      ctx.textAlign='center';ctx.fillStyle=`rgba(228,236,230,${n.alpha})`;
      ctx.fillText(n.label,n.x,n.y+r+16);
    }
  }
}

function updateStats(){
  if(!nodes.length)return;
  document.getElementById('sn').textContent=nodes.length;
  document.getElementById('se').textContent=edges.length;
  const c=nodes.filter(n=>n.status==='completed').length;
  document.getElementById('sp').textContent=Math.round(c/nodes.length*100)+'%';
}

// ===== 交互 =====
canvas.addEventListener('mousemove',e=>{
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(drag){
    drag.x=Math.max(drag.r,Math.min(r.width-drag.r,mx-dragOff.x));
    drag.y=Math.max(drag.r,Math.min(r.height-drag.r,my-dragOff.y));
    draw();return;
  }
  let found=null;
  for(const n of nodes){if(Math.hypot(mx-n.x,my-n.y)<n.r+8){found=n;break;}}
  if(found!==hovered){hovered=found;canvas.style.cursor=found?'pointer':'grab';draw();}
});
canvas.addEventListener('mousedown',e=>{
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  downPos={x:mx,y:my};
  for(const n of nodes){if(Math.hypot(mx-n.x,my-n.y)<n.r+8){drag=n;dragOff={x:mx-n.x,y:my-n.y};canvas.style.cursor='grabbing';return;}}
});
canvas.addEventListener('mouseup',e=>{
  if(!drag)return;
  const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  if(Math.hypot(mx-downPos.x,my-downPos.y)<5) selectNode(drag);
  drag=null;canvas.style.cursor=hovered?'pointer':'grab';draw();
});
canvas.addEventListener('mouseleave',()=>{drag=null;hovered=null;draw();});

function selectNode(n){
  selected=n;
  document.getElementById('panel').classList.add('show');
  document.getElementById('pn').textContent=n.label;
  const ps=document.getElementById('ps');
  const st={completed:'已掌握',current:'学习中','in-progress':'学习中',locked:'待解锁','not-started':'未开始'};
  ps.textContent=st[n.status]||'未开始';
  ps.className='status '+(n.status||'locked');
  document.getElementById('pd').textContent=n.desc;
  const pt=document.getElementById('pt');
  pt.innerHTML='';
  (n.related||[]).forEach(r=>{const s=document.createElement('span');s.className='tag';s.textContent=r;pt.appendChild(s);});
  draw();
}

function markDone(){
  if(!selected)return;
  selected.status='completed';
  // 同步到data
  const dn=data.nodes.find(n=>n.id===selected.id);
  if(dn)dn.status='completed';
  const pn=data.path.find(p=>p.id===selected.id);
  if(pn){pn.status='completed';updatePathChain();}
  selectNode(selected);updateStats();
  toast(`已标记「${selected.label}」为已掌握`);
}

function updatePathChain(){
  let found=false;
  data.path.forEach(p=>{if(!found){if(p.status!=='completed'){p.status='current';found=true;}}else{p.status='locked';}});
}

function doQuiz(){switchTab('quiz');}

// ===== 视图切换 =====
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['graph','path','quiz'][i]===tab));
  document.getElementById('canvas-wrap').style.display=tab==='graph'?'':'none';
  document.getElementById('panel').style.display=tab==='graph'&&selected?'block':'none';
  document.getElementById('stats').style.display=tab==='graph'?'':'none';
  document.getElementById('path-view').className='path-view'+(tab==='path'?' show':'');
  document.getElementById('quiz-view').className='quiz-view'+(tab==='quiz'?' show':'');
  if(tab==='path')renderPath();
  if(tab==='quiz')renderQuiz();
  if(tab==='graph'){resize();draw();}
}

function renderPath(){
  if(!data)return;
  const el=document.getElementById('path-view');
  el.innerHTML=`<h2>${data.nodes[0].label} 学习路径</h2>`;
  data.path.forEach((s,i)=>{
    const cls=s.status==='completed'?'completed':s.status==='locked'?'locked':'';
    el.innerHTML+=`<div class="path-step ${cls}"><div class="num">${i+1}</div><div class="info"><h4>${s.title}</h4><p>${s.desc}</p></div></div>`;
  });
}

function renderQuiz(){
  if(!data||!data.quizzes.length)return;
  const el=document.getElementById('quiz-view');
  if(quizAnswered.size>=data.quizzes.length){
    const rate=quizCorrect+quizWrong>0?Math.round(quizCorrect/(quizCorrect+quizWrong)*100):0;
    el.innerHTML=`<div class="quiz-card"><div style="font-size:48px;text-align:center;margin:20px">${rate>=60?'🎉':'💪'}</div><h2 style="text-align:center">测验完成！</h2><p style="text-align:center;color:var(--dim);margin:10px 0">正确率 ${rate}%</p><div style="text-align:center"><button class="btn primary" onclick="resetQuiz()" style="padding:10px 30px;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:600;cursor:pointer">重新测验</button></div></div>`;
    return;
  }
  const q=data.quizzes[quizIdx%data.quizzes.length];
  const answered=quizAnswered.has(quizIdx%data.quizzes.length);
  let html=`<div class="quiz-card"><div class="topic">${q.topic}</div><div class="question">${q.q}</div><div class="options">`;
  q.options.forEach((opt,i)=>{
    let cls='quiz-option';
    if(answered){cls+=' disabled';if(i===q.answer)cls+=' correct';}
    html+=`<div class="${cls}" data-i="${i}" data-a="${q.answer}" data-e="${encodeURIComponent(q.explain)}">${'ABCD'[i]}. ${opt}</div>`;
  });
  html+=`</div><div class="quiz-feedback" id="qfb"></div>`;
  html+=`<div class="quiz-nav"><button onclick="quizIdx=Math.max(0,quizIdx-1);renderQuiz()">上一题</button><button class="primary" onclick="quizIdx++;renderQuiz()">下一题</button></div></div>`;
  el.innerHTML=html;
  el.querySelectorAll('.quiz-option').forEach(opt=>{
    opt.addEventListener('click',function(){
      if(this.classList.contains('disabled'))return;
      const idx=+this.dataset.i,ans=+this.dataset.a,exp=decodeURIComponent(this.dataset.e);
      quizAnswered.add(quizIdx%data.quizzes.length);
      this.parentElement.querySelectorAll('.quiz-option').forEach(o=>o.classList.add('disabled'));
      if(idx===ans){this.classList.add('correct');quizCorrect++;}else{this.classList.add('wrong');this.parentElement.children[ans].classList.add('correct');quizWrong++;}
      const fb=document.getElementById('qfb');
      fb.className='quiz-feedback show '+(idx===ans?'correct':'wrong');
      fb.textContent=(idx===ans?'✓ ':'✕ ')+exp;
      if(quizAnswered.size>=data.quizzes.length)setTimeout(renderQuiz,1200);
    });
  });
}

function resetQuiz(){quizIdx=0;quizCorrect=0;quizWrong=0;quizAnswered=new Set();renderQuiz();}

// ===== 主入口 =====
function go(topic) {
  topic = topic || document.getElementById('search').value.trim() || document.getElementById('welcome-input').value.trim();
  if(!topic){toast('请输入学习主题',true);return;}
  document.getElementById('search').value=topic;
  document.getElementById('welcome-input').value=topic;
  document.getElementById('welcome').classList.add('hide');
  data=generateForTopic(topic);
  // 重置状态
  selected=null;hovered=null;quizIdx=0;quizCorrect=0;quizWrong=0;quizAnswered=new Set();
  document.getElementById('panel').classList.remove('show');
  switchTab('graph');
  build();
  document.getElementById('stats').style.display='';
  toast(`已生成「${topic}」知识图谱`);
}

function toast(msg,err){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' error':'');
  void t.offsetWidth;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

window.addEventListener('resize',()=>{if(data){resize();draw();}});
resize();
</script>
