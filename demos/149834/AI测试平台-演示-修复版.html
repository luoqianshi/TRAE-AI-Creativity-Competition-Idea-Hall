<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>AI 测试平台 · 交互演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#1677ff;--pl:#e6f4ff;--s:#52c41a;--w:#fa8c16;--d:#ff4d4f;--bg:#f0f2f5;--c:#fff;--t:#1f1f1f;--t2:#666;--b:#e8e8e8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--t);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.app{display:flex;flex:1;overflow:hidden}
.sider{width:200px;background:#001529;color:rgba(255,255,255,.85);display:flex;flex-direction:column;flex-shrink:0}
.sider-logo{padding:16px 20px;font-size:16px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px}
.sider-logo .dot{width:8px;height:8px;background:var(--s);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sider-menu{flex:1;overflow-y:auto;padding:8px 0}
.sider-menu .gt{padding:8px 20px 4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.35)}
.sider-menu .item{padding:10px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:14px;transition:all .15s;border-left:3px solid transparent}
.sider-menu .item:hover{background:rgba(255,255,255,.08);color:#fff}
.sider-menu .item.active{background:rgba(22,119,255,.2);color:#fff;border-left-color:var(--p)}
.sider-menu .item .ic{font-size:16px;width:20px;text-align:center}
.sider-footer{padding:12px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:rgba(255,255,255,.4)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:48px;background:var(--c);border-bottom:1px solid var(--b);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.topbar .crumb{font-size:14px;color:var(--t2)}
.topbar .crumb .sep{margin:0 8px;color:#ccc}
.topbar .crumb .cur{color:var(--t);font-weight:500}
.topbar .spacer{flex:1}
.topbar .btn{padding:6px 14px;border:1px solid var(--b);border-radius:6px;background:var(--c);cursor:pointer;font-size:13px;color:var(--t2);transition:all .15s;display:flex;align-items:center;gap:6px}
.topbar .btn:hover{border-color:var(--p);color:var(--p)}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:20px;margin-bottom:16px}
.ct{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ct .ic{width:28px;height:28px;background:var(--pl);color:var(--p);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.form-row{display:flex;gap:12px;margin-bottom:12px;align-items:center}
.form-row label{width:90px;font-size:13px;color:var(--t2);flex-shrink:0;text-align:right}
.form-row input,.form-row textarea,.form-row select{flex:1;padding:8px 12px;border:1px solid var(--b);border-radius:6px;font-size:14px;font-family:inherit;outline:none}
.form-row textarea{min-height:80px;resize:vertical;line-height:1.6}
.btn-g{display:flex;gap:8px;margin-top:16px}
.bp{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.bp.primary{background:var(--p);color:#fff}
.bp.primary:hover{background:#4096ff}
.bp.ghost{background:var(--c);color:var(--t2);border:1px solid var(--b)}
.bp.ghost:hover{border-color:var(--p);color:var(--p)}
.bp.sm{padding:4px 12px;font-size:12px;border-radius:6px}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th,.dt td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--b)}
.dt th{background:#fafafa;font-weight:600;color:var(--t2);font-size:12px}
.dt tr:hover td{background:#fafafa}
.dt .id{font-family:monospace;font-size:12px;color:var(--t2)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag.green{background:#f6ffed;color:var(--s);border:1px solid #b7eb8f}
.tag.red{background:#fff1f0;color:var(--d);border:1px solid #ffa39e}
.tag.blue{background:var(--pl);color:var(--p);border:1px solid #adc6ff}
.tag.gray{background:#fafafa;color:var(--t2);border:1px solid var(--b)}
.tag.purple{background:#f9f0ff;color:#722ed1;border:1px solid #d3adf7}
  .tag.orange{background:#fff7e6;color:var(--w);border:1px solid #ffd591}
.pb{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin:8px 0}
.pb .fill{height:100%;background:var(--p);border-radius:3px;transition:width .3s}
.pb .fill.ok{background:var(--s)}
.log{background:#1a1a2e;border-radius:8px;padding:16px;font-family:monospace;font-size:12px;color:rgba(255,255,255,.8);max-height:300px;overflow-y:auto;line-height:1.8}
.log .ts{color:rgba(255,255,255,.35)}
.log .ok{color:#73d13d}
.log .inf{color:#69b1ff}
.step-tl{position:relative;padding-left:32px}
.step-tl::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--b)}
.step{position:relative;padding-bottom:20px}
.step:last-child{padding-bottom:0}
.step-dot{position:absolute;left:-32px;top:2px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;z-index:1}
.step-dot.p{background:#bfbfbf}.step-dot.r{background:var(--p);animation:pulse 1.5s infinite}
.step-dot.ok{background:var(--s)}.step-dot.err{background:var(--d)}
.step-box{background:#fafafa;border-radius:8px;padding:12px 16px}
.step-box .st{font-weight:600;font-size:14px;margin-bottom:4px}
.step-box .sd{font-size:12px;color:var(--t2)}
.browser{border:2px solid #e0e0e0;border-radius:12px;overflow:hidden;background:#fff;margin:16px 0}
.browser-bar{background:#f0f0f0;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e0e0e0}
.browser-bar .dots{display:flex;gap:4px}
.browser-bar .dots span{width:10px;height:10px;border-radius:50%}
.browser-bar .url{flex:1;background:#fff;border:1px solid #ddd;border-radius:4px;padding:4px 10px;font-size:12px;color:var(--t2);font-family:monospace}
.browser-view{padding:20px;min-height:180px;background:#fafafa;position:relative}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:var(--t2)}
.loading .spin{width:32px;height:32px;border:3px solid var(--b);border-top-color:var(--p);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 8px}
@keyframes spin{to{transform:rotate(360deg)}}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-box{padding:16px;border-radius:10px;text-align:center}
.stat-box .n{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-box .l{font-size:12px;color:var(--t2)}
.stat-box.blue{background:var(--pl);color:var(--p)}
.stat-box.green{background:#f6ffed;color:var(--s)}
.stat-box.orange{background:#fff7e6;color:var(--w)}
.stat-box.red{background:#fff1f0;color:var(--d)}
.hidden{display:none!important}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;font-size:14px;color:#fff;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.toast.success{background:var(--s)}.toast.error{background:var(--d)}.toast.info{background:var(--p)}
</style>
</head>
<body>
<div class="app">
  <div class="sider">
    <div class="sider-logo"><span class="dot"></span><span>AI 测试平台</span></div>
    <div class="sider-menu">
      <div class="gt">工作台</div>
      <div class="item active" onclick="nav('projects',this)"><span class="ic">📁</span><span>项目列表</span></div>
      <div class="gt">测试</div>
      <div class="item" onclick="nav('testcase',this)"><span class="ic">📋</span><span>用例管理</span></div>
      <div class="item" onclick="nav('flow',this)"><span class="ic">🎯</span><span>流程测试</span></div>
      <div class="item" onclick="nav('validation',this)"><span class="ic">🗄️</span><span>数据校验</span></div>
      <div class="item" onclick="nav('api',this)"><span class="ic">🔌</span><span>接口测试</span></div>
      <div class="gt">分析</div>
      <div class="item" onclick="nav('report',this)"><span class="ic">📊</span><span>测试报告</span></div>
      <div class="item" onclick="nav('settings',this)"><span class="ic">⚙️</span><span>系统设置</span></div>
    </div>
    <div class="sider-footer">v0.3.2 · Electron</div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="crumb"><span>工作台</span><span class="sep">/</span><span class="cur" id="pgT">项目列表</span></div>
      <div class="spacer"></div>
      <button class="btn" onclick="toast('演示模式：所有数据均为模拟','info')">ℹ️ 演示模式</button>
    </div>
    <div class="content" id="ctl"></div>
  </div>
</div>
<div class="toast hidden" id="tO"></div>
<script>
var SP={page:'projects',project:null,timer:null};
var PGS={
  projects:{t:'项目列表',r:rp},
  testcase:{t:'用例管理',r:rtc},
  flow:{t:'流程测试',r:rf},
  validation:{t:'数据校验',r:rv},
  api:{t:'接口测试',r:ra},
  report:{t:'测试报告',r:rr},
  settings:{t:'系统设置',r:rs}
};
var DP=[
  {id:'PRJ_001',name:'WMS 仓储系统',sys:'WMS',cases:47,flows:8,last:'07-15 14:32'},
  {id:'PRJ_002',name:'ERP 采购模块',sys:'ERP',cases:23,flows:5,last:'07-14 09:15'},
  {id:'PRJ_003',name:'电商订单中心',sys:'MALL',cases:156,flows:12,last:'07-13 16:48'}
];
var DF=[
  {id:'FLW_001',name:'百度搜索全流程',src:2,steps:5,st:2,es:3,last:'2分钟前'},
  {id:'FLW_002',name:'采购入库演示',src:2,steps:8,st:2,es:4,last:'10分钟前'},
  {id:'FLW_003',name:'登录异常分支',src:1,steps:4,st:2,es:3,last:'昨天'},
  {id:'FLW_004',name:'订单审核(录屏)',src:2,steps:12,st:1,es:null,last:null}
];

function nav(p,e){
  SP.page=p;
  document.querySelectorAll('.sider-menu .item').forEach(function(x){x.classList.remove('active')});
  if(e)e.classList.add('active');
  document.getElementById('pgT').textContent=PGS[p].t;
  PGS[p].r();
}
function toast(m,type){
  var t=document.getElementById('tO');
  t.textContent=m;t.className='toast '+(type||'info');t.classList.remove('hidden');
  clearTimeout(SP.timer);SP.timer=setTimeout(function(){t.classList.add('hidden')},3000);
}

function rp(){
  var h='';DP.forEach(function(p){
    h+='<tr><td class="id">'+p.id+'</td><td><strong>'+p.name+'</strong></td><td><span class="tag blue">'+p.sys+'</span></td><td>'+p.cases+'</td><td>'+p.flows+'</td><td>'+p.last+'</td><td><button class="bp ghost sm" onclick="ep(\''+p.id+'\',\''+p.name+'\')">进入</button> <button class="bp ghost sm" style="color:var(--d)" onclick="toast(\'演示：已模拟归档\',\'info\')">归档</button></td></tr>';
  });
  document.getElementById('ctl').innerHTML='<div class="stat-row"><div class="stat-box blue"><div class="n">3</div><div class="l">项目总数</div></div><div class="stat-box green"><div class="n">226</div><div class="l">用例总数</div></div><div class="stat-box orange"><div class="n">25</div><div class="l">流程总数</div></div><div class="stat-box red"><div class="n">12</div><div class="l">今日执行</div></div></div><div class="card"><div class="ct"><span class="ic">📁</span> 项目列表</div><button class="bp primary" style="margin-bottom:16px" onclick="toast(\'演示：新建项目已模拟\',\'success\')">+ 新建项目</button><table class="dt"><thead><tr><th>项目 ID</th><th>名称</th><th>系统</th><th>用例</th><th>流程</th><th>最近执行</th><th>操作</th></tr></thead><tbody>'+h+'</tbody></table></div>';
}
function ep(id,name){SP.project={id:id,name:name};nav('flow');toast('已进入「'+name+'」','success');}

function rf(){
  var pn=SP.project?SP.project.name:'未选择项目',h='';
  DF.forEach(function(f){
    var st=['','草稿','已确认','执行中','已完成'][f.st];
    var es=f.es?['','待执行','执行中','通过','失败'][f.es]:'-';
    var ec=f.es===3?'green':f.es===4?'red':'gray';
    h+='<tr><td class="id">'+f.id+'</td><td><strong>'+f.name+'</strong></td><td><span class="tag '+(f.src===2?'purple':'blue')+'">'+(f.src===2?'视频':'自然语言')+'</span></td><td>'+f.steps+'步</td><td><span class="tag '+(f.st===2?'green':'gray')+'">'+st+'</span></td><td><span class="tag '+ec+'">'+es+'</span></td><td>'+(f.last||'-')+'</td><td><button class="bp ghost sm" onclick="ef(\''+f.id+'\')">编辑</button> <button class="bp ghost sm" onclick="exf(\''+f.id+'\',\''+f.name+'\')">执行</button></td></tr>';
  });
  document.getElementById('ctl').innerHTML='<div class="card"><div class="ct"><span class="ic">🎯</span> 流程测试 &nbsp;<span style="font-size:13px;color:var(--t2);font-weight:400">— '+pn+'</span></div><div class="btn-g" style="margin-bottom:16px"><button class="bp primary" onclick="cf()">+ 新建流程</button> <button class="bp ghost" onclick="toast(\'演示：请选择视频文件\',\'info\')">🎬 上传视频</button></div><table class="dt"><thead><tr><th>ID</th><th>名称</th><th>来源</th><th>步骤</th><th>状态</th><th>执行</th><th>时间</th><th>操作</th></tr></thead><tbody>'+h+'</tbody></table></div>';
}
function cf(){
  document.getElementById('ctl').innerHTML='<div class="card"><div class="ct"><span class="ic">✨</span> 新建流程 — 自然语言</div><div class="form-row"><label>起始 URL</label><input id="fU" value="https://www.baidu.com"></div><div class="form-row"><label>场景描述</label><textarea id="fD" placeholder="用自然语言描述测试步骤...">在搜索框中输入"AI测试平台"四个字,然后点击"百度一下"按钮提交搜索,等待页面加载完成后,验证搜索结果页面中出现了包含"AI测试平台"关键字的链接或文本内容</textarea></div><div class="form-row"><label>Computer Use</label><select id="fC"><option value="0">关闭</option><option value="1">开启(推荐跨分辨率)</option></select></div><div class="btn-g"><button class="bp primary" onclick="pf()">AI 解析</button> <button class="bp ghost" onclick="nav(\'flow\')">取消</button></div></div><div id="pR"></div>';
}
function pf(){
  var d=document.getElementById('fD').value;
  if(d.trim().length<20){toast('描述至少 20 字符','error');return;}
  var r=document.getElementById('pR');
  r.innerHTML='<div class="card"><div class="ct"><span class="ic">🤖</span> AI 正在解析...</div><div class="loading"><div class="spin"></div>LLM 分析中...</div></div>';
  setTimeout(function(){
    r.innerHTML='<div class="card"><div class="ct"><span class="ic">✅</span> 解析完成 — 生成 5 个步骤</div><div class="step-tl">' +
      stepsHTML([
        {a:'navigate',t:'https://www.baidu.com',d:'打开百度首页',i:'🌐'},
        {a:'input',t:'搜索框',d:'输入"AI测试平台"',i:'⌨️'},
        {a:'click',t:'百度一下按钮',d:'提交搜索',i:'👆'},
        {a:'wait',t:'等待结果加载',d:'等待搜索结果渲染',i:'⏳'},
        {a:'verify_ui',t:'搜索结果区域',d:'验证列表包含关键字',i:'🔍'}
      ]) +
      '</div><div class="btn-g"><button class="bp primary" onclick="nav(\'flow\')">保存并返回</button></div></div>';
  },1800);
}
function stepsHTML(arr){return arr.map(function(s,i){return '<div class="step"><div class="step-dot ok">'+(i+1)+'</div><div class="step-box"><div class="st">'+s.i+'&nbsp;['+s.a+']&nbsp;'+s.t+'</div><div class="sd">'+s.d+'</div></div></div>';}).join('');}

function ef(id){
  document.getElementById('ctl').innerHTML='<div class="card"><div class="ct"><span class="ic">✏️</span> 编辑流程 — '+id+'</div><div class="form-row"><label>流程名称</label><input value="百度搜索全流程"></div><div class="form-row"><label>起始 URL</label><input value="https://www.baidu.com"></div><div class="form-row"><label>视频分辨率</label><input value="1920 × 1080" disabled></div><div class="form-row"><label>Computer Use</label><select id="ecu"><option value="0">关闭</option><option value="1" selected>开启（推荐）</option></select></div><div class="form-row"><label>定位方式</label><select id="eloc"><option>LLM 视觉定位 + 6 级降级</option><option>仅文本匹配</option><option>仅 LLM</option></select></div><div class="btn-g"><button class="bp primary" onclick="toast(\'演示：已保存\',\'success\');nav(\'flow\')">保存</button> <button class="bp ghost" onclick="nav(\'flow\')">取消</button></div></div>';
}

function exf(id,name){
  var c=document.getElementById('ctl');
  c.innerHTML='<div class="card"><div class="ct"><span class="ic">🚀</span> 执行流程 — '+name+'</div><div id="execArea"><div class="loading"><div class="spin"></div><div>正在启动 Chrome 浏览器...</div><div style="font-size:12px;color:#bbb;margin-top:4px">viewport: 1280×720 · Computer Use: 开启</div></div></div></div><div id="execLog" class="hidden"><div class="ct"><span class="ic">📋</span> 执行日志</div><div class="log" id="logBox"></div></div>';
  var steps=[
    {a:'navigate',t:'https://www.baidu.com',d:'打开百度首页',ok:true,dur:1200},
    {a:'input',t:'搜索框',d:'输入"AI测试平台"',ok:true,dur:350},
    {a:'click',t:'百度一下按钮',d:'提交搜索',ok:true,dur:180},
    {a:'wait',t:'等待结果加载',d:'等待搜索结果渲染',ok:true,dur:2100},
    {a:'verify_ui',t:'搜索结果区域',d:'验证列表包含"AI测试平台"',ok:true,dur:120}
  ];
  var cur=0,log=[],box=document.getElementById('logBox');
  function tick(){
    if(cur>=steps.length){
      box.innerHTML=log.join('');
      box.scrollTop=box.scrollHeight;
      document.getElementById('execArea').innerHTML='<div class="browser"><div class="browser-bar"><div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div><div class="url">https://www.baidu.com/s?wd=AI%E6%B5%8B%E8%AF%95%E5%B9%B3%E5%8F%B0</div></div><div class="browser-view"><div style="display:flex;align-items:center;gap:12px;margin-bottom:16px"><h2 style="color:#333;margin:0">百度一下</h2></div><div style="background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px;margin-bottom:8px"><a style="color:#1a0dab;text-decoration:underline">AI测试平台 - 让测试更简单</a><br><span style="color:#006621;font-size:12px">www.ai-test-tool.com</span><br><span style="color:#666;font-size:13px">AI测试平台提供 AI 驱动的测试用例生成、流程自动化、数据校验...</span></div><div style="background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px;margin-bottom:8px"><a style="color:#1a0dab;text-decoration:underline">什么是AI测试平台? - 知乎</a><br><span style="color:#006621;font-size:12px">zhihu.com</span><br><span style="color:#666;font-size:13px">AI测试平台是一款面向测试团队的智能工具...</span></div></div></div>';
      toast('执行完成：5/5 步骤全部通过','success');
      return;
    }
    var s=steps[cur];
    var ts=new Date().toLocaleTimeString();
    log.push('<div><span class="ts">['+ts+']</span> <span class="inf">▶ 步骤 '+(cur+1)+'/'+steps.length+'</span> '+s.a+' → '+s.t+'</div>');
    box.innerHTML=log.join('');box.scrollTop=box.scrollHeight;
    document.getElementById('execArea').innerHTML='<div class="browser"><div class="browser-bar"><div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div><div class="url">'+s.t+'</div></div><div class="browser-view"><div class="card" style="margin:0"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="tag blue">步骤 '+(cur+1)+'/'+steps.length+'</span><span>.'+s.a+'&nbsp;→&nbsp;<strong>'+s.t+'</strong></span></div><div style="margin-top:12px;font-size:13px;color:var(--t2)">'+s.d+'</div></div></div></div>';
    document.getElementById('execLog').classList.remove('hidden');
    setTimeout(function(){
      var ts2=new Date().toLocaleTimeString();
      if(s.ok){
        log.push('<div><span class="ts">['+ts2+']</span> <span class="ok">✓ 通过</span> ('+s.dur+'ms) 定位方式: LLM vision confidence=0.92</div>');
      }else{
        log.push('<div><span class="ts">['+ts2+']</span> <span class="err">✗ 失败</span> 未找到元素</div>');
      }
      box.innerHTML=log.join('');box.scrollTop=box.scrollHeight;
      cur++;tick();
    },600+Math.random()*400);
  }
  setTimeout(tick,1500);
}
