<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能衣橱 - 告别选择困难</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .category-item {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .category-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .category-item.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .clothes-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .clothes-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: #f0f0f0;
        }

        .clothes-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .clothes-item .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background: rgba(255,0,0,0.8);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .input-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            font-family: inherit;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .recommendations {
            grid-column: 1 / -1;
        }

        .outfits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .outfit-card {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .outfit-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .outfit-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .outfit-item {
            padding: 8px 12px;
            background: white;
            border-radius: 20px;
            font-size: 13px;
            color: #555;
            border: 1px solid #e0e0e0;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .placeholder {
            color: #999;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .outfits-grid {
                grid-template-columns: 1fr;
            }
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👗 智能衣橱</h1>
            <p>告别选择困难，让AI帮你搭配每一天</p>
        </header>

        <div class="main-content">
            <div class="card">
                <h2>📦 我的衣橱</h2>
                
                <div class="category-grid">
                    <div class="category-item active" data-category="上衣">👔 上衣</div>
                    <div class="category-item" data-category="牛仔裤">👖 牛仔裤</div>
                    <div class="category-item" data-category="短裤">🩳 短裤</div>
                    <div class="category-item" data-category="连衣裙">👗 连衣裙</div>
                    <div class="category-item" data-category="包包">👜 包包</div>
                    <div class="category-item" data-category="耳环">💍 耳环</div>
                    <div class="category-item" data-category="项链">📿 项链</div>
                    <div class="category-item" data-category="其他配件">🎀 其他配件</div>
                </div>

                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept="image/*" multiple>
                    <div class="upload-icon">📷</div>
                    <p>点击上传衣服图片</p>
                    <p style="font-size: 12px; color: #999; margin-top: 5px;">支持 JPG、PNG 格式</p>
                </div>

                <div class="clothes-list" id="clothesList">
                    <p class="placeholder">还没有添加任何衣服~</p>
                </div>
            </div>

            <div class="card">
                <h2>✨ 智能搭配</h2>
                
                <div class="input-group">
                    <label>今日场合</label>
                    <textarea id="occasion" rows="2" placeholder="例如：上班、约会、逛街、面试..."></textarea>
                </div>

                <div class="input-group">
                    <label>天气情况</label>
                    <textarea id="weather" rows="2" placeholder="例如：晴天、阴天、下雨、炎热、凉爽..."></textarea>
                </div>

                <div class="input-group">
                    <label>个人喜好</label>
                    <textarea id="preference" rows="2" placeholder="例如：简约风、休闲、正式、甜美..."></textarea>
                </div>

                <button class="generate-btn" id="generateBtn" onclick="generateOutfits()">
                    🚀 AI智能搭配
                </button>
            </div>

            <div class="card recommendations" id="recommendationsCard" style="display: none;">
                <h2>💝 为你推荐三套穿搭</h2>
                <div class="outfits-grid" id="outfitsGrid"></div>
            </div>
        </div>
    </div>

    <script>
        let currentCategory = '上衣';
        let clothes = JSON.parse(localStorage.getItem('wardrobe') || '[]');

        // 初始化
        document.querySelectorAll('.category-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelector('.category-item.active')?.classList.remove('active');
                item.classList.add('active');
                currentCategory = item.dataset.category;
            });
        });

        // 上传功能
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#ccc';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#ccc';
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const clothesItem = {
                            id: Date.now() + Math.random(),
                            category: currentCategory,
                            image: e.target.result
                        };
                        clothes.push(clothesItem);
                        saveAndRender();
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        function deleteClothes(id) {
            clothes = clothes.filter(c => c.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('wardrobe', JSON.stringify(clothes));
            renderClothes();
        }

        function renderClothes() {
            const list = document.getElementById('clothesList');
            if (clothes.length === 0) {
                list.innerHTML = '<p class="placeholder">还没有添加任何衣服~</p>';
                return;
            }
            
            list.innerHTML = clothes.map(item => `
                <div class="clothes-item">
                    <img src="${item.image}" alt="${item.category}">
                    <button class="delete-btn" onclick="deleteClothes(${item.id})">×</button>
                </div>
            `).join('');
        }

        // AI搭配生成
        const outfitTemplates = {
            '上班': [
                { name: '商务休闲风', items: ['简约白衬衫', '深色西裤', '皮质公文包', '简约项链'] },
                { name: '干练优雅风', items: ['针织衫', 'A字裙', '手提包', '珍珠耳环'] },
                { name: '轻商务风', items: ['条纹上衣', '牛仔裤', '托特包', '细项链'] }
            ],
            '约会': [
                { name: '甜美温柔风', items: ['碎花连衣裙', '小手提包', '珍珠耳环', '细项链'] },
                { name: '优雅知性风', items: ['缎面上衣', '优雅半裙', '手拿包', '流苏耳环'] },
                { name: '浪漫休闲风', items: ['蕾丝上衣', '阔腿裤', '斜挎包', '爱心耳环'] }
            ],
            '逛街': [
                { name: '休闲舒适风', items: ['T恤', '牛仔裤', '帆布包', '夸张耳环'] },
                { name: '时尚潮流风', items: ['卫衣', '运动裤', '双肩包', '金属项链'] },
                { name: '简约日常风', items: ['衬衫', '短裤', '单肩包', '简约耳钉'] }
            ],
            '面试': [
                { name: '稳重专业风', items: ['白衬衫', '深色西裤', '公文包', '简约耳钉'] },
                { name: '干练利落风', items: ['西装外套', '铅笔裙', '手提包', '珍珠耳环'] },
                { name: '清新自然风', items: ['浅色衬衫', '深色裤装', '托特包', '细项链'] }
            ]
        };

        const casualTemplates = [
            { name: '简约百搭风', items: ['基础款上衣', '经典牛仔裤', '休闲包', '简约配饰'] },
            { name: '清新自然风', items: ['棉麻衬衫', '休闲裤', '帆布包', '木质配饰'] },
            { name: '时尚都市风', items: ['设计感上衣', '修身裤', '潮流包', '个性耳环'] }
        ];

        function generateOutfits() {
            const occasion = document.getElementById('occasion').value.trim();
            const weather = document.getElementById('weather').value.trim();
            const preference = document.getElementById('preference').value.trim();

            if (!occasion && !weather && !preference) {
                alert('请至少填写一个条件~');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '🤖 AI思考中...';

            const recommendationsCard = document.getElementById('recommendationsCard');
            const outfitsGrid = document.getElementById('outfitsGrid');
            
            recommendationsCard.style.display = 'block';
            outfitsGrid.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>AI正在为你精心搭配...</p>
                </div>
            `;

            // 模拟AI生成延迟
            setTimeout(() => {
                let selectedTemplates;
                
                // 根据场合选择模板
                const occasionLower = occasion.toLowerCase();
                if (occasionLower.includes('上班') || occasionLower.includes('工作')) {
                    selectedTemplates = outfitTemplates['上班'];
                } else if (occasionLower.includes('约会')) {
                    selectedTemplates = outfitTemplates['约会'];
                } else if (occasionLower.includes('逛街') || occasionLower.includes('购物')) {
                    selectedTemplates = outfitTemplates['逛街'];
                } else if (occasionLower.includes('面试')) {
                    selectedTemplates = outfitTemplates['面试'];
                } else {
                    // 随机选择
                    const allTemplates = [...Object.values(outfitTemplates).flat(), ...casualTemplates];
                    selectedTemplates = allTemplates.sort(() => Math.random() - 0.5).slice(0, 3);
                }

                // 根据天气调整
                const weatherLower = weather.toLowerCase();
                let weatherModifier = '';
                if (weatherLower.includes('热') || weatherLower.includes('炎')) {
                    weatherModifier = '（轻薄款）';
                } else if (weatherLower.includes('冷') || weatherLower.includes('凉')) {
                    weatherModifier = '（保暖款）';
                } else if (weatherLower.includes('雨')) {
                    weatherModifier = '（防雨款）';
                }

                outfitsGrid.innerHTML = selectedTemplates.map((outfit, index) => `
                    <div class="outfit-card">
                        <h3>${outfit.name} ${weatherModifier}</h3>
                        <div class="outfit-items">
                            ${outfit.items.map(item => `<span class="outfit-item">${item}</span>`).join('')}
                        </div>
                    </div>
                `).join('');

                btn.disabled = false;
                btn.textContent = '🚀 AI智能搭配';

                // 滚动到推荐区域
                recommendationsCard.scrollIntoView({ behavior: 'smooth' });
            }, 1500);
        }

        // 初始化渲染
        renderClothes();
    </script>
</body>
</html>
