<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期末复习规划助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; border-radius: 16px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid #f0f0f0; }
        .card-header .icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .card-header h2 { color: #333; font-size: 20px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; border-radius: 10px; background: #f5f5f5; color: #666; cursor: pointer; font-weight: 500; transition: all 0.3s; border: none; }
        .tab.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn { padding: 12px 24px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-danger { background: #fee2e2; color: #ef4444; }
        .btn-danger:hover { background: #fecaca; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: #666; font-size: 14px; margin-bottom: 8px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .subject-list { display: grid; gap: 12px; }
        .subject-item { background: #f9fafb; border-radius: 12px; padding: 16px; border-left: 4px solid #667eea; }
        .subject-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .subject-name { font-weight: 600; color: #333; }
        .subject-weight { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #e0e7ff; color: #4338ca; }
        .key-points { display: flex; flex-wrap: gap: 6px; margin-bottom: 8px; }
        .key-point { padding: 4px 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 12px; color: #666; }
        .add-point-btn { font-size: 12px; color: #667eea; cursor: pointer; margin-top: 8px; }
        .time-slot-list { display: grid; gap: 12px; }
        .time-slot-item { background: #f9fafb; border-radius: 12px; padding: 16px; }
        .time-info { display: flex; justify-content: space-between; align-items: center; }
        .time-range { font-weight: 600; color: #333; }
        .time-duration { font-size: 12px; color: #666; }
        .schedule-list { display: grid; gap: 12px; }
        .schedule-item { background: #f9fafb; border-radius: 12px; padding: 16px; position: relative; }
        .schedule-item.current { border: 2px solid #10b981; background: #ecfdf5; }
        .schedule-time { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 8px; }
        .schedule-subject { font-weight: 600; color: #667eea; margin-bottom: 4px; }
        .schedule-point { font-size: 14px; color: #666; }
        .schedule-progress { margin-top: 12px; }
        .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #10b981, #34d399); border-radius: 4px; transition: width 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 16px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 12px; color: #666; margin-top: 4px; }
        .reminder-banner { position: fixed; top: 20px; right: 20px; background: #10b981; color: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 10px 40px rgba(16,185,129,0.3); z-index: 9999; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .modal-content { background: white; border-radius: 16px; padding: 24px; width: 90%; max-width: 500px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { color: #333; }
        .modal-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: #f5f5f5; cursor: pointer; font-size: 18px; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
        .difficulty-select { display: flex; gap: 8px; }
        .diff-btn { padding: 8px 16px; border-radius: 8px; border: 2px solid #e0e0e0; cursor: pointer; font-size: 13px; transition: all 0.3s; }
        .diff-btn.active { border-color: #667eea; background: #e0e7ff; color: #4338ca; }
        .generate-btn { width: 100%; padding: 16px; font-size: 18px; margin-top: 20px; }
        .check-all-btn { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: #667eea; cursor: pointer; font-size: 14px; }
        input[type="checkbox"] { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <div class="icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">📚</div>
                <div>
                    <h2>期末复习规划助手</h2>
                    <p style="font-size: 13px; color: #666; margin-top: 2px;">智能安排复习时间，高效备战期末</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="statSubjects">0</div><div class="stat-label">科目数</div></div>
                <div class="stat-card"><div class="stat-value" id="statPoints">0</div><div class="stat-label">重点数</div></div>
                <div class="stat-card"><div class="stat-value" id="statTime">0h</div><div class="stat-label">可支配时间</div></div>
                <div class="stat-card"><div class="stat-value" id="statPlan">0</div><div class="stat-label">计划项</div></div>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('subjects')">📖 科目管理</button>
                <button class="tab" onclick="switchTab('time')">⏰ 时间设置</button>
                <button class="tab" onclick="switchTab('plan')">📋 复习计划</button>
            </div>

            <div id="tabContent">
                <div id="subjectsTab">
                    <div class="form-group">
                        <label>科目名称</label>
                        <input type="text" id="subjectName" placeholder="例如：高等数学">
                    </div>
                    <div class="form-group">
                        <label>难度等级</label>
                        <div class="difficulty-select">
                            <button class="diff-btn" onclick="setDifficulty(1)">⭐ 简单</button>
                            <button class="diff-btn" onclick="setDifficulty(2)">⭐⭐ 中等</button>
                            <button class="diff-btn" onclick="setDifficulty(3)">⭐⭐⭐ 困难</button>
                        </div>
                        <input type="hidden" id="subjectDifficulty" value="2">
                    </div>
                    <div class="form-group">
                        <label>复习重点（每行一个）</label>
                        <textarea id="subjectPoints" placeholder="第一章 函数与极限&#10;第二章 导数与微分&#10;第三章 积分"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="addSubject()">添加科目</button>

                    <div id="subjectList" class="subject-list" style="margin-top: 24px;"></div>
                </div>

                <div id="timeTab" style="display: none;">
                    <div class="form-row">
                        <div class="form-group">
                            <label>开始日期</label>
                            <input type="date" id="timeStart">
                        </div>
                        <div class="form-group">
                            <label>结束日期（考试日）</label>
                            <input type="date" id="timeEnd">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>每日开始时间</label>
                            <input type="time" id="timeFrom" value="08:00">
                        </div>
                        <div class="form-group">
                            <label>每日结束时间</label>
                            <input type="time" id="timeTo" value="22:00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>每段复习时长（分钟）</label>
                        <input type="number" id="sessionDuration" value="60" min="30" max="120">
                    </div>
                    <button class="btn btn-primary" onclick="addTimeSlot()">添加时间段</button>

                    <div id="timeSlotList" class="time-slot-list" style="margin-top: 24px;"></div>
                </div>

                <div id="planTab" style="display: none;">
                    <button class="btn btn-primary generate-btn" onclick="generateSchedule()">🚀 生成复习计划</button>
                    <button class="btn btn-danger" style="width: 100%; margin-top: 12px;" onclick="clearSchedule()">清空计划</button>
                    
                    <div id="scheduleList" class="schedule-list" style="margin-top: 24px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let subjects = [];
        let timeSlots = [];
        let schedule = [];
        let currentTab = 'subjects';
        let notificationSound = null;

        function loadData() {
            const s = localStorage.getItem('study_subjects');
            const t = localStorage.getItem('study_timeslots');
            const p = localStorage.getItem('study_schedule');
            if (s) subjects = JSON.parse(s);
            if (t) timeSlots = JSON.parse(t);
            if (p) schedule = JSON.parse(p);
            
            if (subjects.length === 0) {
                subjects = [
                    { id: '1', name: '高等数学', difficulty: 3, points: ['第一章 函数与极限', '第二章 导数与微分', '第三章 积分', '第四章 微分方程'] },
                    { id: '2', name: '大学英语', difficulty: 2, points: ['听力理解', '阅读理解', '完形填空', '写作模板'] },
                    { id: '3', name: '数据结构', difficulty: 3, points: ['链表与树', '排序算法', '图论基础', '动态规划'] },
                    { id: '4', name: '计算机网络', difficulty: 2, points: ['TCP/IP协议', 'HTTP协议', '网络层', '应用层'] }
                ];
                saveData();
            }
            
            if (timeSlots.length === 0) {
                const today = new Date();
                const endDate = new Date();
                endDate.setDate(endDate.getDate() + 14);
                timeSlots = [
                    { id: '1', startDate: formatDate(today), endDate: formatDate(endDate), timeFrom: '08:00', timeTo: '12:00', duration: 60 },
                    { id: '2', startDate: formatDate(today), endDate: formatDate(endDate), timeFrom: '14:00', timeTo: '18:00', duration: 60 },
                    { id: '3', startDate: formatDate(today), endDate: formatDate(endDate), timeFrom: '19:00', timeTo: '22:00', duration: 60 }
                ];
                saveData();
            }

            renderSubjects();
            renderTimeSlots();
            renderSchedule();
            updateStats();
            
            if (schedule.length > 0) {
                startReminder();
            }
        }

        function saveData() {
            localStorage.setItem('study_subjects', JSON.stringify(subjects));
            localStorage.setItem('study_timeslots', JSON.stringify(timeSlots));
            localStorage.setItem('study_schedule', JSON.stringify(schedule));
        }

        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('subjectsTab').style.display = tab === 'subjects' ? 'block' : 'none';
            document.getElementById('timeTab').style.display = tab === 'time' ? 'block' : 'none';
            document.getElementById('planTab').style.display = tab === 'plan' ? 'block' : 'none';
        }

        function setDifficulty(level) {
            document.getElementById('subjectDifficulty').value = level;
            document.querySelectorAll('.diff-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i + 1 === level);
            });
        }

        function addSubject() {
            const name = document.getElementById('subjectName').value.trim();
            const difficulty = parseInt(document.getElementById('subjectDifficulty').value);
            const pointsText = document.getElementById('subjectPoints').value.trim();
            const points = pointsText ? pointsText.split('\n').map(p => p.trim()).filter(p => p) : [];

            if (!name) { alert('请输入科目名称'); return; }
            if (points.length === 0) { alert('请至少添加一个复习重点'); return; }

            subjects.push({
                id: Date.now().toString(),
                name,
                difficulty,
                points,
                completedPoints: []
            });

            saveData();
            renderSubjects();
            updateStats();

            document.getElementById('subjectName').value = '';
            document.getElementById('subjectPoints').value = '';
            setDifficulty(2);
        }

        function deleteSubject(id) {
            subjects = subjects.filter(s => s.id !== id);
            saveData();
            renderSubjects();
            updateStats();
        }

        function renderSubjects() {
            const list = document.getElementById('subjectList');
            if (subjects.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="emoji">📚</div><div>还没有添加科目</div><div style="font-size:13px">在上方添加科目和复习重点</div></div>';
                return;
            }

            list.innerHTML = subjects.map(s => {
                const diffText = s.difficulty === 1 ? '简单' : s.difficulty === 2 ? '中等' : '困难';
                const diffColor = s.difficulty === 1 ? '#10b981' : s.difficulty === 2 ? '#f59e0b' : '#ef4444';
                return `
                    <div class="subject-item" style="border-left-color: ${diffColor}">
                        <div class="subject-header">
                            <div class="subject-name">${s.name}</div>
                            <div style="display:flex; gap:8px;">
                                <span class="subject-weight" style="background:${diffColor}20; color:${diffColor}">${diffText}</span>
                                <button class="btn btn-danger btn-sm" onclick="deleteSubject('${s.id}')">删除</button>
                            </div>
                        </div>
                        <div class="key-points">
                            ${s.points.map((p, i) => `
                                <span class="key-point">${i + 1}. ${p}</span>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addTimeSlot() {
            const startDate = document.getElementById('timeStart').value;
            const endDate = document.getElementById('timeEnd').value;
            const timeFrom = document.getElementById('timeFrom').value;
            const timeTo = document.getElementById('timeTo').value;
            const duration = parseInt(document.getElementById('sessionDuration').value);

            if (!startDate || !endDate) { alert('请选择日期'); return; }
            if (startDate > endDate) { alert('开始日期不能晚于结束日期'); return; }
            if (timeFrom >= timeTo) { alert('开始时间不能晚于结束时间'); return; }

            timeSlots.push({
                id: Date.now().toString(),
                startDate,
                endDate,
                timeFrom,
                timeTo,
                duration
            });

            saveData();
            renderTimeSlots();
            updateStats();

            document.getElementById('timeStart').value = '';
            document.getElementById('timeEnd').value = '';
        }

        function deleteTimeSlot(id) {
            timeSlots = timeSlots.filter(t => t.id !== id);
            saveData();
            renderTimeSlots();
            updateStats();
        }

        function renderTimeSlots() {
            const list = document.getElementById('timeSlotList');
            if (timeSlots.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="emoji">⏰</div><div>还没有设置可支配时间</div><div style="font-size:13px">在上方添加复习时间段</div></div>';
                return;
            }

            list.innerHTML = timeSlots.map(t => {
                const days = Math.ceil((new Date(t.endDate) - new Date(t.startDate)) / (1000 * 60 * 60 * 24)) + 1;
                const hoursPerDay = (new Date(`2000-01-01T${t.timeTo}`) - new Date(`2000-01-01T${t.timeFrom}`)) / (1000 * 60 * 60);
                const totalHours = (days * hoursPerDay).toFixed(1);
                return `
                    <div class="time-slot-item">
                        <div class="time-info">
                            <div>
                                <div class="time-range">${t.timeFrom} - ${t.timeTo}</div>
                                <div style="font-size:12px;color:#999;margin-top:4px;">${t.startDate} 至 ${t.endDate}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="time-duration">${totalHours}小时</div>
                                <div style="font-size:12px;color:#999;margin-top:4px;">每次${t.duration}分钟</div>
                            </div>
                        </div>
                        <button class="btn btn-danger btn-sm" style="margin-top:12px;" onclick="deleteTimeSlot('${t.id}')">删除时间段</button>
                    </div>
                `;
            }).join('');
        }

        function generateSchedule() {
            if (subjects.length === 0) { alert('请先添加科目'); return; }
            if (timeSlots.length === 0) { alert('请先设置可支配时间'); return; }

            const totalWeight = subjects.reduce((sum, s) => sum + s.difficulty * s.points.length, 0);
            const allPoints = [];
            
            subjects.forEach(s => {
                s.points.forEach(p => {
                    allPoints.push({
                        subjectId: s.id,
                        subjectName: s.name,
                        difficulty: s.difficulty,
                        point: p,
                        weight: s.difficulty
                    });
                });
            });

            allPoints.sort((a, b) => b.weight - a.weight);

            const scheduleItems = [];
            let pointIndex = 0;

            timeSlots.forEach(slot => {
                const startDate = new Date(slot.startDate);
                const endDate = new Date(slot.endDate);
                
                for (let d = startDate; d <= endDate; d.setDate(d.getDate() + 1)) {
                    const dateStr = formatDate(d);
                    let currentTime = new Date(`2000-01-01T${slot.timeFrom}`);
                    const endTime = new Date(`2000-01-01T${slot.timeTo}`);

                    while (currentTime < endTime) {
                        if (pointIndex >= allPoints.length) {
                            pointIndex = 0;
                        }

                        const point = allPoints[pointIndex];
                        const itemEndTime = new Date(currentTime.getTime() + slot.duration * 60 * 1000);
                        
                        if (itemEndTime > endTime) break;

                        scheduleItems.push({
                            id: Date.now().toString() + Math.random(),
                            date: dateStr,
                            timeFrom: formatTime(currentTime),
                            timeTo: formatTime(itemEndTime),
                            subjectId: point.subjectId,
                            subjectName: point.subjectName,
                            point: point.point,
                            completed: false,
                            createdAt: Date.now()
                        });

                        currentTime = itemEndTime;
                        pointIndex++;
                    }
                }
            });

            schedule = scheduleItems;
            saveData();
            renderSchedule();
            updateStats();
            startReminder();

            alert(`🎉 成功生成 ${schedule.length} 个复习计划！`);
        }

        function formatTime(date) {
            return date.toTimeString().slice(0, 5);
        }

        function toggleComplete(id) {
            const item = schedule.find(s => s.id === id);
            if (item) {
                item.completed = !item.completed;
                saveData();
                renderSchedule();
                updateStats();
            }
        }

        function clearSchedule() {
            if (!confirm('确定要清空所有复习计划吗？')) return;
            schedule = [];
            saveData();
            renderSchedule();
            updateStats();
        }

        function renderSchedule() {
            const list = document.getElementById('scheduleList');
            if (schedule.length === 0) {
                list.innerHTML = '<div class="empty-state"><div class="emoji">📋</div><div>还没有生成复习计划</div><div style="font-size:13px">先添加科目和时间，然后点击上方按钮生成</div></div>';
                return;
            }

            const now = new Date();
            const todayStr = formatDate(now);
            const currentTime = formatTime(now);

            schedule.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return a.timeFrom.localeCompare(b.timeFrom);
            });

            list.innerHTML = schedule.map(item => {
                const isCurrent = item.date === todayStr && item.timeFrom <= currentTime && item.timeTo >= currentTime;
                const isPast = item.date < todayStr || (item.date === todayStr && item.timeTo < currentTime);
                
                return `
                    <div class="schedule-item ${isCurrent ? 'current' : ''}">
                        <div class="schedule-time">${item.date} ${item.timeFrom} - ${item.timeTo}</div>
                        <div class="schedule-subject">${item.subjectName}</div>
                        <div class="schedule-point">📌 ${item.point}</div>
                        <div class="schedule-progress">
                            <div style="display:flex; justify-content:space-between; font-size:12px; color:#666; margin-bottom:4px;">
                                <span>完成状态</span>
                                <span>${item.completed ? '已完成' : '未完成'}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${item.completed ? '100%' : '0%'}"></div>
                            </div>
                        </div>
                        <button class="btn ${item.completed ? 'btn-danger' : 'btn-primary'} btn-sm" style="margin-top:12px;" onclick="toggleComplete('${item.id}')">
                            ${item.completed ? '标记未完成' : '标记已完成'}
                        </button>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            const totalPoints = subjects.reduce((sum, s) => sum + s.points.length, 0);
            let totalHours = 0;
            
            timeSlots.forEach(slot => {
                const days = Math.ceil((new Date(slot.endDate) - new Date(slot.startDate)) / (1000 * 60 * 60 * 24)) + 1;
                const hoursPerDay = (new Date(`2000-01-01T${slot.timeTo}`) - new Date(`2000-01-01T${slot.timeFrom}`)) / (1000 * 60 * 60);
                totalHours += days * hoursPerDay;
            });

            document.getElementById('statSubjects').textContent = subjects.length;
            document.getElementById('statPoints').textContent = totalPoints;
            document.getElementById('statTime').textContent = Math.round(totalHours) + 'h';
            document.getElementById('statPlan').textContent = schedule.length;
        }

        function startReminder() {
            setInterval(() => {
                const now = new Date();
                const todayStr = formatDate(now);
                const currentTime = formatTime(now);

                const item = schedule.find(s => 
                    s.date === todayStr && s.timeFrom === currentTime && !s.completed
                );

                if (item) {
                    showReminder(item);
                }
            }, 60000);
        }

        function showReminder(item) {
            const banner = document.createElement('div');
            banner.className = 'reminder-banner';
            banner.innerHTML = `
                <div style="font-weight:600; margin-bottom:4px;">⏰ 复习提醒</div>
                <div>${item.subjectName}</div>
                <div style="font-size:13px; opacity:0.9;">📌 ${item.point}</div>
            `;
            document.body.appendChild(banner);

            if (Notification.permission === 'granted') {
                new Notification('复习提醒', {
                    body: `${item.subjectName}: ${item.point}`,
                    icon: '📚'
                });
            }

            setTimeout(() => {
                banner.remove();
            }, 10000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (Notification.permission !== 'granted') {
                Notification.requestPermission();
            }
            loadData();
            setDifficulty(2);
        });
    </script>
</body>
</html>
