<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能数字衣橱 - Smart Closet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f7 100%);
            min-height: 100vh;
        }
        
        .clothing-card {
            transition: all 0.3s ease;
        }
        
        .clothing-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #007aff 0%, #0051d5 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.4);
        }
        
        .tag {
            transition: all 0.2s ease;
        }
        
        .tag:hover {
            transform: scale(1.05);
        }
        
        .outfit-item {
            position: absolute;
            cursor: move;
            transition: box-shadow 0.2s ease;
        }
        
        .outfit-item:hover {
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .modal-overlay {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-semibold text-gray-900 mb-2">
                智能数字衣橱
            </h1>
            <p class="text-gray-500">Smart Closet · 轻松搭配每一天</p>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5">
                <div class="bg-white rounded-2xl shadow-sm p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-semibold text-gray-800">我的衣橱</h2>
                        <button id="addClothingBtn" class="btn-primary text-white px-5 py-2.5 rounded-xl font-medium">
                            ➕ 添加上传新衣物
                        </button>
                    </div>
                    
                    <div id="clothingGrid" class="grid grid-cols-2 gap-4">
                    </div>
                </div>
            </div>
            
            <div class="lg:col-span-7">
                <div class="bg-white rounded-2xl shadow-sm p-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-6">OOTD 搭配画板</h2>
                    
                    <div id="outfitCanvas" class="relative bg-gradient-to-br from-gray-50 to-white rounded-xl border-2 border-dashed border-gray-200 w-full aspect-[4/5] mb-6 overflow-hidden">
                        <div id="canvasItems" class="absolute inset-0"></div>
                        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                            <span class="text-6xl mb-4">👗</span>
                            <p class="text-lg">从左侧选择衣物开始搭配</p>
                        </div>
                    </div>
                    
                    <div class="flex gap-4 mb-8">
                        <input 
                            type="text" 
                            id="outfitName" 
                            placeholder="给这套穿搭命名，如：周一通勤" 
                            class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:border-blue-500 focus:outline-none transition-colors"
                        />
                        <button id="saveOutfitBtn" class="btn-primary text-white px-6 py-3 rounded-xl font-medium">
                            💾 保存搭配
                        </button>
                    </div>
                    
                    <div>
                        <h3 class="text-lg font-semibold text-gray-700 mb-4">我的搭配日历</h3>
                        <div id="savedOutfits" class="space-y-4">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="uploadModal" class="fixed inset-0 bg-black/30 modal-overlay hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full mx-4 text-center">
            <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-blue-50 flex items-center justify-center">
                <span class="text-4xl animate-pulse">🤖</span>
            </div>
            <h3 class="text-xl font-semibold text-gray-800 mb-2">AI正在识别</h3>
            <p class="text-gray-500" id="modalText">分析衣物特征与提取标签...</p>
            <div class="mt-6 w-full bg-gray-100 rounded-full h-2">
                <div id="progressBar" class="bg-blue-500 h-2 rounded-full w-0"></div>
            </div>
        </div>
    </div>

    <script>
        const clothingData = [
            { id: 1, emoji: '👕', color: 'from-pink-100 to-pink-200', category: '上衣', tags: ['休闲', '日常'], customTags: [] },
            { id: 2, emoji: '👔', color: 'from-blue-100 to-blue-200', category: '上衣', tags: ['职场', '正式'], customTags: [] },
            { id: 3, emoji: '🧥', color: 'from-indigo-100 to-indigo-200', category: '外套', tags: ['保暖', '时尚'], customTags: [] },
            { id: 4, emoji: '👖', color: 'from-slate-100 to-slate-200', category: '裤子', tags: ['休闲', '百搭'], customTags: [] },
            { id: 5, emoji: '👗', color: 'from-rose-100 to-rose-200', category: '连衣裙', tags: ['优雅', '约会'], customTags: [] },
            { id: 6, emoji: '👟', color: 'from-gray-100 to-gray-200', category: '配饰', tags: ['运动', '舒适'], customTags: [] }
        ];
        
        const savedOutfits = [];
        const canvasItems = new Map();
        let nextId = 7;
        
        const categoryStyles = {
            '上衣': { top: '15%', left: '50%', transform: 'translateX(-50%)' },
            '裤子': { top: '45%', left: '50%', transform: 'translateX(-50%)' },
            '连衣裙': { top: '25%', left: '50%', transform: 'translateX(-50%)' },
            '外套': { top: '10%', left: '50%', transform: 'translateX(-50%)' },
            '配饰': { top: '20%', right: '10%', left: 'auto' }
        };
        
        const zIndexMap = {
            '配饰': 4,
            '外套': 3,
            '上衣': 2,
            '连衣裙': 2,
            '裤子': 1
        };
        
        const allTags = ['休闲', '职场', '复古', '清新', '时尚', '优雅', '运动', '正式', '约会', '日常', '保暖', '百搭'];
        const allCategories = ['上衣', '裤子', '连衣裙', '外套', '配饰'];
        const allEmojis = ['👕', '👔', '🧥', '👖', '👗', '👠', '👟', '🎽', '🧣', '👒', '🎩', '⌚'];
        const allColors = [
            'from-pink-100 to-pink-200', 'from-blue-100 to-blue-200', 'from-indigo-100 to-indigo-200',
            'from-slate-100 to-slate-200', 'from-rose-100 to-rose-200', 'from-green-100 to-green-200',
            'from-yellow-100 to-yellow-200', 'from-purple-100 to-purple-200', 'from-orange-100 to-orange-200',
            'from-cyan-100 to-cyan-200'
        ];
        
        function renderClothingGrid() {
            const grid = document.getElementById('clothingGrid');
            grid.innerHTML = '';
            
            clothingData.forEach(item => {
                const card = createClothingCard(item);
                grid.appendChild(card);
            });
        }
        
        function createClothingCard(item) {
            const card = document.createElement('div');
            card.className = 'clothing-card bg-gray-50 rounded-xl p-4 cursor-pointer border border-gray-100';
            card.dataset.id = item.id;
            
            const tagsHtml = [...item.tags, ...item.customTags].map(tag => `
                <span class="tag inline-block px-2 py-1 bg-white rounded-lg text-xs font-medium text-gray-600 mr-1 mb-1 border border-gray-100">
                    ${tag}
                    <button class="ml-1 text-gray-400 hover:text-gray-600 remove-tag" data-tag="${tag}">×</button>
                </span>
            `).join('');
            
            card.innerHTML = `
                <div class="aspect-square bg-gradient-to-br ${item.color} rounded-lg flex items-center justify-center mb-3">
                    <span class="text-5xl">${item.emoji}</span>
                </div>
                <div class="mb-2">
                    <span class="inline-block px-2 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium">
                        ${item.category}
                    </span>
                </div>
                <div class="mb-2">
                    ${tagsHtml}
                </div>
                <div class="flex gap-2">
                    <input type="text" class="custom-tag-input w-full px-2 py-1 border border-gray-200 rounded-lg text-xs focus:border-blue-500 focus:outline-none" placeholder="添加标签..." data-id="${item.id}" />
                </div>
            `;
            
            card.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-tag') || e.target.classList.contains('custom-tag-input')) {
                    return;
                }
                addToCanvas(item, card);
            });
            
            card.querySelectorAll('.remove-tag').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeTag(item, btn.dataset.tag);
                });
            });
            
            const input = card.querySelector('.custom-tag-input');
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && input.value.trim()) {
                    e.preventDefault();
                    addCustomTag(item, input.value.trim());
                    input.value = '';
                }
            });
            
            return card;
        }
        
        function addCustomTag(item, tag) {
            if (!item.customTags.includes(tag)) {
                item.customTags.push(tag);
                renderClothingGrid();
                
                const newCards = document.querySelectorAll('.clothing-card');
                newCards.forEach(card => {
                    if (parseInt(card.dataset.id) === item.id) {
                        gsap.fromTo(card, 
                            { scale: 0.95, opacity: 0.5 }, 
                            { scale: 1, opacity: 1, duration: 0.3, ease: 'power2.out' }
                        );
                    }
                });
            }
        }
        
        function removeTag(item, tag) {
            const tagIndex = item.tags.indexOf(tag);
            if (tagIndex > -1) {
                item.tags.splice(tagIndex, 1);
            } else {
                const customIndex = item.customTags.indexOf(tag);
                if (customIndex > -1) {
                    item.customTags.splice(customIndex, 1);
                }
            }
            renderClothingGrid();
        }
        
        function addToCanvas(item, card) {
            if (canvasItems.has(item.id)) return;
            
            const canvas = document.getElementById('outfitCanvas');
            const canvasItemsContainer = document.getElementById('canvasItems');
            const emptyState = document.getElementById('emptyState');
            
            gsap.to(emptyState, { opacity: 0, duration: 0.3, onComplete: () => emptyState.style.display = 'none' });
            
            const outfitItem = document.createElement('div');
            outfitItem.className = 'outfit-item bg-white rounded-xl shadow-md p-4 flex flex-col items-center';
            outfitItem.dataset.id = item.id;
            
            const style = categoryStyles[item.category] || categoryStyles['上衣'];
            outfitItem.style.top = style.top;
            if (style.left) outfitItem.style.left = style.left;
            if (style.right) outfitItem.style.right = style.right;
            if (style.transform) outfitItem.style.transform = style.transform;
            outfitItem.style.zIndex = zIndexMap[item.category] || 2;
            
            outfitItem.innerHTML = `
                <button class="absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full text-sm hover:bg-red-600 transition-colors remove-item">×</button>
                <span class="text-4xl mb-1">${item.emoji}</span>
                <span class="text-xs text-gray-500">${item.category}</span>
            `;
            
            const cardRect = card.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            
            outfitItem.style.left = `${cardRect.left - canvasRect.left + cardRect.width / 2 - 50}px`;
            outfitItem.style.top = `${cardRect.top - canvasRect.top}px`;
            outfitItem.style.opacity = '0';
            outfitItem.style.transform = 'scale(0.8)';
            
            canvasItemsContainer.appendChild(outfitItem);
            
            gsap.to(outfitItem, {
                left: style.left || 'auto',
                right: style.right || 'auto',
                top: style.top,
                transform: style.transform || 'none',
                opacity: 1,
                scale: 1,
                duration: 0.6,
                ease: 'power2.out'
            });
            
            outfitItem.querySelector('.remove-item').addEventListener('click', () => {
                removeFromCanvas(item, outfitItem, card);
            });
            
            canvasItems.set(item.id, { element: outfitItem, card: card });
            card.style.borderColor = '#007aff';
            card.style.backgroundColor = '#f0f7ff';
        }
        
        function removeFromCanvas(item, element, card) {
            const canvas = document.getElementById('outfitCanvas');
            const cardRect = card.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            
            gsap.to(element, {
                left: `${cardRect.left - canvasRect.left + cardRect.width / 2 - 50}px`,
                top: `${cardRect.top - canvasRect.top}px`,
                opacity: 0,
                scale: 0.8,
                duration: 0.5,
                ease: 'power2.in',
                onComplete: () => {
                    element.remove();
                    canvasItems.delete(item.id);
                    card.style.borderColor = '#e5e7eb';
                    card.style.backgroundColor = '#f9fafb';
                    
                    if (canvasItems.size === 0) {
                        const emptyState = document.getElementById('emptyState');
                        emptyState.style.display = 'flex';
                        gsap.to(emptyState, { opacity: 1, duration: 0.3 });
                    }
                }
            });
        }
        
        function saveOutfit() {
            const nameInput = document.getElementById('outfitName');
            const name = nameInput.value.trim();
            
            if (!name) {
                nameInput.focus();
                nameInput.classList.add('border-red-500');
                setTimeout(() => nameInput.classList.remove('border-red-500'), 1000);
                return;
            }
            
            if (canvasItems.size === 0) {
                alert('请先添加衣物到画板！');
                return;
            }
            
            const outfit = {
                id: Date.now(),
                name: name,
                items: Array.from(canvasItems.keys()).map(id => clothingData.find(c => c.id === id)),
                date: new Date().toLocaleDateString('zh-CN')
            };
            
            savedOutfits.unshift(outfit);
            
            clearCanvas();
            nameInput.value = '';
            
            renderSavedOutfits();
        }
        
        function clearCanvas() {
            const canvasItemsContainer = document.getElementById('canvasItems');
            const emptyState = document.getElementById('emptyState');
            
            canvasItems.forEach(({ element, card }) => {
                gsap.to(element, {
                    opacity: 0,
                    scale: 0.5,
                    duration: 0.3,
                    onComplete: () => {
                        element.remove();
                        card.style.borderColor = '#e5e7eb';
                        card.style.backgroundColor = '#f9fafb';
                    }
                });
            });
            
            canvasItems.clear();
            emptyState.style.display = 'flex';
            gsap.to(emptyState, { opacity: 1, duration: 0.3 });
        }
        
        function renderSavedOutfits() {
            const container = document.getElementById('savedOutfits');
            container.innerHTML = '';
            
            savedOutfits.forEach(outfit => {
                const item = createSavedOutfitItem(outfit);
                container.appendChild(item);
            });
        }
        
        function createSavedOutfitItem(outfit) {
            const div = document.createElement('div');
            div.className = 'saved-outfit bg-gray-50 rounded-xl p-4 border border-gray-100';
            div.style.opacity = '0';
            div.style.transform = 'translateY(20px)';
            
            const emojisHtml = outfit.items.map(item => `<span class="text-2xl">${item.emoji}</span>`).join('');
            
            div.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h4 class="font-semibold text-gray-800">${outfit.name}</h4>
                        <p class="text-xs text-gray-500">${outfit.date}</p>
                    </div>
                    <button class="text-gray-400 hover:text-gray-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                        </svg>
                    </button>
                </div>
                <div class="flex gap-2">
                    ${emojisHtml}
                </div>
            `;
            
            setTimeout(() => {
                gsap.to(div, {
                    opacity: 1,
                    translateY: 0,
                    duration: 0.5,
                    ease: 'power2.out'
                });
            }, 50);
            
            return div;
        }
        
        function showUploadModal() {
            const modal = document.getElementById('uploadModal');
            const progressBar = document.getElementById('progressBar');
            const modalText = document.getElementById('modalText');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            gsap.fromTo(modal.querySelector('div'), 
                { scale: 0.8, opacity: 0 }, 
                { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out' }
            );
            
            progressBar.style.width = '0%';
            modalText.textContent = '分析衣物特征与提取标签...';
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 100) progress = 100;
                progressBar.style.width = `${progress}%`;
                
                if (progress > 30 && progress < 60) {
                    modalText.textContent = '识别衣物类型与风格...';
                } else if (progress > 60 && progress < 90) {
                    modalText.textContent = '生成智能标签中...';
                } else if (progress >= 100) {
                    modalText.textContent = '完成！';
                    clearInterval(interval);
                }
            }, 100);
            
            setTimeout(() => {
                addNewClothing();
                hideUploadModal();
            }, 2000);
        }
        
        function hideUploadModal() {
            const modal = document.getElementById('uploadModal');
            gsap.to(modal.querySelector('div'), {
                scale: 0.8,
                opacity: 0,
                duration: 0.3,
                ease: 'back.in',
                onComplete: () => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            });
        }
        
        function addNewClothing() {
            const randomCategory = allCategories[Math.floor(Math.random() * allCategories.length)];
            const randomEmoji = allEmojis[Math.floor(Math.random() * allEmojis.length)];
            const randomColor = allColors[Math.floor(Math.random() * allColors.length)];
            const randomTags = [];
            for (let i = 0; i < 2; i++) {
                const tag = allTags[Math.floor(Math.random() * allTags.length)];
                if (!randomTags.includes(tag)) randomTags.push(tag);
            }
            
            const newItem = {
                id: nextId++,
                emoji: randomEmoji,
                color: randomColor,
                category: randomCategory,
                tags: randomTags,
                customTags: []
            };
            
            clothingData.unshift(newItem);
            renderClothingGrid();
            
            const firstCard = document.querySelector('.clothing-card');
            if (firstCard) {
                gsap.fromTo(firstCard,
                    { scale: 0.5, opacity: 0, y: -20 },
                    { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: 'back.out' }
                );
            }
        }
        
        document.getElementById('addClothingBtn').addEventListener('click', showUploadModal);
        document.getElementById('saveOutfitBtn').addEventListener('click', saveOutfit);
        
        renderClothingGrid();
    </script>
</body>
</html>
