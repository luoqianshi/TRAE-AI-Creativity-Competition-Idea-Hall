<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGradRat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="55" fill="url(#bgGradRat)" stroke="#8b6914" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#8b6914" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 老鼠身体（较小） -->
  <ellipse cx="60" cy="62" rx="22" ry="20" fill="#a0a0a0" stroke="#5a5a5a" stroke-width="2"/>
  
  <!-- 耳朵（圆耳） -->
  <circle cx="45" cy="42" r="10" fill="#a0a0a0" stroke="#5a5a5a" stroke-width="1.5"/>
  <circle cx="75" cy="42" r="10" fill="#a0a0a0" stroke="#5a5a5a" stroke-width="1.5"/>
  <circle cx="45" cy="42" r="6" fill="#e8b8c8"/>
  <circle cx="75" cy="42" r="6" fill="#e8b8c8"/>
  
  <!-- 脸部中心 -->
  <ellipse cx="60" cy="65" rx="14" ry="12" fill="#c0c0c0"/>
  
  <!-- 眼睛 -->
  <circle cx="52" cy="58" r="3.5" fill="#000"/>
  <circle cx="68" cy="58" r="3.5" fill="#000"/>
  <circle cx="51" cy="57" r="1" fill="#fff"/>
  <circle cx="67" cy="57" r="1" fill="#fff"/>
  
  <!-- 鼻子（小粉鼻） -->
  <ellipse cx="60" cy="68" rx="3" ry="2" fill="#ff69b4"/>
  
  <!-- 胡须 -->
  <g stroke="#5a5a5a" stroke-width="0.4">
    <line x1="52" y1="70" x2="40" y2="68"/>
    <line x1="52" y1="72" x2="40" y2="74"/>
    <line x1="52" y1="74" x2="42" y2="78"/>
    <line x1="68" y1="70" x2="80" y2="68"/>
    <line x1="68" y1="72" x2="80" y2="74"/>
    <line x1="68" y1="74" x2="78" y2="78"/>
  </g>
  
  <!-- 嘴 -->
  <path d="M60 71 L60 74" stroke="#5a5a5a" stroke-width="0.8"/>
  <path d="M58 75 Q60 77 Q62 75" fill="none" stroke="#5a5a5a" stroke-width="0.8"/>
  
  <!-- 门牙 -->
  <rect x="58" y="75" width="1.5" height="3" fill="#fff" stroke="#8b6914" stroke-width="0.2"/>
  <rect x="60.5" y="75" width="1.5" height="3" fill="#fff" stroke="#8b6914" stroke-width="0.2"/>
  
  <!-- 尾巴 -->
  <path d="M82 70 Q95 75 Q98 85 Q92 90 Q85 88" fill="none" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
  <path d="M82 70 Q95 75 Q98 85 Q92 90 Q85 88" fill="none" stroke="#a0a0a0" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- 毛发纹理 -->
  <g fill="#7a7a7a" opacity="0.3">
    <circle cx="48" cy="55" r="0.8"/>
    <circle cx="55" cy="52" r="0.8"/>
    <circle cx="65" cy="52" r="0.8"/>
    <circle cx="72" cy="55" r="0.8"/>
    <circle cx="50" cy="78" r="0.8"/>
    <circle cx="70" cy="78" r="0.8"/>
  </g>
  
  <!-- 等级标识 -->
  <circle cx="60" cy="100" r="8" fill="#d4a574" stroke="#8b6914" stroke-width="1.5"/>
  <text x="60" y="104" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="#5c4a3a">鼠</text>
</svg>
