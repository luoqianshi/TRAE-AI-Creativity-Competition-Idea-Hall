<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="pieceGlow" cx="50%" cy="30%">
      <stop offset="0%" style="stop-color:#fff8e7;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#f4e4c1;stop-opacity:0" />
    </radialGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="60" cy="60" r="55" fill="url(#bgGrad)" stroke="#8b6914" stroke-width="2"/>
  <circle cx="60" cy="60" r="55" fill="url(#pieceGlow)"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#8b6914" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 大象头部 -->
  <!-- 耳朵 -->
  <ellipse cx="35" cy="45" rx="18" ry="22" fill="#8b7355" stroke="#5c4a3a" stroke-width="1.5"/>
  <ellipse cx="85" cy="45" rx="18" ry="22" fill="#8b7355" stroke="#5c4a3a" stroke-width="1.5"/>
  <ellipse cx="35" cy="45" rx="12" ry="16" fill="#a08060" opacity="0.7"/>
  <ellipse cx="85" cy="45" rx="12" ry="16" fill="#a08060" opacity="0.7"/>
  
  <!-- 头部 -->
  <ellipse cx="60" cy="55" rx="28" ry="25" fill="#a08060" stroke="#5c4a3a" stroke-width="2"/>
  
  <!-- 眼睛 -->
  <circle cx="50" cy="50" r="4" fill="#fff"/>
  <circle cx="70" cy="50" r="4" fill="#fff"/>
  <circle cx="50" cy="50" r="2" fill="#2a1810"/>
  <circle cx="70" cy="50" r="2" fill="#2a1810"/>
  
  <!-- 象鼻 -->
  <path d="M60 65 Q55 80 Q50 90 Q55 95 Q65 92 Q60 80 Q65 70 Z" fill="#8b7355" stroke="#5c4a3a" stroke-width="1.5"/>
  
  <!-- 象牙 -->
  <path d="M52 62 L48 72 L50 73 Z" fill="#f5f5dc" stroke="#8b6914" stroke-width="0.5"/>
  <path d="M68 62 L72 72 L70 73 Z" fill="#f5f5dc" stroke="#8b6914" stroke-width="0.5"/>
  
  <!-- 等级标识 -->
  <circle cx="60" cy="100" r="8" fill="#d4a574" stroke="#8b6914" stroke-width="1.5"/>
  <text x="60" y="104" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="#5c4a3a">象</text>
</svg>
