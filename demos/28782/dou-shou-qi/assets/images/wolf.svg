<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGradWolf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4e4c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="55" fill="url(#bgGradWolf)" stroke="#8b6914" stroke-width="2"/>
  <circle cx="60" cy="60" r="48" fill="none" stroke="#8b6914" stroke-width="1" stroke-dasharray="3,2"/>
  
  <!-- 狼头部（较尖） -->
  <path d="M60 30 Q40 35 Q32 55 Q40 75 Q50 82 Q60 82 Q70 82 Q80 75 Q88 55 Q80 35 Q60 30" 
        fill="#8a8a8a" stroke="#4a4a4a" stroke-width="2"/>
  
  <!-- 耳朵（竖立尖耳） -->
  <path d="M42 35 L35 15 L50 28 Z" fill="#8a8a8a" stroke="#4a4a4a" stroke-width="1.5"/>
  <path d="M78" fill="#8a8a8a" stroke="#4a4a4a" stroke-width="1.5"/>
  <path d="M42 32 L38 20 L46 28 Z" fill="#6a6a6a"/>
  <path d="M78 32 L82 20 L74 28 Z" fill="#6a6a6a"/>
  
  <!-- 口鼻部 -->
  <ellipse cx="60" cy="65" rx="12" ry="10" fill="#a0a0a0"/>
  
  <!-- 眼睛 -->
  <ellipse cx="50" cy="50" rx="4" ry="5" fill="#fff"/>
  <ellipse cx="70" cy="50" rx="4" ry="5" fill="#fff"/>
  <circle cx="50" cy="52" r="2.5" fill="#ffcc00"/>
  <circle cx="70" cy="52" r="2.5" fill="#ffcc00"/>
  <circle cx="50" cy="52" r="1.2" fill="#000"/>
  <circle cx="70" cy="52" r="1.2" fill="#000"/>
  
  <!-- 眉部阴影（凶狠感） -->
  <path d="M45 45 Q50 43 Q55 46" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  <path d="M65 46 Q70 43 Q75 45" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
  
  <!-- 鼻子 -->
  <ellipse cx="60" cy="62" rx="5" ry="4" fill="#2a2a2a"/>
  
  <!-- 嘴 -->
  <path d="M60 68 L60 72" stroke="#2a2a2a" stroke-width="1.5"/>
  <path d="M60 72 Q54 76 Q50 73" fill="none" stroke="#2a2a2a" stroke-width="1.2"/>
  <path d="M60 72 Q66 76 Q70 73" fill="none" stroke="#2a2a2a" stroke-width="1.2"/>
  
  <!-- 尖牙 -->
  <path d="M56 73 L55 78 L57 75 Z" fill="#fff" stroke="#8b6914" stroke-width="0.3"/>
  <path d="M64 73 L65 78 L63 75 Z" fill="#fff" stroke="#8b6914" stroke-width="0.3"/>
  
  <!-- 毛发纹理 -->
  <g stroke="#5a5a5a" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M45 40 Q42 38 Q40 40"/>
    <path d="M75 40 Q78 38 Q80 40"/>
    <path d="M50 78 Q48 82 Q52 80"/>
    <path d="M70 78 Q72 82 Q68 80"/>
  </g>
  
  <!-- 等级标识 -->
  <circle cx="60" cy="100" r="8" fill="#d4a574" stroke="#8b6914" stroke-width="1.5"/>
  <text x="60" y="104" text-anchor="middle" font-family="serif" font-size="10" font-weight="bold" fill="#5c4a3a">狼</text>
</svg>
