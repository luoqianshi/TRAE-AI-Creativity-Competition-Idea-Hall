<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>出逃计划 Escapade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --primary-blue: #2A3BFF;
      --primary-orange: #FF5C00;
      --bg-start: #F2F6FF;
      --bg-end: #E8EDFB;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.5);
      --text-dark: #1A1A2E;
      --text-gray: #6B7280;
      --shadow-heavy: 0 20px 60px rgba(42, 59, 255, 0.15);
      --radius-xl: 28px;
      --radius-md: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      min-height: 100vh;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    .phone-frame {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      position: relative;
      background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-end) 100%);
      overflow-x: hidden;
    }

    @media (min-width: 431px) {
      body {
        background: #e0e5f2;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px 0;
      }
      .phone-frame {
        min-height: 844px;
        height: 90vh;
        max-height: 900px;
        border-radius: 40px;
        box-shadow: var(--shadow-heavy), 0 0 0 8px #fff, 0 0 0 9px rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }
    }

    .page {
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: 20px 16px 100px;
      min-height: 100%;
      overflow-y: auto;
    }

    .page.active {
      display: block;
      opacity: 1;
    }

    /* Header */
    .home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      margin-bottom: 16px;
    }

    .location-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .location-badge i {
      color: var(--primary-orange);
    }

    .notify-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-dark);
      position: relative;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .notify-btn:active {
      transform: scale(0.92);
    }

    .notify-dot {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 8px;
      height: 8px;
      background: var(--primary-orange);
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 20px;
      color: var(--text-dark);
    }

    /* Cards */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .activity-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(42, 59, 255, 0.08);
      transition: transform 0.2s ease;
    }

    .activity-card:active {
      transform: scale(0.98);
    }

    .card-image-wrap {
      position: relative;
      width: 100%;
      height: 150px;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .status-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.9);
      color: var(--primary-orange);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .card-body {
      padding: 14px;
    }

    .card-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-sub {
      font-size: 12px;
      color: var(--text-gray);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .card-join-count {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-blue);
      background: rgba(42, 59, 255, 0.08);
      padding: 6px 10px;
      border-radius: 12px;
      white-space: nowrap;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tag-pill {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #f3f4f6;
      color: var(--text-gray);
      border: 1.5px solid transparent;
    }

    .tag-pill.hot {
      border-color: var(--primary-orange);
      color: var(--primary-orange);
      background: rgba(255, 92, 0, 0.08);
    }

    .join-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, var(--primary-blue) 0%, var(--primary-orange) 100%);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .join-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 16px rgba(255, 92, 0, 0.3);
    }

    /* Publish */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-gray);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid #e5e7eb;
      background: #fff;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-dark);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(42, 59, 255, 0.1);
    }

    .form-input::placeholder {
      color: #9ca3af;
    }

    .tags-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tag-option {
      padding: 10px 16px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      background: #fff;
      color: var(--text-gray);
      border: 1.5px solid #e5e7eb;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .tag-option.selected {
      background: var(--primary-orange);
      color: #fff;
      border-color: var(--primary-orange);
    }

    .tag-option:active {
      transform: scale(0.95);
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, var(--primary-blue) 0%, var(--primary-orange) 100%);
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.15s ease;
    }

    .submit-btn:active {
      transform: scale(0.97);
    }

    /* Match */
    .match-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 480px;
      position: relative;
    }

    .radar {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle, rgba(42, 59, 255, 0.08) 0%, rgba(42, 59, 255, 0.02) 70%);
      border: 1px solid rgba(42, 59, 255, 0.15);
      overflow: hidden;
      margin-bottom: 30px;
    }

    .radar-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(42, 59, 255, 0.12);
    }

    .radar-ring:nth-child(1) { width: 33%; height: 33%; }
    .radar-ring:nth-child(2) { width: 66%; height: 66%; }
    .radar-ring:nth-child(3) { width: 100%; height: 100%; }

    .radar-sweep {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 50%;
      height: 50%;
      background: conic-gradient(from 0deg, rgba(42, 59, 255, 0.35) 0deg, rgba(42, 59, 255, 0) 90deg);
      transform-origin: 0 0;
      animation: radar-spin 6s linear infinite;
      border-radius: 0 100% 0 0;
    }

    .radar-center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      background: var(--primary-orange);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 0 rgba(255, 92, 0, 0.5);
      animation: pulse-dot 1.8s ease-out infinite;
      z-index: 2;
    }

    @keyframes radar-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-dot {
      0% { box-shadow: 0 0 0 0 rgba(255, 92, 0, 0.5); }
      70% { box-shadow: 0 0 0 14px rgba(255, 92, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 92, 0, 0); }
    }

    .match-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-gray);
      min-height: 24px;
      text-align: center;
    }

    .fab-wrap {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: none;
    }

    .fab-wrap.visible {
      display: block;
    }

    .match-fab {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #ff7a2e, var(--primary-orange));
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 0 rgba(255, 92, 0, 0.45);
      animation: fab-breathe 2s ease-in-out infinite;
      transition: transform 0.15s ease;
    }

    .match-fab:active {
      transform: scale(0.92);
    }

    @keyframes fab-breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 92, 0, 0.45); }
      50% { box-shadow: 0 0 0 20px rgba(255, 92, 0, 0); }
    }

    /* Profile */
    .profile-header {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      margin-bottom: 12px;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .profile-bio {
      font-size: 13px;
      color: var(--text-gray);
    }

    .stats-board {
      display: flex;
      justify-content: space-around;
      background: #fff;
      border-radius: var(--radius-md);
      padding: 18px 0;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(42, 59, 255, 0.06);
    }

    .stat-item {
      text-align: center;
      flex: 1;
      position: relative;
    }

    .stat-item:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 24px;
      width: 1px;
      background: #e5e7eb;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--primary-blue);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-gray);
      margin-top: 2px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .badge-cell {
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #fff 0%, #f2f6ff 100%);
      box-shadow: 0 4px 12px rgba(42, 59, 255, 0.05);
      transition: transform 0.15s ease;
    }

    .badge-cell:active {
      transform: scale(0.95);
    }

    .badge-icon {
      font-size: 24px;
    }

    .badge-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-gray);
    }

    /* Bottom Tab Bar */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      height: 76px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding-top: 12px;
      z-index: 20;
    }

    @media (min-width: 431px) {
      .tab-bar {
        border-radius: 0 0 40px 40px;
      }
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 18px;
      color: var(--text-gray);
      cursor: pointer;
      transition: color 0.2s ease, transform 0.15s ease;
      border: none;
      background: transparent;
      font-family: inherit;
    }

    .tab-item:active {
      transform: scale(0.9);
    }

    .tab-item.active {
      color: var(--primary-orange);
    }

    .tab-item i {
      font-size: 22px;
    }

    .tab-item span {
      font-size: 10px;
      font-weight: 600;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-dark);
      color: #fff;
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
      transition: top 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      max-width: 320px;
      text-align: center;
    }

    .toast.show {
      top: 24px;
    }

    @media (min-width: 431px) {
      .toast {
        top: -60px;
      }
      .toast.show {
        top: 44px;
      }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
      opacity: 0;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #fff;
      border-radius: var(--radius-xl);
      padding: 28px 22px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.25s ease;
    }

    .modal-overlay.show .modal-content {
      transform: scale(1);
    }

    .modal-emoji {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .match-card {
      background: linear-gradient(135deg, #f8faff 0%, #eef2ff 100%);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .match-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    .match-info {
      flex: 1;
    }

    .match-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .match-detail {
      font-size: 12px;
      color: var(--text-gray);
    }

    .modal-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--primary-blue);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .modal-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- Home -->
    <section id="page-home" class="page active">
      <header class="home-header">
        <div class="location-badge">
          <i class="fa-solid fa-location-dot"></i>
          <span>附近 · 广州</span>
        </div>
        <button class="notify-btn" aria-label="通知">
          <i class="fa-regular fa-bell"></i>
          <span class="notify-dot"></span>
        </button>
      </header>
      <h1 class="page-title">灵感漂流</h1>
      <div id="home-list" class="card-list"></div>
    </section>

    <!-- Publish -->
    <section id="page-publish" class="page">
      <h1 class="page-title">极速发车</h1>
      <div class="form-group">
        <label class="form-label">活动标题</label>
        <input id="pub-title" class="form-input" type="text" placeholder="例如：周末去从化溯溪" />
      </div>
      <div class="form-group">
        <label class="form-label">活动地点</label>
        <input id="pub-location" class="form-input" type="text" placeholder="例如：白云山南门" />
      </div>
      <div class="form-group">
        <label class="form-label">出发时间</label>
        <input id="pub-time" class="form-input" type="text" placeholder="例如：周六 08:00" />
      </div>
      <div class="form-group">
        <label class="form-label">搭子画像（多选）</label>
        <div id="pub-tags" class="tags-selector"></div>
      </div>
      <button id="pub-submit" class="submit-btn">🚀 立即发车</button>
    </section>

    <!-- Match -->
    <section id="page-match" class="page">
      <h1 class="page-title">雷达找搭子</h1>
      <div class="match-stage">
        <div class="radar">
          <div class="radar-ring"></div>
          <div class="radar-ring"></div>
          <div class="radar-ring"></div>
          <div class="radar-sweep"></div>
          <div class="radar-center"></div>
        </div>
        <p id="match-status" class="match-text">扫描同频兴趣...</p>
      </div>
    </section>

    <!-- Profile -->
    <section id="page-profile" class="page">
      <h1 class="page-title">出逃档案</h1>
      <div class="profile-header">
        <img id="profile-avatar" class="avatar" src="" alt="头像" />
        <div id="profile-name" class="profile-name"></div>
        <div id="profile-bio" class="profile-bio"></div>
      </div>
      <div class="stats-board">
        <div class="stat-item">
          <div class="stat-value">12</div>
          <div class="stat-label">出逃</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">9</div>
          <div class="stat-label">好评</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">4</div>
          <div class="stat-label">徽章</div>
        </div>
      </div>
      <div class="section-title">徽章墙</div>
      <div class="badge-grid">
        <div class="badge-cell"><span class="badge-icon">🏆</span><span class="badge-name">最佳捧哏</span></div>
        <div class="badge-cell"><span class="badge-icon">📸</span><span class="badge-name">人间P图师</span></div>
        <div class="badge-cell"><span class="badge-icon">🗺️</span><span class="badge-name">活地图</span></div>
        <div class="badge-cell"><span class="badge-icon">🍚</span><span class="badge-name">光盘行动家</span></div>
        <div class="badge-cell"><span class="badge-icon">🧠</span><span class="badge-name">脑洞王</span></div>
        <div class="badge-cell"><span class="badge-icon">💪</span><span class="badge-name">气氛组</span></div>
      </div>
    </section>

    <!-- Tab Bar -->
    <nav class="tab-bar">
      <button class="tab-item active" data-tab="home">
        <i class="fa-solid fa-house"></i>
        <span>首页</span>
      </button>
      <button class="tab-item" data-tab="publish">
        <i class="fa-solid fa-plus-circle"></i>
        <span>发车</span>
      </button>
      <button class="tab-item" data-tab="match">
        <i class="fa-regular fa-compass"></i>
        <span>匹配</span>
      </button>
      <button class="tab-item" data-tab="profile">
        <i class="fa-regular fa-user"></i>
        <span>我的</span>
      </button>
    </nav>

    <!-- Floating Action Button for Match -->
    <div id="fab-wrap" class="fab-wrap">
      <button id="match-fab" class="match-fab" aria-label="摇一摇匹配">
        <i class="fa-solid fa-hand-sparkles"></i>
      </button>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-emoji">🎉</div>
        <div class="modal-title">匹配成功！你们都喜欢露营！</div>
        <div id="modal-match-card" class="match-card"></div>
        <button id="modal-close" class="modal-btn">开始聊天</button>
      </div>
    </div>
  </div>

  <script>
    const activities = [
      { id: 1, title: "夜爬白云山看日出", location: "白云山南门", time: "今晚 23:30", current: 4, max: 6, tags: ["#E人天堂", "#拍照大神"], img: "https://picsum.photos/seed/mountain/400/240" },
      { id: 2, title: "正佳极地海洋馆拍照", location: "正佳广场", time: "明天 14:00", current: 2, max: 4, tags: ["#i人友好", "#纯吃选手"], img: "https://picsum.photos/seed/ocean/400/240" },
      { id: 3, title: "密室逃脱《釜山行》", location: "北京路剧情隧道", time: "周六 19:30", current: 5, max: 8, tags: ["#菜鸡互啄", "#拒绝鸽子"], img: "https://picsum.photos/seed/escape/400/240" }
    ];

    const userProfile = { name: "出逃达人陈北", bio: "周末别找我，我在山上", avatar: "https://picsum.photos/seed/avatar/200/200" };

    const matchPool = [
      { name: "阿星", age: 24, tag: "露营爱好者", avatar: "https://picsum.photos/seed/star/200/200" },
      { name: "小满", age: 22, tag: "摄影搭子", avatar: "https://picsum.photos/seed/xiaoman/200/200" },
      { name: "凯子", age: 26, tag: "徒步狂人", avatar: "https://picsum.photos/seed/kaizi/200/200" }
    ];

    const publishTagOptions = ["#i人友好", "#E人天堂", "#菜鸡互啄", "#拍照狂魔", "#拒绝鸽子"];

    const appState = {
      currentTab: 'home',
      selectedTags: [],
      matchModalVisible: false
    };

    const matchTexts = ["扫描同频兴趣...", "发现3个附近信号...", "匹配最佳搭子中..."];

    const pages = document.querySelectorAll('.page');
    const tabs = document.querySelectorAll('.tab-item');
    const fabWrap = document.getElementById('fab-wrap');
    const toastEl = document.getElementById('toast');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalMatchCard = document.getElementById('modal-match-card');

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => {
        toastEl.classList.remove('show');
      }, 3000);
    }

    function switchTab(tabName) {
      appState.currentTab = tabName;
      pages.forEach(page => page.classList.remove('active'));
      tabs.forEach(tab => tab.classList.remove('active'));
      document.getElementById(`page-${tabName}`).classList.add('active');
      document.querySelector(`.tab-item[data-tab="${tabName}"]`).classList.add('active');
      fabWrap.classList.toggle('visible', tabName === 'match');
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => switchTab(tab.dataset.tab));
    });

    function renderHome() {
      const list = document.getElementById('home-list');
      list.innerHTML = activities.map(act => {
        const spotsLeft = act.max - act.current;
        const statusText = spotsLeft <= 2 ? "🔥 即将满员" : "✨ 余位充足";
        return `
          <article class="activity-card">
            <div class="card-image-wrap">
              <img src="${act.img}" alt="${act.title}" loading="lazy" />
              <span class="status-tag">${statusText}</span>
            </div>
            <div class="card-body">
              <div class="card-meta-row">
                <div>
                  <div class="card-title">${act.title}</div>
                  <div class="card-sub">
                    <span><i class="fa-solid fa-location-dot"></i> ${act.location}</span>
                    <span><i class="fa-regular fa-clock"></i> ${act.time}</span>
                  </div>
                </div>
                <div class="card-join-count">${act.current}/${act.max}</div>
              </div>
              <div class="card-tags">
                ${act.tags.map(t => `<span class="tag-pill hot">${t}</span>`).join('')}
              </div>
              <button class="join-btn" data-id="${act.id}">加入出逃</button>
            </div>
          </article>
        `;
      }).join('');

      list.querySelectorAll('.join-btn').forEach(btn => {
        btn.addEventListener('click', () => showToast('已发送加入申请，等发起人通过～'));
      });
    }

    function renderPublishTags() {
      const container = document.getElementById('pub-tags');
      container.innerHTML = publishTagOptions.map(tag => `
        <button class="tag-option ${appState.selectedTags.includes(tag) ? 'selected' : ''}" data-tag="${tag}">${tag}</button>
      `).join('');

      container.querySelectorAll('.tag-option').forEach(btn => {
        btn.addEventListener('click', () => {
          const tag = btn.dataset.tag;
          if (appState.selectedTags.includes(tag)) {
            appState.selectedTags = appState.selectedTags.filter(t => t !== tag);
          } else {
            appState.selectedTags.push(tag);
          }
          renderPublishTags();
        });
      });
    }

    function renderProfile() {
      document.getElementById('profile-avatar').src = userProfile.avatar;
      document.getElementById('profile-name').textContent = userProfile.name;
      document.getElementById('profile-bio').textContent = userProfile.bio;
    }

    function rotateMatchText() {
      const el = document.getElementById('match-status');
      let idx = 0;
      setInterval(() => {
        idx = (idx + 1) % matchTexts.length;
        el.style.opacity = 0;
        setTimeout(() => {
          el.textContent = matchTexts[idx];
          el.style.opacity = 1;
        }, 200);
      }, 3000);
    }

    function openMatchModal() {
      const person = matchPool[Math.floor(Math.random() * matchPool.length)];
      modalMatchCard.innerHTML = `
        <img class="match-avatar" src="${person.avatar}" alt="${person.name}" />
        <div class="match-info">
          <div class="match-name">${person.name} · ${person.age}岁</div>
          <div class="match-detail">${person.tag}</div>
        </div>
      `;
      appState.matchModalVisible = true;
      modalOverlay.classList.add('show');
    }

    function closeMatchModal() {
      appState.matchModalVisible = false;
      modalOverlay.classList.remove('show');
    }

    document.getElementById('match-fab').addEventListener('click', openMatchModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeMatchModal();
    });
    document.getElementById('modal-close').addEventListener('click', () => {
      showToast('快去打个招呼吧！');
      closeMatchModal();
    });

    document.getElementById('pub-submit').addEventListener('click', () => {
      const title = document.getElementById('pub-title').value.trim();
      const location = document.getElementById('pub-location').value.trim();
      const time = document.getElementById('pub-time').value.trim();

      if (!location) {
        showToast('至少写个地点吧～');
        return;
      }
      if (!title || !time) {
        showToast('标题和时间也要填上哦');
        return;
      }

      const newActivity = {
        id: activities.length + 1,
        title,
        location,
        time,
        current: 1,
        max: 6,
        tags: appState.selectedTags.length ? appState.selectedTags : ["#新出炉"],
        img: `https://picsum.photos/seed/${Date.now()}/400/240`
      };
      activities.unshift(newActivity);
      renderHome();
      showToast('发车成功！已登上灵感漂流');
      document.getElementById('pub-title').value = '';
      document.getElementById('pub-location').value = '';
      document.getElementById('pub-time').value = '';
      appState.selectedTags = [];
      renderPublishTags();
      switchTab('home');
    });

    document.querySelector('.notify-btn').addEventListener('click', () => showToast('暂无新通知'));

    renderHome();
    renderPublishTags();
    renderProfile();
    rotateMatchText();
  </script>
</body>
</html>
