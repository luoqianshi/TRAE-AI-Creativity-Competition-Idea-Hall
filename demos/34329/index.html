<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自由绘画工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-secondary min-h-screen flex flex-col">
    <header class="bg-primary text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fas fa-paint-brush"></i>
                自由绘画板
            </h1>
            <div class="status-bar flex items-center gap-4 text-sm bg-white/20 px-4 py-2 rounded-lg">
                <span class="flex items-center gap-2">
                    <i class="fas fa-tools"></i>
                    当前工具：<strong id="currentToolName">画笔</strong>
                </span>
                <span class="flex items-center gap-2">
                    <i class="fas fa-palette"></i>
                    颜色：<span id="currentColorDisplay" class="w-4 h-4 rounded-full inline-block" style="background-color:#000000"></span>
                </span>
                <span class="flex items-center gap-2">
                    <i class="fas fa-ruler"></i>
                    大小：<strong id="currentSizeDisplay">5px</strong>
                </span>
            </div>
        </div>
    </header>

    <div class="toolbar bg-white shadow-sm py-3 px-4 border-b border-primary/20">
        <div class="container mx-auto flex flex-wrap gap-4 items-center justify-center">
            <div class="tool-group">
                <div class="group-label text-xs text-gray-500 mb-1 font-semibold">绘图工具</div>
                <div class="flex items-center gap-1 bg-neutral p-1 rounded-xl">
                    <button id="pen" class="tool-btn tool-active selected" title="画笔">
                        <i class="fas fa-pen"></i>
                    </button>
                    <button id="eraser" class="tool-btn" title="橡皮擦">
                        <i class="fas fa-eraser"></i>
                    </button>
                    <button id="selectTool" class="tool-btn" title="选择">
                        <i class="fas fa-mouse-pointer"></i>
                    </button>
                    <button id="textTool" class="tool-btn" title="文本框">
                        <i class="fas fa-font"></i>
                    </button>
                </div>
            </div>

            <div class="tool-group">
                <div class="group-label text-xs text-gray-500 mb-1 font-semibold">形状工具</div>
                <div class="relative flex items-center gap-1 bg-neutral p-1 rounded-xl">
                    <button id="shapeDropdownBtn" class="tool-btn" title="形状工具">
                        <i class="fas fa-shapes"></i>
                    </button>
                    <div id="shapeDropdownMenu" class="shape-dropdown-menu hidden absolute top-full left-0 mt-1 w-48 bg-white rounded-xl shadow-xl z-50">
                        <div class="p-2">
                            <div class="text-xs font-semibold text-gray-500 px-2 py-1">基础形状</div>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="line">
                                <i class="fas fa-minus w-4 text-center"></i>
                                <span class="text-sm">直线</span>
                            </button>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="rectangle">
                                <i class="fas fa-square w-4 text-center"></i>
                                <span class="text-sm">矩形</span>
                            </button>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="circle">
                                <i class="fas fa-circle w-4 text-center"></i>
                                <span class="text-sm">圆形</span>
                            </button>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="triangle">
                                <i class="fas fa-caret-up w-4 text-center"></i>
                                <span class="text-sm">三角形</span>
                            </button>
                            <div class="text-xs font-semibold text-gray-500 px-2 py-1 mt-2">箭头</div>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="arrow-right">
                                <i class="fas fa-arrow-right w-4 text-center"></i>
                                <span class="text-sm">单向箭头</span>
                            </button>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="arrow-both">
                                <i class="fas fa-arrows-alt-h w-4 text-center"></i>
                                <span class="text-sm">双向箭头</span>
                            </button>
                            <div class="text-xs font-semibold text-gray-500 px-2 py-1 mt-2">特殊形状</div>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="heart">
                                <i class="fas fa-heart w-4 text-center"></i>
                                <span class="text-sm">爱心</span>
                            </button>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="star">
                                <i class="fas fa-star w-4 text-center"></i>
                                <span class="text-sm">星星</span>
                            </button>
                            <button class="shape-option w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 flex items-center gap-2" data-shape="polygon">
                                <i class="fas fa-draw-polygon w-4 text-center"></i>
                                <span class="text-sm">多边形</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tool-group">
                <div class="group-label text-xs text-gray-500 mb-1 font-semibold">编辑工具</div>
                <div class="flex items-center gap-1 bg-neutral p-1 rounded-xl">
                    <button id="undo" class="tool-btn" title="撤销">
                        <i class="fas fa-undo"></i>
                    </button>
                    <button id="redo" class="tool-btn" title="重做">
                        <i class="fas fa-redo"></i>
                    </button>
                    <button id="clear" class="tool-btn" title="清空画布" style="color: #dc2626;">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>

            <div class="tool-group brush-params">
                <div class="group-label text-xs text-gray-500 mb-1 font-semibold">画笔参数</div>
                <div class="flex items-center gap-3 bg-neutral p-2 rounded-lg">
                    <div class="flex items-center gap-2">
                        <label class="text-sm text-gray-600 font-medium">颜色</label>
                        <input type="color" id="colorPicker" class="color-input w-10 h-10 rounded-lg border-2 border-primary/30 cursor-pointer">
                        <div class="color-presets flex gap-1">
                            <button class="color-preset selected" data-color="#000000" style="background-color:#000000"></button>
                            <button class="color-preset" data-color="#ff0000" style="background-color:#ff0000"></button>
                            <button class="color-preset" data-color="#00ff00" style="background-color:#00ff00"></button>
                            <button class="color-preset" data-color="#0000ff" style="background-color:#0000ff"></button>
                            <button class="color-preset" data-color="#ffff00" style="background-color:#ffff00"></button>
                            <button class="color-preset" data-color="#ff6600" style="background-color:#ff6600"></button>
                        </div>
                    </div>
                    <div class="separator w-px h-8 bg-gray-300"></div>
                    <div class="flex items-center gap-2">
                        <label class="text-sm text-gray-600 font-medium">大小</label>
                        <input type="range" id="lineWidth" min="1" max="50" value="5" class="size-slider w-20">
                        <span id="sizeValue" class="text-sm font-bold text-primary w-8">5px</span>
                        <div class="size-presets flex gap-1">
                            <button class="size-preset" data-size="2">S</button>
                            <button class="size-preset selected" data-size="5">M</button>
                            <button class="size-preset" data-size="15">L</button>
                        </div>
                    </div>
                    <div class="separator w-px h-8 bg-gray-300"></div>
                    <div class="flex items-center gap-2 bg-neutral p-2 rounded-xl">
                        <label class="text-sm text-gray-600 font-medium">背景色</label>
                        <input type="color" id="bgColorPicker" class="color-input w-10 h-10 rounded-xl border-2 border-primary/30 cursor-pointer" value="#FFFFFF">
                        <div class="bg-presets flex gap-1">
                            <button class="bg-preset" data-color="#FFFFFF" style="background-color:#FFFFFF;border:2px solid #ccc;"></button>
                            <button class="bg-preset" data-color="#F5F5F5" style="background-color:#F5F5F5;border:2px solid #ccc;"></button>
                            <button class="bg-preset" data-color="#FFF8E7" style="background-color:#FFF8E7;border:2px solid #ccc;"></button>
                            <button class="bg-preset" data-color="#E8F4FD" style="background-color:#E8F4FD;border:2px solid #ccc;"></button>
                            <button class="bg-preset" data-color="#FCE4EC" style="background-color:#FCE4EC;border:2px solid #ccc;"></button>
                        </div>
                    </div>
                    <div class="separator w-px h-8 bg-gray-300"></div>
                    <button id="openTemplatePanel" class="template-btn bg-gray-500 text-white px-3 py-2 rounded-xl hover:bg-gray-600 transition flex items-center gap-1">
                        <i class="fas fa-layer-group"></i>
                        <span class="text-sm">模板</span>
                    </button>
                </div>
            </div>

            <div class="tool-group">
                <div class="group-label text-xs text-gray-500 mb-1 font-semibold">导入/导出</div>
                <div class="flex items-center gap-1 bg-neutral p-1 rounded-xl">
                    <label id="importButton" class="import-btn tool-btn text-white cursor-pointer rounded-xl" title="导入文件（支持JSON可编辑格式和图片）">
                        <i class="fas fa-upload"></i>
                        <span class="text-xs ml-1">导入</span>
                    </label>
                    <input type="file" id="fileInput" accept=".json,.png,.jpg,.jpeg" class="hidden">
                    <button id="saveCanvas" class="save-btn tool-btn text-white rounded-xl" title="保存（可选择格式）">
                        <i class="fas fa-save"></i>
                        <span class="text-xs ml-1">保存</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="templatePanel" class="template-panel hidden">
        <div class="template-panel-content">
            <div class="template-header flex items-center justify-between mb-3">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-layer-group text-purple-600"></i>
                    画笔模板库
                </h3>
                <button id="closeTemplatePanel" class="close-panel-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="template-actions flex gap-2 mb-3">
                <button id="quickSaveTemplate" class="quick-save-btn flex-1 py-2 bg-primary text-white rounded-lg hover:bg-accent transition flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i>
                    快速保存当前参数
                </button>
            </div>
            <div id="templateList" class="template-list"></div>
        </div>
    </div>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="relative bg-white rounded-xl shadow-xl overflow-hidden border-2 border-primary/30">
            <canvas id="canvas" class="draw-shape"></canvas>
            <div id="loading" class="absolute inset-0 flex items-center justify-center bg-white/80">
                <div class="text-primary text-lg">准备就绪，可以开始绘画</div>
            </div>
        </div>
    </main>

    <footer class="bg-primary/10 py-3 text-center text-sm text-gray-600">
        <div class="container mx-auto flex items-center justify-center gap-4">
            <span>自由绘画工具 © 2025</span>
            <span class="separator">|</span>
            <span class="flex items-center gap-1">
                <i class="fas fa-mouse-pointer"></i>
                左键绘制
            </span>
            <span class="separator">|</span>
            <span class="flex items-center gap-1">
                <i class="fas fa-hand-paper"></i>
                右键取消
            </span>
        </div>
    </footer>

    <div id="saveModal" class="modal-overlay hidden">
        <div class="modal-content-save">
            <div class="modal-header">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-save text-green-600"></i>
                    导出画布
                </h3>
                <button id="closeSaveModal" class="close-modal-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">导出格式</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="exportType" value="json" checked>
                            <span class="radio-label">
                                <i class="fas fa-file-code text-blue-500"></i>
                                JSON（可编辑格式）
                            </span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="exportType" value="png">
                            <span class="radio-label">
                                <i class="fas fa-image text-green-500"></i>
                                PNG（图片格式）
                            </span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="exportType" value="pdf">
                            <span class="radio-label">
                                <i class="fas fa-file-pdf text-red-500"></i>
                                PDF（文档格式）
                            </span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">背景设置</label>
                    <div class="checkbox-item">
                        <input type="checkbox" id="includeBackground" checked>
                        <span class="checkbox-label">包含背景颜色</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">文件名</label>
                    <input type="text" id="exportFileName" class="file-name-input" placeholder="输入文件名（不含扩展名）">
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancelSave" class="cancel-btn">取消</button>
                <button id="confirmSave" class="confirm-btn">确认导出</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
