<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusPal - 项目入口</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        font-family: 'Noto Sans SC', sans-serif;
        background: #0a0e17;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: min(720px, 100%);
        padding: 40px;
        border-radius: 20px;
        background: #1a1f35;
        border: 1px solid #1e293b;
      }
      h1 {
        font-family: Orbitron, sans-serif;
        font-size: 2rem;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .subtitle { color: #94a3b8; margin-bottom: 28px; }
      .links { display: grid; gap: 12px; margin-bottom: 28px; }
      a.btn {
        display: block;
        padding: 14px 18px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 500;
        transition: transform 0.15s, opacity 0.15s;
      }
      a.btn:hover { transform: translateY(-1px); opacity: 0.95; }
      a.primary { background: linear-gradient(135deg, #6366f1, #22d3ee); color: #fff; }
      a.secondary { background: #111827; color: #22d3ee; border: 1px solid #334155; }
      .hint {
        padding: 16px;
        border-radius: 12px;
        background: #111827;
        color: #94a3b8;
        line-height: 1.7;
        font-size: 0.95rem;
      }
      code {
        padding: 2px 8px;
        border-radius: 6px;
        background: #0a0e17;
        color: #22d3ee;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>FocusPal</h1>
      <p class="subtitle">AI 学习监督官 · 项目结构入口</p>
      <div class="links">
        <a class="btn primary" href="http://localhost:5173" id="app-link">打开主应用（需先运行 npm run dev）</a>
        <a class="btn secondary" href="showcase/index.html">查看创意展示页（可直接打开）</a>
      </div>
      <div class="hint">
        <strong style="color:#e2e8f0;">启动方式：</strong><br>
        1. 在此目录终端执行 <code>npm install</code><br>
        2. 执行 <code>npm run dev</code> 同时启动前端与后端<br>
        3. 访问 <code>http://localhost:5173</code>
      </div>
    </div>
    <script>
      fetch('http://localhost:5173', { mode: 'no-cors' }).catch(function () {
        var link = document.getElementById('app-link');
        link.style.opacity = '0.7';
        link.title = '开发服务器未启动，请先运行 npm run dev';
      });
    </script>
  </body>
</html>
