<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusPal - AI 学习监督官</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      #file-protocol-warning {
        display: none;
        min-height: 100vh;
        margin: 0;
        padding: 48px 24px;
        font-family: 'Noto Sans SC', sans-serif;
        background: #0a0e17;
        color: #f8fafc;
        box-sizing: border-box;
      }
      #file-protocol-warning .card {
        max-width: 640px;
        margin: 0 auto;
        padding: 32px;
        border-radius: 16px;
        background: #1a1f35;
        border: 1px solid #1e293b;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      #file-protocol-warning h1 {
        margin: 0 0 12px;
        font-family: Orbitron, sans-serif;
        font-size: 1.75rem;
        background: linear-gradient(135deg, #6366f1, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #file-protocol-warning p {
        margin: 0 0 16px;
        line-height: 1.7;
        color: #94a3b8;
      }
      #file-protocol-warning code {
        padding: 2px 8px;
        border-radius: 6px;
        background: #111827;
        color: #22d3ee;
        font-size: 0.95em;
      }
      #file-protocol-warning ol {
        margin: 0 0 20px;
        padding-left: 1.25rem;
        color: #cbd5e1;
        line-height: 1.9;
      }
      #file-protocol-warning a {
        color: #22d3ee;
        text-decoration: none;
      }
      #file-protocol-warning a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="file-protocol-warning">
      <div class="card">
        <h1>FocusPal 无法直接打开</h1>
        <p>这是一个 Vue + Vite 项目，不能通过双击 HTML 文件运行。浏览器无法加载 <code>/src/main.ts</code> 等模块，因此页面会空白。</p>
        <ol>
          <li>在项目根目录打开终端</li>
          <li>运行 <code>npm install</code>（首次）</li>
          <li>运行 <code>npm run dev</code> 启动前后端</li>
          <li>在浏览器访问 <a href="http://localhost:5173">http://localhost:5173</a></li>
        </ol>
        <p>仅启动前端：<code>npm run dev:client</code> · 仅启动后端：<code>npm run dev:server</code></p>
      </div>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.getElementById('file-protocol-warning').style.display = 'block';
      } else {
        var s = document.createElement('script');
        s.type = 'module';
        s.src = '/src/main.ts';
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
