<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>满地找钱 · 全期重点笔记目录</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAF8F5;
            --bg-card: #FFFFFF;
            --bg-warm: #FDF6ED;
            --bg-muted: #F3F0EB;
            --text-primary: #2D2A26;
            --text-secondary: #6B6560;
            --text-muted: #9A9590;
            --accent-clay: #C97B63;
            --accent-clay-light: #FDF0EA;
            --accent-clay-soft: #E8C4B8;
            --accent-sage: #8A9A87;
            --accent-sage-light: #EEF2ED;
            --accent-lavender: #A89BBE;
            --accent-lavender-light: #F0EDF5;
            --border-light: #E8E4DF;
            --shadow-soft: 0 2px 12px rgba(45, 42, 38, 0.06);
            --shadow-medium: 0 8px 32px rgba(45, 42, 38, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 40px 0 36px;
        }

        .tag {
            display: inline-block;
            padding: 6px 18px;
            background: var(--bg-warm);
            color: var(--accent-clay);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.8px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 34px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 300;
            line-height: 1.7;
            max-width: 480px;
            margin: 0 auto 20px;
        }

        .meta-bar {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 40px;
            font-size: 13px;
            color: var(--text-muted);
            box-shadow: var(--shadow-soft);
        }

        .meta-bar span { display: flex; align-items: center; gap: 6px; }
        .meta-bar .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-sage); }

        /* Stats */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-bottom: 32px;
            padding: 20px;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
        }

        .stat-item { text-align: center; }
        .stat-number {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-clay);
        }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        /* Search */
        .search-wrap {
            position: relative;
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px 14px 46px;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            background: var(--bg-card);
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-soft);
        }

        .search-input:focus {
            border-color: var(--accent-clay-soft);
            box-shadow: 0 0 0 3px var(--accent-clay-light);
        }

        .search-input::placeholder { color: var(--text-muted); }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Filters */
        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-light);
            background: var(--bg-card);
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .filter-tab:hover { background: var(--bg-muted); }
        .filter-tab.active {
            background: var(--accent-clay);
            color: #FFF;
            border-color: var(--accent-clay);
        }

        /* Episode List */
        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .episode-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
            transition: all 0.2s ease;
        }

        .episode-card:hover {
            box-shadow: var(--shadow-medium);
            transform: translateY(-1px);
            border-color: var(--accent-clay-soft);
        }

        .episode-card.hidden { display: none; }

        .ep-number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: var(--bg-muted);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            flex-shrink: 0;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .ep-number.ready {
            background: var(--accent-clay-light);
            color: var(--accent-clay);
        }

        .ep-info { flex: 1; min-width: 0; }
        .ep-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ep-meta {
            font-size: 12px;
            color: var(--text-muted);
        }

        .ep-status {
            display: inline-block;
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 500;
            border-radius: 12px;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .ep-status.ready {
            background: var(--accent-sage-light);
            color: var(--accent-sage);
        }
        .ep-status.upcoming {
            background: var(--bg-muted);
            color: var(--text-muted);
        }

        .ep-action {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
            flex-shrink: 0;
            border: none;
            cursor: pointer;
        }

        .ep-action.primary {
            background: var(--accent-clay);
            color: #FFF;
        }
        .ep-action.primary:hover { background: #B56A52; }

        .ep-action.disabled {
            background: var(--bg-muted);
            color: var(--text-muted);
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        .empty-state p { font-size: 14px; margin-top: 8px; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 0 24px;
            border-top: 1px solid var(--border-light);
            margin-top: 32px;
        }

        .footer-brand {
            font-family: 'Noto Serif SC', serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        .footer p { font-size: 13px; color: var(--text-muted); }

        /* Responsive */
        @media (max-width: 640px) {
            .container { padding: 24px 16px; }
            h1 { font-size: 26px; }
            .hero { padding: 24px 0 20px; }
            .stats-bar { gap: 20px; padding: 16px; }
            .stat-number { font-size: 20px; }
            .episode-card { padding: 14px 16px; gap: 12px; }
            .ep-number { width: 38px; height: 38px; font-size: 12px; }
            .ep-title { font-size: 14px; }
            .meta-bar { flex-direction: column; gap: 8px; padding: 12px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="tag">满地找钱 · 全期笔记目录</div>
            <h1>满地找钱</h1>
            <p class="subtitle">在前途未知的职场轨道以外，寻找野路子的搞钱旷野。希望陪每一个爱折腾的年轻人，先找到人生中的第一个100万。</p>
            <div class="meta-bar">
                <span><i class="dot"></i> 主播：一零</span>
                <span style="color: var(--border-light);">|</span>
                <span>已收录 139 期</span>
                <span style="color: var(--border-light);">|</span>
                <span>持续更新中</span>
            </div>
        </header>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-number" id="total-count">139</div>
                <div class="stat-label">总期数</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="ready-count">0</div>
                <div class="stat-label">已上线笔记</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="upcoming-count">139</div>
                <div class="stat-label">待更新</div>
            </div>
        </div>

        <div class="search-wrap">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索期数或关键词...">
        </div>

        <div class="filter-tabs">
            <div class="filter-tab active" data-filter="all">全部</div>
            <div class="filter-tab" data-filter="ready">已上线</div>
            <div class="filter-tab" data-filter="upcoming">待更新</div>
        </div>

        <div class="episode-list" id="episodeList">
            <!-- Episodes will be generated by JS -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <p>没有找到匹配的期数</p>
        </div>

        <footer class="footer">
            <div class="footer-brand">满地找钱</div>
            <p>希望陪每一个爱折腾的年轻人，先找到人生中的第一个100万</p>
        </footer>
    </div>

    <script>
        // ==========================================
        // 数据配置区：在此处维护每期笔记的标题和链接
        // ==========================================
        // 示例格式：
        // { id: 1, title: "第一期标题", url: "./notes/vol-001.html", ready: true }
        // ready: true 表示笔记已上线，按钮可点击
        // ready: false 表示待更新，按钮禁用
        //
        // 当前全部139期已生成占位，用户只需把对应期的 ready 改为 true
        // 并填入 url 和真实标题即可
        // ==========================================

        const EPISODES = [];
        for (let i = 1; i <= 139; i++) {
            EPISODES.push({
                id: i,
                title: `第 ${i} 期`,
                url: `#vol-${String(i).padStart(3, '0')}`,
                ready: false
            });
        }

        // 已上线笔记覆盖：
        EPISODES[0] = { id: 1, title: "AI那么火，哪些方向暗藏金币？", url: "./vol-001.html", ready: true };
        EPISODES[1] = { id: 2, title: "土木VS金融VS互联网沉浮录：专业已是明日黄花，毕业生应该何去何从？", url: "./vol-002.html", ready: true };
        EPISODES[2] = { id: 3, title: "毕业不失业！左手高薪高风险，右手稳定有户口，你随便挑", url: "./vol-003.html", ready: true };

        // ==========================================
        // 渲染逻辑（无需修改）
        // ==========================================
        const listEl = document.getElementById('episodeList');
        const emptyEl = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const filterTabs = document.querySelectorAll('.filter-tab');

        let currentFilter = 'all';
        let searchQuery = '';

        function render() {
            listEl.innerHTML = '';
            let visibleCount = 0;
            let readyCount = 0;

            EPISODES.forEach(ep => {
                if (ep.ready) readyCount++;

                const matchFilter = currentFilter === 'all'
                    || (currentFilter === 'ready' && ep.ready)
                    || (currentFilter === 'upcoming' && !ep.ready);

                const matchSearch = !searchQuery
                    || String(ep.id).includes(searchQuery)
                    || ep.title.toLowerCase().includes(searchQuery.toLowerCase());

                if (matchFilter && matchSearch) {
                    visibleCount++;
                    const card = document.createElement('div');
                    card.className = 'episode-card';
                    card.innerHTML = `
                        <div class="ep-number ${ep.ready ? 'ready' : ''}">${String(ep.id).padStart(3, '0')}</div>
                        <div class="ep-info">
                            <div class="ep-title">${ep.title}</div>
                            <div class="ep-meta">Vol.${ep.id} · ${ep.ready ? '笔记已整理' : '笔记待整理'}</div>
                        </div>
                        <span class="ep-status ${ep.ready ? 'ready' : 'upcoming'}">${ep.ready ? '已上线' : '待更新'}</span>
                        ${ep.ready && ep.url
                            ? `<a href="${ep.url}" class="ep-action primary">打开笔记</a>`
                            : `<button class="ep-action disabled" disabled>即将上线</button>`
                        }
                    `;
                    listEl.appendChild(card);
                }
            });

            emptyEl.style.display = visibleCount === 0 ? 'block' : 'none';
            document.getElementById('ready-count').textContent = readyCount;
            document.getElementById('upcoming-count').textContent = EPISODES.length - readyCount;
        }

        // Search
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            render();
        });

        // Filter tabs
        filterTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                filterTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                render();
            });
        });

        // Initial render
        render();
    </script>
</body>
</html>
