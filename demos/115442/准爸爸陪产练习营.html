<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>准爸爸陪产练习营 · 爸爸上岗训练营</title>
<style>
  :root{
    --baby-blue:#a8d8ea;
    --baby-pink:#ffb5ba;
    --cream:#fff8f0;
    --navy:#2d4858;
    --soft:#e8f4f8;
    --accent:#ff8fa3;
    --green:#7ec8a0;
    --lilac:#d4a5d9;
    --warm:#fff0e6;
    --shadow: rgba(45,72,88,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Comic Sans MS","Microsoft YaHei",sans-serif;
    background:var(--cream);
    background-image:
      radial-gradient(circle at 5% 10%, rgba(168,216,234,.35), transparent 45%),
      radial-gradient(circle at 95% 90%, rgba(255,181,186,.35), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(124,200,160,.08), transparent 60%);
    min-height:100vh;
    color:var(--navy);
    padding:28px 14px;
    line-height:1.7;
  }
  .wrap{max-width:1000px;margin:0 auto}

  /* Header */
  .header{text-align:center;margin-bottom:32px;position:relative}
  .baby-icons{font-size:32px;margin-bottom:10px;letter-spacing:10px;animation:wiggle 3s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
  h1{font-size:clamp(28px,5vw,42px);color:var(--accent);text-shadow:2px 2px 0 #fff,0 4px 12px rgba(255,143,163,.2);margin-bottom:8px}
  .slogan{font-size:clamp(15px,3vw,19px);color:var(--navy);max-width:600px;margin:0 auto;padding:0 20px}
  .header-badges{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
  .tag{display:inline-block;background:var(--baby-blue);color:var(--navy);font-size:12px;padding:6px 16px;border-radius:20px;font-family:sans-serif;box-shadow:0 2px 6px var(--shadow)}
  .tag.pink{background:var(--baby-pink);color:#fff}
  .tag.green{background:var(--green);color:#fff}

  /* Section cards */
  .section-card{
    background:#fff;
    border-radius:28px;
    padding:clamp(20px,4vw,32px);
    margin-bottom:26px;
    box-shadow:0 10px 34px var(--shadow);
    border:2px solid var(--soft);
    position:relative;
    overflow:hidden;
  }
  .section-card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--baby-blue),var(--baby-pink),var(--accent),var(--lilac));
  }
  .section-title{
    font-size:clamp(20px,4vw,26px);
    color:var(--accent);
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  /* Tabs */
  .tab-bar{
    display:flex;
    gap:8px;
    margin-bottom:22px;
    flex-wrap:wrap;
    background:var(--soft);
    padding:6px;
    border-radius:18px;
  }
  .tab-btn{
    flex:1;
    min-width:90px;
    padding:12px 8px;
    border:none;
    border-radius:14px;
    background:transparent;
    color:var(--navy);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:all .25s;
    font-family:inherit;
  }
  .tab-btn:hover{background:rgba(255,255,255,.6)}
  .tab-btn.active{background:#fff;color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .tab-panel{display:none;animation:fadeIn .4s ease}
  .tab-panel.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  /* Progress ring */
  .progress-wrap{
    display:flex;
    align-items:center;
    gap:24px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .ring-box{
    position:relative;
    width:140px;height:140px;
    flex-shrink:0;
  }
  .ring-bg{fill:none;stroke:var(--soft);stroke-width:10}
  .ring-fill{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:50% 50%;
    transition:stroke-dashoffset .6s ease;
  }
  .ring-text{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-num{font-size:32px;font-weight:bold;color:var(--accent)}
  .ring-lbl{font-size:12px;color:#888}
  .progress-info{flex:1;min-width:220px}
  .progress-info h3{font-size:18px;margin-bottom:8px;color:var(--navy)}
  .progress-info p{font-size:14px;color:#666}

  /* Training grid */
  .training-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px}
  .lesson{
    background:linear-gradient(135deg,var(--baby-blue),var(--baby-pink));
    border-radius:20px;
    padding:18px 14px;
    text-align:center;
    cursor:pointer;
    transition:all .25s;
    color:#fff;
    position:relative;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.1);
  }
  .lesson:hover{transform:translateY(-5px) rotate(-1deg);box-shadow:0 8px 24px rgba(0,0,0,.15)}
  .lesson:active{transform:scale(.97)}
  .lesson.done{background:linear-gradient(135deg,var(--green),#a8e6cf)}
  .lesson .l-icon{font-size:34px;display:block;margin-bottom:6px}
  .lesson .l-name{font-size:14px;font-weight:700}
  .lesson .l-status{font-size:11px;margin-top:6px;opacity:.9}
  .lesson .check{
    position:absolute;top:8px;right:8px;
    width:22px;height:22px;border-radius:50%;
    background:rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;transition:all .25s;
  }
  .lesson.done .check{background:#fff;color:var(--green)}

  /* Accordion */
  .accordion{margin-top:18px;border-radius:18px;overflow:hidden}
  .acc-item{background:#fff;border:1px solid var(--soft);margin-bottom:10px;border-radius:16px;overflow:hidden}
  .acc-head{
    width:100%;padding:16px 18px;
    display:flex;justify-content:space-between;align-items:center;
    background:var(--warm);border:none;cursor:pointer;font-size:15px;font-weight:700;color:var(--navy);font-family:inherit;
  }
  .acc-head:hover{background:#fff2e8}
  .acc-arrow{transition:transform .3s;font-size:12px}
  .acc-item.open .acc-arrow{transform:rotate(180deg)}
  .acc-body{
    max-height:0;overflow:hidden;
    transition:max-height .35s ease,padding .35s ease;
    padding:0 18px;
  }
  .acc-item.open .acc-body{max-height:500px;padding:0 18px 18px}
  .acc-body p{font-size:14px;color:#555;margin-bottom:8px;line-height:1.8}
  .acc-body ul{padding-left:18px;margin-top:6px}
  .acc-body li{font-size:14px;color:#555;line-height:1.9}

  /* Carousel */
  .carousel-wrap{position:relative;margin-top:18px}
  .carousel{overflow:hidden;border-radius:20px;background:linear-gradient(135deg,var(--soft),#fff);border:2px solid var(--soft)}
  .carousel-track{display:flex;transition:transform .4s ease}
  .carousel-slide{min-width:100%;padding:22px 24px}
  .slide-tip{
    background:var(--accent);color:#fff;display:inline-block;padding:4px 12px;border-radius:12px;font-size:12px;margin-bottom:10px;
  }
  .slide-title{font-size:18px;color:var(--navy);margin-bottom:8px;font-weight:700}
  .slide-text{font-size:15px;color:#555;line-height:1.8}
  .carousel-nav{
    display:flex;justify-content:center;gap:8px;margin-top:14px;
  }
  .carousel-dot{width:10px;height:10px;border-radius:50%;border:none;background:#ddd;cursor:pointer;transition:all .25s}
  .carousel-dot.active{background:var(--accent);transform:scale(1.2)}
  .carousel-arrow{
    position:absolute;top:50%;transform:translateY(-50%);
    width:36px;height:36px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);
    cursor:pointer;font-size:16px;color:var(--accent);display:flex;align-items:center;justify-content:center;
  }
  .carousel-arrow.prev{left:-12px}
  .carousel-arrow.next{right:-12px}
  .carousel-arrow:hover{background:var(--accent);color:#fff}

  /* Quiz */
  .scenario{background:var(--soft);border-radius:18px;padding:20px;margin-bottom:14px}
  .s-q{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--navy)}
  .options{display:flex;gap:10px;flex-wrap:wrap}
  .opt{
    padding:12px 18px;border-radius:14px;border:2px solid #e0e0e0;
    background:#fff;cursor:pointer;font-size:14px;transition:all .15s;font-family:inherit;
  }
  .opt:hover{border-color:var(--accent);background:#fff5f7;transform:translateY(-2px)}
  .opt.correct{border-color:var(--green);background:#e8f8ee;color:#2a6a46}
  .opt.wrong{border-color:#ff6b6b;background:#fff0f0;color:#a83232}
  .opt:disabled{opacity:.7;cursor:not-allowed;transform:none}
  .feedback{margin-top:12px;font-size:14px;color:#666;min-height:20px;padding:10px 14px;border-radius:12px;background:#fff;display:none}
  .feedback.show{display:block}
  .feedback.correct{background:#e8f8ee;color:#2a6a46}
  .feedback.wrong{background:#fff0f0;color:#a83232}

  /* Badge area */
  .badge-area{text-align:center;margin:24px 0;min-height:50px}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(135deg,#ffd700,#ffb347);color:#fff;
    padding:12px 26px;border-radius:28px;font-size:17px;font-weight:700;
    box-shadow:0 4px 14px rgba(255,179,71,.4);
    animation:popIn .5s ease;
  }
  @keyframes popIn{0%{transform:scale(0)}80%{transform:scale(1.1)}100%{transform:scale(1)}}

  /* Due date calculator */
  .calc-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
  .calc-input{
    padding:12px 16px;border:2px solid var(--soft);border-radius:14px;
    font-size:15px;font-family:inherit;color:var(--navy);background:#fff;
  }
  .calc-btn{
    padding:12px 22px;border:none;border-radius:14px;
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    transition:all .2s;font-family:inherit;
  }
  .calc-btn:hover{background:#ff6b8a;transform:translateY(-2px)}
  .calc-result{margin-top:14px;font-size:15px;color:#555;min-height:24px}
  .calc-result b{color:var(--accent)}

  /* Footer */
  .footer{text-align:center;margin-top:32px;color:#aaa;font-size:13px;font-family:sans-serif}

  /* Responsive */
  @media (max-width:640px){
    body{padding:18px 10px}
    .header{margin-bottom:24px}
    .tab-btn{font-size:13px;padding:10px 6px;min-width:75px}
    .progress-wrap{justify-content:center;text-align:center}
    .progress-info{width:100%}
    .training-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .lesson{padding:14px 8px}
    .options{flex-direction:column}
    .opt{width:100%;text-align:center}
    .carousel-arrow{display:none}
  }
  @media (max-width:380px){
    .training-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="baby-icons">👶🍼🧸🍼👶</div>
    <h1>准爸爸陪产练习营</h1>
    <div class="slogan">"别等孩子出生才手忙脚乱，先来领个上岗证！"</div>
    <div class="header-badges">
      <span class="tag">🤰 产前准备</span>
      <span class="tag pink">🏥 产房实战</span>
      <span class="tag green">👨‍🍼 产后照护</span>
    </div>
  </div>

  <!-- Progress & Training -->
  <div class="section-card">
    <div class="section-title">📋 你的陪产训练进度</div>
    <div class="progress-wrap">
      <div class="ring-box">
        <svg viewBox="0 0 140 140" width="140" height="140">
          <circle class="ring-bg" cx="70" cy="70" r="60"></circle>
          <circle class="ring-fill" id="ringFill" cx="70" cy="70" r="60" stroke-dasharray="377" stroke-dashoffset="377"></circle>
        </svg>
        <div class="ring-text">
          <div class="ring-num" id="ringNum">0%</div>
          <div class="ring-lbl">训练完成</div>
        </div>
      </div>
      <div class="progress-info">
        <h3>完成全部课程，解锁「爸爸上岗证」</h3>
        <p>点击课程卡片标记学习进度。每完成一个模块，就会点亮一个知识点。建议按顺序学习：准备 → 实战 → 照护。</p>
      </div>
    </div>
    <div class="training-grid" id="trainingGrid"></div>
  </div>

  <!-- Tabs Section -->
  <div class="section-card">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab(0)">🤰 产前准备</button>
      <button class="tab-btn" onclick="switchTab(1)">🏥 产房实战</button>
      <button class="tab-btn" onclick="switchTab(2)">👨‍🍼 产后照护</button>
      <button class="tab-btn" onclick="switchTab(3)">📅 预产期计算</button>
    </div>

    <div class="tab-panel active" id="tab0">
      <div class="section-title">🎒 待产包清单</div>
      <div class="accordion" id="acc0"></div>
    </div>

    <div class="tab-panel" id="tab1">
      <div class="section-title">🏥 产房陪产指南</div>
      <div class="accordion" id="acc1"></div>
    </div>

    <div class="tab-panel" id="tab2">
      <div class="section-title">👨‍🍼 新生儿照护</div>
      <div class="accordion" id="acc2"></div>
    </div>

    <div class="tab-panel" id="tab3">
      <div class="section-title">📅 预产期计算</div>
      <p style="font-size:15px;color:#555;margin-bottom:12px">输入末次月经第一天，自动估算预产期与当前孕周。</p>
      <div class="calc-row">
        <input type="date" class="calc-input" id="lastPeriod">
        <button class="calc-btn" onclick="calcDue()">计算</button>
      </div>
      <div class="calc-result" id="calcResult"></div>
    </div>
  </div>

  <!-- Daily Tips Carousel -->
  <div class="section-card">
    <div class="section-title">💡 每日温情贴士</div>
    <div class="carousel-wrap">
      <button class="carousel-arrow prev" onclick="moveCarousel(-1)">‹</button>
      <div class="carousel">
        <div class="carousel-track" id="carouselTrack"></div>
      </div>
      <button class="carousel-arrow next" onclick="moveCarousel(1)">›</button>
      <div class="carousel-nav" id="carouselDots"></div>
    </div>
  </div>

  <!-- Quiz -->
  <div class="section-card">
    <div class="section-title">🎮 情景模拟考核</div>
    <div class="sim-area" id="simArea"></div>
    <div class="badge-area" id="badgeArea"></div>
  </div>

  <div class="footer">DAD-TO-BE CAMP · 爸爸上岗证 · 用爱陪伴每一次呼吸</div>
</div>

<script>
const lessons=[
  {icon:"🎒",name:"待产包清单",done:false},
  {icon:"🚗",name:"送医路线规划",done:false},
  {icon:"✋",name:"产房陪产姿势",done:false},
  {icon:"🍼",name:"新生儿抱持",done:false},
  {icon:"🌙",name:"夜间安抚技巧",done:false},
  {icon:"💔",name:"产后情绪识别",done:false}
];
const accordions=[
  [
    {t:"妈妈入院包",c:"<p>产褥垫 10 片、安心裤/卫生巾 2 包、哺乳内衣 2 件、吸管杯、洗漱用品、拖鞋。</p><ul><li>建议用透明分装袋标注，紧急时刻 30 秒找到。</li></ul>"},
    {t:"宝宝出生包",c:"<p>NB 码纸尿裤 1 包、52 码连体衣 2-3 件、包被 1 条、纱布巾 2 条、婴儿湿巾。</p><ul><li>医院通常提供婴儿包被，但自备更安心。</li></ul>"},
    {t:"证件与现金",c:"<p>身份证、医保卡、产检本、押金（现金/银行卡/手机支付）、充电宝。</p><ul><li>所有证件放一个透明文件袋，交给准爸爸保管。</li></ul>"}
  ],
  [
    {t:"宫缩来时怎么办",c:"<p>帮她记录宫缩频率，提醒深呼吸：鼻吸 4 秒、嘴吐 6 秒。不要问「疼不疼」，改说「我在，你很棒」。</p>"},
    {t:"何时该出发去医院",c:"<p>初产妇：规律宫缩 5-6 分钟一次，每次持续 30 秒以上；破水立即平躺垫高臀部，立刻出发。</p>"},
    {t:"产房里的陪伴禁区",c:"<ul><li>不要一直玩手机或离开。</li><li>不要抱怨等待时间长。</li><li>不要替医生做判断。</li></ul>"}
  ],
  [
    {t:"正确抱姿",c:"<p>一手托住头颈，一手托住臀部，让宝宝的头略高于身体，贴近你的胸口。</p>"},
    {t:"换尿布流程",c:"<p>垫巾 → 解开旧尿布 → 湿巾从前向后擦 → 晾干 → 新尿布 → 粘扣留一指空隙。</p>"},
    {t:"识别产后情绪",c:"<p>产后激素骤降，妈妈可能突然哭泣或烦躁。多倾听、少讲道理，主动承担夜间安抚。</p>"}
  ]
];
const tips=[
  {tag:"Day 1",title:"提前熟悉医院路线",text:"在预产期前 2 周，工作日和夜晚各走一次路线，记录停车入口与急诊位置。"},
  {tag:"Day 2",title:"练习打包待产包",text:"把证件、妈妈用品、宝宝用品分三层装包，让准爸爸能在黑暗中 1 分钟拿到。"},
  {tag:"Day 3",title:"学会数宫缩",text:"下载宫缩记录 App，或用手机秒表记录：开始时间、持续秒数、间隔分钟。"},
  {tag:"Day 4",title:"准备鼓励话术",text:"把「加油」换成「你做得很好」「我陪着你」「再坚持一下，你超级厉害」。"},
  {tag:"Day 5",title:"了解产后禁忌",text:"产后第一周不要大补油腻汤水；帮助妈妈多喝水、多休息、观察恶露颜色。"}
];
const scenarios=[
  {
    q:"Q1：妻子突然说「我可能要生了」，你的第一反应是？",
    opts:[
      {t:"先淡定观察5分钟",r:"wrong",f:"淡定？这不是淡定的时候，是行动的时候！"},
      {t:"立刻拿待产包出发去医院",r:"correct",f:"正确！待产包要提前放在玄关显眼处，拎包就走。"},
      {t:"先打电话通知双方父母",r:"wrong",f:"先通知谁可以之后做，第一优先级是确认待产包和出发。"}
    ]
  },
  {
    q:"Q2：在产房陪产，妻子痛得抓你的手，你应该：",
    opts:[
      {t:"说「再忍忍就过去了」",r:"wrong",f:"说「忍忍」会让妻子更委屈，她需要的是被理解。"},
      {t:"握紧她的手引导呼吸节律",r:"correct",f:"满分！共情+呼吸引导，是陪产的最佳姿势。"},
      {t:"躲到角落不敢看",r:"wrong",f:"让妻子独自面对会加重恐惧，陪伴本身就是力量。"}
    ]
  },
  {
    q:"Q3：宝宝出生后第一次哭闹，你首先应该：",
    opts:[
      {t:"立刻塞奶瓶",r:"wrong",f:"先判断需求：饿了、尿布湿了、冷了，还是只是想要安抚。"},
      {t:"检查尿布并尝试肌肤接触",r:"correct",f:"正确！肌肤接触能让宝宝快速平静，也能促进妈妈泌乳。"},
      {t:"摇铃逗他玩",r:"wrong",f:"新生儿需要的是安全感和温暖，而不是玩具。"}
    ]
  }
];
let correctCount=0, currentSlide=0, carouselAuto;

function renderLessons(){
  document.getElementById('trainingGrid').innerHTML=lessons.map((l,i)=>
    `<div class="lesson ${l.done?'done':''}" onclick="toggleLesson(${i})">
      <div class="check">${l.done?'✓':'○'}</div>
      <div class="l-icon">${l.icon}</div>
      <div class="l-name">${l.name}</div>
      <div class="l-status">${l.done?'已完成':'点击学习'}</div>
    </div>`).join('');
  const done=lessons.filter(l=>l.done).length;
  const pct=Math.round(done/lessons.length*100);
  const ring=document.getElementById('ringFill');
  const offset=377*(1-pct/100);
  ring.style.strokeDashoffset=offset;
  document.getElementById('ringNum').textContent=pct+'%';
  if(pct===100){
    document.getElementById('badgeArea').innerHTML='<div class="badge">🏆 爸爸上岗证已解锁</div>';
  } else {
    document.getElementById('badgeArea').innerHTML='';
  }
}
function toggleLesson(i){lessons[i].done=!lessons[i].done;renderLessons();}

function switchTab(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.querySelectorAll('.tab-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
}

function renderAccordions(){
  accordions.forEach((list,idx)=>{
    document.getElementById('acc'+idx).innerHTML=list.map((a,i)=>
      `<div class="acc-item ${i===0?'open':''}">
        <button class="acc-head" onclick="toggleAcc(this)">
          <span>${a.t}</span><span class="acc-arrow">▼</span>
        </button>
        <div class="acc-body">${a.c}</div>
      </div>`).join('');
  });
}
function toggleAcc(btn){
  const item=btn.parentElement;
  const wasOpen=item.classList.contains('open');
  document.querySelectorAll('.acc-item').forEach(it=>it.classList.remove('open'));
  if(!wasOpen) item.classList.add('open');
}

function renderCarousel(){
  document.getElementById('carouselTrack').innerHTML=tips.map(t=>
    `<div class="carousel-slide">
      <div class="slide-tip">${t.tag}</div>
      <div class="slide-title">${t.title}</div>
      <div class="slide-text">${t.text}</div>
    </div>`).join('');
  document.getElementById('carouselDots').innerHTML=tips.map((_,i)=>
    `<button class="carousel-dot ${i===0?'active':''}" onclick="goToSlide(${i})"></button>`).join('');
}
function updateCarousel(){
  document.getElementById('carouselTrack').style.transform='translateX(-'+currentSlide*100+'%)';
  document.querySelectorAll('.carousel-dot').forEach((d,i)=>d.classList.toggle('active',i===currentSlide));
}
function moveCarousel(dir){
  currentSlide=(currentSlide+dir+tips.length)%tips.length;
  updateCarousel();resetCarousel();
}
function goToSlide(i){currentSlide=i;updateCarousel();resetCarousel();}
function resetCarousel(){clearInterval(carouselAuto);carouselAuto=setInterval(()=>moveCarousel(1),5000);}

function renderQuiz(){
  document.getElementById('simArea').innerHTML=scenarios.map((s,si)=>
    `<div class="scenario" id="scenario${si}">
      <div class="s-q">${s.q}</div>
      <div class="options">${s.opts.map((o,oi)=>
        `<button class="opt" onclick="answer(${si},${oi},this)">${o.t}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback${si}"></div>
    </div>`).join('');
}
function answer(si,oi,btn){
  const s=scenarios[si];
  const o=s.opts[oi];
  const scenario=document.getElementById('scenario'+si);
  scenario.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.remove('correct','wrong');});
  btn.classList.add(o.r);
  const fb=document.getElementById('feedback'+si);
  fb.innerHTML=(o.r==='correct'?'✓ ':'✗ ')+o.f;
  fb.className='feedback show '+o.r;
  if(o.r==='correct'){
    correctCount++;
    if(correctCount>=2 && !lessons[2].done){lessons[2].done=true;renderLessons();}
  }
}

function calcDue(){
  const d=document.getElementById('lastPeriod').value;
  const res=document.getElementById('calcResult');
  if(!d){res.innerHTML='请先选择末次月经日期。';return}
  const last=new Date(d);
  const due=new Date(last.getTime()+280*24*60*60*1000);
  const today=new Date();
  const diff=Math.floor((today-last.getTime())/(1000*60*60*24));
  const week=Math.floor(diff/7);
  const day=diff%7;
  res.innerHTML=`预产期约为 <b>${due.getFullYear()}年${due.getMonth()+1}月${due.getDate()}日</b>，当前约 <b>孕 ${week} 周 ${day} 天</b>。`;
}

renderLessons();renderAccordions();renderCarousel();renderQuiz();resetCarousel();
</script>
</body>
</html>
