<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dungeon Master - 游戏</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary-color: #d4a574;
            --secondary-color: #e8d5b7;
            --accent-color: #8b5a2b;
            --bg-dark: #0d0d1a;
            --bg-medium: #1a1a2e;
            --bg-light: #222244;
            --text-color: #c9b896;
            --card-bg: linear-gradient(135deg, #f4e4bc, #e8d5b7);
            --card-border: #8b5a2b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-medium) 50%, var(--bg-light) 100%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        .theme-fantasy {
            --primary-color: #d4a574;
            --secondary-color: #e8d5b7;
            --accent-color: #8b5a2b;
            --bg-dark: #0d0d1a;
            --bg-medium: #1a1a2e;
            --bg-light: #0f3460;
            --text-color: #c9b896;
            --card-bg: linear-gradient(135deg, #f4e4bc, #e8d5b7);
            --card-border: #8b5a2b;
        }
        .theme-scifi {
            --primary-color: #00d4ff;
            --secondary-color: #87ceeb;
            --accent-color: #0066cc;
            --bg-dark: #0a0a1a;
            --bg-medium: #0d1b2a;
            --bg-light: #1b263b;
            --text-color: #a8d8ea;
            --card-bg: linear-gradient(135deg, #1a3a5c, #2d5a87);
            --card-border: #00d4ff;
        }
        .theme-horror {
            --primary-color: #8b0000;
            --secondary-color: #ff6b6b;
            --accent-color: #4a0000;
            --bg-dark: #0a0000;
            --bg-medium: #1a0505;
            --bg-light: #2d0a0a;
            --text-color: #ffcccc;
            --card-bg: linear-gradient(135deg, #2d0a0a, #4a0000);
            --card-border: #8b0000;
        }
        .theme-steampunk {
            --primary-color: #b87333;
            --secondary-color: #d4a574;
            --accent-color: #8b5a2b;
            --bg-dark: #1a1510;
            --bg-medium: #2d2218;
            --bg-light: #3d2d1f;
            --text-color: #e8d5b7;
            --card-bg: linear-gradient(135deg, #5c4033, #8b5a2b);
            --card-border: #b87333;
        }
        .theme-cyberpunk {
            --primary-color: #ff00ff;
            --secondary-color: #00ffff;
            --accent-color: #9900ff;
            --bg-dark: #0a0015;
            --bg-medium: #1a002e;
            --bg-light: #2d004a;
            --text-color: #ffccff;
            --card-bg: linear-gradient(135deg, #2d004a, #4a007a);
            --card-border: #ff00ff;
        }

        .hero {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-medium) 100%);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .hero h1 {
            font-family: 'MedievalSharp', cursive;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color), var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .theme-selector {
            margin-top: 15px;
            text-align: center;
        }
        .theme-label {
            font-family: 'MedievalSharp', cursive;
            font-size: 1rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            display: inline-block;
        }
        .theme-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 800px;
            margin: 0 auto;
        }
        .theme-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            color: var(--text-color);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .theme-btn:hover { border-color: var(--primary-color); color: var(--primary-color); transform: translateY(-2px); }
        .theme-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: var(--bg-dark);
            border-color: var(--primary-color);
            font-weight: bold;
        }

        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 15px;
            padding: 15px;
            max-width: 1800px;
            margin: 0 auto;
            height: calc(100vh - 120px);
        }

        .left-panel, .right-panel { display: flex; flex-direction: column; gap: 15px; }

        .character-card {
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: 15px;
            padding: 15px;
            color: #2d1f14;
            position: relative;
        }
        .character-card::before {
            content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
            border: 2px dashed rgba(139,90,43,0.3); border-radius: 10px; pointer-events: none;
        }
        .character-header { text-align: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid rgba(139,90,43,0.3); }
        .character-header h3 { font-family: 'MedievalSharp', cursive; font-size: 1.3rem; color: #5c3d2e; }
        .character-header p { font-style: italic; font-size: 0.85rem; color: #6b4423; }
        .character-portrait {
            width: 100%; height: 160px;
            background: linear-gradient(135deg, #2d1f14 0%, #5c3d2e 50%, #2d1f14 100%);
            border-radius: 10px; border: 2px solid var(--card-border);
            margin-bottom: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        }
        .character-portrait::before { content: '🎭'; font-size: 5rem; opacity: 0.3; }
        .portrait-art { position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .portrait-art svg { width: 100%; height: 100%; }
        .character-stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 12px; }
        .stat-item { background: rgba(139,90,43,0.1); padding: 8px; border-radius: 6px; text-align: center; }
        .stat-item span { display: block; font-size: 1.2rem; font-weight: bold; color: #5c3d2e; }
        .stat-item label { font-size: 0.7rem; color: #6b4423; text-transform: uppercase; letter-spacing: 1px; }
        .hp-bar { background: rgba(139,90,43,0.1); padding: 8px; border-radius: 6px; margin-bottom: 10px; }
        .hp-bar label { font-size: 0.75rem; color: #6b4423; display: block; margin-bottom: 4px; }
        .hp-fill { height: 12px; background: linear-gradient(90deg, #8b0000, #dc143c, #ff4500); border-radius: 4px; width: 100%; transition: width 0.5s ease; }

        .skill-section {
            background: linear-gradient(135deg, rgba(26,26,46,0.9), rgba(22,33,62,0.9));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 15px; flex: 1; display: flex; flex-direction: column;
        }
        .skill-section h3 {
            font-family: 'MedievalSharp', cursive; font-size: 1.1rem; color: var(--primary-color);
            margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .skill-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; overflow-y: auto; }
        .skill-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px;
            cursor: pointer; transition: all 0.3s ease; text-align: center; position: relative; overflow: hidden;
        }
        .skill-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--primary-color), transparent); opacity: 0; transition: opacity 0.3s ease; }
        .skill-card:hover { transform: translateY(-2px); border-color: var(--primary-color); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
        .skill-card:hover::before { opacity: 1; }
        .skill-card.selected { border-color: var(--secondary-color); background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08)); box-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .skill-icon { font-size: 1.8rem; margin-bottom: 6px; }
        .skill-card h4 { font-family: 'MedievalSharp', cursive; font-size: 0.85rem; color: var(--primary-color); margin-bottom: 4px; }
        .skill-card p { font-size: 0.7rem; color: var(--text-color); opacity: 0.8; }
        .skill-cost { font-size: 0.65rem; color: var(--primary-color); margin-top: 4px; background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 3px; display: inline-block; }

        .map-container {
            background: linear-gradient(135deg, rgba(26,26,46,0.9), rgba(22,33,62,0.9));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 15px;
            padding: 15px; display: flex; flex-direction: column;
        }
        .map-container h3 {
            font-family: 'MedievalSharp', cursive; font-size: 1.1rem; color: var(--primary-color);
            margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .map-area {
            flex: 1; background: var(--bg-dark); border-radius: 10px; border: 2px solid var(--accent-color);
            position: relative; overflow: hidden;
        }
        .fog-of-war {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, transparent 25%, rgba(0,0,0,0.9) 60%);
            pointer-events: none; transition: opacity 0.5s ease;
        }
        .map-location {
            position: absolute; width: 55px; height: 55px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: 3px solid var(--accent-color); border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 10;
        }
        .map-location:hover { transform: scale(1.15); box-shadow: 0 0 20px var(--primary-color); z-index: 20; }
        .map-location.active { animation: pulse 2s infinite; border-color: var(--secondary-color); }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 10px var(--primary-color); } 50% { box-shadow: 0 0 25px var(--secondary-color); } }
        .location-icon { font-size: 1.4rem; }
        .location-name { font-size: 0.55rem; font-weight: bold; color: var(--bg-dark); text-align: center; margin-top: 2px; max-width: 45px; overflow: hidden; text-overflow: ellipsis; }
        .map-path {
            position: absolute; height: 3px;
            background: linear-gradient(90deg, var(--accent-color), var(--primary-color), var(--accent-color));
            transform-origin: left center; z-index: 1; border-radius: 2px; box-shadow: 0 0 8px var(--primary-color);
        }

        .location-info {
            background: linear-gradient(135deg, rgba(26,26,46,0.9), rgba(22,33,62,0.9));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px;
        }
        .location-info h3 {
            font-family: 'MedievalSharp', cursive; font-size: 1.1rem; color: var(--primary-color);
            margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .location-image {
            width: 100%; height: 130px; background: linear-gradient(135deg, var(--accent-color), var(--primary-color));
            border-radius: 10px; border: 2px solid var(--primary-color); margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
        }
        .location-description { font-size: 0.85rem; color: var(--text-color); line-height: 1.5; }

        .npc-section {
            background: linear-gradient(135deg, rgba(26,26,46,0.9), rgba(22,33,62,0.9));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px;
        }
        .npc-section h3 {
            font-family: 'MedievalSharp', cursive; font-size: 1.1rem; color: var(--primary-color);
            margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .npc-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
        .npc-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px;
            cursor: pointer; transition: all 0.3s ease; text-align: center; position: relative;
        }
        .npc-card:hover { border-color: var(--primary-color); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
        .npc-card.active { border-color: var(--secondary-color); background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08)); }
        .npc-icon { font-size: 1.8rem; margin-bottom: 6px; }
        .npc-card h4 { font-size: 0.85rem; color: var(--primary-color); margin-bottom: 3px; }
        .npc-card .npc-role { font-size: 0.7rem; color: var(--text-color); opacity: 0.7; }
        .npc-card .npc-marker {
            position: absolute; top: 3px; right: 3px; font-size: 0.6rem; padding: 1px 4px;
            border-radius: 3px; background: var(--primary-color); color: var(--bg-dark); font-weight: bold;
        }

        .dialogue-panel {
            background: linear-gradient(135deg, rgba(26,26,46,0.95), rgba(22,33,62,0.95));
            border: 2px solid var(--primary-color); border-radius: 15px; padding: 15px; margin-top: 10px;
            display: none; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .dialogue-panel.active { display: block; }
        .dialogue-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .dialogue-npc-icon { font-size: 2.5rem; width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .dialogue-npc-info h4 { font-family: 'MedievalSharp', cursive; font-size: 1.1rem; color: var(--primary-color); margin-bottom: 3px; }
        .dialogue-npc-info p { font-size: 0.8rem; color: var(--text-color); opacity: 0.8; }
        .dialogue-text {
            background: rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; margin-bottom: 15px;
            font-size: 0.9rem; line-height: 1.6; color: var(--text-color); border-left: 3px solid var(--primary-color);
        }
        .dialogue-options { display: flex; flex-direction: column; gap: 8px; }
        .dialogue-option {
            padding: 10px 12px; border: 2px solid rgba(255,255,255,0.2); border-radius: 6px;
            background: rgba(255,255,255,0.05); color: var(--text-color); font-size: 0.85rem;
            cursor: pointer; transition: all 0.3s ease; text-align: left; position: relative;
        }
        .dialogue-option:hover { border-color: var(--primary-color); background: rgba(255,255,255,0.1); transform: translateX(4px); }
        .dialogue-option.key-option { border-color: #ffd700; }
        .dialogue-option.key-option::before { content: '🔑'; position: absolute; left: 8px; }
        .dialogue-option.key-option:hover { border-color: #ffd700; box-shadow: 0 0 12px rgba(255,215,0,0.3); }
        .dialogue-option .option-text { padding-left: 22px; }

        .quest-panel {
            background: linear-gradient(135deg, rgba(26,26,46,0.9), rgba(22,33,62,0.9));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; flex: 1; display: flex; flex-direction: column;
        }
        .quest-panel h3 {
            font-family: 'MedievalSharp', cursive; font-size: 1.1rem; color: var(--primary-color);
            margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .quest-tabs { display: flex; gap: 8px; margin-bottom: 12px; justify-content: center; }
        .quest-tab {
            padding: 6px 12px; border: 2px solid rgba(255,255,255,0.2); border-radius: 15px;
            background: rgba(255,255,255,0.05); color: var(--text-color); font-size: 0.8rem;
            cursor: pointer; transition: all 0.3s ease;
        }
        .quest-tab.active { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: var(--bg-dark); border-color: var(--primary-color); font-weight: bold; }
        .quest-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .quest-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px;
            transition: all 0.3s ease; position: relative;
        }
        .quest-card:hover { border-color: var(--primary-color); }
        .quest-card.main-quest { border-left: 4px solid #ffd700; }
        .quest-card.side-quest { border-left: 4px solid var(--primary-color); }
        .quest-card.completed { opacity: 0.6; }
        .quest-card.completed::after { content: '✓'; position: absolute; top: 8px; right: 12px; font-size: 1.3rem; color: #4caf50; font-weight: bold; }
        .quest-title { font-family: 'MedievalSharp', cursive; font-size: 0.95rem; color: var(--primary-color); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .quest-title .quest-type { font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,0.1); color: var(--text-color); }
        .quest-description { font-size: 0.8rem; color: var(--text-color); line-height: 1.5; margin-bottom: 8px; }
        .quest-status { font-size: 0.7rem; color: var(--secondary-color); }
        .empty-quest { text-align: center; color: var(--text-color); opacity: 0.5; padding: 20px; font-size: 0.85rem; }

        .action-panel {
            background: linear-gradient(135deg, rgba(26,26,46,0.9), rgba(22,33,62,0.9));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px;
        }
        .action-panel h3 {
            font-family: 'MedievalSharp', cursive; font-size: 1.1rem; color: var(--primary-color);
            margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .action-buttons { display: flex; flex-direction: column; gap: 8px; }
        .action-btn {
            padding: 10px 15px; border: 2px solid var(--primary-color); border-radius: 6px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            color: var(--primary-color); font-family: 'MedievalSharp', cursive; font-size: 0.9rem;
            cursor: pointer; transition: all 0.3s ease; text-align: center;
        }
        .action-btn:hover { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: var(--bg-dark); transform: translateY(-2px); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .narrative-log {
            background: linear-gradient(135deg, rgba(26,26,46,0.9), rgba(22,33,62,0.9));
            border: 2px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; flex: 1; display: flex; flex-direction: column;
        }
        .narrative-log h3 {
            font-family: 'MedievalSharp', cursive; font-size: 1.1rem; color: var(--primary-color);
            margin-bottom: 12px; text-align: center; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .log-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .log-entry { background: rgba(255,255,255,0.05); border-left: 3px solid var(--primary-color); padding: 10px; border-radius: 0 6px 6px 0; font-size: 0.85rem; line-height: 1.5; color: var(--text-color); }
        .log-entry.npc { border-left-color: #4facfe; background: rgba(79,172,254,0.1); }
        .log-entry.action { border-left-color: var(--secondary-color); background: rgba(255,255,255,0.1); font-weight: bold; }
        .log-entry .timestamp { font-size: 0.65rem; color: var(--primary-color); margin-bottom: 4px; display: block; }

        .loading-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner { width: 70px; height: 70px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-family: 'MedievalSharp', cursive; font-size: 1.3rem; color: var(--primary-color); margin-top: 15px; }
        .ai-generating { font-size: 0.9rem; color: var(--text-color); margin-top: 8px; }
        .generation-steps { margin-top: 15px; display: flex; gap: 12px; }
        .gen-step { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; transition: all 0.3s ease; }
        .gen-step.active { border-color: var(--primary-color); background: var(--primary-color); color: var(--bg-dark); animation: pulse 1s infinite; }
        .gen-step.completed { border-color: var(--secondary-color); background: var(--secondary-color); color: var(--bg-dark); }

        @media (max-width: 1200px) {
            .main-container { grid-template-columns: 1fr; height: auto; }
            .left-panel, .right-panel { order: 2; }
            .map-container { order: 1; min-height: 350px; }
            .skill-grid { grid-template-columns: repeat(4,1fr); }
        }
        @media (max-width: 768px) {
            .skill-grid { grid-template-columns: repeat(2,1fr); }

        function switchTheme(theme) {
            currentTheme = theme;

            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-theme="${theme}"]`).classList.add('active');
            document.getElementById('customThemeInput').style.display = theme === 'custom' ? 'block' : 'none';
            if (theme !== 'custom') {
                initTheme(theme);
            }
        }

        function applyCustomTheme() {

            overlay.className = 'loading-overlay';
            overlay.innerHTML = `<div class="loading-spinner"></div><div class="loading-text">AI正在生成自定义主题...</div><div class="ai-generating">正在分析主题描述: ${customText}</div><div class="generation-steps"><div class="gen-step active">🎨</div><div class="gen-step">🎭</div><div class="gen-step">🗺️</div><div class="gen-step">⚔️</div></div>`;

            setTimeout(() => {
                overlay.remove();
                addLogEntry(`✨ AI成功生成了"${customText}"主题！新的冒险即将开始！`, 'action');
            }, 3000);
        }

            renderLogs(themeData.initialLogs);
            renderNpcs();
            activeQuests = { ...themeData.quests };
            renderQuests();
        }

        function renderStats(stats) {
            const statsContainer = document.getElementById('characterStats');
            statsContainer.innerHTML = '';
            const statLabels = { strength: '力量', dexterity: '敏捷', constitution: '体质', intelligence: '智力', wisdom: '感知', charisma: '魅力' };
            Object.keys(stats).forEach(key => {
                const stat = document.createElement('div');
                stat.className = 'stat-item';
                stat.innerHTML = `<span>${stats[key]}</span><label>${statLabels[key]}</label>`;
                statsContainer.appendChild(stat);
            });
        }

        function renderSkills(skills) {
            const skillGrid = document.getElementById('skillGrid');
            skillGrid.innerHTML = '';
            skills.forEach(skill => {
                const card = document.createElement('div');
                card.className = 'skill-card';
                card.dataset.skill = skill.id;
                card.innerHTML = `<div class="skill-icon">${skill.icon}</div><h4>${skill.name}</h4><p>${skill.desc}</p><div class="skill-cost">消耗: ${skill.cost}</div>`;
                card.addEventListener('click', () => {
                    document.querySelectorAll('.skill-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedSkill = skill.id;
                });
                skillGrid.appendChild(card);
            });
        }

        function renderMap(themeData) {
            const mapArea = document.getElementById('mapArea');
            mapArea.innerHTML = '<div class="fog-of-war" id="fogOfWar"></div>';
            themeData.mapPaths.forEach(path => {
                const mapPath = document.createElement('div');
                mapPath.className = 'map-path';
                mapPath.style.top = `${path.top}px`;
                mapPath.style.left = `${path.left}px`;
                mapPath.style.width = `${path.width}px`;
                mapPath.style.transform = `rotate(${path.rotate}deg)`;
                mapArea.appendChild(mapPath);
            });
            Object.keys(themeData.locations).forEach(key => {
                const loc = themeData.locations[key];
                const pos = themeData.locationPositions[key];
                const locationDiv = document.createElement('div');
                locationDiv.className = 'map-location';
                locationDiv.dataset.location = key;
                locationDiv.style.top = `${pos.top}px`;
                locationDiv.style.left = `${pos.left}px`;
                locationDiv.innerHTML = `<div class="location-icon">${loc.icon}</div><div class="location-name">${loc.name}</div>`;
                locationDiv.addEventListener('click', () => {
                    document.querySelectorAll('.map-location').forEach(l => l.classList.remove('active'));
                    locationDiv.classList.add('active');
                    currentLocation = key;
                    updateLocationInfo();
                    renderNpcs();
                    closeDialogue();
                });
                mapArea.appendChild(locationDiv);
            });
            document.querySelector('.map-location').classList.add('active');
        }

        function updateLocationInfo() {
            const themeData = themes[currentTheme];
            const loc = themeData.locations[currentLocation];
            document.getElementById('locationImage').textContent = loc.icon;
            document.getElementById('locationDesc').textContent = loc.description;
        }

        function renderNpcs() {
            const themeData = themes[currentTheme];
            const loc = themeData.locations[currentLocation];
            const npcGrid = document.getElementById('npcGrid');
            npcGrid.innerHTML = '';
            if (!loc.npcs || loc.npcs.length === 0) {
                npcGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-color);opacity:0.5;padding:20px;">该区域暂无NPC</div>';
                return;
            }
            loc.npcs.forEach(npc => {
                const card = document.createElement('div');
                card.className = 'npc-card';
                card.dataset.npc = npc.id;
                card.innerHTML = `
                    <div class="npc-icon">${npc.icon}</div>
                    <h4>${npc.name}</h4>
                    <div class="npc-role">${npc.role}</div>
                `;
                card.addEventListener('click', () => {
                    document.querySelectorAll('.npc-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    openDialogue(npc);
                });
                npcGrid.appendChild(card);
            });
        }

        function openDialogue(npc) {
            currentNpc = npc;
            currentDialogueId = 'start';
            const panel = document.getElementById('dialoguePanel');
            panel.classList.add('active');
            renderDialogue();
        }

        function closeDialogue() {
            document.getElementById('dialoguePanel').classList.remove('active');
            document.querySelectorAll('.npc-card').forEach(c => c.classList.remove('active'));
            currentNpc = null;
            currentDialogueId = null;
        }

        function renderDialogue() {
            if (!currentNpc || !currentDialogueId) return;
            const dialogue = currentNpc.dialogues.find(d => d.id === currentDialogueId);
            if (!dialogue) return;
            document.getElementById('dialogueNpcIcon').textContent = currentNpc.icon;
            document.getElementById('dialogueNpcName').textContent = currentNpc.name;
            document.getElementById('dialogueNpcRole').textContent = currentNpc.role;
            document.getElementById('dialogueText').textContent = dialogue.text;
            addLogEntry(`${currentNpc.name}说：${dialogue.text}`, 'npc');
            const optionsContainer = document.getElementById('dialogueOptions');
            optionsContainer.innerHTML = '';
            dialogue.options.forEach(opt => {
                const optionBtn = document.createElement('div');
                optionBtn.className = `dialogue-option${opt.key ? ' key-option' : ''}`;
                optionBtn.innerHTML = `<span class="option-text">${opt.text}</span>`;
                optionBtn.addEventListener('click', () => {
                    if (opt.quest) {
                        unlockQuest(opt.quest);
                    }
                    currentDialogueId = opt.next;
                    renderDialogue();
                });
                optionsContainer.appendChild(optionBtn);
            });
        }

        function unlockQuest(questId) {
            if (activeQuests[questId] && activeQuests[questId].status === 'locked') {
                activeQuests[questId].status = 'active';
                const quest = activeQuests[questId];
                addLogEntry(`📋 新任务触发：${quest.title}`, 'action');
                renderQuests();
            }
        }

        function showQuests(tab) {
            currentQuestTab = tab;
            document.querySelectorAll('.quest-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderQuests();
        }

        function renderQuests() {
            const questList = document.getElementById('questList');
            questList.innerHTML = '';
            const filteredQuests = Object.values(activeQuests).filter(q => q.type === currentQuestTab && q.status !== 'completed');
            if (filteredQuests.length === 0) {
                questList.innerHTML = '<div class="empty-quest">暂无' + (currentQuestTab === 'main' ? '主线' : '支线') + '任务</div>';
                return;
            }
            filteredQuests.forEach(quest => {
                const card = document.createElement('div');
                card.className = `quest-card ${quest.type}-quest ${quest.status}`;
                card.innerHTML = `
                    <div class="quest-title">${quest.title} <span class="quest-type">${quest.type === 'main' ? '主线' : '支线'}</span></div>
                    <div class="quest-description">${quest.description}</div>
                    <div class="quest-status">状态: ${quest.status === 'active' ? '进行中' : quest.status === 'locked' ? '未解锁' : '已完成'}</div>
                `;
                questList.appendChild(card);
            });
        }

        function renderLogs(logs) {
            const logContent = document.getElementById('logContent');
            logContent.innerHTML = '';
            logs.forEach(log => addLogEntry(log.text, log.type, false));
        }

        function addLogEntry(text, type = 'normal', scroll = true) {
            const logContent = document.getElementById('logContent');
            const now = new Date();
            const timestamp = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span class="timestamp">${timestamp}</span>${text}`;
            logContent.appendChild(entry);
            if (scroll) logContent.scrollTop = logContent.scrollHeight;
        }

        function updateHpBar() {
            const hpBar = document.getElementById('hpBar');
            const hpLabel = document.getElementById('hpLabel');
            const percentage = (hp / maxHp) * 100;
            hpBar.style.width = `${percentage}%`;
            hpLabel.textContent = `生命值: ${hp}/${maxHp}`;
        }

        function moveToLocation() {
            const themeData = themes[currentTheme];
            const loc = themeData.locations[currentLocation];
            addLogEntry(`你移动到了${loc.name}。${loc.description.substring(0, 50)}...`, 'action');
            const fog = document.getElementById('fogOfWar');
            fog.style.background = `radial-gradient(circle at ${Math.random() * 60 + 20}% ${Math.random() * 60 + 20}%, transparent 30%, rgba(0,0,0,0.9) 65%)`;
        }

        function useSkill() {
            if (!selectedSkill) {
                addLogEntry('请先选择一个技能！', 'action');
                return;
            }
            const skill = skillEffects[selectedSkill];
            const skillCard = document.querySelector(`[data-skill="${selectedSkill}"]`);
            addLogEntry(skill.effect, 'action');
            if (skill.type === 'heal') {
                hp = Math.min(maxHp, hp + (skill.id === 'medPack' ? 20 : 8));
                updateHpBar();
            }
            setTimeout(() => {
                skillCard.classList.remove('selected');
                selectedSkill = null;
            }, 1000);
        }

        function exploreLocation() {
            const themeData = themes[currentTheme];
            const loc = themeData.locations[currentLocation];
            const encounters = loc.encounters || [];
            if (encounters.length === 0) {
                addLogEntry(`你在${loc.name}探索了一番，但没有发现特别的东西。`, 'normal');
                return;
            }
            const encounter = encounters[Math.floor(Math.random() * encounters.length)];
            const messages = [`你在${loc.name}探索时，发现了${encounter}！`, `一阵响动传来，${encounter}出现在你面前！`, `经过一番搜索，你找到了${encounter}。`];
            addLogEntry(messages[Math.floor(Math.random() * messages.length)], 'npc');
        }

        function generateNewContent() {
            const overlay = document.createElement('div');
            overlay.className = 'loading-overlay';
            overlay.innerHTML = `<div class="loading-spinner"></div><div class="loading-text">AI正在生成...</div><div class="ai-generating" id="genProgress">正在生成新地图区域...</div><div class="generation-steps"><div class="gen-step active" id="step1">🗺️</div><div class="gen-step" id="step2">🎭</div><div class="gen-step" id="step3">⚔️</div><div class="gen-step" id="step4">📜</div></div>`;
            document.body.appendChild(overlay);
            setTimeout(() => { document.getElementById('step1').className = 'gen-step completed'; document.getElementById('step2').className = 'gen-step active'; document.getElementById('genProgress').textContent = '正在生成角色肖像...'; }, 750);
            setTimeout(() => { document.getElementById('step2').className = 'gen-step completed'; document.getElementById('step3').className = 'gen-step active'; document.getElementById('genProgress').textContent = '正在生成技能卡片...'; }, 1500);
            setTimeout(() => { document.getElementById('step3').className = 'gen-step completed'; document.getElementById('step4').className = 'gen-step active'; document.getElementById('genProgress').textContent = '正在生成剧本剧情...'; }, 2250);
            setTimeout(() => {
                overlay.classList.add('hidden');
                setTimeout(() => overlay.remove(), 500);
                addLogEntry('✨ AI生成了新的冒险内容！地图、角色和技能都已更新。', 'action');
                const fog = document.getElementById('fogOfWar');
                fog.style.background = `radial-gradient(circle at ${Math.random() * 60 + 20}% ${Math.random() * 60 + 20}%, transparent 25%, rgba(0,0,0,0.85) 60%)`;
            }, 3000);
        }

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => switchTheme(btn.dataset.theme));
        });

        try { initTheme('fantasy'); } catch (e) { console.error('初始化主题失败:', e); }

        const loadingSteps = ['🗺️', '🎭', '⚔️', '📜'];
        const stepTexts = ['正在生成冒险地图...', '正在生成角色肖像...', '正在生成技能卡片...', '正在生成剧本剧情...'];
        let currentStep = 0;

        function advanceLoading() {
            if (currentStep >= loadingSteps.length) {
                try {
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) { overlay.classList.add('hidden'); setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 500); }
                } catch (e) { console.error('移除loading overlay失败:', e); }
                return;
            }
            document.querySelectorAll('.gen-step').forEach((step, index) => {
                step.className = index < currentStep ? 'gen-step completed' : (index === currentStep ? 'gen-step active' : 'gen-step');
            });
            const genText = document.getElementById('generatingText');
            if (genText) genText.textContent = stepTexts[currentStep];
            currentStep++;
            setTimeout(advanceLoading, 500);
        }

        setTimeout(advanceLoading, 500);
    </script>
</body>
</html>
