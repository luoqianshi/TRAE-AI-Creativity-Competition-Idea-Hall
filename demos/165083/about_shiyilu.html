<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾遗录 · 关于</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-brown: #2C1810;
            --xuan-paper: #F5E6D0;
            --ochre: #8B4513;
            --light-gold: #D4A574;
            --warm-beige: #E8D4B8;
            --deep-red: #6B2222;
            --ink-gray: #4A3728;
            --cursor-default: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="%232C1810"/></svg>') 12 12, auto;
            --cursor-pointer: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="6" fill="none" stroke="%23D4A574" stroke-width="2"/><circle cx="14" cy="14" r="3.5" fill="%232C1810"/></svg>') 14 14, pointer;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Songti SC', serif;
            background: var(--xuan-paper);
            color: var(--dark-brown);
            min-height: 100vh;
            cursor: var(--cursor-default);
            line-height: 1.6;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(212, 165, 116, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 69, 19, 0.06) 0%, transparent 50%);
        }

        /* 顶部导航栏 */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(245, 230, 208, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--light-gold);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--light-gold);
            color: var(--ink-gray);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.88rem;
            cursor: var(--cursor-pointer), pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .back-btn:hover {
            background: var(--warm-beige);
            border-color: var(--ochre);
            color: var(--dark-brown);
        }

        .top-bar-title {
            font-family: 'Noto Serif SC', serif;
            font-weight: 600;
            color: var(--dark-brown);
            font-size: 1.05rem;
        }

        .lang-switch {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            padding: 3px;
            border: 1px solid var(--warm-beige);
        }

        .lang-btn {
            padding: 5px 14px;
            border: none;
            background: transparent;
            color: var(--ink-gray);
            border-radius: 4px;
            cursor: var(--cursor-pointer), pointer;
            font-size: 0.85rem;
            font-family: inherit;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: var(--dark-brown);
            color: var(--xuan-paper);
        }

        /* 关于页主体 */
        .about-container {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        .about-page {
            padding: 8px 0 40px;
        }

        .about-hero {
            text-align: center;
            padding: 28px 20px 36px;
            border-bottom: 1px solid var(--warm-beige);
            margin-bottom: 32px;
        }

        .about-hero-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.6rem;
            font-weight: 700;
            color: var(--dark-brown);
            letter-spacing: 10px;
            margin-bottom: 14px;
        }

        .about-hero-en {
            font-size: 0.95rem;
            color: var(--ink-gray);
            opacity: 0.7;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .about-hero-tagline {
            font-size: 1.05rem;
            color: var(--ochre);
            font-weight: 500;
            line-height: 1.7;
        }

        .about-section {
            margin-bottom: 36px;
        }

        .about-section-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark-brown);
            margin-bottom: 16px;
            padding-left: 14px;
            border-left: 4px solid var(--light-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .about-section-body {
            font-size: 0.95rem;
            line-height: 1.85;
            color: var(--ink-gray);
            padding-left: 18px;
        }

        .about-section-body p {
            margin-bottom: 10px;
        }

        .about-feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 14px;
        }

        .about-feature-card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--warm-beige);
            border-radius: 10px;
            padding: 16px 18px;
            transition: all 0.3s;
        }

        .about-feature-card:hover {
            border-color: var(--light-gold);
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px);
        }

        .about-feature-icon {
            font-size: 1.4rem;
            margin-bottom: 6px;
        }

        .about-feature-name {
            font-family: 'Noto Serif SC', serif;
            font-weight: 600;
            color: var(--dark-brown);
            margin-bottom: 4px;
            font-size: 0.98rem;
        }

        .about-feature-desc {
            font-size: 0.85rem;
            color: var(--ink-gray);
            line-height: 1.6;
        }

        .about-user-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }

        .about-user-card {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--warm-beige);
            border-radius: 10px;
            padding: 14px 16px;
            transition: all 0.3s;
        }

        .about-user-card:hover {
            border-color: var(--light-gold);
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px);
        }

        .about-user-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .about-user-icon {
            font-size: 1.3rem;
        }

        .about-user-name {
            font-family: 'Noto Serif SC', serif;
            font-weight: 600;
            color: var(--dark-brown);
            font-size: 0.95rem;
        }

        .about-user-pain {
            font-size: 0.82rem;
            color: var(--ink-gray);
            line-height: 1.65;
            opacity: 0.85;
        }

        .about-tech-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .about-tech-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 100px;
        }

        .about-tech-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(212, 165, 116, 0.15);
            border: 1px solid var(--light-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .about-tech-name {
            font-size: 0.82rem;
            color: var(--dark-brown);
            font-weight: 500;
        }

        .about-tech-desc {
            font-size: 0.72rem;
            color: var(--ink-gray);
            opacity: 0.7;
            text-align: center;
        }

        /* 使用说明静态图示 */
        .about-demo {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .about-demo-step {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--warm-beige);
            border-radius: 12px;
            padding: 16px 14px 14px;
            text-align: center;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .about-demo-step:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(44, 24, 16, 0.1);
        }

        .about-demo-step-num {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: var(--ochre);
            color: var(--xuan-paper);
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .about-demo-illustration {
            width: 100%;
            height: 130px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .about-demo-illustration svg {
            max-width: 100%;
            max-height: 100%;
        }

        .about-demo-step-label {
            font-size: 0.85rem;
            color: var(--dark-brown);
            font-weight: 500;
            line-height: 1.4;
        }

        .about-quote {
            margin-top: 18px;
            padding: 14px 18px;
            background: rgba(139, 69, 19, 0.06);
            border-left: 3px solid var(--ochre);
            font-family: 'Noto Serif SC', serif;
            font-size: 0.92rem;
            color: var(--dark-brown);
            font-style: italic;
            border-radius: 0 6px 6px 0;
        }

        .about-author-card {
            margin-top: 28px;
            padding: 22px;
            background: linear-gradient(135deg, rgba(245, 230, 208, 0.6), rgba(232, 212, 184, 0.5));

            border-radius: 12px;
            text-align: center;
        }

        .about-author-name {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark-brown);
            margin-bottom: 4px;
        }

        .about-author-meta {
            font-size: 0.82rem;
            color: var(--ink-gray);
            opacity: 0.8;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .about-demo {
                grid-template-columns: 1fr;
            }
            .about-feature-grid {
                grid-template-columns: 1fr;
            }
            .about-user-grid {
                grid-template-columns: 1fr;
            }
            .about-hero-title {
                font-size: 2rem;
                letter-spacing: 6px;
            }
            .top-bar {
                padding: 12px 16px;
            }
            .about-container {
                padding: 16px;
            }
        }
    </style>
</head>
