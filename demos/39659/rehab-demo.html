<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>康复打卡伴侣</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4ECDC4;
      --primary-dark: #3DB8B0;
      --accent: #FF6B6B;
      --bg: #F8FFFE;
      --bg-card: #FFFFFF;
      --text: #2C3E50;
      --text-light: #7F8C8D;
      --success: #6BCB77;
      --warning: #F39C12;
      --danger: #E74C3C;
      --shadow: rgba(78, 205, 196, 0.15);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Noto Sans SC', 'Nunito', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg);
    }

    /* 头部 */
    .header {
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .streak-badge {
      background: rgba(255,255,255,0.2);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.95;
    }

    .header-info span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 页面内容 */
    .page-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
      -webkit-overflow-scrolling: touch;
    }

    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 20px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
      border-radius: 24px 24px 0 0;
      z-index: 100;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 14px; border: none; background: none;
      cursor: pointer; transition: all 0.2s; border-radius: 12px;
    }
    .nav-item .icon { font-size: 22px; }
    .nav-item .label { font-size: 10px; color: var(--text-light); font-weight: 500; }
    .nav-item.active { color: var(--primary); }
    .nav-item.active .label { color: var(--primary); font-weight: 600; }

    /* 卡片 */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px var(--shadow);
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 表单元素 */
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #E8E8E8;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      background: var(--bg);
      transition: border-color 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .form-group textarea {
      resize: none;
      min-height: 80px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:active {
      background: var(--primary-dark);
      transform: scale(0.98);
    }
    .btn-block {
      width: 100%;
    }
    .btn-secondary {
      background: var(--bg);
      color: var(--text);
    }

    /* 分割线 */
    .divider {
      height: 1px;
      background: #E8E8E8;
      margin: 16px 0;
    }

    /* ========== 首页 ========== */
    .today-plan {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .today-plan h3 {
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .today-plan .part-tag {
      background: rgba(255,255,255,0.2);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    .today-plan .stats {
      display: flex;
      gap: 16px;
      margin-top: 10px;
    }
    .today-plan .stat {
      text-align: center;
    }
    .today-plan .stat .num {
      font-size: 22px;
      font-weight: 800;
    }
    .today-plan .stat .label {
      font-size: 11px;
      opacity: 0.9;
    }

    .advice-card {
      background: linear-gradient(135deg, #FFF9E6 0%, #FFF3CC 100%);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
      border-left: 4px solid var(--warning);
    }
    .advice-card h4 {
      font-size: 13px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--warning);
    }
    .advice-card p {
      font-size: 13px;
      line-height: 1.6;
      color: #8B6914;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: var(--bg);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
    }
    .task-item.completed {
      background: rgba(107, 203, 119, 0.1);
      border-color: var(--success);
    }
    .task-check {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .task-item.completed .task-check {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }
    .task-info { flex: 1; }
    .task-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .task-meta { font-size: 11px; color: var(--text-light); }
    .task-item.completed .task-name { text-decoration: line-through; color: var(--text-light); }

    /* ========== 康复计划 ========== */
    .plan-overview {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .plan-stat {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 14px;
      text-align: center;
    }
    .plan-stat .icon {
      font-size: 24px;
      margin-bottom: 6px;
    }
    .plan-stat .value {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }
    .plan-stat .label {
      font-size: 11px;
      color: var(--text-light);
    }

    .pain-slider {
      margin: 10px 0;
    }
    .pain-slider label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .pain-slider input[type="range"] {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--success) 0%, var(--warning) 50%, var(--danger) 100%);
      -webkit-appearance: none;
    }
    .pain-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .pain-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
    }

    /* ========== 打卡日历 ========== */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .calendar-header h3 {
      font-size: 16px;
    }
    .calendar-nav {
      display: flex;
      gap: 6px;
    }
    .calendar-nav button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .calendar-nav button:active {
      background: var(--primary);
      color: white;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 6px;
    }
    .calendar-weekdays span {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      padding: 6px 0;
    }

    .calendar-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
    }
    .calendar-day.empty { cursor: default; }
    .calendar-day.today { border: 2px solid var(--primary); }
    .calendar-day.completed { background: var(--success); color: white; }
    .calendar-day.partial { background: rgba(107, 203, 119, 0.4); }
    .calendar-day.pain-up { background: var(--danger); color: white; }
    .calendar-day:hover:not(.empty) { transform: scale(1.1); }

    .day-detail {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-top: 14px;
    }
    .day-detail h4 {
      font-size: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .day-detail .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .day-detail .detail-item {
      background: white;
      padding: 10px;
      border-radius: 8px;
    }
    .day-detail .detail-item .label {
      font-size: 11px;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .day-detail .detail-item .value {
      font-size: 14px;
      font-weight: 600;
    }
    .day-detail .feeling {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
    }

    .week-summary {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
      padding: 12px;
      background: var(--bg);
      border-radius: var(--radius-sm);
    }
    .week-summary .day {
      text-align: center;
      font-size: 11px;
    }
    .week-summary .day .dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin: 0 auto 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    .week-summary .day.completed .dot { background: var(--success); color: white; }
    .week-summary .day.pending .dot { background: #E8E8E8; color: var(--text-light); }

    /* ========== 社区 ========== */
    .post-form {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 14px;
    }
    .post-form h4 {
      font-size: 13px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .post-form .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .post-form .form-row select {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #E8E8E8;
      border-radius: 8px;
      font-size: 13px;
      background: white;
    }
    .post-form textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #E8E8E8;
      border-radius: 8px;
      font-size: 13px;
      resize: none;
      min-height: 60px;
      background: white;
    }
    .post-form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .post-form .tips {
      font-size: 11px;
      color: var(--text-light);
    }
    .post-btn {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .post-item {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .post-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: white;
    }
    .post-user { font-size: 14px; font-weight: 600; }
    .post-meta { font-size: 11px; color: var(--text-light); }
    .post-tag {
      display: inline-block;
      padding: 3px 8px;
      background: rgba(78, 205, 196, 0.15);
      color: var(--primary-dark);
      border-radius: 10px;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .post-content {
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .post-actions {
      display: flex;
      gap: 16px;
      padding-top: 10px;
      border-top: 1px solid #F0F0F0;
    }
    .post-action {
      font-size: 12px;
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .post-action:hover { color: var(--primary); }

    /* ========== 打卡弹窗 ========== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 200;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 24px 24px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #F0F0F0;
    }
    .modal-header h3 { font-size: 16px; }
    .modal-close {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      cursor: pointer;
      font-size: 14px;
    }
    .modal-body { padding: 20px; }

    .checkin-complete {
      text-align: center;
      padding: 20px;
    }
    .checkin-complete .icon {
      font-size: 60px;
      margin-bottom: 16px;
    }
    .checkin-complete h3 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .checkin-complete p {
      color: var(--text-light);
      font-size: 14px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s;
      z-index: 300;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-light);
    }
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .empty-state p {
      font-size: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 头部 -->
    <header class="header">
      <div class="header-top">
        <h1>💪 康复打卡伴侣</h1>
        <div class="streak-badge" id="streakBadge">
          🔥 <span id="streakCount">0</span>天
        </div>
      </div>
      <div class="header-info" id="headerInfo">
        <span>📍 <span id="headerPart">未设置</span></span>
        <span>📅 <span id="headerStage">第1周</span></span>
      </div>
    </header>

    <!-- 页面内容 -->
    <main class="page-content">
      <!-- 首页 -->
      <section class="page active" id="page-home">
        <div class="today-plan" id="todayPlan">
          <h3>今日康复计划 <span class="part-tag" id="todayPart">膝盖</span></h3>
          <p style="font-size:13px;opacity:0.95;" id="todayGoal">目标：恢复弯曲能力</p>
          <div class="stats">
            <div class="stat">
              <div class="num" id="todayMinutes">20</div>
              <div class="label">分钟/天</div>
            </div>
            <div class="stat">
              <div class="num" id="todayFreq">5</div>
              <div class="label">次/周</div>
            </div>
            <div class="stat">
              <div class="num" id="todayPain">3</div>
              <div class="label">疼痛等级</div>
            </div>
          </div>
        </div>

        <div class="advice-card" id="adviceCard">
          <h4>💡 康复建议</h4>
          <p id="adviceText">设置康复计划后，我会根据你的情况给出每日建议。</p>
        </div>

        <div class="card">
          <div class="card-title">📋 今日训练任务</div>
          <div id="todayTasks">
            <div class="empty-state">
              <div class="icon">📝</div>
              <p>还没有训练任务</p>
              <button class="btn btn-secondary" onclick="navigateTo('plan')">去创建康复计划</button>
            </div>
          </div>
        </div>

        <button class="btn btn-primary btn-block" id="checkinBtn" onclick="openCheckin()" style="margin-top:10px;">
          ✅ 完成今日打卡
        </button>
      </section>

      <!-- 康复计划 -->
      <section class="page" id="page-plan">
        <div id="planSetup">
          <div class="card">
            <div class="card-title">🦴 创建康复计划</div>
            
            <div class="form-group">
              <label>康复部位</label>
              <select id="planPart">
                <option value="">请选择部位</option>
                <option value="膝盖">膝盖</option>
                <option value="肩膀">肩膀</option>
                <option value="腰部">腰部</option>
                <option value="手腕">手腕</option>
                <option value="脚踝">脚踝</option>
                <option value="肘部">肘部</option>
                <option value="髋关节">髋关节</option>
                <option value="颈椎">颈椎</option>
              </select>
            </div>

            <div class="form-group">
              <label>当前阶段</label>
              <select id="planStage">
                <option value="第1周">第1周</option>
                <option value="第2周">第2周</option>
                <option value="第3周">第3周</option>
                <option value="第4周">第4周</option>
                <option value="第2月">第2月</option>
                <option value="第3月">第3月</option>
                <option value="3月以上">3月以上</option>
              </select>
            </div>

            <div class="form-group">
              <label>每日训练时长（分钟）</label>
              <input type="number" id="planMinutes" value="20" min="5" max="120">
            </div>

            <div class="form-group">
              <label>每周训练天数</label>
              <select id="planFreq">
                <option value="3">每周3天</option>
                <option value="4">每周4天</option>
                <option value="5" selected>每周5天</option>

      <!-- 打卡日历 -->
      <section class="page" id="page-calendar">

  <!-- 打卡弹窗 -->
  <div class="modal-overlay" id="checkinModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📝 今日打卡</h3>
        <button class="modal-close" onclick="closeModal('checkinModal')">✕</button>
      </div>
      <div class="modal-body" id="checkinBody">
        <div class="form-group">
          <label>训练时长（分钟）</label>
          <input type="number" id="checkinMinutes" value="20" min="5" max="120">
        </div>
        <div class="form-group">
          <label>训练前疼痛等级</label>
          <div class="pain-slider">
            <label><span>训练前</span><span id="painBeforeValue">3</span></label>
            <input type="range" id="checkinPainBefore" min="1" max="10" value="3">
          </div>
        </div>
        <div class="form-group">
          <label>训练后疼痛等级</label>
          <div class="pain-slider">
            <label><span>训练后</span><span id="painAfterValue">2</span></label>
            <input type="range" id="checkinPainAfter" min="1" max="10" value="2">
          </div>
        </div>
        <div class="form-group">
          <label>训练效果评分</label>
          <select id="checkinScore">
            <option value="5">⭐⭐⭐⭐⭐ 非常好</option>
            <option value="4" selected>⭐⭐⭐⭐ 比较好</option>
            <option value="3">⭐⭐⭐ 一般</option>
            <option value="2">⭐⭐ 不太好</option>
            <option value="1">⭐ 很差</option>
          </select>
        </div>
        <div class="form-group">
          <label>今日感受</label>
          <textarea id="checkinFeeling" placeholder="描述一下今天的训练感受..."></textarea>
        </div>
        <button class="btn btn-primary btn-block" onclick="saveCheckin()">保存打卡记录</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ========== 数据 ==========
    const defaultExercises = {
      膝盖: [
        { name: '股四头肌等长收缩', duration: 5, desc: '仰卧位，膝盖下方垫毛巾卷，收紧大腿肌肉' },
        { name: '直腿抬高训练', duration: 8, desc: '仰卧位，患腿伸直抬高约30度' },
        { name: '踝泵运动', duration: 5, desc: '脚尖勾起保持5秒，然后向下踩' },
        { name: '膝关节屈伸', duration: 10, desc: '坐位或仰卧，缓慢屈伸膝关节' },
        { name: '冰敷（可选）', duration: 10, desc: '训练后如有肿胀可冰敷15分钟' }
      ],
      肩膀: [
        { name: '钟摆运动', duration: 5, desc: '弯腰90度，手臂自然下垂画圈' },
        { name: '肩部被动前屈', duration: 8, desc: '用好手托住患臂，缓慢抬高' },
        { name: '肩部外旋练习', duration: 8, desc: '肘部贴紧身体，做外旋动作' },
        { name: '墙壁爬行', duration: 10, desc: '手指沿墙壁向上爬行' }
      ],
      腰部: [
        { name: '腹式呼吸', duration: 5, desc: '深吸气时腹部鼓起，呼气时收缩' },
        { name: '鸟狗式', duration: 10, desc: '四点支撑，交替伸展对侧手脚' },
        { name: '臀桥', duration: 8, desc: '仰卧位，双脚踩地抬起臀部' },
        { name: '猫牛式', duration: 8, desc: '四点支撑，交替弓背和塌腰' }
      ],
      手腕: [
        { name: '手指伸展', duration: 5, desc: '手指伸直分开，保持2秒' },
        { name: '腕关节旋转', duration: 8, desc: '缓慢上下旋转手腕' },
        { name: '握力训练', duration: 8, desc: '握住橡皮球，用力握紧放松' },
        { name: '手腕屈伸', duration: 8, desc: '前臂放在桌面，做屈伸动作' }
      ],
      脚踝: [
        { name: '踝泵运动', duration: 5, desc: '脚尖勾起保持5秒，然后向下踩' },
        { name: '踝关节环绕', duration: 8, desc: '脚踝画圈活动' },
        { name: '踮脚尖', duration: 10, desc: '扶墙站立，踮起脚尖' },
        { name: '平衡练习', duration: 8, desc: '单脚站立保持平衡' }
      ],
      肘部: [
        { name: '肘关节屈伸', duration: 8, desc: '手臂放在身体侧面，屈肘伸直' },
        { name: '前臂旋前旋后', duration: 8, desc: '掌心向上向下翻转' },
        { name: '握力训练', duration: 8, desc: '握住握力器或毛巾卷' },
        { name: '伸展练习', duration: 8, desc: '手臂伸直，另一手帮助加深' }
      ],
      髋关节: [
        { name: '臀中肌训练', duration: 8, desc: '侧卧位，患腿向上抬高' },
        { name: '髋关节外展', duration: 8, desc: '侧卧位，腿向外打开' },
        { name: '蚌式开合', duration: 10, desc: '侧卧位，膝盖像贝壳一样打开' },
        { name: '桥式训练', duration: 10, desc: '仰卧位，双脚踩地抬起臀部' }
      ],
      颈椎: [
        { name: '颈部旋转', duration: 5, desc: '缓慢转头，左右各10次' },
        { name: '颈部侧屈', duration: 5, desc: '耳朵靠近肩膀，左右各10次' },
        { name: '颈部前后屈', duration: 5, desc: '点头抬头，动作缓慢' },
        { name: '肩部放松', duration: 10, desc: '耸肩后放松，画圈活动' }
      ]
    };

    const mockPosts = [
      {
        id: 1,
        userName: '康复达人',
        part: '膝盖',
        stage: '中期',
        content: '膝盖术后第8周，终于可以慢慢蹲下了！坚持每天做直腿抬高和踝泵运动，疼痛从最开始的8分降到了2分。加油！',
        createdAt: '2026-06-21',
        likes: 23,
        avatar: '🦵'
      },
      {
        id: 2,
        userName: '肩膀战士',
        part: '肩膀',
        stage: '早期',
        content: '肩袖损伤术后康复中，每天坚持做钟摆运动和爬墙练习。医生说恢复得不错，继续保持！',
        createdAt: '2026-06-20',
        likes: 15,
        avatar: '💪'
      },
      {
        id: 3,
        userName: '腰部患者',
        part: '腰部',
        stage: '后期',
        content: '腰间盘突出保守治疗2个月，现在基本恢复正常生活了。核心训练真的很重要，臀桥和鸟狗式每天必做。',
        createdAt: '2026-06-19',
        likes: 31,
        avatar: '🧘'
      }
    ];

    // ========== 状态 ==========
    let state = {
      currentPage: 'home',
      plan: null,
      records: {},
      todayTasks: [],
      completedToday: false,
      currentMonth: new Date(),
      posts: [],
      streak: 0
    };

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      initNavigation();
      initPainSliders();
      initCalendarNav();
      renderUI();
    });

    function loadState() {
      const saved = localStorage.getItem('rehab_demo');
      if (saved) {
        const parsed = JSON.parse(saved);
        state = { ...state, ...parsed };
        if (state.currentMonth && !(state.currentMonth instanceof Date)) {
          state.currentMonth = new Date(state.currentMonth);
        }
      }
      state.posts = mockPosts.concat(state.posts || []);
    }

    function saveState() {
      localStorage.setItem('rehab_demo', JSON.stringify(state));
    }

    // ========== 导航 ==========
    function initNavigation() {
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          const page = item.dataset.page;
          navigateTo(page);
        });
      });
    }

    function navigateTo(page) {
      state.currentPage = page;
      document.querySelectorAll('.nav-item').forEach(n => {
        n.classList.toggle('active', n.dataset.page === page);
      });
      document.querySelectorAll('.page').forEach(p => {
        p.classList.toggle('active', p.id === `page-${page}`);
      });
      if (page === 'calendar') renderCalendar();
    }

    // ========== 疼痛滑块 ==========
    function initPainSliders() {
      document.getElementById('planPain').addEventListener('input', e => {
        document.getElementById('painValue').textContent = e.target.value + ' / 10';
      });

      document.getElementById('checkinPainBefore').addEventListener('input', e => {
        document.getElementById('painBeforeValue').textContent = e.target.value;
      });

      document.getElementById('checkinPainAfter').addEventListener('input', e => {
        document.getElementById('painAfterValue').textContent = e.target.value;
      });
    }

    // ========== 渲染界面 ==========
    function renderUI() {
      if (state.plan) {
        renderPlanDisplay();
        renderTodayTasks();
        generateAdvice();
      }
      renderCalendar();
      renderPosts();
      updateStreak();
    }

    function renderPlanDisplay() {
      if (!state.plan) return;
      const p = state.plan;
      
      document.getElementById('planSetup').style.display = 'none';
      document.getElementById('planDisplay').style.display = 'block';
      
      document.getElementById('planOverview').innerHTML = `
        <div class="plan-stat">
          <div class="icon">🦴</div>
          <div class="value">${p.part}</div>
          <div class="label">康复部位</div>
        </div>
        <div class="plan-stat">
          <div class="icon">📅</div>
          <div class="value">${p.stage}</div>
          <div class="label">当前阶段</div>
        </div>
        <div class="plan-stat">
          <div class="icon">⏱️</div>
          <div class="value">${p.dailyMinutes}</div>
          <div class="label">分钟/天</div>
        </div>
        <div class="plan-stat">
          <div class="icon">🔥</div>
          <div class="value">${p.frequency}</div>
          <div class="label">天/周</div>
        </div>
      `;

      // 更新头部
      document.getElementById('headerPart').textContent = p.part;
      document.getElementById('headerStage').textContent = p.stage;
      document.getElementById('todayPart').textContent = p.part;
      document.getElementById('todayGoal').textContent = '目标：' + p.goal;
      document.getElementById('todayMinutes').textContent = p.dailyMinutes;
      document.getElementById('todayFreq').textContent = p.frequency;
      document.getElementById('todayPain').textContent = p.painLevel;
    }

    function renderTodayTasks() {
      if (!state.plan) return;
      const part = state.plan.part;
      const exercises = defaultExercises[part] || defaultExercises['膝盖'];
      
      const today = getDateKey(new Date());
      const todayRecord = state.records[today];
      const isCompleted = todayRecord?.completed;
      
      const container = document.getElementById('todayTasks');
      
      if (isCompleted) {
        container.innerHTML = `
          <div style="text-align:center;padding:20px;">
            <div style="font-size:48px;margin-bottom:10px;">🎉</div>
            <p style="color:var(--success);font-weight:600;">今日已完成打卡！</p>
            <p style="font-size:12px;color:var(--text-light);margin-top:6px;">训练时长：${todayRecord.minutes}分钟 · 效果：${'⭐'.repeat(todayRecord.score)}</p>
          </div>
        `;
        document.getElementById('checkinBtn').textContent = '✅ 今日已打卡';
        document.getElementById('checkinBtn').disabled = true;
        state.completedToday = true;
        return;
      }

      container.innerHTML = exercises.map((ex, i) => `
        <div class="task-item" onclick="toggleTask(${i})">
          <div class="task-check" id="task-${i}"></div>
          <div class="task-info">
            <div class="task-name">${ex.name}</div>
            <div class="task-meta">约${ex.duration}分钟 · ${ex.desc}</div>
          </div>
        </div>
      `).join('');

      state.todayTasks = exercises;
      document.getElementById('checkinBtn').textContent = '✅ 完成今日打卡';
      document.getElementById('checkinBtn').disabled = false;
    }

    function toggleTask(index) {
      const el = document.getElementById(`task-${index}`);
      if (el.textContent) {
        el.textContent = '';
      } else {
        el.textContent = '✓';
      }
    }

    function generateAdvice() {
      if (!state.plan) return;
      
      const today = getDateKey(new Date());
      const latestRecord = Object.values(state.records).pop();
      const completedDays = Object.values(state.records).filter(r => r.completed).length;
      
      let advice = '';
      
      if (!latestRecord) {
        if (state.plan.painLevel >= 6) {
          advice = '当前疼痛等级较高，建议优先休息，必要时咨询医生。训练强度可以从最简单的动作开始。';
        } else if (state.plan.stage.includes('第1周') || state.plan.stage.includes('第2周')) {
          advice = '早期康复阶段，以被动训练和轻度活动为主。动作要缓慢，如有不适立即停止。';
        } else if (state.plan.stage.includes('中期')) {
          advice = '进入中期康复，可以适当增加训练强度，但仍需注意疼痛反馈。';
        } else {
          advice = '后期康复以功能训练和预防为主，保持运动习惯，防止再次损伤。';
        }
      } else {
        if (latestRecord.painAfter > latestRecord.painBefore) {
          advice = '训练后疼痛有所增加，建议下次降低训练强度或缩短时间。如持续疼痛请咨询医生。';
        } else if (latestRecord.painAfter < latestRecord.painBefore) {
          advice = '训练后疼痛减轻，说明当前训练强度合适。继续坚持，加油！';
        } else {
          advice = '疼痛变化不明显，建议继续观察。保持稳定训练节奏很重要。';
        }
      }

      if (completedDays >= 7) {
        advice += '你已经连续坚持了' + completedDays + '天，恢复习惯很好！';
      } else if (completedDays >= 3) {
        advice += '继续保持稳定节奏，不要突然增加强度。';
      }
      
      document.getElementById('adviceText').textContent = advice;
    }

    // ========== 计划 ==========
    function savePlan() {
      const part = document.getElementById('planPart').value;
      const stage = document.getElementById('planStage').value;
      const minutes = parseInt(document.getElementById('planMinutes').value);
      const freq = parseInt(document.getElementById('planFreq').value);
      const goal = document.getElementById('planGoal').value;
      const pain = parseInt(document.getElementById('planPain').value);

      if (!part) {
        showToast('请选择康复部位');
        return;
      }

      state.plan = {
        part, stage, dailyMinutes: minutes, frequency: freq, goal, painLevel: pain,
        startDate: getDateKey(new Date())
      };
      
      saveState();
      renderPlanDisplay();
      renderTodayTasks();
      generateAdvice();
      showToast('计划已保存！');
      navigateTo('home');
    }

    function editPlan() {
      if (!state.plan) return;
      document.getElementById('planPart').value = state.plan.part;
      document.getElementById('planStage').value = state.plan.stage;
      document.getElementById('planMinutes').value = state.plan.dailyMinutes;
      document.getElementById('planFreq').value = state.plan.frequency;
      document.getElementById('planGoal').value = state.plan.goal;
      document.getElementById('planPain').value = state.plan.painLevel;
      document.getElementById('painValue').textContent = state.plan.painLevel + ' / 10';
      
      document.getElementById('planSetup').style.display = 'block';
      document.getElementById('planDisplay').style.display = 'none';
    }

    // ========== 打卡 ==========
    function openCheckin() {
      if (state.completedToday) return;
      document.getElementById('checkinMinutes').value = state.plan?.dailyMinutes || 20;
      document.getElementById('checkinPainBefore').value = state.plan?.painLevel || 3;
      document.getElementById('checkinPainAfter').value = Math.max(1, (state.plan?.painLevel || 3) - 1);
      document.getElementById('painBeforeValue').textContent = document.getElementById('checkinPainBefore').value;
      document.getElementById('painAfterValue').textContent = document.getElementById('checkinPainAfter').value;
      document.getElementById('checkinFeeling').value = '';
      document.getElementById('checkinScore').value = '4';
      showModal('checkinModal');
    }

    function saveCheckin() {
      const today = getDateKey(new Date());
      const record = {
        id: Date.now(),
        date: today,
        part: state.plan?.part || '未知',
        minutes: parseInt(document.getElementById('checkinMinutes').value),
        painBefore: parseInt(document.getElementById('checkinPainBefore').value),
        painAfter: parseInt(document.getElementById('checkinPainAfter').value),
        score: parseInt(document.getElementById('checkinScore').value),
        feeling: document.getElementById('checkinFeeling').value,
        completed: true
      };

      state.records[today] = record;
      state.completedToday = true;
      saveState();
      
      closeModal('checkinModal');
      renderTodayTasks();
      generateAdvice();
      updateStreak();
      showCheckinSuccess();
    }

    function showCheckinSuccess() {
      document.getElementById('checkinBody').innerHTML = `
        <div class="checkin-complete">
          <div class="icon">🎉</div>
          <h3>打卡成功！</h3>
          <p>坚持就是胜利，继续加油！</p>
          <button class="btn btn-primary" onclick="closeModal('checkinModal'); navigateTo('calendar');" style="margin-top:20px;">
            查看日历记录
          </button>
        </div>
      `;
    }

    // ========== 日历 ==========
    function initCalendarNav() {
      document.getElementById('prevMonth').addEventListener('click', () => {
        state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() - 1);
        renderCalendar();
        saveState();
      });
      document.getElementById('nextMonth').addEventListener('click', () => {
        state.currentMonth = new Date(state.currentMonth.getFullYear(), state.currentMonth.getMonth() + 1);
        renderCalendar();
        saveState();
      });
    }

    function renderCalendar() {
      const year = state.currentMonth.getFullYear();
      const month = state.currentMonth.getMonth();
      document.getElementById('calendarMonth').textContent = `${year}年${month + 1}月`;
      
      const container = document.getElementById('calendarDays');
      container.innerHTML = '';
      
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = getDateKey(new Date());
      
      for (let i = 0; i < firstDay; i++) {
        container.innerHTML += '<div class="calendar-day empty"></div>';
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const record = state.records[dateKey];
        const isToday = dateKey === today;
        
        let className = 'calendar-day';
        if (isToday) className += ' today';
        if (record?.completed) className += ' completed';
        else if (record) className += ' partial';
        if (record?.painAfter > record?.painBefore) className += ' pain-up';
        
        container.innerHTML += `<div class="${className}" onclick="showDayDetail('${dateKey}')">${day}</div>`;
      }
      
      renderWeekSummary();
    }

    function showDayDetail(dateKey) {
      const record = state.records[dateKey];
      const detail = document.getElementById('dayDetail');
      
      if (!record) {
        detail.style.display = 'none';
        return;
      }
      
      detail.style.display = 'block';
      document.getElementById('detailDate').textContent = dateKey;
      document.getElementById('detailPart').textContent = record.part;
      document.getElementById('detailMinutes').textContent = record.minutes + '分钟';
      document.getElementById('detailPainBefore').textContent = record.painBefore + ' / 10';
      document.getElementById('detailPainAfter').textContent = record.painAfter + ' / 10';
      document.getElementById('detailScore').textContent = '⭐'.repeat(record.score);
      document.getElementById('detailStatus').textContent = record.completed ? '✅ 已完成' : '❌ 未完成';
      document.getElementById('detailFeeling').textContent = record.feeling || '无';
    }

    function renderWeekSummary() {
      const today = new Date();
      const dayOfWeek = today.getDay();
      const mondayOffset = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
      
      const container = document.getElementById('weekSummary');
      const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
      
      container.innerHTML = days.map((day, i) => {
        const date = new Date(today);
        date.setDate(date.getDate() - mondayOffset + i);
        const dateKey = getDateKey(date);
        const record = state.records[dateKey];
        const isCompleted = record?.completed;
        
        return `
          <div class="day ${isCompleted ? 'completed' : 'pending'}">
            <div class="dot">${isCompleted ? '✓' : ''}</div>
            <div>${day}</div>
          </div>
        `;
      }).join('');
    }

    // ========== 社区 ==========
    function publishPost() {
      const part = document.getElementById('postPart').value;
      const stage = document.getElementById('postStage').value;
      const content = document.getElementById('postContent').value.trim();
      
      if (!part || !stage || !content) {
        showToast('请填写完整信息');
        return;
      }
      
      const post = {
        id: Date.now(),
        userName: '我',
        part,
        stage,
        content,
        createdAt: getDateKey(new Date()),
        likes: 0,
        avatar: '😊'
      };
      
      state.posts.unshift(post);
      saveState();
      renderPosts();
      
      document.getElementById('postContent').value = '';
      showToast('发布成功！');
    }

    function renderPosts() {
      const container = document.getElementById('postList');
      
      if (state.posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">💬</div>
            <p>暂无帖子，快来分享你的康复心得吧！</p>
          </div>
        `;
        return;
      }
      
      container.innerHTML = state.posts.map(post => `
        <div class="post-item">
          <div class="post-header">
            <div class="post-avatar">${post.avatar}</div>
            <div>
              <div class="post-user">${post.userName}</div>
              <div class="post-meta">${post.createdAt}</div>
            </div>
          </div>
          <div class="post-tag">${post.part} · ${post.stage}</div>
          <div class="post-content">${post.content}</div>
          <div class="post-actions">
            <span class="post-action" onclick="likePost(${post.id})">👍 ${post.likes}</span>
          </div>
        </div>
      `).join('');
    }

    function likePost(id) {
      const post = state.posts.find(p => p.id === id);
      if (post) {
        post.likes++;
        saveState();
        renderPosts();
      }
    }

    // ========== 连续打卡 ==========
    function updateStreak() {
      const today = getDateKey(new Date());
      const yesterday = getDateKey(new Date(Date.now() - 86400000));
      
      let streak = 0;
      let checkDate = new Date();
      
      while (true) {
        const key = getDateKey(checkDate);
        if (state.records[key]?.completed) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else if (key === today) {
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      
      state.streak = streak;
      document.getElementById('streakCount').textContent = streak;
      saveState();
    }

    // ========== 工具 ==========
    function getDateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function showModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.querySelectorAll('.modal-overlay').forEach(o => {
      o.addEventListener('click', e => { if (e.target === o) o.classList.remove('show'); });
    });
  </script>
</body>
</html>
