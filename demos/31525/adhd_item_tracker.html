<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>物品定位助手 - ADHD 友好版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #f4d03f;
            --bg-dark: #e8c547;
            --panel: #fff8dc;
            --panel-border: #8b7355;
            --text: #4a3728;
            --text-light: #8b7355;
            --accent: #e74c3c;
            --accent-hover: #c0392b;
            --success: #27ae60;
            --success-hover: #1e8449;
            --info: #3498db;
            --warning: #f39c12;
            --shadow: rgba(74, 55, 40, 0.3);
            --pixel-border: 4px;
        }

        body {
            font-family: 'VT323', 'Microsoft YaHei', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 20px;
            line-height: 1.4;
        }

        .pixel-box {
            background: var(--panel);
            border: var(--pixel-border) solid var(--panel-border);
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.1), 4px 4px 0 var(--shadow);
            border-radius: 0;
            image-rendering: pixelated;
        }

        .pixel-btn {
            font-family: 'VT323', 'Microsoft YaHei', monospace;
            font-size: 22px;
            padding: 12px 20px;
            border: var(--pixel-border) solid var(--panel-border);
            background: var(--success);
            color: white;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--shadow);
            transition: transform 0.1s, box-shadow 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--shadow);
        }

        .pixel-btn.secondary { background: var(--info); }
        .pixel-btn.accent { background: var(--accent); }
        .pixel-btn.warning { background: var(--warning); color: var(--text); }
        .pixel-btn.small { font-size: 18px; padding: 8px 14px; }

        .header {
            background: var(--panel);
            border-bottom: var(--pixel-border) solid var(--panel-border);
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 0 var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 32px;
            color: var(--text);
            text-shadow: 2px 2px 0 var(--shadow);
            letter-spacing: 2px;
        }

        .header .subtitle {
            font-size: 16px;
            color: var(--text-light);
            margin-top: 2px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 16px;
        }

        /* 模式切换 */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .mode-tab {
            flex: 1;
            font-family: 'VT323', 'Microsoft YaHei', monospace;
            font-size: 20px;
            padding: 12px;
            border: var(--pixel-border) solid var(--panel-border);
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
            box-shadow: 3px 3px 0 var(--shadow);
            transition: all 0.1s;
        }

        .mode-tab.active {
            background: var(--success);
            color: white;
        }

        .mode-tab:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        /* 语音 */
        .voice-section {
            text-align: center;
            margin-bottom: 16px;
        }

        .voice-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: var(--pixel-border) solid var(--panel-border);
            background: var(--accent);
            color: white;
            font-size: 44px;
            cursor: pointer;
            box-shadow: 5px 5px 0 var(--shadow);
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
        }

        .voice-btn:hover { background: var(--accent-hover); }
        .voice-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 var(--shadow);
        }
        .voice-btn.listening {
            animation: pulse 1s infinite;
            background: var(--warning);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .voice-hint {
            font-size: 16px;
            color: var(--text-light);
        }

        .wave-container {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 40px;
            margin-bottom: 8px;
        }
        .wave-container.active { display: flex; }
        .wave-bar {
            width: 5px;
            background: var(--accent);
            animation: wave 0.5s ease-in-out infinite alternate;
        }
        .wave-bar:nth-child(1) { height: 15px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 25px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 35px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 22px; animation-delay: 0.15s; }
        .wave-bar:nth-child(5) { height: 30px; animation-delay: 0.05s; }
        @keyframes wave {
            from { transform: scaleY(0.5); }
            to { transform: scaleY(1); }
        }

        /* 输入 */
        .input-section {
            margin-bottom: 16px;
        }
        .pixel-input {
            width: 100%;
            font-family: 'VT323', 'Microsoft YaHei', monospace;
            font-size: 20px;
            padding: 12px;
            border: var(--pixel-border) solid var(--panel-border);
            background: var(--panel);
            color: var(--text);
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.1);
            outline: none;
            margin-bottom: 10px;
        }
        .pixel-input::placeholder { color: var(--text-light); }
        .input-row { display: flex; gap: 8px; }
        .input-row .pixel-input { flex: 1; margin-bottom: 0; }

        /* 统计 */
        .stats-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: var(--panel);
            border: 3px solid var(--panel-border);
            padding: 8px 14px;
            font-size: 18px;
            box-shadow: 3px 3px 0 var(--shadow);
        }
        .stat-pill .num {
            color: var(--accent);
            font-size: 24px;
            font-weight: bold;
        }

        /* ========== 场景地图视图 ========== */
        .scene-view {
            margin-bottom: 16px;
        }

        .scene-room {
            margin-bottom: 24px;
        }

        .room-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: var(--panel);
            border: 3px solid var(--panel-border);
            box-shadow: 3px 3px 0 var(--shadow);
        }

        .room-icon {
            font-size: 32px;
        }

        .room-title {
            font-size: 26px;
            font-weight: bold;
            flex: 1;
        }

        .room-count {
            font-size: 18px;
            color: var(--text-light);
            background: var(--bg);
            padding: 4px 12px;
            border: 2px solid var(--panel-border);
        }

        /* 房间内的定位点布局 */
        .room-layout {
            background: var(--panel);
            border: var(--pixel-border) solid var(--panel-border);
            padding: 16px;
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spot-row {
            display: flex;
            align-items: stretch;
            gap: 10px;
            min-height: 80px;
        }

        .spot-label {
            width: 80px;
            min-width: 80px;
            background: var(--bg);
            border: 3px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-shadow: 2px 2px 0 var(--shadow);
        }

        .spot-label-icon {
            font-size: 24px;
        }

        .spot-label-text {
            font-size: 14px;
            margin-top: 2px;
            text-align: center;
            line-height: 1.2;
        }

        .spot-items {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 8px;
            background: rgba(244, 208, 63, 0.3);
            border: 2px dashed var(--panel-border);
            min-height: 70px;
        }

        .spot-item-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 10px;
            background: var(--bg);
            border: 3px solid var(--panel-border);
            box-shadow: 2px 2px 0 var(--shadow);
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }

        .spot-item-chip:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 var(--shadow);
            border-color: var(--success);
        }

        .spot-item-chip:active {
            transform: translate(1px, 1px);
        }

        .chip-emoji {
            font-size: 28px;
            line-height: 1;
        }

        .chip-name {
            font-size: 12px;
            margin-top: 2px;
            white-space: nowrap;
        }

        .chip-delete {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 18px;
            height: 18px;
            background: var(--accent);
            color: white;
            border: 2px solid var(--panel-border);
            font-size: 11px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
        }

        .spot-item-chip:hover .chip-delete {
            display: flex;
        }

        .spot-empty {
            color: var(--text-light);
            font-size: 16px;
            opacity: 0.5;
            width: 100%;
            text-align: center;
        }

        /* 添加定位点按钮 */
        .add-spot-btn {
            font-family: 'VT323', 'Microsoft YaHei', monospace;
            font-size: 16px;
            padding: 6px 12px;
            border: 2px solid var(--panel-border);
            background: var(--panel);
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--shadow);
            color: var(--text-light);
        }

        .add-spot-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        /* ========== 背包/总览视图 ========== */
        .backpack-view {
            margin-bottom: 16px;
        }

        .location-chest {
            margin-bottom: 20px;
        }

        .chest-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: var(--panel);
            border: 3px solid var(--panel-border);
            box-shadow: 3px 3px 0 var(--shadow);
        }

        .chest-icon {
            font-size: 28px;
        }

        .chest-title {
            font-size: 24px;
            font-weight: bold;
            flex: 1;
        }

        .chest-count {
            font-size: 18px;
            color: var(--text-light);
            background: var(--bg);
            padding: 4px 10px;
            border: 2px solid var(--panel-border);
        }

        .chest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
            gap: 8px;
            padding: 12px;
            background: var(--panel);
            border: var(--pixel-border) solid var(--panel-border);
            box-shadow: inset 3px 3px 0 rgba(0,0,0,0.08);
        }

        .chest-slot {
            aspect-ratio: 1;
            background: var(--bg);
            border: 3px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--shadow);
            transition: transform 0.1s;
            position: relative;
            padding: 4px;
        }

        .chest-slot:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 var(--shadow);
            border-color: var(--success);
        }

        .chest-slot:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        .slot-emoji {
            font-size: 32px;
            line-height: 1;
        }

        .slot-name {
            font-size: 13px;
            margin-top: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .slot-delete {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 20px;
            height: 20px;
            background: var(--accent);
            color: white;
            border: 2px solid var(--panel-border);
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
        }

        .chest-slot:hover .slot-delete {
            display: flex;
        }

        .slot-empty {
            aspect-ratio: 1;
            background: rgba(139, 115, 85, 0.15);
            border: 3px dashed var(--panel-border);
            opacity: 0.5;
        }

        /* 物品列表（查找模式） */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: var(--panel);
            border: var(--pixel-border) solid var(--panel-border);
            padding: 14px;
            box-shadow: 4px 4px 0 var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .item-card:active {
            transform: translate(2px, 2px);
        }

        .item-icon {
            font-size: 36px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            border: 3px solid var(--panel-border);
            flex-shrink: 0;
        }

        .item-info { flex: 1; min-width: 0; }
        .item-name {
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item-location {
            font-size: 18px;
            color: var(--text-light);
            margin-top: 2px;
        }
        .item-time {
            font-size: 14px;
            color: var(--text-light);
            opacity: 0.7;
        }

        .item-actions {
            display: flex;
            gap: 6px;
        }
        .item-actions button {
            font-family: 'VT323', 'Microsoft YaHei', monospace;
            font-size: 18px;
            padding: 6px 10px;
            border: 3px solid var(--panel-border);
            background: var(--bg);
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--shadow);
        }
        .item-actions button:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state .icon { font-size: 64px; margin-bottom: 12px; opacity: 0.5; }
        .empty-state p { font-size: 20px; }

        /* Toast */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--panel);
            border: var(--pixel-border) solid var(--panel-border);
            padding: 14px 28px;
            font-size: 20px;
            box-shadow: 4px 4px 0 var(--shadow);
            z-index: 1000;
            transition: transform 0.3s;
            white-space: nowrap;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--accent); color: var(--accent); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--panel);
            border: var(--pixel-border) solid var(--panel-border);
            padding: 20px;
            box-shadow: 6px 6px 0 var(--shadow);
            max-width: 380px;
            width: 100%;
            text-align: center;
        }
        .modal-box h3 { font-size: 26px; margin-bottom: 12px; }
        .modal-box p { font-size: 18px; color: var(--text-light); margin-bottom: 16px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--panel-border); border: 2px solid var(--bg); }

        @media (max-width: 480px) {
            .header h1 { font-size: 26px; }
            .spot-label { width: 60px; min-width: 60px; }
            .spot-label-icon { font-size: 20px; }
            .spot-label-text { font-size: 12px; }
            .chip-emoji { font-size: 24px; }
            .chest-grid { grid-template-columns: repeat(4, 1fr); }
            .slot-emoji { font-size: 28px; }
            .slot-name { font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 物品定位助手</h1>
        <p class="subtitle">喊一声，就记住东西在哪了</p>
    </div>

    <div class="container">
        <!-- 模式切换 -->
        <div class="mode-tabs">
            <button class="mode-tab active" onclick="switchMode('record')">📝 记录</button>
            <button class="mode-tab" onclick="switchMode('scene')">🏠 场景</button>
            <button class="mode-tab" onclick="switchMode('backpack')">🎒 总览</button>
            <button class="mode-tab" onclick="switchMode('query')">🔍 查找</button>
        </div>

        <!-- 记录模式 -->
        <div id="record-mode">
            <div class="voice-section">
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
                <div class="wave-container" id="waveContainer">
                    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                </div>
                <p class="voice-hint" id="voiceHint">点击麦克风，说"钥匙放在客厅茶几上"</p>
            </div>
            <div class="input-section pixel-box">
                <input type="text" class="pixel-input" id="itemName" placeholder="物品名称（如：钥匙）">
                <div class="input-row">
                    <input type="text" class="pixel-input" id="itemLocation" placeholder="放在哪里（如：客厅茶几）">
                    <button class="pixel-btn" onclick="addItem()">💾 保存</button>
                </div>
            </div>
        </div>

        <!-- 场景模式 -->
        <div id="scene-mode" style="display:none">
            <div class="stats-bar" id="sceneStats"></div>
            <div class="scene-view" id="sceneView"></div>
        </div>

        <!-- 总览模式 -->
        <div id="backpack-mode" style="display:none">
            <div class="stats-bar" id="backpackStats"></div>
            <div class="backpack-view" id="backpackView"></div>
        </div>

        <!-- 查找模式 -->
        <div id="query-mode" style="display:none">
            <div class="search-section">
                <input type="text" class="pixel-input" id="searchInput" placeholder="搜索物品..." oninput="renderList()">
            </div>
            <div class="items-list" id="itemsList"></div>
        </div>

        <!-- 记录模式下的统计+列表 -->
        <div id="record-stats">
            <div class="stats-bar">
                <div class="stat-pill">📦 物品 <span class="num" id="totalCount">0</span></div>
                <div class="stat-pill">📍 位置 <span class="num" id="locCount">0</span></div>
            </div>
            <div class="items-list" id="recordItemsList"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h3>⚠️ 确认删除</h3>
            <p id="modalText">确定要删除这个物品吗？</p>
            <div class="modal-actions">
                <button class="pixel-btn secondary" onclick="closeModal()">取消</button>
                <button class="pixel-btn accent" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('adhd_items') || '[]');
        let currentMode = 'record';
        let deleteTarget = null;
        let recognition = null;

        // ========== 位置智能归类系统 ==========
        // 地点 -> 定位点映射
        const LOCATION_SPOTS = {
            '客厅': {
                icon: '🛋️',
                spots: {
                    '沙发': { icon: '🛋️', aliases: ['沙发', '沙發', '沙发区'] },
                    '茶几': { icon: '🪑', aliases: ['茶几', '茶幾', '桌子'] },
                    '电视柜': { icon: '📺', aliases: ['电视柜', '電視櫃', '电视'] },
                    '门口': { icon: '🚪', aliases: ['门口', '門口', '入门处'] }
                }
            },
            '卧室': {
                icon: '🛏️',
                spots: {
                    '床头': { icon: '🛏️', aliases: ['床头', '床頭', '床边'] },
                    '衣柜': { icon: '👔', aliases: ['衣柜', '衣櫃', '衣橱'] },
                    '梳妆台': { icon: '💄', aliases: ['梳妆台', '梳妝台', '化妆台'] },
                    '书桌': { icon: '📖', aliases: ['书桌', '書桌', '写字台'] }
                }
            },
            '厨房': {
                icon: '🍳',
                spots: {
                    '灶台': { icon: '🔥', aliases: ['灶台', '灶臺', '炉灶'] },
                    '冰箱': { icon: '🧊', aliases: ['冰箱', '冰櫃'] },
                    '水槽': { icon: '🚰', aliases: ['水槽', '洗碗池', '水池'] },
                    '餐桌': { icon: '🍽️', aliases: ['餐桌', '飯桌', '饭桌'] },
                    '橱柜': { icon: '🗄️', aliases: ['橱柜', '廚櫃', '柜子'] }
                }
            },
            '玄关': {

                spots: {
                    '鞋柜': { icon: '👟', aliases: ['鞋柜', '鞋櫃', '鞋架'] },

                    '挂钩': { icon: '🪝', aliases: ['挂钩', '掛鉤', '挂架'] }
                }
            },
            '书房': {
                icon: '📚',
                spots: {
                    '书桌': { icon: '📝', aliases: ['书桌', '書桌', '电脑桌', '電腦桌'] },
                    '书架': { icon: '📚', aliases: ['书架', '書架'] },
                    '椅子': { icon: '💺', aliases: ['椅子', '座椅'] }
                }
            },
            '卫生间': {
                icon: '🚿',
                spots: {
                    '洗手台': { icon: '🧼', aliases: ['洗手台', '洗手盆', '洗漱台'] },
                    '马桶': { icon: '🚽', aliases: ['马桶', '馬桶', '厕所'] },
                    '浴室': { icon: '🛁', aliases: ['浴室', '淋浴间', '洗澡间'] },
                    '镜子柜': { icon: '🪞', aliases: ['镜子', '鏡子', '镜柜'] }
                }
            },
            '阳台': {
                icon: '🌞',
                spots: {
                    '晾衣架': { icon: '👕', aliases: ['晾衣架', '晾衣杆'] },
                    '花架': { icon: '🌱', aliases: ['花架', '花盆区'] },
                    '角落': { icon: '📐', aliases: ['角落', '边角'] }
                }
            },
            '办公室': {
                icon: '💼',
                spots: {
                    '办公桌': { icon: '💻', aliases: ['办公桌', '辦公桌', '工位'] },
                    '抽屉': { icon: '📥', aliases: ['抽屉', '抽屜'] },
                    '文件柜': { icon: '🗄️', aliases: ['文件柜', '檔案櫃'] }
                }
            },
            '背包': {
                icon: '🎒',
                spots: {
                    '主袋': { icon: '📦', aliases: ['主袋', '主包'] },
                    '侧袋': { icon: '🔷', aliases: ['侧袋', '側袋', '侧包'] },
                    '内袋': { icon: '🔹', aliases: ['内袋', '內袋', '小口袋'] }
                }
            },
            '车上': {
                icon: '🚗',
                spots: {
                    '驾驶座': { icon: '🪑', aliases: ['驾驶座', '駕駛座', '主驾'] },
                    '副驾': { icon: '💺', aliases: ['副驾', '副駕駛', '副驾驶'] },
                    '后座': { icon: '🛋️', aliases: ['后座', '後座', '后排'] },
                    '后备箱': { icon: '📦', aliases: ['后备箱', '後車廂', '尾箱'] }
                }
            }
        };

        // 解析位置：返回 {room, spot}
        function parseLocation(locationStr) {
            const lower = locationStr.toLowerCase();
            
            for (const [roomName, roomData] of Object.entries(LOCATION_SPOTS)) {
                // 检查是否匹配房间名
                const roomMatch = roomData.spots || {};
                
                for (const [spotName, spotData] of Object.entries(roomData.spots || {})) {
                    for (const alias of spotData.aliases || []) {
                        if (lower.includes(alias.toLowerCase())) {
                            return { room: roomName, spot: spotName };
                        }
                    }
                }
                
                // 如果地点名本身包含房间名
                if (lower.includes(roomName.toLowerCase())) {
                    // 尝试找定位点
                    for (const [spotName, spotData] of Object.entries(roomData.spots || {})) {
                        for (const alias of spotData.aliases || []) {
                            if (lower.includes(alias.toLowerCase())) {
                                return { room: roomName, spot: spotName };
                            }
                        }
                    }
                    return { room: roomName, spot: '默认位置' };
                }
            }
            
            // 无法识别，返回原始字符串作为房间
            return { room: locationStr, spot: '默认位置' };
        }

        function getRoomIcon(roomName) {
            return LOCATION_SPOTS[roomName]?.icon || '📦';
        }

        function getSpotIcon(roomName, spotName) {
            return LOCATION_SPOTS[roomName]?.spots?.[spotName]?.icon || '📍';
        }

        // 按房间->定位点分组
        function groupByScene(itemList) {
            const scene = {};
            for (const item of itemList) {
                const parsed = parseLocation(item.location);
                const room = parsed.room;
                const spot = parsed.spot;
                
                if (!scene[room]) scene[room] = {};
                if (!scene[room][spot]) scene[room][spot] = [];
                scene[room][spot].push(item);
            }
            return scene;
        }

        // ========== 语音识别 ==========
        function initSpeech() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => {
                    document.getElementById('voiceBtn').classList.add('listening');
                    document.getElementById('waveContainer').classList.add('active');
                    document.getElementById('voiceHint').textContent = '正在听...';
                };
                recognition.onend = () => {
                    document.getElementById('voiceBtn').classList.remove('listening');
                    document.getElementById('waveContainer').classList.remove('active');
                    document.getElementById('voiceHint').textContent = '点击麦克风，说"钥匙放在客厅茶几上"';
                };
                recognition.onresult = (event) => {
                    parseVoiceInput(event.results[0][0].transcript);
                };
                recognition.onerror = (event) => {
                    showToast('语音识别出错：' + event.error, 'error');
                };
            }
        }

        function toggleVoice() {
            if (!recognition) {
                showToast('您的浏览器不支持语音识别，请手动输入', 'error');
                return;
            }
            if (document.getElementById('voiceBtn').classList.contains('listening')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function parseVoiceInput(text) {
            const patterns = [
                /(.+?)[放到存搁在进](.+)/,
                /(.+?)在(.+)/,
                /(.+?)放到(.+)/,
                /(.+?)放在(.+)/
            ];
            let item = '', location = '';
            for (const p of patterns) {
                const match = text.match(p);
                if (match) { item = match[1].trim(); location = match[2].trim(); break; }
            }
            if (!item || !location) {
                const parts = text.split(/[，,\s]/);
                if (parts.length >= 2) {
                    item = parts[0].trim();
                    location = parts.slice(1).join(' ').trim();
                } else {
                    item = text.trim();
                    location = '未指定位置';
                }
            }
            item = item.replace(/[了啦啊呢吧]/g, '').trim();
            location = location.replace(/[了啦啊呢吧]/g, '').trim();
            if (item) {
                document.getElementById('itemName').value = item;
                document.getElementById('itemLocation').value = location;
                const parsed = parseLocation(location);
                showToast(`识别到：${item} → ${parsed.room} · ${parsed.spot}`, 'success');
                addItem();
            }
        }

        // ========== 增删改查 ==========
        function addItem() {
            const name = document.getElementById('itemName').value.trim();
            const location = document.getElementById('itemLocation').value.trim();
            if (!name) { showToast('请输入物品名称', 'error'); return; }

            const parsed = parseLocation(location || '未指定位置');
            const item = {
                id: Date.now(),
                name,
                location: location || '未指定位置',
                room: parsed.room,
                spot: parsed.spot,
                emoji: getEmoji(name),
                created: new Date().toLocaleString('zh-CN'),
                updated: new Date().toLocaleString('zh-CN')
            };
            items.unshift(item);
            saveItems();
            refreshAll();
            document.getElementById('itemName').value = '';
            document.getElementById('itemLocation').value = '';
            showToast(`已记录：${name} → ${parsed.room} · ${parsed.spot}`, 'success');
        }

        function deleteItem(id) {
            deleteTarget = id;
            const item = items.find(i => i.id === id);
            document.getElementById('modalText').textContent = `确定要删除 "${item?.name || '这个物品'}" 吗？`;
            document.getElementById('modal').classList.add('show');
        }

        function confirmDelete() {
            if (deleteTarget) {
                items = items.filter(i => i.id !== deleteTarget);
                saveItems();
                refreshAll();
                showToast('已删除', 'success');
            }
            closeModal();
        }

        function closeModal() { deleteTarget = null; document.getElementById('modal').classList.remove('show'); }

        function updateLocation(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            const newLoc = prompt(`更新 "${item.name}" 的位置：`, item.location);
            if (newLoc && newLoc.trim()) {
                const parsed = parseLocation(newLoc.trim());
                item.location = newLoc.trim();
                item.room = parsed.room;
                item.spot = parsed.spot;
                item.updated = new Date().toLocaleString('zh-CN');
                saveItems();
                refreshAll();
                showToast(`已更新：${item.name} → ${parsed.room} · ${parsed.spot}`, 'success');
            }
        }

        function saveItems() { localStorage.setItem('adhd_items', JSON.stringify(items)); }

        // ========== 渲染 ==========
        function refreshAll() {
            updateStats();
            renderRecordList();
            if (currentMode === 'scene') renderScene();
            if (currentMode === 'backpack') renderBackpack();
            if (currentMode === 'query') renderList();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = items.length;
            const uniqueLocs = new Set(items.map(i => i.location)).size;
            document.getElementById('locCount').textContent = uniqueLocs;
        }

        function renderRecordList() {
            const list = document.getElementById('recordItemsList');
            if (items.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>还没有记录任何物品</p><p style="font-size:16px;margin-top:6px;">点击麦克风或手动输入来记录吧！</p></div>`;
                return;
            }
            list.innerHTML = items.map(item => renderItemCard(item)).join('');
        }

        function renderList() {
            const search = document.getElementById('searchInput')?.value?.toLowerCase() || '';
            const filtered = search
                ? items.filter(i => i.name.toLowerCase().includes(search) || i.location.toLowerCase().includes(search))
                : items;
            const list = document.getElementById('itemsList');
            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>${search ? '没有找到匹配的物品' : '还没有记录任何物品'}</p></div>`;
                return;
            }
            list.innerHTML = filtered.map(item => renderItemCard(item)).join('');
        }

        function renderItemCard(item) {
            const parsed = parseLocation(item.location);
            return `
                <div class="item-card">
                    <div class="item-icon">${item.emoji}</div>
                    <div class="item-info">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-location">📍 ${escapeHtml(item.location)}（${parsed.room} · ${parsed.spot}）</div>
                        <div class="item-time">${item.updated}</div>
                    </div>
                    <div class="item-actions">
                        <button onclick="event.stopPropagation();updateLocation(${item.id})" title="更新位置">📍</button>
                        <button onclick="event.stopPropagation();deleteItem(${item.id})" title="删除">🗑️</button>
                    </div>
                </div>
            `;
        }

        // ========== 场景地图渲染 ==========
        function renderScene() {
            const stats = document.getElementById('sceneStats');
            const view = document.getElementById('sceneView');

            if (items.length === 0) {
                stats.innerHTML = '';
                view.innerHTML = `<div class="empty-state"><div class="icon">🏠</div><p>还没有场景数据</p><p style="font-size:16px;margin-top:6px;">去记录一些物品来搭建你的场景吧！</p></div>`;
                return;
            }

            const scene = groupByScene(items);
            const roomCount = Object.keys(scene).length;
            const spotCount = Object.values(scene).reduce((sum, spots) => sum + Object.keys(spots).length, 0);
            
            stats.innerHTML = `
                <div class="stat-pill">🏠 房间 <span class="num">${roomCount}</span></div>
                <div class="stat-pill">📍 定位点 <span class="num">${spotCount}</span></div>
                <div class="stat-pill">📦 物品 <span class="num">${items.length}</span></div>
            `;

            view.innerHTML = Object.entries(scene).map(([roomName, spots]) => {
                const roomIcon = getRoomIcon(roomName);
                const roomItemCount = Object.values(spots).reduce((sum, arr) => sum + arr.length, 0);
                
                const spotRows = Object.entries(spots).map(([spotName, spotItems]) => {
                    const spotIcon = getSpotIcon(roomName, spotName);
                    const itemsHtml = spotItems.map(it => `
                        <div class="spot-item-chip" onclick="updateLocation(${it.id})" title="${escapeHtml(it.name)}">
                            <span class="chip-emoji">${it.emoji}</span>
                            <span class="chip-name">${escapeHtml(it.name)}</span>
                            <span class="chip-delete" onclick="event.stopPropagation();deleteItem(${it.id})">×</span>
                        </div>
                    `).join('');
                    
                    return `
                        <div class="spot-row">
                            <div class="spot-label">
                                <span class="spot-label-icon">${spotIcon}</span>
                                <span class="spot-label-text">${escapeHtml(spotName)}</span>
                            </div>
                            <div class="spot-items">
                                ${itemsHtml || '<span class="spot-empty">空</span>'}
                            </div>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="scene-room">
                        <div class="room-header">
                            <span class="room-icon">${roomIcon}</span>
                            <span class="room-title">${roomName}</span>
                            <span class="room-count">${roomItemCount} 件</span>
                        </div>
                        <div class="room-layout">
                            ${spotRows}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========== 背包总览 ==========
        function renderBackpack() {
            const stats = document.getElementById('backpackStats');
            const view = document.getElementById('backpackView');

            if (items.length === 0) {
                stats.innerHTML = '';
                view.innerHTML = `<div class="empty-state"><div class="icon">🎒</div><p>背包是空的</p><p style="font-size:16px;margin-top:6px;">去记录一些物品吧！</p></div>`;
                return;
            }

            // 按房间分组（不分定位点）
            const groups = {};
            for (const item of items) {
                const parsed = parseLocation(item.location);
                const room = parsed.room;
                if (!groups[room]) groups[room] = [];
                groups[room].push(item);
            }
            const sorted = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);

            const totalLocs = sorted.length;
            const totalItems = items.length;
            stats.innerHTML = `
                <div class="stat-pill">🎒 区域 <span class="num">${totalLocs}</span></div>
                <div class="stat-pill">📦 物品 <span class="num">${totalItems}</span></div>
            `;

            view.innerHTML = sorted.map(([roomName, groupItems]) => {
                const icon = getRoomIcon(roomName);
                const slots = [];
                for (let i = 0; i < Math.max(groupItems.length, 4); i++) {
                    if (i < groupItems.length) {
                        const it = groupItems[i];
                        slots.push(`
                            <div class="chest-slot" onclick="updateLocation(${it.id})" title="${escapeHtml(it.name)} - ${escapeHtml(it.location)}">
                                <span class="slot-emoji">${it.emoji}</span>
                                <span class="slot-name">${escapeHtml(it.name)}</span>
                                <span class="slot-delete" onclick="event.stopPropagation();deleteItem(${it.id})">×</span>
                            </div>
                        `);
                    } else {
                        slots.push(`<div class="slot-empty"></div>`);
                    }
                }
                return `
                    <div class="location-chest">
                        <div class="chest-header">
                            <span class="chest-icon">${icon}</span>
                            <span class="chest-title">${roomName}</span>
                            <span class="chest-count">${groupItems.length} 件</span>
                        </div>
                        <div class="chest-grid">
                            ${slots.join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ========== 工具 ==========
        function getEmoji(name) {
            const map = {
                '钥匙': '🔑', '手机': '📱', '钱包': '👛', '耳机': '🎧',
                '眼镜': '👓', '手表': '⌚', '电脑': '💻', '平板': '📲',
                '充电器': '🔌', '充电': '🔋', '雨伞': '☂️', '伞': '☂️',
                '包': '👜', '背包': '🎒', '书': '📚', '笔': '✏️',
                '药': '💊', '水': '💧', '杯子': '🥤', '衣服': '👕',
                '鞋': '👟', '帽子': '🧢', '围巾': '🧣', '证件': '🪪',
                '卡': '💳', '身份证': '🪪', '现金': '💵', '钱': '💵',
                '零食': '🍪', '遥控器': '📺', '手柄': '🎮', '相机': '📷',
                '口红': '💄', '化妆品': '💄', '纸巾': '🧻', '口罩': '😷',
                '手套': '🧤', '袜子': '🧦', '皮带': '👔', '领带': '👔',
                '戒指': '💍', '项链': '📿', '香水': '🧴'
            };
            for (const [key, emoji] of Object.entries(map)) {
                if (name.includes(key)) return emoji;
            }
            return '📦';
        }

        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('record-mode').style.display = mode === 'record' ? 'block' : 'none';
            document.getElementById('scene-mode').style.display = mode === 'scene' ? 'block' : 'none';
            document.getElementById('backpack-mode').style.display = mode === 'backpack' ? 'block' : 'none';
            document.getElementById('query-mode').style.display = mode === 'query' ? 'block' : 'none';
            document.getElementById('record-stats').style.display = mode === 'record' ? 'block' : 'none';
            if (mode === 'scene') renderScene();
            if (mode === 'backpack') renderBackpack();
            if (mode === 'query') renderList();
            if (mode === 'record') renderRecordList();
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast ' + type + ' show';
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 初始化
        initSpeech();
        refreshAll();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && currentMode === 'record' && document.activeElement.tagName === 'INPUT') {
                addItem();
            }
        });
    </script>
