<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智序 - AI驱动的智能任务管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg-primary: #0f0f14;
      --bg-secondary: #1a1a24;
      --bg-card: #16161d;
      --text-primary: #ffffff;
      --text-secondary: #8b8b9e;
      --text-tertiary: #5a5a6e;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border-color: #2a2a3a;
      --input-bg: #1e1e2a;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glass-panel {
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    }

    .task-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      border-left: 4px solid var(--accent);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .task-card:hover {
      transform: translateX(4px);
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, transparent 100%);
    }

    .priority-high { border-left-color: #ef4444; }
    .priority-medium { border-left-color: #f59e0b; }
    .priority-low { border-left-color: #22c55e; }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item.active {
      background: var(--accent);
      color: white;
    }

    .nav-item:not(.active):hover {
      background: rgba(255,255,255,0.05);
    }

    .nav-item span {
      font-size: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: var(--input-bg);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: white;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .habit-cell {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--input-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .habit-cell.checked {
      background: var(--accent);
      color: white;
    }

    .habit-cell.today {
      border: 2px solid var(--accent);
    }

    .achievement-badge {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: all 0.3s ease;
    }

    .achievement-badge.locked {
      background: var(--input-bg);
      opacity: 0.5;
    }

    .achievement-badge.unlocked {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3);
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 4px 20px rgba(251, 191, 36, 0.3); }
      50% { box-shadow: 0 4px 30px rgba(251, 191, 36, 0.5); }
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-content {
      background: var(--bg-secondary);
      border-radius: 24px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border-color);
    }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .date-suggestion {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(99, 102, 241, 0.15);
      border-radius: 20px;
      font-size: 12px;
      color: var(--accent);
      margin-top: 8px;
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: linear-gradient(135deg, #ef4444 0%, #f97316 100%);
      border-radius: 12px;
      font-size: 11px;
      color: white;
      font-weight: 600;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .page-transition {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div class="min-h-screen pb-20">
    <header class="sticky top-0 z-40 bg-[var(--bg-primary)]/80 backdrop-blur-xl border-b border-[var(--border-color)]">
      <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center">
            <span class="text-white font-bold text-sm">智</span>
          </div>
          <h1 class="text-lg font-bold">智序</h1>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs px-2 py-1 bg-green-500/20 text-green-400 rounded-full">已登录</span>
        </div>
      </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6">
      <div id="today-view" class="page-transition">
        <div class="mb-6">
          <p class="text-[var(--text-secondary)] text-sm" id="current-date"></p>
          <h2 class="text-2xl font-bold mt-1">今日任务</h2>
          <p class="text-[var(--text-tertiary)] text-sm mt-1" id="greeting-text"></p>
        </div>

        <div class="glass-panel rounded-2xl p-4 mb-6">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-500/20 flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            </div>
            <div class="flex-1">
              <p class="text-xs text-[var(--text-tertiary)] mb-1">AI 智能分析</p>
              <p class="text-sm" id="ai-analysis"></p>
            </div>
          </div>
        </div>

        <div class="glass-panel rounded-2xl p-4 mb-6">
          <div class="flex gap-3">
            <input 
              type="text" 
              id="new-task-input"
              class="input-field flex-1" 
              placeholder="添加任务，支持自然语言日期..."
              oninput="handleTaskInput()"
            />
            <button class="btn-primary" onclick="addTask()">添加</button>
          </div>
          <div id="date-preview" class="date-suggestion" style="display: none;">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span id="date-text">检测到日期: 明天</span>
          </div>
        </div>

        <div class="flex gap-2 mb-4">
          <button class="tab-btn active" onclick="switchView('list')">📋 清单</button>
          <button class="tab-btn" onclick="switchView('kanban')">📊 看板</button>
        </div>

        <div id="list-view">
          <div id="task-list-container" class="space-y-3"></div>
        </div>

        <div id="kanban-view" style="display: none;">
          <div class="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
            <div class="flex-shrink-0 w-28">
              <p class="text-xs text-[var(--text-tertiary)] mb-2">待办</p>
              <div id="kanban-pending" class="space-y-2"></div>
            </div>
            <div class="flex-shrink-0 w-28">
              <p class="text-xs text-[var(--text-tertiary)] mb-2">进行中</p>
              <div id="kanban-progress" class="space-y-2"></div>
            </div>
            <div class="flex-shrink-0 w-28">
              <p class="text-xs text-[var(--text-tertiary)] mb-2">已完成</p>
              <div id="kanban-completed" class="space-y-2"></div>
            </div>
          </div>
        </div>

        <div class="glass-panel rounded-2xl p-4 mt-6 cursor-pointer" onclick="showAchievements()">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-sm">成就进度</h3>
            <span class="text-xs text-indigo-400">查看全部 →</span>
          </div>
          <div class="flex gap-4 overflow-x-auto hide-scrollbar pb-2">
            <div id="achievements-preview" class="flex gap-4"></div>
          </div>
        </div>
      </div>

      <div id="focus-view" style="display: none;" class="fixed inset-0 bg-[var(--bg-primary)] z-50 flex flex-col p-6 page-transition">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h2 class="text-xl font-bold">深度专注</h2>
            <p class="text-xs text-[var(--text-secondary)]">专注训练</p>
          </div>
          <button class="w-10 h-10 rounded-full bg-[var(--input-bg)] flex items-center justify-center hover:bg-[var(--border-color)] transition-colors" onclick="closeFocus()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center">
          <div class="relative w-48 h-48 mb-6">
            <svg class="w-full h-full" viewBox="0 0 200 200">
              <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
              <circle 
                cx="100" cy="100" r="90" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round"
                stroke-dasharray="565.48"
                stroke-dashoffset="0"
                transform="rotate(-90 100 100)"
                class="transition-all duration-1000"
                id="focus-progress"
              />
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span class="text-4xl font-bold" id="focus-time">25:00</span>
              <span class="text-xs text-[var(--text-secondary)] mt-1">剩余时间</span>
            </div>
          </div>

          <div class="flex items-center gap-4 mb-6">
            <button 
              class="w-14 h-14 rounded-full bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/40 hover:scale-105 transition-transform"
              onclick="toggleFocus()"
              id="focus-toggle"
            >
              <svg id="focus-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <button 
              class="w-12 h-12 rounded-full bg-[var(--input-bg)] flex items-center justify-center text-[var(--text-secondary)] hover:bg-[var(--border-color)] transition-colors"
              onclick="skipFocus()"
            >
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
            </button>
          </div>

          <div class="flex gap-2 mb-6">
            <button 
              class="px-4 py-2 rounded-xl text-sm font-medium bg-[var(--input-bg)] text-[var(--text-secondary)] hover:bg-[var(--border-color)] transition-colors"
              onclick="setFocusDuration(15)"
            >15分</button>
            <button 
              class="px-4 py-2 rounded-xl text-sm font-medium bg-indigo-600 text-white shadow-lg shadow-indigo-500/30"
              onclick="setFocusDuration(25)"
            >25分</button>
            <button 
              class="px-4 py-2 rounded-xl text-sm font-medium bg-[var(--input-bg)] text-[var(--text-secondary)] hover:bg-[var(--border-color)] transition-colors"
              onclick="setFocusDuration(45)"
            >45分</button>
          </div>
        </div>

        <div class="bg-[var(--bg-card)] rounded-2xl p-4">
          <div class="flex items-center gap-2 mb-3">
            <svg class="w-4 h-4 text-[var(--text-secondary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
            <span class="text-sm font-medium">白噪音</span>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <button class="p-3 rounded-xl bg-[var(--input-bg)] hover:bg-[var(--border-color)] transition-colors" onclick="setNoise('rain')">
              <span class="text-2xl">🌧️</span>
              <p class="text-xs mt-1">雨声</p>
            </button>
            <button class="p-3 rounded-xl bg-[var(--input-bg)] hover:bg-[var(--border-color)] transition-colors" onclick="setNoise('cafe')">
              <span class="text-2xl">☕</span>
              <p class="text-xs mt-1">咖啡厅</p>
            </button>
            <button class="p-3 rounded-xl bg-[var(--input-bg)] hover:bg-[var(--border-color)] transition-colors" onclick="setNoise('forest')">
              <span class="text-2xl">🌲</span>
              <p class="text-xs mt-1">森林</p>
            </button>
            <button class="p-3 rounded-xl bg-[var(--input-bg)] hover:bg-[var(--border-color)] transition-colors" onclick="setNoise('waves')">
              <span class="text-2xl">🌊</span>
              <p class="text-xs mt-1">海浪</p>
            </button>
            <button class="p-3 rounded-xl bg-[var(--input-bg)] hover:bg-[var(--border-color)] transition-colors" onclick="setNoise('fire')">
              <span class="text-2xl">🔥</span>
              <p class="text-xs mt-1">篝火</p>
            </button>
            <button class="p-3 rounded-xl bg-[var(--input-bg)] hover:bg-[var(--border-color)] transition-colors" onclick="setNoise('library')">
              <span class="text-2xl">📚</span>
              <p class="text-xs mt-1">图书馆</p>
            </button>
          </div>
          <div class="flex items-center gap-3 mt-3">
            <button class="w-8 h-8 rounded-full bg-[var(--input-bg)] flex items-center justify-center">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/></svg>
            </button>
            <input type="range" min="0" max="100" value="50" class="flex-1 h-1 bg-[var(--input-bg)] rounded-full appearance-none cursor-pointer">
            <span class="text-xs text-[var(--text-tertiary)]">50%</span>
          </div>
        </div>
      </div>

      <div id="habits-view" style="display: none;" class="page-transition">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-xl font-bold">习惯养成</h2>
          <button class="btn-primary text-sm" onclick="showAddHabit()">+ 添加习惯</button>
        </div>

        <div id="habits-container" class="space-y-4"></div>
      </div>

      <div id="stats-view" style="display: none;" class="page-transition">
        <h2 class="text-xl font-bold mb-6">数据统计</h2>

        <div class="grid grid-cols-2 gap-3 mb-6">
          <div class="stat-card">
            <div class="stat-value" id="stat-total">128</div>
            <div class="stat-label">总任务数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-completed">112</div>
            <div class="stat-label">已完成</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-streak">14</div>
            <div class="stat-label">连续天数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-focus">42h</div>
            <div class="stat-label">专注时长</div>
          </div>
        </div>

        <div class="glass-panel rounded-2xl p-4 mb-6">
          <h3 class="font-semibold text-sm mb-4">本周完成趋势</h3>
          <div class="flex items-end justify-between gap-2 h-32">
            <div class="flex-1 flex flex-col items-center gap-2">
              <div class="w-full bg-[var(--input-bg)] rounded-t-lg flex flex-col justify-end" style="height: 60%;">
                <div class="w-full bg-gradient-to-t from-indigo-500 to-purple-500 rounded-t-lg" style="height: 80%;"></div>
              </div>
              <span class="text-xs text-[var(--text-tertiary)]">周一</span>
            </div>
            <div class="flex-1 flex flex-col items-center gap-2">
              <div class="w-full bg-[var(--input-bg)] rounded-t-lg flex flex-col justify-end" style="height: 80%;">
                <div class="w-full bg-gradient-to-t from-indigo-500 to-purple-500 rounded-t-lg" style="height: 70%;"></div>
              </div>
              <span class="text-xs text-[var(--text-tertiary)]">周二</span>
            </div>
            <div class="flex-1 flex flex-col items-center gap-2">
              <div class="w-full bg-[var(--input-bg)] rounded-t-lg flex flex-col justify-end" style="height: 100%;">
                <div class="w-full bg-gradient-to-t from-indigo-500 to-purple-500 rounded-t-lg" style="height: 100%;"></div>
              </div>
              <span class="text-xs text-[var(--text-tertiary)]">周三</span>
            </div>
            <div class="flex-1 flex flex-col items-center gap-2">
              <div class="w-full bg-[var(--input-bg)] rounded-t-lg flex flex-col justify-end" style="height: 50%;">
                <div class="w-full bg-gradient-to-t from-indigo-500 to-purple-500 rounded-t-lg" style="height: 60%;"></div>
              </div>
              <span class="text-xs text-[var(--text-tertiary)]">周四</span>
            </div>
            <div class="flex-1 flex flex-col items-center gap-2">
              <div class="w-full bg-[var(--input-bg)] rounded-t-lg flex flex-col justify-end" style="height: 70%;">
                <div class="w-full bg-gradient-to-t from-indigo-500 to-purple-500 rounded-t-lg" style="height: 50%;"></div>
              </div>
              <span class="text-xs text-[var(--text-tertiary)]">周五</span>
            </div>
            <div class="flex-1 flex flex-col items-center gap-2">
              <div class="w-full bg-[var(--input-bg)] rounded-t-lg flex flex-col justify-end" style="height: 90%;">
                <div class="w-full bg-gradient-to-t from-indigo-500 to-purple-500 rounded-t-lg" style="height: 85%;"></div>
              </div>
              <span class="text-xs text-[var(--text-tertiary)]">周六</span>
            </div>
            <div class="flex-1 flex flex-col items-center gap-2">
              <div class="w-full bg-[var(--input-bg)] rounded-t-lg flex flex-col justify-end" style="height: 40%;">
                <div class="w-full bg-gradient-to-t from-indigo-500 to-purple-500 rounded-t-lg" style="height: 40%;"></div>
              </div>
              <span class="text-xs text-[var(--text-tertiary)]">周日</span>
            </div>
          </div>
        </div>

        <div class="glass-panel rounded-2xl p-4">
          <h3 class="font-semibold text-sm mb-4">成就徽章</h3>
          <div id="stats-achievements" class="flex flex-wrap gap-4"></div>
        </div>
      </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-[var(--bg-primary)]/95 backdrop-blur-xl border-t border-[var(--border-color)]">
      <div class="max-w-md mx-auto px-4 py-2 flex justify-around">
        <div class="nav-item active" onclick="switchNav('today')">

          <button class="flex-1 p-3 rounded-xl bg-[var(--input-bg)] hover:bg-[var(--border-color)] transition-colors" onclick="selectHabitIcon('🧘')">🧘</button>
          <button class="flex-1 p-3 rounded-xl bg-[var(--input-bg)] hover:bg-[var(--border-color)] transition-colors" onclick="selectHabitIcon('🎯')">🎯</button>

    <div id="achievements-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold">成就徽章</h3>
          <button class="w-8 h-8 rounded-full bg-[var(--input-bg)] flex items-center justify-center hover:bg-[var(--border-color)]" onclick="closeAchievements()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="achievements-list" class="grid grid-cols-2 gap-4"></div>
      </div>

  </div>

  <script>
    let tasks = [
      { id: 1, title: '完成项目报告', subtitle: '整理Q1数据和分析', duration: 45, priority: 'high', completed: false, kanbanStatus: 'pending', dueDate: '2026-06-20' },
      { id: 2, title: '团队会议', subtitle: '讨论下周工作计划', duration: 30, priority: 'medium', completed: false, kanbanStatus: 'pending', dueDate: '2026-06-19' },
      { id: 3, title: '学习Vue3', subtitle: 'Composition API进阶', duration: 60, priority: 'low', completed: false, kanbanStatus: 'progress', dueDate: '2026-06-21' },
      { id: 4, title: '回复邮件', subtitle: '客户咨询回复', duration: 15, priority: 'medium', completed: true, kanbanStatus: 'completed' },
      { id: 5, title: '健身锻炼', subtitle: '有氧运动30分钟', duration: 30, priority: 'low', completed: true, kanbanStatus: 'completed' },
    ]

    let habits = [
      { id: 1, name: '每日阅读', description: '每天阅读30分钟', icon: '📚', color: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', streak: 7, weekData: [true, true, true, true, true, true, false], todayIndex: new Date().getDay() },
      { id: 2, name: '早起运动', description: '每天早晨跑步', icon: '🏃', color: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', streak: 3, weekData: [false, true, true, true, false, true, false], todayIndex: new Date().getDay() },
      { id: 3, name: '冥想', description: '每天冥想10分钟', icon: '🧘', color: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', streak: 14, weekData: [true, true, true, true, true, true, false], todayIndex: new Date().getDay() },
    ]

    let achievements = [
      { id: 1, name: '初出茅庐', description: '完成第一个任务', icon: '🌟', unlocked: true },
      { id: 2, name: '坚持不懈', description: '连续打卡7天', icon: '🔥', unlocked: true },
      { id: 3, name: '专注达人', description: '累计专注100小时', icon: '🎯', unlocked: true },
      { id: 4, name: '全能选手', description: '完成所有类型任务', icon: '🏆', unlocked: false },
      { id: 5, name: '月度冠军', description: '月完成任务最多', icon: '👑', unlocked: false },
      { id: 6, name: '早起鸟儿', description: '连续30天早起', icon: '🌅', unlocked: false },
    ]

    let stats = {
      totalTasks: 128,
      completedTasks: 112,
      streak: 14,
      focusTime: 42
    }

    let selectedHabitIcon = '📚'
    let focusDuration = 25
    let focusTime = 25 * 60
    let focusInterval = null
    let isFocusRunning = false

    function init() {
      document.getElementById('current-date').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })
      
      const hour = new Date().getHours()
      let greeting = '晚上好'
      if (hour < 6) greeting = '夜深了'
      else if (hour < 12) greeting = '早上好'
      else if (hour < 14) greeting = '中午好'
      else if (hour < 18) greeting = '下午好'
      
      const incompleteCount = tasks.filter(t => !t.completed).length
      document.getElementById('greeting-text').textContent = `${greeting}，今天有 ${incompleteCount} 项任务待完成`
      
      document.getElementById('ai-analysis').textContent = '根据您的习惯，建议您先完成高优先级任务，然后进行专注学习。今天的任务量适中，加油！'
      
      renderTasks()
      renderHabits()
      renderAchievementsPreview()
      renderStatsAchievements()
    }

    function parseDate(text) {
      const patterns = [
        { regex: /明天|明日/, days: 1 },
        { regex: /后天/, days: 2 },
        { regex: /大后天/, days: 3 },
        { regex: /下周/, days: 7 },
        { regex: /下周一/, days: ((8 - new Date().getDay()) % 7) || 7 },
        { regex: /下周二/, days: ((9 - new Date().getDay()) % 7) || 7 },
        { regex: /下周三/, days: ((10 - new Date().getDay()) % 7) || 7 },
        { regex: /下周四/, days: ((11 - new Date().getDay()) % 7) || 7 },
        { regex: /下周五/, days: ((12 - new Date().getDay()) % 7) || 7 },
        { regex: /下周六/, days: ((13 - new Date().getDay()) % 7) || 7 },
        { regex: /下周日/, days: ((14 - new Date().getDay()) % 7) || 7 },
      ]

      for (const { regex, days } of patterns) {
        if (regex.test(text)) {
          const date = new Date()
          date.setDate(date.getDate() + days)
          return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' })
        }
      }
      return null
    }

    function handleTaskInput() {
      const input = document.getElementById('new-task-input').value
      const preview = document.getElementById('date-preview')
      const dateText = document.getElementById('date-text')
      
      const parsedDate = parseDate(input)
      if (parsedDate) {
        preview.style.display = 'flex'
        dateText.textContent = `检测到日期: ${parsedDate}`
      } else {
        preview.style.display = 'none'
      }
    }

    function addTask() {
      const input = document.getElementById('new-task-input')
      const title = input.value.trim()
      
      if (!title) return

      const newTask = {
        id: Date.now(),
        title,
        subtitle: '',
        duration: 25,
        priority: 'medium',
        completed: false,
        kanbanStatus: 'pending',
        dueDate: null
      }

      tasks.unshift(newTask)
      input.value = ''
      document.getElementById('date-preview').style.display = 'none'
      renderTasks()
    }

    function toggleTask(id) {
      const task = tasks.find(t => t.id === id)
      if (task) {
        task.completed = !task.completed
        task.kanbanStatus = task.completed ? 'completed' : 'pending'
        renderTasks()
      }
    }

    function renderTasks() {
      const incomplete = tasks.filter(t => !t.completed)
      const completed = tasks.filter(t => t.completed)
      const pending = tasks.filter(t => t.kanbanStatus === 'pending' && !t.completed)
      const progress = tasks.filter(t => t.kanbanStatus === 'progress')
      const kanbanCompleted = tasks.filter(t => t.completed || t.kanbanStatus === 'completed')

      const container = document.getElementById('task-list-container')
      
      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12">
            <svg class="w-16 h-16 mx-auto text-[var(--text-tertiary)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <p class="text-[var(--text-secondary)] mt-4">还没有任务</p>
            <p class="text-[var(--text-tertiary)] text-sm mt-1">添加一个任务开始你的一天吧</p>
          </div>
        `
      } else {
        container.innerHTML = `
          ${incomplete.map(task => `
            <div class="task-card priority-${task.priority}" onclick="toggleTask(${task.id})">
              <div class="flex items-start gap-3">
                <div class="checkbox ${task.completed ? 'checked' : ''}">
                  ${task.completed ? '<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
                </div>
                <div class="flex-1">
                  <p ${task.completed ? 'class="line-through text-[var(--text-tertiary)]"' : ''}>${task.title}</p>
                  <p class="text-xs text-[var(--text-tertiary)] mt-1">${task.subtitle}</p>
                </div>
                <div class="text-right">
                  <p class="text-xs text-[var(--text-secondary)]">${task.duration}分钟</p>
                </div>
              </div>
            </div>
          `).join('')}
          ${completed.length > 0 ? `
            <div class="pt-4 border-t border-[var(--border-color)]">
              <p class="text-xs text-[var(--text-tertiary)] mb-3">已完成 (${completed.length})</p>
              ${completed.map(task => `
                <div class="task-card opacity-50" onclick="toggleTask(${task.id})">
                  <div class="flex items-start gap-3">
                    <div class="checkbox checked">
                      <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
                    </div>
                    <div class="flex-1">
                      <p class="line-through text-[var(--text-tertiary)]">${task.title}</p>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        `
      }

      document.getElementById('kanban-pending').innerHTML = pending.map(task => `
        <div class="bg-[var(--bg-card)] rounded-xl p-3 cursor-pointer hover:bg-[var(--input-bg)] transition-colors" draggable="true">
          <p class="text-sm truncate">${task.title}</p>
          <div class="flex items-center gap-1 mt-2">
            <span class="text-xs text-[var(--text-tertiary)]">${task.duration}分钟</span>
          </div>
        </div>
      `).join('')

      document.getElementById('kanban-progress').innerHTML = progress.map(task => `
        <div class="bg-[var(--bg-card)] rounded-xl p-3 cursor-pointer hover:bg-[var(--input-bg)] transition-colors" draggable="true">
          <p class="text-sm truncate">${task.title}</p>
          <div class="flex items-center gap-1 mt-2">
            <span class="text-xs text-[var(--text-tertiary)]">${task.duration}分钟</span>
          </div>
        </div>
      `).join('')

      document.getElementById('kanban-completed').innerHTML = kanbanCompleted.map(task => `
        <div class="bg-[var(--bg-card)] rounded-xl p-3 opacity-50 cursor-pointer hover:opacity-70 transition-opacity">
          <p class="text-sm truncate line-through">${task.title}</p>
        </div>
      `).join('')
    }

    function switchView(view) {
      document.getElementById('list-view').style.display = view === 'list' ? 'block' : 'none'
      document.getElementById('kanban-view').style.display = view === 'kanban' ? 'block' : 'none'
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'))
      event.target.classList.add('active')
    }

    function switchNav(nav) {
      document.getElementById('today-view').style.display = nav === 'today' ? 'block' : 'none'
      document.getElementById('focus-view').style.display = nav === 'focus' ? 'block' : 'none'
      document.getElementById('habits-view').style.display = nav === 'habits' ? 'block' : 'none'
      document.getElementById('stats-view').style.display = nav === 'stats' ? 'block' : 'none'

      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'))
      event.target.classList.add('active')
    }

    function setFocusDuration(minutes) {
      if (isFocusRunning) return
      focusDuration = minutes
      focusTime = minutes * 60
      updateFocusDisplay()
    }

    function updateFocusDisplay() {
      const minutes = Math.floor(focusTime / 60)
      const seconds = focusTime % 60
      document.getElementById('focus-time').textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
      
      const circumference = 2 * Math.PI * 90
      const progress = focusTime / (focusDuration * 60)
      const offset = circumference * (1 - progress)
      document.getElementById('focus-progress').setAttribute('stroke-dashoffset', offset)
    }

    function toggleFocus() {
      isFocusRunning = !isFocusRunning
      const icon = document.getElementById('focus-icon')
      
      if (isFocusRunning) {
        icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        focusInterval = setInterval(() => {
          focusTime--
          if (focusTime <= 0) {
            clearInterval(focusInterval)
            isFocusRunning = false
            icon.innerHTML = '<path d="M8 5v14l11-7z"/>'
            alert('专注完成！休息一下吧')
            closeFocus()
          }
          updateFocusDisplay()
        }, 1000)
      } else {
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>'
        clearInterval(focusInterval)
      }
    }

    function skipFocus() {
      if (confirm('跳过当前专注时段？')) {
        clearInterval(focusInterval)
        isFocusRunning = false
        document.getElementById('focus-icon').innerHTML = '<path d="M8 5v14l11-7z"/>'
        closeFocus()
      }
    }

    function closeFocus() {
      switchNav('today')
      focusTime = focusDuration * 60
      updateFocusDisplay()
      clearInterval(focusInterval)
      isFocusRunning = false
      document.getElementById('focus-icon').innerHTML = '<path d="M8 5v14l11-7z"/>'
    }

    function setNoise(type) {
      const noises = { rain: '🌧️', cafe: '☕', forest: '🌲', waves: '🌊', fire: '🔥', library: '📚' }
      const names = { rain: '雨声', cafe: '咖啡厅', forest: '森林', waves: '海浪', fire: '篝火', library: '图书馆' }
      alert(`已选择 ${noises[type]} ${names[type]} 音效`)
    }

    function renderHabits() {
      const container = document.getElementById('habits-container')
      
      container.innerHTML = habits.map(habit => `
        <div class="glass-panel rounded-2xl p-4">
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background: ${habit.color}">
                <span class="text-xl">${habit.icon}</span>
              </div>
              <div>
                <h3 class="font-semibold">${habit.name}</h3>
                <p class="text-xs text-[var(--text-tertiary)]">${habit.description}</p>
              </div>
            </div>
            <div class="streak-badge">🔥 ${habit.streak}天</div>
          </div>
          <div class="flex gap-1">
            ${habit.weekData.map((checked, index) => `
              <div class="flex flex-col items-center">
                <span class="text-xs text-[var(--text-tertiary)] mb-1">${['一','二','三','四','五','六','日'][index]}</span>
                <div class="habit-cell ${checked ? 'checked' : ''} ${index === habit.todayIndex ? 'today' : ''}" onclick="checkHabit(${habit.id}, ${index})">
                  ${checked ? '✓' : ''}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')
    }

    function checkHabit(habitId, dayIndex) {
      const habit = habits.find(h => h.id === habitId)
      if (habit) {
        habit.weekData[dayIndex] = !habit.weekData[dayIndex]
        if (habit.weekData[dayIndex]) {
          habit.streak++
        }
        renderHabits()
      }
    }

    function showAddHabit() {
      document.getElementById('add-habit-modal').style.display = 'flex'
    }

    function closeAddHabit() {
      document.getElementById('add-habit-modal').style.display = 'none'
      document.getElementById('habit-name').value = ''
      document.getElementById('habit-desc').value = ''
      selectedHabitIcon = '📚'
    }

    function selectHabitIcon(icon) {
      selectedHabitIcon = icon
    }

    function createHabit() {
      const name = document.getElementById('habit-name').value.trim()
      const desc = document.getElementById('habit-desc').value.trim()
      
      if (!name) return

      const colors = [
        'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
        'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
        'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
        'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
        'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
      ]

      const newHabit = {
        id: Date.now(),
        name,
        description: desc,
        icon: selectedHabitIcon,
        color: colors[Math.floor(Math.random() * colors.length)],
        streak: 0,
        weekData: [false, false, false, false, false, false, false],
        todayIndex: new Date().getDay()
      }

      habits.push(newHabit)
      closeAddHabit()
      renderHabits()
    }

    function renderAchievementsPreview() {
      const container = document.getElementById('achievements-preview')
      container.innerHTML = achievements.slice(0, 4).map(achievement => `
        <div class="flex-shrink-0 w-16 text-center ${achievement.unlocked ? '' : 'opacity-50'}">
          <div class="achievement-badge ${achievement.unlocked ? 'unlocked' : 'locked'}">
            ${achievement.icon}
          </div>
          <p class="text-xs mt-2 ${achievement.unlocked ? '' : 'text-[var(--text-tertiary)]'}">${achievement.name}</p>
        </div>
      `).join('')
    }

    function renderStatsAchievements() {
      const container = document.getElementById('stats-achievements')
      container.innerHTML = achievements.map(achievement => `
        <div class="flex items-center gap-3">
          <div class="achievement-badge ${achievement.unlocked ? 'unlocked' : 'locked'}">
            ${achievement.icon}
          </div>
          <div>
            <p class="text-sm ${achievement.unlocked ? '' : 'text-[var(--text-tertiary)]'}">${achievement.name}</p>
            <p class="text-xs text-[var(--text-tertiary)]">${achievement.description}</p>
          </div>
        </div>
      `).join('')
    }

    function showAchievements() {
      const container = document.getElementById('achievements-list')
      container.innerHTML = achievements.map(achievement => `
        <div class="text-center p-4 rounded-xl ${achievement.unlocked ? 'bg-indigo-500/10' : 'bg-[var(--input-bg)]'}">
          <div class="achievement-badge mx-auto mb-2 ${achievement.unlocked ? 'unlocked' : 'locked'}">
            ${achievement.icon}
          </div>
          <p class="text-sm font-medium ${achievement.unlocked ? '' : 'text-[var(--text-tertiary)]'}">${achievement.name}</p>
          <p class="text-xs text-[var(--text-tertiary)] mt-1">${achievement.description}</p>
        </div>
      `).join('')
      document.getElementById('achievements-modal').style.display = 'flex'
    }

    function closeAchievements() {
      document.getElementById('achievements-modal').style.display = 'none'
    }

    window.addEventListener('DOMContentLoaded', init)
