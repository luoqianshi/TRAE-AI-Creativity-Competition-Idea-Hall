<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>洗发水说明书</title>
    <style>
        :root {
            --bg-primary: #f9f9fb;
            --bg-card: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent: #a0e7e5;
            --accent-light: #e6fcfb;
            --border: #e5e7eb;
            --success: #10b981;
            --warn: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.05);
            --radius-lg: 12px;
            --radius-md: 8px;
            --transition: all 0.2s ease;
        }

        .dark-mode {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #34d399;
            --accent-light: #0f766e;
            --border: #334155;
            --success: #4ade80;
            --warn: #f97316;
            --danger: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 16px;
            transition: var(--transition);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 12px;
        }

        h1 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #0d9488, #0f766e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            z-index: 100;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title svg {
            width: 20px;
            height: 20px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input, select, button {
            font-size: 1rem;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            transition: var(--transition);
        }

        input:focus, select:focus, button:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(160, 231, 229, 0.2);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        button:hover:not(:disabled) {
            background: #8ad6d1;
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-box {
            padding: 16px;
            border-radius: var(--radius-md);
            margin-top: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            min-height: 80px;
            display: flex;
            align-items: center;
        }

        .result-box.loading {
            opacity: 0.7;
        }

        .result-box.success {
            background-color: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success);
        }

        .result-box.warn {
            background-color: rgba(245, 158, 11, 0.1);
            border-left: 4px solid var(--warn);
        }

        .result-box.danger {
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 4px solid var(--danger);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--accent-light);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .checkbox-item:hover:not(.active) {
            background: #94e0d8;
        }

        .checkbox-item.active {
            background: var(--accent);
            color: white;
        }

        .checkbox-item input {
            display: none;
        }

        .footer-note {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }

            h1 {
                font-size: 1.5rem;
            }

            .card {
                padding: 18px;
            }

            .checkbox-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">☀️</button>

    <div class="container">
        <header>
            <h1>洗发水说明书</h1>
            <p class="subtitle">拍一拍成分表，3秒读懂它对你头发意味着什么</p>
        </header>

        <!-- 成分查询区 -->
        <section class="card">
            <h2 class="card-title">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/></svg>
                查成分 · 看影响
            </h2>
            <p>输入成分名称（如 SLS、泛醇、吡啶硫酮锌），立刻获取通俗解读：</p>
            <div class="input-group">
                <input type="text" id="ingredientInput" placeholder="例：月桂醇聚醚硫酸酯钠" maxlength="32" />
                <button id="checkBtn">查一查</button>
            </div>
            <div id="resultBox" class="result-box loading">
                输入成分名，点击「查一查」获取专业又易懂的解读
            </div>
        </section>

        <!-- 发质画像区 -->
        <section class="card">
            <h2 class="card-title">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/></svg>
                告诉我你的发质状态
            </h2>
            <p>勾选最符合你当前情况的1–3项（可多选）：</p>
            <div class="checkbox-grid">
                <label class="checkbox-item">
                    <input type="checkbox" value="oil" />
                    油头扁塌
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="dry" />
                    干枯分叉
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="dandruff" />
                    头皮屑多
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="damaged" />
                    染烫受损
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="hairloss" />
                    产后/压力掉发
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" value="sensitive" />
                    头皮刺痒敏感
                </label>
            </div>
            <button id="generateBtn" style="margin-top:16px;width:100%;">生成适配建议</button>
            <div id="adviceBox" class="result-box loading" style="margin-top:12px;">
                勾选发质后点击「生成适配建议」，获得个性化提醒
            </div>
        </section>

        <p class="footer-note">
            本工具基于公开成分知识库模拟演示，不替代专业医疗建议。<br>
            实际使用请以产品实物成分表及自身感受为准。
        </p>
    </div>

    <script>
        // 主题切换
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        if (localStorage.getItem('darkMode') === 'true') {
            body.classList.add('dark-mode');
            themeToggle.innerHTML = '🌙';
        }

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDark = body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            themeToggle.innerHTML = isDark ? '☀️' : '🌙';
        });

        // 成分知识库（精简32条高频成分，每条含类型、影响、建议）
        const ingredientDB = {
            "SLS": {
                type: "强清洁表活",
                impact: "清洁力强，但可能过度脱脂，导致干性/敏感头皮更紧绷、发丝毛躁",
                risk: "danger",
                advice: "若头皮敏感或干枯，建议换用氨基酸/甜菜碱类温和表活"
            },
            "月桂醇聚醚硫酸酯钠": {
                type: "强清洁表活",
                impact: "同SLS，刺激性略低但仍需谨慎用于敏感头皮",
                risk: "warn",
                advice: "油头可用，干性/受损发质建议控制使用频率"
            },
            "硅油": {
                type: "柔顺剂",
                impact: "在头发表面成膜，增加顺滑感，但可能堆积、压塌细软发根",
                risk: "warn",
                advice: "油头/细软发慎用；干枯发可短期改善毛躁，建议定期用清洁型洗发水"
            },
            "泛醇": {
                type: "维生素B5衍生物",
                impact: "保湿修护，增强发丝韧性，缓解干枯分叉",
                risk: "success",
                advice: "干枯、染烫受损发质友好成分，安心使用"
            },
            "吡啶硫酮锌": {
                type: "抗屑活性成分",
                impact: "抑制马拉色菌，改善头皮屑和脂溢性皮炎",
                risk: "success",
                advice: "头皮屑多者优选，但健康头皮无需长期使用"
            },
            "咖啡因": {
                type: "植物活性物",
                impact: "促进头皮微循环，可能减缓压力性掉发",
                risk: "success",
                advice: "产后/压力掉发人群可尝试，无刺激性"
            },
            "薄荷醇": {
                type: "清凉剂",
                impact: "带来清爽感，但冬季可能加剧干性头皮紧绷感",
                risk: "warn",
                advice: "夏天油头适用；干性/敏感头皮冬季慎用"
            },
            "氨基酸表活": {
                type: "温和清洁剂",
                impact: "清洁力适中，pH接近头皮，减少刺激与脱脂",
                risk: "success",
                advice: "所有发质均友好，尤其推荐敏感头皮与染烫发"
            },
            "无硅油": {
                type: "配方宣称",
                impact: "不添加硅油，避免堆积，适合油头/细软发，但干枯发可能缺乏顺滑感",
                risk: "warn",
                advice: "油头首选；干枯发建议搭配护发素或免洗护理"
            },
            "烟酰胺": {
                type: "维生素B3衍生物",
                impact: "调节皮脂分泌，改善头皮微生态，缓解油头与屑多",
                risk: "success",
                advice: "油头+头皮屑人群优选成分"
            }
        };

        // 发质匹配逻辑（简化版）
        const hairTypeAdvice = {
            oil: {
                "硅油": "可能压塌发根，建议控制使用频率或选择‘无硅油’款",
                "SLS": "清洁力足够，但若伴随头皮痒，建议换温和表活",
                "烟酰胺": "调节油脂分泌，非常适合油头+屑多组合"
            },
            dry: {
                "泛醇": "强力保湿修护，显著改善干枯毛躁",
                "硅油": "短期改善顺滑，但长期需配合清洁防堆积",
                "氨基酸表活": "温和不脱脂，保护发丝天然油脂"
            },
            dandruff: {
                "吡啶硫酮锌": "一线抗屑成分，坚持使用可见效",
                "烟酰胺": "辅助调节微生态，减少屑源",
                "薄荷醇": "清爽舒缓，但勿用于破损头皮"
            },
            damaged: {
                "泛醇": "修复发丝内部结构，提升韧性",
                "氨基酸表活": "避免二次损伤，洗后不易打结",
                "无硅油": "减少负担，让修护成分更好渗透"
            },
            hairloss: {
                "咖啡因": "促进头皮循环，辅助减缓掉发",
                "烟酰胺": "改善头皮环境，支持毛囊健康",
                "吡啶硫酮锌": "若伴脂溢性皮炎，可同步控屑"
            },
            sensitive: {
                "氨基酸表活": "低刺激，维持头皮屏障",
                "泛醇": "舒缓镇静，缓解刺痒",
                "SLS": "避免使用，可能引发红肿刺痛"
            }
        };

        // DOM元素
        const ingredientInput = document.getElementById('ingredientInput');
        const checkBtn = document.getElementById('checkBtn');
        const resultBox = document.getElementById('resultBox');
        const generateBtn = document.getElementById('generateBtn');
        const adviceBox = document.getElementById('adviceBox');
        const checkboxes = document.querySelectorAll('.checkbox-item input');

        // 成分查询功能
        function checkIngredient() {
            const val = ingredientInput.value.trim();
            if (!val) return;

            const lowerVal = val.toLowerCase();
            let match = null;

            // 精确匹配（忽略大小写）
            for (const [key, data] of Object.entries(ingredientDB)) {
                if (key.toLowerCase() === lowerVal || 
                    data.type.toLowerCase().includes(lowerVal) ||
                    key.toLowerCase().includes(lowerVal)) {
                    match = { name: key, ...data };
                    break;
                }
            }

            if (match) {
                resultBox.className = `result-box ${match.risk}`;
                resultBox.innerHTML = `
                    <strong>${match.name}</strong>（${match.type}）<br>
                    <span style="margin-top:4px;display:block;">→ ${match.impact}</span><br>
                    <strong style="color:var(--${match.risk});">💡建议：</strong> ${match.advice}
                `;
            } else {
                resultBox.className = 'result-box warn';
                resultBox.innerHTML = `⚠️ 未收录该成分。常见成分如：SLS、硅油、泛醇、吡啶硫酮锌、咖啡因等`;
            }
        }

        // 发质+成分联动建议
        function generateAdvice() {
            const selected = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);

            if (selected.length === 0) {
                adviceBox.className = 'result-box warn';
                adviceBox.innerHTML = '请至少勾选一项发质状态';
                return;
            }

            const inputVal = ingredientInput.value.trim().toLowerCase();
            if (!inputVal) {
                adviceBox.className = 'result-box warn';
                adviceBox.innerHTML = '请先在上方输入一个成分名';
                return;
            }

            // 查找匹配的发质建议
            let advice = '';
            for (const type of selected) {
                if (hairTypeAdvice[type] && hairTypeAdvice[type][inputVal]) {
                    advice = hairTypeAdvice[type][inputVal];
                    break;
                }
            }

            if (advice) {
                adviceBox.className = 'result-box success';
                adviceBox.innerHTML = `<strong>✅ 针对你的发质：</strong><br>${advice}`;
            } else {
                adviceBox.className = 'result-box warn';
                adviceBox.innerHTML = `🔍 当前成分与所选发质无强关联建议<br>可尝试其他成分（如：泛醇、烟酰胺、氨基酸表活）`;
            }
        }

        // 事件绑定
        checkBtn.addEventListener('click', checkIngredient);
        ingredientInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') checkIngredient();
        });
        generateBtn.addEventListener('click', generateAdvice);

        // 初始化：聚焦输入框
        ingredientInput.focus();
    </script>
</body>
</html>
