<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生掷骰子 - Life Dice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #eee; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: #ffd700; margin: 20px 0; font-size: 2rem; }
        .stats { display: flex; justify-content: space-around; margin: 20px 0; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; color: #ffd700; }
        .stat-label { font-size: 0.8rem; color: #aaa; }
        .scene { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 25px; margin: 20px 0; }
        .age { font-size: 1.2rem; color: #ffd700; margin-bottom: 10px; }
        .event-title { font-size: 1.3rem; margin-bottom: 15px; color: #fff; }
        .choices { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .choice { padding: 12px 20px; background: rgba(255,215,0,0.2); border: 1px solid #ffd700; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .choice:hover { background: rgba(255,215,0,0.4); }
        .choice.selected { background: #ffd700; color: #1a1a2e; }
        .methods { display: none; margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; }
        .methods.show { display: block; }
        .method { padding: 10px 15px; margin: 8px 0; border-radius: 6px; cursor: pointer; border: 1px solid #666; transition: all 0.3s; }
        .method:hover { border-color: #ffd700; }
        .method.easy { background: rgba(76,175,80,0.3); }
        .method.medium { background: rgba(255,152,0,0.3); }
        .method.hard { background: rgba(244,67,54,0.3); }
        .method h4 { margin-bottom: 5px; }
        .method p { font-size: 0.85rem; color: #bbb; }
        .method .rate { color: #ffd700; font-weight: bold; }
        .execute-btn { display: none; margin-top: 20px; padding: 15px 30px; background: #ffd700; color: #1a1a2e; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; width: 100%; }
        .execute-btn.show { display: block; }
        .result { margin-top: 20px; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 10px; text-align: center; display: none; }
        .result.show { display: block; }
        .result-text { font-size: 1.1rem; margin-bottom: 10px; }
        .success { color: #4caf50; }
        .fail { color: #f44336; }
        .btn-next { margin-top: 15px; padding: 10px 25px; background: #ffd700; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; }
        .start-screen, .end-screen { text-align: center; padding: 50px 20px; }
        .start-btn { padding: 15px 40px; background: #ffd700; color: #1a1a2e; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; margin-top: 20px; }
        .life-path { font-size: 0.9rem; color: #888; margin-top: 10px; }
        .final-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .final-stat { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; }
        .restart-btn { padding: 12px 30px; background: #ffd700; color: #1a1a2e; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
    const app = document.getElementById('app');

    const events = [
        { age: 6, title: "上幼儿园", desc: "到了该上幼儿园的年纪了。", choices: [
            { text: "好好上学", direction: "学习", difficulty: 1 },
            { text: "开心就好", direction: "快乐", difficulty: 0 }
        ]},
        { age: 12, title: "小升初考试", desc: "人生第一次大考，决定你能否进入重点初中。", choices: [
            { text: "冲击重点初中", direction: "重点", difficulty: 2 },
            { text: "普通初中就行", direction: "普通", difficulty: 1 }
        ]},
        { age: 15, title: "选择高中", desc: "中考成绩优异，面临重点高中和普通高中的选择。", choices: [
            { text: "重点高中 - 高考考大学", direction: "大学", difficulty: 2 },
            { text: "艺术高中 - 学习音乐", direction: "艺术", difficulty: 2 }
        ]},
        { age: 18, title: "高考", desc: "人生第二次大考，将决定你的大学和未来方向。", choices: [
            { text: "冲击清华北大", direction: "名校", difficulty: 3 },
            { text: "普通一本大学", direction: "普通", difficulty: 1 }
        ]},
        { age: 22, title: "毕业求职", desc: "大学毕业，面临人生第一次重大职业选择。", choices: [
            { text: "进入大公司", direction: "稳定", difficulty: 2 },
            { text: "创业", direction: "冒险", difficulty: 3 }
        ]},
        { age: 28, title: "职业抉择", desc: "工作几年后，有机会晋升管理层或跳槽到更好的公司。", choices: [
            { text: "晋升管理层", direction: "管理", difficulty: 2 },
            { text: "跳槽创业公司", direction: "创业", difficulty: 3 }
        ]},
        { age: 35, title: "人生大事", desc: "到了人生的重要阶段，面临结婚买房的选择。", choices: [
            { text: "结婚买房安稳生活", direction: "安稳", difficulty: 1 },
            { text: "继续拼搏事业", direction: "事业", difficulty: 2 }
        ]},
        { age: 45, title: "中年危机", desc: "事业遇到瓶颈，是选择突破还是维持现状？", choices: [
            { text: "突破转型", direction: "突破", difficulty: 3 },
            { text: "维持现状", direction: "平稳", difficulty: 1 }
        ]},
        { age: 60, title: "退休生活", desc: "正式退休，开始人生新的阶段。", choices: [
            { text: "环游世界", direction: "自由", difficulty: 2 },
            { text: "含饴弄孙", direction: "家庭", difficulty: 1 }
        ]}
    ];

    const methods = [
        { id: "coin", name: "投掷硬币", type: "easy", desc: "简单稳定", baseRate: 70, weight: 1 },
        { id: "bottle", name: "旋转瓶子", type: "medium", desc: "中等难度", baseRate: 50, weight: 2 },
        { id: "dice", name: "骰子连击", type: "hard", desc: "高风险高回报", baseRate: 30, weight: 3 },
        { id: "multi", name: "多道具组合", type: "hard", desc: "地狱难度", baseRate: 10, weight: 4 }
    ];

    let state = {
        phase: "start",
        age: 0,
        execution: 10,
        happiness: 50,
        career: 50,
        wisdom: 50,
        eventIndex: 0,
        lifeStory: [],
        selectedChoice: null,
        selectedMethod: null
    };

    function render() {
        if (state.phase === "start") renderStart();
        else if (state.phase === "play") renderPlay();
        else if (state.phase === "result") renderResult();
        else if (state.phase === "end") renderEnd();
    }

    function renderStart() {
        app.innerHTML = `
            <div class="start-screen">
                <h1>🎲 人生掷骰子</h1>
                <p style="color:#aaa;margin:20px 0;">在人生的十字路口，用投掷来改变命运</p>
                <p style="color:#888;font-size:0.9rem;">通过投掷硬币、瓶子、骰子等道具<br>用不同的方案影响你的人生选择</p>
                <button class="start-btn" onclick="startGame()">开始人生</button>
            </div>
        `;
    }

    function renderPlay() {
        const event = events[state.eventIndex];
        const choiceHtml = event.choices.map((c, i) => `
            <div class="choice ${state.selectedChoice === i ? 'selected' : ''}" onclick="selectChoice(${i})">
                ${c.text}
            </div>
        `).join('');

        const methodHtml = methods.map(m => {
            const successRate = Math.min(95, m.baseRate + (state.execution - 10) * 2);
            return `
            <div class="method ${m.type}" onclick="selectMethod('${m.id}')">
                <h4>${m.name} <span class="rate">${successRate}%</span></h4>
                <p>${m.desc} | 影响权重: ${m.weight}</p>
            </div>
        `}).join('');

        app.innerHTML = `
            <h1>🎲 人生掷骰子</h1>
            <div class="stats">
                <div class="stat"><div class="stat-value">${state.execution}</div><div class="stat-label">执行力</div></div>
                <div class="stat"><div class="stat-value">${state.happiness}</div><div class="stat-label">幸福</div></div>
                <div class="stat"><div class="stat-value">${state.career}</div><div class="stat-label">事业</div></div>
                <div class="stat"><div class="stat-value">${state.wisdom}</div><div class="stat-label">智慧</div></div>
            </div>
            <div class="life-path">人生轨迹: ${state.lifeStory.join(' → ') || '起点'}</div>
            <div class="scene">
                <div class="age">年龄: ${event.age}岁</div>
                <div class="event-title">${event.title}</div>
                <p>${event.desc}</p>
                <div class="choices">${choiceHtml}</div>
                <div class="methods ${state.selectedChoice !== null ? 'show' : ''}" id="methods">
                    <h3 style="margin-bottom:10px;">选择投掷方案:</h3>
                    ${methodHtml}
                </div>
                <button class="execute-btn ${state.selectedMethod !== null ? 'show' : ''}" onclick="executeChoice()">
                    执行投掷
                </button>
            </div>
        `;
    }

    function renderResult() {
        const event = events[state.eventIndex];
        const choice = event.choices[state.selectedChoice];
        const method = methods.find(m => m.id === state.selectedMethod);
        const successRate = Math.min(95, method.baseRate + (state.execution - 10) * 2);
        const roll = Math.random() * 100;
        const success = roll < successRate;

        let resultText, resultClass;
        if (success) {
            resultText = `🎉 投掷成功！你的${method.name}完美命中，${choice.text}！`;
            resultClass = "success";
            state.execution += method.weight;
            if (choice.direction === "学习" || choice.direction === "大学" || choice.direction === "名校") state.wisdom += method.weight * 2;
            if (choice.direction === "稳定" || choice.direction === "管理" || choice.direction === "事业") state.career += method.weight * 2;
            if (choice.direction === "快乐" || choice.direction === "自由" || choice.direction === "家庭") state.happiness += method.weight * 2;
        } else {
            resultText = `😢 投掷失败...${method.name}没能成功，${choice.text}的结果打了折扣。`;
            resultClass = "fail";
            state.happiness -= 5;
        }

        state.lifeStory.push(choice.text);

        app.innerHTML = `
            <h1>🎲 人生掷骰子</h1>
            <div class="result show">
                <div class="result-text ${resultClass}">${resultText}</div>
                <p>投掷结果: ${roll.toFixed(1)} / 成功率: ${successRate}%</p>
                <button class="btn-next" onclick="nextEvent()">继续人生</button>
            </div>
        `;
    }

    function renderEnd() {
        const avgScore = Math.round((state.happiness + state.career + state.wisdom) / 3);
        let lifeResult = avgScore >= 70 ? "人生赢家" : avgScore >= 50 ? "平凡充实" : avgScore >= 30 ? "命运多舛" : "历经磨难";

        app.innerHTML = `
            <div class="end-screen">
                <h1>🏁 人生终点</h1>
                <p style="font-size:1.3rem;margin:20px 0;">${lifeResult}</p>
                <div class="life-path">${state.lifeStory.join(' → ')}</div>
                <div class="final-stats">
                    <div class="final-stat"><div class="stat-value">${state.execution}</div><div class="stat-label">最终执行力</div></div>
                    <div class="final-stat"><div class="stat-value">${state.happiness}</div><div class="stat-label">幸福值</div></div>
                    <div class="final-stat"><div class="stat-value">${state.career}</div><div class="stat-label">事业值</div></div>
                    <div class="final-stat"><div class="stat-value">${state.wisdom}</div><div class="stat-label">智慧值</div></div>
                </div>
                <button class="restart-btn" onclick="restart()">重新开始</button>
            </div>
        `;
    }

    function startGame() {
        state = { phase: "play", age: 0, execution: 10, happiness: 50, career: 50, wisdom: 50, eventIndex: 0, lifeStory: [], selectedChoice: null, selectedMethod: null };
        render();
    }

    function selectChoice(index) {
        state.selectedChoice = index;
        state.selectedMethod = null;
        render();
    }

    function selectMethod(id) {
        state.selectedMethod = id;
        render();
    }

    function executeChoice() {
        state.phase = "result";
        render();
    }

    function nextEvent() {
        state.eventIndex++;
        state.selectedChoice = null;
        state.selectedMethod = null;
        if (state.eventIndex >= events.length) {
            state.phase = "end";
        } else {
            state.phase = "play";
        }
        render();
    }

    function restart() {
        startGame();
    }

    render();
    </script>
</body>
</html>
