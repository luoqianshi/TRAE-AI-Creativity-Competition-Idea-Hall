// ==================== 初始化 ====================
const yearSelect = document.getElementById('yearSelect');

hourSelect.addEventListener('change', () => {

// ==================== Tab 切换 ====================
const tabBtns = document.querySelectorAll('.tab-btn');
const tabContents = document.querySelectorAll('.tab-content');
tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    tabBtns.forEach(b => b.classList.remove('active'));
    tabContents.forEach(c => c.classList.remove('active'));

function hideAllResults() {
  document.getElementById('baziResults').classList.remove('show');
  document.getElementById('divResults').classList.remove('show');
  document.getElementById('baziLoading').classList.remove('show');
  document.getElementById('shakeArea').classList.remove('show');
}

// ==================== 工具函数 ====================
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function getRandomGZ() { return pick(allGZ); }

// ==================== 八字算命 ====================
function generateFortuneBars() {
  const fortunes = [
    { name: '财运', score: 87 + Math.floor(Math.random() * 13) },
    { name: '事业运', score: 90 + Math.floor(Math.random() * 10) },
    { name: '桃花运', score: 85 + Math.floor(Math.random() * 15) }
  ];
  const container = document.getElementById('fortuneBars');
  container.innerHTML = '';
  fortunes.forEach(f => {
    const verdict = pick(fortuneVerdicts);
    const div = document.createElement('div');
    div.className = 'fortune-bar';
    div.innerHTML = `
      <div class="fortune-header">
        <span class="fortune-name">${f.name}</span>
        <span class="fortune-score">${f.score}%</span>
      </div>
      <div class="fortune-bar-bg">
        <div class="fortune-bar-fill" style="width:0%"></div>
      </div>
      <div class="fortune-comment">${verdict}</div>
    `;
    container.appendChild(div);
    setTimeout(() => { div.querySelector('.fortune-bar-fill').style.width = f.score + '%'; }, 300);
  });
}

function generateFortuneText(name, yearGZ, monthGZ, dayGZ, hourGZ) {
  const dayTG = dayGZ[0];
  const element = dayTG;
  const elementDesc = wuxingDesc[dayTG];
  const pair = pick(starPairs);
  const star1 = pair[0];
  const star2 = pair[1];
  const starHit = pick(starPool);

  const templates = [
    `${name}之命，生于${yearGZ}年，月令${monthGZ}，日柱${dayGZ}，时柱${hourGZ}。日主${element}，乃${elementDesc}。命带${star1}${star2}双贵星，一生贵人运极旺。年柱${yearGZ}，主早年${pick(earlyFortunes)}；月令${monthGZ}，主${pick(midFortunes)}；日坐${dayGZ}，主${pick(lateFortunes)}。阁下命格贵气暗藏，前途不可限量。`,

    `观${name}命盘，日月交辉，星辰拱照。${yearGZ}年柱，青龙入位，主智慧超群；${monthGZ}月柱，朱雀临门，主人缘上佳；${dayGZ}日柱，白虎归垣，主事业有成；${hourGZ}时柱，玄武护身，主福寿绵长。四柱皆吉，实乃上等命格。一生得天地人三才之助，所求皆有所成。`,

    `${name}此命，日坐${dayGZ}，时逢${hourGZ}，格局清奇。年上${yearGZ}，乃${pick(yearComments)}；月上${monthGZ}，乃${pick(monthComments)}；日柱${dayGZ}，乃${pick(dayComments)}。三柱配合，五行流转有情，一生顺遂少波折。更得${star1}${star2}星辰照命，不论行至何处，皆有天佑。`,

    `论${name}之命格，当以${monthGZ}月令为枢纽。月令为提纲，提纲${pick(monthVibes)}，则四柱皆吉。命局以${element}为用神，用神得力，一生不愁。大运顺行，步步皆吉运。流年遇${starHit}，今年必有大喜。实乃不可多得之好命格。`
  ];

  return pick(templates);
}

document.getElementById('baziBtn').addEventListener('click', () => {
  const name = document.getElementById('baziName').value.trim();
  if (!name) { showToast('请输入姓名！'); return; }

  hideAllResults();
  const loading = document.getElementById('baziLoading');
  loading.classList.add('show');

  const steps = ['正在排四柱…', '正在推大运…', '正在算流年…', '命盘已出！'];
  let stepIdx = 0;
  const stepEl = document.getElementById('loadingSteps');
  stepEl.innerHTML = '<span>' + steps[0] + '</span>';
  const interval = setInterval(() => {
    stepIdx++;
    if (stepIdx < steps.length) stepEl.innerHTML = '<span>' + steps[stepIdx] + '</span>';
  }, 500);

  setTimeout(() => {
    clearInterval(interval);
    loading.classList.remove('show');

    const yearGZ = getRandomGZ();
    const monthGZ = getRandomGZ();
    const dayGZ = getRandomGZ();
    const hourGZ = getRandomGZ();
    const dayTG = dayGZ[0];
    const element = dayTG;

    document.getElementById('pillarsGrid').innerHTML = `
      <div class="pillar-item"><div class="pillar-label">年柱</div><div class="pillar-value">${yearGZ}</div></div>
      <div class="pillar-item"><div class="pillar-label">月柱</div><div class="pillar-value">${monthGZ}</div></div>
      <div class="pillar-item"><div class="pillar-label">日柱</div><div class="pillar-value">${dayGZ}</div></div>
      <div class="pillar-item"><div class="pillar-label">时柱</div><div class="pillar-value">${hourGZ}</div></div>
    `;

    document.getElementById('dayMaster').textContent = element + wuxingMap[element] + '之命';
    document.getElementById('dayMasterDesc').textContent = wuxingDesc[dayTG];

    generateFortuneBars();

    const detailText = generateFortuneText(name, yearGZ, monthGZ, dayGZ, hourGZ);
    document.getElementById('fortuneDetail').innerHTML = '<p>' + detailText + '</p>';

    document.getElementById('dailyOracle').textContent = pick(oracles);

    document.getElementById('baziResults').classList.add('show');
  }, 2000);
});

// ==================== 灵签占卜 ====================
function doDivination() {
  document.getElementById('divResults').classList.remove('show');
  document.getElementById('shakeArea').classList.add('show');
  setTimeout(() => {
    document.getElementById('shakeArea').classList.remove('show');
    const stick = pick(divinationSticks);
    document.getElementById('divNumber').textContent = stick.num;
    document.getElementById('divLevel').textContent = stick.level;
    document.getElementById('divPoem').innerHTML = stick.poem;
    document.getElementById('divExplain').innerHTML = '<p>' + stick.explain + '</p>';
    document.getElementById('divResults').classList.add('show');
  }, 2000);
}

document.getElementById('divBtn').addEventListener('click', () => {

  if (!name) { showToast('请输入姓名！'); return; }
  doDivination();
});

document.getElementById('redivBtn').addEventListener('click', doDivination);

// ==================== Toast ====================
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}
