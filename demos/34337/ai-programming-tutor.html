<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI编程私教</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%);
            min-height: 100vh;
            padding: 20px;
            color: #c9d1d9;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #161b22;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.15), 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        .header {
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            border-bottom: 1px solid #30363d;
            padding: 20px 30px;
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            margin-bottom: 12px;
        }

        .progress-bar {
            background: #21262d;
            height: 6px;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .progress-fill {
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .progress-text {
            font-size: 13px;
            margin-top: 8px;
            color: #8b949e;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 25px 30px;
            min-height: 0;
        }

        .chat-area::-webkit-scrollbar {
            width: 8px;
        }

        .chat-area::-webkit-scrollbar-track {
            background: #0d1117;
        }

        .chat-area::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        .chat-area::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        .message {
            margin-bottom: 18px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ai-message {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .ai-avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d1117;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .ai-bubble {
            background: #21262d;
            padding: 14px 18px;
            border-radius: 14px;
            border-top-left-radius: 4px;
            max-width: 75%;
            line-height: 1.6;
            font-size: 16px;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }

        .ai-bubble code {
            background: #0d1117;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: #56d364;
            font-size: 15px;
            border: 1px solid #30363d;
        }

        .user-message {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 12px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 13px;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .user-bubble {
            background: linear-gradient(135deg, #238636 0%, #196c2e 100%);
            padding: 14px 18px;
            border-radius: 14px;
            border-top-right-radius: 4px;
            max-width: 75%;
            line-height: 1.6;
            font-size: 16px;
            color: white;
            word-break: break-all;
            border: 1px solid #2ea043;
            box-shadow: 0 0 15px rgba(46, 160, 67, 0.2);
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .option-btn {
            padding: 10px 24px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: #c9d1d9;
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .option-btn:hover {
            background: #00d4ff;
            color: #0d1117;
            border-color: #00d4ff;
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.4);
        }

        .code-area {
            margin-top: 15px;
            animation: fadeIn 0.4s ease;
        }

        .code-label {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 8px;
            display: block;
        }

        .code-input {
            width: 100%;
            padding: 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 15px;
            color: #c9d1d9;
            resize: vertical;
            min-height: 80px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .code-input:focus {
            border-color: #00d4ff;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .code-input::placeholder {
            color: #484f58;
        }

        .action-btn {
            margin-top: 12px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 10px;
            color: #0d1117;
            font-size: 14px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .preview-area {
            margin-top: 20px;
            border: 1px solid #30363d;
            border-radius: 10px;
            overflow: hidden;
            animation: fadeIn 0.4s ease;
            background: #0d1117;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .preview-header {
            background: #21262d;
            padding: 10px 16px;
            font-size: 12px;
            color: #8b949e;
            border-bottom: 1px solid #30363d;
            font-weight: 500;
        }

        .preview-content {
            padding: 20px;
            min-height: 120px;
            background: #0d1117;
        }

        .preview-content h1 {
            color: #c9d1d9;
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-top: 12px;
        }

        .preview-content button {
            display: block;
            margin: 15px auto;
            padding: 10px 28px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 10px;
            color: #0d1117;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .success-message {
            text-align: center;
            padding: 30px 20px;
            animation: fadeIn 0.4s ease;
        }

        .success-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #238636 0%, #196c2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 36px;
            box-shadow: 0 0 30px rgba(35, 134, 54, 0.4);
        }

        .success-title {
            font-size: 20px;
            color: #c9d1d9;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .success-text {
            font-size: 16px;
            color: #8b949e;
            line-height: 1.6;
        }

        .restart-btn {
            margin-top: 20px;
            padding: 12px 35px;
            background: linear-gradient(135deg, #238636 0%, #196c2e 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 0 20px rgba(35, 134, 54, 0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(35, 134, 54, 0.5);
        }

        .error-bubble {
            background: #392323 !important;
            border-color: #8b2020 !important;
        }

        .input-area {
            flex-shrink: 0;
            padding: 20px 30px;
            background: #0d1117;
            border-top: 1px solid #30363d;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            color: #c9d1d9;
            outline: none;
            transition: all 0.3s ease;
            resize: none;
            min-height: 48px;
            max-height: 120px;
        }

        .chat-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .chat-input::placeholder {
            color: #484f58;
        }

        .send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 12px;
            color: #0d1117;
            font-size: 14px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            white-space: nowrap;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .free-mode-hint {
            font-size: 12px;
            color: #484f58;
            margin-top: 8px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 18px;
            }
            
            .chat-area {
                padding: 18px;
            }
            
            .ai-bubble, .user-bubble {
                max-width: 88%;
            }
            
            .ai-avatar, .user-avatar {
                width: 34px;
                height: 34px;
                font-size: 12px;
            }

            .input-area {
                padding: 15px 18px;
            }

            .send-btn {
                padding: 12px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI编程私教</h1>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">引导式教学 - 第1步 / 共5步</div>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message ai-message">
                <div class="ai-avatar">AI</div>
                <div class="ai-bubble">欢迎来到AI编程私教！我可以帮你学习编程。你想选择哪种学习方式呢？</div>
            </div>
            
            <div class="options" id="modeOptions">
                <button class="option-btn" onclick="startGuidedMode()">引导式教学</button>
                <button class="option-btn" onclick="startFreeMode()">自由问答</button>
            </div>
        </div>

        <div class="input-area" id="inputArea">
            <div class="input-wrapper">
                <textarea class="chat-input" id="chatInput" placeholder="输入你的问题..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
            <div class="free-mode-hint" id="modeHint">支持编程相关问题的自由问答</div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let currentMode = 'select';
        const totalSteps = 5;
        const chatArea = document.getElementById('chatArea');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const modeOptions = document.getElementById('modeOptions');
        const chatInput = document.getElementById('chatInput');
        const modeHint = document.getElementById('modeHint');
        
        let currentPath = null;
        
        const pathConfig = {
            '网页': {
                name: '网页',
                code: '<h1>我的第一个网页</h1>',
                instruction: '太棒了！做网页需要用到HTML。我们先从最基础的一行代码开始吧。请在下面的代码区输入：',
                explanation: '<h1>是用来定义网页标题的标签，你在网页上看到的大标题就是用这个标签实现的。',
                previewContent: '<h1>我的第一个网页</h1>',
                successText: '你已经成功写出了你的第一个HTML标题标签！'
            },
            '游戏': {
                name: '游戏',
                code: '<button onclick="alert(\'游戏开始！\')">开始游戏</button>',
                instruction: '太棒了！做游戏需要学习交互功能。我们先从最基础的按钮开始吧。请在下面的代码区输入：',
                explanation: '<button>是HTML的按钮标签，onclick是点击事件，alert()是弹窗函数。点击按钮就会弹出提示！',
                previewContent: '<button onclick="alert(\'游戏开始！\')">开始游戏</button>',
                successText: '你已经成功写出了你的第一个交互按钮！'
            },
            'App': {
                name: 'App',
                code: '<div style="background:blue;color:white;padding:20px;">我的App</div>',
                instruction: '太棒了！做App需要学习界面布局。我们先从最基础的结构开始吧。请在下面的代码区输入：',
                explanation: '<div>是HTML的容器标签，style属性用来设置样式，background设置背景色，color设置文字颜色，padding设置内边距。',
                previewContent: '<div style="background:blue;color:white;padding:20px;border-radius:10px;text-align:center;">我的App</div>',
                successText: '你已经成功写出了你的第一个App界面结构！'
            }
        };

        // 自由问答回复配置
        const replyConfig = {
            '标题': '📚 <code>&lt;h1&gt;</code> 是HTML的一级标题标签，用于定义页面的主标题。数字越大，标题越小（如h2、h3...）。',
            'h1': '📚 <code>&lt;h1&gt;</code> 是HTML的一级标题标签，用于定义页面的主标题。数字越大，标题越小（如h2、h3...）。',
            '按钮': '📚 <code>&lt;button&gt;</code> 是HTML的按钮标签，配合onclick事件可以响应用户点击。',
            'button': '📚 <code>&lt;button&gt;</code> 是HTML的按钮标签，配合onclick事件可以响应用户点击。',
            'div': '📚 <code>&lt;div&gt;</code> 是HTML的块级容器，用于划分页面区域和布局。',
            '布局': '📚 <code>&lt;div&gt;</code> 是HTML的块级容器，用于划分页面区域和布局。可以配合CSS实现各种页面结构。',
            '颜色': '🎨 可以使用CSS的color属性改变文字颜色，例如：<br><code>style="color:red;"</code><br><br>背景色使用background属性，例如：<br><code>style="background:blue;"</code>',
            'padding': '📐 padding是CSS内边距属性，用于设置元素内容与边框之间的间距。例如：<br><code>padding:20px;</code>',
            'margin': '📐 margin是CSS外边距属性，用于设置元素与其他元素之间的间距。例如：<br><code>margin:10px;</code>',
            '报错': '🔧 报错是编程学习中的正常现象！请把错误信息复制给我，我帮你分析原因。常见报错有：语法错误、拼写错误、缺少括号等。',
            '错误': '🔧 报错是编程学习中的正常现象！请把错误信息复制给我，我帮你分析原因。常见报错有：语法错误、拼写错误、缺少括号等。',
            '为什么': '🤔 这是一个很好的问题！编程中每一个符号都有它的含义，让我们一起探索。',
            '什么意思': '🤔 这是一个很好的问题！让我来帮你解释。',
            '怎么': '💡 让我来教你！编程需要多练习，有问题随时问我。',
            '如何': '💡 让我来教你！编程需要多练习，有问题随时问我。',
            '标签': '🏷️ HTML标签是用于定义网页结构的标记，如<code>&lt;h1&gt;</code>、<code>&lt;div&gt;</code>、<code>&lt;p&gt;</code>等。标签通常成对出现，有开始标签和结束标签。',
            'css': '🎨 CSS用于控制网页样式，比如颜色、字体、布局等。可以写在HTML的style属性里，也可以单独写。',
            'style': '🎨 style属性用于给HTML元素添加内联样式。例如：<br><code>&lt;div style="color:red;"&gt;</code>',
            'html': '📄 HTML是超文本标记语言，用于构建网页的基本结构。所有的网页都是用HTML开始的！',
            '代码': '💻 编程代码就是用特定语法写的指令，让计算机执行特定任务。多写多练是学习编程最好的方法！',
            '学习': '📖 学习编程需要多动手实践！从简单的标签开始，慢慢增加难度，你会越来越厉害的。',
            '开始': '🚀 太好了！让我们开始编程之旅吧！',
            'help': '🆘 我在这里帮你！可以问我关于HTML、CSS、JavaScript等编程问题。'
        };

        function updateProgress(step, total) {
            const percentage = (step / total) * 100;
            progressFill.style.width = percentage + '%';
            
            if (currentMode === 'guided') {
                progressText.textContent = `引导式教学 - 第${step}步 / 共${total}步`;
            } else if (currentMode === 'free') {
                progressText.textContent = `自由问答模式`;
                progressFill.style.width = '100%';
            } else {
                progressText.textContent = `请选择学习模式`;
                progressFill.style.width = '0%';
            }
        }

        function addMessage(isAI, content, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = isAI ? 'message ai-message' : 'message user-message';
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = isAI ? 'ai-avatar' : 'user-avatar';
            avatarDiv.textContent = isAI ? 'AI' : 'You';
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = isAI ? 'ai-bubble' : 'user-bubble';
            if (isError && isAI) {
                bubbleDiv.classList.add('error-bubble');
            }
            bubbleDiv.innerHTML = content;
            
            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(bubbleDiv);
            chatArea.appendChild(messageDiv);
            
            scrollToBottom();
        }

        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function startGuidedMode() {
            currentMode = 'guided';
            currentStep = 1;
            modeOptions.style.display = 'none';
            updateProgress(1, 5);
            
            addMessage(true, '太好了！引导式教学可以帮你一步步写出第一个程序。你想学哪方面的编程呢？');
            
            setTimeout(() => {
                addMessage(true, '请选择你的学习方向：');
                showLearningOptions();
            }, 500);
        }

        function showLearningOptions() {
            const optionsDiv = document.createElement('div');
            optionsDiv.className = 'options';
            optionsDiv.innerHTML = `
                <button class="option-btn" onclick="selectPath('网页')">做网页</button>
                <button class="option-btn" onclick="selectPath('游戏')">做游戏</button>
                <button class="option-btn" onclick="selectPath('App')">做App</button>
            `;
            chatArea.appendChild(optionsDiv);
            scrollToBottom();
        }

        function selectPath(path) {
            currentPath = path;
            const config = pathConfig[path];
            
            addMessage(false, '我想学' + config.name + '编程');
            
            setTimeout(() => {
                currentStep = 2;
                updateProgress(2, 5);
                
                const codeDisplay = config.code.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                addMessage(true, config.instruction + '<br><br><code>' + codeDisplay + '</code>');
                
                showCodeInput();
            }, 800);
        }

        function showCodeInput() {
            const codeArea = document.createElement('div');
            codeArea.className = 'code-area';
            codeArea.innerHTML = `
                <label class="code-label">代码输入区</label>
                <textarea class="code-input" id="codeInput" placeholder="在这里输入代码..."></textarea>
                <button class="action-btn" id="submitBtn" onclick="submitCode()">提交</button>
            `;
            chatArea.appendChild(codeArea);
            scrollToBottom();
        }

        function submitCode() {
            const codeInput = document.getElementById('codeInput');
            const userCode = codeInput.value.trim();
            const config = pathConfig[currentPath];
            
            if (!userCode) {
                addMessage(true, '输入不能为空哦！请输入代码后再提交。', true);
                return;
            }
            
            let isCorrect = false;
            
            if (currentPath === '网页') {
                isCorrect = userCode.includes('<h1>') && userCode.includes('</h1>');
            } else if (currentPath === 'App') {
                isCorrect = userCode.includes('<div') && userCode.includes('style=');
            } else if (currentPath === '游戏') {
                isCorrect = userCode.includes('<button') && userCode.includes('onclick');
            }
            
            addMessage(false, userCode);
            
            setTimeout(() => {
                if (isCorrect) {
                    currentStep = 3;
                    updateProgress(3, 5);
                    step3(config);
                } else {
                    let hint = '';
                    if (currentPath === '网页') {
                        hint = '请检查你的代码是否包含正确的&lt;h1&gt;标签，格式应该是&lt;h1&gt;内容&lt;/h1&gt;';
                    } else if (currentPath === 'App') {
                        hint = '请检查你的代码是否包含&lt;div&gt;标签和style属性';
                    } else if (currentPath === '游戏') {
                        hint = '请检查你的代码是否包含&lt;button&gt;标签和onclick属性';
                    }
                    addMessage(true, '代码有点问题哦！' + hint + '<br><br>请重新输入后再提交。', true);
                }
            }, 800);
        }

        function step3(config) {
            addMessage(true, '完美！' + config.explanation + '<br><br>现在点击"运行"按钮看看效果吧！');
            
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.textContent = '运行';
                submitBtn.onclick = runCode;
            }
            scrollToBottom();
        }

        function runCode() {
            currentStep = 4;
            updateProgress(4, 5);
            
            const config = pathConfig[currentPath];
            
            const previewArea = document.createElement('div');
            previewArea.className = 'preview-area';
            previewArea.innerHTML = '<div class="preview-header">预览效果</div><div class="preview-content">' + config.previewContent + '</div>';
            chatArea.appendChild(previewArea);
            scrollToBottom();
            
            setTimeout(() => {
                currentStep = 5;
                updateProgress(5, 5);
                step5(config);
            }, 1500);
        }

        function step5(config) {
            addMessage(true, '恭喜你！你已经在短时间内完成了第一个程序。这就是编程——把想法变成现实。继续加油！');
            
            const successArea = document.createElement('div');
            successArea.className = 'success-message';
            successArea.innerHTML = '<div class="success-icon">🎉</div><div class="success-title">任务完成！</div><div class="success-text">' + config.successText + '<br>编程的世界正在向你敞开大门！</div><button class="restart-btn" onclick="restart()">重新开始</button>';
            chatArea.appendChild(successArea);
            scrollToBottom();
        }

        function startFreeMode() {
            currentMode = 'free';
            modeOptions.style.display = 'none';
            updateProgress(1, 1);
            modeHint.textContent = '自由问答模式 - 可随时提问编程问题';
            
            addMessage(true, '太好了！进入自由问答模式。你可以问我任何编程相关的问题，我会尽力帮你解答！');
            
            addMessage(true, '💡 我可以帮你解答：<br>• HTML标签的含义<br>• CSS样式设置<br>• 编程报错怎么办<br>• 代码怎么写<br><br>试试问我一些问题吧！');
        }

        function getFreeReply(message) {
            const lowerMsg = message.toLowerCase();
            
            // 检查是否包含编程相关关键词
            const programmingKeywords = ['编程', '代码', 'html', 'css', 'javascript', '标签', '按钮', '标题', 'div', '颜色', '布局', 'padding', 'margin', 'style', '报错', '错误', 'h1', 'h2', '开始', '学习', 'help'];
            
            const hasProgrammingKeyword = programmingKeywords.some(keyword => lowerMsg.includes(keyword.toLowerCase()));
            
            // 检查是否是非编程相关问题
            const nonProgrammingPatterns = [
                /今天|明天|天气|吃饭|你好吗|年龄|名字|喜欢|讨厌|爱/,
                /几岁|生日|工作|学校|朋友|家人|宠物/,
                /无聊|开心|难过|生气|害怕/
            ];
            
            const isNonProgramming = nonProgrammingPatterns.some(pattern => pattern.test(lowerMsg));
            
            if (isNonProgramming && !hasProgrammingKeyword) {
                return '👋 我是AI编程私教，专注于帮你学习编程。如果你有编程相关的问题，我很乐意帮你解答！<br><br>可以问我：<br>• 什么是HTML标签？<br>• 怎么改变颜色？<br>• 代码报错了怎么办？';
            }
            
            // 根据关键词返回相应回复
            for (const [keyword, reply] of Object.entries(replyConfig)) {
                if (lowerMsg.includes(keyword.toLowerCase())) {
                    return reply;
                }
            }
            
            // 其他编程相关问题
            if (hasProgrammingKeyword) {
                return '💡 这是一个很好的编程问题！让我来帮你分析：<br><br>编程学习需要循序渐进，建议从基础的HTML标签开始。建议你：<br>1. 先理解每个标签的作用<br>2. 多动手写代码<br>3. 遇到问题随时问我<br><br>有什么具体想学的吗？';
            }
            
            // 完全不相关的问题
            return '👋 我是AI编程私教，专注于帮你学习编程。如果你有编程相关的问题，我很乐意帮你解答！';
        }

        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            addMessage(false, message);
            chatInput.value = '';
            
            setTimeout(() => {
                if (currentMode === 'guided') {
                    // 在引导模式下，如果用户输入的不是代码而是问题，切换到自由问答
                    const isQuestion = message.includes('?') || message.includes('？') || 
                                      message.includes('怎么') || message.includes('什么') || 
                                      message.includes('为什么') || message.includes('如何');
                    
                    if (isQuestion) {
                        currentMode = 'free';
                        updateProgress(1, 1);
                        modeHint.textContent = '已切换到自由问答模式';
                        addMessage(true, getFreeReply(message));
                    } else {
                        addMessage(true, '请完成当前的引导式教学内容。你可以选择继续输入代码，或者点击选项开始学习。');
                    }
                } else if (currentMode === 'free') {
                    addMessage(true, getFreeReply(message));
                } else {
                    addMessage(true, '请先选择学习模式：点击"引导式教学"开始系统学习，或点击"自由问答"提问问题。');
                }
            }, 500);
        }

        function restart() {
            currentStep = 1;
            currentPath = null;
            currentMode = 'select';
            updateProgress(1, 5);
            modeHint.textContent = '支持编程相关问题的自由问答';
            
            chatArea.innerHTML = `
                <div class="message ai-message">
                    <div class="ai-avatar">AI</div>
                    <div class="ai-bubble">欢迎来到AI编程私教！我可以帮你学习编程。你想选择哪种学习方式呢？</div>
                </div>
                
                <div class="options" id="modeOptions">
                    <button class="option-btn" onclick="startGuidedMode()">引导式教学</button>
                    <button class="option-btn" onclick="startFreeMode()">自由问答</button>
                </div>
            `;
            scrollToBottom();
        }

        // 监听回车键发送消息
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 自动调整输入框高度
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // 初始化
        updateProgress(1, 5);
    </script>
</body>
</html>
