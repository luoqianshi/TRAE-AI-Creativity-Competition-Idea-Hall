<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感造物主 - 离线版</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 React 和 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- 引入 Babel 用于在浏览器中编译 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // 强制 Babel 使用经典的 JSX 转换模式 (Classic Runtime)
    // 避免在浏览器环境下生成带有 import 的 react/jsx-runtime 代码从而引发解析崩溃
    Babel.registerPreset('react-classic', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>
  <!-- 引入 Phosphor Icons (替代 Lucide 保证单文件可用性) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #f9fafb; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #9ca3af; }
    .dark-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; }
    .dark-scrollbar:hover::-webkit-scrollbar-thumb { background: #6b7280; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.25s ease-out forwards; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 使用 data-presets 强制指定刚刚配置的 react-classic 预设 -->
  <script type="text/babel" data-presets="env, react-classic">
    const { useState, useEffect, useRef } = React;

    // ================= 全局设定 =================
    // 你可以直接用记事本打开这个 HTML 文件，在这里填入你的 API Key，以后就不用每次都填了
    const DEFAULT_API_KEY = ""; 

    // 抽卡词库
    const gachaPools = {
      titles: ["赛博修仙传", "深渊漫步者", "最后的人类", "时空走私客", "诡秘纪元", "第四天灾降临", "星海余烬", "废土神明", "凡人长生劫"],
      genres: ["赛博朋克 + 修仙", "克苏鲁 + 悬疑", "蒸汽朋克 + 冒险", "末日废土 + 种田", "无限流 + 智斗", "都市异能 + 搞笑", "西方奇幻 + 史诗"],
      tones: ["轻松幽默", "黑暗压抑", "热血王道", "悬疑烧脑", "治愈日常", "黑色幽默", "悲剧史诗", "冰冷绝望", "群像反转"],
      themes: ["在绝望中寻找人性的微光", "反抗既定的命运与宿命", "科技发展对人类伦理的挑战", "追求长生背后的疯狂与代价", "文明的碰撞与毁灭"],
      eras: ["新历2077年", "混沌初开的上古纪元", "第三次世界大战后的废土时代", "蒸汽与魔法共存的维多利亚时期", "星际殖民大开拓时代"],
      geographies: ["浮空城亚特兰蒂斯，下层是贫民窟", "被迷雾包围的孤岛废墟", "由巨兽骨骼建立的巨大要塞", "赛博霓虹闪烁的九龙城寨"],
      systems: ["九阶魔法体系，以灵魂刻印为基础", "赛博义体改造度与赛博精神病阈值", "诡秘魔药途径，伴随着疯狂的风险", "吞噬变异星兽肉身升级的古武体术"],
      factionNames: ["深渊守望者", "真理教会", "星际财阀联盟", "旧日遗民", "时空管理局", "血肉飞升教派", "机械黎明"],
      factionDescs: ["崇拜上古邪神，认为肉身是苦弱的束缚", "绝对理性的AI统治，试图将全人类数据化", "游走于灰色地带的佣兵组织", "维护历史主线的秘密警察"],
      charNames: ["林星河", "苏长风", "夜阑", "楚明录", "亚历山大", "艾丽娅", "零号", "李狗蛋", "绯村"],
      charAppearances: ["一头白发，眼眸中仿佛有星辰生灭", "身材干瘦，总是穿着破旧的黑色风衣", "右臂是精致的机械义肢，面无表情", "面容俊美但苍白"],
      charPersonalities: ["极度理性，只在乎利益", "表面玩世不恭，内心极其重感情", "圣母外表下的腹黑病娇", "社恐但实力极其强大的战神", "乐观开朗"],
      charMotives: ["复活死去的妹妹", "向毁灭家族的财阀复仇", "只想在这个残酷的世界活下去", "探寻世界的终极真相", "摆脱被操控的命运"],
      charAbilities: ["能回溯时间5秒钟", "与任何机械沟通并控制", "吸收他人的负面情绪转化为力量", "真理之眼：看破一切虚妄与弱点"],
      charFlaws: ["极度恐高", "一旦听到特定的八音盒旋律就会失去理智", "必须每天吸食少量鲜血", "过度共情，容易被敌人的悲惨过去动摇"],
      outBeggining: ["主角在平淡的日子里，意外捡到了一个来自未来的神秘物品。", "主角所在的城市突遭毁灭，成为了唯一的幸存者。", "主角被诊断出绝症，只剩下三个月寿命。"],
      outDev: ["主角为了寻找真相，加入了某个神秘组织。", "主角在探索遗迹时结识了一群性格各异的伙伴，组成小队共同冒险。", "主角不断猎杀怪物获取资源。"],
      outClimax: ["主角终于直面最终反派，却发现反派竟然是自己一直信任的导师/亲人。", "世界面临毁灭的危机，主角必须牺牲自己最珍视的东西。"],
      outEnding: ["主角付出了惨痛的代价击败了敌人，独自一人踏上新的旅程。", "危机解除，主角和伙伴们重建了家园。", "主角虽然赢了，但世界已经千疮百孔。"],
      chapterEvents: ["主角遭遇了退婚/背叛/暗算，跌入谷底。", "主角在拍卖会上捡漏了一件上古神器。", "一名神秘强者突然出现，想要收主角为徒。", "偶然发现了一个隐藏的秘境入口。"]
    };

    const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

    const parseAIJSON = (text) => {
      try {
        const cleanedText = text.replace(new RegExp('\\x60\\x60\\x60(?:json)?\\n?', 'g'), '')
                                .replace(new RegExp('\\x60\\x60\\x60\\n?', 'g'), '')
                                .trim();
        return JSON.parse(cleanedText);
      } catch (e) {
        throw new Error("解析 AI 数据失败，请重试");
      }
    };

    const initialBookData = () => ({
      id: Date.now().toString(),
      lastModified: Date.now(),
      basic: { title: '未命名新书', genre: '', theme: '', tone: '' },
      world: { era: '', geography: '', system: '', factions: [] },
      characters: [],
      outline: { beginning: '', development: '', climax: '', ending: '' },
      chapters: [],
      styleGuide: { referenceText: '', style: '', plotElements: '' },
      notes: ''
    });

    // ================= 主应用组件 =================
    function App() {
      const [view, setView] = useState('library'); 
      const [books, setBooks] = useState([]);
      const [currentBook, setCurrentBook] = useState(null);
      const [activeTab, setActiveTab] = useState('basic');
      
      const [showImportModal, setShowImportModal] = useState(false);
      const [importText, setImportText] = useState('');
      const [isImporting, setIsImporting] = useState(false);

      // 自定义 Modal 状态
      const [customAlert, setCustomAlert] = useState({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null });
      const [apiKeyModal, setApiKeyModal] = useState({ isOpen: false, tempKey: '', pendingAction: null });
      const [userApiKey, setUserApiKey] = useState(DEFAULT_API_KEY);
      
      const fileInputRef = useRef(null);

      const showAlert = (title, message, type = 'info', onConfirm = null) => {
        setCustomAlert({ isOpen: true, title, message, type, onConfirm });
      };

      // 获取 API Key 拦截器
      const executeWithAI = async (actionFn) => {
        if (userApiKey) {
          actionFn(userApiKey);
        } else {
          setApiKeyModal({ isOpen: true, tempKey: '', pendingAction: actionFn });
        }
      };

      const handleApiKeySubmit = () => {
        if (apiKeyModal.tempKey.trim()) {
          setUserApiKey(apiKeyModal.tempKey.trim());
          const action = apiKeyModal.pendingAction;
          setApiKeyModal({ isOpen: false, tempKey: '', pendingAction: null });
          if (action) action(apiKeyModal.tempKey.trim());
        }
      };

      // 自动同步当前书本到书库状态
      useEffect(() => {
        if (currentBook) {
          setBooks(prev => {
            const exists = prev.find(b => b.id === currentBook.id);
            if (exists) {
              return prev.map(b => b.id === currentBook.id ? { ...currentBook, lastModified: Date.now() } : b).sort((a,b)=>b.lastModified - a.lastModified);
            } else {
              return [{ ...currentBook, lastModified: Date.now() }, ...prev];
            }
          });
        }
      }, [currentBook]);

      const handleCreateBook = () => {
        const newBook = initialBookData();
        setCurrentBook(newBook);
        setView('editor');
        setActiveTab('basic');
      };

      const handleOpenBook = (book) => {
        setCurrentBook(book);
        setView('editor');
        setActiveTab('basic');
      };

      const handleDeleteBook = (e, bookId) => {
        e.stopPropagation(); 
        showAlert('删除确认', '确定要删除这本小说设定吗？此操作无法撤销。', 'danger', () => {
          setBooks(prev => prev.filter(b => b.id !== bookId));
          if (currentBook?.id === bookId) {
            setView('library');
            setCurrentBook(null);
          }
        });
      };

      const updateCurrentBook = (section, field, value) => {
        setCurrentBook(prev => ({
          ...prev,
          [section]: { ...(prev[section] || {}), [field]: value }
        }));
      };

      const handleExport = () => {
        if (!currentBook) return;
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentBook, null, 2));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", `${currentBook.basic.title || '小说设定'}_离线备份.json`);
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
        showAlert('导出成功', '已将设定保存到您的电脑本地。', 'success');
      };

      const handleImport = (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const importedData = JSON.parse(e.target.result);
            const mergedData = { ...initialBookData(), ...importedData, id: currentBook ? currentBook.id : Date.now().toString() };
            setCurrentBook(mergedData);
            showAlert('导入成功', '设定已成功覆盖到当前文档。', 'success');
          } catch (error) {
            showAlert('导入失败', '请确保文件格式正确！', 'danger');
          }
        };
        reader.readAsText(file);
        event.target.value = null;
      };

      const handleSmartImportSubmit = () => {
        if (!importText.trim()) return;
        
        executeWithAI(async (apiKey) => {
          setIsImporting(true);
          const promptText = `你是一个专业的网文编辑。请仔细阅读用户提供的这篇混乱的小说设定/大纲/正文文本，将其中蕴含的设定信息提取出来。如果文本中没有提到某项设定，请留空字符串。请严格按照给定的 JSON Schema 格式返回结果，不要包含任何多余的解释文字。\n\n用户文本输入：\n"""\n${importText}\n"""`;

          const payload = {
            contents: [{ parts: [{ text: promptText }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  basic: { type: "OBJECT", properties: { title: { type: "STRING" }, genre: { type: "STRING" }, theme: { type: "STRING" }, tone: { type: "STRING" } } },
                  world: { type: "OBJECT", properties: { era: { type: "STRING" }, geography: { type: "STRING" }, system: { type: "STRING" }, factions: { type: "ARRAY", items: { type: "OBJECT", properties: { name: { type: "STRING" }, description: { type: "STRING" } } } } } },
                  characters: { type: "ARRAY", items: { type: "OBJECT", properties: { name: { type: "STRING" }, role: { type: "STRING" }, appearance: { type: "STRING" }, personality: { type: "STRING" }, motive: { type: "STRING" }, ability: { type: "STRING" }, flaw: { type: "STRING" } } } },
                  outline: { type: "OBJECT", properties: { beginning: { type: "STRING" }, development: { type: "STRING" }, climax: { type: "STRING" }, ending: { type: "STRING" } } },
                  chapters: { type: "ARRAY", items: { type: "OBJECT", properties: { title: { type: "STRING" }, summary: { type: "STRING" }, content: { type: "STRING" } } } },
                  notes: { type: "STRING" }
                }
              }
            }
          };

          const fetchAIText = async () => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            let retries = 3;
            let delay = 1000;
            while (retries > 0) {
              try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                if (text) return text;
                throw new Error('No JSON generated');
              } catch (error) {
                retries--;
                if (retries === 0) throw error;
                await new Promise(res => setTimeout(res, delay));
                delay *= 2;
              }
            }
          };

          try {
            const jsonText = await fetchAIText();
            const parsedData = parseAIJSON(jsonText); 
            if (parsedData.characters) parsedData.characters = parsedData.characters.map(c => ({ ...c, id: Date.now() + Math.random() }));
            if (parsedData.chapters) parsedData.chapters = parsedData.chapters.map(c => ({ ...c, id: Date.now() + Math.random() }));
            
            const newBook = { ...initialBookData(), ...parsedData, id: Date.now().toString(), lastModified: Date.now() };
            
            setShowImportModal(false);
            setImportText('');
            setCurrentBook(newBook);
            setView('editor');
            setActiveTab('basic');
          } catch (error) {
            showAlert('解析失败', '请检查网络或 API Key 是否正确，稍后再试。', 'danger');
          } finally {
            setIsImporting(false);
          }
        });
      };

      const navItems = [
        { id: 'basic', label: '基础设定', icon: 'ph-book' },
        { id: 'world', label: '世界观', icon: 'ph-globe' },
        { id: 'characters', label: '角色档案', icon: 'ph-users' },
        { id: 'outline', label: '故事大纲', icon: 'ph-map-trifold' },
        { id: 'chapters', label: '章节细纲', icon: 'ph-list' },
        { id: 'analysis', label: 'AI拆书仿写', icon: 'ph-magnifying-glass' },
        { id: 'writing', label: '正文写作', icon: 'ph-pen-nib' },
        { id: 'notes', label: '灵感备忘', icon: 'ph-lightbulb' },
      ];

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 font-sans relative">
          
          {/* 自定义提示框 Modal */}
          {customAlert.isOpen && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-6 animate-fadeIn">
                <h3 className={`text-xl font-bold mb-2 flex items-center gap-2 ${customAlert.type === 'danger' ? 'text-red-600' : (customAlert.type === 'success' ? 'text-emerald-600' : 'text-gray-900')}`}>
                   {customAlert.type === 'danger' && <i className="ph-fill ph-warning-circle text-2xl"></i>}
                   {customAlert.type === 'success' && <i className="ph-fill ph-check-circle text-2xl"></i>}
                   {customAlert.title}
                </h3>
                <p className="text-gray-600 mb-6 text-sm leading-relaxed">{customAlert.message}</p>
                <div className="flex justify-end gap-3">
                  {customAlert.onConfirm && (
                    <button onClick={() => setCustomAlert({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null })} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm font-medium">取消</button>
                  )}
                  <button 
                    onClick={() => {
                      if (customAlert.onConfirm) customAlert.onConfirm();
                      setCustomAlert({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null });
                    }} 
                    className={`px-4 py-2 rounded-lg text-sm font-medium text-white shadow-sm ${customAlert.type === 'danger' ? 'bg-red-600 hover:bg-red-700' : 'bg-indigo-600 hover:bg-indigo-700'}`}
                  >
                    确定
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* API Key 填写 Modal */}
          {apiKeyModal.isOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl p-8 animate-fadeIn">
                <h3 className="text-2xl font-bold text-gray-900 mb-2 flex items-center gap-2">
                  <i className="ph-fill ph-key text-indigo-600"></i> 需要 API 密钥
                </h3>
                <p className="text-gray-500 mb-6 text-sm">
                  由于您运行的是纯离线版本，要使用 AI 功能，请填入您自己的 Google Gemini API Key。您的密钥仅保留在当前页面的内存中，不会上传到任何服务器。
                </p>
                <input 
                  type="password"
                  value={apiKeyModal.tempKey}
                  onChange={(e) => setApiKeyModal({...apiKeyModal, tempKey: e.target.value})}
                  placeholder="AIzaSy..."
                  className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none mb-6 font-mono"
                />
                <div className="flex justify-end gap-3">
                  <button onClick={() => setApiKeyModal({ isOpen: false, tempKey: '', pendingAction: null })} className="px-5 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium">取消</button>
                  <button onClick={handleApiKeySubmit} className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium shadow-md flex items-center gap-2">
                    确认并继续
                  </button>
                </div>
              </div>
            </div>
          )}

          {view === 'library' ? (
            <div className="p-8 md:p-16">
              <div className="max-w-6xl mx-auto">
                <div className="bg-amber-50 border-l-4 border-amber-500 p-4 mb-8 rounded-r-xl">
                  <div className="flex items-center gap-2 text-amber-800 font-bold mb-1"><i className="ph-fill ph-warning"></i> 离线版本使用提示</div>
                  <p className="text-sm text-amber-700">当前处于<strong>纯单文件离线模式</strong>。您的数据仅保存在浏览器的当前会话中。关闭网页前，务必进入编辑器点击左下角的<strong>“导出本机备份”</strong>，以免心血丢失！</p>
                </div>
                
                <div className="flex justify-between items-end mb-10">
                  <div>
                    <h1 className="text-4xl font-black text-gray-900 flex items-center gap-3">
                      <i className="ph-fill ph-books text-indigo-600"></i> 我的小说书库
                    </h1>
                  </div>
                  <div className="flex gap-4">
                    <button onClick={() => setShowImportModal(true)} className="flex items-center gap-2 px-5 py-3 bg-white text-indigo-600 border border-indigo-200 hover:bg-indigo-50 rounded-xl shadow-sm transition-all font-medium">
                      <i className="ph-bold ph-sparkle"></i> AI 智能导入
                    </button>
                    <button onClick={handleCreateBook} className="flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md transition-all hover:shadow-lg font-medium">
                      <i className="ph-bold ph-plus"></i> 新建作品
                    </button>
                  </div>
                </div>

                {books.length === 0 ? (
                   <div className="bg-white rounded-3xl p-16 text-center border border-gray-200 border-dashed shadow-sm">
                     <i className="ph ph-book-open text-6xl text-gray-300 mb-6 mx-auto block"></i>
                     <h3 className="text-xl font-bold text-gray-600 mb-2">书架空空如也</h3>
                     <p className="text-gray-400 mb-6">快来创建你的第一本小说设定，开始构建伟大的世界吧！</p>
                     <button onClick={handleCreateBook} className="text-indigo-600 font-medium hover:underline">立即创建 &rarr;</button>
                   </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {books.map(book => (
                      <div key={book.id} onClick={() => handleOpenBook(book)} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 hover:border-indigo-400 hover:shadow-md transition-all cursor-pointer group relative flex flex-col h-64">
                        <button onClick={(e) => handleDeleteBook(e, book.id)} className="absolute top-4 right-4 p-2 text-gray-300 hover:bg-red-50 hover:text-red-500 rounded-lg opacity-0 group-hover:opacity-100 transition-all">
                          <i className="ph-bold ph-trash text-lg"></i>
                        </button>
                        <div className="flex-1">

            <InputField label="整体基调" value={data.tone} onChange={(v) => updateData('tone', v)} placeholder="例如：轻松幽默 / 热血升级" onGenerate={() => updateData('tone', getRandom(gachaPools.tones))} />

            <TextAreaField label="地理环境" value={data.geography} onChange={(v) => updateData('geography', v)} placeholder="核心国家、城市、关键地标" rows={3} onGenerate={() => updateData('geography', getRandom(gachaPools.geographies))} />
            <TextAreaField label="力量体系/科技树" value={data.system} onChange={(v) => updateData('system', v)} placeholder="魔法等级划分、修仙境界等" rows={4} onGenerate={() => updateData('system', getRandom(gachaPools.systems))} />

                    <TextAreaField label="势力简介与理念" value={faction.description} onChange={(v) => updateFaction(idx, 'description', v)} rows={2} onGenerate={() => updateFaction(idx, 'description', getRandom(gachaPools.factionDescs))} />

    function CharactersTab({ data, setData, showAlert }) {
      const [editingId, setEditingId] = useState(null);
      const addCharacter = () => {
        const newChar = { id: Date.now(), name: '新角色', role: '主角', appearance: '', personality: '', motive: '', ability: '', flaw: '' };
        setData([...data, newChar]);
        setEditingId(newChar.id);
      };
      const removeCharacter = (id) => {
        showAlert('删除角色', '确定要删除这个角色吗？', 'danger', () => {
          setData(data.filter(c => c.id !== id));
          if (editingId === id) setEditingId(null);
        });
      };
      const updateCharacter = (id, field, value) => setData(data.map(c => c.id === id ? { ...c, [field]: value } : c));
      const activeChar = data.find(c => c.id === editingId);

      return (
        <div className="flex gap-6 h-full min-h-[600px]">
          <div className="w-1/3 border-r border-gray-100 pr-4 flex flex-col">
            <button onClick={addCharacter} className="w-full flex items-center justify-center gap-2 py-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl transition-colors font-medium mb-4">
              <i className="ph-bold ph-plus"></i> 新建角色
            </button>
            <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar">
              {data.map(char => (
                <div key={char.id} onClick={() => setEditingId(char.id)} className={`p-3 rounded-xl cursor-pointer border transition-all ${editingId === char.id ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white border-gray-200 hover:border-indigo-300 text-gray-700'}`}>
                  <div className="font-bold truncate">{char.name || '未命名角色'}</div>
                  <div className={`text-xs mt-1 ${editingId === char.id ? 'text-indigo-200' : 'text-gray-400'}`}>{char.role}</div>
                </div>

          </div>
          <div className="w-2/3 pl-2">
            {activeChar ? (
              <div className="space-y-5 animate-fadeIn">
                <div className="flex justify-between items-start">
                  <h3 className="text-xl font-bold text-gray-800">编辑角色卡</h3>
                  <button onClick={() => removeCharacter(activeChar.id)} className="text-red-400 hover:text-red-600 flex items-center gap-1 text-sm"><i className="ph-bold ph-trash"></i> 删除</button>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <InputField label="姓名" value={activeChar.name} onChange={(v) => updateCharacter(activeChar.id, 'name', v)} onGenerate={() => updateCharacter(activeChar.id, 'name', getRandom(gachaPools.charNames))} />
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">身份/阵营</label>
                    <select value={activeChar.role} onChange={(e) => updateCharacter(activeChar.id, 'role', e.target.value)} className="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                      <option value="主角">主角</option><option value="重要配角">重要配角</option><option value="核心反派">核心反派</option><option value="龙套/线索人物">龙套/线索人物</option>
                    </select>
                  </div>
                </div>
                <TextAreaField label="外貌特征" value={activeChar.appearance} onChange={(v) => updateCharacter(activeChar.id, 'appearance', v)} rows={2} onGenerate={() => updateCharacter(activeChar.id, 'appearance', getRandom(gachaPools.charAppearances))} />
                <TextAreaField label="性格标签" value={activeChar.personality} onChange={(v) => updateCharacter(activeChar.id, 'personality', v)} rows={2} onGenerate={() => updateCharacter(activeChar.id, 'personality', getRandom(gachaPools.charPersonalities))} />
                <TextAreaField label="核心动机/目标" value={activeChar.motive} onChange={(v) => updateCharacter(activeChar.id, 'motive', v)} rows={2} onGenerate={() => updateCharacter(activeChar.id, 'motive', getRandom(gachaPools.charMotives))} />
                <TextAreaField label="特殊能力/金手指" value={activeChar.ability} onChange={(v) => updateCharacter(activeChar.id, 'ability', v)} rows={2} onGenerate={() => updateCharacter(activeChar.id, 'ability', getRandom(gachaPools.charAbilities))} />
                <TextAreaField label="隐藏秘密/弱点" value={activeChar.flaw} onChange={(v) => updateCharacter(activeChar.id, 'flaw', v)} rows={2} onGenerate={() => updateCharacter(activeChar.id, 'flaw', getRandom(gachaPools.charFlaws))} />
              </div>
            ) : (
              <div className="h-full flex items-center justify-center text-gray-400 flex-col gap-3">
                <i className="ph-fill ph-users text-5xl text-gray-200"></i>
                <p>在左侧选择或新建一个角色进行编辑</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    function OutlineTab({ data, updateData }) {
      const renderHeader = (title, subtitle, field, pool, color1, color2) => (
        <div className="flex justify-between items-start mb-2">
          <div><h4 className={`font-bold ${color1} mb-2 flex items-center gap-2`}>{title}</h4><p className={`text-sm ${color2} mb-3`}>{subtitle}</p></div>
          <button onClick={() => updateData(field, getRandom(pool))} className={`flex items-center gap-1 text-xs bg-white hover:bg-gray-50 ${color1} font-medium px-2 py-1 rounded-md border border-current shadow-sm`}><i className="ph-bold ph-magic-wand"></i> 灵感抽卡</button>
        </div>
      );
      return (
        <div className="space-y-8">
          <div className="bg-blue-50 border border-blue-100 p-6 rounded-xl">{renderHeader("起：开端", "生活状态被打破的契机。", "beginning", gachaPools.outBeggining, "text-blue-800", "text-blue-600")} <TextAreaField hideLabel value={data.beginning} onChange={(v) => updateData('beginning', v)} rows={4} /></div>
          <div className="bg-emerald-50 border border-emerald-100 p-6 rounded-xl">{renderHeader("承：发展", "踏上旅程/开始升级/结识伙伴。", "development", gachaPools.outDev, "text-emerald-800", "text-emerald-600")} <TextAreaField hideLabel value={data.development} onChange={(v) => updateData('development', v)} rows={6} /></div>
          <div className="bg-orange-50 border border-orange-100 p-6 rounded-xl">{renderHeader("转：高潮", "面临最大的危机，核心矛盾爆发。", "climax", gachaPools.outClimax, "text-orange-800", "text-orange-600")} <TextAreaField hideLabel value={data.climax} onChange={(v) => updateData('climax', v)} rows={5} /></div>
          <div className="bg-purple-50 border border-purple-100 p-6 rounded-xl">{renderHeader("合：结局", "危机解除，人物弧光完成，留下余味。", "ending", gachaPools.outEnding, "text-purple-800", "text-purple-600")} <TextAreaField hideLabel value={data.ending} onChange={(v) => updateData('ending', v)} rows={4} /></div>

    function ChaptersTab({ data, setData }) {

      const updateChapter = (index, field, value) => { const newChapters = [...data]; newChapters[index][field] = value; setData(newChapters); };

      return (
        <div className="space-y-6">

                <div className="w-1/4"><input type="text" value={chap.title} onChange={(e) => updateChapter(idx, 'title', e.target.value)} className="w-full font-bold text-gray-800 bg-transparent border-b border-transparent hover:border-gray-300 focus:border-indigo-500 focus:outline-none py-1" placeholder="章节名" /></div>
                <div className="w-3/4 pr-6 relative">
                  <div className="absolute right-0 top-1"><button onClick={() => updateChapter(idx, 'summary', getRandom(gachaPools.chapterEvents))} className="text-indigo-400 hover:text-indigo-600 p-1 bg-indigo-50 rounded"><i className="ph-bold ph-magic-wand"></i></button></div>
                  <textarea value={chap.summary} onChange={(e) => updateChapter(idx, 'summary', e.target.value)} className="w-full text-gray-600 bg-transparent border-b border-transparent hover:border-gray-300 focus:border-indigo-500 focus:outline-none py-1 resize-none pr-8 custom-scrollbar" placeholder="一句话说明本章核心事件..." rows={2} />
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AnalysisTab({ data, updateData, executeWithAI, showAlert }) {
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const handleAnalyze = () => {
        if (!data.referenceText?.trim()) return;
        executeWithAI(async (apiKey) => {
          setIsAnalyzing(true);
          const promptText = `你是一位顶尖的网文拆书专家。请分析以下用户提供的参考小说/爆款文段，精准提炼出其“写作风格”和“剧情套路”，以便作为后续AI仿写的System Prompt指导。\n\n参考文本：\n"""\n${data.referenceText}\n"""`;
          const payload = { contents: [{ parts: [{ text: promptText }] }], generationConfig: { responseMimeType: "application/json", responseSchema: { type: "OBJECT", properties: { style: { type: "STRING" }, plotElements: { type: "STRING" } } } } };
          const fetchAIText = async () => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            let retries = 3, delay = 1000;
            while (retries > 0) {
              try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error();
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text;
              } catch (e) { retries--; await new Promise(r => setTimeout(r, delay)); delay*=2; }
            }
          };
          try {
            const jsonText = await fetchAIText();
            const parsedData = parseAIJSON(jsonText); 
            updateData('style', parsedData.style || ''); updateData('plotElements', parsedData.plotElements || '');
          } catch (error) { showAlert('分析失败', '请检查网络或API Key', 'danger'); } finally { setIsAnalyzing(false); }
        });
      };

      return (
        <div className="space-y-8 animate-fadeIn">
          <div className="bg-white p-6 border border-gray-200 rounded-xl shadow-sm">
            <div className="flex justify-between items-start mb-4">
              <div><h3 className="text-lg font-bold text-gray-900 flex items-center gap-2"><i className="ph-fill ph-magnifying-glass text-indigo-600"></i> 参考文本导入</h3></div>
              <button onClick={handleAnalyze} disabled={isAnalyzing || !data.referenceText} className={`flex items-center gap-2 px-4 py-2 rounded-lg font-medium text-white transition-all ${isAnalyzing || !data.referenceText ? 'bg-indigo-400' : 'bg-indigo-600 hover:bg-indigo-700 shadow-md'}`}>
                {isAnalyzing ? <i className="ph-bold ph-spinner ph-spin"></i> : <i className="ph-bold ph-magic-wand"></i>} {isAnalyzing ? '正在拆解中...' : '开始AI拆书'}
              </button>
            </div>
            <textarea value={data.referenceText || ''} onChange={(e) => updateData('referenceText', e.target.value)} placeholder="粘贴几千字的优秀小说正文片段..." className="w-full h-48 p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none resize-none bg-gray-50 text-gray-700 custom-scrollbar" />
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-amber-50 p-6 border border-amber-200 rounded-xl">
               <h4 className="font-bold text-amber-900 mb-2">提炼：专属写作风格</h4>
               <textarea value={data.style || ''} onChange={(e) => updateData('style', e.target.value)} className="w-full h-40 p-3 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none resize-none bg-white/50 text-gray-800 custom-scrollbar" />
            </div>
            <div className="bg-purple-50 p-6 border border-purple-200 rounded-xl">
               <h4 className="font-bold text-purple-900 mb-2">提炼：剧情结构套路</h4>
               <textarea value={data.plotElements || ''} onChange={(e) => updateData('plotElements', e.target.value)} className="w-full h-40 p-3 border border-purple-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none resize-none bg-white/50 text-gray-800 custom-scrollbar" />
            </div>
          </div>
        </div>
      );
    }

    function WritingTab({ book, setChapters, executeWithAI, showAlert }) {
      const chapters = book.chapters || [];
      const [activeChapId, setActiveChapId] = useState(chapters[0]?.id || null);
      const [isDarkMode, setIsDarkMode] = useState(true);
      const [isGenerating, setIsGenerating] = useState(false);
      
      const [showSidebar, setShowSidebar] = useState(false);
      const [sidebarTab, setSidebarTab] = useState('polish'); 
      const [selectedText, setSelectedText] = useState('');
      const [polishResult, setPolishResult] = useState('');
      const [isPolishing, setIsPolishing] = useState(false);
      
      const [brainstormResults, setBrainstormResults] = useState([]);
      const [isBrainstorming, setIsBrainstorming] = useState(false);
      const textareaRef = useRef(null);

      useEffect(() => {
        if (chapters.length > 0 && !chapters.find(c => c.id === activeChapId)) setActiveChapId(chapters[0].id);
        setPolishResult(''); setBrainstormResults([]); setSelectedText('');
      }, [chapters, activeChapId]);

      const activeChap = chapters.find(c => c.id === activeChapId);
      const updateContent = (val) => setChapters(chapters.map(c => c.id === activeChapId ? { ...c, content: val } : c));
      
      const handleClear = () => showAlert('清空确认', '确定要清空本章内容吗？此操作无法撤回！', 'danger', () => updateContent(''));
      const handleCopy = () => navigator.clipboard.writeText(activeChap?.content || '');

      const handleTextSelect = () => {
        if (textareaRef.current) {
          const text = textareaRef.current.value.substring(textareaRef.current.selectionStart, textareaRef.current.selectionEnd);
          if (text.trim().length > 0) { setSelectedText(text); if(!showSidebar) setShowSidebar(true); setSidebarTab('polish'); }
        }
      };

      const handleAIPolish = (styleInstruction) => {
        if (!selectedText) { showAlert('提示', '请先在左侧正文中选中一段文字', 'info'); return; }
        executeWithAI(async (apiKey) => {
          setIsPolishing(true); setPolishResult('');
          const prompt = `你是一位顶级网文编辑。请对用户选中的文本进行润色/重写。\n【基调】：${book.basic.tone||'无'}\n【原文本】："""${selectedText}"""\n【指令】：${styleInstruction}\n只输出润色后的文本。`;
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
            const data = await res.json();
            setPolishResult(data.candidates[0].content.parts[0].text.trim());
          } catch (e) { showAlert('错误', '润色失败', 'danger'); } finally { setIsPolishing(false); }
        });
      };

      const applyPolishResult = () => {
        if (!textareaRef.current || !polishResult) return;
        const start = textareaRef.current.selectionStart; const end = textareaRef.current.selectionEnd;
        const curr = activeChap.content || '';
        updateContent(curr.substring(0, start) + polishResult + curr.substring(end));
        setSelectedText(''); setPolishResult('');
      };

      const handleAIBrainstorm = () => {
        executeWithAI(async (apiKey) => {
          setIsBrainstorming(true); setBrainstormResults([]);
          const prompt = `你是一位顶级网文剧情架构师。推演3个截然不同的后续剧情走向。返回 JSON 数组 [{"title":"","description":""}]。\n【本章细纲】：${activeChap.summary}\n【当前正文】："""${(activeChap.content||'').slice(-1000)}"""`;
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } }) });
            const data = await res.json();
            setBrainstormResults(parseAIJSON(data.candidates[0].content.parts[0].text));
          } catch (e) { showAlert('错误', '推演失败', 'danger'); } finally { setIsBrainstorming(false); }
        });
      };

      const handleAIGenerate = () => {
        if (!activeChap) return;
        executeWithAI(async (apiKey) => {
          setIsGenerating(true);
          const prompt = `你是一位专业小说家。请根据以下设定创作正文。严格遵循设定，不解释。\n【书名】${book.basic.title}\n【背景】${book.world.geography}\n【细纲】${activeChap.summary}\n【风格】${book.styleGuide?.style||'无'}\n【已有正文】：${activeChap.content ? '续写这部分：\n'+activeChap.content : '从头开始写本章'}`;
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
            const data = await res.json();
            const sep = activeChap.content && !activeChap.content.endsWith('\n') ? '\n\n' : '';
            updateContent((activeChap.content || '') + sep + data.candidates[0].content.parts[0].text.trim());
          } catch (e) { showAlert('错误', '代写失败', 'danger'); } finally { setIsGenerating(false); }
        });
      };

      if (chapters.length === 0) return <div className="h-full min-h-[500px] flex items-center justify-center flex-col text-gray-400 bg-gray-50 rounded-2xl border-2 border-dashed"><i className="ph-fill ph-pen-nib text-5xl mb-4 text-gray-300"></i><p>请先在“章节细纲”中创建章节。</p></div>;

      return (
        <div className={`flex h-[calc(100vh-220px)] min-h-[600px] border rounded-2xl overflow-hidden transition-colors ${isDarkMode ? 'bg-[#1e1e1e] border-[#2d2d2d]' : 'bg-white border-gray-200'}`}>
          <div className={`w-64 flex flex-col border-r shrink-0 ${isDarkMode ? 'border-[#2d2d2d] bg-[#181818]' : 'border-gray-200 bg-gray-50'}`}>
            <div className={`p-4 font-bold text-sm border-b ${isDarkMode ? 'border-[#2d2d2d] text-gray-400' : 'border-gray-200 text-gray-500'}`}>卷纲与目录</div>
            <div className={`flex-1 overflow-y-auto py-2 custom-scrollbar ${isDarkMode ? 'dark-scrollbar' : ''}`}>
              {chapters.map(chap => <button key={chap.id} onClick={() => setActiveChapId(chap.id)} className={`w-full text-left px-5 py-3.5 text-sm truncate border-l-2 ${activeChapId === chap.id ? (isDarkMode ? 'bg-[#252525] text-indigo-400 border-indigo-500' : 'bg-indigo-50 text-indigo-600 border-indigo-500') : (isDarkMode ? 'text-gray-500 border-transparent hover:bg-[#202020]' : 'text-gray-600 border-transparent hover:bg-gray-100')}`}>{chap.title || '未命名章节'}</button>)}
            </div>
          </div>
          <div className="flex-1 flex flex-col relative min-w-[300px]">
            <div className={`flex justify-between items-center px-6 py-3 border-b ${isDarkMode ? 'border-[#2d2d2d] bg-[#1e1e1e]' : 'border-gray-100 bg-white'}`}>
               <div className={`text-sm flex items-center gap-2 ${isDarkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                  <span className="font-mono font-bold">字数: {activeChap?.content?.length || 0}</span>
               </div>
               <div className="flex gap-2">
                 <button onClick={handleAIGenerate} disabled={isGenerating} className={`flex items-center gap-1 px-4 py-1.5 rounded-lg text-sm font-medium ${isGenerating ? 'bg-indigo-400 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md'}`}>
                   {isGenerating ? <i className="ph-bold ph-spinner ph-spin"></i> : <i className="ph-bold ph-sparkle"></i>} {activeChap?.content ? 'AI 续写' : 'AI 帮写本章'}
                 </button>
                 <div className={`w-px h-6 my-auto mx-1 ${isDarkMode ? 'bg-[#333]' : 'bg-gray-200'}`}></div>
                 <button onClick={() => setIsDarkMode(!isDarkMode)} className={`p-2 rounded-lg ${isDarkMode ? 'text-gray-400 hover:bg-[#2d2d2d] hover:text-yellow-400' : 'text-gray-500 hover:bg-gray-100'}`}><i className={`ph-bold ${isDarkMode ? 'ph-sun' : 'ph-moon'} text-lg`}></i></button>
                 <button onClick={handleClear} className={`p-2 rounded-lg ${isDarkMode ? 'text-gray-400 hover:bg-[#2d2d2d] hover:text-red-400' : 'text-gray-500 hover:bg-gray-100 hover:text-red-500'}`} title="清空"><i className="ph-bold ph-trash text-lg"></i></button>
                 <button onClick={() => setShowSidebar(!showSidebar)} className={`p-2 rounded-lg ${showSidebar ? (isDarkMode ? 'bg-indigo-900/50 text-indigo-400' : 'bg-indigo-50 text-indigo-600') : (isDarkMode ? 'text-gray-400 hover:bg-[#2d2d2d]' : 'text-gray-500 hover:bg-gray-100')}`}><i className={`ph-bold ${showSidebar ? 'ph-caret-right' : 'ph-caret-left'} text-lg`}></i></button>
               </div>
            </div>
            <div className={`flex-1 overflow-y-auto p-14 custom-scrollbar ${isDarkMode ? 'dark-scrollbar' : ''}`}>
               <div className="max-w-3xl mx-auto h-full flex flex-col">
                   <h2 className={`text-3xl font-bold mb-6 ${isDarkMode ? 'text-gray-200' : 'text-gray-900'}`}>{activeChap?.title || '未命名'}</h2>
                   {activeChap?.summary && <div className={`mb-8 p-4 rounded-xl text-sm border-l-4 ${isDarkMode ? 'bg-[#252525] border-indigo-500/50 text-gray-400' : 'bg-indigo-50 border-indigo-400 text-indigo-800'}`}><strong>本章核心事件：</strong>{activeChap.summary}</div>}
                   <textarea ref={textareaRef} value={activeChap?.content || ''} onChange={(e) => updateContent(e.target.value)} onMouseUp={handleTextSelect} onKeyUp={handleTextSelect} placeholder="沉下心来，开始创作... 选中文本可唤起右侧 AI 润色" className={`w-full flex-1 resize-none outline-none text-lg leading-loose bg-transparent ${isDarkMode ? 'text-gray-300 placeholder-gray-600' : 'text-gray-700 placeholder-gray-300'}`} />
               </div>
            </div>
          </div>
          {showSidebar && (
            <div className={`w-80 flex flex-col border-l shrink-0 shadow-xl z-10 ${isDarkMode ? 'border-[#2d2d2d] bg-[#1a1a1a]' : 'border-gray-200 bg-white'}`}>
              <div className="flex w-full border-b border-gray-200 dark:border-[#2d2d2d]">
                <button onClick={() => setSidebarTab('polish')} className={`flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 ${sidebarTab === 'polish' ? 'border-b-2 border-indigo-500 text-indigo-500' : (isDarkMode ? 'text-gray-500' : 'text-gray-500')}`}><i className="ph-bold ph-eraser"></i> 划词润色</button>
                <button onClick={() => setSidebarTab('brainstorm')} className={`flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 ${sidebarTab === 'brainstorm' ? 'border-b-2 border-indigo-500 text-indigo-500' : (isDarkMode ? 'text-gray-500' : 'text-gray-500')}`}><i className="ph-bold ph-git-branch"></i> 剧情推演</button>
              </div>
              <div className={`flex-1 overflow-y-auto p-4 custom-scrollbar ${isDarkMode ? 'dark-scrollbar' : ''}`}>
                {sidebarTab === 'polish' ? (
                  <div className="space-y-4 animate-fadeIn">
                    <div className={`p-3 rounded-lg text-sm border border-dashed ${selectedText ? (isDarkMode ? 'border-indigo-500/50 bg-[#252525] text-gray-300' : 'border-indigo-300 bg-indigo-50 text-indigo-800') : (isDarkMode ? 'border-gray-700 text-gray-500' : 'border-gray-300 text-gray-500')}`}>
                      {selectedText ? `已选中: "${selectedText.length>30?selectedText.substring(0,30)+'...':selectedText}"` : '请在正文中选中一段文字。'}
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      {[ {l:'画面拓展', p:'转换为具画面感沉浸式描写'}, {l:'心理加深', p:'增强心理描写深度'}, {l:'动作精简', p:'改写得杀伐果断、节奏紧凑'}, {l:'语气幽默', p:'加入吐槽幽默语调'} ].map(b => (
                        <button key={b.l} disabled={!selectedText||isPolishing} onClick={()=>handleAIPolish(b.p)} className={`py-2 px-1 rounded border text-xs text-center ${!selectedText ? 'opacity-50 border-gray-200' : (isDarkMode ? 'border-gray-700 hover:border-indigo-500 text-gray-300' : 'border-gray-200 hover:border-indigo-500 text-gray-600')}`}>{b.l}</button>
                      ))}
                    </div>
                    {isPolishing ? <div className={`p-6 flex flex-col items-center rounded-xl text-sm ${isDarkMode ? 'bg-[#252525] text-indigo-400' : 'bg-indigo-50 text-indigo-600'}`}><i className="ph-bold ph-spinner ph-spin text-2xl mb-2"></i>正在字斟句酌...</div> : polishResult ? <div className="space-y-3"><div className={`p-4 rounded-xl text-sm leading-relaxed border ${isDarkMode ? 'bg-[#252525] border-[#333] text-gray-200' : 'bg-white border-gray-200 text-gray-800'}`}>{polishResult}</div><button onClick={applyPolishResult} className="w-full py-2 bg-indigo-600 text-white rounded-lg text-sm">替换选中内容</button></div> : null}
                  </div>
                ) : (
                  <div className="space-y-4 animate-fadeIn">
                    <button onClick={handleAIBrainstorm} disabled={isBrainstorming} className={`w-full flex justify-center items-center gap-2 py-3 rounded-xl font-medium text-white shadow-md ${isBrainstorming ? 'bg-indigo-400' : 'bg-indigo-600 hover:bg-indigo-700'}`}>
                      {isBrainstorming ? <i className="ph-bold ph-spinner ph-spin"></i> : <i className="ph-bold ph-git-branch"></i>} {isBrainstorming ? '推演中...' : '开始推演后续剧情'}
                    </button>
                    {brainstormResults.map((b, i) => (
                      <div key={i} className={`p-4 rounded-xl border ${isDarkMode ? 'bg-[#252525] border-[#333]' : 'bg-white border-gray-200'}`}>
                        <h4 className={`font-bold text-sm mb-1 ${isDarkMode?'text-indigo-400':'text-indigo-600'}`}>分支 {i+1}: {b.title}</h4>
                        <p className={`text-xs ${isDarkMode?'text-gray-300':'text-gray-600'}`}>{b.description}</p>
                        <button onClick={() => updateContent((activeChap.content||'') + `\n\n【备忘：${b.title}】\n${b.description}\n`)} className={`mt-3 text-xs flex items-center gap-1 ${isDarkMode?'text-gray-400 hover:text-white':'text-gray-500 hover:text-black'}`}><i className="ph-bold ph-plus"></i>存入正文末尾</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
