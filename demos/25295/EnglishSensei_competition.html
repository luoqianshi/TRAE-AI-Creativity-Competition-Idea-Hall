<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能英语阅读助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .app-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .app-title {
            text-align: center;
            font-size: 1.8em;
            color: #333;
            margin-bottom: 30px;
        }
        .input-section { margin-bottom: 30px; }
        .input-section label {
            display: block;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            font-family: inherit;
        }
        textarea:focus { outline: none; border-color: #667eea; }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover { opacity: 0.9; }
        .result-section { display: none; margin-top: 30px; }
        .result-section.show { display: block; }

        /* 两栏布局 */
        .layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 25px;
        }
        .main-content { min-width: 0; }
        .sidebar { min-width: 0; }

        /* 统计信息 */
        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: #f8f9fa;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .stat-item span { font-weight: bold; color: #667eea; }

        /* 内容卡片 */
        .content-block {
            background: #fff;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #e8e8e8;
        }
        .block-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        /* 标注文本 */
        .annotated-text {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            line-height: 2.2;
            font-size: 1.1em;
        }
        .word {
            cursor: help;
            padding: 3px 8px;
            border-radius: 4px;
            margin: 0 2px;
            font-weight: 500;
        }
        .word-core { background: #ffeaa7; color: #d63031; }
        .word-common { background: #81ecec; color: #00b894; }
        .word-proper { background: #dfe6e9; color: #636e72; font-style: italic; }
        .word-new { background: #fd79a8; color: #fff; }

        /* 颜色说明 */
        .color-legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.9em;
            flex-wrap: wrap;
        }

        /* 翻译 */
        .translation-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf3 100%);
            padding: 25px;
            border-radius: 12px;
            line-height: 2;
        }
        .translation-box ul { margin-left: 20px; margin-top: 10px; }
        .translation-box li { margin-bottom: 5px; }

        /* 例句 */
        .example-card {
            background: #fffaf0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 4px solid #667eea;
        }
        .example-card .word-title {
            font-size: 1.05em;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .example-card .word-title span {
            color: #888;
            font-size: 0.85em;
            font-weight: normal;
        }
        .example-card ul { list-style: none; padding: 0; }
        .example-card li {
            padding: 5px 0;
            border-bottom: 1px dashed #eee;
            font-size: 0.92em;
            color: #555;
        }
        .example-card li:last-child { border-bottom: none; }

        /* 右侧生词表 */
        .vocab-list {
            position: sticky;
            top: 20px;
        }
        .vocab-section {
            margin-bottom: 20px;
        }
        .vocab-section-title {
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.95em;
        }
        .vocab-section-title.core { background: #ffeaa7; color: #d63031; }
        .vocab-section-title.common { background: #81ecec; color: #00b894; }
        .vocab-section-title.proper { background: #dfe6e9; color: #636e72; }
        .vocab-section-title.new { background: #fd79a8; color: #fff; }

        .vocab-items {
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }
        .vocab-item {
            padding: 8px 10px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9em;
        }
        .vocab-item .word-en { font-weight: bold; color: #333; }
        .vocab-item .word-cn { color: #888; margin-left: 8px; }

        .loading { text-align: center; padding: 40px; color: #888; }
        .tip {
            background: #fff3cd;
            padding: 12px 15px;
            border-radius: 8px;
            color: #856404;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .vocab-list { position: static; }
        }
    </style>
</head>

            <div class="result-section" id="resultSection">

        function analyzeText() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                alert('请输入英文文本');
                return;
            }
            document.getElementById('resultSection').classList.add('show');
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultContent').style.display = 'none';
            setTimeout(() => {
                processText(text);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultContent').style.display = 'grid';
            }, 800);
        }

        function processText(text) {
            // 分词
            const words = text.match(/[a-zA-Z]+/g) || [];
            const uniqueWords = [...new Set(words.map(w => w.toLowerCase()))];
            
            // 分类
            const core = [], common = [], proper = [], newWords = [];
            const wordInfo = {};

            uniqueWords.forEach(lowerWord => {
                // 跳过基础词汇（简单词）
                if (basicWords.has(lowerWord)) {
                    wordInfo[lowerWord] = { type: 'skip', meaning: '' };
                    return;
                }

                let type, meaning;

                if (coreWords[lowerWord]) {
                    type = 'core';
                    meaning = coreWords[lowerWord];
                    core.push({ word: lowerWord, meaning });
                } else if (properNouns[lowerWord]) {
                    type = 'proper';
                    meaning = properNouns[lowerWord];
                    proper.push({ word: lowerWord, meaning });
                } else if (commonWords[lowerWord]) {
                    type = 'common';
                    meaning = commonWords[lowerWord];
                    common.push({ word: lowerWord, meaning });
                } else {
                    const originalWord = words.find(w => w.toLowerCase() === lowerWord);
                    if (originalWord && originalWord[0] === originalWord[0].toUpperCase() && 
                        originalWord.length > 2) {
                        type = 'proper';
                        meaning = '专有名词（' + originalWord + '）';
                        proper.push({ word: originalWord, meaning });
                    } else {
                        type = 'new';
                        meaning = '待查词';
                        newWords.push({ word: lowerWord, meaning });
                    }
                }
                wordInfo[lowerWord] = { type, meaning };
            });

            // 更新统计
            document.getElementById('totalWords').textContent = words.length;
            document.getElementById('coreCount').textContent = core.length;
            document.getElementById('commonCount').textContent = common.length;
            document.getElementById('properCount').textContent = proper.length;
            document.getElementById('newCount').textContent = newWords.length;

            // 生成标注文本（只标注核心、一般、专有、生词，不含简单词）
            let annotated = text;
            const sortedWords = Object.entries(wordInfo)
                .filter(([_, info]) => info.type !== 'skip')
                .sort((a, b) => b[0].length - a[0].length);

            sortedWords.forEach(([lowerWord, info]) => {
                const regex = new RegExp(`\\b(${lowerWord})\\b`, 'gi');
                annotated = annotated.replace(regex,
                    `<span class="word word-${info.type}" title="${info.meaning}">$1</span>`);
            });
            document.getElementById('annotatedText').innerHTML = annotated;

            // 生成翻译
            let result = '<p>以下是文本中的关键词汇释义（从上下文推断）：</p><ul>';
            const important = [...core.slice(0, 10), ...newWords.slice(0, 10)];
            if (important.length === 0) {
                result = '<p>此文本词汇较简单，无特殊标注词汇。</p>';
            } else {
                important.forEach(item => {
                    result += `<li><strong>${item.word}</strong>：${item.meaning}</li>`;
                });
                result += '</ul>';
                result += '<p style="margin-top:10px;color:#666;font-size:0.9em;">💡 将鼠标悬停在标注词汇上可查看含义。</p>';
            }
            document.getElementById('translationText').innerHTML = result;

            // 生成例句
            let examplesHTML = '';
            const wordsWithExamples = [...core.slice(0, 8), ...newWords.slice(0, 5)];
            if (wordsWithExamples.length === 0) {
                examplesHTML = '<p style="color:#888;">无需例句。</p>';
            } else {
                wordsWithExamples.forEach(item => {
                    const w = item.word;
                    const ex1 = `This is an example of ${w} in context.`;
                    const ex2 = `The word "${w}" is important to understand.`;
                    const ex3 = `You can use ${w} in various situations.`;
                    examplesHTML += `
                        <div class="example-card">
                            <div class="word-title">${w} <span>(${item.meaning})</span></div>
                            <ul>
                                <li>${ex1}</li>
                                <li>${ex2}</li>
                                <li>${ex3}</li>
                            </ul>
                        </div>
                    `;
                });
            }
            document.getElementById('examplesContainer').innerHTML = examplesHTML;

            // 右侧词汇分类表
            let vocabHTML = '';
            const addVocabSection = (title, items, cls) => {
                if (items.length === 0) return;
                vocabHTML += `
                    <div class="vocab-section">
                        <div class="vocab-section-title ${cls}">${title} (${items.length})</div>
                        <div class="vocab-items">
                            ${items.map(item => `
                                <div class="vocab-item">
                                    <span class="word-en">${item.word}</span>
                                    <span class="word-cn">${item.meaning}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            };

            addVocabSection('核心词汇', core, 'core');
            addVocabSection('一般词汇', common, 'common');
            addVocabSection('专有词汇', proper, 'proper');
            addVocabSection('生词', newWords, 'new');

            if (!vocabHTML) {
                vocabHTML = '<p style="color:#888;padding:15px;">无词汇标注。</p>';
            }
            document.getElementById('vocabContent').innerHTML = vocabHTML;
        }
    </script>
