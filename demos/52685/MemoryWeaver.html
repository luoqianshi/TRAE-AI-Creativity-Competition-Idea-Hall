<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆星图 - 互动原型展示</title>
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #4b0082;
            --text-light: #f0f8ff;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a0b2e 0%, #000000 100%);
            color: var(--text-light);
            overflow: hidden;
            height: 100vh;
        }

        /* Canvas 背景 */
        #constellation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 玻璃拟态 UI 层 */
        .ui-layer {
            position: relative;
            z-index: 10;
            display: flex;
            height: 100vh;
            pointer-events: none; /* 让鼠标穿透到 canvas */
        }

        /* 侧边栏 */
        .sidebar {
            width: 350px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border);
            padding: 30px;
            display: flex;
            flex-direction: column;
            pointer-events: auto; /* 恢复鼠标交互 */
            box-shadow: 5px 0 20px rgba(0,0,0,0.5);
        }

        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #d4a5ff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            color: #b0c4de;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* 记忆录入表单 */
        .add-memory-form {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #d8bfd8;
        }

        input, textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #d4a5ff;
            background: rgba(255, 255, 255, 0.15);
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #8a2be2, #4b0082);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s transform, 0.3s box-shadow;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.5);
        }

        /* 弹窗/模态框 */
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(20, 10, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            opacity: 0;
            visibility: hidden;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            z-index: 20;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal h2 {
            color: #d4a5ff;
            margin-bottom: 10px;
        }
        
        .modal .date {
            font-size: 12px;
            color: #888;
            margin-bottom: 20px;
        }

        .modal p {
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .close-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            width: auto;
            padding: 8px 20px;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        /* 指引文字 */
        .instruction {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: var(--glass-bg);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            font-size: 14px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(138, 43, 226, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(138, 43, 226, 0); }
            100% { box-shadow: 0 0 0 0 rgba(138, 43, 226, 0); }
        }

    </style>
</head>
<body>

    <!-- 交互星空画布 -->
    <canvas id="constellation"></canvas>

    <!-- UI 操作层 -->
    <div class="ui-layer">
        <div class="sidebar">
            <div class="header">
                <h1>记忆星图 ✨</h1>
                <p>为阿尔茨海默症家庭打造的数字记忆疗法。每一个光点，都是不该被遗忘的珍贵瞬间。</p>
            </div>

            <div class="add-memory-form">
                <div class="form-group">
                    <label>记忆标题</label>
                    <input type="text" id="m-title" placeholder="例如：2008年全家福">
                </div>
                <div class="form-group">
                    <label>发生时间</label>
                    <input type="date" id="m-date">
                </div>
                <div class="form-group">
                    <label>记忆详情 / 唤醒线索</label>
                    <textarea id="m-desc" placeholder="描述这个记忆，用于辅助长辈回忆..."></textarea>
                </div>
                <button onclick="addMemory()">化作星辰 (添加记忆)</button>
            </div>
        </div>

        <div class="instruction">
            🖱️ 移动鼠标连接记忆 | 👆 点击星光查看回忆
        </div>
    </div>

    <!-- 记忆详情弹窗 -->
    <div class="modal" id="memoryModal">
        <h2 id="modalTitle">记忆标题</h2>
        <div class="date" id="modalDate">2023-10-01</div>
        <p id="modalDesc">这是记忆的详细内容...</p>
        <button class="close-btn" onclick="closeModal()">关闭回忆</button>
    </div>

    <script>
        // Canvas 设置
        const canvas = document.getElementById('constellation');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        // 默认预设记忆数据
        const presetMemories = [
            { title: "孙子的出生", date: "2015-06-12", desc: "那天下着小雨，你在产房外激动得一直搓手。明明是个小男孩，却有着大大的眼睛。" },
            { title: "六十岁大寿", date: "2010-10-01", desc: "全家人在老宅院子里摆了三桌，你最爱吃的那道红烧肉是老伴亲自下厨做的。" },
            { title: "第一次看海", date: "1998-08-15", desc: "带着孩子们去了青岛。那是你第一次看到真正的大海，海风吹飞了你的草帽。" },
            { title: "结婚纪念日", date: "1980-05-20", desc: "没有昂贵的礼物，只有一辆老式自行车，你载着她穿过了整个胡同。" }
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // 鼠标事件
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        window.addEventListener('mouseout', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // 粒子(记忆节点)类
        class Particle {
            constructor(x, y, memoryData = null) {
                this.x = x || Math.random() * (width - 400) + 400; // 避开侧边栏
                this.y = y || Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.baseRadius = memoryData ? 6 : Math.random() * 2 + 1; // 包含记忆的节点更大
                this.radius = this.baseRadius;
                this.memory = memoryData; // 绑定的记忆数据
                this.color = memoryData ? '#d4a5ff' : '#ffffff';
                this.glow = memoryData ? 15 : 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                if(this.glow > 0) {
                    ctx.shadowBlur = this.glow;
                    ctx.shadowColor = this.color;
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.fill();
                ctx.closePath();

                // 如果是记忆节点，画一个光环
                if(this.memory) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(212, 165, 255, 0.3)`;
                    ctx.stroke();
                    ctx.closePath();
                    
                    // 显示标题标签
                    ctx.font = "12px sans-serif";
                    ctx.fillStyle = "rgba(255,255,255,0.6)";
                    ctx.fillText(this.memory.title, this.x + 15, this.y + 4);
                }
            }

            update() {
                // 边界反弹
                if (this.x + this.radius > width || this.x - this.radius < 350) this.vx = -this.vx;
                if (this.y + this.radius > height || this.y - this.radius < 0) this.vy = -this.vy;

                this.x += this.vx;
                this.y += this.vy;

                // 鼠标交互放大
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        if (this.radius < this.baseRadius * 2) {
                            this.radius += 0.2;
                        }
                    } else if (this.radius > this.baseRadius) {
                        this.radius -= 0.1;
                    }
                }

                this.draw();
            }
        }

        // 初始化星空
        function init() {
            particles = [];
            // 生成普通星光背景
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
            // 注入核心记忆节点
            presetMemories.forEach(mem => {
                particles.push(new Particle(null, null, mem));
            });
        }

        // 动画连线逻辑
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();

                // 神经元连线
                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(138, 43, 226, ${1 - distance/120})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.closePath();
                    }
                }
            }
        }

        // 点击画布触发记忆查看
        canvas.addEventListener('click', (e) => {
            const clickX = e.clientX;
            const clickY = e.clientY;

            // 寻找被点击的记忆节点
            for(let p of particles) {
                if(p.memory) {
                    let dx = clickX - p.x;
                    let dy = clickY - p.y;
                    let distance = Math.sqrt(dx*dx + dy*dy);
                    if(distance < p.radius + 10) {
                        openModal(p.memory);
                        break;
                    }
                }
            }
        });

        // UI 逻辑：添加记忆
        function addMemory() {
            const title = document.getElementById('m-title').value;
            const date = document.getElementById('m-date').value;
            const desc = document.getElementById('m-desc').value;

            if(!title || !desc) {
                alert("请至少填写记忆标题和详情。");
                return;
            }

            const newMemory = { title, date: date || "未知时间", desc };
            // 在画布中央偏右生成新的记忆星
            const newParticle = new Particle(width/2 + 200, height/2, newMemory);
            
            // 炫酷的诞生动画（放大初始体积）
            newParticle.radius = 20; 
            particles.push(newParticle);

            // 清空表单
            document.getElementById('m-title').value = '';
            document.getElementById('m-date').value = '';
            document.getElementById('m-desc').value = '';

            // 提示
            const btn = document.querySelector('.add-memory-form button');
            btn.innerText = "添加成功！";
            btn.style.background = "#2e8b57";
            setTimeout(() => {
                btn.innerText = "化作星辰 (添加记忆)";
                btn.style.background = "linear-gradient(45deg, #8a2be2, #4b0082)";
            }, 2000);
        }

        // 模态框逻辑
        const modal = document.getElementById('memoryModal');
        function openModal(memory) {
            document.getElementById('modalTitle').innerText = memory.title;
            document.getElementById('modalDate').innerText = memory.date;
            document.getElementById('modalDesc').innerText = memory.desc;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // 启动
        init();
        animate();
    </script>
</body>
</html>
