<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心语 · 情绪搭子</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ========== CSS Variables ========== */
:root {
  --peach: #FFB5A7;
  --coral: #FCD5CE;
  --cream: #F9EAE1;
  --lavender: #C8B6E2;
  --sage: #A8C5A0;
  --warm-brown: #3D2C2E;
  --gold: #E8C4A0;
  --soft-pink: #FFE1D8;
  --light-lavender: #E8DFF5;
  --light-sage: #D4E4D0;
  --glass-bg: rgba(255, 255, 255, 0.25);
  --glass-border: rgba(255, 255, 255, 0.4);
  --shadow-soft: 0 8px 32px rgba(61, 44, 46, 0.08);
  --shadow-hover: 0 12px 40px rgba(61, 44, 46, 0.14);
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-full: 9999px;
  --font-display: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --font-hand: 'Ma Shan Zheng', cursive;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  color: var(--warm-brown);
  background: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== Animated Background ========== */
.bg-scene {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(135deg, var(--cream) 0%, var(--soft-pink) 40%, var(--light-lavender) 70%, var(--cream) 100%);
}
.bg-orb {
  position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5;
  animation: orbFloat 20s ease-in-out infinite;
}
.bg-orb:nth-child(1) {
  width: 500px; height: 500px; background: var(--peach);
  top: -10%; left: -5%; animation-delay: 0s;
}
.bg-orb:nth-child(2) {
  width: 400px; height: 400px; background: var(--lavender);
  top: 50%; right: -8%; animation-delay: -7s;
}
.bg-orb:nth-child(3) {
  width: 350px; height: 350px; background: var(--sage);
  bottom: -5%; left: 30%; animation-delay: -14s;
}
@keyframes orbFloat {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -40px) scale(1.05); }
  66% { transform: translate(-20px, 30px) scale(0.95); }
}

/* Noise overlay */
.bg-scene::after {
  content: ''; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  opacity: 0.4;
}

/* ========== App Shell ========== */
#app {
  position: relative; z-index: 1;
  min-height: 100vh;
}

.page { display: none; animation: fadeUp 0.6s ease-out; }
.page.active { display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Navigation ========== */
.nav-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(249, 234, 225, 0.7);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  transition: var(--transition);
}
.nav-logo {
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  background: linear-gradient(135deg, var(--warm-brown), #6B4C4E);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  cursor: pointer;
}
.nav-links { display: flex; gap: 8px; }
.nav-link {
  padding: 8px 20px; border-radius: var(--radius-full);
  font-size: 14px; font-weight: 500; color: var(--warm-brown);
  background: transparent; border: none; cursor: pointer;
  transition: var(--transition);
}
.nav-link:hover, .nav-link.active {
  background: var(--glass-bg); backdrop-filter: blur(8px);
  box-shadow: var(--shadow-soft);
}

/* ========== Glass Card ========== */
.glass-card {
  background: var(--glass-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-soft);
  transition: var(--transition);
}
.glass-card:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-4px);
}

/* ========== Buttons ========== */
.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 36px; border-radius: var(--radius-full);
  font-family: var(--font-body); font-size: 16px; font-weight: 600;
  color: white; border: none; cursor: pointer;
  background: linear-gradient(135deg, var(--peach), #E8A090);
  box-shadow: 0 4px 20px rgba(255, 181, 167, 0.4);
  transition: var(--transition);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(255, 181, 167, 0.55);
}
.btn-primary:active { transform: translateY(0); }

.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 28px; border-radius: var(--radius-full);
  font-family: var(--font-body); font-size: 15px; font-weight: 500;
  color: var(--warm-brown); background: var(--glass-bg);
  backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
  cursor: pointer; transition: var(--transition);
}
.btn-ghost:hover {
  background: rgba(255, 255, 255, 0.45);
  box-shadow: var(--shadow-soft);
}

/* ========== Welcome Page ========== */
.welcome-hero {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 120px 24px 80px; text-align: center;
}
.welcome-hero h1 {
  font-family: var(--font-display); font-size: clamp(42px, 7vw, 72px);
  font-weight: 700; line-height: 1.2; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--warm-brown) 0%, #6B4C4E 50%, var(--lavender) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.welcome-hero .subtitle {
  font-family: var(--font-hand); font-size: clamp(20px, 3vw, 28px);
  color: #8B6E6E; margin-bottom: 12px;
}
.welcome-hero .desc {
  font-size: 16px; color: #8B6E6E; max-width: 520px;
  line-height: 1.8; margin-bottom: 40px;
}
.welcome-hero .cta-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

.scroll-hint {
  margin-top: 60px; animation: bounce 2s infinite;
  color: #BFA0A0; font-size: 24px;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}

/* Preset Roles Section */
.preset-section {
  padding: 40px 24px 100px; max-width: 1100px; margin: 0 auto;
}
.preset-section h2 {
  font-family: var(--font-display); font-size: 28px; font-weight: 600;
  text-align: center; margin-bottom: 40px;
}
.preset-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.preset-card {
  padding: 28px; cursor: pointer; text-align: center;
  position: relative; overflow: hidden;
}
.preset-card::before {
  content: ''; position: absolute; inset: 0;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, transparent 60%, rgba(255,255,255,0.3));
  pointer-events: none;
}
.preset-avatar {
  width: 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; margin: 0 auto 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.preset-card h3 {
  font-size: 18px; font-weight: 600; margin-bottom: 8px;
}
.preset-card p {
  font-size: 13px; color: #8B6E6E; line-height: 1.6; margin-bottom: 12px;
}
.preset-tags { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.tag {
  padding: 4px 12px; border-radius: var(--radius-full);
  font-size: 12px; font-weight: 500;
  background: rgba(200, 182, 226, 0.2); color: #7B68AE;
}
.tag.sage { background: rgba(168, 197, 160, 0.2); color: #5E8B56; }
.tag.peach { background: rgba(255, 181, 167, 0.25); color: #C07060; }

/* ========== Workshop Page ========== */
.workshop-page {
  padding: 100px 24px 60px; max-width: 900px; margin: 0 auto;
}
.workshop-page h1 {
  font-family: var(--font-display); font-size: 32px; font-weight: 700;
  text-align: center; margin-bottom: 8px;
}
.workshop-page .subtitle {
  text-align: center; color: #8B6E6E; margin-bottom: 40px;
}
.workshop-steps {
  display: flex; justify-content: center; gap: 4px; margin-bottom: 40px;
}
.step-dot {
  width: 40px; height: 4px; border-radius: 2px;
  background: rgba(61,44,46,0.12); transition: var(--transition);
}
.step-dot.active { background: var(--peach); width: 60px; }
.step-dot.done { background: var(--sage); }

.workshop-step { display: none; animation: fadeUp 0.4s ease-out; }
.workshop-step.active { display: block; }

.form-group { margin-bottom: 24px; }
.form-group label {
  display: block; font-size: 14px; font-weight: 600;
  margin-bottom: 8px; color: var(--warm-brown);
}
.form-input {
  width: 100%; padding: 14px 20px;
  border-radius: var(--radius-lg); border: 1px solid rgba(61,44,46,0.1);
  background: rgba(255,255,255,0.5); backdrop-filter: blur(8px);
  font-family: var(--font-body); font-size: 15px; color: var(--warm-brown);
  outline: none; transition: var(--transition);
}
.form-input:focus {
  border-color: var(--peach);
  box-shadow: 0 0 0 3px rgba(255,181,167,0.2);
}
textarea.form-input { min-height: 100px; resize: vertical; }

/* Avatar Picker */
.avatar-picker { display: flex; gap: 12px; flex-wrap: wrap; }
.avatar-option {
  width: 56px; height: 56px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; cursor: pointer; border: 3px solid transparent;
  transition: var(--transition);
}
.avatar-option:hover { transform: scale(1.1); }
.avatar-option.selected {
  border-color: var(--peach);
  box-shadow: 0 0 0 3px rgba(255,181,167,0.3);
}

/* Custom Image Upload */
.image-upload-area {
  border: 2px dashed rgba(255,181,167,0.4);
  border-radius: var(--radius-lg);
  padding: 32px; text-align: center;
  cursor: pointer; transition: var(--transition);
  background: rgba(255,255,255,0.2);
}
.image-upload-area:hover {
  border-color: var(--peach);
  background: rgba(255,255,255,0.35);
}
.image-upload-area .upload-icon { font-size: 40px; color: var(--peach); margin-bottom: 12px; }
.image-upload-area .upload-text { font-size: 14px; color: #8B6E6E; }
.image-upload-area .upload-hint { font-size: 12px; color: #BFA0A0; margin-top: 4px; }
#custom-image-input { display: none; }
.custom-image-preview {
  width: 120px; height: 120px; border-radius: 50%;
  object-fit: cover; margin: 0 auto;
  border: 3px solid var(--peach);
  box-shadow: 0 4px 20px rgba(255,181,167,0.3);
}
.remove-image-btn {
  margin-top: 12px; padding: 6px 16px; border-radius: var(--radius-full);
  font-size: 12px; color: #C07060; background: rgba(255,181,167,0.15);
  border: 1px solid rgba(255,181,167,0.3); cursor: pointer;
  transition: var(--transition);
}
.remove-image-btn:hover { background: rgba(255,181,167,0.25); }

/* Personality Tags */
.tag-selector { display: flex; gap: 8px; flex-wrap: wrap; }
.tag-option {
  padding: 8px 18px; border-radius: var(--radius-full);
  font-size: 14px; cursor: pointer; border: 1px solid rgba(61,44,46,0.1);
  background: rgba(255,255,255,0.4); color: var(--warm-brown);
  transition: var(--transition); user-select: none;
}
.tag-option:hover { background: rgba(255,255,255,0.6); }
.tag-option.selected {
  background: rgba(255,181,167,0.25); border-color: var(--peach);
  color: #C07060;
}

/* Style Cards */
.style-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.style-card {
  padding: 20px; border-radius: var(--radius-lg);
  border: 2px solid transparent; cursor: pointer;
  background: rgba(255,255,255,0.35); text-align: center;
  transition: var(--transition);
}
.style-card:hover { background: rgba(255,255,255,0.55); }
.style-card.selected {
  border-color: var(--peach);
  background: rgba(255,181,167,0.12);
}
.style-card .icon { font-size: 32px; margin-bottom: 8px; }
.style-card h4 { font-size: 15px; font-weight: 600; }
.style-card p { font-size: 12px; color: #8B6E6E; margin-top: 4px; }

/* Tone Slider */
.tone-slider {
  width: 100%; -webkit-appearance: none; appearance: none;
  height: 6px; border-radius: 3px;
  background: linear-gradient(to right, var(--sage), var(--peach));
  outline: none;
}
.tone-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px;
  border-radius: 50%; background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15); cursor: pointer;
}
.tone-labels { display: flex; justify-content: space-between; margin-top: 8px; }
.tone-labels span { font-size: 12px; color: #8B6E6E; }

/* Workshop Actions */
.workshop-actions {
  display: flex; justify-content: space-between; gap: 12px;
  margin-top: 32px;
}

/* Preview Card */
.preview-card {
  padding: 24px; text-align: center; margin-top: 24px;
  border: 2px dashed rgba(255,181,167,0.4);
}
.preview-card .preview-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; margin: 0 auto 12px;
}

/* ========== Chat Page ========== */
.chat-page {
  display: flex;
  height: 100vh; overflow: hidden;
}

/* Character Side Panel */
.character-panel {
  width: 300px; flex-shrink: 0;
  background: linear-gradient(180deg, rgba(255,238,230,0.4) 0%, rgba(249,234,225,0.7) 100%);
  backdrop-filter: blur(16px);
  border-right: 1px solid rgba(61,44,46,0.06);
  display: flex; flex-direction: column;
  align-items: center; padding: 90px 20px 24px;
  position: relative; overflow: hidden;
}
.character-panel::before {
  content: ''; position: absolute;
  top: 60px; left: 50%; transform: translateX(-50%);
  width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,181,167,0.25) 0%, transparent 70%);
  filter: blur(20px);
  pointer-events: none;
}
.character-figure {
  width: 220px; height: 220px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 110px; margin-bottom: 20px;
  box-shadow: 0 12px 40px rgba(61,44,46,0.15), 0 0 0 4px rgba(255,255,255,0.5), 0 0 0 8px rgba(255,181,167,0.3);
  transition: var(--transition);
  animation: breathe 5s ease-in-out infinite;
  background: var(--light-lavender);
  position: relative; z-index: 1;
  overflow: hidden;
}
@keyframes breathe {
  0%, 100% { transform: scale(1); box-shadow: 0 12px 40px rgba(61,44,46,0.15), 0 0 0 4px rgba(255,255,255,0.5), 0 0 0 8px rgba(255,181,167,0.3); }
  50% { transform: scale(1.02); box-shadow: 0 16px 48px rgba(61,44,46,0.2), 0 0 0 4px rgba(255,255,255,0.6), 0 0 0 12px rgba(255,181,167,0.25); }
}
.character-figure img {
  width: 100%; height: 100%; border-radius: 50%;
  object-fit: cover;
}
.character-name {
  font-family: var(--font-display); font-size: 22px; font-weight: 700;
  margin-bottom: 4px; position: relative; z-index: 1;
}
.character-status {
  font-size: 13px; color: var(--sage); display: flex; align-items: center; gap: 4px;
  position: relative; z-index: 1;
}
.character-tags {
  display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  margin-top: 16px; margin-bottom: 4px;
  position: relative; z-index: 1;
}
.character-quote {
  margin-top: 20px; padding: 16px; border-radius: var(--radius-lg);
  background: rgba(255,255,255,0.45);
  font-family: var(--font-hand); font-size: 16px; color: #6B4C4E;
  text-align: center; line-height: 1.7;
  position: relative; z-index: 1;
  border-left: 3px solid var(--peach);
}

/* Chat Content Area */
.chat-content {
  flex: 1; display: flex; flex-direction: column;
  min-width: 0;
}
.chat-header {
  padding: 80px 24px 16px;
  background: rgba(249,234,225,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(61,44,46,0.06);
  display: flex; align-items: center; gap: 12px;
}
.chat-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  background: var(--light-lavender);
}
.chat-avatar img {
  width: 100%; height: 100%; border-radius: 50%;
  object-fit: cover;
}
.chat-header-info h3 { font-size: 16px; font-weight: 600; }
.chat-header-info .status {
  font-size: 12px; color: var(--sage);
  display: flex; align-items: center; gap: 4px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--sage); display: inline-block;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.chat-header-nav { margin-left: auto; display: flex; gap: 8px; }
.chat-header-nav button {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--glass-bg); border: 1px solid var(--glass-border);
  cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: var(--transition);
}
.chat-header-nav button:hover { background: rgba(255,255,255,0.5); }

/* Messages */
.chat-messages {
  flex: 1; overflow-y: auto; padding: 24px;
  display: flex; flex-direction: column; gap: 16px;
  scroll-behavior: smooth;
}
.msg { display: flex; gap: 10px; max-width: 75%; animation: msgIn 0.4s ease-out; }
.msg.ai { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(12px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.msg.ai .msg-avatar { background: var(--light-lavender); }
.msg.user .msg-avatar { background: var(--soft-pink); }
.msg-bubble {
  padding: 12px 18px; border-radius: 20px;
  font-size: 15px; line-height: 1.7;
}
.msg.ai .msg-bubble {
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(8px);
  border-bottom-left-radius: 6px;
}
.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--peach), #E8A090);
  color: white;
  border-bottom-right-radius: 6px;
}
.msg-emotion {
  font-size: 12px; margin-top: 4px; opacity: 0.6;
}
.msg.ai .msg-emotion { text-align: left; }
.msg.user .msg-emotion { text-align: right; }

/* Typing indicator */
.typing-indicator {
  display: flex; gap: 10px; align-self: flex-start;
  animation: msgIn 0.3s ease-out;
}
.typing-dots {
  padding: 14px 22px; border-radius: 20px;
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(8px);
  display: flex; gap: 4px; align-items: center;
}
.typing-dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--lavender);
  animation: typingBounce 1.4s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* Chat Input */
.chat-input-area {
  padding: 16px 24px 24px;
  background: rgba(249,234,225,0.85);
  backdrop-filter: blur(16px);
  border-top: 1px solid rgba(61,44,46,0.06);
}
.quick-emojis {
  display: flex; gap: 8px; margin-bottom: 12px;
  overflow-x: auto; padding-bottom: 4px;
}
.quick-emoji {
  padding: 4px 12px; border-radius: var(--radius-full);
  font-size: 13px; cursor: pointer;
  background: rgba(255,255,255,0.4);
  border: 1px solid rgba(61,44,46,0.06);
  white-space: nowrap; transition: var(--transition);
}
.quick-emoji:hover { background: rgba(255,255,255,0.7); }
.chat-input-row {
  display: flex; gap: 10px; align-items: flex-end;
}
.chat-input-row input {

  lost: {
    gentle: ['{greeting}，迷茫是很正常的，说明你在思考、在成长。不用急着找到答案，慢慢来。','{greeting}，每个人都有迷茫的时候。重要的是你没有停止思考，这就已经很好了。','别怕迷茫，{greeting}。有时候迷路才能发现意外的风景。我会陪你慢慢找到方向。'],
    playful: ['{greeting}，迷茫说明你在升级！游戏里打boss之前不都是迷雾嘛～','嘿{greeting}，迷茫是因为选项太多不是没有路！来，让我帮你理一理！','{greeting}，迷茫就对了！清醒的人都在迷茫，糊涂的人才装明白呢～'],
    rational: ['{greeting}，迷茫往往意味着选择的岔路口。不如我们列一下你面前的选项，逐一分析？','{greeting}，建议你先把最在意的东西排序，然后看哪个选择更符合你优先级的期待。','迷茫是思考的副产品，{greeting}。说明你不愿将就。我们一步步来梳理吧。'],
    literary: ['{greeting}，迷雾中的人，往往最接近出口。所有的困惑，都是黎明前最后的暗。','{greeting}，迷茫是成长写下的省略号，不是句号。后面的故事，还很长。','在十字路口的{greeting}，每个方向都有风景。选一条走吧，不必回头。'],
  },
  default: {
    gentle: ['{greeting}，我在听呢，继续说吧～','嗯嗯，{greeting}，我懂你的感受。想多说一点吗？','{greeting}，谢谢你愿意跟我聊这些，我会一直在这里的。'],
    playful: ['{greeting}，我在！快继续说，我超好奇的！','嗯嗯然后呢然后呢？{greeting}你说话真有意思！','{greeting}，有我在，聊天永远不会冷场！'],
    rational: ['{greeting}，我理解你的感受。想聊聊具体是什么情况吗？','嗯，{greeting}，这确实值得好好想想。你想从哪个角度聊？','{greeting}，我在认真听。你可以放心地表达你的想法。'],
    literary: ['{greeting}，你的每一个字，我都当作诗来读。','嗯，{greeting}，话语之间，我听见了更多没说出口的心事。','{greeting}，文字之外的情感，我也在用心感受。'],
  }
};

// State
let currentRole = null;
let messages = [];
let currentStep = 0;
let selectedAvatar = 0;
let selectedTags = [];
let selectedStyle = 'gentle';
let customImageData = null;

// ========== Navigation ==========
function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const target = document.getElementById('page-' + page);
  if (target) target.classList.add('active');

  document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
  const link = document.querySelector(`.nav-link[data-page="${page}"]`);
  if (link) link.classList.add('active');

  const navbar = document.getElementById('navbar');
  navbar.style.display = page === 'welcome' ? 'none' : 'flex';

  if (page === 'chat') initChat();
  if (page === 'profile') renderProfile();
  if (page === 'workshop') updatePreview();
}

// ========== Preset Roles ==========
function renderPresets() {
  const grid = document.getElementById('preset-grid');
  grid.innerHTML = PRESET_ROLES.map(r => {
    const avatarHtml = r.isCustomImage 
      ? `<img src="${r.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
      : r.avatar;
    const avatarBg = r.isCustomImage ? 'transparent' : r.avatarColor;
    return `
    <div class="glass-card preset-card" onclick="selectPreset('${r.id}')">
      <div class="preset-avatar" style="background:${avatarBg}">${avatarHtml}</div>
      <h3>${r.name}</h3>
      <p>${r.background.substring(0, 50)}…</p>
      <div class="preset-tags">
        ${r.personalityTags.map((t,i) => `<span class="tag ${['','sage','peach'][i%3]}">${t}</span>`).join('')}
      </div>
    </div>
  `}).join('');
}

function selectPreset(id) {
  const role = PRESET_ROLES.find(r => r.id === id);
  if (!role) return;
  currentRole = { ...role, id: genId() };
  messages = [];
  saveState();
  showToast(`已选择「${role.name}」，进入对话～`);
  navigate('chat');
}

// ========== Workshop ==========
function initWorkshop() {
  // Avatar picker
  const picker = document.getElementById('avatar-picker');
  picker.innerHTML = AVATARS.map((a, i) => `
    <div class="avatar-option ${i === 0 ? 'selected' : ''}" data-index="${i}" onclick="pickAvatar(${i})" style="background:${AVATAR_COLORS[i]}">${a}</div>
  `).join('');

  // Tags
  const tagSelector = document.getElementById('tag-selector');
  tagSelector.innerHTML = PERSONALITY_TAGS.map(t => `
    <div class="tag-option" onclick="toggleTag(this,'${t}')">${t}</div>
  `).join('');

  // Style cards
  const styleCards = document.getElementById('style-cards');
  styleCards.innerHTML = STYLES.map(s => `
    <div class="style-card ${s.id === selectedStyle ? 'selected' : ''}" data-style="${s.id}" onclick="pickStyle('${s.id}')">
      <div class="icon">${s.icon}</div>
      <h4>${s.name}</h4>
      <p>${s.desc}</p>
    </div>
  `).join('');
}

function pickAvatar(i) {
  selectedAvatar = i;
  document.querySelectorAll('.avatar-option').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
  updatePreview();
}

function toggleTag(el, tag) {
  el.classList.toggle('selected');
  if (selectedTags.includes(tag)) {
    selectedTags = selectedTags.filter(t => t !== tag);
  } else {
    selectedTags.push(tag);
  }
}

function pickStyle(id) {
  selectedStyle = id;
  document.querySelectorAll('.style-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.style === id);
  });
  updatePreview();
}

function handleImageUpload(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    customImageData = e.target?.result;
    document.getElementById('image-upload-area').style.display = 'none';
    document.getElementById('custom-image-preview-area').style.display = 'block';
    document.getElementById('custom-image-preview').src = customImageData;
    updatePreview();
  };
  reader.readAsDataURL(file);
}

function removeCustomImage() {
  customImageData = null;
  document.getElementById('image-upload-area').style.display = 'block';
  document.getElementById('custom-image-preview-area').style.display = 'none';
  document.getElementById('custom-image-input').value = '';
  updatePreview();
}

function nextStep() {
  if (currentStep === 0) {
    const name = document.getElementById('role-name').value.trim();
    if (!name) { showToast('给它起个名字吧～'); return; }
  }
  if (currentStep < 3) {
    currentStep++;
    updateStepUI();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    updateStepUI();
  }
}

function updateStepUI() {
  document.querySelectorAll('.workshop-step').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.step) === currentStep);
  });
  document.querySelectorAll('.step-dot').forEach((el, i) => {
    el.classList.remove('active', 'done');
    if (i === currentStep) el.classList.add('active');
    else if (i < currentStep) el.classList.add('done');
  });
  if (currentStep === 3) updatePreview();
}

function updatePreview() {
  const name = document.getElementById('role-name')?.value.trim() || '—';
  const styleObj = STYLES.find(s => s.id === selectedStyle);
  const previewAvatar = document.getElementById('preview-avatar');
  if (customImageData) {
    previewAvatar.innerHTML = `<img src="${customImageData}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    previewAvatar.style.background = 'transparent';
  } else {
    previewAvatar.innerHTML = AVATARS[selectedAvatar];
    previewAvatar.style.background = AVATAR_COLORS[selectedAvatar];
  }
  document.getElementById('preview-name').textContent = name;
  document.getElementById('preview-style').textContent = styleObj ? `${styleObj.icon} ${styleObj.name}` : '';
}

function createRole() {
  const name = document.getElementById('role-name').value.trim();
  const greeting = document.getElementById('role-greeting').value.trim() || '朋友';
  const background = document.getElementById('role-background').value.trim() || '一个温暖的倾听者，愿意陪你度过每一个时刻。';
  const toneLevel = parseInt(document.getElementById('tone-slider').value);

  currentRole = {
    id: genId(),
    name,
    avatar: customImageData || AVATARS[selectedAvatar],
    avatarColor: AVATAR_COLORS[selectedAvatar],
    isCustomImage: !!customImageData,
    greeting,
    personalityTags: selectedTags.length ? [...selectedTags] : ['温柔'],
    background,
    toneLevel,
    style: selectedStyle,
    createdAt: Date.now(),
  };
  messages = [];
  saveState();
  showToast(`「${name}」诞生了！开始对话吧 🎉`);
  navigate('chat');
}

// ========== Chat ==========
function initChat() {
  if (!currentRole) {
    navigate('welcome');
    return;
  }
  const avatarHtml = currentRole.isCustomImage 
    ? `<img src="${currentRole.avatar}" />` 
    : currentRole.avatar;
  
  document.getElementById('chat-avatar').innerHTML = avatarHtml;
  if (!currentRole.isCustomImage) {
    document.getElementById('chat-avatar').style.background = currentRole.avatarColor;
  } else {
    document.getElementById('chat-avatar').style.background = 'transparent';
  }
  document.getElementById('chat-name').textContent = currentRole.name;

  // Character panel
  document.getElementById('character-figure').innerHTML = avatarHtml;
  if (!currentRole.isCustomImage) {
    document.getElementById('character-figure').style.background = currentRole.avatarColor;
  } else {
    document.getElementById('character-figure').style.background = 'transparent';
  }
  document.getElementById('character-name').textContent = currentRole.name;
  
  // Tags
  const tagsHtml = currentRole.personalityTags.map((t, i) => 
    `<span class="tag ${['', 'sage', 'peach', 'sage', 'peach'][i%5]}">${t}</span>`
  ).join('');
  document.getElementById('character-tags').innerHTML = tagsHtml;
  
  document.getElementById('character-quote').textContent = currentRole.background.substring(0, 50) + '…';

  renderMessages();

  // If no messages, send greeting
  if (messages.length === 0) {
    const greeting = getGreeting();
    setTimeout(() => {
      addMessage('ai', greeting, 'warm');
    }, 800);
  }
}

function getGreeting() {
  const g = currentRole.greeting || '朋友';
  const hour = new Date().getHours();
  let timeWord = '嗨';
  if (hour < 6) timeWord = '夜深了';
  else if (hour < 12) timeWord = '早安';
  else if (hour < 18) timeWord = '下午好';
  else timeWord = '晚上好';

  const greetings = {
    gentle: `${timeWord}，${g}～我是${currentRole.name}，很高兴见到你。有什么想聊的，我都在这里哦 ☁️`,
    playful: `${timeWord}呀${g}！我是${currentRole.name}！终于等到你了，快说快说，我都迫不及待了！✨`,
    rational: `${timeWord}，${g}。我是${currentRole.name}，接下来的时间，我陪你。🌿`,
    literary: `${timeWord}，${g}。风翻到了你这一页，我便来了。我是${currentRole.name}，愿做你故事里的注脚。📖`,
  };
  return greetings[currentRole.style] || greetings.gentle;
}

function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage('user', text);

  // Show typing
  setTimeout(() => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      const reply = generateReply(text);
      const emotion = detectEmotion(text);
      addMessage('ai', reply, emotion);
    }, 1200 + Math.random() * 800);
  }, 300);
}

function addMessage(role, content, emotion) {
  const msg = { id: genId(), role, content, emotion, timestamp: Date.now() };
  messages.push(msg);
  saveState();
  renderMessages();
}

function renderMessages() {
  const container = document.getElementById('chat-messages');
  const avatarHtml = currentRole.isCustomImage 
    ? `<img src="${currentRole.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
    : currentRole.avatar;
  
  container.innerHTML = messages.map(m => {
    if (m.role === 'ai') {
      const avatarBg = currentRole.isCustomImage ? 'transparent' : currentRole.avatarColor;
      return `<div class="msg ai">
        <div class="msg-avatar" style="background:${avatarBg}">${avatarHtml}</div>
        <div>
          <div class="msg-bubble">${m.content}</div>
          ${m.emotion ? `<div class="msg-emotion">${emotionEmoji(m.emotion)}</div>` : ''}
        </div>
      </div>`;
    } else {
      return `<div class="msg user">
        <div class="msg-avatar">😊</div>
        <div>
          <div class="msg-bubble">${m.content}</div>
        </div>
      </div>`;
    }
  }).join('');
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById('chat-messages');
  const el = document.createElement('div');
  el.className = 'typing-indicator';
  el.id = 'typing';
  const avatarHtml = currentRole.isCustomImage 
    ? `<img src="${currentRole.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
    : currentRole.avatar;
  const avatarBg = currentRole.isCustomImage ? 'transparent' : currentRole.avatarColor;
  el.innerHTML = `<div class="msg-avatar" style="background:${avatarBg}">${avatarHtml}</div>
    <div class="typing-dots"><span></span><span></span><span></span></div>`;
  container.appendChild(el);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function emotionEmoji(e) {
  const map = { happy:'😊', calm:'☁️', warm:'🤗', thoughtful:'🌿', playful:'✨' };
  return map[e] || '';
}

// ========== Reply Engine ==========
function detectCategory(text) {
  if (/焦虑|压力|累|烦|崩溃|受不了|快疯了|心累|疲惫|紧张|害怕/.test(text)) return 'anxiety';
  if (/孤独|一个人|没人|寂寞|独自|身边没人|好静|空荡荡/.test(text)) return 'lonely';
  if (/开心|高兴|棒|幸福|太好了|哈哈|嘿嘿|快乐|惊喜|兴奋/.test(text)) return 'happy';
  if (/迷茫|不知道|选择|方向|怎么办|何去何从|困惑|纠结|找不到/.test(text)) return 'lost';
  return 'default';
}

function detectEmotion(text) {
  const cat = detectCategory(text);
  const map = { anxiety:'thoughtful', lonely:'warm', happy:'happy', lost:'calm', default:'playful' };
  return map[cat];
}

function generateReply(text) {
  const category = detectCategory(text);
  const style = currentRole.style || 'gentle';
  const templates = REPLY_TEMPLATES[category]?.[style] || REPLY_TEMPLATES.default[style];
  const template = templates[Math.floor(Math.random() * templates.length)];
  return template.replace(/\{greeting\}/g, currentRole.greeting || '朋友');
}

// ========== Profile ==========
function renderProfile() {
  if (!currentRole) {
    document.getElementById('profile-content').innerHTML = '<p style="text-align:center;color:#8B6E6E;margin-top:40px;">还没有创建角色哦，去塑造一个吧～</p>';
    return;
  }
  const r = currentRole;
  const styleObj = STYLES.find(s => s.id === r.style);
  const avatarHtml = r.isCustomImage 
    ? `<img src="${r.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` 
    : r.avatar;
  const avatarBg = r.isCustomImage ? 'transparent' : r.avatarColor;
  
  document.getElementById('profile-content').innerHTML = `
    <div class="profile-card glass-card">
      <div class="avatar-lg" style="background:${avatarBg}">${avatarHtml}</div>
      <h2>${r.name}</h2>
      <p class="greeting-text">称呼你：${r.greeting || '朋友'}</p>
      <div class="profile-tags">
        ${r.personalityTags.map(t => `<span class="tag peach">${t}</span>`).join('')}
        ${styleObj ? `<span class="tag">${styleObj.name}</span>` : ''}
      </div>
      <div class="profile-background">${r.background}</div>
      <p style="font-size:13px;color:#BFA0A0;">语气强度 ${'●'.repeat(r.toneLevel)}${'○'.repeat(5-r.toneLevel)}</p>
    </div>
    <div class="chat-history">
      <h3>对话回忆</h3>
      <div id="history-list">
        ${messages.length === 0 ? '<p style="text-align:center;color:#BFA0A0;font-size:14px;">还没有对话记录，去聊聊天吧～</p>' :
          messages.slice(-20).map(m => `
            <div class="history-item">
              <div class="hi-avatar" style="background:${m.role==='ai'?avatarBg:'var(--soft-pink)'}">${m.role==='ai'?avatarHtml:'😊'}</div>
              <div>
                <div class="hi-content">${m.content}</div>
                <div class="hi-time">${formatTime(m.timestamp)}</div>
              </div>
            </div>
          `).join('')
        }
      </div>
    </div>
    <div class="profile-actions">
      <button class="btn-ghost" onclick="navigate('chat')">继续对话</button>
      <button class="btn-ghost" onclick="resetRole()">重新塑造</button>
    </div>
  `;
}

function resetRole() {
  if (confirm('确定要重新塑造角色吗？对话记录会被清除。')) {
    currentRole = null;
    messages = [];
    localStorage.removeItem('xinyu_role');
    localStorage.removeItem('xinyu_messages');
    currentStep = 0;
    selectedAvatar = 0;
    selectedTags = [];
    selectedStyle = 'gentle';
    customImageData = null;
    document.getElementById('image-upload-area').style.display = 'block';
    document.getElementById('custom-image-preview-area').style.display = 'none';
    document.getElementById('custom-image-input').value = '';
    initWorkshop();
    updateStepUI();
    navigate('workshop');
  }
}

// ========== Utilities ==========
function genId() { return Math.random().toString(36).substring(2, 10); }

function formatTime(ts) {
  const d = new Date(ts);
  return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function saveState() {
  localStorage.setItem('xinyu_role', JSON.stringify(currentRole));
  localStorage.setItem('xinyu_messages', JSON.stringify(messages));
}

function loadState() {
  try {
    const r = localStorage.getItem('xinyu_role');
    const m = localStorage.getItem('xinyu_messages');
    if (r) currentRole = JSON.parse(r);
    if (m) messages = JSON.parse(m);
  } catch (e) {}
}

// ========== Quick Emoji Buttons ==========
document.getElementById('quick-emojis').addEventListener('click', e => {
  const btn = e.target.closest('.quick-emoji');
  if (!btn) return;
  document.getElementById('chat-input').value = btn.dataset.text;
  sendMessage();
});

// ========== Init ==========
loadState();
renderPresets();
initWorkshop();

if (currentRole) {
  // User already has a role, show welcome but keep state
}
</script>
</body>
</html>
