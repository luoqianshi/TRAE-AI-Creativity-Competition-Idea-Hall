<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>匠心·淬火 | 热处理工艺师模拟经营游戏</title>
  <style>
    :root {
      --bg: #11100f;
      --panel: rgba(32, 28, 24, .86);
      --panel-2: rgba(44, 37, 30, .92);
      --text: #f8efe0;
      --muted: #b9aa94;
      --line: rgba(255, 220, 170, .16);
      --gold: #f5b84b;
      --amber: #d97826;
      --green: #74c69d;
      --red: #ef6f6c;
      --blue: #7cc7ff;
      --shadow: 0 24px 70px rgba(0, 0, 0, .36);
      --radius: 22px;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 12%, rgba(245, 184, 75, .2), transparent 28rem),
        radial-gradient(circle at 86% 8%, rgba(217, 120, 38, .2), transparent 26rem),
        linear-gradient(135deg, #0d0d0d 0%, #1c1612 48%, #17120f 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent);
    }

    button, input { font: inherit; }

    .app {
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 20px;
      align-items: stretch;
      margin-bottom: 20px;
    }

    .hero-card, .status-card, .sidebar, .workspace, .knowledge, .modal-card {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    .hero-card {
      padding: 34px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "HRC";
      position: absolute;
      right: 24px;
      bottom: -38px;
      font-size: 136px;
      font-weight: 900;
      letter-spacing: -8px;
      color: rgba(255, 255, 255, .035);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-weight: 700;
      letter-spacing: .08em;
      font-size: 13px;
      text-transform: uppercase;
    }

    .heat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 22px var(--gold);
    }

    h1 {
      margin: 12px 0 12px;
      font-size: clamp(34px, 5vw, 72px);
      line-height: 1;
      letter-spacing: -2px;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      max-width: 780px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 17px;
    }

    .status-card {
      padding: 24px;
      display: grid;
      align-content: space-between;
      gap: 16px;
    }

    .profile {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #24160b;
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffdf8e, #da7225);
      box-shadow: 0 10px 30px rgba(217, 120, 38, .35);
    }

    .profile h2 {
      margin: 0 0 4px;
      font-size: 19px;
    }

    .profile p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      padding: 14px 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .04);
      border-radius: 16px;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .stat strong {
      font-size: 20px;
      color: var(--gold);
    }

    .level-bar {
      height: 10px;
      border-radius: 99px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .level-bar > div {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--amber), var(--gold));
      transition: width .35s ease;
    }

    .layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 20px;
    }

    .sidebar {
      padding: 18px;
      height: fit-content;
      position: sticky;
      top: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 14px;
      color: #fff2d8;
      font-size: 15px;
      letter-spacing: .04em;
    }

    .order-list {
      display: grid;
      gap: 10px;
    }

    .order-btn {
      width: 100%;
      padding: 14px;
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--text);
      background: rgba(255, 255, 255, .035);
      cursor: pointer;
      transition: .2s ease;
    }

    .order-btn:hover, .order-btn.active {
      transform: translateY(-1px);
      border-color: rgba(245, 184, 75, .7);
      background: linear-gradient(135deg, rgba(245, 184, 75, .16), rgba(217, 120, 38, .08));
    }

    .order-btn.locked {
      opacity: .5;
      cursor: not-allowed;
      filter: grayscale(.4);
    }

    .order-name {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .order-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      color: #23180e;
      background: var(--gold);
      white-space: nowrap;
    }

    .workspace {
      min-height: 720px;
      overflow: hidden;
    }

    .workspace-header {
      padding: 26px 28px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
    }

    .dialogue {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .npc {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      color: #2a1708;
      background: linear-gradient(135deg, #f9c463, #c8611e);
      font-weight: 900;
      box-shadow: 0 12px 26px rgba(216, 112, 35, .24);
    }

    .bubble {
      position: relative;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      color: #f8ead4;
      line-height: 1.8;
      background: rgba(0,0,0,.18);
    }

    .bubble::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 22px;
      width: 14px;
      height: 14px;
      transform: rotate(45deg);
      background: #221b17;
      border-left: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .content {
      padding: 26px 28px 30px;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .step {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--muted);
      background: rgba(255,255,255,.03);
    }

    .step.active {
      color: var(--text);
      border-color: rgba(245,184,75,.7);
      background: rgba(245,184,75,.12);
    }

    .step b {
      display: block;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .option {
      min-height: 118px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.035);
      cursor: pointer;
      transition: .2s ease;
    }

    .option:hover {
      transform: translateY(-1px);
      border-color: rgba(245,184,75,.55);
    }

    .option.selected {
      border-color: var(--gold);
      background: linear-gradient(135deg, rgba(245,184,75,.18), rgba(255,255,255,.04));
      box-shadow: inset 0 0 0 1px rgba(245,184,75,.28);
    }

    .option h3 {
      margin: 0 0 8px;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .option p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 13px;
    }

    .choice-price {
      color: var(--gold);
      font-size: 12px;
      white-space: nowrap;
    }

    .flow-board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
    }

    .flow-box {
      min-height: 290px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.035);
    }

    .flow-box h3 {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--gold);
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .chip {
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      padding: 9px 12px;
      cursor: pointer;
      transition: .18s ease;
    }

    .chip:hover {
      border-color: var(--gold);
      background: rgba(245,184,75,.13);
    }

    .chip.used {
      opacity: .35;
      pointer-events: none;
    }

    .selected-flow {
      display: grid;
      gap: 8px;
    }

    .flow-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(0,0,0,.18);
    }

    .flow-item span:first-child {
      color: var(--gold);
      font-weight: 800;
    }

    .mini-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255,255,255,.04);
      cursor: pointer;
      padding: 6px 10px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 900;
      color: #211306;
      background: linear-gradient(135deg, #ffd982, #db7725);
      box-shadow: 0 14px 30px rgba(219, 119, 37, .26);
      cursor: pointer;
      transition: .2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .btn.secondary {
      color: var(--text);
      border: 1px solid var(--line);
      background: rgba(255,255,255,.05);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .knowledge {
      margin-top: 20px;
      padding: 20px;
      background: rgba(21, 19, 17, .72);
    }

    .knowledge-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .knowledge-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: rgba(255,255,255,.035);
    }

    .knowledge-card b {
      color: var(--gold);
      display: block;
      margin-bottom: 6px;
    }

    .knowledge-card p {
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
      font-size: 13px;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.68);
      z-index: 20;
    }

    .modal.show { display: flex; }

    .modal-card {
      width: min(920px, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      background: #1d1713;
    }

    .result-head {
      padding: 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 20px;
      border-bottom: 1px solid var(--line);
    }

    .score-ring {
      justify-self: center;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, #1d1713 56%, transparent 57%),
        conic-gradient(var(--gold) var(--score), rgba(255,255,255,.1) 0);
    }

    .score-ring strong {
      font-size: 36px;
      color: var(--gold);
    }

    .result-body {
      padding: 24px;
    }

    .breakdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 18px 0;
    }

    .break {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.035);
    }

    .break span {
      color: var(--muted);
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .break b {
      color: var(--gold);
      font-size: 22px;
    }

    .feedback {
      display: grid;
      gap: 10px;
    }

    .feedback-item {
      border-left: 4px solid var(--gold);
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      color: #f6ead6;
      line-height: 1.65;
    }

    .feedback-item.bad { border-left-color: var(--red); }
    .feedback-item.ok { border-left-color: var(--blue); }
    .feedback-item.good { border-left-color: var(--green); }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      padding: 13px 18px;
      border-radius: 999px;
      color: #241405;
      background: var(--gold);
      font-weight: 900;
      box-shadow: var(--shadow);
      transform: translateY(90px);
      transition: .25s ease;
      z-index: 30;
    }

    .toast.show { transform: translateY(0); }

    .small-note {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 1050px) {
      .hero, .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .knowledge-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 720px) {
      .app { width: min(100% - 20px, 1480px); padding-top: 10px; }
      .hero-card, .status-card, .workspace-header, .content { padding: 18px; }
      .stats, .steps, .grid, .flow-board, .breakdown, .knowledge-grid, .result-head { grid-template-columns: 1fr; }
      .dialogue { grid-template-columns: 1fr; }
      .bubble::before { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="hero-card">
        <div class="eyebrow"><span class="heat-dot"></span> 热处理工艺师模拟经营游戏</div>
        <h1>匠心·淬火</h1>
        <p class="subtitle">
          扮演刚入职的热处理技术员，接订单、选材料、定工艺、排流程，在甲方验收与师傅点评中掌握金属热处理的核心知识。
        </p>
      </div>

      <aside class="status-card">
        <div class="profile">
          <div class="avatar">火</div>
          <div>
            <h2 id="rankName">学徒</h2>
            <p>恒信机械加工厂 · 热处理车间</p>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span>声望</span><strong id="reputation">0</strong></div>
          <div class="stat"><span>资金</span><strong id="money">¥0</strong></div>
          <div class="stat"><span>完成</span><strong id="finished">0/4</strong></div>
        </div>
        <div>
          <div class="small-note" id="levelNote">距初级工还差 30 声望</div>
          <div class="level-bar"><div id="levelProgress"></div></div>
        </div>
        <button class="btn secondary" id="resetBtn">重置进度</button>
      </aside>
    </section>

    <section class="layout">
      <aside class="sidebar">
        <h2 class="section-title">订单列表 <span class="tag">初赛 Demo</span></h2>
        <div class="order-list" id="orderList"></div>
      </aside>

      <section class="workspace">
        <div class="workspace-header">
          <div class="eyebrow" id="chapterLabel">序章教程</div>
          <h2 id="orderTitle" style="margin:10px 0 0;font-size:30px;"></h2>
          <div class="dialogue">
            <div class="npc" id="npcAvatar">师</div>
            <div class="bubble">
              <strong id="clientName"></strong>
              <div id="briefText"></div>
            </div>
          </div>
        </div>

        <div class="content">
          <div class="steps">
            <div class="step active" id="step0"><b>01</b>选择材料</div>
            <div class="step" id="step1"><b>02</b>制定工艺</div>
            <div class="step" id="step2"><b>03</b>编排流程</div>
          </div>
          <div id="stage"></div>
          <div class="actions">
            <button class="btn secondary" id="hintBtn">求助王师傅</button>
            <div>
              <button class="btn secondary" id="prevBtn">上一步</button>
              <button class="btn" id="nextBtn">下一步</button>
            </div>
          </div>
        </div>
      </section>
    </section>

    <section class="knowledge">
      <h2 class="section-title">知识卡片 <span class="tag">完成订单后解锁</span></h2>
      <div class="knowledge-grid" id="knowledgeGrid"></div>
    </section>
  </main>

  <div class="modal" id="resultModal" aria-hidden="true">
    <div class="modal-card">
      <div class="result-head">
        <div>
          <div class="eyebrow">甲方验收结果</div>
          <h2 id="resultTitle" style="font-size:32px;margin:10px 0;"></h2>
          <p id="resultSummary" class="small-note"></p>
        </div>
        <div class="score-ring" id="scoreRing"><strong id="scoreText">0</strong></div>
      </div>
      <div class="result-body">
        <div class="breakdown">
          <div class="break"><span>材料选择</span><b id="materialScore">0</b></div>
          <div class="break"><span>热处理工艺</span><b id="processScore">0</b></div>
          <div class="break"><span>流程编排</span><b id="flowScore">0</b></div>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="btn secondary" id="closeResult">继续优化</button>
          <button class="btn" id="nextOrder">进入下一单</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const materials = [
      { id: "Q235", name: "Q235", price: "★", desc: "普通碳素结构钢，便宜但含碳量低，难以通过热处理获得高硬度。" },
      { id: "45钢", name: "45钢", price: "★★", desc: "优质中碳钢，调质后综合力学性能好，适合轴类、一般齿轮、连杆。" },
      { id: "T10", name: "T10", price: "★★", desc: "高碳工具钢，高硬度但韧性差，适合刀具、锉刀等，不适合承受冲击的轴类。" },
      { id: "T12", name: "T12", price: "★★", desc: "高碳工具钢，含碳量高，适合锉刀、刮刀等手工工具。" },
      { id: "65Mn", name: "65Mn", price: "★★", desc: "弹簧钢，淬透性和弹性极限较好，适合压缩弹簧、卡簧。" },
      { id: "20CrMnTi", name: "20CrMnTi", price: "★★★", desc: "低碳合金渗碳钢，可实现表面高硬度、心部高韧性，常用于汽车齿轮。" },
      { id: "40Cr", name: "40Cr", price: "★★★", desc: "合金调质钢，淬透性优于45钢，适合较大截面轴类和重要零件。" },
      { id: "Cr12MoV", name: "Cr12MoV", price: "★★★★", desc: "高碳高铬冷作模具钢，高耐磨，适合冷冲模具。" }
    ];

    const processes = [
      { id: "normalizing", name: "正火", desc: "空冷细化晶粒、均匀组织，常作为预备热处理，成本低于退火。" },
      { id: "quench-temper-high", name: "调质处理：淬火 + 高温回火", desc: "获得回火索氏体，兼顾强度、塑性和韧性，适合轴类、连杆。" },
      { id: "quench-temper-low", name: "淬火 + 低温回火", desc: "保持高硬度和耐磨性，适合刀具、量具、渗碳件和冷作模具。" },

    function scoreMaterial(order) {
      if (!answer.material) return { score: 0, type: "bad", text: "还没有选择材料。" };
      if (answer.material === order.correct.material) {
        return { score: 100, type: "good", text: `选对了！${answer.material}的特性正好满足本订单工况需求。` };

      const msg = order.wrong?.[answer.material] || `${answer.material}与本订单的硬度、韧性或成本目标不匹配。`;

    }

    function scoreProcess(order) {
      if (!answer.process) return { score: 0, type: "bad", text: "还没有选择热处理工艺。" };
      if (answer.process === order.correct.process) {
        const name = processes.find(p => p.id === answer.process).name;
        return { score: 100, type: "good", text: `${name}匹配性能目标，能够获得所需组织和硬度范围。` };
      }
      if (order.partial?.process?.id === answer.process) {
        return { score: order.partial.process.score, type: "ok", text: order.partial.process.msg };
      }
      const chosen = processes.find(p => p.id === answer.process)?.name || "所选工艺";
      return { score: 40, type: "bad", text: `${chosen}不适合该零件。请重点检查材料类型、目标硬度以及回火温度区间。` };
    }

    function lcsLength(a, b) {
      const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
      }
      return dp[a.length][b.length];
    }

    function scoreFlow(order) {
      if (!answer.flow.length) return { score: 0, type: "bad", text: "还没有编排加工流程。" };
      const required = order.correct.flow;
      const missing = required.filter(node => !answer.flow.includes(node));
      if (order.partial?.flowMissing && missing.includes(order.partial.flowMissing.step)) {
        const withoutOptional = missing.filter(node => node !== order.partial.flowMissing.step);
        if (withoutOptional.length === 0) {
          return { score: order.partial.flowMissing.score, type: "ok", text: order.partial.flowMissing.msg };
        }
      }
      const orderScore = Math.round(lcsLength(answer.flow, required) / required.length * 100);
      const missingPenalty = missing.length * 10;
      const extraPenalty = Math.max(0, answer.flow.length - required.length) * 4;
      const score = Math.max(0, Math.min(100, orderScore - missingPenalty - extraPenalty));
      if (score >= 90) return { score, type: "good", text: "流程顺序正确，预备热处理、最终热处理、精加工和检验节点安排合理。" };
      if (score >= 65) return { score, type: "ok", text: `流程基本接近，但还需检查：${missing.length ? `缺少 ${missing.join("、")}。` : "部分工序顺序不够合理。"}` };
      return { score, type: "bad", text: `流程风险较大。标准思路是：${required.join(" → ")}。` };
    }

    function evaluate() {
      const order = orders[currentOrderIndex];
      const m = scoreMaterial(order);
      const p = scoreProcess(order);
      const f = scoreFlow(order);
      const total = Math.round(m.score * .35 + p.score * .35 + f.score * .30);
      const stars = total >= 90 ? 5 : total >= 75 ? 4 : total >= 60 ? 3 : total >= 40 ? 2 : 1;
      const multiplier = stars === 5 ? 1.5 : stars >= 4 ? 1 : stars === 3 ? .7 : stars === 2 ? .3 : 0;
      const moneyGain = Math.round(order.reward * (stars >= 5 ? 1.2 : stars >= 4 ? 1 : stars === 3 ? .8 : stars === 2 ? .5 : 0));
      const repGain = Math.round(order.rep * multiplier);

      if (!state.completed[order.id] || total > state.completed[order.id].score) {
        state.completed[order.id] = { score: total, stars };
        state.money += moneyGain;
        state.reputation += repGain;
        if (!state.knowledge.includes(order.id)) state.knowledge.push(order.id);
        save();
        renderOrders();
        renderKnowledge();
      }

      showResult(order, { total, stars, moneyGain, repGain, m, p, f });
    }

        const order = orders.find(o => o.id === id);
        return `
          <article class="knowledge-card"><b>${order.title}</b><p>${order.knowledge.material}</p></article>
          <article class="knowledge-card"><b>工艺要点</b><p>${order.knowledge.process}</p></article>
          <article class="knowledge-card"><b>流程模板</b><p>${order.knowledge.flow}</p></article>
          <article class="knowledge-card"><b>常见错误</b><p>${order.knowledge.mistakes}</p></article>
        `;
      }).join("");
    }

    function showHint() {
      const order = orders[currentOrderIndex];
      const used = hintIndex[order.id] || 0;
      const hint = order.hints[Math.min(used, order.hints.length - 1)];
      hintIndex[order.id] = used + 1;
      toast(`王师傅：${hint}`);
    }

    el("prevBtn").addEventListener("click", () => setStep(step - 1));
    el("nextBtn").addEventListener("click", () => {
      if (step === 0 && !answer.material) return toast("请先选择材料");
      if (step === 1 && !answer.process) return toast("请先选择热处理工艺");
      if (step < 2) setStep(step + 1);
      else evaluate();
    });
    el("hintBtn").addEventListener("click", showHint);
    el("closeResult").addEventListener("click", () => {
      el("resultModal").classList.remove("show");
      el("resultModal").setAttribute("aria-hidden", "true");
    });
    el("nextOrder").addEventListener("click", () => {
      el("resultModal").classList.remove("show");
      loadOrder((currentOrderIndex + 1) % orders.length);
    });
    el("resetBtn").addEventListener("click", () => {
      if (!confirm("确定要清空当前游戏进度吗？")) return;
      state = { reputation: 0, money: 0, completed: {}, knowledge: [] };
      localStorage.removeItem("jxqh-state");
      loadOrder(0);
      renderKnowledge();
      save();
      toast("进度已重置");
    });

    renderStatus();
    renderOrders();
    renderOrderHeader();
    renderStage();
    renderKnowledge();
  </script>
</body>
</html>
