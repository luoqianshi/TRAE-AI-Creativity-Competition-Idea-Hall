<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>学霸王权 - 知识就是力量</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
  --bg-dark: #0a0e1a;
  --bg-card: #151b2e;
  --bg-panel: #1a2240;
  --accent-gold: #ffd700;
  --accent-red: #ff4757;
  --accent-blue: #3498db;
  --accent-green: #2ed573;
  --accent-purple: #a855f7;
  --accent-orange: #ff6b35;
  --text-primary: #f0f0f0;
  --text-secondary: #8892a4;
  --text-dim: #4a5568;
  --shadow-glow: 0 0 30px rgba(255, 215, 0, 0.3);
  --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-dark);
  color: var(--text-primary);
}

/* ===== Loading Screen ===== */
#loading-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--bg-dark);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease;
}
#loading-screen.hidden {
  opacity: 0;
  pointer-events: none;
}
.loading-crown {
  font-size: 60px;
  animation: crownBounce 1s ease-in-out infinite;
  color: var(--accent-gold);
}
.loading-title {
  font-family: 'ZCOOL QingKe HuangYou', sans-serif;
  font-size: 32px;
  margin-top: 20px;
  background: linear-gradient(135deg, var(--accent-gold), #ff6b35, var(--accent-gold));
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 2s linear infinite;
}
.loading-bar {
  width: 200px;
  height: 4px;
  background: var(--bg-panel);
  border-radius: 2px;
  margin-top: 30px;
  overflow: hidden;
}
.loading-bar-inner {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-orange));
  border-radius: 2px;
  transition: width 0.3s;
}
@keyframes crownBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
@keyframes shimmer {
  0% { background-position: -200% center; }
  100% { background-position: 200% center; }
}

/* ===== App Container ===== */
#app {
  width: 100%;
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow: visible;
  background: linear-gradient(180deg, #0d1225 0%, #0a0e1a 50%, #111833 100%);
}

/* ===== Stars Background ===== */
.stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--duration) ease-in-out infinite;
  opacity: 0;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; }
  50% { opacity: var(--max-opacity, 0.8); }
}

/* ===== Screens ===== */
.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  transition: opacity 0.4s ease, transform 0.4s ease;
  overflow: visible;
}
.screen.active {
  display: flex;
}
.screen.fade-out {
  opacity: 0;
  transform: scale(0.95);
}

/* ===== Main Menu ===== */
.menu-logo {
  font-family: 'ZCOOL QingKe HuangYou', sans-serif;
  font-size: 42px;
  margin-top: 80px;
  text-align: center;
  background: linear-gradient(135deg, var(--accent-gold), #ff6b35);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 8px rgba(255, 215, 0, 0.3));
}
.menu-subtitle {
  font-size: 16px;
  color: var(--text-secondary);
  margin-top: 8px;
  letter-spacing: 4px;
}
.menu-crown-icon {
  font-size: 70px;
  color: var(--accent-gold);
  margin-top: 40px;
  filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
  animation: crownFloat 3s ease-in-out infinite;
}
@keyframes crownFloat {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-10px) rotate(3deg); }
}

.menu-buttons {
  margin-top: 60px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 0 20px;
}

.menu-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  background: linear-gradient(135deg, var(--bg-panel), var(--bg-card));
  border: 1px solid rgba(255, 215, 0, 0.15);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.menu-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, transparent, rgba(255, 215, 0, 0.05));
  opacity: 0;
  transition: var(--transition);
}
.menu-btn:hover::before,
.menu-btn:active::before {
  opacity: 1;
}
.menu-btn:active {
  transform: scale(0.97);
}
.menu-btn .icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.menu-btn .icon.reigns {
  background: linear-gradient(135deg, #ff6b35, #ff4757);
}
.menu-btn .icon.achievement {
  background: linear-gradient(135deg, #ffd700, #f0932b);
}
.menu-btn .btn-text {
  display: flex;
  flex-direction: column;
}
.menu-btn .btn-label {
  font-size: 20px;
  font-weight: 600;
}
.menu-btn .btn-desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.menu-btn .btn-arrow {
  margin-left: auto;
  color: var(--text-dim);
  font-size: 16px;
}

/* ===== Top Bar ===== */
.top-bar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 5px;
  flex-shrink: 0;
}
.top-bar .back-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--bg-panel);
  border: none;
  color: var(--text-primary);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}
.top-bar .back-btn:active {
  transform: scale(0.9);
}
.top-bar .title {
  font-family: 'ZCOOL QingKe HuangYou', sans-serif;
  font-size: 22px;
  color: var(--accent-gold);
}
.top-bar .score-display {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  color: var(--accent-gold);
  font-weight: 600;
}

/* ===== Grade Selector ===== */
.grade-selector-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 14, 26, 0.97);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 150;
  backdrop-filter: blur(8px);
  padding: 30px;
}
.grade-selector-overlay.active {
  display: flex;
}
.grade-selector-title {
  font-family: 'ZCOOL QingKe HuangYou', sans-serif;
  font-size: 28px;
  color: var(--accent-gold);
  margin-bottom: 8px;
}
.grade-selector-sub {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: 28px;
}

.grade-phase {
  width: 100%;
  max-width: 360px;
  margin-bottom: 24px;
}
.grade-phase-label {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 12px;
  padding-left: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.grade-phase-label i {
  color: var(--accent-gold);
}
.grade-options {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.grade-btn {
  flex: 1;
  min-width: 100px;
  padding: 16px 12px;
  border-radius: var(--radius-sm);
  background: var(--bg-panel);
  border: 2px solid transparent;
  color: var(--text-primary);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}
.grade-btn:active { transform: scale(0.95); }
.grade-btn.active {
  border-color: var(--accent-gold);
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 107, 53, 0.1));
  color: var(--accent-gold);
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
}
.grade-btn .grade-sub {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 400;
  margin-top: 4px;
}
.grade-btn.active .grade-sub {
  color: var(--accent-orange);
}

.grade-start-btn {
  margin-top: 10px;
  padding: 16px 48px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
  color: #1a1a2e;
  font-size: 20px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: var(--transition);
  font-family: 'ZCOOL QingKe HuangYou', sans-serif;
}
.grade-start-btn:active { transform: scale(0.95); }
.grade-start-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

/* ===== Subject Selector ===== */
.subject-selector {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  padding: 8px 0;
  flex-shrink: 0;
}
.subject-chip {
  padding: 10px 8px;
  border-radius: 25px;
  background: var(--bg-panel);
  border: 1px solid transparent;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  text-align: center;
}
.subject-chip.active {
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 107, 53, 0.15));
  border-color: var(--accent-gold);
  color: var(--accent-gold);
  font-weight: 600;
}

/* ===== Reigns Game ===== */
.reigns-container {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Attributes Bar */
.attributes-bar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 6px 8px;
  flex-shrink: 0;
  position: relative;
}
.attr-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  width: 70px;
}
.attr-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: var(--transition);
}
.attr-icon.danger {
  animation: attrPulse 0.5s ease-in-out infinite;
}
@keyframes attrPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
.attr-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}
.attr-meter {
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
}
.attr-meter-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease, background 0.5s ease;
}
.attr-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
}

/* Card */
.card-area {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.swipe-card {
  width: 90%;
  max-width: 380px;
  min-height: 420px;
  background: linear-gradient(145deg, var(--bg-card), #1e2745);
  border-radius: 22px;
  border: 1px solid rgba(255, 215, 0, 0.12);
  box-shadow: var(--card-shadow);
  padding: 30px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: transform 0.15s ease-out, opacity 0.3s ease;
  cursor: grab;
  touch-action: none;
  text-align: center;
}
.swipe-card:active { cursor: grabbing; }
.swipe-card .card-category {
  font-size: 15px;
  padding: 6px 18px;
  border-radius: 22px;
  background: rgba(255, 215, 0, 0.15);
  color: var(--accent-gold);
  font-weight: 700;
  margin-bottom: 18px;
}
.swipe-card .card-question {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.7;
  color: var(--text-primary);
}
.swipe-card .card-image {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin-bottom: 16px;
  background: rgba(255, 215, 0, 0.08);
  border: 1px solid rgba(255, 215, 0, 0.15);
  color: var(--accent-gold);
}
.swipe-card .card-hint {
  font-size: 14px;
  color: var(--text-dim);
  margin-top: 18px;
}

/* Swipe Indicators */
.swipe-indicators {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 100%;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
}
.swipe-indicator {
  padding: 10px 18px;
  border-radius: 24px;
  font-size: 24px;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.2s;
}
.swipe-indicator.left {
  background: rgba(168, 85, 247, 0.2);
  color: var(--accent-purple);
  border: 2px solid var(--accent-purple);
}
.swipe-indicator.right {
  background: rgba(52, 152, 219, 0.2);
  color: var(--accent-blue);
  border: 2px solid var(--accent-blue);
}
.swipe-indicator.visible {
  opacity: 1;
}

/* Choice Labels */
.choice-labels {
  width: 90%;
  max-width: 380px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  flex-shrink: 0;
}
.choice-label {
  font-size: 22px;
  font-weight: 700;
  padding: 12px 20px;
  border-radius: 22px;
  opacity: 0.85;
}
.choice-label.left {
  color: var(--accent-purple);
  background: rgba(168, 85, 247, 0.12);
}
.choice-label.right {
  color: var(--accent-blue);
  background: rgba(52, 152, 219, 0.12);
}

/* Year Counter */
.year-display {
  text-align: center;
  margin-top: 8px;
  flex-shrink: 0;
}
.year-display .year-num {
  font-family: 'ZCOOL QingKe HuangYou', sans-serif;
  font-size: 30px;
  color: var(--accent-gold);
}
.year-display .year-label {
  font-size: 14px;
  color: var(--text-secondary);
}
.year-display .streak {
  font-size: 16px;
  color: var(--accent-orange);
  margin-top: 4px;
  font-weight: 700;
}

/* Card Stack */
.card-stack-hint {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.stack-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  transition: var(--transition);
}
.stack-dot.active {
  background: var(--accent-gold);
  width: 22px;
  border-radius: 4px;
}

/* ===== Game Over Overlay ===== */
.game-over-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 14, 26, 0.95);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.game-over-overlay.active {
  display: flex;
}
.game-over-title {
  font-family: 'ZCOOL QingKe HuangYou', sans-serif;
  font-size: 40px;
  color: var(--accent-red);
  margin-bottom: 8px;
}
.game-over-reason {
  font-size: 18px;
  color: var(--text-secondary);
  margin-bottom: 30px;
  text-align: center;
  padding: 0 30px;
}
.game-over-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 30px;
  width: 85%;
  max-width: 300px;
}
.stat-card {
  background: var(--bg-panel);
  border-radius: var(--radius-sm);
  padding: 18px;
  text-align: center;
}
.stat-card .stat-val {
  font-size: 30px;
  font-weight: 700;
  color: var(--accent-gold);
}
.stat-card .stat-label {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 4px;
}
.game-over-btns {
  display: flex;
  gap: 12px;
}
.go-btn {
  padding: 16px 32px;
  border-radius: var(--radius-sm);
  font-size: 18px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: var(--transition);
}
.go-btn:active { transform: scale(0.95); }
.go-btn.primary {
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
  color: #1a1a2e;
}
.go-btn.secondary {
  background: var(--bg-panel);
  color: var(--text-primary);
  border: 1px solid var(--text-dim);
}

/* ===== Feedback Flash ===== */
.feedback-flash {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 70px;
  pointer-events: none;
  z-index: 200;
  opacity: 0;
}
.feedback-flash.show {
  animation: feedbackPop 0.8s ease-out forwards;
}
@keyframes feedbackPop {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
  30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5) translateY(-40px); }
}

/* ===== Achievement Screen ===== */
.achievement-container {
  flex: 1;
  width: 100%;
  overflow-y: auto;
  padding-top: 10px;
}
.achievement-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  width: 100%;
  margin-bottom: 20px;
}
.ach-stat {
  background: var(--bg-panel);
  border-radius: var(--radius-sm);
  padding: 18px 12px;
  text-align: center;
}
.ach-stat .val {
  font-size: 26px;
  font-weight: 700;
  color: var(--accent-gold);
}
.ach-stat .label {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.achievement-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  padding-bottom: 20px;
}
.ach-card {
  background: var(--bg-panel);
  border-radius: var(--radius-sm);
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  border: 1px solid transparent;
  transition: var(--transition);
}
.ach-card.unlocked {
  border-color: rgba(255, 215, 0, 0.2);
}
.ach-card.locked {
  opacity: 0.5;
}
.ach-card .ach-icon {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
}
.ach-card .ach-info {
  flex: 1;
}
.ach-card .ach-name {
  font-size: 17px;
  font-weight: 600;
}
.ach-card .ach-desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 3px;
}

/* ===== Responsive ===== */
@media (max-height: 700px) {
  .menu-logo { margin-top: 40px; font-size: 36px; }
  .menu-crown-icon { margin-top: 20px; font-size: 50px; }
  .menu-buttons { margin-top: 30px; }
  .swipe-card { min-height: 320px; padding: 22px; }
  .swipe-card .card-question { font-size: 20px; }
  .swipe-card .card-image { width: 50px; height: 50px; font-size: 22px; }
  .attr-item { width: 60px; }
  .attr-icon { width: 34px; height: 34px; font-size: 15px; }
  .attr-name { font-size: 11px; }
  .attr-meter { height: 6px; }
  .attr-value { font-size: 12px; }
}
@media (max-height: 600px) {
  .swipe-card { min-height: 260px; padding: 16px; }
  .swipe-card .card-question { font-size: 18px; }
  .swipe-card .card-image { width: 40px; height: 40px; font-size: 18px; margin-bottom: 10px; }
  .swipe-card .card-category { margin-bottom: 10px; }
  .choice-label { font-size: 15px; padding: 8px 14px; }
  .year-display .year-num { font-size: 24px; }
}
@media (min-width: 481px) {

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen.active').forEach(s => {
    s.classList.add('fade-out');
    setTimeout(() => s.classList.remove('active', 'fade-out'), 400);
  });
  setTimeout(() => {
    document.getElementById(id).classList.add('active');
  }, 100);

  if (id === 'screen-reigns') initReigns();
  if (id === 'screen-achievements') renderAchievements();
}

function showFeedback(iconClass, isCorrect) {
  // No floating icon — use card flash instead
  const card = document.getElementById('swipe-card');
  if (card) {
    card.style.boxShadow = isCorrect
      ? '0 0 40px rgba(168, 85, 247, 0.6), 0 0 80px rgba(168, 85, 247, 0.3)'
      : '0 0 40px rgba(52, 152, 219, 0.6), 0 0 80px rgba(52, 152, 219, 0.3)';
    card.style.borderColor = isCorrect
      ? 'rgba(168, 85, 247, 0.6)'
      : 'rgba(52, 152, 219, 0.6)';
    setTimeout(() => {
      card.style.boxShadow = '';
      card.style.borderColor = '';
    }, 500);
  }
}

function saveState() {
  try { localStorage.setItem('xueba_state_v2', JSON.stringify(gameState)); } catch(e) {}
}

function loadState() {
  try {
    const s = localStorage.getItem('xueba_state_v2');
    if (s) {
      const parsed = JSON.parse(s);
      Object.assign(gameState, parsed);
    }
  } catch(e) {}
}

function checkAchievements() {
  ACHIEVEMENTS.forEach(a => {
    if (!gameState.achievements[a.id] && a.check()) {
      gameState.achievements[a.id] = Date.now();
      setTimeout(() => showFeedback('fa-trophy', true), 500);
    }
  });
  saveState();
}

// INIT
// ============================================================
function init() {
  loadState();
  createStars();
  renderSubjectChips('grade-subjects');
  updateReignsTitle();

  // Update score display
  document.getElementById('reigns-score').textContent = gameState.reignsScore;

  // Loading animation
  const bar = document.getElementById('load-bar');
  let progress = 0;
  const loadInterval = setInterval(() => {
    progress += Math.random() * 30 + 10;
    if (progress >= 100) {
      progress = 100;
      clearInterval(loadInterval);
      setTimeout(() => {
        document.getElementById('loading-screen').classList.add('hidden');
      }, 400);
    }
    bar.style.width = progress + '%';
  }, 300);
}

function createStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--duration', (2 + Math.random() * 4) + 's');
    star.style.setProperty('--max-opacity', (0.3 + Math.random() * 0.7).toFixed(2));
    star.style.animationDelay = Math.random() * 4 + 's';
    if (Math.random() > 0.7) {
      star.style.width = '3px';
      star.style.height = '3px';
    }
    container.appendChild(star);
  }
}

function renderSubjectChips(containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  SUBJECTS.forEach(s => {
    const chip = document.createElement('div');
    chip.className = 'subject-chip' + (gameState.reignsSubject === s.id ? ' active' : '');
    chip.innerHTML = `<i class="fas ${s.icon}"></i> ${s.name}`;
    chip.onclick = () => {
      gameState.reignsSubject = s.id;
      renderSubjectChips(containerId);
      updateReignsTitle();
    };
    container.appendChild(chip);
  });
}

function updateReignsTitle() {
  const el = document.getElementById('reigns-title');
  if (el) {
    const subject = SUBJECTS.find(s => s.id === gameState.reignsSubject);
    el.textContent = subject ? `${subject.name} · ${gameState.reignsGrade || ''}` : '王权模式';
  }
}

// GRADE SELECTOR
// ============================================================
function openGradeSelector() {
  const overlay = document.getElementById('grade-selector');
  overlay.classList.add('active');
  // Reset selection
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('grade-start-btn').disabled = true;

  // Pre-select if user has played before
  if (gameState.reignsGrade) {
    const prev = document.querySelector(`.grade-btn[data-grade="${gameState.reignsGrade}"]`);
    if (prev) {
      prev.classList.add('active');
      document.getElementById('grade-start-btn').disabled = false;
    }
  }
}

function selectGrade(btn) {
  document.querySelectorAll('.grade-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('grade-start-btn').disabled = false;
  gameState.reignsGrade = btn.dataset.grade;
  gameState.reignsGradeKey = GRADES[gameState.reignsGrade];
  updateReignsTitle();
}

function startReignsWithGrade() {
  const activeBtn = document.querySelector('.grade-btn.active');
  if (!activeBtn) return;
  gameState.reignsGrade = activeBtn.dataset.grade;
  gameState.reignsGradeKey = GRADES[gameState.reignsGrade];
  document.getElementById('grade-selector').classList.remove('active');
  showScreen('screen-reigns');
}

const ATTR_CONFIG = [
  { key: 'people', name: '知识', icon: 'fa-brain', color: '#2ed573' },
  { key: 'army', name: '思维', icon: 'fa-lightbulb', color: '#3498db' },
  { key: 'treasury', name: '专注', icon: 'fa-bullseye', color: '#ff6b35' },
  { key: 'faith', name: '创造力', icon: 'fa-palette', color: '#ffd700' },
];

function initReigns() {
  gameState.reignsActive = true;
  gameState.reignsYear = 1;
  gameState.reignsScore = 0;
  gameState.reignsStreak = 0;
  gameState.reignsMaxStreak = 0;
  gameState.reignsTotalCorrect = 0;
  gameState.reignsTotalQuestions = 0;
  gameState.attrs = { people: 50, army: 50, treasury: 50, faith: 50 };

  // Build deck filtered by grade
  const gradeKey = gameState.reignsGradeKey || 'junior1';
  const allQuestions = REIGNS_QUESTIONS[gameState.reignsSubject] || [];
  // Include questions at or below selected grade level
  const gradeLevels = ['junior1', 'junior2', 'junior3', 'senior1', 'senior2', 'senior3'];
  const maxLevel = gradeLevels.indexOf(gradeKey);
  const filtered = allQuestions.filter(q => {
    const qLevel = gradeLevels.indexOf(q.grade);
    return qLevel !== -1 && qLevel <= maxLevel + 1; // allow 1 level above for challenge
  });
  gameState.reignsDeck = shuffle(filtered.length > 0 ? filtered : allQuestions);

  // Hide game over
  document.getElementById('reigns-gameover').classList.remove('active');

  // Update title with subject + grade
  updateReignsTitle();

  // Render
  renderAttributes();
  nextCard();
  updateReignsUI();
  setupSwipeCard();
}

function renderAttributes() {
  const bar = document.getElementById('attr-bar');
  bar.innerHTML = '';
  ATTR_CONFIG.forEach(attr => {
    const val = gameState.attrs[attr.key];
    const isDanger = val <= 20 || val >= 95;
    bar.innerHTML += `
      <div class="attr-item">
        <div class="attr-icon ${isDanger ? 'danger' : ''}" style="background: ${attr.color}22; color: ${attr.color}">
          <i class="fas ${attr.icon}"></i>
        </div>
        <span class="attr-name">${attr.name}</span>
        <div class="attr-meter">
          <div class="attr-meter-fill" style="width: ${val}%; background: ${val <= 20 ? '#ff4757' : val >= 95 ? '#ff4757' : attr.color}"></div>
        </div>
        <span class="attr-value">${val}</span>
      </div>
    `;
  });
}

function nextCard() {
  if (gameState.reignsDeck.length === 0) {
    // Rebuild deck
    const gradeKey = gameState.reignsGradeKey || 'junior1';
    const allQuestions = REIGNS_QUESTIONS[gameState.reignsSubject] || [];
    const gradeLevels = ['junior1', 'junior2', 'junior3', 'senior1', 'senior2', 'senior3'];
    const maxLevel = gradeLevels.indexOf(gradeKey);
    const filtered = allQuestions.filter(q => {
      const qLevel = gradeLevels.indexOf(q.grade);
      return qLevel !== -1 && qLevel <= maxLevel + 1;
    });
    gameState.reignsDeck = shuffle(filtered.length > 0 ? filtered : allQuestions);
  }
  if (gameState.reignsDeck.length === 0) return;
  gameState.reignsCurrentCard = gameState.reignsDeck.pop();
  renderCard();
  updateReignsUI();
}

function renderCard() {
  const card = gameState.reignsCurrentCard;
  const subject = SUBJECTS.find(s => s.id === gameState.reignsSubject);
  document.getElementById('card-category').textContent = subject?.name || '';

  // Use FontAwesome icon instead of emoji for cross-platform consistency
  const iconEl = document.getElementById('card-image');
  iconEl.innerHTML = `<i class="fas ${subject?.icon || 'fa-question'}"></i>`;

  document.getElementById('card-question').textContent = card.q;
  document.getElementById('choice-left').textContent = card.left.text;
  document.getElementById('choice-right').textContent = card.right.text;

  // Reset card position
  const cardEl = document.getElementById('swipe-card');
  cardEl.style.transform = '';
  cardEl.style.opacity = '1';
}

function updateReignsUI() {
  document.getElementById('reigns-score').textContent = gameState.reignsScore;
  document.getElementById('year-num').textContent = `第 ${gameState.reignsYear} 年`;
  const streak = document.getElementById('streak-display');
  streak.textContent = gameState.reignsStreak > 1 ? `🔥 连对 ${gameState.reignsStreak} 题` : '';

  // Card stack dots
  const stack = document.getElementById('card-stack');
  const remaining = Math.min(gameState.reignsDeck.length, 8);
  stack.innerHTML = '';
  for (let i = 0; i < remaining; i++) {
    stack.innerHTML += `<div class="stack-dot ${i === 0 ? 'active' : ''}"></div>`;
  }
}

function setupSwipeCard() {
  const card = document.getElementById('swipe-card');
  let startX = 0, startY = 0, currentX = 0, isDragging = false;

  const onStart = (x, y, e) => {
    if (!gameState.reignsActive) return;
    if (e) e.preventDefault();
    isDragging = true;
    startX = x;
    startY = y;
    card.style.transition = 'none';
  };

  const onMove = (x) => {
    if (!isDragging || !gameState.reignsActive) return;
    currentX = x - startX;
    const rotation = currentX * 0.08;
    card.style.transform = `translateX(${currentX}px) rotate(${rotation}deg)`;

    // Show swipe indicators
    const threshold = 60;
    const indLeft = document.getElementById('ind-left');
    const indRight = document.getElementById('ind-right');
    indLeft.classList.toggle('visible', currentX < -threshold);
    indRight.classList.toggle('visible', currentX > threshold);
  };

  const onEnd = () => {
    if (!isDragging || !gameState.reignsActive) return;
    isDragging = false;
    card.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
    document.getElementById('ind-left').classList.remove('visible');
    document.getElementById('ind-right').classList.remove('visible');

    const swipeThreshold = 80;
    if (Math.abs(currentX) > swipeThreshold) {
      // Determine choice
      const wentLeft = currentX < 0;
      const choice = wentLeft ? gameState.reignsCurrentCard.left : gameState.reignsCurrentCard.right;
      processChoice(choice, wentLeft);
    } else {
      // Snap back
      card.style.transform = '';
    }
    currentX = 0;
  };

  // Remove old listeners by cloning
  const newCard = card.cloneNode(true);
  card.parentNode.replaceChild(newCard, card);

  // Touch events - only on card element
  newCard.addEventListener('touchstart', e => {
    onStart(e.touches[0].clientX, e.touches[0].clientY);
  });
  newCard.addEventListener('touchmove', e => {
    if (isDragging && gameState.reignsActive) {
      e.preventDefault();
      onMove(e.touches[0].clientX);
    }
  }, { passive: false });
  newCard.addEventListener('touchend', onEnd);

  // Mouse events - only on card element
  newCard.addEventListener('mousedown', e => onStart(e.clientX, e.clientY, e));
  newCard.addEventListener('mousemove', e => { if (isDragging) onMove(e.clientX); });
  newCard.addEventListener('mouseup', onEnd);
  newCard.addEventListener('mouseleave', onEnd);

  // Keyboard
  window.addEventListener('keydown', e => {
    if (!gameState.reignsActive) return;
    if (e.key === 'ArrowLeft') {
      const choice = gameState.reignsCurrentCard.left;
      processChoice(choice, true);
    } else if (e.key === 'ArrowRight') {
      const choice = gameState.reignsCurrentCard.right;
      processChoice(choice, false);
    }
  });
}

function processChoice(choice, wentLeft) {
  const card = document.getElementById('swipe-card');
  card.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
  card.style.transform = `translateX(${wentLeft ? -600 : 600}px) rotate(${wentLeft ? -20 : 20}deg)`;
  card.style.opacity = '0';

  const isCorrect = choice.correct;
  gameState.reignsTotalQuestions++;

  if (isCorrect) {
    gameState.reignsStreak++;
    gameState.reignsTotalCorrect++;
    if (gameState.reignsStreak > gameState.reignsMaxStreak) {
      gameState.reignsMaxStreak = gameState.reignsStreak;
    }
    const bonus = gameState.reignsStreak > 1 ? gameState.reignsStreak * 2 : 10;
    gameState.reignsScore += bonus;
    gameState.totalScore += bonus;
    showFeedback('fa-circle-check', true);

    // Slightly increase all attributes on correct
    ATTR_CONFIG.forEach(a => {
      gameState.attrs[a.key] = Math.min(100, gameState.attrs[a.key] + 3);
    });
  } else {
    gameState.reignsStreak = 0;
    showFeedback('fa-circle-xmark', false);

    // Decrease random attributes on wrong
    const keys = Object.keys(gameState.attrs);
    const decrease1 = keys[Math.floor(Math.random() * keys.length)];
    const decrease2 = keys.filter(k => k !== decrease1)[Math.floor(Math.random() * (keys.length - 1))];
    gameState.attrs[decrease1] = Math.max(0, gameState.attrs[decrease1] - 15);
    gameState.attrs[decrease2] = Math.max(0, gameState.attrs[decrease2] - 10);
  }

  // Advance year every 3 questions
  if (gameState.reignsTotalQuestions % 3 === 0) {
    gameState.reignsYear++;
  }

  // Check game over
  setTimeout(() => {
    const gameOver = ATTR_CONFIG.some(a => gameState.attrs[a.key] <= 0 || gameState.attrs[a.key] >= 100);
    if (gameOver) {
      endReigns();
    } else {
      nextCard();
    }
    renderAttributes();
    updateReignsUI();
    checkAchievements();
  }, 450);
}

function endReigns() {
  gameState.reignsActive = false;
  gameState.reignsGamesPlayed++;
  if (gameState.reignsYear > gameState.bestYear) gameState.bestYear = gameState.reignsYear;
  if (gameState.reignsMaxStreak > gameState.bestStreak) gameState.bestStreak = gameState.reignsMaxStreak;

  // Find which attribute caused failure
  let reason = '';
  ATTR_CONFIG.forEach(a => {
    const val = gameState.attrs[a.key];
    if (val <= 0) reason = `${a.name}不足，学业亮起红灯！`;
    if (val >= 100) reason = `${a.name}满溢，需要适当调节！`;
  });

  document.getElementById('go-reason').textContent = reason;
  document.getElementById('go-stats').innerHTML = `
    <div class="stat-card"><div class="stat-val">${gameState.reignsYear}</div><div class="stat-label">在位年数</div></div>
    <div class="stat-card"><div class="stat-val">${gameState.reignsScore}</div><div class="stat-label">总分</div></div>
    <div class="stat-card"><div class="stat-val">${gameState.reignsMaxStreak}</div><div class="stat-label">最长连胜</div></div>
    <div class="stat-card"><div class="stat-val">${gameState.reignsTotalQuestions > 0 ? Math.round(gameState.reignsTotalCorrect / gameState.reignsTotalQuestions * 100) : 0}%</div><div class="stat-label">正确率</div></div>
  `;

  document.getElementById('reigns-gameover').classList.add('active');
  saveState();
  checkAchievements();
}

function restartReigns() {
  document.getElementById('reigns-gameover').classList.remove('active');
  initReigns();
}

function exitReigns() {
  gameState.reignsActive = false;
  document.getElementById('reigns-gameover').classList.remove('active');
  showScreen('screen-menu');
}

// ============================================================
// ACHIEVEMENTS
// ============================================================
function renderAchievements() {
  // Stats
  document.getElementById('ach-count').textContent = Object.keys(gameState.achievements).length;
  document.getElementById('ach-stats').innerHTML = `
    <div class="ach-stat"><div class="val">${gameState.bestYear}</div><div class="label">最长在位</div></div>
    <div class="ach-stat"><div class="val">${gameState.bestStreak}</div><div class="label">最长连胜</div></div>
    <div class="ach-stat"><div class="val">${gameState.totalScore}</div><div class="label">总积分</div></div>
  `;

  // Achievement list
  const listEl = document.getElementById('ach-list');
  listEl.innerHTML = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = !!gameState.achievements[a.id];
    listEl.innerHTML += `
      <div class="ach-card ${unlocked ? 'unlocked' : 'locked'}">
        <div class="ach-icon" style="background: ${a.color}22; color: ${a.color}">
          <i class="fas ${a.icon}"></i>
        </div>
        <div class="ach-info">
          <div class="ach-name">${a.name}</div>
          <div class="ach-desc">${a.desc}</div>
        </div>
        ${unlocked ? '<i class="fas fa-check-circle" style="color: var(--accent-green)"></i>' : '<i class="fas fa-lock" style="color: var(--text-dim)"></i>'}
      </div>
    `;
  });
}

// ============================================================
// PARTICLES EFFECT ON MENU
// ============================================================
function createFloatingParticles() {
  const app = document.getElementById('app');
  for (let i = 0; i < 6; i++) {
    const particle = document.createElement('div');
    particle.style.cssText = `
      position: absolute;
      width: ${3 + Math.random() * 4}px;
      height: ${3 + Math.random() * 4}px;
      background: rgba(255, 215, 0, ${0.1 + Math.random() * 0.2});
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticle ${8 + Math.random() * 12}s linear infinite;
      animation-delay: ${Math.random() * 8}s;
    `;

    if (!document.getElementById('particle-style')) {
      const style = document.createElement('style');
      style.id = 'particle-style';
      style.textContent = `
        @keyframes floatParticle {
          0% { transform: translateY(100vh) translateX(0); opacity: 0; }
          10% { opacity: 1; }
          90% { opacity: 1; }
          100% { transform: translateY(-20px) translateX(${Math.random() > 0.5 ? '' : '-'}${30 + Math.random() * 50}px); opacity: 0; }
        }
      `;
      document.head.appendChild(style);
    }

    particle.style.left = Math.random() * 100 + '%';
    app.appendChild(particle);
  }
}

// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  init();
  createFloatingParticles();
});
</script>
</body>
