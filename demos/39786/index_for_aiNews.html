<!DOCTYPE html>
<!--
  ============================================
  AI 新闻推送 - 单文件完整应用
  ============================================
  项目概述：基于标签权重的 AI 个性化新闻推送 Web 应用。
           用户选择感兴趣的话题标签后，系统通过 AI 算法分析新闻内容与标签的匹配度，
           智能排序推荐，让感兴趣的内容优先展示。同时支持按分类浏览，每个分类有独立的视觉主题。
  技术栈：HTML5 + CSS3 + Vanilla JavaScript（原生实现，无框架依赖）
  数据来源：GNews API（中文新闻）+ Mock 数据（备用）
  存储：localStorage（本地存储用户偏好和缓存新闻）
  设计风格：编辑杂志风 + 新粗野主义，深色主题
  作者：TRAE AI 创造力大赛参赛作品
  ============================================
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 新闻推送</title>
    <!-- Google Fonts：Noto Serif SC（标题衬线体）+ Noto Sans SC（正文无衬线体） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
/* ============================================
   【CSS 样式层】
   负责：视觉设计、动画效果、响应式布局
   风格：编辑杂志风 + 新粗野主义，深色主题
   包含：CSS 变量、组件样式、动画关键帧、媒体查询
   ============================================ */

/* ---- CSS 变量 ---- */
/* 定义全局设计令牌：颜色、阴影、圆角、过渡曲线 */
:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a24;
    --bg-elevated: #222230;
    --text-primary: #f0f0f5;
    --text-secondary: #a0a0b0;
    --text-muted: #606070;
    --accent: #e8d5b7;
    --accent-glow: rgba(232, 213, 183, 0.15);
    --border: rgba(255, 255, 255, 0.06);
    --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.4);
    --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5);
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* 分类主题色 */
/* 6 大分类各自拥有独立的主题色和发光效果，通过 data-category 属性动态切换 */
:root[data-category="tech"]     { --theme-color: #5B8DEF; --theme-glow: rgba(91, 141, 239, 0.2); }
:root[data-category="finance"]  { --theme-color: #34D399; --theme-glow: rgba(52, 211, 153, 0.2); }
:root[data-category="sports"]   { --theme-color: #F87171; --theme-glow: rgba(248, 113, 113, 0.2); }
:root[data-category="society"]  { --theme-color: #A78BFA; --theme-glow: rgba(167, 139, 250, 0.2); }
:root[data-category="entertainment"] { --theme-color: #F472B6; --theme-glow: rgba(244, 114, 182, 0.2); }
:root[data-category="health"]   { --theme-color: #22D3EE; --theme-glow: rgba(34, 211, 238, 0.2); }
:root[data-category="all"]      { --theme-color: #e8d5b7; --theme-glow: rgba(232, 213, 183, 0.15); }

/* ---- 基础重置 ---- */
/* 统一盒模型、清除默认边距、移除移动端点击高亮 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    font-size: 16px;
    scroll-behavior: smooth;
}

body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    overflow-x: hidden;
    min-height: 100vh;
}

#app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
}

/* ---- 全局加载动画 ---- */
/* 三层轨道旋转加载器，用于 API 请求等待时的全屏遮罩 */
.global-loader {
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease, visibility 0.5s ease;
}

.global-loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-ring {
    position: relative;
    width: 80px;
    height: 80px;
}

.loader-orbit {
    position: absolute;
    inset: 0;
    border: 2px solid transparent;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: orbit-spin 1.5s linear infinite;
}

.loader-orbit:nth-child(1) {
    animation-duration: 1.5s;
    border-top-color: var(--accent);
}

.loader-orbit:nth-child(2) {
    inset: 12px;
    animation-duration: 1.2s;
    animation-direction: reverse;
    border-top-color: var(--theme-color);
}

.loader-orbit:nth-child(3) {
    inset: 24px;
    animation-duration: 0.9s;
    border-top-color: var(--accent);
    opacity: 0.6;
}

@keyframes orbit-spin {
    to { transform: rotate(360deg); }
}

.loader-text {
    margin-top: 24px;
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 2px;
    animation: text-pulse 1.5s ease-in-out infinite;
}

@keyframes text-pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
}

/* ============================================
   【欢迎页】
   功能：首次进入时引导用户选择感兴趣的话题标签
   交互：点击标签卡片切换选中状态，选中后显示计数，至少选1个可进入首页
   动画：标题淡入、卡片依次进入、选中弹性缩放、按钮光泽扫过
   ============================================ */
.welcome-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 48px 24px 32px;
    position: relative;
    overflow: hidden;
}

/* 背景装饰 */
.welcome-page::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, var(--theme-glow) 0%, transparent 70%);
    pointer-events: none;
}

.welcome-header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeInUp 0.8s ease-out;
}

.welcome-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 20px;
}

.welcome-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse-dot 2s ease-in-out infinite;
}

@keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
}

.welcome-header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 32px;
    font-weight: 900;
    line-height: 1.2;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.welcome-header p {
    font-size: 15px;
    color: var(--text-secondary);
    font-weight: 300;
}

/* 标签网格 */
.tag-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 32px;
    animation: fadeInUp 0.8s ease-out 0.2s both;
}

.tag-card {
    position: relative;
    padding: 24px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all var(--transition-smooth);
    text-align: center;
    overflow: hidden;
}

.tag-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.02) 100%);
    opacity: 0;
    transition: opacity var(--transition-fast);
}

.tag-card:hover::before {
    opacity: 1;
}

.tag-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: var(--shadow-soft);
}

.tag-card.selected {
    background: var(--theme-color);
    border-color: var(--theme-color);
    box-shadow: 0 4px 20px var(--theme-glow);
    animation: card-select 0.4s var(--transition-spring);
}

@keyframes card-select {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}

.tag-card.selected .tag-icon {
    filter: brightness(0) invert(1);
}

.tag-card.selected .tag-name {
    color: white;
    font-weight: 700;
}

.tag-icon {
    font-size: 36px;
    display: block;
    margin-bottom: 10px;
    transition: transform var(--transition-smooth);
}

.tag-card:hover .tag-icon {
    transform: scale(1.1);
}

.tag-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    transition: color var(--transition-fast);
}

/* 选择计数 */
.select-count {
    text-align: center;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--text-muted);
    animation: fadeInUp 0.8s ease-out 0.3s both;
}

.select-count span {
    color: var(--accent);
    font-weight: 700;
}

/* 主按钮 */
.btn-primary {
    width: 100%;
    padding: 18px 24px;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--accent) 0%, #d4c4a8 100%);
    color: var(--bg-primary);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition-smooth);
    position: relative;
    overflow: hidden;
    animation: fadeInUp 0.8s ease-out 0.4s both;
}

.btn-primary::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.5s ease;
}

.btn-primary:hover::before {
    left: 100%;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(232, 213, 183, 0.25);
}

.btn-primary:active {
    transform: translateY(0);
}

.btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
}

/* ============================================
   【首页】
   功能：展示新闻列表，支持分类筛选和 AI 个性化排序
   结构：顶部导航栏 + 分类标签栏 + 新闻卡片列表
   交互：点击分类标签切换过滤、点击卡片进入详情、点击设置返回欢迎页
   特色：毛玻璃导航、分类主题色切换、卡片悬停动画、骨架屏加载
   ============================================ */
.home-page {
    min-height: 100vh;
    background: var(--bg-primary);
}

/* 顶部导航 */
.home-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
}

.home-header h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.icon-btn:hover {
    background: var(--bg-elevated);
    color: var(--text-primary);
    border-color: rgba(255, 255, 255, 0.1);
}

/* 分类标签栏 */
.category-tabs {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    background: var(--bg-primary);
    border-bottom: 1px solid var(--border);
}

.category-tabs::-webkit-scrollbar {
    display: none;
}

.tab {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 100px;
    background: var(--bg-card);
    color: var(--text-secondary);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: all var(--transition-fast);
    position: relative;
    overflow: hidden;
}

.tab:hover {
    border-color: rgba(255, 255, 255, 0.15);
    color: var(--text-primary);
}

.tab.active {
    background: var(--theme-color);
    border-color: var(--theme-color);
    color: white;
    box-shadow: 0 4px 16px var(--theme-glow);
}

/* 新闻列表 */
.news-list {
    padding: 16px 20px 32px;
}

/* 新闻卡片 */
.news-card {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: all var(--transition-smooth);
    animation: cardEnter 0.5s ease-out both;
}

@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.news-card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: var(--shadow-card);
}

.news-card::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: var(--theme-color);
    opacity: 0;
    transition: opacity var(--transition-fast);
}

.news-card:hover::after {
    opacity: 1;
}

.news-image-wrap {
    position: relative;
    height: 200px;
    overflow: hidden;
}

.news-image {
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    transition: transform var(--transition-smooth);
}

.news-card:hover .news-image {
    transform: scale(1.05);
}

.news-image-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, var(--bg-card) 0%, transparent 50%);
    pointer-events: none;
}

.news-category-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 4px 12px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    color: var(--theme-color);
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.news-content {
    padding: 16px;
}

.news-content h3 {
    font-family: 'Noto Serif SC', serif;
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 8px;
    color: var(--text-primary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.news-content p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 12px;
}

.news-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
}

.news-meta .source {
    display: flex;
    align-items: center;
    gap: 6px;
}

.news-meta .source::before {
    content: '';
    width: 4px;
    height: 4px;
    background: var(--theme-color);
    border-radius: 50%;
}

/* 推荐分数指示器 */
.score-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    background: var(--theme-glow);
    border-radius: 100px;
    font-size: 11px;
    font-weight: 600;
    color: var(--theme-color);
}

/* ============================================
   【详情页】
   功能：展示单条新闻的完整内容
   结构：返回按钮 + 大图 Hero + 分类标签 + 标题 + 元信息 + 正文 + 阅读原文按钮
   交互：点击返回回到首页、点击阅读原文跳转到外部链接
   特色：大图渐变遮罩、毛玻璃返回栏、负边距内容叠加
   ============================================ */
.detail-page {
    min-height: 100vh;
    background: var(--bg-primary);
    animation: fadeIn 0.4s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.detail-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: rgba(10, 10, 15, 0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
}

.back-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 18px;
    cursor: pointer;
    transition: all var(--transition-fast);
}

.back-btn:hover {
    background: var(--bg-elevated);
    border-color: rgba(255, 255, 255, 0.1);
}

.detail-header-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.detail-hero {
    position: relative;
    height: 280px;
    overflow: hidden;
}

.detail-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.detail-hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, var(--bg-primary) 0%, transparent 60%);
}

.detail-body {
    padding: 24px 20px 40px;
    margin-top: -60px;
    position: relative;
    z-index: 1;
}

.detail-category {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    background: var(--theme-glow);
    border: 1px solid var(--theme-color);
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    color: var(--theme-color);
    margin-bottom: 16px;
}

.detail-body h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 24px;
    font-weight: 900;
    line-height: 1.4;
    margin-bottom: 16px;
    color: var(--text-primary);
}

.detail-meta-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
}

.detail-meta-bar span {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
}

.detail-content {
    font-size: 16px;
    line-height: 1.9;
    color: var(--text-secondary);
}

.detail-content p {
    margin-bottom: 16px;
}

.read-more-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin-top: 32px;
    padding: 18px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    color: var(--accent);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all var(--transition-fast);
}

.read-more-btn:hover {
    background: var(--bg-card);
    border-color: var(--accent);
}

/* ============================================
   【空状态】
   功能：当分类下没有新闻时显示的友好提示
   场景：分类筛选结果为空、网络错误导致无数据
   ============================================ */
.empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
}

.empty-state .icon {
    font-size: 64px;
    margin-bottom: 16px;
    opacity: 0.5;
}

/* ============================================
   【骨架屏】
   功能：数据加载时的占位动画，提升 perceived performance
   原理：CSS 渐变背景位移动画模拟 shimmer 效果
   应用：新闻卡片加载、图片加载、文本内容加载
   ============================================ */
.skeleton {
    background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
    background-size: 200% 100%;
    animation: skeleton-loading 1.5s ease-in-out infinite;
    border-radius: var(--radius-sm);
}

@keyframes skeleton-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.skeleton-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    overflow: hidden;
}

.skeleton-image {
    height: 200px;
    width: 100%;
}

.skeleton-content {
    padding: 16px;
}

.skeleton-title {
    height: 20px;
    width: 80%;
    margin-bottom: 12px;
}

.skeleton-text {
    height: 14px;
    width: 100%;
    margin-bottom: 8px;
}

.skeleton-text.short {
    width: 60%;
}

/* ============================================
   【动画工具类】
   功能：提供可复用的 CSS 动画关键帧和工具类
   fadeInUp：从下方淡入（用于页面元素依次进入）
   延迟类：animate-delay-1 到 animate-delay-5 控制 stagger 时序
   ============================================ */
@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.animate-fade-in {
    animation: fadeInUp 0.6s ease-out both;
}

.animate-delay-1 { animation-delay: 0.1s; }
.animate-delay-2 { animation-delay: 0.2s; }
.animate-delay-3 { animation-delay: 0.3s; }
.animate-delay-4 { animation-delay: 0.4s; }
.animate-delay-5 { animation-delay: 0.5s; }

/* ============================================
   【滚动条美化】
   功能：自定义 WebKit 浏览器滚动条样式，保持与深色主题一致
   ============================================ */
::-webkit-scrollbar {
    width: 4px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: var(--bg-elevated);
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
}

/* ============================================

   功能：适配平板和桌面端屏幕
   变化：容器宽度从 480px 扩展到 600px、标签网格从 2 列变为 3 列、标题字号增大

    *::after {

// ============================================
// 【Recommender 模块 - AI 推荐引擎】
// 功能：基于标签权重的简单文本匹配推荐算法
// 原理：统计新闻标题和描述中包含用户标签关键词的数量，乘以权重得到匹配分数
// 方法：score(新闻, 用户标签) 计算单条匹配度；sort(新闻列表, 用户标签) 按分数降序排序
// 说明：当前为简化版实现，可扩展为 TF-IDF、余弦相似度等更复杂的算法
// ============================================
const Recommender = {
    score(newsItem, userTags) {
        let score = 0;
        const text = (newsItem.title + ' ' + newsItem.description).toLowerCase();
        userTags.forEach(tag => {
            const weight = tag.weight || 1;
            const keywords = tag.keywords || [tag.name];
            keywords.forEach(kw => {
                if (text.includes(kw.toLowerCase())) {
                    score += weight;
                }
            });
        });
        return score;
    },
    sort(newsList, userTags) {
        return newsList
            .map(item => ({ ...item, score: this.score(item, userTags) }))
            .sort((a, b) => b.score - a.score);
    }
};

function showLoader(text = 'AI 正在分析你的兴趣...') {

function setThemeCategory(categoryId) {

}

// ---- 欢迎页 ----
// 功能：首次进入时渲染，引导用户选择兴趣标签
// 逻辑：从 Storage 恢复已选标签，渲染 2x3 标签网格，更新计数器和按钮状态

function renderWelcome() {
    setThemeCategory('all');
    const app = document.getElementById('app');
    app.innerHTML = `
        <div class="welcome-page">
            <div class="welcome-header">
                <div class="welcome-badge">AI 驱动</div>
                <h1>发现你关心的<br>世界动态</h1>
                <p>选择感兴趣的话题，获取个性化新闻推荐</p>
            </div>
            <div class="tag-grid">
                ${TAGS.map((tag, i) => `
                    <div class="tag-card animate-fade-in animate-delay-${i + 1}" data-tag="${tag.id}" onclick="toggleTag(this)">
                        <span class="tag-icon">${tag.icon}</span>
                        <span class="tag-name">${tag.name}</span>
                    </div>
                `).join('')}
            </div>
            <div class="select-count">
                已选择 <span id="select-count">0</span> 个话题
            </div>
            <button class="btn-primary" id="start-btn" onclick="saveTags()" disabled>
                开始阅读
            </button>
        </div>
    `;
    selectedTags.forEach(tag => {
        const card = document.querySelector(`[data-tag="${tag.id}"]`);
        if (card) card.classList.add('selected');
    });
    updateSelectCount();
}

function toggleTag(element) {
    const tagId = element.dataset.tag;
    const tag = TAGS.find(t => t.id === tagId);
    if (element.classList.contains('selected')) {
        element.classList.remove('selected');
        selectedTags = selectedTags.filter(t => t.id !== tagId);
    } else {
        element.classList.add('selected');
        selectedTags.push({ ...tag, weight: 1 });
        element.style.animation = 'none';
        element.offsetHeight;
        element.style.animation = 'card-select 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
    }
    updateSelectCount();
}

function updateSelectCount() {
    const countEl = document.getElementById('select-count');
    const btn = document.getElementById('start-btn');
    if (countEl) countEl.textContent = selectedTags.length;
    if (btn) btn.disabled = selectedTags.length === 0;
}

function saveTags() {
    if (selectedTags.length === 0) {
        showToast('请至少选择一个感兴趣的话题');
        return;
    }
    showLoader('正在为你定制新闻...');
    setTimeout(() => {
        Storage.setTags(selectedTags);
        hideLoader();
        init();
    }, 800);
}

// 功能：展示新闻列表，支持分类筛选和 AI 个性化排序
// 流程：渲染骨架屏 → 延迟加载真实数据 → 按分类过滤 → 按推荐分数排序

function renderHome() {
    setThemeCategory(currentCategory);
    const app = document.getElementById('app');
    app.innerHTML = `
        <div class="home-page">
            <header class="home-header">
                <h1>AI 新闻推送</h1>

                <button class="tab ${currentCategory === 'all' ? 'active' : ''}" onclick="filterCategory('all')">全部</button>

function renderSkeletons(count) {
    return Array(count).fill(0).map(() => `
        <div class="skeleton-card">
            <div class="skeleton skeleton-image"></div>
            <div class="skeleton-content">
                <div class="skeleton skeleton-title"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text short"></div>
            </div>
        </div>
    `).join('');
}

function loadNews() {
    const news = Storage.getNews();
    const userTags = Storage.getTags();
    let filtered = news;
    if (currentCategory !== 'all') {
        filtered = news.filter(item => detectCategory(item) === currentCategory);
    }
    const sorted = Recommender.sort(filtered, userTags);
    const listEl = document.getElementById('news-list');
    if (sorted.length === 0) {
        listEl.innerHTML = `<div class="empty-state"><div class="icon">📭</div><h3>暂无新闻</h3><p>该分类下暂时没有新闻内容</p></div>`;
        return;
    }
    listEl.innerHTML = sorted.map((item, i) => renderNewsCard(item, i)).join('');
}

function renderNewsCard(item, index) {
    const category = detectCategory(item);
    const theme = TAGS.find(t => t.id === category) || TAGS[0];
    const cardStyle = currentCategory === 'all' ? `style="--theme-color: ${theme.color}; --theme-glow: ${theme.color}33"` : '';
    return `
        <div class="news-card" ${cardStyle} onclick="showDetail('${item.url}')" style="animation-delay: ${index * 0.08}s">

                <div class="news-image" style="background-image: url('${item.urlToImage || ''}')"></div>
                <div class="news-image-overlay"></div>
                <span class="news-category-badge">${theme.name}</span>
            </div>
            <div class="news-content">
                <h3>${item.title}</h3>
                <p>${item.description || ''}</p>
                <div class="news-meta">
                    <span class="source">${item.source?.name || '未知来源'}</span>
                    <span>${formatTime(item.publishedAt)}</span>
                </div>
            </div>
        </div>
    `;
}

function filterCategory(categoryId) {
    currentCategory = categoryId;
    setThemeCategory(categoryId);
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    const listEl = document.getElementById('news-list');
    listEl.innerHTML = renderSkeletons(3);
    setTimeout(() => loadNews(), 200);
}

// ---- 详情页 ----

// 流程：查找新闻 → 检测分类 → 设置主题色 → 渲染详情页 → 滚动到顶部

function showDetail(url) {
    const news = Storage.getNews().find(n => n.url === url);
    if (!news) return;
    const category = detectCategory(news);
    const theme = TAGS.find(t => t.id === category) || TAGS[0];

                <div class="detail-hero-overlay"></div>
            </div>
            <div class="detail-body">
                <span class="detail-category">${theme.name}</span>
                <h1>${news.title}</h1>
                <div class="detail-meta-bar">
                    <span>📰 ${news.source?.name || '未知来源'}</span>
                    <span>🕐 ${formatTime(news.publishedAt)}</span>
                </div>
                <div class="detail-content"><p>${news.content || news.description || '暂无详细内容'}</p></div>
                <a href="${news.url}" target="_blank" class="read-more-btn">阅读原文 <span>→</span></a>
            </div>
        </div>
    `;
    window.scrollTo(0, 0);
}

// ---- 标签设置 ----
// 功能：从首页返回欢迎页，允许用户重新选择兴趣标签

function showTagSettings() {
    selectedTags = Storage.getTags() || [];
    renderWelcome();
}

// ---- 分类检测 ----
// 功能：通过关键词匹配自动识别新闻所属分类
// 原理：遍历新闻标题和描述，匹配各分类的关键词数组
// 默认：未匹配到任何关键词时返回 'tech'（科技）

function detectCategory(newsItem) {
    const text = (newsItem.title + ' ' + (newsItem.description || '')).toLowerCase();
    for (const tag of TAGS) {
        for (const kw of tag.keywords) {
            if (text.includes(kw.toLowerCase())) return tag.id;
        }
    }
    return 'tech';
}

// ---- 时间格式化 ----
// 功能：将 ISO 时间字符串转换为中文相对时间
// 规则：刚刚 / X分钟前 / X小时前 / X天前 / 月日

function formatTime(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    const now = new Date();
    const diff = (now - date) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 604800) return Math.floor(diff / 86400) + '天前';
    return date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

// ---- Toast 提示 ----
// 功能：底部弹出临时提示消息
// 特点：自动移除旧消息、平滑淡入淡出、2.5 秒后自动消失

function showToast(message) {
    const existing = document.querySelector('.toast-message');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    toast.textContent = message;
    toast.style.cssText = `
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        padding: 12px 24px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 100px;
        color: var(--text-primary);
        font-size: 14px;
        z-index: 10000;
        opacity: 0;
        transition: all 0.3s ease;
        box-shadow: var(--shadow-soft);
    `;
    document.body.appendChild(toast);
    requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
    });
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(20px)';
        setTimeout(() => toast.remove(), 300);
    }, 2500);
}

// ---- 初始化 ----
// 功能：应用入口，根据用户是否已选择标签决定显示欢迎页或首页
// 流程：检查 Storage → 无标签则显示欢迎页 → 有标签则加载新闻并显示首页

async function init() {
    const tags = Storage.getTags();
    if (!tags || tags.length === 0) {
        selectedTags = [];
        renderWelcome();
    } else {
        selectedTags = tags;
        let news = Storage.getNews();
        if (news.length === 0) {
            showLoader('正在获取最新新闻...');
            news = await API.fetchNews();
            Storage.setNews(news);
            hideLoader();
        }
        currentCategory = 'all';
        renderHome();
    }
}

// 页面加载完成后启动应用
document.addEventListener('DOMContentLoaded', init);
