<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 私人电台</title>
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-glass: rgba(26, 26, 46, 0.8);
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent-amber: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #8b5cf6 100%);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
        }

        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== App Container ===== */
        .app-container {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
        }

        /* ===== Top Status Bar ===== */
        .status-bar {
            padding: var(--spacing-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .radio-name {
            font-size: 20px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: pulse 2s infinite;
        }

        .status-dot.active {
            background: #10b981;
        }

        .status-text {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .mode-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(139, 92, 246, 0.2);
            color: var(--accent-purple);
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .mode-badge.narrating {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-amber);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .mode-badge.playing {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }

        /* ===== Main Content ===== */
        .main-content {
            flex: 1;
            padding: var(--spacing-md);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            overflow-y: auto;
        }

        /* ===== Song Card ===== */
        .song-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .song-header {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .song-cover {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-md);
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .song-cover::before {
            content: '♪';
            font-size: 32px;
            color: white;
            opacity: 0.8;
        }

        .song-cover.playing::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .song-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: var(--spacing-xs);
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .song-artist {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .song-meta {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
        }

        .song-tag {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .song-progress {
            margin-top: var(--spacing-md);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: var(--spacing-xs);
        }

        /* ===== Host Area ===== */
        .host-area {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            border: 1px solid var(--border-color);
        }

        .host-header {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .host-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .host-avatar::before {
            content: '🎙';
            font-size: 24px;
        }

        .host-avatar.speaking::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--accent-amber);
            animation: pulse-ring 1.5s infinite;
        }

        .host-info {
            flex: 1;
        }

        .host-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .host-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        .host-message {
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            border-left: 3px solid var(--accent-purple);
            min-height: 60px;
        }

        .host-message-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .host-message-text.thinking {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-purple);
            animation: thinking 1.4s infinite;
        }

        .thinking-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .thinking-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* ===== Control Area ===== */
        .control-area {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-lg);
        }

        .control-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.primary {
            width: 72px;
            height: 72px;
            background: var(--accent-gradient);
            font-size: 28px;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
        }

        .control-btn.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .secondary-controls {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .secondary-btn {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        .secondary-btn:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .volume-label {
            font-size: 12px;
            color: var(--text-muted);
            min-width: 60px;
        }

        .volume-slider {
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            appearance: none;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-amber);
            cursor: pointer;
        }

        /* ===== Interaction Area ===== */
        .interaction-area {
            display: flex;
            gap: var(--spacing-sm);
            align-items: center;
        }

        .question-input {
            flex: 1;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .question-input:focus {
            border-color: var(--accent-purple);
        }

        .question-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent-gradient);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== Playlist ===== */
        .playlist-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            border: 1px solid var(--border-color);
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-md);
        }

        .playlist-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .playlist-count {
            font-size: 12px;
            color: var(--text-muted);
        }

        .playlist-items {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            max-height: 300px;
            overflow-y: auto;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.02);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .playlist-item:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .playlist-item.active {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .playlist-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--accent-purple);
            border-radius: 0 2px 2px 0;
        }

        .playlist-item-index {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .playlist-item.active .playlist-item-index {
            background: var(--accent-purple);
            color: white;
        }

        .playlist-item-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-item-title {
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item-artist {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== Settings Panel ===== */
        .settings-toggle {
            position: fixed;
            bottom: var(--spacing-lg);
            right: var(--spacing-lg);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: var(--accent-gradient);
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-panel {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .settings-panel.active {
            display: flex;
        }

        .settings-content {
            background: var(--bg-secondary);
            width: 100%;
            max-width: 430px;
            max-height: 80vh;
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            padding: var(--spacing-lg);
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-lg);
        }

        .settings-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .settings-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-section {
            margin-bottom: var(--spacing-lg);
        }

        .settings-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .settings-field {
            margin-bottom: var(--spacing-md);
        }

        .settings-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        .settings-input {
            width: 100%;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .settings-input:focus {
            border-color: var(--accent-purple);
        }

        .settings-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: var(--spacing-xs);
        }

        .settings-actions {
            display: flex;
            gap: var(--spacing-md);
        }

        .settings-btn {
            flex: 1;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-btn.primary {
            background: var(--accent-gradient);
            color: white;
        }

        .settings-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .settings-btn:active {
            transform: scale(0.98);
        }

        .security-notice {
            padding: var(--spacing-md);
            background: rgba(245, 158, 11, 0.1);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--accent-amber);
            margin-top: var(--spacing-md);
        }

        .security-notice p {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: var(--spacing-lg);
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            z-index: 3000;
            transition: transform 0.3s ease;
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .toast.success {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        /* ===== Animations ===== */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        @keyframes thinking {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Status Bar -->
        <header class="status-bar">
            <div class="radio-name">AI 私人电台</div>
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">待机</span>
            </div>
            <div class="mode-badge" id="modeBadge">待机</div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Song Card -->
            <section class="song-card">
                <div class="song-header">
                    <div class="song-cover" id="songCover"></div>
                    <div class="song-info">
                        <div class="song-title" id="songTitle">等待播放</div>
                        <div class="song-artist" id="songArtist">选择一首歌曲开始</div>
                        <div class="song-meta" id="songMeta"></div>
                    </div>
                </div>
                <div class="song-progress">
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-time">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </section>

            <!-- Host Area -->
            <section class="host-area">
                <div class="host-header">
                    <div class="host-avatar" id="hostAvatar"></div>
                    <div class="host-info">
                        <div class="host-name">AI 主持人</div>
                        <div class="host-status" id="hostStatus">等待中</div>
                    </div>
                </div>
                <div class="host-message">
                    <div class="host-message-text" id="hostMessage">
                        欢迎来到 AI 私人电台，点击"开始电台"按钮，让我为你介绍今天的歌曲。
                    </div>
                </div>
            </section>

            <!-- Control Area -->
            <section class="control-area">
                <div class="main-controls">
                    <button class="control-btn" id="prevBtn" title="上一首">⏮</button>
                    <button class="control-btn primary" id="playBtn" title="开始电台">▶</button>
                    <button class="control-btn" id="nextBtn" title="下一首">⏭</button>
                </div>
                <div class="secondary-controls">
                    <button class="secondary-btn" id="reintroBtn">🔄 重新介绍</button>
                    <button class="secondary-btn" id="musicOnlyBtn">🎵 仅播放音乐</button>
                </div>
                <div class="volume-control">
                    <span class="volume-label">🔊 音乐音量</span>
                    <input type="range" class="volume-slider" id="musicVolume" min="0" max="100" value="80">
                </div>
                <div class="volume-control">
                    <span class="volume-label">🎙 播报音量</span>
                    <input type="range" class="volume-slider" id="narrationVolume" min="0" max="100" value="100">
                </div>
            </section>

            <!-- Interaction Area -->
            <section class="interaction-area">
                <input type="text" class="question-input" id="questionInput" placeholder="向主持人提问...">
                <button class="send-btn" id="sendBtn">➤</button>
            </section>

            <!-- Playlist -->
            <section class="playlist-section">
                <div class="playlist-header">
                    <div class="playlist-title">播放列表</div>
                    <div class="playlist-count" id="playlistCount">0 首歌曲</div>
                </div>
                <div class="playlist-items" id="playlistItems"></div>
            </section>
        </main>

        <!-- Settings Toggle -->
        <button class="settings-toggle" id="settingsToggle">⚙</button>

        <!-- Settings Panel -->
        <div class="settings-panel" id="settingsPanel">
            <div class="settings-content">
                <div class="settings-header">
                    <div class="settings-title">API 设置</div>
                    <button class="settings-close" id="settingsClose">✕</button>
                </div>

                <div class="settings-section">
                    <div class="settings-section-title">LLM 配置</div>
                    <div class="settings-field">
                        <label class="settings-label">API 接口地址</label>
                        <input type="text" class="settings-input" id="llmApiUrl" placeholder="https://api.openai.com/v1/chat/completions">
                        <div class="settings-hint">支持 OpenAI 兼容接口</div>
                    </div>
                    <div class="settings-field">
                        <label class="settings-label">API Key</label>
                        <input type="password" class="settings-input" id="llmApiKey" placeholder="sk-...">
                    </div>
                    <div class="settings-field">
                        <label class="settings-label">模型名称</label>
                        <input type="text" class="settings-input" id="llmModel" placeholder="gpt-3.5-turbo">
                    </div>
                </div>

                <div class="settings-section">
                    <div class="settings-section-title">TTS 配置</div>
                    <div class="settings-field">
                        <label class="settings-label">API 接口地址</label>
                        <input type="text" class="settings-input" id="ttsApiUrl" placeholder="https://api.openai.com/v1/audio/speech">
                    </div>
                    <div class="settings-field">
                        <label class="settings-label">API Key</label>
                        <input type="password" class="settings-input" id="ttsApiKey" placeholder="sk-...">
                    </div>
                    <div class="settings-field">
                        <label class="settings-label">声音参数</label>
                        <input type="text" class="settings-input" id="ttsVoice" placeholder="alloy">
                        <div class="settings-hint">可选：alloy, echo, fable, onyx, nova, shimmer</div>
                    </div>
                </div>

                <div class="settings-actions">
                    <button class="settings-btn secondary" id="testConnectionBtn">测试连接</button>
                    <button class="settings-btn primary" id="saveSettingsBtn">保存设置</button>
                </div>

                <div class="security-notice">
                    <p>🔒 安全提示：API Key 仅保存在本地浏览器，不会上传到任何服务器。请自行确保接口可用性和合规性。</p>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        // ===== State Management =====
        const STATES = {
            IDLE: 'idle',
            LOADING: 'loading',
            NARRATING: 'narrating',
            PLAYING: 'playing',
            PAUSED: 'paused',
            ASKING: 'asking',
            ERROR: 'error'
        };

        class StateManager {
            constructor() {
                this.state = STATES.IDLE;
                this.listeners = [];
            }

            setState(newState) {
                const oldState = this.state;
                this.state = newState;
                this.notify(oldState, newState);
            }

            subscribe(listener) {
                this.listeners.push(listener);
            }

            notify(oldState, newState) {
                this.listeners.forEach(listener => listener(oldState, newState));
            }
        }

        const stateManager = new StateManager();

        // ===== Audio Controller =====
        class AudioController {
            constructor() {
                this.musicAudio = new Audio();
                this.narrationAudio = new Audio();
                this.musicVolume = 0.8;
                this.narrationVolume = 1.0;
                this.isNarrating = false;
                
                this.musicAudio.addEventListener('ended', () => {
                    if (typeof onSongEnded === 'function') onSongEnded();
                });

                this.musicAudio.addEventListener('timeupdate', () => {
                    updateProgress();
                });

                this.narrationAudio.addEventListener('ended', () => {
                    this.isNarrating = false;
                    if (typeof onNarrationEnded === 'function') onNarrationEnded();
                });
            }

            async fadeIn(audio, duration = 1000) {
                const steps = 20;
                const stepDuration = duration / steps;
                const targetVolume = audio === this.musicAudio ? this.musicVolume : this.narrationVolume;
                
                audio.volume = 0;
                audio.play().catch(() => {});
                
                for (let i = 0; i <= steps; i++) {
                    audio.volume = (targetVolume / steps) * i;
                    await sleep(stepDuration);
                }
            }

            async fadeOut(audio, duration = 1000) {
                const steps = 20;
                const stepDuration = duration / steps;
                const startVolume = audio.volume;
                
                for (let i = 0; i <= steps; i++) {
                    audio.volume = startVolume - (startVolume / steps) * i;
                    await sleep(stepDuration);
                }
                
                audio.pause();
            }

            async duckMusic(targetVolume = 0.3) {
                this.musicAudio.dataset.normalVolume = this.musicAudio.volume;
                const steps = 10;
                const stepDuration = 50;
                const startVolume = this.musicAudio.volume;
                
                for (let i = 0; i <= steps; i++) {
                    this.musicAudio.volume = startVolume - ((startVolume - targetVolume) / steps) * i;
                    await sleep(stepDuration);
                }
            }

            async restoreMusic() {
                const normalVolume = parseFloat(this.musicAudio.dataset.normalVolume || this.musicVolume);
                const steps = 10;
                const stepDuration = 50;
                const startVolume = this.musicAudio.volume;
                
                for (let i = 0; i <= steps; i++) {
                    this.musicAudio.volume = startVolume + ((normalVolume - startVolume) / steps) * i;
                    await sleep(stepDuration);
                }
            }

            async playNarration(audioUrl) {
                this.isNarrating = true;
                this.narrationAudio.src = audioUrl;
                await this.duckMusic(0.3);
                await this.fadeIn(this.narrationAudio, 500);
            }

            async playSong(url) {
                this.musicAudio.src = url;
                await this.restoreMusic();
                await this.fadeIn(this.musicAudio, 1000);
            }

            pauseMusic() {
                this.musicAudio.pause();
            }

            resumeMusic() {
                this.musicAudio.play().catch(() => {});
            }

            stopAll() {
                this.musicAudio.pause();
                this.musicAudio.currentTime = 0;
                this.narrationAudio.pause();
                this.narrationAudio.currentTime = 0;
                this.isNarrating = false;
            }

            setMusicVolume(volume) {
                this.musicVolume = volume;
                if (!this.isNarrating) {
                    this.musicAudio.volume = volume;
                }
            }

            setNarrationVolume(volume) {
                this.narrationVolume = volume;
                this.narrationAudio.volume = volume;
            }
        }

        const audioController = new AudioController();

        // ===== API Adapter =====
        async function callLLM(prompt, config) {
            if (!config.llmApiUrl || !config.llmApiKey) {
                throw new Error('LLM API 未配置');
            }

            const response = await fetch(config.llmApiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.llmApiKey}`
                },
                body: JSON.stringify({
                    model: config.llmModel || 'gpt-3.5-turbo',
                    messages: [
                        {
                            role: 'system',
                            content: '你是一位专业的电台主持人，擅长用生动有趣的方式介绍歌曲背景、历史和相关趣闻。请用自然、亲切的口语风格进行播报。'
                        },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.7,
                    max_tokens: 500
                })
            });

            if (!response.ok) {
                throw new Error(`LLM API 错误: ${response.status}`);
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function callTTS(text, config) {
            if (!config.ttsApiUrl || !config.ttsApiKey) {
                throw new Error('TTS API 未配置');
            }

            const response = await fetch(config.ttsApiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${config.ttsApiKey}`
                },
                body: JSON.stringify({
                    input: text,
                    voice: config.ttsVoice || 'alloy',
                    model: 'tts-1'
                })
            });

            if (!response.ok) {
                throw new Error(`TTS API 错误: ${response.status}`);
            }

            const audioBlob = await response.blob();
            return URL.createObjectURL(audioBlob);
        }

        // ===== Storage Manager =====
        const STORAGE_KEYS = {
            CONFIG: 'ai_radio_config',
            PLAYLIST: 'ai_radio_playlist',
            CURRENT_SONG: 'ai_radio_current_song'
        };

        function saveConfig(config) {
            localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(config));
        }

        function loadConfig() {
            const data = localStorage.getItem(STORAGE_KEYS.CONFIG);
            return data ? JSON.parse(data) : getDefaultConfig();
        }

        function savePlaylist(playlist) {
            localStorage.setItem(STORAGE_KEYS.PLAYLIST, JSON.stringify(playlist));
        }

        function loadPlaylist() {
            const data = localStorage.getItem(STORAGE_KEYS.PLAYLIST);
            return data ? JSON.parse(data) : getDefaultPlaylist();
        }

        function saveCurrentSong(index) {
            localStorage.setItem(STORAGE_KEYS.CURRENT_SONG, index.toString());
        }

        function loadCurrentSong() {
            const data = localStorage.getItem(STORAGE_KEYS.CURRENT_SONG);
            return data ? parseInt(data) : 0;
        }

        function getDefaultConfig() {
            return {
                llmApiUrl: '',
                llmApiKey: '',
                llmModel: 'gpt-3.5-turbo',
                ttsApiUrl: '',
                ttsApiKey: '',
                ttsVoice: 'alloy',
                musicVolume: 80,
                narrationVolume: 100
            };
        }

        function getDefaultPlaylist() {
            return [
                {
                    id: 1,
                    title: "Bohemian Rhapsody",
                    artist: "Queen",
                    album: "A Night at the Opera",
                    year: "1975",
                    genre: "Rock",
                    description: "皇后乐队的经典之作",
                    audioUrl: "",
                    coverUrl: ""
                },
                {
                    id: 2,
                    title: "Hotel California",
                    artist: "Eagles",
                    album: "Hotel California",
                    year: "1977",
                    genre: "Rock",
                    description: "老鹰乐队的代表作",
                    audioUrl: "",
                    coverUrl: ""
                },
                {
                    id: 3,
                    title: "Stairway to Heaven",
                    artist: "Led Zeppelin",
                    album: "Led Zeppelin IV",
                    year: "1971",
                    genre: "Rock",
                    description: "齐柏林飞艇的传世经典",
                    audioUrl: "",
                    coverUrl: ""
                }
            ];
        }

        // ===== App State =====
        let config = loadConfig();
        let playlist = loadPlaylist();
        let currentSongIndex = loadCurrentSong();
        let currentNarrationText = '';

        // ===== UI Updates =====
        function updateUI() {
            updateStatusBar();
            updateSongCard();
            updatePlaylist();
            updateVolumeSliders();
        }

        function updateStatusBar() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const modeBadge = document.getElementById('modeBadge');

            const stateMap = {
                [STATES.IDLE]: { text: '待机', dotActive: false, badge: '待机', badgeClass: '' },
                [STATES.LOADING]: { text: '加载中', dotActive: true, badge: '加载中', badgeClass: '' },
                [STATES.NARRATING]: { text: '播报中', dotActive: true, badge: '播报中', badgeClass: 'narrating' },
                [STATES.PLAYING]: { text: '播放中', dotActive: true, badge: '播放中', badgeClass: 'playing' },
                [STATES.PAUSED]: { text: '已暂停', dotActive: false, badge: '已暂停', badgeClass: '' },
                [STATES.ASKING]: { text: '互动中', dotActive: true, badge: '互动中', badgeClass: 'narrating' },
                [STATES.ERROR]: { text: '错误', dotActive: false, badge: '错误', badgeClass: '' }
            };

            const stateInfo = stateMap[stateManager.state];
            statusDot.className = `status-dot ${stateInfo.dotActive ? 'active' : ''}`;
            statusText.textContent = stateInfo.text;
            modeBadge.textContent = stateInfo.badge;
            modeBadge.className = `mode-badge ${stateInfo.badgeClass}`;
        }

        function updateSongCard() {
            const song = playlist[currentSongIndex];
            if (!song) return;

            document.getElementById('songTitle').textContent = song.title;
            document.getElementById('songArtist').textContent = song.artist;

            const metaContainer = document.getElementById('songMeta');
            metaContainer.innerHTML = '';
            
            if (song.year) {
                const yearTag = document.createElement('span');
                yearTag.className = 'song-tag';
                yearTag.textContent = song.year;
                metaContainer.appendChild(yearTag);
            }
            
            if (song.genre) {
                const genreTag = document.createElement('span');
                genreTag.className = 'song-tag';
                genreTag.textContent = song.genre;
                metaContainer.appendChild(genreTag);
            }
        }

        function updatePlaylist() {
            const container = document.getElementById('playlistItems');
            const countEl = document.getElementById('playlistCount');
            
            container.innerHTML = '';
            countEl.textContent = `${playlist.length} 首歌曲`;

            playlist.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${index === currentSongIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="playlist-item-index">${index + 1}</div>
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${song.title}</div>
                        <div class="playlist-item-artist">${song.artist}</div>
                    </div>
                `;
                item.addEventListener('click', () => switchSong(index));
                container.appendChild(item);
            });
        }

        function updateVolumeSliders() {
            document.getElementById('musicVolume').value = config.musicVolume;
            document.getElementById('narrationVolume').value = config.narrationVolume;
        }

        function updateProgress() {
            const audio = audioController.musicAudio;
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressFill').style.width = `${progress}%`;
                document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
                document.getElementById('totalTime').textContent = formatTime(audio.duration);
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updatePlayButton() {
            const playBtn = document.getElementById('playBtn');
            const state = stateManager.state;
            
            if (state === STATES.PLAYING || state === STATES.NARRATING) {
                playBtn.textContent = '⏸';
                playBtn.title = '暂停';
            } else {
                playBtn.textContent = '▶';
                playBtn.title = '开始电台';
            }
        }

        function updateHostStatus(status, message) {
            const hostStatus = document.getElementById('hostStatus');
            const hostMessage = document.getElementById('hostMessage');
            const hostAvatar = document.getElementById('hostAvatar');

            hostStatus.textContent = status;
            
            if (message) {
                hostMessage.textContent = message;
            }

            if (status === '播报中' || status === '回答中') {
                hostAvatar.classList.add('speaking');
            } else {
                hostAvatar.classList.remove('speaking');
            }
        }

        // ===== Core Functions =====
        async function startRadio() {
            if (stateManager.state === STATES.PLAYING || stateManager.state === STATES.NARRATING) {
                pauseRadio();
                return;
            }

            if (stateManager.state === STATES.PAUSED) {
                resumeRadio();
                return;
            }

            const song = playlist[currentSongIndex];
            if (!song) {
                showToast('没有可播放的歌曲', 'error');
                return;
            }

            stateManager.setState(STATES.LOADING);
            updatePlayButton();
            updateHostStatus('思考中', '');
            showThinkingDots();

            try {
                // Generate narration
                const narrationPrompt = generateNarrationPrompt(song);
                const narration = await callLLM(narrationPrompt, config);
                currentNarrationText = narration;
                
                updateHostStatus('准备播报', narration);
                
                // Convert to speech
                stateManager.setState(STATES.NARRATING);
                updatePlayButton();
                updateHostStatus('播报中', narration);
                
                const audioUrl = await callTTS(narration, config);
                await audioController.playNarration(audioUrl);
                
            } catch (error) {
                console.error('Start radio error:', error);
                showToast(error.message || '启动失败', 'error');
                
                // Fallback: play music directly
                if (song.audioUrl) {
                    stateManager.setState(STATES.PLAYING);
                    updatePlayButton();
                    await audioController.playSong(song.audioUrl);
                    updateHostStatus('等待中', '正在播放音乐');
                } else {
                    stateManager.setState(STATES.IDLE);
                    updatePlayButton();
                    updateHostStatus('等待中', '请配置 API 或添加音频地址');
                }
            }
        }

        function pauseRadio() {
            if (stateManager.state === STATES.PLAYING) {
                audioController.pauseMusic();
                stateManager.setState(STATES.PAUSED);
                updatePlayButton();
                updateHostStatus('已暂停');
            }
        }

        function resumeRadio() {
            if (stateManager.state === STATES.PAUSED) {
                audioController.resumeMusic();
                stateManager.setState(STATES.PLAYING);
                updatePlayButton();
                updateHostStatus('播放中');
            }
        }

        async function playNextSong() {
            currentSongIndex = (currentSongIndex + 1) % playlist.length;
            saveCurrentSong(currentSongIndex);
            updateUI();
            await startRadio();
        }

        async function playPrevSong() {
            currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
            saveCurrentSong(currentSongIndex);
            updateUI();
            await startRadio();
        }

        async function switchSong(index) {
            if (index === currentSongIndex && stateManager.state === STATES.PLAYING) {
                return;
            }
            
            audioController.stopAll();
            currentSongIndex = index;
            saveCurrentSong(currentSongIndex);
            updateUI();
            await startRadio();
        }

        async function reintroduce() {
            if (!playlist[currentSongIndex]) return;
            
            audioController.stopAll();
            await startRadio();
        }

        async function playMusicOnly() {
            const song = playlist[currentSongIndex];
            if (!song || !song.audioUrl) {
                showToast('当前歌曲没有音频地址', 'error');
                return;
            }

            audioController.stopAll();
            stateManager.setState(STATES.PLAYING);
            updatePlayButton();
            updateHostStatus('播放中', '正在播放音乐');
            await audioController.playSong(song.audioUrl);
        }

        async function askQuestion(question) {
            if (!question.trim()) return;
            
            const song = playlist[currentSongIndex];
            stateManager.setState(STATES.ASKING);
            updatePlayButton();
            updateHostStatus('思考中', '');
            showThinkingDots();

            try {
                const prompt = `用户问了一个关于当前歌曲"${song.title}"（${song.artist}）的问题：${question}\n\n请以电台主持人的身份回答，保持专业、有趣。`;
                const answer = await callLLM(prompt, config);
                
                updateHostStatus('回答中', answer);
                
                const audioUrl = await callTTS(answer, config);
                await audioController.playNarration(audioUrl);
                
            } catch (error) {
                console.error('Ask question error:', error);
                showToast(error.message || '回答失败', 'error');
                stateManager.setState(STATES.PLAYING);
                updatePlayButton();
                updateHostStatus('播放中');
            }
        }

        // ===== Event Handlers =====
        function onNarrationEnded() {
            const song = playlist[currentSongIndex];
            if (song && song.audioUrl && stateManager.state === STATES.NARRATING) {
                stateManager.setState(STATES.PLAYING);
                updatePlayButton();
                updateHostStatus('播放中', currentNarrationText);
                audioController.playSong(song.audioUrl);
            } else if (stateManager.state === STATES.ASKING) {
                stateManager.setState(STATES.PLAYING);
                updatePlayButton();
                updateHostStatus('播放中');
                audioController.restoreMusic();
            }
        }

        function onSongEnded() {
            playNextSong();
        }

        function showThinkingDots() {
            const hostMessage = document.getElementById('hostMessage');
            hostMessage.innerHTML = `
                <div class="host-message-text thinking">
                    <span>正在思考</span>
                    <div class="thinking-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            `;
        }

        function generateNarrationPrompt(song) {
            return `请为以下歌曲生成一段适合电台播报的介绍文案：

歌曲：${song.title}
歌手：${song.artist}
专辑：${song.album || '未知'}
年代：${song.year || '未知'}
风格：${song.genre || '未知'}
说明：${song.description || ''}

要求：
1. 包含歌曲的历史背景
2. 分享一些有趣的事实
3. 描述音乐风格特点
4. 语言自然、亲切、有感染力
5. 长度约 150-200 字
6. 适合口语播报`;
        }

        // ===== Toast =====
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== Settings =====
        function openSettings() {
            document.getElementById('settingsPanel').classList.add('active');
            loadSettingsToForm();
        }

        function closeSettings() {
            document.getElementById('settingsPanel').classList.remove('active');
        }

        function loadSettingsToForm() {
            document.getElementById('llmApiUrl').value = config.llmApiUrl || '';
            document.getElementById('llmApiKey').value = config.llmApiKey || '';
            document.getElementById('llmModel').value = config.llmModel || '';
            document.getElementById('ttsApiUrl').value = config.ttsApiUrl || '';
            document.getElementById('ttsApiKey').value = config.ttsApiKey || '';
            document.getElementById('ttsVoice').value = config.ttsVoice || '';
        }

        function saveSettings() {
            config.llmApiUrl = document.getElementById('llmApiUrl').value.trim();
            config.llmApiKey = document.getElementById('llmApiKey').value.trim();
            config.llmModel = document.getElementById('llmModel').value.trim();
            config.ttsApiUrl = document.getElementById('ttsApiUrl').value.trim();
            config.ttsApiKey = document.getElementById('ttsApiKey').value.trim();
            config.ttsVoice = document.getElementById('ttsVoice').value.trim();
            
            saveConfig(config);
            showToast('设置已保存', 'success');
            closeSettings();
        }

        async function testConnection() {
            const llmUrl = document.getElementById('llmApiUrl').value.trim();
            const llmKey = document.getElementById('llmApiKey').value.trim();
            
            if (!llmUrl || !llmKey) {
                showToast('请先填写 LLM API 配置', 'error');
                return;
            }

            try {
                showToast('正在测试连接...', 'info');
                await callLLM('你好', {
                    llmApiUrl: llmUrl,
                    llmApiKey: llmKey,
                    llmModel: document.getElementById('llmModel').value.trim() || 'gpt-3.5-turbo'
                });
                showToast('LLM 连接成功', 'success');
            } catch (error) {
                showToast('连接失败: ' + error.message, 'error');
            }
        }

        // ===== Utility =====
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // ===== Event Listeners =====
        document.getElementById('playBtn').addEventListener('click', startRadio);
        document.getElementById('nextBtn').addEventListener('click', playNextSong);
        document.getElementById('prevBtn').addEventListener('click', playPrevSong);
        document.getElementById('reintroBtn').addEventListener('click', reintroduce);
        document.getElementById('musicOnlyBtn').addEventListener('click', playMusicOnly);
        document.getElementById('settingsToggle').addEventListener('click', openSettings);
        document.getElementById('settingsClose').addEventListener('click', closeSettings);
        document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
        document.getElementById('testConnectionBtn').addEventListener('click', testConnection);

        document.getElementById('sendBtn').addEventListener('click', () => {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (question) {
                askQuestion(question);
                input.value = '';
            }
        });

        document.getElementById('questionInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('sendBtn').click();
            }
        });

        document.getElementById('musicVolume').addEventListener('input', (e) => {
            const volume = parseInt(e.target.value) / 100;
            config.musicVolume = parseInt(e.target.value);
            audioController.setMusicVolume(volume);
            saveConfig(config);
        });

        document.getElementById('narrationVolume').addEventListener('input', (e) => {
            const volume = parseInt(e.target.value) / 100;
            config.narrationVolume = parseInt(e.target.value);
            audioController.setNarrationVolume(volume);
            saveConfig(config);
        });

        document.getElementById('progressBar').addEventListener('click', (e) => {
            const audio = audioController.musicAudio;
            if (audio.duration) {
                const rect = e.currentTarget.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
            }
        });

        // State change listener
        stateManager.subscribe((oldState, newState) => {
            updateStatusBar();
            updatePlayButton();
        });

        // ===== Initialize =====
        function init() {
            updateUI();
            
            // Apply saved volume settings
            audioController.setMusicVolume(config.musicVolume / 100);
            audioController.setNarrationVolume(config.narrationVolume / 100);
            
            // Check if API is configured
            if (!config.llmApiUrl || !config.llmApiKey) {
                updateHostStatus('等待中', '请先在设置中配置 API，或点击"仅播放音乐"直接播放');
            }
        }

        init();
    </script>
</body>
</html>
