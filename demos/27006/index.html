<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e27">
  <title>时光胶囊 · Time Capsule</title>
  <meta name="description" content="拆开回忆,看见时光 — 一个沉浸式记忆盲盒">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lock.css">
  <link rel="stylesheet" href="css/capsule.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <!-- 极光背景层 -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-layer aurora-1"></div>
    <div class="aurora-layer aurora-2"></div>
    <div class="aurora-layer aurora-3"></div>
    <div class="aurora-layer aurora-glow"></div>
    <div class="grain-overlay"></div>
    <div class="vignette"></div>
  </div>

  <!-- 密码锁页 -->
  <section id="view-lock" class="view view--active" data-route="lock">
    <div class="lock-stage">
      <div class="lock-emblem" aria-hidden="true">
        <svg viewBox="0 0 120 160" class="lock-emblem-svg">
          <defs>
            <linearGradient id="capGlass" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#c084fc" stop-opacity="0.35"/>
            </linearGradient>
          </defs>
          <ellipse cx="60" cy="40" rx="34" ry="38" fill="url(#capGlass)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
          <path d="M26 42 Q26 120 60 138 Q94 120 94 42" fill="url(#capGlass)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
          <ellipse cx="60" cy="40" rx="34" ry="38" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.6"/>
          <circle cx="60" cy="70" r="3" fill="#fbbf24" opacity="0.9"/>
          <circle cx="48" cy="90" r="2" fill="#f9a8d4" opacity="0.8"/>
          <circle cx="72" cy="100" r="1.6" fill="#5eead4" opacity="0.8"/>
        </svg>
      </div>

      <h1 class="lock-title">时光胶囊</h1>
      <p class="lock-subtitle">输入封存的那一天</p>

      <div class="lock-input-wrap">
        <div class="lock-dots" id="lock-dots" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <input type="tel" id="lock-input" class="lock-input" inputmode="numeric" autocomplete="off"
               maxlength="8" placeholder="·" aria-label="解封密钥">
      </div>

      <button class="lock-btn" id="lock-btn" type="button">
        <span class="lock-btn-text">解封回忆</span>
      </button>

      <p class="lock-hint" id="lock-hint">格式:YYYYMMDD · 如 20240214</p>

      <div class="lock-sleep" id="lock-sleep" aria-hidden="true">
        <div class="sleep-z">z</div>
        <div class="sleep-z">Z</div>
        <div class="sleep-z">z</div>
        <p class="sleep-text">胶囊打瞌睡了…<br>稍候再试一次吧</p>
      </div>
    </div>
  </section>

  <!-- 3D 胶囊首页 -->
  <section id="view-capsule" class="view" data-route="capsule">
    <div class="capsule-stage">
      <div class="capsule-canvas-wrap" id="capsule-canvas-wrap">
        <canvas id="capsule-canvas" class="capsule-canvas"></canvas>
        <div class="capsule-fallback" id="capsule-fallback" aria-hidden="true">
          <div class="css-capsule">
            <div class="css-capsule-top"></div>
            <div class="css-capsule-body"></div>
            <div class="css-capsule-shine"></div>
          </div>
        </div>
      </div>

      <div class="capsule-meta">
        <h2 class="capsule-title" id="capsule-title">我们的时光胶囊</h2>
        <p class="capsule-subtitle" id="capsule-subtitle">封存于 2024 年的那个春天</p>
      </div>

      <button class="capsule-cta" id="capsule-cta" type="button">
        <span class="capsule-cta-pulse"></span>
        <span class="capsule-cta-text">点击开启时光</span>
      </button>
    </div>
  </section>

  <!-- 记忆长廊 -->
  <section id="view-gallery" class="view" data-route="gallery">
    <header class="gallery-header">
      <button class="icon-btn" id="back-to-capsule" type="button" aria-label="返回胶囊">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="gallery-header-title">
        <span class="gallery-header-main">记忆长廊</span>
        <span class="gallery-header-sub" id="gallery-count">— 段时光</span>
      </div>
      <button class="icon-btn" id="ambient-toggle" type="button" aria-label="环境音">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" id="ambient-icon"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
      </button>
    </header>

    <div class="gallery-scroll" id="gallery-scroll">
      <div class="timeline-rail" aria-hidden="true"></div>
      <div class="masonry" id="masonry"></div>
      <div class="gallery-end">
        <div class="gallery-end-line"></div>
        <p class="gallery-end-text">这里封存着所有的时光</p>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="上一张">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <figure class="lightbox-figure">
      <img class="lightbox-img" id="lightbox-img" alt="">
      <figcaption class="lightbox-caption" id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="下一张">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <!-- 彩蛋 Canvas -->
  <canvas id="easter-canvas" class="easter-canvas" aria-hidden="true"></canvas>

  <!-- 音频控制 -->
  <div id="audio-control" class="audio-control" aria-hidden="true">
    <button class="audio-play" id="audio-play" type="button" aria-label="播放环境音">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg>
    </button>
    <div class="audio-bars" id="audio-bars" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <input type="range" id="audio-volume" class="audio-volume" min="0" max="100" value="40" aria-label="音量">
  </div>

  <!-- 过渡遮罩 -->
  <div id="transition-veil" class="transition-veil" aria-hidden="true"></div>

  <!-- 数据(全局变量,确保双击 file:// 可运行) -->
  <script src="config/memories.js"></script>

  <!-- 第三方库(CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <!-- 应用逻辑 -->
  <script src="js/audio.js"></script>
  <script src="js/easter-egg.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/capsule.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/input.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
