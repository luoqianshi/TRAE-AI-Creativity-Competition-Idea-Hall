<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 家庭菜谱 · 创意原型</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f4f6fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .app {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            padding: 1.8rem 1.5rem 2rem;
            transition: all 0.2s;
            position: relative;
        }
        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.6rem;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }
        .header .badge {
            background: #eef2ff;
            color: #4f46e5;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.2rem 0.8rem;
            border-radius: 100px;
            margin-left: auto;
        }
        /* 输入区 */
        .input-area {
            background: #f8f9fe;
            border-radius: 20px;
            padding: 1.2rem 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e9edf5;
        }
        .input-area label {
            font-weight: 600;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 0.4rem;
            color: #1a1a2e;
        }
        .input-area .hint {
            font-size: 0.8rem;
            color: #6b7280;
            margin-bottom: 0.8rem;
        }
        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .tag {
            background: #ffffff;
            border: 1px solid #d1d9e6;
            border-radius: 100px;
            padding: 0.2rem 1rem;
            font-size: 0.8rem;
            color: #2d2d44;
            cursor: pointer;
            transition: 0.15s;
        }
        .tag:hover {
            border-color: #4f46e5;
            background: #eef2ff;
        }
        .tag.active {
            background: #4f46e5;
            color: #fff;
            border-color: #4f46e5;
        }
        .input-row {
            display: flex;
            gap: 0.6rem;
            align-items: center;
        }
        .input-row input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #d1d9e6;
            border-radius: 60px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            background: #fff;
        }
        .input-row input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .input-row button {
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 60px;
            padding: 0.7rem 1.4rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-row button:hover {
            background: #4338ca;
        }
        .input-row button:active {
            transform: scale(0.96);
        }
        /* 拍照模拟 */
        .camera-sim {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px dashed #d1d9e6;
        }
        .camera-sim .fake-btn {
            background: #1e293b;
            color: #fff;
            border: none;
            border-radius: 60px;
            padding: 0.5rem 1.2rem;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }
        .camera-sim .fake-btn:hover {
            background: #0f172a;
        }
        .camera-sim .status {
            font-size: 0.8rem;
            color: #6b7280;
        }
        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 1rem 0;
        }
        .loading .spinner {
            width: 32px;
            height: 32px;
            border: 4px solid #e9edf5;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.4rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p {
            color: #4f46e5;
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* 结果区 */
        .result {
            display: none;
            margin-top: 1.5rem;
            border-top: 2px solid #f0f2f7;
            padding-top: 1.2rem;
        }
        .result .section-title {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #1a1a2e;
        }
        .recipe-card {
            background: #fafbff;
            border-radius: 16px;
            padding: 1rem 1.2rem;
            margin-bottom: 0.8rem;
            border: 1px solid #e9edf5;
            transition: 0.15s;
        }
        .recipe-card .name {
            font-weight: 700;
            font-size: 1.05rem;
            color: #0b0b1a;
        }
        .recipe-card .meta {
            font-size: 0.8rem;
            color: #6b7280;
            margin: 0.2rem 0 0.4rem;
        }
        .recipe-card .ingredients {
            font-size: 0.9rem;
            color: #2d2d44;
            margin-bottom: 0.3rem;
        }
        .recipe-card .steps {
            font-size: 0.85rem;
            color: #4b4b63;
            padding-left: 1.2rem;
            margin-top: 0.3rem;
        }
        .recipe-card .steps li {
            margin-bottom: 0.2rem;
        }
        .shopping-list {
            background: #f1f5f9;
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            margin-top: 0.8rem;
        }
        .shopping-list .title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
        }
        .shopping-list .items {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.8rem;
        }
        .shopping-list .items span {
            background: #fff;
            padding: 0.15rem 0.8rem;
            border-radius: 100px;
            font-size: 0.8rem;
            border: 1px solid #d1d9e6;
        }
        .empty-state {
            color: #6b7280;
            text-align: center;
            padding: 1.2rem 0;
            font-size: 0.9rem;
        }
        /* 底部 */
        .footer-note {
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #9ca3af;
            text-align: center;
            border-top: 1px solid #f0f2f7;
            padding-top: 1rem;
        }
        .footer-note strong {
            color: #4f46e5;
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- 头部 -->
    <div class="header">
        <h1>🍳 AI 冰箱管家</h1>
        <span class="badge">创意原型</span>
    </div>

    <!-- 输入区 -->
    <div class="input-area">
        <label for="ingredientInput">📦 已有食材</label>
        <div class="hint">输入你冰箱里的食材（用逗号分隔），AI 会帮你推荐菜谱</div>

        <!-- 快捷标签 -->
        <div class="tag-group" id="tagGroup">
            <span class="tag" data-ing="鸡蛋">🥚 鸡蛋</span>
            <span class="tag" data-ing="番茄">🍅 番茄</span>
            <span class="tag" data-ing="土豆">🥔 土豆</span>
            <span class="tag" data-ing="鸡胸肉">🐔 鸡胸肉</span>
            <span class="tag" data-ing="胡萝卜">🥕 胡萝卜</span>
            <span class="tag" data-ing="洋葱">🧅 洋葱</span>
        </div>

        <div class="input-row">
            <input type="text" id="ingredientInput" placeholder="例如：鸡蛋, 番茄, 青椒" />
            <button id="searchBtn">✨ AI 推荐</button>
        </div>

        <!-- 模拟拍照上传 -->
        <div class="camera-sim">
            <button class="fake-btn" id="cameraSimBtn">📷 模拟拍照识别</button>
            <span class="status" id="cameraStatus">点击后模拟识别食材</span>
        </div>
    </div>

    <!-- 加载动画 -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>🧠 AI 正在分析你的冰箱……</p>
    </div>

    <!-- 结果区域 -->
    <div class="result" id="resultArea">
        <div class="section-title">📋 为你推荐的菜谱</div>
        <div id="recipeList"></div>

        <div class="section-title" style="margin-top:1.2rem;">🛒 智能购物清单</div>
        <div class="shopping-list" id="shoppingList">
            <div class="title">建议补充以下食材</div>
            <div class="items" id="shoppingItems"></div>
        </div>
    </div>

    <div class="footer-note">
        ⚡ 创意产物 · 由 <strong>TRAE Work</strong> 自动生成 · 展示 AI 菜谱推荐逻辑
    </div>
</div>

<script>
    (function() {
        // ---------- 内置菜谱库 ----------
        const recipes = [
            {
                name: '番茄炒蛋',
                ingredients: ['番茄', '鸡蛋', '盐', '糖'],
                steps: ['鸡蛋打散加盐', '番茄切块', '热油炒蛋盛出', '炒番茄出汁', '混合翻炒调味'],
                needs: ['番茄', '鸡蛋']
            },
            {
                name: '酸辣土豆丝',
                ingredients: ['土豆', '干辣椒', '醋', '盐', '青椒'],
                steps: ['土豆切丝泡水', '热油爆香辣椒', '下土豆丝翻炒', '加醋、盐、青椒丝炒熟'],
                needs: ['土豆', '青椒']
            },
            {
                name: '宫保鸡丁',
                ingredients: ['鸡胸肉', '花生', '干辣椒', '黄瓜', '胡萝卜', '酱油'],
                steps: ['鸡胸肉切丁腌渍', '炸花生米', '爆香辣椒', '下鸡肉翻炒', '加黄瓜胡萝卜丁炒熟'],
                needs: ['鸡胸肉', '胡萝卜', '黄瓜']
            },
            {
                name: '洋葱炒鸡蛋',
                ingredients: ['洋葱', '鸡蛋', '盐', '胡椒粉'],
                steps: ['洋葱切丝', '鸡蛋打散', '热油炒蛋盛出', '炒洋葱变软', '混合调味'],
                needs: ['洋葱', '鸡蛋']
            },
            {
                name: '胡萝卜炖牛腩',
                ingredients: ['胡萝卜', '牛腩', '姜', '八角', '酱油'],
                steps: ['牛腩焯水', '爆香姜八角', '加牛腩翻炒', '加水炖1小时', '加入胡萝卜炖软'],
                needs: ['胡萝卜', '牛腩']
            },
            {
                name: '地三鲜',
                ingredients: ['土豆', '茄子', '青椒', '蒜', '酱油'],
                steps: ['土豆茄子切块', '油炸至金黄', '爆香蒜末', '加青椒翻炒', '加酱油调味'],
                needs: ['土豆', '茄子', '青椒']
            },
            {
                name: '鸡肉沙拉',
                ingredients: ['鸡胸肉', '生菜', '番茄', '黄瓜', '沙拉酱'],
                steps: ['鸡胸肉煮熟撕丝', '生菜番茄黄瓜切好', '混合加沙拉酱拌匀'],
                needs: ['鸡胸肉', '番茄', '黄瓜']
            },
            {
                name: '番茄疙瘩汤',
                ingredients: ['番茄', '面粉', '鸡蛋', '青菜', '盐'],
                steps: ['番茄炒出汁加水', '面粉加水搅成疙瘩', '下入汤中煮熟', '打蛋花加青菜调味'],
                needs: ['番茄', '鸡蛋']
            }
        ];

        // ---------- DOM 引用 ----------
        const inputEl = document.getElementById('ingredientInput');
        const searchBtn = document.getElementById('searchBtn');
        const loadingEl = document.getElementById('loading');
        const resultArea = document.getElementById('resultArea');
        const recipeList = document.getElementById('recipeList');
        const shoppingItems = document.getElementById('shoppingItems');
        const tagGroup = document.getElementById('tagGroup');
        const cameraSimBtn = document.getElementById('cameraSimBtn');
        const cameraStatus = document.getElementById('cameraStatus');

        // ---------- 辅助函数 ----------
        // 从输入字符串解析食材数组
        function parseIngredients(input) {
            return input.split(/[,，、\s]+/).map(s => s.trim()).filter(s => s.length > 0);
        }

        // 匹配菜谱：返回包含所有给定食材的菜谱（至少匹配一个）
        function matchRecipes(ingList) {
            if (!ingList || ingList.length === 0) return [];
            const lowerIngs = ingList.map(i => i.toLowerCase());
            return recipes.filter(recipe => {
                const recipeLower = recipe.ingredients.map(i => i.toLowerCase());
                // 要求至少有一个食材匹配
                return lowerIngs.some(ing => recipeLower.some(r => r.includes(ing) || ing.includes(r)));
            });
        }

        // 生成购物清单：对于推荐的菜谱，找出缺少的食材
        function generateShoppingList(recipesMatched, userIngs) {
            if (!recipesMatched || recipesMatched.length === 0) return [];
            const userLower = userIngs.map(i => i.toLowerCase());
            const allNeeded = new Set();
            recipesMatched.forEach(r => {
                r.ingredients.forEach(ing => {
                    const ingLower = ing.toLowerCase();
                    // 如果用户没有这个食材（近似匹配），加入购物清单
                    const has = userLower.some(u => u.includes(ingLower) || ingLower.includes(u));
                    if (!has) allNeeded.add(ing);
                });
            });
            return Array.from(allNeeded);
        }

        // 渲染结果
        function renderResults(ingList) {
            // 显示加载
            loadingEl.style.display = 'block';
            resultArea.style.display = 'none';

            // 模拟 AI 延迟
            setTimeout(() => {
                loadingEl.style.display = 'none';
                resultArea.style.display = 'block';

                const matched = matchRecipes(ingList);
                if (matched.length === 0) {
                    recipeList.innerHTML = `<div class="empty-state">😅 没找到匹配的菜谱，试试换些食材吧</div>`;
                    shoppingItems.innerHTML = `<span>暂无建议</span>`;
                    return;
                }

                // 渲染菜谱
                let html = '';
                matched.forEach(r => {
                    html += `
                        <div class="recipe-card">
                            <div class="name">${r.name}</div>
                            <div class="meta">所需食材：${r.ingredients.join('、')}</div>
                            <ul class="steps">
                                ${r.steps.map(s => `<li>${s}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                });
                recipeList.innerHTML = html;

                // 渲染购物清单
                const shopping = generateShoppingList(matched, ingList);
                if (shopping.length === 0) {
                    shoppingItems.innerHTML = `<span>🎉 你已有全部食材，直接下厨吧！</span>`;
                } else {
                    shoppingItems.innerHTML = shopping.map(item => `<span>${item}</span>`).join('');
                }
            }, 1500); // 模拟加载
        }

        // 主搜索函数
        function doSearch(inputText) {
            const ings = parseIngredients(inputText);
            if (ings.length === 0) {
                alert('请输入至少一种食材～');
                return;
            }
            renderResults(ings);
        }

        // ---------- 事件绑定 ----------
        searchBtn.addEventListener('click', function() {
            doSearch(inputEl.value);
        });

        inputEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doSearch(inputEl.value);
            }
        });

        // 快捷标签点击
        tagGroup.addEventListener('click', function(e) {
            const tag = e.target.closest('.tag');
            if (!tag) return;
            const ing = tag.dataset.ing;
            if (!ing) return;
            // 切换激活状态（可选）
            tag.classList.toggle('active');
            // 将食材添加到输入框
            let current = inputEl.value;
            const ings = parseIngredients(current);
            if (!ings.includes(ing)) {
                ings.push(ing);
                inputEl.value = ings.join('、');
            } else {
                // 如果已经存在则移除
                const newIngs = ings.filter(i => i !== ing);
                inputEl.value = newIngs.join('、');
                tag.classList.remove('active');
            }
            // 自动触发搜索？可让用户手动点击
        });

        // 模拟拍照识别
        cameraSimBtn.addEventListener('click', function() {
            cameraStatus.textContent = '📸 正在识别...';
            cameraSimBtn.disabled = true;
            setTimeout(() => {
                // 模拟识别出一组食材
                const mockIngredients = ['鸡蛋', '番茄', '青椒', '洋葱'];
                inputEl.value = mockIngredients.join('、');
                cameraStatus.textContent = '✅ 识别完成：鸡蛋、番茄、青椒、洋葱';
                cameraSimBtn.disabled = false;
                // 自动搜索
                doSearch(inputEl.value);
            }, 1200);
        });

        // ---------- 默认预填充示例 ----------
        // 页面加载后默认展示示例，方便演示
        window.addEventListener('load', function() {
            inputEl.value = '鸡蛋, 番茄, 青椒';
            // 激活对应标签
            const tags = tagGroup.querySelectorAll('.tag');
            tags.forEach(tag => {
                const ing = tag.dataset.ing;
                if (['鸡蛋','番茄','青椒'].includes(ing)) {
                    tag.classList.add('active');
                }
            });
            // 自动显示结果
            doSearch(inputEl.value);
        });

    })();
</script>
</body>
</html>
