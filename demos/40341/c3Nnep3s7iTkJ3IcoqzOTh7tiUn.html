<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨韵·小说创作助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0e;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --bg-card-hover: #222230;
            --accent-gold: #d4a574;
            --accent-amber: #c9a227;
            --accent-warm: #e8c47c;
            --text-primary: #e8e4dc;
            --text-secondary: #9a9590;
            --text-muted: #6a6560;
            --border-subtle: rgba(212, 165, 116, 0.15);
            --border-active: rgba(212, 165, 116, 0.4);
            --shadow-glow: 0 0 40px rgba(212, 165, 116, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* 背景纹理 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(212, 165, 116, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(201, 162, 39, 0.02) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
            position: relative;
            z-index: 1;
        }

        /* 头部 */
        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-warm) 50%, var(--accent-amber) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: 0.15em;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.3em;
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 48px;
            flex-wrap: wrap;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .nav-tab {
            padding: 12px 28px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .nav-tab:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-gold);
            color: var(--text-primary);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.15) 0%, rgba(201, 162, 39, 0.1) 100%);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: var(--shadow-glow);
        }

        /* 内容区域 */
        .content-section {
            display: none;
            animation: fadeInUp 0.5s ease-out;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        /* 卡片 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 28px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-amber), var(--accent-gold));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-active);
            box-shadow: var(--shadow-glow);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-warm);
        }

        .card-type {
            font-size: 0.75rem;
            padding: 4px 10px;
            background: rgba(212, 165, 116, 0.1);
            border-radius: 20px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .card-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.7;
            margin-bottom: 16px;
        }

        .card-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .meta-item {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .meta-item strong {
            color: var(--text-secondary);
            margin-right: 4px;
        }

        /* 添加按钮 */
        .add-btn {
            background: linear-gradient(135deg, rgba(212, 165, 116, 0.2) 0%, rgba(201, 162, 39, 0.15) 100%);
            border: 2px dashed var(--border-active);
            border-radius: 16px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 200px;
        }

        .add-btn:hover {
            background: rgba(212, 165, 116, 0.08);
            border-color: var(--accent-gold);
        }

        .add-icon {
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 12px;
        }

        .add-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* 时间线 */
        .timeline {
            position: relative;
            padding-left: 40px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--accent-gold) 0%, var(--accent-amber) 50%, var(--bg-primary) 100%);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 32px;
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            border-color: var(--border-active);
            transform: translateX(8px);
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -34px;
            top: 28px;
            width: 12px;
            height: 12px;
            background: var(--accent-gold);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.4);
        }

        .timeline-date {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.1rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .timeline-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .timeline-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* 模态框 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.4s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            padding: 28px 32px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.5rem;
            color: var(--accent-warm);
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .modal-body {
            padding: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .form-input,
        .form-textarea,
        .form-select {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Noto Sans SC', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(212, 165, 116, 0.1);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Noto Sans SC', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-amber) 100%);
            color: var(--bg-primary);
            font-weight: 500;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 165, 116, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            margin-right: 12px;
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .modal-footer {
            padding: 24px 32px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            justify-content: flex-end;
        }

        /* 统计面板 */
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }

        .stat-number {
            font-family: 'Noto Serif SC', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* 标签 */
        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .tag {
            padding: 4px 12px;
            background: rgba(212, 165, 116, 0.08);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent-gold);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px 40px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .empty-hint {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        /* 关系图谱 */
        .relation-view {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 32px;
            min-height: 400px;
        }

        .relation-node {
            position: absolute;
            padding: 12px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            color: var(--accent-warm);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .relation-node:hover {
            background: rgba(212, 165, 116, 0.15);
            transform: scale(1.05);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .stats-panel {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-gold);
        }

        /* 删除按钮 */
        .card-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover .card-actions {
            opacity: 1;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-subtle);
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">墨韵</h1>
            <p class="tagline">小说创作 · 世界构建 · 剧情梳理</p>
        </header>

        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="characters">角色档案</button>
            <button class="nav-tab" data-tab="world">世界观</button>
            <button class="nav-tab" data-tab="timeline">时间线</button>
            <button class="nav-tab" data-tab="plot">剧情梗概</button>
        </nav>

        <!-- 角色档案 -->
        <section id="characters" class="content-section active">
            <div class="stats-panel">
                <div class="stat-card">
                    <div class="stat-number" id="charCount">0</div>
                    <div class="stat-label">角色总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="factionCount">0</div>
                    <div class="stat-label">阵营势力</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="eventCount">0</div>
                    <div class="stat-label">世界事件</div>
                </div>
            </div>
            <div class="card-grid" id="characterGrid">
                <div class="add-btn" onclick="openModal('character')">
                    <span class="add-icon">+</span>
                    <span class="add-text">创建新角色</span>
                </div>
            </div>
        </section>

        <!-- 世界观 -->
        <section id="world" class="content-section">
            <div class="card-grid" id="worldGrid">
                <div class="add-btn" onclick="openModal('world')">
                    <span class="add-icon">+</span>
                    <span class="add-text">构建新世界元素</span>
                </div>
            </div>
        </section>

        <!-- 时间线 -->
        <section id="timeline" class="content-section">
            <div class="timeline" id="timelineContainer">
                <div class="add-btn" onclick="openModal('timeline')" style="margin-bottom: 32px;">
                    <span class="add-icon">+</span>
                    <span class="add-text">添加时间节点</span>
                </div>
            </div>
        </section>

        <!-- 剧情梗概 -->
        <section id="plot" class="content-section">
            <div class="card-grid" id="plotGrid">
                <div class="add-btn" onclick="openModal('plot')">
                    <span class="add-icon">+</span>
                    <span class="add-text">记录剧情大纲</span>
                </div>
            </div>
        </section>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">创建角色</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- 动态内容 -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" id="modalSubmit" onclick="submitForm()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 数据存储
        let data = {
            characters: [],
            worldElements: [],
            timeline: [],
            plot: []
        };

        let currentModal = null;
        let editingIndex = null;

        // 从本地存储加载
        function loadData() {
            const saved = localStorage.getItem('moyun_data');
            if (saved) {
                data = JSON.parse(saved);
                renderAll();
            }
        }

        // 保存到本地存储
        function saveData() {
            localStorage.setItem('moyun_data', JSON.stringify(data));
            updateStats();
        }

        // 更新统计
        function updateStats() {
            document.getElementById('charCount').textContent = data.characters.length;
            document.getElementById('factionCount').textContent = data.worldElements.filter(e => e.type === 'faction').length;
            document.getElementById('eventCount').textContent = data.timeline.length;
        }

        // 渲染所有
        function renderAll() {
            renderCharacters();
            renderWorld();
            renderTimeline();
            renderPlot();
            updateStats();
        }

        // 渲染角色
        function renderCharacters() {
            const grid = document.getElementById('characterGrid');
            const addBtn = grid.querySelector('.add-btn');

            // 清除旧的角色卡片
            Array.from(grid.children).forEach(child => {
                if (!child.classList.contains('add-btn')) {
                    child.remove();
                }
            });

            data.characters.forEach((char, index) => {
                const card = createCharacterCard(char, index);
                grid.insertBefore(card, addBtn);
            });
        }

        function createCharacterCard(char, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-actions">
                    <button class="delete-btn" onclick="deleteItem('characters', ${index})">×</button>
                </div>
                <div class="card-header">
                    <h3 class="card-title">${char.name}</h3>
                    <span class="card-type">${char.role}</span>
                </div>
                <p class="card-desc">${char.desc || '暂无描述'}</p>
                <div class="card-meta">
                    <span class="meta-item"><strong>阵营:</strong>${char.faction || '未设定'}</span>
                    <span class="meta-item"><strong>登场:</strong>第${char.appearance || '?'}章</span>
                </div>
                ${char.tags && char.tags.length ? `<div class="tags">${char.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
            `;
            return card;
        }

        // 渲染世界观
        function renderWorld() {
            const grid = document.getElementById('worldGrid');
            const addBtn = grid.querySelector('.add-btn');

            Array.from(grid.children).forEach(child => {
                if (!child.classList.contains('add-btn')) {
                    child.remove();
                }
            });

            data.worldElements.forEach((elem, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-actions">
                        <button class="delete-btn" onclick="deleteItem('worldElements', ${index})">×</button>
                    </div>
                    <div class="card-header">
                        <h3 class="card-title">${elem.name}</h3>
                        <span class="card-type">${getWorldTypeName(elem.type)}</span>
                    </div>
                    <p class="card-desc">${elem.desc || '暂无描述'}</p>
                    ${elem.location ? `<div class="card-meta"><span class="meta-item"><strong>位置:</strong>${elem.location}</span></div>` : ''}
                `;
                grid.insertBefore(card, addBtn);
            });
        }

        function getWorldTypeName(type) {
            const names = {
                location: '地理',
                faction: '势力',
                item: '神器',
                race: '种族',
                magic: '魔法体系',
                culture: '文化'
            };
            return names[type] || type;
        }

        // 渲染时间线
        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            const addBtn = container.querySelector('.add-btn');

            // 按时间排序
            const sorted = [...data.timeline].sort((a, b) => {
                const numA = parseInt(a.date.replace(/[^0-9]/g, '')) || 0;
                const numB = parseInt(b.date.replace(/[^0-9]/g, '')) || 0;
                return numA - numB;
            });

            // 移除旧的时间线项
            Array.from(container.children).forEach(child => {
                if (!child.classList.contains('add-btn')) {
                    child.remove();
                }
            });

            sorted.forEach((item, index) => {
                const elem = document.createElement('div');
                elem.className = 'timeline-item';
                elem.innerHTML = `
                    <div class="card-actions" style="opacity:1;position:static;margin-bottom:8px;">
                        <button class="delete-btn" onclick="deleteItem('timeline', ${index})">×</button>
                    </div>
                    <div class="timeline-date">${item.date}</div>
                    <h3 class="timeline-title">${item.title}</h3>
                    <p class="timeline-desc">${item.desc || ''}</p>
                `;
                container.insertBefore(elem, addBtn.nextSibling);
            });
        }

        // 渲染剧情
        function renderPlot() {
            const grid = document.getElementById('plotGrid');
            const addBtn = grid.querySelector('.add-btn');

            Array.from(grid.children).forEach(child => {
                if (!child.classList.contains('add-btn')) {
                    child.remove();
                }
            });

            data.plot.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-actions">
                        <button class="delete-btn" onclick="deleteItem('plot', ${index})">×</button>
                    </div>
                    <div class="card-header">
                        <h3 class="card-title">${p.title}</h3>
                        <span class="card-type">${p.arc || '章节'}</span>
                    </div>
                    <p class="card-desc">${p.desc || '暂无概述'}</p>
                    <div class="card-meta">
                        <span class="meta-item"><strong>涉及:</strong>${p.characters?.join('、') || '未指定'}</span>
                    </div>
                `;
                grid.insertBefore(card, addBtn);
            });
        }

        // 模态框控制
        function openModal(type) {
            currentModal = type;
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            const titles = {
                character: '创建角色',
                world: '构建世界元素',
                timeline: '添加时间节点',
                plot: '记录剧情大纲'
            };

            title.textContent = titles[type];
            body.innerHTML = getFormHTML(type);
            overlay.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            currentModal = null;
        }

        function getFormHTML(type) {
            const forms = {
                character: `
                    <div class="form-group">
                        <label class="form-label">角色名称</label>
                        <input type="text" class="form-input" id="charName" placeholder="输入角色名">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">角色定位</label>
                            <select class="form-select" id="charRole">
                                <option value="主角">主角</option>
                                <option value="配角">配角</option>
                                <option value="反派">反派</option>
                                <option value="NPC">NPC</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">登场章节</label>
                            <input type="text" class="form-input" id="charAppearance" placeholder="如: 第1章">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">所属阵营</label>
                        <input type="text" class="form-input" id="charFaction" placeholder="角色所属势力">
                    </div>
                    <div class="form-group">
                        <label class="form-label">角色描述</label>
                        <textarea class="form-textarea" id="charDesc" placeholder="外貌、性格、背景..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">标签（逗号分隔）</label>
                        <input type="text" class="form-input" id="charTags" placeholder="如: 剑客, 正义, 孤独">
                    </div>
                `,
                world: `
                    <div class="form-group">
                        <label class="form-label">元素名称</label>
                        <input type="text" class="form-input" id="worldName" placeholder="地理/势力/神器/种族...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">元素类型</label>
                        <select class="form-select" id="worldType">
                            <option value="location">地理</option>
                            <option value="faction">势力</option>
                            <option value="item">神器</option>
                            <option value="race">种族</option>
                            <option value="magic">魔法体系</option>
                            <option value="culture">文化</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">位置/所属</label>
                        <input type="text" class="form-input" id="worldLocation" placeholder="所在位置或从属关系">
                    </div>
                    <div class="form-group">
                        <label class="form-label">描述</label>
                        <textarea class="form-textarea" id="worldDesc" placeholder="详细描述这个元素..."></textarea>
                    </div>
                `,
                timeline: `
                    <div class="form-group">
                        <label class="form-label">时间点</label>
                        <input type="text" class="form-input" id="tlDate" placeholder="如: 第1年/神圣历234年/故事开始前">
                    </div>
                    <div class="form-group">
                        <label class="form-label">事件标题</label>
                        <input type="text" class="form-input" id="tlTitle" placeholder="事件名称">
                    </div>
                    <div class="form-group">
                        <label class="form-label">事件描述</label>
                        <textarea class="form-textarea" id="tlDesc" placeholder="详细描述这个事件..."></textarea>
                    </div>
                `,
                plot: `
                    <div class="form-group">
                        <label class="form-label">章节/幕标题</label>
                        <input type="text" class="form-input" id="plotTitle" placeholder="如: 英雄崛起">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">篇章类型</label>
                            <select class="form-select" id="plotArc">
                                <option value="序章">序章</option>
                                <option value="第一幕">第一幕</option>
                                <option value="第二幕">第二幕</option>
                                <option value="第三幕">第三幕</option>
                                <option value="高潮">高潮</option>
                                <option value="结局">结局</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">涉及角色</label>
                            <input type="text" class="form-input" id="plotChars" placeholder="逗号分隔">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">剧情概述</label>
                        <textarea class="form-textarea" id="plotDesc" placeholder="这段剧情的主要发展..."></textarea>
                    </div>
                `
            };
            return forms[type];
        }

        function submitForm() {
            if (!currentModal) return;

            let item = {};

            switch (currentModal) {
                case 'character':
                    const name = document.getElementById('charName').value.trim();
                    if (!name) { alert('请输入角色名称'); return; }
                    item = {
                        name,
                        role: document.getElementById('charRole').value,
                        appearance: document.getElementById('charAppearance').value,
                        faction: document.getElementById('charFaction').value,
                        desc: document.getElementById('charDesc').value,
                        tags: document.getElementById('charTags').value.split(',').map(t => t.trim()).filter(t => t)
                    };
                    data.characters.push(item);
                    break;

                case 'world':
                    const wName = document.getElementById('worldName').value.trim();
                    if (!wName) { alert('请输入元素名称'); return; }
                    item = {
                        name: wName,
                        type: document.getElementById('worldType').value,
                        location: document.getElementById('worldLocation').value,
                        desc: document.getElementById('worldDesc').value
                    };
                    data.worldElements.push(item);
                    break;

                case 'timeline':
                    const tlDate = document.getElementById('tlDate').value.trim();
                    const tlTitle = document.getElementById('tlTitle').value.trim();
                    if (!tlDate || !tlTitle) { alert('请填写时间和标题'); return; }
                    item = {
                        date: tlDate,
                        title: tlTitle,
                        desc: document.getElementById('tlDesc').value
                    };
                    data.timeline.push(item);
                    break;

                case 'plot':
                    const pTitle = document.getElementById('plotTitle').value.trim();
                    if (!pTitle) { alert('请输入标题'); return; }
                    item = {
                        title: pTitle,
                        arc: document.getElementById('plotArc').value,
                        characters: document.getElementById('plotChars').value.split(',').map(c => c.trim()).filter(c => c),
                        desc: document.getElementById('plotDesc').value
                    };
                    data.plot.push(item);
                    break;
            }

            saveData();
            renderAll();
            closeModal();
        }

        function deleteItem(type, index) {
            if (confirm('确定要删除吗？')) {
                const typeMap = {
                    characters: 'characters',
                    worldElements: 'world',
                    timeline: 'timeline',
                    plot: 'plot'
                };
                data[type].splice(index, 1);
                saveData();
                renderAll();
            }
        }

        // 标签页切换
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        // 点击遮罩关闭
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        });

        // ESC 关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 初始化
        loadData();
    </script>
</body>
</html>
