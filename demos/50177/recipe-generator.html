<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃啥 - 随机菜谱生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1410;--card:#2a2018;--accent:#e8913a;--green:#6abf69;--text:#f0e6d8;--muted:#9a8a78;--radius:14px;--shadow:0 4px 24px rgba(0,0,0,.3)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:20px 16px 60px}
h1{text-align:center;font-size:1.5rem;margin:16px 0 4px}
h1 span{color:var(--accent)}
.subtitle{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:24px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid rgba(232,145,58,.12)}
.card-title{font-size:.95rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tag-wrap{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 14px;border-radius:20px;border:1.5px solid rgba(232,145,58,.25);background:rgba(232,145,58,.06);cursor:pointer;font-size:.82rem;transition:all .2s;user-select:none}
.tag:hover{background:rgba(232,145,58,.12)}
.tag.active{border-color:var(--accent);background:rgba(232,145,58,.2);color:var(--accent);font-weight:600}
.custom-row{display:flex;gap:8px;margin-top:14px}
.custom-row input{flex:1;padding:10px 14px;border-radius:10px;border:1.5px solid rgba(232,145,58,.2);background:rgba(255,255,255,.04);color:var(--text);font-size:.85rem;outline:none}
.custom-row input::placeholder{color:var(--muted)}
.custom-row input:focus{border-color:var(--accent)}
.custom-row button{padding:10px 16px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:.85rem;cursor:pointer;font-weight:600;white-space:nowrap}
.custom-row button:hover{opacity:.85}
.selected-area{margin-top:14px;display:none}
.selected-area.show{display:block}
.selected-label{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.selected-tags{display:flex;flex-wrap:wrap;gap:6px}
.selected-tag{padding:5px 10px;border-radius:14px;background:rgba(106,191,105,.15);color:var(--green);font-size:.78rem;display:flex;align-items:center;gap:4px}
.selected-tag .x{cursor:pointer;opacity:.6;font-size:.9rem}
.selected-tag .x:hover{opacity:1}
.action-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s;margin-top:16px;background:linear-gradient(135deg,var(--accent),#d47a28);color:#fff}
.action-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(232,145,58,.35)}
.action-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.result-area{display:none}
.result-area.show{display:block;animation:fadeUp .5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.dish-name{font-size:1.3rem;font-weight:700;text-align:center;color:var(--accent);margin-bottom:4px}
.dish-desc{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:16px}
.meta-row{display:flex;justify-content:center;gap:20px;margin-bottom:18px;font-size:.82rem}
.meta-item{display:flex;align-items:center;gap:4px;color:var(--muted)}
.meta-item strong{color:var(--text)}
.ingredient-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.ingredient-chip{padding:5px 10px;border-radius:10px;background:rgba(232,145,58,.1);font-size:.78rem;color:var(--accent)}
.ingredient-chip.missing{background:rgba(231,76,60,.1);color:#e74c3c;text-decoration:line-through;opacity:.6}
.step-list{counter-reset:step;list-style:none}
.step-list li{counter-increment:step;padding:10px 12px 10px 44px;position:relative;margin-bottom:6px;background:rgba(255,255,255,.03);border-radius:10px;font-size:.85rem;line-height:1.7}
.step-list li::before{content:counter(step);position:absolute;left:10px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.tip-box{margin-top:14px;padding:12px 14px;background:rgba(106,191,105,.08);border-radius:10px;border-left:3px solid var(--green);font-size:.82rem;line-height:1.6;color:var(--green)}
.shuffle-btn{background:transparent;border:1.5px solid var(--accent);color:var(--accent);padding:12px;border-radius:12px;cursor:pointer;font-size:.9rem;font-weight:600;width:100%;transition:all .25s;margin-top:8px}
.shuffle-btn:hover{background:rgba(232,145,58,.1)}
.history-card{margin-top:16px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(232,145,58,.08);font-size:.82rem}
.history-item:last-child{border-bottom:none}
.history-dish{color:var(--accent);font-weight:600;cursor:pointer}
.history-dish:hover{text-decoration:underline}
.history-time{color:var(--muted);font-size:.75rem}
.empty-hint{text-align:center;color:var(--muted);font-size:.82rem;padding:16px}
</style>
</head>
<body>
<div class="container">
<h1>🍳 今天吃<span>啥</span></h1>
<p class="subtitle">告诉我你冰箱里有什么，我来告诉你做什么菜</p>

<div class="card">
  <div class="card-title">🥬 选择你有的食材</div>
  <div class="tag-wrap" id="tagWrap"></div>
  <div class="custom-row">
    <input type="text" id="customInput" placeholder="输入其他食材，如：豆腐" maxlength="10">
    <button id="addBtn">添加</button>
  </div>
  <div class="selected-area" id="selectedArea">
    <div class="selected-label">已选食材：</div>
    <div class="selected-tags" id="selectedTags"></div>
  </div>
  <button class="action-btn" id="cookBtn" disabled>🔥 生成菜谱</button>
</div>

<div class="result-area" id="resultArea">
  <div class="card">
    <div class="dish-name" id="dishName"></div>
    <div class="dish-desc" id="dishDesc"></div>
    <div class="meta-row" id="metaRow"></div>
    <div class="card-title" style="font-size:.85rem">📦 所需食材</div>
    <div class="ingredient-list" id="ingredientList"></div>
    <div class="card-title" style="font-size:.85rem">👨‍🍳 做法步骤</div>
    <ol class="step-list" id="stepList"></ol>
    <div class="tip-box" id="tipBox"></div>
  </div>
  <button class="shuffle-btn" id="shuffleBtn">🎲 换一个菜谱</button>
</div>

<div class="card history-card" id="historyCard" style="display:none">
  <div class="card-title">📜 历史记录</div>
  <div id="historyList"></div>
</div>
</div>

<script>
(function(){
var INGREDIENTS=['鸡蛋','番茄','土豆','青椒','猪肉','鸡胸肉','牛肉','虾','豆腐','白菜','胡萝卜','洋葱','蒜','姜','葱','酱油','醋','盐','糖','料酒','米饭','面条','面粉','黄瓜','香菇','木耳','豆芽','生菜','西兰花','排骨'];
var selectedSet=new Set();
var currentRecipes=[];
var currentIdx=0;

var RECIPES=[
{name:'番茄炒蛋',desc:'国民家常菜，酸甜下饭',time:'10分钟',diff:'简单',need:['番茄','鸡蛋','葱','盐','糖'],steps:['番茄切块，鸡蛋打散加少许盐搅匀','锅中热油，倒入蛋液炒至凝固盛出','锅中再加少许油，爆香葱花，下番茄翻炒出汁','加少许糖提鲜，倒回鸡蛋翻炒均匀，加盐调味出锅'],tip:'番茄提前用开水烫一下更容易去皮，口感更好'},
{name:'土豆丝',desc:'清脆爽口，百吃不厌',time:'15分钟',diff:'简单',need:['土豆','青椒','蒜','醋','盐'],steps:['土豆去皮切细丝，泡水去淀粉，沥干','青椒切丝，蒜切末','锅中热油，爆香蒜末，下土豆丝大火翻炒','沿锅边淋入醋，加青椒丝翻炒，加盐调味出锅'],tip:'土豆丝一定要泡水去淀粉，炒出来才脆爽'},
{name:'青椒肉丝',desc:'经典下饭菜，肉嫩椒脆',time:'15分钟',diff:'简单',need:['青椒','猪肉','姜','酱油','料酒','盐'],steps:['猪肉切丝，加酱油、料酒腌制10分钟','青椒去籽切丝，姜切丝','锅中热油，下肉丝滑散变色盛出','锅中留油，爆香姜丝，下青椒丝翻炒，倒回肉丝炒匀，加盐调味'],tip:'肉丝提前腌制更嫩，炒的时候大火快炒'},
{name:'蛋炒饭',desc:'剩米饭的最佳归宿',time:'8分钟',diff:'简单',need:['米饭','鸡蛋','葱','盐','酱油'],steps:['鸡蛋打散，葱切葱花','锅中热油，倒入蛋液快速翻炒至半凝固','倒入米饭，用锅铲压散，大火翻炒','加少许酱油上色，撒葱花，加盐调味翻炒均匀'],tip:'用隔夜冷饭炒出来粒粒分明，热饭容易粘团'},
{name:'葱爆牛肉',desc:'葱香浓郁，牛肉滑嫩',time:'20分钟',diff:'中等',need:['牛肉','葱','姜','酱油','料酒','糖'],steps:['牛肉逆纹切薄片，加酱油、料酒、少许糖腌制15分钟','大葱切斜段，姜切片','锅中大火热油，下牛肉快速滑散变色盛出','锅中留油，爆香姜片和葱段，倒回牛肉大火翻炒，调味出锅'],tip:'牛肉逆纹切更嫩，大火快炒保持滑嫩口感'},
{name:'麻婆豆腐',desc:'麻辣鲜香，超级下饭',time:'15分钟',diff:'中等',need:['豆腐','猪肉','葱','姜','蒜','酱油','盐','糖'],steps:['豆腐切小块，入开水焯2分钟沥干','猪肉剁碎，葱姜蒜切末','锅中热油，下肉末炒散变色，加姜蒜末爆香','加酱油、少许糖，倒入豆腐轻轻推匀，小火煮3分钟，撒葱花出锅'],tip:'豆腐先焯水去豆腥味，翻炒时用推不用铲，避免碎裂'},
{name:'白灼虾',desc:'原汁原味，鲜甜弹牙',time:'10分钟',diff:'简单',need:['虾','姜','葱','酱油','醋'],steps:['虾剪去虾须虾脚，挑去虾线','锅中加水，放入姜片葱段烧开','放入虾煮至变红弯曲，约2分钟捞出','用酱油和醋调蘸料即可'],tip:'水一定要烧开再放虾，煮的时间不要太长，否则肉质变老'},
{name:'醋溜白菜',desc:'酸爽开胃，冬天必备',time:'10分钟',diff:'简单',need:['白菜','醋','蒜','盐','糖'],steps:['白菜洗净手撕成块，蒜切末','锅中热油，爆香蒜末','下白菜大火翻炒至变软','沿锅边淋入醋，加少许糖和盐调味，翻炒均匀出锅'],tip:'白菜手撕比刀切更容易入味，醋要沿锅边淋入更香'},
{name:'蒜蓉西兰花',desc:'清淡健康，颜值在线',time:'10分钟',diff:'简单',need:['西兰花','蒜','盐'],steps:['西兰花掰小朵，入开水焯1分钟捞出沥干','蒜切末','锅中热油，爆香蒜末','下西兰花翻炒，加盐调味出锅'],tip:'焯水时加少许盐和油，西兰花颜色更翠绿'},
{name:'红烧排骨',desc:'浓油赤酱，肉烂骨酥',time:'45分钟',diff:'中等',need:['排骨','姜','葱','酱油','糖','料酒'],steps:['排骨冷水下锅焯水去血沫，捞出洗净','锅中少许油，下排骨煎至表面微黄','加姜片、葱段、料酒、酱油翻炒上色','加水没过排骨，大火烧开转小火炖30分钟，大火收汁即可'],tip:'焯水冷水下锅能更好去血沫，收汁时注意翻动防糊底'},
{name:'黄瓜炒鸡蛋',desc:'清爽简单，5分钟搞定',time:'5分钟',diff:'简单',need:['黄瓜','鸡蛋','蒜','盐'],steps:['黄瓜切片，鸡蛋打散，蒜切末','锅中热油，倒入蛋液炒至凝固盛出','锅中加少许油，爆香蒜末，下黄瓜片翻炒','倒回鸡蛋，加盐调味炒匀出锅'],tip:'黄瓜不要炒太久，保持脆嫩口感'},
{name:'香菇滑鸡',desc:'鲜嫩多汁，营养丰富',time:'25分钟',diff:'中等',need:['鸡胸肉','香菇','姜','酱油','料酒','盐'],steps:['鸡胸肉切片，加酱油、料酒腌制10分钟','香菇切片，姜切片','锅中热油，下鸡肉滑散变色盛出','锅中留油，爆香姜片，下香菇炒软，倒回鸡肉翻炒，加盐调味'],tip:'香菇提前泡发更香，鸡肉腌制时加少许淀粉更滑嫩'},
{name:'酸辣土豆片',desc:'酸辣开胃，比土豆丝更过瘾',time:'10分钟',diff:'简单',need:['土豆','醋','蒜','辣椒','盐'],steps:['土豆切薄片，泡水去淀粉沥干','蒜切末，辣椒切段','锅中热油，爆香蒜末和辣椒','下土豆片大火翻炒，淋醋，加盐调味出锅'],tip:'土豆片切薄一点更容易入味，泡水后炒出来更清爽'},
{name:'豆芽炒肉',desc:'脆嫩爽口，便宜又好吃',time:'10分钟',diff:'简单',need:['豆芽','猪肉','蒜','酱油','盐'],steps:['猪肉切丝，蒜切末','锅中热油，下肉丝炒散变色','加蒜末爆香，下豆芽大火翻炒','加酱油和盐调味，快速翻炒出锅'],tip:'豆芽要大火快炒，炒久了会出水变软'},
{name:'洋葱炒蛋',desc:'甜香软嫩，零失败',time:'8分钟',diff:'简单',need:['洋葱','鸡蛋','盐'],steps:['洋葱切丝，鸡蛋打散','锅中热油，倒入蛋液炒至凝固盛出','锅中加少许油，下洋葱丝炒至变软透明','倒回鸡蛋，加盐调味翻炒均匀'],tip:'洋葱炒到透明变软甜味才出来，不要炒太短'},
{name:'番茄鸡蛋面',desc:'一碗暖到心里的汤面',time:'15分钟',diff:'简单',need:['面条','番茄','鸡蛋','葱','盐'],steps:['番茄切块，鸡蛋打散，葱切葱花','锅中热油，倒入蛋液炒散盛出','锅中加少许油，下番茄炒出汁，加水烧开','下面条煮熟，倒回鸡蛋，加盐调味，撒葱花'],tip:'番茄多炒一会儿出汁更多，汤底更浓郁'},
{name:'木耳炒山药',desc:'黑白搭配，清脆养生',time:'10分钟',diff:'简单',need:['木耳','山药','蒜','盐'],steps:['木耳泡发撕小朵，山药去皮切片泡水','蒜切末','锅中热油，爆香蒜末','下山药和木耳翻炒，加盐调味出锅'],tip:'山药切片后泡醋水防氧化变黑，炒的时间不要太长'},
{name:'糖醋排骨',desc:'酸甜可口，老少皆宜',time:'40分钟',diff:'中等',need:['排骨','醋','糖','酱油','姜','料酒'],steps:['排骨冷水焯水捞出洗净','锅中少许油，下排骨煎至微黄，加姜片、料酒','加酱油、醋、糖（醋:糖=1:1），加水没过排骨','大火烧开转小火炖30分钟，大火收汁至浓稠'],tip:'糖醋比例1:1是经典配比，收汁时要不停翻动防糊'}
];

var tagWrap=document.getElementById('tagWrap');
var customInput=document.getElementById('customInput');
var addBtn=document.getElementById('addBtn');
var selectedArea=document.getElementById('selectedArea');
var selectedTags=document.getElementById('selectedTags');
var cookBtn=document.getElementById('cookBtn');
var resultArea=document.getElementById('resultArea');
var dishName=document.getElementById('dishName');
var dishDesc=document.getElementById('dishDesc');
var metaRow=document.getElementById('metaRow');
var ingredientList=document.getElementById('ingredientList');
var stepList=document.getElementById('stepList');
var tipBox=document.getElementById('tipBox');
var shuffleBtn=document.getElementById('shuffleBtn');
var historyCard=document.getElementById('historyCard');
var historyList=document.getElementById('historyList');

function initTags(){
tagWrap.innerHTML=INGREDIENTS.map(function(t){
return '<span class="tag" data-name="'+t+'">'+t+'</span>';
}).join('');
}

tagWrap.addEventListener('click',function(e){
var tag=e.target.closest('.tag');
if(!tag)return;
var name=tag.dataset.name;
if(selectedSet.has(name)){selectedSet.delete(name);tag.classList.remove('active')}
else{selectedSet.add(name);tag.classList.add('active')}
renderSelected();
});

addBtn.addEventListener('click',addCustom);
customInput.addEventListener('keydown',function(e){if(e.key==='Enter')addCustom()});

function addCustom(){
var v=customInput.value.trim();
if(!v||selectedSet.has(v))return;
selectedSet.add(v);
customInput.value='';
renderSelected();
}

function renderSelected(){
if(selectedSet.size===0){selectedArea.classList.remove('show');cookBtn.disabled=true;return}
selectedArea.classList.add('show');
cookBtn.disabled=false;
selectedTags.innerHTML=Array.from(selectedSet).map(function(t){
return '<span class="selected-tag">'+t+'<span class="x" data-name="'+t+'">×</span></span>';
}).join('');
}

selectedTags.addEventListener('click',function(e){
var x=e.target.closest('.x');
if(!x)return;
var name=x.dataset.name;
selectedSet.delete(name);
var preset=tagWrap.querySelector('[data-name="'+name+'"]');
if(preset)preset.classList.remove('active');
renderSelected();
});

cookBtn.addEventListener('click',generate);
shuffleBtn.addEventListener('click',function(){currentIdx++;showRecipe()});

function generate(){
var matched=RECIPES.filter(function(r){
var haveCount=0;
for(var i=0;i<r.need.length;i++){if(selectedSet.has(r.need[i]))haveCount++}
return haveCount>=2;
});
if(!matched.length){
matched=RECIPES.filter(function(r){
var haveCount=0;
for(var i=0;i<r.need.length;i++){if(selectedSet.has(r.need[i]))haveCount++}
return haveCount>=1;
});
}
if(!matched.length)matched=RECIPES.slice();
matched.sort(function(a,b){
var sa=0,sb=0;
for(var i=0;i<a.need.length;i++){if(selectedSet.has(a.need[i]))sa++}
for(var i=0;i<b.need.length;i++){if(selectedSet.has(b.need[i]))sb++}
return sb-b.sa;
});
currentRecipes=shuffle(matched);
currentIdx=0;
showRecipe();
}

function showRecipe(){
var r=currentRecipes[currentIdx%currentRecipes.length];
dishName.textContent=r.name;
dishDesc.textContent=r.desc;
metaRow.innerHTML='<div class="meta-item">⏱ <strong>'+r.time+'</strong></div><div class="meta-item">📊 <strong>'+r.diff+'</strong></div>';
ingredientList.innerHTML=r.need.map(function(ing){
var cls=selectedSet.has(ing)?'ingredient-chip':'ingredient-chip missing';
return '<span class="'+cls+'">'+ing+(selectedSet.has(ing)?' ✓':' 需购买')+'</span>';
}).join('');
stepList.innerHTML=r.steps.map(function(s){return '<li>'+s+'</li>'}).join('');
tipBox.textContent='💡 '+r.tip;
resultArea.classList.add('show');
saveHistory(r.name);
renderHistory();
}

function shuffle(arr){
var a=arr.slice();
for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}
return a;
}

var HIST_KEY='recipe_history';
function saveHistory(name){
var h=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');
h.unshift({name:name,time:Date.now()});
if(h.length>10)h.length=10;
localStorage.setItem(HIST_KEY,JSON.stringify(h));
}

function renderHistory(){
var h=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');
if(!h.length){historyCard.style.display='none';return}
historyCard.style.display='';
historyList.innerHTML=h.map(function(r){
var d=new Date(r.time);
var ts=(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
return '<div class="history-item"><span class="history-dish">'+r.name+'</span><span class="history-time">'+ts+'</span></div>';
}).join('');
}

initTags();
renderHistory();
})();
</script>
