<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>耄耋大冒险 - Milk Cat Adventure</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #f5f5f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-x: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  h1 {
    margin: 10px 0 4px;
    font-size: 24px;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 215, 180, 0.6);
  }
  .info {
    font-size: 13px;
    margin-bottom: 6px;
    opacity: 0.85;
    text-align: center;
    padding: 0 8px;
    line-height: 1.6;
  }
  .hud {
    display: flex;
    gap: 16px;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .avatar {
    margin-top: 8px;
    margin-bottom: 4px;
    display: flex;
    justify-content: center;
  }
  .avatar canvas {
    background: #1c2434;
    border: 2px solid #ffd27a;
    border-radius: 10px;
    width: 64px;
    height: 64px;
    box-shadow: 0 0 12px rgba(255, 210, 122, 0.35);
  }
  .hud span b {
    color: #ffd27a;
  }
  canvas {
    background: #0c1424;
    border: 4px solid #ffd27a;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(255, 210, 122, 0.35);
    image-rendering: pixelated;
    max-width: 100%;
    touch-action: none;
  }
  .tip {
    font-size: 13px;
    margin-top: 6px;
    opacity: 0.7;
  }
  /* 手机端按键 */
  .controls {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .ctrl-btn {
    width: 64px;
    height: 64px;
    border: 2px solid #ffd27a;
    background: linear-gradient(135deg, #2a3552, #1c2842);
    color: #ffd27a;
    font-size: 28px;
    font-weight: bold;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.1);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 0.05s, background 0.1s;
  }
  .ctrl-btn:active {
    transform: translateY(2px);
    background: linear-gradient(135deg, #ffd27a, #e8a03e);
    color: #1c2842;
    box-shadow: 0 2px 6px rgba(255, 210, 122, 0.4);
  }
  .ctrl-btn.up { grid-column: 2; grid-row: 1; }
  .ctrl-btn.left { grid-column: 1; grid-row: 2; }
  .ctrl-btn.right { grid-column: 3; grid-row: 2; }
  .ctrl-btn.down { grid-column: 2; grid-row: 3; }
  .ctrl-btn.start {
    grid-column: 2;
    grid-row: 2;
    font-size: 16px;
    background: linear-gradient(135deg, #ffd27a, #e8923e);
    color: #1c2842;
  }
  .ctrl-btn.start:active {
    transform: translateY(2px);
    background: linear-gradient(135deg, #fff, #ffd27a);
  }
  /* 桌面端隐藏按键 */
  @media (hover: hover) and (pointer: fine) {
    .controls { display: none; }
    .tip { display: none; }
  }
  @media (max-width: 680px) {
    h1 { font-size: 20px; }
    .info { font-size: 12px; }
    .hud { font-size: 13px; gap: 12px; }
  }
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 14, 30, 0.78);
    backdrop-filter: blur(4px);
    z-index: 100;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #1c2842;
    border: 3px solid #ffd27a;
    padding: 24px 32px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    min-width: 260px;
    max-width: 90%;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 26px;
    color: #ffd27a;
  }
  .panel p { margin: 8px 0; font-size: 15px; }
  .btn {
    margin-top: 14px;
    padding: 12px 32px;
    background: linear-gradient(135deg, #ffd27a, #e8923e);
    color: #1c2842;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 210, 122, 0.35);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(1px); }
</style>
</head>
<body>
  <h1>🐱 耄耋大冒险 🐸</h1>
  <div class="info">控制圆头耄耋，逃到金色出口！收集路上的豆子加分～ 后面有彩蛋哦！</div>
  <div class="avatar">
    <canvas id="iconCat" width="64" height="64" title="圆头耄耋"></canvas>
  </div>
  <div class="hud">
    <span>关卡 <b id="level">1</b></span>
    <span>豆子 <b id="beans">0</b></span>
    <span>得分 <b id="score">0</b></span>
  </div>
  <canvas id="game" width="624" height="528"></canvas>
  <div class="tip">手机用户请使用下方按键操作</div>

  <!-- 手机虚拟按键 -->
  <div class="controls">
    <button class="ctrl-btn up" id="btnUp">▲</button>
    <button class="ctrl-btn left" id="btnLeft">◀</button>
    <button class="ctrl-btn start" id="btnStart">开始</button>
    <button class="ctrl-btn right" id="btnRight">▶</button>
    <button class="ctrl-btn down" id="btnDown">▼</button>
  </div>

  <div id="overlay" class="overlay">
    <div class="panel">
      <h2 id="panelTitle">准备好了吗？</h2>
      <p id="panelMsg">控制圆头耄耋，逃到金色出口！<br>记得收集路上的豆子～</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>

<script>
/* ============================================================
   奶蛙大冒险 —— 玩家操控圆头耄耋，躲避奶蛙追捕逃到出口
   ============================================================ */

const TILE = 24;
const COLS = 26;
const ROWS = 22;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const FROG_IMG = 'cailiao/奶蛙.jpg';
const CAT_IMG = 'cailiao/圆头耄耋 (1).jpg';
const CAPTURE_SOUND = 'cailiao/奶蛙.mp3';
const BGM_SOUND = 'cailiao/背景音乐.mp3';
const TAFEI_IMG = 'cailiao/永雏塔菲.jpg';
const TAFEI_SOUND = 'cailiao/永雏塔菲.mp3';

// 全局引用：图片加载后，Game 对象会重绘图标
let gameRef = null;

const frogImg = new Image();
const catImg = new Image();
const tafeiImg = new Image();
frogImg.onload = function() { if (gameRef) gameRef.drawUIIcons(); };
catImg.onload = function() { if (gameRef) gameRef.drawUIIcons(); };
tafeiImg.onload = function() { if (gameRef) gameRef.drawUIIcons(); };
frogImg.onerror = function() { if (gameRef) gameRef.drawUIIcons(); };
catImg.onerror = function() { if (gameRef) gameRef.drawUIIcons(); };
tafeiImg.onerror = function() { if (gameRef) gameRef.drawUIIcons(); };
frogImg.src = FROG_IMG;
catImg.src = CAT_IMG;
tafeiImg.src = TAFEI_IMG;

// 奶蛙音效
let captureAudio = null;
function getCaptureAudio() {
  if (!captureAudio) {
    captureAudio = new Audio(CAPTURE_SOUND);
    captureAudio.preload = 'auto';
  }
  return captureAudio;
}
function playCaptureSound() {
  try {
    const a = getCaptureAudio();
    a.currentTime = 0;
    a.volume = 1.0;
    a.play().catch(() => {});
  } catch(e) {}
}
function stopCaptureSound() {
  try { if (captureAudio) { captureAudio.pause(); captureAudio.currentTime = 0; } } catch(e) {}
}

// 永雏塔菲音效
let tafeiAudio = null;
function getTafeiAudio() {
  if (!tafeiAudio) {
    tafeiAudio = new Audio(TAFEI_SOUND);
    tafeiAudio.preload = 'auto';
  }
  return tafeiAudio;
}
function playTafeiSound() {
  try {
    const a = getTafeiAudio();
    a.currentTime = 0;
    a.volume = 1.0;
    a.play().catch(() => {});
  } catch(e) {}
}
function stopTafeiSound() {
  try { if (tafeiAudio) { tafeiAudio.pause(); tafeiAudio.currentTime = 0; } } catch(e) {}
}

// 背景音乐
let bgmAudio = null;
function getBgmAudio() {
  if (!bgmAudio) {
    bgmAudio = new Audio(BGM_SOUND);
    bgmAudio.loop = true;
    bgmAudio.preload = 'auto';
    bgmAudio.volume = 0.35;
  }
  return bgmAudio;
}
function playBgm() {
  try {
    const a = getBgmAudio();
    a.volume = 0.35;
    a.loop = true;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  } catch(e) {}
}
function stopBgm() {
  try { if (bgmAudio) { bgmAudio.pause(); bgmAudio.currentTime = 0; } } catch(e) {}
}
function fadeBgmDown() {
  try {
    if (bgmAudio && !bgmAudio.paused) {
      bgmAudio.volume = 0.1;
    }
  } catch(e) {}
}
function stopAllAudio() {
  stopCaptureSound();
  stopTafeiSound();
  stopBgm();
}

/* ---------- 迷宫（带出口和豆子）---------- */
class Maze {
  constructor() {
    this.grid = [];
    this.exit = { cx: COLS - 2, cy: ROWS - 2 }; // 出口位置：右下角
    this.beanCount = 0;
    this.generate();
  }
  generate() {
    this.grid = Array.from({ length: ROWS }, () => Array(COLS).fill(1));
    const stack = [[1, 1]];
    this.grid[1][1] = 0;
    const dirs = [[0,-2],[2,0],[0,2],[-2,0]];
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const shuffled = dirs.slice().sort(() => Math.random() - 0.5);
      let carved = false;
      for (const [dx, dy] of shuffled) {
        const nx = x + dx, ny = y + dy;
        if (nx > 0 && nx < COLS - 1 && ny > 0 && ny < ROWS - 1 && this.grid[ny][nx] === 1) {
          this.grid[y + dy/2][x + dx/2] = 0;
          this.grid[ny][nx] = 0;
          stack.push([nx, ny]);
          carved = true;
          break;
        }
      }
      if (!carved) stack.pop();
    }
    // 随机打通一些墙，增加通路
    const extras = Math.floor(ROWS * COLS * 0.08);
    for (let i = 0; i < extras; i++) {
      const x = 2 + Math.floor(Math.random() * (COLS - 4));
      const y = 2 + Math.floor(Math.random() * (ROWS - 4));
      if (this.grid[y][x] === 1) {
        const openUD = this.grid[y-1] && this.grid[y+1] && this.grid[y-1][x] === 0 && this.grid[y+1][x] === 0;
        const openLR = this.grid[y][x-1] === 0 && this.grid[y][x+1] === 0;
        if (openUD || openLR) this.grid[y][x] = 0;
      }
    }
    // 确保出口位置是通路
    this.grid[this.exit.cy][this.exit.cx] = 0;
    // 确保出口附近也是通路
    if (this.grid[this.exit.cy - 1] && this.grid[this.exit.cy - 1][this.exit.cx] === 1) {
      this.grid[this.exit.cy - 1][this.exit.cx] = 0;
    }
    if (this.grid[this.exit.cy][this.exit.cx - 1] === 1) {
      this.grid[this.exit.cy][this.exit.cx - 1] = 0;
    }
    // 在通路上放豆子
    this.beanCount = 0;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (this.grid[y][x] === 0) {
          const nearPlayer = (Math.abs(x - 1) + Math.abs(y - 1)) <= 1;
          const nearExit = (Math.abs(x - this.exit.cx) + Math.abs(y - this.exit.cy)) <= 1;
          const nearChaser = (Math.abs(x - Math.floor(COLS/2)) + Math.abs(y - Math.floor(ROWS/2))) <= 2;
          if (!nearPlayer && !nearExit && !nearChaser) {
            // 每隔一个格子放一个豆子
            if ((x + y) % 2 === 0) {
              this.grid[y][x] = 2; // 小豆子
              this.beanCount++;
            }
          }
        }
      }
    }
  }
  isWall(cx, cy) {
    if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS) return true;
    return this.grid[cy] && this.grid[cy][cx] === 1;
  }
  eatBean(cx, cy) {
    if (this.grid[cy] && this.grid[cy][cx] === 2) {
      this.grid[cy][cx] = 0;
      this.beanCount--;
      return 10; // 每个豆子 10 分
    }
    return 0;
  }
  draw() {
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const px = x * TILE, py = y * TILE;
        if (this.grid[y] && this.grid[y][x] === 1) {
          const g = ctx.createLinearGradient(px, py, px + TILE, py + TILE);
          g.addColorStop(0, '#3a4a7a');
          g.addColorStop(1, '#1d2654');
          ctx.fillStyle = g;
          ctx.fillRect(px, py, TILE, TILE);
          ctx.strokeStyle = 'rgba(255,210,122,0.18)';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
        } else {
          ctx.fillStyle = '#0f1830';
          ctx.fillRect(px, py, TILE, TILE);
          // 绘制豆子
          if (this.grid[y] && this.grid[y][x] === 2) {
            const cx = px + TILE / 2;
            const cy = py + TILE / 2;
            const t = Date.now() * 0.004;
            const scale = 0.8 + 0.2 * Math.sin(t + x + y);
            // 豆子颜色
            ctx.fillStyle = '#ffdd88';
            ctx.beginPath();
            ctx.arc(cx, cy, 3 * scale, 0, Math.PI * 2);
            ctx.fill();
            // 高光
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            ctx.beginPath();
            ctx.arc(cx - 1, cy - 1, 1 * scale, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
    // 绘制出口（闪烁金色效果）
    const ex = this.exit.cx * TILE;
    const ey = this.exit.cy * TILE;
    const t = Date.now() * 0.003;
    const pulse = 0.5 + 0.5 * Math.sin(t);
    const g = ctx.createRadialGradient(ex + TILE/2, ey + TILE/2, 2, ex + TILE/2, ey + TILE/2, TILE);
    g.addColorStop(0, `rgba(255, 215, 122, ${0.9})`);
    g.addColorStop(0.5, `rgba(255, 180, 80, ${0.6 + pulse * 0.3})`);
    g.addColorStop(1, `rgba(255, 100, 50, 0.1)`);
    ctx.fillStyle = g;
    ctx.fillRect(ex - TILE/2, ey - TILE/2, TILE * 2, TILE * 2);
    // 金色方块 + 出口符号
    ctx.fillStyle = '#ffd27a';
    ctx.fillRect(ex + 4, ey + 4, TILE - 8, TILE - 8);
    ctx.fillStyle = '#8a4a1a';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('出', ex + TILE/2, ey + TILE/2);
  }
}

/* ---------- 角色基类 ---------- */
class Actor {
  constructor(cx, cy) {
    this.cx = cx; this.cy = cy;
    this.px = cx * TILE + TILE / 2;
    this.py = cy * TILE + TILE / 2;
    this.dir = { x: 0, y: 0 };
    this.nextDir = { x: 0, y: 0 };
    this.speed = 2.4;
  }
  stepTowards(target) {
    if (!target) return false;
    const tx = target.cx * TILE + TILE / 2;
    const ty = target.cy * TILE + TILE / 2;
    const dx = tx - this.px;
    const dy = ty - this.py;
    const dist = Math.hypot(dx, dy);
    if (dist < this.speed) {
      this.px = tx; this.py = ty;
      this.cx = target.cx; this.cy = target.cy;
      return true;
    }
    this.px += (dx / dist) * this.speed;
    this.py += (dy / dist) * this.speed;
    return false;
  }
}

/* ---------- 玩家：圆头耄耋（逃跑者，操控角色）---------- */
class Player extends Actor {
  constructor() {
    super(1, 1); // 从左上角出生
    this.speed = 2.6;
  }
  update(maze) {
    const atCenter = (Math.abs(this.px - (this.cx * TILE + TILE / 2)) < 1 &&
                      Math.abs(this.py - (this.cy * TILE + TILE / 2)) < 1);
    if (atCenter) {
      this.px = this.cx * TILE + TILE / 2;
      this.py = this.cy * TILE + TILE / 2;
      if (this.nextDir.x !== 0 || this.nextDir.y !== 0) {
        if (!maze.isWall(this.cx + this.nextDir.x, this.cy + this.nextDir.y)) {
          this.dir = { ...this.nextDir };
        }
      }
      if (maze.isWall(this.cx + this.dir.x, this.cy + this.dir.y)) {
        this.dir = { x: 0, y: 0 };
      }
    }
    if (this.dir.x !== 0 || this.dir.y !== 0) {
      const target = { cx: this.cx + this.dir.x, cy: this.cy + this.dir.y };
      if (!maze.isWall(target.cx, target.cy)) {
        this.stepTowards(target);
      }
    }
  }
  queueDir(dx, dy) { this.nextDir = { x: dx, y: dy }; }
  draw() {
    const x = this.px, y = this.py, r = TILE * 0.45;
    if (catImg.complete && catImg.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(catImg, x - r, y - r, r * 2, r * 2);
      ctx.restore();
    } else {
      // 备用绘制：橘色圆头耄耋
      const headGrad = ctx.createRadialGradient(x - 3, y - 3, 2, x, y, r);
      headGrad.addColorStop(0, '#ffd29a');
      headGrad.addColorStop(1, '#e8923e');
      ctx.fillStyle = headGrad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8a4a1a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // 耳朵
      ctx.fillStyle = '#e08a3c';
      for (const sx of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + sx * r * 0.6, y - r * 0.7);
        ctx.lineTo(x + sx * r * 1.05, y - r * 0.15);
        ctx.lineTo(x + sx * r * 0.35, y - r * 0.25);
        ctx.closePath();
        ctx.fill();
      }
      // 眼睛
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x - r * 0.32, y - r * 0.15, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.32, y - r * 0.15, r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e9030';
      ctx.beginPath(); ctx.arc(x - r * 0.32, y - r * 0.15, r * 0.13, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.32, y - r * 0.15, r * 0.13, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/* ---------- AI 敌人：奶蛙（视线追击 + 随机游走）---------- */
class Chaser extends Actor {
  constructor() {
    super(Math.floor(COLS / 2), Math.floor(ROWS / 2)); // 从迷宫中间出生
    this.speed = 2.0;
    this.type = 'frog';
    this.moveTimer = 0;
    this.moveInterval = 8 + Math.floor(Math.random() * 12);
    this.chasing = false;
  }
  // 检查是否能直线看到玩家（同行或同列，且中间没有墙）
  hasLineOfSight(maze, player) {
    const sx = this.cx, sy = this.cy;
    const tx = player.cx, ty = player.cy;
    if (sx === tx) {
      // 同一列，检查竖线
      const step = ty > sy ? 1 : -1;
      for (let y = sy + step; y !== ty; y += step) {
        if (maze.isWall(sx, y)) return false;
      }
      return true;
    }
    if (sy === ty) {
      // 同一行，检查横线
      const step = tx > sx ? 1 : -1;
      for (let x = sx + step; x !== tx; x += step) {
        if (maze.isWall(x, sy)) return false;
      }
      return true;
    }
    return false;
  }
  update(maze, player) {
    const atCenter = (Math.abs(this.px - (this.cx * TILE + TILE / 2)) < 1 &&
                      Math.abs(this.py - (this.cy * TILE + TILE / 2)) < 1);
    if (atCenter) {
      this.px = this.cx * TILE + TILE / 2;
      this.py = this.cy * TILE + TILE / 2;
      // 检查视线：如果能看到玩家，直直追过去
      const seePlayer = this.hasLineOfSight(maze, player);
      if (seePlayer) {
        this.chasing = true;
        // 朝玩家方向
        if (this.cx < player.cx && !maze.isWall(this.cx + 1, this.cy)) {
          this.dir = { x: 1, y: 0 };
        } else if (this.cx > player.cx && !maze.isWall(this.cx - 1, this.cy)) {
          this.dir = { x: -1, y: 0 };
        } else if (this.cy < player.cy && !maze.isWall(this.cx, this.cy + 1)) {
          this.dir = { x: 0, y: 1 };
        } else if (this.cy > player.cy && !maze.isWall(this.cx, this.cy - 1)) {
          this.dir = { x: 0, y: -1 };
        }
      } else {
        this.chasing = false;
        this.moveTimer++;
        // 随机换方向（无规律）
        if (this.moveTimer >= this.moveInterval) {
          const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
          const valid = dirs.filter(([dx, dy]) => !maze.isWall(this.cx + dx, this.cy + dy));
          if (valid.length > 0) {
            const pick = valid[Math.floor(Math.random() * valid.length)];
            this.dir = { x: pick[0], y: pick[1] };
          }
          this.moveTimer = 0;
          this.moveInterval = 6 + Math.floor(Math.random() * 18);
        }
      }
    }
    if (this.dir.x !== 0 || this.dir.y !== 0) {
      const target = { cx: this.cx + this.dir.x, cy: this.cy + this.dir.y };
      if (maze.isWall(target.cx, target.cy)) {
        // 撞到墙了，丢失目标
        this.dir = { x: 0, y: 0 };
        this.chasing = false;
      } else {
        this.stepTowards(target);
      }
    }
  }
  draw() {
    const x = this.px, y = this.py, r = TILE * 0.45;
    if (frogImg.complete && frogImg.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(frogImg, x - r, y - r, r * 2, r * 2);
      ctx.restore();
    } else {
      // 备用绘制：白色奶蛙
      const bodyGrad = ctx.createRadialGradient(x - 3, y - 3, 2, x, y, r);
      bodyGrad.addColorStop(0, '#ffffff');
      bodyGrad.addColorStop(1, '#ffe6b8');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c9a66a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 160, 180, 0.55)';
      ctx.beginPath(); ctx.arc(x - r * 0.55, y + r * 0.2, r * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.55, y + r * 0.2, r * 0.18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.35, y - r * 0.35, r * 0.32, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.35, y - r * 0.35, r * 0.14, 0, Math.PI * 2); ctx.fill();
    }
  }
}

/* ---------- AI 敌人：永雏塔菲（视线追击 + 随机游走，第3关起出现）---------- */
class Tafei extends Actor {
  constructor() {
    super(COLS - 2, 1); // 从右上角出生
    this.speed = 2.2;
    this.type = 'tafei';
    this.moveTimer = 0;
    this.moveInterval = 6 + Math.floor(Math.random() * 10);
    this.chasing = false;
  }
  // 检查是否能直线看到玩家
  hasLineOfSight(maze, player) {
    const sx = this.cx, sy = this.cy;
    const tx = player.cx, ty = player.cy;
    if (sx === tx) {
      const step = ty > sy ? 1 : -1;
      for (let y = sy + step; y !== ty; y += step) {
        if (maze.isWall(sx, y)) return false;
      }
      return true;
    }
    if (sy === ty) {
      const step = tx > sx ? 1 : -1;
      for (let x = sx + step; x !== tx; x += step) {
        if (maze.isWall(x, sy)) return false;
      }
      return true;
    }
    return false;
  }
  update(maze, player) {
    const atCenter = (Math.abs(this.px - (this.cx * TILE + TILE / 2)) < 1 &&
                      Math.abs(this.py - (this.cy * TILE + TILE / 2)) < 1);
    if (atCenter) {
      this.px = this.cx * TILE + TILE / 2;
      this.py = this.cy * TILE + TILE / 2;
      const seePlayer = this.hasLineOfSight(maze, player);
      if (seePlayer) {
        this.chasing = true;
        if (this.cx < player.cx && !maze.isWall(this.cx + 1, this.cy)) {
          this.dir = { x: 1, y: 0 };
        } else if (this.cx > player.cx && !maze.isWall(this.cx - 1, this.cy)) {
          this.dir = { x: -1, y: 0 };
        } else if (this.cy < player.cy && !maze.isWall(this.cx, this.cy + 1)) {
          this.dir = { x: 0, y: 1 };
        } else if (this.cy > player.cy && !maze.isWall(this.cx, this.cy - 1)) {
          this.dir = { x: 0, y: -1 };
        }
      } else {
        this.chasing = false;
        this.moveTimer++;
        if (this.moveTimer >= this.moveInterval) {
          const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
          const valid = dirs.filter(([dx, dy]) => !maze.isWall(this.cx + dx, this.cy + dy));
          if (valid.length > 0) {
            const pick = valid[Math.floor(Math.random() * valid.length)];
            this.dir = { x: pick[0], y: pick[1] };
          }
          this.moveTimer = 0;
          this.moveInterval = 5 + Math.floor(Math.random() * 16);
        }
      }
    }
    if (this.dir.x !== 0 || this.dir.y !== 0) {
      const target = { cx: this.cx + this.dir.x, cy: this.cy + this.dir.y };
      if (maze.isWall(target.cx, target.cy)) {
        this.dir = { x: 0, y: 0 };
        this.chasing = false;
      } else {
        this.stepTowards(target);
      }
    }
  }
  draw() {
    const x = this.px, y = this.py, r = TILE * 0.45;
    if (tafeiImg.complete && tafeiImg.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(tafeiImg, x - r, y - r, r * 2, r * 2);
      ctx.restore();
    } else {
      // 备用绘制：紫色风格的塔菲
      const grad = ctx.createRadialGradient(x - 3, y - 3, 2, x, y, r);
      grad.addColorStop(0, '#ffd7f0');
      grad.addColorStop(1, '#c070c0');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8a4a8a';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // 眼睛
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.15, r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.3, y - r*0.15, r*0.22, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff6090';
      ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.15, r*0.12, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.3, y - r*0.15, r*0.12, 0, Math.PI*2); ctx.fill();
      // 嘴巴
      ctx.strokeStyle = '#c04080';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(x, y + r*0.1, r*0.15, 0.1*Math.PI, 0.9*Math.PI);
      ctx.stroke();
    }
  }
}

/* ---------- 游戏主控 ---------- */
class Game {
  constructor() {
    gameRef = this;
    this.maze = new Maze();
    this.player = new Player();  // 圆头耄耋（玩家控制）
    this.chasers = [new Chaser()];  // 敌人列表（默认一个奶蛙）
    this.score = 0;
    this.level = 1;
    this.state = 'ready';
    this.totalBeans = this.maze.beanCount;
    this.lastCaughtBy = null;  // 记录最后被谁抓到

    window.addEventListener('keydown', (e) => this.onKey(e));
    document.getElementById('startBtn').addEventListener('click', () => this.start());

    // 手机按键
    const bindBtn = (id, dx, dy) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      const handle = (ev) => {
        ev.preventDefault();
        this.queueDir(dx, dy);
      };
      btn.addEventListener('touchstart', handle, { passive: false });
      btn.addEventListener('mousedown', handle);
    };
    bindBtn('btnUp', 0, -1);
    bindBtn('btnDown', 0, 1);
    bindBtn('btnLeft', -1, 0);
    bindBtn('btnRight', 1, 0);
    const startMobileBtn = document.getElementById('btnStart');
    if (startMobileBtn) {
      startMobileBtn.addEventListener('click', () => this.start());
      startMobileBtn.addEventListener('touchstart', (e) => { e.preventDefault(); this.start(); }, { passive: false });
    }

    this.drawUIIcons();
  }
  // 根据关卡设置敌人
  setupEnemies() {
    this.chasers = [new Chaser()];  // 前两关只有奶蛙
    if (this.level >= 3) {
      this.chasers.push(new Tafei());  // 第3关起出现彩蛋敌人
    }
  }
  drawUIIcons() {
    const canvas = document.getElementById('iconCat');
    if (!canvas) return;
    const c = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    c.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 2;
    // 背景光晕
    const glow = c.createRadialGradient(cx, cy, 2, cx, cy, r + 4);
    glow.addColorStop(0, 'rgba(255, 210, 122, 0.25)');
    glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    c.fillStyle = glow;
    c.beginPath();
    c.arc(cx, cy, r + 4, 0, Math.PI * 2);
    c.fill();
    // 优先使用图片
    if (catImg && catImg.complete && catImg.naturalWidth > 0) {
      c.save();
      c.beginPath();
      c.arc(cx, cy, r, 0, Math.PI * 2);
      c.closePath();
      c.clip();
      c.drawImage(catImg, cx - r, cy - r, r * 2, r * 2);
      c.restore();
      c.strokeStyle = '#ffd27a';
      c.lineWidth = 2;
      c.beginPath();
      c.arc(cx, cy, r, 0, Math.PI * 2);
      c.stroke();
      return;
    }
    // 备用 Canvas 绘制
    const bodyGrad = c.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, r);
    bodyGrad.addColorStop(0, '#ffd29a');
    bodyGrad.addColorStop(1, '#e8923e');
    c.fillStyle = bodyGrad;
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#ffd27a';
    c.lineWidth = 2;
    c.stroke();
    // 耳朵
    c.fillStyle = '#e08a3c';
    for (const sx of [-1, 1]) {
      c.beginPath();
      c.moveTo(cx + sx * r * 0.5, cy - r * 0.6);
      c.lineTo(cx + sx * r * 0.9, cy - r * 0.1);
      c.lineTo(cx + sx * r * 0.3, cy - r * 0.2);
      c.closePath();
      c.fill();
    }
    // 眼睛
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(cx - r*0.28, cy - r*0.12, r*0.22, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(cx + r*0.28, cy - r*0.12, r*0.22, 0, Math.PI*2); c.fill();
    c.fillStyle = '#1e9030';
    c.beginPath(); c.arc(cx - r*0.28, cy - r*0.12, r*0.12, 0, Math.PI*2); c.fill();
    c.beginPath(); c.arc(cx + r*0.28, cy - r*0.12, r*0.12, 0, Math.PI*2); c.fill();
  }
  refreshHUD() {
    document.getElementById('score').textContent = this.score;
    document.getElementById('level').textContent = this.level;
    document.getElementById('beans').textContent = this.maze.beanCount;
  }
  onKey(e) {
    const k = e.key.toLowerCase();
    if (k === 'arrowup' || k === 'w') { this.player.queueDir(0, -1); e.preventDefault(); }
    else if (k === 'arrowdown' || k === 's') { this.player.queueDir(0, 1); e.preventDefault(); }
    else if (k === 'arrowleft' || k === 'a') { this.player.queueDir(-1, 0); e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd') { this.player.queueDir(1, 0); e.preventDefault(); }
    else if (k === 'r') { this.reset(true); }
    else if ((k === 'enter' || k === ' ') && this.state !== 'playing') {
      this.start();
    }
  }
  showOverlay(title, msg, btnText) {
    document.getElementById('panelTitle').textContent = title;
    document.getElementById('panelMsg').innerHTML = msg;
    document.getElementById('startBtn').textContent = btnText;
    document.getElementById('overlay').classList.add('show');
  }
  hideOverlay() {
    document.getElementById('overlay').classList.remove('show');
  }
  start() {
    if (this.state === 'win' || this.state === 'lose') {
      this.reset(false);
    }
    this.state = 'playing';
    this.hideOverlay();
    this.refreshHUD();
    playBgm();
  }
  reset(showPanel) {
    stopAllAudio();
    this.maze = new Maze();
    this.player = new Player();
    this.setupEnemies();
    this.state = 'ready';
    this.totalBeans = this.maze.beanCount;
    this.refreshHUD();
    if (showPanel) {
      this.showOverlay('重新开始', '控制圆头耄耋，逃到金色出口！<br>小心敌人的追捕！', '开始游戏');
    }
  }
  nextLevel() {
    this.level++;
    this.score += 200;
    this.maze = new Maze();
    this.player = new Player();
    this.setupEnemies();
    this.totalBeans = this.maze.beanCount;
    this.state = 'ready';
    let warning = '';
    if (this.level === 3) warning = '<br>⚠ 出现了彩蛋敌人！';
    this.showOverlay(`第 ${this.level} 关`, `太棒了！成功逃脱！${warning}<br>当前得分：<b>${this.score}</b>`, '继续冒险');
  }
  checkCollisions() {
    // 1. 检查是否到达出口
    if (this.player.cx === this.maze.exit.cx && this.player.cy === this.maze.exit.cy) {
      this.state = 'win';
      this.score += 200;
      setTimeout(() => this.nextLevel(), 300);
      return;
    }
    // 2. 检查是否吃到豆子
    const beanScore = this.maze.eatBean(this.player.cx, this.player.cy);
    if (beanScore > 0) {
      this.score += beanScore;
    }
    // 3. 检查是否被敌人抓到
    for (let i = 0; i < this.chasers.length; i++) {
      const chaser = this.chasers[i];
      const dx = this.player.px - chaser.px;
      const dy = this.player.py - chaser.py;
      if (Math.hypot(dx, dy) < TILE * 0.8) {
        this.state = 'lose';
        stopBgm();
        if (chaser.type === 'tafei') {
          playTafeiSound();
          this.showOverlay('被永雏塔菲抓到了！',
            `永雏塔菲抓住了圆头耄耋！<br>收集了 ${this.totalBeans - this.maze.beanCount} 颗豆子<br>最终得分：<b>${this.score}</b>`,
            '再来一次');
        } else {
          playCaptureSound();
          this.showOverlay('被奶蛙抓到了！',
            `奶蛙抓住了圆头耄耋！<br>收集了 ${this.totalBeans - this.maze.beanCount} 颗豆子<br>最终得分：<b>${this.score}</b>`,
            '再来一次');
        }
        return;
      }
    }
  }
  update() {
    if (this.state !== 'playing') return;
    this.player.update(this.maze);
    for (const chaser of this.chasers) {
      chaser.update(this.maze, this.player);
    }
    this.checkCollisions();
    this.refreshHUD();
  }
  draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    this.maze.draw();
    for (const chaser of this.chasers) {
      chaser.draw();
    }
    this.player.draw();
  }
}

/* ---------- 启动 ---------- */
const game = new Game();
game.showOverlay('准备好了吗？', '控制圆头耄耋，逃到右下角的金色出口！<br>收集豆子加分，后面还有彩蛋哦～', '开始游戏');

function loop() {
  game.update();
  game.draw();
  requestAnimationFrame(loop);
}
loop();
</script>
