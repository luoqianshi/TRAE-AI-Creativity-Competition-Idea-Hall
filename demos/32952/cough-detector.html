<body>

<div class="app">
  <!-- ===== HOME ===== -->
  <div class="page active" id="page-home">
    <div class="home-header">
      <div>
        <div class="home-title">咳嗽日记</div>
        <div class="home-date" id="homeDate">--</div>
      </div>
      <div class="monitor-pill off" id="monitorPill">
        <span class="pill-dot"></span>
        <span id="pillText">未监听</span>
      </div>
    </div>

    <div class="count-card">
      <div class="count-label">今日咳嗽</div>
      <div class="count-number" id="countNum">0</div>
      <div class="count-sub" id="countSub">点击开始监听，自动记录</div>
    </div>

    <div class="hour-strip">
      <div class="hour-strip-header">
        <span class="hour-strip-title">24 小时分布</span>
        <span class="hour-strip-peak">活跃 <strong id="peakHour">--</strong></span>
      </div>
      <div class="hour-cells" id="hourCells"></div>
    </div>

    <button class="action-btn start" id="actionBtn" onclick="toggleMonitor()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
      <span id="actionText">开始监听</span>
    </button>

    <div class="section-header">
      <span class="section-title">最近咳嗽</span>
      <span class="section-action" onclick="switchPage('timeline')">查看全部</span>
    </div>
    <div class="cough-list" id="recentList">
      <div class="empty-row">暂无记录<span class="demo-note">当前为演示版本，使用音频特征规则检测，尚未接入专用咳嗽识别模型</span></div>
    </div>
  </div>

  <!-- ===== TIMELINE ===== -->
  <div class="page" id="page-timeline">
    <div class="home-header" style="margin-bottom:16px;">
      <div class="home-title">时间线</div>
    </div>

    <div class="calendar-nav">
      <button class="cal-nav-btn" onclick="changeMonth(-1)">&lt;</button>
      <div class="cal-title">
        <div class="cal-month" id="calMonth">--</div>
        <div class="cal-sub" id="calSub">--</div>
      </div>
      <button class="cal-nav-btn" onclick="changeMonth(1)">&gt;</button>
    </div>

    <div class="calendar-grid" id="calGrid"></div>

    <div class="day-detail" id="dayDetail" style="display:none;">
      <div class="day-detail-header">
        <span id="detailDate">--</span>
        <span class="d-total" id="detailTotal">--</span>
      </div>
      <div class="cough-list" id="detailList"></div>
    </div>
  </div>

  <!-- ===== STATS ===== -->
  <div class="page" id="page-stats">
    <div class="home-header" style="margin-bottom:16px;">
      <div class="home-title">统计</div>
    </div>

    <div class="stat-cards">
      <div class="stat-card">
        <div class="sc-label">本周咳嗽</div>
        <div class="sc-value" id="weekTotal" style="color:var(--danger);">0</div>
        <div class="sc-sub" id="weekSub">--</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">平均/天</div>
        <div class="sc-value" id="dayAvg" style="color:var(--accent);">0</div>
        <div class="sc-sub">本周平均</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">总天数</div>
        <div class="sc-value" id="totalDays" style="color:var(--ink);">0</div>
        <div class="sc-sub">有记录天数</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">总次数</div>
        <div class="sc-value" id="totalAll" style="color:var(--warning);">0</div>
        <div class="sc-sub">累计咳嗽</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">本周趋势</div>
      <div class="week-chart" id="weekChart"></div>
    </div>

    <div class="chart-card">
      <div class="chart-title">时段分布（近7天）</div>
      <div class="hour-chart" id="hourChart"></div>
    </div>
  </div>

  <!-- ===== SETTINGS ===== -->
  <div class="page" id="page-settings">
    <div class="home-header" style="margin-bottom:16px;">
      <div class="home-title">设置</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'cough_diary_v2';
  const SETTINGS_KEY = 'cough_diary_settings';

  let audioCtx = null, analyser = null, stream = null;
  let isMonitoring = false, animFrameId = null;
  let sessionEvents = [], sessionStart = 0, lastCoughTime = 0;
  let sensitivity = 0.7, cooldown = 800;
  let timeDomainData = null, frequencyData = null;
  let calDate = new Date();

  const COUGH_MODEL = {
    rmsMin: 0.04, rmsMax: 0.8,
    zcrMin: 0.05, zcrMax: 0.6,
    centroidMin: 800, centroidMax: 6000,
    flatnessMin: 0.01, flatnessMax: 0.5,
    peakFreqMin: 300, peakFreqMax: 4000,
    bandwidthMin: 500,
    weights: { rms: 0.25, zcr: 0.15, centroid: 0.20, flatness: 0.10, peakFreq: 0.15, bandwidth: 0.15 }
  };

  // ==================== Storage ====================
  function loadData() {
    try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : { sessions: [] }; }
    catch(e) { return { sessions: [] }; }
  }

  function saveData(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch(e) { showToast('存储空间不足'); }
  }

  function loadSettings() {
    try {
      const r = localStorage.getItem(SETTINGS_KEY);
      if (r) {
        const s = JSON.parse(r);
        sensitivity = s.sensitivity ?? 0.7;
        cooldown = s.cooldown ?? 800;
        document.getElementById('sensSlider').value = Math.round(sensitivity * 100);
        document.getElementById('sensVal').textContent = Math.round(sensitivity * 100) + '%';
        document.getElementById('coolSlider').value = cooldown;
        document.getElementById('coolVal').textContent = cooldown + 'ms';
      }
    } catch(e) {}
  }

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ sensitivity, cooldown })); }
    catch(e) {}
  }

  function getDayEvents(date) {
    const data = loadData();
    const ds = new Date(date); ds.setHours(0,0,0,0);
    const de = new Date(ds); de.setDate(de.getDate() + 1);
    const ev = [];
    data.sessions.forEach(s => {
      (s.events || []).forEach(e => {
        const t = new Date(e.time).getTime();
        if (t >= ds.getTime() && t < de.getTime()) ev.push(e);
      });
    });
    ev.sort((a, b) => new Date(a.time) - new Date(b.time));
    return ev;
  }

  function getTodayEvents() { return getDayEvents(new Date()); }

  function getWeekData() {
    const data = loadData();
    const today = new Date(); today.setHours(0,0,0,0);
    const ws = new Date(today); ws.setDate(ws.getDate() - ws.getDay());
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(ws); d.setDate(d.getDate() + i);
      const de = new Date(d); de.setDate(de.getDate() + 1);
      let c = 0;
      data.sessions.forEach(s => {
        (s.events || []).forEach(e => {
          const t = new Date(e.time).getTime();
          if (t >= d.getTime() && t < de.getTime()) c++;
        });
      });
      days.push({ date: d, count: c, isToday: d.getTime() === today.getTime() });
    }
    return days;
  }

  function getHourDist(daysBack = 7) {
    const data = loadData();
    const cutoff = Date.now() - daysBack * 24 * 3600 * 1000;
    const counts = new Array(24).fill(0);
    data.sessions.forEach(s => {
      (s.events || []).forEach(e => {
        if (new Date(e.time).getTime() >= cutoff) counts[new Date(e.time).getHours()]++;
      });
    });
    return counts;
  }

  // ==================== Audio ====================
  async function startAudio() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.3;
      src.connect(analyser);
      timeDomainData = new Float32Array(analyser.fftSize);
      frequencyData = new Uint8Array(analyser.frequencyBinCount);
      return true;
    } catch(err) { showToast('无法访问麦克风'); return false; }
  }

  function stopAudio() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
  }

  function extractFeatures() {
    analyser.getFloatTimeDomainData(timeDomainData);
    analyser.getByteFrequencyData(frequencyData);
    const N = timeDomainData.length;
    let sumSq = 0;
    for (let i = 0; i < N; i++) sumSq += timeDomainData[i] * timeDomainData[i];
    const rms = Math.sqrt(sumSq / N);
    let zcr = 0;
    for (let i = 1; i < N; i++) {
      if ((timeDomainData[i] >= 0 && timeDomainData[i-1] < 0) || (timeDomainData[i] < 0 && timeDomainData[i-1] >= 0)) zcr++;
    }
    zcr /= (N - 1);
    const bc = frequencyData.length;
    let ws = 0, ms = 0, mm = 0, mb = 0;
    for (let i = 0; i < bc; i++) {
      const m = frequencyData[i]; ws += i * m; ms += m;
      if (m > mm) { mm = m; mb = i; }
    }
    const c = ms > 0 ? ws / ms : 0;
    const sr = audioCtx.sampleRate;
    const ch = (c * sr) / analyser.fftSize;
    const pf = (mb * sr) / analyser.fftSize;
    let ls = 0, ct = 0;
    for (let i = 1; i < bc; i++) { ls += Math.log(frequencyData[i] + 1); ct++; }
    const gm = Math.exp(ls / ct);
    const am = ms / bc;
    const fl = am > 0 ? gm / am : 0;
    let vs = 0;
    for (let i = 0; i < bc; i++) vs += Math.pow(i - c, 2) * frequencyData[i];
    const bw = ms > 0 ? Math.sqrt(vs / ms) * sr / analyser.fftSize : 0;
    return { rms, zcr, centroidHz: ch, flatness: fl, peakFreq: pf, bandwidth: bw };
  }

  function computeScore(f) {
    const m = COUGH_MODEL;
    let s = 0;
    if (f.rms >= m.rmsMin && f.rms <= m.rmsMax) s += Math.min((f.rms - m.rmsMin) / (m.rmsMax - m.rmsMin) * 2, 1) * m.weights.rms;
    if (f.zcr >= m.zcrMin && f.zcr <= m.zcrMax) s += Math.min((f.zcr - m.zcrMin) / (m.zcrMax - m.zcrMin) * 1.5, 1) * m.weights.zcr;
    if (f.centroidHz >= m.centroidMin && f.centroidHz <= m.centroidMax) s += Math.min((f.centroidHz - m.centroidMin) / (m.centroidMax - m.centroidMin) * 1.5, 1) * m.weights.centroid;
    if (f.flatness >= m.flatnessMin && f.flatness <= m.flatnessMax) s += Math.min((f.flatness - m.flatnessMin) / (m.flatnessMax - m.flatnessMin) * 1.2, 1) * m.weights.flatness;
    if (f.peakFreq >= m.peakFreqMin && f.peakFreq <= m.peakFreqMax) s += Math.min((f.peakFreq - m.peakFreqMin) / (m.peakFreqMax - m.peakFreqMin) * 1.5, 1) * m.weights.peakFreq;
    if (f.bandwidth >= m.bandwidthMin) s += Math.min(f.bandwidth / 5000, 1) * m.weights.bandwidth;
    return Math.min(s, 1);
  }

  function detectionLoop() {
    if (!isMonitoring) return;
    const f = extractFeatures();
    const sc = computeScore(f);
    const now = Date.now();
    const th = 0.3 + (1 - sensitivity) * 0.5;
    if (sc >= th && (now - lastCoughTime) > cooldown) {
      sessionEvents.push({ time: new Date().toISOString(), confidence: Math.round(sc * 100) });
      lastCoughTime = now;
      if (sessionEvents.length % 5 === 0) flushSession();
      // Fast update: only update visible page
      fastUpdateHome();
      showToast('检测到咳嗽');
    }
    animFrameId = requestAnimationFrame(detectionLoop);
  }

  // Fast incremental update (no full re-render, no localStorage read)
  function fastUpdateHome() {
    // Use in-memory sessionEvents + today's saved events count
    const savedToday = getTodayEvents();
    const totalCount = savedToday.length + sessionEvents.length;

    const num = document.getElementById('countNum');
    num.textContent = totalCount;
    num.className = 'count-number' + (totalCount > 0 ? ' has-cough' : '');
    document.getElementById('countSub').textContent = totalCount > 0 ? '今日已记录 ' + totalCount + ' 次' : '点击开始监听，自动记录';

    // Get the newly detected event (last in sessionEvents)
    const lastEv = sessionEvents[sessionEvents.length - 1];
    if (!lastEv) return;

    // Update peak hour (only from sessionEvents, saved data hasn't changed)
    const allToday = savedToday.concat(sessionEvents);
    const hc = new Array(24).fill(0);
    allToday.forEach(e => hc[new Date(e.time).getHours()]++);
    if (totalCount > 0) {
      document.getElementById('peakHour').textContent = hc.indexOf(Math.max(...hc)) + ':00';
    }

    // Update recent list: prepend the new event
    const list = document.getElementById('recentList');
    const t = new Date(lastEv.time);
    const hm = t.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
    const row = document.createElement('div');
    row.className = 'cough-row';
    row.style.animation = 'fadeIn 0.3s ease-out';
    row.innerHTML = `
      <div class="cough-time">${hm}</div>
      <div class="cough-ago">刚刚</div>
      <div class="cough-bar"><div class="cough-bar-fill" style="width:${lastEv.confidence}%"></div></div>
      <div class="cough-conf">${lastEv.confidence}%</div>
    `;
    const empty = list.querySelector('.empty-row');
    if (empty) empty.remove();
    list.insertBefore(row, list.firstChild);
    while (list.children.length > 8) list.removeChild(list.lastChild);

    // Update hour cell for current hour only
    const ch = t.getHours();
    const cells = document.querySelectorAll('.hour-cell');
    const cell = cells[ch];
    if (cell) {
      const hCount = sessionEvents.filter(e => new Date(e.time).getHours() === ch).length +
                     savedToday.filter(e => new Date(e.time).getHours() === ch).length;
      const mx = Math.max(...hc, 1);
      let bar = cell.querySelector('.h-bar');
      if (!bar && hCount > 0) {
        bar = document.createElement('div');
        bar.className = 'h-bar';
        cell.insertBefore(bar, cell.firstChild);
      }
      if (bar) bar.style.height = Math.max((hCount / mx) * 100, 10) + '%';

      let dots = cell.querySelector('.h-dots');
      if (!dots) {
        dots = document.createElement('div');
        dots.className = 'h-dots';
        cell.appendChild(dots);
      }
      // Clear and rebuild dots for this hour (max 8)
      dots.innerHTML = '';
      const hourEvents = allToday.filter(e => new Date(e.time).getHours() === ch);
      const showDots = Math.min(hourEvents.length, 8);
      for (let i = 0; i < showDots; i++) {
        const d = document.createElement('div');
        d.className = 'h-dot';
        dots.appendChild(d);
      }

      let ov = cell.querySelector('.h-overflow');
      if (hourEvents.length > 8) {
        if (!ov) {
          ov = document.createElement('div');
          ov.className = 'h-overflow';
          cell.appendChild(ov);
        }
        ov.textContent = '+' + (hourEvents.length - 8);
      } else if (ov) {
        ov.remove();
      }
    }
  }

  function renderHomeRecent() {
    const ev = getTodayEvents();
    const list = document.getElementById('recentList');
    if (ev.length === 0) {
      list.innerHTML = '<div class="empty-row">暂无记录<span class="demo-note">当前为演示版本，使用音频特征规则检测，尚未接入专用咳嗽识别模型</span></div>';
      return;
    }
    const rec = ev.slice(-8).reverse();
    const n = Date.now();
    list.innerHTML = rec.map(e => {
      const t = new Date(e.time);
      const hm = t.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
      const df = Math.floor((n - t.getTime()) / 60000);
      const ag = df < 1 ? '刚刚' : df < 60 ? df + '分钟前' : Math.floor(df / 60) + '小时前';
      return `
        <div class="cough-row">
          <div class="cough-time">${hm}</div>
          <div class="cough-ago">${ag}</div>
          <div class="cough-bar"><div class="cough-bar-fill" style="width:${e.confidence}%"></div></div>
          <div class="cough-conf">${e.confidence}%</div>
        </div>
      `;
    }).join('');
  }

  function flushSession() {
    if (sessionEvents.length === 0) return;
    const data = loadData();
    data.sessions.push({ startTime: sessionStart, endTime: Date.now(), events: sessionEvents.slice(), sensitivity, cooldown });
    const co = Date.now() - 90 * 24 * 3600 * 1000;
    data.sessions = data.sessions.filter(s => s.endTime >= co);
    saveData(data);
  }

  // ==================== UI Render ====================
  function refreshAll() {
    renderHome();
    renderCalendar();
    renderStats();
    renderStorage();
  }

  function renderHome() {
    const ev = getTodayEvents();
    const num = document.getElementById('countNum');
    num.textContent = ev.length;
    num.className = 'count-number' + (ev.length > 0 ? ' has-cough' : '');
    document.getElementById('countSub').textContent = ev.length > 0 ? '今日已记录 ' + ev.length + ' 次' : '点击开始监听，自动记录';

    // Date
    const now = new Date();
    document.getElementById('homeDate').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });

    // Hour cells
    const hc = new Array(24).fill(0);
    ev.forEach(e => hc[new Date(e.time).getHours()]++);
    const mx = Math.max(...hc, 1);
    const ch = now.getHours();
    const strip = document.getElementById('hourCells');
    strip.innerHTML = '';
    for (let h = 0; h < 24; h++) {
      const cell = document.createElement('div');
      cell.className = 'hour-cell' + (h === ch ? ' current' : '');
      cell.onclick = () => showHourDetail(h);
      if (hc[h] > 0) {
        const bar = document.createElement('div');
        bar.className = 'h-bar';
        bar.style.height = Math.max((hc[h] / mx) * 100, 10) + '%';
        cell.appendChild(bar);
      }
      const dots = document.createElement('div');
      dots.className = 'h-dots';
      const hev = ev.filter(e => new Date(e.time).getHours() === h);
      const show = hev.slice(0, 8);
      show.forEach(() => {
        const d = document.createElement('div');
        d.className = 'h-dot';
        dots.appendChild(d);
      });
      if (hev.length > 8) {
        const ov = document.createElement('div');
        ov.className = 'h-overflow';
        ov.textContent = '+' + (hev.length - 8);
        cell.appendChild(ov);
      }
      cell.appendChild(dots);
      const lbl = document.createElement('div');
      lbl.className = 'h-label';
      lbl.textContent = h % 3 === 0 ? h : '';
      cell.appendChild(lbl);
      strip.appendChild(cell);
    }

    // Peak
    if (ev.length > 0) {
      const ph = hc.indexOf(Math.max(...hc));
      document.getElementById('peakHour').textContent = ph + ':00';
    } else {
      document.getElementById('peakHour').textContent = '--';
    }

    // Recent
    renderHomeRecent();
  }

  function renderCalendar() {
    const y = calDate.getFullYear(), m = calDate.getMonth();
    document.getElementById('calMonth').textContent = y + '年' + (m + 1) + '月';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const first = new Date(y, m, 1);
    const last = new Date(y, m + 1, 0);
    const startDay = first.getDay();
    const daysInMonth = last.getDate();
    const prevLast = new Date(y, m, 0).getDate();
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    weekdays.forEach(w => {
      const el = document.createElement('div');
      el.className = 'cal-weekday';
      el.textContent = w;
      grid.appendChild(el);
    });

    // Prev month padding
    for (let i = startDay - 1; i >= 0; i--) {
      const d = prevLast - i;
      const cell = createCalDay(d, true, false);
      grid.appendChild(cell);
    }

    // Current month
    const data = loadData();
    const dayCounts = {};
    for (let d = 1; d <= daysInMonth; d++) {
      const ds = new Date(y, m, d);
      ds.setHours(0, 0, 0, 0);
      const de = new Date(ds);
      de.setDate(de.getDate() + 1);
      let c = 0;
      data.sessions.forEach(s => {
        (s.events || []).forEach(e => {
          const t = new Date(e.time).getTime();
          if (t >= ds.getTime() && t < de.getTime()) c++;
        });
      });
      dayCounts[d] = c;
    }

    const maxC = Math.max(...Object.values(dayCounts), 1);
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = (y === today.getFullYear() && m === today.getMonth() && d === today.getDate());
      const cell = createCalDay(d, false, isToday, dayCounts[d], maxC, y, m);
      grid.appendChild(cell);
    }

    // Next month padding
    const totalCells = startDay + daysInMonth;
    const rem = 42 - totalCells;
    for (let d = 1; d <= rem; d++) {
      const cell = createCalDay(d, true, false);
      grid.appendChild(cell);
    }

    // Subtitle
    const hasData = Object.values(dayCounts).some(c => c > 0);
    document.getElementById('calSub').textContent = hasData ? '点击日期查看详情' : '该月暂无记录';
  }

  function createCalDay(d, other, isToday, count, max, year, month) {
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (other ? ' other-month' : '') + (isToday ? ' today' : '');
    if (!other && count !== undefined) {
      const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      cell.onclick = () => showDayDetail(dateStr);
      if (count > 0) {
        const pct = (count / max) * 100;
        const bar = document.createElement('div');
        bar.className = 'd-bar';
        const fill = document.createElement('div');
        fill.className = 'd-bar-fill';
        fill.style.width = Math.max(pct, 5) + '%';
        bar.appendChild(fill);
        cell.appendChild(bar);
      }
    }
    const num = document.createElement('div');
    num.className = 'd-num';
    num.textContent = d;
    cell.appendChild(num);
    if (!other && count !== undefined) {
      const cnt = document.createElement('div');
      cnt.className = 'd-count' + (count === 0 ? ' zero' : '');
      cnt.textContent = count > 0 ? count + '次' : '';
      cell.appendChild(cnt);
    }
    return cell;
  }

  function showDayDetail(dateStr) {
    const date = new Date(dateStr);
    const ev = getDayEvents(date);
    const wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    document.getElementById('detailDate').textContent = (date.getMonth() + 1) + '月' + date.getDate() + '日 ' + wd[date.getDay()];
    document.getElementById('detailTotal').textContent = ev.length + '次';
    document.getElementById('dayDetail').style.display = 'block';

    const list = document.getElementById('detailList');
    if (ev.length === 0) {
      list.innerHTML = '<div class="empty-row">该日暂无记录<span class="demo-note">当前为演示版本，使用音频特征规则检测，尚未接入专用咳嗽识别模型</span></div>';
    } else {
      list.innerHTML = ev.map(e => {
        const t = new Date(e.time);
        const hm = t.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
        return `
          <div class="cough-row">
            <div class="cough-time">${hm}</div>
            <div class="cough-bar"><div class="cough-bar-fill" style="width:${e.confidence}%"></div></div>
            <div class="cough-conf">${e.confidence}%</div>
          </div>
        `;
      }).join('');
    }
  }

  function renderStats() {
    const week = getWeekData();
    const weekTotal = week.reduce((s, d) => s + d.count, 0);
    document.getElementById('weekTotal').textContent = weekTotal;
    const avg = weekTotal / 7;
    document.getElementById('dayAvg').textContent = avg.toFixed(1);
    document.getElementById('weekSub').textContent = weekTotal > 0 ? '较上周 --' : '暂无数据';

    const data = loadData();
    let totalAll = 0, daysWithData = new Set();
    data.sessions.forEach(s => {
      (s.events || []).forEach(e => {
        totalAll++;
        const d = new Date(e.time);
        daysWithData.add(d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate());
      });
    });
    document.getElementById('totalDays').textContent = daysWithData.size;
    document.getElementById('totalAll').textContent = totalAll;

    // Week chart
    const mx = Math.max(...week.map(d => d.count), 1);
    const chart = document.getElementById('weekChart');
    chart.innerHTML = '';
    const wn = ['日', '一', '二', '三', '四', '五', '六'];
    week.forEach(d => {
      const col = document.createElement('div');
      col.className = 'week-col';
      const bar = document.createElement('div');
      bar.className = 'week-bar' + (d.count > 0 ? ' has-data' : '') + (d.isToday ? ' today-bar' : '');
      bar.style.height = Math.max((d.count / mx) * 100, 3) + '%';
      col.appendChild(bar);
      const lbl = document.createElement('div');
      lbl.className = 'week-label';
      lbl.textContent = wn[d.date.getDay()];
      col.appendChild(lbl);
      chart.appendChild(col);
    });

    // Hour chart
    const hc = getHourDist(7);
    const hmx = Math.max(...hc, 1);
    const hchart = document.getElementById('hourChart');
    hchart.innerHTML = '';
    for (let h = 0; h < 24; h++) {
      const col = document.createElement('div');
      col.className = 'hour-col';
      const bar = document.createElement('div');
      bar.className = 'hour-bar-v' + (hc[h] > 0 ? ' has-data' : '');
      bar.style.height = Math.max((hc[h] / hmx) * 100, 2) + '%';
      col.appendChild(bar);
      const lbl = document.createElement('div');
      lbl.className = 'hour-label-v';
      lbl.textContent = h % 3 === 0 ? h : '';
      col.appendChild(lbl);
      hchart.appendChild(col);
    }
  }

  function renderStorage() {
    const str = localStorage.getItem(STORAGE_KEY) || '';
    const kb = (new Blob([str]).size / 1024).toFixed(1);
    document.getElementById('storageSize').textContent = kb + ' KB';
  }

  // ==================== Controls ====================
  window.toggleMonitor = async function() {
    if (!isMonitoring) {
      const ok = await startAudio();
      if (!ok) return;
      isMonitoring = true;
      sessionStart = Date.now();
      sessionEvents = [];
      lastCoughTime = 0;

      document.getElementById('actionBtn').className = 'action-btn stop';
      document.getElementById('actionText').textContent = '停止监听';
      document.getElementById('monitorPill').className = 'monitor-pill on';
      document.getElementById('pillText').textContent = '监听中';

      detectionLoop();
      showToast('开始监听');
    } else {
      isMonitoring = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      stopAudio();
      flushSession();

      document.getElementById('actionBtn').className = 'action-btn start';
      document.getElementById('actionText').textContent = '开始监听';
      document.getElementById('monitorPill').className = 'monitor-pill off';
      document.getElementById('pillText').textContent = '未监听';

      refreshAll();
      showToast('已停止，数据已保存');
    }
  };

  window.switchPage = function(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.querySelector('.nav-item[data-page="' + page + '"]').classList.add('active');
    if (page === 'timeline') renderCalendar();
    if (page === 'stats') renderStats();
    if (page === 'settings') renderStorage();
  };

  window.changeMonth = function(delta) {
    calDate.setMonth(calDate.getMonth() + delta);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (calDate > today) calDate = new Date(today);
    renderCalendar();
    document.getElementById('dayDetail').style.display = 'none';
  };

  window.updateSens = function(v) {
    sensitivity = v / 100;
    document.getElementById('sensVal').textContent = v + '%';
    saveSettings();
  };

  window.updateCool = function(v) {
    cooldown = parseInt(v);
    document.getElementById('coolVal').textContent = v + 'ms';
    saveSettings();
  };

  window.exportCSV = function() {
    const data = loadData();
    let csv = '\uFEFF日期,时间,置信度\n';
    data.sessions.forEach(s => {
      (s.events || []).forEach(e => {
        const t = new Date(e.time);
        const d = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
        const tm = t.toLocaleTimeString('zh-CN', { hour12: false });
        csv += d + ',' + tm + ',' + e.confidence + '%\n';
      });
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '咳嗽日记-' + fmtDate(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('CSV 已导出');
  };

  window.clearAll = function() {
    if (!confirm('确定清除所有数据？不可恢复。')) return;
    localStorage.removeItem(STORAGE_KEY);
    refreshAll();
    showToast('数据已清除');
  };

  window.showHourDetail = function(h) {
    const ev = getTodayEvents().filter(e => new Date(e.time).getHours() === h);
    if (ev.length === 0) return;
    const today = new Date();
    showDayDetail(today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0'));
  };

  function fmtDate(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ==================== Toast ====================
  let tt = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (tt) clearTimeout(tt);
    tt = setTimeout(() => el.classList.remove('show'), 2000);
  }

  // ==================== Init ====================
  loadSettings();
  refreshAll();

})();
</script>
</body>
</html>
