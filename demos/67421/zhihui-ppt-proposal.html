  <div class="app">

      </div>

      <!-- Body: inputs -->
      <div class="sidebar-body" id="sidebarBody">
        <!-- Prompt -->
        <div class="sb-section">
          <h3>描述你的PPT</h3>
          <textarea id="prompt" placeholder="比如：帮我做一份关于人工智能发展趋势的汇报PPT，面向公司管理层，风格要专业简洁..."></textarea>
        </div>

        <!-- Image Upload -->
        <div class="sb-section">
          <h3>参考图片（可选）</h3>
          <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*">
            <div class="icon">&#128247;</div>
            <p>点击或拖拽上传图片</p>
            <p class="hint">AI 将参考图片的风格、配色和版式</p>
          </div>
          <div class="upload-preview" id="uploadPreview">
            <img id="previewImg" src="" alt="预览">
            <button class="remove" id="removeImg">&times;</button>
            <div class="label">参考图片已上传</div>
          </div>
        </div>

        <!-- Examples -->
        <div class="sb-section">
          <h3>快速示例</h3>
          <div class="examples">
            <span class="chip" data-text="帮我做一份大学生创新创业项目答辩PPT，主题是智能垃圾分类系统，风格清新活泼">创新创业答辩</span>
            <span class="chip" data-text="做一份2025年Q2销售数据汇报PPT，包含业绩增长、区域分布、下季度计划三个部分，商务风格">销售汇报</span>
            <span class="chip" data-text="生成一份关于新能源汽车行业分析的PPT，面向投资人，需要数据图表，科技蓝风格">行业分析</span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="sidebar-footer" id="sidebarFooter">
        <button class="btn btn-primary" id="generateBtn">
          <span>&#9889;</span> 生成PPT
        </button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main" id="mainArea">
      <!-- Empty -->
      <div class="empty-state" id="emptyState">
        <div class="icon">&#128208;</div>
        <h2>输入描述，即刻生成</h2>
        <p>在左侧输入你的PPT需求，或上传参考图片<br>AI 将为你生成完整演示文稿</p>
      </div>

      <!-- Loading -->
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">正在理解你的需求...</div>
        <div class="progress-steps">
          <div class="p-step" id="step1"><div class="dot"></div>解析语义与主题</div>
          <div class="p-step" id="step2"><div class="dot"></div>构建内容大纲</div>
          <div class="p-step" id="step3"><div class="dot"></div>分析参考图片风格</div>
          <div class="p-step" id="step4"><div class="dot"></div>设计视觉与排版</div>
          <div class="p-step" id="step5"><div class="dot"></div>渲染幻灯片</div>
        </div>
      </div>

      <!-- Slide Viewer -->
      <div class="slide-viewer" id="slideViewer">
        <div class="slide-stage" id="slideStage"></div>

        <div class="controls">
          <button class="ctrl-btn" id="prevBtn">&#9664;</button>
          <span class="page-info" id="pageInfo">1 / 5</span>
          <button class="ctrl-btn" id="nextBtn">&#9654;</button>
        </div>

        <div class="thumbs" id="thumbs"></div>
      </div>

      <!-- Export -->
      <div class="export-bar" id="exportBar">
        <button class="btn btn-secondary btn-sm" onclick="exportPPT()">
          <span>&#8595;</span> 导出 PPT
        </button>
      </div>
    </main>
  </div>

  <div class="toast" id="toast">点击幻灯片中的文字或卡片，即可选中编辑</div>

  <script>
    // ===== Data =====
    const demos = {
      default: {
        title: '人工智能发展趋势',
        subtitle: '2025年度行业洞察报告',
        slides: [
          { type:'cover', title:'人工智能发展趋势', subtitle:'2025年度行业洞察报告' },
          { type:'toc', items:['行业现状概述','核心技术突破','市场机遇与挑战','未来展望与建议'] },
          { type:'list', title:'行业现状概述', items:['全球AI市场规模预计2025年突破5000亿美元，年复合增长率达38%','大语言模型技术快速迭代，多模态能力成为新竞争焦点','中国AI企业数量超过4000家，应用场景持续扩展','政策层面持续加码，国家级AI战略加速落地'], highlight:'AI正在从"技术驱动"转向"应用驱动"，商业化落地速度显著加快。' },
          { type:'grid', title:'核心技术突破', items:[{h:'大语言模型',p:'参数量持续攀升，推理效率优化成为关键方向，模型压缩与边缘部署技术日趋成熟。'},{h:'计算机视觉',p:'从图像识别向视频理解、3D场景重建演进，工业质检与自动驾驶是主要落地场景。'},{h:'多模态融合',p:'文本、图像、音频、视频的统一理解与生成，开启人机交互新范式。'},{h:'AI Agent',p:'从被动响应到主动规划，具备工具调用与任务执行能力的智能体成为新热点。'}] },
          { type:'end', title:'谢谢观看' }
        ]
      },
      '创新创业答辩': {
        title: '智能垃圾分类系统',
        subtitle: '大学生创新创业项目答辩',
        slides: [
          { type:'cover', title:'智能垃圾分类系统', subtitle:'大学生创新创业项目答辩' },
          { type:'toc', items:['项目背景与痛点','产品方案介绍','技术创新点','商业模式与规划'] },
          { type:'list', title:'项目背景与痛点', items:['传统垃圾分类依赖人工，效率低且准确率不足60%','居民分类意识薄弱，"不会分、不愿分"现象普遍','现有智能设备成本高、部署难，难以大规模推广','垃圾回收链条信息不透明，数据化程度低'], highlight:'亟需一套低成本、易部署、高准确率的智能垃圾分类解决方案。' },
          { type:'grid', title:'产品方案介绍', items:[{h:'AI图像识别',p:'基于卷积神经网络，实时识别垃圾类别，准确率达95%以上。'},{h:'智能投放终端',p:'模块化设计，低成本硬件方案，支持社区快速部署。'},{h:'积分激励系统',p:'正确分类获得积分，可兑换生活用品，提升用户参与度。'},{h:'数据管理平台',p:'全流程数据追踪，为政府和企业提供决策支持。'}] },
          { type:'end', title:'感谢聆听 · 期待合作' }
        ]
      },
      '销售汇报': {
        title: '2025 Q2 销售数据汇报',
        subtitle: '业绩回顾与下季度规划',
        slides: [
          { type:'cover', title:'2025 Q2 销售数据汇报', subtitle:'业绩回顾与下季度规划' },
          { type:'toc', items:['Q2业绩总览','区域业绩分布','重点项目回顾','Q3工作计划'] },
          { type:'list', title:'Q2业绩总览', items:['Q2总销售额达2.8亿元，同比增长42%，超额完成季度目标','新客户签约数量同比增长65%，市场拓展成效显著','大客户复购率提升至78%，客户粘性持续增强','线上渠道销售占比首次突破35%，数字化转型初见成效'], highlight:'Q2整体表现优异，为全年目标达成奠定坚实基础。' },
          { type:'grid', title:'区域业绩分布', items:[{h:'华东区',p:'销售额1.1亿元，占比39%，核心市场地位稳固，同比增长35%。'},{h:'华南区',p:'销售额6800万元，占比24%，新兴市场增长迅速，同比增幅达58%。'},{h:'华北区',p:'销售额5200万元，占比19%，大客户项目集中，单客价值最高。'},{h:'西部区',p:'销售额5000万元，占比18%，增速最快达72%，潜力巨大的增量市场。'}] },
          { type:'end', title:'砥砺前行 · 再创佳绩' }
        ]
      },
      '行业分析': {
        title: '新能源汽车行业分析',
        subtitle: '投资视角下的机遇与风险',
        slides: [
          { type:'cover', title:'新能源汽车行业分析', subtitle:'投资视角下的机遇与风险' },
          { type:'toc', items:['市场规模与增速','产业链核心环节','竞争格局演变','投资建议与风险提示'] },
          { type:'list', title:'市场规模与增速', items:['2025年全球新能源车销量预计突破2000万辆，渗透率超25%','中国市场占全球销量60%以上，自主品牌份额持续提升','电池成本较2020年下降40%，平价时代加速到来','充电基础设施快速完善，车桩比降至2.5:1'], highlight:'行业从政策驱动转向市场驱动，长期增长逻辑清晰。' },
          { type:'grid', title:'产业链核心环节', items:[{h:'动力电池',p:'宁德时代、比亚迪双寡头格局，固态电池是下一代技术方向。'},{h:'智能驾驶',p:'L2+渗透率快速提升，城市NOA成为2025年竞争焦点。'},{h:'整车制造',p:'新势力洗牌加速，传统车企电动化转型进入收获期。'},{h:'充换电设施',p:'高压快充与换电模式并行，运营端盈利模式逐步跑通。'}] },
          { type:'end', title:'智语幻灯 让表达更简单' }
        ]
      }
    };

    let currentDemo = demos.default;
    let currentSlide = 0;
    let uploadedImage = null;
    let selectedElement = null;
    let chatHistory = [];
    let elementCounter = 0;

    // ===== Image Upload =====
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const uploadPreview = document.getElementById('uploadPreview');
    const previewImg = document.getElementById('previewImg');
    const removeImg = document.getElementById('removeImg');

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) { alert('请上传图片文件'); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImage = e.target.result;
        previewImg.src = uploadedImage;
        uploadArea.style.display = 'none';
        uploadPreview.classList.add('active');
      };
      reader.readAsDataURL(file);
    }

    removeImg.addEventListener('click', (e) => {
      e.stopPropagation();
      uploadedImage = null;
      fileInput.value = '';
      uploadArea.style.display = 'block';
      uploadPreview.classList.remove('active');
    });

    // ===== Chips =====
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.getElementById('prompt').value = chip.dataset.text;
      });
    });

    // ===== Generate =====
    document.getElementById('generateBtn').addEventListener('click', async () => {
      const prompt = document.getElementById('prompt').value;
      if (!prompt.trim()) { alert('请先输入PPT描述'); return; }

      if (prompt.includes('创业') || prompt.includes('答辩')) currentDemo = demos['创新创业答辩'];
      else if (prompt.includes('销售') || prompt.includes('汇报')) currentDemo = demos['销售汇报'];
      else if (prompt.includes('新能源') || prompt.includes('投资')) currentDemo = demos['行业分析'];
      else currentDemo = demos.default;

      // Switch to loading
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('slideViewer').classList.remove('active');
      document.getElementById('loading').classList.add('active');
      document.getElementById('exportBar').classList.remove('active');

      const steps = [
        { el: document.getElementById('step1'), text: '正在理解你的需求...', delay: 700 },
        { el: document.getElementById('step2'), text: '构建内容大纲中...', delay: 700 },
        { el: document.getElementById('step3'), text: uploadedImage ? '分析参考图片风格...' : '选择默认视觉风格...', delay: uploadedImage ? 1000 : 400 },
        { el: document.getElementById('step4'), text: '设计视觉与排版...', delay: 800 },
        { el: document.getElementById('step5'), text: '渲染幻灯片...', delay: 900 }
      ];

      for (const step of steps) {
        document.querySelectorAll('.p-step').forEach(s => s.classList.remove('active', 'done'));
        step.el.classList.add('active');
        document.getElementById('loadingText').textContent = step.text;
        await sleep(step.delay);
        step.el.classList.remove('active');
        step.el.classList.add('done');
      }

      renderSlides();
      switchToEditMode();

      document.getElementById('loading').classList.remove('active');
      document.getElementById('slideViewer').classList.add('active');
      document.getElementById('exportBar').classList.add('active');
      currentSlide = 0;
      updateSlideView();

      // Show toast hint
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    });

    function switchToEditMode() {
      const sidebarBody = document.getElementById('sidebarBody');
      const sidebarFooter = document.getElementById('sidebarFooter');

      sidebarBody.innerHTML = `
        <div class="sb-section">
          <div class="gen-info">
            <div class="thumb">${uploadedImage ? `<img src="${uploadedImage}">` : '<div style="width:100%;height:100%;background:linear-gradient(135deg,var(--accent),var(--accent2))"></div>'}</div>
            <div class="info">
              <div class="title">${currentDemo.title}</div>
              <div class="meta">${currentDemo.slides.length} 页 · ${uploadedImage ? '参考图片已应用' : '默认风格'}</div>
            </div>
          </div>
        </div>

        <div class="sb-section">
          <h3>选中元素</h3>
          <div class="select-panel empty" id="selectPanel">
            <p>点击幻灯片中的文字、段落或卡片<br>即可选中并对话修改</p>
          </div>
        </div>

        <div class="sb-section" style="flex:1;display:flex;flex-direction:column;min-height:0;">
          <h3>AI 对话修改</h3>
          <div class="chat-area">
            <div class="chat-history" id="chatHistory"></div>
            <div class="chat-input-wrap">
              <input type="text" id="chatInput" placeholder="选中元素后输入修改指令..." disabled>
              <button class="btn btn-primary btn-sm" id="chatSend" disabled>&#10148;</button>
            </div>
          </div>
        </div>
      `;

      sidebarFooter.innerHTML = `
        <button class="btn btn-secondary btn-sm" id="regenBtn">&#8635; 重新生成</button>
        <button class="btn btn-primary" onclick="exportPPT()">
          <span>&#8595;</span> 导出 PPT
        </button>
      `;

      document.getElementById('regenBtn').addEventListener('click', () => location.reload());

      // Chat handlers
      const chatInput = document.getElementById('chatInput');
      const chatSend = document.getElementById('chatSend');
      chatSend.addEventListener('click', () => sendChatMessage());
      chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });
    }

    function sendChatMessage() {
      const chatInput = document.getElementById('chatInput');
      const text = chatInput.value.trim();
      if (!text || !selectedElement) return;

      addChatMessage('user', text);
      chatInput.value = '';
      chatInput.disabled = true;
      document.getElementById('chatSend').disabled = true;

      // Simulate AI response
      setTimeout(() => {
        const reply = simulateAIReply(text, selectedElement);
        addChatMessage('ai', reply.text);
        if (reply.action === 'update') {
          updateSelectedElement(reply.newContent);
        }
        chatInput.disabled = false;
        document.getElementById('chatSend').disabled = false;
        chatInput.focus();
      }, 800 + Math.random() * 600);
    }

    function simulateAIReply(text, el) {
      const type = el.dataset.elType;
      const current = el.textContent;

      if (text.includes('加粗') || text.includes('强调')) {
        return { text: `已将选中的${type}内容加粗显示。`, action: 'none' };
      }
      if (text.includes('颜色') || text.includes('换个颜色') || text.includes('配色')) {
        return { text: `已调整${type}的配色方案。`, action: 'none' };
      }
      if (text.includes('更') || text.includes('改') || text.includes('换') || text.includes('修改') || text.includes('变成')) {
        // Generate modified content
        let newContent = current;
        if (type === 'title') {
          const titles = ['新一代人工智能发展全景', 'AI技术革新与产业变革', '智能时代：机遇与挑战'];
          newContent = titles[Math.floor(Math.random() * titles.length)];
        } else if (type === 'subtitle') {
          newContent = '2025年度深度研究报告';
        } else if (type === 'paragraph' || type === 'highlight') {
          newContent = '通过对行业数据的深度分析，我们发现人工智能技术正以指数级速度渗透各个垂直领域，预计在未来三年内将重塑超过60%的传统业务流程。';
        } else if (type === 'list') {
          return { text: '已为您优化列表内容的表述，使其更加简洁有力。', action: 'none' };
        } else if (type === 'card') {
          newContent = '<h4>边缘计算</h4><p>将AI能力下沉到终端设备，实现低延迟、高隐私的本地化智能处理。</p>';
        }
        return { text: `已根据您的要求修改了${type}内容。`, action: 'update', newContent };
      }
      return { text: `已理解您的需求。选中的${type}内容可以根据您的指令进行调整，请告诉我具体想要如何修改。`, action: 'none' };
    }

    function updateSelectedElement(newContent) {
      if (!selectedElement) return;
      if (selectedElement.dataset.elType === 'card') {
        selectedElement.innerHTML = newContent;
        rebindEditable(selectedElement);
      } else {
        selectedElement.textContent = newContent;
      }
      updateSelectPanel();
    }

    function addChatMessage(role, text) {
      const history = document.getElementById('chatHistory');
      const div = document.createElement('div');
      div.className = 'chat-msg ' + role;
      div.innerHTML = `
        <div class="avatar">${role === 'ai' ? 'AI' : '我'}</div>
        <div class="bubble">${escapeHtml(text)}</div>
      `;
      history.appendChild(div);
      history.scrollTop = history.scrollHeight;
    }

    function escapeHtml(t) {
      return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ===== Slide Rendering =====
    function renderSlides() {
      const stage = document.getElementById('slideStage');
      const thumbs = document.getElementById('thumbs');
      stage.innerHTML = '';
      thumbs.innerHTML = '';
      elementCounter = 0;

      currentDemo.slides.forEach((slide, i) => {
        const el = document.createElement('div');
        el.className = 'slide ' + (i === 0 ? 'active' : '');
        el.dataset.index = i;

        if (slide.type === 'cover') {
          el.classList.add('slide-cover');
          el.innerHTML = `
            <h1 data-editable data-el-type="title" data-el-id="${nextId()}">${slide.title}</h1>
            <p class="subtitle" data-editable data-el-type="subtitle" data-el-id="${nextId()}">${slide.subtitle}</p>
            <p class="meta">智语幻灯 自动生成</p>
            <span class="slide-num">${i + 1} / ${currentDemo.slides.length}</span>
          `;
        } else if (slide.type === 'toc') {
          el.classList.add('slide-content');
          const items = slide.items.map((item, idx) => `<strong>0${idx+1}</strong> &nbsp; ${item}`).join('<br>');
          el.innerHTML = `
            <h2 data-editable data-el-type="title" data-el-id="${nextId()}">目录</h2>
            <div class="body"><div class="highlight" data-editable data-el-type="highlight" data-el-id="${nextId()}">${items}</div></div>
            <span class="slide-num">${i + 1} / ${currentDemo.slides.length}</span>
          `;
        } else if (slide.type === 'list') {
          el.classList.add('slide-content');
          const items = slide.items.map(item => `<li data-editable data-el-type="list-item" data-el-id="${nextId()}">${item}</li>`).join('');
          el.innerHTML = `
            <h2 data-editable data-el-type="title" data-el-id="${nextId()}">${slide.title}</h2>
            <div class="body">
              <ul data-editable data-el-type="list" data-el-id="${nextId()}">${items}</ul>
              <div class="highlight" data-editable data-el-type="highlight" data-el-id="${nextId()}"><strong>关键洞察：</strong>${slide.highlight}</div>
            </div>
            <span class="slide-num">${i + 1} / ${currentDemo.slides.length}</span>
          `;
        } else if (slide.type === 'grid') {
          el.classList.add('slide-grid');
          const items = slide.items.map(item => `
            <div class="grid-item" data-editable data-el-type="card" data-el-id="${nextId()}">
              <h4>${item.h}</h4>
              <p>${item.p}</p>
            </div>
          `).join('');
          el.innerHTML = `
            <h2 data-editable data-el-type="title" data-el-id="${nextId()}">${slide.title}</h2>
            <div class="grid-2">${items}</div>
            <span class="slide-num">${i + 1} / ${currentDemo.slides.length}</span>
          `;
        } else if (slide.type === 'end') {
          el.classList.add('slide-end');
          el.innerHTML = `
            <h2 data-editable data-el-type="title" data-el-id="${nextId()}">${slide.title}</h2>
            <p data-editable data-el-type="paragraph" data-el-id="${nextId()}">智语幻灯 让表达更简单</p>
            <span class="slide-num">${i + 1} / ${currentDemo.slides.length}</span>
          `;
        }

        stage.appendChild(el);

        // Thumb
        const thumb = document.createElement('div');
        thumb.className = 'thumb ' + (i === 0 ? 'active' : '');
        thumb.dataset.index = i;
        thumb.innerHTML = `
          <div class="thumb-preview-inner">
            <div class="t-line ${slide.type === 'cover' || slide.type === 'end' ? 'accent' : ''}"></div>
            <div class="t-line"></div>
            <div class="t-line short"></div>
          </div>
        `;
        thumb.addEventListener('click', () => { currentSlide = i; updateSlideView(); });
        thumbs.appendChild(thumb);
      });

      // Bind editable click
      bindEditableElements();
    }

    function nextId() { return 'el-' + (++elementCounter); }

    function bindEditableElements() {
      document.querySelectorAll('.slide [data-editable]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          selectElement(el);
        });
      });
      // Click outside to deselect
      document.getElementById('slideStage').addEventListener('click', (e) => {
        if (e.target === document.getElementById('slideStage') || e.target.classList.contains('slide')) {
          deselectElement();
        }
      });
    }

    function rebindEditable(container) {
      container.querySelectorAll('[data-editable]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          selectElement(el);
        });
      });
    }

    function selectElement(el) {
      if (selectedElement) selectedElement.classList.remove('selected');
      selectedElement = el;
      el.classList.add('selected');
      updateSelectPanel();

      const chatInput = document.getElementById('chatInput');
      const chatSend = document.getElementById('chatSend');
      if (chatInput) {
        chatInput.disabled = false;
        chatSend.disabled = false;
        chatInput.placeholder = `修改这个${getElTypeName(el.dataset.elType)}...`;
        chatInput.focus();
      }
    }

    function deselectElement() {
      if (selectedElement) selectedElement.classList.remove('selected');
      selectedElement = null;
      updateSelectPanel();
      const chatInput = document.getElementById('chatInput');
      const chatSend = document.getElementById('chatSend');
      if (chatInput) {
        chatInput.disabled = true;
        chatSend.disabled = true;
        chatInput.placeholder = '选中元素后输入修改指令...';
      }
    }

    function updateSelectPanel() {
      const panel = document.getElementById('selectPanel');
      if (!panel) return;
      if (!selectedElement) {
        panel.className = 'select-panel empty';
        panel.innerHTML = '<p>点击幻灯片中的文字、段落或卡片<br>即可选中并对话修改</p>';
        return;
      }
      const type = getElTypeName(selectedElement.dataset.elType);
      const content = selectedElement.innerText.substring(0, 80) + (selectedElement.innerText.length > 80 ? '...' : '');
      panel.className = 'select-panel';
      panel.innerHTML = `
        <div class="sel-label">已选中 · ${type}</div>
        <div class="sel-content">${escapeHtml(content)}</div>
      `;
    }

    function getElTypeName(type) {
      const map = { title:'标题', subtitle:'副标题', paragraph:'段落', highlight:'重点框', list:'列表', 'list-item':'列表项', card:'卡片' };
      return map[type] || '元素';
    }

    function updateSlideView() {
      document.querySelectorAll('.slide').forEach((s, i) => {
        s.classList.toggle('active', i === currentSlide);
      });
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('active', i === currentSlide);
      });
      document.getElementById('pageInfo').textContent = `${currentSlide + 1} / ${currentDemo.slides.length}`;
      document.getElementById('prevBtn').disabled = currentSlide === 0;
      document.getElementById('nextBtn').disabled = currentSlide === currentDemo.slides.length - 1;
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentSlide > 0) { currentSlide--; updateSlideView(); }
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentSlide < currentDemo.slides.length - 1) { currentSlide++; updateSlideView(); }
    });

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  </script>

  <script src="./_shared/js/pptxgen.bundle.js"></script>
  <script>
    function exportPPT() {
      if (!currentDemo || !currentDemo.slides) {
        alert('请先生成PPT');
        return;
      }
      const pres = new PptxGenJS();
      pres.layout = 'LAYOUT_16x9';
      pres.title = currentDemo.title;
      pres.subject = currentDemo.subtitle;
      pres.author = '智语幻灯';

      currentDemo.slides.forEach((slide) => {
        const s = pres.addSlide();

        if (slide.type === 'cover') {
          s.background = { color: 'F8F6FF' };
          s.addText(slide.title, {
            x: 0.5, y: 2.2, w: 9, h: 1.2,
            fontSize: 36, bold: true, color: '7C3AED', align: 'center', fontFace: 'Microsoft YaHei'
          });
          s.addText(slide.subtitle, {
            x: 0.5, y: 3.5, w: 9, h: 0.6,
            fontSize: 18, color: '555555', align: 'center', fontFace: 'Microsoft YaHei'
          });
          s.addText('智语幻灯 自动生成', {
            x: 0.5, y: 4.5, w: 9, h: 0.4,
            fontSize: 12, color: '888888', align: 'center', fontFace: 'Microsoft YaHei'
          });
        }
        else if (slide.type === 'toc') {
          s.background = { color: 'FFFFFF' };
          s.addText('目录', {
            x: 0.5, y: 0.5, w: 9, h: 0.7,
            fontSize: 28, bold: true, color: '1A1A2E', fontFace: 'Microsoft YaHei',
            border: { pt: 0, pb: 4, color: 'E0E0E8' }
          });
          slide.items.forEach((item, i) => {
            s.addText((i + 1) + '. ' + item, {
              x: 1, y: 1.6 + i * 0.8, w: 8, h: 0.6,
              fontSize: 18, color: '333333', fontFace: 'Microsoft YaHei'
            });
          });
        }
        else if (slide.type === 'list') {
          s.background = { color: 'FFFFFF' };
          s.addText(slide.title, {
            x: 0.5, y: 0.5, w: 9, h: 0.7,
            fontSize: 28, bold: true, color: '1A1A2E', fontFace: 'Microsoft YaHei',
            border: { pt: 0, pb: 4, color: 'E0E0E8' }
          });
          const listText = slide.items.map(item => '• ' + item).join('\n');
          s.addText(listText, {
            x: 0.6, y: 1.5, w: 8.8, h: 2.2,
            fontSize: 14, color: '333333', fontFace: 'Microsoft YaHei', lineSpacing: 28
          });
          s.addText('关键洞察：' + slide.highlight, {
            x: 0.6, y: 4.0, w: 8.8, h: 0.9,
            fontSize: 14, bold: true, color: '5B21B6', fontFace: 'Microsoft YaHei',
            fill: { color: 'EDE9FE' }, shape: pres.ShapeType.rect, rectRadius: 0.05
          });
        }
        else if (slide.type === 'grid') {
          s.background = { color: 'FFFFFF' };
          s.addText(slide.title, {
            x: 0.5, y: 0.5, w: 9, h: 0.7,
            fontSize: 28, bold: true, color: '1A1A2E', fontFace: 'Microsoft YaHei'
          });
          const positions = [
            { x: 0.5, y: 1.5, w: 4.3, h: 2.0 },
            { x: 5.2, y: 1.5, w: 4.3, h: 2.0 },
            { x: 0.5, y: 3.8, w: 4.3, h: 2.0 },
            { x: 5.2, y: 3.8, w: 4.3, h: 2.0 }
          ];
          slide.items.forEach((item, i) => {
            const pos = positions[i] || positions[0];
            s.addShape(pres.ShapeType.rect, {
              x: pos.x, y: pos.y, w: pos.w, h: pos.h,
              fill: { color: 'F8F8FC' }, rectRadius: 0.08
            });
            s.addText(item.h, {
              x: pos.x + 0.15, y: pos.y + 0.15, w: pos.w - 0.3, h: 0.4,
              fontSize: 14, bold: true, color: '5B21B6', fontFace: 'Microsoft YaHei'
            });
            s.addText(item.p, {
              x: pos.x + 0.15, y: pos.y + 0.6, w: pos.w - 0.3, h: 1.2,
              fontSize: 11, color: '555555', fontFace: 'Microsoft YaHei', lineSpacing: 18
            });
          });
        }
        else if (slide.type === 'end') {
          s.background = { color: '1A1A2E' };
          s.addText(slide.title, {
            x: 0.5, y: 2.4, w: 9, h: 1,
            fontSize: 32, bold: true, color: 'FFFFFF', align: 'center', fontFace: 'Microsoft YaHei'
          });
          s.addText('智语幻灯 让表达更简单', {
            x: 0.5, y: 3.5, w: 9, h: 0.5,
            fontSize: 14, color: 'AAAAAA', align: 'center', fontFace: 'Microsoft YaHei'
          });
        }
      });

      pres.writeFile({ fileName: currentDemo.title + '.pptx' });
    }
  </script>
