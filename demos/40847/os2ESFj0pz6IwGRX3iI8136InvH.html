// ==================== CHAT SYSTEM ====================
let chatStallId = null;
let chatMessages = [];
let chatLessonIndex = 0;
let chatTimer = null;

function openChat(stallId) {
  chatStallId = stallId;
  chatLessonIndex = 0;
  chatMessages = [];
  const stall = stalls.find(s => s.id === stallId);
  if (!stall || !stall.lessons) return;

  document.getElementById('chat-title').textContent = '💬 与 ' + stall.owner + ' 学习';
  document.getElementById('chat-owner').textContent = stall.name;

  const body = document.getElementById('chat-body');
  body.innerHTML = '<div class="chat-container" id="chat-messages"></div><div class="chat-input-area" id="chat-input-area"><div class="chat-quick-questions" id="chat-quick"></div><div class="chat-input-row"><input type="text" class="chat-text-input" id="chat-input" placeholder="输入你想问的问题..." maxlength="200"><button class="chat-send-btn" onclick="sendUserMessage()">发送</button></div></div>';
  document.getElementById('chat-overlay').classList.add('active');

  // Show quick questions immediately
  showQuickQuestions();

  // Start sending lessons
  sendNextLesson();
}

function sendNextLesson() {
  const stall = stalls.find(s => s.id === chatStallId);
  if (!stall || !stall.lessons || chatLessonIndex >= stall.lessons.length) {
    // All lessons sent, show material then enter free chat
    if (stall && stall.material) {
      showMaterial(stall);
      setTimeout(() => enterFreeChat(), 1500);
    } else {
      enterFreeChat();
    }
    return;
  }

  // Show typing indicator
  const container = document.getElementById('chat-messages');
  if (!container) return;
  const typing = document.createElement('div');
  typing.className = 'typing-indicator';
  typing.id = 'typing';
  typing.innerHTML = '<span>●</span><span>●</span><span>●</span>';
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;

  chatTimer = setTimeout(() => {
    const t = document.getElementById('typing');
    if (t) t.remove();

    const msg = stall.lessons[chatLessonIndex];
    addChatMessage(msg, 'stall');
    chatLessonIndex++;

    // Show reply options after each lesson
    if (chatLessonIndex < stall.lessons.length) {
      showReplyOptions(['明白了！', '能再详细说说吗？', '👍']);
    } else {
      // Last lesson - clicking reply will trigger sendNextLesson which shows material + free chat
      showReplyOptions(['太棒了，谢谢！', '学到了很多！']);
    }
  }, 1500);
}

function addChatMessage(text, type) {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  const div = document.createElement('div');
  div.className = 'chat-msg ' + type;
  div.textContent = text;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  chatMessages.push({ text, type, time: Date.now() });
}

function showReplyOptions(options) {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  const optDiv = document.createElement('div');
  optDiv.className = 'chat-options';
  optDiv.id = 'chat-options';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'chat-opt-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      addChatMessage(opt, 'user');
      const od = document.getElementById('chat-options');
      if (od) od.remove();
      setTimeout(() => sendNextLesson(), 800);
    };
    optDiv.appendChild(btn);
  });
  container.appendChild(optDiv);
  container.scrollTop = container.scrollHeight;
}

function enterFreeChat() {
  addChatMessage('🎯 教学完成！你可以继续输入问题和我交流，也可以保存上面的学习材料。', 'system');

  showQuickQuestions();

  setTimeout(() => {
    const input = document.getElementById('chat-input');
    if (input) input.focus();
  }, 300);
}

function showQuickQuestions() {
  const stall = stalls.find(s => s.id === chatStallId);
  if (!stall || !stall.quickQuestions) return;

  const quickDiv = document.getElementById('chat-quick');
  if (!quickDiv) return;
  quickDiv.innerHTML = '';

  stall.quickQuestions.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'chat-quick-q';
    btn.textContent = q;
    btn.onclick = () => {
      document.getElementById('chat-input').value = q;
      sendUserMessage();
    };
    quickDiv.appendChild(btn);
  });
}

function sendUserMessage() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  addChatMessage(text, 'user');

  // Remove old quick questions
  const quickDiv = document.getElementById('chat-quick');
  if (quickDiv) quickDiv.innerHTML = '';

  // Show typing
  const container = document.getElementById('chat-messages');
  if (!container) return;
  const typing = document.createElement('div');
  typing.className = 'typing-indicator';
  typing.id = 'typing';
  typing.innerHTML = '<span>●</span><span>●</span><span>●</span>';
  container.appendChild(typing);
  container.scrollTop = container.scrollHeight;

  // Generate reply
  setTimeout(async () => {
    const t = document.getElementById('typing');
    if (t) t.remove();
    const reply = await generateReplyAsync(text);
    addChatMessage(reply, 'stall');
    showQuickQuestions();
  }, 1000 + Math.random() * 1000);
}

function generateReply(userText) {
  const stall = stalls.find(s => s.id === chatStallId);
  if (!stall) return '抱歉，我暂时无法回答这个问题。';

  // Use autoReplies (new) or knowledgeBase (legacy)
  const kb = stall.autoReplies || stall.knowledgeBase;
  if (!kb) return '好问题！你可以问我任何关于这个技能的问题。';

  const text = userText.toLowerCase();

  // Try to match keywords
  for (const entry of kb) {
    if (entry.keywords.length === 0) continue; // Skip default
    if (entry.keywords.some(kw => text.includes(kw))) {
      return entry.reply;
    }
  }

  // Fallback
  const fallback = kb.find(e => e.keywords.length === 0);
  return fallback ? fallback.reply : '这是个好问题！如果有更具体的问题，请告诉我，我会详细回答。';
}

async function generateReplyAsync(userText) {
  const stall = stalls.find(s => s.id === chatStallId);
  if (!stall) return '抱歉，出了点问题。';

  // Build system prompt: prefer agentPrompt (from distill), fallback to basic info
  const systemPrompt = stall.agentPrompt ||
    ('你是' + stall.owner + '，你的技能是：' + stall.skill + '。你的交付方式：' + stall.example + '。请用友好、专业的语气回答用户的问题，回答要具体有用，包含实际可操作的建议。回复控制在100字以内。');

  // Check if global AI model is configured
  if (globalAiConfig.apiUrl && globalAiConfig.apiKey) {
    try {
      const response = await fetch(globalAiConfig.apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + globalAiConfig.apiKey
        },
        body: JSON.stringify({
          model: globalAiConfig.model || 'gpt-3.5-turbo',
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: userText }
          ],
          max_tokens: 300
        })
      });
      const data = await response.json();
      if (data.choices && data.choices[0]) {
        return data.choices[0].message.content;
      }
    } catch(e) {
      // Fallback to local matching
    }
  }

  // Local keyword matching fallback
  return generateReply(userText);
}

// Allow Enter key to send
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'chat-input') {
    e.preventDefault();
    sendUserMessage();
  }
});

function showMaterial(stall) {
  const container = document.getElementById('chat-messages');
  if (!container) return;

  addChatMessage('📦 以上就是我的教学方法！这是配套的学习材料：', 'system');

  // Auto-generate material if not present
  const mat = stall.material || { title: stall.name + ' · 学习笔记', desc: stall.example || stall.skill, icon: '📝' };
  const matDiv = document.createElement('div');
  matDiv.className = 'material-card';
  matDiv.innerHTML = `
    <div class="mat-icon">${mat.icon}</div>
    <div class="mat-title">${mat.title}</div>
    <div class="mat-desc">${mat.desc}</div>
    <div class="mat-source">来自：${stall.owner} · ${stall.name}</div>
    <button class="btn btn-primary" style="margin-top:8px;font-size:13px;padding:8px" onclick="saveMaterial('${stall.id}')">📥 保存到我的技能卡</button>
  `;
  container.appendChild(matDiv);
  container.scrollTop = container.scrollHeight;
}

function saveMaterial(stallId) {
  const stall = stalls.find(s => s.id === stallId);
  if (!stall || !stall.material) return;

  // Check if already saved
  if (myMaterials.find(m => m.stallId === stallId)) {
    showToast('这份材料已经保存过了');
    return;
  }

  myMaterials.push({
    stallId: stallId,
    stallName: stall.name,
    owner: stall.owner,
    ...stall.material,
    savedAt: Date.now()
  });

  showToast('📚 材料已保存到技能卡！');
  updateSkillBadge();
}

function closeChat() {
  if (chatTimer) clearTimeout(chatTimer);
  document.getElementById('chat-overlay').classList.remove('active');
}

// ==================== MY ORDERS ====================
function openOrders() {
  const body = document.getElementById('orders-body');
  
  if (orders.length === 0) {
    body.innerHTML = '<p style="color:#584824;text-align:center;padding:30px">暂无订单记录。去逛逛小镇，找感兴趣的摊主下单吧！</p>';
  } else {
    let html = '';
    orders.forEach(o => {
      const stall = stalls.find(s => s.id === o.stallId);
      const isActive = o.status === 'in_progress';
      const statusText = isActive ? '进行中' : '已完成';
      const statusClass = isActive ? 'oi-active' : 'oi-done';
      const time = new Date(o.createdAt).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
      
      html += `<div class="order-item">
        <div class="oi-left">
          <div class="oi-name">${stall ? stall.name : '未知摊位'}</div>
          <div class="oi-detail">¥${o.amount} · ${time}</div>
        </div>
        <div>
          <span class="oi-status ${statusClass}">${statusText}</span>
          ${isActive ? `<br><button class="top-btn" style="margin-top:6px;font-size:11px" onclick="closeOrders();openChat('${o.stallId}')">💬 继续学习</button>` : ''}
        </div>
      </div>`;
    });
    body.innerHTML = html;
  }
  
  document.getElementById('orders-overlay').classList.add('active');
}

function closeOrders() {
  document.getElementById('orders-overlay').classList.remove('active');
}

// ==================== MY STALL ====================
function openMyStall() {
  const stall = stalls.find(s => s.isMine);
  if (!stall) {
    showToast('你还没有开摊，去找一块空摊提炼你的能力吧！');
    return;
  }
  
  document.getElementById('mystall-owner').textContent = stall.name;
  const body = document.getElementById('mystall-body');
  
  const totalIncome = orders.filter(o => o.stallId === stall.id).reduce((s,o) => s + o.amount, 0);
  const totalComm = orders.filter(o => o.stallId === stall.id).reduce((s,o) => s + o.commission, 0);
  
  let html = `
    <div class="skill-pitch">💡 ${stall.skill}</div>
    <div class="stats-row">
      <div class="stat-card"><div class="num">¥${stall.price}</div><div class="label">定价</div></div>
      <div class="stat-card"><div class="num">${stall.deals}</div><div class="label">成交数</div></div>
      <div class="stat-card"><div class="num">${stall.rating.toFixed(1)}</div><div class="label">评分</div></div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="num">¥${totalIncome}</div><div class="label">总收入</div></div>
      <div class="stat-card"><div class="num">${stall.status === 'open' ? '营业中' : '休息中'}</div><div class="label">状态</div></div>
    </div>
  `;
  
  if (stall.reviews.length > 0) {
    html += '<div class="section-title">💬 收到的评价</div>';
    stall.reviews.forEach(r => {
      let stars = '';
      for (let i = 0; i < 5; i++) stars += i < r.rating ? '★' : '☆';
      html += `<div class="review-item">
        <div class="r-head"><span class="r-user">${r.user}</span><span class="stars" style="font-size:12px">${stars}</span></div>
        <div class="r-text">${r.text}</div>
      </div>`;
    });
  }
  
  html += `<button class="btn ${stall.status === 'open' ? 'btn-secondary' : 'btn-primary'}" onclick="toggleMyStall()">${stall.status === 'open' ? '😴 休息一下' : '🟢 开始营业'}</button>`;
  
  body.innerHTML = html;
  document.getElementById('mystall-overlay').classList.add('active');
}

function toggleMyStall() {
  const stall = stalls.find(s => s.isMine);
  if (!stall) return;
  stall.status = stall.status === 'open' ? 'closed' : 'open';
  openMyStall(); // Refresh
  showToast(stall.status === 'open' ? '摊位已开始营业！' : '摊位已休息');
}

function closeMyStall() {
  document.getElementById('mystall-overlay').classList.remove('active');
}

// ==================== SKILL CARDS ====================
let globalAiConfig = { apiUrl: '', apiKey: '', model: '' };
let myMaterials = [];

function openSkills() {
  const body = document.getElementById('skills-body');
  const totalAvailable = stalls.filter(s => s.material).length;
  document.getElementById('skills-subtitle').textContent = `已收集 ${myMaterials.length}/${totalAvailable} 份学习材料`;
  
  if (myMaterials.length === 0) {
    body.innerHTML = '<p style="color:#584824;text-align:center;padding:30px">还没有收集到学习材料。<br>下单后跟摊主学习，他们会把材料发给你！</p>';
  } else {
    let html = '';
    myMaterials.forEach(m => {
      html += `<div class="skill-item">
        <div class="si-icon">${m.icon}</div>
        <div class="si-info">
          <div class="si-title">${m.title}</div>
          <div class="si-source">来自：${m.owner} · ${m.stallName}</div>
          <div class="si-desc">${m.desc}</div>
        </div>
      </div>`;
    });
    body.innerHTML = html;
  }
  
  document.getElementById('skills-overlay').classList.add('active');
}

function closeSkills() {
  document.getElementById('skills-overlay').classList.remove('active');
}

// ==================== SETTINGS ====================
let hideOtherPlayers = false;

function openSettings() {
  const body = document.getElementById('ai-body');
  const c = globalAiConfig;
  const isConfigured = c.apiUrl && c.apiKey;
  
  body.innerHTML = `
    <div style="margin-bottom:16px">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px">👥 玩家显示</div>
      <div style="display:flex;align-items:center;justify-content:space-between;background:#F5E6C8;border:2px solid #8B6F47;border-radius:3px;padding:12px">
        <div>
          <div style="font-size:13px;font-weight:600">隐藏其他玩家</div>
          <div style="font-size:11px;color:#584824">开启后，小镇上的 NPC 和动物将不会显示</div>
        </div>
        <label style="position:relative;display:inline-block;width:44px;height:24px;cursor:pointer">
          <input type="checkbox" id="hide-players-toggle" ${hideOtherPlayers?'checked':''} onchange="toggleHidePlayers(this.checked)" style="opacity:0;width:0;height:0">
          <span style="position:absolute;inset:0;background:${hideOtherPlayers?'#6BBF00':'#787878'};border:2px solid #5C3B1E;border-radius:12px;transition:0.3s"></span>
          <span style="position:absolute;left:${hideOtherPlayers?'22px':'3px'};top:3px;width:18px;height:18px;background:#F5E6C8;border-radius:50%;transition:0.3s"></span>
        </label>
      </div>
    </div>
    <div style="border-top:2px solid #5C3B1E;padding-top:16px">
      <div style="font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px">🤖 AI 模型配置</div>
      <div class="callout" style="background:#F5E6C8;border-left-color:${isConfigured?'#6BBF00':'#E8944A'}">
        <div class="callout-title">${isConfigured?'✅ 模型已配置':'⚠️ 模型未配置'}</div>
        <p>${isConfigured?'当前模型：'+(c.model||'默认')+' · '+c.apiUrl.substring(0,30)+'...' : '配置后，买家与你的摊位交流时会使用你的 AI 模型来生成回复。不配置也能正常使用内置关键词回复。'}</p>
      </div>
      <div style="background:#F5E6C8;border:2px solid #8B6F47;border-radius:3px;padding:16px;margin-top:12px">
        <div class="field">
          <div class="field-label">API 地址</div>
          <input type="text" id="ai-url" placeholder="https://api.openai.com/v1/chat/completions" value="${c.apiUrl}" style="width:100%;border:2px solid #5C3B1E;border-radius:3px;padding:10px;font-size:13px;margin-top:6px;box-sizing:border-box;background:#F5E6C8;color:#2D1F12">
          <p style="font-size:11px;color:#584824;margin-top:4px">支持 OpenAI、Claude、通义千问、本地 Ollama 等</p>
        </div>
        <div class="field" style="margin-top:12px">
          <div class="field-label">API Key</div>
          <input type="password" id="ai-key" placeholder="sk-..." value="${c.apiKey}" style="width:100%;border:2px solid #5C3B1E;border-radius:3px;padding:10px;font-size:13px;margin-top:6px;box-sizing:border-box;background:#F5E6C8;color:#2D1F12">
        </div>
        <div class="field" style="margin-top:12px">
          <div class="field-label">模型名称</div>
          <input type="text" id="ai-model" placeholder="gpt-3.5-turbo / claude-3-haiku / qwen-turbo" value="${c.model}" style="width:100%;border:2px solid #5C3B1E;border-radius:3px;padding:10px;font-size:13px;margin-top:6px;box-sizing:border-box;background:#F5E6C8;color:#2D1F12">
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-primary" onclick="saveAiSettings()">💾 保存模型设置</button>
        ${isConfigured ? '<button class="btn btn-close" onclick="clearAiSettings()">🗑️ 清除配置</button>' : ''}
      </div>
    </div>
  `;
  document.getElementById('ai-overlay').classList.add('active');
}

function toggleHidePlayers(hidden) {
  hideOtherPlayers = hidden;
  showToast(hidden ? '👻 已隐藏其他玩家' : '👥 已显示其他玩家');
}

function closeSettings() {
  document.getElementById('ai-overlay').classList.remove('active');
}

// Keep alias for backward compatibility
function closeAiSettings() {
  closeSettings();
}

function openAiSettings() {
  openSettings();
}

function saveAiSettings() {
  globalAiConfig.apiUrl = document.getElementById('ai-url').value.trim();
  globalAiConfig.apiKey = document.getElementById('ai-key').value.trim();
  globalAiConfig.model = document.getElementById('ai-model').value.trim();
  
  if (globalAiConfig.apiUrl && globalAiConfig.apiKey) {
    showToast('✅ 模型配置已保存！');
  } else {
    showToast('⚠️ 配置不完整，请填写 API 地址和 Key');
    return;
  }
  openSettings(); // Refresh
}

function clearAiSettings() {
  globalAiConfig = { apiUrl: '', apiKey: '', model: '' };
  showToast('🗑️ 模型配置已清除');
  openSettings(); // Refresh
}

function updateSkillBadge() {
  const badge = document.getElementById('skill-badge');
  if (badge) badge.textContent = myMaterials.length;
}

// ==================== CLOSE OVERLAYS ON BACKDROP CLICK ====================
document.querySelectorAll('.overlay').forEach(ov => {
  ov.addEventListener('click', e => {
    if (e.target === ov) ov.classList.remove('active');
  });
});

// ==================== START GAME ====================
gameLoop();
</script>
</body>
</html>
