<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>萤火镇 Firefly Town — Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;font-family:'Pixelify Sans','Press Start 2P',monospace;color:#E0D8B4;overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center}
#top-bar{width:100%;max-width:1200px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:8px 16px;background:linear-gradient(#4A3520,#2D1F12);border-bottom:3px solid #5C3B1E;gap:8px;z-index:10;text-shadow:1px 1px 0 #2D1F12}
.stat{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:#E0D8B4}
.stat .icon{font-size:18px}
.stat .val{color:#FFD700}
#hint{font-size:12px;color:#E0D8B4;padding:4px 8px;background:rgba(0,0,0,0.3);border-radius:3px;border:1px solid #5C3B1E}
#game-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative;overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #5C3B1E;border-radius:2px;cursor:default}
/* Overlay panels */
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:100;align-items:center;justify-content:center}
.overlay.active{display:flex}
.panel{background:linear-gradient(135deg,#C6A878,#B89A6A);color:#E0D8B4;border:3px solid #5C3B1E;border-radius:4px;max-width:520px;width:92%;max-height:86vh;overflow-y:auto;padding:0;box-shadow:0 4px 16px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.15);position:relative}
.panel::-webkit-scrollbar{width:8px}
.panel::-webkit-scrollbar-thumb{background:#8B6F47;border-radius:3px}
.panel-header{background:linear-gradient(#4A3520,#2D1F12);color:#E0D8B4;padding:16px 20px;border-radius:4px 4px 0 0;position:sticky;top:0;z-index:1;border-bottom:3px solid #5C3B1E;text-shadow:1px 1px 0 #2D1F12}
.panel-header h2{font-size:18px;margin-bottom:4px;color:#E0D8B4}
.panel-header .owner{font-size:13px;color:#E0D8B4;opacity:0.9}
.panel-body{padding:16px 20px 20px}
.panel-close{position:absolute;top:12px;right:16px;background:#8B6F47;border:2px solid #5C3B1E;color:#E0D8B4;width:28px;height:28px;border-radius:3px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel-close:hover{background:#A0855B}
.skill-pitch{font-size:15px;font-weight:700;color:#2D1F12;margin:12px 0 8px;padding:10px 14px;background:#F5E6C8;border-radius:3px;border-left:4px solid #6BBF00}
.stats-row{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}
.stat-card{flex:1;min-width:80px;background:#F5E6C8;border:2px solid #8B6F47;border-radius:3px;padding:10px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.stat-card .num{font-size:22px;font-weight:800;color:#C43C3C}
.stat-card .label{font-size:11px;color:#584824;margin-top:2px}
.stars{color:#FFD700;font-size:14px;letter-spacing:1px}
.section-title{font-size:14px;font-weight:700;color:#2D1F12;margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid #8B6F47}
.example-box{background:#F5E6C8;border-radius:3px;padding:12px;font-size:13px;line-height:1.6;color:#2D1F12;border:1px solid #8B6F47}
.review-item{background:#F5E6C8;border:2px solid #8B6F47;border-radius:3px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.review-item .r-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.review-item .r-user{font-weight:700;font-size:13px;color:#2D1F12}
.review-item .r-text{font-size:13px;color:#584824;line-height:1.5}
.price-tag{font-size:24px;font-weight:800;color:#C43C3C;margin:12px 0}
.status-badge{display:inline-block;padding:4px 12px;border-radius:3px;font-size:12px;font-weight:700;margin:8px 0;border:1px solid #5C3B1E}
.status-open{background:#6BBF00;color:#fff}
.status-busy{background:#E8944A;color:#fff}
.status-empty{background:#787878;color:#E0D8B4}
.btn{display:block;width:100%;padding:12px;border:2px solid #5C3B1E;border-radius:3px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:background 0.2s;text-shadow:1px 1px 0 rgba(0,0,0,0.3)}
.btn-primary{background:#6BBF00;border-color:#2D5A00;color:#fff}
.btn-primary:hover{background:#7FD100}
.btn-primary:disabled{background:#787878;border-color:#5C3B1E;color:#E0D8B4;cursor:not-allowed}
.btn-warn{background:#E8944A;border-color:#8B4513;color:#fff}
.btn-warn:hover{background:#F0A55C}
.btn-secondary{background:#8B6F47;color:#E0D8B4}
.btn-secondary:hover{background:#A0855B}
.btn-close{background:#8B6F47;color:#E0D8B4;margin-top:8px}
.btn-close:hover{background:#A0855B}
.anti-monopoly-note{background:#F5E6C8;border:1px solid #8B6F47;border-radius:3px;padding:10px 12px;font-size:12px;color:#C43C3C;margin-top:8px;line-height:1.5}
.callout{border:2px solid #8B6F47;border-left:4px solid #6BBF00;border-radius:3px;padding:10px 12px;margin:8px 0}
.callout-title{font-weight:700;font-size:13px;color:#2D1F12;margin-bottom:4px}
.callout p{font-size:12px;color:#584824;line-height:1.5}
/* Distill wizard */
.distill-step{margin-bottom:16px}
.distill-step label{display:block;font-size:13px;font-weight:700;color:#2D1F12;margin-bottom:6px}
.distill-step textarea{width:100%;height:100px;border:2px solid #5C3B1E;border-radius:3px;padding:10px;font-size:14px;resize:vertical;font-family:inherit;background:#F5E6C8;color:#2D1F12}
.distill-step textarea:focus{outline:none;border-color:#6BBF00}
.distill-loading{text-align:center;padding:30px;color:#E0D8B4}
.distill-loading .spinner{display:inline-block;width:40px;height:40px;border:4px solid #8B6F47;border-top-color:#6BBF00;border-radius:50%;animation:spin 0.8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.distill-result{background:#F5E6C8;border:2px solid #8B6F47;border-radius:3px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,0.2)}
.distill-result h4{color:#2D5A00;margin-bottom:8px}
.distill-result .field{margin-bottom:8px}
.distill-result .field-label{font-size:12px;color:#584824;font-weight:600}
.distill-result .field-value{font-size:14px;color:#2D1F12}
/* Review modal */
.star-select{display:flex;gap:8px;margin:10px 0}
.star-select .star-btn{font-size:28px;background:none;border:none;cursor:pointer;color:#787878;transition:color 0.15s}
.star-select .star-btn.active{color:#FFD700}
.star-select .star-btn:hover{color:#FFD700}
.review-textarea{width:100%;height:60px;border:2px solid #5C3B1E;border-radius:3px;padding:10px;font-size:14px;resize:none;font-family:inherit;background:#F5E6C8;color:#2D1F12}
.review-textarea:focus{outline:none;border-color:#6BBF00}
/* Toast */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#3D2B1A;border:2px solid #5C3B1E;border-radius:3px;color:#E0D8B4;padding:10px 24px;font-size:14px;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
/* DPad */
#dpad{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50}
.dpad-grid{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:4px}
.dpad-btn{background:rgba(60,40,20,0.6);border:2px solid #5C3B1E;border-radius:3px;color:#E0D8B4;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.dpad-btn:active{background:rgba(139,111,71,0.85)}
.dpad-btn.empty{background:transparent;border:none}
.dpad-center{font-size:12px;font-weight:700}
@media(hover:none)and(pointer:coarse){#dpad{display:block}}
@media(max-width:600px){.panel{max-width:96%}.panel-header{padding:12px 16px}.panel-body{padding:12px 16px 16px}}
/* Top bar buttons */
.top-btn{background:#8B6F47;border:2px solid #5C3B1E;color:#E0D8B4;padding:4px 10px;border-radius:3px;font-size:12px;cursor:pointer;transition:background 0.2s;white-space:nowrap;text-shadow:1px 1px 0 #2D1F12}
.top-btn:hover{background:#A0855B}
.top-btn .badge{background:#5C3B1E;color:#FFD700;font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px}
/* Chat styles */
.chat-container{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto;padding:4px 0}
.chat-container::-webkit-scrollbar{width:6px}
.chat-container::-webkit-scrollbar-thumb{background:#8B6F47;border-radius:3px}
.chat-msg{max-width:85%;padding:10px 14px;border-radius:3px;font-size:13px;line-height:1.6;word-break:break-word}
.chat-msg.stall{background:#C6A878;color:#2D1F12;align-self:flex-start;border:2px solid #5C3B1E}

.chat-opt-btn:hover{background:#8B6F47;color:#E0D8B4}

/* Material card */

.material-card .mat-icon{font-size:28px;margin-bottom:6px}

.material-card .mat-desc{font-size:12px;color:#584824;line-height:1.5;margin-bottom:8px}
.material-card .mat-source{font-size:11px;color:#584824}

.order-item .oi-left{flex:1}
.order-item .oi-name{font-weight:700;font-size:14px;color:#2D1F12}
.order-item .oi-detail{font-size:12px;color:#584824;margin-top:2px}
.order-item .oi-status{font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;border:1px solid #5C3B1E}
.oi-active{background:#E8944A;color:#fff}
.oi-done{background:#6BBF00;color:#fff}
/* Skill card item */
.skill-item{background:#F5E6C8;border:2px solid #8B6F47;border-radius:3px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,0.2);display:flex;gap:12px;align-items:flex-start}
.skill-item .si-icon{font-size:28px;flex-shrink:0}
.skill-item .si-info{flex:1}
.skill-item .si-title{font-weight:700;font-size:14px;color:#2D1F12}
.skill-item .si-source{font-size:11px;color:#584824;margin-top:2px}
.skill-item .si-desc{font-size:12px;color:#584824;margin-top:4px;line-height:1.4}
/* Chat input area */
.chat-input-area{border-top:2px solid #5C3B1E;padding:10px 0 0;margin-top:10px;background:#B89A6A;border-radius:0 0 3px 3px}
.chat-input-row{display:flex;gap:8px}
.chat-text-input{flex:1;border:2px solid #5C3B1E;border-radius:3px;padding:8px 14px;font-size:13px;outline:none;font-family:inherit;transition:border-color 0.2s;background:#F5E6C8;color:#2D1F12}
.chat-text-input:focus{border-color:#6BBF00}
.chat-send-btn{background:#6BBF00;border:2px solid #2D5A00;color:#fff;border-radius:3px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:700;white-space:nowrap}
.chat-send-btn:hover{background:#7FD100}
.chat-quick-questions{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chat-quick-q{background:#F5E6C8;border:2px solid #8B6F47;color:#2D1F12;padding:4px 10px;border-radius:3px;font-size:11px;cursor:pointer;transition:background 0.15s}
.chat-quick-q:hover{background:#8B6F47;color:#E0D8B4}
.chat-phase-tag{display:inline-block;background:#E8944A;color:#fff;font-size:11px;padding:2px 8px;border-radius:3px;border:1px solid #8B4513;margin-bottom:8px}
/* Category option */
.cat-option{transition:background 0.15s}
.cat-option:hover{border-color:#6BBF00 !important;background:#F5E6C8 !important}
.cat-option.selected{border-color:#6BBF00 !important;background:#F5E6C8 !important}
</style>
</head>

<script>
// ==================== GAME CONFIG ====================
const TILE = 48;
const COLS = 24;
const ROWS = 14;
const MAP_W = COLS * TILE;
const MAP_H = ROWS * TILE;
const PLAYER_SPEED = 3;
const INTERACT_DIST = 60;

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Camera follows player
const camera = { x: 0, y: 0, viewW: 0, viewH: 0 };

function resizeCanvas() {
  const wrap = document.getElementById('game-wrap');
  const maxW = wrap.clientWidth - 20;
  const maxH = wrap.clientHeight - 20;
  // Fit entire map in viewport
  const scale = Math.min(maxW / MAP_W, maxH / MAP_H, 1.5);
  canvas.width = MAP_W;
  canvas.height = MAP_H;
  canvas.style.width = Math.floor(MAP_W * scale) + 'px';
  canvas.style.height = Math.floor(MAP_H * scale) + 'px';
  camera.viewW = MAP_W;
  camera.viewH = MAP_H;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function updateCamera() {
  // Center camera on player, clamp to map bounds
  let cx = player.x - camera.viewW / 2;
  let cy = player.y - camera.viewH / 2;
  cx = Math.max(0, Math.min(cx, MAP_W - camera.viewW));
  cy = Math.max(0, Math.min(cy, MAP_H - camera.viewH));
  camera.x = cx;
  camera.y = cy;
}

// ==================== MAP DATA ====================
// 0=grass, 1=dirt, 2=flower, 3=tree, 4=fence, 5=stall
const mapData = [];
for (let y = 0; y < ROWS; y++) {
  mapData[y] = [];
  for (let x = 0; x < COLS; x++) {
    mapData[y][x] = 0;
  }
}

// Paths
for (let x = 0; x < COLS; x++) { mapData[6][x] = 1; mapData[7][x] = 1; }
for (let y = 0; y < ROWS; y++) { mapData[y][11] = 1; mapData[y][12] = 1; }

// Flowers (avoid stall areas)

function isBlocked(px, py) {
  const tx = Math.floor(px / TILE);
  const ty = Math.floor(py / TILE);
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return true;
  const t = mapData[ty][tx];
  return t === 3 || t === 4 || t === 5; // tree, fence, stall
}

function canMove(nx, ny) {
  const hw = 10, hh = 6;
  return !isBlocked(nx - hw, ny - hh) && !isBlocked(nx + hw, ny - hh) &&
         !isBlocked(nx - hw, ny + hh) && !isBlocked(nx + hw, ny + hh);
}

function drawGrass(x, y) {
  const px = Math.floor(x), py = Math.floor(y);
  // Pseudo-random hash based on coordinates (no checkerboard pattern)
  const hash = ((px * 374761393 + py * 668265263) >>> 0) % 1000;
  const hash2 = ((px * 1274126177 + py * 982451653) >>> 0) % 1000;
  const hash3 = ((px * 2147483647 + py * 3163421) >>> 0) % 1000;

  // Base grass - wider color variety, hash-based selection (no grid pattern)
  const baseColors = ['#5B8C3E','#6FA34A','#7DB85A','#5E9040','#6BA048','#548535','#72A84E','#689E44','#60963C','#78B255'];
  ctx.fillStyle = baseColors[hash % baseColors.length];
  ctx.fillRect(px, py, TILE, TILE);

  // Subtle color variation patches - irregular placement
  const patchColors = ['#7DB85A','#8CC764','#6FA34A','#74AD50','#82BF5C'];
  for (let i = 0; i < 3; i++) {
    const gx = px + (hash2 * (i + 1) * 7) % 36 + 2;
    const gy = py + (hash3 * (i + 1) * 11) % 32 + 2;
    const pw = 3 + (hash % 5);
    const ph = 2 + (hash2 % 4);
    ctx.fillStyle = patchColors[(hash + i * 3) % patchColors.length];
    ctx.fillRect(gx, gy, pw, ph);
  }

  // Irregular grass blades - varied heights and directions
  const bladeColors = ['#4A7A30','#5B8C3E','#3D6B28','#4E8535','#558C38'];
  for (let i = 0; i < 7; i++) {
    const gx = px + ((hash * (i + 1) * 13 + hash2 * i) % 40);
    const gy = py + ((hash2 * (i + 1) * 17 + hash3 * i) % 36);
    const bh = 3 + (hash3 + i * 7) % 6; // varied height 3-8
    ctx.fillStyle = bladeColors[(hash + i * 5) % bladeColors.length];
    ctx.fillRect(gx, gy, 1, bh);
    // Companion blade at slight offset
    if (i % 2 === 0) {
      ctx.fillRect(gx + 2, gy + 1, 1, bh - 1);
    }
    // Small tuft top (lighter)
    ctx.fillStyle = '#8CC764';
    ctx.fillRect(gx - 1, gy, 1, 2);
    if (i % 3 === 0) {
      ctx.fillRect(gx + 3, gy, 1, 2);
    }
  }

  // Extra lighter grass blades
  for (let i = 0; i < 4; i++) {
    const gx = px + ((hash3 * (i + 2) * 19 + hash * i) % 38);
    const gy = py + ((hash * (i + 2) * 23 + hash2 * i) % 32);
    const bh = 2 + (hash2 + i * 3) % 5;
    ctx.fillStyle = i % 2 === 0 ? '#8CC764' : '#94CF6E';
    ctx.fillRect(gx, gy, 1, bh);
    if (i % 2 === 0) {
      ctx.fillRect(gx + 3, gy + 1, 1, bh - 1);
    }
  }

  // Random small pebbles (2-3px gray dots)
  if (hash % 6 === 0) {
    const sx = px + (hash2 % 34) + 4;
    const sy = py + (hash3 % 30) + 6;
    ctx.fillStyle = '#B8A88A';
    ctx.fillRect(sx, sy, 2, 2);
    ctx.fillStyle = '#A89878';
    ctx.fillRect(sx + 1, sy + 1, 1, 1);
  }
  if (hash2 % 11 === 0) {
    const sx = px + (hash % 32) + 6;
    const sy = py + (hash3 % 28) + 8;
    ctx.fillStyle = '#C0B090';
    ctx.fillRect(sx, sy, 3, 2);
    ctx.fillStyle = '#B0A080';
    ctx.fillRect(sx + 1, sy, 1, 1);
  }

  // Dark grass cluster tufts (3-4px deep green blocks)
  if (hash3 % 8 === 0) {
    const cx = px + (hash % 32) + 4;
    const cy = py + (hash2 % 28) + 4;
    ctx.fillStyle = '#3D6B28';
    ctx.fillRect(cx, cy, 3, 3);
    ctx.fillStyle = '#4A7A30';
    ctx.fillRect(cx + 1, cy - 1, 1, 1);
    ctx.fillRect(cx + 3, cy + 1, 1, 1);
  }
  if (hash % 13 === 0) {
    const cx = px + (hash3 % 30) + 6;
    const cy = py + (hash2 % 26) + 6;
    ctx.fillStyle = '#356025';
    ctx.fillRect(cx, cy, 4, 2);
    ctx.fillStyle = '#3D6B28';
    ctx.fillRect(cx, cy - 1, 2, 1);
  }

  // Tiny clover patches (kept but with hash-based placement)
  if (hash2 % 12 === 0) {
    const cx = px + (hash % 34) + 4;
    const cy = py + (hash3 % 28) + 6;
    ctx.fillStyle = '#4A8C2A';
    ctx.fillRect(cx, cy, 2, 1);
    ctx.fillRect(cx - 1, cy + 1, 1, 1);
    ctx.fillRect(cx + 2, cy + 1, 1, 1);
    ctx.fillRect(cx, cy + 2, 2, 1);

}

  // Darker dirt texture spots - more irregular
  const darkColors = ['#B89A5C','#A88E50','#B09058','#A49050'];
  for (let i = 0; i < 6; i++) {
    const dx = px + (hash * (i + 1) * 11 + hash2 * i) % 38;
    const dy = py + (hash2 * (i + 1) * 13 + hash3 * i) % 34;
    const pw = 2 + (hash3 + i) % 4;
    const ph = 1 + (hash + i * 2) % 3;
    ctx.fillStyle = darkColors[(hash2 + i * 3) % darkColors.length];
    ctx.fillRect(dx, dy, pw, ph);
  }

  // Small gravel/pebbles - more varied sizes
  for (let i = 0; i < 4; i++) {
    const dx = px + (hash3 * (i + 2) * 13 + hash * i) % 36 + 2;
    const dy = py + (hash * (i + 2) * 7 + hash2 * i) % 32 + 2;
    ctx.fillStyle = i % 2 === 0 ? '#A89060' : '#B09868';
    ctx.fillRect(dx, dy, 2, 2);
    ctx.fillStyle = '#B8A070';
    ctx.fillRect(dx + 1, dy, 1, 1);
  }
  // Larger pebbles occasionally
  if (hash % 5 === 0) {
    const dx = px + (hash2 % 30) + 4;
    const dy = py + (hash3 % 26) + 6;
    ctx.fillStyle = '#A08858';
    ctx.fillRect(dx, dy, 3, 3);
    ctx.fillStyle = '#B8A070';
    ctx.fillRect(dx, dy, 2, 1);
    ctx.fillStyle = '#907848';
    ctx.fillRect(dx + 2, dy + 2, 1, 1);
  }

  // Footprint impressions (subtle)
  if (hash2 % 9 === 0) {
    const fx = px + (hash % 28) + 6;
    const fy = py + (hash3 % 26) + 8;
    ctx.fillStyle = '#A88E50';
    ctx.fillRect(fx, fy, 4, 2);
    ctx.fillRect(fx + 1, fy + 2, 2, 2);
    ctx.fillRect(fx + 6, fy, 4, 2);
    ctx.fillRect(fx + 7, fy + 2, 2, 2);
  }

  // Edge grass transition - 1-2px green pixels at tile edges
  // Top edge
  if (hash % 4 === 0) {
    const ex = px + (hash2 % 36);
    ctx.fillStyle = '#7DB85A';
    ctx.fillRect(ex, py, 2, 1);
    ctx.fillStyle = '#6BA048';
    ctx.fillRect(ex + 3, py, 1, 1);
  }
  // Bottom edge
  if (hash2 % 4 === 0) {
    const ex = px + (hash3 % 36);
    ctx.fillStyle = '#7DB85A';
    ctx.fillRect(ex, py + TILE - 1, 2, 1);
    ctx.fillStyle = '#6BA048';
    ctx.fillRect(ex + 4, py + TILE - 1, 1, 1);
  }
  // Left edge
  if (hash3 % 5 === 0) {
    const ey = py + (hash % 32);
    ctx.fillStyle = '#7DB85A';
    ctx.fillRect(px, ey, 1, 2);
    ctx.fillStyle = '#5E9040';
    ctx.fillRect(px, ey + 3, 1, 1);
  }
  // Right edge
  if (hash % 5 === 0) {
    const ey = py + (hash2 % 32);
    ctx.fillStyle = '#7DB85A';
    ctx.fillRect(px + TILE - 1, ey, 1, 2);
    ctx.fillStyle = '#5E9040';
    ctx.fillRect(px + TILE - 1, ey + 4, 1, 1);
  }

  // Crack lines - more varied
  if (hash3 % 10 === 0) {
    const cx = px + (hash % 28) + 4;
    const cy = py + (hash2 % 24) + 4;
    ctx.fillStyle = '#A88E50';
    ctx.fillRect(cx, cy, 5, 1);
    ctx.fillRect(cx + 1, cy + 1, 3, 1);
    ctx.fillRect(cx + 2, cy + 2, 1, 1);
  }
  if (hash % 14 === 0) {
    const cx = px + (hash3 % 26) + 6;
    const cy = py + (hash % 22) + 6;
    ctx.fillStyle = '#9A8648';
    ctx.fillRect(cx, cy, 1, 4);
    ctx.fillRect(cx + 1, cy + 1, 2, 1);
  }
}

function drawFlower(x, y) {
  const px = Math.floor(x), py = Math.floor(y);
  drawGrass(x, y);
  const fx = px + 16 + ((px*3)%16);
  const fy = py + 16 + ((py*5)%16);
  const flowerType = (px + py) % 4;
  // Stem with slight curve
  ctx.fillStyle = '#3D7A20';
  ctx.fillRect(fx+1, fy+4, 2, 10);
  ctx.fillStyle = '#4A8C2A';
  ctx.fillRect(fx, fy+5, 1, 6);
  // Leaves on stem
  ctx.fillStyle = '#4A8C2A';
  ctx.fillRect(fx-2, fy+7, 3, 2);
  ctx.fillRect(fx+3, fy+9, 3, 2);
  ctx.fillStyle = '#5DA832';
  ctx.fillRect(fx-1, fy+6, 2, 1);
  ctx.fillRect(fx+4, fy+8, 2, 1);

  if (flowerType === 0) {
    // Rose-like flower (5 petals in cross pattern)
    const colors = ['#E84060','#D83050','#F05070'];
    ctx.fillStyle = colors[0]; ctx.fillRect(fx-3, fy-1, 3, 3);
    ctx.fillStyle = colors[1]; ctx.fillRect(fx+3, fy-1, 3, 3);
    ctx.fillStyle = colors[0]; ctx.fillRect(fx, fy-4, 3, 3);
    ctx.fillStyle = colors[2]; ctx.fillRect(fx, fy+3, 3, 3);
    // Center
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(fx, fy, 3, 3);
    ctx.fillStyle = '#FFC000';
    ctx.fillRect(fx+1, fy+1, 1, 1);
  } else if (flowerType === 1) {
    // Sunflower (larger, yellow petals)
    const petalC = ['#FFD700','#FFCC00','#FFE030'];
    ctx.fillStyle = petalC[0]; ctx.fillRect(fx-3, fy-1, 3, 3);
    ctx.fillStyle = petalC[1]; ctx.fillRect(fx+3, fy-1, 3, 3);
    ctx.fillStyle = petalC[2]; ctx.fillRect(fx, fy-4, 3, 3);
    ctx.fillStyle = petalC[0]; ctx.fillRect(fx, fy+3, 3, 3);
    ctx.fillStyle = petalC[1]; ctx.fillRect(fx-2, fy-3, 2, 2);
    ctx.fillStyle = petalC[2]; ctx.fillRect(fx+3, fy-3, 2, 2);
    // Dark center
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(fx, fy, 3, 3);
    ctx.fillStyle = '#6B3010';
    ctx.fillRect(fx+1, fy+1, 1, 1);
  } else if (flowerType === 2) {
    // Blue/purple bell flower
    const colors = ['#7B68EE','#6A5ACD','#8B7BFF'];
    ctx.fillStyle = colors[0]; ctx.fillRect(fx-2, fy, 5, 4);
    ctx.fillStyle = colors[1]; ctx.fillRect(fx-1, fy-1, 3, 1);
    ctx.fillStyle = colors[2]; ctx.fillRect(fx-3, fy+1, 2, 2);
    ctx.fillStyle = colors[0]; ctx.fillRect(fx+3, fy+1, 2, 2);
    // Tiny highlight
    ctx.fillStyle = '#B0A0FF';
    ctx.fillRect(fx, fy+1, 1, 1);
  } else {
    // Pink daisy (4 petals + center)
    const colors = ['#FF8FAB','#FF7FA0','#FFA0BB'];
    ctx.fillStyle = colors[0]; ctx.fillRect(fx-3, fy-1, 3, 3);
    ctx.fillStyle = colors[1]; ctx.fillRect(fx+3, fy-1, 3, 3);
    ctx.fillStyle = colors[2]; ctx.fillRect(fx, fy-4, 3, 3);
    ctx.fillStyle = colors[0]; ctx.fillRect(fx, fy+3, 3, 3);
    // Center
    ctx.fillStyle = '#FFF176';
    ctx.fillRect(fx, fy, 3, 3);
    ctx.fillStyle = '#FFEE58';
    ctx.fillRect(fx+1, fy, 1, 1);
  }
}

  ctx.fillRect(px+28, py+40, 5, 4);
  ctx.fillStyle = '#5A3520';
  ctx.fillRect(px+16, py+42, 3, 2);

  ctx.fillRect(px+10, py+34, 28, 6);

  // Irregular bumps on bottom layer
  ctx.fillRect(px, py+14, 3, 6);
  ctx.fillRect(px+43, py+16, 3, 5);
  ctx.fillRect(px+2, py+28, 4, 4);
  ctx.fillRect(px+40, py+26, 4, 4);

  // Layer 2: Medium dark
  ctx.fillStyle = '#3D8B4F';
  ctx.fillRect(px+6, py+8, 36, 22);
  ctx.fillRect(px+8, py+6, 32, 2);
  ctx.fillRect(px+10, py+4, 28, 2);
  // Irregular bumps

  ctx.fillRect(px+14, py, 20, 2);
  // Irregular bumps
  ctx.fillRect(px+8, py+6, 3, 6);
  ctx.fillRect(px+39, py+8, 3, 5);

  // Layer 4: Bright highlight
  ctx.fillStyle = '#5DCB6F';
  ctx.fillRect(px+14, py-2, 20, 14);
  ctx.fillRect(px+16, py-4, 16, 2);
  // Irregular bumps
  ctx.fillRect(px+12, py, 3, 4);
  ctx.fillRect(px+35, py+2, 3, 4);

  // Layer 5: Top highlight spot (smallest, brightest)
  ctx.fillStyle = '#6DDB7F';
  ctx.fillRect(px+18, py-6, 14, 6);
  ctx.fillRect(px+20, py-8, 10, 2);
  // Peak bump

  // Left highlight edge

  ctx.fillRect(px+4, py+14, 4, 8);
  // Right shadow edge

  // Bottom shadow on canopy

  // Leaf detail dots - more varied
  ctx.fillStyle = '#6DDB7F';
  ctx.fillRect(px+12, py+8, 2, 2);
  ctx.fillRect(px+22, py+4, 2, 2);
  ctx.fillRect(px+34, py+12, 2, 2);
  ctx.fillRect(px+16, py-4, 2, 2);

function drawWater(x, y) {
  const px = Math.floor(x), py = Math.floor(y);
  const hash = ((px * 374761393 + py * 668265263) >>> 0) % 1000;
  const hash2 = ((px * 1274126177 + py * 982451653) >>> 0) % 1000;
  // Base water
  const baseColors = ['#3A7CA5','#3474A0','#2E6C98','#3E84AB','#4288B0'];
  ctx.fillStyle = baseColors[hash % baseColors.length];
  ctx.fillRect(px, py, TILE, TILE);
  // Depth gradient (darker bottom)
  ctx.fillStyle = 'rgba(20,50,80,0.25)';
  ctx.fillRect(px, py + TILE - 12, TILE, 12);
  // Lighter ripples
  const rippleColors = ['#5BA0CC','#6BB0DC','#4E94C4'];
  for (let i = 0; i < 4; i++) {
    const rx = px + (hash2 * (i + 1) * 7) % 32 + 2;
    const ry = py + (hash * (i + 1) * 11) % 30 + 2;
    ctx.fillStyle = rippleColors[(hash + i * 3) % rippleColors.length];
    ctx.fillRect(rx, ry, 4 + (hash2 + i) % 5, 1);
  }
  // Sparkle highlights
  for (let i = 0; i < 3; i++) {
    const sx = px + ((hash * (i + 2) * 13) % 36) + 2;
    const sy = py + ((hash2 * (i + 2) * 17) % 32) + 2;
    ctx.fillStyle = '#BFE4F5';
    ctx.fillRect(sx, sy, 1, 1);
    ctx.fillRect(sx + 2, sy, 1, 1);
  }
}

function drawSand(x, y) {
  const px = Math.floor(x), py = Math.floor(y);
  const hash = ((px * 374761393 + py * 668265263) >>> 0) % 1000;
  const hash2 = ((px * 1274126177 + py * 982451653) >>> 0) % 1000;
  const hash3 = ((px * 2147483647 + py * 3163421) >>> 0) % 1000;
  // Base sand
  const baseColors = ['#E8D9A8','#E2D09C','#EEDCAE','#DFCC94','#E6D5A2'];
  ctx.fillStyle = baseColors[hash % baseColors.length];
  ctx.fillRect(px, py, TILE, TILE);
  // Lighter grain patches
  const lightColors = ['#F2E6BC','#F4EAC4','#EFE0B0'];
  for (let i = 0; i < 4; i++) {
    const dx = px + (hash2 * (i + 1) * 7) % 34 + 2;
    const dy = py + (hash3 * (i + 1) * 11) % 30 + 2;
    ctx.fillStyle = lightColors[(hash + i * 3) % lightColors.length];
    ctx.fillRect(dx, dy, 3 + (hash + i) % 4, 2);
  }
  // Darker grain dots
  for (let i = 0; i < 6; i++) {
    const dx = px + ((hash * (i + 2) * 13 + hash2 * i) % 38);
    const dy = py + ((hash2 * (i + 2) * 17 + hash3 * i) % 34);
    ctx.fillStyle = '#C9B888';
    ctx.fillRect(dx, dy, 1, 1);
  }
  // Tiny pebbles
  if (hash3 % 5 === 0) {
    const sx = px + (hash2 % 32) + 4;
    const sy = py + (hash % 28) + 6;
    ctx.fillStyle = '#B8A878';
    ctx.fillRect(sx, sy, 2, 2);
    ctx.fillStyle = '#A89868';
    ctx.fillRect(sx + 1, sy + 1, 1, 1);
  }
}

// ==================== DRAW STALL ====================
function drawStall(s) {
  const x = s.tile.x * TILE;
  const y = s.tile.y * TILE;
  const w = TILE * 2;
  const h = TILE * 2;
  const px = Math.floor(x), py = Math.floor(y);

  if (s.status === 'empty') {
    // Empty stall - bare platform with more detail
    ctx.fillStyle = '#C4A878';
    ctx.fillRect(px+6, py+h-28, w-12, 28);
    // Platform top surface
    ctx.fillStyle = '#D4B888';
    ctx.fillRect(px+6, py+h-28, w-12, 6);
    // Wood grain on platform
    ctx.fillStyle = '#B89868';
    ctx.fillRect(px+10, py+h-22, 2, 18);
    ctx.fillRect(px+30, py+h-22, 2, 18);
    ctx.fillRect(px+50, py+h-22, 2, 18);
    // Shadow under platform
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(px+8, py+h-4, w-16, 4);
    // Sign with rounded corners (pixel style)
    ctx.fillStyle = '#E8E0D0';
    ctx.fillRect(px+w/2-32, py+h-64, 64, 22);
    ctx.fillRect(px+w/2-30, py+h-66, 60, 2);
    ctx.fillRect(px+w/2-30, py+h-42, 60, 2);
    ctx.fillRect(px+w/2-32, py+h-64, 2, 22);
    ctx.fillRect(px+w/2+30, py+h-64, 2, 22);
    // Sign shadow
    ctx.fillStyle = '#C8C0B0';
    ctx.fillRect(px+w/2-30, py+h-42, 60, 2);
    ctx.fillRect(px+w/2+30, py+h-64, 2, 22);
    // Sign text
    ctx.fillStyle = '#888';
    ctx.font = 'bold 10px "Pixelify Sans", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('空摊位', px+w/2, py+h-48);
    ctx.textAlign = 'left';
    return;
  }

  // === COUNTER (wooden with depth) ===
  ctx.fillStyle = '#7B4E2C';
  ctx.fillRect(px+4, py+h-32, w-8, 32);
  // Counter top surface
  ctx.fillStyle = '#A0703C';
  ctx.fillRect(px+4, py+h-32, w-8, 8);
  // Counter top highlight
  ctx.fillStyle = '#B8884C';
  ctx.fillRect(px+6, py+h-32, w-12, 3);
  // Counter wood grain
  ctx.fillStyle = '#6B4020';
  ctx.fillRect(px+16, py+h-24, 1, 20);
  ctx.fillRect(px+36, py+h-24, 1, 20);
  ctx.fillRect(px+56, py+h-24, 1, 20);
  // Counter bottom edge shadow
  ctx.fillStyle = '#5A3518';
  ctx.fillRect(px+4, py+h-4, w-8, 4);
  // Counter shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.1)';
  ctx.fillRect(px+8, py+h, w-16, 4);

  // === AWNING (striped with scalloped bottom) ===
  const awningH = 28;
  const c1 = s.color;
  const c2 = lightenColor(s.color, 40);
  const c3 = darkenColor(s.color, 30);
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? c1 : c2;
    ctx.fillRect(px + i * 12, py + 6, 12, awningH - 4);
  }
  // Awning top edge
  ctx.fillStyle = c3;
  ctx.fillRect(px, py + 6, w, 3);
  // Scalloped bottom edge
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? c3 : darkenColor(s.color, 15);
    const bx = px + i * 12;
    const by = py + 6 + awningH - 4;
    ctx.fillRect(bx, by, 12, 3);
    ctx.fillRect(bx+2, by+3, 8, 2);
    ctx.fillRect(bx+4, by+5, 4, 2);
    ctx.fillRect(bx+5, by+7, 2, 1);
  }
  // Awning side folds
  ctx.fillStyle = c3;
  ctx.fillRect(px, py+6, 2, awningH);
  ctx.fillRect(px+w-2, py+6, 2, awningH);

  // === AWNING POLES ===
  ctx.fillStyle = '#7B4E2C';
  ctx.fillRect(px+4, py+6, 5, h-38);
  ctx.fillRect(px+w-9, py+6, 5, h-38);
  ctx.fillStyle = '#A0703C';
  ctx.fillRect(px+5, py+6, 2, h-38);
  ctx.fillRect(px+w-8, py+6, 2, h-38);
  // Pole caps
  ctx.fillStyle = '#B8884C';
  ctx.fillRect(px+3, py+4, 7, 4);
  ctx.fillRect(px+w-10, py+4, 7, 4);

  // === GOODS ON COUNTER (detailed pixel items) ===
  if (s.kind === 'chef') {
    // Pot/Pan - left side of counter (away from owner in center)
    ctx.fillStyle = '#555';
    ctx.fillRect(px+8, py+h-44, 14, 10);
    ctx.fillStyle = '#777';
    ctx.fillRect(px+8, py+h-44, 14, 3);
    ctx.fillStyle = '#444';
    ctx.fillRect(px+6, py+h-42, 2, 6);
    ctx.fillRect(px+22, py+h-42, 2, 6);
    // Steam from pot
    const steamOff = Math.sin(frame * 0.06) * 3;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillRect(px+12, py+h-50+steamOff, 2, 4);
    ctx.fillRect(px+16, py+h-52-steamOff, 2, 5);
    ctx.fillRect(px+20, py+h-49+steamOff*0.5, 2, 3);
    // Bottle - right side of counter
    ctx.fillStyle = '#8B2500';
    ctx.fillRect(px+w-18, py+h-48, 6, 14);
    ctx.fillStyle = '#A03010';
    ctx.fillRect(px+w-17, py+h-48, 4, 3);
    ctx.fillStyle = '#D4A76A';
    ctx.fillRect(px+w-18, py+h-48, 6, 2);
    // Bread - right side
    ctx.fillStyle = '#D4A040';
    ctx.fillRect(px+w-32, py+h-42, 12, 8);
    ctx.fillStyle = '#E0B050';
    ctx.fillRect(px+w-30, py+h-44, 8, 3);
    ctx.fillStyle = '#C09030';
    ctx.fillRect(px+w-32, py+h-36, 12, 2);
  } else if (s.kind === 'farm') {
    // Carrot - left side
    ctx.fillStyle = '#FF6B35';
    ctx.fillRect(px+8, py+h-44, 4, 10);
    ctx.fillStyle = '#E05520';
    ctx.fillRect(px+8, py+h-36, 4, 2);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(px+7, py+h-48, 6, 4);
    // Tomato - left side
    ctx.fillStyle = '#E83030';
    ctx.fillRect(px+18, py+h-46, 8, 8);
    ctx.fillStyle = '#FF5050';
    ctx.fillRect(px+20, py+h-48, 4, 3);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(px+21, py+h-50, 2, 3);
    // Corn - right side
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(px+w-22, py+h-48, 6, 12);
    ctx.fillStyle = '#FFF8DC';
    ctx.fillRect(px+w-20, py+h-46, 2, 8);
    ctx.fillStyle = '#8BC34A';
    ctx.fillRect(px+w-22, py+h-50, 6, 3);
    // Pumpkin - right side
    ctx.fillStyle = '#FF8C00';
    ctx.fillRect(px+w-12, py+h-44, 10, 8);
    ctx.fillStyle = '#FFA030';
    ctx.fillRect(px+w-10, py+h-46, 6, 3);
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(px+w-8, py+h-48, 2, 3);
  } else {
    // Book - left side
    ctx.fillStyle = '#3498DB';
    ctx.fillRect(px+8, py+h-48, 10, 12);
    ctx.fillStyle = '#2980B9';
    ctx.fillRect(px+8, py+h-48, 2, 12);
    ctx.fillStyle = '#5DADE2';
    ctx.fillRect(px+10, py+h-48, 8, 2);
    // Scroll - left side
    ctx.fillStyle = '#F5E6C8';
    ctx.fillRect(px+22, py+h-46, 8, 10);
    ctx.fillStyle = '#D4C4A0';
    ctx.fillRect(px+22, py+h-46, 8, 2);
    ctx.fillRect(px+22, py+h-38, 8, 2);
    // Potion bottle - right side
    ctx.fillStyle = '#9B59B6';
    ctx.fillRect(px+w-22, py+h-50, 6, 14);
    ctx.fillStyle = '#BB77D6';
    ctx.fillRect(px+w-21, py+h-50, 4, 3);
    ctx.fillStyle = '#D4A76A';
    ctx.fillRect(px+w-22, py+h-50, 6, 2);
    // Crystal - right side
    ctx.fillStyle = '#1ABC9C';
    ctx.fillRect(px+w-12, py+h-48, 6, 10);
    ctx.fillStyle = '#48D1B0';
    ctx.fillRect(px+w-11, py+h-48, 4, 3);
  }

  // === CHEF EXTRAS ===
  if (s.kind === 'chef') {
    // Chef hat on owner (use local coords)
    const cx = px + w/2, cy = py + h - 32;
    ctx.fillStyle = '#FFF';
    ctx.fillRect(cx-8, cy-38, 16, 8);
    ctx.fillRect(cx-6, cy-42, 12, 6);
    ctx.fillRect(cx-4, cy-44, 8, 4);
    ctx.fillStyle = '#EEE';
    ctx.fillRect(cx-6, cy-38, 12, 2);
  }

  // === FARM EXTRAS ===
  if (s.kind === 'farm') {
    // Garden beds
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(px+8, py+h-10, w-16, 10);
    ctx.fillStyle = '#4E342E';
    ctx.fillRect(px+8, py+h-10, w-16, 2);
    // Soil rows
    ctx.fillStyle = '#6D4C41';
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(px + 14 + i * 16, py+h-8, 10, 6);
    }
    // Growing vegetables
    const vegColors = ['#4CAF50','#66BB6A','#81C784','#388E3C'];
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = vegColors[i%4];
      ctx.fillRect(px + 16 + i * 16, py+h-12, 6, 5);
      ctx.fillStyle = '#A5D6A7';
      ctx.fillRect(px + 17 + i * 16, py+h-13, 4, 2);
    }
    // Straw hat on post
    ctx.fillStyle = '#F5DEB3';
    ctx.fillRect(px+w-22, py-4, 18, 5);
    ctx.fillStyle = '#E8D0A0';
    ctx.fillRect(px+w-18, py-8, 10, 6);
    ctx.fillStyle = '#D4B888';
    ctx.fillRect(px+w-16, py-10, 6, 3);
    // Scarecrow
    ctx.fillStyle = '#8B5E3C';
    ctx.fillRect(px-8, py+h-24, 4, 20);
    ctx.fillStyle = '#F5DEB3';
    ctx.fillRect(px-10, py+h-32, 8, 8);
    ctx.fillStyle = '#333';
    ctx.fillRect(px-8, py+h-28, 1, 1);
    ctx.fillRect(px-5, py+h-28, 1, 1);
  }

  // === STATUS SIGN ===
  // Place sign above the stall awning, not over the owner
  const signY = py - 22 + Math.sin(frame * 0.04) * 2;
  if (s.status === 'open') {
    drawStatusSign(px + w/2 - 28, signY, '营业中', '#4CAF50', '#FFF');
  } else if (s.status === 'busy') {
    drawStatusSign(px + w/2 - 22, signY, '已满', '#FF9800', '#FFF');
  }

  // Customer sprite for busy stalls
  if (s.status === 'busy') {
    const cp = getCustomerPos(s);
    drawCharacter(cp.x, cp.y, 0, 0, '#e74c3c', frame);
  }

  // Draw stall name label below the stall counter
  if (s.status !== 'empty' && s.name) {
    let displayName = s.name;
    if (displayName.length > 8) displayName = displayName.substring(0, 7) + '\u2026';
    ctx.font = 'bold 10px "Pixelify Sans", monospace';
    const nameW = Math.min(ctx.measureText(displayName).width + 12, w);
    const nameX = px + w/2 - nameW/2;
    const labelY = py + h + 2;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(nameX, labelY, nameW, 16);
    ctx.fillStyle = '#FFF';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.strokeText(displayName, px + w/2, labelY + 12);
    ctx.fillText(displayName, px + w/2, labelY + 12);
    ctx.textAlign = 'left';
  }
}

function drawStallOwner(s) {
  if (s.status === 'empty') return;
  const x = s.tile.x * TILE;
  const y = s.tile.y * TILE;
  const w = TILE * 2;
  const h = TILE * 2;
  const px = Math.floor(x), py = Math.floor(y);
  const ownerX = px + w/2;
  const ownerY = py + h - 32;
  ctx.save();
  ctx.beginPath();
  ctx.rect(px, py - 50, w, h + 50);
  ctx.clip();
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath();
  ctx.ellipse(ownerX, ownerY + 2, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // Body
  ctx.fillStyle = s.color;
  ctx.fillRect(ownerX-8, ownerY-16, 16, 16);
  // Collar
  ctx.fillStyle = lightenColor(s.color, 30);
  ctx.fillRect(ownerX-6, ownerY-16, 12, 3);
  // Arms
  ctx.fillStyle = '#F5C6A0';
  ctx.fillRect(ownerX-12, ownerY-8, 5, 6);
  ctx.fillRect(ownerX+7, ownerY-8, 5, 6);
  // Head
  ctx.fillStyle = '#F5C6A0';
  ctx.fillRect(ownerX-7, ownerY-30, 14, 14);
  // Hair
  ctx.fillStyle = '#5A3825';
  ctx.fillRect(ownerX-8, ownerY-32, 16, 6);
  ctx.fillRect(ownerX-8, ownerY-28, 3, 6);
  ctx.fillRect(ownerX+5, ownerY-28, 3, 6);
  // Eyes
  ctx.fillStyle = '#333';
  ctx.fillRect(ownerX-4, ownerY-24, 2, 3);
  ctx.fillRect(ownerX+2, ownerY-24, 2, 3);
  // Eye highlights
  ctx.fillStyle = '#FFF';
  ctx.fillRect(ownerX-4, ownerY-24, 1, 1);
  ctx.fillRect(ownerX+2, ownerY-24, 1, 1);
  // Mouth
  ctx.fillStyle = '#D4967A';
  ctx.fillRect(ownerX-1, ownerY-20, 2, 1);
  // Chef hat on owner
  if (s.kind === 'chef') {
    ctx.fillStyle = '#FFF';
    ctx.fillRect(ownerX-8, ownerY-38, 16, 8);
    ctx.fillRect(ownerX-6, ownerY-42, 12, 6);
    ctx.fillRect(ownerX-4, ownerY-44, 8, 4);
    ctx.fillStyle = '#EEE';
    ctx.fillRect(ownerX-6, ownerY-38, 12, 2);
  }
  ctx.restore();
}

function drawStatusSign(x, y, text, bg, fg) {
  ctx.font = 'bold 11px "Pixelify Sans", monospace';
  const tw = ctx.measureText(text).width || 40;
  const w = Math.max(tw + 20, 52);
  const h = 20;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(x+2, y+2, w, h);
  // Rounded corners (pixel style - corner pixels)
  ctx.fillStyle = bg;
  ctx.fillRect(x+2, y, w-4, h);
  ctx.fillRect(x, y+2, w, h-4);
  ctx.fillRect(x+1, y+1, w-2, h-2);
  // Top highlight
  ctx.fillStyle = lightenColor(bg, 30);
  ctx.fillRect(x+2, y, w-4, 2);
  // Bottom shadow
  ctx.fillStyle = darkenColor(bg, 20);
  ctx.fillRect(x+2, y+h-2, w-4, 2);
  // Text with outline for clarity
  ctx.fillStyle = fg;
  ctx.textAlign = 'center';
  ctx.strokeStyle = darkenColor(bg, 40);
  ctx.lineWidth = 3;
  ctx.strokeText(text, x + w/2, y + 14);
  ctx.fillText(text, x + w/2, y + 14);
  ctx.textAlign = 'left';
}

function getGoodsForKind(kind) {
  if (kind === 'chef') return [{color:'#e74c3c',w:12,h:10},{color:'#ff9800',w:10,h:8},{color:'#8bc34a',w:8,h:10}];
  if (kind === 'farm') return [{color:'#4caf50',w:10,h:12},{color:'#8bc34a',w:8,h:10},{color:'#ff9800',w:10,h:8}];
  return [{color:'#3498db',w:12,h:10},{color:'#9b59b6',w:10,h:12},{color:'#e74c3c',w:8,h:8}];
}

function lightenColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r+amt); g = Math.min(255, g+amt); b = Math.min(255, b+amt);
  return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
}
function darkenColor(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r-amt); g = Math.max(0, g-amt); b = Math.max(0, b-amt);
  return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
}

// Map bodyColor hex to character sprite index
function getCharIndex(color) {
  const colorMap = {
    '#4a90d9': 0, '#3498db': 0, // 蓝色 - 玩家/NPC
    '#e74c3c': 1, '#e91e63': 1, // 红色/粉红
    '#4a9d5b': 2, '#2ecc71': 2, '#1abc9c': 2, // 绿色/浅绿/青色
    '#9b59b6': 3, // 紫色
    '#e67e22': 4, '#f39c12': 4, // 橙色
    '#8B6914': 5, '#7f8c8d': 5, // 棕色/灰色
  };
  return colorMap[color] !== undefined ? colorMap[color] : 0;
}

// ==================== DRAW CHARACTER ====================
function drawCharacter(x, y, dir, animFrame, bodyColor, f) {
  const px = Math.floor(x), py = Math.floor(y);
  // 4-frame walk animation cycle
  const walkPhase = animFrame % 4;
  const legL = walkPhase === 1 ? -2 : walkPhase === 3 ? 2 : 0;
  const legR = walkPhase === 1 ? 2 : walkPhase === 3 ? -2 : 0;
  const armSwing = walkPhase === 1 ? -1 : walkPhase === 3 ? 1 : 0;

  // Shadow (larger, softer ellipse)
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(px, py + 16, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // === SHOES ===
  ctx.fillStyle = '#3D2B1A';
  ctx.fillRect(px-7, py+12+legL, 6, 3);
  ctx.fillRect(px+1, py+12+legR, 6, 3);
  // Shoe highlight
  ctx.fillStyle = '#5A4030';
  ctx.fillRect(px-6, py+12+legL, 4, 1);
  ctx.fillRect(px+2, py+12+legR, 4, 1);

  // === LEGS (pants) - shorter for chibi proportion ===
  ctx.fillStyle = '#4A3728';
  ctx.fillRect(px-6, py+6+legL, 5, 6);
  ctx.fillRect(px+1, py+6+legR, 5, 6);
  // Pants detail
  ctx.fillStyle = '#3D2B1A';
  ctx.fillRect(px-6, py+10+legL, 5, 2);
  ctx.fillRect(px+1, py+10+legR, 5, 2);

  // === BODY (shirt) - shorter Q-style body ===
  ctx.fillStyle = bodyColor;
  ctx.fillRect(px-8, py-6, 16, 12);
  // Shirt highlight (left side)
  ctx.fillStyle = lightenColor(bodyColor, 20);
  ctx.fillRect(px-8, py-6, 4, 12);
  // Shirt shadow (right side)
  ctx.fillStyle = darkenColor(bodyColor, 20);
  ctx.fillRect(px+4, py-6, 4, 12);
  // Collar
  ctx.fillStyle = lightenColor(bodyColor, 40);
  ctx.fillRect(px-4, py-6, 8, 3);
  // Belt
  ctx.fillStyle = '#6B4226';
  ctx.fillRect(px-8, py+4, 16, 2);
  ctx.fillStyle = '#D4A76A';
  ctx.fillRect(px-1, py+4, 2, 2);

  // === ARMS ===
  ctx.fillStyle = '#F5C6A0';
  if (dir === 1) {
    ctx.fillRect(px-11, py-4+armSwing, 4, 10);
    ctx.fillStyle = '#EDBA94';
    ctx.fillRect(px-11, py+2+armSwing, 4, 4);
  } else if (dir === 2) {
    ctx.fillRect(px+7, py-4-armSwing, 4, 10);
    ctx.fillStyle = '#EDBA94';
    ctx.fillRect(px+7, py+2-armSwing, 4, 4);
  } else {
    ctx.fillRect(px-11, py-4+armSwing, 4, 10);
    ctx.fillRect(px+7, py-4-armSwing, 4, 10);
    ctx.fillStyle = '#EDBA94';
    ctx.fillRect(px-11, py+2+armSwing, 4, 4);
    ctx.fillRect(px+7, py+2-armSwing, 4, 4);
  }

  // === HEAD (chibi - large 20px tall, round with more pixel blocks) ===
  // Head shape - wider and taller for rounder look
  ctx.fillStyle = '#F5C6A0';
  ctx.fillRect(px-8, py-26, 16, 20);
  ctx.fillRect(px-7, py-28, 14, 2);
  ctx.fillRect(px-6, py-30, 12, 2);
  ctx.fillRect(px-5, py-31, 10, 1);
  // Round out the bottom of the face
  ctx.fillRect(px-7, py-6, 14, 1);
  ctx.fillRect(px-6, py-5, 12, 1);

  // Cheek blush - 2 pink pixels each side
  ctx.fillStyle = '#F0A8A0';
  ctx.fillRect(px-7, py-18, 2, 2);
  ctx.fillRect(px+5, py-18, 2, 2);

  // Face shadow
  ctx.fillStyle = '#EDBA94';
  ctx.fillRect(px+4, py-24, 4, 12);

  // === HAIR (rich, layered with bangs and side detail) ===
  ctx.fillStyle = '#5A3825';
  // Top hair mass - taller
  ctx.fillRect(px-8, py-34, 16, 8);
  ctx.fillRect(px-7, py-36, 14, 4);
  ctx.fillRect(px-6, py-38, 12, 2);
  ctx.fillRect(px-5, py-39, 10, 1);
  // Bangs (fringe) - irregular across forehead
  ctx.fillRect(px-7, py-30, 3, 4);
  ctx.fillRect(px-4, py-31, 2, 5);
  ctx.fillRect(px-1, py-30, 3, 4);
  ctx.fillRect(px+2, py-31, 2, 5);
  ctx.fillRect(px+5, py-30, 3, 4);
  // Side hair - longer strands
  ctx.fillRect(px-9, py-28, 3, 14);
  ctx.fillRect(px-10, py-24, 2, 8);
  ctx.fillRect(px+6, py-28, 3, 14);
  ctx.fillRect(px+8, py-24, 2, 8);
  // Hair highlight
  ctx.fillStyle = '#7A5035';
  ctx.fillRect(px-5, py-36, 4, 3);
  ctx.fillRect(px+2, py-35, 3, 2);
  ctx.fillRect(px-3, py-38, 2, 2);
  // Back hair (visible from behind)
  if (dir === 3) {
    ctx.fillStyle = '#5A3825';
    ctx.fillRect(px-8, py-34, 16, 22);
    ctx.fillStyle = '#4A2815';
    ctx.fillRect(px-7, py-32, 14, 18);
  }

  // === EYES (large: 4x3 white + 2x2 pupil + 1x1 highlight) ===
  if (dir !== 3) {
    // Eye whites - 4 wide x 3 tall
    ctx.fillStyle = '#FFF';
    if (dir === 0 || dir === 1) {
      ctx.fillRect(px-6, py-24, 4, 3);
      ctx.fillRect(px+2, py-24, 4, 3);
    } else {
      ctx.fillRect(px-5, py-24, 4, 3);
      ctx.fillRect(px+3, py-24, 4, 3);
    }
    // Pupils - 2x2
    ctx.fillStyle = '#333';
    if (dir === 0) {
      ctx.fillRect(px-4, py-23, 2, 2);
      ctx.fillRect(px+3, py-23, 2, 2);
    } else if (dir === 1) {
      ctx.fillRect(px-5, py-23, 2, 2);
      ctx.fillRect(px+2, py-23, 2, 2);
    } else {
      ctx.fillRect(px-3, py-23, 2, 2);
      ctx.fillRect(px+4, py-23, 2, 2);
    }
    // Eye highlights - 1x1 white dot
    ctx.fillStyle = '#FFF';
    if (dir === 0) {
      ctx.fillRect(px-4, py-24, 1, 1);
      ctx.fillRect(px+3, py-24, 1, 1);
    } else if (dir === 1) {
      ctx.fillRect(px-5, py-24, 1, 1);
      ctx.fillRect(px+2, py-24, 1, 1);
    } else {
      ctx.fillRect(px-3, py-24, 1, 1);
      ctx.fillRect(px+4, py-24, 1, 1);
    }
    // Eyebrows - slightly thicker
    ctx.fillStyle = '#4A2815';
    if (dir === 0) {
      ctx.fillRect(px-6, py-26, 5, 1);
      ctx.fillRect(px+1, py-26, 5, 1);
    } else if (dir === 1) {
      ctx.fillRect(px-7, py-26, 5, 1);
      ctx.fillRect(px, py-26, 5, 1);
    } else {
      ctx.fillRect(px-5, py-26, 5, 1);
      ctx.fillRect(px+2, py-26, 5, 1);
    }
  }

  // Mouth - 3px wide smile arc
  if (dir !== 3) {
    ctx.fillStyle = '#D4967A';
    ctx.fillRect(px-1, py-16, 3, 1);
    ctx.fillStyle = '#C4866A';
    ctx.fillRect(px, py-15, 1, 1);
  }
}

// ==================== DRAW ANIMALS ====================
function drawAnimal(a) {
  const px = Math.floor(a.x), py = Math.floor(a.y);
  const d = a.dir ? 1 : -1; // 1=right, -1=left

  if (a.type === 'cat') {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(px, py + 12, 10, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // Tail (curved)
    ctx.fillStyle = a.color;
    ctx.fillRect(px+(d>0?8:-14), py-8, 6, 3);
    ctx.fillRect(px+(d>0?12:-16), py-10, 4, 3);
    ctx.fillRect(px+(d>0?14:-18), py-12, 3, 3);
    // Tail tip (darker)
    ctx.fillStyle = darkenColor(a.color, 30);
    ctx.fillRect(px+(d>0?14:-18), py-12, 3, 2);
    // Body (rounded)
    ctx.fillStyle = a.color;
    ctx.fillRect(px-8, py-4, 16, 12);
    ctx.fillRect(px-9, py-2, 18, 8);
    // Belly highlight
    ctx.fillStyle = lightenColor(a.color, 30);
    ctx.fillRect(px-4, py-2, 8, 6);
    // Head (rounded)
    ctx.fillStyle = a.color;
    const hx = px + (d>0 ? 2 : -10);
    ctx.fillRect(hx, py-10, 10, 10);
    ctx.fillRect(hx+1, py-12, 8, 2);
    // Ears (triangular)
    ctx.fillStyle = a.color;
    ctx.fillRect(hx, py-14, 3, 4);
    ctx.fillRect(hx+7, py-14, 3, 4);
    // Inner ears
    ctx.fillStyle = '#F0A8A0';
    ctx.fillRect(hx+1, py-13, 1, 2);
    ctx.fillRect(hx+8, py-13, 1, 2);
    // Eyes (large with highlight)
    ctx.fillStyle = '#FFF';
    ctx.fillRect(hx+1, py-8, 3, 3);
    ctx.fillRect(hx+6, py-8, 3, 3);
    ctx.fillStyle = '#333';
    ctx.fillRect(hx+2, py-7, 2, 2);
    ctx.fillRect(hx+7, py-7, 2, 2);
    ctx.fillStyle = '#FFF';
    ctx.fillRect(hx+2, py-7, 1, 1);
    ctx.fillRect(hx+7, py-7, 1, 1);
    // Nose
    ctx.fillStyle = '#F0A8A0';
    ctx.fillRect(hx+4, py-5, 2, 1);
    // Whiskers
    ctx.fillStyle = '#CCC';
    ctx.fillRect(hx-2, py-5, 2, 1);
    ctx.fillRect(hx-2, py-4, 2, 1);
    ctx.fillRect(hx+10, py-5, 2, 1);
    ctx.fillRect(hx+10, py-4, 2, 1);
    // Legs
    ctx.fillStyle = darkenColor(a.color, 20);
    ctx.fillRect(px-6, py+8, 3, 4);
    ctx.fillRect(px+3, py+8, 3, 4);
    // Paws
    ctx.fillStyle = lightenColor(a.color, 20);
    ctx.fillRect(px-6, py+10, 3, 2);
    ctx.fillRect(px+3, py+10, 3, 2);
  } else {
    // Chicken
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.beginPath();
    ctx.ellipse(px, py + 12, 8, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // Tail feathers
    ctx.fillStyle = '#F5F5F5';
    ctx.fillRect(px+(d>0?-8:6), py-6, 4, 4);
    ctx.fillRect(px+(d>0?-10:8), py-8, 3, 3);
    // Body (rounded)
    ctx.fillStyle = '#FFF';
    ctx.fillRect(px-7, py-4, 14, 12);
    ctx.fillRect(px-6, py-6, 12, 2);
    // Wing detail
    ctx.fillStyle = '#F0F0F0';
    ctx.fillRect(px+(d>0?-5:1), py-2, 6, 6);
    ctx.fillStyle = '#E8E8E8';
    ctx.fillRect(px+(d>0?-4:2), py, 4, 3);
    // Head
    ctx.fillStyle = '#FFF';
    const hx = px + (d>0 ? 2 : -8);
    ctx.fillRect(hx, py-10, 8, 8);
    ctx.fillRect(hx+1, py-12, 6, 2);
    // Comb
    ctx.fillStyle = '#E83030';
    ctx.fillRect(hx+2, py-14, 4, 3);
    ctx.fillRect(hx+1, py-13, 2, 2);
    ctx.fillRect(hx+5, py-13, 2, 2);
    // Wattle
    ctx.fillStyle = '#E83030';
    ctx.fillRect(hx+3, py-4, 2, 2);
    // Beak
    ctx.fillStyle = '#FF9800';
    ctx.fillRect(hx+(d>0?8:-3), py-8, 3, 2);
    ctx.fillStyle = '#E08800';
    ctx.fillRect(hx+(d>0?8:-3), py-7, 3, 1);
    // Eye
    ctx.fillStyle = '#333';
    ctx.fillRect(hx+(d>0?5:1), py-8, 2, 2);
    ctx.fillStyle = '#FFF';
    ctx.fillRect(hx+(d>0?5:1), py-8, 1, 1);
    // Legs
    ctx.fillStyle = '#FF9800';
    ctx.fillRect(px-4, py+8, 2, 4);
    ctx.fillRect(px+2, py+8, 2, 4);
    // Feet
    ctx.fillStyle = '#E08800';
    ctx.fillRect(px-5, py+11, 4, 1);
    ctx.fillRect(px+1, py+11, 4, 1);
  }
}

// ==================== DRAW BUBBLE ====================
function drawBubble(x, y, text, color) {
  ctx.font = '11px "Pixelify Sans", monospace';
  const tw = ctx.measureText(text).width;
  const bw = tw + 24;
  const bh = 28;
  const bx = Math.floor(x - bw/2), by = Math.floor(y - bh - 10);
  const c = color || '#4a9d5b';
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(bx+2, by+2, bw, bh);
  ctx.fillRect(bx+2, by+bh, 6, 4);
  ctx.fillRect(bx+4, by+bh+2, 4, 4);
  // Bubble body with rounded corners (pixel style)
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillRect(bx+2, by, bw-4, bh);
  ctx.fillRect(bx, by+2, bw, bh-4);
  ctx.fillRect(bx+1, by+1, bw-2, bh-2);
  // Top highlight
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(bx+3, by+1, bw-6, 2);
  // Border (pixel outline)
  ctx.fillStyle = c;
  // Top edge
  ctx.fillRect(bx+2, by, bw-4, 1);
  // Bottom edge
  ctx.fillRect(bx+2, by+bh-1, bw-4, 1);
  // Left edge
  ctx.fillRect(bx, by+2, 1, bh-4);
  // Right edge
  ctx.fillRect(bx+bw-1, by+2, 1, bh-4);
  // Corners
  ctx.fillRect(bx+1, by+1, 1, 1);
  ctx.fillRect(bx+bw-2, by+1, 1, 1);
  ctx.fillRect(bx+1, by+bh-2, 1, 1);
  ctx.fillRect(bx+bw-2, by+bh-2, 1, 1);
  // Tail (triangle pointer)
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fillRect(x-5, by+bh, 10, 4);
  ctx.fillRect(x-3, by+bh+2, 6, 4);
  ctx.fillRect(x-1, by+bh+4, 2, 3);
  // Tail border
  ctx.fillStyle = c;
  ctx.fillRect(x-5, by+bh-1, 1, 2);
  ctx.fillRect(x+4, by+bh-1, 1, 2);
  ctx.fillRect(x-3, by+bh+3, 1, 3);
  ctx.fillRect(x+2, by+bh+3, 1, 3);
  ctx.fillRect(x-1, by+bh+5, 2, 1);
  // Text
  ctx.fillStyle = '#333';
  ctx.textAlign = 'center';
  ctx.fillText(text, x, by + 18);
  ctx.textAlign = 'left';
}

// ==================== UPDATE ====================
function update() {
  frame++;
  // Player movement
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup'] || keys['dpad_up']) { dy = -PLAYER_SPEED; player.dir = 3; }
  if (keys['s'] || keys['arrowdown'] || keys['dpad_down']) { dy = PLAYER_SPEED; player.dir = 0; }
  if (keys['a'] || keys['arrowleft'] || keys['dpad_left']) { dx = -PLAYER_SPEED; player.dir = 1; }
  if (keys['d'] || keys['arrowright'] || keys['dpad_right']) { dx = PLAYER_SPEED; player.dir = 2; }
  player.moving = dx !== 0 || dy !== 0;
  if (player.moving) {
    // Normalize diagonal
    if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
    const nx = player.x + dx, ny = player.y + dy;
    if (canMove(nx, player.y)) player.x = nx;
    if (canMove(player.x, ny)) player.y = ny;
    player.frameTimer++;
    if (player.frameTimer > 8) { player.frame = (player.frame + 1) % 4; player.frameTimer = 0; }
  } else {
    player.frame = 0;
  }

  // NPC movement
  npcs.forEach(npc => {
    if (hideOtherPlayers) return;
    npc.moveTimer--;
    if (npc.moveTimer <= 0) {
      npc.moveDir = Math.floor(Math.random()*4);
      npc.moving = Math.random() > 0.3;
      npc.moveTimer = 60 + Math.random() * 120;
    }
    if (npc.moving) {
      const speed = 1;
      let ndx = 0, ndy = 0;
      if (npc.moveDir === 0) ndy = speed;
      if (npc.moveDir === 1) ndx = -speed;
      if (npc.moveDir === 2) ndx = speed;
      if (npc.moveDir === 3) ndy = -speed;
      npc.dir = npc.moveDir;
      const nx = npc.x + ndx, ny = npc.y + ndy;
      // Keep NPCs on dirt roads roughly
      if (nx > TILE*2 && nx < MAP_W-TILE*2 && ny > TILE && ny < MAP_H-TILE) {
        npc.x = nx; npc.y = ny;
      }
    }
  });

  // Animal movement
  animals.forEach(a => {
    if (hideOtherPlayers) return;
    a.moveTimer--;
    if (a.moveTimer <= 0) {
      a.dir = Math.random() > 0.5 ? 1 : 0;
      a.moveTimer = 80 + Math.random() * 120;
    }
    a.x += (a.dir ? 0.3 : -0.3);
    if (a.x < TILE*2) a.dir = 1;
    if (a.x > MAP_W-TILE*2) a.dir = 0;
  });

  // Bubble rotation
  bubbleTimer++;
  if (bubbleTimer > 180) {
    bubbleTimer = 0;
    const openStalls = stalls.filter(s => s.status === 'open' && s.skill.length > 0);
    if (openStalls.length > 0) {
      currentBubbleStall = (currentBubbleStall + 1) % openStalls.length;
    }
  }

  // Player bubble timer
  if (playerBubbleTimer > 0) playerBubbleTimer--;
  if (playerBubbleTimer <= 0) playerBubble = null;

  updateUI();
}

// ==================== RENDER ====================
function render() {
  ctx.clearRect(0, 0, MAP_W, MAP_H);

  // Draw map tiles
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const t = mapData[y][x];
      const px = x * TILE, py = y * TILE;
      if (t === 0 || t === 5) drawGrass(px, py);
      else if (t === 1) drawDirt(px, py);
      else if (t === 2) drawFlower(px, py);
      else if (t === 3) drawTree(px, py);
      else if (t === 4) drawFence(px, py);
    }
  }

  // Collect all drawable entities for y-sort
  const entities = [];

  // Trees
  treePos.forEach(([x,y]) => {
    entities.push({ type:'tree', x: x*TILE, y: y*TILE+TILE, sortY: y*TILE+TILE });
  });

  // Stalls
  stalls.forEach(s => {
    if (s.tile) entities.push({ type:'stall', data:s, sortY: s.tile.y*TILE+TILE*2 });
  });

  // Stall owners (separate from stalls for y-sort)
  stalls.forEach(s => {
    if (s.tile && s.status !== 'empty') {
      entities.push({ type:'stallOwner', data:s, sortY: s.tile.y*TILE+TILE*2-10 });
    }
  });

  // NPCs
  npcs.forEach(n => { if (hideOtherPlayers) return; entities.push({ type:'npc', data:n, sortY: n.y+20 }); });

  // Animals
  animals.forEach(a => { if (hideOtherPlayers) return; entities.push({ type:'animal', data:a, sortY: a.y+10 }); });

  // Player
  entities.push({ type:'player', sortY: player.y+20 });

  // Sort by Y
  entities.sort((a,b) => a.sortY - b.sortY);

  // Draw entities
  entities.forEach(e => {
    if (e.type === 'tree') drawTree(e.x, e.y - TILE);
    else if (e.type === 'stall') drawStall(e.data);
    else if (e.type === 'stallOwner') drawStallOwner(e.data);
    else if (e.type === 'npc') drawCharacter(e.data.x, e.data.y, e.data.dir, Math.floor(frame/12), e.data.color, frame);
    else if (e.type === 'animal') drawAnimal(e.data);
    else if (e.type === 'player') {
      drawCharacter(player.x, player.y, player.dir, player.moving ? Math.floor(frame/8) : 0, '#4a90d9', frame);
      // Player name tag
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.font = 'bold 10px "Pixelify Sans", monospace';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 3;
      ctx.strokeText('你', player.x, player.y - 24);
      ctx.fillText('你', player.x, player.y - 24);
      ctx.textAlign = 'left';
    }
  });

  // Draw bubbles (on top)
  const openStalls = stalls.filter(s => s.status === 'open' && s.skill.length > 0);
  if (openStalls.length > 0) {
    const bs = openStalls[currentBubbleStall % openStalls.length];
    if (bs.tile) {
      const bx = bs.tile.x * TILE + TILE;
      const by = bs.tile.y * TILE - 20;
      drawBubble(bx, by, bs.skill, bs.color);
    }
  }

  // Player bubble
  if (playerBubble) {
    drawBubble(player.x, player.y - 30, playerBubble, '#4a90d9');
  }

  // Interaction hint
  const nearby = getNearbyStall();
  if (nearby && !document.querySelector('.overlay.active')) {
    const hx = nearby.tile.x * TILE + TILE;
    const hy = nearby.tile.y * TILE - 10;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.font = 'bold 11px "Pixelify Sans", monospace';
    ctx.textAlign = 'center';
    const hintText = nearby.status === 'empty' ? '按 E 开摊' : '按 E 查看';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(hintText, hx, hy);
    ctx.fillStyle = '#FFF';
    ctx.fillText(hintText, hx, hy);
    ctx.textAlign = 'left';
  }
}

// ==================== GAME LOOP ====================
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ==================== UI UPDATES ====================
function updateUI() {
  document.getElementById('gold').textContent = gold;
  document.getElementById('orders').textContent = totalOrders;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ==================== SHOP PANEL ====================
function openShop(stall) {
  const overlay = document.getElementById('shop-overlay');
  const nameEl = document.getElementById('shop-name');
  const ownerEl = document.getElementById('shop-owner');
  const bodyEl = document.getElementById('shop-body');

  nameEl.textContent = stall.name;
  ownerEl.textContent = stall.owner || '—';

  let html = '';

  if (stall.status === 'empty') {
    html = `
      <div class="skill-pitch">🧪 ${stall.skill}</div>
      <p style="color:#584824;font-size:13px;margin:12px 0">这是一块空摊位，等待有能力的摊主入驻。</p>
      <button class="btn btn-primary" onclick="startDistill('${stall.id}')">⚗️ 开摊</button>
    `;
  } else {
    // Skill pitch
    html += `<div class="skill-pitch">💡 ${stall.skill}</div>`;

    // Status badge
    const statusClass = stall.status === 'open' ? 'status-open' : 'status-busy';
    const statusText = stall.status === 'open' ? '🟢 营业中' : '🟠 已满';
    html += `<span class="status-badge ${statusClass}">${statusText}</span>`;

    // Stats
    html += `<div class="stats-row">
      <div class="stat-card"><div class="num">${stall.deals}</div><div class="label">累计成交</div></div>
      <div class="stat-card"><div class="num">${stall.rating.toFixed(1)}</div><div class="label">平均评分</div></div>
      <div class="stat-card"><div class="num">${stall.reviews.length}</div><div class="label">评价数</div></div>
    </div>`;

    // Stars
    const fullStars = Math.floor(stall.rating);
    const halfStar = stall.rating % 1 >= 0.5;
    let starsHtml = '';
    for (let i = 0; i < 5; i++) {
      if (i < fullStars) starsHtml += '★';
      else if (i === fullStars && halfStar) starsHtml += '★';
      else starsHtml += '☆';
    }
    html += `<div class="stars">${starsHtml} ${stall.rating.toFixed(1)}</div>`;

    // Price
    html += `<div class="price-tag">¥${stall.price}</div>`;

    // Example
    if (stall.example) {
      html += `<div class="section-title">📋 交付示例</div>
        <div class="example-box">${stall.example}</div>`;
    }

    // Reviews
    if (stall.reviews.length > 0) {
      html += `<div class="section-title">💬 买家评价</div>`;
      stall.reviews.forEach(r => {
        let rStars = '';
        for (let i = 0; i < 5; i++) rStars += i < r.rating ? '★' : '☆';
        html += `<div class="review-item">
          <div class="r-head"><span class="r-user">${r.user}</span><span class="stars" style="font-size:12px">${rStars}</span></div>
          <div class="r-text">${r.text}</div>
        </div>`;
      });
    }

    // Action buttons
    if (stall.status === 'open') {
      html += `<button class="btn btn-primary" onclick="placeOrder('${stall.id}')">🛒 下单（¥${stall.price}）</button>`;
    } else if (stall.status === 'busy') {
      html += `<div class="anti-monopoly-note">⛔ 摊主一次只服务 1 人，完成前无法被再次下单，给其他玩家机会。</div>`;
      html += `<button class="btn btn-secondary" onclick="joinQueue('${stall.id}')">📋 预约排队</button>`;
      // Check if current user has active order for this stall
      if (currentOrder && currentOrder.stallId === stall.id) {
        html += `<button class="btn btn-warn" onclick="openOrderModal('${stall.id}')">📦 查看我的订单</button>`;
      }
    }
  }

  bodyEl.innerHTML = html;
  overlay.classList.add('active');
  bodyEl.scrollTop = 0;
}

function closeShop() {
  document.getElementById('shop-overlay').classList.remove('active');
}

// ==================== ORDER SYSTEM ====================
function placeOrder(stallId) {
  const stall = stalls.find(s => s.id === stallId);
  if (!stall || stall.status !== 'open') {
    showToast('该摊位当前无法下单');
    return;
  }
  if (gold < stall.price) {
    showToast('金币不足！');
    return;
  }

  gold -= stall.price;
  stall.status = 'busy';
  totalOrders++;
  const commission = Math.floor(stall.price * 0.08);
  totalCommission += commission;

  currentOrder = {
    id: 'o' + Date.now(),
    stallId: stallId,
    amount: stall.price,
    commission: commission,
    status: 'in_progress',
    createdAt: Date.now()
  };
  orders.push(currentOrder);

  closeShop();
  showToast(`下单成功！`);
  openChat(stallId);
  openOrderModal(stallId);

  // Auto-save skill card after purchase
  if (stall.skill) {
    const mat = stall.material || { title: stall.name + ' · 学习笔记', desc: stall.example || stall.skill, icon: '📝' };
    if (!myMaterials.find(m => m.stallId === stallId)) {
      myMaterials.push({
        stallId: stallId,
        stallName: stall.name,
        owner: stall.owner,
        ...mat,
        savedAt: Date.now()
      });
      updateSkillBadge();
    }
  }
}

function joinQueue(stallId) {
  showToast('已加入预约排队，摊主完成后将通知你');
  closeShop();
}

function openOrderModal(stallId) {
  const stall = stalls.find(s => s.id === stallId);
  const order = currentOrder;
  if (!order || order.stallId !== stallId) {
    showToast('你没有该摊位的进行中订单');
    return;
  }

  document.getElementById('order-stall-name').textContent = stall.name;
  const body = document.getElementById('order-body');
  body.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="num">¥${order.amount}</div><div class="label">订单金额</div></div>
    </div>
    <p style="color:#584824;font-size:13px;margin:12px 0">订单状态：<strong style="color:#E8944A">进行中</strong></p>
    <p style="color:#584824;font-size:13px">摊主正在为你服务，完成后可以评价。</p>
    <button class="btn btn-primary" onclick="closeOrderModal();openChat('${stallId}')">💬 继续学习</button>
    <button class="btn btn-warn" onclick="completeOrder()">✅ 模拟完成订单</button>
    <button class="btn btn-close" onclick="closeOrderModal()">关闭</button>
  `;
  document.getElementById('order-overlay').classList.add('active');
}

function closeOrderModal() {
  document.getElementById('order-overlay').classList.remove('active');
}

function completeOrder() {
  if (!currentOrder) return;
  const stall = stalls.find(s => s.id === currentOrder.stallId);
  if (!stall) return;

  stall.status = 'open';
  stall.deals++;
  currentOrder.status = 'completed';
  currentOrder.completedAt = Date.now();

  closeOrderModal();
  showToast('订单完成！请评价摊主');

  // Open review modal
  setTimeout(() => openReview(stall.id), 500);
}

// ==================== REVIEW SYSTEM ====================
let reviewStallId = null;
let reviewStars = 0;

function openReview(stallId) {
  reviewStallId = stallId;
  reviewStars = 0;
  const stall = stalls.find(s => s.id === stallId);
  document.getElementById('review-stall-name').textContent = stall.name;

  const body = document.getElementById('review-body');
  body.innerHTML = `
    <p style="color:#584824;font-size:13px;margin-bottom:8px">为 ${stall.owner} 的服务评分：</p>
    <div class="star-select" id="star-select">
      ${[1,2,3,4,5].map(i => `<button class="star-btn" data-star="${i}" onclick="setReviewStar(${i})">★</button>`).join('')}
    </div>
    <textarea class="review-textarea" id="review-text" placeholder="写下你的评价..."></textarea>
    <button class="btn btn-primary" id="submit-review-btn" onclick="submitReview()" disabled>提交评价</button>
    <button class="btn btn-close" onclick="closeReview()">跳过</button>
  `;
  document.getElementById('review-overlay').classList.add('active');
}

function setReviewStar(n) {
  reviewStars = n;
  document.querySelectorAll('#star-select .star-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i < n);
  });
  document.getElementById('submit-review-btn').disabled = false;
}

function submitReview() {
  if (reviewStars === 0) return;
  const stall = stalls.find(s => s.id === reviewStallId);
  if (!stall) return;

  const text = document.getElementById('review-text').value || '好评！';
  const names = ['你','匿名买家','路过的人','小镇居民','新玩家'];
  stall.reviews.push({
    user: names[Math.floor(Math.random()*names.length)],
    rating: reviewStars,
    text: text
  });

  // Recalculate rating
  const total = stall.reviews.reduce((s,r) => s + r.rating, 0);
  stall.rating = Math.round((total / stall.reviews.length) * 10) / 10;

  currentOrder = null;
  closeReview();
  showToast('评价提交成功！');
}

function closeReview() {
  document.getElementById('review-overlay').classList.remove('active');
  if (currentOrder && currentOrder.status === 'completed') currentOrder = null;
}

// ==================== DISTILL WIZARD ====================
let distillStallId = null;
let distillStep = 0;
let distillData = {};

// Quick distill from top bar button - find empty stall or use existing
function quickDistill() {
  // If already have a stall, open my stall panel
  const myStall = stalls.find(s => s.isMine);
  if (myStall) {
    openMyStall();
    return;
  }
  // Find an empty stall
  const emptyStall = stalls.find(s => s.status === 'empty');
  if (emptyStall) {
    startDistill(emptyStall.id);
  } else {
    showToast('小镇暂时没有空摊位了，稍后再来吧！');
  }
}

function startDistill(stallId) {
  distillStallId = stallId;
  distillStep = 1;
  distillData = {};
  closeShop();
  renderDistillStep();
  document.getElementById('distill-overlay').classList.add('active');
}

function renderDistillStep() {
  const body = document.getElementById('distill-body');

  // Progress indicator
  let progressHtml = '<div style="display:flex;gap:4px;margin-bottom:16px">';
  for (let i = 1; i <= 4; i++) {
    const active = i === distillStep;
    const done = i < distillStep;
    progressHtml += '<div style="flex:1;height:4px;border-radius:2px;background:' + (done ? '#6BBF00' : active ? '#E8944A' : '#8B6F47') + '"></div>';
  }
  progressHtml += '</div>';

  if (distillStep === 1) {
    body.innerHTML = progressHtml + '<div class="distill-step"><label>📝 步骤 1/4：描述你的能力</label><p style="font-size:12px;color:#584824;margin-bottom:8px">详细描述你擅长什么、你的方法论是什么、能帮别人解决什么问题。越详细越好，AI 会帮你提炼。</p><textarea id="distill-input" placeholder="例如：我擅长教零基础的人学会弹吉他。我有一套自己总结的练习方法，从认识吉他和弦开始，每天15分钟练习，一个月就能弹唱简单的歌曲。我还总结了一套\'肌肉记忆训练法\'，帮助初学者快速建立手指灵活度...">' + (distillData.rawInput || '') + '</textarea></div><button class="btn btn-primary" onclick="distillNext()">下一步 →</button>';
  } else if (distillStep === 2) {
    const cats = [['🎨','创意艺术'],['🧠','思维方法'],['💻','技术编程'],['🍳','生活技能'],['🌱','手工园艺'],['📚','语言学习']];
    let catHtml = '';
    cats.forEach(([icon, name]) => {
      const sel = distillData.category === name;
      catHtml += '<div class="cat-option ' + (sel ? 'selected' : '') + '" onclick="selectCategory(\'' + name + '\')" style="padding:12px;border:2px solid ' + (sel ? '#6BBF00' : '#8B6F47') + ';border-radius:3px;cursor:pointer;text-align:center;background:' + (sel ? '#F5E6C8' : '#F5E6C8') + '"><span style="font-size:20px">' + icon + '</span><br><span style="font-size:13px;font-weight:600">' + name + '</span></div>';
    });
    body.innerHTML = progressHtml + '<div class="distill-step"><label>🏷️ 步骤 2/4：选择技能分类</label><p style="font-size:12px;color:#584824;margin-bottom:12px">选择最能代表你能力的分类</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px" id="category-grid">' + catHtml + '</div></div><div style="display:flex;gap:8px"><button class="btn btn-close" onclick="distillPrev()" style="margin-top:0">← 上一步</button><button class="btn btn-primary" onclick="distillNext()">下一步 →</button></div>';
  } else if (distillStep === 3) {
    const result = distillData.generated || simulateDistill(distillData.rawInput);
    if (!distillData.generated) distillData.generated = result;
    body.innerHTML = progressHtml + '<div class="distill-step"><label>✏️ 步骤 3/4：编辑你的能力卡</label><p style="font-size:12px;color:#584824;margin-bottom:12px">AI 已帮你生成初稿，你可以自由修改每个字段</p><div class="distill-result"><div class="field"><div class="field-label">能力标题</div><input type="text" id="d-title" value="' + result.title + '" style="width:100%;border:2px solid #5C3B1E;border-radius:3px;padding:8px;font-size:14px;margin-top:4px;background:#F5E6C8;color:#2D1F12"></div><div class="field"><div class="field-label">一句话卖点</div><input type="text" id="d-pitch" value="' + result.pitch + '" style="width:100%;border:2px solid #5C3B1E;border-radius:3px;padding:8px;font-size:14px;margin-top:4px;background:#F5E6C8;color:#2D1F12"></div><div class="field"><div class="field-label">交付示例</div><textarea id="d-example" style="width:100%;border:2px solid #5C3B1E;border-radius:3px;padding:8px;font-size:13px;margin-top:4px;min-height:80px;resize:vertical;background:#F5E6C8;color:#2D1F12">' + result.example + '</textarea></div><div class="field"><div class="field-label">建议定价（¥）</div><input type="number" id="d-price" value="' + result.priceRange.suggested + '" min="1" max="9999" style="width:120px;border:2px solid #5C3B1E;border-radius:3px;padding:8px;font-size:14px;margin-top:4px;background:#F5E6C8;color:#2D1F12"><span style="font-size:12px;color:#584824;margin-left:8px">建议区间 ¥' + result.priceRange.min + '~¥' + result.priceRange.max + '</span></div><div class="field"><div class="field-label">适用人群</div><input type="text" id="d-audience" value="' + result.audience + '" style="width:100%;border:2px solid #5C3B1E;border-radius:3px;padding:8px;font-size:14px;margin-top:4px;background:#F5E6C8;color:#2D1F12"></div></div></div><div style="display:flex;gap:8px"><button class="btn btn-close" onclick="distillPrev()" style="margin-top:0">← 上一步</button><button class="btn btn-primary" onclick="distillNext()">下一步 →</button></div>';
  } else if (distillStep === 4) {
    const title = distillData.editTitle || distillData.generated.title;
    const pitch = distillData.editPitch || distillData.generated.pitch;
    const example = distillData.editExample || distillData.generated.example;
    const price = distillData.editPrice || distillData.generated.priceRange.suggested;
    const audience = distillData.editAudience || distillData.generated.audience;
    const hasModel = globalAiConfig.apiUrl && globalAiConfig.apiKey;
    body.innerHTML = progressHtml + '<p style="color:#2D5A00;font-weight:700;margin-bottom:12px">✨ 步骤 4/4：预览你的能力卡</p><div class="distill-result" style="border:2px solid #8B6F47"><h4>🏷️ ' + title + '</h4><div class="field"><div class="field-label">一句话卖点</div><div class="field-value" style="font-size:15px;color:#2D5A00;font-weight:600">' + pitch + '</div></div><div class="field"><div class="field-label">交付示例</div><div class="field-value">' + example + '</div></div><div class="field"><div class="field-label">定价</div><div class="field-value" style="font-size:20px;font-weight:800;color:#C43C3C">¥' + price + '</div></div><div class="field"><div class="field-label">适用人群</div><div class="field-value">' + audience + '</div></div>' + (distillData.category ? '<div class="field"><div class="field-label">分类</div><div class="field-value">' + distillData.category + '</div></div>' : '') + (hasModel ? '<div class="field"><div class="field-label">AI 模型</div><div class="field-value" style="color:#2D5A00">✅ 已配置（' + (globalAiConfig.model || '默认') + '）</div></div>' : '') + '</div><p style="font-size:12px;color:#584824;margin-top:8px">💡 如需配置 AI 模型，开摊后点击顶部 <b>⚙️ 模型设置</b> 按钮</p><div style="display:flex;gap:8px"><button class="btn btn-close" onclick="distillPrev()" style="margin-top:0">← 上一步</button><button class="btn btn-primary" onclick="confirmDistill()">🎉 确认开摊！</button></div>';

}

function selectCategory(cat) {
  distillData.category = cat;
  renderDistillStep();
}

function distillNext() {
  if (distillStep === 1) {
    const input = document.getElementById('distill-input');
    if (!input || input.value.trim().length < 5) {
      showToast('请至少输入5个字描述你的能力');
      return;
    }
    distillData.rawInput = input.value.trim();
  } else if (distillStep === 3) {
    // Save edited values
    distillData.editTitle = document.getElementById('d-title').value;
    distillData.editPitch = document.getElementById('d-pitch').value;
    distillData.editExample = document.getElementById('d-example').value;
    distillData.editPrice = parseInt(document.getElementById('d-price').value) || 50;
    distillData.editAudience = document.getElementById('d-audience').value;
  }
  distillStep++;

  if (distillStep === 3) {
    // Show loading for AI processing
    const body = document.getElementById('distill-body');
    const hasAI = globalAiConfig.apiUrl && globalAiConfig.apiKey;
    body.innerHTML = '<div class="distill-loading"><div class="spinner"></div><p>AI 正在提炼你的能力...</p><p style="font-size:12px;color:#584824;margin-top:8px">' + (hasAI ? '调用 AI 模型分析 · 生成能力卡 · 建议定价' : '分析关键词 · 生成能力卡 · 建议定价') + '</p></div>';
    // Use real AI if available, otherwise simulate
    distillWithAI(distillData.rawInput, distillData.category).then(result => {
      distillData.generated = result;
      renderDistillStep();
    });
  } else {
    renderDistillStep();
  }
}

function distillPrev() {
  if (distillStep > 1) {
    distillStep--;
    renderDistillStep();
  }
}

function simulateDistill(text) {
  // Extract keywords to generate a structured ability card (fallback when no AI)
  const keywords = text.match(/[\u4e00-\u9fa5]{2,}/g) || [];
  const title = keywords.slice(0, 3).join('') || '自定义能力';
  const pitch = text.length > 30 ? text.slice(0, 28) + '...' : text;
  const base = Math.floor(Math.random() * 100) + 50;
  return {
    title: title + '工作室',
    pitch: pitch,
    example: '第1步：了解你的基础和目标；第2步：制定个性化学习/执行计划；第3步：每日打卡+反馈指导；第4步：完成一个可展示的成果。',
    priceRange: { min: Math.floor(base * 0.7), max: Math.floor(base * 1.3), suggested: base },
    audience: '所有对这项技能感兴趣的初学者和进阶者'
  };
}

async function distillWithAI(text, category) {
  // If AI is configured, use real LLM to generate ability card
  if (globalAiConfig.apiUrl && globalAiConfig.apiKey) {
    try {
      const catHint = category ? '，分类属于：' + category : '';
      const response = await fetch(globalAiConfig.apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + globalAiConfig.apiKey
        },
        body: JSON.stringify({
          model: globalAiConfig.model || 'gpt-3.5-turbo',
          messages: [
            { role: 'system', content: '你是一个"能力提炼助手"。用户会描述自己擅长的事情，你需要帮他提炼成一张"能力卡"。\n\n请严格按照以下 JSON 格式返回（不要加 markdown 代码块）：\n{"title":"简短有力的能力标题（6-12字）","pitch":"一句话卖点（15-25字，说明你能帮别人解决什么）","example":"具体交付方式（分3-4步描述你会怎么教/帮对方，每步一句话）","audience":"适合什么人群（10-20字）","priceSuggested":数字（建议定价，30-500元之间）}\n\n定价原则：\n- 纯指导/咨询类：50-150元\n- 含实操/陪练：100-300元\n- 系统教学/多天指导：200-500元' },
            { role: 'user', content: '我的能力描述：' + text + catHint }
          ],
          max_tokens: 500,
          temperature: 0.7
        })
      });
      const data = await response.json();
      if (data.choices && data.choices[0]) {
        let content = data.choices[0].message.content.trim();
        // Strip markdown code block if present
        content = content.replace(/^```json?\s*/i, '').replace(/\s*```$/i, '');
        const parsed = JSON.parse(content);
        const suggested = Math.max(30, Math.min(500, parsed.priceSuggested || 99));
        return {
          title: parsed.title || '自定义能力工作室',
          pitch: parsed.pitch || text.slice(0, 25),
          example: parsed.example || '第1步：了解基础；第2步：制定计划；第3步：实践指导；第4步：成果验收。',
          priceRange: { min: Math.floor(suggested * 0.7), max: Math.floor(suggested * 1.3), suggested: suggested },
          audience: parsed.audience || '所有感兴趣的初学者和进阶者'
        };
      }
    } catch(e) {
      console.warn('AI distill failed, using fallback:', e);
    }
  }
  // Fallback to local simulation
  return simulateDistill(text);
}
