<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星云编年史 · 手势次元 | Nebula Chronicle</title>
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- Lottie -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Orbitron:wght@400;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #b026ff;
            --neon-cyan: #00ffff;
            --deep-space: #050510;
            --star-white: #e0e0ff;
            --glass-bg: rgba(10, 10, 40, 0.6);
            --glass-border: rgba(100, 100, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: var(--deep-space);
            color: var(--star-white);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            cursor: none;
        }

        /* ===== 星云背景 Canvas ===== */
        #nebula-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ===== 主界面 ===== */
        #main-interface {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* ===== 标题区域 ===== */
        .title-section {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: auto;
        }

        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        .sub-title {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 1.1rem;
            color: rgba(200, 200, 255, 0.7);
            margin-top: 8px;
            letter-spacing: 4px;
        }

        @keyframes titleGlow {
            0% { filter: brightness(1) drop-shadow(0 0 10px rgba(0, 243, 255, 0.3)); }
            100% { filter: brightness(1.3) drop-shadow(0 0 30px rgba(176, 38, 255, 0.6)); }
        }

        /* ===== 时间树容器 ===== */
        #timeline-tree {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 80vh;
            pointer-events: auto;
        }

        /* ===== 螺旋时间轴 ===== */
        .spiral-container {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .spiral-track {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(0, 243, 255, 0.1);
            box-shadow: 
                0 0 60px rgba(0, 243, 255, 0.1),
                inset 0 0 60px rgba(176, 38, 255, 0.05);
            animation: spiralRotate 60s linear infinite;
        }

        @keyframes spiralRotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ===== 时间节点 ===== */
        .anime-node {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(0, 243, 255, 0.3), rgba(176, 38, 255, 0.1));
            border: 2px solid rgba(0, 243, 255, 0.5);
            box-shadow: 
                0 0 20px rgba(0, 243, 255, 0.3),
                inset 0 0 20px rgba(255, 0, 255, 0.1);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            text-align: center;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .anime-node::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink), var(--neon-cyan));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .anime-node:hover::before,
        .anime-node.active::before {
            opacity: 1;
            animation: borderRotate 3s linear infinite;
        }

        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .anime-node:hover,
        .anime-node.active {
            transform: scale(1.5);
            box-shadow: 
                0 0 40px rgba(0, 243, 255, 0.6),
                0 0 80px rgba(176, 38, 255, 0.3),
                inset 0 0 30px rgba(255, 0, 255, 0.2);
            z-index: 100;
        }

        .node-year {
            font-size: 0.65rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
        }

        .node-title {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ===== 连接线 ===== */
        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.3), transparent);
            transform-origin: left center;
            pointer-events: none;
            animation: linePulse 2s ease-in-out infinite;
        }

        @keyframes linePulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* ===== 详情面板 ===== */
        .detail-panel {
            position: fixed;
            right: -450px;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            max-height: 80vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            z-index: 200;
            transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            pointer-events: auto;
            box-shadow: 
                0 0 40px rgba(0, 243, 255, 0.1),
                inset 0 0 40px rgba(176, 38, 255, 0.05);
        }

        .detail-panel.open {
            right: 30px;
        }

        .detail-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            border-radius: 20px 20px 0 0;
        }

        .detail-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(176, 38, 255, 0.1));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            overflow: hidden;
            position: relative;
        }

        .detail-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(0, 243, 255, 0.1) 50%, transparent 60%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .detail-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .detail-year {
            font-size: 0.9rem;
            color: var(--neon-pink);
            margin-bottom: 15px;
            font-family: 'Orbitron', sans-serif;
        }

        .detail-genre {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            margin-bottom: 15px;
        }

        .detail-desc {
            font-size: 0.9rem;
            line-height: 1.8;
            color: rgba(200, 200, 255, 0.8);
            text-align: justify;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 0, 255, 0.2);
            border: 1px solid rgba(255, 0, 255, 0.4);
            color: var(--neon-pink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 0, 255, 0.4);
            transform: rotate(90deg);
        }

        /* ===== 摄像头区域 ===== */
        #camera-section {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 240px;
            z-index: 100;
            pointer-events: auto;
        }

        .camera-container {
            position: relative;
            width: 240px;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(0, 243, 255, 0.3);
            box-shadow: 
                0 0 30px rgba(0, 243, 255, 0.2),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
            background: rgba(0, 0, 0, 0.5);
        }

        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        .camera-label {
            text-align: center;
            margin-top: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
        }

        .gesture-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            backdrop-filter: blur(10px);
        }

        /* ===== 手势提示 ===== */
        .gesture-hints {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            pointer-events: auto;
        }

        .hint-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            width: 280px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        .hint-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .hint-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: rgba(200, 200, 255, 0.8);
        }

        .hint-icon {
            width: 36px;
            height: 36px;
            margin-right: 12px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .hint-item.active .hint-icon {
            background: rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            animation: iconPulse 1s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* ===== 启动画面 ===== */
        #startup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--deep-space);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-out, visibility 1s;
        }

        #startup-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .startup-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .startup-subtitle {
            font-family: 'ZCOOL XiaoWei', serif;
            font-size: 1.3rem;
            color: rgba(200, 200, 255, 0.6);
            letter-spacing: 8px;
            margin-bottom: 50px;
        }

        .start-btn {
            padding: 15px 50px;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            border-radius: 50px;
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
        }

        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .start-btn:hover::before {
            left: 100%;
        }

        .start-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            transform: scale(1.05);
        }

        .loading-text {
            margin-top: 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--neon-purple);
            letter-spacing: 3px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        /* ===== 光标追踪器 ===== */
        #cursor-tracker {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-cyan);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        #cursor-tracker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        /* ===== 粒子效果 ===== */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            background: var(--neon-cyan);
            opacity: 0.6;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* ===== 时间轴标签 ===== */
        .era-label {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: rgba(0, 243, 255, 0.4);
            letter-spacing: 3px;
            pointer-events: none;
        }

        /* ===== 滚动条美化 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--neon-cyan), var(--neon-purple));
            border-radius: 3px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .main-title { font-size: 1.5rem; letter-spacing: 4px; }
            .sub-title { font-size: 0.8rem; }
            .detail-panel { width: 90vw; right: -100vw; }
            .detail-panel.open { right: 5vw; }
            #camera-section { width: 160px; }
            .camera-container { width: 160px; height: 120px; }
            .gesture-hints { display: none; }
            .startup-logo { font-size: 2.5rem; }
        }

        /* ===== Lottie 容器 ===== */
        .lottie-container {
            position: absolute;
            pointer-events: none;
        }

        /* ===== 手势光标 ===== */
        #hand-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 2px solid var(--neon-pink);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9998;
            transition: all 0.15s ease-out;
            display: none;
            box-shadow: 
                0 0 20px rgba(255, 0, 255, 0.5),
                inset 0 0 10px rgba(255, 0, 255, 0.2);
        }

        #hand-cursor.active {
            background: rgba(255, 0, 255, 0.2);
            transform: scale(1.3);
        }

        #hand-cursor::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        /* ===== 扫描线效果 ===== */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.3;
            animation: scanMove 4s linear infinite;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes scanMove {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

    <!-- 启动画面 -->
    <div id="startup-screen">
        <div class="startup-logo">NEBULA</div>
        <div class="startup-subtitle">星云编年史 · 手势次元</div>
        <button class="start-btn" onclick="startExperience()">进入次元</button>
        <div class="loading-text" id="loading-text" style="display: none;">
            正在初始化神经网络<span class="loading-dots"></span>
        </div>
    </div>

    <!-- 星云背景 -->
    <canvas id="nebula-canvas"></canvas>

    <!-- 扫描线 -->
    <div class="scan-line"></div>

    <!-- 主界面 -->
    <div id="main-interface" style="display: none;">
        <!-- 标题 -->
        <div class="title-section">
            <h1 class="main-title">NEBULA CHRONICLE</h1>
            <p class="sub-title">二次元动漫编年史 · 手势交互系统</p>
        </div>

        <!-- 时间树 -->
        <div id="timeline-tree">
            <div class="spiral-container" id="spiral-container">
                <div class="spiral-track"></div>
                <!-- 节点将通过JS动态生成 -->
            </div>
        </div>

        <!-- 详情面板 -->
        <div class="detail-panel" id="detail-panel">
            <button class="close-btn" onclick="closeDetail()">×</button>
            <div class="detail-image" id="detail-image">🎬</div>
            <h2 class="detail-title" id="detail-title">作品名称</h2>
            <div class="detail-year" id="detail-year">1995</div>
            <span class="detail-genre" id="detail-genre">科幻 / 机甲</span>
            <p class="detail-desc" id="detail-desc">
                作品描述将在这里显示...
            </p>
        </div>

        <!-- 摄像头区域 -->
        <div id="camera-section">
            <div class="camera-container">
                <video id="input_video" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>
                <div class="gesture-indicator" id="gesture-indicator">等待手势...</div>
            </div>
            <div class="camera-label">GESTURE CAMERA</div>
        </div>

        <!-- 手势提示 -->
        <div class="gesture-hints">
            <div class="hint-card">
                <div class="hint-title">✦ 手势指令 ✦</div>
                <div class="hint-item" id="hint-point">
                    <div class="hint-icon">☝️</div>
                    <div>食指指向 - 悬停选中</div>
                </div>
                <div class="hint-item" id="hint-swipe">
                    <div class="hint-icon">✋</div>

        // ===== 全局状态 =====
        let isStarted = false;

        let spiralRotation = 0;
        let isPinching = false;

        // ===== 启动体验 =====
        async function startExperience() {
            document.querySelector('.start-btn').style.display = 'none';
            document.getElementById('loading-text').style.display = 'block';
            
            // 初始化摄像头
            await initCamera();
            
            // 生成时间树
            generateTimelineTree();
            
            // 显示主界面
            setTimeout(() => {
                document.getElementById('startup-screen').classList.add('hidden');
                document.getElementById('main-interface').style.display = 'block';
                isStarted = true;
                
                // 启动粒子效果
                startParticleSystem();
            }, 2000);

        // ===== 生成时间树 =====
        function generateTimelineTree() {
            const container = document.getElementById('spiral-container');
            const centerX = 50;
            const centerY = 50;
            const maxRadius = 40;
            const minRadius = 8;
            
            animeDatabase.forEach((anime, index) => {
                const node = document.createElement('div');
                node.className = 'anime-node';
                node.dataset.index = index;
                
                // 螺旋分布计算
                const progress = index / animeDatabase.length;
                const angle = progress * Math.PI * 6; // 3圈螺旋
                const radius = minRadius + (maxRadius - minRadius) * progress;
                
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                
                node.style.left = x + '%';
                node.style.top = y + '%';
                node.style.transform = 'translate(-50%, -50%)';
                
                // 节点内容
                node.innerHTML = `
                    <div>
                        <div class="node-year">${anime.year}</div>
                        <div class="node-title">${anime.title}</div>
                    </div>
                `;
                
                // 点击事件
                node.addEventListener('click', () => showDetail(index));
                node.addEventListener('mouseenter', () => {
                    node.classList.add('active');
                });
                node.addEventListener('mouseleave', () => {
                    if (selectedNode !== index) {
                        node.classList.remove('active');
                    }
                });
                
                container.appendChild(node);
                
                // 添加连接线（除第一个外）
                if (index > 0) {
                    const prevProgress = (index - 1) / animeDatabase.length;
                    const prevAngle = prevProgress * Math.PI * 6;
                    const prevRadius = minRadius + (maxRadius - minRadius) * prevProgress;
                    const prevX = centerX + prevRadius * Math.cos(prevAngle);
                    const prevY = centerY + prevRadius * Math.sin(prevAngle);
                    
                    const line = document.createElement('div');
                    line.className = 'connection-line';
                    const dx = x - prevX;
                    const dy = y - prevY;
                    const length = Math.sqrt(dx * dx + dy * dy);
                    const rotation = Math.atan2(dy, dx) * 180 / Math.PI;
                    
                    line.style.width = length + '%';
                    line.style.left = prevX + '%';
                    line.style.top = prevY + '%';
                    line.style.transform = `rotate(${rotation}deg)`;
                    
                    container.appendChild(line);
                }
            });
            
            // 添加年代标签
            const eras = [
                { year: '1960s', angle: 0 },
                { year: '1970s', angle: 72 },
                { year: '1980s', angle: 144 },
                { year: '1990s', angle: 216 },
                { year: '2000s', angle: 288 },
                { year: '2010s', angle: 360 },
                { year: '2020s', angle: 432 }
            ];
            
            eras.forEach(era => {
                const label = document.createElement('div');
                label.className = 'era-label';
                label.textContent = era.year;
                const rad = era.angle * Math.PI / 180;
                const r = 45;
                label.style.left = (centerX + r * Math.cos(rad)) + '%';
                label.style.top = (centerY + r * Math.sin(rad)) + '%';
                label.style.transform = 'translate(-50%, -50%)';
                container.appendChild(label);
            });
        }

        // ===== 显示详情 =====
        function showDetail(index) {
            const anime = animeDatabase[index];
            selectedNode = index;
            
            document.getElementById('detail-image').textContent = anime.emoji;
            document.getElementById('detail-title').textContent = anime.title;
            document.getElementById('detail-year').textContent = anime.year + '年';
            document.getElementById('detail-genre').textContent = anime.genre;
            document.getElementById('detail-desc').textContent = anime.desc;
            
            document.getElementById('detail-panel').classList.add('open');
            
            // 高亮当前节点
            document.querySelectorAll('.anime-node').forEach((node, i) => {
                if (i === index) {
                    node.classList.add('active');
                } else {
                    node.classList.remove('active');
                }
            });
        }

        // ===== 关闭详情 =====
        function closeDetail() {
            document.getElementById('detail-panel').classList.remove('open');
            selectedNode = null;
            document.querySelectorAll('.anime-node').forEach(node => {
                node.classList.remove('active');

        // ===== 初始化摄像头和手势识别 =====
        async function initCamera() {
            const videoElement = document.getElementById('input_video');
            const canvasElement = document.getElementById('output_canvas');
            const canvasCtx = canvasElement.getContext('2d');
            
            // 设置canvas尺寸
            canvasElement.width = 320;
            canvasElement.height = 240;
            
            const hands = new Hands({
                locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }
            });
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });
            
            hands.onResults((results) => {
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    // 绘制手部关键点
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {
                        color: '#00f3ff',
                        lineWidth: 2
                    });
                    drawLandmarks(canvasCtx, landmarks, {
                        color: '#ff00ff',
                        lineWidth: 1,
                        radius: 3
                    });
                    
                    // 识别手势
                    detectGesture(landmarks);
                    
                    // 更新手势光标位置
                    const indexTip = landmarks[8];
                    handX = (1 - indexTip.x) * window.innerWidth;
                    handY = indexTip.y * window.innerHeight;
                    updateHandCursor(handX, handY);
                } else {
                    hideHandCursor();
                    currentGesture = 'none';
                    updateGestureIndicator('等待手势...');
                }
                
                canvasCtx.restore();
            });
            
            // 启动摄像头
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 320,
                height: 240
            });
            
            try {
                await camera.start();
            } catch (error) {
                console.warn('摄像头启动失败，使用鼠标模式:', error);
                updateGestureIndicator('鼠标模式');
            }
        }

        // ===== 手势识别 =====
        function detectGesture(landmarks) {
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const middleTip = landmarks[12];
            const ringTip = landmarks[16];
            const pinkyTip = landmarks[20];
            const wrist = landmarks[0];
            
            // 计算手指伸展状态
            const isIndexExtended = indexTip.y < landmarks[6].y;
            const isMiddleExtended = middleTip.y < landmarks[10].y;
            const isRingExtended = ringTip.y < landmarks[14].y;
            const isPinkyExtended = pinkyTip.y < landmarks[18].y;
            const isThumbExtended = thumbTip.x < landmarks[3].x;
            
            // 计算捏合距离
            const pinchDistance = Math.sqrt(
                Math.pow(thumbTip.x - indexTip.x, 2) +
                Math.pow(thumbTip.y - indexTip.y, 2)
            );
            
            let gesture = 'none';
            
            // 识别手势类型
            if (pinchDistance < 0.05) {
                gesture = 'pinch';
                if (!isPinching && Date.now() - lastPinchTime > 500) {
                    isPinching = true;
                    lastPinchTime = Date.now();
                    // 模拟点击
                    simulateClick(handX, handY);
                }
            } else if (isIndexExtended && isMiddleExtended && isRingExtended && isPinkyExtended) {
                gesture = 'open';
                isPinching = false;
                // 检测是否悬停在节点上
                checkNodeHover(handX, handY);
            } else if (isIndexExtended && !isMiddleExtended && !isRingExtended && !isPinkyExtended) {
                gesture = 'point';
                isPinching = false;
                // 检测悬停
                checkNodeHover(handX, handY);
            } else if (isIndexExtended && isMiddleExtended && !isRingExtended && !isPinkyExtended) {
                gesture = 'swipe';
                isPinching = false;
                // 旋转时间轴
                rotateTimeline(handX);
            } else {
                isPinching = false;
            }
            
            if (gesture !== currentGesture) {
                currentGesture = gesture;
                updateGestureIndicator(getGestureText(gesture));
                updateHintHighlight(gesture);
            }
        }

        // ===== 获取手势文本 =====
        function getGestureText(gesture) {
            const texts = {
                'none': '等待手势...',
                'point': '☝️ 指向模式',
                'swipe': '✋ 滑动模式',
                'pinch': '👌 点击确认',
                'open': '🖐 详情模式'
            };
            return texts[gesture] || '等待手势...';
        }

        // ===== 更新手势指示器 =====
        function updateGestureIndicator(text) {
            document.getElementById('gesture-indicator').textContent = text;
        }

        // ===== 更新提示高亮 =====
        function updateHintHighlight(gesture) {
            document.querySelectorAll('.hint-item').forEach(item => item.classList.remove('active'));
            const hintMap = {
                'point': 'hint-point',
                'swipe': 'hint-swipe',
                'pinch': 'hint-pinch',
                'open': 'hint-open'
            };
            if (hintMap[gesture]) {
                document.getElementById(hintMap[gesture]).classList.add('active');
            }
        }

        // ===== 更新手势光标 =====
        function updateHandCursor(x, y) {
            const cursor = document.getElementById('hand-cursor');
            cursor.style.display = 'block';
            cursor.style.left = (x - 20) + 'px';
            cursor.style.top = (y - 20) + 'px';
            
            if (currentGesture === 'pinch') {
                cursor.classList.add('active');
            } else {
                cursor.classList.remove('active');
            }
        }

        // ===== 隐藏手势光标 =====
        function hideHandCursor() {
            document.getElementById('hand-cursor').style.display = 'none';
        }

        // ===== 检测节点悬停 =====
        function checkNodeHover(x, y) {
            const nodes = document.querySelectorAll('.anime-node');
            nodes.forEach((node, index) => {
                const rect = node.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
                
                if (distance < 50) {
                    node.classList.add('active');
                    if (currentGesture === 'open') {
                        showDetail(index);
                    }
                } else {
                    if (selectedNode !== index) {
                        node.classList.remove('active');
                    }
                }
            });
        }

        // ===== 旋转时间轴 =====
        function rotateTimeline(handX) {
            const container = document.getElementById('spiral-container');
            const centerX = window.innerWidth / 2;
            const deltaX = handX - centerX;
            spiralRotation += deltaX * 0.01;
            container.style.transform = `rotate(${spiralRotation}deg)`;
        }

        // ===== 模拟点击 =====
        function simulateClick(x, y) {
            const element = document.elementFromPoint(x, y);
            if (element && element.classList.contains('anime-node')) {
                element.click();
            }
        }

        // ===== 星云背景动画 =====
        function initNebulaBackground() {
            const canvas = document.getElementById('nebula-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const stars = [];
            const nebulaClouds = [];
            
            // 创建星星
            for (let i = 0; i < 300; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    opacity: Math.random(),
                    speed: Math.random() * 0.5 + 0.1
                });
            }
            
            // 创建星云
            for (let i = 0; i < 5; i++) {
                nebulaClouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 300 + 200,
                    color: i % 2 === 0 ? 'rgba(0, 243, 255, 0.03)' : 'rgba(176, 38, 255, 0.03)',
                    speed: Math.random() * 0.2 + 0.05
                });
            }
            
            function animate() {
                ctx.fillStyle = '#050510';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制星云
                nebulaClouds.forEach(cloud => {
                    const gradient = ctx.createRadialGradient(
                        cloud.x, cloud.y, 0,
                        cloud.x, cloud.y, cloud.radius
                    );
                    gradient.addColorStop(0, cloud.color);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    cloud.x += cloud.speed;
                    if (cloud.x > canvas.width + cloud.radius) {
                        cloud.x = -cloud.radius;
                    }
                });
                
                // 绘制星星
                stars.forEach(star => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(200, 200, 255, ${star.opacity})`;
                    ctx.fill();
                    
                    star.opacity += (Math.random() - 0.5) * 0.02;
                    if (star.opacity < 0.1) star.opacity = 0.1;
                    if (star.opacity > 1) star.opacity = 1;
                    
                    star.y -= star.speed;
                    if (star.y < 0) {
                        star.y = canvas.height;
                        star.x = Math.random() * canvas.width;
                    }
                });
                
                requestAnimationFrame(animate);
            }
            
            animate();
            
            // 响应窗口大小变化
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        // ===== 粒子系统 =====
        function startParticleSystem() {
            setInterval(() => {
                if (!isStarted) return;
                
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                
                const colors = ['#00f3ff', '#ff00ff', '#b026ff', '#00ffff'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 20000);
            }, 500);
        }

        // ===== 鼠标光标追踪 =====
        document.addEventListener('mousemove', (e) => {
            const tracker = document.getElementById('cursor-tracker');
            tracker.style.left = (e.clientX - 10) + 'px';
            tracker.style.top = (e.clientY - 10) + 'px';
        });

        // ===== 键盘快捷键 =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDetail();
            }
        });

        // ===== 初始化 =====
        window.addEventListener('load', () => {
            initNebulaBackground();
        });
    </script>
</body>
</html>
