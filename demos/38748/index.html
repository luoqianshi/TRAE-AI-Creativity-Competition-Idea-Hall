<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智学空间 - 初中学习平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --math-color: #6366f1;
            --physics-color: #0ea5e9;
            --chem-color: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(14, 165, 233, 0.1), transparent),
                radial-gradient(ellipse 50% 50% at 20% 60%, rgba(16, 185, 129, 0.08), transparent);
        }

        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black, transparent);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 900px;
        }

        .brand {
            font-size: 0.875rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.2s;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.4s;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: rgba(255,255,255,0.6);
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto 3rem;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards 0.6s;
        }

        /* Subject Cards */
        .subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .subject-card {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 2.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            opacity: 0;
            animation: fadeUp 0.8s ease forwards;
        }

        .subject-card:nth-child(1) { animation-delay: 0.8s; }
        .subject-card:nth-child(2) { animation-delay: 1s; }
        .subject-card:nth-child(3) { animation-delay: 1.2s; }

        .subject-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .subject-card.math::before {
            background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15), transparent 70%);
        }

        .subject-card.physics::before {
            background: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.15), transparent 70%);
        }

        .subject-card.chemistry::before {
            background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15), transparent 70%);
        }

        .subject-card:hover::before {
            opacity: 1;
        }

        .subject-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 20px 60px -20px rgba(0,0,0,0.5);
        }

        .subject-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .math .subject-icon {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(99, 102, 241, 0.05));
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .physics .subject-icon {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(14, 165, 233, 0.05));
            color: #38bdf8;
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .chemistry .subject-icon {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .subject-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            position: relative;
            z-index: 1;
        }

        .subject-card p {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .subject-meta {
            display: flex;
            gap: 1rem;
            position: relative;
            z-index: 1;
        }

        .meta-tag {
            font-size: 0.75rem;
            padding: 0.35rem 0.75rem;
            border-radius: 100px;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .arrow {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .subject-card:hover .arrow {
            opacity: 1;
            right: 1.5rem;
        }

        /* Floating particles */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            color: rgba(255,255,255,0.3);
            font-size: 0.875rem;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 768px) {
            .subjects {
                grid-template-columns: 1fr;
            }

            .arrow {
                display: none;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="grid-pattern"></div>
        <div class="particles" id="particles"></div>

        <div class="hero-content">
            <div class="brand">Smart Learning Space</div>
            <h1>智学空间</h1>
            <p class="hero-subtitle">
                涵盖数学、物理、化学三大学科，为初中生打造系统化、结构化的在线学习平台
            </p>

            <div class="subjects">
                <a href="07_数学/index.html" class="subject-card math">
                    <div class="subject-icon">数</div>
                    <h2>数学</h2>
                    <p>七至九年级数学课程，涵盖代数、几何、函数等核心知识点</p>
                    <div class="subject-meta">
                        <span class="meta-tag">3个年级</span>
                        <span class="meta-tag">29个章节</span>
                    </div>
                    <div class="arrow">→</div>
                </a>

                <a href="08_物理/index.html" class="subject-card physics">
                    <div class="subject-icon">物</div>
                    <h2>物理</h2>
                    <p>八至九年级物理课程，探索力、热、声、光、电的奥秘</p>
                    <div class="subject-meta">
                        <span class="meta-tag">2个年级</span>
                        <span class="meta-tag">22个章节</span>
                    </div>
                    <div class="arrow">→</div>
                </a>

                <a href="09_化学/index.html" class="subject-card chemistry">
                    <div class="subject-icon">化</div>
                    <h2>化学</h2>
                    <p>九年级化学课程，从原子到化合物，探索物质变化的规律</p>
                    <div class="subject-meta">
                        <span class="meta-tag">1个年级</span>
                        <span class="meta-tag">12个单元</span>
                    </div>
                    <div class="arrow">→</div>
                </a>
            </div>
        </div>

        <footer>
            <p> 智学空间 · 让学习更高效</p>
        </footer>
    </section>

    <script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (10 + Math.random() * 10) + 's';
            particle.style.width = (2 + Math.random() * 4) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
