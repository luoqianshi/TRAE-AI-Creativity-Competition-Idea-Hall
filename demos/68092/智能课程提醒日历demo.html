<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能课程提醒日历</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; color: white; margin-bottom: 30px; }
        .header h1 { font-size: 36px; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .header p { font-size: 16px; opacity: 0.9; }
        
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .calendar-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-controls h2 { font-size: 22px; color: #4a5568; }
        .nav-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: transform 0.2s; }
        .nav-btn:hover { transform: translateY(-2px); }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .day-header { background: #f7fafc; padding: 12px; text-align: center; font-weight: 600; color: #718096; border-radius: 8px; }
        .day-cell { aspect-ratio: 1; padding: 8px; text-align: center; border-radius: 8px; cursor: pointer; transition: all 0.3s; position: relative; font-size: 14px; }
        .day-cell:hover { background: #e6fffa; }
        .day-cell.today { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: bold; }
        .day-cell.other-month { color: #cbd5e0; }
        .day-cell.selected { border: 3px solid #667eea; }
        .day-cell.has-event::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: #f56565; border-radius: 50%; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #4a5568; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #667eea; }
        .add-btn { background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; font-weight: 600; transition: transform 0.2s; }
        .add-btn:hover { transform: translateY(-2px); }
        
        .events-section h3 { font-size: 20px; color: #4a5568; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; }
        .event-list { max-height: 300px; overflow-y: auto; }
        .event-item { background: #f7fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; position: relative; }
        .event-item .event-title { font-weight: 600; color: #2d3748; margin-bottom: 5px; }
        .event-item .event-time { color: #718096; font-size: 13px; }
        .event-item .event-desc { color: #4a5568; font-size: 13px; margin-top: 5px; }
        .event-item .event-status { display: inline-block; padding: 3px 8px; border-radius: 15px; font-size: 11px; margin-top: 8px; }
        .event-item .event-status.pending { background: #feebc8; color: #d69e2e; }
        .event-item .event-status.sent { background: #bee3f8; color: #3182ce; }
        .event-item .event-status.waiting { background: #e9d8fd; color: #805ad5; }
        .event-item .event-status.confirmed { background: #c6f6d5; color: #38a169; }
        .event-item .event-status.timeout { background: #fed7d7; color: #e53e3e; }
        .event-item .delete-btn { position: absolute; top: 10px; right: 10px; background: #fed7d7; color: #e53e3e; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .event-item .delete-btn:hover { background: #fc8181; }
        
        .timer-section { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .timer-section h3 { font-size: 20px; margin-bottom: 15px; }
        .timer-display { font-size: 48px; font-weight: bold; text-align: center; margin: 20px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .timer-status { text-align: center; font-size: 16px; opacity: 0.9; }
        
        .email-simulation { background: #f7fafc; border-radius: 10px; padding: 20px; margin-top: 20px; }
        .email-simulation h4 { color: #4a5568; margin-bottom: 15px; }
        .email-box { background: white; border: 2px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .email-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .email-subject { font-weight: 600; color: #2d3748; }
        .email-time { color: #718096; font-size: 12px; }
        .email-body { color: #4a5568; font-size: 14px; }
        .reply-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: transform 0.2s; }
        .reply-btn:hover { transform: translateY(-2px); }
        
        .log-section { background: #2d3748; color: #e2e8f0; border-radius: 10px; padding: 20px; margin-top: 20px; max-height: 200px; overflow-y: auto; }
        .log-section h4 { color: #a0aec0; margin-bottom: 10px; }
        .log-item { font-size: 13px; padding: 5px 0; border-bottom: 1px solid #4a5568; }
        .log-item:last-child { border-bottom: none; }
        
        @media (max-width: 1000px) {
            .main-content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 智能课程提醒日历</h1>
            <p>内置定时器 + 邮件自动发送 + 回复确认机制</p>
        </div>
        
        <div class="main-content">
            <div class="card">
                <div class="calendar-controls">
                    <button class="nav-btn" onclick="prevMonth()">◀ 上月</button>
                    <h2 id="currentMonth"></h2>
                    <button class="nav-btn" onclick="nextMonth()">下月 ▶</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                
                <div class="events-section">
                    <h3>今日课程安排</h3>
                    <div class="event-list" id="eventList"></div>
                </div>
            </div>
            
            <div class="card">
                <h3>添加课程提醒</h3>
                <form id="addEventForm">
                    <div class="form-group">
                        <label>课程名称</label>
                        <input type="text" id="eventTitle" required placeholder="例如：高等数学">
                    </div>
                    <div class="form-group">
                        <label>开始时间</label>
                        <input type="datetime-local" id="eventTime" required>
                    </div>
                    <div class="form-group">
                        <label>提醒邮箱</label>
                        <input type="email" id="eventEmail" required placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>提醒内容</label>
                        <textarea id="eventDesc" rows="3" placeholder="输入需要记录的提醒内容..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>提前提醒时间</label>
                        <select id="remindBefore">
                            <option value="5">5分钟</option>
                            <option value="10">10分钟</option>
                            <option value="15">15分钟</option>
                            <option value="30">30分钟</option>
                            <option value="60">1小时</option>
                        </select>
                    </div>
                    <button type="submit" class="add-btn">添加课程</button>
                </form>
                
                <div class="timer-section">
                    <h3>⏰ 系统定时器</h3>
                    <div class="timer-display" id="timerDisplay">00:00:00</div>
                    <div class="timer-status" id="timerStatus">正在运行...</div>
                    <button class="add-btn" style="margin-top: 15px; background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);" onclick="quickTestReminder()">⚡ 快速测试提醒（10秒后触发）</button>
                </div>
                
                <div class="email-simulation">
                    <h4>📧 邮件模拟区域</h4>
                    <div id="emailSimulation"></div>
                </div>
                
                <div class="log-section">
                    <h4>📋 系统日志</h4>
                    <div id="systemLog"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentDate = new Date();
        let events = JSON.parse(localStorage.getItem('calendarEvents')) || [];
        let notifications = JSON.parse(localStorage.getItem('emailNotifications')) || [];
        let selectedDate = new Date();
        
        const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];
        
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonth').textContent = `${year}年${month + 1}月`;
            
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();
            const totalDays = lastDay.getDate();
            
            let html = WEEKDAYS.map(day => `<div class="day-header">${day}</div>`).join('');
            
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            for (let i = startDay - 1; i >= 0; i--) {
                html += `<div class="day-cell other-month">${prevMonthLastDay - i}</div>`;
            }
            
            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasEvent = events.some(e => e.date === dateStr);
                const isToday = today.toDateString() === new Date(year, month, day).toDateString();
                const isSelected = selectedDate.toDateString() === new Date(year, month, day).toDateString();
                
                let className = 'day-cell';
                if (isToday) className += ' today';
                if (isSelected) className += ' selected';
                if (hasEvent) className += ' has-event';
                
                html += `<div class="${className}" onclick="selectDate(${year}, ${month}, ${day})">${day}</div>`;
            }
            
            const remainingCells = 42 - (startDay + totalDays);
            for (let i = 1; i <= remainingCells; i++) {
                html += `<div class="day-cell other-month">${i}</div>`;
            }
            
            document.getElementById('calendarGrid').innerHTML = html;
            renderEvents();
        }
        
        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            renderCalendar();
        }
        
        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }
        
        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }
        
        function renderEvents() {
            const dateStr = selectedDate.toISOString().split('T')[0];
            const dayEvents = events.filter(e => e.date === dateStr);
            
            const eventList = document.getElementById('eventList');
            if (dayEvents.length === 0) {
                eventList.innerHTML = '<p style="text-align: center; color: #a0aec0;">暂无课程安排</p>';
                return;
            }
            
            eventList.innerHTML = dayEvents.map((event, index) => {
                const notification = notifications.find(n => n.eventId === event.id);
                const status = notification ? notification.status : 'pending';
                
                const statusText = {
                    pending: '等待提醒',
                    sent: '邮件已发送',
                    waiting: '等待回复',
                    confirmed: '已确认收到',
                    timeout: '超时未回复'
                };
                
                return `
                    <div class="event-item">
                        <div class="event-title">${event.title}</div>
                        <div class="event-time">⏰ ${event.time}</div>
                        <div class="event-desc">📝 ${event.description || '无额外描述'}</div>
                        <div class="event-desc">📧 ${event.email}</div>
                        <span class="event-status ${status}">${statusText[status]}</span>
                        <button class="delete-btn" onclick="deleteEvent(${index})">删除</button>
                    </div>
                `;
            }).join('');
        }
        
        document.getElementById('addEventForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const title = document.getElementById('eventTitle').value;
            const datetime = document.getElementById('eventTime').value;
            const email = document.getElementById('eventEmail').value;
            const desc = document.getElementById('eventDesc').value;
            const remindBefore = parseInt(document.getElementById('remindBefore').value);
            
            const [date, time] = datetime.split('T');
            
            const event = {
                id: Date.now(),
                title,
                date,
                time,
                email,
                description: desc,
                remindBefore,
                createdAt: new Date().toISOString()
            };
            
            events.push(event);
            localStorage.setItem('calendarEvents', JSON.stringify(events));
            
            addLog(`✅ 已添加课程: ${title} - ${date} ${time}`);
            alert('课程添加成功！');
            
            document.getElementById('addEventForm').reset();
            renderCalendar();
        });
        
        function deleteEvent(index) {
            if (confirm('确定要删除这个课程吗？')) {
                const event = events[index];
                events.splice(index, 1);
                localStorage.setItem('calendarEvents', JSON.stringify(events));
                
                notifications = notifications.filter(n => n.eventId !== event.id);
                localStorage.setItem('emailNotifications', JSON.stringify(notifications));
                
                addLog(`🗑️ 已删除课程: ${event.title}`);
                renderCalendar();
            }
        }
        
        let timerInterval;
        function startTimer() {
            function updateTimer() {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
                document.getElementById('timerDisplay').textContent = timeStr;
                
                checkReminders();
            }
            
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }
        
        function checkReminders() {
            const now = new Date();
            
            events.forEach(event => {
                const eventDatetime = `${event.date} ${event.time}`;
                const eventTime = new Date(eventDatetime);
                const remindTime = new Date(eventTime.getTime() - event.remindBefore * 60000);
                
                const notification = notifications.find(n => n.eventId === event.id);
                
                if (now >= remindTime && now < eventTime && !notification) {
                    sendNotification(event);
                }
            });
            
            notifications.forEach(notification => {
                if (notification.status === 'waiting') {
                    const timeout = notification.timeoutAt;
                    if (new Date() >= new Date(timeout)) {
                        handleTimeout(notification);
                    }
                }
            });
        }
        
        function quickTestReminder() {
            const testTime = new Date(Date.now() + 10000);
            const testEvent = {
                id: Date.now(),
                title: '快速测试课程',
                date: testTime.toISOString().split('T')[0],
                time: testTime.toISOString().split('T')[1].substring(0, 5),
                email: 'test@example.com',
                description: '这是一个快速测试提醒，用于演示邮件发送和回复确认功能',
                remindBefore: 0,
                createdAt: new Date().toISOString()
            };
            
            events.push(testEvent);
            localStorage.setItem('calendarEvents', JSON.stringify(events));
            
            addLog('⚡ 已添加快速测试课程，10秒后触发提醒');
            renderCalendar();
            
            setTimeout(() => {
                const notification = notifications.find(n => n.eventId === testEvent.id);
                if (!notification) {
                    sendNotification(testEvent);
                }
            }, 10000);
        }
        
        function sendNotification(event) {
            const notification = {
                id: Date.now(),
                eventId: event.id,
                status: 'waiting',
                sentAt: new Date().toISOString(),
                timeoutAt: new Date(Date.now() + 30000).toISOString(),
                sendCount: 1
            };
            
            notifications.push(notification);
            localStorage.setItem('emailNotifications', JSON.stringify(notifications));
            
            addLog(`📧 已发送提醒邮件至 ${event.email}: ${event.title}`);
            showEmailSimulation(event, notification);
            renderCalendar();
            
            if (Notification.permission === 'granted') {
                new Notification('课程提醒', {
                    body: `${event.title} 将在 ${event.remindBefore} 分钟后开始！`,
                    icon: '📅'
                });
            }
        }
        
        function handleTimeout(notification) {
            const event = events.find(e => e.id === notification.eventId);
            if (!event) return;
            
            notification.status = 'timeout';
            notification.sendCount++;
            notification.sentAt = new Date().toISOString();
            notification.timeoutAt = new Date(Date.now() + 30000).toISOString();
            
            setTimeout(() => {
                notification.status = 'waiting';
                localStorage.setItem('emailNotifications', JSON.stringify(notifications));
                addLog(`🔄 重发提醒邮件至 ${event.email}: ${event.title} (第${notification.sendCount}次)`);
                showEmailSimulation(event, notification);
                renderCalendar();
            }, 1000);
            
            localStorage.setItem('emailNotifications', JSON.stringify(notifications));
            addLog(`⏰ ${event.title} 超时未回复，将重新发送提醒`);
            renderCalendar();
        }
        
        function confirmNotification(eventId) {
            const notification = notifications.find(n => n.eventId === eventId);
            const event = events.find(e => e.id === eventId);
            
            if (notification && event) {
                notification.status = 'confirmed';
                localStorage.setItem('emailNotifications', JSON.stringify(notifications));
                
                addLog(`✅ 用户已确认收到: ${event.title}`);
                renderCalendar();
                
                const emailBox = document.querySelector(`[data-event-id="${eventId}"]`);
                if (emailBox) {
                    emailBox.innerHTML += `<div style="color: #38a169; margin-top: 10px; font-weight: 600;">✓ 邮件已确认收到！</div>`;
                }
            }
        }
        
        function showEmailSimulation(event, notification) {
            const emailSim = document.getElementById('emailSimulation');
            const html = `
                <div class="email-box" data-event-id="${event.id}">
                    <div class="email-header">
                        <span class="email-subject">📅 课程提醒：${event.title}</span>
                        <span class="email-time">发送时间：${new Date().toLocaleString()}</span>
                    </div>
                    <div class="email-body">
                        <p>尊敬的用户，您好！</p>
                        <p>您的课程 <strong>${event.title}</strong> 将在 <strong>${event.time}</strong> 开始。</p>
                        <p>📍 提醒内容：${event.description || '无'}</p>
                        <p>请回复此邮件确认您已收到通知。</p>
                        <p>如果2小时内未回复，系统将自动重新发送提醒。</p>
                        <p style="margin-top: 15px; font-size: 12px; color: #a0aec0;">
                            这是第 ${notification.sendCount} 次发送
                        </p>
                    </div>
                    ${notification.status !== 'confirmed' ? 
                        `<button class="reply-btn" onclick="confirmNotification(${event.id})">✓ 确认收到</button>` : 
                        ''}
                </div>
            `;
            emailSim.innerHTML = html + emailSim.innerHTML;
        }
        
        function addLog(message) {
            const log = document.getElementById('systemLog');
            const time = new Date().toLocaleTimeString();
            log.innerHTML = `<div class="log-item">[${time}] ${message}</div>` + log.innerHTML;
        }
        
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }
        
        startTimer();
        renderCalendar();
        requestNotificationPermission();
        
        addLog('🚀 智能课程提醒日历系统已启动');
    </script>
</body>
</html>
