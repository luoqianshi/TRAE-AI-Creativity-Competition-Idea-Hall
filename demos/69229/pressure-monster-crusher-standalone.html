<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffdd2d" />
    <title>压力怪粉碎机</title>
    <style>
* {
  box-sizing: border-box;
}

:root {
  color: #17110b;
  background: #ffdd2d;
  font-family: "Arial", "Microsoft YaHei", sans-serif;
}

body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 16% 18%, rgba(255, 255, 255, 0.95) 0 7%, transparent 8%),
    radial-gradient(circle at 86% 18%, rgba(255, 65, 108, 0.9) 0 8%, transparent 9%),
    linear-gradient(135deg, #ffdd2d 0%, #ff8a3d 45%, #41d6ff 100%);
}

button,
textarea,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 14px;
}

.screen {
  position: relative;
  width: min(100%, 520px);
  min-height: calc(100vh - 28px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

.eyebrow {
  width: fit-content;
  margin: 0 0 8px;
  padding: 7px 10px;
  border: 3px solid #17110b;
  background: #fff;
  box-shadow: 4px 4px 0 #17110b;
  font-weight: 900;
}

h1,
h2 {
  margin: 0;
  letter-spacing: 0;
}

h1 {
  font-size: clamp(44px, 12vw, 72px);
  line-height: 0.92;
  text-shadow: 4px 4px 0 #fff;
}

h2 {
  font-size: clamp(28px, 8vw, 44px);
  line-height: 1;
}

.subtitle {
  margin: 16px 0 22px;
  font-size: 18px;
  font-weight: 900;
}

.stress-form {
  display: grid;
  gap: 12px;
}

.input-label {
  font-size: 18px;
  font-weight: 900;
}

textarea {
  width: 100%;
  min-height: 116px;
  resize: vertical;
  border: 4px solid #17110b;
  border-radius: 8px;
  padding: 14px;
  background: #fff;
  box-shadow: 7px 7px 0 #17110b;
  color: #17110b;
  font-size: 17px;
  font-weight: 800;
}

.quick-tags {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.tag-button,
.secondary-button {
  min-height: 42px;
  border: 3px solid #17110b;
  border-radius: 8px;
  background: #fff;
  box-shadow: 3px 3px 0 #17110b;
  font-weight: 900;
}

.primary-button,
.smash-button {
  min-height: 58px;
  border: 4px solid #17110b;
  border-radius: 8px;
  background: #ff335f;
  box-shadow: 7px 7px 0 #17110b;
  color: #fff;
  font-size: 22px;
  font-weight: 1000;
}

.loading-screen,
.support-screen {
  gap: 18px;
}

.loader-badge {
  width: fit-content;
  padding: 12px 14px;
  border: 4px solid #17110b;
  border-radius: 50%;
  background: #fff;
  box-shadow: 5px 5px 0 #17110b;
  font-weight: 1000;
  animation: wobble 0.7s infinite alternate;
}

.support-lines {
  display: grid;
  gap: 10px;
}

.support-lines p {
  margin: 0;
  padding: 12px;
  border: 3px solid #17110b;
  background: #fff;
  font-weight: 800;
}

.battle-screen {
  justify-content: flex-start;
  gap: 12px;
  padding-top: 10px;
}

.battle-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.combo-box {
  min-width: 72px;
  padding: 10px;
  border: 4px solid #17110b;
  border-radius: 8px;
  background: #fff;
  box-shadow: 5px 5px 0 #17110b;
  text-align: center;
  font-size: 24px;
  font-weight: 1000;
}

.hp-shell {
  width: 100%;
  height: 28px;
  border: 4px solid #17110b;
  border-radius: 999px;
  background: #fff;
  overflow: hidden;
}

.hp-bar {
  height: 100%;
  background: repeating-linear-gradient(45deg, #ff335f 0 14px, #ffdd2d 14px 28px);
  transition: width 0.12s ease;
}

.weakness-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.weakness-row span,
.drop-list b {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  border: 3px solid #17110b;
  border-radius: 8px;
  padding: 4px 9px;
  background: #fff;
  box-shadow: 3px 3px 0 #17110b;
  font-weight: 900;
}

.monster-button {
  position: relative;
  min-height: 320px;
  margin: 8px 0;
  border: 0;
  background: transparent;
}

.monster-face {
  display: grid;
  place-items: center;
  width: min(72vw, 320px);
  aspect-ratio: 1;
  margin: 0 auto;
  border: 7px solid #17110b;
  border-radius: 48% 42% 52% 44%;
  background:
    radial-gradient(circle at 30% 24%, #fff 0 9%, transparent 10%),
    linear-gradient(145deg, #ff335f, #ffdd2d 48%, #41d6ff);
  box-shadow: 9px 9px 0 #17110b;
  font-size: 92px;
  animation: idle 0.9s infinite alternate;
}

.monster-type {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%) rotate(-2deg);
  min-width: 180px;
  border: 4px solid #17110b;
  padding: 8px 12px;
  background: #fff;
  box-shadow: 5px 5px 0 #17110b;
  font-weight: 1000;
}

.floater-layer {
  pointer-events: none;
  position: absolute;
  inset: 0;
}

.floater {
  position: absolute;
  display: inline-flex;
  border: 4px solid #17110b;
  padding: 6px 10px;
  background: #fff;
  box-shadow: 4px 4px 0 #17110b;
  color: #ff335f;
  font-weight: 1000;
  animation: pop 0.6s ease both;
}

.smash-button {
  margin-top: auto;
  min-height: 86px;
  font-size: 30px;
  text-shadow: 2px 2px 0 #17110b;
}

.phase-rage .monster-face,
.phase-finisher .monster-face {
  animation: rage 0.18s infinite alternate;
}

.result-screen {
  gap: 14px;
}

.report-card {
  border: 5px solid #17110b;
  border-radius: 8px;
  padding: 18px;
  background: #fff;
  box-shadow: 9px 9px 0 #17110b;
}

.report-target,
.final-skill,
.tiny-advice {
  font-size: 17px;
  font-weight: 900;
}

.report-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.report-grid span {
  border: 3px solid #17110b;
  padding: 10px;
  background: #ffdd2d;
  font-weight: 900;
}

.report-grid strong {
  display: block;
  font-size: 28px;
}

.drop-list,
.result-actions {
  display: grid;
  gap: 10px;
}

@keyframes idle {
  from {
    transform: rotate(-2deg) scale(1);
  }

  to {
    transform: rotate(2deg) scale(1.02);
  }
}

@keyframes rage {
  from {
    transform: translate(-4px, 2px) rotate(-4deg);
  }

  to {
    transform: translate(4px, -2px) rotate(4deg);
  }
}

@keyframes wobble {
  from {
    transform: rotate(-4deg);
  }

  to {
    transform: rotate(6deg);
  }
}

@keyframes pop {
  0% {
    opacity: 0;
    transform: scale(0.4) rotate(-8deg);
  }

  30% {
    opacity: 1;
    transform: scale(1.08) rotate(3deg);
  }

  100% {
    opacity: 0;
    transform: translateY(-42px) scale(0.92) rotate(-2deg);
  }
}

@media (min-width: 760px) {
  .screen {
    width: min(100%, 680px);
  }

  .quick-tags {
    grid-template-columns: repeat(8, 1fr);
  }
}

    </style>

  <body>
    <main id="app" class="app" aria-live="polite"></main>
    <script>
const COMBO_TIMEOUT_MS = 2000;

function createBattle(monster) {
  const maxHealth = Number(monster.health);
  return {
    maxHealth,
    health: maxHealth,
    combo: 0,
    lastHitAt: 0,
    phase: "normal",
    damageMultiplier: 1,
    victory: false,
    totalHits: 0,
    maxCombo: 0
  };
}

function hitBattle(battle, now = Date.now()) {
  if (battle.victory) {
    return battle;
  }

  const comboContinues = battle.lastHitAt > 0 && now - battle.lastHitAt <= COMBO_TIMEOUT_MS;
  const combo = comboContinues ? battle.combo + 1 : 1;
  const damageMultiplier = getDamageMultiplier(combo);
  const baseDamage = 9;
  const damage = Math.round(baseDamage * damageMultiplier);
  const health = Math.max(0, battle.health - damage);
  const victory = health === 0;

  return {
    ...battle,
    health,
    combo,
    lastHitAt: now,
    phase: getPhase(combo, health, battle.maxHealth, victory),
    damageMultiplier,
    victory,
    totalHits: battle.totalHits + 1,
    maxCombo: Math.max(battle.maxCombo, combo)
  };
}

function getDamageMultiplier(combo) {
  if (combo >= 60) return 2.6;
  if (combo >= 30) return 1.9;
  if (combo >= 10) return 1.35;
  return 1;
}

function getPhase(combo, health, maxHealth, victory) {
  if (victory) return "victory";
  if (combo >= 60) return "finisher";
  if (health / maxHealth <= 0.3) return "rage";
  if (combo >= 30) return "crack";
  if (combo >= 10) return "combo";
  return "normal";
}

const commonHitTexts = ["砰", "裂开", "退退退", "别来沾边", "压力飞走", "再吃一拳"];

const scenarios = [

    }
  },
  {

    monster: {

      health: 880,

    }

  {

      category: "关系压力",
      monsterType: "人情世故喇叭",
      health: 930,
      weaknesses: ["边界模糊", "反复追问", "情绪绑架"],
      appearanceTags: ["超大喇叭", "亲戚饭桌", "尴尬微笑"],
      battleTexts: ["谢谢不用了", "边界站起来", "微笑但不接招", "别审我人生", "话题换台", "我先吃菜"],
      drops: ["微笑敷衍护盾", "边界感贴纸", "饭桌隐身卡"],

    }
  },
  {
    match: /(失眠|睡不着|熬夜|焦虑|内耗|烦|崩溃|破防|减肥|带娃|社恐)/,
    monster: {
      monsterName: "内耗弹簧怪",
      category: "综合压力",
      monsterType: "脑内弹幕球",
      health: 760,
      weaknesses: ["想太多", "越拖越烦", "没有出口"],
      appearanceTags: ["皱巴巴表情", "弹簧脑袋", "满身便签"],
      battleTexts: ["别脑内开会", "先喝口水", "压力退散", "今天先这样", "关掉循环播放", "小事也算数"],
      drops: ["冷静贴纸", "三分钟喘气券", "小事完成章"],
      finalSkill: "送进脑内静音模式",

    }

];

function generateMonster(input) {
  const text = String(input || "").trim();
  const scenario = scenarios.find((item) => item.match.test(text)) || scenarios.at(-1);
  return normalizeMonster(scenario.monster, text);
}

function normalizeMonster(monster, sourceText) {
  return {
    ...monster,
    sourceText,
    monsterName: monster.monsterName.slice(0, 14),
    health: Math.max(600, Math.min(1200, monster.health)),
    hitTexts: commonHitTexts
  };
}

const crisisPatterns = [
  /不想活/,
  /自杀/,
  /轻生/,
  /结束生命/,
  /伤害自己/,
  /杀了/,
  /砍人/,
  /报复社会/
];

function classifySafety(input) {
  const text = String(input || "").trim();
  const isCrisis = crisisPatterns.some((pattern) => pattern.test(text));

  if (!isCrisis) {
    return { kind: "playable" };
  }

  return {
    kind: "support",
    title: "先停一下，别一个人硬扛",
    lines: [
      "你现在的感受很重，这一刻先不要把它变成游戏。",
      "请立刻联系身边可信任的人，让对方陪你待一会儿。",
      "如果你或他人正处在现实危险中，请马上联系当地紧急电话或专业热线。"
    ]
  };
}


const app = document.querySelector("#app");
const quickTags = ["上班", "考试", "恋爱", "亲戚", "带娃", "减肥", "失眠", "社恐"];

const state = {
  screen: "home",
  input: "",
  monster: null,
  battle: null,
  safety: null,
  floaters: []
};

renderHome();

function renderHome() {
  state.screen = "home";
  app.innerHTML = `
    <section class="screen home-screen">
      <p class="eyebrow">AI 解压街机</p>
      <h1>压力怪粉碎机</h1>
      <p class="subtitle">输入一句破防话，生成一只欠揍压力怪。</p>
      <form class="stress-form">
        <label class="input-label" for="stressInput">今天谁惹你破防了？</label>
        <textarea id="stressInput" maxlength="80" rows="4" placeholder="例如：甲方又让我做五彩斑斓的黑。">${escapeHtml(state.input)}</textarea>
        <div class="quick-tags">
          ${quickTags.map((tag) => `<button type="button" class="tag-button" data-tag="${tag}">${tag}</button>`).join("")}
        </div>
        <button class="primary-button" type="submit">生成欠揍怪</button>
      </form>
    </section>
  `;

  app.querySelector(".stress-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const input = app.querySelector("#stressInput").value.trim();
    startGeneration(input || "今天什么都不顺，我好烦");
  });

  app.querySelectorAll(".tag-button").forEach((button) => {
    button.addEventListener("click", () => {
      app.querySelector("#stressInput").value = getTagExample(button.dataset.tag);
    });
  });
}

function startGeneration(input) {
  state.input = input;
  const safety = classifySafety(input);
  if (safety.kind === "support") {
    state.safety = safety;
    renderSupport();
    return;
  }

  app.innerHTML = `
    <section class="screen loading-screen">
      <div class="loader-badge">装配中</div>
      <h2>正在把你的压力捏成怪物</h2>
      <p>提取破防点 · 装配表情包 · 塞进粉碎机</p>
    </section>
  `;

  window.setTimeout(() => {
    state.monster = generateMonster(input);
    state.battle = createBattle(state.monster);
    state.floaters = [];
    renderBattle();
  }, 520);
}

function renderSupport() {
  app.innerHTML = `
    <section class="screen support-screen">
      <p class="eyebrow">安全模式</p>
      <h1>${escapeHtml(state.safety.title)}</h1>
      <div class="support-lines">
        ${state.safety.lines.map((line) => `<p>${escapeHtml(line)}</p>`).join("")}
      </div>
      <button class="primary-button" type="button">返回首页</button>
    </section>
  `;
  app.querySelector(".primary-button").addEventListener("click", renderHome);
}

function renderBattle() {
  const monster = state.monster;
  const battle = state.battle;
  const hpPercent = Math.round((battle.health / battle.maxHealth) * 100);
  const buttonText = battle.phase === "finisher" || battle.phase === "rage" ? "终结它" : "暴打它";

  app.innerHTML = `
    <section class="screen battle-screen phase-${battle.phase}">
      <header class="battle-header">
        <div>
          <p class="eyebrow">${escapeHtml(monster.category)}</p>
          <h2>${escapeHtml(monster.monsterName)}</h2>
        </div>
        <div class="combo-box">x${battle.combo}</div>
      </header>
      <div class="hp-shell" aria-label="怪物血量">
        <div class="hp-bar" style="width:${hpPercent}%"></div>
      </div>
      <div class="weakness-row">
        ${monster.weaknesses.map((item) => `<span>${escapeHtml(item)}</span>`).join("")}
      </div>
      <button class="monster-button" type="button" aria-label="攻击压力怪">
        <span class="monster-face">${getMonsterFace(monster.category)}</span>
        <span class="monster-type">${escapeHtml(monster.monsterType)}</span>
      </button>
      <div class="floater-layer">
        ${state.floaters.map((item) => `<span class="floater" style="left:${item.x}%; top:${item.y}%">${escapeHtml(item.text)}</span>`).join("")}
      </div>
      <button class="smash-button" type="button">${buttonText}</button>
    </section>
  `;

  app.querySelector(".monster-button").addEventListener("click", handleHit);
  app.querySelector(".smash-button").addEventListener("click", handleHit);
}

function handleHit() {
  state.battle = hitBattle(state.battle);
  addFloater();
  if (state.battle.victory) {
    renderResult();
    return;
  }
  renderBattle();
}

function addFloater() {
  const monster = state.monster;
  const texts = [...monster.hitTexts, ...monster.battleTexts];
  const text = texts[(state.battle.totalHits + state.battle.combo) % texts.length];
  state.floaters = [
    {
      text,
      x: 18 + Math.round(Math.random() * 56),
      y: 24 + Math.round(Math.random() * 38)
    },
    ...state.floaters
  ].slice(0, 8);
}

function renderResult() {
  const monster = state.monster;
  const battle = state.battle;
  const pressureDrop = Math.min(96, 48 + Math.round(battle.maxCombo * 0.8));

  app.innerHTML = `
    <section class="screen result-screen">
      <p class="eyebrow">粉碎完成</p>
      <article class="report-card" id="reportCard">
        <h1>${escapeHtml(monster.resultTitle)}</h1>
        <p class="report-target">今日粉碎：${escapeHtml(monster.monsterName)}</p>
        <div class="report-grid">
          <span>最高连击 <strong>${battle.maxCombo}</strong></span>
          <span>压力下降 <strong>${pressureDrop}%</strong></span>
        </div>
        <p class="final-skill">${escapeHtml(monster.finalSkill)}</p>
        <div class="drop-list">
          ${monster.drops.map((drop) => `<b>${escapeHtml(drop)}</b>`).join("")}
        </div>
        <p class="tiny-advice">${escapeHtml(monster.tinyAdvice)}</p>
      </article>
      <div class="result-actions">
        <button class="primary-button" type="button" data-action="again">再打一只</button>
        <button class="secondary-button" type="button" data-action="save">保存战报</button>
      </div>
    </section>
  `;

  app.querySelector('[data-action="again"]').addEventListener("click", renderHome);
  app.querySelector('[data-action="save"]').addEventListener("click", saveReport);
}

function saveReport() {
  const text = [
    "压力怪粉碎机战报",
    `今日粉碎：${state.monster.monsterName}`,
    `称号：${state.monster.resultTitle}`,
    `最高连击：${state.battle.maxCombo}`,
    state.monster.tinyAdvice
  ].join("\n");
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "pressure-monster-report.txt";
  link.click();
  URL.revokeObjectURL(url);
}

function getTagExample(tag) {
  const examples = {

function getMonsterFace(category) {
  if (category === "职场压力") return "🤯";
  if (category === "学习压力") return "📚";
  if (category === "关系压力") return "📣";
  return "😵";
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
