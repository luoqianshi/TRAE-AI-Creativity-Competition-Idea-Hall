<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a2a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="两位数加减法">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231a2a1a' width='180' height='180' rx='40'/><text x='90' y='120' font-size='100' text-anchor='middle' fill='white'>＋－</text></svg>">
    <title>两位数加减法</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a1a 0%, #2d3a2d 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            padding: 0;
            margin: 0;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        .container {
            background: #2d3a2d;
            border-radius: 0;
            padding: 30px;
            padding-top: calc(30px + env(safe-area-inset-top));
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
            box-shadow: none;
            text-align: center;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            color: #e8e4d9;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 700;
        }
        .radio-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 5px;
            background: #3d4a3d;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
            justify-content: center;
            color: #c9c5ba;
            box-sizing: border-box;
            border: 2px solid transparent;
        }
        .radio-option:hover {
            background: #4d5a4d;
        }
        .radio-option.selected {
            background: linear-gradient(135deg, #4a6a4a 0%, #5a7a5a 100%);
            color: #e8e4d9;
            border: 2px solid #6fcf97;
        }
        .radio-option input[type="radio"] {
            display: none;
        }
        .radio-option .radio-label {
            font-size: 16px;
            font-weight: 500;
            user-select: none;
        }
        .radio-option.selected .radio-label {
            color: #e8e4d9;
        }
        .score-area {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .score-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-label {
            color: #a0a09a;
        }
        .score-value {
            font-size: 24px;
            font-weight: 700;
        }
        .score-correct {
            color: #6fcf97;
        }
        .score-wrong {
            color: #eb5757;
        }
        .score-total {
            color: #7eb8da;
        }
        .score-timer {
            color: #ebc96f;
        }
        .question-area {
            margin: 25px 0;
        }
        .question {
            font-size: 108px;
            font-weight: 700;
            color: #e8e4d9;
            line-height: 1.5;
            white-space: nowrap;
        }
        .number {
            display: inline;
        }
        .operator {
            display: inline;
            font-size: 84px;
            color: #7eb8da;
            margin: 0 15px;
        }
        .equals {
            font-size: 84px;
            color: #9b8ec2;
            margin: 0 15px;
        }
        .button-container {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 7px 5px;
            font-size: 16px;
            font-weight: 600;
            color: #e8e4d9;
            border: 2px solid transparent;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }
        button:hover, button:active {
            transform: scale(0.98);
        }
        #showAnswerBtn {
            background: linear-gradient(135deg, #9b8ec2 0%, #7eb8da 100%);
            box-shadow: 0 6px 22px rgba(155, 142, 194, 0.4);
            border: 2px solid transparent;
        }
        #showAnswerBtn:active {
            box-shadow: 0 3px 12px rgba(155, 142, 194, 0.5);
        }
        #nextBtn {
            background: linear-gradient(135deg, #4a6a4a 0%, #5a7a5a 100%);
            box-shadow: 0 6px 22px rgba(74, 106, 74, 0.4);
        }
        #nextBtn:active {
            box-shadow: 0 3px 12px rgba(74, 106, 74, 0.5);
        }
        .answer-hidden {
            color: #5a5a5a;
            text-decoration: underline;
            text-decoration-style: dashed;
        }

        @media (max-width: 375px) {
            .container {
                padding: 24px;
                padding-top: calc(24px + env(safe-area-inset-top));
                padding-bottom: calc(24px + env(safe-area-inset-bottom));
                border-radius: 20px;
            }
            h1 {
                font-size: 22px;
                margin-bottom: 20px;
            }
            select {
                padding: 14px 18px;
                font-size: 16px;
            }
            .radio-option {
                padding: 5px 4px;
                min-width: 90px;
            }
            .radio-option .radio-label {
                font-size: 14px;
            }
            .question-area {
                margin: 20px 0;
            }
            .question {
                font-size: 90px;
            }
            .number {
                min-width: 65px;
            }
            .operator {
                font-size: 72px;
            }
            .equals {
                font-size: 72px;
            }
            button {
                padding: 5px 4px;
                font-size: 14px;
            }
        }

        @media (min-width: 768px) {
            .container {
                padding: 40px;
                padding-top: calc(40px + env(safe-area-inset-top));
                padding-bottom: calc(40px + env(safe-area-inset-bottom));
                max-width: 100%;
                width: 100%;
            }
            h1 {
                font-size: 32px;
                margin-bottom: 30px;
            }
            .radio-option {
                padding: 8px 7px;
                min-width: 160px;
            }
            .radio-option .radio-label {
                font-size: 18px;
            }
            .question-area {
                margin: 35px 0;
            }
            .question {
                font-size: 132px;
            }
            .number {
                min-width: 100px;
            }
            .operator {
                font-size: 108px;
            }
            .equals {
                font-size: 108px;
            }
            button {
                padding: 8px 7px;
                font-size: 18px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>两位数加减法</h1>
        
        <div class="score-area">
            <div class="score-item">
                <span class="score-label">答对:</span>
                <span class="score-value score-correct" id="correctCount">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">答错:</span>
                <span class="score-value score-wrong" id="wrongCount">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">已做:</span>
                <span class="score-value score-total" id="totalCount">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">倒计时:</span>
                <span class="score-value score-timer" id="timerCount">10</span>
            </div>
        </div>
        
        <div class="radio-container">
            <label class="radio-option selected">
                <input type="radio" name="exerciseType" value="addition_carry" checked>
                <span class="radio-label">进位加法</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="exerciseType" value="addition_no_carry">
                <span class="radio-label">不进位加法</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="exerciseType" value="subtraction_borrow">
                <span class="radio-label">退位减法</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="exerciseType" value="subtraction_no_borrow">
                <span class="radio-label">不退位减法</span>
            </label>
            <label class="radio-option">
                <input type="radio" name="exerciseType" value="mixed_big">
                <span class="radio-label">加减大混合</span>
            </label>
        </div>
        
        <div class="question-area">
            <div class="question" id="question">
                <span class="number" id="num1">28</span>
                <span class="operator">+</span>
                <span class="number" id="num2">45</span>
                <span class="equals">=</span>
                <span class="number answer-hidden" id="answer">??</span>
            </div>
        </div>
        
        <div class="button-container">
            <button id="showAnswerBtn">显示答案</button>
            <button id="nextBtn">下一题</button>
        </div>
        
        <div class="button-container" style="margin-top: 15px;">
            <button id="correctBtn" style="background: linear-gradient(135deg, #4a7a4a 0%, #5a8a5a 100%); box-shadow: 0 6px 22px rgba(74, 122, 74, 0.4);">✓</button>
            <button id="resetBtn" style="background: linear-gradient(135deg, #5a5a5a 0%, #6a6a6a 100%); box-shadow: 0 6px 22px rgba(90, 90, 90, 0.4);">重置</button>
            <button id="wrongBtn" style="background: linear-gradient(135deg, #8a4a4a 0%, #9a5a5a 100%); box-shadow: 0 6px 22px rgba(138, 74, 74, 0.4);">✗</button>
        </div>
    </div>

    <script>
        let currentAnswer = '';
        let correctCount = 0;
        let wrongCount = 0;
        let totalCount = 0;
        let timerInterval = null;

        function startTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            let timeLeft = 10;
            document.getElementById('timerCount').textContent = timeLeft;
            
            timerInterval = setInterval(function() {
                timeLeft--;
                document.getElementById('timerCount').textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }, 1000);
        }

        function generateAdditionCarry() {
            let num1, num2, sum;
            do {
                num1 = Math.floor(Math.random() * 90) + 10;
                const maxNum2 = 100 - num1;
                num2 = Math.floor(Math.random() * Math.min(maxNum2, 99)) + 1;
                sum = num1 + num2;
            } while (num1 % 10 + num2 % 10 < 10);
            return { num1, num2, answer: sum, operator: '+' };
        }

        function generateAdditionNoCarry() {
            let num1, num2, sum;
            do {
                num1 = Math.floor(Math.random() * 90) + 10;
                const maxNum2 = 100 - num1;
                num2 = Math.floor(Math.random() * Math.min(maxNum2, 99)) + 1;
                sum = num1 + num2;
            } while (num1 % 10 + num2 % 10 >= 10);
            return { num1, num2, answer: sum, operator: '+' };
        }

        function generateSubtractionBorrow() {
            let num1, num2, diff;
            do {
                num1 = Math.floor(Math.random() * 90) + 10;
                num2 = Math.floor(Math.random() * num1) + 1;
                diff = num1 - num2;
            } while (num1 % 10 >= num2 % 10);
            return { num1, num2, answer: diff, operator: '-' };
        }

        function generateSubtractionNoBorrow() {
            let num1, num2, diff;
            do {
                num1 = Math.floor(Math.random() * 90) + 10;
                num2 = Math.floor(Math.random() * num1) + 1;
                diff = num1 - num2;
            } while (num1 % 10 < num2 % 10);
            return { num1, num2, answer: diff, operator: '-' };
        }

        function generateMixedBig() {
            const useAddition = Math.random() < 0.5;
            if (useAddition) {
                return generateAdditionCarry();
            } else {
                return generateSubtractionBorrow();
            }
        }

        function displayQuestion(incrementTotal = true) {
            startTimer();
            if (incrementTotal) {
                totalCount++;
                document.getElementById('totalCount').textContent = totalCount;
            }
            
            const type = document.querySelector('input[name="exerciseType"]:checked').value;
            let question;
            
            switch(type) {
                case 'addition_carry':
                    question = generateAdditionCarry();
                    break;
                case 'addition_no_carry':
                    question = generateAdditionNoCarry();
                    break;
                case 'subtraction_borrow':
                    question = generateSubtractionBorrow();
                    break;
                case 'subtraction_no_borrow':
                    question = generateSubtractionNoBorrow();
                    break;
                case 'mixed_big':
                    question = generateMixedBig();
                    break;
                default:
                    question = generateAdditionCarry();
            }
            
            document.getElementById('num1').textContent = question.num1;
            document.getElementById('num2').textContent = question.num2;
            document.getElementById('answer').textContent = '??';
            document.getElementById('answer').classList.add('answer-hidden');
            document.querySelector('.operator').textContent = question.operator;
            currentAnswer = question.answer;
        }

        function showAnswer() {
            const answerEl = document.getElementById('answer');
            answerEl.textContent = currentAnswer;
            answerEl.classList.remove('answer-hidden');
        }

        function incrementCorrect() {
            correctCount++;
            document.getElementById('correctCount').textContent = correctCount;
            displayQuestion();
        }

        function incrementWrong() {
            wrongCount++;
            document.getElementById('wrongCount').textContent = wrongCount;
            displayQuestion();
        }

        function resetScores() {
            correctCount = 0;
            wrongCount = 0;
            totalCount = 0;
            document.getElementById('correctCount').textContent = '0';
            document.getElementById('wrongCount').textContent = '0';
            document.getElementById('totalCount').textContent = '0';
            startTimer();
        }

        document.querySelectorAll('.radio-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.radio-option').forEach(opt => opt.classList.remove('selected'));
                this.classList.add('selected');
                displayQuestion(false);
            });
        });

        document.getElementById('nextBtn').addEventListener('click', displayQuestion);
        document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);
        document.getElementById('correctBtn').addEventListener('click', incrementCorrect);
        document.getElementById('wrongBtn').addEventListener('click', incrementWrong);
        document.getElementById('resetBtn').addEventListener('click', resetScores);
        
        displayQuestion();
    </script>
</body>
</html>
