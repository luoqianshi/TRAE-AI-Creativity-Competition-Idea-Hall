    <style>

            --color-success: #00FF88;    /* 电池绿色 */

        }

        body {

        }

        /* ==================== 顶部导航栏 ==================== */
        .nav-header {
            position: fixed;

            height: 56px;

            padding: 0 16px;

        }

        .nav-title {
            font-size: 18px;

        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background-color: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);

            transition: all 0.3s;
        }

        .nav-btn:hover {

        .nav-btn svg {
            width: 20px;

        .main-content {

        }

        /* ==================== 连接状态卡片 ==================== */
        .connection-card {

            align-items: center;

        }

            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--color-danger);
            transition: background-color 0.3s;
        }

        .status-dot.connected {
            background-color: var(--color-success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .device-name {
            font-size: 13px;
            color: var(--color-primary);
            margin-top: 4px;
        }

        .connect-btn {
            padding: 10px 20px;
            background-color: var(--color-success);
            color: var(--text-primary);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .connect-btn:hover {
            filter: brightness(1.1);
        }

        .connect-btn.disconnect {
            background-color: var(--color-danger);
        }

        /* ==================== 数据卡片 ==================== */
        .data-section {
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-left: 8px;
            border-left: 3px solid var(--color-primary);
        }

        .data-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 16px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .data-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .data-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .data-value.primary { color: var(--color-primary); }
        .data-value.success { color: var(--color-success); }
        .data-value.warning { color: var(--color-warning); }
        .data-value.load { color: var(--color-load); }

        .data-unit {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: normal;
        }

        /* ==================== 电池状态特殊样式 ==================== */
        .battery-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 16px;
            margin-bottom: 16px;
        }

        .battery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .battery-icon {
            width: 48px;
            height: 24px;
            border: 2px solid var(--color-success);
            border-radius: 4px;
            position: relative;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 10px;
            background-color: var(--color-success);
            border-radius: 2px;
        }

        .battery-level {
            position: absolute;
            left: 2px;
            top: 2px;
            bottom: 2px;
            background-color: var(--color-success);
            border-radius: 2px;
            transition: width 0.5s;
        }

        .battery-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        /* ==================== 灯光控制 ==================== */
        .control-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 16px;
            margin-bottom: 16px;
        }

        .control-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .control-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .control-btn {
            flex: 1;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .control-btn:hover {
            border-color: var(--color-primary);
            background-color: var(--bg-nav);
        }

        .control-btn.active {
            border-color: var(--color-success);
            background-color: rgba(0, 255, 136, 0.1);
        }

        .control-btn svg {
            width: 24px;
            height: 24px;
        }

        .timer-section {
            background-color: var(--bg-dark);
            border-radius: 8px;
            padding: 12px;
        }

        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .timer-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .timer-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-timer);
        }

        .timer-slider {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            appearance: none;
            outline: none;
            cursor: pointer;
        }

        .timer-slider::-webkit-slider-thumb {
            appearance: none;
            width: 18px;
            height: 18px;
            background-color: var(--color-timer);
            border-radius: 50%;
            cursor: pointer;
        }

        .timer-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background-color: var(--color-timer);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        /* ==================== 左侧抽屉 ==================== */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 199;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--bg-nav);
            z-index: 200;
            transition: left 0.3s;
            overflow-y: auto;
        }

        .drawer.active {
            left: 0;
        }

        .drawer-header {
            padding: 56px 16px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .drawer-title {
            font-size: 18px;
            font-weight: 600;
        }

        .drawer-close {
            padding: 8px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
        }

        .drawer-close svg {
            width: 24px;
            height: 24px;
        }

        .device-list {
            padding: 16px;
        }

        .device-category {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .device-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: var(--bg-card);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .device-item:hover {
            border: 1px solid var(--color-primary);
        }

        .device-item.connected {
            border: 1px solid var(--color-success);
        }

        .device-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .device-icon {
            width: 32px;
            height: 32px;
            background-color: var(--color-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .device-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        .device-name-text {
            font-size: 14px;
            color: var(--text-primary);
        }

        .device-rssi {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .scan-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--color-primary);
            color: var(--text-primary);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.3s;
        }

        .scan-btn:hover {
            filter: brightness(1.1);
        }

        .scan-btn.scanning {
            background-color: var(--text-secondary);
        }

        /* ==================== 响应式适配 ==================== */
        @media (max-width: 375px) {
            .data-grid {
                grid-template-columns: 1fr;
            }
            
            .battery-info {
                grid-template-columns: 1fr;
            }
            
            .control-buttons {
                flex-direction: column;
            }
        }

        /* ==================== 动画效果 ==================== */
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==================== 加载状态 ==================== */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            border-top-color: var(--color-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="nav-header">
        <button class="nav-btn" onclick="toggleDrawer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            设备
        </button>
        <h1 class="nav-title">太阳能监控器</h1>
        <button class="nav-btn" style="visibility: hidden;">
            <!-- 占位按钮 -->
        </button>
    </nav>

    <!-- 左侧抽屉 -->
    <div class="drawer-overlay" onclick="toggleDrawer()"></div>
    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <h2 class="drawer-title">设备管理</h2>
            <button class="drawer-close" onclick="toggleDrawer()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="device-list">
            <div class="device-category">已连接设备</div>
            <div class="device-item connected" onclick="selectDevice('Solar-A1')">
                <div class="device-info">
                    <div class="device-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" fill="currentColor"></circle>
                        </svg>
                    </div>
                    <div>
                        <div class="device-name-text">Solar-A1</div>
                        <div class="device-rssi">信号强度: -45dBm</div>
                    </div>
                </div>
            </div>
            
            <div class="device-category" style="margin-top: 16px;">附近设备</div>
            <div class="device-item" onclick="selectDevice('Solar-B2')">
                <div class="device-info">
                    <div class="device-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" fill="currentColor"></circle>
                        </svg>
                    </div>
                    <div>
                        <div class="device-name-text">Solar-B2</div>
                        <div class="device-rssi">信号强度: -68dBm</div>
                    </div>
                </div>
            </div>
            <div class="device-item" onclick="selectDevice('Solar-C3')">
                <div class="device-info">
                    <div class="device-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" fill="currentColor"></circle>
                        </svg>
                    </div>
                    <div>
                        <div class="device-name-text">Solar-C3</div>
                        <div class="device-rssi">信号强度: -72dBm</div>
                    </div>
                </div>
            </div>
            
            <button class="scan-btn" onclick="scanDevices()">
                <span id="scan-text">扫描设备</span>
            </button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 连接状态 -->
        <div class="connection-card fade-in">
            <div class="connection-status">
                <div class="status-dot" id="status-dot"></div>
                <div>
                    <div class="status-text" id="status-text">未连接</div>
                    <div class="device-name" id="device-name">点击连接开始监控</div>
                </div>
            </div>
            <button class="connect-btn" id="connect-btn" onclick="toggleConnection()">
                连接
            </button>
        </div>

        <!-- 太阳能输入 -->
        <section class="data-section fade-in">
            <h2 class="section-title">太阳能输入</h2>
            <div class="data-card">
                <div class="data-grid">
                    <div class="data-item">
                        <span class="data-label">电压</span>
                        <span class="data-value primary" id="solar-voltage">--<span class="data-unit">V</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">电流</span>
                        <span class="data-value primary" id="solar-current">--<span class="data-unit">A</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">功率</span>
                        <span class="data-value warning" id="solar-power">--<span class="data-unit">W</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">今日发电</span>
                        <span class="data-value success" id="solar-energy">--<span class="data-unit">Wh</span></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 电池状态 -->
        <section class="data-section fade-in">
            <h2 class="section-title" style="border-color: var(--color-success);">电池状态</h2>
            <div class="battery-card">
                <div class="battery-header">
                    <span class="data-label">电池电量</span>
                    <div class="battery-icon">
                        <div class="battery-level" id="battery-level" style="width: 0%"></div>
                    </div>
                </div>
                <div class="battery-info">
                    <div class="data-item">
                        <span class="data-label">电压</span>
                        <span class="data-value success" id="battery-voltage">--<span class="data-unit">V</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">电流</span>
                        <span class="data-value success" id="battery-current">--<span class="data-unit">A</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">电量</span>
                        <span class="data-value success" id="battery-percent">--<span class="data-unit">%</span></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 负载输出 -->
        <section class="data-section fade-in">
            <h2 class="section-title" style="border-color: var(--color-load);">负载输出</h2>
            <div class="data-card">
                <div class="data-grid">
                    <div class="data-item">
                        <span class="data-label">电压</span>
                        <span class="data-value load" id="load-voltage">--<span class="data-unit">V</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">电流</span>
                        <span class="data-value load" id="load-current">--<span class="data-unit">A</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">功率</span>
                        <span class="data-value load" id="load-power">--<span class="data-unit">W</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">运行状态</span>
                        <span class="data-value" id="load-status">--</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 控制器信息 -->
        <section class="data-section fade-in">
            <h2 class="section-title" style="border-color: var(--text-secondary);">控制器信息</h2>
            <div class="data-card">
                <div class="data-grid">
                    <div class="data-item">
                        <span class="data-label">温度</span>
                        <span class="data-value" id="controller-temp">--<span class="data-unit">°C</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">固件版本</span>
                        <span class="data-value" id="controller-version">--</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 灯光控制 -->
        <section class="data-section fade-in">
            <div class="control-card">
                <h2 class="control-title">灯光控制</h2>
                <div class="control-buttons">
                    <button class="control-btn" id="btn-on" onclick="setLightMode('on')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-success)" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        持续开灯
                    </button>
                    <button class="control-btn" id="btn-off" onclick="setLightMode('off')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-danger)" stroke-width="2">
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                            <path d="M7.5 7.5A5 5 0 0 1 17 10.5"></path>
                            <path d="M21 21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1"></path>
                        </svg>
                        持续关灯
                    </button>
                    <button class="control-btn" id="btn-timer" onclick="setLightMode('timer')">
                        <svg viewBox="0 0 24 24" fill="none" stroke="var(--color-timer)" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12,6 12,12 16,14"></polyline>
                        </svg>
                        定时关灯
                    </button>
                </div>
                
                <div class="timer-section" id="timer-section" style="display: none;">
                    <div class="timer-header">
                        <span class="timer-label">定时时间</span>
                        <span class="timer-value" id="timer-display">1 小时</span>
                    </div>
                    <input type="range" class="timer-slider" id="timer-slider" min="1" max="24" value="1" oninput="updateTimer()">
                </div>
            </div>
        </section>
    </main>

    <script>
        // ==================== 状态管理 ====================
        let isConnected = false;
        let currentDevice = null;
        let lightMode = 'auto';
        let timerValue = 1;
        let dataUpdateInterval = null;

        // ==================== 模拟数据 ====================
        const mockData = {
            solar: { voltage: 18.5, current: 2.8, power: 51.8, energy: 1250 },
            battery: { voltage: 12.6, current: 1.2, percent: 85 },
            load: { voltage: 12.4, current: 0.8, power: 9.92, status: '运行中' },
            controller: { temp: 32, version: 'v2.1.3' }
        };

        // ==================== 抽屉控制 ====================
        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.querySelector('.drawer-overlay');
            drawer.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        // ==================== 设备选择 ====================
        function selectDevice(deviceName) {
            currentDevice = deviceName;
            document.getElementById('device-name').textContent = deviceName;
            toggleDrawer();
        }

        // ==================== 扫描设备 ====================
        function scanDevices() {
            const scanBtn = document.querySelector('.scan-btn');
            const scanText = document.getElementById('scan-text');
            scanBtn.classList.add('scanning');
            scanText.innerHTML = '<span class="loading"></span> 扫描中...';
            
            setTimeout(() => {
                scanBtn.classList.remove('scanning');
                scanText.textContent = '扫描完成';
                
                setTimeout(() => {
                    scanText.textContent = '扫描设备';
                }, 2000);
            }, 3000);
        }

        // ==================== 连接控制 ====================
        function toggleConnection() {
            const btn = document.getElementById('connect-btn');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const deviceName = document.getElementById('device-name');

            if (!isConnected) {
                // 连接
                btn.textContent = '连接中...';
                btn.disabled = true;
                
                setTimeout(() => {
                    isConnected = true;
                    currentDevice = currentDevice || 'Solar-A1';
                    
                    btn.textContent = '断开';
                    btn.classList.add('disconnect');
                    btn.disabled = false;
                    
                    statusDot.classList.add('connected');
                    statusText.textContent = '已连接';
                    deviceName.textContent = currentDevice;
                    
                    // 开始数据更新
                    startDataUpdate();
                    
                    // 更新灯光状态
                    updateLightStatus();
                }, 1500);
            } else {
                // 断开
                isConnected = false;
                btn.textContent = '连接';
                btn.classList.remove('disconnect');
                
                statusDot.classList.remove('connected');
                statusText.textContent = '未连接';
                deviceName.textContent = '点击连接开始监控';
                
                // 停止数据更新
                stopDataUpdate();
                
                // 清空数据显示
                clearData();
            }
        }

        // ==================== 数据更新 ====================
        function startDataUpdate() {
            updateData();
            dataUpdateInterval = setInterval(updateData, 2000);
        }

        function stopDataUpdate() {
            if (dataUpdateInterval) {
                clearInterval(dataUpdateInterval);
                dataUpdateInterval = null;
            }
        }

        function updateData() {
            // 添加随机波动模拟真实数据
            const solarV = mockData.solar.voltage + (Math.random() - 0.5) * 0.5;
            const solarI = mockData.solar.current + (Math.random() - 0.5) * 0.2;
            const solarP = solarV * solarI;
            const solarE = mockData.solar.energy + Math.random() * 10;

            document.getElementById('solar-voltage').innerHTML = solarV.toFixed(2) + '<span class="data-unit">V</span>';
            document.getElementById('solar-current').innerHTML = solarI.toFixed(2) + '<span class="data-unit">A</span>';
            document.getElementById('solar-power').innerHTML = solarP.toFixed(1) + '<span class="data-unit">W</span>';
            document.getElementById('solar-energy').innerHTML = Math.floor(solarE) + '<span class="data-unit">Wh</span>';

            // 电池数据
            const batteryV = mockData.battery.voltage + (Math.random() - 0.5) * 0.1;
            const batteryI = mockData.battery.current + (Math.random() - 0.5) * 0.1;
            const batteryP = mockData.battery.percent + (Math.random() - 0.5) * 2;

            document.getElementById('battery-voltage').innerHTML = batteryV.toFixed(2) + '<span class="data-unit">V</span>';
            document.getElementById('battery-current').innerHTML = batteryI.toFixed(2) + '<span class="data-unit">A</span>';
            document.getElementById('battery-percent').innerHTML = Math.floor(batteryP) + '<span class="data-unit">%</span>';
            document.getElementById('battery-level').style.width = Math.floor(batteryP) + '%';

            // 负载数据
            const loadV = mockData.load.voltage + (Math.random() - 0.5) * 0.2;
            const loadI = mockData.load.current + (Math.random() - 0.5) * 0.1;
            const loadP = loadV * loadI;

            document.getElementById('load-voltage').innerHTML = loadV.toFixed(2) + '<span class="data-unit">V</span>';
            document.getElementById('load-current').innerHTML = loadI.toFixed(2) + '<span class="data-unit">A</span>';
            document.getElementById('load-power').innerHTML = loadP.toFixed(2) + '<span class="data-unit">W</span>';
            document.getElementById('load-status').textContent = lightMode === 'off' ? '已关闭' : '运行中';

            // 控制器信息
            const temp = mockData.controller.temp + (Math.random() - 0.5) * 2;
            document.getElementById('controller-temp').innerHTML = Math.floor(temp) + '<span class="data-unit">°C</span>';
            document.getElementById('controller-version').textContent = mockData.controller.version;
        }

        function clearData() {
            const dataElements = [
                'solar-voltage', 'solar-current', 'solar-power', 'solar-energy',
                'battery-voltage', 'battery-current', 'battery-percent',
                'load-voltage', 'load-current', 'load-power', 'load-status',
                'controller-temp', 'controller-version'
            ];

            dataElements.forEach(id => {
                const el = document.getElementById(id);
                if (id === 'load-status' || id === 'controller-version') {
                    el.textContent = '--';
                } else {
                    el.innerHTML = '--<span class="data-unit"></span>';
                }
            });

            document.getElementById('battery-level').style.width = '0%';
        }

        // ==================== 灯光控制 ====================
        function setLightMode(mode) {
            lightMode = mode;

            // 更新按钮状态
            document.getElementById('btn-on').classList.toggle('active', mode === 'on');
            document.getElementById('btn-off').classList.toggle('active', mode === 'off');
            document.getElementById('btn-timer').classList.toggle('active', mode === 'timer');

            // 显示/隐藏定时器
            document.getElementById('timer-section').style.display = mode === 'timer' ? 'block' : 'none';

            if (isConnected) {
                updateLightStatus();
            }
        }

        function updateTimer() {
            timerValue = document.getElementById('timer-slider').value;
            document.getElementById('timer-display').textContent = timerValue + ' 小时';
        }

        function updateLightStatus() {
            const statusEl = document.getElementById('load-status');
            if (lightMode === 'on') {
                statusEl.textContent = '持续开启';
                statusEl.style.color = 'var(--color-success)';
            } else if (lightMode === 'off') {
                statusEl.textContent = '已关闭';
                statusEl.style.color = 'var(--color-danger)';
            } else if (lightMode === 'timer') {
                statusEl.textContent = '定时 ' + timerValue + 'h';
                statusEl.style.color = 'var(--color-timer)';
            }
        }

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            // 设置初始定时器值
            updateTimer();
        });
    </script>
</body>
</html>
