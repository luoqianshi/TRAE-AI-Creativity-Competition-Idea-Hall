<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 - 小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #faf8ef 0%, #f5f0e8 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .container {
    width: 100%;
    max-width: 500px;
    padding: 20px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .title {
    font-size: 48px;
    font-weight: 800;
    color: #776e65;
    letter-spacing: 2px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.06);
  }
  .scores {
    display: flex;
    gap: 8px;
  }
  .score-box {
    background: #bbada0;
    border-radius: 8px;
    padding: 6px 18px;
    text-align: center;
    min-width: 80px;
  }
  .score-box .label {
    font-size: 11px;
    text-transform: uppercase;
    color: #eee4da;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .score-box .value {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  .controls .hint {
    font-size: 14px;
    color: #776e65;
    opacity: 0.7;
  }
  .btn {
    background: #8f7a66;
    border: none;
    color: #f9f6f2;
    font-size: 15px;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.5px;
  }
  .btn:hover { background: #9f8b77; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .grid-container {
    position: relative;
    background: #bbada0;
    border-radius: 10px;
    padding: 12px;
    aspect-ratio: 1;
    touch-action: none;
    overflow: hidden;
  }
  .grid-background {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    width: 100%;
    height: 100%;
  }
  .grid-cell {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
    aspect-ratio: 1;
  }
  .tile-container {
    position: absolute;
    top: 12px; left: 12px; right: 12px; bottom: 12px;
  }
  .tile {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    border-radius: 6px;
    transition: top 0.12s ease, left 0.12s ease;
    z-index: 1;
  }
  .tile-inner {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 6px;
  }
  .tile-new .tile-inner { animation: tileAppear 0.2s ease; }
  .tile-merged .tile-inner { animation: tilePop 0.25s ease; }
  @keyframes tileAppear {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes tilePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .game-over-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(238, 228, 218, 0.73);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    gap: 15px;
    backdrop-filter: blur(2px);
  }
  .game-over-overlay.show { display: flex; }
  .game-over-overlay h2 {
    font-size: 48px;
    color: #776e65;
    font-weight: 800;
  }
  .game-over-overlay .sub { font-size: 18px; color: #776e65; }
  .game-over-overlay .btn { font-size: 18px; padding: 12px 36px; }

  /* Tile colors */
  .tile-2 .tile-inner { background: #eee4da; color: #776e65; }
  .tile-4 .tile-inner { background: #ede0c8; color: #776e65; }
  .tile-8 .tile-inner { background: #f2b179; color: #f9f6f2; }
  .tile-16 .tile-inner { background: #f59563; color: #f9f6f2; }
  .tile-32 .tile-inner { background: #f67c5f; color: #f9f6f2; }
  .tile-64 .tile-inner { background: #f65e3b; color: #f9f6f2; }
  .tile-128 .tile-inner {
    background: #edcf72; color: #f9f6f2;
    font-size: 0.85em;
    box-shadow: 0 0 20px 6px rgba(243,215,116,0.24);
  }
  .tile-256 .tile-inner {
    background: #edcc61; color: #f9f6f2;
    font-size: 0.85em;
    box-shadow: 0 0 20px 6px rgba(243,215,116,0.32);
  }
  .tile-512 .tile-inner {
    background: #edc850; color: #f9f6f2;
    font-size: 0.85em;
    box-shadow: 0 0 20px 6px rgba(243,215,116,0.4);
  }
  .tile-1024 .tile-inner {
    background: #edc53f; color: #f9f6f2;
    font-size: 0.7em;
    box-shadow: 0 0 20px 6px rgba(243,215,116,0.5);
  }
  .tile-2048 .tile-inner {
    background: #edc22e; color: #f9f6f2;
    font-size: 0.7em;
    box-shadow: 0 0 30px 10px rgba(243,215,116,0.6);
  }
  .tile-super .tile-inner {
    background: #3c3a32; color: #f9f6f2;
    font-size: 0.6em;
    box-shadow: 0 0 30px 10px rgba(60,58,50,0.4);
  }

  .tile-128 .tile-inner, .tile-256 .tile-inner,
  .tile-512 .tile-inner, .tile-1024 .tile-inner,
  .tile-2048 .tile-inner, .tile-super .tile-inner {
    font-weight: 700;
  }

  @media (max-width: 500px) {
    .container { padding: 12px; }
    .title { font-size: 36px; }
    .score-box { min-width: 68px; padding: 4px 12px; }
    .score-box .value { font-size: 18px; }
    .grid-container { padding: 8px; }
    .grid-background { gap: 8px; }
    .tile-container { top: 8px; left: 8px; right: 8px; bottom: 8px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="label">分数</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="label">最高</div>
        <div class="value" id="best-score">0</div>
      </div>
    </div>
  </div>
  <div class="controls">
    <span class="hint">← ↑ → ↓ 或 滑动</span>
    <button class="btn" id="new-game-btn">新游戏</button>
  </div>
  <div class="grid-container" id="grid-container">
    <div class="grid-background">
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
    </div>
    <div class="tile-container" id="tile-container"></div>
    <div class="game-over-overlay" id="game-over-overlay">
      <h2 id="over-title">游戏结束!</h2>
      <div class="sub" id="over-sub">你得了 <span id="final-score">0</span> 分</div>
      <button class="btn" id="restart-btn">再来一局</button>
    </div>
  </div>
</div>

<script>
(function() {
  const SIZE = 4;
  let grid = [];
  let score = 0;
  let bestScore = parseInt(localStorage.getItem('best2048') || '0');
  let isGameOver = false;
  let isMoving = false;

  const gridEl = document.getElementById('grid-container');
  const tileContainer = document.getElementById('tile-container');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best-score');
  const overlay = document.getElementById('game-over-overlay');
  const overTitle = document.getElementById('over-title');
  const finalScore = document.getElementById('final-score');

  // Touch handling
  let touchStartX = 0, touchStartY = 0;
  gridEl.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });
  gridEl.addEventListener('touchend', e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    if (Math.max(absDx, absDy) < 20) return;
    if (absDx > absDy) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  document.addEventListener('keydown', e => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
    const dir = map[e.key];
    if (dir) { e.preventDefault(); move(dir); }
  });

  document.getElementById('new-game-btn').addEventListener('click', init);
  document.getElementById('restart-btn').addEventListener('click', init);

  function init() {
    grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    isGameOver = false;
    isMoving = false;
    overlay.classList.remove('show');
    scoreEl.textContent = '0';
    bestEl.textContent = bestScore;
    addRandomTile();
    addRandomTile();
    render();
  }

  function getEmptyCells() {
    const cells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) cells.push({ r, c });
    return cells;
  }

  function addRandomTile() {
    const empty = getEmptyCells();
    if (empty.length === 0) return null;
    const { r, c } = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return { r, c, value: grid[r][c] };
  }

  function move(direction) {
    if (isGameOver || isMoving) return;
    const original = grid.map(row => [...row]);
    let merged = false;

    const traverse = [];
    for (let i = 0; i < SIZE; i++) traverse.push(i);

    const lines = [];
    if (direction === 'left') {
      for (let r = 0; r < SIZE; r++) {
        const line = [];
        for (let c = 0; c < SIZE; c++) line.push(grid[r][c]);
        lines.push(line);
      }
    } else if (direction === 'right') {
      for (let r = 0; r < SIZE; r++) {
        const line = [];
        for (let c = SIZE - 1; c >= 0; c--) line.push(grid[r][c]);
        lines.push(line);
      }
    } else if (direction === 'up') {
      for (let c = 0; c < SIZE; c++) {
        const line = [];
        for (let r = 0; r < SIZE; r++) line.push(grid[r][c]);
        lines.push(line);
      }
    } else if (direction === 'down') {
      for (let c = 0; c < SIZE; c++) {
        const line = [];
        for (let r = SIZE - 1; r >= 0; r--) line.push(grid[r][c]);
        lines.push(line);
      }
    }

    let totalScore = 0;
    const results = lines.map(line => {
      // Remove zeros
      const filtered = line.filter(v => v !== 0);
      // Merge adjacent equal
      const mergedLine = [];
      let i = 0;
      let scoreGained = 0;
      while (i < filtered.length) {
        if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
          const v = filtered[i] * 2;
          mergedLine.push(v);
          scoreGained += v;
          i += 2;
        } else {
          mergedLine.push(filtered[i]);
          i += 1;
        }
      }
      // Pad with zeros
      while (mergedLine.length < SIZE) mergedLine.push(0);
      return { mergedLine, scoreGained };
    });

    if (direction === 'left') {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          grid[r][c] = results[r].mergedLine[c];
    } else if (direction === 'right') {
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          grid[r][SIZE - 1 - c] = results[r].mergedLine[c];
    } else if (direction === 'up') {
      for (let c = 0; c < SIZE; c++)
        for (let r = 0; r < SIZE; r++)
          grid[r][c] = results[c].mergedLine[r];
    } else if (direction === 'down') {
      for (let c = 0; c < SIZE; c++)
        for (let r = 0; r < SIZE; r++)
          grid[SIZE - 1 - r][c] = results[c].mergedLine[r];
    }

    // Check if anything changed
    let changed = false;
    for (let r = 0; r < SIZE && !changed; r++)
      for (let c = 0; c < SIZE && !changed; c++)
        if (grid[r][c] !== original[r][c]) changed = true;

    if (!changed) return;

    results.forEach(r => { totalScore += r.scoreGained; });
    score += totalScore;
    scoreEl.textContent = score;
    if (score > bestScore) {
      bestScore = score;
      bestEl.textContent = bestScore;
      localStorage.setItem('best2048', bestScore.toString());
    }

    addRandomTile();
    render();

    if (checkGameOver()) {
      isGameOver = true;
      finalScore.textContent = score;
      overTitle.textContent = score >= 2048 ? '恭喜通关!' : '游戏结束!';
      setTimeout(() => overlay.classList.add('show'), 200);
    }
  }

  function checkGameOver() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) return false;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return false;
        if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return false;
      }
    return true;
  }

  function render() {
    const gap = window.innerWidth <= 500 ? 8 : 12;
    const padding = window.innerWidth <= 500 ? 8 : 12;
    const containerSize = tileContainer.offsetWidth;
    const cellSize = (containerSize - gap * (SIZE - 1)) / SIZE;

    tileContainer.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        if (val === 0) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        const cls = val <= 2048 ? `tile-${val}` : 'tile-super';
        tile.classList.add(cls);
        tile.style.width = cellSize + 'px';
        tile.style.height = cellSize + 'px';
        tile.style.left = (c * (cellSize + gap)) + 'px';
        tile.style.top = (r * (cellSize + gap)) + 'px';
        const inner = document.createElement('div');
        inner.className = 'tile-inner';
        inner.textContent = val;
        tile.appendChild(inner);
        tileContainer.appendChild(tile);
      }
    }
  }

  // Handle resize for responsive tiles
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 100);
  });

  // Best score display
  bestEl.textContent = bestScore;

  // Start game
  init();
})();
</script>
</body>
</html>
