<!DOCTYPE html>
<html lang=""zh-CN"">
<head>
<meta charset=""UTF-8"">
<meta name=""viewport"" content=""width=device-width, initial-scale=1.0"">
<title>随机起小说人物名称 - 创意展示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .container { background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 20px; padding: 40px; max-width: 600px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); }
  h1 { color: #e94560; text-align: center; font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: #a0a0b8; text-align: center; font-size: 14px; margin-bottom: 30px; }
  .style-selector { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
  .style-btn { padding: 10px 20px; border: 1px solid rgba(255,255,255,0.3); border-radius: 25px; background: rgba(255,255,255,0.05); color: #ccc; cursor: pointer; transition: all 0.3s; font-size: 14px; }
  .style-btn:hover, .style-btn.active { background: #e94560; border-color: #e94560; color: #fff; transform: translateY(-2px); }
  .result-card { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 30px; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 25px; }
  .name-display { font-size: 42px; color: #ffd700; font-weight: bold; letter-spacing: 4px; margin-bottom: 10px; transition: all 0.5s; }
  .name-desc { color: #888; font-size: 13px; }
  .generate-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #e94560, #c23152); border: none; border-radius: 30px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: all 0.3s; }
  .generate-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(233,69,96,0.4); }
  .generate-btn:active { transform: scale(0.97); }
  .features { display: flex; gap: 20px; margin-top: 25px; }
  .feature-item { flex: 1; text-align: center; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 10px; }
  .feature-item .icon { font-size: 24px; margin-bottom: 8px; }
  .feature-item .label { color: #ccc; font-size: 12px; }
</style>
</head>
<body>
<div class=""container"">
  <h1>随机起小说人物名称</h1>
  <p class=""subtitle"">一键生成 · 多风格可选 · 写作创作利器</p>
  <div class=""style-selector"">
    <button class=""style-btn active"" onclick=""selectStyle(this,'古风')"">古风</button>
    <button class=""style-btn"" onclick=""selectStyle(this,'现代')"">现代</button>
    <button class=""style-btn"" onclick=""selectStyle(this,'西方奇幻')"">西方奇幻</button>
    <button class=""style-btn"" onclick=""selectStyle(this,'日系')"">日系</button>
  </div>
  <div class=""result-card"">
    <div class=""name-display"" id=""nameDisplay"">慕容雪寒</div>
    <div class=""name-desc"" id=""nameDesc"">古风 · 冷艳孤高</div>
  </div>
  <button class=""generate-btn"" onclick=""generateName()"">随机生成新名称</button>
  <div class=""features"">
    <div class=""feature-item""><div class=""icon"">4</div><div class=""label"">种风格</div></div>
    <div class=""feature-item""><div class=""icon"">100+</div><div class=""label"">名字组合</div></div>
    <div class=""feature-item""><div class=""icon"">即点</div><div class=""label"">即得</div></div>
  </div>
</div>
<script>
let currentStyle = '古风';
const names = {
  '古风': {
    surnames: ['慕容','上官','南宫','欧阳','独孤','萧','叶','苏','沈','林','顾','谢','白','陆','花','柳','温','裴','容','莫'],
    maleFirst: ['云深','墨渊','子衿','长卿','逸尘','瑾瑜','清寒','玉衡','凌霄','鹤轩','临风','星河','无痕','凌云','雪寒'],
    femaleFirst: ['若兰','清漪','婉宁','芷若','念卿','如烟','落薇','凝香','灵犀','月瑶','思柔','映雪','含章','若兮','幽篁'],
    desc: ['冷艳孤高','温润如玉','潇洒不羁','清逸出尘','风华绝代','侠骨柔情','淡雅如兰','傲雪凌霜']
  },
  '现代': {
    surnames: ['陈','林','李','张','王','赵','周','吴','郑','冯','蒋','沈','韩','杨','朱','秦','许','何','吕','施'],
    maleFirst: ['子轩','浩然','宇辰','铭泽','俊杰','博文','智宸','天宇','嘉懿','煜城'],
    femaleFirst: ['雨桐','梓涵','一诺','欣怡','诗涵','思雨','晓彤','悠然','若曦','珺瑶'],
    desc: ['阳光开朗','成熟稳重','知性优雅','活力四射','温婉可人','聪明睿智']
  },
  '西方奇幻': {
    surnames: ['奥尔德','温斯顿','布莱克','格里芬','索恩','雷文','艾尔','达米安','卢卡斯','维克多','塞巴斯蒂安','尼古拉斯'],
    maleFirst: ['阿尔萨斯','凯尔','雷加','伊瑟拉','玛法里奥','洛萨','安度因','瓦里安','索拉丁','迦罗娜'],
    femaleFirst: ['艾莉亚','瑟琳娜','伊莎贝拉','莉莉丝','维多利亚','奥菲莉亚','艾琳','西尔维娅','卡珊德拉','爱丽丝'],
    desc: ['勇敢无畏','神秘莫测','高贵优雅','智慧深邃','传奇英雄','黑暗力量','光明使者']
  },
  '日系': {
    surnames: ['樱井','佐藤','田中','高桥','渡边','伊藤','山本','中村','小林','加藤','吉田','山口','松本','井上','木村'],
    maleFirst: ['翔太','莲','悠人','大辉','拓海','隼人','阳太','飒太','龙之介','健一'],
    femaleFirst: ['樱','凛','阳菜','结衣','葵','美咲','七海','花音','千寻','绫乃'],
    desc: ['元气满满','温柔治愈','冷静沉着','热血执着','可爱甜美','忧郁深邃']
  }
};

function selectStyle(btn, style) {
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentStyle = style;
}

function random(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateName() {
  const s = names[currentStyle];
  const surname = random(s.surnames);
  const genderRoll = Math.random();
  let firstName;
  if (genderRoll < 0.5 || !('maleFirst' in s)) firstName = random(s.femaleFirst || s.maleFirst);
  else firstName = random(s.maleFirst || s.femaleFirst);
  const fullName = surname + firstName;
  const desc = random(s.desc);
  document.getElementById('nameDisplay').textContent = fullName;
  document.getElementById('nameDesc').textContent = currentStyle + ' · ' + desc;
}

document.querySelector('.generate-btn').addEventListener('click', function(e) {
  generateName();
  this.style.transform = 'scale(0.95)';
  setTimeout(() => { this.style.transform = ''; }, 150);
});
</script>
</body>
</html>
