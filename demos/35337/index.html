<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 300px;
            font-size: 18px;
            font-weight: bold;
        }

        .score {
            color: #4CAF50;
        }

        .high-score {
            color: #FF9800;
        }

        .game-board {
            background: #2d2d44;
            border: 3px solid #4CAF50;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }

        .cell {
            position: absolute;
            border-radius: 2px;
        }

        .snake-head {
            background: #4CAF50;
            border-radius: 4px;
        }

        .snake-body {
            background: #8BC34A;
        }

        .food {
            background: #FF5722;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .instructions {
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .start-text {
            color: white;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
        }

        .control-row {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            background: #3d3d5c;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .control-btn:hover {
            background: #4CAF50;
            transform: scale(1.05);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .reset-btn {
            margin-top: 10px;
            padding: 12px 30px;
            background: #FF5722;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #ff7043;
            transform: scale(1.05);
        }

        .reset-btn:active {
            transform: scale(0.95);
        }

        .game-over-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .game-over-text {
            font-size: 48px;
            font-weight: bold;
            color: #FF5722;
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 24px;
            color: white;
            margin-bottom: 30px;
        }

        .play-again-btn {
            padding: 15px 40px;
            background: #4CAF50;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .play-again-btn:hover {
            background: #66bb6a;
            transform: scale(1.05);
        }

        .play-again-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <span class="score">得分: <span id="score">0</span></span>
            <span class="high-score">最高分: <span id="high-score">0</span></span>
        </div>

        <div id="game-board" class="game-board"></div>

        <div class="instructions">
            <div id="start-text" class="start-text">按方向键或点击按钮开始游戏</div>
            <div>使用方向键或屏幕按钮控制方向</div>
        </div>

        <div class="controls">
            <div class="control-row">
                <button class="control-btn" id="btn-up">↑</button>
            </div>
            <div class="control-row">
                <button class="control-btn" id="btn-left">←</button>
                <button class="control-btn" id="btn-right">→</button>
            </div>
            <div class="control-row">
                <button class="control-btn" id="btn-down">↓</button>
            </div>
        </div>

        <button class="reset-btn" id="reset-btn">重新开始</button>
    </div>

    <div id="game-over-overlay" class="game-over-overlay" style="display: none;">
        <div class="game-over-text">游戏结束</div>
        <div class="final-score">得分: <span id="final-score">0</span></div>
        <button class="play-again-btn" id="play-again-btn">再来一局</button>
    </div>

    <script>
        const GRID_SIZE = 20;
        const CELL_SIZE = 15;
        const INITIAL_SPEED = 150;

        const DIRECTIONS = {
            UP: { x: 0, y: -1 },
            DOWN: { x: 0, y: 1 },
            LEFT: { x: -1, y: 0 },
            RIGHT: { x: 1, y: 0 },
        };

        const gameBoard = document.getElementById('game-board');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const startText = document.getElementById('start-text');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const finalScoreElement = document.getElementById('final-score');

        gameBoard.style.width = `${GRID_SIZE * CELL_SIZE}px`;
        gameBoard.style.height = `${GRID_SIZE * CELL_SIZE}px`;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 },
        ];
        let food = { x: 15, y: 10 };
        let direction = DIRECTIONS.RIGHT;
        let gameOver = false;
        let score = 0;
        let isPlaying = false;
        let highScore = 0;
        let gameLoop = null;
        let speed = INITIAL_SPEED;

        const generateFood = () => {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE),
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            return newFood;
        };

        const checkCollision = (head) => {
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                return true;
            }
            return snake.slice(0, -1).some(segment => segment.x === head.x && segment.y === head.y);
        };

        const moveSnake = () => {
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y,
            };

            if (checkCollision(head)) {
                endGame();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                food = generateFood();
                score += 10;
                scoreElement.textContent = score;
                speed = Math.max(50, speed - 5);
                resetGameLoop();
            } else {
                snake.pop();
            }

            render();
        };

        const resetGameLoop = () => {
            if (gameLoop) {
                clearInterval(gameLoop);
            }
            gameLoop = setInterval(moveSnake, speed);
        };

        const startGame = () => {
            if (isPlaying || gameOver) return;
            isPlaying = true;
            startText.textContent = '游戏进行中...';
            resetGameLoop();
        };

        const endGame = () => {
            gameOver = true;
            isPlaying = false;
            if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
            }
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
            }
            finalScoreElement.textContent = score;
            gameOverOverlay.style.display = 'flex';
            render();
        };

        const resetGame = () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 },
            ];
            food = generateFood();
            direction = DIRECTIONS.RIGHT;
            gameOver = false;
            score = 0;
            isPlaying = false;
            speed = INITIAL_SPEED;
            scoreElement.textContent = score;
            startText.textContent = '按方向键或点击按钮开始游戏';
            gameOverOverlay.style.display = 'none';
            if (gameLoop) {
                clearInterval(gameLoop);
                gameLoop = null;
            }
            render();
        };

        const changeDirection = (newDirection) => {
            const opposites = {
                [DIRECTIONS.UP]: DIRECTIONS.DOWN,
                [DIRECTIONS.DOWN]: DIRECTIONS.UP,
                [DIRECTIONS.LEFT]: DIRECTIONS.RIGHT,
                [DIRECTIONS.RIGHT]: DIRECTIONS.LEFT,
            };

            if (opposites[newDirection] !== direction) {
                direction = newDirection;
                if (!isPlaying) {
                    startGame();
                }
            }
        };

        const render = () => {
            gameBoard.innerHTML = '';

            snake.forEach((segment, index) => {
                const cell = document.createElement('div');
                cell.className = `cell ${index === 0 ? 'snake-head' : 'snake-body'}`;
                cell.style.width = `${CELL_SIZE - 2}px`;
                cell.style.height = `${CELL_SIZE - 2}px`;
                cell.style.left = `${segment.x * CELL_SIZE}px`;
                cell.style.top = `${segment.y * CELL_SIZE}px`;
                gameBoard.appendChild(cell);
            });

            const foodCell = document.createElement('div');
            foodCell.className = 'cell food';
            foodCell.style.width = `${CELL_SIZE - 4}px`;
            foodCell.style.height = `${CELL_SIZE - 4}px`;
            foodCell.style.left = `${food.x * CELL_SIZE + 2}px`;
            foodCell.style.top = `${food.y * CELL_SIZE + 2}px`;
            gameBoard.appendChild(foodCell);
        };

        document.getElementById('btn-up').addEventListener('click', () => changeDirection(DIRECTIONS.UP));
        document.getElementById('btn-down').addEventListener('click', () => changeDirection(DIRECTIONS.DOWN));
        document.getElementById('btn-left').addEventListener('click', () => changeDirection(DIRECTIONS.LEFT));
        document.getElementById('btn-right').addEventListener('click', () => changeDirection(DIRECTIONS.RIGHT));
        document.getElementById('reset-btn').addEventListener('click', resetGame);
        document.getElementById('play-again-btn').addEventListener('click', resetGame);

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    changeDirection(DIRECTIONS.UP);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    changeDirection(DIRECTIONS.DOWN);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    changeDirection(DIRECTIONS.LEFT);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    changeDirection(DIRECTIONS.RIGHT);
                    break;
                case ' ':
                    e.preventDefault();
                    if (gameOver) {
                        resetGame();
                    } else if (!isPlaying) {
                        startGame();
                    }
                    break;
            }
        });

        render();
    </script>
</body>
</html>
