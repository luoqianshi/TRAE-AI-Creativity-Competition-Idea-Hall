<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人生模拟器 - 命运的选择</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #07070f;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.08);
  --text: #ffffff;
  --text-sec: rgba(255,255,255,0.5);
  --gold: #FFD700;
  --gold-dim: rgba(255,215,0,0.25);
  --purple: #CE93D8;
  --red: #EF5350;
  --blue: #42A5F5;
  --green: #66BB6A;
  --radius: 16px;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* ── Background layers ── */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.bg-gradient {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(100,60,200,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 60% 80% at 80% 90%, rgba(200,100,50,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(50,150,255,0.05) 0%, transparent 70%);
}

.bg-noise {
  position: absolute;
  inset: 0;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 256px;
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.3;
  animation: orbFloat 20s ease-in-out infinite alternate;
}

.bg-orb-1 {
  width: 400px; height: 400px;
  background: rgba(100,60,200,0.15);
  top: -100px; left: -100px;
  animation-delay: 0s;
}

.bg-orb-2 {
  width: 350px; height: 350px;
  background: rgba(200,100,50,0.1);
  bottom: -80px; right: -80px;
  animation-delay: -7s;
}

.bg-orb-3 {
  width: 300px; height: 300px;
  background: rgba(50,150,255,0.08);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  animation-delay: -14s;
}

@keyframes orbFloat {
  0%   { transform: translate(0, 0) scale(1); }
  33%  { transform: translate(30px, -20px) scale(1.1); }
  66%  { transform: translate(-20px, 30px) scale(0.95); }
  100% { transform: translate(10px, -10px) scale(1.05); }
}

/* ── Stars ── */
.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
  animation-delay: var(--delay, 0s);
}

@keyframes twinkle {
  0%   { opacity: 0.1; transform: scale(0.8); }
  100% { opacity: 1;   transform: scale(1.2); }
}

/* ── App ── */
.app {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 24px 20px 20px;
  max-width: 420px;
  margin: 0 auto;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* hide scrollbar */
.app::-webkit-scrollbar { display: none; }

/* ── Header ── */
.header {
  text-align: center;
  padding: 4px 0 8px;
  flex-shrink: 0;
}

.header-sup {
  font-size: 11px;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--text-sec);
  margin-bottom: 6px;
  font-weight: 500;
}

.header h1 {
  font-family: 'ZCOOL QingKe HuangYou', cursive;
  font-size: 34px;
  font-weight: 400;
  background: linear-gradient(135deg, #fff 30%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  letter-spacing: 4px;
  position: relative;
  display: inline-block;
}

.header h1::after {
  content: '';
  position: absolute;
  inset: -20px -40px;
  background: radial-gradient(ellipse at center, rgba(255,215,0,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.header-sub {
  font-size: 13px;
  color: var(--text-sec);
  margin-top: 6px;
  letter-spacing: 2px;
  font-weight: 400;
}

/* ── Divider ── */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 14px;
  flex-shrink: 0;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}

.divider-icon {
  font-size: 14px;
  opacity: 0.4;
}

/* ── Cards ── */
.card-grid {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.card-row {
  display: flex;
  gap: 12px;
}

.card-row--top .card {
  flex: 1;
}

.card-row--bottom {
  justify-content: center;
}

.card-row--bottom .card {
  flex: 1;
  max-width: 50%;
}

.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 12px 14px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
              background 0.3s ease,
              border-color 0.3s ease,
              box-shadow 0.35s ease;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
}

.card:hover {
  transform: translateY(-6px) scale(1.02);
}

.card:active {
  transform: translateY(-2px) scale(0.98);
}

/* ── Card color themes ── */
.card--ceo   { --accent: var(--gold);   --accent-dim: rgba(255,215,0,0.12); }
.card--singer{ --accent: var(--purple); --accent-dim: rgba(206,147,216,0.12); }
.card--actor { --accent: var(--red);    --accent-dim: rgba(239,83,80,0.12); }
.card--worker{ --accent: var(--blue);   --accent-dim: rgba(66,165,245,0.12); }
.card--farmer{ --accent: var(--green);  --accent-dim: rgba(102,187,106,0.12); }

.card {
  border-color: var(--accent-dim);
  box-shadow: 0 2px 20px transparent;
}

.card:hover,
.card:active {
  border-color: var(--accent);
  background: var(--surface-hover);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.card--ceo:hover {
  box-shadow: 0 8px 40px rgba(255,215,0,0.12);
}

/* ── Card inner glow ── */
.card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0;
  transition: opacity 0.4s ease;
}

.card:hover::after {
  opacity: 0.6;
}

/* ── Card content ── */
.card-icon {
  font-size: 32px;
  line-height: 1;
  margin-bottom: 6px;
  display: block;
  transition: transform 0.3s ease;
}

.card:hover .card-icon {
  transform: scale(1.15);
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  line-height: 1.3;
}

.card-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 6px;
}

.card-price {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(255,255,255,0.06);
  color: var(--text-sec);
  letter-spacing: 0.5px;
}

.card-price--free {
  background: var(--gold-dim);
  color: var(--gold);
}

.card-diff {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  font-size: 10px;
  color: var(--text-sec);
}

.card-diff .star {
  position: static;
  animation: none;
  border-radius: 0;
  background: none;
  width: auto;
  height: auto;
  opacity: 1;
  transform: none;
}

.card-diff .star--on {
  color: var(--accent);
}

.card-diff .star--off {
  color: rgba(255,255,255,0.12);
}

/* ── Recommended badge ── */
.card-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--gold), #F0A500);
  color: #1a1a2e;
  letter-spacing: 0.5px;
  animation: badgePulse 2.5s ease-in-out infinite;
  box-shadow: 0 0 20px rgba(255,215,0,0.3);
}

@keyframes badgePulse {
  0%, 100% { box-shadow: 0 0 12px rgba(255,215,0,0.25); }
  50%      { box-shadow: 0 0 24px rgba(255,215,0,0.5); }
}

/* ── Entrance animation ── */
.card {
  opacity: 0;
  transform: translateY(20px);
  animation: cardEnter 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

.card-row--top .card:nth-child(1) { animation-delay: 0.15s; }
.card-row--top .card:nth-child(2) { animation-delay: 0.25s; }
.card-row--bottom .card:nth-child(1) { animation-delay: 0.35s; }
.card-row--bottom .card:nth-child(2) { animation-delay: 0.45s; }
.card-row--bottom .card:nth-child(3) { animation-delay: 0.55s; }

@keyframes cardEnter {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ── Footer ── */
.footer {
  flex-shrink: 0;
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  animation: fadeUp 0.5s ease 0.7s forwards;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.footer-actions {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 12px 0;
  border: none;
  border-radius: 12px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  letter-spacing: 1px;
  -webkit-tap-highlight-color: transparent;
}

.btn:active {
  transform: scale(0.97);
}

.btn--primary {
  background: linear-gradient(135deg, rgba(255,215,0,0.9), rgba(240,165,0,0.9));
  color: #1a1a2e;
  box-shadow: 0 4px 24px rgba(255,215,0,0.2);
}

.btn--primary:hover {
  box-shadow: 0 6px 32px rgba(255,215,0,0.35);
}

.btn--secondary {
  background: rgba(255,255,255,0.06);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.1);
}

.btn--secondary:hover {
  background: rgba(255,255,255,0.1);
}

.footer-tip {
  text-align: center;
  font-size: 11px;
  color: var(--text-sec);
  letter-spacing: 1px;
  line-height: 1.6;
}

.footer-tip span {
  display: inline-block;
  background: linear-gradient(135deg, var(--gold), #F0A500);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
}

/* ── Responsive ── */
@media (max-width: 360px) {
  .app { padding: 16px 14px 14px; }
  .header h1 { font-size: 28px; }
  .card { padding: 14px 10px 12px; }
  .card-icon { font-size: 26px; }
  .card-title { font-size: 13px; }
}

@media (min-height: 800px) {
  .app { justify-content: center; }
  .header { padding: 8px 0 12px; }
  .card { padding: 22px 16px 18px; }
  .card-icon { font-size: 38px; }
  .card-title { font-size: 17px; }
}

@media (max-height: 640px) {
  .header { padding: 0 0 4px; }
  .header h1 { font-size: 26px; }
  .header-sub { font-size: 11px; margin-top: 2px; }
  .divider { margin: 4px 0 8px; }
  .card { padding: 12px 8px 10px; }
  .card-icon { font-size: 24px; margin-bottom: 2px; }
  .card-title { font-size: 12px; }
  .card-meta { margin-top: 3px; }
  .card-price { font-size: 10px; padding: 1px 6px; }
  .card-diff { font-size: 9px; }
  .card-badge { font-size: 8px; top: 4px; right: 4px; padding: 1px 6px; }
  .btn { padding: 8px 0; font-size: 12px; }
  .footer-tip { font-size: 10px; }
  .footer { padding-top: 6px; gap: 4px; }
  .card-grid { gap: 8px; }
  .card-row { gap: 8px; }
}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="stars" id="stars"></div>
</div>

<div class="app">

  <div class="header">
    <div class="header-sup">✦ 命 运 的 选 择 ✦</div>
    <h1>人生模拟器</h1>
    <div class="header-sub">五条人生 &nbsp;·&nbsp; 五种活法</div>
  </div>

  <div class="divider">
    <span class="divider-line"></span>
    <span class="divider-icon">∞</span>
    <span class="divider-line"></span>
  </div>

  <div class="card-grid">

    <div class="card-row card-row--top">
      <!-- 总裁 / CEO -->
      <div class="card card--ceo" data-path="ceo">
        <span class="card-badge">推荐</span>
        <span class="card-icon">👔</span>
        <div class="card-title">总裁</div>
        <div class="card-meta">
          <span class="card-price card-price--free">免费</span>
          <span class="card-diff">
            <span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span>
          </span>
        </div>
      </div>

      <!-- 歌手 / Singer -->
      <div class="card card--singer" data-path="singer">
        <span class="card-icon">🎤</span>
        <div class="card-title">歌手</div>
        <div class="card-meta">
          <span class="card-price">￥12</span>
          <span class="card-diff">
            <span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span><span class="star--off">★</span>
          </span>
        </div>
      </div>
    </div>

    <div class="card-row card-row--bottom">
      <!-- 演员 / Actor -->
      <div class="card card--actor" data-path="actor">
        <span class="card-icon">🎬</span>
        <div class="card-title">演员</div>
        <div class="card-meta">
          <span class="card-price">￥12</span>
          <span class="card-diff">
            <span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span><span class="star--off">★</span>
          </span>
        </div>
      </div>

      <!-- 白领 / Worker -->
      <div class="card card--worker" data-path="worker">
        <span class="card-icon">💼</span>
        <div class="card-title">白领</div>
        <div class="card-meta">
          <span class="card-price">￥6</span>
          <span class="card-diff">
            <span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span><span class="star--off">★</span><span class="star--off">★</span>
          </span>
        </div>
      </div>

      <!-- 农民 / Farmer -->
      <div class="card card--farmer" data-path="farmer">
        <span class="card-icon">🌾</span>
        <div class="card-title">农民</div>
        <div class="card-meta">
          <span class="card-price">￥6</span>
          <span class="card-diff">
            <span class="star--on">★</span><span class="star--on">★</span><span class="star--on">★</span><span class="star--off">★</span><span class="star--off">★</span>
          </span>
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    <div class="footer-actions">
      <button class="btn btn--primary">解锁全部 ￥30</button>
      <button class="btn btn--secondary">会员 ￥19.9/月</button>
    </div>
    <div class="footer-tip">
      【推荐】首次体验建议选择 <span>总裁</span>（免费）<br>
      每条线通关后可获得专属人生报告
    </div>
  </div>

</div>

<script>
(function() {
  // ── Stars ──
  const container = document.getElementById('stars');
  const count = 80;
  for (let i = 0; i < count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    star.style.cssText = [
      'left:' + (Math.random() * 100) + '%',
      'top:' + (Math.random() * 100) + '%',
      'width:' + size + 'px',
      'height:' + size + 'px',
      '--delay:' + (Math.random() * 5).toFixed(2) + 's',
      '--dur:' + (Math.random() * 3 + 2).toFixed(2) + 's'
    ].join(';');
    container.appendChild(star);
  }

  // ── Card click handler ──
  const cards = document.querySelectorAll('.card');
  const pathNames = {
    ceo: '总裁 👔',
    singer: '歌手 🎤',
    actor: '演员 🎬',
    worker: '白领 💼',
    farmer: '农民 🌾'
  };

  cards.forEach(card => {
    card.addEventListener('click', function(e) {
      const path = this.dataset.path;
      const name = pathNames[path] || path;
      if (!this.classList.contains('card--ceo')) {
        // Show pay prompt for paid paths
        showToast('🔒 请先解锁「' + name + '」($' + (this.querySelector('.card-price')?.textContent || '') + ')');
        return;
      }
      showToast('✨ 命运已定 —— 你选择了 ' + name + '\n人生模拟即将开始……');
    });
  });

  // ── Button handlers ──
  document.querySelector('.btn--primary')?.addEventListener('click', function() {
    showToast('🔓 解锁全部人生路线？（演示交互）');
  });

  document.querySelector('.btn--secondary')?.addEventListener('click', function() {
    showToast('🌟 开通会员，畅玩所有路线！（演示交互）');
  });

  // ── Toast ──
  function showToast(msg) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    Object.assign(toast.style, {
      position: 'fixed',
      bottom: '100px',
      left: '50%',
      transform: 'translateX(-50%) translateY(20px)',
      background: 'rgba(20,20,40,0.95)',
      backdropFilter: 'blur(20px)',
      WebkitBackdropFilter: 'blur(20px)',
      border: '1px solid rgba(255,255,255,0.1)',
      borderRadius: '14px',
      padding: '14px 24px',
      color: '#fff',
      fontSize: '14px',
      fontWeight: '500',
      letterSpacing: '0.5px',
      textAlign: 'center',
      lineHeight: '1.6',
      zIndex: '999',
      opacity: '0',
      transition: 'opacity 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1)',
      maxWidth: 'calc(100vw - 48px)',
      boxShadow: '0 8px 40px rgba(0,0,0,0.6)',
      whiteSpace: 'pre-line'
    });
    document.body.appendChild(toast);

    requestAnimationFrame(() => {
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
    });

    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateX(-50%) translateY(10px)';
      setTimeout(() => toast.remove(), 400);
    }, 2500);
  }
})();
</script>
</body>
</html>
