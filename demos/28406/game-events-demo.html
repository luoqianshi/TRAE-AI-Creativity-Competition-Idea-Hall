<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏活动中心 | Game Events Hub</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#fef9f0;color:#2d1b0e;line-height:1.6}
        .container{max-width:1200px;margin:0 auto;padding:20px}
        header{text-align:center;padding:40px 0 20px}
        h1{font-size:2.5rem;background:linear-gradient(135deg,#ff6b35,#ff2d78,#ffb800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .subtitle{color:#7a6652;font-size:0.9rem;margin-top:8px}
        .stats{display:flex;justify-content:center;gap:40px;margin:24px 0;flex-wrap:wrap}
        .stat{text-align:center}
        .stat-num{font-size:2rem;font-weight:700;color:#ff6b35}
        .stat-label{font-size:0.8rem;color:#7a6652}
        .filters{display:flex;justify-content:center;gap:8px;margin:20px 0;flex-wrap:wrap}
        .filter-btn{padding:8px 16px;border:1px solid #f0e0cc;border-radius:20px;background:#fff;color:#7a6652;cursor:pointer;transition:all .2s;font-size:0.85rem}
        .filter-btn:hover{border-color:#ff9a56;color:#ff6b35}
        .filter-btn.active{background:#ff6b35;color:#fff;border-color:#ff6b35}
        .events{ display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px}
        .event-card{background:#fff;border:1px solid #f0e0cc;border-radius:12px;overflow:hidden;transition:all .2s;cursor:pointer;text-decoration:none;color:inherit;display:block}
        .event-card:hover{transform:translateY(-4px);border-color:#ff9a56;box-shadow:0 8px 24px rgba(255,107,53,.15)}
        .event-img{height:140px;background:linear-gradient(135deg,#fff3e6,#ffe0cc);display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
        .event-img img{width:100%;height:100%;object-fit:cover}
        .event-img .icon{opacity:.3;font-size:4rem}
        .event-body{padding:16px}
        .event-title{font-weight:600;font-size:0.95rem;margin-bottom:8px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .event-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
        .tag{font-size:0.7rem;padding:3px 10px;border-radius:12px;font-weight:500}
        .tag-game{background:rgba(255,107,53,.1);color:#ff6b35}
        .tag-type{background:#f5f5f5;color:#666}
        .tag-time{color:#fff}
        .tag-time.live{background:#00c853}
        .tag-time.upcoming{background:#ffb800}
        .tag-time.ended{background:#999}
        .event-time{font-size:0.8rem;color:#7a6652}
        .event-reward{font-size:0.8rem;color:#ff6b35;margin-top:4px}
        .section-title{font-size:1.1rem;font-weight:700;margin:32px 0 16px;padding-bottom:8px;border-bottom:2px solid #f0e0cc}
        .empty{text-align:center;padding:60px 20px;color:#7a6652}
        @media(max-width:768px){h1{font-size:1.8rem}.events{grid-template-columns:1fr}.stats{gap:20px}}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>游戏活动中心</h1>
            <p class="subtitle">原神 / 崩坏：星穹铁道 / 洛克王国：世界</p>
            <div class="stats">
                <div class="stat"><div class="stat-num" id="stat-total">-</div><div class="stat-label">活动总数</div></div>
                <div class="stat"><div class="stat-num" id="stat-live">-</div><div class="stat-label">进行中</div></div>
                <div class="stat"><div class="stat-num" id="stat-upcoming">-</div><div class="stat-label">即将开始</div></div>
            </div>
        </header>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">全部</button>
            <button class="filter-btn" data-filter="genshin">原神</button>
            <button class="filter-btn" data-filter="starrail">崩铁</button>
            <button class="filter-btn" data-filter="roco">洛克王国</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-type="all">全部类型</button>
            <button class="filter-btn" data-type="activity">限时活动</button>
            <button class="filter-btn" data-type="gacha">卡池/祈愿</button>
            <button class="filter-btn" data-type="shop">周边上新</button>
        </div>

        <div id="events-container"></div>
    </div>

<script>
// 嵌入式数据（精简版）
const eventsData = [
    {"id":"genshin_75880335","game":"原神","category":"genshin","title":"【有奖活动】提瓦特冒险记——勇锐魁杰试炼战记！","url":"https://www.miyoushe.com/ys/article/75880335","activity_time":"2026-06-08 00:00 - 2026-06-17 23:59","reward":"原石","event_type":"activity","start_time":"2026-06-08 00:00","end_time":"2026-06-17 23:59"},
    {"id":"luoke_bili_1212273425779785752_2513619526","game":"洛克王国：世界","category":"roco","title":"大世界观察笔记","url":"https://www.bilibili.com/opus/1212273425779785752","activity_time":"2026-06-12 04:00 - 2026-06-19 04:00","reward":"分光水晶、能力钥匙、贤者碎晶、精灵","event_type":"activity","start_time":"2026-06-12 04:00","end_time":"2026-06-19 04:00"},
    {"id":"luoke_wiki_20260605_destined_seed","game":"洛克王国：世界","category":"roco","title":"命定花种（咕德帽帽/巨鼓象/烟花伯爵/小丑公爵）","url":"https://www.bilibili.com/opus/1209675820980764721","activity_time":"2026-06-05 04:00 - 2026-06-19 04:00","reward":"对应性格精灵、灵魂环印、分光水晶","event_type":"activity","start_time":"2026-06-05 04:00","end_time":"2026-06-19 04:00"},
    {"id":"luoke_bili_1212273425779785752_2513619526_photography","game":"洛克王国：世界","category":"roco","title":"主题摄影评选赛","url":"https://www.bilibili.com/opus/1212273425779785752","activity_time":"2026-06-12 04:00 - 2026-06-19 04:00","reward":"闪耀宝石、精灵","event_type":"activity","start_time":"2026-06-12 04:00","end_time":"2026-06-19 04:00"},
    {"id":"genshin_75880336","game":"原神","category":"genshin","title":"【祈愿】心珠循琅·心海复刻","url":"https://www.miyoushe.com/ys/article/75880336","activity_time":"2026-06-09 18:00 - 2026-06-30 14:59","reward":"珊瑚宫心海","event_type":"gacha","start_time":"2026-06-09 18:00","end_time":"2026-06-30 14:59"},
    {"id":"starrail_121336789","game":"崩坏：星穹铁道","category":"starrail","title":"【跃迁】角色活动跃迁","url":"https://www.miyoushe.com/sr/article/121336789","activity_time":"2026-06-11 12:00 - 2026-07-01 15:00","reward":"限定角色","event_type":"gacha","start_time":"2026-06-11 12:00","end_time":"2026-07-01 15:00"},
    {"id":"genshin_shop_001","game":"原神","category":"genshin","title":"原神主题周边上新","url":"https://shop.mihoyo.com","activity_time":"2026-06-15 20:00起","reward":"周边商品","event_type":"shop","start_time":"2026-06-15 20:00","end_time":"2026-07-15 23:59"},
    {"id":"luoke_shop_001","game":"洛克王国：世界","category":"roco","title":"洛克王国周边预售","url":"https://shop.bilibili.com","activity_time":"2026-06-10 12:00起","reward":"限定周边","event_type":"shop","start_time":"2026-06-10 12:00","end_time":"2026-06-30 23:59"},
    {"id":"genshin_notice_001","game":"原神","category":"genshin","title":"5.7版本更新维护预告","url":"https://www.miyoushe.com/ys/article/75880000","activity_time":"2026-06-18 06:00 - 11:00","reward":"维护补偿","event_type":"notice","start_time":"2026-06-18 06:00","end_time":"2026-06-18 11:00"},
    {"id":"starrail_notice_001","game":"崩坏：星穹铁道","category":"starrail","title":"2.3版本「再见，匹诺康尼」前瞻","url":"https://www.miyoushe.com/sr/article/121330000","activity_time":"2026-06-07 19:30","reward":"兑换码","event_type":"guide","start_time":"2026-06-07 19:30","end_time":"2026-06-07 21:00"}
];

const gameIcons = {genshin:'◆',starrail:'◎',roco:'♔'};
const typeLabels = {activity:'限时活动',gacha:'卡池/祈愿',shop:'周边上新',notice:'维护公告',guide:'攻略前瞻',event:'线下活动'};

let currentFilter = 'all', currentType = 'all';

function parseTime(t){if(!t)return null;const m=t.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})\s+(\d{1,2}):(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]);return null}
function getStatus(ev){const s=parseTime(ev.start_time),e=parseTime(ev.end_time);if(!s||!e)return null;const n=new Date();if(n>=e)return{text:'已结束',cls:'ended'};if(n<s){const d=s-n;return{text:`${Math.ceil(d/864e5)}天后开始`,cls:'upcoming'}}const d=e-n;if(d<864e5)return{text:`剩余${Math.ceil(d/36e5)}小时`,cls:'live'};return{text:`剩余${Math.ceil(d/864e5)}天`,cls:'live'}}
function createCard(ev){const st=getStatus(ev);const gi=gameIcons[ev.category]||'●';const tl=typeLabels[ev.event_type]||ev.event_type;return`<a class="event-card" href="${ev.url}" target="_blank"><div class="event-img"><span class="icon">${gi}</span></div><div class="event-body"><div class="event-title">${ev.title}</div><div class="event-meta"><span class="tag tag-game">${gi} ${ev.game}</span><span class="tag tag-type">${tl}</span>${st?`<span class="tag tag-time ${st.cls}">${st.text}</span>`:''}</div><div class="event-time">${ev.activity_time||''}</div>${ev.reward?`<div class="event-reward">奖励：${ev.reward}</div>`:''}</div></a>`}
function render(){let f=eventsData;if(currentFilter!=='all')f=f.filter(e=>e.category===currentFilter);if(currentType!=='all')f=f.filter(e=>e.event_type===currentType);const c=document.getElementById('events-container');if(f.length===0){c.innerHTML='<div class="empty">暂无活动数据</div>';return}const n=new Date();const live=f.filter(e=>{const s=parseTime(e.start_time),e2=parseTime(e.end_time);return s&&e2&&n>=s&&n<e2}).sort((a,b)=>parseTime(a.end_time)-parseTime(b.end_time));const upc=f.filter(e=>{const s=parseTime(e.start_time);return s&&n<s}).sort((a,b)=>parseTime(a.start_time)-parseTime(b.start_time));const end=f.filter(e=>{const e2=parseTime(e.end_time);return e2&&n>=e2});let h='';if(live.length){h+=`<div class="section-title">进行中活动 (${live.length})</div><div class="events">${live.map(createCard).join('')}</div>`}if(upc.length){h+=`<div class="section-title">即将开始 (${upc.length})</div><div class="events">${upc.map(createCard).join('')}</div>`}if(end.length){h+=`<div class="section-title">已结束 (${end.length})</div><div class="events">${end.slice(0,3).map(createCard).join('')}</div>`}c.innerHTML=h;document.getElementById('stat-total').textContent=f.length;document.getElementById('stat-live').textContent=live.length;document.getElementById('stat-upcoming').textContent=upc.length}

document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()}));
document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentType=b.dataset.filter;render()}));
render();
</script>
</body>
</html>
