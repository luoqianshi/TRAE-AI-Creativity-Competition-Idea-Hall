// ===== 渲染榜单 =====
function renderList(cat) {
  const list = categories[cat] || categories.all;
  const container = document.getElementById('hotList');
  container.innerHTML = '';
  document.getElementById('listCount').textContent = `显示 ${list.length} 条`;

  list.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'hot-item fade-in' + (selectedId === item.id ? ' active' : '');
    el.style.animationDelay = (idx * 0.05) + 's';
    el.innerHTML = `
      <div class="hot-rank ${idx < 3 ? 'top3' : 'other'}">${idx + 1}</div>
      <div class="hot-info">
        <div class="hot-title">${item.title}</div>
        <div class="hot-meta">
          <span class="hot-tag">${item.tag}</span>
          <span>${item.tags.slice(0,2).join(' · ')}</span>
        </div>
      </div>
      <div class="hot-heat">
        <div class="heat-bar">
          <div class="heat-bar-fill" style="width:${item.heat}%;background:${item.heat > 90 ? 'var(--accent2)' : 'var(--accent)'}"></div>
        </div>
        <span>${item.heat}</span>
      </div>
      <div class="hot-delta ${item.delta >= 0 ? 'up' : 'down'}">${item.delta >= 0 ? '&#9650;' : '&#9660;'} ${Math.abs(item.delta)}</div>
    `;
    el.addEventListener('click', () => selectItem(item.id, cat));
    container.appendChild(el);
  });
}

// ===== 选择事件 =====
function selectItem(id, cat) {
  selectedId = id;
  const list = categories[cat] || categories.all;
  const item = list.find(i => i.id === id);
  if (!item) return;

  // 更新选中状态
  document.querySelectorAll('.hot-item').forEach(el => el.classList.remove('active'));
  const activeEl = Array.from(document.querySelectorAll('.hot-item')).find((el, idx) => list[idx]?.id === id);
  if (activeEl) activeEl.classList.add('active');

  // 显示面板
  const panel = document.getElementById('detailPanel');
  panel.classList.remove('hidden');
  panel.classList.add('fade-in');

  // 填充内容
  document.getElementById('detailTitle').textContent = item.title;
  document.getElementById('detailHeatNum').textContent = item.heat;
  document.getElementById('detailSummary').textContent = item.summary;
  document.getElementById('detailAnalysis').textContent = item.analysis;

  // 标签
  const tagContainer = document.getElementById('detailTags');
  tagContainer.innerHTML = item.tags.map(t => `<span class="detail-tag">${t}</span>`).join('');

  // AI 标签
  const aiTagContainer = document.getElementById('detailAiTags');
  aiTagContainer.innerHTML = item.aiTags.map(t => `<span class="ai-tag">${t}</span>`).join('');

  // 时间线
  const timelineContainer = document.getElementById('detailTimeline');
  timelineContainer.innerHTML = item.timeline.map(t => `
    <div class="timeline-item ${t.latest ? 'latest' : ''}">
      <div class="timeline-time">${t.time}</div>
      <div class="timeline-text">${t.text}</div>
    </div>
  `).join('');

  // 对比
  const compareContainer = document.getElementById('detailCompare');
  compareContainer.innerHTML = `
    <div class="compare-card">
      <h4><span class="flag">&#127464;&#127475;</span> 国内视角</h4>
      <ul>${item.domestic.map(d => `<li>${d}</li>`).join('')}</ul>
    </div>
    <div class="compare-card">
      <h4><span class="flag">&#127758;</span> 国际视角</h4>
      <ul>${item.international.map(d => `<li>${d}</li>`).join('')}</ul>
    </div>
  `;

  // 渲染趋势图

  // 滚动到详情（移动端）

  }
}

  const hours = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(Date.now() - i * 6 * 3600 * 1000);
    hours.push((d.getMonth()+1) + '-' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':00');
  }

  const style = getComputedStyle(document.documentElement);
  const accent = style.getPropertyValue('--accent').trim();
  const accent2 = style.getPropertyValue('--accent2').trim();
  const muted = style.getPropertyValue('--muted').trim();
  const rule = style.getPropertyValue('--rule').trim();

  trendChartInstance.setOption({
    animation: false,
    tooltip: { trigger: 'axis', appendToBody: true, backgroundColor: 'rgba(21,30,50,0.95)', borderColor: rule, textStyle: { color: '#f1f5f9' } },
    grid: { left: 50, right: 20, top: 20, bottom: 30 },
    xAxis: {
      type: 'category', data: hours,
      axisLine: { lineStyle: { color: rule } },
      axisLabel: { color: muted, fontSize: 11, rotate: 30 }
    },
    yAxis: {
      type: 'value', min: 0, max: 100,
      axisLine: { show: false },
      splitLine: { lineStyle: { color: rule, type: 'dashed' } },
      axisLabel: { color: muted, fontSize: 11 }
    },
    series: [{
      type: 'line', data: item.trend,
      smooth: true, symbol: 'circle', symbolSize: 6,
      lineStyle: { color: accent, width: 2.5 },
      itemStyle: { color: accent, borderColor: '#fff', borderWidth: 1.5 },
      areaStyle: {
        color: {
          type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
          colorStops: [
            { offset: 0, color: 'rgba(34,211,238,0.25)' },
            { offset: 1, color: 'rgba(34,211,238,0.02)' }
          ]
        }
      },
      markLine: {
        silent: true,
        data: [{ yAxis: 90, lineStyle: { color: accent2, type: 'dashed', width: 1 } }],
        label: { formatter: '高热度阈值', color: accent2, fontSize: 10, position: 'insideEndTop' }
      }
    }]
  }, true);
}

// ===== 标签页切换 =====
document.getElementById('categoryTabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab-btn')) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentCategory = e.target.dataset.cat;
  selectedId = null;
  document.getElementById('detailPanel').classList.add('hidden');
  renderList(currentCategory);
});

// ===== 时间更新 =====
function updateTime() {
  const now = new Date();
  document.getElementById('navTime').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}
setInterval(updateTime, 1000);
updateTime();

// ===== 数字动效 =====
function animateNum(id, target) {
  const el = document.getElementById(id);
  let current = 0;
  const step = Math.ceil(target / 40);
  const timer = setInterval(() => {
    current += step;
    if (current >= target) { current = target; clearInterval(timer); }
    el.textContent = current;
  }, 30);
}

// ===== 初始化 =====
document.addEventListener('DOMContentLoaded', () => {
  renderList('all');
  animateNum('statSources', 32);
  animateNum('statEvents', 186);
  animateNum('statClusters', 24);
});
</script>
