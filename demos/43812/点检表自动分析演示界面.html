<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点检表自动分析演示界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1976d2;
            --primary-dark: #1565c0;
            --secondary-color: #424242;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --background-color: #f5f5f5;
            --card-background: #ffffff;
            --text-primary: #212121;
            --text-secondary: #757575;
            --border-color: #e0e0e0;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-hover: 0 4px 16px rgba(0,0,0,0.15);
            
            /* Cell highlight colors */
            --cell-item-name: #ffe0b2;
            --cell-item-standard: #c8e6c9;
            --cell-item-lower: #ffccbc;
            --cell-item-upper: #f8bbd9;
            --cell-item-desc: #e1bee7;
            --cell-data-input: #b3e5fc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .app-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: var(--card-background);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            color: var(--primary-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-outline {
            background: white;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
        }

        /* Main Content - Two Column Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Left Panel - Excel Preview */
        .excel-panel {
            background: var(--card-background);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .excel-wrapper {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: white;
        }

        .excel-container {
            overflow: auto;
            max-height: 700px;
        }

        .excel-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            min-width: 800px;
        }

        .excel-table th {
            background: linear-gradient(135deg, #e8f4f8, #d0e8f0);
            padding: 10px 8px;
            border: 1px solid #c0c0c0;
            font-weight: 600;
            font-size: 12px;
            color: var(--text-primary);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .excel-table td {
            border: 1px solid #c0c0c0;
            padding: 6px;
            font-size: 12px;
            min-height: 30px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .excel-table td:hover {
            outline: 2px solid var(--primary-color);
            outline-offset: -2px;
        }

        /* Cell Highlight Colors */
        .cell-item-name {
            background-color: var(--cell-item-name) !important;
            font-weight: 600;
        }

        .cell-item-standard {
            background-color: var(--cell-item-standard) !important;
            color: #2e7d32;
            font-weight: 600;
        }

        .cell-item-lower {
            background-color: var(--cell-item-lower) !important;
            color: #e65100;
            font-weight: 600;
        }

        .cell-item-upper {
            background-color: var(--cell-item-upper) !important;
            color: #c2185b;
            font-weight: 600;
        }

        .cell-item-desc {
            background-color: var(--cell-item-desc) !important;
            color: #6a1b9a;
        }

        .cell-data-input {
            background-color: var(--cell-data-input) !important;
            border: 2px dashed var(--primary-color);
        }

        .cell-selected {
            outline: 3px solid var(--warning-color) !important;
            outline-offset: -3px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                outline-color: var(--warning-color);
            }
            50% {
                outline-color: var(--warning-color);
                outline-width: 4px;
            }
        }

        .row-header {
            background: linear-gradient(135deg, #e8f4f8, #d0e8f0);
            font-weight: 600;
            text-align: center;
            width: 40px;
            color: var(--text-primary);
        }

        /* Right Panel - Inspection Items List */
        .items-panel {
            background: var(--card-background);
            border-radius: 12px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 280px);
            min-height: 600px;
        }

        .items-list-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            background: #fafafa;
            min-height: 400px;
        }

        /* Custom scrollbar for better UX */
        .items-list-container::-webkit-scrollbar {
            width: 8px;
        }

        .items-list-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .items-list-container::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }

        .items-list-container::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        .inspection-item {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .inspection-item:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow);
            transform: translateX(4px);
        }

        .inspection-item.selected {
            border-color: var(--warning-color);
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.05), rgba(255, 152, 0, 0.1));
            box-shadow: 0 0 12px rgba(255, 152, 0, 0.3);
        }

        .inspection-item.verified {
            border-color: var(--success-color);
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.05), rgba(76, 175, 80, 0.1));
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-index {
            background: var(--primary-color);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
        }

        .item-required {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: #ffcdd2;
            color: #c62828;
        }

        .item-required.required {
            background: #ef9a9a;
            color: #b71c1c;
        }

        .item-name {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .item-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .spec-item {
            background: var(--background-color);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .spec-label {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .spec-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .item-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .item-cells {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .cell-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }

        .cell-tag.name {
            background: var(--cell-item-name);
            color: #e65100;
        }

        .cell-tag.standard {
            background: var(--cell-item-standard);
            color: #2e7d32;
        }

        .cell-tag.lower {
            background: var(--cell-item-lower);
            color: #e65100;
        }

        .cell-tag.upper {
            background: var(--cell-item-upper);
            color: #c2185b;
        }

        .cell-tag.desc {
            background: var(--cell-item-desc);
            color: #6a1b9a;
        }

        .cell-tag.input {
            background: var(--cell-data-input);
            color: #0277bd;
            border: 1px dashed var(--primary-color);
        }

        .item-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .item-action-btn {
            flex: 1;
            padding: 6px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .item-action-btn.verify {
            background: var(--success-color);
            color: white;
        }

        .item-action-btn.verify:hover {
            background: #43a047;
        }

        .item-action-btn.edit {
            background: var(--warning-color);
            color: white;
        }

        .item-action-btn.edit:hover {
            background: #fb8c00;
        }

        .item-action-btn.delete {
            background: var(--danger-color);
            color: white;
        }

        .item-action-btn.delete:hover {
            background: #e53935;
        }

        .item-action-btn.add {
            background: var(--primary-color);
            color: white;
        }

        .item-action-btn.add:hover {
            background: var(--primary-dark);
        }

        /* Edit Mode Styles */
        .inspection-item.edit-mode {
            border-color: var(--warning-color);
            background: #fff8e1;
        }

        .edit-input {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            font-family: inherit;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .edit-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .edit-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .edit-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .edit-row > * {
            flex: 1;
        }

        .data-source-selector {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            width: 100%;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .data-source-selector:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .edit-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .edit-action-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .edit-action-btn.save {
            background: var(--success-color);
            color: white;
        }

        .edit-action-btn.save:hover {
            background: #43a047;
        }

        .edit-action-btn.cancel {
            background: var(--secondary-color);
            color: white;
        }

        .edit-action-btn.cancel:hover {
            background: #616161;
        }

        /* Add Item Button */
        .add-item-container {
            padding: 15px;
            text-align: center;
            border-top: 2px dashed var(--border-color);
            margin-top: 10px;
        }

        .add-item-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, rgba(25, 118, 210, 0.05), rgba(25, 118, 210, 0.1));
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--primary-color);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-item-btn:hover {
            background: linear-gradient(135deg, rgba(25, 118, 210, 0.1), rgba(25, 118, 210, 0.15));
            border-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* View Mode Content */
        .view-content {
            display: block;
        }

        .edit-content {
            display: none;
        }

        .inspection-item.edit-mode .view-content {
            display: none;
        }

        .inspection-item.edit-mode .edit-content {
            display: block;
        }

        /* Color Legend */
        .color-legend {
            background: var(--card-background);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .legend-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* Statistics */
        .stats-bar {
            background: var(--card-background);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-icon {
            font-size: 24px;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .loading-subtext {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .items-panel {
                max-height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div>
                <h1>📊 点检表自动分析演示界面</h1>
                <div style="font-size: 13px; color: var(--text-secondary); margin-top: 4px;">
                    Inspection Sheet Automatic Analysis Demo
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="loadSampleData()">
                    📁 加载示例
                </button>
                <button class="btn btn-primary" onclick="analyzeFile()">
                    🤖 AI 分析
                </button>
                <button class="btn btn-success" onclick="saveConfiguration()">
                    💾 保存配置
                </button>
            </div>
        </header>

        <!-- Color Legend -->
        <div class="color-legend">
            <div class="legend-title">🎨 单元格颜色说明</div>
            <div class="legend-items">
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--cell-item-name);"></div>
                    <span>点检项名称</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--cell-item-standard);"></div>
                    <span>标准值</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--cell-item-lower);"></div>
                    <span>下限</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--cell-item-upper);"></div>
                    <span>上限</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--cell-item-desc);"></div>
                    <span>描述</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: var(--cell-data-input);"></div>
                    <span>数据填写单元格</span>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-icon">📝</div>
                <div class="stat-info">
                    <div class="stat-label">识别点检项</div>
                    <div class="stat-value" id="totalItems">0</div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <div class="stat-label">已复核</div>
                    <div class="stat-value" id="verifiedItems">0</div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">⭐</div>
                <div class="stat-info">
                    <div class="stat-label">必测项</div>
                    <div class="stat-value" id="requiredItems">0</div>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon">📍</div>
                <div class="stat-info">
                    <div class="stat-label">单元格定位</div>
                    <div class="stat-value" id="cellCount">0</div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Left Panel - Excel Preview -->
            <div class="excel-panel">
                <div class="panel-title">
                    📄 Excel 表格预览（点击单元格查看对应点检项）
                </div>
                <div class="excel-wrapper">
                    <div class="excel-container">
                        <table class="excel-table" id="excelTable">
                            <thead>
                                <tr>
                                    <th class="row-header"></th>
                                    <th style="width: 50px;">A</th>
                                    <th style="width: 150px;">B</th>
                                    <th style="width: 100px;">C</th>
                                    <th style="width: 80px;">D</th>
                                    <th style="width: 80px;">E</th>
                                    <th style="width: 120px;">F</th>
                                    <th style="width: 80px;">G</th>
                                    <th style="width: 150px;">H</th>
                                </tr>
                            </thead>
                            <tbody id="excelTableBody">
                                <!-- Table rows will be dynamically loaded -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Inspection Items List -->
            <div class="items-panel">
                <div class="panel-title">
                    📋 点检项列表（点击项定位到对应单元格）
                    <span style="font-size: 12px; color: var(--text-secondary); margin-left: auto;">
                        共 <span id="listTotalCount">0</span> 项
                    </span>
                </div>
                <div class="items-list-container" id="itemsListContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">📁</div>
                        <div class="empty-state-text">
                            点击"加载示例"或"AI 分析"按钮<br>
                            开始点检表自动分析
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在分析点检表...</div>
            <div class="loading-subtext">AI 模型正在识别点检项和规格</div>
        </div>
    </div>

    <script>
        // Sample inspection items data (simulating AI analysis results)
        const sampleInspectionItems = [
            {
                id: 1,
                index: 1,
                name: 'Length A / 长度 A',
                standard: 100.00,
                lower: 99.90,
                upper: 100.10,
                description: 'Main body length measurement',
                required: true,
                verified: false,
                cells: {
                    name: 'B2',
                    standard: 'C2',
                    lower: 'D2',
                    upper: 'E2',
                    desc: 'H2',
                    dataInput: 'F2'
                }
            },
            {
                id: 2,
                index: 2,
                name: 'Length B / 长度 B',
                standard: 50.00,
                lower: 49.95,
                upper: 50.05,
                description: 'Secondary length measurement',
                required: true,
                verified: false,
                cells: {
                    name: 'B3',
                    standard: 'C3',
                    lower: 'D3',
                    upper: 'E3',
                    desc: 'H3',
                    dataInput: 'F3'
                }
            },
            {
                id: 3,
                index: 3,
                name: 'Thickness / 厚度',
                standard: 5.00,
                lower: 4.95,
                upper: 5.05,
                description: 'Material thickness at critical point',
                required: false,
                verified: false,
                cells: {
                    name: 'B4',
                    standard: 'C4',
                    lower: 'D4',
                    upper: 'E4',
                    desc: 'H4',
                    dataInput: 'F4'
                }
            },
            {
                id: 4,
                index: 4,
                name: 'Diameter / 直径',
                standard: 25.00,
                lower: 24.98,
                upper: 25.02,
                description: 'Outer diameter measurement',
                required: true,
                verified: false,
                cells: {
                    name: 'B5',
                    standard: 'C5',
                    lower: 'D5',
                    upper: 'E5',
                    desc: 'H5',
                    dataInput: 'F5'
                }
            },
            {
                id: 5,
                index: 5,
                name: 'Weight / 重量',
                standard: 200.00,
                lower: 199.00,
                upper: 201.00,
                description: 'Total product weight',
                required: false,
                verified: false,
                cells: {
                    name: 'B6',
                    standard: 'C6',
                    lower: 'D6',
                    upper: 'E6',
                    desc: 'H6',
                    dataInput: 'F6'
                }
            },
            {
                id: 6,
                index: 6,
                name: 'Surface Roughness / 表面粗糙度',
                standard: 1.6,
                lower: 0,
                upper: 1.6,
                description: 'Ra value for critical surface',
                required: true,
                verified: false,
                cells: {
                    name: 'B7',
                    standard: 'C7',
                    lower: 'D7',
                    upper: 'E7',
                    desc: 'H7',
                    dataInput: 'F7'
                }
            }
        ];

        // Sample Excel data
        const excelData = [
            { row: 1, cells: ['序号', '检测项目', '标准值', '下限', '上限', '测量值', '判定', '备注'] },
            { row: 2, cells: ['1', 'Length A / 长度 A', '100.00', '99.90', '100.10', '', '', 'Main body length measurement'] },
            { row: 3, cells: ['2', 'Length B / 长度 B', '50.00', '49.95', '50.05', '', '', 'Secondary length measurement'] },
            { row: 4, cells: ['3', 'Thickness / 厚度', '5.00', '4.95', '5.05', '', '', 'Material thickness at critical point'] },
            { row: 5, cells: ['4', 'Diameter / 直径', '25.00', '24.98', '25.02', '', '', 'Outer diameter measurement'] },
            { row: 6, cells: ['5', 'Weight / 重量', '200.00', '199.00', '201.00', '', '', 'Total product weight'] },
            { row: 7, cells: ['6', 'Surface Roughness / 表面粗糙度', '1.6', '0', '1.6', '', '', 'Ra value for critical surface'] },
            { row: 8, cells: ['7', 'Hardness / 硬度', 'HRC 45', 'HRC 43', 'HRC 47', '', '', 'Heat treatment hardness'] },
            { row: 9, cells: ['8', 'Concentricity / 同心度', '0.05', '0', '0.05', '', '', 'Shaft concentricity'] },
            { row: 10, cells: ['', '', '', '', '', '', '', ''] }
        ];

        let currentItems = [];
        let selectedItem = null;
        let selectedCell = null;

        // Initialize
        function init() {
            loadExcelTable();
            updateStatistics();
        }

        // Load Excel table
        function loadExcelTable() {
            const tbody = document.getElementById('excelTableBody');
            tbody.innerHTML = excelData.map((rowData, rowIndex) => {
                const rowNum = rowData.row;
                return `
                    <tr>
                        <td class="row-header">${rowNum}</td>
                        ${rowData.cells.map((cell, cellIndex) => {
                            const colLetter = String.fromCharCode(65 + cellIndex);
                            const cellRef = `${colLetter}${rowNum}`;
                            const cellClass = getCellClass(cellRef);
                            const cellContent = cell !== '' ? cell : '<span style="color: #ccc;">[数据填写]</span>';
                            return `<td data-cell="${cellRef}" class="${cellClass}" onclick="handleCellClick('${cellRef}')">${cellContent}</td>`;
                        }).join('')}
                    </tr>
                `;
            }).join('');
        }

        // Get cell CSS class based on cell reference
        function getCellClass(cellRef) {
            const item = currentItems.find(item => {
                return Object.values(item.cells).includes(cellRef);
            });

            if (!item) return '';

            if (item.cells.name === cellRef) return 'cell-item-name';
            if (item.cells.standard === cellRef) return 'cell-item-standard';
            if (item.cells.lower === cellRef) return 'cell-item-lower';
            if (item.cells.upper === cellRef) return 'cell-item-upper';
            if (item.cells.desc === cellRef) return 'cell-item-desc';
            if (item.cells.dataInput === cellRef) return 'cell-data-input';

            return '';
        }

        // Handle cell click
        function handleCellClick(cellRef) {
            // Remove previous selection
            document.querySelectorAll('.cell-selected').forEach(el => {
                el.classList.remove('cell-selected');
            });

            // Find item for this cell
            const item = currentItems.find(item => {
                return Object.values(item.cells).includes(cellRef);
            });

            if (item) {
                // Highlight the clicked cell
                const cellElement = document.querySelector(`td[data-cell="${cellRef}"]`);
                if (cellElement) {
                    cellElement.classList.add('cell-selected');
                }

                // Select and scroll to corresponding item in list
                selectItem(item.id);
                selectedCell = cellRef;

                console.log(`Clicked cell: ${cellRef}, Item: ${item.name}`);
            }
        }

        // Select item in list
        function selectItem(itemId) {
            const item = currentItems.find(i => i.id === itemId);
            if (!item) return;

            selectedItem = item;

            // Remove previous selection
            document.querySelectorAll('.inspection-item.selected').forEach(el => {
                el.classList.remove('selected');
            });

            // Select item element
            const itemElement = document.getElementById(`item-${itemId}`);
            if (itemElement) {
                itemElement.classList.add('selected');
                
                // Scroll into view with better positioning
                const container = document.getElementById('itemsListContainer');
                const containerRect = container.getBoundingClientRect();
                const itemRect = itemElement.getBoundingClientRect();
                
                // Calculate scroll position to center the item
                const scrollPosition = container.scrollTop + itemRect.top - containerRect.top - (containerRect.height / 2) + (itemRect.height / 2);
                
                container.scrollTo({
                    top: scrollPosition,
                    behavior: 'smooth'
                });
                
                // Fallback: ensure item is visible
                setTimeout(() => {
                    if (itemRect.top < containerRect.top || itemRect.bottom > containerRect.bottom) {
                        itemElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 300);
            }

            // Highlight corresponding cells in Excel table
            highlightItemCells(item);
        }

        // Highlight item cells in Excel table
        function highlightItemCells(item) {
            // Remove previous highlights
            document.querySelectorAll('.cell-selected').forEach(el => {
                el.classList.remove('cell-selected');
            });

            // Highlight all cells for this item
            Object.values(item.cells).forEach(cellRef => {
                const cellElement = document.querySelector(`td[data-cell="${cellRef}"]`);
                if (cellElement) {
                    cellElement.classList.add('cell-selected');
                }
            });
        }

        // Render inspection items list
        function renderItemsList() {
            const container = document.getElementById('itemsListContainer');
            
            if (currentItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📁</div>
                        <div class="empty-state-text">
                            点击"加载示例"或"AI 分析"按钮<br>
                            开始点检表自动分析
                        </div>
                    </div>
                    <div class="add-item-container">
                        <button class="add-item-btn" onclick="showAddItemForm()">
                            ➕ 添加点检项
                        </button>
                    </div>
                `;
                return;
            }

            let html = currentItems.map(item => {
                if (item.isEditing) {
                    return renderEditItem(item);
                } else {
                    return renderViewItem(item);
                }
            }).join('');

            // Add "Add Item" button at the end
            html += `
                <div class="add-item-container">
                    <button class="add-item-btn" onclick="showAddItemForm()">
                        ➕ 添加点检项
                    </button>
                </div>
            `;

            container.innerHTML = html;
            document.getElementById('listTotalCount').textContent = currentItems.length;
        }

        // Render view mode item
        function renderViewItem(item) {
            return `
                <div class="inspection-item ${item.verified ? 'verified' : ''}" 
                     id="item-${item.id}" 
                     onclick="selectItem(${item.id})">
                    <div class="view-content">
                        <div class="item-header">
                            <div class="item-index">${item.index}</div>
                            <div class="item-required ${item.required ? 'required' : ''}">
                                ${item.required ? '⭐ 必测' : '普通'}
                            </div>
                        </div>
                        
                        <div class="item-name">${item.name}</div>
                        
                        <div class="item-specs">
                            <div class="spec-item">
                                <div class="spec-label">标准值</div>
                                <div class="spec-value">${item.standard}</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-label">公差</div>
                                <div class="spec-value">${item.lower} ~ ${item.upper}</div>
                            </div>
                        </div>
                        
                        ${item.description ? `<div class="item-desc">📝 ${item.description}</div>` : ''}
                        
                        <div class="item-cells">
                            <span class="cell-tag name">📍 ${item.cells.name}</span>
                            <span class="cell-tag standard">📏 ${item.cells.standard}</span>
                            <span class="cell-tag lower">⬇️ ${item.cells.lower}</span>
                            <span class="cell-tag upper">⬆️ ${item.cells.upper}</span>
                            <span class="cell-tag input">✏️ ${item.cells.dataInput}</span>
                        </div>
                        
                        <div class="item-actions">
                            <button class="item-action-btn verify" onclick="toggleVerify(event, ${item.id})">
                                ${item.verified ? '✓ 已复核' : '✅ 标记复核'}
                            </button>
                            <button class="item-action-btn edit" onclick="startEditing(event, ${item.id})">
                                ✏️ 编辑
                            </button>
                            <button class="item-action-btn ${item.required ? '' : 'edit'}" onclick="toggleRequired(event, ${item.id})">
                                ${item.required ? '⭐ 必测' : '设为必测'}
                            </button>
                            <button class="item-action-btn delete" onclick="deleteItem(event, ${item.id})">
                                🗑️ 删除
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render edit mode item
        function renderEditItem(item) {
            return `
                <div class="inspection-item edit-mode" id="item-${item.id}">
                    <div class="edit-content">
                        <div class="item-header">
                            <div class="item-index">${item.index}</div>
                            <div class="item-required ${item.required ? 'required' : ''}">
                                ${item.required ? '⭐ 必测' : '普通'}
                            </div>
                        </div>
                        
                        <label class="edit-label">📝 点检项名称</label>
                        <input type="text" class="edit-input" id="edit-name-${item.id}" value="${item.name}" placeholder="输入点检项名称">
                        
                        <div class="edit-row">
                            <div>
                                <label class="edit-label">📏 标准值</label>
                                <input type="text" class="edit-input" id="edit-standard-${item.id}" value="${item.standard}" placeholder="如：100.00">
                            </div>
                            <div>
                                <label class="edit-label">⬇️ 下限</label>
                                <input type="text" class="edit-input" id="edit-lower-${item.id}" value="${item.lower}" placeholder="如：99.90">
                            </div>
                            <div>
                                <label class="edit-label">⬆️ 上限</label>
                                <input type="text" class="edit-input" id="edit-upper-${item.id}" value="${item.upper}" placeholder="如：100.10">
                            </div>
                        </div>
                        
                        <label class="edit-label">📄 描述</label>
                        <input type="text" class="edit-input" id="edit-desc-${item.id}" value="${item.description || ''}" placeholder="描述信息">
                        
                        <label class="edit-label">📍 数据来源</label>
                        <select class="data-source-selector" id="edit-source-${item.id}">
                            <option value="cell" ${!item.dataSource || item.dataSource === 'cell' ? 'selected' : ''}>📍 来自单元格</option>
                            <option value="fixed" ${item.dataSource === 'fixed' ? 'selected' : ''}>🔢 固定值</option>
                            <option value="formula" ${item.dataSource === 'formula' ? 'selected' : ''}>📐 公式</option>
                        </select>
                        
                        <label class="edit-label" id="edit-source-label-${item.id}">
                            ${!item.dataSource || item.dataSource === 'cell' ? '单元格地址' : item.dataSource === 'fixed' ? '固定值' : '公式'}
                        </label>
                        <input type="text" class="edit-input" id="edit-source-value-${item.id}" 
                               value="${item.sourceValue || item.cells.dataInput}" 
                               placeholder="${!item.dataSource || item.dataSource === 'cell' ? '如：F2' : item.dataSource === 'fixed' ? '如：100.00' : '如：=A1+B1'}">
                        
                        <div class="edit-actions">
                            <button class="edit-action-btn save" onclick="saveEditing(event, ${item.id})">
                                ✅ 保存
                            </button>
                            <button class="edit-action-btn cancel" onclick="cancelEditing(event, ${item.id})">
                                ❌ 取消
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Toggle verify status
        function toggleVerify(event, itemId) {
            event.stopPropagation();
            const item = currentItems.find(i => i.id === itemId);
            if (item) {
                item.verified = !item.verified;
                renderItemsList();
                updateStatistics();
            }
        }

        // Toggle required status
        function toggleRequired(event, itemId) {
            event.stopPropagation();
            const item = currentItems.find(i => i.id === itemId);
            if (item) {
                item.required = !item.required;
                renderItemsList();
                updateStatistics();
            }
        }

        // Delete item
        function deleteItem(event, itemId) {
            event.stopPropagation();
            if (confirm('确定要删除此点检项吗？')) {
                currentItems = currentItems.filter(i => i.id !== itemId);
                renderItemsList();
                loadExcelTable();
                updateStatistics();
                showToast('点检项已删除', 'success');
            }
        }

        // Start editing item
        function startEditing(event, itemId) {
            event.stopPropagation();
            const item = currentItems.find(i => i.id === itemId);
            if (item) {
                item.isEditing = true;
                renderItemsList();
                showToast('进入编辑模式', 'info');
            }
        }

        // Save editing item
        function saveEditing(event, itemId) {
            event.stopPropagation();
            const item = currentItems.find(i => i.id === itemId);
            if (!item) return;

            // Get values from inputs
            const nameInput = document.getElementById(`edit-name-${itemId}`);
            const standardInput = document.getElementById(`edit-standard-${itemId}`);
            const lowerInput = document.getElementById(`edit-lower-${itemId}`);
            const upperInput = document.getElementById(`edit-upper-${itemId}`);
            const descInput = document.getElementById(`edit-desc-${itemId}`);
            const sourceSelect = document.getElementById(`edit-source-${itemId}`);
            const sourceValueInput = document.getElementById(`edit-source-value-${itemId}`);

            if (nameInput && nameInput.value.trim() === '') {
                showToast('请输入点检项名称', 'warning');
                return;
            }

            // Update item
            item.name = nameInput.value.trim();
            item.standard = standardInput.value.trim();
            item.lower = lowerInput.value.trim();
            item.upper = upperInput.value.trim();
            item.description = descInput.value.trim();
            item.dataSource = sourceSelect.value;
            item.sourceValue = sourceValueInput.value.trim();

            // Update cell mapping based on data source
            if (item.dataSource === 'cell') {
                item.cells.dataInput = item.sourceValue || 'F' + (item.index + 1);
            }

            item.isEditing = false;
            
            renderItemsList();
            loadExcelTable();
            updateStatistics();
            showToast('点检项已保存', 'success');
        }

        // Cancel editing
        function cancelEditing(event, itemId) {
            event.stopPropagation();
            const item = currentItems.find(i => i.id === itemId);
            if (item) {
                item.isEditing = false;
                renderItemsList();
                showToast('已取消编辑', 'info');
            }
        }

        // Show add item form
        function showAddItemForm() {
            const newItem = {
                id: Date.now(),
                index: currentItems.length + 1,
                name: '',
                standard: '',
                lower: '',
                upper: '',
                description: '',
                required: false,
                verified: false,
                isEditing: true,
                dataSource: 'cell',
                sourceValue: '',
                cells: {
                    name: 'B' + (currentItems.length + 2),
                    standard: 'C' + (currentItems.length + 2),
                    lower: 'D' + (currentItems.length + 2),
                    upper: 'E' + (currentItems.length + 2),
                    desc: 'H' + (currentItems.length + 2),
                    dataInput: 'F' + (currentItems.length + 2)
                }
            };

            currentItems.push(newItem);
            renderItemsList();
            
            // Scroll to the new item
            setTimeout(() => {
                const newItemElement = document.getElementById(`item-${newItem.id}`);
                if (newItemElement) {
                    newItemElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    // Focus on name input
                    const nameInput = document.getElementById(`edit-name-${newItem.id}`);
                    if (nameInput) {
                        nameInput.focus();
                    }
                }
            }, 100);
            
            showToast('请填点检项信息', 'info');
        }

        // Data source selector change handler
        function onDataSourceChange(itemId) {
            const sourceSelect = document.getElementById(`edit-source-${itemId}`);
            const sourceLabel = document.getElementById(`edit-source-label-${itemId}`);
            const sourceValueInput = document.getElementById(`edit-source-value-${itemId}`);
            
            if (sourceSelect && sourceLabel && sourceValueInput) {
                const selectedOption = sourceSelect.options[sourceSelect.selectedIndex];
                const sourceType = sourceSelect.value;
                
                if (sourceType === 'cell') {
                    sourceLabel.textContent = '单元格地址';
                    sourceValueInput.placeholder = '如：F2';
                } else if (sourceType === 'fixed') {
                    sourceLabel.textContent = '固定值';
                    sourceValueInput.placeholder = '如：100.00';
                } else if (sourceType === 'formula') {
                    sourceLabel.textContent = '公式';
                    sourceValueInput.placeholder = '如：=A1+B1';
                }
            }
        }

        // Update statistics
        function updateStatistics() {
            document.getElementById('totalItems').textContent = currentItems.length;
            document.getElementById('verifiedItems').textContent = currentItems.filter(i => i.verified).length;
            document.getElementById('requiredItems').textContent = currentItems.filter(i => i.required).length;
            document.getElementById('cellCount').textContent = currentItems.reduce((sum, item) => sum + Object.keys(item.cells).length, 0);
        }

        // Load sample data
        function loadSampleData() {
            showLoading(true);
            
            setTimeout(() => {
                currentItems = JSON.parse(JSON.stringify(sampleInspectionItems));
                loadExcelTable();
                renderItemsList();
                updateStatistics();
                showLoading(false);
                
                showToast('示例数据加载成功！', 'success');
            }, 800);
        }

        // Analyze file (simulated)
        function analyzeFile() {
            showLoading(true);
            
            setTimeout(() => {
                // Simulate AI analysis
                currentItems = JSON.parse(JSON.stringify(sampleInspectionItems));
                
                // Add some randomness to show AI "analysis"
                currentItems.forEach(item => {
                    item.verified = false;
                });
                
                loadExcelTable();
                renderItemsList();
                updateStatistics();
                showLoading(false);
                
                showToast(`AI 分析完成！识别到 ${currentItems.length} 个点检项`, 'success');
            }, 1500);
        }

        // Save configuration
        function saveConfiguration() {
            if (currentItems.length === 0) {
                showToast('没有可保存的点检项', 'warning');
                return;
            }

            const verifiedCount = currentItems.filter(i => i.verified).length;
            if (verifiedCount === 0) {
                showToast('请先复核点检项', 'warning');
                return;
            }

            const config = {
                items: currentItems,
                exportTime: new Date().toISOString(),
                totalItems: currentItems.length,
                verifiedItems: verifiedCount
            };

            console.log('Saving configuration:', config);
            
            // In a real application, this would save to a file or server
            showToast(`配置已保存！共 ${currentItems.length} 项，已复核 ${verifiedCount} 项`, 'success');
        }

        // Show loading overlay
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: ${type === 'success' ? '#4caf50' : type === 'warning' ? '#ff9800' : '#2196f3'};
                color: white;
                padding: 16px 24px;
                border-radius: 8px;
                box-shadow: 0 4px 16px rgba(0,0,0,0.2);
                z-index: 1001;
                animation: slideIn 0.3s ease-out;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Add animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(400px);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(400px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Add event delegation for data source change
        document.addEventListener('change', function(event) {
            if (event.target.classList.contains('data-source-selector')) {
                const itemId = event.target.id.replace('edit-source-', '');
                onDataSourceChange(itemId);
            }
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
