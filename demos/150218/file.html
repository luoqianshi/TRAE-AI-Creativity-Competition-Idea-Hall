<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>征战的沙场 - 策略对战游戏演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #1a1a2e;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
            border: 8px solid #0f0f1e;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* 状态栏 */
        .status-bar {
            height: 44px;
            background: rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        /* 主界面 */
        .home-screen {
            background: linear-gradient(180deg, #2d1b69 0%, #11998e 100%);
        }

        .game-logo {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .game-logo h1 {
            font-size: 48px;
            color: #ffd700;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.5);
            margin-bottom: 10px;
            font-weight: 900;
        }

        .game-logo p {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        .menu-buttons {
            padding: 40px 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .menu-btn:active {
            transform: translateY(0);
        }

        .menu-btn.primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            font-size: 20px;
            padding: 20px;
        }

        .player-info {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
        }

        .player-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .player-stats {
            flex: 1;
            margin-left: 15px;
        }

        .player-name {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .player-level {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            margin-top: 4px;
        }

        .currency {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            color: #ffd700;
            font-weight: 600;
        }

        /* 战斗界面 */
        .battle-screen {
            background: #2c3e50;
        }

        .battle-header {
            padding: 15px 20px;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .timer {
            background: #e74c3c;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .score {
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .battle-field {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .grid-cell {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .grid-cell:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
        }

        .grid-cell.occupied {
            background: rgba(52, 152, 219, 0.3);
            border: 2px solid #3498db;
        }

        .card-area {
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }

        .card-area-title {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
        }

        .cards {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .card {
            width: 60px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card.selected {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .card-icon {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .card-cost {
            background: rgba(0,0,0,0.5);
            color: #ffd700;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .battle-actions {
            padding: 20px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn.start {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .action-btn.cancel {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* 结算界面 */
        .result-screen {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .result-content {
            text-align: center;
        }

        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .result-title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 16px;
            margin-bottom: 40px;
        }

        .result-stats {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: white;
        }

        .stat-label {
            color: rgba(255,255,255,0.7);
        }

        .stat-value {
            font-weight: 600;
            color: #ffd700;
        }

        .result-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 60px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .result-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* 动画效果 */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .screen.active {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- 主界面 -->
        <div id="homeScreen" class="screen home-screen active">
            <div class="status-bar">
                <span>9:41</span>
                <span>征战的沙场</span>
                <span>100%</span>
            </div>
            
            <div class="game-logo">
                <h1>征战的沙场</h1>
                <p>3分钟策略对战 · 随时随地开战</p>
            </div>

            <div class="menu-buttons">
                <button class="menu-btn primary" onclick="startBattle()">⚔️ 快速匹配</button>
                <button class="menu-btn" onclick="alert('好友对战功能开发中...')">👥 好友对战</button>
                <button class="menu-btn" onclick="alert('排行榜功能开发中...')">🏆 排行榜</button>
                <button class="menu-btn" onclick="alert('兵种图鉴功能开发中...')">📖 兵种图鉴</button>
            </div>

            <div class="player-info">
                <div class="player-avatar">战</div>
                <div class="player-stats">
                    <div class="player-name">征战者</div>
                    <div class="player-level">Lv.15 · 胜率 68%</div>
                </div>
                <div class="currency">
                    💰 1,280
                </div>
            </div>
        </div>

        <!-- 战斗界面 -->
        <div id="battleScreen" class="screen battle-screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>战斗中</span>
                <span>100%</span>
            </div>

            <div class="battle-header">
                <div class="score">我方: <span id="myScore">0</span></div>
                <div class="timer" id="timer">03:00</div>
                <div class="score">敌方: <span id="enemyScore">0</span></div>
            </div>

            <div class="battle-field">
                <div class="grid" id="battleGrid">
                    <!-- 4x4 网格将通过JS生成 -->
                </div>

                <div class="card-area">
                    <div class="card-area-title">选择兵种部署到战场</div>
                    <div class="cards">
                        <div class="card" data-unit="warrior" onclick="selectCard(this)">
                            <div class="card-icon">⚔️</div>
                            <div class="card-cost">2</div>
                        </div>
                        <div class="card" data-unit="archer" onclick="selectCard(this)">
                            <div class="card-icon">🏹</div>
                            <div class="card-cost">3</div>
                        </div>
                        <div class="card" data-unit="cavalry" onclick="selectCard(this)">
                            <div class="card-icon">🐴</div>
                            <div class="card-cost">4</div>
                        </div>
                        <div class="card" data-unit="mage" onclick="selectCard(this)">
                            <div class="card-icon">🔮</div>
                            <div class="card-cost">5</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="battle-actions">
                <button class="action-btn cancel" onclick="endBattle()">撤退</button>
                <button class="action-btn start" onclick="startCombat()">开始战斗</button>
            </div>
        </div>

        <!-- 结算界面 -->
        <div id="resultScreen" class="screen result-screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>战斗结算</span>
                <span>100%</span>
            </div>

            <div class="result-content">
                <div class="result-icon">🏆</div>
                <div class="result-title">胜利!</div>
                <div class="result-subtitle">出色的战术指挥</div>

                <div class="result-stats">
                    <div class="stat-row">
                        <span class="stat-label">战斗时长</span>
                        <span class="stat-value">2分48秒</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">消灭敌军</span>
                        <span class="stat-value">12</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">获得金币</span>
                        <span class="stat-value">+150</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">经验值</span>
                        <span class="stat-value">+80</span>
                    </div>
                </div>

                <button class="result-btn" onclick="backToHome()">返回大厅</button>
            </div>
        </div>
    </div>

    <script>
        let selectedCard = null;
        let timerInterval = null;
        let timeLeft = 180; // 3分钟

        // 生成4x4战斗网格
        function initGrid() {
            const grid = document.getElementById('battleGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 16; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.onclick = () => placeUnit(cell);
                grid.appendChild(cell);
            }
        }

        // 选择卡牌
        function selectCard(card) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedCard = card.dataset.unit;
        }

        // 放置单位
        function placeUnit(cell) {
            if (!selectedCard) {
                alert('请先选择一个兵种！');
                return;
            }
            if (cell.classList.contains('occupied')) {
                alert('该位置已有单位！');
                return;
            }

            const icons = {
                warrior: '⚔️',
                archer: '🏹',
                cavalry: '🐴',
                mage: '🔮'
            };

            cell.textContent = icons[selectedCard];
            cell.classList.add('occupied');
            cell.dataset.unit = selectedCard;
        }

        // 开始战斗
        function startBattle() {
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('battleScreen').classList.add('active');
            initGrid();
            startTimer();
        }

        // 计时器
        function startTimer() {
            timeLeft = 180;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    endBattle();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 开始战斗动画
        function startCombat() {
            const occupiedCells = document.querySelectorAll('.grid-cell.occupied');
            if (occupiedCells.length === 0) {
                alert('请至少部署一个单位！');
                return;
            }

            // 模拟战斗过程
            let myScore = 0;
            occupiedCells.forEach(cell => {
                const unit = cell.dataset.unit;
                const scores = { warrior: 10, archer: 15, cavalry: 20, mage: 25 };
                myScore += scores[unit] || 10;
            });

            document.getElementById('myScore').textContent = myScore;
            document.getElementById('enemyScore').textContent = Math.floor(myScore * 0.8);

            // 2秒后显示结果
            setTimeout(() => {
                endBattle();
            }, 2000);
        }

        // 结束战斗
        function endBattle() {
            clearInterval(timerInterval);
            document.getElementById('battleScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');
        }

        // 返回主页
        function backToHome() {
            document.getElementById('resultScreen').classList.remove('active');
            document.getElementById('homeScreen').classList.add('active');
            selectedCard = null;
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        }
    </script>
</body>
</html>
