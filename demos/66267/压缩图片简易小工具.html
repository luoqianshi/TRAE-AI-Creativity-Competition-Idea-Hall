<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .upload-area {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .drop-zone {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #fafafa;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .drop-zone .icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 10px;
        }

        .drop-zone h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .drop-zone p {
            color: #666;
            font-size: 0.9rem;
        }

        #fileInput, #folderInput {
            display: none;
        }

        .batch-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            display: none;
        }

        .batch-section.active {
            display: block;
        }

        .batch-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .batch-header h4 {
            color: #333;
            font-size: 1.1rem;
        }

        .batch-stats {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #666;
        }

        .batch-stats span {
            font-weight: 600;
            color: #667eea;
        }

        .file-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #eee;
        }

        .file-name {
            flex: 1;
            font-size: 0.9rem;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 15px;
        }

        .file-status {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .file-status.pending {
            background: #fff3cd;
            color: #856404;
        }

        .file-status.compressed {
            background: #d4edda;
            color: #155724;
        }

        .file-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .download-all-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .download-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(40, 167, 69, 0.4);
        }

        .download-all-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .options {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        .option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-group label {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .option-group select,
        .option-group input[type="range"] {
            padding: 10px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .option-group select:focus,
        .option-group input[type="range"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .quality-display {
            font-weight: 600;
            color: #667eea;
            font-size: 1.1rem;
        }

        .preview-section {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .preview-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .preview-card h4 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .preview-image {
            width: 100%;
            height: 200px;
            object-fit: contain;
            border-radius: 10px;
            background: #f5f5f5;
            margin-bottom: 15px;
        }

        .image-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .info-item {
            font-size: 0.85rem;
            color: #666;
        }

        .info-item span {
            font-weight: 600;
            color: #333;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .upload-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .upload-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-btn:hover {
            background: #667eea;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 20px;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .error-message {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 10px;
            padding: 15px 20px;
            color: #c53030;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .success-message {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            border-radius: 10px;
            padding: 15px 20px;
            color: #22543d;
            margin-top: 20px;
            display: none;
        }

        .success-message.active {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .upload-area {
                padding: 20px;
            }

            .drop-zone {
                padding: 30px 15px;
            }

            .upload-buttons {
                flex-direction: column;
            }

            .options {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖼️ 图片压缩工具</h1>
            <p>拖拽或上传图片，一键压缩下载</p>
        </div>

        <div class="upload-area">
            <div class="drop-zone" id="dropZone">
                <div class="icon">📁</div>
                <h3>点击或拖拽图片到此处</h3>
                <p>支持 JPG、PNG、WebP 等多种图片格式</p>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple>
            <input type="file" id="folderInput" webkitdirectory directory>
            
            <div class="upload-buttons">
                <button class="upload-btn" id="selectFilesBtn">
                    <span>🖼️</span>
                    <span>选择图片</span>
                </button>
                <button class="upload-btn" id="selectFolderBtn">
                    <span>📂</span>
                    <span>选择文件夹</span>
                </button>
            </div>

            <div class="options">
                <div class="option-group">
                    <label for="quality">压缩质量</label>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <input type="range" id="quality" min="10" max="100" value="80" step="5">
                        <span class="quality-display" id="qualityDisplay">80%</span>
                    </div>
                </div>

                <div class="option-group">
                    <label for="outputFormat">输出格式</label>
                    <select id="outputFormat">
                        <option value="original">保持原格式</option>
                        <option value="jpeg">JPEG</option>
                        <option value="png">PNG</option>
                        <option value="webp">WebP</option>
                    </select>
                </div>
            </div>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <div class="preview-section" id="previewSection" style="display: none;">
                <div class="preview-card">
                    <h4>原始图片</h4>
                    <img id="originalImage" class="preview-image" alt="原始图片">
                    <div class="image-info">
                        <span class="info-item">大小: <span id="originalSize">--</span></span>
                        <span class="info-item">尺寸: <span id="originalDimensions">--</span></span>
                    </div>
                </div>

                <div class="preview-card">
                    <h4>压缩后图片</h4>
                    <img id="compressedImage" class="preview-image" alt="压缩后图片">
                    <div class="image-info">
                        <span class="info-item">大小: <span id="compressedSize">--</span></span>
                        <span class="info-item">尺寸: <span id="compressedDimensions">--</span></span>
                        <span class="info-item">压缩率: <span id="compressionRatio">--</span></span>
                    </div>
                    <button class="download-btn" id="downloadBtn" disabled>
                        <span>⬇️</span>
                        <span>下载压缩图片</span>
                    </button>
                </div>
            </div>

            <div class="batch-section" id="batchSection">
                <div class="batch-header">
                    <h4>📁 批量压缩列表</h4>
                    <div class="batch-stats">
                        <span>总计: <span id="totalCount">0</span></span>
                        <span>已压缩: <span id="compressedCount">0</span></span>
                        <span>节省: <span id="totalSaved">0 KB</span></span>
                    </div>
                </div>
                <div class="file-list" id="fileList"></div>
                <button class="download-all-btn" id="downloadAllBtn" disabled>
                    <span>📦</span>
                    <span>下载为 ZIP 压缩包</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const qualitySlider = document.getElementById('quality');
        const qualityDisplay = document.getElementById('qualityDisplay');
        const outputFormat = document.getElementById('outputFormat');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const previewSection = document.getElementById('previewSection');
        const originalImage = document.getElementById('originalImage');
        const compressedImage = document.getElementById('compressedImage');
        const originalSize = document.getElementById('originalSize');
        const originalDimensions = document.getElementById('originalDimensions');
        const compressedSize = document.getElementById('compressedSize');
        const compressedDimensions = document.getElementById('compressedDimensions');
        const compressionRatio = document.getElementById('compressionRatio');
        const downloadBtn = document.getElementById('downloadBtn');
        const batchSection = document.getElementById('batchSection');
        const fileList = document.getElementById('fileList');
        const totalCount = document.getElementById('totalCount');
        const compressedCount = document.getElementById('compressedCount');
        const totalSaved = document.getElementById('totalSaved');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        let compressedBlob = null;
        let originalFileName = '';
        let batchFiles = [];
        let compressedFiles = [];
        let totalSavedBytes = 0;

        qualitySlider.addEventListener('input', () => {
            qualityDisplay.textContent = qualitySlider.value + '%';
        });

        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        document.getElementById('selectFilesBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            fileInput.click();
        });

        document.getElementById('selectFolderBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            folderInput.click();
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFiles(Array.from(files));
            }
        });

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                processFiles(Array.from(files));
            }
        });

        folderInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (files.length > 0) {
                processFiles(Array.from(files));
            }
        });

        function processFiles(files) {
            const imageFiles = files.filter(f => f.type.startsWith('image/'));
            
            if (imageFiles.length === 0) {
                showError('未找到有效的图片文件');
                return;
            }

            hideError();
            hideSuccess();
            clearBatchState();
            
            if (imageFiles.length === 1) {
                handleSingleFile(imageFiles[0]);
            } else {
                handleBatchFiles(imageFiles);
            }
            
            fileInput.value = '';
            folderInput.value = '';
        }
        
        function clearBatchState() {
            batchSection.classList.remove('active');
            batchFiles = [];
            compressedFiles = [];
            totalSavedBytes = 0;
            fileList.innerHTML = '';
            totalCount.textContent = '0';
            compressedCount.textContent = '0';
            totalSaved.textContent = '0 KB';
            downloadAllBtn.disabled = true;
        }

        function handleSingleFile(file) {
            clearBatchState();
            
            originalFileName = file.name;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImage.src = e.target.result;
                
                const img = new Image();
                img.onload = () => {
                    originalDimensions.textContent = `${img.width} × ${img.height}`;
                    originalSize.textContent = formatSize(file.size);
                    compressSingleImage(img, file.type, file.size);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleBatchFiles(files) {
            previewSection.style.display = 'none';
            batchFiles = files;
            compressedFiles = [];
            totalSavedBytes = 0;
            
            batchSection.classList.add('active');
            fileList.innerHTML = '';
            
            totalCount.textContent = files.length;
            compressedCount.textContent = 0;
            totalSaved.textContent = '0 KB';
            
            files.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.dataset.index = index;
                fileItem.innerHTML = `
                    <span class="file-name">${file.name}</span>
                    <span class="file-status pending">等待压缩</span>
                `;
                fileList.appendChild(fileItem);
            });
            
            compressBatchImages(0);
        }

        function compressBatchImages(index) {
            if (index >= batchFiles.length) {
                downloadAllBtn.disabled = false;
                showSuccess(`批量压缩完成！共压缩 ${batchFiles.length} 张图片，节省 ${formatSize(totalSavedBytes)}`);
                hideProgress();
                return;
            }

            const file = batchFiles[index];
            const fileItem = fileList.querySelector(`[data-index="${index}"]`);
            
            showProgress(((index + 1) / batchFiles.length) * 100);
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const quality = qualitySlider.value / 100;
                    let format = outputFormat.value;
                    const originalType = file.type;
                    
                    if (format === 'original') {
                        format = originalType.split('/')[1].toLowerCase();
                    }

                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width;
                    let height = img.height;
                    
                    const maxSize = 4096;
                    if (width > maxSize || height > maxSize) {
                        const ratio = Math.min(maxSize / width, maxSize / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    let mimeType = `image/${format}`;
                    if (format === 'jpeg') mimeType = 'image/jpeg';
                    else if (format === 'png') mimeType = 'image/png';
                    else if (format === 'webp') mimeType = 'image/webp';

                    canvas.toBlob((blob) => {
                        if (blob) {
                            if (blob.size >= file.size && format === originalType.split('/')[1].toLowerCase()) {
                                compressedFiles.push({ file: file, blob: file });
                                totalSavedBytes += 0;
                            } else {
                                compressedFiles.push({ file: file, blob: blob });
                                totalSavedBytes += (file.size - blob.size);
                            }
                            
                            fileItem.querySelector('.file-status').className = 'file-status compressed';
                            fileItem.querySelector('.file-status').textContent = `节省 ${formatSize(Math.max(0, file.size - (blob.size >= file.size ? file.size : blob.size)))}`;
                            
                            compressedCount.textContent = index + 1;
                            totalSaved.textContent = formatSize(totalSavedBytes);
                        } else {
                            compressedFiles.push({ file: file, blob: file });
                            fileItem.querySelector('.file-status').className = 'file-status error';
                            fileItem.querySelector('.file-status').textContent = '压缩失败';
                        }
                        
                        compressBatchImages(index + 1);
                    }, mimeType, quality);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function compressSingleImage(img, originalType, originalSizeBytes) {
            showProgress(30);
            
            const quality = qualitySlider.value / 100;
            let format = outputFormat.value;
            
            if (format === 'original') {
                format = originalType.split('/')[1].toLowerCase();
            }

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            let width = img.width;
            let height = img.height;
            
            const maxSize = 4096;
            if (width > maxSize || height > maxSize) {
                const ratio = Math.min(maxSize / width, maxSize / height);
                width = Math.round(width * ratio);
                height = Math.round(height * ratio);
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            showProgress(60);

            let mimeType = `image/${format}`;
            if (format === 'jpeg') mimeType = 'image/jpeg';
            else if (format === 'png') mimeType = 'image/png';
            else if (format === 'webp') mimeType = 'image/webp';

            canvas.toBlob((blob) => {
                showProgress(100);
                
                if (blob) {
                    const compressedBytes = blob.size;
                    
                    if (compressedBytes >= originalSizeBytes && format === originalType.split('/')[1].toLowerCase()) {
                        compressedBlob = blob;
                        compressedImage.src = originalImage.src;
                        compressedSize.textContent = formatSize(originalSizeBytes);
                        compressionRatio.textContent = '0%';
                        showSuccess('原始图片已最优，无需压缩');
                    } else {
                        compressedBlob = blob;
                        const compressedUrl = URL.createObjectURL(blob);
                        compressedImage.src = compressedUrl;
                        compressedSize.textContent = formatSize(compressedBytes);
                        const ratio = ((1 - compressedBytes / originalSizeBytes) * 100).toFixed(1);
                        compressionRatio.textContent = `${ratio}%`;
                        showSuccess('图片压缩成功！');
                    }
                    
                    compressedDimensions.textContent = `${width} × ${height}`;
                    downloadBtn.disabled = false;
                    previewSection.style.display = 'grid';
                } else {
                    showError('图片压缩失败，请重试');
                }

                setTimeout(() => {
                    hideProgress();
                }, 500);
            }, mimeType, quality);
        }

        downloadBtn.addEventListener('click', () => {
            if (!compressedBlob) return;

            const format = outputFormat.value === 'original' 
                ? originalFileName.split('.').pop() 
                : outputFormat.value;
            const baseName = originalFileName.replace(/\.[^/.]+$/, '');
            const fileName = `${baseName}.${format}`;

            const url = URL.createObjectURL(compressedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        downloadAllBtn.addEventListener('click', async () => {
            downloadAllBtn.disabled = true;
            downloadAllBtn.innerHTML = '<span>⏳</span><span>正在打包...</span>';
            
            try {
                const zip = new JSZip();
                const format = outputFormat.value;
                
                for (const item of compressedFiles) {
                    const { file, blob } = item;
                    const outputFormatType = format === 'original' 
                        ? file.name.split('.').pop() 
                        : format;
                    const baseName = file.name.replace(/\.[^/.]+$/, '');
                    const fileName = `${baseName}.${outputFormatType}`;
                    
                    const arrayBuffer = await blob.arrayBuffer();
                    zip.file(fileName, arrayBuffer);
                }
                
                const content = await zip.generateAsync({ type: 'blob' });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'compressed_images.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                downloadAllBtn.innerHTML = '<span>✅</span><span>下载完成</span>';
                setTimeout(() => {
                    downloadAllBtn.disabled = false;
                    downloadAllBtn.innerHTML = '<span>📦</span><span>下载为 ZIP 压缩包</span>';
                }, 2000);
            } catch (error) {
                showError('打包失败，请重试');
                downloadAllBtn.disabled = false;
                downloadAllBtn.innerHTML = '<span>📦</span><span>下载为 ZIP 压缩包</span>';
            }
        });

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function showProgress(percent) {
            progressBar.classList.add('active');
            progressFill.style.width = percent + '%';
        }

        function hideProgress() {
            progressBar.classList.remove('active');
            progressFill.style.width = '0%';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }

        function hideError() {
            errorMessage.classList.remove('active');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('active');
        }

        function hideSuccess() {
            successMessage.classList.remove('active');
        }
    </script>
</body>
</html>
