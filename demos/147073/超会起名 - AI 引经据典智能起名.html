<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超会起名 - AI 引经据典智能起名</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap');

:root {
  --cyber-purple: #a855f7;
  --cyber-blue: #06b6d4;
  --cyber-pink: #ec4899;
  --cyber-cyan: #22d3ee;
  --cyber-dark: #050510;
  --cyber-darker: #020208;
  --cyber-card: rgba(10, 10, 30, 0.88);
  --gold: #f59e0b;
  --gold-light: #fbbf24;
  --neon-green: #10ff9f;
  --text-light: #e2e8f0;
  --text-muted: #94a3b8;
  --text-gold: #fcd34d;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--cyber-darker);
  color: var(--text-light);
  overflow-x: hidden;
  min-height: 100vh;
}

/* ===== 3D 首页 ===== */
#home-3d {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100vh;
  z-index: 1;
  background:
    radial-gradient(ellipse at 20% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(34, 211, 238, 0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(168, 85, 247, 0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 30% 50%, #1a0a3e 0%, #0e0a30 40%, #0a0828 70%, #080620 100%);
}

#home-canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* ===== 导航栏 ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 16px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: transparent;
  border-bottom: 1px solid rgba(168, 85, 247, 0.06);
  transition: background 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease;
}

.nav.scrolled {
  background: rgba(5, 5, 16, 0.85);
  backdrop-filter: blur(20px);
  border-bottom-color: rgba(168, 85, 247, 0.12);
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-logo {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--cyber-purple), var(--cyber-cyan));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  font-size: 18px;
  color: white;
  box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
}

.nav-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}

.nav-subtitle {
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 2px;
}

.nav-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
}

.nav-status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 8px var(--neon-green);
  animation: dotBlink 2s ease infinite;
}

@keyframes dotBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ===== 页面容器 ===== */
.page {
  display: none;
  min-height: 100vh;
  position: relative;
  z-index: 10;
  background: var(--cyber-darker);
}

.page.active {
  display: block;
}

/* 背景粒子 */
.bg-particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.particle {
  position: absolute;
  font-size: 14px;
  color: rgba(168, 85, 247, 0.12);
  animation: floatUp linear infinite;
  user-select: none;
  font-family: 'Noto Serif SC', serif;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* ===== 表单页 ===== */
.form-page {
  padding: 100px 20px 60px;
  max-width: 680px;
  margin: 0 auto;
}

.form-header {
  text-align: center;
  margin-bottom: 48px;
}

.form-header h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 12px;
  background: linear-gradient(90deg, var(--text-light), var(--cyber-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.form-header p {
  color: var(--text-muted);
  font-size: 15px;
}

.form-section {
  background: var(--cyber-card);
  border: 1px solid rgba(168, 85, 247, 0.12);
  border-radius: 16px;
  padding: 32px;
  margin-bottom: 24px;
  backdrop-filter: blur(10px);
}

.form-section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--cyber-purple);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: 1px;
}

.form-section-title::before {
  content: '';
  width: 4px;
  height: 16px;
  background: linear-gradient(180deg, var(--cyber-purple), var(--cyber-cyan));
  border-radius: 2px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-group.full-width {
  grid-column: 1 / -1;
}

.form-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-light);
}

.form-label .optional {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 4px;
}

.form-input, .form-select, .form-textarea {
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(168, 85, 247, 0.15);
  border-radius: 10px;
  color: var(--text-light);
  font-size: 15px;
  font-family: 'Noto Sans SC', sans-serif;
  transition: all 0.3s ease;
  outline: none;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--cyber-purple);
  box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
}

.form-input.error, .form-select.error {
  border-color: #ef4444;
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.12);
}

.form-error {
  font-size: 12px;
  color: #f87171;
  margin-top: 6px;
  display: none;
  align-items: center;
  gap: 4px;
}

.form-error.visible {
  display: flex;
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1) brightness(1);
  cursor: pointer;
}

.form-input::placeholder, .form-textarea::placeholder {
  color: rgba(148, 163, 184, 0.5);
}

.form-select option {
  background: var(--cyber-dark);
  color: var(--text-light);
}

.form-textarea {
  resize: vertical;
  min-height: 80px;
}

.chip-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.chip {
  padding: 8px 16px;
  border: 1px solid rgba(168, 85, 247, 0.2);
  border-radius: 50px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.3s ease;
  background: transparent;
  font-family: 'Noto Sans SC', sans-serif;
}

.chip:hover, .chip.selected {
  border-color: var(--cyber-purple);
  color: var(--cyber-purple);
  background: rgba(168, 85, 247, 0.1);
}

.submit-btn {
  width: 100%;
  padding: 16px;
  font-size: 17px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, var(--cyber-purple), #7c3aed);
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Noto Sans SC', sans-serif;
  position: relative;
  overflow: hidden;
}

.submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
}

.submit-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ===== 加载页 ===== */
.loading-page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.loading-animation {
  position: relative;
  width: 200px;
  height: 200px;
  margin-bottom: 40px;
}

.loading-circle {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 2px solid transparent;
  animation: spin linear infinite;
}

.loading-circle:nth-child(1) {
  width: 60px; height: 60px;
  border-top-color: var(--cyber-purple);
  animation-duration: 1.5s;
}

.loading-circle:nth-child(2) {
  width: 100px; height: 100px;
  border-right-color: var(--cyber-cyan);
  animation-duration: 2s;
  animation-direction: reverse;
}

.loading-circle:nth-child(3) {
  width: 140px; height: 140px;
  border-bottom-color: var(--cyber-pink);
  animation-duration: 2.5s;
}

.loading-center-char {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Noto Serif SC', serif;
  font-size: 36px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--cyber-purple), var(--cyber-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

@keyframes spin {
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

.loading-text {
  font-size: 18px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.loading-step {
  font-size: 14px;
  color: var(--cyber-purple);
  animation: fadeInOut 2s ease infinite;
}

@keyframes fadeInOut {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ===== 结果页 ===== */
.results-page {
  padding: 100px 20px 60px;
  max-width: 900px;
  margin: 0 auto;
}

.results-header {
  text-align: center;
  margin-bottom: 40px;
}

.results-header h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}

.results-header p {
  color: var(--text-muted);
  font-size: 14px;
}

.results-summary {
  display: flex;
  gap: 16px;
  justify-content: center;
  margin-top: 16px;
  flex-wrap: wrap;
}

.summary-tag {
  padding: 6px 14px;
  border-radius: 50px;
  font-size: 12px;
  border: 1px solid rgba(168, 85, 247, 0.2);
  color: var(--text-muted);
  background: rgba(168, 85, 247, 0.05);
}

.name-cards {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.name-card {
  background: var(--cyber-card);
  border: 1px solid rgba(168, 85, 247, 0.12);
  border-radius: 20px;
  overflow: hidden;
  backdrop-filter: blur(10px);
  transition: all 0.4s ease;
  position: relative;
}

.name-card:first-child {
  border-color: rgba(168, 85, 247, 0.3);
  box-shadow: 0 0 40px rgba(168, 85, 247, 0.1);
}

.name-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 40px rgba(168, 85, 247, 0.15);
}

.name-card-top {
  padding: 28px 32px 20px;
  display: flex;
  gap: 24px;
  align-items: flex-start;
}

.name-avatar {
  width: 80px;
  height: 80px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(34, 211, 238, 0.2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  flex-shrink: 0;
  border: 1px solid rgba(168, 85, 247, 0.2);
}

.name-main { flex: 1; }

.name-full {
  font-family: 'Noto Serif SC', serif;
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 4px;
  background: linear-gradient(90deg, var(--text-light), var(--cyber-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.name-nickname {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.name-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.name-tag {
  padding: 4px 12px;
  border-radius: 50px;
  font-size: 12px;
  background: rgba(168, 85, 247, 0.08);
  color: var(--cyber-purple);
  border: 1px solid rgba(168, 85, 247, 0.15);
}

.name-card-body {
  padding: 0 32px 28px;
}

.name-detail-section {
  margin-bottom: 20px;
}

.name-detail-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--cyber-cyan);
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.name-quote {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  color: var(--text-gold);
  line-height: 1.8;
  padding: 16px 20px;
  background: rgba(245, 158, 11, 0.05);
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  margin-bottom: 4px;
}

.name-quote-source {
  font-size: 13px;
  color: var(--text-muted);
  text-align: right;
}

.name-meaning {
  font-size: 15px;
  color: var(--text-light);
  line-height: 1.8;
}

.name-extras {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}

.name-extra {
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(168, 85, 247, 0.08);
  border-radius: 10px;
}

.name-extra-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.name-extra-value {
  font-size: 14px;
  font-weight: 500;
  color: var(--text-light);
}

/* 锁定卡片 */
.name-card-locked { position: relative; }

.name-card-locked .name-card-body {
  filter: blur(8px);
  pointer-events: none;
  user-select: none;
}

.lock-overlay {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 2;
}

.lock-icon { font-size: 32px; margin-bottom: 8px; }

.lock-text { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; }

.unlock-btn {
  padding: 12px 32px;
  font-size: 14px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, var(--gold), #d97706);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  font-family: 'Noto Sans SC', sans-serif;
}

.unlock-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
}

/* 底部解锁 */
.unlock-all-bar {
  margin-top: 40px;
  padding: 24px 32px;
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.1), rgba(34, 211, 238, 0.1));
  border: 1px solid rgba(168, 85, 247, 0.2);
  border-radius: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.unlock-all-info h3 { font-size: 18px; margin-bottom: 4px; }

.unlock-all-info p { font-size: 14px; color: var(--text-muted); }

.unlock-all-price { text-align: center; }

.unlock-all-price .price {
  font-size: 28px;
  font-weight: 700;
  color: var(--text-gold);
}

.unlock-all-price .period { font-size: 12px; color: var(--text-muted); }

.unlock-all-btn {
  padding: 14px 36px;
  font-size: 15px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, var(--cyber-purple), #7c3aed);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif;
}

.unlock-all-btn:hover { box-shadow: 0 0 30px rgba(168, 85, 247, 0.3); }

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
  margin-top: 32px;
  transition: color 0.3s;
}

.back-link:hover { color: var(--cyber-purple); }

/* 过渡遮罩 */
.transition-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: var(--cyber-darker);
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.transition-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* 响应式 */
@media (max-width: 640px) {
  .nav { padding: 12px 20px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-section { padding: 24px 20px; }
  .name-card-top { flex-direction: column; align-items: center; text-align: center; padding: 24px 20px 16px; }
  .name-card-body { padding: 0 20px 24px; }
  .name-tags { justify-content: center; }
  .name-extras { grid-template-columns: 1fr; }
  .unlock-all-bar { flex-direction: column; text-align: center; }
}
</style>
</head>
<body>

<!-- 导航栏 -->
<nav class="nav">
  <div class="nav-brand">
    <div>
      <div class="nav-title">超会起名</div>
      <div class="nav-subtitle">AI 引经据典智能起名</div>
    </div>
  </div>
  <div class="nav-status">
    <span class="nav-status-dot"></span>
    <span>AI 引擎在线</span>
  </div>
</nav>

<!-- ===== 3D 首页 ===== -->
<div id="home-3d">
  <canvas id="home-canvas"></canvas>
</div>

<!-- 背景粒子（其他页面用） -->
<div class="bg-particles" id="particles" style="display:none;"></div>

<!-- ===== 表单页 ===== -->
<div class="page" id="page-form">
  <div class="form-page">
    <div class="form-header">
      <h2>为孩子起一个诗意好名</h2>
      <p>填写基本信息，AI 将从经典古籍中为你甄选名字</p>
    </div>
    <div class="form-section">
      <div class="form-section-title">基础信息（必填）</div>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">姓氏</label>
          <input class="form-input" id="surname" placeholder="如：李、王、张" maxlength="2">
          <div class="form-error" id="surnameError">请输入姓氏</div>
        </div>
        <div class="form-group">
          <label class="form-label">性别</label>
          <select class="form-select" id="gender">
            <option value="">请选择</option>
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
          <div class="form-error" id="genderError">请选择性别</div>
        </div>
        <div class="form-group">
          <label class="form-label">出生日期</label>
          <input class="form-input" id="birthday" type="date">
          <div class="form-error" id="birthdayError">请选择出生日期</div>
        </div>
        <div class="form-group">
          <label class="form-label">名字字数</label>
          <select class="form-select" id="nameLength">
            <option value="1">单字名（如：李明）</option>
            <option value="2" selected>双字名（如：李明月）</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label class="form-label">避讳字（选填，多个用逗号分隔）</label>
          <input class="form-input" id="avoidChars" placeholder="如：强、伟、丽">
        </div>
      </div>
    </div>
    <div class="form-section">
      <div class="form-section-title">对孩子的期望（选填）</div>
      <div class="chip-group" id="expectChips">
        <button class="chip" data-value="聪慧">聪慧</button>
        <button class="chip" data-value="健康">健康</button>
        <button class="chip" data-value="勇敢">勇敢</button>
        <button class="chip" data-value="温柔">温柔</button>
        <button class="chip" data-value="诚信">诚信</button>
        <button class="chip" data-value="豁达">豁达</button>
        <button class="chip" data-value="卓越">卓越</button>
        <button class="chip" data-value="安宁">安宁</button>
      </div>
      <div class="form-group full-width" style="margin-top:16px;">
        <textarea class="form-textarea" id="customExpect" placeholder="也可以自由描述你对孩子的期望..."></textarea>
      </div>
    </div>
    <button class="submit-btn" onclick="startNaming()">✦ AI 智能起名 ✦</button>
    <div style="text-align:center; margin-top:16px;">
      <span class="back-link" onclick="backToHome()">← 返回首页</span>
    </div>
  </div>

// ===== 初始化 3D 场景 =====

// ===== 流光溢彩背景 =====
function createFlowingBackground() {
  const bgGeo = new THREE.PlaneGeometry(160, 100);
  const bgMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor1: { value: new THREE.Color(0x0c0825) },
      uColor2: { value: new THREE.Color(0x1c0e55) },
      uColor3: { value: new THREE.Color(0x0e1e55) },
      uColor4: { value: new THREE.Color(0x280e42) },
      uColor5: { value: new THREE.Color(0x2a0a3a) },  // 品红暗调
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform vec3 uColor3;
      uniform vec3 uColor4;
      uniform vec3 uColor5;
      varying vec2 vUv;

      // 简易噪声
      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      void main() {
        vec2 uv = vUv;

        // 多层流动噪声
        float n1 = sin(uv.x * 3.0 + uTime * 0.3) * cos(uv.y * 2.0 + uTime * 0.2);
        float n2 = sin(uv.x * 1.5 - uTime * 0.15) * cos(uv.y * 3.0 + uTime * 0.25);
        float n3 = sin((uv.x + uv.y) * 2.0 + uTime * 0.1);
        float n4 = noise(uv * 4.0 + uTime * 0.08);

        vec3 col = mix(uColor1, uColor2, smoothstep(-0.5, 0.5, n1));
        col = mix(col, uColor3, smoothstep(-0.3, 0.3, n2) * 0.5);
        col = mix(col, uColor4, smoothstep(0.0, 0.8, n3) * 0.3);
        col = mix(col, uColor5, smoothstep(0.2, 0.8, n4) * 0.25);

        // 中心柔光
        float dist = length(uv - vec2(0.5, 0.5));
        col += vec3(0.10, 0.03, 0.18) * (1.0 - smoothstep(0.0, 0.55, dist));

        // 四角霓虹光晕 - 左下粉红
        float glow1 = 1.0 - smoothstep(0.0, 0.6, length(uv - vec2(0.0, 0.0)));
        col += vec3(0.25, 0.02, 0.12) * glow1 * (0.7 + 0.3 * sin(uTime * 0.4));

        // 右上青色
        float glow2 = 1.0 - smoothstep(0.0, 0.6, length(uv - vec2(1.0, 1.0)));
        col += vec3(0.02, 0.15, 0.22) * glow2 * (0.7 + 0.3 * sin(uTime * 0.35 + 1.0));

        // 左上紫色
        float glow3 = 1.0 - smoothstep(0.0, 0.55, length(uv - vec2(0.0, 1.0)));
        col += vec3(0.12, 0.02, 0.20) * glow3 * (0.6 + 0.4 * sin(uTime * 0.3 + 2.0));

        // 右下金色
        float glow4 = 1.0 - smoothstep(0.0, 0.6, length(uv - vec2(1.0, 0.0)));
        col += vec3(0.18, 0.10, 0.02) * glow4 * (0.6 + 0.4 * sin(uTime * 0.45 + 3.0));

        // 动态扫描线（赛博朋克网格感）
        float line1 = smoothstep(0.02, 0.0, abs(sin(uv.y * 20.0 + uTime * 0.5) * 0.5 + sin(uv.x * 15.0 - uTime * 0.3) * 0.3 - 0.5));
        col += vec3(0.15, 0.08, 0.35) * line1 * 0.12;

        // 水平光带（扫描效果）
        float scanY = fract(uTime * 0.08);
        float scan = smoothstep(0.0, 0.02, abs(uv.y - scanY)) * 0.0;
        scan = 1.0 - scan;
        col += vec3(0.06, 0.12, 0.20) * scan * 0.4;

        // 垂直光带
        float scanX = fract(uTime * 0.06 + 0.5);
        float scanV = smoothstep(0.0, 0.015, abs(uv.x - scanX)) * 0.0;
        scanV = 1.0 - scanV;
        col += vec3(0.15, 0.04, 0.18) * scanV * 0.3;

        // 边缘暗角保留最小亮度（不再全黑）
        float vignette = 1.0 - smoothstep(0.3, 0.85, dist);
        col = mix(col * 0.4, col, vignette);

        // 确保最低亮度
        col = max(col, vec3(0.025, 0.015, 0.05));

        gl_FragColor = vec4(col, 1.0);
      }
    `,
    side: THREE.DoubleSide
  });
  const bgPlane = new THREE.Mesh(bgGeo, bgMat);
  bgPlane.position.z = -40;
  scene.add(bgPlane);
}

// ===== 姓氏星球 =====
function createSurnamePlanet() {
  sphereGroup = new THREE.Group();
  scene.add(sphereGroup);

  const sphereRadius = 8;
  const totalSurnames = surnames.length;
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));

  surnames.forEach((surname, i) => {
    const y = 1 - (i / (totalSurnames - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = goldenAngle * i;
    const x = Math.cos(theta) * radiusAtY * sphereRadius;
    const posZ = Math.sin(theta) * radiusAtY * sphereRadius;
    const posY = y * sphereRadius;
    const equatorDist = Math.abs(y);
    const scale = 0.6 + (1 - equatorDist) * 0.8 + Math.random() * 0.3;
    const opacity = 0.7 + (1 - equatorDist) * 0.25;
    createSurnameSprite(surname, x, posY, posZ, scale, opacity);
  });

  // 球面外围额外稀疏姓氏
  for (let i = 0; i < 30; i++) {
    const surname = surnames[Math.floor(Math.random() * surnames.length)];
    const phi = Math.acos(Math.random() * 2 - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = sphereRadius + 2 + Math.random() * 4;
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.cos(phi);
    const z = r * Math.sin(phi) * Math.sin(theta);
    const sc = 0.3 + Math.random() * 0.4;
    createSurnameSprite(surname, x, y, z, sc, 0.15 + Math.random() * 0.2);
  }
}

// ===== 星尘粒子 =====
// ===== 流光线条背景 =====
function createStarDust() {
  const count = 80; // 流光线条数量
  const palette = [
    new THREE.Color(0.66, 0.33, 0.97),  // 紫
    new THREE.Color(0.13, 0.83, 0.93),  // 青
    new THREE.Color(0.93, 0.28, 0.60),  // 粉
    new THREE.Color(0.96, 0.62, 0.04),  // 金
  ];

  for (let i = 0; i < count; i++) {
    // 随机起始位置
    const sx = (Math.random() - 0.5) * 70;
    const sy = (Math.random() - 0.5) * 45;
    const sz = (Math.random() - 0.5) * 30 - 15;

    // 随机方向（偏水平流动）
    const angle = Math.random() * Math.PI * 2;
    const tiltY = (Math.random() - 0.5) * 0.4; // 略有上下倾斜
    const lineLen = 1.5 + Math.random() * 3.0; // 线条长度
    const ex = sx + Math.cos(angle) * lineLen;
    const ey = sy + tiltY * lineLen;
    const ez = sz + Math.sin(angle) * lineLen;

    const positions = new Float32Array([
      sx, sy, sz,
      ex, ey, ez
    ]);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // 随机选色
    const baseColor = palette[Math.floor(Math.random() * palette.length)];
    // 线头亮、线尾暗（渐变透明效果用两个顶点色模拟）
    const headColor = baseColor.clone();
    const tailColor = baseColor.clone().multiplyScalar(0.1);

    const colors = new Float32Array([
      headColor.r, headColor.g, headColor.b,
      tailColor.r, tailColor.g, tailColor.b
    ]);
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.15 + Math.random() * 0.2,
      blending: THREE.AdditiveBlending,
      linewidth: 1
    });

    const line = new THREE.Line(geo, mat);
    line.userData = {
      // 运动参数
      speedX: (Math.random() - 0.5) * 0.02,
      speedY: (Math.random() - 0.5) * 0.008,
      speedZ: (Math.random() - 0.5) * 0.01,
      // 呼吸透明度
      breathSpeed: 0.3 + Math.random() * 0.5,
      breathOffset: Math.random() * Math.PI * 2,
      baseOpacity: mat.opacity,
      // 位置范围
      boundX: 35,
      boundY: 22.5,
      boundZ: 15
    };

    scene.add(line);
    flowLines.push(line);
  }
}

// ===== 创建单个姓氏精灵 =====
function createSurnameSprite(surname, x, y, z, scale, opacity) {
  const canvas = document.createElement('canvas');
  const size = 128;
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  ctx.clearRect(0, 0, size, size);
  ctx.font = `bold ${Math.floor(size * 0.65)}px "Noto Serif SC", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const hue = Math.random();
  let glowColor, textColor;
  if (hue < 0.33) {
    glowColor = 'rgba(168, 85, 247, 0.6)';
    textColor = '#c4b5fd';
  } else if (hue < 0.66) {
    glowColor = 'rgba(34, 211, 238, 0.5)';
    textColor = '#a5f3fc';
  } else {
    glowColor = 'rgba(236, 72, 153, 0.4)';
    textColor = '#f9a8d4';
  }

  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 20;
  ctx.fillStyle = textColor;
  ctx.fillText(surname, size / 2, size / 2);

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(surname, size / 2, size / 2);

  const texture = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    opacity: opacity,
    blending: THREE.AdditiveBlending
  });

  const sprite = new THREE.Sprite(mat);
  sprite.position.set(x, y, z);
  sprite.scale.set(scale, scale, 1);

  sprite.userData = {
    surname: surname,
    baseScale: scale,
    basePos: new THREE.Vector3(x, y, z),
    isHovered: false,
    originalOpacity: opacity,
    floatOffset: Math.random() * Math.PI * 2,
    floatSpeed: 0.3 + Math.random() * 0.4,
    floatAmp: 0.15 + Math.random() * 0.25
  };

  surnameSprites.push(sprite);
  if (sphereGroup) sphereGroup.add(sprite);
  else scene.add(sprite);
}

// ===== 鼠标移动 =====
function onMouseMove(event) {
  mouseNDC.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(event.clientY / window.innerHeight) * 2 + 1;
}

// ===== 检测悬停 =====
function checkHover() {
  raycaster.setFromCamera(mouseNDC, camera);
  const intersects = raycaster.intersectObjects(surnameSprites);

  // 先重置所有
  surnameSprites.forEach(s => { s.userData.isHovered = false; });

  if (intersects.length > 0 && !isShattering) {
    const target = intersects[0].object;
    target.userData.isHovered = true;
    if (hoveredSprite !== target) {
      hoveredSprite = target;
    }
    document.body.style.cursor = 'pointer';
  } else {
    if (hoveredSprite) {
      hoveredSprite.userData.isHovered = false;
      hoveredSprite = null;
    }
    document.body.style.cursor = 'default';
  }
}

// ===== 点击姓氏 =====
function onCanvasClick(event) {
  if (isShattering || !hoveredSprite) return;
  isShattering = true;
  const surname = hoveredSprite.userData.surname;
  const sprite = hoveredSprite;
  // 获取世界坐标位置
  const worldPos = new THREE.Vector3();
  sprite.getWorldPosition(worldPos);
  // 清除悬停
  sprite.userData.isHovered = false;
  sprite.material.opacity = 0;
  // 如果 sprite 还在 group 里，先把局部坐标归位
  if (sprite.parent === sphereGroup) {
    sprite.position.copy(sprite.userData.basePos);
  }
  hoveredSprite = null;
  // 在世界坐标创建扩散光粒效果
  createBurstEffect(worldPos, surname);
  setTimeout(() => { transitionToForm(surname); }, 1500);
}

// ===== 光粒扩散效果 =====
function createBurstEffect(center, surname) {
  // 第一波：主扩散粒子（从中心向四周球形扩散）
  const count1 = 120;
  const positions1 = new Float32Array(count1 * 3);
  const colors1 = new Float32Array(count1 * 3);
  const velocities1 = [];
  const palette1 = [
    [1.0, 1.0, 1.0],        // 白色核心
    [0.66, 0.33, 0.97],     // 紫
    [0.13, 0.83, 0.93],     // 青
    [0.93, 0.28, 0.60],     // 粉
    [0.96, 0.80, 0.04]      // 金
  ];

  for (let i = 0; i < count1; i++) {
    positions1[i*3] = center.x;
    positions1[i*3+1] = center.y;
    positions1[i*3+2] = center.z;
    // 球形均匀扩散
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(Math.random() * 2 - 1);
    const speed = 0.1 + Math.random() * 0.35;
    velocities1.push({
      x: Math.sin(phi) * Math.cos(theta) * speed,
      y: Math.sin(phi) * Math.sin(theta) * speed,
      z: Math.cos(phi) * speed
    });
    // 白色核心粒子更多
    const c = i < 30 ? palette1[0] : palette1[Math.floor(Math.random() * palette1.length)];
    colors1[i*3] = c[0]; colors1[i*3+1] = c[1]; colors1[i*3+2] = c[2];
  }

  const geo1 = new THREE.BufferGeometry();
  geo1.setAttribute('position', new THREE.BufferAttribute(positions1, 3));
  geo1.setAttribute('color', new THREE.BufferAttribute(colors1, 3));
  const mat1 = new THREE.PointsMaterial({
    size: 0.4,
    vertexColors: true,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });
  const points1 = new THREE.Points(geo1, mat1);
  points1.userData = { velocities: velocities1, life: 0, maxLife: 2.0 };
  scene.add(points1);
  particleSystems.push(points1);

  // 第二波：光环扩散（平面环形，向外扩散）
  const count2 = 60;
  const positions2 = new Float32Array(count2 * 3);
  const colors2 = new Float32Array(count2 * 3);
  const velocities2 = [];

  for (let i = 0; i < count2; i++) {
    const angle = (i / count2) * Math.PI * 2 + Math.random() * 0.3;
    const r = 0.3;
    positions2[i*3] = center.x + Math.cos(angle) * r;
    positions2[i*3+1] = center.y + (Math.random() - 0.5) * 0.5;
    positions2[i*3+2] = center.z + Math.sin(angle) * r;
    const speed = 0.2 + Math.random() * 0.15;
    velocities2.push({
      x: Math.cos(angle) * speed,
      y: (Math.random() - 0.5) * 0.02,
      z: Math.sin(angle) * speed
    });
    colors2[i*3] = 0.66; colors2[i*3+1] = 0.33; colors2[i*3+2] = 0.97;
  }

  const geo2 = new THREE.BufferGeometry();
  geo2.setAttribute('position', new THREE.BufferAttribute(positions2, 3));
  geo2.setAttribute('color', new THREE.BufferAttribute(colors2, 3));
  const mat2 = new THREE.PointsMaterial({
    size: 0.25,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });
  const points2 = new THREE.Points(geo2, mat2);
  points2.userData = { velocities: velocities2, life: 0, maxLife: 1.5 };
  scene.add(points2);
  particleSystems.push(points2);
}

// ===== 更新粒子 =====
function updateParticles(delta) {
  for (let p = particleSystems.length - 1; p >= 0; p--) {
    const sys = particleSystems[p];
    sys.userData.life += delta;
    const pos = sys.geometry.attributes.position.array;
    const vel = sys.userData.velocities;
    const progress = sys.userData.life / sys.userData.maxLife;
    // 加速因子：开始慢、后面快，模拟光粒涌出
    const accel = 1.0 + progress * 2.0;
    for (let i = 0; i < vel.length; i++) {
      pos[i*3] += vel[i].x * accel;
      pos[i*3+1] += vel[i].y * accel;
      pos[i*3+2] += vel[i].z * accel;
      vel[i].x *= 0.985;
      vel[i].y *= 0.985;
      vel[i].z *= 0.985;
    }
    sys.geometry.attributes.position.needsUpdate = true;
    // 渐隐：前70%保持较亮，后30%快速消失
    const fadeStart = 0.6;
    const fadeProgress = Math.max(0, (progress - fadeStart) / (1.0 - fadeStart));
    sys.material.opacity = Math.max(0, 1.0 - fadeProgress);
    sys.material.size = 0.4 * (1.0 + progress * 0.5); // 粒子逐渐变大（扩散感）
    if (sys.userData.life >= sys.userData.maxLife) {
      scene.remove(sys); sys.geometry.dispose(); sys.material.dispose();
      particleSystems.splice(p, 1);
    }
  }
}

// ===== 返回首页 =====
function backToHome() {

  overlay.classList.add('active');
  setTimeout(() => {
    document.getElementById('particles').style.display = 'none';
    document.getElementById('home-3d').style.display = 'block';
    homeAnimating = true;
    isShattering = false;
    hoveredSprite = null;
    // 把所有 sprite 移回 group 并重置
    surnameSprites.forEach(s => {
      s.userData.isHovered = false;
      s.material.opacity = s.userData.originalOpacity;
      s.scale.set(s.userData.baseScale, s.userData.baseScale, 1);
      if (s.parent !== sphereGroup) {
        scene.remove(s);
        sphereGroup.add(s);
      }
      s.position.copy(s.userData.basePos);
    });
    clock.start();
    animate();
    setTimeout(() => { overlay.classList.remove('active'); }, 100);
  }, 400);
}

// ===== 动画循环 =====
function animate() {
  if (!homeAnimating) return;
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  scene.traverse(obj => {
    if (obj.material && obj.material.uniforms && obj.material.uniforms.uTime) {
      obj.material.uniforms.uTime.value = elapsed;
    }
  });

  camera.position.set(0, 0, 30);
  camera.lookAt(0, 0, 0);

  // 流光线条动画
  flowLines.forEach((line) => {
    const d = line.userData;
    const pos = line.geometry.attributes.position.array;

    // 整条线平移
    pos[0] += d.speedX; pos[1] += d.speedY; pos[2] += d.speedZ;
    pos[3] += d.speedX; pos[4] += d.speedY; pos[5] += d.speedZ;

    // 超出边界则从对侧回来
    const cx = (pos[0] + pos[3]) * 0.5;
    const cy = (pos[1] + pos[4]) * 0.5;
    const cz = (pos[2] + pos[5]) * 0.5;
    if (cx > d.boundX) { pos[0] -= d.boundX * 2; pos[3] -= d.boundX * 2; }
    if (cx < -d.boundX) { pos[0] += d.boundX * 2; pos[3] += d.boundX * 2; }
    if (cy > d.boundY) { pos[1] -= d.boundY * 2; pos[4] -= d.boundY * 2; }
    if (cy < -d.boundY) { pos[1] += d.boundY * 2; pos[4] += d.boundY * 2; }

    line.geometry.attributes.position.needsUpdate = true;

    // 呼吸透明度（若隐若现）
    const breath = Math.sin(elapsed * d.breathSpeed + d.breathOffset);
    line.material.opacity = d.baseOpacity * (0.5 + breath * 0.5);
  });

  if (sphereGroup) {
    sphereGroup.rotation.y += delta * 0.08;
    sphereGroup.rotation.x = Math.sin(elapsed * 0.1) * 0.05;
  }

  // 悬停 sprite 从 group 移到 scene 根级别，脱离球体旋转
  surnameSprites.forEach((sprite) => {
    const d = sprite.userData;
    if (d.isHovered && sprite.parent === sphereGroup) {
      // 把当前世界位置保存，移到 scene 后设置到同样的世界位置
      const worldPos = new THREE.Vector3();
      sprite.getWorldPosition(worldPos);
      sphereGroup.remove(sprite);
      scene.add(sprite);
      sprite.position.copy(worldPos);
    }
    if (!d.isHovered && sprite.parent !== sphereGroup) {
      // 松开时移回 group，需要把世界坐标转回局部坐标
      const worldPos = new THREE.Vector3();
      sprite.getWorldPosition(worldPos);
      scene.remove(sprite);
      sphereGroup.add(sprite);
      // 逆旋转回局部坐标
      const invMatrix = new THREE.Matrix4().copy(sphereGroup.matrixWorld).invert();
      const localPos = worldPos.applyMatrix4(invMatrix);
      sprite.position.copy(localPos);
    }
  });

  surnameSprites.forEach((sprite) => {
    const d = sprite.userData;
    const floatY = Math.sin(elapsed * d.floatSpeed + d.floatOffset) * d.floatAmp;

    if (d.isHovered) {
      // --- 悬停模式 ---
      // 1) 计算球体的当前旋转角，对 basePos 做旋转得到"它本该在的位置"
      const groupAngle = sphereGroup ? sphereGroup.rotation.y : 0;
      const bx = d.basePos.x * Math.cos(groupAngle) + d.basePos.z * Math.sin(groupAngle);
      const bz = -d.basePos.x * Math.sin(groupAngle) + d.basePos.z * Math.cos(groupAngle);

      // 2) 将这个"本该在的位置"投影到 Y=0 平面，算出角度
      const flatAngle = Math.atan2(bx, bz);

      // 3) 目标位置：球面前方正中间 (半径12, 正对相机)
      const targetRadius = 12;
      const targetX = 0;
      const targetZ = targetRadius;
      const targetY = 0;

      // 4) 在世界坐标系中从当前位置平滑过渡到目标位置
      sprite.position.x += (targetX - sprite.position.x) * 0.05;
      sprite.position.y += (targetY - sprite.position.y) * 0.04;
      sprite.position.z += (targetZ - sprite.position.z) * 0.05;

      // 5) 平滑放大
      const targetScale = d.baseScale * 2.5;
      sprite.scale.x += (targetScale - sprite.scale.x) * 0.06;
      sprite.scale.y += (targetScale - sprite.scale.y) * 0.06;

      // 6) 透明度渐变到 1
      sprite.material.opacity += (1.0 - sprite.material.opacity) * 0.08;
    } else {
      // --- 非悬停模式：跟随球体旋转 ---
      if (sphereGroup) {
        // 在局部坐标系中回归 basePos + 浮动
        sprite.position.x += (d.basePos.x - sprite.position.x) * 0.04;
        sprite.position.y += (d.basePos.y + floatY - sprite.position.y) * 0.04;
        sprite.position.z += (d.basePos.z - sprite.position.z) * 0.04;
      }

      const targetScale = d.baseScale;
      sprite.scale.x += (targetScale - sprite.scale.x) * 0.05;
      sprite.scale.y += (targetScale - sprite.scale.y) * 0.05;
      const breathe = Math.sin(elapsed * 0.5 + d.floatOffset) * 0.15;
      const targetOpacity = d.originalOpacity + breathe;
      sprite.material.opacity += (targetOpacity - sprite.material.opacity) * 0.05;
    }
  });

  checkHover();
  updateParticles(delta);
  renderer.render(scene, camera);
}

function onResize() {
  if (!renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ===== 背景粒子（其他页面） =====
function createBgParticles() {
  if (document.getElementById('particles').children.length > 0) return;
  const chars = ['诗','词','赋','墨','韵','名','章','典','雅','文','书','礼','乐'];
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = chars[Math.floor(Math.random() * chars.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (15 + Math.random() * 25) + 's';
    p.style.animationDelay = Math.random() * 20 + 's';
    p.style.fontSize = (12 + Math.random() * 16) + 'px';
    container.appendChild(p);
  }
}

// ===== 起名主流程 =====
function clearFieldError(fieldId, errorId) {
  const field = document.getElementById(fieldId);
  const error = document.getElementById(errorId);
  if (field) field.classList.remove('error');
  if (error) error.classList.remove('visible');
}

function showFieldError(fieldId, errorId) {
  const field = document.getElementById(fieldId);
  const error = document.getElementById(errorId);
  if (field) field.classList.add('error');
  if (error) error.classList.add('visible');
}

// 输入时自动清除错误
document.getElementById('surname').addEventListener('input', () => clearFieldError('surname', 'surnameError'));
document.getElementById('gender').addEventListener('change', () => clearFieldError('gender', 'genderError'));
document.getElementById('birthday').addEventListener('change', () => clearFieldError('birthday', 'birthdayError'));

function startNaming() {
  const surname = document.getElementById('surname').value.trim();
  const gender = document.getElementById('gender').value;
  const birthday = document.getElementById('birthday').value;
  let hasError = false;

  if (!surname) { showFieldError('surname', 'surnameError'); hasError = true; } else { clearFieldError('surname', 'surnameError'); }
  if (!gender) { showFieldError('gender', 'genderError'); hasError = true; } else { clearFieldError('gender', 'genderError'); }
  if (!birthday) { showFieldError('birthday', 'birthdayError'); hasError = true; } else { clearFieldError('birthday', 'birthdayError'); }

  if (hasError) return;
  showPage('page-loading');
  animateLoading();
}

function animateLoading() {
  const chars = ['诗','书','礼','易','词','赋','典','墨','韵','雅'];
  const steps = ['检索《诗经》三百篇...','翻阅《楚辞》九歌...','品读《论语》经典...','赏析唐诗宋词...','匹配姓氏音韵...','生成名字解读...','绘制专属卡片...'];
  let stepIdx = 0, charIdx = 0;
  const loadingChar = document.getElementById('loadingChar');
  const loadingStep = document.getElementById('loadingStep');
  const ci = setInterval(() => {
    loadingChar.textContent = chars[charIdx % chars.length];
    loadingChar.style.opacity = '0';
    setTimeout(() => { loadingChar.style.opacity = '1'; }, 100);
    charIdx++;
  }, 400);
  const si = setInterval(() => { loadingStep.textContent = steps[stepIdx++ % steps.length]; }, 1500);
  setTimeout(() => { clearInterval(ci); clearInterval(si); showResults(); }, 6000);
}

  const nameLength = parseInt(document.getElementById('nameLength').value) || 2;
  const names = namingData[gender] || namingData.male;
  const birthYear = new Date(birthday).getFullYear();

  document.getElementById('resultsSummary').innerHTML = `

    <span class="summary-tag">${nameLength === 1 ? '单字名' : '双字名'}</span>`;

  const cardsEl = document.getElementById('nameCards');
