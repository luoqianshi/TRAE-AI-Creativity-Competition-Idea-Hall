<body>
  <div id="game-container">

  </div>

  <script>
    const Constants = {

      COLORS: {

        GROUND_LAB: '#1a2a4a', GROUND_GRASS: '#7CB342', GROUND_MOON: '#3a3a5a', GROUND_JUPITER: '#4a3a2a',
        BRICK: '#8B4513', WOOD: '#A0522D', ICE: '#ADD8E6', STONE: '#808080',
        TARGET: '#00FF00', MOVING_TARGET: '#FF00FF', BONUS: '#FFFF00',
        HUD_BLUE: '#00AAFF', HUD_GREEN: '#00FF00', HUD_YELLOW: '#FFFF00', HUD_RED: '#FF0000',

    };

    const Projectiles = {
      projectile_bird: { id: 'projectile_bird', name: '像素小鸟弹', level: 1, damage: 1, speed: 12, radius: 15, color: '#FF6B6B', effect: 'normal', description: '均衡伤害的基础弹药' },
      projectile_bomb: { id: 'projectile_bomb', name: '爆破炸弹弹', level: 3, damage: 2, speed: 10, radius: 16, color: '#4ECDC4', effect: 'explosion', explosionRadius: 60, description: '撞击后产生范围爆炸' },
      projectile_spear: { id: 'projectile_spear', name: '穿透长矛弹', level: 5, damage: 1, speed: 18, radius: 10, color: '#95E1D3', effect: 'pierce', pierceCount: 3, description: '可穿过多层障碍物' },
      projectile_ice: { id: 'projectile_ice', name: '冰冻冰晶弹', level: 7, damage: 1, speed: 11, radius: 15, color: '#A8D8EA', effect: 'freeze', freezeRadius: 40, description: '撞击冻结范围内砖块' },
      projectile_laser: { id: 'projectile_laser', name: '追踪镭射飞弹', level: 9, damage: 3, speed: 15, radius: 12, color: '#DDA0DD', effect: 'homing', homingStrength: 0.1, description: '自动锁定最近敌方单位' }
    };

    const Launchers = {
      launcher_wood: { id: 'launcher_wood', name: '木质简易炮台', level: 1, powerMultiplier: 1.0, chargeSpeed: 1.0, color: '#8B4513', aimAssist: false, description: '初始基础款炮台' },
      launcher_iron: { id: 'launcher_iron', name: '铁质加固炮台', level: 3, powerMultiplier: 1.3, chargeSpeed: 1.0, color: '#708090', aimAssist: false, description: '蓄力距离更长，基础伤害提升' },
      launcher_alloy: { id: 'launcher_alloy', name: '合金机械炮台', level: 5, powerMultiplier: 1.5, chargeSpeed: 1.0, color: '#C0C0C0', aimAssist: true, description: '自带小幅瞄准辅助线' },
      launcher_sci_fi: { id: 'launcher_sci-fi', name: '科幻机甲炮台', level: 7, powerMultiplier: 1.7, chargeSpeed: 1.3, color: '#00CED1', aimAssist: true, description: '蓄力速度加快' },
      launcher_laser: { id: 'launcher_laser', name: '终极镭射炮台', level: 9, powerMultiplier: 2.0, chargeSpeed: 1.5, color: '#FF00FF', aimAssist: true, description: '弹射力度大幅强化' }
    };

    const Levels = [
      { id: 1, name: '基础抛物线', theme: 'lab', physics: 'EARTH', launcherPosition: { x: 100, y: 280 }, ammoCount: 5, obstacles: [], enemies: [{ type: 'target', x: 600, y: 200, health: 1 }], hint: '尝试调整角度，45°时水平距离最远', lesson: '抛体运动基本公式: x = v₀·cos(θ)·t, y = v₀·sin(θ)·t - ½gt²' },
      { id: 2, name: '障碍穿越', theme: 'lab', physics: 'EARTH', launcherPosition: { x: 100, y: 280 }, ammoCount: 5, obstacles: [{ type: 'wall', x: 350, y: 200, width: 20, height: 100, health: 999 }], enemies: [{ type: 'target', x: 550, y: 120, health: 1 }], hint: '需要足够的高度越过障碍', lesson: '斜抛运动中，初速度的竖直分量决定上升高度' },
      { id: 3, name: '月球低重力', theme: 'moon', physics: 'MOON', launcherPosition: { x: 100, y: 280 }, ammoCount: 5, obstacles: [], enemies: [{ type: 'target', x: 700, y: 150, health: 1 }], hint: '月球重力只有地球的1/6，弹道会更高更远', lesson: '重力加速度影响下落速度，g越小，抛物线越平缓' },
      { id: 4, name: '微风挑战', theme: 'lab', physics: 'WIND_EASY', launcherPosition: { x: 100, y: 280 }, ammoCount: 5, obstacles: [], enemies: [{ type: 'target', x: 500, y: 220, health: 1 }], hint: '顺风会帮助弹丸飞得更远', lesson: '空气阻力和风力会影响水平方向的速度' },
      { id: 5, name: '移动靶训练', theme: 'lab', physics: 'EARTH', launcherPosition: { x: 100, y: 280 }, ammoCount: 5, obstacles: [], enemies: [{ type: 'moving_target', x: 550, y: 200, health: 1 }], hint: '需要预判目标的移动位置', lesson: '当目标移动时，需要计算提前量' }
    ];

    const MathUtils = {
      distance(x1, y1, x2, y2) { return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2); },
      angle(x1, y1, x2, y2) { return Math.atan2(y2 - y1, x2 - x1); },
      clamp(value, min, max) { return Math.max(min, Math.min(max, value)); },
      lerp(start, end, t) { return start + (end - start) * t; },
      normalizeAngle(angle) { while (angle < -Math.PI) angle += Math.PI * 2; while (angle > Math.PI) angle -= Math.PI * 2; return angle; },
      randomRange(min, max) { return Math.random() * (max - min) + min; },
      randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
      degToRad(degrees) { return degrees * Math.PI / 180; },
      radToDeg(radians) { return radians * 180 / Math.PI; },
      dot(v1, v2) { return v1.x * v2.x + v1.y * v2.y; },
      reflect(v, normal) { const dotProduct = this.dot(v, normal); return { x: v.x - 2 * dotProduct * normal.x, y: v.y - 2 * dotProduct * normal.y }; },
      normalize(v) { const length = Math.sqrt(v.x * v.x + v.y * v.y); if (length === 0) return { x: 0, y: 0 }; return { x: v.x / length, y: v.y / length }; },
      rotate(v, angle) { const cos = Math.cos(angle); const sin = Math.sin(angle); return { x: v.x * cos - v.y * sin, y: v.x * sin + v.y * cos }; },
      predictProjectilePath(startX, startY, vx, vy, gravity, friction, wind, maxSteps = 100, stepSize = 1) {
        const path = [];
        let x = startX;
        let y = startY;
        let currentVx = vx;
        let currentVy = vy;
        path.push({ x, y });
        for (let i = 0; i < maxSteps; i++) {
          currentVy += gravity * stepSize;
          currentVx += wind * stepSize;
          currentVx *= Math.pow(friction, stepSize);
          currentVy *= Math.pow(friction, stepSize);
          x += currentVx * stepSize;
          y += currentVy * stepSize;
          if (y > Constants.SCREEN_HEIGHT || x < 0 || x > Constants.SCREEN_WIDTH) break;
          path.push({ x, y });
        }
        return path;
      }
    };

    const AISceneGenerator = {
      generate(physicsPreset, difficulty = 'normal') {
        const preset = Constants.PHYSICS_PRESETS[physicsPreset] || Constants.PHYSICS_PRESETS.EARTH;
        const gravity = preset.gravity;
        const wind = preset.wind;
        
        const launcherX = 100;
        const launcherY = 280;
        
        let targetDistance, targetHeight;
        const baseDistance = 400 + Math.random() * 200;
        const heightFactor = gravity < 0.2 ? 1.5 : gravity > 0.5 ? 0.7 : 1;
        
        targetDistance = baseDistance * heightFactor;
        targetHeight = 100 + Math.random() * 150 * heightFactor;
        
        if (wind > 0) {
          targetDistance += wind * 50;
        } else if (wind < 0) {
          targetDistance -= Math.abs(wind) * 50;
        }
        
        const targetX = launcherX + targetDistance;
        const targetY = launcherY - targetHeight;
        
        const obstacles = [];
        const hasObstacle = Math.random() > 0.3;
        
        if (hasObstacle) {
          const obstacleX = launcherX + targetDistance * 0.4 + Math.random() * 100;
          const obstacleHeight = 60 + Math.random() * 60;
          obstacles.push({
            type: 'wall',
            x: obstacleX,
            y: launcherY - obstacleHeight,
            width: 20,
            height: obstacleHeight,
            health: 999
          });
        }
        
        const levelName = `${preset.name}挑战`;
        const hint = this.generateHint(physicsPreset, hasObstacle);
        const lesson = this.generateLesson(physicsPreset);
        
        return {
          id: 999,
          name: levelName,
          theme: physicsPreset === 'MOON' ? 'moon' : physicsPreset === 'JUPITER' ? 'jupiter' : 'lab',
          physics: physicsPreset,
          launcherPosition: { x: launcherX, y: launcherY },
          ammoCount: 5,
          obstacles: obstacles,
          enemies: [{ type: Math.random() > 0.7 ? 'moving_target' : 'target', x: targetX, y: targetY, health: 1 }],
          hint: hint,
          lesson: lesson,
          isAI: true
        };
      },
      generateHint(physicsPreset, hasObstacle) {
        const preset = Constants.PHYSICS_PRESETS[physicsPreset];
        const hints = [];
        
        if (physicsPreset === 'MOON') {
          hints.push('月球重力很小，弹道会更高更远');
        } else if (physicsPreset === 'JUPITER') {
          hints.push('木星重力很大，弹道会很陡峭');
        } else if (physicsPreset === 'WIND_EASY') {
          hints.push('顺风会帮助弹丸飞得更远');
        } else if (physicsPreset === 'WIND_HARD') {
          hints.push('强风会影响弹丸轨迹，注意调整角度');
        }
        
        if (hasObstacle) {
          hints.push('需要足够高度越过障碍物');
        }
        
        return hints.join('，');
      },
      generateLesson(physicsPreset) {
        const preset = Constants.PHYSICS_PRESETS[physicsPreset];
        
        if (physicsPreset === 'MOON') {
          return '重力加速度g越小，物体下落越慢，抛物线越平缓';
        } else if (physicsPreset === 'JUPITER') {
          return '重力加速度g越大，物体下落越快，抛物线越陡峭';
        } else if (physicsPreset === 'WIND_EASY' || physicsPreset === 'WIND_HARD') {
          return '风力会产生水平加速度，改变弹丸的水平速度';
        }
        
        return '抛体运动中，水平方向匀速运动，竖直方向匀加速运动';
      }
    };

    const Collision = {
      AABB(rect1, rect2) { return rect1.left < rect2.right && rect1.right > rect2.left && rect1.top < rect2.bottom && rect1.bottom > rect2.top; },
      circleRect(circle, rect) {
        const closestX = Math.max(rect.left, Math.min(circle.x, rect.right));
        const closestY = Math.max(rect.top, Math.min(circle.y, rect.bottom));
        const distanceX = circle.x - closestX;
        const distanceY = circle.y - closestY;
        return Math.sqrt(distanceX * distanceX + distanceY * distanceY) < circle.radius;
      },
      circleCircle(c1, c2) { const dx = c2.x - c1.x; const dy = c2.y - c1.y; return Math.sqrt(dx * dx + dy * dy) < c1.radius + c2.radius; },
      getCircleRectCollisionPoint(circle, rect) { const closestX = Math.max(rect.left, Math.min(circle.x, rect.right)); const closestY = Math.max(rect.top, Math.min(circle.y, rect.bottom)); return { x: closestX, y: closestY }; },
      getCollisionNormal(circle, rect) { const p = this.getCircleRectCollisionPoint(circle, rect); const dx = circle.x - p.x; const dy = circle.y - p.y; const len = Math.sqrt(dx * dx + dy * dy); return len === 0 ? { x: 0, y: -1 } : { x: dx / len, y: dy / len }; },
      resolveCircleRectCollision(circle, rect) {
        const p = this.getCircleRectCollisionPoint(circle, rect);
        const dx = circle.x - p.x; const dy = circle.y - p.y; const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist === 0) return;
        const pen = circle.radius - dist; const normal = { x: dx / dist, y: dy / dist };
        circle.x += normal.x * pen; circle.y += normal.y * pen;
        const velDot = circle.vx * normal.x + circle.vy * normal.y;
        if (velDot < 0) { const rest = 0.6; circle.vx -= (1 + rest) * velDot * normal.x; circle.vy -= (1 + rest) * velDot * normal.y; }
      },
      checkProjectileObstacle(projectile, obstacle) { return this.circleRect({ x: projectile.x, y: projectile.y, radius: projectile.radius }, obstacle.getBounds()); },
      checkProjectileEnemy(projectile, enemy) { return this.circleRect({ x: projectile.x, y: projectile.y, radius: projectile.radius }, enemy.getBounds()); },
      getClosestEnemy(projectile, enemies) {
        let closest = null, minDist = Infinity;
        for (const e of enemies) { if (!e.isActive) continue; const dx = e.x - projectile.x; const dy = e.y - projectile.y; const dist = Math.sqrt(dx * dx + dy * dy); if (dist < minDist) { minDist = dist; closest = e; } }
        return closest;
      }
    };

    class PixelParticle {
      constructor(x, y, color, speed, life) {
        this.x = x; this.y = y; this.color = color; this.speed = speed;
        this.life = this.maxLife = life;
        this.angle = MathUtils.randomRange(0, Math.PI * 2);
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.size = MathUtils.randomInt(2, 4);
        this.gravity = 0.1;
        this.shrinkRate = MathUtils.randomRange(0.95, 0.99);
      }
      update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; this.life--; this.vx *= 0.96; this.vy *= 0.96; this.size *= this.shrinkRate; }
      draw(ctx) { 
        const alpha = this.life / this.maxLife; 
        ctx.save();
        ctx.fillStyle = this.color; 
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8 * alpha;
        ctx.globalAlpha = alpha; 
        ctx.fillRect(Math.floor(this.x), Math.floor(this.y), Math.max(1, this.size), Math.max(1, this.size)); 
        ctx.restore();
      }
    }

    class SparkParticle {
      constructor(x, y, color, speed, angle) {
        this.x = x; this.y = y; this.color = color;
        this.speed = speed; this.angle = angle;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = MathUtils.randomInt(20, 40);
        this.maxLife = this.life;
        this.size = MathUtils.randomInt(3, 6);
        this.trail = [];
        this.maxTrail = 5;
      }
      update() {
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.maxTrail) this.trail.shift();
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05;
        this.vx *= 0.98;
        this.vy *= 0.98;
        this.life--;
        this.size *= 0.98;
      }
      draw(ctx) {
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10 * alpha;
        ctx.globalAlpha = alpha;
        if (this.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          for (let i = 1; i < this.trail.length; i++) {
            ctx.lineTo(this.trail[i].x, this.trail[i].y);
          }
          ctx.strokeStyle = 'rgba(255,255,255,0.3)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(Math.floor(this.x), Math.floor(this.y), Math.max(1, this.size), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class PixelEffect {
      constructor() { this.particles = []; this.sparks = []; }
      createExplosion(x, y, color, count = 20, speed = 5) { 
        for (let i = 0; i < count; i++) this.particles.push(new PixelParticle(x, y, color, speed, 30)); 
        for (let i = 0; i < count * 2; i++) {
          const angle = MathUtils.randomRange(0, Math.PI * 2);
          const sparkSpeed = MathUtils.randomRange(3, speed * 1.5);
          const sparkColor = Math.random() > 0.5 ? '#FFAA00' : '#FF6600';
          this.sparks.push(new SparkParticle(x, y, sparkColor, sparkSpeed, angle));
        }
      }
      createPixelFragments(x, y, width, height, color) { const cnt = Math.floor((width * height) / 30); for (let i = 0; i < cnt; i++) this.particles.push(new PixelParticle(MathUtils.randomRange(x, x + width), MathUtils.randomRange(y, y + height), color, 3, 20)); }
      createIceEffect(x, y, radius) { for (let i = 0; i < 15; i++) { const angle = (i / 15) * Math.PI * 2; const dist = MathUtils.randomRange(0, radius); this.particles.push(new PixelParticle(x + Math.cos(angle) * dist, y + Math.sin(angle) * dist, '#A8D8EA', 2, 25)); } }
      createWoodDestroy(x, y, width, height) {
        const colors = ['#5D3A1A', '#7D4F2A', '#9D6F3A', '#3D250F'];
        for (let i = 0; i < 15; i++) {
          const px = MathUtils.randomRange(x, x + width);
          const py = MathUtils.randomRange(y, y + height);
          const angle = MathUtils.randomRange(0, Math.PI * 2);
          const speed = MathUtils.randomRange(2, 5);
          const particle = new PixelParticle(px, py, colors[Math.floor(Math.random() * colors.length)], speed, 25);
          particle.vx = Math.cos(angle) * speed;
          particle.vy = Math.sin(angle) * speed - 2;
          this.particles.push(particle);
        }
        for (let i = 0; i < 8; i++) {
          const angle = MathUtils.randomRange(-Math.PI / 4, Math.PI / 4);
          const sparkSpeed = MathUtils.randomRange(3, 6);
          this.sparks.push(new SparkParticle(x + width / 2, y + height / 2, '#FFAA00', sparkSpeed, angle));
        }
      }
      createBrickDestroy(x, y, width, height) {
        const colors = ['#B06030', '#804020', '#D08050', '#603010'];
        for (let i = 0; i < 20; i++) {
          const px = MathUtils.randomRange(x, x + width);
          const py = MathUtils.randomRange(y, y + height);
          const angle = MathUtils.randomRange(0, Math.PI * 2);
          const speed = MathUtils.randomRange(3, 6);
          const particle = new PixelParticle(px, py, colors[Math.floor(Math.random() * colors.length)], speed, 20);
          particle.vx = Math.cos(angle) * speed;
          particle.vy = Math.sin(angle) * speed;
          this.particles.push(particle);
        }
      }
      createIceDestroy(x, y, width, height) {
        const colors = ['#A8D8EA', '#CCEEFF', '#88BBDD', '#FFFFFF'];
        for (let i = 0; i < 12; i++) {
          const px = MathUtils.randomRange(x, x + width);
          const py = MathUtils.randomRange(y, y + height);
          const angle = MathUtils.randomRange(0, Math.PI * 2);
          const speed = MathUtils.randomRange(1, 3);
          const particle = new PixelParticle(px, py, colors[Math.floor(Math.random() * colors.length)], speed, 30);
          particle.vx = Math.cos(angle) * speed;
          particle.vy = Math.sin(angle) * speed;
          this.particles.push(particle);
        }
      }
      createStoneDestroy(x, y, width, height) {
        const colors = ['#666666', '#555555', '#777777', '#444444'];
        for (let i = 0; i < 18; i++) {
          const px = MathUtils.randomRange(x, x + width);
          const py = MathUtils.randomRange(y, y + height);
          const angle = MathUtils.randomRange(0, Math.PI * 2);
          const speed = MathUtils.randomRange(2, 4);
          const particle = new PixelParticle(px, py, colors[Math.floor(Math.random() * colors.length)], speed, 25);
          particle.vx = Math.cos(angle) * speed;
          particle.vy = Math.sin(angle) * speed;
          this.particles.push(particle);
        }
      }
      createEnemyReward(x, y, type) {
        let colors;
        if (type === 'boss') colors = ['#FF0000', '#FF6600', '#FFAA00', '#FFFF00'];
        else if (type === 'monster') colors = ['#E94560', '#FF6B6B', '#FF8E8E', '#FFFFFF'];
        else colors = ['#FFB6C1', '#FF69B4', '#FF1493', '#FFFFFF'];
        for (let i = 0; i < 25; i++) {
          const angle = MathUtils.randomRange(0, Math.PI * 2);
          const dist = MathUtils.randomRange(5, 30);

        for (let i = 0; i < 15; i++) {

    class DataStorage {
      constructor() { this.saveData = null; this.load(); }
      load() { try { const saved = localStorage.getItem(Constants.STORAGE_KEYS.PLAYER_SAVE); this.saveData = saved ? JSON.parse(saved) : this.initNewSave(); } catch { this.initNewSave(); } }
      initNewSave() {
        this.saveData = { version: '1.0', level: 1, experience: 0, totalScore: 0, levelProgress: {}, unlockedItems: {}, currentLauncher: 'launcher_wood', currentProjectile: 'projectile_bird' };
        for (let i = 1; i <= Constants.LEVELS_COUNT; i++) {
          this.saveData.levelProgress[i] = { unlocked: i === 1, stars: 0, bestScore: 0, bestAmmoLeft: 0 };
        }
        this.saveData.unlockedItems['launcher_wood'] = true;
        this.saveData.unlockedItems['projectile_bird'] = true;
        this.save();
        return this.saveData;
      }
      save() { try { localStorage.setItem(Constants.STORAGE_KEYS.PLAYER_SAVE, JSON.stringify(this.saveData)); } catch (e) { console.error('Save failed:', e); } }
      getLevel() { return this.saveData.level; }
      setLevel(level) { this.saveData.level = level; this.save(); }
      getExperience() { return this.saveData.experience; }
      addExperience(amount) { this.saveData.experience += amount; this.save(); }
      setExperience(amount) { this.saveData.experience = amount; this.save(); }
      getTotalScore() { return this.saveData.totalScore; }
      addScore(amount) { this.saveData.totalScore += amount; this.save(); }

      updateLevelProgress(levelId, stars, score, ammoLeft) {
        const p = this.saveData.levelProgress[levelId];
        if (p) { if (stars > p.stars) p.stars = stars; if (score > p.bestScore) p.bestScore = score; if (ammoLeft > p.bestAmmoLeft) p.bestAmmoLeft = ammoLeft; this.save(); }
      }
      unlockLevel(levelId) { const p = this.saveData.levelProgress[levelId]; if (p) { p.unlocked = true; this.save(); } }
      isLevelUnlocked(levelId) { const p = this.saveData.levelProgress[levelId]; return p ? p.unlocked : false; }
      unlockItem(itemId) { this.saveData.unlockedItems[itemId] = true; this.save(); }
      isItemUnlocked(itemId) { return !!this.saveData.unlockedItems[itemId]; }
      getUnlockedItems() { return Object.keys(this.saveData.unlockedItems).filter(id => this.saveData.unlockedItems[id]); }
      getCurrentLauncher() { return this.saveData.currentLauncher; }
      setCurrentLauncher(launcherId) { if (this.isItemUnlocked(launcherId)) { this.saveData.currentLauncher = launcherId; this.save(); return true; } return false; }
      getCurrentProjectile() { return this.saveData.currentProjectile; }
      setCurrentProjectile(projectileId) { if (this.isItemUnlocked(projectileId)) { this.saveData.currentProjectile = projectileId; this.save(); return true; } return false; }
      getNextLevelExp() { const l = this.saveData.level; return l >= Constants.MAX_LEVEL ? Infinity : Constants.EXPERIENCE_PER_LEVEL[l]; }
    }

    class UpgradeSystem {
      constructor(dataStorage) { this.dataStorage = dataStorage; this.levelUpCallbacks = []; this.itemUnlockCallbacks = []; }
      addExperience(amount) {
        const currExp = this.dataStorage.getExperience();
        const currLvl = this.dataStorage.getLevel();
        const nextExp = this.getNextLevelExp();
        this.dataStorage.addExperience(amount);
        if (currLvl < Constants.MAX_LEVEL && this.dataStorage.getExperience() >= nextExp) this.levelUp();
        return this.dataStorage.getExperience();
      }
      levelUp() {
        let newLvl = this.dataStorage.getLevel() + 1;
        while (newLvl <= Constants.MAX_LEVEL && this.dataStorage.getExperience() >= Constants.EXPERIENCE_PER_LEVEL[newLvl - 1]) {
          this.dataStorage.setLevel(newLvl);
          this.checkUnlockItems(newLvl);
          this.levelUpCallbacks.forEach(cb => cb(newLvl));
          newLvl++;
        }
      }
      checkUnlockItems(level) {
        const map = { 3: ['launcher_iron', 'projectile_bomb'], 5: ['launcher_alloy', 'projectile_spear'], 7: ['launcher_sci-fi', 'projectile_ice'], 9: ['launcher_laser', 'projectile_laser'] };
        const items = map[level];
        if (items) items.forEach(id => { if (!this.dataStorage.isItemUnlocked(id)) { this.dataStorage.unlockItem(id); this.itemUnlockCallbacks.forEach(cb => cb(id)); } });
      }
      getLevel() { return this.dataStorage.getLevel(); }
      getExperience() { return this.dataStorage.getExperience(); }
      getNextLevelExp() { return this.dataStorage.getNextLevelExp(); }
      getCurrentLauncherConfig() { const id = this.dataStorage.getCurrentLauncher(); return Launchers[id] || Launchers.launcher_wood; }
      getCurrentProjectileConfig() { const id = this.dataStorage.getCurrentProjectile(); return Projectiles[id] || Projectiles.projectile_bird; }
      isProjectileUnlocked(id) { return this.dataStorage.isItemUnlocked(id); }
      isLauncherUnlocked(id) { return this.dataStorage.isItemUnlocked(id); }
      getUnlockedProjectiles() { return Object.keys(Projectiles).filter(id => this.dataStorage.isItemUnlocked(id)); }
      getUnlockedLaunchers() { return Object.keys(Launchers).filter(id => this.dataStorage.isItemUnlocked(id)); }
      selectProjectile(id) { return this.dataStorage.setCurrentProjectile(id); }
      selectLauncher(id) { return this.dataStorage.setCurrentLauncher(id); }
      onLevelUp(cb) { this.levelUpCallbacks.push(cb); }
      onItemUnlock(cb) { this.itemUnlockCallbacks.push(cb); }
      calculateStarRating(ammoLeft, totalAmmo, enemiesKilled, totalEnemies) {
        const ammoRatio = ammoLeft / totalAmmo; const killRatio = enemiesKilled / totalEnemies;
        if (ammoRatio >= 0.5 && killRatio === 1) return 3;
        if (ammoRatio >= 0.25 && killRatio === 1) return 2;
        if (killRatio === 1) return 1;
        return 0;
      }
      calculateExperienceGain(stars, levelId, obstaclesDestroyed, ammoLeft) {
        let base = 100, bonus = 0;
        bonus += stars * 50; bonus += obstaclesDestroyed * 10; bonus += ammoLeft * 20; bonus += (levelId - 1) * 20;
        return base + bonus;
      }
    }

    class Renderer {

      drawLine(x1, y1, x2, y2, color, lineWidth = 2) { this.ctx.strokeStyle = color; this.ctx.lineWidth = lineWidth; this.ctx.beginPath(); this.ctx.moveTo(Math.floor(x1), Math.floor(y1)); this.ctx.lineTo(Math.floor(x2), Math.floor(y2)); this.ctx.stroke(); }
      drawText(text, x, y, color, size = 16, font = 'Courier New') { this.ctx.fillStyle = color; this.ctx.font = `${size}px ${font}`; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle'; this.ctx.fillText(text, Math.floor(x), Math.floor(y)); }

      drawTextRight(text, x, y, color, size = 16, font = 'Courier New') { this.ctx.fillStyle = color; this.ctx.font = `${size}px ${font}`; this.ctx.textAlign = 'right'; this.ctx.textBaseline = 'middle'; this.ctx.fillText(text, Math.floor(x), Math.floor(y)); }
      drawStar(x, y, size, color, points = 5) {
        this.ctx.fillStyle = color; this.ctx.beginPath();
        for (let i = 0; i < points * 2; i++) { const angle = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2; const radius = i % 2 === 0 ? size : size / 2; const px = x + Math.cos(angle) * radius; const py = y + Math.sin(angle) * radius; if (i === 0) this.ctx.moveTo(px, py); else this.ctx.lineTo(px, py); }
        this.ctx.closePath(); this.ctx.fill();
      }
      drawBackground(theme) {
        const colors = Constants.COLORS;
        let skyColor, groundColor;
        switch (theme) { 
          case 'lab': skyColor = colors.BACKGROUND_LAB; groundColor = colors.GROUND_LAB; break;
          case 'moon': skyColor = colors.BACKGROUND_MOON; groundColor = colors.GROUND_MOON; break;
          case 'jupiter': skyColor = colors.BACKGROUND_JUPITER; groundColor = colors.GROUND_JUPITER; break;
          case 'grass': skyColor = colors.BACKGROUND_GRASS; groundColor = colors.GROUND_GRASS; break; 
          case 'snow': skyColor = colors.BACKGROUND_SNOW; groundColor = colors.GROUND_SNOW; break; 
          case 'desert': skyColor = colors.BACKGROUND_DESERT; groundColor = colors.GROUND_DESERT; break; 
          case 'city': skyColor = colors.BACKGROUND_CITY; groundColor = colors.GROUND_CITY; break; 
          default: skyColor = colors.BACKGROUND_LAB; groundColor = colors.GROUND_LAB; 
        }
        this.drawRect(0, 0, this.width, this.height - 100, skyColor);

        this.drawGroundTexture(theme);
        if (theme === 'lab') {
          this.drawGrid();
        }

      drawGrid() {
        const ctx = this.ctx;
        const colors = Constants.COLORS;
        ctx.save();
        ctx.strokeStyle = colors.GRID_LINE;
        ctx.lineWidth = 1;
        
        for (let x = 0; x < this.width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, this.height - 100);
          ctx.stroke();
        }
        
        for (let y = 0; y < this.height - 100; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(this.width, y);
          ctx.stroke();
        }
        
        ctx.fillStyle = 'rgba(0, 170, 255, 0.3)';
        ctx.font = '10px Courier New';
        ctx.textAlign = 'right';
        for (let x = 0; x < this.width; x += 80) {
          ctx.fillText(`${x}`, x - 5, this.height - 90);
        }
        
        ctx.textAlign = 'left';
        for (let y = 0; y < this.height - 100; y += 40) {
          ctx.fillText(`${y}`, 5, y + 4);
        }
        ctx.restore();
      }
      drawGroundTexture(theme) {
        const ctx = this.ctx;
        const groundY = this.height - 100;
        if (theme === 'lab') {
          ctx.fillStyle = '#0a1628';
          ctx.fillRect(0, groundY, this.width, 100);
          ctx.fillStyle = '#00AAFF';
          ctx.fillRect(0, groundY + 5, this.width, 3);
          ctx.fillStyle = '#0088CC';
          ctx.fillRect(0, groundY + 10, this.width, 2);
          for (let i = 0; i < this.width; i += 60) {
            ctx.fillStyle = '#1a2a4a';
            ctx.fillRect(i, groundY + 20, 50, 60);
            ctx.fillStyle = '#2a3a5a';
            ctx.fillRect(i + 5, groundY + 25, 40, 50);
            ctx.fillStyle = '#00AAFF';
            ctx.fillRect(i + 15, groundY + 35, 8, 8);
            ctx.fillRect(i + 27, groundY + 35, 8, 8);
          }
        } else if (theme === 'grass') { for (let i = 0; i < this.width; i += 8) { const h = Math.random() > 0.5 ? 4 : 6; this.drawRect(i, groundY - h, 2, h, '#228B22'); } }
        else if (theme === 'snow') { for (let i = 0; i < this.width; i += 12) { this.drawCircle(i + 6, groundY - 3, 2, '#E8F4F8'); } }
        else if (theme === 'desert') { for (let i = 0; i < this.width; i += 10) { this.drawCircle(i + 5, groundY - 2, 2, '#C4A35A'); } }
        else if (theme === 'city') { this.drawRect(0, groundY + 50, this.width, 50, '#222222'); for (let i = 0; i < this.width; i += 60) { this.drawRect(i + 10, groundY - 40, 40, 40, '#555555'); this.drawRect(i + 20, groundY - 30, 8, 8, '#FFD700'); this.drawRect(i + 32, groundY - 30, 8, 8, '#FFD700'); } }
        else if (theme === 'moon') {
          ctx.fillStyle = '#3a3a5a';
          ctx.fillRect(0, groundY, this.width, 100);
          for (let i = 0; i < this.width; i += 50) {
            const size = Math.random() * 8 + 4;
            ctx.fillStyle = '#4a4a6a';
            ctx.beginPath();
            ctx.arc(i + Math.random() * 50, groundY + 20 + Math.random() * 40, size / 2, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (theme === 'jupiter') {
          ctx.fillStyle = '#4a3a2a';
          ctx.fillRect(0, groundY, this.width, 100);
          ctx.fillStyle = '#5a4a3a';
          for (let i = 0; i < this.width; i += 40) {
            ctx.fillRect(i, groundY, 40, 100);
          }
        }
      }
      get fillStyle() { return this.ctx.fillStyle; }
      set fillStyle(value) { this.ctx.fillStyle = value; }
    }

    class Projectile {
      constructor(x, y, config) {

        this.pierceCount = config.pierceCount || 0;
        this.onExplosion = null; this.onFreeze = null;
        this.angle = 0; this.rotationSpeed = 0.1;

      }

        if (this.trail.length > this.maxTrailLength) this.trail.shift();
        this.trail.forEach(t => t.alpha *= 0.9);
        if (Math.abs(this.vx) < 0.01 && Math.abs(this.vy) < 0.01) this.isActive = false;
      }
      draw(ctx) {

        const color = this.config.color;

          ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, -this.radius); ctx.lineTo(-this.radius * 0.7, this.radius); ctx.lineTo(this.radius * 0.7, this.radius); ctx.closePath(); ctx.fill();

          ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; const x = Math.cos(a) * this.radius * 0.3; const y = Math.sin(a) * this.radius * 0.3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x * 2, y * 2); ctx.stroke(); }

          ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.8, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#FF4444'; ctx.beginPath(); ctx.arc(0, 0, this.radius * 0.4, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(-this.radius * 0.3, -this.radius * 0.3, 3, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#000000'; ctx.beginPath(); ctx.arc(this.radius * 0.3, -this.radius * 0.2, 3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(-this.radius * 0.3, -this.radius * 0.2, 3, 0, Math.PI * 2); ctx.fill();

      drawTrail(ctx) {
        if (this.trail.length < 2) return;
        ctx.save();
        ctx.lineCap = 'round';
        const color = this.config.color;
        const gradient = ctx.createLinearGradient(this.trail[0].x, this.trail[0].y, this.x, this.y);
        gradient.addColorStop(0, 'rgba(255,255,255,0)');

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

      }
    }

        else if (this.entityType === 'wood') { ctx.strokeStyle = '#6D3A10'; ctx.lineWidth = 2; ctx.strokeRect(Math.floor(this.x), Math.floor(this.y), this.width, this.height); ctx.fillStyle = '#C08050'; for (let i = 0; i < 3; i++) ctx.fillRect(Math.floor(this.x + 4), Math.floor(this.y + 8 + i * 8), this.width - 8, 2); }
        else if (this.entityType === 'ice') { ctx.strokeStyle = '#88BBDD'; ctx.lineWidth = 2; ctx.strokeRect(Math.floor(this.x), Math.floor(this.y), this.width, this.height); ctx.strokeStyle = '#CCEEFF'; ctx.lineWidth = 1; for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { ctx.beginPath(); ctx.moveTo(this.x + 10 + i * 15, this.y + 10 + j * 10); ctx.lineTo(this.x + 18 + i * 15, this.y + 18 + j * 10); ctx.stroke(); } }

        if (this.frozen) { ctx.fillStyle = 'rgba(168, 216, 234, 0.4)'; ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.width, this.height); }

        e.isStatic = false;
        e.takeDamage(p.config.damage);
        if (p.config.effect === 'pierce') { p.pierceCount--; if (p.pierceCount <= 0) p.isActive = false; }
        else if (p.config.effect === 'explosion') { p.isActive = false; if (p.onExplosion) p.onExplosion(p.x, p.y, p.config.explosionRadius); }
        else if (p.config.effect === 'freeze') p.isActive = false;
        else p.isActive = false;
      }
      cleanupEntities() { this.projectiles = this.projectiles.filter(p => p.isActive); this.obstacles = this.obstacles.filter(o => o.isActive); this.enemies = this.enemies.filter(e => e.isActive); this.entities = this.entities.filter(e => e.isActive); }
      getActiveProjectilesCount() { return this.projectiles.filter(p => p.isActive).length; }
      getActiveEnemiesCount() { return this.enemies.filter(e => e.isActive).length; }
      getActiveObstaclesCount() { return this.obstacles.filter(o => o.isActive).length; }
    }

    class GameManager {
      constructor() {

        this.renderer = null; this.canvas = null;
        this.gameState = Constants.GAME_STATES.MENU;
        this.launcher = null; this.projectiles = [];

        if (this.isFirstLaunch) { this.gameState = Constants.GAME_STATES.GUIDE; this.isFirstLaunch = false; }

        this.startGameLoop();
      }
      loadPlayerData() {
        const launcherId = this.dataStorage.getCurrentLauncher();
        const projectileId = this.dataStorage.getCurrentProjectile();
        this.currentLauncherConfig = Launchers[launcherId] || Launchers.launcher_wood;
        this.currentProjectileConfig = Projectiles[projectileId] || Projectiles.projectile_bird;
      }
      setupEventListeners() {
        this.levelManager.onLevelComplete = () => this.handleLevelComplete();
        this.levelManager.onLevelFailed = () => this.handleLevelFailed();
        this.levelManager.onEnemyKilled = e => this.handleEnemyKilled(e);
        this.levelManager.onObstacleDestroyed = o => this.handleObstacleDestroyed(o);
        this.upgradeSystem.onLevelUp = level => this.handleLevelUp(level);
        this.upgradeSystem.onItemUnlock = itemId => this.handleItemUnlock(itemId);
        
        let touchStart = null, touchCurrent = null, isDragging = false;
        
        this.canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY }; touchCurrent = { x: t.clientX, y: t.clientY }; isDragging = true; this.handleTouchStart(touchStart); });
        this.canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!isDragging) return; const t = e.touches[0]; touchCurrent = { x: t.clientX, y: t.clientY }; this.handleTouchMove(touchStart, touchCurrent); });
        this.canvas.addEventListener('touchend', e => { e.preventDefault(); if (!isDragging) return; const t = e.changedTouches[0]; const touchEnd = { x: t.clientX, y: t.clientY }; isDragging = false; this.handleTouchEnd(touchStart, touchEnd); });
        
        this.canvas.addEventListener('mousedown', e => { const r = this.canvas.getBoundingClientRect(); touchStart = { x: e.clientX - r.left, y: e.clientY - r.top }; touchCurrent = touchStart; isDragging = true; this.handleTouchStart(touchStart); });
        this.canvas.addEventListener('mousemove', e => { if (!isDragging) return; const r = this.canvas.getBoundingClientRect(); touchCurrent = { x: e.clientX - r.left, y: e.clientY - r.top }; this.handleTouchMove(touchStart, touchCurrent); });
        this.canvas.addEventListener('mouseup', e => { if (!isDragging) return; const r = this.canvas.getBoundingClientRect(); const touchEnd = { x: e.clientX - r.left, y: e.clientY - r.top }; isDragging = false; this.handleTouchEnd(touchStart, touchEnd); });
      }
      startGameLoop() {
        const loop = ts => { const dt = ts - this.lastTime; this.lastTime = ts; this.update(dt); this.render(); this.gameLoopId = requestAnimationFrame(loop); };
        this.lastTime = performance.now();
        this.gameLoopId = requestAnimationFrame(loop);
      }
      update(deltaTime) {
        switch (this.gameState) { case Constants.GAME_STATES.MENU: break; case Constants.GAME_STATES.GAME: this.updateGame(deltaTime); break; case Constants.GAME_STATES.RESULT: break; case Constants.GAME_STATES.GUIDE: break; }

        this.projectiles.forEach(p => p.update());
        this.projectiles = this.projectiles.filter(p => p.isActive);
        if (this.screenShake && this.screenShake.timer > 0) {
          this.screenShake.timer -= deltaTime;
          if (this.screenShake.timer < 0) this.screenShake.timer = 0;
        }
        if (this.ammoLeft <= 0 && this.physicsEngine.getActiveProjectilesCount() === 0) this.levelManager.checkLevelFailed(this.ammoLeft);

        this.renderer.drawText('开始实验', Constants.SCREEN_WIDTH / 2, 358, '#FFFFFF', 16);

      handleTouchStart(start) {
        if (this.gameState === Constants.GAME_STATES.GAME) {
          const pos = this.launcher ? { x: this.launcher.x, y: this.launcher.y } : { x: 60, y: 250 };
          if (start.x < pos.x + 50 && start.x > pos.x - 50 && start.y < pos.y + 50 && start.y > pos.y - 50) { if (this.ammoLeft > 0) this.launcher.startCharge(start.x, start.y); return; }
          
          if (start.x >= Constants.SCREEN_WIDTH - 45 && start.x <= Constants.SCREEN_WIDTH - 17 && start.y >= Constants.SCREEN_HEIGHT - 55 && start.y <= Constants.SCREEN_HEIGHT - 27) { this.restartLevel(); return; }
        } else if (this.gameState === Constants.GAME_STATES.MENU) {
          for (let i = 0; i < Constants.LEVELS_COUNT; i++) { 
            const row = Math.floor(i / 3); const col = i % 3; 
            const x = 50 + col * 115; const y = 145 + row * 75; 
            const levelId = i + 1; 
            const dx = start.x - x; const dy = start.y - y;
            if (dx * dx + dy * dy <= 32 * 32) { 
              const progress = this.dataStorage.getLevelProgress(levelId); 
              if (progress.unlocked) { this.startGame(levelId); return; } 
            } 
          }
          
          const presets = Object.keys(Constants.PHYSICS_PRESETS);
          for (let i = 0; i < presets.length; i++) {
            const row = Math.floor(i / 2); const col = i % 2;
            const x = 446 + col * 175;
            const y = 145 + row * 75;
            if (start.x >= x && start.x <= x + 150 && start.y >= y && start.y <= y + 60) {
              const aiLevel = AISceneGenerator.generate(presets[i]);
              this.startGame(999, aiLevel);
              return;
            }
          }
        } else if (this.gameState === Constants.GAME_STATES.RESULT) {
          const isWin = this.enemiesKilled === this.levelManager.getTotalEnemies();
          const nextY = isWin && this.levelManager.getLevelId() < Constants.LEVELS_COUNT ? 280 : -100;
          const retryY = isWin && this.levelManager.getLevelId() < Constants.LEVELS_COUNT ? 320 : 280;
          const menuY = isWin && this.levelManager.getLevelId() < Constants.LEVELS_COUNT ? 360 : 320;
          if (nextY !== -100 && start.x >= Constants.SCREEN_WIDTH / 2 - 60 && start.x <= Constants.SCREEN_WIDTH / 2 + 60 && start.y >= nextY && start.y <= nextY + 32) { this.startGame(this.levelManager.getLevelId() + 1); return; }
          if (start.x >= Constants.SCREEN_WIDTH / 2 - 60 && start.x <= Constants.SCREEN_WIDTH / 2 + 60 && start.y >= retryY && start.y <= retryY + 32) { this.restartLevel(); return; }
          if (start.x >= Constants.SCREEN_WIDTH / 2 - 60 && start.x <= Constants.SCREEN_WIDTH / 2 + 60 && start.y >= menuY && start.y <= menuY + 32) { this.showMenu(); return; }
        } else if (this.gameState === Constants.GAME_STATES.GUIDE) {
          if (start.x >= Constants.SCREEN_WIDTH / 2 - 60 && start.x <= Constants.SCREEN_WIDTH / 2 + 60 && start.y >= 340 && start.y <= 372) { this.showMenu(); return; }
        }
      }
      handleTouchMove(start, current) {
        if (this.gameState === Constants.GAME_STATES.GAME && this.launcher && this.launcher.isCharging) this.launcher.updateCharge(current.x, current.y);
      }
      handleTouchEnd(start, end) {
        if (this.gameState === Constants.GAME_STATES.GAME && this.launcher && this.launcher.isCharging) {
          const r = this.launcher.releaseCharge();
          if (r.power > 0.1) this.fireProjectile(r.vx, r.vy);
        }
      }
      fireProjectile(vx, vy) {
        if (this.ammoLeft <= 0) return;
        const pos = this.launcher.getLauncherPosition();
        const p = new Projectile(pos.x, pos.y, this.currentProjectileConfig);
        p.launch(vx, vy);
        p.onExplosion = (x, y, radius) => { this.pixelEffect.createExplosion(x, y, '#FF4444', 40, 10); this.levelManager.applyExplosionDamage(x, y, radius, this.currentProjectileConfig.damage); };
        p.onFreeze = (x, y, radius) => { this.pixelEffect.createIceEffect(x, y, radius); this.levelManager.freezeObstaclesInRange(x, y, radius); };
        this.projectiles.push(p);
        this.physicsEngine.addEntity(p);
        this.ammoLeft--;
        this.createLaunchSparks(pos.x, pos.y, this.launcher.elasticAngle);
      }
      createLaunchSparks(x, y, angle) {
        for (let i = 0; i < 8; i++) {
          const spreadAngle = angle + MathUtils.randomRange(-0.5, 0.5);
          const speed = MathUtils.randomRange(2, 5);
          const color = Math.random() > 0.5 ? '#FFAA00' : '#FFFFFF';
          this.pixelEffect.sparks.push(new SparkParticle(x, y, color, speed, spreadAngle));
        }
      }
      handleEnemyKilled(e) { 
        this.enemiesKilled++; 
        this.score += e.entityType === 'boss' ? 500 : e.entityType === 'monster' ? 200 : 100; 
        this.pixelEffect.createEnemyReward(e.x, e.y, e.entityType);
      }
      handleObstacleDestroyed(o) { 
        this.obstaclesDestroyed++; 
        this.score += 50; 
        const rect = o.getBounds();
        const centerX = rect.left + (rect.right - rect.left) / 2;
        const centerY = rect.top + (rect.bottom - rect.top) / 2;
        this.createDebris(rect.left, rect.top, rect.right - rect.left, rect.bottom - rect.top, o.entityType);
        this.triggerScreenShake(3);
        switch (o.entityType) {
          case 'wood': this.pixelEffect.createWoodDestroy(rect.left, rect.top, rect.right - rect.left, rect.bottom - rect.top); break;
          case 'brick': this.pixelEffect.createBrickDestroy(rect.left, rect.top, rect.right - rect.left, rect.bottom - rect.top); break;
          case 'ice': this.pixelEffect.createIceDestroy(rect.left, rect.top, rect.right - rect.left, rect.bottom - rect.top); break;
          case 'stone': this.pixelEffect.createStoneDestroy(rect.left, rect.top, rect.right - rect.left, rect.bottom - rect.top); break;
          default: this.pixelEffect.createPixelFragments(rect.left, rect.top, rect.right - rect.left, rect.bottom - rect.top, '#8B4513');
        }
      }
      createDebris(x, y, width, height, entityType) {
        const colors = {
          wood: ['#5D3A1A', '#7D4F2A', '#9D6F3A', '#3D250F'],
          brick: ['#B06030', '#804020', '#D08050', '#603010'],
          ice: ['#A8D8EA', '#CCEEFF', '#88BBDD', '#FFFFFF'],
          stone: ['#666666', '#555555', '#777777', '#444444']
        };
        const colorList = colors[entityType] || ['#888888'];
        const debrisCount = Math.floor((width * height) / 80) + 3;
        const centerX = x + width / 2;
        const centerY = y + height / 2;
        for (let i = 0; i < debrisCount; i++) {
          const debrisWidth = MathUtils.randomRange(4, 8);
          const debrisHeight = MathUtils.randomRange(4, 8);
          const debrisX = MathUtils.randomRange(x, x + width - debrisWidth);
          const debrisY = MathUtils.randomRange(y, y + height - debrisHeight);
          const angle = MathUtils.randomRange(0, Math.PI * 2);
          const speed = MathUtils.randomRange(3, 8);
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed - 2;
          const debris = new Debris(debrisX, debrisY, debrisWidth, debrisHeight, colorList[Math.floor(Math.random() * colorList.length)], vx, vy);
          this.physicsEngine.addEntity(debris);
        }
      }
      triggerScreenShake(intensity) {
        if (!this.screenShake) this.screenShake = { x: 0, y: 0, timer: 0, maxIntensity: 0 };
        this.screenShake.maxIntensity = intensity;
        this.screenShake.timer = 100;
      }
      handleLevelComplete() {
        this.gameState = Constants.GAME_STATES.RESULT;
        const stars = this.upgradeSystem.calculateStarRating(this.ammoLeft, this.totalAmmo, this.enemiesKilled, this.levelManager.getTotalEnemies());
        const expGain = this.upgradeSystem.calculateExperienceGain(stars, this.levelManager.getLevelId(), this.obstaclesDestroyed, this.ammoLeft);
        this.upgradeSystem.addExperience(expGain);
        this.dataStorage.updateLevelProgress(this.levelManager.getLevelId(), stars, this.score, this.ammoLeft);
        if (this.levelManager.getLevelId() < Constants.LEVELS_COUNT) this.dataStorage.unlockLevel(this.levelManager.getLevelId() + 1);
        this.dataStorage.addScore(this.score);
      }
      handleLevelFailed() { this.gameState = Constants.GAME_STATES.RESULT; }
      handleLevelUp(level) { this.pixelEffect.createExplosion(Constants.SCREEN_WIDTH / 2, Constants.SCREEN_HEIGHT / 2, '#FFD700', 50, 10); }
      handleItemUnlock(itemId) { console.log('Unlocked:', itemId); }
      startGame(levelId, aiLevel = null) {
        this.gameState = Constants.GAME_STATES.GAME;
        this.aiReportTime = aiLevel ? Date.now() : 0;
        
        if (aiLevel) {
          this.levelManager.currentLevel = aiLevel;
          this.levelManager.obstacles = [];
          this.levelManager.enemies = [];
          if (aiLevel.obstacles) {
            aiLevel.obstacles.forEach(cfg => {
              const obs = new Obstacle(cfg.x, cfg.y, cfg.width, cfg.height, cfg.type, cfg.health);
              obs.onDestroy = o => { if (this.levelManager.onObstacleDestroyed) this.levelManager.onObstacleDestroyed(o); };
              this.levelManager.obstacles.push(obs);
            });
          }
          if (aiLevel.enemies) {
            aiLevel.enemies.forEach(cfg => {
              const e = new Enemy(cfg.x, cfg.y, cfg.type, cfg.health);
              e.onDestroy = enemy => { if (this.levelManager.onEnemyKilled) this.levelManager.onEnemyKilled(enemy); this.levelManager.checkLevelComplete(); };
              this.levelManager.enemies.push(e);
            });
          }
        } else {
          this.levelManager.loadLevel(levelId);
        }
        
        const physics = this.levelManager.currentLevel?.physics;
        const preset = physics ? Constants.PHYSICS_PRESETS[physics] : Constants.PHYSICS_PRESETS.EARTH;
        this.physicsEngine.setPhysicsParams(preset.gravity, preset.wind);
        
        this.score = 0; this.obstaclesDestroyed = 0; this.enemiesKilled = 0; this.totalAmmo = this.levelManager.getAmmoCount(); this.ammoLeft = this.totalAmmo;
        this.projectiles = []; this.physicsEngine.clear();
        const pos = this.levelManager.getLauncherPosition();
        this.launcher = new Launcher(pos.x, pos.y, this.currentLauncherConfig);
        this.levelManager.obstacles.forEach(o => this.physicsEngine.addEntity(o));
        this.levelManager.enemies.forEach(e => this.physicsEngine.addEntity(e));
      }
      restartLevel() { this.startGame(this.levelManager.getLevelId()); }
      showMenu() { this.gameState = Constants.GAME_STATES.MENU; this.projectiles = []; this.physicsEngine.clear(); this.launcher = null; }
      getHighestUnlockedLevel() { for (let i = Constants.LEVELS_COUNT; i >= 1; i--) { if (this.dataStorage.isLevelUnlocked(i)) return i; } return 1; }
    }

    window.onload = () => { window.gameManager = new GameManager(); window.gameManager.init(); };
  </script>
