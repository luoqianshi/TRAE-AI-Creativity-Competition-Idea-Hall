<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的题库</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      color: #1a1a1a;
      background: #f2f2f7;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #app-frame {
      width: 375px;
      height: 812px;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px #d1d1d6;
    }
    @media (max-width: 400px) {
      #app-frame { width: 100vw; height: 100vh; box-shadow: none; }
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部栏 */
    .header {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #e5e5e5;
      flex-shrink: 0;
      background: #ffffff;
    }
    .header-title {
      font-size: 17px;
      font-weight: 600;
    }
    .header-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .header-back {
      background: none;
      border: none;
      color: #2563eb;
      font-size: 15px;
      cursor: pointer;
      padding: 4px 0;
    }
    .header-center {
      font-size: 15px;
      font-weight: 600;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-progress {
      font-size: 13px;
      color: #888888;
    }

    /* 主体内容 */
    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 题库列表 */
    .bank-list { padding: 0; }
    .bank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e5e5;
      background: #ffffff;
    }
    .bank-name {
      font-weight: 600;
      font-size: 15px;
      flex: 1;
      word-break: break-all;
      padding-right: 8px;
    }
    .bank-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .action-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    /* 空状态 */
    .empty-text {
      text-align: center;
      color: #888888;
      padding: 40px 16px;
      font-size: 14px;
    }

    /* 错题集筛选栏 */
    .filter-bar {
      display: flex;
      overflow-x: auto;
      padding: 10px 16px;
      border-bottom: 1px solid #e5e5e5;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: #ffffff;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-tag {
      white-space: nowrap;
      font-size: 14px;
      color: #888888;
      cursor: pointer;
      padding-bottom: 3px;
      border-bottom: 2px solid transparent;
    }
    .filter-tag.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    /* 错题项 */
    .wrong-item {
      padding: 14px 16px;
      border-bottom: 1px solid #e5e5e5;
      background: #ffffff;
    }
    .wrong-bank {
      font-size: 13px;
      color: #888888;
      margin-bottom: 4px;
    }
    .wrong-content {
      font-size: 15px;
      margin-bottom: 4px;
      word-break: break-all;
      line-height: 1.5;
    }
    .wrong-answer {
      font-size: 13px;
      color: #2563eb;
    }

    /* 设置页 */
    .setting-section {
      padding: 14px 16px;
      border-bottom: 1px solid #e5e5e5;
      background: #ffffff;
    }
    .setting-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .setting-text {
      font-size: 13px;
      color: #1a1a1a;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 题库详情页 */
    .detail-view {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }
    .detail-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .question-content {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 16px;
      word-break: break-all;
    }
    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .option-item {
      padding: 12px;
      border: 1px solid #e5e5e5;
      font-size: 15px;
      cursor: pointer;
      background: #ffffff;
      word-break: break-all;
      text-align: left;
    }
    .option-item.correct {
      background: #dcfce7;
      border-color: #22c55e;
    }
    .option-item.wrong {
      background: #fee2e2;
      border-color: #ef4444;
    }
    .answer-display {
      font-size: 15px;
      color: #2563eb;
      margin-top: 8px;
    }
    .nav-btns {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border: none;
      font-size: 15px;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
    }
    .nav-btn:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    /* 悬浮导入按钮 */
    .fab {
      position: absolute;
      right: 16px;
      bottom: 68px;
      width: 52px;
      height: 52px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 50%;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .fab.hidden { display: none !important; }

    /* 底部Tab */
    .tab-bar {
      height: 52px;
      display: flex;
      border-top: 1px solid #e5e5e5;
      background: #ffffff;
      flex-shrink: 0;
    }
    .tab-item {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #888888;
      cursor: pointer;
      flex-direction: column;
      gap: 2px;
    }
    .tab-item.active {
      color: #2563eb;
    }

    /* 弹窗 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-box {
      background: #ffffff;
      padding: 24px;
      width: 260px;
      text-align: center;
    }
    .modal-text {
      font-size: 15px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .modal-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px 24px;
      font-size: 14px;
      cursor: pointer;
    }

    /* 隐藏 */
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app-frame">
    <div id="app">
      <!-- 题库视图 -->
      <div id="view-banks" class="view">
        <div class="header">
          <div class="header-title">我的题库</div>
        </div>
        <div class="content">
          <div id="bank-list" class="bank-list"></div>
          <div id="bank-empty" class="empty-text hidden">暂无题库，请点击右下角导入</div>
        </div>
      </div>

      <!-- 错题集视图 -->
      <div id="view-wrongs" class="view hidden">
        <div class="header">
          <div class="header-title">错题集</div>
        </div>
        <div class="content">
          <div class="filter-bar" id="filter-bar"></div>
          <div id="wrong-list"></div>
          <div id="wrong-empty" class="empty-text hidden">暂无错题，继续加油</div>
        </div>
      </div>

      <!-- 设置视图 -->
      <div id="view-settings" class="view hidden">
        <div class="header">
          <div class="header-title">设置</div>
        </div>
        <div class="content">
          <div class="setting-section">
            <div class="setting-title">导入说明</div>
            <div class="setting-text">请导入 .xlsx 格式文件，每行一道题，列顺序如下：

第1列：题目内容
第2列：A选项
第3列：B选项
第4列：C选项
第5列：D选项
第6列：正确答案（填写 A/B/C/D）

第1行为表头，会被自动跳过。</div>
          </div>
          <div class="setting-section">
            <div class="setting-title">版本信息</div>
            <div class="setting-text">版本 v1.0.0</div>
          </div>
        </div>
      </div>

      <!-- 题库详情页 -->
      <div id="view-detail" class="detail-view hidden">
        <div class="header">
          <button class="header-back" onclick="backToBanks()">＜ 返回</button>
          <div class="header-center" id="detail-title"></div>
          <div class="header-progress" id="detail-progress"></div>
        </div>
        <div class="detail-content" id="detail-content"></div>
      </div>

      <!-- 底部Tab -->
      <div class="tab-bar" id="tab-bar">
        <div class="tab-item active" data-tab="banks" onclick="switchTab('banks')">题库</div>
        <div class="tab-item" data-tab="wrongs" onclick="switchTab('wrongs')">错题集</div>
        <div class="tab-item" data-tab="settings" onclick="switchTab('settings')">设置</div>
      </div>

      <!-- 悬浮导入按钮 -->
      <button class="fab" id="fab" onclick="importBank()">+</button>

      <!-- 弹窗 -->
      <div id="modal" class="modal-overlay hidden" onclick="closeModal(event)">
        <div class="modal-box" onclick="event.stopPropagation()">
          <div class="modal-text" id="modal-text"></div>
          <button class="modal-btn" onclick="closeModal()">确定</button>
        </div>
      </div>

      <input type="file" id="file-input" accept=".xlsx" class="hidden" onchange="handleFile(event)">
    </div>
  </div>

  <script>
    // ==================== 示例数据 ====================
    const DEMO_BANK = {
      id: 'demo_001',
      title: '计算机基础题库（示例）',
      questions: [
        { content: '计算机中，1KB 等于多少字节？', options: ['1000', '1024', '512', '2048'], answer: 1 },
        { content: '以下哪种语言是面向对象的编程语言？', options: ['C', '汇编', 'Java', 'BASIC'], answer: 2 },
        { content: 'HTTP 协议默认使用的端口号是？', options: ['21', '80', '443', '8080'], answer: 1 },
        { content: '在关系型数据库中，用于查询数据的关键字是？', options: ['INSERT', 'UPDATE', 'DELETE', 'SELECT'], answer: 3 },
        { content: '二进制数 1010 转换为十进制是多少？', options: ['8', '9', '10', '11'], answer: 2 },
        { content: '以下哪个不是操作系统？', options: ['Windows', 'Linux', 'Photoshop', 'macOS'], answer: 2 },
        { content: 'IP 地址 192.168.1.1 属于哪类地址？', options: ['A类', 'B类', 'C类', 'D类'], answer: 2 },
        { content: 'CSS 中设置文字颜色的属性是？', options: ['font-color', 'text-color', 'color', 'background'], answer: 2 }
      ]
    };

    function initDemoData() {
      const banks = getBanks();
      if (banks.length === 0) {
        setBanks([DEMO_BANK]);
      }
    }

    // ==================== 数据操作 ====================
    function getBanks() {
      try {
        return JSON.parse(localStorage.getItem('banks')) || [];
      } catch { return []; }
    }
    function setBanks(banks) {
      localStorage.setItem('banks', JSON.stringify(banks));
    }
    function getWrongs() {
      try {
        return JSON.parse(localStorage.getItem('wrongs')) || {};
      } catch { return {}; }
    }
    function setWrongs(wrongs) {
      localStorage.setItem('wrongs', JSON.stringify(wrongs));
    }
    function getProgress() {
      try {
        return JSON.parse(localStorage.getItem('progress')) || {};
      } catch { return {}; }
    }
    function setProgress(progress) {
      localStorage.setItem('progress', JSON.stringify(progress));
    }

    // ==================== 视图切换 ====================
    let currentTab = 'banks';
    let currentBankId = null;
    let currentMode = null;
    let currentQuestionIndex = 0;
    let answering = false;

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById('view-' + tab).classList.remove('hidden');
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab-item[data-tab="' + tab + '"]').classList.add('active');
      if (tab === 'banks') renderBanks();
      if (tab === 'wrongs') renderWrongs();
    }

    // ==================== 题库视图 ====================
    function renderBanks() {
      const banks = getBanks();
      const list = document.getElementById('bank-list');
      const empty = document.getElementById('bank-empty');
      if (banks.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      list.innerHTML = banks.map(bank => `
        <div class="bank-item">
          <div class="bank-name">${escapeHtml(bank.title)}</div>
          <div class="bank-actions">
            <button class="action-btn" onclick="enterDetail('${bank.id}', 'memory')">记忆</button>
            <button class="action-btn" onclick="enterDetail('${bank.id}', 'practice')">刷题</button>
          </div>
        </div>
      `).join('');
    }

    function importBank() {
      document.getElementById('file-input').click();
    }

    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (rows.length < 2) {
            showModal('文件格式错误，请检查Excel内容');
            event.target.value = '';
            return;
          }

          const questions = [];
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 6) continue;
            const content = String(row[0] || '').trim();
            const optA = String(row[1] || '').trim();
            const optB = String(row[2] || '').trim();
            const optC = String(row[3] || '').trim();
            const optD = String(row[4] || '').trim();
            const answerStr = String(row[5] || '').trim().toUpperCase();

            if (!content || !optA || !optB || !optC || !optD) continue;

            const answerMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };
            if (!(answerStr in answerMap)) {
              showModal('文件格式错误，第' + (i + 1) + '行正确答案必须是 A/B/C/D');
              event.target.value = '';
              return;
            }

            questions.push({
              content: content,
              options: [optA, optB, optC, optD],
              answer: answerMap[answerStr]
            });
          }

          if (questions.length === 0) {
            showModal('未检测到有效题目，请检查Excel内容');
            event.target.value = '';
            return;
          }

          const banks = getBanks();
          const newBank = {
            id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            title: file.name.replace(/\.xlsx$/i, ''),
            questions: questions
          };
          banks.push(newBank);
          setBanks(banks);
          renderBanks();
          showModal('导入成功，共 ' + questions.length + ' 道题');
        } catch (err) {
          showModal('文件解析失败，请检查Excel格式');
        }
        event.target.value = '';
      };
      reader.readAsArrayBuffer(file);
    }

    // ==================== 错题集视图 ====================
    let wrongFilter = 'all';

    function renderWrongs() {
      const banks = getBanks();
      const wrongs = getWrongs();
      const filterBar = document.getElementById('filter-bar');
      const list = document.getElementById('wrong-list');
      const empty = document.getElementById('wrong-empty');

      const bankMap = {};
      banks.forEach(b => bankMap[b.id] = b);

      const wrongBankIds = Object.keys(wrongs).filter(id => wrongs[id] && wrongs[id].length > 0 && bankMap[id]);

      let tagsHtml = `<div class="filter-tag ${wrongFilter === 'all' ? 'active' : ''}" onclick="setWrongFilter('all')">全部</div>`;
      wrongBankIds.forEach(id => {
        tagsHtml += `<div class="filter-tag ${wrongFilter === id ? 'active' : ''}" onclick="setWrongFilter('${id}')">${escapeHtml(bankMap[id].title)}</div>`;
      });
      filterBar.innerHTML = tagsHtml;

      let items = [];
      if (wrongFilter === 'all') {
        wrongBankIds.forEach(id => {
          wrongs[id].forEach(idx => {
            if (bankMap[id] && bankMap[id].questions[idx]) {
              items.push({ bank: bankMap[id], question: bankMap[id].questions[idx], index: idx });
            }
          });
        });
      } else {
        if (wrongs[wrongFilter]) {
          wrongs[wrongFilter].forEach(idx => {
            if (bankMap[wrongFilter] && bankMap[wrongFilter].questions[idx]) {
              items.push({ bank: bankMap[wrongFilter], question: bankMap[wrongFilter].questions[idx], index: idx });
            }
          });
        }
      }

      if (items.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      list.innerHTML = items.map(item => `
        <div class="wrong-item">
          <div class="wrong-bank">[${escapeHtml(item.bank.title)}]</div>
          <div class="wrong-content">${escapeHtml(item.question.content)}</div>
          <div class="wrong-answer">正确答案：${escapeHtml(item.question.options[item.question.answer])}</div>
        </div>
      `).join('');
    }

    function setWrongFilter(filter) {
      wrongFilter = filter;
      renderWrongs();
    }

    // ==================== 题库详情页 ====================
    function enterDetail(bankId, mode) {
      const banks = getBanks();
      const bank = banks.find(b => b.id === bankId);
      if (!bank || bank.questions.length === 0) return;
      currentBankId = bankId;
      currentMode = mode;
      answering = false;

      document.getElementById('tab-bar').classList.add('hidden');
      document.getElementById('fab').classList.add('hidden');
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById('view-detail').classList.remove('hidden');

      const title = bank.title + ' - ' + (mode === 'memory' ? '记忆模式' : '刷题模式');
      document.getElementById('detail-title').textContent = title;

      if (mode === 'memory') {
        currentQuestionIndex = 0;
        renderMemory(bank);
      } else {
        const progress = getProgress();
        currentQuestionIndex = progress[bankId] || 0;
        if (currentQuestionIndex >= bank.questions.length) currentQuestionIndex = 0;
        renderPractice(bank);
      }
    }

    function backToBanks() {
      document.getElementById('view-detail').classList.add('hidden');
      document.getElementById('tab-bar').classList.remove('hidden');
      document.getElementById('fab').classList.remove('hidden');
      document.getElementById('view-banks').classList.remove('hidden');
      currentBankId = null;
      currentMode = null;
      answering = false;
    }

    function renderMemory(bank) {
      const progressText = `1/${bank.questions.length}`;
      document.getElementById('detail-progress').textContent = progressText;

      const html = bank.questions.map((q, i) => `
        <div style="margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #e5e5e5;">
          <div class="question-content">${i + 1}. ${escapeHtml(q.content)}</div>
          <div class="answer-display">正确答案：${escapeHtml(q.options[q.answer])}</div>
        </div>
      `).join('');
      document.getElementById('detail-content').innerHTML = html;
    }

    function renderPractice(bank) {
      const q = bank.questions[currentQuestionIndex];
      const progressText = `${currentQuestionIndex + 1}/${bank.questions.length}`;
      document.getElementById('detail-progress').textContent = progressText;

      const optionLabels = ['A', 'B', 'C', 'D'];
      const html = `
        <div class="question-content">${currentQuestionIndex + 1}. ${escapeHtml(q.content)}</div>
        <div class="options-list">
          ${q.options.map((opt, i) => `
            <button class="option-item" id="opt-${i}" onclick="selectOption(${i})">${optionLabels[i]}. ${escapeHtml(opt)}</button>
          `).join('')}
        </div>
        <div class="nav-btns">
          <button class="nav-btn" id="btn-prev" onclick="goPrev()">上一题</button>
          <button class="nav-btn" id="btn-next" onclick="goNext()">下一题</button>
        </div>
      `;
      document.getElementById('detail-content').innerHTML = html;
      updateNavButtons(bank);
      answering = false;
    }

    function updateNavButtons(bank) {
      const prevBtn = document.getElementById('btn-prev');
      const nextBtn = document.getElementById('btn-next');
      if (prevBtn) prevBtn.disabled = currentQuestionIndex === 0;
      if (nextBtn) nextBtn.disabled = currentQuestionIndex === bank.questions.length - 1;
    }

    function goPrev() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        const banks = getBanks();
        const bank = banks.find(b => b.id === currentBankId);
        if (bank) renderPractice(bank);
      }
    }

    function goNext() {
      const banks = getBanks();
      const bank = banks.find(b => b.id === currentBankId);
      if (bank && currentQuestionIndex < bank.questions.length - 1) {
        currentQuestionIndex++;
        renderPractice(bank);
      }
    }

    function selectOption(index) {
      if (answering) return;
      answering = true;
      const banks = getBanks();
      const bank = banks.find(b => b.id === currentBankId);
      if (!bank) return;
      const q = bank.questions[currentQuestionIndex];
      const correct = index === q.answer;

      document.getElementById('opt-' + q.answer).classList.add('correct');
      if (!correct) {
        document.getElementById('opt-' + index).classList.add('wrong');
      }

      const wrongs = getWrongs();
      if (!wrongs[currentBankId]) wrongs[currentBankId] = [];
      if (!correct) {
        if (!wrongs[currentBankId].includes(currentQuestionIndex)) {
          wrongs[currentBankId].push(currentQuestionIndex);
          wrongs[currentBankId].sort((a, b) => a - b);
        }
      } else {
        wrongs[currentBankId] = wrongs[currentBankId].filter(i => i !== currentQuestionIndex);
        if (wrongs[currentBankId].length === 0) delete wrongs[currentBankId];
      }
      setWrongs(wrongs);

      const progress = getProgress();
      progress[currentBankId] = currentQuestionIndex;
      setProgress(progress);
    }

    // ==================== 弹窗 ====================
    let modalCallback = null;
    function showModal(text, callback) {
      modalCallback = callback || null;
      document.getElementById('modal-text').textContent = text;
      document.getElementById('modal').classList.remove('hidden');
    }
    function closeModal(event) {
      if (event && event.target !== event.currentTarget && event.target.className !== 'modal-btn') return;
      document.getElementById('modal').classList.add('hidden');
      if (modalCallback) {
        modalCallback();
        modalCallback = null;
      }
    }

    // ==================== 工具函数 ====================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ==================== 初始化 ====================
    initDemoData();
    renderBanks();
  </script>
</body>
</html>
