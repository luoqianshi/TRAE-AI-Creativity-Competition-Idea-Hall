<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRCode Tool Demo - 二维码工具演示</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .card-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #667eea;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }
        .qr-display {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-top: 16px;
            padding: 20px;
        }
        .qr-display canvas, .qr-display img {
            max-width: 100%;
            height: auto;
        }
        .qr-placeholder {
            color: #999;
            font-size: 14px;
        }
        .result-box {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            word-break: break-all;
            color: #333;
            font-size: 14px;
        }
        .success {
            color: #28a745;
            font-weight: 600;
        }
        .error {
            color: #dc3545;
            font-weight: 600;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 16px;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .upload-area input {
            display: none;
        }
        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            margin: 10px auto;
            display: block;
            border-radius: 8px;
        }
        .tabs {
            display: flex;
            gap: 4px;
            background: #f0f0f0;
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px 16px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
        }
        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        .color-input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .color-input-group input[type="color"] {
            width: 50px;
            height: 40px;
            padding: 2px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
        }
        .color-input-group input[type="text"] {
            flex: 1;
        }
        .footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header">
                <h1>QRCode Tool Demo</h1>
                <p>简洁强大的二维码工具 - 纯前端演示版本</p>
            </div>

            <div class="tabs">
                <button class="tab" :class="{active: activeTab === 'generate'}" @click="activeTab = 'generate'">生成二维码</button>
                <button class="tab" :class="{active: activeTab === 'decode'}" @click="activeTab = 'decode'">识别二维码</button>
                <button class="tab" :class="{active: activeTab === 'styles'}" @click="activeTab = 'styles'">样式演示</button>
            </div>

            <!-- 生成二维码 -->
            <div class="tab-content" :class="{active: activeTab === 'generate'}">
                <div class="card">
                    <div class="card-title">生成二维码</div>
                    <div class="form-group">
                        <label>内容</label>
                        <input type="text" v-model="generateContent" placeholder="输入二维码内容..." @keyup.enter="generateQR">
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>尺寸 (px)</label>
                            <input type="number" v-model="qrSize" min="100" max="400" step="50">
                        </div>
                        <div class="form-group">
                            <label>错误纠正级别</label>
                            <select v-model="errorLevel">
                                <option value="L">L (7%)</option>
                                <option value="M">M (15%)</option>
                                <option value="Q">Q (25%)</option>
                                <option value="H">H (30%)</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" @click="generateQR">生成</button>
                        <button class="btn btn-secondary" @click="downloadQR">下载</button>
                        <button class="btn btn-secondary" @click="copyToClipboard">复制到剪贴板</button>
                    </div>
                    <div class="qr-display">
                        <canvas ref="qrCanvas" v-show="qrGenerated"></canvas>
                        <span class="qr-placeholder" v-if="!qrGenerated">生成的二维码将显示在这里</span>
                    </div>
                </div>
            </div>

            <!-- 识别二维码 -->
            <div class="tab-content" :class="{active: activeTab === 'decode'}">
                <div class="card">
                    <div class="card-title">识别二维码</div>
                    <div class="upload-area" @click="$refs.fileInput.click()">
                        <div class="upload-icon">📷</div>
                        <div>点击或拖拽图片到这里</div>
                        <div style="font-size: 12px; color: #999; margin-top: 5px;">支持 PNG, JPG, BMP 等格式</div>
                        <input type="file" ref="fileInput" @change="handleFileUpload" accept="image/*">
                    </div>
                    <img v-if="previewImage" :src="previewImage" class="preview-image" alt="预览">
                    <div v-if="decodeResult" class="result-box" :class="decodeResult.success ? 'success' : 'error'">
                        <strong>识别结果：</strong><br>
                        {{ decodeResult.content }}
                    </div>
                    <div v-if="decodeError" class="result-box error">
                        {{ decodeError }}
                    </div>
                </div>
            </div>

            <!-- 样式演示 -->
            <div class="tab-content" :class="{active: activeTab === 'styles'}">
                <div class="card">
                    <div class="card-title">自定义样式</div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>前景色</label>
                            <div class="color-input-group">
                                <input type="color" v-model="fgColor" @change="generateStyledQR">
                                <input type="text" v-model="fgColor" @change="generateStyledQR">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>背景色</label>
                            <div class="color-input-group">
                                <input type="color" v-model="bgColor" @change="generateStyledQR">
                                <input type="text" v-model="bgColor" @change="generateStyledQR">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <input type="text" v-model="styleContent" placeholder="输入内容..." @input="generateStyledQR">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" @click="generateStyledQR">更新预览</button>
                    </div>
                    <div class="qr-display">
                        <canvas ref="styleCanvas"></canvas>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Logo 二维码</div>
                    <div class="form-group">
                        <label>内容</label>
                        <input type="text" v-model="logoContent" placeholder="输入内容..." @input="generateLogoQR">
                    </div>
                    <div class="upload-area" @click="$refs.logoInput.click()">
                        <div class="upload-icon">🖼️</div>
                        <div>点击选择 Logo 图片</div>
                        <input type="file" ref="logoInput" @change="handleLogoUpload" accept="image/*">
                    </div>
                    <img v-if="logoPreview" :src="logoPreview" style="max-width: 80px; margin: 10px auto; display: block; border-radius: 8px;" alt="Logo">
                    <div class="btn-group">
                        <button class="btn btn-primary" @click="generateLogoQR">生成带Logo二维码</button>
                    </div>
                    <div class="qr-display">
                        <canvas ref="logoCanvas"></canvas>
                    </div>
                </div>
            </div>

            <div class="footer">
                <p>QRCode Tool Demo - 基于 Vue 3 + Canvas 纯前端实现</p>
                <p>如需完整功能，请使用主程序</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                // 生成二维码
                const generateContent = ref('https://example.com');
                const qrSize = ref(200);
                const errorLevel = ref('M');
                const qrCanvas = ref(null);
                const qrGenerated = ref(false);

                // 识别二维码
                const previewImage = ref('');
                const decodeResult = ref(null);
                const decodeError = ref('');
                const fileInput = ref(null);

                // 样式演示
                const styleContent = ref('Styled QR Code');
                const fgColor = ref('#000000');
                const bgColor = ref('#ffffff');
                const styleCanvas = ref(null);

                // Logo 二维码
                const logoContent = ref('Logo QR Code');
                const logoPreview = ref('');
                const logoImageData = ref(null);
                const logoCanvas = ref(null);
                const logoInput = ref(null);

                // Tab
                const activeTab = ref('generate');

                // 生成二维码
                function generateQR() {
                    if (!generateContent.value) return;

                    const canvas = qrCanvas.value;
                    QRCode.toCanvas(canvas, generateContent.value, {
                        width: qrSize.value,
                        margin: 2,
                        errorCorrectionLevel: errorLevel.value
                    }, function(error) {
                        if (error) {
                            console.error(error);
                            alert('生成失败: ' + error.message);
                        } else {
                            qrGenerated.value = true;
                        }
                    });
                }

                // 下载二维码
                function downloadQR() {
                    if (!qrGenerated.value) return;

                    const canvas = qrCanvas.value;
                    const link = document.createElement('a');
                    link.download = 'qrcode.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }

                // 复制到剪贴板
                async function copyToClipboard() {
                    if (!qrGenerated.value) return;

                    const canvas = qrCanvas.value;
                    try {
                        const blob = await new Promise(resolve => canvas.toBlob(resolve));
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        alert('已复制到剪贴板！');
                    } catch (err) {
                        alert('复制失败，请手动截图');
                    }
                }

                // 处理文件上传
                function handleFileUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function(event) {
                        previewImage.value = event.target.result;
                        decodeQRImage(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }

                // 解码二维码
                function decodeQRImage(imageSrc) {
                    decodeResult.value = null;
                    decodeError.value = '';

                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);

                        try {
                            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                                inversionAttempts: 'dontInvert'
                            });

                            if (code) {
                                decodeResult.value = {
                                    success: true,
                                    content: code.data
                                };
                            } else {
                                decodeResult.value = {
                                    success: false,
                                    content: '未能识别出二维码内容'
                                };
                            }
                        } catch (err) {
                            decodeError.value = '图片解析失败: ' + err.message;
                        }
                    };
                    img.src = imageSrc;
                }

                // 生成样式二维码
                function generateStyledQR() {
                    if (!styleContent.value) return;

                    const canvas = styleCanvas.value;
                    QRCode.toCanvas(canvas, styleContent.value, {
                        width: 200,
                        margin: 2,
                        color: {
                            dark: fgColor.value,
                            light: bgColor.value
                        }
                    }, function(error) {
                        if (error) console.error(error);
                    });
                }

                // 处理 Logo 上传
                function handleLogoUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = function(event) {
                        logoPreview.value = event.target.result;

                        const img = new Image();
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            canvas.width = 80;
                            canvas.height = 80;
                            const ctx = canvas.getContext('2d');

                            // 圆角裁剪
                            ctx.beginPath();
                            ctx.roundRect(0, 0, 80, 80, 10);
                            ctx.clip();

                            // 绘制logo
                            const size = Math.min(img.width, img.height);
                            const sx = (img.width - size) / 2;
                            const sy = (img.height - size) / 2;
                            ctx.drawImage(img, sx, sy, size, size, 0, 0, 80, 80);

                            logoImageData.value = canvas.toDataURL('image/png');
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }

                // 生成带 Logo 的二维码
                function generateLogoQR() {
                    if (!logoContent.value) return;

                    const canvas = logoCanvas.value;
                    QRCode.toCanvas(canvas, logoContent.value, {
                        width: 200,
                        margin: 2,
                        errorCorrectionLevel: 'H'
                    }, function(error) {
                        if (error) {
                            console.error(error);
                            return;
                        }

                        if (logoImageData.value) {
                            const ctx = canvas.getContext('2d');
                            const logoSize = canvas.width * 0.2;
                            const logo = new Image();
                            logo.onload = function() {
                                ctx.drawImage(logo,
                                    (canvas.width - logoSize) / 2,
                                    (canvas.height - logoSize) / 2,
                                    logoSize, logoSize
                                );
                            };
                            logo.src = logoImageData.value;
                        }
                    });
                }

                onMounted(() => {
                    generateQR();
                    generateStyledQR();
                });

                return {
                    generateContent,
                    qrSize,
                    errorLevel,
                    qrCanvas,
                    qrGenerated,
                    generateQR,
                    downloadQR,
                    copyToClipboard,
                    previewImage,
                    decodeResult,
                    decodeError,
                    fileInput,
                    handleFileUpload,
                    activeTab,
                    styleContent,
                    fgColor,
                    bgColor,
                    styleCanvas,
                    generateStyledQR,
                    logoContent,
                    logoPreview,
                    logoInput,
                    handleLogoUpload,
                    logoCanvas,
                    generateLogoQR
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
