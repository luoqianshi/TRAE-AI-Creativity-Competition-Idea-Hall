    function renderMarkdownText(markdown) {
      const lines = markdown.split("\n");
      let html = "";
      let inUl = false;
      let inOl = false;
      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          return;
        }
        if (trimmed.startsWith("### ")) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += `<h3>${escapeHTML(trimmed.slice(4))}</h3>`;
        } else if (trimmed.startsWith("## ")) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += `<h2>${escapeHTML(trimmed.slice(3))}</h2>`;
        } else if (trimmed.startsWith("# ")) {
          html += `<h1>${escapeHTML(trimmed.slice(2))}</h1>`;
        } else if (trimmed.startsWith("- ")) {
          if (!inUl) { html += "<ul>"; inUl = true; }
          html += `<li>${escapeHTML(trimmed.slice(2))}</li>`;
        } else if (/^\d+\.\s/.test(trimmed)) {
          if (!inOl) { html += "<ol>"; inOl = true; }
          html += `<li>${escapeHTML(trimmed.replace(/^\d+\.\s/, ""))}</li>`;
        } else {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (inOl) { html += "</ol>"; inOl = false; }
          html += `<p>${escapeHTML(trimmed)}</p>`;
        }
      });
      if (inUl) html += "</ul>";
      if (inOl) html += "</ol>";
      return html;
    }

                  <strong>${item.score}分</strong>
                  <div class="bar" style="--score:${item.score}"></div>
                  <span class="fine">${escapeHTML(item.createdAt)}</span>
                </div>
              `).join("")}
            </div>
          </section>
          <section class="card">
            <h2>AI 建议</h2>
            <p class="muted">根据前三次复习记录，系统发现你在极限模块进步明显，但导数应用和积分换元仍不稳定。下一轮建议先进行导数专项训练，再进入整卷模拟。</p>
            <div class="btn-row">
              <button class="btn primary" data-jump="coach">让 AI 制定今日计划</button>
            </div>
          </section>
        </div>
        <section class="card" style="margin-top:18px;">
          <h2>复习地图</h2>
          <p class="muted">把知识点按复习路径串起来，优先展示今天最值得投入的模块。</p>
          <div class="learning-map">
            ${mockLearningMap.map((point, index) => `
              <article class="map-node">
                <div class="map-index">${index + 1}</div>
                <div>
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                    <h3 style="margin:0;">${escapeHTML(point.name)}</h3>
                    <strong>${point.percent}%</strong>
                  </div>
                  <div class="progress"><span style="--value:${point.percent}%"></span></div>
                  <p class="fine" style="margin:8px 0 0;">推荐动作：${escapeHTML(point.action)}</p>
                </div>
                <span class="tag ${point.tagClass}">${escapeHTML(point.status)}</span>
              </article>
            `).join("")}
          </div>
        </section>

        <section class="card" style="margin-top:18px;">
          <h2>最近高频错题</h2>
          <p class="muted">错题点不代表能力固定，只用于提示下一轮更适合练什么。</p>
          <div class="wrong-grid">
            ${mockWrongReview.map(item => `
              <article class="wrong-card">
                <span class="tag danger">高频错题</span>
                <h3 style="margin-top:12px;">${escapeHTML(item.title)}</h3>
                <p><strong>错误原因：</strong>${escapeHTML(item.reason)}</p>
                <p class="muted"><strong>AI建议：</strong>${escapeHTML(item.advice)}</p>
                <button class="btn primary" data-jump="coach">去复习</button>
              </article>
            `).join("")}
          </div>
        </section>
        <section class="card" style="margin-top:18px;">
          <h2>历史记录</h2>
          ${state.sessions.map(item => `
            <div class="history-item">
              <div class="round-badge">${item.score}</div>
              <div>
                <h3>${escapeHTML(item.createdAt)} · 第 ${item.round} 轮</h3>
                <p><strong>错题集中点：</strong>${item.wrongPoints.map(escapeHTML).join("、")}</p>
                <p><strong>用户留言：</strong>${escapeHTML(item.userNote)}</p>
                <p class="muted"><strong>AI建议：</strong>${escapeHTML(item.aiAdvice)}</p>
              </div>
            </div>
          `).join("")}
        </section>
      `;
    }

    function renderChatMessages() {
      return state.chat.map(message => `
        <div class="bubble ${message.role === "user" ? "user" : "assistant"}">${escapeHTML(message.content)}</div>
      `).join("");
    }

    function renderExam() {
      const result = state.examResult;
      return `
        <section class="exam-card" id="examArea">
          <h2>${escapeHTML(mockExam.examTitle)}</h2>
          <p class="muted">完成题目后提交，即可看到得分、错题集中点和复习建议。</p>
          ${mockExam.questions.map((question, index) => `
            <div class="question">
              <p><strong>${index + 1}. ${escapeHTML(question.question)}</strong></p>
              <p><span class="tag">${escapeHTML(question.knowledgePoint)}</span> <span class="tag gray">${escapeHTML(question.difficulty)}</span></p>
              ${question.type === "single_choice" ? `
                ${question.options.map((option, optionIndex) => {
                  const letter = String.fromCharCode(65 + optionIndex);
                  return `
                    <label class="option">
                      <input type="radio" name="q${question.id}" value="${letter}">
                      ${letter}. ${escapeHTML(option)}
                    </label>
                  `;
                }).join("")}
              ` : question.type === "judge" ? `
                <label class="option">
                  <input type="radio" name="q${question.id}" value="正确">
                  正确
                </label>
                <label class="option">
                  <input type="radio" name="q${question.id}" value="错误">
                  错误
                </label>
              ` : `
                <input id="q${question.id}" placeholder="请输入答案，例如 x²+C" />
              `}
            </div>
          `).join("")}
          <div class="btn-row">
            <button class="btn primary" id="submitExam">提交试卷</button>
          </div>
          ${result ? `
            <div class="result-box">
              <h3>本次得分：${result.score}分</h3>
              <p><strong>错题集中点：</strong>${result.wrongPoints.length ? result.wrongPoints.join("、") : "本次没有明显错题集中点"}</p>
              <p><strong>AI建议：</strong>${escapeHTML(result.aiAdvice)}</p>
              ${result.explanations.length ? `
                <div>
                  <strong>错题讲解：</strong>
                  <div class="explain-grid">
                    ${result.explanations.map(item => `<article class="explain-card">${escapeHTML(item)}</article>`).join("")}
                  </div>
                </div>
              ` : "<p>本次全部答对，可以进入限时训练。</p>"}
            </div>
          ` : ""}
        </section>
      `;
    }

    function renderCoach() {
      return `
        ${renderShellHeader("AI陪练", "AI 会结合复习项目、复习包和历史轨迹，继续提供今日计划、错题讲解和模拟考试。")}
        <div class="chat-layout">
          <aside class="card">
            <h2>项目状态</h2>
            <p><strong>当前项目：</strong>${escapeHTML(state.currentProject.courseName)}</p>
            <p><strong>复习包：</strong>已生成</p>
            <p><strong>轨迹记录：</strong>${state.sessions.length}次</p>
            <p><strong>薄弱点：</strong>导数应用、积分换元</p>
            <p><strong>当前掌握度：</strong>${state.currentProject.mastery}%</p>
            <div class="progress"><span style="--value:${state.currentProject.mastery}%"></span></div>
            <div style="margin-top:18px;">
              <h3>今日推荐路径</h3>
              <div class="path-strip">
                <span class="path-step">积分计算</span>
                <span class="path-arrow">→</span>
                <span class="path-step">导数应用</span>
                <span class="path-arrow">→</span>
                <span class="path-step">5题小测</span>
                <span class="path-arrow">→</span>
                <span class="path-step">错题复盘</span>
              </div>
            </div>
            <div class="btn-row">
              <button class="btn" data-quick="plan">生成今日计划</button>
              <button class="btn primary" data-quick="today">根据今日任务继续复习</button>
              <button class="btn" data-quick="quiz">生成5题小测</button>
              <button class="btn" data-quick="reason">查看错题原因</button>
              <button class="btn" data-quick="mode">切换复习模式</button>
              <button class="btn warning" data-quick="exam">开始模拟考试</button>
              <button class="btn" data-quick="wrong">讲解错题</button>
              <button class="btn" data-quick="continue">继续上次复习</button>
            </div>
          </aside>
          <section class="card">
            <h2>AI 对话</h2>
            <div class="chat-box" id="chatBox">${renderChatMessages()}</div>
            <div class="chat-input">
              <input id="chatInput" placeholder="输入你的复习问题，例如：积分换元怎么练？" />
              <button class="btn primary" id="sendChat">发送</button>
            </div>
            ${state.showExam ? renderExam() : ""}
          </section>
        </div>
      `;
    }

    function render() {
      const content = document.getElementById("content");
      const views = {
        upload: renderUpload,
        analysis: renderAnalysis,
        markdown: renderMarkdown,
        track: renderTrack,
        coach: renderCoach
      };
      renderProjects();
      content.innerHTML = views[state.view]();
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.view === state.view);
        btn.onclick = () => setView(btn.dataset.view);
      });
      bindEvents();
    }

    function fillExample() {
      document.getElementById("courseName").value = "高数期末复习";
      document.getElementById("examDate").value = "7天后";
      document.getElementById("targetScore").value = "75";
      document.getElementById("outlineText").value = mockProjects[0].outline;
      toast("已填入高数示例");
    }

    function createProject() {
      const courseName = document.getElementById("courseName").value.trim() || "高数期末复习";
      const examDate = document.getElementById("examDate").value.trim() || "7天后";
      const targetScore = Number(document.getElementById("targetScore").value) || 75;
      const outline = document.getElementById("outlineText").value.trim() || mockProjects[0].outline;
      const project = {
        id: `project-${Date.now()}`,
        courseName,
        examDate,
        targetScore,
        outline,
        status: "复习中",
        mastery: 62
      };
      state.projects = [project, ...state.projects.filter(item => item.courseName !== courseName)];
      state.currentProject = project;
      save("gt_projects", state.projects);
      save("gt_current_project", state.currentProject);
      toast("已生成复习项目");
      setTimeout(() => setView("analysis"), 450);
    }

    function copyMarkdown() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(mockMarkdown).then(() => toast("已复制 Markdown 内容"));
      } else {
        const temp = document.createElement("textarea");
        temp.value = mockMarkdown;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
        toast("已复制 Markdown 内容");
      }
    }

    function downloadMarkdown() {
      const blob = new Blob([mockMarkdown], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "高等数学期末复习包.md";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      toast("已生成 Markdown 下载文件");
    }

    function addChatMessage(role, content) {
      const last = state.chat[state.chat.length - 1];
      if (last && last.role === role && last.content === content) {
        toast("相同回复已存在，未重复添加");
        return false;
      }
      state.chat.push({ role, content });
      return true;
    }

    function appendChat(role, content) {
      if (!addChatMessage(role, content)) return;
      render();
      setTimeout(() => {
        const box = document.getElementById("chatBox");
        if (box) box.scrollTop = box.scrollHeight;
      }, 0);
    }

    function quickReply(type) {
      const replies = {
        plan: "今天建议采用 2 小时复习节奏：30分钟复盘导数应用，50分钟做专项题，30分钟训练积分换元，10分钟整理错题。",
        wrong: "你最近的错题集中在导数应用和积分换元。导数应用题要先判断函数结构，再完成求导和单调性分析；积分换元题要注意换元后上下限同步变化。",
        continue: "上次你完成了第三轮模拟，得分72分。下一步建议进入导数应用专项训练，并在完成后进行一次限时小测。",
        today: "根据今日复习任务，建议你先完成积分换元基础训练，再进行导数应用专项题，最后用一套5题小测检查效果。",
        quiz: "已为你准备一组 5 题小测：2 题导数应用、2 题积分换元、1 题综合判断。建议限时 18 分钟完成，结束后优先复盘错因。",
        reason: "最近错题的主要原因有两个：一是导数符号和单调性之间的对应关系不够熟；二是定积分换元后容易忘记同步调整上下限。",
        mode: "可以切换到“专项突破”模式。这个模式会减少整卷练习，优先把积分换元和导数应用拆成小题组训练。"
      };
      if (type === "exam") {
        state.showExam = true;
        toast("已打开模拟考试");
        render();
        return;
      }
      appendChat("assistant", replies[type]);
    }

    function normalizeAnswer(value) {
      return String(value || "")
        .replace(/\s/g, "")
        .replace(/x\^2/gi, "x²")
        .replace(/＋/g, "+")
        .toUpperCase();
    }

    function submitExam() {
      let correct = 0;
      const wrongPoints = [];
      const explanations = [];
      mockExam.questions.forEach(question => {
        let userAnswer = "";
        if (question.type === "single_choice" || question.type === "judge") {
          const checked = document.querySelector(`input[name="q${question.id}"]:checked`);
          userAnswer = checked ? checked.value : "";
          if (userAnswer === question.answer) correct += 1;
        } else {
          const input = document.getElementById(`q${question.id}`);
          userAnswer = normalizeAnswer(input ? input.value : "");
          if (userAnswer === normalizeAnswer(question.answer)) correct += 1;
        }
        const isCorrect = question.type === "single_choice" || question.type === "judge"
          ? userAnswer === question.answer
          : userAnswer === normalizeAnswer(question.answer);
        if (!isCorrect) {
          wrongPoints.push(question.knowledgePoint);
          explanations.push(`${question.knowledgePoint}：${question.explanation}`);
        }
      });
      const score = Math.round((correct / mockExam.questions.length) * 100);
      const uniqueWrong = [...new Set(wrongPoints)];
      const result = {
        score,
        wrongPoints: uniqueWrong,
        aiAdvice: uniqueWrong.length ? "下一轮建议重点练习积分换元和定积分面积题，同时复盘本次错题的解题步骤。" : "本次表现稳定，可以进入限时综合训练。",
        explanations
      };
      state.examResult = result;
      save("gt_exam_result", result);
      const nextRound = state.sessions.length + 1;
      state.sessions = [
        ...state.sessions,
        {
          round: nextRound,
          score,
          wrongPoints: uniqueWrong.length ? uniqueWrong : ["无明显错题"],
          userNote: "完成一次模拟考试",
          aiAdvice: result.aiAdvice,
          createdAt: `第${nextRound}次复习`
        }
      ];
      save("gt_study_sessions", state.sessions);
      toast("已提交试卷，并新增复习轨迹");
      render();
    }

    function bindEvents() {
      document.querySelectorAll("[data-jump]").forEach(btn => {
        btn.addEventListener("click", () => setView(btn.dataset.jump));
      });
      document.getElementById("fillExample")?.addEventListener("click", fillExample);
      document.getElementById("fillExampleBottom")?.addEventListener("click", fillExample);
      document.getElementById("createProject")?.addEventListener("click", createProject);
      document.getElementById("reparse")?.addEventListener("click", () => toast("已重新解析考纲"));
      document.getElementById("generateMd")?.addEventListener("click", () => toast("已生成 MD 复习包"));
      document.getElementById("copyMd")?.addEventListener("click", copyMarkdown);
      document.getElementById("downloadMd")?.addEventListener("click", downloadMarkdown);
      document.getElementById("startExamFromMd")?.addEventListener("click", () => {
        state.showExam = true;
        setView("coach");
      });
      document.querySelectorAll("[data-quick]").forEach(btn => {
        btn.addEventListener("click", () => quickReply(btn.dataset.quick));
      });
      document.querySelectorAll("[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedMode = btn.dataset.mode;
          const mode = mockReviewModes.find(item => item.id === state.selectedMode);
          toast(`已选择 ${mode ? mode.name : "复习模式"}`);
          render();
        });
      });
      document.getElementById("sendChat")?.addEventListener("click", () => {
        const input = document.getElementById("chatInput");
        const value = input.value.trim();
        if (!value) return toast("请先输入问题");
        addChatMessage("user", value);
        addChatMessage("assistant", "收到。结合你的当前轨迹，建议先锁定一个薄弱点，再用 20 分钟做小题组训练，结束后记录错因。");
        render();
      });
      document.getElementById("chatInput")?.addEventListener("keydown", event => {
        if (event.key === "Enter") document.getElementById("sendChat").click();
      });
      document.getElementById("submitExam")?.addEventListener("click", submitExam);
    }

    render();
  </script>
</body>
</html>
