<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusForest · AI 专注自习室</title>

  <!-- ====== 外部依赖（仅这两个 CDN，其余全部自包含） ====== -->
  <!-- Tailwind CSS（CDN，脚本内配置森林绿主题板） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- 圆体人文无衬线字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- ====== Tailwind 主题配置：森林绿板 + 圆体字体 ====== -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: {
              50:  '#f2faf2',
              100: '#e3f3e3',
              200: '#c4e6c4',
              300: '#9fd39f',
              400: '#6fbf6f',
              500: '#4ea84e',
              600: '#3d8b3d',
              700: '#2f6f2f',
            },
          },
          fontFamily: {
            round: ['Quicksand', 'Nunito', 'ui-rounded', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 10px 40px -10px rgba(46,111,47,0.25)',
            glow: '0 0 0 6px rgba(143,209,122,0.18)',
          },
        },
      },
    };
  </script>

  <style>
    /* ====== 基础：圆润字体 + 柔和背景 ====== */
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Quicksand', 'Nunito', ui-rounded, system-ui, sans-serif;
      /* 森林氛围浅色渐变背景 */
      background:
        radial-gradient(1200px 600px at 12% -8%, #d8f3d8 0%, transparent 55%),
        radial-gradient(1000px 520px at 100% 0%, #c8ecd0 0%, transparent 50%),
        linear-gradient(160deg, #eef9ee 0%, #dff3e3 45%, #cfeede 100%);
      min-height: 100vh;
    }

    /* 背景里漂浮的柔和光斑（森林氛围） */
    .blob { position: fixed; border-radius: 9999px; filter: blur(60px); opacity: .55; z-index: 0; pointer-events: none; }

    /* 毛玻璃卡片 */
    .glass {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px) saturate(135%);
      -webkit-backdrop-filter: blur(14px) saturate(135%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 40px -12px rgba(46, 111, 47, 0.28);
    }

    /* ====== 番茄钟表盘 ====== */
    .ring-track  { stroke: rgba(143,209,122,0.30); }
    .ring-progress {
      stroke: #4ea84e;
      stroke-linecap: round;
      transition: stroke-dashoffset .9s linear;
      filter: drop-shadow(0 2px 6px rgba(78,168,78,.35));
    }

    /* ====== 像素小树苗 互动动画 ====== */
    .sapling { cursor: pointer; transition: transform .2s ease; }
    .sapling:active { transform: scale(0.94); }
    /* 摇一摇 */
    @keyframes wiggle {
      0%,100% { transform: rotate(0deg); }
      20% { transform: rotate(-9deg); }
      40% { transform: rotate(8deg); }
      60% { transform: rotate(-6deg); }
      80% { transform: rotate(4deg); }
    }
    .wiggle { animation: wiggle .7s ease-in-out; }

    /* 小树苗说话气泡 */
    .bubble {
      opacity: 0; transform: translateY(8px) scale(.9); transform-origin: bottom center;
      transition: opacity .3s ease, transform .3s ease;
      pointer-events: none;
    }
    .bubble.show { opacity: 1; transform: translateY(0) scale(1); }

    /* 漂浮的爱心 */
    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(0) scale(.6) rotate(0deg); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-90px) scale(1.1) rotate(18deg); }
    }
    .heart {
      position: absolute; color: #ef7aa0; font-size: 18px;
      animation: floatUp 1.4s ease-out forwards; pointer-events: none;
    }

    /* ====== 拆解步骤卡片：淡入 + 上滑 ====== */
    .step-card {
      opacity: 0; transform: translateY(14px);
      transition: opacity .5s ease, transform .5s ease;
    }
    .step-card.show { opacity: 1; transform: translateY(0); }
    /* 打字机光标 */
    .caret::after { content: '▍'; color: #4ea84e; animation: blink 1s steps(1) infinite; margin-left: 1px; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Toast */
    .toast {
      position: fixed; left: 50%; bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0; transition: opacity .35s ease, transform .35s ease; z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 弹窗 */
    .modal-mask {
      position: fixed; inset: 0; background: rgba(31,60,33,.35);
      backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-mask.show { display: flex; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 等级进度细条 */
    .lv-bar > span { transition: width .6s ease; }

    /* 自定义滚动条（心愿列表） */
    .nice-scroll::-webkit-scrollbar { width: 8px; }
    .nice-scroll::-webkit-scrollbar-thumb { background: #9fd39f; border-radius: 99px; }
  </style>
</head>

<body class="font-round text-forest-700 relative overflow-x-hidden">

  <!-- 背景柔光斑 -->
  <div class="blob" style="width:360px;height:360px;background:#bfe9c4;top:-60px;left:-40px;"></div>
  <div class="blob" style="width:300px;height:300px;background:#a9e0d3;bottom:-80px;right:-30px;"></div>
  <div class="blob" style="width:240px;height:240px;background:#d6f0b8;top:40%;right:10%;"></div>

  <div class="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 py-5 sm:py-8">

    <!-- ============ 顶部栏 Header ============ -->
    <header class="glass rounded-3xl px-5 py-3 flex items-center justify-between gap-3 mb-6">
      <!-- 左：Logo -->
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-forest-400 to-forest-600 grid place-items-center text-white shadow-soft">
          <i class="fa-solid fa-tree text-lg"></i>
        </div>
        <div class="leading-tight">
          <div class="font-bold text-lg text-forest-700 tracking-wide">FocusForest</div>
          <div class="text-[11px] text-forest-500 -mt-0.5">AI 专注自习室</div>
        </div>
      </div>

      <!-- 右：等级 + 心愿瓶 -->
      <div class="flex items-center gap-3">
        <!-- 专注等级 -->
        <div class="hidden sm:flex items-center gap-2 bg-white/50 rounded-full pl-2 pr-3 py-1.5 border border-white/60">
          <span class="w-7 h-7 rounded-full bg-forest-100 grid place-items-center text-forest-600">
            <i class="fa-solid fa-seedling text-sm"></i>
          </span>
          <div class="leading-tight">
            <div class="text-xs font-bold text-forest-700">Lv.3 萌芽学员</div>
            <div class="lv-bar w-20 h-1.5 rounded-full bg-forest-100 mt-1 overflow-hidden">
              <span class="block h-full rounded-full bg-gradient-to-r from-forest-400 to-forest-600" style="width:60%"></span>
            </div>
          </div>
        </div>
        <!-- 心愿瓶入口 -->
        <button id="wishBtn" class="relative w-11 h-11 rounded-2xl bg-white/60 hover:bg-white border border-white/70 grid place-items-center text-forest-600 shadow-sm transition active:scale-95" title="我的心愿瓶">
          <i class="fa-solid fa-bottle-water text-lg"></i>
          <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-pink-400 text-[10px] text-white grid place-items-center font-bold" id="wishCount">0</span>
        </button>
      </div>
    </header>

    <!-- ============ 主体：桌面双栏 / 移动单列 ============ -->
    <main class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- ---------- 左卡片：自律番茄钟 ---------- -->
      <section class="glass rounded-3xl p-6 sm:p-8 flex flex-col items-center">
        <div class="w-full flex items-center gap-2 mb-5 text-forest-700">
          <i class="fa-solid fa-clock text-forest-500"></i>
          <h2 class="font-bold text-lg">自律番茄钟</h2>
          <span class="ml-auto text-xs bg-forest-100 text-forest-600 px-2.5 py-1 rounded-full">专注 25 分钟</span>
        </div>

        <!-- 圆形 SVG 倒计时表盘 -->
        <div class="relative w-60 h-60 sm:w-64 sm:h-64 grid place-items-center">
          <svg viewBox="0 0 220 220" class="w-full h-full -rotate-90">
            <circle cx="110" cy="110" r="96" fill="none" stroke-width="14" class="ring-track" />
            <circle id="ring" cx="110" cy="110" r="96" fill="none" stroke-width="14"
                    class="ring-progress" stroke-dasharray="603.2" stroke-dashoffset="0" />
          </svg>
          <!-- 中心时间文字 -->
          <div class="absolute inset-0 grid place-items-center text-center">
            <div>
              <div id="timeText" class="font-bold text-5xl text-forest-700 tabular-nums">25:00</div>
              <div id="timerState" class="text-xs text-forest-500 mt-1">准备好了吗？</div>
            </div>
          </div>
        </div>

        <!-- 开始 / 暂停 按钮 -->
        <button id="startBtn"
                class="mt-6 px-8 py-3 rounded-2xl bg-gradient-to-r from-forest-400 to-forest-600 text-white font-bold shadow-soft hover:brightness-105 active:scale-95 transition flex items-center gap-2">
          <i id="startIcon" class="fa-solid fa-play"></i>
          <span id="startLabel">开始专注</span>
        </button>

        <!-- 像素风 AI 小树苗（纯 SVG 像素画法，无外部图片） -->
        <div class="mt-7 flex flex-col items-center">
          <!-- 说话气泡 -->
          <div id="bubble" class="bubble glass rounded-2xl px-4 py-2 text-sm text-forest-700 font-semibold mb-2 max-w-[220px] text-center relative">
            <span id="bubbleText">主人加油，我会一直陪着你！</span>
            <span class="absolute left-1/2 -bottom-1.5 w-3 h-3 bg-white/70 rotate-45 -translate-x-1/2"></span>
          </div>

          <!-- 像素树苗容器（点击互动） -->
          <div id="saplingWrap" class="relative">
            <svg id="sapling" class="sapling w-28 h-28" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-label="AI 小树苗">
              <!-- 像素由 JS 注入 -->
            </svg>
          </div>
          <p class="text-[11px] text-forest-500 mt-1.5">轻点小树苗，它会回应你 🌱</p>
        </div>
      </section>

      <!-- ---------- 右卡片：任务拆解与情绪倾诉 ---------- -->
      <section class="glass rounded-3xl p-6 sm:p-8 flex flex-col">
        <div class="flex items-center gap-2 mb-4 text-forest-700">
          <i class="fa-solid fa-feather-pointed text-forest-500"></i>
          <h2 class="font-bold text-lg">任务拆解 · 情绪倾诉</h2>
        </div>

        <textarea id="taskInput" rows="3"
          class="w-full resize-none rounded-2xl bg-white/70 border border-white/70 px-4 py-3 text-forest-700 placeholder:text-forest-400/80 outline-none focus:ring-2 focus:ring-forest-300/70 transition"
          placeholder="今天有什么让你感到压力或拖延的任务？"></textarea>

        <button id="breakBtn"
                class="mt-4 self-start px-6 py-2.5 rounded-2xl bg-gradient-to-r from-forest-400 to-forest-600 text-white font-bold shadow-soft hover:brightness-105 active:scale-95 transition flex items-center gap-2 disabled:opacity-60">
          <i id="breakIcon" class="fa-solid fa-wand-magic-sparkles"></i>
          <span id="breakLabel">AI 帮我拆解</span>
        </button>

        <!-- 拆解步骤将动态插入此处 -->
        <div id="steps" class="mt-5 flex flex-col gap-3 min-h-[10px]"></div>

        <!-- 空状态提示 -->
        <div id="emptyHint" class="mt-3 hidden text-sm text-forest-500 bg-forest-50/70 rounded-2xl px-4 py-3 border border-forest-100">
          <i class="fa-solid fa-leaf mr-1 text-forest-400"></i>
          试试输入「写数学作业很烦」或「明天要考试好紧张」，让 AI 帮你拆成小步～
        </div>
      </section>
    </main>

    <footer class="text-center text-xs text-forest-500/80 mt-8">
      FocusForest · 和你的小树苗一起，慢慢生长 🌿
    </footer>
  </div>

  <!-- ============ 心愿瓶 Modal ============ -->
  <div id="wishModal" class="modal-mask">
    <div class="glass rounded-3xl w-[90%] max-w-md p-6 relative">
      <button id="wishClose" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/60 hover:bg-white grid place-items-center text-forest-600">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="flex items-center gap-2 text-forest-700 mb-1">
        <i class="fa-solid fa-bottle-water text-forest-500"></i>
        <h3 class="font-bold text-lg">我的心愿瓶</h3>
      </div>
      <p class="text-sm text-forest-500 mb-4">把想实现的小愿望装进瓶子，专注成长后慢慢实现它～</p>

      <div class="flex gap-2">
        <input id="wishInput" type="text" maxlength="40"
          class="flex-1 rounded-2xl bg-white/70 border border-white/70 px-4 py-2.5 text-forest-700 placeholder:text-forest-400/80 outline-none focus:ring-2 focus:ring-forest-300/70"
          placeholder="写下一个小心愿…" />
        <button id="wishAdd" class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-forest-400 to-forest-600 text-white font-bold active:scale-95 transition">
          装进瓶子
        </button>
      </div>

      <ul id="wishList" class="mt-4 flex flex-col gap-2 max-h-56 overflow-y-auto nice-scroll"></ul>
      <p id="wishEmpty" class="text-sm text-forest-400 mt-3 text-center">瓶子还是空的，装进第一个心愿吧 💚</p>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast" class="toast glass rounded-2xl px-5 py-3 text-sm font-semibold text-forest-700 flex items-center gap-2">
    <i class="fa-solid fa-circle-check text-forest-500"></i>
    <span id="toastMsg">提示</span>
  </div>

  <!-- ==================== 脚本（原生 JS，无框架） ==================== -->
  <script>
  /* =========================================================
   * 1) 像素风 AI 小树苗 —— 用字符地图生成 SVG 像素块
   *    每个字符代表一种颜色，shape-rendering:crispEdges 保证颗粒感
   * ======================================================= */
  const SPRITE = [
    "......LLLL......",
    ".....LLLLLL.....",
    "....LLLLLLLL....",
    "...LLLLLLLLLL...",
    "...LLXLLLLXLL...",   // X = 眼睛
    "...LLLLLLLLLL...",
    "....LLLmmLL....",     // m = 微笑嘴
    ".....LLLLLL.....",
    ".......SS.......",     // S = 茎
    ".......SS.......",
    "....PPPPPPPP....",     // P = 花盆
    "...PPPPPPPPPP...",
    "...PPPPPPPPPP...",
    "...PPPPPPPPPP...",
    "...PPPPPPPPPP...",
    "....PP....PP....",
  ];
  const COLOR = {
    L: '#8fd17a',  // 叶片
    X: '#2f4a2e',  // 眼睛
    m: '#2f4a2e',  // 嘴
    S: '#5ba85b',  // 茎
    P: '#cf9263',  // 花盆
    '.': null,
  };
  (function drawSapling() {
    const svg = document.getElementById('sapling');
    const ns = 'http://www.w3.org/2000/svg';
    SPRITE.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const c = row[x];
        if (COLOR[c]) {
          const r = document.createElementNS(ns, 'rect');
          r.setAttribute('x', x); r.setAttribute('y', y);
          r.setAttribute('width', 1); r.setAttribute('height', 1);
          r.setAttribute('fill', COLOR[c]);
          svg.appendChild(r);
        }
      }
    });
  })();

  /* =========================================================
   * 2) 番茄钟倒计时
   * ======================================================= */
  const TOTAL = 25 * 60;            // 25 分钟
  let remaining = TOTAL;
  let timerId = null;
  let running = false;

  const CIRC = 2 * Math.PI * 96;    // 周长 ≈ 603.2
  const ring = document.getElementById('ring');
  const timeText = document.getElementById('timeText');
  const timerState = document.getElementById('timerState');
  const startBtn = document.getElementById('startBtn');
  const startIcon = document.getElementById('startIcon');
  const startLabel = document.getElementById('startLabel');
  const bubble = document.getElementById('bubble');

  function fmt(s) {
    const m = String(Math.floor(s / 60)).padStart(2, '0');
    const sec = String(s % 60).padStart(2, '0');
    return `${m}:${sec}`;
  }
  function render() {
    timeText.textContent = fmt(remaining);
    // 剩余比例 → 环形进度条偏移（随时间减少，环逐渐缩短）
    const ratio = remaining / TOTAL;
    ring.style.strokeDashoffset = CIRC * (1 - ratio);
  }
  function tick() {
    if (remaining > 0) {
      remaining--;
      render();
      if (remaining === 0) {
        pause();
        timerState.textContent = '完成啦，休息一下吧 🌿';
        bubble.classList.add('show');
        document.getElementById('bubbleText').textContent = '专注完成！你超棒的，去喝口水吧～';
        toast('🎉 25 分钟专注完成，了不起！');
      }
    }
  }
  function start() {
    running = true;
    startIcon.className = 'fa-solid fa-pause';
    startLabel.textContent = '暂停';
    timerState.textContent = '专注中…小树苗陪着你';
    bubble.classList.add('show');
    document.getElementById('bubbleText').textContent = '主人加油，我会一直陪着你！';
    timerId = setInterval(tick, 1000);
  }
  function pause() {
    running = false;
    startIcon.className = 'fa-solid fa-play';
    startLabel.textContent = '继续专注';
    timerState.textContent = '已暂停';
    clearInterval(timerId);
  }
  startBtn.addEventListener('click', () => {
    // 首次点「开始专注」，之后的点击在 开始/暂停 间切换
    if (remaining === TOTAL && !running) { start(); return; }
    running ? pause() : start();
  });
  render();

  /* =========================================================
   * 3) 点击像素小树苗的互动反馈
   * ======================================================= */
  const ENCOURAGE = [
    '主人加油，我会一直陪着你！',
    '你已经很棒啦，慢慢来～',
    '深呼吸，我们一步一步来 💚',
    '今天也要闪闪发光哦！',
    '别怕困难，小树苗陪你长大 🌱',
    '完成一小步，也是前进呀！',
  ];
  const sapling = document.getElementById('sapling');
  const saplingWrap = document.getElementById('saplingWrap');
  let encIdx = 0;

  sapling.addEventListener('click', () => {
    // 摇一摇
    sapling.classList.remove('wiggle');
    void sapling.offsetWidth;          // 重置动画
    sapling.classList.add('wiggle');
    // 切换鼓励语（气泡常驻显示）
    encIdx = (encIdx + 1) % ENCOURAGE.length;
    document.getElementById('bubbleText').textContent = ENCOURAGE[encIdx];
    bubble.classList.add('show');
    // 冒出爱心
    spawnHearts();
  });
  function spawnHearts() {
    for (let i = 0; i < 4; i++) {
      const h = document.createElement('i');
      h.className = 'heart fa-solid fa-heart';
      h.style.left = (30 + Math.random() * 60) + '%';
      h.style.bottom = '40px';
      h.style.animationDelay = (i * 0.12) + 's';
      saplingWrap.appendChild(h);
      setTimeout(() => h.remove(), 1600);
    }
  }

  /* =========================================================
   * 4) AI 任务拆解 —— 关键词映射 + 打字机动效
   * ======================================================= */
  // 常见关键词 → 贴合的 3 步拆解
  const PLANS = [
    { keys: ['数学', '作业', '写', '题'], steps: [
      '先做 2 道简单的选择题热身，找找手感',
      '翻阅公式卡片，复习这一章的关键知识点',
      '闭眼深呼吸 10 秒，然后开始写第一道题',
    ]},
    { keys: ['考试', '测验', '复习'], steps: [
      '列出最担心的 3 个考点，逐个击破它',
      '用番茄钟做 25 分钟模拟练习，不分心',
      '睡前回顾一遍错题，然后给自己一个拥抱',
    ]},
    { keys: ['读书', '阅读', '看书', '背书'], steps: [
      '先读最感兴趣的那 1 个章节，降低抗拒感',
      '边读边用荧光笔划出打动你的金句',
      '合上书，用 3 句话把内容讲给自己听',
    ]},
    { keys: ['运动', '跑步', '健身', '锻炼'], steps: [
      '换上运动服，先做 2 分钟拉伸唤醒身体',
      '选一首喜欢的歌，跟着节奏动起来',
      '运动后喝口水，夸夸坚持下来的自己',
    ]},
    { keys: ['拖延', '压力', '焦虑', '烦', '累', '不想'], steps: [
      '把手机放到视线之外，深呼吸 3 次 calm down',
      '只做 5 分钟，允许自己一开始不够完美',
      '完成后在「心愿瓶」里写一句鼓励自己的话',
    ]},
  ];
  const DEFAULT_PLAN = [
    '把大任务拆成最小的一步，现在就先迈出它',
    '设定 25 分钟专注时段，期间不碰手机',
    '完成这一步后，给自己一个小奖励吧 🍬',
  ];

  const taskInput = document.getElementById('taskInput');
  const breakBtn = document.getElementById('breakBtn');
  const breakIcon = document.getElementById('breakIcon');
  const breakLabel = document.getElementById('breakLabel');
  const stepsBox = document.getElementById('steps');
  const emptyHint = document.getElementById('emptyHint');

  function pickPlan(text) {
    for (const p of PLANS) {
      if (p.keys.some(k => text.includes(k))) return p.steps;
    }
    return DEFAULT_PLAN;
  }

  // 打字机：逐字显示
  function typeWriter(el, text, speed = 38) {
    el.textContent = '';
    el.classList.add('caret');
    let i = 0;
    const id = setInterval(() => {
      el.textContent += text[i++];
      if (i >= text.length) { clearInterval(id); el.classList.remove('caret'); }
    }, speed);
  }

  breakBtn.addEventListener('click', () => {
    const text = taskInput.value.trim();
    // 空输入 → 友好提示
    if (!text) {
      emptyHint.classList.remove('hidden');
      toast('先跟我说说你的烦恼吧～');
      taskInput.focus();
      return;
    }
    emptyHint.classList.add('hidden');

    // AI 思考中…
    breakBtn.disabled = true;
    breakIcon.className = 'fa-solid fa-spinner fa-spin';
    breakLabel.textContent = 'AI 思考中…';
    stepsBox.innerHTML = '';

    setTimeout(() => {
      const plan = pickPlan(text);
      plan.forEach((step, idx) => {
        // 依次淡入/上滑（错开时间）
        setTimeout(() => {
          const card = document.createElement('div');
          card.className = 'step-card glass rounded-2xl p-4 flex items-start gap-3';
          card.innerHTML = `
            <span class="shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-forest-400 to-forest-600 text-white grid place-items-center font-bold">${idx + 1}</span>
            <p class="step-text text-forest-700 leading-relaxed pt-1"></p>`;
          stepsBox.appendChild(card);
          requestAnimationFrame(() => card.classList.add('show'));
          // 卡片出现后启动打字机
          setTimeout(() => typeWriter(card.querySelector('.step-text'), step), 220);
        }, idx * 480);
      });
      // 恢复按钮
      breakBtn.disabled = false;
      breakIcon.className = 'fa-solid fa-wand-magic-sparkles';
      breakLabel.textContent = '再拆一次';
    }, 700);
  });

  /* =========================================================
   * 5) 心愿瓶 Modal + 列表（内存存储，刷新即清空）
   * ======================================================= */
  const wishBtn = document.getElementById('wishBtn');
  const wishModal = document.getElementById('wishModal');
  const wishClose = document.getElementById('wishClose');
  const wishInput = document.getElementById('wishInput');
  const wishAdd = document.getElementById('wishAdd');
  const wishList = document.getElementById('wishList');
  const wishEmpty = document.getElementById('wishEmpty');
  const wishCount = document.getElementById('wishCount');
  let wishes = [];

  function renderWishes() {
    wishList.innerHTML = '';
    wishEmpty.style.display = wishes.length ? 'none' : 'block';
    wishCount.textContent = wishes.length;
    wishes.forEach((w, i) => {
      const li = document.createElement('li');
      li.className = 'flex items-center gap-2 bg-white/60 rounded-2xl px-4 py-2.5 border border-white/70';
      li.innerHTML = `<i class="fa-solid fa-heart text-pink-400"></i>
                      <span class="flex-1 text-forest-700">${escapeHtml(w)}</span>
                      <button class="text-forest-400 hover:text-red-400 transition" data-i="${i}"><i class="fa-solid fa-xmark"></i></button>`;
      wishList.appendChild(li);
    });
  }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  wishBtn.addEventListener('click', () => wishModal.classList.add('show'));
  wishClose.addEventListener('click', () => wishModal.classList.remove('show'));
  wishModal.addEventListener('click', (e) => { if (e.target === wishModal) wishModal.classList.remove('show'); });

  function addWish() {
    const v = wishInput.value.trim();
    if (!v) { toast('先写一个小愿望吧～'); return; }
    wishes.unshift(v);
    wishInput.value = '';
    renderWishes();
    toast('💚 已装进心愿瓶，加油实现它！');
  }
  wishAdd.addEventListener('click', addWish);
  wishInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addWish(); });
  wishList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-i]');
    if (btn) { wishes.splice(+btn.dataset.i, 1); renderWishes(); }
  });
  renderWishes();

  /* =========================================================
   * 6) Toast 轻提示
   * ======================================================= */
  const toastEl = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  let toastTimer = null;
  function toast(msg) {
    toastMsg.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  </script>
</body>
</html>
