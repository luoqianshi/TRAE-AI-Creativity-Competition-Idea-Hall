<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语言小达人 - Demo演示</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --purple: #9B5DE5;
            --pink: #F15BB5;
            --blue: #00BBF9;
            --green: #00F5D4;
            --orange: #FEE440;
            --bg-light: #FFF9F0;
            --text-dark: #2D3436;
            --text-muted: #636E72;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--purple), var(--blue));
            padding: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Progress Bar */
        .progress-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-bar {
            height: 12px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--green));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--pink));
            color: white;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .tab-btn:not(.active) {
            background: white;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .tab-btn:not(.active):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Game Card */
        .game-card {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .question-counter {
            background: linear-gradient(135deg, var(--purple), var(--blue));
            color: white;
            padding: 10px 24px;
            border-radius: 50px;
            display: inline-block;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .word-display {
            margin: 30px 0;
        }

        .word-image {
            font-size: 120px;
            margin-bottom: 20px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .word-english {
            font-family: 'Fredoka One', cursive;
            font-size: 48px;
            color: var(--purple);
            margin-bottom: 10px;
        }

        .word-chinese {
            font-size: 24px;
            color: var(--text-muted);
        }

        /* Speaker Button */
        .speaker-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--secondary), var(--green));
            color: white;
            font-size: 28px;
            cursor: pointer;
            margin: 20px 0;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4);
        }

        .speaker-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(78, 205, 196, 0.6);
        }

        .speaker-btn:active {
            transform: scale(0.95);
        }

        .speaker-btn.speaking {
            animation: pulse 0.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Answer Options */
        .answer-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin: 30px 0;
        }

        @media (max-width: 600px) {
            .answer-options {
                grid-template-columns: 1fr;
            }
        }

        .answer-btn {
            padding: 20px;
            border: 3px solid #f0f0f0;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            color: var(--text-dark);
        }

        .answer-btn:hover:not(.disabled) {
            border-color: var(--secondary);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(78, 205, 196, 0.3);
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, var(--secondary), var(--green));
            border-color: var(--green);
            color: white;
            animation: correctPulse 0.5s ease;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .answer-btn.wrong {
            background: linear-gradient(135deg, var(--primary), #ff8a8a);
            border-color: var(--primary);
            color: white;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .answer-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Next Button */
        .next-btn {
            padding: 16px 48px;
            border: none;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--pink));
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            margin-top: 20px;
            display: none;
        }

        .next-btn.show {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.6);
        }

        /* Word List Tab */
        .word-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
        }

        .word-item {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .word-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .word-item.learned {
            background: linear-gradient(135deg, var(--secondary), var(--green));
            color: white;
        }

        .word-item-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .word-item-text {
            font-weight: 800;
            font-size: 18px;
        }

        .word-item-status {
            font-size: 12px;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* Awards Tab */
        .awards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .award-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .award-card.locked {
            opacity: 0.4;
            filter: grayscale(1);
        }

        .award-card.unlocked {
            animation: awardGlow 2s ease-in-out infinite;
        }

        @keyframes awardGlow {
            0%, 100% { box-shadow: 0 6px 25px rgba(255, 230, 109, 0.3); }
            50% { box-shadow: 0 6px 35px rgba(255, 230, 109, 0.6); }
        }

        .award-icon {
            font-size: 64px;
            margin-bottom: 12px;
        }

        .award-name {
            font-weight: 800;
            font-size: 16px;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .award-desc {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Record Tab */
        .record-list {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
        }

        .record-item {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .record-item:last-child {
            border-bottom: none;
        }

        .record-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .record-icon.success {
            background: linear-gradient(135deg, var(--secondary), var(--green));
        }

        .record-icon.fail {
            background: linear-gradient(135deg, var(--primary), #ff8a8a);
        }

        .record-info {
            flex: 1;
        }

        .record-word {
            font-weight: 800;
            font-size: 18px;
            color: var(--text-dark);
        }

        .record-time {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Celebration Overlay */
        .celebration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .celebration.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .celebration-content {
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .celebration-icon {
            font-size: 100px;
            margin-bottom: 20px;
            animation: celebrateBounce 1s ease infinite;
        }

        @keyframes celebrateBounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.2) rotate(-10deg); }
            75% { transform: scale(1.2) rotate(10deg); }
        }

        .celebration h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 32px;
            color: var(--purple);
            margin-bottom: 16px;
        }

        .celebration p {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .celebration-btn {
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--secondary), var(--green));
            color: white;
            transition: all 0.3s ease;
        }

        .celebration-btn:hover {
            transform: scale(1.05);
        }

        /* Confetti */
        .confetti {
            position: fixed;
            top: -10px;
            font-size: 24px;
            animation: fall 3s linear forwards;
            z-index: 1001;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
            padding: 60px 20px;
        }

        .start-title {
            font-family: 'Fredoka One', cursive;
            font-size: 42px;
            background: linear-gradient(135deg, var(--primary), var(--purple), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .start-mascot {
            font-size: 150px;
            margin: 30px 0;
            animation: wave 1s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        .start-btn {
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            font-family: 'Nunito', sans-serif;
            font-size: 24px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--pink));
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(255, 107, 107, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 50px rgba(255, 107, 107, 0.6);
        }

        /* Instructions */
        .instructions {
            background: white;
            border-radius: 20px;
            padding: 24px;
            margin-top: 30px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.08);
        }

        .instructions h3 {
            font-size: 20px;
            color: var(--purple);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .instructions ol {
            padding-left: 24px;
            color: var(--text-muted);
            line-height: 2;
        }

        .instructions li {
            font-size: 16px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .footer-brand {
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            color: var(--purple);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <h1>🎮 语言小达人</h1>
        <p style="opacity: 0.9;">3-5岁儿童趣味英语小游戏</p>
        <div class="header-stats">
            <div class="stat-item">
                <span>🏆</span>
                <span id="score">0</span> 积分
            </div>
            <div class="stat-item">
                <span>⭐</span>
                <span id="streak">0</span> 连胜
            </div>
            <div class="stat-item">
                <span>🎯</span>
                <span id="accuracy">0%</span> 正确率
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Progress Bar -->
        <div class="progress-section">
            <div class="progress-header">
                <span style="font-weight: 700;">今日学习进度</span>
                <span style="color: var(--text-muted);" id="progress-text">0 / 10 题目</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('learn')">
                <span>📚</span> 学习
            </button>
            <button class="tab-btn" onclick="switchTab('list')">
                <span>📝</span> 单词本
            </button>
            <button class="tab-btn" onclick="switchTab('awards')">
                <span>🏅</span> 成就
            </button>
            <button class="tab-btn" onclick="switchTab('record')">
                <span>📊</span> 记录
            </button>
        </div>

        <!-- Tab Contents -->
        <div class="tab-content active" id="tab-learn">
            <div class="game-card" id="game-area">
                <!-- Game content will be rendered here -->
            </div>
        </div>

        <div class="tab-content" id="tab-list">
            <div class="game-card">
                <h2 style="margin-bottom: 20px; color: var(--purple);">📝 我的单词本</h2>
                <div class="word-list" id="word-list">
                    <!-- Word items will be rendered here -->
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-awards">
            <div class="game-card">
                <h2 style="margin-bottom: 20px; color: var(--purple);">🏅 我的成就</h2>
                <div class="awards-grid" id="awards-grid">
                    <!-- Awards will be rendered here -->
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-record">
            <div class="game-card">
                <h2 style="margin-bottom: 20px; color: var(--purple);">📊 学习记录</h2>
                <div class="record-list" id="record-list">
                    <!-- Records will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Celebration Overlay -->
    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <div class="celebration-icon" id="celebration-icon">🎉</div>
            <h2 id="celebration-title">太棒了！</h2>
            <p id="celebration-text">恭喜你答对了！</p>
            <button class="celebration-btn" onclick="closeCelebration()">继续学习</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-brand">语言小达人</div>
        <p>让每个孩子都能快乐学英语！</p>
        <p style="margin-top: 10px; opacity: 0.6;">Powered by TRAE Work</p>
    </footer>

    <script>
        // Word Database
        const words = [
            { id: 1, english: 'Apple', chinese: '苹果', emoji: '🍎', audio: 'apple' },
            { id: 2, english: 'Banana', chinese: '香蕉', emoji: '🍌', audio: 'banana' },
            { id: 3, english: 'Cat', chinese: '猫咪', emoji: '🐱', audio: 'cat' },
            { id: 4, english: 'Dog', chinese: '狗狗', emoji: '🐕', audio: 'dog' },
            { id: 5, english: 'Sun', chinese: '太阳', emoji: '☀️', audio: 'sun' },
            { id: 6, english: 'Moon', chinese: '月亮', emoji: '🌙', audio: 'moon' },
            { id: 7, english: 'Star', chinese: '星星', emoji: '⭐', audio: 'star' },
            { id: 8, english: 'Flower', chinese: '花朵', emoji: '🌸', audio: 'flower' },
            { id: 9, english: 'Bird', chinese: '小鸟', emoji: '🐦', audio: 'bird' },
            { id: 10, english: 'Fish', chinese: '小鱼', emoji: '🐟', audio: 'fish' }
        ];

        // Awards
        const awards = [
            { id: 1, name: '初学者', desc: '完成第一次学习', icon: '🌱', condition: (s) => s.total >= 1 },
            { id: 2, name: '连续3题', desc: '连续答对3题', icon: '🔥', condition: (s) => s.streak >= 3 },
            { id: 3, name: '连续5题', desc: '连续答对5题', icon: '⚡', condition: (s) => s.streak >= 5 },
            { id: 4, name: '学习达人', desc: '完成10题学习', icon: '🎯', condition: (s) => s.total >= 10 },
            { id: 5, name: '满分通过', desc: '100%正确率完成学习', icon: '💯', condition: (s) => s.total >= 10 && s.correct === s.total },
            { id: 6, name: '英语小天才', desc: '连续答对10题', icon: '🏆', condition: (s) => s.streak >= 10 }
        ];

        // Game State
        let gameState = {
            currentWordIndex: 0,
            shuffledWords: [],
            score: 0,
            streak: 0,
            total: 0,
            correct: 0,
            learnedWords: [],
            records: [],
            unlockedAwards: []
        };

        // Initialize
        function init() {
            loadFromStorage();
            shuffleWords();
            renderGame();
            renderWordList();
            renderAwards();
            renderRecords();
            updateStats();
        }

        // Storage
        function saveToStorage() {
            localStorage.setItem('languageMasterState', JSON.stringify(gameState));
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('languageMasterState');
            if (saved) {
                gameState = JSON.parse(saved);
            }
        }

        // Shuffle words
        function shuffleWords() {
            gameState.shuffledWords = [...words].sort(() => Math.random() - 0.5);
            gameState.currentWordIndex = 0;
        }

        // Switch Tab
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // Refresh content
            if (tabName === 'list') renderWordList();
            if (tabName === 'awards') renderAwards();
            if (tabName === 'record') renderRecords();
        }

        // Render Game
        function renderGame() {
            if (gameState.total >= 10 && !document.querySelector('.start-screen')) {
                renderComplete();
                return;
            }

            const word = gameState.shuffledWords[gameState.currentWordIndex];
            const wrongOptions = words.filter(w => w.id !== word.id).sort(() => Math.random() - 0.5).slice(0, 3);
            const options = [word, ...wrongOptions].sort(() => Math.random() - 0.5);

            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = `
                <div class="question-counter">第 ${gameState.total + 1} 题</div>
                <div class="word-display">
                    <div class="word-image">${word.emoji}</div>
                    <div class="word-english">${word.english}</div>
                    <div class="word-chinese">这是什么？</div>
                </div>
                <button class="speaker-btn" onclick="speakWord('${word.english}')">
                    🔊
                </button>
                <div class="answer-options">
                    ${options.map(opt => `
                        <button class="answer-btn" onclick="checkAnswer(${opt.id}, ${opt.id === word.id})">
                            ${opt.chinese}
                        </button>
                    `).join('')}
                </div>
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">
                    下一题 →
                </button>
            `;

            updateProgress();
        }

        // Render Complete Screen
        function renderComplete() {
            const accuracy = gameState.total > 0 ? Math.round((gameState.correct / gameState.total) * 100) : 0;
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = `
                <div class="start-screen">
                    <div class="start-mascot">🎓</div>
                    <h2 class="start-title">今日学习完成！</h2>
                    <p style="font-size: 20px; color: var(--text-muted); margin-bottom: 30px;">
                        你今天学习了 ${gameState.total} 个单词<br>
                        正确率：${accuracy}%
                    </p>
                    <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap;">
                        <button class="start-btn" onclick="resetGame()">重新开始</button>
                        <button class="start-btn" style="background: linear-gradient(135deg, var(--secondary), var(--green));" onclick="switchTab('list')">查看单词本</button>
                    </div>
                </div>
            `;
        }

        // Speak Word
        function speakWord(word) {
            const btn = document.querySelector('.speaker-btn');
            btn.classList.add('speaking');

            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            }

            setTimeout(() => btn.classList.remove('speaking'), 1000);
        }

        // Check Answer
        function checkAnswer(selectedId, isCorrect) {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => btn.classList.add('disabled'));

            const clickedBtn = Array.from(buttons).find(btn => btn.onclick.toString().includes(`(${selectedId}`));

            if (isCorrect) {
                clickedBtn.classList.add('correct');
                gameState.correct++;
                gameState.streak++;
                gameState.score += 10 * (1 + Math.floor(gameState.streak / 3) * 0.5);

                // Learn the word
                const word = words.find(w => w.id === selectedId);
                if (!gameState.learnedWords.includes(word.id)) {
                    gameState.learnedWords.push(word.id);
                }

                // Add record
                gameState.records.unshift({
                    word: word.english,
                    result: 'correct',
                    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
                });

                // Show celebration
                if (gameState.streak >= 3) {
                    showCelebration('🎉', '太棒了！', `连续答对 ${gameState.streak} 题！`);
                    createConfetti();
                }
            } else {
                clickedBtn.classList.add('wrong');
                gameState.streak = 0;

                // Add record
                const word = words.find(w => w.id === selectedId);
                gameState.records.unshift({
                    word: words.find(w => w.id === selectedId).english,
                    result: 'wrong',
                    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
                });
            }

            gameState.total++;
            updateStats();
            checkAwards();
            saveToStorage();

            document.getElementById('next-btn').classList.add('show');
        }

        // Next Question
        function nextQuestion() {
            gameState.currentWordIndex++;

            if (gameState.currentWordIndex >= gameState.shuffledWords.length) {
                shuffleWords();
            }

            renderGame();
        }

        // Update Stats
        function updateStats() {
            document.getElementById('score').textContent = Math.floor(gameState.score);
            document.getElementById('streak').textContent = gameState.streak;
            document.getElementById('accuracy').textContent = gameState.total > 0
                ? Math.round((gameState.correct / gameState.total) * 100) + '%'
                : '0%';
        }

        // Update Progress
        function updateProgress() {
            const progress = Math.min((gameState.total / 10) * 100, 100);
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').textContent = `${gameState.total} / 10 题目`;
        }

        // Render Word List
        function renderWordList() {
            const container = document.getElementById('word-list');
            container.innerHTML = words.map(word => `
                <div class="word-item ${gameState.learnedWords.includes(word.id) ? 'learned' : ''}"
                     onclick="speakWord('${word.english}')">
                    <div class="word-item-icon">${word.emoji}</div>
                    <div class="word-item-text">${word.english}</div>
                    <div class="word-item-status">${word.chinese}</div>
                    ${gameState.learnedWords.includes(word.id) ? '<div style="margin-top:8px;">✅ 已掌握</div>' : ''}
                </div>
            `).join('');
        }

        // Render Awards
        function renderAwards() {
            const container = document.getElementById('awards-grid');
            container.innerHTML = awards.map(award => {
                const unlocked = gameState.unlockedAwards.includes(award.id);
                return `
                    <div class="award-card ${unlocked ? 'unlocked' : 'locked'}">
                        <div class="award-icon">${award.icon}</div>
                        <div class="award-name">${award.name}</div>
                        <div class="award-desc">${award.desc}</div>
                    </div>
                `;
            }).join('');
        }

        // Check Awards
        function checkAwards() {
            awards.forEach(award => {
                if (!gameState.unlockedAwards.includes(award.id) && award.condition(gameState)) {
                    gameState.unlockedAwards.push(award.id);
                    showCelebration(award.icon, award.name, award.desc);
                    createConfetti();
                }
            });
        }

        // Render Records
        function renderRecords() {
            const container = document.getElementById('record-list');
            if (gameState.records.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--text-muted);">
                        <div style="font-size: 48px; margin-bottom: 16px;">📝</div>
                        <p>还没有学习记录</p>
                        <p style="font-size: 14px; margin-top: 8px;">开始学习后记录会显示在这里</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = gameState.records.slice(0, 20).map(record => `
                <div class="record-item">
                    <div class="record-icon ${record.result}">
                        ${record.result === 'correct' ? '✅' : '❌'}
                    </div>
                    <div class="record-info">
                        <div class="record-word">${record.word}</div>
                        <div class="record-time">${record.time}</div>
                    </div>
                </div>
            `).join('');
        }

        // Show Celebration
        function showCelebration(icon, title, text) {
            document.getElementById('celebration-icon').textContent = icon;
            document.getElementById('celebration-title').textContent = title;
            document.getElementById('celebration-text').textContent = text;
            document.getElementById('celebration').classList.add('show');
        }

        // Close Celebration
        function closeCelebration() {
            document.getElementById('celebration').classList.remove('show');
        }

        // Create Confetti
        function createConfetti() {
            const emojis = ['🎉', '⭐', '🌟', '✨', '💫', '🎊'];
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4000);
                }, i * 50);
            }
        }

        // Reset Game
        function resetGame() {
            gameState.total = 0;
            gameState.correct = 0;
            gameState.streak = 0;
            gameState.score = 0;
            gameState.currentWordIndex = 0;
            saveToStorage();
            shuffleWords();
            renderGame();
            updateStats();
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
