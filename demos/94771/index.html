<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>时钟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
  height:100%;
  background:#000;
  color:#fff;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.02) 0%,transparent 55%);
  pointer-events:none;
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;
  box-shadow:inset 0 8vh 6vh -4vh #000,inset 0 -8vh 6vh -4vh #000;
  pointer-events:none;
}

.mode-label{
  position:fixed;top:24px;z-index:5;
  font-size:10px;letter-spacing:6px;text-transform:uppercase;
  opacity:.06;font-weight:300;
  transition:opacity .8s;
}
.mode-label:hover{opacity:.2}

.fullscreen-btn{
  position:fixed;top:20px;right:20px;z-index:6;
  width:34px;height:34px;
  background:transparent;border:1px solid rgba(255,255,255,.06);border-radius:50%;
  color:rgba(255,255,255,.12);font-size:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .5s,color .5s,background .5s,transform .5s;
}
.fullscreen-btn:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.5);background:rgba(255,255,255,.04)}
.fullscreen-btn.visible{color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.2)}

.fs-hint{
  position:fixed;bottom:48px;left:50%;z-index:7;
  transform:translateX(-50%);
  font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.08);
  opacity:0;transition:opacity 1s;
  pointer-events:none;
}
.fs-hint.show{opacity:1}

/* ===== DIGIT WHEEL ===== */
.time-display{
  position:relative;z-index:1;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(72px,22vw,260px);
  font-weight:100;
  letter-spacing:14px;
  font-variant-numeric:tabular-nums;
  line-height:1.05;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.985;transform:scale(1.004)}
}

.digit-wheel{
  display:inline-block;position:relative;overflow:hidden;
  height:1.18em;width:.62em;
  vertical-align:baseline;text-align:center;
  margin:0 -.01em;
  text-shadow:0 0 30px rgba(255,255,255,.015),0 0 80px rgba(255,255,255,.025),0 0 150px rgba(255,255,255,.015);
}

.digit-wheel .digit-char{
  position:absolute;left:50%;top:0;
  transform:translateX(-50%);
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transition:opacity .25s ease;
  will-change:opacity;
}
.digit-wheel .digit-char.active{
  opacity:1;
}

/* visual hierarchy: hours→minutes→seconds */
.digit-wheel[data-idx="2"],
.digit-wheel[data-idx="3"]{
  opacity:.72;
}
.digit-wheel[data-idx="4"],
.digit-wheel[data-idx="5"]{
  opacity:.42;
}

.time-sep{
  display:inline-block;
  margin:0 -.02em;
  opacity:.35;
  font-weight:100;
  text-shadow:0 0 60px rgba(255,255,255,.02);
  animation:sep-pulse 1.2s ease-in-out infinite;
}
@keyframes sep-pulse{
  0%,100%{opacity:.35}
  50%{opacity:.08}
}

/* ===== COUNTDOWN EDITOR ===== */
.cd-edit-row{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:0;
  font-size:clamp(72px,22vw,260px);
  font-weight:100;
  line-height:1.05;
  letter-spacing:14px;
}

.cd-unit{display:flex;flex-direction:column;align-items:center;gap:6px}
.cd-arrows{display:flex;gap:18px}

.cd-arrow{
  background:transparent;border:none;
  color:rgba(255,255,255,.12);font-size:12px;
  cursor:pointer;padding:2px 6px;
  transition:color .3s;font-family:inherit;
}
.cd-arrow:hover{color:rgba(255,255,255,.5)}
.cd-arrow:active{color:#fff}

.cd-value{min-width:.68em;text-align:center;text-shadow:0 0 60px rgba(255,255,255,.025)}
.cd-label{font-size:8px;letter-spacing:4px;opacity:.1}

/* ===== CONTROLS ===== */
.controls{
  position:fixed;bottom:52px;z-index:5;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.btn-row{display:flex;gap:6px}

.btn{
  background:transparent;
  border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.2);
  padding:6px 22px;
  border-radius:16px;
  font-size:12px;font-family:inherit;letter-spacing:2px;
  cursor:pointer;
  transition:border-color .5s,color .5s,background .5s,opacity .6s;
}
.btn:hover{border-color:rgba(255,255,255,.3);color:#fff;background:rgba(255,255,255,.04)}
.btn:active{background:rgba(255,255,255,.08)}

.btn-primary{border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.35)}
.btn-primary:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.35);color:#fff}

.btn-danger{border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.15)}
.btn-danger:hover{border-color:rgba(255,180,180,.25);color:rgba(255,180,180,.5)}

/* ---- timer UI hidden ---- */
.timer-hidden{opacity:0 !important;pointer-events:none;transition:opacity .6s ease;}

/* ===== STATS MODAL ===== */
.stats-btn{
  background:transparent;border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.15);font-size:10px;
  padding:5px 14px;border-radius:12px;
  cursor:pointer;font-family:inherit;letter-spacing:1px;
  transition:border-color .4s,color .4s;
}
.stats-btn:hover{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.4)}

.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.72);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .4s ease;
}
.modal-overlay.open{opacity:1;pointer-events:auto}

.modal-panel{
  background:#111;border:1px solid rgba(255,255,255,.06);
  border-radius:16px;padding:32px 28px;
  max-width:460px;width:90vw;max-height:70vh;
  overflow-y:auto;
  transform:translateY(20px);
  transition:transform .4s cubic-bezier(.23,1,.32,1);
}
.modal-overlay.open .modal-panel{transform:translateY(0)}

.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.modal-title{font-size:13px;letter-spacing:4px;opacity:.5;font-weight:300}
.modal-close{
  background:transparent;border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.15);width:28px;height:28px;border-radius:50%;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;transition:border-color .3s,color .3s;
}
.modal-close:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.5)}

.record-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.record-row:last-child{border-bottom:none}

.record-date{font-size:12px;opacity:.35;font-weight:300;min-width:80px}
.record-type{font-size:12px;opacity:.25;font-weight:300;min-width:64px}
.record-duration{font-size:14px;opacity:.6;font-weight:200;letter-spacing:1px}

.record-empty{
  text-align:center;padding:40px 0;
  font-size:12px;opacity:.18;letter-spacing:2px;
}

.modal-footer{
  margin-top:16px;padding-top:16px;
  border-top:1px solid rgba(255,255,255,.04);
  text-align:right;
}
.clear-btn{
  background:transparent;border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.12);font-size:10px;
  padding:4px 14px;border-radius:10px;
  cursor:pointer;font-family:inherit;letter-spacing:1px;
  transition:border-color .3s,color .3s;
}
.clear-btn:hover{border-color:rgba(255,180,180,.2);color:rgba(255,180,180,.4)}

/* ===== FINISH FLASH ===== */
@keyframes finish-flash{
  0%{opacity:1}5%{opacity:.05}10%{opacity:1}15%{opacity:.05}20%{opacity:1}25%{opacity:.05}30%{opacity:.9}100%{opacity:1}
}
.finish-flash{animation:finish-flash 2s ease-in-out 1}

.fade-view{transition:opacity .4s ease,transform .4s cubic-bezier(.23,1,.32,1)}

@media(max-width:480px){
  .controls{bottom:32px}
  .mode-label{top:14px;font-size:9px}
  .fullscreen-btn{top:12px;right:12px;width:28px;height:28px;font-size:10px}
  .fs-hint{bottom:36px;font-size:8px}
  .btn{padding:5px 16px;font-size:11px}
}
@media(min-width:1200px){
  .controls{bottom:68px}
  .time-display{font-size:clamp(72px,22vw,320px)}
  .cd-edit-row{font-size:clamp(72px,22vw,320px)}
}
</style>
</head>
<body>

<div class="mode-label" id="modeLabel">当前时间</div>
<button class="fullscreen-btn" id="fsBtn" title="全屏">⛶</button>
<div class="fs-hint" id="fsHint">按 Esc 退出全屏</div>

<div id="mainView" class="time-display fade-view">
  <span class="digit-wheel" data-idx="0"><span class="digit-char active">0</span></span>
  <span class="digit-wheel" data-idx="1"><span class="digit-char active">0</span></span>
  <span class="time-sep">:</span>
  <span class="digit-wheel" data-idx="2"><span class="digit-char active">0</span></span>
  <span class="digit-wheel" data-idx="3"><span class="digit-char active">0</span></span>
  <span class="time-sep">:</span>
  <span class="digit-wheel second" data-idx="4"><span class="digit-char active">0</span></span>
  <span class="digit-wheel second" data-idx="5"><span class="digit-char active">0</span></span>
</div>

<div class="controls" id="controls"></div>

<div class="modal-overlay" id="statsModal">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title">计时记录</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="recordsList"></div>
    <div class="modal-footer">
      <button class="clear-btn" id="clearRecords">清空记录</button>
    </div>
  </div>
</div>

<script>
const STATE = {
  CLOCK:'clock', MODE_SELECT:'mode_select',
  COUNTUP:'countup', COUNTDOWN_SETUP:'countdown_setup',
  COUNTDOWN:'countdown', COUNTDOWN_FINISH:'countdown_finish'
};

let state = STATE.CLOCK;
let timerInterval = null;
let timerStart = 0;
let elapsedBase = 0;
let countdownRemaining = 0;
let countdownTarget = 0;
let isPaused = false;

const mainView = document.getElementById('mainView');
const modeLabel = document.getElementById('modeLabel');
const controls = document.getElementById('controls');
const fsBtn = document.getElementById('fsBtn');
const fsHint = document.getElementById('fsHint');
const wheels = Array.from(mainView.querySelectorAll('.digit-wheel'));

/* ===== Fullscreen ===== */
let isFullscreen = false;

function updateFsUI(){
  fsBtn.textContent = isFullscreen ? '⤡' : '⛶';
  fsBtn.title = isFullscreen ? '退出全屏' : '全屏';
  fsBtn.classList.toggle('visible', isFullscreen);
  if(isFullscreen){
    fsHint.classList.add('show');
    setTimeout(()=>fsHint.classList.remove('show'), 3000);
  }
}
function toggleFs(){
  if(!isFullscreen){
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}
fsBtn.addEventListener('click', toggleFs);
document.addEventListener('fullscreenchange', ()=>{ isFullscreen=!!document.fullscreenElement; updateFsUI(); });
document.addEventListener('webkitfullscreenchange', ()=>{ isFullscreen=!!document.webkitFullscreenElement; updateFsUI(); });
document.documentElement.addEventListener('dblclick', toggleFs);

/* ===== Keyboard shortcuts ===== */
document.addEventListener('keydown', (e) => {
  if(e.key===' '&&(state===STATE.COUNTUP||state===STATE.COUNTDOWN)){
    e.preventDefault();
    if(isPaused){ resumeTimer(); } else { pauseTimer(); }
    renderControls(state);
  }
});

/* ===== Digit wheel ===== */
function setWheelValue(wheelEl, digit){
  if(digit<0||digit>9) return;
  const s = String(digit);
  /* clean up pending chars */
  wheelEl.querySelectorAll('.digit-char:not(.active)').forEach(el=>el.remove());
  const cur = wheelEl.querySelector('.digit-char.active');
  if(cur && cur.textContent===s) return;

  const isSecond = wheelEl.classList.contains('second');

  const newEl = document.createElement('span');
  newEl.className = 'digit-char';
  newEl.textContent = s;
  wheelEl.appendChild(newEl);

  if(cur){
    cur.classList.remove('active');
    if(isSecond){
      /* crossfade: new fades in while old fades out */
      requestAnimationFrame(() => newEl.classList.add('active'));
      setTimeout(()=>{if(cur.parentNode) cur.remove();}, 300);
    }else{
      /* sequential: wait for fade-out then fade-in */
      setTimeout(()=>{
        if(cur.parentNode) cur.remove();
        newEl.classList.add('active');
      }, 220);
    }
  } else {
    newEl.classList.add('active');
  }
}

function setDisplayTime(h,m,s){
  const digits = [Math.floor(h/10), h%10, Math.floor(m/10), m%10, Math.floor(s/10), s%10];
  wheels.forEach((w,i)=> setWheelValue(w, digits[i]));
}

function renderClock(){
  const d = new Date();
  setDisplayTime(d.getHours(), d.getMinutes(), d.getSeconds());
}

/* ===== Clock loop ===== */
let clockInterval = null;
function startClockLoop(){
  if(clockInterval) return;
  renderClock();
  clockInterval = setInterval(renderClock, 1000);
}
function stopClockLoop(){
  if(clockInterval){ clearInterval(clockInterval); clockInterval=null; }
}

function setWheelsVisible(v){
  wheels.forEach(w=>w.style.display=v?'':'none');
  mainView.querySelectorAll('.time-sep').forEach(s=>s.style.display=v?'':'none');
}

/* ===== Timer ===== */
function tickCountup(){
  const elapsed = elapsedBase + (Date.now() - timerStart);
  const ts = Math.floor(elapsed/1000);
  setDisplayTime(Math.floor(ts/3600), Math.floor((ts%3600)/60), ts%60);
}

function tickCountdown(){
  const remaining = countdownRemaining - (Date.now() - timerStart);
  if(remaining <= 0){
    clearInterval(timerInterval); timerInterval=null;
    setDisplayTime(0,0,0);
    enterState(STATE.COUNTDOWN_FINISH);
    return;
  }
  const ts = Math.ceil(remaining/1000);
  setDisplayTime(Math.floor(ts/3600), Math.floor((ts%3600)/60), ts%60);
}

function startTimer(mode, totalMs){
  stopClockLoop();
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  isPaused = false;
  controls.classList.add('hidden');
  fsBtn.classList.add('timer-hidden');

  if(mode==='countup'){
    elapsedBase = 0;
    timerStart = Date.now();
    timerInterval = setInterval(tickCountup, 200);
  } else {
    countdownTarget = totalMs;
    countdownRemaining = totalMs;
    timerStart = Date.now();
    timerInterval = setInterval(tickCountdown, 200);
  }
}

function pauseTimer(){
  if(!timerInterval || isPaused) return;
  clearInterval(timerInterval); timerInterval=null;
  isPaused = true;
  if(state===STATE.COUNTUP) elapsedBase += Date.now() - timerStart;
  else countdownRemaining -= Date.now() - timerStart;
  controls.classList.remove('hidden');
  fsBtn.classList.remove('timer-hidden');
}

function resumeTimer(){
  if(!isPaused) return;
  isPaused = false;
  timerStart = Date.now();
  timerInterval = setInterval(state===STATE.COUNTUP ? tickCountup : tickCountdown, 200);
  controls.classList.add('hidden');
  fsBtn.classList.add('timer-hidden');
}

function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  isPaused = false;
  elapsedBase = 0;
  countdownRemaining = 0;
  controls.classList.remove('hidden');
  fsBtn.classList.remove('timer-hidden');
}

/* ===== Timer history ===== */
function saveTimerRecord(mode){
  let durationMs = 0;
  if(mode===STATE.COUNTUP){
    durationMs = elapsedBase + (timerInterval&&!isPaused ? Date.now()-timerStart : 0);
  }else{
    durationMs = countdownTarget - countdownRemaining - (timerInterval&&!isPaused ? Date.now()-timerStart : 0);
  }
  if(durationMs<1000) return;
  const now = new Date();
  const d = [now.getFullYear(),'-',String(now.getMonth()+1).padStart(2,'0'),'-',String(now.getDate()).padStart(2,'0')].join('');
  const t = [String(now.getHours()).padStart(2,'0'),':',String(now.getMinutes()).padStart(2,'0')].join('');
  const sec = Math.floor(durationMs/1000);
  const hh = Math.floor(sec/3600), mm = Math.floor((sec%3600)/60), ss = sec%60;
  const ds = hh>0 ? hh+'小时'+mm+'分'+ss+'秒' : mm>0 ? mm+'分'+ss+'秒' : ss+'秒';
  const records = JSON.parse(localStorage.getItem('timerRecords')||'[]');
  records.unshift({date:d,time:t,type:mode===STATE.COUNTUP?'正向计时':'倒数计时',duration:ds,timestamp:now.getTime()});
  if(records.length>200) records.length=200;
  localStorage.setItem('timerRecords',JSON.stringify(records));
}

function loadTimerRecords(){
  return JSON.parse(localStorage.getItem('timerRecords')||'[]');
}

function renderStatsModal(){
  const list = document.getElementById('recordsList');
  const records = loadTimerRecords();
  if(!records.length){
    list.innerHTML = '<div class="record-empty">暂无记录</div>';
    return;
  }
  list.innerHTML = records.map(r=>
    '<div class="record-row">'+
      '<span class="record-date">'+r.date+'</span>'+
      '<span class="record-type">'+r.type+'</span>'+
      '<span class="record-duration">'+r.duration+'</span>'+
    '</div>'
  ).join('');
}

function toggleStatsModal(open){
  const m = document.getElementById('statsModal');
  if(open){ renderStatsModal(); m.classList.add('open'); }
  else m.classList.remove('open');
}

/* ===== Countdown editor ===== */
const cdState = { hours:0, minutes:1, seconds:0 };

function buildCountdownEditor(){
  const outer = document.createElement('div');
  outer.className = 'cd-edit-row fade-view';
  outer.id = 'cdEditor';
  const data = [
    { v:cdState.hours, unit:'H', max:99, field:'hours' },
    { v:cdState.minutes, unit:'MIN', max:59, field:'minutes' },
    { v:cdState.seconds, unit:'SEC', max:59, field:'seconds' }
  ];
  data.forEach((item,i)=>{
    const unit = document.createElement('div');
    unit.className = 'cd-unit';

    const label = document.createElement('div');
    label.className = 'cd-label';
    label.textContent = item.unit;

    const val = document.createElement('div');
    val.className = 'cd-value';
    val.textContent = String(item.v).padStart(2,'0');

    const arrows = document.createElement('div');
    arrows.className = 'cd-arrows';

    const up = document.createElement('button');
    up.className = 'cd-arrow';
    up.textContent = '▲';
    up.addEventListener('click', ()=>{
      cdState[item.field] = Math.min(cdState[item.field]+1, item.max);
      val.textContent = String(cdState[item.field]).padStart(2,'0');
    });

    const down = document.createElement('button');
    down.className = 'cd-arrow';
    down.textContent = '▼';
    down.addEventListener('click', ()=>{
      cdState[item.field] = Math.max(cdState[item.field]-1, 0);
      val.textContent = String(cdState[item.field]).padStart(2,'0');
    });

    arrows.appendChild(up); arrows.appendChild(down);
    unit.appendChild(label); unit.appendChild(val); unit.appendChild(arrows);
    outer.appendChild(unit);

    if(i<2){
      const sep = document.createElement('span');
      sep.className = 'time-sep';
      sep.style.cssText = 'opacity:.35';
      sep.textContent = ':';
      outer.appendChild(sep);
    }
  });
  return outer;
}

function getCountdownTotalMs(){
  return ((cdState.hours*3600)+(cdState.minutes*60)+cdState.seconds)*1000;
}

/* ===== State ===== */
function enterState(newState){
  const prev = state;
  state = newState;
  renderControls(newState);
  renderMainView(newState, prev);
}

function renderMainView(newState, prev){
  if(prev===STATE.COUNTUP||prev===STATE.COUNTDOWN) saveTimerRecord(prev);
  mainView.classList.remove('finish-flash');

  const ee = document.getElementById('cdEditor');
  if(ee) ee.remove();

  if(newState===STATE.COUNTDOWN_SETUP){
    setWheelsVisible(false);
    const editor = buildCountdownEditor();
    mainView.parentNode.insertBefore(editor, mainView.nextSibling);
  } else {
    setWheelsVisible(true);
  }
  modeLabel.style.display = 'block';

  const labels = {};
  labels[STATE.CLOCK]='当前时间'; labels[STATE.MODE_SELECT]='选择模式';
  labels[STATE.COUNTUP]='正向计时'; labels[STATE.COUNTDOWN_SETUP]='设定时间';
  labels[STATE.COUNTDOWN]='倒数计时'; labels[STATE.COUNTDOWN_FINISH]='时间到';
  modeLabel.textContent = labels[newState]||'';

  if(newState===STATE.CLOCK) startClockLoop();
  else if(newState!==STATE.MODE_SELECT) stopClockLoop();

  if(newState===STATE.COUNTUP){
    stopTimer(); setDisplayTime(0,0,0); startTimer('countup');
  }
  if(newState===STATE.COUNTDOWN){
    const ms = getCountdownTotalMs();
    if(ms<=0) return;
    stopTimer();
    const ts = Math.ceil(ms/1000);
    setDisplayTime(Math.floor(ts/3600), Math.floor((ts%3600)/60), ts%60);
    startTimer('countdown', ms);
  }
  if(newState===STATE.COUNTDOWN_FINISH){
    stopTimer(); setDisplayTime(0,0,0);
    mainView.classList.add('finish-flash');
  }
  if(newState===STATE.CLOCK){ stopTimer(); }
}

function buildBtnRow(bts){
  const row = document.createElement('div');
  row.className = 'btn-row';
  bts.forEach(([label,cls,handler])=>{
    const b = createBtn(label, cls);
    b.addEventListener('click', handler);
    row.appendChild(b);
  });
  return row;
}

function renderControls(s){
  controls.innerHTML = '';
  switch(s){
    case STATE.CLOCK:
      controls.appendChild(buildBtnRow([['开始','btn-primary',()=>enterState(STATE.MODE_SELECT)]]));
      controls.appendChild(buildBtnRow([['记录','stats-btn',()=>toggleStatsModal(true)]]));
      break;
    case STATE.MODE_SELECT:
      controls.appendChild(buildBtnRow([['正向','',()=>enterState(STATE.COUNTUP)],['倒数','',()=>enterState(STATE.COUNTDOWN_SETUP)]]));
      controls.appendChild(buildBtnRow([['返回','',()=>enterState(STATE.CLOCK)]]));
      break;
    case STATE.COUNTUP:
      controls.classList.add('hidden');
      controls.appendChild(buildBtnRow(
        isPaused
          ? [['继续','btn-primary',()=>{resumeTimer();renderControls(STATE.COUNTUP);}],['重置','btn-danger',()=>enterState(STATE.CLOCK)]]
          : [['暂停','',()=>{pauseTimer();renderControls(STATE.COUNTUP);}],['停止','btn-danger',()=>enterState(STATE.CLOCK)]]
      ));
      break;
    case STATE.COUNTDOWN_SETUP:
      controls.appendChild(buildBtnRow([['开始计时','btn-primary',()=>{if(getCountdownTotalMs()>0)enterState(STATE.COUNTDOWN);}],['返回','',()=>{cdState.hours=0;cdState.minutes=1;cdState.seconds=0;enterState(STATE.CLOCK);}]]));
      break;
    case STATE.COUNTDOWN:
      controls.classList.add('hidden');
      controls.appendChild(buildBtnRow(
        isPaused
          ? [['继续','btn-primary',()=>{resumeTimer();renderControls(STATE.COUNTDOWN);}],['重置','btn-danger',()=>enterState(STATE.CLOCK)]]
          : [['暂停','',()=>{pauseTimer();renderControls(STATE.COUNTDOWN);}],['停止','btn-danger',()=>enterState(STATE.CLOCK)]]
      ));
      break;
    case STATE.COUNTDOWN_FINISH:
      controls.appendChild(buildBtnRow([['重置','btn-primary',()=>enterState(STATE.CLOCK)]]));
      break;
  }
}

function createBtn(text, className){
  const el = document.createElement('button');
  el.className = 'btn'+(className?' '+className:'');
  el.textContent = text;
  return el;
}

// stats modal
document.getElementById('modalClose').addEventListener('click',()=>toggleStatsModal(false));
document.getElementById('statsModal').addEventListener('click',(e)=>{if(e.target===e.currentTarget)toggleStatsModal(false);});
document.getElementById('clearRecords').addEventListener('click',()=>{
  if(confirm('确定清空所有计时记录？')){
    localStorage.removeItem('timerRecords');
    renderStatsModal();
  }
});

enterState(STATE.CLOCK);
</script>
</body>
