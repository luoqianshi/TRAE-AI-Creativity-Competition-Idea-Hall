<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="消消乐">
    <meta name="application-name" content="消消乐">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#667eea">
    <meta name="msapplication-navbutton-color" content="#667eea">
    <meta name="apple-mobile-web-app-status-bar-style" content="#667eea">
    <meta name="format-detection" content="telephone=no">
    <title>消消乐小游戏</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>
    <div class="game-container">
        <!-- 游戏头部 -->
        <header class="game-header">
            <h1>🎮 消消乐</h1>
            <div class="game-controls">
                <select id="difficulty" class="difficulty-select">
                    <option value="easy">初级</option>
                    <option value="medium" selected>中级</option>
                    <option value="hard">高级</option>
                </select>
                <button id="startBtn" class="btn btn-primary">开始游戏</button>
                <button id="rulesBtn" class="btn btn-secondary">游戏规则</button>
                <button id="leaderboardBtn" class="btn btn-secondary">排行榜</button>
            </div>
        </header>

        <!-- 游戏信息面板 -->
        <div class="game-info">
            <div class="info-item">
                <span class="label">分数</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="info-item">
                <span class="label">时间</span>
                <span id="timer" class="value">60</span>
            </div>
            <div class="info-item">
                <span class="label">连击</span>
                <span id="combo" class="value">0x</span>
            </div>
            <div class="info-item">
                <span class="label">等级</span>
                <span id="level" class="value">1</span>
            </div>
        </div>

        <!-- 游戏区域 -->
        <div class="game-board-wrapper">
            <div id="gameBoard" class="game-board"></div>
        </div>

        <!-- 游戏提示 -->
        <div id="gameHint" class="game-hint"></div>

        <!-- 游戏结束弹窗 -->
        <div id="gameOverModal" class="modal">
            <div class="modal-content">
                <h2>🎉 游戏结束!</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <input type="text" id="playerName" placeholder="输入你的名字" maxlength="10">
                <div class="modal-buttons">
                    <button id="saveScoreBtn" class="btn btn-primary">保存分数</button>
                    <button id="restartBtn" class="btn btn-secondary">再玩一次</button>
                </div>
            </div>
        </div>

        <!-- 规则弹窗 -->
        <div id="rulesModal" class="modal">
            <div class="modal-content">
                <h2>📖 游戏规则</h2>
                <ul>
                    <li>点击选择一个游戏元素，再点击相邻的元素进行交换</li>
                    <li>当3个或更多相同元素连成一线时，它们会被消除并获得分数</li>
                    <li>消除后，上方的元素会下落填充空位，新元素从顶部生成</li>
                    <li>连续消除可获得连击奖励</li>
                    <li>在规定时间内获取尽可能高的分数</li>
                    <li>不同难度级别具有不同的网格大小和时间限制</li>
                </ul>
                <button id="closeRulesBtn" class="btn btn-primary">关闭</button>
            </div>
        </div>

        <!-- 排行榜弹窗 -->
        <div id="leaderboardModal" class="modal">
            <div class="modal-content">
                <h2>🏆 排行榜</h2>
                <div id="leaderboardList" class="leaderboard-list">
                    <p>暂无记录</p>
                </div>
                <button id="closeLeaderboardBtn" class="btn btn-primary">关闭</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then((registration) => {
              console.log('ServiceWorker registered:', registration.scope);
            })
            .catch((error) => {
              console.log('ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
</body>
</html>
