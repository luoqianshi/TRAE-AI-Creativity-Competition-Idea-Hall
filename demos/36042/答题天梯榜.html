<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>课堂答题段位天梯榜</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ff6f61;
        }
        #rollDisplay {
            font-size: 2em;
            margin: 20px;
            color: #2a9d8f;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 15px 32px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 12px;
        }
        button:hover {
            background-color: #45a049;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>课堂答题段位天梯榜</h1>
    <div id="rollDisplay">点击开始抽问</div>
    <button onclick="startRoll()">开始抽问</button>

    <table id="recordTable">
        <tr>
            <th>学号</th>
            <th>姓名</th>
            <th>积分</th>
            <th>段位</th>
            <th>第1次</th>
            <th>第2次</th>
            <th>第3次</th>
            <th>第4次</th>
            <th>第5次</th>
            <th>第6次</th>
            <th>第7次</th>
            <th>第8次</th>
            <th>第9次</th>
            <th>第10次</th>
        </tr>
        <!-- 学生数据将由JavaScript动态生成 -->
    </table>

    <script>
        const students = [
            { id: 1, name: '沙孟钰' }, { id: 2, name: '蔡文昊' }, { id: 3, name: '史可一' },
            { id: 4, name: '李强' }, { id: 5, name: '卢冬清' }, { id: 6, name: '蒋正轩' },
            { id: 7, name: '万宇航' }, { id: 8, name: '朱子豪' }, { id: 9, name: '洪连景' },
            { id: 10, name: '陈宇豪' }, { id: 11, name: '陈昊天' }, { id: 12, name: '刘佳翔' },
            { id: 13, name: '谭展羿' }, { id: 14, name: '张立洋' }, { id: 15, name: '吴晨源' },
            { id: 16, name: '王俊宇' }, { id: 17, name: '单楷峰' }, { id: 18, name: '潘越' },
            { id: 19, name: '陈嘉楠' }, { id: 20, name: '项子豪' }, { id: 21, name: '杨佳承' },
            { id: 22, name: '曹瑞阳' }, { id: 23, name: '石巧龙' }, { id: 24, name: '李泽' },
            { id: 25, name: '周宁' }, { id: 26, name: '王杰' }, { id: 27, name: '单颖' },
            { id: 28, name: '崔凌菲' }, { id: 29, name: '王湘涵' }, { id: 30, name: '张芸' },
            { id: 31, name: '顾子烨' }, { id: 32, name: '黄新奇' }, { id: 33, name: '杨思媛' },
            { id: 34, name: '张联坊' }, { id: 35, name: '陈星雨' }, { id: 36, name: '翁朝悦' },
            { id: 37, name: '王梦婷' }, { id: 38, name: '朱欣妍' }, { id: 39, name: '童桂灿' },
            { id: 40, name: '王春鸿' }, { id: 41, name: '朱书宁' }
        ];

        let rolling;
        let rollInterval;
        const rollDisplay = document.getElementById('rollDisplay');
        const recordTable = document.getElementById('recordTable');

        function startRoll() {
            if (rolling) {
                clearInterval(rollInterval);
                rolling = false;
                updateRecords(rollDisplay.textContent);
            } else {
                rolling = true;
                rollInterval = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * students.length);
                    rollDisplay.textContent = `${students[randomIndex].id} - ${students[randomIndex].name}`;
                }, 100);
            }
        }

        function updateRecords(studentInfo) {
            const [id, name] = studentInfo.split(' - ');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${id}</td>
                <td>${name}</td>
                <td>0</td>
                <td>黑铁段位</td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${id})"></td>
            `;
            recordTable.appendChild(row);
        }

        function updateScore(checkbox, id) {
            const row = checkbox.parentElement.parentElement;
            const scoreCell = row.cells[2];
            let score = parseInt(scoreCell.textContent);
            score += checkbox.checked ? 10 : -10;
            scoreCell.textContent = score;
            updateRank(row, score);
        }

        function updateRank(row, score) {
            const rankCell = row.cells[3];
            const ranks = ["黑铁段位","青铜段位", "白银段位", "黄金段位", "铂金段位", "钻石段位", "星耀段位", "最强王者", "非凡王者", "绝世王者"];
            const rankIndex = Math.min(Math.floor(score / 10), ranks.length - 1);
            rankCell.textContent = ranks[rankIndex];
        }

        // 初始化学生记录
        students.forEach(student => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${student.id}</td>
                <td>${student.name}</td>
                <td>0</td>
                <td>黑铁段位</td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
                <td><input type="checkbox" onchange="updateScore(this, ${student.id})"></td>
            `;
            recordTable.appendChild(row);
        });
    </script>
</body>
</html>
