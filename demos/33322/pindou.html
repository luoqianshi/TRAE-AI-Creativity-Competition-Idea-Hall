<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思想画布 - 创意绘画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
    overflow: hidden;
    user-select: none;
  }

  /* ========== 页面切换 ========== */
  .page { display: none; position: fixed; inset: 0; }
  .page.active { display: block; }

  /* ========== 主页 - 思想之墙 ========== */
  #wallPage { background: #0a0a0a; }
  
  .welcome {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }
  .welcome h1 { font-size: 48px; color: #3a3a3a; margin-bottom: 16px; font-weight: 300; }
  .welcome p { font-size: 16px; color: #4a4a4a; }
  
  .artwork-card {
    position: absolute;
    cursor: move;
    transition: transform 0.1s;
  }
  .artwork-card:hover { z-index: 100; }
  .artwork-card img {
    max-width: 280px;
    max-height: 200px;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .artwork-card .label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 8px 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    border-radius: 0 0 8px 8px;
    font-size: 13px;
    color: #fff;
  }
  .artwork-card .actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .artwork-card:hover .actions { opacity: 1; }
  .artwork-card .actions button {
    width: 28px;
    height: 28px;
    border: none;
    border-radius: 6px;
    background: rgba(30,30,30,0.9);
    color: #aaa;
    cursor: pointer;
    font-size: 12px;
  }
  .artwork-card .actions button:hover { background: #e8a849; color: #000; }
  .artwork-card .actions button.del:hover { background: #ef4444; color: #fff; }

  /* ========== 左下角菜单 ========== */
  .menu-btn {
    position: fixed;
    bottom: 24px;
    left: 24px;
    padding: 12px 20px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 500;
  }
  .menu-btn:hover { border-color: #e8a849; }
  
  .dropdown {
    position: fixed;
    bottom: 80px;
    left: 24px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 8px;
    display: none;
    min-width: 160px;
    z-index: 500;
  }
  .dropdown.open { display: block; }
  .dropdown button {
    display: block;
    width: 100%;
    padding: 10px 16px;
    background: none;
    border: none;
    border-radius: 8px;
    color: #ccc;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .dropdown button:hover { background: #2a2a2a; color: #fff; }

  /* ========== 右下角新建按钮 ========== */
  .new-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #e8a849;
    border: none;
    color: #000;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(232,168,73,0.3);
    transition: all 0.2s;
    z-index: 500;
  }
  .new-btn:hover { transform: scale(1.1); }

  /* ========== 画布页面 ========== */
  #canvasPage { background: #0d0d0d; }
  
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
    z-index: 100;
  }
  .topbar button {
    padding: 8px 16px;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: #888;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.15s;
  }
  .topbar button:hover { color: #fff; }
  .topbar .save-btn {
    background: #e8a849;
    color: #000;
    font-weight: 500;
  }
  .topbar .save-btn:hover { background: #f3b85c; color: #000; }
  .topbar .clear-btn:hover { color: #ef4444; }
  .topbar input {
    padding: 8px 12px;
    background: #0d0d0d;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    width: 200px;
  }
  .topbar input:focus { outline: none; border-color: #e8a849; }

  .tools-left {
    position: fixed;
    left: 24px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: rgba(26,26,26,0.9);
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    z-index: 100;
  }
  .tools-left button {
    width: 40px;
    height: 40px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: #888;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tools-left button:hover { background: #2a2a2a; color: #fff; }
  .tools-left button.active { background: rgba(232,168,73,0.2); color: #e8a849; border-color: rgba(232,168,73,0.3); }

  .tools-top {
    position: fixed;
    left: 50%;
    top: 80px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 24px;
    background: rgba(26,26,26,0.9);
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    z-index: 100;
  }
  .color-palette {
    display: flex;
    gap: 8px;
  }
  .color-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #3a3a3a;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .color-btn:hover { transform: scale(1.2); }
  .color-btn.active { border-color: #e8a849; }
  
  .size-control {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #888;
  }
  .size-control input[type="range"] {
    width: 100px;
    accent-color: #e8a849;
  }
  .size-value { color: #fff; min-width: 24px; }

  .canvas-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
  canvas {
    background: #000;
    border-radius: 12px;
    border: 1px solid #2a2a2a;
    cursor: crosshair;
    box-shadow: 0 16px 64px rgba(0,0,0,0.5);
  }

  /* ========== 画廊页面 ========== */
  #galleryPage { background: #0d0d0d; overflow-y: auto; }
  
  .gallery-header {
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 48px;
    background: rgba(13,13,13,0.95);
    border-bottom: 1px solid #2a2a2a;
    z-index: 100;
  }
  .gallery-header button {
    padding: 8px 16px;
    background: transparent;
    border: none;
    color: #888;
    font-size: 14px;
    cursor: pointer;
  }
  .gallery-header button:hover { color: #fff; }
  .gallery-header h1 { font-size: 22px; font-weight: 400; }
  .gallery-header .count { color: #666; font-size: 14px; }

  .gallery-grid {
    padding: 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .gallery-item {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .gallery-item:hover { border-color: #3a3a3a; transform: translateY(-2px); }
  .gallery-item img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #000;
  }
  .gallery-item .info { padding: 16px; }
  .gallery-item .info h3 { font-size: 15px; margin-bottom: 12px; font-weight: 500; }
  .gallery-item .info .btns { display: flex; gap: 8px; }
  .gallery-item .info button {
    padding: 6px 12px;
    background: #2a2a2a;
    border: none;
    border-radius: 6px;
    color: #888;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .gallery-item .info button:hover { color: #fff; }
  .gallery-item .info button.export:hover { background: #22c55e; color: #fff; }
  .gallery-item .info button.delete:hover { background: #ef4444; color: #fff; }
  
  .empty-gallery {
    padding: 100px;
    text-align: center;
    color: #4a4a4a;
  }

  /* ========== 设置页面 ========== */
  #settingsPage { background: #0d0d0d; overflow-y: auto; }
  
  .settings-content {
    max-width: 600px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  .settings-content h1 { font-size: 24px; margin-bottom: 32px; font-weight: 400; }
  .settings-content .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .settings-content .card h2 { font-size: 16px; margin-bottom: 12px; font-weight: 500; }
  .settings-content .card p { color: #888; font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- 主页 - 思想之墙 -->
<div id="wallPage" class="page active">
  <div class="welcome" id="welcome">
    <h1>思想画布</h1>
    <p>点击右下角 + 开始创作</p>
  </div>
  
  <!-- 画作容器 -->
  <div id="artworksContainer"></div>
  
  <!-- 左下角菜单 -->
  <button class="menu-btn" id="menuBtn">▦ 画墙</button>
  <div class="dropdown" id="dropdown">
    <button onclick="showPage('gallery')">🖼 创意走廊</button>
    <button onclick="showPage('settings')">⚙ 设置</button>
  </div>
  
  <!-- 右下角新建按钮 -->
  <button class="new-btn" onclick="openCanvas()">+</button>
</div>

<!-- 画布页面 -->
<div id="canvasPage" class="page">
  <div class="topbar">
    <button onclick="showPage('wall')">← 返回</button>
    <input type="text" id="artworkName" placeholder="作品名称...">
    <div>
      <button class="clear-btn" onclick="clearCanvas()">清空</button>
      <button class="save-btn" onclick="saveArtwork()">保存</button>
    </div>
  </div>
  
  <div class="tools-left">
    <button id="toolBrush" class="active" onclick="setTool('brush')" title="画笔">✏️</button>
    <button id="toolEraser" onclick="setTool('eraser')" title="橡皮擦">🧹</button>
  </div>
  
  <div class="tools-top">
    <div class="color-palette" id="colorPalette"></div>
    <div class="size-control">
      <span>大小</span>
      <input type="range" id="brushSize" min="1" max="50" value="5">
      <span class="size-value" id="sizeValue">5</span>
    </div>
  </div>
  
  <div class="canvas-container">
    <canvas id="paintCanvas" width="800" height="600"></canvas>
  </div>
</div>

<!-- 画廊页面 -->
<div id="galleryPage" class="page">
  <div class="gallery-header">
    <button onclick="showPage('wall')">← 返回</button>
    <h1>创意走廊</h1>
    <span class="count" id="galleryCount">共 0 幅</span>
  </div>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<!-- 设置页面 -->
<div id="settingsPage" class="page">
  <div class="gallery-header">
    <button onclick="showPage('wall')">← 返回</button>
    <h1>设置</h1>
    <span></span>
  </div>
  <div class="settings-content">
    <div class="card">
      <h2>关于</h2>
      <p><strong>思想画布 v1.0</strong></p>
      <p style="margin-top:8px;">创意绘画与艺术展览的完美结合</p>
      <p style="margin-top:16px;color:#555;">数据自动保存在浏览器中</p>
    </div>
  </div>
</div>

<script>
// ========== 全局状态 ==========
let artworks = [];
let currentTool = 'brush';
let currentColor = '#ffffff';
let currentSize = 5;
let isDrawing = false;
let lastX = 0, lastY = 0;
let canvas, ctx;

const colors = ['#ffffff', '#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#8b5cf6', '#ec4899'];

// ========== 初始化 ==========
function init() {
  loadArtworks();
  initColorPalette();
  initCanvas();
  renderWall();
  setupMenu();
  
  document.getElementById('brushSize').addEventListener('input', (e) => {
    currentSize = parseInt(e.target.value);
    document.getElementById('sizeValue').textContent = currentSize;
  });
}

// ========== 颜色面板 ==========
function initColorPalette() {
  const palette = document.getElementById('colorPalette');
  palette.innerHTML = '';
  colors.forEach((color, i) => {
    const btn = document.createElement('div');
    btn.className = 'color-btn' + (i === 0 ? ' active' : '');
    btn.style.backgroundColor = color;
    btn.onclick = () => {
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentColor = color;
      if (currentTool === 'eraser') setTool('brush');
    };
    palette.appendChild(btn);
  });
}

// ========== 画布逻辑 ==========
function initCanvas() {
  canvas = document.getElementById('paintCanvas');
  ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);
  
  // 触摸支持
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    startDraw({ clientX: t.clientX, clientY: t.clientY });
  });
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    draw({ clientX: t.clientX, clientY: t.clientY });
  });
  canvas.addEventListener('touchend', stopDraw);
}

function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height)
  };
}

function startDraw(e) {
  isDrawing = true;
  const pos = getCanvasPos(e);
  lastX = pos.x;
  lastY = pos.y;
  
  // 画一个点
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, currentSize / 2, 0, Math.PI * 2);
  ctx.fillStyle = currentTool === 'eraser' ? '#000000' : currentColor;
  ctx.fill();
}

function draw(e) {
  if (!isDrawing) return;
  const pos = getCanvasPos(e);
  
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.x, pos.y);
  ctx.strokeStyle = currentTool === 'eraser' ? '#000000' : currentColor;
  ctx.lineWidth = currentSize;
  ctx.stroke();
  
  lastX = pos.x;
  lastY = pos.y;
}

function stopDraw() {
  isDrawing = false;
}

function setTool(tool) {
  currentTool = tool;
  document.getElementById('toolBrush').classList.toggle('active', tool === 'brush');
  document.getElementById('toolEraser').classList.toggle('active', tool === 'eraser');
}

function clearCanvas() {
  if (!confirm('确定清空画布吗？')) return;
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function openCanvas() {
  showPage('canvas');
  setTimeout(() => {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    document.getElementById('artworkName').value = '';
  }, 50);
}

function saveArtwork() {
  const name = document.getElementById('artworkName').value.trim() || '作品 ' + (artworks.length + 1);
  const imageData = canvas.toDataURL('image/png');
  
  const artwork = {
    id: Date.now() + '_' + Math.random().toString(36).substr(2, 5),
    name,
    imageData,
    x: 100 + Math.random() * 400,
    y: 100 + Math.random() * 200
  };
  
  artworks.push(artwork);
  saveToStorage();
  renderWall();
  showPage('wall');
}

// ========== 存储 ==========
function saveToStorage() {
  try {
    localStorage.setItem('artworks', JSON.stringify(artworks));
  } catch (e) {
    console.warn('存储空间不足，无法保存');
    if (artworks.length > 10) {
      alert('存储空间不足，请删除一些旧作品');
    }
  }
}

function loadArtworks() {
  const saved = localStorage.getItem('artworks');
  if (saved) {
    try { artworks = JSON.parse(saved); }
    catch (e) { artworks = []; }
  }
}

// ========== 渲染主页 ==========
function renderWall() {
  const container = document.getElementById('artworksContainer');
  const welcome = document.getElementById('welcome');
  container.innerHTML = '';
  
  welcome.style.display = artworks.length === 0 ? 'block' : 'none';
  
  artworks.forEach(artwork => {
    const card = document.createElement('div');
    card.className = 'artwork-card';
    card.style.left = artwork.x + 'px';
    card.style.top = artwork.y + 'px';
    
    card.innerHTML = `
      <img src="${artwork.imageData}" alt="${artwork.name}">
      <div class="label">${artwork.name}</div>
      <div class="actions">
        <button title="导出" onclick="event.stopPropagation();exportArtwork('${artwork.id}')">↓</button>
        <button class="del" title="删除" onclick="event.stopPropagation();deleteArtwork('${artwork.id}')">✕</button>
      </div>
    `;
    
    // 拖拽
    let dragging = false;
    let startX, startY, origX, origY;
    
    card.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      origX = artwork.x;
      origY = artwork.y;
      card.style.zIndex = 500;
    });
    
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      artwork.x = origX + (e.clientX - startX);
      artwork.y = origY + (e.clientY - startY);
      card.style.left = artwork.x + 'px';
      card.style.top = artwork.y + 'px';
    });
    
    document.addEventListener('mouseup', () => {
      if (dragging) {
        dragging = false;
        card.style.zIndex = '';
        saveToStorage();
      }
    });
    
    container.appendChild(card);
  });
}

// ========== 画廊渲染 ==========
function renderGallery() {
  const grid = document.getElementById('galleryGrid');
  const count = document.getElementById('galleryCount');
  grid.innerHTML = '';
  count.textContent = '共 ' + artworks.length + ' 幅';
  
  if (artworks.length === 0) {
    grid.innerHTML = '<div class="empty-gallery"><p style="font-size:18px;">还没有作品</p><p style="margin-top:12px;color:#3a3a3a;">在主页点击右下角 + 开始创作</p></div>';
    return;
  }
  
  artworks.slice().reverse().forEach(artwork => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = `
      <img src="${artwork.imageData}" alt="${artwork.name}">
      <div class="info">
        <h3>${artwork.name}</h3>
        <div class="btns">
          <button class="export" onclick="exportArtwork('${artwork.id}')">导出</button>
          <button class="delete" onclick="deleteArtwork('${artwork.id}')">删除</button>
        </div>
      </div>
    `;
    grid.appendChild(item);
  });
}

// ========== 导出/删除 ==========
function exportArtwork(id) {
  const artwork = artworks.find(a => a.id === id);
  if (!artwork) return;
  const link = document.createElement('a');
  link.download = artwork.name + '.png';
  link.href = artwork.imageData;
  link.click();
}

function deleteArtwork(id) {
  if (!confirm('确定删除这幅作品吗？')) return;
  artworks = artworks.filter(a => a.id !== id);
  saveToStorage();
  renderWall();
  if (document.getElementById('galleryPage').classList.contains('active')) {
    renderGallery();
  }
}

// ========== 页面切换 ==========
function showPage(pageName) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageName + 'Page').classList.add('active');
  document.getElementById('dropdown').classList.remove('open');
  
  if (pageName === 'gallery') renderGallery();
}

// ========== 菜单 ==========
function setupMenu() {
  const menuBtn = document.getElementById('menuBtn');
  const dropdown = document.getElementById('dropdown');
  
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });
  
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.menu-btn') && !e.target.closest('.dropdown')) {
      dropdown.classList.remove('open');
    }
  });
}

// 启动
init();
</script>

</body>
</html>
