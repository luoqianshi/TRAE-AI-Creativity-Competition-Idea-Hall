<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>人生模拟器 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#111;font-family:"Microsoft YaHei",sans-serif;color:#fff;user-select:none}
#game{width:100vw;height:100vh;display:block}
.ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
.top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:auto}
.pnl{background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 14px;font-size:.78rem;color:#ccc;backdrop-filter:blur(6px)}
.pnl b{color:#fff;font-size:.9rem}
.stats{position:absolute;left:12px;bottom:140px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;font-size:.74rem;min-width:160px}
.sh{display:flex;align-items:center;gap:6px;margin:3px 0}
.sh label{width:40px;color:#aaa}
.sh .bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.sh .fill{height:100%;border-radius:3px;transition:width .3s}
.narr{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 18px;font-size:.88rem;line-height:1.6;pointer-events:auto;max-height:120px;overflow-y:auto}
.narr b{color:#ffd166}
.acts{position:absolute;bottom:140px;right:12px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.abtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 14px;border-radius:8px;font-size:.78rem;cursor:pointer;text-align:left;min-width:140px;font-family:inherit;transition:all .15s}
.abtn:hover{background:rgba(255,255,255,.22)}
.xhint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.25);padding:10px 20px;border-radius:10px;font-size:.85rem;color:#ffd166;display:none;pointer-events:auto;text-align:center}
.xhint small{font-size:.72rem;color:#aaa}
.cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:6px;height:6px;border:1px solid rgba(255,255,255,.4);border-radius:50%;pointer-events:none}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5}
.end{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:40px;text-align:center}
.end.show{display:flex}
.end h2{color:#ffd166;font-size:1.8rem;margin-bottom:16px}
.end p{color:#ccc;font-size:1rem;line-height:1.7;max-width:520px}
.end button{margin-top:24px;padding:12px 32px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;font-size:.92rem;cursor:pointer;font-family:inherit}
.shint{position:absolute;bottom:148px;left:50%;transform:translateX(-50%);font-size:.68rem;color:#666;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:6px;white-space:nowrap}
.sv{position:absolute;top:10px;right:12px;font-size:.68rem;color:#666}
</style>

// ====== THREE.JS SETUP ======
const canvas=document.getElementById("game");
let scene,camera,renderer,clock;
let roomGroup=null;
const PI=Math.PI;
let yaw=0,pitch=0;

function initThree(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1a1a2e);
  scene.fog=new THREE.Fog(0x1a1a2e,1,20);

  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,50);
  camera.position.set(5,1.6,4);

  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.2;

  clock=new THREE.Clock();
  window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

function buildRoom(id){
  if(roomGroup){scene.remove(roomGroup);roomGroup.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){if(Array.isArray(c.material))c.material.forEach(m=>m.dispose());else c.material.dispose();}})}
  roomGroup=new THREE.Group();
  const rm=rooms[id];
  const W=rm.w,D=rm.d,H=rm.h;

  // Floor
  const fg=new THREE.PlaneGeometry(W,D);
  const fm=new THREE.MeshLambertMaterial({color:rm.fc});
  const fl=new THREE.Mesh(fg,fm);
  fl.rotation.x=-PI/2;fl.position.set(W/2,0,D/2);fl.receiveShadow=true;
  roomGroup.add(fl);

  // Ceiling
  const cg=new THREE.PlaneGeometry(W,D);
  const cm=new THREE.MeshLambertMaterial({color:rm.cc});
  const cl=new THREE.Mesh(cg,cm);
  cl.rotation.x=PI/2;cl.position.set(W/2,H,D/2);
  roomGroup.add(cl);

  // Walls
  const wm=new THREE.MeshLambertMaterial({color:rm.wc,side:THREE.DoubleSide});
  const walls=[
    {w:W,h:H,x:W/2,y:H/2,z:0,rx:0},
    {w:W,h:H,x:W/2,y:H/2,z:D,rx:0},
    {w:D,h:H,x:0,y:H/2,z:D/2,rx:-PI/2},
    {w:D,h:H,x:W,y:H/2,z:D/2,rx:-PI/2}
  ];
  walls.forEach(wl=>{
    const g=new THREE.PlaneGeometry(wl.w,wl.h);
    const m=new THREE.Mesh(g,wm);
    m.position.set(wl.x,wl.y,wl.z);
    if(wl.rx)m.rotation.y=wl.rx;
    m.receiveShadow=true;
    roomGroup.add(m);
  });

  // Furniture
  (rm.fur||[]).forEach(f=>{
    if(f.t==="box"){
      const g=new THREE.BoxGeometry(f.w,f.h,f.d);
      const m=new THREE.MeshLambertMaterial({color:f.c});
      const mesh=new THREE.Mesh(g,m);
      mesh.position.set(f.x,f.h/2,f.z);
      mesh.castShadow=true;
      roomGroup.add(mesh);
    }else if(f.t==="tree"){
      // trunk
      const tg=new THREE.CylinderGeometry(0.15,0.2,1.5,8);
      const tm=new THREE.MeshLambertMaterial({color:0x8B4513});
      const trunk=new THREE.Mesh(tg,tm);
      trunk.position.set(f.x,0.75,f.z);trunk.castShadow=true;
      roomGroup.add(trunk);
      // canopy
      const cg2=new THREE.SphereGeometry(1,8,8);
      const cm2=new THREE.MeshLambertMaterial({color:0x2d8a3d});
      const canopy=new THREE.Mesh(cg2,cm2);
      canopy.position.set(f.x,2.2,f.z);canopy.castShadow=true;
      roomGroup.add(canopy);
    }else if(f.t==="bench"){
      const g=new THREE.BoxGeometry(1.5,0.1,0.5);
      const m=new THREE.MeshLambertMaterial({color:0x8B6914});
      const seat=new THREE.Mesh(g,m);
      seat.position.set(f.x,0.5,f.z);seat.castShadow=true;
      roomGroup.add(seat);
      const lg=new THREE.BoxGeometry(0.1,0.4,0.4);
      const lm=new THREE.MeshLambertMaterial({color:0x444});
      [-0.6,0.6].forEach(ox=>{
        const l=new THREE.Mesh(lg,lm);
        l.position.set(f.x+ox,0.2,f.z);
        roomGroup.add(l);
      });
    }else if(f.t==="mon"){
      const g=new THREE.BoxGeometry(0.8,0.5,0.05);
      const m=new THREE.MeshLambertMaterial({color:0x222});
      const mesh=new THREE.Mesh(g,m);
      mesh.position.set(f.x,1.2,f.z);mesh.castShadow=true;
      roomGroup.add(mesh);
      const sg=new THREE.BoxGeometry(0.7,0.4,0.02);
      const sm=new THREE.MeshLambertMaterial({color:0x3366aa,emissive:0x112244});
      const scr=new THREE.Mesh(sg,sm);
      scr.position.set(f.x,1.15,f.z-0.03);
      roomGroup.add(scr);
    }
  });

  // Exit markers - glowing yellow columns
  (rm.ex||[]).forEach(ex=>{
    const g=new THREE.BoxGeometry(0.8,H,0.3);
    const m=new THREE.MeshBasicMaterial({color:0xffd166,transparent:true,opacity:0.6});
    const mesh=new THREE.Mesh(g,m);
    mesh.position.set(ex.x,H/2,ex.z);
    roomGroup.add(mesh);
    // arrow
    const ag=new THREE.ConeGeometry(0.2,0.4,8);
    const am=new THREE.MeshBasicMaterial({color:0xffd166});
    const arrow=new THREE.Mesh(ag,am);
    arrow.position.set(ex.x,1.8,ex.z);
    arrow.rotation.z=PI/2;
    roomGroup.add(arrow);
  });

  // Lighting
  const amb=new THREE.AmbientLight(0xffffff,rm.l*0.5);
  roomGroup.add(amb);
  const pl=new THREE.PointLight(0xfff5e0,rm.l,20);
  pl.position.set(W/2,H-0.3,D/2);
  pl.castShadow=true;
  pl.shadow.mapSize.width=512;
  pl.shadow.mapSize.height=512;
  roomGroup.add(pl);
  if(W>10){
    const pl2=new THREE.PointLight(0xfff5e0,rm.l*0.6,15);
    pl2.position.set(W*0.25,H-0.3,D/2);
    roomGroup.add(pl2);
    const pl3=new THREE.PointLight(0xfff5e0,rm.l*0.6,15);
    pl3.position.set(W*0.75,H-0.3,D/2);
    roomGroup.add(pl3);
  }

  scene.add(roomGroup);

  // Sky/horizon color
  const skyC=new THREE.Color(rm.cc);
  scene.background=skyC;
  scene.fog.color=skyC;
  scene.fog.far=Math.max(W,D)*2;
}

function initS(){return{age:1,turn:1,si:0,health:80,mood:75,skill:5,relation:30,family:60,stability:20,pressure:5,money:8000,ended:false,seen:{},sc:{},ec:{i:0,c:0},logs:["1岁的春天，你在家睁开眼。天花板、窗帘和晨光，是你对这个世界的第一印象。"]}}
function cl(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
function mn(v){return"¥"+Math.round(v).toLocaleString("zh-CN")}
function ae(ef){Object.entries(ef).forEach(([k,v])=>{if(k==="money")S.money+=v;else S[k]=cl(S[k]+v)})}
function al(t){S.logs.unshift(t);S.logs=S.logs.slice(0,12)}
function lc(){let r=0,f=200,e=0,fc=0,m=0;if(S.age>=22)r=S.age<30?500:S.age<45?800:S.age<60?600:0;if(S.age>=30&&S.age<=50)e=400;if(S.age>=35)fc=300;if(S.age>=60)m=500;f+=Math.floor((S.age-1)*8);const tot=r+f+e+fc+m;S.money-=tot;if(S.money<0){const x=Math.min(16,Math.ceil(Math.abs(S.money)/400));S.pressure=cl(S.pressure+x);S.mood=cl(S.mood-Math.ceil(x/1.4));S.stability=cl(S.stability-Math.ceil(x/2))}return{tot,d:`生活开销 ${mn(tot)}`}}
function nt(){S.turn++;S.si=(S.si+1)%4;if(S.si===0)S.age++}
function mM(){const i=MS.find(m=>!S.seen[m.id]&&S.age>=m.a);if(!i)return null;S.seen[i.id]=true;ae(i.e);S.ec.i++;return i}
function mC(){if(Math.random()>0.38)return null;const cs=CE.filter(e=>{if(e.o&&S.sc[e.id])return false;return e.c(S)});if(!cs.length)return null;const ev=cs[Math.floor(Math.random()*cs.length)];if(ev.o)S.sc[ev.id]=true;ae(ev.e);S.ec.c++;return ev}
function gP(a){if(a<=3)return"婴儿期";if(a<=6)return"幼儿期";if(a<=12)return"童年期";if(a<=15)return"少年期";if(a<=18)return"青少年期";if(a<=22)return"青年期";if(a<=30)return"成年早期";if(a<=40)return"成年中期";if(a<=55)return"中年期";if(a<=70)return"中老年期";if(a<=85)return"老年期";return"长寿期"}
function gN(a){if(a<=3)return"小宝宝";if(a<=6)return"小朋友";if(a<=12)return"小学生";if(a<=15)return"初中生";if(a<=18)return"高中生";if(a<=22)return"大学生";if(a<=30)return"青年";if(a<=40)return"壮年";if(a<=55)return"中年";if(a<=70)return"中老年";if(a<=85)return"老人";return"百岁老人"}

function chkEnd(){
  if(S.health<=0){fin("健康耗尽",`你的人生在${S.age}岁因健康原因画上了句号。`);return}
  if(S.pressure>=100){fin("压力崩溃",`你在${S.age}岁被压力彻底压垮了。`);return}
  if(S.money<=-20000){fin("破产",`你在${S.age}岁一无所有。`);return}
  if(S.turn>MT){
    let ti,tx;
    if(S.health>=70&&S.mood>=60&&S.family>=50){ti="圆满人生";tx="你活了一百年，有爱、有健康、有平静。不是最富有的，但也是最幸福的结局之一。"}
    else if(S.money>=100000&&S.skill>=80){ti="成功人生";tx="你积累了财富和成就，名字被人记住。"}
    else if(S.family>=80&&S.relation>=60){ti="温暖人生";tx="你被爱环绕，也给了别人很多爱。一百岁时，身边还有牵挂你的人。"}
    else if(S.health>=80&&S.pressure<40){ti="轻盈人生";tx="你没有被世俗标准绑架，按自己的节奏活了一百年。"}
    else if(S.skill>=90){ti="智慧人生";tx="你学了一辈子，也教了很多人。一百岁时，你的智慧比财富更珍贵。"}
    else{ti="普通人生";tx="你经历了出生、成长、学习、工作、恋爱、结婚、生子、变老。没有传奇，但真实。一百年的每一天，都是你亲手活出来的。"}
    fin(ti,tx);
  }
}
function fin(t,x){S.ended=true;document.getElementById("eT").textContent=t;document.getElementById("eX").textContent=x;document.getElementById("eS").classList.add("show");al("结局："+t);localStorage.removeItem(SK)}

function doAct(i){
  if(S.ended)return;const acts=ACT[curRoom];if(!acts||i>=acts.length)return;
  const a=acts[i];ae(a.e);const cost=lc();let txt=`${a.t} ${cost.d}。`;
  const ev=mC();if(ev){txt+=` 【偶然：${ev.n}】${ev.t}`;sT(`偶然：${ev.n}`)}
  const ms=mM();if(ms){txt+=` 【必然：${ms.n}】${ms.t}`;sT(`必然：${ms.n}`)}
  al(`${S.age}岁${SE[S.si]}，${rooms[curRoom].name}：${txt}`);
  document.getElementById("nar").innerHTML=`<b>${rooms[curRoom].name}：</b>${txt}`;
  if(S.health<30)shake=12;if(S.pressure>70)shake=6;
  nt();chkEnd();rUI();save();
}

function sT(m){const e=document.getElementById("svH");e.textContent=m;e.style.color="#ffd166";setTimeout(()=>{e.textContent="自动保存中...";e.style.color="#666"},2000)}

function rUI(){
  const s=S;
  document.getElementById("ageT").textContent=s.age+"岁";
  document.getElementById("seaT").textContent=SE[s.si];
  document.getElementById("trnT").textContent=s.turn;
  document.getElementById("phaT").textContent=gP(s.age);
  document.getElementById("monT").textContent=mn(s.money);
  document.getElementById("locT").textContent=rooms[curRoom].name;
  document.getElementById("sH").innerHTML=Object.entries(SM).map(([k,m])=>{const v=s[k];return`<div class="sh"><label>${m.l}</label><div class="bar"><div class="fill" style="width:${v}%;background:${m.c}"></div></div><span style="color:${m.c};font-size:.7rem">${v}</span></div>`}).join("");
  const acts=ACT[curRoom]||[];
  document.getElementById("aB").innerHTML=acts.map((a,i)=>`<button class="abtn" onclick="doAct(${i})"><b>${a.n}</b><br><span style="color:#aaa;font-size:.7rem">${a.d}</span></button>`).join("");
}

function save(){try{localStorage.setItem(SK,JSON.stringify({...S,curRoom,pos:camera.position.clone(),yaw}))}catch(e){}}
function load(){try{const r=localStorage.getItem(SK);if(!r)return false;const d=JSON.parse(r);if(!d||!d.turn||d.ended)return false;S=d;curRoom=d.curRoom||"home";if(d.pos){camera.position.set(d.pos.x,d.pos.y,d.pos.z);yaw=d.yaw||0}return true}catch(e){return false}}
function restart(){localStorage.removeItem(SK);S=initS();curRoom="home";document.getElementById("eS").classList.remove("show");enterRoom("home");rUI()}

function enterRoom(id){
  curRoom=id;const rm=rooms[id];buildRoom(id);
  camera.position.set(rm.sp.x,rm.sp.y,rm.sp.z);yaw=rm.sp.ry;pitch=0;
  nearEx=null;document.getElementById("xH").style.display="none";
  document.getElementById("nar").innerHTML=`<b>你来到了${rm.name}。</b>这里的空气、光线和声音都不同。选择一种行动度过这个季节。`;
  rUI();
}

// ====== MOVEMENT ======
function move(){
  if(S.ended)return;
  const sp=4*clock.getDelta();
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const rgt=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
  const dir=new THREE.Vector3();
  if(keys["w"]||keys["arrowup"])dir.add(fwd);
  if(keys["s"]||keys["arrowdown"])dir.sub(fwd);
  if(keys["a"])dir.sub(rgt);
  if(keys["d"])dir.add(rgt);
  if(dir.length()>0){dir.normalize().multiplyScalar(sp);camera.position.add(dir)}
  camera.position.y=1.6;

  // Collision with walls
  const rm=rooms[curRoom],W=rm.w,D=rm.d,pad=0.4;
  camera.position.x=cl(camera.position.x,pad,W-pad);
  camera.position.z=cl(camera.position.z,pad,D-pad);

  // Exit check
  nearEx=null;
  (rm.ex||[]).forEach(ex=>{
    const dx=camera.position.x-ex.x,dz=camera.position.z-ex.z;
    if(Math.sqrt(dx*dx+dz*dz)<1.2){nearEx=ex;
      document.getElementById("xH").style.display="block";
      document.getElementById("xN").textContent=ex.n;
    }
  });
  if(!nearEx)document.getElementById("xH").style.display="none";
}

function enterEx(){if(!nearEx)return;enterRoom(nearEx.to)}

// ====== INPUT ======
window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==="e")enterEx();
  if(["w","a","s","d","q","e","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase()))e.preventDefault();
});
window.addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false});
canvas.addEventListener("mousedown",e=>{mDown=true;lastMX=e.clientX;canvas.requestPointerLock&&canvas.requestPointerLock()});
window.addEventListener("mouseup",()=>{mDown=false});
document.addEventListener("mousemove",e=>{
  if(mDown||document.pointerLockElement===canvas){yaw-=e.movementX*0.002;pitch-=e.movementY*0.002;pitch=cl(pitch,-PI/3,PI/3)}
});
canvas.addEventListener("click",()=>{canvas.requestPointerLock&&canvas.requestPointerLock()});
let txS=0;
canvas.addEventListener("touchstart",e=>{txS=e.touches[0].clientX});
canvas.addEventListener("touchmove",e=>{const dx=e.touches[0].clientX-txS;yaw+=dx*0.006;txS=e.touches[0].clientX});

// ====== MAIN LOOP ======
function animate(){
  requestAnimationFrame(animate);
  move();
  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  // State overlay
  const ov=document.getElementById("ov");
  let css="";
  if(S.health<25)css+="background:radial-gradient(circle,transparent 40%,rgba(255,0,0,0.25) 100%);";
  else if(S.health<50)css+="background:radial-gradient(circle,transparent 50%,rgba(255,100,0,0.12) 100%);";
  if(S.pressure>80)css+="box-shadow:inset 0 0 80px rgba(255,0,0,0.15);";
  else if(S.pressure>60)css+="box-shadow:inset 0 0 50px rgba(255,100,0,0.1);";
  if(S.mood<20)css+="filter:grayscale(0.4) brightness(0.7);";
  else if(S.mood<40)css+="filter:grayscale(0.2) brightness(0.85);";
  ov.style.cssText=css;

  if(shake>0){canvas.style.transform=`translate(${(Math.random()-.5)*shake}px,${(Math.random()-.5)*shake}px)`;shake*=.92;if(shake<.5){shake=0;canvas.style.transform=""}}

  renderer.render(scene,camera);
}

// ====== INIT ======
initThree();
if(!load()){S=initS();enterRoom("home")}else{buildRoom(curRoom);rUI()}
animate();
</script>
</body>
</html>
