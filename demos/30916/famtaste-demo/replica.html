<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的复刻研究 - 家庭味道 FamTaste</title>
  <!-- Google Fonts: Outfit (display) + Noto Sans SC (中文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@500;700;800&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 项目 CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- 顶部毛玻璃导航栏（由 shared.js injectNav 动态注入到 body 首部） -->

  <!-- 页面主体 -->
  <main class="page">
    <section class="section">
      <div class="container">
        <!-- 页面标题区 -->
        <div class="page-header reveal">
          <h1 class="page-title">我的复刻研究</h1>
          <p class="page-subtitle">记录每一次尝试，让家的味道越来越准</p>
        </div>

        <!-- 统计摘要横条（由 replica.js 渲染） -->
        <section id="replica-stats" class="replica-stats-bar reveal" aria-label="复刻统计摘要">
          <!-- 4 个数字卡片：总尝试 | 菜谱数 | perfect | okay -->
        </section>

        <!-- 时间线主体（由 replica.js 渲染：按日期分组的时间轴） -->
        <div id="replica-timeline" class="replica-timeline" role="feed" aria-label="复刻时间线">
          <!-- 按月份分组的时间轴节点 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 底部导航栏（由 shared.js injectBottomNav 动态注入到 body 末尾，仅手机端显示） -->

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- 项目 JS -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pages/replica.js"></script>
</body>
</html>
