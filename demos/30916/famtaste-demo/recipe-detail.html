<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜谱详情 - 家庭味道 FamTaste</title>
  <!-- Google Fonts: Outfit (display) + Noto Sans SC (中文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@500;700;800&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 项目 CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- 顶部毛玻璃导航栏（由 shared.js injectNav 动态注入到 body 首部） -->

  <!-- 页面主体 -->
  <main class="page">
    <!-- 返回按钮（浮动在 Hero 上方） -->
    <div class="container detail-back-wrapper">
      <a href="recipes.html" class="btn btn-ghost btn-sm detail-back" aria-label="返回菜谱列表">
        <span id="back-icon"></span>
        <span>返回</span>
      </a>
    </div>

    <!-- Hero 图（全宽食物图，border-radius 24px，height 300px） -->
    <div class="container">
      <div class="detail-hero reveal" id="detail-hero">
        <!-- 由 recipe-detail.js 注入图片 -->
      </div>
    </div>

    <!-- 菜谱信息区：标题 + 作者 + 标签 + 难度 + 时间 -->
    <section class="container detail-section reveal" id="detail-info">
      <!-- 由 recipe-detail.js 注入 -->
    </section>

    <!-- Tab 切换栏（3 个 Tab：食材 | 步骤 | 版本对比） -->
    <section class="container">
      <div class="tab-bar" id="detail-tab-bar" role="tablist" aria-label="菜谱详情 Tab">
        <button type="button" class="tab-item active" role="tab" data-tab="ingredients" aria-selected="true" aria-controls="tab-panel-ingredients">食材</button>
        <button type="button" class="tab-item" role="tab" data-tab="steps" aria-selected="false" aria-controls="tab-panel-steps">步骤</button>
        <button type="button" class="tab-item" role="tab" data-tab="compare" aria-selected="false" aria-controls="tab-panel-compare">版本对比</button>
      </div>
    </section>

    <!-- Tab 内容区 -->
    <section class="container section-sm">
      <!-- 食材 Tab 面板 -->
      <div class="tab-panel active" id="tab-panel-ingredients" role="tabpanel" aria-labelledby="tab-ingredients">
        <div class="ingredient-list" id="ingredient-list">
          <!-- 由 recipe-detail.js 注入食材清单（带 checkbox 勾选功能） -->
        </div>
      </div>

      <!-- 步骤 Tab 面板 -->
      <div class="tab-panel" id="tab-panel-steps" role="tabpanel" aria-labelledby="tab-steps" hidden>
        <div class="step-timeline" id="step-timeline">
          <!-- 由 recipe-detail.js 注入步骤时间线 -->
        </div>
      </div>

      <!-- 版本对比 Tab 面板 -->
      <div class="tab-panel" id="tab-panel-compare" role="tabpanel" aria-labelledby="tab-compare" hidden>
        <!-- 对比维度切换按钮：食材对比 / 步骤对比 -->
        <fieldset class="diff-toolbar" aria-label="对比维度切换">
          <button type="button" class="btn btn-sm btn-primary diff-toggle-btn active" data-diff="ingredients">食材对比</button>
          <button type="button" class="btn btn-sm btn-secondary diff-toggle-btn" data-diff="steps">步骤对比</button>
        </fieldset>

        <!-- 版本选择器 -->
        <div class="diff-version-selector" id="diff-version-selector">
          <!-- 由 recipe-detail.js 注入版本选择器 -->
        </div>

        <!-- Diff 视图（左右分栏） -->
        <div class="diff-view" id="diff-view">
          <!-- 由 recipe-detail.js 注入 diff 内容 -->
        </div>
      </div>
    </section>

    <!-- 底部 CTA：开始复刻 -->
    <section class="container section-sm">
      <a class="btn btn-primary btn-block btn-lg" id="cta-replica" href="replica-form.html" aria-label="开始复刻这道菜">
        <span id="cta-icon"></span>
        <span>开始复刻</span>
      </a>
    </section>
  </main>

  <!-- 底部导航栏（由 shared.js injectBottomNav 动态注入到 body 末尾，仅手机端显示） -->

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pages/recipe-detail.js"></script>
</body>
</html>
