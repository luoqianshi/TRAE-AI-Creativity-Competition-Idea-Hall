<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 避坑指南 - 家庭味道</title>
  <!-- Google Fonts: Outfit (display) + Noto Sans SC (中文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@500;700;800&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 项目 CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- 顶部毛玻璃导航栏（由 shared.js injectNav 动态注入到 body 首部） -->

  <!-- 页面主体 -->
  <main class="page">
    <section class="section">
      <div class="container">
        <!-- 标题区 -->
        <div class="page-header reveal">
          <h1 class="page-title">AI 避坑指南</h1>
          <p class="page-subtitle">基于你的复刻经历，AI 总结出的经验教训</p>
        </div>

        <!-- 菜谱选择器（横向滚动卡片列表） -->
        <div id="pitfall-selector" class="pitfall-selector scroll-x reveal"
             role="tablist"
             aria-label="选择菜谱查看避坑指南">
          <!-- 由 pitfall.js 渲染：每道有避坑指南的菜谱卡片 -->
        </div>

        <!-- 避坑详情区（默认显示第一道菜） -->
        <div id="pitfall-detail" class="pitfall-detail reveal">
          <!-- 菜名 + 总尝试次数 + 成功率（由 pitfall.js 渲染） -->
          <div id="pitfall-detail-header" class="pitfall-detail-header"></div>

          <!-- findings 列表（由 pitfall.js 渲染） -->
          <div id="pitfall-findings" class="pitfall-findings"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 底部导航栏（由 shared.js injectBottomNav 动态注入到 body 末尾，仅手机端显示） -->

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- 项目 JS -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pages/pitfall.js"></script>
</body>
</html>
