<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>膳食规划 - 家庭味道</title>
  <!-- Google Fonts: Outfit (display) + Noto Sans SC (中文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@500;700;800&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 项目 CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- 顶部毛玻璃导航栏（由 shared.js injectNav 动态注入到 body 首部） -->

  <!-- 页面主体 -->
  <main class="page">
    <section class="section">
      <div class="container">
        <!-- 标题区 -->
        <div class="page-header reveal">
          <h1 class="page-title">本周膳食规划</h1>
          <p class="page-subtitle">一周七天，营养均衡，轻松安排</p>
        </div>

        <!-- 周导航（左右箭头切换周） -->
        <nav id="mealplan-week-nav" class="mealplan-week-nav reveal"
             aria-label="周导航">
          <button class="mealplan-week-btn" id="week-prev" type="button" aria-label="上一周">
            <!-- chevron-left icon 由 JS 注入 -->
          </button>
          <span class="mealplan-week-label" id="week-label">2026年第25周</span>
          <button class="mealplan-week-btn" id="week-next" type="button" aria-label="下一周">
            <!-- chevron-right icon 由 JS 注入 -->
          </button>
        </nav>

        <!-- 成员过敏提示条（从 Data.members.restrictions 读取） -->
        <div id="mealplan-allergy-alert" class="mealplan-allergy-alert reveal" role="alert"
             style="display: none;">
          <!-- 由 mealplan.js 渲染 -->
        </div>

        <!-- 膳食网格（4行 x 7列 = 28格子） -->
        <div id="mealplan-table-wrapper" class="mealplan-table-wrapper reveal">
          <table class="mealplan-table" id="mealplan-grid" role="grid"
                 aria-label="本周膳食规划表">
            <!-- 表头：一 | 二 | ... | 日（由 mealplan.js 渲染） -->
            <!-- 行：早餐 / 午餐 / 晚餐 / 夜宵（每行7格） -->
          </table>
        </div>

        <!-- 快捷操作栏 -->
        <div class="mealplan-actions reveal">
          <button class="btn btn-primary btn-sm" id="btn-ai-recommend" type="button">
            AI 推荐
          </button>
          <button class="btn btn-secondary btn-sm" id="btn-sync-shopping" type="button">
            同步购物清单
          </button>
          <button class="btn btn-ghost btn-sm" id="btn-clear-week" type="button">
            清空本周
          </button>
        </div>
      </div>
    </section>
  </main>

  <!-- 菜谱选择浮层（点击空格子弹出） -->
  <div id="mealpicker-overlay" class="mealpicker-overlay" style="display: none;"
       role="dialog"
       aria-modal="true"
       aria-label="选择菜谱">
    <!-- 由 mealplan.js 动态渲染 -->
  </div>

  <!-- 底部导航栏（由 shared.js injectBottomNav 动态注入到 body 末尾，仅手机端显示） -->

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <!-- 项目 JS -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pages/mealplan.js"></script>
</body>
</html>
