<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜谱库 - 家庭味道 FamTaste</title>
  <!-- Google Fonts: Outfit (display) + Noto Sans SC (中文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@500;700;800&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 项目 CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- 顶部毛玻璃导航栏（由 shared.js injectNav 动态注入到 body 首部） -->

  <!-- 页面主体 -->
  <main class="page">
    <!-- 页面标题区 + 搜索框 -->
    <section class="container page-header reveal">
      <h1 class="page-title">菜谱库</h1>
      <p class="page-subtitle">记录每一道家常菜的故事，传承家的味道</p>

      <!-- 搜索框（由 recipes.js 绑定 input 事件，300ms 防抖） -->
      <search class="search-bar">
        <span aria-hidden="true" id="search-icon"></span>
        <input
          type="search"
          id="recipe-search"
          placeholder="搜索菜名..."
          aria-label="搜索菜谱"
          autocomplete="off"
        />
      </search>
    </section>

    <!-- 标签筛选栏（横向滚动 pill，由 recipes.js 注入） -->
    <section class="container">
      <div class="tag-filter" id="tag-filter" role="tablist" aria-label="菜谱标签筛选">
        <!-- 由 recipes.js 注入标签 pill -->
      </div>
    </section>

    <!-- 菜谱网格（PC 3列 / 平板 2列 / 手机 1列） -->
    <section class="container section-sm">
      <div class="grid grid-3" id="recipe-grid">
        <!-- 由 recipes.js 注入菜谱卡片 -->
      </div>
    </section>
  </main>

  <!-- FAB 浮动按钮（添加菜谱，由 recipes.js 绑定点击事件） -->
  <button class="fab" id="fab-top" aria-label="添加菜谱" type="button">
    <span id="fab-icon"></span>
  </button>

  <!-- 底部导航栏（由 shared.js injectBottomNav 动态注入到 body 末尾，仅手机端显示） -->

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pages/recipes.js"></script>
</body>
</html>
