<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>复刻这道菜 - 家庭味道</title>
  <!-- Google Fonts: Outfit (display) + Noto Sans SC (中文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@500;700;800&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 项目 CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <!-- 顶部毛玻璃导航栏（由 shared.js injectNav 动态注入到 body 首部） -->

  <!-- 页面主体 -->
  <main class="page">
    <section class="section">
      <div class="container" style="max-width:640px;">
        <div class="page-header reveal">
          <a href="recipes.html" class="back-link">${getIcon("chevron-left")}返回</a>
          <h1>复刻这道菜</h1>
          <p>调整食材用量，记录你的版本</p>
        </div>

        <!-- 复刻表单（由 replica-form.js 动态渲染和绑定事件） -->
        <form id="replica-form" novalidate>

          <!-- 选择基础菜谱 -->
          <div class="form-group form-section">
            <label for="form-recipe-select" class="form-label">选择菜谱</label>
            <select id="form-recipe-select" class="select" aria-required="true">
              <option value="">-- 请选择菜谱 --</option>
              <!-- 由 replica-form.js 填充选项 -->
            </select>
          </div>

          <!-- 食材调整区 -->
          <div class="form-section" id="ingredients-section" style="display:none;">
            <h3 style="font-size: var(--text-lg); margin-bottom: var(--space-md); color: var(--text-primary);">
              食材调整
            </h3>
            <div id="form-ingredients" class="ingredient-edit-list">
              <!-- 由 replica-form.js 动态渲染食材列表 -->
            </div>
            <button type="button" class="btn btn-ghost btn-sm" id="add-ingredient-btn" style="margin-top: var(--space-sm);">
              ${getIcon("plus")}添加食材
            </button>
          </div>

          <!-- 步骤备注区 -->
          <div class="form-section" id="steps-section" style="display:none;">
            <h3 style="font-size: var(--text-lg); margin-bottom: var(--space-md); color: var(--text-primary);">
              步骤备注
            </h3>
            <div id="form-steps" class="step-edit-list">
              <!-- 由 replica-form.js 动态渲染步骤列表 -->
            </div>
          </div>

          <!-- 整体备注文本框 -->
          <div class="form-group">
            <label for="form-notes" class="form-label">整体备注</label>
            <textarea
              id="form-notes"
              class="textarea"
              rows="4"
              placeholder="写下你的烹饪心得..."
              aria-label="整体备注"
            ></textarea>
          </div>

          <!-- 提交按钮 -->
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="form-submit" style="margin-top: var(--space-lg);">
            保存复刻版本
          </button>
        </form>
      </div>
    </section>
  </main>

  <!-- 底部导航栏（由 shared.js injectBottomNav 动态注入到 body 末尾，仅手机端显示） -->

  <!-- 项目 JS -->
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/pages/replica-form.js"></script>
</body>
</html>
