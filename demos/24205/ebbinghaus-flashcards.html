<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>艾宾浩斯记忆闪卡 — 大学生碎片化学习助手</title>
<style>
  /* ===========================================================
   *  CSS 变量与基础重置
   * =========================================================== */
  :root {
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-secondary: #7f8c8d;
    --primary: #4a90d9;
    --primary-light: #e8f0fe;
    --accent: #e67e22;
    --accent-light: #fef3e2;
    --success: #27ae60;
    --success-light: #e8f8f0;
    --danger: #e74c3c;
    --danger-light: #fdecea;
    --border: #e1e8ed;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.1);
    --radius: 14px;
    --radius-sm: 8px;
    --transition: 0.25s ease;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===========================================================
   *  顶部导航栏
   * =========================================================== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow);
  }
  .topbar .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; font-weight: 700; color: var(--primary);
  }
  .topbar .brand svg { width: 26px; height: 26px; fill: var(--primary); }
  .topbar .tabs {
    display: flex; gap: 4px;
    background: var(--primary-light);
    border-radius: 999px;
    padding: 3px;
  }
  .topbar .tab {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px; font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer; transition: var(--transition);
    border: none; background: transparent;
  }
  .topbar .tab.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 6px rgba(74,144,217,0.35);
  }

  /* ===========================================================
   *  主内容区
   * =========================================================== */
  .main {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    min-height: calc(100vh - 60px);
  }

  /* ===========================================================
   *  页面切换
   * =========================================================== */
  .page { display: none; animation: fadeIn 0.3s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===========================================================
   *  统计卡片（首页顶部）
   * =========================================================== */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 10px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .stat-card .num {
    font-size: 26px; font-weight: 700;
    color: var(--primary);
  }
  .stat-card .label {
    font-size: 12px; color: var(--text-secondary); margin-top: 2px;
  }

  /* ===========================================================
   *  今日复习提示
   * =========================================================== */
  .today-box {
    background: linear-gradient(135deg, var(--primary-light) 0%, #f0f7ff 100%);
    border: 1px solid rgba(74,144,217,0.2);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .today-box .info h3 { font-size: 16px; color: var(--primary); margin-bottom: 4px; }
  .today-box .info p { font-size: 13px; color: var(--text-secondary); }
  .today-box .btn-review {
    background: var(--primary); color: #fff;
    border: none; border-radius: var(--radius-sm);
    padding: 8px 18px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; transition: var(--transition);
    box-shadow: 0 2px 8px rgba(74,144,217,0.35);
  }
  .today-box .btn-review:active { transform: scale(0.96); }

  /* ===========================================================
   *  分类列表
   * =========================================================== */
  .section-title {
    font-size: 15px; font-weight: 700;
    margin: 20px 0 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title .count {
    font-size: 12px; font-weight: 500;
    color: var(--text-secondary); background: var(--primary-light);
    padding: 2px 8px; border-radius: 999px;
  }

  .cat-list { display: flex; flex-direction: column; gap: 10px; }
  .cat-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: var(--transition);
  }
  .cat-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .cat-card .icon {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .cat-card .meta { flex: 1; }
  .cat-card .meta h4 { font-size: 15px; font-weight: 600; }
  .cat-card .meta p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .cat-card .arrow { color: var(--text-secondary); font-size: 18px; }

  /* ===========================================================
   *  新建分类 / 新建闪卡 按钮
   * =========================================================== */
  .fab {
    position: fixed; right: 18px; bottom: 24px; z-index: 40;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--primary); color: #fff;
    border: none; font-size: 28px; font-weight: 300;
    cursor: pointer; transition: var(--transition);
    box-shadow: 0 4px 16px rgba(74,144,217,0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .fab:active { transform: scale(0.92); }

  /* ===========================================================
   *  模态框（新建 / 编辑）
   * =========================================================== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.45);
    display: none; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card-bg);
    width: 100%; max-width: 520px;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 20px 18px 28px;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    max-height: 92vh; overflow-y: auto;
  }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal h3 { font-size: 18px; margin-bottom: 14px; }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); margin-bottom: 6px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px; font-family: inherit;
    background: var(--bg);
    color: var(--text);
    outline: none; transition: var(--transition);
    resize: vertical;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--primary); background: #fff; }
  .form-group textarea { min-height: 90px; }
  .modal-actions {
    display: flex; gap: 10px; margin-top: 6px;
  }
  .btn {
    flex: 1; padding: 11px;
    border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;
    border: none; cursor: pointer; transition: var(--transition);
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: #3a7bc8; }
  .btn-secondary { background: var(--bg); color: var(--text-secondary); border: 1px solid var(--border); }

  /* ===========================================================
   *  闪卡列表页
   * =========================================================== */
  .back-bar {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .back-bar button {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 6px 12px;
    font-size: 13px; cursor: pointer; color: var(--text-secondary);
  }
  .back-bar h2 { font-size: 17px; }

  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .flash-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    cursor: pointer; transition: var(--transition);
    position: relative;
  }
  .flash-card:hover { box-shadow: var(--shadow-hover); }
  .flash-card .front { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  .flash-card .back-preview {
    font-size: 13px; color: var(--text-secondary);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .flash-card .badges {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .badge {
    font-size: 11px; font-weight: 600;
    padding: 3px 8px; border-radius: 999px;
  }
  .badge-new { background: var(--primary-light); color: var(--primary); }
  .badge-review { background: var(--accent-light); color: var(--accent); }
  .badge-mastered { background: var(--success-light); color: var(--success); }
  .badge-fuzzy { background: #fff8e1; color: #f9a825; }

  /* ===========================================================
   *  复习模式（抽背）
   * =========================================================== */
  .review-stage {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: calc(100vh - 60px);
    padding: 20px;
  }
  .review-card-wrap {
    width: 100%; max-width: 420px;
    perspective: 1000px;
    margin-bottom: 24px;
  }
  .review-card {
    width: 100%; aspect-ratio: 3 / 2;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }
  .review-card.flipped { transform: rotateY(180deg); }
  .review-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow-hover);
    border: 1px solid var(--border);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .review-face.back { transform: rotateY(180deg); background: #fffbf2; }
  .review-face .face-label {
    position: absolute; top: 14px; left: 16px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-secondary);
  }
  .review-face .face-content {
    font-size: 18px; font-weight: 600; line-height: 1.5;
    word-break: break-word;
  }
  .review-hint {
    font-size: 13px; color: var(--text-secondary);
    margin-top: 10px;
  }

  /* 掌握度按钮 */
  .rating-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%; max-width: 420px;
  }
  .rating-btn {
    padding: 12px;
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 700;
    border: none; cursor: pointer; transition: var(--transition);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .rating-btn .sub { font-size: 11px; font-weight: 500; opacity: 0.8; }
  .rating-btn:active { transform: scale(0.96); }
  .rating-fuzzy { background: var(--accent-light); color: var(--accent); }
  .rating-known { background: var(--success-light); color: var(--success); }
  .rating-master { background: var(--primary-light); color: var(--primary); }

  .review-progress {
    width: 100%; max-width: 420px;
    margin-bottom: 18px;
  }
  .review-progress .bar {
    height: 6px; background: var(--border); border-radius: 999px; overflow: hidden;
  }
  .review-progress .bar-inner {
    height: 100%; background: var(--primary); border-radius: 999px;
    transition: width 0.3s ease;
  }
  .review-progress .txt {
    font-size: 12px; color: var(--text-secondary); margin-top: 6px; text-align: center;
  }

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-secondary);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 10px; }
  .empty-state h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }
  .empty-state p { font-size: 14px; }

  /* ===========================================================
   *  复习计划页
   * =========================================================== */
  .plan-list { display: flex; flex-direction: column; gap: 10px; }
  .plan-date {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .plan-date h4 {
    font-size: 14px; font-weight: 700;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .plan-date h4 .tag {
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px;
  }
  .tag-today { background: var(--primary-light); color: var(--primary); }
  .tag-future { background: var(--bg); color: var(--text-secondary); }
  .plan-items { display: flex; flex-direction: column; gap: 6px; }
  .plan-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .plan-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-new { background: var(--primary); }
  .dot-review1 { background: var(--accent); }
  .dot-review2 { background: #9b59b6; }
  .dot-review3 { background: var(--success); }
  .dot-mastered { background: var(--border); }

  /* ===========================================================
   *  设置页
   * =========================================================== */
  .setting-row {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .setting-row .info h4 { font-size: 15px; font-weight: 600; }
  .setting-row .info p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .setting-row .action {
    background: var(--danger-light); color: var(--danger);
    border: 1px solid rgba(231,76,60,0.25);
    border-radius: var(--radius-sm);
    padding: 6px 14px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; transition: var(--transition);
  }
  .setting-row .action:hover { background: var(--danger); color: #fff; }

  .toast {
    position: fixed; left: 50%; bottom: 80px; z-index: 200;
    transform: translateX(-50%) translateY(20px);
    background: rgba(44,62,80,0.92); color: #fff;
    padding: 10px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none;
    transition: all 0.3s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 响应式微调 */
  @media (max-width: 480px) {
    .stats-row { gap: 8px; }
    .stat-card { padding: 12px 6px; }
    .stat-card .num { font-size: 22px; }
    .review-face .face-content { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- 顶部导航 -->
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
    记忆闪卡
  </div>
  <nav class="tabs">
    <button class="tab active" data-page="home">首页</button>
    <button class="tab" data-page="plan">计划</button>
    <button class="tab" data-page="settings">设置</button>
  </nav>
</header>

<!-- 主内容 -->
<main class="main">

  <!-- ========== 首页 ========== -->
  <section class="page active" id="page-home">
    <div class="stats-row">
      <div class="stat-card">
        <div class="num" id="stat-total">0</div>
        <div class="label">全部闪卡</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-today">0</div>
        <div class="label">今日复习</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-mastered">0</div>
        <div class="label">已掌握</div>
      </div>
    </div>

    <div class="today-box" id="today-box">
      <div class="info">
        <h3>今日复习任务</h3>
        <p>根据艾宾浩斯遗忘曲线，今天有 <b id="today-count">0</b> 张卡片待复习</p>
      </div>
      <button class="btn-review" id="btn-start-review">开始复习</button>
    </div>

    <div class="section-title">
      我的分类 <span class="count" id="cat-count">0 个</span>
    </div>
    <div class="cat-list" id="cat-list">
      <!-- 动态填充 -->
    </div>
  </section>

  <!-- ========== 复习计划页 ========== -->
  <section class="page" id="page-plan">
    <div class="section-title">未来 14 天复习计划</div>
    <div class="plan-list" id="plan-list">
      <!-- 动态填充 -->
    </div>
  </section>

  <!-- ========== 设置页 ========== -->
  <section class="page" id="page-settings">
    <div class="section-title">数据管理</div>
    <div class="setting-row">
      <div class="info">
        <h4>导出数据</h4>
        <p>将所有闪卡数据导出为 JSON 文件备份</p>
      </div>
      <button class="action" style="background:var(--primary-light);color:var(--primary);border-color:rgba(74,144,217,0.25);" onclick="app.exportData()">导出</button>
    </div>
    <div class="setting-row">
      <div class="info">
        <h4>导入数据</h4>
        <p>从 JSON 文件恢复闪卡数据</p>
      </div>
      <label class="action" style="background:var(--primary-light);color:var(--primary);border-color:rgba(74,144,217,0.25);display:inline-block;">
        导入
        <input type="file" accept=".json" style="display:none" onchange="app.importData(this)">
      </label>
    </div>
    <div class="setting-row">
      <div class="info">
        <h4>清空所有数据</h4>
        <p>删除所有闪卡和分类（不可恢复）</p>
      </div>
      <button class="action" onclick="app.clearAll()">清空</button>
    </div>

    <div class="section-title" style="margin-top:24px">关于</div>
    <div class="setting-row">
      <div class="info">
        <h4>艾宾浩斯记忆闪卡</h4>
        <p>纯前端工具 · 数据本地存储 · 零成本高效学习</p>
      </div>
    </div>
  </section>

  <!-- ========== 闪卡列表页（子页面，非顶部导航） ========== -->
  <section class="page" id="page-cards">
    <div class="back-bar">
      <button onclick="app.showPage('home')">← 返回</button>
      <h2 id="cards-title">分类名称</h2>
    </div>
    <div class="card-list" id="card-list">
      <!-- 动态填充 -->
    </div>
  </section>

  <!-- ========== 复习模式页 ========== -->
  <section class="page" id="page-review">
    <div class="back-bar">
      <button onclick="app.endReview()">← 结束复习</button>
      <h2>今日复习</h2>
    </div>
    <div class="review-stage" id="review-stage">
      <div class="review-progress">
        <div class="bar"><div class="bar-inner" id="review-bar" style="width:0%"></div></div>
        <div class="txt" id="review-txt">0 / 0</div>
      </div>
      <div class="review-card-wrap">
        <div class="review-card" id="review-card">
          <div class="review-face front">
            <span class="face-label">正面</span>
            <div class="face-content" id="review-front">点击翻转查看答案</div>
          </div>
          <div class="review-face back">
            <span class="face-label">背面</span>
            <div class="face-content" id="review-back">答案内容</div>
          </div>
        </div>
      </div>
      <p class="review-hint">点击卡片翻转 · 查看答案后选择掌握程度</p>
      <div class="rating-bar" id="rating-bar" style="display:none;">
        <button class="rating-btn rating-fuzzy" onclick="app.rateCard('fuzzy')">
          模糊
          <span class="sub">10分钟后重学</span>
        </button>
        <button class="rating-btn rating-known" onclick="app.rateCard('known')">
          记得
          <span class="sub">按曲线复习</span>
        </button>
        <button class="rating-btn rating-master" onclick="app.rateCard('mastered')">
          熟练
          <span class="sub">标记已掌握</span>
        </button>
      </div>
    </div>
  </section>

</main>

<!-- 浮动添加按钮 -->
<button class="fab" id="fab-add" onclick="app.openAddModal()">+</button>

<!-- 模态框 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <h3 id="modal-title">新建分类</h3>
    <div id="modal-body">
      <!-- 动态填充 -->
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="app.closeModal()">取消</button>
      <button class="btn btn-primary" id="modal-confirm">确认</button>
    </div>
  </div>
</div>

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
/* ===========================================================
 *  艾宾浩斯遗忘曲线复习间隔（单位：天）
 *  标准间隔：1, 2, 4, 7, 15, 30 ...
 *  这里采用更紧凑的学生友好版本
 * =========================================================== */
const REVIEW_INTERVALS = [1, 2, 4, 7, 15, 30];

/* ===========================================================
 *  应用主对象
 * =========================================================== */
const app = {
  data: {
    categories: [],   // { id, name, icon, color }
    cards: []         // { id, catId, front, back, level, nextReview, createdAt, mastered }
  },
  currentCatId: null,
  reviewQueue: [],
  reviewIndex: 0,
  modalType: '',

  /* -----------------------------------------------------------
   *  初始化
   * ----------------------------------------------------------- */
  init() {
    this.load();
    this.ensureDemoData();
    this.bindTabs();
    this.renderHome();
    this.renderPlan();

    // 点击遮罩关闭模态框
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') this.closeModal();
    });

    // 复习卡片点击翻转
    document.getElementById('review-card').addEventListener('click', () => {
      const card = document.getElementById('review-card');
      card.classList.toggle('flipped');
      if (card.classList.contains('flipped')) {
        document.getElementById('rating-bar').style.display = 'grid';
      }
    });
  },

  /* -----------------------------------------------------------
   *  localStorage 持久化
   * ----------------------------------------------------------- */
  save() {
    localStorage.setItem('flashcard_data_v1', JSON.stringify(this.data));
  },
  load() {
    const raw = localStorage.getItem('flashcard_data_v1');
    if (raw) {
      try { this.data = JSON.parse(raw); } catch (e) {}
    }
  },

  /* -----------------------------------------------------------
   *  首次使用：注入示例数据
   * ----------------------------------------------------------- */
  ensureDemoData() {
    if (this.data.categories.length > 0) return;
    const cats = [
      { id: this.uid(), name: '英语四六级', icon: '📚', color: '#4a90d9' },
      { id: this.uid(), name: '专业课', icon: '🎓', color: '#e67e22' },
      { id: this.uid(), name: '考研政治', icon: '📖', color: '#27ae60' }
    ];
    const demoCards = [
      { id: this.uid(), catId: cats[0].id, front: 'ambiguous', back: 'adj. 模棱两可的；含糊不清的\n例：The instructions were ambiguous.', level: 0, nextReview: this.todayStr(), createdAt: this.todayStr(), mastered: false },
      { id: this.uid(), catId: cats[0].id, front: 'comprehensive', back: 'adj. 综合的；全面的\n例：a comprehensive survey', level: 0, nextReview: this.todayStr(), createdAt: this.todayStr(), mastered: false },
      { id: this.uid(), catId: cats[1].id, front: '数据库三大范式', back: '第一范式：字段不可再分\n第二范式：消除部分函数依赖\n第三范式：消除传递函数依赖', level: 0, nextReview: this.todayStr(), createdAt: this.todayStr(), mastered: false },
      { id: this.uid(), catId: cats[2].id, front: '马克思主义活的灵魂', back: '具体问题具体分析', level: 0, nextReview: this.todayStr(), createdAt: this.todayStr(), mastered: false },
      { id: this.uid(), catId: cats[2].id, front: '新民主主义革命总路线', back: '无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。', level: 0, nextReview: this.todayStr(), createdAt: this.todayStr(), mastered: false }
    ];
    this.data.categories = cats;
    this.data.cards = demoCards;
    this.save();
  },

  /* -----------------------------------------------------------
   *  工具函数
   * ----------------------------------------------------------- */
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); },
  todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  },
  addDays(dateStr, days) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setDate(d.getDate() + days);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  },
  isToday(dateStr) { return dateStr === this.todayStr(); },
  isPast(dateStr) { return dateStr < this.todayStr(); },

  /* -----------------------------------------------------------
   *  页面切换
   * ----------------------------------------------------------- */
  bindTabs() {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        this.showPage(tab.dataset.page);
      });
    });
  },
  showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.getElementById('fab-add').style.display = (name === 'home' || name === 'cards') ? 'flex' : 'none';
    if (name === 'home') this.renderHome();
    if (name === 'plan') this.renderPlan();
  },

  /* -----------------------------------------------------------
   *  渲染首页
   * ----------------------------------------------------------- */
  renderHome() {
    const todayCards = this.getTodayCards();
    const mastered = this.data.cards.filter(c => c.mastered).length;
    document.getElementById('stat-total').textContent = this.data.cards.length;
    document.getElementById('stat-today').textContent = todayCards.length;
    document.getElementById('stat-mastered').textContent = mastered;
    document.getElementById('today-count').textContent = todayCards.length;
    document.getElementById('cat-count').textContent = this.data.categories.length + ' 个';

    const box = document.getElementById('today-box');
    if (todayCards.length === 0) {
      box.querySelector('.info h3').textContent = '今日无复习任务';
      box.querySelector('.info p').innerHTML = '太棒了！今天没有待复习的卡片，去添加新知识吧 🎉';
      box.querySelector('.btn-review').style.display = 'none';
    } else {
      box.querySelector('.info h3').textContent = '今日复习任务';
      box.querySelector('.info p').innerHTML = `根据艾宾浩斯遗忘曲线，今天有 <b>${todayCards.length}</b> 张卡片待复习`;
      box.querySelector('.btn-review').style.display = 'block';
      box.querySelector('.btn-review').onclick = () => this.startReview();
    }

    const list = document.getElementById('cat-list');
    list.innerHTML = this.data.categories.map(cat => {
      const count = this.data.cards.filter(c => c.catId === cat.id).length;
      return `
        <div class="cat-card" onclick="app.showCards('${cat.id}')">
          <div class="icon" style="background:${cat.color}15;color:${cat.color}">${cat.icon}</div>
          <div class="meta">
            <h4>${cat.name}</h4>
            <p>${count} 张闪卡</p>
          </div>
          <div class="arrow">›</div>
        </div>
      `;
    }).join('');
  },

  /* -----------------------------------------------------------
   *  渲染闪卡列表
   * ----------------------------------------------------------- */
  showCards(catId) {
    this.currentCatId = catId;
    const cat = this.data.categories.find(c => c.id === catId);
    document.getElementById('cards-title').textContent = cat ? cat.name : '闪卡列表';
    this.renderCardList();
    this.showPage('cards');
  },
  renderCardList() {
    const list = document.getElementById('card-list');
    const cards = this.data.cards.filter(c => c.catId === this.currentCatId);
    if (cards.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="big">📝</div>
          <h3>暂无闪卡</h3>
          <p>点击右下角 + 添加第一张闪卡</p>
        </div>`;
      return;
    }
    list.innerHTML = cards.map(card => {
      let badge = '<span class="badge badge-new">新卡片</span>';
      if (card.mastered) badge = '<span class="badge badge-mastered">已掌握</span>';
      else if (this.isPast(card.nextReview) || this.isToday(card.nextReview)) badge = '<span class="badge badge-review">待复习</span>';
      else if (card.level > 0) badge = '<span class="badge badge-fuzzy">复习中</span>';
      return `
        <div class="flash-card" onclick="app.editCard('${card.id}')">
          <div class="front">${this.escapeHtml(card.front)}</div>
          <div class="back-preview">${this.escapeHtml(card.back)}</div>
          <div class="badges">${badge}</div>
        </div>
      `;
    }).join('');
  },

  /* -----------------------------------------------------------
   *  获取今日需复习的卡片
   *  规则：nextReview <= 今天 且未掌握
   * ----------------------------------------------------------- */
  getTodayCards() {
    return this.data.cards.filter(c => !c.mastered && (this.isPast(c.nextReview) || this.isToday(c.nextReview)));
  },

  /* -----------------------------------------------------------
   *  开始复习
   * ----------------------------------------------------------- */
  startReview() {
    this.reviewQueue = this.getTodayCards();
    if (this.reviewQueue.length === 0) {
      this.toast('今天没有待复习的卡片');
      return;
    }
    this.reviewIndex = 0;
    this.showPage('review');
    this.renderReviewCard();
  },
  renderReviewCard() {
    const card = this.reviewQueue[this.reviewIndex];
    document.getElementById('review-front').textContent = card.front;
    document.getElementById('review-back').textContent = card.back;
    document.getElementById('review-card').classList.remove('flipped');
    document.getElementById('rating-bar').style.display = 'none';

    const total = this.reviewQueue.length;
    const current = this.reviewIndex + 1;
    document.getElementById('review-bar').style.width = (current / total * 100) + '%';
    document.getElementById('review-txt').textContent = `${current} / ${total}`;
  },
  rateCard(rating) {
    const card = this.reviewQueue[this.reviewIndex];
    if (rating === 'mastered') {
      card.mastered = true;
      card.level = REVIEW_INTERVALS.length;
    } else if (rating === 'fuzzy') {
      // 模糊：重置为最低级，明天再复习
      card.level = 0;
      card.nextReview = this.addDays(this.todayStr(), 1);
      card.mastered = false;
    } else if (rating === 'known') {
      // 记得：按艾宾浩斯曲线推进
      if (!card.mastered) {
        card.level = Math.min(card.level + 1, REVIEW_INTERVALS.length - 1);
        const days = REVIEW_INTERVALS[card.level];
        card.nextReview = this.addDays(this.todayStr(), days);
      }
    }
    this.save();
    this.reviewIndex++;
    if (this.reviewIndex >= this.reviewQueue.length) {
      this.toast('本轮复习完成！🎉');
      this.endReview();
    } else {
      this.renderReviewCard();
    }
  },
  endReview() {
    this.showPage('home');
    this.renderHome();
  },

  /* -----------------------------------------------------------
   *  渲染复习计划页
   * ----------------------------------------------------------- */
  renderPlan() {
    const list = document.getElementById('plan-list');
    const days = [];
    for (let i = 0; i < 14; i++) {
      days.push(this.addDays(this.todayStr(), i));
    }

    list.innerHTML = days.map(date => {
      const isToday = date === this.todayStr();
      const tag = isToday ? '<span class="tag tag-today">今天</span>' : '<span class="tag tag-future">未来</span>';
      const items = this.data.cards.filter(c => !c.mastered && c.nextReview === date).map(c => {
        const cat = this.data.categories.find(x => x.id === c.catId);
        let dotClass = 'dot-new';
        if (c.level === 1) dotClass = 'dot-review1';
        else if (c.level === 2) dotClass = 'dot-review2';
        else if (c.level >= 3) dotClass = 'dot-review3';
        return `
          <div class="plan-item">
            <div class="dot ${dotClass}"></div>
            <div style="flex:1">${this.escapeHtml(c.front)}</div>
            <div style="color:var(--text-secondary);font-size:11px">${cat ? cat.name : ''}</div>
          </div>
        `;
      }).join('');

      if (!items) return '';
      return `
        <div class="plan-date">
          <h4>${date} ${tag}</h4>
          <div class="plan-items">${items}</div>
        </div>
      `;
    }).join('');

    if (!list.innerHTML.trim()) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="big">📅</div>
          <h3>暂无复习计划</h3>
          <p>添加闪卡后会自动生成复习计划</p>
        </div>`;
    }
  },

  /* -----------------------------------------------------------
   *  模态框：新建 / 编辑
   * ----------------------------------------------------------- */
  openAddModal() {
    const page = document.querySelector('.page.active').id;
    if (page === 'page-home') {
      this.openCategoryModal();
    } else if (page === 'page-cards') {
      this.openCardModal();
    }
  },
  openCategoryModal(editId = null) {
    this.modalType = editId ? 'edit-cat' : 'new-cat';
    const cat = editId ? this.data.categories.find(c => c.id === editId) : null;
    document.getElementById('modal-title').textContent = editId ? '编辑分类' : '新建分类';
    document.getElementById('modal-body').innerHTML = `
      <div class="form-group">
        <label>分类名称</label>
        <input type="text" id="inp-cat-name" placeholder="例如：英语四六级" value="${cat ? cat.name : ''}">
      </div>
      <div class="form-group">
        <label>图标 emoji</label>
        <input type="text" id="inp-cat-icon" placeholder="例如：📚" value="${cat ? cat.icon : '📚'}">
      </div>
      <div class="form-group">
        <label>主题色</label>
        <select id="inp-cat-color">
          <option value="#4a90d9" ${cat && cat.color==='#4a90d9'?'selected':''}>蓝色</option>
          <option value="#e67e22" ${cat && cat.color==='#e67e22'?'selected':''}>橙色</option>
          <option value="#27ae60" ${cat && cat.color==='#27ae60'?'selected':''}>绿色</option>
          <option value="#9b59b6" ${cat && cat.color==='#9b59b6'?'selected':''}>紫色</option>
          <option value="#e74c3c" ${cat && cat.color==='#e74c3c'?'selected':''}>红色</option>
        </select>
      </div>
    `;
    document.getElementById('modal-confirm').onclick = () => {
      const name = document.getElementById('inp-cat-name').value.trim();
      const icon = document.getElementById('inp-cat-icon').value.trim() || '📚';
      const color = document.getElementById('inp-cat-color').value;
      if (!name) { this.toast('请输入分类名称'); return; }
      if (editId) {
        const c = this.data.categories.find(x => x.id === editId);
        c.name = name; c.icon = icon; c.color = color;
      } else {
        this.data.categories.push({ id: this.uid(), name, icon, color });
      }
      this.save();
      this.closeModal();
      this.renderHome();
      this.toast(editId ? '分类已更新' : '分类创建成功');
    };
    document.getElementById('modal-overlay').classList.add('show');
  },
  openCardModal(editId = null) {
    this.modalType = editId ? 'edit-card' : 'new-card';
    const card = editId ? this.data.cards.find(c => c.id === editId) : null;
    const catOptions = this.data.categories.map(c =>
      `<option value="${c.id}" ${(card ? card.catId : this.currentCatId) === c.id ? 'selected' : ''}>${c.name}</option>`
    ).join('');
    document.getElementById('modal-title').textContent = editId ? '编辑闪卡' : '新建闪卡';
    document.getElementById('modal-body').innerHTML = `
      <div class="form-group">
        <label>所属分类</label>
        <select id="inp-card-cat">${catOptions}</select>
      </div>
      <div class="form-group">
        <label>正面（问题 / 知识点）</label>
        <textarea id="inp-card-front" placeholder="输入问题或知识点标题">${card ? card.front : ''}</textarea>
      </div>
      <div class="form-group">
        <label>背面（答案 / 详细内容）</label>
        <textarea id="inp-card-back" placeholder="输入答案或详细解释">${card ? card.back : ''}</textarea>
      </div>
    `;
    document.getElementById('modal-confirm').onclick = () => {
      const catId = document.getElementById('inp-card-cat').value;
      const front = document.getElementById('inp-card-front').value.trim();
      const back = document.getElementById('inp-card-back').value.trim();
      if (!front || !back) { this.toast('请填写正面和背面内容'); return; }
      if (editId) {
        const c = this.data.cards.find(x => x.id === editId);
        c.catId = catId; c.front = front; c.back = back;
      } else {
        this.data.cards.push({
          id: this.uid(), catId, front, back,
          level: 0, nextReview: this.todayStr(),
          createdAt: this.todayStr(), mastered: false
        });
      }
      this.save();
      this.closeModal();
      if (this.currentCatId) this.renderCardList();
      this.renderHome();
      this.renderPlan();
      this.toast(editId ? '闪卡已更新' : '闪卡创建成功');
    };
    document.getElementById('modal-overlay').classList.add('show');
  },
  editCard(id) {
    this.openCardModal(id);
  },
  closeModal() {
    document.getElementById('modal-overlay').classList.remove('show');
  },

  /* -----------------------------------------------------------
   *  设置：导出 / 导入 / 清空
   * ----------------------------------------------------------- */
  exportData() {
    const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `flashcards_backup_${this.todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    this.toast('数据已导出');
  },
  importData(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.categories && data.cards) {
          this.data = data;
          this.save();
          this.renderHome();
          this.renderPlan();
          this.toast('数据导入成功');
        } else {
          this.toast('文件格式不正确');
        }
      } catch (err) {
        this.toast('导入失败：文件格式错误');
      }
    };
    reader.readAsText(file);
    input.value = '';
  },
  clearAll() {
    if (!confirm('确定要清空所有数据吗？此操作不可恢复！')) return;
    this.data = { categories: [], cards: [] };
    this.save();
    this.renderHome();
    this.renderPlan();
    this.toast('所有数据已清空');
  },

  /* -----------------------------------------------------------
   *  辅助
   * ----------------------------------------------------------- */
  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  },
  escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
};

/* 启动 */
app.init();
</script>

</body>
</html>
