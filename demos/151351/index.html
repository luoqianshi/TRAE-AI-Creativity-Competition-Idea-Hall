<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>练枪助手</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'JetBrains Mono', 'Orbitron', sans-serif;
      background-color: #050508;
      color: #ffffff;
      overflow: hidden;
    }

    #app { width: 100vw; height: 100vh; display: flex; }

    #scene-container { flex: 1; position: relative; cursor: none; }

    #crosshair {
      position: absolute;
      pointer-events: none;
      z-index: 100;
      transform: translate(-50%, -50%);
      transition: none;
    }

    .crosshair-dot { width: 12px; height: 12px; background: #ff4444; border-radius: 50%; box-shadow: 0 0 15px #ff4444, 0 0 30px rgba(255, 68, 68, 0.5); }

    .crosshair-cross { width: 30px; height: 30px; position: relative; }
    .crosshair-cross::before, .crosshair-cross::after {
      content: ''; position: absolute; background: #ff4444; box-shadow: 0 0 10px #ff4444;
    }
    .crosshair-cross::before { width: 3px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
    .crosshair-cross::after { width: 100%; height: 3px; top: 50%; left: 0; transform: translateY(-50%); }

    .crosshair-circle { width: 32px; height: 32px; border: 3px solid #ff4444; border-radius: 50%; box-shadow: 0 0 15px #ff4444; }

    .crosshair-circle-cross { width: 32px; height: 32px; border: 3px solid #ff4444; border-radius: 50%; position: relative; box-shadow: 0 0 15px #ff4444; }
    .crosshair-circle-cross::before, .crosshair-circle-cross::after {
      content: ''; position: absolute; background: #ff4444; box-shadow: 0 0 10px #ff4444;
    }
    .crosshair-circle-cross::before { width: 3px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
    .crosshair-circle-cross::after { width: 100%; height: 3px; top: 50%; left: 0; transform: translateY(-50%); }

    .sidebar { width: 300px; background: rgba(10, 10, 20, 0.95); backdrop-filter: blur(10px); border-left: 1px solid #2a2a3e; display: flex; flex-direction: column; }

    .logo { padding: 24px; border-bottom: 1px solid #1a1a2e; display: flex; align-items: center; gap: 14px; }
    .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #ff4444, #ff8800); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #0a0a0f; }
    .logo-icon svg { width: 28px; height: 28px; }
    .logo-text h1 { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 2px; }
    .logo-text p { font-size: 11px; color: #ff8800; }

    .nav { padding: 12px; border-bottom: 1px solid #1a1a2e; }
    .nav-btn {
      width: 100%; padding: 14px 18px; margin-bottom: 6px; border: none; border-radius: 10px;
      background: transparent; color: #888; font-size: 14px; font-family: inherit; cursor: pointer;
      display: flex; align-items: center; gap: 12px; transition: all 0.2s;
    }
    .nav-btn:hover { background: rgba(255, 68, 68, 0.1); color: #fff; }
    .nav-btn.active { background: rgba(255, 68, 68, 0.15); color: #ff4444; }
    .nav-btn svg { width: 20px; height: 20px; }

    .content { flex: 1; overflow-y: auto; padding: 20px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .section-title { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

    .mode-cards { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 20px; }
    .mode-card {
      padding: 16px; border-radius: 12px; border: 1px solid #2a2a3e; background: rgba(26, 26, 46, 0.8); cursor: pointer; transition: all 0.3s;
    }
    .mode-card:hover { border-color: rgba(255, 68, 68, 0.5); transform: translateX(4px); }
    .mode-card.active { border-color: #ff4444; background: rgba(255, 68, 68, 0.1); }
    .mode-card .icon { width: 40px; height: 40px; background: rgba(255, 68, 68, 0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
    .mode-card.active .icon { background: rgba(255, 68, 68, 0.2); }
    .mode-card .icon svg { width: 22px; height: 22px; color: #ff4444; }
    .mode-card h3 { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .mode-card p { font-size: 11px; color: #777; line-height: 1.4; }

    .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: linear-gradient(135deg, #ff4444, #ff8800); color: #0a0a0f; }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(255, 68, 68, 0.4); }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-secondary:hover { background: #444; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .stat-card { padding: 14px; border-radius: 10px; background: rgba(26, 26, 46, 0.8); }
    .stat-card .label { font-size: 11px; color: #666; margin-bottom: 6px; }
    .stat-card .value { font-size: 24px; font-weight: 700; color: #fff; }
    .stat-card .value.cyan { color: #00d4ff; }
    .stat-card .value.purple { color: #a855f7; }
    .stat-card .value.yellow { color: #eab308; }
    .stat-card .value.red { color: #ff4444; }

    .progress-bar { height: 5px; background: #333; border-radius: 3px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #ff4444, #ff8800); border-radius: 3px; transition: width 0.3s; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 8px; }
    .form-group select, .form-group input {
      width: 100%; padding: 12px; border: 1px solid #2a2a3e; border-radius: 10px;
      background: rgba(26, 26, 46, 0.8); color: #fff; font-size: 14px; font-family: inherit; outline: none;
    }
    .form-group select:focus, .form-group input:focus { border-color: #ff4444; }
    .form-group select option { background: #1a1a2e; }

    .result-box {
      padding: 20px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(255, 68, 68, 0.15), rgba(255, 136, 0, 0.15));
      border: 1px solid rgba(255, 68, 68, 0.3); margin-top: 14px;
    }
    .result-box .label { font-size: 12px; color: #888; margin-bottom: 6px; }
    .result-box .value { font-size: 36px; font-weight: 700; color: #ff4444; }
    .result-box .hint { font-size: 11px; color: #666; margin-top: 6px; }

    .conversion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .conv-item { padding: 10px; border-radius: 8px; background: rgba(26, 26, 46, 0.8); border: 1px solid #2a2a3e; }
    .conv-item.active { border-color: #ff4444; background: rgba(255, 68, 68, 0.15); }
    .conv-item .game { font-size: 11px; color: #666; }
    .conv-item .value { font-size: 16px; font-weight: 600; color: #fff; }
    .conv-item.active .value { color: #ff4444; }

    .history-list { margin-top: 14px; }
    .history-item {
      padding: 14px; border-radius: 10px; background: rgba(26, 26, 46, 0.8); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-item .info { display: flex; align-items: center; gap: 12px; }
    .history-item .mode-badge { width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 68, 68, 0.15); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #ff4444; }
    .history-item .text h4 { font-size: 13px; color: #fff; }
    .history-item .text p { font-size: 11px; color: #666; }
    .history-item .stats { display: flex; gap: 14px; align-items: center; }
    .history-item .stat { text-align: center; }
    .history-item .stat .num { font-size: 14px; font-weight: 600; color: #fff; }
    .history-item .stat .label { font-size: 9px; color: #666; }
    .history-item .delete { width: 28px; height: 28px; border: none; background: transparent; color: #666; cursor: pointer; border-radius: 6px; }
    .history-item .delete:hover { background: rgba(239, 68, 68, 0.2); color: #ef4444; }

    .setting-group { margin-bottom: 18px; }
    .setting-group label { font-size: 13px; color: #888; margin-bottom: 10px; display: block; }
    .style-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .style-option {
      padding: 12px; border: 1px solid #2a2a3e; border-radius: 10px;
      background: rgba(26, 26, 46, 0.8); color: #888; font-size: 13px; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .style-option.active { border-color: #ff4444; background: rgba(255, 68, 68, 0.15); color: #ff4444; }

    .color-picker { width: 48px; height: 44px; border: none; border-radius: 10px; cursor: pointer; background: transparent; }
    .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker::-webkit-color-swatch { border-radius: 8px; border: none; }

    input[type="range"] { width: 100%; height: 8px; -webkit-appearance: none; appearance: none; background: #2a2a3e; border-radius: 4px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #ff4444; border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

    .empty-state { text-align: center; padding: 40px 20px; color: #666; }
    .empty-state svg { width: 56px; height: 56px; margin-bottom: 14px; opacity: 0.5; }

    .start-overlay {
      position: absolute; inset: 0; background: rgba(5, 5, 8, 0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50;
    }
    .start-overlay .icon {
      width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #ff4444, #ff8800);
      display: flex; align-items: center; justify-content: center; margin-bottom: 24px;
      box-shadow: 0 0 60px rgba(255, 68, 68, 0.5); animation: pulse 2s ease-in-out infinite;
    }
    .start-overlay .icon svg { width: 50px; height: 50px; color: #fff; }
    .start-overlay h2 { font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .start-overlay p { font-size: 15px; color: #888; margin-bottom: 30px; }

    @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(255, 68, 68, 0.5); } 50% { transform: scale(1.08); box-shadow: 0 0 80px rgba(255, 68, 68, 0.7); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(10, 10, 20, 0.95); }
    ::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a4e; }
  </style>
</head>
<body>
  <div id="app">
    <div id="scene-container">
      <div id="crosshair" class="crosshair-cross"></div>
      <div id="start-overlay" class="start-overlay">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
        <h2>准备开始训练</h2>
        <p>选择训练模式后点击下方按钮开始</p>
        <button id="start-btn" class="btn btn-primary" style="width: auto; padding: 16px 40px; font-size: 18px;">开始训练</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div>
        <div class="logo-text"><h1>练枪助手</h1><p>FPS训练工具</p></div>
      </div>

      <div class="nav">
        <button class="nav-btn active" data-tab="training">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>练枪模式
        </button>
        <button class="nav-btn" data-tab="sensitivity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>灵敏度转换
        </button>
        <button class="nav-btn" data-tab="stats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>数据统计
        </button>
        <button class="nav-btn" data-tab="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>设置
        </button>
      </div>

      <div class="content">
        <div id="tab-training" class="tab-panel active">
          <div class="section-title">选择训练模式</div>
          <div class="mode-cards">
            <div class="mode-card active" data-mode="static"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></div><h3>静态靶</h3><p>测试精准度，靶标随机出现并保持静止</p></div>
            <div class="mode-card" data-mode="dynamic"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 10 10 20 4 14"/></svg></div><h3>动态靶</h3><p>测试追踪能力，靶标以随机方向移动</p></div>
            <div class="mode-card" data-mode="reaction"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><h3>反应训练</h3><p>测试反应速度，靶标快速出现后消失</p></div>
            <div class="mode-card" data-mode="tracking"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M19.07 4.93l-14.14 14.14"/></svg></div><h3>八向追踪</h3><p>测试持续追踪，靶标沿八方向直线移动</p></div>
          </div>

          <div class="stats-grid">
            <div class="stat-card"><div class="label">命中率</div><div class="value red" id="stat-accuracy">0%</div><div class="progress-bar"><div class="progress-fill" id="progress-accuracy" style="width: 0%"></div></div></div>
            <div class="stat-card"><div class="label">命中次数</div><div class="value purple" id="stat-hits">0</div></div>
            <div class="stat-card"><div class="label">平均反应时间</div><div class="value yellow" id="stat-reaction">0</div><div class="label" style="margin-top: 2px; font-size: 9px">ms</div></div>
            <div class="stat-card"><div class="label">失误次数</div><div class="value" id="stat-misses">0</div></div>
          </div>

          <button id="reset-btn" class="btn btn-secondary" style="margin-bottom: 10px;">重置统计</button>
          <button id="save-btn" class="btn btn-primary">保存记录</button>
        </div>

        <div id="tab-sensitivity" class="tab-panel">
          <div class="section-title">灵敏度转换器</div>
          <div class="form-group"><label>源游戏</label><select id="from-game">
            <option value="cs2">CS2</option><option value="csgo">CS:GO</option><option value="valorant">Valorant</option><option value="apex">Apex Legends</option><option value="overwatch2">Overwatch 2</option><option value="r6">Rainbow Six Siege</option><option value="pubg">PUBG</option><option value="fortnite">Fortnite</option><option value="deltaforce" selected>三角洲行动</option><option value="quake">Quake Champions</option><option value="tf2">Team Fortress 2</option>
          </select></div>
          <div class="form-group"><label>目标游戏</label><select id="to-game">
            <option value="cs2">CS2</option><option value="csgo">CS:GO</option><option value="valorant">Valorant</option><option value="apex">Apex Legends</option><option value="overwatch2">Overwatch 2</option><option value="r6">Rainbow Six Siege</option><option value="pubg">PUBG</option><option value="fortnite">Fortnite</option><option value="deltaforce" selected>三角洲行动</option><option value="quake">Quake Champions</option><option value="tf2">Team Fortress 2</option>
          </select></div>
          <div class="form-group"><label>源灵敏度</label><input type="number" id="sensitivity" value="2.5" step="0.01" min="0"/></div>
          <div class="form-group"><label>鼠标 DPI</label><input type="number" id="dpi" value="800" step="100" min="0"/></div>
          <div class="result-box"><div class="label">转换结果</div><div class="value" id="conversion-result">0</div><div class="hint" id="conversion-hint"></div></div>
          <div class="conversion-grid" id="conversion-grid"></div>
        </div>

        <div id="tab-stats" class="tab-panel">
          <div class="stats-grid" style="margin-top: 0;">
            <div class="stat-card"><div class="label">总命中</div><div class="value red" id="total-hits">0</div></div>
            <div class="stat-card"><div class="label">总失误</div><div class="value" id="total-misses">0</div></div>
            <div class="stat-card"><div class="label">平均命中率</div><div class="value" style="color:#22c55e" id="avg-accuracy">0%</div></div>
            <div class="stat-card"><div class="label">训练记录</div><div class="value yellow" id="total-records">0</div></div>
          </div>
          <button id="clear-all-btn" class="btn btn-danger" style="margin-bottom: 14px; display: none;">清空所有记录</button>
          <div class="history-list" id="history-list">
            <div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg><p>暂无训练记录</p><p style="font-size: 11px; margin-top: 4px;">完成训练后点击"保存记录"即可查看</p></div>
          </div>
        </div>

        <div id="tab-settings" class="tab-panel">
          <div class="setting-group"><label>准星样式</label><div class="style-options">
            <div class="style-option active" data-style="dot">圆点</div><div class="style-option" data-style="circle">圆圈</div><div class="style-option" data-style="cross">十字</div><div class="style-option" data-style="circle-cross">圆圈十字</div>
          </div></div>
          <div class="setting-group"><label>准星颜色</label><input type="color" class="color-picker" id="crosshair-color" value="#ff4444"/></div>
          <div class="setting-group"><label>准星大小: <span id="crosshair-size-val">8</span></label><input type="range" id="crosshair-size" min="4" max="24" value="8"/></div>
          <div class="setting-group"><label>靶标大小: <span id="target-size-val">40</span>px</label><input type="range" id="target-size" min="20" max="80" value="40"/></div>
          <div class="setting-group"><label>靶标速度: <span id="target-speed-val">1.0</span></label><input type="range" id="target-speed" min="0.2" max="3" step="0.1" value="1"/></div>
          <div class="setting-group"><label>靶标寿命: <span id="target-lifetime-val">3000</span>ms</label><input type="range" id="target-lifetime" min="1000" max="5000" step="500" value="3000"/></div>
          <div class="setting-group"><label>生成间隔: <span id="spawn-delay-val">800</span>ms</label><input type="range" id="spawn-delay" min="300" max="2000" step="100" value="800"/></div>
          <div class="setting-group"><label>最大靶标数: <span id="max-targets-val">5</span></label><input type="range" id="max-targets" min="1" max="10" value="5"/></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const gameList = [
      { name: 'CS2', slug: 'cs2', multiplier: 1.0 },
      { name: 'CS:GO', slug: 'csgo', multiplier: 1.0 },
      { name: 'Valorant', slug: 'valorant', multiplier: 0.008333 },
      { name: 'Apex Legends', slug: 'apex', multiplier: 0.001 },
      { name: 'Overwatch 2', slug: 'overwatch2', multiplier: 0.001 },
      { name: 'Rainbow Six Siege', slug: 'r6', multiplier: 0.001 },
      { name: 'PUBG', slug: 'pubg', multiplier: 0.001 },
      { name: 'Fortnite', slug: 'fortnite', multiplier: 0.0005 },
      { name: '三角洲行动', slug: 'deltaforce', multiplier: 0.002 },
      { name: 'Quake Champions', slug: 'quake', multiplier: 0.001 },
      { name: 'Team Fortress 2', slug: 'tf2', multiplier: 1.0 },
    ];

    const getGameBySlug = (slug) => gameList.find(g => g.slug === slug);
    const convertSensitivity = (fromGame, toGame, sensitivity) => {
      const csgoEquivalent = sensitivity * fromGame.multiplier;
      return Math.round((csgoEquivalent / toGame.multiplier) * 10000) / 10000;
    };

    const eightDirections = [
      { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 0, y: -1 },
      { x: 1, y: 1 }, { x: 1, y: -1 }, { x: -1, y: 1 }, { x: -1, y: -1 },
    ];

    let scene, camera, renderer, targets = [], particles = [], isRunning = false, selectedMode = 'static', mouseX = 0, mouseY = 0;
    let currentStats = { hits: 0, misses: 0, accuracy: 0, totalShots: 0, reactionTimes: [], avgReactionTime: 0 };
    let settings = { targetSize: 40, targetSpeed: 1.0, targetLifetime: 3000, spawnDelay: 800, maxTargets: 5, crosshairStyle: 'cross', crosshairColor: '#ff4444', crosshairSize: 8 };
    let lastSpawnTime = 0, targetIdCounter = 0, trackingDirectionIndex = 0;
    let trackingStartTime = 0, trackingDistance = 150;
    const container = document.getElementById('scene-container');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050508);

      camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 0, 500);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      createEnvironment();
      createLights();

      window.addEventListener('resize', onWindowResize);
      container.addEventListener('mousemove', onMouseMove);
      container.addEventListener('click', onMouseClick);

      loadRecords();
      updateSensitivityConversion();
      animate();
    }

    function createEnvironment() {
      const gridHelper = new THREE.GridHelper(800, 40, 0x2a2a3e, 0x1a1a2e);
      gridHelper.position.y = -200;
      scene.add(gridHelper);

      const wallGeometry = new THREE.PlaneGeometry(800, 500);
      const wallMaterial = new THREE.MeshPhongMaterial({ color: 0x0a0a12, transparent: true, opacity: 0.9 });
      const wall = new THREE.Mesh(wallGeometry, wallMaterial);
      wall.position.set(0, 0, -150);
      scene.add(wall);

      const sideWallLeft = new THREE.Mesh(wallGeometry, wallMaterial);
      sideWallLeft.position.set(-400, 0, 0);
      sideWallLeft.rotation.y = Math.PI / 2;
      scene.add(sideWallLeft);

      const sideWallRight = new THREE.Mesh(wallGeometry, wallMaterial);
      sideWallRight.position.set(400, 0, 0);
      sideWallRight.rotation.y = -Math.PI / 2;
      scene.add(sideWallRight);

      const cornerGeometry = new THREE.BoxGeometry(5, 5, 5);
      const cornerMaterial = new THREE.MeshPhongMaterial({ color: 0xff4444, emissive: 0xff4444, emissiveIntensity: 0.5 });
      const corners = [
        { x: -300, y: 150, z: -100 }, { x: 300, y: 150, z: -100 },
        { x: -300, y: -150, z: -100 }, { x: 300, y: -150, z: -100 },
        { x: -300, y: 150, z: 100 }, { x: 300, y: 150, z: 100 },
        { x: -300, y: -150, z: 100 }, { x: 300, y: -150, z: 100 },
      ];
      corners.forEach(pos => {
        const corner = new THREE.Mesh(cornerGeometry, cornerMaterial);
        corner.position.set(pos.x, pos.y, pos.z);
        scene.add(corner);
      });

      const pillarGeometry = new THREE.CylinderGeometry(10, 10, 300, 16);
      const pillarMaterial = new THREE.MeshPhongMaterial({ color: 0x1a1a2e, shininess: 20 });
      const pillars = [{ x: -300, z: -100 }, { x: 300, z: -100 }, { x: -300, z: 100 }, { x: 300, z: 100 }];
      pillars.forEach(pos => {
        const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
        pillar.position.set(pos.x, 0, pos.z);
        scene.add(pillar);
      });
    }

    function createLights() {
      const ambientLight = new THREE.AmbientLight(0x303040, 0.6);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
      directionalLight.position.set(200, 200, 200);
      scene.add(directionalLight);

      const directionalLight2 = new THREE.DirectionalLight(0xff8800, 0.3);
      directionalLight2.position.set(-100, 100, -100);
      scene.add(directionalLight2);

      const pointLight = new THREE.PointLight(0xff4444, 0.8, 500);
      pointLight.position.set(0, 100, 100);
      scene.add(pointLight);

      const pointLight2 = new THREE.PointLight(0x00d4ff, 0.5, 500);
      pointLight2.position.set(150, -50, 50);
      scene.add(pointLight2);

      const pointLight3 = new THREE.PointLight(0xa855f7, 0.4, 500);
      pointLight3.position.set(-150, 50, -50);
      scene.add(pointLight3);
    }

    function onWindowResize() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function onMouseMove(event) {
      const rect = container.getBoundingClientRect();
      mouseX = event.clientX - rect.left;
      mouseY = event.clientY - rect.top;
      const crosshair = document.getElementById('crosshair');
      crosshair.style.left = mouseX + 'px';
      crosshair.style.top = mouseY + 'px';
    }

    function onMouseClick(event) {
      if (!isRunning) return;
      const rect = container.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((event.clientX - rect.left) / rect.width) * 2 - 1,
        -((event.clientY - rect.top) / rect.height) * 2 + 1
      );
      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      const targetMeshes = targets.map(t => t.mesh);
      const intersects = raycaster.intersectObjects(targetMeshes);
      if (intersects.length > 0) {
        const hitTarget = targets.find(t => t.mesh === intersects[0].object);
        if (hitTarget) {
          const reactionTime = Date.now() - hitTarget.createdAt;
          createHitParticles(hitTarget.mesh.position);
          scene.remove(hitTarget.mesh);
          targets = targets.filter(t => t.id !== hitTarget.id);
          addHit(reactionTime);
        }
      } else {
        addMiss();
      }
    }

    function createHitParticles(position) {
      for (let i = 0; i < 16; i++) {
        const geometry = new THREE.SphereGeometry(4, 8, 8);
        const material = new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4444 : 0xff8800, transparent: true, opacity: 1 });
        const particle = new THREE.Mesh(geometry, material);
        particle.position.copy(position);
        const angle = (Math.PI * 2 * i) / 16;
        const speed = 3 + Math.random() * 4;
        particle.userData = { vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, vz: (Math.random() - 0.5) * 3, life: 1 };
        scene.add(particle);
        particles.push(particle);
      }
    }

    function spawnTarget() {
      if (targets.length >= settings.maxTargets) return;
      const size = settings.targetSize / 10;

      const geometry = new THREE.SphereGeometry(size, 16, 16);
      const gradientMaterial = new THREE.MeshPhongMaterial({
        color: 0xff4444,
        emissive: 0xff4444,
        emissiveIntensity: 0.4,
        shininess: 100,
        transparent: true,
        opacity: 0.9
      });
      const target = new THREE.Mesh(geometry, gradientMaterial);

      const padding = size + 60;
      const maxX = 250 - padding;
      const maxY = 180 - padding;

      target.position.set(
        (Math.random() - 0.5) * maxX * 2,
        (Math.random() - 0.5) * maxY * 2,
        -100 + Math.random() * 100
      );

      const newTarget = { id: targetIdCounter++, mesh: target, createdAt: Date.now(), lifetime: settings.targetLifetime, speed: null };

      if (selectedMode === 'dynamic') {
        const angle = Math.random() * Math.PI * 2;
        const speed = (0.6 + Math.random() * 1.2) * settings.targetSpeed;
        newTarget.speed = { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed, z: (Math.random() - 0.5) * 0.4 * settings.targetSpeed };
      }

      if (selectedMode === 'tracking') {
        target.position.set(0, 0, -50);
        newTarget.speed = { x: 0, y: 0, z: 0 };
        trackingStartTime = Date.now();
      }

      scene.add(target);
      targets.push(newTarget);
    }

    function updateTrackingTarget(target) {
      const now = Date.now();
      const baseDuration = 1500;
      const duration = baseDuration / settings.targetSpeed;
      const elapsed = now - trackingStartTime;
      const progress = (elapsed % duration) / duration;

      if (progress < 0.02 && elapsed > 0) {
        trackingDirectionIndex = (trackingDirectionIndex + 1) % eightDirections.length;
      }

      const direction = eightDirections[trackingDirectionIndex];
      const easeProgress = easeInOutQuad(progress);

      target.mesh.position.x = direction.x * trackingDistance * easeProgress;
      target.mesh.position.y = direction.y * trackingDistance * easeProgress;
      target.mesh.position.z = -50 + Math.sin(progress * Math.PI * 4) * 30;
    }

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function animate() {
      requestAnimationFrame(animate);
      const now = Date.now();

      if (isRunning) {
        if (now - lastSpawnTime > settings.spawnDelay) {
          spawnTarget();
          lastSpawnTime = now;
        }

        targets = targets.filter(target => {
          const age = now - target.createdAt;

          if (selectedMode === 'dynamic' && target.speed) {
            target.mesh.position.x += target.speed.x;
            target.mesh.position.y += target.speed.y;
            target.mesh.position.z += target.speed.z || 0;

            if (Math.abs(target.mesh.position.x) > 250) target.speed.x *= -1;
            if (Math.abs(target.mesh.position.y) > 180) target.speed.y *= -1;
            if (Math.abs(target.mesh.position.z) > 80) target.speed.z *= -1;
          }

          if (selectedMode === 'tracking' && targets.length > 0) {
            updateTrackingTarget(target);
          }

          if (age > target.lifetime) {
            if (selectedMode === 'reaction') addMiss();
            scene.remove(target.mesh);
            return false;
          }

          if (selectedMode !== 'tracking') {
            target.mesh.rotation.x += 0.02;
            target.mesh.rotation.y += 0.03;
          }

          return true;
        });
      }

      particles = particles.filter(particle => {
        particle.position.x += particle.userData.vx;
        particle.position.y += particle.userData.vy;
        particle.position.z += particle.userData.vz;
        particle.userData.life -= 0.015;
        particle.material.opacity = particle.userData.life;
        if (particle.userData.life <= 0) { scene.remove(particle); return false; }
        return true;
      });

      renderer.render(scene, camera);
    }

    function addHit(reactionTime) {
      currentStats.hits++;
      currentStats.totalShots++;
      currentStats.reactionTimes.push(reactionTime);
      currentStats.avgReactionTime = Math.round(currentStats.reactionTimes.reduce((a, b) => a + b, 0) / currentStats.reactionTimes.length);
      currentStats.accuracy = Math.round((currentStats.hits / currentStats.totalShots) * 100);
      updateStatsUI();
    }

    function addMiss() {
      currentStats.misses++;
      currentStats.totalShots++;
      currentStats.accuracy = currentStats.hits > 0 ? Math.round((currentStats.hits / currentStats.totalShots) * 100) : 0;
      updateStatsUI();
    }

    function updateStatsUI() {
      document.getElementById('stat-accuracy').textContent = currentStats.accuracy + '%';
      document.getElementById('progress-accuracy').style.width = currentStats.accuracy + '%';
      document.getElementById('stat-hits').textContent = currentStats.hits;
      document.getElementById('stat-misses').textContent = currentStats.misses;
      document.getElementById('stat-reaction').textContent = currentStats.avgReactionTime;
    }

    function resetStats() {
      currentStats = { hits: 0, misses: 0, accuracy: 0, totalShots: 0, reactionTimes: [], avgReactionTime: 0 };
      updateStatsUI();
    }

    function saveRecord() {
      if (currentStats.totalShots === 0) return;
      const record = {
        id: Date.now() + '-' + Math.random().toString(36).substr(2, 9),
        mode: selectedMode,
        date: new Date().toISOString(),
        hits: currentStats.hits,
        misses: currentStats.misses,
        accuracy: currentStats.accuracy,
        avgReactionTime: currentStats.avgReactionTime
      };
      const records = getRecords();
      records.unshift(record);
      localStorage.setItem('fps-training-records', JSON.stringify(records.slice(0, 100)));
      loadRecords();
      resetStats();
    }

    function getRecords() {
      try { const data = localStorage.getItem('fps-training-records'); return data ? JSON.parse(data) : []; } catch { return []; }
    }

    function loadRecords() {
      const records = getRecords();
      document.getElementById('total-hits').textContent = records.reduce((sum, r) => sum + r.hits, 0);
      document.getElementById('total-misses').textContent = records.reduce((sum, r) => sum + r.misses, 0);
      const totalShots = records.reduce((sum, r) => sum + r.hits + r.misses, 0);
      document.getElementById('avg-accuracy').textContent = (totalShots > 0 ? Math.round((records.reduce((sum, r) => sum + r.hits, 0) / totalShots) * 100) : 0) + '%';
      document.getElementById('total-records').textContent = records.length;

      const list = document.getElementById('history-list');
      if (records.length === 0) {
        list.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg><p>暂无训练记录</p><p style="font-size: 11px; margin-top: 4px;">完成训练后点击"保存记录"即可查看</p></div>';
        document.getElementById('clear-all-btn').style.display = 'none';
      } else {
        const modeNames = { static: '静态靶', dynamic: '动态靶', reaction: '反应训练', tracking: '八向追踪' };
        list.innerHTML = records.map(r => `<div class="history-item"><div class="info"><div class="mode-badge">${r.mode.charAt(0).toUpperCase()}</div><div class="text"><h4>${modeNames[r.mode] || r.mode}</h4><p>${new Date(r.date).toLocaleString('zh-CN')}</p></div></div><div class="stats"><div class="stat"><div class="num">${r.accuracy}%</div><div class="label">命中率</div></div><div class="stat"><div class="num">${r.hits}</div><div class="label">命中</div></div><button class="delete" onclick="deleteRecord('${r.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button></div></div>`).join('');
        document.getElementById('clear-all-btn').style.display = 'block';
      }
    }

    window.deleteRecord = function(id) {
      const records = getRecords().filter(r => r.id !== id);
      localStorage.setItem('fps-training-records', JSON.stringify(records));
      loadRecords();
    };

    function clearAllRecords() {
      if (confirm('确定要清空所有训练记录吗？')) {
        localStorage.removeItem('fps-training-records');
        loadRecords();
      }
    }

    function updateSensitivityConversion() {
      const fromGame = getGameBySlug(document.getElementById('from-game').value);
      const toGame = getGameBySlug(document.getElementById('to-game').value);
      const sensitivity = parseFloat(document.getElementById('sensitivity').value) || 0;
      const result = convertSensitivity(fromGame, toGame, sensitivity);
      document.getElementById('conversion-result').textContent = result;
      document.getElementById('conversion-hint').textContent = '在 ' + toGame.name + ' 中设置为 ' + result;
      const grid = document.getElementById('conversion-grid');
      grid.innerHTML = gameList.map(game => '<div class="conv-item ' + (game.slug === toGame.slug ? 'active' : '') + '"><div class="game">' + game.name + '</div><div class="value">' + convertSensitivity(fromGame, game, sensitivity) + '</div></div>').join('');
    }

    function startTraining() {
      isRunning = true;
      resetStats();
      document.getElementById('start-overlay').style.display = 'none';
      targets.forEach(t => scene.remove(t.mesh));
      targets = [];
      lastSpawnTime = Date.now();
      trackingStartTime = Date.now();
    }

    function updateCrosshairStyle(style) {
      settings.crosshairStyle = style;
      document.getElementById('crosshair').className = 'crosshair-' + style;
    }

    document.getElementById('start-btn').addEventListener('click', startTraining);
    document.getElementById('reset-btn').addEventListener('click', resetStats);
    document.getElementById('save-btn').addEventListener('click', saveRecord);
    document.getElementById('clear-all-btn').addEventListener('click', clearAllRecords);

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    document.querySelectorAll('.mode-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedMode = card.dataset.mode;
      });
    });

    document.querySelectorAll('.style-option').forEach(opt => {
      opt.addEventListener('click', () => {
        document.querySelectorAll('.style-option').forEach(o => o.classList.remove('active'));
        opt.classList.add('active');
        updateCrosshairStyle(opt.dataset.style);
      });
    });

    document.getElementById('target-size').addEventListener('input', (e) => {
      settings.targetSize = parseInt(e.target.value);
      document.getElementById('target-size-val').textContent = e.target.value;
    });

    document.getElementById('target-speed').addEventListener('input', (e) => {
      settings.targetSpeed = parseFloat(e.target.value);
      document.getElementById('target-speed-val').textContent = e.target.value;
    });

    document.getElementById('target-lifetime').addEventListener('input', (e) => {
      settings.targetLifetime = parseInt(e.target.value);
      document.getElementById('target-lifetime-val').textContent = e.target.value;
    });

    document.getElementById('spawn-delay').addEventListener('input', (e) => {
      settings.spawnDelay = parseInt(e.target.value);
      document.getElementById('spawn-delay-val').textContent = e.target.value;
    });

    document.getElementById('max-targets').addEventListener('input', (e) => {
      settings.maxTargets = parseInt(e.target.value);
      document.getElementById('max-targets-val').textContent = e.target.value;
    });

    document.getElementById('from-game').addEventListener('change', updateSensitivityConversion);
    document.getElementById('to-game').addEventListener('change', updateSensitivityConversion);
    document.getElementById('sensitivity').addEventListener('input', updateSensitivityConversion);
    document.getElementById('dpi').addEventListener('input', updateSensitivityConversion);

    init();
  </script>
</body>
</html>
