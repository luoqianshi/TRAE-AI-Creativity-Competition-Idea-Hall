<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>米家智装助手 Demo</title>
  <style>
    :root {
      --ink: #191612;
      --muted: #726a5f;
      --paper: #f5efe4;
      --card: #fffaf1;
      --line: #ded2bf;
      --clay: #d86f45;
      --clay-dark: #9d3f24;
      --sage: #627b62;
      --night: #1f2b28;
      --cream: #fff6e8;
      --gold: #d8a647;
      --shadow: 0 24px 70px rgba(59, 43, 28, 0.16);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(216, 111, 69, 0.18), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(98, 123, 98, 0.18), transparent 28%),
        linear-gradient(135deg, #f7efe2 0%, #efe4d2 48%, #f8f1e7 100%);
      font-family: "Avenir Next", "Gill Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.26;
      background-image:
        linear-gradient(rgba(31, 43, 40, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 43, 40, 0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }

    .shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      gap: 28px;
      align-items: stretch;
      margin-bottom: 26px;
    }

    .hero-card,
    .panel,
    .result-card {
      background: rgba(255, 250, 241, 0.9);
      border: 1px solid rgba(105, 82, 52, 0.18);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero-card {
      border-radius: var(--radius-xl);
      padding: 42px;
      min-height: 420px;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -88px;
      top: -88px;
      width: 260px;
      height: 260px;
      border-radius: 48%;
      background: rgba(216, 111, 69, 0.18);
      border: 1px solid rgba(216, 111, 69, 0.26);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--clay-dark);
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: var(--clay);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(44px, 6vw, 78px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      max-width: 760px;
    }

    .hero p {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
      max-width: 620px;
      margin: 24px 0 0;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    button,
    .ghost-button {
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      font-family: inherit;
    }

    button:hover,
    .ghost-button:hover {
      transform: translateY(-2px);
    }

    .primary {
      color: var(--cream);
      background: var(--night);
      box-shadow: 0 14px 28px rgba(31, 43, 40, 0.22);
    }

    .secondary,
    .ghost-button {
      color: var(--night);
      background: rgba(255, 246, 232, 0.7);
      border: 1px solid var(--line);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .demo-device {
      border-radius: var(--radius-xl);
      padding: 26px;
      min-height: 420px;
      background:
        linear-gradient(155deg, rgba(31, 43, 40, 0.96), rgba(54, 64, 51, 0.94)),
        var(--night);
      color: var(--cream);
      box-shadow: 0 28px 70px rgba(31, 43, 40, 0.26);
      position: relative;
      overflow: hidden;
    }

    .demo-device::before {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(255, 246, 232, 0.14);
      border-radius: 24px;
      pointer-events: none;
    }

    .device-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      color: rgba(255, 246, 232, 0.7);
      font-size: 13px;
    }

    .home-map {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      transform: rotate(-2deg);
    }

    .room {
      min-height: 92px;
      border: 1px solid rgba(255, 246, 232, 0.2);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255, 246, 232, 0.06);
      position: relative;
    }

    .room strong {
      display: block;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .dot {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 22px rgba(216, 166, 71, 0.72);
      margin-right: 7px;
      animation: pulse 2.2s ease-in-out infinite;
    }

    .room:nth-child(2) .dot {
      background: #f08f5e;
      animation-delay: 0.35s;
    }

    .room:nth-child(3) .dot {
      background: #9fb889;
      animation-delay: 0.65s;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.8); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 26px;
    }

    .stat {
      border-radius: 18px;
      padding: 16px;
      background: rgba(255, 246, 232, 0.1);
      border: 1px solid rgba(255, 246, 232, 0.14);
    }

    .stat b {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .stat span {
      color: rgba(255, 246, 232, 0.68);
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel,
    .result-card {
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .panel {
      position: sticky;
      top: 22px;
    }

    .section-title {
      margin: 0 0 16px;
      font-family: Georgia, "Songti SC", serif;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--night);
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.58);
      border-radius: 16px;
      padding: 13px 14px;
      font: inherit;
      color: var(--ink);
      outline: none;
      transition: border 160ms ease, box-shadow 160ms ease;
    }

    textarea {
      min-height: 108px;
      resize: vertical;
      line-height: 1.7;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: rgba(216, 111, 69, 0.8);
      box-shadow: 0 0 0 4px rgba(216, 111, 69, 0.12);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      position: relative;
    }

    .chip input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .chip span {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.46);
      font-size: 13px;
      font-weight: 700;
      transition: all 160ms ease;
    }

    .chip input:checked + span {
      background: var(--night);
      color: var(--cream);
      border-color: var(--night);
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .result-card {
      animation: rise 380ms ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: start;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(216, 111, 69, 0.12);
      color: var(--clay-dark);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .generated-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(98, 123, 98, 0.28);
      border-radius: 16px;
      color: var(--night);
      background: rgba(98, 123, 98, 0.12);
      font-size: 13px;
      font-weight: 800;
    }

    .generated-bar small {
      color: var(--muted);
      font-weight: 700;
    }

    .lead {
      color: var(--muted);
      line-height: 1.8;
      margin: 0;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .mini {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.38);
    }

    .mini b {
      display: block;
      margin-bottom: 6px;
    }

    .mini small {
      display: block;
      color: var(--muted);
      line-height: 1.6;
    }

    .device-list,
    .steps {
      display: grid;
      gap: 10px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
    }

    .device-list li,
    .steps li {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      align-items: start;
      padding: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(222, 210, 191, 0.8);
    }

    .num {
      display: inline-grid;
      place-items: center;
      min-width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--night);
      color: var(--cream);
      font-size: 12px;
      font-weight: 900;
    }

    .device-list p,
    .steps p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .tools {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .empty {
      border: 1px dashed rgba(105, 82, 52, 0.3);
      border-radius: var(--radius-lg);
      padding: 28px;
      text-align: center;
      color: var(--muted);
      background: rgba(255, 250, 241, 0.62);
    }

    .footer-note {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 940px) {
      .hero,
      .grid,
      .tools {
        grid-template-columns: 1fr;
      }

      .panel {
        position: static;
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100% - 24px, 1180px);
        padding-top: 18px;
      }

      .hero-card,
      .demo-device,
      .panel,
      .result-card {
        padding: 20px;
        border-radius: 22px;
      }

      .mini-grid,
      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-card">
        <div class="eyebrow">TRAE 初赛 Demo</div>
        <h1>米家智装助手</h1>
        <p>给想自己做全屋智能的小白用户一个 AI 协助者：从户型、预算和生活场景出发，一起梳理设备清单、房间规划、米家自动化步骤和排错建议。</p>
        <div class="hero-actions">
          <button class="primary" onclick="document.querySelector('#planner').scrollIntoView({behavior:'smooth'})">开始生成方案</button>
          <button class="secondary" onclick="fillSample()">填入演示样例</button>
        </div>
      </div>

      <aside class="demo-device" aria-label="智能家居示意图">
        <div class="device-top">
          <span>HOME MAP / MIJIA DIY</span>
          <span>在线 8 台设备</span>
        </div>
        <div class="home-map">
          <div class="room"><strong>玄关</strong><span class="dot"></span><span class="dot"></span></div>
          <div class="room"><strong>客厅</strong><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          <div class="room"><strong>卧室</strong><span class="dot"></span><span class="dot"></span></div>
          <div class="room"><strong>厨房</strong><span class="dot"></span></div>
        </div>
        <div class="stats">
          <div class="stat"><b>3</b><span>优先改造空间</span></div>
          <div class="stat"><b>6</b><span>推荐设备类型</span></div>
          <div class="stat"><b>2min</b><span>生成配置步骤</span></div>
        </div>
      </aside>
    </section>

    <section class="grid" id="planner">
      <form class="panel" onsubmit="event.preventDefault(); renderPlan();">
        <h2 class="section-title">生成你的家庭方案</h2>
        <div class="field">
          <label for="homeType">房屋类型</label>
          <select id="homeType">
            <option>一居室</option>
            <option selected>两室一厅</option>
            <option>三室两厅</option>
            <option>复式</option>
          </select>
        </div>
        <div class="field">
          <label for="stage">当前阶段</label>
          <select id="stage">
            <option>未装修</option>
            <option>装修中</option>
            <option selected>已入住</option>
            <option>租房</option>
          </select>
        </div>
        <div class="field">
          <label for="budget">预算范围</label>
          <select id="budget">
            <option value="1000以内">1000 元以内</option>
            <option value="1000-3000" selected>1000-3000 元</option>
            <option value="3000-8000">3000-8000 元</option>
            <option value="8000以上">8000 元以上</option>
          </select>
        </div>
        <div class="field">
          <label for="wiring">是否能改电路</label>
          <select id="wiring">
            <option>可以</option>
            <option selected>不可以</option>
            <option>不确定</option>
          </select>
        </div>
        <div class="field">
          <label>想实现的场景</label>
          <div class="chips" id="goalChips">
            <label class="chip"><input type="checkbox" value="回家模式" checked><span>回家模式</span></label>
            <label class="chip"><input type="checkbox" value="离家模式" checked><span>离家模式</span></label>
            <label class="chip"><input type="checkbox" value="起夜模式" checked><span>起夜模式</span></label>
            <label class="chip"><input type="checkbox" value="睡眠模式"><span>睡眠模式</span></label>
            <label class="chip"><input type="checkbox" value="观影模式"><span>观影模式</span></label>
            <label class="chip"><input type="checkbox" value="厨房安全"><span>厨房安全</span></label>
          </div>
        </div>
        <div class="field">
          <label for="members">家庭成员特点</label>
          <select id="members">
            <option>普通家庭</option>
            <option selected>有老人</option>
            <option>有儿童</option>
            <option>有宠物</option>
            <option>独居</option>
          </select>
        </div>
        <button class="primary" type="submit">生成 AI 方案</button>
        <p class="footer-note">初赛 Demo 采用规则库模拟 AI 生成能力，后续可以接入大模型与真实设备知识库。</p>
      </form>

      <div class="stack">
        <div id="planResult" class="empty">填写左侧信息，生成你的米家全屋智能 DIY 方案。</div>

        <section class="tools">
          <div class="result-card">
            <h2 class="section-title">场景编排助手</h2>
            <div class="field">
              <label for="sceneText">用一句话描述想要的自动化</label>
              <textarea id="sceneText">晚上 7 点以后回家，开门后自动打开客厅灯和空调，10 分钟没人就关闭</textarea>
            </div>
            <button class="primary" onclick="renderAutomation()">生成配置步骤</button>
            <div id="automationResult" class="footer-note">点击按钮后，将自然语言转成米家自动化配置。</div>
          </div>

          <div class="result-card">
            <h2 class="section-title">调试排错助手</h2>
            <div class="field">
              <label for="issueText">描述遇到的问题</label>
              <textarea id="issueText">人体传感器有人经过但灯不亮</textarea>
            </div>
            <button class="primary" onclick="renderDiagnosis()">生成排查路径</button>
            <div id="diagnosisResult" class="footer-note">点击按钮后，将故障描述转成排查步骤。</div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    function includesAny(text, words) {
      return words.some(word => text.includes(word));
    }

    function selectedGoals() {
      return Array.from(document.querySelectorAll('#goalChips input:checked')).map(input => input.value);
    }

    function budgetRangeLabel(budget) {
      if (budget === '1000以内') return '800-1200 元';
      if (budget === '1000-3000') return '1800-2800 元';
      if (budget === '3000-8000') return '4200-6800 元';
      return '8000 元以上';
    }

    function generatePlan(input) {
      const lowConstruction = input.stage === '租房' || input.wiring === '不可以';
      const tier = lowConstruction ? '低施工入门方案' : (input.budget === '3000-8000' || input.budget === '8000以上' ? '全屋联动进阶方案' : '标准舒适方案');
      const rooms = [
        { name: '玄关', focus: '回家与离家触发', devices: ['门窗传感器', '人体传感器', '智能门锁可选'] },
        { name: '客厅', focus: '灯光、空调和观影联动', devices: ['智能灯', '空调伴侣', '智能插座'] },
        { name: '卧室', focus: '睡眠与起夜体验', devices: ['人体传感器', '智能灯', '无线开关'] }
      ];
      if (input.goals.includes('厨房安全') || input.members.includes('老人')) {
        rooms.push({ name: '厨房', focus: '安全提醒', devices: ['烟雾传感器', '燃气报警器', '智能插座'] });
      }
      const devices = [
        { name: '中枢网关', count: 1, priority: '必备', purpose: '连接传感器并承载自动化' },
        { name: '人体传感器', count: 2, priority: '必备', purpose: '识别有人移动、起夜和无人状态' },
        { name: '门窗传感器', count: 1, priority: '必备', purpose: '触发回家、离家和门窗异常提醒' },
        { name: '智能灯', count: 2, priority: '推荐', purpose: '实现回家开灯、起夜柔光和睡眠关灯' },
        { name: '智能插座', count: 2, priority: '推荐', purpose: '控制小家电并减少待机耗电' },
        { name: '空调伴侣', count: 1, priority: '可选', purpose: '联动空调温度和睡眠模式' }
      ];
      const advice = lowConstruction
        ? '建议先使用免布线设备，避免一开始更换全屋智能开关。先把玄关、客厅、卧室三个高频空间跑通，再逐步扩展。'
        : '可以在装修阶段预留网关、智能开关和窗帘电机位置。先确定高频生活场景，再决定是否做全屋灯光替换。';
      return {
        tier,
        budget: budgetRangeLabel(input.budget),
        summary: `${input.homeType}更适合从${rooms.slice(0, 3).map(room => room.name).join('、')}开始改造，优先满足${input.goals.join('、') || '基础照明与安全提醒'}。`,
        rooms,
        devices,
        advice
      };
    }

    function generateAutomation(text) {
      const trigger = includesAny(text, ['回家', '开门', '门锁']) ? '智能门锁开门，或门窗传感器打开' : includesAny(text, ['起夜', '经过', '有人']) ? '人体传感器检测到有人移动' : '用户指定的设备状态变化';
      const conditions = [];
      if (includesAny(text, ['晚上', '夜间', '7 点', '19'])) conditions.push('时间限制：19:00-23:30');
      if (includesAny(text, ['起夜', '凌晨'])) conditions.push('亮度限制：夜间或环境光较暗时执行');
      if (!conditions.length) conditions.push('无额外限制，可按需补充时间段');
      const actions = [];
      if (includesAny(text, ['客厅灯'])) actions.push('打开客厅灯');
      else if (includesAny(text, ['灯', '开灯'])) actions.push('打开对应空间的智能灯');
      if (includesAny(text, ['空调'])) actions.push('打开空调，并设置为 26℃');
      if (includesAny(text, ['插座', '电器'])) actions.push('关闭或打开指定智能插座');
      if (!actions.length) actions.push('执行用户选择的米家设备动作');
      const followUp = includesAny(text, ['没人', '无人', '10 分钟'])
        ? ['10 分钟无人移动后，关闭灯光和空调', '建议单独建立一个“无人关闭”自动化，避免主场景过于复杂']
        : ['可增加“无人移动后关闭设备”的节能规则'];
      return {
        trigger,
        conditions,
        actions,
        followUp,
        appSteps: ['打开米家 App，进入“自动化”。', '在“如果”中选择触发设备和触发条件。', '添加时间、亮度或人在状态等限制条件。', '在“就执行”中选择灯、空调或插座等设备动作。', '保存后先手动测试，再观察一次真实触发。']
      };
    }

    function diagnoseIssue(text) {
      if (includesAny(text, ['人体传感器', '有人', '灯不亮'])) {
        return {
          title: '人体传感器触发后灯不亮',
          steps: ['检查人体传感器和智能灯是否在线。', '确认传感器、灯和网关是否在同一个家庭中。', '检查自动化是否处于启用状态。', '确认触发条件选择的是“有人移动”，不是“无人移动”。', '检查时间限制是否导致当前时间不执行。', '在米家 App 中手动打开智能灯，确认灯本身可被控制。', '如果仍不生效，重启网关或重新添加传感器。']
        };
      }
      if (includesAny(text, ['离线', '连不上', '连接'])) {
        return {
          title: '设备离线或连接异常',
          steps: ['检查设备供电、电池电量和距离网关的位置。', '确认家庭 Wi-Fi、蓝牙网关或中枢网关工作正常。', '查看设备是否被加入了错误的家庭或房间。', '尝试在米家 App 中刷新设备状态。', '仍然离线时，按设备说明重新配网。']
        };
      }
      return {
        title: '自动化未按预期执行',
        steps: ['先确认相关设备是否都能在 App 中手动控制。', '检查自动化是否启用。', '检查触发条件、时间限制和执行动作是否互相冲突。', '把复杂自动化拆成两个简单场景分别测试。', '保存后等待一次真实触发，不只依赖页面状态判断。']
      };
    }

    function renderPlan() {
      const input = {
        homeType: document.querySelector('#homeType').value,
        stage: document.querySelector('#stage').value,
        budget: document.querySelector('#budget').value,
        wiring: document.querySelector('#wiring').value,
        goals: selectedGoals(),
        members: document.querySelector('#members').value
      };
      const plan = generatePlan(input);
      const resultEl = document.querySelector('#planResult');
      const generatedAt = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      resultEl.className = 'result-card';
      resultEl.innerHTML = `
        <div class="generated-bar">
          <span>AI 方案已生成</span>
          <small>${generatedAt}</small>
        </div>
        <div class="result-head">
          <div>
            <h2 class="section-title">${plan.tier}</h2>
            <p class="lead">${plan.summary}</p>
          </div>
          <span class="badge">预计 ${plan.budget}</span>
        </div>
        <div class="mini-grid">
          ${plan.rooms.map(room => `
            <div class="mini">
              <b>${room.name}</b>
              <small>${room.focus}</small>
              <small>${room.devices.join(' / ')}</small>
            </div>
          `).join('')}
        </div>
        <ul class="device-list">
          ${plan.devices.map((device, index) => `
            <li>
              <span class="num">${index + 1}</span>
              <div><b>${device.name} × ${device.count} · ${device.priority}</b><p>${device.purpose}</p></div>
            </li>
          `).join('')}
        </ul>
        <p class="footer-note">${plan.advice}</p>
      `;
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function renderAutomation() {
      const result = generateAutomation(document.querySelector('#sceneText').value);
      document.querySelector('#automationResult').innerHTML = `
        <ul class="steps">
          <li><span class="num">1</span><div><b>触发条件</b><p>${result.trigger}</p></div></li>
          <li><span class="num">2</span><div><b>限制条件</b><p>${result.conditions.join('；')}</p></div></li>
          <li><span class="num">3</span><div><b>执行动作</b><p>${result.actions.join('；')}</p></div></li>
          <li><span class="num">4</span><div><b>后续规则</b><p>${result.followUp.join('；')}</p></div></li>
          <li><span class="num">5</span><div><b>米家配置路径</b><p>${result.appSteps.join(' ')}</p></div></li>
        </ul>
      `;
    }

    function renderDiagnosis() {
      const result = diagnoseIssue(document.querySelector('#issueText').value);
      document.querySelector('#diagnosisResult').innerHTML = `
        <h3>${result.title}</h3>
        <ul class="steps">
          ${result.steps.map((step, index) => `<li><span class="num">${index + 1}</span><div><b>${step}</b></div></li>`).join('')}
        </ul>
      `;
    }

    function fillSample() {
      document.querySelector('#homeType').value = '两室一厅';
      document.querySelector('#stage').value = '租房';
      document.querySelector('#budget').value = '1000-3000';
      document.querySelector('#wiring').value = '不可以';
      document.querySelector('#members').value = '有老人';
      document.querySelectorAll('#goalChips input').forEach(input => {
        input.checked = ['回家模式', '离家模式', '起夜模式', '厨房安全'].includes(input.value);
      });
      renderPlan();
      renderAutomation();
      renderDiagnosis();
      document.querySelector('#planner').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
