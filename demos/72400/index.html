<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>听说你们很赚钱 · 商科生 4 年生存模拟器</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-soft: #171a21;
    --card: #1e222b;
    --line: #2a2f3a;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --accent: #e8c766;
    --accent-2: #7aa2f7;
    --good: #7ec27e;
    --bad: #e07a7a;
    --shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at top, #1a1e28 0%, #0f1115 60%);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 system-ui, -apple-system, sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    min-height: 100vh;
  }
  header.brand {
    text-align: center;
    margin-bottom: 32px;
  }
  header.brand .logo {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 2px;
    margin-bottom: 16px;
  }
  header.brand h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  header.brand .subtitle {
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 1px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .scene-title {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .scene-desc {
    font-size: 16px;
    color: var(--text);
    margin-bottom: 24px;
    white-space: pre-line;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice {
    background: var(--bg-soft);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 14px 18px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
    transition: all 0.2s ease;
    font-family: inherit;
    line-height: 1.5;
  }
  .choice:hover {
    border-color: var(--accent);
    background: #232833;
    transform: translateY(-1px);
  }
  .choice small {
    display: block;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 4px;
  }
  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .stat {
    background: var(--bg-soft);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--line);
  }
  .stat b { color: var(--text); font-weight: 500; }
  .progress {
    height: 3px;
    background: var(--line);
    border-radius: 3px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress > div {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
  }
  /* 结局卡片 */
  .ending-card {
    background: linear-gradient(135deg, #1e222b 0%, #232a38 100%);
    border: 1px solid var(--accent);
    border-radius: 16px;
    padding: 36px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .ending-card::before {
    content: "";
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(232,199,102,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .ending-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 10px;
    border-radius: 2px;
    margin-bottom: 16px;
  }
  .ending-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .ending-sub {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .ending-quote {
    font-size: 15px;
    color: var(--text);
    font-style: italic;
    line-height: 1.9;
    padding: 20px 0;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    margin-bottom: 24px;
  }
  .ending-meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
    font-size: 13px;
  }
  .ending-meta > div {
    background: var(--bg-soft);
    padding: 10px 8px;
    border-radius: 8px;
  }
  .ending-meta small { color: var(--text-dim); display: block; font-size: 11px; margin-bottom: 4px; }
  .ending-meta b { color: var(--accent); font-size: 15px; font-weight: 600; }
  .reveal-box {
    background: rgba(232,199,102,0.08);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    font-size: 14px;
    text-align: left;
  }
  .reveal-box b { color: var(--accent); }
  .reveal-box .compare {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .reveal-box .compare span { color: var(--text-dim); font-size: 12px; }
  .reveal-box .compare b.diff { color: var(--bad); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: var(--accent);
    color: #1a1a1a;
    border: none;
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: transform 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
  }
  /* 开场偏见测验 */
  .quiz-input {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .quiz-input input {
    flex: 1;
    padding: 12px 14px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  .quiz-input input:focus { outline: none; border-color: var(--accent); }
  .footnote {
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 32px;
    letter-spacing: 1px;
  }
  .footnote a { color: var(--accent-2); text-decoration: none; }
  /* 结局分布图 */
  .dist-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .dist-bar .name { width: 110px; color: var(--text-dim); text-align: right; }
  .dist-bar .bar {
    flex: 1;
    height: 10px;
    background: var(--bg-soft);
    border-radius: 5px;
    overflow: hidden;
  }
  .dist-bar .bar > div {
    height: 100%;
    background: var(--accent-2);
  }
  .dist-bar.mine .bar > div { background: var(--accent); }
  .dist-bar .pct { width: 40px; color: var(--text-dim); }
  .dist-bar.mine .name { color: var(--accent); font-weight: 600; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card, .ending-card { animation: fadeIn 0.4s ease; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
 * 《听说你们很赚钱》· 商科生 4 年生存模拟器
 *   聚焦：大三暑期 → 秋招 → 毕业 的关键分岔
 *   Demo：15-20 分钟单周目
 * ============================================================ */

const state = {
  guess: null,        // 玩家开局猜测的年薪（万）
  stats: {
    gpa: 3.4,         // 学分绩
    money: 5,         // 现金（k）
    energy: 80,       // 精力
    network: 30,      // 人脉
    passion: 50,      // 对本行业的热情
  },
  path: [],           // 走过的分支 tag
  currentScene: 'intro',
};

/* ---------- 场景定义 ---------- */
const scenes = {

  /* ========== 开场 ========== */
  intro: {
    title: "序章 · 大三下 · 五月",
    text:
`你叫尤谦。
经济学专业，普通 211，绩点 3.4。
高考那年，你的分数够不上顶级名校，家里人说："学商科吧，出来赚钱。"
四年过去了，室友们已经开始"卷"起了各自的方向：
考研、出国、考公、大厂、四大、投行……
你看了一眼群里飞过的暑期实习消息，
又看了一眼余额还剩两位数的支付宝，
深吸了一口气。

——在开始之前，先问你一个问题。`,
    isQuiz: true,
  },

  /* ========== 第一幕：暑期实习决策 ========== */
  summer_decision: {
    title: "第一幕 · 大三暑期",
    text:
`六月的校园，蝉声还没起来，招聘群已经先炸了。
你手里握着几个方向，时间只够选一个。
你打算去哪儿？`,
    choices: [
      { text: "冲一把投行/券商暑期实习",
        hint: "光鲜、加班、履历王炸，但通过率不到 5%",
        tag: "投行",
        effect: { network: +15, energy: -25, passion: -10 },
        next: "intern_ib" },
      { text: "四大会计师事务所暑期项目",
        hint: "稳、锻炼扎实，但外人一听'审计'就皱眉",
        tag: "四大",
        effect: { network: +10, energy: -15, gpa: +0.1 },
        next: "intern_big4" },
      { text: "互联网大厂做商业分析",
        hint: "钱多、卷得快、和'商科'看似相关又不相关",
        tag: "大厂",
        effect: { network: +8, money: +6, passion: -5 },
        next: "intern_tech" },
      { text: "回家备考公务员",
        hint: "父母最想要的答案。你也不确定这是不是自己想要的",
        tag: "考公",
        effect: { energy: +10, network: -10, passion: -15 },
        next: "intern_gov" },
      { text: "什么都不做，gap 一个夏天",
        hint: "看看世界。代价是简历上会空一栏",
        tag: "gap",
        effect: { energy: +30, passion: +20, network: -15, money: -3 },
        next: "intern_gap" },
    ],
  },

  /* ---- 五条暑期支线（每条一个小场景 + 关键抉择） ---- */
  intern_ib: {
    title: "投行暑期 · 第 47 天",
    text:
`凌晨三点，你在会议室改第 11 版 pitch book。
MD 走进来看了一眼你的 PPT，
只说了一句："这个字号，让人怎么读。"
群里刚发消息说你妈住院了。
你的手指悬在键盘上。`,
    choices: [
      { text: "先改完 PPT，再打电话",
        hint: "留任 offer 就在眼前",
        tag: "留任",
        effect: { network: +10, passion: -15, energy: -20 },
        next: "senior_year" },
      { text: "关掉电脑，打车回家",
        hint: "你可能就此告别这个圈子",
        tag: "离开投行",
        effect: { passion: +20, network: -10, energy: +10 },
        next: "senior_year" },
    ],
  },

  intern_big4: {
    title: "四大暑期 · 第 30 天",
    text:
`你在客户现场盘点存货，
上级留学回来的姐姐问你："以后想转甲方还是继续做审计？"
——这是四大的经典分岔口。
你脑子里闪过两个画面：
一个是 35 岁还在出差，一个是坐到甲方的办公室里喝咖啡。`,
    choices: [
      { text: "留下来做审计，走合伙人路线",
        hint: "长期、稳定、慢",
        tag: "审计留任",
        effect: { network: +12, gpa: +0.1, passion: -5 },
        next: "senior_year" },
      { text: "把它当跳板，明年跳甲方财务",
        hint: "利用四大的品牌，两三年就走",
        tag: "四大跳板",
        effect: { network: +8, money: +3, passion: +5 },
        next: "senior_year" },
    ],
  },

  intern_tech: {
    title: "大厂暑期 · 第 45 天",
    text:
`你做的第一个 A/B 测试上线了。
一个改按钮颜色的实验，让 GMV 涨了 0.3%。
Leader 在群里 @ 全组："漂亮。"
你盯着屏幕，突然想起大一时立志"改变世界"的自己。
0.3%。世界改变了 0.3%。`,
    choices: [
      { text: "继续卷，转正 sp offer",
        hint: "这就是你想要的生活",
        tag: "大厂转正",
        effect: { money: +8, network: +8, passion: -10 },
        next: "senior_year" },
      { text: "偷偷学做游戏 / 写公众号",
        hint: "副业开始萌芽",
        tag: "副业萌芽",
        effect: { passion: +25, energy: -10, money: +2 },
        next: "senior_year" },
    ],
  },

  intern_gov: {
    title: "老家 · 备考的第 60 天",
    text:
`你回到家，每天早上六点起床背行测。
爸妈很欣慰。你却在深夜刷到大学同学在陆家嘴打卡的九宫格。
一种复杂的情绪堵在胸口——
不是嫉妒，也不是不甘，是一种"我是不是选错了"的模糊。`,
    choices: [
      { text: "认真准备，一次上岸",
        hint: "父母的骄傲，你的心结",
        tag: "考公路线",
        effect: { energy: -10, network: -5, passion: -10 },
        next: "senior_year" },
      { text: "考公只是幌子，暗中投简历",
        hint: "两条腿走路的痛苦你懂",
        tag: "骑墙派",
        effect: { energy: -20, passion: +5, network: +3 },
        next: "senior_year" },
    ],
  },

  intern_gap: {
    title: "云南 · 七月",
    text:
`你在大理一家客栈打了三周工。
认识了一个前投行辞职来做咖啡的姐姐，
一个正在拍纪录片的男生，
和一只叫"老板"的橘猫。
临走那天，姐姐说：
"你回去以后还会想这里的。别忘了。"`,
    choices: [
      { text: "回学校，把这段经历写进简历",
        hint: "把 gap 讲成'自我探索'的故事",
        tag: "gap归来",
        effect: { passion: +15, network: +3, energy: +10 },
        next: "senior_year" },
      { text: "决定不回去了，休学一学期",
        hint: "父母炸了。但你想清楚了",
        tag: "休学",
        effect: { passion: +30, network: -15, gpa: -0.3 },
        next: "senior_year" },
    ],
  },

  /* ========== 第二幕：大四秋招 ========== */
  senior_year: {
    title: "第二幕 · 大四上 · 九月",
    text:
`秋招开始了。
朋友圈开始出现"提前批 offer 收割机"式的截图，
你的收件箱躺着 12 封"很遗憾"。
你打开 Excel，把自己的选项列了一遍。
选一个真正的方向吧——`,
    choices: [
      { text: "死磕金融，投行/买方/研究所",
        hint: "把暑期简历再包装一遍",
        tag: "死磕金融",
        effect: { energy: -15, network: +8 },
        next: "final_finance" },
      { text: "转互联网，产品/商业分析/运营",
        hint: "商科生的第二选择",
        tag: "转互联网",
        effect: { money: +2, passion: -3 },
        next: "final_tech" },
      { text: "考公 / 选调 / 事业编",
        hint: "求稳，家里最开心的答案",
        tag: "考公路线",
        effect: { energy: -10, network: -5 },
        next: "final_gov" },
      { text: "跨行——做一件和商科无关的事",
        hint: "游戏、咖啡、艺术、支教……",
        tag: "跨行",
        effect: { passion: +25, money: -5, network: -10 },
        next: "final_other" },
      { text: "回家继承家业 / 家里安排",
        hint: "有的人一出生就在终点。你只是被叫回来了",
        tag: "家里安排",
        effect: { money: +15, passion: -20, network: +5 },
        next: "final_family" },
      { text: "谁都不选，先躺一学期",
        hint: "毕业焦虑 → 摆烂式抵抗",
        tag: "摆烂",
        effect: { energy: +5, passion: -25, network: -15 },
        next: "final_gap" },
    ],
  },

  /* ---- 大四终局分支：每条都会导向 1-2 个具体结局 ---- */

  final_finance: {
    title: "十一月 · 最终面",
    text:
`你走进陆家嘴某座玻璃塔楼，
面试官问你最后一个问题：
"你觉得，你为什么适合这一行？"
你张了张嘴。`,
    choices: [
      { text: "说你从小就想做金融",
        hint: "标准答案。他们听腻了",
        tag: "标准答案",
        endingKey: (s) => s.stats.network >= 55 ? "ending_ib" : "ending_finance_backoffice" },
      { text: "说你只是想赚钱，没别的",
        hint: "危险但诚实",
        tag: "诚实",
        endingKey: () => "ending_finance_backoffice" },
      { text: "说你其实没那么确定",
        hint: "他们大概率不会要你",
        tag: "退场",
        endingKey: () => "ending_regret" },
    ],
  },

  final_tech: {
    title: "十月 · 大厂群面",
    text:
`8 个人一组，20 分钟给一个商业案例。
你发现同组有一个人一直在打断别人。
你可以选择——`,
    choices: [
      { text: "和他抢主导权，杀出重围",
        hint: "得罪一个人，赢下这一场",
        tag: "抢主导",
        endingKey: (s) => s.stats.passion > 40 ? "ending_pm" : "ending_ba_burnout" },
      { text: "做 timekeeper，把节奏稳住",
        hint: "隐形贡献者，赌面试官眼力",
        tag: "稳节奏",
        endingKey: () => "ending_ba_burnout" },
      { text: "群面结束后主动找 HR 加微信",
        hint: "商科生的社交本能",
        tag: "会来事",
        endingKey: () => "ending_pm" },
    ],
  },

  final_gov: {
    title: "次年三月 · 面试通知",
    text:
`国考笔试过了。面试前一晚，
你翻出高考那年爸妈的合影，
突然觉得，这条路是他们的，也是你的。`,
    choices: [
      { text: "稳稳发挥，进入体制",
        hint: "岁月静好版结局",
        tag: "上岸",
        endingKey: () => "ending_gov" },
      { text: "面试当天临时缺席",
        hint: "你其实还是不想",
        tag: "临阵脱逃",
        endingKey: () => "ending_lost" },
    ],
  },

  final_other: {
    title: "毕业前 · 一个决定",
    text:
`你告诉家里你要去做一件"不赚钱"的事。
可能是做游戏、可能是开咖啡馆、
可能是拍纪录片、可能是回大理。
爸妈沉默了三天。
最后你妈发来一句："你自己想清楚就好。"`,
    choices: [
      { text: "做独立游戏 / 内容创作",
        tag: "跨行做内容",
        endingKey: () => "ending_creator" },
      { text: "回大理 / 开一家小店",
        tag: "生活方式",
        endingKey: () => "ending_dali" },
      { text: "去 NGO / 支教 / 公益",
        tag: "公益路线",
        endingKey: () => "ending_ngo" },
    ],
  },

  final_family: {
    title: "毕业当天 · 家里的车已经在等",
    text:
`同学们在拍学士服合影。

/* ============================================================
 * 渲染层
 * ============================================================ */
const app = document.getElementById('app');

function renderHeader() {
  return `
    <header class="brand">
      <div class="logo">SIMULATOR · DEMO</div>
      <h1>听说你们很赚钱</h1>
      <div class="subtitle">商科生 4 年生存模拟器 · Chapter I</div>
    </header>
  `;
}

function renderStats() {
  const s = state.stats;
  return `
    <div class="stats">
      <div class="stat">绩点 <b>${s.gpa.toFixed(2)}</b></div>
      <div class="stat">现金 <b>${s.money}k</b></div>
      <div class="stat">精力 <b>${clamp(s.energy)}</b></div>
      <div class="stat">人脉 <b>${clamp(s.network)}</b></div>
      <div class="stat">热情 <b>${clamp(s.passion)}</b></div>
    </div>
  `;
}

function renderProgress() {
  const total = 4;
  const done = Math.min(state.path.length, total);
  return `<div class="progress"><div style="width:${(done/total)*100}%"></div></div>`;
}

function renderIntroQuiz() {
  return `
    ${renderHeader()}
    <div class="card">
      <div class="scene-title">${scenes.intro.title}</div>
      <div class="scene-desc">${scenes.intro.text}</div>
      <div style="margin-top:20px;padding:16px;background:var(--bg-soft);border-radius:8px;border:1px solid var(--line);">
        <b>你猜——一个普通 211 商科生，毕业 1 年后，平均年薪是多少万？</b>
        <div class="quiz-input">
          <input id="guessInput" type="number" placeholder="填一个数字（单位：万/年）" />
          <button class="btn" onclick="submitGuess()">开始</button>
        </div>
      </div>
    </div>
    <div class="footnote">这是一款独立叙事模拟器 Demo · 单周目约 15 分钟</div>
  `;
}

function renderScene(key) {
  const sc = scenes[key];
  if (!sc) return renderEnding(key);

  return `
    ${renderHeader()}
    ${renderProgress()}
    ${renderStats()}
    <div class="card">
      <div class="scene-title">${sc.title}</div>
      <div class="scene-desc">${sc.text}</div>
      <div class="choices">
        ${sc.choices.map((c, i) => `
          <button class="choice" onclick="pickChoice('${key}', ${i})">
            ${c.text}
            ${c.hint ? `<small>${c.hint}</small>` : ''}
          </button>
        `).join('')}
      </div>
    </div>
    <div class="footnote">你走过的路：${state.path.join(' → ') || '—'}</div>
  `;
}

function renderEnding(key) {
  const e = endings[key];
  if (!e) return `<div class="card">未定义结局：${key}</div>`;

  const guessed = state.guess || 30;
  const realSalary = e.salary === "?" ? 0 : parseInt(e.salary);
  const diff = guessed - realSalary;

  // 结局分布（模拟）
  const distList = Object.entries(endings)
    .map(([k, v]) => ({ key: k, name: v.title, pct: parseFloat(v.ratio) }))
    .sort((a, b) => b.pct - a.pct)
    .slice(0, 8);

  return `
    ${renderHeader()}
    <div class="ending-card">
      <div class="ending-tag">${e.tag}</div>
      <div class="ending-title">${e.title}</div>
      <div class="ending-sub">${e.sub}</div>
      <div class="ending-quote">${e.quote.replace(/\n/g,'<br>')}</div>
      <div class="ending-meta">
        <div><small>年薪(万)</small><b>${e.salary}</b></div>
        <div><small>幸福度</small><b>${e.happy}</b></div>
        <div><small>玩家占比</small><b>${e.ratio}</b></div>
      </div>
    </div>

    ${e.salary !== "?" ? `
    <div class="card">
      <div class="scene-title">开局你猜的 vs 你走到的</div>
      <div class="reveal-box">
        游戏开始时，你猜"普通 211 商科生毕业 1 年平均年薪"是 <b>${guessed} 万</b>。
        <div class="compare">
          <span>你走到的结局年薪</span>
          <b class="${diff > 5 ? 'diff' : ''}">${e.salary} 万</b>
        </div>
        <div class="compare">
          <span>你的偏见落差</span>
          <b class="${Math.abs(diff) > 5 ? 'diff' : ''}">${diff > 0 ? '高估了 '+diff+' 万' : (diff < 0 ? '低估了 '+(-diff)+' 万' : '刚好')}</b>
        </div>
      </div>

      <div class="scene-title" style="margin-top:20px;">所有玩家结局分布</div>
      ${distList.map(d => `
        <div class="dist-bar ${d.key === key ? 'mine' : ''}">
          <div class="name">${d.name}</div>
          <div class="bar"><div style="width:${d.pct * 6}%"></div></div>
          <div class="pct">${d.pct}%</div>
        </div>
      `).join('')}
    </div>` : ''}

    <div class="card">
      <div class="scene-title">这一周目 · 你走过的路</div>
      <div style="font-size:14px;color:var(--text-dim);line-height:2;">
        ${state.path.map((p, i) => `<span style="color:var(--accent)">${i+1}.</span> ${p}`).join('<br>')}
      </div>
      <div class="btn-row" style="margin-top:24px;">
        <button class="btn" onclick="shareEnding('${key}')">📷 生成分享卡片</button>
        <button class="btn ghost" onclick="restart()">再来一次</button>
      </div>
    </div>

    <div class="footnote">
      共有 <b style="color:var(--accent)">13 个结局</b>·你解锁了 1 个<br>
      《听说你们很赚钱》· 商科生 4 年生存模拟器 · Demo v0.1
    </div>
  `;
}

/* ============================================================
 * 交互逻辑
 * ============================================================ */
function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }

function applyEffect(effect) {
  if (!effect) return;
  for (const k in effect) state.stats[k] = (state.stats[k] || 0) + effect[k];
}

window.submitGuess = function() {
  const v = document.getElementById('guessInput').value;
  state.guess = parseInt(v) || 30;
  state.currentScene = 'summer_decision';
  render();
};

window.pickChoice = function(sceneKey, idx) {
  const sc = scenes[sceneKey];
  const choice = sc.choices[idx];
  state.path.push(choice.tag);
  applyEffect(choice.effect);

  if (choice.endingKey) {
    const ekey = typeof choice.endingKey === 'function'
      ? choice.endingKey(state)
      : choice.endingKey;
    state.currentScene = ekey;
  } else {
    state.currentScene = choice.next;
  }
  render();
};

window.restart = function() {
  state.guess = null;
  state.stats = { gpa: 3.4, money: 5, energy: 80, network: 30, passion: 50 };
  state.path = [];
  state.currentScene = 'intro';
  render();
};

window.shareEnding = function(key) {
  const e = endings[key];
  const text =
`我在《听说你们很赚钱》里，
走出了「${e.title}」结局。
${e.tag}
—— ${e.sub}

你呢？`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() =>
      alert("已复制结局文案到剪贴板，去发朋友圈吧 :)")
    );
  } else {
    alert(text);
  }
};

function render() {
  if (state.currentScene === 'intro') {
    app.innerHTML = renderIntroQuiz();
  } else if (endings[state.currentScene]) {
    app.innerHTML = renderEnding(state.currentScene);
  } else {
    app.innerHTML = renderScene(state.currentScene);
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
