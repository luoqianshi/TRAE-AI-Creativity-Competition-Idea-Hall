<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>企事吧 — 真实职场雇主评价社区</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --ink: #1a1d23;
    --muted: #6b7280;
    --light: #9ca3af;
    --rule: #e5e7eb;
    --accent: #2563eb;
    --accent2: #0ea5e9;
    --accent-light: #dbeafe;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6; font-size: 15px;
    overflow-x: hidden; padding-bottom: 80px;
  }
  a { color: inherit; text-decoration: none; }
  button { border: none; background: none; cursor: pointer; font-family: inherit; }
  img { max-width: 100%; display: block; }
  input, textarea, select { font-family: inherit; font-size: 15px; }

  /* ===== Layout ===== */
  .app { max-width: 720px; margin: 0 auto; min-height: 100vh; }
  .page { display: none; animation: fadeIn 0.25s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== Header ===== */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  }
  .header .logo { font-size: 1.3rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
  .header .search-box {
    flex: 1; position: relative;
  }
  .header .search-box input {
    width: 100%; padding: 8px 12px 8px 34px; border-radius: 100px;
    border: none; background: rgba(255,255,255,0.12); color: #fff; font-size: 14px;
    outline: none; transition: background 0.2s;
  }
  .header .search-box input::placeholder { color: rgba(255,255,255,0.5); }
  .header .search-box input:focus { background: rgba(255,255,255,0.2); }
  .header .search-box svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; opacity: 0.5;
  }
  .header .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 13px;
    cursor: pointer; flex-shrink: 0;
  }

  /* ===== Bottom Nav ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: var(--surface); border-top: 1px solid var(--rule);
    display: flex; justify-content: space-around; padding: 6px 0 10px;
    max-width: 720px; margin: 0 auto;
  }
  .bottom-nav .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--light); font-size: 11px; padding: 4px 16px; cursor: pointer; transition: color 0.2s;
  }
  .bottom-nav .nav-item.active { color: var(--accent); }
  .bottom-nav .nav-item svg { width: 22px; height: 22px; }

  /* ===== FAB ===== */
  .fab {
    position: fixed; bottom: 76px; right: 16px; z-index: 99;
    width: 52px; height: 52px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(37,99,235,0.35); cursor: pointer;
    transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.92); }
  .fab svg { width: 24px; height: 24px; }

  /* ===== Cards ===== */
  .card {
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); margin: 12px 16px; overflow: hidden;
  }
  .card-pad { padding: 16px; }

  /* ===== Tags ===== */
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 100px; font-size: 12px; font-weight: 500;
  }
  .tag-blue { background: var(--accent-light); color: var(--accent); }
  .tag-green { background: #dcfce7; color: #16a34a; }
  .tag-orange { background: #fef3c7; color: #d97706; }
  .tag-red { background: #fee2e2; color: var(--danger); }
  .tag-gray { background: #f3f4f6; color: var(--muted); }

  /* ===== Rating Stars ===== */
  .rating-bar { display: flex; align-items: center; gap: 8px; }
  .rating-bar .stars { display: flex; gap: 2px; }
  .rating-bar .stars svg { width: 16px; height: 16px; }
  .rating-bar .score { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
  .rating-bar .count { font-size: 12px; color: var(--light); }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.25);
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-outline {
    border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink);
  }
  .btn-outline:active { background: var(--bg); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 6px 14px; font-size: 13px; }

  /* ===== Home Page ===== */
  .hero-section {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    padding: 24px 16px 20px; color: #fff;
  }
  .hero-section h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
  .hero-section p { color: rgba(255,255,255,0.7); font-size: 13px; }
  .hero-stats { display: flex; gap: 24px; margin-top: 16px; }
  .hero-stats .stat { text-align: center; }
  .hero-stats .stat .num { font-size: 1.4rem; font-weight: 800; }
  .hero-stats .stat .label { font-size: 11px; color: rgba(255,255,255,0.6); }

  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px; font-size: 15px; font-weight: 700;
  }
  .section-title a { font-size: 13px; color: var(--accent); font-weight: 500; }

  .company-card {
    display: flex; gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--rule); cursor: pointer; transition: background 0.15s;
  }
  .company-card:last-child { border-bottom: none; }
  .company-card:active { background: var(--bg); }
  .company-card .logo-box {
    width: 48px; height: 48px; border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent-light), #e0f2fe);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--accent); font-size: 14px; flex-shrink: 0;
  }
  .company-card .info { flex: 1; min-width: 0; }
  .company-card .info .name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .company-card .info .meta { font-size: 12px; color: var(--light); margin-bottom: 4px; }
  .company-card .info .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .company-card .score-box { text-align: right; flex-shrink: 0; }
  .company-card .score-box .score { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
  .company-card .score-box .label { font-size: 11px; color: var(--light); }

  .topic-list { padding: 0 16px; }
  .topic-item {
    display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .topic-item:last-child { border-bottom: none; }
  .topic-item .rank {
    width: 24px; height: 24px; border-radius: 6px; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--muted); flex-shrink: 0;
  }
  .topic-item .rank.top { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .topic-item .title { flex: 1; font-size: 14px; font-weight: 500; }
  .topic-item .heat { font-size: 12px; color: var(--light); flex-shrink: 0; }

  /* ===== Company Detail Page ===== */
  .company-header {
    background: var(--surface); padding: 20px 16px; text-align: center;
    border-bottom: 1px solid var(--rule);
  }
  .company-header .big-logo {
    width: 64px; height: 64px; border-radius: var(--radius);
    background: linear-gradient(135deg, var(--accent-light), #e0f2fe);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--accent); font-size: 20px;
    margin: 0 auto 12px;
  }
  .company-header h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; }
  .company-header .loc { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .company-header .big-score { font-size: 2.5rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .company-header .score-label { font-size: 12px; color: var(--light); margin-top: 4px; }

  .rating-distribution { padding: 16px; }
  .dist-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dist-bar .label { width: 50px; font-size: 12px; color: var(--muted); text-align: right; }
  .dist-bar .bar-wrap { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .dist-bar .bar-fill { height: 100%; border-radius: 4px; }
  .dist-bar .pct { width: 36px; font-size: 12px; color: var(--light); text-align: right; }

  .filter-bar {
    display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--rule);
  }
  .filter-bar .filter-btn {
    padding: 6px 14px; border-radius: 100px; font-size: 13px; white-space: nowrap;
    border: 1px solid var(--rule); background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .filter-bar .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .review-card { padding: 16px; border-bottom: 1px solid var(--rule); }
  .review-card .review-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .review-card .review-header .user-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #c084fc, #a855f7);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700;
  }
  .review-card .review-header .user-avatar.anon { background: linear-gradient(135deg, var(--light), var(--muted)); }
  .review-card .review-header .user-info { flex: 1; }
  .review-card .review-header .user-info .name { font-weight: 600; font-size: 14px; }
  .review-card .review-header .user-info .time { font-size: 12px; color: var(--light); }
  .review-card .review-header .review-rating {
    display: flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 100px;
    font-size: 12px; font-weight: 600;
  }
  .review-card .review-title { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
  .review-card .review-body { font-size: 14px; color: var(--muted); line-height: 1.7; margin-bottom: 10px; }
  .review-card .review-tags { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .review-card .review-actions { display: flex; gap: 16px; }
  .review-card .review-actions .action {
    display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--light); cursor: pointer;
  }
  .review-card .review-actions .action.active { color: var(--accent); }
  .review-card .review-actions .action svg { width: 16px; height: 16px; }

  /* ===== Post Page ===== */
  .post-form { padding: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .form-group label .required { color: var(--danger); }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: var(--radius-sm);
    background: var(--surface); outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group textarea { min-height: 140px; resize: vertical; }
  .form-group .hint { font-size: 12px; color: var(--light); margin-top: 4px; }

  .rating-select { display: flex; gap: 8px; flex-wrap: wrap; }
  .rating-select .rating-option {
    padding: 8px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--rule);
    background: var(--surface); font-size: 14px; cursor: pointer; transition: all 0.15s;
  }
  .rating-select .rating-option.selected {
    border-color: var(--accent); background: var(--accent-light); color: var(--accent); font-weight: 600;
  }

  .anon-toggle {
    display: flex; align-items: center; gap: 10px; padding: 14px;
    background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 16px;
  }
  .anon-toggle input[type="checkbox"] {
    width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer;
  }
  .anon-toggle .anon-info { flex: 1; }
  .anon-toggle .anon-info .title { font-weight: 600; font-size: 14px; }
  .anon-toggle .anon-info .desc { font-size: 12px; color: var(--muted); }

  /* ===== Profile Page ===== */
  .profile-header {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    padding: 32px 16px 24px; text-align: center; color: #fff;
  }
  .profile-header .profile-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; margin: 0 auto 12px;
    border: 3px solid rgba(255,255,255,0.2);
  }
  .profile-header .profile-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
  .profile-header .profile-level {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 12px; border-radius: 100px; background: rgba(255,255,255,0.15);
    font-size: 12px;
  }
  .profile-stats { display: flex; justify-content: center; gap: 32px; margin-top: 16px; }
  .profile-stats .p-stat { text-align: center; }
  .profile-stats .p-stat .num { font-size: 1.3rem; font-weight: 800; }
  .profile-stats .p-stat .label { font-size: 11px; color: rgba(255,255,255,0.6); }

  .tab-bar {
    display: flex; border-bottom: 1px solid var(--rule); background: var(--surface);
  }
  .tab-bar .tab {
    flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 500;
    color: var(--muted); cursor: pointer; position: relative;
  }
  .tab-bar .tab.active { color: var(--accent); font-weight: 600; }
  .tab-bar .tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 25%; right: 25%;
    height: 2.5px; background: var(--accent); border-radius: 2px;
  }

  .empty-state {
    text-align: center; padding: 48px 16px; color: var(--light);
  }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  .my-post-item {
    padding: 14px 16px; border-bottom: 1px solid var(--rule); cursor: pointer;
  }
  .my-post-item .mp-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .my-post-item .mp-meta { display: flex; gap: 10px; font-size: 12px; color: var(--light); }
  .my-post-item .mp-status {
    display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 11px; font-weight: 500;
  }
  .mp-status.pending { background: #fef3c7; color: #d97706; }
  .mp-status.approved { background: #dcfce7; color: #16a34a; }
  .mp-status.rejected { background: #fee2e2; color: var(--danger); }

  /* ===== Toast ===== */
  .toast {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--ink); color: #fff; padding: 10px 20px; border-radius: var(--radius-sm);
    font-size: 14px; z-index: 200; opacity: 0; pointer-events: none; transition: all 0.3s;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 150;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: var(--surface); width: 100%; max-width: 720px;
    border-radius: var(--radius) var(--radius) 0 0; padding: 20px 16px 32px;
    transform: translateY(100%); transition: transform 0.25s ease;
    max-height: 80vh; overflow-y: auto;
  }
  .modal-overlay.show .modal-content { transform: translateY(0); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-header h3 { font-size: 1.1rem; font-weight: 700; }
  .modal-header .close-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .modal-header .close-btn:active { background: var(--bg); }

  /* ===== Search Results ===== */
  .search-results { padding: 8px 0; }

  /* ===== Animations ===== */
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* Scrollbar hide */
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-bar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body>

<div class="app">

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="logo">企事吧</div>
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="搜索公司、评价..." autocomplete="off">
    </div>
    <div class="avatar" onclick="goTo('profile')">我</div>
  </header>

  <!-- ===== PAGE: HOME ===== -->
  <div class="page active" id="page-home">
    <div class="hero-section">
      <h1>真实职场声音</h1>
      <p>拒绝一切干预，让每一份职场体验都被真实记录</p>
      <div class="hero-stats">
        <div class="stat"><div class="num" id="statCompanies">1,247</div><div class="label">公司话题</div></div>
        <div class="stat"><div class="num" id="statReviews">8,632</div><div class="label">真实评价</div></div>
        <div class="stat"><div class="num" id="statUsers">5.2w</div><div class="label">职场人</div></div>
      </div>
    </div>

    <div class="section-title">
      <span>热门公司</span>
      <a href="javascript:void(0)" onclick="showToast('更多功能开发中')">查看全部</a>
    </div>
    <div id="hotCompanies"></div>

    <div class="section-title">
      <span>热议话题</span>
    </div>
    <div class="topic-list" id="hotTopics"></div>
  </div>

  <!-- ===== PAGE: COMPANY ===== -->
  <div class="page" id="page-company">
    <div class="company-header">
      <div class="big-logo" id="coLogo">字节</div>
      <h2 id="coName">字节跳动</h2>
      <div class="loc" id="coLoc">北京 · 互联网</div>
      <div class="big-score" id="coScore">4.2</div>
      <div class="score-label">综合评分 · 基于 342 条评价</div>
    </div>

    <div class="card">
      <div class="rating-distribution">
        <div style="font-weight:700;margin-bottom:12px;font-size:14px;">评分分布</div>
        <div id="ratingDist"></div>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter(this,'all')">全部</button>
      <button class="filter-btn" onclick="setFilter(this,'good')">好评</button>
      <button class="filter-btn" onclick="setFilter(this,'bad')">差评</button>
      <button class="filter-btn" onclick="setFilter(this,'interview')">面经</button>
      <button class="filter-btn" onclick="setFilter(this,'salary')">薪资</button>
    </div>

    <div id="companyReviews"></div>
  </div>

  <!-- ===== PAGE: POST ===== -->
  <div class="page" id="page-post">
    <div style="padding:16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;">
      <button class="btn btn-outline btn-sm" onclick="goTo('home')">取消</button>
      <h2 style="flex:1;text-align:center;font-size:16px;">发布评价</h2>
      <button class="btn btn-primary btn-sm" onclick="submitPost()">发布</button>
    </div>
    <div class="post-form">
      <div class="form-group">
        <label>选择公司 <span class="required">*</span></label>
        <select id="postCompany">
          <option value="">请选择公司</option>
        </select>
      </div>
      <div class="form-group">
        <label>标题 <span class="required">*</span></label>
        <input type="text" id="postTitle" placeholder="一句话概括你的体验，如：加班严重但成长很快">
      </div>
      <div class="form-group">
        <label>详细内容 <span class="required">*</span></label>

function renderHotCompanies() {

        <div class="score">${c.score}</div>

}

      <div class="title">${t.title}</div>
      <div class="heat">${t.heat}</div>

function renderCompanyDetail(id) {
  const c = companies.find(x => x.id === id);
  if (!c) return;
  currentCompanyId = id;
  document.getElementById('coLogo').textContent = c.abbr;
  document.getElementById('coName').textContent = c.name;
  document.getElementById('coLoc').textContent = `${c.loc} · ${c.industry}`;
  document.getElementById('coScore').textContent = c.score;

  const labels = ['夯爆了','夯','一般','拉','拉完了'];
  const colors = ['var(--accent)','var(--accent2)','#94a3b8','#cbd5e1','#e2e8f0'];
  document.getElementById('ratingDist').innerHTML = c.dist.map((v, i) => `
    <div class="dist-bar">
      <span class="label">${labels[i]}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${v}%;background:${colors[i]}"></div></div>
      <span class="pct">${v}%</span>
    </div>
  `).join('');

  renderCompanyReviews();
}

function renderCompanyReviews() {
  const reviews = reviewsData[currentCompanyId] || [];
  const el = document.getElementById('companyReviews');

  let filtered = reviews;
  if (currentFilter === 'good') filtered = reviews.filter(r => r.rating >= 4);
  else if (currentFilter === 'bad') filtered = reviews.filter(r => r.rating <= 2);
  else if (currentFilter === 'interview') filtered = reviews.filter(r => r.tags.includes('面经') || r.tags.includes('面试'));
  else if (currentFilter === 'salary') filtered = reviews.filter(r => r.tags.includes('薪资') || r.tags.includes('年终奖'));

  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-state"><p>暂无相关评价</p></div>`;
    return;
  }

  el.innerHTML = filtered.map(r => `
    <div class="review-card">
      <div class="review-header">
        <div class="user-avatar ${r.anon ? 'anon' : ''}">${r.anon ? '匿' : r.user[0]}</div>
        <div class="user-info">
          <div class="name">${r.anon ? '匿名用户' : r.user}</div>
          <div class="time">${r.time}</div>
        </div>
        <div class="review-rating" style="background:${getRatingColor(r.rating)}20;color:${getRatingColor(r.rating)}">${r.ratingLabel}</div>
      </div>
      <div class="review-title">${r.title}</div>
      <div class="review-body">${r.body}</div>
      <div class="review-tags">${r.tags.map(t => `<span class="tag tag-gray">${t}</span>`).join('')}</div>
      <div class="review-actions">
        <div class="action" onclick="toggleLike(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          ${r.likes}
        </div>
        <div class="action" onclick="showToast('评论功能开发中')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          ${r.comments}
        </div>
        <div class="action" onclick="showToast('已收藏')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          收藏
        </div>
      </div>
    </div>
  `).join('');
}

function getRatingColor(rating) {
  if (rating >= 5) return 'var(--accent)';
  if (rating >= 4) return 'var(--accent2)';
  if (rating >= 3) return 'var(--muted)';
  if (rating >= 2) return 'var(--warning)';
  return 'var(--danger)';
}

  el.innerHTML = myPosts.map(p => `

function goTo(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  if (page === 'home') {
    document.getElementById('page-home').classList.add('active');
    document.querySelectorAll('.nav-item')[0].classList.add('active');
    document.querySelector('.fab').style.display = 'flex';
  } else if (page === 'company') {
    document.getElementById('page-company').classList.add('active');
    document.querySelector('.fab').style.display = 'flex';
  } else if (page === 'post') {
    document.getElementById('page-post').classList.add('active');
    document.querySelector('.fab').style.display = 'none';
    renderPostCompanyOptions();
    renderProvinceOptions();
  } else if (page === 'profile') {
    document.getElementById('page-profile').classList.add('active');
    document.querySelectorAll('.nav-item')[3].classList.add('active');
    document.querySelector('.fab').style.display = 'none';
    renderMyPosts();
  } else if (page === 'discover' || page === 'messages') {
    document.getElementById('page-home').classList.add('active');
    showToast('功能开发中，敬请期待');
    const idx = page === 'discover' ? 1 : 2;
    document.querySelectorAll('.nav-item')[idx].classList.add('active');
  }
  window.scrollTo(0, 0);
}

function openCompany(id) {
  renderCompanyDetail(id);
  goTo('company');
}

function setFilter(btn, filter) {
  document.querySelectorAll('.filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = filter;
  renderCompanyReviews();
}

function switchTab(tabEl, tabName) {
  document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  const content = document.getElementById('profileContent');
  if (tabName === 'myPosts') {
    content.innerHTML = '<div id="myPosts"></div>';
    renderMyPosts();
  } else if (tabName === 'myComments') {
    content.innerHTML = `<div class="empty-state"><p>还没有评论过</p></div>`;
  } else if (tabName === 'myFavs') {
    content.innerHTML = `<div class="empty-state"><p>还没有收藏</p></div>`;
  }
}

function toggleLike(el) {
  el.classList.toggle('active');
  const svg = el.querySelector('svg');
  if (el.classList.contains('active')) {
    svg.setAttribute('fill', 'currentColor');
    el.childNodes[2].textContent = ' ' + (parseInt(el.childNodes[2].textContent) + 1);
  } else {
    svg.setAttribute('fill', 'none');
    el.childNodes[2].textContent = ' ' + (parseInt(el.childNodes[2].textContent) - 1);
  }
}

// Rating select
function setupRatingSelect() {
  const container = document.getElementById('ratingSelect');
  container.addEventListener('click', function(e) {
    const opt = e.target.closest('.rating-option');
    if (!opt) return;
    container.querySelectorAll('.rating-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    selectedRating = parseInt(opt.dataset.val);
  });
}

function submitPost() {
  const companyId = document.getElementById('postCompany').value;
  const title = document.getElementById('postTitle').value.trim();
  const body = document.getElementById('postBody').value.trim();
  const province = document.getElementById('postProvince').value;
  const city = document.getElementById('postCity').value;
  const tags = document.getElementById('postTags').value.trim();
  const anon = document.getElementById('postAnon').checked;

  if (!companyId) { showToast('请选择公司'); return; }
  if (!title) { showToast('请填写标题'); return; }
  if (body.length < 20) { showToast('正文至少 20 字'); return; }
  if (!selectedRating) { showToast('请选择评分'); return; }
  if (!province || !city) { showToast('请选择地区'); return; }

  const company = companies.find(c => c.id == companyId);
  const ratingLabels = {5:'夯爆了',4:'夯',3:'一般',2:'拉',1:'拉完了'};

  const newPost = {
    id: Date.now(),
    company: company.name,
    title: title,
    rating: selectedRating,
    ratingLabel: ratingLabels[selectedRating],
    time: '刚刚',
    status: 'pending'
  };
  myPosts.unshift(newPost);

  // Also add to company reviews
  const newReview = {
    id: Date.now(),
    user: anon ? '匿名用户' : '我',
    anon: anon,
    title: title,
    body: body,
    rating: selectedRating,
    ratingLabel: ratingLabels[selectedRating],
    time: '刚刚',
    likes: 0,
    comments: 0,
    tags: tags ? tags.split(/[,，\s]+/).filter(Boolean) : ['真实评价'],
    status: 'pending'
  };
  if (!reviewsData[companyId]) reviewsData[companyId] = [];
  reviewsData[companyId].unshift(newReview);

  // Reset form
  document.getElementById('postCompany').value = '';
  document.getElementById('postTitle').value = '';
  document.getElementById('postBody').value = '';
  document.getElementById('postTags').value = '';
  document.getElementById('postProvince').value = '';
  document.getElementById('postCity').value = '';
  document.getElementById('postAnon').checked = true;
  document.querySelectorAll('.rating-option').forEach(o => o.classList.remove('selected'));
  selectedRating = 0;

  showToast('发布成功，等待审核');
  setTimeout(() => goTo('profile'), 800);
}

// Search
function setupSearch() {
  const input = document.getElementById('searchInput');
  const modal = document.getElementById('searchModal');
  const results = document.getElementById('searchResults');

  input.addEventListener('focus', function() {
    modal.classList.add('show');
    doSearch(this.value);
  });

  let timer;
  input.addEventListener('input', function() {
    clearTimeout(timer);
    timer = setTimeout(() => doSearch(this.value), 200);
  });
}

function doSearch(keyword) {
  const results = document.getElementById('searchResults');
  if (!keyword.trim()) {
    results.innerHTML = `<div style="padding:20px;color:var(--light);text-align:center;">输入公司名称搜索</div>`;
    return;
  }
  const filtered = companies.filter(c => c.name.includes(keyword) || c.abbr.includes(keyword) || c.industry.includes(keyword));
  if (filtered.length === 0) {
    results.innerHTML = `<div style="padding:20px;color:var(--light);text-align:center;">未找到相关公司</div>`;
    return;
  }
  results.innerHTML = filtered.map(c => `
    <div class="company-card" onclick="closeSearch();openCompany(${c.id})" style="margin:8px 0;">
      <div class="logo-box">${c.abbr}</div>
      <div class="info">
        <div class="name">${c.name}</div>
        <div class="meta">${c.loc} · ${c.industry} · ${c.reviews}条评价</div>
      </div>
      <div class="score-box">
        <div class="score">${c.score}</div>
      </div>
    </div>
  `).join('');
}

function closeSearch() {
  document.getElementById('searchModal').classList.remove('show');
  document.getElementById('searchInput').blur();
}

// Toast
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

// ===================== INIT =====================
function init() {
  renderHotCompanies();
  renderHotTopics();
  setupRatingSelect();
  setupSearch();

  // Animate stats
  setTimeout(() => {
    document.getElementById('statCompanies').classList.add('pulse');
  }, 500);
}

init();
</script>
