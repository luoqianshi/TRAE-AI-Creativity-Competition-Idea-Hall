  .stagger-3 { transition-delay: 0.2s; }

function iconHtml(name, className) {
  const svg = Icons[name] || '';
  return '<span class="inline-flex ' + (className || '') + '">' + svg + '</span>';
}

// ===== Intersection Observer for scroll animations =====
function setupScrollReveal() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.15, rootMargin: '-60px' });

  document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(el => observer.observe(el));
}

// ===== Header =====
function renderHeader() {
  const header = document.getElementById('header');
  if (!header) return;

  let scrolled = false;
  window.addEventListener('scroll', () => {
    const now = window.scrollY > 40;
    if (now !== scrolled) {
      scrolled = now;
      header.className = 'sticky top-0 z-50 w-full transition-all duration-300 border-b ' +
        (scrolled ? 'bg-background/85 backdrop-blur-xl border-border/40 shadow-sm' : 'bg-transparent border-transparent');
    }
  }, { passive: true });

  // Mobile menu
  const mobileToggle = document.getElementById('mobile-toggle');
  const mobileNav = document.getElementById('mobile-nav');
  if (mobileToggle && mobileNav) {
    mobileToggle.addEventListener('click', () => {
      const isOpen = mobileNav.style.display !== 'none';
      mobileNav.style.display = isOpen ? 'none' : 'block';
      mobileToggle.querySelector('.icon-menu').style.display = isOpen ? '' : 'none';
      mobileToggle.querySelector('.icon-x').style.display = isOpen ? 'none' : '';
    });
    mobileNav.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        mobileNav.style.display = 'none';
        mobileToggle.querySelector('.icon-menu').style.display = '';
        mobileToggle.querySelector('.icon-x').style.display = 'none';
      });
    });
  }
}

        <p class="text-center text-sm text-muted-foreground">© 2026 书迹 BookTrace · ${CONTEST_INFO.name} · ${CONTEST_INFO.team}</p>
      </div>
    </section>
  </main>
</div>`;

  // Initialize interactions
  setTimeout(() => {
    setupScrollReveal();
    renderHeader();

    // Trigger initial visible animations for elements already in viewport
    document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(el => {
      const rect = el.getBoundingClientRect();
      if (rect.top < window.innerHeight) el.classList.add('visible');
    });

    // Progress bar animations
    setTimeout(() => {
      document.querySelectorAll('[class*="animate-progress-"]').forEach(el => {
        el.style.animationPlayState = 'running';
      });
    }, 300);
  }, 50);
}

// Run
document.addEventListener('DOMContentLoaded', buildPage);
</script>
</body>
</html>
