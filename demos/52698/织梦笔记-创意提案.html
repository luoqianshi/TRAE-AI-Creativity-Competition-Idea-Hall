<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>织梦笔记 — 会记住你整个故事的 AI 写作助手</title>
<style>
  :root {
    --paper: #faf8f3;
    --paper-2: #f3efe6;
    --surface: #ffffff;
    --ink: #26222c;
    --ink-soft: #514b57;
    --muted: #8b8592;
    --line: #e7e1d6;
    --violet: #6a5acd;
    --violet-soft: #ede9fb;
    --violet-deep: #4b3fa8;
    --emerald: #1f9e7a;
    --emerald-soft: #e2f4ee;
    --amber: #d98a2b;
    --amber-soft: #fbeed6;
    --rose: #c0506a;
    --rose-soft: #f8e5ea;
    --shadow: 0 1px 3px rgba(38,34,44,.06), 0 8px 24px rgba(38,34,44,.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink-soft);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .serif {
    font-family: Georgia, "Songti SC", "STSong", "SimSun", serif;
  }

  /* ===== Top Bar ===== */
  .topbar {
    height: 58px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    padding: 0 22px;
    gap: 14px;
    position: relative;
    z-index: 20;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: var(--ink);
    font-size: 1.05rem;
  }
  .logo .mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--violet), var(--violet-deep));
    display: grid; place-items: center;
    color: #fff; font-size: 16px;
    box-shadow: 0 3px 10px rgba(106,90,205,.35);
  }
  .logo .sub {
    font-size: .72rem;
    color: var(--muted);
    font-weight: 500;
    border-left: 1px solid var(--line);
    padding-left: 12px;
    margin-left: 4px;
  }
  .topbar .spacer { flex: 1; }
  .badge-contest {
    font-size: .72rem;
    color: var(--violet-deep);
    background: var(--violet-soft);
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 600;
  }
  .btn-export {
    font-size: .82rem;
    color: var(--ink);
    background: var(--paper-2);
    border: 1px solid var(--line);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: all .15s;
  }
  .btn-export:hover { background: var(--violet-soft); border-color: var(--violet); color: var(--violet-deep); }

  /* ===== Layout ===== */
  .workspace {
    display: grid;
    grid-template-columns: 1fr 400px;
    height: calc(100vh - 58px);
  }

  /* ===== Chat panel ===== */
  .chat-panel {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--paper);
    min-height: 0;
  }

  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 26px 30px 10px;
    scroll-behavior: smooth;
  }
  .chat-scroll::-webkit-scrollbar { width: 8px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: #ddd6c8; border-radius: 4px; }

  .msg {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    max-width: 680px;
    animation: rise .4s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px);} to {opacity:1; transform:none;} }

  .msg .avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 15px;
    font-weight: 700;
  }
  .msg.ai .avatar { background: linear-gradient(135deg, var(--violet), var(--violet-deep)); color:#fff; }
  .msg.user .avatar { background: var(--ink); color: #fff; }
  .msg .bubble {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px 14px 14px 14px;
    padding: 13px 16px;
    font-size: .92rem;
    color: var(--ink-soft);
    box-shadow: var(--shadow);
  }
  .msg.user { flex-direction: row-reverse; margin-left: auto; }
  .msg.user .bubble {
    background: var(--ink);
    color: #f5f2ee;
    border: none;
    border-radius: 14px 4px 14px 14px;
  }
  .bubble .memtag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
    font-size: .74rem;
    color: var(--emerald);
    background: var(--emerald-soft);
    padding: 4px 9px;
    border-radius: 6px;
    font-weight: 600;
    animation: pop .5s ease both;
  }
  @keyframes pop { 0%{transform:scale(.8);opacity:0;} 60%{transform:scale(1.05);} 100%{transform:scale(1);opacity:1;} }
  .bubble .recall {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--violet-soft);
    border-left: 3px solid var(--violet);
    border-radius: 6px;
    font-size: .82rem;
    color: var(--violet-deep);
  }
  .bubble .recall b { color: var(--violet-deep); }
  .bubble .warn {
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--rose-soft);
    border-left: 3px solid var(--rose);
    border-radius: 6px;
    font-size: .82rem;
    color: #96354c;
  }

  /* typing indicator */
  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--violet);
    animation: blink 1.2s infinite ease-in-out both;
  }
  .typing span:nth-child(2){ animation-delay:.2s; }
  .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25;transform:scale(.85);} 40%{opacity:1;transform:scale(1);} }

  /* ===== Composer ===== */
  .composer {
    border-top: 1px solid var(--line);
    background: var(--surface);
    padding: 14px 22px 18px;
  }
  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    min-height: 30px;
  }
  .chip {
    font-size: .8rem;
    color: var(--violet-deep);
    background: var(--violet-soft);
    border: 1px solid transparent;
    padding: 6px 12px;
    border-radius: 18px;
    cursor: pointer;
    transition: all .15s;
    animation: rise .35s ease both;
  }
  .chip:hover { background: #fff; border-color: var(--violet); transform: translateY(-1px); }
  .chip.ghost { color: var(--emerald); background: var(--emerald-soft); }
  .chip.ghost:hover { border-color: var(--emerald); }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .input-row textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: inherit;
    font-size: .92rem;
    color: var(--ink);
    line-height: 1.5;
    max-height: 120px;
    background: var(--paper);
    transition: border-color .15s;
  }
  .input-row textarea:focus { outline: none; border-color: var(--violet); }
  .send-btn {
    width: 46px; height: 46px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--violet), var(--violet-deep));
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: grid; place-items: center;
    transition: transform .12s, box-shadow .2s;
    box-shadow: 0 4px 12px rgba(106,90,205,.3);
  }
  .send-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(106,90,205,.4); }
  .send-btn:active { transform: scale(.95); }

  /* ===== Memory panel ===== */
  .memory-panel {
    background: var(--paper-2);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .mem-head {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--paper-2);
  }
  .mem-head .title {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; color: var(--ink); font-size: .98rem;
  }
  .mem-head .title .brain {
    width: 26px; height: 26px; border-radius: 8px;
    background: var(--emerald-soft); color: var(--emerald);
    display: grid; place-items: center; font-size: 14px;
  }
  .mem-head .desc { font-size: .76rem; color: var(--muted); margin-top: 4px; }
  .mem-head .count {
    margin-left: auto;
    font-size: .74rem;
    background: var(--emerald);
    color: #fff;
    padding: 2px 9px;
    border-radius: 12px;
    font-weight: 700;
  }

  .mem-filters {
    display: flex; gap: 6px; padding: 12px 18px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
  }
  .filter {
    font-size: .76rem;
    padding: 4px 11px;
    border-radius: 14px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-weight: 600;
    transition: all .15s;
  }
  .filter.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .mem-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px 24px;
  }
  .mem-scroll::-webkit-scrollbar { width: 8px; }
  .mem-scroll::-webkit-scrollbar-thumb { background: #d8d0c0; border-radius: 4px; }

  .mem-empty {
    text-align: center;
    color: var(--muted);
    font-size: .84rem;
    padding: 50px 20px;
    line-height: 1.9;
  }
  .mem-empty .big { font-size: 30px; margin-bottom: 12px; opacity: .5; }

  .mem-group-label {
    font-size: .72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 14px 2px 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .mem-group-label:first-child { margin-top: 0; }

  .mem-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 13px;
    margin-bottom: 9px;
    box-shadow: var(--shadow);
    animation: cardIn .5s cubic-bezier(.2,.8,.3,1) both;
    position: relative;
    border-left: 3px solid var(--line);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateX(16px) scale(.96); }
    to { opacity: 1; transform: none; }
  }
  .mem-card.type-world { border-left-color: var(--violet); }
  .mem-card.type-char { border-left-color: var(--amber); }
  .mem-card.type-plot { border-left-color: var(--rose); }
  .mem-card.type-note { border-left-color: var(--emerald); }

  .mem-card .mc-head {
    display: flex; align-items: center; gap: 7px; margin-bottom: 4px;
  }
  .mem-card .mc-icon { font-size: 14px; }
  .mem-card .mc-title { font-weight: 700; color: var(--ink); font-size: .87rem; }
  .mem-card .mc-body { font-size: .82rem; color: var(--ink-soft); }
  .mem-card .mc-fresh {
    position: absolute; top: 10px; right: 10px;
    font-size: .64rem; color: var(--emerald); font-weight: 700;
    background: var(--emerald-soft); padding: 2px 6px; border-radius: 6px;
    animation: fadeOut 3s forwards;
  }
  @keyframes fadeOut { 0%,60%{opacity:1;} 100%{opacity:0;} }

  /* onboarding overlay */
  .onboard {
    position: fixed; inset: 0;
    background: rgba(38,34,44,.55);
    backdrop-filter: blur(4px);
    display: grid; place-items: center;
    z-index: 100;
    animation: rise .4s ease;
  }
  .onboard-card {
    background: var(--surface);
    border-radius: 20px;
    padding: 36px 40px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .onboard-card h2 { color: var(--ink); font-size: 1.5rem; margin-bottom: 8px; }
  .onboard-card p { color: var(--muted); font-size: .9rem; margin-bottom: 24px; }
  .genre-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .genre {
    padding: 18px 14px;
    border: 1.5px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    transition: all .18s;
    text-align: left;
  }
  .genre:hover { border-color: var(--violet); background: var(--violet-soft); transform: translateY(-2px); }
  .genre .g-emoji { font-size: 24px; }
  .genre .g-name { font-weight: 700; color: var(--ink); margin-top: 6px; font-size: .95rem; }
  .genre .g-desc { font-size: .74rem; color: var(--muted); margin-top: 2px; }

  /* export modal */
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(38,34,44,.55);
    backdrop-filter: blur(4px);
    display: none; place-items: center;
    z-index: 100;
  }
  .modal-mask.show { display: grid; animation: rise .3s ease; }
  .modal {
    background: var(--surface);
    border-radius: 18px;
    padding: 28px 30px;
    max-width: 560px; width: 92%;
    max-height: 80vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal h3 { color: var(--ink); margin-bottom: 4px; display:flex; align-items:center; gap:8px;}
  .modal .m-sub { color: var(--muted); font-size:.82rem; margin-bottom: 18px; }
  .outline-block { margin-bottom: 16px; }
  .outline-block h4 {
    font-size: .8rem; color: var(--violet-deep); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px;
  }
  .outline-block ul { list-style: none; }
  .outline-block li { font-size: .86rem; padding: 4px 0 4px 16px; position: relative; color: var(--ink-soft); }
  .outline-block li::before { content: "·"; position: absolute; left: 4px; color: var(--violet); font-weight: 700; }
  .modal-close {
    margin-top: 12px; width: 100%; padding: 11px; border: none;
    background: var(--ink); color: #fff; border-radius: 10px; cursor: pointer; font-weight: 600;
  }

  @media (max-width: 860px) {
    .workspace { grid-template-columns: 1fr; }
    .memory-panel { display: none; }
    .topbar .mobile-mem { display: inline-flex !important; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <span class="mark serif">织</span>
    织梦笔记
    <span class="sub">AI 会替你记住整个故事</span>
  </div>
  <div class="spacer"></div>
  <span class="badge-contest">TRAE AI 创造力大赛 · 生活娱乐</span>
  <button class="btn-export" id="exportBtn">📑 生成大纲</button>
</div>

<div class="workspace">
  <!-- Chat -->
  <div class="chat-panel">
    <div class="chat-scroll" id="chatScroll"></div>
    <div class="composer">
      <div class="suggestions" id="suggestions"></div>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="告诉 AI 你的设定、人物或剧情，它会替你记住…"></textarea>
        <button class="send-btn" id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <!-- Memory -->
  <div class="memory-panel">
    <div class="mem-head">
      <div class="title">
        <span class="brain">🧠</span>
        故事记忆库
        <span class="count" id="memCount">0</span>
      </div>
      <div class="desc">AI 从你们的对话里自动提取并长期记住每一条设定</div>
    </div>
    <div class="mem-filters" id="memFilters">
      <span class="filter active" data-f="all">全部</span>
      <span class="filter" data-f="world">🌍 世界观</span>
      <span class="filter" data-f="char">👤 人物</span>
      <span class="filter" data-f="plot">📜 剧情</span>
      <span class="filter" data-f="note">💡 灵感</span>
    </div>
    <div class="mem-scroll" id="memScroll">
      <div class="mem-empty" id="memEmpty">
        <div class="big">🪶</div>
        还没有记忆。<br>开始和 AI 聊你的故事，<br>它记住的一切都会出现在这里。
      </div>
    </div>
  </div>
</div>

<!-- Onboarding -->
<div class="onboard" id="onboard">
  <div class="onboard-card">
    <h2 class="serif">开始编织你的世界</h2>
    <p>选一个题材，AI 编辑会陪你从零搭建世界观、人物与剧情——<br>并把每一条设定牢牢记住。</p>
    <div class="genre-grid" id="genreGrid"></div>
  </div>
</div>

<!-- Export modal -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 class="serif">📑 AI 整理的故事大纲</h3>
    <div class="m-sub">以下内容全部由记忆库自动生成——你从未手动整理过它们</div>
    <div id="outlineBody"></div>
    <button class="modal-close" id="modalClose">关闭</button>
  </div>
</div>

<script>
/* ================= Data: genre-driven guided scripts ================= */
const GENRES = {
  xuanhuan: {
    emoji: "🐉", name: "玄幻修仙", desc: "灵气、宗门、逆天改命",
    intro: "玄幻题材，我最拿手了。先从最关键的问起——你这个世界，力量体系是怎么运转的？灵气？血脉？还是别的？",
    seed: [
      { text: "灵气复苏后的现代都市，普通人能觉醒'词条'能力", memo:[{t:"world",title:"力量体系",body:"灵气复苏，觉醒者可获得随机『词条』能力，词条越稀有越强"}] },

      { text: "民宿老板娘知道些什么，但一直在说谎", memo:[{t:"char",title:"民宿老板娘",body:"疑似知情者，多次说谎；她的动机是本案关键反转"}] }

  romance: {

    seed: [

      { text: "两人因为一份旧合同的秘密纠缠在一起", memo:[{t:"plot",title:"核心悬念",body:"一份旧合同暗藏两人过去的交集，是情感反转的伏笔"}] }

  scifi: {

    intro: "科幻的根基是世界规则。先说说——这是个什么样的世界？发生了什么，让它变成现在这样？",
    seed: [
      { text: "AI 接管全球后，人类被划分为'有用'和'冗余'两类", memo:[{t:"world",title:"世界背景",body:"AI『方舟』接管全球治理，按算力贡献将人类分为『有用』与『冗余』"}] },
      { text: "主角是被判定为'冗余'的算法工程师夏至", memo:[{t:"char",title:"夏至（主角）",body:"前算法工程师，被系统判定为『冗余』；掌握方舟的底层漏洞"}] },
      { text: "他发现自己当年参与编写了方舟的核心代码", memo:[{t:"char",title:"夏至（主角）",body:"前算法工程师，被判定『冗余』；实为方舟核心代码的编写者之一——身份即武器"},{t:"plot",title:"核心冲突",body:"夏至 vs 方舟——创造者反抗自己造出的系统"}] }
    ]
  }
};

/* memory type meta */
const TYPE_META = {
  world: { icon:"🌍", label:"世界观设定", cls:"type-world" },
  char:  { icon:"👤", label:"人物档案",   cls:"type-char" },
  plot:  { icon:"📜", label:"剧情线索",   cls:"type-plot" },
  note:  { icon:"💡", label:"灵感碎片",   cls:"type-note" }
};

/* ================= State ================= */
let memory = [];        // {id,type,title,body}
let currentGenre = null;
let seedIndex = 0;
let currentFilter = "all";

const $ = s => document.querySelector(s);
const chatScroll = $("#chatScroll");
const memScroll = $("#memScroll");
const memEmpty = $("#memEmpty");
const suggestions = $("#suggestions");

/* ================= Onboarding ================= */
const genreGrid = $("#genreGrid");
Object.entries(GENRES).forEach(([key,g])=>{
  const el = document.createElement("div");
  el.className = "genre";
  el.innerHTML = `<div class="g-emoji">${g.emoji}</div><div class="g-name">${g.name}</div><div class="g-desc">${g.desc}</div>`;
  el.onclick = ()=> startGenre(key);
  genreGrid.appendChild(el);
});

function startGenre(key){
  currentGenre = key;
  seedIndex = 0;
  $("#onboard").style.display = "none";
  const g = GENRES[key];
  addMsg("ai", g.intro);
  renderSuggestions();
}

/* ================= Chat rendering ================= */
function addMsg(role, html, extras){
  const m = document.createElement("div");
  m.className = "msg " + role;
  const av = role==="ai" ? "织" : "你";
  m.innerHTML = `<div class="avatar serif">${av}</div><div class="bubble">${html}${extras||""}</div>`;
  chatScroll.appendChild(m);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  return m;
}

function showTyping(){
  const m = document.createElement("div");
  m.className = "msg ai";
  m.id = "typingMsg";
  m.innerHTML = `<div class="avatar serif">织</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatScroll.appendChild(m);
  chatScroll.scrollTop = chatScroll.scrollHeight;
}
function removeTyping(){ const t = $("#typingMsg"); if(t) t.remove(); }

/* ================= Memory ================= */
function addMemory(items){
  items.forEach(it=>{
    // merge: if title exists, update body (demonstrates AI updating its memory)
    const existing = memory.find(m=>m.title===it.title);
    if(existing){ existing.body = it.body; existing._updated = true; }
    else memory.push({ id: Date.now()+Math.random(), type:it.t, title:it.title, body:it.body, _fresh:true });
  });
  renderMemory();
}

function renderMemory(){
  const items = currentFilter==="all" ? memory : memory.filter(m=>m.type===currentFilter);
  $("#memCount").textContent = memory.length;
  if(items.length===0){
    memScroll.innerHTML = "";
    memScroll.appendChild(memEmpty);
    memEmpty.style.display = memory.length===0 ? "block":"block";
    if(memory.length>0){ memEmpty.innerHTML = '<div class="big">🔍</div>该分类下暂无记忆'; }
    return;
  }
  memScroll.innerHTML = "";
  // group by type in fixed order
  const order = ["world","char","plot","note"];
  order.forEach(t=>{
    const group = items.filter(m=>m.type===t);
    if(group.length===0) return;
    const label = document.createElement("div");
    label.className = "mem-group-label";
    label.innerHTML = `${TYPE_META[t].icon} ${TYPE_META[t].label} · ${group.length}`;
    memScroll.appendChild(label);
    group.forEach(m=>{
      const c = document.createElement("div");
      c.className = "mem-card " + TYPE_META[t].cls;
      c.innerHTML = `
        <div class="mc-head"><span class="mc-icon">${TYPE_META[t].icon}</span><span class="mc-title">${m.title}</span></div>
        <div class="mc-body">${m.body}</div>
        ${m._fresh?'<span class="mc-fresh">刚记住</span>':(m._updated?'<span class="mc-fresh">已更新</span>':'')}`;
      memScroll.appendChild(c);
      m._fresh = false; m._updated = false;
    });
  });
}

/* filters */
$("#memFilters").addEventListener("click", e=>{
  if(!e.target.classList.contains("filter")) return;
  document.querySelectorAll(".filter").forEach(f=>f.classList.remove("active"));
  e.target.classList.add("active");
  currentFilter = e.target.dataset.f;
  renderMemory();
});

/* ================= Suggestions (guided + smart) ================= */
function renderSuggestions(){
  suggestions.innerHTML = "";
  const g = GENRES[currentGenre];
  // next guided seed
  if(g && seedIndex < g.seed.length){
    const s = g.seed[seedIndex];
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.textContent = "💬 " + s.text;
    chip.onclick = ()=> { $("#input").value = s.text; sendMessage(); };
    suggestions.appendChild(chip);
  }
  // recall demos (once there's memory)
  if(memory.length >= 2){
    const recalls = [
      "主角是谁？动机是什么？",
      "帮我回顾一下核心冲突",
      "这个世界的设定有没有矛盾？"
    ];
    recalls.forEach(r=>{
      const c = document.createElement("div");
      c.className = "chip ghost";
      c.textContent = "🧠 " + r;
      c.onclick = ()=> { $("#input").value = r; sendMessage(); };
      suggestions.appendChild(c);
    });
  }
}

/* ================= AI brain ================= */
function aiRespond(text){
  const t = text.toLowerCase();
  const g = GENRES[currentGenre];

  // 1) Guided seed match
  if(g && seedIndex < g.seed.length && text === g.seed[seedIndex].text){
    const s = g.seed[seedIndex];
    seedIndex++;
    const memNames = s.memo.map(m=>m.title).join("、");
    let reply = seedReplies[currentGenre] ? seedReplies[currentGenre][seedIndex-1] : "很好，我记下了。继续吧——还有什么设定？";
    return { reply, memo: s.memo, memNames };
  }

  // 2) Recall: 主角/人物
  if(/主角|主人公|谁|人物|角色/.test(text) && /谁|动机|回顾|回忆|是|档案/.test(text)){
    const chars = memory.filter(m=>m.type==="char");
    if(chars.length){
      const list = chars.map(c=>`<b>${c.title}</b>：${c.body}`).join("<br>");
      return { reply:"我翻了下记忆库，关于人物我记得这些——", recall:list };
    }
  }
  // 3) Recall: 冲突/剧情
  if(/冲突|剧情|回顾|大纲|主线|梳理|回忆/.test(text)){
    const plots = memory.filter(m=>m.type==="plot");
    if(plots.length){
      const list = plots.map(p=>`<b>${p.title}</b>：${p.body}`).join("<br>");
      return { reply:"根据我记住的剧情线索，目前的主线是——", recall:list };
    }
  }
  // 4) Consistency check
  if(/矛盾|一致|冲突吗|对不对|检查|逻辑/.test(text)){
    if(memory.length>=3){
      return { reply:"我把记忆库里的设定交叉比对了一遍——",
        warn:"⚠️ 发现一处需要注意：目前『力量体系/世界规则』已设定，但还没有交代<b>普通人如何看待主角的能力</b>。建议补充社会反应，否则后期剧情容易出现设定悬空。要现在补一条吗？" };
    }
    return { reply:"目前设定还比较少，等你多告诉我几条，我就能帮你做交叉一致性检查了。" };
  }

  // 5) Free-form extraction (keyword heuristics)
  const extracted = freeExtract(text);
  if(extracted.length){
    const memNames = extracted.map(m=>m.title).join("、");
    return { reply:"收到，这几点我都记进故事记忆库了，之后随时能帮你调出来。还有别的设定吗？", memo:extracted, memNames };
  }

  // 6) fallback
  return { reply:"嗯，我在听。你可以直接告诉我世界规则、人物或剧情——比如『主角是个……』或者『这个世界里……』，我会自动帮你归档记忆。" };
}

/* extra scripted replies per genre per seed step */
const seedReplies = {
  xuanhuan: [

  ],
  suspense: [
    "封闭空间+集体失踪，经典而有效，场景和谜案我都记牢了。那——谁来破案？",

/* naive keyword extraction for free input */
function freeExtract(text){
  const out = [];
  // character: 名字 patterns
  const charMatch = text.match(/(主角|女主|男主|主人公|反派)(叫|是|名叫)?\s*([一-龥]{2,4})/);
  if(charMatch){
    out.push({t:"char", title:charMatch[3]+"（"+charMatch[1]+"）", body:text});
  }
  // world: 世界/设定 keywords
  if(/世界|设定|体系|规则|大陆|王国|时代|背景|系统|力量/.test(text) && out.length===0){
    out.push({t:"world", title:"世界观设定", body:text});
  }
  // plot: 冲突/事件
  else if(/冲突|事件|发生|阴谋|任务|目标|危机|战争|案件/.test(text) && out.length===0){
    out.push({t:"plot", title:"剧情线索", body:text});
  }
  // else note if long enough
  else if(out.length===0 && text.length>=6){
    out.push({t:"note", title:"灵感碎片", body:text});
  }
  return out;
}

/* ================= Send flow ================= */
function sendMessage(){
  const val = $("#input").value.trim();
  if(!val) return;
  addMsg("user", escapeHtml(val));
  $("#input").value = "";
  $("#input").style.height = "auto";
  suggestions.innerHTML = "";

  showTyping();
  setTimeout(()=>{
    removeTyping();
    const res = aiRespond(val);
    let extras = "";
    if(res.recall) extras += `<div class="recall">${res.recall}</div>`;
    if(res.warn) extras += `<div class="warn">${res.warn}</div>`;
    if(res.memNames) extras += `<div class="memtag">🧠 已记住：${res.memNames}</div>`;
    addMsg("ai", escapeHtml(res.reply), extras);
    if(res.memo) addMemory(res.memo);
    renderSuggestions();
  }, 700 + Math.random()*500);
}

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

$("#sendBtn").onclick = sendMessage;
$("#input").addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
$("#input").addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight,120)+"px";
});

/* ================= Export outline ================= */
$("#exportBtn").onclick = ()=>{
  const body = $("#outlineBody");
  if(memory.length===0){
    body.innerHTML = '<p style="color:#8b8592;font-size:.88rem;">记忆库还是空的——先和 AI 聊聊你的故事吧。</p>';
  } else {
    body.innerHTML = "";
    ["world","char","plot","note"].forEach(t=>{
      const group = memory.filter(m=>m.type===t);
      if(!group.length) return;
      const block = document.createElement("div");
      block.className = "outline-block";
      block.innerHTML = `<h4>${TYPE_META[t].icon} ${TYPE_META[t].label}</h4><ul>${
        group.map(m=>`<li><b>${m.title}</b> — ${m.body}</li>`).join("")
      }</ul>`;
      body.appendChild(block);
    });
  }
  $("#modalMask").classList.add("show");
};
$("#modalClose").onclick = ()=> $("#modalMask").classList.remove("show");
$("#modalMask").onclick = e=>{ if(e.target.id==="modalMask") $("#modalMask").classList.remove("show"); };
</script>
