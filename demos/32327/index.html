<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent社区平面图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #90EE90;
        }
        canvas {
            display: block;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            font-family: Arial, sans-serif;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="toast" id="toast"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const toast = document.getElementById('toast');

        const buildings = [];
        const people = [];

        const houseColors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7', '#DDA0DD', '#FF8C00', '#98D8C8', '#F7DC6F', '#BB8FCE'];
        const personColors = ['#E74C3C', '#3498DB', '#2ECC71', '#F39C12', '#9B59B6', '#1ABC9C', '#E91E63', '#00BCD4', '#FF5722', '#795548'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initBuildings();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function initBuildings() {
            buildings.length = 0;
            
            const margin = 80;
            const cols = 5;
            const rows = 2;
            const spacingX = (canvas.width - margin * 2) / cols;
            const spacingY = (canvas.height - margin * 2) / (rows + 1);

            for (let i = 0; i < 10; i++) {
                const col = i % cols;
                const row = Math.floor(i / cols);
                buildings.push({
                    type: 'house',
                    x: margin + col * spacingX + spacingX / 2,
                    y: margin + row * spacingY + spacingY / 2,
                    width: 60,
                    height: 50,
                    color: houseColors[i],
                    id: i,
                    name: `Agent ${i + 1}之家`
                });
            }

            buildings.push({
                type: 'bank',
                x: margin + 0 * spacingX + spacingX / 2,
                y: margin + 2 * spacingY + spacingY / 2,
                width: 70,
                height: 70,
                color: '#F1C40F',
                id: 12,
                name: '银行'
            });

            buildings.push({
                type: 'station',
                x: margin + 1 * spacingX + spacingX / 2,
                y: margin + 2 * spacingY + spacingY / 2,
                width: 80,
                height: 60,
                color: '#3498DB',
                id: 10,
                name: '工作站 A'
            });

            buildings.push({
                type: 'station',
                x: margin + 3 * spacingX + spacingX / 2,
                y: margin + 2 * spacingY + spacingY / 2,
                width: 80,
                height: 60,
                color: '#3498DB',
                id: 11,
                name: '工作站 B'
            });

            buildings.push({
                type: 'court',
                x: margin + 4 * spacingX + spacingX / 2,
                y: margin + 2 * spacingY + spacingY / 2,
                width: 75,
                height: 65,
                color: '#9B59B6',
                id: 13,
                name: '法院'
            });
        }

        function drawHouse(building) {
            const { x, y, width, height, color } = building;
            
            ctx.fillStyle = color;
            ctx.fillRect(x - width / 2, y - height / 3, width, height);
            
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.moveTo(x - width / 2 - 5, y - height / 3);
            ctx.lineTo(x, y - height / 3 - 25);
            ctx.lineTo(x + width / 2 + 5, y - height / 3);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#654321';
            ctx.fillRect(x - 8, y, 16, height / 3);
            
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(x - width / 3, y - height / 6, 12, 12);
            ctx.fillRect(x + width / 3 - 12, y - height / 6, 12, 12);
            
            ctx.fillStyle = '#333';
            ctx.font = '10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(building.name, x, y + height / 2 + 15);
        }

        function drawStation(building) {
            const { x, y, width, height, color } = building;
            
            ctx.fillStyle = color;
            ctx.fillRect(x - width / 2, y - height / 2, width, height);
            
            ctx.fillStyle = '#2980B9';
            ctx.fillRect(x - width / 2 - 5, y - height / 2 - 15, width + 10, 15);
            
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('📋', x, y + 8);
            
            ctx.fillStyle = '#2C3E50';
            ctx.font = '11px Arial';
            ctx.fillText(building.name, x, y + height / 2 + 15);
        }

        function drawBank(building) {
            const { x, y, width, height, color } = building;
            
            ctx.fillStyle = color;
            ctx.fillRect(x - width / 2, y - height / 2, width, height);
            
            ctx.fillStyle = '#D4AC0D';
            ctx.fillRect(x - width / 2, y - height / 2 - 20, width, 20);
            
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.moveTo(x, y - height / 2 - 35);
            ctx.lineTo(x - 15, y - height / 2 - 20);
            ctx.lineTo(x + 15, y - height / 2 - 20);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('💰', x, y + 8);
            
            ctx.fillStyle = '#2C3E50';
            ctx.font = '11px Arial';
            ctx.fillText(building.name, x, y + height / 2 + 15);
        }

        function drawCourt(building) {
            const { x, y, width, height, color } = building;
            
            ctx.fillStyle = color;
            ctx.fillRect(x - width / 2, y - height / 2, width, height);
            
            ctx.fillStyle = '#7D3C98';
            for (let i = 0; i < 3; i++) {
                ctx.fillRect(x - width / 2 + i * 25, y - height / 2 - 15, 20, 15);
            }
            
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('⚖️', x, y + 8);
            
            ctx.fillStyle = '#2C3E50';
            ctx.font = '11px Arial';
            ctx.fillText(building.name, x, y + height / 2 + 15);
        }

        function drawRoads() {
            ctx.strokeStyle = '#666666';
            ctx.lineWidth = 30;
            ctx.lineCap = 'round';
            ctx.setLineDash([]);

            const houses = buildings.filter(b => b.type === 'house');
            const stations = buildings.filter(b => b.type === 'station');
            const bank = buildings.find(b => b.type === 'bank');
            const court = buildings.find(b => b.type === 'court');

            stations.forEach(station => {
                houses.forEach(house => {
                    ctx.beginPath();
                    ctx.moveTo(house.x, house.y);
                    ctx.lineTo(station.x, station.y);
                    ctx.stroke();
                });
            });

            houses.forEach(house => {
                ctx.beginPath();
                ctx.moveTo(house.x, house.y);
                ctx.lineTo(bank.x, bank.y);
                ctx.stroke();
            });

            houses.forEach(house => {
                ctx.beginPath();
                ctx.moveTo(house.x, house.y);
                ctx.lineTo(court.x, court.y);
                ctx.stroke();
            });

            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            ctx.setLineDash([15, 10]);
            
            stations.forEach(station => {
                houses.forEach(house => {
                    ctx.beginPath();
                    ctx.moveTo(house.x, house.y);
                    ctx.lineTo(station.x, station.y);
                    ctx.stroke();
                });
            });

            houses.forEach(house => {
                ctx.beginPath();
                ctx.moveTo(house.x, house.y);
                ctx.lineTo(bank.x, bank.y);
                ctx.stroke();
            });

            houses.forEach(house => {
                ctx.beginPath();
                ctx.moveTo(house.x, house.y);
                ctx.lineTo(court.x, court.y);
                ctx.stroke();
            });

            ctx.setLineDash([]);
        }

        function createPerson() {
            const houses = buildings.filter(b => b.type === 'house');
            const stations = buildings.filter(b => b.type === 'station');
            const bank = buildings.find(b => b.type === 'bank');
            const court = buildings.find(b => b.type === 'court');

            const startHouse = houses[Math.floor(Math.random() * houses.length)];
            const targetTypes = ['station', 'station', 'bank', 'court'];
            const targetType = targetTypes[Math.floor(Math.random() * targetTypes.length)];
            
            let target;
            if (targetType === 'station') {
                target = stations[Math.floor(Math.random() * stations.length)];
            } else if (targetType === 'bank') {
                target = bank;
            } else {
                target = court;
            }

            people.push({
                x: startHouse.x,
                y: startHouse.y,
                targetX: target.x,
                targetY: target.y,
                color: personColors[Math.floor(Math.random() * personColors.length)],
                speed: 0.5 + Math.random() * 1,
                progress: 0,
                returning: false
            });
        }

        function updatePeople() {
            for (let i = people.length - 1; i >= 0; i--) {
                const person = people[i];
                person.progress += 0.003 * person.speed;

                if (person.progress >= 1) {
                    if (person.returning) {
                        people.splice(i, 1);
                    } else {
                        person.returning = true;
                        person.progress = 0;
                        [person.x, person.targetX] = [person.targetX, person.x];
                        [person.y, person.targetY] = [person.targetY, person.y];
                    }
                }
            }

            if (people.length < 15 && Math.random() < 0.02) {
                createPerson();
            }
        }

        function drawPeople() {
            people.forEach(person => {
                const currentX = person.x + (person.targetX - person.x) * person.progress;
                const currentY = person.y + (person.targetY - person.y) * person.progress;

                ctx.fillStyle = person.color;
                ctx.beginPath();
                ctx.arc(currentX, currentY - 8, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillRect(currentX - 4, currentY - 2, 8, 12);

                ctx.strokeStyle = person.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(currentX - 3, currentY + 10);
                ctx.lineTo(currentX - 5, currentY + 18);
                ctx.moveTo(currentX + 3, currentY + 10);
                ctx.lineTo(currentX + 5, currentY + 18);
                ctx.stroke();
            });
        }

        function isPointInBuilding(x, y, building) {
            return x >= building.x - building.width / 2 - 10 &&
                   x <= building.x + building.width / 2 + 10 &&
                   y >= building.y - building.height / 2 - 20 &&
                   y <= building.y + building.height / 2 + 20;
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            buildings.forEach(building => {
                if (isPointInBuilding(x, y, building)) {
                    if (building.type === 'station') {
                        showToast('✅ 任务派发成功！');
                    } else if (building.type === 'bank') {
                        showToast('💰 Token发放成功！');
                    } else if (building.type === 'court') {
                        showToast('⚖️ 案件已受理！');
                    } else if (building.type === 'house') {
                        showToast(`🏠 ${building.name} - Agent在家中`);
                    }
                }
            });
        });

        function drawGrass() {
            ctx.fillStyle = '#90EE90';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#7CCD7C';
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function draw() {
            drawGrass();
            drawRoads();
            
            buildings.forEach(building => {
                if (building.type === 'house') {
                    drawHouse(building);
                } else if (building.type === 'station') {
                    drawStation(building);
                } else if (building.type === 'bank') {
                    drawBank(building);
                } else if (building.type === 'court') {
                    drawCourt(building);
                }
            });

            drawPeople();
            updatePeople();

            requestAnimationFrame(draw);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        draw();
    </script>
</body>
</html>
