<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>典籍拼图 · 用益智游戏玩转古籍经典</title>
<style>
/* ===== 全局变量：古典雅致配色 ===== */
:root{
  --paper:#f3ead6;        /* 宣纸底色 */
  --paper-2:#ede2c8;      /* 深一档宣纸 */
  --ink:#2b2620;          /* 墨黑 */
  --ink-soft:#5a5043;     /* 淡墨 */
  --vermilion:#b5302a;    /* 朱砂红 */
  --vermilion-deep:#8e2620;
  --jade:#2e7d6f;         /* 青绿 */
  --jade-deep:#1f5e52;
  --gold:#b8923a;         /* 古金 */
  --gold-soft:#cdae5b;
  --line:#cdb98e;         /* 边线 */
  --shadow:rgba(43,38,32,.12);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",Georgia,serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 20% 10%, rgba(184,146,58,.06), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(181,48,42,.05), transparent 40%),
    repeating-linear-gradient(45deg, rgba(205,185,142,.04) 0 2px, transparent 2px 6px),
    var(--paper);
  min-height:100vh;
  line-height:1.7;
  padding:18px 12px 60px;
}

/* ===== 主体卷轴容器 ===== */
.app{
  max-width:600px;
  margin:0 auto;
  background:linear-gradient(180deg,#f7efdc,#f1e6cd);
  border:1px solid var(--line);
  border-radius:6px;
  box-shadow:0 6px 26px var(--shadow), inset 0 0 0 4px rgba(255,255,255,.35), inset 0 0 0 5px var(--line);
  padding:26px 20px 28px;
  position:relative;
}
/* 卷轴上下横木 */
.app::before,.app::after{
  content:"";position:absolute;left:-6px;right:-6px;height:14px;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  border:1px solid var(--gold);border-radius:7px;
  box-shadow:0 2px 6px var(--shadow);
}
.app::before{top:-7px;}
.app::after{bottom:-7px;}

/* 四角云纹装饰 */
.corner{position:absolute;width:34px;height:34px;opacity:.5;pointer-events:none;}
.corner svg{width:100%;height:100%;}
.corner.tl{top:10px;left:10px;}
.corner.tr{top:10px;right:10px;transform:scaleX(-1);}
.corner.bl{bottom:10px;left:10px;transform:scaleY(-1);}
.corner.br{bottom:10px;right:10px;transform:scale(-1,-1);}

/* ===== 标题区 ===== */
.header{text-align:center;margin:6px 0 18px;position:relative;}
.header h1{
  font-size:26px;margin:0;letter-spacing:4px;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
.header .sub{font-size:13px;color:var(--ink-soft);margin-top:6px;letter-spacing:1px;}
.title-seal{
  display:inline-block;background:var(--vermilion);color:#fff;
  font-size:13px;padding:3px 9px;border-radius:2px;letter-spacing:2px;
  transform:rotate(-4deg);box-shadow:0 2px 5px rgba(0,0,0,.2);
  border:1px solid var(--vermilion-deep);vertical-align:middle;margin-left:6px;
}

/* ===== 标签导航 ===== */
.tabs{
  display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  margin:14px 0 18px;border-bottom:2px double var(--line);padding-bottom:10px;
}
.tab{
  flex:1 1 auto;min-width:64px;cursor:pointer;text-align:center;
  padding:9px 6px;font-size:14px;color:var(--ink-soft);border-radius:6px 6px 0 0;
  border:1px solid transparent;font-family:inherit;letter-spacing:1px;
  transition:all .2s;background:transparent;
}
.tab:hover{color:var(--ink);}
.tab.active{
  color:#fff;background:linear-gradient(180deg,var(--jade),var(--jade-deep));
  border-color:var(--jade-deep);box-shadow:0 2px 6px rgba(46,125,111,.35);
}
.tab .ico{display:block;font-size:17px;margin-bottom:2px;}

/* ===== 区块通用 ===== */
.panel{display:none;animation:fade .35s ease;}
.panel.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.panel-title{
  text-align:center;font-size:17px;color:var(--vermilion-deep);letter-spacing:3px;
  margin:0 0 4px;position:relative;
}
.panel-desc{text-align:center;font-size:12px;color:var(--ink-soft);margin:0 0 16px;}

/* ===== 按钮 ===== */
.btn{
  cursor:pointer;font-family:inherit;font-size:14px;letter-spacing:2px;
  padding:8px 16px;border-radius:4px;border:1px solid var(--gold);
  background:linear-gradient(180deg,#fbf3df,#f0e3c4);color:var(--ink);
  box-shadow:0 2px 4px var(--shadow);transition:transform .12s,box-shadow .12s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 7px var(--shadow);}
.btn:active{transform:translateY(1px);}
.btn.primary{background:linear-gradient(180deg,var(--vermilion),var(--vermilion-deep));color:#fff;border-color:var(--vermilion-deep);}
.btn.jade{background:linear-gradient(180deg,var(--jade),var(--jade-deep));color:#fff;border-color:var(--jade-deep);}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}

/* ===== 诗句排序 ===== */
.poem-meta{text-align:center;margin-bottom:14px;}
.poem-meta .pname{font-size:18px;color:var(--ink);letter-spacing:3px;}
.poem-meta .pauthor{font-size:13px;color:var(--ink-soft);margin-left:8px;}
.poem-board{
  display:flex;flex-direction:column;gap:10px;padding:14px;
  background:rgba(255,255,255,.35);border:1px dashed var(--line);border-radius:8px;
}
.poem-card{
  cursor:pointer;user-select:none;text-align:center;font-size:19px;letter-spacing:3px;
  padding:14px 10px;background:linear-gradient(180deg,#fbf6e8,#f3e9cd);
  border:1px solid var(--line);border-radius:6px;position:relative;
  box-shadow:0 2px 4px var(--shadow);transition:all .18s;
}
.poem-card:hover{border-color:var(--gold);transform:translateY(-1px);}
.poem-card .ord{position:absolute;left:8px;top:6px;font-size:12px;color:var(--gold);font-style:italic;}
.poem-card.selected{
  border-color:var(--vermilion);background:linear-gradient(180deg,#fde8e6,#f7d6d2);
  box-shadow:0 0 0 2px var(--vermilion),0 3px 8px rgba(181,48,42,.3);transform:translateY(-2px);
}
.poem-card.correct{border-color:var(--jade);background:linear-gradient(180deg,#e0f0ea,#cfe7dd);box-shadow:0 0 0 2px var(--jade);}
.poem-card.wrong{border-color:var(--vermilion);background:linear-gradient(180deg,#f6dad7,#f0c5c0);animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.poem-result{margin-top:16px;padding:16px;background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:8px;animation:fade .4s;}
.poem-result .full{text-align:center;font-size:18px;letter-spacing:3px;line-height:2;}
.poem-result .apprec{font-size:13px;color:var(--ink-soft);margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;}
.poem-result .author-line{text-align:center;color:var(--vermilion-deep);font-size:14px;margin-top:8px;}

/* ===== 典故配对 ===== */
.match-wrap{position:relative;}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 60px;}
.match-col{display:flex;flex-direction:column;gap:10px;}
.match-item{
  cursor:pointer;text-align:center;padding:13px 8px;border-radius:6px;
  border:1px solid var(--line);background:linear-gradient(180deg,#fbf6e8,#f3e9cd);
  font-size:16px;letter-spacing:2px;box-shadow:0 2px 4px var(--shadow);transition:all .18s;
}
.match-item:hover{border-color:var(--gold);}
.match-item.selected{border-color:var(--vermilion);background:linear-gradient(180deg,#fde8e6,#f7d6d2);box-shadow:0 0 0 2px var(--vermilion);}
.match-item.locked{cursor:default;background:linear-gradient(180deg,#e3efe9,#d4e7dd);border-color:var(--jade);color:var(--jade-deep);box-shadow:0 0 0 2px var(--jade) inset;}
.match-item.flash-wrong{border-color:var(--vermilion);animation:shake .4s;background:linear-gradient(180deg,#f6dad7,#f0c5c0);}
.match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}
.match-progress{text-align:center;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
.match-progress b{color:var(--vermilion-deep);}

/* ===== 图鉴 ===== */
.atlas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.atlas-card{perspective:900px;height:120px;cursor:pointer;}
.atlas-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;}
.atlas-card.flipped .atlas-inner{transform:rotateY(180deg);}
.atlas-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;box-shadow:0 2px 5px var(--shadow);}
.atlas-front{background:linear-gradient(160deg,#fbf6e8,#efe2c2);}
.atlas-back{transform:rotateY(180deg);background:linear-gradient(160deg,#f3ead6,#e7d8b3);overflow:auto;}
.atlas-front .ctype{font-size:11px;color:var(--gold);letter-spacing:1px;}
.atlas-front .ctitle{font-size:16px;color:var(--ink);letter-spacing:2px;margin-top:4px;}
.atlas-front .cseal{margin-top:6px;font-size:10px;color:var(--vermilion);border:1px solid var(--vermilion);padding:1px 4px;border-radius:2px;transform:rotate(-3deg);}
.atlas-back .btitle{font-size:13px;color:var(--vermilion-deep);margin-bottom:4px;letter-spacing:1px;}
.atlas-back .btxt{font-size:11px;color:var(--ink);line-height:1.5;}
.atlas-card.locked{cursor:default;}
.atlas-card.locked .atlas-face{background:linear-gradient(160deg,#e0dccf,#d2cdbd);filter:grayscale(1);}
.atlas-card.locked .ctitle{color:#9a9486;}
.atlas-card.locked .clock{font-size:26px;color:#8a8576;}
.atlas-card.locked .atlas-inner{transform:none!important;}
.atlas-tip{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:14px;}

/* ===== 成就 ===== */
.stat-row{display:flex;gap:12px;margin-bottom:18px;}
.stat-box{flex:1;text-align:center;background:rgba(255,255,255,.4);border:1px solid var(--line);border-radius:8px;padding:12px 6px;}
.stat-box .num{font-size:24px;color:var(--vermilion-deep);font-weight:bold;}
.stat-box .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.progress-wrap{background:rgba(255,255,255,.4);border:1px solid var(--line);border-radius:20px;height:14px;overflow:hidden;margin:6px 0 20px;position:relative;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--jade),var(--gold));width:0;transition:width .5s;border-radius:20px;}
.progress-wrap span{position:absolute;inset:0;text-align:center;font-size:11px;color:var(--ink);line-height:14px;}
.seal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.seal-card{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.35);}
.seal-card.earned{background:linear-gradient(160deg,#fbe9e6,#f5d8d3);border-color:var(--vermilion);}
.seal-stamp{
  flex:0 0 52px;width:52px;height:52px;border:2px solid #aaa;border-radius:4px;
  display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px;
  letter-spacing:1px;text-align:center;transform:rotate(-5deg);background:repeating-linear-gradient(45deg,#d9d4c6 0 3px,transparent 3px 6px);
}
.seal-card.earned .seal-stamp{border-color:var(--vermilion);color:#fff;background:var(--vermilion);box-shadow:0 0 0 2px rgba(255,255,255,.4) inset,0 2px 5px rgba(181,48,42,.4);}
.seal-info .sname{font-size:14px;color:var(--ink);letter-spacing:1px;}
.seal-info .sdesc{font-size:11px;color:var(--ink-soft);margin-top:2px;}

/* ===== 弹出印章"妙！" ===== */
.toast-mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:100;background:rgba(43,38,32,.25);}
.toast-mask.show{display:flex;}
.miao{
  width:120px;height:120px;border:6px solid var(--vermilion);border-radius:10px;
  background:var(--vermilion);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:64px;letter-spacing:0;font-family:"STKaiti","KaiTi",serif;transform:scale(0) rotate(-20deg);
  box-shadow:0 0 0 3px rgba(255,255,255,.5) inset,0 8px 20px rgba(0,0,0,.4);
}
.toast-mask.show .miao{animation:miaoIn .9s ease forwards;}
@keyframes miaoIn{0%{transform:scale(0) rotate(-30deg);opacity:0;}50%{transform:scale(1.15) rotate(-6deg);opacity:1;}70%{transform:scale(1) rotate(-6deg);}100%{transform:scale(1) rotate(-6deg);opacity:1;}}

/* 摇头提示 */
.shake-tip{position:fixed;top:30%;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:20px;font-size:14px;z-index:99;display:none;letter-spacing:2px;}
.shake-tip.show{display:block;animation:tipPop 1.1s ease;}
@keyframes tipPop{0%{opacity:0;transform:translate(-50%,-10px);}20%{opacity:1;transform:translate(-50%,0) rotate(-3deg);}40%{transform:translate(-50%,0) rotate(3deg);}60%{transform:translate(-50%,0) rotate(-2deg);}80%{transform:translate(-50%,0) rotate(1deg);}100%{opacity:0;transform:translate(-50%,-6px);}}

/* 完成横幅 */
.win-banner{margin-top:16px;text-align:center;padding:14px;background:linear-gradient(160deg,#e0f0ea,#cfe7dd);border:1px solid var(--jade);border-radius:8px;color:var(--jade-deep);font-size:15px;letter-spacing:2px;display:none;}
.win-banner.show{display:block;animation:fade .4s;}

/* 响应式 */
@media(max-width:420px){
  .header h1{font-size:22px;}
  .match-grid{gap:10px 44px;}
  .atlas-grid{grid-template-columns:repeat(2,1fr);}
  .seal-grid{grid-template-columns:1fr;}
  .poem-card{font-size:17px;}
}
</style>
</head>
<body>
<div class="app">
  <!-- 四角云纹装饰 -->
  <div class="corner tl"><svg viewBox="0 0 40 40"><path d="M2 38 Q2 18 22 18 Q22 8 38 8 M6 34 Q6 22 18 22" fill="none" stroke="#b8923a" stroke-width="1.5"/><circle cx="20" cy="20" r="2" fill="#b8923a"/></svg></div>
  <div class="corner tr"><svg viewBox="0 0 40 40"><path d="M2 38 Q2 18 22 18 Q22 8 38 8 M6 34 Q6 22 18 22" fill="none" stroke="#b8923a" stroke-width="1.5"/><circle cx="20" cy="20" r="2" fill="#b8923a"/></svg></div>
  <div class="corner bl"><svg viewBox="0 0 40 40"><path d="M2 38 Q2 18 22 18 Q22 8 38 8 M6 34 Q6 22 18 22" fill="none" stroke="#b8923a" stroke-width="1.5"/><circle cx="20" cy="20" r="2" fill="#b8923a"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 40 40"><path d="M2 38 Q2 18 22 18 Q22 8 38 8 M6 34 Q6 22 18 22" fill="none" stroke="#b8923a" stroke-width="1.5"/><circle cx="20" cy="20" r="2" fill="#b8923a"/></svg></div>

  <!-- 标题 -->
  <header class="header">
    <h1>典籍拼图 <span class="title-seal">玩转古籍</span></h1>
    <div class="sub">用益智游戏，让书写在古籍里的文字活起来</div>
  </header>

  <!-- 标签导航 -->
  <nav class="tabs">
    <button class="tab active" data-tab="poem"><span class="ico">诗</span>诗句排序</button>
    <button class="tab" data-tab="match"><span class="ico">典</span>典故配对</button>
    <button class="tab" data-tab="atlas"><span class="ico">册</span>典籍图鉴</button>
    <button class="tab" data-tab="seal"><span class="ico">印</span>成就印章</button>
  </nav>

  <!-- 诗句排序 -->
  <section class="panel active" id="panel-poem">
    <h2 class="panel-title">诗 句 排 序</h2>
    <p class="panel-desc">点选一句，再点另一句交换位置，理顺全诗后「对答案」</p>
    <div class="poem-meta"><span class="pname" id="poemName"></span><span class="pauthor" id="poemAuthor"></span></div>
    <div class="poem-board" id="poemBoard"></div>
    <div class="btn-row">
      <button class="btn primary" id="btnCheck">对答案</button>
      <button class="btn" id="btnShuffle">重新打乱</button>
      <button class="btn jade" id="btnNext">换一首</button>
    </div>
    <div class="poem-result" id="poemResult" style="display:none;"></div>
  </section>

  <!-- 典故配对 -->
  <section class="panel" id="panel-match">
    <h2 class="panel-title">典 故 配 对</h2>
    <p class="panel-desc">点左侧典故，再点右侧人物出处，连成一线</p>
    <div class="match-progress">已配对 <b id="matchCount">0</b> / 6</div>
    <div class="match-wrap" id="matchWrap">
      <div class="match-grid">
        <div class="match-col" id="matchLeft"></div>
        <div class="match-col" id="matchRight"></div>
      </div>
      <svg class="match-svg" id="matchSvg"></svg>
    </div>
    <div class="btn-row">
      <button class="btn" id="btnMatchReset">重置配对</button>
    </div>
    <div class="win-banner" id="matchWin">典故通晓 · 六脉皆连！图鉴已收录全部典故。</div>
  </section>

  <!-- 典籍图鉴 -->
  <section class="panel" id="panel-atlas">
    <h2 class="panel-title">典 籍 图 鉴</h2>
    <p class="panel-desc">通关解锁典籍卡片，点卡片翻面查看详解</p>
    <div class="atlas-grid" id="atlasGrid"></div>
    <div class="atlas-tip" id="atlasTip"></div>
  </section>

  <!-- 成就印章 -->
  <section class="panel" id="panel-seal">
    <h2 class="panel-title">成 就 印 章</h2>
    <p class="panel-desc">研学有功，钤印为记</p>
    <div class="stat-row">
      <div class="stat-box"><div class="num" id="statClear">0</div><div class="lbl">通关数</div></div>
      <div class="stat-box"><div class="num" id="statCollect">0</div><div class="lbl">已收集</div></div>
      <div class="stat-box"><div class="num" id="statSeal">0</div><div class="lbl">得印章</div></div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div><span id="progressTxt">0 / 9</span></div>
    <div class="seal-grid" id="sealGrid"></div>
    <div class="btn-row"><button class="btn" id="btnReset">清空进度，重新开始</button></div>
  </section>
</div>

<!-- 弹出"妙！"印章 -->
<div class="toast-mask" id="toastMask"><div class="miao" id="miaoTxt">妙</div></div>
<div class="shake-tip" id="shakeTip">再思量</div>

<script>
/* =========================================================
 * 典籍拼图 · 核心逻辑
 * 数据均为真实古诗与典故，代码注释为中文
 * ========================================================= */

/* ---------- 一、古籍数据 ---------- */

// 古诗数据（诗句、作者、朝代、赏析、白话、趣味知识）
const POEMS = [
  {
    title:'静夜思', author:'李白', dynasty:'唐',
    lines:['床前明月光','疑是地上霜','举头望明月','低头思故乡'],
    appreciation:'此诗写游子秋夜思乡之情。前两句写景，以霜喻月色之白；后两句抒情，举头与低头之间，乡愁油然而生。语言朴素而意境深远，是千古传诵的思乡名篇。',
    baihua:'井床前月光皎洁，疑是地上落了一层秋霜。抬头望见天上明月，低头思念远方的故乡。',
    trivia:'「床」字历来有争议：一说井栏，一说坐具，一说卧床，今人多取井栏或卧床之解。'
  },
  {
    title:'春晓', author:'孟浩然', dynasty:'唐',
    lines:['春眠不觉晓','处处闻啼鸟','夜来风雨声','花落知多少'],
    appreciation:'此诗写春晨初醒的所见所闻所感。诗人不写繁花似锦，而以「花落知多少」作结，含蓄惜春，韵味悠长，尽显对自然的热爱与怜惜。',
    baihua:'春日酣眠不觉天已破晓，处处可闻鸟雀啼鸣。想起昨夜风雨之声，不知枝头花朵又落了多少。',
    trivia:'孟浩然一生未仕，此诗写于隐居鹿门山时，平淡中见真情，是其山水田园诗的代表作。'
  },
  {
    title:'登鹳雀楼', author:'王之涣', dynasty:'唐',
    lines:['白日依山尽','黄河入海流','欲穷千里目','更上一层楼'],
    appreciation:'前两句写登楼所见的壮阔景象，后两句由景生理，寓「登高望远、不断进取」之志，气魄宏大、哲理深永，是盛唐咏景诗的压卷之作。',
    baihua:'夕阳依傍山峦缓缓落下，黄河奔流向海滔滔不息。想要看尽千里之外的风光，就要再登上一层高楼。',
    trivia:'鹳雀楼在今山西永济，因常有鹳雀栖息其上得名，与黄鹤楼、岳阳楼、滕王阁并称「四大名楼」。'
  }
];

// 典故数据（典故名、对应人物、出处、详解、趣味知识）
const ALLUSIONS = [
  { name:'破釜沉舟', figure:'项羽', source:'《史记·项羽本纪》',
    detail:'巨鹿之战，项羽命军士沉船破釜，示以必死决心，大破秦军。',
    trivia:'此后「破釜沉舟」喻下定必死的决心，背水一战。' },
  { name:'三顾茅庐', figure:'诸葛亮', source:'《三国志·蜀书》',
    detail:'刘备三次赴南阳隆中拜访诸葛亮，诚心请其出山辅佐，终成大业。',
    trivia:'后以「三顾茅庐」喻诚心诚意、一再邀请贤才。' },
  { name:'卧薪尝胆', figure:'勾践', source:'《史记·越王勾践世家》',
    detail:'越王勾践败于吴后，睡柴草、尝苦胆，发愤图强，终灭吴复国。',
    trivia:'比喻刻苦自励、发愤雪耻，终成大事。' },
  { name:'完璧归赵', figure:'蔺相如', source:'《史记·廉颇蔺相如列传》',
    detail:'蔺相如带和氏璧入秦，识破秦王夺璧之意，智取完整送回赵国。',
    trivia:'比喻把原物完好无损地归还本人。' },
  { name:'负荆请罪', figure:'廉颇', source:'《史记·廉颇蔺相如列传》',
    detail:'廉颇因嫉妒蔺相如位高于己，后知错，背负荆条上门请罪，二人结为刎颈之交。',
    trivia:'后以「负荆请罪」表示主动向人认错赔罪。' },
  { name:'图穷匕见', figure:'荆轲', source:'《战国策·燕策三》',
    detail:'荆轲以献督亢地图为名刺秦王，地图展至尽头露出藏于其中的匕首。',
    trivia:'比喻事情发展到最后，真相或本意显露出来。' }
];

// 成就印章定义
const SEALS = [
  { id:'s1', name:'初窥门径', desc:'完成第一首诗的排序', stamp:'初' },
  { id:'s2', name:'诗心初成', desc:'完成全部诗句排序', stamp:'诗' },
  { id:'s3', name:'典故通人', desc:'完成典故配对', stamp:'典' },
  { id:'s4', name:'典籍藏家', desc:'收集全部图鉴卡片', stamp:'藏' }
];

/* ---------- 二、全局状态（带 localStorage 持久化） ---------- */
const STORE_KEY='dianji_pintu_v1';
let state = loadState();

function defaultState(){
  return {
    poemsCleared:[],        // 已通关的诗索引
    allusionsMatched:[],    // 已配对的典故索引
    matchDone:false,        // 典故配对是否全部完成
    seals:[]                // 已得印章 id
  };
}
function loadState(){
  try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)); return s? Object.assign(defaultState(),s):defaultState(); }
  catch(e){ return defaultState(); }
}
function saveState(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(state)); }catch(e){} }

/* ---------- 三、诗句排序游戏 ---------- */
let poem = { idx:0, order:[], selected:null, checked:false };

function shuffleArr(a){ // 打乱数组
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

function initPoem(idx){
  poem.idx = idx;
  const p = POEMS[idx];
  // 生成打乱顺序，保证与原序不同
  let ord;
  do{ ord = shuffleArr(p.lines.map((_,i)=>i)); }while(ord.join('')===p.lines.map((_,i)=>i).join('') && p.lines.length>1);
  poem.order = ord;
  poem.selected = null;
  poem.checked = false;
  renderPoem();
  document.getElementById('poemResult').style.display='none';
}

function renderPoem(){
  const p = POEMS[poem.idx];
  document.getElementById('poemName').textContent = '《'+p.title+'》';
  document.getElementById('poemAuthor').textContent = '【'+p.dynasty+'】'+p.author;
  const board = document.getElementById('poemBoard');
  board.innerHTML='';
  poem.order.forEach((lineIdx,pos)=>{
    const card=document.createElement('div');
    card.className='poem-card';
    if(poem.checked){
      // 对答案后：判断当前位置是否正确
      if(lineIdx===pos) card.classList.add('correct');
      else card.classList.add('wrong');
    }
    if(poem.selected===pos) card.classList.add('selected');
    card.innerHTML='<span class="ord">'+(pos+1)+'</span>'+p.lines[lineIdx];
    card.addEventListener('click',()=>onPoemCardClick(pos));
    board.appendChild(card);
  });
}

function onPoemCardClick(pos){
  if(poem.checked) return; // 已对答案则不可再点
  if(poem.selected===null){
    poem.selected=pos;
  }else if(poem.selected===pos){
    poem.selected=null; // 再点取消
  }else{
    // 交换两句
    const a=poem.selected,b=pos;
    [poem.order[a],poem.order[b]]=[poem.order[b],poem.order[a]];
    poem.selected=null;
  }
  renderPoem();
}

function checkPoem(){
  poem.checked=true;
  poem.selected=null;
  renderPoem();
  const allCorrect = poem.order.every((v,i)=>v===i);
  if(allCorrect){
    // 通关：记录、弹"妙"、解锁图鉴、判定印章
    if(!state.poemsCleared.includes(poem.idx)){
      state.poemsCleared.push(poem.idx);
      saveState();
    }
    showMiao('妙');
    showPoemResult();
    checkSeals();
    refreshAtlas();
    refreshStats();
  }else{
    showShakeTip('再思量');
    // 1.2秒后清除错误标记，便于继续调整
    setTimeout(()=>{ if(poem.checked){ poem.checked=false; renderPoem(); } },1300);
  }
}

function showPoemResult(){
  const p=POEMS[poem.idx];
  const el=document.getElementById('poemResult');
  el.style.display='block';
  el.innerHTML =
    '<div class="full">'+p.lines.join('<br>')+'</div>'+
    '<div class="author-line">—— 【'+p.dynasty+'】'+p.author+'《'+p.title+'》</div>'+
    '<div class="apprec"><b style="color:'+ 'var(--vermilion-deep)'+ '">赏析 · </b>'+p.appreciation+'</div>';
}

document.getElementById('btnCheck').addEventListener('click',checkPoem);
document.getElementById('btnShuffle').addEventListener('click',()=>initPoem(poem.idx));
document.getElementById('btnNext').addEventListener('click',()=>{
  initPoem((poem.idx+1)%POEMS.length);
});

/* ---------- 四、典故配对游戏 ---------- */
let match = { leftOrder:[], rightOrder:[], selectedLeft:null, matched:{} };

function initMatch(){
  match.leftOrder = ALLUSIONS.map((_,i)=>i);
  match.rightOrder = shuffleArr(ALLUSIONS.map((_,i)=>i));
  match.selectedLeft=null;
  match.matched={};
  renderMatch();
  drawMatchLines();
  document.getElementById('matchWin').classList.remove('show');
}

function renderMatch(){
  const L=document.getElementById('matchLeft'), R=document.getElementById('matchRight');
  L.innerHTML=''; R.innerHTML='';
  // 左列：典故名
  match.leftOrder.forEach(li=>{
    const a=ALLUSIONS[li];
    const el=document.createElement('div');
    el.className='match-item'; el.textContent=a.name; el.dataset.left=li;
    if(match.matched[li]!==undefined) el.classList.add('locked');
    if(match.selectedLeft===li) el.classList.add('selected');
    el.addEventListener('click',()=>onLeftClick(li,el));
    L.appendChild(el);
  });
  // 右列：人物+出处（打乱）
  match.rightOrder.forEach(ri=>{
    const a=ALLUSIONS[ri];
    const el=document.createElement('div');
    el.className='match-item';
    el.innerHTML='<div>'+a.figure+'</div><div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">'+a.source+'</div>';
    el.dataset.right=ri;
    const matchedLi = Object.keys(match.matched).find(k=>match.matched[k]===ri);
    if(matchedLi!==undefined) el.classList.add('locked');
    el.addEventListener('click',()=>onRightClick(ri,el));
    R.appendChild(el);
  });
  // 更新进度
  document.getElementById('matchCount').textContent=Object.keys(match.matched).length;
}

function onLeftClick(li,el){
  if(match.matched[li]!==undefined) return; // 已配对
  match.selectedLeft = (match.selectedLeft===li)? null : li;
  renderMatch();
  drawMatchLines();
}

function onRightClick(ri,el){
  if(match.selectedLeft===null) return;
  // 判断右列这一项是否已被配对
  if(Object.values(match.matched).includes(ri)) return;
  const li=match.selectedLeft;
  if(ri===li){ // 正确配对（典故索引与人物索引一致）
    match.matched[li]=ri;
    match.selectedLeft=null;
    // 解锁该典故图鉴
    if(!state.allusionsMatched.includes(li)){
      state.allusionsMatched.push(li);
      saveState();
    }
    renderMatch();
    drawMatchLines();
    showMiao('配');
    refreshAtlas();
    refreshStats();
    // 判断是否全部完成
    if(Object.keys(match.matched).length===ALLUSIONS.length){
      state.matchDone=true; saveState();
      document.getElementById('matchWin').classList.add('show');
      checkSeals();
    }
  }else{
    // 错误：红色摇头
    el.classList.add('flash-wrong');
    // 同时左列选中项也闪一下
    const leftEl=document.querySelector('.match-item[data-left="'+li+'"]');
    if(leftEl) leftEl.classList.add('flash-wrong');
    showShakeTip('配错了');
    setTimeout(()=>{
      el.classList.remove('flash-wrong');
      if(leftEl) leftEl.classList.remove('flash-wrong');
      match.selectedLeft=null;
      renderMatch();
      drawMatchLines();
    },700);
  }
}

// 用 SVG 在两列之间画连线（已配对的画绿线）
function drawMatchLines(){
  const svg=document.getElementById('matchSvg');
  const wrap=document.getElementById('matchWrap');
  const wRect=wrap.getBoundingClientRect();
  svg.setAttribute('viewBox','0 0 '+wRect.width+' '+wRect.height);
  svg.setAttribute('width',wRect.width);
  svg.setAttribute('height',wRect.height);
  let html='';
  Object.keys(match.matched).forEach(li=>{
    const ri=match.matched[li];
    const lel=document.querySelector('.match-item[data-left="'+li+'"]');
    const rel=document.querySelector('.match-item[data-right="'+ri+'"]');
    if(!lel||!rel) return;
    const lr=lel.getBoundingClientRect(), rr=rel.getBoundingClientRect();
    // 连线起点：左项右中点；终点：右项左中点
    const x1=lr.right-wRect.left, y1=lr.top-wRect.top+lr.height/2;
    const x2=rr.left-wRect.left,  y2=rr.top-wRect.top+rr.height/2;
    const mx=(x1+x2)/2;
    html+='<path d="M'+x1+' '+y1+' C '+mx+' '+y1+', '+mx+' '+y2+', '+x2+' '+y2+'" stroke="var(--jade)" stroke-width="3" fill="none" opacity="0.85" stroke-linecap="round"/>';
    html+='<circle cx="'+x1+'" cy="'+y1+'" r="4" fill="var(--jade)"/>';
    html+='<circle cx="'+x2+'" cy="'+y2+'" r="4" fill="var(--jade)"/>';
  });
  svg.innerHTML=html;
}

document.getElementById('btnMatchReset').addEventListener('click',initMatch);

/* ---------- 五、典籍图鉴 ---------- */
function buildAtlasData(){
  // 合并：3 首诗 + 6 个典故 = 9 张卡
  const cards=[];
  POEMS.forEach((p,i)=>{
    cards.push({ type:'诗', key:'poem'+i, title:p.title,
      backTitle:'《'+p.title+'》 '+p.dynasty+'·'+p.author,
      backTxt:'<b>原文</b>：'+p.lines.join('，')+'<br><b>白话</b>：'+p.baihua+'<br><b>趣闻</b>：'+p.trivia,
      unlocked: state.poemsCleared.includes(i) });
  });
  ALLUSIONS.forEach((a,i)=>{
    cards.push({ type:'典', key:'allu'+i, title:a.name,
      backTitle:a.name+' · '+a.figure,
      backTxt:'<b>出处</b>：'+a.source+'<br><b>典事</b>：'+a.detail+'<br><b>趣闻</b>：'+a.trivia,
      unlocked: state.allusionsMatched.includes(i) });
  });
  return cards;
}

function refreshAtlas(){
  const grid=document.getElementById('atlasGrid');
  grid.innerHTML='';
  const cards=buildAtlasData();
  cards.forEach(c=>{
    const card=document.createElement('div');
    card.className='atlas-card'+(c.unlocked?'':' locked');
    card.innerHTML=
      '<div class="atlas-inner">'+
        '<div class="atlas-face atlas-front">'+
          (c.unlocked?
            '<div class="ctype">'+c.type+'</div><div class="ctitle">'+c.title+'</div><div class="cseal">已收录</div>'
            :'<div class="clock">✦</div><div class="ctitle" style="margin-top:6px;">未 解 锁</div>')+
        '</div>'+
        '<div class="atlas-face atlas-back">'+
          '<div class="btitle">'+c.backTitle+'</div>'+
          '<div class="btxt">'+c.backTxt+'</div>'+
        '</div>'+
      '</div>';
    if(c.unlocked){
      card.addEventListener('click',()=>card.classList.toggle('flipped'));
    }
    grid.appendChild(card);
  });
  const got=cards.filter(c=>c.unlocked).length;
  document.getElementById('atlasTip').textContent='已收录 '+got+' / '+cards.length+'　·　继续通关解锁更多典籍';
}

/* ---------- 六、成就印章 ---------- */
function checkSeals(){
  const earned=new Set(state.seals);
  // 初窥门径：完成第一首诗
  if(state.poemsCleared.length>=1) earned.add('s1');
  // 诗心初成：完成全部诗
  if(state.poemsCleared.length>=POEMS.length) earned.add('s2');
  // 典故通人：完成典故配对
  if(state.matchDone) earned.add('s3');
  // 典籍藏家：收集全部图鉴
  if(state.poemsCleared.length===POEMS.length && state.allusionsMatched.length===ALLUSIONS.length) earned.add('s4');
  // 新增印章则弹提示
  let newest=null;
  earned.forEach(id=>{ if(!state.seals.includes(id)) newest=id; });
  state.seals=Array.from(earned);
  saveState();
  if(newest){
    const s=SEALS.find(x=>x.id===newest);
    setTimeout(()=>showMiao(s.stamp),400);
  }
  refreshSeals();
  refreshStats();
}

function refreshSeals(){
  const grid=document.getElementById('sealGrid');
  grid.innerHTML='';
  SEALS.forEach(s=>{
    const on=state.seals.includes(s.id);
    const el=document.createElement('div');
    el.className='seal-card'+(on?' earned':'');
    el.innerHTML=
      '<div class="seal-stamp">'+s.stamp+'</div>'+
      '<div class="seal-info"><div class="sname">'+s.name+'</div><div class="sdesc">'+s.desc+(on?'　✓ 已得':'　· 未得')+'</div></div>';
    grid.appendChild(el);
  });
}

function refreshStats(){
  const clearCount = state.poemsCleared.length + (state.matchDone?1:0);
  const collect = state.poemsCleared.length + state.allusionsMatched.length;
  const total = POEMS.length + ALLUSIONS.length;
  document.getElementById('statClear').textContent=clearCount;
  document.getElementById('statCollect').textContent=collect;
  document.getElementById('statSeal').textContent=state.seals.length;
  const pct=Math.round(collect/total*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressTxt').textContent=collect+' / '+total;
}

document.getElementById('btnReset').addEventListener('click',()=>{
  if(confirm('确定要清空全部进度与印章吗？')){
    state=defaultState(); saveState();
    initPoem(0); initMatch(); refreshAtlas(); refreshSeals(); refreshStats();
    switchTab('poem');
  }
});

/* ---------- 七、通用弹层 ---------- */
let miaoTimer=null;
function showMiao(txt){
  const mask=document.getElementById('toastMask');
  document.getElementById('miaoTxt').textContent=txt||'妙';
  mask.classList.remove('show'); void mask.offsetWidth; mask.classList.add('show');
  clearTimeout(miaoTimer);
  miaoTimer=setTimeout(()=>mask.classList.remove('show'),1000);
}
let shakeTimer=null;
function showShakeTip(txt){
  const t=document.getElementById('shakeTip');
  t.textContent=txt||'再思量';
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(shakeTimer);
  shakeTimer=setTimeout(()=>t.classList.remove('show'),1100);
}

/* ---------- 八、标签切换 ---------- */
function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  // 切到配对页时重画连线（布局可见后才能取坐标）
  if(name==='match') setTimeout(drawMatchLines,60);
  if(name==='atlas') refreshAtlas();
  if(name==='seal'){ refreshSeals(); refreshStats(); }
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

/* ---------- 九、窗口尺寸变化重画连线 ---------- */
window.addEventListener('resize',()=>{ if(document.getElementById('panel-match').classList.contains('active')) drawMatchLines(); });

/* ---------- 十、初始化 ---------- */
initPoem(0);
initMatch();
refreshAtlas();
refreshSeals();
refreshStats();
</script>
