<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>气味日记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background-color 0.8s ease;
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .title {
      font-size: 2rem;
      font-weight: 600;
      color: #2d2a26;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #8a8580;
    }

    .input-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      margin-bottom: 24px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 16px;
      font-family: 'Noto Serif SC', serif;
      font-size: 1rem;
      line-height: 1.8;
      border: 1px solid #e8e4df;
      border-radius: 12px;
      background: #fafaf8;
      color: #2d2a26;
      resize: none;
      transition: all 0.3s ease;
    }

    textarea::placeholder {
      color: #b5b0a8;
    }

    textarea:focus {
      outline: none;
      border-color: #c4b5a0;
      background: #fff;
    }

    .generate-btn {
      width: 100%;
      padding: 14px 24px;
      margin-top: 16px;
      font-family: 'Noto Serif SC', serif;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #a69580, #8b7b65);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 123, 101, 0.35);
    }

    .generate-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(139, 123, 101, 0.25);
    }

    .result-area {
      display: none;
    }

    .result-area.active {
      display: block;
    }

    .scent-card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
      animation: cardPop 0.5s ease;
    }

    @keyframes cardPop {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .card-date {
      font-size: 0.8rem;
      color: #a09590;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .card-text {
      font-size: 0.95rem;
      line-height: 1.9;
      color: #4a4540;
      margin-bottom: 20px;
      padding: 16px;
      background: #fafaf8;
      border-radius: 10px;
    }

    .scent-tag {
      display: inline-block;
      padding: 10px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      border-radius: 30px;
      letter-spacing: 0.05em;
    }

    .hint {
      text-align: center;
      color: #b5b0a8;
      font-size: 0.85rem;
      margin-top: 24px;
    }

    /* 背景主题色 */
    .bg-ocean { background: linear-gradient(145deg, #d4e8ec, #b8d4dc); }
    .bg-caramel { background: linear-gradient(145deg, #f5e6d3, #e8d4be); }
    .bg-grass { background: linear-gradient(145deg, #dce8d4, #c8dcc0); }
    .bg-campfire { background: linear-gradient(145deg, #f0d8cc, #e0c4b4); }
    .bg-rain { background: linear-gradient(145deg, #d8dcd8, #c4c8c4); }
    .bg-menthol { background: linear-gradient(145deg, #d4e8e0, #bcd8cc); }
    .bg-orange { background: linear-gradient(145deg, #f5ead4, #e8dcc0); }
    .bg-cinnamon { background: linear-gradient(145deg, #f0dcd4, #e0c8b8); }
    .bg-sandal { background: linear-gradient(145deg, #e4dcd4, #d0c8bc); }
    .bg-rose { background: linear-gradient(145deg, #f0dce4, #e0ccd4); }

    /* 气味标签色 */
    .tag-ocean { background: linear-gradient(135deg, #6b9aa8, #5a8a98); }
    .tag-caramel { background: linear-gradient(135deg, #c49a6c, #b08a5c); }
    .tag-grass { background: linear-gradient(135deg, #7a9e6a, #6a8e5a); }
    .tag-campfire { background: linear-gradient(135deg, #c47a5a, #b46a4a); }
    .tag-rain { background: linear-gradient(135deg, #7a848a, #6a747a); }
    .tag-menthol { background: linear-gradient(135deg, #5a9e8a, #4a8e7a); }
    .tag-orange { background: linear-gradient(135deg, #d4a84a, #c4983a); }
    .tag-cinnamon { background: linear-gradient(135deg, #a86848, #985838); }
    .tag-sandal { background: linear-gradient(135deg, #8a7a6a, #7a6a5a); }
    .tag-rose { background: linear-gradient(135deg, #a87090, #986080); }
  </style>
</head>
<body class="bg-grass">
  <div class="wrapper">
    <header class="header">
      <h1 class="title">🌿 气味日记</h1>
      <p class="subtitle">记录今天的气味</p>
    </header>

    <div class="input-card">
      <textarea id="experienceInput" placeholder="今天发生了什么？"></textarea>
      <button class="generate-btn" id="generateBtn">生成气味标签</button>
    </div>

    <div class="result-area" id="resultArea">
      <div class="scent-card" id="scentCard">
        <div class="card-date" id="cardDate"></div>
        <p class="card-text" id="cardText"></p>
        <span class="scent-tag" id="scentTag"></span>
      </div>
    </div>

    <p class="hint" id="hint">输入今天的经历，生成专属气味标签</p>
  </div>

  <script>
    // 气味词库
    const scents = [
      { name: '海盐', bgClass: 'bg-ocean', tagClass: 'tag-ocean' },
      { name: '焦糖', bgClass: 'bg-caramel', tagClass: 'tag-caramel' },
      { name: '青草', bgClass: 'bg-grass', tagClass: 'tag-grass' },
      { name: '篝火', bgClass: 'bg-campfire', tagClass: 'tag-campfire' },
      { name: '雨后泥土', bgClass: 'bg-rain', tagClass: 'tag-rain' },
      { name: '薄荷', bgClass: 'bg-menthol', tagClass: 'tag-menthol' },
      { name: '橙花', bgClass: 'bg-orange', tagClass: 'tag-orange' },
      { name: '肉桂', bgClass: 'bg-cinnamon', tagClass: 'tag-cinnamon' },
      { name: '檀木', bgClass: 'bg-sandal', tagClass: 'tag-sandal' },
      { name: '玫瑰', bgClass: 'bg-rose', tagClass: 'tag-rose' }
    ];

    // 格式化日期
    function formatDate() {
      const now = new Date();
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const weekDay = weekDays[now.getDay()];
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `${year}年${month}月${day}日 ${weekDay} ${hours}:${minutes}`;
    }

    // 随机选择气味
    function randomScent() {
      return scents[Math.floor(Math.random() * scents.length)];
    }

    // 主函数
    function generateScentNote() {
      const input = document.getElementById('experienceInput');
      const text = input.value.trim();

      if (!text) {
        input.focus();
        return;
      }

      // 随机选择气味
      const scent = randomScent();

      // 更换背景色
      document.body.className = scent.bgClass;

      // 更新卡片
      document.getElementById('cardDate').textContent = formatDate();
      document.getElementById('cardText').textContent = text;
      const tagEl = document.getElementById('scentTag');
      tagEl.textContent = scent.name;
      tagEl.className = `scent-tag ${scent.tagClass}`;

      // 显示结果
      const resultArea = document.getElementById('resultArea');
      resultArea.classList.add('active');

      // 隐藏提示
      document.getElementById('hint').style.display = 'none';

      // 重新触发动画
      const scentCard = document.getElementById('scentCard');
      scentCard.style.animation = 'none';
      scentCard.offsetHeight; // 触发回流
      scentCard.style.animation = 'cardPop 0.5s ease';
    }

    // 绑定事件
    document.getElementById('generateBtn').addEventListener('click', generateScentNote);

    // 回车提交（Ctrl+Enter 或 Enter 在文本框中）
    document.getElementById('experienceInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        generateScentNote();
      }
    });
  </script>
</body>
</html>
