<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>提交列表 - SkillBridge</title>
    <style>
        body { font-family: "Microsoft YaHei", Arial, sans-serif; margin: 24px; background: #f5f7fa; }
        .container { max-width: 960px; margin: 0 auto; background: #fff; padding: 28px 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        h1 { margin-top: 0; color: #2c3e50; }
        h2 { color: #34495e; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px 12px; border: 1px solid #e1e4e8; text-align: left; }
        th { background: #f6f8fa; }
        tr:nth-child(even) td { background: #fafbfc; }
        a { color: #3498db; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn-export { display: inline-block; background: #e67e22; color: #fff; padding: 6px 14px; border-radius: 4px; }
        .btn-export:hover { background: #d35400; text-decoration: none; }
        .nav { margin-bottom: 16px; }
        .empty { padding: 24px; text-align: center; color: #7f8c8d; }
        .info { background: #f6f8fa; padding: 12px 16px; border-radius: 4px; margin-bottom: 16px; }
        .info span { margin-right: 24px; }
    </style>
</head>
