<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>冰箱食材管家 · FreshKeeper</title>
    <style>
        :root {
            --bg: #f4f8f5;
            --bg2: #ffffff;
            --ink: #1d2a23;
            --muted: #6b7c72;
            --rule: #e2ebe5;
            --accent: #2f9e6f;
            --accent2: #e8893b;
            --danger: #d64545;
            --shadow: 0 2px 10px rgba(31, 45, 35, 0.06);
            --radius: 12px;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
            color: var(--ink);
            background: var(--bg);
            line-height: 1.7;
            padding: 2rem 1rem 4rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .page {
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
        }

        /* 应用卡片 */
        .app {
            background: var(--bg2);
            border: 1px solid var(--rule);
            border-radius: var(--radius);
            padding: 1.5rem 1.6rem;
            box-shadow: var(--shadow);
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .app-header h2 {
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .app-header .logo {
            font-size: 1.4rem;
        }
        .app-header .hint {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.7rem;
            margin-bottom: 1.2rem;
        }
        .stat {
            background: var(--bg);
            border-radius: 10px;
            padding: 0.7rem 0.8rem;
            text-align: center;
            border: 1px solid var(--rule);
        }
        .stat .num {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.1;
        }
        .stat .lbl {
            font-size: 0.74rem;
            color: var(--muted);
            margin-top: 0.15rem;
        }
        .stat.warn .num {
            color: var(--accent2);
        }
        .stat.over .num {
            color: var(--danger);
        }

        .form {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr 0.8fr auto;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }
        .form input,
        .form select {
            font: inherit;
            padding: 0.55rem 0.6rem;
            border: 1px solid var(--rule);
            border-radius: 8px;
            background: var(--bg2);
            color: var(--ink);
            width: 100%;
        }
        .form input:focus,
        .form select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47, 158, 111, 0.12);
        }
        .form button {
            font: inherit;
            padding: 0.55rem 1rem;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .form button:hover {
            filter: brightness(1.05);
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 2rem 1rem;
            font-size: 0.9rem;
        }
        .group-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--muted);
            margin: 0.8rem 0 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .group-title.over {
            color: var(--danger);
        }
        .group-title.warn {
            color: var(--accent2);
        }

        .item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 0.7rem;
            border: 1px solid var(--rule);
            border-radius: 10px;
            margin-bottom: 0.45rem;
            background: var(--bg2);
        }
        .item .emoji {
            font-size: 1.3rem;
            width: 1.8rem;
            text-align: center;
        }
        .item .info {
            flex: 1;
            min-width: 0;
        }
        .item .name {
            font-weight: 600;
            font-size: 0.95rem;
        }
        .item .meta {
            font-size: 0.76rem;
            color: var(--muted);
        }
        .item .badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            white-space: nowrap;
        }
        .badge.fresh {
            background: #eaf5ee;
            color: var(--accent);
        }
        .badge.warn {
            background: #fdf0e6;
            color: var(--accent2);
        }
        .badge.over {
            background: #fde8e8;
            color: var(--danger);
        }
        .item .del {
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
        }
        .item .del:hover {
            color: var(--danger);
            background: #fde8e8;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 2rem;
            transform: translateX(-50%) translateY(20px);
            background: var(--ink);
            color: #fff;
            padding: 0.6rem 1.1rem;
            border-radius: 999px;
            font-size: 0.85rem;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 50;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .form {
                grid-template-columns: 1fr 1fr;
            }
            .form button {
                grid-column: 1 / -1;
            }
            .stats {
                grid-template-columns: 1fr;
            }
            .app {
                padding: 1rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="page">

        <!-- 应用原型区 -->
        <section class="app">
            <div class="app-header">
                <h2><span class="logo">🥬</span> 冰箱食材管家</h2>
                <span class="hint">数据保存在本地浏览器，关闭不丢失</span>
            </div>

            <div class="stats">
                <div class="stat"><div class="num" id="stTotal">0</div><div class="lbl">食材总数</div></div>
                <div class="stat warn"><div class="num" id="stWarn">0</div><div class="lbl">即将过期 (3天内)</div></div>
                <div class="stat over"><div class="num" id="stOver">0</div><div class="lbl">已过期</div></div>
            </div>

            <div class="form">
                <input type="text" id="inName" placeholder="食材名称，如：牛奶" maxlength="20" />
                <select id="inCat">
                    <option value="蔬菜">🥬 蔬菜</option>
                    <option value="水果">🍎 水果</option>
                    <option value="肉蛋">🥩 肉蛋</option>
                    <option value="乳品">🥛 乳品</option>
                    <option value="主食">🍞 主食</option>
                    <option value="其他">🥡 其他</option>
                </select>
                <input type="date" id="inDate" />
                <input type="number" id="inQty" placeholder="数量" min="1" value="1" />
                <button id="addBtn">添加</button>
            </div>

            <div id="list"></div>
            <div class="empty" id="empty">冰箱还是空的，先添加一样食材试试吧～</div>
        </section>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            var STORAGE_KEY = 'freshkeeper_items_v1';
            var CAT_EMOJI = { '蔬菜': '🥬', '水果': '🍎', '肉蛋': '🥩', '乳品': '🥛', '主食': '🍞', '其他': '🥡' };

            var inName = document.getElementById('inName');
            var inCat = document.getElementById('inCat');
            var inDate = document.getElementById('inDate');
            var inQty = document.getElementById('inQty');
            var addBtn = document.getElementById('addBtn');
            var listEl = document.getElementById('list');
            var emptyEl = document.getElementById('empty');
            var stTotal = document.getElementById('stTotal');
            var stWarn = document.getElementById('stWarn');
            var stOver = document.getElementById('stOver');
            var toastEl = document.getElementById('toast');

            function defaultDate() {
                var d = new Date();
                d.setDate(d.getDate() + 3);
                return d.toISOString().slice(0, 10);
            }
            inDate.value = defaultDate();

            function load() {
                try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
            }

            function save(items) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            }

            function daysLeft(dateStr) {
                var today = new Date();
                today.setHours(0, 0, 0, 0);
                var d = new Date(dateStr);
                d.setHours(0, 0, 0, 0);
                return Math.round((d - today) / 86400000);
            }

            function toast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.add('show');
                setTimeout(function() { toastEl.classList.remove('show'); }, 1800);
            }

            function escapeHtml(s) {
                return s.replace(/[&<>"']/g, function(c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c];
                });
            }

            function render() {
                var items = load();
                items.forEach(function(it) { it._days = daysLeft(it.date); });
                items.sort(function(a, b) { return a._days - b._days; });

                var over = items.filter(function(i) { return i._days < 0; });
                var warn = items.filter(function(i) { return i._days >= 0 && i._days <= 3; });
                var fresh = items.filter(function(i) { return i._days > 3; });

                stTotal.textContent = items.length;
                stWarn.textContent = warn.length;
                stOver.textContent = over.length;

                emptyEl.style.display = items.length ? 'none' : 'block';
                listEl.innerHTML = '';

                function renderGroup(arr, title, cls) {
                    if (!arr.length) return;
                    var t = document.createElement('div');
                    t.className = 'group-title ' + cls;
                    t.textContent = title;
                    listEl.appendChild(t);
                    arr.forEach(function(it) {
                        var day = it._days;
                        var badgeText, badgeCls;
                        if (day < 0) { badgeText = '已过期' + Math.abs(day) + '天';
                            badgeCls = 'over'; } else if (day === 0) { badgeText = '今天到期';
                            badgeCls = 'warn'; } else if (day <= 3) { badgeText = '剩' + day + '天';
                            badgeCls = 'warn'; } else { badgeText = '剩' + day + '天';
                            badgeCls = 'fresh'; }

                        var row = document.createElement('div');
                        row.className = 'item';
                        row.innerHTML =
                            '<span class="emoji">' + (CAT_EMOJI[it.cat] || '🥡') + '</span>' +
                            '<div class="info">' +
                            '<div class="name">' + escapeHtml(it.name) + (it.qty > 1 ? ' ×' + it.qty : '') + '</div>' +
                            '<div class="meta">' + it.cat + ' · 保质至 ' + it.date + '</div>' +
                            '</div>' +
                            '<span class="badge ' + badgeCls + '">' + badgeText + '</span>' +
                            '<button class="del" data-id="' + it.id + '" title="已消耗/删除">✕</button>';
                        listEl.appendChild(row);
                    });
                }

                renderGroup(over, '❗ 已过期，请尽快处理', 'over');
                renderGroup(warn, '⚠️ 即将过期，建议先用', 'warn');
                renderGroup(fresh, '✓ 新鲜可用', '');

                listEl.querySelectorAll('.del').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var id = this.getAttribute('data-id');
                        var items = load().filter(function(i) { return String(i.id) !== id; });
                        save(items);
                        render();
                        toast('已删除');
                    });
                });
            }

            addBtn.addEventListener('click', function() {
                var name = inName.value.trim();
                if (!name) { toast('请输入食材名称');
                    inName.focus(); return; }
                if (!inDate.value) { toast('请选择保质日期'); return; }
                var qty = Math.max(1, parseInt(inQty.value, 10) || 1);
                var items = load();
                items.push({ id: Date.now(), name: name, cat: inCat.value, date: inDate.value, qty: qty });
                save(items);
                inName.value = '';
                inQty.value = 1;
                inDate.value = defaultDate();
                inName.focus();
                render();
                toast('已添加：' + name);
            });

            inName.addEventListener('keydown', function(e) { if (e.key === 'Enter') addBtn.click(); });
            inQty.addEventListener('keydown', function(e) { if (e.key === 'Enter') addBtn.click(); });

            render();
        })();
    </script>
</body>
</html>
