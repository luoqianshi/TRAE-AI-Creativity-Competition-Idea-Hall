<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对标作品审阅平台</title>
<style>
/* ═══════════════════════════════════════════════════
   对标作品审阅平台 - 样式
   ═══════════════════════════════════════════════════ */

/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f5f7;
  color: #1a1a2e;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1a1a2e;
  color: #fff;
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  font-size: 0.85rem;
  opacity: 0;
  transition: all 0.3s;
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Top Bar ── */
.topbar {
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  padding: 0.65rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar .logo { font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; }
.topbar .logo .badge { font-size: 0.6rem; background: #eef2ff; color: #6366f1; padding: 0.1rem 0.4rem; border-radius: 3px; font-weight: 600; }
.topbar .user { font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.topbar .user:hover { opacity: 0.75; }

/* ── Page ── */
.page { display: none; }
.page.active { display: block; }

/* ── Login Page ── */
.login-page {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
}
.login-card {
  background: #fff;
  border-radius: 16px;
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 380px;
  text-align: center;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
}
.login-card .icon { font-size: 3rem; margin-bottom: 0.75rem; }
.login-card h1 { font-size: 1.2rem; margin-bottom: 0.35rem; }
.login-card p { font-size: 0.82rem; color: #6b7280; margin-bottom: 1.5rem; }
.login-card input {
  width: 100%;
  padding: 0.65rem 0.85rem;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  font-size: 0.95rem;
  outline: none;
  text-align: center;
  font-family: inherit;
  margin-bottom: 1rem;
}
.login-card input:focus { border-color: #6366f1; }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: all 0.15s;
}
.btn-primary { background: #6366f1; color: #fff; }
.btn-primary:hover { background: #4f46e5; }
.btn-secondary { background: #f3f4f6; color: #374151; }
.btn-secondary:hover { background: #e5e7eb; }
.btn-ghost { background: transparent; color: #6b7280; border: 1px solid #e5e7eb; }
.btn-ghost:hover { background: #f9fafb; }
.btn-sm { padding: 0.35rem 0.75rem; font-size: 0.78rem; }
.btn-block { width: 100%; justify-content: center; padding: 0.65rem; font-size: 0.95rem; }

/* ── Page Header ── */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem 0.75rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.page-header h2 { font-size: 1.3rem; }
.page-header .header-actions { display: flex; align-items: center; gap: 0.5rem; }

/* ── Toolbar ── */
.project-toolbar {
  display: flex;
  gap: 0.5rem;
  padding: 0 1.5rem 1rem;
  align-items: center;
  flex-wrap: wrap;
}
.project-toolbar .search-box {
  flex: 1;
  min-width: 180px;
  position: relative;
}
.project-toolbar .search-box input {
  width: 100%;
  padding: 0.45rem 0.75rem 0.45rem 2rem;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  font-size: 0.82rem;
  outline: none;
  font-family: inherit;
  background: #fff;
}
.project-toolbar .search-box input:focus { border-color: #6366f1; }
.project-toolbar .search-box .icon {
  position: absolute;
  left: 0.6rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.82rem;
  color: #9ca3af;
}
.project-toolbar .cat-tag {
  font-size: 0.78rem;
  padding: 0.35rem 0.75rem;
  border-radius: 6px;
  border: 1px solid #e5e7eb;
  cursor: pointer;
  background: #fff;
  color: #6b7280;
  font-weight: 600;
  transition: all 0.15s;
  white-space: nowrap;
}
.project-toolbar .cat-tag.active { background: #eef2ff; color: #6366f1; border-color: #6366f1; }
.project-toolbar .cat-tag:hover { border-color: #6366f1; }
.project-toolbar .cat-tag.male { color: #2563eb; }
.project-toolbar .cat-tag.male.active { background: #dbeafe; border-color: #2563eb; color: #2563eb; }
.project-toolbar .cat-tag.female { color: #db2777; }
.project-toolbar .cat-tag.female.active { background: #fce7f3; border-color: #db2777; color: #db2777; }

/* ── Project Grid ── */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 0.85rem;
  padding: 0 1.5rem 1.5rem;
}
.project-card {
  background: #fff;
  border-radius: 10px;
  padding: 1.1rem 1.25rem;
  border: 1px solid #e5e7eb;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.project-card:hover {
  border-color: #6366f1;
  box-shadow: 0 2px 12px rgba(99,102,241,0.1);
  transform: translateY(-1px);
}
.project-card .cat-badge {
  display: inline-block;
  font-size: 0.62rem;
  padding: 0.1rem 0.4rem;
  border-radius: 3px;
  font-weight: 600;
  margin-bottom: 0.4rem;
}
.project-card .cat-badge.male { background: #dbeafe; color: #2563eb; }
.project-card .cat-badge.female { background: #fce7f3; color: #db2777; }
.project-card .card-checkbox {
  position: absolute;
  top: 0.4rem;
  right: 0.4rem;
  width: 1.4rem;
  height: 1.4rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.project-card .card-checkbox input {
  width: 1rem;
  height: 1rem;
  cursor: pointer;
  accent-color: #6366f1;
}

/* ── 批量删除按钮 ── */
.btn-danger {
  background: #fee2e2;
  color: #dc2626;
  border: 1px solid #fecaca;
}
.btn-danger:hover { background: #fecaca; }
.btn-danger.btn-sm { font-size: 0.78rem; padding: 0.35rem 0.75rem; }
.project-card h3 { font-size: 0.95rem; margin-bottom: 0.3rem; padding-right: 1.2rem; }
.project-card .meta { font-size: 0.78rem; color: #6b7280; }
.project-card .meta span { margin-right: 0.8rem; }
.card-inner { cursor: pointer; flex: 1; }
.card-del-btn {
  position: absolute;
  bottom: 8px;
  right: 8px;
  font-size: 0.7rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 2;
}
.project-card:hover .card-del-btn { opacity: 0.4; }
.project-card:hover .card-del-btn:hover { opacity: 1; }
.card-export-btn {
  position: absolute;
  bottom: 8px;
  right: 28px;
  font-size: 0.7rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 2;
}
.project-card:hover .card-export-btn { opacity: 0.4; }
.project-card:hover .card-export-btn:hover { opacity: 1; }

/* ── Section Divider ── */
.section-divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0 1.5rem;
  margin: 0.5rem 0 1rem;
}
.section-divider .line { flex: 1; height: 1px; background: #e5e7eb; }
.section-divider span { font-size: 0.78rem; color: #9ca3af; white-space: nowrap; }

/* ── Review Layout ── */
.review-layout {
  display: flex;
  height: calc(100vh - 50px);
}
.review-video {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #000;
  position: relative;
}

.review-topbar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 1rem;
  background: rgba(0,0,0,0.6);
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
}
.review-topbar .back-btn {
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  font-size: 0.78rem;
  padding: 0.3rem 0.7rem;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s;
}
.review-topbar .back-btn:hover { background: rgba(255,255,255,0.2); }
.review-topbar .review-title {
  font-size: 0.85rem;
  color: rgba(255,255,255,0.8);
  font-weight: 600;
}
.review-video .player-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.review-video .player-area video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
.review-video .player-area .placeholder {
  color: rgba(255,255,255,0.3);
  font-size: 0.9rem;
  text-align: center;
  line-height: 1.8;
  cursor: pointer;
}
.review-video .player-area .placeholder .big-icon { font-size: 3rem; margin-bottom: 0.5rem; }

.review-video .controls {
  padding: 0.6rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  background: #1a1a2e;
}
.review-video .controls .time {
  color: rgba(255,255,255,0.7);
  font-size: 0.78rem;
  font-family: monospace;
  white-space: nowrap;
  min-width: 80px;
}
.review-video .controls .track {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}
.review-video .controls .track .progress {
  height: 100%;
  background: #6366f1;
  border-radius: 2px;
  width: 0%;
  position: relative;
}
.review-video .controls .track .thumb {
  width: 12px; height: 12px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  left: 0%;
}
.review-video .controls .track .marker {
  position: absolute;
  top: -3px;
  width: 3px;
  height: 10px;
  background: #fbbf24;
  border-radius: 1px;
  cursor: pointer;
  z-index: 2;
}
.review-video .controls .track .marker:hover { background: #f59e0b; }

/* ── Add Annotation Button ── */
.add-annotation-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: #6366f1;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 0.7rem 1.4rem;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(99,102,241,0.5);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 10;
  opacity: 0;
  pointer-events: none;
  letter-spacing: 0.5px;
}
.add-annotation-btn.visible {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.add-annotation-btn.visible:hover {
  transform: translate(-50%, -50%) scale(1.05);
  background: #4f46e5;
  box-shadow: 0 8px 32px rgba(99,102,241,0.6);
}

/* ── 内嵌标注输入 ── */
.inline-annotation {
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  padding: 0.75rem 1rem;
  flex-shrink: 0;
}
.inline-annotation-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.82rem;
  font-weight: 600;
  color: #6366f1;
  margin-bottom: 0.5rem;
}
.inline-annotation-header .close-inline {
  font-size: 0.8rem;
  color: #9ca3af;
  cursor: pointer;
  padding: 0.15rem 0.3rem;
  border-radius: 4px;
}
.inline-annotation-header .close-inline:hover { background: #f3f4f6; color: #4b5563; }
.inline-annotation textarea {
  width: 100%;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 0.5rem 0.65rem;
  font-size: 0.85rem;
  resize: none;
  outline: none;
  box-sizing: border-box;
  font-family: inherit;
  line-height: 1.5;
}
.inline-annotation textarea:focus { border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,0.1); }
.inline-annotation-actions {
  display: flex;
  justify-content: flex-end;
  gap: 0.4rem;
  margin-top: 0.5rem;
}
.btn-sm { font-size: 0.78rem; padding: 0.35rem 0.75rem; }

/* ── Sidebar ── */
.review-sidebar {
  width: 340px;
  min-width: 340px;
  background: #fff;
  border-left: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
}
.review-sidebar .sidebar-header {
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.88rem;
  font-weight: 600;
}
.review-sidebar .sidebar-header .count { color: #6b7280; font-weight: 400; }

/* ── Jump Bar ── */
.review-sidebar .jump-bar {
  padding: 0.5rem 1rem;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  gap: 0.3rem;
  align-items: center;
}
.review-sidebar .jump-bar input {
  flex: 1;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  padding: 0.3rem 0.5rem;
  font-size: 0.75rem;
  outline: none;
  font-family: monospace;
  min-width: 60px;
}
.review-sidebar .jump-bar input:focus { border-color: #6366f1; }
.review-sidebar .jump-bar .jump-btn {
  background: #6366f1;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 0.3rem 0.5rem;
  font-size: 0.72rem;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}
.review-sidebar .jump-bar .jump-btn:hover { background: #4f46e5; }
.review-sidebar .jump-bar .nav-btn {
  background: #f3f4f6;
  color: #374151;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  padding: 0.3rem 0.45rem;
  font-size: 0.72rem;
  cursor: pointer;
  font-weight: 600;
}
.review-sidebar .jump-bar .nav-btn:hover { background: #e5e7eb; }
.review-sidebar .jump-bar .nav-count {
  font-size: 0.7rem;
  color: #9ca3af;
  white-space: nowrap;
  min-width: 30px;
  text-align: center;
}

/* ── Member Filter ── */
.review-sidebar .member-filter {
  padding: 0.4rem 1rem;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  gap: 0.3rem;
  flex-wrap: wrap;
}
.review-sidebar .member-filter .tag {
  font-size: 0.7rem;
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
  border: 1px solid #e5e7eb;
  cursor: pointer;
  background: #fff;
  color: #6b7280;
  transition: all 0.15s;
}
.review-sidebar .member-filter .tag.active { background: #eef2ff; color: #6366f1; border-color: #6366f1; }
.review-sidebar .member-filter .tag:hover { border-color: #6366f1; }

/* ── Comments ── */
.review-sidebar .comments {
  flex: 1;
  overflow-y: auto;
  padding: 0.6rem;
}
.review-sidebar .comments .comment {
  background: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
  margin-bottom: 0.45rem;
  cursor: pointer;
  transition: all 0.15s;
}
.review-sidebar .comments .comment:hover { border-color: #6366f1; }
.review-sidebar .comments .comment .top {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  margin-bottom: 0.15rem;
}
.review-sidebar .comments .comment .top .edit-btn {
  font-size: 0.65rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  margin-left: auto;
  line-height: 1;
}
.review-sidebar .comments .comment .top .del-btn {
  font-size: 0.55rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
  line-height: 1;
  padding-left: 3px;
}
.review-sidebar .comments .comment:hover .top .edit-btn,
.review-sidebar .comments .comment:hover .top .del-btn { opacity: 0.5; }
.review-sidebar .comments .comment:hover .top .edit-btn:hover,
.review-sidebar .comments .comment:hover .top .del-btn:hover { opacity: 1; }
.review-sidebar .comments .comment .top .time {
  font-size: 0.72rem;
  font-weight: 600;
  font-family: monospace;
}
.review-sidebar .comments .comment .author { font-size: 0.72rem; font-weight: 600; margin-bottom: 0.1rem; }
.review-sidebar .comments .comment .text { font-size: 0.8rem; line-height: 1.5; }
.review-sidebar .comments .comment .text .time-link,
.review-sidebar .comments .comment .reply .time-link {
  color: #6366f1;
  font-weight: 700;
  cursor: pointer;
  border-bottom: 1.5px dashed #6366f1;
  padding: 0 1px;
  transition: background 0.15s;
}
.review-sidebar .comments .comment .text .time-link:hover,
.review-sidebar .comments .comment .reply .time-link:hover {
  background: #eef2ff;
  border-radius: 2px;
}
.review-sidebar .comments .comment .reply {
  margin-top: 0.35rem;
  padding-top: 0.35rem;
  border-top: 1px solid #e5e7eb;
  font-size: 0.76rem;
  color: #4b5563;
}

/* ── Member Colors ── */
.comment.member-0 { border-left: 3px solid #6366f1; }
.comment.member-1 { border-left: 3px solid #059669; }
.comment.member-2 { border-left: 3px solid #d97706; }
.comment.member-3 { border-left: 3px solid #db2777; }
.comment.member-4 { border-left: 3px solid #7c3aed; }
.comment.member-0 .author { color: #6366f1; }
.comment.member-1 .author { color: #059669; }
.comment.member-2 .author { color: #d97706; }
.comment.member-3 .author { color: #db2777; }
.comment.member-4 .author { color: #7c3aed; }
.comment.member-0 .top .time { color: #6366f1; }
.comment.member-1 .top .time { color: #059669; }
.comment.member-2 .top .time { color: #d97706; }
.comment.member-3 .top .time { color: #db2777; }
.comment.member-4 .top .time { color: #7c3aed; }

/* ── Comment Input ── */
.review-sidebar .comment-input {
  padding: 0.6rem;
  border-top: 1px solid #e5e7eb;
  display: flex;
  gap: 0.4rem;
}
.review-sidebar .comment-input input {
  flex: 1;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 0.45rem 0.65rem;
  font-size: 0.82rem;
  outline: none;
  font-family: inherit;
}
.review-sidebar .comment-input input:focus { border-color: #6366f1; }
.review-sidebar .comment-input .time-insert-btn {
  background: transparent;
  border: 1px solid #e5e7eb;
  color: #6366f1;
  padding: 0.4rem 0.5rem;
  border-radius: 6px;
  font-size: 0.85rem;
  cursor: pointer;
  flex-shrink: 0;
  line-height: 1;
  transition: all 0.15s;
}
.review-sidebar .comment-input .time-insert-btn:hover { background: #eef2ff; border-color: #6366f1; }
.review-sidebar .comment-input .send-btn {
  background: #6366f1;
  color: #fff;
  border: none;
  padding: 0.4rem 0.75rem;
  border-radius: 6px;
  font-size: 0.78rem;
  cursor: pointer;
  font-weight: 600;
  flex-shrink: 0;
}
.review-sidebar .comment-input .send-btn:hover { background: #4f46e5; }

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal-overlay .modal {
  background: #fff;
  border-radius: 14px;
  padding: 1.5rem;
  width: 100%;
  max-width: 440px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.modal-overlay .modal h3 { font-size: 1.05rem; margin-bottom: 1rem; }
.modal-overlay .modal .field { margin-bottom: 0.85rem; }
.modal-overlay .modal .field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: #374151;

<body>

<div id="app"></div>

<!-- Toast -->
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════
   对标作品审阅平台 - 主逻辑
   ═══════════════════════════════════════════════════ */

// ── 数据存储 ──
const STORAGE_KEY = 'video-collab-data';
const DB_NAME = 'VideoCollabDB';
const DB_VERSION = 1;
const MEMBER_COLORS = ['#6366f1', '#059669', '#d97706', '#db2777', '#7c3aed'];

// ── IndexedDB ──
function openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('videos')) {
        db.createObjectStore('videos', { keyPath: 'id' });
      }
    };
    req.onsuccess = function(e) { resolve(e.target.result); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function saveVideoToDB(projectId, file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      openDB().then(function(db) {
        var tx = db.transaction('videos', 'readwrite');
        var store = tx.objectStore('videos');
        store.put({ id: projectId, buffer: e.target.result, name: file.name, type: file.type, size: file.size });
        tx.oncomplete = function() { db.close(); resolve(); };
        tx.onerror = function() { db.close(); reject(tx.error); };
      }).catch(reject);
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function getVideoFromDB(projectId) {
  return new Promise(function(resolve, reject) {
    openDB().then(function(db) {
      var tx = db.transaction('videos', 'readonly');
      var store = tx.objectStore('videos');
      var req = store.get(projectId);
      req.onsuccess = function() { db.close(); resolve(req.result || null); };
      req.onerror = function() { db.close(); reject(req.error); };
    }).catch(reject);
  });
}

function deleteVideoFromDB(projectId) {
  return new Promise(function(resolve, reject) {
    openDB().then(function(db) {
      var tx = db.transaction('videos', 'readwrite');
      var store = tx.objectStore('videos');
      store.delete(projectId);
      tx.oncomplete = function() { db.close(); resolve(); };
      tx.onerror = function() { db.close(); reject(tx.error); };
    }).catch(reject);
  });
}

// ── 数据模型 ──
function getDefaultData() {
  return {
    members: [],
    projects: []
  };
}

var appData = null;
var currentUser = '';
var currentUserColor = 0;
var currentProject = null;
var currentTime = 0;
var videoDuration = 0;
var isPlaying = false;

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return getDefaultData();
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  } catch(e) {
    showToast('⚠️ 数据保存失败，存储空间可能已满');
  }
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function formatTime(seconds) {
  var m = Math.floor(seconds / 60);
  var s = Math.floor(seconds % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function parseTime(str) {
  var parts = String(str).split(/[:：]/);
  if (parts.length === 2) return parseInt(parts[0]) * 60 + parseInt(parts[1]);
  return parseInt(parts[0]) || 0;
}

function getMemberIndex(name) {
  var idx = appData.members.indexOf(name);
  if (idx === -1) {
    idx = appData.members.length;
    appData.members.push(name);
    saveData();
  }
  return idx % MEMBER_COLORS.length;
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ═══════════════════════════════════════════════════
// 渲染入口
// ═══════════════════════════════════════════════════

function render() {
  var app = document.getElementById('app');
  if (!currentUser) {
    renderLogin(app);
  } else {
    renderApp(app);
  }
}

// ── 登录页 ──
function renderLogin(container) {
  container.innerHTML =
    '<div class="login-page">' +
      '<div class="login-card">' +
        '<div class="icon">🎬</div>' +
        '<h1>对标作品审阅平台</h1>' +
        '<p>输入你的名字，开始对标拆片</p>' +
        '<input type="text" id="loginName" placeholder="请输入你的名字" onkeydown="if(event.key===\'Enter\')doLogin()">' +
        '<button class="btn btn-primary btn-block" onclick="doLogin()">进入</button>' +
      '</div>' +
    '</div>';
  document.getElementById('loginName').focus();
}

window.doLogin = function() {
  var name = document.getElementById('loginName').value.trim();
  if (!name) { showToast('请输入你的名字'); return; }
  currentUser = name;
  currentUserColor = getMemberIndex(name);
  render();
  showToast('👋 欢迎，' + name);
};

// ── 改名 ──
window.showRenameUserModal = function() {
  var container = document.getElementById('modal-container');
  container.innerHTML =
    '<div class="modal-overlay active" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" style="max-width:360px">' +
        '<h3>✏️ 修改用户名</h3>' +
        '<div class="field">' +
          '<label>新名称</label>' +
          '<input type="text" id="renameUserInput" value="' + currentUser + '">' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
          '<button class="btn btn-primary" onclick="submitRenameUser()">确认修改</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  setTimeout(function() {
    var input = document.getElementById('renameUserInput');
    if (input) { input.focus(); input.select(); }
  }, 100);
};

window.submitRenameUser = function() {
  var newName = document.getElementById('renameUserInput').value.trim();
  if (!newName) { showToast('名称不能为空'); return; }

  var oldName = currentUser;

  // 更新成员列表
  var mi = appData.members.indexOf(oldName);
  if (mi !== -1) appData.members[mi] = newName;

  // 更新所有标注和回复的作者名
  for (var i = 0; i < appData.projects.length; i++) {
    var p = appData.projects[i];
    for (var j = 0; j < p.annotations.length; j++) {
      var a = p.annotations[j];
      if (a.author === oldName) a.author = newName;
      for (var k = 0; k < a.replies.length; k++) {
        if (a.replies[k].author === oldName) a.replies[k].author = newName;
      }
    }
  }

  currentUser = newName;
  currentUserColor = getMemberIndex(newName);
  saveData();
  closeModal();
  render();
  showToast('✅ 已改名为 ' + newName);
};

// ── 重置数据 ──
window.resetData = function() {
  if (!confirm('确定要重置为示例数据吗？当前所有数据将被清除。')) return;
  localStorage.removeItem(STORAGE_KEY);
  // 直接删库重建，比 store.clear() 更可靠
  var delReq = indexedDB.deleteDatabase(DB_NAME);
  delReq.onsuccess = function() {
    appData = getDefaultData();
    currentUser = '';
    render();
    showToast('✅ 已重置为示例数据');
  };
  delReq.onerror = function() {
    appData = getDefaultData();
    currentUser = '';
    render();
    showToast('⚠️ 重置完成（数据库清除失败）');
  };
};

// ── 主应用 ──
function renderApp(container) {
  var color = MEMBER_COLORS[currentUserColor];
  container.innerHTML =
    '<div class="topbar">' +
      '<div class="logo">🎬 对标作品审阅 <span class="badge">v1.0</span></div>' +
      '<div class="user" style="color:' + color + ';cursor:pointer" onclick="showRenameUserModal()" title="点击改名">' + currentUser + '</div>' +
    '</div>' +
    '<div id="page-projects" class="page active"></div>' +
    '<div id="page-review" class="page"></div>' +
    '<div id="modal-container"></div>';

  renderProjectList();
}

// ═══════════════════════════════════════════════════

function renderProjectList() {
  var container = document.getElementById('page-projects');
  var cats = ['all', 'male', 'female'];
  var catLabels = ['全部', '♂ 男频', '♀ 女频'];
  var catClasses = ['active', 'male', 'female'];

  var toolbarHtml = '<div class="project-toolbar">' +
    '<div class="search-box">' +
      '<span class="icon">🔍</span>' +
      '<input type="text" id="searchProject" placeholder="搜索作品名称..." oninput="filterProjects()">' +
    '</div>';

  for (var i = 0; i < cats.length; i++) {
    toolbarHtml += '<span class="cat-tag ' + catClasses[i] + (i === 0 ? ' active' : '') + '" onclick="filterCategory(this, \'' + cats[i] + '\')">' + catLabels[i] + '</span>';
  }
  toolbarHtml += '</div>';

  var gridHtml = '<div class="project-grid" id="projectGrid">';
  for (var j = 0; j < appData.projects.length; j++) {
    var p = appData.projects[j];
    var catLabel = p.category === 'male' ? '男频' : '女频';
    var catClass = p.category === 'male' ? 'male' : 'female';
    var annotCount = p.annotations ? p.annotations.length : 0;
    gridHtml +=
      '<div class="project-card" data-category="' + p.category + '" data-name="' + p.name + '" data-id="' + p.id + '">' +
        '<div class="card-inner" onclick="openReview(\'' + p.id + '\')">' +
          '<label class="card-checkbox" onclick="event.stopPropagation()">' +
            '<input type="checkbox" class="batch-check" value="' + p.id + '" onchange="updateBatchDeleteBtn()">' +
          '</label>' +
          '<span class="cat-badge ' + catClass + '">' + catLabel + '</span>' +
          '<h3>' + p.name + '</h3>' +
          '<div class="meta"><span>' + annotCount + ' 条标注</span></div>' +
        '</div>' +
        '<span class="card-del-btn" onclick="event.stopPropagation();deleteProject(\'' + p.id + '\')" title="删除作品">🗑️</span>' +
        '<span class="card-export-btn" onclick="event.stopPropagation();exportProject(\'' + p.id + '\')" title="导出项目">📤</span>' +
      '</div>';
  }
  gridHtml += '</div>';

  container.innerHTML =
    '<div class="page-header">' +
      '<h2>对标作品库</h2>' +
      '<div class="header-actions">' +
        '<button class="btn btn-secondary btn-sm" onclick="importProjectFromFile()" style="margin-right:0.5rem">📥 导入项目文件</button>' +
        '<button class="btn btn-danger btn-sm" id="batchDeleteBtn" onclick="batchDelete()" style="display:none">🗑 批量删除</button>' +
        '<button class="btn btn-primary" onclick="showImportModal()">+ 导入对标作品</button>' +
      '</div>' +
    '</div>' +
    toolbarHtml +
    '<input type="file" id="importFileInput" accept=".json" style="display:none" onchange="handleImportFile(this)">' +
    gridHtml +
    '<div class="section-divider">' +
      '<span class="line"></span>' +
      '<span>自制作品（即将上线）</span>' +
      '<span class="line"></span>' +
    '</div>' +
    '<div style="text-align:center;padding:1.5rem;color:#9ca3af;font-size:0.78rem;">' +
      '<button class="btn btn-ghost btn-sm" onclick="resetData()">🔄 重置示例数据</button>' +
    '</div>';
}

// ── 分类筛选 ──
window.filterCategory = function(el, cat) {
  document.querySelectorAll('.project-toolbar .cat-tag').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  var cards = document.querySelectorAll('.project-card');
  cards.forEach(function(c) {
    if (cat === 'all') { c.style.display = ''; }
    else { c.style.display = c.getAttribute('data-category') === cat ? '' : 'none'; }
  });
  updateBatchDeleteBtn();
};

// ── 搜索 ──
window.filterProjects = function() {
  var kw = document.getElementById('searchProject').value.trim().toLowerCase();
  var cards = document.querySelectorAll('.project-card');
  cards.forEach(function(c) {
    var name = c.getAttribute('data-name').toLowerCase();
    c.style.display = name.indexOf(kw) !== -1 ? '' : 'none';
  });
  updateBatchDeleteBtn();
};

// ── 批量删除 ──
window.updateBatchDeleteBtn = function() {
  var allChecked = document.querySelectorAll('.batch-check:checked');
  var visibleChecked = [];
  allChecked.forEach(function(cb) {
    var card = cb.closest('.project-card');
    if (card && card.style.display !== 'none') {
      visibleChecked.push(cb);
    }
  });
  var btn = document.getElementById('batchDeleteBtn');
  if (btn) {
    btn.style.display = visibleChecked.length > 0 ? '' : 'none';
    btn.textContent = '🗑 批量删除（' + visibleChecked.length + '）';
  }
};

window.batchDelete = function() {
  var allChecked = document.querySelectorAll('.batch-check:checked');
  var visibleChecked = [];
  allChecked.forEach(function(cb) {
    var card = cb.closest('.project-card');
    if (card && card.style.display !== 'none') {
      visibleChecked.push(cb);
    }
  });
  if (visibleChecked.length === 0) { showToast('请先勾选要删除的作品'); return; }
  var names = [];
  var ids = [];
  visibleChecked.forEach(function(cb) {
    ids.push(cb.value);
    var card = cb.closest('.project-card');
    if (card) {
      var nameEl = card.querySelector('h3');
      if (nameEl) names.push(nameEl.textContent);
    }
  });
  if (!confirm('确定要删除选中的 ' + visibleChecked.length + ' 个作品吗？\n\n' + names.join('\n'))) return;
  appData.projects = appData.projects.filter(function(p) { return ids.indexOf(p.id) === -1; });
  saveData();
  // 同步删除 IndexedDB 中的视频
  ids.forEach(function(id) { deleteVideoFromDB(id); });
  renderProjectList();
  showToast('✅ 已批量删除 ' + visibleChecked.length + ' 个作品');
};

// ── 删除单个作品 ──
window.deleteProject = function(projectId) {
  var project = appData.projects.find(function(p) { return p.id === projectId; });
  if (!project) return;
  if (!confirm('确定要删除作品「' + project.name + '」吗？\n\n标注和视频数据将一并删除，不可恢复。')) return;
  appData.projects = appData.projects.filter(function(p) { return p.id !== projectId; });
  saveData();
  deleteVideoFromDB(projectId);
  renderProjectList();
  showToast('🗑️ 作品「' + project.name + '」已删除');
};

// ── 导出 / 导入项目数据 ──
window.exportProject = function(projectId) {
  var project = appData.projects.find(function(p) { return p.id === projectId; });
  if (!project) return;

  // 打包完整项目数据
  var exportData = {
    type: 'video-collab-export',
    version: 1,
    exportedAt: new Date().toISOString(),
    exportedBy: currentUser,
    project: {
      id: project.id,
      name: project.name,
      category: project.category,
      annotations: project.annotations || [],
      hasVideo: project.hasVideo
    }
  };

  var json = JSON.stringify(exportData, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = project.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_') + '_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📤 项目「' + project.name + '」已导出');
};

window.importProjectFromFile = function() {
  var input = document.getElementById('importFileInput');
  if (input) input.click();
};

window.handleImportFile = function(input) {
  var file = input.files && input.files[0];
  if (!file) return;

  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (data.type !== 'video-collab-export') {
        showToast('❌ 不是有效的项目导出文件');
        return;
      }
      var p = data.project;
      if (!p || !p.name) {
        showToast('❌ 文件数据不完整');
        return;
      }

      // 检查同名项目
      var existing = appData.projects.find(function(ep) { return ep.name === p.name; });
      if (existing) {
        if (!confirm('已存在同名项目「' + p.name + '」，确定要覆盖吗？')) {
          input.value = '';
          return;
        }
        // 删除旧项目（包括视频）
        deleteVideoFromDB(existing.id);
        appData.projects = appData.projects.filter(function(ep) { return ep.id !== existing.id; });
      }

      var project = {
        id: p.id || genId(),
        name: p.name,
        category: p.category || 'male',
        annotations: p.annotations || [],
        danmaku: [],
        hasVideo: false  // 视频文件需要另外上传
      };

      appData.projects.unshift(project);
      saveData();
      input.value = '';
      renderProjectList();
      showToast('✅ 项目「' + p.name + '」已导入' + (p.hasVideo ? '（请重新上传视频文件）' : ''));
    } catch (err) {
      showToast('❌ 文件读取失败');
    }
  };
  reader.readAsText(file);
};

// ── 导入弹窗 ──
window.showImportModal = function() {
  var container = document.getElementById('modal-container');
  container.innerHTML =
    '<div class="modal-overlay active" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal">' +
        '<h3>📥 导入对标作品</h3>' +
        '<div class="field">' +
          '<label>作品名称</label>' +
          '<input type="text" id="importName" placeholder="输入作品名称...">' +
        '</div>' +
        '<div class="field">' +
          '<label>分类</label>' +
          '<div style="display:flex;gap:1rem;">' +
            '<label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;font-weight:400;"><input type="radio" name="importCat" value="male" checked> ♂ 男频</label>' +
            '<label style="display:flex;align-items:center;gap:0.3rem;font-size:0.85rem;font-weight:400;"><input type="radio" name="importCat" value="female"> ♀ 女频</label>' +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label>视频文件（可选，≤500MB）</label>' +
          '<div class="upload-area" onclick="document.getElementById(\'videoFileInput\').click()">' +
            '<div style="font-size:1.5rem; margin-bottom:0.25rem;">📁</div>' +
            '<div style="font-size:0.82rem; color:#6b7280;">点击选择 MP4 / MOV 文件</div>' +
            '<div style="font-size:0.72rem; color:#9ca3af; margin-top:0.25rem;" id="importFileInfo">支持 MP4/WebM/OGG 格式，建议 ≤300MB</div>' +
            '<input type="file" id="videoFileInput" accept=".mp4,.webm,.ogv,.ogg" style="display:none" onchange="onFileSelected(this)">' +
          '</div>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
          '<button class="btn btn-primary" onclick="doImport()">导入</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  setTimeout(function() { document.getElementById('importName').focus(); }, 100);
};

window.onFileSelected = function(input) {
  var info = document.getElementById('importFileInfo');
  if (input.files && input.files[0]) {
    var file = input.files[0];
    var sizeMB = (file.size / 1024 / 1024).toFixed(1);
    var maxMB = 500;
    if (file.size > maxMB * 1024 * 1024) {
      info.innerHTML = '<span style="color:#ef4444">⚠️ 文件 ' + sizeMB + 'MB 过大！浏览器仅支持 ≤' + maxMB + 'MB 的视频，请压缩后重试</span>';
      window._selectedVideoFile = null;
      input.value = '';
    } else if (file.size > 300 * 1024 * 1024) {
      info.innerHTML = '<span style="color:#f59e0b">⚠️ 文件 ' + sizeMB + 'MB 偏大，建议压缩到 300MB 以内避免导入失败</span>';
      window._selectedVideoFile = file;
    } else {
      info.textContent = '✅ 已选择：' + file.name + ' (' + sizeMB + 'MB)';
      window._selectedVideoFile = file;
    }
  }
};

window.doImport = function() {
  var name = document.getElementById('importName').value.trim();
  if (!name) { showToast('请输入作品名称'); return; }
  var cat = document.querySelector('input[name="importCat"]:checked').value;

  var project = {
    id: genId(),
    name: name,
    category: cat,
    annotations: [],
    hasVideo: !!window._selectedVideoFile
  };

  var file = window._selectedVideoFile;
  if (file) {
    var sizeMB = (file.size / 1024 / 1024).toFixed(1);
    showToast('⏳ 正在导入视频 (' + sizeMB + 'MB)...');
    saveVideoToDB(project.id, file).then(function() {
      finishImport(project);
    }).catch(function(err) {
      project.hasVideo = false;
      var msg = err && err.name === 'QuotaExceededError'
        ? '❌ 视频文件过大，浏览器存储空间不足，请压缩后重试'
        : '❌ 视频导入失败，请重试';
      showToast(msg);
      finishImport(project);
    });
  } else {
    finishImport(project);
  }
};

function finishImport(project) {
  appData.projects.unshift(project);
  saveData();
  window._selectedVideoFile = null;
  closeModal();
  renderProjectList();
  showToast('对标作品「' + project.name + '」已导入！');
}

window.closeModal = function() {
  document.getElementById('modal-container').innerHTML = '';
};

// ═══════════════════════════════════════════════════
// 审阅页
// ═══════════════════════════════════════════════════

window.openReview = function(projectId) {
  var p = appData.projects.find(function(proj) { return proj.id === projectId; });
  if (!p) return;
  currentProject = p;
  currentTime = 0;
  videoDuration = 0;
  isPlaying = false;

  document.querySelectorAll('.page').forEach(function(el) { el.classList.remove('active'); });
  var container = document.getElementById('page-review');
  container.classList.add('active');

  // 构建标注列表
  var annotations = p.annotations || [];
  // 按时间排序
  annotations.sort(function(a, b) { return a.time - b.time; });

  var commentsHtml = '';
  for (var i = 0; i < annotations.length; i++) {
    var a = annotations[i];
    var mi = getMemberIndex(a.author);
    var timeStr = formatTime(a.time);
    var repliesHtml = '';
    for (var j = 0; j < a.replies.length; j++) {
      var r = a.replies[j];
      var rColor = MEMBER_COLORS[getMemberIndex(r.author) % MEMBER_COLORS.length];
      // 内联时间链接转换 - 将 MM:SS 转为可点击链接
      var replyText = r.text || '';
      repliesHtml += '<div class="reply"><span style="color:' + rColor + ';font-weight:600">' + r.author + '</span>：' + replyText + '</div>';
    }
    var actionBtns = '';
    if (a.author === currentUser) {
      actionBtns += '<span class="edit-btn" onclick="event.stopPropagation();editAnnotation(\'' + a.id + '\')">✏️</span>';
      actionBtns += '<span class="del-btn" onclick="event.stopPropagation();deleteAnnotation(\'' + a.id + '\')">🗑️</span>';
    }
    commentsHtml +=
      '<div class="comment member-' + mi + '" data-time="' + a.time + '" data-member="' + a.author + '" onclick="jumpToTime(' + a.time + ')">' +
        '<div class="top"><span class="time">' + timeStr + '</span>' + actionBtns + '</div>' +
        '<div class="author">' + a.author + '</div>' +
        '<div class="text">' + linkifyTime(a.text) + '</div>' +
        repliesHtml +
      '</div>';
  }

  if (!commentsHtml) {
    commentsHtml = '<div class="empty-state"><div class="icon">📝</div><p>暂无标注，暂停视频后点击 ✏️ 添加</p></div>';
  }

  // 时间轴标记
  var markersHtml = '';
  for (var k = 0; k < annotations.length; k++) {
    var pct = (annotations[k].time / videoDuration) * 100;
    markersHtml += '<div class="marker" style="left:' + pct + '%" title="' + formatTime(annotations[k].time) + ' - ' + annotations[k].author + '"></div>';
  }

  var hasVideo = !!p.hasVideo;
  container.innerHTML =
    '<div class="review-layout">' +
      '<div class="review-video">' +
        '<div class="review-topbar">' +
          '<button class="back-btn" onclick="backToProjectList()">← 返回作品库</button>' +
          '<span class="review-title">' + p.name + '</span>' +
        '</div>' +
        '<div class="player-area">' +
          '<div class="placeholder" id="videoPlaceholder"' + (hasVideo ? ' style="display:none"' : '') + ' onclick="document.getElementById(\'reuploadVideoInput\').click()">' +
            '<div class="big-icon">🎬</div>' +
            '<div>' + p.name + '</div>' +
            '<div style="font-size:0.75rem; margin-top:0.3rem;">' + (hasVideo ? '' : '点击此处上传视频文件') + '</div>' +
          '</div>' +
          '<video id="reviewVideo"' + (hasVideo ? '' : ' style="display:none"') + ' controls ontimeupdate="onVideoTimeUpdate()" onloadedmetadata="onVideoLoaded()" onpause="onVideoPause()" onplay="onVideoPlay()" onerror="onVideoError()"></video>' +
          '<input type="file" id="reuploadVideoInput" accept=".mp4,.webm,.ogv,.ogg" style="display:none" onchange="reuploadVideo(this)">' +
          '<button class="add-annotation-btn" id="addAnnotationBtn" onclick="showAnnotationModal()" title="添加标注">✏️ 添加标注</button>' +
        '</div>' +
        '<div class="controls">' +
          '<span class="time" id="timeDisplay">00:00 / ' + formatTime(videoDuration) + '</span>' +
          '<div class="track" id="progressTrack" onclick="onTrackClick(event)">' +
            '<div class="progress" id="progressBar" style="width:0%"></div>' +
            '<div class="thumb" id="progressThumb" style="left:0%"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="review-sidebar">' +
        '<div class="sidebar-header">' +
          '<span>标注 <span class="count" id="annotCount">· ' + annotations.length + ' 条</span></span>' +
          '<span style="font-size:0.75rem;color:#6366f1;cursor:pointer;font-weight:600;" onclick="exportAnnotations()">📥 导出</span>' +
        '</div>' +
        '<div class="jump-bar">' +
          '<button class="nav-btn" onclick="prevAnnotation()" title="上一条">◀</button>' +
          '<span class="nav-count" id="navCount">0 / 0</span>' +
          '<button class="nav-btn" onclick="nextAnnotation()" title="下一条">▶</button>' +
          '<input type="text" id="jumpTimeInput" placeholder="00:00" onkeydown="if(event.key===\'Enter\')jumpToInputTime()">' +
          '<button class="jump-btn" onclick="jumpToInputTime()">跳转</button>' +
        '</div>' +
        '<div id="memberFilter" class="member-filter"></div>' +
        '<div class="comments" id="reviewComments">' + commentsHtml + '</div>' +
        '<div class="comment-input">' +
          '<input type="text" id="replyInput" placeholder="回复当前标注..." onkeydown="if(event.key===\'Enter\')submitReply()">' +
          '<button class="send-btn" onclick="submitReply()">发送</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  // 更新成员筛选
  updateReviewMemberFilter();
  updateNavCount();

  // 如果有视频数据，从 IndexedDB 加载
  if (p.hasVideo) {
    var video = document.getElementById('reviewVideo');
    if (video) {
      getVideoFromDB(p.id).then(function(record) {
        if (record && record.buffer && record.buffer.byteLength > 0) {
          // 根据文件名推断 MIME 类型
          var mime = record.type || '';
          if (!mime || mime === 'application/octet-stream') {
            var ext = (record.name || '').split('.').pop().toLowerCase();
            var mimeMap = { mp4: 'video/mp4', webm: 'video/webm', ogv: 'video/ogg', ogg: 'video/ogg', mkv: 'video/x-matroska', mov: 'video/quicktime', avi: 'video/x-msvideo', wmv: 'video/x-ms-wmv', flv: 'video/x-flv' };
            mime = mimeMap[ext] || 'video/mp4';
          }
          var blob = new Blob([record.buffer], { type: mime });
          var url = URL.createObjectURL(blob);
          // 清理上一个 blob url
          if (video._blobUrl) URL.revokeObjectURL(video._blobUrl);
          video._blobUrl = url;
          video.src = url;
          video.load();
        } else {
          // 数据库里没有视频数据，修正 hasVideo
          p.hasVideo = false;
          saveData();
          video.style.display = 'none';
          var placeholder = document.getElementById('videoPlaceholder');
          if (placeholder) placeholder.style.display = '';
          showToast('⚠️ 视频数据丢失，请重新导入');
        }
      }).catch(function() {
        video.style.display = 'none';
        var placeholder = document.getElementById('videoPlaceholder');
        if (placeholder) placeholder.style.display = '';
        showToast('⚠️ 视频加载失败，请重新导入');
      });
    }
  }
}

// ── 视频暂停/播放时控制标注按钮显示 ──
window.onVideoPause = function() {
  var btn = document.getElementById('addAnnotationBtn');
  if (btn) btn.classList.add('visible');
};
window.onVideoPlay = function() {
  var btn = document.getElementById('addAnnotationBtn');
  if (btn) btn.classList.remove('visible');
};
window.onVideoError = function() {
  var video = document.getElementById('reviewVideo');
  if (video) {
    video.style.display = 'none';
    var placeholder = document.getElementById('videoPlaceholder');
    if (placeholder) placeholder.style.display = '';
    var errCode = video.error ? video.error.code : 'unknown';
    showToast('⚠️ 无法播放此格式（错误码：' + errCode + '），浏览器仅支持 MP4/WebM/OGG');
  }
};

// ── 重新上传视频 ──
window.reuploadVideo = function(input) {
  var file = input.files && input.files[0];
  if (!file || !currentProject) { input.value = ''; return; }

  var sizeMB = (file.size / 1024 / 1024).toFixed(1);
  if (file.size > 500 * 1024 * 1024) {
    showToast('⚠️ 文件 ' + sizeMB + 'MB 过大！浏览器仅支持 ≤500MB');
    input.value = '';
    return;
  }

  showToast('⏳ 正在上传视频 (' + sizeMB + 'MB)...');
  saveVideoToDB(currentProject.id, file).then(function() {
    currentProject.hasVideo = true;
    saveData();
    input.value = '';
    var video = document.getElementById('reviewVideo');
    var placeholder = document.getElementById('videoPlaceholder');
    if (video && placeholder) {
      placeholder.style.display = 'none';
      video.style.display = '';
      // 重新加载视频
      var blob = new Blob([file], { type: file.type || 'video/mp4' });
      var url = URL.createObjectURL(blob);
      if (video._blobUrl) URL.revokeObjectURL(video._blobUrl);
      video._blobUrl = url;
      video.src = url;
      video.load();
    }
    showToast('✅ 视频已上传');
  }).catch(function() {
    showToast('❌ 视频上传失败，文件可能过大');
    input.value = '';
  });
};

// ── 键盘快捷键 ──
document.addEventListener('keydown', function(e) {
  // 只在审阅页生效，弹窗/输入框打开时不拦截
  var reviewPage = document.getElementById('page-review');
  if (!reviewPage || !reviewPage.classList.contains('active')) return;
  if (currentProject && (document.querySelector('.modal-overlay.active') || document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

  var video = document.getElementById('reviewVideo');
  if (!video || !video.duration) return;

  var code = e.key || '';
  if (code === ' ') {
    e.preventDefault();
    if (video.paused) { video.play(); }
    else { video.pause(); }
  } else if (code === 'ArrowLeft') {
    e.preventDefault();
    var t = video.currentTime - 3;
    currentTime = t < 0 ? 0 : t;
    video.currentTime = currentTime;
    updateProgress();
  } else if (code === 'ArrowRight') {
    e.preventDefault();
    var t = video.currentTime + 3;
    currentTime = t > video.duration ? video.duration : t;
    video.currentTime = currentTime;
    updateProgress();
  }
});

// ── 视频控制 ──
window.backToProjectList = function() {
  // 清理 blob url
  try {
    var video = document.getElementById('reviewVideo');
    if (video && video._blobUrl) { URL.revokeObjectURL(video._blobUrl); video._blobUrl = null; }
  } catch(e) {}
  currentProject = null;
  currentTime = 0;
  isPlaying = false;
  document.querySelectorAll('.page').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('page-projects').classList.add('active');
};

window.onVideoTimeUpdate = function() {
  var video = document.getElementById('reviewVideo');
  if (video && video.duration) {
    currentTime = video.currentTime;
    videoDuration = video.duration;
    updateProgress();
  }
};

window.onVideoLoaded = function() {
  var video = document.getElementById('reviewVideo');
  if (video && video.duration) {
    videoDuration = video.duration;
    updateProgress();
  }
};

function updateProgress() {
  var pct = videoDuration > 0 ? (currentTime / videoDuration) * 100 : 0;
  var bar = document.getElementById('progressBar');
  var thumb = document.getElementById('progressThumb');
  var display = document.getElementById('timeDisplay');
  if (bar) bar.style.width = pct + '%';
  if (thumb) thumb.style.left = pct + '%';
  if (display) display.textContent = formatTime(currentTime) + ' / ' + formatTime(videoDuration);
}

window.onTrackClick = function(e) {
  var track = document.getElementById('progressTrack');
  var rect = track.getBoundingClientRect();
  var pct = (e.clientX - rect.left) / rect.width;
  currentTime = pct * videoDuration;
  updateProgress();
  // 如果有视频，同步跳转
  var video = document.getElementById('reviewVideo');
  if (video && video.duration) video.currentTime = currentTime;
};

// ── 跳转 ──
window.jumpToTime = function(seconds) {
  currentTime = Math.max(0, Math.min(seconds, videoDuration));
  updateProgress();

  // 同步视频并暂停
  var video = document.getElementById('reviewVideo');
  if (video && video.duration) {
    video.currentTime = currentTime;
    video.pause();
  }

  // 高亮当前标注
  var allComments = document.querySelectorAll('#reviewComments .comment');
  allComments.forEach(function(c) {
    c.style.borderColor = '#e5e7eb';
    c.style.background = '#f9fafb';
  });

  var found = false;
  for (var i = 0; i < allComments.length; i++) {
    var t = parseFloat(allComments[i].getAttribute('data-time'));
    if (Math.abs(t - seconds) < 0.5) {
      allComments[i].style.borderColor = '#6366f1';
      allComments[i].style.background = '#eef2ff';
      allComments[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      updateNavCount(i + 1, allComments.length);
      found = true;
      break;
    }
  }
  if (!found) updateNavCount(0, allComments.length);
};

window.jumpToInputTime = function() {
  var input = document.getElementById('jumpTimeInput');
  if (!input) return;
  var val = input.value.trim();
  if (!val) return;
  var seconds = parseTime(val);
  if (isNaN(seconds) || seconds < 0) { showToast('请输入有效时间，如 01:30'); return; }
  jumpToTime(seconds);
  input.value = '';
};

// ── 标注导航 ──
window.prevAnnotation = function() {
  var allComments = document.querySelectorAll('#reviewComments .comment');
  if (allComments.length === 0) return;
  var currentIdx = -1;
  for (var i = 0; i < allComments.length; i++) {
    if (allComments[i].style.borderColor === 'rgb(99, 102, 241)' || allComments[i].style.borderColor === '#6366f1') {
      currentIdx = i; break;
    }
  }
  var targetIdx = currentIdx > 0 ? currentIdx - 1 : allComments.length - 1;
  var time = parseFloat(allComments[targetIdx].getAttribute('data-time'));
  jumpToTime(time);
};

window.nextAnnotation = function() {
  var allComments = document.querySelectorAll('#reviewComments .comment');
  if (allComments.length === 0) return;
  var currentIdx = -1;
  for (var i = 0; i < allComments.length; i++) {
    if (allComments[i].style.borderColor === 'rgb(99, 102, 241)' || allComments[i].style.borderColor === '#6366f1') {
      currentIdx = i; break;
    }
  }
  var targetIdx = currentIdx < allComments.length - 1 ? currentIdx + 1 : 0;
  var time = parseFloat(allComments[targetIdx].getAttribute('data-time'));
  jumpToTime(time);
};

function updateNavCount(idx, total) {
  var el = document.getElementById('navCount');
  if (!el) return;
  if (total === undefined) total = (currentProject && currentProject.annotations) ? currentProject.annotations.length : 0;
  if (idx === undefined) idx = 0;
  el.textContent = (idx || 0) + ' / ' + (total || 0);
}

// ── 成员筛选 ──
function updateReviewMemberFilter() {
  var container = document.getElementById('memberFilter');
  if (!container) return;
  var members = [];
  if (currentProject && currentProject.annotations) {
    currentProject.annotations.forEach(function(a) {
      if (members.indexOf(a.author) === -1) members.push(a.author);
      a.replies.forEach(function(r) {
        if (members.indexOf(r.author) === -1) members.push(r.author);
      });
    });
  }
  if (members.length <= 1) { container.innerHTML = ''; return; }

  var html = '<span class="tag active" onclick="filterByMember(this,\'all\')">全部</span>';
  for (var i = 0; i < members.length; i++) {
    html += '<span class="tag" onclick="filterByMember(this,\'' + members[i] + '\')">' + members[i] + '</span>';
  }
  container.innerHTML = html;
}

window.filterByMember = function(el, member) {
  var container = el.parentElement;
  container.querySelectorAll('.tag').forEach(function(t) { t.classList.remove('active'); });
  el.classList.add('active');
  var comments = document.querySelectorAll('#reviewComments .comment');
  comments.forEach(function(c) {
    if (member === 'all') { c.style.display = ''; }
    else { c.style.display = c.getAttribute('data-member') === member ? '' : 'none'; }
  });
};

// ── 添加标注 ──
window.showAnnotationModal = function() {
  // 在侧边栏顶部插入输入区域
  var sidebar = document.querySelector('.review-sidebar');
  if (!sidebar) return;

  var existing = document.getElementById('inlineAnnotation');
  if (existing) existing.remove();

  var div = document.createElement('div');
  div.id = 'inlineAnnotation';
  div.className = 'inline-annotation';
  div.innerHTML =
    '<div class="inline-annotation-header">' +
      '<span>✏️ 标注 @ ' + formatTime(currentTime) + '</span>' +
      '<span class="close-inline" onclick="cancelInlineAnnotation()">✕</span>' +
    '</div>' +
    '<textarea id="annotationText" placeholder="写下你的分析..." rows="3"></textarea>' +
    '<div class="inline-annotation-actions">' +
      '<button class="btn btn-secondary btn-sm" onclick="cancelInlineAnnotation()">取消</button>' +
      '<button class="btn btn-primary btn-sm" onclick="submitAnnotation()">保存</button>' +
    '</div>';
  sidebar.insertBefore(div, sidebar.firstChild);
  setTimeout(function() { document.getElementById('annotationText').focus(); }, 100);

  // 暂停视频
  var video = document.getElementById('reviewVideo');
  if (video) video.pause();
};

window.cancelInlineAnnotation = function() {
  var el = document.getElementById('inlineAnnotation');
  if (el) el.remove();
};

window.submitAnnotation = function() {
  var text = document.getElementById('annotationText').value.trim();
  if (!text) { showToast('请填写标注内容'); return; }
  cancelInlineAnnotation();

  var annotation = {
    id: genId(),
    time: currentTime,
    text: text,
    author: currentUser,
    replies: []
  };

  if (!currentProject.annotations) currentProject.annotations = [];
  currentProject.annotations.push(annotation);
  saveData();

  // 刷新标注列表
  refreshAnnotations();
  showToast('✅ 标注已保存');
};

// ── 回复 ──
window.submitReply = function() {
  var input = document.getElementById('replyInput');
  if (!input) return;
  var text = input.value.trim();
  if (!text) { showToast('请输入回复内容'); return; }

  // 找到当前高亮的标注
  var allComments = document.querySelectorAll('#reviewComments .comment');
  var targetAnnotation = null;
  for (var i = 0; i < allComments.length; i++) {
    if (allComments[i].style.borderColor === 'rgb(99, 102, 241)' || allComments[i].style.borderColor === '#6366f1') {
      var time = parseFloat(allComments[i].getAttribute('data-time'));
      targetAnnotation = currentProject.annotations.find(function(a) { return Math.abs(a.time - time) < 0.5; });
      break;
    }
  }

  if (!targetAnnotation) {
    // 如果没有高亮的，就按当前时间找最近的
    var minDiff = Infinity;
    for (var j = 0; j < currentProject.annotations.length; j++) {
      var diff = Math.abs(currentProject.annotations[j].time - currentTime);
      if (diff < minDiff) {
        minDiff = diff;
        targetAnnotation = currentProject.annotations[j];
      }
    }
  }

  if (!targetAnnotation) { showToast('请先添加一条标注'); return; }

  targetAnnotation.replies.push({
    author: currentUser,
    text: text,
    time: Date.now()
  });
  saveData();
  refreshAnnotations();
  input.value = '';
  showToast('✅ 回复已保存');
};

// ── 导出标注 ──
window.exportAnnotations = function() {
  if (!currentProject || !currentProject.annotations || currentProject.annotations.length === 0) {
    showToast('暂无标注可导出');
    return;
  }

  var lines = [];
  lines.push('# ' + currentProject.name + ' — 标注汇总');
  lines.push('');

  var annotations = currentProject.annotations.slice().sort(function(a, b) { return a.time - b.time; });
  for (var i = 0; i < annotations.length; i++) {
    var a = annotations[i];
    lines.push('## ' + formatTime(a.time) + ' — ' + a.author);
    lines.push('');
    lines.push(a.text);
    lines.push('');
    if (a.replies && a.replies.length > 0) {
      lines.push('**回复：**');
      for (var j = 0; j < a.replies.length; j++) {
        var r = a.replies[j];
        lines.push('- ' + r.author + '：' + r.text);
      }
      lines.push('');
    }
  }

  var content = lines.join('\n');
  var blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = currentProject.name.replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '_') + '_标注.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✅ 标注已导出');
};

// ── 刷新标注列表（不重建整个页面）──
function refreshAnnotations() {
  var p = currentProject;
  if (!p) return;
  var annotations = p.annotations || [];
  annotations.sort(function(a, b) { return a.time - b.time; });

  // 刷新标注列表
  var commentsHtml = '';
  for (var i = 0; i < annotations.length; i++) {
    var a = annotations[i];
    var mi = getMemberIndex(a.author);
    var timeStr = formatTime(a.time);
    var repliesHtml = '';
    for (var j = 0; j < a.replies.length; j++) {
      var r = a.replies[j];
      var rColor = MEMBER_COLORS[getMemberIndex(r.author) % MEMBER_COLORS.length];
      var replyText = r.text || '';
      repliesHtml += '<div class="reply"><span style="color:' + rColor + ';font-weight:600">' + r.author + '</span>：' + replyText + '</div>';
    }
    var actionBtns = '';
    if (a.author === currentUser) {
      actionBtns += '<span class="edit-btn" onclick="event.stopPropagation();editAnnotation(\'' + a.id + '\')">✏️</span>';
      actionBtns += '<span class="del-btn" onclick="event.stopPropagation();deleteAnnotation(\'' + a.id + '\')">🗑️</span>';
    }
    commentsHtml +=
      '<div class="comment member-' + mi + '" data-time="' + a.time + '" data-member="' + a.author + '" onclick="jumpToTime(' + a.time + ')">' +
        '<div class="top"><span class="time">' + timeStr + '</span>' + actionBtns + '</div>' +
        '<div class="author">' + a.author + '</div>' +
        '<div class="text">' + linkifyTime(a.text) + '</div>' +
        repliesHtml +
      '</div>';
  }

  if (!commentsHtml) {
    commentsHtml = '<div class="empty-state"><div class="icon">📝</div><p>暂无标注，暂停视频后点击 ✏️ 添加</p></div>';
  }

  var container = document.getElementById('reviewComments');
  if (container) container.innerHTML = commentsHtml;

  // 时间轴标记
  var markersHtml = '';
  for (var k = 0; k < annotations.length; k++) {
    var pct = (annotations[k].time / videoDuration) * 100;
    markersHtml += '<div class="marker" style="left:' + pct + '%" title="' + formatTime(annotations[k].time) + ' - ' + annotations[k].author + '"></div>';
  }

  var track = document.getElementById('progressTrack');
  if (track) {
    var oldMarkers = track.querySelectorAll('.marker');
    oldMarkers.forEach(function(m) { m.remove(); });
    track.insertAdjacentHTML('beforeend', markersHtml);
  }

  // 刷新标注计数
  var countEl = document.querySelector('#annotCount');
  if (countEl) countEl.textContent = '· ' + annotations.length + ' 条';

  // 刷新成员筛选
  updateReviewMemberFilter();
  updateNavCount();
}

// ── 只刷新时间轴标记 ──
function refreshTimelineMarkers() {
  var p = currentProject;
  if (!p) return;
  var annotations = p.annotations || [];

  var track = document.getElementById('progressTrack');
  if (!track) return;

  var oldMarkers = track.querySelectorAll('.marker');
  oldMarkers.forEach(function(m) { m.remove(); });

  for (var i = 0; i < annotations.length; i++) {
    var pct = (annotations[i].time / videoDuration) * 100;
    var marker = document.createElement('div');
    marker.className = 'marker';
    marker.style.left = pct + '%';
    marker.title = formatTime(annotations[i].time) + ' - ' + annotations[i].author;
    track.appendChild(marker);
  }
}

// ── 内联时间链接转换 ──
function linkifyTime(text) {
  if (!text) return '';
  return text.replace(/(\d{1,2}:\d{2})/g, function(match) {
    var seconds = parseTime(match);
    return '<span class="time-link" onclick="event.stopPropagation();jumpToTime(' + seconds + ')">' + match + '</span>';
  });
}

// ── 编辑标注 ──
window.editAnnotation = function(annotId) {
  var annot = currentProject.annotations.find(function(a) { return a.id === annotId; });
  if (!annot) return;
  var container = document.getElementById('modal-container');
  container.innerHTML =
    '<div class="modal-overlay active annotation-modal" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal">' +
        '<h3>✏️ 编辑标注</h3>' +
        '<div class="time-info">⏱ ' + formatTime(annot.time) + '</div>' +
        '<div class="field">' +
          '<label>标注内容</label>' +
          '<textarea id="editAnnotationText">' + annot.text + '</textarea>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn btn-secondary" onclick="closeModal()">取消</button>' +
          '<button class="btn btn-primary" onclick="submitEditAnnotation(\'' + annotId + '\')">保存</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  setTimeout(function() { document.getElementById('editAnnotationText').focus(); }, 100);
};

window.submitEditAnnotation = function(annotId) {
  var text = document.getElementById('editAnnotationText').value.trim();
  if (!text) { showToast('请填写标注内容'); return; }
  var annot = currentProject.annotations.find(function(a) { return a.id === annotId; });
  if (!annot) return;
  annot.text = text;
  saveData();
  closeModal();
  refreshAnnotations();
  showToast('✅ 标注已更新');
};

// ── 删除标注 ──
window.deleteAnnotation = function(annotId) {
  if (!confirm('确定要删除这条标注及其所有回复吗？')) return;
  var annots = currentProject.annotations;
  for (var i = 0; i < annots.length; i++) {
    if (annots[i].id === annotId) {
      annots.splice(i, 1);
      break;
    }
  }
  saveData();
  refreshAnnotations();
  showToast('🗑️ 标注已删除');
};

// ── 插入当前时间到回复框 ──
window.insertCurrentTime = function() {
  var input = document.getElementById('replyInput');
  if (!input) return;
  var timeStr = formatTime(currentTime);
  var start = input.selectionStart;
  var end = input.selectionEnd;
  var before = input.value.substring(0, start);
  var after = input.value.substring(end);
  input.value = before + timeStr + after;
  input.selectionStart = input.selectionEnd = start + timeStr.length;
  input.focus();
};

// ═══════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════

appData = loadData();
render();
</script>
