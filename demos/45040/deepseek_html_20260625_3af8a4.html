<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroMap · 脑科学自适应学习系统</title>
    <style>
        /* 全局重置 & 深色主题 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: #0b0e1a;
            color: #e8edf5;
            height: 100vh;
            overflow: hidden;
        }
        /* 头部 */
        header {
            background: rgba(18, 25, 45, 0.85);
            backdrop-filter: blur(8px);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            height: 70px;
            flex-shrink: 0;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .logo-area h1 {
            font-weight: 600;
            font-size: 22px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #6dd5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-area small {
            font-size: 13px;
            color: #8b9bb5;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .progress-summary {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .progress-summary .label {
            font-size: 13px;
            color: #b0c4de;
        }
        .progress-bar-bg {
            width: 160px;
            height: 6px;
            background: #1e2a3a;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f97316, #22d3ee, #4ade80);
            border-radius: 10px;
            transition: width 0.4s ease;
        }
        .progress-text {
            font-weight: 600;
            font-size: 15px;
            color: #c8d8f0;
            min-width: 44px;
        }
        /* 主布局 */
        .main {
            display: flex;
            height: calc(100vh - 70px);
            width: 100%;
        }
        /* 图谱容器 */
        #graph-container {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at 30% 40%, #0f1a2b, #060a12);
            overflow: hidden;
        }
        #graph-container svg {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 右侧面板 */
        #panel {
            width: 340px;
            background: rgba(16, 24, 42, 0.92);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.06);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        #panel::-webkit-scrollbar {
            width: 4px;
        }
        #panel::-webkit-scrollbar-thumb {
            background: #3a4a66;
            border-radius: 10px;
        }
        .panel-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7a8aa5;
            margin-bottom: -6px;
        }
        .node-detail {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 18px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .node-detail .name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .node-detail .desc {
            font-size: 14px;
            color: #a8bcd6;
            margin-bottom: 14px;
        }
        .mastery-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .mastery-row .label {
            font-size: 13px;
            color: #a0b4ce;
        }
        .mastery-bar {
            flex: 1;
            height: 6px;
            background: #1e2a3a;
            border-radius: 8px;
            overflow: hidden;
        }
        .mastery-bar .fill {
            height: 100%;
            width: 0%;
            border-radius: 8px;
            transition: width 0.3s ease;
        }
        .mastery-value {
            font-weight: 600;
            font-size: 14px;
            min-width: 36px;
            text-align: right;
        }
        .load-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #b0c4de;
            margin-top: 4px;
        }
        .load-indicator .badge {
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge.high {
            background: #f87171;
            color: #1a1a2e;
        }
        .badge.medium {
            background: #fbbf24;
            color: #1a1a2e;
        }
        .badge.low {
            background: #34d399;
            color: #1a1a2e;
        }
        .btn-learn {
            background: linear-gradient(135deg, #6dd5fa, #7c3aed);
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.15s, box-shadow 0.2s;
            width: 100%;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }
        .btn-learn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(108, 213, 250, 0.3);
        }
        .btn-learn:active {
            transform: scale(0.97);
        }
        .btn-learn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .recommend-section {
            margin-top: 4px;
        }
        .recommend-section .label {
            font-size: 13px;
            color: #a0b4ce;
            margin-bottom: 8px;
            display: block;
        }
        .rec-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .rec-list li {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rec-list li:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .rec-list li .rec-name {
            font-weight: 500;
            font-size: 14px;
        }
        .rec-list li .rec-mastery {
            font-size: 12px;
            color: #9aabc5;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 12px;
            border-radius: 30px;
        }
        .empty-rec {
            color: #6a7a95;
            font-size: 14px;
            text-align: center;
            padding: 12px 0;
        }
        /* 重置 & 辅助按钮 */
        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c8d8f0;
            padding: 8px 0;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            flex: 1;
            transition: background 0.2s;
            text-align: center;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        /* 图例 */
        .legend {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(8, 14, 26, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 12px;
            color: #b0c4de;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* 节点悬浮提示 */
        .tooltip {
            position: absolute;
            background: rgba(12, 20, 40, 0.92);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e8edf5;
            display: none;
            z-index: 10;
        }
        /* 响应式调整 */
        @media (max-width: 768px) {
            #panel {
                width: 280px;
                padding: 16px;
            }
            .progress-bar-bg {
                width: 100px;
            }
        }
        @media (max-width: 600px) {
            .main {
                flex-direction: column;
            }
            #panel {
                width: 100%;
                height: 40vh;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.06);
            }
            #graph-container {
                height: 60vh;
            }
        }
        /* 节点外发光（推荐） */
        .glow-ring {
            fill: none;
            stroke: #fbbf24;
            stroke-width: 3;
            stroke-opacity: 0.7;
            animation: pulse-glow 1.8s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                stroke-opacity: 0.3;
                stroke-width: 2.5;
                r: 20;
            }
            50% {
                stroke-opacity: 1;
                stroke-width: 4;
                r: 24;
            }
        }
        /* 选中节点高亮 */
        .selected-ring {
            fill: none;
            stroke: #a78bfa;
            stroke-width: 3.5;
            stroke-dasharray: 6 4;
            animation: dash-rotate 3s linear infinite;
        }
        @keyframes dash-rotate {
            to {
                stroke-dashoffset: -20;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>🧠 NeuroMap</h1>
            <small>脑科学 · 自适应学习</small>
        </div>
        <div class="progress-summary">
            <span class="label">总掌握度</span>
            <div class="progress-bar-bg">
                <div id="overall-progress" class="progress-bar-fill" style="width:0%"></div>
            </div>
            <span id="overall-text" class="progress-text">0%</span>
        </div>
    </header>

    <div class="main">
        <div id="graph-container">
            <div id="tooltip" class="tooltip"></div>
            <div class="legend">
                <div class="legend-item"><span class="legend-color" style="background:#f87171;"></span> 低掌握</div>
                <div class="legend-item"><span class="legend-color" style="background:#fbbf24;"></span> 中等</div>
                <div class="legend-item"><span class="legend-color" style="background:#4ade80;"></span> 高掌握</div>
                <div class="legend-item" style="margin-top:4px;">⭐ 推荐学习</div>
            </div>
        </div>

        <div id="panel">
            <span class="panel-title">📌 当前知识点</span>
            <div id="node-detail" class="node-detail">
                <div class="name" id="detail-name">—</div>
                <div class="desc" id="detail-desc">点击图谱节点查看详情</div>
                <div class="mastery-row">
                    <span class="label">掌握度</span>
                    <div class="mastery-bar">
                        <div id="detail-mastery-fill" class="fill" style="width:0%; background:#4ade80;"></div>
                    </div>
                    <span id="detail-mastery-value" class="mastery-value">0%</span>
                </div>
                <div class="load-indicator">
                    <span>🧠 认知负荷</span>
                    <span id="detail-load-badge" class="badge high">高</span>
                </div>
                <button id="btn-learn" class="btn-learn">📚 学习此知识点</button>
            </div>

            <div class="recommend-section">
                <span class="label">🎯 自适应推荐（点击切换）</span>
                <ul id="rec-list" class="rec-list">
                    <li class="empty-rec">暂无推荐，继续学习吧</li>
                </ul>
            </div>

            <div class="action-row">
                <button id="btn-reset" class="btn-secondary">⟳ 重置进度</button>
                <button id="btn-forget" class="btn-secondary">⏳ 模拟遗忘</button>
            </div>
        </div>
    </div>

    <script src="https://d3js.org/d3.v7.min.js">
    </script>
    <script>
        // ============================================================
        // 1. 数据定义
        // ============================================================
        const nodeData = [
            { id: 'linear_algebra', name: '线性代数', category: '基础', mastery: 0.85, desc: '向量、矩阵、线性变换' },
            { id: 'calculus', name: '微积分', category: '基础', mastery: 0.80, desc: '导数、积分、极限' },
            { id: 'probability', name: '概率论', category: '基础', mastery: 0.75, desc: '概率、统计、分布' },
            { id: 'programming', name: '编程基础', category: '基础', mastery: 0.90, desc: 'Python、数据结构' },
            { id: 'ml_basics', name: '机器学习基础', category: '中级', mastery: 0.50, desc: '监督学习、无监督学习' },
            { id: 'data_preprocess', name: '数据预处理', category: '中级', mastery: 0.60, desc: '清洗、归一化、特征工程' },
            { id: 'linear_regression', name: '线性回归', category: '中级', mastery: 0.40, desc: '最小二乘法、梯度下降' },
            { id: 'logistic_regression', name: '逻辑回归', category: '中级', mastery: 0.35, desc: '分类、Sigmoid' },
            { id: 'decision_tree', name: '决策树', category: '中级', mastery: 0.30, desc: '树结构、信息增益' },
            { id: 'svm', name: '支持向量机', category: '中级', mastery: 0.25, desc: '最大间隔、核函数' },
            { id: 'neural_net', name: '神经网络', category: '高级', mastery: 0.20, desc: '多层感知机、反向传播' },
            { id: 'deep_learning', name: '深度学习', category: '高级', mastery: 0.15, desc: '深度网络、激活函数' },
            { id: 'cnn', name: '卷积神经网络', category: '高级', mastery: 0.10, desc: '卷积、池化、图像' },
            { id: 'rnn', name: '循环神经网络', category: '高级', mastery: 0.10, desc: '序列、LSTM' },
            { id: 'rl', name: '强化学习', category: '高级', mastery: 0.05, desc: '奖励、策略、Q学习' },
        ];

        // 边 (source -> target)
        const linkData = [
            { source: 'linear_algebra', target: 'ml_basics' },
            { source: 'linear_algebra', target: 'linear_regression' },
            { source: 'linear_algebra', target: 'neural_net' },
            { source: 'calculus', target: 'ml_basics' },
            { source: 'calculus', target: 'neural_net' },
            { source: 'probability', target: 'ml_basics' },
            { source: 'probability', target: 'logistic_regression' },
            { source: 'programming', target: 'ml_basics' },
            { source: 'programming', target: 'data_preprocess' },
            { source: 'ml_basics', target: 'linear_regression' },
            { source: 'ml_basics', target: 'logistic_regression' },
            { source: 'ml_basics', target: 'decision_tree' },
            { source: 'ml_basics', target: 'svm' },
            { source: 'ml_basics', target: 'neural_net' },
            { source: 'data_preprocess', target: 'linear_regression' },
            { source: 'data_preprocess', target: 'logistic_regression' },
            { source: 'data_preprocess', target: 'decision_tree' },
            { source: 'data_preprocess', target: 'svm' },
            { source: 'neural_net', target: 'deep_learning' },
            { source: 'deep_learning', target: 'cnn' },
            { source: 'deep_learning', target: 'rnn' },
            // 再加一点交叉
            { source: 'linear_regression', target: 'logistic_regression' },
            { source: 'decision_tree', target: 'svm' },
        ];

        // 构建节点映射
        const nodeMap = Object.fromEntries(nodeData.map(d => [d.id, d]));

        // ============================================================
        // 2. 全局状态
        // ============================================================
        let selectedId = 'ml_basics'; // 默认选中
        let recommendIds = [];
        let nodes = nodeData; // 引用
        let links = linkData.map(d => ({
            source: nodeMap[d.source],
            target: nodeMap[d.target]
        }));

        // 颜色比例尺 (掌握度 0~1 -> 红黄绿)
        const colorScale = d3.scaleSequential(d3.interpolateRgbBasis(['#f87171', '#fbbf24', '#4ade80']))
            .domain([0, 1]);

        // ============================================================
        // 3. D3 图初始化
        // ============================================================
        const container = document.getElementById('graph-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const svg = d3.select('#graph-container')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        const g = svg.append('g');

        // 用于缩放
        const zoom = d3.zoom()
            .scaleExtent([0.3, 2.5])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });
        svg.call(zoom);

        // 边线
        const linkGroup = g.append('g').attr('class', 'links');
        const nodeGroup = g.append('g').attr('class', 'nodes');

        // 力模拟
        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id).distance(160).strength(0.7))
            .force('charge', d3.forceManyBody().strength(-600))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collide', d3.forceCollide().radius(30));

        // ============================================================
        // 4. 绘制函数（初始 & 更新）
        // ============================================================
        function render() {
            // ---- 边 ----
            const linkSel = linkGroup.selectAll('line')
                .data(links, d => d.source.id + '→' + d.target.id);

            linkSel.enter()
                .append('line')
                .attr('stroke', 'rgba(255,255,255,0.15)')
                .attr('stroke-width', 1.5)
                .merge(linkSel);

            linkSel.exit().remove();

            // ---- 节点 ----
            // 每个节点包含一个组: circle + text + 装饰圈
            const nodeSel = nodeGroup.selectAll('g.node-group')
                .data(nodes, d => d.id);

            const nodeEnter = nodeSel.enter()
                .append('g')
                .attr('class', 'node-group')
                .call(d3.drag()
                    .on('start', (event, d) => {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        d.fx = d.x;
                        d.fy = d.y;
                    })
                    .on('drag', (event, d) => {
                        d.fx = event.x;
                        d.fy = event.y;
                    })
                    .on('end', (event, d) => {
                        if (!event.active) simulation.alphaTarget(0);
                        d.fx = null;
                        d.fy = null;
                    })
                )
                .on('click', (event, d) => {
                    selectNode(d.id);
                })
                .on('mouseover', (event, d) => {
                    const tooltip = document.getElementById('tooltip');
                    tooltip.style.display = 'block';
                    tooltip.textContent = `${d.name}  (掌握度 ${Math.round(d.mastery*100)}%)`;
                    const rect = container.getBoundingClientRect();
                    const [x, y] = d3.pointer(event, container);
                    tooltip.style.left = (x + 12) + 'px';
                    tooltip.style.top = (y - 10) + 'px';
                })
                .on('mouseout', () => {
                    document.getElementById('tooltip').style.display = 'none';
                });

            // 圆
            nodeEnter.append('circle')
                .attr('class', 'node-circle')
                .attr('r', 18)
                .attr('fill', d => colorScale(d.mastery))
                .attr('stroke', 'rgba(255,255,255,0.2)')
                .attr('stroke-width', 1.5);

            // 文本
            nodeEnter.append('text')
                .attr('class', 'node-label')
                .attr('text-anchor', 'middle')
                .attr('dy', 30)
                .style('fill', '#e8edf5')
                .style('font-size', '11px')
                .style('font-weight', '500')
                .style('pointer-events', 'none')
                .style('text-shadow', '0 0 8px rgba(0,0,0,0.8)')
                .text(d => d.name);

            // 合并所有节点组
            const allGroups = nodeSel.merge(nodeEnter);

            // 更新circle属性
            allGroups.select('circle.node-circle')
                .attr('fill', d => colorScale(d.mastery))
                .attr('r', d => d.id === selectedId ? 22 : 18);

            // 更新文字
            allGroups.select('text.node-label')
                .text(d => d.name);

            // 移除多余的装饰圈（我们会在tick中动态添加高亮和推荐圈，但为了清晰，我们用tick管理）
            // 所以先移除所有额外圈，在tick中重新添加
            allGroups.selectAll('.glow-ring, .selected-ring').remove();

            // 在tick中处理装饰圈
            // 但我们需要在tick中访问数据，所以我们在tick函数中处理

            nodeSel.exit().remove();

            // ---- 更新模拟 ----
            simulation.nodes(nodes);
            simulation.force('link').links(links);
            simulation.alpha(0.3).restart();

            // ---- tick 事件 ----
            simulation.on('tick', () => {
                // 更新边
                linkGroup.selectAll('line')
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                // 更新节点组位置
                nodeGroup.selectAll('g.node-group')
                    .attr('transform', d => `translate(${d.x}, ${d.y})`);

                // 动态添加装饰圈（推荐 & 选中）
                nodeGroup.selectAll('g.node-group').each(function(d) {
                    const group = d3.select(this);
                    // 移除之前的装饰圈（保留circle和text）
                    group.selectAll('.glow-ring, .selected-ring').remove();

                    // 推荐圈
                    if (recommendIds.includes(d.id)) {
                        group.append('circle')
                            .attr('class', 'glow-ring')
                            .attr('r', 22)
                            .attr('fill', 'none')
                            .attr('stroke', '#fbbf24')
                            .attr('stroke-width', 2.5)
                            .attr('stroke-opacity', 0.7);
                    }
                    // 选中圈
                    if (d.id === selectedId) {
                        group.append('circle')
                            .attr('class', 'selected-ring')
                            .attr('r', 26)
                            .attr('fill', 'none')
                            .attr('stroke', '#a78bfa')
                            .attr('stroke-width', 3)
                            .attr('stroke-dasharray', '6 4');
                    }
                });
            });

            // 第一次tick会立即触发
            simulation.alpha(0.3).restart();

            // 更新整体进度
            updateOverallProgress();
        }

        // ============================================================
        // 5. 辅助函数：更新整体进度、推荐、面板等
        // ============================================================
        function updateOverallProgress() {
            const total = nodes.length;
            const sum = nodes.reduce((acc, d) => acc + d.mastery, 0);
            const avg = sum / total;
            const pct = Math.round(avg * 100);
            document.getElementById('overall-progress').style.width = pct + '%';
            document.getElementById('overall-text').textContent = pct + '%';
        }

        function computeRecommendations() {
            // 规则：掌握度 < 0.6，且所有前置依赖节点的平均掌握度 > 0.5 (若无前置则直接推荐)
            const recs = [];
            for (const node of nodes) {
                if (node.mastery >= 0.6) continue;
                // 找出所有以该节点为target的边
                const preds = links.filter(l => l.target.id === node.id).map(l => l.source);
                if (preds.length === 0) {
                    recs.push(node);
                } else {
                    const avgPred = preds.reduce((sum, p) => sum + p.mastery, 0) / preds.length;
                    if (avgPred > 0.5) {
                        recs.push(node);
                    }
                }
            }
            // 按掌握度升序排列，取前5个
            recs.sort((a, b) => a.mastery - b.mastery);
            recommendIds = recs.slice(0, 5).map(d => d.id);
            // 如果推荐列表为空，默认推荐掌握度最低且未达标的节点
            if (recommendIds.length === 0) {
                const lowest = nodes.filter(d => d.mastery < 0.6).sort((a, b) => a.mastery - b.mastery);
                if (lowest.length > 0) {
                    recommendIds = [lowest[0].id];
                } else {
                    recommendIds = [];
                }
            }
            // 更新推荐UI
            updateRecommendUI();
        }

        function updateRecommendUI() {
            const list = document.getElementById('rec-list');
            list.innerHTML = '';
            if (recommendIds.length === 0) {
                list.innerHTML = '<li class="empty-rec">🎉 所有知识点已掌握，太棒了！</li>';
                return;
            }
            for (const id of recommendIds) {
                const node = nodeMap[id];
                if (!node) continue;
                const li = document.createElement('li');
                li.innerHTML = `
                    <span class="rec-name">${node.name}</span>
                    <span class="rec-mastery">${Math.round(node.mastery*100)}%</span>
                `;
                li.addEventListener('click', () => selectNode(node.id));
                list.appendChild(li);
            }
        }

        function selectNode(id) {
            const node = nodeMap[id];
            if (!node) return;
            selectedId = id;
            // 更新面板
            document.getElementById('detail-name').textContent = node.name;
            document.getElementById('detail-desc').textContent = node.desc || '暂无描述';
            const pct = Math.round(node.mastery * 100);
            document.getElementById('detail-mastery-fill').style.width = pct + '%';
            document.getElementById('detail-mastery-fill').style.background = colorScale(node.mastery);
            document.getElementById('detail-mastery-value').textContent = pct + '%';

            // 认知负荷：掌握度低 -> 负荷高
            const load = node.mastery < 0.3 ? '高' : (node.mastery < 0.6 ? '中' : '低');
            const badge = document.getElementById('detail-load-badge');
            badge.textContent = load;
            badge.className = 'badge ' + (load === '高' ? 'high' : (load === '中' ? 'medium' : 'low'));

            // 启用学习按钮
            document.getElementById('btn-learn').disabled = false;

            // 更新图谱装饰（通过tick自动刷新，但我们需要强制触发tick？因为选中圈在tick中绘制，我们只需重新触发tick）
            // 但tick是持续的，我们只需要触发一次重绘？实际上我们在tick中会更新所有，但为了立即反映，可以重启模拟一下。
            simulation.alpha(0.1).restart();

            // 更新推荐列表（可能因为选中节点而改变？推荐不变，但我们可以保持）
            // 但为了交互，我们点击节点时也可以重新计算推荐（但推荐基于全局，不依赖于选中）
            // 我们可以在点击后重新计算推荐，但推荐不因选中而变，除非有学习操作。
            // 所以这里不重新计算推荐，只是选中。
        }

        function learnNode() {
            const node = nodeMap[selectedId];
            if (!node) return;
            if (node.mastery >= 1) {
                alert('此知识点已完全掌握！');
                return;
            }
            // 增加掌握度 0.12
            node.mastery = Math.min(1, node.mastery + 0.12);
            // 更新UI
            selectNode(selectedId); // 刷新面板
            // 重新计算推荐
            computeRecommendations();
            // 更新整体进度
            updateOverallProgress();
            // 触发tick更新颜色 (由于数据变了，节点circle填充在tick中不会自动更新，因为tick只更新位置，不更新属性)
            // 所以我们需要手动更新circle fill
            nodeGroup.selectAll('g.node-group').select('circle.node-circle')
                .attr('fill', d => colorScale(d.mastery));
            // 更新半径（选中放大）
            nodeGroup.selectAll('g.node-group').select('circle.node-circle')
                .attr('r', d => d.id === selectedId ? 22 : 18);
            // 重启模拟让视觉效果刷新
            simulation.alpha(0.1).restart();
        }

        function resetProgress() {
            // 恢复初始值
            const initialMastery = {
                linear_algebra: 0.85,
                calculus: 0.80,
                probability: 0.75,
                programming: 0.90,
                ml_basics: 0.50,
                data_preprocess: 0.60,
                linear_regression: 0.40,
                logistic_regression: 0.35,
                decision_tree: 0.30,
                svm: 0.25,
                neural_net: 0.20,
                deep_learning: 0.15,
                cnn: 0.10,
                rnn: 0.10,
                rl: 0.05,
            };
            for (const d of nodes) {
                d.mastery = initialMastery[d.id] || 0.5;
            }
            // 默认选中 ml_basics
            selectedId = 'ml_basics';
            computeRecommendations();
            updateOverallProgress();
            selectNode(selectedId);
            // 更新节点颜色
            nodeGroup.selectAll('g.node-group').select('circle.node-circle')
                .attr('fill', d => colorScale(d.mastery))
                .attr('r', d => d.id === selectedId ? 22 : 18);
            simulation.alpha(0.1).restart();
        }

        function simulateForget() {
            // 所有节点掌握度下降 0.02~0.06
            for (const d of nodes) {
                d.mastery = Math.max(0, d.mastery - (0.02 + Math.random() * 0.04));
            }
            computeRecommendations();
            updateOverallProgress();
            selectNode(selectedId);
            nodeGroup.selectAll('g.node-group').select('circle.node-circle')
                .attr('fill', d => colorScale(d.mastery))
                .attr('r', d => d.id === selectedId ? 22 : 18);
            simulation.alpha(0.1).restart();
        }

        // ============================================================
        // 6. 绑定UI事件
        // ============================================================
        document.getElementById('btn-learn').addEventListener('click', learnNode);
        document.getElementById('btn-reset').addEventListener('click', resetProgress);
        document.getElementById('btn-forget').addEventListener('click', simulateForget);

        // ============================================================
        // 7. 初始化
        // ============================================================
        // 初次计算推荐
        computeRecommendations();
        // 选中默认节点
        selectNode(selectedId);
        // 渲染图谱
        render();

        // 窗口resize时更新视图（简单处理）
        window.addEventListener('resize', () => {
            const w = container.clientWidth;
            const h = container.clientHeight;
            svg.attr('width', w).attr('height', h);
            simulation.force('center', d3.forceCenter(w / 2, h / 2));
            simulation.alpha(0.1).restart();
        });

        // 小提示：页面加载后，让模拟稳定
        console.log('🧠 NeuroMap 已启动！点击节点学习，系统自适应推荐。');
    </script>

</body>
