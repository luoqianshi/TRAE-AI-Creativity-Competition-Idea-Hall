<body>
  <main class="stage">
    <section class="intro">
      <div class="badge">TRAE AI 创造力大赛 · 可直接演示版本</div>
      <h1>恋习室手机 Demo</h1>
      <p class="lead">这个版本打开后就是一个可操作的手机 App 界面，适合报名展示和录屏。它模拟“帮我回一句”“测关系”“陪练”“风险识别”四个核心功能，让评委能直接看到产品怎么用。</p>
      <div class="points">
        <div class="point"><strong>像 App</strong><span>底部导航、聊天输入、场景切换。</span></div>
        <div class="point"><strong>能操作</strong><span>输入内容后可生成分析和回复。</span></div>
        <div class="point"><strong>好展示</strong><span>适合录制 30 秒到 1 分钟 Demo。</span></div>
      </div>
    </section>

    <section class="phone" aria-label="恋习室手机界面">
      <div class="screen">
        <div class="status">
          <span>9:41</span>
          <span>恋习室 Demo</span>
          <span>100%</span>
        </div>

        <header class="top">
          <div class="top-row">
            <div>
              <div class="app-name">恋习室</div>
              <div class="subtitle" id="subtitle">AI 恋爱沟通教练</div>
            </div>
            <div class="avatar">恋</div>
          </div>
        </header>

        <div class="chips" id="chips">
          <button class="chip active" data-scene="reply">帮我回一句</button>
          <button class="chip" data-scene="meaning">这句话什么意思</button>
          <button class="chip" data-scene="date">怎么约见面</button>
          <button class="chip" data-scene="risk">识别风险</button>
          <button class="chip" data-scene="fight">吵架修复</button>
        </div>

        <section class="content" id="content"></section>

        <div class="input-area">
          <textarea id="userInput" placeholder="输入你的聊天内容或恋爱问题"></textarea>
          <button class="send" onclick="sendMessage()">发</button>
        </div>

        <nav class="nav">
          <button class="active" data-tab="reply" onclick="switchTab('reply', this)"><span>💬</span>帮我回</button>
          <button data-tab="stage" onclick="switchTab('stage', this)"><span>💗</span>测关系</button>
          <button data-tab="practice" onclick="switchTab('practice', this)"><span>🎯</span>陪练</button>
          <button data-tab="risk" onclick="switchTab('risk', this)"><span>🛡</span>风险</button>
        </nav>

        <div class="toast" id="toast">已切换场景</div>
      </div>
    </section>
  </main>

  <script>
    const state = {
      scene: 'reply',
      tab: 'reply'
    };

    const examples = {
      reply: '他说：“最近有点忙，改天再说吧。”我该怎么回？',
      meaning: '她说：“哈哈可以啊，看情况吧。”这句话是不是不太想去？',
      date: '我想约喜欢的人周末吃饭，但怕太突然，也怕被拒绝。',
      risk: '他总说很喜欢我，但每次我想确认关系，他都说现在不是时候，还说如果我懂他就别逼他。',
      fight: '我们刚刚吵架了，我说话有点冲，现在想道歉但不知道怎么开口。',
      stage: '我们认识一个月，几乎每天聊天，见过两次面。她会主动分享生活，但约第三次见面时说最近累。',
      practice: '我想练习怎么约对方周末见面，语气自然一点。'
    };

    const subtitles = {
      reply: '把想说的话变得自然、不尴尬',
      stage: '判断关系阶段，减少内耗',
      practice: '模拟真实恋爱场景，练习表达',
      risk: '识别忽冷忽热、画饼和越界信号'
    };

    function $(id) {
      return document.getElementById(id);
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[char]);
    }

    function init() {
      $('content').innerHTML = `
        <div class="welcome">
          <h3>你好，我是恋习室</h3>
          <p>把你遇到的聊天、暧昧、约会或关系问题发给我。我会先帮你判断对方可能的情绪和关系信号，再给出自然、有边界的回复建议。</p>
        </div>
        <div class="bubble ai">可以直接点上方场景，也可以输入自己的真实问题。比如：“他说最近有点忙，改天再说吧，我该怎么回？”</div>
      `;
      $('userInput').value = examples.reply;
      bindChips();
    }

    function bindChips() {
      document.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('.chip').forEach(item => item.classList.remove('active'));
          chip.classList.add('active');
          state.scene = chip.dataset.scene;
          $('userInput').value = examples[state.scene];
          showToast('已填入示例');
        });
      });
    }

    function switchTab(tab, button) {
      state.tab = tab;
      state.scene = tab === 'stage' ? 'stage' : tab === 'practice' ? 'practice' : tab === 'risk' ? 'risk' : 'reply';
      document.querySelectorAll('.nav button').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      $('subtitle').textContent = subtitles[tab];
      $('userInput').value = examples[state.scene];
      renderTabIntro(tab);
      showToast('已切换到' + button.textContent.trim());
    }

    function renderTabIntro(tab) {
      const content = {
        reply: ['帮我回一句', '粘贴对方发来的话，恋习室会给你 3 种回复：自然版、温柔版、有边界版。'],
        stage: ['关系阶段判断', '根据聊天频率、主动性、见面情况和稳定投入，判断你们更像初识、好感、暧昧还是关系不清。'],
        practice: ['恋爱场景陪练', '选择一个场景，先练习怎么开口，再看恋习室给你的表达反馈。'],
        risk: ['恋爱风险识别', '当对方忽冷忽热、只说不做、情绪勒索或持续越界时，恋习室会提醒你保护边界。']
      }[tab];

      $('content').innerHTML = `
        <div class="welcome">
          <h3>${content[0]}</h3>
          <p>${content[1]}</p>
        </div>
        <div class="bubble ai">我已经帮你填了一个示例，你也可以改成自己的真实情况，然后点“发”。</div>
      `;
    }

    function detectRisk(text) {
      const high = ['威胁', '控制', '必须', '不准', '贬低', '打压', '转账', '隐私', '懂他就别逼', '别逼他'];
      const mid = ['忽冷忽热', '不是时候', '改天', '看情况', '很忙', '确认关系', '只说'];
      if (high.some(word => text.includes(word))) {
        return {
          level: '高风险',
          color: 'var(--red)',
          text: '出现了明显的控制、压力或越界信号。建议减少投入，保留边界，必要时停止沟通。'
        };
      }
      if (mid.some(word => text.includes(word))) {
        return {
          level: '中风险',
          color: 'var(--orange)',
          text: '存在模糊、回避或投入不稳定的信号。先不要连续追问，看对方后续是否有清晰行动。'
        };
      }
      return {
        level: '低风险',
        color: 'var(--green)',
        text: '暂时没有明显危险信号。可以自然表达，同时保留观察。'
      };
    }

    function makeAdvice(text) {
      const risk = detectRisk(text);
      let thought = '先别把一句话当成最终结论。更好的做法是给对方空间，同时用一句轻松、有边界的话把球放回对方手里。';
      let replies = [
        ['自然版', '好呀，那你先忙，等你空了再说。'],
        ['温柔版', '没关系，你先照顾好自己的节奏，我们之后再聊也可以。'],
        ['有边界版', '可以，你先忙。如果之后还想约，再告诉我就好。']
      ];

      if (state.scene === 'meaning') {
        thought = '这句话更像是保留余地，不一定是拒绝。重点不是猜，而是看对方后续是否主动补充时间和行动。';
        replies = [
          ['自然版', '好呀，那你方便的时候告诉我就行。'],
          ['轻松版', '可以，那我先不把行程写死，等你确定。'],
          ['有边界版', '没问题，如果时间不合适也可以直接说，我这边好安排。']
        ];
      }

      if (state.scene === 'date' || state.tab === 'practice') {
        thought = '邀约要具体、轻松、低压力。不要把一次见面说成关系测试，也要给对方拒绝空间。';
        replies = [
          ['自然版', '这周六你有空吗？我想去试试那家新店，如果你也感兴趣可以一起。'],
          ['轻松版', '周末要不要出来喝杯东西？不弄得太正式，就当放松一下。'],
          ['有边界版', '如果你这周不方便也没关系，我们可以之后再找时间。']
        ];
      }

      if (state.scene === 'fight') {
        thought = '吵架后的重点不是马上讲道理，而是先承认自己具体哪句话或行为让对方不舒服。';
        replies = [
          ['真诚版', '刚才我说话太冲了，这点我确实不对。'],
          ['修复版', '我的本意不是否定你，但表达方式让你不舒服了，对不起。'],
          ['沟通版', '如果你愿意，我们晚点再好好说，我会先听你感受。']
        ];
      }

      if (state.scene === 'risk' || state.tab === 'risk') {
        thought = '这里的重点不是继续哄对方，而是看对方是否尊重你的感受，是否愿意给出清晰、稳定的行动。';
        replies = [
          ['清醒版', '我理解你有顾虑，但我也需要清楚和稳定的关系表达。'],
          ['边界版', '如果暂时不能确认关系，我会先放慢投入，不再只靠承诺判断。'],
          ['停止内耗版', '我不想用压力换答案，但也不会一直停在模糊状态里。']
        ];
      }

      if (state.scene === 'stage' || state.tab === 'stage') {
        thought = '从描述看，你们可能处在“有好感但还未稳定推进”的阶段。建议观察对方是否愿意见面、是否主动补充安排，而不是只看聊天热度。';
        replies = [
          ['自然确认', '我感觉我们最近聊得还不错，也想多了解你。你这段时间还想继续见面吗？'],
          ['低压力', '如果你最近累，我们可以不急着约。等你状态好一点再说。'],
          ['有边界', '我挺珍惜这种相处，但也不想一直停在不清楚的状态里。']
        ];
      }

      return { risk, thought, replies };
    }

    function sendMessage() {
      const input = $('userInput');
      const text = input.value.trim();
      if (!text) {
        showToast('先输入一句话');
        return;
      }

      appendBubble(text, 'me');
      input.value = '';

      setTimeout(() => {
        const advice = makeAdvice(text);
        appendAdvice(advice);
      }, 360);
    }

    function appendBubble(text, who) {
      const div = document.createElement('div');
      div.className = 'bubble ' + who;
      div.innerHTML = escapeHtml(text);
      $('content').appendChild(div);
      scrollBottom();
    }

    function appendAdvice(advice) {
      const card = document.createElement('div');
      card.className = 'analysis-card';
      card.innerHTML = `
        <div class="risk-tag" style="color:${advice.risk.color}">● ${advice.risk.level}</div>
        <h4>恋习室分析</h4>
        <p>${advice.risk.text}</p>
        <div class="reply-option">
          <small>建议思路</small>
          ${advice.thought}
        </div>
        ${advice.replies.map(item => `
          <div class="reply-option">
            <small>${item[0]}</small>
            ${item[1]}
          </div>
        `).join('')}
      `;
      $('content').appendChild(card);
      scrollBottom();
    }

    function scrollBottom() {
      const content = $('content');
      content.scrollTop = content.scrollHeight;
    }

    function showToast(text) {
      const toast = $('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1200);
    }

    $('userInput').addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    init();
  </script>
</body>
</html>
