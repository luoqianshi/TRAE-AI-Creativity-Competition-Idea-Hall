<body>
<div class="container">
  <header>
    <h1>大A投资者认知合格性测试</h1>
    <div class="subtitle">—— 基于华源证券《投资方法论》策略会（2025版）——</div>
    <div style="font-size: 0.95em; color: #a0a0b0; line-height: 1.8; margin-top: 12px;">
      如果你不能用正确的框架看市场，你就无法理解市场为什么是这样。<br>
      本测试共 <b style="color:#ffc107">20 题</b>，每题 <b style="color:#ffc107">5 分</b>，满分 <b style="color:#ffc107">100 分</b>。<br>
      <span style="font-size: 0.9em; color: #888;">友情提示：别想靠「反套路」蒙答案，正确答案没规律。</span>

  </div>

  <div id="quiz"></div>

  <div class="submit-area">
    <button class="btn" id="submitBtn" onclick="submitQuiz()">提交测评，看看你的认知段位</button>
  </div>

  <footer>
    <div style="font-style: italic;">「景气度投资在A股市场自始至终就不太成立，少数有效的情况才是特例。」</div>
    <div style="margin-top: 12px; font-size: 0.85em;">本测试基于华源证券 2025 年投资方法论策略会报告内容，仅供学习交流</div>

<script>
const questions = [
  {
    q: '【第1关】决定一只股票到底值多少钱的最根本因素是什么？',
    options: [
      '这家公司未来三年利润能以多快速度增长',
      '公司最终能做多大加上你愿意等多久的耐心',
      '当下市场热度和北向资金每天净流入了多少',
      '同行业其他公司目前股价大致在什么水平',
    ],
    correct: 1,
    explanation: '报告核心推导：股票估值的底层逻辑是「空间叙事」而非增速。正确公式只有两个参数——天花板高度（这家公司最终能做到多大规模）和折现率（你愿意花多久等它兑现）。选项A是市场上最流行的PEG陷阱，报告明确批判它「既是陷阱又耽误赚钱」。'
  },
  {
    q: '【第2关】报告用"地心说→日心说"比喻投资框架，作者想表达啥？',
    options: [
      '科学方法一定比经验拍脑袋来得更准确',
      '只要不停给旧思路打补丁就能一直有效',
      '旧框架总需额外解释才能圆时就该换了',
      '不同理论殊途同归用哪种方法其实都一样',
    ],
    correct: 2,
    explanation: '报告开篇的灵魂比喻：地心说本来能解释很多现象，但为了拟合新观测必须不断加「本轮」——就像景气度投资不灵了之后，人们会把股票细分为大盘成长、周期成长、景气成长……不停打补丁。这恰恰说明框架本身已经失效，真正该做的是换一个新框架，而非原地加补丁。'
  },
  {
    q: '【第3关】某公司天花板从5倍降到3倍但增速反而更快了，PE会怎样？',
    options: [
      '一定会变低，天花板高度远比到达速度重要',
      '保持不变，因为折现率和资金成本没变化',
      '一定会变高，因为利润增速加快越涨越猛',
      '直接减半，因为时间缩短一倍估值也减半',
    ],
    correct: 0,
    explanation: '报告的数学推导：天花板5倍→PE约45.6倍（增速17.5%），天花板3倍→PE约31.0倍（但复合增速反而提高到24.6%）。这是报告最核心的反直觉陷阱——增速越快，PE反而可能越低，因为天花板高度才是估值的决定性变量，到达天花板的速度几乎不影响PE。按景气度投资逻辑「增速高就买」恰恰会掉进估值坍塌的大坑。'
  },
  {
    q: '【第4关】隆基股份上市以来涨了上百倍，报告到底怎么看这件事？',
    options: [
      '好公司就是好股票一直拿着就能赚大钱',
      '超额收益只出现在政策催化那几个节点',
      '业绩好才是硬道理利润涨多少股价涨多少',
      '光伏是未来方向行业永远涨买了就不会亏',
    ],
    correct: 1,
    explanation: '报告用大量图表还原了隆基的涨幅分布：真正的超额收益只集中在3个窗口期——2014-2015单晶替代多晶、2017年政策催化、2020-2021双碳共振。其余时间隆基的股价走势和沪深300几乎重合，哪怕业绩在高速增长。核心洞见：超额收益只发生在「故事变化」的那一瞬间，其余都是兑现预期的垃圾时间。'
  },
  {
    q: '【第5关】煤炭行业黄金12年利润涨了6倍，股价却没跑赢大盘，为什么？',
    options: [
      '市场完全无效对资源股存在系统性偏见',
      '供给侧改革才是煤炭股唯一的上涨动力',
      '大宗商品价格波动大股票就不可能上涨',
      '市场早把增长消化完了上市时已高估值',
    ],
    correct: 3,
    explanation: '报告颠覆性发现：2004年煤炭板块动态PE就高达32倍，意味着市场当时就给了「利润能增长6倍」的预期。之后12年利润真的增长了6倍，PE也恰好降到了约10倍。事前预期和事后结果精准对应——不是市场无效，恰恰是市场太有效了，它在一开始就把所有「黄金12年」的故事消化完了。你以为在买成长，其实在付成长的价格。'
  },
  {
    q: '【第6关】为什么同一家公司A股和H股股价差这么多？',
    options: [
      '两边市场的货币汇率不同导致了长期价差',
      'H股更便宜所以一定更值得买会涨回来',
      'A股投资者更不理性所以溢价会一直持续',
      '两边讲的故事不一样便宜不等于能上涨',
    ],
    correct: 3,
    explanation: '兖矿能源A/H对比案例的关键洞见：港股在2003-2004年实现了大幅超额收益（因为那时港股才开始「讲煤炭的故事」），但此后至今A/H走势完全重合。便宜不是上涨的理由——同一家公司两边讲的是不同的叙事，必须有催化剂（如电荒）让叙事收敛，才会产生超额收益，否则价差可以维持几十年。'
  },
  {
    q: '【第7关】煤价跌了4年煤电利润大增，为什么煤电没跑赢4年？',
    options: [
      '煤电是公用事业股涨不动是行业的属性',
      '市场对利好消化很快利空却要消化很久',
      '煤价下跌和煤电利润是镜像必须同步的',
      '周期股一旦下跌所有相关股票都得跌了',
    ],
    correct: 1,
    explanation: '报告的重要发现：2011年底至2016年初，煤价持续下跌，华能国际的利润确实大增，但它的超额收益只维持了9个月（2012年8月就见顶了）。而兖矿能源在同期跑输指数却长达2.5年。这揭示了市场对多空信息反应的不对称性——利好消化极快，利空消化极慢。简单的「镜像思维」（煤价跌→煤电涨）在股市上根本不成立。'
  },
  {
    q: '【第8关】茅台2004-2006年那波10倍行情最关键的信号是啥？',
    options: [
      '茅台的品牌效应确实比五粮液更强更好卖',
      '消费升级的趋势不可阻挡白酒永远是王',
      '净利润追上五粮液，故事才真正开始讲',
      '只要业绩好股价就会一直涨不用管估值',
    ],
    correct: 2,
    explanation: '报告经典案例：茅台在2004年净利润首次追上五粮液（这是「王位交接叙事」的起点信号），随后在2006年底飞天茅台批价追上普五（这是叙事结束、天花板兑现的终点信号）。整个10倍行情发生在这两个信号之间。之后茅台与五粮液、沪深300的走势高度重合——故事一旦讲完，哪怕业绩再好，也不会再有超额收益。'
  },
  {
    q: '【第9关】茅台2023年11月大幅上调出厂价后，股价会怎样？',
    options: [
      '批价没动就没新故事只是兑现已有预期',
      '出厂价大涨利润必增股价接下来肯定大涨',
      '外资最爱消费股外资加仓股价就会涨起来',
      '龙头股永远涨提价后就更应该长期持有了',
    ],
    correct: 0,
    explanation: '报告的经典陷阱：提价本身只是「兑现已有天花板」的动作，批价与出厂价的倍数关系没有变化——也就是说，对天花板高度的判断没有发生变化。报告发现：只有当批价本身变动（改变天花板叙事）时，才会影响PE和股价。出厂价上调带来的利润增长已经被现有估值消化完了，不产生超额收益。现实中茅台提价后高开就是这种「预期兑现」的典型表现。'
  },
  {
    q: '【第10关】报告发现茅台PE的走势和什么指标最一致？',
    options: [
      '茅台每个月的销量和营收增长的具体数据',
      '北向资金每天净买入茅台的股数到底有多少',
      '全国GDP增速和宏观货币政策的松紧程度',
      '飞天批价相对出厂价倍数关系的变化情况',
    ],
    correct: 3,
    explanation: '报告核心图表验证：茅台PE/沪深300PE的走势曲线，和「飞天批价/出厂价」的倍数曲线高度重合。批价代表了市场对茅台业绩天花板高度的判断，出厂价代表了当前业绩水平。批价上涨→天花板升高→PE应涨；出厂价上涨→只是提升当前业绩→PE不动甚至应降。这解释了为什么提价不一定推高股价。'
  },
  {
    q: '【第11关】五粮液、泸州老窖这类龙二龙三公司该怎么看？',
    options: [
      '估值比茅台低安全边际更高就更值得买',
      '跟着大哥涨跌同步，但跌的时候会更狠',
      '有自己独立的护城河不会受到茅台影响',
      '管理水平比茅台更好未来会弯道超车了',
    ],
    correct: 1,
    explanation: '报告的观点：五粮液和泸州老窖出厂价与批价之间差距不大，无法套用茅台「批价/出厂价比值」的估值锚定方法。它们的估值走势和茅台高度趋同——龙二龙三是「跟住大哥涨跌同步」。在行业上行期跟涨，但在行业进入调整期或平稳期后，涨跌同源——之前跟涨多的部分往往要吐出来，甚至跌得比茅台更狠。'
  },
  {
    q: '【第12关】长江电力这种"笨公司"为什么长期反而能跑赢？',
    options: [
      '有持续资产注入预期所以股价能一直涨',
      '高股息率吸引机构抱团所以股价不会跌',
      '牛市跟上熊市抗跌少犯错就是赢的多了',
      '垄断了水利资源，现金流无敌永远躺赢',
    ],
    correct: 2,
    explanation: '报告对长江电力的复盘：它的超额收益不是来自「永远涨」，而是发生在几次市场大跌的时期——2015年股灾、2018年熊市、2022年市场调整。在牛市期间长江电力的走势和指数基本一致。核心机制：跑赢不是因为你对的次数多，而是因为你错的次数少。只要牛市跟上指数、熊市别跌太狠，长期就能甩开大多数人。'
  },
  {
    q: '【第13关】报告警告"估值下跌但业绩还在涨"是常见陷阱，意思是？',
    options: [

      '只要增速够快PE下跌根本不用太担心',

    ],
    correct: 2,
    explanation: '报告最核心的数学陷阱：当市场对公司天花板高度的判断从「10年5倍」下修为「5年3倍」时，PE应当从45.6倍大幅降到31.0倍，但这期间公司的利润增速反而从17.5%提升到24.6%。如果你按传统景气度投资逻辑——「增速高就买、PEG便宜就买」——恰恰会在PE坍塌的过程中反复抄底、反复被套。A股市场在行业下行期最常见的就是这种错误。'

  },
  {

      '获取内幕消息和独家高频数据的核心能力',
      '交易速度快和算法水平高，占坑要够早',

    correct: 2,
    explanation: '报告结语观点：当信息过载成为常态，核心竞争力不再是「获取独家信息」——因为你能获取的信息别人也能获取。真正的阿尔法是「基于公开信息的定价能力」：对同样的公开数据、同样的财报、同样的新闻，你有不同的处理框架和判断结论。卷高频数据都是费用化支出，不能实现复利增长；只有认知框架的迭代才是资本化的积累。'
  },
  {

    options: [
      '技术指标金叉买死叉卖，做短线赚差价',
      '每天盯盘做高抛低吸，积少成多赚稳钱',
      '跟着龙虎榜机构席位买卖，跟庄来吃肉',
      '对天花板有信心时，按估值偏离做波段',
    ],
    correct: 3,
    explanation: '报告提供的「高级玩法」：首先你必须对公司的天花板高度有稳定的判断（比如茅台的天花板由批价表征）。在此前提下，如果个股PE相对于指数PE的比值偏离了批价比值曲线（说明是情绪波动而非基本面变化），就可以在偏离时做反向交易。核心前提是「你对天花板看得很准」——否则就是瞎猜的频繁交易。'
  },
  {
    q: '【第17关】报告反复强调不要假设"永续增长"，原因是？',
    options: [
      '任何行业都有上限不可能永远增长下去',
      '数学公式里的永续增长假设是不成立的',
      '永续增长会让估值无限大，太不靠谱了',

    ],
    correct: 0,
    explanation: '报告核心警示：任何行业的空间都不是无限大的，公司天花板可以理解为「潜力消耗殆尽、项目IRR刚好等于折现率」的时候。对于算不清天花板绝对值的行业（比如消费、医药），替代方法是寻找表征天花板相对高度的指标（如批价/出厂价比、渗透率斜率），而非用「永续增长」来假装自己算出了精确答案。永续增长本质上是在用数学掩盖无知。'

  {

      '没有壁垒的行业量再大也难转化为利润',
      '高科技的行业天生就该享受高估值溢价',
      '有政策支持的行业永远是朝阳不会出事',
    ],
    correct: 1,
    explanation: '报告对光伏的反思：新能源的需求可以由政策目标推算，这让市场很容易「算出空间」——但支撑估值的不仅是空间，还有壁垒。光伏行业的问题恰恰在于壁垒不高：一旦行业涌入大量产能，量的空间就很难转化为利润空间，估值会迅速坍塌。2021年后光伏产能严重过剩、股价持续跑输指数就是最典型的案例。空间好算不等于投资好做。'
  },
  {
    q: '【第19关】超额收益和业绩增长到底是什么关系？',
    options: [
      '业绩增速越快超额收益越高成正比关系',
      '公司ROE高就能持续带来稳定的超额收益',
      '只有当讲故事变了那一刻才有超额收益',
      '货币放水，景气度高的时候超额收益多',
    ],
    correct: 2,
    explanation: '报告贯穿全书的核心命题：股价=EPS×PE，但股价涨幅不能简单拆分为业绩增长和估值变化。正确的分类是——（1）折现率带来的必要收益率（时间的函数、与叙事无关）；（2）叙事变化带来的超额收益率（与时间无关、只在瞬间发生）。在叙事没有变化的区间内，无论业绩增速有多高，持有收益都只能等于折现率——你跑不赢指数。超额收益的本质是「市场重新讲故事了」。'
  },
  {
    q: '【第20关】把报告的投资方法论浓缩成一句话，应该是哪个？',
    options: [
      '景气度为王追高增速行业永远能赚大钱',
      '买便宜货低PE低PB长期持有就能赢',
      '技术分析最靠谱，趋势一旦形成就延续',
      '估值天花板和故事变化决定股票的收益',
    ],
    correct: 3,
    explanation: '报告的完整方法论框架：（1）PE的底层逻辑是「天花板高度」与「折现率」两个参数决定的空间叙事；（2）超额收益只来自「叙事变化」的发生瞬间；（3）操作方法是沙盘推演——先算清各情景下的绝对位置，再密切跟踪关键信号；（4）卷高频数据、追逐景气度、长链条推理都是低效率甚至反效果的方法。A股市场奖励的是理解规则并迭代的人，而非重复老路的人。'
  },

let userAnswers = new Array(questions.length).fill(null);
let submitted = false;

function renderQuiz() {
  const quizEl = document.getElementById('quiz');
  let html = '';
  questions.forEach((q, idx) => {
    html += '<div class="question-card" id="qcard-' + idx + '">';
    html += '<div class="question-number">第 ' + (idx + 1) + ' 题 / 5 分</div>';
    html += '<div class="question-text">' + q.q + '</div>';
    html += '<div class="options">';
    q.options.forEach((opt, optIdx) => {
      html += '<div class="option" onclick="selectOption(' + idx + ', ' + optIdx + ')">';
      html += '<span class="option-letter">' + String.fromCharCode(65 + optIdx) + '</span>' + opt;
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="explanation" id="expl-' + idx + '"><b style="color:#4caf50;">✓ 正确答案：' + String.fromCharCode(65 + q.correct) + '</b><br><br>' + q.explanation + '</div>';
    html += '</div>';
  });
  quizEl.innerHTML = html;
}

function selectOption(qIdx, optIdx) {
  if (submitted) return;
  userAnswers[qIdx] = optIdx;
  const card = document.getElementById('qcard-' + qIdx);
  const options = card.querySelectorAll('.option');
  options.forEach((o, i) => {
    if (i === optIdx) o.classList.add('selected');
    else o.classList.remove('selected');
  });
  updateProgress();
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  document.getElementById('answered').textContent = answered;
  document.getElementById('progressFill').style.width = (answered / questions.length * 100) + '%';
}

function submitQuiz() {
  const answered = userAnswers.filter(a => a !== null).length;
  if (answered < questions.length) {
    if (!confirm('你还有 ' + (questions.length - answered) + ' 道题没有作答，确定要提交吗？')) return;
  }
  submitted = true;
  let score = 0;
  questions.forEach((q, idx) => {
    const correctIdx = q.correct;
    const userAns = userAnswers[idx];
    const card = document.getElementById('qcard-' + idx);
    const options = card.querySelectorAll('.option');
    options.forEach((o, i) => {
      o.style.pointerEvents = 'none';
      if (i === correctIdx) o.classList.add('correct');
      if (i === userAns && userAns !== correctIdx) o.classList.add('wrong');
    });
    if (userAns === correctIdx) score += 5;
    document.getElementById('expl-' + idx).classList.add('show');
  });

  document.getElementById('finalScore').textContent = score + ' / 100';
  let message = '', emoji = '', detail = '';
  const correctCount = score / 5;
  if (score >= 95) {
    emoji = '🏆';
    message = '恭喜你达到了大A投资者的优异认知水平！';
    detail = '你答对了 ' + correctCount + ' / 20 题。你的投资认知已经超越了大多数市场参与者——你理解了叙事驱动估值的本质，不再被景气度陷阱迷惑。市场永远奖励理解规则迭代的人。';
  } else if (score >= 90) {
    emoji = '🎉';
    message = '恭喜你顺利通过了大A投资者的认知合格性测试！';
    detail = '你答对了 ' + correctCount + ' / 20 题。你的框架基本正确，但个别认知误区仍可能让你在关键节点做出错误决策。建议复盘错题，再巩固一遍核心逻辑。';
  } else {
    emoji = '🤔';
    message = '不会吧？再答一次！我不相信这是你的实力！';
    if (score >= 75) {
      detail = '你答对了 ' + correctCount + ' / 20 题。你已经接触到了新框架，但旧有的景气度/PEG思维惯性仍在影响你的判断。记住：天花板高度才是估值的关键，而不是增速。';
    } else if (score >= 50) {
      detail = '你答对了 ' + correctCount + ' / 20 题。你仍在用传统框架（PEG/景气度/追热点）看市场。强烈建议你重新阅读报告前几章的数学推导——PE的底层逻辑是空间叙事。';
    } else {
      detail = '你答对了 ' + correctCount + ' / 20 题。你的认知框架与报告所批判的旧范式高度重合。请务必记住：景气度投资在A股市场自始至终不太成立。换一个框架看市场，也许你会看到完全不同的风景。';
    }
  }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultMessage').textContent = message;
  document.getElementById('resultDetail').textContent = detail;
  document.getElementById('resultPanel').classList.add('show');
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  userAnswers = new Array(questions.length).fill(null);
  submitted = false;
  document.getElementById('resultPanel').classList.remove('show');
  document.getElementById('submitBtn').disabled = false;
  renderQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderQuiz();
</script>
