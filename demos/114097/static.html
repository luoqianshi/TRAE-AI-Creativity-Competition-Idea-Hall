<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>饮品记录 - 健康管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    body { font-family: 'Noto Sans SC', sans-serif; }
    .sidebar-active { background-color: #f0fdf4; color: #16a34a; }
    .sidebar-active svg { stroke: #16a34a; }
    .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .modal-overlay { background: rgba(0,0,0,0.5); }
    .chart-bar { transition: height 0.3s ease; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app"></div>

  <script>
    const stores = {
      beverages: [
        { id: '1', name: '白开水', category: 'water', brand: '', caloriesPer100ml: 0, sugarPer100ml: 0, icon: 'droplets' },
        { id: '2', name: '绿茶', category: 'tea', brand: '', caloriesPer100ml: 1, sugarPer100ml: 0, icon: 'leaf' },
        { id: '3', name: '红茶', category: 'tea', brand: '', caloriesPer100ml: 2, sugarPer100ml: 0, icon: 'leaf' },
        { id: '4', name: '伯牙绝弦', category: 'milk-tea', brand: '霸王茶姬', caloriesPer100ml: 45, sugarPer100ml: 5.2, icon: 'coffee' },
        { id: '5', name: '桂馥兰香', category: 'milk-tea', brand: '霸王茶姬', caloriesPer100ml: 38, sugarPer100ml: 4.8, icon: 'coffee' },
        { id: '6', name: '伯牙绝弦（无糖）', category: 'milk-tea', brand: '霸王茶姬', caloriesPer100ml: 25, sugarPer100ml: 0.5, icon: 'coffee' },
        { id: '7', name: '拿铁', category: 'coffee', brand: '星巴克', caloriesPer100ml: 35, sugarPer100ml: 2.5, icon: 'coffee' },
        { id: '8', name: '美式咖啡', category: 'coffee', brand: '星巴克', caloriesPer100ml: 5, sugarPer100ml: 0, icon: 'coffee' },
        { id: '9', name: '星冰乐', category: 'coffee', brand: '星巴克', caloriesPer100ml: 65, sugarPer100ml: 8.5, icon: 'coffee' },
        { id: '10', name: '手打柠檬茶', category: 'fruit-tea', brand: '爷爷不泡茶', caloriesPer100ml: 28, sugarPer100ml: 4.2, icon: 'cup-soda' },
        { id: '11', name: '草莓啵啵', category: 'fruit-tea', brand: '爷爷不泡茶', caloriesPer100ml: 52, sugarPer100ml: 7.8, icon: 'cup-soda' },
        { id: '12', name: '橙C美式', category: 'coffee', brand: '库迪咖啡', caloriesPer100ml: 22, sugarPer100ml: 3.5, icon: 'coffee' },
        { id: '13', name: '生椰拿铁', category: 'coffee', brand: '库迪咖啡', caloriesPer100ml: 42, sugarPer100ml: 5.0, icon: 'coffee' },
        { id: '14', name: '苹果汁', category: 'juice', brand: '', caloriesPer100ml: 45, sugarPer100ml: 10.5, icon: 'apple' },
        { id: '15', name: '橙汁', category: 'juice', brand: '', caloriesPer100ml: 47, sugarPer100ml: 11.2, icon: 'citrus' },
        { id: '16', name: '纯牛奶', category: 'milk-tea', brand: '', caloriesPer100ml: 60, sugarPer100ml: 4.8, icon: 'milk' },
        { id: '17', name: '无糖酸奶', category: 'milk-tea', brand: '', caloriesPer100ml: 35, sugarPer100ml: 1.5, icon: 'milk' },
        { id: '18', name: '可乐', category: 'juice', brand: '', caloriesPer100ml: 42, sugarPer100ml: 10.6, icon: 'cup-soda' },
        { id: '19', name: '雪碧', category: 'juice', brand: '', caloriesPer100ml: 40, sugarPer100ml: 10.0, icon: 'cup-soda' },
        { id: '20', name: '脉动', category: 'juice', brand: '', caloriesPer100ml: 25, sugarPer100ml: 6.0, icon: 'cup-soda' },
      ],
      records: [],
      user: { calorieGoal: 2000, sugarGoal: 50 },
      currentPage: 'home'
    };

    const categories = {
      water: { name: '水', color: 'text-blue-500', bg: 'bg-blue-50' },
      tea: { name: '茶', color: 'text-green-600', bg: 'bg-green-50' },
      'milk-tea': { name: '奶茶', color: 'text-amber-600', bg: 'bg-amber-50' },
      'fruit-tea': { name: '果茶', color: 'text-pink-500', bg: 'bg-pink-50' },
      coffee: { name: '咖啡', color: 'text-brown-600', bg: 'bg-brown-50' },
      juice: { name: '果汁', color: 'text-orange-500', bg: 'bg-orange-50' }
    };

    const brands = ['霸王茶姬', '星巴克', '爷爷不泡茶', '库迪咖啡', '其他'];

    const generateMockRecords = () => {
      const records = [];
      const today = new Date();
      for (let i = 29; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        const dayBeverages = Math.floor(Math.random() * 4) + 1;
        for (let j = 0; j < dayBeverages; j++) {
          const beverage = stores.beverages[Math.floor(Math.random() * stores.beverages.length)];
          const amount = Math.floor(Math.random() * 200) + 200;
          records.push({
            id: `${dateStr}-${j}`,
            beverageId: beverage.id,
            amount,
            consumedAt: dateStr + 'T' + String(Math.floor(Math.random() * 24)).padStart(2, '0') + ':00:00',
            note: ''
          });
        }
      }
      return records;
    };

    const getRecordsWithBeverages = () => {
      return stores.records.map(record => ({
        ...record,
        beverage: stores.beverages.find(b => b.id === record.beverageId) || stores.beverages[0]
      }));
    };

    const getTodayRecords = () => {
      const today = new Date().toISOString().split('T')[0];
      return getRecordsWithBeverages().filter(r => r.consumedAt.startsWith(today));
    };

    const getWeeklyStats = () => {
      const stats = [];
      const records = getRecordsWithBeverages();
      for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        const dayRecords = records.filter(r => r.consumedAt.startsWith(dateStr));
        const dayStats = dayRecords.reduce((acc, r) => ({
          calories: acc.calories + (r.beverage.caloriesPer100ml * r.amount) / 100,
          sugar: acc.sugar + (r.beverage.sugarPer100ml * r.amount) / 100
        }), { calories: 0, sugar: 0 });
        stats.push({ date: dateStr, ...dayStats });
      }
      return stats;
    };

    const getMonthlyStats = () => {
      const stats = [];
      const records = getRecordsWithBeverages();
      for (let i = 29; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        const dateStr = date.toISOString().split('T')[0];
        const dayRecords = records.filter(r => r.consumedAt.startsWith(dateStr));
        const dayStats = dayRecords.reduce((acc, r) => ({
          calories: acc.calories + (r.beverage.caloriesPer100ml * r.amount) / 100,
          sugar: acc.sugar + (r.beverage.sugarPer100ml * r.amount) / 100
        }), { calories: 0, sugar: 0 });
        stats.push({ date: dateStr, ...dayStats });
      }
      return stats;
    };

    const getTodayStats = () => {
      const records = getTodayRecords();
      return records.reduce((acc, r) => ({
        calories: acc.calories + (r.beverage.caloriesPer100ml * r.amount) / 100,
        sugar: acc.sugar + (r.beverage.sugarPer100ml * r.amount) / 100,
        count: acc.count + 1,
        totalAmount: acc.totalAmount + r.amount
      }), { calories: 0, sugar: 0, count: 0, totalAmount: 0 });
    };

    const formatNumber = (num) => Math.round(num);
    const formatDate = (dateStr) => {
      const date = new Date(dateStr);
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      return `${month}月${day}日 ${weekDays[date.getDay()]}`;
    };

    const icons = {
      droplets: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.24-1.71-3.03S7.7 7.75 7 7.75c-.7 0-1.45.37-1.79 1.2-.43 1.15-.16 2.35.54 3.27 1.14.79 1.71 1.87 1.71 3.03 0 2.22-1.8 4.05-4 4.05S3 14.47 3 12.25c0-3.56 3.07-6.44 6.85-6.44C13.93 5.81 17 8.69 17 12.25c0 2.22-1.8 4.05-4 4.05z"/></svg>',
      leaf: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.53 12 13 13 12"/></svg>',
      coffee: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M15 2v4h4"/></svg>',
      'cup-soda': '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v11"/><path d="M16 12l-4 4-4-4"/><path d="M12 22v-5"/></svg>',
      apple: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 8.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-2.08 4.94 2.5 2.5 0 0 0 4.96.46 2.5 2.5 0 0 0 2.08-4.94Z"/><path d="M7.5 15.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-2.08 4.94 2.5 2.5 0 0 0 4.96.46 2.5 2.5 0 0 0 2.08-4.94Z"/><path d="M12 2C9 2 5 6 5 12s3 10 5 10c2 0 5-4 5-10S15 2 12 2Z"/></svg>',
      citrus: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M16 13h-4"/><path d="M14 17h2"/></svg>',
      milk: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      home: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      barChart3: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M9 18V9"/><path d="M15 18V5"/><path d="M21 18v-2"/></svg>',
      bookOpen: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
      settings: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>',
      plus: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
      x: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
      trash2: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
      check: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
      copy: '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
      report: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>'
    };

    let addModalOpen = false;
    let reportModalOpen = false;
    let searchQuery = '';
    let filterCategory = '';
    let filterBrand = '';
    let newBeverage = { name: '', category: 'water', brand: '', calories: '', sugar: '' };
    let addAmount = 250;
    let selectedBeverageId = '';
    let timeRange = 'week';

    const renderSidebar = () => {
      const pages = [
        { id: 'home', name: '首页', icon: 'home' },
        { id: 'analysis', name: '分析', icon: 'barChart3' },
        { id: 'library', name: '饮品库', icon: 'bookOpen' },
        { id: 'settings', name: '设置', icon: 'settings' }
      ];
      return `
        <div class="w-64 bg-white border-r border-gray-200 flex flex-col h-screen sticky top-0">
          <div class="p-6 border-b border-gray-100">
            <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
              ${icons.coffee} 饮品记录
            </h1>
          </div>
          <nav class="flex-1 p-4 space-y-2">
            ${pages.map(p => `
              <button onclick="setPage('${p.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors ${stores.currentPage === p.id ? 'sidebar-active' : 'text-gray-600 hover:bg-gray-50'}">
                ${icons[p.icon]}
                <span>${p.name}</span>
              </button>
            `).join('')}
          </nav>
        </div>
      `;
    };

    const renderHeader = () => {
      const titles = { home: '今日记录', analysis: '健康分析', library: '饮品库', settings: '设置' };
      return `
        <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-gray-800">${titles[stores.currentPage]}</h2>
          ${stores.currentPage === 'home' ? `
            <button onclick="openAddModal()" class="flex items-center gap-2 bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition-colors">
              ${icons.plus} 添加记录
            </button>
          ` : ''}
        </header>
      `;
    };

    const renderHome = () => {
      const stats = getTodayStats();
      const records = getTodayRecords();
      return `
        <div class="p-6 space-y-6">
          <div class="grid grid-cols-4 gap-4">
            <div class="glass-card rounded-xl p-4 border border-gray-100">
              <div class="text-gray-500 text-sm">今日杯数</div>
              <div class="text-2xl font-bold text-gray-800 mt-1">${stats.count}</div>
              <div class="text-gray-400 text-xs mt-1">杯</div>
            </div>
            <div class="glass-card rounded-xl p-4 border border-gray-100">
              <div class="text-gray-500 text-sm">总热量</div>
              <div class="text-2xl font-bold text-orange-500 mt-1">${formatNumber(stats.calories)}</div>
              <div class="text-gray-400 text-xs mt-1">/ ${stores.user.calorieGoal} kcal</div>
              <div class="w-full bg-gray-100 rounded-full h-2 mt-2">
                <div class="bg-orange-500 h-2 rounded-full" style="width: ${Math.min(100, (stats.calories / stores.user.calorieGoal) * 100)}%"></div>
              </div>
            </div>
            <div class="glass-card rounded-xl p-4 border border-gray-100">
              <div class="text-gray-500 text-sm">总糖分</div>
              <div class="text-2xl font-bold text-red-500 mt-1">${formatNumber(stats.sugar)}</div>
              <div class="text-gray-400 text-xs mt-1">/ ${stores.user.sugarGoal} g</div>
              <div class="w-full bg-gray-100 rounded-full h-2 mt-2">
                <div class="bg-red-500 h-2 rounded-full" style="width: ${Math.min(100, (stats.sugar / stores.user.sugarGoal) * 100)}%"></div>
              </div>
            </div>
            <div class="glass-card rounded-xl p-4 border border-gray-100">
              <div class="text-gray-500 text-sm">总容量</div>
              <div class="text-2xl font-bold text-blue-500 mt-1">${formatNumber(stats.totalAmount)}</div>
              <div class="text-gray-400 text-xs mt-1">ml</div>
            </div>
          </div>
          <div class="glass-card rounded-xl border border-gray-100">
            <div class="p-4 border-b border-gray-100">
              <h3 class="font-semibold text-gray-800">今日记录</h3>
            </div>
            <div class="divide-y divide-gray-50">
              ${records.length === 0 ? `
                <div class="p-8 text-center text-gray-400">
                  暂无记录，点击上方按钮添加
                </div>
              ` : records.map(r => `
                <div class="p-4 flex items-center justify-between hover:bg-gray-50">
                  <div class="flex items-center gap-3">
                    <div class="${categories[r.beverage.category]?.bg || 'bg-gray-100'} ${categories[r.beverage.category]?.color || 'text-gray-600'} p-2 rounded-lg">
                      ${icons[r.beverage.icon] || icons.coffee}
                    </div>
                    <div>
                      <div class="font-medium text-gray-800">${r.beverage.name}</div>
                      <div class="text-sm text-gray-500">${r.beverage.brand || '无品牌'} · ${r.amount}ml</div>
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-sm text-orange-500">${formatNumber((r.beverage.caloriesPer100ml * r.amount) / 100)} kcal</div>
                    <div class="text-xs text-red-500">${formatNumber((r.beverage.sugarPer100ml * r.amount) / 100)}g 糖</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    };

    const renderAnalysis = () => {
      const stats = timeRange === 'week' ? getWeeklyStats() : getMonthlyStats();
      const totalCalories = stats.reduce((acc, s) => acc + s.calories, 0);
      const totalSugar = stats.reduce((acc, s) => acc + s.sugar, 0);
      const daysCount = stats.length;
      const avgDailyCalories = totalCalories / daysCount;
      const avgDailySugar = totalSugar / daysCount;
      const maxCalories = Math.max(...stats.map(s => s.calories), 1);
      const maxSugar = Math.max(...stats.map(s => s.sugar), 1);

      return `
        <div class="p-6 space-y-6">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <button onclick="setTimeRange('week')" class="px-4 py-2 rounded-lg ${timeRange === 'week' ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">本周</button>
              <button onclick="setTimeRange('month')" class="px-4 py-2 rounded-lg ${timeRange === 'month' ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">本月</button>
            </div>

    const renderReportModal = () => {
      if (!reportModalOpen) return '';
      const stats = timeRange === 'week' ? getWeeklyStats() : getMonthlyStats();
      const totalCalories = stats.reduce((acc, s) => acc + s.calories, 0);
      const totalSugar = stats.reduce((acc, s) => acc + s.sugar, 0);
      const daysCount = stats.length;
      const avgDailyCalories = totalCalories / daysCount;
      const avgDailySugar = totalSugar / daysCount;
      const exceededCaloriesDays = stats.filter(s => s.calories > stores.user.calorieGoal).length;
      const exceededSugarDays = stats.filter(s => s.sugar > stores.user.sugarGoal).length;
      const categoryCounts = {};
      getRecordsWithBeverages().filter(r => {
        const date = r.consumedAt.split('T')[0];
        return timeRange === 'week' 
          ? new Date(date) >= new Date(Date.now() - 7 * 24 * 60 * 60 * 1000)
          : new Date(date) >= new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);
      }).forEach(r => {
        categoryCounts[r.beverage.category] = (categoryCounts[r.beverage.category] || 0) + 1;
      });
      const topCategory = Object.entries(categoryCounts).sort((a, b) => b[1] - a[1])[0];
      const score = Math.max(0, Math.round(100 - (avgDailyCalories / stores.user.calorieGoal) * 30 - (avgDailySugar / stores.user.sugarGoal) * 40));
      const suggestions = [];
      if (avgDailySugar > stores.user.sugarGoal * 0.8) suggestions.push('建议减少含糖饮料的摄入，多喝水或无糖茶');
      if (avgDailyCalories > stores.user.calorieGoal * 0.8) suggestions.push('注意控制热量摄入，选择低热量饮品');
      if (exceededCaloriesDays > daysCount * 0.5) suggestions.push('近期热量摄入超标较多，建议调整饮食结构');
      if (suggestions.length === 0) suggestions.push('保持得很好！继续坚持健康的饮用习惯');

      const reportText = `
${timeRange === 'week' ? '本周' : '本月'}健康报告

📊 基本数据
- 报告周期：${daysCount}天
- 总热量摄入：${formatNumber(totalCalories)} kcal
- 总糖分摄入：${formatNumber(totalSugar)} g
- 日均热量：${formatNumber(avgDailyCalories)} kcal
- 日均糖分：${formatNumber(avgDailySugar)} g

🎯 目标对比
- 热量目标：${stores.user.calorieGoal} kcal/天
- 糖分目标：${stores.user.sugarGoal} g/天
- 热量超标天数：${exceededCaloriesDays}天
- 糖分超标天数：${exceededSugarDays}天

👆 饮用偏好
- 最常饮用：${topCategory ? categories[topCategory[0]]?.name + ' (' + topCategory[1] + '次)' : '暂无数据'}

💡 健康建议
${suggestions.map(s => '- ' + s).join('\n')}

🏥 健康评分：${score}分 (满分100分)

        consumedAt: new Date().toISOString(),
        note: ''
      });
      closeAddModal();
      setPage('home');

      stores.beverages.push({
        id: Date.now().toString(),

        alert('报告已复制到剪贴板！');

    };

      if (confirm('确定要清除所有数据吗？此操作不可恢复。')) {
        stores.records = [];

    const renderApp = () => {
      const content = {
        home: renderHome(),
        analysis: renderAnalysis(),
        library: renderLibrary(),

      };
      document.getElementById('app').innerHTML = `
        <div class="flex min-h-screen bg-gray-50">
          ${renderSidebar()}
          <div class="flex-1 flex flex-col overflow-hidden">
            ${renderHeader()}
            <main class="flex-1 overflow-y-auto">
              ${content[stores.currentPage]}
            </main>
          </div>
          ${renderAddModal()}
          ${renderReportModal()}
        </div>
      `;
    };

    stores.records = generateMockRecords();
    renderApp();
  </script>
</body>
