<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>广场故事详情 - 监护人</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
  :root {
    --primary: #5b6cf9; --primary-dark: #4a5de0; --primary-light: #e8eaf6;
    --accent: #ff6b6b; --warm: #ff9a56; --bg: #f8f9fc; --white: #ffffff;
    --text: #1a1a2e; --text-secondary: #6b7280; --text-light: #9ca3af;
    --border: #e5e7eb; --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.08); --radius-sm: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 80px; overflow-x: hidden;
  }
  .top-nav { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 16px 20px 24px; }
  .nav-row { display: flex; align-items: center; gap: 12px; }
  .nav-back { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; cursor: pointer; text-decoration: none; flex-shrink: 0; }
  .nav-title { color: #fff; font-size: 17px; font-weight: 600; flex: 1; }
  .nav-action { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; cursor: pointer; border: none; }
  .detail-section { padding: 0 20px; }
  .cover-img { width: 100%; height: 220px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 16px; }
  .detail-tags { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .mood-tag { padding: 4px 12px; border-radius: 14px; font-size: 12px; font-weight: 600; }
  .mood-tag.happy { background: #e8f5e9; color: #4caf50; }
  .mood-tag.calm { background: #e3f2fd; color: #2196f3; }
  .mood-tag.excited { background: #fff3e0; color: #ff9800; }
  .mood-tag.sad { background: #fce4ec; color: #e91e63; }
  .anon-badge { padding: 4px 12px; border-radius: 14px; font-size: 12px; font-weight: 600; background: #f3e5f5; color: #9c27b0; }
  .detail-meta { font-size: 12px; color: var(--text-light); }
  .audio-bar {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: var(--primary-light); border-radius: 12px; margin: 16px 0;
  }
  .audio-bar .play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .audio-bar .audio-info { flex: 1; }
  .audio-bar .audio-info .audio-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .audio-bar .audio-info .audio-dur { font-size: 11px; color: var(--text-light); }
  .audio-bar .audio-progress { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; }
  .audio-bar .audio-progress-fill { height: 100%; width: 35%; background: var(--primary); border-radius: 2px; }
  .detail-content { font-size: 14px; color: var(--text); line-height: 1.8; margin-bottom: 20px; }
  .detail-content p { margin-bottom: 12px; }
  .like-section { text-align: center; padding: 20px 0; border-top: 1px solid var(--border); }
  .like-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 32px;
    border-radius: 24px; border: 2px solid var(--accent); background: var(--white);
    font-size: 15px; font-weight: 600; color: var(--accent); cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .like-btn:hover { background: var(--accent); color: #fff; }
  .like-btn.liked { background: var(--accent); color: #fff; }
  .like-btn i { font-size: 18px; }
  .comment-section { padding: 20px 0 0; }
  .comment-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .comment-item { display: flex; gap: 12px; margin-bottom: 16px; }
  .comment-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .comment-body { flex: 1; }
  .comment-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .comment-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .comment-time { font-size: 11px; color: var(--text-light); margin-top: 4px; }
  .comment-input-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; background: var(--white);
    padding: 12px 20px; border-top: 1px solid var(--border);
    box-shadow: 0 -4px 16px var(--shadow-sm); z-index: 100;
    display: flex; gap: 10px; align-items: center;
  }
  .comment-input-bar input {
    flex: 1; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 20px;
    font-size: 14px; font-family: inherit; color: var(--text); outline: none;
  }
  .comment-input-bar input:focus { border-color: var(--primary); }
  .comment-input-bar button {
    width: 40px; height: 40px; border-radius: 50%; background: var(--primary);
    color: #fff; border: none; font-size: 16px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .detail-section { animation: fadeInUp 0.5s ease 0.1s both; }
</style>
</head>
<body>
<div class="top-nav">
  <div class="nav-row">
    <a href="square.html" class="nav-back"><i class="fas fa-arrow-left"></i></a>
    <div class="nav-title">故事详情</div>
    <button class="nav-action" onclick="alert('分享（演示）')"><i class="fas fa-share-alt"></i></button>
  </div>
</div>
<div class="detail-section" id="detailContent"></div>
<div class="comment-input-bar">
  <input type="text" placeholder="写评论..." id="commentInput" onkeydown="if(event.key==='Enter')sendComment()">
  <button onclick="sendComment()"><i class="fas fa-paper-plane"></i></button>
</div>
<script src="../shared/voice-assistant.js"></script>
<script>
var posts = [
  { id:0, title:'今天在公园和小狗玩', content:'今天天气特别好，妈妈带我去了公园。刚到门口就看到一只棕色的小狗，它摇着尾巴朝我跑过来。我蹲下来摸了摸它的头，它就一直跟着我。后来我们玩了扔球游戏，小狗每次都能把球叼回来，特别聪明！妈妈说下次可以带小狗来家里玩，我开心极了！', cover:'https://picsum.photos/seed/childplay/400/250.jpg', mood:'happy', moodLabel:'开心', author:'小明', date:'2小时前', likes:12, anon:false, hasVoice:true },
  { id:1, title:'画了一幅彩虹', content:'今天美术课上老师教我们画彩虹。我用红色、橙色、黄色、绿色、蓝色、靛色和紫色，画了一道大大的彩虹。老师说我用色很大胆，画得越来越好看了。我还在彩虹下面画了小花和小草，整幅画特别漂亮。', cover:'https://picsum.photos/seed/childpaint/400/250.jpg', mood:'excited', moodLabel:'激动', author:'小红', date:'5小时前', likes:18, anon:false, hasVoice:true },
  { id:2, title:'和老朋友下棋', content:'今天天气晴朗，我照常去了公园。老李已经在石桌旁等着了，我们下了三盘棋，我赢了两盘。下完棋后我们坐在长椅上聊天，聊到了年轻时候的事情。老李说他孙子也喜欢下棋，下次带来一起下。', cover:'https://picsum.photos/seed/grandpa/400/250.jpg', mood:'calm', moodLabel:'平静', author:'爷爷', date:'昨天', likes:24, anon:false, hasVoice:false },
  { id:3, title:'全家一起去野餐', content:'这个周末天气特别好，我们全家决定去郊外野餐。我准备了三明治、水果和果汁。小明和小红在草地上跑来跑去，爷爷坐在树下看书。我们拍了好多照片，是一段很美好的回忆。', cover:'https://picsum.photos/seed/family/400/250.jpg', mood:'happy', moodLabel:'开心', author:'匿名用户', date:'2天前', likes:31, anon:true, hasVoice:true },
  { id:4, title:'学了一首新歌', content:'音乐老师教了一首关于春天的歌，旋律特别优美。我很快就学会了，回家后唱给爷爷听，爷爷说我唱得真好听，还让我再唱一遍。', cover:'https://picsum.photos/seed/sing/400/250.jpg', mood:'excited', moodLabel:'激动', author:'小红', date:'3天前', likes:9, anon:false, hasVoice:false },
  { id:5, title:'想起了年轻时候的事', content:'今天收拾房间时翻到了一张老照片，是年轻时候和工友们在工厂门口拍的。那时候大家都年轻，充满干劲。照片里的我已经头发乌黑，精神抖擞。时间过得真快啊。', cover:'https://picsum.photos/seed/oldphoto/400/250.jpg', mood:'calm', moodLabel:'平静', author:'爷爷', date:'4天前', likes:42, anon:false, hasVoice:true }
];
var comments = [
  { avatar: '\uD83D\uDC67', name: '小花妈妈', text: '写得真好，小朋友太可爱了！', time: '1小时前' },
  { avatar: '\uD83D\uDC74', name: '老张', text: '下棋好！我也喜欢下棋。', time: '3小时前' },
  { avatar: '\uD83D\uDC69', name: '温柔的风', text: '好温馨的家庭故事~', time: '5小时前' }
];

var params = new URLSearchParams(window.location.search);
var id = parseInt(params.get('id')) || 0;
var post = posts[id] || posts[0];
var liked = false;

function render() {
  var html =
    '<img class="cover-img" src="'+post.cover+'" alt="封面">' +
    '<div class="detail-tags">' +
    '<span class="mood-tag '+post.mood+'">'+post.moodLabel+'</span>' +
    (post.anon ? '<span class="anon-badge"><i class="fas fa-user-secret"></i> 匿名</span>' : '') +
    '</div>' +
    '<div class="detail-meta"><i class="fas fa-user"></i> '+post.author+' · <i class="fas fa-clock"></i> '+post.date+'</div>' +
    (post.hasVoice ? '<div class="audio-bar"><button class="play-btn" onclick="alert(\'播放配音（演示）\')"><i class="fas fa-play"></i></button><div class="audio-info"><div class="audio-title">AI配音朗读</div><div class="audio-dur">02:35</div><div class="audio-progress"><div class="audio-progress-fill"></div></div></div></div>' : '') +
    '<div class="detail-content">'+post.content.split('\n').map(function(p){ return '<p>'+p+'</p>'; }).join('')+'</div>' +
    '<div class="like-section"><button class="like-btn'+(liked?' liked':'')+'" onclick="toggleLike()" id="likeBtn"><i class="fas fa-heart"></i> <span id="likeCount">'+post.likes+'</span></button></div>' +
    '<div class="comment-section"><h3>评论 ('+comments.length+')</h3>' +
    comments.map(function(c) {
      return '<div class="comment-item"><div class="comment-avatar">'+c.avatar+'</div><div class="comment-body"><div class="comment-name">'+c.name+'</div><div class="comment-text">'+c.text+'</div><div class="comment-time">'+c.time+'</div></div></div>';
    }).join('') + '</div>';
  document.getElementById('detailContent').innerHTML = html;
}

function toggleLike() {
  liked = !liked;
  var btn = document.getElementById('likeBtn');
  var count = document.getElementById('likeCount');
  if (liked) { btn.classList.add('liked'); count.textContent = post.likes + 1; }
  else { btn.classList.remove('liked'); count.textContent = post.likes; }
}

function sendComment() {
  var input = document.getElementById('commentInput');
  if (input.value.trim()) {
    comments.push({ avatar: '\uD83D\uDC64', name: '我', text: input.value, time: '刚刚' });
    input.value = '';
    render();
    window.scrollTo(0, document.body.scrollHeight);
  }
}

render();
VoiceAssistant.init({
  role: 'guardian', primaryAvatar: '\uD83D\uDCE6', primaryName: 'AI小箱',
  targets: [
    { id: 'xiaoming', avatar: '\uD83D\uDC66', name: '小明', desc: '8岁 · 儿子', type: 'family' },
    { id: 'xiaohong', avatar: '\uD83D\uDC67', name: '小红', desc: '12岁 · 女儿', type: 'family' },
    { id: 'yeye', avatar: '\uD83D\uDC74', name: '爷爷', desc: '75岁 · 父亲', type: 'family' }
  ],
  messages: [{ speaker: 'ai', type: 'text', content: '你好呀！我是AI小箱，有什么可以帮你的吗？', avatar: '\uD83D\uDCE6' }]
});
</script>
</body>
</html>
