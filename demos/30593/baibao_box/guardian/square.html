<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>广场 - 监护人</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
  :root {
    --primary: #5b6cf9; --primary-dark: #4a5de0; --primary-light: #e8eaf6;
    --accent: #ff6b6b; --warm: #ff9a56; --bg: #f8f9fc; --white: #ffffff;
    --text: #1a1a2e; --text-secondary: #6b7280; --text-light: #9ca3af;
    --border: #e5e7eb; --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow: 0 8px 32px rgba(0,0,0,0.08); --radius-sm: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    max-width: 430px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 80px; overflow-x: hidden;
  }
  .top-nav { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 16px 20px 24px; }
  .nav-row { display: flex; align-items: center; gap: 12px; }
  .nav-back { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; cursor: pointer; text-decoration: none; flex-shrink: 0; }
  .nav-title { color: #fff; font-size: 17px; font-weight: 600; flex: 1; }
  .search-section { padding: 16px 20px 0; }
  .search-bar { display: flex; align-items: center; gap: 10px; background: var(--white); border-radius: var(--radius-sm); padding: 12px 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
  .search-bar i { color: var(--text-light); font-size: 16px; }
  .search-bar input { flex: 1; border: none; outline: none; font-size: 14px; font-family: 'Noto Sans SC', sans-serif; color: var(--text); background: transparent; }
  .search-bar input::placeholder { color: var(--text-light); }
  .filter-row { padding: 12px 20px 0; display: flex; align-items: center; justify-content: space-between; }
  .sort-btn { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; background: var(--white); border: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
  .sort-btn:hover { border-color: var(--primary); color: var(--primary); }
  .emotion-filter { display: flex; gap: 6px; flex-wrap: wrap; }
  .emotion-tag { padding: 4px 12px; border-radius: 14px; font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
  .emotion-tag.happy { background: #e8f5e9; color: #4caf50; }
  .emotion-tag.calm { background: #e3f2fd; color: #2196f3; }
  .emotion-tag.excited { background: #fff3e0; color: #ff9800; }
  .emotion-tag.sad { background: #fce4ec; color: #e91e63; }
  .emotion-tag.active { border-color: currentColor; box-shadow: 0 0 0 2px rgba(91,108,249,0.15); }
  .square-section { padding: 16px 20px 0; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .story-card {
    display: flex; gap: 14px; background: var(--white); border-radius: var(--radius-sm);
    padding: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--border);
    margin-bottom: 12px; cursor: pointer; transition: all 0.3s ease;
  }
  .story-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .story-cover { width: 90px; height: 90px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: linear-gradient(135deg, #e0c3fc, #8ec5fc); }
  .story-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .story-info h4 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
  .story-info p { font-size: 12px; color: var(--text-secondary); line-height: 1.5; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .story-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-light); flex-wrap: wrap; }
  .story-meta .mood-tag { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .story-meta .mood-tag.happy { background: #e8f5e9; color: #4caf50; }
  .story-meta .mood-tag.calm { background: #e3f2fd; color: #2196f3; }
  .story-meta .mood-tag.excited { background: #fff3e0; color: #ff9800; }
  .story-meta .mood-tag.sad { background: #fce4ec; color: #e91e63; }
  .story-meta .likes { color: var(--accent); font-weight: 600; }
  .story-meta .likes i { margin-right: 2px; }
  .story-arrow { color: var(--text-light); font-size: 14px; align-self: center; }
  /* AI过滤提示 */
  .ai-filter-tip { margin:0 20px 12px; padding:10px 14px; background:#e8f5e9; border-radius:10px; display:flex; align-items:center; gap:8px; font-size:12px; color:#2e7d32; animation:fadeInUp .5s ease .15s both; }
  .ai-filter-tip i { font-size:14px; }
  /* 反馈按钮 */
  .feedback-bar { padding:12px 20px; text-align:center; }
  .feedback-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:20px; border:1px solid var(--border); background:var(--white); color:var(--text-secondary); font-size:12px; cursor:pointer; font-family:inherit; transition:all .2s; }
  .feedback-btn:active { transform:scale(.97); }
  .feedback-btn i { font-size:12px; color:var(--primary); }
  /* 反馈弹窗 */
  .feedback-modal { position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px; }
  .feedback-modal.active { display:flex; }
  .feedback-content { background:var(--white);border-radius:16px;padding:20px;width:100%;max-width:320px;animation:fadeInUp .3s ease; }
  .feedback-title { font-size:16px;font-weight:700;margin-bottom:12px;text-align:center; }
  .feedback-desc { font-size:13px;color:var(--text-secondary);margin-bottom:16px;text-align:center;line-height:1.5; }
  .feedback-options { display:flex;flex-direction:column;gap:8px;margin-bottom:16px; }
  .feedback-option { padding:10px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--white);font-size:13px;cursor:pointer;font-family:inherit;text-align:left;transition:all .2s; }
  .feedback-option:hover { border-color:var(--primary);background:var(--primary-light); }
  .feedback-option.selected { border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:600; }
  .feedback-actions { display:flex;gap:10px; }
  .feedback-actions button { flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit; }
  .feedback-actions .cancel { background:var(--bg);color:var(--text-secondary); }
  .feedback-actions .confirm { background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff; }
  .tab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; height: 64px; background: var(--white);
    display: flex; justify-content: space-around; align-items: center;
    border-top: 1px solid var(--border); box-shadow: 0 -4px 16px var(--shadow-sm); z-index: 100;
  }
  .tab-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 4px 16px; text-decoration: none; color: var(--text-light); transition: color 0.2s; }
  .tab-item .icon { font-size: 20px; margin-bottom: 2px; }
  .tab-item .label { font-size: 11px; }
  .tab-item.active { color: var(--primary); }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .search-section { animation: fadeInUp 0.5s ease 0.1s both; }
  .square-section { animation: fadeInUp 0.5s ease 0.2s both; }
</style>
</head>
<body>
<div class="top-nav">
  <div class="nav-row">
    <a href="home.html" class="nav-back"><i class="fas fa-arrow-left"></i></a>
    <div class="nav-title">广场</div>
  </div>
</div>
<div class="search-section">
  <div class="search-bar">
    <i class="fas fa-search"></i>
    <input type="text" placeholder="搜索广场故事..." id="searchInput" oninput="renderList()">
  </div>
</div>
<div class="filter-row">
  <div class="sort-btn" onclick="cycleSort()"><i class="fas fa-sort"></i> <span id="sortLabel">情绪排序</span></div>
  <div class="emotion-filter">
    <div class="emotion-tag happy active" onclick="toggleEmotion(this)">开心</div>
    <div class="emotion-tag calm active" onclick="toggleEmotion(this)">平静</div>
    <div class="emotion-tag excited active" onclick="toggleEmotion(this)">激动</div>
    <div class="emotion-tag sad active" onclick="toggleEmotion(this)">悲伤</div>
  </div>
</div>
<!-- AI过滤提示 -->
<div class="ai-filter-tip">
  <i class="fas fa-shield-halved"></i>
  <span>AI已自动过滤不当内容，为您营造安全的故事环境</span>
</div>
<div class="square-section" id="listContainer"></div>
<!-- 反馈入口 -->
<div class="feedback-bar">
  <button class="feedback-btn" onclick="openFeedback()">
    <i class="fas fa-flag"></i> 发现不当内容？点击反馈
  </button>
</div>
<!-- 反馈弹窗 -->
<div class="feedback-modal" id="feedbackModal">
  <div class="feedback-content">
    <div class="feedback-title">内容反馈</div>
    <div class="feedback-desc">帮助我们维护安全的故事环境，您的反馈非常重要</div>
    <div class="feedback-options">
      <button class="feedback-option" onclick="selectFeedback(this)">包含不当内容</button>
      <button class="feedback-option" onclick="selectFeedback(this)">涉及个人隐私</button>
      <button class="feedback-option" onclick="selectFeedback(this)">恐怖或暴力</button>
      <button class="feedback-option" onclick="selectFeedback(this)">其他问题</button>
    </div>
    <div class="feedback-actions">
      <button class="cancel" onclick="closeFeedback()">取消</button>
      <button class="confirm" onclick="submitFeedback()">提交反馈</button>
    </div>
  </div>
</div>
<div class="tab-bar">
  <a class="tab-item" href="home.html"><span class="icon"><i class="fas fa-home"></i></span><span class="label">首页</span></a>
  <a class="tab-item" href="storybook.html"><span class="icon"><i class="fas fa-book-open"></i></span><span class="label">故事本</span></a>
  <a class="tab-item active" href="square.html"><span class="icon"><i class="fas fa-users"></i></span><span class="label">广场</span></a>
  <a class="tab-item" href="profile.html"><span class="icon"><i class="fas fa-user"></i></span><span class="label">我的</span></a>
</div>
<script src="../shared/voice-assistant.js"></script>
<script>
var posts = [
  { id:0, title:'今天在公园和小狗玩', summary:'今天在公园遇到了一只可爱的小狗，它一直跟着我们跑。', cover:'https://picsum.photos/seed/childplay/200/200.jpg', mood:'happy', moodLabel:'开心', author:'小明', date:'2小时前', likes:12 },
  { id:1, title:'画了一幅彩虹', summary:'用颜料画了一道大大的彩虹，有七种颜色呢。', cover:'https://picsum.photos/seed/childpaint/200/200.jpg', mood:'excited', moodLabel:'激动', author:'小红', date:'5小时前', likes:18 },
  { id:2, title:'和老朋友下棋', summary:'今天和老李在公园下棋，赢了两盘。', cover:'https://picsum.photos/seed/grandpa/200/200.jpg', mood:'calm', moodLabel:'平静', author:'爷爷', date:'昨天', likes:24 },
  { id:3, title:'全家一起去野餐', summary:'周末天气很好，全家一起去郊外野餐。', cover:'https://picsum.photos/seed/family/200/200.jpg', mood:'happy', moodLabel:'开心', author:'匿名用户', date:'2天前', likes:31 },
  { id:4, title:'学了一首新歌', summary:'音乐课学了一首关于春天的歌，旋律特别优美。', cover:'https://picsum.photos/seed/sing/200/200.jpg', mood:'excited', moodLabel:'激动', author:'小红', date:'3天前', likes:9 },
  { id:5, title:'想起了年轻时候的事', summary:'翻到了一张老照片，想起了年轻时候在工厂的日子。', cover:'https://picsum.photos/seed/oldphoto/200/200.jpg', mood:'calm', moodLabel:'平静', author:'爷爷', date:'4天前', likes:42 }
];
var sortMode = 0;
var sortLabels = ['情绪排序','最新时间','最早时间'];
var activeEmotions = ['happy','calm','excited','sad'];

function renderList() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  var filtered = posts.filter(function(p) {
    if (activeEmotions.indexOf(p.mood) === -1) return false;
    if (q && p.title.toLowerCase().indexOf(q) === -1 && p.summary.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  if (sortMode === 0) {
    var moodOrder = { happy:0, excited:1, calm:2, sad:3 };
    filtered.sort(function(a,b) { return (moodOrder[a.mood]||0) - (moodOrder[b.mood]||0); });
  }
  var html = '<div class="section-header"><h2 class="section-title">广场故事</h2><span style="font-size:13px;color:var(--text-light);">'+filtered.length+'篇</span></div>';
  filtered.forEach(function(p) {
    html += '<div class="story-card" onclick="location.href=\'square-detail.html?id='+p.id+'\'">' +
      '<img class="story-cover" src="'+p.cover+'" alt="封面">' +
      '<div class="story-info"><h4>'+p.title+'</h4><p>'+p.summary+'</p>' +
      '<div class="story-meta"><span class="mood-tag '+p.mood+'">'+p.moodLabel+'</span>' +
      '<span><i class="fas fa-user"></i> '+p.author+'</span>' +
      '<span><i class="fas fa-clock"></i> '+p.date+'</span>' +
      '<span class="likes"><i class="fas fa-heart"></i> '+p.likes+'</span></div></div>' +
      '<div class="story-arrow"><i class="fas fa-chevron-right"></i></div></div>';
  });
  document.getElementById('listContainer').innerHTML = html;
}
function cycleSort() { sortMode = (sortMode+1)%3; document.getElementById('sortLabel').textContent = sortLabels[sortMode]; renderList(); }
function toggleEmotion(el) {
  el.classList.toggle('active');
  activeEmotions = [];
  document.querySelectorAll('.emotion-tag.active').forEach(function(t) {
    activeEmotions.push(t.className.replace('emotion-tag ','').replace(' active',''));
  });
  renderList();
}
var selectedFeedbackType=null;
function openFeedback(){document.getElementById('feedbackModal').classList.add('active');selectedFeedbackType=null;document.querySelectorAll('.feedback-option').forEach(function(o){o.classList.remove('selected')})}
function closeFeedback(){document.getElementById('feedbackModal').classList.remove('active')}
function selectFeedback(el){document.querySelectorAll('.feedback-option').forEach(function(o){o.classList.remove('selected')});el.classList.add('selected');selectedFeedbackType=el.textContent}
function submitFeedback(){
  if(!selectedFeedbackType){alert('请选择反馈类型');return}
  closeFeedback();
  var tip=document.createElement('div');tip.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:16px 28px;border-radius:12px;font-size:14px;z-index:9999;text-align:center;';
  tip.innerHTML='<div style="font-size:28px;margin-bottom:8px">✅</div><div style="font-weight:600">反馈已提交</div><div style="font-size:12px;color:#aaa;margin-top:4px">我们会尽快处理</div>';
  document.body.appendChild(tip);setTimeout(function(){tip.remove()},2000);
}
renderList();
VoiceAssistant.init({
  role: 'guardian', primaryAvatar: '\uD83D\uDCE6', primaryName: 'AI小箱',
  targets: [
    { id: 'xiaoming', avatar: '\uD83D\uDC66', name: '小明', desc: '8岁 · 儿子', type: 'family' },
    { id: 'xiaohong', avatar: '\uD83D\uDC67', name: '小红', desc: '12岁 · 女儿', type: 'family' },
    { id: 'yeye', avatar: '\uD83D\uDC74', name: '爷爷', desc: '75岁 · 父亲', type: 'family' }
  ],
  messages: [{ speaker: 'ai', type: 'text', content: '你好呀！我是AI小箱，有什么可以帮你的吗？', avatar: '\uD83D\uDCE6' }]
});
</script>
</body>
</html>
