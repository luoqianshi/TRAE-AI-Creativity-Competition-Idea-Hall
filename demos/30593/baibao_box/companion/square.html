<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事百宝箱 - 广场</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
:root{--primary-from:#ff9a56;--primary-to:#ff6b9d;--primary-gradient:linear-gradient(135deg,var(--primary-from),var(--primary-to));--radius-sm:14px;--shadow:0 4px 16px rgba(255,107,157,.15);--bg:#fff5f0;--card-bg:#fff;--text-primary:#333;--text-secondary:#888;--text-light:#bbb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:80px;overflow-x:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.top-nav{background:var(--primary-gradient);padding:44px 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-nav .back-btn{color:#fff;font-size:18px;background:none;border:none;cursor:pointer;padding:4px}
.top-nav .nav-title{color:#fff;font-size:17px;font-weight:700}

/* 搜索栏 */
.search-bar{padding:12px 16px}
.search-input{width:100%;height:40px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;padding:0 16px 0 40px;font-size:14px;outline:none;font-family:inherit;position:relative}
.search-wrap{position:relative}
.search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#bbb;font-size:14px}
.search-input:focus{border-color:var(--primary-to)}

/* 排序+筛选 */
.filter-bar{padding:0 16px 12px;display:flex;align-items:center;gap:10px}
.sort-btn{display:flex;align-items:center;gap:4px;padding:6px 14px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;font-size:12px;color:var(--text-secondary);cursor:pointer;font-family:inherit;white-space:nowrap}
.sort-btn i{font-size:10px;color:var(--primary-to)}
.tag-scroll{display:flex;gap:8px;overflow-x:auto;flex:1;padding:4px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tag-scroll::-webkit-scrollbar{display:none}
.tag-pill{padding:6px 14px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:var(--text-secondary);transition:all .2s;flex-shrink:0}
.tag-pill.active{background:var(--primary-gradient);color:#fff;border-color:transparent}

/* 故事列表 */
.story-list{padding:0 16px}
.story-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;animation:fadeInUp .4s ease;transition:transform .2s}
.story-item:active{transform:scale(.98)}
.story-item:last-child{border-bottom:none}
.story-cover{width:110px;height:78px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:36px}
.story-body{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.story-title{font-size:15px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.story-excerpt{font-size:12px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.story-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--text-light)}
.story-tag{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:500}
.story-likes{display:flex;align-items:center;gap:3px;color:var(--primary-to);font-size:11px;font-weight:500}
.cover-0{background:linear-gradient(135deg,#ffe0b2,#ffcc80)}.cover-1{background:linear-gradient(135deg,#b3e5fc,#81d4fa)}.cover-2{background:linear-gradient(135deg,#fff9c4,#fff176)}.cover-3{background:linear-gradient(135deg,#c8e6c9,#a5d6a7)}.cover-4{background:linear-gradient(135deg,#e0f7fa,#80deea)}.cover-5{background:linear-gradient(135deg,#dcedc8,#c5e1a5)}.cover-6{background:linear-gradient(135deg,#bbdefb,#90caf9)}.cover-7{background:linear-gradient(135deg,#424242,#616161)}
.tag-搞笑{background:#fff3e0;color:#e65100}.tag-有趣{background:#f3e5f5;color:#7b1fa2}.tag-激动{background:#fff9c4;color:#f57f17}.tag-有意义{background:#e8f5e9;color:#2e7d32}.tag-纪念{background:#e0f7fa;color:#00838f}.tag-平静{background:#f3e5f5;color:#6a1b9a}.tag-难过{background:#e3f2fd;color:#1565c0}.tag-悲伤{background:#ede7f6;color:#4527a0}.tag-烦恼{background:#fce4ec;color:#c62828}.tag-郁闷{background:#efebe9;color:#4e342e}.tag-emo{background:#263238;color:#b0bec5}.tag-痛苦{background:#212121;color:#9e9e9e}

/* AI过滤提示 */
.ai-filter-tip{margin:0 16px 12px;padding:10px 14px;background:#e8f5e9;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:#2e7d32}
.ai-filter-tip i{font-size:14px}

/* 反馈按钮 */
.feedback-bar{padding:12px 16px;text-align:center}
.feedback-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;border:1px solid #e0e0e0;background:#fff;color:var(--text-secondary);font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s}
.feedback-btn:active{transform:scale(.97)}
.feedback-btn i{font-size:12px;color:var(--primary-to)}

/* 反馈弹窗 */
.feedback-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.feedback-modal.active{display:flex}
.feedback-content{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:320px;animation:fadeInUp .3s ease}
.feedback-title{font-size:16px;font-weight:700;margin-bottom:12px;text-align:center}
.feedback-desc{font-size:13px;color:var(--text-secondary);margin-bottom:16px;text-align:center;line-height:1.5}
.feedback-options{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.feedback-option{padding:10px 14px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;text-align:left;transition:all .2s}
.feedback-option:hover{border-color:var(--primary-to);background:#fff5f0}
.feedback-option.selected{border-color:var(--primary-to);background:#fff5f0;color:var(--primary-to);font-weight:600}
.feedback-actions{display:flex;gap:10px}
.feedback-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.feedback-actions .cancel{background:#f5f5f5;color:var(--text-secondary)}
.feedback-actions .confirm{background:var(--primary-gradient);color:#fff}

/* 底部Tab */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:64px;background:#fff;display:flex;align-items:center;justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:1000}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;color:var(--text-light);font-size:10px;padding:4px 12px;-webkit-tap-highlight-color:transparent}
.tab-item.active{color:var(--primary-to)}
.tab-item i{font-size:20px}
.tab-item span{font-size:10px;font-weight:500}
</style>
</head>
<body>

<div class="top-nav">
  <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
  <span class="nav-title">广场</span>
  <span></span>
</div>

<div class="search-bar">
  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input class="search-input" placeholder="搜索有趣的故事..." id="searchInput" oninput="doSearch()">
  </div>
</div>

<div class="filter-bar">
  <button class="sort-btn" id="sortBtn" onclick="toggleSort()">
    <i class="fa-solid fa-arrow-down-wide-short"></i>
    <span id="sortLabel">情绪排序</span>
  </button>
  <div class="tag-scroll" id="tagScroll"></div>
</div>

<!-- AI过滤提示 -->
<div class="ai-filter-tip">
  <i class="fa-solid fa-shield-halved"></i>
  <span>AI已自动过滤不当内容，为您营造安全的故事环境</span>
</div>

<div class="story-list" id="storyList"></div>

<!-- 反馈入口 -->
<div class="feedback-bar">
  <button class="feedback-btn" onclick="openFeedback()">
    <i class="fa-solid fa-flag"></i> 发现不当内容？点击反馈
  </button>
</div>

<!-- 反馈弹窗 -->
<div class="feedback-modal" id="feedbackModal">
  <div class="feedback-content">
    <div class="feedback-title">内容反馈</div>
    <div class="feedback-desc">帮助我们维护安全的故事环境，您的反馈非常重要</div>
    <div class="feedback-options">
      <button class="feedback-option" onclick="selectFeedback(this)">包含不当内容</button>
      <button class="feedback-option" onclick="selectFeedback(this)">涉及个人隐私</button>
      <button class="feedback-option" onclick="selectFeedback(this)">恐怖或暴力</button>
      <button class="feedback-option" onclick="selectFeedback(this)">其他问题</button>
    </div>
    <div class="feedback-actions">
      <button class="cancel" onclick="closeFeedback()">取消</button>
      <button class="confirm" onclick="submitFeedback()">提交反馈</button>
    </div>
  </div>
</div>

<nav class="tab-bar">
  <a class="tab-item" href="home.html"><i class="fa-solid fa-house"></i><span>首页</span></a>
  <a class="tab-item" href="storybook.html"><i class="fa-solid fa-book"></i><span>故事本</span></a>
  <a class="tab-item active" href="square.html"><i class="fa-solid fa-globe"></i><span>广场</span></a>
  <a class="tab-item" href="profile.html"><i class="fa-solid fa-user"></i><span>我的</span></a>
</nav>

<script src="../shared/voice-assistant.js"></script>
<script>
var EMOTION_ORDER=['搞笑','有趣','激动','有意义','纪念','平静','难过','悲伤','烦恼','郁闷','emo','痛苦'];
var EMOTION_SCORE={};EMOTION_ORDER.forEach(function(e,i){EMOTION_SCORE[e]=i});

var squareStories=[
  {id:0,title:'第一次独自做饭',tag:'搞笑',date:'2025-06-14',emoji:'🍳',coverClass:'cover-0',likes:128,
   excerpt:'第一次尝试做番茄炒蛋，结果把糖当成了盐，全家人吃了一口就停不下来地笑...'},
  {id:1,title:'雨天偶遇的温暖',tag:'有趣',date:'2025-06-12',emoji:'🌈',coverClass:'cover-1',likes:96,
   excerpt:'下雨天在公交站遇到一个陌生人主动和我分享伞，那一刻觉得世界真美好...'},
  {id:2,title:'考试进步的喜悦',tag:'激动',date:'2025-06-10',emoji:'🏆',coverClass:'cover-2',likes:215,
   excerpt:'这次考试我进步了20名！当看到成绩单的那一刻，我激动得差点哭出来...'},
  {id:3,title:'外婆的菜园',tag:'有意义',date:'2025-06-08',emoji:'🌻',coverClass:'cover-3',likes:167,
   excerpt:'外婆有一个小小的菜园，她每天都会去浇水除草，那里有她一辈子的心血...'},
  {id:4,title:'毕业那天',tag:'纪念',date:'2025-06-05',emoji:'🎓',coverClass:'cover-4',likes:302,
   excerpt:'毕业那天，我们全班同学抱在一起哭了，老师说这只是一个开始...'},
  {id:5,title:'午后的猫咪',tag:'平静',date:'2025-06-03',emoji:'🐱',coverClass:'cover-5',likes:89,
   excerpt:'午后阳光洒在阳台上，猫咪懒洋洋地趴着打盹，我也靠在椅子上发呆...'},
  {id:6,title:'和好朋友吵架',tag:'难过',date:'2025-05-30',emoji:'💔',coverClass:'cover-6',likes:74,
   excerpt:'因为一点小事和最好的朋友吵了架，冷战了三天，最后还是我先低头道歉...'},
  {id:7,title:'深夜的思考',tag:'emo',date:'2025-05-27',emoji:'🌙',coverClass:'cover-7',likes:156,
   excerpt:'凌晨三点还醒着，看着窗外的月亮，想着很多很多的事情...'}
];

var sortState=0,sortLabels=['情绪排序','最新优先','最早优先'],activeTag=null,searchText='';

function init(){renderTags();applyFilter()}
function renderTags(){
  var h='<div class="tag-pill active" data-tag="" onclick="filterTag(this)">全部</div>';
  EMOTION_ORDER.forEach(function(t){h+='<div class="tag-pill" data-tag="'+t+'" onclick="filterTag(this)">'+t+'</div>'});
  document.getElementById('tagScroll').innerHTML=h;
}
function toggleSort(){sortState=(sortState+1)%3;document.getElementById('sortLabel').textContent=sortLabels[sortState];applyFilter()}
function filterTag(el){document.querySelectorAll('.tag-pill').forEach(function(p){p.classList.remove('active')});el.classList.add('active');activeTag=el.dataset.tag||null;applyFilter()}
function doSearch(){searchText=document.getElementById('searchInput').value.trim().toLowerCase();applyFilter()}

function applyFilter(){
  var list=squareStories.filter(function(s){
    if(activeTag&&s.tag!==activeTag)return false;
    if(searchText&&s.title.toLowerCase().indexOf(searchText)===-1&&s.excerpt.toLowerCase().indexOf(searchText)===-1)return false;
    return true;
  });
  list.sort(function(a,b){
    if(sortState===0)return(EMOTION_SCORE[a.tag]||0)-(EMOTION_SCORE[b.tag]||0);
    if(sortState===1)return new Date(b.date)-new Date(a.date);
    return new Date(a.date)-new Date(b.date);
  });
  renderList(list);
}

function renderList(list){
  var h='';
  list.forEach(function(s){
    h+='<div class="story-item" onclick="location.href=\'square-detail.html?id='+s.id+'\'">';
    h+='<div class="story-cover '+s.coverClass+'">'+s.emoji+'</div>';
    h+='<div class="story-body">';
    h+='<div class="story-title">'+s.title+'</div>';
    h+='<div class="story-excerpt">'+s.excerpt+'</div>';
    h+='<div class="story-meta">';
    h+='<span class="story-tag tag-'+s.tag+'">'+s.tag+'</span>';
    h+='<span>'+s.date+'</span>';
    h+='<span class="story-likes"><i class="fa-solid fa-heart"></i> '+s.likes+'</span>';
    h+='</div></div></div>';
  });
  document.getElementById('storyList').innerHTML=h||'<div style="text-align:center;padding:40px;color:#bbb;font-size:14px">暂无故事</div>';
}

init();

// 反馈弹窗控制
var selectedFeedbackType = null;
function openFeedback(){document.getElementById('feedbackModal').classList.add('active');selectedFeedbackType=null;document.querySelectorAll('.feedback-option').forEach(function(o){o.classList.remove('selected')})}
function closeFeedback(){document.getElementById('feedbackModal').classList.remove('active')}
function selectFeedback(el){document.querySelectorAll('.feedback-option').forEach(function(o){o.classList.remove('selected')});el.classList.add('selected');selectedFeedbackType=el.textContent}
function submitFeedback(){
  if(!selectedFeedbackType){showToast('请选择反馈类型');return}
  closeFeedback();
  var tip=document.createElement('div');
  tip.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.8);color:#fff;padding:16px 28px;border-radius:12px;font-size:14px;z-index:9999;text-align:center;';
  tip.innerHTML='<div style="font-size:28px;margin-bottom:8px">✅</div><div style="font-weight:600">反馈已提交</div><div style="font-size:12px;color:#aaa;margin-top:4px">我们会尽快处理</div>';
  document.body.appendChild(tip);
  setTimeout(function(){tip.remove()},2000);
}

// Toast提示
function showToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove()},1500);
}

VoiceAssistant.init({role:'companion',primaryAvatar:'🦊',primaryName:'小箱',targets:[{id:'ai',avatar:'🦊',name:'小箱',desc:'在线',online:true,bg:'#fff3e0'}],messages:[],onSend:function(t){setTimeout(function(){VoiceAssistant.addAIMessage('广场上的故事都很有趣呢~')},800)}});
</script>
</body>
</html>
