<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>故事百宝箱 - AI聊天</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../shared/voice-assistant.css">
<style>
:root{--primary-from:#ff9a56;--primary-to:#ff6b9d;--primary-gradient:linear-gradient(135deg,var(--primary-from),var(--primary-to));--radius-sm:14px;--shadow:0 4px 16px rgba(255,107,157,.15);--bg:#fff5f0;--card-bg:#fff;--text-primary:#333;--text-secondary:#888;--text-light:#bbb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes typing{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes starPop{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0deg)}}

/* 顶部导航 */
.chat-top-nav{background:var(--primary-gradient);padding:44px 16px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-top-nav .back-btn{color:#fff;font-size:18px;background:none;border:none;cursor:pointer;padding:4px}
.chat-top-nav .nav-info{flex:1;display:flex;align-items:center;gap:10px}
.chat-top-nav .nav-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px}
.chat-top-nav .nav-name{color:#fff;font-size:15px;font-weight:600}
.chat-top-nav .nav-status{color:rgba(255,255,255,.8);font-size:11px;display:flex;align-items:center;gap:4px}
.chat-top-nav .nav-status .dot{width:6px;height:6px;border-radius:50%;background:#52c41a;display:inline-block}

/* 消息区域 */
.chat-messages{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.chat-messages::-webkit-scrollbar{width:3px}
.chat-messages::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}

.chat-msg{display:flex;margin-bottom:16px;animation:fadeInUp .3s ease}
.chat-msg.left{justify-content:flex-start}
.chat-msg.right{justify-content:flex-end}
.chat-msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-right:8px}
.chat-msg.right .chat-msg-avatar{margin-right:0;margin-left:8px}
.chat-msg-bubble{max-width:75%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.7;word-break:break-word}
.chat-msg.left .chat-msg-bubble{background:#fff5ee;color:#333;border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(255,154,86,.1)}
.chat-msg.right .chat-msg-bubble{background:var(--primary-gradient);color:#fff;border-bottom-right-radius:4px}

/* 语音消息 */
.voice-bubble{display:flex;align-items:center;gap:10px;min-width:110px;cursor:pointer}
.voice-bars{display:flex;align-items:center;gap:2px;height:20px}
.voice-bars span{width:3px;border-radius:2px;background:currentColor;animation:vbar 1.2s ease-in-out infinite}
.voice-bars span:nth-child(1){height:6px;animation-delay:0s}.voice-bars span:nth-child(2){height:12px;animation-delay:.15s}.voice-bars span:nth-child(3){height:8px;animation-delay:.3s}.voice-bars span:nth-child(4){height:16px;animation-delay:.45s}.voice-bars span:nth-child(5){height:10px;animation-delay:.6s}.voice-bars span:nth-child(6){height:14px;animation-delay:.75s}
@keyframes vbar{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.voice-dur{font-size:12px;opacity:.8}

/* 互动式古诗卡片 */
.poem-card{background:#fff;border-radius:var(--radius-sm);padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:6px 0;max-width:75%}
.poem-card .poem-title{font-size:13px;font-weight:600;color:var(--primary-from);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.poem-card .poem-line{font-size:15px;line-height:2.2;color:#333;text-align:center;font-family:'Noto Sans SC',serif}
.poem-card .poem-line.hidden{color:transparent;background:linear-gradient(135deg,#ffe0b2,#ffd180);border-radius:6px;cursor:pointer;transition:all .3s}
.poem-card .poem-line.hidden:hover{background:linear-gradient(135deg,#ffd180,#ffcc80)}
.poem-card .poem-line.revealed{color:#333;background:none;animation:fadeInUp .3s ease}
.poem-card .poem-hint{font-size:11px;color:var(--text-light);text-align:center;margin-top:8px}
.poem-card .poem-action-btn{display:block;width:100%;margin-top:10px;padding:8px;border-radius:20px;border:none;background:var(--primary-gradient);color:#fff;font-size:13px;font-family:inherit;cursor:pointer;transition:opacity .2s}
.poem-card .poem-action-btn:active{opacity:.8}

/* 互动式唱歌卡片 */
.song-card{background:#fff;border-radius:var(--radius-sm);padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:6px 0;max-width:75%}
.song-card .song-title{font-size:13px;font-weight:600;color:var(--primary-from);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.song-card .song-lyrics{font-size:14px;line-height:2;color:#333}
.song-card .song-lyrics .highlight{color:var(--primary-to);font-weight:600}
.song-card .song-action-btn{display:block;width:100%;margin-top:10px;padding:8px;border-radius:20px;border:none;background:var(--primary-gradient);color:#fff;font-size:13px;font-family:inherit;cursor:pointer;transition:opacity .2s}
.song-card .song-action-btn:active{opacity:.8}
.song-card .song-hint{font-size:11px;color:var(--text-light);text-align:center;margin-top:6px}

/* 互动式游戏卡片 */
.game-card{background:#fff;border-radius:var(--radius-sm);padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:6px 0;max-width:75%}
.game-card .game-title{font-size:13px;font-weight:600;color:var(--primary-from);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.game-card .game-question{font-size:14px;line-height:1.7;color:#333;margin-bottom:10px}
.game-card .game-options{display:flex;flex-direction:column;gap:8px}
.game-card .game-option{padding:10px 14px;border-radius:10px;border:1.5px solid #e8e8e8;background:#fafafa;font-size:13px;color:#333;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit}
.game-card .game-option:hover{border-color:var(--primary-from);background:#fff5ee}
.game-card .game-option.correct{border-color:#4caf50;background:#e8f5e9;color:#2e7d32}
.game-card .game-option.wrong{border-color:#f44336;background:#ffebee;color:#c62828}
.game-card .game-result{font-size:13px;margin-top:10px;padding:10px;border-radius:8px;text-align:center}
.game-card .game-result.win{background:#e8f5e9;color:#2e7d32}
.game-card .game-result.lose{background:#ffebee;color:#c62828}

/* 故事接龙输入区 */
.story-chain-input{display:flex;gap:8px;margin-top:10px}
.story-chain-input input{flex:1;height:36px;border:1.5px solid #e0e0e0;border-radius:18px;padding:0 14px;font-size:13px;outline:none;font-family:inherit}
.story-chain-input input:focus{border-color:var(--primary-to)}
.story-chain-input button{height:36px;padding:0 16px;border-radius:18px;border:none;background:var(--primary-gradient);color:#fff;font-size:13px;font-family:inherit;cursor:pointer}

/* 星星奖励 */
.star-reward{display:flex;align-items:center;gap:6px;margin-top:10px;padding:8px 12px;background:linear-gradient(135deg,#fff8e1,#fff3e0);border-radius:10px}
.star-reward .star-icon{font-size:20px;animation:starPop .5s ease}
.star-reward .star-text{font-size:12px;color:#e65100;font-weight:500}

/* 快捷话题栏 */
.topic-bar{padding:8px 16px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.topic-bar::-webkit-scrollbar{display:none}
.topic-chip{padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:var(--text-secondary);transition:all .2s;flex-shrink:0;font-family:inherit}
.topic-chip:active{transform:scale(.95)}
.topic-chip:hover{border-color:var(--primary-to);color:var(--primary-to)}
.topic-chip.active{background:var(--primary-gradient);color:#fff;border-color:transparent}

/* 底部输入区 */
.chat-input-area{padding:10px 16px 12px;border-top:1px solid #f0f0f0;background:#fff;display:flex;gap:10px;align-items:center;flex-shrink:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0))}
.chat-voice-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--primary-gradient);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s}
.chat-voice-btn:active{transform:scale(.9)}
.chat-voice-btn.recording{background:linear-gradient(135deg,#ff4757,#ff2d3b);animation:pulse 1s infinite}
.chat-text-input{flex:1;height:42px;border:1px solid #e0e0e0;border-radius:21px;padding:0 16px;font-size:14px;outline:none;font-family:inherit;transition:border-color .2s}
.chat-text-input:focus{border-color:var(--primary-to)}
.chat-text-input::placeholder{color:#ccc}
.chat-send-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--primary-gradient);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s,opacity .2s}
.chat-send-btn:active{transform:scale(.9)}
.chat-send-btn:disabled{opacity:.4;cursor:not-allowed}

/* 底部Tab */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:64px;background:#fff;display:flex;align-items:center;justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,.06);z-index:1000}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;color:var(--text-light);font-size:10px;padding:4px 12px;-webkit-tap-highlight-color:transparent}
.tab-item.active{color:var(--primary-to)}
.tab-item i{font-size:20px}
.tab-item span{font-size:10px;font-weight:500}

/* 时间标签 */
.time-label{text-align:center;font-size:11px;color:var(--text-light);margin:12px 0}

/* 正在输入 */
.typing-indicator{display:flex;align-items:center;gap:4px;padding:12px 16px}
.typing-indicator span{width:6px;height:6px;border-radius:50%;background:var(--text-light);animation:typing 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="chat-top-nav">
  <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
  <div class="nav-info">
    <div class="nav-avatar">🦊</div>
    <div>
      <div class="nav-name">小箱</div>
      <div class="nav-status"><span class="dot"></span> 在线</div>
    </div>
  </div>
</div>

<!-- 消息区域 -->
<div class="chat-messages" id="chatMessages"></div>

<!-- 快捷话题栏 -->
<div class="topic-bar" id="topicBar">
  <button class="topic-chip" onclick="sendTopic('讲个故事')">📖 讲个故事</button>
  <button class="topic-chip" onclick="sendTopic('学古诗')">📜 学古诗</button>
  <button class="topic-chip" onclick="sendTopic('唱儿歌')">🎵 唱儿歌</button>
  <button class="topic-chip" onclick="sendTopic('玩游戏')">🎮 玩游戏</button>
  <button class="topic-chip" onclick="sendTopic('问问题')">❓ 问问题</button>
</div>

<!-- 底部输入区 -->
<div class="chat-input-area">
  <button class="chat-voice-btn" id="voiceBtn" onclick="toggleVoice()"><i class="fa-solid fa-microphone"></i></button>
  <input class="chat-text-input" id="chatInput" placeholder="和小箱说点什么...">
  <button class="chat-send-btn" id="sendBtn" disabled onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
</div>

<!-- 底部Tab -->
<nav class="tab-bar">
  <a class="tab-item" href="home.html"><i class="fa-solid fa-house"></i><span>首页</span></a>
  <a class="tab-item" href="storybook.html"><i class="fa-solid fa-book"></i><span>故事本</span></a>
  <a class="tab-item" href="square.html"><i class="fa-solid fa-globe"></i><span>广场</span></a>
  <a class="tab-item" href="profile.html"><i class="fa-solid fa-user"></i><span>我的</span></a>
</nav>

<script src="../shared/voice-assistant.js"></script>
<script>
var msgArea = document.getElementById('chatMessages');
var chatInput = document.getElementById('chatInput');
var sendBtn = document.getElementById('sendBtn');
var voiceBtn = document.getElementById('voiceBtn');
var isRecording = false;
var currentMode = null;

/* ========== 互动式古诗数据 ========== */
var poemData = {
  title: '《静夜思》',
  author: '李白',
  lines: ['床前明月光', '疑是地上霜', '举头望明月', '低头思故乡'],
  hints: ['第一句：床前的月光', '第二句：好像地上的霜', '第三句：抬头看月亮', '第四句：低头想家乡'],
  explain: '这首诗写的是诗人在安静的夜晚，看到明亮的月光照进房间，以为是地上结了霜。抬头看看天上的明月，不由得低下头思念起远方的家乡。'
};

/* ========== 互动式儿歌数据 ========== */
var songData = {
  title: '《小星星》',
  fullLyrics: [
    '一闪一闪小星星',
    '满天都是小星星',
    '挂在天上放光明',
    '好像许多小眼睛'
  ],
  currentLine: 0
};

/* ========== 互动式猜谜数据 ========== */
var riddleData = {
  question: '什么东西早上四条腿，中午两条腿，晚上三条腿？',
  options: ['小狗', '人', '椅子', '桌子'],
  answer: 1,
  explain: '因为人小时候爬着走（四条腿），长大后站着走（两条腿），老了拄拐杖（三条腿）！'
};

/* ========== 故事接龙数据 ========== */
var storyChain = {
  lines: ['从前在一片大森林里，有一棵会说话的大树...'],
  turn: 'user'
};

/* ========== 互动式故事数据 ========== */
var storyData = {
  lines: [],
  progress: 0
};
var storyProgress = 0;

/* ========== 初始欢迎消息 ========== */
var initialMessages = [
  {side:'left', type:'text', text:'小明你好呀！我是小箱，你的故事精灵朋友~ 🦊'},
  {side:'left', type:'text', text:'我可以陪你讲故事、背古诗、唱儿歌、玩游戏！你想做什么呢？'},
];

/* ========== 话题处理器 ========== */
var topicHandlers = {
  '讲个故事': function() {
    currentMode = 'story';
    storyProgress = 0;
    var story = [
      { text: '好呀！小箱给你讲一个《勇敢的小萤火虫》的故事~', interactive: false },
      { text: '从前有一只小萤火虫，它胆子很小，天一黑就不敢出门。', interactive: false },
      { text: '有一天，小兔子的灯笼坏了，走在黑漆漆的小路上很害怕。', interactive: false },
      { text: '你猜，小萤火虫会怎么做呢？它会躲起来，还是会去帮忙？', interactive: true, type: 'guess', hint: '你觉得小萤火虫会怎么做？' },
      { text: '小萤火虫看到了，虽然自己也害怕，但还是飞过去，用自己的光照亮了小路！', interactive: false },
      { text: '结果怎样你知道吗？小兔子怎么样了？', interactive: true, type: 'guess', hint: '小兔子后来怎样了？' },
      { text: '小兔子安全回家了，小萤火虫发现：原来帮助别人，自己也会变得很勇敢！✨', interactive: false },
      { text: '故事讲完啦！小明，你有没有帮助过别人呀？告诉小箱，小箱给你记到故事本里！', interactive: true, type: 'share', hint: '你有没有帮助过别人呢？' }
    ];
    storyData.lines = story;
    playInteractiveStory();
  },

  '学古诗': function() {
    currentMode = 'poem';
    addMessage('left', '太好啦！今天我们来学一首李白的《静夜思》。小箱一句一句教你，你跟着读哦~', 'text');
    setTimeout(function() {
      showPoemCard(0);
    }, 800);
  },

  '唱儿歌': function() {
    currentMode = 'song';
    songData.currentLine = 0;
    addMessage('left', '啦啦啦~ 小箱来教你唱《小星星》！我唱一句，你跟一句，好不好？', 'text');
    setTimeout(function() {
      showSongCard();
    }, 800);
  },

  '玩游戏': function() {
    currentMode = 'game';
    addMessage('left', '我们来玩猜谜语吧！这个谜语有点难哦，你猜猜看~', 'text');
    setTimeout(function() {
      showRiddleCard();
    }, 800);
  },

  '问问题': function() {
    addMessage('left', '小明有什么想问的吗？天文地理、动物植物、历史故事，小箱什么都知道哦~ 你问吧！', 'text');
  }
};

/* ========== 显示古诗互动卡片 ========== */
function showPoemCard(lineIndex) {
  if (lineIndex >= poemData.lines.length) {
    setTimeout(function() {
      addMessage('left', '太棒啦！你背完整首诗了！🎉\n\n' + poemData.explain + '\n\n小明真厉害，小箱给你一颗星星！⭐', 'text');
      showStarReward('背古诗小达人');
      currentMode = null;
    }, 500);
    return;
  }

  var card = document.createElement('div');
  card.className = 'chat-msg left';
  card.id = 'poem-card-' + lineIndex;

  var hiddenLines = '';
  for (var i = 0; i < poemData.lines.length; i++) {
    if (i === lineIndex) {
      hiddenLines += '<div class="poem-line hidden" id="poem-line-' + i + '" onclick="revealPoemLine(' + i + ')">' + poemData.lines[i] + '</div>';
    } else if (i < lineIndex) {
      hiddenLines += '<div class="poem-line revealed">' + poemData.lines[i] + '</div>';
    } else {
      hiddenLines += '<div class="poem-line hidden" style="opacity:0.3">• • • • •</div>';
    }
  }

  card.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' +
    '<div class="poem-card">' +
      '<div class="poem-title">📜 ' + poemData.title + ' · 第' + (lineIndex + 1) + '句</div>' +
      hiddenLines +
      '<div class="poem-hint">💡 提示：' + poemData.hints[lineIndex] + '（点击空白处揭晓）</div>' +
      '<button class="poem-action-btn" onclick="revealPoemLine(' + lineIndex + ')">我记住了，揭晓答案！</button>' +
    '</div>';

  msgArea.appendChild(card);
  msgArea.scrollTop = msgArea.scrollHeight;
}

function revealPoemLine(idx) {
  var line = document.getElementById('poem-line-' + idx);
  if (!line || line.classList.contains('revealed')) return;
  line.classList.remove('hidden');
  line.classList.add('revealed');

  setTimeout(function() {
    addMessage('left', '第' + (idx + 1) + '句是："' + poemData.lines[idx] + '"\n\n跟我一起读一遍吧！', 'text');
    setTimeout(function() {
      showPoemCard(idx + 1);
    }, 1500);
  }, 600);
}

/* ========== 显示儿歌互动卡片 ========== */
function showSongCard() {
  var lineIdx = songData.currentLine;
  if (lineIdx >= songData.fullLyrics.length) {
    setTimeout(function() {
      addMessage('left', '太棒了！你唱完一整首歌啦！🎵🎉\n\n小箱给你鼓掌！要不要再来一首？', 'text');
      showStarReward('小小歌唱家');
      currentMode = null;
    }, 500);
    return;
  }

  var card = document.createElement('div');
  card.className = 'chat-msg left';

  var lyricsHtml = '';
  for (var i = 0; i < songData.fullLyrics.length; i++) {
    if (i === lineIdx) {
      lyricsHtml += '<div class="highlight">' + songData.fullLyrics[i] + ' 👈</div>';
    } else if (i < lineIdx) {
      lyricsHtml += '<div>' + songData.fullLyrics[i] + '</div>';
    } else {
      lyricsHtml += '<div style="opacity:0.3">' + songData.fullLyrics[i] + '</div>';
    }
  }

  card.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' +
    '<div class="song-card">' +
      '<div class="song-title">🎵 ' + songData.title + ' · 第' + (lineIdx + 1) + '句</div>' +
      '<div class="song-lyrics">' + lyricsHtml + '</div>' +
      '<div class="song-hint">小箱唱："' + songData.fullLyrics[lineIdx] + '"<br>该你唱啦！</div>' +
      '<button class="song-action-btn" onclick="nextSongLine()">我唱完啦，下一句！</button>' +
    '</div>';

  msgArea.appendChild(card);
  msgArea.scrollTop = msgArea.scrollHeight;
}

function nextSongLine() {
  songData.currentLine++;
  setTimeout(function() {
    showSongCard();
  }, 400);
}

/* ========== 显示猜谜互动卡片 ========== */
function showRiddleCard() {
  var card = document.createElement('div');
  card.className = 'chat-msg left';
  card.id = 'riddle-card';

  var optionsHtml = '';
  for (var i = 0; i < riddleData.options.length; i++) {
    optionsHtml += '<button class="game-option" id="riddle-opt-' + i + '" onclick="answerRiddle(' + i + ')">' + riddleData.options[i] + '</button>';
  }

  card.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' +
    '<div class="game-card">' +
      '<div class="game-title">🎮 猜谜语</div>' +
      '<div class="game-question">' + riddleData.question + '</div>' +
      '<div class="game-options">' + optionsHtml + '</div>' +
      '<div id="riddle-result"></div>' +
    '</div>';

  msgArea.appendChild(card);
  msgArea.scrollTop = msgArea.scrollHeight;
}

function answerRiddle(choice) {
  var resultDiv = document.getElementById('riddle-result');
  var correct = choice === riddleData.answer;

  for (var i = 0; i < riddleData.options.length; i++) {
    var btn = document.getElementById('riddle-opt-' + i);
    btn.disabled = true;
    btn.style.cursor = 'default';
    if (i === riddleData.answer) {
      btn.classList.add('correct');
    } else if (i === choice && !correct) {
      btn.classList.add('wrong');
    }
  }

  if (correct) {
    resultDiv.innerHTML = '<div class="game-result win">🎉 答对啦！' + riddleData.explain + '</div>';
    setTimeout(function() {
      showStarReward('猜谜小能手');
    }, 800);
  } else {
    resultDiv.innerHTML = '<div class="game-result lose">😅 不对哦~ 答案是"人"！' + riddleData.explain + '</div>';
  }

  currentMode = null;
  msgArea.scrollTop = msgArea.scrollHeight;
}

/* ========== 显示星星奖励 ========== */
function showStarReward(title) {
  var div = document.createElement('div');
  div.className = 'chat-msg left';
  div.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' +
    '<div class="star-reward">' +
      '<span class="star-icon">⭐</span>' +
      '<span class="star-text">获得称号：' + title + '！</span>' +
    '</div>';
  msgArea.appendChild(div);
  msgArea.scrollTop = msgArea.scrollHeight;
}

/* ========== 故事接龙 ========== */
function showStoryChain() {
  var card = document.createElement('div');
  card.className = 'chat-msg left';
  card.id = 'story-chain-card';

  var storyHtml = '';
  for (var i = 0; i < storyChain.lines.length; i++) {
    storyHtml += '<div style="margin-bottom:6px;color:#333">' + (i === 0 ? '🌳 ' : '✏️ ') + storyChain.lines[i] + '</div>';
  }

  card.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' +
    '<div class="game-card">' +
      '<div class="game-title">📖 故事接龙</div>' +
      '<div style="font-size:13px;line-height:1.7;margin-bottom:10px">' + storyHtml + '</div>' +
      '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">轮到你了！接着编下去吧~</div>' +
      '<div class="story-chain-input">' +
        '<input type="text" id="chainInput" placeholder="接着讲故事...">' +
        '<button onclick="submitStoryChain()">接龙</button>' +
      '</div>' +
    '</div>';

  msgArea.appendChild(card);
  msgArea.scrollTop = msgArea.scrollHeight;

  // 绑定回车事件
  var chainInput = document.getElementById('chainInput');
  if (chainInput) {
    chainInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitStoryChain();
    });
  }
}

function submitStoryChain() {
  var input = document.getElementById('chainInput');
  if (!input || !input.value.trim()) return;
  var text = input.value.trim();

  var oldCard = document.getElementById('story-chain-card');
  if (oldCard) oldCard.remove();

  addMessage('right', text, 'text');
  storyChain.lines.push(text);

  setTimeout(function() {
    var aiContinues = [
      '然后呢？大树又说："我可以帮你实现一个愿望哦！"',
      '突然，森林里传来一阵奇怪的声音...',
      '这时候，一只小松鼠跳到了大树的肩膀上...',
      '天渐渐黑了，星星一颗一颗亮了起来...'
    ];
    var aiLine = aiContinues[Math.floor(Math.random() * aiContinues.length)];
    addMessage('left', aiLine, 'text');
    storyChain.lines.push(aiLine);

    setTimeout(function() {
      showStoryChain();
    }, 800);
  }, 600);
}

/* ========== 播放互动故事 ========== */
function playInteractiveStory() {
  if (storyProgress >= storyData.lines.length) {
    currentMode = null;
    return;
  }
  var item = storyData.lines[storyProgress];
  addMessage('left', item.text, 'text');
  if (item.interactive) {
    setTimeout(function() {
      showStoryPrompt(item);
    }, 600);
  } else {
    storyProgress++;
    setTimeout(function() {
      playInteractiveStory();
    }, 1800);
  }
}

function showStoryPrompt(item) {
  var card = document.createElement('div');
  card.className = 'chat-msg left';
  card.id = 'story-prompt-card';
  var promptText = item.hint || '你觉得呢？';
  var btnText = item.type === 'guess' ? '我猜...' : '我要分享...';
  card.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' +
    '<div class="game-card" style="max-width:80%">' +
      '<div class="game-title">💬 互动时间</div>' +
      '<div class="game-question" style="font-size:13px">' + promptText + '</div>' +
      '<div class="story-chain-input">' +
        '<input type="text" id="storyInput" placeholder="输入你的想法...">' +
        '<button onclick="submitStoryAnswer()">' + btnText + '</button>' +
      '</div>' +
    '</div>';
  msgArea.appendChild(card);
  msgArea.scrollTop = msgArea.scrollHeight;
  var input = document.getElementById('storyInput');
  if (input) {
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitStoryAnswer();
    });
    input.focus();
  }
}

function submitStoryAnswer() {
  var input = document.getElementById('storyInput');
  if (!input || !input.value.trim()) return;
  var text = input.value.trim();
  var card = document.getElementById('story-prompt-card');
  if (card) card.remove();
  addMessage('right', text, 'text');
  storyProgress++;
  var typing = showTyping();
  setTimeout(function() {
    hideTyping();
    var feedback = storyFeedback[Math.floor(Math.random() * storyFeedback.length)];
    addMessage('left', feedback, 'text');
    setTimeout(function() {
      playInteractiveStory();
    }, 1200);
  }, 800);
}

var storyFeedback = [
  '哇，你的想法真有意思！小箱都没想到呢~',
  '嗯嗯，小箱觉得你说得很有道理！',
  '哈哈，小明真聪明！小箱给你点赞！👍',
  '真的吗？太棒了！然后呢？',
  '小箱最喜欢听你分享了！继续说~',
  '哇哦，小明观察得好仔细呀！'
];

/* ========== 播放故事序列（旧版兼容） ========== */
function playStorySequence(storyLines) {
  storyLines.forEach(function(line, i) {
    setTimeout(function() {
      addMessage('left', line, 'text');
    }, i * 1200);
  });
}

/* ========== 通用AI回复 ========== */
var aiReplies = [
  '哇，真的吗？太有趣了！然后呢？',
  '小明真棒！小箱最喜欢听你讲故事了~',
  '嗯嗯，小箱明白了！你说的真好~',
  '哈哈，这也太好笑了吧！小箱都要笑倒了🤣',
  '小明好厉害呀！小箱为你鼓掌！👏',
  '原来是这样！小箱又学到了新东西~',
  '小明说的故事好感动呀，小箱都感动了呢...',
  '嗯嗯，小箱觉得你说得很有道理！',
  '你猜接下来发生了什么？',
  '如果是你，你会怎么做呢？',
  '结果怎样你知道吗？快告诉小箱！',

];

/* ========== AI诚实回复（不知道时） ========== */
var honestReplies = [
  '这个问题小箱也不太确定呢，我们一起查一查好吗？',
  '哇，这个问题好难呀，小箱暂时还不知道答案...',
  '小箱也在学习中，这个问题等我学会了再告诉你！',
  '这个问题超纲啦！不过小箱可以陪你一起想~',
  '小箱不知道呢，但小明可以问问爸爸妈妈呀~'
];

/* ========== AI质量提示语 ========== */
var qualityHints = [
  '💡 小箱的回答来自AI，如果有不对的地方，小明可以纠正我哦~',
  '💡 如果小箱说错了，记得告诉爸爸妈妈帮我改正！',
  '💡 小箱还在学习中，有时候可能会说错话呢~'
];

/* ========== 基础函数 ========== */
function init() {
  addTimeLabel('今天');
  initialMessages.forEach(function(msg, i) {
    setTimeout(function() {
      addMessage(msg.side, msg.text, msg.type);
    }, i * 600);
  });
}

function addTimeLabel(text) {
  var div = document.createElement('div');
  div.className = 'time-label';
  div.textContent = text;
  msgArea.appendChild(div);
}

function addMessage(side, text, type) {
  var div = document.createElement('div');
  div.className = 'chat-msg ' + side;
  if (type === 'voice') {
    var dur = text;
    var bars = '';
    for (var i = 0; i < 6; i++) bars += '<span></span>';
    var bubble = '<div class="chat-msg-bubble voice-bubble"><div class="voice-bars">' + bars + '</div><span class="voice-dur">' + dur + '</span></div>';
    if (side === 'left') {
      div.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' + bubble;
    } else {
      div.innerHTML = bubble + '<div class="chat-msg-avatar" style="background:linear-gradient(135deg,#ff9a56,#ff6b9d)">😊</div>';
    }
  } else {
    var bubbleText = '<div class="chat-msg-bubble">' + text.replace(/\n/g, '<br>') + '</div>';
    if (side === 'left') {
      div.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' + bubbleText;
    } else {
      div.innerHTML = bubbleText + '<div class="chat-msg-avatar" style="background:linear-gradient(135deg,#ff9a56,#ff6b9d)">😊</div>';
    }
  }
  msgArea.appendChild(div);
  msgArea.scrollTop = msgArea.scrollHeight;
}

function showTyping() {
  var div = document.createElement('div');
  div.className = 'chat-msg left';
  div.id = 'typing-msg';
  div.innerHTML = '<div class="chat-msg-avatar" style="background:#fff3e0">🦊</div>' +
    '<div class="chat-msg-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  msgArea.appendChild(div);
  msgArea.scrollTop = msgArea.scrollHeight;
  return div;
}

function hideTyping() {
  var el = document.getElementById('typing-msg');
  if (el) el.remove();
}

function sendMessage() {
  var text = chatInput.value.trim();
  if (!text) return;
  addMessage('right', text, 'text');
  chatInput.value = '';
  updateSendBtn();

  if (currentMode === 'story') {
    var card = document.getElementById('story-prompt-card');
    if (card) {
      card.remove();
      storyProgress++;
    }
    var typing = showTyping();
    setTimeout(function() {
      hideTyping();
      var feedback = storyFeedback[Math.floor(Math.random() * storyFeedback.length)];
      addMessage('left', feedback, 'text');
      setTimeout(function() {
        playInteractiveStory();
      }, 1200);
    }, 800);
    return;
  }

  if (currentMode === 'poem') {
    var typing = showTyping();
    setTimeout(function() {
      hideTyping();
      addMessage('left', '小明读得真好！我们再学下一句吧~', 'text');
    }, 800);
    return;
  }

  if (currentMode === 'song') {
    var typing = showTyping();
    setTimeout(function() {
      hideTyping();
      addMessage('left', '唱得真好听！小箱给你鼓掌~ 👏', 'text');
    }, 800);
    return;
  }

  var typing = showTyping();
  setTimeout(function() {
    hideTyping();
    // 模拟AI不知道的情况（10%概率）
    var isUnknown = Math.random() < 0.1;
    if (isUnknown) {
      var honestReply = honestReplies[Math.floor(Math.random() * honestReplies.length)];
      addMessage('left', honestReply, 'text');
    } else {
      var reply = aiReplies[Math.floor(Math.random() * aiReplies.length)];
      addMessage('left', reply, 'text');
    }
    // 偶尔插入质量提示（15%概率）
    if (Math.random() < 0.15) {
      setTimeout(function() {
        var hint = qualityHints[Math.floor(Math.random() * qualityHints.length)];
        addMessage('left', hint, 'text');
      }, 1200);
    }
  }, 600 + Math.random() * 800);
}

function sendTopic(topic) {
  addMessage('right', topic, 'text');
  var typing = showTyping();
  setTimeout(function() {
    hideTyping();
    var handler = topicHandlers[topic];
    if (handler) {
      handler();
    } else {
      addMessage('left', '好呀，小箱来陪你！', 'text');
    }
  }, 500);
}

function updateSendBtn() {
  sendBtn.disabled = !chatInput.value.trim();
}

function toggleVoice() {
  isRecording = !isRecording;
  if (isRecording) {
    voiceBtn.classList.add('recording');
    voiceBtn.innerHTML = '<i class="fa-solid fa-stop"></i>';
    chatInput.placeholder = '录音中...松开发送';
  } else {
    voiceBtn.classList.remove('recording');
    voiceBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
    chatInput.placeholder = '和小箱说点什么...';
    var dur = Math.floor(Math.random() * 8) + 3;
    addMessage('right', dur + '"', 'voice');
    var typing = showTyping();
    setTimeout(function() {
      hideTyping();
      addMessage('left', '小箱听到啦！你说的真棒~', 'text');
    }, 800);
  }
}

// 绑定输入框事件
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.trim()) {
    sendMessage();
    this.value = '';
    updateSendBtn();
  }
});

chatInput.addEventListener('input', updateSendBtn);

init();

VoiceAssistant.init({
  role: 'companion',
  primaryAvatar: '🦊',
  primaryName: '小箱',
  targets: [
    {id: 'ai', avatar: '🦊', name: '小箱', desc: 'AI故事精灵·在线', online: true, bg: '#fff3e0'},
    {id: 'mom', avatar: '👩', name: '妈妈', desc: '监护人·在线', online: true, bg: '#fce4ec'},
    {id: 'dad', avatar: '👨', name: '爸爸', desc: '监护人·在线', online: true, bg: '#e3f2fd'}
  ],
  messages: [],
  onSend: function(text) {
    setTimeout(function() {
      VoiceAssistant.addAIMessage('小箱收到啦！');
    }, 800);
  }
});
</script>
