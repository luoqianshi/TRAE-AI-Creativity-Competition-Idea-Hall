<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>能力全景仪表盘</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  :root {
    --bg-primary: #0a0e1a;
    --bg-card: #131a2e;
    --bg-card-hover: #1a2340;
    --border: #1e2a4a;
    --text-primary: #e8ecf4;
    --text-secondary: #8892a8;
    --text-dim: #505a70;
    --accent-blue: #4a9eff;
    --accent-purple: #a855f7;
    --accent-green: #22c55e;
    --accent-yellow: #eab308;
    --accent-orange: #f97316;
    --accent-red: #ef4444;
    --accent-pink: #ec4899;
    --accent-cyan: #06b6d4;
    --glow-blue: 0 0 20px rgba(74,158,255,0.3);
    --glow-green: 0 0 20px rgba(34,197,94,0.3);
    --glow-purple: 0 0 20px rgba(168,85,247,0.3);
    --glow-yellow: 0 0 20px rgba(234,179,8,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    overscroll-behavior-x: none;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
  }

  /* ===== Hero Header ===== */
  .hero {
    text-align: center;
    padding: 40px 20px 30px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at center, rgba(74,158,255,0.08) 0%, transparent 60%);
    animation: pulse-bg 4s ease-in-out infinite;
  }
  @keyframes pulse-bg {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .hero-name {
    font-size: 2.4em;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
    letter-spacing: 2px;
  }
  .hero-subtitle {
    color: var(--text-secondary);
    font-size: 1em;
    margin-top: 6px;
    position: relative;
  }
  .hero-class {
    display: inline-block;
    background: linear-gradient(135deg, rgba(74,158,255,0.15), rgba(168,85,247,0.15));
    border: 1px solid rgba(74,158,255,0.3);
    padding: 4px 16px;
    border-radius: 20px;
    font-size: 0.85em;
    color: var(--accent-blue);
    margin-top: 10px;
    position: relative;
  }
  .hero-edit-hint {
    font-size: 0.85em;
    margin-left: 6px;
    opacity: 0.6;
  }
  .hero-worn-badge {
    font-size: 0.7em;
    margin-right: 6px;
    display: inline-block;
    animation: worn-badge-pulse 2s ease-in-out infinite;
  }
  @keyframes worn-badge-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  /* ── Avatar row layout ── */
  .hero-avatar-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    position: relative;
  }
  .hero-avatar-img {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(74,158,255,0.4);
    box-shadow: 0 0 12px rgba(74,158,255,0.2);
    flex-shrink: 0;
    background: var(--bg-main);
  }
  .hero-avatar-fallback {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8em;
    background: linear-gradient(135deg, rgba(74,158,255,0.15), rgba(168,85,247,0.15));
    border: 2px solid rgba(74,158,255,0.3);
    flex-shrink: 0;
  }
  .hero-name-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
  }
  .hero-worn-badge-right {
    font-size: 1.6em;
    margin-left: 4px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 20px;
    padding: 4px 10px;
    line-height: 1;
    animation: worn-badge-pulse 2s ease-in-out infinite;
    cursor: default;
  }
  .hero-worn-badge-right.tier-bronze {
    background: rgba(205,127,50,0.12);
    border: 1.5px solid rgba(205,127,50,0.5);
  }
  .hero-worn-badge-right.tier-bronze .wear-badge-name { color: #CD7F32; }
  .hero-worn-badge-right.tier-silver {
    background: rgba(192,192,192,0.12);
    border: 1.5px solid rgba(192,192,192,0.5);
  }
  .hero-worn-badge-right.tier-silver .wear-badge-name { color: #C0C0C0; }
  .hero-worn-badge-right.tier-gold {
    background: rgba(255,215,0,0.12);
    border: 1.5px solid rgba(255,215,0,0.5);
  }
  .hero-worn-badge-right.tier-gold .wear-badge-name { color: #FFD700; }
  /* ── Avatar picker in profile modal ── */
  .avatar-current-preview {
    width: 72px; height: 72px; border-radius: 50%;
    margin: 0 auto 14px; overflow: hidden;
    border: 3px solid var(--accent-blue);
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-main); font-size: 2.2em;
    position: relative;
  }
  .avatar-current-preview img {
    width: 100%; height: 100%; object-fit: cover;
  }
  .avatar-preset-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 14px;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
  }
  .avatar-preset-grid.expanded {
    max-height: 300px; opacity: 1;
  }
  .avatar-toggle-btn {
    display: block; width: 100%; padding: 10px;
    border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary);
    cursor: pointer; font-size: 0.9em; transition: all 0.2s;
    margin-bottom: 10px;
  }
  .avatar-toggle-btn:hover {
    border-color: var(--accent-blue); color: var(--accent-blue);
  }
  .wear-badge-grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 8px; margin-bottom: 10px;
  }
  .wear-badge-item {
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 4px; border-radius: 12px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s;
    background: var(--bg-main);
  }
  .wear-badge-item:hover {
    border-color: var(--border); transform: scale(1.05);
  }
  .wear-badge-item.wear-selected {
    border-color: var(--accent-blue);
    background: rgba(74,158,255,0.08);
    box-shadow: 0 0 8px rgba(74,158,255,0.25);
  }
  .wear-badge-item.wear-hidden {
    display: none;
  }
  .wear-badge-item.wear-hidden.wear-show {
    display: flex;
  }
  .wear-badge-icon { font-size: 1.5em; line-height: 1; }
  .wear-badge-name {
    font-size: 0.7em; color: var(--text-secondary);
    margin-top: 4px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%;
  }
  .wear-badge-item.wear-selected .wear-badge-name {
    color: var(--accent-blue); font-weight: 600;
  }
  .avatar-preset-item {
    width: 100%; aspect-ratio: 1; border-radius: 50%;
    object-fit: cover; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s;
    background: var(--bg-main);
  }
  .avatar-preset-item:hover {
    border-color: var(--accent-blue); transform: scale(1.08);
  }
  .avatar-preset-item.avatar-selected {
    border-color: var(--accent-blue);
    box-shadow: 0 0 10px rgba(74,158,255,0.4);
  }
  .avatar-upload-btn {
    display: block; width: 100%; padding: 10px;
    border-radius: 10px; border: 1px dashed var(--border);
    background: transparent; color: var(--text-secondary);
    cursor: pointer; font-size: 0.9em; transition: all 0.2s;
  }
  .avatar-upload-btn:hover {
    border-color: var(--accent-blue); color: var(--accent-blue);
  }
  .badge-worn-indicator {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 12px;
    font-size: 0.8em;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, rgba(234,179,8,0.15), rgba(234,179,8,0.05));
    color: var(--accent-yellow);
    border: 1px solid rgba(234,179,8,0.3);
  }
  .badge-wear-btn {
    display: block;
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    font-size: 0.9em;
    font-weight: 600;
    cursor: pointer;
    border: none;
    margin-bottom: 10px;
    transition: all 0.3s;
  }
  .badge-wear-btn.wear {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: #fff;
  }
  .badge-wear-btn.unwear {
    background: rgba(100,116,139,0.15);
    color: var(--text-secondary);
  }
  .badge-wear-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .badge-changes-info {
    font-size: 0.78em;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 12px;
  }

  /* ===== Profile Edit Modal ===== */
  .profile-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
  }
  .profile-modal-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 20px;
    max-width: 400px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .profile-modal-title {
    text-align: center;
    font-size: 1.2em;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 20px;
  }
  .profile-field {
    margin-bottom: 14px;
  }
  .profile-field label {
    display: block;
    font-size: 0.82em;
    color: var(--text-secondary);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .profile-field label span {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 0.9em;
  }
  .profile-field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-main);
    color: var(--text-primary);
    font-size: 0.95em;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }
  .profile-field input:focus {
    border-color: var(--accent-blue);
  }
  .profile-field input:read-only {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .profile-field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-main);
    color: var(--text-main);
    font-size: 0.95em;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
    appearance: auto;
  }
  .profile-field select:focus {
    border-color: var(--accent-blue);
  }
  .profile-field select:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .profile-modal-error {
    color: var(--accent-red);
    font-size: 0.85em;
    text-align: center;
    margin-bottom: 12px;
    min-height: 1.2em;
  }
  .profile-modal-btns {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }
  .profile-modal-btns button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.3s;
  }
  .profile-btn-cancel {
    background: rgba(100,116,139,0.15);
    color: var(--text-secondary);
  }
  .profile-btn-save {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: #fff;
  }
  .profile-btn-save:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  /* ===== Level System ===== */
  .level-section {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin: 25px 0;
    flex-wrap: wrap;
  }
  .level-badge {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: var(--glow-blue);
    position: relative;
    flex-shrink: 0;
  }
  .level-badge::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: var(--bg-primary);
    z-index: 0;
  }
  .level-badge span {
    position: relative;
    z-index: 1;
  }
  .level-num {
    font-size: 2em;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .level-label {
    font-size: 0.65em;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .xp-container {
    flex: 1;
    min-width: 250px;
    max-width: 400px;
  }
  .xp-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.85em;
    margin-bottom: 6px;
  }
  .xp-text { color: var(--accent-blue); font-weight: 500; }
  .xp-next { color: var(--text-dim); }
  .xp-bar-bg {
    height: 12px;
    background: rgba(74,158,255,0.1);
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(74,158,255,0.2);
  }
  .xp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
    border-radius: 6px;
    transition: width 1.5s ease;
    position: relative;
  }
  .xp-bar-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ===== Stats Row ===== */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 20px 0;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    transition: all 0.3s;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent-blue);
    box-shadow: var(--glow-blue);
  }
  .stat-value {
    font-size: 1.8em;
    font-weight: 900;
  }
  .stat-label {
    font-size: 0.8em;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .stat-icon { font-size: 1.3em; margin-bottom: 4px; }

  /* ===== Section Title ===== */
  .section-title {
    font-size: 1.3em;
    font-weight: 700;
    margin: 35px 0 18px;
    padding-left: 14px;
    border-left: 3px solid var(--accent-blue);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ===== Radar Section ===== */
  .radar-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 20px 0;
  }
  @media (max-width: 900px) {
    .radar-section { grid-template-columns: 1fr; }
  }
  .chart-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s;
  }
  .chart-card:hover {
    border-color: rgba(74,158,255,0.4);
  }
  .chart-card h3 {
    font-size: 1em;
    color: var(--text-secondary);
    margin-bottom: 16px;
    text-align: center;
  }
  .chart-wrap {
    position: relative;
    max-width: 400px;
    margin: 0 auto;
    aspect-ratio: 1 / 1;
  }

  /* ===== Subject Cards ===== */
  .subject-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 18px;
    margin: 20px 0;
  }
  .subject-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .subject-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .subject-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
  }
  .subject-card.chinese::before { background: linear-gradient(90deg, var(--accent-red), var(--accent-orange)); }
  .subject-card.math::before { background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan)); }
  .subject-card.english::before { background: linear-gradient(90deg, var(--accent-green), var(--accent-cyan)); }
  .subject-card.science::before { background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink)); }

  .subject-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .subject-name {
    font-size: 1.2em;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .subject-score {
    font-size: 1.5em;
    font-weight: 900;
  }
  .subject-score-label {
    font-size: 0.7em;
    color: var(--text-dim);
    font-weight: 400;
  }

  .skill-bar-container { margin-bottom: 12px; }
  .skill-bar-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.82em;
    margin-bottom: 4px;
  }
  .skill-name { color: var(--text-secondary); }
  .skill-pct { font-weight: 600; }
  .skill-bar-bg {
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }
  .skill-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1.5s ease;
    position: relative;
  }

  .subject-stats {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .subject-stat {
    font-size: 0.78em;
    color: var(--text-dim);
  }
  .subject-stat strong {
    color: var(--text-secondary);
  }

  /* ===== Strength Cards ===== */
  /* ── Target Score Section ── */
  .target-score-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    margin: 20px 0;
  }
  .target-score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .target-score-row:last-child { border-bottom: none; }
  .target-score-label {
    flex-shrink: 0;
    width: 70px;
    font-size: 0.9em;
    font-weight: 600;
    color: var(--text-primary);
  }
  .target-score-current {
    flex-shrink: 0;
    width: 32px;
    text-align: right;
    font-weight: 800;
    font-size: 1.05em;
    color: var(--text-primary);
  }
  .target-score-bar-bg {
    flex: 1;
    height: 10px;
    background: rgba(74,158,255,0.1);
    border-radius: 5px;
    overflow: hidden;
  }
  .target-score-bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width 0.6s ease;
  }
  .target-score-target {
    flex-shrink: 0;
    width: 32px;
    text-align: left;
    font-size: 0.85em;
    color: var(--text-dim);
    font-weight: 600;
  }
  .target-score-xp {
    flex-shrink: 0;
    width: 60px;
    text-align: right;
    font-size: 0.8em;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .target-score-xp.pending {
    color: var(--accent-blue);
    background: rgba(74,158,255,0.1);
  }
  .target-score-xp.earned {
    color: #f59e0b;
    background: rgba(245,158,11,0.12);
  }
  .target-score-row.reached .target-score-current {
    color: #f59e0b;
  }
  .target-score-row.reached .target-score-bar-fill {
    background: linear-gradient(90deg, #f59e0b, #fbbf24) !important;
  }

  /* ── XP Breakdown Section ── */
  .xp-breakdown-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    margin: 20px 0;
  }
  .xp-breakdown-total {
    text-align: center;
    font-size: 1.8em;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
  }
  .xp-breakdown-total span {
    font-size: 0.45em;
    font-weight: 600;
    -webkit-text-fill-color: var(--text-dim);
  }
  .xp-source-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .xp-source-row:last-child { border-bottom: none; }
  .xp-source-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2em;
    flex-shrink: 0;
  }
  .xp-source-info {
    flex: 1;
    min-width: 0;
  }
  .xp-source-name {
    font-weight: 600;
    font-size: 0.9em;
    color: var(--text-primary);
  }
  .xp-source-detail {
    font-size: 0.78em;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .xp-source-amount {
    flex-shrink: 0;
    font-weight: 800;
    font-size: 1em;
    color: var(--accent-blue);
  }

  .strength-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin: 20px 0;
  }
  .strength-card {
    background: linear-gradient(135deg, rgba(34,197,94,0.08), rgba(34,197,94,0.02));
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    transition: all 0.3s;
  }
  .strength-card:hover {
    border-color: var(--accent-green);
    box-shadow: var(--glow-green);
    transform: translateY(-2px);
  }
  .strength-icon { font-size: 2em; margin-bottom: 8px; }
  .strength-title {
    font-weight: 700;
    font-size: 0.95em;
    color: var(--accent-green);
    margin-bottom: 6px;
  }
  .strength-desc {
    font-size: 0.78em;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* ===== Error Analysis ===== */
  .error-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 20px 0;
  }
  @media (max-width: 900px) {
    .error-section { grid-template-columns: 1fr; }
  }
  .error-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
  }
  .error-card h3 {
    font-size: 1em;
    color: var(--text-secondary);
    margin-bottom: 16px;
    text-align: center;
  }
  canvas {
    touch-action: none;
  }
  .error-legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82em;
    color: var(--text-secondary);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ===== Daily Challenge ===== */
  .challenge-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin: 20px 0;
  }
  .challenge-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .challenge-date {
    color: var(--text-secondary);
    font-size: 0.9em;
  }
  .challenge-progress {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .progress-ring {
    width: 50px;
    height: 50px;
    position: relative;
  }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring circle {
    fill: none;
    stroke-width: 4;
  }
  .progress-ring .bg { stroke: rgba(255,255,255,0.08); }
  .progress-ring .fill {
    stroke: var(--accent-green);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s ease;
  }
  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75em;
    font-weight: 700;
    color: var(--accent-green);
  }
  .progress-label {
    font-size: 0.82em;
    color: var(--text-secondary);
  }

  .challenge-list { list-style: none; }
  .challenge-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 6px;
    transition: all 0.3s;
    cursor: pointer;
    border: 1px solid transparent;
    touch-action: manipulation;
    -webkit-tap-highlight-color: rgba(74,158,255,0.2);
  }
  .challenge-item:hover {
    background: rgba(255,255,255,0.03);
    border-color: var(--border);
  }
  .challenge-item.readonly {
    cursor: default;
  }
  .challenge-item.done {
    opacity: 0.5;
  }
  .challenge-item.done .challenge-text {
    text-decoration: line-through;
  }
  .check-box {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.3s;
    font-size: 0.8em;
  }
  .challenge-item.done .check-box {
    background: var(--accent-green);
    border-color: var(--accent-green);
    color: white;
  }
  .challenge-subject-tag {
    font-size: 0.7em;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .tag-chinese { background: rgba(239,68,68,0.15); color: var(--accent-red); }
  .tag-math { background: rgba(74,158,255,0.15); color: var(--accent-blue); }
  .tag-english { background: rgba(34,197,94,0.15); color: var(--accent-green); }
  .tag-science { background: rgba(168,85,247,0.15); color: var(--accent-purple); }
  .challenge-text {
    flex: 1;
    font-size: 0.9em;
    color: var(--text-secondary);
  }
  .challenge-xp {
    font-size: 0.78em;
    font-weight: 600;
    color: var(--accent-yellow);
    flex-shrink: 0;
  }

  /* ===== Growth Timeline ===== */
  .timeline-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin: 20px 0;
  }
  .timeline {
    position: relative;
    padding-left: 30px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--accent-blue), var(--accent-purple), var(--accent-green));
  }
  .timeline-item {
    position: relative;
    margin-bottom: 24px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: -24px;
    top: 18px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-blue);
    border: 2px solid var(--bg-primary);
  }
  .timeline-item.milestone::before {
    background: var(--accent-green);
    box-shadow: var(--glow-green);
    width: 14px;
    height: 14px;
    left: -26px;
  }
  .timeline-date {
    font-size: 0.78em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .timeline-title {
    font-weight: 600;
    font-size: 0.95em;
    margin-bottom: 4px;
  }
  .timeline-desc {
    font-size: 0.82em;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .timeline-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 0.72em;
    font-weight: 600;
    margin-top: 8px;
  }
  .badge-start { background: rgba(74,158,255,0.15); color: var(--accent-blue); }
  .badge-error { background: rgba(234,179,8,0.15); color: var(--accent-yellow); }
  .badge-task { background: rgba(34,197,94,0.15); color: var(--accent-green); }
  .badge-xp { background: rgba(249,115,22,0.15); color: var(--accent-orange); }
  .badge-streak { background: rgba(239,68,68,0.15); color: var(--accent-red); }
  .badge-master { background: rgba(34,197,94,0.15); color: var(--accent-green); }
  .badge-badge { background: rgba(168,85,247,0.15); color: var(--accent-purple); }
  .badge-level { background: rgba(6,182,212,0.15); color: var(--accent-cyan); }

  .timeline-hidden {
    display: none;
  }
  .timeline-toggle {
    text-align: center;
    padding: 10px;
    margin-top: 8px;
    color: var(--accent-blue);
    font-size: 0.85em;
    font-weight: 500;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .timeline-toggle:hover {
    background: rgba(74,158,255,0.08);
  }

  /* ===== Insight Section ===== */
  .insight-card {
    background: linear-gradient(135deg, rgba(168,85,247,0.1), rgba(74,158,255,0.1));
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 16px;
    padding: 28px;
    margin: 20px 0;
    text-align: center;
  }
  .insight-icon { font-size: 2.5em; margin-bottom: 12px; }
  .insight-title {
    font-size: 1.3em;
    font-weight: 700;
    margin-bottom: 10px;
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .insight-text {
    color: var(--text-secondary);
    line-height: 1.8;
    max-width: 700px;
    margin: 0 auto;
    font-size: 0.92em;
  }
  .insight-highlight {
    color: var(--accent-yellow);
    font-weight: 600;
  }

  /* ===== Heatmap (Calendar Style) ===== */
  .heatmap-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 16px;
    margin: 20px 0;
  }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .cal-weekdays span {
    text-align: center;
    font-size: 0.7em;
    color: var(--text-dim);
    font-weight: 600;
    padding: 4px 0;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75em;
    font-weight: 600;
    transition: all 0.3s;
    position: relative;
    cursor: default;
  }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.heat-0 { background: rgba(255,255,255,0.04); color: var(--text-dim); }
  .cal-cell.heat-1 { background: rgba(34,197,94,0.2); color: rgba(34,197,94,0.7); }
  .cal-cell.heat-2 { background: rgba(34,197,94,0.35); color: rgba(34,197,94,0.9); }
  .cal-cell.heat-3 { background: rgba(34,197,94,0.55); color: #fff; }
  .cal-cell.heat-4 { background: rgba(34,197,94,0.8); color: #fff; box-shadow: 0 0 8px rgba(34,197,94,0.4); }
  .cal-cell.today { border: 1.5px solid var(--accent-blue); }
  .cal-cell.future { opacity: 0.3; }
  .cal-cell:hover { transform: scale(1.1); }
  .heatmap-labels {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
    font-size: 0.72em;
    color: var(--text-dim);
  }
  .heatmap-labels span {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cal-month-label {
    text-align: center;
    font-size: 0.85em;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  /* ===== Motivation Banner ===== */
  /* Monthly Challenge */
  .monthly-challenge-card {
    background: var(--bg-card);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid var(--border);
  }
  .monthly-achieved {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
  }
  .monthly-achieved-text {
    font-size: 1em;
    font-weight: 500;
  }
  .monthly-progress-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .monthly-metric {
    background: var(--bg-main);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .monthly-metric-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.82em;
    margin-bottom: 6px;
    color: var(--text-dim);
  }
  .monthly-metric-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .monthly-metric-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }
  .monthly-hint {
    margin-top: 14px;
    text-align: center;
    font-size: 0.85em;
    color: var(--text-dim);
  }

  .motivation-banner {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    border-radius: 16px;
    padding: 24px 30px;
    margin: 30px 0 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .motivation-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .motivation-text {
    position: relative;
    font-size: 1.2em;
    font-weight: 700;
    color: white;
    line-height: 1.6;
  }
  .motivation-sub {
    position: relative;
    font-size: 0.85em;
    color: rgba(255,255,255,0.8);
    margin-top: 8px;
  }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-dim);
    font-size: 0.78em;
  }

  /* ===== Animations ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in {
    animation: fadeInUp 0.6s ease forwards;
    opacity: 0;
  }

  /* ===== Tooltip ===== */
  .tooltip {
    position: relative;
  }
  .tooltip::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.75em;
    color: var(--text-secondary);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .tooltip:hover::after { opacity: 1; }

  /* ===== Tab System ===== */
  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
    overflow-x: auto;
  }
  .tab {
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 0.85em;
    cursor: pointer;
    transition: all 0.3s;
    color: var(--text-dim);
    white-space: nowrap;
    border: none;
    background: none;
    font-family: inherit;
  }
  .tab.active {
    background: var(--accent-blue);
    color: white;
    font-weight: 600;
  }
  .tab:hover:not(.active) {
    color: var(--text-primary);
    background: rgba(255,255,255,0.06);
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ===== Responsive - Tablet ===== */
  @media (max-width: 900px) {
    .radar-section { grid-template-columns: 1fr; }
    .error-section { grid-template-columns: 1fr; }
    .hero { padding: 30px 16px 20px; }
    .hero-name { font-size: 2em; }
    .section-title { font-size: 1.15em; margin: 28px 0 14px; }
    .insight-text { font-size: 0.88em; }
  }

  /* ===== Responsive - Mobile (H5) ===== */
  @media (max-width: 600px) {
    .container { padding: 10px; }

    /* Header */
    .hero { padding: 20px 12px 14px; }
    .hero-name { font-size: 1.5em; letter-spacing: 1px; }
    .hero-subtitle { font-size: 0.8em; margin-top: 4px; }
    .hero-class { font-size: 0.75em; padding: 3px 10px; margin-top: 8px; }
    .hero-avatar-img, .hero-avatar-fallback { width: 44px; height: 44px; font-size: 1.4em; }
    .hero-avatar-row { gap: 10px; }

    /* Level */
    .level-section {
      gap: 10px;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      margin: 16px 0;
    }
    .level-badge { width: 64px; height: 64px; }
    .level-num { font-size: 1.4em; }
    .level-label { font-size: 0.55em; }
    .xp-container { min-width: unset; max-width: unset; flex: 1; min-width: 180px; }
    .xp-header { font-size: 0.8em; }
    .xp-bar-bg { height: 10px; }

    /* Stats - 5 cards with centered bottom row */
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .stat-card {
      flex: 1 1 calc(33.33% - 8px);
      max-width: calc(33.33% - 6px);
      padding: 10px 6px;
      border-radius: 10px;
    }
    .stat-value { font-size: 1.3em; }
    .stat-label { font-size: 0.68em; }
    .stat-icon { font-size: 1em; margin-bottom: 2px; }

    /* Insight */
    .insight-card { padding: 18px 14px; margin: 16px 0; border-radius: 12px; }
    .insight-icon { font-size: 1.8em; margin-bottom: 8px; }
    .insight-title { font-size: 1em; margin-bottom: 8px; }
    .insight-text { font-size: 0.8em; line-height: 1.7; }
    .insight-highlight { font-size: 0.82em; }

    /* Section Title */
    .section-title { font-size: 1em; margin: 22px 0 12px; padding-left: 10px; gap: 6px; }

    /* Charts */
    .chart-card { padding: 14px; border-radius: 12px; }
    .chart-card h3 { font-size: 0.85em; margin-bottom: 12px; }
    .chart-wrap { max-width: 300px; }
    .error-legend { gap: 10px; margin-top: 12px; }
    .legend-item { font-size: 0.72em; }

    /* Strength Cards - prevent text overflow */
    .strength-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .strength-card {
      padding: 12px 10px;
      border-radius: 10px;
      overflow: hidden;
    }
    .strength-icon { font-size: 1.4em; margin-bottom: 4px; }
    .strength-title { font-size: 0.8em; margin-bottom: 4px; }
    .strength-desc {
      font-size: 0.68em;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Subject Cards */
    .subject-grid { grid-template-columns: 1fr; gap: 12px; }
    .subject-card { padding: 16px; border-radius: 12px; }
    .subject-header { margin-bottom: 14px; }
    .subject-name { font-size: 1em; }
    .subject-score { font-size: 1.2em; }
    .skill-bar-container { margin-bottom: 10px; }
    .skill-bar-header { font-size: 0.75em; }
    .skill-bar-bg { height: 6px; }
    .subject-stats {
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      padding-top: 10px;
    }
    .subject-stat { font-size: 0.7em; }

    /* Error Section */
    .error-section { gap: 12px; }
    .error-card { padding: 16px; border-radius: 12px; }
    .error-card h3 { font-size: 0.85em; }

    /* Challenge */
    .challenge-card { padding: 16px; border-radius: 12px; }
    .challenge-header {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .challenge-item {
      padding: 10px 8px;
      gap: 6px;
      min-height: 44px;
      flex-wrap: nowrap;
    }
    .check-box { width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0; }
    .challenge-subject-tag { font-size: 0.6em; padding: 2px 5px; flex-shrink: 0; }
    .challenge-text {
      font-size: 0.78em;
      line-height: 1.4;
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }
    .challenge-xp { font-size: 0.68em; flex-shrink: 0; }
    .progress-ring { width: 42px; height: 42px; }
    .progress-text { font-size: 0.68em; }
    .progress-label { font-size: 0.75em; }

    /* Timeline */
    .timeline-card { padding: 16px; border-radius: 12px; }
    .timeline { padding-left: 20px; }
    .timeline::before { left: 8px; }
    .timeline-item {
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 8px;
    }
    .timeline-item::before { left: -18px; width: 8px; height: 8px; }
    .timeline-item.milestone::before { width: 12px; height: 12px; left: -20px; }
    .timeline-date { font-size: 0.7em; }
    .timeline-title { font-size: 0.85em; }
    .timeline-desc { font-size: 0.75em; line-height: 1.5; }
    .timeline-badge { font-size: 0.65em; }

    /* Heatmap */
    .heatmap-card { padding: 16px; border-radius: 12px; }
    .heatmap-cell { width: 10px; height: 10px; border-radius: 2px; }
    .heatmap-labels { font-size: 0.68em; gap: 8px; flex-wrap: wrap; justify-content: center; }

    /* Badges */
    .badge-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
    .badge-card { padding: 10px 4px; }
    .badge-icon { font-size: 1.4em; }
    .badge-name { font-size: 0.65em; }
    .badge-desc { font-size: 0.55em; }
    .badge-category-title { font-size: 0.82em; margin: 16px 0 8px; }

    /* Motivation Banner */
    .motivation-banner { padding: 18px 14px; border-radius: 12px; margin: 24px 0 8px; }
    .motivation-text { font-size: 0.95em; }
    .motivation-sub { font-size: 0.75em; margin-top: 6px; }

    /* Footer */
    .footer { font-size: 0.68em; padding: 20px 12px; }
  }

  /* ===== Very Small Screens (iPhone SE etc.) ===== */
  @media (max-width: 380px) {
    .hero-name { font-size: 1.3em; }
    .stats-row { grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .stat-card { padding: 8px 4px; }
    .stat-value { font-size: 1.1em; }
    .strength-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
    .strength-card { padding: 10px 8px; }
    .strength-desc { -webkit-line-clamp: 2; }
    .challenge-item { gap: 4px; padding: 8px 6px; }
    .challenge-text { font-size: 0.75em; }
  }

  /* ===== Badge / Achievement System ===== */
  .badge-section { margin-top: 10px; }
  .badge-summary-bar {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
    text-align: center;
  }
  .badge-summary-text {
    font-size: 0.88em;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .badge-summary-text strong {
    color: var(--accent-yellow);
    font-size: 1.1em;
  }
  .badge-progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }
  .badge-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-yellow), var(--accent-orange));
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .badge-monthly-wrap {
    background: linear-gradient(135deg, rgba(74,158,255,0.06), rgba(168,85,247,0.06));
    border: 1px solid rgba(74,158,255,0.2);
    border-radius: 14px;
    padding: 16px 14px 14px;
    margin-bottom: 10px;
  }
  .badge-monthly-wrap .badge-category-title {
    font-size: 1em;
    color: var(--accent-blue);
    border-left: 3px solid var(--accent-blue);
    margin-top: 0;
  }
  .badge-category-title {
    font-size: 0.9em;
    font-weight: 700;
    color: var(--text-secondary);
    margin: 22px 0 10px;
    padding-left: 10px;
    border-left: 2px solid var(--accent-yellow);
  }
  .badge-category-count {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 0.85em;
    margin-left: 6px;
  }
  .badge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
  }
  .badge-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 6px;
    text-align: center;
    transition: all 0.3s;
    position: relative;
  }
  .badge-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent-yellow);
    box-shadow: 0 4px 12px rgba(234,179,8,0.15);
  }
  .badge-card.earned {
    border-color: rgba(234,179,8,0.3);
    background: linear-gradient(135deg, rgba(234,179,8,0.05), rgba(234,179,8,0.02));
  }
  .badge-card.worn {
    border-color: rgba(234,179,8,0.6);
    box-shadow: 0 0 12px rgba(234,179,8,0.25);
  }
  .badge-card.locked {
    opacity: 0.25;
    filter: grayscale(1);
  }
  .badge-icon { font-size: 1.8em; margin-bottom: 4px; }
  .badge-name {
    font-size: 0.72em;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.3;
    word-break: keep-all;
  }
  .badge-desc {
    font-size: 0.62em;
    color: var(--text-dim);
    margin-top: 3px;
    line-height: 1.3;
  }
  .badge-card.earned .badge-name { color: var(--accent-yellow); }
  .badge-new-tag {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--accent-red);
    color: #fff;
    font-size: 0.5em;
    padding: 1px 5px;
    border-radius: 6px;
    font-weight: 700;
  }
  .badge-card { cursor: pointer; }
  .badge-tier-tag {
    display: inline-block;
    font-size: 0.5em;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 4px;
    margin-top: 3px;
    line-height: 1.4;
  }
  .badge-tier-tag.tier-gold { background: rgba(255,215,0,0.2); color: #FFD700; border: 1px solid rgba(255,215,0,0.4); }
  .badge-tier-tag.tier-silver { background: rgba(192,192,192,0.15); color: #C0C0C0; border: 1px solid rgba(192,192,192,0.35); }
  .badge-tier-tag.tier-bronze { background: rgba(205,127,50,0.15); color: #CD7F32; border: 1px solid rgba(205,127,50,0.35); }
  .badge-tier-detail { display: inline-block; padding: 4px 14px; border-radius: 12px; font-size: 0.8em; font-weight: 700; margin-bottom: 12px; }
  .badge-tier-detail.tier-gold { background: rgba(255,215,0,0.15); color: #FFD700; border: 1px solid rgba(255,215,0,0.3); }
  .badge-tier-detail.tier-silver { background: rgba(192,192,192,0.12); color: #C0C0C0; border: 1px solid rgba(192,192,192,0.25); }
  .badge-tier-detail.tier-bronze { background: rgba(205,127,50,0.12); color: #CD7F32; border: 1px solid rgba(205,127,50,0.25); }

  /* ===== Badge Detail Modal ===== */
  .badge-detail-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    padding: 20px;
  }
  .badge-detail-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  .badge-detail-icon {
    font-size: 4em;
    margin-bottom: 12px;
  }
  .badge-detail-name {
    font-size: 1.3em;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .badge-detail-desc {
    font-size: 0.9em;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .badge-detail-status {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.85em;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .badge-detail-status.earned {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(34, 197, 94, 0.1));
    color: var(--accent-green);
    border: 1px solid rgba(34, 197, 94, 0.3);
  }
  .badge-detail-status.locked {
    background: rgba(100, 116, 139, 0.1);
    color: var(--text-dim);
    border: 1px solid rgba(100, 116, 139, 0.2);
  }
  .badge-detail-date {
    font-size: 0.8em;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .badge-detail-progress-bar {
    width: 100%;
    height: 12px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .badge-detail-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
    border-radius: 6px;
    transition: width 0.5s ease;
  }
  .badge-detail-progress-text {
    font-size: 0.85em;
    color: var(--text-secondary);
    margin-bottom: 20px;
  }
  .badge-detail-close {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: #fff;
    border: none;
    padding: 10px 32px;
    border-radius: 10px;
    font-size: 0.95em;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }
  .badge-detail-close:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(74, 158, 255, 0.3);
  }

  /* ===== Print Styles ===== */
  @media print {
    body { background: white; color: #333; }
    .challenge-item { cursor: default; }
    .motivation-banner { display: none; }
  }

  /* ===== Tab System & Bottom Nav ===== */
  .tab-content {
    display: none;
  }
  .tab-content.tab-active {
    display: block;
  }
  #dashboardContainer {
    padding-bottom: 70px;
  }
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 999;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bottom-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    padding: 4px 20px;
    border-radius: 12px;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .bottom-nav-item:hover {
    background: rgba(74,158,255,0.06);
  }
  .bottom-nav-icon {
    font-size: 1.3em;
    line-height: 1;
    transition: transform 0.2s;
  }
  .bottom-nav-label {
    font-size: 0.65em;
    font-weight: 500;
    color: var(--text-dim);
    transition: color 0.2s;
  }
  .bottom-nav-item.active .bottom-nav-icon {
    transform: scale(1.15);
  }
  .bottom-nav-item.active .bottom-nav-label {
    color: var(--accent-blue);
    font-weight: 600;
  }

  /* ===== Auth Screen ===== */
  .auth-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .auth-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  .auth-title {
    font-size: 1.5em;
    font-weight: 900;
    text-align: center;
    margin-bottom: 24px;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .auth-tabs {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .auth-tab {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.9em;
    cursor: pointer;
    transition: all 0.3s;
    color: var(--text-dim);
    text-align: center;
    border: none;
    background: none;
    font-family: inherit;
  }
  .auth-tab.active {
    background: var(--accent-blue);
    color: white;
    font-weight: 600;
  }
  .auth-tab:hover:not(.active) {
    color: var(--text-primary);
    background: rgba(255,255,255,0.06);
  }
  .auth-form { display: none; }
  .auth-form.active { display: block; }
  .auth-field {
    margin-bottom: 14px;
  }
  .auth-field label {
    display: block;
    font-size: 0.82em;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .auth-field input, .auth-field select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 0.9em;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s;
  }
  .auth-field input:focus, .auth-field select:focus {
    border-color: var(--accent-blue);
  }
  .auth-field input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .auth-btn {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: white;
    font-size: 1em;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 8px;
  }
  .auth-btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--glow-blue);
  }
  .auth-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .auth-error {
    color: var(--accent-red);
    font-size: 0.82em;
    text-align: center;
    margin-top: 10px;
    min-height: 1.2em;
  }

  /* ===== Share Banner ===== */
  .share-banner {
    background: rgba(168,85,247,0.15);
    border-bottom: 1px solid rgba(168,85,247,0.3);
    padding: 8px 20px;
    text-align: center;
    font-size: 0.85em;
    color: var(--accent-purple);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* ===== Empty State ===== */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-secondary);
  }
  .empty-state-icon {
    font-size: 4em;
    margin-bottom: 16px;
  }
  .empty-state-text {
    font-size: 1.1em;
    line-height: 1.8;
  }

  /* ===== Loading ===== */
  .loading-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--text-secondary);
    font-size: 1.1em;
  }
  .loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent-blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 12px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== Global Error ===== */
  .global-error {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
  }
  .global-error-icon {
    font-size: 3em;
    margin-bottom: 12px;
  }
  .global-error-text {
    font-size: 1em;
    margin-bottom: 20px;
  }
  .global-error-btn {
    display: inline-block;
    padding: 10px 24px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text-primary);
    font-size: 0.9em;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
  }
  .global-error-btn:hover {
    border-color: var(--accent-blue);
    box-shadow: var(--glow-blue);
  }

  /* ===== Modal Dialogs ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: modalFadeIn 0.2s ease;
  }
  @keyframes modalFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal-box {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    max-width: 320px;
    width: 85vw;
    animation: modalSlideUp 0.25s ease;
  }
  @keyframes modalSlideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-icon {
    font-size: 2.5em;
    margin-bottom: 12px;
  }
  .modal-title {
    font-size: 1.15em;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  .modal-desc {
    font-size: 0.85em;
    color: var(--text-secondary);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .modal-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .modal-btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: transform 0.1s, opacity 0.2s;
  }
  .modal-btn:active {
    transform: scale(0.95);
  }
  .modal-btn-yes {
    background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
    color: white;
  }
  .modal-btn-no {
    background: rgba(255,255,255,0.08);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  /* ── Error Mastery ── */
  .mastery-entry {
    background: linear-gradient(135deg, rgba(34,197,94,0.08), rgba(74,158,255,0.08));
    border: 1px solid rgba(34,197,94,0.2);
    border-radius: 16px;
    padding: 16px;
    margin: 16px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mastery-entry:active { transform: scale(0.98); }
  .mastery-entry-left { display: flex; align-items: center; gap: 12px; }
  .mastery-entry-icon { font-size: 1.8em; }
  .mastery-entry-title { font-weight: 700; font-size: 1em; color: var(--text-primary); }
  .mastery-entry-sub { font-size: 0.8em; color: var(--text-secondary); margin-top: 2px; }
  .mastery-entry-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: #fff; border: none; border-radius: 20px;
    padding: 8px 18px; font-weight: 700; font-size: 0.85em;
    cursor: pointer; white-space: nowrap;
  }

  .mastery-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.3s;
    padding: 16px;
  }
  .mastery-overlay.show { opacity: 1; pointer-events: auto; }
  .mastery-panel {
    background: var(--bg-card);
    border-radius: 20px;
    width: 100%; max-width: 460px; max-height: 70vh;
    display: flex; flex-direction: column;
    transform: scale(0.9); transition: transform 0.3s ease;
    overflow: hidden;
  }
  .mastery-overlay.show .mastery-panel { transform: scale(1); }
  .mastery-header {
    padding: 16px 20px 10px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .mastery-header h2 { font-size: 1.15em; margin: 0; }
  .mastery-close {
    background: rgba(255,255,255,0.1); border: none; color: var(--text-secondary);
    width: 32px; height: 32px; border-radius: 50%; font-size: 1.1em; cursor: pointer;
  }
  .mastery-tabs {
    display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .mastery-tab {
    padding: 6px 14px; border-radius: 16px; font-size: 0.8em; font-weight: 600;
    white-space: nowrap; cursor: pointer; border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary); transition: all 0.2s;

/* ==================== SCREEN MANAGEMENT ==================== */
function hideAll() {
  $('authScreen').style.display = 'none';
  $('passwordScreen').style.display = 'none';
  $('loadingScreen').style.display = 'none';
  $('shareBanner').style.display = 'none';
  $('dashboardContainer').style.display = 'none';
  $('errorScreen').style.display = 'none';
}

function showScreen(id) {
  hideAll();
  $(id).style.display = (id === 'dashboardContainer') ? 'block' : (id === 'shareBanner') ? 'block' : 'flex';
}

function showLoading() {
  hideAll();
  $('loadingScreen').style.display = 'flex';
}

function showShareBanner() {
  $('shareBanner').style.display = 'block';
}

function showError(msg) {
  hideAll();
  $('errorText').textContent = msg;
  $('errorScreen').style.display = 'block';
}

/* ==================== TAB SWITCHING ==================== */
function switchTab(tab) {
  if (appState.currentTab === tab) return;
  appState.currentTab = tab;

  var tabs = { home: 'tabHome', achieve: 'tabAchieve', mine: 'tabMine' };
  Object.keys(tabs).forEach(function(key) {
    var el = document.getElementById(tabs[key]);
    if (el) el.classList.toggle('tab-active', key === tab);
  });

  var navItems = document.querySelectorAll('.bottom-nav-item');
  navItems.forEach(function(item) {
    item.classList.toggle('active', item.getAttribute('data-tab') === tab);
  });

  window.scrollTo(0, 0);

  if (tab === 'home' && appState.data && appState.data.subjects && appState.data.subjects.length > 0) {
    setTimeout(function() { initCharts(appState.data); }, 50);
  }
}

/* ==================== DASHBOARD RENDERING ==================== */
function renderDashboard(data) {
  appState.data = data;
  appState.tasks = (data.tasks || []).map(function(t) { return Object.assign({}, t); });
  appState.baseXP = data.stats ? (data.stats.total_xp || 0) : 0;
  appState.currentXP = appState.baseXP;

  document.title = (data.user && data.user.display_name ? data.user.display_name + ' - ' : '') + '能力全景仪表盘';

  hideAll();
  $('dashboardContainer').style.display = 'block';

  var stats = data.stats || {};
  var subjects = data.subjects || [];
  var abilities = data.abilities || [];
  var errors = data.errors || [];
  var strengths = data.strengths || [];
  var activities = data.activities || [];
  var tasks = appState.tasks;
  var timeline = data.timeline || [];
  var errorBreakdown = data.error_type_breakdown || {};
  var badges = data.badges || [];
  var user = data.user || {};
  var monthlyChallenge = data.monthly_challenge || null;

  var isEmpty = (stats.total_errors === 0 && subjects.length === 0);

  var homeHtml = '';
  homeHtml += renderHero(user);
  homeHtml += renderLevel(stats);
  homeHtml += renderStatsRow(stats, activities, strengths);

  var wrongCount = errors.filter(function(e) { return e.status === 'wrong'; }).length;
  var masteredCount = stats.mastered || 0;
  var reviewingCount = stats.reviewing || 0;
  if (errors.length > 0) {
    homeHtml += '<div class="mastery-entry animate-in" style="animation-delay:0.35s" onclick="openMastery()">';
    homeHtml += '<div class="mastery-entry-left">';
    homeHtml += '<div class="mastery-entry-icon">🎯</div>';
    homeHtml += '<div><div class="mastery-entry-title">攻克错题</div>';
    homeHtml += '<div class="mastery-entry-sub">已攻克 ' + masteredCount + ' · 复习中 ' + reviewingCount + ' · 待攻克 ' + wrongCount + '</div>';
    homeHtml += '</div></div>';
    homeHtml += '<button class="mastery-entry-btn">去攻克</button>';
    homeHtml += '</div>';
  }

  if (tasks.length > 0) {
    homeHtml += renderTasksSection(tasks);
  }

  if (isEmpty) {
    homeHtml += renderEmptyState();
  } else {
    homeHtml += renderInsight(errorBreakdown, stats);

    if (subjects.length > 0) {
      homeHtml += '<div class="section-title animate-in" style="animation-delay:0.4s">📊 四科能力雷达图</div>';
      homeHtml += '<div class="radar-section animate-in" style="animation-delay:0.45s">';
      homeHtml += '<div class="chart-card"><h3>综合能力分布</h3><div class="chart-wrap"><canvas id="radarChart"></canvas></div></div>';
      homeHtml += '<div class="chart-card"><h3>错误类型分布</h3><div class="chart-wrap"><canvas id="errorDoughnut"></canvas></div>';
      homeHtml += '<div class="error-legend">';
      homeHtml += '<div class="legend-item"><div class="legend-dot" style="background:var(--accent-red)"></div>概念不清</div>';
      homeHtml += '<div class="legend-item"><div class="legend-dot" style="background:var(--accent-yellow)"></div>方法不会</div>';
      homeHtml += '<div class="legend-item"><div class="legend-dot" style="background:var(--accent-blue)"></div>粗心大意</div>';
      homeHtml += '</div></div>';
      homeHtml += '</div>';
    }

    if (strengths.length > 0) {
      homeHtml += renderStrengths(strengths);
    }

    if (subjects.length > 0) {
      homeHtml += renderSubjectCards(subjects, abilities);
    }

    if (errors.length > 0 || subjects.length > 0) {
      homeHtml += renderErrorSection(subjects, errors, errorBreakdown, stats);
    }
  }

  if (monthlyChallenge) {
    homeHtml += renderMonthlyChallenge(monthlyChallenge);
  }

  if (!isEmpty) {
    homeHtml += renderMotivation();
  }
  homeHtml += renderFooter(user);

  var growthHtml = '';
  growthHtml += renderTargetScores(subjects);
  growthHtml += renderXpBreakdown(stats);
  if (strengths.length > 0) {
    growthHtml += renderStrengths(strengths);
  }
  if (timeline.length > 0) {
    growthHtml += renderTimeline(timeline);
  }
  growthHtml += renderHeatmapSection(activities);
  if (!growthHtml.trim()) {
    growthHtml = '<div class="empty-state"><div class="empty-state-icon">📈</div><div class="empty-state-text">还没有成长记录，继续加油！</div></div>';
  }

  var achieveHtml = renderBadges(badges);

  var html = '';
  html += '<div class="tab-content tab-active" id="tabHome">' + homeHtml + '</div>';
  html += '<div class="tab-content" id="tabMine">' + growthHtml + '</div>';
  html += '<div class="tab-content" id="tabAchieve">' + achieveHtml + '</div>';
  html += '<nav class="bottom-nav" id="bottomNav">';
  html += '<div class="bottom-nav-item active" onclick="switchTab(\'home\')" data-tab="home">';
  html += '<div class="bottom-nav-icon">🏠</div><div class="bottom-nav-label">首页</div></div>';
  html += '<div class="bottom-nav-item" onclick="switchTab(\'achieve\')" data-tab="achieve">';
  html += '<div class="bottom-nav-icon">🏆</div><div class="bottom-nav-label">成就</div></div>';
  html += '<div class="bottom-nav-item" onclick="switchTab(\'mine\')" data-tab="mine">';
  html += '<div class="bottom-nav-icon">👤</div><div class="bottom-nav-label">我的</div></div>';
  html += '</nav>';

  appState.currentTab = 'home';
  $('dashboardContainer').innerHTML = html;

  if (!isEmpty && subjects.length > 0) {
    setTimeout(function() {
      initCharts(data);
    }, 50);
  }

  animateOnScroll();
}

function renderEmptyState() {
  return '<div class="empty-state">' +
    '<div class="empty-state-icon">📚</div>' +
    '<div class="empty-state-text">数据准备中...<br>请使用AI教练录入学习数据</div>' +
    '</div>';
}

function renderHero(user) {
  var avatarHtml = '';
  if (user.avatar_url) {
    avatarHtml = '<img class="hero-avatar-img" src="' + escapeHtml(user.avatar_url) + '" alt="avatar">';
  } else if (user.avatar_emoji) {
    avatarHtml = '<div class="hero-avatar-fallback">' + user.avatar_emoji + '</div>';
  } else {
    var initial = (user.display_name || '?').charAt(0);

function renderTargetScores(subjects) {
  if (!subjects || subjects.length === 0) return '';
  var TARGET_XP = { '语文': 50, '数学': 30, '英语': 20, '科学': 30 };
  var emojiMap = { '语文': '📖', '数学': '🔢', '英语': '🔤', '科学': '🔬' };
  var hasTarget = subjects.some(function(s) { return s.target_score && s.target_score > 0; });
  if (!hasTarget) return '';

  var html = '<div class="section-title animate-in" style="animation-delay:0.45s">🎯 目标分值</div>';
  html += '<div class="target-score-section animate-in" style="animation-delay:0.5s">';

  subjects.forEach(function(s) {
    if (!s.target_score || s.target_score <= 0) return;
    var current = s.overall_score || 0;
    var target = s.target_score;
    var xp = TARGET_XP[s.name] || 0;
    var reached = current >= target;
    var pct = Math.min(100, Math.round((current / target) * 100));
    var barColor = reached
      ? 'linear-gradient(90deg, #f59e0b, #fbbf24)'
      : (pct >= 80 ? 'linear-gradient(90deg, var(--accent-green), #4ade80)' : 'linear-gradient(90deg, var(--accent-blue), var(--accent-purple))');
    var rowClass = reached ? 'target-score-row reached' : 'target-score-row';

    html += '<div class="' + rowClass + '">';
    html += '<div class="target-score-label">' + (emojiMap[s.name] || '📚') + ' ' + escapeHtml(s.name) + '</div>';
    html += '<div class="target-score-current">' + current + '</div>';
    html += '<div class="target-score-bar-bg"><div class="target-score-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>';
    html += '<div class="target-score-target">' + target + '</div>';
    if (reached) {
      html += '<div class="target-score-xp earned">✅ +' + xp + 'XP</div>';
    } else {
      html += '<div class="target-score-xp pending">+' + xp + 'XP</div>';
    }
    html += '</div>';
  });

  html += '</div>';
  return html;
}

function renderHeatmapSection(activities) {
  if (!activities || activities.length === 0) return '';
  var html = '<div class="section-title animate-in" style="animation-delay:0.75s">🔥 学习热力图</div>';
  html += '<div class="heatmap animate-in" style="animation-delay:0.8s">';

  var weeks = [];
  var dayMap = {};
  activities.forEach(function(a) {
    dayMap[a.date] = a.activity_level;
  });

  var today = new Date();
  today.setHours(0,0,0,0);
  for (var w = 0; w < 13; w++) {
    var week = [];
    for (var d = 0; d < 7; d++) {
      var date = new Date(today);
      date.setDate(date.getDate() - (w * 7 + (6 - d)));
      var ds = formatDateLocal(date);
      week.push({ date: ds, level: dayMap[ds] || 0 });
    }
    weeks.unshift(week);
  }

  var monthLabels = [];
  var lastMonth = -1;
  weeks.forEach(function(week, wi) {
    var midDate = week[3].date;
    var parts = midDate.split('-');
    var m = parseInt(parts[1], 10);
    if (m !== lastMonth) {
      monthLabels.push({ index: wi, label: m + '月' });
      lastMonth = m;
    }
  });

  html += '<div class="heatmap-months">';
  for (var mi = 0; mi < weeks.length; mi++) {
    var label = monthLabels.find(function(l) { return l.index === mi; });
    html += '<div class="heatmap-month-label">' + (label ? label.label : '') + '</div>';
  }
  html += '</div>';

  html += '<div class="heatmap-grid">';
  html += '<div class="heatmap-day-labels">';
  var dayNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  dayNames.forEach(function(dn, di) {
    html += '<div class="heatmap-day-label">' + (di % 2 === 0 ? dn : '') + '</div>';
  });
  html += '</div>';

  html += '<div class="heatmap-weeks">';
  weeks.forEach(function(week) {
    html += '<div class="heatmap-week">';
    week.forEach(function(day) {
      var levelClass = 'l' + day.level;
      html += '<div class="heatmap-day ' + levelClass + '" title="' + day.date + '\n活跃度: ' + day.level + '"></div>';
    });
    html += '</div>';
  });
  html += '</div></div>';

  html += '<div class="heatmap-legend">';
  html += '<span>少</span>';
  for (var li = 0; li <= 4; li++) {
    html += '<div class="heatmap-day l' + li + '"></div>';
  }
  html += '<span>多</span>';
  html += '</div>';
  html += '</div>';
  return html;
}

/* ==================== TASK TOGGLE (in-memory only) ==================== */
function toggleTask(index) {
  var tasks = appState.tasks;
  if (!tasks || !tasks[index]) return;
  tasks[index].completed = !tasks[index].completed;

  var completedCount = tasks.filter(function(t) { return t.completed; }).length;
  var totalCount = tasks.length;
  var pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

  var item = document.querySelector('.challenge-item[data-index="' + index + '"]');
  if (item) {
    item.classList.toggle('done', tasks[index].completed);
    var cb = item.querySelector('.check-box');
    if (cb) cb.textContent = tasks[index].completed ? '✓' : '';
  }

  var pctEl = $('progressPct');
  var countEl = $('progressCount');
  var circle = $('progressCircle');
  if (pctEl) pctEl.textContent = pct + '%';
  if (countEl) countEl.textContent = completedCount + ' / ' + totalCount;
  if (circle) circle.style.strokeDashoffset = 100 - pct;
}

function updateTaskProgress() {
  var tasks = appState.tasks;
  var completedCount = tasks.filter(function(t) { return t.completed; }).length;
  var totalCount = tasks.length;
  var pct = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;
  var circle = $('progressCircle');
  if (circle) circle.style.strokeDashoffset = 100 - pct;
}

/* In-memory error status update (no API) */
function updateErrorStatus(errorId, newStatus) {
  var errors = appState.data.errors || [];
  for (var i = 0; i < errors.length; i++) {
    if (errors[i].id === errorId) {
      errors[i].status = newStatus;
      break;
    }
  }

  if (newStatus === 'mastered') {
    appState.currentXP = (appState.currentXP || 0) + 10;
    updateXPDisplay();
  } else if (newStatus === 'wrong') {
    appState.currentXP = Math.max(0, (appState.currentXP || 0) - 10);
    updateXPDisplay();
  }

  renderMasteryList();
  var wrongC = errors.filter(function(e) { return e.status === 'wrong'; }).length;
  var masC = errors.filter(function(e) { return e.status === 'mastered'; }).length;
  var revC = errors.filter(function(e) { return e.status === 'reviewing'; }).length;
  var subEl = document.querySelector('.mastery-entry-sub');
  if (subEl) subEl.textContent = '已攻克 ' + masC + ' · 复习中 ' + revC + ' · 待攻克 ' + wrongC;
  var masteredEl = document.getElementById('statMastered');
  if (masteredEl) masteredEl.textContent = masC;
}

function updateXPDisplay() {
  var xpText = $('xpText');
  if (xpText) xpText.textContent = appState.currentXP + ' XP';
}

/* ==================== ANIMATION ==================== */
function animateOnScroll() {
  var els = document.querySelectorAll('.animate-in');
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.style.animationPlayState = 'running';
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  els.forEach(function(el) { observer.observe(el); });
}

/* ==================== SWIPE ==================== */
var swipeState = { startX: 0, startY: 0, tracking: false, startTime: 0 };
function initSwipeDetection() {
  document.body.style.overscrollBehaviorX = 'none';
  var container = $('dashboardContainer');
  if (!container) return;
  container.addEventListener('touchstart', function(e) {
    swipeState.startX = e.touches[0].clientX;
    swipeState.startY = e.touches[0].clientY;
    swipeState.startTime = Date.now();
    swipeState.tracking = true;
  }, { passive: false });
  container.addEventListener('touchmove', function(e) {
    if (!swipeState.tracking) return;
    var dx = e.touches[0].clientX - swipeState.startX;
    var dy = e.touches[0].clientY - swipeState.startY;
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
      e.preventDefault();
    }
  }, { passive: false });
  container.addEventListener('touchend', function(e) {
    if (!swipeState.tracking) return;
    swipeState.tracking = false;
    var dx = e.changedTouches[0].clientX - swipeState.startX;
    var dy = e.changedTouches[0].clientY - swipeState.startY;
    var dt = Date.now() - swipeState.startTime;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 500) {
      // Swipe detected
    }
  }, { passive: true });
}

  if (score >= 40) return { bar: 'linear-gradient(90deg,var(--accent-orange),var(--accent-yellow))', text: 'var(--accent-orange)' };
  return { bar: 'var(--accent-red)', text: 'var(--accent-red)' };

function getPotentialStars(subject) {
  var gap = 100 - subject.overall_score;
  if (gap >= 40) return '⭐⭐⭐⭐⭐';
  if (gap >= 30) return '⭐⭐⭐⭐';
  if (gap >= 20) return '⭐⭐⭐';
  if (gap >= 10) return '⭐⭐';
  return '⭐';
}

function calculateStreak(activities) {
  if (!activities || activities.length === 0) return 0;
  var activeDates = {};
  activities.forEach(function(a) {
    if (a.activity_level > 0) {
      activeDates[formatDateLocal(new Date(a.date))] = true;
    }
  });
  var streak = 0;
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  for (var i = 0; i < 365; i++) {
    var d = new Date(today);
    d.setDate(d.getDate() - i);
    var dateStr = formatDateLocal(d);
    if (activeDates[dateStr]) {
      streak++;
    } else if (i === 0) {
      continue;
    } else {
      break;
    }
  }
  return streak;
}

function generateInsight(errorBreakdown, stats) {
  var total = stats.total_errors;
  if (total === 0) {
    return { title: '核心发现：太棒了！', text: '目前没有错题记录，继续保持！' };
  }
  var concept = errorBreakdown.concept || 0;
  var method = errorBreakdown.method || 0;
  var careless = errorBreakdown.careless || 0;
  var conceptPct = Math.round((concept / total) * 100);
  var methodPct = Math.round((method / total) * 100);
  var carelessPct = Math.round((careless / total) * 100);
  var nonConcept = methodPct + carelessPct;

  if (nonConcept > 50) {
    return {
      title: '核心发现：你的底子比你以为的好得多！',
      text: '在全部 ' + total + ' 道错题中，<span class="insight-highlight">超过一半的错误来自“粗心”和“方法不熟”</span>——' +
        '这意味着你不是“不会”，而是“不够仔细”或“还没学过这个方法”。' +
        '真正需要从头学起的概念题占 ' + conceptPct + '%，而且都是<span class="insight-highlight">离散的、可以逐个击破的</span>。' +
        '继续保持学习热情，你正在成为学霸！'
    };
  } else if (conceptPct > 50) {
    return {
      title: '核心发现：扎实基础，逐个击破！',
      text: '在全部 ' + total + ' 道错题中，概念类错误占 ' + conceptPct + '%。' +
        '<span class="insight-highlight">这说明需要加强基础概念的理解</span>。' +
        '好消息是，方法类和粗心类错误分别只占 ' + methodPct + '% 和 ' + carelessPct + '%，' +
        '说明你的学习习惯不错，只要把概念补上来，成绩会快速提升！'
    };
  } else {
    return {
      title: '核心发现：均衡发展，稳步提升！',
      text: '在全部 ' + total + ' 道错题中，各类错误分布相对均衡。' +
        '概念类占 ' + conceptPct + '%，方法类占 ' + methodPct + '%，粗心类占 ' + carelessPct + '%。' +
        '<span class="insight-highlight">制定针对性的复习计划，分类攻克</span>，' +
        '你会看到明显的进步！'
    };
  }
}

  showLoading();
  setTimeout(function() {
    renderDashboard(MOCK_DATA);
    initSwipeDetection();
  }, 300);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
