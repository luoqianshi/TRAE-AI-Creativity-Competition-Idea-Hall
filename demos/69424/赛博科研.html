<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberPet-RPG 互动原型 (文献进化版)</title>
    <style>
        :root {
            --game-purple: #8e44ad;
            --game-gold: #f1c40f;
            --game-blue: #3498db;
            --game-green: #2ecc71;
        }

        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #2c3e50 0%, #0f171e 100%);
            font-family: 'PingFang SC', sans-serif;
            color: #fff;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .game-window {
            width: 1000px; height: 650px;
            background: rgba(0, 0, 0, 0.75);
            border: 4px solid var(--game-purple);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(142, 68, 173, 0.5);
            display: flex; overflow: hidden;
        }

        /* 左侧：养成展示舱 */
        .pet-cabin {
            flex: 1.2;
            background: linear-gradient(to bottom, rgba(142, 68, 173, 0.15), rgba(0,0,0,0.5));
            display: flex; flex-direction: column; align-items: center;
            padding: 25px; position: relative;
            border-right: 2px solid rgba(255,255,255,0.1);
        }

        .level-badge {
            background: var(--game-purple); padding: 6px 15px; border-radius: 20px;
            font-weight: bold; font-size: 14px; border: 2px solid var(--game-gold);
            box-shadow: 0 0 10px var(--game-gold); margin-bottom: 15px;
        }

        .exp-container {
            width: 90%; background: #333; height: 18px; border-radius: 9px;
            overflow: hidden; border: 1px solid #555; margin-bottom: 10px; position: relative;
        }
        .exp-bar { width: 10%; height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); transition: width 0.4s ease; }
        .exp-text { position: absolute; width: 100%; text-align: center; font-size: 11px; line-height: 18px; font-weight: bold; }

        .pet-display {
            flex: 1; display: flex; justify-content: center; align-items: center; position: relative; width: 100%;
        }

        /* 可变色的像素桌宠 */
        .pixel-pet {
            width: 140px; height: 140px; background: #e74c3c; border-radius: 50% 50% 42% 42%;
            position: relative; box-shadow: 0 15px 0 rgba(0,0,0,0.2);
            animation: bounce 0.6s infinite alternate; transition: all 0.5s ease;
        }
        .pet-eye { position: absolute; width: 16px; height: 16px; background: #000; border-radius: 50%; top: 50px; transition: all 0.3s;}
        .pet-eye.l { left: 35px; } .pet-eye.r { right: 35px; }
        .pet-mouth { position: absolute; width: 24px; height: 12px; border-bottom: 4px solid #000; left: 58px; top: 70px; }
        
        /* 宠物特配：研究员眼镜（初始隐藏） */
        .glasses {
            position: absolute; width: 100px; height: 30px; top: 43px; left: 20px;
            border: 3px solid #333; border-radius: 5px; display: none; background: rgba(255,255,255,0.2);
        }

        .pet-bubble {
            background: white; color: #333; padding: 12px 18px; border-radius: 12px;
            font-size: 13px; font-weight: 500; max-width: 85%; position: absolute; top: -10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); line-height: 1.4;
        }

        /* 右侧：操作面板与学术科研副本 */
        .task-board { flex: 1.5; padding: 25px; display: flex; flex-direction: column; background: #141d26; }
        h3 { margin-top: 0; color: var(--game-gold); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; font-size: 18px;}

        .section-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 15px; margin-bottom: 20px; }

        /* 喂食投递区风格 */
        .drop-zone {
            border: 2px dashed var(--game-blue); background: rgba(52, 152, 219, 0.05);
            padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; transition: all 0.3s;
        }
        .drop-zone:hover { background: rgba(52, 152, 219, 0.15); transform: scale(1.01); }

        .log-terminal {
            background: #090d12; font-family: 'Courier New', monospace; padding: 12px;
            font-size: 12px; border-radius: 6px; min-height: 160px; color: #00ffcc;
            border: 1px solid #223140; overflow-y: auto; line-height: 1.5;
        }

        /* 进化特效遮罩 */
        .levelup-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; opacity: 0;
            pointer-events: none; transition: opacity 0.3s ease;
        }
        .levelup-overlay.active { opacity: 1; pointer-events: auto; }

        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
        .crunching { animation: crunch Animate 0.2s infinite alternate !important; }
        @keyframes crunch { 0% { transform: scale(1); } 100% { transform: scale(1.08) rotate(2deg); } }
    </style>
</head>
<body>

<div class="game-window">
    <div class="pet-cabin">
        <div class="level-badge" id="levelName">LV.1 智力未开化幼崽</div>
        
        <div class="exp-container">
            <div class="exp-bar" id="expBar"></div>
            <div class="exp-text" id="expText">知识经验: 10 / 100 XP</div>
        </div>

        <div style="font-size: 12px; color: #aaa; margin-bottom: 20px;">
            📚 累计吞噬文献数: <span id="paperCount" style="color:var(--game-gold); font-weight:bold;">0</span> 篇
        </div>

        <div class="pet-display">
            <div class="pet-bubble" id="petTalk">（肚子咕咕叫）主人...今天还没喂我论文吃呢...好饿好无知啊...</div>
            <div class="pixel-pet" id="petGraphic">
                <div class="glasses" id="petGlasses"></div>
                <div class="pet-eye l" id="eyeL"></div>
                <div class="pet-eye r" id="eyeR"></div>
                <div class="pet-mouth"></div>
            </div>
        </div>

        <div class="levelup-overlay" id="lvlUpWindow">
            <h1 style="color: var(--game-gold); font-size: 36px; margin: 0; text-shadow: 0 0 15px #2ecc71;">🎓 智慧大跃迁！</h1>
            <p id="lvlUpDesc" style="font-weight: bold; margin: 15px 0; text-align:center; padding:0 20px;">大模型基座升级！</p>
            <button onclick="closeLvlUp()" style="padding: 8px 25px; background: var(--game-green); color: #fff; border: none; font-weight: bold; border-radius: 5px; cursor: pointer;">接收智慧洗礼</button>
        </div>
    </div>

    <div class="task-board">
        <h3>📖 学术研究舱（每日文献习惯打卡）</h3>
        
        <div class="section-box">
            <div style="font-size: 13px; color: #888; margin-bottom: 10px;">💾 模拟将科研PDF文献拖拽至此处：</div>
            <div class="drop-zone" onclick="feedLiterature()">
                <span style="font-size: 28px;">📄</span>
                <b style="color: var(--game-blue); display:block; margin-top:5px;">【点击投喂一篇：AI大模型前沿文献.pdf】</b>
                <span style="font-size: 11px; color:#666;">（投喂可暴涨 +45 XP，触发核心大模型自动化抽取）</span>
            </div>
        </div>

        <div class="section-box" style="flex: 1; display:flex; flex-direction:column; margin-bottom:0;">
            <h4 style="margin: 0 0 10px 0; color: var(--game-green); display:flex; justify-content:space-between;">
                <span>🧠 本地 Agent 知识库吞噬日志</span>
                <span id="ragStatus" style="font-size:11px; color:#aaa;">RAG系统：未激活</span>
            </h4>
            <div class="log-terminal" id="terminalLog">
                [系统闲置中]<br>
                > 等待主人投喂文献...<br>
                > 当前本地向量数据库包含核心论文：0 篇。
            </div>
        </div>
    </div>
</div>

<script>
    let xp = 10;
    let maxXp = 100;
    let level = 1;
    let papers = 0;

    const evolutionData = {
        1: {
            name: "LV.1 智力未开化幼崽",
            talk: "（肚子咕咕叫）主人...今天还没喂我论文吃呢...好饿好无知啊...",
            color: "#e74c3c",
            hasGlasses: false
        },
        2: {
            name: "LV.2 硕士级学术仓鼠 🐹",
            talk: "（推眼镜）多谢主人的论文！我已经提取了核心关键词，现在我可以帮你一键把这篇长论文总结成3句话了！",
            color: "#3498db",
            hasGlasses: true
        },
        3: {
            name: "LV.3 赛博博导·终极智能体 👑",
            talk: "我已经吞噬了足够的核心数据，本地知识库已闭环。主人，现在不仅能一键生成摘要，我连你的毕业开题报告和答辩 PPT 都能直接自动重构了！",
            color: "#2ecc71",
            hasGlasses: true
        }
    };

    function feedLiterature() {
        papers++;
        xp += 45;
        document.getElementById('paperCount').innerText = papers;

        const pet = document.getElementById('petGraphic');
        const log = document.getElementById('terminalLog');
        const talk = document.getElementById('petTalk');

        // 触发咀嚼/看书动效
        pet.classList.add('crunching');
        talk.innerText = "（暴风吸入中... 正在解析多模态图表与数学公式...）";
        
        // 动态打印学术抽取日志
        log.innerHTML = `<span style="color:#f1c40f">> [正在读取文件]: Deep_Learning_2026_Review.pdf</span><br>
> [多模态解析]: 识别到 4 个公式，2 个架构拓扑图...<br>
> [智能体提取核心创新点]: 提出了一种基于多模态对齐的轻量化端侧 Agent 部署方案...<br>
> [向量化同步]: 正在向本地嵌入（Embedding）数据库注入 12 个关联向量切片...`;

        setTimeout(() => {
            pet.classList.remove('crunching');
            
            // 判断升级
            if (xp >= maxXp && level < 3) {
                level++;
                xp = xp - maxXp;
                triggerLevelUp();
            }
            
            updateUI();
        }, 1500);
    }

    function updateUI() {
        if (level >= 3) xp = maxXp;
        
        const pct = (xp / maxXp) * 100;
        document.getElementById('expBar').style.width = pct + '%';
        document.getElementById('expText').innerText = `知识经验: ${xp} / ${maxXp} XP`;

        const current = evolutionData[level];
        document.getElementById('levelName').innerText = current.name;
        document.getElementById('petTalk').innerText = current.talk;
        document.getElementById('petGraphic').style.backgroundColor = current.color;
        
        if (current.hasGlasses) {
            document.getElementById('petGlasses').style.display = 'block';
            document.getElementById('eyeL').style.top = '48px';
            document.getElementById('eyeR').style.top = '48px';
            document.getElementById('ragStatus').innerText = "RAG本地全量向量库：已激活";
            document.getElementById('ragStatus').style.color = "var(--game-green)";
        }
    }

    function triggerLevelUp() {
        const win = document.getElementById('lvlUpWindow');
        const desc = document.getElementById('lvlUpDesc');
        if (level === 2) {
            desc.innerHTML = "成功进化为【硕士级学术仓鼠】！<br>🎉 解锁新技能：本地PDF一键3句话宏观摘要，提取核心公式含义。";
        } else if (level === 3) {
            desc.innerHTML = "究极满级【赛博博导·终极智能体】！<br>🎉 解锁跨文献推理：可根据你过去喂给它的所有历史论文，直接寻找灵感漏洞，并一键推导演进出新的课题框架！";
        }
        win.classList.add('active');
    }

    function closeLvlUp() {
        document.getElementById('lvlUpWindow').classList.remove('active');
    }
</script>

</body>
</html>
