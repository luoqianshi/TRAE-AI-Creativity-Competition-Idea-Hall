<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题材雷达——A股智能辅助系统</title>
    <meta name="description" content="题材雷达——A股智能辅助系统，基于雪球大V、知识星球、钉钉财经信息的智能辅助工具">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0A0E17',
                            card: '#111827',
                            border: '#1F2937',
                            hover: '#1a2332',
                        },
                        neon: {
                            green: '#00E676',
                            orange: '#FF6D00',
                            blue: '#00B0FF',
                            red: '#EF4444',
                            yellow: '#F59E0B',
                            purple: '#A855F7',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['"JetBrains Mono"', '"Fira Code"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <!-- Marked.js (本地) -->
    <script src="/static/vendor/marked.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
    <!-- 行云科技风格 CSS -->
    <link rel="stylesheet" href="/static/css/xingyun.css">
    <style>
        .memory-filter-btn {
            padding: 6px 12px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #9ca3af;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .memory-filter-btn:hover {
            border-color: #6366f1;
            color: #e5e7eb;
        }
        .memory-filter-btn.active {
            background: #6366f1;
            border-color: #6366f1;
            color: #fff;
        }
        .topic-history-body p { margin: 0.3em 0; }
        .topic-history-body ul, .topic-history-body ol { padding-left: 1.2em; margin: 0.3em 0; }
        .topic-history-body strong { color: #d1d5db; }
        .topic-history-body a { color: #00B0FF; text-decoration: underline; }
        .note-reason-wrapper.collapsed .note-reason-text {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-reason-wrapper:not(.collapsed) .note-reason-text {
            white-space: normal;
        }
        .note-expand-btn { background: none; border: none; cursor: pointer; padding: 2px 0; }
        [data-note-id] { transition: opacity 0.2s, border-color 0.2s; }
        [data-note-id].drag-over { border-color: #00ff88 !important; }
    </style>
</head>
<body class="bg-cyber-bg text-gray-100 font-sans min-h-screen">

    <!-- 顶部导航栏 -->
    <nav id="navbar" class="sticky top-0 z-50 border-b border-cyber-border bg-cyber-bg/80 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14 sm:h-16">
                <!-- Logo -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="router.navigate('reports')">
                    <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-gradient-to-br from-neon-green to-neon-blue flex items-center justify-center shadow-lg shadow-neon-green/20">
                        <span class="text-cyber-bg font-bold text-base sm:text-lg">🐴</span>
                    </div>
                    <div>
                        <h1 class="text-base sm:text-lg font-bold bg-gradient-to-r from-neon-green to-neon-blue bg-clip-text text-transparent">
                            题材雷达——A股智能辅助系统
                        </h1>
                        <p class="text-[10px] text-gray-500 -mt-1 hidden sm:block">A股交易官智能系统</p>
                    </div>
                </div>

                <!-- 桌面端导航 -->
                <div class="hidden md:flex items-center space-x-1">
                    <button onclick="router.navigate('reports')" class="nav-link" data-page="reports">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        <span>日报</span>
                    </button>
                    <button onclick="router.navigate('bigv')" class="nav-link" data-page="bigv">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        <span>大V</span>
                    </button>
                    <button onclick="router.navigate('capacity')" class="nav-link" data-page="capacity">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        <span>容量票</span>
                    </button>
                    <button onclick="router.navigate('weekly')" class="nav-link" data-page="weekly">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        <span>周报</span>
                    </button>
                    <button onclick="router.navigate('notes')" class="nav-link" data-page="notes">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        <span>记事本</span>
                    </button>
                    <button onclick="router.navigate('memory')" class="nav-link" data-page="memory">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                        <span>记忆</span>
                    </button>
                </div>

                <!-- 右侧工具 -->
                <div class="flex items-center space-x-3">
                    <div id="live-clock" class="hidden sm:block text-xs text-gray-500 font-mono"></div>
                    <!-- 主题切换按钮 -->
                    <button id="theme-toggle" onclick="themeToggle.toggle()" class="theme-toggle-btn" title="切换主题">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                        <span class="hidden sm:inline">风格</span>
                    </button>
                    <div class="w-2 h-2 rounded-full bg-neon-green animate-pulse" title="系统在线"></div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6 pb-20 md:pb-6">

        <!-- 加载动画 -->
        <div id="loading" class="hidden flex items-center justify-center py-20">
            <div class="relative">
                <div class="w-12 h-12 border-2 border-cyber-border rounded-full animate-spin border-t-neon-green"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-sm">🐴</span>
                </div>
            </div>
        </div>

        <!-- 错误提示 -->
        <div id="error" class="hidden">
            <div class="max-w-md mx-auto mt-20 text-center">
                <div class="text-6xl mb-4">⚠️</div>
                <h2 class="text-xl font-semibold text-gray-300 mb-2">加载失败</h2>
                <p id="error-msg" class="text-gray-500 text-sm"></p>
                <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-cyber-card border border-cyber-border rounded-lg text-sm hover:bg-cyber-hover transition-colors">
                    重新加载
                </button>
            </div>
        </div>

        <!-- ==================== 日报列表视图 ==================== -->
        <div id="page-reports" class="page-view hidden">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-bold text-gray-200">📰 历史日报</h2>
            </div>
            <div id="reports-list" class="space-y-3">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- ==================== 日报详情视图 ==================== -->
        <div id="page-report-detail" class="page-view hidden">
            <div class="flex items-center space-x-3 mb-5">
                <button onclick="router.navigate('reports')" class="text-gray-500 hover:text-gray-300 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                <h2 id="report-detail-title" class="text-lg font-bold text-gray-200">日报详情</h2>
            </div>

            <!-- 当日统计 -->
            <div id="detail-stats" class="cyber-card p-3 mb-3 border-l-4 border-l-neon-blue hidden">
                <!-- 动态填充 -->
            </div>

            <!-- 市场情绪 -->
            <div id="detail-sentiment" class="cyber-card p-5 mb-4 border-l-4 border-l-neon-green">
                <!-- 动态填充 -->
            </div>

            <!-- 周报热门题材与标的（参照记忆模块） -->
            <div id="detail-memory-topics" class="hidden mb-4">
                <!-- 动态填充 -->
            </div>

            <!-- 题材情报局 -->
            <div id="detail-topics" class="space-y-4 mb-4">
                <!-- 动态填充 -->
            </div>

            <!-- 容量票筛选结果 -->
            <div id="detail-capacity" class="hidden mb-4">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- ==================== 大V观点视图 ==================== -->
        <div id="page-bigv" class="page-view hidden">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-bold text-gray-200">👤 大V观点</h2>
            </div>

            <!-- 筛选器 -->
            <div id="bigv-date-filter" class="mb-4 flex items-center space-x-3">
                <select id="bigv-date-select" onchange="components.filterBigvByDate(this.value)"
                        class="px-3 py-2 bg-cyber-card border border-cyber-border rounded-lg text-sm text-gray-200 focus:border-neon-green focus:outline-none cursor-pointer">
                    <option value="">全部日期</option>
                </select>
                <select id="bigv-topic-select" onchange="components.filterBigvByTopic(this.value)"
                        class="px-3 py-2 bg-cyber-card border border-cyber-border rounded-lg text-sm text-gray-200 focus:border-neon-green focus:outline-none cursor-pointer">
                    <option value="">全部题材</option>
                </select>
            </div>

            <!-- 大V筛选标签 -->
            <div id="bigv-tabs" class="flex space-x-2 mb-4 overflow-x-auto pb-2 scrollbar-hide">
                <!-- 动态填充 -->
            </div>

            <!-- 观点列表 -->
            <div id="bigv-list" class="space-y-4">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- ==================== 容量核心日票仓库 ==================== -->
        <div id="page-capacity" class="page-view hidden">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-bold text-gray-200">💰 容量核心日票仓库</h2>
                <span id="capacity-date" class="text-xs text-gray-600"></span>
            </div>
            <div id="capacity-list" class="space-y-3">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- ==================== 每周复盘周报 ==================== -->
        <div id="page-weekly" class="page-view hidden">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-bold text-gray-200">📈 每周复盘周报</h2>
                <span id="weekly-updated" class="text-xs text-gray-600"></span>
            </div>

            <!-- 周报列表 -->
            <section id="weekly-list" class="space-y-4">
                <!-- 动态填充 -->
            </section>
        </div>

        <!-- ==================== 记事本视图 ==================== -->
        <div id="page-notes" class="page-view hidden">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-bold text-gray-200">📝 标的记事本</h2>
                <button onclick="components.showNoteForm()" class="px-3 py-1.5 bg-neon-green/10 border border-neon-green/30 text-neon-green text-xs rounded-lg hover:bg-neon-green/20 transition-colors">
                    + 新增
                </button>
            </div>

            <!-- 新增/编辑表单 -->
            <div id="note-form" class="hidden mb-5 p-4 bg-cyber-card border border-cyber-border rounded-lg">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">股票名称 *</label>
                        <input id="note-name" type="text" placeholder="如：锦浪科技" class="w-full px-3 py-2 bg-cyber-bg border border-cyber-border rounded-lg text-sm text-gray-200 focus:border-neon-green focus:outline-none">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">股票代码</label>
                        <input id="note-code" type="text" placeholder="如：300763（可自动匹配）" class="w-full px-3 py-2 bg-cyber-bg border border-cyber-border rounded-lg text-sm text-gray-200 focus:border-neon-green focus:outline-none">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="text-xs text-gray-400 mb-1 block">看好原因 *</label>
                    <textarea id="note-reason" rows="3" placeholder="写明看好这只标的的原因..." class="w-full px-3 py-2 bg-cyber-bg border border-cyber-border rounded-lg text-sm text-gray-200 focus:border-neon-green focus:outline-none resize-none"></textarea>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="components.saveNote()" class="px-4 py-2 bg-neon-green text-cyber-bg text-sm font-medium rounded-lg hover:bg-neon-green/90 transition-colors">保存</button>
                    <button onclick="components.hideNoteForm()" class="px-4 py-2 bg-gray-700 text-gray-300 text-sm rounded-lg hover:bg-gray-600 transition-colors">取消</button>
                    <input id="note-edit-id" type="hidden" value="">
                </div>
            </div>

            <!-- 记事本列表 -->
            <section id="notes-list" class="space-y-3">
                <div class="text-center py-10 text-gray-500 text-sm">加载中...</div>
            </section>
        </div>

        <!-- ==================== 长期记忆视图 ==================== -->
        <div id="page-memory" class="page-view hidden">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-bold text-gray-200">🧠 长期记忆</h2>
                <span id="memory-updated" class="text-xs text-gray-600"></span>
            </div>

            <!-- 标的查询功能 -->
            <section id="memory-search" class="mb-6">
                <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-3">
                    <span class="mr-2">🔍</span>标的查询
                </h3>
                <div class="flex gap-3 mb-4">
                    <input type="text" id="stock-search-input" placeholder="输入股票名称或代码，如：锦浪科技、300763"
                           class="flex-1 px-4 py-2 bg-cyber-card border border-cyber-border rounded-lg text-sm text-gray-200 focus:border-neon-green focus:outline-none"
                           onkeypress="if(event.key==='Enter')components.searchStock()">
                    <button onclick="components.searchStock()" class="px-4 py-2 bg-neon-green text-cyber-bg text-sm font-medium rounded-lg hover:bg-neon-green/90 transition-colors">
                        查询
                    </button>
                </div>
                <div id="stock-search-results" class="hidden">
                    <!-- 查询结果 -->
                </div>
            </section>

            <!-- 题材热度排行（60天内） -->
            <section id="memory-topics-heat" class="mb-6">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider">
                        <span class="mr-2">🔥</span>题材热度排行
                    </h3>
                    <span id="memory-period" class="text-xs text-gray-500"></span>
                </div>
                <div id="topics-heat-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <!-- 动态填充 -->
                </div>
            </section>
        </div>

    </main>

    <!-- 题材/标的历史弹窗 -->
    <div id="topic-history-modal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" onclick="if(event.target===this)components.closeModal()">
        <div class="bg-cyber-card border border-cyber-border rounded-xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex items-center justify-between p-4 border-b border-cyber-border flex-shrink-0">
                <h3 id="topic-modal-title" class="text-sm font-semibold text-gray-200"></h3>
                <button onclick="components.closeModal()" class="text-gray-500 hover:text-gray-300 p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="topic-modal-body" class="p-4 overflow-y-auto flex-1 space-y-4">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <!-- 手机端底部导航 -->
    <nav id="bottom-nav" class="md:hidden fixed bottom-0 left-0 right-0 z-50 bg-cyber-bg/95 backdrop-blur-xl border-t border-cyber-border">
        <div class="flex items-center justify-around h-14">
            <button onclick="router.navigate('reports')" class="bottom-nav-btn" data-page="reports">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>日报</span>
            </button>
            <button onclick="router.navigate('bigv')" class="bottom-nav-btn" data-page="bigv">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>大V</span>
            </button>
            <button onclick="router.navigate('capacity')" class="bottom-nav-btn" data-page="capacity">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span>容量票</span>
            </button>
            <button onclick="router.navigate('notes')" class="bottom-nav-btn" data-page="notes">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                <span>记事本</span>
            </button>
            <button onclick="router.navigate('memory')" class="bottom-nav-btn" data-page="memory">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                <span>记忆</span>
            </button>
        </div>
