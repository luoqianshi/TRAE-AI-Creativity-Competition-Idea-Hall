<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>妈咪找室 · 300米内真实可用母婴室</title>
  <style>
    :root {
      --bg-primary: #fdf9f7;
      --bg-card: #ffffff;
      --bg-soft: #f9e8ec;
      --text-primary: #333333;
      --text-secondary: #6a6a6a;
      --accent: #e67e80;
      --accent-light: #f9e8ec;
      --border: #eae4e9;
      --shadow: 0 2px 12px rgba(230, 126, 128, 0.08);
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    .dark-theme {
      --bg-primary: #1a1a2e;
      --bg-card: #2d2d44;
      --bg-soft: #3a3a5a;
      --text-primary: #f8f9fa;
      --text-secondary: #a9a9c0;
      --accent: #ff9a9e;
      --accent-light: #2d2d44;
      --border: #4a4a6a;
      --shadow: 0 2px 12px rgba(102, 51, 102, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: var(--transition);
      padding-bottom: 2rem;
    }

    .container {
      max-width: 1024px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    /* Header */
    header {
      padding: 1.5rem 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.25rem;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 2.5rem 0;
      margin-bottom: 2rem;
    }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .hero p {
      font-size: 1.125rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Location Selector */
    .location-section {
      background: var(--bg-soft);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin: 2rem 0;
      box-shadow: var(--shadow);
    }

    .section-title {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .location-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .location-btn {
      padding: 0.625rem 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .location-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .location-btn:hover:not(.active) {
      background: var(--bg-card);
      transform: translateY(-2px);
    }

    /* Map Placeholder */
    .map-placeholder {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin: 1.5rem 0;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .map-placeholder::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #ffd1dc, var(--accent));
    }

    .map-svg {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: block;
      height: 180px;
      background: #f8f9fa;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }

    .map-svg::before {
      content: "📍 当前定位：西湖银泰";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.9rem;
      color: #7a7a7a;
      font-weight: 500;
    }

    /* Results */
    .results-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.5rem 0 1rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .refresh-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .refresh-btn:hover {
      background: #d46b6d;
      transform: scale(1.02);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-top: 1rem;
    }

    .room-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      border: 1px solid var(--border);
    }

    .room-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(230, 126, 128, 0.12);
    }

    .room-img {
      height: 140px;
      background: linear-gradient(135deg, #fde2e4, #ffe6eb);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e67e80;
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
      padding: 0.5rem;
      line-height: 1.4;
    }

    .room-info {
      padding: 1.25rem;
    }

    .room-name {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .room-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .room-meta span {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }

    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-open {
      background: #d4edda;
      color: #155724;
    }

    .status-busy {
      background: #fff3cd;
      color: #856404;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem 0;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        text-align: center;
      }

      .hero h1 {
        font-size: 1.875rem;
      }

      .results-grid {
        grid-template-columns: 1fr;
      }

      .location-selector {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: 1.625rem;
      }

      .hero p {
        font-size: 1rem;
      }

      .section-title {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">🍼</div>
        <div class="logo-text">妈咪找室</div>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg viewBox="0 0 24 24">
          <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5z" />
          <path d="M17.657 5.657a.75.75 0 011.06 1.06l-2.25 2.25a.75.75 0 01-1.06 0l-2.25-2.25a.75.75 0 011.06-1.06l1.25 1.25a.75.75 0 001.06 0l1.25-1.25z" />
          <path d="M12 11.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z" />
          <path d="M21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.657 18.343a.75.75 0 011.06-1.06l-2.25-2.25a.75.75 0 010-1.06l2.25-2.25a.75.75 0 011.06 1.06l-1.25 1.25a.75.75 0 000 1.06l1.25 1.25z" />
          <path d="M12 20.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z" />
          <path d="M4.75 12a.75.75 0 01-.75.75H1.75a.75.75 0 010-1.5H4a.75.75 0 01.75.75zM3.657 18.343a.75.75 0 011.06-1.06l-2.25-2.25a.75.75 0 010-1.06l2.25-2.25a.75.75 0 011.06 1.06l-1.25 1.25a.75.75 0 000 1.06l1.25 1.25z" />
        </svg>
      </button>
    </header>

    <section class="hero">
      <h1>300米内，真实可用母婴室</h1>
      <p>不显示过期信息，不标“有”却锁门——只推送当前开门、干净、有尿布台+电源的母婴室</p>
    </section>

    <section class="location-section">
      <h2 class="section-title">📍 当前位置</h2>
      <div class="location-selector">
        <button class="location-btn active" data-location="xihu">西湖银泰</button>
        <button class="location-btn" data-location="fengqi">凤起路地铁站</button>
        <button class="location-btn" data-location="xixi">西溪湿地东门</button>
      </div>

      <div class="map-placeholder">
        <h3 class="section-title">📍 地图示意</h3>
        <div class="map-svg"></div>
      </div>
    </section>

    <div class="results-title">
      <span>附近可用母婴室（300米内）</span>
      <button class="refresh-btn" id="refreshBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L21 9M11.6 17.4l-2.25-2.25M7.75 13.75l2.25 2.25"></path></svg>
        刷新状态
      </button>
    </div>

    <div class="results-grid" id="resultsGrid">
      <!-- Will be populated by JS -->
    </div>

    <footer>
      <p>数据来源：杭州、成都、深圳已开放母婴室管理后台 | 状态每15秒自动更新</p>
      <p>© 2024 妈咪找室 · 轻量演示版</p>
    </footer>
  </div>

  <script>
    // Mock data for three locations
    const locationData = {
      xihu: [
        {
          id: 1,
          name: "西湖银泰 · 3F 南区母婴室",
          distance: "82米",
          status: "开放中｜清洁完成｜无人占用",
          features: ["尿布台", "电源插座", "热水", "哺乳椅"],
          imgDesc: "明亮整洁，落地窗采光"
        },
        {
          id: 2,
          name: "西湖银泰 · B1 家乐福旁",
          distance: "156米",
          status: "开放中｜刚清洁｜排队1人",
          features: ["尿布台", "电源插座", "洗手池"],
          imgDesc: "温馨木质风，独立隔间"
        }
      ],
      fengqi: [
        {
          id: 3,
          name: "凤起路站 · 付费区北侧",
          distance: "43米",
          status: "开放中｜清洁完成｜无人占用",
          features: ["尿布台", "电源插座", "洗手池", "哺乳帘"],
          imgDesc: "地铁内首间智能母婴室"
        },
        {
          id: 4,
          name: "凤起路站 · 出口2旁服务台后",
          distance: "210米",
          status: "维护中｜今日暂停使用",
          features: ["暂不可用"],
          imgDesc: "维修中，预计14:30恢复"
        }
      ],
      xixi: [
        {
          id: 5,
          name: "西溪湿地东门 · 游客中心二楼",
          distance: "12米",
          status: "开放中｜清洁完成｜无人占用",
          features: ["尿布台", "电源插座", "热水", "婴儿床"],
          imgDesc: "景区内最宽敞母婴室"
        }
      ]
    };

    // Status cycle for refresh simulation
    const statusCycles = [
      "开放中｜清洁完成｜无人占用",
      "开放中｜刚清洁｜排队1人",
      "开放中｜清洁中｜请稍候",
      "开放中｜清洁完成｜无人占用"
    ];

    // DOM elements
    const resultsGrid = document.getElementById('resultsGrid');
    const locationButtons = document.querySelectorAll('.location-btn');
    const refreshBtn = document.getElementById('refreshBtn');
    const themeToggle = document.getElementById('themeToggle');

    // Initial render
    function renderResults(locationKey) {
      const data = locationData[locationKey] || locationData.xihu;
      resultsGrid.innerHTML = '';
      
      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'room-card';
        card.innerHTML = `
          <div class="room-img">${item.imgDesc}</div>
          <div class="room-info">
            <h3 class="room-name">${item.name}</h3>
            <div class="room-meta">
              <span>🧭 ${item.distance}</span>
              <span>✅ ${item.status}</span>
            </div>
            <div class="features">
              ${item.features.map(f => `<span class="feature">• ${f}</span>`).join('')}
            </div>
          </div>
        `;
        resultsGrid.appendChild(card);
      });
    }

    // Set active location button
    function setActiveLocation(key) {
      locationButtons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.location === key);
      });

      // Update map placeholder text
      const mapPlaceholder = document.querySelector('.map-placeholder');
      const locationNames = { xihu: '西湖银泰', fengqi: '凤起路地铁站', xixi: '西溪湿地东门' };
      const mapText = mapPlaceholder.querySelector('.map-svg::before');
      mapPlaceholder.innerHTML = `
        <h3 class="section-title">📍 地图示意</h3>
        <div class="map-svg"></div>
      `;
      mapPlaceholder.querySelector('.map-svg').insertAdjacentHTML('beforeend', 
        `📍 当前定位：${locationNames[key]}`);
    }

    // Theme toggle
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-theme');
      const isDark = document.body.classList.contains('dark-theme');
      themeToggle.innerHTML = isDark 
        ? `<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5z"/><path d="M17.657 5.657a.75.75 0 011.06 1.06l-2.25 2.25a.75.75 0 01-1.06 0l-2.25-2.25a.75.75 0 011.06-1.06l1.25 1.25a.75.75 0 001.06 0l1.25-1.25z"/><path d="M12 11.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/><path d="M21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.657 18.343a.75.75 0 011.06-1.06l-2.25-2.25a.75.75 0 010-1.06l2.25-2.25a.75.75 0 011.06 1.06l-1.25 1.25a.75.75 0 000 1.06l1.25 1.25z"/><path d="M12 20.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/><path d="M4.75 12a.75.75 0 01-.75.75H1.75a.75.75 0 010-1.5H4a.75.75 0 01.75.75zM3.657 18.343a.75.75 0 011.06-1.06l-2.25-2.25a.75.75 0 010-1.06l2.25-2.25a.75.75 0 011.06 1.06l-1.25 1.25a.75.75 0 000 1.06l1.25 1.25z"/></svg>`
        : `<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5z"/><path d="M17.657 5.657a.75.75 0 011.06 1.06l-2.25 2.25a.75.75 0 01-1.06 0l-2.25-2.25a.75.75 0 011.06-1.06l1.25 1.25a.75.75 0 001.06 0l1.25-1.25z"/><path d="M12 11.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/><path d="M21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.657 18.343a.75.75 0 011.06-1.06l-2.25-2.25a.75.75 0 010-1.06l2.25-2.25a.75.75 0 011.06 1.06l-1.25 1.25a.75.75 0 000 1.06l1.25 1.25z"/><path d="M12 20.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5z"/><path d="M4.75 12a.75.75 0 01-.75.75H1.75a.75.75 0 010-1.5H4a.75.75 0 01.75.75zM3.657 18.343a.75.75 0 011.06-1.06l-2.25-2.25a.75.75 0 010-1.06l2.25-2.25a.75.75 0 011.06 1.06l-1.25 1.25a.75.75 0 000 1.06l1.25 1.25z"/></svg>`;
    });

    // Location switching
    locationButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.location;
        setActiveLocation(key);
        renderResults(key);
      });
    });

    // Refresh status simulation
    refreshBtn.addEventListener('click', () => {
      const cards = document.querySelectorAll('.room-card');
      cards.forEach((card, index) => {
        const statusEl = card.querySelector('.room-meta span:last-child');
        if (statusEl) {
          const currentStatus = statusEl.textContent.trim();
          const currentIndex = statusCycles.findIndex(s => s === currentStatus);
          const nextIndex = (currentIndex + 1) % statusCycles.length;
          statusEl.textContent = `✅ ${statusCycles[nextIndex]}`;
        }
      });
    });

    // Initialize
    setActiveLocation('xihu');
    renderResults('xihu');
  </script>
</body>
</html>
