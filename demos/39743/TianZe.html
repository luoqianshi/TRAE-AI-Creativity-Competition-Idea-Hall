<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选车对比助手 - 记录你的购车初心</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff3344;
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .car-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .car-card:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .car-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.4em;
        }

        .car-card .field {
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }

        .car-card .field-label {
            color: #888;
            font-size: 14px;
        }

        .car-card .field-value {
            color: #333;
            font-weight: 600;
        }

        .car-card .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .car-card .actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .comparison-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        .comparison-table tr:hover {
            background: #f5f5f5;
        }

        .comparison-table .car-header {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #333;
            font-size: 1.5em;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #888;
        }

        .close-btn:hover {
            color: #333;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            margin: 5px 5px 5px 0;
        }

        .tag.editable {
            cursor: pointer;
            transition: all 0.3s;
        }

        .tag.editable:hover {
            background: #667eea;
            color: white;
        }

        .tag.selected {
            background: #667eea;
            color: white;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            background: #f5f5f5;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkbox-item:hover {
            background: #e0e0e0;
        }

        .checkbox-item input {
            width: auto;
        }

        .motivation-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .motivation-card h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .motivation-card textarea {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
        }

        .tip-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
        }

        .tip-box strong {
            color: #856404;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-item .number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-item .label {
            font-size: 14px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .tabs {
                justify-content: center;
            }

            .car-grid {
                grid-template-columns: 1fr;
            }

            .comparison-table {
                font-size: 14px;
            }

            .comparison-table th,
            .comparison-table td {
                padding: 10px 5px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚗 选车对比助手</h1>
            <p>记录购车初心，轻松对比，理性选择</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('初心')">💭 购车初心</button>
            <button class="tab-btn" onclick="showTab('添加')">➕ 添加车型</button>
            <button class="tab-btn" onclick="showTab('列表')">📋 车型列表</button>
            <button class="tab-btn" onclick="showTab('对比')">⚖️ 对比分析</button>
        </div>

        <!-- 购车初心 -->
        <div id="tab-初心" class="tab-content">
            <div class="card">
                <h2>💭 记录你的购车初心</h2>
                <div class="tip-box">
                    <strong>💡 提示：</strong>写下你最初想要的车是什么样的，帮助你在众多选择中保持清醒，不被五花八门的宣传迷了眼。
                </div>

                <div class="form-group">
                    <label>预算范围</label>
                    <input type="text" id="budget" placeholder="例如：15-20万">
                </div>

                <div class="form-group">
                    <label>用车场景（可多选）</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" value="通勤代步"> 通勤代步
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="家庭出行"> 家庭出行
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="周末自驾"> 周末自驾
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="长途旅行"> 长途旅行
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="商务用途"> 商务用途
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="追求操控"> 追求操控
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>最看重的3个因素</label>
                    <input type="text" id="topFactors" placeholder="例如：安全性、油耗、空间（用逗号分隔）">
                </div>

                <div class="form-group">
                    <label>绝对不能接受的点</label>
                    <input type="text" id="dealbreakers" placeholder="例如：三缸机、续航短">
                </div>

                <div class="form-group">
                    <label>对品牌的偏好</label>
                    <input type="text" id="brandPreference" placeholder="例如：优先考虑国产新势力">
                </div>

                <div class="form-group">
                    <label>其他想法或初心</label>
                    <textarea id="initialThought" placeholder="写下你最初选车时的想法和期望..."></textarea>
                </div>

                <button class="btn btn-primary" onclick="saveMotivation()">💾 保存初心</button>

                <div id="motivationSaved" class="motivation-card" style="display:none;">
                    <h3>🎯 你的购车初心</h3>
                    <div id="motivationContent"></div>
                </div>
            </div>
        </div>

        <!-- 添加车型 -->
        <div id="tab-添加" class="tab-content" style="display:none;">
            <div class="card">
                <h2>➕ 添加候选车型</h2>
                <div class="tip-box">
                    <strong>💡 提示：</strong>记录你看中的车型信息，方便后续对比。可以添加多个车型进行比较。
                </div>

                <div class="form-group">
                    <label>车型名称 *</label>
                    <input type="text" id="carName" placeholder="例如：比亚迪汉 EV 2024款">
                </div>

                <div class="form-group">
                    <label>价格（万元）</label>
                    <input type="text" id="carPrice" placeholder="例如：18.98">
                </div>

                <div class="form-group">
                    <label>基本参数</label>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px;">
                        <input type="text" id="carPower" placeholder="动力参数（如：204马力）">
                        <input type="text" id="carBattery" placeholder="电池/续航（如：60度电/500km）">
                    </div>
                </div>

                <div class="form-group">
                    <label>车身尺寸（长×宽×高）</label>
                    <input type="text" id="carDimensions" placeholder="例如：4995×1990×1495mm">
                </div>

                <div class="form-group">
                    <label>详细参数</label>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px;">
                        <input type="text" id="carWeight" placeholder="车重（如：1850kg）">
                        <input type="text" id="carWheelSize" placeholder="车轮尺寸（如：245/45 R19）">
                        <input type="text" id="carEnergyConsumption" placeholder="百公里能耗（如：15.2kWh）">
                        <input type="text" id="carGroundClearance" placeholder="最小离地间隙（如：145mm）">
                    </div>
                </div>

                <div class="form-group">
                    <label>外观评分（1-5星）</label>
                    <select id="carAppearance">
                        <option value="">请选择</option>
                        <option value="1">⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="5">⭐⭐⭐⭐⭐</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>内饰评分（1-5星）</label>
                    <select id="carInterior">
                        <option value="">请选择</option>
                        <option value="1">⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="5">⭐⭐⭐⭐⭐</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>配置亮点（用逗号分隔）</label>
                    <input type="text" id="carFeatures" placeholder="例如：智能驾驶、座椅通风、氛围灯">
                </div>

                <div class="form-group">
                    <label>个人备注</label>
                    <textarea id="carNotes" placeholder="记录你试驾的感受、优缺点等..."></textarea>
                </div>

                <div style="display:flex; gap:10px;">
                    <button class="btn btn-primary" onclick="addCar()">✅ 添加车型</button>
                    <button class="btn btn-secondary" onclick="clearForm()">🔄 清空表单</button>
                </div>
            </div>
        </div>

        <!-- 车型列表 -->
        <div id="tab-列表" class="tab-content" style="display:none;">
            <div class="card">
                <h2>📋 我的候选车型</h2>

                <div class="stats">
                    <div class="stat-item">
                        <div class="number" id="totalCars">0</div>
                        <div class="label">候选车型</div>
                    </div>
                    <div class="stat-item">
                        <div class="number" id="avgPrice">-</div>
                        <div class="label">平均价格(万)</div>
                    </div>
                </div>

                <div id="carList" class="car-grid">
                    <div class="empty-state">
                        <div class="icon">🚗</div>
                        <p>还没有添加任何车型</p>
                        <p style="font-size:14px;">去"添加车型"页面开始记录吧</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 对比分析 -->
        <div id="tab-对比" class="tab-content" style="display:none;">
            <div class="card">
                <h2>⚖️ 车型对比分析</h2>

                <div class="form-group">
                    <label>选择要对比的字段（至少选择2项）</label>
                    <div class="checkbox-group" id="fieldSelector">
                        <label class="checkbox-item">
                            <input type="checkbox" value="price" checked> 价格
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="power" checked> 动力
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="battery" checked> 续航
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="dimensions" checked> 车身尺寸
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="weight" checked> 车重
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="wheelSize"> 车轮尺寸
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="energyConsumption"> 百公里能耗
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="groundClearance"> 最小离地间隙
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="appearance"> 外观评分
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="interior"> 内饰评分
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" value="features"> 配置亮点
                        </label>
                    </div>
                    <button class="btn btn-secondary" style="margin-top:10px;" onclick="showComparison()">🔍
                        生成对比表</button>
                </div>

                <div id="comparisonResult">
                    <div class="empty-state">
                        <div class="icon">⚖️</div>
                        <p>选择要对比的车型和字段</p>
                        <p style="font-size:14px;">在"车型列表"页面勾选车型后，再到这里生成对比</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>编辑车型信息</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="editFormContent"></div>
        </div>
    </div>

    <script>
        // 数据存储
        let cars = JSON.parse(localStorage.getItem('cars')) || [];
        let motivation = JSON.parse(localStorage.getItem('motivation')) || {};
        let selectedCars = new Set();

        // 初始化
        document.addEventListener('DOMContentLoaded', function () {
            loadData();
            updateStats();
        });

        // 加载数据
        function loadData() {
            if (motivation && Object.keys(motivation).length > 0) {
                document.getElementById('budget').value = motivation.budget || '';
                document.getElementById('topFactors').value = motivation.topFactors || '';
                document.getElementById('dealbreakers').value = motivation.dealbreakers || '';
                document.getElementById('brandPreference').value = motivation.brandPreference || '';
                document.getElementById('initialThought').value = motivation.initialThought || '';

                // 加载场景选择
                if (motivation.scenarios) {
                    const checkboxes = document.querySelectorAll('#tab-初心 .checkbox-item input[type="checkbox"]');
                    checkboxes.forEach(cb => {
                        if (motivation.scenarios.includes(cb.value)) {
                            cb.checked = true;
                        }
                    });
                }

                showMotivationCard();
            }

            renderCarList();
        }

        // 显示标签页
        function showTab(tabName) {
            // 隐藏所有标签页
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });

            // 显示选中的标签页
            document.getElementById('tab-' + tabName).style.display = 'block';

            // 更新按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 如果切换到列表或对比，更新显示
            if (tabName === '列表' || tabName === '对比') {
                updateStats();
                if (tabName === '列表') {
                    renderCarList();
                }
            }
        }

        // 保存购车初心
        function saveMotivation() {
            const scenarios = [];
            document.querySelectorAll('#tab-初心 .checkbox-item input[type="checkbox"]:checked').forEach(cb => {
                scenarios.push(cb.value);
            });

            motivation = {
                budget: document.getElementById('budget').value,
                scenarios: scenarios,
                topFactors: document.getElementById('topFactors').value,
                dealbreakers: document.getElementById('dealbreakers').value,
                brandPreference: document.getElementById('brandPreference').value,
                initialThought: document.getElementById('initialThought').value,
                savedAt: new Date().toISOString()
            };

            localStorage.setItem('motivation', JSON.stringify(motivation));

            alert('✅ 购车初心已保存！');
            showMotivationCard();
        }

        // 显示初心卡片
        function showMotivationCard() {
            const card = document.getElementById('motivationSaved');
            const content = document.getElementById('motivationContent');

            let html = '<div style="background:white; padding:15px; border-radius:8px; color:#333;">';

            if (motivation.budget) {
                html += '<p><strong>💰 预算：</strong>' + motivation.budget + '</p>';
            }

            if (motivation.scenarios && motivation.scenarios.length > 0) {
                html += '<p><strong>🚗 使用场景：</strong>' + motivation.scenarios.join('、') + '</p>';
            }

            if (motivation.topFactors) {
                html += '<p><strong>⭐ 最看重：</strong>' + motivation.topFactors + '</p>';
            }

            if (motivation.dealbreakers) {
                html += '<p><strong>❌ 绝对不接受：</strong>' + motivation.dealbreakers + '</p>';
            }

            if (motivation.brandPreference) {
                html += '<p><strong>🏷️ 品牌偏好：</strong>' + motivation.brandPreference + '</p>';
            }

            if (motivation.initialThought) {
                html += '<p><strong>💭 初心想法：</strong>' + motivation.initialThought + '</p>';
            }

            html += '</div>';

            content.innerHTML = html;
            card.style.display = 'block';
        }

        // 添加车型
        function addCar() {
            const name = document.getElementById('carName').value.trim();

            if (!name) {
                alert('请输入车型名称');
                return;
            }

            const car = {
                id: Date.now(),
                name: name,
                price: document.getElementById('carPrice').value,
                power: document.getElementById('carPower').value,
                battery: document.getElementById('carBattery').value,
                dimensions: document.getElementById('carDimensions').value,
                weight: document.getElementById('carWeight').value,
                wheelSize: document.getElementById('carWheelSize').value,
                energyConsumption: document.getElementById('carEnergyConsumption').value,
                groundClearance: document.getElementById('carGroundClearance').value,
                appearance: document.getElementById('carAppearance').value,
                interior: document.getElementById('carInterior').value,
                features: document.getElementById('carFeatures').value,
                notes: document.getElementById('carNotes').value,
                createdAt: new Date().toISOString()
            };

            cars.push(car);
            saveCars();
            clearForm();
            alert('✅ 车型已添加！');

            // 切换到列表页面
            showTab('列表');
            document.querySelectorAll('.tab-btn')[2].click();
        }

        // 清空表单
        function clearForm() {
            document.getElementById('carName').value = '';
            document.getElementById('carPrice').value = '';
            document.getElementById('carPower').value = '';
            document.getElementById('carBattery').value = '';
            document.getElementById('carDimensions').value = '';
            document.getElementById('carWeight').value = '';
            document.getElementById('carWheelSize').value = '';
            document.getElementById('carEnergyConsumption').value = '';
            document.getElementById('carGroundClearance').value = '';
            document.getElementById('carAppearance').value = '';
            document.getElementById('carInterior').value = '';
            document.getElementById('carFeatures').value = '';
            document.getElementById('carNotes').value = '';
        }

        // 渲染车型列表
        function renderCarList() {
            const list = document.getElementById('carList');

            if (cars.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🚗</div>
                        <p>还没有添加任何车型</p>
                        <p style="font-size:14px;">去"添加车型"页面开始记录吧</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = cars.map(car => `
                <div class="car-card">
                    <h3>${car.name}</h3>
                    ${car.price ? `<div class="field"><span class="field-label">💰 价格</span><span class="field-value">${car.price}万</span></div>` : ''}
                    ${car.power ? `<div class="field"><span class="field-label">⚡ 动力</span><span class="field-value">${car.power}</span></div>` : ''}
                    ${car.battery ? `<div class="field"><span class="field-label">🔋 续航</span><span class="field-value">${car.battery}</span></div>` : ''}
                    ${car.dimensions ? `<div class="field"><span class="field-label">📏 尺寸</span><span class="field-value">${car.dimensions}</span></div>` : ''}
                    ${car.weight ? `<div class="field"><span class="field-label">⚖️ 车重</span><span class="field-value">${car.weight}</span></div>` : ''}
                    ${car.wheelSize ? `<div class="field"><span class="field-label">🛞 轮毂</span><span class="field-value">${car.wheelSize}</span></div>` : ''}
                    ${car.energyConsumption ? `<div class="field"><span class="field-label">⚡ 能耗</span><span class="field-value">${car.energyConsumption}</span></div>` : ''}
                    ${car.groundClearance ? `<div class="field"><span class="field-label">📐 离地</span><span class="field-value">${car.groundClearance}</span></div>` : ''}
                    ${car.appearance ? `<div class="field"><span class="field-label">👀 外观</span><span class="field-value">${'⭐'.repeat(parseInt(car.appearance))}</span></div>` : ''}
                    ${car.interior ? `<div class="field"><span class="field-label">🛋️ 内饰</span><span class="field-value">${'⭐'.repeat(parseInt(car.interior))}</span></div>` : ''}
                    ${car.features ? `<div class="field"><span class="field-label">✨ 配置</span><span class="field-value">${car.features}</span></div>` : ''}
                    ${car.notes ? `<div class="field"><span class="field-label">📝 备注</span><span class="field-value">${car.notes.substring(0, 30)}${car.notes.length > 30 ? '...' : ''}</span></div>` : ''}
                    <div class="actions">
                        <button class="btn btn-secondary" onclick="editCar(${car.id})" style="background:#667eea; color:white;">编辑</button>
                        <button class="btn btn-danger" onclick="deleteCar(${car.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 编辑车型
        function editCar(id) {
            const car = cars.find(c => c.id === id);
            if (!car) return;

            const html = `
                <div class="form-group">
                    <label>车型名称 *</label>
                    <input type="text" id="editName" value="${car.name}">
                </div>
                <div class="form-group">
                    <label>价格（万元）</label>
                    <input type="text" id="editPrice" value="${car.price || ''}">
                </div>
                <div class="form-group">
                    <label>动力参数</label>
                    <input type="text" id="editPower" value="${car.power || ''}">
                </div>
                <div class="form-group">
                    <label>电池/续航</label>
                    <input type="text" id="editBattery" value="${car.battery || ''}">
                </div>
                <div class="form-group">
                    <label>车身尺寸（长×宽×高）</label>
                    <input type="text" id="editDimensions" value="${car.dimensions || ''}">
                </div>
                <div class="form-group">
                    <label>车重</label>
                    <input type="text" id="editWeight" value="${car.weight || ''}">
                </div>
                <div class="form-group">
                    <label>车轮尺寸</label>
                    <input type="text" id="editWheelSize" value="${car.wheelSize || ''}">
                </div>
                <div class="form-group">
                    <label>百公里能耗</label>
                    <input type="text" id="editEnergyConsumption" value="${car.energyConsumption || ''}">
                </div>
                <div class="form-group">
                    <label>最小离地间隙</label>
                    <input type="text" id="editGroundClearance" value="${car.groundClearance || ''}">
                </div>
                <div class="form-group">
                    <label>外观评分</label>
                    <select id="editAppearance">
                        <option value="">请选择</option>
                        <option value="1" ${car.appearance === '1' ? 'selected' : ''}>⭐</option>
                        <option value="2" ${car.appearance === '2' ? 'selected' : ''}>⭐⭐</option>
                        <option value="3" ${car.appearance === '3' ? 'selected' : ''}>⭐⭐⭐</option>
                        <option value="4" ${car.appearance === '4' ? 'selected' : ''}>⭐⭐⭐⭐</option>
                        <option value="5" ${car.appearance === '5' ? 'selected' : ''}>⭐⭐⭐⭐⭐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>内饰评分</label>
                    <select id="editInterior">
                        <option value="">请选择</option>
                        <option value="1" ${car.interior === '1' ? 'selected' : ''}>⭐</option>
                        <option value="2" ${car.interior === '2' ? 'selected' : ''}>⭐⭐</option>
                        <option value="3" ${car.interior === '3' ? 'selected' : ''}>⭐⭐⭐</option>
                        <option value="4" ${car.interior === '4' ? 'selected' : ''}>⭐⭐⭐⭐</option>
                        <option value="5" ${car.interior === '5' ? 'selected' : ''}>⭐⭐⭐⭐⭐</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>配置亮点</label>
                    <input type="text" id="editFeatures" value="${car.features || ''}">
                </div>
                <div class="form-group">
                    <label>个人备注</label>
                    <textarea id="editNotes">${car.notes || ''}</textarea>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-primary" onclick="updateCar(${car.id})">保存修改</button>
                    <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                </div>
            `;

            document.getElementById('editFormContent').innerHTML = html;
            document.getElementById('editModal').classList.add('active');
        }

        // 更新车型
        function updateCar(id) {
            const car = cars.find(c => c.id === id);
            if (!car) return;

            car.name = document.getElementById('editName').value;
            car.price = document.getElementById('editPrice').value;
            car.power = document.getElementById('editPower').value;
            car.battery = document.getElementById('editBattery').value;
            car.dimensions = document.getElementById('editDimensions').value;
            car.weight = document.getElementById('editWeight').value;
            car.wheelSize = document.getElementById('editWheelSize').value;
            car.energyConsumption = document.getElementById('editEnergyConsumption').value;
            car.groundClearance = document.getElementById('editGroundClearance').value;
            car.appearance = document.getElementById('editAppearance').value;
            car.interior = document.getElementById('editInterior').value;
            car.features = document.getElementById('editFeatures').value;
            car.notes = document.getElementById('editNotes').value;

            saveCars();
            closeModal();
            renderCarList();
            alert('✅ 车型已更新！');
        }

        // 删除车型
        function deleteCar(id) {
            if (!confirm('确定要删除这个车型吗？')) return;

            cars = cars.filter(c => c.id !== id);
            saveCars();
            renderCarList();
            updateStats();
        }

        // 保存数据到localStorage
        function saveCars() {
            localStorage.setItem('cars', JSON.stringify(cars));
            updateStats();
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalCars').textContent = cars.length;

            if (cars.length > 0) {
                const prices = cars.filter(c => c.price).map(c => parseFloat(c.price));
                if (prices.length > 0) {
                    const avg = (prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(1);
                    document.getElementById('avgPrice').textContent = avg;
                } else {
                    document.getElementById('avgPrice').textContent = '-';
                }
            } else {
                document.getElementById('avgPrice').textContent = '-';
            }
        }

        // 显示对比
        function showComparison() {
            if (cars.length < 2) {
                alert('请至少添加2个车型进行对比');
                return;
            }

            const selectedFields = [];
            document.querySelectorAll('#fieldSelector input[type="checkbox"]:checked').forEach(cb => {
                selectedFields.push(cb.value);
            });

            if (selectedFields.length < 2) {
                alert('请至少选择2个字段进行对比');
                return;
            }

            const fieldNames = {
                price: '价格（万）',
                power: '动力',
                battery: '续航',
                dimensions: '车身尺寸',
                weight: '车重',
                wheelSize: '车轮尺寸',
                energyConsumption: '百公里能耗',
                groundClearance: '最小离地间隙',
                appearance: '外观评分',
                interior: '内饰评分',
                features: '配置亮点'
            };

            let html = '<table class="comparison-table"><thead><tr><th>对比项目</th>';
            cars.forEach(car => {
                html += `<th>${car.name}</th>`;
            });
            html += '</tr></thead><tbody>';

            selectedFields.forEach(field => {
                html += `<tr><td><strong>${fieldNames[field]}</strong></td>`;
                cars.forEach(car => {
                    let value = car[field] || '-';
                    if (field === 'appearance' || field === 'interior') {
                        value = value ? '⭐'.repeat(parseInt(value)) : '-';
                    }
                    html += `<td>${value}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';

            document.getElementById('comparisonResult').innerHTML = html;
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // 点击弹窗背景关闭
        document.getElementById('editModal').addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>

</html>
