<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>事刻 TimeTrace v2.0</title>
<style>
/* ============================================
   事刻 TimeTrace v2.0 — 世界级视觉重构
   设计原则：
   1. 移动优先 — 弹窗底部抽屉、触摸友好
   2. 精致阴影 — 多层投影系统
   3. 呼吸感 — 充足留白与节奏
   4. 微交互 — 流畅过渡与反馈
   ============================================ */

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root {
  --canvas: #faf9f5;
  --surface: #f3f1eb;
  --elevated: #ffffff;
  --border: #e8e6dc;
  --border-strong: #d5d2c5;
  --text-primary: #141413;
  --text-secondary: #6b6960;
  --text-muted: #b0aea5;
  --accent: #d97757;
  --accent-warm: #e8936f;
  --accent-glow: rgba(217,119,87,0.3);
  --accent-subtle: rgba(217,119,87,0.08);
  --blue: #6a9bcc;
  --blue-subtle: rgba(106,155,204,0.1);
  --green: #788c5d;
  --green-subtle: rgba(120,140,93,0.1);
  --amber: #c4854b;
  --amber-subtle: rgba(196,133,75,0.1);
  --danger: #d45a4a;
  --font-heading: 'Poppins', Arial, sans-serif;
  --font-body: 'Lora', Georgia, serif;
  --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --time-axis-w: 72px;
  --col-w: 240px;
  --header-h: 52px;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  /* 多层阴影系统 */
  --shadow-sm: 0 1px 3px rgba(20,20,19,0.04), 0 1px 2px rgba(20,20,19,0.06);
  --shadow-md: 0 4px 12px rgba(20,20,19,0.06), 0 2px 6px rgba(20,20,19,0.04);
  --shadow-lg: 0 12px 40px rgba(20,20,19,0.08), 0 4px 16px rgba(20,20,19,0.06);
  --shadow-xl: 0 24px 64px rgba(20,20,19,0.12), 0 8px 32px rgba(20,20,19,0.08);
  --shadow-accent: 0 8px 32px rgba(217,119,87,0.15), 0 2px 12px rgba(217,119,87,0.1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; overflow: hidden;
  font-family: var(--font-body);
  background: var(--canvas);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============================================
   画廊视图
   ============================================ */
#galleryView {
  display: none; flex-direction: column;
  height: 100%; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
#galleryView.active { display: flex; }

.gallery-hero {
  padding: 120px 80px 72px;
  position: relative;
}
.gallery-hero::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: radial-gradient(ellipse 70% 50% at 25% 20%, rgba(217,119,87,0.06) 0%, transparent 60%),
              radial-gradient(ellipse 35% 35% at 75% 70%, rgba(106,155,204,0.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
.gallery-hero > * { position: relative; z-index: 1; }

.gallery-hero .version-badge {
  display: inline-block;
  font-family: var(--font-heading);
  font-size: 11px; font-weight: 700; color: var(--accent);
  padding: 5px 14px; border-radius: 20px;
  background: var(--accent-subtle);
  margin-bottom: 20px; letter-spacing: 0.5px;
}

.gallery-hero .brand {
  font-family: var(--font-heading);
  font-size: 80px; font-weight: 800;
  letter-spacing: -2.5px; line-height: 0.95;
  color: var(--text-primary);
  margin-bottom: 16px;
}
.gallery-hero .brand span { color: var(--accent); }
.gallery-hero .tagline {
  font-family: var(--font-heading);
  font-size: 15px; font-weight: 600;
  color: var(--text-muted); letter-spacing: 5px; text-transform: uppercase;
  margin-bottom: 36px;
}
.gallery-hero .description {
  font-family: var(--font-body);
  font-size: 18px; color: var(--text-secondary);
  max-width: 540px; line-height: 1.75;
}

/* Family section */
.family-section {
  padding: 0 80px 72px;
}
.family-section + .family-section {
  border-top: 1px solid var(--border);
  padding-top: 60px;
}
.family-section-header {
  display: flex; align-items: baseline; gap: 16px;
  margin-bottom: 32px;
}
.family-section-header .family-icon {
  font-size: 26px; width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-subtle); border-radius: var(--radius-sm);
  flex-shrink: 0;
}
.family-section-header h2 {
  font-family: var(--font-heading);
  font-size: 24px; font-weight: 700; color: var(--text-primary);
  letter-spacing: -0.4px;
}
.family-section-header .family-count {
  font-family: var(--font-heading);
  font-size: 13px; font-weight: 600;
  color: var(--text-muted); margin-left: auto; letter-spacing: 0.5px;
}

/* Timeline row — 精致卡片 */
.tl-row {
  display: flex; align-items: center; gap: 24px;
  padding: 22px 28px; margin-bottom: 2px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.35s var(--ease-out);
  position: relative; border: 1px solid transparent;
}
.tl-row::before {
  content: ''; position: absolute; inset: 0; border-radius: var(--radius-md);
  background: var(--accent-subtle); opacity: 0;
  transition: opacity 0.35s var(--ease-out);
}
.tl-row:hover::before { opacity: 1; }
.tl-row:hover { border-color: rgba(217,119,87,0.15); transform: translateX(8px); }
.tl-row:active { transform: translateX(4px) scale(0.99); }

.tl-row.sub-track { margin-left: 32px; }
.tl-row.sub-track .tl-avatar { width: 40px; height: 40px; font-size: 13px; }
.tl-row.sub-track .tl-info h3 { font-size: 15px; }
.tl-row.sub-track .tl-info p { font-size: 13px; }

.tl-row .tl-avatar {
  width: 52px; height: 52px; border-radius: var(--radius-sm);
  background: var(--canvas);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; flex-shrink: 0;
  position: relative; z-index: 1;
  font-family: var(--font-heading);
  box-shadow: var(--shadow-sm);
}
.tl-row .tl-info { flex: 1; position: relative; z-index: 1; min-width: 0; }
.tl-row .tl-info h3 {
  font-family: var(--font-heading);
  font-size: 17px; font-weight: 700; color: var(--text-primary);
  margin-bottom: 4px; letter-spacing: -0.3px;
}
.tl-row .tl-info p {
  font-family: var(--font-body);
  font-size: 14px; color: var(--text-secondary); line-height: 1.5;
}
.tl-row .tl-stats {
  display: flex; gap: 32px; flex-shrink: 0; position: relative; z-index: 1;
}
.tl-stat { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tl-stat .tl-stat-val {
  font-family: var(--font-heading);
  font-size: 24px; font-weight: 700; color: var(--text-primary);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.tl-stat .tl-stat-label {
  font-family: var(--font-heading);
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px;
}
.tl-row .tl-arrow {
  font-size: 20px; color: var(--text-muted); flex-shrink: 0;
  transition: all 0.35s var(--ease-out); position: relative; z-index: 1;
}
.tl-row:hover .tl-arrow { color: var(--accent); transform: translateX(6px); }

.tl-track-badge {
  font-family: var(--font-heading);
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 6px; letter-spacing: 0.3px;
  position: relative; z-index: 1; flex-shrink: 0;
}
.tl-track-badge.main-sub { background: var(--accent-subtle); color: var(--accent); }
.tl-track-badge.derived { background: var(--blue-subtle); color: var(--blue); }
.tl-track-badge.compare { background: var(--amber-subtle); color: var(--amber); }

/* ============================================
   时间线视图
   ============================================ */
#timelineView {
  display: none; flex-direction: column; height: 100%; overflow: hidden;
}
#timelineView.active { display: flex; }

.top-bar {
  height: var(--header-h); min-height: var(--header-h);
  display: flex; align-items: center; gap: 18px;
  padding: 0 28px;
  background: var(--elevated);
  border-bottom: 1px solid var(--border);
  z-index: 100; position: relative;
  box-shadow: var(--shadow-sm);
}
.top-bar.flash { animation: topBarFlash 0.4s var(--ease-out); }
@keyframes topBarFlash {
  0%, 100% { background: var(--elevated); }
  30% { background: rgba(217,119,87,0.08); box-shadow: inset 0 0 60px rgba(217,119,87,0.1); }
}

.back-btn {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-heading);
  font-size: 13px; font-weight: 600; color: var(--text-muted);
  padding: 6px 0; transition: color 0.2s; white-space: nowrap;
}
.back-btn:hover { color: var(--accent); }

.breadcrumb {
  display: flex; align-items: center; gap: 4px;
  font-family: var(--font-heading);
  font-size: 13px; font-weight: 500; color: var(--text-muted); overflow: hidden;
}
.breadcrumb .bc-sep { color: var(--border-strong); margin: 0 4px; }
.breadcrumb .bc-item { cursor: pointer; white-space: nowrap; transition: color 0.2s; }
.breadcrumb .bc-item:hover { color: var(--accent); }
.breadcrumb .bc-current { color: var(--text-primary); font-weight: 700; }

.legend {
  margin-left: auto; display: flex; gap: 22px;
  font-family: var(--font-heading);
  font-size: 11px; font-weight: 600; color: var(--text-muted);
}
.legend-dot {
  display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px;
  vertical-align: middle; position: relative; top: -1px;
}
.legend-dot.breakthrough { background: var(--accent); }
.legend-dot.important { background: var(--blue); }
.legend-dot.minor { background: var(--text-muted); }

.edit-toggle {
  font-family: var(--font-heading);
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  padding: 6px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  transition: all 0.2s; margin-left: 12px;
}
.edit-toggle:hover { border-color: var(--accent); color: var(--accent); }
.edit-toggle.active { background: var(--accent); color: var(--elevated); border-color: var(--accent); }

.main-area { flex: 1; display: flex; overflow: hidden; position: relative; }

.time-axis {
  width: var(--time-axis-w); min-width: var(--time-axis-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
  z-index: 50; position: relative;
}
.time-axis::-webkit-scrollbar { width: 0; }
.time-axis-inner { position: relative; }
.time-tick {
  position: absolute; right: 10px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-muted); white-space: nowrap;
  line-height: 1; user-select: none;
}
.time-tick.major {
  font-family: var(--font-heading);
  font-size: 12px; font-weight: 600; color: var(--text-secondary);
}

.columns-scroll { flex: 1; overflow: auto; position: relative; background: var(--canvas); }
.columns-inner { position: relative; display: flex; min-height: 100%; }

.track-column {
  width: var(--col-w); min-width: var(--col-w);
  position: relative; flex-shrink: 0;
  border-right: 1px solid transparent;
}
.track-column:last-child { border-right: none; }

.branch-column { animation: colSlideIn 0.3s var(--ease-out) forwards; }
.branch-column.closing { animation: colSlideOut 0.2s var(--ease-out) forwards; pointer-events: none; }
@keyframes colSlideIn {
  from { clip-path: inset(0 100% 0 0); opacity: 0; transform: translateX(20px); }
  to { clip-path: inset(0 0 0 0); opacity: 1; transform: translateX(0); }
}
@keyframes colSlideOut {
  from { clip-path: inset(0 0 0 0); opacity: 1; }
  to { clip-path: inset(0 100% 0 0); opacity: 0; transform: translateX(20px); }
}

.col-header {
  position: sticky; top: 0; z-index: 10;
  height: 44px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px;
  font-family: var(--font-heading);
  font-size: 12px; font-weight: 600;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  user-select: none; transition: background 0.2s;
}
.col-header .col-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
.col-header .col-close {
  font-size: 18px; color: var(--text-muted);
  width: 24px; height: 24px; display: flex; align-items: center;
  justify-content: center; border-radius: 4px;
  transition: all 0.15s; flex-shrink: 0; opacity: 0; line-height: 1;
}
.col-header:hover .col-close { opacity: 1; }
.col-header .col-close:hover { background: rgba(212,90,74,0.1); color: var(--danger); }

.main-column .col-header { color: var(--accent); letter-spacing: 0.3px; }
.branch-column .col-header { color: var(--text-secondary); }
.branch-column.depth-1 .col-header { background: rgba(217,119,87,0.04); }
.branch-column.depth-2 .col-header { background: rgba(217,119,87,0.02); }

.track-line {
  position: absolute; left: 50%; top: 48px; transform: translateX(-50%);
  pointer-events: none; z-index: 0;
}
.track-line.main { width: 1px; background: rgba(20,20,19,0.06); }
.track-line.branch-d0 { width: 1px; background: rgba(20,20,19,0.04); }
.track-line.branch-d1 { width: 1px; background: rgba(20,20,19,0.03); }
.track-line.branch-d2 { width: 1px; background: rgba(20,20,19,0.02); }

.col-events-area { position: relative; min-height: 100%; }

.event-node {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; z-index: 5;
  transition: transform 0.2s var(--ease-out);
}
.event-node:hover { transform: translateX(-50%) scale(1.06); }
.event-node:active { transform: translateX(-50%) scale(0.95); }
.event-node.highlight { animation: nodeGlow 0.8s ease-in-out infinite alternate; }
@keyframes nodeGlow {
  from { filter: drop-shadow(0 0 6px var(--accent-glow)); }
  to { filter: drop-shadow(0 0 16px rgba(217,119,87,0.5)); }
}

.event-node.shared::after {
  content: ''; position: absolute; top: -4px; right: -8px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--green); border: 1.5px solid var(--elevated);
}

.event-dot { border-radius: 50%; transition: all 0.2s var(--ease-out); }
.event-dot.breakthrough {
  width: 16px; height: 16px; background: var(--elevated);
  border: 2.5px solid var(--accent); box-shadow: 0 0 10px var(--accent-glow);
}
.event-dot.important { width: 12px; height: 12px; background: var(--elevated); border: 2px solid var(--blue); }
.event-dot.minor { width: 8px; height: 8px; background: var(--text-muted); border: 1.5px solid var(--text-muted); }

.branch-column.depth-0 .event-dot.breakthrough { width: 14px; height: 14px; border-width: 2px; }
.branch-column.depth-0 .event-dot.important { width: 10px; height: 10px; border-width: 1.5px; }
.branch-column.depth-0 .event-dot.minor { width: 7px; height: 7px; }
.branch-column.depth-1 .event-dot.breakthrough { width: 12px; height: 12px; border-width: 2px; }
.branch-column.depth-1 .event-dot.important { width: 9px; height: 9px; border-width: 1.5px; }
.branch-column.depth-1 .event-dot.minor { width: 6px; height: 6px; }
.branch-column.depth-2 .event-dot.breakthrough { width: 10px; height: 10px; border-width: 1.5px; }
.branch-column.depth-2 .event-dot.important { width: 8px; height: 8px; border-width: 1.5px; }
.branch-column.depth-2 .event-dot.minor { width: 6px; height: 6px; }

.event-label {
  font-family: var(--font-heading);
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
  margin-top: 8px; text-align: center; max-width: 200px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.4; transition: color 0.2s;
}
.event-node:hover .event-label { color: var(--text-primary); }

.branch-badge {
  margin-top: 6px; font-size: 10px; font-weight: 600;
  font-family: var(--font-heading);
  color: var(--accent); padding: 4px 12px;
  border-radius: 12px; cursor: pointer;
  transition: all 0.2s var(--ease-out);
  white-space: nowrap; position: relative;
}
.branch-badge::before {
  content: ''; position: absolute; inset: 0; border-radius: 12px;
  border: 1px solid rgba(217,119,87,0.3); background: rgba(217,119,87,0.06);
  transition: all 0.2s var(--ease-out);
}
.branch-badge:hover::before {
  border-color: var(--accent); background: rgba(217,119,87,0.15);
  box-shadow: 0 0 14px rgba(217,119,87,0.15);
}
.branch-badge:active::before { transform: scale(0.95); }
.branch-badge > span { position: relative; z-index: 1; }

.micro-line {
  position: absolute; left: 50%; transform: translateX(-50%);
  width: 1px; background: rgba(217,119,87,0.15); z-index: 0; pointer-events: none;
}

.time-gap {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-heading);
  font-size: 10px; font-weight: 600; color: var(--text-muted);
  white-space: nowrap; z-index: 2; pointer-events: none;
  letter-spacing: 0.5px;
}
.time-gap::before, .time-gap::after { content: ''; width: 48px; height: 1px; background: var(--border-strong); }

.merge-block {
  position: absolute; left: 50%; transform: translateX(-50%);
  padding: 8px 16px; font-family: var(--font-heading);
  font-size: 11px; font-weight: 600;
  color: var(--accent); white-space: nowrap; text-align: center;
  z-index: 3; pointer-events: none; border-radius: 8px;
}
.merge-block::before {
  content: ''; position: absolute; inset: 0; border-radius: 8px;
  background: rgba(217,119,87,0.06); border: 1px dashed rgba(217,119,87,0.2);
}

/* ============================================
   Popover / 底部抽屉
   桌面端：浮动卡片
   移动端：底部抽屉（bottom sheet）
   ============================================ */
.popover-backdrop {
  position: fixed; inset: 0; z-index: 200; pointer-events: none;
  background: rgba(20,20,19,0); transition: background 0.3s var(--ease-out);
}
.popover-backdrop.active { pointer-events: auto; background: rgba(20,20,19,0.25); }

.popover {
  position: fixed; z-index: 210; width: 380px; max-width: 92vw;
  background: var(--elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-xl);
  padding: 28px;
  animation: popoverIn 0.3s var(--ease-spring);
  pointer-events: auto; max-height: 80vh; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
@keyframes popoverIn {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.popover .po-badge {
  display: inline-block;
  font-family: var(--font-heading);
  font-size: 10px; font-weight: 700;
  padding: 4px 12px; border-radius: 10px;
  letter-spacing: 0.5px; margin-bottom: 12px;
}
.po-badge.breakthrough { background: rgba(217,119,87,0.12); color: var(--accent); }
.po-badge.important { background: var(--blue-subtle); color: var(--blue); }
.po-badge.minor { background: rgba(176,174,165,0.15); color: var(--text-secondary); }

.popover .po-date {
  font-family: var(--font-mono); font-size: 13px; color: var(--text-muted);
  margin-bottom: 8px; font-weight: 500;
}
.popover .po-title {
  font-family: var(--font-heading);
  font-size: 20px; font-weight: 700; color: var(--text-primary);
  margin-bottom: 14px; letter-spacing: -0.4px; line-height: 1.3;
}
.popover .po-summary {
  font-family: var(--font-body);
  font-size: 14px; color: var(--text-secondary); line-height: 1.75;
  margin-bottom: 16px;
}
.popover .po-note {
  font-family: var(--font-body);
  font-size: 14px; font-style: italic; color: var(--accent); line-height: 1.7;
  padding: 14px 16px; margin-bottom: 16px; border-radius: var(--radius-sm);
  position: relative;
}
.popover .po-note::before {
  content: ''; position: absolute; inset: 0; border-radius: var(--radius-sm);
  background: rgba(217,119,87,0.05); border-left: 3px solid var(--accent);
}

.po-section { margin-bottom: 14px; }
.po-section-title {
  font-family: var(--font-heading);
  font-size: 10px; font-weight: 700; color: var(--text-muted);
  letter-spacing: 1px; margin-bottom: 8px;
}

.po-branch-item {

.po-branch-item:hover { background: rgba(217,119,87,0.06); }

.po-branch-type {

.po-branch-type.parallel { background: rgba(106,155,204,0.1); color: var(--blue); }

.po-cross-ref {

.po-cross-ref.related { color: var(--blue); }
.po-cross-ref.compares { color: var(--amber); }
.po-cross-ref.influences { color: var(--green); }
.po-cross-ref .cr-icon { font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }
.po-cross-ref .cr-type-label {

}
.po-cross-ref.same-event .cr-type-label { background: var(--accent-subtle); color: var(--accent); }
.po-cross-ref.related .cr-type-label { background: var(--blue-subtle); color: var(--blue); }
.po-cross-ref.compares .cr-type-label { background: var(--amber-subtle); color: var(--amber); }
.po-cross-ref.influences .cr-type-label { background: var(--green-subtle); color: var(--green); }

.po-source {

  background: var(--surface); color: var(--text-muted);
}

.po-shared-info {
  font-family: var(--font-heading);
  font-size: 11px; font-weight: 600; color: var(--green);
  padding: 8px 12px; border-radius: var(--radius-sm);
  background: var(--green-subtle); margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;

/* SVG Connections */
.connections-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.conn-line { fill: none; stroke-width: 1.5; transition: all 0.35s var(--ease-out); }
.conn-line.causal { stroke: var(--amber); marker-end: url(#arrow-causal); }
.conn-line.parallel { stroke: var(--blue); stroke-dasharray: 4 3; marker-end: url(#arrow-parallel); }
.conn-line.influences { stroke: var(--green); stroke-dasharray: 2 4; marker-end: url(#arrow-influences); }
.conn-line.highlighted { stroke: var(--accent); stroke-width: 3; filter: drop-shadow(0 0 8px var(--accent-glow)); }
.conn-label {
  font-family: var(--font-heading);
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
  opacity: 0; transition: opacity 0.3s var(--ease-out);
}
.conn-label.visible { opacity: 1; }
.merge-curve { fill: none; stroke: rgba(217,119,87,0.45); stroke-width: 1.5; stroke-dasharray: 4 4; pointer-events: none; }

/* Toast */
.toast {
  position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
  z-index: 500; padding: 12px 26px;
  font-family: var(--font-heading);
  font-size: 14px; font-weight: 700; color: var(--accent);

}
.toast::before {

  background: var(--elevated); border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
}
.toast > span { position: relative; z-index: 1; }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.toast.out { animation: toastOut 0.25s ease forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-8px); } }

/* 编辑模式 */
.edit-add-btn {
  position: fixed; bottom: 32px; right: 32px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); color: var(--elevated);

}

.edit-add-btn:hover { transform: scale(1.1); background: var(--accent-warm); }

body.edit-mode .event-node { cursor: crosshair; }
body.edit-mode .event-node:hover { transform: translateX(-50%) scale(1.1); }

/* ============================================
   桌面端 Minimap 缩略时间轴
   ============================================ */
.minimap-bar {
  display: none; height: 36px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
  z-index: 90;
}

}
.minimap-dot {

}
.minimap-dot.breakthrough { background: var(--accent); width: 6px; height: 6px; }
.minimap-dot.important { background: var(--blue); }
.minimap-dot.minor { background: var(--text-muted); opacity: 0.5; }
.minimap-viewport {

.mobile-timeline {

/* 顶部迷你时间轴 */

}

}

.mobile-minimap-label {

}

.mobile-event-card {
  background: var(--elevated);

  overflow: hidden;
}

/* 内联关系标签 */
.mobile-event-card .mec-relations {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;
}
.mec-rel-tag {
  font-family: var(--font-heading);

  border-radius: 6px; letter-spacing: 0.2px;

}
.mec-rel-tag.branch { background: var(--accent-subtle); color: var(--accent); }
.mec-rel-tag.shared { background: var(--green-subtle); color: var(--green); }
.mec-rel-tag.compare { background: var(--amber-subtle); color: var(--amber); }
.mec-rel-tag.influence { background: rgba(120,140,93,0.08); color: var(--green); }
.mec-rel-tag.parallel { background: var(--blue-subtle); color: var(--blue); }

/* 时间间隔指示 */
.mobile-time-gap {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 6px 0;
  font-family: var(--font-heading);
  font-size: 10px; font-weight: 600; color: var(--text-muted);
}
.mobile-time-gap::before, .mobile-time-gap::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ============================================
   移动端分支滑出面板
   ============================================ */
.branch-panel-backdrop {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(20,20,19,0);
  pointer-events: none;
  transition: background 0.3s var(--ease-out);
}
.branch-panel-backdrop.active {
  pointer-events: auto;
  background: rgba(20,20,19,0.3);
}
.branch-panel {
  position: fixed; top: 0; right: 0; bottom: 0;

}
.branch-panel.active { transform: translateX(0); }
.branch-panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);

  flex-shrink: 0;
}
.branch-panel-header .bph-title {
  font-family: var(--font-heading);

}
.branch-panel-header .bph-close {
  font-size: 22px; color: var(--text-muted);

}
.branch-panel-header .bph-close:active { background: var(--surface); }
.branch-panel-body {

}
.branch-panel-body .bp-event-card {
  background: var(--surface);
  border-radius: var(--radius-sm);

}
.branch-panel-body .bp-event-card:active { transform: scale(0.98); }
.branch-panel-body .bp-event-card.breakthrough { border-left-color: var(--accent); }

.branch-panel-body .bp-event-card .bpc-date {

}
.branch-panel-body .bp-event-card .bpc-title {
  font-family: var(--font-heading); font-size: 13px; font-weight: 600;

}
.branch-panel-body .bp-event-card .bpc-summary {

}
.branch-panel-merge {

  background: var(--accent-subtle); border-radius: var(--radius-sm);
  font-family: var(--font-heading); font-size: 12px; font-weight: 600;
  color: var(--accent); text-align: center;
}

/* ============================================
   移动端响应式 — 核心优化
   ============================================ */
@media (max-width: 768px) {
  :root {
    --col-w: 200px;
    --time-axis-w: 56px;
    --header-h: 48px;
  }

  /* 画廊 Hero */
  .gallery-hero { padding: 80px 24px 48px; }
  .gallery-hero .brand { font-size: 56px; letter-spacing: -1.5px; }
  .gallery-hero .tagline { font-size: 12px; letter-spacing: 3px; margin-bottom: 24px; }
  .gallery-hero .description { font-size: 16px; }

  /* Family section */
  .family-section { padding: 0 16px 48px; }
  .family-section + .family-section { padding-top: 40px; }
  .family-section-header { gap: 12px; margin-bottom: 20px; }
  .family-section-header .family-icon { width: 40px; height: 40px; font-size: 20px; }
  .family-section-header h2 { font-size: 20px; }
  .family-section-header .family-count { font-size: 11px; }

  /* Timeline row — 移动端卡片式 */
  .tl-row { padding: 16px 20px; gap: 14px; border-radius: var(--radius-md); margin-bottom: 8px; }
  .tl-row.sub-track { margin-left: 16px; }
  .tl-row .tl-avatar { width: 44px; height: 44px; font-size: 13px; }
  .tl-row .tl-info h3 { font-size: 15px; }
  .tl-row .tl-info p { font-size: 13px; line-height: 1.4; }
  .tl-row .tl-stats { gap: 16px; }
  .tl-stat .tl-stat-val { font-size: 20px; }
  .tl-stat .tl-stat-label { font-size: 9px; }
  .tl-row .tl-arrow { font-size: 18px; }
  .tl-track-badge { font-size: 9px; padding: 2px 6px; }

  /* 顶栏 */
  .top-bar { padding: 0 16px; gap: 10px; }
  .back-btn { font-size: 12px; }
  .breadcrumb { font-size: 12px; }
  .legend { display: none; }
  .edit-toggle { display: none; }

  /* 时间线列 */
  .col-header { padding: 0 12px; font-size: 11px; }
  .col-header .col-title { max-width: 140px; }
  .event-label { font-size: 10px; max-width: 160px; }

  /* ===== 弹窗 → 底部抽屉 ===== */
  .popover {
    position: fixed !important;
    bottom: 0; left: 0; right: 0;
    width: 100% !important; max-width: 100% !important;
    max-height: 85vh;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: 0 0 env(safe-area-inset-bottom, 0);
    animation: sheetUp 0.35s var(--ease-out);
    box-shadow: 0 -12px 48px rgba(20,20,19,0.15), 0 -4px 16px rgba(20,20,19,0.08);
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); opacity: 0.5; }
    to { transform: translateY(0); opacity: 1; }
  }
  .popover.closing { animation: sheetDown 0.25s var(--ease-out) forwards; }
  @keyframes sheetDown {
    to { transform: translateY(100%); opacity: 0; }
  }
  /* 抽屉拖拽指示条 */
  .popover::before {
    content: ''; display: block;
    width: 40px; height: 4px; border-radius: 2px;
    background: var(--border-strong);
    margin: 12px auto 0;
    flex-shrink: 0;
  }
  .popover { padding-top: 0; }
  .popover > *:not(::before) { padding-left: 24px; padding-right: 24px; }
  .popover .po-badge { margin-top: 16px; }
  .popover .po-title { font-size: 18px; }
  .popover .po-summary { font-size: 14px; }

  .popover-backdrop { background: rgba(20,20,19,0.4); }

  /* 编辑按钮 */
  .edit-add-btn { bottom: 24px; right: 24px; width: 48px; height: 48px; font-size: 24px; }

/* 超小屏幕 */
@media (max-width: 380px) {

  .gallery-hero .brand { font-size: 44px; }
  .tl-row { padding: 14px 16px; gap: 10px; }
  .tl-row .tl-stats { gap: 12px; }
  .tl-stat .tl-stat-val { font-size: 18px; }
}

/* 横屏手机优化 */
@media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
  .popover { max-height: 90vh; }
  .gallery-hero { padding: 60px 24px 32px; }
}

<body>

<div class="gallery-view active" id="galleryView">
  <div class="gallery-hero">
    <div class="version-badge">v2.0 · 关系驱动</div>
    <div class="brand">事<span>刻</span></div>
    <div class="tagline">TimeTrace · Event Narrative Engine</div>
    <div class="description">
      每个事件都不是孤岛。事刻用共享时间轴与多列分支轨道，还原复杂事件之间的因果链、平行叙事与多维视角。
    </div>
  </div>
  <div id="galleryFamilies"></div>
</div>

<div class="timeline-view" id="timelineView">
  <div class="top-bar" id="topBar">
    <button class="back-btn" id="backToGallery">← 广场</button>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="legend">
      <span><span class="legend-dot breakthrough"></span>突破</span>
      <span><span class="legend-dot important"></span>重要</span>
      <span><span class="legend-dot minor"></span>次要</span>

  </div>
  <div class="minimap-bar" id="minimapBar">
    <div class="minimap-track" id="minimapTrack"></div>
    <div class="minimap-viewport" id="minimapViewport"></div>
  </div>
  <div class="main-area" id="mainArea">
    <div class="time-axis" id="timeAxis"><div class="time-axis-inner" id="timeAxisInner"></div></div>
    <div class="columns-scroll" id="columnsScroll"><div class="columns-inner" id="columnsInner"></div></div>
    <div class="mobile-timeline" id="mobileTimeline"></div>
  </div>
</div>

  <div class="branch-panel" id="branchPanel">
    <div class="branch-panel-header">
      <div class="bph-title" id="branchPanelTitle"></div>

    </div>
    <div class="branch-panel-body" id="branchPanelBody"></div>
  </div>
</div>

<svg style="position:absolute;width:0;height:0"><defs>
  <marker id="arrow-causal" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,4 0,8" fill="#c4854b"/>
  </marker>
  <marker id="arrow-parallel" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,4 0,8" fill="#6a9bcc"/>
  </marker>
  <marker id="arrow-influences" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <polygon points="0,0 10,4 0,8" fill="#788c5d"/>
  </marker>
</defs></svg>

<script>
// ===================================================================
// 事刻 TimeTrace v2.0 — 数据模型 & 全交互引擎
// ===================================================================

const ROW_H = 96, COL_W = 240, TIME_AXIS_W = 72, HEADER_H = 44, MAX_COLS = 5, MAX_GAP = 120;

// 移动端检测
function isMobile(){ return window.innerWidth <= 768; }

function buildTimeMapper(allDates){
  if(!allDates.length) return { getY: function(){return HEADER_H;}, totalHeight: ROW_H*10, ticks: [] };
  var uniqueDs = [...new Set(allDates.map(function(d){return d.toISOString().split('T')[0];}))].sort();
  var points = [], y = HEADER_H, prevDs = null;
  for (var i = 0; i < uniqueDs.length; i++){
    var ds = uniqueDs[i];
    if (prevDs){
      var days = Math.round((new Date(ds) - new Date(prevDs)) / 86400000);
      var gap = Math.min(days * (ROW_H / 30), MAX_GAP);
      gap = Math.max(gap, 28);
      y += gap;
    }
    points.push({ds: ds, y: y});
    prevDs = ds;
  }
  var totalH = y + ROW_H * 3;
  var tickMonths = {};
  points.forEach(function(p){
    var d = new Date(p.ds);
    var key = d.getFullYear() + '-' + (d.getMonth() + 1);
    if (!tickMonths[key]) tickMonths[key] = p;
  });
  var ticks = [];
  for (var k in tickMonths){
    var p = tickMonths[k];
    var d = new Date(p.ds);
    var m = d.getMonth() + 1;
    var isMajor = (m === 1 || m === 4 || m === 7 || m === 10);
    ticks.push({y: p.y, label: isMajor ? d.getFullYear() + '年' + m + '月' : m + '月', isMajor: isMajor});
  }
  ticks.sort(function(a,b){return a.y - b.y;});
  return {
    getY: function(dateStr){
      var dTime = new Date(dateStr).getTime();
      for (var i = 0; i < points.length - 1; i++){
        var p0t = new Date(points[i].ds).getTime(), p1t = new Date(points[i+1].ds).getTime();
        if (dTime >= p0t && dTime <= p1t){
          var ratio = (dTime - p0t) / (p1t - p0t);
          return points[i].y + ratio * (points[i+1].y - points[i].y);
        }
      }
      if (dTime < new Date(points[0].ds).getTime()) return points[0].y - 40;
      return points[points.length - 1].y + 40;
    },
    totalHeight: totalH, ticks: ticks
  };
}

function deriveBranches(trackId){
  var track=TIMELINES[trackId];if(!track)return[];
  var mainSet={};track.events.forEach(function(e){mainSet[e.eventId]=true;});
  var causesTo={},detailsTo={};
  RELATIONSHIPS.forEach(function(r){
    var f=r[0],t=r[1],ty=r[2];
    if(ty==='CAUSES'){if(!causesTo[f])causesTo[f]=[];causesTo[f].push(t);}
    else if(ty==='DETAILS'){if(!detailsTo[f])detailsTo[f]=[];detailsTo[f].push(t);}
  });

  for(var k in mainSet)processed[k]=true;
  track.events.forEach(function(me){
    var children=causesTo[me.eventId]||[];
    var fresh=children.filter(function(c){return!processed[c];});
    if(!fresh.length)return;
    var evs=[],vis={},q=fresh.slice();
    while(q.length){var eid=q.shift();if(vis[eid]||processed[eid]||mainSet[eid])continue;
      vis[eid]=true;evs.push(eid);processed[eid]=true;
      (causesTo[eid]||[]).forEach(function(n){if(!vis[n]&&!mainSet[n])q.push(n);});}
    if(!evs.length)return;

    var last=evs[evs.length-1],mt=null;
    (causesTo[last]||[]).forEach(function(t){if(mainSet[t])mt=t;});
    var bid='br-'+me.eventId;
    branches.push({id:bid,title:evs.slice(0,3).map(function(e){return EVENTS[e].title;}).join(' · '),originEventId:me.eventId,relationType:'causal',events:evs.map(function(eid){return{eventId:eid,importance:EVENTS[eid].importance};}),depth:0,parentBranchId:null,mergeTargetId:mt});
    evs.forEach(function(beid){propagateDetails(beid,1,bid);});
  });
  track.events.forEach(function(me){
    var mdetails=detailsTo[me.eventId]||[];
    var mfd=mdetails.filter(function(d){return!processed[d];});
    if(!mfd.length)return;
    var mnev=[],mnv={},mnq=mfd.slice();
    while(mnq.length){var mneid=mnq.shift();if(mnv[mneid]||processed[mneid]||mainSet[mneid])continue;
      mnv[mneid]=true;mnev.push(mneid);processed[mneid]=true;
      (causesTo[mneid]||[]).forEach(function(mnn){if(!mnv[mnn]&&!mainSet[mnn])mnq.push(mnn);});}
    if(!mnev.length)return;
    mnev.sort(function(a,b){return new Date(EVENTS[a].date)-new Date(EVENTS[b].date);});
    var mbrId='br-'+me.eventId+'-main-d1';
    branches.push({id:mbrId,title:mnev.slice(0,2).map(function(e){return EVENTS[e].title;}).join(' · '),originEventId:me.eventId,relationType:'causal',events:mnev.map(function(eid){return{eventId:eid,importance:EVENTS[eid].importance};}),depth:1,parentBranchId:null,mergeTargetId:null});
    mnev.forEach(function(mbeid){propagateDetails(mbeid,2,mbrId);});
  });
  function propagateDetails(originId,depth,parentBrId){
    var details=detailsTo[originId]||[];
    var fd=details.filter(function(d){return!processed[d];});
    if(!fd.length)return;
    var nev=[],nv={},nq=fd.slice();
    while(nq.length){var neid=nq.shift();if(nv[neid]||processed[neid]||mainSet[neid])continue;
      nv[neid]=true;nev.push(neid);processed[neid]=true;
      (causesTo[neid]||[]).forEach(function(nn){if(!nv[nn]&&!mainSet[nn])nq.push(nn);});}
    if(!nev.length)return;
    nev.sort(function(a,b){return new Date(EVENTS[a].date)-new Date(EVENTS[b].date);});
    var brId='br-'+originId+'-d'+depth;
    branches.push({id:brId,title:nev.slice(0,2).map(function(e){return EVENTS[e].title;}).join(' · '),originEventId:originId,relationType:'causal',events:nev.map(function(eid){return{eventId:eid,importance:EVENTS[eid].importance};}),depth:depth,parentBranchId:parentBrId,mergeTargetId:null});
    nev.forEach(function(beid){propagateDetails(beid,depth+1,brId);});
  }
  return branches;
}

  var range=Math.max(1,maxDate-minDate);
  var trackW=$minimapTrack.offsetWidth||window.innerWidth;
  var dotsHTML=events.map(function(e){
    var ev=EVENTS[e.eventId];
    var pct=(new Date(ev.date).getTime()-minDate)/range;
    var x=pct*trackW;
    return '<div class="minimap-dot '+e.importance+'" style="left:'+x+'px"></div>';
  }).join('');
  $minimapTrack.innerHTML=dotsHTML;
  updateMinimapViewport();
}
function updateMinimapViewport(){
  if(isMobile()||!$columnsScroll.scrollHeight)return;
  var scrollPct=$columnsScroll.scrollTop/$columnsScroll.scrollHeight;
  var viewPct=$columnsScroll.clientHeight/$columnsScroll.scrollHeight;
  $minimapViewport.style.top=(scrollPct*100)+'%';
  $minimapViewport.style.height=(viewPct*100)+'%';
}
$minimapTrack&&$minimapTrack.addEventListener('click',function(e){
  var rect=$minimapTrack.getBoundingClientRect();
  var pct=(e.clientX-rect.left)/rect.width;
  var target=$columnsScroll.scrollHeight*pct-$columnsScroll.clientHeight/2;
  $columnsScroll.scrollTo({top:Math.max(0,target),behavior:'smooth'});
});

// ============================================================
// 移动端纵向卡片流
// ============================================================
function renderMobileTimeline(tl,mapper){
  var events=tl.events.slice().sort(function(a,b){return new Date(EVENTS[a.eventId].date)-new Date(EVENTS[b.eventId].date);});
  if(!events.length){$mobileTimeline.innerHTML='<div style="padding:40px;text-align:center;color:var(--text-muted)">暂无事件</div>';return;}

  var minDate=new Date(EVENTS[events[0].eventId].date).getTime();
  var maxDate=new Date(EVENTS[events[events.length-1].eventId].date).getTime();
  var range=Math.max(1,maxDate-minDate);

  // 迷你时间轴
  var minimapHTML='<div class="mobile-minimap"><span class="mobile-minimap-label">时间轴</span><div class="mobile-minimap-track" id="mobileMinimapTrack">'+
    events.map(function(e){
      var ev=EVENTS[e.eventId];
      var pct=(new Date(ev.date).getTime()-minDate)/range;
      return '<div class="mobile-minimap-dot '+e.importance+'" style="left:'+(pct*100)+'%"></div>';
    }).join('')+'</div></div>';

  // 事件卡片
  var cardsHTML='';
  var prevDate=null, prevMonth=null;
  events.forEach(function(e,idx){
    var ev=EVENTS[e.eventId], d=new Date(ev.date);
    var monthKey=d.getFullYear()+'-'+(d.getMonth()+1);

    // 月份分组标题
    if(monthKey!==prevMonth){
      var monthLabel=d.getFullYear()+'年'+(d.getMonth()+1)+'月';
      cardsHTML+='<div class="mobile-time-group">'+monthLabel+'</div>';
      prevMonth=monthKey;
    }

    // 时间间隔
    if(prevDate&&idx>0){
      var days=ddays(prevDate,new Date(ev.date));
      if(days>45){
        cardsHTML+='<div class="mobile-time-gap">'+(days>90?Math.round(days/30)+'个月后':days+'天后')+'</div>';
      }
    }
    prevDate=new Date(ev.date);

    // 内联关系标签
    var bc=countBranchesOn(e.eventId,null);
    var shared=isSharedEvent(e.eventId);
    var crs=CROSS_REFS.filter(function(cr){return cr.eventId===e.eventId;});
    var hasCompare=crs.some(function(cr){return cr.type==='COMPARES';});
    var weak=getWeakRelations(e.eventId);
    var hasInfluence=weak.influences.length>0;
    var hasParallel=weak.parallel.length>0;

    var relTags='';
    if(bc>0)relTags+='<span class="mec-rel-tag branch" data-branches="'+getBranchIdsOn(e.eventId,null).join(',')+'">+'+bc+'分支</span>';
    if(shared)relTags+='<span class="mec-rel-tag shared">⊙共享</span>';
    if(hasCompare)relTags+='<span class="mec-rel-tag compare">⚖对比</span>';
    if(hasInfluence)relTags+='<span class="mec-rel-tag influence">→影响</span>';
    if(hasParallel)relTags+='<span class="mec-rel-tag parallel">∥并行</span>';

    var dateStr=(d.getMonth()+1)+'.'+d.getDate()+' · '+d.getFullYear();
    cardsHTML+='<div class="mobile-event-card '+e.importance+'" data-event-id="'+e.eventId+'">'+
      '<div class="mec-date">'+dateStr+'</div>'+
      '<div class="mec-title">'+ev.title+'</div>'+
      (e.importance!=='minor'?'<div class="mec-summary">'+ev.summary+'</div>':'')+
      (relTags?'<div class="mec-relations">'+relTags+'</div>':'')+
      '</div>';
  });

  $mobileTimeline.innerHTML=minimapHTML+cardsHTML;

  // 绑定事件
  $mobileTimeline.querySelectorAll('.mobile-event-card').forEach(function(card){
    card.addEventListener('click',function(e){
      if(e.target.classList.contains('mec-rel-tag'))return;
      e.stopPropagation();
      showPopover(card.dataset.eventId,card.getBoundingClientRect());
    });
  });

  // 内联关系标签点击
  $mobileTimeline.querySelectorAll('.mec-rel-tag.branch').forEach(function(tag){
    tag.addEventListener('click',function(e){
      e.stopPropagation();
      var ids=tag.dataset.branches.split(',');
      sortBranches(ids).forEach(function(bid){
        openBranchPanel(bid);
      });
    });
  });
  $mobileTimeline.querySelectorAll('.mec-rel-tag.shared, .mec-rel-tag.compare, .mec-rel-tag.influence, .mec-rel-tag.parallel').forEach(function(tag){
    tag.addEventListener('click',function(e){
      e.stopPropagation();
      var card=tag.closest('.mobile-event-card');
      if(card)showPopover(card.dataset.eventId,card.getBoundingClientRect());
    });
  });

  // 迷你时间轴点击跳转
  var mmt=$g('mobileMinimapTrack');
  if(mmt){
    mmt.addEventListener('click',function(e){
      var rect=mmt.getBoundingClientRect();
      var pct=(e.clientX-rect.left)/rect.width;
      var cards=$mobileTimeline.querySelectorAll('.mobile-event-card');
      if(cards.length){
        var targetIdx=Math.round(pct*(cards.length-1));
        cards[targetIdx].scrollIntoView({behavior:'smooth',block:'center'});
      }
    });
  }
}

// ============================================================
// 移动端分支滑出面板
// ============================================================
function openBranchPanel(bid){
  var br=currentBranches.find(function(b){return b.id===bid;});
  if(!br||!br.events.length)return;

  $branchPanelTitle.textContent=br.title;

  var events=br.events.slice().sort(function(a,b){return new Date(EVENTS[a.eventId].date)-new Date(EVENTS[b.eventId].date);});
  var html=events.map(function(e){
    var ev=EVENTS[e.eventId], d=new Date(ev.date);
    var dateStr=(d.getMonth()+1)+'.'+d.getDate()+' · '+d.getFullYear();
    return '<div class="bp-event-card '+e.importance+'" data-event-id="'+e.eventId+'">'+
      '<div class="bpc-date">'+dateStr+'</div>'+
      '<div class="bpc-title">'+ev.title+'</div>'+
      '<div class="bpc-summary">'+ev.summary+'</div>'+
      '</div>';
  }).join('');

  if(br.mergeTargetId){
    html+='<div class="branch-panel-merge">↳ 并入主线 · '+EVENTS[br.mergeTargetId].title+'</div>';
  }

  $branchPanelBody.innerHTML=html;
  $branchPanelBackdrop.classList.add('active');
  $branchPanel.classList.add('active');

  $branchPanelBody.querySelectorAll('.bp-event-card').forEach(function(card){
    card.addEventListener('click',function(){
      closeBranchPanel();
      showPopover(card.dataset.eventId,card.getBoundingClientRect());
    });
  });
}

function closeBranchPanel(){
  $branchPanel.classList.remove('active');
  $branchPanelBackdrop.classList.remove('active');
}
$branchPanelClose.addEventListener('click',closeBranchPanel);
$branchPanelBackdrop.addEventListener('click',function(e){
  if(e.target===$branchPanelBackdrop)closeBranchPanel();
});

function expandBranch(bid){
  if(isMobile()){
    openBranchPanel(bid);
    return;
  }
  if(expandedBranches.find(function(eb){return eb.branchId===bid;}))return;
  if(expandedBranches.length>=MAX_COLS-1){var old=branchStack.shift();collapseBranch(old.branchId,true);}
  expandedBranches.push({branchId:bid});branchStack.push({branchId:bid});
  closePopover();renderTimeline();
}

function collapseBranch(bid,silent){
  var rm=new Set([bid]);
  expandedBranches.forEach(function(eb){var br=currentBranches.find(function(b){return b.id===eb.branchId;});if(br&&br.parentBranchId&&rm.has(br.parentBranchId))rm.add(eb.branchId);});
  if(!silent){
    expandedBranches.forEach(function(eb){if(rm.has(eb.branchId)){var col=document.querySelector('.track-column[data-column-id="'+eb.branchId+'"]');if(col)col.classList.add('closing');}});
    setTimeout(function(){expandedBranches=expandedBranches.filter(function(eb){return!rm.has(eb.branchId);});branchStack=branchStack.filter(function(bs){return!rm.has(bs.branchId);});closePopover();renderTimeline();},200);
  }else{
    expandedBranches=expandedBranches.filter(function(eb){return!rm.has(eb.branchId);});
    branchStack=branchStack.filter(function(bs){return!rm.has(bs.branchId);});
  }
}

// ============================================================
// v2.0 Popover — 移动端底部抽屉 / 桌面端浮动卡片
// ============================================================
function showPopover(evid,dotRect){
  var ev=EVENTS[evid];if(!ev)return;
  var tl=TIMELINES[currentTimelineId],imp='minor';
  var tle=tl.events.find(function(e){return e.eventId===evid;});
  if(tle)imp=tle.importance;
  else{currentBranches.forEach(function(br){var be=br.events.find(function(e){return e.eventId===evid;});if(be){imp=be.importance;}});}

  var branchesOn=[];
  currentBranches.forEach(function(br){if(br.originEventId===evid&&!expandedBranches.find(function(eb){return eb.branchId===br.id;}))branchesOn.push(br.id);});
  branchesOn=sortBranches(branchesOn);
  var crs=CROSS_REFS.filter(function(cr){return cr.eventId===evid;});
  var weak=getWeakRelations(evid);

  var sharedInfo='';
  if(isSharedEvent(evid)){
    var otherTracks=eventTrackMap[evid].filter(function(t){return t!==currentTimelineId;});
    sharedInfo='<div class="po-shared-info">⊙ 此事件同时出现在 '+otherTracks.length+' 条其他叙事线中</div>';
  }

  var impLabel=imp==='breakthrough'?'突破':imp==='important'?'重要':'次要';
  var pop=document.createElement('div');
  pop.className='popover';

  // 桌面端定位
  if(!isMobile()){
    var l=dotRect.right+12,t=dotRect.top;
    if(l+380>window.innerWidth)l=dotRect.left-380-12;
    if(l<12)l=12;
    if(t+450>window.innerHeight)t=Math.max(12,window.innerHeight-470);
    pop.style.left=l+'px';pop.style.top=t+'px';
  }

  var crHTML='';
  if(crs.length>0){
    var crItems=crs.map(function(cr){
      var typeCls=cr.type.toLowerCase().replace('_','-');
      var icon=cr.type==='SAME_EVENT'?'⊙':cr.type==='RELATED'?'🔗':cr.type==='COMPARES'?'⚖':'→';
      var typeLabel=cr.type==='SAME_EVENT'?'同一事件':cr.type==='RELATED'?'关联':cr.type==='COMPARES'?'对比':'影响';
      return '<div class="po-cross-ref '+typeCls+'" data-cross=\''+JSON.stringify(cr)+'\'><span class="cr-icon">'+icon+'</span>'+cr.label+'<span class="cr-type-label">'+typeLabel+'</span></div>';
    }).join('');
    crHTML='<div class="po-section"><div class="po-section-title">跨叙事</div>'+crItems+'</div>';
  }

  var weakHTML='';
  if(weak.parallel.length>0||weak.influences.length>0){
    var items=[];
    weak.parallel.forEach(function(eid2){items.push('<div class="po-branch-item" data-event-jump="'+eid2+'"><span class="po-branch-type parallel">并行</span>'+EVENTS[eid2].title+'</div>');});
    weak.influences.forEach(function(eid2){items.push('<div class="po-branch-item" data-event-jump="'+eid2+'" style="color:var(--green)"><span class="po-branch-type" style="background:var(--green-subtle);color:var(--green)">影响</span>'+EVENTS[eid2].title+'</div>');});
    weakHTML='<div class="po-section"><div class="po-section-title">弱关系</div>'+items.join('')+'</div>';
  }

  pop.innerHTML=sharedInfo+'<span class="po-badge '+imp+'">'+impLabel+'</span><div class="po-date">'+fdate(ev.date)+'</div><div class="po-title">'+ev.title+'</div><div class="po-summary">'+ev.summary+'</div>'+(ev.note?'<div class="po-note">'+ev.note+'</div>':'')+(branchesOn.length>0?'<div class="po-section"><div class="po-section-title">关联分支</div>'+branchesOn.map(function(bid){var br=currentBranches.find(function(b){return b.id===bid;});if(!br)return'';return'<div class="po-branch-item" data-expand-branch="'+bid+'"><span class="po-branch-type causal">因果</span>'+br.title+' ('+br.events.length+' 事件)'+(br.depth>0?' <span style="font-size:10px;color:var(--text-muted)">嵌套</span>':'')+'</div>';}).join('')+'</div>':'')+weakHTML+crHTML+(ev.source?'<div class="po-source">来源：'+ev.source+'</div>':'')+(ev.tags&&ev.tags.length?'<div class="po-tags">'+ev.tags.map(function(t){return'<span class="po-tag">#'+t+'</span>';}).join('')+'</div>':'');

  $popoverBackdrop.innerHTML='';$popoverBackdrop.appendChild(pop);$popoverBackdrop.classList.add('active');

  // 移动端：下滑关闭手势
  if(isMobile()){
    var startY=0, currentY=0, dragging=false;
    pop.addEventListener('touchstart',function(e){
      if(pop.scrollTop>0)return;
      startY=e.touches[0].clientY;dragging=true;
      pop.style.transition='none';
    },{passive:true});
    pop.addEventListener('touchmove',function(e){
      if(!dragging)return;
      currentY=e.touches[0].clientY;
      var diff=currentY-startY;
      if(diff>0){pop.style.transform='translateY('+diff+'px)';}
    },{passive:true});
    pop.addEventListener('touchend',function(e){
      if(!dragging)return;
      dragging=false;
      pop.style.transition='';
      var diff=currentY-startY;
      if(diff>100){closePopover();}
      else{pop.style.transform='';}
    },{passive:true});
  }

  pop.querySelectorAll('.po-branch-item').forEach(function(it){
    if(it.dataset.expandBranch){it.addEventListener('click',function(e){e.stopPropagation();expandBranch(it.dataset.expandBranch);});}
    if(it.dataset.eventJump){it.addEventListener('click',function(e){e.stopPropagation();jumpToEvent(it.dataset.eventJump);});}
  });
  pop.querySelectorAll('.po-cross-ref').forEach(function(it){it.addEventListener('click',function(e){e.stopPropagation();crossJump(JSON.parse(it.dataset.cross));});});
  $popoverBackdrop.addEventListener('click',function(e){if(e.target===$popoverBackdrop)closePopover();});
}

function closePopover(){
  var pop=$popoverBackdrop.querySelector('.popover');
  if(pop&&isMobile()){
    pop.classList.add('closing');
    setTimeout(function(){$popoverBackdrop.innerHTML='';$popoverBackdrop.classList.remove('active');},250);
  }else{
    $popoverBackdrop.innerHTML='';$popoverBackdrop.classList.remove('active');
  }
}

function jumpToEvent(eid){
  closePopover();
  var n=document.querySelector('.event-node[data-event-id="'+eid+'"]');
  if(n){n.classList.add('highlight');n.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){n.classList.remove('highlight');},3000);}
  else{showToast('该事件不在当前时间线中');}
}

function crossJump(cr){
  closePopover();
  $topBar.classList.add('flash');setTimeout(function(){$topBar.classList.remove('flash');},400);
  var to=document.createElement('div');to.className='toast';
  var fam=FAMILIES[TIMELINES[cr.targetTimelineId].familyId];
  to.innerHTML='<span>跳转至 '+fam.title+' · '+TIMELINES[cr.targetTimelineId].title+'</span>';
  document.body.appendChild(to);
  setTimeout(function(){to.classList.add('out');setTimeout(function(){to.remove();},250);},1200);
  setTimeout(function(){
    enterTimeline(cr.targetTimelineId);
    setTimeout(function(){
      var n=document.querySelector('.event-node[data-event-id="'+cr.jumpToEventId+'"]');
      if(n){n.classList.add('highlight');n.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){n.classList.remove('highlight');},3000);}
    },600);
  },100);
}

function showToast(msg){
  var to=document.createElement('div');to.className='toast';
  to.innerHTML='<span>'+msg+'</span>';
  document.body.appendChild(to);
  setTimeout(function(){to.classList.add('out');setTimeout(function(){to.remove();},250);},1200);
}

function renderConnections(){
  var svgEl=document.getElementById('connectionsSvg');
  var layer=document.getElementById('connectionsLayer');
  if(!svgEl||!layer) return;
  var th=document.getElementById('timeAxisInner').offsetHeight;
  var tw=(1+expandedBranches.length)*COL_W+100;
  var svg=d3.select(svgEl);
  svg.attr('width',tw).attr('height',th);
  svg.selectAll('*').remove();
  layer.style.width=tw+'px';layer.style.height=th+'px';
  expandedBranches.forEach(function(eb){
    var br=currentBranches.find(function(b){return b.id===eb.branchId;});
    if(!br)return;
    var oc=getEventCenter(br.originEventId);
    var fc=getEventCenter(br.events[0].eventId);
    var mx=(oc.x+fc.x)/2;
    svg.append('path').attr('d','M'+oc.x+','+oc.y+' C'+mx+','+oc.y+' '+mx+','+fc.y+' '+fc.x+','+fc.y).attr('class','conn-line causal').attr('id','conn-'+eb.branchId);
    svg.append('text').attr('x',mx).attr('y',(oc.y+fc.y)/2-6).attr('class','conn-label').attr('id','conn-label-'+eb.branchId).attr('text-anchor','middle').attr('fill','#c4854b').text('因果');
    if(br.mergeTargetId){
      var mc=getEventCenter(br.mergeTargetId);
      var le=br.events[br.events.length-1];
      var lc=getEventCenter(le.eventId);
      svg.append('path').attr('d','M'+lc.x+','+lc.y+' C'+(lc.x-40)+','+(lc.y+30)+' '+(mc.x+40)+','+(mc.y-20)+' '+mc.x+','+mc.y).attr('class','merge-curve');
    }
  });
}

function highlightConn(bid,on){
  var c=$g('conn-'+bid),l=$g('conn-label-'+bid);
  if(c){if(on)c.classList.add('highlighted');else c.classList.remove('highlighted');}
  if(l){if(on)l.classList.add('visible');else l.classList.remove('visible');}
  var br=currentBranches.find(function(b){return b.id===bid;});
  if(br){var n=document.querySelector('.event-node[data-event-id="'+br.originEventId+'"]');if(n){if(on)n.classList.add('highlight');else n.classList.remove('highlight');}}
}

// 编辑模式
$g('editToggle').addEventListener('click',function(){
  editMode=!editMode;
  document.body.classList.toggle('edit-mode',editMode);
  $g('editToggle').classList.toggle('active',editMode);
  $g('editAddBtn').classList.toggle('visible',editMode);
  showToast(editMode?'编辑模式已开启':'编辑模式已关闭');
});
$g('editAddBtn').addEventListener('click',function(){showToast('新增事件功能开发中（v2.1）');});

// 启动
validateRelationships();
renderGallery();
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closePopover();closeBranchPanel();}});
var resizeTimer=null;
window.addEventListener('resize',function(){
  closePopover();
  closeBranchPanel();
  if(resizeTimer)clearTimeout(resizeTimer);
  resizeTimer=setTimeout(function(){
    if(currentTimelineId)renderTimeline();
  },200);
});
</script>
