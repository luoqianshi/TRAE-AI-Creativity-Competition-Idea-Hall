let activeMuscle = null;

const bodySvg = document.getElementById('bodySvg');
const infoPanel = document.getElementById('infoPanel');
const muscleLabels = document.getElementById('muscleLabels');
const viewButtons = document.querySelectorAll('.view-toggle button');

function renderLabels() {
  muscleLabels.innerHTML = '';
  const muscles = bodySvg.querySelectorAll('.muscle');
  const added = new Set();

  muscles.forEach(muscle => {
    const id = muscle.dataset.muscle;
    if (added.has(id)) return;
    added.add(id);

    const data = muscleData[id];
    if (!data) return;

    const bbox = muscle.getBBox();
    const label = document.createElement('div');
    label.className = 'muscle-label';
    label.textContent = data.name;
    label.style.left = (bbox.x + bbox.width / 2) / 400 * 100 + '%';
    label.style.top = (bbox.y - 5) / 720 * 100 + '%';
    label.style.transform = 'translate(-50%, -100%)';
    muscleLabels.appendChild(label);
  });
}

function showMuscleInfo(muscleId) {
  const data = muscleData[muscleId];
  if (!data) return;

  activeMuscle = muscleId;

  bodySvg.querySelectorAll('.muscle').forEach(m => {
    m.classList.toggle('active', m.dataset.muscle === muscleId);
  });

  muscleLabels.querySelectorAll('.muscle-label').forEach(label => {
    const id = Object.keys(muscleData).find(key => muscleData[key].name === label.textContent);
    label.classList.toggle('visible', id === muscleId);
  });

  infoPanel.classList.remove('empty');
  infoPanel.innerHTML = `
    <div class="muscle-header">
      <h2>${data.name}</h2>
      <div class="latin-name">${data.latin}</div>
      <div class="muscle-meta">
        <span class="meta-tag">${data.category}</span>
        <span class="meta-tag">难度 ${'★'.repeat(data.difficulty)}${'☆'.repeat(3 - data.difficulty)}</span>
      </div>
    </div>

    <p style="color: #9ca3af; font-size: 0.875rem; line-height: 1.8; margin-bottom: 1.5rem;">
      ${data.description}
    </p>

    <div class="section-title">拉伸方法</div>
    <div class="action-card">
      <h4>${data.stretch.title}</h4>
      <ol class="action-steps">
        ${data.stretch.steps.map((step, i) => `<li data-step="${i + 1}">${step}</li>`).join('')}
      </ol>
      <div class="duration-badge">⏱ ${data.stretch.duration}</div>
      <div class="difficulty-indicator">
        ${Array(3).fill(0).map((_, i) => `<div class="difficulty-dot ${i < data.stretch.difficulty ? 'active' : ''}"></div>`).join('')}
      </div>
    </div>

    <div class="section-title">按摩手法</div>
    <div class="action-card">
      <h4>${data.massage.title}</h4>
      <ol class="action-steps">
        ${data.massage.steps.map((step, i) => `<li data-step="${i + 1}">${step}</li>`).join('')}
      </ol>
      <div class="duration-badge">⏱ ${data.massage.duration}</div>
      <div class="difficulty-indicator">
        ${Array(3).fill(0).map((_, i) => `<div class="difficulty-dot ${i < data.massage.difficulty ? 'active' : ''}"></div>`).join('')}
      </div>
    </div>

    <div class="section-title">放松动作</div>
    <div class="action-card">
      <h4>${data.relax.title}</h4>
      <ol class="action-steps">
        ${data.relax.steps.map((step, i) => `<li data-step="${i + 1}">${step}</li>`).join('')}
      </ol>
      <div class="duration-badge">⏱ ${data.relax.duration}</div>
      <div class="difficulty-indicator">
        ${Array(3).fill(0).map((_, i) => `<div class="difficulty-dot ${i < data.relax.difficulty ? 'active' : ''}"></div>`).join('')}
      </div>
    </div>
  `;
}

bodySvg.querySelectorAll('.muscle').forEach(muscle => {
  muscle.addEventListener('click', (e) => {
    e.stopPropagation();
    const muscleId = muscle.dataset.muscle;
    if (activeMuscle === muscleId) {
      activeMuscle = null;
      muscle.classList.remove('active');
      muscleLabels.querySelectorAll('.muscle-label').forEach(l => l.classList.remove('visible'));
      infoPanel.classList.add('empty');
      infoPanel.innerHTML = `
        <div class="icon">&#129469;</div>
        <p>选择左侧肌肉区域<br>查看对应的拉伸与放松方案</p>
      `;
    } else {
      showMuscleInfo(muscleId);
    }
  });

  muscle.addEventListener('mouseenter', () => {
    const id = muscle.dataset.muscle;
    const label = Array.from(muscleLabels.querySelectorAll('.muscle-label'))
      .find(l => muscleData[id]?.name === l.textContent);
    if (label) label.classList.add('visible');
  });

  muscle.addEventListener('mouseleave', () => {
    if (!activeMuscle) {
      muscleLabels.querySelectorAll('.muscle-label').forEach(l => l.classList.remove('visible'));
    }
  });
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.body-svg') && !e.target.closest('.info-panel')) {
    activeMuscle = null;
    bodySvg.querySelectorAll('.muscle').forEach(m => m.classList.remove('active'));
    muscleLabels.querySelectorAll('.muscle-label').forEach(l => l.classList.remove('visible'));
    infoPanel.classList.add('empty');
    infoPanel.innerHTML = `
      <div class="icon">&#129469;</div>
      <p>选择左侧肌肉区域<br>查看对应的拉伸与放松方案</p>
    `;
  }
});

viewButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    viewButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    if (view === 'back') {
      alert('背面视图正在开发中，将包含背阔肌、竖脊肌、腘绳肌等背部肌肉群');
      viewButtons.forEach(b => b.classList.toggle('active', b.dataset.view === 'front'));
    }
  });
});

renderLabels();
</script>
