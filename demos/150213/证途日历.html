<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>证途日历</title>
  <style>
    :root {
      /* 浅色主题 */
      --bg-primary: #fdf9f3;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #4a6fa5;
      --accent-light: #6a8bc7;
      --border: #e8e0d3;
      --success: #5a9e6c;
      --shadow: 0 2px 12px rgba(0,0,0,0.05);
      --radius: 12px;
      --transition: all 0.2s ease;
    }

    .dark-theme {
      --bg-primary: #1e293b;
      --bg-card: #2d3748;
      --text-primary: #f1f5f9;
      --text-secondary: #a1aec7;
      --accent: #60a5fa;
      --accent-light: #93c5fd;
      --border: #475569;
      --success: #4ade80;
      --shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "SF Pro SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    @media (min-width: 768px) {
      body {
        padding: 24px;
      }
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 12px;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: clamp(0.875rem, 3vw, 1rem);
      max-width: 600px;
      margin: 0 auto;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .input-grid {
      display: grid;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .input-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    input {
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: var(--transition);
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.15);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
      width: 100%;
      margin-top: 8px;
    }

    button:hover:not(:disabled) {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-section {
      margin-top: 24px;
    }

    .section-title {
      font-size: 1.375rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .date-tabs {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 24px;
      scrollbar-width: none;
    }

    .date-tabs::-webkit-scrollbar {
      display: none;
    }

    .date-tab {
      padding: 8px 16px;
      background: var(--bg-card);
      border-radius: 6px;
      font-size: 0.9rem;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .date-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .calendar-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .day-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
      position: relative;
      opacity: 1;
      transform: translateY(0);
    }

    .day-card.hidden {
      opacity: 0.4;
      transform: translateY(10px);
      pointer-events: none;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .day-date {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--accent);
    }

    .day-week {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .task-item {
      margin-bottom: 14px;
      padding-left: 32px;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .task-item:last-child {
      margin-bottom: 0;
    }

    .task-checkbox {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      accent-color: var(--success);
      flex-shrink: 0;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-weight: 600;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .task-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .task-hint {
      font-size: 0.85rem;
      padding: 6px 12px;
      background: rgba(106, 139, 199, 0.1);
      color: var(--accent);
      border-radius: 6px;
      display: inline-block;
      margin-top: 4px;
    }

    .no-result {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .no-result svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .theme-toggle svg {
      width: 24px;
      height: 24px;
      fill: var(--accent);
    }

    .footer {
      text-align: center;
      margin-top: 48px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.875rem;
      border-top: 1px solid var(--border);
      margin-bottom: 24px;
    }

    /* 手机适配优化 */
    @media (max-width: 767px) {
      .input-grid {
        grid-template-columns: 1fr;
      }
      .day-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .date-tabs {
        margin-bottom: 16px;
      }
      .theme-toggle {
        width: 48px;
        height: 48px;
        bottom: 16px;
        right: 16px;
      }
    }

    /* 滚动锚点平滑 */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>证途日历</h1>
      <p class="subtitle">输入证书名称、剩余天数和每日可用时长，3秒生成可执行日学习计划</p>
    </header>

    <section class="input-section">
      <div class="input-grid">
        <div class="input-group">
          <label for="cert">证书名称</label>
          <input type="text" id="cert" placeholder="如：小学教师资格证" value="小学教师资格证">
        </div>
        <div class="input-group">
          <label for="days">剩余天数</label>
          <input type="number" id="days" min="1" max="365" value="30">
        </div>
        <div class="input-group">
          <label for="hours">每日时长（小时）</label>
          <input type="number" id="hours" min="0.5" max="8" step="0.5" value="2.0">
        </div>
      </div>
      <button id="generate-btn">生成学习计划</button>
    </section>

    <section class="result-section">
      <h2 class="section-title">
        <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 18H7v-2h10v2zm3-4h-1V9c0-1.1-.9-2-2-2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h9v-2z"/></svg>
        学习日历
      </h2>

      <div class="date-tabs" id="date-tabs"></div>

      <div class="calendar-list" id="calendar-list">
        <div class="no-result">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          <p>请输入信息并点击「生成学习计划」</p>
        </div>
      </div>
    </section>

    <div class="footer">
      <p>纯前端运行 · 无需注册 · 数据不上传</p>
    </div>
  </div>

  <button class="theme-toggle" id="theme-toggle" aria-label="切换深色/浅色主题">
    <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75V3a.75.75 0 01.75-.75h1.5zM7.5 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM21 12a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V12.75a.75.75 0 01.75-.75h1.5zM12 18a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H10.5a.75.75 0 01-.75-.75v-2.25a.75.75 0 01.75-.75h1.5zM7.5 6a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75H6a.75.75 0 01-.75-.75V6.75A.75.75 0 016 6h1.5zM21 6a.75.75 0 01.75.75v2.25a.75.75 0 01-.75.75h-1.5a.75.75 0 01-.75-.75V6.75a.75.75 0 01.75-.75h1.5z"/></svg>
  </button>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const htmlEl = document.documentElement;

    // 读取本地存储或系统偏好
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
      htmlEl.classList.add('dark-theme');
    }

    themeToggle.addEventListener('click', () => {
      htmlEl.classList.toggle('dark-theme');
      const isDark = htmlEl.classList.contains('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 生成计划逻辑
    const generateBtn = document.getElementById('generate-btn');
    const certInput = document.getElementById('cert');
    const daysInput = document.getElementById('days');
    const hoursInput = document.getElementById('hours');
    const calendarList = document.getElementById('calendar-list');
    const dateTabs = document.getElementById('date-tabs');

    // 模拟教材章节结构（简化版）
    const syllabusMap = {
      '小学教师资格证': [
        { chapter: '教育基础知识', topics: ['教育学基础', '心理学基础'], questionTypes: ['单选', '简答'] },
        { chapter: '学生指导', topics: ['德育原理', '心理健康教育'], questionTypes: ['案例分析', '判断'] },
        { chapter: '班级管理', topics: ['班级组织', '突发事件处理'], questionTypes: ['材料分析', '论述'] },
        { chapter: '学科知识', topics: ['语文教学法', '数学教学法'], questionTypes: ['教学设计', '答辩'] },
        { chapter: '教学设计', topics: ['教案撰写', '板书设计'], questionTypes: ['实操', '反思'] }
      ],
      '人力资源管理师': [
        { chapter: '人力资源规划', topics: ['组织设计', '岗位分析'], questionTypes: ['单选', '计算'] },
        { chapter: '招聘与配置', topics: ['简历筛选', '面试技巧'], questionTypes: ['案例', '情景模拟'] },
        { chapter: '培训与开发', topics: ['需求分析', '效果评估'], questionTypes: ['多选', '简答'] },
        { chapter: '绩效管理', topics: ['KPI设定', '面谈技巧'], questionTypes: ['论述', '案例'] }
      ],
      '社会工作者': [
        { chapter: '社会工作法规与政策', topics: ['民政法规', '社会保障'], questionTypes: ['单选', '多选'] },
        { chapter: '社会工作综合能力', topics: ['个案工作', '小组工作'], questionTypes: ['案例', '简答'] },
        { chapter: '社会工作实务', topics: ['儿童服务', '老年服务'], questionTypes: ['方案设计', '反思'] }
      ]
    };

    // 获取中文星期
    const getWeekDay = (date) => {
      const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
      return days[date.getDay()];
    };

    // 格式化日期为“X月X日”
    const formatDate = (date) => {
      return `${date.getMonth() + 1}月${date.getDate()}日`;
    };

    // 生成模拟计划（简化逻辑，真实场景调TRAE API）
    function generatePlan() {
      const cert = certInput.value.trim() || '小学教师资格证';
      const days = parseInt(daysInput.value) || 30;
      const hours = parseFloat(hoursInput.value) || 2.0;

      if (!cert) {
        alert('请填写证书名称');
        return;
      }

      // 使用默认大纲或 fallback
      const syllabus = syllabusMap[cert] || syllabusMap['小学教师资格证'];

      // 生成日期数组
      const today = new Date();
      const dates = [];
      for (let i = 0; i < days; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        dates.push(d);
      }

      // 分配章节（循环分配，保证覆盖）
      const tasks = [];
      let chapterIndex = 0;
      let topicIndex = 0;

      dates.forEach((date, i) => {
        const chapter = syllabus[chapterIndex % syllabus.length];
        const topic = chapter.topics[topicIndex % chapter.topics.length];
        const qType = chapter.questionTypes[i % chapter.questionTypes.length];

        tasks.push({
          date,
          chapter: chapter.chapter,
          topic,
          questionType: qType,
          hint: i === 0 ? '先通读本章框架，标记疑问点' :
                i % 7 === 0 ? '回顾前6天内容，做1套真题' :
                i % 3 === 0 ? '重点突破薄弱题型' :
                '结合例题理解核心概念'
        });

        chapterIndex++;
        topicIndex++;
      });

      // 渲染日历卡片
      calendarList.innerHTML = '';
      dateTabs.innerHTML = '';

      tasks.forEach((task, index) => {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.id = `day-${index}`;

        const dateStr = formatDate(task.date);
        const weekStr = getWeekDay(task.date);

        card.innerHTML = `
          <div class="day-header">
            <div class="day-date">${dateStr}</div>
            <div class="day-week">${weekStr}</div>
          </div>
          <div class="task-item">
            <input type="checkbox" class="task-checkbox" id="task-${index}">
            <div class="task-content">
              <div class="task-title">${task.chapter}</div>
              <div class="task-desc">学习：${task.topic}｜练习：${task.questionType}</div>
              <div class="task-hint">${task.hint}</div>
            </div>
          </div>
        `;

        calendarList.appendChild(card);

        // 生成日期标签
        const tab = document.createElement('div');
        tab.className = 'date-tab';
        tab.textContent = dateStr;
        tab.dataset.index = index;
        tab.addEventListener('click', () => {
          document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        dateTabs.appendChild(tab);
      });

      // 默认激活第一个tab
      if (dateTabs.children.length > 0) {
        dateTabs.children[0].classList.add('active');
      }

      // 绑定复选框事件（模拟完成状态）
      document.querySelectorAll('.task-checkbox').forEach(box => {
        box.addEventListener('change', function() {
          const card = this.closest('.day-card');
          if (this.checked) {
            card.style.opacity = '0.7';
            card.style.transform = 'scale(0.99)';
          } else {
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
          }
        });
      });
    }

    // 初始化绑定
    generateBtn.addEventListener('click', generatePlan);

    // 回车触发生成
    document.addEventListener('keypress', e => {
      if (e.key === 'Enter') {
        generateBtn.click();
      }
    });

    // 首次加载示例
    window.addEventListener('DOMContentLoaded', () => {
      // 自动填充示例并生成一次
      setTimeout(() => {
        generatePlan();
      }, 300);
    });
  </script>
</body>
</html>
