<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区便民闲置物品交换平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-up {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(100%); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800">
    <div id="app">
        <header class="fixed top-0 left-0 right-0 bg-white shadow-sm z-50">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2 cursor-pointer" onclick="showPage('home')">
                    <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center">
                        <i data-lucide="recycle" class="text-white w-6 h-6"></i>
                    </div>
                    <span class="font-bold text-xl text-green-600">邻里互换</span>
                </div>
                <div class="flex items-center gap-3">
                    <div class="relative hidden sm:block">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                        <input type="text" placeholder="搜索闲置物品..." class="pl-10 pr-4 py-2 border border-gray-200 rounded-full w-64 focus:outline-none focus:border-green-500 transition-colors" oninput="handleSearch(this.value)">
                    </div>
                    <button onclick="showPage('publish')" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-full font-medium transition-colors flex items-center gap-2">
                        <i data-lucide="plus" class="w-5 h-5"></i>
                        <span class="hidden sm:inline">发布</span>
                    </button>
                    <button onclick="showPage('profile')" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center hover:bg-gray-200 transition-colors">
                        <i data-lucide="user" class="text-gray-600 w-6 h-6"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="pt-16 pb-20 px-4 max-w-6xl mx-auto">
            <div id="home-page" class="page-content">
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">🏠 小区闲置物品</h1>
                    <p class="text-gray-500">发现邻居的闲置好物，让物品焕发新生</p>
                </div>

                <div class="flex gap-2 overflow-x-auto hide-scrollbar pb-2 mb-6">
                    <button onclick="filterCategory('全部', this)" class="category-btn active px-4 py-2 rounded-full bg-green-500 text-white whitespace-nowrap transition-colors">全部</button>
                    <button onclick="filterCategory('书籍', this)" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:border-green-500 transition-colors">书籍</button>
                    <button onclick="filterCategory('母婴用品', this)" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:border-green-500 transition-colors">母婴用品</button>
                    <button onclick="filterCategory('家居家电', this)" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:border-green-500 transition-colors">家居家电</button>
                    <button onclick="filterCategory('数码产品', this)" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:border-green-500 transition-colors">数码产品</button>
                    <button onclick="filterCategory('服装鞋帽', this)" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:border-green-500 transition-colors">服装鞋帽</button>
                    <button onclick="filterCategory('其他', this)" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:border-green-500 transition-colors">其他</button>
                </div>

                <div id="item-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                </div>
            </div>

            <div id="detail-page" class="page-content hidden">
                <button onclick="showPage('home')" class="flex items-center gap-2 text-gray-600 hover:text-green-600 mb-6">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    返回列表
                </button>
                <div id="item-detail" class="bg-white rounded-2xl shadow-lg overflow-hidden"></div>
            </div>

            <div id="publish-page" class="page-content hidden">
                <button onclick="showPage('home')" class="flex items-center gap-2 text-gray-600 hover:text-green-600 mb-6">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                    返回列表
                </button>

                    <form id="publish-form" onsubmit="handlePublish(event)">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">物品名称</label>
                            <input type="text" name="name" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-green-500 transition-colors" placeholder="给物品起个名字">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">物品描述</label>
                            <textarea name="description" rows="3" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-green-500 transition-colors" placeholder="描述物品的状况、使用感受等"></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">分类</label>
                            <select name="category" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-green-500 transition-colors">
                                <option value="">请选择分类</option>
                                <option value="书籍">书籍</option>
                                <option value="母婴用品">母婴用品</option>
                                <option value="家居家电">家居家电</option>
                                <option value="数码产品">数码产品</option>
                                <option value="服装鞋帽">服装鞋帽</option>

                        </div>

                                <option value="全新">全新</option>
                                <option value="九成新">九成新</option>
                                <option value="八成新">八成新</option>
                                <option value="七成新">七成新</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">价格</label>
                            <div class="flex items-center gap-4">
                                <div class="flex-1">
                                    <input type="number" name="price" min="0" step="0.01" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-green-500 transition-colors" placeholder="0.00">
                                </div>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" name="isFree" class="w-5 h-5 text-green-500 rounded focus:ring-green-500">
                                    <span class="text-sm text-gray-600">免费赠送</span>
                                </label>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">自提地点</label>
                            <input type="text" name="location" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-green-500 transition-colors" placeholder="例如：3号楼1单元门口">
                        </div>
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">物品图片</label>

        </main>

        <div id="booking-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-md p-6 slide-up">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold">预约交换</h3>
                    <button onclick="closeBookingModal()" class="text-gray-400 hover:text-gray-600">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
                <div id="booking-item-info" class="mb-4 p-4 bg-gray-50 rounded-xl"></div>
                <form id="booking-form" onsubmit="submitBooking(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择预约日期</label>
                        <input type="date" name="date" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-green-500">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择时间段</label>
                        <select name="time" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-green-500">
                            <option value="">请选择时间段</option>
                            <option value="上午9:00-11:00">上午9:00-11:00</option>
                            <option value="下午14:00-16:00">下午14:00-16:00</option>
                            <option value="下午16:00-18:00">下午16:00-18:00</option>
                            <option value="晚上19:00-21:00">晚上19:00-21:00</option>
                        </select>
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">备注（选填）</label>
                        <textarea name="note" rows="2" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:border-green-500" placeholder="如有特殊需求请备注"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-medium transition-colors">确认预约</button>
                </form>
            </div>
        </div>

        <div id="success-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center slide-up">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="check" class="text-green-600 w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-bold mb-2">操作成功</h3>
                <p id="success-message" class="text-gray-500 mb-6"></p>
                <button onclick="closeSuccessModal()" class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-medium transition-colors">确定</button>
            </div>
        </div>
    </div>

        function init() {
            lucide.createIcons();
            renderItems();

        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(pageId + '-page').classList.remove('hidden');
            if (pageId === 'home') {
                renderItems();
            }
            window.scrollTo(0, 0);
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-green-500', 'text-white');
                btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
            });
            element.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-200');
            element.classList.add('bg-green-500', 'text-white');
            renderItems();
        }

        function handleSearch(keyword) {
            searchKeyword = keyword.toLowerCase();
            renderItems();
        }

        function renderItems() {
            const container = document.getElementById('item-list');
            const filtered = mockItems.filter(item => {
                const matchCategory = currentCategory === '全部' || item.category === currentCategory;
                const matchSearch = searchKeyword === '' || 
                    item.name.toLowerCase().includes(searchKeyword) || 
                    item.description.toLowerCase().includes(searchKeyword);
                return matchCategory && matchSearch && !item.isExchanged;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <i data-lucide="inbox" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                        <p class="text-gray-500">暂无相关物品</p>
                    </div>
                `;
            } else {
                container.innerHTML = filtered.map(item => `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden cursor-pointer hover:shadow-lg transition-shadow fade-in" onclick="showDetail(${item.id})">
                        <div class="aspect-square bg-gray-100 overflow-hidden">
                            <img src="${item.images[0]}" alt="${item.name}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                        </div>
                        <div class="p-4">
                            <div class="flex items-start justify-between mb-2">
                                <h3 class="font-medium text-gray-800 line-clamp-1">${item.name}</h3>
                                ${item.isFree ? '<span class="px-2 py-0.5 bg-green-100 text-green-600 text-xs rounded-full">免费</span>' : ''}
                            </div>
                            <div class="flex items-center justify-between">
                                <span class="text-lg font-bold ${item.isFree ? 'text-green-600' : 'text-orange-500'}">
                                    ${item.isFree ? '免费' : '¥' + item.price}
                                </span>
                                <span class="text-xs text-gray-400">${item.publishTime}</span>
                            </div>
                            <div class="flex items-center gap-2 mt-3 text-xs text-gray-500">
                                <span>${item.publisher.avatar} ${item.publisher.nickname}</span>
                                <span>•</span>
                                <span>${item.location}</span>
                            </div>
                            <div class="flex items-center gap-1 mt-2 text-xs text-gray-400">
                                <i data-lucide="eye" class="w-3 h-3"></i>
                                <span>${item.views}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        function showDetail(itemId) {
            const item = mockItems.find(i => i.id === itemId);
            if (!item) return;

            document.getElementById('item-detail').innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 p-6">
                    <div class="aspect-square bg-gray-100 rounded-xl overflow-hidden">
                        <img src="${item.images[0]}" alt="${item.name}" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <div class="flex items-start justify-between mb-4">
                            <div>
                                <span class="px-3 py-1 bg-green-100 text-green-600 text-sm rounded-full mb-2 inline-block">${item.category}</span>
                                <h1 class="text-2xl font-bold text-gray-800">${item.name}</h1>
                            </div>
                            <button onclick="toggleFavorite(${item.id}, event)" class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                                <i data-lucide="heart" class="${favorites.includes(itemId) ? 'text-red-500 fill-red-500' : 'text-gray-400'} w-6 h-6"></i>
                            </button>
                        </div>
                        <div class="flex items-center gap-4 mb-4">
                            <span class="text-3xl font-bold ${item.isFree ? 'text-green-600' : 'text-orange-500'}">
                                ${item.isFree ? '免费赠送' : '¥' + item.price}
                            </span>
                            <span class="px-3 py-1 bg-gray-100 text-gray-600 text-sm rounded-full">${item.condition}</span>
                        </div>
                        <div class="space-y-3 mb-6">
                            <div class="flex items-center gap-2 text-gray-600">
                                <i data-lucide="clock" class="w-5 h-5 text-gray-400"></i>
                                <span>发布时间：${item.publishTime}</span>
                            </div>
                            <div class="flex items-center gap-2 text-gray-600">
                                <i data-lucide="map-pin" class="w-5 h-5 text-gray-400"></i>
                                <span>自提地点：${item.location}</span>
                            </div>
                            <div class="flex items-center gap-2 text-gray-600">
                                <i data-lucide="eye" class="w-5 h-5 text-gray-400"></i>
                                <span>浏览次数：${item.views}</span>
                            </div>
                        </div>
                        <div class="mb-6">
                            <h3 class="font-medium text-gray-800 mb-2">物品描述</h3>
                            <p class="text-gray-600 leading-relaxed">${item.description}</p>
                        </div>
                        <div class="bg-gray-50 rounded-xl p-4 mb-6">
                            <h3 class="font-medium text-gray-800 mb-3">发布者信息</h3>
                            <div class="flex items-center gap-3">
                                <div class="text-3xl">${item.publisher.avatar}</div>
                                <div>
                                    <p class="font-medium text-gray-800">${item.publisher.nickname}</p>
                                    <p class="text-sm text-gray-500">${item.publisher.community}</p>
                                    <p class="text-sm text-gray-500">联系方式：${item.publisher.phone}</p>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="openBookingModal(${item.id})" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 rounded-xl font-medium transition-colors flex items-center justify-center gap-2">
                                <i data-lucide="calendar-check" class="w-5 h-5"></i>
                                预约交换
                            </button>
                            <button onclick="showToast('联系功能开发中，可查看发布者信息自行联系')" class="px-6 py-3 bg-orange-500 hover:bg-orange-600 text-white rounded-xl font-medium transition-colors flex items-center justify-center gap-2">
                                <i data-lucide="phone" class="w-5 h-5"></i>
                                联系
                            </button>
                        </div>
                    </div>
                </div>
            `;
            showPage('detail');
            lucide.createIcons();
        }

        function toggleFavorite(itemId, event) {
            event.stopPropagation();
            const index = favorites.indexOf(itemId);
            if (index === -1) {
                favorites.push(itemId);
            } else {
                favorites.splice(index, 1);
            }
            showDetail(itemId);
            renderMyFavorites();
        }

        function openBookingModal(itemId) {
            bookingItemId = itemId;
            const item = mockItems.find(i => i.id === itemId);
            document.getElementById('booking-item-info').innerHTML = `
                <div class="flex gap-3">
                    <img src="${item.images[0]}" class="w-16 h-16 rounded-lg object-cover">
                    <div>
                        <p class="font-medium">${item.name}</p>
                        <p class="text-sm text-gray-500">${item.publisher.nickname} • ${item.location}</p>
                        <p class="text-sm ${item.isFree ? 'text-green-600' : 'text-orange-500'}">
                            ${item.isFree ? '免费赠送' : '¥' + item.price}
                        </p>
                    </div>
                </div>
            `;
            document.getElementById('booking-modal').classList.remove('hidden');
        }

        function closeBookingModal() {
            document.getElementById('booking-modal').classList.add('hidden');
            bookingItemId = null;
        }

        function submitBooking(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const booking = {
                id: Date.now(),
                itemId: bookingItemId,
                userId: 1,
                date: formData.get('date'),
                time: formData.get('time'),
                note: formData.get('note'),
                status: 'pending'
            };
            mockBookings.push(booking);
            closeBookingModal();
            showSuccessModal('预约请求已提交，请等待发布者确认');
            event.target.reset();
        }

        function showSuccessModal(message) {
            document.getElementById('success-message').textContent = message;
            document.getElementById('success-modal').classList.remove('hidden');
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').classList.add('hidden');
            showPage('home');
        }

        function handlePublish(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const isFree = formData.get('isFree') === 'on';
            const newItem = {
                id: Date.now(),
                name: formData.get('name'),
                description: formData.get('description'),
                category: formData.get('category'),
                condition: formData.get('condition'),
                price: isFree ? 0 : parseFloat(formData.get('price')),
                isFree: isFree,
                images: ['https://picsum.photos/300/300?random=' + Date.now()],
                location: formData.get('location'),
                publisher: mockUsers[0],
                publishTime: new Date().toISOString().split('T')[0],
                views: 0,
                isExchanged: false
            };
            mockItems.unshift(newItem);
            showSuccessModal('物品发布成功！');
            event.target.reset();
        }

        function showProfileTab(tabId, element) {
            document.querySelectorAll('.profile-tab').forEach(btn => {
                btn.classList.remove('bg-green-50', 'text-green-600');
                btn.classList.add('hover:bg-gray-50', 'text-gray-600');
            });
            element.classList.remove('hover:bg-gray-50', 'text-gray-600');
            element.classList.add('bg-green-50', 'text-green-600');

            document.querySelectorAll('.profile-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId + '-tab').classList.remove('hidden');

            if (tabId === 'my-items') renderMyItems();
            if (tabId === 'my-bookings') renderMyBookings();
            if (tabId === 'my-favorites') renderMyFavorites();
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-50 fade-in';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        function renderMyItems() {
            const container = document.getElementById('my-items-list');
            const myItems = mockItems.filter(i => i.publisher.id === 1);
            if (myItems.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-gray-50 rounded-xl">
                        <i data-lucide="package-open" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                        <p class="text-gray-500">暂无发布记录</p>
                    </div>
                `;
            } else {
                container.innerHTML = myItems.map(item => `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden">
                        <div class="aspect-square bg-gray-100 overflow-hidden">
                            <img src="${item.images[0]}" alt="${item.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-4">
                            <h3 class="font-medium text-gray-800 mb-2">${item.name}</h3>
                            <div class="flex items-center justify-between">
                                <span class="text-lg font-bold ${item.isFree ? 'text-green-600' : 'text-orange-500'}">
                                    ${item.isFree ? '免费' : '¥' + item.price}
                                </span>
                                <span class="text-xs text-gray-400">${item.publishTime}</span>
                            </div>
                            <div class="flex gap-2 mt-3">
                                <button onclick="showToast('编辑功能开发中')" class="flex-1 px-3 py-1.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">编辑</button>
                                <button onclick="deleteItem(${item.id})" class="flex-1 px-3 py-1.5 border border-red-200 rounded-lg text-sm text-red-500 hover:bg-red-50">删除</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        function deleteItem(itemId) {
            if (confirm('确定要删除这个物品吗？')) {
                const index = mockItems.findIndex(i => i.id === itemId);
                if (index !== -1) {
                    mockItems.splice(index, 1);
                    renderMyItems();
                    renderItems();
                }
            }
        }

        function renderMyBookings() {
            const container = document.getElementById('my-bookings-list');
            if (mockBookings.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-gray-50 rounded-xl">
                        <i data-lucide="calendar-x" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                        <p class="text-gray-500">暂无预约记录</p>
                    </div>
                `;
            } else {
                container.innerHTML = mockBookings.map(booking => {
                    const item = mockItems.find(i => i.id === booking.itemId);
                    return `
                        <div class="bg-white rounded-xl shadow-md p-4 flex gap-4">
                            <img src="${item?.images[0]}" class="w-20 h-20 rounded-lg object-cover">
                            <div class="flex-1">
                                <div class="flex items-start justify-between">
                                    <h3 class="font-medium text-gray-800">${item?.name}</h3>
                                    <span class="px-2 py-1 bg-yellow-100 text-yellow-600 text-xs rounded-full">待确认</span>
                                </div>
                                <p class="text-sm text-gray-500 mt-1">发布者：${item?.publisher.nickname}</p>
                                <div class="flex items-center gap-4 mt-2 text-sm text-gray-600">
                                    <span><i data-lucide="calendar" class="w-4 h-4 inline mr-1"></i>${booking.date}</span>
                                    <span><i data-lucide="clock" class="w-4 h-4 inline mr-1"></i>${booking.time}</span>
                                </div>
                                ${booking.note ? `<p class="text-sm text-gray-500 mt-2">备注：${booking.note}</p>` : ''}
                            </div>
                            <button onclick="showToast('取消预约功能开发中')" class="px-4 py-2 border border-red-200 rounded-lg text-sm text-red-500 hover:bg-red-50">取消预约</button>
                        </div>
                    `;
                }).join('');
            }
            lucide.createIcons();
        }

        function renderMyFavorites() {
            const container = document.getElementById('my-favorites-list');
            const favItems = mockItems.filter(i => favorites.includes(i.id));
            if (favItems.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-gray-50 rounded-xl">
                        <i data-lucide="heart-off" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                        <p class="text-gray-500">暂无收藏物品</p>
                    </div>
                `;
            } else {
                container.innerHTML = favItems.map(item => `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden cursor-pointer hover:shadow-lg transition-shadow" onclick="showDetail(${item.id})">
                        <div class="aspect-square bg-gray-100 overflow-hidden">
                            <img src="${item.images[0]}" alt="${item.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-4">
                            <h3 class="font-medium text-gray-800 mb-2">${item.name}</h3>
                            <div class="flex items-center justify-between">
                                <span class="text-lg font-bold ${item.isFree ? 'text-green-600' : 'text-orange-500'}">
                                    ${item.isFree ? '免费' : '¥' + item.price}
                                </span>
                                <button onclick="toggleFavorite(${item.id}, event)" class="p-1 text-red-500">
                                    <i data-lucide="heart" class="w-5 h-5 fill-red-500"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        init();
    </script>
</body>
</html>
