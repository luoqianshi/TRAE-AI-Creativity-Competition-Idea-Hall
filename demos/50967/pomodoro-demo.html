<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>番茄打卡 · Pomodoro Punch Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    :root {
      --tomato: #E85D4C;
      --tomato-dark: #C94B3C;
      --tomato-light: #FFEFED;
      --cream: #FFF8F0;
      --cream-dark: #F5E6D3;
      --ink: #2D2420;
      --ink-light: #6B5E58;
      --success: #43A047;
      --success-light: #E8F5E9;
      --fail: #E53935;
      --fail-light: #FFEBEE;
      --gold: #FFB300;
      --shadow: 0 8px 24px rgba(45, 36, 32, 0.08);
      --radius: 20px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--cream);
      color: var(--ink);
      overflow: hidden;
    }

    /* 装饰背景 */
    .app-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 10% 20%, rgba(232, 93, 76, 0.08) 0%, transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(67, 160, 71, 0.06) 0%, transparent 30%),
        var(--cream);
    }

    .app-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.4;
      background-image:
        radial-gradient(circle, var(--cream-dark) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    #app {
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 顶部 */
    .header {
      padding: 24px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: var(--tomato);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 24px;
      box-shadow: 0 4px 12px rgba(232, 93, 76, 0.3);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .brand-title {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 24px;
      color: var(--tomato);
      letter-spacing: 1px;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--ink-light);
      margin-top: -2px;
    }

    .header-action {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: white;
      box-shadow: var(--shadow);
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .header-action:active {
      transform: scale(0.92);
    }

    /* 主内容区 */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 100px;
      scrollbar-width: none;
    }

    .main::-webkit-scrollbar {
      display: none;
    }

    .view {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 卡片 */
    .card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 今日概览 */
    .today-status {
      display: flex;
      gap: 12px;
    }

    .status-pill {
      flex: 1;
      padding: 14px;
      border-radius: var(--radius-sm);
      text-align: center;
    }

    .status-pill.done {
      background: var(--success-light);
      color: var(--success);
    }

    .status-pill.fail {
      background: var(--fail-light);
      color: var(--fail);
    }

    .status-pill .num {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }

    .status-pill .label {
      font-size: 12px;
      opacity: 0.8;
    }

    /* 添加任务 */
    .task-input-wrap {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .task-input {
      flex: 1;
      height: 48px;
      border: 2px solid var(--cream-dark);
      border-radius: var(--radius-sm);
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: white;
    }

    .task-input:focus {
      border-color: var(--tomato);
    }

    .pomo-select {
      width: 64px;
      height: 48px;
      border: 2px solid var(--cream-dark);
      border-radius: var(--radius-sm);
      text-align: center;
      font-size: 15px;
      outline: none;
      background: white;
    }

    .btn-primary {
      height: 48px;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--tomato);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(232, 93, 76, 0.25);
    }

    .btn-primary:active {
      transform: scale(0.96);
      background: var(--tomato-dark);
    }

    /* 任务列表 */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      background: white;
      border: 2px solid var(--cream-dark);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .task-item.done {
      opacity: 0.6;
      border-color: var(--success);
      background: var(--success-light);
    }

    .task-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid var(--cream-dark);
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .task-item.done .task-checkbox {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .task-content {
      flex: 1;
    }

    .task-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
      transition: all 0.2s;
    }

    .task-item.done .task-title {
      text-decoration: line-through;
      color: var(--ink-light);
    }

    .task-meta {
      font-size: 12px;
      color: var(--ink-light);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--tomato-light);
      color: var(--tomato);
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s;
    }

    .icon-btn.delete {
      background: var(--fail-light);
      color: var(--fail);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-light);
    }

    .empty-state .emoji {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    /* 日历 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .calendar-month {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 20px;
    }

    .calendar-nav {
      display: flex;
      gap: 8px;
    }

    .calendar-nav button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--tomato-light);
      color: var(--tomato);
      cursor: pointer;
      font-size: 16px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
    }

    .weekday {
      font-size: 12px;
      color: var(--ink-light);
      padding-bottom: 4px;
    }

    .day-cell {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      background: var(--cream);
      position: relative;
    }

    .day-cell.other {
      opacity: 0.35;
    }

    .day-cell.today {
      outline: 2px solid var(--tomato);
      outline-offset: -2px;
      font-weight: 700;
    }

    .day-cell.success {
      background: var(--success);
      color: white;
      font-weight: 700;
    }

    .day-cell.fail {
      background: var(--fail);
      color: white;
      font-weight: 700;
    }

    .day-cell.mixed {
      background: linear-gradient(135deg, var(--success) 50%, var(--fail) 50%);
      color: white;
      font-weight: 700;
    }

    .day-cell .mark {
      font-size: 10px;
      margin-top: 2px;
    }

    .calendar-legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
      font-size: 12px;
      color: var(--ink-light);
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
    }

    /* 统计 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: white;
      border-radius: var(--radius-sm);
      padding: 18px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: var(--tomato);
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-card .label {
      font-size: 12px;
      color: var(--ink-light);
    }

    .trend-bar {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 120px;
      margin-top: 16px;
      padding: 10px;
      background: var(--cream);
      border-radius: var(--radius-sm);
    }

    .trend-item {
      flex: 1;
      background: var(--tomato);
      border-radius: 4px 4px 0 0;
      min-height: 4px;
      opacity: 0.85;
      transition: height 0.4s ease;
    }

    /* 成就 */
    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .badge {
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--cream);
      color: var(--ink-light);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge.unlocked {
      background: linear-gradient(135deg, #FFF8E1 0%, #FFECB3 100%);
      color: #F57F17;
      border: 1px solid var(--gold);
      box-shadow: 0 2px 8px rgba(255, 179, 0, 0.15);
    }

    /* 底部导航 */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: var(--radius) var(--radius) 0 0;
      box-shadow: 0 -4px 24px rgba(45, 36, 32, 0.08);
      display: flex;
      justify-content: space-around;
      padding: 12px 0 24px;
      z-index: 10;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px;
      border: none;
      background: transparent;
      color: var(--ink-light);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-item.active {
      color: var(--tomato);
    }

    .nav-item .icon {
      font-size: 22px;
      transition: transform 0.2s;
    }

    .nav-item.active .icon {
      transform: translateY(-2px);
    }

    /* 计时器弹窗 */
    .timer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(45, 36, 32, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      place-items: center;
      padding: 20px;
    }

    .timer-overlay.active {
      display: grid;
    }

    .timer-modal {
      background: white;
      border-radius: var(--radius);
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(45, 36, 32, 0.25);
      animation: popIn 0.35s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .timer-task {
      font-size: 16px;
      color: var(--ink-light);
      margin-bottom: 8px;
    }

    .timer-phase {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 20px;
      color: var(--tomato);
      margin-bottom: 20px;
    }

    .timer-ring {
      width: 220px;
      height: 220px;
      margin: 0 auto 24px;
      position: relative;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-ring circle {
      fill: none;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .timer-ring .bg {
      stroke: var(--cream-dark);
    }

    .timer-ring .progress {
      stroke: var(--tomato);
      stroke-dasharray: 628;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-ring.rest .progress {
      stroke: var(--success);
    }

    .timer-display {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 48px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .timer-controls button {
      height: 48px;
      padding: 0 24px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .timer-controls .main-btn {
      background: var(--tomato);
      color: white;
      min-width: 120px;
    }

    .timer-controls .main-btn.rest {
      background: var(--success);
    }

    .timer-controls .danger-btn {
      background: var(--fail-light);
      color: var(--fail);
    }

    .timer-controls button:active {
      transform: scale(0.95);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: var(--ink);
      color: white;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      box-shadow: var(--shadow);
      z-index: 200;
      opacity: 0;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 成就弹窗 */
    .badge-popup {
      position: fixed;
      inset: 0;
      background: rgba(45, 36, 32, 0.7);
      z-index: 150;
      display: none;
      place-items: center;
      padding: 20px;
    }

    .badge-popup.active {
      display: grid;
    }

    .badge-card {
      background: linear-gradient(135deg, #FFF8E1 0%, #FFECB3 100%);
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 36px 28px;
      text-align: center;
      max-width: 300px;
      animation: popIn 0.4s ease;
    }

    .badge-card .emoji {
      font-size: 64px;
      margin-bottom: 12px;
      animation: shine 1.5s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 100% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.1); filter: brightness(1.15); }
    }

    .badge-card h3 {
      color: #F57F17;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .badge-card p {
      color: #795548;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .badge-card button {
      background: var(--gold);
      color: #5D4037;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 响应式小调整 */
    @media (max-height: 700px) {
      .timer-ring {
        width: 180px;
        height: 180px;
      }
      .timer-display {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="app-bg"></div>

  <div id="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon">🍅</div>
        <div>
          <div class="brand-title">番茄打卡</div>
          <div class="brand-sub">计划 · 专注 · 反馈</div>
        </div>
      </div>
      <button class="header-action" onclick="resetDemo()" title="重置演示">↺</button>
    </header>

    <main class="main">
      <!-- 任务视图 -->
      <section class="view active" id="view-tasks">
        <div class="card">
          <div class="section-title">📅 今日概览</div>
          <div class="today-status">
            <div class="status-pill done">
              <div class="num" id="today-done">0</div>
              <div class="label">完成番茄</div>
            </div>
            <div class="status-pill fail">
              <div class="num" id="today-fail">0</div>
              <div class="label">中断次数</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">📝 今日任务</div>
          <div class="task-input-wrap">
            <input type="text" class="task-input" id="task-input" placeholder="输入任务，比如：写完论文引言" maxlength="30">
            <select class="pomo-select" id="pomo-select">
              <option value="1">1🍅</option>
              <option value="2" selected>2🍅</option>
              <option value="3">3🍅</option>
              <option value="4">4🍅</option>
            </select>
            <button class="btn-primary" onclick="addTask()">添加</button>
          </div>
          <div class="task-list" id="task-list"></div>
        </div>
      </section>

      <!-- 日历视图 -->
      <section class="view" id="view-calendar">
        <div class="card">
          <div class="calendar-header">
            <div class="calendar-month" id="calendar-month">2026年6月</div>
            <div class="calendar-nav">
              <button onclick="changeMonth(-1)">‹</button>
              <button onclick="changeMonth(1)">›</button>
            </div>
          </div>
          <div class="calendar-grid" id="calendar-grid"></div>
          <div class="calendar-legend">
            <span><span class="legend-dot" style="background:var(--success)"></span>全绿完成</span>
            <span><span class="legend-dot" style="background:var(--fail)"></span>有中断</span>
            <span><span class="legend-dot" style="background:linear-gradient(135deg,var(--success)50%,var(--fail)50%)"></span>喜忧参半</span>
          </div>
        </div>
      </section>

      <!-- 统计视图 -->
      <section class="view" id="view-stats">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="value" id="stat-total">0</div>
            <div class="label">累计番茄</div>
          </div>
          <div class="stat-card">
            <div class="value" id="stat-rate">0%</div>
            <div class="label">完成率</div>
          </div>
          <div class="stat-card">
            <div class="value" id="stat-streak">0</div>
            <div class="label">连续全绿天数</div>
          </div>
          <div class="stat-card">
            <div class="value" id="stat-tasks">0</div>
            <div class="label">待办任务</div>
          </div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="section-title">📈 近7天专注趋势</div>
          <div class="trend-bar" id="trend-bar"></div>
        </div>

        <div class="card">
          <div class="section-title">🏆 成就徽章</div>
          <div class="badge-list" id="badge-list"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchView('tasks')">
        <span class="icon">📝</span>
        <span>任务</span>
      </button>
      <button class="nav-item" onclick="switchView('calendar')">
        <span class="icon">📅</span>
        <span>日历</span>
      </button>
      <button class="nav-item" onclick="switchView('stats')">
        <span class="icon">📊</span>
        <span>统计</span>
      </button>
    </nav>
  </div>

  <!-- 计时器弹窗 -->
  <div class="timer-overlay" id="timer-overlay">
    <div class="timer-modal">
      <div class="timer-task" id="timer-task-title">准备开始专注</div>
      <div class="timer-phase" id="timer-phase">专注时间</div>
      <div class="timer-ring" id="timer-ring">
        <svg viewBox="0 0 220 220">
          <circle class="bg" cx="110" cy="110" r="100"></circle>
          <circle class="progress" id="timer-progress" cx="110" cy="110" r="100"></circle>
        </svg>
        <div class="timer-display" id="timer-display">25:00</div>
      </div>
      <div class="timer-controls">
        <button class="main-btn" id="timer-toggle" onclick="toggleTimer()">开始</button>
        <button class="danger-btn" onclick="abandonTimer()">放弃</button>
      </div>
    </div>
  </div>

  <!-- 成就弹窗 -->
  <div class="badge-popup" id="badge-popup">
    <div class="badge-card">
      <div class="emoji" id="badge-emoji">🏆</div>
      <h3 id="badge-title">成就解锁</h3>
      <p id="badge-desc">描述</p>
      <button onclick="closeBadgePopup()">太棒了</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // =====================
    // 数据状态管理
    // =====================
    const STORAGE_KEY = 'pomodoro_punch_demo_v1';

    // 默认数据
    let state = {
      tasks: [],
      records: {},
      badges: [],
      calendarDate: new Date()
    };

    // 当前计时器状态
    let timerState = {
      active: false,
      running: false,
      phase: 'focus', // 'focus' | 'rest'
      secondsLeft: 25 * 60,
      totalSeconds: 25 * 60,
      taskId: null,
      intervalId: null
    };

    // 初始化：从 localStorage 读取或生成演示数据
    function init() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        state = JSON.parse(saved);
        if (!state.calendarDate) state.calendarDate = new Date();
      } else {
        generateDemoData();
      }
      renderAll();
    }

    // 生成演示数据：过去几天有完成也有中断
    function generateDemoData() {
      const today = new Date();
      state.records = {};
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const key = formatDate(d);
        if (i === 0) {
          state.records[key] = { completed: 0, failed: 0 };
        } else if (i === 2) {
          state.records[key] = { completed: 2, failed: 1 };
        } else if (i === 5) {
          state.records[key] = { completed: 3, failed: 0 };
        } else {
          state.records[key] = { completed: Math.floor(Math.random() * 4) + 1, failed: 0 };
        }
      }
      state.tasks = [
        { id: 1, title: '读完《深度工作》第一章', estimatedPomos: 2, completedPomos: 0, done: false },
        { id: 2, title: '整理本周项目周报', estimatedPomos: 1, completedPomos: 0, done: false }
      ];
      state.badges = [];
      save();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function resetDemo() {
      if (confirm('确定要重置所有演示数据吗？')) {
        localStorage.removeItem(STORAGE_KEY);
        timerState.active = false;
        clearInterval(timerState.intervalId);
        generateDemoData();
        renderAll();
        showToast('🔄 已重置演示数据');
      }
    }

    // =====================
    // 视图切换
    // =====================
    function switchView(viewName) {
      document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + viewName).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
      renderAll();
    }

    // =====================
    // 任务管理
    // =====================
    function addTask() {
      const input = document.getElementById('task-input');
      const select = document.getElementById('pomo-select');
      const title = input.value.trim();
      if (!title) {
        showToast('⚠️ 请输入任务内容');
        return;
      }
      state.tasks.push({
        id: Date.now(),
        title,
        estimatedPomos: parseInt(select.value),
        completedPomos: 0,
        done: false
      });
      input.value = '';
      save();
      renderTasks();
      renderStats();
      showToast('✅ 任务已添加');
    }

    function toggleTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        save();
        renderTasks();
        renderStats();
      }
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      save();
      renderTasks();
      renderStats();
    }

    function startTask(id) {
      if (timerState.active) return;
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;
      if (task.done) {
        showToast('⚠️ 该任务已完成');
        return;
      }

      timerState = {
        active: true,
        running: false,
        phase: 'focus',
        secondsLeft: 25 * 60,
        totalSeconds: 25 * 60,
        taskId: id,
        intervalId: null
      };

      document.getElementById('timer-task-title').textContent = task.title;
      document.getElementById('timer-phase').textContent = '专注时间';
      document.getElementById('timer-display').textContent = '25:00';
      document.getElementById('timer-toggle').textContent = '开始';
      document.getElementById('timer-toggle').classList.remove('rest');
      document.getElementById('timer-ring').classList.remove('rest');
      updateTimerProgress();

      document.getElementById('timer-overlay').classList.add('active');
    }

    function renderTasks() {
      const list = document.getElementById('task-list');
      if (state.tasks.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="emoji">🍃</div>
            <div>还没有任务，添加一个开始专注吧</div>
          </div>`;
      } else {
        list.innerHTML = state.tasks.map(task => `
          <div class="task-item ${task.done ? 'done' : ''}">
            <div class="task-checkbox" onclick="toggleTask(${task.id})">${task.done ? '✓' : ''}</div>
            <div class="task-content">
              <div class="task-title">${escapeHtml(task.title)}</div>
              <div class="task-meta">
                <span>${'🍅'.repeat(task.estimatedPomos)}</span>
                <span>已完成 ${task.completedPomos} 个番茄</span>
              </div>
            </div>
            <div class="task-actions">
              ${!task.done ? `<button class="icon-btn" onclick="startTask(${task.id})" title="开始番茄">▶</button>` : ''}
              <button class="icon-btn delete" onclick="deleteTask(${task.id})" title="删除">×</button>
            </div>
          </div>
        `).join('');
      }
      updateTodayStatus();
    }

    function updateTodayStatus() {
      const today = formatDate(new Date());
      const rec = state.records[today] || { completed: 0, failed: 0 };
      document.getElementById('today-done').textContent = rec.completed;
      document.getElementById('today-fail').textContent = rec.failed;
    }

    // =====================
    // 计时器逻辑
    // =====================
    function toggleTimer() {
      const btn = document.getElementById('timer-toggle');
      if (timerState.running) {
        pauseTimer();
        btn.textContent = timerState.phase === 'focus' ? '继续专注' : '继续休息';
      } else {
        startTimer();
        btn.textContent = timerState.phase === 'focus' ? '暂停' : '暂停休息';
      }
    }

    function startTimer() {
      timerState.running = true;
      timerState.intervalId = setInterval(() => {
        timerState.secondsLeft--;
        updateTimerDisplay();
        updateTimerProgress();
        if (timerState.secondsLeft <= 0) {
          onTimerComplete();
        }
      }, 1000);
    }

    function pauseTimer() {
      timerState.running = false;
      clearInterval(timerState.intervalId);
    }

    function abandonTimer() {
      pauseTimer();
      if (timerState.phase === 'focus') {
        recordResult('failed');
        showToast('💔 专注中断，已记录到日历');
      }
      closeTimer();
    }

    function closeTimer() {
      document.getElementById('timer-overlay').classList.remove('active');
      timerState.active = false;
      timerState.running = false;
      clearInterval(timerState.intervalId);
      renderAll();
    }

    function onTimerComplete() {
      pauseTimer();
      if (timerState.phase === 'focus') {
        recordResult('completed');
        showToast('🎉 专注完成！休息一下吧');
        // 自动进入休息
        timerState.phase = 'rest';
        timerState.secondsLeft = 5 * 60;
        timerState.totalSeconds = 5 * 60;
        document.getElementById('timer-phase').textContent = '休息时间';
        document.getElementById('timer-toggle').textContent = '开始休息';
        document.getElementById('timer-toggle').classList.add('rest');
        document.getElementById('timer-ring').classList.add('rest');
        updateTimerDisplay();
        updateTimerProgress();
      } else {
        showToast('☕ 休息结束，继续加油！');
        closeTimer();
      }
    }

    function recordResult(type) {
      const today = formatDate(new Date());
      if (!state.records[today]) {
        state.records[today] = { completed: 0, failed: 0 };
      }
      state.records[today][type]++;

      if (type === 'completed' && timerState.taskId) {
        const task = state.tasks.find(t => t.id === timerState.taskId);
        if (task) {
          task.completedPomos++;
          if (task.completedPomos >= task.estimatedPomos) {
            task.done = true;
          }
        }
      }

      save();
      checkBadges();
    }

    function updateTimerDisplay() {
      const m = Math.floor(timerState.secondsLeft / 60).toString().padStart(2, '0');
      const s = (timerState.secondsLeft % 60).toString().padStart(2, '0');
      document.getElementById('timer-display').textContent = `${m}:${s}`;
    }

    function updateTimerProgress() {
      const circle = document.getElementById('timer-progress');
      const ratio = timerState.secondsLeft / timerState.totalSeconds;
      const offset = 628 * ratio;
      circle.style.strokeDashoffset = offset;
    }

    // =====================
    // 日历视图
    // =====================
    function changeMonth(delta) {
      state.calendarDate = new Date(state.calendarDate.getFullYear(), state.calendarDate.getMonth() + delta, 1);
      renderCalendar();
    }

    function renderCalendar() {
      const date = state.calendarDate;
      document.getElementById('calendar-month').textContent =
        `${date.getFullYear()}年${date.getMonth() + 1}月`;

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      weekdays.forEach(day => {
        const el = document.createElement('div');
        el.className = 'weekday';
        el.textContent = day;
        grid.appendChild(el);
      });

      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startOffset = firstDay.getDay();
      const daysInMonth = lastDay.getDate();
      const prevLastDay = new Date(year, month, 0).getDate();

      const todayStr = formatDate(new Date());

      // 上月补齐
      for (let i = startOffset - 1; i >= 0; i--) {
        const cell = createDayCell(prevLastDay - i, true);
        grid.appendChild(cell);
      }

      // 当月
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = formatDate(new Date(year, month, d));
        const rec = state.records[ds] || { completed: 0, failed: 0 };
        const isToday = ds === todayStr;
        const cell = createDayCell(d, false, rec, isToday);
        grid.appendChild(cell);
      }

      // 下月补齐
      const remaining = (7 - ((startOffset + daysInMonth) % 7)) % 7;
      for (let d = 1; d <= remaining; d++) {
        const cell = createDayCell(d, true);
        grid.appendChild(cell);
      }
    }

    function createDayCell(day, other, rec, isToday) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (other) cell.classList.add('other');
      if (isToday) cell.classList.add('today');

      let mark = '';
      if (rec && rec.completed > 0 && rec.failed === 0) {
        cell.classList.add('success');
        mark = '✓';
      } else if (rec && rec.completed > 0 && rec.failed > 0) {
        cell.classList.add('mixed');
        mark = '✓✗';
      } else if (rec && rec.failed > 0) {
        cell.classList.add('fail');
        mark = '✗';
      }

      cell.innerHTML = `<span>${day}</span>${mark ? `<span class="mark">${mark}</span>` : ''}`;
      return cell;
    }

    // =====================
    // 统计与成就
    // =====================
    function renderStats() {
      let total = 0;
      let completed = 0;
      let failed = 0;
      Object.values(state.records).forEach(r => {
        total += r.completed + r.failed;
        completed += r.completed;
        failed += r.failed;
      });

      document.getElementById('stat-total').textContent = completed;
      document.getElementById('stat-rate').textContent = total ? Math.round((completed / total) * 100) + '%' : '0%';
      document.getElementById('stat-streak').textContent = calculateStreak();
      document.getElementById('stat-tasks').textContent = state.tasks.filter(t => !t.done).length;

      // 近7天趋势
      const trendBar = document.getElementById('trend-bar');
      trendBar.innerHTML = '';
      const today = new Date();
      for (let i = 6; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const rec = state.records[formatDate(d)] || { completed: 0 };
        const item = document.createElement('div');
        item.className = 'trend-item';
        item.style.height = Math.min(100, rec.completed * 25 + 4) + '%';
        item.title = `${formatDate(d)}: ${rec.completed} 个番茄`;
        trendBar.appendChild(item);
      }

      renderBadges();
    }

    function calculateStreak() {
      let streak = 0;
      const today = new Date();
      for (let i = 0; i < 365; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const rec = state.records[formatDate(d)] || { completed: 0, failed: 0 };
        if (rec.completed > 0 && rec.failed === 0) {
          streak++;
        } else if (i === 0 && rec.completed === 0 && rec.failed === 0) {
          // 今天还没记录，不中断
          continue;
        } else {
          break;
        }
      }
      return streak;
    }

    const BADGE_DEFS = [
      { id: 'first-pomo', title: '初出茅庐', emoji: '🌱', desc: '完成第一个番茄', check: () => getTotalCompleted() >= 1 },
      { id: 'weekly-master', title: '周满贯', emoji: '🔥', desc: '连续 7 天全绿', check: () => calculateStreak() >= 7 },
      { id: 'monthly-master', title: '月度自律达人', emoji: '👑', desc: '连续 30 天全绿', check: () => calculateStreak() >= 30 }
    ];

    function getTotalCompleted() {
      return Object.values(state.records).reduce((sum, r) => sum + r.completed, 0);
    }

    function renderBadges() {
      const list = document.getElementById('badge-list');
      list.innerHTML = BADGE_DEFS.map(b => `
        <div class="badge ${state.badges.includes(b.id) ? 'unlocked' : ''}">
          <span>${b.emoji}</span>
          <span>${b.title}</span>
        </div>
      `).join('');
    }

    function checkBadges() {
      let newlyUnlocked = false;
      BADGE_DEFS.forEach(badge => {
        if (!state.badges.includes(badge.id) && badge.check()) {
          state.badges.push(badge.id);
          showBadgePopup(badge);
          newlyUnlocked = true;
        }
      });
      if (newlyUnlocked) save();
    }

    function showBadgePopup(badge) {
      document.getElementById('badge-emoji').textContent = badge.emoji;
      document.getElementById('badge-title').textContent = badge.title;
      document.getElementById('badge-desc').textContent = badge.desc;
      document.getElementById('badge-popup').classList.add('active');
    }

    function closeBadgePopup() {
      document.getElementById('badge-popup').classList.remove('active');
    }

    // =====================
    // 工具函数
    // =====================
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function renderAll() {
      renderTasks();
      renderCalendar();
      renderStats();
    }

    // 回车添加任务
    document.getElementById('task-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addTask();
    });

    // 启动
    init();
  </script>
</body>
</html>
