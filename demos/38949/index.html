<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 禁止用户缩放，避免老年人误触导致页面缩放混乱 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="专为老年人设计的智能手机使用指南">
  <title>智能手机使用指南</title>
  <style>
    /* ========================
       全局变量与重置
       ======================== */
    :root {
      /* 颜色：高对比度 */
      --bg-color: #FFFFFF;
      --text-color: #000000;
      --primary-color: #165DFF;
      --primary-active: #1045C0;
      --warning-bg: #FFF3CD;
      --warning-text: #000000;
      --danger-bg: #F8D7DA;
      --danger-text: #000000;
      --border-color: #000000;
      --shadow-color: rgba(0, 0, 0, 0.15);

      /* 字体大小档位：默认“更大” */
      --font-base: 28px;
      --font-title: 42px;
      --font-button: 28px;
      --font-small: 24px;
    }

    /* 字体大小三档 */
    [data-font-level="0"] {
      --font-base: 24px;
      --font-title: 36px;
      --font-button: 24px;
      --font-small: 24px;
    }

    [data-font-level="1"] {
      --font-base: 28px;
      --font-title: 42px;
      --font-button: 28px;
      --font-small: 24px;
    }

    [data-font-level="2"] {
      --font-base: 32px;
      --font-title: 48px;
      --font-button: 32px;
      --font-small: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: var(--font-base);
      line-height: 1.6;
      overflow: hidden;
    }

    /* 禁止选中文字，避免老年人长按误操作 */
    body {
      user-select: none;
      -webkit-user-select: none;
    }

    /* ========================
       通用按钮样式
       ======================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 80px;
      min-height: 80px;
      padding: 12px 24px;
      border: none;
      border-radius: 16px;
      background-color: var(--primary-color);
      color: #FFFFFF;
      font-size: var(--font-button);
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.1s ease;
      box-shadow: 0 6px 0 var(--primary-active), 0 8px 16px var(--shadow-color);
    }

    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 var(--primary-active), 0 2px 4px var(--shadow-color);
    }

    .btn-secondary {
      background-color: #FFFFFF;
      color: var(--text-color);
      border: 4px solid var(--border-color);
      box-shadow: 0 6px 0 #CCCCCC, 0 8px 16px var(--shadow-color);
    }

    .btn-secondary:active {
      box-shadow: 0 0 0 #CCCCCC, 0 2px 4px var(--shadow-color);
    }

    .btn-warning {
      background-color: #FFC107;
      color: #000000;
      box-shadow: 0 6px 0 #CC9A00, 0 8px 16px var(--shadow-color);
    }

    .btn-warning:active {
      box-shadow: 0 0 0 #CC9A00, 0 2px 4px var(--shadow-color);
    }

    .btn-disabled {
      background-color: #CCCCCC;
      color: #666666;
      box-shadow: 0 6px 0 #999999, 0 8px 16px var(--shadow-color);
      cursor: not-allowed;
    }

    .btn-disabled:active {
      transform: none;
      box-shadow: 0 6px 0 #999999, 0 8px 16px var(--shadow-color);
    }

    /* ========================
       顶部工具栏
       ======================== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: var(--bg-color);
      border-bottom: 4px solid var(--border-color);
    }

    .header-title {
      font-size: var(--font-title);
      font-weight: bold;
      margin: 0;
      line-height: 1.2;
    }

    .header-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .icon-btn {
      width: 80px;
      height: 80px;
      min-width: 80px;
      min-height: 80px;
      padding: 0;
      border-radius: 16px;
      font-size: 36px;
    }

    .font-btn {
      width: auto;
      min-width: 100px;
      font-size: var(--font-button);
    }

    /* ========================
       页面容器
       ======================== */
    .page {
      display: none;
      width: 100%;
      height: 100%;
      padding-top: 120px;
      padding-bottom: 140px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .page.active {
      display: block;
    }

    .page-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ========================
       首页样式
       ======================== */
    .home-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .home-subtitle {
      font-size: var(--font-base);
      font-weight: normal;
      margin-top: 12px;
      color: var(--text-color);
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }

    .module-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      padding: 24px;
      border: 4px solid var(--border-color);
      border-radius: 24px;
      background-color: #FFFFFF;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.1s ease;
      box-shadow: 0 8px 0 #CCCCCC, 0 12px 24px var(--shadow-color);
    }

    .module-card:active {
      transform: translateY(8px);
      box-shadow: 0 0 0 #CCCCCC, 0 4px 8px var(--shadow-color);
    }

    .module-icon {
      font-size: 72px;
      margin-bottom: 16px;
    }

    .module-name {
      font-size: var(--font-button);
      font-weight: bold;
      text-align: center;
    }

    /* ========================
       模块页样式
       ======================== */
    .module-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .module-header .btn {
      min-width: 120px;
    }

    .module-title {
      flex: 1;
      font-size: var(--font-title);
      font-weight: bold;
      margin: 0;
      text-align: center;
    }

    .step-card {
      border: 4px solid var(--border-color);
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 24px;
      background-color: #FFFFFF;
      box-shadow: 0 8px 0 #CCCCCC, 0 12px 24px var(--shadow-color);
    }

    .step-number {
      display: inline-block;
      width: 64px;
      height: 64px;
      line-height: 64px;
      text-align: center;
      border-radius: 50%;
      background-color: var(--primary-color);
      color: #FFFFFF;
      font-size: var(--font-title);
      font-weight: bold;
      margin-bottom: 16px;
    }

    .step-title {
      font-size: var(--font-title);
      font-weight: bold;
      margin: 0 0 16px 0;
    }

    .step-desc {
      font-size: var(--font-base);
      margin: 0 0 24px 0;
      line-height: 1.7;
    }

    .step-illustration {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 160px;
      margin: 24px 0;
      padding: 20px;
      border: 3px dashed #999999;
      border-radius: 16px;
      background-color: #F9F9F9;
    }

    .step-illustration svg,
    .step-illustration .illustration-content {
      max-width: 100%;
      height: auto;
    }

    .alert {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 16px;
      font-size: var(--font-base);
      font-weight: bold;
      border: 3px solid var(--border-color);
    }

    .alert-warning {
      background-color: var(--warning-bg);
      color: var(--warning-text);
    }

    .alert-danger {
      background-color: var(--danger-bg);
      color: var(--danger-text);
    }

    .alert-icon {
      font-size: 40px;
      line-height: 1;
    }

    .speak-btn {
      width: 100%;
      margin: 16px 0 8px 0;
      min-height: 88px;
    }

    .speak-btn.active {
      background-color: #28A745;
      box-shadow: 0 6px 0 #1E7E34, 0 8px 16px var(--shadow-color);
    }

    .speak-btn.active:active {
      box-shadow: 0 0 0 #1E7E34, 0 2px 4px var(--shadow-color);
    }

    /* ========================
       底部导航
       ======================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 20px;
      background-color: var(--bg-color);
      border-top: 4px solid var(--border-color);
    }

    .bottom-nav .btn {
      flex: 1;
      min-height: 88px;
    }

    .step-counter {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      font-size: var(--font-small);
      font-weight: bold;
      padding: 8px 24px;
      background-color: #F0F0F0;
      border: 2px solid var(--border-color);
      border-radius: 20px;
      z-index: 99;
    }

    /* ========================
       完成提示
       ======================== */
    .completion-message {
      text-align: center;
      padding: 40px 20px;
    }

    .completion-message .module-icon {
      font-size: 100px;
    }

    .completion-message h2 {
      font-size: var(--font-title);
      margin: 20px 0;
    }

    .completion-message p {
      font-size: var(--font-base);
      margin-bottom: 30px;
    }

    /* ========================
       响应式适配
       ======================== */
    @media (max-width: 600px) {
      .header {
        padding: 12px 16px;
      }

      .header-actions {
        gap: 10px;
      }

      .icon-btn {
        width: 64px;
        height: 64px;
        min-width: 64px;
        min-height: 64px;
        font-size: 28px;
      }

      .font-btn {
        min-width: 80px;
        min-height: 64px;
        font-size: var(--font-small);
      }

      .page {
        padding-top: 100px;
      }

      .module-grid {
        grid-template-columns: 1fr;
      }

      .module-card {
        min-height: 140px;
        flex-direction: row;
        justify-content: flex-start;
        gap: 24px;
      }

      .module-icon {
        font-size: 56px;
        margin-bottom: 0;
      }
    }

    @media (min-width: 900px) {
      .module-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* ========================
       示意图样式
       ======================== */
    .phone-mockup {
      width: 120px;
      height: 200px;
      border: 4px solid #000;
      border-radius: 16px;
      background-color: #FFF;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .phone-screen {
      width: 100px;
      height: 160px;
      border: 2px solid #000;
      background-color: #F5F5F5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .wechat-icon {
      width: 60px;
      height: 60px;
      background-color: #07C160;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #FFF;
    }

    .contact-item {
      width: 100%;
      padding: 6px;
      border-bottom: 1px solid #CCC;
      text-align: center;
      font-size: 12px;
    }

    .plus-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #165DFF;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    .didi-icon {
      width: 70px;
      height: 70px;
      background-color: #FF7A00;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #FFF;
    }

    .pay-icon {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #FFF;
      font-weight: bold;
    }

    .weather-card {
      width: 120px;
      padding: 12px;
      border: 3px solid #000;
      border-radius: 12px;
      text-align: center;
      background-color: #E6F2FF;
    }

    .weather-card .emoji {
      font-size: 48px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- ========================
       顶部工具栏
       ======================== -->
  <header class="header">
    <h1 class="header-title">智能手机使用指南</h1>
    <div class="header-actions">
      <button class="btn icon-btn" id="voiceToggle" aria-label="语音开关">
        🔊
      </button>
      <button class="btn btn-secondary font-btn" id="fontToggle" aria-label="调整字体大小">
        大字
      </button>
    </div>
  </header>

  <!-- ========================
       首页
       ======================== -->
  <main class="page active" id="homePage" aria-label="首页">
    <div class="page-content">
      <div class="home-title">
        <h2 style="font-size: var(--font-title); margin: 0 0 12px 0;">点这里学习</h2>
        <p class="home-subtitle">大图标，大按钮，一看就会</p>
      </div>
      <div class="module-grid" id="moduleGrid">
        <!-- 模块卡片由 JavaScript 动态生成 -->
      </div>
    </div>
  </main>

  <!-- ========================
       模块详情页
       ======================== -->
  <main class="page" id="modulePage" aria-label="模块详情">
    <div class="page-content">
      <div class="module-header">
        <button class="btn btn-secondary" id="backHomeBtn">🏠 首页</button>
        <h2 class="module-title" id="moduleTitle">模块标题</h2>
      </div>
      <div id="stepContainer">
        <!-- 步骤内容由 JavaScript 动态生成 -->
      </div>
    </div>
  </main>

  <!-- ========================
       步骤计数器
       ======================== -->
  <div class="step-counter hidden" id="stepCounter">步骤 1 / 3</div>

  <!-- ========================
       底部导航
       ======================== -->
  <nav class="bottom-nav hidden" id="bottomNav" aria-label="步骤导航">
    <button class="btn btn-secondary" id="prevBtn">上一步</button>
    <button class="btn" id="nextBtn">下一步</button>
  </nav>

  <script>
    /* ========================
       应用数据：五个学习模块
       ======================== */
    const modules = [
      {
        id: 'basic',
        title: '基础操作',
        icon: '📱',
        steps: [
          {
            number: 1,
            title: '打电话',
            description: '在手机桌面找到绿色的“电话”图标，点击打开。在拨号键盘上输入对方的手机号码，然后点击底部的“拨打”按钮。',
            warning: '拨号时要仔细核对号码，不要拨错。',
            danger: '千万不要随便拨打陌生号码，防止被骗。',
            illustration: 'phone'
          },
          {
            number: 2,
            title: '接电话',
            description: '手机响铃时，屏幕上会出现“接听”按钮，通常是绿色的。按住按钮向右滑动或点击“接听”即可通话。',
            warning: '如果不认识来电号码，可以先不要接。',
            danger: '陌生号码提到“中奖”“转账”等，千万别信，直接挂断。'
          },
          {
            number: 3,
            title: '发短信',
            description: '打开“信息”或“短信”图标，点击右下角“写信息”按钮。输入对方手机号，在下面空白处输入要说的话，最后点击“发送”。',
            warning: '发送前再检查一遍内容和收件人。',
            danger: '短信里的链接不要随便点，可能是诈骗。'
          }
        ]
      },
      {
        id: 'wechat',
        title: '微信使用',
        icon: '💬',
        steps: [
          {
            number: 1,
            title: '打开微信',
            description: '在手机桌面上找到绿色的微信图标，上面有两个白色的对话气泡，点击打开。',
            warning: '微信图标是绿色的，上面有两个白色的气泡。',
            danger: '千万别点其他颜色的图标。',
            illustration: 'wechat-open'
          },
          {
            number: 2,
            title: '找到要发照片的人',
            description: '点击底部的“通讯录”按钮，然后找到你要发照片的人的名字，点击他的头像。',
            warning: '聊天对象是头像下面的名字，要看清楚。',
            danger: '不要把验证码、密码告诉任何人。',
            illustration: 'wechat-contact'
          },
          {
            number: 3,
            title: '点击右下角的“+”号按钮',
            description: '在聊天界面右下角找到“+”号按钮，点击它，再点击“相册”，选择要发送的照片，最后点击右下角“发送”。',
            warning: '“+”号在输入框的右边，不要点左边的话筒按钮。',
            danger: '不要发送自己的身份证、银行卡照片给陌生人。',
            illustration: 'wechat-photo'
          }
        ]
      },
      {
        id: 'payment',
        title: '扫码支付',
        icon: '💳',
        steps: [
          {
            number: 1,
            title: '微信支付',
            description: '打开微信，点击右上角“+”号，选择“扫一扫”，对准商家的收款二维码，输入金额，确认后输入支付密码。',
            warning: '支付前要核对商家名称和金额是否正确。',
            danger: '不要把支付密码告诉别人，也不要截图保存密码。'
          },
          {
            number: 2,
            title: '支付宝支付',
            description: '打开支付宝，点击顶部“扫一扫”，对准商家的收款二维码，输入金额，点击“付款”，再输入支付密码。',
            warning: '付款前要确认金额和商家名字。',
            danger: '陌生人让你扫码转账，千万不要扫。'
          }
        ]
      },
      {
        id: 'taxi',
        title: '打车出行',
        icon: '🚗',
        steps: [
          {
            number: 1,
            title: '打开滴滴打车',
            description: '在手机桌面找到橙色的“滴滴出行”图标，点击打开。',
            warning: '滴滴图标是橙色的，上面有一个小汽车图案。',
            danger: '不要点名字相似的陌生软件。',
            illustration: 'didi'
          },
          {
            number: 2,
            title: '输入目的地',
            description: '点击首页“您要去哪儿”，输入目的地名称或地址，然后从列表中选择正确的地点。',
            warning: '选择地址时要核对城市、街道和门牌号。',
            danger: '不要泄露家庭详细地址给陌生人。'
          },
          {
            number: 3,
            title: '呼叫车辆',
            description: '确认上车地点和目的地后，点击“确认呼叫”或“立即叫车”，等待司机接单。上车后告诉司机手机尾号。',
            warning: '上车前核对车牌号和软件显示的是否一致。',
            danger: '车牌号不一致的车千万不要上。'
          }
        ]
      },
      {
        id: 'life',
        title: '生活服务',
        icon: '🏠',
        steps: [
          {
            number: 1,
            title: '查天气',
            description: '在手机桌面找到“天气”图标，点击打开即可看到今天和未来几天的天气情况。',
            warning: '天气图标通常是蓝色或白色的，带有太阳或云朵图案。',
            danger: '不要下载陌生天气软件，可能包含广告和病毒。',
            illustration: 'weather'
          },
          {
            number: 2,
            title: '看时间',
            description: '手机主屏幕最上方或锁屏界面会显示当前时间。也可以打开“时钟”应用查看详细时间。',
            warning: '如果手机时间不对，可能需要调整时区设置。'
          },
          {
            number: 3,
            title: '调闹钟',
            description: '打开“时钟”应用，点击底部“闹钟”，点击右上角“+”号，选择响铃时间，最后点击“保存”。',
            warning: '设闹钟时要确认是上午还是下午。',
            danger: '睡觉前把手机放在伸手能拿到的地方，但不要放在枕头下。'
          }
        ]
      }
    ];

    /* ========================
       应用状态
       ======================== */
    const STORAGE_KEY = 'seniorPhoneGuideSettings';
    const FONT_LEVELS = ['大', '更大', '最大'];

    let state = {
      currentView: 'home',
      currentModuleId: null,
      currentStepIndex: 0,
      voiceEnabled: true,
      fontSizeLevel: 1
    };

    // 当前是否正在朗读
    let isSpeaking = false;

    /* ========================
       本地存储
       ======================== */
    function loadSettings() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.voiceEnabled = parsed.voiceEnabled !== undefined ? parsed.voiceEnabled : true;
          state.fontSizeLevel = parsed.fontSizeLevel !== undefined ? parsed.fontSizeLevel : 1;
        }
      } catch (e) {
        console.warn('读取本地设置失败', e);
      }
    }

    function saveSettings() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          voiceEnabled: state.voiceEnabled,
          fontSizeLevel: state.fontSizeLevel
        }));
      } catch (e) {
        console.warn('保存设置失败', e);
      }
    }

    /* ========================
       语音朗读
       ======================== */
    function speak(text) {
      if (!window.speechSynthesis) {
        console.warn('当前浏览器不支持语音朗读');
        return;
      }
      // 先停止当前朗读
      window.speechSynthesis.cancel();
      if (!text || !state.voiceEnabled) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = 0.9; // 语速稍慢，方便老人听清
      utterance.pitch = 1;
      utterance.volume = 1;

      // 尝试选择中文语音
      const voices = window.speechSynthesis.getVoices();
      const chineseVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
      if (chineseVoice) {
        utterance.voice = chineseVoice;
      }

      utterance.onstart = () => {
        isSpeaking = true;
        updateSpeakButton(true);
      };

      utterance.onend = () => {
        isSpeaking = false;
        updateSpeakButton(false);
      };

      utterance.onerror = () => {
        isSpeaking = false;
        updateSpeakButton(false);
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      updateSpeakButton(false);
    }

    function updateSpeakButton(speaking) {
      const btn = document.getElementById('speakBtn');
      if (!btn) return;
      if (speaking) {
        btn.classList.add('active');
        btn.textContent = '🔊 正在播放';
      } else {
        btn.classList.remove('active');
        btn.textContent = '🔊 播放语音';
      }
    }

    /* ========================
       视图渲染
       ======================== */
    function renderHome() {
      const grid = document.getElementById('moduleGrid');
      grid.innerHTML = '';

      modules.forEach(module => {
        const card = document.createElement('div');
        card.className = 'module-card';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.innerHTML = `
          <div class="module-icon">${module.icon}</div>
          <div class="module-name">${module.title}</div>
        `;
        card.addEventListener('click', () => openModule(module.id));
        grid.appendChild(card);
      });
    }

    function renderModule() {
      const module = modules.find(m => m.id === state.currentModuleId);
      if (!module) return;

      document.getElementById('moduleTitle').textContent = module.title;
      const container = document.getElementById('stepContainer');
      container.innerHTML = '';

      const stepIndex = state.currentStepIndex;
      const isCompleted = stepIndex >= module.steps.length;

      // 更新底部导航和步骤计数器显示
      document.getElementById('bottomNav').classList.remove('hidden');
      document.getElementById('stepCounter').classList.remove('hidden');

      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');

      if (isCompleted) {
        // 显示完成页面
        document.getElementById('stepCounter').textContent = '已完成';
        prevBtn.disabled = false;
        prevBtn.classList.remove('btn-disabled');
        nextBtn.textContent = '完成';
        nextBtn.disabled = true;
        nextBtn.classList.add('btn-disabled');

        const completion = document.createElement('div');
        completion.className = 'completion-message';
        completion.innerHTML = `
          <div class="module-icon">🎉</div>
          <h2>恭喜您！</h2>
          <p>您已经学完了“${module.title}”模块。</p>
          <p>点击“上一步”可以回看，点击“首页”返回主界面。</p>
        `;
        container.appendChild(completion);

        // 完成时朗读祝贺语
        if (state.voiceEnabled) {
          speak(`恭喜您，已经学完了${module.title}模块。`);
        }
        return;
      }

      const step = module.steps[stepIndex];
      document.getElementById('stepCounter').textContent = `步骤 ${stepIndex + 1} / ${module.steps.length}`;

      // 更新上一步/下一步按钮状态
      prevBtn.disabled = stepIndex === 0;
      nextBtn.disabled = false;
      nextBtn.textContent = '下一步';
      if (prevBtn.disabled) {
        prevBtn.classList.add('btn-disabled');
      } else {
        prevBtn.classList.remove('btn-disabled');
      }
      nextBtn.classList.remove('btn-disabled');

      const card = document.createElement('div');
      card.className = 'step-card';
      card.id = 'stepCard';

      let alertsHtml = '';
      if (step.warning) {
        alertsHtml += `
          <div class="alert alert-warning">
            <span class="alert-icon">⚠️</span>
            <div>注意：${step.warning}</div>
          </div>
        `;
      }
      if (step.danger) {
        alertsHtml += `
          <div class="alert alert-danger">
            <span class="alert-icon">❌</span>
            <div>千万别点：${step.danger}</div>
          </div>
        `;
      }

      const illustrationHtml = getIllustrationHtml(step.illustration);

      card.innerHTML = `
        <div class="step-number">${step.number}</div>
        <h3 class="step-title">${step.title}</h3>
        <p class="step-desc">${step.description}</p>
        ${illustrationHtml ? `<div class="step-illustration">${illustrationHtml}</div>` : ''}
        ${alertsHtml}
        <button class="btn speak-btn" id="speakBtn">🔊 播放语音</button>
      `;

      container.appendChild(card);

      // 绑定播放语音按钮
      document.getElementById('speakBtn').addEventListener('click', () => {
        const text = buildSpeechText(module.title, step);
        speak(text);
      });

      // 如果语音开关开启，自动朗读当前步骤
      if (state.voiceEnabled) {
        const text = buildSpeechText(module.title, step);
        speak(text);
      }
    }

    function getIllustrationHtml(type) {
      switch (type) {
        case 'phone':
          return `
            <div class="phone-mockup">
              <div class="phone-screen">
                <div style="font-size: 24px;">📞</div>
                <div style="font-size: 12px; margin-top: 8px;">拨号键盘</div>
              </div>
            </div>
          `;
        case 'wechat-open':
          return `
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
              <div class="wechat-icon">💬</div>
              <div style="font-size: 14px;">绿色图标，两个白气泡</div>
            </div>
          `;
        case 'wechat-contact':
          return `
            <div class="phone-mockup">
              <div class="phone-screen" style="justify-content: flex-start; padding-top: 12px;">
                <div style="font-size: 12px; margin-bottom: 8px;">通讯录</div>
                <div class="contact-item">👤 张三</div>
                <div class="contact-item">👤 李四</div>
              </div>
            </div>
          `;
        case 'wechat-photo':
          return `
            <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
              <div class="wechat-icon">💬</div>
              <div style="font-size: 14px;">点击右下角 + 号</div>
              <div class="plus-btn">+</div>
            </div>
          `;
        case 'didi':
          return `
            <div class="didi-icon">🚗</div>
          `;
        case 'weather':
          return `
            <div class="weather-card">
              <div class="emoji">🌤️</div>
              <div style="font-size: 16px; font-weight: bold; margin-top: 8px;">今天晴天</div>
              <div style="font-size: 14px;">25°C</div>
            </div>
          `;
        default:
          return '';
      }
    }

    function buildSpeechText(moduleTitle, step) {
      let text = `${moduleTitle}，第${step.number}步，${step.title}。${step.description}`;
      if (step.warning) {
        text += `。注意：${step.warning}`;
      }
      if (step.danger) {
        text += `。千万别点：${step.danger}`;
      }
      return text;
    }

    function switchView(viewName) {
      state.currentView = viewName;
      document.getElementById('homePage').classList.toggle('active', viewName === 'home');
      document.getElementById('modulePage').classList.toggle('active', viewName === 'module');

      if (viewName === 'home') {
        document.getElementById('bottomNav').classList.add('hidden');
        document.getElementById('stepCounter').classList.add('hidden');
        stopSpeaking();
      }
    }

    function openModule(moduleId) {
      state.currentModuleId = moduleId;
      state.currentStepIndex = 0;
      switchView('module');
      renderModule();
    }

    function goToStep(index) {
      const module = modules.find(m => m.id === state.currentModuleId);
      if (!module) return;

      // 限制索引范围
      if (index < 0) index = 0;
      if (index > module.steps.length) index = module.steps.length;

      state.currentStepIndex = index;
      stopSpeaking();
      renderModule();
    }

    /* ========================
       全局控制
       ======================== */
    function updateVoiceButton() {
      const btn = document.getElementById('voiceToggle');
      btn.textContent = state.voiceEnabled ? '🔊' : '🔇';
      btn.setAttribute('aria-pressed', state.voiceEnabled);
    }

    function toggleVoice() {
      state.voiceEnabled = !state.voiceEnabled;
      updateVoiceButton();
      saveSettings();

      if (!state.voiceEnabled) {
        stopSpeaking();
      } else if (state.currentView === 'module') {
        // 开启后自动朗读当前步骤
        renderModule();
      }
    }

    function updateFontButton() {
      const btn = document.getElementById('fontToggle');
      btn.textContent = FONT_LEVELS[state.fontSizeLevel];
      document.documentElement.setAttribute('data-font-level', String(state.fontSizeLevel));
    }

    function toggleFontSize() {
      state.fontSizeLevel = (state.fontSizeLevel + 1) % FONT_LEVELS.length;
      updateFontButton();
      saveSettings();
    }

    /* ========================
       事件绑定与初始化
       ======================== */
    function init() {
      loadSettings();
      updateVoiceButton();
      updateFontButton();
      renderHome();

      // 语音开关
      document.getElementById('voiceToggle').addEventListener('click', toggleVoice);

      // 字体大小切换
      document.getElementById('fontToggle').addEventListener('click', toggleFontSize);

      // 返回首页
      document.getElementById('backHomeBtn').addEventListener('click', () => {
        switchView('home');
        renderHome();
      });

      // 上一步
      document.getElementById('prevBtn').addEventListener('click', () => {
        goToStep(state.currentStepIndex - 1);
      });

      // 下一步
      document.getElementById('nextBtn').addEventListener('click', () => {
        goToStep(state.currentStepIndex + 1);
      });

      // 预加载语音列表（某些浏览器需要）
      if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }

      // 页面卸载前停止朗读
      window.addEventListener('beforeunload', stopSpeaking);
    }

    // 启动应用
    init();
  </script>
</body>
</html>
