<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交星图 - 社交网络关系可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        .header p {
            font-size: 1rem;
            color: #7f8c8d;
            font-weight: 300;
        }

        .legend {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }

        .legend h3 {
            font-size: 1rem;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #5a6c7d;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .legend-color.large {
            width: 20px;
            height: 20px;
        }

        .legend-color.medium {
            width: 14px;
            height: 14px;
        }

        .legend-color.small {
            width: 10px;
            height: 10px;
        }

        .info-panel {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            z-index: 100;
            text-align: right;
        }

        .info-panel h3 {
            font-size: 1rem;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .info-stat {
            font-size: 0.9rem;
            color: #5a6c7d;
            margin-bottom: 5px;
        }

        .info-value {
            font-weight: 600;
            color: #3498db;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>社交星图</h1>
        <p>Social Network Visualization</p>
    </div>

    <div class="legend">
        <h3>图例说明</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #e74c3c;"></div>
            <span>核心用户</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #3498db;"></div>
            <span>活跃用户</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2ecc71;"></div>
            <span>普通用户</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #9b59b6;"></div>
            <span>新用户</span>
        </div>
        <div class="legend-item">
            <div class="legend-color large" style="background: #3498db;"></div>
            <span>影响力大</span>
        </div>
        <div class="legend-item">
            <div class="legend-color small" style="background: #3498db;"></div>
            <span>影响力小</span>
        </div>
    </div>

    <div class="info-panel">
        <h3>数据统计</h3>
        <div class="info-stat">节点数量: <span class="info-value">50</span></div>
        <div class="info-stat">连接关系: <span class="info-value">120</span></div>
        <div class="info-stat">平均度数: <span class="info-value">4.8</span></div>
    </div>

    <canvas id="networkCanvas"></canvas>

    <script>
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        resize();
        window.addEventListener('resize', resize);

        const NODE_COUNT = 50;
        const EDGE_COUNT = 120;

        const colors = {
            core: '#e74c3c',
            active: '#3498db',
            normal: '#2ecc71',
            new: '#9b59b6'
        };

        function getRandomColor() {
            const rand = Math.random();
            if (rand < 0.1) return colors.core;
            if (rand < 0.3) return colors.active;
            if (rand < 0.7) return colors.normal;
            return colors.new;
        }

        class Node {
            constructor(id) {
                this.id = id;
                this.x = Math.random() * (width - 200) + 100;
                this.y = Math.random() * (height - 200) + 100;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.color = getRandomColor();
                this.size = Math.random() * 12 + 8;
                this.fixed = Math.random() < 0.05;
            }

            update() {
                if (!this.fixed) {
                    this.x += this.vx;
                    this.y += this.vy;

                    this.vx *= 0.95;
                    this.vy *= 0.95;

                    if (this.x < this.size) {
                        this.x = this.size;
                        this.vx *= -0.5;
                    }
                    if (this.x > width - this.size) {
                        this.x = width - this.size;
                        this.vx *= -0.5;
                    }
                    if (this.y < this.size) {
                        this.y = this.size;
                        this.vy *= -0.5;
                    }
                    if (this.y > height - this.size) {
                        this.y = height - this.size;
                        this.vy *= -0.5;
                    }
                }
            }

            draw() {
                const gradient = ctx.createRadialGradient(
                    this.x - this.size * 0.3,
                    this.y - this.size * 0.3,
                    0,
                    this.x,
                    this.y,
                    this.size
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                gradient.addColorStop(0.4, this.color);
                gradient.addColorStop(1, this.color + '80');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        class Edge {
            constructor(source, target) {
                this.source = source;
                this.target = target;
                this.weight = Math.random() * 2 + 1;
            }

            draw() {
                const dx = this.target.x - this.source.x;
                const dy = this.target.y - this.source.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist > 300) return;

                const alpha = Math.max(0.1, 0.4 * (1 - dist / 300));
                
                ctx.beginPath();
                ctx.moveTo(this.source.x, this.source.y);
                ctx.lineTo(this.target.x, this.target.y);
                ctx.strokeStyle = `rgba(156, 189, 222, ${alpha})`;
                ctx.lineWidth = this.weight * alpha;
                ctx.stroke();
            }

            applyForce() {
                const dx = this.target.x - this.source.x;
                const dy = this.target.y - this.source.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 5) return;

                const springLength = 100;
                const springStrength = 0.001;
                const force = (dist - springLength) * springStrength;

                const fx = (dx / dist) * force;
                const fy = (dy / dist) * force;

                if (!this.source.fixed) {
                    this.source.vx += fx;
                    this.source.vy += fy;
                }
                if (!this.target.fixed) {
                    this.target.vx -= fx;
                    this.target.vy -= fy;
                }
            }
        }

        const nodes = [];
        const edges = [];

        for (let i = 0; i < NODE_COUNT; i++) {
            nodes.push(new Node(i));
        }

        const edgesSet = new Set();

        for (let i = 0; i < EDGE_COUNT; i++) {
            let source, target;
            let attempts = 0;
            
            do {
                source = Math.floor(Math.random() * NODE_COUNT);
                target = Math.floor(Math.random() * NODE_COUNT);
                attempts++;
            } while (source === target || 
                     edgesSet.has(`${source},${target}`) || 
                     edgesSet.has(`${target},${source}`) ||
                     attempts > 100);

            if (attempts <= 100) {
                edgesSet.add(`${source},${target}`);
                edges.push(new Edge(nodes[source], nodes[target]));
            }
        }

        function applyRepulsion() {
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[j].x - nodes[i].x;
                    const dy = nodes[j].y - nodes[i].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 5) continue;

                    const repulsionStrength = 2000;
                    const force = repulsionStrength / (dist * dist);

                    const fx = (dx / dist) * force;
                    const fy = (dy / dist) * force;

                    if (!nodes[i].fixed) {
                        nodes[i].vx -= fx;
                        nodes[i].vy -= fy;
                    }
                    if (!nodes[j].fixed) {
                        nodes[j].vx += fx;
                        nodes[j].vy += fy;
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            applyRepulsion();

            edges.forEach(edge => {
                edge.applyForce();
                edge.draw();
            });

            nodes.forEach(node => {
                node.update();
                node.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
