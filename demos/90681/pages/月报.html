<!DOCTYPE html>
<html lang="zh-CN" class="light" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月报 - 牛马日记</title>
    <style id="theme-vars">
/* ============================================
   牛马日记 — Brand Design Tokens
   暖金专业风 · 向上管理职场工具
   ============================================ */

/* --- Color System --- */
:root {
  /* Brand Primary — Warm Gold / Amber */
  --color-brand-primary: #B8860B;
  --color-brand-primary-hover: #9A7209;
  --color-brand-primary-light: #F5E6C8;
  --color-brand-primary-lighter: #FBF5E8;
  --color-brand-primary-text: #FFFFFF;
  --color-brand-primary-text-hover: #FFF8E7;

  /* Neutral Scale */
  --color-neutral-50: #FAFAF8;
  --color-neutral-100: #F5F4F0;
  --color-neutral-200: #E8E6DF;
  --color-neutral-300: #D4D1C7;
  --color-neutral-400: #A9A597;
  --color-neutral-500: #7A7668;
  --color-neutral-600: #5C584B;
  --color-neutral-700: #3E3B31;
  --color-neutral-800: #2A2820;
  --color-neutral-900: #1A1812;

  /* Semantic Backgrounds */
  --color-bg-primary: #FFFFFF;
  --color-bg-secondary: #F9F8F5;
  --color-bg-tertiary: #F3F1EC;
  --color-bg-elevated: #FFFFFF;

  /* Semantic Text */
  --color-text-primary: #1A1812;
  --color-text-secondary: #5C584B;
  --color-text-tertiary: #7A7668;
  --color-text-placeholder: #A9A597;
  --color-text-inverse: #FFFFFF;

  /* Semantic Borders */
  --color-border-primary: #E8E6DF;
  --color-border-secondary: #F3F1EC;
  --color-border-focus: #B8860B;

  /* State Colors */
  --state-success: #2D8A56;
  --state-success-bg: #E8F5ED;
  --state-warning: #D4880B;
  --state-warning-bg: #FEF5E0;
  --state-error: #C53030;
  --state-error-bg: #FEE8E8;
  --state-info: #2563EB;
  --state-info-bg: #EBF2FF;

  /* Surface & Depth */
  --background: var(--color-bg-primary);
  --foreground: var(--color-text-primary);
  --card: var(--color-bg-elevated);
  --card-foreground: var(--color-text-primary);
  --popover: var(--color-bg-primary);
  --popover-foreground: var(--color-text-primary);
  --primary: var(--color-brand-primary);
  --primary-foreground: var(--color-brand-primary-text);
  --secondary: var(--color-neutral-100);
  --secondary-foreground: var(--color-text-primary);
  --muted: var(--color-neutral-200);
  --muted-foreground: var(--color-text-tertiary);
  --accent: var(--color-brand-primary-light);
  --accent-foreground: var(--color-text-primary);
  --destructive: var(--state-error);
  --destructive-foreground: #FFFFFF;
  --border: var(--color-border-primary);
  --input: var(--color-border-primary);
  --ring: var(--color-brand-primary);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --shadow-sm: 0 1px 2px rgba(26, 24, 18, 0.04);
  --shadow-md: 0 2px 8px rgba(26, 24, 18, 0.05);
  --shadow-lg: 0 8px 24px rgba(26, 24, 18, 0.05);
  --shadow-card: 0 1px 3px rgba(26, 24, 18, 0.05);
  --shadow-float: 0 12px 32px rgba(26, 24, 18, 0.12);

  /* Radius Scale */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Spacing Scale */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --font-display: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;

  /* Font Size Scale */
  --text-xs: 10px;
  --text-sm: 12px;
  --text-base: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;
  --text-4xl: 28px;

  /* Line Height */
  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  /* Font Weight */
  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-normal: 250ms ease;
  --transition-slow: 350ms ease;

  /* Z-index */
  --z-base: 0;
  --z-above: 10;
  --z-nav: 100;
  --z-overlay: 200;
  --z-modal: 300;
  --z-toast: 400;
}

/* Dark Mode (reserved) */
html.dark {
  --color-bg-primary: #1A1812;
  --color-bg-secondary: #2A2820;
  --color-bg-tertiary: #3E3B31;
  --color-bg-elevated: #2A2820;
  --color-text-primary: #F5F4F0;
  --color-text-secondary: #A9A597;
  --color-text-tertiary: #7A7668;
  --color-border-primary: #3E3B31;
  --color-border-secondary: #2A2820;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
}

/* --- Typography Classes --- */
.typography-display {
  font-family: var(--font-display);
  font-size: var(--text-4xl);
  font-weight: var(--font-bold);
  line-height: var(--leading-tight);
  letter-spacing: -0.02em;
  color: var(--color-text-primary);
}

.typography-headline {
  font-family: var(--font-display);
  font-size: var(--text-2xl);
  font-weight: var(--font-semibold);
  line-height: var(--leading-tight);
  color: var(--color-text-primary);
}

.typography-title {
  font-family: var(--font-display);
  font-size: var(--text-xl);
  font-weight: var(--font-semibold);
  line-height: var(--leading-normal);
  color: var(--color-text-primary);
}

.typography-body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: var(--font-normal);
  line-height: var(--leading-normal);
  color: var(--color-text-primary);
}

.typography-body-secondary {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  font-weight: var(--font-normal);
  line-height: var(--leading-normal);
  color: var(--color-text-secondary);
}

.typography-caption {
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  font-weight: var(--font-normal);
  line-height: var(--leading-normal);
  color: var(--color-text-tertiary);
}

.typography-overline {
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: var(--font-medium);
  line-height: var(--leading-normal);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--color-text-tertiary);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>

<!-- Status Bar -->
<header style="
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: 44px;
  background: var(--color-bg-primary);
  border-bottom: 1px solid var(--color-border-primary);
  display: flex;
  align-items: center;
  justify-content: center;
">
  <span style="
    font-size: 17px;
    font-weight: 600;
    color: var(--color-text-primary);
    letter-spacing: 0.5px;
  ">月报</span>

      <!-- WeChat Mini Program System Capsule -->
      <div class="w-[87px] h-8 rounded-full bg-black/[0.06] flex items-center overflow-hidden" style="position:absolute;right:8px;top:50%;transform:translateY(-50%)">
        <i data-lucide="more-horizontal" aria-label="更多" class="border-r border-l border-black/[0.08]" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,0.45);flex-shrink:0"></i>
        <i data-lucide="x" aria-label="关闭" style="width:55px;height:32px;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,0.45);flex-shrink:0"></i>
      </div>
    </header>

<!-- Main Content Area -->
<main style="
  padding-top: 44px;
  padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  min-height: 100vh;
  background: var(--color-bg-secondary);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
">

  <!-- Month Selector -->
  <div class="month-selector no-scrollbar">
    <div class="month-chip active">2026年7月</div>
    <div class="month-chip">2026年6月</div>
    <div class="month-chip">2026年5月</div>
  </div>

  <!-- Stats Overview (2x2 grid) -->
  <div class="stats-grid">
    <!-- Card 1: 工作记录 -->
    <div class="stat-card">
      <div class="stat-card-header">
        <span class="stat-card-label">工作记录</span>
        <svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <div class="stat-card-value">156条</div>
      <div class="stat-card-trend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
        +12% vs上月
      </div>
    </div>

    <!-- Card 2: AI优化 -->
    <div class="stat-card">
      <div class="stat-card-header">
        <span class="stat-card-label">AI优化</span>
        <svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
      </div>
      <div class="stat-card-value">48次</div>
      <div class="stat-card-trend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
        +8% vs上月
      </div>
    </div>

    <!-- Card 3: 日报生成 -->
    <div class="stat-card">
      <div class="stat-card-header">
        <span class="stat-card-label">日报生成</span>
        <svg class="stat-card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div class="stat-card-value">22份</div>
      <div class="stat-card-trend">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
        +5% vs上月
      </div>
    </div>

    <!-- Card 4: 工作饱和度 -->
    <div class="stat-card">
      <div class="stat-card-header">
        <span class="stat-card-label">工作饱和度</span>
        <div class="circular-progress">
          <svg viewBox="0 0 36 36">
            <circle class="track" cx="18" cy="18" r="16"/>
            <circle class="fill-ring" cx="18" cy="18" r="16"/>
          </svg>
        </div>
      </div>
      <div class="stat-card-value">92%</div>
      <div class="stat-card-trend" style="color: var(--color-brand-primary);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
        本月目标100%
      </div>
    </div>
  </div>

  <!-- Bar Chart Card -->
  <div class="content-card">
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      每日工作量趋势
    </div>
    <div class="bar-chart">
      <div class="bar-col">
        <span class="bar-value">8</span>
        <div class="bar-track" style="height: 72px;"></div>
        <span class="bar-label">周一</span>
      </div>
      <div class="bar-col">
        <span class="bar-value">6</span>
        <div class="bar-track" style="height: 54px;"></div>
        <span class="bar-label">周二</span>
      </div>
      <div class="bar-col">
        <span class="bar-value">10</span>
        <div class="bar-track" style="height: 96px;"></div>
        <span class="bar-label">周三</span>
      </div>
      <div class="bar-col">
        <span class="bar-value">7</span>
        <div class="bar-track" style="height: 63px;"></div>
        <span class="bar-label">周四</span>
      </div>
      <div class="bar-col">
        <span class="bar-value">9</span>
        <div class="bar-track" style="height: 81px;"></div>
        <span class="bar-label">周五</span>
      </div>
      <div class="bar-col">
        <span class="bar-value">5</span>
        <div class="bar-track" style="height: 45px;"></div>
        <span class="bar-label">周六</span>
      </div>
      <div class="bar-col">
        <span class="bar-value">3</span>
        <div class="bar-track" style="height: 27px;"></div>
        <span class="bar-label">周日</span>
      </div>
    </div>
  </div>

  <!-- Monthly Work Categories (Stacked Bar) -->
  <div class="content-card">
    <div class="card-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      工作类别分布
    </div>
    <div class="stacked-bar-container">
      <div class="stacked-bar">
        <div class="seg-gold" style="width: 45%;"></div>
        <div class="seg-light-gold" style="width: 25%;"></div>
        <div class="seg-neutral" style="width: 15%;"></div>
        <div class="seg-neutral-dark" style="width: 10%;"></div>
        <div class="seg-neutral-darker" style="width: 5%;"></div>
      </div>
      <div class="legend-list">
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--color-brand-primary);"></span>
          项目推进 45%
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--color-brand-primary-light);"></span>
          文档撰写 25%
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--color-neutral-300);"></span>
          会议沟通 15%
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--color-neutral-400);"></span>
          问题处理 10%
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: var(--color-neutral-500);"></span>
          学习成长 5%
        </div>
      </div>
    </div>
  </div>

  <!-- AI Monthly Summary -->
  <div class="content-card ai-summary-card">
    <div class="ai-summary-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      AI 月度总结
    </div>
    <p class="ai-summary-text">本月共完成156项工作，核心成果：完成3份重要报告、推进2个重点项目、优化5个业务流程。工作质量整体呈上升趋势。</p>
  </div>

  <!-- Bottom Actions -->
  <div class="bottom-actions">
    <button class="btn-primary" data-dom-id="generate-monthly-report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      AI一键生成月报
    </button>
    <div class="btn-secondary-group">
      <a class="btn-secondary" href="#" data-dom-id="goto-achievement">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
        </svg>
        成果看板
      </a>
      <a class="btn-secondary" href="#" data-dom-id="goto-ai-optimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        AI优化
      </a>
    </div>
  </div>

</main>

<!-- Bottom Tab Bar -->
<nav style="
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: calc(56px + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);

  <a data-dom-id="tab-quick-note" data-nav-key="quick-note" data-active="false" href="#" style="

    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 6px;
    width: 25%;
    text-decoration: none;
    color: var(--color-text-tertiary);
    transition: color 0.15s;
  ">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
    </svg>
    <span style="
      font-size: 10px;
      margin-top: 2px;
      font-weight: 500;
    ">随手记</span>
  </a>

  <!-- 报告 (active) -->
  <a data-dom-id="tab-report" data-nav-key="report" data-active="true" href="#" style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-top: 6px;
    width: 25%;
    text-decoration: none;
    color: var(--color-brand-primary);
    transition: color 0.15s;
