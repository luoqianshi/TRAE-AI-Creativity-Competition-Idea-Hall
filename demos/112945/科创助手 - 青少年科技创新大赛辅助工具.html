        function evaluateIdeaScore(idea) {
            let score = 50;
            if (idea.title && idea.title.length > 5) score += 10;
            if (idea.category) score += 10;
            if (idea.description && idea.description.length > 20) score += 10;
            if (idea.feasibility) score += 10;
            if (idea.innovation) score += 10;
            return Math.min(score, 100);
        }

        function exportReport() {
            const project = getCurrentProject();
            if (!project.report) {
                showToast('还没有报告内容', 'warning');
                return;
            }
            
            let markdown = `# ${project.report.title || project.name}\n\n`;
            markdown += `**项目类别：** ${project.category || ''}\n\n`;
            markdown += `---\n\n`;
            
            reportSections.forEach(section => {
                if (section.id === 'title') return;
                const content = project.report[section.id];
                if (content) {
                    markdown += `## ${section.name}\n\n${content}\n\n`;
                }
            });
            
            const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${project.name}_研究报告.md`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('报告已导出为Markdown格式');
        }

        function renderDefenseSessionList() {
            const project = getCurrentProject();
            if (!project || !project.chats || !project.chats.defense) return '';
            
            if (project.chats.defense.length === 0) {
                return '<p class="text-gray-400 text-center py-4 text-sm col-span-full">还没有答辩记录，点击"开始新答辩"开始第一次模拟答辩</p>';
            }
            
            return project.chats.defense.map(session => {
                const isActive = session.id === currentDefenseSessionId;
                const date = new Date(session.updatedAt);
                const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                const messageCount = session.messages.length;
                
                return `
                    <div class="p-3 rounded-lg cursor-pointer transition-all group ${isActive ? 'bg-red-50 border-2 border-red-300' : 'bg-gray-50 border-2 border-transparent hover:border-gray-200'}" onclick="loadDefenseSession('${session.id}')">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex-1 min-w-0">
                                <p class="font-medium text-dark text-sm truncate ${isActive ? 'text-red-600' : ''}">${session.title}</p>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-xs text-gray-400"><i class="fa fa-clock-o mr-1"></i>${dateStr}</span>
                                    <span class="text-xs text-gray-400"><i class="fa fa-comment-o mr-1"></i>${messageCount} 轮</span>
                                </div>
                            </div>
                            <button onclick="event.stopPropagation(); deleteDefenseSession('${session.id}')" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-danger text-sm">
                                <i class="fa fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function createNewDefenseSession() {
            const project = getCurrentProject();
            if (!project) return;
            
            const newSession = {
                id: generateId(),
                title: '模拟答辩 ' + new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                messages: []
            };
            
            project.chats.defense.unshift(newSession);
            currentDefenseSessionId = newSession.id;
            saveData(appData);
            
            loadDefenseSession(newSession.id);
        }
        
        function loadDefenseSession(sessionId) {
            const project = getCurrentProject();
            if (!project) return;
            
            const session = project.chats.defense.find(s => s.id === sessionId);
            if (!session) return;
            
            currentDefenseSessionId = sessionId;
            
            // 刷新列表
            const listEl = document.getElementById('defenseSessionList');
            if (listEl) listEl.innerHTML = renderDefenseSessionList();
            
            // 刷新标题
            const titleEl = document.getElementById('currentDefenseTitle');
            if (titleEl) titleEl.textContent = `当前答辩：${session.title}`;
            
            // 刷新消息区
            const chatDiv = document.getElementById('defenseChat');
            if (chatDiv) {
                if (session.messages.length === 0) {
                    chatDiv.innerHTML = `
                        <div class="flex gap-3">
                            <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
                                <i class="fa fa-user text-red-500"></i>
                            </div>
                            <div class="bg-gray-100 rounded-xl p-3 max-w-[80%]">
                                <p class="text-gray-700">准备好了吗？请先简要介绍一下你的项目吧？</p>
                            </div>
                        </div>
                    `;
                } else {
                     // 修正评委图标
                     chatDiv.innerHTML = session.messages.map(msg => {
                        const safeContent = escapeHtml(msg.content);
                        if (msg.role === 'user') {
                            return `
                                <div class="flex gap-3 justify-end">
                                    <div class="bg-primary text-white rounded-xl p-3 max-w-[80%]">
                                        <p class="whitespace-pre-line">${safeContent}</p>
                                        ${msg.timestamp ? `<p class="text-xs text-white/60 mt-1">${formatTime(msg.timestamp)}</p>` : ''}
                                    </div>
                                    <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center flex-shrink-0">
                                        <i class="fa fa-user text-primary"></i>
                                    </div>
                                </div>
                            `;
                        } else {
                            return `
                                <div class="flex gap-3">
                                    <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
                                        <i class="fa fa-user text-red-500"></i>
                                    </div>
                                    <div class="bg-gray-100 rounded-xl p-3 max-w-[80%]">
                                        <p class="text-gray-700 whitespace-pre-line">${safeContent}</p>
                                        ${msg.timestamp ? `<p class="text-xs text-gray-400 mt-1">${formatTime(msg.timestamp)}</p>` : ''}
                                    </div>
                                </div>
                            `;
                        }
                    }).join('');

                chatDiv.scrollTop = chatDiv.scrollHeight;

        function deleteDefenseSession(sessionId) {
            if (!confirm('确定删除这次答辩记录吗？')) return;
            const project = getCurrentProject();
            if (!project) return;
            
            project.chats.defense = project.chats.defense.filter(s => s.id !== sessionId);
            
            if (currentDefenseSessionId === sessionId) {
                currentDefenseSessionId = null;
            }
            
            saveData(appData);
            
            if (currentDefenseSessionId === null && project.chats.defense.length > 0) {
                loadDefenseSession(project.chats.defense[0].id);
            } else {
                document.getElementById('defenseSessionList').innerHTML = renderDefenseSessionList();
                if (project.chats.defense.length === 0) {
                    document.getElementById('defenseChat').innerHTML = `
                        <div class="flex gap-3">
                            <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
                                <i class="fa fa-user text-red-500"></i>
                            </div>
                            <div class="bg-gray-100 rounded-xl p-3 max-w-[80%]">
                                <p class="text-gray-700">所有答辩记录已删除，点击"开始新答辩"重新开始。</p>
                            </div>
                        </div>
                    `;
                    document.getElementById('currentDefenseTitle').textContent = 'AI模拟评委将围绕你的项目提问，锻炼你的答辩能力';

            }
            showToast('答辩记录已删除');
        }
        
        function renameCurrentDefenseSession() {
            const project = getCurrentProject();
            if (!project || !currentDefenseSessionId) {
                showToast('请先选择或创建一个答辩会话', 'warning');
                return;
            }
            const session = project.chats.defense.find(s => s.id === currentDefenseSessionId);

        async function sendDefenseAnswer() {
            const input = document.getElementById('defenseInput');
            const answer = input.value.trim();
            if (!answer) return;
            
            const project = getCurrentProject();
            if (!project) {
                showToast('请先选择项目', 'warning');
                return;
            }
            
            // 获取或创建答辩会话
            const session = getOrCreateDefenseSession();
            if (!session) return;
            
            const chatDiv = document.getElementById('defenseChat');
            
            // 添加学生回答
            const userMsg = { role: 'user', content: answer, timestamp: new Date().toISOString() };
            session.messages.push(userMsg);
            
            chatDiv.innerHTML += `
                <div class="flex gap-3 justify-end">
                    <div class="bg-primary text-white rounded-xl p-3 max-w-[80%]">
                        <p class="whitespace-pre-line">${escapeHtml(answer)}</p>
                        <p class="text-xs text-white/60 mt-1">${formatTime(userMsg.timestamp)}</p>
                    </div>
                    <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa fa-user text-primary"></i>
                    </div>
                </div>
            `;
            
            input.value = '';
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            if (!appData.settings.aiApiKey) {
                const errMsg = { role: 'assistant', content: '请先在"设置与数据"中配置AI API密钥，即可进行完整的模拟答辩。', timestamp: new Date().toISOString() };
                session.messages.push(errMsg);
                session.updatedAt = new Date().toISOString();
                saveData(appData);
                
                chatDiv.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-yellow-100 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-exclamation-triangle text-yellow-600"></i>
                        </div>
                        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 max-w-[80%]">
                            <p class="text-yellow-700">请先在"设置与数据"中配置AI API密钥</p>
                        </div>
                    </div>
                `;
                chatDiv.scrollTop = chatDiv.scrollHeight;
                document.getElementById('defenseSessionList').innerHTML = renderDefenseSessionList();
                return;
            }
            
            // 保存当前状态
            session.updatedAt = new Date().toISOString();
            saveData(appData);
            
            // AI思考中
            const thinkingId = 'thinking-' + Date.now();
            chatDiv.innerHTML += `
                <div id="${thinkingId}" class="flex gap-3">
                    <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa fa-user text-red-500"></i>
                    </div>
                    <div class="bg-gray-100 rounded-xl p-3">
                        <p class="text-gray-500"><i class="fa fa-circle-o-notch fa-spin mr-2"></i>评委正在思考...</p>
                    </div>
                </div>
            `;
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            try {
                const systemPrompt = `你是一位青少年科技创新大赛的评委，正在对参赛学生进行现场问辩。${project ? `学生的项目是"${project.name}"，项目描述：${project.description || ''}` : ''}。请像真实评委一样：1. 根据学生的回答进行追问；2. 问题要有针对性，围绕项目的科学性、创新性、研究过程、个人贡献等方面；3. 一次只问一个问题；4. 可以先对学生的回答做简短点评再追问；5. 语气既专业又有鼓励性。不要说你是AI，就扮演一位真实的评委老师。`;
                
                // 关键：传入答辩会话的完整历史
                const contextMessages = session.messages.slice(-20).map(m => ({
                    role: m.role,
                    content: m.content
                }));
                
                const response = await callAI([
                    { role: 'system', content: systemPrompt },
                    ...contextMessages
                ]);
                
                const aiMsg = { role: 'assistant', content: response, timestamp: new Date().toISOString() };
                session.messages.push(aiMsg);
                session.updatedAt = new Date().toISOString();
                saveData(appData);
                
                document.getElementById(thinkingId)?.remove();
                
                chatDiv.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-user text-red-500"></i>
                        </div>
                        <div class="bg-gray-100 rounded-xl p-3 max-w-[80%]">
                            <p class="text-gray-700 whitespace-pre-line">${escapeHtml(response)}</p>
                            <p class="text-xs text-gray-400 mt-1">${formatTime(aiMsg.timestamp)}</p>
                        </div>
                    </div>
                `;
                chatDiv.scrollTop = chatDiv.scrollHeight;
                document.getElementById('defenseSessionList').innerHTML = renderDefenseSessionList();
            } catch (error) {
                const errMsg = { role: 'assistant', content: `AI调用失败：${error.message}`, timestamp: new Date().toISOString() };
                session.messages.push(errMsg);
                session.updatedAt = new Date().toISOString();
                saveData(appData);
                
                document.getElementById(thinkingId)?.remove();
                chatDiv.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-exclamation-circle text-red-500"></i>
                        </div>
                        <div class="bg-red-50 border border-red-200 rounded-xl p-3 max-w-[80%]">
                            <p class="text-red-700">AI调用失败：${error.message}</p>
                        </div>
                    </div>
                `;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        }
        
        function resetDefenseChat() {
            if (!currentDefenseSessionId) {
                showToast('请先选择或创建一个答辩会话', 'warning');
                return;

            if (!confirm('确定要重置当前答辩的所有消息吗？')) return;

            showToast('AI正在生成答题思路...', 'info');
            
            try {

                    { role: 'system', content: '你是一位有经验的科创大赛指导老师，请针对评委可能提出的问题，给出回答思路和要点建议，帮助学生更好地准备答辩。建议要具体，分点列出，告诉学生从哪些角度回答，需要突出什么。' },

        function renderAssistantChatList() {
            const project = getCurrentProject();
            if (!project || !project.chats || !project.chats.assistant) return '';
            
            if (project.chats.assistant.length === 0) {
                return '<p class="text-gray-400 text-center py-8 text-sm">还没有对话，点击"新对话"开始</p>';
            }
            
            return project.chats.assistant.map(chat => {
                const isActive = chat.id === currentAssistantChatId;
                const lastMessage = chat.messages[chat.messages.length - 1];
                const preview = lastMessage ? (lastMessage.content.substring(0, 40) + (lastMessage.content.length > 40 ? '...' : '')) : '空对话';
                const messageCount = chat.messages.length;
                const date = new Date(chat.updatedAt);
                const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
                
                return `
                    <div class="p-3 rounded-lg cursor-pointer transition-all group ${isActive ? 'bg-primary/10 border border-primary/30' : 'bg-gray-50 hover:bg-gray-100'}" onclick="loadAssistantChat('${chat.id}')">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex-1 min-w-0">
                                <p class="font-medium text-dark text-sm truncate ${isActive ? 'text-primary' : ''}">${chat.title}</p>

                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function loadAssistantChat(chatId) {
            const project = getCurrentProject();
            if (!project) return;
            
            const chat = project.chats.assistant.find(c => c.id === chatId);
            if (!chat) return;
            
            currentAssistantChatId = chatId;
            
            // 刷新列表UI
            document.getElementById('assistantChatList').innerHTML = renderAssistantChatList();
            
            // 刷新标题
            document.getElementById('currentChatTitle').textContent = chat.title;
            
            // 刷新消息区
            const chatDiv = document.getElementById('aiChatMessages');
            if (chat.messages.length === 0) {
                chatDiv.innerHTML = `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-magic text-white"></i>
                        </div>
                        <div class="bg-white rounded-xl p-3 max-w-[80%] shadow-sm">
                            <p class="text-gray-700">这是一个空对话，向我提问开始吧！</p>
                        </div>
                    </div>
                `;
            } else {
                chatDiv.innerHTML = renderChatMessages(chat.messages);
            }
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }
        
        function renderChatMessages(messages) {
            return messages.map(msg => {
                if (msg.role === 'user') {
                    return `
                        <div class="flex gap-3 justify-end">
                            <div class="bg-primary text-white rounded-xl p-3 max-w-[80%]">
                                <p class="whitespace-pre-line">${escapeHtml(msg.content)}</p>
                                ${msg.timestamp ? `<p class="text-xs text-white/60 mt-1">${formatTime(msg.timestamp)}</p>` : ''}
                            </div>
                            <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center flex-shrink-0">
                                <i class="fa fa-user text-primary"></i>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="flex gap-3">
                            <div class="w-8 h-8 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center flex-shrink-0">
                                <i class="fa fa-magic text-white"></i>
                            </div>
                            <div class="bg-white rounded-xl p-3 max-w-[80%] shadow-sm">
                                <p class="text-gray-700 whitespace-pre-line">${escapeHtml(msg.content)}</p>
                                ${msg.timestamp ? `<p class="text-xs text-gray-400 mt-1">${formatTime(msg.timestamp)}</p>` : ''}
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatTime(isoStr) {
            const date = new Date(isoStr);
            return `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
        }
        
        function deleteAssistantChat(chatId) {
            if (!confirm('确定删除这个对话吗？删除后无法恢复。')) return;
            const project = getCurrentProject();
            if (!project) return;
            
            project.chats.assistant = project.chats.assistant.filter(c => c.id !== chatId);
            
            if (currentAssistantChatId === chatId) {
                currentAssistantChatId = null;
            }
            
            saveData(appData);
            
            if (currentAssistantChatId === null && project.chats.assistant.length > 0) {
                loadAssistantChat(project.chats.assistant[0].id);
            } else if (project.chats.assistant.length === 0) {
                document.getElementById('assistantChatList').innerHTML = renderAssistantChatList();
                document.getElementById('aiChatMessages').innerHTML = `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-magic text-white"></i>
                        </div>
                        <div class="bg-white rounded-xl p-3 max-w-[80%] shadow-sm">
                            <p class="text-gray-700">所有对话已删除，点击"新对话"开始新的交流。</p>
                        </div>
                    </div>
                `;
                document.getElementById('currentChatTitle').textContent = 'AI科创助手';
            } else {
                document.getElementById('assistantChatList').innerHTML = renderAssistantChatList();
            }
            
            showToast('对话已删除');
        }
        
        function renameCurrentChat() {
            const project = getCurrentProject();
            if (!project || !currentAssistantChatId) {
                showToast('请先选择一个对话', 'warning');
                return;
            }
            const chat = project.chats.assistant.find(c => c.id === currentAssistantChatId);
            if (!chat) return;
            
            const newTitle = prompt('请输入新对话标题：', chat.title);
            if (newTitle && newTitle.trim()) {
                chat.title = newTitle.trim();

                saveData(appData);
                document.getElementById('currentChatTitle').textContent = chat.title;
                document.getElementById('assistantChatList').innerHTML = renderAssistantChatList();
                showToast('已重命名');
            }
        }
        
        function clearCurrentChat() {
            if (!currentAssistantChatId) {
                showToast('请先选择一个对话', 'warning');
                return;
            }
            if (!confirm('确定清空当前对话的所有消息吗？')) return;
            
            const project = getCurrentProject();
            const chat = project.chats.assistant.find(c => c.id === currentAssistantChatId);
            if (chat) {
                chat.messages = [];
                chat.updatedAt = new Date().toISOString();
                saveData(appData);
                document.getElementById('aiChatMessages').innerHTML = `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-magic text-white"></i>
                        </div>

                    </div>
                `;
                document.getElementById('assistantChatList').innerHTML = renderAssistantChatList();
                showToast('对话已清空');
            }
        }
        
        function quickAIQuestion(question) {
            const input = document.getElementById('aiChatInput');
            if (input) {
                input.value = question;
                sendAIMessage();
            }
        }
        
        async function sendAIMessage() {
            const input = document.getElementById('aiChatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const project = getCurrentProject();
            if (!project) {
                showToast('请先选择项目', 'warning');
                return;
            }
            
            // 如果没有当前会话，先创建一个
            if (!currentAssistantChatId) {
                createNewAssistantChat();
            }
            
            const chat = project.chats.assistant.find(c => c.id === currentAssistantChatId);
            if (!chat) return;
            
            const chatDiv = document.getElementById('aiChatMessages');
            
            // 添加用户消息到界面
            const userMsg = { role: 'user', content: message, timestamp: new Date().toISOString() };
            chat.messages.push(userMsg);
            
            chatDiv.innerHTML += `
                <div class="flex gap-3 justify-end">
                    <div class="bg-primary text-white rounded-xl p-3 max-w-[80%]">
                        <p class="whitespace-pre-line">${escapeHtml(message)}</p>
                        <p class="text-xs text-white/60 mt-1">${formatTime(userMsg.timestamp)}</p>
                    </div>
                    <div class="w-8 h-8 bg-primary/10 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa fa-user text-primary"></i>
                    </div>
                </div>
            `;
            
            input.value = '';
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            // 自动更新标题（首次提问时）
            if (chat.messages.length === 1 && chat.title.startsWith('新对话')) {
                chat.title = message.substring(0, 20) + (message.length > 20 ? '...' : '');
                document.getElementById('currentChatTitle').textContent = chat.title;
            }
            
            if (!appData.settings.aiApiKey) {
                const errMsg = { role: 'assistant', content: '请先在"设置与数据"页面配置AI API密钥，即可使用完整的AI对话功能。', timestamp: new Date().toISOString() };
                chat.messages.push(errMsg);
                saveData(appData);
                chatDiv.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-yellow-100 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-exclamation-triangle text-yellow-600"></i>
                        </div>
                        <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-3 max-w-[80%]">
                            <p class="text-yellow-700">请先在"设置与数据"页面配置AI API密钥</p>
                            <button class="btn btn-warning mt-2 text-sm" onclick="navigateTo('settings')">前往配置</button>
                        </div>
                    </div>
                `;
                chatDiv.scrollTop = chatDiv.scrollHeight;
                document.getElementById('assistantChatList').innerHTML = renderAssistantChatList();
                return;
            }
            
            const thinkingId = 'thinking-' + Date.now();
            chatDiv.innerHTML += `
                <div id="${thinkingId}" class="flex gap-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fa fa-magic text-white"></i>
                    </div>
                    <div class="bg-white rounded-xl p-3 shadow-sm">
                        <p class="text-gray-500"><i class="fa fa-circle-o-notch fa-spin mr-2"></i>思考中...</p>
                    </div>
                </div>
            `;
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            try {
                // 关键：调用历史对话作为上下文，让AI理解之前的对话
                const contextMessages = chat.messages.slice(-20).map(m => ({
                    role: m.role === 'user' ? 'user' : 'assistant',
                    content: m.content
                }));
                
                const response = await callAI([
                    { role: 'system', content: '你是一位专业、耐心的青少年科技创新大赛指导老师，擅长解答初中生关于科创大赛的各种问题。请用亲切、鼓励的语气回答，给出具体、实用、可操作的建议。回答要简洁明了，结构清晰，适合中学生理解。' },
                    ...contextMessages
                ]);
                
                const aiMsg = { role: 'assistant', content: response, timestamp: new Date().toISOString() };
                chat.messages.push(aiMsg);
                chat.updatedAt = new Date().toISOString();
                saveData(appData); // 每次都保存
                
                document.getElementById(thinkingId)?.remove();
                
                chatDiv.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-gradient-to-br from-primary to-secondary rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-magic text-white"></i>
                        </div>
                        <div class="bg-white rounded-xl p-3 max-w-[80%] shadow-sm">
                            <p class="text-gray-700 whitespace-pre-line">${escapeHtml(response)}</p>
                            <p class="text-xs text-gray-400 mt-1">${formatTime(aiMsg.timestamp)}</p>
                        </div>
                    </div>
                `;
                chatDiv.scrollTop = chatDiv.scrollHeight;
                document.getElementById('assistantChatList').innerHTML = renderAssistantChatList();
            } catch (error) {
                const errMsg = { role: 'assistant', content: `AI调用失败：${error.message}`, timestamp: new Date().toISOString() };
                chat.messages.push(errMsg);
                saveData(appData);
                
                document.getElementById(thinkingId)?.remove();
                chatDiv.innerHTML += `
                    <div class="flex gap-3">
                        <div class="w-8 h-8 bg-red-100 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fa fa-exclamation-circle text-red-500"></i>
                        </div>
                        <div class="bg-red-50 border border-red-200 rounded-xl p-3 max-w-[80%]">
                            <p class="text-red-700">AI调用失败：${error.message}</p>
                        </div>
                    </div>
                `;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }
        }
        
        // ==================== 设置页面 ====================

                    <div class="card">

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">API地址</label>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                                <h4 class="font-semibold text-dark mb-2">导入数据</h4>
                                <p class="text-sm text-gray-500 mb-3">从之前导出的JSON文件恢复数据（会覆盖当前数据）</p>

                        <div class="mt-4 p-4 bg-red-50 rounded-xl">

                            <p class="text-sm text-red-600 mb-3">清除所有数据，此操作不可恢复！建议先导出备份。</p>

        function saveAISettings() {
            appData.settings.aiApiUrl = document.getElementById('aiApiUrl').value.trim();
            appData.settings.aiApiKey = document.getElementById('aiApiKey').value.trim();
            appData.settings.aiModel = document.getElementById('aiModel').value.trim();
            saveData(appData);
            showToast('AI设置已保存');
        }
        
        function exportAllData() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `科创助手备份_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('数据已导出，请妥善保管');
        }
        
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (confirm('导入数据将覆盖当前所有数据，确定继续吗？')) {
                        appData = { ...defaultData, ...data };
                        saveData(appData);
                        updateCurrentProjectBadge();
                        showToast('数据导入成功');
                        navigateTo('dashboard');
                    }
                } catch(err) {
                    showToast('文件格式错误，导入失败', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        function clearAllData() {
            if (!confirm('确定要清除所有数据吗？此操作不可恢复！')) return;
            if (!confirm('再次确认：所有项目、日志、报告都将被永久删除！')) return;
            
            localStorage.removeItem(STORAGE_KEY);
            appData = loadData();
            updateCurrentProjectBadge();
            showToast('所有数据已清除');
            navigateTo('dashboard');
        }
        
        function viewStudentData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const viewDiv = document.getElementById('teacherViewContent');
                    viewDiv.classList.remove('hidden');
                    
                    let html = '<div class="p-4 bg-blue-50 rounded-xl mt-4"><h4 class="font-semibold text-blue-800 mb-3">📊 学生项目数据概览</h4>';
                    
                    if (data.projects && data.projects.length > 0) {
                        data.projects.forEach((project, pIdx) => {
                            const progress = Math.round(((project.completedMilestones || []).length / milestones.length) * 100);
                            const tasksTotal = project.tasks?.length || 0;
                            const tasksCompleted = project.tasks?.filter(t => t.completed).length || 0;
                            const logsCount = project.logs?.length || 0;
                            const reportWords = Object.values(project.report || {}).join('').length;
                            
                            // AI对话数量统计
                            const assistantChats = project.chats?.assistant?.length || 0;
                            const assistantMessages = project.chats?.assistant?.reduce((sum, c) => sum + c.messages.length, 0) || 0;
                            const defenseSessions = project.chats?.defense?.length || 0;
                            const researchHistory = project.chats?.research?.length || 0;
                            const writingHistory = project.chats?.writing?.length || 0;
                            
                            html += `
                                <div class="bg-white rounded-lg p-4 mb-3">
                                    <h5 class="font-bold text-dark mb-2">${project.name}</h5>
                                    <p class="text-sm text-gray-500 mb-3">${project.description || '无描述'}</p>
                                    
                                    <!-- 基础数据 -->
                                    <div class="grid grid-cols-4 gap-2 text-center text-sm mb-3">
                                        <div class="p-2 bg-gray-50 rounded">
                                            <p class="font-bold text-primary">${progress}%</p>
                                            <p class="text-xs text-gray-400">进度</p>
                                        </div>
                                        <div class="p-2 bg-gray-50 rounded">
                                            <p class="font-bold text-green-500">${tasksCompleted}/${tasksTotal}</p>
                                            <p class="text-xs text-gray-400">任务</p>
                                        </div>
                                        <div class="p-2 bg-gray-50 rounded">
                                            <p class="font-bold text-blue-500">${logsCount}</p>
                                            <p class="text-xs text-gray-400">日志</p>
                                        </div>
                                        <div class="p-2 bg-gray-50 rounded">
                                            <p class="font-bold text-purple-500">${reportWords}</p>
                                            <p class="text-xs text-gray-400">报告字数</p>
                                        </div>
                                    </div>
                                    
                                    <!-- AI对话统计 -->
                                    <div class="grid grid-cols-4 gap-2 text-center text-sm mb-3">
                                        <div class="p-2 bg-indigo-50 rounded">
                                            <p class="font-bold text-indigo-600">${assistantChats}/${assistantMessages}</p>
                                            <p class="text-xs text-gray-400">AI对话/消息</p>
                                        </div>
                                        <div class="p-2 bg-red-50 rounded">
                                            <p class="font-bold text-red-600">${defenseSessions}</p>
                                            <p class="text-xs text-gray-400">模拟答辩</p>
                                        </div>
                                        <div class="p-2 bg-blue-50 rounded">
                                            <p class="font-bold text-blue-600">${researchHistory}</p>

                                            <p class="font-bold text-purple-600">${writingHistory}</p>
                                            <p class="text-xs text-gray-400">写作建议</p>
                                        </div>
                                    </div>
                                    
                                    <div class="mt-3">
                                        <p class="text-xs text-gray-400 mb-1">里程碑完成情况</p>
                                        <div class="flex gap-1 flex-wrap">
                                            ${milestones.map(m => `
                                                <span class="px-2 py-1 text-xs rounded ${(project.completedMilestones || []).includes(m.id) ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-400'}">${m.name}</span>
                                            `).join('')}
                                        </div>
                                    </div>
                                    
                                    <!-- AI对话历史详情 -->
                                    ${assistantChats > 0 || defenseSessions > 0 || researchHistory > 0 || writingHistory > 0 ? `
                                    <div class="mt-3 pt-3 border-t border-gray-100">
                                        <button class="btn btn-secondary text-sm w-full" onclick="toggleStudentChats(${pIdx})">

                                        </button>
                                        <div id="studentChats-${pIdx}" class="hidden mt-3 space-y-3">
                                            ${renderStudentAssistantChats(project.chats?.assistant || [])}
                                            ${renderStudentDefenseSessions(project.chats?.defense || [])}
                                            ${renderStudentResearchHistory(project.chats?.research || [])}
                                            ${renderStudentWritingHistory(project.chats?.writing || [])}
                                        </div>
                                    </div>
                                    ` : ''}
                                </div>
                            `;
                        });
                    } else {
                        html += '<p class="text-gray-500">未找到项目数据</p>';
                    }
                    
                    html += '</div>';
                    viewDiv.innerHTML = html;
                    showToast('学生数据已加载');
                } catch(err) {
                    showToast('文件格式错误：' + err.message, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }
        
        function toggleStudentChats(pIdx) {
            const el = document.getElementById(`studentChats-${pIdx}`);

        function renderStudentAssistantChats(chats) {

                        <div class="bg-white rounded p-2 mb-2 text-sm">

                                <span class="text-xs text-gray-400">${formatTime(chat.updatedAt)}</span>

                                <summary class="text-xs text-primary cursor-pointer">查看完整对话</summary>

        function renderStudentDefenseSessions(sessions) {
            if (sessions.length === 0) return '';
            return `
                <div class="p-3 bg-red-50 rounded-lg">

                    ${sessions.slice(0, 3).map(session => `
                        <div class="bg-white rounded p-2 mb-2 text-sm">
                            <div class="flex items-center justify-between mb-1">
                                <span class="font-medium">${session.title}</span>

                                <summary class="text-xs text-primary cursor-pointer">查看完整记录</summary>
                                <div class="mt-2 space-y-2 max-h-60 overflow-y-auto">
                                    ${session.messages.map(m => `
                                        <div class="p-2 rounded text-xs ${m.role === 'user' ? 'bg-primary/5' : 'bg-gray-50'}">
                                            <span class="font-medium">${m.role === 'user' ? '学生' : '评委'}：</span>
                                            <span class="whitespace-pre-line">${escapeHtml(m.content.substring(0, 200))}${m.content.length > 200 ? '...' : ''}</span>

        function renderStudentResearchHistory(history) {
            if (history.length === 0) return '';
            return `
                <div class="p-3 bg-blue-50 rounded-lg">
                    <h6 class="font-semibold text-blue-800 mb-2 text-sm">🎓 研究辅导 (${history.length})</h6>
                    ${history.slice(0, 3).map(item => `
                        <div class="bg-white rounded p-2 mb-2 text-sm">
                            <div class="flex items-center justify-between mb-1">
                                <span class="badge bg-blue-100 text-blue-700">${item.typeName || '辅导'}</span>
                                <span class="text-xs text-gray-400">${formatTime(item.createdAt)}</span>
                            </div>
                            <p class="text-xs text-gray-600">问：${escapeHtml(item.query)}</p>
                            <details class="mt-1">
                                <summary class="text-xs text-primary cursor-pointer">查看AI建议</summary>
                                <p class="text-xs text-gray-700 mt-2 whitespace-pre-line">${escapeHtml(item.response.substring(0, 300))}${item.response.length > 300 ? '...' : ''}</p>
                            </details>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        function renderStudentWritingHistory(history) {
            if (history.length === 0) return '';
            return `
                <div class="p-3 bg-purple-50 rounded-lg">
                    <h6 class="font-semibold text-purple-800 mb-2 text-sm">✍️ 写作建议 (${history.length})</h6>
                    ${history.slice(0, 3).map(item => `
                        <div class="bg-white rounded p-2 mb-2 text-sm">
                            <div class="flex items-center justify-between mb-1">
                                <span class="badge bg-purple-100 text-purple-700">${item.sectionName}</span>
                                <span class="text-xs text-gray-400">${formatTime(item.createdAt)}</span>
                            </div>
                            <p class="text-xs text-gray-600">${item.query}</p>
                            <details class="mt-1">
                                <summary class="text-xs text-primary cursor-pointer">查看AI建议</summary>
                                <p class="text-xs text-gray-700 mt-2 whitespace-pre-line">${escapeHtml(item.response.substring(0, 300))}${item.response.length > 300 ? '...' : ''}</p>
                            </details>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // ==================== AI API调用 ====================
        async function callAI(messages) {
            const { aiApiUrl, aiApiKey, aiModel } = appData.settings;
            
            if (!aiApiKey) {
                throw new Error('请先配置API密钥');
            }
            
            const response = await fetch(aiApiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${aiApiKey}`
                },
                body: JSON.stringify({
                    model: aiModel,
                    messages: messages,
                    temperature: 0.7
                })
            });
            
            if (!response.ok) {
                const error = await response.json().catch(() => ({}));
                throw new Error(error.error?.message || `HTTP ${response.status}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        // ==================== 初始化 ====================
        function init() {
            updateCurrentProjectBadge();
            navigateTo('dashboard');
            
            // 添加动画样式
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slide-in {
                    from { opacity: 0; transform: translateX(100px); }
                    to { opacity: 1; transform: translateX(0); }
                }
                .animate-slide-in {
                    animation: slide-in 0.3s ease-out;
                }
                .line-clamp-2 {
                    display: -webkit-box;
                    -webkit-line-clamp: 2;
                    -webkit-box-orient: vertical;
                    overflow: hidden;
                }
                .line-clamp-3 {
                    display: -webkit-box;
                    -webkit-line-clamp: 3;
                    -webkit-box-orient: vertical;
                    overflow: hidden;
                }
            `;
            document.head.appendChild(style);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
