<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BodyMap — 从身体开始，慢慢了解自己</title>
<style>
:root{
  --bg:#F8F6F3;--panel:#FFFEFC;--line:#E7E0D8;--text:#2C2C2C;
  --muted:#756E67;--soft:#A39B93;--terra:#D8895B;--terra-deep:#B96539;
  --terra-pale:#F8E7DB;--active:#FF6236;--active-pale:rgba(255,98,54,.15);
  --shadow:0 14px 38px rgba(70,54,43,.08);--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:68px 1fr}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(248,246,243,.94)}
.brand{display:flex;align-items:center;gap:11px}
.brand-dot{width:12px;height:12px;border-radius:50%;background:var(--terra);box-shadow:0 0 0 5px var(--terra-pale)}
.brand-name{font-size:20px;font-weight:700}.brand-sub{font-size:12px;color:var(--muted);margin-left:4px}
.top-actions{position:fixed;left:22px;top:90px;z-index:7;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px}.top-chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);cursor:pointer}.top-chip:hover{border-color:#E9B89A;color:var(--terra-deep)}.top-chip.active{background:var(--terra-pale);border-color:#E9B89A;color:var(--terra-deep);font-weight:650}
.workspace{display:grid;grid-template-columns:minmax(470px,1.35fr) 300px minmax(360px,.95fr);min-height:0}
.stage,.region,.detail{min-width:0;min-height:0}.region,.detail{border-left:1px solid var(--line);padding:18px;background:rgba(255,254,252,.5)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:20px 24px 24px}
.stage-tools{display:none}
.tool{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;box-shadow:0 4px 14px rgba(70,54,43,.05)}
.tool.active{background:var(--terra-pale);color:var(--terra-deep);border-color:#E9C6AF}
.body-wrap{height:100%;max-height:calc(100vh - 105px);position:relative;display:inline-flex;align-items:center;justify-content:center}
.body-image{height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 18px 34px rgba(61,39,28,.12));user-select:none}
.hotspot{position:absolute;width:54px;height:46px;border:0;background:transparent;border-radius:48% 52% 54% 46%;transform:translate(-50%,-50%) rotate(-9deg);cursor:pointer;z-index:5;transition:transform .22s ease,filter .22s ease}
.hotspot::before{content:"";position:absolute;inset:4px;border-radius:inherit;background:rgba(255,98,54,.16);border:1.5px solid rgba(255,98,54,.82);box-shadow:0 0 0 5px rgba(255,98,54,.08),0 7px 18px rgba(185,101,57,.14);animation:shoulderBreath 2.2s ease-in-out infinite}
.hotspot::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--active),0 0 0 8px rgba(255,98,54,.13)}
.hotspot:hover{transform:translate(-50%,-50%) rotate(-9deg) scale(1.08);filter:saturate(1.08)}
.hotspot.selected::before{background:rgba(255,98,54,.27);border-color:var(--active);box-shadow:0 0 0 6px rgba(255,98,54,.12),0 9px 24px rgba(185,101,57,.2);animation:none}
@keyframes shoulderBreath{0%,100%{opacity:.72;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
.shoulder-guide{position:absolute;z-index:6;display:flex;align-items:center;gap:9px;transform:translateY(-50%);pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.shoulder-guide::before{content:"";width:42px;height:1px;background:linear-gradient(90deg,rgba(216,137,91,.2),var(--terra))}
.shoulder-guide span{padding:8px 12px;border:1px solid #E8D7CB;background:rgba(255,254,252,.95);border-radius:999px;color:var(--terra-deep);font-size:12px;font-weight:650;box-shadow:0 8px 24px rgba(70,54,43,.08);white-space:nowrap}
.shoulder-guide.hide{opacity:0;transform:translateY(-50%) translateX(8px)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid #E8D7CB;background:rgba(255,254,252,.96);border-radius:999px;color:var(--muted);font-size:12px;box-shadow:0 10px 28px rgba(70,54,43,.08);transition:opacity .25s ease,transform .25s ease}
.hint::before{content:"↖";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--terra-pale);color:var(--terra-deep);font-weight:700}
.hint.hide{opacity:0;transform:translateX(-50%) translateY(8px);pointer-events:none}
.panel{height:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.panel-head{padding:19px 18px 15px;border-bottom:1px solid var(--line)}
.kicker{font-size:10px;letter-spacing:.12em;color:var(--terra-deep);font-weight:700}.panel-title{font-size:25px;font-weight:700;margin-top:5px}.panel-desc{color:var(--muted);font-size:12px;line-height:1.65;margin-top:6px}
.panel-body{padding:15px;overflow:auto;flex:1}.section-label{font-size:11px;color:var(--soft);margin-bottom:9px}
.muscle-list{display:flex;flex-direction:column;gap:8px}.muscle-item{display:grid;grid-template-columns:42px 1fr 18px;gap:10px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;color:var(--text)}
.muscle-item:hover{border-color:#E9B89A;background:#FFF9F5}.muscle-item.active{border-color:var(--active);background:#FFF4EE;box-shadow:0 0 0 2px rgba(255,98,54,.08)}
.thumb{width:42px;height:42px;border-radius:9px;object-fit:cover;background:#EFE4DA}.m-name{font-weight:650;font-size:13px}.m-en{font-size:10px;color:var(--soft);margin-top:2px}.chev{color:var(--soft);font-size:18px}
.quick-actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:15px}.quick{padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);text-align:left}.quick strong{display:block;font-size:13px}.quick span{display:block;font-size:11px;color:var(--soft);margin-top:2px}
.detail-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}.detail-name{font-size:24px;font-weight:700}.detail-en{font-size:10px;color:var(--soft);letter-spacing:.1em;margin-top:2px}
.tabs{display:flex;gap:4px;padding:9px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}.tab{border:0;background:transparent;padding:9px 10px;color:var(--muted);font-size:12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}.tab.active{color:var(--terra-deep);border-color:var(--terra)}
.detail-body{padding:14px 16px 16px;overflow:auto;flex:1}.anatomy-view{position:relative;height:310px;border-radius:14px;border:1px solid var(--line);overflow:hidden;background:linear-gradient(145deg,#FBF8F4,#EEE4DB);margin-bottom:12px}
.anatomy-view img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;transition:transform .3s ease;padding:8px}.anatomy-view:hover img{transform:scale(1.025)}
.image-note{position:absolute;left:10px;bottom:10px;padding:6px 9px;border-radius:8px;background:rgba(255,255,255,.9);color:var(--muted);font-size:10px;border:1px solid rgba(231,224,216,.9)}
.callout{position:absolute;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid #E7C8B5;color:var(--terra-deep);font-size:11px;font-weight:650;box-shadow:0 5px 14px rgba(70,54,43,.08)}
.callout::before{content:"";position:absolute;width:42px;height:1px;background:#D49570;top:50%}.c1{right:11px;top:20%}.c2{right:11px;top:46%}.c3{right:11px;top:72%}.c1::before,.c2::before,.c3::before{right:100%}
.info{display:none}.info.active{display:block}.info-card{padding:11px 12px;border-radius:11px;background:var(--bg);border:1px solid var(--line);font-size:12px;line-height:1.65;margin-bottom:8px}.info-card b{color:var(--terra-deep)}
.detail-foot{display:flex;gap:7px;padding:11px 14px;border-top:1px solid var(--line)}.foot-btn{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:10px;color:var(--muted);cursor:pointer}.foot-btn:hover{background:var(--terra-pale);color:var(--terra-deep)}
.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--soft);line-height:1.8;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(35,28,24,.68);z-index:20;display:none;align-items:center;justify-content:center;padding:28px}.modal.show{display:flex}.modal-card{width:min(1000px,92vw);height:min(720px,88vh);background:var(--panel);border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.28);display:grid;grid-template-rows:58px 1fr}.modal-bar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line)}.modal-title{font-weight:700}.close{width:35px;height:35px;border:1px solid var(--line);border-radius:50%;background:#fff;cursor:pointer}.zoom-canvas{position:relative;overflow:hidden;background:linear-gradient(145deg,#FBF8F4,#EDE3DA);cursor:grab}.zoom-canvas:active{cursor:grabbing}.zoom-canvas img{position:absolute;left:50%;top:50%;width:100%;height:100%;object-fit:contain;padding:18px;transform:translate(-50%,-50%) scale(1);transform-origin:center;user-select:none;pointer-events:none}
.zoom-controls{position:absolute;right:15px;bottom:15px;display:flex;gap:7px}.zoom-controls button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}

.bundle-switcher{display:none;grid-template-columns:repeat(4,1fr);gap:6px;margin:-2px 0 12px}.bundle-switcher.show{display:grid}.bundle-btn{padding:7px 5px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--muted);font-size:11px;cursor:pointer}.bundle-btn:hover,.bundle-btn.active{background:var(--terra-pale);border-color:#E9B89A;color:var(--terra-deep);font-weight:650}
.view-note{position:absolute;right:18px;bottom:18px;color:var(--soft);font-size:11px}
@media(max-width:1050px){.workspace{grid-template-columns:1fr 275px 330px}.brand-sub{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">BodyMap</span><span class="brand-sub">从身体开始，慢慢了解自己</span></div>
    <div class="top-actions" id="viewControls">
      <button class="top-chip active" data-view="front">正面</button>
      <button class="top-chip" data-view="back">背面</button>
      <button class="top-chip" data-view="left">左侧</button>
      <button class="top-chip" data-view="right">右侧</button>
    </div>
  </header>

  <main class="workspace">
    <section class="stage">
      <div class="stage-tools"><button class="tool active">全身</button><button class="tool">上肢</button><button class="tool">躯干</button><button class="tool">下肢</button></div>
      <div class="body-wrap">
        <img class="body-image" id="bodyImage" src="bodymap_assets/正面.png" alt="人体肌肉解剖图正面" />
        <button class="hotspot" id="rightShoulder" style="left:31%;top:23.6%" aria-label="右肩" title="点击右肩"></button>
        <div class="shoulder-guide" id="shoulderGuide" style="left:35%;top:23.6%"><span>点击右肩查看</span></div>
      </div>
      <div class="hint" id="stageHint">先点击右肩，查看这里涉及哪些肌肉</div>
    </section>

    <aside class="region">
      <div class="panel" id="regionPanel">
        <div class="empty" id="regionEmpty">选择人体上的肌肉区域<br/>这里会显示相关肌肉</div>
        <div id="regionContent" style="display:none;height:100%;flex-direction:column">
          <div class="panel-head"><div class="kicker">REGION</div><div class="panel-title">肩部</div><div class="panel-desc">肩部由多块肌肉共同稳定和驱动。点击下方肌肉，右侧会切换到对应的高清解剖图。</div></div>
          <div class="panel-body">
            <div class="section-label">涉及的主要肌肉</div>
            <div class="muscle-list" id="muscleList"></div>
            <div class="section-label" style="margin-top:16px">继续了解</div>
            <div class="quick-actions"><div class="quick"><strong>为什么会疼</strong><span>结合疼痛位置和动作进一步分析</span></div><div class="quick"><strong>可以做什么动作</strong><span>查看放松、激活与训练建议</span></div></div>
          </div>
        </div>
      </div>
    </aside>

    <aside class="detail">
      <div class="panel" id="detailPanel">
        <div class="empty" id="detailEmpty">点击肩部后<br/>选择一块肌肉查看详情</div>
        <div id="detailContent" style="display:none;height:100%;flex-direction:column">
          <div class="detail-head"><div class="detail-name" id="detailName">三角肌</div><div class="detail-en" id="detailEn">DELTOID</div></div>
          <div class="tabs"><button class="tab active" data-tab="structure">结构</button><button class="tab" data-tab="function">功能</button><button class="tab" data-tab="pain">常见问题</button><button class="tab" data-tab="exercise">动作建议</button></div>
          <div class="detail-body">
            <div class="info active" data-pane="structure">
              <div class="anatomy-view" id="anatomyView">
                <img id="detailImage" src="bodymap_assets/三角肌.png" alt="三角肌解剖图" />
                <span class="callout c1">前束</span><span class="callout c2">中束</span><span class="callout c3">后束</span>
                <span class="image-note">点击下方分束按钮查看三角肌不同部分</span>
              </div>
              <div class="bundle-switcher" id="bundleSwitcher">
                <button class="bundle-btn active" data-bundle="whole">整体</button>
                <button class="bundle-btn" data-bundle="front">前束</button>
                <button class="bundle-btn" data-bundle="middle">中束</button>
                <button class="bundle-btn" data-bundle="rear">后束</button>
              </div>
              <div id="structureCards"></div>
            </div>
            <div class="info" data-pane="function"><div id="functionCards"></div></div>
            <div class="info" data-pane="pain"><div id="painCards"></div></div>
            <div class="info" data-pane="exercise"><div id="exerciseCards"></div></div>
          </div>
          <div class="detail-foot"><button class="foot-btn" id="openZoom">放大查看</button><button class="foot-btn">切换后视图</button><button class="foot-btn" id="resetAll">回到全身</button></div>
        </div>
      </div>
    </aside>
  </main>
</div>

<div class="modal" id="zoomModal">
  <div class="modal-card"><div class="modal-bar"><div class="modal-title" id="modalTitle">三角肌 · 高清解剖查看</div><button class="close" id="closeModal">×</button></div><div class="zoom-canvas" id="zoomCanvas"><img id="modalImage" src="bodymap_assets/三角肌.png" alt="放大肌肉解剖图"/><div class="zoom-controls"><button id="zoomOut">−</button><button id="zoomReset">1:1</button><button id="zoomIn">＋</button></div></div></div>
</div>

<script>
const views={
  front:{src:'bodymap_assets/正面.png',alt:'人体肌肉正面',spot:{left:'71%',top:'19.2%'},guide:{left:'76.5%',top:'19.2%'}},
  back:{src:'bodymap_assets/背面.png',alt:'人体肌肉背面',spot:{left:'69%',top:'23.4%'},guide:{left:'73.5%',top:'23.4%'}},
  left:{src:'bodymap_assets/左侧.png',alt:'人体肌肉左侧',spot:null,guide:null},
  right:{src:'bodymap_assets/右侧.png',alt:'人体肌肉右侧',spot:{left:'49%',top:'23.1%'},guide:{left:'56%',top:'23.1%'}}
};
const data={
  shoulder:{name:'肩部总览',en:'SHOULDER OVERVIEW',image:'bodymap_assets/肩部.png',thumb:'bodymap_assets/肩部.png',labels:['肩关节','肩胛区域','上臂'],structure:[['总览','从侧后方观察肩部表层肌肉、肩胛区域及上臂之间的空间关系。'],['使用方式','点击下方具体肌肉，查看被单独标出的解剖图。']],function:[['区域功能','肩部需要多块肌肉协同，完成抬手、旋转和稳定。']],pain:[['提示','同一疼痛位置可能涉及不同组织，图片用于建立空间认知，不用于单独诊断。']],exercise:[['下一步','先选择具体肌肉，再查看对应动作与注意事项。']]},
  deltoid:{name:'三角肌',en:'DELTOID',image:'bodymap_assets/三角肌.png',thumb:'bodymap_assets/三角肌.png',labels:['三角肌','肩峰','肱骨'],bundleImages:{whole:'bodymap_assets/三角肌.png',front:'bodymap_assets/三角肌前束.png',middle:'bodymap_assets/三角肌中束.png',rear:'bodymap_assets/三角肌后束.png'},structure:[['前束','参与屈肩和内旋，让手臂向前抬起。'],['中束','主要负责肩外展，让手臂向侧面抬起。'],['后束','参与伸肩和外旋，让手臂向后展开。']],function:[['主要功能','肩关节外展，并参与肩屈、肩伸与旋转。'],['日常动作','提物、推门、举手和穿衣都会使用三角肌。']],pain:[['常见表现','肩外侧酸痛，抬手或侧举时可能更明显。'],['需要注意','持续剧痛、明显无力或外伤后活动受限，应及时就医。']],exercise:[['放松','轻柔肩部画圈，不要强行顶痛。'],['训练','无痛范围内使用小重量侧平举或弹力带外展。']]},
  infraspinatus:{name:'冈下肌',en:'INFRASPINATUS',image:'bodymap_assets/冈下肌.png',thumb:'bodymap_assets/冈下肌.png',labels:['冈下肌','肩胛骨','肱骨'],structure:[['位置','位于肩胛骨后侧的冈下窝，在三角肌深层可见。'],['关系','属于肩袖肌群，与小圆肌共同参与外旋。']],function:[['主要功能','使肩关节外旋，并稳定肱骨头。']],pain:[['常见表现','肩后侧酸痛，外旋或向后伸手时不适。']],exercise:[['训练','弹力带外旋，保持肩胛骨稳定。']]},
  teres:{name:'小圆肌',en:'TERES MINOR',image:'bodymap_assets/小圆肌.png',thumb:'bodymap_assets/小圆肌.png',labels:['小圆肌','冈下肌','肱骨'],structure:[['位置','位于肩胛骨外侧缘后方，图片以绿色标出。'],['关系','与冈下肌共同参与肩外旋。']],function:[['主要功能','肩外旋及肩关节稳定。']],pain:[['常见表现','肩后外侧不适，投掷或外旋动作时可能更明显。']],exercise:[['训练','轻阻力外旋与肩胛稳定练习。']]},
  pectoralis:{name:'胸大肌上束',en:'CLAVICULAR PECTORALIS MAJOR',image:'bodymap_assets/胸大肌上束.png',thumb:'bodymap_assets/胸大肌上束.png',labels:['胸大肌上束','锁骨','肱骨'],structure:[['位置','起自锁骨内侧区域，向外连接到肱骨，图片以绿色标出。'],['说明','这是胸大肌锁骨部，不是胸小肌。']],function:[['主要功能','协助肩屈、水平内收与内旋。']],pain:[['常见表现','胸前或肩前侧紧张，推举动作时可能不适。']],exercise:[['训练','上斜推举等动作会更多募集胸大肌上束。']]}
};
const order=['shoulder','deltoid','infraspinatus','teres','pectoralis'];
let current='deltoid',zoom=1,currentView='front';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function renderList(){const box=$('#muscleList');box.innerHTML='';order.forEach(k=>{const m=data[k];const b=document.createElement('button');b.className='muscle-item'+(k===current?' active':'');b.innerHTML=`<img class="thumb" src="${m.thumb}" alt="${m.name}"><span><span class="m-name">${m.name}</span><span class="m-en">${m.en}</span></span><span class="chev">›</span>`;b.onclick=()=>selectMuscle(k);box.appendChild(b)})}
function cards(items){return items.map(x=>`<div class="info-card"><b>${x[0]}</b><br>${x[1]}</div>`).join('')}
function setDetailImage(src){const img=$('#detailImage');img.src=src;img.style.transform='';$('#modalImage').src=src}
function selectMuscle(k){current=k;const m=data[k];renderList();$('#detailName').textContent=m.name;$('#detailEn').textContent=m.en;setDetailImage(m.image);$('#detailImage').alt=m.name+'解剖图';$('#modalTitle').textContent=m.name+' · 高清解剖查看';$$('.callout').forEach((e,i)=>{e.textContent=m.labels[i]||'';e.style.display=m.labels[i]?'block':'none'});$('#structureCards').innerHTML=cards(m.structure);$('#functionCards').innerHTML=cards(m.function);$('#painCards').innerHTML=cards(m.pain);$('#exerciseCards').innerHTML=cards(m.exercise);$('#bundleSwitcher').classList.toggle('show',k==='deltoid');$$('.bundle-btn').forEach(x=>x.classList.toggle('active',x.dataset.bundle==='whole'));$('.image-note').textContent=k==='deltoid'?'点击下方分束按钮查看三角肌不同部分':'绿色区域为当前选中的肌肉'}
function activateShoulder(e){const spot=$('#rightShoulder');spot.classList.add('selected');$('#shoulderGuide').classList.add('hide');$('#stageHint').classList.add('hide');$('#regionEmpty').style.display='none';$('#regionContent').style.display='flex';$('#detailEmpty').style.display='none';$('#detailContent').style.display='flex';current='shoulder';renderList();selectMuscle('shoulder')}
function setView(view){currentView=view;const cfg=views[view];$('#bodyImage').src=cfg.src;$('#bodyImage').alt=cfg.alt;$$('#viewControls .top-chip').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const spot=$('#rightShoulder');const guide=$('#shoulderGuide');if(cfg.spot){spot.style.display='block';spot.style.left=cfg.spot.left;spot.style.top=cfg.spot.top;guide.style.display='flex';guide.style.left=cfg.guide.left;guide.style.top=cfg.guide.top}else{spot.style.display='none';guide.style.display='none'}}
$$('#viewControls .top-chip').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#rightShoulder').addEventListener('click',activateShoulder);
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===t));$$('.info').forEach(x=>x.classList.toggle('active',x.dataset.pane===t.dataset.tab))});
$$('.bundle-btn').forEach(b=>b.onclick=()=>{if(current!=='deltoid')return;$$('.bundle-btn').forEach(x=>x.classList.toggle('active',x===b));setDetailImage(data.deltoid.bundleImages[b.dataset.bundle])});
$('#resetAll').onclick=()=>{$('#rightShoulder').classList.remove('selected');$('#shoulderGuide').classList.remove('hide');$('#stageHint').classList.remove('hide');$('#regionContent').style.display='none';$('#detailContent').style.display='none';$('#regionEmpty').style.display='flex';$('#detailEmpty').style.display='flex'};
$('#openZoom').onclick=()=>{$('#zoomModal').classList.add('show');zoom=1;applyZoom()};$('#closeModal').onclick=()=>$('#zoomModal').classList.remove('show');$('#zoomModal').onclick=e=>{if(e.target===$('#zoomModal'))$('#zoomModal').classList.remove('show')};
function applyZoom(){$('#modalImage').style.transform=`translate(-50%,-50%) scale(${zoom})`}
$('#zoomIn').onclick=()=>{zoom=Math.min(zoom+.25,4);applyZoom()};$('#zoomOut').onclick=()=>{zoom=Math.max(zoom-.25,.5);applyZoom()};$('#zoomReset').onclick=()=>{zoom=1;applyZoom()};
renderList();selectMuscle('deltoid');setView('front');
</script>
</body>
</html>
