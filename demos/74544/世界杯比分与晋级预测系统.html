<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智胜绿茵 - 2026 FIFA World Cup AI 预测系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #080c14;
            --bg-secondary: #0f1623;
            --bg-card: #141b2d;
            --bg-hover: #1a2340;
            --accent-green: #00d084;
            --accent-gold: #ffd700;
            --accent-red: #ff4757;
            --text-primary: #e8ecf1;
            --text-secondary: #8b92a8;
            --border-color: #1e2746;
            --gradient-main: linear-gradient(135deg, #00d084 0%, #00a8cc 100%);
            --gradient-gold: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
            --shadow-glow: 0 0 20px rgba(0, 208, 132, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent-green);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(8,12,20,0.95) 0%, rgba(15,22,35,0.9) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
            position: sticky;
            top: 0;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient-main);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: var(--shadow-glow);
        }

        .logo-text h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .nav-tab {
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .nav-tab.active {
            color: var(--accent-green);
            border-color: var(--accent-green);
            background: rgba(0, 208, 132, 0.1);
        }

        /* Main Content */
        main {
            position: relative;
            z-index: 5;
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero Stats */
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-main);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-green);
            box-shadow: var(--shadow-glow);
        }

        .stat-number {
            font-family: 'Orbitron', monospace;
            font-size: 36px;
            font-weight: 700;
            color: var(--accent-green);
            margin: 10px 0;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Live Matches */
        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 71, 87, 0.15);
            color: var(--accent-red);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: 'Noto Sans SC', sans-serif;
            letter-spacing: 0;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            border-color: var(--accent-green);
            transform: translateY(-3px);
        }

        .match-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .team-flag {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
        }

        .team-name {
            font-weight: 700;
            font-size: 15px;
        }

        .score-display {
            font-family: 'Orbitron', monospace;
            font-size: 32px;
            font-weight: 700;
            padding: 0 20px;
            text-align: center;
        }

        .score-live {
            color: var(--accent-green);
        }

        .score-finished {
            color: var(--text-primary);
        }

        .match-info {
            text-align: center;
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .prediction-bar {
            margin-top: 16px;
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
            display: flex;
        }

        .prediction-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        .prediction-home { background: var(--accent-green); }
        .prediction-draw { background: var(--text-secondary); }
        .prediction-away { background: var(--accent-gold); }

        .prediction-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Group Standings */
        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .group-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .group-header {
            background: var(--bg-secondary);
            padding: 16px 20px;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-header span {
            color: var(--accent-green);
            font-family: 'Orbitron', monospace;
            font-size: 14px;
        }

        .standings-table {
            width: 100%;
            border-collapse: collapse;
        }

        .standings-table th {
            padding: 10px 8px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .standings-table td {
            padding: 12px 8px;
            font-size: 13px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .standings-table tr:last-child td {
            border-bottom: none;
        }

        .standings-table .team-cell {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 16px;
        }

        .standings-table .team-cell .flag {
            font-size: 20px;
        }

        .qualified { color: var(--accent-green); font-weight: 700; }
        .eliminated { color: var(--text-secondary); }
        .third-chance { color: var(--accent-gold); }

        /* Bracket */
        .bracket-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            overflow-x: auto;
        }

        .bracket {
            display: flex;
            justify-content: space-between;
            min-width: 900px;
            gap: 30px;
        }

        .bracket-round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            flex: 1;
            gap: 16px;
        }

        .bracket-round-title {
            text-align: center;
            font-size: 14px;
            color: var(--accent-green);
            font-weight: 700;
            margin-bottom: 10px;
            font-family: 'Orbitron', monospace;
        }

        .bracket-match {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .bracket-team {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .bracket-team.winner {
            color: var(--accent-green);
            font-weight: 700;
        }

        .bracket-team .flag {
            font-size: 18px;
            margin-right: 6px;
        }

        /* Simulator */
        .simulator-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
        }

        .simulator-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .sim-input-group {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .sim-input-group label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .score-inputs {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-inputs input {
            width: 60px;
            padding: 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            text-align: center;
            font-size: 18px;
            font-family: 'Orbitron', monospace;
        }

        .score-inputs input:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .score-inputs .vs {
            color: var(--text-secondary);
            font-weight: 700;
        }

        .btn-primary {
            background: var(--gradient-main);
            color: #000;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans SC', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }

        .simulation-result {
            margin-top: 30px;
            padding: 24px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border-left: 4px solid var(--accent-green);
            display: none;
        }

        .simulation-result.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Team Analysis */
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .team-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .team-card:hover {
            border-color: var(--accent-green);
            transform: translateY(-3px);
        }

        .team-card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .team-card-header .flag {
            font-size: 40px;
        }

        .team-card-header h3 {
            font-size: 18px;
        }

        .team-card-header .rank {
            margin-left: auto;
            background: var(--gradient-gold);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .radar-chart {
            width: 100%;
            height: 200px;
            margin-top: 16px;
        }

        .team-stats-row {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .team-stat {
            text-align: center;
        }

        .team-stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            color: var(--accent-green);
            font-weight: 700;
        }

        .team-stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }

        footer a {
            color: var(--accent-green);
            text-decoration: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-green);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .header-content {
                flex-direction: column;
                gap: 16px;
            }
            .nav-tabs {
                flex-wrap: wrap;
                justify-content: center;
            }
            .matches-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <header>
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">⚽</div>
                <div class="logo-text">
                    <h1>智胜绿茵</h1>
                    <p>2026 FIFA WORLD CUP AI PREDICTION SYSTEM</p>
                </div>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" onclick="showSection('live')">实时比分</button>
                <button class="nav-tab" onclick="showSection('groups')">小组积分</button>
                <button class="nav-tab" onclick="showSection('bracket')">淘汰对阵</button>
                <button class="nav-tab" onclick="showSection('simulator')">预测模拟</button>
                <button class="nav-tab" onclick="showSection('teams')">球队分析</button>
            </nav>
        </div>
    </header>

    <main>
        <!-- Hero Stats -->
        <div class="hero-stats">
            <div class="stat-card">
                <div class="stat-label">参赛球队</div>
                <div class="stat-number">48</div>
                <div class="stat-label">支国家队</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总比赛场次</div>
                <div class="stat-number">104</div>
                <div class="stat-label">场精彩对决</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">已完赛</div>
                <div class="stat-number">72</div>
                <div class="stat-label">场</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">预测准确率</div>
                <div class="stat-number">87%</div>
                <div class="stat-label">AI模型</div>
            </div>
        </div>

        <!-- Live Matches Section -->
        <section id="live" class="section active">
            <h2 class="section-title">
                实时比分
                <span class="live-indicator">
                    <span class="live-dot"></span>
                    LIVE
                </span>
            </h2>
            <div class="matches-grid" id="liveMatches"></div>
        </section>

        <!-- Groups Section -->
        <section id="groups" class="section">
            <h2 class="section-title">小组赛积分榜</h2>
            <div class="groups-grid" id="groupsGrid"></div>
        </section>

        <!-- Bracket Section -->
        <section id="bracket" class="section">
            <h2 class="section-title">淘汰赛晋级路径</h2>
            <div class="bracket-container">
                <div class="bracket" id="bracket"></div>
            </div>
        </section>

        <!-- Simulator Section -->
        <section id="simulator" class="section">
            <h2 class="section-title">比分预测模拟器</h2>
            <div class="simulator-container">
                <p style="color: var(--text-secondary); margin-bottom: 20px;">输入假设比分，AI将实时计算各队出线概率和晋级形势。</p>
                <div class="simulator-inputs" id="simInputs"></div>
                <button class="btn-primary" onclick="runSimulation()">运行AI预测分析</button>
                <div class="simulation-result" id="simResult"></div>
            </div>
        </section>

        <!-- Teams Section -->
        <section id="teams" class="section">
            <h2 class="section-title">球队实力分析</h2>
            <div class="teams-grid" id="teamsGrid"></div>
        </section>
    </main>

    <footer>
        <p>智胜绿茵 - 2026 FIFA World Cup AI 预测系统 | Powered by TRAE Work</p>
        <p style="margin-top: 8px;">本系统仅供娱乐和数据分析参考，预测结果基于历史数据和AI模型，不构成任何投注建议</p>
    </footer>

    <script>
        // Generate particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (10 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Tab switching
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            event.target.classList.add('active');
        }

        // Data
        const groups = [
            { name: 'A组', teams: [
                { name: '德国', flag: '🇩🇪', pts: 7, w: 2, d: 1, l: 0, gf: 6, ga: 2 },
                { name: '苏格兰', flag: '🏴󠁧󠁢󠁳󠁣󠁴󠁿', pts: 4, w: 1, d: 1, l: 1, gf: 3, ga: 3 },
                { name: '匈牙利', flag: '🇭🇺', pts: 3, w: 1, d: 0, l: 2, gf: 2, ga: 4 },
                { name: '瑞士', flag: '🇨🇭', pts: 1, w: 0, d: 1, l: 2, gf: 2, ga: 4 }
            ]},
            { name: 'B组', teams: [
                { name: '西班牙', flag: '🇪🇸', pts: 9, w: 3, d: 0, l: 0, gf: 8, ga: 1 },
                { name: '意大利', flag: '🇮🇹', pts: 4, w: 1, d: 1, l: 1, gf: 3, ga: 3 },
                { name: '克罗地亚', flag: '🇭🇷', pts: 2, w: 0, d: 2, l: 1, gf: 3, ga: 4 },
                { name: '阿尔巴尼亚', flag: '🇦🇱', pts: 1, w: 0, d: 1, l: 2, gf: 1, ga: 7 }
            ]},
            { name: 'C组', teams: [
                { name: '英格兰', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', pts: 5, w: 1, d: 2, l: 0, gf: 3, ga: 1 },
                { name: '丹麦', flag: '🇩🇰', pts: 3, w: 0, d: 3, l: 0, gf: 2, ga: 2 },

        // Draw radar chart
        function drawRadar(canvas, data) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width = 300;
            const h = canvas.height = 200;
            const cx = w / 2;
            const cy = h / 2 + 10;
            const r = 70;
            const labels = ['进攻', '防守', '中场', '速度', '配合', '状态'];
            const values = [data.attack, data.defense, data.midfield, data.speed, data.teamwork, data.form];
            const max = 100;

            ctx.clearRect(0, 0, w, h);

            // Draw grid
            for (let i = 1; i <= 5; i++) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.lineWidth = 1;
                for (let j = 0; j < 6; j++) {
                    const angle = (Math.PI * 2 / 6) * j - Math.PI / 2;
                    const x = cx + Math.cos(angle) * (r * i / 5);
                    const y = cy + Math.sin(angle) * (r * i / 5);
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // Draw axes
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const x = cx + Math.cos(angle) * r;
                const y = cy + Math.sin(angle) * r;
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.moveTo(cx, cy);
                ctx.lineTo(x, y);
                ctx.stroke();

                // Labels
                const lx = cx + Math.cos(angle) * (r + 20);
                const ly = cy + Math.sin(angle) * (r + 20);
                ctx.fillStyle = '#8b92a8';
                ctx.font = '11px Noto Sans SC';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(labels[i], lx, ly);
            }

            // Draw data
            ctx.beginPath();
            ctx.fillStyle = 'rgba(0, 208, 132, 0.3)';
            ctx.strokeStyle = '#00d084';
            ctx.lineWidth = 2;
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const val = values[i] / max;
                const x = cx + Math.cos(angle) * (r * val);
                const y = cy + Math.sin(angle) * (r * val);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Points
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const val = values[i] / max;
                const x = cx + Math.cos(angle) * (r * val);
                const y = cy + Math.sin(angle) * (r * val);
                ctx.beginPath();
                ctx.fillStyle = '#00d084';
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
