<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流光序章 — Lumina Prologue</title>
<style>
/* ============ 全局重置 ============ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a12; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #e0e0ff; user-select: none; -webkit-user-select: none; }

/* ============ 画布 ============ */
canvas#mainCanvas { position: fixed; inset: 0; z-index: 0; display: block; }

/* ============ 通用屏幕层 ============ */
.screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease, transform 0.6s ease; }
.screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.96); }
.screen.visible { opacity: 1; pointer-events: auto; transform: scale(1); }

/* ============ 开始屏幕 ============ */
#startScreen { background: rgba(6, 6, 16, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
#startScreen h1 { font-size: clamp(48px, 8vw, 96px); font-weight: 300; letter-spacing: 0.15em; margin-bottom: 12px; background: linear-gradient(135deg, #7B68EE, #00BFFF, #FF69B4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: none; }
#startScreen .subtitle { font-size: clamp(14px, 2vw, 20px); color: rgba(224, 224, 255, 0.6); margin-bottom: 48px; letter-spacing: 0.3em; }
.start-buttons { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.mode-btn { padding: 16px 48px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 60px; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #e0e0ff; font-size: 20px; font-weight: 400; letter-spacing: 0.15em; cursor: pointer; transition: all 0.3s ease; outline: none; }
.mode-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.35); box-shadow: 0 0 30px rgba(123, 104, 238, 0.3), inset 0 0 20px rgba(123, 104, 238, 0.1); transform: translateY(-2px); }
.mode-btn:active { transform: translateY(0); }
.mode-btn.primary { background: linear-gradient(135deg, rgba(123, 104, 238, 0.25), rgba(0, 191, 255, 0.2)); border-color: rgba(123, 104, 238, 0.4); }
.mode-btn.primary:hover { background: linear-gradient(135deg, rgba(123, 104, 238, 0.4), rgba(0, 191, 255, 0.3)); box-shadow: 0 0 40px rgba(123, 104, 238, 0.4), inset 0 0 25px rgba(123, 104, 238, 0.15); }

/* ============ 自由模式 UI ============ */
#freeModeUI { position: fixed; top: 0; left: 0; right: 0; z-index: 5; height: 56px; display: flex; align-items: center; padding: 0 20px; background: rgba(10, 10, 18, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); transition: opacity 0.5s; }
#freeModeUI.hidden { opacity: 0; pointer-events: none; }
#freeModeUI .nav-left { display: flex; align-items: center; gap: 16px; }
#freeModeUI .nav-left h2 { font-size: 18px; font-weight: 300; letter-spacing: 0.1em; color: rgba(224,224,255,0.8); }
#freeModeUI .nav-center { flex: 1; display: flex; justify-content: center; gap: 12px; }
#freeModeUI .nav-right { display: flex; align-items: center; gap: 10px; }
.theme-btn, .mood-btn, .action-btn { padding: 6px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; background: rgba(255,255,255,0.05); color: rgba(224,224,255,0.7); font-size: 13px; cursor: pointer; transition: all 0.25s; outline: none; white-space: nowrap; }
.theme-btn:hover, .mood-btn:hover, .action-btn:hover { background: rgba(255,255,255,0.12); color: #e0e0ff; }
.theme-btn.active { border-color: rgba(123,104,238,0.5); background: rgba(123,104,238,0.15); color: #e0e0ff; }

/* ============ 侧边参数面板 ============ */
#sidePanel { position: fixed; top: 56px; right: 0; z-index: 5; width: 260px; height: calc(100% - 56px); background: rgba(10, 10, 18, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-left: 1px solid rgba(255,255,255,0.06); padding: 20px; transition: transform 0.4s ease; overflow-y: auto; }
#sidePanel.hidden { transform: translateX(100%); pointer-events: none; }
#sidePanel h3 { font-size: 14px; font-weight: 400; color: rgba(224,224,255,0.5); margin-bottom: 16px; letter-spacing: 0.1em; }
.param-group { margin-bottom: 20px; }
.param-group label { display: block; font-size: 12px; color: rgba(224,224,255,0.5); margin-bottom: 6px; }
.param-group input[type=range] { width: 100%; accent-color: #7B68EE; }
.param-group .value { font-size: 12px; color: rgba(224,224,255,0.4); float: right; margin-top: -18px; }
.mood-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mood-btn-small { padding: 8px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; background: rgba(255,255,255,0.04); color: rgba(224,224,255,0.6); font-size: 12px; cursor: pointer; transition: all 0.25s; text-align: center; }
.mood-btn-small:hover { background: rgba(255,255,255,0.1); color: #e0e0ff; }

/* ============ 治愈消息 ============ */
#healingMsg { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 6; padding: 12px 32px; border-radius: 30px; background: rgba(10,10,18,0.5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); font-size: 16px; color: rgba(224,224,255,0.8); letter-spacing: 0.1em; opacity: 0; transition: opacity 0.8s; pointer-events: none; }
#healingMsg.show { opacity: 1; }

/* ============ 挑战模式 UI ============ */
#challengeUI { position: fixed; top: 0; left: 0; right: 0; z-index: 5; transition: opacity 0.5s; pointer-events: none; }
#challengeUI.hidden { opacity: 0; }
#timerBarWrap { width: 100%; height: 4px; background: rgba(255,255,255,0.08); }
#timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, #00FF7F, #7B68EE, #FF69B4); transition: width 0.1s linear; border-radius: 0 2px 2px 0; }
#timerBar.warn { background: linear-gradient(90deg, #FFD700, #FF6347); }
#timerBar.danger { background: #FF4500; animation: timerPulse 0.5s infinite; }
@keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
#scoreDisplay { position: fixed; top: 20px; right: 24px; z-index: 6; font-size: 36px; font-weight: 300; letter-spacing: 0.05em; color: #FFD700; text-shadow: 0 0 20px rgba(255,215,0,0.5), 0 0 40px rgba(255,215,0,0.2); transition: transform 0.15s; pointer-events: none; }
#scoreDisplay.bump { transform: scale(1.15); }
#timeText { position: fixed; top: 20px; left: 24px; z-index: 6; font-size: 20px; font-weight: 300; color: rgba(224,224,255,0.7); pointer-events: none; }

/* ============ 连击显示 ============ */
#comboDisplay { position: fixed; top: 35%; left: 50%; transform: translate(-50%, -50%); z-index: 7; font-size: 48px; font-weight: 700; letter-spacing: 0.08em; color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,0.6); opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; }
#comboDisplay.show { opacity: 1; animation: comboIn 0.4s ease-out; }
@keyframes comboIn { 0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0; } 60% { transform: translate(-50%,-50%) scale(1.15); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; } }

/* ============ 浮动分数 ============ */
#floatingScores { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
.float-score { position: absolute; font-size: 24px; font-weight: 700; color: #FFD700; text-shadow: 0 0 10px rgba(255,215,0,0.6); pointer-events: none; animation: floatUp 1s ease-out forwards; }
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(0.7); } }

/* ============ 结束屏幕 ============ */
#endScreen { background: rgba(6, 6, 16, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
#endScreen h2 { font-size: clamp(32px, 5vw, 56px); font-weight: 300; letter-spacing: 0.15em; margin-bottom: 32px; color: #FFD700; }
#endScreen .final-label { font-size: 14px; color: rgba(224,224,255,0.5); letter-spacing: 0.2em; margin-bottom: 8px; }
#finalScore { font-size: clamp(48px, 8vw, 80px); font-weight: 300; color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,0.4); margin-bottom: 16px; }
#bestScore { font-size: 16px; color: rgba(224,224,255,0.5); margin-bottom: 48px; }
#bestScore span { color: #FFD700; }
.end-buttons { display: flex; gap: 20px; }

/* ============ 倒计时 ============ */
#countdown { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(6,6,16,0.6); pointer-events: none; opacity: 0; transition: opacity 0.3s; }
#countdown.show { opacity: 1; }
#countdown .num { font-size: 120px; font-weight: 100; color: #e0e0ff; animation: countPulse 0.8s ease-out; }
@keyframes countPulse { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.6; } }
</style>
</head>
<body>

<!-- 主画布 -->
<canvas id="mainCanvas"></canvas>

<!-- 开始屏幕 -->
<div id="startScreen" class="screen visible">
    <h1>流光序章</h1>
    <p class="subtitle">鼠标互动式沉浸粒子光影</p>
    <div class="start-buttons">
        <button class="mode-btn primary" id="freeModeBtn">自由模式</button>
        <button class="mode-btn" id="challengeModeBtn">挑战模式</button>
    </div>
</div>

<!-- 自由模式 UI -->
<nav id="freeModeUI" class="hidden">
    <div class="nav-left">
        <button class="action-btn" id="backToStartFree">返回</button>
        <h2>流光序章</h2>
    </div>
    <div class="nav-center">
        <button class="theme-btn active" data-theme="starsky">星空</button>
        <button class="theme-btn" data-theme="deepsea">深海</button>
        <button class="theme-btn" data-theme="aurora">极光</button>
        <button class="theme-btn" data-theme="sunset">落日</button>
    </div>
    <div class="nav-right">
        <button class="action-btn" id="togglePanel">参数</button>
        <button class="action-btn" id="fullscreenBtn">全屏(F)</button>
    </div>
</nav>

<!-- 侧边参数面板 -->
<div id="sidePanel" class="hidden">
    <h3>粒子参数</h3>
    <div class="param-group">
        <label>粒子数量 <span class="value" id="countVal">300</span></label>
        <input type="range" id="particleCount" min="50" max="800" value="300" step="10">
    </div>
    <div class="param-group">
        <label>粒子大小 <span class="value" id="sizeVal">3</span></label>
        <input type="range" id="particleSize" min="1" max="8" value="3" step="0.5">
    </div>
    <div class="param-group">
        <label>吸引力强度 <span class="value" id="attractVal">50</span></label>
        <input type="range" id="attractStrength" min="10" max="200" value="50" step="5">
    </div>
    <div class="param-group">
        <label>拖尾长度 <span class="value" id="trailVal">0.08</span></label>
        <input type="range" id="trailLength" min="0.02" max="0.2" value="0.08" step="0.01">
    </div>
    <h3 style="margin-top:8px">心情治愈</h3>
    <div class="mood-grid">
        <button class="mood-btn-small" data-mood="happy">开心</button>
        <button class="mood-btn-small" data-mood="anxious">焦虑</button>
        <button class="mood-btn-small" data-mood="tired">疲惫</button>
        <button class="mood-btn-small" data-mood="calm">平静</button>
    </div>
</div>

<!-- 治愈消息 -->
<div id="healingMsg"></div>

<!-- 挑战模式 UI -->
<div id="challengeUI" class="hidden">
    <div id="timerBarWrap"><div id="timerBar"></div></div>
</div>
<div id="scoreDisplay">0</div>
<div id="timeText">60</div>
<div id="comboDisplay"></div>
<div id="floatingScores"></div>

<!-- 倒计时 -->
<div id="countdown"><div class="num" id="countdownNum"></div></div>

<!-- 结束屏幕 -->
<div id="endScreen" class="screen hidden">
    <h2>时间到!</h2>
    <div class="final-label">最终得分</div>
    <div id="finalScore">0</div>
    <div id="bestScore">最高记录: <span>0</span></div>
    <div class="end-buttons">
        <button class="mode-btn primary" id="retryBtn">再来一次</button>
        <button class="mode-btn" id="backBtn">返回主页</button>
    </div>
</div>

<script>
// ================================================================
// ============ 配置 ============
// ================================================================
const THEMES = {
    starsky:  ['#7B68EE', '#9370DB', '#6A5ACD', '#4169E1', '#00BFFF', '#E0E0FF'],
    deepsea:  ['#00CED1', '#20B2AA', '#008B8B', '#5F9EA0', '#00FA9A', '#E0FFFF'],
    aurora:   ['#00FF7F', '#7CFC00', '#FF69B4', '#FF1493', '#98FB98', '#E0FFE0'],
    sunset:   ['#FFD700', '#FFA500', '#FF6347', '#FF4500', '#FFB347', '#FFFACD']
};

const MOODS = {
    happy:   ['#FFD700', '#FFA500', '#FF6347', '#FFEB3B', '#FF9800'],
    anxious: ['#4FC3F7', '#81D4FA', '#B3E5FC', '#E1F5FE', '#80DEEA'],
    tired:   ['#CE93D8', '#BA68C8', '#AB47BC', '#E1BEE7', '#9C27B0'],
    calm:    ['#A5D6A7', '#81C784', '#66BB6A', '#C8E6C9', '#4CAF50']
};

const HEALING_MSGS = {
    happy:   ['今天的你，闪闪发光', '快乐是会传染的哦', '保持这份好心情吧', '你的笑容很温暖', '世界因为你而更亮了一些', '今天的阳光刚刚好，你也是'],
    anxious: ['深呼吸，一切都会好的', '慢慢来，不着急', '你已经做得很好了', '此刻的焦虑终将过去', '允许自己停下来，也是一种勇敢', '你比想象中更强大'],
    tired:   ['休息一下吧，你值得', '今天的辛苦，明天会变成力量', '累了就停下来看看光', '给自己一个温暖的拥抱', '不必时时坚强，休息也是一种力量', '闭上眼睛，世界依然美好'],
    calm:    ['此刻的宁静，很珍贵', '安静的你，自有力量', '享受这份平和吧', '内心的平静是最好的礼物', '此刻的你，刚刚好', '安静中自有星辰大海']
};

// 默认参数
const DEFAULTS = {
    particleCount: 300,
    particleSize: 3,
    attractStrength: 50,
    trailAlpha: 0.08,
    theme: 'starsky'
};

// ================================================================
// ============ 工具函数 ============
// ================================================================
function hexToRgba(hex, a) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpColor(c1, c2, t) {
    const r1 = parseInt(c1.slice(1,3),16), g1 = parseInt(c1.slice(3,5),16), b1 = parseInt(c1.slice(5,7),16);
    const r2 = parseInt(c2.slice(1,3),16), g2 = parseInt(c2.slice(3,5),16), b2 = parseInt(c2.slice(5,7),16);
    const r = Math.round(lerp(r1,r2,t)), g = Math.round(lerp(g1,g2,t)), b = Math.round(lerp(b1,b2,t));
    return '#' + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}

function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

// ================================================================
// ============ 辉光精灵缓存 ============
// ================================================================
const glowCache = {};

// 创建辉光精灵（离屏预渲染）
function createGlowSprite(color, radius) {
    var size = Math.ceil(radius * 2);
    if (size <= 0) return null;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var gctx = c.getContext('2d');
    var r = size / 2;
    var grad = gctx.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, color);
    grad.addColorStop(0.35, hexToRgba(color, 0.5));
    grad.addColorStop(0.7, hexToRgba(color, 0.15));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    gctx.fillStyle = grad;
    gctx.fillRect(0, 0, size, size);
    return c;
}

// 为指定调色板批量构建精灵缓存
function buildGlowCache(palette) {
    var seen = {};
    for (var ci = 0; ci < palette.length; ci++) {
        var c = palette[ci];
        if (!seen[c]) {
            seen[c] = true;
            glowCache[c + '_sm'] = createGlowSprite(c, 16);
            glowCache[c + '_md'] = createGlowSprite(c, 32);
            glowCache[c + '_lg'] = createGlowSprite(c, 64);
            glowCache[c + '_xl'] = createGlowSprite(c, 96);
        }
    }
}

// ================================================================
// ============ 画布初始化 ============
// ================================================================
var canvas = document.getElementById('mainCanvas');
var ctx = canvas.getContext('2d', { alpha: false });
var W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ================================================================
// ============ 游戏状态 ============
// ================================================================
var gameState = 'start'; // 'start' | 'free' | 'countdown' | 'challenge' | 'end'
var currentTheme = 'starsky';
var currentPalette = THEMES.starsky.slice();
var moodColors = null;

// 参数
var params = {
    particleCount: DEFAULTS.particleCount,
    particleSize: DEFAULTS.particleSize,
    attractStrength: DEFAULTS.attractStrength,
    trailAlpha: DEFAULTS.trailAlpha
};

// 挑战模式状态
var score = 0;
var bestScore = parseInt(localStorage.getItem('lumina_best') || '0');
var combo = 0;
var lastCatchTime = 0;
var comboTimeout = null;
var gameTimer = 60;
var gameStartTime = 0;
var gameActive = false;

// 鼠标状态
var mouse = { x: W / 2, y: H / 2, px: W / 2, py: H / 2, active: false, down: false, hoverTime: 0, moved: false };

// ================================================================
// ============ 粒子系统（对象池） ============
// ================================================================
var MAX_PARTICLES = 800;
var particlePool = new Array(MAX_PARTICLES);
var particleActive = 0;

function createParticle() {
    return { x:0, y:0, vx:0, vy:0, size:0, alpha:0, colorIndex:0, baseSize:0, life:1, maxLife:1 };
}

function resetParticle(p, palette) {
    p.x = rand(0, W);
    p.y = rand(0, H);
    p.vx = rand(-0.3, 0.3);
    p.vy = rand(-0.3, 0.3);
    p.baseSize = rand(params.particleSize * 0.5, params.particleSize * 1.5);
    p.size = p.baseSize;
    p.alpha = rand(0.4, 1);
    p.colorIndex = randInt(0, palette.length - 1);
    p.life = rand(200, 600);
    p.maxLife = p.life;
}

function initParticles() {
    for (var i = 0; i < MAX_PARTICLES; i++) particlePool[i] = createParticle();
    particleActive = Math.min(params.particleCount, MAX_PARTICLES);
    for (var i = 0; i < particleActive; i++) resetParticle(particlePool[i], currentPalette);
}

function setParticleCount(count) {
    count = Math.min(count, MAX_PARTICLES);
    var palette = moodColors || currentPalette;
    while (particleActive < count) {
        resetParticle(particlePool[particleActive], palette);
        particleActive++;
    }
    if (count < particleActive) particleActive = count;
    params.particleCount = count;
}

function updateParticles() {
    var attractStr = params.attractStrength;
    var palette = moodColors || currentPalette;
    var doMouseInteract = (gameState === 'free' || gameState === 'start');
    var doVortex = doMouseInteract && mouse.hoverTime > 300;

    for (var i = 0; i < particleActive; i++) {
        var p = particlePool[i];
        p.life--;

        // 鼠标交互
        if (doMouseInteract && mouse.active) {
            var dx = mouse.x - p.x;
            var dy = mouse.y - p.y;
            var distSq = dx * dx + dy * dy;
            var range = 180;
            var rangeSq = range * range;

            if (distSq < rangeSq && distSq > 1) {
                var dist = Math.sqrt(distSq);
                var force = (range - dist) / range * attractStr * 0.001;
                p.vx += dx / dist * force;
                p.vy += dy / dist * force;

                // 鼠标悬停涡旋效果
                if (doVortex) {
                    var ang = Math.atan2(dy, dx) + 1.5708; // PI/2
                    p.vx += Math.cos(ang) * 0.15;
                    p.vy += Math.sin(ang) * 0.15;
                }
            }
        }

        // 阻尼
        p.vx *= 0.98;
        p.vy *= 0.98;
        p.x += p.vx;
        p.y += p.vy;

        // 边界环绕
        if (p.x < -20) p.x = W + 20;
        else if (p.x > W + 20) p.x = -20;
        if (p.y < -20) p.y = H + 20;
        else if (p.y > H + 20) p.y = -20;

        // 大小脉动
        p.size = p.baseSize * (0.8 + 0.2 * Math.sin(p.life * 0.03));

        // 淡入淡出
        var lifeRatio = p.life / p.maxLife;
        if (lifeRatio < 0.1) p.alpha = lifeRatio * 10;
        else if (lifeRatio > 0.9) p.alpha = (1 - lifeRatio) * 10;

        // 生命到期则重置
        if (p.life <= 0) resetParticle(p, palette);
    }
}

function drawParticles() {
    var palette = moodColors || currentPalette;
    ctx.globalCompositeOperation = 'lighter';

    for (var i = 0; i < particleActive; i++) {
        var p = particlePool[i];
        var color = palette[p.colorIndex % palette.length];
        var glowSize = Math.max(p.size * 5, 8);
        var drawSize = glowSize * 2;

        // 根据大小选择精灵
        var sprite;
        if (glowSize <= 16) sprite = glowCache[color + '_sm'];
        else if (glowSize <= 32) sprite = glowCache[color + '_md'];
        else if (glowSize <= 64) sprite = glowCache[color + '_lg'];
        else sprite = glowCache[color + '_xl'];

        if (sprite) {
            ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha * 0.6));
            ctx.drawImage(sprite, p.x - glowSize, p.y - glowSize, drawSize, drawSize);
        }

        // 中心亮点
        ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.5, p.size * 0.4), 0, 6.2832);
        ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
}

// ================================================================
// ============ 烟花系统（对象池，无 splice） ============
// ================================================================
var MAX_FIREWORKS = 300;
var fireworkPool = new Array(MAX_FIREWORKS);
var fireworkActive = 0;

function createFirework() {
    return { x:0, y:0, vx:0, vy:0, size:0, alpha:1, colorIndex:0, life:0, maxLife:40 };
}

for (var i = 0; i < MAX_FIREWORKS; i++) fireworkPool[i] = createFirework();

function spawnFirework(x, y, count, palette) {
    palette = palette || currentPalette;
    for (var i = 0; i < count && fireworkActive < MAX_FIREWORKS; i++) {
        var f = fireworkPool[fireworkActive];
        var angle = rand(0, 6.2832);
        var speed = rand(1.5, 5);
        f.x = x;
        f.y = y;
        f.vx = Math.cos(angle) * speed;
        f.vy = Math.sin(angle) * speed;
        f.size = rand(1, 3);
        f.alpha = 1;
        f.colorIndex = randInt(0, palette.length - 1);
        f.life = randInt(25, 50);
        f.maxLife = f.life;
        fireworkActive++;
    }
}

function updateFireworks() {
    var writeIdx = 0;
    for (var i = 0; i < fireworkActive; i++) {
        var f = fireworkPool[i];
        f.vy += 0.02;
        f.x += f.vx;
        f.y += f.vy;
        f.vx *= 0.97;
        f.vy *= 0.97;
        f.life--;
        f.alpha = f.life / f.maxLife;
        if (f.life > 0) {
            if (writeIdx !== i) fireworkPool[writeIdx] = f;
            writeIdx++;
        }
    }
    fireworkActive = writeIdx;
}

function drawFireworks() {
    var palette = moodColors || currentPalette;
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < fireworkActive; i++) {
        var f = fireworkPool[i];
        var color = palette[f.colorIndex % palette.length];
        var r = f.size * 5;
        var drawSize = r * 2;
        var sprite = glowCache[color + '_sm'] || glowCache[color + '_md'];
        if (sprite) {
            ctx.globalAlpha = Math.max(0, f.alpha * 0.7);
            ctx.drawImage(sprite, f.x - r, f.y - r, drawSize, drawSize);
        }
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
}

// ================================================================
// ============ 涟漪系统 ============
// ================================================================
var MAX_RIPPLES = 30;
var ripplePool = new Array(MAX_RIPPLES);
var rippleActive = 0;

function createRipple() {
    return { x:0, y:0, radius:0, maxRadius:120, alpha:0.6, lineWidth:2, color:'#7B68EE' };
}
for (var i = 0; i < MAX_RIPPLES; i++) ripplePool[i] = createRipple();

function spawnRipple(x, y) {
    if (rippleActive >= MAX_RIPPLES) return;
    var r = ripplePool[rippleActive];
    var palette = moodColors || currentPalette;
    r.x = x; r.y = y; r.radius = 0;
    r.maxRadius = rand(80, 160);
    r.alpha = 0.6;
    r.lineWidth = rand(1.5, 3);
    r.color = palette[randInt(0, palette.length - 1)];
    rippleActive++;
}

function updateRipples() {
    var writeIdx = 0;
    for (var i = 0; i < rippleActive; i++) {
        var r = ripplePool[i];
        r.radius += 2.5;
        r.alpha = 0.6 * (1 - r.radius / r.maxRadius);
        if (r.radius < r.maxRadius) {
            if (writeIdx !== i) ripplePool[writeIdx] = r;
            writeIdx++;
        }
    }
    rippleActive = writeIdx;
}

function drawRipples() {
    for (var i = 0; i < rippleActive; i++) {
        var r = ripplePool[i];
        ctx.globalAlpha = Math.max(0, r.alpha);
        ctx.strokeStyle = r.color;
        ctx.lineWidth = r.lineWidth;
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.radius, 0, 6.2832);
        ctx.stroke();
    }
    ctx.globalAlpha = 1;
}

// ================================================================
// ============ 鼠标拖尾系统 ============
// ================================================================
var trailPoints = [];
var MAX_TRAIL = 25;

function updateTrail() {
    if (mouse.moved && (gameState === 'free' || gameState === 'start')) {
        trailPoints.push({ x: mouse.x, y: mouse.y, alpha: 1 });
        if (trailPoints.length > MAX_TRAIL) trailPoints.shift();
    }
    for (var i = trailPoints.length - 1; i >= 0; i--) {
        trailPoints[i].alpha -= 0.04;
        if (trailPoints[i].alpha <= 0) trailPoints.splice(i, 1);
    }
}

function drawTrail() {
    if (trailPoints.length < 2) return;
    var palette = moodColors || currentPalette;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (var i = 1; i < trailPoints.length; i++) {
        var a = trailPoints[i - 1], b = trailPoints[i];
        ctx.globalAlpha = Math.max(0, b.alpha * 0.5);
        ctx.strokeStyle = palette[i % palette.length];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
}

// ================================================================
// ============ 鼠标悬停光晕 ============
// ================================================================
function drawHoverGlow() {
    if (gameState !== 'free' && gameState !== 'start') return;
    if (mouse.hoverTime < 300) return;
    var palette = moodColors || currentPalette;
    var color = palette[0];
    var breathe = 0.7 + 0.3 * Math.sin(Date.now() * 0.003);
    var radius = 60 * breathe;
    var sprite = glowCache[color + '_lg'] || glowCache[color + '_xl'];
    if (sprite) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.25 * breathe;
        var s = radius * 2;
        ctx.drawImage(sprite, mouse.x - radius, mouse.y - radius, s, s);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
    }
}

// ================================================================
// ============ 光球系统（挑战模式） ============
// ================================================================
var MAX_ORBS = 10;
var orbPool = [];
var orbActive = 0;
var lastOrbSpawn = 0;
var ORB_SPAWN_INTERVAL = 2200;

function spawnOrb() {
    if (!gameActive) return;
    var orb = null;
    for (var i = 0; i < orbPool.length; i++) {
        if (!orbPool[i].alive) { orb = orbPool[i]; break; }
    }
    if (!orb) {
        if (orbPool.length >= MAX_ORBS) return;
        orb = { x:0, y:0, size:12, colorIndex:0, pulse:0, alpha:1, alive:false };
        orbPool.push(orb);
    }
    orb.x = rand(80, W - 80);
    orb.y = rand(100, H - 80);
    orb.size = params.particleSize * 4;
    orb.colorIndex = randInt(0, currentPalette.length - 1);
    orb.pulse = rand(0, 6);
    orb.alpha = 1;
    orb.alive = true;
}

function updateOrbs() {
    if (!gameActive) return;
    orbActive = 0;
    for (var i = 0; i < orbPool.length; i++) {
        var o = orbPool[i];
        if (!o.alive) continue;
        orbActive++;
        o.pulse += 0.06;

        // 鼠标拖尾捕获（平方距离检测）
        if (mouse.moved) {
            var dx = mouse.x - o.x;
            var dy = mouse.y - o.y;
            var catchR = o.size * 2;
            if (dx * dx + dy * dy < catchR * catchR) {
                catchOrb(o, 5);
            }
        }
    }

    // 定时生成光球
    var now = Date.now();
    if (now - lastOrbSpawn > ORB_SPAWN_INTERVAL) {
        spawnOrb();
        lastOrbSpawn = now;
    }
}

function drawOrbs() {
    if (!gameActive) return;
    var palette = currentPalette;
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < orbPool.length; i++) {
        var o = orbPool[i];
        if (!o.alive) continue;
        var color = palette[o.colorIndex % palette.length];
        var pulseScale = 1 + 0.3 * Math.sin(o.pulse);
        var r = o.size * pulseScale;
        var drawR = r * 3;

        var sprite = glowCache[color + '_xl'] || glowCache[color + '_lg'];
        if (sprite) {
            ctx.globalAlpha = 0.7 + 0.3 * Math.sin(o.pulse);
            ctx.drawImage(sprite, o.x - drawR, o.y - drawR, drawR * 2, drawR * 2);
        }

        // 中心白色亮点
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(o.x, o.y, Math.max(1, r * 0.3), 0, 6.2832);
        ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
}

// 捕获光球
function catchOrb(orb, points) {
    if (!orb.alive) return;
    orb.alive = false;

    // 连击计算
    var now = Date.now();
    if (now - lastCatchTime < 2000) combo++;
    else combo = 1;
    lastCatchTime = now;

    var multiplier = Math.min(combo, 5);
    var totalPoints = points * multiplier;
    score += totalPoints;

    updateScoreDisplay();
    if (combo >= 2) showCombo(combo);
    showFloatingScore(orb.x, orb.y, '+' + totalPoints);

    // 烟花 + 涟漪反馈
    spawnFirework(orb.x, orb.y, 18, currentPalette);
    spawnRipple(orb.x, orb.y);

    clearTimeout(comboTimeout);
    comboTimeout = setTimeout(function() { combo = 0; }, 2500);
}

// 点击检测光球
function clickCatchOrb(x, y) {
    for (var i = 0; i < orbPool.length; i++) {
        var o = orbPool[i];
        if (!o.alive) continue;
        var dx = x - o.x, dy = y - o.y;
        var catchR = o.size * 3;
        if (dx * dx + dy * dy < catchR * catchR) catchOrb(o, 10);
    }
}

// ================================================================
// ============ 分数/UI 更新 ============
// ================================================================
var scoreEl = document.getElementById('scoreDisplay');
var timerBarEl = document.getElementById('timerBar');
var timeTextEl = document.getElementById('timeText');
var comboEl = document.getElementById('comboDisplay');
var floatingScoresEl = document.getElementById('floatingScores');

function updateScoreDisplay() {
    scoreEl.textContent = score;
    scoreEl.classList.add('bump');
    setTimeout(function() { scoreEl.classList.remove('bump'); }, 150);
}

function showCombo(c) {
    comboEl.textContent = 'x' + c + ' COMBO!';
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
    setTimeout(function() { comboEl.classList.remove('show'); }, 800);
}

function showFloatingScore(x, y, text) {
    var el = document.createElement('div');
    el.className = 'float-score';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    floatingScoresEl.appendChild(el);
    setTimeout(function() { el.remove(); }, 1000);
}

function updateTimer() {
    if (!gameActive) return;
    var elapsed = (Date.now() - gameStartTime) / 1000;
    var remaining = Math.max(0, 60 - elapsed);
    gameTimer = remaining;

    var pct = (remaining / 60) * 100;
    timerBarEl.style.width = pct + '%';
    timeTextEl.textContent = Math.ceil(remaining) + 's';

    timerBarEl.classList.remove('warn', 'danger');
    if (remaining <= 10) timerBarEl.classList.add('danger');
    else if (remaining <= 20) timerBarEl.classList.add('warn');

    if (remaining <= 0) endGame();
}

// ================================================================
// ============ 游戏流程控制 ============
// ================================================================
function startGame(mode) {
    if (mode === 'free') {
        gameState = 'free';
        document.getElementById('startScreen').classList.remove('visible');
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('freeModeUI').classList.remove('hidden');
        document.getElementById('endScreen').classList.add('hidden');
        document.getElementById('endScreen').classList.remove('visible');
        document.getElementById('challengeUI').classList.add('hidden');
        scoreEl.style.display = 'none';
        timeTextEl.style.display = 'none';
        setParticleCount(params.particleCount);
    } else if (mode === 'challenge') {
        gameState = 'countdown';
        document.getElementById('startScreen').classList.remove('visible');
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('endScreen').classList.add('hidden');
        document.getElementById('endScreen').classList.remove('visible');
        document.getElementById('freeModeUI').classList.add('hidden');
        score = 0; combo = 0; lastCatchTime = 0;
        scoreEl.textContent = '0';
        scoreEl.style.display = 'block';
        timeTextEl.style.display = 'block';
        showCountdown(3);
    }
}

function showCountdown(n) {
    var cdEl = document.getElementById('countdown');
    var numEl = document.getElementById('countdownNum');
    cdEl.classList.add('show');

    function tick() {
        if (n <= 0) {
            cdEl.classList.remove('show');
            beginChallenge();
            return;
        }
        numEl.textContent = n;
        numEl.style.animation = 'none';
        void numEl.offsetWidth;
        numEl.style.animation = 'countPulse 0.8s ease-out';
        n--;
        setTimeout(tick, 900);
    }
    tick();
}

function beginChallenge() {
    gameState = 'challenge';
    gameActive = true;
    score = 0; combo = 0;
    gameStartTime = Date.now();
    lastOrbSpawn = Date.now();
    for (var i = 0; i < orbPool.length; i++) orbPool[i].alive = false;
    orbActive = 0;
    document.getElementById('challengeUI').classList.remove('hidden');
    timerBarEl.style.width = '100%';
    timerBarEl.classList.remove('warn', 'danger');
    setParticleCount(200);
    switchTheme('starsky');
}

function endGame() {
    gameActive = false;
    gameState = 'end';

    for (var i = 0; i < orbPool.length; i++) orbPool[i].alive = false;
    orbActive = 0;

    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('lumina_best', String(bestScore));
    }

    document.getElementById('challengeUI').classList.add('hidden');
    scoreEl.style.display = 'none';
    timeTextEl.style.display = 'none';

    // 庆祝烟花
    for (var i = 0; i < 8; i++) {
        (function(idx) {
            setTimeout(function() {
                spawnFirework(rand(W * 0.2, W * 0.8), rand(H * 0.2, H * 0.8), 25, currentPalette);
            }, idx * 200);
        })(i);
    }

    setTimeout(function() {
        document.getElementById('finalScore').textContent = score;
        document.getElementById('bestScore').innerHTML = '最高记录: <span>' + bestScore + '</span>';
        document.getElementById('endScreen').classList.remove('hidden');
        document.getElementById('endScreen').classList.add('visible');
    }, 600);
}

function goBackToStart() {
    gameState = 'start';
    gameActive = false;
    document.getElementById('startScreen').classList.remove('hidden');
    document.getElementById('startScreen').classList.add('visible');
    document.getElementById('freeModeUI').classList.add('hidden');
    document.getElementById('sidePanel').classList.add('hidden');
    document.getElementById('endScreen').classList.add('hidden');
    document.getElementById('endScreen').classList.remove('visible');
    document.getElementById('challengeUI').classList.add('hidden');
    scoreEl.style.display = 'none';
    timeTextEl.style.display = 'none';
    setParticleCount(params.particleCount);
}

// ================================================================
// ============ 主题管理 ============
// ================================================================
function switchTheme(name) {
    if (!THEMES[name]) return;
    currentTheme = name;
    currentPalette = THEMES[name].slice();
    buildGlowCache(currentPalette);
    if (moodColors) buildGlowCache(moodColors);

    document.querySelectorAll('.theme-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.theme === name);
    });
}

function applyMood(mood) {
    if (!MOODS[mood]) return;
    moodColors = MOODS[mood].slice();
    buildGlowCache(moodColors);
    showHealingMsg(pick(HEALING_MSGS[mood]));
}

// ================================================================
// ============ 治愈消息 ============
// ================================================================
var healMsgTimer = null;
function showHealingMsg(msg) {
    var el = document.getElementById('healingMsg');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(healMsgTimer);
    healMsgTimer = setTimeout(function() { el.classList.remove('show'); }, 4000);
}

// ================================================================
// ============ 挑战模式背景色随分数变化 ============
// ================================================================
var lastChallengePaletteUpdate = 0;
function updateChallengeBackground() {
    if (gameState !== 'challenge' || !gameActive) return;
    // 每500ms更新一次避免频繁创建精灵
    var now = Date.now();
    if (now - lastChallengePaletteUpdate < 500) return;
    lastChallengePaletteUpdate = now;

    var warmth = Math.min(score / 500, 1);
    var base = THEMES.starsky;
    var warm = THEMES.sunset;
    currentPalette = base.map(function(c, i) { return lerpColor(c, warm[i % warm.length], warmth * 0.6); });
    buildGlowCache(currentPalette);
}

// ================================================================
// ============ 主循环 ============
// ================================================================
var firstFrame = true;

function mainLoop() {
    requestAnimationFrame(mainLoop);

    // 清屏（带拖尾效果）
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = params.trailAlpha;
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, W, H);

    // 第一帧完全清除
    if (firstFrame) {
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#0a0a12';
        ctx.fillRect(0, 0, W, H);
        firstFrame = false;
    }
    ctx.globalAlpha = 1;

    // 更新所有系统
    updateParticles();
    updateFireworks();
    updateRipples();
    updateTrail();

    if (gameState === 'challenge') {
        updateOrbs();
        updateTimer();
        updateChallengeBackground();
    }

    // 绘制顺序：拖尾 -> 粒子 -> 光球 -> 烟花 -> 涟漪 -> 光晕
    drawTrail();
    drawParticles();
    if (gameState === 'challenge') drawOrbs();
    drawFireworks();
    drawRipples();
    drawHoverGlow();

    // 鼠标悬停计时
    if (mouse.active && !mouse.moved) mouse.hoverTime += 16;
    else mouse.hoverTime = 0;
    mouse.moved = false;
}

// ================================================================
// ============ 事件监听 ============
// ================================================================

canvas.addEventListener('mousemove', function(e) {
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    mouse.moved = true;
});

canvas.addEventListener('mouseenter', function() { mouse.active = true; });
canvas.addEventListener('mouseleave', function() { mouse.active = false; mouse.hoverTime = 0; });

canvas.addEventListener('click', function(e) {
    var x = e.clientX, y = e.clientY;

    if (gameState === 'free' || gameState === 'start') {
        spawnFirework(x, y, 30, currentPalette);
        spawnRipple(x, y);
        spawnRipple(x, y);
    }

    if (gameState === 'challenge' && gameActive) {
        clickCatchOrb(x, y);
        spawnFirework(x, y, 8, currentPalette);
    }
});

// 滚轮调整粒子密度
window.addEventListener('wheel', function(e) {
    if (gameState !== 'free') return;
    e.preventDefault();
    var delta = e.deltaY > 0 ? -20 : 20;
    setParticleCount(Math.max(50, Math.min(800, params.particleCount + delta)));
    document.getElementById('particleCount').value = params.particleCount;
    document.getElementById('countVal').textContent = params.particleCount;
}, { passive: false });

// 全屏
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function() {});
    } else {
        document.exitFullscreen().catch(function() {});
    }
}

// 键盘
window.addEventListener('keydown', function(e) {
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    if (e.key === 'Escape' && (gameState === 'free' || gameState === 'end')) goBackToStart();
});

// 按钮事件
document.getElementById('freeModeBtn').addEventListener('click', function() { startGame('free'); });
document.getElementById('challengeModeBtn').addEventListener('click', function() { startGame('challenge'); });
document.getElementById('backToStartFree').addEventListener('click', goBackToStart);
document.getElementById('retryBtn').addEventListener('click', function() { startGame('challenge'); });
document.getElementById('backBtn').addEventListener('click', goBackToStart);
document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);

// 主题按钮
document.querySelectorAll('.theme-btn').forEach(function(btn) {
    btn.addEventListener('click', function() { switchTheme(btn.dataset.theme); });
});

// 心情按钮
document.querySelectorAll('.mood-btn-small').forEach(function(btn) {
    btn.addEventListener('click', function() { applyMood(btn.dataset.mood); });
});

// 侧边面板切换
document.getElementById('togglePanel').addEventListener('click', function() {
    document.getElementById('sidePanel').classList.toggle('hidden');
});

// 参数滑块
document.getElementById('particleCount').addEventListener('input', function(e) {
    var v = parseInt(e.target.value);
    document.getElementById('countVal').textContent = v;
    setParticleCount(v);
});
document.getElementById('particleSize').addEventListener('input', function(e) {
    params.particleSize = parseFloat(e.target.value);
    document.getElementById('sizeVal').textContent = params.particleSize;
});
document.getElementById('attractStrength').addEventListener('input', function(e) {
    params.attractStrength = parseInt(e.target.value);
    document.getElementById('attractVal').textContent = params.attractStrength;
});
document.getElementById('trailLength').addEventListener('input', function(e) {
    params.trailAlpha = parseFloat(e.target.value);
    document.getElementById('trailVal').textContent = params.trailAlpha;
});

// ================================================================
// ============ 初始化 ============
// ================================================================
buildGlowCache(currentPalette);
initParticles();

// 初始清屏
ctx.fillStyle = '#0a0a12';
ctx.fillRect(0, 0, W, H);

// 隐藏挑战模式分数
scoreEl.style.display = 'none';
timeTextEl.style.display = 'none';

// 启动主循环
requestAnimationFrame(mainLoop);

</script>
