<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随身兴趣搭子 - 同城兴趣结伴小程序Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            secondary: '#f5f7ff',
            grayText: '#666'
          }
        }
      }
    }
  </script>
  <style>
    .tab-active {
      color: #6366f1;
      border-bottom: 2px solid #6366f1;
    }
    .card-shadow {
      box-shadow: 0 2px 12px rgba(99, 102, 241, 0.1);
    }
  </style>
</head>
<body class="bg-[#f8f9fa] max-w-md mx-auto bg-white min-h-screen relative">
  <!-- 顶部导航 -->
  <header class="bg-primary text-white py-4 px-5 sticky top-0 z-10">
    <h1 class="text-xl font-bold text-center"><i class="fa fa-users mr-2"></i>随身兴趣搭子</h1>
  </header>

  <!-- 底部Tab切换栏 -->
  <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white flex border-t">
    <div class="flex-1 text-center py-3 tab-active" onclick="switchTab('home')">
      <i class="fa fa-home text-lg block"></i>
      <span class="text-xs">首页</span>
    </div>
    <div class="flex-1 text-center py-3 text-gray-500" onclick="switchTab('publish')">
      <i class="fa fa-plus-circle text-lg block"></i>
      <span class="text-xs">发布结伴</span>
    </div>
    <div class="flex-1 text-center py-3 text-gray-500" onclick="switchTab('match')">
      <i class="fa fa-heart text-lg block"></i>
      <span class="text-xs">我的匹配</span>
    </div>
    <div class="flex-1 text-center py-3 text-gray-500" onclick="switchTab('mine')">
      <i class="fa fa-user text-lg block"></i>
      <span class="text-xs">我的</span>
    </div>
  </nav>

  <!-- 首页页面 -->
  <main id="home" class="p-4 pb-20">
    <!-- 搜索栏 -->
    <div class="bg-secondary rounded-lg flex items-center px-4 py-3 my-3">
      <i class="fa fa-search text-grayText"></i>
      <input type="text" placeholder="搜索兴趣：骑行/探店/看展..." class="ml-2 bg-transparent outline-none flex-1 text-sm">
    </div>

    <!-- 兴趣分类标签 -->
    <div class="flex flex-wrap gap-2 my-4">
      <span class="bg-primary/10 text-primary px-3 py-1 rounded-full text-sm">骑行</span>
      <span class="bg-gray-100 px-3 py-1 rounded-full text-sm text-gray-600">探店美食</span>
      <span class="bg-gray-100 px-3 py-1 rounded-full text-sm text-gray-600">艺术看展</span>
      <span class="bg-gray-100 px-3 py-1 rounded-full text-sm text-gray-600">球类运动</span>
      <span class="bg-gray-100 px-3 py-1 rounded-full text-sm text-gray-600">书店逛游</span>
    </div>

    <h2 class="font-bold text-gray-800 my-3">附近正在招募的搭子</h2>
    <!-- 结伴卡片1 -->
    <div class="bg-white rounded-xl p-4 card-shadow mb-4">
      <div class="flex items-center">
        <div class="w-10 h-10 rounded-full bg-primary/20 flex items-center justify-center text-primary">小A</div>
        <div class="ml-3">
          <p class="font-medium">周末骑行搭子招募</p>
          <p class="text-xs text-grayText">今天 15:00｜城市滨河路</p>
        </div>
      </div>
      <div class="mt-3 flex gap-2">
        <span class="bg-primary/10 text-primary px-2 py-0.5 rounded text-xs">骑行</span>
        <span class="bg-green-100 text-green-600 px-2 py-0.5 rounded text-xs">还差1人</span>
      </div>
      <button class="w-full mt-3 border border-primary text-primary py-2 rounded-lg text-sm">立即匹配</button>
    </div>

    <!-- 结伴卡片2 -->
    <div class="bg-white rounded-xl p-4 card-shadow mb-4">
      <div class="flex items-center">
        <div class="w-10 h-10 rounded-full bg-orange-200 flex items-center justify-center text-orange-500">小B</div>
        <div class="ml-3">
          <p class="font-medium">艺术展结伴看展</p>
          <p class="text-xs text-grayText">明天 10:00｜市美术馆</p>
        </div>
      </div>
      <div class="mt-3 flex gap-2">
        <span class="bg-orange-100 text-orange-500 px-2 py-0.5 rounded text-xs">看展</span>
        <span class="bg-green-100 text-green-600 px-2 py-0.5 rounded text-xs">可结伴</span>
      </div>
      <button class="w-full mt-3 border border-primary text-primary py-2 rounded-lg text-sm">立即匹配</button>
    </div>
  </main>

  <!-- 发布结伴页面 默认隐藏 -->
  <section id="publish" class="hidden p-4 pb-20">
    <h2 class="font-bold text-lg mb-4">发布我的结伴邀约</h2>
    <div class="space-y-4">
      <div>
        <label class="text-sm text-gray-700 block mb-1">活动标题</label>
        <input type="text" placeholder="例：周末美食探店找搭子" class="w-full border rounded-lg px-3 py-2 outline-primary">
      </div>
      <div>
        <label class="text-sm text-gray-700 block mb-1">选择兴趣类型</label>
        <div class="flex flex-wrap gap-2">
          <label class="border rounded px-2 py-1 text-sm"><input type="checkbox"> 骑行</label>
          <label class="border rounded px-2 py-1 text-sm"><input type="checkbox"> 探店</label>
          <label class="border rounded px-2 py-1 text-sm"><input type="checkbox"> 看展</label>
          <label class="border rounded px-2 py-1 text-sm"><input type="checkbox"> 运动</label>
        </div>
      </div>
      <div>
        <label class="text-sm text-gray-700 block mb-1">活动时间</label>
        <input type="datetime-local" class="w-full border rounded-lg px-3 py-2 outline-primary">
      </div>
      <div>
        <label class="text-sm text-gray-700 block mb-1">活动地点</label>
        <input type="text" placeholder="选择同城活动位置" class="w-full border rounded-lg px-3 py-2 outline-primary">
      </div>
      <div>
        <label class="text-sm text-gray-700 block mb-1">活动简介</label>
        <textarea rows="3" placeholder="简单描述下本次活动，寻找什么样的搭子..." class="w-full border rounded-lg px-3 py-2"></textarea>
      </div>
      <button class="w-full bg-primary text-white py-3 rounded-lg font-medium">发布邀约，开始智能匹配</button>
    </div>
  </section>

  <!-- 我的匹配页面 默认隐藏 -->
  <section id="match" class="hidden p-4 pb-20">
    <h2 class="font-bold text-lg mb-4">我的结伴匹配记录</h2>
    <div class="bg-white rounded-xl p-4 card-shadow mb-4">
      <div class="flex justify-between items-center">
        <span class="font-medium">滨河路骑行搭子</span>
        <span class="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded">匹配成功</span>
      </div>
      <p class="text-sm text-grayText mt-1">活动时间：今日15:00</p>
      <div class="flex gap-2 mt-3">
        <button class="flex-1 border border-gray-300 py-2 rounded text-sm">查看对方资料</button>
        <button class="flex-1 bg-primary text-white py-2 rounded text-sm">临时聊天</button>
      </div>
    </div>
    <div class="bg-white rounded-xl p-4 card-shadow opacity-70">
      <div class="flex justify-between items-center">
        <span class="font-medium">美术馆看展邀约</span>
        <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded">待匹配</span>
      </div>
      <p class="text-sm text-grayText mt-1">活动时间：明天10:00</p>
    </div>
  </section>

  <!-- 个人中心页面 默认隐藏 -->
  <section id="mine" class="hidden p-4 pb-20">
    <div class="bg-primary rounded-xl text-white p-6 text-center">
      <div class="w-16 h-16 rounded-full bg-white/30 mx-auto flex items-center justify-center text-3xl mb-2">
        <i class="fa fa-user"></i>
      </div>
      <h3 class="font-bold text-lg">兴趣爱好者</h3>
      <p class="text-sm opacity-80">已成功结伴 3 次</p>
    </div>
    <div class="mt-4 bg-white rounded-xl overflow-hidden card-shadow">
      <div class="flex justify-between p-4 border-b">
        <span><i class="fa fa-calendar mr-2 text-grayText"></i>我的发布</span>
        <i class="fa fa-angle-right text-gray-400"></i>
      </div>
      <div class="flex justify-between p-4 border-b">
        <span><i class="fa fa-shield mr-2 text-grayText"></i>安全中心</span>
        <i class="fa fa-angle-right text-gray-400"></i>
      </div>
      <div class="flex justify-between p-4 border-b">
        <span><i class="fa fa-star mr-2 text-grayText"></i>我的评价</span>
        <i class="fa fa-angle-right text-gray-400"></i>
      </div>
      <div class="flex justify-between p-4">
        <span><i class="fa fa-cog mr-2 text-grayText"></i>设置</span>
        <i class="fa fa-angle-right text-gray-400"></i>
      </div>
    </div>
  </section>

  <script>
    // Tab切换逻辑
    const tabs = ['home', 'publish', 'match', 'mine'];
    function switchTab(activeId) {
      tabs.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      })
      document.getElementById(activeId).classList.remove('hidden');
      // 更新底部tab样式
      const tabItems = document.querySelectorAll('nav > div');
      tabItems.forEach(item => {
        item.classList.remove('tab-active');
        item.classList.add('text-gray-500');
      })
      event.currentTarget.classList.add('tab-active');
      event.currentTarget.classList.remove('text-gray-500');
    }
  </script>
</body>
</html>
