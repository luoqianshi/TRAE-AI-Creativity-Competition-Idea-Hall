<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戏曲天地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            margin-bottom: 30px;
            border-radius: 20px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: bold;
        }

        .header .subtitle {
            font-size: 24px;
            margin-top: 15px;
            opacity: 0.9;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #fff5e6, #ffe0b3);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
            color: #8b4513;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 25px 50px;
            font-size: 36px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .tab:hover {
            transform: scale(1.05);
        }

        .tab.active {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .tab-gezixi {
            background: linear-gradient(135deg, #ffd93d, #ffb700);
            color: #333;
        }

        .tab-jingju {
            background: linear-gradient(135deg, #6bcb77, #4caf50);
            color: white;
        }

        .tab-yueju {
            background: linear-gradient(135deg, #4d96ff, #2196f3);
            color: white;
        }

        .tab-huangmeixi {
            background: linear-gradient(135deg, #ff6b9d, #e91e63);
            color: white;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .video-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s;
        }

        .video-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .video-card:active {
            transform: scale(0.95);
        }

        .video-thumbnail {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            font-weight: bold;
            border-radius: 20px 20px 0 0;
        }

        .video-info {
            padding: 20px;
            text-align: center;
        }

        .video-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .play-btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            color: white;
            font-size: 24px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .play-btn:hover {
            transform: scale(1.05);
        }

        .color-indicator {
            display: inline-block;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            vertical-align: middle;
        }

        .hint {
            text-align: center;
            font-size: 24px;
            color: #666;
            margin: 20px 0;
            padding: 20px;
            background: #fff;
            border-radius: 15px;
        }

        .voice-hint {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            font-size: 22px;
            color: #1565c0;
            border: 2px dashed #64b5f6;
        }

        .voice-hint-title {
            font-weight: bold;
            font-size: 26px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .voice-hint-list {
            line-height: 1.8;
        }

        .voice-hint-item {
            margin: 10px 0;
        }

        .voice-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            z-index: 999;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .voice-btn:hover {
            transform: scale(1.1);
        }

        .voice-btn.listening {
            animation: pulse 1s infinite;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .voice-status {
            position: fixed;
            bottom: 170px;
            right: 30px;
            background: #333;
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 24px;
            z-index: 999;
            display: none;
        }
        
        .confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .confirm-overlay.show {
            display: flex;
        }
        
        .confirm-box {
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        
        .confirm-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        
        .confirm-video-title {
            font-size: 28px;
            color: #ff6b6b;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .confirm-play-btn {
            padding: 18px 50px;
            font-size: 24px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            margin-bottom: 15px;
        }
        
        .confirm-play-btn:hover {
            transform: scale(1.05);
        }
        
        .confirm-hint {
            font-size: 18px;
            color: #888;
        }

        .voice-status.show {
            display: block;
        }

        .lang-switch {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }

        .lang-btn {
            padding: 15px 30px;
            font-size: 24px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            background: #ddd;
            color: #333;
        }

        .lang-btn:hover {
            transform: scale(1.05);
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 戏曲天地 🎭</h1>
            <p class="subtitle">传承经典，乐享戏曲</p>
        </div>

        <div class="welcome-banner">
            <span id="welcome-text">早上好！今天想听点什么呢？</span>
        </div>

            💡 提示：用不同颜色代表不同戏曲类型，点击想看的就可以播放！

                <div class="voice-hint-item">• 选择戏曲：在当前分类下，直接说"1"、"2"、"3"...或"一"、"二"、"三"</div>
                <div class="voice-hint-item">• 也可以直接说戏曲名称，如"新狄青"、"霸王别姬"</div>
                <div class="voice-hint-item">• 请确保已允许浏览器访问麦克风（使用Chrome浏览器最佳）</div>
            </div>
        </div>

        <div class="tabs">  
            <button class="tab tab-gezixi active" data-type="gezixi">
                <span class="color-indicator" style="background: #ffd93d;"></span>
                台湾歌仔戏
            </button>
            <button class="tab tab-jingju" data-type="jingju">
                <span class="color-indicator" style="background: #6bcb77;"></span>
                京剧
            </button>
            <button class="tab tab-yueju" data-type="yueju">
                <span class="color-indicator" style="background: #4d96ff;"></span>
                越剧
            </button>
            <button class="tab tab-huangmeixi" data-type="huangmeixi">
                <span class="color-indicator" style="background: #ff6b9d;"></span>
                黄梅戏
            </button>
        </div>

        <div class="content-grid" id="contentGrid"></div>
    </div>

    <div class="lang-switch" id="langSwitch">
        <button class="lang-btn active" id="langCN" onclick="switchLanguage('zh-CN')">普通话</button>
        <button class="lang-btn" id="langTW" onclick="switchLanguage('zh-TW')">闽南语</button>
    </div>
    <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceRecognition()">🎤</button>
    <div class="voice-status" id="voiceStatus">正在听...</div>
    
    <!-- 确认播放遮罩层 -->
    <div class="confirm-overlay" id="confirmOverlay" onclick="closeOverlay(event)">
        <div class="confirm-box" onclick="event.stopPropagation()">
            <div class="confirm-title">🎬 即将播放</div>
            <div class="confirm-video-title" id="confirmVideoTitle">戏曲名称</div>
            <button class="confirm-play-btn" id="confirmPlayBtn" onclick="confirmPlay()">▶ 立即播放</button>
            <div class="confirm-hint">按 Enter 键或点击按钮播放</div>
        </div>
    </div>

                { id: 14, title: '西厢记', number: 2, color: '#4d96ff', image: 'yueju-02-西厢记.jpg', url: 'https://search.bilibili.com/all?keyword=越剧西厢记' },

                { id: 16, title: '祥林嫂', number: 4, color: '#4d96ff', image: 'yueju-04-祥林嫂.jpg', url: 'https://search.bilibili.com/all?keyword=越剧祥林嫂' },

                { id: 18, title: '何文秀', number: 6, color: '#4d96ff', image: 'yueju-06-何文秀.jpg', url: 'https://search.bilibili.com/all?keyword=越剧何文秀' },

                { id: 19, title: '天仙配', number: 1, color: '#ff6b9d', image: 'huangmeixi-01-天仙配.jpg', url: 'https://search.bilibili.com/all?keyword=黄梅戏天仙配' },
                { id: 20, title: '女驸马', number: 2, color: '#ff6b9d', image: 'huangmeixi-02-女驸马.jpg', url: 'https://search.bilibili.com/all?keyword=黄梅戏女驸马' },
                { id: 21, title: '牛郎织女', number: 3, color: '#ff6b9d', image: 'huangmeixi-03-牛郎织女.jpg', url: 'https://search.bilibili.com/all?keyword=黄梅戏牛郎织女' },

                { id: 24, title: '王小六打豆腐', number: 6, color: '#ff6b9d', image: 'huangmeixi-06-王小六打豆腐.jpg', url: 'https://search.bilibili.com/all?keyword=黄梅戏王小六打豆腐' },
            ]
        };

        let currentType = 'gezixi';
        let recognition = null;
        let isListening = false;
        let currentLang = 'zh-CN';

        function speak(text, lang = currentLang) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                utterance.pitch = 1;
                speechSynthesis.speak(utterance);
            }
        }

        function switchLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if (lang === 'zh-CN') {
                document.getElementById('langCN').classList.add('active');
            } else {
                document.getElementById('langTW').classList.add('active');
            }
            
            if (recognition) {
                recognition.lang = lang;
            }
            
            if (lang === 'zh-TW') {
                speak('已切換到閩南語', 'zh-TW');
            } else {
                speak('已切换到普通话', 'zh-CN');
            }
        }

        function initVoiceRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'zh-CN'; // 固定用简体中文，兼容性更好
                
                console.log('初始化语音识别...');
                console.log('浏览器支持：', !!window.SpeechRecognition || !!window.webkitSpeechRecognition);

                recognition.onstart = function() {
                    isListening = true;
                    document.getElementById('voiceBtn').classList.add('listening');
                    document.getElementById('voiceStatus').classList.add('show');
                    document.getElementById('voiceStatus').textContent = '🎤 正在听...请说话！';
                    console.log('✅ 语音识别已启动，语言：zh-CN');
                    console.log('💡 提示：请清晰地说话，说完后稍等');
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    console.log('🎉 识别到语音：', transcript);
                    document.getElementById('voiceStatus').textContent = '听到：' + transcript;
                    handleVoiceCommand(transcript);
                };

                recognition.onerror = function(event) {
                    console.error('❌ 语音识别错误：', event.error);
                    let errorMsg = '识别失败，请重试';
                    if (event.error === 'no-speech') {
                        errorMsg = '😕 没有听到声音，请大声一点或再说一遍';
                    } else if (event.error === 'audio-capture') {
                        errorMsg = '🎙️ 无法访问麦克风，请检查权限';
                    } else if (event.error === 'not-allowed') {
                        errorMsg = '🔒 请允许浏览器访问麦克风';
                    } else {
                        errorMsg = '❌ 错误：' + event.error;
                    }
                    document.getElementById('voiceStatus').textContent = errorMsg;
                    setTimeout(() => {
                        stopListening();
                    }, 4000);
                };

                recognition.onend = function() {
                    console.log('语音识别结束');
                    if (isListening) {
                        stopListening();
                    }
                };
            } else {
                alert('您的浏览器不支持语音识别功能，建议使用Chrome浏览器');
            }
        }

        function toggleVoiceRecognition() {
            if (!recognition) {
                initVoiceRecognition();
            }
            
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    console.error('启动语音识别失败：', e);
                    document.getElementById('voiceStatus').classList.add('show');
                    document.getElementById('voiceStatus').textContent = '启动失败，请刷新页面重试';
                    setTimeout(() => {
                        document.getElementById('voiceStatus').classList.remove('show');
                    }, 2000);
                }
            }
        }

        function stopListening() {
            isListening = false;
            document.getElementById('voiceBtn').classList.remove('listening');
            setTimeout(() => {
                document.getElementById('voiceStatus').classList.remove('show');
            }, 2000);
        }

        function handleVoiceCommand(command) {
            command = command.toLowerCase().trim();
            console.log('========== 语音命令处理开始 ==========');
            console.log('原始命令：', command);
            console.log('当前分类：', currentType);
            
            let isTaiwan = currentLang === 'zh-TW';
            
            const chineseNumbers = {
                '一': 1, '二': 2, '三': 3, '四': 4, '五': 5,
                '六': 6, '七': 7, '八': 8, '九': 9, '十': 10,
                '十一': 11, '十二': 12
            };
            
            let num = null;
            
            const numberMatch = command.match(/(\d+)/);
            console.log('数字匹配结果：', numberMatch);
            if (numberMatch) {
                num = parseInt(numberMatch[1]);
                console.log('识别到阿拉伯数字：', num);
            } else {
                for (let cnNum in chineseNumbers) {
                    if (command.includes(cnNum)) {
                        num = chineseNumbers[cnNum];
                        console.log('识别到中文数字：', cnNum, '→', num);
                        break;
                    }
                }
            }
            
            const videos = videoData[currentType];
            console.log('当前分类下的戏曲数量：', videos.length);
            
            if (num !== null && num >= 1 && num <= videos.length) {
                console.log('✅ 数字在有效范围内，准备播放第', num, '个');
                playVideo(num - 1, currentType);
                speak(isTaiwan ? '正在播放第' + num + '个' : '正在播放第' + num + '个');
                console.log('========== 语音命令处理结束（数字选择） ==========');
                return;
            } else if (num !== null) {
                console.log('❌ 数字超出范围：', num, '有效范围：1-', videos.length);
            }
            
            console.log('检查是否切换分类...');
            if (command.includes('歌') || command.includes('台湾')) {
                console.log('✅ 切换到歌仔戏');
                switchTab('gezixi');
                speak(isTaiwan ? '已經切換到台灣歌仔戲' : '已切换到台湾歌仔戏');
                console.log('========== 语音命令处理结束（切换到歌仔戏） ==========');
                return;
            }
            if (command.includes('京')) {
                switchTab('jingju');
                speak(isTaiwan ? '已經切換到京劇' : '已切换到京剧');
                return;
            }
            if (command.includes('越')) {
                switchTab('yueju');
                speak(isTaiwan ? '已經切換到越劇' : '已切换到越剧');
                return;
            }
            if (command.includes('黄') || command.includes('梅')) {
                switchTab('huangmeixi');
                speak(isTaiwan ? '已經切換到黃梅戲' : '已切换到黄梅戏');
                return;
            }

            for (let i = 0; i < videos.length; i++) {
                const title = videos[i].title;
                if (command.includes(title)) {
                    playVideo(i, currentType);
                    speak(isTaiwan ? '正在播放' + title : '正在播放' + title);
                    return;
                }
            }

            speak(isTaiwan ? '聽無，您可以講戲曲名稱，或者講第幾個' : '没听懂，可以说戏曲名称，或者说第几个');
        }

        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector('[data-type="' + type + '"]').classList.add('active');
            currentType = type;
            renderContent(currentType);
        }

        function renderContent(type) {
            const grid = document.getElementById('contentGrid');
            const videos = videoData[type];
            
            grid.innerHTML = videos.map((video, index) => {
                return `
                <div class="video-card" onclick="playVideo(${index}, '${type}', false, true)">
                    <div class="video-thumbnail" id="thumb-${type}-${index}" style="background: linear-gradient(135deg, ${video.color}, ${video.color}aa);">
                        ${video.number}
                    </div>
                    <div class="video-info">
                        <div class="video-title">${video.number}、${video.title}</div>
                        <button class="play-btn">▶ 播放</button>
                    </div>
                </div>
            `;
            }).join('');
            
            videos.forEach((video, index) => {
                if (video.image) {
                    const img = new Image();
                    img.onload = function() {
                        const thumb = document.getElementById(`thumb-${type}-${index}`);
                        if (thumb) {
                            thumb.style.backgroundImage = `url(images/${video.image})`;
                            thumb.style.backgroundSize = 'cover';
                            thumb.style.backgroundPosition = 'center';
                        }
                    };
                    img.onerror = function() {
                    };
                    img.src = `images/${video.image}`;
                }
            });
        }

        // 保存当前要播放的视频
        let currentVideoToPlay = null;
        
        // 参数：index, type, isDirectClick
        function playVideo(index, type, isDirectClick = false) {
            console.log('========== playVideo 调用 ==========');
            console.log('index:', index, 'type:', type, 'isDirectClick:', isDirectClick);
            
            const videos = videoData[type];
            const video = videos[index];
            
            console.log('将要播放：', video.title);
            console.log('视频URL：', video.url);
            
            if (isDirectClick) {
                console.log('用户直接点击卡片，直接跳转');
                if (video.url) {
                    window.open(video.url, '_blank');
                } else {
                    alert('播放：' + video.title + '\n\n（请在代码中添加哔哩哔哩链接）');
                }
            } else {
                console.log('语音选择模式，显示遮罩层...');
                currentVideoToPlay = video;
                document.getElementById('confirmVideoTitle').textContent = video.title;
                document.getElementById('confirmOverlay').classList.add('show');
                document.getElementById('confirmPlayBtn').focus();
            }
            console.log('========== playVideo 结束 ==========');
        }
        
        // 用户点击确认后播放
        function confirmPlay() {
            if (currentVideoToPlay && currentVideoToPlay.url) {
                console.log('用户确认播放：', currentVideoToPlay.title);
                window.open(currentVideoToPlay.url, '_blank');
                closeOverlay();
            }
        }
        
        // 关闭遮罩层
        function closeOverlay(event) {
            if (!event || event.target.id === 'confirmOverlay') {
                document.getElementById('confirmOverlay').classList.remove('show');
                currentVideoToPlay = null;
            }
        }
        
        // 键盘事件监听
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                if (document.getElementById('confirmOverlay').classList.contains('show')) {
                    confirmPlay();
                }
            }
            if (event.key === 'Escape') {
                closeOverlay();
            }
        });

        // 根据时间显示问候语
        function updateWelcomeText() {
            const hour = new Date().getHours();
            const welcomeEl = document.getElementById('welcome-text');
            if (hour < 12) {
                welcomeEl.textContent = '早上好！今天想听点什么呢？';
            } else if (hour < 18) {
                welcomeEl.textContent = '下午好！来听段戏曲放松一下吧！';
            } else {
                welcomeEl.textContent = '晚上好！听段戏曲好入眠~';
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentType = this.dataset.type;
                renderContent(currentType);
            });
        });

        updateWelcomeText();
        renderContent(currentType);
    </script>
</body>
</html>
