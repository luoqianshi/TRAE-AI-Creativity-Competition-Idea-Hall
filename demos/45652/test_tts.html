<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字转语音 (TTS) 测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #0a0e27 100%); color: #e0e6ff; min-height: 100vh; }

body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(ellipse at 20% 30%, rgba(79,95,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(123,143,255,0.06) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
}

.header {
    position: relative; z-index: 1;
    text-align: center; padding: 24px 20px;
    background: linear-gradient(135deg, rgba(26,31,78,0.9) 0%, rgba(13,18,51,0.95) 100%);
    border-bottom: 1px solid rgba(99,132,255,0.15);
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.header-content { max-width: 1000px; margin: 0 auto; }
.header h1 {
    font-size: 22px; color: #7b8fff; margin-bottom: 6px;
    text-shadow: 0 0 16px rgba(123,143,255,0.3);
}

.nav-links { display: flex; justify-content: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.nav-link {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border-radius: 20px;
    background: rgba(99,132,255,0.1); color: #7b8fff; font-size: 13px;
    text-decoration: none; border: 1px solid rgba(99,132,255,0.25);
    transition: all 0.3s;
}
.nav-link:hover { background: rgba(99,132,255,0.2); border-color: #7b8fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,132,255,0.2); }
.nav-link.home { background: rgba(79,255,150,0.1); border-color: rgba(79,255,150,0.25); color: #4fff96; }
.nav-link.home:hover { background: rgba(79,255,150,0.2); border-color: #4fff96; }
.nav-link.docs { background: rgba(255,180,50,0.1); border-color: rgba(255,180,50,0.25); color: #ffb432; }
.nav-link.docs:hover { background: rgba(255,180,50,0.2); border-color: #ffb432; }

.container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

.card {
    background: linear-gradient(135deg, rgba(26,31,78,0.7) 0%, rgba(13,18,51,0.8) 100%);
    border: 1px solid rgba(99,132,255,0.15);
    border-radius: 16px; padding: 24px; margin-bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.card h2 { font-size: 18px; color: #7b8fff; margin-bottom: 16px; font-weight: 600; }

.btn {
    padding: 12px 28px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.3s;
}
.btn-primary {
    background: linear-gradient(135deg, #4f5fff, #7b8fff); color: #fff;
    box-shadow: 0 4px 14px rgba(79,95,255,0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,95,255,0.4); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary {
    background: rgba(99,132,255,0.15); color: #7b8fff;
    border: 1px solid rgba(99,132,255,0.3); margin-left: 10px;
}
.btn-secondary:hover { background: rgba(99,132,255,0.25); border-color: #7b8fff; }

.progress-bar { height: 6px; background: rgba(99,132,255,0.1); border-radius: 3px; margin: 16px 0; overflow: hidden; display: none; }
.progress-bar.active { display: block; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #4f5fff, #7b8fff); border-radius: 3px; width: 0%; transition: width 0.3s; }

.log-area {
    background: rgba(13,15,30,0.8); border: 1px solid rgba(99,132,255,0.1);
    border-radius: 10px; padding: 14px; max-height: 320px; overflow-y: auto;
    font-family: 'Monaco', 'Menlo', monospace; font-size: 12px; line-height: 1.8;
}
.log-entry { color: #5a6a9a; }
.log-entry.success { color: #4fff96; }
.log-entry.error { color: #ff4f6f; }
.log-entry.warn { color: #ffb432; }
.log-entry.info { color: #7b8fff; }

.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.info-item { padding: 12px; background: rgba(99,132,255,0.05); border-radius: 10px; text-align: center; }
.info-label { font-size: 12px; color: #5a6a9a; }
.info-value { font-size: 18px; color: #7b8fff; font-weight: 600; margin-top: 6px; }

.status-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 14px; font-size: 13px; }
.status-badge.healthy { background: rgba(79,255,150,0.1); color: #4fff96; }
.status-badge.unhealthy { background: rgba(255,79,111,0.1); color: #ff4f6f; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; }
.status-dot.healthy { background: #4fff96; }
.status-dot.unhealthy { background: #ff4f6f; }

.tts-textarea {
    width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(99,132,255,0.3);
    background: rgba(13,18,51,0.6); color: #e0e6ff; font-size: 15px;
    font-family: inherit; resize: vertical; min-height: 100px;
    outline: none; transition: all 0.3s;
}
.tts-textarea:focus { border-color: #7b8fff; box-shadow: 0 0 0 3px rgba(123,143,255,0.1); }
.tts-textarea::placeholder { color: #4a5580; }

.tts-select {
    padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(99,132,255,0.3);
    background: rgba(13,18,51,0.6); color: #e0e6ff; font-size: 14px;
    outline: none; cursor: pointer;
}
.tts-select:focus { border-color: #7b8fff; }

.audio-player { width: 100%; height: 40px; border-radius: 10px; margin-top: 16px; }

@media (max-width: 600px) {
    .container { padding: 12px; }
    .card { padding: 16px; }
}
</style>
</head>
<body>

<div class="header">
    <div class="header-content">
        <h1>🔊 文字转语音 (TTS) 测试</h1>
        <div class="nav-links">
            <a href="/static/index.html" class="nav-link home">🏠 返回首页</a>
            <a href="/static/test_streaming_asr.html" class="nav-link">🎙️ Qwen3-ASR 测试</a>
            <a href="/static/test_funasr.html" class="nav-link">🎤 FunASR 测试</a>
            <a href="/docs" class="nav-link docs" target="_blank">📖 API 文档</a>
        </div>
    </div>
</div>

<div class="container">
    <!-- 服务状态 -->
    <div class="card">
        <h2>服务状态</h2>
        <div id="serviceStatus">
            <span class="status-badge unhealthy"><span class="status-dot unhealthy"></span>检查中...</span>
        </div>
    </div>

    <!-- TTS 生成 -->
    <div class="card">
        <h2>文字转语音测试</h2>
        <p style="color:#5a6a9a;font-size:13px;margin-bottom:12px;">支持 CosyVoice 内网TTS引擎 和 edge-tts 在线引擎，返回音频和字级时间戳</p>

        <div style="margin-bottom:12px;">
            <label style="font-size:13px;color:#5a6a9a;display:block;margin-bottom:4px;">TTS引擎</label>
            <select id="ttsEngine" class="tts-select" onchange="onTTSEngineChange()">
                <option value="cosyvoice">CosyVoice - 内网部署（推荐）</option>
                <option value="edge-tts">edge-tts - 微软在线</option>
            </select>
        </div>

        <div style="margin-bottom:12px;">
            <label style="font-size:13px;color:#5a6a9a;display:block;margin-bottom:4px;">语音选择</label>
            <select id="ttsVoice" class="tts-select">
                <!-- CosyVoice 语音选项（默认） -->
                <option value="xiaoxiao" class="cosyvoice-voice">中文女 - 晓晓（自然）</option>
                <option value="yunjian" class="cosyvoice-voice">中文男 - 云健（成熟）</option>
                <option value="yunxi" class="cosyvoice-voice">中文男 - 云希（阳光）</option>
                <option value="yunyang" class="cosyvoice-voice">中文男 - 云扬（新闻）</option>
                <option value="xiaoyi" class="cosyvoice-voice">中文女 - 晓伊（活泼）</option>
                <!-- edge-tts 语音选项 -->
                <option value="xiaoxiao" class="edgetts-voice" style="display:none">晓晓 - 女声自然</option>
                <option value="xiaoyi" class="edgetts-voice" style="display:none">晓伊 - 女声活泼</option>
                <option value="yunjian" class="edgetts-voice" style="display:none">云健 - 男声成熟</option>
                <option value="yunxi" class="edgetts-voice" style="display:none">云希 - 男声阳光</option>
                <option value="yunyang" class="edgetts-voice" style="display:none">云扬 - 男声新闻</option>
            </select>
        </div>

        <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <label style="font-size:13px;color:#5a6a9a;">语速</label>
                <span id="ttsSpeedValue" style="font-size:13px;color:#7b8fff;font-weight:600;">1.0x</span>
            </div>
            <input type="range" id="ttsSpeed" min="0.5" max="2.0" step="0.1" value="1.0"
                style="width:100%;accent-color:#7b8fff;" oninput="document.getElementById('ttsSpeedValue').textContent=this.value+'x'">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#4a5580;margin-top:2px;">
                <span>0.5x 慢速</span><span>1.0x 正常</span><span>2.0x 快速</span>
            </div>
        </div>

        <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <label style="font-size:13px;color:#5a6a9a;">音量</label>
                <span id="ttsVolumeValue" style="font-size:13px;color:#7b8fff;font-weight:600;">1.0x</span>
            </div>
            <input type="range" id="ttsVolume" min="0.1" max="3.0" step="0.1" value="1.0"
                style="width:100%;accent-color:#7b8fff;" oninput="document.getElementById('ttsVolumeValue').textContent=this.value+'x'">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#4a5580;margin-top:2px;">
                <span>0.1x 轻声</span><span>1.0x 正常</span><span>3.0x 大声</span>
            </div>
        </div>

        <div style="margin-bottom:12px;">
            <label style="font-size:13px;color:#5a6a9a;display:block;margin-bottom:4px;">输入文本</label>
            <textarea id="ttsText" class="tts-textarea" placeholder="请输入要转为语音的中文文本...">绿是阳春烟景大块文章的底色，四月的玲珑更是绿的鲜活秀媚，诗意盎然。</textarea>
        </div>

        <div style="margin-bottom:12px;">
            <button class="btn btn-primary" id="btnTTSGenerate" onclick="generateTTS()">生成语音</button>
            <button class="btn btn-secondary" onclick="clearTTS()">清空</button>
        </div>

        <div class="progress-bar" id="ttsProgressBar">
            <div class="progress-fill" id="ttsProgressFill"></div>
        </div>
    </div>

    <div class="card" id="ttsAudioCard" style="display:none;">
        <h2>音频播放</h2>
        <audio id="ttsAudio" controls class="audio-player"></audio>
        <div class="info-grid" id="ttsInfo"></div>
    </div>

    <div class="card" id="ttsTimestampsCard" style="display:none;">
        <h2>字级时间戳</h2>
        <div style="overflow-x:auto;margin-bottom:12px;">
            <div id="ttsChars" style="display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:rgba(99,132,255,0.05);border-radius:8px;min-height:40px;align-items:center;"></div>
        </div>
        <div style="font-size:12px;color:#5a6a9a;">
            <span id="ttsCharCount">0</span> 个字符，时长 <span id="ttsDuration">0</span> 秒
        </div>
    </div>

    <div class="card">
        <h2>日志</h2>
        <div class="log-area" id="ttsLogArea">
            <div class="log-entry">等待测试...</div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 通用工具
// ============================================================
function addLog(logAreaId, msg, cls) {
    const area = document.getElementById(logAreaId);
    const entry = document.createElement('div');
    entry.className = 'log-entry' + (cls ? ' ' + cls : '');
    const now = new Date();
    const ts = now.toTimeString().slice(0, 8) + '.' + String(now.getMilliseconds()).padStart(3, '0');
    entry.textContent = '[' + ts + '] ' + msg;
    area.appendChild(entry);
    area.scrollTop = area.scrollHeight;
}

// ============================================================
// 服务状态检查
// ============================================================
async function checkServiceStatus() {
    const statusEl = document.getElementById('serviceStatus');
    let html = '';

    // 检查 CosyVoice TTS
    try {
        const resp = await fetch('/api/v1/voice/tts/health');
        const data = await resp.json();
        if (data.status === 'healthy') {
            html += '<span class="status-badge healthy"><span class="status-dot healthy"></span>CosyVoice TTS 可用</span>';
        } else {
            html += '<span class="status-badge unhealthy"><span class="status-dot unhealthy"></span>CosyVoice TTS 不可用（降级模式）</span>';
        }
    } catch(e) {
        html += '<span class="status-badge unhealthy"><span class="status-dot unhealthy"></span>CosyVoice TTS 无法检测</span>';
    }

    statusEl.innerHTML = html;
}

// ============================================================
// 文字转语音
// ============================================================
function onTTSEngineChange() {
    const engine = document.getElementById('ttsEngine').value;
    const cosyvoiceOpts = document.querySelectorAll('.cosyvoice-voice');
    const edgettsOpts = document.querySelectorAll('.edgetts-voice');
    if (engine === 'cosyvoice') {
        cosyvoiceOpts.forEach(o => o.style.display = '');
        edgettsOpts.forEach(o => o.style.display = 'none');
        document.getElementById('ttsVoice').selectedIndex = 0;
    } else {
        cosyvoiceOpts.forEach(o => o.style.display = 'none');
        edgettsOpts.forEach(o => o.style.display = '');
        document.getElementById('ttsVoice').selectedIndex = 0;
    }
}

async function generateTTS() {
    const text = document.getElementById('ttsText').value.trim();
    if (!text) {
        addLog('ttsLogArea', '请输入文本', 'error');
        return;
    }

    const engine = document.getElementById('ttsEngine').value;
    const voice = document.getElementById('ttsVoice').value;
    const speed = parseFloat(document.getElementById('ttsSpeed').value);
    const volume = parseFloat(document.getElementById('ttsVolume').value);
    const btn = document.getElementById('btnTTSGenerate');
    const progressBar = document.getElementById('ttsProgressBar');
    const progressFill = document.getElementById('ttsProgressFill');
    const logArea = document.getElementById('ttsLogArea');

    btn.disabled = true; btn.textContent = '生成中...';
    progressBar.className = 'progress-bar active';
    progressFill.style.width = '30%';
    logArea.innerHTML = '';

    const engineLabel = engine === 'cosyvoice' ? 'CosyVoice' : 'edge-tts';
    addLog('ttsLogArea', '=== TTS 生成 ===', 'info');
    addLog('ttsLogArea', '引擎: ' + engineLabel, 'info');
    addLog('ttsLogArea', '语音: ' + voice, 'info');
    addLog('ttsLogArea', '语速: ' + speed + 'x', 'info');
    addLog('ttsLogArea', '音量: ' + volume + 'x', 'info');
    addLog('ttsLogArea', '文本: ' + text.substring(0, 50) + '...', 'info');

    try {
        progressFill.style.width = '50%';
        addLog('ttsLogArea', '调用 ' + engineLabel + ' 引擎...', 'info');

        const resp = await fetch('/api/v1/voice/tts/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, voice, engine, speed, volume })
        });

        progressFill.style.width = '80%';
        const data = await resp.json();
        progressFill.style.width = '100%';

        if (data.success) {
            if (data.audio_url) {
                addLog('ttsLogArea', '生成成功: ' + data.audio_url, 'success');
            } else {
                addLog('ttsLogArea', 'CosyVoice不可用，降级为估算模式（无音频）', 'warn');
            }
            addLog('ttsLogArea', '时长: ' + data.duration + '秒', 'info');
            addLog('ttsLogArea', '字级时间戳: ' + data.word_timestamps.length + ' 个', 'info');

            const audio = document.getElementById('ttsAudio');
            if (data.audio_url) {
                audio.src = data.audio_url;
                document.getElementById('ttsAudioCard').style.display = 'block';
            } else {
                audio.src = '';
                document.getElementById('ttsAudioCard').style.display = 'none';
            }

            document.getElementById('ttsInfo').innerHTML = '' +
                '<div class="info-item"><div class="info-label">引擎</div><div class="info-value">' + engineLabel + '</div></div>' +
                '<div class="info-item"><div class="info-label">时长</div><div class="info-value">' + data.duration + '秒</div></div>' +
                '<div class="info-item"><div class="info-label">字符数</div><div class="info-value">' + data.word_timestamps.length + '</div></div>' +
                '<div class="info-item"><div class="info-label">语音</div><div class="info-value">' + voice + '</div></div>';

            if (data.word_timestamps && data.word_timestamps.length > 0) {
                const charsDiv = document.getElementById('ttsChars');
                charsDiv.innerHTML = '';
                data.word_timestamps.forEach(wt => {
                    const span = document.createElement('span');
                    span.textContent = wt.char;
                    span.style.cssText = 'padding:2px 4px;border-radius:4px;background:rgba(99,132,255,0.1);font-size:18px;cursor:default;';
                    span.title = wt.start_time + 's - ' + wt.end_time + 's';
                    charsDiv.appendChild(span);
                });
                document.getElementById('ttsTimestampsCard').style.display = 'block';
                document.getElementById('ttsCharCount').textContent = data.word_timestamps.length;
                document.getElementById('ttsDuration').textContent = data.duration;

                if (data.audio_url) {
                    const allSpans = charsDiv.querySelectorAll('span');
                    audio.ontimeupdate = () => {
                        const ct = audio.currentTime;
                        allSpans.forEach((s, i) => {
                            const wt = data.word_timestamps[i];
                            if (wt && ct >= wt.start_time && ct < wt.end_time) {
                                s.style.background = '#4f5fff';
                                s.style.color = '#fff';
                            } else {
                                s.style.background = 'rgba(99,132,255,0.1)';
                                s.style.color = '#e0e6ff';
                            }
                        });
                    };
                    audio.onended = () => {
                        allSpans.forEach(s => {
                            s.style.background = 'rgba(99,132,255,0.1)';
                            s.style.color = '#e0e6ff';
                        });
                    };
                }
            }

            if (data.audio_url) {
                addLog('ttsLogArea', '点击播放按钮试听', 'success');
            }
        } else {
            addLog('ttsLogArea', '生成失败: ' + data.error, 'error');
        }
    } catch(e) {
        addLog('ttsLogArea', '请求失败: ' + e.message, 'error');
    }

    setTimeout(() => { progressBar.className = 'progress-bar'; }, 500);
    btn.disabled = false; btn.textContent = '生成语音';
}

function clearTTS() {
    document.getElementById('ttsText').value = '';
    document.getElementById('ttsAudio').src = '';
    document.getElementById('ttsAudioCard').style.display = 'none';
    document.getElementById('ttsTimestampsCard').style.display = 'none';
    document.getElementById('ttsLogArea').innerHTML = '<div class="log-entry">等待测试...</div>';
}

// ============================================================
// 初始化
// ============================================================
checkServiceStatus();
setInterval(checkServiceStatus, 30000);
</script>
</body>
</html>
