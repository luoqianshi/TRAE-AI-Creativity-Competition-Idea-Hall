  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    .map-container {
      width: 100%; height: 100%; overflow: hidden; position: relative;
      background-image:

        radial-gradient(circle at 80% 60%, #87CEEB 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, #F0E68C 0%, transparent 60%);
    }
    .map-content { position: absolute; width: 800px; height: 600px; cursor: grab; }
    .map-content:active { cursor: grabbing; }
    .map-title {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      font-size: 48px; font-weight: bold; color: #FF6B6B;
      text-shadow: 3px 3px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.2);

    @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-10px)} }
    .region-card {
      position: absolute; width: 160px; padding: 20px 15px; border-radius: 25px;
      text-align: center; color: #333; font-weight: bold; cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 10px 0px rgba(0,0,0,0.2), 0 15px 30px rgba(0,0,0,0.3);
      animation: float 3s ease-in-out infinite;
      border: 4px solid rgba(255,255,255,0.8);

    .region-card::before {
      content: ''; position: absolute; top: -8px; left: -8px; right: -8px; bottom: -8px;
      border-radius: 30px; background: inherit; filter: blur(15px); z-index: -1;
      opacity: 0.5; animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes glow { from{opacity:0.3} to{opacity:0.7} }
    .region-icon { font-size: 42px; margin-bottom: 8px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.2)); }
    .region-name { font-size: 18px; text-shadow: 1px 1px 0px rgba(255,255,255,0.9); letter-spacing: 2px; }
    .home-buttons {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);

      color: white; font-size: 18px; font-weight: bold; cursor: pointer;
      transition: transform 0.2s ease; min-width: 220px; font-family: 'ZCOOL KuaiLe', cursive;

    .action-button:hover { transform: translateY(-5px); }
    .action-button-secondary { background: linear-gradient(135deg, #9B59B6 0%, #8E44AD 100%); box-shadow: 0 8px 0px rgba(155,89,182,0.5), 0 12px 25px rgba(0,0,0,0.3); }
    .action-button-tertiary { background: linear-gradient(135deg, #3498DB 0%, #2980B9 100%); box-shadow: 0 8px 0px rgba(52,152,219,0.5), 0 12px 25px rgba(0,0,0,0.3); }
    .page-container { width: 100%; height: 100%; padding: 20px; overflow-y: auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
    .back-button {
      width: 45px; height: 45px; background: linear-gradient(135deg, #FFF 0%, #E0E0E0 100%);
      border: 3px solid #333; border-radius: 50%; font-size: 22px; cursor: pointer;
      box-shadow: 0 4px 0px rgba(0,0,0,0.2), 0 6px 12px rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: center;

    .back-button:hover { transform: translateY(-2px); }
    .page-title { font-size: 28px; font-weight: bold; color: #333; text-shadow: 2px 2px 0px rgba(255,255,255,0.8); font-family: 'ZCOOL KuaiLe', cursive; }
    .building-card {

    .building-icon { font-size: 45px; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.15)); }
    .building-info h3 { font-size: 20px; color: #333; font-family: 'ZCOOL KuaiLe', cursive; }

    .stars-preview { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .star-tag { padding: 6px 14px; background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); border-radius: 20px; font-size: 12px; font-weight: bold; color: #333; border: 2px solid rgba(255,255,255,0.8); }
    .star-detail-container {

    .star-title { font-size: 28px; font-weight: bold; color: #333; margin-top: 12px; font-family: 'ZCOOL KuaiLe', cursive; text-shadow: 2px 2px 0px rgba(255,255,255,0.8); }
    .star-book { display: inline-block; padding: 6px 18px; background: linear-gradient(135deg, #E0E0E0 0%, #BDBDBD 100%); border-radius: 25px; font-size: 14px; color: #555; margin-top: 10px; border: 2px solid rgba(255,255,255,0.8); }
    .section { margin-bottom: 25px; }

    .star-actions { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }

    .star-action-btn.understand { background: linear-gradient(135deg, #4ECDC4 0%, #44A08D 100%); color: white; }
    .star-action-btn.practice { background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%); color: white; }

    .guide-input-area { padding: 20px; flex: 1; display: flex; flex-direction: column; }

    .guide-input:focus { outline: none; border-color: #9B59B6; }
    .guide-submit-btn { margin-top: 20px; padding: 20px; background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%); border: 4px solid #FFF; border-radius: 50px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; font-family: 'ZCOOL KuaiLe', cursive; }
    .guide-submit-btn:hover { transform: translateY(-4px); }
    .guide-result { padding: 20px; background: rgba(255,255,255,0.98); border-radius: 25px; margin: 0 20px 20px; border: 3px solid #E0E0E0; }
    .guide-message { font-size: 17px; color: #333; line-height: 1.7; margin-bottom: 20px; font-family: 'ZCOOL KuaiLe', cursive; }
    .guide-related-star { background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); padding: 18px; border-radius: 20px; margin-bottom: 15px; border: 3px solid #FFF; cursor: pointer; }
    .guide-related-star:hover { transform: translateY(-3px); }
    .guide-related-star h4 { font-size: 18px; color: #333; margin-bottom: 5px; font-family: 'ZCOOL KuaiLe', cursive; }
    .guide-why, .guide-followup, .guide-action { margin-bottom: 15px; padding: 15px; background: rgba(230,230,230,0.9); border-radius: 15px; border-left: 5px solid #9B59B6; }
    .guide-action { background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%); border-left-color: #2E7D32; }
    .guide-action h4 { color: #2E7D32; }
    .books-container { padding: 20px; }
    .book-card { background: linear-gradient(135deg, #FFF 0%, #FAFAFA 100%); border-radius: 25px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 0px rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.15); display: flex; align-items: center; gap: 20px; cursor: pointer; border: 3px solid #E0E0E0; }
    .book-card:hover { transform: translateY(-5px); }
    .book-cover { width: 70px; height: 90px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 3px solid rgba(255,255,255,0.8); }
    .book-info h3 { font-size: 20px; color: #333; font-family: 'ZCOOL KuaiLe', cursive; }
    .book-info p { font-size: 14px; color: #666; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: linear-gradient(135deg, #FFF 0%, #FAFAFA 100%); border-radius: 30px; padding: 35px; width: 85%; max-width: 400px; border: 4px solid #E0E0E0; }
    .modal-title { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 18px; font-family: 'ZCOOL KuaiLe', cursive; }
    .modal-textarea { width: 100%; height: 130px; padding: 18px; border: 3px solid #E0E0E0; border-radius: 20px; font-size: 16px; resize: none; margin-bottom: 18px; font-family: 'ZCOOL KuaiLe', cursive; }
    .modal-textarea:focus { outline: none; border-color: #9B59B6; }
    .modal-buttons { display: flex; gap: 12px; }
    .modal-btn { flex: 1; padding: 14px; border: none; border-radius: 18px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: 'ZCOOL KuaiLe', cursive; }
    .modal-btn.primary { background: linear-gradient(135deg, #9B59B6 0%, #8E44AD 100%); color: white; }
    .modal-btn.secondary { background: #E0E0E0; color: #666; }
    .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: white; padding: 15px 30px; border-radius: 50px; font-size: 15px; z-index: 200; animation: fadeInOut 2s ease-in-out; font-family: 'ZCOOL KuaiLe', cursive; }
    @keyframes fadeInOut { 0%{opacity:0;transform:translateX(-50%) translateY(25px)} 15%{opacity:1;transform:translateX(-50%) translateY(0)} 85%{opacity:1} 100%{opacity:0;transform:translateX(-50%) translateY(-25px)} }
    @media (max-width:768px) {
      .region-card { width: 140px; padding: 15px 12px; }
      .region-icon { font-size: 36px; }
      .region-name { font-size: 15px; }
      .map-title { font-size: 36px; }
      .action-button { min-width: 200px; padding: 15px 28px; font-size: 16px; }
    }
  </style>
</head>

    function HomePage() {
      const navigate = useNavigate();
      const [position, setPosition] = useState({ x: -150, y: -100 });
      const [isDragging, setIsDragging] = useState(false);
      const [startPos, setStartPos] = useState({ x: 0, y: 0 });

      useEffect(() => {
        const handleTouchMove = (e) => {
          if (!isDragging) return;
          const touch = e.touches[0];
          const deltaX = touch.clientX - startPos.x;
          const deltaY = touch.clientY - startPos.y;
          setPosition(prev => ({ x: Math.max(-400, Math.min(200, prev.x + deltaX)), y: Math.max(-300, Math.min(100, prev.y + deltaY)) }));
          setStartPos({ x: touch.clientX, y: touch.clientY });
        };
        const handleTouchEnd = () => setIsDragging(false);
        window.addEventListener('touchmove', handleTouchMove);
        window.addEventListener('touchend', handleTouchEnd);
        return () => { window.removeEventListener('touchmove', handleTouchMove); window.removeEventListener('touchend', handleTouchEnd); };
      }, [isDragging, startPos]);

      const handleMouseDown = (e) => { setIsDragging(true); setStartPos({ x: e.clientX, y: e.clientY }); };
      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - startPos.x;
        const deltaY = e.clientY - startPos.y;
        setPosition(prev => ({ x: Math.max(-400, Math.min(200, prev.x + deltaX)), y: Math.max(-300, Math.min(100, prev.y + deltaY)) }));
        setStartPos({ x: e.clientX, y: e.clientY });
      };

      return (
        <div className="map-container">
          <div className="map-title">🌄 知识谷</div>
          <div className="map-content" style={{ transform: `translate(${position.x}px, ${position.y}px)` }}
            onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={() => setIsDragging(false)} onMouseLeave={() => setIsDragging(false)}>
            {regions.map((region, index) => (
              <div key={region.id} className="region-card" style={{ left: region.position.x, top: region.position.y, background: region.bgGradient, animationDelay: `${index * 0.5}s` }}

                <div className="region-icon">{regionIcons[region.id]}</div>
                <div className="region-name">{region.name}</div>
              </div>
            ))}
          </div>
          <div className="home-buttons">
            <button className="action-button" onClick={() => navigate('/guide')}>🤔 我遇到了一个问题</button>
            <button className="action-button action-button-secondary" onClick={() => { const s = getRandomStar(); if (s) navigate(`/star/${s.region.id}/${s.building.id}/${s.star.id}`); }}>⭐ 随便复习一颗星星</button>
            <button className="action-button action-button-tertiary" onClick={() => navigate('/books')}>📚 查看我的书籍</button>
          </div>
        </div>
      );
    }

            <div className="guide-result">
              <p className="guide-message">{result.message}</p>
              <div className="guide-related-star" onClick={handleStarClick}><h4>⭐ {result.starData.star.name}</h4><p>来源：{result.starData.star.book}</p></div>
              <div className="guide-why"><h4>💡 为什么相关</h4><p>{result.why}</p></div>
              <div className="guide-followup"><h4>❓ 追问</h4><p>{result.followUp}</p></div>
              <div className="guide-action"><h4>✅ 小行动</h4><p>{result.action}</p></div>
            </div>
          )}
        </div>
      );
    }

    function BooksPage() {
      const navigate = useNavigate();
      return (
        <div className="page-container">
          <div className="header"><button className="back-button" onClick={() => navigate('/')}>←</button><h1 className="page-title">我的书籍</h1></div>
          <div className="books-container">
            {books.map(book => (
              <div key={book.id} className="book-card" onClick={() => book.regions.length > 0 && navigate(`/region/${book.regions[0]}`)}>
                <div className="book-cover" style={{ background: `linear-gradient(135deg, ${book.coverColor} 0%, ${adjustColor(book.coverColor, -30)} 100%)` }}>{bookIcons[book.id] || '📖'}</div>
                <div className="book-info"><h3>{book.name}</h3><p>{book.author}</p><p style={{ fontSize: '12px', color: '#888', marginTop: '5px' }}>{book.description}</p></div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function adjustColor(color, amount) {
      const hex = color.replace('#', '');
      const num = parseInt(hex, 16);
      const r = Math.max(0, Math.min(255, (num >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
      const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
      return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
    }

    function App() {
      return (
        <BrowserRouter>
          <Routes>
            <Route path="/" element={<HomePage />} />
            <Route path="/region/:regionId" element={<RegionDetail />} />
            <Route path="/region/:regionId/building/:buildingId" element={<BuildingDetail />} />
            <Route path="/star/:regionId/:buildingId/:starId" element={<StarDetail />} />
            <Route path="/guide" element={<GuidePage />} />
            <Route path="/books" element={<BooksPage />} />
          </Routes>
        </BrowserRouter>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
