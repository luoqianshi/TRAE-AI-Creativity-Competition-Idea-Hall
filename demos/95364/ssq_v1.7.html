<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双色球对奖助手 v1.7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f3ee;--card:#faf9f6;--border:#d9d5cc;--text:#2d2d2d;
  --text-light:#6b6560;--red:#c84040;--red-light:#f8ecec;
  --blue:#3d6cb9;--blue-light:#eaeff7;--accent:#5a8f5a;
  --gold:#b8860b;--radius:8px;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  min-height:100vh;padding:12px;display:flex;justify-content:center;
}
.container{max-width:680px;width:100%}
h1{text-align:center;font-size:1.5rem;font-weight:600;color:var(--text);margin-bottom:4px;letter-spacing:2px}
.version-badge{text-align:center;font-size:0.7rem;color:var(--text-light);margin-bottom:12px;letter-spacing:1px}
.tab-nav{display:flex;gap:0;margin-bottom:12px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.tab-btn{flex:1;padding:8px 2px;font-family:inherit;font-size:0.83rem;font-weight:600;border:none;background:var(--card);color:var(--text-light);cursor:pointer;transition:all 0.2s;text-align:center;line-height:1.2}
.tab-btn.active{background:var(--accent);color:#fff}
.tab-btn:hover:not(.active){background:#eeebe4}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card-title{font-size:0.9rem;font-weight:600;color:var(--text-light);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.draw-info{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.draw-period{font-size:1.1rem;font-weight:600}
.draw-date{font-size:0.8rem;color:var(--text-light)}
.balls-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.ball{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:0.9rem;font-weight:600;color:#fff;flex-shrink:0}
.ball.red{background:var(--red)}.ball.blue{background:var(--blue)}
.ball.small{width:30px;height:30px;font-size:0.8rem}
.ball.xs{width:22px;height:22px;font-size:0.65rem}
.ball.hollow{background:transparent!important;border:2px solid}
.ball.hollow.red{color:var(--red);border-color:var(--red)}
.ball.hollow.blue{color:var(--blue);border-color:var(--blue)}
.ball.matched{box-shadow:0 0 0 2px var(--gold);animation:pulse 0.6s ease-in-out}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.ball-divider{width:1px;height:28px;background:var(--border);margin:0 4px}
.period-selector{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.period-selector label{font-size:0.85rem;color:var(--text-light)}
select,input[type="text"],input[type="number"]{font-family:inherit;font-size:0.9rem;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);outline:none;transition:border-color 0.2s}
select:focus,input:focus{border-color:var(--accent)}select{cursor:pointer}
.btn{font-family:inherit;font-size:0.85rem;padding:6px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);cursor:pointer;transition:all 0.2s}
.btn:hover{background:#eeebe4;border-color:#c4bfb4}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{background:#4d7d4d}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red);font-size:0.75rem;padding:3px 8px}.btn.danger:hover{background:var(--red-light)}
.btn.small{padding:4px 8px;font-size:0.75rem}
.input-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px;align-items:center}
.ball-input-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.ball-input-wrap .label{font-size:0.65rem;color:var(--text-light)}
.ball-input-wrap.blue-col{border-left:1px solid var(--border);padding-left:6px}
.ball-input{width:100%;max-width:40px;aspect-ratio:1;text-align:center;font-size:1rem;font-weight:600;padding:0;border:2px solid var(--border);border-radius:50%;background:var(--card);outline:none;transition:border-color 0.2s}
.ball-input.red{border-color:var(--red);color:var(--red)}.ball-input.blue{border-color:var(--blue);color:var(--blue)}
.ball-input:focus{border-width:2px;box-shadow:0 0 0 1px rgba(90,143,90,0.3)}
.period-input-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.period-input-row input{width:120px}
.result-card{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:#fff;position:relative}
.result-card.win{border-color:var(--gold);background:#fffdf5}
.result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.result-period{font-size:0.8rem;color:var(--text-light)}
.result-status{font-size:0.85rem;font-weight:600}.result-status.win{color:var(--gold)}.result-status.lose{color:var(--text-light)}
.result-balls{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.result-detail{font-size:0.8rem;color:var(--text-light);margin-top:6px;padding-top:8px;border-top:1px dashed var(--border)}
.prize-amount{font-weight:700;color:var(--gold);font-size:0.95rem}
.loading{text-align:center;padding:20px;color:var(--text-light);font-size:0.9rem}
.empty-tip{text-align:center;color:var(--text-light);font-size:0.85rem;padding:16px 0}
.footer{text-align:center;padding:12px 0 6px;font-size:0.75rem;color:var(--text-light);letter-spacing:1px}
.prize-summary{display:flex;justify-content:space-between;align-items:center;font-size:0.85rem}
.matched-label{font-size:0.75rem;color:var(--text-light);margin-bottom:2px}
.data-status{font-size:0.7rem;text-align:center;margin-top:4px}.data-status.live{color:var(--accent)}.data-status.fallback{color:var(--red)}

/* 历史追溯 */
.hist-check-form{display:flex;flex-direction:column;gap:10px}
.hist-inputs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:center}
.hist-inputs input{width:100%;max-width:44px;aspect-ratio:1;text-align:center;font-size:0.95rem;font-weight:600;border:2px solid;border-radius:50%;outline:none;background:var(--card)}
.hist-inputs input.red{border-color:var(--red);color:var(--red)}
.hist-inputs input.blue{border-color:var(--blue);color:var(--blue)}
.hist-actions{display:flex;gap:8px;justify-content:center;margin-top:4px}
.hist-filter{display:flex;gap:4px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
.hist-filter label{font-size:0.8rem;color:var(--text-light)}
.hist-filter-btn{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--card);font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.2s;padding:0}
.hist-filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hist-result{margin-top:10px}
.hist-result-item{border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;background:#fff}
.hist-result-item.win{border-color:var(--gold);background:#fffdf5}
.hist-meta{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-light)}
.hist-detail{font-size:0.78rem;margin-top:4px}
.hist-summary{padding:8px;background:#f5f4f0;border-radius:6px;font-size:0.85rem;margin-bottom:8px}
.hist-summary strong{color:var(--text)}
.hist-total-item{background:#f5f4f0;padding:4px 8px;border-radius:4px;font-size:0.8rem;display:inline-block;margin:2px}
.hist-pagination{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:8px}
.hist-pagination button{font-size:0.8rem}

/* 算号器 */
.generator-controls{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.random-results{display:flex;flex-direction:column;gap:8px}
.random-card{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:6px;padding:10px;background:#fff}
.random-number{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.selected-balls{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.selected-title{font-size:0.8rem;color:var(--text-light);margin-bottom:6px}
.selected-list{display:flex;flex-wrap:wrap;gap:6px}
.selected-item{border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#f5f4f0;font-size:0.8rem;display:flex;gap:4px;align-items:center}
.selected-item .remove{cursor:pointer;color:var(--red);padding:0 4px;font-weight:bold}
.add-to-check{margin-top:8px;text-align:center}

/* 走势图 */
.trend-controls{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.trend-controls label{font-size:0.85rem;color:var(--text-light)}
.trend-container{overflow-x:auto;max-height:600px;overflow-y:auto}
.trend-table{width:100%;border-collapse:collapse;font-size:0.7rem;background:#fff}
.trend-table th{background:#f5f4f0;padding:3px 1px;text-align:center;border:1px solid var(--border);position:sticky;top:0;z-index:1}
.trend-table td{padding:2px 1px;text-align:center;border:1px solid var(--border);min-width:24px}
.trend-ball{display:inline-block;width:22px;height:22px;line-height:22px;border-radius:50%;font-weight:600;color:#fff;margin:auto}
.trend-ball.red{background:var(--red)}.trend-ball.blue{background:var(--blue)}
.trend-bar{height:3px;margin-top:1px;border-radius:2px;background:var(--red);opacity:0.6}
.trend-bar.blue{background:var(--blue)}
.trend-miss{color:#ccc;font-size:0.55rem}
.trend-period{font-weight:600;font-size:0.65rem}
.trend-date{font-size:0.6rem;color:var(--text-light)}
.range-select{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range-select select{min-width:130px}

/* 玩法说明 */
.rule-section{font-size:0.9rem;line-height:1.7}
.rule-section p{margin-bottom:8px}
.rule-table{width:100%;border-collapse:collapse;margin:10px 0}
.rule-table th,.rule-table td{border:1px solid var(--border);padding:8px 6px;text-align:center;font-size:0.8rem}
.rule-table th{background:#f5f4f0}
.rule-table td .ball-row{display:flex;gap:2px;justify-content:center;flex-wrap:nowrap}

@media(max-width:480px){
  body{padding:8px}.tab-btn{font-size:0.7rem;padding:6px 0}
  .ball{width:32px;height:32px;font-size:0.8rem}.ball.small{width:26px;height:26px;font-size:0.7rem}
  .ball-input{max-width:36px;font-size:0.9rem}.input-grid{gap:4px}h1{font-size:1.2rem}
  .trend-table{font-size:0.6rem}.trend-ball{width:18px;height:18px;line-height:18px}
}
</style>
</head>
<body>
<div class="container">
  <h1>双色球对奖助手</h1>
  <div class="version-badge">v1.7</div>

  <div class="tab-nav">
    <button class="tab-btn active" data-tab="check">对奖</button>
    <button class="tab-btn" data-tab="history">历史追溯</button>
    <button class="tab-btn" data-tab="generator">随机算号</button>
    <button class="tab-btn" data-tab="trend">走势图</button>
    <button class="tab-btn" data-tab="rule">玩法说明</button>
  </div>

  <!-- ========== 1. 对奖 ========== -->
  <div class="tab-content active" id="tab-check">
    <div class="card">
      <div class="card-title">开奖信息</div>
      <div id="drawArea"><div class="loading">正在加载数据...</div></div>
      <div class="period-selector">
        <label>选择期号：</label>
        <select id="periodSelect"><option value="">-- 选择期号 --</option></select>
        <input type="text" id="periodManual" placeholder="输入期号如2026077" style="width:145px">
        <button class="btn" id="queryBtn">查询</button>
      </div>
      <div class="data-status live" id="dataStatus"></div>
    </div>

    <div class="card">
      <div class="card-title">输入投注号码</div>
      <div class="input-section">
        <div class="input-grid" id="inputGrid"></div>
        <div class="period-input-row">
          <label style="font-size:0.85rem;color:var(--text-light)">投注期号：</label>
          <input type="text" id="betPeriod" placeholder="默认当前期" maxlength="7">
          <button class="btn primary" id="addBtn">添加对奖</button>
          <button class="btn" id="clearAllBtn">清空全部</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">对奖结果 <span id="resultCount" style="font-weight:400;font-size:0.8rem"></span></div>
      <div id="resultsList"><div class="empty-tip">暂无对奖记录</div></div>
    </div>
  </div>

  <!-- ========== 2. 历史追溯 ========== -->
  <div class="tab-content" id="tab-history">
    <div class="card">
      <div class="card-title">号码历史中奖查询</div>
      <div class="hist-check-form">
        <div class="hist-inputs" id="histInputGrid">
          <div class="ball-input-wrap"><span class="label">红1</span><input type="text" class="red" maxlength="2" data-idx="0"></div>
          <div class="ball-input-wrap"><span class="label">红2</span><input type="text" class="red" maxlength="2" data-idx="1"></div>
          <div class="ball-input-wrap"><span class="label">红3</span><input type="text" class="red" maxlength="2" data-idx="2"></div>
          <div class="ball-input-wrap"><span class="label">红4</span><input type="text" class="red" maxlength="2" data-idx="3"></div>
          <div class="ball-input-wrap"><span class="label">红5</span><input type="text" class="red" maxlength="2" data-idx="4"></div>
          <div class="ball-input-wrap"><span class="label">红6</span><input type="text" class="red" maxlength="2" data-idx="5"></div>
          <div class="ball-input-wrap" style="border-left:1px solid var(--border);padding-left:4px"><span class="label">蓝</span><input type="text" class="blue" maxlength="2" data-idx="6"></div>
        </div>
        <div class="hist-actions">
          <button class="btn primary" id="historyCheckBtn">查询历史中奖记录</button>
          <button class="btn" id="historyClearBtn">清空</button>
        </div>
        <div class="hist-filter">
          <label>显示等级：</label>
          <button class="hist-filter-btn active" data-level="1">1</button>
          <button class="hist-filter-btn active" data-level="2">2</button>
          <button class="hist-filter-btn active" data-level="3">3</button>
          <button class="hist-filter-btn active" data-level="4">4</button>
          <button class="hist-filter-btn active" data-level="5">5</button>
          <button class="hist-filter-btn active" data-level="6">6</button>
          <span style="font-size:0.7rem;color:var(--text-light);margin-left:4px">(含福运奖)</span>
        </div>
      </div>
      <div id="historyResult" class="hist-result"></div>
    </div>
  </div>

  <!-- ========== 3. 算号器 ========== -->
  <div class="tab-content" id="tab-generator">
    <div class="card">
      <div class="card-title">随机选号</div>
      <div class="generator-controls"><button class="btn primary" id="generateBtn">重新算号</button></div>
      <div class="random-results" id="randomResults"></div>
      <div class="selected-balls">
        <div class="selected-title">已选号码</div>
        <div class="selected-list" id="selectedList"><span style="font-size:0.8rem;color:var(--text-light)">点击每组右侧"+"添加</span></div>
      </div>
      <div class="add-to-check"><button class="btn primary" id="addSelectedToCheckBtn">添加所有已选到对奖列表</button></div>
    </div>
  </div>

  <!-- ========== 4. 走势图 ========== -->
  <div class="tab-content" id="tab-trend">
    <div class="card">
      <div class="card-title">基本走势图</div>
      <div class="trend-controls">
        <div class="range-select">
          <label>从：</label>
          <select id="trendStart"><option value="">最早</option></select>
          <label>到：</label>
          <select id="trendEnd"><option value="">最新</option></select>
          <button class="btn" id="trendApplyBtn">刷新</button>
        </div>
      </div>
      <div class="trend-container"><table class="trend-table" id="trendTable"></table></div>
    </div>
  </div>

  <!-- ========== 5. 玩法说明 ========== -->
  <div class="tab-content" id="tab-rule">
    <div class="card">
      <div class="card-title">玩法说明</div>
      <div class="rule-section">
        <p><strong>双色球玩法规则：</strong>双色球投注区分为红球号码区和蓝球号码区，红球号码范围为01～33，蓝球号码范围为01～16。每期开出6个红球和1个蓝球作为中奖号码。</p>
        <p><strong>中奖规则：</strong></p>
        <table class="rule-table">
          <thead><tr><th>奖等</th><th>红球命中</th><th>蓝球命中</th><th>奖金</th></tr></thead>
          <tbody id="ruleTableBody"></tbody>
        </table>
        <p><strong>●实心圆</strong> = 命中，<strong>○空心圆</strong> = 未命中。</p>
        <p style="font-size:0.8rem;color:var(--text-light)">* 福运奖为双色球2026年新增奖项，命中3个红球即可获得。</p>
      </div>
    </div>
  </div>

  <div class="footer">双色球对奖助手 v1.7</div>
</div>

<script>
(function(){
  const VERSION='1.7';
  const API_BASE='https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq';

  // 中奖规则（含福运奖）
  const PRIZE_TABLE=[
    {level:1,red:6,blue:1,name:'一等奖',amount:'浮动奖金（约500万-1000万元）'},
    {level:2,red:6,blue:0,name:'二等奖',amount:'浮动奖金（约几十万元）'},
    {level:3,red:5,blue:1,name:'三等奖',amount:'3000元'},
    {level:4,red:5,blue:0,name:'四等奖',amount:'200元'},
    {level:4,red:4,blue:1,name:'四等奖',amount:'200元'},
    {level:5,red:4,blue:0,name:'五等奖',amount:'10元'},
    {level:5,red:3,blue:1,name:'五等奖',amount:'10元'},
    {level:6,red:2,blue:1,name:'六等奖',amount:'5元'},
    {level:6,red:1,blue:1,name:'六等奖',amount:'5元'},
    {level:6,red:0,blue:1,name:'六等奖',amount:'5元'},
    {level:6,red:3,blue:0,name:'福运奖',amount:'5元'},
  ];

  // 玩法说明的数据
  const RULE_ROWS=[
    {name:'一等奖',red:6,blue:true,amount:'浮动奖金（约500万-1000万元）'},
    {name:'二等奖',red:6,blue:false,amount:'浮动奖金（约几十万元）'},
    {name:'三等奖',red:5,blue:true,amount:'3000元'},
    {name:'四等奖',red:5,blue:false,amount:'200元'},
    {name:'四等奖',red:4,blue:true,amount:'200元'},
    {name:'五等奖',red:4,blue:false,amount:'10元'},
    {name:'五等奖',red:3,blue:true,amount:'10元'},
    {name:'六等奖',red:2,blue:true,amount:'5元'},
    {name:'六等奖',red:1,blue:true,amount:'5元'},
    {name:'六等奖',red:0,blue:true,amount:'5元'},
    {name:'福运奖',red:3,blue:false,amount:'5元'},
  ];

  let drawData=[],currentDraw=null,results=[],isLiveData=false,selectedRandom=[];
  let historyFilterLevel=6,historyPage=0,historyPageSize=10,lastHistoryMatches=[];

  // ========== 数据加载 ==========
  const CACHE_KEY='ssq_data_cache';
  const STALE_KEY='ssq_stale_flag';
  async function loadData(){
    // 1. 先从本地JSON加载完整数据库
    let jsonLoaded=false;
    try{
      const r=await fetch('ssq_data.json');
      if(r.ok){drawData=await r.json();jsonLoaded=true}
    }catch(e){}
    // 2. 如果JSON加载失败，尝试localStorage缓存
    if(!jsonLoaded){
      try{
        const cached=localStorage.getItem(CACHE_KEY);
        if(cached){drawData=JSON.parse(cached);if(drawData.length>0)jsonLoaded=true}
      }catch(e){}
    }
    if(!jsonLoaded){
      // 3. 本地完全失败，尝试API代理
      await tryLocalProxy(true);
      if(drawData.length===0)drawData=[...FALLBACK];
    }
    // 4. 排序并渲染
    drawData.sort((a,b)=>b.code.localeCompare(a.code));
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(drawData))}catch(e){}
    onDataReady();
    // 5. 后台检查更新
    checkForUpdates();
  }
  async function checkForUpdates(){
    // 标记数据可能过时，下次启动时重新检查
    try{
      await tryLocalProxy(false);
    }catch(e){}
  }
  async function tryLocalProxy(isInitial){
    // 通过本地服务器代理获取最新数据
    try{
      const r=await fetch('/api/latest',{cache:'no-store'});
      if(!r.ok)return;
      const latest=await r.json();
      if(!Array.isArray(latest)||latest.length===0)return;
      const existing=new Set(drawData.map(d=>d.code));
      let hasNew=false;
      latest.forEach(item=>{
        if(!existing.has(item.code)){
          drawData.push(item);
          hasNew=true;
        }
      });
      if(hasNew){
        drawData.sort((a,b)=>b.code.localeCompare(a.code));
        isLiveData=true;
        try{localStorage.setItem(CACHE_KEY,JSON.stringify(drawData))}catch(e){}
      }
      if(!isInitial&&hasNew){
        currentDraw=drawData[0];
        document.getElementById('betPeriod').value=currentDraw?currentDraw.code:'';
        populatePeriodSelect();
        renderDrawInfo();
        updateDataStatus();
        populateTrendPeriods();
      }
    }catch(e){}
  }

  // 内置降级数据
  const FALLBACK=[
    {code:'2026077',date:'2026-07-07',red:'01,04,05,14,18,25',blue:'04'},
    {code:'2026076',date:'2026-07-05',red:'01,03,19,20,24,25',blue:'07'},
    {code:'2026075',date:'2026-07-02',red:'08,12,18,21,24,30',blue:'01'},
    {code:'2026074',date:'2026-06-30',red:'02,23,24,26,28,32',blue:'04'},
    {code:'2026073',date:'2026-06-28',red:'09,10,13,16,19,21',blue:'08'},
    {code:'2026072',date:'2026-06-25',red:'07,08,12,15,17,21',blue:'01'},
    {code:'2026071',date:'2026-06-23',red:'03,08,19,25,31,33',blue:'05'},
    {code:'2026070',date:'2026-06-21',red:'03,06,08,14,26,27',blue:'08'},
    {code:'2026069',date:'2026-06-18',red:'12,14,16,17,18,32',blue:'08'},
    {code:'2026068',date:'2026-06-16',red:'03,05,16,18,29,32',blue:'04'},
    {code:'2026067',date:'2026-06-14',red:'04,19,27,29,30,32',blue:'13'},
  ];

  function onDataReady(){
    currentDraw=drawData[0];
    document.getElementById('betPeriod').value=currentDraw?currentDraw.code:'';
    populatePeriodSelect();
    renderDrawInfo();
    updateDataStatus();
    populateTrendPeriods();
    renderTrend();
    renderRuleTable();
  }

  function updateDataStatus(){
    const el=document.getElementById('dataStatus');
    el.className=isLiveData?'data-status live':'data-status fallback';
    if(isLiveData){
      el.textContent=`数据来源：中国福利彩票官网（实时更新，共${drawData.length}期）`;
    }else{
      el.textContent=`本地数据库（共${drawData.length}期）— 使用 python3 server.py 启动以获取实时更新`;
    }
  }

  // ========== 对奖页 ==========
  function initBallsInput(){
    const grid=document.getElementById('inputGrid');
    grid.innerHTML='';
    const inputs=[];
    for(let i=0;i<6;i++){
      const w=document.createElement('div');w.className='ball-input-wrap';
      w.innerHTML=`<span class="label">红${i+1}</span><input type="text" class="ball-input red" data-idx="${i}" maxlength="2" inputmode="numeric">`;
      grid.appendChild(w);inputs.push(w.querySelector('input'));
    }
    const bw=document.createElement('div');bw.className='ball-input-wrap blue-col';
    bw.innerHTML=`<span class="label">蓝</span><input type="text" class="ball-input blue" data-idx="blue" maxlength="2" inputmode="numeric">`;
    grid.appendChild(bw);inputs.push(bw.querySelector('input'));
    setupInputNavigation(inputs);
  }

  function setupInputNavigation(inputs){
    inputs.forEach((inp,idx)=>{
      inp.addEventListener('input',function(){
        let v=this.value.replace(/\D/g,'');if(v.length>2)v=v.slice(0,2);this.value=v;
        if(v.length===2){
          const isBlue=this.dataset.idx==='blue';const max=isBlue?16:33;
          const num=parseInt(v);
          if(num<1||num>max)this.style.borderColor='#ff6666';
          else{this.style.borderColor=isBlue?'var(--blue)':'var(--red)';if(idx<inputs.length-1)inputs[idx+1].focus()}
        }
      });
      inp.addEventListener('keydown',function(e){
        if(e.key==='Enter'){addResult();return}
        if(e.key==='ArrowRight'&&idx<inputs.length-1){e.preventDefault();inputs[idx+1].focus();return}
        if(e.key==='ArrowLeft'&&idx>0){e.preventDefault();inputs[idx-1].focus();return}
        if((e.key==='Backspace'||e.key==='Delete')&&this.value===''&&idx>0){e.preventDefault();inputs[idx-1].focus();inputs[idx-1].value=''}
      });
    });
  }

  function populatePeriodSelect(){
    const sel=document.getElementById('periodSelect');
    sel.innerHTML='<option value="">-- 选择期号 --</option>';
    drawData.forEach(d=>{const o=document.createElement('option');o.value=d.code;o.textContent=d.code+' ('+d.date+')';sel.appendChild(o)});
    if(currentDraw)sel.value=currentDraw.code;
  }
  function renderDrawInfo(){
    const area=document.getElementById('drawArea');
    if(!currentDraw){area.innerHTML='<div class="error-msg">暂无开奖数据</div>';return}
    const reds=currentDraw.red.split(',').map(n=>n.trim());
    area.innerHTML=`<div class="draw-info"><div><div class="draw-period">第 ${currentDraw.code} 期</div><div class="draw-date">开奖日期：${currentDraw.date}</div></div></div><div class="balls-row">${reds.map(n=>`<span class="ball red">${n}</span>`).join('')}<span class="ball-divider"></span><span class="ball blue">${currentDraw.blue.trim()}</span></div>`;
  }
  function queryPeriod(code){
    if(!code)return;code=code.trim();
    // 尝试多种匹配方式
    let found=drawData.find(d=>d.code===code);
    // 如果精确匹配失败，尝试智能匹配
    if(!found){
      // 如果输入的是短码（如"076"），尝试匹配后缀
      if(code.length<=3){
        found=drawData.find(d=>d.code.endsWith(code));
      }
      // 如果输入的是6位（如"202607"），尝试前缀匹配
      else if(code.length===6){
        found=drawData.find(d=>d.code.startsWith(code));
      }
      // 7位已经是完整码，上面已尝试过精确匹配
    }
    if(found){currentDraw=found;document.getElementById('periodSelect').value=found.code;document.getElementById('periodManual').value='';renderDrawInfo();recheckAll()}
    else{alert('未找到该期数据：'+code+'\n提示：完整期号为7位数字，如"2026076"；也可输入后3位，如"076"')}
  }
  function parseBalls(inputs){
    const reds=[];
    for(let i=0;i<6;i++){const v=inputs[i].value.trim();if(!v)return{error:'请填完所有红球'};const n=parseInt(v);if(isNaN(n)||n<1||n>33)return{error:'红球范围1-33'};const pn=String(n).padStart(2,'0');if(reds.includes(pn))return{error:'红球不能重复'};reds.push(pn)}
    const bv=inputs[6].value.trim();if(!bv)return{error:'请填写蓝球'};const bn=parseInt(bv);if(isNaN(bn)||bn<1||bn>16)return{error:'蓝球范围1-16'};return{reds,blue:String(bn).padStart(2,'0')};
  }
  function checkPrize(userRed,userBlue,winRed,winBlue){
    const redMatch=userRed.filter(n=>winRed.includes(n));const blueMatch=(userBlue===winBlue);
    const rCount=redMatch.length;const bCount=blueMatch?1:0;
    const prize=PRIZE_TABLE.find(p=>p.red===rCount&&p.blue===bCount);
    return{redMatch,blueMatch,redCount:rCount,blueCount:bCount,prizeLevel:prize?prize.level:0,prizeName:prize?prize.name:'未中奖',prizeAmount:prize?prize.amount:'0元',isWin:!!prize};
  }
  function addResult(){
    const inputs=document.querySelectorAll('#inputGrid .ball-input');
    const parsed=parseBalls(Array.from(inputs));if(parsed.error){alert(parsed.error);return}
    let periodCode=document.getElementById('betPeriod').value.trim();
    if(!periodCode)periodCode=currentDraw?currentDraw.code:'';if(!periodCode){alert('请输入期号');return}
    const winItem=drawData.find(d=>d.code===periodCode);
    if(!winItem){doAddResult(parsed.reds,parsed.blue,periodCode,null);queryPeriod(periodCode);return}
    doAddResult(parsed.reds,parsed.blue,periodCode,winItem);
  }
  function doAddResult(ur,ub,pc,wi){
    let r={id:Date.now()+Math.random(),userRed:[...ur],userBlue:ub,periodCode:pc,winRed:wi?wi.red.split(',').map(n=>n.trim()):null,winBlue:wi?wi.blue.trim():null,winDate:wi?wi.date:null,checked:false};
    if(wi){Object.assign(r,checkPrize(r.userRed,r.userBlue,r.winRed,r.winBlue));r.checked=true}
    results.push(r);clearInputs();renderResults();
  }
  function recheckAll(){results.forEach(r=>{const wi=drawData.find(d=>d.code===r.periodCode);if(wi){r.winRed=wi.red.split(',').map(n=>n.trim());r.winBlue=wi.blue.trim();r.winDate=wi.date;Object.assign(r,checkPrize(r.userRed,r.userBlue,r.winRed,r.winBlue));r.checked=true}});renderResults()}
  function clearInputs(){const is=document.querySelectorAll('#inputGrid .ball-input');is.forEach(i=>i.value='');is[0].focus()}
  function removeResult(id){results=results.filter(r=>r.id!==id);renderResults()}
  function clearAllResults(){if(results.length===0)return;if(confirm('确定清空全部对奖记录？')){results=[];renderResults()}}
  function renderResults(){
    const list=document.getElementById('resultsList');const cnt=document.getElementById('resultCount');
    cnt.textContent=results.length>0?`（共${results.length}条）`:'';
    if(results.length===0){list.innerHTML='<div class="empty-tip">暂无对奖记录</div>';return}
    list.innerHTML=results.map(r=>{
      if(!r.checked)return`<div class="result-card"><div class="result-header"><span class="result-period">第 ${r.periodCode} 期 - 等待数据</span><button class="btn danger" onclick="window._rm(${r.id})">删除</button></div><div class="result-balls">${r.userRed.map(n=>`<span class="ball small red">${n}</span>`).join('')}<span class="ball-divider"></span><span class="ball small blue">${r.userBlue}</span></div></div>`;
      const ms=new Set(r.redMatch||[]);
      return`<div class="result-card ${r.isWin?'win':''}"><div class="result-header"><span class="result-period">第 ${r.periodCode} 期 (${r.winDate||''})</span><div style="display:flex;gap:6px;align-items:center"><span class="result-status ${r.isWin?'win':'lose'}">${r.prizeName}</span><button class="btn danger" onclick="window._rm(${r.id})">删除</button></div></div>
      <div class="matched-label">你的号码：</div>
      <div class="result-balls">${r.userRed.map(n=>`<span class="ball small red ${ms.has(n)?'':'hollow'}">${n}</span>`).join('')}<span class="ball-divider"></span><span class="ball small blue ${r.blueMatch?'':'hollow'}">${r.userBlue}</span></div>
      <div class="matched-label">开奖号码：</div>
      <div class="result-balls">${r.winRed.map(n=>`<span class="ball small red">${n}</span>`).join('')}<span class="ball-divider"></span><span class="ball small blue">${r.winBlue}</span></div>
      <div class="result-detail"><div class="prize-summary"><span>命中：红球 ${r.redCount} 个${r.blueMatch?' + 蓝球':''}</span><span class="prize-amount">${r.isWin?r.prizeAmount:'未中奖'}</span></div></div></div>`;
    }).join('');
  }
  window._rm=removeResult;

  // ========== 历史追溯 ==========
  function initHistInputs(){
    const inputs=document.querySelectorAll('#histInputGrid input');
    setupInputNavigation(Array.from(inputs));
  }
  function historyCheck(){
    const inputs=document.querySelectorAll('#histInputGrid input');
    const parsed=parseBalls(Array.from(inputs));if(parsed.error){alert(parsed.error);return}
    const matches=[];
    drawData.forEach(period=>{
      const wr=period.red.split(',').map(n=>n.trim());
      const redMatch=parsed.reds.filter(n=>wr.includes(n));const blueMatch=(parsed.blue===period.blue.trim());
      const prize=PRIZE_TABLE.find(p=>p.red===redMatch.length&&p.blue===(blueMatch?1:0));
      if(prize)matches.push({period,redMatch,blueMatch,prize});
    });
    lastHistoryMatches=matches;
    historyPage=0;
    renderHistoryResults();
  }
  function renderHistoryResults(){
    const container=document.getElementById('historyResult');
    // 过滤
    const filtered=lastHistoryMatches.filter(m=>m.prize.level<=historyFilterLevel);
    const levelCounts={};filtered.forEach(m=>{levelCounts[m.prize.level]=(levelCounts[m.prize.level]||0)+1});
    const totalPages=Math.ceil(filtered.length/historyPageSize);
    const page=filtered.slice(historyPage*historyPageSize,(historyPage+1)*historyPageSize);

    let html='';
    if(filtered.length===0){
      html+=`<div class="hist-summary"><strong>在当前查询范围内，这组号码未中过${historyFilterLevel}等奖及以上奖项。</strong></div>`;
    }else{
      html+=`<div class="hist-summary"><strong>查询结果：</strong> ${historyFilterLevel===6?'显示全部':`显示1-${historyFilterLevel}等奖`}，共 ${filtered.length} 条记录。`;
      Object.entries(levelCounts).sort((a,b)=>a[0]-b[0]).forEach(([lv,cnt])=>{
        const name=PRIZE_TABLE.find(p=>p.level===parseInt(lv)).name;
        html+=`<span class="hist-total-item">${name}：<strong>${cnt}</strong>次</span>`;
      });
      html+=`</div>`;
      page.forEach(m=>{
        html+=`<div class="hist-result-item win"><div class="hist-meta"><span>第 ${m.period.code} 期 (${m.period.date})</span><span>${m.prize.name} - ${m.prize.amount}</span></div><div class="hist-detail">命中：${m.redMatch.map(n=>`<span class="ball xs red">${n}</span>`).join('')} ${m.blueMatch?`<span class="ball xs blue">${m.period.blue.trim()}</span>`:`<span class="ball xs blue hollow">${m.period.blue.trim()}</span>`}</div></div>`;
      });
    }
    if(totalPages>1){
      html+=`<div class="hist-pagination">
        <button class="btn small" ${historyPage===0?'disabled':''} id="histPrevBtn">上一页</button>
        <span style="font-size:0.8rem">${historyPage+1} / ${totalPages}</span>
        <button class="btn small" ${historyPage>=totalPages-1?'disabled':''} id="histNextBtn">下一页</button>
      </div>`;
    }
    container.innerHTML=html;
    // 绑定分页按钮
    const prev=document.getElementById('histPrevBtn');if(prev)prev.onclick=()=>{historyPage--;renderHistoryResults()};
    const next=document.getElementById('histNextBtn');if(next)next.onclick=()=>{historyPage++;renderHistoryResults()};
  }
  function historyClear(){document.querySelectorAll('#histInputGrid input').forEach(i=>i.value='');document.getElementById('historyResult').innerHTML='';lastHistoryMatches=[]}

  // ========== 历史追溯过滤开关 ==========
  function initHistFilter(){
    document.querySelectorAll('.hist-filter-btn').forEach(btn=>{
      btn.addEventListener('click',function(){
        const lv=parseInt(this.dataset.level);
        const allBtns=document.querySelectorAll('.hist-filter-btn');
        allBtns.forEach(b=>{
          const bl=parseInt(b.dataset.level);
          if(bl<=lv)b.classList.add('active');else b.classList.remove('active');
        });
        historyFilterLevel=lv;
        if(lastHistoryMatches.length>0){historyPage=0;renderHistoryResults()}
      });
    });
  }

  // ========== 算号器 ==========
  function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
  function generateOne(){
    const allRed=Array.from({length:33},(_,i)=>String(i+1).padStart(2,'0'));
    const allBlue=Array.from({length:16},(_,i)=>String(i+1).padStart(2,'0'));
    const red=shuffle(allRed).slice(0,6).sort((a,b)=>parseInt(a)-parseInt(b));
    return{id:Date.now()+Math.random(),red,blue:shuffle(allBlue)[0],added:false};
  }
  function generateFive(){const r=[];for(let i=0;i<5;i++)r.push(generateOne());return r}
  function renderRandom(results){
    document.getElementById('randomResults').innerHTML=results.map((r,idx)=>`
      <div class="random-card"><div class="random-number">${r.red.map(n=>`<span class="ball small red">${n}</span>`).join('')}<span class="ball-divider"></span><span class="ball small blue">${r.blue}</span></div><button class="btn small primary" onclick="window._addR(${r.id})">+ 添加</button></div>`).join('');
  }
  function addRandom(id){const item=window._cr.find(r=>r.id===id);if(!item||selectedRandom.find(s=>s.id===id))return;selectedRandom.push(item);item.added=true;renderSelected()}
  function removeSelected(id){selectedRandom=selectedRandom.filter(s=>s.id!==id);if(window._cr){const x=window._cr.find(r=>r.id===id);if(x)x.added=false}renderSelected()}
  function renderSelected(){
    const c=document.getElementById('selectedList');
    if(selectedRandom.length===0){c.innerHTML='<span style="font-size:0.8rem;color:var(--text-light)">点击每组右侧"+"添加</span>';return}
    c.innerHTML=selectedRandom.map(s=>`<div class="selected-item"><span>${s.red.join(' ')} + ${s.blue} <span class="remove" onclick="window._rmS(${s.id})">×</span></span></div>`).join('');
  }
  function addSelectedToCheck(){
    if(selectedRandom.length===0){alert('没有已选号码');return}
    selectedRandom.forEach(s=>{doAddResult([...s.red],s.blue,currentDraw?currentDraw.code:'')});
    selectedRandom=[];renderSelected();document.querySelector('.tab-btn[data-tab="check"]').click();
  }
  window._addR=addRandom;window._rmS=removeSelected;

  // ========== 走势图 ==========
  function populateTrendPeriods(){
    [document.getElementById('trendStart'),document.getElementById('trendEnd')].forEach(sel=>{
      sel.innerHTML='<option value="">-- 选择 --</option>';
      drawData.forEach(d=>{const o=document.createElement('option');o.value=d.code;o.textContent=d.code+' ('+d.date+')';sel.appendChild(o)});
    });
    if(drawData.length>0){
      // 默认显示最近100期
      const end=drawData[0].code;
      const startIdx=Math.min(99,drawData.length-1);
      const start=drawData[startIdx].code;
      document.getElementById('trendStart').value=start;
      document.getElementById('trendEnd').value=end;
    }
  }
  function renderTrend(){
    if(drawData.length===0)return;
    const startVal=document.getElementById('trendStart').value;
    const endVal=document.getElementById('trendEnd').value;
    let periods=drawData;
    if(startVal&&endVal){
      const si=drawData.findIndex(d=>d.code===startVal);const ei=drawData.findIndex(d=>d.code===endVal);
      if(si>=0&&ei>=0)periods=drawData.slice(Math.min(si,ei),Math.max(si,ei)+1);
    }
    const redFreq={};for(let i=1;i<=33;i++)redFreq[String(i).padStart(2,'0')]=0;
    const blueFreq={};for(let i=1;i<=16;i++)blueFreq[String(i).padStart(2,'0')]=0;
    periods.forEach(p=>{p.red.split(',').forEach(n=>redFreq[n.trim()]++);blueFreq[p.blue.trim()]++});
    const maxR=Math.max(...Object.values(redFreq),1);
    let html=`<thead><tr><th style="min-width:60px">期号</th><th style="min-width:45px">日期</th><th colspan="33">红球 01-33</th><th>蓝球</th></tr></thead><tbody>`;
    periods.reverse().forEach(p=>{
      const reds=new Set(p.red.split(',').map(n=>n.trim()));
      html+=`<tr><td class="trend-period">${p.code}</td><td class="trend-date">${p.date.slice(5)}</td>`;
      for(let i=1;i<=33;i++){const n=String(i).padStart(2,'0');const f=redFreq[n];if(reds.has(n))html+=`<td><div class="trend-ball red">${n}</div>${f>0?`<div class="trend-bar red" style="width:${f/maxR*100}%"></div>`:''}</td>`;else html+=`<td><div class="trend-miss">${f}</div>${f>0?`<div class="trend-bar red" style="width:${f/maxR*100}%"></div>`:''}</td>`}
      const blue=p.blue.trim();const bf=blueFreq[blue];
      html+=`<td><div class="trend-ball blue">${blue}</div>${bf>0?`<div class="trend-bar blue" style="width:${bf/maxR*100}%"></div>`:''}</td></tr>`;
    });
    html+='</tbody>';document.getElementById('trendTable').innerHTML=html;
  }

  // ========== 玩法说明 ==========
  function renderRuleTable(){
    const tbody=document.getElementById('ruleTableBody');
    tbody.innerHTML=RULE_ROWS.map(row=>{
      let redHtml='';for(let i=0;i<6;i++)redHtml+=`<span class="ball xs red${i>=row.red?' hollow':''}">${i<row.red?String(i+1).padStart(2,'0'):''}</span>`;
      let blueHtml=row.blue?`<span class="ball xs blue">◆</span>`:`<span class="ball xs blue hollow">◇</span>`;
      return`<tr><td>${row.name}</td><td><div class="ball-row">${redHtml}</div></td><td>${blueHtml}</td><td>${row.amount}</td></tr>`;
    }).join('');
  }

  // ========== Tabs ==========
  function initTabs(){
    document.querySelectorAll('.tab-btn').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));this.classList.add('active');document.getElementById('tab-'+this.dataset.tab).classList.add('active');if(this.dataset.tab==='trend')renderTrend()})});
  }

  // ========== 初始化 ==========
  async function init(){
    initBallsInput();initHistInputs();initHistFilter();initTabs();
    // 提前绑定事件处理器，避免loadData异常导致按钮无响应
    document.getElementById('queryBtn').addEventListener('click',()=>{const man=document.getElementById('periodManual').value.trim();if(man){queryPeriod(man);return}const sel=document.getElementById('periodSelect').value;if(sel)queryPeriod(sel)});
    document.getElementById('periodSelect').addEventListener('change',function(){if(this.value){document.getElementById('periodManual').value='';queryPeriod(this.value)}});
    document.getElementById('periodManual').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('queryBtn').click()});
    document.getElementById('addBtn').addEventListener('click',addResult);
    document.getElementById('clearAllBtn').addEventListener('click',clearAllResults);
    document.getElementById('betPeriod').addEventListener('focus',function(){if(!this.value&&currentDraw)this.value=currentDraw.code});
    document.getElementById('historyCheckBtn').addEventListener('click',historyCheck);
    document.getElementById('historyClearBtn').addEventListener('click',historyClear);
    document.getElementById('generateBtn').addEventListener('click',()=>{window._cr=generateFive();renderRandom(window._cr);renderSelected()});
    document.getElementById('addSelectedToCheckBtn').addEventListener('click',addSelectedToCheck);
    document.getElementById('trendApplyBtn').addEventListener('click',renderTrend);
    window._cr=generateFive();renderRandom(window._cr);renderSelected();
    // 最后加载数据
    await loadData();
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
