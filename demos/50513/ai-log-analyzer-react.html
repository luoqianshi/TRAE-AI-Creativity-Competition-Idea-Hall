<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 日志分析助手 — LogAI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- React 18 CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>

    <!-- ===== 设计规范 CSS 变量 ===== -->
    <style>
    :root {
      --color-primary: #10B981;
      --color-primary-light: #34D399;
      --color-primary-dark: #059669;
      --color-primary-tint: rgba(16, 185, 129, 0.12);
      --bg-base: #0F1117;
      --bg-surface: #161822;
      --bg-surface-elevated: #1C1F2E;
      --bg-surface-overlay: #242738;
      --bg-hover: rgba(255, 255, 255, 0.04);
      --text-primary: #F1F5F9;
      --text-muted: #94A3B8;
      --text-tertiary: #64748B;
      --text-inverse: #0F1117;
      --border-default: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-strong: rgba(255, 255, 255, 0.16);
      --state-success: #10B981;
      --state-warning: #F59E0B;
      --state-error: #EF4444;
      --state-info: #06B6D4;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 9999px;
      --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
    /* 隐藏滚动条 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Lucide 图标基础样式 */
    [data-icon] {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      background-color: currentColor;
    }
    /* 终端日志滚动动画 */
    @keyframes logFlow {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50%); }
    }
    .log-flow-track { animation: logFlow 20s linear infinite; }
    .log-line {
      opacity: 0;
      animation: logFadeIn 0.6s ease forwards;
    }
    @keyframes logFadeIn {
      0% { opacity: 0; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .log-line:nth-child(1) { animation-delay: 0s; }
    .log-line:nth-child(2) { animation-delay: 0.3s; }
    .log-line:nth-child(3) { animation-delay: 0.6s; }
    .log-line:nth-child(4) { animation-delay: 0.9s; }
    .log-line:nth-child(5) { animation-delay: 1.2s; }
    .log-line:nth-child(6) { animation-delay: 1.5s; }
    .log-line:nth-child(7) { animation-delay: 1.8s; }
    .log-line:nth-child(8) { animation-delay: 2.1s; }
    /* 流程连接线 */
    .flow-line {
      position: relative;
      height: 2px;
      background: var(--color-primary-tint);
      flex-shrink: 0;
    }
    .flow-line::before, .flow-line::after {
      content: '';
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 0 6px rgba(16,185,129,0.6);
    }
    .flow-line::before { left: 20%; }
    .flow-line::after { right: 20%; }
    .flow-line-v {
      position: relative;
      width: 2px;
      background: var(--color-primary-tint);
      flex-shrink: 0;
    }
    .flow-line-v::before, .flow-line-v::after {
      content: '';
      position: absolute;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 6px rgba(16,185,129,0.6);
    }
    .flow-line-v::before { top: 25%; }
    .flow-line-v::after { bottom: 25%; }
    </style>

    <style type="text/tailwindcss">
    @theme inline {
      --color-primary: var(--color-primary);
    }
    @layer base {
      body { background: var(--color-background); color: var(--color-foreground); }
    }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background:var(--bg-base);color:var(--text-primary);">
    <div id="root"></div>

    <!-- ===== React 应用入口 ===== -->
    <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    /* ─────────────────────────────────────────────
       工具函数：渲染后调用 Lucide 图标
    ───────────────────────────────────────────── */
    function useLucide() {
      useEffect(() => {
        if (window.lucide) {
          lucide.createIcons();
        }
      });
    }

    /* ─────────────────────────────────────────────
       导航栏组件
    ───────────────────────────────────────────── */
    function Navbar({ currentPage, onNavigate }) {
      useLucide();

      const navItems = [
        { key: 'home', label: '首页' },
        { key: 'features', label: '核心功能' },
        { key: 'workflow', label: '使用流程' },
        { key: 'preview', label: '界面预览' },
        { key: 'value', label: '价值与场景' },
      ];

      return (
        <nav className="fixed top-0 left-0 right-0 z-50"
          style={{ background: 'rgba(15,17,23,0.85)', backdropFilter: 'blur(12px)', borderBottom: '1px solid var(--border-default)' }}>
          <div className="mx-auto max-w-[1200px] px-6 h-16 flex items-center justify-between">
            {/* Logo */}
            <div className="flex items-center gap-2 cursor-pointer" onClick={() => onNavigate('home')}
              style={{ color: 'var(--text-primary)' }}>
              <i data-lucide="terminal" className="w-5 h-5" style={{ color: 'var(--color-primary)' }}></i>
              <span className="text-lg font-bold tracking-tight">LogAI</span>
            </div>
            {/* 导航项 */}
            <div className="hidden md:flex items-center gap-6">
              {navItems.map(item => (
                <button key={item.key} onClick={() => onNavigate(item.key)}
                  className="text-sm font-medium transition-colors hover:opacity-80 bg-transparent border-0 cursor-pointer p-0"
                  style={{ color: currentPage === item.key ? 'var(--color-primary)' : 'var(--text-muted)' }}>
                  {item.label}
                </button>
              ))}
            </div>
            {/* CTA 按钮 */}
            <button onClick={() => onNavigate('preview')}
              className="hidden sm:inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium transition-opacity hover:opacity-90 border-0 cursor-pointer"
              style={{ background: 'var(--color-primary)', color: 'var(--text-inverse)' }}>
              立即体验 <i data-lucide="arrow-right" className="w-4 h-4"></i>
            </button>
          </div>
        </nav>
      );
    }

    /* ─────────────────────────────────────────────
       页脚组件
    ───────────────────────────────────────────── */
    function Footer({ onNavigate }) {
      const links = [
        { key: 'features', label: '核心功能' },
        { key: 'workflow', label: '使用流程' },
        { key: 'preview', label: '界面预览' },
        { key: 'value', label: '价值与场景' },
      ];
      return (
        <footer style={{ background: 'var(--bg-surface)', borderTop: '1px solid var(--border-default)' }}>
          <div className="mx-auto max-w-[1200px] px-6 py-10 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p className="text-sm" style={{ color: 'var(--text-tertiary)' }}>&copy; 2024 AI 日志分析助手</p>
            <div className="flex items-center gap-6">
              {links.map(link => (
                <button key={link.key} onClick={() => onNavigate(link.key)}
                  className="text-sm transition-colors hover:opacity-80 bg-transparent border-0 cursor-pointer p-0"
                  style={{ color: 'var(--text-tertiary)' }}>
                  {link.label}
                </button>
              ))}
            </div>
          </div>
        </footer>
      );
    }

    /* ─────────────────────────────────────────────
       首页组件
       Hero + 价值主张 + 目标用户 + 关键指标
    ───────────────────────────────────────────── */
    function HomePage({ onNavigate }) {
      useLucide();

      const logLines = [
        { time: '[2024-01-15 09:23:01]', level: 'INFO',  levelColor: 'var(--color-primary)', msg: 'service.gateway — Request received POST /api/v2/analyze' },
        { time: '[2024-01-15 09:23:01]', level: 'INFO',  levelColor: 'var(--color-primary)', msg: 'service.parser  — Parsing log batch size=12,480' },
        { time: '[2024-01-15 09:23:02]', level: 'WARN',  levelColor: 'var(--state-warning)', msg: 'ml.anomaly     — Elevated error rate detected threshold=0.05 actual=0.12' },
        { time: '[2024-01-15 09:23:02]', level: 'ERROR', levelColor: 'var(--state-error)', msg: 'db.connection  — Connection timeout host=db-replica-03 elapsed=5,200ms' },
        { time: '[2024-01-15 09:23:03]', level: 'INFO',  levelColor: 'var(--color-primary)', msg: 'ai.rootcause   — Root cause identified: db-replica-03 network partition' },
        { time: '[2024-01-15 09:23:03]', level: 'INFO',  levelColor: 'var(--color-primary)', msg: 'ai.report      — Analysis report generated confidence=0.95' },
        { time: '[2024-01-15 09:23:04]', level: 'DEBUG', levelColor: 'var(--state-info)', msg: 'notifier        — Alert dispatched channel=slack severity=P2' },
        { time: '[2024-01-15 09:23:04]', level: 'INFO',  levelColor: 'var(--color-primary)', msg: 'service.gateway — Response sent 200 OK latency=3,240ms' },
      ];

      return (
        <div>
          {/* ===== Hero 区域 ===== */}
          <section className="relative pt-16 overflow-hidden" style={{ background: 'var(--bg-base)' }}>
            {/* 渐变背景 */}
            <div className="absolute inset-0 z-0"
              style={{ background: 'linear-gradient(135deg, rgba(16,185,129,0.08) 0%, var(--bg-base) 40%, rgba(6,182,212,0.06) 70%, var(--bg-base) 100%)' }}>
            </div>
            <div className="absolute inset-0 z-0"
              style={{ background: 'radial-gradient(ellipse at 30% 20%, rgba(16,185,129,0.12) 0%, transparent 50%)' }}>
            </div>

            <div className="relative z-10 mx-auto max-w-[1200px] px-6 pt-24 pb-16 text-center">
              <h1 className="text-4xl sm:text-5xl lg:text-6xl font-bold leading-tight tracking-tight"
                style={{ color: 'var(--text-primary)' }}>
                让日志分析变得<span style={{ color: 'var(--color-primary)' }}>简单高效</span>
              </h1>
              <p className="mt-6 text-lg sm:text-xl max-w-2xl mx-auto"
                style={{ color: 'var(--text-muted)' }}>
                AI 驱动的智能日志分析助手，自动识别异常、定位根因、生成分析报告
              </p>
              <div className="mt-10 flex flex-wrap items-center justify-center gap-4">
                <button onClick={() => onNavigate('preview')}
                  className="inline-flex items-center gap-2 px-6 py-3 rounded-lg text-base font-semibold transition-opacity hover:opacity-90 border-0 cursor-pointer"
                  style={{ background: 'var(--color-primary)', color: 'var(--text-inverse)' }}>
                  <i data-lucide="play" className="w-4 h-4"></i> 开始使用
                </button>
                <button onClick={() => onNavigate('features')}
                  className="inline-flex items-center gap-2 px-6 py-3 rounded-lg text-base font-medium transition-opacity hover:opacity-80 border-0 cursor-pointer"
                  style={{ border: '1px solid var(--border-strong)', color: 'var(--text-primary)', background: 'transparent' }}>
                  了解更多 <i data-lucide="chevron-down" className="w-4 h-4"></i>
                </button>
              </div>
            </div>

            {/* ===== 终端日志流 ===== */}
            <div className="relative z-10 mx-auto max-w-[900px] px-6 pb-20">
              <div className="rounded-xl overflow-hidden"
                style={{ background: 'var(--bg-surface)', border: '1px solid var(--border-default)' }}>
                <div className="flex items-center gap-2 px-4 py-3"
                  style={{ borderBottom: '1px solid var(--border-default)' }}>
                  <span className="w-3 h-3 rounded-full" style={{ background: 'var(--state-error)' }}></span>
                  <span className="w-3 h-3 rounded-full" style={{ background: 'var(--state-warning)' }}></span>
                  <span className="w-3 h-3 rounded-full" style={{ background: 'var(--state-success)' }}></span>
                  <span className="ml-2 text-xs" style={{ color: 'var(--text-tertiary)', fontFamily: 'var(--font-mono)' }}>log-analysis — ai-assistant</span>
                </div>
                <div className="p-4 overflow-hidden" style={{ maxHeight: '220px', fontFamily: 'var(--font-mono)', fontSize: '13px', lineHeight: '1.7' }}>
                  <div className="log-flow-track">
                    {logLines.map((line, i) => (
                      <div key={i} className="log-line">
                        <span style={{ color: 'var(--text-tertiary)' }}>{line.time}</span>{' '}
                        <span style={{ color: line.levelColor }}>{line.level}</span>{'  '}
                        <span>{line.msg}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ===== 价值主张卡片 ===== */}
          <section className="py-20" style={{ background: 'var(--bg-surface)' }}>
            <div className="mx-auto max-w-[1200px] px-6">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {[
                  { icon: 'brain', title: '智能解析', desc: 'AI 自动理解日志语义，提取关键事件和异常模式' },
                  { icon: 'zap', title: '极速定位', desc: '从海量日志中秒级锁定问题根因，排查效率提升 10 倍' },
                  { icon: 'message-circle', title: '通俗易懂', desc: '生成自然语言分析结论，非专业人员也能快速理解' },
                ].map((item, i) => (
                  <div key={i} className="rounded-xl p-8 transition-colors hover:opacity-95"
                    style={{ background: 'var(--bg-surface-elevated)', border: '1px solid var(--border-default)' }}>
                    <div className="w-12 h-12 rounded-lg flex items-center justify-center mb-5"
                      style={{ background: 'var(--color-primary-tint)' }}>
                      <i data-lucide={item.icon} className="w-6 h-6" style={{ color: 'var(--color-primary)' }}></i>
                    </div>
                    <h3 className="text-xl font-semibold mb-3" style={{ color: 'var(--text-primary)' }}>{item.title}</h3>
                    <p className="text-base leading-relaxed" style={{ color: 'var(--text-muted)' }}>{item.desc}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ===== 目标用户标签 ===== */}
          <section className="py-20" style={{ background: 'var(--bg-base)' }}>
            <div className="mx-auto max-w-[1200px] px-6 text-center">
              <h2 className="text-3xl font-bold mb-12" style={{ color: 'var(--text-primary)' }}>面向这些用户</h2>
              <div className="flex flex-wrap items-center justify-center gap-4">
                {[
                  { icon: 'server', label: '运维工程师' },
                  { icon: 'shield', label: '安全分析师' },
                  { icon: 'code-2', label: '开发测试' },
                  { icon: 'building', label: '企业管理者' },
                ].map((tag, i) => (
                  <div key={i} className="inline-flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-medium transition-opacity hover:opacity-80"
                    style={{ border: '1px solid var(--border-strong)', color: 'var(--text-primary)', background: 'var(--bg-surface-elevated)' }}>
                    <i data-lucide={tag.icon} className="w-4 h-4" style={{ color: 'var(--color-primary)' }}></i> {tag.label}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* ===== 关键指标 ===== */}
          <section className="py-16" style={{ background: 'var(--bg-surface)' }}>
            <div className="mx-auto max-w-[1200px] px-6">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-8 text-center">
                {[
                  { value: '10x', label: '排查效率提升' },
                  { value: '95%', label: '异常识别准确率' },
                  { value: '< 5s', label: '分析响应时间' },
                ].map((m, i) => (
                  <div key={i}>
                    <div className="text-5xl sm:text-6xl font-bold" style={{ color: 'var(--color-primary)' }}>{m.value}</div>
                    <p className="mt-2 text-base" style={{ color: 'var(--text-muted)' }}>{m.label}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>
        </div>
      );
    }

    /* ─────────────────────────────────────────────
       核心功能页面
       6 个功能卡片 2x3 网格
    ───────────────────────────────────────────── */
    function FeaturesPage({ onNavigate }) {
      useLucide();

      const features = [
        {
          icon: 'file-json',
          title: '智能日志解析',
          desc: '自动识别日志格式（JSON、文本、syslog），结构化提取关键字段',
          mock: (
            <div className="rounded-lg p-3 text-xs leading-relaxed"
              style={{ background: 'var(--bg-base)', border: '1px solid var(--border-subtle)', fontFamily: 'var(--font-mono)' }}>
              <div><span style={{ color: 'var(--text-tertiary)' }}>[2024-03-15 10:23:01]</span> <span style={{ color: 'var(--state-info)' }}>INFO</span> <span style={{ color: 'var(--color-primary)' }}>service</span>=<span style={{ color: 'var(--text-primary)' }}>api-gateway</span></div>
              <div><span style={{ color: 'var(--text-tertiary)' }}>[2024-03-15 10:23:02]</span> <span style={{ color: 'var(--state-warning)' }}>WARN</span> <span style={{ color: 'var(--color-primary)' }}>latency</span>=<span style={{ color: 'var(--state-warning)' }}>2350ms</span></div>
              <div><span style={{ color: 'var(--text-tertiary)' }}>[2024-03-15 10:23:03]</span> <span style={{ color: 'var(--state-error)' }}>ERR</span>  <span style={{ color: 'var(--color-primary)' }}>status</span>=<span style={{ color: 'var(--state-error)' }}>503</span></div>
            </div>
          ),
        },
        {
          icon: 'shield-alert',
          title: '异常检测与告警',
          desc: '基于机器学习的异常模式识别，实时发现异常行为并触发告警',
          mock: (
            <div className="rounded-lg p-3 flex items-end gap-1 h-16"
              style={{ background: 'var(--bg-base)', border: '1px solid var(--border-subtle)' }}>
              {[30,50,45,90,60,35,40,85,30,25].map((h, i) => (
                <div key={i} className="flex-1 rounded-sm" style={{ height: h + '%', background: h > 70 ? 'var(--state-error)' : 'var(--color-primary)', opacity: 0.85 }}></div>
              ))}
            </div>
          ),
        },
        {
          icon: 'git-branch',
          title: '根因分析',
          desc: '关联多条日志事件，自动推断问题根因并生成分析链路',
          mock: (
            <div className="rounded-lg p-3 text-xs flex flex-col items-center gap-1.5"
              style={{ background: 'var(--bg-base)', border: '1px solid var(--border-subtle)' }}>
              <div className="w-full rounded px-2 py-1 text-center text-white" style={{ background: 'var(--state-error)' }}>服务响应超时 503</div>
              <div style={{ color: 'var(--text-tertiary)' }}>|</div>
              <div className="w-full rounded px-2 py-1 text-center" style={{ background: 'var(--bg-surface-overlay)', color: 'var(--text-primary)' }}>DB 连接池耗尽</div>
              <div style={{ color: 'var(--text-tertiary)' }}>|</div>
              <div className="w-full rounded px-2 py-1 text-center text-white" style={{ background: 'var(--state-warning)' }}>慢查询锁表</div>
            </div>
          ),
        },
        {
          icon: 'message-square-text',
          title: '自然语言查询',
          desc: '用自然语言提问，AI 自动转换为查询条件并检索相关日志',
          mock: (
            <div className="rounded-lg p-3" style={{ background: 'var(--bg-base)', border: '1px solid var(--border-subtle)' }}>
              <div className="flex items-center gap-2 mb-2 text-xs" style={{ color: 'var(--color-primary)' }}>
                <i data-lucide="user" className="w-3.5 h-3.5"></i>
                <span style={{ color: 'var(--text-primary)' }}>为什么服务响应超时？</span>
              </div>
              <div className="flex items-start gap-2 text-xs" style={{ color: 'var(--text-muted)', fontFamily: 'var(--font-mono)' }}>
                <i data-lucide="bot" className="w-3.5 h-3.5 mt-0.5 shrink-0" style={{ color: 'var(--color-primary)' }}></i>
                <span>发现 <b style={{ color: 'var(--state-error)' }}>12 条</b>超时日志，集中在 api-gateway</span>
              </div>
            </div>
          ),
        },
        {
          icon: 'file-text',
          title: '日志摘要生成',
          desc: '自动总结日志核心内容，快速了解系统运行状态',
          mock: (
            <div className="rounded-lg p-3 text-xs leading-relaxed"
              style={{ background: 'var(--bg-base)', border: '1px solid var(--border-subtle)' }}>
              <div className="flex items-center gap-1.5 mb-1.5" style={{ color: 'var(--color-primary)' }}>
                <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
