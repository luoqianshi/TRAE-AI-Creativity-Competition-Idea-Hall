<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乡心信箱 — 留守儿童AI匿名情绪书信树洞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background-color: #f9f6ef;
            color: #443a31;
            line-height: 1.7;
            padding: 20px 12px;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e0d8c8;
        }
        h1 {
            font-size: 26px;
            color: #6d4c41;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #88796a;
            font-size: 14px;
        }
        .card {
            background: #fffdf8;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(141,118,96,0.1);
            margin-bottom: 24px;
        }
        .card-title {
            font-size: 18px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .mood-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .mood-item {
            padding: 8px 14px;
            border: 1px solid #dcd2c0;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .mood-item.active {
            background: #e8dccd;
            border-color: #b89e81;
        }
        textarea {
            width: 100%;
            min-height: 160px;
            padding: 14px;
            border: 1px solid #ddd4c2;
            border-radius: 12px;
            background: #fff;
            resize: vertical;
            font-size: 15px;
            outline: none;
        }
        textarea:focus {
            border-color: #b89e81;
            box-shadow: 0 0 0 3px rgba(184,158,129,0.15);
        }
        .tip-text {
            font-size: 13px;
            color: #91806e;
            margin: 8px 0 16px;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-send {
            background: #8d6e63;
            color: white;
        }
        .btn-send:hover {
            background: #795548;
        }
        .btn-clear {
            background: #e0d8c8;
            color: #554438;
            margin-left: 10px;
        }
        .reply-box {
            margin-top: 20px;
            padding: 18px;
            background: #f6efe3;
            border-radius: 12px;
            display: none;
        }
        .level-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .level-mild {
            background: #d4edda;
            color: #155724;
        }
        .level-mid {
            background: #fff3cd;
            color: #856404;
        }
        .level-danger {
            background: #f8d7da;
            color: #721c24;
        }
        .warn-notice {
            margin-top:12px;
            padding:10px;
            background:#f8d7da;
            border-radius:8px;
            font-size:14px;
            display:none;
        }
        .save-btn {
            margin-top:12px;
            background:#6d4c41;
            color:#fff;
        }
        .storage-item {
            padding:14px;
            border:1px solid #e0d8c8;
            border-radius:12px;
            margin-bottom:12px;
        }
        .storage-title {
            font-weight:600;
            margin-bottom:6px;
        }
        .empty-tip {
            color:#999;
            text-align:center;
            padding:20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>乡心信箱</h1>
            <div class="subtitle">留守儿童AI匿名情绪书信树洞 · 全程匿名保护隐私</div>
        </header>

        <!-- 写信区域 -->
        <div class="card">
            <div class="card-title">📮 写下你的心事（无需填写姓名）</div>
            <div class="mood-group">
                <div class="mood-item" data-val="想家">想家难过</div>
                <div class="mood-item" data-val="孤单">内心孤单</div>
                <div class="mood-item" data-val="自卑">觉得自卑</div>
                <div class="mood-item" data-val="校园矛盾">和同学闹矛盾</div>
                <div class="mood-item" data-val="压抑">心里很压抑</div>
            </div>
            <textarea id="letterInput" placeholder="把想说的话写在这里，不会记录你的任何个人信息..."></textarea>
            <div class="tip-text">提示：所有信件完全匿名，不会收集姓名、学校、电话等信息</div>
            <div>
                <button class="btn btn-send" id="sendBtn">投递信件，获取AI回信</button>
                <button class="btn btn-clear" id="clearBtn">清空内容</button>
            </div>

            <!-- AI回信区域 -->
            <div class="reply-box" id="replyBox">
                <div class="level-tag" id="levelTag"></div>
                <div id="replyContent"></div>
                <div class="warn-notice" id="dangerWarn">
                    ⚠️ 系统检测到较重负面情绪，后台将生成脱敏简报推送给乡村心理社工，悄悄守护你
                </div>
                <button class="btn save-btn" id="saveBtn">收藏这封回信</button>
            </div>
        </div>

        <!-- 信件收藏库 -->
        <div class="card">
            <div class="card-title">⭐ 我的珍藏书信库（本地保存，仅自己可见）</div>
            <div id="storageList">
                <div class="empty-tip">暂无收藏的信件，投递后可收藏AI回信</div>
            </div>
        </div>
    </div>

    <script>
        // 选中心情标签
        const moodItems = document.querySelectorAll('.mood-item');
        let selectMood = "";
        moodItems.forEach(item=>{
            item.onclick = ()=>{
                moodItems.forEach(i=>i.classList.remove('active'));
                item.classList.add('active');
                selectMood = item.dataset.val;
            }
        })

        const letterInput = document.getElementById('letterInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const replyBox = document.getElementById('replyBox');
        const levelTag = document.getElementById('levelTag');
        const replyContent = document.getElementById('replyContent');
        const dangerWarn = document.getElementById('dangerWarn');
        const saveBtn = document.getElementById('saveBtn');
        const storageList = document.getElementById('storageList');

        // 本地存储信件
        let letterStorage = JSON.parse(localStorage.getItem('xiangxinLetters')) || [];
        renderStorage();

        // 清空输入
        clearBtn.onclick = ()=>{
            letterInput.value = "";
            replyBox.style.display = "none";
            dangerWarn.style.display = "none";
            moodItems.forEach(i=>i.classList.remove('active'));
            selectMood = "";
        }

        // 投递信件逻辑
        sendBtn.onclick = ()=>{
            let text = letterInput.value.trim();
            if(!text){
                alert("请写下你的心事再投递哦");
                return;
            }
            replyBox.style.display = "block";
            dangerWarn.style.display = "none";

            // 简易情绪判定
            let level, tagClass, replyText;
            const dangerWords = ["活着没意思","不想上学","没人在乎我","难过到哭","不想活下去","很痛苦"];
            const midWords = ["每天都很难受","常常偷偷哭","没有人懂我","压力很大"];
            let isDanger = dangerWords.some(w=>text.includes(w));
            let isMid = midWords.some(w=>text.includes(w));

            if(isDanger){
                level = "高危情绪";
                tagClass = "level-danger";
                dangerWarn.style.display = "block";
                replyText = "我读到了你心里沉甸甸的委屈，真的特别心疼你。你现在很难熬没关系，不用一个人硬扛。已经悄悄把你的心事匿名发给乡村心理老师，会有人温柔陪着你。你值得被好好对待，一切都会慢慢变好的。";
            }else if(isMid){
                level = "中度负面情绪";
                tagClass = "level-mid";
                replyText = "能感受到你藏在心里的孤单和难过，很多留守小朋友都和你有一样的感受，你不是一个人。累的时候可以多和我说说话，不用强迫自己坚强，你的情绪值得被好好接纳。";
            }else{
                level = "轻度情绪倾诉";
                tagClass = "level-mild";
                replyText = "谢谢你愿意把心里话讲给我听。想念家人、偶尔孤单都是很正常的事情，把烦恼写出来就会轻松很多啦。好好照顾自己，你超棒的！";
            }

            levelTag.className = "level-tag " + tagClass;
            levelTag.innerText = level;
            replyContent.innerText = replyText;
        }

        // 收藏信件
        saveBtn.onclick = ()=>{
            const text = letterInput.value.trim();
            const reply = replyContent.innerText;
            const mood = selectMood || "未选择心情";
            const data = {
                time: new Date().toLocaleString(),
                mood: mood,
                letter: text,
                reply: reply
            }
            letterStorage.unshift(data);
            localStorage.setItem('xiangxinLetters', JSON.stringify(letterStorage));
            renderStorage();
            alert("已收藏至你的书信库，仅本地可见");
        }

        // 渲染收藏列表
        function renderStorage(){
            if(letterStorage.length === 0){
                storageList.innerHTML = `<div class="empty-tip">暂无收藏的信件，投递后可收藏AI回信</div>`;
                return;
            }
            let html = "";
            letterStorage.forEach(item=>{
                html += `
                <div class="storage-item">
                    <div class="storage-title">${item.time} · 心情：${item.mood}</div>
                    <div>你的信：${item.letter}</div>
                    <div style="margin-top:8px;color:#6d4c41">AI回信：${item.reply}</div>
                </div>
                `
            })
            storageList.innerHTML = html;
        }
    </script>
</body>
</html>
