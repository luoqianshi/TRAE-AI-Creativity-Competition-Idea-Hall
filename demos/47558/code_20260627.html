<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFlow智工助手 | Trae创造者大赛Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
        }
        h1 {
            color: #38bdf8;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .desc {
            color: #94a3b8;
            font-size: 14px;
        }
        .container {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 24px;
        }
        @media (max-width:768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .skill-panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
        }
        .skill-panel h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #cbd5e1;
        }
        .skill-item {
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .skill-item:hover {
            background: #334155;
        }
        .skill-item.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }
        .main-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        textarea {
            width: 100%;
            min-height: 120px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            color: #e2e8f0;
            font-size: 15px;
            resize: vertical;
            outline: none;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        button {
            width: 160px;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .result-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 16px;
            min-height: 280px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .loading {
            color: #38bdf8;
        }
        .tag {
            display: inline-block;
            font-size: 12px;
            padding: 2px 8px;
            background: rgba(56,189,248,0.15);
            color: #38bdf8;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>CodeFlow 智工助手</h1>
        <p class="desc">Trae创造者大赛 · 编程全流程智能体Demo | 学习工作赛道</p>
    </header>

    <div class="container">
        <div class="skill-panel">
            <h3>Trae智能体技能库</h3>
            <div class="skill-item active" data-skill="code-gen">1. 代码自动生成</div>
            <div class="skill-item" data-skill="bug-fix">2. 代码报错排查修复</div>
            <div class="skill-item" data-skill="doc-write">3. 接口/项目文档生成</div>
            <div class="skill-item" data-skill="comment">4. 批量添加代码注释</div>
            <div class="skill-item" data-skill="test-case">5. 自动生成测试用例</div>
            <div class="skill-item" data-skill="arch">6. 项目架构梳理</div>
        </div>

        <div class="main-box">
            <span class="tag">当前选中技能：代码自动生成</span>
            <textarea id="inputBox" placeholder="输入你的编程需求，例如：用Python写读取CSV数据绘图代码、写一个Vue3待办组件、修复这段报错代码..."></textarea>
            <button id="runBtn">调用Trae智能体执行</button>
            <div class="result-box" id="resultBox">智能体输出结果将展示在此处，支持代码、文档、方案完整渲染</div>
        </div>
    </div>

    <script>
        // 技能切换逻辑
        const skillItems = document.querySelectorAll('.skill-item');
        const tag = document.querySelector('.tag');
        const skillMap = {
            "code-gen": "代码自动生成",
            "bug-fix": "代码报错排查修复",
            "doc-write": "接口/项目文档生成",
            "comment": "批量添加代码注释",
            "test-case": "自动生成测试用例",
            "arch": "项目架构梳理"
        };
        skillItems.forEach(item => {
            item.onclick = () => {
                skillItems.forEach(s => s.classList.remove('active'));
                item.classList.add('active');
                const key = item.dataset.skill;
                tag.innerText = `当前选中技能：${skillMap[key]}`;
            }
        })

        // 模拟Trae Agent调用演示
        const runBtn = document.getElementById('runBtn');
        const inputBox = document.getElementById('inputBox');
        const resultBox = document.getElementById('resultBox');

        runBtn.onclick = async () => {
            const content = inputBox.value.trim();
            if (!content) {
                resultBox.innerText = "请输入编程需求后再执行！";
                return;
            }
            runBtn.disabled = true;
            resultBox.innerHTML = '<span class="loading">Trae智能体正在调度技能、分析需求、生成方案中...</span>';
            
            // 模拟接口延迟
            await new Promise(res => setTimeout(res, 1800));
            const curSkill = document.querySelector('.skill-item.active').dataset.skill;
            let mockRes = "";
            if(curSkill === "code-gen") {
                mockRes = `【Trae智能体-代码生成技能输出】
需求：${content}
# 生成完整可运行代码
# 配套说明、使用步骤、依赖安装命令
# 自动兼容主流框架，支持复制直接运行`;
            } else if(curSkill === "bug-fix") {
                mockRes = `【Trae智能体-排障修复技能输出】
1. 错误根因定位
2. 修正后完整代码
3. 同类问题规避方案
4. 调试排查建议`;
            } else {
                mockRes = `【Trae智能体-${skillMap[curSkill]}技能输出】
基于你输入的需求，Trae多智能体协同完成完整产出，包含标准化格式、可直接复制使用`;
            }
            resultBox.innerText = mockRes;
            runBtn.disabled = false;
        }
    </script>
</body>
</html>
