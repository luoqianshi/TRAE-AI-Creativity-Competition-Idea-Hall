<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智旅规划 - 智能旅行规划助手</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #0ea5e9;
            --accent: #f59e0b;
            --warning: #fbbf24;
            --success: #10b981;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 首页样式 */
        .home-page {
            background: var(--bg-white);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            margin-top: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background: var(--bg-light);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-white);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .tag {
            padding: 8px 16px;
            border: 2px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--bg-light);
            font-size: 0.9rem;
        }

        .tag:hover {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.05);
        }

        .tag.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 16px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        /* 结果页样式 */
        .result-page {
            display: none;
            animation: fadeIn 0.6s ease-out;
        }

        .result-header {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .result-header h2 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .budget-bar {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }

        .budget-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .budget-progress {
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .budget-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%);
            transition: width 0.5s ease-out;
        }

        .day-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .day-tab {
            padding: 12px 24px;
            background: var(--bg-white);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            font-weight: 600;
        }

        .day-tab:hover {
            border-color: var(--primary);
        }

        .day-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .timeline {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .timeline-item {
            position: relative;
            padding-left: 40px;
            padding-bottom: 30px;
            border-left: 2px solid var(--border);
            margin-left: 10px;
        }

        .timeline-item:last-child {
            border-left: none;
            padding-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -9px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--bg-white);
            box-shadow: 0 0 0 2px var(--primary);
        }

        .timeline-content {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .timeline-content:hover {
            background: var(--bg-white);
            box-shadow: var(--shadow);
            transform: translateX(4px);
        }

        .timeline-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .timeline-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .timeline-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .timeline-meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .rating {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .rating-high {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .rating-medium {
            background: rgba(251, 191, 36, 0.1);
            color: var(--warning);
        }

        .rating-low {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        /* 地图视图 */
        .map-view {
            display: none;
            background: var(--bg-white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }

        #map {
            height: 500px;
            border-radius: 12px;
            margin-top: 16px;
        }

        .map-btn {
            background: var(--secondary);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-bottom: 16px;
        }

        .map-btn:hover {
            background: #0284c7;
            transform: translateY(-2px);
        }

        /* 详情模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-white);
            border-radius: 24px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translate(-50%, -40%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--bg-light);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: var(--border);
        }

        .image-carousel {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 8px;
        }

        .carousel-img {
            min-width: 200px;
            height: 150px;
            background: var(--bg-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .detail-section p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .detail-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .meta-card {
            background: var(--bg-light);
            padding: 12px;
            border-radius: 12px;
        }

        .meta-card-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .meta-card-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* 分享海报 */
        .share-btn {
            background: linear-gradient(135deg, var(--accent) 0%, #d97706 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-top: 16px;
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .share-poster {
            display: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            padding: 32px;
            margin-top: 20px;
            color: white;
        }

        .poster-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .poster-content {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .poster-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .poster-item:last-child {
            border-bottom: none;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .home-page {
                padding: 24px;
                margin-top: 20px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .timeline-item {
                padding-left: 30px;
            }

            .modal-content {
                padding: 24px;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div class="home-page" id="homePage">
            <div class="header">
                <h1>🌍 智旅规划</h1>
                <p>智能旅行规划助手，让每一次出行都完美</p>
            </div>

            <form id="travelForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>出发地</label>
                        <input type="text" id="departure" placeholder="当前位置" value="北京">
                    </div>

                    <div class="form-group">
                        <label>目的地</label>
                        <select id="destination">
                            <option value="">请选择目的地</option>
                            <option value="唐山">唐山 - 工业遗产之旅</option>
                            <option value="保定">保定 - 历史文化名城</option>
                            <option value="承德">承德 - 皇家园林风光</option>
                            <option value="秦皇岛">秦皇岛 - 海滨度假胜地</option>
                            <option value="张家口">张家口 - 冬奥冰雪之城</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>出行天数</label>
                        <select id="days">
                            <option value="1">1天</option>
                            <option value="2">2天</option>
                            <option value="3" selected>3天</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>同行人员</label>
                        <select id="companions">
                            <option value="单人">单人出行</option>
                            <option value="情侣">情侣出游</option>
                            <option value="家庭">家庭亲子</option>
                            <option value="朋友">朋友聚会</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>预算范围（元）</label>
                        <input type="number" id="budget" placeholder="请输入预算" value="3000">
                    </div>
                </div>

                <div class="form-group">
                    <label>兴趣标签</label>
                    <div class="tags-container" id="tagsContainer">
                        <div class="tag" data-tag="美食">🍜 美食</div>
                        <div class="tag" data-tag="历史">🏛️ 历史</div>
                        <div class="tag" data-tag="自然">🌳 自然</div>
                        <div class="tag" data-tag="购物">🛍️ 购物</div>
                        <div class="tag" data-tag="亲子">👨‍👩‍👧 亲子</div>
                        <div class="tag" data-tag="文化">📚 文化</div>
                        <div class="tag" data-tag="运动">⚽ 运动</div>
                        <div class="tag" data-tag="摄影">📷 摄影</div>
                    </div>
                </div>

                <button type="submit" class="btn-primary">开始规划旅程 ✈️</button>
            </form>
        </div>

        <!-- 结果页 -->
        <div class="result-page" id="resultPage">
            <div class="result-header">
                <h2 id="tripTitle">保定3日游</h2>
                <p id="tripSummary">历史文化名城探索之旅</p>
                
                <div class="budget-bar">
                    <div class="budget-info">
                        <span>预算使用情况</span>
                        <span id="budgetText">¥1,850 / ¥3,000</span>
                    </div>
                    <div class="budget-progress">
                        <div class="budget-progress-fill" id="budgetProgress" style="width: 62%"></div>
                    </div>
                </div>

                <button class="map-btn" onclick="toggleMapView()">🗺️ 查看地图视图</button>
                <button class="share-btn" onclick="generatePoster()">📤 生成分享海报</button>
            </div>

            <div class="day-tabs" id="dayTabs"></div>

            <div class="timeline" id="timeline"></div>

            <div class="map-view" id="mapView">
                <h3>📍 行程地图</h3>
                <div id="map"></div>
            </div>

            <div class="share-poster" id="sharePoster"></div>
        </div>
    </div>

    <!-- 详情模态框 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modalContent"></div>
        </div>
    </div>

                },
                {
                    day: 3,
                    items: [
                        {
                            time: "09:00 - 12:00",
                            type: "景点",
                            name: "清西陵",
                            desc: "清代皇家陵寝群，世界文化遗产",
                            duration: "3小时",
                            cost: 120,
                            rating: 4.8,
                            lat: 39.3500,
                            lng: 115.3500,
                            images: ["清西陵全景", "皇家建筑", "神道"],
                            openTime: "08:00 - 17:30",
                            address: "保定市易县",
                            phone: "0312-4711111",
                            reviews: [
                                "世界文化遗产，值得一看",
                                "建筑宏伟，历史厚重",
                                "游客不多，体验很好"
                            ]
                        },
                        {
                            time: "12:30 - 14:00",
                            type: "餐饮",
                            name: "易县特色餐厅",
                            desc: "当地特色菜，口味地道",
                            duration: "1.5小时",
                            cost: 100,
                            rating: 4.3,
                            lat: 39.3520,
                            lng: 115.3530,
                            images: ["特色菜品", "餐厅环境", "地方美食"],
                            openTime: "11:00 - 21:00",
                            address: "易县县城",
                            phone: "0312-8222222",
                            reviews: [
                                "味道不错，分量足",
                                "价格实惠",
                                "服务很好"
                            ]
                        },
                        {
                            time: "15:00 - 17:00",
                            type: "景点",
                            name: "易水湖",
                            desc: "北方小桂林，山水风光",
                            duration: "2小时",
                            cost: 60,
                            rating: 4.6,
                            lat: 39.3000,
                            lng: 115.3000,
                            images: ["易水湖全景", "山水风光", "游船"],
                            openTime: "08:00 - 17:00",
                            address: "保定市易县",
                            phone: "0312-8889999",
                            reviews: [
                                "风景很美",
                                "适合放松",
                                "水质很好"
                            ]
                        }
                    ]
                }
            ]
        };

        let currentDay = 0;
        let map = null;
        let selectedTags = [];

        // 标签选择
        document.querySelectorAll('.tag').forEach(tag => {
            tag.addEventListener('click', function() {
                this.classList.toggle('active');
                const tagName = this.dataset.tag;
                if (selectedTags.includes(tagName)) {
                    selectedTags = selectedTags.filter(t => t !== tagName);
                } else {
                    selectedTags.push(tagName);
                }
            });
        });

        // 表单提交
        document.getElementById('travelForm').addEventListener('submit', function(e) {
            e.preventDefault();
            showResultPage();
        });

        function showResultPage() {
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('resultPage').style.display = 'block';
            
            document.getElementById('tripTitle').textContent = tripData.title;
            document.getElementById('tripSummary').textContent = tripData.summary;
            document.getElementById('budgetText').textContent = `¥${tripData.usedBudget.toLocaleString()} / ¥${tripData.budget.toLocaleString()}`;
            
            const percentage = (tripData.usedBudget / tripData.budget * 100).toFixed(0);
            document.getElementById('budgetProgress').style.width = percentage + '%';
            
            renderDayTabs();
            renderTimeline(0);
        }

        function renderDayTabs() {
            const tabsContainer = document.getElementById('dayTabs');
            tabsContainer.innerHTML = '';
            
            tripData.days.forEach((day, index) => {
                const tab = document.createElement('div');
                tab.className = 'day-tab' + (index === 0 ? ' active' : '');
                tab.textContent = `第${day.day}天`;
                tab.onclick = () => switchDay(index);
                tabsContainer.appendChild(tab);
            });
        }

        function switchDay(dayIndex) {
            currentDay = dayIndex;
            document.querySelectorAll('.day-tab').forEach((tab, index) => {
                tab.classList.toggle('active', index === dayIndex);
            });
            renderTimeline(dayIndex);
        }

        function renderTimeline(dayIndex) {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            
            const day = tripData.days[dayIndex];
            day.items.forEach((item, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';
                
                const ratingClass = item.rating >= 4.5 ? 'rating-high' : 
                                  item.rating >= 4.0 ? 'rating-medium' : 'rating-low';
                
                timelineItem.innerHTML = `
                    <div class="timeline-dot"></div>
                    <div class="timeline-content" onclick="showDetail(${dayIndex}, ${index})">
                        <div class="timeline-time">${item.time}</div>
                        <div class="timeline-title">${item.name}</div>
                        <div class="timeline-desc">${item.desc}</div>
                        <div class="timeline-meta">
                            <div class="meta-item">⏱️ ${item.duration}</div>
                            <div class="meta-item">💰 ¥${item.cost}</div>
                            <div class="rating ${ratingClass}">⭐ ${item.rating}</div>
                        </div>
                    </div>
                `;
                
                timeline.appendChild(timelineItem);
            });
        }

        function showDetail(dayIndex, itemIndex) {
            const item = tripData.days[dayIndex].items[itemIndex];
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            
            content.innerHTML = `
                <h2 style="margin-bottom: 20px;">${item.name}</h2>
                
                <div class="image-carousel">
                    ${item.images.map(img => `
                        <div class="carousel-img">${img}</div>
                    `).join('')}
                </div>
                
                <div class="detail-section">
                    <h3>📝 简介</h3>
                    <p>${item.desc}</p>
                </div>
                
                <div class="detail-section">
                    <h3>⭐ 用户评价</h3>
                    ${item.reviews.map(review => `<p>• ${review}</p>`).join('')}
                </div>
                
                <div class="detail-meta">
                    <div class="meta-card">
                        <div class="meta-card-label">开放时间</div>
                        <div class="meta-card-value">${item.openTime}</div>
                    </div>
                    <div class="meta-card">
                        <div class="meta-card-label">地址</div>
                        <div class="meta-card-value">${item.address}</div>
                    </div>
                    <div class="meta-card">
                        <div class="meta-card-label">联系电话</div>
                        <div class="meta-card-value">${item.phone}</div>
                    </div>
                    <div class="meta-card">
                        <div class="meta-card-label">预计费用</div>
                        <div class="meta-card-value">¥${item.cost}</div>
                    </div>
                </div>
                
                <div style="margin-top: 20px;">
                    <button class="btn-primary" onclick="openNavigation(${item.lat}, ${item.lng})">
                        🧭 导航到此
                    </button>
                </div>
            `;
            
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        function openNavigation(lat, lng) {
            window.open(`https://uri.amap.com/marker?position=${lng},${lat}`, '_blank');
        }

        function toggleMapView() {
            const mapView = document.getElementById('mapView');
            if (mapView.style.display === 'none' || !mapView.style.display) {
                mapView.style.display = 'block';
                initMap();
            } else {
                mapView.style.display = 'none';
            }
        }

        function initMap() {
            if (map) {
                map.remove();
            }
            
            map = L.map('map').setView([38.8737, 115.4646], 10);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            const markers = [];
            tripData.days.forEach(day => {
                day.items.forEach(item => {
                    const marker = L.marker([item.lat, item.lng])
                        .addTo(map)
                        .bindPopup(`
                            <strong>${item.name}</strong><br>
                            ${item.type} | ¥${item.cost}<br>
                            ⭐ ${item.rating}
                        `);
                    markers.push(marker);
                });
            });
            
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        function generatePoster() {
            const poster = document.getElementById('sharePoster');
            if (poster.style.display === 'none' || !poster.style.display) {
                poster.style.display = 'block';
                poster.innerHTML = `
                    <div class="poster-title">${tripData.title}</div>
                    <p style="margin-bottom: 20px;">${tripData.summary}</p>
                    <div class="poster-content">
                        ${tripData.days.map(day => `
                            <div style="margin-bottom: 16px;">
                                <h4 style="margin-bottom: 8px;">第${day.day}天</h4>
                                ${day.items.map(item => `
                                    <div class="poster-item">
                                        <span>${item.time} ${item.name}</span>
                                        <span>¥${item.cost}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `).join('')}
                        <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2);">
                            <p>总预算: ¥${tripData.usedBudget.toLocaleString()}</p>
                            <p style="font-size: 0.9rem; opacity: 0.8; margin-top: 8px;">由智旅规划生成</p>
                        </div>
                    </div>
                `;
            } else {
                poster.style.display = 'none';
            }
        }

        // 点击模态框外部关闭
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
