<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>邻舍 · 邻里互助平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    body {
      background: #f5f3ef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      max-width: 400px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06), 0 8px 16px rgba(0,0,0,0.03);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 28px 24px 32px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(145deg, #6B9AC4, #4A7A9C);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: #2D3E50;
      letter-spacing: -0.3px;
    }
    .location {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #F0F4F8;
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 14px;
      color: #3E5C76;
      font-weight: 500;
    }
    .greeting {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .greeting h2 {
      font-size: 26px;
      font-weight: 750;
      color: #1C2C3A;
      line-height: 1.2;
    }
    .greeting p {
      font-size: 15px;
      color: #6A7B8A;
    }
    .quick-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-pill {
      flex: 1 1 auto;
      background: #F8F6F2;
      border-radius: 24px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #3A4C5C;
      font-weight: 550;
      transition: all 0.2s;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .action-pill:hover {
      background: #EBF0F5;
      border-color: #C8D6E0;
    }
    .action-pill span:first-child {
      font-size: 24px;
    }
    .need-section {
      background: #FFFBF5;
      border-radius: 24px;
      padding: 20px;
      border: 1px solid #EDE4D3;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 650;
      color: #40382A;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .need-card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      border: 1px solid #F0EBE0;
    }
    .need-avatar {
      width: 44px;
      height: 44px;
      background: #E8DCC8;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .need-info {
      flex: 1;
    }
    .need-title {
      font-weight: 650;
      font-size: 15px;
      color: #2D2A24;
    }
    .need-meta {
      font-size: 12px;
      color: #8A8070;
      display: flex;
      gap: 12px;
      margin-top: 2px;
    }
    .help-btn {
      background: #6B9AC4;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 13px;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .help-btn:hover {
      background: #4A7A9C;
    }
    .community-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .feed-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid #F0EDE6;
    }
    .feed-icon {
      font-size: 28px;
    }
    .feed-text {
      font-size: 14px;
      color: #3F4A52;
      line-height: 1.4;
    }
    .feed-text strong {
      color: #1E2C38;
    }
    .trust-badge {
      background: #EBF5E8;
      border-radius: 30px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #2A4D2E;
      font-weight: 530;
    }
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #B7AFA2;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">🏘️</div>
        <div class="logo-text">邻舍</div>
      </div>
      <div class="location">
        <span>📍</span> 星月花园 · 3栋
      </div>
    </div>

    <div class="greeting">
      <h2>👋 下午好，小静</h2>
      <p>你的邻居们刚发布了 4 条新需求</p>
    </div>

    <div class="quick-actions">
      <div class="action-pill"><span>🔧</span>借工具</div>
      <div class="action-pill"><span>🐾</span>宠物照看</div>
      <div class="action-pill"><span>📦</span>代收快递</div>
      <div class="action-pill"><span>🧹</span>随手帮忙</div>
    </div>

    <div class="need-section">
      <div class="section-title">📌 附近实时微求助</div>
      <div class="need-card">
        <div class="need-avatar">👵</div>
        <div class="need-info">
          <div class="need-title">帮忙换个灯泡（厨房）</div>
          <div class="need-meta"><span>⏱️ 3分钟前</span><span>📍 5栋1202</span></div>
        </div>
        <button class="help-btn">我来帮</button>
      </div>
      <div class="need-card">
        <div class="need-avatar">🐕</div>
        <div class="need-info">
          <div class="need-title">周六上午求遛狗半小时</div>
          <div class="need-meta"><span>⏱️ 22分钟前</span><span>📍 2栋701</span></div>
        </div>
        <button class="help-btn">我能遛</button>
      </div>
    </div>

    <div class="community-feed">
      <div class="section-title">💬 邻里新鲜事</div>
      <div class="feed-item">
        <div class="feed-icon">🌟</div>
        <div class="feed-text"><strong>小鹿</strong> 刚刚获得了“热心邻居”徽章——已帮助12位邻居</div>
      </div>
      <div class="feed-item">
        <div class="feed-icon">🍰</div>
        <div class="feed-text"><strong>阿芬姨</strong> 烤了太多蛋挞，免费送给6楼的小伙伴，2分钟被领完</div>
      </div>
    </div>

    <div class="trust-badge">
      <span>🛡️</span> 本小区已认证 <strong>136</strong> 位友邻 · 信任值可见
    </div>

    <div class="footer-note">
      让近邻，不止是门牌号 — 邻舍
    </div>
  </div>
</body>
</html>
