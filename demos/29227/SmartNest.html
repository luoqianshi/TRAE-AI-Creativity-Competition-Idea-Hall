<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartNest - 智能家居控制中心">
    <meta name="theme-color" content="#0a0e17">
    <title>SmartNest - 智能家居控制中心</title>
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
    --bg-deep: #0a0e17;
    --bg-surface: #111827;
    --bg-elevated: #1a2236;
    --bg-card: #151d2e;
    --bg-card-hover: #1c2640;
    --border-subtle: rgba(255, 255, 255, 0.06);
    --border-accent: rgba(56, 189, 248, 0.25);

    --cyan-400: #22d3ee;
    --cyan-500: #06b6d4;
    --cyan-glow: rgba(6, 182, 212, 0.3);
    --cyan-dim: rgba(6, 182, 212, 0.08);

    --sky-400: #38bdf8;
    --sky-500: #0ea5e9;
    --blue-400: #60a5fa;
    --blue-500: #3b82f6;

    --emerald-400: #34d399;
    --emerald-500: #10b981;
    --amber-400: #fbbf24;
    --amber-500: #f59e0b;
    --rose-400: #fb7185;
    --rose-500: #f43f5e;
    --violet-400: #a78bfa;
    --violet-500: #8b5cf6;
    --orange-400: #fb923c;
    --orange-500: #f97316;

    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted: #475569;

    --shadow-glow: 0 0 40px rgba(6, 182, 212, 0.1);
    --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.4);
    --shadow-card-active: 0 8px 40px rgba(6, 182, 212, 0.15);

    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

::selection {
    background: var(--cyan-500);
    color: var(--text-primary);
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

.visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* ===== Background atmosphere ===== */
.app-container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
}

.app-container::before {
    content: '';
    position: fixed;
    top: -30%; left: -20%; right: -20%; height: 80%;
    background:
        radial-gradient(ellipse at 30% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 40%, rgba(59, 130, 246, 0.04) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 80%, rgba(139, 92, 246, 0.03) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
}

.app-container::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0;
}

/* ===== Header ===== */
.header {
    position: relative; z-index: 100;
    padding: 1.25rem 2rem;
    background: linear-gradient(180deg, rgba(17, 24, 39, 0.95) 0%, rgba(17, 24, 39, 0.5) 70%, transparent 100%);
    border-bottom: 1px solid var(--border-subtle);
    backdrop-filter: blur(16px);
}

.header-content {
    max-width: 1500px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
}

.logo { display: flex; align-items: center; gap: 0.875rem; }

.logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--cyan-400) 0%, var(--blue-500) 100%);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem;
    box-shadow: 0 4px 20px var(--cyan-glow), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.3s var(--bounce);
    position: relative; overflow: hidden;
}

.logo-icon:hover { transform: rotate(-8deg) scale(1.08); }

.logo-icon::after {
    content: '';
    position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
    animation: shimmer 5s infinite;
}

@keyframes shimmer {
    0% { transform: translateX(-100%) rotate(45deg); }
    100% { transform: translateX(100%) rotate(45deg); }
}

.app-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--cyan-400) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.header-info { display: flex; gap: 1rem; }

.env-item {
    display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
    padding: 0.625rem 1rem;
    background: rgba(255,255,255,0.025);
    border-radius: 14px; border: 1px solid var(--border-subtle);
    transition: all 0.3s var(--ease);
    min-width: 72px;
}

.env-item:hover {
    border-color: var(--border-accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-glow);
}

.env-icon { font-size: 1rem; }
.env-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem; font-weight: 600; color: var(--cyan-400); line-height: 1;
}
.env-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }

/* ===== Main Layout ===== */
.main-content {
    flex: 1; display: flex; gap: 1.75rem;
    padding: 1.75rem 2rem;
    max-width: 1500px; margin: 0 auto; width: 100%;
    position: relative; z-index: 1;
}

/* ===== Sidebar ===== */
.sidebar {
    width: 240px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 1rem;
}

.nav-section {
    background: rgba(255,255,255,0.02);
    border-radius: 20px; padding: 0.75rem;
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(8px);
}

.nav-btn {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.75rem 0.875rem; width: 100%;
    background: transparent; border: none; border-radius: 12px;
    color: var(--text-secondary); cursor: pointer;
    transition: all 0.25s var(--ease);
    font-size: 0.85rem; font-weight: 500; text-align: left;
    position: relative; overflow: hidden;
    font-family: inherit;
}

.nav-btn::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%) scaleY(0);
    width: 3px; height: 40%;
    background: linear-gradient(180deg, var(--cyan-400), var(--blue-500));
    border-radius: 0 3px 3px 0;
    transition: transform 0.3s var(--bounce);
}

.nav-btn:hover {
    background: rgba(255,255,255,0.04);
    color: var(--text-primary);
    transform: translateX(3px);
}

.nav-btn.active {
    background: linear-gradient(135deg, rgba(6,182,212,0.1) 0%, rgba(6,182,212,0.03) 100%);
    color: var(--cyan-300);
}

.nav-btn.active::before { transform: translateY(-50%) scaleY(1); }

.nav-icon { font-size: 1.05rem; width: 22px; text-align: center; transition: transform 0.3s var(--bounce); }
.nav-btn:hover .nav-icon { transform: scale(1.15); }

/* Scene section */
.scene-section {
    background: rgba(255,255,255,0.02);
    border-radius: 20px; padding: 1rem 0.75rem;
    border: 1px solid var(--border-subtle);
}

.section-title {
    font-size: 0.65rem; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 0.75rem; padding-left: 0.5rem;
}

.scene-list { display: flex; flex-direction: column; gap: 0.375rem; }

.scene-btn {
    display: flex; align-items: center; gap: 0.625rem;
    padding: 0.6rem 0.75rem; width: 100%;
    background: transparent; border: 1px solid transparent; border-radius: 12px;
    color: var(--text-secondary); cursor: pointer;
    transition: all 0.25s var(--ease);
    font-size: 0.8rem; font-weight: 500; text-align: left;
    font-family: inherit;
}

.scene-btn:hover {
    background: rgba(6,182,212,0.06);
    color: var(--text-primary);
    border-color: rgba(6,182,212,0.15);
}

.scene-btn.active {
    background: linear-gradient(135deg, rgba(6,182,212,0.15) 0%, rgba(59,130,246,0.08) 100%);
    border-color: rgba(6,182,212,0.3);
    color: var(--cyan-300);
    box-shadow: 0 2px 12px rgba(6,182,212,0.15);
}

.scene-icon { font-size: 1rem; }

/* Energy card */
.energy-card {
    margin-top: auto;
    background: rgba(255,255,255,0.02);
    border-radius: 20px; padding: 1.125rem;
    border: 1px solid var(--border-subtle);
}

.energy-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
.energy-icon { font-size: 1rem; }
.energy-title { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); }

.energy-value { display: flex; align-items: baseline; gap: 0.375rem; margin-bottom: 0.75rem; }
.energy-number {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2rem; font-weight: 700; color: var(--amber-400); line-height: 1;
}
.energy-unit { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

.energy-bar {
    height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 10px; overflow: hidden; margin-bottom: 0.5rem;
}

.energy-bar-fill {
    height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, var(--emerald-500), var(--amber-400), var(--rose-500));
    transition: width 0.8s var(--ease);
}

.energy-hint { font-size: 0.7rem; color: var(--text-muted); }
.energy-down { color: var(--emerald-400); font-weight: 600; }
.energy-up { color: var(--rose-400); font-weight: 600; }

/* ===== Device Board ===== */
.device-board {
    flex: 1; display: flex; flex-direction: column; gap: 1.25rem;
}

.board-header {
    display: flex; justify-content: space-between; align-items: center;
}

.board-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.4rem; font-weight: 600; letter-spacing: -0.01em;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.device-summary {
    display: flex; align-items: center; gap: 0.5rem;
    font-size: 0.8rem; color: var(--text-muted); font-weight: 500;
}

.summary-online { color: var(--cyan-400); font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
.summary-active { color: var(--emerald-400); font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
.summary-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); }

/* ===== Device Grid ===== */
.device-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
    align-content: start;
}

/* ===== Device Card ===== */
.device-card {
    background: var(--bg-card);
    border-radius: 20px; padding: 1.25rem;
    border: 1px solid var(--border-subtle);
    cursor: pointer;
    transition: all 0.35s var(--ease);
    position: relative; overflow: hidden;
    animation: cardIn 0.4s var(--ease) backwards;
}

.device-card:nth-child(1) { animation-delay: 0.03s; }
.device-card:nth-child(2) { animation-delay: 0.06s; }
.device-card:nth-child(3) { animation-delay: 0.09s; }
.device-card:nth-child(4) { animation-delay: 0.12s; }
.device-card:nth-child(5) { animation-delay: 0.15s; }
.device-card:nth-child(6) { animation-delay: 0.18s; }
.device-card:nth-child(7) { animation-delay: 0.21s; }
.device-card:nth-child(8) { animation-delay: 0.24s; }
.device-card:nth-child(9) { animation-delay: 0.27s; }
.device-card:nth-child(10) { animation-delay: 0.3s; }
.device-card:nth-child(11) { animation-delay: 0.33s; }
.device-card:nth-child(12) { animation-delay: 0.36s; }

@keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.device-card::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, var(--device-glow, transparent) 0%, transparent 60%);
    opacity: 0; transition: opacity 0.4s ease;
}

.device-card.on::before { opacity: 1; }

.device-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-card);
    border-color: rgba(255,255,255,0.1);
}

.device-card.on {
    border-color: var(--device-border, var(--border-accent));
    box-shadow: var(--shadow-card-active);
}

.device-card.off { opacity: 0.6; }
.device-card.off:hover { opacity: 0.8; }

.device-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 0.875rem; position: relative; z-index: 1;
}

.device-icon-wrap {
    width: 48px; height: 48px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-subtle);
    transition: all 0.35s var(--ease);
}

.device-card.on .device-icon-wrap {
    background: var(--device-bg, var(--cyan-dim));
    border-color: var(--device-border, var(--border-accent));
    box-shadow: 0 0 20px var(--device-glow, var(--cyan-glow));
}

/* Toggle switch */
.toggle-switch {
    position: relative; width: 48px; height: 26px;
    cursor: pointer;
}

.toggle-switch input { display: none; }

.toggle-track {
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.08);
    border-radius: 13px;
    transition: all 0.3s var(--ease);
    border: 1px solid rgba(255,255,255,0.06);
}

.toggle-switch input:checked + .toggle-track {
    background: var(--device-color, var(--cyan-500));
    border-color: transparent;
    box-shadow: 0 0 16px var(--device-glow, var(--cyan-glow));
}

.toggle-thumb {
    position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px;
    background: #fff; border-radius: 50%;
    transition: all 0.3s var(--bounce);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    pointer-events: none;
}

.toggle-switch input:checked ~ .toggle-thumb {
    left: 25px;
}

.device-info { position: relative; z-index: 1; }

.device-name {
    font-size: 0.95rem; font-weight: 600; color: var(--text-primary);
    margin-bottom: 0.2rem; line-height: 1.3;
}

.device-room {
    font-size: 0.72rem; color: var(--text-muted); font-weight: 500;
    margin-bottom: 0.75rem;
}

.device-status {
    display: flex; align-items: center; gap: 0.375rem;
    font-size: 0.78rem; font-weight: 500;
    position: relative; z-index: 1;
}

.status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.3s ease;
}

.device-card.on .status-dot {
    background: var(--device-color, var(--cyan-500));
    box-shadow: 0 0 8px var(--device-glow, var(--cyan-glow));
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.status-text { color: var(--text-secondary); }
.device-card.on .status-text { color: var(--device-color, var(--cyan-400)); }

/* Slider control on card */
.device-slider {
    margin-top: 0.75rem; position: relative; z-index: 1;
    display: none;
}

.device-card.show-slider .device-slider { display: block; }

.slider-row {
    display: flex; align-items: center; gap: 0.625rem;
}

.slider-label {
    font-size: 0.7rem; color: var(--text-muted); font-weight: 500;
    min-width: 28px; text-align: right;
    font-family: 'Space Grotesk', sans-serif;
}

input[type="range"] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px; outline: none;
    cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--device-color, var(--cyan-500));
    box-shadow: 0 0 10px var(--device-glow, var(--cyan-glow));
    cursor: pointer;
    transition: transform 0.2s var(--bounce);
}

input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
}

input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%; border: none;
    background: var(--device-color, var(--cyan-500));
    box-shadow: 0 0 10px var(--device-glow, var(--cyan-glow));
    cursor: pointer;
}

/* ===== Modal ===== */
.modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    display: none; justify-content: center; align-items: center;
    z-index: 1000; opacity: 0;
    transition: opacity 0.3s var(--ease);
    padding: 1.5rem;
}

.modal-overlay.active { display: flex; opacity: 1; }

.modal {
    background: var(--bg-surface);
    border-radius: 24px; width: 100%; max-width: 480px;
    border: 1px solid var(--border-subtle);
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    transform: scale(0.92) translateY(20px); opacity: 0;
    transition: all 0.4s var(--bounce);
}

.modal-overlay.active .modal { transform: scale(1) translateY(0); opacity: 1; }

.modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.5rem 1.75rem;
    border-bottom: 1px solid var(--border-subtle);
}

.modal-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.2rem; font-weight: 600;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--cyan-400) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}

.close-btn {
    width: 36px; height: 36px; border-radius: 12px;
    border: 1px solid var(--border-subtle);
    background: rgba(255,255,255,0.03);
    color: var(--text-secondary); font-size: 1.4rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.25s var(--ease); line-height: 1;
    font-family: inherit;
}

.close-btn:hover {
    background: rgba(244,63,94,0.1);
    color: var(--rose-400);
    border-color: rgba(244,63,94,0.2);
    transform: rotate(90deg);
}

.modal-body { padding: 1.75rem; }

.modal-device-icon {
    width: 64px; height: 64px; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; margin: 0 auto 1.25rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-subtle);
}

.modal-device-name {
    text-align: center; font-size: 1.1rem; font-weight: 600;
    margin-bottom: 0.25rem;
}

.modal-device-room {
    text-align: center; font-size: 0.8rem; color: var(--text-muted);
    margin-bottom: 1.5rem;
}

.modal-control-group {
    margin-bottom: 1.25rem;
}

.modal-control-label {
    font-size: 0.7rem; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 0.625rem; display: block;
}

.modal-slider-row {
    display: flex; align-items: center; gap: 0.75rem;
}

.modal-slider-value {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.1rem; font-weight: 600;
    color: var(--cyan-400); min-width: 48px; text-align: right;
}

.modal-slider-row input[type="range"] { flex: 1; }

.modal-toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.75rem 0;
    border-top: 1px solid var(--border-subtle);
}

.modal-toggle-label { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; }

.modal-btn {
    width: 100%; padding: 0.875rem;
    background: linear-gradient(135deg, var(--cyan-500) 0%, var(--blue-500) 100%);
    border: none; border-radius: 16px;
    color: #fff; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: all 0.3s var(--ease);
    box-shadow: 0 4px 20px var(--cyan-glow);
    margin-top: 0.5rem; font-family: inherit;
}

.modal-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px var(--cyan-glow);
}

/* ===== Toast ===== */
.toast {
    position: fixed; bottom: 2rem; right: 2rem;
    padding: 0.875rem 1.5rem; border-radius: 16px;
    font-size: 0.85rem; font-weight: 500; color: #fff;
    transform: translateX(150%) scale(0.9); opacity: 0;
    transition: all 0.5s var(--bounce);
    z-index: 2000; display: flex; align-items: center; gap: 0.625rem;
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.toast.show { transform: translateX(0) scale(1); opacity: 1; }
.toast.success { background: linear-gradient(135deg, rgba(16,185,129,0.9), rgba(5,150,105,0.9)); }
.toast.error { background: linear-gradient(135deg, rgba(244,63,94,0.9), rgba(225,29,72,0.9)); }
.toast.info { background: linear-gradient(135deg, rgba(6,182,212,0.9), rgba(59,130,246,0.9)); }

/* ===== Responsive ===== */
@media (max-width: 1100px) {
    .device-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}

@media (max-width: 900px) {
    .main-content { flex-direction: column; padding: 1.25rem; }
    .sidebar {
        width: 100%; flex-direction: row; flex-wrap: wrap; gap: 0.75rem;
    }
    .nav-section { flex: 1; min-width: 180px; }
    .scene-section { flex: 1; min-width: 180px; }
    .energy-card { flex: 1; min-width: 180px; }
    .header-info { gap: 0.5rem; }
    .env-item { padding: 0.5rem 0.75rem; min-width: 60px; }
    .env-value { font-size: 0.95rem; }
    .header { padding: 1rem 1.25rem; }
}

@media (max-width: 600px) {
    .app-title { font-size: 1.3rem; }
    .logo-icon { width: 38px; height: 38px; font-size: 1.15rem; }
    .header-info { display: none; }
    .device-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.75rem; }
    .device-card { padding: 1rem; }
    .device-icon-wrap { width: 40px; height: 40px; font-size: 1.25rem; border-radius: 12px; }
    .modal { border-radius: 20px; }
    .modal-header, .modal-body { padding: 1.25rem; }
}

    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon" role="img" aria-label="SmartNest Logo">🏠</div>
                    <h1 class="app-title">SmartNest</h1>
                </div>
                <div class="header-info" aria-label="环境信息">
                    <div class="env-item" role="status" aria-live="polite">
                        <span class="env-icon" aria-hidden="true">🌡️</span>
                        <span class="env-value" id="envTemp">24°C</span>
                        <span class="env-label">室温</span>
                    </div>
                    <div class="env-item" role="status" aria-live="polite">
                        <span class="env-icon" aria-hidden="true">💧</span>
                        <span class="env-value" id="envHumidity">58%</span>
                        <span class="env-label">湿度</span>
                    </div>
                    <div class="env-item" role="status" aria-live="polite">
                        <span class="env-icon" aria-hidden="true">☁️</span>
                        <span class="env-value" id="envAqi">优</span>
                        <span class="env-label">空气</span>
                    </div>
                    <div class="env-item time-item">
                        <span class="env-icon" aria-hidden="true">🕐</span>
                        <span class="env-value" id="envTime">--:--</span>
                        <span class="env-label" id="envDate">----/--/--</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <aside class="sidebar">
                <nav class="nav-section" aria-label="房间选择">
                    <button class="nav-btn active" data-room="all" aria-pressed="true" type="button">
                        <span class="nav-icon" aria-hidden="true">🏠</span>
                        <span class="nav-text">全屋</span>
                    </button>
                    <button class="nav-btn" data-room="living" aria-pressed="false" type="button">
                        <span class="nav-icon" aria-hidden="true">🛋️</span>
                        <span class="nav-text">客厅</span>
                    </button>
                    <button class="nav-btn" data-room="bedroom" aria-pressed="false" type="button">
                        <span class="nav-icon" aria-hidden="true">🛏️</span>
                        <span class="nav-text">卧室</span>
                    </button>
                    <button class="nav-btn" data-room="kitchen" aria-pressed="false" type="button">
                        <span class="nav-icon" aria-hidden="true">🍳</span>
                        <span class="nav-text">厨房</span>
                    </button>
                    <button class="nav-btn" data-room="bathroom" aria-pressed="false" type="button">
                        <span class="nav-icon" aria-hidden="true">🚿</span>
                        <span class="nav-text">浴室</span>
                    </button>
                    <button class="nav-btn" data-room="study" aria-pressed="false" type="button">
                        <span class="nav-icon" aria-hidden="true">📚</span>
                        <span class="nav-text">书房</span>
                    </button>
                </nav>

                <section class="scene-section" aria-label="场景模式">
                    <h3 class="section-title">场景模式</h3>
                    <div class="scene-list" role="group" aria-label="场景列表">
                        <button class="scene-btn" data-scene="home" aria-pressed="false" type="button">
                            <span class="scene-icon" aria-hidden="true">🏡</span>
                            <span>回家模式</span>
                        </button>
                        <button class="scene-btn" data-scene="away" aria-pressed="false" type="button">
                            <span class="scene-icon" aria-hidden="true">🔒</span>
                            <span>离家模式</span>
                        </button>
                        <button class="scene-btn" data-scene="sleep" aria-pressed="false" type="button">
                            <span class="scene-icon" aria-hidden="true">🌙</span>
                            <span>睡眠模式</span>
                        </button>
                        <button class="scene-btn" data-scene="movie" aria-pressed="false" type="button">
                            <span class="scene-icon" aria-hidden="true">🎬</span>
                            <span>影院模式</span>
                        </button>
                        <button class="scene-btn" data-scene="party" aria-pressed="false" type="button">
                            <span class="scene-icon" aria-hidden="true">🎉</span>
                            <span>派对模式</span>
                        </button>
                        <button class="scene-btn" data-scene="work" aria-pressed="false" type="button">
                            <span class="scene-icon" aria-hidden="true">💼</span>
                            <span>工作模式</span>
                        </button>
                    </div>
                </section>

                <div class="energy-card">
                    <div class="energy-header">
                        <span class="energy-icon">⚡</span>
                        <span class="energy-title">今日能耗</span>
                    </div>
                    <div class="energy-value">
                        <span class="energy-number" id="energyValue">12.8</span>
                        <span class="energy-unit">kWh</span>
                    </div>
                    <div class="energy-bar">
                        <div class="energy-bar-fill" id="energyBar" style="width: 52%"></div>
                    </div>
                    <span class="energy-hint">较昨日 <span id="energyCompare" class="energy-down">-8%</span></span>
                </div>
            </aside>

            <section class="device-board" aria-label="设备控制面板">
                <div class="board-header">
                    <h2 class="board-title">设备控制</h2>
                    <div class="device-summary">
                        <span class="summary-online" id="onlineCount">0</span> 台在线
                        <span class="summary-dot"></span>
                        <span class="summary-active" id="activeCount">0</span> 台运行中
                    </div>
                </div>

                <div class="device-grid">
                    <!-- 设备卡片由JS动态生成 -->
                </div>
            </section>
        </main>

        <!-- 设备详情模态框 -->
        <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
            <div class="modal" role="document">
                <header class="modal-header">
                    <h3 class="modal-title" id="modalTitle">设备控制</h3>
                    <button class="close-btn" id="closeModal" aria-label="关闭对话框" type="button">×</button>
                </header>
                <div class="modal-body" id="modalBody">
                    <!-- 动态内容 -->
                </div>
            </div>
        </div>

        <div class="toast" id="toast" role="alert" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script>
class SmartHome {
    constructor() {
        this.currentRoom = 'all';
        this.currentScene = null;
        this.devices = this.getDefaultDevices();
        this.toastTimeout = null;

        this.initEventListeners();
        this.render();
        this.updateClock();
        setInterval(() => this.updateClock(), 1000);
        this.updateSummary();
    }

    getDefaultDevices() {
        return [
            { id: '1', name: '客厅主灯', icon: '💡', room: 'living', type: 'light', on: true, brightness: 80, colorTemp: 4000, color: '#fbbf24', hasSlider: true, sliderLabel: '亮度', sliderValue: 80, sliderMin: 0, sliderMax: 100, sliderUnit: '%' },
            { id: '2', name: '客厅空调', icon: '❄️', room: 'living', type: 'ac', on: true, temperature: 24, mode: 'cool', color: '#38bdf8', hasSlider: true, sliderLabel: '温度', sliderValue: 24, sliderMin: 16, sliderMax: 30, sliderUnit: '°C' },
            { id: '3', name: '智能窗帘', icon: '🪟', room: 'living', type: 'curtain', on: true, openPercent: 70, color: '#a78bfa', hasSlider: true, sliderLabel: '开合', sliderValue: 70, sliderMin: 0, sliderMax: 100, sliderUnit: '%' },
            { id: '4', name: '智能电视', icon: '📺', room: 'living', type: 'tv', on: false, volume: 30, color: '#60a5fa', hasSlider: true, sliderLabel: '音量', sliderValue: 30, sliderMin: 0, sliderMax: 100, sliderUnit: '%' },
            { id: '5', name: '卧室吊灯', icon: '💡', room: 'bedroom', type: 'light', on: false, brightness: 50, colorTemp: 3000, color: '#fbbf24', hasSlider: true, sliderLabel: '亮度', sliderValue: 50, sliderMin: 0, sliderMax: 100, sliderUnit: '%' },
            { id: '6', name: '卧室空调', icon: '❄️', room: 'bedroom', type: 'ac', on: false, temperature: 26, mode: 'cool', color: '#38bdf8', hasSlider: true, sliderLabel: '温度', sliderValue: 26, sliderMin: 16, sliderMax: 30, sliderUnit: '°C' },
            { id: '7', name: '空气净化器', icon: '🌬️', room: 'bedroom', type: 'purifier', on: true, speed: 2, color: '#34d399', hasSlider: false },
            { id: '8', name: '智能门锁', icon: '🔒', room: 'living', type: 'lock', on: true, color: '#f97316', hasSlider: false },
            { id: '9', name: '扫地机器人', icon: '🤖', room: 'living', type: 'robot', on: false, color: '#8b5cf6', hasSlider: false },
            { id: '10', name: '厨房灯', icon: '💡', room: 'kitchen', type: 'light', on: true, brightness: 100, colorTemp: 5000, color: '#fbbf24', hasSlider: true, sliderLabel: '亮度', sliderValue: 100, sliderMin: 0, sliderMax: 100, sliderUnit: '%' },
            { id: '11', name: '热水器', icon: '🔥', room: 'bathroom', type: 'heater', on: false, temperature: 42, color: '#fb7185', hasSlider: true, sliderLabel: '温度', sliderValue: 42, sliderMin: 30, sliderMax: 60, sliderUnit: '°C' },
            { id: '12', name: '书房台灯', icon: '🪔', room: 'study', type: 'light', on: true, brightness: 65, colorTemp: 4500, color: '#fbbf24', hasSlider: true, sliderLabel: '亮度', sliderValue: 65, sliderMin: 0, sliderMax: 100, sliderUnit: '%' },
        ];
    }

    initEventListeners() {
        // Room navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const clicked = e.target.closest('.nav-btn');
                document.querySelectorAll('.nav-btn').forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-pressed', 'false');
                });
                clicked.classList.add('active');
                clicked.setAttribute('aria-pressed', 'true');
                this.currentRoom = clicked.dataset.room;
                this.render();
            });
        });

        // Scene buttons
        document.querySelectorAll('.scene-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const clicked = e.target.closest('.scene-btn');
                const scene = clicked.dataset.scene;

                if (this.currentScene === scene) {
                    clicked.classList.remove('active');
                    clicked.setAttribute('aria-pressed', 'false');
                    this.currentScene = null;
                    this.showToast('已退出场景模式', 'info');
                } else {
                    document.querySelectorAll('.scene-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    clicked.classList.add('active');
                    clicked.setAttribute('aria-pressed', 'true');
                    this.currentScene = scene;
                    this.applyScene(scene);
                }
            });
        });

        // Modal controls
        document.getElementById('closeModal').addEventListener('click', () => this.closeModal());
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) this.closeModal();
        });

        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') this.closeModal();
        });
    }

    applyScene(scene) {
        const sceneNames = {
            home: '回家模式', away: '离家模式', sleep: '睡眠模式',
            movie: '影院模式', party: '派对模式', work: '工作模式'
        };

        switch (scene) {
            case 'home':
                this.setDevicesByRoom('living', { light: { on: true, brightness: 80 }, ac: { on: true, temperature: 24 } });
                this.setDevicesByRoom('bedroom', { light: { on: false }, ac: { on: true, temperature: 26 } });
                this.showToast('🏡 已开启回家模式', 'success');
                break;
            case 'away':
                this.devices.forEach(d => { d.on = false; });
                this.showToast('🔒 已开启离家模式，所有设备已关闭', 'info');
                break;
            case 'sleep':
                this.devices.forEach(d => {
                    if (d.type === 'light') { d.on = false; }
                    if (d.type === 'ac') { d.on = true; d.temperature = 26; d.sliderValue = 26; }
                    if (d.type === 'curtain') { d.on = true; d.openPercent = 0; d.sliderValue = 0; }
                });
                this.showToast('🌙 已开启睡眠模式', 'success');
                break;
            case 'movie':
                this.setDevicesByRoom('living', { light: { on: true, brightness: 15 }, tv: { on: true, volume: 40 }, curtain: { on: true, openPercent: 0 } });
                this.showToast('🎬 已开启影院模式', 'success');
                break;
            case 'party':
                this.devices.forEach(d => {
                    if (d.type === 'light') { d.on = true; d.brightness = 100; d.sliderValue = 100; }
                    if (d.type === 'tv') { d.on = true; d.volume = 60; d.sliderValue = 60; }
                });
                this.showToast('🎉 已开启派对模式', 'success');
                break;
            case 'work':
                this.setDevicesByRoom('study', { light: { on: true, brightness: 90 } });
                this.setDevicesByRoom('living', { light: { on: false }, tv: { on: false } });
                this.showToast('💼 已开启工作模式', 'success');
                break;
        }

        this.render();
        this.updateSummary();
    }

    setDevicesByRoom(room, settings) {
        this.devices.forEach(d => {
            if (d.room === room && settings[d.type]) {
                Object.assign(d, settings[d.type]);
            }
        });
    }

    toggleDevice(id) {
        const device = this.devices.find(d => d.id === id);
        if (!device) return;

        device.on = !device.on;
        this.render();
        this.updateSummary();

        if (device.on) {
            this.showToast(`${device.icon} ${device.name} 已开启`, 'success');
        } else {
            this.showToast(`${device.icon} ${device.name} 已关闭`, 'info');
        }
    }

    updateDeviceSlider(id, value) {
        const device = this.devices.find(d => d.id === id);
        if (!device) return;

        const v = parseInt(value);
        device.sliderValue = v;

        switch (device.type) {
            case 'light': device.brightness = v; break;
            case 'ac': device.temperature = v; break;
            case 'heater': device.temperature = v; break;
            case 'curtain': device.openPercent = v; break;
            case 'tv': device.volume = v; break;
        }

        // Update card status text
        const card = document.querySelector(`[data-device-id="${id}"]`);
        if (card) {
            const statusText = card.querySelector('.status-text');
            if (statusText) {
                statusText.textContent = this.getDeviceStatusText(device);
            }
        }
    }

    getDeviceStatusText(device) {
        if (!device.on) return '已关闭';
        switch (device.type) {
            case 'light': return `亮度 ${device.brightness}%`;
            case 'ac': return `${device.temperature}°C ${device.mode === 'cool' ? '制冷' : '制热'}`;
            case 'curtain': return `开合 ${device.openPercent}%`;
            case 'tv': return `音量 ${device.volume}%`;
            case 'heater': return `${device.temperature}°C`;
            case 'purifier': return '净化中';
            case 'lock': return '已上锁';
            case 'robot': return '清扫中';
            default: return '运行中';
        }
    }

    getFilteredDevices() {
        if (this.currentRoom === 'all') return this.devices;
        return this.devices.filter(d => d.room === this.currentRoom);
    }

    getRoomName(room) {
        const map = { living: '客厅', bedroom: '卧室', kitchen: '厨房', bathroom: '浴室', study: '书房' };
        return map[room] || room;
    }

    render() {
        const grid = document.querySelector('.device-grid');
        grid.innerHTML = '';

        const devices = this.getFilteredDevices();

        devices.forEach(device => {
            const card = document.createElement('div');
            card.className = `device-card ${device.on ? 'on' : 'off'} ${device.hasSlider && device.on ? 'show-slider' : ''}`;
            card.dataset.deviceId = device.id;
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            card.setAttribute('aria-label', `${device.name}，${this.getRoomName(device.room)}，${device.on ? '已开启' : '已关闭'}`);

            // Set CSS custom properties for device color
            card.style.setProperty('--device-color', device.color);
            card.style.setProperty('--device-glow', device.color + '40');
            card.style.setProperty('--device-bg', device.color + '15');
            card.style.setProperty('--device-border', device.color + '35');

            let sliderHTML = '';
            if (device.hasSlider) {
                sliderHTML = `
                    <div class="device-slider">
                        <div class="slider-row">
                            <span class="slider-label">${device.on ? device.sliderValue : device.sliderValue}${device.sliderUnit}</span>
                            <input type="range" min="${device.sliderMin}" max="${device.sliderMax}" value="${device.sliderValue}"
                                data-device-id="${device.id}"
                                aria-label="${device.sliderLabel}调节"
                                ${!device.on ? 'disabled' : ''}>
                        </div>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="device-top">
                    <div class="device-icon-wrap">${device.icon}</div>
                    <label class="toggle-switch" aria-label="开关${device.name}">
                        <input type="checkbox" ${device.on ? 'checked' : ''} data-toggle-id="${device.id}">
                        <div class="toggle-track"></div>
                        <div class="toggle-thumb"></div>
                    </label>
                </div>
                <div class="device-info">
                    <div class="device-name">${device.name}</div>
                    <div class="device-room">${this.getRoomName(device.room)}</div>
                    <div class="device-status">
                        <span class="status-dot"></span>
                        <span class="status-text">${this.getDeviceStatusText(device)}</span>
                    </div>
                </div>
                ${sliderHTML}
            `;

            // Toggle event
            const toggle = card.querySelector(`input[data-toggle-id="${device.id}"]`);
            toggle.addEventListener('change', (e) => {
                e.stopPropagation();
                this.toggleDevice(device.id);
            });

            // Slider event
            const slider = card.querySelector(`input[type="range"][data-device-id="${device.id}"]`);
            if (slider) {
                slider.addEventListener('input', (e) => {
                    e.stopPropagation();
                    this.updateDeviceSlider(device.id, e.target.value);
                    const label = card.querySelector('.slider-label');
                    if (label) label.textContent = e.target.value + device.sliderUnit;
                });
            }

            // Click card to open detail modal
            card.addEventListener('click', (e) => {
                if (!e.target.closest('.toggle-switch') && !e.target.closest('input[type="range"]')) {
                    this.openDeviceModal(device);
                }
            });

            // Keyboard
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    this.toggleDevice(device.id);
                }
            });

            grid.appendChild(card);
        });
    }

    openDeviceModal(device) {
        const overlay = document.getElementById('modalOverlay');
        const title = document.getElementById('modalTitle');
        const body = document.getElementById('modalBody');

        title.textContent = device.name;

        let controlsHTML = '';

        // Toggle
        controlsHTML += `
            <div class="modal-toggle-row">
                <span class="modal-toggle-label">电源开关</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="modalToggle" ${device.on ? 'checked' : ''}>
                    <div class="toggle-track"></div>
                    <div class="toggle-thumb"></div>
                </label>
            </div>
        `;

        // Slider controls
        if (device.hasSlider) {
            controlsHTML += `
                <div class="modal-control-group">
                    <span class="modal-control-label">${device.sliderLabel}</span>
                    <div class="modal-slider-row">
                        <input type="range" min="${device.sliderMin}" max="${device.sliderMax}" value="${device.sliderValue}" id="modalSlider">
                        <span class="modal-slider-value" id="modalSliderVal">${device.sliderValue}${device.sliderUnit}</span>
                    </div>
                </div>
            `;
        }

        // AC mode
        if (device.type === 'ac') {
            controlsHTML += `
                <div class="modal-control-group">
                    <span class="modal-control-label">运行模式</span>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="modal-mode-btn ${device.mode === 'cool' ? 'active' : ''}" data-mode="cool" style="flex:1;padding:0.6rem;border-radius:12px;border:1px solid var(--border-subtle);background:${device.mode === 'cool' ? 'rgba(56,189,248,0.15)' : 'rgba(255,255,255,0.03)'};color:${device.mode === 'cool' ? '#38bdf8' : 'var(--text-secondary)'};cursor:pointer;font-family:inherit;font-size:0.8rem;font-weight:500;transition:all 0.2s ease;">❄️ 制冷</button>
                        <button class="modal-mode-btn ${device.mode === 'heat' ? 'active' : ''}" data-mode="heat" style="flex:1;padding:0.6rem;border-radius:12px;border:1px solid var(--border-subtle);background:${device.mode === 'heat' ? 'rgba(251,113,133,0.15)' : 'rgba(255,255,255,0.03)'};color:${device.mode === 'heat' ? '#fb7185' : 'var(--text-secondary)'};cursor:pointer;font-family:inherit;font-size:0.8rem;font-weight:500;transition:all 0.2s ease;">🔥 制热</button>
                    </div>
                </div>
            `;
        }

        body.innerHTML = `
            <div class="modal-device-icon" style="background:${device.on ? device.color + '15' : 'rgba(255,255,255,0.04)'};border-color:${device.on ? device.color + '35' : 'var(--border-subtle)'};${device.on ? 'box-shadow:0 0 24px ' + device.color + '25' : ''}">${device.icon}</div>
            <div class="modal-device-name">${device.name}</div>
            <div class="modal-device-room">${this.getRoomName(device.room)} · ${device.on ? '运行中' : '已关闭'}</div>
            ${controlsHTML}
            <button class="modal-btn" id="modalCloseBtn">完成</button>
        `;

        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');

        // Modal toggle
        const modalToggle = document.getElementById('modalToggle');
        modalToggle.addEventListener('change', () => {
            this.toggleDevice(device.id);
            this.openDeviceModal(device); // Re-render modal
        });

        // Modal slider
        const modalSlider = document.getElementById('modalSlider');
        if (modalSlider) {
            modalSlider.addEventListener('input', (e) => {
                this.updateDeviceSlider(device.id, e.target.value);
                document.getElementById('modalSliderVal').textContent = e.target.value + device.sliderUnit;
            });
        }

        // AC mode buttons
        document.querySelectorAll('.modal-mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                device.mode = btn.dataset.mode;
                this.openDeviceModal(device);
                this.showToast(`空调切换为${device.mode === 'cool' ? '制冷' : '制热'}模式`, 'info');
            });
        });

        // Close button
        document.getElementById('modalCloseBtn').addEventListener('click', () => this.closeModal());
    }

    closeModal() {
        const overlay = document.getElementById('modalOverlay');
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
    }

    updateSummary() {
        const online = this.devices.length;
        const active = this.devices.filter(d => d.on).length;
        document.getElementById('onlineCount').textContent = online;
        document.getElementById('activeCount').textContent = active;
    }

    updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('envTime').textContent = `${h}:${m}`;

        const y = now.getFullYear();
        const mo = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        document.getElementById('envDate').textContent = `${y}/${mo}/${d} ${weekDays[now.getDay()]}`;
    }

    showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const icons = { success: '✓', error: '✕', info: 'ℹ' };
        toast.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
        toast.className = `toast ${type} show`;

        if (this.toastTimeout) clearTimeout(this.toastTimeout);
        this.toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
    }
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    new SmartHome();

    document.body.style.opacity = '0';
    document.body.style.transition = 'opacity 0.5s ease';
    requestAnimationFrame(() => { document.body.style.opacity = '1'; });
});

    </script>
</body>
