<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>声控绝招 AI 对战馆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Noto+Sans+SC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            overflow: hidden;
            touch-action: none;
        }
        
        .game-font {
            font-family: 'Black Ops One', cursive;
        }
        
        .pixel-border {
            box-shadow: 
                -4px 0 0 0 #f00,
                4px 0 0 0 #f00,
                0 -4px 0 0 #f00,
                0 4px 0 0 #f00;
        }
        
        .animate-pulse-fast {
            animation: pulse 0.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        .animate-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        
        .skill-name-flash {
            animation: flash 0.8s ease-out forwards;
        }
        
        @keyframes flash {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.3); }
            100% { opacity: 0; transform: scale(2); }
        }
        
        .damage-number {
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }
        
        .volume-bar {
            transition: width 0.1s ease-out;
        }
        
        .btn-glow {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5), 0 0 40px rgba(255, 0, 0, 0.3);
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7), 0 0 60px rgba(255, 0, 0, 0.5);
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 0, 0, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col">

    <!-- 主菜单 -->
    <div id="main-menu" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-black/80 backdrop-blur-sm">
        <div class="text-center mb-8">
            <h1 class="game-font text-5xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-500 to-red-500 mb-4 animate-pulse">
                声控绝招
            </h1>
            <h2 class="text-2xl md:text-3xl text-blue-400 font-bold">AI 对战馆</h2>
            <p class="text-gray-400 mt-4 text-sm md:text-base">喊出来才叫真绝招！</p>
        </div>
        
        <div class="flex flex-col gap-4 w-64">
            <button id="start-game-btn" class="btn-glow bg-red-600 hover:bg-red-500 text-white font-bold py-4 px-8 rounded-lg text-xl transition-all transform hover:scale-105">
                <i class="fas fa-play mr-2"></i> 开始对战
            </button>
            <button id="custom-skill-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg text-lg transition-all">
                <i class="fas fa-swords mr-2"></i> 自定义绝招
            </button>
            <button id="leaderboard-btn" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-6 rounded-lg text-lg transition-all">
                <i class="fas fa-trophy mr-2"></i> 排行榜
            </button>
        </div>
        
        <div class="mt-8 text-center text-gray-500 text-sm">
            <p>💡 玩法：对着麦克风喊出绝招名字即可释放技能</p>
            <p>📢 喊得越大声，伤害越高！</p>
        </div>
        
        <div class="mt-4 flex gap-4">
            <button id="difficulty-btn" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm">
                难度：<span id="difficulty-label">普通</span>
            </button>
        </div>
    </div>

    <!-- 自定义绝招面板 -->
    <div id="custom-skill-panel" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-black/90 backdrop-blur-sm hidden">
        <h2 class="game-font text-4xl text-blue-400 mb-6">自定义绝招</h2>
        
        <div class="bg-gray-800/80 p-6 rounded-xl w-80">
            <div class="mb-4">
                <label class="block text-gray-300 mb-2">绝招名称</label>
                <input type="text" id="skill-name-input" class="w-full bg-gray-700 text-white px-4 py-3 rounded-lg border border-gray-600 focus:border-blue-500 focus:outline-none" placeholder="输入绝招名称">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-300 mb-2">属性选择</label>
                <div class="flex gap-2">
                    <button class="attr-btn flex-1 py-2 rounded-lg text-sm font-bold bg-red-600 hover:bg-red-500" data-attr="fire">🔥 火</button>
                    <button class="attr-btn flex-1 py-2 rounded-lg text-sm font-bold bg-blue-600 hover:bg-blue-500" data-attr="water">💧 水</button>
                    <button class="attr-btn flex-1 py-2 rounded-lg text-sm font-bold bg-yellow-600 hover:bg-yellow-500" data-attr="thunder">⚡ 雷</button>
                    <button class="attr-btn flex-1 py-2 rounded-lg text-sm font-bold bg-green-600 hover:bg-green-500" data-attr="wind">🌪️ 风</button>
                    <button class="attr-btn flex-1 py-2 rounded-lg text-sm font-bold bg-amber-700 hover:bg-amber-600" data-attr="earth">🪨 土</button>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-300 mb-2">威力 (1-100)</label>
                <input type="range" id="skill-power-input" min="1" max="100" value="50" class="w-full">
                <span id="skill-power-value" class="text-center block text-gray-400">50</span>
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-300 mb-2">冷却时间 (1-30秒)</label>
                <input type="range" id="skill-cd-input" min="1" max="30" value="10" class="w-full">
                <span id="skill-cd-value" class="text-center block text-gray-400">10秒</span>
            </div>
            
            <button id="save-skill-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg">
                <i class="fas fa-save mr-2"></i> 保存绝招
            </button>
        </div>
        
        <div class="mt-6 w-80">
            <h3 class="text-gray-300 mb-3">我的绝招列表</h3>
            <div id="custom-skill-list" class="max-h-40 overflow-y-auto bg-gray-800/50 rounded-lg p-3">
                <!-- 自定义绝招列表 -->
            </div>
        </div>
        
        <button id="close-custom-panel" class="mt-6 bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded-lg">
            <i class="fas fa-arrow-left mr-2"></i> 返回
        </button>
    </div>

    <!-- 排行榜面板 -->
    <div id="leaderboard-panel" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-black/90 backdrop-blur-sm hidden">
        <h2 class="game-font text-4xl text-yellow-400 mb-6">🏆 排行榜</h2>
        
        <div class="bg-gray-800/80 p-6 rounded-xl w-80">
            <div class="mb-4">
                <h3 class="text-xl font-bold text-white mb-3">最高分记录</h3>
                <div id="score-list" class="space-y-2">
                    <!-- 分数列表 -->
                </div>
            </div>
            
            <div class="mb-4">
                <h3 class="text-xl font-bold text-white mb-3">连胜记录</h3>
                <p id="win-streak" class="text-2xl text-yellow-400 font-bold">0</p>
            </div>
            
            <button id="clear-data-btn" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg">
                <i class="fas fa-trash mr-2"></i> 清除所有数据
            </button>
        </div>
        
        <button id="close-leaderboard" class="mt-6 bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded-lg">
            <i class="fas fa-arrow-left mr-2"></i> 返回
        </button>
    </div>

    <!-- 游戏主界面 -->
    <div id="game-container" class="flex-1 flex flex-col md:flex-row hidden">
        <!-- 对战区域 -->
        <div id="battle-area" class="flex-1 relative">
            <canvas id="game-canvas" class="absolute inset-0 w-full h-full"></canvas>
            
            <!-- 玩家状态栏 -->
            <div id="player-status" class="absolute top-4 left-4 md:left-8 bg-black/60 backdrop-blur-sm rounded-lg p-3 border border-red-500/50">
                <div class="flex items-center mb-2">
                    <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center font-bold text-xl mr-3">P</div>
                    <div>
                        <div class="font-bold text-red-400">玩家</div>
                        <div class="text-xs text-gray-400">HP</div>
                    </div>
                </div>
                <div class="w-32 md:w-40 h-4 bg-gray-700 rounded-full overflow-hidden">
                    <div id="player-hp-bar" class="h-full bg-gradient-to-r from-red-600 to-red-400 transition-all duration-300" style="width: 100%"></div>
                </div>
                <div class="mt-2">
                    <div class="text-xs text-gray-400 mb-1">能量</div>
                    <div class="w-32 md:w-40 h-3 bg-gray-700 rounded-full overflow-hidden">
                        <div id="player-energy-bar" class="h-full bg-gradient-to-r from-yellow-600 to-yellow-400 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <!-- AI状态栏 -->
            <div id="ai-status" class="absolute top-4 right-4 md:right-8 bg-black/60 backdrop-blur-sm rounded-lg p-3 border border-blue-500/50">
                <div class="flex items-center mb-2">
                    <div class="text-right mr-3">
                        <div class="font-bold text-blue-400">AI对手</div>
                        <div class="text-xs text-gray-400">HP</div>
                    </div>
                    <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xl">AI</div>
                </div>
                <div class="w-32 md:w-40 h-4 bg-gray-700 rounded-full overflow-hidden">
                    <div id="ai-hp-bar" class="h-full bg-gradient-to-l from-blue-600 to-blue-400 transition-all duration-300" style="width: 100%"></div>
                </div>
                <div class="mt-2">
                    <div class="text-xs text-gray-400 mb-1">能量</div>
                    <div class="w-32 md:w-40 h-3 bg-gray-700 rounded-full overflow-hidden">
                        <div id="ai-energy-bar" class="h-full bg-gradient-to-l from-yellow-600 to-yellow-400 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>
            
            <!-- 技能名称闪现 -->
            <div id="skill-flash" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0">
                <span class="game-font text-6xl md:text-8xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-yellow-400"></span>
            </div>
            
            <!-- 语音识别状态 -->
            <div id="voice-status" class="absolute bottom-32 left-1/2 transform -translate-x-1/2 bg-black/70 backdrop-blur-sm rounded-full px-6 py-3 border border-green-500/50">
                <div class="flex items-center gap-3">
                    <i id="voice-icon" class="fas fa-microphone text-gray-500"></i>
                    <span id="voice-text" class="text-white">点击开始按钮获取麦克风权限</span>
                </div>
            </div>
            
            <!-- 音量指示器 -->
            <div id="volume-indicator" class="absolute bottom-20 left-1/2 transform -translate-x-1/2 w-64 md:w-80">
                <div class="h-3 bg-gray-700 rounded-full overflow-hidden">
                    <div id="volume-bar" class="h-full bg-gradient-to-r from-green-500 via-yellow-500 to-red-500 volume-bar" style="width: 0%"></div>
                </div>
                <div class="flex justify-between mt-1 text-xs text-gray-400">
                    <span>安静</span>
                    <span>大声</span>
                </div>
            </div>
            
            <!-- 技能提示 -->
            <div id="skill-hints" class="absolute bottom-4 left-4 md:left-8 bg-black/60 backdrop-blur-sm rounded-lg p-3">
                <div class="text-xs text-gray-400 mb-2">🎤 语音指令</div>
                <div class="grid grid-cols-2 gap-1 text-sm">
                    <span class="text-green-400">普通攻击</span>
                    <span class="text-blue-400">闪避</span>
                    <span class="text-yellow-400">防御</span>
                    <span class="text-purple-400">回血</span>
                    <span class="text-red-400">火焰拳</span>
                    <span class="text-blue-400">闪电链</span>
                    <span class="text-cyan-400">冰霜冲击</span>
                    <span class="text-orange-400">终极爆发</span>
                </div>
            </div>
        </div>
        
        <!-- 右侧面板 (电脑端) -->
        <div id="side-panel" class="hidden md:block w-64 bg-gray-900/80 backdrop-blur-sm p-4 border-l border-gray-700">
            <div class="mb-4">
                <h3 class="text-lg font-bold text-white mb-2">自定义绝招</h3>
                <div id="custom-skills-display" class="space-y-2 max-h-40 overflow-y-auto">
                    <!-- 自定义绝招显示 -->
                </div>
            </div>
            
            <div class="mb-4">
                <h3 class="text-lg font-bold text-white mb-2">战斗日志</h3>
                <div id="battle-log" class="space-y-1 text-sm max-h-32 overflow-y-auto">
                    <div class="text-gray-500">战斗开始！</div>
                </div>
            </div>
            
            <button id="pause-game-btn" class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 rounded-lg">
                <i class="fas fa-pause mr-2"></i> 暂停
            </button>
        </div>
    </div>

    <!-- 战斗结算界面 -->
    <div id="battle-result" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-black/90 backdrop-blur-sm hidden">
        <div id="result-title" class="game-font text-6xl md:text-8xl mb-6"></div>
        
        <div class="bg-gray-800/80 p-6 rounded-xl w-80 mb-6">
            <div class="grid grid-cols-2 gap-4 text-center">
                <div>
                    <div class="text-gray-400 text-sm">最高伤害</div>
                    <div id="max-damage" class="text-2xl font-bold text-red-400">0</div>
                </div>
                <div>
                    <div class="text-gray-400 text-sm">最强绝招</div>
                    <div id="best-skill" class="text-lg font-bold text-yellow-400">无</div>
                </div>
                <div>
                    <div class="text-gray-400 text-sm">本场积分</div>
                    <div id="score" class="text-2xl font-bold text-green-400">0</div>
                </div>
                <div>
                    <div class="text-gray-400 text-sm">战斗时间</div>
                    <div id="battle-time" class="text-lg font-bold text-blue-400">0s</div>
                </div>
            </div>
        </div>
        
        <div class="flex gap-4">
            <button id="restart-btn" class="btn-glow bg-red-600 hover:bg-red-500 text-white font-bold py-4 px-8 rounded-lg text-xl transition-all">
                <i class="fas fa-redo mr-2"></i> 再来一局
            </button>
            <button id="share-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-8 rounded-lg text-xl transition-all">
                <i class="fas fa-share-alt mr-2"></i> 分享战绩
            </button>
            <button id="back-to-menu-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 px-8 rounded-lg text-xl transition-all">
                <i class="fas fa-home mr-2"></i> 返回菜单
            </button>
        </div>
    </div>

    <script>
        /**
         * 声控绝招 AI 对战馆
         * 项目名称：声控绝招 AI 对战馆 - 喊出来才叫真绝招
         * 功能介绍：语音操控休闲对战小游戏，玩家喊出绝招名字即可释放对应技能
         * 使用方法：点击开始游戏按钮获取麦克风权限，对着麦克风喊出绝招名称
         * 浏览器兼容性：Chrome、Edge、Safari（需开启麦克风权限）
         * 
         * 核心模块：
         * 1. 语音识别模块 - Web Speech API
         * 2. 音量检测模块 - Web Audio API
         * 3. 游戏引擎 - Canvas渲染、游戏循环
         * 4. 粒子特效系统 - 各属性技能特效
         * 5. AI对战系统 - 三种难度AI
         * 6. 自定义绝招系统 - localStorage持久化
         * 7. 排行榜系统 - 本地存储
         */

        // ==================== 游戏配置 ====================
        const CONFIG = {
            playerMaxHP: 100,
            aiMaxHP: 100,
            energyPerDamage: 5,
            maxEnergy: 100,
            baseDamage: {
                normal: 5,
                fire: 15,
                water: 12,
                thunder: 18,
                wind: 10,
                earth: 20
            },
            volumeThreshold: 0.1,
            volumeMultiplier: 2,
            criticalVolume: 0.7,
            cooldowns: {
                normal: 1000,
                dodge: 3000,
                defend: 2000,
                heal: 8000
            },
            difficulty: {
                easy: { name: '简单', reaction: 2000, damage: 0.7, speed: 0.8 },
                normal: { name: '普通', reaction: 1500, damage: 1.0, speed: 1.0 },
                hard: { name: '困难', reaction: 800, damage: 1.3, speed: 1.2 }
            }
        };

        // ==================== 预设绝招 ====================
        const PRESET_SKILLS = [
            { name: '火焰拳', attribute: 'fire', power: 25, cooldown: 5000 },
            { name: '闪电链', attribute: 'thunder', power: 30, cooldown: 6000 },
            { name: '冰霜冲击', attribute: 'water', power: 20, cooldown: 5000 },
            { name: '龙卷风', attribute: 'wind', power: 18, cooldown: 4000 },
            { name: '岩石爆裂', attribute: 'earth', power: 35, cooldown: 7000 },
            { name: '烈焰风暴', attribute: 'fire', power: 40, cooldown: 8000 },
            { name: '雷霆万钧', attribute: 'thunder', power: 45, cooldown: 9000 },
            { name: '终极爆发', attribute: 'fire', power: 50, cooldown: 15000 }
        ];

        // ==================== 游戏状态 ====================
        const gameState = {
            status: 'menu', // menu, playing, paused, ended
            difficulty: 'normal',
            player: { hp: 100, energy: 0, isDefending: false, isDodging: false, lastAction: 0 },
            ai: { hp: 100, energy: 0, isDefending: false, isDodging: false, lastAction: 0 },
            score: 0,
            maxDamage: 0,
            bestSkill: '',
            battleStartTime: 0,
            voiceStatus: 'idle', // idle, listening, recognizing, recognized
            currentVoice: '',
            volume: 0,
            particles: [],
            damageNumbers: [],
            screenShake: 0,
            screenFlash: 0,
            customSkills: [],
            leaderboard: [],
            winStreak: 0
        };

        // ==================== DOM元素 ====================
        const DOM = {
            mainMenu: document.getElementById('main-menu'),
            gameContainer: document.getElementById('game-container'),
            gameCanvas: document.getElementById('game-canvas'),
            playerHpBar: document.getElementById('player-hp-bar'),
            playerEnergyBar: document.getElementById('player-energy-bar'),
            aiHpBar: document.getElementById('ai-hp-bar'),
            aiEnergyBar: document.getElementById('ai-energy-bar'),
            voiceStatus: document.getElementById('voice-status'),
            voiceText: document.getElementById('voice-text'),
            voiceIcon: document.getElementById('voice-icon'),
            volumeBar: document.getElementById('volume-bar'),
            skillFlash: document.getElementById('skill-flash'),
            battleResult: document.getElementById('battle-result'),
            resultTitle: document.getElementById('result-title'),
            customSkillPanel: document.getElementById('custom-skill-panel'),
            leaderboardPanel: document.getElementById('leaderboard-panel'),
            difficultyBtn: document.getElementById('difficulty-btn'),
            difficultyLabel: document.getElementById('difficulty-label'),
            battleLog: document.getElementById('battle-log'),
            sidePanel: document.getElementById('side-panel'),
            customSkillsDisplay: document.getElementById('custom-skills-display')
        };

        // ==================== Canvas上下文 ====================
        const ctx = DOM.gameCanvas.getContext('2d');
        let canvasWidth, canvasHeight;

        // ==================== 语音识别相关 ====================
        let recognition;
        let audioContext;
        let analyser;
        let microphone;
        let volumeTimer;

        // ==================== 游戏循环 ====================
        let lastTime = 0;
        let animationId;

        // ==================== 初始化 ====================
        function init() {
            loadData();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            bindEvents();
            updateCustomSkillDisplay();
            updateLeaderboard();
        }

        // ==================== 数据存储 ====================
        function loadData() {
            const customSkills = localStorage.getItem('voiceBattle_customSkills');
            const leaderboard = localStorage.getItem('voiceBattle_leaderboard');
            const winStreak = localStorage.getItem('voiceBattle_winStreak');
            
            if (customSkills) {
                gameState.customSkills = JSON.parse(customSkills);
            }
            if (leaderboard) {
                gameState.leaderboard = JSON.parse(leaderboard);
            }
            if (winStreak) {
                gameState.winStreak = parseInt(winStreak);
            }
        }

        function saveData() {
            localStorage.setItem('voiceBattle_customSkills', JSON.stringify(gameState.customSkills));
            localStorage.setItem('voiceBattle_leaderboard', JSON.stringify(gameState.leaderboard));
            localStorage.setItem('voiceBattle_winStreak', gameState.winStreak.toString());
        }

        function clearData() {
            localStorage.removeItem('voiceBattle_customSkills');
            localStorage.removeItem('voiceBattle_leaderboard');
            localStorage.removeItem('voiceBattle_winStreak');
            gameState.customSkills = [];
            gameState.leaderboard = [];
            gameState.winStreak = 0;
            updateCustomSkillDisplay();
            updateLeaderboard();
        }

        // ==================== Canvas调整 ====================
        function resizeCanvas() {
            canvasWidth = DOM.gameCanvas.parentElement.clientWidth;
            canvasHeight = DOM.gameCanvas.parentElement.clientHeight;
            DOM.gameCanvas.width = canvasWidth;
            DOM.gameCanvas.height = canvasHeight;
        }

        // ==================== 事件绑定 ====================
        function bindEvents() {
            DOM.difficultyBtn.addEventListener('click', cycleDifficulty);
            
            document.getElementById('start-game-btn').addEventListener('click', startGame);
            document.getElementById('custom-skill-btn').addEventListener('click', () => showPanel('custom-skill-panel'));
            document.getElementById('leaderboard-btn').addEventListener('click', () => showPanel('leaderboard-panel'));
            
            document.getElementById('close-custom-panel').addEventListener('click', hidePanels);
            document.getElementById('close-leaderboard').addEventListener('click', hidePanels);
            
            document.getElementById('save-skill-btn').addEventListener('click', saveCustomSkill);
            document.getElementById('clear-data-btn').addEventListener('click', clearData);
            
            document.getElementById('restart-btn').addEventListener('click', restartGame);
            document.getElementById('share-btn').addEventListener('click', shareResult);
            document.getElementById('back-to-menu-btn').addEventListener('click', backToMenu);
            
            document.getElementById('pause-game-btn').addEventListener('click', togglePause);
            
            document.getElementById('skill-power-input').addEventListener('input', (e) => {
                document.getElementById('skill-power-value').textContent = e.target.value;
            });
            
            document.getElementById('skill-cd-input').addEventListener('input', (e) => {
                document.getElementById('skill-cd-value').textContent = e.target.value + '秒';
            });
            
            document.querySelectorAll('.attr-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.attr-btn').forEach(b => b.classList.remove('ring-2', 'ring-white'));
                    this.classList.add('ring-2', 'ring-white');
                });
            });
        }

        function cycleDifficulty() {
            const difficulties = ['easy', 'normal', 'hard'];
            const currentIndex = difficulties.indexOf(gameState.difficulty);
            const nextIndex = (currentIndex + 1) % difficulties.length;
            gameState.difficulty = difficulties[nextIndex];
            DOM.difficultyLabel.textContent = CONFIG.difficulty[gameState.difficulty].name;
        }

        function showPanel(panelId) {
            document.getElementById(panelId).classList.remove('hidden');
        }

        function hidePanels() {
            document.querySelectorAll('.absolute.inset-0').forEach(el => {
                if (el.id !== 'game-container') {
                    el.classList.add('hidden');
                }
            });
        }

        // ==================== 游戏控制 ====================
        function startGame() {
            hidePanels();
            DOM.gameContainer.classList.remove('hidden');
            
            resetGame();
            initVoiceRecognition();
            initAudioContext();
            
            gameState.status = 'playing';
            gameState.battleStartTime = Date.now();
            
            lastTime = performance.now();
            gameLoop(lastTime);
            
            addBattleLog('战斗开始！使用语音释放技能！');
        }

        function resetGame() {
            gameState.player = { hp: CONFIG.playerMaxHP, energy: 0, isDefending: false, isDodging: false, lastAction: 0 };
            gameState.ai = { hp: CONFIG.aiMaxHP, energy: 0, isDefending: false, isDodging: false, lastAction: 0 };
            gameState.score = 0;
            gameState.maxDamage = 0;
            gameState.bestSkill = '';
            gameState.particles = [];
            gameState.damageNumbers = [];
            gameState.screenShake = 0;
            gameState.screenFlash = 0;
            updateUI();
        }

        function restartGame() {
            hidePanels();
            startGame();
        }

        function backToMenu() {
            gameState.status = 'menu';
            stopVoiceRecognition();
            hidePanels();
            DOM.gameContainer.classList.add('hidden');
            DOM.mainMenu.classList.remove('hidden');
        }

        function togglePause() {
            if (gameState.status === 'playing') {
                gameState.status = 'paused';
                document.getElementById('pause-game-btn').innerHTML = '<i class="fas fa-play mr-2"></i> 继续';
                addBattleLog('游戏暂停');
            } else if (gameState.status === 'paused') {
                gameState.status = 'playing';
                document.getElementById('pause-game-btn').innerHTML = '<i class="fas fa-pause mr-2"></i> 暂停';
                addBattleLog('游戏继续');
                gameLoop(performance.now());
            }
        }

        // ==================== 语音识别 ====================
        function initVoiceRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的浏览器不支持语音识别功能，请使用Chrome或Edge浏览器');
                backToMenu();
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-CN';
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            
            recognition.onstart = () => {
                gameState.voiceStatus = 'listening';
                updateVoiceStatus();
            };
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                if (finalTranscript) {
                    gameState.currentVoice = finalTranscript;
                    gameState.voiceStatus = 'recognized';
                    processVoiceCommand(finalTranscript);
                } else if (interimTranscript) {
                    gameState.currentVoice = interimTranscript;
                    gameState.voiceStatus = 'recognizing';
                }
                
                updateVoiceStatus();
            };
            
            recognition.onerror = (event) => {
                console.error('语音识别错误:', event.error);
                if (event.error === 'not-allowed') {
                    alert('请允许麦克风权限以使用语音识别功能');
                    backToMenu();
                } else {
                    gameState.voiceStatus = 'idle';
                    updateVoiceStatus();
                }
            };
            
            recognition.onend = () => {
                if (gameState.status === 'playing') {
                    setTimeout(() => {
                        try { recognition.start(); } catch(e) {}
                    }, 1000);
                }
            };
            
            recognition.start();
        }

        function stopVoiceRecognition() {
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        function updateVoiceStatus() {
            switch(gameState.voiceStatus) {
                case 'idle':
                    DOM.voiceIcon.className = 'fas fa-microphone text-gray-500';
                    DOM.voiceText.textContent = '点击开始按钮获取麦克风权限';
                    break;
                case 'listening':
                    DOM.voiceIcon.className = 'fas fa-microphone text-green-500 animate-pulse';
                    DOM.voiceText.textContent = '正在聆听...';
                    break;
                case 'recognizing':
                    DOM.voiceIcon.className = 'fas fa-microphone text-yellow-500';
                    DOM.voiceText.textContent = `识别中: ${gameState.currentVoice}`;
                    break;
                case 'recognized':
                    DOM.voiceIcon.className = 'fas fa-microphone text-green-500';
                    DOM.voiceText.textContent = `已识别: ${gameState.currentVoice}`;
                    setTimeout(() => {
                        if (gameState.voiceStatus === 'recognized') {
                            gameState.voiceStatus = 'listening';
                            updateVoiceStatus();
                        }
                    }, 2000);
                    break;
            }
        }

        // ==================== 音量检测 ====================
        function initAudioContext() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);
                    analyser.fftSize = 256;
                    startVolumeDetection();
                })
                .catch(err => {
                    console.error('麦克风访问失败:', err);
                    alert('无法访问麦克风，请检查权限设置');
                });
        }

        function startVolumeDetection() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            volumeTimer = setInterval(() => {
                if (!analyser) return;
                
                analyser.getByteFrequencyData(dataArray);
                
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                
                const average = sum / dataArray.length;
                gameState.volume = average / 255;
                
                updateVolumeBar();
            }, 50);
        }

        function updateVolumeBar() {
            const width = Math.min(gameState.volume * 200, 100);
            DOM.volumeBar.style.width = width + '%';
        }

        // ==================== 语音命令处理 ====================
        function processVoiceCommand(command) {
            if (gameState.status !== 'playing') return;
            
            const now = Date.now();
            const cmd = command.trim();
            
            // 基础指令
            if (cmd.includes('普通攻击') || cmd.includes('攻击')) {
                if (now - gameState.player.lastAction > CONFIG.cooldowns.normal) {
                    playerAttack('normal');
                }
            } else if (cmd.includes('闪避')) {
                if (now - gameState.player.lastAction > CONFIG.cooldowns.dodge) {
                    playerDodge();
                }
            } else if (cmd.includes('防御')) {
                if (now - gameState.player.lastAction > CONFIG.cooldowns.defend) {
                    playerDefend();
                }
            } else if (cmd.includes('回血')) {
                if (now - gameState.player.lastAction > CONFIG.cooldowns.heal) {
                    playerHeal();
                }
            }
            
            // 预设绝招
            for (const skill of PRESET_SKILLS) {
                if (cmd.includes(skill.name)) {
                    if (now - gameState.player.lastAction > skill.cooldown) {
                        playerUseSkill(skill);
                    }
                    return;
                }
            }
            
            // 自定义绝招
            for (const skill of gameState.customSkills) {
                if (cmd.includes(skill.name)) {
                    if (now - gameState.player.lastAction > skill.cooldown * 1000) {
                        playerUseSkill(skill);
                    }
                    return;
                }
            }
        }

        // ==================== 玩家操作 ====================
        function playerAttack(type) {
            gameState.player.lastAction = Date.now();
            
            const baseDamage = type === 'normal' ? CONFIG.baseDamage.normal : CONFIG.baseDamage[type];
            const volumeBonus = Math.min(gameState.volume * CONFIG.volumeMultiplier, 1);
            let damage = Math.floor(baseDamage * (1 + volumeBonus));
            
            if (gameState.volume > CONFIG.criticalVolume) {
                damage = Math.floor(damage * 1.5);
                addBattleLog(`⚡ 暴击！造成 ${damage} 点伤害！`);
                triggerScreenShake(5);
            } else {
                addBattleLog(`攻击！造成 ${damage} 点伤害`);
            }
            
            if (!gameState.ai.isDodging) {
                if (gameState.ai.isDefending) {
                    damage = Math.floor(damage * 0.3);
                    addBattleLog('对手防御！伤害降低');
                }
                gameState.ai.hp = Math.max(0, gameState.ai.hp - damage);
                gameState.player.energy = Math.min(CONFIG.maxEnergy, gameState.player.energy + CONFIG.energyPerDamage);
                gameState.score += damage;
                
                createDamageNumber(canvasWidth * 0.7, canvasHeight * 0.5, damage, 'blue');
                createParticles('attack', canvasWidth * 0.35, canvasHeight * 0.6, 'player');
                
                if (damage > gameState.maxDamage) {
                    gameState.maxDamage = damage;
                    gameState.bestSkill = type === 'normal' ? '普通攻击' : type;
                }
                
                checkBattleEnd();
            } else {
                addBattleLog('对手闪避了！');
                gameState.ai.isDodging = false;
            }
            
            updateUI();
        }

        function playerDodge() {
            gameState.player.lastAction = Date.now();
            gameState.player.isDodging = true;
            addBattleLog('闪避！接下来2秒内免疫伤害');
            createParticles('dodge', canvasWidth * 0.25, canvasHeight * 0.6, 'player');
            
            setTimeout(() => {
                gameState.player.isDodging = false;
            }, 2000);
            
            updateUI();
        }

        function playerDefend() {
            gameState.player.lastAction = Date.now();
            gameState.player.isDefending = true;
            addBattleLog('防御！接下来3秒内减少70%伤害');
            createParticles('defend', canvasWidth * 0.25, canvasHeight * 0.6, 'player');
            
            setTimeout(() => {
                gameState.player.isDefending = false;
            }, 3000);
            
            updateUI();
        }

        function playerHeal() {
            gameState.player.lastAction = Date.now();
            const healAmount = 15;
            gameState.player.hp = Math.min(CONFIG.playerMaxHP, gameState.player.hp + healAmount);
            addBattleLog(`💚 回血！恢复 ${healAmount} 点生命`);
            createParticles('heal', canvasWidth * 0.25, canvasHeight * 0.6, 'player');
            updateUI();
        }

        function playerUseSkill(skill) {
            if (gameState.player.energy < 30) {
                addBattleLog('能量不足！需要30点能量');
                return;
            }
            
            gameState.player.lastAction = Date.now();
            gameState.player.energy = Math.max(0, gameState.player.energy - 30);
            
            const volumeBonus = Math.min(gameState.volume * CONFIG.volumeMultiplier, 1);
            let damage = Math.floor(skill.power * (1 + volumeBonus));
            
            if (gameState.volume > CONFIG.criticalVolume) {
                damage = Math.floor(damage * 1.5);
                addBattleLog(`⚡ 超级暴击！${skill.name}造成 ${damage} 点伤害！`);
                triggerScreenShake(15);
                triggerScreenFlash(1);
            } else {
                addBattleLog(`释放 ${skill.name}！造成 ${damage} 点伤害`);
                triggerScreenShake(8);
            }
            
            showSkillFlash(skill.name);
            
            if (!gameState.ai.isDodging) {
                if (gameState.ai.isDefending) {
                    damage = Math.floor(damage * 0.3);
                    addBattleLog('对手防御！伤害降低');
                }
                gameState.ai.hp = Math.max(0, gameState.ai.hp - damage);
                gameState.score += damage * 2;
                
                createDamageNumber(canvasWidth * 0.7, canvasHeight * 0.5, damage, 'blue');
                createParticles(skill.attribute, canvasWidth * 0.35, canvasHeight * 0.6, 'player');
                
                if (damage > gameState.maxDamage) {
                    gameState.maxDamage = damage;
                    gameState.bestSkill = skill.name;
                }
                
                checkBattleEnd();
            } else {
                addBattleLog('对手闪避了！');
                gameState.ai.isDodging = false;
            }
            
            updateUI();
        }

        // ==================== AI逻辑 ====================
        function updateAI(deltaTime) {
            if (gameState.status !== 'playing') return;
            
            const now = Date.now();
            const diffConfig = CONFIG.difficulty[gameState.difficulty];
            
            // AI自动回复能量
            gameState.ai.energy = Math.min(CONFIG.maxEnergy, gameState.ai.energy + deltaTime * 0.02);
            
            // AI行动决策
            if (now - gameState.ai.lastAction > diffConfig.reaction) {
                const rand = Math.random();
                
                // 血量低时优先回血/防御
                if (gameState.ai.hp < 30 && rand < 0.3) {
                    aiHeal(diffConfig);
                } else if (gameState.ai.hp < 50 && rand < 0.2) {
                    aiDefend(diffConfig);
                } else if (rand < 0.1) {
                    aiDodge(diffConfig);
                } else if (gameState.ai.energy >= 50 && rand < 0.3) {
                    aiUseSkill(diffConfig);
                } else {
                    aiAttack(diffConfig);
                }
            }
        }

        function aiAttack(diffConfig) {
            gameState.ai.lastAction = Date.now();
            
            const baseDamage = CONFIG.baseDamage.normal * diffConfig.damage;
            let damage = Math.floor(baseDamage * (0.8 + Math.random() * 0.4));
            
            if (!gameState.player.isDodging) {
                if (gameState.player.isDefending) {
                    damage = Math.floor(damage * 0.3);
                    addBattleLog('你防御了AI的攻击！伤害降低');
                }
                gameState.player.hp = Math.max(0, gameState.player.hp - damage);
                gameState.ai.energy = Math.min(CONFIG.maxEnergy, gameState.ai.energy + CONFIG.energyPerDamage);
                
                createDamageNumber(canvasWidth * 0.3, canvasHeight * 0.5, damage, 'red');
                createParticles('attack', canvasWidth * 0.65, canvasHeight * 0.6, 'ai');
                
                if (gameState.player.hp < 30) {
                    triggerScreenFlash(0.5);
                }
                
                checkBattleEnd();
            } else {
                addBattleLog('你闪避了AI的攻击！');
                gameState.player.isDodging = false;
            }
            
            updateUI();
        }

        function aiDodge(diffConfig) {
            gameState.ai.lastAction = Date.now();
            gameState.ai.isDodging = true;
            addBattleLog('AI闪避！接下来2秒内免疫伤害');
            createParticles('dodge', canvasWidth * 0.75, canvasHeight * 0.6, 'ai');
            
            setTimeout(() => {
                gameState.ai.isDodging = false;
            }, 2000 / diffConfig.speed);
            
            updateUI();
        }

        function aiDefend(diffConfig) {
            gameState.ai.lastAction = Date.now();
            gameState.ai.isDefending = true;
            addBattleLog('AI防御！');
            createParticles('defend', canvasWidth * 0.75, canvasHeight * 0.6, 'ai');
            
            setTimeout(() => {
                gameState.ai.isDefending = false;
            }, 3000 / diffConfig.speed);
            
            updateUI();
        }

        function aiHeal(diffConfig) {
            gameState.ai.lastAction = Date.now();
            const healAmount = Math.floor(10 * diffConfig.damage);
            gameState.ai.hp = Math.min(CONFIG.aiMaxHP, gameState.ai.hp + healAmount);
            gameState.ai.energy = Math.max(0, gameState.ai.energy - 20);
            addBattleLog(`AI回血！恢复 ${healAmount} 点生命`);
            createParticles('heal', canvasWidth * 0.75, canvasHeight * 0.6, 'ai');
            updateUI();
        }

        function aiUseSkill(diffConfig) {
            gameState.ai.lastAction = Date.now();
            gameState.ai.energy = Math.max(0, gameState.ai.energy - 50);
            
            const skill = PRESET_SKILLS[Math.floor(Math.random() * PRESET_SKILLS.length)];
            const damage = Math.floor(skill.power * diffConfig.damage * (0.8 + Math.random() * 0.4));
            
            addBattleLog(`⚠️ AI释放 ${skill.name}！造成 ${damage} 点伤害！`);
            triggerScreenShake(5);
            
            if (!gameState.player.isDodging) {
                if (gameState.player.isDefending) {
                    damage = Math.floor(damage * 0.3);
                    addBattleLog('你防御了！伤害降低');
                }
                gameState.player.hp = Math.max(0, gameState.player.hp - damage);
                
                createDamageNumber(canvasWidth * 0.3, canvasHeight * 0.5, damage, 'red');
                createParticles(skill.attribute, canvasWidth * 0.65, canvasHeight * 0.6, 'ai');
                
                if (gameState.player.hp < 30) {
                    triggerScreenFlash(0.8);
                }
                
                checkBattleEnd();
            } else {
                addBattleLog('你闪避了AI的绝招！');
                gameState.player.isDodging = false;
            }
            
            updateUI();
        }

        // ==================== 战斗结束检测 ====================
        function checkBattleEnd() {
            if (gameState.player.hp <= 0) {
                endBattle(false);
            } else if (gameState.ai.hp <= 0) {
                endBattle(true);
            }
        }

        function endBattle(win) {
            gameState.status = 'ended';
            stopVoiceRecognition();
            
            const battleTime = Math.floor((Date.now - gameState.battleStartTime) / 1000);
            
            if (win) {
                DOM.resultTitle.textContent = '胜利！';
                DOM.resultTitle.className = 'game-font text-6xl md:text-8xl mb-6 text-yellow-400 animate-pulse';
                gameState.winStreak++;
                
                const score = gameState.score + gameState.winStreak * 100;
                addToLeaderboard(score);
                gameState.score = score;
            } else {
                DOM.resultTitle.textContent = '失败！';
                DOM.resultTitle.className = 'game-font text-6xl md:text-8xl mb-6 text-red-500';
                gameState.winStreak = 0;
            }
            
            saveData();
            
            document.getElementById('max-damage').textContent = gameState.maxDamage;
            document.getElementById('best-skill').textContent = gameState.bestSkill || '普通攻击';
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('battle-time').textContent = battleTime + 's';
            
            setTimeout(() => {
                DOM.battleResult.classList.remove('hidden');
            }, 1000);
        }

        function addToLeaderboard(score) {
            const entry = { score, date: new Date().toLocaleDateString(), streak: gameState.winStreak };
            gameState.leaderboard.push(entry);
            gameState.leaderboard.sort((a, b) => b.score - a.score);
            gameState.leaderboard = gameState.leaderboard.slice(0, 10);
        }

        // ==================== 自定义绝招 ====================
        function saveCustomSkill() {
            const name = document.getElementById('skill-name-input').value.trim();
            const power = parseInt(document.getElementById('skill-power-input').value);
            const cooldown = parseInt(document.getElementById('skill-cd-input').value);
            const attribute = document.querySelector('.attr-btn.ring-2')?.dataset.attr || 'fire';
            
            if (!name) {
                alert('请输入绝招名称');
                return;
            }
            
            const skill = { name, attribute, power, cooldown };
            gameState.customSkills.push(skill);
            saveData();
            
            document.getElementById('skill-name-input').value = '';
            document.getElementById('skill-power-input').value = 50;
            document.getElementById('skill-power-value').textContent = 50;
            document.getElementById('skill-cd-input').value = 10;
            document.getElementById('skill-cd-value').textContent = '10秒';
            
            updateCustomSkillDisplay();
            alert(`绝招 "${name}" 已保存！`);
        }

        function updateCustomSkillDisplay() {
            const list = document.getElementById('custom-skill-list');
            const display = DOM.customSkillsDisplay;
            
            const html = gameState.customSkills.map((skill, index) => {
                const attrColors = {
                    fire: 'bg-red-600',
                    water: 'bg-blue-600',
                    thunder: 'bg-yellow-600',
                    wind: 'bg-green-600',
                    earth: 'bg-amber-700'
                };
                return `<div class="flex justify-between items-center bg-gray-700/50 p-2 rounded mb-1">
                    <span class="font-bold">${skill.name}</span>
                    <span class="text-xs px-2 py-1 rounded ${attrColors[skill.attribute]}">${skill.attribute}</span>
                    <button onclick="deleteCustomSkill(${index})" class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
                </div>`;
            }).join('');
            
            list.innerHTML = html || '<div class="text-gray-500 text-center">暂无自定义绝招</div>';
            display.innerHTML = html || '<div class="text-gray-500 text-sm">暂无自定义绝招</div>';
        }

        window.deleteCustomSkill = function(index) {
            gameState.customSkills.splice(index, 1);
            saveData();
            updateCustomSkillDisplay();
        };

        // ==================== 排行榜 ====================
        function updateLeaderboard() {
            const list = document.getElementById('score-list');
            const streak = document.getElementById('win-streak');
            
            const html = gameState.leaderboard.map((entry, index) => {
                return `<div class="flex justify-between items-center bg-gray-700/50 p-2 rounded">
                    <span class="font-bold ${index < 3 ? 'text-yellow-400' : 'text-gray-300'}">${index + 1}. ${entry.date}</span>
                    <span class="font-bold text-green-400">${entry.score}</span>
                </div>`;
            }).join('');
            
            list.innerHTML = html || '<div class="text-gray-500 text-center">暂无记录</div>';
            streak.textContent = gameState.winStreak;
        }

        // ==================== 分享功能 ====================
        function shareResult() {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');
            
            // 绘制背景
            const gradient = ctx.createLinearGradient(0, 0, 0, 800);
            gradient.addColorStop(0, '#0f0c29');
            gradient.addColorStop(0.5, '#302b63');
            gradient.addColorStop(1, '#24243e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 600, 800);
            
            // 绘制标题
            ctx.font = 'bold 48px "Black Ops One"';
            ctx.fillStyle = '#ff0000';
            ctx.textAlign = 'center';
            ctx.fillText('声控绝招', 300, 100);
            
            ctx.font = 'bold 36px "Noto Sans SC"';
            ctx.fillStyle = '#4fc3f7';
            ctx.fillText('AI 对战馆', 300, 150);
            
            // 绘制结果
            const result = DOM.resultTitle.textContent;
            ctx.font = 'bold 64px "Black Ops One"';
            ctx.fillStyle = result === '胜利！' ? '#ffd700' : '#ff5252';
            ctx.fillText(result, 300, 250);
            
            // 绘制数据
            ctx.font = 'bold 24px "Noto Sans SC"';
            ctx.fillStyle = '#ffffff';
            
            ctx.fillText(`最高伤害: ${gameState.maxDamage}`, 300, 350);
            ctx.fillText(`最强绝招: ${gameState.bestSkill || '普通攻击'}`, 300, 400);
            ctx.fillText(`本场积分: ${gameState.score}`, 300, 450);
            
            // 绘制二维码区域
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(200, 550, 200, 200);
            
            ctx.fillStyle = '#333';
            ctx.font = '14px "Noto Sans SC"';
            ctx.fillText('扫码体验', 300, 800 - 30);
            
            // 显示图片
            const url = canvas.toDataURL('image/png');
            const img = document.createElement('img');
            img.src = url;
            img.style.maxWidth = '100%';
            img.style.border = '2px solid #fff';
            
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black/90 flex items-center justify-center z-[100]';
            modal.innerHTML = `
                <div class="bg-gray-800 p-4 rounded-xl max-w-md">
                    <h3 class="text-xl font-bold text-white mb-4 text-center">分享战绩</h3>
                    <img src="${url}" class="max-w-full rounded-lg">
                    <button class="mt-4 w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg">关闭</button>
                </div>
            `;
            modal.querySelector('button').addEventListener('click', () => modal.remove());
            document.body.appendChild(modal);
        }

        // ==================== UI更新 ====================
        function updateUI() {
            DOM.playerHpBar.style.width = (gameState.player.hp / CONFIG.playerMaxHP * 100) + '%';
            DOM.playerEnergyBar.style.width = (gameState.player.energy / CONFIG.maxEnergy * 100) + '%';
            DOM.aiHpBar.style.width = (gameState.ai.hp / CONFIG.aiMaxHP * 100) + '%';
            DOM.aiEnergyBar.style.width = (gameState.ai.energy / CONFIG.maxEnergy * 100) + '%';
            
            // 更新防御状态显示
            const playerStatus = document.getElementById('player-status');
            const aiStatus = document.getElementById('ai-status');
            
            if (gameState.player.isDefending) {
                playerStatus.classList.add('ring-4', 'ring-yellow-400');
            } else {
                playerStatus.classList.remove('ring-4', 'ring-yellow-400');
            }
            
            if (gameState.player.isDodging) {
                playerStatus.classList.add('ring-4', 'ring-green-400');
            } else {
                playerStatus.classList.remove('ring-4', 'ring-green-400');
            }
            
            if (gameState.ai.isDefending) {
                aiStatus.classList.add('ring-4', 'ring-yellow-400');
            } else {
                aiStatus.classList.remove('ring-4', 'ring-yellow-400');
            }
            
            if (gameState.ai.isDodging) {
                aiStatus.classList.add('ring-4', 'ring-green-400');
            } else {
                aiStatus.classList.remove('ring-4', 'ring-green-400');
            }
        }

        function addBattleLog(message) {
            const log = document.createElement('div');
            log.className = 'text-gray-300';
            log.textContent = message;
            DOM.battleLog.appendChild(log);
            DOM.battleLog.scrollTop = DOM.battleLog.scrollHeight;
        }

        // ==================== 技能闪现 ====================
        function showSkillFlash(name) {
            const flash = DOM.skillFlash;
            flash.querySelector('span').textContent = name;
            flash.classList.remove('opacity-0');
            flash.classList.add('skill-name-flash');
            
            setTimeout(() => {
                flash.classList.remove('skill-name-flash');
                flash.classList.add('opacity-0');
            }, 800);
        }

        // ==================== 屏幕特效 ====================
        function triggerScreenShake(intensity) {
            gameState.screenShake = intensity;
        }

        function triggerScreenFlash(intensity) {
            gameState.screenFlash = intensity;
        }

        // ==================== 粒子系统 ====================
        function createParticles(type, x, y, side) {
            const colors = {
                fire: ['#ff4500', '#ff6b35', '#ffcc00', '#ff1493'],
                water: ['#00bfff', '#1e90ff', '#87ceeb', '#00ced1'],
                thunder: ['#ffff00', '#ffd700', '#ffa500', '#ffffff'],
                wind: ['#90ee90', '#00fa9a', '#20b2aa', '#87ceeb'],
                earth: ['#8b4513', '#a0522d', '#cd853f', '#d2691e'],
                attack: ['#ffffff', '#ffd700', '#ff6347'],
                defend: ['#ffffff', '#87ceeb', '#9370db'],
                dodge: ['#00ff00', '#32cd32', '#90ee90'],
                heal: ['#ff69b4', '#ff1493', '#ffb6c1']
            };
            
            const particleCount = type === 'fire' || type === 'thunder' ? 50 : 30;
            const targetX = side === 'player' ? canvasWidth * 0.7 : canvasWidth * 0.3;
            
            for (let i = 0; i < particleCount; i++) {
                gameState.particles.push({
                    x,
                    y,
                    vx: (Math.random() - 0.5) * 10 + (targetX - x) * 0.02,
                    vy: (Math.random() - 0.5) * 10 - 5,
                    life: 1,
                    decay: 0.015 + Math.random() * 0.01,
                    size: 3 + Math.random() * 5,
                    color: colors[type][Math.floor(Math.random() * colors[type].length)],
                    type
                });
            }
        }

        function updateParticles() {
            gameState.particles = gameState.particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2;
                p.life -= p.decay;
                p.size *= 0.98;
                
                if (p.type === 'thunder') {
                    p.vx += (Math.random() - 0.5) * 3;
                }
                
                return p.life > 0;
            });
        }

        // ==================== 伤害数字 ====================
        function createDamageNumber(x, y, damage, color) {
            gameState.damageNumbers.push({
                x,
                y,
                damage,
                color,
                life: 1,
                vy: -2
            });
        }

        function updateDamageNumbers() {
            gameState.damageNumbers = gameState.damageNumbers.filter(d => {
                d.y += d.vy;
                d.life -= 0.02;
                return d.life > 0;
            });
        }

        // ==================== 渲染系统 ====================
        function render() {
            // 清空画布
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            
            // 绘制背景网格
            drawBackground();
            
            // 应用屏幕震动
            if (gameState.screenShake > 0) {
                const offsetX = (Math.random() - 0.5) * gameState.screenShake * 2;
                const offsetY = (Math.random() - 0.5) * gameState.screenShake * 2;
                ctx.save();
                ctx.translate(offsetX, offsetY);
                gameState.screenShake *= 0.9;
                if (gameState.screenShake < 0.1) gameState.screenShake = 0;
            }
            
            // 绘制角色
            drawPlayer();
            drawAI();
            
            // 绘制粒子
            drawParticles();
            
            // 绘制伤害数字
            drawDamageNumbers();
            
            // 应用屏幕闪光
            if (gameState.screenFlash > 0) {
                ctx.fillStyle = `rgba(255, 0, 0, ${gameState.screenFlash * 0.3})`;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                gameState.screenFlash *= 0.9;
                if (gameState.screenFlash < 0.1) gameState.screenFlash = 0;
            }
            
            if (gameState.screenShake > 0) {
                ctx.restore();
            }
        }

        function drawBackground() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            
            const gridSize = 40;
            for (let x = 0; x < canvasWidth; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvasHeight);
                ctx.stroke();
            }
            
            for (let y = 0; y < canvasHeight; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvasWidth, y);
                ctx.stroke();
            }
            
            const centerX = canvasWidth / 2;
            const gradient = ctx.createLinearGradient(centerX - 50, 0, centerX + 50, 0);
            gradient.addColorStop(0, 'rgba(255, 0, 0, 0.3)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.1)');
            gradient.addColorStop(1, 'rgba(0, 0, 255, 0.3)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(centerX - 3, 0, 6, canvasHeight);
        }

        function drawPlayer() {
            const x = canvasWidth * 0.25;
            const y = canvasHeight * 0.6;
            const size = 60;
            
            ctx.save();
            
            if (gameState.player.isDodging) {
                ctx.globalAlpha = 0.5;
                ctx.translate(x - 20, y);
            } else {
                ctx.translate(x, y);
            }
            
            if (gameState.player.isDefending) {
                ctx.scale(0.8, 1.2);
            }
            
            const gradient = ctx.createRadialGradient(0, -10, 0, 0, 0, size);
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.5, '#ee5a5a');
            gradient.addColorStop(1, '#c0392b');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-15, -10, 8, 0, Math.PI * 2);
            ctx.arc(15, -10, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-15, -10, 4, 0, Math.PI * 2);
            ctx.arc(15, -10, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 10, 15, 0, Math.PI);
            ctx.stroke();
            
            if (gameState.player.isDefending) {
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, size + 10, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawAI() {
            const x = canvasWidth * 0.75;
            const y = canvasHeight * 0.6;
            const size = 60;
            
            ctx.save();
            
            if (gameState.ai.isDodging) {
                ctx.globalAlpha = 0.5;
                ctx.translate(x + 20, y);
            } else {
                ctx.translate(x, y);
            }
            
            if (gameState.ai.isDefending) {
                ctx.scale(0.8, 1.2);
            }
            
            const gradient = ctx.createRadialGradient(0, -10, 0, 0, 0, size);
            gradient.addColorStop(0, '#4fc3f7');
            gradient.addColorStop(0.5, '#29b6f6');
            gradient.addColorStop(1, '#0288d1');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-15, -10, 8, 0, Math.PI * 2);
            ctx.arc(15, -10, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-15, -10, 4, 0, Math.PI * 2);
            ctx.arc(15, -10, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 10, 15, Math.PI, 0);
            ctx.stroke();
            
            if (gameState.ai.isDefending) {
                ctx.strokeStyle = '#ffff00';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, size + 10, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        function drawParticles() {
            gameState.particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                
                if (p.type === 'fire') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.5})`;
                    ctx.beginPath();
                    ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'thunder') {
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = p.size;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + (Math.random() - 0.5) * 20, p.y + (Math.random() - 0.5) * 20);
                    ctx.stroke();
                } else if (p.type === 'water') {
                    ctx.beginPath();
                    ctx.ellipse(p.x, p.y, p.size, p.size * 0.6, Math.random() * Math.PI, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'wind') {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y - p.size);
                    ctx.lineTo(p.x + p.size, p.y);
                    ctx.lineTo(p.x, p.y + p.size);
                    ctx.lineTo(p.x - p.size, p.y);
                    ctx.closePath();
                    ctx.fill();
                } else if (p.type === 'earth') {
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            ctx.globalAlpha = 1;
        }

        function drawDamageNumbers() {
            gameState.damageNumbers.forEach(d => {
                ctx.globalAlpha = d.life;
                ctx.font = 'bold 36px "Noto Sans SC"';
                ctx.textAlign = 'center';
                
                if (d.color === 'red') {
                    ctx.fillStyle = '#ff5252';
                    ctx.strokeStyle = '#ffffff';
                } else {
                    ctx.fillStyle = '#4fc3f7';
                    ctx.strokeStyle = '#ffffff';
                }
                
                ctx.lineWidth = 3;
                ctx.strokeText(`-${d.damage}`, d.x, d.y);
                ctx.fillText(`-${d.damage}`, d.x, d.y);
            });
            
            ctx.globalAlpha = 1;
        }

        // ==================== 游戏主循环 ====================
        function gameLoop(currentTime) {
            if (gameState.status !== 'playing') return;
            
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;
            
            updateAI(deltaTime);
            updateParticles();
            updateDamageNumbers();
            
            render();
            
            animationId = requestAnimationFrame(gameLoop);
        }

        // ==================== 启动游戏 ====================
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
