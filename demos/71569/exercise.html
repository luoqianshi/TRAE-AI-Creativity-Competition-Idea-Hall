<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运动 — 生活价值器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/exercise.css">
</head>
<body class="theme-exercise">

    <nav class="top-nav">
        <div class="nav-container">
            <a href="../index.html" class="brand-logo">生活价值器</a>
            <div class="nav-links">
                <a href="music.html" class="nav-link">音乐</a>
                <a href="food.html" class="nav-link">美食</a>
                <a href="thought.html" class="nav-link">思考</a>
                <a href="books.html" class="nav-link">书籍</a>
                <a href="exercise.html" class="nav-link active">运动</a>
                <a href="past.html" class="nav-link">过去</a>
                <a href="future.html" class="nav-link">展望</a>
            </div>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="菜单">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
        </div>
        <div class="mobile-menu hidden" id="mobileMenu">
            <a href="music.html" class="mobile-nav-link">音乐</a>
            <a href="food.html" class="mobile-nav-link">美食</a>
            <a href="thought.html" class="mobile-nav-link">思考</a>
            <a href="books.html" class="mobile-nav-link">书籍</a>
            <a href="exercise.html" class="mobile-nav-link active">运动</a>
            <a href="past.html" class="mobile-nav-link">过去</a>
            <a href="future.html" class="mobile-nav-link">展望</a>
        </div>
    </nav>

    <main class="page-main">
        <header class="page-header">
            <h1 class="page-title">运动</h1>
            <p class="page-subtitle">在汗水中磨砺意志，在运动中找寻自我</p>
        </header>

        <section class="scene-layout">
            <article class="showcase-card card-tl" tabindex="0">
                <div class="card-image-slot">
                    <label class="upload-label" title="上传图片">
                        <input type="file" accept="image/*" class="upload-input" hidden>
                        <svg class="upload-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </label>
                </div>
                <div class="card-content">
                    <h3 class="card-title">力量训练</h3>
                    <p class="card-desc">每一次举起都是对自我的超越，在坚持中突破极限</p>
                </div>
            </article>

            <article class="showcase-card card-tr" tabindex="0">
                <div class="card-image-slot">
                    <label class="upload-label" title="上传图片">
                        <input type="file" accept="image/*" class="upload-input" hidden>
                        <svg class="upload-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </label>
                </div>
                <div class="card-content">
                    <h3 class="card-title">水中律动</h3>
                    <p class="card-desc">专注呼吸与节奏，让身体与水融为一体</p>
                </div>
            </article>

            <div class="center-scene exercise-center">
                <div class="pool-scene-container">
                    <div class="pool-scene">
                        <img src="../assets/exercise-scene.jpg" alt="年轻男子在泳池中游泳" class="pool-image">
                    </div>
                    <svg class="swimmer-svg" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#4A6FA5;stop-opacity:0.9"/>
                                <stop offset="100%" style="stop-color:#2D4A6F;stop-opacity:0.95"/>
                            </linearGradient>
                            <linearGradient id="armGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" style="stop-color:#5A7FB5;stop-opacity:0.9"/>
                                <stop offset="100%" style="stop-color:#3D5A8F;stop-opacity:0.95"/>
                            </linearGradient>
                        </defs>
                        <g class="swimmer-body">
                            <g class="swimmer-head">
                                <ellipse cx="320" cy="85" rx="16" ry="18" fill="url(#bodyGradient)"/>
                            </g>
                            <g class="swimmer-torso">
                                <path d="M 305 95 Q 270 100 220 95 L 210 110 Q 260 120 300 115 Z" fill="url(#bodyGradient)"/>
                            </g>
                            <g class="swimmer-legs">
                                <path d="M 210 100 L 140 105 L 130 112 L 200 112 Z" fill="url(#bodyGradient)" opacity="0.85"/>
                                <path d="M 205 108 L 150 115 L 145 122 L 195 118 Z" fill="url(#bodyGradient)" opacity="0.7"/>
                            </g>
                            <g class="swimmer-arm arm-front">
                                <g class="upper-arm-front">
                                    <path d="M 290 98 Q 260 80 240 70 L 245 82 Q 268 92 295 105 Z" fill="url(#armGradient)"/>
                                </g>
                                <g class="forearm-front">
                                    <path d="M 242 72 Q 210 55 195 50 L 200 62 Q 218 70 247 82 Z" fill="url(#armGradient)"/>
                                </g>
                            </g>
                            <g class="swimmer-arm arm-back">
                                <g class="upper-arm-back">
                                    <path d="M 295 102 Q 320 110 345 108 L 340 100 Q 318 102 292 95 Z" fill="url(#armGradient)" opacity="0.7"/>
                                </g>
                                <g class="forearm-back">
                                    <path d="M 343 108 Q 365 100 375 88 L 368 85 Q 358 98 338 102 Z" fill="url(#armGradient)" opacity="0.7"/>
                                </g>
                            </g>
                        </g>
                        <g class="water-splashes">
                            <ellipse class="splash s1" cx="200" cy="60" rx="4" ry="2" fill="rgba(255,255,255,0.4)"/>
                            <ellipse class="splash s2" cx="230" cy="50" rx="3" ry="1.5" fill="rgba(255,255,255,0.3)"/>
                            <ellipse class="splash s3" cx="180" cy="70" rx="5" ry="2.5" fill="rgba(255,255,255,0.35)"/>
                        </g>
                    </svg>
                    <div class="water-ripple"></div>
                    <div class="pool-glow"></div>
                </div>
            </div>

            <article class="showcase-card card-bl" tabindex="0">
                <div class="card-image-slot">
                    <label class="upload-label" title="上传图片">
                        <input type="file" accept="image/*" class="upload-input" hidden>
                        <svg class="upload-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </label>
                </div>
                <div class="card-content">
                    <h3 class="card-title">挑战记录</h3>
                    <p class="card-desc">从百米到千米，每个目标都值得全力以赴</p>
                </div>
            </article>

            <article class="showcase-card card-br" tabindex="0">
                <div class="card-image-slot">
                    <label class="upload-label" title="上传图片">
                        <input type="file" accept="image/*" class="upload-input" hidden>
                        <svg class="upload-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </label>
                </div>
                <div class="card-content">
                    <h3 class="card-title">内心平静</h3>
                    <p class="card-desc">运动不只是身体的锻炼，更是心灵的修行</p>
                </div>
            </article>
        </section>
    </main>

    <script src="../js/common.js"></script>
    <script src="../js/exercise.js"></script>
</body>
</html>
