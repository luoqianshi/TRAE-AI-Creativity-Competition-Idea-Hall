<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历适配器 — Resume Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--surface:#111;--card:#161616;--card-hover:#1c1c1c;
  --border:#222;--border-light:#2a2a2a;
  --text:#f0ece7;--text-dim:#a09a94;--text-muted:#706a64;
  --accent:#c8956c;--accent-light:#e0b08a;--accent-glow:rgba(200,149,108,.15);
  --accent2:#6cc8a8;--accent2-glow:rgba(108,200,168,.12);
  --danger:#c86c6c;--danger-glow:rgba(200,108,108,.12);
  --warn:#c8b86c;--warn-glow:rgba(200,184,108,.12);
  --radius:12px;--radius-sm:8px;
  --font-display:'Instrument Serif',serif;
  --font-body:'Outfit','Noto Sans SC',sans-serif;
  --font-cn:'Noto Sans SC','Outfit',sans-serif;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font-body);line-height:1.6;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Noise overlay */
body::before{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* Ambient glow */
.ambient{
  position:fixed;width:600px;height:600px;border-radius:50%;
  filter:blur(120px);opacity:.07;pointer-events:none;z-index:0;
  transition:transform 2s ease;
}
.ambient-1{background:var(--accent);top:-200px;right:-100px}
.ambient-2{background:var(--accent2);bottom:-200px;left:-150px}

/* Layout */
.container{
  max-width:1200px;margin:0 auto;padding:0 24px;
  position:relative;z-index:1;
}

/* Header */
header{
  padding:48px 0 32px;
  display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--border);
  margin-bottom:48px;
  opacity:0;transform:translateY(20px);
  animation:fadeUp .8s ease forwards;
}
.logo{
  display:flex;align-items:baseline;gap:12px;
}
.logo h1{
  font-family:var(--font-display);font-size:2.4rem;font-weight:400;
  color:var(--text);letter-spacing:-.02em;line-height:1;
}
.logo h1 em{
  font-style:italic;color:var(--accent);
}
.logo-sub{
  font-size:.75rem;color:var(--text-muted);
  letter-spacing:.15em;text-transform:uppercase;
  font-weight:400;
}
.header-tag{
  font-size:.7rem;color:var(--text-dim);
  padding:6px 14px;border:1px solid var(--border-light);
  border-radius:100px;letter-spacing:.08em;
  font-weight:400;
}

/* Input Section */
.input-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:24px;
  margin-bottom:40px;
}
.input-panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;
  position:relative;overflow:hidden;
  transition:border-color .3s,box-shadow .3s;
  opacity:0;transform:translateY(24px);
}
.input-panel:nth-child(1){animation:fadeUp .8s .15s ease forwards}
.input-panel:nth-child(2){animation:fadeUp .8s .25s ease forwards}
.input-panel:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 1px var(--accent),0 0 40px var(--accent-glow);
}
.input-panel.jd-panel:focus-within{
  border-color:var(--accent2);
  box-shadow:0 0 0 1px var(--accent2),0 0 40px var(--accent2-glow);
}
.panel-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;
}
.panel-label{
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text-dim);font-weight:500;
}
.panel-label .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  margin-right:8px;vertical-align:middle;
}
.resume-panel .panel-label .dot{background:var(--accent)}
.jd-panel .panel-label .dot{background:var(--accent2)}
.char-count{
  font-size:.65rem;color:var(--text-muted);font-weight:400;
  font-variant-numeric:tabular-nums;
}
textarea{
  width:100%;height:260px;
  background:transparent;border:none;outline:none;
  color:var(--text);font-family:var(--font-cn);
  font-size:.95rem;line-height:1.75;
  resize:none;font-weight:400;
}
textarea::placeholder{color:var(--text-muted);font-weight:400}
textarea::-webkit-scrollbar{width:4px}
textarea::-webkit-scrollbar-track{background:transparent}
textarea::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}

/* Analyze Button */
.action-bar{
  display:flex;justify-content:center;margin-bottom:48px;
  opacity:0;animation:fadeUp .8s .35s ease forwards;
}
.analyze-btn{
  position:relative;
  background:linear-gradient(135deg,var(--accent),#a87850);
  color:#0a0a0a;border:none;
  padding:14px 48px;border-radius:100px;
  font-family:var(--font-body);font-size:.85rem;
  font-weight:600;letter-spacing:.06em;
  cursor:pointer;overflow:hidden;
  transition:transform .2s,box-shadow .3s;
}
.analyze-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 32px rgba(200,149,108,.3);
}
.analyze-btn:active{transform:translateY(0)}
.analyze-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transform:translateX(-100%);
  transition:transform .6s;
}
.analyze-btn:hover::after{transform:translateX(100%)}
.analyze-btn:disabled{
  opacity:.4;cursor:not-allowed;transform:none;
  box-shadow:none;
}
.analyze-btn .spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(10,10,10,.3);border-top-color:#0a0a0a;
  border-radius:50%;animation:spin .6s linear infinite;
  margin-right:8px;vertical-align:middle;
}

/* Results */
.results{
  display:none;
  opacity:0;transform:translateY(30px);
  transition:opacity .6s,transform .6s;
}
.results.visible{
  display:block;
  opacity:1;transform:translateY(0);
}

/* Score Section */
.score-section{
  display:flex;align-items:center;gap:48px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:40px;
  margin-bottom:24px;
  position:relative;overflow:hidden;
}
.score-section::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.5;
}
.score-ring{
  position:relative;width:160px;height:160px;flex-shrink:0;
}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .bg-circle{
  fill:none;stroke:var(--border);stroke-width:8;
}
.score-ring .fg-circle{
  fill:none;stroke-width:8;stroke-linecap:round;
  transition:stroke-dashoffset 1.5s ease,stroke .5s;
}
.score-value{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.score-number{
  font-family:var(--font-display);font-size:3.2rem;
  line-height:1;color:var(--text);
  transition:color .5s;
}
.score-unit{
  font-size:.65rem;color:var(--text-dim);
  letter-spacing:.15em;text-transform:uppercase;
  margin-top:4px;font-weight:400;
}
.score-details{flex:1}
.score-title{
  font-family:var(--font-display);font-size:1.6rem;
  margin-bottom:8px;font-weight:400;
}
.score-desc{
  font-size:.85rem;color:var(--text-dim);
  line-height:1.7;font-weight:400;max-width:480px;
}
.score-badges{
  display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;
}
.badge{
  font-size:.65rem;padding:4px 12px;border-radius:100px;
  font-weight:400;letter-spacing:.04em;
}
.badge-match{background:var(--accent-glow);color:var(--accent-light);border:1px solid rgba(200,149,108,.2)}
.badge-gap{background:var(--danger-glow);color:var(--danger);border:1px solid rgba(200,108,108,.2)}
.badge-warn{background:var(--warn-glow);color:var(--warn);border:1px solid rgba(200,184,108,.2)}

/* Analysis Grid */
.analysis-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:24px;
  margin-bottom:24px;
}
.analysis-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:28px;
  opacity:0;transform:translateY(20px);
}
.analysis-card.show{
  animation:fadeUp .6s ease forwards;
}
.card-title{
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--text-dim);margin-bottom:20px;font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.card-title .icon{
  width:18px;height:18px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;
}
.icon-keywords{background:var(--accent-glow);color:var(--accent)}
.icon-missing{background:var(--danger-glow);color:var(--danger)}
.icon-suggest{background:var(--accent2-glow);color:var(--accent2)}
.icon-strength{background:var(--warn-glow);color:var(--warn)}

/* Keyword Tags */
.keyword-list{
  display:flex;flex-wrap:wrap;gap:8px;
}
.keyword-tag{
  font-size:.75rem;padding:5px 14px;border-radius:6px;
  font-weight:400;transition:transform .2s,box-shadow .2s;
  cursor:default;
}
.keyword-tag:hover{transform:translateY(-1px)}
.keyword-tag.matched{
  background:var(--accent-glow);color:var(--accent-light);
  border:1px solid rgba(200,149,108,.15);
}
.keyword-tag.missing{
  background:var(--danger-glow);color:#e88;
  border:1px solid rgba(200,108,108,.15);
}
.keyword-tag.strength{
  background:var(--accent2-glow);color:var(--accent2);
  border:1px solid rgba(108,200,168,.15);
}

/* Suggestions */
.suggestion-list{list-style:none}
.suggestion-item{
  padding:12px 0;border-bottom:1px solid var(--border);
  display:flex;gap:12px;align-items:flex-start;
  font-size:.82rem;line-height:1.6;font-weight:400;
}
.suggestion-item:last-child{border-bottom:none}
.suggestion-num{
  flex-shrink:0;width:22px;height:22px;
  border-radius:50%;background:var(--accent2-glow);
  color:var(--accent2);font-size:.65rem;
  display:flex;align-items:center;justify-content:center;
  font-weight:500;margin-top:2px;
}
.suggestion-text{color:var(--text-dim)}
.suggestion-text strong{color:var(--text);font-weight:500}

/* Strength items */
.strength-list{list-style:none}
.strength-item{
  padding:10px 0;border-bottom:1px solid var(--border);
  font-size:.82rem;font-weight:400;color:var(--text-dim);
  display:flex;gap:10px;align-items:center;
}
.strength-item:last-child{border-bottom:none}
.strength-item::before{
  content:'✦';color:var(--warn);font-size:.6rem;flex-shrink:0;
}

/* Progress bars */
.match-bar-group{margin-top:8px}
.match-bar-item{
  margin-bottom:14px;
}
.match-bar-label{
  display:flex;justify-content:space-between;
  font-size:.72rem;margin-bottom:6px;
}
.match-bar-label span:first-child{color:var(--text-dim);font-weight:400}
.match-bar-label span:last-child{color:var(--text-muted);font-variant-numeric:tabular-nums}
.match-bar-track{
  height:4px;background:var(--border);border-radius:4px;overflow:hidden;
}
.match-bar-fill{
  height:100%;border-radius:4px;
  transition:width 1.2s ease;
  width:0;
}

/* Footer */
footer{
  text-align:center;padding:48px 0 32px;
  border-top:1px solid var(--border);margin-top:24px;
}
footer p{
  font-size:.65rem;color:var(--text-muted);
  letter-spacing:.1em;font-weight:400;
}

/* Animations */
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}
@keyframes spin{
  to{transform:rotate(360deg)}
}
@keyframes pulse{
  0%,100%{opacity:.07}
  50%{opacity:.12}
}
.ambient{animation:pulse 8s ease-in-out infinite}

/* Responsive */
@media(max-width:768px){
  .input-grid,.analysis-grid{grid-template-columns:1fr}
  .score-section{flex-direction:column;text-align:center;gap:24px}
  .score-details{display:flex;flex-direction:column;align-items:center}
  header{flex-direction:column;align-items:flex-start;gap:12px}
  .logo h1{font-size:1.8rem}
  textarea{height:180px}
}

/* Custom cursor area */
body:hover{cursor:default}
textarea{cursor:text}
.analyze-btn,.keyword-tag{cursor:pointer}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}

/* Empty state */
.empty-hint{
  text-align:center;padding:60px 20px;
  color:var(--text-muted);font-size:.85rem;font-weight:400;
  display:none;
}
.results:not(.visible)~.empty-hint{display:block}
</style>
</head>
<body>

<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<div class="container">
  <header>
    <div class="logo">
      <h1>Resume <em>Lens</em></h1>
      <span class="logo-sub">简历适配器</span>
    </div>
    <span class="header-tag">AI-Powered Matching</span>
  </header>

  <main>
    <div class="input-grid">
      <div class="input-panel resume-panel">
        <div class="panel-header">
          <span class="panel-label"><span class="dot"></span>你的简历</span>
          <span class="char-count" id="resumeCount">0 字</span>
        </div>
        <textarea id="resumeInput" placeholder="在此粘贴你的简历内容...&#10;&#10;支持中文或英文简历，系统将自动提取关键技能与经验"></textarea>
      </div>
      <div class="input-panel jd-panel">
        <div class="panel-header">
          <span class="panel-label"><span class="dot"></span>职位描述</span>
          <span class="char-count" id="jdCount">0 字</span>
        </div>
        <textarea id="jdInput" placeholder="在此粘贴目标职位的描述...&#10;&#10;包含职位要求、技能需求、职责描述等"></textarea>
      </div>
    </div>

    <div class="action-bar">
      <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">
        开始分析匹配度
      </button>
    </div>

    <div class="results" id="results">
      <!-- Score -->
      <div class="score-section">
        <div class="score-ring">
          <svg width="160" height="160" viewBox="0 0 160 160">
            <circle class="bg-circle" cx="80" cy="80" r="68"/>
            <circle class="fg-circle" id="scoreCircle" cx="80" cy="80" r="68"
              stroke-dasharray="427.26" stroke-dashoffset="427.26"/>
          </svg>
          <div class="score-value">
            <span class="score-number" id="scoreNumber">0</span>
            <span class="score-unit">匹配度</span>
          </div>
        </div>
        <div class="score-details">
          <h2 class="score-title" id="scoreTitle">—</h2>
          <p class="score-desc" id="scoreDesc"></p>
          <div class="score-badges" id="scoreBadges"></div>
        </div>
      </div>

      <!-- Analysis Cards -->
      <div class="analysis-grid">
        <div class="analysis-card" id="keywordsCard">
          <div class="card-title">
            <span class="icon icon-keywords">K</span>
            关键词匹配
          </div>
          <div class="keyword-list" id="keywordsList"></div>
        </div>
        <div class="analysis-card" id="missingCard">
          <div class="card-title">
            <span class="icon icon-missing">!</span>
            缺失关键词
          </div>
          <div class="keyword-list" id="missingList"></div>
        </div>
        <div class="analysis-card" id="suggestCard">
          <div class="card-title">
            <span class="icon icon-suggest">S</span>
            优化建议
          </div>
          <ul class="suggestion-list" id="suggestList"></ul>
        </div>
        <div class="analysis-card" id="strengthCard">
          <div class="card-title">
            <span class="icon icon-strength">★</span>
            简历亮点
          </div>
          <ul class="strength-list" id="strengthList"></ul>
        </div>
      </div>

      <!-- Dimension Breakdown -->
      <div class="analysis-card" id="dimensionCard" style="margin-bottom:24px">
        <div class="card-title">
          <span class="icon icon-keywords">D</span>
          维度匹配分析
        </div>
        <div class="match-bar-group" id="dimensionBars"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>RESUME LENS — 简历适配器 · 本地分析 · 数据不会上传</p>
  </footer>
</div>

<script>
// ===== Textarea char count =====
const resumeInput = document.getElementById('resumeInput');
const jdInput = document.getElementById('jdInput');
const resumeCount = document.getElementById('resumeCount');
const jdCount = document.getElementById('jdCount');

resumeInput.addEventListener('input', () => {
  resumeCount.textContent = resumeInput.value.length + ' 字';
});
jdInput.addEventListener('input', () => {
  jdCount.textContent = jdInput.value.length + ' 字';
});

// ===== Keyword Dictionaries =====
const TECH_SKILLS_ZH = [
  'JavaScript','TypeScript','Python','Java','Go','Rust','C++','C#','Ruby','PHP','Swift','Kotlin',
  'React','Vue','Angular','Svelte','Next.js','Nuxt.js','Node.js','Express','Django','Flask','Spring','SpringBoot',
  'Docker','Kubernetes','K8s','Jenkins','CI/CD','Git','GitHub','GitLab',
  'MySQL','PostgreSQL','MongoDB','Redis','Elasticsearch','Kafka','RabbitMQ',
  'AWS','Azure','GCP','阿里云','腾讯云',
  'Linux','Nginx','Webpack','Vite','Babel',
  'REST','GraphQL','gRPC','WebSocket','Microservices','微服务',
  'HTML','CSS','Sass','Less','Tailwind',
  'TensorFlow','PyTorch','机器学习','深度学习','NLP','计算机视觉','AI','LLM','大模型',
  'SQL','NoSQL','ORM','MyBatis','Hibernate',
  'Android','iOS','Flutter','React Native','小程序','Taro',
  'Figma','Sketch','UI设计','UX设计',
  'Agile','Scrum','Kanban','DevOps','SRE',
  'Hadoop','Spark','Flink','Hive','数据仓库','ETL',
  '网络安全','加密','OAuth','JWT',
  'Sass','Webpack','Rollup','Vite',
];

const SOFT_SKILLS_ZH = [
  '领导力','团队管理','项目管理','沟通能力','协作','跨部门','解决问题',
  '创新','自驱','学习能力','抗压','责任心','执行力','目标导向',
  '数据分析','商业分析','用户研究','产品思维','商业思维',
  '英语','英语流利','双语','国际化',
  '5年经验','3年经验','8年经验','10年经验','资深','高级','专家',
  '本科','硕士','博士','985','211',
];

const EXPERIENCE_PATTERNS = [
  {regex:/(\d+)\+?\s*年.*(经验|工作|开发)/gi, label:'工作经验', weight:1.5},
  {regex:/(负责|主导|带领|管理|推动|设计|开发|搭建|优化|重构|实现)/gi, label:'行动动词', weight:1.2},
  {regex:/(提升|提高|增长|降低|减少|节省|缩短|增加)\s*\d+/gi, label:'量化成果', weight:1.8},
  {regex:/(万|百万|千万|亿|%|倍)/gi, label:'数据规模', weight:1.3},
  {regex:/(团队|部门|小组|组)/gi, label:'团队规模', weight:1.0},
  {regex:/(从零|0到1|零到一|从0|搭建)/gi, label:'0→1经验', weight:1.6},
];

const JD_REQUIREMENT_PATTERNS = [
  {regex:/(必须|要求|需要|必备|必须具备|应当)[：:]?/gi, label:'硬性要求'},
  {regex:/(优先|加分|最好|理想|preferred|nice.to.have)/gi, label:'加分项'},
  {regex:/(熟悉|掌握|精通|了解|熟练|深入理解|深刻理解)/gi, label:'技能程度'},
  {regex:/(\d+)\+?\s*年/gi, label:'年限要求'},
];

// ===== Analysis Engine =====
function extractKeywords(text) {
  const found = new Set();
  const lower = text.toLowerCase();
  const allKeywords = [...TECH_SKILLS_ZH, ...SOFT_SKILLS_ZH];
  for (const kw of allKeywords) {
    const kwLower = kw.toLowerCase();
    if (lower.includes(kwLower) || text.includes(kw)) {
      found.add(kw);
    }
  }
  return [...found];
}

function extractExperienceSignals(text) {
  const signals = [];
  for (const p of EXPERIENCE_PATTERNS) {
    const matches = text.match(p.regex);
    if (matches) {
      signals.push({label: p.label, count: matches.length, weight: p.weight, samples: matches.slice(0, 3)});
    }
  }
  return signals;
}

function extractJDRequirements(text) {
  const reqs = {hard: [], plus: [], skillLevel: [], years: []};
  for (const p of JD_REQUIREMENT_PATTERNS) {
    const matches = text.match(p.regex);
    if (matches) {
      if (p.label === '硬性要求') reqs.hard.push(...matches);
      if (p.label === '加分项') reqs.plus.push(...matches);
      if (p.label === '技能程度') reqs.skillLevel.push(...matches);
      if (p.label === '年限要求') reqs.years.push(...matches);
    }
  }
  return reqs;
}

function computeMatch(resumeText, jdText) {
  const resumeKw = extractKeywords(resumeText);
  const jdKw = extractKeywords(jdText);
  const resumeSet = new Set(resumeKw.map(k => k.toLowerCase()));
  const jdSet = new Set(jdKw.map(k => k.toLowerCase()));

  const matched = jdKw.filter(k => resumeSet.has(k.toLowerCase()));
  const missing = jdKw.filter(k => !resumeSet.has(k.toLowerCase()));
  const extra = resumeKw.filter(k => !jdSet.has(k.toLowerCase()));

  // Keyword match score (0-40)
  const kwScore = jdKw.length > 0 ? (matched.length / jdKw.length) * 40 : 20;

  // Experience signal score (0-30)
  const resumeSignals = extractExperienceSignals(resumeText);
  const jdSignals = extractExperienceSignals(jdText);
  const resumeSignalLabels = new Set(resumeSignals.map(s => s.label));
  const jdSignalLabels = new Set(jdSignals.map(s => s.label));
  const signalMatch = jdSignals.length > 0
    ? [...jdSignalLabels].filter(l => resumeSignalLabels.has(l)).length / jdSignalLabels.size
    : 0.5;
  const expScore = signalMatch * 30;

  // JD requirement coverage (0-20)
  const jdReqs = extractJDRequirements(jdText);
  const reqScore = Math.min(20, (jdReqs.skillLevel.length > 0 ? 10 : 5) + (jdReqs.hard.length > 0 ? 5 : 2) + (jdReqs.plus.length > 0 ? 5 : 3));

  // Quantified achievements bonus (0-10)
  const quantMatches = resumeText.match(/(提升|提高|增长|降低|减少|节省|缩短|增加)\s*\d+/gi) || [];
  const quantScore = Math.min(10, quantMatches.length * 3);

  const totalScore = Math.round(Math.min(100, kwScore + expScore + reqScore + quantScore));

  return {
    score: totalScore,
    matched,
    missing,
    extra,
    resumeSignals,
    jdSignals,
    jdReqs,
    quantMatches,
    kwDetail: {
      total: jdKw.length,
      matchedCount: matched.length,
      missingCount: missing.length,
    }
  };
}

function generateSuggestions(result, resumeText, jdText) {
  const suggestions = [];

  if (result.missing.length > 0) {
    const topMissing = result.missing.slice(0, 5);
    suggestions.push({
      text: `在简历中补充缺失的关键技能：<strong>${topMissing.join('、')}</strong>。即使没有正式工作经验，也可以提及课程项目、自学经历或个人项目中的相关实践。`
    });
  }

  if (result.quantMatches.length === 0) {
    suggestions.push({
      text: '用<strong>具体数字</strong>量化你的成果。例如："提升系统性能30%"、"服务日活100万用户"、"缩短响应时间50%"。数据比形容词更有说服力。'
    });
  }

  const resumeSignals = result.resumeSignals;
  const hasActionVerbs = resumeSignals.some(s => s.label === '行动动词');
  if (!hasActionVerbs) {
    suggestions.push({
      text: '使用<strong>强行动动词</strong>开头描述经历：如"主导"、"搭建"、"重构"、"推动"、"设计"，而非"参与"、"协助"等弱动词。'
    });
  }

  const hasZeroToOne = resumeSignals.some(s => s.label === '0→1经验');
  if (!hasZeroToOne && jdText.includes('从零') || jdText.includes('0到1') || jdText.includes('搭建')) {
    suggestions.push({
      text: '职位要求从零搭建能力，建议在简历中突出<strong>0→1的项目经验</strong>，强调你在项目启动阶段的具体贡献。'
    });
  }

  if (result.jdReqs.years.length > 0) {
    const yearMatch = resumeText.match(/(\d+)\+?\s*年/);
    if (!yearMatch) {
      suggestions.push({
        text: '职位有年限要求，但简历中未明确体现工作年限。建议在简历开头或经历部分<strong>明确标注相关经验年限</strong>。'
      });
    }
  }

  if (result.score < 50) {
    suggestions.push({
      text: '当前匹配度较低，建议<strong>针对性地调整简历</strong>，将职位描述中的核心要求与你的经历建立明确对应关系，而非使用通用简历。'
    });
  }

  if (suggestions.length === 0) {
    suggestions.push({
      text: '你的简历与该职位匹配度良好！建议进一步<strong>精简表述</strong>，确保最相关的内容在简历前1/3位置可见。'
    });
  }

  return suggestions;
}

function generateStrengths(result, resumeText) {
  const strengths = [];

  if (result.matched.length >= 5) {
    strengths.push(`核心技能覆盖全面，匹配了 ${result.matched.length} 个职位关键词`);
  }

  const resumeSignals = result.resumeSignals;
  if (resumeSignals.some(s => s.label === '量化成果')) {
    strengths.push('善于用数据量化工作成果，体现业务影响力');
  }
  if (resumeSignals.some(s => s.label === '0→1经验')) {
    strengths.push('具备从零到一的项目启动与搭建经验');
  }
  if (resumeSignals.some(s => s.label === '行动动词' && s.count >= 3)) {
    strengths.push('经历描述使用了丰富的行动动词，表达有力');
  }
  if (resumeSignals.some(s => s.label === '工作经验')) {
    strengths.push('明确标注了工作经验年限');
  }
  if (result.extra.length >= 3) {
    const topExtra = result.extra.slice(0, 3).join('、');
    strengths.push(`拥有额外技能优势：${topExtra}，可成为差异化竞争力`);
  }

  if (strengths.length === 0) {
    strengths.push('简历内容已具备基本框架，持续优化可进一步提升竞争力');
  }

  return strengths;
}

function getDimensionScores(result, resumeText, jdText) {
  const dims = [];

  // Skills match
  const skillScore = result.kwDetail.total > 0
    ? Math.round((result.kwDetail.matchedCount / result.kwDetail.total) * 100)
    : 50;
  dims.push({name: '技能匹配', score: skillScore, color: 'var(--accent)'});

  // Experience depth
  const expSignals = result.resumeSignals;
  const expScore = Math.min(100, expSignals.reduce((acc, s) => acc + s.count * s.weight * 15, 0) + 20);
  dims.push({name: '经验深度', score: Math.round(expScore), color: 'var(--accent2)'});

  // Achievement quantification
  const quantScore = Math.min(100, (result.quantMatches.length * 25) + (expSignals.some(s => s.label === '数据规模') ? 30 : 0) + 10);
  dims.push({name: '成果量化', score: Math.round(quantScore), color: 'var(--warn)'});

  // JD alignment
  const jdReqs = result.jdReqs;
  let alignScore = 40;
  if (jdReqs.hard.length > 0) alignScore += 15;
  if (jdReqs.skillLevel.length > 0) alignScore += 15;
  if (jdReqs.plus.length > 0) alignScore += 10;
  if (result.score > 60) alignScore += 20;
  dims.push({name: '职位契合', score: Math.min(100, Math.round(alignScore)), color: '#8a8ac8'});

  // Expression quality
  let exprScore = 30;
  if (expSignals.some(s => s.label === '行动动词')) exprScore += 25;
  if (result.quantMatches.length > 0) exprScore += 20;
  if (resumeText.length > 200) exprScore += 15;
  if (expSignals.some(s => s.label === '工作经验')) exprScore += 10;
  dims.push({name: '表达质量', score: Math.min(100, Math.round(exprScore)), color: '#c88aac'});

  return dims;
}

// ===== UI Rendering =====
function analyze() {
  const resumeText = resumeInput.value.trim();
  const jdText = jdInput.value.trim();

  if (!resumeText || !jdText) {
    shakeButton();
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>分析中...';

  setTimeout(() => {
    const result = computeMatch(resumeText, jdText);
    const suggestions = generateSuggestions(result, resumeText, jdText);
    const strengths = generateStrengths(result, resumeText);
    const dimensions = getDimensionScores(result, resumeText, jdText);

    renderResults(result, suggestions, strengths, dimensions);

    btn.disabled = false;
    btn.innerHTML = '重新分析';
  }, 800);
}

function shakeButton() {
  const btn = document.getElementById('analyzeBtn');
  btn.style.animation = 'none';
  btn.offsetHeight; // reflow
  btn.style.animation = 'shake .4s ease';
  setTimeout(() => btn.style.animation = '', 400);
}

function renderResults(result, suggestions, strengths, dimensions) {
  const resultsEl = document.getElementById('results');
  resultsEl.classList.add('visible');

  // Scroll to results
  setTimeout(() => {
    resultsEl.scrollIntoView({behavior: 'smooth', block: 'start'});
  }, 100);

  // Score
  const score = result.score;
  const scoreColor = score >= 70 ? 'var(--accent2)' : score >= 40 ? 'var(--accent)' : 'var(--danger)';

  const circle = document.getElementById('scoreCircle');
  const circumference = 2 * Math.PI * 68;
  circle.style.stroke = scoreColor;
  setTimeout(() => {
    circle.style.strokeDashoffset = circumference - (score / 100) * circumference;
  }, 100);

  const scoreNum = document.getElementById('scoreNumber');
  scoreNum.style.color = scoreColor;
  animateNumber(scoreNum, 0, score, 1200);

  // Score title & desc
  const titleEl = document.getElementById('scoreTitle');
  const descEl = document.getElementById('scoreDesc');
  if (score >= 80) {
    titleEl.textContent = '高度匹配';
    descEl.textContent = '你的简历与该职位高度契合，核心技能和经验覆盖全面。建议关注细节优化，进一步提升竞争力。';
  } else if (score >= 60) {
    titleEl.textContent = '较好匹配';
    descEl.textContent = '你的简历与职位有较好的匹配度，部分关键领域已有覆盖。通过补充缺失技能和优化表述，可显著提升匹配度。';
  } else if (score >= 40) {
    titleEl.textContent = '部分匹配';
    descEl.textContent = '你的简历与职位存在一定差距，有较多关键技能和经验尚未体现。建议针对性地调整简历内容，突出相关经历。';
  } else {
    titleEl.textContent = '匹配度较低';
    descEl.textContent = '当前简历与职位要求差距较大。建议重新审视职位核心要求，调整简历策略，或考虑更匹配的职位方向。';
  }

  // Badges
  const badgesEl = document.getElementById('scoreBadges');
  badgesEl.innerHTML = '';
  if (result.kwDetail.matchedCount > 0) {
    badgesEl.innerHTML += `<span class="badge badge-match">${result.kwDetail.matchedCount} 项技能匹配</span>`;
  }
  if (result.kwDetail.missingCount > 0) {
    badgesEl.innerHTML += `<span class="badge badge-gap">${result.kwDetail.missingCount} 项技能缺失</span>`;
  }
  if (result.quantMatches.length > 0) {
    badgesEl.innerHTML += `<span class="badge badge-warn">${result.quantMatches.length} 处量化成果</span>`;
  }

  // Keywords
  const kwList = document.getElementById('keywordsList');
  kwList.innerHTML = result.matched.map(k => `<span class="keyword-tag matched">${k}</span>`).join('');

  // Missing
  const missList = document.getElementById('missingList');
  if (result.missing.length === 0) {
    missList.innerHTML = '<span style="color:var(--text-muted);font-size:.8rem;font-weight:400">未发现明显缺失关键词</span>';
  } else {
    missList.innerHTML = result.missing.map(k => `<span class="keyword-tag missing">${k}</span>`).join('');
  }

  // Suggestions
  const sugList = document.getElementById('suggestList');
  sugList.innerHTML = suggestions.map((s, i) =>
    `<li class="suggestion-item"><span class="suggestion-num">${i + 1}</span><span class="suggestion-text">${s.text}</span></li>`
  ).join('');

  // Strengths
  const strList = document.getElementById('strengthList');
  strList.innerHTML = strengths.map(s =>
    `<li class="strength-item">${s}</li>`
  ).join('');

  // Dimension bars
  const dimBars = document.getElementById('dimensionBars');
  dimBars.innerHTML = dimensions.map(d => `
    <div class="match-bar-item">
      <div class="match-bar-label">
        <span>${d.name}</span><span>${d.score}%</span>
      </div>
      <div class="match-bar-track">
        <div class="match-bar-fill" data-width="${d.score}" style="background:${d.color}"></div>
      </div>
    </div>
  `).join('');

  // Animate cards
  const cards = document.querySelectorAll('.analysis-card');
  cards.forEach((card, i) => {
    card.classList.remove('show');
    card.style.animationDelay = (0.1 + i * 0.1) + 's';
    setTimeout(() => card.classList.add('show'), 50);
  });

  // Animate bars
  setTimeout(() => {
    document.querySelectorAll('.match-bar-fill').forEach(bar => {
      bar.style.width = bar.dataset.width + '%';
    });
  }, 300);
}

function animateNumber(el, from, to, duration) {
  const start = performance.now();
  function update(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

// Add shake keyframe dynamically
const style = document.createElement('style');
style.textContent = `@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}`;
document.head.appendChild(style);

// Ambient follow mouse
document.addEventListener('mousemove', (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 40;
  const y = (e.clientY / window.innerHeight - 0.5) * 40;
  document.querySelector('.ambient-1').style.transform = `translate(${x}px, ${y}px)`;
  document.querySelector('.ambient-2').style.transform = `translate(${-x}px, ${-y}px)`;
});
</script>
