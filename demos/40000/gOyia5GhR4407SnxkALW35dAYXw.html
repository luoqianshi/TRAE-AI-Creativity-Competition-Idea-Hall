<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>星潮锻造者 StarForge —— 项目全貌展示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0a0e1a;
    color: #e5e7eb;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: #1f2937; border-bottom: 1px solid #374151; padding: 8px 16px;
  }
  .topbar .left { display: flex; align-items: center; gap: 16px; font-size: 14px; }
  .topbar .right { display: flex; align-items: center; gap: 8px; }
  .badge {
    background: rgba(124,58,237,.4); border: 1px solid #8b5cf6; color: #fff;
    padding: 4px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .badge:hover { background: rgba(124,58,237,.7); }
  .btn-ghost {
    background: #374151; border: 1px solid #4b5563; color: #d1d5db;
    padding: 4px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .btn-ghost:hover { background: #4b5563; }
  .march-hint { color: #facc15; font-size: 13px; }
  .resbar {
    display: flex; flex-wrap: wrap; gap: 6px;
    background: #1f2937; padding: 8px; border-bottom: 1px solid #374151;
  }
  .res-chip {
    display: flex; align-items: center; gap: 6px;
    background: rgba(17,24,39,.5); padding: 4px 8px; border-radius: 6px; font-size: 12px;
  }
  .res-chip .name { color: #9ca3af; }
  .res-chip .val { color: #fff; font-family: ui-monospace, monospace; }
  .pos { color: #4ade80; }
  .neg { color: #f87171; }
  .navbar {
    display: flex; gap: 8px;
    background: #1f2937; padding: 8px 16px; border-bottom: 1px solid #374151;
  }
  .nav-btn {
    display: flex; align-items: center; gap: 6px;
    background: #374151; color: #fff; border: none;
    padding: 8px 16px; border-radius: 6px; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: background .15s;
  }
  .nav-btn:hover { background: #4b5563; }
  .nav-btn.active { background: #2563eb; }
  .nav-btn.active:hover { background: #1d4ed8; }
  .main {
    flex: 1; background: #030712; overflow: auto; padding: 24px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .map-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .map-title { font-size: 18px; font-weight: 700; color: #fff; }
  .map-sub { font-size: 12px; color: #9ca3af; }
  .map {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 6px; padding: 8px; background: #111827;
    border: 1px solid #374151; border-radius: 12px;
  }
  .cell {
    width: 96px; height: 96px;
    background: #1f2937; border: 2px solid #374151; border-radius: 8px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    position: relative; transition: all .15s;
  }
  .cell:hover { background: #374151; border-color: #60a5fa; }
  .cell.has-building { background: #1e3a8a; border-color: #3b82f6; }
  .cell.has-building.foundation { background: #14532d; border-color: #22c55e; }
  .cell.has-building.advanced { background: #713f12; border-color: #eab308; }
  .cell.has-building.high_tier { background: #7f1d1d; border-color: #ef4444; }
  .cell.has-building.progression { background: #581c87; border-color: #a855f7; }
  .cell.has-building.endgame { background: #1f2937; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,.3); }
  .cell .icon { font-size: 28px; }
  .cell .lvl { font-size: 10px; color: #d1d5db; margin-top: 2px; }
  .cell .lvl-num { font-weight: 700; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  .modal {
    background: #1f2937; border: 1px solid #4b5563; border-radius: 12px;
    width: 100%; max-width: 1024px; max-height: 90vh; overflow: auto;
    display: flex; flex-direction: column;
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border-bottom: 1px solid #4b5563;
  }
  .modal-title { font-size: 20px; font-weight: 700; color: #fff; }
  .modal-close { background: none; border: none; color: #9ca3af; font-size: 24px; cursor: pointer; }
  .modal-close:hover { color: #fff; }
  .modal-body { padding: 16px; }
  .tech-canvas {
    position: relative; width: 1100px; height: 660px;
    background: #111827; border-radius: 8px; margin: 0 auto;
  }
  .tech-link { position: absolute; background: #4b5563; transform-origin: 0 0; pointer-events: none; }
  .tech-link.active { background: #22c55e; }
  .tech-node {
    position: absolute; width: 180px; height: 110px;
    background: #1f2937; border: 2px solid #4b5563; border-radius: 8px;
    padding: 8px; cursor: pointer; display: flex; flex-direction: column;
    transition: all .15s;
  }
  .tech-node:hover { border-color: #60a5fa; transform: scale(1.03); }
  .tech-node.researched { border-color: #22c55e; background: #14532d; }
  .tech-node.available { border-color: #3b82f6; }
  .tech-node .row1 { display: flex; align-items: center; gap: 6px; }
  .tech-node .ti { font-size: 22px; }
  .tech-node .tn { color: #fff; font-weight: 700; font-size: 13px; }
  .tech-node .badge-r { font-size: 10px; color: #86efac; margin-left: auto; }
  .tech-node .cost { font-size: 10px; color: #9ca3af; margin-top: 4px; }
  .tech-node .effect { font-size: 10px; color: #93c5fd; margin-top: 2px; }
  .tech-node .btn {
    margin-top: auto; background: #2563eb; color: #fff; border: none;
    padding: 4px; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer;
  }
  .tech-node .btn:disabled { background: #4b5563; cursor: not-allowed; }
  .tech-node .btn.researched-btn { background: #16a34a; cursor: default; }
  .cmdr-wrap { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
  .cmdr-pool, .cmdr-owned { background: #111827; border-radius: 8px; padding: 12px; }
  .cmdr-pool h3, .cmdr-owned h3 { color: #fff; font-size: 14px; margin-bottom: 8px; }
  .cmdr-card {
    background: #1f2937; border: 2px solid #4b5563; border-radius: 8px;
    padding: 10px; margin-bottom: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .cmdr-card.legendary { border-color: #facc15; background: rgba(250,204,21,.1); }
  .cmdr-card.epic { border-color: #a855f7; background: rgba(168,85,247,.1); }
  .cmdr-card.rare { border-color: #60a5fa; background: rgba(96,165,250,.1); }
  .cmdr-card .name { color: #fff; font-weight: 700; font-size: 14px; }
  .cmdr-card .stars { color: #facc15; font-size: 12px; }
  .cmdr-card .ability { color: #d1d5db; font-size: 12px; }
  .cmdr-card .stats { display: flex; gap: 8px; font-size: 11px; color: #9ca3af; }
  .cmdr-card .btns { display: flex; gap: 6px; margin-top: 4px; }
  .cmdr-card button {
    flex: 1; background: #2563eb; color: #fff; border: none;
    padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  .cmdr-card button.equip-btn { background: #16a34a; }
  .cmdr-card button.unequip-btn { background: #6b7280; }
  .cmdr-card button:disabled { background: #4b5563; cursor: not-allowed; }
  .ship-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ship-list, .formation { background: #111827; border-radius: 8px; padding: 12px; }
  .ship-list h3, .formation h3 { color: #fff; font-size: 14px; margin-bottom: 8px; }
  .ship-card {
    background: #1f2937; border: 1px solid #4b5563; border-radius: 6px;
    padding: 8px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px;
  }
  .ship-card .si { font-size: 26px; }
  .ship-card .info { flex: 1; }
  .ship-card .name { color: #fff; font-weight: 700; font-size: 13px; }
  .ship-card .stats { color: #9ca3af; font-size: 10px; }
  .ship-card .cost { color: #d1d5db; font-size: 10px; }
  .ship-card button {
    background: #2563eb; color: #fff; border: none;
    padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  .ship-card button:disabled { background: #4b5563; cursor: not-allowed; }
  .formation-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;

  }
  .formation-cell {
    background: #1f2937; border: 1px solid #4b5563; border-radius: 4px;

    font-size: 18px; position: relative; cursor: pointer;
  }
  .formation-cell:hover { border-color: #60a5fa; }
  .formation-cell .cnt { position: absolute; top: 1px; right: 3px; font-size: 9px; color: #facc15; }
  .galaxy {
    width: 100%; background: #000; border: 1px solid #1f2937;
    border-radius: 8px; position: relative; overflow: hidden; aspect-ratio: 50/30;
  }
  .galaxy .star {
    position: absolute; width: 2px; height: 2px;
    background: #fff; border-radius: 50%; opacity: .6;
  }
  .galaxy .player {
    position: absolute; width: 22px; height: 22px;
    border-radius: 50%; transform: translate(-50%, -50%);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .galaxy .me { background: #22c55e; box-shadow: 0 0 12px #22c55e; }
  .galaxy .other { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .galaxy .other:hover { box-shadow: 0 0 14px #ef4444; transform: translate(-50%,-50%) scale(1.4); }
  .galaxy .march {
    position: absolute; width: 10px; height: 10px;
    background: #facc15; border-radius: 50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 8px #facc15;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50% { transform: translate(-50%,-50%) scale(1.4); }
  }
  .auc-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .auc-form, .auc-list { background: #111827; border-radius: 8px; padding: 12px; }
  .auc-form h3, .auc-list h3 { color: #fff; font-size: 14px; margin-bottom: 8px; }
  .auc-form label { display: block; color: #9ca3af; font-size: 12px; margin: 6px 0 2px; }
  .auc-form select, .auc-form input {

    padding: 6px 8px; border-radius: 4px; font-size: 12px;

  .auc-form button {

    padding: 8px; border-radius: 4px; font-size: 13px; font-weight: 700; cursor: pointer;

  .auc-form button:disabled { background: #4b5563; cursor: not-allowed; }
  .auc-item {
    background: #1f2937; border: 1px solid #4b5563; border-radius: 6px;

  .auc-item .name { color: #fff; font-weight: 700; font-size: 13px; }
  .auc-item .qty { color: #9ca3af; font-size: 11px; }
  .auc-item .price { color: #facc15; font-size: 13px; font-weight: 700; }
  .auc-item button {
    background: #16a34a; color: #fff; border: none;
    padding: 3px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
  }
  .auc-item button:disabled { background: #4b5563; cursor: not-allowed; }
  .auc-item.legendary { border-color: #facc15; }
  .auc-item.epic { border-color: #a855f7; }
  .auc-item.rare { border-color: #60a5fa; }
  .bdetail {
    background: #111827; border: 1px solid #374151; border-radius: 8px;
    padding: 12px; max-width: 360px;
  }
  .bdetail .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bdetail .head .icon { font-size: 24px; }
  .bdetail .head .name { color: #fff; font-weight: 700; font-size: 15px; }
  .bdetail .head .lvl { color: #9ca3af; font-size: 12px; margin-left: auto; }
  .bdetail .desc { color: #d1d5db; font-size: 12px; margin-bottom: 8px; }
  .bdetail .section { font-size: 11px; color: #9ca3af; margin: 6px 0 2px; }
  .bdetail .prod-line { color: #4ade80; font-size: 12px; margin: 2px 0; }
  .bdetail .cost-line { color: #d1d5db; font-size: 12px; margin: 2px 0; }
  .bdetail .warn { color: #f87171; font-size: 11px; }
  .bdetail button {
    width: 100%; background: #2563eb; color: #fff; border: none;
    padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-top: 8px;
  }
  .bdetail button:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
  .footer {
    background: #1f2937; border-top: 1px solid #374151;
    padding: 8px 16px; text-align: center; color: #6b7280; font-size: 11px;
  }
  .legend {
    display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 16px;
    background: #111827; border-top: 1px solid #374151; font-size: 11px; color: #9ca3af;
  }
  .legend .item { display: flex; align-items: center; gap: 4px; }
  .legend .dot { width: 10px; height: 10px; border-radius: 2px; }
</style>
</head>

const $ = (s,p=document) => p.querySelector(s);
const $$ = (s,p=document) => Array.from(p.querySelectorAll(s));
const fmt = (n) => {
  if (n===undefined||n===null) return '0';
  const abs=Math.abs(n);
  if (abs>=1e6) return (n/1e6).toFixed(2)+'M';
  if (abs>=1e3) return (n/1e3).toFixed(2)+'K';
  return n.toFixed(abs<1?3:0);
};
const fmtRate = (n) => (n>=0?'+':'')+fmt(n);

function buildingProd(b) {
  const cfg = BUILDINGS[b.id];
  if (!cfg || b.level===0) return {};
  const r = {};
  for (const k of Object.keys(cfg.baseProd)) r[k] = cfg.baseProd[k] * b.level;
  if (state.techs.advanced_mining && r.silicate) r.silicate *= 1.2;
  if (state.techs.deep_extraction && r.gold) r.gold *= 1.3;
  if (state.techs.solar_efficiency && r.fusionFuel) r.fusionFuel *= 1.25;
  if (state.techs.fusion_core && r.fusionFuel) r.fusionFuel *= 1.5;
  if (state.techs.quantum_field && r.qubits) r.qubits *= 2.0;
  if (state.techs.antimatter_synthesis && r.antimatter) r.antimatter *= 1.5;
  if (state.techs.neural_network && r.synaptic) r.synaptic *= 1.25;
  if (state.techs.stellar_expansion) for (const k of Object.keys(r)) r[k] *= 1.15;
  return r;
}
function totalProduction() {
  const tot = {};
  for (const b of Object.values(state.buildings)) {
    const p = buildingProd(b);
    for (const k of Object.keys(p)) tot[k] = (tot[k]||0) + p[k];
  }
  return tot;
}
function upgradeCost(id, level) {
  const cfg = BUILDINGS[id];
  const c = {};
  for (const k of Object.keys(cfg.baseCost)) c[k] = Math.floor(cfg.baseCost[k] * Math.pow(cfg.costMul, level));
  return c;
}
function canAfford(cost) {
  for (const k of Object.keys(cost)) if ((state.resources[k]||0) < cost[k]) return false;
  return true;
}
function deduct(cost) {
  for (const k of Object.keys(cost)) state.resources[k] = (state.resources[k]||0) - cost[k];
}
function fmtCostLine(cost) {
  const parts = [];
  for (const k of RES_KEYS) {
    if (cost[k] && cost[k]>0) {
      const have = state.resources[k]||0;
      const ok = have >= cost[k];
      parts.push(`<span style="color:${ok?'#d1d5db':'#f87171'}">${RES_ICONS[k]}${fmt(cost[k])}</span>`);
    }
  }
  return parts.join(' ');
}

function render() {
  renderResourceBar();
  renderMain();
  $('#march-count').textContent = state.marches.length;
}
function renderResourceBar() {
  const tot = totalProduction();
  const html = RES_KEYS.map(k => {
    const v = state.resources[k]||0, r = tot[k]||0;
    let rateHtml = '';
    if (r>0) rateHtml += `<span class="pos">+${fmt(r)}/s</span>`;
    else if (r<0) rateHtml += `<span class="neg">${fmt(r)}/s</span>`;
    return `<div class="res-chip">
      <span style="color:${RES_COLORS[k]}">${RES_ICONS[k]}</span>
      <span class="name">${RES_NAMES[k]}</span>
      <span class="val">${fmt(v)}</span>
      ${rateHtml}
    </div>`;
  }).join('');
  $('#resbar').innerHTML = html;
}
function renderMain() {
  $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view===state.view));
  if (state.view==='base') renderBase();
  else if (state.view==='tech') renderTechTree();
  else if (state.view==='cmdr') renderCommander();
  else if (state.view==='ship') renderShips();
  else if (state.view==='galaxy') renderGalaxy();
  else if (state.view==='auction') renderAuction();
}

function renderBase() {
  const cells = [];
  for (let y=-2;y<=2;y++) {
    for (let x=-2;x<=2;x++) {
      const id = findBuildingAt(x,y);
      const b = id ? state.buildings[id] : null;
      const cfg = id ? BUILDINGS[id] : null;
      const cat = cfg ? cfg.category : '';
      cells.push(`<div class="cell ${b?'has-building '+cat:''}" data-x="${x}" data-y="${y}">
        ${b?`<div class="icon">${cfg.icon}</div><div class="lvl">Lv.<span class="lvl-num">${b.level}</span></div>`:''}
      </div>`);
    }
  }
  const html = `
    <div class="map-wrap">
      <div class="map-title">🏗️ 星区基地建造地图 (5×5)</div>
      <div class="map-sub">点击建筑查看详情/升级，点击空白格建造新设施</div>
      <div class="map">${cells.join('')}</div>
      <div class="map-sub" style="margin-top:8px;">📍 当前玩家: 坐标 (${state.me.x}, ${state.me.y}) · 建造半径: ${buildRadius()} 格</div>
    </div>`;
  $('#main').innerHTML = html;
  $$('.cell').forEach(el => {
    el.addEventListener('click', () => {
      const x = parseInt(el.dataset.x), y = parseInt(el.dataset.y);
      const id = findBuildingAt(x,y);
      if (id) showBuildingDetail(id);
      else showBuildDialog(x,y);
    });
  });
}
function findBuildingAt(x,y) {
  for (const b of Object.values(state.buildings)) {
    if (b.level>0) {
      const cfg = BUILDINGS[b.id];
      if (cfg.gridX===x && cfg.gridY===y) return b.id;
    }
  }
  return null;
}
function buildRadius() { const cc = state.buildings.command_center; return 1 + (cc?cc.level-1:0); }

function showBuildingDetail(id) {
  const b = state.buildings[id], cfg = BUILDINGS[id];
  const cost = upgradeCost(id, b.level);
  const affordable = canAfford(cost);
  const prod = buildingProd(b);
  const prodParts = Object.keys(prod).map(k => `<div class="prod-line">+${fmt(prod[k])} ${RES_NAMES[k]}/s</div>`).join('');
  const costParts = fmtCostLine(cost);
  const html = `<div class="bdetail">
    <div class="head">
      <div class="icon">${cfg.icon}</div>
      <div class="name">${cfg.name}</div>
      <div class="lvl">Lv.${b.level}</div>
    </div>
    <div class="desc">${cfg.desc}</div>
    ${prodParts ? `<div class="section">当前产出：</div>${prodParts}` : ''}
    <div class="section">下一级升级消耗：</div>
    <div class="cost-line">${costParts}</div>
    ${!affordable ? '<div class="warn">资源不足</div>' : ''}
    <button ${affordable?'':'disabled'} id="btn-upgrade">升级到 Lv.${b.level+1}</button>
  </div>`;
  openModal('🏠 建筑详情', html);
  if (affordable) {
    $('#btn-upgrade').addEventListener('click', () => {
      deduct(cost); b.level += 1; closeModal(); render();
    });
  }
}

  const html = `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:720px;">
    ${Object.values(BUILDINGS).filter(b => !b.isFoundation).map(cfg => {

        const id = btn.dataset.id;

        deduct(cost); state.buildings[id].level = 1;
        closeModal(); render();
      });
    }
  });
}

function renderTechTree() {
  const w=180, h=110, gx=24, gy=80;
  const nodes = Object.values(TECHS).map(t => ({...t, px: 60 + t.x*(w+gx), py: 30 + t.y*(h-30) }));
  const nodeMap = {};
  nodes.forEach(n => nodeMap[n.id] = n);
  const links = [];
  nodes.forEach(n => n.prereq.forEach(p => {
    const pn = nodeMap[p];
    if (pn) {
      const x1 = pn.px + w, y1 = pn.py + h/2;
      const x2 = n.px, y2 = n.py + h/2;
      const dx = x2-x1, dy = y2-y1;
      const len = Math.sqrt(dx*dx + dy*dy);
      const ang = Math.atan2(dy,dx) * 180 / Math.PI;
      const active = state.techs[p] && state.techs[n.id];
      links.push(`<div class="tech-link ${active?'active':''}" style="left:${x1}px;top:${y1}px;width:${len}px;height:3px;transform:rotate(${ang}deg);"></div>`);
    }
  }));
  const cards = nodes.map(n => {
    const researched = !!state.techs[n.id];
    const prereqMet = n.prereq.every(p => state.techs[p]);
    const costParts = Object.keys(n.cost).map(k => `${RES_ICONS[k]}${fmt(n.cost[k])}`).join(' ');
    const affordable = canAfford(n.cost);
    const canResearch = !researched && prereqMet && affordable;
    return `<div class="tech-node ${researched?'researched':(prereqMet?'available':'')}" style="left:${n.px}px;top:${n.py}px;">
      <div class="row1">
        <span class="ti">${n.icon}</span>
        <span class="tn">${n.name}</span>
        ${researched?'<span class="badge-r">✓已研究</span>':''}
      </div>
      <div class="effect">📈 ${n.effect}</div>
      <div class="cost">💰 ${costParts || '免费'}</div>
      <button class="btn ${researched?'researched-btn':''}" ${canResearch?'':'disabled'} data-r="${n.id}">
        ${researched?'已研究':(prereqMet?(affordable?'研究':'资源不足'):'未解锁')}
      </button>
    </div>`;
  }).join('');
  const html = `<div style="overflow:auto;max-width:100%;">
    <div class="tech-canvas">${links.join('')}${cards}</div>
  </div>
  <div style="margin-top:8px;font-size:11px;color:#9ca3af;text-align:center;">
    🌳 13 个科技节点 · 7 大类别（根基/采矿/能量/舰船/科研/战斗/终极）· 解锁后自动加成对应资源产出
  </div>`;
  $('#main').innerHTML = html;
  $$('button[data-r]').forEach(btn => {
    if (!btn.disabled) {
      btn.addEventListener('click', () => {
        const id = btn.dataset.r;
        const t = TECHS[id];
        deduct(t.cost); state.techs[id] = true; render();
      });
    }
  });
}

  }).join('');

      </div>
      <h3 style="margin-top:12px;">📜 已招募 (${state.commanders.length})</h3>
      ${owned || '<div style="color:#6b7280;font-size:12px;padding:12px;text-align:center;">还没有指挥官，快去抽卡！</div>'}
    </div>
    <div class="cmdr-owned">
      <h3>⚔️ 出战编队（3 槽位）</h3>
      ${slots}
      <div style="margin-top:12px;font-size:11px;color:#9ca3af;">
        4 阶稀有度：普通 → 稀有 → 史诗 → 传奇。传奇指挥官拥有改变战局的独特技能。
      </div>
    </div>
  </div>`;
  $('#main').innerHTML = html;
  const draw = (n) => {
    const cost = n * 100;
    if ((state.resources.darkMatter||0) < cost) return;
    state.resources.darkMatter -= cost;
    for (let i=0;i<n;i++) {
      const r = Math.random();
      let rarity = 'common';
      if (r<0.05) rarity='legendary';
      else if (r<0.2) rarity='epic';
      else if (r<0.5) rarity='rare';
      const pool = CMDR_POOL.filter(c => c.rarity===rarity);
      state.commanders.push({ ...pool[Math.floor(Math.random()*pool.length)] });
    }
    render();
  };
  $('#draw-1').addEventListener('click', () => draw(1));
  $('#draw-10').addEventListener('click', () => draw(10));
  $$('button[data-t="toggle"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.i);
      const slot = state.commanderSlots.indexOf(i);
      if (slot>=0) state.commanderSlots[slot]=null;
      else { const empty = state.commanderSlots.indexOf(null); if (empty>=0) state.commanderSlots[empty]=i; }
      render();
    });
  });
}

function renderShips() {
  const list = Object.values(SHIPS).map(s => {
    const owned = state.ships[s.id] || { total:0,undeployed:0,deployed:0 };
    const canBuild = canAfford(s.cost);
    return `<div class="ship-card">
      <div class="si">${s.icon}</div>
      <div class="info">
        <div class="name">${s.name} <span style="color:#9ca3af;">×${owned.total}</span></div>
        <div class="stats">HP ${s.hp} · ⚔️ ${s.atk} · 🛡️ ${s.def} · 💨 ${s.spd}</div>
        <div class="cost">${fmtCostLine(s.cost)} · ⏱️ ${s.buildTime}s</div>
      </div>
      <button data-b="${s.id}" ${canBuild?'':'disabled'}>建造</button>
    </div>`;
  }).join('');
  const formCells = state.formation.map((id, i) => {
    const ship = id ? SHIPS[id] : null;
    const count = id ? (state.ships[id]?state.ships[id].deployed:0) : 0;
    return `<div class="formation-cell" data-p="${i}">${ship?ship.icon:''}${ship&&count?`<span class="cnt">${count}</span>`:''}</div>`;
  }).join('');
  const html = `<div class="ship-wrap">
    <div class="ship-list"><h3>🚀 舰船船坞</h3>${list}</div>
    <div class="formation">
      <h3>⚔️ 5×5 出征阵型</h3>
      <div class="formation-grid">${formCells}</div>
      <div style="margin-top:12px;font-size:11px;color:#9ca3af;">
        点击阵型格放置舰船（自动部署第一艘未部署的船）。5 阶舰船：侦察机 → 战斗机 → 巡洋舰 → 战列舰 → 无畏舰。
      </div>
    </div>
  </div>`;
  $('#main').innerHTML = html;
  $$('button[data-b]').forEach(btn => {
    if (!btn.disabled) {
      btn.addEventListener('click', () => {
        const id = btn.dataset.b;
        const s = SHIPS[id];
        deduct(s.cost);
        if (!state.ships[id]) state.ships[id] = { total:0,undeployed:0,deployed:0 };
        state.ships[id].total++; state.ships[id].undeployed++;
        render();
      });
    }
  });
  $$('.formation-cell').forEach(c => {
    c.addEventListener('click', () => {
      const pos = parseInt(c.dataset.p);
      for (const id of Object.keys(state.ships)) {
        const sh = state.ships[id];
        if (sh.undeployed>0) { sh.undeployed--; sh.deployed++; state.formation[pos]=id; render(); return; }
      }
    });
  });
}

function renderGalaxy() {
  let stars = '';
  for (let i=0;i<120;i++) {
    const x = Math.random()*100, y = Math.random()*100;
    stars += `<div class="star" style="left:${x}%;top:${y}%;"></div>`;
  }
  const me = `<div class="player me" style="left:${state.me.x*2}%;top:${state.me.y*100/30}%;" title="我 (${state.me.x},${state.me.y})">⭐</div>`;
  const others = state.others.map(o => `<div class="player other" data-id="${o.id}" style="left:${o.x*2}%;top:${o.y*100/30}%;" title="${o.name} (${o.x},${o.y})">${o.name[0]}</div>`).join('');
  const marches = state.marches.map(m => `<div class="march" style="left:${m.x*2}%;top:${m.y*100/30}%;"></div>`).join('');
  const html = `<div>
    <div style="font-size:13px;color:#9ca3af;margin-bottom:6px;">🌌 50×30 星系地图 · 点击其他玩家头像可发起攻击（派遣最强舰队，10s 抵达）</div>
    <div class="galaxy">${stars}${me}${others}${marches}</div>
    <div style="margin-top:8px;font-size:11px;color:#9ca3af;">🟢 我方基地 · 🔴 敌方基地 · 🟡 行军中部队</div>
  </div>`;
  $('#main').innerHTML = html;
  $$('.player.other').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.dataset.id);
      const target = state.others.find(o => o.id===id);
      if (!target) return;
      if (!confirm(`确定向 ${target.name} 发起进攻？\n你的舰队将在 10 秒后抵达。`)) return;
      state.marches.push({ fromId:state.me.id,toId:target.id, x:state.me.x, y:state.me.y, endTime:Date.now()+10000 });
      render();
    });
  });
}

function renderAuction() {
  const myResOptions = RES_KEYS.filter(k => (state.resources[k]||0)>0).map(k => `<option value="${k}">${RES_ICONS[k]} ${RES_NAMES[k]} (${fmt(state.resources[k])})</option>`).join('');
  const form = `<div class="auc-form">
    <h3>📤 上架资源</h3>
    <label>资源类型</label>
    <select id="auc-res">${myResOptions || '<option>无可用资源</option>'}</select>
    <label>数量</label>
    <input id="auc-qty" type="number" value="100" min="1" />
    <label>总价 (信用点)</label>
    <input id="auc-price" type="number" value="100" min="1" />
    <button id="auc-list">📤 挂单出售</button>
  </div>`;
  const list = state.auctions.map(a => {
    const isCmdr = a.type==='commander';
    const itemName = isCmdr ? `${a.rarity==='legendary'?'🟡':a.rarity==='epic'?'🟣':'🔵'} ${a.item}` : `${RES_ICONS[a.item]||'📦'} ${RES_NAMES[a.item]||a.item}`;
    const priceUnit = a.unit==='darkMatter' ? '🌌 高维暗物质' : '💳 信用点';
    const canBuy = (state.resources[a.unit]||0) >= a.price;
    return `<div class="auc-item ${a.rarity||''}">
      <div class="row">
        <div>
          <div class="name">${itemName} <span class="qty">×${a.qty||1}</span></div>
          <div class="qty">卖家: ${a.seller}</div>
        </div>
        <div style="text-align:right;">
          <div class="price">${fmt(a.price)} ${priceUnit}</div>
          <button data-buy="${a.id}" ${canBuy?'':'disabled'}>${canBuy?'购买':'不足'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
  const html = `<div class="auc-wrap">
    ${form}
    <div class="auc-list">
      <h3>🛒 市场挂单 (${state.auctions.length})</h3>
      ${list}
    </div>
  </div>`;
  $('#main').innerHTML = html;
  $('#auc-list').addEventListener('click', () => {
    const r = $('#auc-res').value;
    const q = parseInt($('#auc-qty').value) || 0;
    const p = parseInt($('#auc-price').value) || 0;
    if (!r || q<=0 || p<=0) return;
    if ((state.resources[r]||0) < q) return;
    state.resources[r] -= q;
    state.auctions.unshift({ id:'u'+Date.now(), seller:'我', type:'resource', item:r, qty:q, price:p, unit:'credits' });
    render();
  });
  $$('button[data-buy]').forEach(btn => {
    if (!btn.disabled) {
      btn.addEventListener('click', () => {
        const id = btn.dataset.buy;
        const a = state.auctions.find(x => x.id===id);
        if (!a) return;
        state.resources[a.unit] = (state.resources[a.unit]||0) - a.price;
        if (a.type==='resource') state.resources[a.item] = (state.resources[a.item]||0) + a.qty;
        else if (a.type==='commander') state.commanders.push({ name:a.item, rarity:a.rarity, ability:'从拍卖行获得', stats:{atk:80,def:80,lead:80} });
        state.auctions = state.auctions.filter(x => x.id!==id);
        render();
      });
    }
  });
}

function openModal(title, bodyHtml) {
  $('#modal-root').innerHTML = `<div class="modal-mask" id="mask">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">${title}</div>
        <button class="modal-close" id="mclose">×</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
    </div>
  </div>`;
  $('#mclose').addEventListener('click', closeModal);
  $('#mask').addEventListener('click', (e) => { if (e.target.id==='mask') closeModal(); });
}
function closeModal() { $('#modal-root').innerHTML = ''; }

// ===== 主循环：每秒 tick 资源结算 =====
function tick() {
  const tot = totalProduction();
  for (const k of Object.keys(tot)) {
    state.resources[k] = (state.resources[k]||0) + tot[k] / 5;  // 200ms = 1/5 秒
  }
  // 处理行军
  const now = Date.now();
  state.marches = state.marches.filter(m => {
    if (now >= m.endTime) {
      const target = state.others.find(o => o.id===m.toId);
      if (target) {
        // 战斗结果：随机胜负
        const won = Math.random() < 0.5;
        alert(`🗡️ 战斗结束！\n目标：${target.name}\n结果：${won?'胜利！掠夺 100 信用点':'失败，未能掠夺'}`);
        if (won) state.resources.credits += 100;
      }
      return false;
    }
    // 插值移动
    const target = state.others.find(o => o.id===m.toId);
    if (target) {
      const t = 1 - (m.endTime - now) / 10000;
      m.x = m.x + (target.x - m.x) * 0.05;
      m.y = m.y + (target.y - m.y) * 0.05;
    }
    return true;
  });
  render();
}

// ===== 事件绑定 =====
$$('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => { state.view = btn.dataset.view; render(); });
});
$('#btn-cheat').addEventListener('click', () => {
  state.resources.darkMatter = (state.resources.darkMatter||0) + 10000;
  render();
});
$('#btn-reset').addEventListener('click', () => {
  if (confirm('确定重置整个沙盒？所有进度将清空。')) {
    state = freshState(); render();
  }
});

// ===== 启动 =====
state = freshState();
render();
setInterval(tick, 200);
</script>
