<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>水点快查</title>
  <style>
    :root {
      --bg-primary: #f8fbff;
      --bg-card: #ffffff;
      --text-primary: #2d3748;
      --text-secondary: #64748b;
      --accent: #3182ce;
      --success: #48bb78;
      --warning: #ed8936;
      --border: #e2e8f0;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #1a202c;
      --bg-card: #2d3748;
      --text-primary: #e2e8f0;
      --text-secondary: #a0aec0;
      --accent: #63b3ed;
      --success: #68d391;
      --warning: #f6ad55;
      --border: #4a5568;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 12px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: #2c5282;
    }

    .location-selector {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .location-selector h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      color: var(--text-primary);
      font-weight: 600;
    }

    .street-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .street-btn {
      padding: 10px 16px;
      background: #edf2f7;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .street-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .street-btn:hover:not(.active) {
      background: #e2e8f0;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .results-title {
      font-weight: 600;
      font-size: 1.1rem;
    }

    .refresh-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:hover {
      background: #2c5282;
      transform: translateY(-1px);
    }

    .water-points {
      display: grid;
      grid-gap: 16px;
    }

    .point-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
    }

    .point-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .point-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .point-icon {
      width: 40px;
      height: 40px;
      background: #e6f7ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: bold;
      flex-shrink: 0;
    }

    .point-info h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .point-meta {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .point-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
    }

    .status-active {
      background: #f0fff4;
      color: var(--success);
    }

    .status-maintain {
      background: #fffaf0;
      color: var(--warning);
    }

    .point-body {
      padding: 16px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .point-body p {
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .point-body p:last-child {
      margin-bottom: 0;
    }

    .point-body .icon {
      color: var(--accent);
      font-weight: bold;
      margin-top: 2px;
      flex-shrink: 0;
      width: 16px;
    }

    .image-placeholder {
      width: 100%;
      height: 120px;
      background: linear-gradient(135deg, #e6f7ff, #c3dafe);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #90cdf4;
      font-size: 0.9rem;
      font-weight: 500;
      border-top: 1px solid var(--border);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .street-buttons {
        flex-direction: column;
      }

      .street-btn {
        width: 100%;
        text-align: center;
      }

      .results-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题">☀️</button>

  <div class="container">
    <header>
      <h1>水点快查</h1>
      <p class="subtitle">一键查看附近可用直饮水点 · 状态实时校验 · 步行3分钟内可达</p>
    </header>

    <section class="location-selector">
      <h2>请选择所在街道</h2>
      <div class="street-buttons">
        <button class="street-btn active" data-street="朝阳门街道">朝阳门街道</button>
        <button class="street-btn" data-street="中关村南一街">中关村南一街</button>
        <button class="street-btn" data-street="莲花池东路">莲花池东路</button>
        <button class="street-btn" data-street="西单北大街">西单北大街</button>
      </div>
    </section>

    <section class="results-section">
      <div class="results-header">
        <h2 class="results-title">最近可用直饮水点（3处）</h2>
        <button class="refresh-btn" id="refreshBtn">
          <span>🔄</span> 刷新状态
        </button>
      </div>

      <div class="water-points" id="waterPoints">
        <!-- Will be populated by JS -->
      </div>
    </section>

    <footer>
      <p>数据来源：各区政务公开网页及微信公众号维保通报 | 状态更新时间：2024年6月12日</p>
    </footer>
  </div>

  <script>
    // Sample data — realistic, minimal, no external API
    const pointData = {
      '朝阳门街道': [
        {
          name: '朝阳门地铁站B口旁',
          time: '步行约1分20秒',
          status: '正常启用',
          statusClass: 'status-active',
          lastMaintain: '2024-06-08',
          address: '东城区朝阳门内大街1号',
          contact: '东城区城管热线：6513XXXX'
        },
        {
          name: '银河SOHO广场南侧廊',
          time: '步行约2分15秒',
          status: '维护中（预计6月15日恢复）',
          statusClass: 'status-maintain',
          lastMaintain: '2024-06-05',
          address: '东城区朝阳门北大街8号',
          contact: '物业服务中心：8518XXXX'
        },
        {
          name: '史家社区服务中心门口',
          time: '步行约2分50秒',
          status: '正常启用',
          statusClass: 'status-active',
          lastMaintain: '2024-06-10',
          address: '东城区史家胡同51号',
          contact: '史家社区：6525XXXX'
        }
      ],
      '中关村南一街': [
        {
          name: '中关村一小北门',
          time: '步行约45秒',
          status: '正常启用',
          statusClass: 'status-active',
          lastMaintain: '2024-06-11',
          address: '海淀区中关村南一街11号',
          contact: '海淀教委后勤科：8255XXXX'
        },
        {
          name: '鼎好大厦东侧连廊',
          time: '步行约1分40秒',
          status: '正常启用',
          statusClass: 'status-active',
          lastMaintain: '2024-06-03',
          address: '海淀区中关村大街3号',
          contact: '鼎好物业：8265XXXX'
        },
        {
          name: '中关村创业大街咖啡角',
          time: '步行约2分30秒',
          status: '暂停使用（滤芯更换中）',
          statusClass: 'status-maintain',
          lastMaintain: '2024-06-07',
          address: '海淀区海淀大街8号',
          contact: '创业大街运营中心：8287XXXX'
        }
      ],
      '莲花池东路': [
        {
          name: '北京西站北广场东侧',
          time: '步行约1分10秒',
          status: '正常启用',
          statusClass: 'status-active',
          lastMaintain: '2024-06-09',
          address: '丰台区莲花池东路118号',
          contact: '北京西站综管办：6343XXXX'
        },
        {
          name: '天莲大厦一层大厅',
          time: '步行约2分05秒',
          status: '正常启用',
          statusClass: 'status-active',
          lastMaintain: '2024-06-04',
          address: '丰台区莲花池东路2号',
          contact: '天莲物业：6398XXXX'
        },
        {
          name: '莲花池公园南门内',
          time: '步行约2分40秒',
          status: '待检修（水压偏低）',
          statusClass: 'status-maintain',
          lastMaintain: '2024-06-06',
          address: '丰台区莲花池东路10号',
          contact: '丰台园林局：6383XXXX'
        }
      ],
      '西单北大街': [
        {
          name: '西单图书大厦西侧通道',
          time: '步行约50秒',
          status: '正常启用',
          statusClass: 'status-active',
          lastMaintain: '2024-06-10',
          address: '西城区西单北大街176号',
          contact: '西城文旅局：6656XXXX'
        },
        {
          name: '汉光百货北门入口',
          time: '步行约1分30秒',
          status: '正常启用',
          statusClass: 'status-active',
          lastMaintain: '2024-06-02',
          address: '西城区西单北大街131号',
          contact: '汉光物业：6602XXXX'
        },
        {
          name: '西单更新场地下一层服务台旁',
          time: '步行约2分20秒',
          status: '维护中（设备升级）',
          statusClass: 'status-maintain',
          lastMaintain: '2024-06-08',
          address: '西城区西单北大街129号',
          contact: '更新场客服：6622XXXX'
        }
      ]
    };

    // DOM elements
    const themeToggle = document.getElementById('themeToggle');
    const streetButtons = document.querySelectorAll('.street-btn');
    const waterPointsContainer = document.getElementById('waterPoints');
    const refreshBtn = document.getElementById('refreshBtn');

    // State
    let currentStreet = '朝阳门街道';
    let isDarkMode = false;

    // Initialize
    function init() {
      renderPoints(currentStreet);
      bindEvents();
    }

    function bindEvents() {
      // Theme toggle
      themeToggle.addEventListener('click', () => {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle('dark-theme', isDarkMode);
        themeToggle.textContent = isDarkMode ? '🌙' : '☀️';
      });

      // Street selection
      streetButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          streetButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentStreet = btn.dataset.street;
          renderPoints(currentStreet);
        });
      });

      // Refresh simulation
      refreshBtn.addEventListener('click', () => {
        refreshBtn.innerHTML = '<span>🔄</span> 正在校验…';
        refreshBtn.disabled = true;

        setTimeout(() => {
          // Simulate minor status change for demo: e.g., one point flips to active
          const points = pointData[currentStreet];
          const idx = Math.floor(Math.random() * points.length);
          if (points[idx].status.includes('维护') || points[idx].status.includes('暂停')) {
            points[idx].status = '正常启用';
            points[idx].statusClass = 'status-active';
            points[idx].lastMaintain = new Date().toISOString().split('T')[0];
          } else {
            points[idx].status = '维护中（预计' + 
              (parseInt(new Date().getDate()) + 2) + '日恢复）';
            points[idx].statusClass = 'status-maintain';
            points[idx].lastMaintain = new Date().toISOString().split('T')[0];
          }
          renderPoints(currentStreet);
          refreshBtn.innerHTML = '<span>🔄</span> 刷新状态';
          refreshBtn.disabled = false;
        }, 800);
      });
    }

    function renderPoints(street) {
      const points = pointData[street] || pointData['朝阳门街道'];
      waterPointsContainer.innerHTML = points.map((p, i) => `
        <div class="point-card">
          <div class="point-header">
            <div class="point-icon">${i + 1}</div>
            <div class="point-info">
              <h3>${p.name}</h3>
              <div class="point-meta">
                <span>${p.time}</span>
                <span class="point-status ${p.statusClass}">${p.status}</span>
              </div>
            </div>
          </div>
          <div class="point-body">
            <p><span class="icon">📍</span>${p.address}</p>
            <p><span class="icon">📅</span> 最近维保：${p.lastMaintain}</p>
            <p><span class="icon">📞</span>${p.contact}</p>
          </div>
          <div class="image-placeholder">实景照片（示意图）</div>
        </div>
      `).join('');
    }

    // Start
    init();
  </script>
</body>
</html>
