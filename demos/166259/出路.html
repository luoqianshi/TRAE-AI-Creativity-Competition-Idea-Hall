<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出路 — 普工转行 AI 规划师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#E8680A;
  --primary-light:#FFF3E8;
  --primary-dark:#C85A08;
  --warm-yellow:#FFB830;
  --warm-bg:#FFFAF5;
  --warm-bg2:#FFF5EB;
  --text-dark:#2D1B0E;
  --text-mid:#5A4636;
  --text-light:#8A7A6A;
  --white:#FFFFFF;
  --shadow:0 4px 20px rgba(232,104,10,0.12);
  --shadow-lg:0 8px 32px rgba(232,104,10,0.18);
  --radius:16px;
  --radius-sm:12px;
  --radius-full:999px;
}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--warm-bg);
  color:var(--text-dark);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* ===== HEADER ===== */
.header{
  background:linear-gradient(135deg,var(--primary) 0%,#F28C28 100%);
  color:var(--white);
  padding:28px 20px 32px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.header::after{
  content:'';position:absolute;bottom:-20px;left:0;right:0;height:40px;
  background:var(--warm-bg);border-radius:50% 50% 0 0;
}
.header h1{
  font-size:32px;font-weight:800;letter-spacing:4px;margin-bottom:8px;
  text-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.header .tagline{
  font-size:17px;opacity:0.95;font-weight:400;
}

/* ===== STEPS INDICATOR ===== */
.steps-bar{
  display:flex;justify-content:center;gap:8px;
  padding:20px 20px 0;max-width:600px;margin:0 auto;
}
.step-dot{
  width:40px;height:40px;border-radius:50%;
  background:var(--white);border:3px solid #E0D5CA;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:var(--text-light);
  transition:all 0.4s;position:relative;
}
.step-dot.active{
  border-color:var(--primary);color:var(--primary);
  background:var(--primary-light);
  transform:scale(1.1);
}
.step-dot.done{
  border-color:var(--primary);color:var(--white);
  background:var(--primary);
}
.step-line{
  flex:1;height:3px;background:#E0D5CA;border-radius:2px;
  align-self:center;transition:background 0.4s;margin-top:-20px;
}
.step-line.active{background:var(--primary)}

/* ===== SECTIONS ===== */
.section{
  display:none;padding:24px 20px 40px;
  max-width:640px;margin:0 auto;
  animation:fadeUp 0.5s ease;
}
.section.active{display:block}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* ===== STEP 1: INPUT ===== */
.section-title{
  font-size:22px;font-weight:700;text-align:center;
  margin-bottom:6px;color:var(--text-dark);
}
.section-subtitle{
  font-size:15px;color:var(--text-light);text-align:center;
  margin-bottom:28px;
}
.input-group{
  margin-bottom:22px;
}
.input-group label{
  display:block;font-size:17px;font-weight:600;
  margin-bottom:10px;color:var(--text-mid);
}
.input-group label .required{color:var(--primary)}
.tag-options{
  display:flex;flex-wrap:wrap;gap:10px;
}
.tag-btn{
  padding:12px 20px;border-radius:var(--radius-full);
  border:2px solid #E0D5CA;background:var(--white);
  font-size:16px;color:var(--text-mid);cursor:pointer;
  transition:all 0.25s;font-weight:500;
  font-family:inherit;
}
.tag-btn:hover{border-color:var(--primary);color:var(--primary)}
.tag-btn.selected{
  background:var(--primary);color:var(--white);
  border-color:var(--primary);
  transform:scale(1.02);
}
.text-input{
  width:100%;padding:14px 18px;border-radius:var(--radius-sm);
  border:2px solid #E0D5CA;font-size:16px;
  font-family:inherit;color:var(--text-dark);
  background:var(--white);transition:border-color 0.3s;
  resize:vertical;min-height:60px;
}
.text-input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 4px rgba(232,104,10,0.1);
}
.text-input::placeholder{color:var(--text-light)}
.big-btn{
  display:block;width:100%;padding:18px 24px;
  border-radius:var(--radius);border:none;
  background:linear-gradient(135deg,var(--primary),var(--warm-yellow));
  color:var(--white);font-size:20px;font-weight:700;
  cursor:pointer;transition:all 0.3s;
  box-shadow:var(--shadow);font-family:inherit;
  margin-top:12px;letter-spacing:1px;
}
.big-btn:hover{
  transform:translateY(-2px);box-shadow:var(--shadow-lg);
}
.big-btn:active{transform:translateY(0);box-shadow:var(--shadow)}
.big-btn.secondary{
  background:var(--white);color:var(--primary);
  border:2px solid var(--primary);box-shadow:none;
}
.big-btn.secondary:hover{
  background:var(--primary-light);
}

/* ===== STEP 2: RECOMMENDATIONS ===== */
.rec-cards{display:flex;flex-direction:column;gap:16px}
.rec-card{
  background:var(--white);border-radius:var(--radius);
  padding:24px;cursor:pointer;transition:all 0.3s;
  border:2px solid transparent;
  box-shadow:0 2px 12px rgba(0,0,0,0.04);
}
.rec-card:hover{
  transform:translateY(-3px);box-shadow:var(--shadow);
  border-color:var(--primary);
}
.rec-card .rec-header{
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
}
.rec-card .rec-tag{
  display:inline-block;padding:4px 14px;border-radius:var(--radius-full);
  font-size:13px;font-weight:700;color:var(--white);
  flex-shrink:0;
}
.tag-a{background:#E8680A}
.tag-b{background:#4CAF50}
.tag-c{background:#2196F3}
.rec-card .rec-name{
  font-size:20px;font-weight:700;color:var(--text-dark);
}
.rec-card .rec-reason{
  font-size:15px;color:var(--text-mid);margin-bottom:14px;
  line-height:1.7;
}
.rec-card .rec-meta{
  display:flex;gap:20px;flex-wrap:wrap;
}
.rec-meta-item{
  font-size:14px;color:var(--text-light);
  display:flex;align-items:center;gap:6px;
}
.rec-meta-item strong{
  color:var(--primary);font-size:16px;font-weight:700;
}
.rec-card .click-hint{
  text-align:center;margin-top:14px;
  font-size:14px;color:var(--primary);font-weight:600;
  opacity:0;transition:opacity 0.3s;
}
.rec-card:hover .click-hint{opacity:1}

/* ===== STEP 3: ROUTE MAP ===== */
.back-btn-wrap{text-align:center;margin-bottom:24px}
.roadmap-intro{
  text-align:center;margin-bottom:24px;
}
.roadmap-direction{
  font-size:24px;font-weight:800;color:var(--primary);
  margin-bottom:6px;
}
.roadmap-encourage{
  font-size:15px;color:var(--text-mid);
  line-height:1.7;
}
.roadmap-cards{display:flex;flex-direction:column;gap:16px}
.roadmap-card{
  background:var(--white);border-radius:var(--radius);
  padding:22px 24px;
  border-left:5px solid var(--primary);
  box-shadow:0 2px 12px rgba(0,0,0,0.04);
}
.roadmap-card .rm-title{
  font-size:18px;font-weight:700;color:var(--primary);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.roadmap-card .rm-content{
  font-size:15px;color:var(--text-mid);line-height:1.8;
}
.roadmap-card .rm-content strong{
  color:var(--text-dark);font-weight:600;
}
.roadmap-card .rm-content .highlight{
  color:var(--primary);font-weight:700;
}
.roadmap-card .rm-content ul{
  padding-left:0;list-style:none;margin-top:8px;
}
.roadmap-card .rm-content li{
  padding:6px 0;border-bottom:1px dashed #F0E8E0;
  display:flex;gap:8px;
}
.roadmap-card .rm-content li:last-child{border-bottom:none}
.roadmap-card .rm-content li::before{
  content:'✓';color:var(--primary);font-weight:700;flex-shrink:0;
}
.encourage-box{
  margin-top:28px;padding:24px;
  background:linear-gradient(135deg,var(--primary-light),#FFF8F0);
  border-radius:var(--radius);text-align:center;
  border:2px dashed var(--primary);
}
.encourage-box .encourage-text{
  font-size:18px;font-weight:700;color:var(--primary);
  line-height:1.8;
}
.encourage-box .encourage-sub{
  font-size:14px;color:var(--text-mid);margin-top:8px;
}

/* ===== FOOTER ===== */
.footer{
  text-align:center;padding:30px 20px;
  font-size:13px;color:var(--text-light);
  border-top:1px solid #F0E8E0;
}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
  .header h1{font-size:26px}
  .header .tagline{font-size:15px}
  .section-title{font-size:20px}
  .tag-btn{padding:10px 16px;font-size:15px}
  .rec-card{padding:18px}
  .rec-card .rec-name{font-size:18px}
  .roadmap-card{padding:18px}
  .big-btn{font-size:18px;padding:16px 20px}
}
</style>
</head>

</div>

<!-- STEP 2: RECOMMENDATIONS -->

  <div class="back-btn-wrap" style="margin-top:24px">

// ===== TAG SELECTION =====
document.querySelectorAll('.tag-options').forEach(group => {
  group.addEventListener('click', e => {
    const btn = e.target.closest('.tag-btn');
    if (!btn) return;
    const groupEl = btn.parentElement;
    groupEl.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    // Store value
    const groupId = groupEl.id;
    if (groupId === 'ageOptions') userData.age = btn.dataset.value;
    else if (groupId === 'eduOptions') userData.edu = btn.dataset.value;
    else if (groupId === 'incomeOptions') userData.income = btn.dataset.value;
  });
});

// ===== STEP NAVIGATION =====
function updateStepsBar(step) {
  document.querySelectorAll('.step-dot').forEach(dot => {
    const s = parseInt(dot.dataset.step);
    dot.classList.remove('active','done');
    if (s === step) dot.classList.add('active');
    else if (s < step) dot.classList.add('done');
  });
  document.querySelectorAll('.step-line').forEach(line => {
    const l = parseInt(line.dataset.line);
    line.classList.toggle('active', l < step);
  });
}

function showStep(step) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('step'+step).classList.add('active');
  updateStepsBar(step);
  window.scrollTo({top:0, behavior:'smooth'});
}

  currentStep = 2;

function goBack(toStep) {
  currentStep = toStep;

}

      if (d.category === 'C') score += 2;
    }
    if (edu === '大专及以上') {
      if (d.category === 'C') score += 3;
      if (d.category === 'B') score += 2;
      if (d.category === 'A') score += 1;
    }

    // Age matching
    if (age === '18-22' || age === '23-28') {
      if (d.id === 'video' || d.id === 'ai_tools') score += 2;
      if (d.category === 'A') score += 1;
    }
    if (age === '29-35' || age === '36-45') {
      if (d.category === 'A') score += 1;
      if (d.id === 'delivery' || d.id === 'chef') score += 1;
    }
    if (age === '46+') {
      if (d.id === 'delivery' || d.id === 'ecommerce' || d.id === 'chef') score += 1;
      if (d.id === 'cnc') score -= 1;
    }

    // Job matching
    if (job.includes('厂') || job.includes('车间') || job.includes('流水线') || job.includes('组装') || job.includes('操作工')) {
      if (d.id === 'electrician' || d.id === 'forklift' || d.id === 'cnc') score += 2;
      if (d.id === 'welder') score += 1;
    }
    if (job.includes('建筑') || job.includes('工地') || job.includes('搬')) {
      if (d.id === 'welder') score += 2;
      if (d.id === 'electrician') score += 1;
    }
    if (job.includes('饭店') || job.includes('厨房') || job.includes('餐饮')) {
      if (d.id === 'chef') score += 3;
    }

    // Skill matching
    if (skill.includes('叉车')) { if (d.id === 'forklift') score += 3; }
    if (skill.includes('做饭') || skill.includes('炒菜') || skill.includes('厨')) { if (d.id === 'chef') score += 2; }
    if (skill.includes('电脑') || skill.includes('打字')) {
      if (d.id === 'office' || d.id === 'ai_tools') score += 2;
    }
    if (skill.includes('电')) { if (d.id === 'electrician') score += 2; }
    if (skill.includes('车') || skill.includes('驾照')) {
      if (d.id === 'delivery' || d.id === 'forklift') score += 1;
    }

    // Income matching
    if (income === '3000以下' || income === '3000-5000') {
      if (d.category === 'B') score += 1; // quick money
      if (d.id === 'cnc') score += 1; // higher income potential
    }

    return { direction: d, score };
  });

  scores.sort((a, b) => b.score - a.score);

  // Pick top 3, ensure category diversity
  const picked = [];
  const usedCats = new Set();
  for (const item of scores) {
    if (picked.length >= 3) break;
    if (picked.length < 2 || !usedCats.has(item.direction.category)) {
      picked.push(item.direction);
      usedCats.add(item.direction.category);
    }
  }
  // If we still need more (shouldn't happen with 3 categories)
  while (picked.length < 3 && scores.length > picked.length) {
    const next = scores[picked.length];
    if (!picked.includes(next.direction)) picked.push(next.direction);
  }

  return picked;
}

function renderRecommendations(recs) {
  const container = document.getElementById('recCards');
  container.innerHTML = recs.map(d => `
    <div class="rec-card" onclick="showRouteMap('${d.id}')">
      <div class="rec-header">
        <span class="rec-tag tag-${d.category.toLowerCase()}">${d.tagLabel}</span>
        <span class="rec-name">${d.name}</span>
      </div>
      <div class="rec-reason">${d.reason}</div>
      <div class="rec-meta">
        <div class="rec-meta-item">⏱ 学习周期 <strong>${d.period}</strong></div>
        <div class="rec-meta-item">💰 学完后 <strong>${d.income}</strong></div>
      </div>
      <div class="click-hint">点击查看详细路线图 →</div>
    </div>
  `).join('');
}

// ===== ROUTE MAP =====
function showRouteMap(directionId) {
  const d = directions.find(x => x.id === directionId);
  if (!d) return;
  selectedDirection = d;

  document.getElementById('rmDirection').textContent = d.name + ' — 转行路线图';

  const rm = d.roadmap;
  const container = document.getElementById('roadmapCards');
  container.innerHTML = `
    <div class="roadmap-card">
      <div class="rm-title">📖 ${rm.learn.title}</div>
      <div class="rm-content">${rm.learn.content}</div>
    </div>
    <div class="roadmap-card">
      <div class="rm-title">💰 ${rm.cost.title}</div>
      <div class="rm-content">${rm.cost.content}</div>
    </div>
    <div class="roadmap-card">
      <div class="rm-title">📈 ${rm.earn.title}</div>
      <div class="rm-content">${rm.earn.content}</div>
    </div>
    <div class="roadmap-card">
      <div class="rm-title">📋 ${rm.prepare.title}</div>
      <div class="rm-content">${rm.prepare.content}</div>
    </div>
    <div class="roadmap-card" style="border-left-color:var(--warm-yellow)">
      <div class="rm-title" style="color:var(--primary-dark)">🚀 ${rm.action.title}</div>
      <div class="rm-content">${rm.action.content}</div>
    </div>
  `;

  const encourage = encourageMessages[Math.floor(Math.random() * encourageMessages.length)];
  document.getElementById('encourageText').textContent = encourage;

  currentStep = 3;
  showStep(3);
}
