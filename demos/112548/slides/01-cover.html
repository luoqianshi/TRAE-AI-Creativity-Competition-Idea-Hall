<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 · Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
  }

  /* Subtle warm grain overlay */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(221,161,94,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(45,106,79,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .tag {
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 500;
    color: var(--green);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 88px;
    font-weight: 900;
    line-height: 1.3;
    color: var(--ink);
    max-width: 1200px;
    margin: 0 auto 32px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  h1 em {
    font-style: normal;
    color: var(--green);
  }

  .subtitle {
    font-family: var(--font-body);
    font-size: 24px;
    font-weight: 300;
    color: var(--ink-light);
    line-height: 1.6;
    max-width: 700px;
    margin: 0 auto 64px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.6s forwards;
  }

  .divider {
    width: 48px;
    height: 3px;
    background: var(--amber);
    border-radius: 2px;
    margin: 0 auto 48px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.7s forwards;
  }

  .meta {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.8s forwards;
  }

  /* Decorative leaf motif - top right */
  .leaf {
    position: absolute;
    top: 60px;
    right: 80px;
    width: 120px;
    height: 120px;
    opacity: 0.12;
  }

  /* Decorative dot grid - bottom left */
  .dots {
    position: absolute;
    bottom: 80px;
    left: 80px;
    display: grid;
    grid-template-columns: repeat(5, 8px);
    gap: 12px;
    opacity: 0.15;
  }
  .dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <!-- Decorative leaf SVG -->
  <svg class="leaf" viewBox="0 0 120 120" fill="none">
    <path d="M60 10 C90 20 110 50 100 85 C90 105 65 110 40 95 C20 80 15 55 25 35 C35 20 48 12 60 10Z" fill="#2D6A4F"/>
    <path d="M60 10 C60 10 55 50 50 70 C48 80 45 90 40 95" stroke="#FAF8F5" stroke-width="1.5" fill="none"/>
    <path d="M55 35 C65 40 75 50 80 65" stroke="#FAF8F5" stroke-width="1" fill="none" opacity="0.6"/>
    <path d="M50 55 C60 58 70 65 75 78" stroke="#FAF8F5" stroke-width="1" fill="none" opacity="0.6"/>
  </svg>

  <!-- Decorative dots -->
  <div class="dots">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <p class="tag">Privacy Policy Interpreter</p>

  <h1>让每一份隐私政策<br>都能被<em>读懂</em></h1>

  <p class="subtitle">输入任意 APP 名称，AI 帮你找到隐私政策并逐条解读<br>让复杂的法律文本，变成人人能懂的语言</p>

  <div class="divider"></div>

  <p class="meta">比赛项目汇报</p>

</body>
</html>
