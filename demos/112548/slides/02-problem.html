<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>02 · Problem</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
  }

  /* Warm ambient glow */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(224,122,95,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  .quote-mark {
    font-family: var(--font-display);
    font-size: 180px;
    font-weight: 900;
    color: var(--amber);
    opacity: 0.2;
    line-height: 0.6;
    margin-bottom: -20px;
  }

  .question {
    font-family: var(--font-display);
    font-size: 72px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--ink);
    max-width: 1100px;
  }

  .question em {
    font-style: normal;
    color: var(--red-soft);
  }

  .context {
    margin-top: 80px;
    display: flex;
    gap: 64px;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 900;
    color: var(--green);
    line-height: 1;
    margin-bottom: 12px;
  }

  .stat-label {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink-light);
    line-height: 1.5;
    max-width: 180px;
  }

  .source {
    position: absolute;
    bottom: 48px;
    left: 80px;
    font-size: 13px;
    color: var(--ink-faint);
  }

  .page-num {
    position: absolute;
    bottom: 48px;
    right: 80px;
  }
</style>
</head>
<body>

  <div class="quote-mark">"</div>

  <h1 class="question">你上次<em>认真阅读</em><br>隐私政策，是什么时候？</h1>

  <div class="context">
    <div class="stat">
      <p class="stat-num">97%</p>
      <p class="stat-label">的用户在安装 APP 时<br>从未阅读隐私政策</p>
    </div>
    <div class="stat">
      <p class="stat-num">15min</p>
      <p class="stat-label">读完一份主流 APP 的<br>隐私政策平均耗时</p>
    </div>
    <div class="stat">
      <p class="stat-num">3000+</p>
      <p class="stat-label">字数 · 远超普通人的<br>耐心阅读极限</p>
    </div>
  </div>

  <p class="source">数据来源：Pew Research Center, 2023</p>
  <p class="page-num">02 / 06</p>

</body>
</html>
