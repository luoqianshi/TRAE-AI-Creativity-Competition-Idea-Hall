<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>03 · Solution</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    padding: 80px 120px 60px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 20% 80%, rgba(45,106,79,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  .kicker {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--green);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 64px;
  }

  h1 em {
    font-style: normal;
    color: var(--green);
  }

  .steps {
    display: flex;
    gap: 48px;
    flex: 1;
    align-items: flex-start;
  }

  .step {
    flex: 1;
    position: relative;
  }

  .step-num {
    font-family: var(--font-display);
    font-size: 120px;
    font-weight: 900;
    color: var(--green-pale);
    line-height: 1;
    margin-bottom: -30px;
    position: relative;
    z-index: 0;
  }

  .step-card {
    position: relative;
    z-index: 1;
    background: white;
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.04);
  }

  .step-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    font-size: 24px;
  }

  .step:nth-child(1) .step-icon { background: var(--green-pale); color: var(--green); }
  .step:nth-child(2) .step-icon { background: var(--amber-pale); color: var(--amber); }
  .step:nth-child(3) .step-icon { background: #E8F0FE; color: #4A7BF7; }

  .step-title {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .step-desc {
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink-light);
    line-height: 1.7;
  }

  /* Arrow connectors between steps */
  .step:not(:last-child)::after {
    content: '→';
    position: absolute;
    right: -32px;
    top: 200px;
    font-size: 28px;
    color: var(--ink-faint);
  }

  .page-num {
    position: absolute;
    bottom: 48px;
    right: 80px;
  }
</style>
</head>
<body>

  <p class="kicker">How It Works</p>
  <h1>三步，从<em>茫</em>到<em>明</em></h1>

  <div class="steps">
    <div class="step">
      <div class="step-num">01</div>
      <div class="step-card">
        <div class="step-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </div>
        <h3 class="step-title">输入 APP 名称</h3>
        <p class="step-desc">输入你想了解的应用名称，系统自动定位该应用的官方隐私政策文档。</p>
      </div>
    </div>

    <div class="step">
      <div class="step-num">02</div>
      <div class="step-card">
        <div class="step-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>
        <h3 class="step-title">定位隐私政策</h3>
        <p class="step-desc">系统从应用商店、官方网站等多渠道检索，精准匹配并提取最新版隐私政策全文。</p>
      </div>
    </div>

    <div class="step">
      <div class="step-num">03</div>
      <div class="step-card">
        <div class="step-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </div>
        <h3 class="step-title">AI 逐条解读</h3>
        <p class="step-desc">AI 将法律术语转化为日常语言，逐条分析数据收集范围、使用目的和潜在风险。</p>
      </div>
    </div>
  </div>

  <p class="page-num">03 / 06</p>

</body>
</html>
