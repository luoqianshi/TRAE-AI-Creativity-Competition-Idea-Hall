<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>06 · Closing</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
  }

  /* Warm ambient */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 40% 30%, rgba(45,106,79,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 70%, rgba(221,161,94,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .vision {
    font-family: var(--font-display);
    font-size: 80px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.35;
    max-width: 1200px;
    margin-bottom: 48px;
  }

  .vision em {
    font-style: normal;
    color: var(--green);
  }

  .divider {
    width: 48px;
    height: 3px;
    background: var(--amber);
    border-radius: 2px;
    margin: 0 auto 48px;
  }

  .thanks {
    font-family: var(--font-body);
    font-size: 22px;
    font-weight: 300;
    color: var(--ink-light);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .cta {
    display: inline-block;
    margin-top: 40px;
    padding: 18px 48px;
    background: var(--green);
    color: white;
    font-family: var(--font-body);
    font-size: 18px;
    font-weight: 500;
    border-radius: 999px;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 24px rgba(45,106,79,0.2);
  }

  /* Decorative leaf - bottom left, mirror of cover */
  .leaf {
    position: absolute;
    bottom: 60px;
    left: 80px;
    width: 100px;
    height: 100px;
    opacity: 0.08;
    transform: scaleX(-1);
  }

  /* Dots - top right, mirror of cover */
  .dots {
    position: absolute;
    top: 80px;
    right: 80px;
    display: grid;
    grid-template-columns: repeat(4, 6px);
    gap: 10px;
    opacity: 0.12;
  }
  .dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
  }
</style>
</head>
<body>

  <!-- Mirror decorations from cover -->
  <svg class="leaf" viewBox="0 0 120 120" fill="none">
    <path d="M60 10 C90 20 110 50 100 85 C90 105 65 110 40 95 C20 80 15 55 25 35 C35 20 48 12 60 10Z" fill="#2D6A4F"/>
    <path d="M60 10 C60 10 55 50 50 70 C48 80 45 90 40 95" stroke="#FAF8F5" stroke-width="1.5" fill="none"/>
  </svg>

  <div class="dots">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <h1 class="vision">当每个人都能<em>读懂</em>隐私政策<br>隐私保护才真正开始</h1>

  <div class="divider"></div>

  <p class="thanks">感谢聆听</p>

  <div class="cta">欢迎体验与交流</div>

</body>
</html>
