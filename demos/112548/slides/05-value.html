<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>05 · Value</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    padding: 80px 120px 60px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(45,106,79,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .kicker {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    color: var(--green);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 60px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 56px;
  }

  .values {
    display: flex;
    flex-direction: column;
    gap: 0;
    flex: 1;
  }

  .value-row {
    display: flex;
    align-items: center;
    gap: 48px;
    padding: 28px 0;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  .value-row:last-child {
    border-bottom: none;
  }

  .value-label {
    width: 200px;
    flex-shrink: 0;
  }

  .value-title {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }

  .value-sub {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--ink-faint);
    margin-top: 4px;
    letter-spacing: 0.05em;
  }

  .value-bar-track {
    flex: 1;
    height: 8px;
    background: rgba(0,0,0,0.04);
    border-radius: 4px;
    overflow: hidden;
  }

  .value-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 1s ease;
  }

  .value-row:nth-child(1) .value-bar { background: var(--green); width: 92%; }
  .value-row:nth-child(2) .value-bar { background: var(--amber); width: 85%; }
  .value-row:nth-child(3) .value-bar { background: #4A7BF7; width: 78%; }

  .value-desc {
    width: 380px;
    flex-shrink: 0;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink-light);
    line-height: 1.7;
  }

  /* Bottom accent quote */
  .bottom-quote {
    margin-top: auto;
    padding-top: 32px;
    text-align: center;
  }

  .bottom-quote p {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 400;
    color: var(--ink-light);
    font-style: italic;
    line-height: 1.6;
  }

  .bottom-quote p strong {
    font-style: normal;
    font-weight: 700;
    color: var(--green);
  }

  .page-num {
    position: absolute;
    bottom: 48px;
    right: 80px;
  }
</style>
</head>
<body>

  <p class="kicker">Core Value</p>
  <h1>为什么这个工具有价值</h1>

  <div class="values">
    <div class="value-row">
      <div class="value-label">
        <p class="value-title">降低门槛</p>
        <p class="value-sub">Accessibility</p>
      </div>
      <div class="value-bar-track">
        <div class="value-bar"></div>
      </div>
      <p class="value-desc">将 3000 字的法律文本压缩为 3 分钟的通俗解读，让每个人都能掌握自己的数据命运。</p>
    </div>

    <div class="value-row">
      <div class="value-label">
        <p class="value-title">提升意识</p>
        <p class="value-sub">Awareness</p>
      </div>
      <div class="value-bar-track">
        <div class="value-bar"></div>
      </div>
      <p class="value-desc">不只是「翻译」，更是「教育」。帮助用户理解为什么要关注隐私，以及如何做出知情选择。</p>
    </div>

    <div class="value-row">
      <div class="value-label">
        <p class="value-title">促进透明</p>
        <p class="value-sub">Transparency</p>
      </div>
      <div class="value-bar-track">
        <div class="value-bar"></div>
      </div>
      <p class="value-desc">当越来越多的用户开始要求「说人话」的隐私政策，企业也会被推动写出更透明的条款。</p>
    </div>
  </div>

  <div class="bottom-quote">
    <p>「隐私不是<em>给</em>你的，是<em>属于</em>你的。<strong>懂</strong>，是保护它的第一步。」</p>
  </div>

  <p class="page-num">05 / 06</p>

</body>
</html>
