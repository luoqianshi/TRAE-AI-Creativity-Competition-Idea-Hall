<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0b18" />
  <title>CyberBar · 赛博酒馆 | 你的今日赛博特调</title>
  <meta name="description" content="输入你的今日情绪，调配一杯属于你的赛博特调。" />

  <!-- Google Fonts: 赛博朋克科技感字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    /* ===========================
       CSS 变量 - 赛博霓虹调色盘
       =========================== */
    :root {
      --bg-primary: #0d0b18;
      --bg-secondary: #1a1530;
      --bg-tertiary: #251d3f;
      --neon-pink: #ff007f;
      --neon-cyan: #00f0ff;
      --neon-yellow: #fffb00;
      --neon-purple: #b14bff;
      --neon-green: #39ff8b;
      --text-primary: #e8e6f5;
      --text-secondary: #8b86a8;
      --text-dim: #5a567a;
      --glass-bg: rgba(13, 11, 24, 0.25);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-border-hover: rgba(255, 0, 127, 0.4);
      --shadow-deep: 0 20px 60px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      --grad-rainbow: linear-gradient(135deg, #ff007f 0%, #b14bff 35%, #00f0ff 70%, #fffb00 100%);
      --grad-pink-purple: linear-gradient(135deg, #ff007f, #b14bff);
      --grad-cyan-blue: linear-gradient(135deg, #00f0ff, #0066ff);
      --font-display: 'Orbitron', 'Noto Sans SC', sans-serif;
      --font-body: 'Rajdhani', 'Noto Sans SC', sans-serif;
      --font-mono: 'Share Tech Mono', monospace;
    }

    /* ===========================
       Reset & 基础
       =========================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-body);
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.5;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: 0.02em;
    }

    /* ===========================
       背景特效层 - 径向光斑 + 噪点 + 网格
       =========================== */
    .bg-effects {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.65;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }

    .bg-orb--1 {
      width: 560px; height: 560px;
      background: radial-gradient(circle, var(--neon-pink) 0%, transparent 70%);
      top: -160px; left: -160px;
      animation: orb-breathe-1 9s ease-in-out infinite;
    }

    .bg-orb--2 {
      width: 640px; height: 640px;
      background: radial-gradient(circle, var(--neon-cyan) 0%, transparent 70%);
      bottom: -220px; right: -220px;
      animation: orb-breathe-2 11s ease-in-out infinite;
    }

    .bg-orb--3 {
      width: 460px; height: 460px;
      background: radial-gradient(circle, var(--neon-purple) 0%, transparent 70%);
      top: 35%; left: 50%;
      transform: translate(-50%, -50%);
      animation: orb-breathe-3 13s ease-in-out infinite;
      opacity: 0.55;
    }

    .bg-orb--4 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, var(--neon-yellow) 0%, transparent 70%);
      top: 8%; right: -100px;
      animation: orb-breathe-1 10s ease-in-out infinite;
      animation-delay: -3s;
      opacity: 0.4;
    }

    .bg-orb--5 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--neon-green) 0%, transparent 70%);
      bottom: 10%; left: -180px;
      animation: orb-breathe-2 12s ease-in-out infinite;
      animation-delay: -5s;
      opacity: 0.4;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(177, 75, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    .bg-noise {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' /%3E%3C/svg%3E");
    }

    .bg-scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 50%, rgba(0, 240, 255, 0.02) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      animation: scanline 8s linear infinite;
    }

    @keyframes orb-breathe-1 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.65;
      }
      25% {
        transform: translate(60px, 40px) scale(1.18);
        opacity: 0.9;
      }
      50% {
        transform: translate(20px, -30px) scale(0.92);
        opacity: 0.45;
      }
      75% {
        transform: translate(-40px, 20px) scale(1.1);
        opacity: 0.75;
      }
    }

    @keyframes orb-breathe-2 {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.65;
      }
      30% {
        transform: translate(-50px, -40px) scale(1.22);
        opacity: 0.95;
      }
      60% {
        transform: translate(30px, 50px) scale(0.88);
        opacity: 0.4;
      }
      80% {
        transform: translate(50px, -20px) scale(1.12);
        opacity: 0.8;
      }
    }

    @keyframes orb-breathe-3 {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.55;
      }
      33% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0.8;
      }
      66% {
        transform: translate(-50%, -50%) scale(0.85);
        opacity: 0.35;
      }
    }

    @keyframes scanline {
      0% { background-position: 0 0; }
      100% { background-position: 0 100px; }
    }

    /* 背景整体呼吸节律 - 提升氛围感 */
    @keyframes bg-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.92; }
    }

    .bg-effects {
      animation: bg-pulse 7s ease-in-out infinite;
    }

    /* ===========================
       主容器
       =========================== */
    .container {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 32px 80px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===========================
       Header - 霓虹灯牌
       =========================== */
    .site-header {
      text-align: center;
      margin-bottom: 56px;
    }

    .neon-logo {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(2.4rem, 7vw, 4rem);
      letter-spacing: 0.08em;
      line-height: 1.1;
      background: var(--grad-rainbow);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: gradient-shift 6s ease infinite, neon-breathe 4s ease-in-out infinite;
      filter: drop-shadow(0 0 18px rgba(255, 0, 127, 0.4))
              drop-shadow(0 0 32px rgba(0, 240, 255, 0.25));
      position: relative;
      display: inline-block;
    }

    .neon-logo::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      background: var(--grad-rainbow);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: blur(20px);
      opacity: 0.5;
      z-index: -1;
      animation: gradient-shift 6s ease infinite;
    }

    .logo-cn {
      display: block;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      letter-spacing: 0.4em;
      color: var(--neon-cyan);
      margin-top: 8px;
      text-shadow:
        0 0 8px rgba(0, 240, 255, 0.8),
        0 0 16px rgba(0, 240, 255, 0.4),
        0 0 24px rgba(0, 240, 255, 0.2);
      animation: neon-flicker 5s ease-in-out infinite;
    }

    .slogan {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 2.2vw, 1.05rem);
      color: var(--text-secondary);
      margin-top: 20px;
      letter-spacing: 0.15em;
      font-weight: 400;
    }

    .slogan::before,
    .slogan::after {
      content: "✦";
      color: var(--neon-pink);
      margin: 0 12px;
      opacity: 0.6;
      font-size: 0.7em;
    }

    .status-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 6px 16px;
      background: rgba(57, 255, 139, 0.08);
      border: 1px solid rgba(57, 255, 139, 0.3);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--neon-green);
      letter-spacing: 0.1em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon-green);
      box-shadow: 0 0 8px var(--neon-green);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes neon-breathe {
      0%, 100% {
        filter: drop-shadow(0 0 18px rgba(255, 0, 127, 0.4))
                drop-shadow(0 0 32px rgba(0, 240, 255, 0.25));
      }
      50% {
        filter: drop-shadow(0 0 28px rgba(255, 0, 127, 0.7))
                drop-shadow(0 0 48px rgba(0, 240, 255, 0.5))
                drop-shadow(0 0 60px rgba(177, 75, 255, 0.3));
      }
    }

    @keyframes neon-flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.4; }
      94% { opacity: 1; }
      95% { opacity: 0.7; }
      96% { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    /* ===========================
       玻璃态卡片基础
       =========================== */
    .glass {
      position: relative;
      background:
        linear-gradient(135deg,
          rgba(255, 255, 255, 0.06) 0%,
          rgba(255, 255, 255, 0.02) 50%,
          rgba(255, 255, 255, 0.04) 100%),
        var(--glass-bg);
      backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
      -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.05);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow:
        var(--shadow-deep),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 0 rgba(255, 255, 255, 0.04);
    }

    /* 玻璃顶部高光线 - 增强"毛玻璃"通透感 */
    .glass::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%);
      pointer-events: none;
      border-radius: 1px;
    }

    /* ===========================
       情绪输入区
       =========================== */
    .mood-input {
      padding: 32px;
      transition: all 0.3s ease;
    }

    .input-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .input-label .label-num {
      font-family: var(--font-mono);
      color: var(--neon-pink);
      font-size: 0.75rem;
    }

    .mood-textarea {
      width: 100%;
      min-height: 140px;
      padding: 18px 20px;
      background: rgba(13, 11, 24, 0.5);
      border: 1.5px solid rgba(0, 240, 255, 0.2);
      border-radius: 14px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.6;
      letter-spacing: 0.02em;
      resize: vertical;
      transition: all 0.3s ease;
      outline: none;
    }

    .mood-textarea::placeholder {
      color: var(--text-dim);
      font-style: italic;
    }

    .mood-textarea:focus {
      border-color: var(--neon-pink);
      background: rgba(13, 11, 24, 0.7);
      box-shadow:
        0 0 0 4px rgba(255, 0, 127, 0.1),
        0 0 24px rgba(255, 0, 127, 0.3);
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .quick-tag {
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .quick-tag:hover {
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
      background: rgba(0, 240, 255, 0.08);
      transform: translateY(-1px);
    }

    .quick-tag:active {
      transform: translateY(0);
    }

    /* ===========================
       主按钮 - 开始调配
       =========================== */
    .mix-btn-wrap {
      margin-top: 28px;
      display: flex;
      justify-content: center;
    }

    .mix-btn {
      position: relative;
      padding: 18px 48px;
      background: var(--grad-pink-purple);
      background-size: 200% 200%;
      border: none;
      border-radius: 999px;
      color: white;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.1) inset,
        0 8px 24px rgba(255, 0, 127, 0.3),
        0 0 32px rgba(177, 75, 255, 0.2);
      animation: btn-gradient 4s ease infinite;
    }

    .mix-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: var(--grad-rainbow);
      background-size: 200% 200%;
      border-radius: 999px;
      z-index: -1;
      opacity: 0;
      filter: blur(12px);
      transition: opacity 0.3s ease;
      animation: btn-gradient 4s ease infinite;
    }

    .mix-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.3), transparent 30%);
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.3s ease;
      animation: btn-rotate 3s linear infinite;
    }

    .mix-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.2) inset,
        0 12px 32px rgba(255, 0, 127, 0.5),
        0 0 48px rgba(177, 75, 255, 0.4);
    }

    .mix-btn:hover::before {
      opacity: 0.8;
    }

    .mix-btn:hover::after {
      opacity: 1;
    }

    .mix-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .mix-btn .btn-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mix-btn .btn-icon {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .mix-btn:hover .btn-icon {
      transform: rotate(15deg) scale(1.1);
    }

    .mix-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    @keyframes btn-gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes btn-rotate {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ===========================
       加载动画区
       =========================== */
    .loading-zone {
      margin-top: 40px;
      padding: 60px 32px;
      text-align: center;
      display: none;
    }

    .loading-zone.active {
      display: block;
      animation: fade-up 0.5s ease;
    }

    .shaker {
      display: inline-block;
      width: 80px;
      height: 100px;
      position: relative;
      animation: shake 0.6s ease-in-out infinite;
    }

    .shaker-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 70px;
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.15) 0%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(0, 0, 0, 0.2) 100%);
      border: 1.5px solid var(--neon-cyan);
      border-radius: 4px 4px 12px 12px;
      box-shadow:
        0 0 20px rgba(0, 240, 255, 0.4),
        inset 0 0 16px rgba(0, 240, 255, 0.2);
    }

    .shaker-cap {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 24px;
      background: linear-gradient(135deg, #2a2440, #1a1530);
      border: 1.5px solid var(--neon-pink);
      border-radius: 6px 6px 2px 2px;
      box-shadow: 0 0 16px rgba(255, 0, 127, 0.5);
    }

    .shaker-liquid {
      position: absolute;
      bottom: 4px;
      left: 4px;
      right: 4px;
      height: 40%;
      background: linear-gradient(180deg,
        var(--neon-pink),
        var(--neon-purple),
        var(--neon-cyan));
      border-radius: 0 0 8px 8px;
      filter: blur(0.5px);
      animation: liquid-shift 1s ease-in-out infinite;
    }

    .loading-text {
      margin-top: 28px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--neon-cyan);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .loading-text::after {
      content: '...';
      display: inline-block;
      animation: dots 1.5s steps(4) infinite;
      width: 1.2em;
      text-align: left;
    }

    .loading-progress {
      margin-top: 20px;
      width: 200px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-left: auto;
      margin-right: auto;
      overflow: hidden;
    }

    .loading-progress::after {
      content: '';
      display: block;
      height: 100%;
      width: 0%;
      background: var(--grad-rainbow);
      background-size: 200% 100%;
      animation: progress-fill 1.8s cubic-bezier(0.65, 0, 0.35, 1) forwards,
                 progress-glow 1s ease-in-out infinite;
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg) translateX(-4px); }
      40% { transform: rotate(12deg) translateX(4px); }
      60% { transform: rotate(-8deg) translateX(-3px); }
      80% { transform: rotate(8deg) translateX(3px); }
    }

    @keyframes liquid-shift {
      0%, 100% { transform: translateY(0); opacity: 0.8; }
      50% { transform: translateY(-4px); opacity: 1; }
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75%, 100% { content: '...'; }
    }

    @keyframes progress-fill {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @keyframes progress-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.5); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===========================
       结果展示区
       =========================== */
    .result-zone {
      margin-top: 40px;
      display: none;
    }

    .result-zone.active {
      display: block;
      animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .result-card {
      padding: 40px 36px;
      position: relative;
      overflow: hidden;
      /* 加强毛玻璃 - 叠加额外模糊层 */
      backdrop-filter: blur(40px) saturate(200%) contrast(1.1);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(1.1);
      background:
        linear-gradient(135deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.03) 40%,
          rgba(255, 255, 255, 0.06) 100%),
        rgba(13, 11, 24, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 30px 80px -20px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        inset 0 1px 0 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 0 rgba(255, 255, 255, 0.05);
    }

    /* 调酒卡片顶部弧形高光 - 强化玻璃质感 */
    .result-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.1) 0%,
        rgba(255, 255, 255, 0.02) 60%,
        transparent 100%);
      pointer-events: none;
      border-radius: 20px 20px 0 0;
    }

    .result-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--result-grad, var(--grad-pink-purple));
      opacity: 0.1;
      pointer-events: none;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      position: relative;
      z-index: 1;
    }

    .result-meta {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-secondary);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .result-id {
      color: var(--neon-pink);
    }

    .cocktail-name-wrap {
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .cocktail-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--neon-cyan);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .cocktail-name {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4.5vw, 2.2rem);
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0.05em;
      background: var(--result-grad, var(--grad-rainbow));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient-shift 6s ease infinite;
      filter: drop-shadow(0 0 12px var(--result-glow, rgba(255, 0, 127, 0.4)));
    }

    .cocktail-subtitle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-secondary);
      letter-spacing: 0.15em;
      margin-top: 8px;
      font-style: italic;
    }

    /* ===========================
       SVG 鸡尾酒杯
       =========================== */
    .glass-visual {
      display: flex;
      justify-content: center;
      margin: 32px 0;
      position: relative;
      z-index: 1;
    }

    .cocktail-svg {
      width: 200px;
      height: 260px;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.5))
              drop-shadow(0 0 32px var(--result-glow, rgba(255, 0, 127, 0.3)));
    }

    .liquid-path {
      animation: liquid-wave 3s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes liquid-wave {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-2px) scaleY(0.97); }
    }

    .bubble {
      animation: bubble-up 4s linear infinite;
      opacity: 0;
    }

    .bubble--1 { animation-delay: 0s; }
    .bubble--2 { animation-delay: 1.3s; }
    .bubble--3 { animation-delay: 2.6s; }

    @keyframes bubble-up {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-80px); opacity: 0; }
    }

    .glass-shine {
      animation: shine 4s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    /* ===========================
       配方进度条
       =========================== */
    .recipe-section {
      position: relative;
      z-index: 1;
      margin-top: 32px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--neon-cyan);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .section-title::before {
      content: '';
      width: 16px;
      height: 1px;
      background: var(--neon-cyan);
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--neon-cyan), transparent);
    }

    .recipe-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .recipe-item {
      opacity: 0;
      transform: translateX(-12px);
    }

    .result-zone.active .recipe-item {
      animation: slide-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .result-zone.active .recipe-item:nth-child(1) { animation-delay: 0.2s; }
    .result-zone.active .recipe-item:nth-child(2) { animation-delay: 0.35s; }
    .result-zone.active .recipe-item:nth-child(3) { animation-delay: 0.5s; }
    .result-zone.active .recipe-item:nth-child(4) { animation-delay: 0.65s; }

    .recipe-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .recipe-label {
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text-primary);
      font-weight: 500;
    }

    .recipe-percent {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-weight: 700;
    }

    .recipe-bar {
      position: relative;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    .recipe-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      width: var(--target-width, 0%);
      background: var(--bar-color, var(--neon-pink));
      border-radius: 4px;
      box-shadow: 0 0 12px var(--bar-color, var(--neon-pink));
      transform-origin: left;
      animation: bar-fill 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    .result-zone.active .recipe-bar::before {
      animation: bar-fill 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    .recipe-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: var(--target-width, 0%);
      height: 100%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%);
      border-radius: 4px;
      animation: shimmer 2s ease-in-out infinite;
    }

    @keyframes bar-fill {
      from { width: 0% !important; }
      to { width: var(--target-width) !important; }
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    @keyframes slide-in {
      to { opacity: 1; transform: translateX(0); }
    }

    /* ===========================
       毒鸡汤
       =========================== */
    .quote-section {
      margin-top: 32px;
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-left: 2px solid var(--neon-pink);
      border-radius: 0 12px 12px 0;
      position: relative;
      z-index: 1;
    }

    .quote-mark {
      position: absolute;
      top: -8px;
      left: 12px;
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: var(--neon-pink);
      opacity: 0.4;
      line-height: 1;
    }

    .quote-text {
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text-primary);
      font-style: italic;
      letter-spacing: 0.03em;
    }

    .quote-author {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ===========================
       再来一杯按钮
       =========================== */
    .reset-wrap {
      margin-top: 36px;
      display: flex;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .reset-btn {
      padding: 12px 28px;
      background: transparent;
      border: 1.5px solid var(--neon-cyan);
      border-radius: 999px;
      color: var(--neon-cyan);
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
    }

    .reset-btn:hover {
      background: rgba(0, 240, 255, 0.1);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
      transform: translateY(-2px);
    }

    .reset-btn .btn-icon {
      width: 14px;
      height: 14px;
      transition: transform 0.4s ease;
    }

    .reset-btn:hover .btn-icon {
      transform: rotate(180deg);
    }

    /* ===========================
       Footer
       =========================== */
    .site-footer {
      margin-top: auto;
      padding-top: 48px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.15em;
    }

    .footer-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neon-purple), transparent);
      margin: 0 auto 16px;
    }

    /* ===========================
       响应式 - 移动端
       =========================== */
    @media (max-width: 640px) {
      .container {
        padding: 40px 20px 60px;
      }

      .site-header {
        margin-bottom: 40px;
      }

      .mood-input,
      .result-card {
        padding: 24px 20px;
        border-radius: 16px;
      }

      .mix-btn {
        padding: 16px 36px;
        font-size: 0.9rem;
        width: 100%;
        max-width: 320px;
      }

      .cocktail-svg {
        width: 160px;
        height: 210px;
      }

      .quick-tags {
        gap: 6px;
      }

      .quick-tag {
        font-size: 0.75rem;
        padding: 5px 12px;
      }
    }

    /* ===========================
       可访问性 - 减少动效
       =========================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* 工具类 */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

  <script>
    /* ===========================
       1. 情绪关键词数据库
       =========================== */
    const MOOD_DATABASE = {

            quote: '打工是给别人盖房子，副业是给自己挖井。等井出水那天，谁也抽不走。'
          },
          {
            name: '面试通关波波',
            subtitle: 'Interview Pop · Bubble Up',
            tag: 'AMBITIOUS · GLITTER',
            liquidColors: ['#ff007f', '#fffb00', '#39ff8b'],
            recipe: [
              { label: '准备好的自我介绍', percent: 35, color: '#ff007f' },
              { label: 'STAR 法则的肌肉记忆', percent: 30, color: '#fffb00' },
              { label: '反向画饼的勇气', percent: 25, color: '#39ff8b' },
              { label: 'HR 的微笑', percent: 10, color: '#00f0ff' }
            ],
            quote: '面试是双向选择，你也在面试这家公司值不值得你浪费通勤时间。'
          }
        ]
      }
    };

    // 隐藏款随机池 - 无匹配时启用
    const HIDDEN_POOL = [
      {
        name: '薛定谔的猫薄荷',
        subtitle: "Schrödinger’s Catnip",
        tag: 'HIDDEN · QUANTUM',
        liquidColors: ['#b14bff', '#00f0ff', '#39ff8b'],
        recipe: [
          { label: '好奇心', percent: 40, color: '#b14bff' },
          { label: '既活又死的状态', percent: 30, color: '#00f0ff' },
          { label: '打开盒子的勇气', percent: 20, color: '#39ff8b' },
          { label: '波函数的温柔', percent: 10, color: '#fffb00' }
        ],
        quote: '在你打开盒子之前，猫既是活的也是死的——但你的好奇心，永远是活的。'
      },
      {
        name: '递归困境特调',
        subtitle: 'Recursive Trap · Endless Loop',
        tag: 'HIDDEN · INFINITE',
        liquidColors: ['#ff007f', '#5a567a', '#00f0ff'],
        recipe: [
          { label: '自我怀疑的套娃', percent: 50, color: '#ff007f' },
          { label: '无限循环的期待', percent: 25, color: '#5a567a' },
          { label: '终止条件的智慧', percent: 15, color: '#00f0ff' },
          { label: '一个出口', percent: 10, color: '#39ff8b' }
        ],
        quote: '人生没有 bug，只有还没写完的 feature。'
      },
      {
        name: '404 鸡汤之谜',
        subtitle: '404 Soul-Not-Found',
        tag: 'HIDDEN · MYSTERY',
        liquidColors: ['#00f0ff', '#fffb00', '#ff007f'],
        recipe: [
          { label: '搜索不到的答案', percent: 45, color: '#00f0ff' },
          { label: '深夜的鸡汤文', percent: 30, color: '#fffb00' },
          { label: '自我安慰的能力', percent: 15, color: '#ff007f' },
          { label: '明天的希望', percent: 10, color: '#b14bff' }
        ],
        quote: '你搜不到答案，是因为答案一直在你心里。'
      },
      {
        name: '极光入眠剂',
        subtitle: 'Aurora Sleep Tonic',
        tag: 'HIDDEN · DREAMY',
        liquidColors: ['#39ff8b', '#00f0ff', '#b14bff'],
        recipe: [
          { label: '极夜的寂静', percent: 50, color: '#39ff8b' },
          { label: '极光的余晖', percent: 25, color: '#00f0ff' },
          { label: '羊毛毯的温暖', percent: 15, color: '#b14bff' },
          { label: '一个没有闹钟的早晨', percent: 10, color: '#fffb00' }
        ],
        quote: '不是所有的休息都要有意义，发呆本身就是意义。'
      },
      {
        name: '时间折叠马天尼',
        subtitle: 'Time-Fold Martini',
        tag: 'HIDDEN · PHILOSOPHY',
        liquidColors: ['#fffb00', '#ff007f', '#00f0ff'],
        recipe: [
          { label: '过去的温柔', percent: 35, color: '#fffb00' },
          { label: '现在的清醒', percent: 35, color: '#ff007f' },
          { label: '未来的悬念', percent: 20, color: '#00f0ff' },
          { label: '此刻的勇气', percent: 10, color: '#b14bff' }
        ],
        quote: '时间不会流逝，是你穿过时间。'
      }
    ];

    /* ===========================
       2. DOM 引用
       =========================== */
    const els = {
      moodText: document.getElementById('moodText'),
      mixBtn: document.getElementById('mixBtn'),
      moodInput: document.getElementById('moodInput'),
      loadingZone: document.getElementById('loadingZone'),
      resultZone: document.getElementById('resultZone'),
      resultCard: document.getElementById('resultCard'),
      resultId: document.getElementById('resultId'),
      resultTimestamp: document.getElementById('resultTimestamp'),
      cocktailTag: document.getElementById('cocktailTag'),
      cocktailName: document.getElementById('cocktailName'),
      cocktailSubtitle: document.getElementById('cocktailSubtitle'),
      recipeList: document.getElementById('recipeList'),
      quoteText: document.getElementById('quoteText'),
      resetBtn: document.getElementById('resetBtn'),
      quickTags: document.querySelectorAll('.quick-tag')
    };

    /* ===========================
       3. 工具函数
       =========================== */
    function matchMood(text) {
      const lowerText = text.toLowerCase();
      const scores = {};
      for (const [category, data] of Object.entries(MOOD_DATABASE)) {
        scores[category] = data.keywords.filter(kw => lowerText.includes(kw.toLowerCase())).length;
      }
      const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      return sorted[0][1] > 0 ? sorted[0][0] : null;
    }

    function pickCocktail(category) {
      if (!category) {
        return HIDDEN_POOL[Math.floor(Math.random() * HIDDEN_POOL.length)];
      }
      const cocktails = MOOD_DATABASE[category].cocktails;
      return cocktails[Math.floor(Math.random() * cocktails.length)];
    }

    function getRecipeId() {
      const now = new Date();
      const id = String(Math.floor(Math.random() * 9999)).padStart(4, '0');
      return `RECIPE #${id}`;
    }

    function getTimestamp() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    }

    function getGradFromColors(colors) {
      return `linear-gradient(135deg, ${colors[0]}, ${colors[1]}, ${colors[2]})`;
    }

    function getGlowColor(colors) {
      return colors[0];
    }

    function renderResult(cocktail) {
      // 设置 CSS 变量驱动结果主题
      const card = els.resultCard;
      card.style.setProperty('--result-grad', getGradFromColors(cocktail.liquidColors));
      card.style.setProperty('--result-glow', `${getGlowColor(cocktail.liquidColors)}80`);

      // 设置 SVG 液体渐变色
      const root = document.documentElement;
      root.style.setProperty('--liquid-1', cocktail.liquidColors[0]);
      root.style.setProperty('--liquid-2', cocktail.liquidColors[1]);
      root.style.setProperty('--liquid-3', cocktail.liquidColors[2]);

      // 填充元数据
      els.resultId.textContent = getRecipeId();
      els.resultTimestamp.textContent = getTimestamp();
      els.cocktailTag.textContent = cocktail.tag;
      els.cocktailName.textContent = cocktail.name;
      els.cocktailSubtitle.textContent = cocktail.subtitle;
      els.quoteText.textContent = cocktail.quote;

      // 渲染配方
      els.recipeList.innerHTML = '';
      cocktail.recipe.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'recipe-item';
        div.innerHTML = `
          <div class="recipe-head">
            <span class="recipe-label">${item.label}</span>
            <span class="recipe-percent">${item.percent}%</span>
          </div>
          <div class="recipe-bar" style="--target-width: ${item.percent}%; --bar-color: ${item.color};"></div>
        `;
        els.recipeList.appendChild(div);
      });

      // 重置动画 - 移除 active 重新触发
      els.resultZone.classList.remove('active');
      void els.resultZone.offsetWidth;
      els.resultZone.classList.add('active');
    }

    function showLoading() {
      els.moodInput.style.display = 'none';
      els.resultZone.classList.remove('active');
      els.loadingZone.classList.add('active');
    }

    function hideLoading() {
      els.loadingZone.classList.remove('active');
    }

    function showResult(cocktail) {
      renderResult(cocktail);
      els.resultZone.classList.add('active');
    }

    function resetApp() {
      els.resultZone.classList.remove('active');
      els.moodInput.style.display = 'block';
      els.moodInput.style.animation = 'fade-up 0.5s ease';
      els.moodText.value = '';
      setTimeout(() => {
        els.moodText.focus();
      }, 200);
    }

    /* ===========================
       4. 事件绑定
       =========================== */
    function onMixClick() {
      const text = els.moodText.value.trim();
      if (!text) {
        els.moodText.focus();
        els.moodText.placeholder = '✦ 请先告诉我你的今日情绪... ✦';
        els.moodText.classList.add('shake-error');
        setTimeout(() => els.moodText.classList.remove('shake-error'), 600);
        return;
      }

      els.mixBtn.disabled = true;
      els.mixBtn.querySelector('.btn-content').innerHTML = `
        <span style="opacity:0.7;">✦</span>
        <span>MIXING...</span>
      `;
      showLoading();

      // 模拟调酒过程
      setTimeout(() => {
        const category = matchMood(text);
        const cocktail = pickCocktail(category);
        hideLoading();
        showResult(cocktail);
        els.mixBtn.disabled = false;
        els.mixBtn.querySelector('.btn-content').innerHTML = `
          <i data-lucide="flask-conical" class="btn-icon"></i>
          <span>开始调配 · MIX COCKTAIL</span>
        `;
        lucide.createIcons();
        // 滚动到结果
        setTimeout(() => {
          els.resultZone.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      }, 1800);
    }

    els.mixBtn.addEventListener('click', onMixClick);

    els.resetBtn.addEventListener('click', () => {
      resetApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 快捷标签
    els.quickTags.forEach(tag => {
      tag.addEventListener('click', () => {
        const mood = tag.dataset.mood;
        els.moodText.value = mood;
        els.moodText.focus();
        // 触发按钮波纹效果
        els.mixBtn.style.transform = 'scale(0.95)';
        setTimeout(() => {
          els.mixBtn.style.transform = '';
        }, 150);
      });
    });

    // 键盘快捷：Ctrl/Cmd + Enter 触发调配
    els.moodText.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        onMixClick();
      }
    });

    /* ===========================
       5. 错误抖动动效
       =========================== */
    const shakeStyle = document.createElement('style');
    shakeStyle.textContent = `
      @keyframes shake-error {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }
      .shake-error {
        animation: shake-error 0.5s ease;
        border-color: var(--neon-pink) !important;
        box-shadow: 0 0 0 4px rgba(255, 0, 127, 0.15), 0 0 24px rgba(255, 0, 127, 0.3) !important;
      }
    `;
    document.head.appendChild(shakeStyle);

    /* ===========================
       6. 初始化
       =========================== */
    lucide.createIcons();
    els.moodText.focus();
  </script>
</body>
</html>
