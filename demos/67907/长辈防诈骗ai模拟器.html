<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>「反诈真探」长辈防诈骗AI模拟训练网页</title>
    <style>
        :root {
            --primary-color: #2c3e50; /* 深蓝灰色 - 科技感/冷静 */
            --accent-color: #3498db;   /* 亮蓝色 - 激活/用户 */
            --scammer-color: #e74c3c; /* 红色 - 警告/骗子 */
            --bg-color: #f4f7f6;     /* 浅灰蓝色 - 背景 */
            --chat-user-bg: #ecf0f1;
            --chat-scammer-bg: #fadbd8;
            --feedback-correct: #27ae60; /* 绿色 - 正确 */
            --feedback-wrong: #f39c12;   /* 橙色 - 错误 */
            --text-color: #333;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "PingFang SC", "Lantinghei SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            text-align: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header h2 {
            font-size: 1.2rem;
            font-weight: normal;
            color: #bdc3c7;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
        }

        .chat-wrapper {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-right: 2rem;
        }

        .scenario-selector {
            background-color: #e6e9ed;
            padding: 1rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            border-bottom: 1px solid #d4d8db;
        }

        .scenario-selector button {
            background-color: white;
            border: 1px solid #ced4da;
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .scenario-selector button:hover, .scenario-selector button.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chat-history {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            max-height: 400px;
        }

        .chat-message {
            max-width: 80%;
            padding: 1rem;
            border-radius: var(--radius);
            font-size: 1.1rem;
        }

        .chat-message.scammer {
            align-self: flex-start;
            background-color: var(--chat-scammer-bg);
            border: 2px solid var(--scammer-color);
            border-bottom-left-radius: 4px;
        }

        .chat-message.user {
            align-self: flex-end;
            background-color: var(--chat-user-bg);
            color: white;
            border-bottom-right-radius: 4px;
            text-align: right;
            background-color: var(--accent-color);
        }

        .chat-message h4 {
            font-size: 0.9rem;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
        }

        .chat-message.scammer h4 {
            color: var(--scammer-color);
        }

        .chat-message.user h4 {
            color: rgba(255, 255, 255, 0.7);
        }

        .user-inputs {
            background-color: #e6e9ed;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border-top: 1px solid #d4d8db;
        }

        .user-inputs h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }

        .user-inputs button {
            background-color: white;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            cursor: pointer;
            text-align: left;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .user-inputs button:hover {
            background-color: rgba(52, 152, 219, 0.1);
            border-width: 2px;
        }

        .feedback-area {
            display: none;
            margin: 1.5rem;
            padding: 1.5rem;
            border-radius: var(--radius);
            font-size: 1.1rem;
        }

        .feedback-area h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
        }

        .feedback-area.correct {
            background-color: rgba(39, 174, 96, 0.1);
            border: 2px solid var(--feedback-correct);
            color: #1e7a41;
        }

        .feedback-area.wrong {
            background-color: rgba(243, 156, 18, 0.1);
            border: 2px solid var(--feedback-wrong);
            color: #d68910;
        }

        .feedback-area .tip {
            margin-top: 0.8rem;
            font-weight: bold;
        }

        .restart-btn {
            display: none;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: var(--radius);
            font-size: 1.2rem;
            cursor: pointer;
            margin: 1.5rem;
            align-self: center;
        }

        .sidebar {
            width: 300px;
            background-color: #edf2f7;
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        .sidebar h3 {
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }

        .sidebar ul {
            list-style: none;
        }

        .sidebar ul li {
            margin-bottom: 0.8rem;
            font-size: 1rem;
        }

        .sidebar .contest-info {
            font-weight: bold;
            color: #6c757d;
        }

        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
                align-items: stretch;
            }
            .chat-wrapper {
                margin-right: 0;
                margin-bottom: 2rem;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>「反诈真探」</h1>
    <h2>长辈防诈骗AI模拟训练网页</h2>
</header>

<div class="main-container">
    <div class="chat-wrapper">
        <div class="scenario-selector">
            <button class="scenario-btn active" data-scenario="gongjianfa">冒充公检法</button>
            <button class="scenario-btn" data-scenario="tuikuan">客服退款</button>
            <button class="scenario-btn" data-scenario="licai">高回报理财</button>
        </div>

        <div class="chat-history" id="chat-history">
            <!-- 对话消息将在此动态生成 -->
            <div class="chat-message scammer">
                <h4>系统提示</h4>
                请从上方选择一个诈骗场景，开始模拟。
            </div>
        </div>

        <div class="user-inputs" id="user-inputs" style="display:none;">
            <h3>请选择您的回复：</h3>
            <div class="user-options" id="user-options">
                <!-- 选项按钮将在此动态生成 -->
            </div>
        </div>

        <div class="feedback-area" id="feedback-area">
            <h3>训练反馈：</h3>
            <p id="feedback-text"></p>
            <p class="tip">防诈小贴士：多看多防，遇事不慌，及时求助！</p>
        </div>
        <button id="restart-btn" class="restart-btn">重新开始</button>
    </div>

    <aside class="sidebar">
        <h3>关于本项目</h3>
        <ul>
            <li>参赛项目：社会服务赛道</li>
            <li>创意名称：「反诈真探」</li>
            <li>创意介绍：AI驱动的沉浸式防诈模拟训练，为长辈接种“反诈疫苗”。</li>
            <li class="contest-info">创意团队：[你的名字/团队名]</li>
            <li class="contest-info">参赛社区：TRAE Work</li>
        </ul>
    </aside>
</div>

<script>
    const scenarios = {
        gongjianfa: {
            name: "冒充公检法",
            scammerInitial: "你好，我是市公安局王警官。你涉嫌一起洗钱案，请配合调查。",
            userOptions: [
                { text: "啊？真的吗？我该怎么办？", correct: false, nextScammer: "你要配合我！现在转账到我们指定的“安全账户”验证资金。如果不配合，后果自负！" },
                { text: "你有什么证据吗？可以到派出所核实。", correct: true }
            ],
            feedbackCorrect: "很好！你保持了冷静。真正的警察是不会通过电话办案，更不会要求通过网络核实身份或要账户信息的。遇到这种情况，直接挂断并报警。",
            feedbackWrong: "哎呀，这已经是一个经典的陷阱了！犯罪分子会利用你的惊慌，进一步施加压力。如果你继续，就要上当了。正确的做法是拨打110或96110举报。"
        },
        tuikuan: {
            name: "客服退款",
            scammerInitial: "你好，我是淘宝客服。您购买的商品有质量问题，我们要给您全额退款，还要给您三倍赔偿。",
            userOptions: [
                { text: "好的，太感谢了。怎么操作？", correct: false, nextScammer: "请点击这个链接领取退款，需要输入您的身份证、银行卡和手机号验证身份。" },
                { text: "我稍后会自己在手机软件里查看。不点击不明链接。", correct: true }
            ],
            feedbackCorrect: "完全正确！客服会在官方APP里处理退款，绝不会私下联系通过未知链接操作。任何要你输入银行卡密码和验证码的，百分之百是诈骗。",
            feedbackWrong: "这是一个非常普遍的骗局！骗子利用你的贪小便宜心理，通过链接窃取你的隐私信息。千万不能在不明页面输入银行卡、密码和验证码。你应该直接打开购物软件查询。",
        },
        licai: {
            name: "高回报理财",
            scammerInitial: "您好，我们有一个内部理财项目，专门面向内部高净值客户。只要投入1万，每个月能拿到2000元利息，100%保本，没有风险！",
            userOptions: [
                { text: "这么好啊，那我是要多投点。", correct: false, nextScammer: "好的，项目名额有限。请立即转账到这个账号：[银行账号]，我为您抢占名额。" },
                { text: "天上不会掉馅饼。我会去正规银行了解。", correct: true }
            ],
            feedbackCorrect: "太棒了！你的理财观念很健康。凡是号称“高回报、保本、低风险”的投资项目，绝大多数都是金融诈骗，利用贪婪心理。投资必须去正规金融机构。",
            feedbackWrong: "小心！这是一个非法集资骗局。诈骗分子往往会在初期给你一点小利（利息），然后诱导你投入更多本金，最后卷款跑路。记住，没有任何正规投资可以做到100%保本。你应该向正规银行咨询。"
        }
    };

    const chatHistory = document.getElementById('chat-history');
    const userInputs = document.getElementById('user-inputs');
    const userOptions = document.getElementById('user-options');
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackText = document.getElementById('feedback-text');
    const restartBtn = document.getElementById('restart-btn');
    const scenarioSelector = document.querySelector('.scenario-selector');
    const scenarioBtns = document.querySelectorAll('.scenario-btn');

    let currentScenarioId = 'gongjianfa';
    let currentStep = 0;

    function resetChat() {
        chatHistory.innerHTML = '<div class="chat-message scammer"><h4>系统提示</h4>请从上方选择一个诈骗场景，开始模拟。</div>';
        userInputs.style.display = 'none';
        userOptions.innerHTML = '';
        feedbackArea.style.display = 'none';
        restartBtn.style.display = 'none';
        scenarioSelector.style.display = 'flex';
        currentStep = 0;
        scenarioBtns.forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.scenario-btn[data-scenario="${currentScenarioId}"]`).classList.add('active');
    }

    function addMessage(sender, text) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('chat-message', sender);
        messageDiv.innerHTML = `<h4>${sender === 'scammer' ? '骗子' : '我'}</h4><p>${text}</p>`;
        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight; // 滚动到底部
    }

    function loadScenario(scenarioId) {
        currentScenarioId = scenarioId;
        resetChat();
        currentStep = 0;
        scenarioSelector.style.display = 'none'; // 选择后隐藏场景选择器

        const scenario = scenarios[scenarioId];
        addMessage('scammer', scenario.scammerInitial);
        userInputs.style.display = 'flex';
        loadUserOptions(scenarioId, currentStep);
    }

    function loadUserOptions(scenarioId, step) {
        userOptions.innerHTML = '';
        const scenario = scenarios[scenarioId];
        scenario.userOptions.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.innerText = option.text;
            btn.onclick = () => handleUserChoice(scenarioId, index);
            userOptions.appendChild(btn);
        });
    }

    function handleUserChoice(scenarioId, optionIndex) {
        const scenario = scenarios[scenarioId];
        const choice = scenario.userOptions[optionIndex];
        
        // 隐藏用户输入
        userInputs.style.display = 'none';

        // 显示用户选择的消息
        addMessage('user', choice.text);

        setTimeout(() => {
            if (choice.nextScammer) {
                // 如果骗子有下一步
                addMessage('scammer', choice.nextScammer);
                userInputs.style.display = 'flex'; // 重新显示用户输入
                // 暂时不继续了，示例代码保持简单。在真实应用中，可以添加更多步骤。
                userOptions.innerHTML = '';
                const endBtn = document.createElement('button');
                endBtn.innerText = "[点击结束并查看反馈]";
                endBtn.onclick = () => showFeedback(scenarioId, choice.correct);
                userOptions.appendChild(endBtn);

            } else {
                // 如果是最终选择
                showFeedback(scenarioId, choice.correct);
            }
        }, 1000);
    }

    function showFeedback(scenarioId, correct) {
        const scenario = scenarios[scenarioId];
        const feedbackMessage = correct ? scenario.feedbackCorrect : scenario.feedbackWrong;

        feedbackArea.style.display = 'block';
        feedbackArea.className = `feedback-area ${correct ? 'correct' : 'wrong'}`;
        feedbackArea.querySelector('h3').innerText = correct ? "回答正确：✅" : "警告：⚠️";
        feedbackText.innerText = feedbackMessage;
        restartBtn.style.display = 'block';
    }

    // 初始化场景选择按钮
    scenarioBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            loadScenario(btn.dataset.scenario);
        });
    });

    // 初始化重新开始按钮
    restartBtn.addEventListener('click', () => {
        currentScenarioId = 'gongjianfa'; // 默认场景
        resetChat();
    });

    // 默认加载第一个场景
    loadScenario('gongjianfa');

</script>

</body>
</html>
