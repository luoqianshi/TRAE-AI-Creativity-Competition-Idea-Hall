<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeakEasy - AI 英语陪练</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(160deg,#0f0c29 0%,#1a1a3e 30%,#24243e 60%,#0f0c29 100%);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#e0e0e0}

        /* ===== 顶部导航 ===== */
        .top-bar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(15,12,41,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100}
        .logo{display:flex;align-items:center;gap:8px}
        .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
        .logo-text{font-size:18px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .top-actions{display:flex;gap:10px;align-items:center}
        .streak-badge{background:rgba(255,167,38,.15);border:1px solid rgba(255,167,38,.3);padding:4px 12px;border-radius:16px;font-size:12px;color:#ffa726}
        .level-badge{background:rgba(102,126,234,.15);border:1px solid rgba(102,126,234,.3);padding:4px 12px;border-radius:16px;font-size:12px;color:#667eea}

        /* ===== 页面容器 ===== */
        .page{display:none}.page.active{display:flex}

        /* ===== 首页 ===== */
        .home-page{flex-direction:column;align-items:center;padding-top:72px;padding-bottom:40px;min-height:100vh}
        .welcome-section{text-align:center;margin-bottom:32px;padding:0 20px}
        .welcome-title{font-size:30px;font-weight:800;margin-bottom:10px;line-height:1.3}
        .welcome-title .hl{background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .welcome-sub{font-size:15px;color:#888;line-height:1.6}

        .mode-tabs{display:flex;gap:0;margin-bottom:28px;background:rgba(255,255,255,.04);border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
        .mode-tab{padding:10px 24px;font-size:14px;cursor:pointer;transition:all .3s;color:#888;background:transparent;border:none;font-family:inherit}
        .mode-tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}

        .level-selector{display:flex;gap:10px;margin-bottom:24px}
        .level-btn{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);color:#aaa;font-size:13px;cursor:pointer;transition:all .3s}
        .level-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(102,126,234,.3)}

        .scenes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:880px;width:100%;padding:0 20px}
        .scene-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
        .scene-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c,#667eea),transparent);opacity:0;transition:opacity .3s}
        .scene-card:hover{border-color:rgba(255,255,255,.15);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
        .scene-card:hover::before{opacity:1}
        .scene-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
        .scene-name{font-size:16px;font-weight:700;margin-bottom:4px;color:#fff}
        .scene-desc{font-size:12px;color:#888;line-height:1.5;margin-bottom:10px}
        .scene-tags{display:flex;gap:5px;flex-wrap:wrap}
        .scene-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(102,126,234,.1);color:#667eea}
        .scene-diff{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(255,167,38,.1);color:#ffa726}

        /* ===== 语音气泡模式 ===== */
        .chat-page{flex-direction:column;height:100vh;padding-top:56px}
        .chat-header{padding:12px 16px;background:rgba(15,12,41,.95);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
        .chat-back{display:flex;align-items:center;gap:6px;background:none;border:none;color:#667eea;font-size:13px;cursor:pointer}
        .chat-scene-info{text-align:center}
        .chat-scene-name{font-size:15px;font-weight:700;color:#fff}
        .chat-scene-hint{font-size:11px;color:#666}
        .chat-score{font-size:13px;color:#ffa726;font-weight:600}

        .chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}

        .message{max-width:75%;animation:msgIn .3s ease-out}
        @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .message.ai{align-self:flex-start}.message.user{align-self:flex-end}

        .msg-row{display:flex;gap:8px;align-items:flex-end}
        .message.user .msg-row{flex-direction:row-reverse}
        .msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
        .message.ai .msg-avatar{background:linear-gradient(135deg,#667eea,#764ba2)}
        .message.user .msg-avatar{background:linear-gradient(135deg,#f093fb,#f5576c)}

        /* 文字气泡 */
        .msg-bubble{padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.6;max-width:100%;word-break:break-word}
        .message.ai .msg-bubble{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-top-left-radius:4px;color:#e0e0e0}
        .message.user .msg-bubble{background:linear-gradient(135deg,#667eea,#764ba2);border-top-right-radius:4px;color:#fff}

        /* 语音气泡 - 微信风格 */
        .voice-bubble{padding:10px 14px;border-radius:18px;display:flex;align-items:center;gap:10px;min-width:140px;max-width:220px;cursor:pointer;position:relative}
        .message.ai .voice-bubble{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-top-left-radius:4px}
        .message.user .voice-bubble{background:linear-gradient(135deg,#667eea,#764ba2);border-top-right-radius:4px}
        .voice-bubble.playing{box-shadow:0 0 20px rgba(102,126,234,.4)}

        .voice-play-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:all .2s}
        .voice-play-btn:hover{transform:scale(1.1)}
        .voice-play-btn.playing{background:rgba(102,126,234,.4);animation:voicePulse 1s infinite}
        @keyframes voicePulse{0%,100%{box-shadow:0 0 0 0 rgba(102,126,234,.3)}50%{box-shadow:0 0 0 8px rgba(102,126,234,0)}}

        .voice-waves{display:flex;align-items:center;gap:2px;height:24px;flex:1}
        .voice-wave-bar{width:3px;border-radius:2px;background:currentColor;opacity:.5;animation:none}
        .voice-wave-bar.active{animation:waveAnim .6s ease-in-out infinite alternate}
        .message.ai .voice-wave-bar.active{color:#667eea}
        .message.user .voice-wave-bar.active{color:#fff}
        @keyframes waveAnim{from{height:4px}to{height:20px}}

        .voice-duration{font-size:12px;opacity:.7;white-space:nowrap}
        .voice-text-toggle{font-size:10px;opacity:.5;margin-top:4px;cursor:pointer;text-align:right}
        .voice-text-toggle:hover{opacity:.9}

        /* 语音转文字显示区 */
        .voice-transcript{margin-top:6px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.03);font-size:12px;color:#999;line-height:1.5;display:none}
        .voice-transcript.show{display:block}

        /* 语法纠错 */
        .msg-correction{margin-top:6px;padding:8px 12px;background:rgba(255,167,38,.08);border:1px solid rgba(255,167,38,.2);border-radius:10px;font-size:12px;max-width:75%;align-self:flex-end;animation:msgIn .3s ease-out}
        .correction-label{color:#ffa726;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:5px}
        .correction-text{color:#ccc;line-height:1.5}
        .correction-text .wrong{color:#ef5350;text-decoration:line-through}
        .correction-text .right{color:#66bb6a;font-weight:600}

        /* 建议回复 */
        .msg-suggestions{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
        .suggestion-btn{padding:6px 14px;border-radius:18px;border:1px solid rgba(102,126,234,.3);background:rgba(102,126,234,.08);color:#667eea;font-size:12px;cursor:pointer;transition:all .2s}
        .suggestion-btn:hover{background:rgba(102,126,234,.2);border-color:rgba(102,126,234,.5)}

        /* ===== 输入区域 ===== */
        .chat-input-area{padding:12px 16px 16px;background:rgba(15,12,41,.98);border-top:1px solid rgba(255,255,255,.08)}
        .input-mode-switch{display:flex;gap:6px;margin-bottom:10px;justify-content:center}
        .input-mode-btn{padding:4px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:transparent;color:#888;font-size:12px;cursor:pointer;transition:all .2s}
        .input-mode-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);border-color:transparent;color:#fff}

        /* 文字输入模式 */
        .text-input-row{display:flex;gap:8px;align-items:flex-end}
        .text-input-row.hidden{display:none}
        .chat-textarea{flex:1;min-height:40px;max-height:100px;padding:10px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-family:inherit;resize:none;outline:none;line-height:1.5;transition:border-color .3s}
        .chat-textarea::placeholder{color:#555}
        .chat-textarea:focus{border-color:rgba(102,126,234,.5)}

        .icon-btn{width:40px;height:40px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s}
        .send-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
        .send-btn:hover{transform:scale(1.05);box-shadow:0 3px 12px rgba(102,126,234,.4)}
        .send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none}

        /* 语音输入模式 - 按住说话 */
        .voice-input-row{display:flex;justify-content:center;align-items:center}
        .voice-input-row.hidden{display:none}
        .hold-to-talk{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;font-size:14px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 20px rgba(102,126,234,.3)}
        .hold-to-talk:active,.hold-to-talk.recording{transform:scale(1.15);background:linear-gradient(135deg,#ef5350,#e53935);box-shadow:0 0 30px rgba(239,83,80,.4)}
        .hold-to-talk .mic-icon{font-size:22px}
        .hold-to-talk .mic-label{font-size:10px}

        .voice-input-hint{text-align:center;font-size:11px;color:#555;margin-top:8px}

        /* 录音波形 */
        .recording-waveform{display:none;justify-content:center;align-items:center;gap:4px;height:40px;margin-top:10px}
        .recording-waveform.show{display:flex}
        .rec-bar{width:4px;border-radius:2px;background:linear-gradient(180deg,#667eea,#764ba2);animation:recWave .4s ease-in-out infinite alternate}
        .rec-bar:nth-child(1){animation-delay:0s;height:10px}
        .rec-bar:nth-child(2){animation-delay:.05s;height:18px}
        .rec-bar:nth-child(3){animation-delay:.1s;height:24px}
        .rec-bar:nth-child(4){animation-delay:.15s;height:16px}
        .rec-bar:nth-child(5){animation-delay:.2s;height:28px}
        .rec-bar:nth-child(6){animation-delay:.25s;height:20px}
        .rec-bar:nth-child(7){animation-delay:.3s;height:12px}
        @keyframes recWave{from{transform:scaleY(.3)}to{transform:scaleY(1)}}

        /* ===== 模拟通话模式 ===== */
        .call-page{flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(180deg,#0f0c29 0%,#1a1a3e 50%,#0f3460 100%);padding:20px}

        .call-avatar-area{margin-bottom:24px;position:relative}
        .call-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 8px 30px rgba(102,126,234,.4)}
        .call-avatar.speaking{animation:speakPulse 1s infinite}
        @keyframes speakPulse{0%,100%{box-shadow:0 0 0 0 rgba(102,126,234,.4)}50%{box-shadow:0 0 0 20px rgba(102,126,234,0)}}

        .call-name{font-size:22px;font-weight:700;color:#fff;margin-bottom:4px}
        .call-status{font-size:14px;color:#888;margin-bottom:8px}
        .call-timer{font-size:28px;color:#667eea;font-weight:300;font-variant-numeric:tabular-nums;margin-bottom:6px}
        .call-scene-label{font-size:12px;color:#555;margin-bottom:32px}

        /* 通话中的波形 */
        .call-waveform{display:flex;align-items:center;gap:3px;height:50px;margin-bottom:32px;opacity:.6}
        .call-wave-bar{width:4px;border-radius:2px;background:#667eea;transition:height .1s}

        /* 通话按钮区 */
        .call-controls{display:flex;gap:20px;align-items:center;margin-bottom:32px}
        .call-ctrl-btn{width:56px;height:56px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all .2s}
        .call-mute-btn{background:rgba(255,255,255,.08);color:#fff}
        .call-mute-btn.muted{background:rgba(239,83,80,.2);color:#ef5350}
        .call-speaker-btn{background:rgba(255,255,255,.08);color:#fff}
        .call-speaker-btn.active{background:rgba(102,126,234,.3);color:#667eea}
        .call-hangup-btn{width:70px;height:70px;border-radius:50%;border:none;background:linear-gradient(135deg,#ef5350,#c62828);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(239,83,80,.4)}

        /* 通话底部字幕 */
        .call-subtitle-area{width:100%;max-width:400px}
        .call-subtitle{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 16px;min-height:48px;font-size:15px;line-height:1.5;color:#e0e0e0;text-align:center;margin-bottom:10px;border:1px solid rgba(255,255,255,.08)}
        .call-subtitle.speaking{border-color:rgba(102,126,234,.3);background:rgba(102,126,234,.06)}
        .call-reply-bar{display:flex;gap:8px;align-items:center}
        .call-reply-input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:14px;font-family:inherit;outline:none}
        .call-reply-input::placeholder{color:#555}
        .call-reply-send{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;cursor:pointer}
        .call-voice-btn{width:40px;height:40px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;transition:all .2s;background:rgba(102,126,234,.15);color:#667eea}
        .call-voice-btn:active,.call-voice-btn.recording{background:linear-gradient(135deg,#ef5350,#c62828);color:#fff;transform:scale(1.1);box-shadow:0 0 20px rgba(239,83,80,.4)}
        .call-voice-hint{text-align:center;font-size:11px;color:#555;margin-top:6px}
        .call-reply-suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;justify-content:center}

        /* ===== 词汇面板 ===== */
        .vocab-panel{position:fixed;right:-320px;top:56px;bottom:0;width:280px;background:rgba(15,12,41,.98);border-left:1px solid rgba(255,255,255,.08);z-index:90;transition:right .3s;overflow-y:auto;padding:16px}
        .vocab-panel.open{right:0}
        .vocab-title{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
        .vocab-close{background:none;border:none;color:#888;font-size:18px;cursor:pointer}
        .vocab-item{padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);margin-bottom:6px;cursor:pointer;transition:all .2s}
        .vocab-item:hover{background:rgba(102,126,234,.08)}
        .vocab-word{font-size:15px;font-weight:600;color:#667eea;margin-bottom:2px;display:flex;align-items:center;gap:6px}
        .vocab-speak{width:20px;height:20px;border-radius:50%;background:rgba(102,126,234,.15);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:#667eea;border:none}
        .vocab-phonetic{font-size:11px;color:#888;margin-bottom:4px}
        .vocab-meaning{font-size:12px;color:#ccc}

        /* ===== 响应式 ===== */
        @media(max-width:600px){
            .welcome-title{font-size:22px}
            .scenes-grid{grid-template-columns:1fr}
            .message{max-width:85%}
            .streak-badge,.level-badge{display:none}
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
    <div class="logo"><div class="logo-icon">🗣️</div><div class="logo-text">SpeakEasy</div></div>
    <div class="top-actions">
        <div class="streak-badge">🔥 7天</div>
        <div class="level-badge" id="currentLevelBadge">B1 中级</div>
    </div>
</div>

<!-- ===== 首页 ===== -->
<div class="page home-page active" id="homePage">
    <div class="welcome-section">
        <div class="welcome-title">和 AI 一起<br><span class="hl">用英语对话</span></div>
        <div class="welcome-sub">语音交互 · 真实对话感 · 实时纠错</div>
    </div>

    <div class="mode-tabs">
        <button class="mode-tab active" data-mode="voice" onclick="setMode(this)">💬 语音气泡</button>
        <button class="mode-tab" data-mode="call" onclick="setMode(this)">📞 模拟通话</button>
    </div>

    <div class="level-selector">
        <button class="level-btn" data-level="A2" onclick="setLevel(this)">A2 初级</button>
        <button class="level-btn active" data-level="B1" onclick="setLevel(this)">B1 中级</button>
        <button class="level-btn" data-level="B2" onclick="setLevel(this)">B2 中高级</button>
        <button class="level-btn" data-level="C1" onclick="setLevel(this)">C1 高级</button>
    </div>

    <div class="scenes-grid" id="scenesGrid"></div>
</div>

<!-- ===== 语音气泡模式 ===== -->
<div class="page chat-page" id="chatPage">
    <div class="chat-header">
        <button class="chat-back" onclick="goHome()">← 返回</button>
        <div class="chat-scene-info">
            <div class="chat-scene-name" id="chatSceneName"></div>
            <div class="chat-scene-hint" id="chatSceneHint">💬 语音对话模式</div>
        </div>
        <div class="chat-score" id="chatScore">⭐ 0</div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <div class="input-mode-switch">
            <button class="input-mode-btn active" data-imode="voice" onclick="setInputMode(this)">🎤 语音</button>
            <button class="input-mode-btn" data-imode="text" onclick="setInputMode(this)">⌨️ 文字</button>
        </div>
        <div class="text-input-row hidden" id="textInputRow">
            <textarea class="chat-textarea" id="chatInput" placeholder="输入你的英文回复..." rows="1"></textarea>
            <button class="icon-btn send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
        <div class="voice-input-row" id="voiceInputRow">
            <button class="hold-to-talk" id="holdToTalk">
                <span class="mic-icon">🎤</span>
                <span class="mic-label">按住说话</span>
            </button>
        </div>
        <div class="recording-waveform" id="recordingWaveform">
            <div class="rec-bar"></div><div class="rec-bar"></div><div class="rec-bar"></div><div class="rec-bar"></div><div class="rec-bar"></div><div class="rec-bar"></div><div class="rec-bar"></div>
        </div>
        <div class="voice-input-hint" id="voiceHint">按住麦克风按钮开始录音，松开发送</div>
    </div>
</div>

<!-- ===== 模拟通话模式 ===== -->
<div class="page call-page" id="callPage">
    <div class="call-avatar-area">
        <div class="call-avatar" id="callAvatar">🤖</div>
    </div>
    <div class="call-name" id="callName">Dr. Wilson</div>
    <div class="call-status" id="callStatus">正在连接...</div>
    <div class="call-timer" id="callTimer">00:00</div>
    <div class="call-scene-label" id="callSceneLabel"></div>

    <div class="call-waveform" id="callWaveform"></div>

    <div class="call-controls">
        <button class="call-ctrl-btn call-mute-btn" id="callMuteBtn" onclick="toggleCallMute()">🎤</button>
        <button class="call-hangup-btn" id="callHangupBtn" onclick="hangUp()">📵</button>
        <button class="call-ctrl-btn call-speaker-btn" id="callSpeakerBtn" onclick="toggleCallSpeaker()">🔈</button>
    </div>

// ===== TTS 语音合成 =====
function speak(text, onEnd) {
    if (!('speechSynthesis' in window)) { onEnd && onEnd(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    u.pitch = 1.0;
    // 尝试选一个好听的英文声音
    const voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female'))
                 || voices.find(v => v.lang.startsWith('en-US'))
                 || voices.find(v => v.lang.startsWith('en'));
    if (enVoice) u.voice = enVoice;
    u.onend = () => { onEnd && onEnd(); };
    u.onerror = () => { onEnd && onEnd(); };
    window.speechSynthesis.speak(u);
    return u;
}

function initVoiceButton() {
    // 气泡模式
    const btn = document.getElementById('holdToTalk');
    if (btn) {

        btn.addEventListener('touchstart', onVoiceDown, { passive: false });

    // 通话模式
    const callBtn = document.getElementById('callVoiceBtn');
    if (callBtn) {
        callBtn.addEventListener('mousedown', onVoiceDown);
        callBtn.addEventListener('touchstart', onVoiceDown, { passive: false });

}

// 按下录音
function onVoiceDown(e) {
    if (e.cancelable && e.type === 'touchstart') e.preventDefault();
    startRecording();
    document.addEventListener('mouseup', onVoiceUp, { once: true });
    document.addEventListener('touchend', onVoiceUp, { once: true });
}

// 松开发送
function onVoiceUp(e) {
    if (e.cancelable && e.type === 'touchend') e.preventDefault();
    stopRecording();
}

// 生成语音波形条
function makeWaveBars(count) {
    let bars = '';
    for (let i=0; i<count; i++) {
        const h = 6 + Math.random()*14;
        const delay = (i*0.08).toFixed(2);
        bars += `<div class="voice-wave-bar" style="height:${h}px"></div>`;
    }
    return bars;
}

function addAIVoiceMessage(text, hint) {
    const container = document.getElementById('chatMessages');
    const duration = Math.max(2, Math.round(text.length/12));
    const msgId = 'msg_' + Date.now();

    const html = `
        <div class="message ai" id="${msgId}">
            <div class="msg-row">
                <div class="msg-avatar">🤖</div>
                <div>
                    <div class="voice-bubble" onclick="playVoiceMsg('${msgId}','${escapeAttr(text)}')">
                        <div class="voice-play-btn" id="${msgId}_playBtn">▶</div>
                        <div class="voice-waves" id="${msgId}_waves">${makeWaveBars(12)}</div>
                        <div class="voice-duration">${duration}"</div>
                    </div>
                    <div class="voice-text-toggle" onclick="toggleVoiceText('${msgId}')">📝 显示文字</div>
                    <div class="voice-transcript" id="${msgId}_text">${escapeHtml(text)}</div>
                    ${hint?`<div style="margin-top:4px;font-size:11px;color:#666;padding-left:4px;">💡 ${hint}</div>`:''}
                </div>
            </div>
        </div>`;
    container.insertAdjacentHTML('beforeend', html);
    scrollBottom();

    // 自动播放
    setTimeout(() => playVoiceMsg(msgId, text), 300);
    setTimeout(() => showSuggestions(text), 500);
}

function playVoiceMsg(msgId, text) {
    const btn = document.getElementById(msgId+'_playBtn');
    const waves = document.getElementById(msgId+'_waves');
    if (S.currentlyPlaying === msgId) {
        window.speechSynthesis.cancel();
        stopWaveAnim(btn, waves);
        S.currentlyPlaying = null;
        return;
    }
    // 停止上一个
    if (S.currentlyPlaying) {
        const prev = S.currentlyPlaying;
        const pb = document.getElementById(prev+'_playBtn');
        const pw = document.getElementById(prev+'_waves');
        if(pb) stopWaveAnim(pb,pw);
    }
    startWaveAnim(btn, waves);
    S.currentlyPlaying = msgId;
    speak(text, () => stopWaveAnim(btn, waves));
}

function startWaveAnim(btn, waves) {
    if(!btn||!waves) return;
    btn.classList.add('playing'); btn.textContent='⏸';
    waves.closest('.voice-bubble').classList.add('playing');
    waves.querySelectorAll('.voice-wave-bar').forEach(b => b.classList.add('active'));
}
function stopWaveAnim(btn, waves) {
    if(!btn||!waves) return;
    btn.classList.remove('playing'); btn.textContent='▶';
    waves.closest('.voice-bubble').classList.remove('playing');
    waves.querySelectorAll('.voice-wave-bar').forEach(b => b.classList.remove('active'));
}

function toggleVoiceText(msgId) {
    const el = document.getElementById(msgId+'_text');
    const toggle = el.previousElementSibling;
    if (el.classList.contains('show')) {
        el.classList.remove('show');
        toggle.textContent = '📝 显示文字';
    } else {
        el.classList.add('show');
        toggle.textContent = '📝 隐藏文字';
    }
}

    const lower = aiText.toLowerCase();
    let suggestions = ["That sounds good, thank you!","I understand, thanks.","Could you repeat that?"];
    for (const [key, vals] of Object.entries(SUGGESTION_MAP)) {
        if (lower.includes(key)) { suggestions = vals; break; }
    }
    const html = `<div class="msg-suggestions">${suggestions.map(s=>`<button class="suggestion-btn" onclick="useSuggestion('${escapeAttr(s)}')">${escapeHtml(s)}</button>`).join('')}</div>`;
    container.insertAdjacentHTML('beforeend', html);
    scrollBottom();
}

function useSuggestion(text) {
    if (S.callActive) {
        sendCallReplyWithText(text);
    } else if (S.inputMode === 'text') {
        document.getElementById('chatInput').value = text;
        sendMessage();
    } else {
        // 语音模式直接发送
        processUserInput(text);
    }
}

// ===== 发送消息 =====
function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text || !S.scene) return;
    input.value = ''; input.style.height = 'auto';
    addUserTextMessage(text);
    processUserInput(text);
}

function processUserInput(text) {
    const corrections = checkGrammar(text);
    const pts = 10 + (text.length>20?5:0) + (text.length>40?5:0) + (corrections.length===0?10:0);
    S.score += pts;
    document.getElementById('chatScore').textContent = `⭐ ${S.score}`;

    // 语音模式下也添加用户语音气泡
    if (S.mode !== 'call') addUserVoiceMessage(text);

    if (corrections.length > 0) setTimeout(() => showCorrections(corrections), 600);

    S.step++;
    const delay = corrections.length > 0 ? 1500 : 800;
    setTimeout(() => {
        if (S.step < S.scene.script.length) {
            const next = S.scene.script[S.step];
            if (S.callActive) {
                addCallAIReply(next.text, next.hint);
            } else {
                addAIVoiceMessage(next.text, next.hint);
            }
        } else {
            const endText = "Excellent! You've completed this conversation! 🎉";
            if (S.callActive) {
                addCallAIReply(endText);
                setTimeout(() => showCallCompletion(), 2000);
            } else {
                addAIVoiceMessage(endText);
                showCompletion();
            }
        }
    }, delay);
}

// ===== 录音 =====
function startRecording() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('浏览器不支持语音识别，请使用 Chrome'); return;
    }
    if (S.recording) return;
    S.recording = true;
    S.recordedText = '';
    S.userStopped = false;

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    S.recognition = new SR();
    S.recognition.lang = 'en-US';
    S.recognition.continuous = false;
    S.recognition.interimResults = true;

    const isCallMode = S.callActive;

    S.recognition.onstart = () => {
        if (isCallMode) {
            const btn = document.getElementById('callVoiceBtn');
            if (btn) btn.classList.add('recording');
            const hint = document.getElementById('callVoiceHint');
            if (hint) hint.textContent = '正在录音...松开发送';
        } else {
            const btn = document.getElementById('holdToTalk');
            if (btn) {
                btn.classList.add('recording');
                btn.querySelector('.mic-label').textContent = '松开发送';
                btn.querySelector('.mic-icon').textContent = '⏺';
            }
            const wf = document.getElementById('recordingWaveform');
            if (wf) wf.classList.add('show');
            const hint = document.getElementById('voiceHint');
            if (hint) hint.textContent = '正在录音...松开发送';
        }
    };

    // 保存所有中间和最终结果
    S.recognition.onresult = e => {
        let t = '';
        for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
        S.recordedText = t;
        if (isCallMode) {
            const hint = document.getElementById('callVoiceHint');
            if (hint) hint.textContent = t || '正在录音...';
        } else {
            const hint = document.getElementById('voiceHint');
            if (hint) hint.textContent = t || '正在录音...';
        }
    };

    S.recognition.onend = () => {
        stopRecordingUI();
        // 用户主动松开或自然结束，只要有文字就发送
        if (S.recordedText && S.recordedText.trim()) {
            if (isCallMode) {
                sendCallReplyWithText(S.recordedText.trim());
            } else {
                processUserInput(S.recordedText.trim());
            }
        } else if (S.userStopped) {
            if (isCallMode) {
                const hint = document.getElementById('callVoiceHint');
                if (hint) hint.textContent = '没有听清楚，请再说一次';
            } else {
                const hint = document.getElementById('voiceHint');
                if (hint) hint.textContent = '没有听清楚，请再说一次';
            }
        }
        S.recognition = null;
    };

    S.recognition.onerror = (err) => {
        console.log('Speech error:', err.error);
        stopRecordingUI();
        if (err.error === 'no-speech') {
            if (isCallMode) {
                const hint = document.getElementById('callVoiceHint');
                if (hint) hint.textContent = '没有听清楚，请再说一次';
            } else {
                const hint = document.getElementById('voiceHint');
                if (hint) hint.textContent = '没有听清楚，请再说一次';
            }
        }
        S.recognition = null;
    };

    S.recognition.start();
}

function stopRecording() {
    S.userStopped = true;
    if (S.recognition) {
        try { S.recognition.stop(); } catch(e) {}
    }
}

function stopRecordingUI() {
    S.recording = false;
    // 气泡模式
    const btn = document.getElementById('holdToTalk');
    if (btn) {
        btn.classList.remove('recording');
        btn.querySelector('.mic-label').textContent = '按住说话';
        btn.querySelector('.mic-icon').textContent = '🎤';
    }
    const wf = document.getElementById('recordingWaveform');
    if (wf) wf.classList.remove('show');
    const hint = document.getElementById('voiceHint');
    if (hint) hint.textContent = '按住麦克风按钮开始录音，松开发送';
    // 通话模式
    const callBtn = document.getElementById('callVoiceBtn');
    if (callBtn) callBtn.classList.remove('recording');
    const callHint = document.getElementById('callVoiceHint');
    if (callHint) callHint.textContent = '按住 🎤 说话，松开发送';
}

// ===== 语法检查 =====
function checkGrammar(text) {
    const c = [];
    GRAMMAR_RULES.forEach(r => { if (r.wrong.test(text)) c.push({wrong:text.match(r.wrong)[0],right:r.right,tip:r.tip}); });
    return c;
}

function showCorrections(corrections) {
    const container = document.getElementById('chatMessages');
    corrections.forEach(c => {
        container.insertAdjacentHTML('beforeend', `
            <div class="msg-correction">
                <div class="correction-label">✏️ 语法建议</div>
                <div class="correction-text"><span class="wrong">${escapeHtml(c.wrong)}</span> → <span class="right">${escapeHtml(c.right)}</span><br>💡 ${escapeHtml(c.tip)}</div>
            </div>`);
    });
    scrollBottom();
}

function showCompletion() {
    document.getElementById('chatMessages').insertAdjacentHTML('beforeend', `
        <div style="text-align:center;padding:20px;margin:12px 0;">
            <div style="font-size:36px;margin-bottom:10px;">🎉</div>
            <div style="font-size:18px;font-weight:700;margin-bottom:6px;">对话完成!</div>
            <div style="font-size:13px;color:#888;">得分：⭐ ${S.score} · ${S.scene.name}</div>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;">
                <button class="suggestion-btn" onclick="toggleVocab()" style="padding:10px 20px;font-size:13px;">📚 复习词汇</button>
                <button class="suggestion-btn" onclick="restartScene()" style="padding:10px 20px;font-size:13px;background:rgba(239,83,80,.1);color:#ef5350;border-color:rgba(239,83,80,.3);">🔄 再练一次</button>
                <button class="suggestion-btn" onclick="goHome()" style="padding:10px 20px;font-size:13px;background:rgba(102,187,106,.1);color:#66bb6a;border-color:rgba(102,187,106,.3);">🏠 换场景</button>
            </div>
        </div>`);
    scrollBottom();
}

function restartScene() { if (S.scene) startScene(S.scene.id); }

// ===== 模拟通话模式 =====
function initCallWaveform() {
    const wf = document.getElementById('callWaveform');
    let bars = '';
    for (let i=0;i<30;i++) bars += `<div class="call-wave-bar" id="cwb_${i}" style="height:4px"></div>`;
    wf.innerHTML = bars;
}

function animateCallWaveform(active) {
    for (let i=0;i<30;i++) {
        const bar = document.getElementById('cwb_'+i);
        if (active) {
            bar.style.height = (4+Math.random()*40)+'px';
            bar.style.background = '#667eea';
        } else {
            bar.style.height = '4px';
            bar.style.background = '#333';
        }
    }
}

function startCall() {
    S.scene = SCENES.find(s => s.id === (S.scene ? S.scene.id : 'cafe'));
    S.step = 0; S.score = 0; S.callActive = true; S.callTimerSec = 0;

    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('callPage').classList.add('active');
    document.getElementById('callName').textContent = S.scene.callName;
    document.getElementById('callSceneLabel').textContent = S.scene.name;
    document.getElementById('callStatus').textContent = '正在连接...';
    document.getElementById('callSubtitle').textContent = '等待接通...';
    document.getElementById('callSuggestions').innerHTML = '';

    // 通话计时
    S.callTimerInterval = setInterval(() => {
        S.callTimerSec++;
        const m = String(Math.floor(S.callTimerSec/60)).padStart(2,'0');
        const s = String(S.callTimerSec%60).padStart(2,'0');
        document.getElementById('callTimer').textContent = `${m}:${s}`;
    }, 1000);

    // 模拟接通
    setTimeout(() => {
        document.getElementById('callStatus').textContent = '通话中';
        renderVocab(S.scene.vocabulary);
        // AI 第一句
        addCallAIReply(S.scene.script[0].text, S.scene.script[0].hint);
    }, 1500);
}

function addCallAIReply(text, hint) {
    const sub = document.getElementById('callSubtitle');
    sub.textContent = '';
    sub.classList.add('speaking');
    document.getElementById('callAvatar').classList.add('speaking');

    // 逐字显示
    let idx = 0;
    const interval = setInterval(() => {
        sub.textContent += text[idx]; idx++;
        if (idx >= text.length) {
            clearInterval(interval);
            sub.classList.remove('speaking');
            document.getElementById('callAvatar').classList.remove('speaking');
            animateCallWaveform(false);
            // 显示建议
            if (hint) {
                const lower = text.toLowerCase();
                let suggestions = ["That sounds good, thank you!","I understand, thanks.","Could you repeat that?"];
                for (const [key, vals] of Object.entries(SUGGESTION_MAP)) {
                    if (lower.includes(key)) { suggestions = vals; break; }
                }
                document.getElementById('callSuggestions').innerHTML =
                    suggestions.map(s=>`<button class="suggestion-btn" onclick="sendCallReplyWithText('${escapeAttr(s)}')">${escapeHtml(s)}</button>`).join('');
            }
        }
    }, 50);

    // TTS 语音播放
    speak(text);
    animateCallWaveform(true);
}

function sendCallReply() {
    const input = document.getElementById('callReplyInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendCallReplyWithText(text);
}

function sendCallReplyWithText(text) {
    if (!S.callActive) return;
    document.getElementById('callReplyInput').value = '';
    document.getElementById('callSuggestions').innerHTML = '';

    // 显示用户回复在字幕区
    const sub = document.getElementById('callSubtitle');
    sub.textContent = `🧑 You: ${text}`;
    sub.classList.remove('speaking');

    // 语法检测
    const corrections = checkGrammar(text);
    const pts = 10 + (text.length>20?5:0) + (text.length>40?5:0) + (corrections.length===0?10:0);
    S.score += pts;

    if (corrections.length > 0) {
        const c = corrections[0];
        sub.textContent += `\n\n✏️ ${c.wrong} → ${c.right} (${c.tip})`;
    }

    // AI 回复
    S.step++;
    setTimeout(() => {
        if (S.step < S.scene.script.length) {
            const next = S.scene.script[S.step];
            addCallAIReply(next.text, next.hint);
        } else {
            addCallAIReply("Excellent! You've completed this call! 🎉");
            setTimeout(() => showCallCompletion(), 3000);
        }
    }, 1500);
}

function showCallCompletion() {
    const sub = document.getElementById('callSubtitle');
    sub.innerHTML = `<div style="font-size:24px;margin-bottom:8px;">🎉</div>通话完成!<br>得分：⭐ ${S.score} · 通话时长：${formatTime(S.callTimerSec)}`;
    document.getElementById('callSuggestions').innerHTML = `
        <button class="suggestion-btn" onclick="toggleVocab()" style="padding:8px 16px;">📚 词汇</button>
        <button class="suggestion-btn" onclick="hangUp();setTimeout(()=>startScene('${S.scene.id}'),500)" style="padding:8px 16px;background:rgba(239,83,80,.1);color:#ef5350;border-color:rgba(239,83,80,.3);">🔄 再打一次</button>
        <button class="suggestion-btn" onclick="hangUp()" style="padding:8px 16px;background:rgba(102,187,106,.1);color:#66bb6a;border-color:rgba(102,187,106,.3);">🏠 返回</button>`;
}

function hangUp() {
    window.speechSynthesis.cancel();
    S.callActive = false;
    if (S.callTimerInterval) { clearInterval(S.callTimerInterval); S.callTimerInterval=null; }
    goHome();
}

function toggleCallMute() {
    S.isCallMuted = !S.isCallMuted;
    const btn = document.getElementById('callMuteBtn');
    btn.classList.toggle('muted', S.isCallMuted);
    btn.textContent = S.isCallMuted ? '🔇' : '🎤';
}

function toggleCallSpeaker() {
    const btn = document.getElementById('callSpeakerBtn');
    btn.classList.toggle('active');
    btn.textContent = btn.classList.contains('active') ? '🔊' : '🔈';
}

function formatTime(sec) {
    return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}

// ===== 词汇面板 =====
function renderVocab(vocab) {
    document.getElementById('vocabList').innerHTML = vocab.map(v => `
        <div class="vocab-item" onclick="speak('${v.word}')">
            <div class="vocab-word">${v.word} <button class="vocab-speak" onclick="event.stopPropagation();speak('${v.word}')">▶</button></div>
            <div class="vocab-phonetic">${v.phonetic}</div>
            <div class="vocab-meaning">${v.meaning}</div>
        </div>`).join('');
}

function toggleVocab() { document.getElementById('vocabPanel').classList.toggle('open'); }

// ===== 工具 =====
function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escapeAttr(s) { return s.replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function scrollBottom() {
    const c = document.getElementById('chatMessages');
    if(c) setTimeout(()=>{c.scrollTop=c.scrollHeight;},50);
}

init();
</script>
