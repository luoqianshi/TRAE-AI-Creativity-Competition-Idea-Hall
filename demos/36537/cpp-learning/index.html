<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Mastery Path - 沉浸式编程学习平台</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/fold/foldgutter.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- 顶部导航栏 -->
        <header id="top-nav" class="navbar">
            <div class="navbar-content">
                <div class="navbar-left">
                    <button class="sidebar-toggle-btn" id="toggle-sidebar-btn-mobile" aria-label="切换侧边栏">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 12h18M3 6h18M3 18h18"/>
                        </svg>
                    </button>
                    <div class="logo">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                            <path d="M2 17l10 5 10-5"/>
                            <path d="M2 12l10 5 10-5"/>
                        </svg>
                        <span class="logo-text">C++ Mastery Path</span>
                    </div>
                </div>
                <nav class="navbar-center">
                    <a href="index.html" class="nav-item active" id="nav-home">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        </svg>
                        <span>首页</span>
                    </a>
                    <a href="progress.html" class="nav-item" id="nav-progress">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
                        </svg>
                        <span>进度</span>
                    </a>
                    <a href="achievements.html" class="nav-item" id="nav-achievements">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="8" r="7"/>
                            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
                        </svg>
                        <span>成就</span>
                    </a>
                    <button class="nav-item settings-nav-btn" id="settings-btn" aria-label="设置">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        <span>设置</span>
                    </button>
                </nav>
                <div class="navbar-right"></div>
            </div>
        </header>

        <!-- 左侧目录 -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-progress">
                    <div class="progress-ring-container">
                        <svg class="progress-ring" viewBox="0 0 80 80">
                            <circle class="progress-ring-bg" cx="40" cy="40" r="36" fill="none" stroke-width="4"/>
                            <circle class="progress-ring-fill" cx="40" cy="40" r="36" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="226"/>
                        </svg>
                        <span class="progress-text" id="progress-text">0%</span>
                    </div>
                    <div class="progress-info">
                        <div class="progress-label">总体进度</div>
                        <div class="xp-bar-wrapper">
                            <div class="xp-bar-bg">
                                <div class="xp-bar-fill" id="xp-bar"></div>
                            </div>
                        </div>
                        <div class="level-info" id="xp-level">等级 1 - 代码学徒</div>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div id="nav-tree" class="nav-tree"></div>
            </nav>
            <div class="sidebar-footer">
                <div class="search-box-wrapper">
                    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input id="search-box" type="text" placeholder="搜索课程、术语... (Ctrl+K)" class="search-box" />
                </div>
                <div class="sidebar-stats">
                    <div class="stat-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z"/>
                        </svg>
                        <span>连续 <span id="streak-count">0</span> 天</span>
                    </div>
                    <div class="stat-item">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        <span><span id="total-xp">0</span> XP</span>
                    </div>
                </div>
            </div>
            <button class="sidebar-collapse-btn" id="toggle-sidebar-btn" aria-label="收起侧边栏">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
        </aside>
        <div id="sidebar-overlay" class="sidebar-overlay"></div>

        <!-- 中央主学习区 -->
        <main id="main-content" class="main-content" role="main">
            <div class="lesson-header">
                <div class="lesson-breadcrumb">
                    <a href="#" id="breadcrumb-home" class="breadcrumb-link">C++ Mastery Path</a>
                    <span class="breadcrumb-separator">/</span>
                    <a href="#" id="breadcrumb-unit" class="breadcrumb-link">单元 1</a>
                    <span class="breadcrumb-separator">/</span>
                    <span id="breadcrumb-lesson" class="breadcrumb-active">第 1 课</span>
                </div>
                <h1 id="lesson-title" class="lesson-title"></h1>
                <div class="lesson-meta">
                    <span class="meta-tag duration" id="lesson-duration"></span>
                    <span class="meta-tag difficulty" id="lesson-difficulty"></span>
                    <span class="meta-tag xp" id="lesson-xp"></span>
                </div>
            </div>
            <div id="lesson-content" class="lesson-content" role="region" aria-label="课程内容"></div>
            <div class="lesson-nav">
                <button id="prev-lesson-btn" class="nav-btn prev-btn" disabled aria-label="上一课">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 19l-7-7 7-7"/>
                    </svg>
                    <span>上一课</span>
                </button>
                <button id="next-lesson-btn" class="nav-btn next-btn" disabled aria-label="下一课">
                    <span>下一课</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </main>

        <!-- 右侧面板 -->
        <aside id="right-panel" class="right-panel" role="complementary">
            <div id="panel-tabs" class="panel-tabs" role="tablist">
                <button class="panel-tab active" data-tab="notes" role="tab" aria-selected="true">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                    </svg>
                    <span>笔记</span>
                </button>
                <button class="panel-tab" data-tab="assistant" role="tab" aria-selected="false">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>助手</span>
                </button>
                <button class="panel-tab" data-tab="references" role="tab" aria-selected="false">
                    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                    <span>参考</span>
                </button>
            </div>
            <div class="panel-content">
                <div id="notes-section" class="panel-section active" role="tabpanel">
                    <textarea id="notes-textarea" class="notes-textarea" placeholder="在此记录你的学习笔记..." aria-label="笔记编辑器"></textarea>
                    <div id="notes-preview" class="notes-preview" aria-live="polite"></div>
                    <div class="notes-actions">
                        <button class="btn btn-secondary" id="preview-notes-btn">预览</button>
                        <button class="btn btn-primary" id="save-notes-btn">保存</button>
                    </div>
                </div>
                <div id="assistant-section" class="panel-section" role="tabpanel">
                    <div id="assistant-messages" class="assistant-messages" role="log" aria-live="polite"></div>
                    <div class="assistant-input-container">
                        <input id="assistant-input" type="text" class="assistant-input" placeholder="输入你的问题..." aria-label="助手输入" />
                        <button class="btn btn-primary" id="assistant-send-btn">发送</button>
                    </div>
                    <div class="quick-tips">
                        <div class="quick-tips-title">当前课程提示</div>
                        <ul class="quick-tips-list" id="quick-tips-list"></ul>
                    </div>
                </div>
                <div id="references-section" class="panel-section" role="tabpanel">
                    <div id="references-container" class="references-container"></div>
                </div>
            </div>
        </aside>
        <button id="toggle-panel-btn" class="panel-toggle-btn" aria-label="切换面板">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"/>
            </svg>
        </button>

        <!-- 设置弹窗 -->
        <div id="settings-overlay" class="overlay"></div>
        <div id="settings-modal" class="modal" role="dialog" aria-label="设置">
            <div class="modal-header">
                <h2 class="modal-title">设置</h2>
                <button id="settings-close" class="modal-close" aria-label="关闭设置">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-content">
                <div class="modal-section">
                    <h3 class="section-title">主题设置</h3>
                    <div class="theme-options">
                        <button class="theme-option" data-theme="dark" title="深色模式">
                            <div class="theme-preview dark-preview"></div>
                            <span>深色模式</span>
                        </button>
                        <button class="theme-option" data-theme="light" title="浅色模式">
                            <div class="theme-preview light-preview"></div>
                            <span>浅色模式</span>
                        </button>
                        <button class="theme-option" data-theme="eye-care" title="护眼模式">
                            <div class="theme-preview eye-care-preview"></div>
                            <span>护眼模式</span>
                        </button>
                    </div>
                </div>
                <div class="modal-section">
                    <h3 class="section-title">数据管理</h3>
                    <button class="btn btn-error danger-btn full-width-btn" id="reset-all-data-btn">重置所有文件</button>
                    <p class="reset-warning">此操作将清除所有学习进度、笔记和成就，且无法撤销</p>
                </div>
            </div>
        </div>

        <!-- 确认对话框 -->
        <div id="confirm-overlay" class="overlay"></div>
        <div id="confirm-modal" class="modal confirm-modal" role="dialog" aria-label="确认操作">
            <div class="modal-header">
                <h2 class="modal-title">确认重置</h2>
                <button id="confirm-close" class="modal-close" aria-label="关闭">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-content">
                <div class="confirm-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <p class="confirm-message">确定要重置所有文件吗？此操作将清除所有学习进度、笔记和成就，且无法撤销。</p>
                <div class="confirm-actions">
                    <button class="btn btn-secondary" id="confirm-cancel">取消</button>
                    <button class="btn btn-error" id="confirm-ok">确认重置</button>
                </div>
            </div>
        </div>

        <!-- 成就弹窗 -->
        <div id="achievement-overlay" class="achievement-overlay" role="dialog" aria-modal="true" aria-labelledby="achievement-title">
            <div class="achievement-card">
                <div class="achievement-icon" id="achievement-icon"></div>
                <h2 class="achievement-title" id="achievement-title"></h2>
                <p class="achievement-description" id="achievement-description"></p>
                <div class="achievement-xp" id="achievement-xp"></div>
                <button class="btn btn-primary achievement-btn" id="achievement-close-btn">太棒了！</button>
            </div>
        </div>

        <!-- 搜索弹窗 -->
        <div id="search-modal-overlay" class="overlay"></div>
        <div id="search-modal" class="modal search-modal" role="dialog" aria-label="全局搜索">
            <div class="modal-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input id="search-modal-input" type="text" class="search-input" placeholder="搜索课程、术语、代码..." aria-label="搜索" />
                <span class="search-shortcut">Ctrl+K</span>
            </div>
            <div id="search-modal-results" class="search-results" role="listbox"></div>
            <div id="search-modal-empty" class="search-empty">没有找到匹配的结果</div>
        </div>

        <!-- 庆祝动画容器 -->
        <div id="celebration-overlay" class="celebration-overlay"></div>

        <!-- 计时器容器 -->
        <div id="timer-container" class="timer-container" role="timer" aria-label="学习计时器">
            <div class="timer-header">
                <span class="timer-title">学习计时器</span>
                <button id="timer-minimize-btn" class="timer-minimize-btn" aria-label="最小化计时器">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 19h12V5H6v14z"/>
                    </svg>
                </button>
            </div>
            <div class="timer-display">
                <div class="timer-time" id="timer-time" aria-live="polite">25:00</div>
                <div class="timer-progress-bar">
                    <div class="timer-progress-fill" id="timer-progress"></div>
                </div>
            </div>
            <div class="timer-controls">
                <button id="timer-decrease-btn" class="timer-btn" aria-label="减少1分钟">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 13H5"/>
                    </svg>
                </button>
                <button id="timer-start-btn" class="timer-btn primary">开始</button>
                <button id="timer-pause-btn" class="timer-btn secondary" disabled>暂停</button>
                <button id="timer-reset-btn" class="timer-btn">重置</button>
                <button id="timer-increase-btn" class="timer-btn" aria-label="增加1分钟">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                </button>
            </div>
            <div class="timer-status" id="timer-status">准备开始</div>
        </div>

        <!-- 可拖拽的计时器球体（最小化状态） -->
        <div id="timer-sphere" class="timer-sphere" draggable="true" aria-label="拖拽计时器" title="双击展开计时器">
            <div class="sphere-time" id="sphere-time">25:00</div>
            <div class="sphere-progress-ring">
                <svg viewBox="0 0 60 60">
                    <circle cx="30" cy="30" r="26" fill="none" stroke="currentColor" stroke-width="3" class="sphere-ring-bg"/>
                    <circle cx="30" cy="30" r="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="163" class="sphere-ring-fill" id="sphere-ring-fill"/>
                </svg>
            </div>
            <div class="sphere-pulse" id="sphere-pulse"></div>
        </div>

        <!-- 移动端底部导航 -->
        <nav id="mobile-nav" class="mobile-nav" aria-label="移动端导航">
            <button class="mobile-nav-item active" id="mobile-nav-home" aria-label="首页">
                <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
                <span class="mobile-nav-label">首页</span>
            </button>
            <button class="mobile-nav-item" id="mobile-nav-progress" aria-label="进度">
                <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
                </svg>
                <span class="mobile-nav-label">进度</span>
            </button>
            <button class="mobile-nav-item" id="mobile-nav-settings" aria-label="设置">
                <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
                <span class="mobile-nav-label">设置</span>
            </button>
        </nav>
    </div>

    <!-- 外部脚本依赖 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.2/marked.min.js"></script>
    
    <!-- 应用模块 -->
    <script src="modules/data-store.js"></script>
    <script src="data/xp-table.js"></script>
    <script src="data/learning-days.js"></script>
    
    <!-- 单元数据文件 -->
    <script src="data/unit1-data.js"></script>
    <script src="data/unit2-data.js"></script>
    <script src="data/unit3-data.js"></script>
    <script src="data/unit4-data.js"></script>
    <script src="data/unit5-data.js"></script>
    <script src="data/unit6-data.js"></script>
    <script src="data/unit7-data.js"></script>
    <script src="data/unit8-data.js"></script>
    <script src="data/unit9-data.js"></script>
    <script src="data/unit10-data.js"></script>
    <script src="data/unit11-data.js"></script>
    <script src="data/unit12-data.js"></script>
    <script src="data/unit13-data.js"></script>
    <script src="data/unit14-data.js"></script>
    <script src="data/unit15-data.js"></script>
    <script src="data/unit16-data.js"></script>
    <script src="data/unit17-data.js"></script>
    <script src="data/unit18-data.js"></script>
    <script src="data/unit19-data.js"></script>
    <script src="data/unit20-data.js"></script>
    <script src="data/unit21-data.js"></script>
    <script src="data/unit22-data.js"></script>
    <script src="data/unit23-data.js"></script>
    <script src="data/unit24-data.js"></script>
    <script src="data/unit25-data.js"></script>
    <script src="data/unit26-data.js"></script>
    <script src="data/unit27-data.js"></script>
    
    <!-- 课程数据（整合所有单元） -->
    <script src="data/course-data.js"></script>
    
    <!-- 核心模块 -->
    <script src="modules/achievements.js"></script>
    <script src="modules/quiz-engine.js"></script>
    <script src="modules/compiler-api.js"></script>
    <script src="app.js"></script>
    
    <!-- 初始化课程数据 -->
    <script>
        if (typeof CourseData !== 'undefined' && typeof CourseData.init === 'function') {
            CourseData.init();
        }
    </script>
</body>
</html
