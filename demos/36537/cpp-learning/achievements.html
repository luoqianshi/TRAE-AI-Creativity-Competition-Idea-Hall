<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就系统 - C++ Mastery Path</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .achievements-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .achievements-header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .achievements-header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .achievements-header h1 svg {
            color: var(--accent-warning);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            transition: all var(--transition-fast);
        }

        .back-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .achievements-stats {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .achievements-stats-content {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-warning);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .achievements-container {
            flex: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            overflow-y: auto;
        }

        .achievements-content {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .achievement-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 20px;
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
        }

        .achievement-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-color-hover);
        }

        .achievement-card.unlocked {
            border-color: rgba(255, 215, 0, 0.4);
        }

        .achievement-card.locked {
            opacity: 0.6;
        }

        .achievement-card.unlocked::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-warning), #ffb700);
        }

        .achievement-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-normal);
        }

        .achievement-card.unlocked .achievement-icon {
            background: linear-gradient(135deg, var(--accent-warning), #ffb700);
        }

        .achievement-icon svg {
            width: 32px;
            height: 32px;
            color: var(--text-secondary);
        }

        .achievement-card.unlocked .achievement-icon svg {
            color: white;
        }

        .achievement-card.locked .achievement-icon svg {
            filter: grayscale(100%);
        }

        .achievement-title {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
        }

        .achievement-description {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .achievement-xp {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: rgba(210, 153, 34, 0.1);
            border-radius: var(--radius-button);
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-warning);
            margin: 0 auto;
            display: table;
        }

        .achievement-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .status-badge.unlocked {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-success);
        }

        .status-badge.locked {
            background: rgba(139, 148, 158, 0.2);
            color: var(--text-secondary);
        }

        .unlock-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .achievement-progress {
            margin-top: 12px;
            display: none;
        }

        .achievement-card.locked .achievement-progress {
            display: block;
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-editor);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-success));
            border-radius: 3px;
            transition: width var(--transition-normal);
        }

        .progress-text {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .category-tab {
            padding: 6px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .category-tab:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .category-tab.active {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        @media (max-width: 768px) {
            .achievements-stats-content {
                grid-template-columns: repeat(3, 1fr);
            }

            .stat-value {
                font-size: 20px;
            }

            .achievements-header h1 {
                font-size: 20px;
            }

            .back-btn span {
                display: none;
            }

            .achievements-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="achievements-header">
        <div class="achievements-header-content">
            <h1>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="7"/>
                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
                </svg>
                成就系统
            </h1>
            <a href="index.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>返回首页</span>
            </a>
        </div>
    </div>

    <div class="achievements-stats">
        <div class="achievements-stats-content">
            <div class="stat-card">
                <div class="stat-value" id="total-achievements">0</div>
                <div class="stat-label">总成就数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="unlocked-achievements">0</div>
                <div class="stat-label">已解锁</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="achievements-xp">0</div>
                <div class="stat-label">成就XP</div>
            </div>
        </div>
    </div>

    <div class="achievements-container">
        <div class="category-tabs" id="category-tabs">
            <button class="category-tab active" data-category="all">全部</button>
            <button class="category-tab" data-category="lesson">课程</button>
            <button class="category-tab" data-category="streak">连续学习</button>
            <button class="category-tab" data-category="completion">完成</button>
            <button class="category-tab" data-category="special">特殊</button>
        </div>

        <div class="achievements-content" id="achievements-grid">
            <!-- 动态生成成就卡片 -->
        </div>
    </div>

    <script src="modules/data-store.js"></script>
    <script src="modules/achievements.js"></script>

    <script>
        let achievementsData = [];
        let unlockedAchievements = [];
        let currentCategory = 'all';

        async function init() {
            await DataStore.init();
            await Achievements.init();
            
            achievementsData = Object.values(Achievements.ACHIEVEMENTS);
            unlockedAchievements = await Achievements.getUnlockedAchievements();
            
            renderAchievements();
            updateStats();
            setupEventListeners();
        }

        function renderAchievements() {
            const container = document.getElementById('achievements-grid');
            if (!container) return;

            const filteredAchievements = currentCategory === 'all' 
                ? achievementsData 
                : achievementsData.filter(a => a.category === currentCategory);

            let html = '';
            filteredAchievements.forEach(achievement => {
                const isUnlocked = unlockedAchievements.includes(achievement.id);
                const unlockDate = isUnlocked ? getUnlockDate(achievement.id) : null;
                
                html += `
                    <div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                ${Achievements.getAchievementIcon(achievement.icon)}
                            </svg>
                        </div>
                        <div class="achievement-title">${achievement.title}</div>
                        <div class="achievement-description">${achievement.description}</div>
                        <div class="achievement-xp">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                            </svg>
                            +${achievement.xp || 50} XP
                        </div>
                        <div class="achievement-status">
                            <span class="status-badge ${isUnlocked ? 'unlocked' : 'locked'}">
                                ${isUnlocked ? '已解锁' : '未解锁'}
                            </span>
                            ${unlockDate ? `<span class="unlock-date">${unlockDate}</span>` : ''}
                        </div>
                        <div class="achievement-progress">
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${getProgress(achievement)}%"></div>
                            </div>
                            <div class="progress-text">${getProgressText(achievement)}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function getUnlockDate(achievementId) {
            const date = localStorage.getItem(`achievement_unlock_${achievementId}`);
            if (date) {
                const d = new Date(parseInt(date));
                return `${d.getMonth() + 1}/${d.getDate()}`;
            }
            return null;
        }

        function getProgress(achievement) {
            if (!achievement.progress) return 0;
            const stats = {
                totalAttempts: parseInt(localStorage.getItem('stats_totalAttempts') || '0'),
                streak: parseInt(localStorage.getItem('stats_streak') || '0'),
                completedLessons: parseInt(localStorage.getItem('stats_completedLessons') || '0'),
                totalXP: parseInt(localStorage.getItem('stats_totalXP') || '0'),
                daysVisited: parseInt(localStorage.getItem('stats_daysVisited') || '0')
            };
            return Math.min(100, achievement.progress(stats));
        }

        function getProgressText(achievement) {
            if (!achievement.progressText) return '';
            const stats = {
                totalAttempts: parseInt(localStorage.getItem('stats_totalAttempts') || '0'),
                streak: parseInt(localStorage.getItem('stats_streak') || '0'),
                completedLessons: parseInt(localStorage.getItem('stats_completedLessons') || '0'),
                totalXP: parseInt(localStorage.getItem('stats_totalXP') || '0'),
                daysVisited: parseInt(localStorage.getItem('stats_daysVisited') || '0')
            };
            return achievement.progressText(stats);
        }

        function updateStats() {
            document.getElementById('total-achievements').textContent = achievementsData.length;
            document.getElementById('unlocked-achievements').textContent = unlockedAchievements.length;
            
            const totalXP = achievementsData
                .filter(a => unlockedAchievements.includes(a.id))
                .reduce((sum, a) => sum + (a.xp || 50), 0);
            document.getElementById('achievements-xp').textContent = totalXP;
        }

        function setupEventListeners() {
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentCategory = tab.dataset.category;
                    renderAchievements();
                });
            });
        }

        init();
    </script>
</body>
</html>
