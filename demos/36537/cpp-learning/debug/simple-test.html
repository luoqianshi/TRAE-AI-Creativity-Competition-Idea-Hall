<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>最简单测试</title>
</head>
<body>
    <h1>测试 CourseData</h1>
    <pre id="output">加载中...</pre>
    
    <script src="course-data.js"></script>
    <script>
        var out = document.getElementById('output');
        
        if (typeof CourseData === 'undefined') {
            out.textContent = '错误: CourseData 未定义';
            out.style.color = 'red';
        } else {
            out.style.color = 'green';
            out.textContent = '成功! CourseData 已定义\n\n';
            out.textContent += '单元数量: ' + CourseData.units.length + '\n';
            out.textContent += '单元列表:\n';
            for (var i = 0; i < CourseData.units.length; i++) {
                var unit = CourseData.units[i];
                out.textContent += '  - 单元' + unit.id + ': ' + unit.title + ' (' + unit.lessons.length + '节课)\n';
            }
            
            var lesson = CourseData.getLessonById(1, '1.1');
            if (lesson) {
                out.textContent += '\n测试 getLessonById(1, "1.1"): 成功';
                out.textContent += '\n  标题: ' + lesson.title;
            } else {
                out.textContent += '\n测试 getLessonById(1, "1.1"): 失败';
            }
        }
    </script>
</body>
</html>
