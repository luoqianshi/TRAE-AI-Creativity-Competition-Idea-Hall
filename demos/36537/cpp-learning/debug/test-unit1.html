<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试 Unit1Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a2e; color: #fff; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>测试 Unit1Data</h1>
    
    <script src="unit1-data.js"></script>
    
    <script>
        document.write('<h2>检查 Unit1Data 变量</h2>');
        
        if (typeof Unit1Data !== 'undefined') {
            document.write('<p class="success">✅ Unit1Data 已定义</p>');
            document.write('<p>类型: ' + typeof Unit1Data + '</p>');
            
            if (Unit1Data.id) {
                document.write('<p class="success">✅ id: ' + Unit1Data.id + '</p>');
            } else {
                document.write('<p class="error">❌ id 缺失</p>');
            }
            
            if (Unit1Data.title) {
                document.write('<p class="success">✅ title: ' + Unit1Data.title + '</p>');
            } else {
                document.write('<p class="error">❌ title 缺失</p>');
            }
            
            if (Unit1Data.lessons && Array.isArray(Unit1Data.lessons)) {
                document.write('<p class="success">✅ lessons 是数组，长度: ' + Unit1Data.lessons.length + '</p>');
                if (Unit1Data.lessons.length > 0) {
                    document.write('<p>第一节课: ' + Unit1Data.lessons[0].title + '</p>');
                }
            } else {
                document.write('<p class="error">❌ lessons 不是数组或未定义</p>');
            }
            
            // 打印完整对象
            document.write('<h2>Unit1Data 对象内容</h2>');
            document.write('<pre>' + JSON.stringify(Unit1Data, null, 2) + '</pre>');
            
        } else {
            document.write('<p class="error">❌ Unit1Data 未定义</p>');
        }
        
        // 检查 window.Unit1Data
        document.write('<h2>检查 window.Unit1Data</h2>');
        if (typeof window.Unit1Data !== 'undefined') {
            document.write('<p class="success">✅ window.Unit1Data 已定义</p>');
        } else {
            document.write('<p class="error">❌ window.Unit1Data 未定义</p>');
        }
    </script>
</body>
</html>
