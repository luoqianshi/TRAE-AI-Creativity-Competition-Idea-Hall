<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>C++学习 - 简化版</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #fff; }
        .unit { background: #16213e; padding: 20px; margin: 10px; border-radius: 8px; }
        .lesson { background: #0f3460; padding: 10px; margin: 5px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>C++学习路径</h1>
    
    <script>
        // 简化版单元数据
        const Unit1Data = { id: 1, title: '环境、编译与第一个程序', lessons: [
            { id: '1.1', title: 'C++简史与标准演化', difficulty: '入门' },
            { id: '1.2', title: '编译过程', difficulty: '基础' },
            { id: '1.3', title: 'Hello World详解', difficulty: '入门' }
        ]};
        window.Unit1Data = Unit1Data;
        
        const Unit2Data = { id: 2, title: '变量与基本数据类型', lessons: [
            { id: '2.1', title: '基本类型', difficulty: '入门' },
            { id: '2.2', title: '变量定义与初始化', difficulty: '入门' }
        ]};
        window.Unit2Data = Unit2Data;
    </script>
    
    <script src="course-data.js"></script>
    
    <script>
        function renderUnits() {
            const container = document.createElement('div');
            
            if (CourseData && CourseData.units && CourseData.units.length > 0) {
                CourseData.units.forEach(unit => {
                    const unitDiv = document.createElement('div');
                    unitDiv.className = 'unit';
                    unitDiv.innerHTML = '<h2>单元' + unit.id + ': ' + unit.title + '</h2>';
                    
                    unit.lessons.forEach(lesson => {
                        const lessonDiv = document.createElement('div');
                        lessonDiv.className = 'lesson';
                        lessonDiv.innerHTML = lesson.id + ' - ' + lesson.title + ' (' + lesson.difficulty + ')';
                        unitDiv.appendChild(lessonDiv);
                    });
                    
                    container.appendChild(unitDiv);
                });
            } else {
                container.innerHTML = '<p style="color:red">CourseData.units 为空!</p>';
            }
            
            document.body.appendChild(container);
        }
        
        renderUnits();
    </script>
</body>
</html>
