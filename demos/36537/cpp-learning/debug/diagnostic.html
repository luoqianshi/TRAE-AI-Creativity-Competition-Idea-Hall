<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>诊断测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>C++ Mastery Path 诊断测试</h1>
    <div id="log"></div>
    
    <script>
        function log(msg, type) {
            var div = document.createElement('div');
            div.className = type || 'info';
            div.innerHTML = msg;
            document.getElementById('log').appendChild(div);
        }
    </script>
    
    <script src="data-store.js" onerror="log('data-store.js 加载失败', 'error')"></script>
    <script src="xp-table.js" onerror="log('xp-table.js 加载失败', 'error')"></script>
    
    <script>
        log('检查基础模块...');
        log('DataStore: ' + (typeof DataStore !== 'undefined' ? 'OK' : '未定义'), typeof DataStore !== 'undefined' ? 'success' : 'error');
        log('XPTable: ' + (typeof XPTable !== 'undefined' ? 'OK' : '未定义'), typeof XPTable !== 'undefined' ? 'success' : 'error');
    </script>
    
    <script src="unit1-data.js" onerror="log('unit1-data.js 加载失败', 'error')"></script>
    <script src="unit2-data.js" onerror="log('unit2-data.js 加载失败', 'error')"></script>
    <script src="unit3-data.js" onerror="log('unit3-data.js 加载失败', 'error')"></script>
    
    <script>
        log('<br>检查单元数据...');
        for (var i = 1; i <= 3; i++) {
            var varName = 'Unit' + i + 'Data';
            if (typeof window[varName] !== 'undefined') {
                log(varName + ': OK (课程数: ' + window[varName].lessons.length + ')', 'success');
            } else {
                log(varName + ': 未定义', 'error');
            }
        }
    </script>
    
    <script src="course-data.js" onerror="log('course-data.js 加载失败', 'error')"></script>
    
    <script>
        log('<br>检查CourseData...');
        if (typeof CourseData !== 'undefined') {
            log('CourseData: OK', 'success');
            log('单元数量: ' + CourseData.units.length, 'info');
            if (CourseData.units.length > 0) {
                log('第一个单元: ' + CourseData.units[0].title, 'info');
            }
        } else {
            log('CourseData: 未定义', 'error');
        }
    </script>
</body>
</html>
