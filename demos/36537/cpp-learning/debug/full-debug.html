<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>完整调试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a2e; color: #fff; font-size: 14px; }
        .log { margin: 5px 0; padding: 8px; border-radius: 4px; }
        .success { background: rgba(0,255,0,0.1); color: #0f0; }
        .error { background: rgba(255,0,0,0.1); color: #f00; }
        .info { background: rgba(0,0,255,0.1); color: #0ff; }
        .warning { background: rgba(255,255,0,0.1); color: #ff0; }
        pre { background: #0f0f1a; padding: 10px; border-radius: 4px; overflow-x: auto; max-width: 100%; white-space: pre-wrap; }
        h1, h2 { color: #fff; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>C++ Mastery Path - 完整调试</h1>
    
    <div id="log"></div>
    
    <script>
        function log(msg, type) {
            const div = document.createElement('div');
            div.className = 'log ' + (type || 'info');
            div.innerHTML = msg;
            document.getElementById('log').appendChild(div);
            console.log(msg);
        }
        
        function logPre(msg) {
            const pre = document.createElement('pre');
            pre.textContent = msg;
            document.getElementById('log').appendChild(pre);
            console.log(msg);
        }
        
        log('=== 开始调试 ===', 'info');
    </script>
    
    <!-- 加载所有模块 -->
    <script src="data-store.js" onerror="log('❌ data-store.js 加载失败', 'error')"></script>
    <script>log('✅ data-store.js 已加载', 'success');</script>
    
    <script src="xp-table.js" onerror="log('❌ xp-table.js 加载失败', 'error')"></script>
    <script>log('✅ xp-table.js 已加载', 'success');</script>
    
    <script src="course-data.js" onerror="log('❌ course-data.js 加载失败', 'error')"></script>
    <script>log('✅ course-data.js 已加载', 'success');</script>
    
    <script src="achievements.js" onerror="log('❌ achievements.js 加载失败', 'error')"></script>
    <script>log('✅ achievements.js 已加载', 'success');</script>
    
    <script src="quiz-engine.js" onerror="log('❌ quiz-engine.js 加载失败', 'error')"></script>
    <script>log('✅ quiz-engine.js 已加载', 'success');</script>
    
    <script src="compiler-api.js" onerror="log('❌ compiler-api.js 加载失败', 'error')"></script>
    <script>log('✅ compiler-api.js 已加载', 'success');</script>
    
    <script src="app.js" onerror="log('❌ app.js 加载失败', 'error')"></script>
    <script>log('✅ app.js 已加载', 'success');</script>
    
    <script>
        log('<br>=== 检查所有模块 ===', 'info');
        
        // 检查 DataStore
        if (typeof DataStore !== 'undefined') {
            log('✅ DataStore 已定义', 'success');
            log('   - init: ' + (typeof DataStore.init === 'function' ? '✅' : '❌'), 'info');
        } else {
            log('❌ DataStore 未定义', 'error');
        }
        
        // 检查 XPTable
        if (typeof XPTable !== 'undefined') {
            log('✅ XPTable 已定义', 'success');
        } else {
            log('❌ XPTable 未定义', 'error');
        }
        
        // 检查 CourseData
        if (typeof CourseData !== 'undefined') {
            log('✅ CourseData 已定义', 'success');
            log('   - units: ' + (CourseData.units ? CourseData.units.length + ' 个单元' : '❌ 未定义'), 'info');
            log('   - getLessonById: ' + (typeof CourseData.getLessonById === 'function' ? '✅' : '❌'), 'info');
        } else {
            log('❌ CourseData 未定义', 'error');
        }
        
        // 检查 Achievements
        if (typeof Achievements !== 'undefined') {
            log('✅ Achievements 已定义', 'success');
            log('   - init: ' + (typeof Achievements.init === 'function' ? '✅' : '❌'), 'info');
        } else {
            log('❌ Achievements 未定义', 'error');
        }
        
        // 检查 QuizEngine
        if (typeof QuizEngine !== 'undefined') {
            log('✅ QuizEngine 已定义', 'success');
        } else {
            log('❌ QuizEngine 未定义', 'error');
        }
        
        // 检查 CompilerAPI
        if (typeof CompilerAPI !== 'undefined') {
            log('✅ CompilerAPI 已定义', 'success');
        } else {
            log('❌ CompilerAPI 未定义', 'error');
        }
        
        // 检查 App
        if (typeof App !== 'undefined') {
            log('✅ App 已定义', 'success');
            log('   - init: ' + (typeof App.init === 'function' ? '✅' : '❌'), 'info');
        } else {
            log('❌ App 未定义', 'error');
        }
        
        // 测试 CourseData.getLessonById
        log('<br>=== 测试 getLessonById ===', 'info');
        if (typeof CourseData !== 'undefined' && typeof CourseData.getLessonById === 'function') {
            const lesson = CourseData.getLessonById(1, '1.1');
            if (lesson) {
                log('✅ getLessonById(1, "1.1") 成功', 'success');
                log('   标题: ' + lesson.title, 'info');
            } else {
                log('❌ getLessonById(1, "1.1") 返回 null', 'error');
            }
        }
        
        // 尝试初始化 App
        log('<br>=== 尝试初始化 App ===', 'info');
        if (typeof App !== 'undefined' && typeof App.init === 'function') {
            log('正在调用 App.init()...', 'info');
            App.init().then(() => {
                log('✅ App.init() 完成', 'success');
            }).catch(err => {
                log('❌ App.init() 失败: ' + err.message, 'error');
                logPre(err.stack);
            });
        } else {
            log('❌ 无法调用 App.init()', 'error');
        }
    </script>
</body>
</html>
