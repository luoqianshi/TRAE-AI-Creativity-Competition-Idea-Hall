<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>详细调试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #fff; font-size: 14px; }
        .log { margin: 5px; padding: 8px; border-radius: 4px; }
        .success { background: rgba(0,255,0,0.1); color: #0f0; }
        .error { background: rgba(255,0,0,0.1); color: #f00; }
        .info { background: rgba(0,0,255,0.1); color: #0ff; }
        .warning { background: rgba(255,255,0,0.1); color: #ff0; }
        pre { background: #0f0f1a; padding: 10px; border-radius: 4px; overflow-x: auto; max-width: 100%; }
    </style>
</head>
<body>
    <h1>C++ Mastery Path - 详细调试</h1>
    
    <div id="log"></div>
    
    <script>
        function addLog(msg, type) {
            const div = document.createElement('div');
            div.className = 'log ' + (type || 'info');
            div.innerHTML = msg;
            document.getElementById('log').appendChild(div);
            console.log(msg);
        }
        
        function addPreLog(msg) {
            const pre = document.createElement('pre');
            pre.textContent = msg;
            document.getElementById('log').appendChild(pre);
            console.log(msg);
        }
        
        addLog('=== 开始详细调试 ===', 'info');
    </script>
    
    <!-- 加载所有单元数据 -->
    <script src="data-store.js" onerror="addLog('data-store.js 加载失败', 'error')"></script>
    <script>addLog('1. data-store.js 已加载', 'info');</script>
    
    <script src="xp-table.js" onerror="addLog('xp-table.js 加载失败', 'error')"></script>
    <script>addLog('2. xp-table.js 已加载', 'info');</script>
    
    <script src="unit1-data.js" onerror="addLog('unit1-data.js 加载失败', 'error')"></script>
    <script>addLog('3. unit1-data.js 已加载', 'info');</script>
    
    <script src="unit2-data.js" onerror="addLog('unit2-data.js 加载失败', 'error')"></script>
    <script>addLog('4. unit2-data.js 已加载', 'info');</script>
    
    <script src="unit3-data.js" onerror="addLog('unit3-data.js 加载失败', 'error')"></script>
    <script>addLog('5. unit3-data.js 已加载', 'info');</script>
    
    <script src="unit4-data.js" onerror="addLog('unit4-data.js 加载失败', 'error')"></script>
    <script>addLog('6. unit4-data.js 已加载', 'info');</script>
    
    <script src="unit5-data.js" onerror="addLog('unit5-data.js 加载失败', 'error')"></script>
    <script>addLog('7. unit5-data.js 已加载', 'info');</script>
    
    <script src="unit6-data.js" onerror="addLog('unit6-data.js 加载失败', 'error')"></script>
    <script>addLog('8. unit6-data.js 已加载', 'info');</script>
    
    <script src="unit7-data.js" onerror="addLog('unit7-data.js 加载失败', 'error')"></script>
    <script>addLog('9. unit7-data.js 已加载', 'info');</script>
    
    <script src="unit8-data.js" onerror="addLog('unit8-data.js 加载失败', 'error')"></script>
    <script>addLog('10. unit8-data.js 已加载', 'info');</script>
    
    <script src="unit9-data.js" onerror="addLog('unit9-data.js 加载失败', 'error')"></script>
    <script>addLog('11. unit9-data.js 已加载', 'info');</script>
    
    <script src="unit10-data.js" onerror="addLog('unit10-data.js 加载失败', 'error')"></script>
    <script>addLog('12. unit10-data.js 已加载', 'info');</script>
    
    <script src="course-data.js" onerror="addLog('course-data.js 加载失败', 'error')"></script>
    <script>
        addLog('13. course-data.js 已加载', 'info');
        
        // 检查 CourseData
        addLog('<br>=== 检查 CourseData ===', 'info');
        
        if (typeof CourseData !== 'undefined') {
            addLog('✅ CourseData 已定义', 'success');
            
            if (CourseData.units && Array.isArray(CourseData.units)) {
                addLog('✅ CourseData.units 是数组', 'success');
                addLog('单元数量: ' + CourseData.units.length, 'info');
                
                if (CourseData.units.length > 0) {
                    addLog('<br>单元列表:', 'info');
                    CourseData.units.forEach((unit, index) => {
                        if (unit && unit.id && unit.title && unit.lessons && Array.isArray(unit.lessons)) {
                            addLog('  [' + index + '] 单元' + unit.id + ': ' + unit.title + ' (' + unit.lessons.length + '节课)', 'success');
                        } else {
                            addLog('  [' + index + '] ❌ 无效单元: ' + JSON.stringify(unit), 'error');
                        }
                    });
                    
                    // 测试 getLessonById
                    addLog('<br>=== 测试 getLessonById ===', 'info');
                    const lesson = CourseData.getLessonById(1, '1.1');
                    if (lesson) {
                        addLog('✅ getLessonById(1, "1.1") 成功', 'success');
                        addLog('   课程标题: ' + lesson.title, 'info');
                        addLog('   课程难度: ' + lesson.difficulty, 'info');
                        addLog('   课程时长: ' + lesson.duration, 'info');
                    } else {
                        addLog('❌ getLessonById(1, "1.1") 返回 undefined', 'error');
                    }
                } else {
                    addLog('❌ CourseData.units 为空数组', 'error');
                }
            } else {
                addLog('❌ CourseData.units 不是数组或未定义', 'error');
                addLog('CourseData.units 的值: ' + typeof CourseData.units, 'info');
            }
        } else {
            addLog('❌ CourseData 未定义', 'error');
        }
    </script>
</body>
</html>
