<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>调试原始单元数据</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #1a1a2e; color: #fff; }
        .log { margin: 5px; padding: 5px; border-radius: 4px; }
        .success { background: rgba(0,255,0,0.1); color: #0f0; }
        .error { background: rgba(255,0,0,0.1); color: #f00; }
        .info { background: rgba(0,0,255,0.1); color: #0ff; }
    </style>
</head>
<body>
    <h1>调试原始单元数据加载</h1>
    <div id="log"></div>
    
    <script>
        function addLog(msg, type) {
            const div = document.createElement('div');
            div.className = 'log ' + (type || 'info');
            div.textContent = msg;
            document.getElementById('log').appendChild(div);
            console.log(msg);
        }
        
        addLog('开始加载单元数据...', 'info');
    </script>
    
    <!-- 只加载前3个单元来测试 -->
    <script src="unit1-data.js" onerror="addLog('unit1-data.js 加载失败', 'error')"></script>
    <script>
        if (typeof Unit1Data !== 'undefined') {
            addLog('✅ unit1-data.js 加载成功', 'success');
            addLog('  - 单元ID: ' + Unit1Data.id, 'info');
            addLog('  - 标题: ' + Unit1Data.title, 'info');
            addLog('  - 课程数: ' + Unit1Data.lessons.length, 'info');
        } else {
            addLog('❌ Unit1Data 未定义', 'error');
        }
    </script>
    
    <script src="unit2-data.js" onerror="addLog('unit2-data.js 加载失败', 'error')"></script>
    <script>
        if (typeof Unit2Data !== 'undefined') {
            addLog('✅ unit2-data.js 加载成功', 'success');
            addLog('  - 课程数: ' + Unit2Data.lessons.length, 'info');
        } else {
            addLog('❌ Unit2Data 未定义', 'error');
        }
    </script>
    
    <script src="course-data.js" onerror="addLog('course-data.js 加载失败', 'error')"></script>
    <script>
        if (typeof CourseData !== 'undefined') {
            addLog('✅ CourseData 加载成功', 'success');
            addLog('  - 单元数: ' + CourseData.units.length, 'info');
            if (CourseData.units.length > 0) {
                addLog('  - 第一个单元: ' + CourseData.units[0].title, 'info');
            }
        } else {
            addLog('❌ CourseData 未定义', 'error');
        }
    </script>
</body>
</html>
