<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试加载</title>
</head>
<body>
    <h1>加载测试</h1>
    <div id="result"></div>
    
    <script src="unit1-data.js"></script>
    <script>
        var result = document.getElementById('result');
        
        if (typeof Unit1Data !== 'undefined') {
            result.innerHTML = '<p style="color:green">Unit1Data 加载成功!</p>';
            result.innerHTML += '<p>单元标题: ' + Unit1Data.title + '</p>';
            result.innerHTML += '<p>课程数量: ' + Unit1Data.lessons.length + '</p>';
        } else {
            result.innerHTML = '<p style="color:red">Unit1Data 未定义!</p>';
        }
        
        console.log('Unit1Data:', typeof Unit1Data);
    </script>
</body>
</html>
