<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习进度 - C++ Mastery Path</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .progress-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .progress-header-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .progress-header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-header h1 svg {
            color: var(--accent-primary);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        .progress-stats {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
        }

        .progress-stats-content {
            max-width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .progress-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .progress-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .unit-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            margin-bottom: 16px;
            overflow: hidden;
        }

        .unit-header {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .unit-header:hover {
            background: rgba(88, 166, 255, 0.1);
        }

        .unit-expand-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            transition: transform 0.2s;
            color: var(--text-secondary);
        }

        .unit-card.expanded .unit-expand-icon {
            transform: rotate(90deg);
        }

        .unit-status-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 12px;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .unit-status-dot.completed {
            background: var(--accent-success);
            border-color: var(--accent-success);
        }

        .unit-status-dot.partial {
            background: transparent;
            border-color: var(--accent-success);
        }

        .unit-status-dot.locked {
            background: transparent;
            border-color: var(--border-color);
        }

        .unit-info {
            flex: 1;
        }

        .unit-title {
            font-size: 16px;
            font-weight: 600;
        }

        .unit-progress-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .unit-progress-bar {
            width: 100px;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .unit-progress-fill {
            height: 100%;
            background: var(--accent-success);
            border-radius: 3px;
            transition: width 0.3s;
        }

        .lessons-list {
            display: none;
            padding: 12px 20px;
        }

        .unit-card.expanded .lessons-list {
            display: block;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin: 4px 0;
            background: var(--bg-secondary);
            border-radius: var(--radius-button);
            transition: background 0.2s;
        }

        .lesson-item:hover {
            background: rgba(88, 166, 255, 0.1);
        }

        .lesson-status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
        }

        .lesson-status-dot.completed {
            background: var(--accent-success);
            border-color: var(--accent-success);
        }

        .lesson-status-dot.partial {
            background: transparent;
            border-color: var(--accent-success);
        }

        .lesson-status-dot.not-started {
            background: transparent;
            border-color: var(--border-color);
        }

        .lesson-info {
            flex: 1;
        }

        .lesson-title {
            font-size: 14px;
        }

        .lesson-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .lesson-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

        .lesson-badge.hands-on {
            background: rgba(88, 166, 255, 0.2);
            color: var(--accent-primary);
        }

        .lesson-badge.quiz {
            background: rgba(63, 185, 80, 0.2);
            color: var(--accent-success);
        }

        @media (max-width: 768px) {
            .progress-stats-content {
                grid-template-columns: repeat(2, 1fr);
            }

            .progress-header h1 {
                font-size: 20px;
            }

            .back-btn span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="progress-header">
        <div class="progress-header-content">
            <h1>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/>
                </svg>
                学习进度
            </h1>
            <a href="index.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>返回首页</span>
            </a>
        </div>
    </div>

    <div class="progress-stats">
        <div class="progress-stats-content">
            <div class="stat-card">
                <div class="stat-value" id="total-units">27</div>
                <div class="stat-label">总单元</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completed-lessons">0</div>
                <div class="stat-label">已完成章节</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-xp">0</div>
                <div class="stat-label">获得 XP</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="streak-days">0</div>
                <div class="stat-label">连续学习天数</div>
            </div>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-content" id="progress-tree">
            <!-- 动态生成进度树 -->
        </div>
    </div>

    <!-- 外部脚本依赖 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.2/marked.min.js"></script>

    <!-- 应用模块 -->
    <script src="modules/data-store.js"></script>
    <script src="data/xp-table.js"></script>

    <!-- 单元数据文件 -->
    <script src="data/unit1-data.js"></script>
    <script src="data/unit2-data.js"></script>
    <script src="data/unit3-data.js"></script>
    <script src="data/unit4-data.js"></script>
    <script src="data/unit5-data.js"></script>
    <script src="data/unit6-data.js"></script>
    <script src="data/unit7-data.js"></script>
    <script src="data/unit8-data.js"></script>
    <script src="data/unit9-data.js"></script>
    <script src="data/unit10-data.js"></script>
    <script src="data/unit11-data.js"></script>
    <script src="data/unit12-data.js"></script>
    <script src="data/unit13-data.js"></script>
    <script src="data/unit14-data.js"></script>
    <script src="data/unit15-data.js"></script>
    <script src="data/unit16-data.js"></script>
    <script src="data/unit17-data.js"></script>
    <script src="data/unit18-data.js"></script>
    <script src="data/unit19-data.js"></script>
    <script src="data/unit20-data.js"></script>
    <script src="data/unit21-data.js"></script>
    <script src="data/unit22-data.js"></script>
    <script src="data/unit23-data.js"></script>
    <script src="data/unit24-data.js"></script>
    <script src="data/unit25-data.js"></script>
    <script src="data/unit26-data.js"></script>
    <script src="data/unit27-data.js"></script>

    <!-- 课程数据 -->
    <script src="data/course-data.js"></script>

    <script>
        // 初始化
        async function init() {
            // 初始化数据存储
            await DataStore.init();

            // 初始化课程数据
            if (typeof CourseData !== 'undefined' && typeof CourseData.init === 'function') {
                CourseData.init();
            }

            // 加载进度数据
            await loadProgress();
        }

        async function loadProgress() {
            const container = document.getElementById('progress-tree');
            const allProgress = await DataStore.getGlobalProgress();
            const userStats = await DataStore.getUserStats();

            // 更新统计数据
            document.getElementById('completed-lessons').textContent = userStats.completedLessons || 0;
            document.getElementById('total-xp').textContent = userStats.totalXP || 0;
            document.getElementById('streak-days').textContent = userStats.streak || 0;

            // 构建进度映射
            const progressMap = new Map();
            allProgress.forEach(p => {
                progressMap.set(`${p.unitId}_${p.lessonId}`, p);
            });

            // 生成进度树
            let html = '';
            let totalLessons = 0;
            let completedLessons = 0;

            for (const unit of CourseData.units) {
                let unitCompleted = 0;
                let unitPartial = 0;
                let unitTotal = unit.lessons.length;
                totalLessons += unitTotal;

                let lessonsHtml = '';
                for (const lesson of unit.lessons) {
                    const progress = progressMap.get(`${unit.id}_${lesson.id}`);
                    const isCompleted = progress?.completed;
                    const hasHandsOn = progress?.handsOnCompleted;
                    const hasQuiz = progress?.quizCompleted;

                    let statusClass = 'not-started';
                    if (isCompleted) {
                        statusClass = 'completed';
                        unitCompleted++;
                        completedLessons++;
                    } else if (hasHandsOn || hasQuiz) {
                        statusClass = 'partial';
                        unitPartial++;
                    }

                    lessonsHtml += `
                        <div class="lesson-item">
                            <div class="lesson-status-dot ${statusClass}"></div>
                            <div class="lesson-info">
                                <div class="lesson-title">${lesson.id} ${lesson.title}</div>
                                <div class="lesson-meta">
                                    ${lesson.duration || ''} ${lesson.difficulty ? '· ' + lesson.difficulty : ''}
                                </div>
                            </div>
                            ${hasHandsOn ? '<span class="lesson-badge hands-on">动手实践</span>' : ''}
                            ${hasQuiz ? '<span class="lesson-badge quiz">测验完成</span>' : ''}
                        </div>
                    `;
                }

                // 计算单元状态
                let unitStatusClass = 'locked';
                if (unitCompleted === unitTotal) {
                    unitStatusClass = 'completed';
                } else if (unitCompleted > 0 || unitPartial > 0) {
                    unitStatusClass = 'partial';
                }

                const unitProgress = Math.round((unitCompleted / unitTotal) * 100);

                html += `
                    <div class="unit-card" data-unit="${unit.id}">
                        <div class="unit-header" onclick="toggleUnit(${unit.id})">
                            <svg class="unit-expand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 18l6-6-6-6"/>
                            </svg>
                            <div class="unit-status-dot ${unitStatusClass}"></div>
                            <div class="unit-info">
                                <div class="unit-title">单元 ${unit.id}: ${unit.title}</div>
                                <div class="unit-progress-text">${unitCompleted}/${unitTotal} 章节完成</div>
                            </div>
                            <div class="unit-progress-bar">
                                <div class="unit-progress-fill" style="width: ${unitProgress}%"></div>
                            </div>
                        </div>
                        <div class="lessons-list">
                            ${lessonsHtml}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;

            // 更新总章节数
            document.getElementById('total-units').textContent = CourseData.units.length;
        }

        function toggleUnit(unitId) {
            const card = document.querySelector(`.unit-card[data-unit="${unitId}"]`);
            if (card) {
                card.classList.toggle('expanded');
            }
        }

        // 启动
        init();
    </script>
</body>
</html>
