<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经验值与等级配置 - C++ Mastery Path</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .config-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .config-header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .config-header h1 {
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .config-header h1 svg {
            color: var(--accent-primary);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .config-container {
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            overflow-y: auto;
        }

        .config-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-card);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .section-header {
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-header h2 svg {
            color: var(--accent-primary);
        }

        .section-content {
            padding: 20px;
        }

        /* XP表配置 */
        .xp-table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .xp-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            padding: 16px;
        }

        .xp-item-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .xp-item-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .xp-item-description {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .xp-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .xp-input {
            width: 100px;
            padding: 8px 12px;
            background: var(--bg-editor);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'JetBrains Mono', monospace;
        }

        .xp-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .xp-suffix {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* 等级配置 */
        .level-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .level-item {
            display: grid;
            grid-template-columns: 80px 1fr 150px 150px 60px;
            gap: 16px;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            margin-bottom: 8px;
            transition: all var(--transition-fast);
        }

        .level-item:hover {
            border-color: var(--border-color-hover);
            background: rgba(88, 166, 255, 0.05);
        }

        .level-item:last-child {
            margin-bottom: 0;
        }

        .level-number {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .level-title-input,
        .level-xp-input {
            padding: 8px 12px;
            background: var(--bg-editor);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            font-size: 14px;
        }

        .level-title-input {
            width: 100%;
        }

        .level-xp-input {
            width: 120px;
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
        }

        .level-title-input:focus,
        .level-xp-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .level-description-input {
            padding: 8px 12px;
            background: var(--bg-editor);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-secondary);
            font-size: 12px;
            width: 100%;
        }

        .level-description-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .level-delete-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .level-delete-btn:hover:not(:disabled) {
            background: var(--accent-error);
            border-color: var(--accent-error);
            color: white;
            transform: translateY(-2px);
        }

        .level-delete-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .add-level-btn {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: transparent;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .add-level-btn:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            background: rgba(88, 166, 255, 0.05);
        }

        /* 单元XP计算 */
        .unit-xp-summary {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .unit-xp-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            padding: 16px;
            text-align: center;
        }

        .unit-xp-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent-success);
            font-family: 'JetBrains Mono', monospace;
        }

        .unit-xp-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 数据导入导出 */
        .import-export-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .import-area,
        .export-area {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            padding: 20px;
        }

        .area-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .area-title svg {
            color: var(--accent-primary);
        }

        .import-textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            background: var(--bg-editor);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            resize: vertical;
        }

        .import-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .export-textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            background: var(--bg-editor);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-button);
            color: var(--text-primary);
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            resize: vertical;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        /* 通知 */
        .notification {
            position: fixed;
            top: 80px;
            right: 24px;
            padding: 16px 24px;
            background: var(--bg-card);
            border: 1px solid var(--accent-success);
            border-radius: var(--radius-button);
            box-shadow: var(--shadow-card);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slide-in 0.3s ease-out;
        }

        .notification.error {
            border-color: var(--accent-error);
        }

        .notification-icon {
            font-size: 20px;
        }

        .notification-message {
            font-size: 14px;
        }

        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 验证错误 */
        .validation-error {
            border-color: var(--accent-error) !important;
        }

        .error-message {
            color: var(--accent-error);
            font-size: 12px;
            margin-top: 4px;
        }

        /* 统计 */
        .stats-summary {
            display: flex;
            gap: 24px;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .level-item {
                grid-template-columns: 60px 1fr;
                gap: 8px;
            }

            .level-title-input {
                grid-column: 2;
            }

            .level-xp-input,
            .level-description-input {
                grid-column: 2;
            }

            .level-delete-btn {
                grid-column: 1 / -1;
                justify-self: end;
            }

            .import-export-area {
                grid-template-columns: 1fr;
            }

            .stats-summary {
                flex-wrap: wrap;
            }

            .header-actions {
                gap: 8px;
            }

            .btn {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="config-header">
        <div class="config-header-content">
            <h1>
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                经验值与等级配置
            </h1>
            <div class="header-actions">
                <button class="btn btn-secondary" id="reset-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    重置为默认
                </button>
                <button class="btn btn-primary" id="save-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    保存配置
                </button>
                <a href="index.html" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    返回首页
                </a>
            </div>
        </div>
    </div>

    <div class="config-container">
        <!-- XP表配置 -->
        <div class="config-section">
            <div class="section-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    经验值设置
                </h2>
            </div>
            <div class="stats-summary">
                <div class="stat-item">
                    <span class="stat-value" id="total-xp-display">0</span>
                    <span class="stat-label">当前XP总和</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="max-level-display">0</span>
                    <span class="stat-label">等级数量</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="xp-per-lesson-display">0</span>
                    <span class="stat-label">每章节基础XP</span>
                </div>
            </div>
            <div class="section-content">
                <div class="xp-table-grid" id="xp-table-config">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 等级配置 -->
        <div class="config-section">
            <div class="section-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
                        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                        <path d="M4 22h16"/>
                        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
                        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
                        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
                    </svg>
                    等级名称与所需经验
                </h2>
                <button class="btn btn-secondary" id="add-level-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    添加等级
                </button>
            </div>
            <div class="section-content">
                <div class="level-list" id="level-list">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>

        <!-- 单元XP计算 -->
        <div class="config-section">
            <div class="section-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="4" y="4" width="16" height="16" rx="2"/>
                        <path d="M9 9h6"/>
                        <path d="M9 13h6"/>
                        <path d="M9 17h6"/>
                    </svg>
                    单元XP计算
                </h2>
            </div>
            <div class="section-content">
                <div class="unit-xp-summary" id="unit-xp-summary">
                    <!-- 动态生成 -->
                </div>
                <div style="font-size: 14px; color: var(--text-secondary);">
                    <p><strong>计算说明：</strong></p>
                    <ul style="margin-left: 20px; margin-top: 8px; line-height: 1.8;">
                        <li>每章节完成基础XP = 完成课程 + 完成动手实践 + 完成测验</li>
                        <li>每单元总XP = 每章节基础XP × 章节数量</li>
                        <li>全课程总XP = 所有单元XP之和</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 数据导入导出 -->
        <div class="config-section">
            <div class="section-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    数据导入/导出
                </h2>
            </div>
            <div class="section-content">
                <div class="import-export-area">
                    <div class="import-area">
                        <div class="area-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            导入配置
                        </div>
                        <textarea class="import-textarea" id="import-textarea" placeholder="粘贴JSON配置数据..."></textarea>
                        <div class="action-buttons">
                            <button class="btn btn-primary" id="import-btn">导入</button>
                            <button class="btn btn-secondary" id="clear-import-btn">清空</button>
                        </div>
                    </div>
                    <div class="export-area">
                        <div class="area-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            导出配置
                        </div>
                        <textarea class="export-textarea" id="export-textarea" readonly></textarea>
                        <div class="action-buttons">
                            <button class="btn btn-primary" id="copy-export-btn">复制</button>
                            <button class="btn btn-secondary" id="download-export-btn">下载JSON</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 应用模块 -->
    <script src="modules/data-store.js"></script>
    <script src="data/xp-table.js"></script>
    <script>
        // 配置数据
        let configData = {
            xpTable: {},
            levelTitles: []
        };

        // XP表配置项
        const xpTableConfig = [
            { key: 'lesson.complete_lesson', label: '完成课程', description: '完成章节学习获得的XP' },
            { key: 'lesson.complete_hands_on', label: '完成动手实践', description: '通过动手实践任务获得的XP' },
            { key: 'lesson.complete_quiz_correct', label: '答对测验题', description: '每答对一题获得的XP' },
            { key: 'lesson.complete_quiz_all', label: '完成测验', description: '完成章节测验获得的XP' },
            { key: 'achievements.first_lesson', label: '首次完成课程', description: '首次完成章节成就' },
            { key: 'achievements.first_hands_on', label: '首次动手实践', description: '首次通过动手实践成就' },
            { key: 'achievements.first_quiz', label: '首次完成测验', description: '首次完成测验成就' },
            { key: 'achievements.streak_7_days', label: '7天连续学习', description: '连续学习7天成就' },
            { key: 'achievements.streak_30_days', label: '30天连续学习', description: '连续学习30天成就' },
            { key: 'achievements.complete_unit', label: '完成单元', description: '完成单个单元成就' },
            { key: 'achievements.complete_course', label: '完成课程', description: '完成全部课程成就' },
            { key: 'special.daily_login', label: '每日登录', description: '每日登录奖励' },
        ];

        // 初始化
        async function init() {
            await DataStore.init();
            loadConfig();
            renderXpTable();
            renderLevelList();
            renderUnitXpSummary();
            updateStats();
            setupEventListeners();
        }

        // 加载配置
        function loadConfig() {
            // 从localStorage加载或使用默认值
            const savedConfig = localStorage.getItem('xpLevelConfig');
            if (savedConfig) {
                configData = JSON.parse(savedConfig);
            } else {
                // 使用默认值
                configData = {
                    xpTable: JSON.parse(JSON.stringify(XPTable)),
                    levelTitles: JSON.parse(JSON.stringify(LevelTitles))
                };
            }
        }

        // 保存配置
        async function saveConfig() {
            localStorage.setItem('xpLevelConfig', JSON.stringify(configData));
            
            // 更新XPTable和LevelTitles
            Object.assign(window.XPTable, configData.xpTable);
            window.LevelTitles = configData.levelTitles;
            window.calculateLevel = function(xp) {
                let level = 1;
                for (let i = configData.levelTitles.length - 1; i >= 0; i--) {
                    if (xp >= configData.levelTitles[i].minXP) {
                        level = configData.levelTitles[i].level;
                        break;
                    }
                }
                return level;
            };
            
            showNotification('配置已保存！', 'success');
        }

        // 重置为默认
        function resetConfig() {
            if (confirm('确定要重置为默认配置吗？')) {
                configData = {
                    xpTable: {
                        lesson: {
                            complete_lesson: 100,
                            complete_hands_on: 150,
                            complete_quiz_correct: 20,
                            complete_quiz_all: 50,
                        },
                        achievements: {
                            first_lesson: 50,
                            first_hands_on: 100,
                            first_quiz: 50,
                            streak_7_days: 300,
                            streak_30_days: 1000,
                            complete_unit: 500,
                            complete_course: 5000,
                        },
                        special: {
                            daily_login: 10,
                            weekend_bonus: 50,
                        }
                    },
                    levelTitles: LevelTitles.map((l, i) => ({
                        level: i + 1,
                        title: l.title,
                        description: l.description || '',
                        minXP: i === 0 ? 0 : (i) * 100
                    }))
                };
                localStorage.removeItem('xpLevelConfig');
                renderXpTable();
                renderLevelList();
                renderUnitXpSummary();
                updateStats();
                showNotification('已重置为默认配置', 'success');
            }
        }

        // 渲染XP表配置
        function renderXpTable() {
            const container = document.getElementById('xp-table-config');
            container.innerHTML = xpTableConfig.map(item => {
                const value = getNestedValue(configData.xpTable, item.key) || 0;
                return `
                    <div class="xp-item">
                        <div class="xp-item-header">
                            <span class="xp-item-label">${item.label}</span>
                        </div>
                        <div class="xp-item-description">${item.description}</div>
                        <div class="xp-input-group">
                            <input type="number" class="xp-input" value="${value}" 
                                   data-key="${item.key}" min="0" step="10">
                            <span class="xp-suffix">XP</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 渲染等级列表
        function renderLevelList() {
            const container = document.getElementById('level-list');
            container.innerHTML = configData.levelTitles.map((level, index) => `
                <div class="level-item">
                    <div class="level-number">Lv.${level.level}</div>
                    <input type="text" class="level-title-input" value="${level.title}" 
                           data-index="${index}" data-field="title" placeholder="等级名称">
                    <input type="number" class="level-xp-input" value="${level.minXP}" 
                           data-index="${index}" data-field="minXP" min="0" step="100" placeholder="所需XP">
                    <input type="text" class="level-description-input" value="${level.description || ''}" 
                           data-index="${index}" data-field="description" placeholder="等级描述">
                    <button class="level-delete-btn" data-index="${index}" ${configData.levelTitles.length <= 1 ? 'disabled' : ''}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        // 渲染单元XP统计
        function renderUnitXpSummary() {
            const container = document.getElementById('unit-xp-summary');
            const lessonXP = configData.xpTable.lesson;
            const perLessonXP = (lessonXP.complete_lesson || 0) + 
                                (lessonXP.complete_hands_on || 0) + 
                                (lessonXP.complete_quiz_all || 0);
            
            const totalUnits = 27;
            const chaptersPerUnit = 6; // 平均每单元章节数
            const perUnitXP = perLessonXP * chaptersPerUnit;
            const totalCourseXP = perUnitXP * totalUnits;

            container.innerHTML = `
                <div class="unit-xp-card">
                    <div class="unit-xp-value">${perLessonXP}</div>
                    <div class="unit-xp-label">每章节总XP</div>
                </div>
                <div class="unit-xp-card">
                    <div class="unit-xp-value">${perUnitXP}</div>
                    <div class="unit-xp-label">每单元总XP</div>
                </div>
                <div class="unit-xp-card">
                    <div class="unit-xp-value">${totalCourseXP}</div>
                    <div class="unit-xp-label">全课程总XP</div>
                </div>
            `;
        }

        // 更新统计
        function updateStats() {
            const totalXP = Object.values(configData.xpTable.lesson || {}).reduce((a, b) => a + b, 0) +
                           Object.values(configData.xpTable.achievements || {}).reduce((a, b) => a + b, 0);
            document.getElementById('total-xp-display').textContent = totalXP;
            document.getElementById('max-level-display').textContent = configData.levelTitles.length;
            document.getElementById('xp-per-lesson-display').textContent = 
                (configData.xpTable.lesson?.complete_lesson || 0) + 
                (configData.xpTable.lesson?.complete_hands_on || 0);
            
            // 更新导出文本
            document.getElementById('export-textarea').value = JSON.stringify(configData, null, 2);
        }

        // 获取嵌套值
        function getNestedValue(obj, path) {
            return path.split('.').reduce((acc, part) => acc && acc[part], obj);
        }

        // 设置嵌套值
        function setNestedValue(obj, path, value) {
            const parts = path.split('.');
            let current = obj;
            for (let i = 0; i < parts.length - 1; i++) {
                if (!current[parts[i]]) current[parts[i]] = {};
                current = current[parts[i]];
            }
            current[parts[parts.length - 1]] = value;
        }

        // 显示通知
        function showNotification(message, type = 'success') {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `
                <span class="notification-icon">${type === 'success' ? '✓' : '✕'}</span>
                <span class="notification-message">${message}</span>
            `;
            document.body.appendChild(notification);

            setTimeout(() => notification.remove(), 3000);
        }

        // 设置事件监听
        function setupEventListeners() {
            // 保存按钮
            document.getElementById('save-btn').addEventListener('click', saveConfig);

            // 重置按钮
            document.getElementById('reset-btn').addEventListener('click', resetConfig);

            // XP表输入
            document.getElementById('xp-table-config').addEventListener('input', (e) => {
                if (e.target.classList.contains('xp-input')) {
                    const key = e.target.dataset.key;
                    const value = parseInt(e.target.value) || 0;
                    setNestedValue(configData.xpTable, key, value);
                    updateStats();
                    renderUnitXpSummary();
                }
            });

            // 等级列表输入
            document.getElementById('level-list').addEventListener('input', (e) => {
                const index = parseInt(e.target.dataset.index);
                const field = e.target.dataset.field;
                if (!isNaN(index) && field) {
                    configData.levelTitles[index][field] = field === 'minXP' ? parseInt(e.target.value) || 0 : e.target.value;
                    updateStats();
                }
            });

            // 删除等级
            document.getElementById('level-list').addEventListener('click', (e) => {
                const btn = e.target.closest('.level-delete-btn');
                if (btn && !btn.disabled) {
                    const index = parseInt(btn.dataset.index);
                    configData.levelTitles.splice(index, 1);
                    // 重新编号
                    configData.levelTitles.forEach((l, i) => l.level = i + 1);
                    renderLevelList();
                    updateStats();
                }
            });

            // 添加等级
            document.getElementById('add-level-btn').addEventListener('click', () => {
                const lastLevel = configData.levelTitles[configData.levelTitles.length - 1];
                const newLevel = {
                    level: configData.levelTitles.length + 1,
                    title: '新等级',
                    description: '',
                    minXP: (lastLevel?.minXP || 0) + 1000
                };
                configData.levelTitles.push(newLevel);
                renderLevelList();
                updateStats();
            });

            // 导入
            document.getElementById('import-btn').addEventListener('click', () => {
                const text = document.getElementById('import-textarea').value.trim();
                if (!text) {
                    showNotification('请输入要导入的配置数据', 'error');
                    return;
                }
                try {
                    const imported = JSON.parse(text);
                    // 验证配置
                    if (!imported.xpTable || !imported.levelTitles) {
                        throw new Error('配置格式不正确');
                    }
                    configData = imported;
                    localStorage.setItem('xpLevelConfig', JSON.stringify(configData));
                    renderXpTable();
                    renderLevelList();
                    renderUnitXpSummary();
                    updateStats();
                    showNotification('导入成功！', 'success');
                } catch (err) {
                    showNotification('导入失败：' + err.message, 'error');
                }
            });

            // 清空导入
            document.getElementById('clear-import-btn').addEventListener('click', () => {
                document.getElementById('import-textarea').value = '';
            });

            // 复制导出
            document.getElementById('copy-export-btn').addEventListener('click', () => {
                const text = document.getElementById('export-textarea').value;
                navigator.clipboard.writeText(text).then(() => {
                    showNotification('已复制到剪贴板！', 'success');
                });
            });

            // 下载导出
            document.getElementById('download-export-btn').addEventListener('click', () => {
                const text = document.getElementById('export-textarea').value;
                const blob = new Blob([text], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'xp-level-config.json';
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        // 启动
        init();
    </script>
</body>
</html>
