<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人类丰容计划</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7EC8E3;
            --secondary: #A8E6CF;
            --accent: #FFD93D;
            --warm: #FF9B7B;
            --bg-light: #F8F9FA;
            --text-dark: #2C3E50;
            --text-gray: #7F8C8D;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #F0F8FF 0%, #F8F9FA 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.5;
        }

        .header h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2.8rem;
            color: var(--white);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 1rem;
            color: rgba(255,255,255,0.95);
            position: relative;
            z-index: 1;
        }

        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px 20px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        @media (max-width: 1100px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .word-cloud-section {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        }

        .word-cloud-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .word-cloud-title::before {
            content: "☁️";
            font-size: 1.5rem;
        }

        #wordCloud {
            height: 550px;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            background: linear-gradient(135deg, #F8F9FA 0%, #F0F8FF 100%);
        }

        .word-item {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            user-select: none;
            font-weight: 500;
        }

        .word-item:hover {
            transform: scale(1.25);
            color: var(--primary);
            z-index: 100;
        }

        .filter-section {
            background: var(--white);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            height: fit-content;
            position: sticky;
            top: 15px;
        }

        .filter-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-title::before {
            content: "✨";
            font-size: 1.5rem;
        }

        .filter-group {
            margin-bottom: 15px;
        }

        .filter-label {
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 8px;
            display: block;
            font-size: 0.9rem;
        }

        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            padding: 6px 12px;
            border: 2px solid #E0E0E0;
            background: var(--white);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.3s ease;
            color: var(--text-gray);
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--white);
        }

        .get-recommendation-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        .get-recommendation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(126, 200, 227, 0.4);
        }

        .recommendations-section {
            grid-column: 1 / -1;
            background: var(--white);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            display: none;
        }

        .recommendations-section.visible {
            display: block;
        }

        .recommendations-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: var(--text-dark);
            text-align: center;
        }

        .recommendations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }

        .recommendation-card {
            background: linear-gradient(135deg, #F8F9FA 0%, #F0F8FF 100%);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .recommendation-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .recommendation-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(126, 200, 227, 0.2);
        }

        .recommendation-card h3 {
            font-size: 1.15rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .recommendation-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 12px;
        }

        .tag {
            font-size: 0.7rem;
            padding: 3px 8px;
            background: var(--white);
            border-radius: 12px;
            color: var(--text-gray);
        }

        .refresh-section {
            text-align: center;
            margin-top: 25px;
        }

        .refresh-btn {
            padding: 10px 30px;
            background: linear-gradient(135deg, var(--warm) 0%, var(--accent) 100%);
            border: none;
            border-radius: 25px;
            color: var(--text-dark);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 155, 123, 0.4);
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message-box {
            margin-top: 22px;
            padding: 18px;
            background: linear-gradient(135deg, #FFF9E6 0%, #FFF3CD 100%);
            border-radius: 12px;
            text-align: center;
            color: var(--text-dark);
            font-size: 1rem;
            display: none;
        }

        .message-box.visible {
            display: block;
        }

        .feedback-section {
            grid-column: 1 / -1;
            background: var(--white);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            margin-top: 25px;
        }

        .feedback-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-title::before {
            content: "💌";
            font-size: 1.5rem;
        }

        .feedback-hint {
            color: var(--text-gray);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .feedback-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        @media (max-width: 768px) {
            .feedback-form {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 2px solid #E0E0E0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Noto Sans SC', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-feedback-btn {
            grid-column: 1 / -1;
            padding: 12px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            border: none;
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-feedback-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(168, 230, 207, 0.4);
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-gray);
            font-size: 0.85rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeInUp 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <div class="header">

                    <button class="filter-btn" data-filter="cost" data-value="10">10元内</button>
                    <button class="filter-btn" data-filter="cost" data-value="50">50元内</button>

            <div class="filter-group">

                    <button class="filter-btn" data-filter="time" data-value="60">1小时</button>
                    <button class="filter-btn" data-filter="time" data-value="any">都行</button>
                </div>
            </div>

            <div class="filter-group">

                    <button class="filter-btn" data-filter="people" data-value="2">两人</button>
                    <button class="filter-btn" data-filter="people" data-value="3-5">3-5人</button>

            <div class="filter-group">

            <div class="filter-group">

                    <button class="filter-btn" data-filter="hungry" data-value="no">否</button>
                    <button class="filter-btn" data-filter="hungry" data-value="any">都行</button>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">🐾 与宠物一起</label>
                <div class="filter-options">
                    <button class="filter-btn" data-filter="pet" data-value="dog">狗狗</button>
                    <button class="filter-btn" data-filter="pet" data-value="cat">猫猫</button>
                    <button class="filter-btn" data-filter="pet" data-value="exotic">异宠</button>
                    <button class="filter-btn" data-filter="pet" data-value="none">不需要</button>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">🚪 是否出门</label>
                <div class="filter-options">
                    <button class="filter-btn" data-filter="outdoor" data-value="yes">出门</button>
                    <button class="filter-btn" data-filter="outdoor" data-value="no">宅家</button>
                    <button class="filter-btn" data-filter="outdoor" data-value="any">都行</button>
                </div>
            </div>

            <div class="filter-group">
                <label class="filter-label">🌤️ 天气</label>
                <div class="filter-options">
                    <button class="filter-btn" data-filter="weather" data-value="sunny">晴天</button>
                    <button class="filter-btn" data-filter="weather" data-value="rainy">雨天</button>
                    <button class="filter-btn" data-filter="weather" data-value="any">都行</button>
                </div>
            </div>

            <button class="get-recommendation-btn" onclick="getRecommendations()">获取推荐 ✨</button>
        </div>

        <div class="recommendations-section" id="recommendationsSection">
            <div class="recommendations-title">为你精选的活动</div>
            <div class="recommendations-grid" id="recommendationsGrid"></div>
            <div class="refresh-section">
                <button class="refresh-btn" id="refreshBtn" onclick="refreshRecommendations()">再来三个 🔄</button>
            </div>
            <div class="message-box" id="messageBox"></div>
        </div>

        <div class="feedback-section">
            <div class="feedback-title">分享你的故事</div>
            <p class="feedback-hint">欢迎分享新的活动创意、你的活动体验或改进建议~</p>
            
            <form class="feedback-form" onsubmit="submitFeedback(event)">
                <div class="form-group">
                    <label>你的昵称</label>
                    <input type="text" id="feedbackName" required placeholder="给自己起个可爱的名字~">
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <select id="feedbackType" required>
                        <option value="">请选择</option>
                        <option value="new_activity">分享新活动</option>
                        <option value="experience">分享体验</option>
                        <option value="suggestion">建议</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label>内容</label>
                    <textarea id="feedbackContent" required placeholder="把你的想法告诉我们吧~"></textarea>
                </div>
                <button type="submit" class="submit-feedback-btn">发送 💌</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <p>✨ 人类丰容计划 | 让生活更有趣一点 ✨</p>
    </div>

        const filters = {
            cost: "any",
            time: "any",
            people: "any",
            period: "any",

            weather: "any"

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const filterType = this.dataset.filter;
                const filterValue = this.dataset.value;
                
                document.querySelectorAll(`[data-filter="${filterType}"]`).forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                filters[filterType] = filterValue;
                
                updateWordCloud();
            });
        });

        function filterActivities() {
            return activities.filter(activity => {
                if (filters.cost !== "any" && activity.cost > parseInt(filters.cost)) return false;
                if (filters.time !== "any") {
                    const timeLimit = parseInt(filters.time);
                    if (timeLimit === 60) {
                        if (activity.time < 30) return false;
                    } else {
                        if (activity.time > timeLimit && activity.time !== 60) return false;
                    }
                }
                if (filters.people !== "any" && activity.people !== filters.people) return false;
                if (filters.period !== "any" && activity.period !== filters.period && activity.period !== "any") return false;
                if (filters.hungry !== "any" && activity.hungry !== filters.hungry && activity.hungry !== "any") return false;
                if (filters.pet !== "none" && activity.pet !== filters.pet) return false;
                if (filters.pet === "none" && activity.pet !== "none") return false;
                if (filters.outdoor !== "any" && activity.outdoor !== filters.outdoor && activity.outdoor !== "any") return false;
                if (filters.weather !== "any" && activity.weather !== filters.weather && activity.weather !== "any") return false;
                return true;
            });
        }

        function generateWordCloud() {
            const wordCloud = document.getElementById('wordCloud');
            wordCloud.innerHTML = '';
            
            const filtered = filterActivities();
            const selected = filtered.slice(0, 120);
            
            const colors = ['#7EC8E3', '#A8E6CF', '#FFD93D', '#FF9B7B', '#7DCEA0', '#85C1E9', '#D7BDE2', '#B19CD9'];
            
            const containerRect = wordCloud.getBoundingClientRect();
            const containerWidth = containerRect.width || 600;
            const containerHeight = 550;
            
            const placedWords = [];
            
            for (let i = 0; i < selected.length; i++) {
                const activity = selected[i];
                const word = document.createElement('span');
                word.className = 'word-item';
                
                const displayName = activity.name.length > 12 ? activity.name.substring(0, 12) + '...' : activity.name;
                word.textContent = displayName;
                
                const size = 12 + Math.random() * 16;
                word.style.fontSize = size + 'px';
                word.style.color = colors[Math.floor(Math.random() * colors.length)];
                
                let attempts = 0;
                let placed = false;
                
                while (attempts < 100 && !placed) {
                    const left = 5 + Math.random() * 85;
                    const top = 5 + Math.random() * 85;
                    
                    word.style.left = left + '%';
                    word.style.top = top + '%';
                    word.style.opacity = 0.85 + Math.random() * 0.15;
                    word.style.position = 'absolute';
                    
                    let overlap = false;
                    for (const placedWord of placedWords) {
                        const distance = Math.sqrt(
                            Math.pow(left - placedWord.left, 2) + 
                            Math.pow(top - placedWord.top, 2)
                        );
                        if (distance < 12) {
                            overlap = true;
                            break;
                        }
                    }
                    
                    if (!overlap) {
                        placedWords.push({ left, top });
                        placed = true;
                    }
                    
                    attempts++;
                }
                
                word.addEventListener('click', () => {
                    alert(`你选了：${activity.name}！快去做吧~ ✨`);
                });
                
                wordCloud.appendChild(word);
            }
        }

        function updateWordCloud() {
            generateWordCloud();

        function getRecommendations() {
            const filtered = filterActivities();
            
            if (filtered.length === 0) {
                alert('没有找到匹配的活动，试着放宽一些条件吧~ 😊');
                return;
            }

            recommendedActivities = [];
            refreshUsed = false;
            
            const shuffled = [...filtered].sort(() => Math.random() - 0.5);
            recommendedActivities = shuffled.slice(0, 3);
            
            displayRecommendations();
            
            document.getElementById('recommendationsSection').classList.add('visible');
            document.getElementById('refreshBtn').disabled = false;
            document.getElementById('messageBox').classList.remove('visible');
            
            document.getElementById('recommendationsSection').scrollIntoView({ behavior: 'smooth' });
        }

        function displayRecommendations() {
            const grid = document.getElementById('recommendationsGrid');
            grid.innerHTML = '';
            
            const costLabels = { 0: "不花钱", 2: "几块钱", 5: "5元内", 10: "10元内", 15: "15元内", 20: "20元内", 25: "25元内", 30: "30元内", 35: "35元内", 40: "40元内", 45: "45元内", 50: "50元内", 60: "60元内", 80: "80元内", 100: "100元内" };
            const timeLabels = { 15: "15分钟", 20: "20分钟", 30: "30分钟", 45: "45分钟", 60: "1小时", 90: "1.5小时", 120: "2小时", 180: "3小时" };
            
            recommendedActivities.forEach((activity, index) => {
                const card = document.createElement('div');
                card.className = 'recommendation-card fade-in';
                card.style.animationDelay = (index * 0.1) + 's';
                
                card.innerHTML = `
                    <h3>🎯 ${activity.name}</h3>
                    <div class="recommendation-tags">
                        <span class="tag">💰 ${costLabels[activity.cost] || activity.cost + '元'}</span>
                        <span class="tag">⏰ ${timeLabels[activity.time] || activity.time + '分钟'}</span>
                        <span class="tag">👥 ${activity.people}人</span>
                        <span class="tag">${activity.outdoor === 'yes' ? '🚪 出门' : '🏠 宅家'}</span>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        function refreshRecommendations() {
            if (refreshUsed) return;
            
            const filtered = filterActivities();
            const remaining = filtered.filter(a => !recommendedActivities.find(r => r.id === a.id));
            
            if (remaining.length === 0) {
                alert('已经没有更多啦！去尝试一下已推荐的吧~ 😊');
                return;
            }

            const shuffled = [...remaining].sort(() => Math.random() - 0.5);
            const newRecs = shuffled.slice(0, 3);
            recommendedActivities = [...recommendedActivities, ...newRecs];
            
            displayRecommendations();
            
            refreshUsed = true;
            document.getElementById('refreshBtn').disabled = true;
            
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = '选择太多反而会浪费时间哦！选一个去做吧~ 💪';
            messageBox.classList.add('visible');
        }
