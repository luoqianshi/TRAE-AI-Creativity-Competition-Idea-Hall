<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>户外徒步装备管理3D模拟系统</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            height: 100vh;
        }
        
        /* 3D 场景区域 */
        #scene-container {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
        }
        
        #scene-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(233, 69, 96, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(15, 52, 96, 0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        .scene-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        
        .scene-title {
            font-size: 24px;
            font-weight: bold;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            margin-bottom: 10px;
        }
        
        .scene-subtitle {
            font-size: 14px;
            color: #aaa;
        }
        
        /* 控制面板 */
        #control-panel {
            width: 380px;
            background: #16213e;
            border-left: 2px solid #e94560;
            overflow-y: auto;
            padding: 20px;
        }
        
        .panel-section {
            margin-bottom: 25px;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 15px;
            border: 1px solid #2a2a4a;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .panel-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #e94560;
            border-radius: 2px;
        }
        
        /* 人物选择 */
        .character-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .selector-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .selector-label {
            font-size: 12px;
            color: #888;
        }
        
        select, input[type="text"], input[type="number"], textarea {
            background: #0f3460;
            border: 1px solid #2a2a4a;
            color: #eee;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            width: 100%;
        }
        
        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        
        /* 装备列表 */
        .gear-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .gear-item {
            background: #0f3460;
            border: 2px solid #2a2a4a;
            border-radius: 10px;
            padding: 10px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            position: relative;
            overflow: hidden;
        }
        
        .gear-item:hover {
            border-color: #e94560;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.3);
        }
        
        .gear-item.equipped {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-color: #e94560;
            color: white;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        .gear-item.in-bag {
            background: linear-gradient(135deg, #0f8560, #1a9a70);
            border-color: #0f8560;
            color: white;
        }
        
        @keyframes glow {
            from { box-shadow: 0 0 5px rgba(233, 69, 96, 0.5); }
            to { box-shadow: 0 0 20px rgba(233, 69, 96, 0.8); }
        }
        
        .gear-icon {
            font-size: 24px;
            margin-bottom: 5px;
            display: block;
        }
        
        .gear-item .location-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* 背包装备 */
        .bag-gear-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2a4a;
        }
        
        .bag-gear-title {
            font-size: 14px;
            color: #0f8560;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        /* 必带物品清单 */
        .checklist-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #0f3460;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .checklist-item:hover {
            background: #1a4a7a;
        }
        
        .checklist-item.checked {
            background: #0f8560;
        }
        
        .checklist-item.missing {
            background: #8b0000;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .checklist-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #eee;
            border-radius: 4px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .checklist-item.checked .checklist-checkbox {
            background: #0f8560;
            border-color: #0f8560;
        }
        
        .checklist-item.checked .checklist-checkbox::after {
            content: '✓';
            color: white;
            font-weight: bold;
        }
        
        .checklist-name {
            flex: 1;
            font-size: 14px;
        }
        
        .checklist-category {
            font-size: 11px;
            color: #888;
            background: #1a1a2e;
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        /* 徒步信息 */
        .hike-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .info-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .info-field.full-width {
            grid-column: 1 / -1;
        }
        
        .info-label {
            font-size: 12px;
            color: #888;
        }
        
        /* 按钮 */
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }
        
        .btn-secondary {
            background: #0f3460;
        }
        
        .btn-secondary:hover {
            background: #1a4a7a;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #0f8560, #1a9a70);
        }
        
        .btn-success:hover {
            background: linear-gradient(135deg, #1a9a70, #0f8560);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 133, 96, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 标签页 */
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        
        .tab {
            flex: 1;
            padding: 8px;
            background: #0f3460;
            border: none;
            color: #888;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }
        
        .tab.active {
            background: #e94560;
            color: white;
        }
        
        .tab:hover {
            color: #eee;
        }
        
        /* 推荐提示 */
        .recommendation {
            background: #1a4a7a;
            border-left: 3px solid #e94560;
            padding: 10px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        .recommendation-title {
            font-weight: bold;
            color: #e94560;
            margin-bottom: 5px;
        }
        
        /* 统计信息 */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #0f3460;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #e94560;
        }
        
        .stat-label {
            font-size: 11px;
            color: #888;
        }
        
        /* 3D 提示 */
        .tooltip-3d {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            z-index: 100;
            display: none;
            border: 1px solid #e94560;
        }
        
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 3px;
        }
        
        /* 装备详情弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: #16213e;
            border-radius: 16px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            border: 2px solid #e94560;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #e94560;
            margin-bottom: 15px;
        }
        
        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }
        
        .modal-close:hover {
            color: #e94560;
        }
        
        /* 动画提示 */
        .animation-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(233, 69, 96, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            animation: fadeInOut 3s ease-in-out;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }
        
        /* 加载动画 */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2a4a;
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 脉冲动画 */
        .pulse {
            animation: pulse-animation 2s infinite;
        }
        
        @keyframes pulse-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        /* 面板入场动画 */
        .panel-section {
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* 响应式 */
        @media (max-width: 1024px) {
            #app {
                flex-direction: column;
            }
            
            #control-panel {
                width: 100%;
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 3D 场景区域 -->
        <div id="scene-container">
            <div id="canvas-container"></div>
            <div class="scene-overlay">
                <div class="scene-title">🏔️ 户外徒步装备3D模拟系统</div>
                <div class="scene-subtitle">拖动旋转视角 | 滚轮缩放 | 点击装备穿戴</div>
                <button onclick="showHelp()" style="margin-top: 10px; padding: 6px 12px; background: rgba(233, 69, 96, 0.8); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; pointer-events: auto;">
                    ⌨️ 快捷键帮助
                </button>
            </div>
            <div class="tooltip-3d" id="tooltip-3d"></div>
        </div>
        
        <!-- 控制面板 -->
        <div id="control-panel">
            <!-- 人物选择 -->
            <div class="panel-section">
                <div class="panel-title">人物设置</div>
                <div class="character-selector">
                    <div class="selector-group">
                        <label class="selector-label">性别</label>
                        <select id="gender-select">
                            <option value="male">男生</option>
                            <option value="female">女生</option>
                        </select>
                    </div>
                    <div class="selector-group">
                        <label class="selector-label">年龄段</label>
                        <select id="age-select">
                            <option value="young">青年 (18-30)</option>
                            <option value="adult">壮年 (30-50)</option>
                            <option value="senior">中老年 (50+)</option>
                        </select>
                    </div>
                </div>
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-value" id="equipped-count">0</div>
                        <div class="stat-label">已穿戴</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="bag-count">0</div>
                        <div class="stat-label">背包内</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="missing-count">0</div>
                        <div class="stat-label">待补充</div>
                    </div>
                </div>
            </div>
            
            <!-- 装备管理 -->
            <div class="panel-section">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('wearable')">穿戴装备</button>
                    <button class="tab" onclick="switchTab('backpack')">背包装备</button>
                </div>
                
                <div id="wearable-tab">
                    <div class="recommendation">
                        <div class="recommendation-title">💡 推荐装备</div>
                        <div id="wearable-recommendation">根据当前选择，建议穿戴适合徒步的装备</div>
                    </div>
                    <button class="btn btn-success" onclick="loadRecommendedWearable()" style="margin-bottom: 10px;">一键穿戴推荐装备</button>
                    <div class="gear-grid" id="wearable-gear">
                        <!-- 动态生成 -->
                    </div>
                </div>
                
                <div id="backpack-tab" style="display: none;">
                    <div class="recommendation">
                        <div class="recommendation-title">🎒 背包空间</div>
                        <div id="backpack-recommendation">可放入背包的二级装备</div>
                    </div>
                    <button class="btn btn-success" onclick="loadRecommendedBag()" style="margin-bottom: 10px;">一键装入推荐物品</button>
                    <div class="gear-grid" id="backpack-gear">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </div>
            
            <!-- 装备位置追踪 -->
            <div class="panel-section">
                <div class="panel-title">装备位置追踪</div>
                <div class="recommendation">
                    <div class="recommendation-title">📍 当前装备分布</div>
                    <div id="location-summary">
                        点击按钮查看所有装备的位置分布
                    </div>
                </div>
                <button class="btn" onclick="showGearLocations()">查看装备位置</button>
                <button class="btn btn-secondary" onclick="showHistory()">查看历史记录</button>
            </div>
            
            <!-- 必带物品清单 -->
            <div class="panel-section">
                <div class="panel-title">必带物品清单</div>
                <div id="checklist-container">
                    <!-- 动态生成 -->
                </div>
                <button class="btn btn-success" onclick="checkEssentials()">检查必备物品</button>
            </div>
            
            <!-- 徒步信息 -->
            <div class="panel-section">
                <div class="panel-title">徒步信息</div>
                <div class="hike-info-grid">
                    <div class="info-field">
                        <label class="info-label">徒步名称</label>
                        <input type="text" id="hike-name" placeholder="例如：周末香山徒步">
                    </div>
                    <div class="info-field">
                        <label class="info-label">地点</label>
                        <input type="text" id="hike-location" placeholder="例如：北京香山">
                    </div>
                    <div class="info-field">
                        <label class="info-label">预计路程 (km)</label>
                        <input type="number" id="hike-distance" placeholder="10">
                    </div>
                    <div class="info-field">
                        <label class="info-label">预计时长 (小时)</label>
                        <input type="number" id="hike-duration" placeholder="4">
                    </div>
                    <div class="info-field">
                        <label class="info-label">难度等级</label>
                        <select id="hike-difficulty">
                            <option value="easy">简单</option>
                            <option value="medium">中等</option>
                            <option value="hard">困难</option>
                            <option value="expert">专家</option>
                        </select>
                    </div>
                    <div class="info-field">
                        <label class="info-label">日期</label>
                        <input type="date" id="hike-date">
                    </div>
                    <div class="info-field">
                        <label class="info-label">天气情况</label>
                        <select id="hike-weather">
                            <option value="sunny">☀️ 晴天</option>
                            <option value="cloudy">☁️ 多云</option>
                            <option value="rainy">🌧️ 雨天</option>
                            <option value="snowy">❄️ 雪天</option>
                            <option value="hot">🌡️ 高温</option>
                            <option value="cold">🥶 寒冷</option>
                        </select>
                    </div>
                    <div class="info-field full-width">
                        <label class="info-label">备注</label>
                        <textarea id="hike-notes" rows="3" placeholder="记录其他信息..."></textarea>
                    </div>
                </div>
                <button class="btn" onclick="saveHikeInfo()">保存徒步信息</button>
                <button class="btn btn-success" onclick="exportGearList()">导出装备清单</button>
                <button class="btn btn-secondary" onclick="clearAll()">重置所有</button>
            </div>
        </div>
    </div>
    
    <!-- 装备详情弹窗 -->
    <div class="modal" id="gear-modal" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-title" id="modal-title">装备详情</div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        // ============================================
        // 全局变量
        // ============================================
        let scene, camera, renderer, controls;
        let character, characterGroup;
        let equippedItems = {};
        let bagItems = {};
        let gearLocations = {}; // 装备位置追踪: 'home', 'body', 'bag'
        let checklistItems = [];
        let raycaster, mouse;
        let animationId;
        let backpack3DItems = []; // 3D背包内物品
        let environmentObjects = []; // 环境对象
        
        // 装备数据库
        const gearDatabase = {
            wearable: [
                { id: 'backpack', name: '登山背包', icon: '🎒', category: '背负', essential: true, description: '大容量登山背包，可装载所有装备', defaultLocation: 'home' },
                { id: 'trekking_poles', name: '登山杖', icon: '🦯', category: '辅助', essential: false, description: '碳纤维登山杖，减轻膝盖压力', defaultLocation: 'home' },
                { id: 'knee_pads', name: '护膝', icon: '🦵', category: '防护', essential: false, description: '专业运动护膝，保护膝关节', defaultLocation: 'home' },
                { id: 'sunglasses', name: '太阳镜', icon: '🕶️', category: '防护', essential: true, description: '偏光太阳镜，防紫外线', defaultLocation: 'home' },
                { id: 'hat', name: '遮阳帽', icon: '🧢', category: '防护', essential: true, description: '宽檐遮阳帽，防晒透气', defaultLocation: 'home' },
                { id: 'gloves', name: '手套', icon: '🧤', category: '防护', essential: false, description: '防滑耐磨户外手套', defaultLocation: 'home' },
                { id: 'boots', name: '登山鞋', icon: '🥾', category: ' footwear', essential: true, description: '防水防滑登山鞋', defaultLocation: 'home' },
                { id: 'watch', name: '运动手表', icon: '⌚', category: '装备', essential: false, description: 'GPS运动手表，记录轨迹', defaultLocation: 'home' },
                { id: 'jacket', name: '冲锋衣', icon: '🧥', category: '服装', essential: true, description: '防风防水透气冲锋衣', defaultLocation: 'home' }

            backpack: [

        // ============================================

        // ============================================
        function initScene() {
            const container = document.getElementById('canvas-container');
            
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);
            
            // 相机
            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // 控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 2;
            controls.maxDistance = 10;
            controls.target.set(0, 1, 0);
            
            // 灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);
            
            // 地面
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2a3a2a,
                roughness: 0.8
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // 网格辅助
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            // 射线检测
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // 事件监听
            window.addEventListener('resize', onWindowResize);

        // ============================================
        // 创建3D环境
        // ============================================
        function createEnvironment() {
            // 创建树木
            for (let i = 0; i < 15; i++) {
                const tree = createTree();
                const angle = (i / 15) * Math.PI * 2;
                const radius = 5 + Math.random() * 5;
                tree.position.set(
                    Math.cos(angle) * radius,
                    0,
                    Math.sin(angle) * radius
                );
                tree.rotation.y = Math.random() * Math.PI;
                scene.add(tree);
                environmentObjects.push(tree);
            }
            
            // 创建远处的山
            for (let i = 0; i < 5; i++) {
                const mountain = createMountain();
                mountain.position.set(
                    -15 + i * 8,
                    0,
                    -20 - Math.random() * 10
                );
                scene.add(mountain);
                environmentObjects.push(mountain);
            }
            
            // 创建一些石头
            for (let i = 0; i < 8; i++) {
                const rock = createRock();
                rock.position.set(
                    (Math.random() - 0.5) * 15,
                    0,
                    (Math.random() - 0.5) * 15
                );
                scene.add(rock);
                environmentObjects.push(rock);
            }
            
            // 创建粒子效果（萤火虫）
            createFireflies();
        }
        
        // ============================================
        // 创建萤火虫粒子效果
        // ============================================
        let fireflies;
        function createFireflies() {
            const particleCount = 50;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 20;
                positions[i * 3 + 1] = Math.random() * 5;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 20;
                
                // 黄绿色萤火虫
                colors[i * 3] = 0.8 + Math.random() * 0.2;
                colors[i * 3 + 1] = 1.0;
                colors[i * 3 + 2] = 0.2;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            
            fireflies = new THREE.Points(geometry, material);
            scene.add(fireflies);
        }
        
        // ============================================
        // 更新萤火虫动画
        // ============================================
        function updateFireflies() {
            if (!fireflies) return;
            
            const positions = fireflies.geometry.attributes.position.array;
            const time = Date.now() * 0.001;
            
            for (let i = 0; i < positions.length / 3; i++) {
                positions[i * 3 + 1] += Math.sin(time + i) * 0.005;
                positions[i * 3] += Math.cos(time * 0.5 + i) * 0.002;
            }
            
            fireflies.geometry.attributes.position.needsUpdate = true;
        }
        
        function createTree() {

            const trunkGeometry = new THREE.CylinderGeometry(0.1, 0.15, 1.5, 8);

            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            group.add(trunk);
            
            // 树冠
            const leavesGeometry = new THREE.ConeGeometry(0.8, 2, 8);
            const leavesMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22, roughness: 0.8 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 2;
            leaves.castShadow = true;

            // 第二层树冠

            leaves2.position.y = 2.8;

        function createMountain() {
            const geometry = new THREE.ConeGeometry(3 + Math.random() * 2, 5 + Math.random() * 3, 4);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x666666, 
                roughness: 0.9,
                flatShading: true
            });
            const mountain = new THREE.Mesh(geometry, material);
            mountain.position.y = 0;
            mountain.castShadow = true;
            return mountain;
        }
        
        function createRock() {
            const geometry = new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.3);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x777777, 
                roughness: 0.9

            rock.position.y = 0.2;

            rock.rotation.set(Math.random(), Math.random(), Math.random());

        // ============================================
        function removeGearFromCharacter(gearId) {
            if (!characterGroup) return;
            
            // 更新装备位置
            gearLocations[gearId] = 'home';
            
            const gearName = 'gear_' + gearId;
            const gearMesh = characterGroup.getObjectByName(gearName);
            
            if (gearMesh) {
                gsap.to(gearMesh.scale, {
                    x: 0, y: 0, z: 0,
                    duration: 0.3,
                    ease: 'power2.in',
                    onComplete: () => {
                        characterGroup.remove(gearMesh);
                    }
                });
            }
            
            // 如果移除的是背包，清除背包内物品的3D显示
            if (gearId === 'backpack') {
                updateBackpackContents3D();
            }
        }

            const equippedCount = Object.values(equippedItems).filter(v => v).length;

            document.getElementById('equipped-count').textContent = equippedCount;
            document.getElementById('bag-count').textContent = bagCount;

            if (equippedItems[gearId]) {
                equippedItems[gearId] = false;
                removeGearFromCharacter(gearId);
            } else {
                equippedItems[gearId] = true;
                addGearToCharacter(gearId);
            }

            updateGearStats();
            updateChecklistFromGear();

        // ============================================

            if (bagItems[gearId]) {
                gearLocations[gearId] = 'bag';

        // ============================================
        // 智能装备推荐
        // ============================================
        function getSmartRecommendations() {
            const difficulty = document.getElementById('hike-difficulty').value;
            const distance = parseFloat(document.getElementById('hike-distance').value) || 0;
            const weather = document.getElementById('hike-weather').value;
            const recommendations = [];
            
            // 根据难度推荐
            if (difficulty === 'hard' || difficulty === 'expert') {
                if (!equippedItems['trekking_poles']) {
                    recommendations.push({ type: 'wearable', id: 'trekking_poles', reason: '高难度路线建议携带登山杖' });
                }
                if (!equippedItems['knee_pads']) {
                    recommendations.push({ type: 'wearable', id: 'knee_pads', reason: '保护膝盖，长途必备' });
                }
                if (!bagItems['rope']) {
                    recommendations.push({ type: 'backpack', id: 'rope', reason: '高难度路线可能需要绳索' });
                }
            }
            
            // 根据距离推荐
            if (distance > 10) {
                if (!bagItems['food']) {
                    recommendations.push({ type: 'backpack', id: 'food', reason: '长途徒步需要补充能量' });
                }
                if (!bagItems['water_bottle']) {
                    recommendations.push({ type: 'backpack', id: 'water_bottle', reason: '长距离需要大量饮水' });
                }
            }
            
            // 根据天气推荐
            if (weather === 'rainy' || weather === 'snowy') {
                if (!equippedItems['jacket']) {
                    recommendations.push({ type: 'wearable', id: 'jacket', reason: '雨雪天气必须穿戴冲锋衣' });
                }
                if (!bagItems['raincoat']) {
                    recommendations.push({ type: 'backpack', id: 'raincoat', reason: '备用雨衣，应对突变天气' });
                }
                if (!equippedItems['boots']) {
                    recommendations.push({ type: 'wearable', id: 'boots', reason: '防水登山鞋，保持双脚干燥' });
                }
            }
            
            if (weather === 'sunny' || weather === 'hot') {
                if (!equippedItems['sunglasses']) {
                    recommendations.push({ type: 'wearable', id: 'sunglasses', reason: '晴天必备，保护眼睛' });
                }
                if (!equippedItems['hat']) {
                    recommendations.push({ type: 'wearable', id: 'hat', reason: '遮阳帽，防止中暑' });
                }
                if (!bagItems['water_bottle']) {
                    recommendations.push({ type: 'backpack', id: 'water_bottle', reason: '高温天气需大量补水' });
                }
            }
            
            if (weather === 'cold' || weather === 'snowy') {
                if (!equippedItems['gloves']) {
                    recommendations.push({ type: 'wearable', id: 'gloves', reason: '保暖手套，防止冻伤' });
                }
                if (!equippedItems['jacket']) {
                    recommendations.push({ type: 'wearable', id: 'jacket', reason: '保暖外套，抵御寒冷' });
                }
            }
            
            // 基础必备推荐
            const essentialWearable = ['backpack', 'boots', 'jacket'];
            essentialWearable.forEach(id => {
                if (!equippedItems[id]) {
                    const gear = gearDatabase.wearable.find(g => g.id === id);
                    recommendations.push({ type: 'wearable', id: id, reason: `${gear.name}是徒步必备装备` });
                }
            });
            
            const essentialBag = ['water_bottle', 'first_aid', 'compass'];
            essentialBag.forEach(id => {
                if (!bagItems[id]) {
                    const gear = gearDatabase.backpack.find(g => g.id === id);
                    recommendations.push({ type: 'backpack', id: id, reason: `${gear.name}是安全必备` });
                }
            });
            
            return recommendations;
        }
        
        // ============================================

        function updateRecommendations() {
            const recommendations = getSmartRecommendations();
            const wearableRec = document.getElementById('wearable-recommendation');
            const backpackRec = document.getElementById('backpack-recommendation');
            
            const wearableRecs = recommendations.filter(r => r.type === 'wearable').slice(0, 3);
            const backpackRecs = recommendations.filter(r => r.type === 'backpack').slice(0, 3);
            
            if (wearableRecs.length > 0) {
                wearableRec.innerHTML = wearableRecs.map(r => `• ${r.reason}`).join('<br>');
            } else {
                wearableRec.innerHTML = '✅ 穿戴装备已准备充分！';
            }
            
            if (backpackRecs.length > 0) {
                backpackRec.innerHTML = backpackRecs.map(r => `• ${r.reason}`).join('<br>');
            } else {
                backpackRec.innerHTML = '✅ 背包装备已准备充分！';
            }
        }

        // ============================================

        function toggleChecklistItem(itemId) {
            const item = essentialChecklist.find(i => i.id === itemId);
            if (item) {
                item.checked = !item.checked;
                item.missing = false;
                renderChecklist();
                updateGearStats();

        // ============================================
        // 根据装备更新清单
        // ============================================
        function updateChecklistFromGear() {

            if (equippedItems.water_bottle || bagItems.water_bottle) {
                essentialChecklist.find(i => i.id === 'water').checked = true;
            }
            if (equippedItems.food || bagItems.food) {
                essentialChecklist.find(i => i.id === 'food').checked = true;
            }
            if (equippedItems.first_aid || bagItems.first_aid) {
                essentialChecklist.find(i => i.id === 'first_aid').checked = true;
            }
            if (equippedItems.compass || bagItems.compass || equippedItems.watch) {
                essentialChecklist.find(i => i.id === 'navigation').checked = true;
            }
            if (equippedItems.sunglasses || equippedItems.hat || equippedItems.jacket) {
                essentialChecklist.find(i => i.id === 'sun_protection').checked = true;
            }
            if (equippedItems.jacket || equippedItems.raincoat || bagItems.raincoat) {
                essentialChecklist.find(i => i.id === 'extra_clothes').checked = true;
            }
            if (equippedItems.flashlight || bagItems.flashlight) {
                essentialChecklist.find(i => i.id === 'flashlight').checked = true;
            }
            
            renderChecklist();

        // ============================================
        // 检查必备物品
        // ============================================
        function checkEssentials() {
            let missingItems = [];
            
            essentialChecklist.forEach(item => {
                if (!item.checked) {
                    item.missing = true;
                    missingItems.push(item.name);
                } else {
                    item.missing = false;
                }
            });
            
            renderChecklist();
            updateGearStats();
            
            if (missingItems.length > 0) {
                showAnimationHint(`⚠️ 缺少必备物品：${missingItems.join('、')}`);
            } else {
                showAnimationHint('✅ 所有必备物品已准备齐全！');
            }
        }

                if (equippedItems[gear.id]) {

                }
            });
            content += `\n`;
            
            content += `🎒 背包内装备 (${Object.values(bagItems).filter(v => v).length} 件)\n`;
            content += `--------------------------------\n`;
            gearDatabase.backpack.forEach(gear => {
                if (bagItems[gear.id]) {
                    content += `✅ ${gear.icon} ${gear.name} (${gear.category})\n`;
                }
            });
            content += `\n`;
            
            content += `📍 家中装备 (${gearDatabase.wearable.length + gearDatabase.backpack.length - Object.values(equippedItems).filter(v => v).length - Object.values(bagItems).filter(v => v).length} 件)\n`;
            content += `--------------------------------\n`;

                if (!equippedItems[gear.id]) {
                    content += `⬜ ${gear.icon} ${gear.name}\n`;

            });
            gearDatabase.backpack.forEach(gear => {
                if (!bagItems[gear.id]) {
                    content += `⬜ ${gear.icon} ${gear.name}\n`;
                }
            });
            content += `\n`;
            
            content += `📋 必带物品检查\n`;
            content += `--------------------------------\n`;
            essentialChecklist.forEach(item => {
                content += `${item.checked ? '✅' : '❌'} ${item.name}\n`;
            });
            
            // 创建下载
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `徒步装备清单_${hikeName}_${hikeDate}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showAnimationHint('📄 装备清单已导出！');
        }
        
        // ============================================
        // 重置所有
        // ============================================
        function clearAll() {
            equippedItems = {};
            bagItems = {};
            essentialChecklist.forEach(item => {
                item.checked = false;
                item.missing = false;
            });
            
            // 清除3D装备
            if (characterGroup) {
                const gearsToRemove = [];
                characterGroup.traverse(child => {
                    if (child.name && child.name.startsWith('gear_')) {
                        gearsToRemove.push(child);
                    }
                });
                gearsToRemove.forEach(gear => characterGroup.remove(gear));
            }
            
            // 清除表单
            document.getElementById('hike-name').value = '';
            document.getElementById('hike-location').value = '';
            document.getElementById('hike-distance').value = '';
            document.getElementById('hike-duration').value = '';
            document.getElementById('hike-notes').value = '';
            
            renderGearLists();
            renderChecklist();
            updateGearStats();
            
            showAnimationHint('🔄 已重置所有设置！');
        }
        
        // ============================================
        // 鼠标事件
        // ============================================
        function onMouseMove(event) {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            // 射线检测
            raycaster.setFromCamera(mouse, camera);
            
            if (characterGroup) {
                const intersects = raycaster.intersectObjects(characterGroup.children, true);
                
                if (intersects.length > 0) {
                    const object = intersects[0].object;
                    if (object.name && object.name.startsWith('gear_')) {
                        const gearId = object.name.replace('gear_', '');
                        const gear = gearDatabase.wearable.find(g => g.id === gearId) || 
                                    gearDatabase.backpack.find(g => g.id === gearId);
                        
                        if (gear) {
                            const tooltip = document.getElementById('tooltip-3d');
                            tooltip.style.display = 'block';
                            tooltip.style.left = event.clientX + 10 + 'px';
                            tooltip.style.top = event.clientY + 10 + 'px';
                            tooltip.textContent = gear.name + ': ' + gear.description;
                        }
                    } else {
                        document.getElementById('tooltip-3d').style.display = 'none';
                    }
                } else {
                    document.getElementById('tooltip-3d').style.display = 'none';
                }
            }
        }
        
        function onMouseClick(event) {
            const container = document.getElementById('canvas-container');
            const rect = container.getBoundingClientRect();
            
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            if (characterGroup) {
                const intersects = raycaster.intersectObjects(characterGroup.children, true);
                
                if (intersects.length > 0) {
                    const object = intersects[0].object;
                    let gearId = null;
                    
                    // 检查是否是装备
                    if (object.name && object.name.startsWith('gear_')) {
                        gearId = object.name.replace('gear_', '');
                    } else if (object.name && object.name.startsWith('bag_item_')) {
                        gearId = object.name.replace('bag_item_', '');
                    }
                    
                    if (gearId) {
                        const gear = gearDatabase.wearable.find(g => g.id === gearId) || 
                                    gearDatabase.backpack.find(g => g.id === gearId);
                        
                        if (gear) {
                            showGearDetail(gear);
                        }
                    }
                }
            }
        }
        
        // ============================================
        // 显示装备详情
        // ============================================
        function showGearDetail(gear) {
            const modal = document.getElementById('gear-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            
            modalTitle.innerHTML = `${gear.icon} ${gear.name}`;
            
            const location = gearLocations[gear.id] || 'home';
            const locationText = locationLabels[location] || '🏠 在家中';
            const isEquipped = equippedItems[gear.id];
            const isInBag = bagItems[gear.id];
            
            let actionButton = '';
            if (gearDatabase.wearable.find(g => g.id === gear.id)) {
                actionButton = `<button class="btn" onclick="toggleWearableGear('${gear.id}'); closeModal();" style="margin-top: 10px;">
                    ${isEquipped ? '卸下装备' : '穿戴装备'}
                </button>`;
            } else {
                actionButton = `<button class="btn" onclick="toggleBackpackGear('${gear.id}'); closeModal();" style="margin-top: 10px;">
                    ${isInBag ? '从背包取出' : '放入背包'}
                </button>`;
            }
            
            modalBody.innerHTML = `
                <div style="text-align: center; margin-bottom: 15px;">
                    <div style="font-size: 60px; margin-bottom: 10px;">${gear.icon}</div>
                    <div style="color: #888;">${gear.category}</div>
                </div>
                <div style="background: #0f3460; padding: 12px; border-radius: 8px; margin-bottom: 10px;">
                    <div style="font-weight: bold; color: #e94560; margin-bottom: 5px;">描述</div>
                    <div>${gear.description}</div>
                </div>
                <div style="background: #0f3460; padding: 12px; border-radius: 8px; margin-bottom: 10px;">
                    <div style="font-weight: bold; color: #4488cc; margin-bottom: 5px;">当前位置</div>
                    <div>${locationText}</div>
                </div>
                <div style="background: #0f3460; padding: 12px; border-radius: 8px; margin-bottom: 10px;">
                    <div style="font-weight: bold; color: #0f8560; margin-bottom: 5px;">重要性</div>
                    <div>${gear.essential ? '⭐ 必带装备' : '💡 推荐装备'}</div>
                </div>
                ${actionButton}
            `;
            
            modal.style.display = 'flex';
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }
        
        // ============================================
        // 动画循环
        // ============================================
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            controls.update();
            
            const time = Date.now() * 0.001;
            
            // 人物轻微呼吸动画
            if (character && characterGroup) {
                characterGroup.position.y = Math.sin(time * 2) * 0.02;
                
                // 手臂轻微摆动
                const leftArm = characterGroup.getObjectByName('leftArm');
                const rightArm = characterGroup.getObjectByName('rightArm');
                if (leftArm && rightArm) {
                    leftArm.rotation.z = 0.2 + Math.sin(time * 1.5) * 0.05;
                    rightArm.rotation.z = -0.2 - Math.sin(time * 1.5) * 0.05;
                }
            }
            
            // 更新萤火虫
            updateFireflies();
            
            // 环境对象轻微动画
            environmentObjects.forEach((obj, index) => {
                if (obj.type === 'Group') { // 树木
                    obj.rotation.y += Math.sin(time * 0.5 + index) * 0.0005;
                }
            });
            
            renderer.render(scene, camera);
        }
        
        // ============================================
        // 模态框
        // ============================================
        function closeModal() {
            document.getElementById('gear-modal').style.display = 'none';
        }
        
        // ============================================
        // 人物选择监听
        // ============================================
        document.getElementById('gender-select').addEventListener('change', () => {
            createCharacter();
            showAnimationHint('人物已更新！');
        });
        
        document.getElementById('age-select').addEventListener('change', () => {
            createCharacter();
            showAnimationHint('人物已更新！');
        });
        
        // ============================================
        // 更新位置汇总
        // ============================================
        function updateLocationSummary() {
            const summary = document.getElementById('location-summary');
            if (!summary) return;
            
            const bodyCount = Object.values(equippedItems).filter(v => v).length;
            const bagCount = Object.values(bagItems).filter(v => v).length;
            const totalGear = gearDatabase.wearable.length + gearDatabase.backpack.length;
            const homeCount = totalGear - bodyCount - bagCount;
            
            summary.innerHTML = `
                <div style="display: flex; justify-content: space-around; margin-top: 8px;">
                    <div style="text-align: center;">
                        <div style="font-size: 18px; font-weight: bold; color: #e94560;">${bodyCount}</div>
                        <div style="font-size: 11px; color: #888;">穿戴中</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 18px; font-weight: bold; color: #0f8560;">${bagCount}</div>
                        <div style="font-size: 11px; color: #888;">背包内</div>
                    </div>
                    <div style="text-align: center;">
                        <div style="font-size: 18px; font-weight: bold; color: #888;">${homeCount}</div>
                        <div style="font-size: 11px; color: #888;">在家中</div>
                    </div>
                </div>
            `;
        }
        
        // ============================================
        // 初始化
        // ============================================
        function init() {
            initScene();
            renderGearLists();
            renderChecklist();
            updateGearStats();
            updateRecommendations();
            updateLocationSummary();
            
            // 设置默认日期为今天
            document.getElementById('hike-date').valueAsDate = new Date();
            
            // 添加事件监听器来更新推荐
            document.getElementById('hike-difficulty').addEventListener('change', updateRecommendations);
            document.getElementById('hike-distance').addEventListener('input', updateRecommendations);
            document.getElementById('hike-weather').addEventListener('change', updateRecommendations);
            
            // 初始化装备位置
            [...gearDatabase.wearable, ...gearDatabase.backpack].forEach(gear => {
                gearLocations[gear.id] = gear.defaultLocation || 'home';
            });
        }
        
        // ============================================
        // 键盘快捷键
        // ============================================
        document.addEventListener('keydown', (e) => {
            // ESC 关闭模态框
            if (e.key === 'Escape') {
                closeModal();
            }
            // R 键重置视角
            if (e.key === 'r' || e.key === 'R') {
                if (controls) {
                    controls.reset();
                    camera.position.set(0, 2, 5);
                    controls.target.set(0, 1, 0);
                }
            }
            // H 键显示帮助
            if (e.key === 'h' || e.key === 'H') {
                showHelp();
            }
        });
        
        // ============================================
        // 显示帮助信息
        // ============================================
        function showHelp() {
            const modal = document.getElementById('gear-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            
            modalTitle.textContent = '⌨️ 快捷键帮助';
            modalBody.innerHTML = `
                <div style="padding: 10px;">
                    <div style="background: #0f3460; padding: 10px; margin: 8px 0; border-radius: 6px;">
                        <strong>ESC</strong> - 关闭弹窗
                    </div>
                    <div style="background: #0f3460; padding: 10px; margin: 8px 0; border-radius: 6px;">
                        <strong>R</strong> - 重置3D视角
                    </div>
                    <div style="background: #0f3460; padding: 10px; margin: 8px 0; border-radius: 6px;">
                        <strong>H</strong> - 显示帮助
                    </div>
                    <div style="background: #0f3460; padding: 10px; margin: 8px 0; border-radius: 6px;">
                        <strong>鼠标左键拖动</strong> - 旋转视角
                    </div>
                    <div style="background: #0f3460; padding: 10px; margin: 8px 0; border-radius: 6px;">
                        <strong>鼠标滚轮</strong> - 缩放视角
                    </div>
                    <div style="background: #0f3460; padding: 10px; margin: 8px 0; border-radius: 6px;">
                        <strong>点击3D装备</strong> - 查看装备详情
                    </div>
                </div>
            `;
            modal.style.display = 'flex';
        }
        
        // 页面加载完成后初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
