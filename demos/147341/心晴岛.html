<style>
:root {
  --bg-card: #ffffff;
  --accent-coral: #f472b6;
  --accent-blue: #60a5fa;
  --accent-green: #34d399;
  --accent-yellow: #fbbf24;
  --accent-red: #f87171;
  --accent-purple: #a78bfa;

  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.03);
  --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.02);

* { margin: 0; padding: 0; box-sizing: border-box; }

.scene-bg {

.scene-bg-default { background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 30%, #fed7aa 60%, #fdba74 100%); }

.scene-bg-normal { background: linear-gradient(135deg, #fefce8 0%, #fef9c3 30%, #fef08a 60%, #fde047 100%); }
.scene-bg-upset { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 20%, #bae6fd 40%, #7dd3fc 60%, #38bdf8 80%, #0ea5e9 100%); }

@keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }

@keyframes petalFall { 0% { transform: translateY(-20px) rotate(0deg) translateX(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.6; } 100% { transform: translateY(100vh) rotate(360deg) translateX(50px); opacity: 0; } }
.petal { position: fixed; border-radius: 50% 0 50% 0; animation: petalFall linear infinite; pointer-events: none; z-index: 0; }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.float-animation { animation: float 3s ease-in-out infinite; }

@keyframes slide-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo, useCallback, createContext, useContext } = React;

// ==================== 工具函数 ====================
const EMOTION_MUSIC = {

  calm: { label: '平静', tracks: [{ name: '湖畔微风', url: 'https://cdn.pixabay.com/audio/2024/09/12/audio_78b40ee41a.mp3' }] },
  normal: { label: '一般', tracks: [{ name: '午后时光', url: 'https://cdn.pixabay.com/audio/2023/10/07/audio_41b61897a1.mp3' }] },

const EMOTION_GUIDANCE = {

  upset: ['烦躁的时候，试试深呼吸三次：吸气4秒、屏住4秒、呼气4秒。让身体先放松下来。','每个人都会有烦躁的时候，这不代表你不好。试着去散散步，看看窗外的风景。','烦躁是暂时的，它会过去的。给自己一些空间，做几个深呼吸就好。'],
  sad: ['难过的时候，允许自己哭出来。眼泪是心灵的一种清洗方式，哭过之后会好受一些。','你现在的感受是真实的、合理的。记得，你并不孤单，有人在关心你。','难过说明你在乎。给自己一个温暖的拥抱，或者画一幅画来表达自己的感受。'],
  anxious: ['焦虑的时候，试试5-4-3-2-1法：说出5样看到的、4样摸到的、3样听到的、2样闻到的、1样尝到的。','感到焦虑很正常，这说明你在乎一些事情。试着把担心的事写下来，一个一个去面对。','深呼吸，慢慢来。你比想象中更强大。每一个焦虑的时刻，都是你变得更勇敢的机会。'],
};
function getEmotionGuidance(type) {
  const msgs = EMOTION_GUIDANCE[type];
  if (!msgs) return { message: '每个人都会有不同的情绪，接纳它就好。' };
  return { message: msgs[Math.floor(Math.random() * msgs.length)] };
}

const CRISIS_L3 = ['自杀','不想活','想死','活不下去','割腕','跳楼','安眠药','一了百了','死'];
const CRISIS_L2 = ['自残','自虐','伤害自己','不想吃饭','睡不着','天天哭','绝望','崩溃','痛苦'];
const CRISIS_L1 = ['难过','烦','不想上学','害怕','孤独','压力','累','无聊','不开心'];
function detectCrisis(text) {
  if (!text) return { isCrisis: false, level: 0, message: '' };
  const t = text.toLowerCase();
  for (const k of CRISIS_L3) if (t.includes(k)) return { isCrisis: true, level: 3, message: '我们非常担心你现在的状态。你并不孤单，有人愿意帮助你。请立即拨打 12355 青少年服务热线，或者告诉身边信任的大人。' };
  for (const k of CRISIS_L2) if (t.includes(k)) return { isCrisis: true, level: 2, message: '看起来你现在经历了一些困难。和信任的人聊聊会好受很多。如果需要帮助，可以拨打 12355 青少年服务热线。' };
  for (const k of CRISIS_L1) if (t.includes(k)) return { isCrisis: true, level: 1, message: '每个人都会有不开心的时候，这很正常。试试做些让自己放松的事情吧，比如深呼吸或者画幅画。' };
  return { isCrisis: false, level: 0, message: '' };
}

const DARK_EMOTIONS = new Set(['sad', 'upset', 'anxious']);
const EMOTION_VOLUME = { happy: 0.6, calm: 0.3, normal: 0.4, upset: 0.35, sad: 0.25, anxious: 0.3 };

const EMOTIONS = [
  { key: 'happy', emoji: '😊', label: '开心', color: '#f472b6', gradient: 'linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%)' },
  { key: 'calm', emoji: '😌', label: '平静', color: '#2dd4bf', gradient: 'linear-gradient(135deg, #ecfeff 0%, #cffafe 100%)' },
  { key: 'normal', emoji: '😐', label: '一般', color: '#fbbf24', gradient: 'linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%)' },
  { key: 'upset', emoji: '😤', label: '烦躁', color: '#f87171', gradient: 'linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%)' },
  { key: 'sad', emoji: '😢', label: '难过', color: '#a78bfa', gradient: 'linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%)' },
  { key: 'anxious', emoji: '😰', label: '焦虑', color: '#60a5fa', gradient: 'linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%)' },
];

// ==================== 场景背景 ====================
function SceneParticles({ emotion }) {
  const particles = useMemo(() => {
    if (emotion === 'upset') {
      return Array.from({ length: 40 }, (_, i) => ({ key: 'rain-'+i, className: 'rain-drop', style: { left: Math.random()*100+'%', height: (15+Math.random()*25)+'px', animationDuration: (0.6+Math.random()*0.8)+'s', animationDelay: Math.random()*3+'s' } }));
    }
    if (emotion === 'sad') {
      return Array.from({ length: 60 }, (_, i) => ({ key: 'star-'+i, className: 'star', style: { left: Math.random()*100+'%', top: Math.random()*70+'%', animationDuration: (2+Math.random()*4)+'s', animationDelay: Math.random()*5+'s', width: (1+Math.random()*2)+'px', height: (1+Math.random()*2)+'px' } }));
    }
    if (emotion === 'happy') {
      const colors = ['#ffb6b6','#ffd1dc','#ffe0e0','#f0b89a','#fcb69f'];
      return Array.from({ length: 15 }, (_, i) => ({ key: 'petal-'+i, className: 'petal', style: { left: Math.random()*100+'%', animationDuration: (6+Math.random()*8)+'s', animationDelay: Math.random()*10+'s', background: colors[Math.floor(Math.random()*5)], width: (4+Math.random()*5)+'px', height: (4+Math.random()*5)+'px' } }));
    }
    return null;
  }, [emotion]);
  if (!particles) return null;
  return particles.map(p => React.createElement('div', { key: p.key, className: p.className, style: p.style }));
}

function SceneBackground({ emotion }) {
  const sceneClass = emotion ? 'scene-bg-'+emotion : 'scene-bg-default';
  return React.createElement(React.Fragment, null,
    React.createElement('div', { className: 'scene-bg '+sceneClass }),
    React.createElement(SceneParticles, { emotion })
  );
}

// ==================== 音乐播放器 ====================
function MusicPlayer({ currentEmotion }) {
  const [playing, setPlaying] = useState(false);
  const [currentTrack, setCurrentTrack] = useState(null);
  const audioRef = useRef(null);
  const prevEmotionRef = useRef(null);
  const config = getEmotionConfig(currentEmotion);
  const track = config.tracks[0];
  const targetVolume = EMOTION_VOLUME[currentEmotion] || 0.4;

  useEffect(() => {
    const audio = audioRef.current;
    if (!audio || !track) return;
    if (currentEmotion && currentEmotion !== prevEmotionRef.current) {
      audio.src = track.url;
      audio.volume = targetVolume;
      audio.play().catch(() => {});
      setCurrentTrack(track);
      setPlaying(true);
      prevEmotionRef.current = currentEmotion;
    } else if (currentEmotion === prevEmotionRef.current && playing) {
      audio.volume = targetVolume;
    }
  }, [currentEmotion, track, targetVolume, playing]);

  function togglePlay() {
    const audio = audioRef.current;
    if (!audio) return;
    if (playing) { audio.pause(); setPlaying(false); }
    else { audio.src = track.url; audio.volume = targetVolume; audio.play().catch(() => {}); setCurrentTrack(track); setPlaying(true); }
  }

  const sceneEmoji = { happy: '🌅', calm: '🍃', normal: '☁️', upset: '🌧️', sad: '🌙', anxious: '🌊' };
  if (!currentEmotion) return null;

  return React.createElement('div', { className: 'fixed bottom-20 left-1/2 -translate-x-1/2 z-40' },
    React.createElement('div', { className: 'flex items-center gap-4 px-6 py-3 rounded-full', style: { background: playing ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.7)', backdropFilter: 'blur(16px)', border: '1px solid rgba(0,0,0,0.08)', boxShadow: playing ? '0 4px 20px rgba(0,0,0,0.1)' : '0 2px 12px rgba(0,0,0,0.06)' } },
      React.createElement('span', { className: 'text-lg', style: { animation: 'pulse 2s ease-in-out infinite' } }, sceneEmoji[currentEmotion] || '🎵'),
      React.createElement('div', { className: 'text-xs', style: { color: '#4b5563', maxWidth: '140px' } },
        React.createElement('div', { className: 'font-medium', style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, currentTrack?.name || track.name),
        React.createElement('div', { style: { overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: '#6b7280', fontSize: '11px' } }, config.label + '模式 · 点击关闭')
      ),
      React.createElement('button', { onClick: togglePlay, className: 'w-10 h-10 rounded-full flex items-center justify-center transition-all duration-200', style: { background: playing ? 'linear-gradient(135deg, #f472b6 0%, #ec4899 100%)' : 'rgba(244,114,182,0.15)', color: playing ? '#fff' : '#f472b6', boxShadow: playing ? '0 3px 12px rgba(244,114,182,0.4)' : 'none', transform: playing ? 'scale(1)' : 'scale(0.95)' } },
        playing ? React.createElement('svg', { width: '12', height: '12', viewBox: '0 0 12 12', fill: 'currentColor' }, React.createElement('rect', { x: '1', y: '1', width: '3.5', height: '10', rx: '1' }), React.createElement('rect', { x: '7.5', y: '1', width: '3.5', height: '10', rx: '1' }))
               : React.createElement('svg', { width: '12', height: '12', viewBox: '0 0 12 12', fill: 'currentColor' }, React.createElement('path', { d: 'M2 1.5v9l8-4.5z' }))
      )
    ),
    React.createElement('audio', { ref: audioRef, loop: true, preload: 'auto' })
  );
}

// ==================== 布局 ====================
function Layout({ currentPage, onNavigate, isDark, children }) {
  const navItems = [
    { key: 'checkin', label: '情绪签到', emoji: '☀️' },
    { key: 'healing', label: '趣味疗愈', emoji: '🎨' },
    { key: 'chat', label: 'AI 陪伴', emoji: '🌟' },
    { key: 'growth', label: '成长档案', emoji: '🌱' },
    { key: 'safety', label: '安全说明', emoji: '🛡️' },
  ];
  const subTextColor = isDark ? '#9ca3af' : '#6b7280';
  const navBg = isDark ? 'rgba(17,24,39,0.7)' : 'rgba(255,255,255,0.6)';
  const activeGradient = 'linear-gradient(135deg, #f472b6 0%, #ec4899 100%)';
  const inactiveBg = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.7)';
  const inactiveColor = isDark ? '#d1d5db' : '#4b5563';
  const footerBg = isDark ? 'rgba(17,24,39,0.5)' : 'rgba(255,255,255,0.4)';

  return React.createElement('div', { className: 'min-h-screen flex flex-col' },
    React.createElement('nav', { className: 'sticky top-0 z-50', style: { background: navBg, backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)', borderBottom: isDark ? '1px solid rgba(255,255,255,0.06)' : '1px solid rgba(0,0,0,0.04)' } },
      React.createElement('div', { style: { maxWidth: '36rem', margin: '0 auto', padding: '20px 24px' } },
        React.createElement('div', { className: 'flex items-center justify-center' },
          React.createElement('button', { onClick: () => onNavigate('home'), className: 'flex items-center gap-2' },
            React.createElement('span', { className: 'float-animation', style: { fontSize: '24px', animationDelay: '0.5s' } }, '🏝️'),
            React.createElement('span', { style: { fontSize: '20px', fontWeight: 700, background: 'linear-gradient(135deg, #f472b6 0%, #ec4899 50%, #8b5cf6 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text' } }, '心晴岛')
          )
        ),
        React.createElement('div', { className: 'no-scrollbar flex items-center justify-center gap-3 mt-5 overflow-x-auto pb-1' },
          navItems.map((item, index) => 
            React.createElement('button', {
              key: item.key, onClick: () => onNavigate(item.key),
              className: 'flex items-center gap-1.5 rounded-full text-sm whitespace-nowrap transition-all duration-300',
              style: {
                background: currentPage === item.key ? activeGradient : inactiveBg,
                color: currentPage === item.key ? '#fff' : inactiveColor,
                fontWeight: currentPage === item.key ? 600 : 500,
                padding: '10px 20px',
                boxShadow: currentPage === item.key ? '0 4px 16px rgba(244,114,182,0.35)' : 'none',
                transform: currentPage === item.key ? 'scale(1.05)' : 'scale(1)',
                opacity: 0,
                animation: 'slide-up 0.4s ease-out ' + (0.1 + index * 0.05) + 's forwards'
              }
            }, React.createElement('span', { style: { fontSize: '14px' } }, item.emoji), ' ', item.label)
          )
        )
      )
    ),
    React.createElement('main', { style: { flex: 1, width: '100%', maxWidth: '36rem', margin: '0 auto', padding: '32px 24px' } }, children),
    React.createElement('footer', { className: 'text-center', style: { background: footerBg, backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)', borderTop: isDark ? '1px solid rgba(255,255,255,0.06)' : '1px solid rgba(0,0,0,0.04)', padding: '24px 24px' } },
      React.createElement('p', { className: 'text-xs', style: { color: subTextColor, lineHeight: 1.7 } },
        '💛 心晴岛是心理辅导的辅助工具，不能替代真人心理咨询。如需帮助，请拨打 ',
        React.createElement('span', { style: { fontWeight: 700, color: '#f472b6' } }, '12355'),
        ' 青少年服务热线'
      )
    )
