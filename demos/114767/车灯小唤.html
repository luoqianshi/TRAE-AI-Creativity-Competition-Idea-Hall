<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>车灯小唤</title>
  <style>
    :root {
      --bg-primary: #1a1e25;
      --bg-card: #252a32;
      --bg-input: #303640;
      --text-primary: #e6e9ed;
      --text-secondary: #9aa0a9;
      --accent-blue: #4cc9f0;
      --accent-warm: #f72585;
      --accent-purple: #7209b7;
      --border-radius: 16px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s ease;
    }

    .theme-light {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --bg-input: #f1f3f5;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0;
    }

    .theme-toggle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-card);
      border: none;
      color: var(--text-primary);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin: 28px 0 16px;
      color: var(--text-primary);
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .voice-input-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .mic-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-blue), #4361ee);
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(76, 201, 240, 0.3);
      transition: var(--transition);
    }

    .mic-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 16px rgba(76, 201, 240, 0.4);
    }

    .input-field {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: none;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
    }

    .input-field:focus {
      background: #3a414e;
      box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.2);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-warm), #b5179e);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 1rem;
      margin-top: 12px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(247, 37, 133, 0.25);
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(247, 37, 133, 0.35);
    }

    .light-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-top: 16px;
    }

    .preview-ball {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #4cc9f0, #4361ee);
      box-shadow: 
        0 0 40px rgba(76, 201, 240, 0.5),
        0 0 80px rgba(76, 201, 240, 0.3);
      position: relative;
      overflow: hidden;
      transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .preview-ball::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120%;
      height: 120%;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
      transform: translate(-50%, -50%);
    }

    .preview-info {
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-secondary);
      max-width: 320px;
      line-height: 1.5;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }

    .mode-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      border-color: rgba(76, 201, 240, 0.4);
    }

    .mode-btn i {
      display: block;
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: var(--accent-blue);
    }

    .mode-btn[data-mode="kid"] i { color: var(--accent-warm); }
    .mode-btn[data-mode="commute"] i { color: #4cc9f0; }
    .mode-btn[data-mode="starry"] i { color: var(--accent-purple); }

    .instructions {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Responsive */
    @media (max-width: 600px) {
      body { padding: 16px; }
      h1 { font-size: 1.5rem; }
      .preview-ball { width: 200px; height: 200px; }
      .voice-input-group { flex-direction: column; }
      .mic-btn { width: 48px; height: 48px; font-size: 1.3rem; }
      .mode-grid { grid-template-columns: 1fr; }
    }

    @media (min-width: 601px) and (max-width: 900px) {
      .preview-ball { width: 260px; height: 260px; }
      .voice-input-group { flex-direction: row; }
    }

    /* Animation for breathing effect */
    @keyframes breathe {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    .breathing {
      animation: breathe 4s ease-in-out infinite;
    }

    /* Status badge */
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 8px;
      background: rgba(76, 201, 240, 0.2);
      color: var(--accent-blue);
    }

    .status.listening {
      background: rgba(247, 37, 133, 0.2);
      color: var(--accent-warm);
    }

    .status.processing {
      background: rgba(114, 9, 183, 0.2);
      color: var(--accent-purple);
    }

    .status.ready {
      background: rgba(76, 201, 240, 0.2);
      color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>车灯小唤</h1>
      <button class="theme-toggle" id="themeToggle" title="切换深色/浅色主题">☀️</button>
    </header>

    <main>
      <section class="card">
        <h2 class="section-title">说一句，灯就懂</h2>
        <p>无需记住RGB值，不用翻菜单——对手机说人话，3秒完成氛围调节。</p>
        
        <div class="voice-input-group">
          <button class="mic-btn" id="micBtn" title="点击开始语音输入">🎤</button>
          <input type="text" class="input-field" id="voiceInput" placeholder="例如：把灯调暗一点，加点青色..." value="" readonly />
        </div>
        
        <button class="send-btn" id="sendBtn">发送指令</button>
      </section>

      <section class="card">
        <h2 class="section-title">实时灯光预览</h2>
        <div class="light-preview">
          <div class="preview-ball" id="previewBall"></div>
          <div class="preview-info">
            当前效果：<span id="previewText">青蓝色 · 中等亮度 · 呼吸节奏</span><br>
            <span class="status ready" id="statusBadge">准备就绪</span>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 class="section-title">一键常用模式</h2>
        <div class="mode-grid">
          <button class="mode-btn" data-mode="kid">
            👶 接娃模式<br><small>柔紫光 · 低亮度 · 无闪烁</small>
          </button>
          <button class="mode-btn" data-mode="commute">
            🚗 通勤模式<br><small>冷白光 · 中高亮度 · 均匀常亮</small>
          </button>
          <button class="mode-btn" data-mode="starry">
            ✨ 星空模式<br><small>深蓝渐变 · 低频呼吸 · 柔光晕</small>
          </button>
        </div>
      </section>

      <div class="instructions">
        <p>💡 提示：本页为本地演示版，所有交互均为前端模拟。真实使用请在微信中搜索「车灯小唤」小程序，搭配蓝牙LED控制器即可即刻启用。</p>
      </div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const themeToggle = document.getElementById('themeToggle');
      const micBtn = document.getElementById('micBtn');
      const voiceInput = document.getElementById('voiceInput');
      const sendBtn = document.getElementById('sendBtn');
      const previewBall = document.getElementById('previewBall');
      const previewText = document.getElementById('previewText');
      const statusBadge = document.getElementById('statusBadge');
      const modeBtns = document.querySelectorAll('.mode-btn');

      // 初始化主题
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('theme-light');
        themeToggle.textContent = '🌙';
      }

      // 切换主题
      themeToggle.addEventListener('click', function () {
        if (document.body.classList.contains('theme-light')) {
          document.body.classList.remove('theme-light');
          localStorage.setItem('theme', 'dark');
          themeToggle.textContent = '☀️';
        } else {
          document.body.classList.add('theme-light');
          localStorage.setItem('theme', 'light');
          themeToggle.textContent = '🌙';
        }
      });

      // 模拟语音输入
      micBtn.addEventListener('click', function () {
        statusBadge.textContent = '正在收听...';
        statusBadge.className = 'status listening';
        voiceInput.value = '';

        // 模拟识别延迟
        setTimeout(() => {
          const phrases = [
            "调成温柔的米色，亮度六成",
            "换成暖黄色，亮度减半",
            "来个星空蓝，呼吸慢一点",
            "把灯调暗一点，加点青色",
            "接孩子用柔和紫光，别太亮"
          ];
          const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
          voiceInput.value = randomPhrase;
          statusBadge.textContent = '已识别';
          statusBadge.className = 'status processing';
        }, 1200);
      });

      // 发送指令
      sendBtn.addEventListener('click', function () {
        const input = voiceInput.value.trim();
        if (!input) return;

        statusBadge.textContent = '执行中...';
        statusBadge.className = 'status processing';

        // 模拟解析与执行（300ms）
        setTimeout(() => {
          // 解析关键词（简化逻辑）
          let color = '#4cc9f0'; // default blue
          let brightness = 0.7;
          let rhythm = '呼吸节奏';
          let desc = '青蓝色 · 中等亮度 · 呼吸节奏';

          if (input.includes('米色') || input.includes('暖黄') || input.includes('温柔')) {
            color = '#ffd166';
            brightness = input.includes('减半') ? 0.5 : 0.6;
            desc = '暖黄色 · 中低亮度 · 呼吸节奏';
          } else if (input.includes('紫') || input.includes('接娃')) {
            color = '#b5179e';
            brightness = 0.4;
            desc = '柔紫色 · 低亮度 · 无闪烁';
            rhythm = '常亮';
          } else if (input.includes('星空') || input.includes('蓝')) {
            color = '#4361ee';
            brightness = 0.5;
            rhythm = '慢呼吸';
            desc = '星空蓝 · 中低亮度 · 慢呼吸';
          } else if (input.includes('青') || input.includes('暗')) {
            color = '#4cc9f0';
            brightness = input.includes('暗') ? 0.4 : 0.7;
            desc = '青蓝色 · 中低亮度 · 呼吸节奏';
          }

          // 更新预览球样式
          previewBall.style.background = `radial-gradient(circle at 30% 30%, ${color}, ${darkenColor(color, 0.3)})`;
          previewBall.style.boxShadow = `0 0 40px ${fadeColor(color, 0.5)}, 0 0 80px ${fadeColor(color, 0.3)}`;
          previewBall.classList.add('breathing');

          // 更新文本
          previewText.textContent = desc;
          statusBadge.textContent = '已生效';
          statusBadge.className = 'status ready';
        }, 300);
      });

      // 模式快捷按钮
      modeBtns.forEach(btn => {
        btn.addEventListener('click', function () {
          const mode = this.getAttribute('data-mode');
          let phrase = '';
          let color = '';
          let brightness = 0.7;
          let desc = '';

          switch (mode) {
            case 'kid':
              phrase = '接孩子用柔和紫光，别太亮';
              color = '#b5179e';
              brightness = 0.4;
              desc = '柔紫色 · 低亮度 · 无闪烁';
              break;
            case 'commute':
              phrase = '通勤用冷白光，亮度七成';
              color = '#e6e9ed';
              brightness = 0.7;
              desc = '冷白光 · 中高亮度 · 均匀常亮';
              break;
            case 'starry':
              phrase = '来个星空蓝，呼吸慢一点';
              color = '#4361ee';
              brightness = 0.5;
              desc = '星空蓝 · 中低亮度 · 慢呼吸';
              break;
          }

          voiceInput.value = phrase;
          previewBall.style.background = `radial-gradient(circle at 30% 30%, ${color}, ${darkenColor(color, 0.3)})`;
          previewBall.style.boxShadow = `0 0 40px ${fadeColor(color, 0.5)}, 0 0 80px ${fadeColor(color, 0.3)}`;
          previewBall.classList.add('breathing');
          previewText.textContent = desc;
          statusBadge.textContent = '已生效';
          statusBadge.className = 'status ready';
        });
      });

      // 工具函数
      function darkenColor(hex, factor) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `#${Math.max(0, Math.floor(r * (1 - factor))).toString(16).padStart(2, '0')}${Math.max(0, Math.floor(g * (1 - factor))).toString(16).padStart(2, '0')}${Math.max(0, Math.floor(b * (1 - factor))).toString(16).padStart(2, '0')}`;
      }

      function fadeColor(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
      }

      // 初始化预览球
      previewBall.style.background = `radial-gradient(circle at 30% 30%, #4cc9f0, #4361ee)`;
      previewBall.style.boxShadow = `0 0 40px rgba(76, 201, 240, 0.5), 0 0 80px rgba(76, 201, 240, 0.3)`;
    });
  </script>
</body>
</html>
