<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>卸妆指南</title>
  <style>
    :root {
      --bg-primary: #fdeff2;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #6a6170;
      --accent: #e96b9c;
      --border: #f1e7eb;
      --shadow: 0 4px 12px rgba(233, 107, 156, 0.08);
      --transition: all 0.25s ease;
      --radius: 16px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --font-title: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --font-body: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .dark-mode {
      --bg-primary: #2d2535;
      --bg-card: #3e3546;
      --text-primary: #f8f5f9;
      --text-secondary: #c5bdcf;
      --accent: #e96b9c;
      --border: #4a3f55;
      --shadow: 0 4px 12px rgba(74, 63, 85, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 0;
      transition: var(--transition);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Header */
    header {
      width: 100%;
      max-width: 640px;
      padding: var(--spacing-lg) var(--spacing-md);
      text-align: center;
      margin-bottom: var(--spacing-md);
    }

    h1 {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 500px;
      margin: 0 auto;
    }

    /* Main Content */
    main {
      width: 100%;
      max-width: 640px;
      padding: 0 var(--spacing-md);
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--spacing-lg);
    }

    /* Style Selector */
    .style-selector {
      display: flex;
      justify-content: center;
      gap: var(--spacing-sm);
      flex-wrap: wrap;
      margin-bottom: var(--spacing-md);
    }

    .style-btn {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 50px;
      padding: 10px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      box-shadow: var(--shadow);
      outline: none;
    }

    .style-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .style-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(233, 107, 156, 0.25);
    }

    .style-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Steps Section */
    .steps-container {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow);
      margin-top: var(--spacing-md);
    }

    .steps-header {
      text-align: center;
      margin-bottom: var(--spacing-lg);
    }

    .steps-header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
    }

    .steps-header p {
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .step {
      display: flex;
      margin-bottom: var(--spacing-lg);
      padding-bottom: var(--spacing-lg);
      border-bottom: 1px dashed var(--border);
      last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
    }

    .step-number {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      margin-right: var(--spacing-md);
      flex: 0 0 auto;
    }

    .step-content {
      flex: 1;
      min-width: 0;
    }

    .step-title {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: var(--spacing-sm);
      color: var(--text-primary);
    }

    .step-desc {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-md);
      line-height: 1.5;
    }

    .direction-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: var(--spacing-sm);
    }

    .dir-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
      outline: none;
    }

    .dir-btn:hover:not(:disabled) {
      background: var(--accent);
      color: white;
      transform: scale(1.05);
    }

    .dir-btn.active {
      background: var(--accent);
      color: white;
      animation: pulse 0.8s ease-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
      outline: none;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
      fill: var(--text-primary);
      transition: var(--transition);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: var(--spacing-lg) var(--spacing-md);
      font-size: 0.85rem;
      color: var(--text-secondary);
      width: 100%;
      max-width: 640px;
      margin-top: auto;
    }

    /* Responsive */
    @media (max-width: 480px) {
      h1 {
        font-size: 1.6rem;
      }
      .subtitle {
        font-size: 0.9rem;
      }
      .style-btn {
        padding: 8px 16px;
        font-size: 0.8rem;
      }
      .step-number {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
      .theme-toggle {
        width: 48px;
        height: 48px;
        bottom: 16px;
        right: 16px;
      }
    }

    /* Utility */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Animation for step highlight */
    .step-highlight {
      animation: highlight 1.2s ease-out;
    }

    @keyframes highlight {
      0% { background-color: transparent; }
      50% { background-color: rgba(233, 107, 156, 0.1); }
      100% { background-color: transparent; }
    }

    /* Initial load fade-in */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      z-index: -1;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    body.loaded::before {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body class="loaded">
  <header>
    <h1>卸妆指南</h1>

  </header>

  <main>
    <div class="style-selector">
      <button type="button" class="style-btn active" data-style="light">
        <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.59-1.59zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM17.657 18.894a.75.75 0 001.06-1.06l-1.59-1.59a.75.75 0 10-1.06 1.06l1.59 1.59zM12 18a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM7.757 17.303a.75.75 0 00-1.061-1.06l-1.59 1.59a.75.75 0 001.06 1.06l1.59-1.59z"/></svg>

      <div class="step" id="step1">

          <p class="step-desc">唇釉需用含油分的卸妆产品（如卸妆膏）。棉签蘸取后沿唇线打圈，避免横向拉扯造成唇纹加深。勿用纸巾猛擦！</p>

      <div class="step" id="step3">
        <div class="step-number">3</div>
        <div class="step-content">
          <h3 class="step-title">最后洁面</h3>
          <p class="step-desc">用氨基酸洁面乳起泡后，以指腹打圈清洁T区与下巴。避开眼周！残余卸妆产品会加剧干燥脱皮。</p>
          <div class="direction-controls">
            <button type="button" class="dir-btn" data-dir="↻">↻</button>
            <button type="button" class="dir-btn" data-dir="↺">↺</button>
            <button type="button" class="dir-btn" data-dir="→">→</button>
            <button type="button" class="dir-btn" data-dir="←">←</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>轻量版体验 · 无需安装 · 离线可用</p>

  <button type="button" class="theme-toggle" aria-label="切换深色/浅色主题">
    <svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.162a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.59-1.59zM21.75 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM17.657 18.894a.75.75 0 001.06-1.06l-1.59-1.59a.75.75 0 10-1.06 1.06l1.59 1.59zM12 18a4.5 4.5 0 110-9 4.5 4.5 0 010 9zM7.757 17.303a.75.75 0 00-1.061-1.06l-1.59 1.59a.75.75 0 001.06 1.06l1.59-1.59z"/></svg>
  </button>

  <script>
    // Theme toggle
    const themeToggle = document.querySelector('.theme-toggle');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-mode');
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // Style selector
    const styleBtns = document.querySelectorAll('.style-btn');
    const steps = [document.getElementById('step1'), document.getElementById('step2'), document.getElementById('step3')];

    // Default content for light makeup
    const contentMap = {
      light: [
        {
          title: "先卸眼妆",
          desc: "用眼部专用卸妆液浸透棉片，闭眼轻敷5秒再由内向外滑动擦拭。重点清洁睫毛根部与眼尾三角区——此处易残留防水成分。",
          dirs: ['←', '→', '↗', '↓']
        },
        {
          title: "再卸唇妆",
          desc: "唇釉需用含油分的卸妆产品（如卸妆膏）。棉签蘸取后沿唇线打圈，避免横向拉扯造成唇纹加深。勿用纸巾猛擦！",
          dirs: ['↺', '↻', '↓', '↑']
        },
        {
          title: "最后洁面",
          desc: "用氨基酸洁面乳起泡后，以指腹打圈清洁T区与下巴。避开眼周！残余卸妆产品会加剧干燥脱皮。",
          dirs: ['↻', '↺', '→', '←']
        }
      ],
      smoky: [
        {
          title: "先卸假睫毛胶",
          desc: "用棉签蘸取少量眼部卸妆液，沿假睫毛根部轻点3次软化胶水，再缓慢向上揭除。切勿生拉！",
          dirs: ['↑', '↗', '↖', '•']
        },
        {
          title: "重点卸眼线+睫毛膏",
          desc: "用卸妆棉片包裹下眼睑，向上轻压并颤动3秒溶解防水成分。再用棉签清理眼头与睫毛根部细缝。",
          dirs: ['↑', '→', '←', '↻']
        },
        {
          title: "温和洁面收尾",
          desc: "使用低泡弱酸洁面，避开眼周按摩。冲洗后用冷毛巾轻按眼周收缩毛细血管，减少泛红。",
          dirs: ['↻', '↺', '↓', '↑']
        }
      ],
      waterproof: [
        {
          title: "睫毛膏打底预处理",
          desc: "干棉片轻压睫毛根部3秒吸走表面油脂，再上卸妆液——避免晕染。重点处理眼尾上扬处。",
          dirs: ['→', '↗', '↘', '•']
        },
        {
          title: "唇釉分区卸除",
          desc: "先用卸妆膏厚敷唇面30秒，再用棉签从唇中向边缘滚动。唇线处用尖头棉签垂直轻点3次。",
          dirs: ['→', '←', '↑', '↓']
        },
        {
          title: "二次清洁T区",
          desc: "用化妆棉蘸爽肤水轻擦鼻翼与额头，带走残留卸妆油膜。后续护肤吸收更佳。",
          dirs: ['→', '←', '↻', '↺']
        }
      ]
    };

    styleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        // Remove active from all
        styleBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const style = btn.dataset.style;
        const content = contentMap[style];

        // Update each step
        steps.forEach((step, i) => {
          const titleEl = step.querySelector('.step-title');
          const descEl = step.querySelector('.step-desc');
          const dirCtrls = step.querySelector('.direction-controls');

          titleEl.textContent = content[i].title;
          descEl.textContent = content[i].desc;

          // Clear and repopulate direction buttons
          dirCtrls.innerHTML = '';
          content[i].dirs.forEach(dir => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'dir-btn';
            btn.textContent = dir;
            btn.dataset.dir = dir;
            dirCtrls.appendChild(btn);
          });

          // Reattach event listeners to new buttons
          const newDirBtns = step.querySelectorAll('.dir-btn');
          newDirBtns.forEach(b => {
            b.addEventListener('click', function() {
              // Remove active from all in this step
              newDirBtns.forEach(d => d.classList.remove('active'));
              this.classList.add('active');
              // Add highlight animation to step
              step.classList.add('step-highlight');
              setTimeout(() => step.classList.remove('step-highlight'), 1200);
            });
          });
        });
      });
    });

    // Initialize first step's direction buttons with click handlers
    const initDirBtns = (step) => {
      const dirBtns = step.querySelectorAll('.dir-btn');
      dirBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          dirBtns.forEach(d => d.classList.remove('active'));
          this.classList.add('active');
          step.classList.add('step-highlight');
          setTimeout(() => step.classList.remove('step-highlight'), 1200);
        });
      });
    };

    steps.forEach(initDirBtns);

    // Set initial focus on first style button for accessibility
    styleBtns[0].focus();
  </script>
</body>
