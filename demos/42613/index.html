<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭菜单</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 头部 -->
        <header class="header">
            <h1>家庭菜单</h1>
            <div class="header-actions">
                <button class="btn-icon" id="searchBtn" title="搜索">🔍</button>
                <button class="btn-icon" id="addBtn" title="添加菜品">+</button>
            </div>
        </header>

        <!-- 搜索栏 -->
        <div class="search-bar" id="searchBar" style="display: none;">
            <input type="text" id="searchInput" placeholder="搜索菜品名称或食材...">
            <button class="btn-icon" id="closeSearchBtn">✕</button>
        </div>

        <!-- 分类标签 -->
        <div class="category-tabs">
            <button class="tab-btn active" data-category="all">全部</button>
            <button class="tab-btn" data-category="meat">荤菜</button>
            <button class="tab-btn" data-category="vegetable">素菜</button>
            <button class="tab-btn" data-category="soup">汤羹</button>
            <button class="tab-btn" data-category="staple">主食</button>
            <button class="tab-btn" data-category="snack">小吃</button>
        </div>

        <!-- 菜单列表 -->
        <div class="menu-list" id="menuList">
            <!-- 动态生成 -->
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">🍽️</div>
            <p>还没有菜品，点击右上角添加吧！</p>
        </div>

        <!-- 添加/编辑菜品模态框 -->
        <div class="modal" id="dishModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">添加菜品</h2>
                    <button class="btn-icon" id="closeModalBtn">✕</button>
                </div>
                <form id="dishForm">
                    <input type="hidden" id="dishId">
                    <div class="form-group">
                        <label for="dishName">菜品名称 *</label>
                        <input type="text" id="dishName" required placeholder="请输入菜品名称">
                    </div>
                    <div class="form-group">
                        <label for="dishCategory">分类 *</label>
                        <select id="dishCategory" required>
                            <option value="meat">荤菜</option>
                            <option value="vegetable">素菜</option>
                            <option value="soup">汤羹</option>
                            <option value="staple">主食</option>
                            <option value="snack">小吃</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dishIngredients">主要食材</label>
                        <textarea id="dishIngredients" rows="2" placeholder="请输入主要食材，用逗号分隔"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="dishSteps">制作步骤</label>
                        <textarea id="dishSteps" rows="4" placeholder="请输入制作步骤"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="dishTime">制作时间（分钟）</label>
                        <input type="number" id="dishTime" min="1" placeholder="例如：30">
                    </div>
                    <div class="form-group">
                        <label for="dishImage">图片链接</label>
                        <input type="text" id="dishImage" placeholder="请输入图片URL（可选）">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" id="cancelBtn">取消</button>
                        <button type="submit" class="btn-primary">保存</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 菜品详情模态框 -->
        <div class="modal" id="detailModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="detailTitle">菜品详情</h2>
                    <button class="btn-icon" id="closeDetailBtn">✕</button>
                </div>
                <div class="detail-content" id="detailContent">
                    <!-- 动态生成 -->
                </div>
                <div class="detail-actions">
                    <button class="btn-secondary" id="editDishBtn">编辑</button>
                    <button class="btn-danger" id="deleteDishBtn">删除</button>
                </div>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-page="menu">
                <span class="nav-icon">📋</span>
                <span class="nav-text">菜单</span>
            </button>
            <button class="nav-item" data-page="favorites">
                <span class="nav-icon">⭐</span>
                <span class="nav-text">收藏</span>
            </button>
            <button class="nav-item" data-page="planner">
                <span class="nav-icon">📅</span>
                <span class="nav-text">计划</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
