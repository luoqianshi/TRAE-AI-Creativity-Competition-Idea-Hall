<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能设备监控系统 - Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --color-primary: #22c55e;
      --color-primary-dark: #16a34a;
      --color-secondary: #3b82f6;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --color-success: #10b981;
      --color-bg-dark: #0f172a;
      --color-bg-card: #1e293b;
      --color-bg-surface: #334155;
      --color-text-primary: #f1f5f9;
      --color-text-secondary: #94a3b8;
      --color-border: #475569;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: var(--color-text-primary);
      overflow-x: hidden;
    }

    .glow-bg {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(34, 197, 94, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      animation: fadeInDown 0.6s ease;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
    }

    .logo-text h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-text p {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .header-badge {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--color-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-badge span {
      width: 8px;
      height: 8px;
      background: var(--color-primary);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--color-border);
      transition: all var(--transition-normal);
      animation: fadeInUp 0.6s ease backwards;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: rgba(34, 197, 94, 0.3);
      box-shadow: var(--shadow-lg);
    }

    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    .stat-card:nth-child(4) { animation-delay: 0.4s; }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .stat-icon.green { background: rgba(34, 197, 94, 0.15); color: var(--color-primary); }
    .stat-icon.blue { background: rgba(59, 130, 246, 0.15); color: var(--color-secondary); }
    .stat-icon.orange { background: rgba(245, 158, 11, 0.15); color: var(--color-warning); }
    .stat-icon.red { background: rgba(239, 68, 68, 0.15); color: var(--color-danger); }

    .stat-value {
      font-size: 40px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .stat-trend {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 12px;
      margin-top: 8px;
    }

    .stat-trend.up { background: rgba(34, 197, 94, 0.15); color: var(--color-primary); }
    .stat-trend.down { background: rgba(239, 68, 68, 0.15); color: var(--color-danger); }

    .main-content {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      border: 1px solid var(--color-border);
      animation: fadeInUp 0.6s ease backwards;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--color-bg-surface);
      color: var(--color-text-primary);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .chart-container {
      position: relative;
      height: 320px;
      margin-bottom: 16px;
    }

    .host-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 600px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .host-list::-webkit-scrollbar {
      width: 6px;
    }

    .host-list::-webkit-scrollbar-track {
      background: var(--color-bg-surface);
      border-radius: 3px;
    }

    .host-list::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 3px;
    }

    .host-card {
      background: var(--color-bg-surface);
      border-radius: var(--radius-md);
      padding: 16px;
      transition: all var(--transition-fast);
      cursor: pointer;
      border-left: 4px solid transparent;
    }

    .host-card:hover {
      transform: translateX(4px);
      background: #475569;
    }

    .host-card.active {
      border-left-color: var(--color-primary);
      background: rgba(34, 197, 94, 0.1);
    }

    .host-card.warning {
      border-left-color: var(--color-warning);
    }

    .host-card.danger {
      border-left-color: var(--color-danger);
    }

    .host-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .host-name {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .host-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .host-status.online { background: rgba(34, 197, 94, 0.2); color: var(--color-primary); }
    .host-status.warning { background: rgba(245, 158, 11, 0.2); color: var(--color-warning); }
    .host-status.offline { background: rgba(239, 68, 68, 0.2); color: var(--color-danger); }

    .host-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .metric-item {
      text-align: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius-sm);
    }

    .metric-value {
      font-size: 16px;
      font-weight: 600;
    }

    .metric-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      margin-top: 2px;
    }

    .anomaly-section {
      margin-top: 24px;
    }

    .anomaly-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(239, 68, 68, 0.1) 100%);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 12px;
      animation: slideInLeft 0.4s ease;
    }

    .anomaly-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .anomaly-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .anomaly-severity {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .anomaly-severity.critical { background: rgba(239, 68, 68, 0.2); color: var(--color-danger); }
    .anomaly-severity.warning { background: rgba(245, 158, 11, 0.2); color: var(--color-warning); }
    .anomaly-severity.info { background: rgba(59, 130, 246, 0.2); color: var(--color-secondary); }

    .anomaly-desc {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
    }

    .anomaly-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    .anomaly-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--color-border);
      color: var(--color-text-primary);
    }

    .btn-outline:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .prediction-section {
      margin-top: 24px;
    }

    .prediction-card {
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .prediction-icon {
      width: 48px;
      height: 48px;
      background: rgba(34, 197, 94, 0.15);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .prediction-content h4 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .prediction-content p {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
    }

    .prediction-stats {
      display: flex;
      gap: 16px;
    }

    .prediction-stat {
      text-align: left;
    }

    .prediction-stat .value {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-primary);
    }

    .prediction-stat .label {
      font-size: 11px;
      color: var(--color-text-secondary);
    }

    .time-range {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .time-btn {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: var(--radius-sm);
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .time-btn.active {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .time-btn:hover:not(.active) {
      background: #475569;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 1024px) {
      .main-content {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }

      .stat-value {
        font-size: 32px;
      }

      .host-metrics {
        grid-template-columns: 1fr 1fr;
      }
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(34, 197, 94, 0.3);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--color-primary);
    }

    .live-indicator span {
      width: 6px;
      height: 6px;
      background: var(--color-primary);
      border-radius: 50%;
      animation: blink 1s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>
  
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">📊</div>
        <div class="logo-text">
          <h1>智能设备监控系统</h1>
          <p>AI-Powered Device Monitoring</p>
        </div>
      </div>
      <div class="header-badge">
        <span></span>
        实时监控中
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-icon green">🖥️</span>
          <span class="live-indicator"><span></span>LIVE</span>
        </div>
        <div class="stat-value">12</div>
        <div class="stat-label">监控主机</div>
        <span class="stat-trend up">↑ 3 新增</span>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-icon blue">📈</span>
        </div>
        <div class="stat-value">99.2%</div>
        <div class="stat-label">在线率</div>
        <span class="stat-trend up">↑ 0.5%</span>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-icon orange">⚠️</span>
        </div>
        <div class="stat-value">3</div>
        <div class="stat-label">待处理告警</div>
        <span class="stat-trend down">↓ 2 已解决</span>
      </div>
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-icon red">🔍</span>
        </div>
        <div class="stat-value">8</div>
        <div class="stat-label">AI异常检测</div>
        <span class="stat-trend up">↑ 智能分析</span>
      </div>
    </div>

    <div class="main-content">
      <div class="card" style="animation-delay: 0.2s;">
        <div class="card-header">
          <div>
            <div class="card-title">
              <span>📊</span> 实时性能趋势
            </div>
            <div class="card-subtitle">选中主机的 CPU、内存、网络流量趋势分析</div>
          </div>
          <div class="card-actions">
            <button class="btn btn-secondary" id="refreshBtn">
              <span class="loading-spinner" id="refreshSpinner" style="display: none;"></span>
              刷新数据
            </button>
          </div>
        </div>

        <div class="time-range">
          <button class="time-btn active" data-range="1h">1小时</button>
          <button class="time-btn" data-range="6h">6小时</button>
          <button class="time-btn" data-range="24h">24小时</button>
          <button class="time-btn" data-range="7d">7天</button>
        </div>

        <div class="chart-container">
          <canvas id="performanceChart"></canvas>
        </div>

        <div class="prediction-section">
          <div class="prediction-card">
            <div class="prediction-icon">🔮</div>
            <div class="prediction-content">
              <h4>AI 智能预测分析</h4>
              <p>基于历史数据和机器学习模型，预测未来 24 小时性能趋势</p>
              <div class="prediction-stats">
                <div class="prediction-stat">
                  <div class="value">92%</div>
                  <div class="label">预测准确率</div>
                </div>
                <div class="prediction-stat">
                  <div class="value">3</div>
                  <div class="label">潜在风险项</div>
                </div>
                <div class="prediction-stat">
                  <div class="value">85%</div>
                  <div class="label">资源利用率</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="animation-delay: 0.3s;">
        <div class="card-header">
          <div>
            <div class="card-title">
              <span>🖥️</span> 主机列表
            </div>
            <div class="card-subtitle">点击查看详细性能数据</div>
          </div>
          <button class="btn btn-primary">
            + 添加主机
          </button>
        </div>

        <div class="host-list" id="hostList">
        </div>
      </div>
    </div>

    <div class="card" style="animation-delay: 0.4s;">
      <div class="card-header">
        <div>
          <div class="card-title">
            <span>🔍</span> AI 智能异常检测
          </div>
          <div class="card-subtitle">基于机器学习的自动异常识别与预警</div>
        </div>
        <div class="card-actions">
          <button class="btn btn-secondary">查看全部</button>
        </div>
      </div>

      <div class="anomaly-section" id="anomalyList">
      </div>
    </div>
  </div>

  <script>
    const hosts = [
      { id: 1, name: 'Web-Server-01', status: 'online', cpu: 45, memory: 68, latency: 12, isWarning: false },
      { id: 2, name: 'DB-Server-01', status: 'online', cpu: 72, memory: 85, latency: 8, isWarning: true },
      { id: 3, name: 'API-Gateway', status: 'online', cpu: 38, memory: 52, latency: 5, isWarning: false },
      { id: 4, name: 'Redis-Cluster', status: 'online', cpu: 25, memory: 78, latency: 2, isWarning: false },
      { id: 5, name: 'MQ-Broker', status: 'online', cpu: 42, memory: 55, latency: 3, isWarning: false },
      { id: 6, name: 'Elasticsearch', status: 'warning', cpu: 88, memory: 92, latency: 45, isWarning: true },
      { id: 7, name: 'Kafka-Cluster', status: 'online', cpu: 35, memory: 62, latency: 4, isWarning: false },
      { id: 8, name: 'Load-Balancer', status: 'online', cpu: 55, memory: 45, latency: 1, isWarning: false },
      { id: 9, name: 'Monitor-Server', status: 'online', cpu: 28, memory: 48, latency: 3, isWarning: false },
      { id: 10, name: 'CDN-Origin', status: 'online', cpu: 62, memory: 72, latency: 15, isWarning: false },
      { id: 11, name: 'Auth-Service', status: 'online', cpu: 32, memory: 42, latency: 6, isWarning: false },
      { id: 12, name: 'File-Storage', status: 'offline', cpu: 0, memory: 0, latency: 0, isWarning: false },
    ];

    const anomalies = [
      {
        id: 1,
        title: 'CPU 使用率异常飙升',
        severity: 'critical',
        host: 'Elasticsearch',
        description: '检测到 CPU 使用率在过去 15 分钟内从 65% 飙升至 88%，超过预警阈值 80%',
        time: '2分钟前',
        type: 'cpu'
      },
      {
        id: 2,
        title: '内存使用率接近上限',
        severity: 'warning',
        host: 'DB-Server-01',
        description: '内存使用率持续攀升至 85%，建议关注内存泄漏或增加内存容量',
        time: '5分钟前',
        type: 'memory'
      },
      {
        id: 3,
        title: '网络延迟异常波动',
        severity: 'warning',
        host: 'Elasticsearch',
        description: '网络延迟从正常的 5ms 突增至 45ms，可能存在网络拥塞',
        time: '3分钟前',
        type: 'network'
      },
      {
        id: 4,
        title: '磁盘 I/O 性能下降',
        severity: 'info',
        host: 'Web-Server-01',
        description: '磁盘读写速度下降 20%，建议检查磁盘健康状态',
        time: '10分钟前',
        type: 'disk'
      },
      {
        id: 5,
        title: '连接数异常增长',
        severity: 'warning',
        host: 'API-Gateway',
        description: '活跃连接数增长 300%，接近最大连接数限制',
        time: '8分钟前',
        type: 'connection'
      },
      {
        id: 6,
        title: 'JVM GC 频繁触发',
        severity: 'warning',
        host: 'Auth-Service',
        description: 'GC 频率增加 200%，可能存在内存压力',
        time: '12分钟前',
        type: 'jvm'
      },
    ];

    function generateTimeLabels(hours) {
      const labels = [];
      const now = new Date();
      for (let i = hours * 60; i >= 0; i -= 5) {
        const time = new Date(now.getTime() - i * 60 * 1000);
        labels.push(`${time.getHours().toString().padStart(2, '0')}:${time.getMinutes().toString().padStart(2, '0')}`);
      }
      return labels;
    }

    function generateRandomData(baseValue, variance, count) {
      const data = [];
      let value = baseValue;
      for (let i = 0; i < count; i++) {
        value += (Math.random() - 0.5) * variance * 2;
        value = Math.max(0, Math.min(100, value));
        data.push(Math.round(value * 10) / 10);
      }
      return data;
    }

    function createHostCard(host) {
      const card = document.createElement('div');
      card.className = `host-card ${host.isWarning ? 'warning' : ''} ${host.status === 'offline' ? 'danger' : ''}`;
      card.dataset.id = host.id;

      let statusClass = 'online';
      let statusText = '在线';
      if (host.status === 'warning') {
        statusClass = 'warning';
        statusText = '警告';
      } else if (host.status === 'offline') {
        statusClass = 'offline';
        statusText = '离线';
      }

      card.innerHTML = `
        <div class="host-header">
          <span class="host-name">${host.name}</span>
          <span class="host-status ${statusClass}">${statusText}</span>
        </div>
        <div class="host-metrics">
          <div class="metric-item">
            <div class="metric-value" style="color: ${host.cpu > 80 ? '#ef4444' : host.cpu > 60 ? '#f59e0b' : '#22c55e'}">${host.cpu}%</div>
            <div class="metric-label">CPU</div>
          </div>
          <div class="metric-item">
            <div class="metric-value" style="color: ${host.memory > 80 ? '#ef4444' : host.memory > 60 ? '#f59e0b' : '#22c55e'}">${host.memory}%</div>
            <div class="metric-label">内存</div>
          </div>
          <div class="metric-item">
            <div class="metric-value" style="color: ${host.latency > 100 ? '#ef4444' : host.latency > 50 ? '#f59e0b' : '#22c55e'}">${host.latency}ms</div>
            <div class="metric-label">延迟</div>
          </div>
        </div>
      `;

      card.addEventListener('click', () => {
        document.querySelectorAll('.host-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        updateChart(host);
      });

      return card;
    }

    function createAnomalyCard(anomaly) {
      const card = document.createElement('div');
      card.className = 'anomaly-card';

      let icon = '⚠️';
      if (anomaly.type === 'cpu') icon = '💻';
      else if (anomaly.type === 'memory') icon = '🧠';
      else if (anomaly.type === 'network') icon = '🌐';
      else if (anomaly.type === 'disk') icon = '💾';

      card.innerHTML = `
        <div class="anomaly-header">
          <span class="anomaly-title">${icon} ${anomaly.title}</span>
          <span class="anomaly-severity ${anomaly.severity}">${anomaly.severity === 'critical' ? '严重' : anomaly.severity === 'warning' ? '警告' : '信息'}</span>
        </div>
        <div class="anomaly-desc">${anomaly.description}</div>
        <div class="anomaly-meta">
          <span>主机: ${anomaly.host}</span>
          <span>时间: ${anomaly.time}</span>
        </div>
        <div class="anomaly-actions">
          <button class="btn btn-sm btn-primary">查看详情</button>
          <button class="btn btn-sm btn-outline">标记已处理</button>
        </div>
      `;

      return card;
    }

    let chartInstance = null;

    function updateChart(host) {
      const ctx = document.getElementById('performanceChart').getContext('2d');
      
      const labels = generateTimeLabels(1);
      const cpuData = generateRandomData(host.cpu, 15, labels.length);
      const memoryData = generateRandomData(host.memory, 10, labels.length);
      const networkData = generateRandomData(host.latency, 8, labels.length);

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'CPU (%)',
              data: cpuData,
              borderColor: '#22c55e',
              backgroundColor: 'rgba(34, 197, 94, 0.1)',
              fill: true,
              tension: 0.4,
              pointRadius: 0,
              pointHoverRadius: 6,
              borderWidth: 2,
              yAxisID: 'y',
            },
            {
              label: '内存 (%)',
              data: memoryData,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              fill: true,
              tension: 0.4,
              pointRadius: 0,
              pointHoverRadius: 6,
              borderWidth: 2,
              yAxisID: 'y',
            },
            {
              label: '延迟 (ms)',
              data: networkData,
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.1)',
              fill: true,
              tension: 0.4,
              pointRadius: 0,
              pointHoverRadius: 6,
              borderWidth: 2,
              yAxisID: 'y1',
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false,
          },
          plugins: {
            legend: {
              position: 'top',
              labels: {
                color: '#94a3b8',
                usePointStyle: true,
                padding: 20,
                font: { size: 12 }
              }
            },
            tooltip: {
              backgroundColor: '#1e293b',
              titleColor: '#f1f5f9',
              bodyColor: '#94a3b8',
              borderColor: '#475569',
              borderWidth: 1,
              padding: 12,
              displayColors: true,
              callbacks: {
                label: function(context) {
                  let label = context.dataset.label || '';
                  if (label) {
                    label += ': ';
                  }
                  if (context.parsed.y !== null) {
                    label += context.parsed.y;
                  }
                  return label;
                }
              }
            }
          },
          scales: {
            x: {
              grid: {
                color: 'rgba(71, 85, 105, 0.3)',
              },
              ticks: {
                color: '#94a3b8',
                font: { size: 11 },
                maxTicksLimit: 12,
                maxRotation: 0,
                autoSkip: true,
              }
            },
            y: {
              type: 'linear',
              display: true,
              position: 'left',
              min: 0,
              max: 100,
              grid: {
                color: 'rgba(71, 85, 105, 0.3)',
              },
              ticks: {
                color: '#94a3b8',
                font: { size: 11 },
                callback: function(value) {
                  return value + '%';
                }
              },
              title: {
                display: true,
                text: '使用率 (%)',
                color: '#94a3b8',
                font: { size: 12 }
              }
            },
            y1: {
              type: 'linear',
              display: true,
              position: 'right',
              min: 0,
              max: 200,
              grid: {
                drawOnChartArea: false,
              },
              ticks: {
                color: '#f59e0b',
                font: { size: 11 },
                callback: function(value) {
                  return value + 'ms';
                }
              },
              title: {
                display: true,
                text: '延迟 (ms)',
                color: '#f59e0b',
                font: { size: 12 }
              }
            }
          },
          animation: {
            duration: 800,
            easing: 'easeOutQuart'
          }
        }
      });
    }

    function init() {
      const hostList = document.getElementById('hostList');
      hosts.forEach(host => {
        hostList.appendChild(createHostCard(host));
      });

      const anomalyList = document.getElementById('anomalyList');
      anomalies.forEach(anomaly => {
        anomalyList.appendChild(createAnomalyCard(anomaly));
      });

      document.querySelector('.host-card').classList.add('active');
      updateChart(hosts[0]);

      document.querySelectorAll('.time-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      document.getElementById('refreshBtn').addEventListener('click', () => {
        const spinner = document.getElementById('refreshSpinner');
        spinner.style.display = 'block';
        
        setTimeout(() => {
          const activeHostId = document.querySelector('.host-card.active')?.dataset.id;
          const host = hosts.find(h => h.id == activeHostId) || hosts[0];
          updateChart(host);
          spinner.style.display = 'none';
        }, 1000);
      });
    }

    init();

    setInterval(() => {
      hosts.forEach(host => {
        if (host.status !== 'offline') {
          host.cpu = Math.max(5, Math.min(100, host.cpu + (Math.random() - 0.5) * 10));
          host.memory = Math.max(20, Math.min(100, host.memory + (Math.random() - 0.5) * 5));
          host.latency = Math.max(1, Math.min(200, host.latency + (Math.random() - 0.5) * 10));
        }
      });

      document.querySelectorAll('.host-card').forEach((card, index) => {
        const host = hosts[index];
        const metrics = card.querySelectorAll('.metric-value');
        metrics[0].textContent = Math.round(host.cpu) + '%';
        metrics[1].textContent = Math.round(host.memory) + '%';
        metrics[2].textContent = Math.round(host.latency) + 'ms';

        metrics[0].style.color = host.cpu > 80 ? '#ef4444' : host.cpu > 60 ? '#f59e0b' : '#22c55e';
        metrics[1].style.color = host.memory > 80 ? '#ef4444' : host.memory > 60 ? '#f59e0b' : '#22c55e';
        metrics[2].style.color = host.latency > 100 ? '#ef4444' : host.latency > 50 ? '#f59e0b' : '#22c55e';
      });

      const activeHostId = document.querySelector('.host-card.active')?.dataset.id;
      const host = hosts.find(h => h.id == activeHostId) || hosts[0];
      updateChart(host);
    }, 5000);
  </script>
</body>
</html>
