<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邻里互助板 - Neighbor Help Board</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #fef9f3 0%, #fdf4e8 50%, #fbe8d5 100%);
  color: #333;
}
.container { max-width: 960px; margin: 0 auto; padding: 20px; }

header {
  text-align: center; padding: 30px 20px 20px;
}
header h1 {
  font-size: 2.2rem;
  background: linear-gradient(135deg, #e07a3a, #c65d18);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
header p { color: #8b6914; font-size: 1rem; margin-top: 6px; }

/* Tab 切换 */
.tabs {
  display: flex; gap: 4px; background: rgba(255,255,255,0.7);
  border-radius: 16px; padding: 5px; margin-bottom: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06); flex-wrap: wrap;
}
.tab {
  flex: 1; padding: 12px 20px; border-radius: 12px; cursor: pointer;
  text-align: center; font-weight: 500; transition: all 0.3s;
  font-size: 0.95rem; color: #666; border: none; background: none;
  font-family: inherit; min-width: fit-content;
}
.tab.active {
  background: linear-gradient(135deg, #e07a3a, #c65d18);
  color: #fff; box-shadow: 0 4px 15px rgba(224,122,58,0.3);
}
.tab .count { font-size: 0.78rem; opacity: 0.75; display: block; margin-top: 2px; }

/* 发布面板 */
.publish-panel {
  background: #fff; border-radius: 20px; padding: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.06); margin-bottom: 24px;
}
.publish-panel h3 { margin-bottom: 16px; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
.form-row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.form-group { flex: 1; min-width: 200px; }
.form-group label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 6px; font-weight: 500; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 10px 14px; border: 2px solid #eee; border-radius: 12px;
  outline: none; font-size: 0.95rem; transition: all 0.3s; font-family: inherit;
  background: #fafafa; color: #333;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #e07a3a; background: #fff; }
.form-textarea { min-height: 80px; resize: vertical; }
.form-input::placeholder, .form-textarea::placeholder { color: #bbb; }

.type-selector {
  display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
}
.type-btn {
  padding: 8px 18px; border-radius: 20px; border: 2px solid #eee; background: #fff;
  cursor: pointer; font-size: 0.88rem; transition: all 0.3s; font-family: inherit;
  display: flex; align-items: center; gap: 6px;
}
.type-btn:hover { border-color: #e07a3a; }
.type-btn.active { border-color: #e07a3a; background: #fff5ee; color: #c65d18; }
.type-icon { font-size: 1.1rem; }

.publish-btn {
  padding: 12px 36px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #e07a3a, #c65d18); color: #fff;
  font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s;
  font-family: inherit; width: 100%;
}
.publish-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(224,122,58,0.35); }

/* 卡片列表 */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card {
  background: #fff; border-radius: 18px; padding: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.05);
  transition: all 0.3s; position: relative; overflow: hidden;
  animation: cardIn 0.4s ease-out;
}
@keyframes cardIn { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.1); }

.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-type {
  padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500;
}
.type-help { background: #e8f5e9; color: #2e7d32; }
.type-offer { background: #fff3e0; color: #e65100; }
.type-share { background: #e3f2fd; color: #1565c0; }
.type-urgent { background: #fce4ec; color: #c62828; }

.card-status {
  padding: 4px 10px; border-radius: 8px; font-size: 0.75rem;
}
.status-open { background: #e8f5e9; color: #388e3c; }
.status-in-progress { background: #fff8e1; color: #f9a825; }
.status-completed { background: #eceff1; color: #607d8b; }

.card-title { font-size: 1.08rem; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
.card-desc { font-size: 0.9rem; color: #666; line-height: 1.6; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.card-meta {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 12px; border-top: 1px solid #f0f0f0; font-size: 0.82rem; color: #999;
}
.card-author { display: flex; align-items: center; gap: 6px; }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; color: #fff; font-weight: bold;
}
.card-actions { display: flex; gap: 8px; }
.action-btn {
  padding: 5px 12px; border-radius: 8px; border: 1px solid #eee;
  background: #fff; cursor: pointer; font-size: 0.8rem; transition: all 0.3s;
  font-family: inherit; color: #666;
}
.action-btn:hover { border-color: #e07a3a; color: #e07a3a; }
.action-btn.primary { background: #e07a3a; border-color: #e07a3a; color: #fff; }
.action-btn.primary:hover { background: #c65d18; }

/* 筛选栏 */
.filter-bar {
  display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center;
}
.filter-tag {
  padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd;
  background: #fff; cursor: pointer; font-size: 0.85rem; transition: all 0.3s;
  font-family: inherit; color: #777;
}
.filter-tag.active { background: #e07a3a; border-color: #e07a3a; color: #fff; }
.search-input {
  flex: 1; min-width: 180px; padding: 8px 14px; border: 1px solid #ddd;
  border-radius: 20px; outline: none; font-size: 0.88rem; font-family: inherit;
}
.search-input:focus { border-color: #e07a3a; }

/* 统计 */
.stats-bar {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 24px;
}
.stat-card {
  background: #fff; border-radius: 14px; padding: 16px; text-align: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}
.stat-num { font-size: 1.6rem; font-weight: bold; color: #e07a3a; }
.stat-label { font-size: 0.8rem; color: #999; margin-top: 2px; }

/* 空状态 */
.empty-state { text-align: center; padding: 50px 20px; color: #bbb; }
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: 20px; padding: 28px; max-width: 480px; width: 90%;
  animation: modalIn 0.3s ease;
}
@keyframes modalIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
.modal h3 { margin-bottom: 16px; }
.modal textarea {
  width: 100%; min-height: 80px; padding: 12px; border: 2px solid #eee;
  border-radius: 12px; resize: vertical; font-family: inherit; font-size: 0.93rem;
  outline: none; margin-bottom: 14px;
}
.modal textarea:focus { border-color: #e07a3a; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.modal-btn {
  padding: 10px 24px; border-radius: 10px; border: none; cursor: pointer;
  font-size: 0.92rem; font-family: inherit; transition: all 0.3s;
}
.modal-btn-cancel { background: #f0f0f0; color: #666; }
.modal-btn-confirm { background: #e07a3a; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>邻里互助板</h1>
    <p>远亲不如近邻，让社区更有温度 🏘️</p>
  </header>

  <!-- 统计 -->
  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总帖子数</div></div>
    <div class="stat-card"><div class="stat-num" id="statHelping">0</div><div class="stat-label">求助中</div></div>
    <div class="stat-card"><div class="statNum" id="statCompleted">0</div><div class="stat-label">已完成</div></div>
    <div class="stat-card"><div class="stat-num" id="statHelpers">0</div><div class="stat-label">热心邻居</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="all" onclick="switchTab('all')">全部<span class="count" id="tabAllCount">0</span></button>
    <button class="tab" data-tab="help" onclick="switchTab('help')">求助<span class="count" id="tabHelpCount">0</span></button>
    <button class="tab" data-tab="offer" onclick="switchTab('offer')">提供帮助<span class="count" id="tabOfferCount">0</span></button>
    <button class="tab" data-tab="share" onclick="switchTab('share')">分享<span class="count" id="tabShareCount">0</span></button>
  </div>

  <!-- 发布 -->
  <div class="publish-panel">
    <h3>发布新动态</h3>
    <div class="type-selector">
      <button class="type-btn active" data-type="help" onclick="selectType(this)">
        <span class="type-icon">🙋</span> 求助
      </button>
      <button class="type-btn" data-type="offer" onclick="selectType(this)">
        <span class="type-icon">🤝</span> 提供帮助
      </button>
      <button class="type-btn" data-type="share" onclick="selectType(this)">
        <span class="type-icon">📢</span> 分享
      </button>
      <button class="type-btn" data-type="urgent" onclick="selectType(this)">
        <span class="type-icon">🚨</span> 紧急
      </button>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2"><label>标题</label><input type="text" class="form-input" id="postTitle" placeholder="一句话描述你的需求..."></div>
      <div class="form-group" style="flex:1"><label>昵称</label><input type="text" class="form-input" id="postAuthor" placeholder="你的称呼"></div>
    </div>
    <div class="form-group"><label>详细描述</label><textarea class="form-textarea" id="postDesc" placeholder="详细说明情况、时间、地点等..."></textarea></div>
    <button class="publish-btn" onclick="publishPost()">发布到互助板</button>
  </div>

  <!-- 筛选 -->
  <div class="filter-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索帖子..." oninput="renderPosts()">
    <button class="filter-tag active" data-filter="all" onclick="setFilter('all',this)">全部状态</button>
    <button class="filter-tag" data-filter="open" onclick="setFilter('open',this)">进行中</button>
    <button class="filter-tag" data-filter="completed" onclick="setFilter('completed',this)">已完成</button>
  </div>

  <!-- 帖子列表 -->
  <div class="cards-grid" id="postsGrid"></div>
</div>

<!-- 回复Modal -->
<div class="modal-overlay" id="replyModal">
  <div class="modal">
    <h3 id="modalTitle">回复 / 接单</h3>
    <textarea id="replyText" placeholder="写下你想说的话..."></textarea>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
      <button class="modal-btn modal-btn-confirm" onclick="submitReply()">提交</button>
    </div>
  </div>
</div>

<script>
let currentTab = 'all';
let currentType = 'help';
let currentFilter = 'all';
let replyTargetId = null;

// 示例数据
const AVATAR_COLORS = ['#e07a3a','#3a7bd5','#27ae60','#8e44ad','#e67e22','#16a085','#c0392b','#2980b9'];
const SAMPLE_NAMES = ['张阿姨','李大叔','小王同学','陈奶奶','刘师傅','赵姐','周哥','孙阿姨','吴老师','郑小哥'];

let posts = JSON.parse(localStorage.getItem('neighborPosts') || '[]');

// 初始化示例数据
if (posts.length === 0) {
  posts = [
    { id: 1, type: 'help', title: '需要帮忙接孩子放学', desc: '今天临时加班，下午4点半需要有人帮忙去阳光小学接一下孩子，可以给点辛苦费，感谢！', author: '张阿姨', avatarColor: AVATAR_COLORS[0], status: 'open', date: Date.now() - 3600000, replies: [] },
    { id: 2, type: 'offer', title: '免费帮忙修理家电', desc: '我是退休电工，家里有小家电坏了的可以拿来我看看，免费维修，就在3号楼下。', author: '刘师傅', avatarColor: AVATAR_COLORS[4], status: 'open', date: Date.now() - 7200000, replies: [] },
    { id: 3, type: 'share', title: '多余的儿童绘本免费送', desc: '孩子长大了，有一批适合3-6岁的绘本想送给有需要的家庭，大概20本左右。', author: '赵姐', avatarColor: AVATAR_COLORS[5], status: 'completed', date: Date.now() - 86400000, replies: [{author:'李大叔',text:'太好了！我家正好需要',time:'昨天'}] },
    { id: 4, type: 'help', title: '求借一把电钻', desc: '装修还差一个孔要打，就借用半小时就行，用完马上还！', author: '小王同学', avatarColor: AVATAR_COLORS[2], status: 'in_progress', date: Date.now() - 1800000, replies: [{author:'周哥',text:'我有，你来拿吧',time:'30分钟前'}] },
    { id: 5, type: 'urgent', title: '老人走失！请帮忙留意', desc: '我家老爷子80岁了，穿灰色外套，有点糊涂，在小区附近走失，麻烦大家帮忙留意一下！', author: '陈奶奶', avatarColor: AVATAR_COLORS[3], status: 'in_progress', date: Date.now() - 900000, replies: [{author:'郑小哥',text:'已转发业主群！',time:'10分钟前'},{author:'赵姐',text:'我在南门看到过类似老人，我去确认一下',time:'8分钟前'}] },
  ];
  savePosts();
}

function init() {
  renderPosts();
  updateStats();
}

function selectType(btn) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentType = btn.dataset.type;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');
  renderPosts();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPosts();
}

function publishPost() {
  const title = document.getElementById('postTitle').value.trim();
  const desc = document.getElementById('postDesc').value.trim();
  let author = document.getElementById('postAuthor').value.trim();
  if (!title) return alert('请填写标题');
  if (!author) author = SAMPLE_NAMES[Math.floor(Math.random() * SAMPLE_NAMES.length)];

  const post = {
    id: Date.now(),
    type: currentType,
    title,
    desc,
    author,
    avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)],
    status: 'open',
    date: Date.now(),
    replies: []
  };

  posts.unshift(post);
  savePosts();

  // 清空表单
  document.getElementById('postTitle').value = '';
  document.getElementById('postDesc').value = '';

  renderPosts();
  updateStats();

  // 动效反馈
  alert('发布成功! 感谢你的参与 ❤️');
}

function renderPosts() {
  const grid = document.getElementById('postsGrid');
  const keyword = document.getElementById('searchInput').value.toLowerCase();

  let filtered = posts.filter(p => {
    if (currentTab !== 'all' && p.type !== currentTab) return false;
    if (currentFilter !== 'all' && p.status !== currentFilter) return false;
    if (keyword && !p.title.toLowerCase().includes(keyword) && !p.desc.toLowerCase().includes(keyword)) return false;
    return true;
  });

  // 更新tab计数
  document.getElementById('tabAllCount').textContent = posts.length;
  document.getElementById('tabHelpCount').textContent = posts.filter(p => p.type === 'help').length;
  document.getElementById('tabOfferCount').textContent = posts.filter(p => p.type === 'offer').length;
  document.getElementById('tabShareCount').textContent = posts.filter(p => p.type === 'share').length;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🤝</div>暂无相关帖子，来发布第一条吧</div>';
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const typeConfig = {
      help:   { label: '求助', cls: 'type-help' },
      offer:  { label: '提供帮助', cls: 'type-offer' },
      share:  { label: '分享', cls: 'type-share' },
      urgent: { label: '紧急', cls: 'type-urgent' }
    };
    const statusConfig = {
      open:         { label: '进行中', cls: 'status-open' },
      in_progress:  { label: '有人响应', cls: 'status-in-progress' },
      completed:    { label: '已完成', cls: 'status-completed' }
    };
    const tc = typeConfig[p.type];
    const sc = statusConfig[p.status];
    const timeAgo = getTimeAgo(p.date);

    return `
    <div class="card">
      <div class="card-header">
        <span class="card-type ${tc.cls}">${tc.label}</span>
        <span class="card-status ${sc.cls}">${sc.label}</span>
      </div>
      <div class="card-title">${escapeHtml(p.title)}</div>
      <div class="card-desc">${escapeHtml(p.desc)}</div>
      <div class="card-meta">
        <div class="card-author">
          <div class="avatar" style="background:${p.avatarColor}">${p.author.charAt(0)}</div>
          ${escapeHtml(p.author)} · ${timeAgo}
        </div>
        <div class="card-actions">
          ${p.status !== 'completed' ? `<button class="action-btn primary" onclick="openReply(${p.id})">回复/接单</button>` : ''}
          ${p.replies.length > 0 ? `<span style="font-size:0.8rem;color:#aaa;">${p.replies.length}条回复</span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function openReply(id) {
  replyTargetId = id;
  document.getElementById('replyModal').classList.add('show');
  document.getElementById('replyText').focus();
}

function closeModal() {
  document.getElementById('replyModal').classList.remove('show');
  document.getElementById('replyText').value = '';
  replyTargetId = null;
}

function submitReply() {
  const text = document.getElementById('replyText').value.trim();
  if (!text || !replyTargetId) return;

  const post = posts.find(p => p.id === replyTargetId);
  if (post) {
    post.replies.push({
      author: SAMPLE_NAMES[Math.floor(Math.random() * SAMPLE_NAMES.length)],
      text: text,
      time: '刚刚'
    });
    if (post.status === 'open') post.status = 'in_progress';
    savePosts();
    renderPosts();
  }
  closeModal();
}

function updateStatus(id, newStatus) {
  const post = posts.find(p => p.id === id);
  if (post) {
    post.status = newStatus;
    savePosts();
    renderPosts();
    updateStats();
  }
}

function updateStats() {
  document.getElementById('statTotal').textContent = posts.length;
  document.getElementById('statHelping').textContent = posts.filter(p => p.status === 'open' || p.status === 'in_progress').length;
  document.getElementById('statCompleted').textContent = posts.filter(p => p.status === 'completed').length;
  const helpers = new Set(posts.flatMap(p => p.replies.map(r => r.author)));
  document.getElementById('statHelpers').textContent = helpers.size + Math.floor(Math.random() * 5);
}

function getTimeAgo(timestamp) {
  const diff = Date.now() - timestamp;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
  return Math.floor(diff / 86400000) + '天前';
}

function savePosts() { localStorage.setItem('neighborPosts', JSON.stringify(posts)); }
function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

init();
</script>
</body>
</html>
