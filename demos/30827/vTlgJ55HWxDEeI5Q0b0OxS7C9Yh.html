<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星芒小栈 - 为每一颗疲惫的心点亮光芒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffecd2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #e74c3c;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        header p {
            color: #8e7cc3;
            font-size: 1.1rem;
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(252, 182, 159, 0.3);
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quote-text {
            font-size: 1.5rem;
            line-height: 1.8;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            min-height: 100px;
        }

        .quote-author {
            text-align: right;
            color: #95a5a6;
            font-size: 1rem;
        }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.5);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .sparkle {
            display: inline-block;
            animation: sparkle 1s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .journal-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(252, 182, 159, 0.3);
        }

        .journal-section h2 {
            color: #e74c3c;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .journal-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #f0f0f0;
            border-radius: 16px;
            font-size: 1rem;
            resize: none;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .journal-input:focus {
            outline: none;
            border-color: #ff6b6b;
        }

        .add-btn {
            background: linear-gradient(135deg, #54a0ff 0%, #5f27cd 100%);
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(84, 160, 255, 0.4);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(84, 160, 255, 0.5);
        }

        .memories-list {
            margin-top: 25px;
        }

        .memory-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e8f5e9 100%);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.4s ease-out;
            border-left: 4px solid #4caf50;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .memory-text {
            color: #34495e;
            flex: 1;
        }

        .memory-date {
            color: #95a5a6;
            font-size: 0.85rem;
            margin-left: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #95a5a6;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 30px;
            color: #95a5a6;
            font-size: 0.9rem;
        }

        .hearts {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
        }

        .heart {
            position: absolute;
            animation: floatUp 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.5);
            }
        }

        .btn-icon {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>星芒小栈 <span class="sparkle">✨</span></h1>
            <p>为每一颗疲惫的心点亮光芒</p>
        </header>

        <div class="quote-card">
            <div class="quote-text" id="quoteText">点击下方按钮获取今日温暖</div>
            <div class="quote-author" id="quoteAuthor"></div>
            <button class="refresh-btn" id="refreshBtn">
                <span class="btn-icon">☀️</span>探索阳光
            </button>
        </div>

        <div class="journal-section">
            <h2>
                <span>💝</span>我的暖心集
            </h2>
            <textarea 
                class="journal-input" 
                id="memoryInput" 
                placeholder="今天有什么让你开心的小事？记录下来吧~"
                rows="3"
            ></textarea>
            <button class="add-btn" id="addBtn">
                <span class="btn-icon">💖</span>收藏暖心集
            </button>
            
            <div class="memories-list" id="memoriesList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <p>还没有记录任何暖心集</p>
                    <p style="font-size: 0.85rem; margin-top: 5px;">开始记录生活中的美好瞬间吧~</p>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>🌙 愿你被世界温柔以待</p>
        </footer>
    </div>

    <div class="hearts" id="heartsContainer"></div>

    <script>
        const quotes = [
            { text: "生活不会因为你是女孩就对你温柔，但你可以温柔地对待生活。", author: "— 温暖小站" },
            { text: "每一个你不满意的现在，都有一个你没有努力的曾经。但现在开始，永远不晚。", author: "— 温暖小站" },
            { text: "你不需要很厉害才能开始，但你需要开始才能很厉害。", author: "— 温暖小站" },
            { text: "世界上最美好的事情之一，就是有人在偷偷爱着你。", author: "— 温暖小站" },
            { text: "今天的你，已经很棒了。明天的你，会更棒。", author: "— 温暖小站" },
            { text: "不要着急，最好的总会在最不经意的时候出现。", author: "— 泰戈尔" },
            { text: "生活就像一盒巧克力，你永远不知道下一颗是什么味道。", author: "— 《阿甘正传》" },
            { text: "愿你眼中有星辰，心中有山海，从此以梦为马，不负韶华。", author: "— 温暖小站" },
            { text: "你笑起来的样子，像春天的阳光一样温暖。", author: "— 温暖小站" },
            { text: "即使是小星星，也有自己的光芒。", author: "— 温暖小站" },
            { text: "慢慢来，比较快。给自己一点时间，一切都会好起来的。", author: "— 温暖小站" },
            { text: "你的价值不取决于别人的看法，而取决于你对自己的认可。", author: "— 温暖小站" },
            { text: "生活不止眼前的苟且，还有诗和远方。", author: "— 高晓松" },
            { text: "心若向阳，无畏悲伤。", author: "— 温暖小站" },
            { text: "愿所有的美好都如期而至，愿所有的幸运都不期而遇。", author: "— 温暖小站" },
            { text: "做自己的太阳，无需借助谁的光。", author: "— 温暖小站" },
            { text: "世界很大，风景很美，机会很多。不要蜷缩在一小块阴影里。", author: "— 温暖小站" },
            { text: "每一个不曾起舞的日子，都是对生命的辜负。", author: "— 尼采" },
            { text: "你比想象中更勇敢，比看起来更坚强，比认为的更聪明。", author: "— 温暖小站" },
            { text: "生活明朗，万物可爱，人间值得，未来可期。", author: "— 温暖小站" },
            { text: "山有峰顶，海有彼岸。漫漫长途，终有回转。余味苦涩，终有回甘。", author: "— 温暖小站" },
            { text: "愿你历尽千帆，归来仍是少年。", author: "— 温暖小站" },
            { text: "生活不是等待风暴过去，而是学会在雨中翩翩起舞。", author: "— 温暖小站" },
            { text: "把每一天都当作生命中的最后一天来对待，你会发现世界变得更加美好。", author: "— 温暖小站" },
            { text: "你的努力，时间看得见。", author: "— 温暖小站" },
            { text: "愿你有高跟鞋也有跑鞋，喝茶也喝酒。愿你有勇敢的朋友，有牛逼的对手。愿你对过往的一切情深意重，但从不回头。愿你特别美丽，特别平静，特别凶狠，也特别温柔。", author: "— 王潇" },
            { text: "人生没有白走的路，每一步都算数。", author: "— 温暖小站" },
            { text: "不是因为看到希望才坚持，而是因为坚持才看到希望。", author: "— 温暖小站" },
            { text: "愿你如阳光，明媚不忧伤；愿你如月光，明亮不清冷。", author: "— 温暖小站" },
            { text: "生活的美好，在于它的不确定性。", author: "— 温暖小站" }
        ];

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            return quotes[randomIndex];
        }

        function displayQuote() {
            const quote = getRandomQuote();
            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            
            quoteText.style.opacity = '0';
            setTimeout(() => {
                quoteText.textContent = quote.text;
                quoteAuthor.textContent = quote.author;
                quoteText.style.opacity = '1';
            }, 200);
        }

        function createHeart(x, y) {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💖';
            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.fontSize = Math.random() * 15 + 10 + 'px';
            heart.style.animationDelay = Math.random() * 0.5 + 's';
            document.getElementById('heartsContainer').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 2000);
        }

        function showHearts(x, y) {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createHeart(x + (Math.random() - 0.5) * 50, y);
                }, i * 100);
            }
        }

        function addMemory() {
            const input = document.getElementById('memoryInput');
            const text = input.value.trim();
            
            if (!text) return;

            const memoriesList = document.getElementById('memoriesList');
            
            if (memoriesList.querySelector('.empty-state')) {
                memoriesList.innerHTML = '';
            }

            const memoryItem = document.createElement('div');
            memoryItem.className = 'memory-item';
            
            const now = new Date();
            const dateStr = `${now.getMonth() + 1}月${now.getDate()}日 ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            memoryItem.innerHTML = `
                <span class="memory-text">${text}</span>
                <span class="memory-date">${dateStr}</span>
            `;
            
            memoriesList.appendChild(memoryItem);
            input.value = '';

            const rect = memoryItem.getBoundingClientRect();
            showHearts(rect.left + rect.width / 2, rect.top);
        }

        document.getElementById('refreshBtn').addEventListener('click', displayQuote);
        document.getElementById('addBtn').addEventListener('click', addMemory);
        document.getElementById('memoryInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                addMemory();
            }
        });

        displayQuote();
    </script>
</body>
</html>
