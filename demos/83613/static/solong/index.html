<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>邻里接龙 - 无忧生活</title>
  <link rel="stylesheet" href="css/solong-theme.css">

  <!-- 首页专用样式 -->
  <style>
    /* ============================================================
       首页内容区域填充
       ============================================================ */
    .solong-container {
      padding-top: calc(var(--solong-header-height) + 16px);
      padding-bottom: calc(var(--solong-bottom-nav-height) + 24px);
    }

    /* ============================================================
       统计面板 — 浅橙渐变圆角卡片
       ============================================================ */
    #solong-stats {
      margin-bottom: 16px;
    }

    .home-stats-inner {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: linear-gradient(135deg, #FFF3E0, #FFE8CC);
      border-radius: var(--solong-radius-lg);
      padding: 18px 12px;
      box-shadow: var(--solong-shadow-sm);
      text-align: center;
    }

    .home-stat-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .home-stat-icon {
      font-size: 20px;
      line-height: 1.2;
    }

    .home-stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--solong-primary);
      line-height: 1.3;
    }

    .home-stat-label {
      font-size: 12px;
      color: var(--solong-text-secondary);
      line-height: 1.3;
    }

    .home-stat-divider {
      width: 1px;
      height: 36px;
      background: rgba(255, 122, 0, 0.15);
      flex-shrink: 0;
    }

    /* ============================================================
       分类标签区域
       ============================================================ */
    #solong-categories {
      margin-bottom: 16px;
    }

    /* ============================================================
       接龙卡片列表
       ============================================================ */
    #solong-activities {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 8px;
    }

    /* ---------- 已截单卡片灰色调 ---------- */
    .solong-card-closed {
      opacity: 0.6;
      filter: grayscale(0.4);
    }

    .solong-card-closed .solong-card-img {
      filter: grayscale(0.6);
    }

    /* ============================================================
       空状态
       ============================================================ */
    .home-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .home-empty-icon {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .home-empty-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--solong-text-secondary);
      margin-bottom: 8px;
    }

    .home-empty-sub {
      font-size: 13px;
      color: var(--solong-text-disabled);
    }

    /* ============================================================
       标题栏"发起"按钮
       ============================================================ */
    .solong-header-create-btn {
      font-size: 13px;
      font-weight: 500;
      color: var(--solong-white);
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: var(--solong-radius-pill);
      cursor: pointer;
      transition: background var(--solong-transition-fast);
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .solong-header-create-btn:active {
      background: rgba(255, 255, 255, 0.35);
    }

    /* ============================================================
       Header 标题栏布局微调（覆盖 theme 默认）
       ============================================================ */
    .solong-header .solong-header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    /* ============================================================
       底部导航图标文字
       ============================================================ */
    .solong-nav-item .solong-nav-text {
      font-size: 10px;
      line-height: 1;
    }

    /* ============================================================
       卡片图片内部圆角修正（theme 中 border-radius 在 .solong-card-img）
       ============================================================ */
    .solong-activity-card .solong-card-img {
      border-radius: var(--solong-radius-sm) var(--solong-radius-sm) 0 0;
    }
  </style>
</head>
<body>

  <!-- ==========================================================
       固定顶部标题栏
       ========================================================== -->
  <header class="solong-header">
    <div class="solong-header-left">
      <span class="solong-header-title">🐉 邻里接龙</span>
    </div>
    <div class="solong-header-right">
      <span class="solong-header-create-btn" id="solong-header-create">✏️ 发起</span>
    </div>
  </header>

  <!-- ==========================================================
       内容容器
       ========================================================== -->
  <div class="solong-container">

    <!-- 统计面板 -->
    <div id="solong-stats"></div>

    <!-- 分类标签 -->
    <div id="solong-categories"></div>

    <!-- 接龙活动列表 -->
    <div id="solong-activities"></div>

  </div>

  <!-- ==========================================================
       小龙人吉祥物（fixed 右下角）
       ========================================================== -->
  <div class="solong-mascot" id="solong-mascot">
    🐉
  </div>

  <script src="js/solong-data.js"></script>
  <script src="js/solong-icons.js"></script>
  <script src="js/solong-nav.js"></script>
  <script src="js/home-page.js"></script>
  <script>
    renderBottomNav('home');
  </script>
  <script>
document.addEventListener('DOMContentLoaded', function() {
  var titleEl = document.querySelector('.solong-header-title');
  if (titleEl) titleEl.innerHTML = icon('dragon', 24) + ' 邻里接龙';
  
  var createBtn = document.getElementById('solong-header-create');
  if (createBtn) createBtn.innerHTML = icon('create', 16) + ' 发起';
  
  var mascot = document.getElementById('solong-mascot');
  if (mascot) mascot.innerHTML = icon('dragon', 32);
});
  </script>

</body>
</html>
