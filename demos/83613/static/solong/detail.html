<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>接龙详情 - 邻里接龙</title>
  <link rel="stylesheet" href="css/solong-theme.css">
  <style>
    /* ---------- Detail Page Specific Styles ---------- */
    .solong-detail-page {
      padding-top: calc(var(--solong-header-height) + 16px);
      padding-bottom: 24px;
    }

    .solong-detail-img {
      border-radius: var(--solong-radius-md);
    }

    .solong-price-large {
      font-size: 18px;
      font-weight: 700;
      color: var(--solong-primary);
    }
    .solong-price-large .solong-price-amount {
      font-size: 26px;
    }

    .solong-title-large {
      font-size: 22px;
      font-weight: 700;
      color: var(--solong-text);
      line-height: 1.35;
    }

    .solong-detail-meta {
      font-size: 14px;
      color: var(--solong-text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .solong-fun-tip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      margin-top: 10px;
    }

    .solong-cta-sub {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: var(--solong-text-disabled);
    }

    .solong-not-found {
      text-align: center;
      padding: 80px 20px;
      color: var(--solong-text-secondary);
    }
    .solong-not-found-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .solong-participant-scroll {
      max-height: 300px;
      overflow-y: auto;
    }

    .solong-celebration-title {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: 700;
      color: var(--solong-primary);
      white-space: nowrap;
      text-shadow: 0 2px 12px rgba(255, 122, 0, 0.35);
      animation: solong-scale-in 0.6s ease forwards;
      z-index: 10;
    }

    .solong-countdown-blink {
      animation: solong-blink 1s ease-in-out infinite;
    }

    .solong-participant-new {
      animation: solong-slide-in 0.5s ease forwards;
      background: rgba(255, 122, 0, 0.06) !important;
    }

    .solong-participant-qty {
      color: var(--solong-primary);
      font-weight: 600;
      margin-left: 4px;
    }

    .solong-participant-num {
      color: var(--solong-text-disabled);
      margin-right: 4px;
    }

    .solong-participant-remark {
      font-size: 12px;
      color: var(--solong-text-disabled);
      margin-top: 2px;
    }

    .solong-progress-text {
      text-align: center;
      margin-top: 8px;
      font-size: 14px;
      color: var(--solong-text-secondary);
    }

    /* ---------- Product List Card Styles ---------- */
    .solong-product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .solong-product-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: var(--solong-bg);
      border-radius: var(--solong-radius-sm);
      border: 1px solid var(--solong-border);
    }

    .solong-product-item-icon {
      font-size: 28px;
      line-height: 1;
      flex-shrink: 0;
    }

    .solong-product-item-body {
      flex: 1;
      min-width: 0;
    }

    .solong-product-item-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--solong-text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .solong-product-item-desc {
      font-size: 12px;
      color: var(--solong-text-secondary);
      margin-top: 4px;
      line-height: 1.4;
    }

    .solong-product-item-price {
      font-size: 14px;
      font-weight: 600;
      color: var(--solong-primary);
      margin-top: 4px;
    }

    .solong-badge-main {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 1px 8px;
      border-radius: 10px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #fff;
    }

    .solong-badge-addon {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 1px 8px;
      border-radius: 10px;
      background: var(--solong-primary-light);
      color: var(--solong-primary);
    }

    /* ---------- Modal Product Selection Styles ---------- */
    .solong-product-selection {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .solong-product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: var(--solong-bg);
      border-radius: var(--solong-radius-sm);
      border: 1px solid var(--solong-border);
    }

    .solong-product-row-info {
      flex: 1;
      min-width: 0;
    }

    .solong-product-row-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--solong-text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .solong-product-row-price {
      font-size: 12px;
      color: var(--solong-text-secondary);
      margin-top: 2px;
    }

    .solong-qty-input {
      width: 64px;
      text-align: center;
      flex-shrink: 0;
    }

    .solong-modal-total {
      text-align: right;
      font-size: 16px;
      font-weight: 700;
      color: var(--solong-primary);
      padding: 8px 12px;
      background: var(--solong-bg);
      border-radius: var(--solong-radius-sm);
      margin-bottom: 12px;
    }

    /* ---------- Modal Extra Fields (Community + Time) ---------- */
    .modal-extra-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .modal-extra-row .solong-form-group {
      flex: 1;
      margin-bottom: 0;
    }
    .modal-extra-row .solong-form-group .solong-label {
      margin-bottom: 6px;
    }
    .modal-time-slots {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .modal-time-slot {
      padding: 6px 14px;
      border: 1.5px solid var(--solong-border);
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      background: var(--solong-bg);
      color: var(--solong-text-secondary);
      transition: all 0.2s ease;
      user-select: none;
    }
    .modal-time-slot:hover {
      border-color: var(--solong-primary);
      color: var(--solong-primary);
    }
    .modal-time-slot.selected {
      background: var(--solong-primary);
      border-color: var(--solong-primary);
      color: var(--solong-white);
    }

    /* ---------- Participant Items Styles ---------- */
    .solong-participant-items {
      font-size: 13px;
      color: var(--solong-text-secondary);
      margin-top: 2px;
      line-height: 1.4;
    }

    .solong-participant-total {
      font-size: 14px;
      font-weight: 600;
      color: var(--solong-primary);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- =============================================================
       A: Header
       ============================================================= -->
  <header class="solong-header">
    <div class="solong-header-left">
      <button id="backBtn" style="font-size:20px;background:none;border:none;color:#fff;cursor:pointer;padding:0;" aria-label="返回"></button>
    </div>
    <div class="solong-header-title">邻里接龙</div>
    <div class="solong-header-right">
      <button id="shareBtn" style="font-size:20px;background:none;border:none;color:#fff;cursor:pointer;padding:0;" aria-label="分享"></button>
    </div>
  </header>

  <!-- =============================================================
       Main Content
       ============================================================= -->
  <div class="solong-container">

    <div class="solong-detail-page">

      <!-- B: Status Banner -->
      <div id="statusBanner" class="solong-status-banner"></div>

      <!-- C: Product Info Card -->
      <div class="solong-card" style="margin-top:16px;">

        <!-- C1: Image Placeholder -->
        <div id="detailImage" class="solong-detail-img"></div>

        <!-- C2: Info Section -->
        <div class="solong-detail-info">
          <h1 id="detailTitle" class="solong-title-large"></h1>

          <p id="detailDescription" style="font-size:14px;color:var(--solong-text-secondary);line-height:1.6;margin:0;"></p>

          <div id="detailOrganizer" class="solong-detail-meta"></div>

          <div id="detailTarget" style="font-size:14px;color:var(--solong-text-secondary);">
            目标：<span id="targetCount"></span> 人
          </div>

          <div id="detailCountdown" style="font-size:14px;color:var(--solong-text-secondary);">
          </div>
        </div>

      </div>

      <!-- C3: Product List Card (商品清单) -->
      <div class="solong-card" style="margin-top:16px;">
        <div class="solong-section-title" id="productListTitle">
          📋 商品清单
        </div>
        <div id="productList">
          <!-- Dynamically populated by JS -->
        </div>
      </div>

      <!-- D: Progress Area -->
      <div class="solong-card" style="margin-top:16px;">

        <div class="solong-progress-bar">
          <div id="progressFill" class="solong-progress-fill" style="width:0%;"></div>
        </div>

        <div id="progressText" class="solong-progress-text"></div>

        <div id="funTip" class="solong-fun-tip"></div>

      </div>

      <!-- E: CTA Button -->
      <div style="margin-top:16px;">
        <button id="ctaButton" class="solong-cta-button"></button>
        <p class="solong-cta-sub">无需登录，填写昵称即可参与</p>
      </div>

      <!-- F: Participant List -->
      <div class="solong-card" style="margin-top:16px;">
        <div id="participantTitle" class="solong-section-title">
          接龙名单
        </div>
        <div class="solong-participant-scroll">
          <div id="participantList" class="solong-participant-list"></div>
        </div>
      </div>

    </div>

    <!-- Mascot -->
    <div id="mascot" class="solong-mascot"></div>

  </div>

  <!-- =============================================================
       G: Participate Modal
       ============================================================= -->
  <div id="participateModal" class="solong-modal-overlay solong-hidden">
    <div class="solong-modal">
      <h3 id="modalTitle" style="font-size:20px;font-weight:600;margin-bottom:20px;">参与接龙</h3>

      <div class="solong-form-group">
        <label class="solong-label">昵称 <span style="color:var(--solong-danger);">*</span></label>
        <input id="nicknameInput" class="solong-input" type="text" placeholder="19栋1701小画家" maxlength="20" autocomplete="off">
        <div id="nicknameError" class="solong-error-text solong-hidden"></div>
      </div>

      <!-- Product Selection -->
      <div class="solong-form-group">
        <label class="solong-label">选购商品 <span style="color:var(--solong-danger);">*</span></label>
        <div id="productSelection" class="solong-product-selection">
          <!-- Dynamically populated by JS -->
        </div>
        <div id="productError" class="solong-error-text solong-hidden"></div>
      </div>

      <!-- Running Total -->
      <div id="modalTotal" class="solong-modal-total">合计：¥0.00</div>

      <!-- Extra: Community + Delivery Time -->
      <div class="modal-extra-row">
        <div class="solong-form-group">
          <label class="solong-label">选择小区 <span style="color:var(--solong-danger);">*</span></label>
          <select id="communitySelect" class="solong-input" style="appearance:auto;">
            <option value="">请选择小区</option>
            <option value="铂宸府">铂宸府</option>
            <option value="溪山悦">溪山悦</option>
            <option value="云麓传奇">云麓传奇</option>
          </select>
          <div id="communityError" class="solong-error-text solong-hidden">请选择您所在的小区</div>
        </div>
        <div class="solong-form-group">
          <label class="solong-label">期望送达时间 <span style="color:var(--solong-danger);">*</span></label>
          <div class="modal-time-slots" id="timeSlotGroup">
            <span class="modal-time-slot" data-time="6:30">6:30</span>
            <span class="modal-time-slot" data-time="7:00">7:00</span>
            <span class="modal-time-slot" data-time="7:30">7:30</span>
            <span class="modal-time-slot" data-time="8:00">8:00</span>
            <span class="modal-time-slot" data-time="8:30">8:30</span>
            <span class="modal-time-slot" data-time="9:00">9:00</span>
            <span class="modal-time-slot" data-time="其他">其他时间</span>
          </div>
          <input id="customTimeInput" class="solong-input solong-hidden" type="text" placeholder="请输入您期望的送达时间" style="margin-top:8px;" maxlength="30">
          <div id="timeError" class="solong-error-text solong-hidden">请选择或填写期望送达时间</div>
        </div>
      </div>

      <div class="solong-form-group">
        <label class="solong-label">备注（选填）</label>
        <input id="remarkInput" class="solong-input" type="text" placeholder="最多50字符" maxlength="50" autocomplete="off">
      </div>

      <div style="display:flex;gap:12px;margin-top:20px;">
        <button id="cancelModalBtn" class="solong-btn-outline" style="flex:1;">取消</button>
        <button id="submitParticipateBtn" class="solong-btn-primary" style="flex:1;">提交参与</button>
      </div>
    </div>
  </div>

  <!-- =============================================================
       H: Share Modal
       ============================================================= -->
  <div id="shareModal" class="solong-modal-overlay solong-hidden">
    <div class="solong-modal" style="max-width:360px;">
      <div style="text-align:center;padding:8px 0 4px;">
        <h3 style="font-size:20px;font-weight:600;margin-bottom:4px;">分享接龙</h3>
        <p style="font-size:13px;color:var(--solong-text-secondary);margin:0;">转发给邻居，大家一起参与</p>
      </div>

      <!-- 分享卡片 -->
      <div style="text-align:center;padding:12px 0;">
        <div id="shareCard" style="background:linear-gradient(145deg, #FF7A00 0%, #FF9A3C 100%);border-radius:20px;padding:0;display:inline-block;box-shadow:0 4px 20px rgba(255,122,0,0.25);width:100%;box-sizing:border-box;overflow:hidden;">

          <!-- 顶部装饰条 -->
          <div style="background:rgba(255,255,255,0.15);padding:14px 20px 10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:16px;">🐉</span>
                <span style="font-size:12px;color:rgba(255,255,255,0.9);font-weight:500;">邻里接龙</span>
              </div>
              <span id="shareCardStatus" style="font-size:11px;padding:3px 12px;border-radius:12px;background:rgba(255,255,255,0.25);color:#fff;font-weight:600;letter-spacing:0.5px;">进行中</span>
            </div>
          </div>

          <!-- 白色内容区 -->
          <div style="background:#fff;border-radius:20px 20px 0 0;padding:16px 20px 18px;margin-top:0;">

            <!-- 标题 -->
            <div style="font-size:19px;font-weight:700;color:#1a1a1a;line-height:1.35;margin-bottom:10px;" id="shareCardTitle">超甜芒果团</div>

            <!-- 团长 -->
            <div style="font-size:12px;color:#999;margin-bottom:12px;" id="shareCardOrganizer">👤 团长：王姐</div>

            <!-- 商品清单 -->
            <div style="background:#FFF8F0;border-radius:12px;padding:12px 14px;margin-bottom:14px;border:1px solid #FFE8D6;">
              <div style="font-size:12px;font-weight:600;color:#FF7A00;margin-bottom:8px;">🛒 商品清单</div>
              <div id="shareCardProducts" style="font-size:14px;color:#333;line-height:2;">
                <!-- 由 JS 填充 -->
              </div>
            </div>

            <!-- 关键数据行 -->
            <div style="display:flex;gap:10px;margin-bottom:14px;">
              <div style="flex:1;background:#FFF8F0;border-radius:12px;padding:12px 8px;text-align:center;border:1px solid #FFE8D6;">
                <div style="font-size:20px;font-weight:700;color:#FF7A00;line-height:1.2;" id="shareCardProgress">32/50</div>
                <div style="font-size:11px;color:#bbb;margin-top:4px;">参与人数</div>
              </div>
              <div style="flex:1;background:#FFF8F0;border-radius:12px;padding:12px 8px;text-align:center;border:1px solid #FFE8D6;">
                <div style="font-size:14px;font-weight:700;color:#FF7A00;line-height:1.2;" id="shareCardDeadline">
                  <span style="font-size:11px;color:#999;font-weight:400;" id="shareCardDeadlineLabel">今晚 8:00</span>
                </div>
                <div style="font-size:11px;color:#bbb;margin-top:4px;">截止时间</div>
              </div>
              <div style="flex:1;background:#FFF8F0;border-radius:12px;padding:12px 8px;text-align:center;border:1px solid #FFE8D6;">
                <div style="font-size:16px;font-weight:700;color:#FF7A00;line-height:1.2;" id="shareCardCommunity">全小区</div>
                <div style="font-size:11px;color:#bbb;margin-top:4px;">限定小区</div>
              </div>
            </div>

            <!-- 二维码 + 扫码提示 -->
            <div style="display:flex;align-items:center;gap:14px;background:linear-gradient(135deg, #FF7A00, #FF9A3C);border-radius:14px;padding:12px 16px;">
              <div style="flex:1;min-width:0;">
                <div style="font-size:14px;font-weight:700;color:#fff;margin-bottom:2px;">扫码参与接龙</div>
                <div style="font-size:11px;color:rgba(255,255,255,0.8);">长按识别或扫一扫立即加入</div>
              </div>
              <img id="qrcodeImg" src="" alt="二维码" style="width:88px;height:88px;display:block;border-radius:8px;flex-shrink:0;background:#fff;padding:4px;">
            </div>

          </div>
        </div>
      </div>

      <div style="display:flex;gap:12px;">
        <button id="closeShareBtn" class="solong-btn-outline" style="flex:1;height:44px;font-size:15px;border-radius:22px;">关闭</button>
        <button id="downloadQrcodeBtn" class="solong-btn-primary" style="flex:1;height:44px;font-size:15px;border-radius:22px;">保存图片</button>
      </div>
    </div>
  </div>

  <!-- =============================================================
       I: Celebration Container
       ============================================================= -->
  <div id="celebrationContainer" class="solong-celebration solong-hidden"></div>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/solong-icons.js"></script>
  <script src="js/solong-data.js"></script>
  <script src="js/detail-page.js"></script>
  <script>
    /* 替换静态 HTML 中的硬编码 emoji 为 SVG 图标 */
    document.getElementById('backBtn').innerHTML = icon('back', 20);
    document.querySelector('.solong-header-title').innerHTML = icon('dragon', 20) + ' 邻里接龙';
    document.getElementById('shareBtn').innerHTML = icon('share', 20);
    document.getElementById('mascot').innerHTML = icon('dragon', 32);

    /* 弹窗静态内容 */
    document.getElementById('modalTitle').innerHTML = icon('target', 22) + ' 参与接龙';
    document.getElementById('submitParticipateBtn').innerHTML = icon('check', 18) + ' 提交参与';

    /* 分享弹窗图标 */
    var closeShareBtn = document.getElementById('closeShareBtn');
    if (closeShareBtn) closeShareBtn.innerHTML = icon('close', 18) + ' 关闭';
    var downloadBtn = document.getElementById('downloadQrcodeBtn');
    if (downloadBtn) downloadBtn.innerHTML = '\u2B07\uFE0F 保存图片';
  </script>

</body>
</html>
