<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>发现接龙 - 邻里接龙</title>
  <link rel="stylesheet" href="css/solong-theme.css">

  <!-- 发现页专用样式 -->
  <style>
    /* ============================================================
       内容区域填充
       ============================================================ */
    .browse-container {
      padding-top: calc(var(--solong-header-height) + 16px);
      padding-bottom: calc(var(--solong-bottom-nav-height) + 24px);
    }

    /* ============================================================
       A. 顶部栏 — 橙黄渐变
       ============================================================ */
    .browse-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: var(--solong-header-height);
      padding: 0 16px;
      background: var(--solong-gradient);
      color: var(--solong-white);
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(255, 122, 0, 0.2);
      padding-top: env(safe-area-inset-top, 0);
      box-sizing: content-box;
      height: calc(var(--solong-header-height) + env(safe-area-inset-top, 0));
    }

    .browse-header-left,
    .browse-header-right {
      display: flex;
      align-items: center;
      min-width: 48px;
    }

    .browse-header-right {
      justify-content: flex-end;
    }

    .browse-header-back {
      display: flex;
      align-items: center;
      cursor: pointer;
      color: var(--solong-white);
      padding: 4px;
      border-radius: 50%;
      transition: background var(--solong-transition-fast);
    }

    .browse-header-back:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .browse-header-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .browse-header-search-btn {
      display: flex;
      align-items: center;
      cursor: pointer;
      color: var(--solong-white);
      padding: 4px;
      border-radius: 50%;
      transition: background var(--solong-transition-fast);
    }

    .browse-header-search-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ============================================================
       B. 搜索栏
       ============================================================ */
    .browse-search-wrap {
      padding: 12px 0 8px;
    }

    .browse-search-bar {
      position: relative;
      display: flex;
      align-items: center;
    }

    .browse-search-bar .browse-search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--solong-text-disabled);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .browse-search-bar input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 42px;
      background: var(--solong-white);
      border: 1.5px solid var(--solong-border);
      border-radius: var(--solong-radius-pill);
      color: var(--solong-text);
      font-size: 14px;
      transition: border-color var(--solong-transition-fast), box-shadow var(--solong-transition-fast);
    }

    .browse-search-bar input::placeholder {
      color: var(--solong-text-disabled);
    }

    .browse-search-bar input:focus {
      border-color: var(--solong-primary);
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.1);
      outline: none;
    }

    /* ============================================================
       C. 筛选栏
       ============================================================ */
    .browse-filter-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0 12px;
      gap: 8px;
    }

    /* 状态筛选标签 — 水平滚动 */
    .browse-status-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
      flex: 1;
      padding: 2px 0;
    }

    .browse-status-tabs::-webkit-scrollbar {
      display: none;
    }

    .browse-status-tab {
      flex-shrink: 0;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--solong-text-secondary);
      background: var(--solong-white);
      border: 1.5px solid var(--solong-border);
      border-radius: var(--solong-radius-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--solong-transition-fast);
      line-height: 1.4;
    }

    .browse-status-tab:active {
      transform: scale(0.96);
    }

    .browse-status-tab.active {
      color: var(--solong-white);
      background: var(--solong-gradient);
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(255, 122, 0, 0.25);
    }

    /* 排序区域 */
    .browse-sort-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .browse-sort-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 500;
      color: var(--solong-text-secondary);
      background: var(--solong-white);
      border: 1.5px solid var(--solong-border);
      border-radius: var(--solong-radius-pill);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--solong-transition-fast);
      line-height: 1.4;
    }

    .browse-sort-btn:active {
      transform: scale(0.96);
    }

    .browse-sort-btn .browse-sort-btn-icon {
      display: inline-flex;
      align-items: center;
    }

    /* 排序下拉菜单 */
    .browse-sort-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      background: var(--solong-white);
      border-radius: var(--solong-radius-sm);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      z-index: 100;
      min-width: 110px;
      display: none;
      animation: solong-scale-in 0.15s ease;
    }

    .browse-sort-dropdown.open {
      display: block;
    }

    .browse-sort-option {
      padding: 10px 16px;
      font-size: 14px;
      color: var(--solong-text);
      cursor: pointer;
      transition: background var(--solong-transition-fast);
      white-space: nowrap;
    }

    .browse-sort-option:active {
      background: var(--solong-bg);
    }

    .browse-sort-option.active {
      color: var(--solong-primary);
      font-weight: 600;
    }

    .browse-sort-option + .browse-sort-option {
      border-top: 1px solid var(--solong-border);
    }

    /* ============================================================
       D. 活动列表
       ============================================================ */
    #browse-activities {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 8px;
    }

    /* 加载更多按钮 */
    .browse-load-more-wrap {
      display: flex;
      justify-content: center;
      padding: 16px 0 8px;
    }

    .browse-load-more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 28px;
      font-size: 14px;
      font-weight: 500;
      color: var(--solong-primary);
      background: var(--solong-white);
      border: 1.5px solid var(--solong-primary);
      border-radius: var(--solong-radius-pill);
      cursor: pointer;
      transition: all var(--solong-transition-fast);
    }

    .browse-load-more-btn:active {
      background: var(--solong-bg);
      transform: scale(0.97);
    }

    .browse-load-more-btn .browse-load-icon {
      display: inline-flex;
      align-items: center;
    }

    .browse-load-more-btn.loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .browse-load-end {
      text-align: center;
      font-size: 13px;
      color: var(--solong-text-disabled);
      padding: 16px 0 8px;
    }

    /* 空状态 */
    .browse-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .browse-empty-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .browse-empty-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--solong-text-secondary);
      margin-bottom: 8px;
    }

    .browse-empty-sub {
      font-size: 13px;
      color: var(--solong-text-disabled);
    }

    /* ============================================================
       底部导航图标使用 SVG
       ============================================================ */
    .solong-nav-item .solong-nav-svg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      transition: transform var(--solong-transition-fast);
    }

    .solong-nav-item.active .solong-nav-svg {
      transform: scale(1.1);
    }

    /* ============================================================
       桌面端适配
       ============================================================ */
    @media (min-width: 768px) {
      .browse-header {
        max-width: 100%;
        left: 0;
        transform: none;
        padding: 0 24px;
        padding-top: env(safe-area-inset-top, 0);
      }

      .browse-container {
        max-width: 1200px;
        padding-left: 24px;
        padding-right: 24px;
        margin: 0 auto;
      }

      .browse-activity-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      #browse-activities {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }

      .browse-load-more-wrap {
        grid-column: 1 / -1;
      }

      .browse-end-text {
        grid-column: 1 / -1;
      }

      @media (min-width: 1024px) {
        #browse-activities {
          grid-template-columns: repeat(3, 1fr);
        }
      }
    }
  </style>
</head>
<body>

  <!-- ==========================================================
       A. 顶部栏（橙黄渐变）
       ========================================================== -->
  <header class="browse-header">
    <div class="browse-header-left">
      <span class="browse-header-back" id="browse-back-btn"></span>
    </div>
    <span class="browse-header-title">发现接龙</span>
    <div class="browse-header-right">
      <span class="browse-header-search-btn" id="browse-header-search-btn"></span>
    </div>
  </header>

  <!-- ==========================================================
       内容容器
       ========================================================== -->
  <div class="solong-container browse-container">

    <!-- B. 搜索栏 -->
    <div class="browse-search-wrap" id="browse-search-wrap"></div>

    <!-- C. 筛选栏 -->
    <div class="browse-filter-wrap" id="browse-filter-wrap"></div>

    <!-- D. 活动列表 -->
    <div id="browse-activities"></div>

    <!-- 加载更多 -->
    <div class="browse-load-more-wrap" id="browse-load-more-wrap"></div>

  </div>

  <script src="js/solong-data.js"></script>
  <script src="js/solong-icons.js"></script>
  <script src="js/solong-nav.js"></script>
  <script src="js/browse-page.js"></script>
  <script>
    renderBottomNav('discover');
  </script>

</body>
</html>
