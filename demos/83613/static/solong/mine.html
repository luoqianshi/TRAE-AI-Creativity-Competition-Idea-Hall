<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的接龙 - 邻里接龙</title>
  <link rel="stylesheet" href="css/solong-theme.css">
  <style>
    /* ============================================================
       页面内容区填充
       ============================================================ */
    .mine-page-body {
      padding-top: calc(var(--solong-header-height) + 16px);
      padding-bottom: calc(var(--solong-bottom-nav-height) + 24px);
      background: var(--solong-bg);
      min-height: 100vh;
    }

    /* ============================================================
       B. 用户信息面板
       ============================================================ */
    .mine-profile-card {
      background: linear-gradient(135deg, #FFF3E0, #FFE8CC);
      border-radius: var(--solong-radius-lg);
      padding: 20px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--solong-shadow-sm);
    }

    .mine-profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--solong-gradient);
      color: var(--solong-white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(255, 122, 0, 0.25);
    }

    .mine-profile-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 1;
    }

    .mine-profile-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--solong-text);
      line-height: 1.3;
    }

    .mine-profile-level {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--solong-primary);
      background: rgba(255, 122, 0, 0.1);
      padding: 2px 10px;
      border-radius: var(--solong-radius-pill);
      width: fit-content;
      line-height: 1.6;
    }

    .mine-profile-level .solong-icon {
      vertical-align: middle;
    }

    .mine-profile-stats {
      font-size: 13px;
      color: var(--solong-text-secondary);
      margin-top: 2px;
    }

    .mine-profile-stats strong {
      color: var(--solong-primary);
      font-size: 16px;
    }

    .mine-profile-deco {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.15;
      font-size: 72px;
      line-height: 1;
      pointer-events: none;
      z-index: 0;
    }

    .mine-profile-deco .solong-icon {
      width: 64px;
      height: 64px;
      color: var(--solong-primary);
    }

    /* ============================================================
       C. Tab 切换
       ============================================================ */
    .mine-tabs {
      display: flex;
      background: var(--solong-white);
      border-radius: var(--solong-radius-md);
      padding: 4px;
      margin-bottom: 16px;
      box-shadow: var(--solong-shadow-sm);
    }

    .mine-tab {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 14px;
      font-weight: 500;
      color: var(--solong-text-disabled);
      border-radius: var(--solong-radius-sm);
      cursor: pointer;
      transition: all var(--solong-transition-fast);
      user-select: none;
    }

    .mine-tab:active {
      opacity: 0.7;
    }

    .mine-tab.active {
      background: var(--solong-gradient);
      color: var(--solong-white);
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(255, 122, 0, 0.2);
    }

    .mine-tab-count {
      display: inline-block;
      margin-left: 4px;
      font-size: 12px;
      opacity: 0.8;
    }

    .mine-tab.active .mine-tab-count {
      opacity: 1;
    }

    /* ============================================================
       D/E. 活动列表区域
       ============================================================ */
    #mine-activities {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 8px;
    }

    /* ---------- 卡片操作按钮行 ---------- */
    .mine-card-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--solong-border);
      margin-top: 4px;
    }

    .mine-btn-close {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      background: var(--solong-gradient);
      color: var(--solong-white);
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--solong-radius-pill);
      cursor: pointer;
      transition: all var(--solong-transition-fast);
      border: none;
      line-height: 1.4;
    }

    .mine-btn-close:active {
      transform: scale(0.95);
      opacity: 0.85;
    }

    .mine-btn-close .solong-icon {
      vertical-align: middle;
    }

    .mine-btn-ended {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      background: var(--solong-badge-gray-bg);
      color: var(--solong-text-disabled);
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--solong-radius-pill);
      cursor: default;
      border: none;
      line-height: 1.4;
      pointer-events: none;
    }

    /* ---------- 参与摘要标签 ---------- */
    .mine-participate-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      background: var(--solong-badge-gold-bg);
      color: var(--solong-badge-gold-text);
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--solong-radius-pill);
      white-space: nowrap;
    }

    /* ---------- 空状态 ---------- */
    .mine-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
    }

    .mine-empty-icon {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .mine-empty-icon .solong-icon {
      width: 64px;
      height: 64px;
      color: var(--solong-text-disabled);
    }

    .mine-empty-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--solong-text-secondary);
      margin-bottom: 8px;
    }

    .mine-empty-sub {
      font-size: 13px;
      color: var(--solong-text-disabled);
    }

    .mine-empty-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 10px 24px;
      background: var(--solong-gradient);
      color: var(--solong-white);
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--solong-radius-pill);
      cursor: pointer;
      transition: all var(--solong-transition-fast);
      border: none;
    }

    .mine-empty-action:active {
      transform: scale(0.96);
      opacity: 0.85;
    }

    /* ---------- 已截单卡片灰色调（复用首页样式） ---------- */
    .solong-card-closed {
      opacity: 0.6;
      filter: grayscale(0.4);
    }

    .solong-card-closed .solong-card-img {
      filter: grayscale(0.6);
    }
  </style>
</head>
<body>

  <!-- ==========================================================
       A. 顶部栏（橙黄渐变）
       ========================================================== -->
  <header class="solong-header">
    <div class="solong-header-left">
      <a href="index.html" id="mine-back-btn" style="font-size:22px;line-height:1;color:var(--solong-white);display:inline-flex;align-items:center;gap:4px;cursor:pointer;">
        <span id="mine-icon-back"></span>
      </a>
    </div>
    <div class="solong-header-title">我的接龙</div>
    <div class="solong-header-right"></div>
  </header>

  <!-- ==========================================================
       内容容器
       ========================================================== -->
  <div class="solong-container mine-page-body">

    <!-- B. 用户信息面板 -->
    <div class="mine-profile-card">
      <div class="mine-profile-avatar" id="profileAvatar">邻</div>
      <div class="mine-profile-info">
        <div class="mine-profile-name" id="profileNickname">邻居</div>
        <div class="mine-profile-level" id="profileLevel">
          <span id="mine-icon-crown"></span>
          <span>接龙新手</span>
        </div>
        <div class="mine-profile-stats">
          参与 <strong id="profileCount">6</strong> 次邻里接龙
        </div>
      </div>
      <div class="mine-profile-deco" id="profileDeco">
        <span id="mine-icon-dragon"></span>
      </div>
    </div>

    <!-- C. Tab 切换 -->
    <div class="mine-tabs" id="mine-tabs">
      <div class="mine-tab active" data-tab="organized">
        我发起的 <span class="mine-tab-count" id="tab-organized-count">0</span>
      </div>
      <div class="mine-tab" data-tab="participated">
        我参与的 <span class="mine-tab-count" id="tab-participated-count">0</span>
      </div>
    </div>

    <!-- D/E. 活动列表容器 -->
    <div id="mine-activities"></div>

  </div>

  <script src="js/solong-data.js"></script>
  <script src="js/solong-icons.js"></script>
  <script src="js/solong-nav.js"></script>
  <script src="js/mine-page.js"></script>
  <script>
  renderBottomNav('profile');
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('mine-icon-back').innerHTML = icon('back', 24);
    document.getElementById('mine-icon-crown').innerHTML = icon('crown', 14);
    document.getElementById('mine-icon-dragon').innerHTML = icon('dragon', 72);
  });
  </script>
</body>
</html>
