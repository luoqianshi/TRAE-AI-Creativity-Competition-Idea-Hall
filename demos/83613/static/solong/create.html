<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>发起接龙 - 邻里接龙</title>
  <link rel="stylesheet" href="css/solong-theme.css">
  <style>
    /* 页面特有少量布局样式（仅布局定位，非主题样式） */
    .create-page-body {
      padding-top: calc(var(--solong-header-height, 56px) + 16px);
      padding-bottom: calc(var(--solong-bottom-nav-height, 60px) + 80px);
      background: var(--solong-bg);
      min-height: 100vh;
    }
    .create-fixed-bottom {
      position: fixed;
      bottom: calc(var(--solong-bottom-nav-height, 60px) + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 375px;
      padding: 12px 16px;
      padding-bottom: 12px;
      background: var(--solong-white);
      z-index: 900;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
    }
    .create-input-wrapper {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      background: var(--solong-bg);
      border: 1.5px solid var(--solong-border);
      border-radius: var(--solong-radius-sm);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .create-input-wrapper:focus-within {
      border-color: var(--solong-primary);
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.1);
    }
    .create-input-wrapper.solong-input-error {
      border-color: var(--solong-danger) !important;
      box-shadow: 0 0 0 3px rgba(255, 68, 68, 0.1) !important;
    }
    .create-input-prefix,
    .create-input-suffix {
      flex-shrink: 0;
      padding: 0 14px;
      font-size: 15px;
      color: var(--solong-text-secondary);
      font-weight: 500;
      line-height: 48px;
      white-space: nowrap;
    }
    .create-input-prefix {
      color: var(--solong-primary);
      font-weight: 600;
      font-size: 17px;
    }
    .create-input-wrapper input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 4px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--solong-text);
      -webkit-appearance: none;
      appearance: none;
    }
    .create-input-wrapper input::placeholder {
      color: var(--solong-text-disabled);
    }
    /* 移除 number input 的上下箭头 */
    .create-input-wrapper input[type="number"]::-webkit-outer-spin-button,
    .create-input-wrapper input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .create-input-wrapper input[type="number"] {
      -moz-appearance: textfield;
    }
    /* 图片上传预览区域 */
    .create-upload-preview {
      position: relative;
      width: 100%;
      height: 160px;
      border-radius: var(--solong-radius-sm);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .create-upload-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      border: none;
      line-height: 1;
    }
    .create-upload-delete:active {
      background: rgba(0, 0, 0, 0.7);
    }
    /* 备注文本域较小高度 */
    .create-textarea-sm {
      min-height: 72px;
      height: 72px;
      resize: none;
    }
    /* 分享弹窗自定义内容 */
    .create-share-success-icon {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 4px;
    }
    .create-share-link-box {
      width: 100%;
      padding: 12px 16px;
      background: var(--solong-bg);
      border: 1.5px solid var(--solong-border);
      border-radius: var(--solong-radius-sm);
      font-size: 13px;
      color: var(--solong-text-secondary);
      word-break: break-all;
      text-align: center;
    }
    .create-share-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .create-share-actions .solong-btn-outline {
      height: 44px;
      font-size: 15px;
      border-radius: 22px;
    }
    /* ─── 小区限定 ─── */
    .community-input-wrapper {
      position: relative;
      width: 100%;
    }
    .community-select-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 48px;
      padding: 6px 12px;
      background: var(--solong-bg);
      border: 1.5px solid var(--solong-border);
      border-radius: var(--solong-radius-sm);
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
      flex-wrap: wrap;
    }
    .community-select-trigger:focus,
    .community-select-trigger:hover {
      border-color: var(--solong-primary);
      box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.1);
    }
    .community-select-trigger .trigger-icon {
      font-size: 18px;
      flex-shrink: 0;
    }
    .community-select-trigger .trigger-placeholder {
      font-size: 14px;
      color: var(--solong-text-disabled);
      flex: 1;
    }
    .community-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      background: var(--solong-primary);
      color: var(--solong-white);
      font-size: 13px;
      font-weight: 500;
      border-radius: 12px;
      line-height: 1.6;
    }
    .community-tag-remove {
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      opacity: 0.8;
    }
    .community-tag-remove:hover {
      opacity: 1;
    }
    .community-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: var(--solong-white);
      border: 1.5px solid var(--solong-border);
      border-radius: var(--solong-radius-sm);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      z-index: 100;
      display: none;
      overflow: hidden;
    }
    .community-dropdown.open {
      display: block;
    }
    .community-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      cursor: pointer;
      font-size: 14px;
      color: var(--solong-text);
      transition: background 0.15s ease;
    }
    .community-option:hover {
      background: rgba(255, 122, 0, 0.06);
    }
    .community-option .checkmark {
      width: 18px;
      height: 18px;
      border: 2px solid var(--solong-border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
      font-size: 12px;
      color: transparent;
    }
    .community-option.selected .checkmark {
      background: var(--solong-primary);
      border-color: var(--solong-primary);
      color: #fff;
    }
    .community-option .option-label {
      flex: 1;
    }
    .community-hint {
      font-size: 12px;
      color: var(--solong-text-disabled);
      margin-top: 4px;
    }
    /* ─── 商品列表区域 ─── */
    .product-list-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .product-row {
      background: var(--solong-white);
      border: 1.5px solid var(--solong-border);
      border-radius: var(--solong-radius);
      padding: 12px 12px 10px;
      position: relative;
      transition: border-color 0.2s ease;
    }
    .product-row.solong-input-error {
      border-color: var(--solong-danger) !important;
    }
    .product-row-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .product-type-group {
      display: flex;
      gap: 6px;
    }
    .product-type-tag {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      line-height: 1.4;
      cursor: pointer;
      border: 1.5px solid var(--solong-border);
      background: var(--solong-bg);
      color: var(--solong-text-secondary);
      transition: all 0.2s ease;
      user-select: none;
    }
    .product-type-tag:hover {
      border-color: var(--solong-primary);
      color: var(--solong-primary);
    }
    .product-type-tag.active {
      border-color: transparent;
      color: var(--solong-white);
    }
    .product-type-tag.type-main.active {
      background: var(--solong-primary);
    }
    .product-type-tag.type-snack.active {
      background: #4CAF50;
    }
    .product-row-del {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--solong-bg);
      border: none;
      color: var(--solong-text-secondary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      flex-shrink: 0;
    }
    .product-row-del:active {
      background: #ffe8e8;
      color: var(--solong-danger);
    }
    .product-row-fields {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }
    .product-name-input {
      flex: 2 !important;
      min-width: 0;
    }
    .product-price-unit-group {
      flex: 3;
      display: flex;
      gap: 10px;
      min-width: 0;
    }
    .product-price-wrap {
      flex: 1;
      min-width: 0;
    }
    .product-price-wrap .create-input-prefix {
      font-size: 15px;
    }
    .product-unit-input {
      width: 72px !important;
      flex-shrink: 0;
    }
    .product-desc-input {
      min-height: 52px !important;
      height: 52px !important;
      resize: none;
      padding: 8px 12px !important;
    }
    .add-product-btn-wrap {
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <!-- ===== A. 顶部栏 ===== -->
  <header class="solong-header">
    <div class="solong-header-left">
      <a href="index.html" id="backBtn" style="font-size:22px;line-height:1;color:var(--solong-white);display:flex;align-items:center;gap:4px;cursor:pointer;">&#8592;</a>
    </div>
    <div class="solong-header-title">发起接龙</div>
    <div class="solong-header-right"></div>
  </header>

  <!-- ===== 表单内容区 ===== -->
  <div class="solong-container create-page-body">

    <!-- B. 活动标题 -->
    <div class="solong-form-group">
      <label class="solong-label" for="inputTitle">
        活动标题 <span style="color:var(--solong-danger);">*</span>
      </label>
      <input type="text" id="inputTitle" class="solong-input" placeholder="例：超甜芒果团" maxlength="30">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="solong-error-text solong-hidden" id="errorTitle">请输入活动标题（2-30字符）</div>
        <div class="solong-char-count" id="countTitle">0/30</div>
      </div>
    </div>

    <!-- C. 商品描述 -->
    <div class="solong-form-group">
      <label class="solong-label" for="inputDesc">
        商品描述 <span style="color:var(--solong-danger);">*</span>
      </label>
      <textarea id="inputDesc" class="solong-textarea" placeholder="请描述商品详情、产地、品质等..." rows="3" maxlength="500"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="solong-error-text solong-hidden" id="errorDesc">请输入商品描述（最多500字符）</div>
        <div class="solong-char-count" id="countDesc">0/500</div>
      </div>
    </div>

    <!-- D. 商品分类 -->
    <div class="solong-form-group">
      <label class="solong-label">
        商品分类 <span style="color:var(--solong-danger);">*</span>
      </label>
      <div class="solong-category-selector" id="categorySelector">
        <span class="solong-tag" data-category="fruit">水果🍎</span>
        <span class="solong-tag" data-category="noodle">卤粉🍜</span>
        <span class="solong-tag" data-category="seafood">海鲜🦐</span>
        <span class="solong-tag" data-category="nut">坚果🥜</span>
        <span class="solong-tag" data-category="snack">零食🍿</span>
        <span class="solong-tag" data-category="other">其他📦</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="solong-error-text solong-hidden" id="errorCategory">请选择一个商品分类</div>
        <div></div>
      </div>
    </div>

    <!-- E. 商品图片 -->
    <div class="solong-form-group">
      <label class="solong-label">商品图片 <span style="color:var(--solong-text-disabled);font-weight:400;font-size:12px;">（选填）</span></label>
      <input type="file" id="imageFileInput" accept="image/jpeg,image/png" style="display:none;">
      <div id="imageUploadArea" class="solong-image-upload" style="height:160px;">
        <div class="solong-upload-icon">&#128248;</div>
        <span>点击上传图片</span>
        <span class="solong-upload-hint">支持 JPG / PNG 格式</span>
      </div>
      <div id="imagePreviewArea" class="solong-hidden" style="position:relative;">
        <div class="create-upload-preview">
          <img id="imagePreviewImg" style="width:100%;height:100%;object-fit:cover;display:block;">
          <button class="create-upload-delete" id="uploadDeleteBtn">&times;</button>
        </div>
      </div>
    </div>

    <!-- F1. 小区限定 -->
    <div class="solong-form-group" id="communityField">
      <label class="solong-label">
        小区限定 <span style="color:var(--solong-text-disabled);font-weight:400;font-size:12px;">（可选多个）</span>
      </label>
      <div class="community-input-wrapper" id="communityWrapper">
        <div class="community-select-trigger" id="communityTrigger" tabindex="0">
          <span class="trigger-icon">&#127963;</span>
          <span class="trigger-placeholder" id="communityPlaceholder">选择小区</span>
          <div id="communityTags" style="display:inline-flex;gap:4px;flex-wrap:wrap;"></div>
        </div>
        <div class="community-dropdown" id="communityDropdown">
          <div class="community-option" data-value="铂宸府">
            <span class="checkmark">✓</span>
            <span class="option-label">铂宸府</span>
          </div>
          <div class="community-option" data-value="溪山悦">
            <span class="checkmark">✓</span>
            <span class="option-label">溪山悦</span>
          </div>
          <div class="community-option" data-value="云麓传奇">
            <span class="checkmark">✓</span>
            <span class="option-label">云麓传奇</span>
          </div>
        </div>
      </div>
      <div class="community-hint">选择后，该接龙仅限所选小区邻居参与</div>
    </div>

    <!-- F2. 商品列表 -->
    <div class="solong-form-group">
      <label class="solong-label">
        商品清单 <span style="color:var(--solong-text-disabled);font-weight:400;font-size:12px;">至少1个商品，可区分为主食或小吃</span>
      </label>
      <div class="product-list-container" id="productListContainer">
        <!-- 商品行由 create-page.js 动态渲染 -->
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="solong-error-text solong-hidden" id="errorProducts">请完善商品信息（名称、价格、单位必填）</div>
        <div></div>
      </div>
      <div class="add-product-btn-wrap">
        <button class="solong-btn-outline" id="addProductBtn" style="width:100%;height:40px;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px;">+ 添加加购商品</button>
      </div>
    </div>

    <!-- G. 接龙人数上限 -->
    <div class="solong-form-group">
      <label class="solong-label" for="inputTarget">
        最多接龙人数 <span style="color:var(--solong-danger);">*</span>
      </label>
      <div class="create-input-wrapper" id="targetWrapper">
        <input type="number" id="inputTarget" placeholder="例：50" min="1" step="1" style="text-align:right;">
        <span class="create-input-suffix">人</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="solong-error-text solong-hidden" id="errorTarget">请输入至少1人的正整数</div>
        <div></div>
      </div>
    </div>

    <!-- H. 截止时间 -->
    <div class="solong-form-group">
      <label class="solong-label" for="inputDeadline">
        截止时间 <span style="color:var(--solong-danger);">*</span>
      </label>
      <input type="datetime-local" id="inputDeadline" class="solong-input">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="solong-error-text solong-hidden" id="errorDeadline">截止时间必须晚于当前时间</div>
        <div></div>
      </div>
    </div>

    <!-- I. 备注说明 -->
    <div class="solong-form-group">
      <label class="solong-label" for="inputRemark">备注说明 <span style="color:var(--solong-text-disabled);font-weight:400;font-size:12px;">（选填）</span></label>
      <textarea id="inputRemark" class="solong-textarea create-textarea-sm" placeholder="例：晚上8点小区北门取货，请自备零钱" maxlength="200" rows="2"></textarea>
      <div style="display:flex;justify-content:flex-end;">
        <div class="solong-char-count" id="countRemark">0/200</div>
      </div>
    </div>

  </div>

  <!-- ===== J. 提交按钮（fixed 底部） ===== -->
  <div class="create-fixed-bottom">
    <button class="solong-cta-button" id="submitBtn">&#128009; 立即发布</button>
  </div>

  <script src="js/solong-data.js"></script>
  <script src="js/solong-icons.js"></script>
  <script src="js/solong-nav.js"></script>
  <script src="js/create-page.js"></script>
  <script>
    renderBottomNav('create');
  </script>
  <div class="solong-modal-overlay solong-hidden" id="shareModal">
    <div class="solong-modal">
      <div class="solong-share-modal">
        <div class="create-share-success-icon">&#127881;</div>
        <div class="solong-share-title">发布成功！</div>
        <div class="create-share-link-box" id="shareLinkBox">https://solong.app/chain/9</div>
        <div class="create-share-actions">
          <button class="solong-btn-primary" id="copyLinkBtn" style="height:44px;font-size:15px;border-radius:22px;">复制链接</button>
          <button class="solong-btn-outline" id="viewDetailBtn" style="height:44px;font-size:15px;border-radius:22px;">去查看详情</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    // 替换返回按钮
    var backBtn = document.getElementById('backBtn');
    if (backBtn) backBtn.innerHTML = icon('back', 22);

    // 替换上传区域图标
    var uploadIcon = document.querySelector('.solong-upload-icon');
    if (uploadIcon) uploadIcon.innerHTML = icon('camera', 32);

    // 替换提交按钮
    var submitBtn = document.getElementById('submitBtn');
    if (submitBtn) submitBtn.innerHTML = icon('dragon', 20) + ' 立即发布';

    // 替换分享弹窗图标
    var shareIcon = document.querySelector('.create-share-success-icon');
    if (shareIcon) shareIcon.innerHTML = icon('celebrate', 48);
  });
  </script>
</body>
</html>
