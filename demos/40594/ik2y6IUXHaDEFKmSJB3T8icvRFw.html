<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlycoBase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5faf7;
            min-height: 100vh;
            padding: 60px 24px 40px;
        }
        .header {
            text-align: center;
            margin-bottom: 60px;
        }
        .logo {
            font-size: 40px;
            font-weight: 700;
            color: #1e8449;
            margin-bottom: 8px;
        }
        .slogan {
            font-size: 18px;
            color: #52be80;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 480px;
            margin: 0 auto;
        }
        .main-btn {
            width: 100%;
            height: 120px;
            border: none;
            border-radius: 20px;
            font-size: 28px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .main-btn:active {
            transform: scale(0.98);
        }
        .btn-camera {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
        }
        .btn-voice {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }
        .btn-export {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        }
        .btn-icon {
            font-size: 40px;
        }
        .tips {
            text-align: center;
            margin-top: 48px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">GlycoBase</div>
        <div class="slogan">顺人性AI控糖助手</div>
    </div>

    <div class="btn-group">
        <button class="main-btn btn-camera">
            <span class="btn-icon">📸</span>
            <span>拍一拍</span>
        </button>
        <button class="main-btn btn-voice">
            <span class="btn-icon">🎙️</span>
            <span>语音助手</span>
        </button>
        <button class="main-btn btn-export">
            <span class="btn-icon">📄</span>
            <span>导出血糖简历</span>
        </button>
    </div>

    <div class="tips">
        本产品为健康生活辅助工具，不替代专业医疗诊断
    </div>
</body>
</html>
