<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>姓名命理·五格解码</title>
<style>
:root {
  --gold: #C9A96E;
  --gold-light: #E8D5A3;
  --gold-dark: #8B6914;
  --jade: #2D5A3D;
  --jade-light: #4A8C63;
  --cinnabar: #C23B2A;
  --cinnabar-light: #E85D4A;
  --ink: #1A1A1A;
  --ink-light: #2C2C2C;
  --paper: #F5F0E8;
  --paper-dark: #E8DFD0;
  --text: #2C2416;
  --text-light: #6B5E4A;
  --shadow: rgba(0,0,0,0.15);
  --radius: 12px;
  --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

@font-face {
  font-family: 'SongTi';
  src: local('STSong'), local('SimSun'), local('Songti SC'), local('Noto Serif CJK SC'), local('serif');
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'SongTi', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
  background: var(--paper);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== Background ===== */
.bg-wrapper {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 0%, #F5F0E8 0%, #E8DFD0 40%, #D4C8B0 100%);
}

.bg-wrapper::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 50% 50%, rgba(201,169,110,0.08) 0%, transparent 60%),
    radial-gradient(circle at 20% 80%, rgba(45,90,61,0.06) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(194,59,42,0.04) 0%, transparent 50%);
}

.taiji {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: min(80vw, 600px);
  height: min(80vw, 600px);
  border-radius: 50%;
  border: 2px solid rgba(201,169,110,0.15);
  opacity: 0.5;
  animation: taijiRotate 60s linear infinite;
}

.taiji::before {
  content: '';
  position: absolute;
  inset: 15%;
  border-radius: 50%;
  border: 1px solid rgba(201,169,110,0.12);
}

.taiji::after {
  content: '';
  position: absolute;
  inset: 30%;
  border-radius: 50%;
  border: 1px solid rgba(201,169,110,0.1);
}

.bagua-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(70vw, 520px);
  height: min(70vw, 520px);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px dashed rgba(201,169,110,0.2);
  animation: taijiRotate 90s linear infinite reverse;
}

@keyframes taijiRotate {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to { transform: translate(-50%, -50%) rotate(360deg); }
}

.particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0;
  animation: float 8s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { opacity: 0; transform: translateY(0) scale(1); }
  20% { opacity: 0.6; }
  50% { opacity: 0.3; transform: translateY(-40px) scale(1.5); }
  80% { opacity: 0.1; }
}

/* ===== App Container ===== */
.app-container {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

/* ===== Header ===== */
.app-header {
  text-align: center;
  padding: 40px 0 20px;
}

.app-title {
  font-size: 2rem;
  font-weight: 700;
  color: var(--gold-dark);
  letter-spacing: 0.15em;
  text-shadow: 2px 2px 4px rgba(139,105,20,0.15);
  margin-bottom: 8px;
}

.app-subtitle {
  font-size: 0.85rem;
  color: var(--text-light);
  letter-spacing: 0.2em;
  font-weight: 400;
}

/* ===== Home Page ===== */
.page { display: none; flex-direction: column; flex: 1; }
.page.active { display: flex; }

.home-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
  padding-top: 5vh;
  flex: 1;
}

.input-group {
  width: 100%;
  position: relative;
}

.name-input {
  width: 100%;
  padding: 18px 24px;
  font-size: 1.5rem;
  font-family: inherit;
  text-align: center;
  background: rgba(255,255,255,0.8);
  border: 2px solid var(--gold-light);
  border-radius: 50px;
  color: var(--text);
  outline: none;
  transition: all var(--transition);
  letter-spacing: 0.3em;
  backdrop-filter: blur(10px);
}

.name-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 30px rgba(201,169,110,0.25), 0 0 0 4px rgba(201,169,110,0.08);
  background: rgba(255,255,255,0.95);
}

.name-input::placeholder {
  color: #c4b99a;
  letter-spacing: 0.15em;
  font-size: 1rem;
}

.char-count {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.8rem;
  color: var(--text-light);
  pointer-events: none;
}

.btn-calculate {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, #C9A96E 0%, #8B6914 100%);
  color: #fff;
  font-size: 1.2rem;
  font-family: inherit;
  letter-spacing: 0.15em;
  cursor: pointer;
  position: relative;
  box-shadow: 0 8px 32px rgba(139,105,20,0.35), 0 0 0 8px rgba(201,169,110,0.12);
  transition: all var(--transition);
  overflow: hidden;
  flex-shrink: 0;
  align-self: center;
}

.btn-calculate::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid rgba(201,169,110,0.3);
  animation: pulseRing 2s ease-out infinite;
}

.btn-calculate::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.btn-calculate:hover::after {
  opacity: 1;
}

@keyframes pulseRing {
  0% { transform: scale(1); opacity: 1; }
  100% { transform: scale(1.18); opacity: 0; }
}

.btn-calculate:hover {
  transform: scale(1.05);
  box-shadow: 0 12px 40px rgba(139,105,20,0.45), 0 0 0 12px rgba(201,169,110,0.15);
}

.btn-calculate:active {
  transform: scale(0.92);
  transition: transform 0.15s ease;
  box-shadow: 0 4px 16px rgba(139,105,20,0.3), 0 0 0 4px rgba(201,169,110,0.1);
}

.btn-calculate .btn-icon {
  font-size: 2rem;
  display: block;
  margin-bottom: 4px;
  transition: transform 0.3s ease;
}

.btn-calculate:hover .btn-icon {
  transform: rotate(180deg);
}

.history-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--gold-light);
  background: rgba(255,255,255,0.6);
  cursor: pointer;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition);
  backdrop-filter: blur(10px);
  color: var(--gold-dark);
}

.history-btn:hover {
  background: rgba(255,255,255,0.9);
  border-color: var(--gold);
}

/* ===== Result Page ===== */
.result-page {
  gap: 20px;
}

.result-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}

.back-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--gold-light);
  background: rgba(255,255,255,0.6);
  cursor: pointer;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all var(--transition);
  flex-shrink: 0;
}

.back-btn:hover { background: rgba(255,255,255,0.9); }

.result-name {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold-dark);
  letter-spacing: 0.2em;
}

.result-score {
  margin-left: auto;
  font-size: 2rem;
  font-weight: 700;
  color: var(--cinnabar);
  text-align: center;
}

.result-score span {
  font-size: 0.8rem;
  color: var(--text-light);
  display: block;
}

/* ===== Radar Chart ===== */
.radar-container {
  background: rgba(255,255,255,0.7);
  border-radius: var(--radius);
  padding: 16px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(201,169,110,0.2);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 260px;
}

.radar-container canvas {
  max-width: 100%;
  height: auto;
}

/* ===== Summary Cards ===== */
.summary-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.summary-card {
  background: rgba(255,255,255,0.7);
  border-radius: var(--radius);
  padding: 14px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(201,169,110,0.15);
  text-align: center;
  transition: all var(--transition);
}

.summary-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}

.summary-card .card-label {
  font-size: 0.75rem;
  color: var(--text-light);
  margin-bottom: 4px;
}

.summary-card .card-value {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--gold-dark);
}

.summary-card .card-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  margin-top: 4px;
  letter-spacing: 0.1em;
}

.badge-ji { background: #E8F5E9; color: #2E7D32; }
.badge-banji { background: #FFF8E1; color: #F57F17; }
.badge-xiong { background: #FFEBEE; color: #C62828; }
.badge-daji { background: #C8E6C9; color: #1B5E20; }
.badge-daxiong { background: #FFCDD2; color: #B71C1C; }

/* ===== Tabs ===== */
.tabs-container {
  background: rgba(255,255,255,0.7);
  border-radius: var(--radius);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(201,169,110,0.2);
  overflow: hidden;
}

.tabs-nav {
  display: flex;
  border-bottom: 1px solid rgba(201,169,110,0.2);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.tab-btn {
  flex: 1;
  min-width: fit-content;
  padding: 14px 12px;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.85rem;
  color: var(--text-light);
  cursor: pointer;
  white-space: nowrap;
  transition: all var(--transition);
  position: relative;
  letter-spacing: 0.05em;
}

.tab-btn.active {
  color: var(--gold-dark);
  font-weight: 700;
}

.tab-btn.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  background: var(--gold);
  border-radius: 1px;
}

.tab-content {
  display: none;
  padding: 16px;
  animation: fadeSlideIn 0.5s ease;
}

.tab-content.active { display: block; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Wuge Detail ===== */
.wuge-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid rgba(201,169,110,0.1);
  animation: fadeSlideIn 0.5s ease backwards;
}
.wuge-item:nth-child(1) { animation-delay: 0.1s; }
.wuge-item:nth-child(2) { animation-delay: 0.2s; }
.wuge-item:nth-child(3) { animation-delay: 0.3s; }
.wuge-item:nth-child(4) { animation-delay: 0.4s; }
.wuge-item:nth-child(5) { animation-delay: 0.5s; }

.wuge-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  font-weight: 700;
  flex-shrink: 0;
  color: #fff;
}

.wuge-icon.tian { background: linear-gradient(135deg, #6B5B9E, #4A3F7A); }
.wuge-icon.ren { background: linear-gradient(135deg, #C23B2A, #9B2D1F); }
.wuge-icon.di { background: linear-gradient(135deg, #2D5A3D, #1E3D29); }
.wuge-icon.wai { background: linear-gradient(135deg, #D4842A, #A8651E); }
.wuge-icon.zong { background: linear-gradient(135deg, #1A6B8A, #124D64); }

.wuge-info { flex: 1; min-width: 0; }
.wuge-info .wuge-name { font-weight: 700; font-size: 0.9rem; }
.wuge-info .wuge-desc { font-size: 0.75rem; color: var(--text-light); margin-top: 2px; }
.wuge-info .wuge-meaning { font-size: 0.78rem; color: var(--text); margin-top: 4px; line-height: 1.5; }

.wuge-stats { text-align: right; flex-shrink: 0; }
.wuge-stats .wuge-num { font-size: 1.3rem; font-weight: 700; }
.wuge-stats .wuge-wuxing { font-size: 0.75rem; color: var(--text-light); }
.wuge-stats .wuge-luck { font-size: 0.7rem; margin-top: 2px; }

/* ===== Sancai ===== */
.sancai-visual {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 20px 0;
  flex-wrap: wrap;
}

.sancai-block {
  text-align: center;
  padding: 16px;
  border-radius: var(--radius);
  min-width: 70px;
}

.sancai-block.tian-block { background: rgba(107,91,158,0.1); border: 1px solid rgba(107,91,158,0.3); }
.sancai-block.ren-block { background: rgba(194,59,42,0.1); border: 1px solid rgba(194,59,42,0.3); }
.sancai-block.di-block { background: rgba(45,90,61,0.1); border: 1px solid rgba(45,90,61,0.3); }

.sancai-arrow {
  font-size: 1.5rem;
  color: var(--gold);
}

.sancai-block .sancai-label {
  font-size: 0.7rem;
  color: var(--text-light);
  margin-bottom: 4px;
}

.sancai-block .sancai-wuxing {
  font-size: 1.4rem;
  font-weight: 700;
}

.sancai-result {
  text-align: center;
  padding: 16px;
  background: rgba(255,255,255,0.5);
  border-radius: var(--radius);
  margin-top: 12px;
}

.sancai-result .sancai-combo {
  font-size: 1.2rem;
  font-weight: 700;
  letter-spacing: 0.15em;
}

.sancai-judgment {
  display: inline-block;
  padding: 4px 16px;
  border-radius: 20px;
  font-size: 0.85rem;
  margin-top: 8px;
  font-weight: 700;
}

.sancai-relations {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.relation-card {
  background: rgba(255,255,255,0.5);
  border-radius: 8px;
  padding: 10px;
  font-size: 0.8rem;
  text-align: center;
  border: 1px solid rgba(201,169,110,0.1);
}

.relation-card .rel-type {
  font-weight: 700;
  color: var(--gold-dark);
}

/* ===== Life Trajectory ===== */
.trajectory-timeline {
  position: relative;
  padding-left: 24px;
}

.trajectory-timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--gold-light), var(--gold), var(--gold-dark));
}

.trajectory-item {
  position: relative;
  padding: 16px 0 16px 20px;
  animation: fadeSlideIn 0.5s ease backwards;
}
.trajectory-item:nth-child(1) { animation-delay: 0.1s; }
.trajectory-item:nth-child(2) { animation-delay: 0.3s; }
.trajectory-item:nth-child(3) { animation-delay: 0.5s; }

.trajectory-item::before {
  content: '';
  position: absolute;
  left: -20px;
  top: 20px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--gold);
  border: 3px solid var(--paper);
  box-shadow: 0 0 0 2px var(--gold-light);
}

.trajectory-item .traj-age {
  font-size: 0.8rem;
  color: var(--gold-dark);
  font-weight: 700;
  margin-bottom: 4px;
}

.trajectory-item .traj-title {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 4px;
}

.trajectory-item .traj-desc {
  font-size: 0.82rem;
  color: var(--text-light);
  line-height: 1.6;
}

/* ===== Recommendations ===== */
.rec-section {
  margin-bottom: 16px;
}

.rec-section h4 {
  font-size: 0.9rem;
  color: var(--gold-dark);
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(201,169,110,0.2);
}

.rec-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.rec-item {
  background: rgba(255,255,255,0.5);
  border-radius: 8px;
  padding: 10px;
  border: 1px solid rgba(201,169,110,0.1);
}

.rec-item .rec-label {
  font-size: 0.7rem;
  color: var(--text-light);
}

.rec-item .rec-value {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
  margin-top: 2px;
}

/* ===== History Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.modal-overlay.active { display: flex; }

.modal-sheet {
  background: var(--paper);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 480px;
  max-height: 70vh;
  overflow-y: auto;
  padding: 20px;
  animation: slideUp 0.4s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-handle {
  width: 40px;
  height: 4px;
  background: var(--gold-light);
  border-radius: 2px;
  margin: 0 auto 16px;
}

.modal-sheet h3 {
  text-align: center;
  color: var(--gold-dark);
  letter-spacing: 0.1em;
  margin-bottom: 16px;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: rgba(255,255,255,0.5);
  border-radius: var(--radius);
  margin-bottom: 8px;
  cursor: pointer;
  transition: all var(--transition);
  border: 1px solid rgba(201,169,110,0.1);
}

.history-item:hover {
  background: rgba(255,255,255,0.8);
  border-color: var(--gold-light);
}

.history-item .hist-name {
  font-weight: 700;
  font-size: 1rem;
  color: var(--gold-dark);
}

.history-item .hist-score {
  margin-left: auto;
  font-weight: 700;
  color: var(--cinnabar);
}

.history-item .hist-date {
  font-size: 0.7rem;
  color: var(--text-light);
}

.history-item .hist-delete {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: rgba(194,59,42,0.1);
  color: var(--cinnabar);
  cursor: pointer;
  font-size: 0.8rem;
  transition: all var(--transition);
}

.history-item .hist-delete:hover {
  background: rgba(194,59,42,0.2);
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-light);
}

.empty-state .empty-icon {
  font-size: 3rem;
  margin-bottom: 12px;
  opacity: 0.5;
}

/* ===== Daily Tip ===== */
.daily-tip {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;
  max-width: 440px;
  margin: 0 auto;
  background: linear-gradient(135deg, rgba(201,169,110,0.95), rgba(139,105,20,0.95));
  color: #fff;
  padding: 16px 20px;
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(139,105,20,0.3);
  z-index: 50;
  animation: slideUp 0.5s ease;
  display: none;
  backdrop-filter: blur(10px);
}

.daily-tip.visible { display: block; }

.daily-tip .tip-close {
  position: absolute;
  top: 8px;
  right: 12px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 1.2rem;
  cursor: pointer;
}

.daily-tip .tip-title {
  font-size: 0.8rem;
  opacity: 0.8;
  margin-bottom: 4px;
  letter-spacing: 0.1em;
}

.daily-tip .tip-content {
  font-size: 0.9rem;
  line-height: 1.5;
}

/* ===== Manual Stroke Modal ===== */
.stroke-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}

.stroke-modal.active { display: flex; }

.stroke-dialog {
  background: var(--paper);
  border-radius: var(--radius);
  padding: 24px;
  width: 90%;
  max-width: 360px;
  text-align: center;
  animation: fadeSlideIn 0.3s ease;
}

.stroke-dialog h4 {
  color: var(--gold-dark);
  margin-bottom: 8px;
}

.stroke-dialog p {
  font-size: 0.85rem;
  color: var(--text-light);
  margin-bottom: 16px;
}

.stroke-dialog input {
  width: 80px;
  padding: 10px;
  text-align: center;
  font-size: 1.2rem;
  font-family: inherit;
  border: 2px solid var(--gold-light);
  border-radius: 8px;
  outline: none;
}

.stroke-dialog input:focus {
  border-color: var(--gold);
}

.stroke-dialog .btn-confirm {
  display: block;
  margin: 16px auto 0;
  padding: 10px 32px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 24px;
  font-family: inherit;
  font-size: 0.9rem;
  cursor: pointer;
  letter-spacing: 0.1em;
}

/* ===== Responsive ===== */
@media (min-width: 768px) {
  .app-container { max-width: 520px; padding: 30px; }
  .app-title { font-size: 2.4rem; }
  .summary-cards { grid-template-columns: repeat(5, 1fr); }
}

@media (max-width: 360px) {
  .app-title { font-size: 1.6rem; }
  .name-input { font-size: 1.2rem; padding: 14px 20px; }
  .btn-calculate { width: 110px; height: 110px; font-size: 1rem; }
  .tabs-nav { font-size: 0.75rem; }
  .tab-btn { padding: 10px 8px; font-size: 0.75rem; }
}

/* ===== Footer ===== */
.app-footer {
  text-align: center;
  padding: 20px 0;
  font-size: 0.7rem;
  color: var(--text-light);
  opacity: 0.6;
  letter-spacing: 0.1em;
}
</style>
</head>
<body>

<div class="bg-wrapper">
  <div class="taiji"></div>
  <div class="bagua-ring"></div>
  <div class="particles" id="particles"></div>
</div>

<div class="app-container">

  <!-- ===== HOME PAGE ===== -->
  <div class="page active" id="homePage">
    <button class="history-btn" onclick="openHistory()" title="历史记录">📋</button>
    <div class="app-header">
      <h1 class="app-title">姓名命理·五格解码</h1>
      <p class="app-subtitle">—— 探秘姓名玄机 · 洞悉人生运势 ——</p>
    </div>
    <div class="home-page">
      <div class="input-group">
        <input type="text" class="name-input" id="nameInput" placeholder="请输入中文姓名" maxlength="4" autocomplete="off">
        <span class="char-count" id="charCount">0/4字</span>
      </div>
      <button class="btn-calculate" onclick="calculate()">
        <span class="btn-icon">☯</span>
        开始测算
      </button>
    </div>
    <div class="app-footer">本工具仅供娱乐参考 · 数据本地处理 · 保护隐私</div>
  </div>

  <!-- ===== RESULT PAGE ===== -->
  <div class="page" id="resultPage">
    <div class="result-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <div class="result-name" id="resultName"></div>
      <div class="result-score" id="resultScore"></div>
    </div>

    <div class="radar-container">
      <canvas id="radarChart" width="280" height="280"></canvas>
    </div>

    <div class="summary-cards" id="summaryCards"></div>

    <div class="tabs-container">
      <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('wuge', this)">五格详情</button>
        <button class="tab-btn" onclick="switchTab('sancai', this)">三才分析</button>
        <button class="tab-btn" onclick="switchTab('trajectory', this)">人生轨迹</button>
        <button class="tab-btn" onclick="switchTab('advice', this)">趋吉避凶</button>
      </div>
      <div class="tab-content active" id="tab-wuge"></div>
      <div class="tab-content" id="tab-sancai"></div>
      <div class="tab-content" id="tab-trajectory"></div>
      <div class="tab-content" id="tab-advice"></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn-fav" id="btnFav" onclick="toggleFavorite()" style="flex:1;padding:12px;border-radius:24px;border:1px solid var(--gold-light);background:rgba(255,255,255,0.6);font-family:inherit;cursor:pointer;letter-spacing:0.1em;transition:all var(--transition);">☆ 收藏报告</button>
      <button class="btn-share" onclick="shareResult()" style="flex:1;padding:12px;border-radius:24px;border:1px solid var(--gold-light);background:rgba(255,255,255,0.6);font-family:inherit;cursor:pointer;letter-spacing:0.1em;transition:all var(--transition);">↗ 分享结果</button>
    </div>
    <div class="app-footer">本工具仅供娱乐参考 · 数据本地处理 · 保护隐私</div>
  </div>
</div>

<!-- History Modal -->
<div class="modal-overlay" id="historyModal" onclick="closeHistory(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <h3>📜 历史记录</h3>
    <div id="historyList"></div>
  </div>
</div>

<!-- Manual Stroke Modal -->
<div class="stroke-modal" id="strokeModal">
  <div class="stroke-dialog">
    <h4>⚠ 生僻字提示</h4>

    <input type="number" id="manualStroke" min="1" max="64" value="1">
    <button class="btn-confirm" onclick="confirmStroke()">确认</button>
  </div>
</div>

<!-- Daily Tip -->
<div class="daily-tip" id="dailyTip">

function getWuxing(num) {
  const r = ((num - 1) % 10) + 1;
  if (r <= 2) return '木';
  if (r <= 4) return '火';
  if (r <= 6) return '土';
  if (r <= 8) return '金';
  return '水';
}

// ============================================================
// THREE-TALENT CONFIGURATION DATABASE
// ============================================================
const sancaiDB = {};
const wuxingOrder = ['木','火','土','金','水'];
const wuxingSheng = { '木':'火', '火':'土', '土':'金', '金':'水', '水':'木' };
const wuxingKe = { '木':'土', '火':'金', '土':'水', '金':'木', '水':'火' };

function buildSancaiDB() {
  for (let t of wuxingOrder) {
    for (let r of wuxingOrder) {
      for (let d of wuxingOrder) {
        const key = t + r + d;
        let score = 0;
        // 天格生人格 +2
        if (wuxingSheng[t] === r) score += 2;
        // 人格生地格 +2
        if (wuxingSheng[r] === d) score += 2;
        // 天格克人格 -2
        if (wuxingKe[t] === r) score -= 2;
        // 人格克地格 -2
        if (wuxingKe[r] === d) score -= 2;
        // 天格人格相同 +1
        if (t === r) score += 1;
        // 人格地格相同 +1
        if (r === d) score += 1;
        // 天格生地格间接 +1
        if (wuxingSheng[t] === d) score += 1;
        // 天格克地格间接 -1
        if (wuxingKe[t] === d) score -= 1;

        let judgment;
        if (score >= 3) judgment = '吉';
        else if (score >= 0) judgment = '半吉';
        else judgment = '凶';

        sancaiDB[key] = {t, r, d, score, judgment};
      }
    }
  }
}
buildSancaiDB();

function getStroke(char) {
  if (strokeDB[char] !== undefined) return strokeDB[char];
  return null;
}

function calculateName(name) {
  const chars = [...name];
  if (chars.length < 2 || chars.length > 4) return null;

  // Check unknown characters
  const unknown = [];
  const strokes = chars.map((c, i) => {
    const s = getStroke(c);
    if (s === null) unknown.push({char: c, index: i});
    return s;
  });

  if (unknown.length > 0) {
    pendingUnknown = unknown;
    tempName = name;
    return { needManual: true, unknown };
  }

  return doCalculate(name, chars, strokes);
}

function doCalculate(name, chars, strokes) {
  const surnameStroke = strokes[0]; // 姓氏实际笔画
  const surnamePlus1 = surnameStroke + 1; // 姓氏+1
  const givenStrokes = strokes.slice(1);

  // 天格 = 姓氏笔画+1
  const tian = surnamePlus1;
  // 人格 = 姓氏实际笔画 + 名字第一字笔画
  const ren = surnameStroke + (givenStrokes[0] || 0);
  // 地格 = 名字各字笔画之和（单名则+1）
  const diBase = givenStrokes.reduce((a, b) => a + b, 0);
  const di = givenStrokes.length === 1 ? diBase + 1 : diBase;
  // 总格 = 全部姓名笔画之和（姓氏不加1）
  const zong = strokes.reduce((a, b) => a + b, 0);
  // 外格 = 总格 - 人格 + 1
  const wai = zong - ren + 1;

  const grids = {
    tian: { num: tian, wuxing: getWuxing(tian), luck: luckDB[tian] || luckDB[1] },
    ren: { num: ren, wuxing: getWuxing(ren), luck: luckDB[ren] || luckDB[1] },
    di: { num: di, wuxing: getWuxing(di), luck: luckDB[di] || luckDB[1] },
    wai: { num: wai, wuxing: getWuxing(wai), luck: luckDB[wai] || luckDB[1] },
    zong: { num: zong, wuxing: getWuxing(zong), luck: luckDB[zong] || luckDB[1] }
  };

  // Three-talent
  const sancaiKey = grids.tian.wuxing + grids.ren.wuxing + grids.di.wuxing;
  const sancai = sancaiDB[sancaiKey] || { judgment: '半吉' };

  // Scoring
  const luckScore = { daji: 95, ji: 80, banji: 55, xiong: 30, daxiong: 10 };
  const weights = { ren: 0.40, zong: 0.25, di: 0.15, tian: 0.10, wai: 0.10 };
  let totalScore = 0;
  for (let [k, w] of Object.entries(weights)) {
    totalScore += luckScore[grids[k].luck.level] * w;
  }
  totalScore = Math.round(totalScore);

  // Life trajectory
  const trajectory = generateTrajectory(grids, sancai, totalScore);

  // Recommendations
  const recommendations = generateRecommendations(grids, sancai);

  return {
    name, chars, strokes,
    grids, sancai, sancaiKey,
    totalScore, trajectory, recommendations
  };
}

function calculate() {
  try {
    const input = document.getElementById('nameInput').value.trim();
    if (!input) {
      showToast('请输入姓名');
      return;
    }
    if (!/^[\u4e00-\u9fa5]{2,4}$/.test(input)) {
      showToast('请输入2-4个中文汉字');
      return;
    }

    const result = calculateName(input);
    if (!result) {
      showToast('姓名格式不正确');
      return;
    }

    if (result.needManual) {
      tempName = input;
      showStrokeModal(result.unknown[0]);
      return;
    }

    showResult(result);
  } catch (e) {
    console.error('计算错误:', e);
    showToast('计算出错，请检查输入后重试');
  }
}

function showStrokeModal(unknown) {
  document.getElementById('unknownChar').textContent = unknown.char;
  document.getElementById('manualStroke').value = 1;
  document.getElementById('strokeModal').classList.add('active');
}

function confirmStroke() {
  const val = parseInt(document.getElementById('manualStroke').value);
  if (!val || val < 1 || val > 64) {
    showToast('请输入合理的笔画数（1-64）');
    return;
  }

  const unknown = pendingUnknown.shift();
  strokeDB[unknown.char] = val;

  if (pendingUnknown.length > 0) {
    document.getElementById('unknownChar').textContent = pendingUnknown[0].char;
    document.getElementById('manualStroke').value = 1;
  } else {
    document.getElementById('strokeModal').classList.remove('active');
    // Recalculate with updated strokes
    const result = calculateName(tempName);
    if (result && !result.needManual) {
      showResult(result);
    }
  }
}

function drawRadar(result) {
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 280;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const cx = size / 2, cy = size / 2, r = 100;
  const grids = ['tian', 'ren', 'di', 'wai', 'zong'];
  const labels = ['天格', '人格', '地格', '外格', '总格'];
  const colors = ['#6B5B9E', '#C23B2A', '#2D5A3D', '#D4842A', '#1A6B8A'];
  const luckScore = { daji: 5, ji: 4, banji: 3, xiong: 2, daxiong: 1 };

  ctx.clearRect(0, 0, size, size);

  // Background pentagons
  for (let level = 5; level >= 1; level--) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = Math.PI * 2 * i / 5 - Math.PI / 2;
      const lr = r * level / 5;
      const x = cx + lr * Math.cos(angle);
      const y = cy + lr * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = level === 5 ? 'rgba(201,169,110,0.08)' : 'rgba(201,169,110,0.03)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(201,169,110,0.2)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Axis lines
  for (let i = 0; i < 5; i++) {
    const angle = Math.PI * 2 * i / 5 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.strokeStyle = 'rgba(201,169,110,0.25)';
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }

  // Data polygon
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const angle = Math.PI * 2 * i / 5 - Math.PI / 2;
    const val = luckScore[result.grids[grids[i]].luck.level];
    const lr = r * val / 5;
    const x = cx + lr * Math.cos(angle);
    const y = cy + lr * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(201,169,110,0.2)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(201,169,110,0.8)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Data points
  for (let i = 0; i < 5; i++) {
    const angle = Math.PI * 2 * i / 5 - Math.PI / 2;
    const val = luckScore[result.grids[grids[i]].luck.level];
    const lr = r * val / 5;
    const x = cx + lr * Math.cos(angle);
    const y = cy + lr * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Labels
  ctx.fillStyle = '#2C2416';
  ctx.font = 'bold 12px "SongTi","STSong","SimSun",serif';
  ctx.textAlign = 'center';
  for (let i = 0; i < 5; i++) {
    const angle = Math.PI * 2 * i / 5 - Math.PI / 2;
    const lr = r + 22;
    const x = cx + lr * Math.cos(angle);
    const y = cy + lr * Math.sin(angle);
    ctx.fillText(labels[i], x, y + 4);
    // Number
    ctx.fillStyle = colors[i];
    ctx.font = 'bold 10px "SongTi","STSong","SimSun",serif';
    ctx.fillText(result.grids[grids[i]].num, x, y + 18);
    ctx.fillStyle = '#2C2416';
    ctx.font = 'bold 12px "SongTi","STSong","SimSun",serif';
  }
}

  else if (t === r) relations.push({ type: '天格人格同五行', detail: `均为${t}，相辅相成，运势平稳。`, good: true });

  if (wuxingSheng[r] === d) relations.push({ type: '人格生地格', detail: `${r}生${d}，主运滋养基础，家庭和睦，根基稳固。`, good: true });
  else if (wuxingSheng[d] === r) relations.push({ type: '地格生人格', detail: `${d}生${r}，基础运滋养主运，家庭助力事业。`, good: true });
  else if (wuxingKe[r] === d) relations.push({ type: '人格克地格', detail: `${r}克${d}，主运压制基础，家庭关系需注意调和。`, good: false });

  container.innerHTML = `
    <div class="sancai-visual">
      <div class="sancai-block tian-block">

      <div class="sancai-arrow">→</div>

        <div class="sancai-label">人格</div>

        <div style="font-size:0.7rem;color:var(--text-light);">${g.ren.num}画</div>
      </div>
      <div class="sancai-arrow">→</div>
      <div class="sancai-block di-block">
        <div class="sancai-label">地格</div>
        <div class="sancai-wuxing" style="color:#2D5A3D;">${g.di.wuxing}</div>
        <div style="font-size:0.7rem;color:var(--text-light);">${g.di.num}画</div>

      <div class="sancai-combo">三才配置：${g.tian.wuxing}${g.ren.wuxing}${g.di.wuxing}</div>

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');

// ============================================================
// HISTORY & FAVORITES
// ============================================================
function saveHistory(result) {
  const entry = {
    name: result.name,
    score: result.totalScore,
    sancai: result.sancaiKey,
    date: new Date().toISOString(),
    summary: `五格:${result.grids.ren.num}画 ${result.grids.ren.luck.name} | 三才:${result.sancai.judgment}`
  };

  // Remove duplicate
  history = history.filter(h => h.name !== result.name);
  history.unshift(entry);
  if (history.length > 50) history = history.slice(0, 50);
  localStorage.setItem('nm_history', JSON.stringify(history));
}

function openHistory() {
  const container = document.getElementById('historyList');
  if (history.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📭</div>
        <p>暂无历史记录</p>
        <p style="font-size:0.8rem;">开始测算姓名后将自动保存</p>
      </div>`;
  } else {
    container.innerHTML = history.map((h, i) => `
      <div class="history-item" onclick="loadHistory(${i})">
        <div>
          <div class="hist-name">${h.name}</div>
          <div class="hist-date">${new Date(h.date).toLocaleDateString('zh-CN')}</div>
          <div style="font-size:0.7rem;color:var(--text-light);">${h.summary}</div>
        </div>
        <div class="hist-score">${h.score}分</div>
        <button class="hist-delete" onclick="event.stopPropagation();deleteHistory(${i})">✕</button>
      </div>
    `).join('');
  }
  document.getElementById('historyModal').classList.add('active');
}

function closeHistory(e) {
  if (e.target === document.getElementById('historyModal')) {
    document.getElementById('historyModal').classList.remove('active');
  }
}

function loadHistory(index) {
  const h = history[index];
  document.getElementById('historyModal').classList.remove('active');
  document.getElementById('nameInput').value = h.name;
  calculate();
}

function deleteHistory(index) {
  history.splice(index, 1);
  localStorage.setItem('nm_history', JSON.stringify(history));
  openHistory();
}

function toggleFavorite() {
  if (!currentResult) return;
  const name = currentResult.name;
  if (favorites[name]) {
    delete favorites[name];
    document.getElementById('btnFav').textContent = '☆ 收藏报告';
  } else {
    favorites[name] = {
      name: currentResult.name,
      score: currentResult.totalScore,
      date: new Date().toISOString()
    };
    document.getElementById('btnFav').textContent = '★ 已收藏';
  }
  localStorage.setItem('nm_favorites', JSON.stringify(favorites));
}

function updateFavButton() {
  if (!currentResult) return;
  const btn = document.getElementById('btnFav');
  btn.textContent = favorites[currentResult.name] ? '★ 已收藏' : '☆ 收藏报告';
}

function shareResult() {
  if (!currentResult) return;
  const text = `【姓名命理·五格解码】\n姓名：${currentResult.name}\n综合评分：${currentResult.totalScore}分\n三才配置：${currentResult.sancaiKey}（${currentResult.sancai.judgment}）\n主运人格：${currentResult.grids.ren.num}画 ${currentResult.grids.ren.luck.name}`;

  if (navigator.share) {
    navigator.share({ title: '姓名命理·五格解码', text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => {
      showToast('已复制到剪贴板');
    }).catch(() => {
      showToast('分享失败，请手动复制');
    });
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  let toast = document.getElementById('toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast';
    toast.style.cssText = `
      position:fixed;top:20px;left:50%;transform:translateX(-50%);
      background:rgba(44,36,22,0.9);color:#fff;padding:10px 24px;
      border-radius:24px;font-size:0.85rem;z-index:300;
      transition:all 0.3s ease;opacity:0;pointer-events:none;
      font-family:inherit;letter-spacing:0.05em;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  toast.style.top = '30px';
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.top = '20px';
  }, 2000);
}

function showDailyTip() {

  if (lastShown === today) return;

  const lastQuery = history.length > 0 ? history[0] : null;
  const tips = [
    '今日宜静心思考，不宜做重大决定。保持平和心态，顺势而为。',
    '贵人运旺盛，多与朋友交流，或有意外收获。东方为吉利方位。',
    '今日财运平平，宜守不宜攻，避免冲动消费。',
    '桃花运降临，单身者可多参加社交活动，已有伴侣者感情升温。',
    '事业运上升，适合推进搁置的项目，展现你的才华。',
    '健康运需注意，适当运动，避免熬夜，保持良好作息。',
    '学习运极佳，适合阅读和进修，知识将成为你的力量。',
    '家庭运和谐，适合与家人共度时光，增进感情。',
    '创意灵感涌现，适合艺术创作和头脑风暴。',
    '今日宜低调行事，避免与人争执，忍一时风平浪静。'
  ];

  let tip;
  if (lastQuery) {
    tip = `基于您最近的姓名「${lastQuery.name}」，${tips[Math.floor(Math.random() * tips.length)]}`;
  } else {
    tip = tips[Math.floor(Math.random() * tips.length)];
  }

  document.getElementById('tipContent').textContent = tip;
  document.getElementById('dailyTip').classList.add('visible');
  localStorage.setItem('nm_daily_tip_date', today);
}

function closeDailyTip() {
  document.getElementById('dailyTip').classList.remove('visible');

// ============================================================
// PARTICLE ANIMATION
// ============================================================
function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 8 + 's';
    p.style.animationDuration = (6 + Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// ============================================================
document.getElementById('nameInput').addEventListener('input', function(e) {
  const val = e.target.value.replace(/[^\u4e00-\u9fa5]/g, '');

document.getElementById('strokeModal').addEventListener('click', function(e) {
  if (e.target === this) {
    this.classList.remove('active');
    pendingUnknown = [];

});

document.getElementById('manualStroke').addEventListener('keydown', function(e) {

});

// ============================================================
