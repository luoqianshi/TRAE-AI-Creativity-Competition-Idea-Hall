<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慈善捐款追踪系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>慈善捐款追踪系统</h1>
      <p class="subtitle">基于区块链的透明捐款追踪平台</p>
      <div id="wallet-info">
        <button id="connect-btn" onclick="connectWallet()">连接 MetaMask</button>
        <span id="wallet-address" class="hidden"></span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 统计信息 -->
    <section id="stats" class="stats-bar">
      <div class="stat-item">
        <span class="stat-value" id="total-projects">0</span>
        <span class="stat-label">慈善项目</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="total-donations">0</span>
        <span class="stat-label">捐款笔数</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="total-raised">0</span>
        <span class="stat-label">已募总额 (ETH)</span>
      </div>
    </section>

    <!-- 创建项目 -->
    <section class="card">
      <h2>创建慈善项目</h2>
      <form id="create-form" onsubmit="createProject(event)">
        <div class="form-group">
          <label for="project-name">项目名称</label>
          <input type="text" id="project-name" placeholder="例：山区希望小学建设" required>
        </div>
        <div class="form-group">
          <label for="project-desc">项目描述</label>
          <textarea id="project-desc" rows="3" placeholder="详细描述项目目标和资金用途..." required></textarea>
        </div>
        <div class="form-group">
          <label for="project-goal">目标金额 (ETH)</label>
          <input type="number" id="project-goal" step="0.01" min="0.01" placeholder="10" required>
        </div>
        <button type="submit" class="btn btn-primary">创建项目</button>
      </form>
    </section>

    <!-- 项目列表 -->
    <section>
      <h2>慈善项目列表</h2>
      <div id="project-list" class="project-grid">
        <p class="loading">加载中...</p>
      </div>
    </section>

    <!-- 项目详情弹窗 -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title"></h2>
        <p id="modal-desc" class="modal-desc"></p>

        <div class="modal-stats">
          <div>
            <span class="label">目标金额</span>
            <span id="modal-goal" class="value"></span>
          </div>
          <div>
            <span class="label">已募金额</span>
            <span id="modal-raised" class="value"></span>
          </div>
          <div>
            <span class="label">已提取</span>
            <span id="modal-withdrawn" class="value"></span>
          </div>
          <div>
            <span class="label">状态</span>
            <span id="modal-status" class="value"></span>
          </div>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" id="modal-progress"></div>
          <span class="progress-text" id="modal-progress-text"></span>
        </div>

        <!-- 捐款区域 -->
        <div class="modal-section">
          <h3>捐款</h3>
          <div class="donate-form">
            <input type="number" id="donate-amount" step="0.01" min="0.01" placeholder="捐款金额 (ETH)">
            <input type="text" id="donate-message" placeholder="留言（选填）">
            <button class="btn btn-primary" onclick="donate()">捐款</button>
          </div>
        </div>

        <!-- 提取资金区域 -->
        <div class="modal-section" id="withdraw-section" style="display:none;">
          <h3>提取资金</h3>
          <div class="donate-form">
            <input type="number" id="withdraw-amount" step="0.01" min="0.01" placeholder="提取金额 (ETH)">
            <input type="text" id="withdraw-purpose" placeholder="资金用途说明">
            <button class="btn btn-warning" onclick="withdrawFund()">提取</button>
          </div>
        </div>

        <!-- 捐款记录 -->
        <div class="modal-section">
          <h3>捐款记录</h3>
          <div id="donation-list" class="record-list">
            <p class="loading">加载中...</p>
          </div>
        </div>

        <!-- 提取记录 -->
        <div class="modal-section">
          <h3>资金使用记录</h3>
          <div id="withdrawal-list" class="record-list">
            <p class="loading">加载中...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>区块链课程作业 - 慈善捐款追踪系统 | 基于以太坊智能合约</p>
    </div>
  </footer>

  <script src="ethers.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
