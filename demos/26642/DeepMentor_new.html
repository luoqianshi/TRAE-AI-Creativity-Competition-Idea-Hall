<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>DeepMentor — 苏格拉底式AI教学平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/noto-sans-sc@latest/chinese-simplified-400-normal.css">
<style>
* { font-family: 'Noto Sans SC', system-ui, sans-serif; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }

@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes slideInLeft { from { opacity:0; transform:translateX(-30px); } to { opacity:1; transform:translateX(0); } }
@keyframes slideInRight { from { opacity:0; transform:translateX(30px); } to { opacity:1; transform:translateX(0); } }
@keyframes pulse-glow { 0%,100% { box-shadow:0 0 5px rgba(139,92,246,0.3); } 50% { box-shadow:0 0 20px rgba(139,92,246,0.6); } }
@keyframes typing { 0%,60%,100% { opacity:0.3; } 30% { opacity:1; } }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
@keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
@keyframes popIn { 0% { transform:scale(0.5); opacity:0; } 70% { transform:scale(1.05); } 100% { transform:scale(1); opacity:1; } }
@keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes gradientMove { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }
@keyframes ripple { to { transform:scale(4); opacity:0; } }
@keyframes bounceIn { 0% { transform:scale(0); } 50% { transform:scale(1.15); } 100% { transform:scale(1); } }

.animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
.animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
.animate-slide-left { animation: slideInLeft 0.4s ease-out forwards; }
.animate-slide-right { animation: slideInRight 0.4s ease-out forwards; }
.animate-float { animation: float 3s ease-in-out infinite; }
.animate-pop-in { animation: popIn 0.4s cubic-bezier(0.68,-0.55,0.265,1.55) forwards; }
.animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1) forwards; }
.animate-bounce-in { animation: bounceIn 0.5s cubic-bezier(0.68,-0.55,0.265,1.55) forwards; }

.typing-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#8b5cf6; margin:0 2px; }
.typing-dot:nth-child(1) { animation:typing 1.4s infinite 0s; }
.typing-dot:nth-child(2) { animation:typing 1.4s infinite 0.2s; }
.typing-dot:nth-child(3) { animation:typing 1.4s infinite 0.4s; }

.glass { background:rgba(255,255,255,0.7); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.3); }
.glass-dark { background:rgba(15,23,42,0.8); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); }

.gradient-bg { background: linear-gradient(-45deg, #667eea, #764ba2, #6B73FF, #000DFF); background-size:400% 400%; animation:gradientMove 15s ease infinite; }
.gradient-text { background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

.shimmer { background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent); background-size:200% 100%; animation:shimmer 2s infinite; }

.card-hover { transition:all 0.3s cubic-bezier(0.4,0,0.2,1); }
.card-hover:hover { transform:translateY(-4px); box-shadow:0 20px 40px rgba(0,0,0,0.1); }

.btn-ripple { position:relative; overflow:hidden; }
.btn-ripple::after { content:''; position:absolute; width:100%; height:100%; top:0; left:0; background:radial-gradient(circle,rgba(255,255,255,0.3) 10%,transparent 10.01%); background-repeat:no-repeat; background-position:50%; transform:scale(10); opacity:0; transition:transform 0.5s,opacity 1s; }
.btn-ripple:active::after { transform:scale(0); opacity:0.3; transition:0s; }

.page-transition { animation: fadeInUp 0.4s cubic-bezier(0.4,0,0.2,1); }

.energy-bar { background:linear-gradient(90deg,#10b981,#34d399,#6ee7b7); transition:width 0.8s cubic-bezier(0.4,0,0.2,1); }

.partner-color-march { border-left:4px solid #f472b6; }
.partner-color-keqing { border-left:4px solid #a78bfa; }
.partner-color-ganyu { border-left:4px solid #67e8f9; }
.partner-color-venti { border-left:4px solid #4ade80; }
.partner-color-wukong { border-left:4px solid #fb923c; }

.msg-bubble { max-width:75%; border-radius:18px; padding:12px 16px; position:relative; }
.msg-bubble::after { content:''; position:absolute; bottom:0; width:12px; height:12px; }
.msg-ai { background:linear-gradient(135deg,#f8fafc,#f1f5f9); border-bottom-left-radius:4px; }
.msg-user { background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:white; border-bottom-right-radius:4px; }

.sidebar-item { transition:all 0.2s ease; border-radius:12px; }
.sidebar-item:hover { background:rgba(139,92,246,0.1); transform:translateX(4px); }
.sidebar-item.active { background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:white; box-shadow:0 4px 15px rgba(139,92,246,0.3); }

.flash-card { perspective:1000px; }
.flash-card-inner { transition:transform 0.6s; transform-style:preserve-3d; }
.flash-card.flipped .flash-card-inner { transform:rotateY(180deg); }
.flash-card-front, .flash-card-back { backface-visibility:hidden; position:absolute; inset:0; border-radius:16px; padding:24px; display:flex; align-items:center; justify-content:center; }
.flash-card-back { transform:rotateY(180deg); }

.progress-ring { transform:rotate(-90deg); }

.toast { animation: slideUp 0.3s ease-out, fadeIn 0.3s ease-out; }

.input-focus { transition: all 0.3s ease; }
.input-focus:focus { box-shadow: 0 0 0 3px rgba(139,92,246,0.2); border-color: #8b5cf6; }

.tab-indicator { transition: all 0.3s cubic-bezier(0.4,0,0.2,1); }

.skeleton { background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }

.heat-cell { transition: all 0.3s ease; border-radius:4px; padding:4px 8px; }

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:rgba(139,92,246,0.3); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:rgba(139,92,246,0.5); }

body { overflow-x:hidden; }
</style>
</head>
<body class="bg-slate-50 min-h-screen">

<!-- ========== LOGIN PAGE ========== -->
<div id="loginPage" class="min-h-screen flex items-center justify-center gradient-bg relative overflow-hidden">
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-white/10 rounded-full blur-3xl animate-float"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-white/10 rounded-full blur-3xl animate-float" style="animation-delay:1.5s"></div>
    <div class="absolute top-1/3 left-1/4 text-white/10 text-8xl animate-float" style="animation-delay:0.5s">∫</div>
    <div class="absolute top-1/2 right-1/4 text-white/10 text-6xl animate-float" style="animation-delay:1s">∑</div>
    <div class="absolute bottom-1/3 left-1/3 text-white/10 text-7xl animate-float" style="animation-delay:2s">π</div>
  </div>
  
  <div class="relative z-10 w-full max-w-md px-6">
    <div class="glass rounded-3xl p-8 shadow-2xl animate-fade-in-up">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-violet-500 to-purple-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg">
          <i class="fas fa-graduation-cap text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">DeepMentor</h1>
        <p class="text-sm text-slate-500 mt-1">苏格拉底式AI教学平台</p>
      </div>
      
      <div id="loginStep1">
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 mb-2">邮箱地址</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input id="loginEmail" type="email" placeholder="请输入你的邮箱" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 input-focus outline-none text-sm">
          </div>
        </div>
        <button onclick="sendVerifyCode()" class="btn-ripple w-full py-3 bg-gradient-to-r from-violet-500 to-purple-600 text-white rounded-xl font-medium hover:shadow-lg hover:shadow-violet-300/50 transition-all duration-300 active:scale-[0.98]">
          获取验证码
        </button>
        <p class="text-xs text-slate-400 text-center mt-4">未注册的邮箱将自动创建新账户</p>
      </div>
      
      <div id="loginStep2" class="hidden">
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 mb-2">验证码</label>
          <div class="flex gap-2 justify-center" id="codeInputs">
            <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold rounded-xl border-2 border-slate-200 input-focus outline-none" oninput="handleCodeInput(this,0)">
            <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold rounded-xl border-2 border-slate-200 input-focus outline-none" oninput="handleCodeInput(this,1)">
            <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold rounded-xl border-2 border-slate-200 input-focus outline-none" oninput="handleCodeInput(this,2)">
            <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold rounded-xl border-2 border-slate-200 input-focus outline-none" oninput="handleCodeInput(this,3)">
            <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold rounded-xl border-2 border-slate-200 input-focus outline-none" oninput="handleCodeInput(this,4)">
            <input type="text" maxlength="1" class="w-12 h-14 text-center text-xl font-bold rounded-xl border-2 border-slate-200 input-focus outline-none" oninput="handleCodeInput(this,5)">
          </div>
          <p class="text-xs text-slate-400 text-center mt-3">验证码已发送至你的邮箱</p>
        </div>
        <button onclick="verifyCode()" class="btn-ripple w-full py-3 bg-gradient-to-r from-violet-500 to-purple-600 text-white rounded-xl font-medium hover:shadow-lg hover:shadow-violet-300/50 transition-all active:scale-[0.98]">
          验证并登录
        </button>
        <button onclick="backToStep1()" class="w-full py-2 mt-2 text-sm text-slate-500 hover:text-violet-600 transition">
          ← 返回修改邮箱
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ========== ONBOARDING ========== -->
<div id="onboardingPage" class="min-h-screen bg-gradient-to-br from-violet-50 via-white to-purple-50 hidden">
  <div class="max-w-2xl mx-auto px-6 py-12">
    <!-- Progress -->
    <div class="flex items-center justify-center mb-10">
      <div class="flex items-center gap-3" id="onboardProgress"></div>
    </div>
    
    <!-- Step content -->
    <div id="onboardContent" class="animate-fade-in-up"></div>
  </div>
</div>

<!-- ========== MAIN APP ========== -->
<div id="mainApp" class="hidden min-h-screen bg-slate-50">

          <div class="w-10 h-10 bg-gradient-to-br from-violet-500 to-purple-600 rounded-xl flex items-center justify-center">
            <i class="fas fa-graduation-cap text-white text-sm"></i>
          </div>
          <div>
            <h2 class="font-bold text-slate-800 text-sm">DeepMentor</h2>

          </div>
        </div>
      </div>
      
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        <div onclick="navigateTo('classroom')" class="sidebar-item active flex items-center gap-3 px-4 py-3 cursor-pointer" data-nav="classroom">
          <i class="fas fa-chalkboard-teacher w-5 text-center"></i>

          <i class="fas fa-layer-group w-5 text-center"></i>
          <span class="text-sm font-medium">闪卡</span>
        </div>
        <div onclick="navigateTo('progress')" class="sidebar-item flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600" data-nav="progress">
          <i class="fas fa-chart-line w-5 text-center"></i>
          <span class="text-sm font-medium">学习进度</span>
        </div>
        <div onclick="navigateTo('knowledge')" class="sidebar-item flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600" data-nav="knowledge">
          <i class="fas fa-project-diagram w-5 text-center"></i>
          <span class="text-sm font-medium">知识图谱</span>
        </div>
        <div onclick="navigateTo('square')" class="sidebar-item flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600" data-nav="square">
          <i class="fas fa-th-large w-5 text-center"></i>
          <span class="text-sm font-medium">广场</span>
        </div>
        <div onclick="navigateTo('textbooks')" class="sidebar-item flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600" data-nav="textbooks">
          <i class="fas fa-folder-open w-5 text-center"></i>
          <span class="text-sm font-medium">教材管理</span>
        </div>
        <div onclick="navigateTo('world')" class="sidebar-item flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600" data-nav="world">
          <i class="fas fa-globe-asia w-5 text-center"></i>
          <span class="text-sm font-medium">世界</span>
        </div>
        <div onclick="navigateTo('nuwa')" class="sidebar-item flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600" data-nav="nuwa">

          <div class="flex-1 min-w-0">

          </div>
          <i class="fas fa-chevron-right text-xs text-slate-300"></i>
        </div>
      </div>
    </aside>
    
    <!-- Main Content Area -->
    <main class="flex-1 overflow-hidden flex flex-col">
      <!-- Top bar -->
      <header class="h-14 bg-white border-b border-slate-100 flex items-center justify-between px-6 shrink-0">

          <div class="flex items-center gap-2 text-sm" id="breadcrumb">
            <i class="fas fa-globe-asia text-violet-500"></i>

            <i class="fas fa-chevron-right text-xs text-slate-300"></i>

      <!-- Page Content -->

</div>

function showToast(msg, type='success') {
  const c = $('toastContainer');
  const colors = { success:'bg-emerald-500', error:'bg-red-500', info:'bg-violet-500', warning:'bg-amber-500' };
  const icons = { success:'fa-check-circle', error:'fa-times-circle', info:'fa-info-circle', warning:'fa-exclamation-triangle' };
  const t = document.createElement('div');
  t.className = `toast flex items-center gap-3 ${colors[type]} text-white px-5 py-3 rounded-xl shadow-lg text-sm font-medium`;
  t.innerHTML = `<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateY(-10px)'; setTimeout(()=>t.remove(),300); }, 3000);
}

}

  return state.messages.map((m,i)=>{
    if(m.role==='assistant') {

      return `<div class="flex gap-3 animate-fade-in" style="animation-delay:${i*0.1}s">

            <div class="text-sm text-slate-800 leading-relaxed whitespace-pre-line font-medium">${m.text}</div>
          </div>
        </div>
      </div>`;
    } else {
      return `<div class="flex justify-end animate-fade-in" style="animation-delay:${i*0.1}s">
        <div class="msg-bubble msg-user">
          <div class="text-sm leading-relaxed">${m.text}</div>
        </div>
      </div>`;
    }
  }).join('');
}

function scrollChat() {
  setTimeout(()=>{
    const el = $('chatMessages');
    if(el) el.scrollTop = el.scrollHeight;
  }, 50);
}

function handleChatKey(e) {
  if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function sendMessage() {
  const input = $('chatInput');
  const text = input?.value?.trim();
  if(!text) return;
  
  state.messages.push({ role:'user', text });
  input.value = '';
  renderChatOnly();
  
  // AI thinking
  setTimeout(()=>{
    showTypingIndicator();
    setTimeout(()=>{
      removeTypingIndicator();
      generateAIResponse(text);
    }, 1500 + Math.random()*1000);
  }, 300);
}

function renderChatOnly() {
  const el = $('chatMessages');
  if(el) { el.innerHTML = renderMessages(); scrollChat(); }
}

function showTypingIndicator() {
  const el = $('chatMessages');
  const cp = getPartner(state.currentPartner);
  if(!el) return;
  const div = document.createElement('div');
  div.id = 'typingIndicator';
  div.className = 'flex gap-3 animate-fade-in';
  div.innerHTML = `<div class="w-10 h-10 rounded-full overflow-hidden shrink-0" style="background:${cp.color}20">
    ${cp.img?`<img src="${cp.img}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center text-sm font-bold" style="color:${cp.color}">${cp.name[0]}</div>`}
  </div>
  <div class="msg-bubble msg-ai flex items-center gap-1">
    <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
  </div>`;
  el.appendChild(div);
  scrollChat();
}

function removeTypingIndicator() {
  const el = $('typingIndicator');
  if(el) el.remove();
}

function generateAIResponse(userText) {
  const cp = getPartner(state.currentPartner);
  const responses = [
    { action:'*若有所思地点了点头*', text:`有意思！你说的"${userText.slice(0,15)}..."让我想到一个问题——\n\n如果我们把这个概念放到一个具体的例子里，比如f(x) = x²，当x趋近于2的时候，你觉得f(x)会趋近于什么值呢？` },
    { action:'*眼睛一亮*', text:`很好！你已经抓住了关键点！\n\n那我再追问一个问题：如果我们说lim f(x) = L，这里的L一定存在吗？什么情况下极限可能不存在呢？` },
    { action:'*歪了歪头*', text:`嗯，这个角度很有意思！\n\n不过我想让你再想想——如果从左边接近和从右边接近得到不同的结果，我们还说极限存在吗？这和我们刚才说的有什么关系？` },
    { action:'*在纸上画了一个图*', text:`看，如果我把你说的用图形来表示...\n\n你注意到曲线在某个点附近的行为有什么特殊之处吗？这和我们讨论的概念有什么关系？` },
    { action:'*轻轻敲了敲桌面*', text:`不错，思路是对的。但我想让你更严谨一点——\n\n你能用ε-δ语言，把刚才的想法重新表述一遍吗？试着把"任意"和"存在"这两个量词放进去。` }
  ];
  const r = responses[Math.floor(Math.random()*responses.length)];
  state.messages.push({ role:'assistant', partner:state.currentPartner, action:r.action, text:r.text });
  renderChatOnly();
  state.energy = Math.max(0, state.energy - 2);
}

function aiAnswer() {
  if(state.aiAnswersLeft<=0) { showToast('AI代答次数已用完','warning'); return; }

}

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <div class="bg-white rounded-2xl overflow-hidden card-hover shadow-sm border ${w.active?'border-violet-300 ring-2 ring-violet-200':'border-slate-100'} animate-fade-in-up" style="animation-delay:${i*0.1}s">
          <div class="h-32 bg-gradient-to-br ${w.color} flex items-center justify-center text-6xl relative">

          </div>
          <div class="p-5">
            <h3 class="font-bold text-lg mb-1">${w.name}</h3>
            <div class="flex items-center gap-3 text-xs text-slate-400 mb-4">
              <span><i class="fas fa-globe mr-1"></i>${w.lang}</span>
              <span><i class="fas fa-book mr-1"></i>${w.courses}门课程</span>

            </div>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
  $('pageContent').innerHTML = html;
}

// ========== Session Timer ==========
let sessionSeconds = 32*60 + 15;
setInterval(()=>{
  if(state.currentView==='classroom' && state.messages.length>0) {
    sessionSeconds++;
    const t = $('sessionTimer');
    if(t) t.textContent = formatTime(sessionSeconds);
  }
}, 1000);
