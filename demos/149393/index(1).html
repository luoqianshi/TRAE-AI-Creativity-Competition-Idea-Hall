article" data-v-92956f73></span><span data-v-92956f73>数据流动</span></div><div class="nn-legend-item" data-v-92956f73><span class="nn-legend-node" data-v-92956f73></span><span data-v-92956f73>神经元</span></div><div class="nn-legend-item" data-v-92956f73><span class="nn-legend-zone" data-v-92956f73></span><span data-v-92956f73>层级区域</span></div></div><div class="nn-canvas-title" data-v-92956f73>3D神经网络结构</div>',3)])],36),X[20]||(X[20]=wn('<div class="nn-knowledge" data-v-92956f73><div class="nn-knowledge-header" data-v-92956f73><svg width="16" height="16" viewBox="0 0 16 16" fill="none" data-v-92956f73><circle cx="8" cy="8" r="7" stroke="#4a90d9" stroke-width="1.2" data-v-92956f73></circle><path d="M7.5 7.5H8V11.5" stroke="#4a90d9" stroke-width="1.2" stroke-linecap="round" data-v-92956f73></path><circle cx="8" cy="5" r="0.65" fill="#4a90d9" data-v-92956f73></circle></svg><span data-v-92956f73>知识讲解</span></div><div class="nn-knowledge-body" data-v-92956f73><div class="nn-knowledge-card" data-v-92956f73><div class="nn-kc-icon" data-v-92956f73><svg width="22" height="22" viewBox="0 0 22 22" fill="none" data-v-92956f73><circle cx="5" cy="11" r="2" stroke="#4a90d9" stroke-width="1.3" data-v-92956f73></circle><circle cx="11" cy="6" r="2" stroke="#52c41a" stroke-width="1.3" data-v-92956f73></circle><circle cx="11" cy="16" r="2" stroke="#52c41a" stroke-width="1.3" data-v-92956f73></circle><circle cx="17" cy="11" r="2" stroke="#ff2d55" stroke-width="1.3" data-v-92956f73></circle><path d="M7 11H9M13 7V9M13 13V15M10 11.5L15.5 11" stroke="#86868b" stroke-width="1" data-v-92956f73></path></svg></div><h4 class="nn-kc-title" data-v-92956f73>神经网络的真实逻辑</h4><p class="nn-kc-text" data-v-92956f73> 点击<strong data-v-92956f73>&quot;前向传播&quot;</strong>按钮，系统将执行真实的神经网络计算：<br data-v-92956f73><strong data-v-92956f73>输入层</strong>接收 4 个数值 → <strong data-v-92956f73>隐藏层</strong>计算加权和并应用 ReLU 激活函数 → <strong data-v-92956f73>输出层</strong>产出最终预测值。<br data-v-92956f73> 每条贝塞尔连线对应一个<strong data-v-92956f73>权重参数</strong>（随机初始化），激活后的节点会以更亮的辉光显示。 </p></div><div class="nn-knowledge-card" data-v-92956f73><div class="nn-kc-icon" data-v-92956f73><svg width="22" height="22" viewBox="0 0 22 22" fill="none" data-v-92956f73><path d="M4 18C4 9 9 4 11 4" stroke="#faad14" stroke-width="1.3" stroke-linecap="round" data-v-92956f73></path><path d="M11 4C13 4 18 9 18 18" stroke="#faad14" stroke-width="1.3" stroke-linecap="round" data-v-92956f73></path><circle cx="11" cy="4" r="1.5" fill="#faad14" data-v-92956f73></circle><circle cx="4" cy="18" r="1.5" fill="#4a90d9" data-v-92956f73></circle><circle cx="18" cy="18" r="1.5" fill="#ff2d55" data-v-92956f73></circle></svg></div><h4 class="nn-kc-title" data-v-92956f73>3D空间分布 + 贝塞尔连线</h4><p class="nn-kc-text" data-v-92956f73> 每层节点均匀分布在<strong data-v-92956f73>圆环</strong>上，不同层以<strong data-v-92956f73>半透明彩色区域</strong>分隔。 层与层之间的连线使用<strong data-v-92956f73>三次贝塞尔曲线</strong>绘制，弧线代表神经元之间的加权连接。 可以拖动节点改变其在层内区域的位置，连线实时更新。 </p></div><div class="nn-knowledge-card" data-v-92956f73><div class="nn-kc-icon" data-v-92956f73><svg width="22" height="22" viewBox="0 0 22 22" fill="none" data-v-92956f73><circle cx="11" cy="11" r="6" stroke="#52c41a" stroke-width="1.3" stroke-dasharray="3 2" data-v-92956f73></circle><circle cx="11" cy="11" r="2" fill="#52c41a" opacity="0.3" data-v-92956f73></circle><path d="M11 5V7M11 15V17M5 11H7M15 11H17" stroke="#52c41a" stroke-width="1.3" stroke-linecap="round" data-v-92956f73></path></svg></div><h4 class="nn-kc-title" data-v-92956f73>节点脉冲与拖拽交互</h4><p class="nn-kc-text" data-v-92956f73> 每个神经元节点具有<strong data-v-92956f73>呼吸式脉冲动画</strong>，模拟生物神经元发放脉冲。 <strong data-v-92956f73>鼠标左键拖拽</strong>可移动节点在所属层区域内调整位置，节点不会超出该层的圆形区域边界。 前向传播后，激活值越大的节点辉光越亮。 </p></div><div class="nn-knowledge-card" data-v-92956f73><div class="nn-kc-icon" data-v-92956f73><svg width="22" height="22" viewBox="0 0 22 22" fill="none" data-v-92956f73><rect x="3" y="5" width="16" height="12" rx="1.5" stroke="#4a90d9" stroke-width="1.3" data-v-92956f73></rect><path d="M7 14L10 17             (function() {
              'use strict';
              
              if (window.TraeBadgePlugin) return;
              
              const css = `
.trae-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  font-weight: 500;
  transition: all 0.2s ease;
  cursor: pointer;
  box-sizing: border-box;
  border-radius: 6px;
  position: fixed;
  padding: 8px 8px 8px 10px;
  height: 28px;
  width: 130px;
  z-index: 9999;
}

.trae-badge:hover.trae-badge--light {
  background-color: #EDEFF2;
}

.trae-badge:hover.trae-badge--dark {
  background-color: #2A2D31;
}

.trae-badge-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.trae-badge-logo {
  flex-shrink: 0;
}

.trae-badge-share {
  flex-shrink: 0;
  color: rgba(78, 82, 87, 1);
}

.trae-badge:hover.trae-badge--light .trae-badge-share {
  color: rgba(38, 41, 44, 1);
}

.trae-badge:hover.trae-badge--dark .trae-badge-share {
  color: #D1D3DB;
}

.trae-badge-cancel {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 16px;
  height: 16px;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  z-index: 10001;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #000000;
}

.trae-badge:hover .trae-badge-cancel {
  opacity: 1 !important;
  visibility: visible !important;
}

/* 在移动端设备上始终显示取消按钮 */
@media (hover: none) and (pointer: coarse) {
  .trae-badge-cancel {
    opacity: 1 !important;
    visibility: visible !important;
  }
}

.trae-badge--light {
  background-color: rgba(255, 255, 255, 1);
  color: #ffffff;
  box-shadow: 0px 0px 0.5px 0px rgba(0, 0, 0, 0.12), 0px 1px 3px 0px rgba(0, 0, 0, 0.08), 0px 4px 8px 0px rgba(0, 0, 0, 0.12);
}

.trae-badge--dark {
  background-color: #000000;
  color: #ffffff;
  box-shadow: 0px 0px 0.5px 0px rgba(0, 0, 0, 0.12), 0px 1px 3px 0px rgba(0, 0, 0, 0.08), 0px 4px 8px 0px rgba(0, 0, 0, 0.12);
}

.trae-badge--bottom-right { bottom: 20px; right: 20px; }
.trae-badge--bottom-left { bottom: 20px; left: 20px; }
.trae-badge--top-right { top: 20px; right: 20px; }

          function getLuminance(r, g, b) {
            return 0.299 * r + 0.587 * g + 0.114 * b;
          }
          
          function parseColor(color) {
            const rgbaMatch = color.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*[\d.]+)?\)/);
            if (rgbaMatch) {
              return [parseInt(rgbaMatch[1]), parseInt(rgbaMatch[2]), parseInt(rgbaMatch[3])];
            }
            
            const hexMatch = color.match(/^#([0-9a-f]{6})$/i);
            if (hexMatch) {
              const hex = hexMatch[1];
              return [
                parseInt(hex.substr(0, 2), 16),
                parseInt(hex.substr(2, 2), 16),
                parseInt(hex.substr(4, 2), 16)
              ];
            }
            
            const hexShortMatch = color.match(/^#([0-9a-f]{3})$/i);
            if (hexShortMatch) {
              const hex = hexShortMatch[1];
              return [
                parseInt(hex[0] + hex[0], 16),
                parseInt(hex[1] + hex[1], 16),
                parseInt(hex[2] + hex[2], 16)
              ];
            }
            
            return null;
          }
          
          function detectBackgroundColor(element) {
            let targetElement;
            
            if (typeof element === 'string') {
              const found = document.querySelector(element);
              console.debug('Target element found:', found);
              if (!found) return 'rgb(255, 255, 255)';
              targetElement = found;
            } else if (element) {
              targetElement = element;
            } else {
              targetElement = document.body;
            }
            
            let currentElement = targetElement;
            
            while (currentElement && currentElement !== document.documentElement) {
              const computedStyle = window.getComputedStyle(currentElement);
              const backgroundColor = computedStyle.backgroundColor;
              
              console.debug('Checking element:', currentElement.tagName, currentElement.id, currentElement.className);
              console.debug('Background color:', backgroundColor);
              
              if (backgroundColor && backgroundColor !== 'rgba(0, 0, 0, 0)' && backgroundColor !== 'transparent') {
                console.debug('Found background color:', backgroundColor, 'on element:', currentElement);
                return backgroundColor;
              }
              
              currentElement = currentElement.parentElement;
            }
            
            const bodyStyle = window.getComputedStyle(document.body);
            const bodyBackground = bodyStyle.backgroundColor;
            console.debug('Body background:', bodyBackground);
            if (bodyBackground && bodyBackground !== 'rgba(0, 0, 0, 0)' && bodyBackground !== 'transparent') {
              return bodyBackground;
            }
            
            const htmlStyle = window.getComputedStyle(document.documentElement);
            const htmlBackground = htmlStyle.backgroundColor;
            console.debug('HTML background:', htmlBackground);
            if (htmlBackground && htmlBackground !== 'rgba(0, 0, 0, 0)' && htmlBackground !== 'transparent') {
              return htmlBackground;
            }
            
            console.debug('No background found, returning default white');
            return 'rgb(255, 255, 255)';
          }
          
          function autoSelectTheme(container) {
            const backgroundColor = detectBackgroundColor(container);
            const rgb = parseColor(backgroundColor);
            
            console.debug('TRAE Badge Plugin - Background detection:', {
              container,
              backgroundColor,
              rgb
            });
            
            if (!rgb) {
              console.debug('TRAE Badge Plugin - No RGB found, using dark theme');
              return 'dark';
            }
            
            const [r, g, b] = rgb;
            const luminance = getLuminance(r, g, b);
            const selectedTheme = luminance > 128 ? 'dark' : 'light';
            
            console.debug('TRAE Badge Plugin - Theme selection:', {
              luminance,
              selectedTheme,
              reason: luminance > 128 ? 'Light background -> Dark badge' : 'Dark background -> Light badge'
            });
            
            return selectedTheme;
          }
        
              
              // 注入样式
              const style = document.createElement('style');
              style.id = 'trae-badge-plugin-styles';
              style.textContent = css;
              document.head.appendChild(style);
              
              // 创建 Badge 函数
              function createBadge() {
                // 移除已存在的 badge
                const existingBadge = document.getElementById('trae-badge-plugin');
                if (existingBadge) {
                  existingBadge.remove();
                }
                
                // 确定主题
                let variant = 'dark';
                if (true) {
                  variant = autoSelectTheme('#app');
                }
                
                const isDarkBackground = variant === 'dark';
                const logoType = isDarkBackground ? 'light' : 'dark';
                const cancelIcon = isDarkBackground ? cancelLight : cancelDark;
                
                const badge = document.createElement('div');
                badge.id = 'trae-badge-plugin';
                badge.className = `trae-badge trae-badge--${variant} trae-badge--bottom-right`;
                badge.innerHTML = `
                  <div class="trae-badge-content">
                    <div class="trae-badge-logo">${logos[logoType]}</div>
                    <div class="trae-badge-share">${shareIcon}</div>
                  </div>
                  <div class="trae-badge-cancel">${cancelIcon}</div>
                `;
                
                // 添加点击事件
                
                badge.style.cursor = 'pointer';
                badge.addEventListener('click', (e) => {
                  if (e.target.closest('.trae-badge-cancel')) return;
                  window.open('https://www.trae.ai/solo?showJoin=1', '_blank');
                });
                
                
                // 添加取消按钮事件
                const cancelButton = badge.querySelector('.trae-badge-cancel');
                if (cancelButton) {
                  cancelButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    badge.remove();
                  });
                }
                
                document.body.appendChild(badge);
                return badge;
              }
              
              // 初始创建 badge
              // 等待 React 组件渲染完成后再创建 badge
              function initBadge() {
                // 使用 requestAnimationFrame 等待渲染完成
                requestAnimationFrame(() => {
                  // 再次检查目标元素是否存在
                  const targetElement = document.querySelector('#app');
                  if (targetElement) {
                    const badge = createBadge();
                  } else {
                    // 如果还没有找到，等待一段时间再试
                    setTimeout(() => {
                      const badge = createBadge();
                    }, 500);
                  }
                });
              }
              
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initBadge);
              } else {
                // DOM 已经加载完成，但 React 可能还没渲染
                initBadge();
              }
              
              window.TraeBadgePlugin = { 
                destroy: () => {
                  const badge = document.getElementById('trae-badge-plugin');
                  if (badge) badge.remove();
                  style.remove();
                  delete window.TraeBadgePlugin;
                },
                recreate: createBadge
              };
            })();
          </script>
        
</body>
