<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感捕手 - Trae 创造力大赛原型</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --tag-bg: #e8f4fd;
            --tag-text: #3498db;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 手机外框模拟 */
        .phone-frame {
            width: 375px;
            height: 812px;
            background: var(--bg-color);
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
            border: 8px solid #2c3e50;
            display: flex;
            flex-direction: column;
        }

        /* 顶部状态栏 */
        .status-bar {
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        /* 头部 */
        header {
            padding: 10px 24px 20px;
        }
        header h1 { font-size: 28px; color: var(--text-main); }
        header p { font-size: 14px; color: var(--text-sub); margin-top: 4px; }

        /* 内容列表 */
        .content-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 24px 100px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.98); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-time { font-size: 12px; color: var(--text-sub); }
        .card-type { font-size: 10px; background: var(--primary); color: #fff; padding: 2px 8px; border-radius: 10px; }
        .card-title { font-size: 18px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; line-height: 1.4; }
        .card-desc { font-size: 14px; color: var(--text-sub); line-height: 1.5; margin-bottom: 12px; }
        
        .tags { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { font-size: 12px; background: var(--tag-bg); color: var(--tag-text); padding: 4px 10px; border-radius: 12px; font-weight: 500; }

        /* 底部导航 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding-bottom: 10px;
        }

        .add-btn {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
            cursor: pointer;
            transition: all 0.3s;
        }
        .add-btn:hover { transform: scale(1.1); }

        /* 模态框 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: #fff;
            width: 100%;
            padding: 30px 24px 40px;
            border-radius: 30px 30px 0 0;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 20px; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text-main); }

        textarea {
            width: 100%;
            height: 120px;
            border: 2px solid #eee;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: border 0.3s;
        }
        textarea:focus { border-color: var(--primary-light); }

        .ai-btn {
            width: 100%;
            margin-top: 16px;
            padding: 18px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .ai-btn:disabled { background: #ccc; cursor: not-allowed; }
        .ai-btn .spinner { display: none; width: 18px; height: 18px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        .ai-btn.loading .spinner { display: block; }
        .ai-btn.loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* 响应式：小屏幕直接全屏 */
        @media (max-width: 420px) {
            body { padding: 0; background: var(--bg-color); }
            .phone-frame { width: 100%; height: 100vh; border-radius: 0; border: none; }
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="status-bar">
        <span>9:41</span>
        <span>⚡ 100%</span>
    </div>

    <header>
        <h1>灵感捕手 ✨</h1>
        <p>今天已捕获 3 个想法</p>
    </header>

    <div class="content-list" id="cardList">
        <!-- 示例卡片 -->
        <div class="card">
            <div class="card-header">
                <span class="card-time">今天 10:24</span>
                <span class="card-type">💡 灵感</span>
            </div>
            <div class="card-title">关于“银发智伴”的语音交互优化</div>
            <div class="card-desc">老年人对长指令不敏感，应该把“帮我打开天气”简化为“今天热不热”这种自然对话。需要增加方言识别的兜底策略。</div>
            <div class="tags">
                <span class="tag">#适老化</span>
                <span class="tag">#语音交互</span>
                <span class="tag">#产品优化</span>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-time">昨天 22:10</span>
                <span class="card-type">📚 阅读</span>
            </div>
            <div class="card-title">《纳瓦尔宝典》核心摘录</div>
            <div class="card-desc">“如果你不能决定，答案就是否。” 在招聘、合作、投资时，犹豫本身就说明了不匹配。不要试图说服自己。</div>
            <div class="tags">
                <span class="tag">#读书笔记</span>
                <span class="tag">#决策思维</span>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="add-btn" id="openModal">+</div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-handle"></div>
            <div class="modal-title">捕捉新灵感</div>
            <textarea id="inputText" placeholder="随便写点什么，AI 会帮你整理成结构化笔记..."></textarea>
            <button class="ai-btn" id="aiProcessBtn">
                <span class="btn-text">✨ AI 智能整理</span>
                <div class="spinner"></div>
            </button>
        </div>
    </div>
</div>

<script>
    const openBtn = document.getElementById('openModal');
    const overlay = document.getElementById('modalOverlay');
    const inputText = document.getElementById('inputText');
    const aiBtn = document.getElementById('aiProcessBtn');
    const cardList = document.getElementById('cardList');

    // 打开/关闭模态框
    openBtn.addEventListener('click', () => overlay.classList.add('active'));
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
    });

    // AI 处理逻辑
    aiBtn.addEventListener('click', () => {
        const text = inputText.value.trim();
        if (!text) return;

        // 1. 按钮加载状态
        aiBtn.classList.add('loading');
        aiBtn.disabled = true;

        // 2. 模拟 AI 延迟
        setTimeout(() => {
            // 3. 生成卡片
            const now = new Date();
            const timeStr = `今天 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            // 简单的模拟标签提取
            const tags = ['#新想法', '#待整理'];
            if (text.includes('代码') || text.includes('bug')) tags.push('#技术');
            if (text.includes('设计') || text.includes('UI')) tags.push('#设计');
            if (text.includes('书') || text.includes('读')) tags.push('#阅读');

            const cardHTML = `
                <div class="card" style="animation: fadeIn 0.5s ease;">
                    <div class="card-header">
                        <span class="card-time">${timeStr}</span>
                        <span class="card-type">✨ AI 整理</span>
                    </div>
                    <div class="card-title">${text.substring(0, 20)}${text.length > 20 ? '...' : ''}</div>
                    <div class="card-desc">${text}</div>
                    <div class="tags">
                        ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                </div>
            `;

            cardList.insertAdjacentHTML('afterbegin', cardHTML);
            
            // 4. 重置状态
            inputText.value = '';
            aiBtn.classList.remove('loading');
            aiBtn.disabled = false;
            overlay.classList.remove('active');
        }, 1500);
    });

    // 简单的淡入动画
    const style = document.createElement('style');
    style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }`;
    document.head.appendChild(style);
</script>

</body>
</html>
