<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>备考速通宝</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<style>
:root{--bg-primary:#FAF9F5;--bg-secondary:#F5F4EE;--bg-card:#FFFFFF;--text-primary:#2D2B27;--text-secondary:#6B6862;--text-tertiary:#9B9893;--accent:#D97757;--accent-light:#F5C0AC;--accent-dark:#B85638;--success:#5B9F6B;--success-light:#D4EBD9;--danger:#D45858;--danger-light:#F5D4D4;--warning:#D4A542;--border:#E8E5DD;--border-strong:#D4D0C8;--radius:12px;--radius-sm:8px;--radius-lg:20px;--shadow:0 2px 8px rgba(0,0,0,0.06);--shadow-lg:0 8px 32px rgba(0,0,0,0.1);--transition:0.2s ease}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}
#root{min-height:100vh}
.app-container{display:flex;flex-direction:column;min-height:100vh}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--bg-card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.app-header-left{display:flex;align-items:center;gap:12px}
.app-header h1{font-size:20px;font-weight:600;color:var(--text-primary)}
.app-header .subtitle{font-size:13px;color:var(--text-tertiary);margin-left:4px}
.nav-tabs{display:flex;gap:4px;background:var(--bg-secondary);padding:4px;border-radius:var(--radius)}
.nav-tab{padding:8px 20px;border:none;background:transparent;color:var(--text-secondary);font-size:14px;font-weight:500;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition)}
.nav-tab:hover{color:var(--text-primary)}
.nav-tab.active{background:var(--bg-card);color:var(--accent);box-shadow:var(--shadow)}
.app-content{flex:1;padding:32px;max-width:1200px;width:100%;margin:0 auto}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}
.card-title{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:16px}
.btn{padding:10px 24px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--border-strong)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger-light)}
.btn-danger:hover{background:var(--danger-light)}
.btn-success{background:var(--success);color:white}
.btn-success:hover{opacity:0.9}
.btn-sm{padding:6px 14px;font-size:13px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.dashboard{display:grid;grid-template-columns:2fr 1fr;gap:24px}
.dashboard-chart-card{grid-column:1/-1}
.chart-container{position:relative;width:100%;height:360px}
.chart-svg{width:100%;height:100%}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-value{font-size:32px;font-weight:700;color:var(--accent)}
.stat-label{font-size:13px;color:var(--text-tertiary);margin-top:4px}
.exam-setup{max-width:600px;margin:0 auto;text-align:center}
.exam-setup h2{font-size:24px;margin-bottom:8px}
.exam-setup p{color:var(--text-secondary);margin-bottom:24px}
.subject-selector{display:flex;gap:16px;justify-content:center;margin-bottom:24px}
.subject-card{flex:1;max-width:260px;padding:24px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:var(--transition);text-align:center;background:var(--bg-card)}
.subject-card:hover{border-color:var(--accent-light)}
.subject-card.selected{border-color:var(--accent);background:#FFF8F3}
.subject-card .icon{font-size:32px;margin-bottom:8px}
.subject-card .name{font-size:16px;font-weight:600;margin-bottom:4px}
.subject-card .count{font-size:13px;color:var(--text-tertiary)}
.question-count-selector{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.count-option{padding:8px 16px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;transition:var(--transition)}
.count-option.selected{border-color:var(--accent);background:#FFF8F3;color:var(--accent)}
.exam-progress{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding:12px 20px;background:var(--bg-secondary);border-radius:var(--radius)}
.exam-progress-text{font-size:14px;color:var(--text-secondary)}
.exam-progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px;margin:0 16px;overflow:hidden}
.exam-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.3s ease}
.question-card{margin-bottom:24px}
.question-type-badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:500;margin-bottom:12px}
.question-type-badge.single{background:var(--accent-light);color:var(--accent-dark)}
.question-type-badge.multiple{background:#D4E0F5;color:#4A6FA5}
.question-text{font-size:16px;font-weight:500;margin-bottom:20px;line-height:1.7}
.question-category{font-size:12px;color:var(--text-tertiary);margin-top:12px}
.option-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:var(--transition)}
.option-item:hover{border-color:var(--accent-light);background:#FFF8F3}
.option-item.selected{border-color:var(--accent);background:#FFF8F3}
.option-item.correct{border-color:var(--success);background:var(--success-light)}
.option-item.wrong{border-color:var(--danger);background:var(--danger-light)}
.option-label{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg-secondary);font-size:13px;font-weight:600;flex-shrink:0}
.option-item.selected .option-label{background:var(--accent);color:white}
.option-item.correct .option-label{background:var(--success);color:white}
.option-item.wrong .option-label{background:var(--danger);color:white}
.option-text{flex:1;font-size:14px;padding-top:4px}
.exam-nav{display:flex;justify-content:space-between;margin-top:24px}
.exam-result{text-align:center;max-width:600px;margin:0 auto}
.exam-result-score{font-size:64px;font-weight:800;color:var(--accent);margin:16px 0}
.exam-result-stats{display:flex;justify-content:center;gap:32px;margin:24px 0}
.exam-result-stat{text-align:center}
.exam-result-stat .value{font-size:28px;font-weight:700}
.exam-result-stat .value.correct{color:var(--success)}
.exam-result-stat .value.wrong{color:var(--danger)}
.exam-result-stat .label{font-size:13px;color:var(--text-tertiary);margin-top:4px}
.explanation-box{text-align:left;background:var(--bg-secondary);border-radius:var(--radius-sm);padding:16px;margin-top:12px;font-size:14px;color:var(--text-secondary);line-height:1.7}
.explanation-box .label{font-weight:600;color:var(--text-primary);margin-bottom:4px}
.wrong-questions-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.wrong-questions-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-chip{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;transition:var(--transition);background:var(--bg-card)}
.filter-chip.active{background:var(--accent);color:white;border-color:var(--accent)}
.wrong-question-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:var(--transition)}
.wrong-question-item.ac{opacity:0.6}
.wrong-question-item .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wrong-question-item .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-tertiary)}
.wrong-question-item .actions{display:flex;gap:8px}
.wrong-question-item .question{font-size:15px;font-weight:500;margin-bottom:12px;line-height:1.6}
.wrong-question-item .answer-section{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.answer-block{padding:12px;border-radius:var(--radius-sm);font-size:13px}
.answer-block.correct{background:var(--success-light)}
.answer-block.wrong{background:var(--danger-light)}
.answer-block .label{font-size:11px;font-weight:600;margin-bottom:4px;text-transform:uppercase}
.answer-block.correct .label{color:var(--success)}
.answer-block.wrong .label{color:var(--danger)}
.star-btn{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-tertiary);transition:var(--transition)}
.star-btn.active{color:var(--warning)}
.card-autoplay-container{display:flex;flex-direction:column;align-items:center;padding:40px 20px}
.card-autoplay-controls{display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap;justify-content:center}
.keyword-card{width:100%;max-width:520px;min-height:320px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;animation:cardEnter 0.6s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes cardEnter{0%{opacity:0;transform:perspective(1000px) rotateY(-25deg) translateX(-60px) scale(0.85);filter:blur(8px)}50%{opacity:1;filter:blur(0)}100%{opacity:1;transform:perspective(1000px) rotateY(0) translateX(0) scale(1);filter:blur(0)}}
.keyword-card::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(105deg,transparent 40%,rgba(217,119,87,0.08) 50%,rgba(217,119,87,0.15) 55%,rgba(217,119,87,0.08) 60%,transparent 70%);animation:cardSweep 1.2s ease-out 0.2s;pointer-events:none}
@keyframes cardSweep{0%{left:-100%}100%{left:200%}}
.keyword-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-light));animation:barGrow 0.6s ease-out;transform-origin:left}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.keyword-card.starred::before{background:linear-gradient(90deg,var(--warning),#F5D884)}
.keyword-card .card-category{font-size:12px;color:var(--text-tertiary);margin-bottom:16px}
.keyword-card .card-q-section{margin-bottom:24px}
.keyword-card .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:8px}
.keyword-card .card-keywords{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.keyword-tag{padding:4px 12px;background:var(--bg-secondary);border-radius:20px;font-size:13px;color:var(--text-primary)}
.keyword-tag.q-tag{background:#FFF0E8;color:var(--accent-dark)}
.keyword-tag.a-tag{background:#E8F5E8;color:var(--success)}
.keyword-card .card-question{font-size:15px;color:var(--text-secondary);line-height:1.6}
.keyword-card .card-arrow{text-align:center;font-size:24px;color:var(--accent);margin:8px 0}
.keyword-card .card-answer-text{font-size:15px;font-weight:600;color:var(--text-primary)}
.card-counter{margin-top:24px;font-size:14px;color:var(--text-tertiary)}
.card-empty{text-align:center;padding:60px 20px;color:var(--text-tertiary)}
.sparrow-icon{width:36px;height:36px;flex-shrink:0}
.sparrow-celebrate{animation:sparrowHop 0.6s ease}
@keyframes sparrowHop{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-5deg)}50%{transform:translateY(-6px) rotate(3deg)}75%{transform:translateY(-10px) rotate(-2deg)}}
@keyframes sparrowCelebrate{0%{transform:translateY(0) rotate(-3deg) scale(1)}100%{transform:translateY(-15px) rotate(3deg) scale(1.1)}}
@keyframes textBounce{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(calc(cos(var(--angle))*var(--distance)),calc(sin(var(--angle))*var(--distance))) scale(0);opacity:0}}
@media(max-width:768px){.dashboard{grid-template-columns:1fr}.app-content{padding:16px}.nav-tabs{flex-wrap:wrap}.wrong-question-item .answer-section{grid-template-columns:1fr}.subject-selector{flex-direction:column}}
select.btn{appearance:auto}
</style>
</head>

市场的特征包括：(1)挂牌标准较低；(2)信息披露要求较低，监管较为宽松；(3)交易制度通常采用做市商制度。竞价交易制度是交易所市场采用的。", "category": "第一章-金融市场体系-场外市场"}, {"id": "fin-007", "type": "single", "subject": "financial", "question": "1992年以前，我国对银行业、证券业、保险业、信托业实行集中统一监管的机构是( )。", "options": {"A": "财政部", "B": "国家发改委", "C": "中国人民银行", "D": "国务院金融稳定委员会"}, "answer": ["C"], "explanation": "我国金融监管体制第一阶段为集中统一监管阶段。1984年起，中国人民银行开始专门行使中央银行职能，负责对银行业、证券业、保险业、信托业实行集中统一监管。", "category": "第二章-中国的金融体系-金融监管体制"}, {"id": "fin-008", "type": "single", "subject": "financial", "question": "若商业银行的法定存款准备率为6%，客户提取现金比率为10%，超额准备率为9%，则可求出货币乘数为( )。", "options": {"A": "4.4", "B": "4.7", "C": "5.3", "D": "5.9"}, "answer": ["A"], "explanation": "货币乘数 m=(1+c)/(r+e+c)=(1+10%)/(6%+9%+10%)=1.10/0.25=4.4。其中c为现金漏损率，r为法定准备金率，e为超额准备金率。", "category": "第二章-中国的金融体系-货币乘数"}, {"id": "fin-009", "type": "single", "subject": "financial", "question": "开立证券账户应坚持( )的原则。", "options": {"A": "合法性与及时性", "B": "合法性与真实性", "C": "及时性与全面性", "D": "及时性与真实性"}, "answer": ["B"], "explanation": "开立证券账户应坚持合法性和真实性的原则。合法性是指只有国家法律允许进行证券交易的自然人和法人才能到指定机构开立证券账户；真实性是指投资者开立证券账户时所提供的资料必须真实有效。", "category": "第三章-证券市场主体-证券账户"}, {"id": "fin-010", "type": "single", "subject": "financial", "question": "如果投资者持有港币要进行证券投资的，则开立( )。", "options": {"A": "上海A股账户", "B": "上海B股账户", "C": "深圳A股账户", "D": "深圳B股账户"}, "answer": ["D"], "explanation": "如果投资者持有港币要进行证券投资的，则开立深圳B股账户。（上海B股以美元结算，深圳B股以港币结算。）", "category": "第三章-证券市场主体-证券账户"}, {"id": "fin-011", "type": "single", "subject": "financial", "question": "证券公司直接为投资者开立( )。", "options": {"A": "清算账户", "B": "银行账户", "C": "证券账户", "D": "资金结算账户"}, "answer": ["D"], "explanation": "证券公司直接为投资者开立资金结算账户。证券登记结算公司仅为证券公司开立结算账户，结算账户专用于证券交易成交后的清算交收。", "category": "第三章-证券市场主体-证券公司"}, {"id": "fin-012", "type": "single", "subject": "financial", "question": "中国证券业协会采取( )的组织形式。", "options": {"A": "行纪制", "B": "契约制", "C": "会员制", "D": "经纪制"}, "answer": ["C"], "explanation": "中国证券业协会采取会员制的组织形式，证券公司应当加入中国证券业协会。", "category": "第三章-证券市场主体-自律性组织"}, {"id": "fin-013", "type": "single", "subject": "financial", "question": "证券业协会监事长由( )。", "options": {"A": "监事会在当选的监事中选举产生", "B": "会员单位推荐产生", "C": "会员大会选举产生", "D": "中国证监会指定"}, "answer": ["A"], "explanation": "中国证券业协会章程规定，监事由会员单位推荐，经会员大会选举产生，监事长由监事会在当选的监事中选举产生。", "category": "第三章-证券市场主体-自律性组织"}, {"id": "fin-014", "type": "multiple", "subject": "financial", "question": "下列选项中，属于对上市公司进行监管的类型的是( )。Ⅰ.信息披露的监管 Ⅱ.公司治理监管 Ⅲ.并购重组的监管 Ⅳ.内幕交易行为的监管", "options": {"A": "Ⅰ、Ⅱ、Ⅲ", "B": "Ⅰ、Ⅱ、Ⅳ", "C": "Ⅰ、Ⅲ、Ⅳ", "D": "Ⅰ、Ⅱ、Ⅲ、Ⅳ"}, "answer": ["A"], "explanation": "对上市公司的监管包括信息披露的监管、公司治理监管和并购重组的监管等，其中信息披露的监管是对上市公司日常监管的主要内容。对内幕交易行为的监管属于对交易市场的监管，不属于对上市公司的监管。", "category": "第三章-证券市场主体-上市公司监管"}, {"id": "fin-015", "type": "single", "subject": "financial", "question": "投资咨询机构属于证券( )机构。", "options": {"A": "自营", "B": "投资", "C": "服务", "D": "代理"}, "answer": ["C"], "explanation": "投资咨询机构属于证券服务机构。证券服务机构包括投资咨询机构、财务顾问机构、资信评级机构、资产评估机构、会计师事务所等从事证券服务业务的机构。", "category": "第三章-证券市场主体-证券中介机构"}, {"id": "fin-016", "type": "single", "subject": "financial", "question": "关于证券公司的说法，错误的是( )。", "options": {"A": "在我国，设立证券公司必须经国务院证券监督管理机构审查批准", "B": "证券公司是证券市场证券和资金的主要提供者", "C": "证券公司可以通过资产管理方式，为投资者提供证券及其他金融产品的投资管理服务", "D": "美国称证券公司为\"投资银行\"，英国称为\"商人银行\""}, "answer": ["B"], "explanation": "证券公司是证券市场的主要中介机构，为证券发行人和投资者提供专业化的中介服务，同时也是证券市场的重要机构投资者。故\"证券公司是证券市场证券和资金的主要提供者\"说法错误。", "category": "第三章-证券市场主体-证券公司"}, {"id": "fin-017", "type": "single", "subject": "financial", "question": "2019年1月，( )是第一家获准进入我国信用评级市场的外资公司。", "options": {"A": "美国标普公司", "B": "穆迪投资", "C": "惠誉国际", "D": "大公国际"}, "answer": ["A"], "explanation": "2019年1月，美国标普公司是第一家获准进入我国信用评级市场的外资公司。", "category": "第三章-证券市场主体-证券服务机构"}, {"id": "fin-018", "type": "single", "subject": "financial", "question": "下列关于证券市场投资者的表述，说法错误的是( )。", "options": {"A": "证券投资者是证券市场的资金供给者", "B": "众多的证券投资者保证了证券发行和交易的连续性", "C": "证券市场投资者具有集中性和流动性的特点", "D": "证券投资者是指以取得利息、股息或资本收益为目的而买入证券的机构和个人"}, "answer": ["C"], "explanation": "证券市场投资者具有分散性和流动性的特点（非集中性）。", "category": "第三章-证券市场主体-证券投资者"}, {"id": "fin-019", "type": "single", "subject": "financial", "question": "股票市场价格的最直接影响因素是( )，并且其他因素都是通过作用于该因素而影响股票价格。", "options": {"A": "宏观经济因素", "B": "公司经营状况", "C": "政治因素", "D": "供求关系"}, "answer": ["D"], "explanation": "股票的市场价格由股票的价值决定，但同时受许多其他因素影响。其中，供求关系是最直接的影响因素，其他因素都是通过作用于供求关系而影响股票价格的。", "category": "第四章-股票-股票价格"}, {"id": "fin-020", "type": "single", "subject": "financial", "question": "非累积优先股票的特点是股息分派以( )为界，当年结清。", "options": {"A": "每个经营周期", "B": "每个会计年度", "C": "每个产业周期", "D": "每个生产周期"}, "answer": ["B"], "explanation": "非累积优先股票的特点是股息分派以每个会计年度为界，当年结清。累积优先股与非累积优先股的主要区别在于差额部分是否累积到下一会计年度。", "category": "第四章-股票-优先股"}, {"id": "fin-021", "type": "multiple", "subject": "financial", "question": "下列关于普通股股东表决权的论述，正确的是( )。Ⅰ.对公司重大决策的参与权是平等的 Ⅱ.每持有一份股份就有一票表决权 Ⅲ.表决权数量视其购买股票份数而定 Ⅳ.委托的代理人可以行使股东的一切权利", "options": {"A": "Ⅱ、Ⅲ", "B": "Ⅱ、Ⅲ、Ⅳ", "C": "Ⅰ、Ⅳ", "D": "Ⅰ、Ⅱ、Ⅲ"}, "answer": ["D"], "explanation": "普通股股东表决权特征包括：(1)参与权平等(Ⅰ正确)；(2)每持有一份股份一票表决权(Ⅱ正确)；(3)表决权数量视股票份数而定(Ⅲ正确)；(4)委托代理人只能在授权范围内行使表决权(Ⅳ错误)。", "category": "第四章-股票-股东权利"}, {"id": "fin-022", "type": "single", "subject": "financial", "question": "上市公司向原股东配售股份，简称为( )。", "options": {"A": "配股", "B": "定向发行", "C": "间接融资", "D": "增发"}, "answer": ["A"], "explanation": "上市公司向原股东配售股份简称\"配股\"，是公司按股东持股比例向原股东分配公司新股认购权，准其优先认购新股的方式。", "category": "第四章-股票-股票发行"}, {"id": "fin-023", "type": "single", "subject": "financial", "question": "关于股票合并的说法，错误的是( )。", "options": {"A": "股票合并又称并股", "B": "股票合并会影响每位股东所持股东权益占公司全部股东权益的比重", "C": "股票合并常见于低价股", "D": "股票合并是将若干股股票合并为1股"}, "answer": ["B"], "explanation": "股票合并又称并股，是将若干股股票合并为1股。从理论上说，股票合并并不会改变公司的实收资本和每位股东所持股东权益占公司全部股东权益的比重。故B说法错误。", "category": "第四章-股票-股票合并"}, {"id": "fin-024", "type": "single", "subject": "financial", "question": "目前我国股票市场实行( )清算制度。", "options": {"A": "T+0", "B": "T+1", "C": "T+2", "D": "T+3"}, "answer": ["B"], "explanation": "目前我国股票市场实行T+1清算制度，而期货市场是T+0，可以进行日内投机。", "category": "第四章-股票-股票交易"}, {"id": "fin-025", "type": "single", "subject": "financial", "question": "下列关于股票价格指数的说法，错误的是( )。", "options": {"A": "股票价格指数一般由一些有影响力的机构编制，并定期及时发布", "B": "股票价格指数是衡量 l", "question": "下列关于公开发行企业债券条件的说法，错误的是( )。", "options": {"A": "发行企业债券前连续2年盈利", "B": "企业财务会计制度符合国家规定", "C": "企业规模达到国家规定的要求", "D": "所筹资金用途符合国家产业政策"}, "answer": ["A"], "explanation": "根据《企业债券管理条例》相关规定，企业发行企业债券前需要连续3年盈利，而不是连续2年盈利。故A错误。", "category": "第五章-债券-企业债券"}, {"id": "fin-033", "type": "single", "subject": "financial", "question": "一般认为，基金起源于( )，是在18世纪末、19世纪初产业革命的推动下出现的。", "options": {"A": "德国", "B": "美国", "C": "英国", "D": "日本"}, "answer": ["C"], "explanation": "基金起源于英国，是在18世纪末、19世纪初产业革命的推动下出现的。", "category": "第六章-证券投资基金-基金概述"}, {"id": "fin-034", "type": "single", "subject": "financial", "question": "按基金的投资标的划分，证券投资基金可分为( )。", "options": {"A": "债券基金、股票基金和货币市场基金", "B": "封闭式基金与开放式基金", "C": "成长型基金与收入型基金", "D": "契约型基金与公司型基金"}, "answer": ["A"], "explanation": "按基金的投资标的划分，证券投资基金可分为债券基金、股票基金、货币市场基金等。(B按运作方式划分；C按投资目标划分；D按组织形式划分。)", "category": "第六章-证券投资基金-基金分类"}, {"id": "fin-035", "type": "single", "subject": "financial", "question": "开放式基金的申购、赎回原则是( )。", "options": {"A": "金额申购、金额赎回", "B": "金额申购、份额赎回", "C": "份额申购、份额赎回", "D": "份额申购、金额赎回"}, "answer": ["B"], "explanation": "开放式基金采取金额申购、份额赎回的原则。ETF采用的是实物申购、实物赎回原则。", "category": "第六章-证券投资基金-基金申购赎回"}, {"id": "fin-036", "type": "single", "subject": "financial", "question": "以下不属于基金当事人的是( )。", "options": {"A": "基金管理人", "B": "基金托管人", "C": "基金监管机构", "D": "基金份额持有人"}, "answer": ["C"], "explanation": "基金当事人包括基金份额持有人、基金管理人以及基金托管人，而基金监管机构并不是基金合同的当事人。", "category": "第六章-证券投资基金-基金当事人"}, {"id": "fin-037", "type": "single", "subject": "financial", "question": "基金一般都是按照( )的时间间隔对基金资产进行估值。", "options": {"A": "不确定", "B": "固定", "C": "管理人随时确定", "D": "托管人随时确定"}, "answer": ["B"], "explanation": "基金一般按照固定的时间间隔对基金资产进行估值，以确保基金资产估值的公正性和准确性。", "category": "第六章-证券投资基金-基金估值"}, {"id": "fin-038", "type": "single", "subject": "financial", "question": "从基金财产中列支的费用不包括( )。", "options": {"A": "基金托管人的托管费", "B": "基金的证券交易费用", "C": "基金转换费", "D": "基金管理人的管理费"}, "answer": ["C"], "explanation": "可以从基金财产中列支的费用包括基金管理人的管理费、基金托管人的托管费、基金的证券交易费用等。基金转换费不属于可以从基金财产中列支的费用。", "category": "第六章-证券投资基金-基金费用"}, {"id": "fin-039", "type": "single", "subject": "financial", "question": "下列关于公募基金信息披露的说法，错误的是( )。", "options": {"A": "公募基金的一个突出特点是透明度较高", "B": "在我国，公募基金的信息披露具有自愿性", "C": "公募基金披露信息要具有真实性、准确性和完整性", "D": "披露信息是了解、识别公募基金的重要信息来源渠道"}, "answer": ["B"], "explanation": "在我国，公募基金的信息披露具有强制性，而不是自愿性。公募基金突出特点是透明度较高，披露信息要真实、准确、完整。", "category": "第六章-证券投资基金-基金信息披露"}, {"id": "fin-040", "type": "single", "subject": "financial", "question": "买卖双方签订了一份合约，该合约规定买方在交付了一笔费用后，即取得在合约规定的到期日或到期日以前按协定价买入或卖出一定数量相关股票的权利。这种合约称为( )。", "options": {"A": "货币期权", "B": "互换期权", "C": "利率期权", "D": "股票期权"}, "answer": ["D"], "explanation": "题目描述的合约是买方支付费用后获得在到期日或之前按协定价买入或卖出一定数量相关股票的权利，符合股票期权的定义。", "category": "第七章-金融衍生工具-金融期权"}, {"id": "fin-041", "type": "multiple", "subject": "financial", "question": "关于看涨期权交易双方的潜在盈亏，下列说法正确的有( )。Ⅰ.买方潜在盈利无限，亏损有限 Ⅱ.买方潜在盈利有限，亏损无限 Ⅲ.卖方潜在盈利无限，亏损有限 Ⅳ.卖方潜在盈利有限，亏损无限", "options": {"A": "Ⅱ、Ⅳ", "B": "Ⅰ、Ⅲ", "C": "Ⅱ、Ⅲ", "D": "Ⅰ、Ⅳ"}, "answer": ["D"], "explanation": "理论上，看涨期权买方亏损最大值为期权费（有限），若价格上涨则收益无限(Ⅰ正确)。卖方潜在收益最大即期权费用（有限），亏损理论上没有上限(Ⅳ正确)。", "category": "第七章-金融衍生工具-期权盈亏"}, {"id": "fin-042", "type": "single", "subject": "financial", "question": "属于远期合约的衍生工具是( )。", "options": {"A": "远期股票期权", "B": "远期利率协议", "C": "远期股票指数期货", "D": "远期货币期货"}, "answer": ["B"], "explanation": "金融远期合约主要包括远期利率协议、远期外汇合约、远期股票合约等。远期股票期权、远期股票指数期货、远期货币期货不属于远期合约。", "category": "第七章-金融衍生工具-金融远期"}, {"id": "fin-043", "type": "single", "subject": "financial", "question": "通过各种通讯方式，不通过集中的交易所，实行分散的、一对一交易的金融衍生工具属于( )。", "options": {"A": "嵌入式衍生工具", "B": "交易所交易的衍生工具", "C": "结构化金融衍生工具", "D": "OTC交易的衍生工具"}, "answer": ["D"], "explanation": "场外交易市场(OTC)交易的衍生工具是指通过各种通讯方式，不通过集中的交易所，实行分散的、一对一交易的衍生工具。", "category": "第七章-金融衍生工具-衍生工具分类"}, {"id": "fin-044", "type": "multiple", "subject": "financial", "question": "金融衍生工具从其自身交易的方法和特点可以分为( )。Ⅰ.金融期权 Ⅱ.结构化金融衍生工具 Ⅲ.金融期货 Ⅳ.金融远期合约", "options": {"A": "Ⅱ、Ⅳ", "B": "Ⅰ、Ⅱ", "C": "Ⅰ、Ⅱ、Ⅲ、Ⅳ", "D": "Ⅰ、Ⅲ、Ⅳ"}, "answer": ["C"], "explanation": "金融衍生工具从其自身交易方法和特点可以分为金融远期合约、金融期货、金融期权、金融互换和结构化金融衍生工具。", "category": "第七章-金融衍生工具-衍生工具分类"}, {"id": "fin-045", "type": "single", "subject": "financial", "question": "下列不能作为资产证券化基础资产的是( )。", "options": {"A": "应付账款", "B": "债券组合", "C": "不动产和信贷资产", "D": "应收账款和未来收益"}, "answer": ["A"], "explanation": "资产证券化基础资产包括不动产、应收账款、信贷资产、未来收益、债券组合等。应付账款不能作为基础资产。", "category": "第七章-金融衍生工具-资产证券化"}, {"id": "fin-046", "type": "single", "subject": "financial", "question": "结构化金融衍生产品按发行方式分类，公开募集的结构化产品通常可以在( )交易。", "options": {"A": "交易所", "B": "证券公司", "C": "基金公司", "D": "商业银行"}, "answer": ["A"], "explanation": "结构化金融衍生产品按发行方式分类，公开募集的结构化产品通常可以在交易所交易。", "category": "第七章-金融衍生工具-结构化产品"}, {"id": "fin-047", "type": "single", "subject": "financial", "question": "下列关于ABS产品的说法，错误的是( )。", "options": {"A": "狭义ABS主要以某一类同质资产为标的资产", "B": "担保债务凭证CDO的基础资产是一系列的债务工具", "C": "期限在一年以下的资产支持商业票据属于CDO的基础资产", "D": "ABS产品可以分为狭义ABS和担保债务凭证CDO"}, "answer": ["C"], "explanation": "期限在一年以下的资产支持商业票据属于狭义ABS的基础资产，而非CDO的基础资产。故C说法错误。", "category": "第七章-金融衍生工具-资产证券化"}, {"id": "fin-048", "type": "multiple", "subject": "financial", "question": "金融风险的度量包括( )。Ⅰ.风险发现 Ⅱ.风险分析 Ⅲ.风险评估 Ⅳ.风险报告", "options": {"A": "Ⅱ、Ⅲ、Ⅳ", "B": "Ⅱ、Ⅲ", "C": "Ⅰ、Ⅱ、Ⅲ、Ⅳ", "D": "Ⅰ、Ⅲ"}, "answer": ["B"], "explanation": "金融风险的度量包括风险分析和风险评估。", "category": "第八章-金融风险管理-风险度量"}, {"id": "fin-049", "type": "single", "subject": "financial", "question": "个人收入、国内生产总值、社会商品销售额等属于经济指标分类中的( )。", "options": {"A": "先行性指标", "B": "同步性指标", "C": "滞后性指标", "D": "技术性指标"}, "answer": ["B"], "explanation": "经济指标分三类：先行性指标；同步性指标（变化基本与总体经济活动转变同步，如个人收入、国内生产总值、社会商品销售额等）；滞后性指标。", "category": "第八章-金融风险管理-宏观经济指标"}];
var lawsQuestions = [{"id": "law-001", "type": "single", "subject": "laws", "question": "根据《公司法》（2024年修订版），关于有限责任公司股东认缴出资的期限，下列说法正确的是（ ）。", "options": {"A": "全体股东认缴的出资额由股东各自在公司成立之日起五年内缴足", "B": "由股东各自在公司章程规定的期限内缴足，法律不再限制最长时间", "C": "由股东各自在公司成立之日起两年内缴足", "D": "由股东各自在公司成立之日起一年内缴足"}, "answer": ["A"], "explanation": "2024年修订的《公司法》规定，全体股东认缴的出资额由股东按照公司章程的规定自公司成立之日起五年内缴足。", "category": "第一章-公司法"}, {"id": "law-002", "type": "single", "subject": "laws", "question": "根据《证券法》，下列信息中，不属于内幕信息的是（ ）。", "options": {"A": "公司分配股利或者增资的计划", "B": "公司股权结构的重大变化", "C": "公司营业用主要资产的抵押、出售或者报废一次超过该资产的百分之二十", "D": "公司债务担保的重大变更"}, "answer": ["C"], "explanation": "法律规定\"一次超过该资产的百分之三十\"才属于内幕信息。选项C表述为\"百分之二十\"，未达到法定标准，故不属于内幕信息。", "category": "第一章-证券法"}, {"id": "law-003", "type": "single", "subject": "laws", "question": "证券公司经营证券经纪业务，其净资本不得低于人民币（ ）。", "options": {"A": "2000万元", "B": "5000万元", "C": "1亿元", "D": "2亿元"}, "answer": ["A"], "explanation": "证券公司经营证券经纪业务的，净资本不得低于人民币2000万元。经营承销与保荐、自营、资产管理等业务之一的，净资本不低于5000万元；经营两项及以上的，不低于1亿元。", "category": "第二章-风险管理"}, {"id": "law-004", "type": "single", "subject": "laws", "question": "根据《证券公司全面风险管理规范》，证券公司应当任命一名（ ）负责全面风险管理工作。", "options": {"A": "首席风险官", "B": "总经理", "C": "董事长", "D": "监事会主席"}, "answer": ["A"], "explanation": "证券公司应当任命一名首席风险官负责全面风险管理工作。首席风险官不得兼任与其职责相冲突的职务，应保持独立性，直接向董事会报告。", "category": "第二章-风险管理"}, {"id": "law-005", "type": "single", "subject": "laws", "question": "某股份有限公司发起人甲，在公司成立2年后将其持有的本公司股份转让给乙。根据《公司法》，下列表述正确的是（ ）。", "options": {"A": "甲不得转让其持有的本公司股份", "B": "甲可以转让，但需经股东大会同意", "C": "甲可以转让，无需经股东大会同意", "D": "甲只能转让给公司其他股东"}, "answer": ["C"], "explanation": "发起人持有的本公司股份，自公司成立之日起一年内不得转让。公司成立2年后已超过1年限制期，发起人可以依法自由转让，无需经股东大会同意。", "category": "第一章-公司法"}, {"id": "law-006", "type": "single", "subject": "laws", "question": "下列关于基金产品风险等级评估的表述，错误的是（ ）。", "options": {"A": "应当根据基金的投资方向、投资范围、投资策略等因素进行评估", "B": "风险等级评估结果应当定期更新", "C": "风险等级从低到高至少应当分为五个等级", "D": "风险等级评估结果一旦确定，不得变更"}, "answer": ["D"], "explanation": "基金产品风险等级评估不是一成不变的，评估结果应当定期更新和动态调整。选项D\"一旦确定不得变更\"表述错误。", "category": "第二章-投资者适当性管理"}, {"id": "law-007", "type": "single", "subject": "laws", "question": "下列关于有限责任公司董事任期的说法中，正确的是（ ）。", "options": {"A": "任期由公司章程规定，但每届任期不得超过3年", "B": "任期由公司章程规定，但每届任期不得超过5年", "C": "任期由法律规定，每届任期为3年", "D": "任期由股东大会决定，没有期限限制"}, "answer": ["A"], "explanation": "董事任期由公司章程规定，但每届任期不得超过3年。董事任期届满，连选可以连任。", "category": "第一章-公司法"}, {"id": "law-008", "type": "single", "subject": "laws", "question": "根据《证券法》，向不特定对象发行的证券票面总值超过人民币（ ）的，应当由承销团承销。", "options": {"A": "5000万元", "B": "1亿元", "C": "2亿元", "D": "3亿元"}, "answer": ["A"], "explanation": "向不特定对象发行证券，票面总值超过人民币五千万元的，应当由承销团承销。承销团由主承销和参与承销的证券公司组成。", "category": "第一章-证券法"}, {"id": "law-009", "type": "single", "subject": "laws", "question": "根据《公司法》，公司合并可以采取（ ）两种形式。", "options": {"A": "吸收合并和新设合并", "B": "吸收合并和派生合并", "C": "新设合并和派生合并", "D": "存续合并和解散合并"}, "answer": ["A"], "explanation": "公司合并可以采取吸收合并和新设合并两种形式。吸收合并是一个公司吸收其他公司，被吸收的公司解散；新设合并是两个以上公司合并设立一个新的公司，合并各方解散。", "category": "第一章-公司法"}, {"id": "law-010", "type": "single", "subject": "laws", "question": "根据《公司法》，股份有限公司监事会中职工代表的比例不得低于（ ）。", "options": {"A": "三分之一", "B": "四分之一", "C": "五分之一", "D": "二分之一"}, "answer": ["A"], "explanation": "监事会应当包括股东代表和适当比例的公司职工代表，其中职工代表的比例不得低于三分之一，具体比例由公司章程规定。", "category": "第一章-公司法"}, {"id": "law-011", "type": "single", "subject": "laws", "question": "证券公司接受客户委托买入证券时，客户必须持有（ ）。", "options": {"A": "足额的保证金", "B": "足额的资金", "C": "相应的证券", "D": "信用交易资格"}, "answer": ["B"], "explanation": "证券公司接受客户委托买入证券时，客户必须持有足额的资金，即实行全额资金结算制度。", "category": "第三章-证券经纪"}, {"id": "law-012", "type": "single", "subject": "laws", "question": "根据《证券投资基金法》，公开募集基金的基金管理人，由（ ）核准。", "options": {"A": "中国证监会", "B": "中国银保监会", "C": "证券交易所", "D": "基金业协会"}, "answer": ["A"], "explanation": "公开募集基金的基金管理人由基金管理公司或者经中国证监会核准的其他机构担任。基金管理公司的设立须经中国证监会核准。", "category": "第一章-证券投资基金法"}, {"id": "law-013", "type": "single", "subject": "laws", "question": "根据《证券法》，证券交易所的设立和解散，由（ ）决定。", "options": {"A": "国务院", "B": "中国证监会", "C": "财政部", "D": "证券交易所会员大会"}, "answer": ["A"], "explanation": "证券交易所的设立和解散由国务院决定。证券交易所是不以营利为目的的法人，其设立需经国务院批准。", "category": "第一章-证券法"}, {"id": "law-014", "type": "single", "subject": "laws", "question": "根据《证券法》，证券交易内幕信息的知情人包括持有公司（ ）以上股份的股东及其董事、监事、高级管理人员。", "options": {"A": "3%", "B": "5%", "C": "10%", "D": "15%"}, "answer": ["B"], "explanation": "内幕信息的知情人包括持有公司百分之五以上股份的股东及其董事、监事、高级管理人员，以及实际控制人等。", "category": "第一章-证券法"}, {"id": "law-015", "type": "single", "subject": "laws", "question": "根据《公司法》，股份有限公司成立后，发现作为设立公司出资的非货币财产实际价额显著低于章程所定价额的，公司设立时的其他股东承担（ ）责任。", "options": {"A": "连带", "B": "按份", "C": "补充", "D": "无限"}, "answer": ["A"], "explanation": "应当由交付该出资的股东补足其差额；公司设立时的其他股东承担连带责任。这一规定旨在保障公司资本的充实。", "category": "第一章-公司法"}, {"id": "law-016", "type": "single", "subject": "laws", "question": "根据《证券法》，投资者持有一个上市公司已发行股份达到（ ）时，应当在该事实发生之日起3日内进行报告和公告。", "options": {"A": "3%", "B": "5%", "C": "10%", "D": "15%"}, "answer": ["B"], "explanation": "投资者持有或通过协议与他人共同持有一个上市公司已发行股份达到百分之五时，应当在该事实发生之日起三日内进行报告和公告，即\"举牌\"制度。", "category": "第一章-证券法"}, {"id": "law-017", "type": "single", "subject": "laws", "question": "根据《公司法》，公司分配当年税后利润时，应当提取利润的（ ）列入公司法定公积金。", "options": {"A": "5%", "B": "10%", "C": "15%", "D": "20%"}, "answer": ["B"], "explanation": "公司分配当年税后利润时，应当提取利润的百分之十列入公司法定公积金。当法定公积金累计额为公司注册资本的百分之五十以上的，可以不再提取。", "category": "第一章-公司法"}, {"id": "law-018", "type": "single", "subject": "laws", "question": "上市公司董事、监事、高级管理人员在任职期间每年转让的股份不得超过其所持有本公司股份总数的（ ）。", "options": {"A": "10%", "B": "20%", "C": "25%", "D": "50%"}, "answer": ["C"], "explanation": "上市公司董事、监事、高级管理人员在任职期间每年转让的股份不得超过其所持有本公司股份总数的百分之二十五。", "category": "第一章-证券法/公司法"}, {"id": "law-019", "type": "single", "subject": "laws", "question": "上市公司董事、监事、高级管理人员在离职后（ ）内，不得转让其所持有的本公司股份。", "options": {"A": "半年", "B": "1年", "C": "2年", "D": "3年"}, "answer": ["A"], "explanation": "上市公司董事、监事、高级管理人员在离职后半年内不得转让其所持有的本公司股份。", "category": "第一章-证券法/公司法"}, {"id": "law-020", "type": "single", "subject": "laws", "question": "根据《证券法》，证券公司应当自每一会计年度结束之日起（ ）个月内，向国务院证券监督管理机构报送年度报告。", "options": {"A": "3", "B": "4", "C": "6", "D": "12"}, "answer": ["B"], "explanation": "证券公司应当自每一会计年度结束之日起4个月内，向国务院证券监督管理机构报送年度报告。", "category": "第一章-证券法"}, {"id": "law-021", "type": "multiple", "subject": "laws", "question": "下列关于上市公司收购的说法，正确的有（ ）。", "options": {"A": "投资者可以采取要约收购、协议收购或者其他合法方式收购上市公司", "B": "通过协议收购达到30%时，继续进行收购的，应当依法向所有股东发出收购要约", "C": "收购人持有的被收购上市公司的股票，在收购行为完成后的十二个月内不得转让", "D": "收购报告书应当载明收购目的及是否拟在未来12个月内继续增持股份"}, "answer": ["A", "B", "C", "D"], "explanation": "四个选项均正确。上市公司收购方式包括要约收购、协议收购及其他合法方式；协议收购达到30%继续收购应发出要约；收购完成后12个月内不得转让；收购报告书应载明收购目的及后续增持计划。", "category": "第一章-证券法"}, {"id": "law-022", "type": "multiple", "subject": "laws", "question": "下列属于证券公司自营业务禁止行为的有（ ）。", "options": {"A": "假借他人名义或者以个人名义进行自营业务", "B": "违反规定委托其他单位或者个人从事证券自营业务", "C": "利用内幕信息进行内幕交易", "D": "违反规定从事证券自营业务"}, "answer": ["A", "B", "C", "D"], "explanation": "以上均为证券公司自营业务明令禁止的行为。", "category": "第三章-证券自营"}, {"id": "law-023", "type": "multiple", "subject": "laws", "question": "下列关于证券公司融资融券服务的说法，正确的有（ ）。", "options": {"A": "证券公司开展融资融券业务，必须经中国证监会批准", "B": "证券公司可以向客户的信用证券账户授予相应的融资融券交易权限", "C": "客户融资买入证券的，应当以卖券还款或者直接还款的方式偿还融入的资金", "D": "客户融券卖出证券的，应当以买券还券或者直接还券的方式偿还融入的证券"}, "answer": ["A", "B", "C", "D"], "explanation": "四个选项均正确。证券公司开展融资融券业务须经证监会批准；应为客户开立信用证券账户并授予交易权限；融资买入后以卖券还款或直接还款方式偿还；融券卖出后以买券还券或直接还券方式偿还。", "category": "第三章-证券公司信用业务"}, {"id": "law-024", "type": "multiple", "subject": "laws", "question": "下列关于信息披露的说法，正确的有（ ）。", "options": {"A": "发行人、上市公司依法披露的信息，必须真实、准确、完整", "B": "上市公司董监高应当保证上市公司所披露的信息真实、准确、完整", "C": "董监高无法保证信息披露内容的真实、准确、完整的，应当作出相应声明并披露", "D": "各类信息披露资料不得有虚假记载、误导性陈述或者重大遗漏"}, "answer": ["A", "B", "C", "D"], "explanation": "四个选项均为正确表述。发行人和上市公司披露的信息必须真实、准确、完整；董监高应保证信息披露质量，无法保证的应声明并说明原因。", "category": "第一章-证券法"}, {"id": "law-025", "type": "multiple", "subject": "laws", "question": "下列属于证券公司从事证券承销业务禁止性行为的有（ ）。", "options": {"A": "进行虚假的或者误导投资者的广告或者其他宣传推介活动", "B": "以不正当竞争手段招揽承销业务", "C": "其他违反证券承销业务规定的行为", "D": "向投资者提供投资建议"}, "answer": ["A", "B", "C"], "explanation": "承销业务禁止行为包括虚假或误导性广告宣传、不正当竞争招揽承销业务、其他违反承销规定的行为。选项D\"向投资者提供投资建议\"不属于承销业务禁止性行为。", "category": "第三章-证券承销与保荐"}, {"id": "law-026", "type": "multiple", "subject": "laws", "question": "下列关于证券公司内部控制的说法，正确的有（ ）。", "options": {"A": "证券公司应当建立健全有效的内部控制制度", "B": "内部控制应当覆盖证券公司所有业务、部门和人员", "C": "内部控制应当遵循健全、合理、制衡、独立的原则", "D": "证券公司应当定期对内部控制的有效性进行评估"}, "answer": ["A", "B", "C", "D"], "explanation": "四个选项均正确。证券公司应建立健全有效的内控制度；内控应覆盖所有业务、部门和人员；应遵循健全、合理、制衡、独立的原则；应定期评估内控有效性。", "category": "第二章-公司治理与内部控制"}, {"id": "law-027", "type": "multiple", "subject": "laws", "question": "下列关于证券公司客户资产管理业务的说法，正确的有（ ）。", "options": {"A": "应当向客户充分揭示风险，不得保证盈利或最低收益", "B": "应当与客户签订资产管理合同，约定双方权利义务", "C": "可以将其自有财产或者不同客户的资产混合管理", "D": "集合资产管理资产可以用于资金拆借、贷款、抵押融资或对外担保"}, "answer": ["A", "B"], "explanation": "选项C错误，不得将自有财产与不同客户资产混合管理；选项D错误，集合资产管理资产不得用于资金拆借、贷款、抵押融资或对外担保。", "category": "第三章-证券资产管理"}, {"id": "law-028", "type": "multiple", "subject": "laws", "question": "下列关于证券公司风险处置措施的说法，正确的有（ ）。", "options": {"A": "风险控制指标不符合规定，证监会可责令限期改正并限制业务、限制分配红利等", "B": "持续不符合规定，可责令控股股东转让股权、责令调整董监高", "C": "违法经营或重大风险，可采取责令停业整顿、托管、接管或行政重组", "D": "股东虚假出资、抽逃出资的，可责令限期改正并责令转让股权"}, "answer": ["A", "B", "C", "D"], "explanation": "四个选项均正确。根据《证券公司监督管理条例》，证监会可根据不同情形采取相应风险处置措施。", "category": "第一章-证券公司监督管理条例"}, {"id": "law-029", "type": "multiple", "subject": "laws", "question": "下列关于证券公司从业人员行为规范的说法，正确的有（ ）。", "options": {"A": "不得从事内幕交易、操纵证券市场等违法违规行为", "B": "不得泄露客户资料和交易信息", "C": "不得私下接受客户委托买卖证券", "D": "不得利用职务便利为本人或者他人谋取不正当利益"}, "answer": ["A", "B", "C", "D"], "explanation": "四个选项均为从业人员应遵守的行为规范。", "category": "第二章-从业人员管理"}, {"id": "law-030", "type": "multiple", "subject": "laws", "question": "下列关于证券公司申请证券业务许可的条件，说法正确的有（ ）。", "options": {"A": "有符合法律、行政法规规定的公司章程", "B": "主要股东及实际控制人具有持续盈利能力，信誉良好，最近3年无重大违法违规记录，净资产不低于人民币2亿元", "C": "董事、监事、高级管理人员具备任职资格，从业人员具有证券从业资格", "D": "有完善的风险管理与内部控制制度"}, "answer": ["A", "B", "C", "D"], "explanation": "四个选项均为设立证券公司的法定条件。", "category": "第一章-证券公司监督管理条例"}];
