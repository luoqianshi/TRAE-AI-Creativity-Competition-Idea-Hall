<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰箱剩菜料理师 | FridgeChef</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #eef1ff;
            border-color: #764ba2;
            transform: translateY(-2px);
        }

        .upload-area.dragover {
            background: #e8ecff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #888;
            font-size: 0.9rem;
        }

        input[type="file"] {
            display: none;
        }

        .preview-section {
            display: none;
            text-align: center;
        }

        .preview-image {
            max-width: 100%;
            max-height: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #667eea;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .loading-subtext {
            color: #888;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .results {
            display: none;
        }

        .section-title {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ingredients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .ingredient-item {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .ingredient-item:hover {
            border-color: #667eea;
            transform: translateY(-3px);
        }

        .ingredient-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .ingredient-name {
            font-weight: 600;
            color: #333;
        }

        .ingredient-status {
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .status-fresh {
            color: #28a745;
        }

        .status-warning {
            color: #fd7e14;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .recipe-card {
            background: #f8f9ff;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .recipe-card:hover {
            border-color: #667eea;
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }

        .recipe-card.selected {
            border-color: #667eea;
            background: #eef1ff;
        }

        .recipe-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .tag-quick {
            background: #d4edda;
            color: #155724;
        }

        .tag-regular {
            background: #cce5ff;
            color: #004085;
        }

        .tag-creative {
            background: #f8d7da;
            color: #721c24;
        }

        .recipe-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }

        .recipe-desc {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .recipe-meta {
            display: flex;
            gap: 15px;
            color: #888;
            font-size: 0.85rem;
        }

        .recipe-detail {
            display: none;
            background: #f8f9ff;
            border-radius: 16px;
            padding: 25px;
            margin-top: 20px;
        }

        .recipe-detail.show {
            display: block;
        }

        .detail-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #333;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .detail-section ul, .detail-section ol {
            padding-left: 20px;
            line-height: 1.8;
            color: #555;
        }

        .shopping-list {
            display: none;
            background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
            border-radius: 16px;
            padding: 25px;
            margin-top: 20px;
            border: 2px solid #ffc107;
        }

        .shopping-list.show {
            display: block;
        }

        .shopping-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .shopping-item {
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .waste-alert {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .waste-alert.show {
            display: block;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            .recipes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧊 冰箱剩菜料理师</h1>
            <p>拍一张冰箱照片，AI 帮你把剩菜变成美味料理</p>
        </header>

        <section class="card" id="upload-card">
            <div class="upload-area" id="upload-area">
                <div class="upload-icon">📷</div>
                <div class="upload-text">点击上传冰箱照片</div>
                <div class="upload-hint">或拖拽图片到此处，支持 JPG、PNG 格式</div>
                <input type="file" id="file-input" accept="image/*">
            </div>

            <div class="preview-section" id="preview-section">
                <img class="preview-image" id="preview-image" src="" alt="冰箱预览">
                <div>
                    <button class="btn btn-primary" id="analyze-btn">🍳 开始 AI 识别菜谱</button>
                    <button class="btn btn-secondary" id="reupload-btn">重新上传</button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text" id="loading-text">AI 正在识别食材...</div>
                <div class="loading-subtext" id="loading-subtext">正在分析冰箱里的美味潜力</div>
            </div>
        </section>

        <section class="card results" id="results">
            <div class="waste-alert" id="waste-alert">
                ⚠️ <strong>提醒：</strong>检测到有食材需要尽快食用，已优先推荐相关菜谱减少浪费。
            </div>

            <h3 class="section-title">🥬 识别到的食材</h3>
            <div class="ingredients-grid" id="ingredients-grid"></div>

            <h3 class="section-title">🍽️ 推荐菜谱</h3>
            <div class="recipes-grid" id="recipes-grid"></div>

            <div class="recipe-detail" id="recipe-detail">
                <h3 class="detail-title" id="detail-title"></h3>
                <div class="detail-section">
                    <h4>📋 所需食材</h4>
                    <ul id="detail-ingredients"></ul>
                </div>
                <div class="detail-section">
                    <h4>🥄 制作步骤</h4>
                    <ol id="detail-steps"></ol>
                </div>
                <div class="detail-section">
                    <h4>💡 小贴士</h4>
                    <p id="detail-tips"></p>
                </div>
                <button class="btn btn-primary" id="shopping-btn">🛒 生成购物清单</button>
            </div>

            <div class="shopping-list" id="shopping-list">
                <h3 class="section-title">🛒 还需购买</h3>
                <p>根据你选择的菜谱，下面这些食材冰箱里还没有：</p>
                <div class="shopping-items" id="shopping-items"></div>
            </div>
        </section>

        <footer>
            <p>TRAE AI 创造力大赛 · 冰箱剩菜料理师 Demo</p>
            <p>让 AI 帮你减少浪费，发现冰箱里的美味</p>
        </footer>
    </div>

            '青菜': [
                {

                    tag: '快手菜',
                    tagClass: 'tag-quick',
                    time: '5 分钟',
                    difficulty: '简单',
                    desc: '清爽解腻，保留蔬菜原味',

                }
            ],
            '土豆': [
                {

                    desc: '下饭神器，土豆爽脆，肉丝鲜嫩',
                    need: ['土豆', '猪肉/鸡肉', '青椒', '醋', '盐'],
                    steps: [
                        '土豆切丝泡水去淀粉，肉切丝备用',

                        '再下土豆丝大火翻炒',

                    ],

            ],
            '豆腐': [
                {
                    name: '麻婆豆腐',
                    tag: '正餐',

                    difficulty: '中等',
                    desc: '麻辣鲜香，豆腐嫩滑入味',

                        '出锅装盘'
                    ],
                    tips: '豆腐焯水可以去除豆腥味，也不容易碎。'
                }
            ],
            '米饭': [
                {
                    name: '蛋炒饭',
                    tag: '快手菜',

                    time: '8 分钟',
                    difficulty: '简单',
                    desc: '剩米饭的最佳归宿，粒粒分明',
                    need: ['米饭', '鸡蛋', '葱', '盐', '油'],
                    steps: [
                        '鸡蛋打散，米饭用筷子拨散',
                        '热锅倒油，倒入蛋液快速炒散',

        // 通用搭配菜谱
        const fallbackRecipes = [
            {
                name: '冰箱大乱炖',
                tag: '创意菜',
                tagClass: 'tag-creative',
                time: '25 分钟',
                difficulty: '简单',
                desc: '把冰箱里所有食材一锅炖，不浪费每一口',
                need: ['现有食材', '洋葱', '蒜', '酱油', '盐'],
                steps: [
                    '把所有食材洗净切块',
                    '热锅爆香洋葱和蒜',
                    '按难熟程度依次放入食材翻炒',
                    '加水或高汤没过食材，中小火炖煮',
                    '调味后即可享用'
                ],
                tips: '根茎类先放，叶菜类最后放，避免煮烂。'
            },
            {
                name: '蔬菜煎蛋饼',
                tag: '快手菜',
                tagClass: 'tag-quick',
                time: '12 分钟',
                difficulty: '简单',
                desc: '营养早餐，把蔬菜藏在蛋饼里',
                need: ['鸡蛋', '蔬菜', '面粉', '盐', '油'],
                steps: [
                    '蔬菜切碎，鸡蛋打散',
                    '把蔬菜、面粉加入蛋液中搅拌均匀',
                    '平底锅刷油，倒入面糊摊平',
                    '小火煎至两面金黄',
                    '切块装盘'
                ],
                tips: '面糊不要太稀，否则饼不容易成型。'
            }
        ];

        let currentIngredients = [];
        let currentRecipes = [];
        let selectedRecipe = null;

        // DOM 元素
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const previewSection = document.getElementById('preview-section');
        const previewImage = document.getElementById('preview-image');
        const analyzeBtn = document.getElementById('analyze-btn');
        const reuploadBtn = document.getElementById('reupload-btn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const loadingText = document.getElementById('loading-text');
        const loadingSubtext = document.getElementById('loading-subtext');

        // 事件监听
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        reuploadBtn.addEventListener('click', () => {
            previewSection.style.display = 'none';
            uploadArea.style.display = 'block';
            results.style.display = 'none';
            fileInput.value = '';
        });

        analyzeBtn.addEventListener('click', analyzeImage);

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请上传图片文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                uploadArea.style.display = 'none';
                previewSection.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function analyzeImage() {
            previewSection.style.display = 'none';
            loading.style.display = 'block';
            results.style.display = 'none';

            const loadingSteps = [
                { text: 'AI 正在识别食材...', subtext: '正在分析冰箱里的美味潜力' },
                { text: '正在判断食材新鲜度...', subtext: '优先推荐需要尽快食用的食材' },
                { text: '正在匹配最佳菜谱...', subtext: '结合口味、时间和难度生成方案' }
            ];

            let step = 0;
            const interval = setInterval(() => {
                if (step < loadingSteps.length) {
                    loadingText.textContent = loadingSteps[step].text;
                    loadingSubtext.textContent = loadingSteps[step].subtext;
                    step++;
                }
            }, 600);

            setTimeout(() => {
                clearInterval(interval);
                loading.style.display = 'none';
                generateResults();
                results.style.display = 'block';
                results.scrollIntoView({ behavior: 'smooth' });
            }, 2200);
        }

        function generateResults() {
            // 模拟识别结果：随机选取 3-5 个食材
            const allIngredients = Object.keys(ingredientDatabase);
            const count = Math.floor(Math.random() * 3) + 3;
            currentIngredients = [];
            const used = new Set();

            // 确保至少有番茄或鸡蛋这类常见食材
            currentIngredients.push('番茄');
            used.add('番茄');
            currentIngredients.push('鸡蛋');
            used.add('鸡蛋');

            while (currentIngredients.length < count) {
                const random = allIngredients[Math.floor(Math.random() * allIngredients.length)];
                if (!used.has(random)) {
                    currentIngredients.push(random);
                    used.add(random);
                }
            }

            renderIngredients();
            generateRecipes();
            renderRecipes();
        }

        function renderIngredients() {
            const grid = document.getElementById('ingredients-grid');
            grid.innerHTML = '';

            let hasWarning = false;
            currentIngredients.forEach(name => {
                const info = ingredientDatabase[name];
                const item = document.createElement('div');
                item.className = 'ingredient-item';
                item.innerHTML = `
                    <div class="ingredient-icon">${info.icon}</div>
                    <div class="ingredient-name">${name}</div>
                    <div class="ingredient-status ${info.status === 'warning' ? 'status-warning' : 'status-fresh'}">
                        ${info.status === 'warning' ? `⚠️ 建议 ${info.days} 天内吃完` : `✅ 新鲜`}
                    </div>
                `;
                grid.appendChild(item);
                if (info.status === 'warning') hasWarning = true;
            });

            const wasteAlert = document.getElementById('waste-alert');
            if (hasWarning) {
                wasteAlert.classList.add('show');
            } else {
                wasteAlert.classList.remove('show');
            }
        }

        function generateRecipes() {
            currentRecipes = [];
            const added = new Set();

            // 根据识别到的食材匹配菜谱
            currentIngredients.forEach(ingredient => {
                if (recipeDatabase[ingredient]) {
                    recipeDatabase[ingredient].forEach(recipe => {
                        if (!added.has(recipe.name)) {
                            currentRecipes.push(recipe);
                            added.add(recipe.name);
                        }
                    });
                }
            });

            // 如果菜谱不够，补充通用菜谱
            if (currentRecipes.length < 3) {
                fallbackRecipes.forEach(recipe => {
                    if (!added.has(recipe.name) && currentRecipes.length < 3) {
                        currentRecipes.push(recipe);
                        added.add(recipe.name);
                    }
                });
            }
        }

        function renderRecipes() {
            const grid = document.getElementById('recipes-grid');
            grid.innerHTML = '';

            currentRecipes.forEach((recipe, index) => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <span class="recipe-tag ${recipe.tagClass}">${recipe.tag}</span>
                    <h4 class="recipe-name">${recipe.name}</h4>
                    <p class="recipe-desc">${recipe.desc}</p>
                    <div class="recipe-meta">
                        <span>⏱️ ${recipe.time}</span>
                        <span>📊 ${recipe.difficulty}</span>
                    </div>
                `;
                card.addEventListener('click', () => selectRecipe(recipe, card));
                grid.appendChild(card);
            });

            // 默认选中第一个
            if (currentRecipes.length > 0) {
                selectRecipe(currentRecipes[0], grid.children[0]);
            }
        }

        function selectRecipe(recipe, cardElement) {
            selectedRecipe = recipe;

            // 更新选中状态
            document.querySelectorAll('.recipe-card').forEach(c => c.classList.remove('selected'));
            cardElement.classList.add('selected');

            // 显示详情
            document.getElementById('detail-title').textContent = recipe.name;
            
            const ingredientsList = document.getElementById('detail-ingredients');
            ingredientsList.innerHTML = recipe.need.map(item => `<li>${item}</li>`).join('');

            const stepsList = document.getElementById('detail-steps');
            stepsList.innerHTML = recipe.steps.map(step => `<li>${step}</li>`).join('');

            document.getElementById('detail-tips').textContent = recipe.tips;

            const detailSection = document.getElementById('recipe-detail');
            detailSection.classList.add('show');

            // 隐藏购物清单，等待重新生成
            document.getElementById('shopping-list').classList.remove('show');
        }

        document.getElementById('shopping-btn').addEventListener('click', () => {
            if (!selectedRecipe) return;

            const shoppingItems = document.getElementById('shopping-items');
            shoppingItems.innerHTML = '';

            // 模拟购物清单：菜谱需要的但冰箱里识别不到的食材
            const neededItems = selectedRecipe.need.filter(item => {
                return !currentIngredients.includes(item) && 
                       !['油', '盐', '糖', '酱油', '醋', '葱', '蒜', '花椒', '豆瓣酱', '面粉'].includes(item);
            });

            if (neededItems.length === 0) {
                const item = document.createElement('span');
                item.className = 'shopping-item';
                item.textContent = '✅ 食材齐全，可以直接开做！';
                shoppingItems.appendChild(item);
            } else {
                neededItems.forEach(name => {
                    const item = document.createElement('span');
                    item.className = 'shopping-item';
                    item.textContent = name;
                    shoppingItems.appendChild(item);
                });
            }

            document.getElementById('shopping-list').classList.add('show');
            document.getElementById('shopping-list').scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
