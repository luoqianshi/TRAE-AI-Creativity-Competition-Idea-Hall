<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 知识点卡片生成器 · 参赛作品</title>
    <!-- html2canvas 用于截图导出 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        /* 全局重置 & 字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f4f8;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 32px 20px;
            display: flex;
            justify-content: center;
            color: #1e293b;
        }

        .app-container {
            max-width: 1100px;
            width: 100%;
        }

        /* 头部 */
        .app-header {
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .app-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(145deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .app-header h1 small {
            font-size: 16px;
            font-weight: 400;
            background: #e2e8f0;
            color: #1e293b;
            -webkit-text-fill-color: #1e293b;
            background: #e2e8f0;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        .header-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 6px 18px;
            border-radius: 60px;
            font-size: 14px;
            font-weight: 500;
        }

        /* 双栏布局 */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-top: 8px;
        }

        @media (max-width: 780px) {
            .workspace {
                grid-template-columns: 1fr;
                gap: 32px;
            }
            .app-header {
                flex-direction: column;
                align-items: start;
                gap: 12px;
            }
        }

        /* 卡片通用设计 */
        .card-panel {
            background: #ffffff;
            border-radius: 28px;
            padding: 24px 24px 30px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(2px);
        }

        .card-panel h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
        }

        .card-panel h2 span {
            background: #eef2ff;
            color: #4338ca;
            font-size: 13px;
            font-weight: 500;
            padding: 0 14px;
            border-radius: 40px;
            line-height: 26px;
        }

        /* 输入区 */
        .input-area textarea {
            width: 100%;
            height: 200px;
            border: 1.5px solid #e2e8f0;
            border-radius: 18px;
            padding: 16px 18px;
            font-size: 15px;
            line-height: 1.7;
            font-family: inherit;
            resize: vertical;
            transition: border 0.15s, box-shadow 0.15s;
            background: #fafcff;
            color: #0f172a;
        }

        .input-area textarea:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: #ffffff;
        }

        .input-area textarea::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
            align-items: center;
        }

        .btn {
            background: #f1f5f9;
            border: none;
            padding: 10px 26px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 15px;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
        }

        .btn-primary:hover {
            background: #1d4ed8;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.3);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-outline {
            background: transparent;
            border-color: #cbd5e1;
        }

        .btn-outline:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .btn-success {
            background: #059669;
            color: white;
            box-shadow: 0 4px 10px rgba(5, 150, 105, 0.25);
        }

        .btn-success:hover {
            background: #047857;
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        /* 预览区：生成的知识卡片 */
        .preview-area {
            min-height: 320px;
        }

        #cardDisplay {
            background: #ffffff;
            border-radius: 24px;
            padding: 16px 18px 18px;
            border: 1.5px dashed #d1d9e6;
            transition: all 0.2s;
            min-height: 260px;
            position: relative;
        }

        #cardDisplay.populated {
            border-style: solid;
            border-color: #c7d2fe;
            background: #fbfdff;
        }

        .card-placeholder {
            color: #94a3b8;
            text-align: center;
            padding: 50px 12px;
            font-size: 15px;
            line-height: 1.8;
        }

        .card-placeholder span {
            display: block;
            font-size: 42px;
            margin-bottom: 14px;
        }

        /* 知识点卡片样式 (渲染后) */
        .knowledge-card {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 6px 4px 4px;
        }

        .knowledge-card .kc-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.2px;
            color: #0f172a;
            border-left: 5px solid #3b82f6;
            padding-left: 16px;
            margin-bottom: 18px;
        }

        .knowledge-card .kc-sub {
            color: #475569;
            font-size: 14px;
            font-weight: 400;
            margin-left: 6px;
        }

        .knowledge-card .kc-block {
            margin-bottom: 16px;
        }

        .knowledge-card .kc-block .kc-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #6366f1;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .knowledge-card .kc-block .kc-label .dot {
            width: 6px;
            height: 6px;
            background: #818cf8;
            border-radius: 10px;
            display: inline-block;
        }

        .knowledge-card ul {
            list-style: none;
            padding-left: 6px;
        }

        .knowledge-card ul li {
            position: relative;
            padding: 6px 0 6px 26px;
            font-size: 15px;
            line-height: 1.6;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
        }

        .knowledge-card ul li:last-child {
            border-bottom: none;
        }

        .knowledge-card ul li::before {
            content: "▹";
            position: absolute;
            left: 4px;
            color: #3b82f6;
            font-weight: 600;
            font-size: 16px;
        }

        .knowledge-card .kc-tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #eef2f6;
        }

        .knowledge-card .kc-tag {
            background: #eef2ff;
            padding: 2px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            color: #4338ca;
        }

        .export-tip {
            font-size: 13px;
            color: #64748b;
            margin-top: 18px;
            text-align: right;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
        }

        .badge-demo {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 2px 14px;
            font-size: 12px;
            font-weight: 500;
            color: #475569;
        }

        /* loading 动画 */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid #bfdbfe;
            border-top: 2.5px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* 响应式细节 */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .card-panel {
                padding: 18px 16px 24px;
                border-radius: 22px;
            }
            .btn {
                padding: 8px 18px;
                font-size: 14px;
            }
            .app-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- 头部 -->
        <header class="app-header">
            <h1>
                🧠 AI 知识点卡片生成器
                <small>v1.0 · TRAE 创新赛</small>
            </h1>
            <div class="header-badge">📚 学习工作赛道</div>
        </header>

        <!-- 双栏工作区 -->
        <div class="workspace">

            <!-- 左侧：输入面板 -->
            <section class="card-panel input-area">
                <h2>
                    ✍️ 输入学习内容
                    <span>支持文本 / 笔记</span>
                </h2>
                <textarea id="inputText" placeholder="在这里粘贴你的课堂笔记、课件内容或复习资料……&#10;&#10;例如：&#10;人工智能（AI）是计算机科学的一个分支，致力于创建能够执行通常需要人类智能的任务的系统。机器学习（ML）是AI的一个子集，通过数据学习模式。深度学习（DL）是ML的一个子集，使用神经网络。监督学习使用标记数据，无监督学习使用未标记数据。强化学习通过奖励信号学习。应用包括图像识别、NLP、自动驾驶。">人工智能（AI）是计算机科学的一个分支，致力于创建能够执行通常需要人类智能的任务的系统。机器学习（ML）是AI的一个子集，通过数据学习模式。深度学习（DL）是ML的一个子集，使用神经网络。监督学习使用标记数据，无监督学习使用未标记数据。强化学习通过奖励信号学习。应用包括图像识别、NLP、自动驾驶。</textarea>

                <div class="action-bar">
                    <button class="btn btn-primary" id="generateBtn">
                        ⚡ 生成知识卡片
                    </button>
                    <button class="btn btn-outline" id="resetBtn">
                        ↺ 重置
                    </button>
                    <button class="btn btn-success" id="exportBtn" disabled>
                        🖼️ 导出为图片
                    </button>
                    <span style="margin-left:auto; font-size:13px; color:#94a3b8;" id="wordCount">0 字</span>
                </div>
                <div style="margin-top: 12px; font-size:13px; color:#94a3b8; display: flex; gap: 8px; flex-wrap:wrap;">
                    <span>💡 输入至少10个字，AI将自动提取核心知识点</span>
                </div>
            </section>

            <!-- 右侧：预览面板 (知识卡片) -->
            <section class="card-panel preview-area">
                <h2>
                    📇 知识卡片预览
                    <span class="badge-demo" id="statusBadge">等待生成</span>
                </h2>
                <div id="cardDisplay">
                    <!-- 占位内容 (js 会替换) -->
                    <div class="card-placeholder" id="placeholder">
                        <span>📖</span>
                        输入学习内容，点击「生成知识卡片」<br />
                        AI 将自动提取核心知识点，形成结构化卡片
                    </div>
                    <!-- 动态渲染卡片插入到这里 -->
                    <div id="cardContent" style="display: none;"></div>
                </div>
                <div class="export-tip">
                    ⬇️ 导出图片可保存为 PNG，方便打印或分享
                </div>
            </section>

        </div><!-- /workspace -->

        <!-- 底部信息 (参赛必需) -->
        <div style="margin-top: 36px; padding: 20px 0 8px; border-top: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 14px; color: #64748b;">
            <div>
                <strong>🏷️ 标签：</strong> 学习工作 · AI 知识卡片 · 效率工具
            </div>
            <div>
                <strong>🧩 创意ID：</strong> TRAE-2026-学习工作-卡片生成器
            </div>
            <div>
                <strong>⚙️ 生成模式：</strong> TRAE Work · Auto
            </div>
        </div>

    </div>

    <script>
        (function() {
            // DOM 元素
            const inputText = document.getElementById('inputText');
            const generateBtn = document.getElementById('generateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const exportBtn = document.getElementById('exportBtn');
            const cardDisplay = document.getElementById('cardDisplay');
            const cardContent = document.getElementById('cardContent');
            const placeholder = document.getElementById('placeholder');
            const statusBadge = document.getElementById('statusBadge');
            const wordCount = document.getElementById('wordCount');

            // 内部状态
            let currentCardHTML = '';
            let isGenerating = false;

            // ---------- 辅助函数 ----------
            function updateWordCount() {
                const raw = inputText.value.trim();
                const count = raw.length;
                wordCount.textContent = count + ' 字';
                return count;
            }

            // 模拟 AI 知识点提取 (基于规则 + 关键词)
            function extractKnowledge(text) {
                // 清洗
                const clean = text.replace(/\s+/g, ' ').trim();
                if (clean.length < 5) {
                    return {
                        title: '输入内容过短',
                        points: ['请至少输入10个字符，以便AI提取知识点。'],
                        tags: ['提示']
                    };
                }

                // 尝试检测 "AI" 相关领域关键词 (丰富展示)
                const hasAI = /人工智能|AI|机器学习|深度学习|神经网络|监督学习|无监督学习|强化学习|NLP|计算机视觉/i.test(
                clean);
                const hasMath = /算法|模型|数据|训练|测试|损失函数|梯度/i.test(clean);
                const hasApp = /应用|识别|生成|分类|回归|预测/i.test(clean);

                // 按句子拆分，提取有意义的片段
                const sentences = clean.split(/[。；\n.!?，,、]/).filter(s => s.trim().length > 4);

                // 如果句子太少，用关键词拆解
                let keyPoints = [];
                if (sentences.length >= 2) {
                    // 取前3~5个短句作为知识点
                    keyPoints = sentences.slice(0, 5).map(s => s.trim());
                } else {
                    // 按逗号/空格拆分
                    const parts = clean.split(/[,，、\s]+/).filter(p => p.length > 2);
                    if (parts.length > 3) {
                        keyPoints = parts.slice(0, 6).map(p => p.trim());
                    } else {
                        keyPoints = [clean.substring(0, 40) + (clean.length > 40 ? '…' : '')];
                    }
                }

                // 去重
                keyPoints = [...new Set(keyPoints)];

                // 生成标题 (提取第一个核心名词)
                let title = '核心知识点';
                const titleKeywords = ['人工智能', '机器学习', '深度学习', '神经网络', '数据科学', '算法', '编程', '计算机', '数学', '物理', '化学', '生物',
                    '历史', '文学', '经济', '管理'
                ];
                for (let kw of titleKeywords) {
                    if (clean.includes(kw)) {
                        title = kw + ' 知识框架';
                        break;
                    }
                }
                // 如果包含 "AI"
                if (hasAI && !title.includes('AI')) title = 'AI 核心概念';

                // 生成标签
                let tags = ['学习卡片', '知识点'];
                if (hasAI) tags.push('人工智能');
                if (hasMath) tags.push('算法');
                if (hasApp) tags.push('应用场景');
                if (clean.length > 30) tags.push('结构化笔记');
                tags = tags.slice(0, 4);

                return {
                    title: title,
                    points: keyPoints.length > 0 ? keyPoints : ['（AI 未能提取足够知识点，请检查输入内容）'],
                    tags: tags,
                };
            }

            // 渲染知识卡片 HTML
            function renderCard(data) {
                if (!data || !data.points || data.points.length === 0) {
                    return `<div style="padding:30px; color:#94a3b8; text-align:center;">⚠️ 无法生成知识点，请调整输入内容</div>`;
                }

                let pointsHtml = '<ul>';
                data.points.forEach(p => {
                    pointsHtml += `<li>${escapeHtml(p)}</li>`;
                });
                pointsHtml += '</ul>';

                let tagsHtml = '';
                if (data.tags && data.tags.length > 0) {
                    tagsHtml = '<div class="kc-tag-group">' +
                        data.tags.map(t => `<span class="kc-tag">#${escapeHtml(t)}</span>`).join('') +
                        '</div>';
                }

                return `
                    <div class="knowledge-card">
                        <div class="kc-title">
                            ${escapeHtml(data.title)}
                            <span class="kc-sub">· AI 自动生成</span>
                        </div>
                        <div class="kc-block">
                            <div class="kc-label"><span class="dot"></span> 核心知识点</div>
                            ${pointsHtml}
                        </div>
                        ${tagsHtml}
                        <div style="margin-top:14px; font-size:12px; color:#94a3b8; display:flex; gap:12px; border-top:1px solid #f1f5f9; padding-top:14px;">
                            <span>📅 生成时间: ${new Date().toLocaleString()}</span>
                            <span>⚡ TRAE Work</span>
                        </div>
                    </div>
                `;
            }

            // 简单防 XSS
            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // 更新 UI 显示卡片
            function displayCard(html) {
                if (!html || html.trim() === '') {
                    placeholder.style.display = 'block';
                    cardContent.style.display = 'none';
                    cardContent.innerHTML = '';
                    cardDisplay.classList.remove('populated');
                    statusBadge.textContent = '等待生成';
                    exportBtn.disabled = true;
                    return;
                }
                placeholder.style.display = 'none';
                cardContent.style.display = 'block';
                cardContent.innerHTML = html;
                cardDisplay.classList.add('populated');
                statusBadge.textContent = '✅ 已生成';
                exportBtn.disabled = false;
                currentCardHTML = html;
            }

            // 重置
            function resetAll() {
                if (isGenerating) return;
                inputText.value = '';
                updateWordCount();
                displayCard('');
                statusBadge.textContent = '已重置';
                exportBtn.disabled = true;
                currentCardHTML = '';
                // 恢复占位
                placeholder.style.display = 'block';
                cardContent.style.display = 'none';
                cardDisplay.classList.remove('populated');
            }

            // ---------- 生成主流程 ----------
            function handleGenerate() {
                if (isGenerating) return;
                const raw = inputText.value.trim();
                if (raw.length < 5) {
                    alert('请至少输入5个字符的学习内容，以便AI提取知识点。');
                    return;
                }

                // 开始生成 (模拟AI)
                isGenerating = true;
                generateBtn.disabled = true;
                generateBtn.innerHTML = `<span class="spinner"></span> AI 提取中…`;
                statusBadge.textContent = '⏳ 分析中';

                // 模拟异步AI处理 (800ms)
                setTimeout(() => {
                    try {
                        const extracted = extractKnowledge(raw);
                        const html = renderCard(extracted);
                        displayCard(html);
                        statusBadge.textContent = '✅ 生成完成';
                    } catch (e) {
                        console.error(e);
                        statusBadge.textContent = '⚠️ 生成失败';
                        alert('生成失败，请稍后重试。');
                    } finally {
                        isGenerating = false;
                        generateBtn.disabled = false;
                        generateBtn.innerHTML = '⚡ 生成知识卡片';
                        updateWordCount();
                    }
                }, 750);
            }

            // ---------- 导出为图片 (使用 html2canvas) ----------
            function exportCardImage() {
                if (exportBtn.disabled) return;
                const target = document.getElementById('cardContent');
                if (!target || target.children.length === 0) {
                    alert('没有可导出的卡片，请先生成。');
                    return;
                }

                // 临时优化导出样式
                exportBtn.disabled = true;
                exportBtn.textContent = '⏳ 导出中…';

                html2canvas(target, {
                    scale: 2.0,
                    backgroundColor: '#ffffff',
                    allowTaint: false,
                    useCORS: true,
                    logging: false,
                    borderRadius: '24px',
                    padding: 20,
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `知识卡片_${new Date().toISOString().slice(0,10)}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    exportBtn.disabled = false;
                    exportBtn.textContent = '🖼️ 导出为图片';
                }).catch(err => {
                    console.error('导出失败:', err);
                    alert('导出图片失败，可尝试截图保存。');
                    exportBtn.disabled = false;
                    exportBtn.textContent = '🖼️ 导出为图片';
                });
            }

            // ---------- 事件绑定 ----------
            generateBtn.addEventListener('click', handleGenerate);

            resetBtn.addEventListener('click', resetAll);

            exportBtn.addEventListener('click', exportCardImage);

            inputText.addEventListener('input', function() {
                updateWordCount();
                // 如果内容为空，自动重置卡片显示（但不清除已生成的卡片）
                if (this.value.trim() === '') {
                    // 如果当前卡片存在，保留；但如果是空，不强制清除，让用户自行点击重置。
                }
            });

            // 快捷键: Ctrl+Enter 生成
            inputText.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    handleGenerate();
                }
            });

            // 初始化字数
            updateWordCount();
            // 默认预置内容，自动生成一次，让参赛展示更直观
            window.addEventListener('load', function() {
                // 延迟一点点让页面渲染完成
                setTimeout(() => {
                    if (inputText.value.trim().length > 5) {
                        handleGenerate();
                    }
                }, 300);
            });

        })();
    </script>

</body>
</html>
