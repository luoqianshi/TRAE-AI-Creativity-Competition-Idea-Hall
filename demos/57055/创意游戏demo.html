<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感收集者 - 创意小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .game-container {
            position: relative;
            width: 90vw;
            max-width: 600px;
            height: 80vh;
            max-height: 700px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .timer-board {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 20;
            transition: opacity 0.5s;
        }
        
        .game-over-screen {
            opacity: 0;
            pointer-events: none;
        }
        
        .game-over-screen.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .start-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .title {
            font-size: 36px;
            color: #FFD700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        
        .subtitle {
            font-size: 16px;
            color: white;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            color: #333;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255,215,0,0.6);
        }
        
        .final-score {
            font-size: 48px;
            color: #FFD700;
            margin: 20px 0;
        }
        
        .idea-icons {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            color: rgba(255,255,255,0.6);
            font-size: 24px;
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .particle {
            position: absolute;
            color: rgba(255,255,255,0.3);
            font-size: 20px;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        
        .combo-text {
            position: absolute;
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            pointer-events: none;
            animation: comboAnim 1s forwards;
        }
        
        @keyframes comboAnim {
            0% { transform: scale(0.5) translateY(0); opacity: 1; }
            100% { transform: scale(1.2) translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-overlay">
            <div class="score-board">灵感值: <span id="score">0</span></div>
            <div class="timer-board">时间: <span id="timer">60</span>s</div>
        </div>
        
        <div class="start-screen" id="startScreen">
            <div class="title">灵感收集者</div>
            <div class="subtitle">
                移动鼠标/手指控制光点<br>
                收集飘落的灵感符号<br>
                在60秒内收集尽可能多的灵感吧！
            </div>
            <button class="btn" onclick="startGame()">开始游戏</button>
            <div class="idea-icons">
                <span>💡</span><span>⭐</span><span>🎨</span><span>💎</span><span>🔥</span>
            </div>
        </div>
        
        <div class="game-over-screen" id="gameOverScreen">
            <div class="title">游戏结束</div>
            <div class="final-score" id="finalScore">0</div>
            <div class="subtitle" id="finalMsg">你的创意值爆表了！</div>
            <button class="btn" onclick="startGame()">再玩一次</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置canvas尺寸
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 游戏状态
        let gameRunning = false;
        let score = 0;
        let timeLeft = 60;
        let combo = 0;
        let comboTimer = null;
        
        // 玩家
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 20,
            color: '#FFD700',
            trail: []
        };
        
        // 灵感物品
        const items = [];
        const itemTypes = [
            { emoji: '💡', score: 10, color: '#FFD700' },
            { emoji: '⭐', score: 20, color: '#FFA500' },
            { emoji: '🎨', score: 30, color: '#FF69B4' },
            { emoji: '💎', score: 50, color: '#00CED1' },
            { emoji: '🔥', score: 15, color: '#FF4500' },
            { emoji: '✨', score: 25, color: '#9370DB' }
        ];
        
        // 粒子效果
        const particles = [];
        
        // 背景星星
        const stars = [];
        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 1,
                speed: Math.random() * 0.5 + 0.1,
                opacity: Math.random() * 0.5 + 0.2
            });
        }
        
        // 鼠标/触摸控制
        function updatePlayerPosition(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            player.x = clientX - rect.left;
            player.y = clientY - rect.top;
        }
        
        canvas.addEventListener('mousemove', (e) => {
            if (gameRunning) updatePlayerPosition(e.clientX, e.clientY);
        });
        
        canvas.addEventListener('touchmove', (e) => {
            if (gameRunning) {
                e.preventDefault();
                updatePlayerPosition(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });
        
        // 生成灵感物品
        function spawnItem() {
            const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
            items.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                size: 30,
                speed: Math.random() * 2 + 1,
                type: type,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.05,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: 0.03
            });
        }
        
        // 创建粒子
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        // 显示combo文字
        function showCombo(x, y, text) {
            const el = document.createElement('div');
            el.className = 'combo-text';
            el.textContent = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.querySelector('.game-container').appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }
        
        // 开始游戏
        function startGame() {
            gameRunning = true;
            score = 0;
            timeLeft = 60;
            combo = 0;
            items.length = 0;
            particles.length = 0;
            player.trail = [];
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.remove('show');
            document.getElementById('score').textContent = score;
            document.getElementById('timer').textContent = timeLeft;
            
            // 倒计时
            const timerInterval = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(timerInterval);
                    return;
                }
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                    clearInterval(timerInterval);
                }
            }, 1000);
        }
        
        // 结束游戏
        function endGame() {
            gameRunning = false;
            document.getElementById('gameOverScreen').classList.add('show');
            document.getElementById('finalScore').textContent = score;
            
            let msg = '';
            if (score >= 1000) msg = '创意大师！你的灵感值爆表了！🔥';
            else if (score >= 500) msg = '很有创意！继续保持！⭐';
            else if (score >= 200) msg = '不错的开始，再试一次吧！💡';
            else msg = '灵感还在酝酿中，再玩一次！🌱';
            document.getElementById('finalMsg').textContent = msg;
        }
        
        // 游戏循环
        let lastTime = 0;
        let spawnTimer = 0;
        
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景星星
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
                ctx.globalAlpha = star.opacity;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            if (gameRunning) {
                // 生成物品
                spawnTimer += deltaTime;
                if (spawnTimer > 800) {
                    spawnItem();
                    spawnTimer = 0;
                }
                
                // 玩家拖尾
                player.trail.push({ x: player.x, y: player.y, life: 1 });
                if (player.trail.length > 15) player.trail.shift();
                
                // 绘制拖尾
                player.trail.forEach((p, i) => {
                    p.life -= 0.05;
                    if (p.life > 0) {
                        ctx.globalAlpha = p.life * 0.5;
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, player.radius * (1 - i/player.trail.length) * 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                ctx.globalAlpha = 1;
                
                // 绘制玩家
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#FFD700';
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // 绘制玩家内核
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
                
                // 更新和绘制物品
                for (let i = items.length - 1; i >= 0; i--) {
                    const item = items[i];
                    item.y += item.speed;
                    item.rotation += item.rotationSpeed;
                    item.wobble += item.wobbleSpeed;
                    item.x += Math.sin(item.wobble) * 0.5;
                    
                    // 绘制物品
                    ctx.save();
                    ctx.translate(item.x, item.y);
                    ctx.rotate(item.rotation);
                    ctx.font = `${item.size}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = item.type.color;
                    ctx.fillText(item.type.emoji, 0, 0);
                    ctx.shadowBlur = 0;
                    ctx.restore();
                    
                    // 碰撞检测
                    const dx = player.x - item.x;
                    const dy = player.y - item.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < player.radius + item.size / 2) {
                        // 收集物品
                        combo++;
                        const comboMultiplier = Math.min(combo, 5);
                        const points = item.type.score * comboMultiplier;
                        score += points;
                        document.getElementById('score').textContent = score;
                        
                        createParticles(item.x, item.y, item.type.color);
                        
                        if (combo > 1) {
                            showCombo(item.x, item.y, `${combo}x 连击! +${points}`);
                        }
                        
                        // 重置combo计时器
                        if (comboTimer) clearTimeout(comboTimer);
                        comboTimer = setTimeout(() => { combo = 0; }, 2000);
                        
                        items.splice(i, 1);
                    } else if (item.y > canvas.height + 30) {
                        items.splice(i, 1);
                    }
                }
                
                // 更新和绘制粒子
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    p.vy += 0.1;
                    
                    if (p.life > 0) {
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        particles.splice(i, 1);
                    }
                }
                ctx.globalAlpha = 1;
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
