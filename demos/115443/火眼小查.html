<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>火眼小查｜家庭消防隐患快查</title>
  <style>
    :root {
      --bg-primary: #FAF9F7;
      --bg-card: #FFFFFF;
      --text-primary: #2D2D2D;
      --text-secondary: #6C757D;
      --accent-warm: #FF6B4A;
      --accent-cool: #4A7FB7;
      --border-light: #EAEAEA;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
      --radius-lg: 16px;
      --radius-md: 12px;
      --space-xs: 8px;
      --space-sm: 16px;
      --space-md: 24px;
      --space-lg: 32px;
      --font-title: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --font-body: "Helvetica Neue", Arial, sans-serif;
    }

    .dark-theme {
      --bg-primary: #1E1E1E;
      --bg-card: #2D2D2D;
      --text-primary: #F5F5F5;
      --text-secondary: #A9A9A9;
      --border-light: #444;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
      padding-bottom: var(--space-lg);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 var(--space-sm);
    }

    /* Header */
    header {
      padding: var(--space-lg) 0 var(--space-md);
      text-align: center;
    }

    h1 {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: var(--space-xs);
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: var(--space-md);
      right: var(--space-md);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      z-index: 100;
      transition: all 0.3s;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-md);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    /* Hero Card */
    .hero-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      box-shadow: var(--shadow-md);
      margin-bottom: var(--space-lg);
      text-align: center;
    }

    .hero-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: var(--space-sm);
      color: var(--text-primary);
    }

    .hero-desc {
      color: var(--text-secondary);
      margin-bottom: var(--space-lg);
      font-size: 0.95rem;
    }

    .capture-btn {
      background: var(--accent-warm);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(255, 107, 74, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .capture-btn:hover {
      background: #e05a3a;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 107, 74, 0.35);
    }

    .capture-btn:active {
      transform: translateY(0);
    }

    /* Preview Section */
    .preview-section {
      margin-bottom: var(--space-lg);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--space-md);
      text-align: center;
    }

    .preview-container {
      position: relative;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      aspect-ratio: 4/3;
      margin-bottom: var(--space-md);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--border-light);
    }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.95;
    }

    .highlight-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 40%, rgba(255, 107, 74, 0.15) 0%, transparent 60%);
    }

    .highlight-box {
      position: absolute;
      border: 3px solid var(--accent-warm);
      border-radius: 4px;
      box-shadow: 0 0 0 4px rgba(255, 107, 74, 0.25);
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .alert-text {
      background: var(--accent-warm);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: var(--space-sm);
      display: inline-block;
      max-width: 90%;
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.4;
      box-shadow: 0 4px 12px rgba(255, 107, 74, 0.25);
    }

    /* Category Slider */
    .category-slider {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      justify-content: center;
      margin: var(--space-md) 0;
    }

    .category-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .category-btn.active {
      background: var(--accent-cool);
      color: white;
      border-color: var(--accent-cool);
    }

    .category-btn:hover:not(.active) {
      background: rgba(74, 127, 183, 0.08);
    }

    /* Tips Card */
    .tips-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      box-shadow: var(--shadow-md);
      margin-top: var(--space-lg);
      border-left: 4px solid var(--accent-cool);
    }

    .tips-title {
      font-weight: 600;
      margin-bottom: var(--space-sm);
      color: var(--accent-cool);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tips-list {
      padding-left: 0;
      list-style: none;
    }

    .tips-list li {
      margin-bottom: var(--space-xs);
      padding-left: 24px;
      position: relative;
      font-size: 0.95rem;
    }

    .tips-list li::before {
      content: "•";
      color: var(--accent-warm);
      position: absolute;
      left: 0;
      font-weight: bold;
    }

    /* Footer */
    footer {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin-top: var(--space-lg);
      padding-top: var(--space-md);
      border-top: 1px solid var(--border-light);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 0 var(--space-xs);
      }

      h1 {
        font-size: 1.5rem;
      }

      .hero-card {
        padding: var(--space-md);
      }

      .preview-container {
        aspect-ratio: 3/4;
      }

      .capture-btn {
        padding: 10px 24px;
        font-size: 0.95rem;
      }
    }

    /* Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>

          <li>电暖器旁1米内放易燃物 → 热辐射引燃</li>
        </ul>
      </section>
    </main>
