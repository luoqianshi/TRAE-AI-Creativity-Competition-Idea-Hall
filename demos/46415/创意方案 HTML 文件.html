<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智记汇 - 小程序仿真界面演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Microsoft YaHei}
body{background:#efefef;padding:20px;display:flex;justify-content:center}
.phone{width:375px;background:#fff;border-radius:30px;overflow:hidden;border:8px solid #222;height:720px;display:flex;flex-direction:column}
.top-bar{height:44px;background:#2563eb;color:#fff;text-align:center;line-height:44px;font-weight:bold}
.tab-bar{height:50px;border-top:1px solid #eee;display:flex}
.tab-item{flex:1;text-align:center;line-height:50px;color:#666;font-size:13px}
.tab-item.active{color:#2563eb}
.main{flex:1;padding:16px;overflow-y:auto}
.upload-box{border:2px dashed #cad7f2;border-radius:12px;padding:30px;text-align:center;margin-bottom:16px}
.btn{background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:8px;margin:6px}
.note-card{background:#f5f8ff;border-radius:10px;padding:14px;margin-bottom:12px}
.title{font-weight:bold;margin-bottom:8px;color:#113277}
.mind-map{background:#f0f6ff;padding:12px;border-radius:8px;margin:10px 0;font-size:14px}
.question-box{background:#fff8e8;padding:12px;border-radius:8px;margin-top:10px}
</style>
</head>
<body>
<div class="phone">
    <div class="top-bar">智记汇 AI笔记整理</div>
    <div class="main">
        <div class="upload-box">
            <p>上传录音 / 板书图片 / 文字素材</p>
            <button class="btn">上传音频</button>
            <button class="btn">上传图片</button>
        </div>
        <button class="btn" style="width:100%">一键AI生成结构化笔记</button>

        <div class="note-card">
            <div class="title">《高数第一章 函数》AI整理笔记</div>
            <p>一、核心定义</p>
            <p>1. 定义域：自变量取值范围</p>
            <p>2. 值域：对应因变量全部取值</p>
            <p>二、必考题型</p>
            <p>求复合函数定义域、分段函数求值</p>
            <div class="mind-map">
思维导图：函数→定义域/值域→复合函数→经典例题
            </div>
            <div class="question-box">
自测填空：已知y=√(x-2)，定义域为____
            </div>
        </div>

        <div class="note-card">
            <div class="title">考研英语阅读复盘笔记</div>
            <p>高频生词、逻辑转折词、错误选项特征自动汇总</p>
        </div>
    </div>
    <div class="tab-bar">
        <div class="tab-item active">首页</div>
        <div class="tab-item">我的笔记</div>
        <div class="tab-item">题库</div>
        <div class="tab-item">设置</div>
    </div>
</div>
</body>
</html>
