<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票策略提示词生成器 - 原型演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 8px;
            font-size: 28px;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }
        .subtitle {
            text-align: center;
            color: #8892b0;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        .card:has(.stock-select-wrapper) {
            z-index: 100;
        }
        .card-title {
            font-size: 18px;
            color: #00d4ff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: #00d4ff;
            border-radius: 2px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 14px;
            color: #a8b2d1;
            font-weight: 500;
        }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="date"] {
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: #e0e0e0;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
            font-family: inherit;
        }
        .form-group input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
        }
        .form-group input::placeholder {
            color: #5a6680;
        }
        .form-group input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
            cursor: pointer;
        }
        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        .radio-item:hover {
            border-color: rgba(0, 212, 255, 0.5);
        }
        .radio-item input[type="radio"] {
            accent-color: #00d4ff;
            cursor: pointer;
        }
        .radio-item:has(input:checked) {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
            flex: 1;
            justify-content: center;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }
        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .output-section {
            margin-top: 24px;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .output-title {
            font-size: 16px;
            color: #00d4ff;
        }
        .copy-hint {
            font-size: 13px;
            color: #5a6680;
        }
        textarea#output {
            width: 100%;
            min-height: 300px;
            padding: 16px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.8;
            resize: vertical;
            font-family: "Consolas", "Monaco", monospace;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 24px;
            background: #00d4ff;
            color: #1a1a2e;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(0);
        }
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) {
            .two-col {
                grid-template-columns: 1fr;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .stock-select-wrapper {
            position: relative;
            z-index: 1000;
        }
        .stock-input-row {
            position: relative;
            display: flex;
            align-items: center;
        }
        .stock-input-row input {
            flex: 1;
            padding-right: 40px !important;
        }
        .stock-clear-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            color: #5a6680;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            display: none;
            line-height: 1;
        }
        .stock-clear-btn:hover {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        .stock-clear-btn.visible {
            display: block;
        }
        .stock-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 240px;
            overflow-y: auto;
            background: rgba(30, 30, 50, 0.98);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            margin-top: 4px;
            z-index: 1001;
            display: none;
            backdrop-filter: blur(10px);
        }
        .stock-dropdown.show {
            display: block;
        }
        .stock-dropdown-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }
        .stock-dropdown-item:hover {
            background: rgba(0, 212, 255, 0.15);
        }
        .stock-dropdown-item:last-child {
            border-bottom: none;
        }
        .stock-dropdown-item .stock-name {
            color: #e0e0e0;
        }
        .stock-dropdown-item .stock-code {
            color: #8892b0;
            font-size: 13px;
            font-family: monospace;
        }
        .stock-dropdown-empty {
            padding: 14px;
            text-align: center;
            color: #5a6680;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 股票策略提示词生成器</h1>
        <p class="subtitle">填入技术指标与持仓信息，一键生成 AI 分析提示词</p>

        <div class="card">
            <div class="card-title">基本信息</div>
            <div class="form-grid">
                <div class="form-group stock-select-wrapper" style="grid-column: 1 / -1;">
                    <label>股票代码 / 名称</label>
                    <div class="stock-input-row">
                        <input type="text" id="stockInput" placeholder="如: 600519 或 贵州茅台" oninput="parseStockInput()" onfocus="showStockDropdown()">
                        <button type="button" class="stock-clear-btn" id="stockClearBtn" onclick="clearStockSelection()" title="清空选择">✕</button>
                    </div>
                    <input type="hidden" id="stockCode">
                    <input type="hidden" id="stockName">
                    <div id="stockParseHint" style="font-size: 12px; color: #5a6680; margin-top: 4px;"></div>
                    <div id="stockDropdown" class="stock-dropdown"></div>
                </div>
                <div class="form-group">
                    <label>当前股价</label>
                    <input type="number" id="currentPrice" placeholder="如: 1688.88" step="0.01">
                </div>
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="tradeDate">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">持仓信息</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>持仓股数</label>
                    <input type="number" id="holdShares" placeholder="如: 1000">
                </div>
                <div class="form-group">
                    <label>成本价</label>
                    <input type="number" id="costPrice" placeholder="如: 1500.00" step="0.01">
                </div>
                <div class="form-group">
                    <label>当前盈亏(%)</label>
                    <input type="number" id="profitPct" placeholder="自动计算或手动输入" step="0.01">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">RSI 指标</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>RSI 6日值</label>
                    <input type="number" id="rsi6" placeholder="如: 65.5" step="0.01">
                </div>
                <div class="form-group">
                    <label>RSI 14日值</label>
                    <input type="number" id="rsi14" placeholder="如: 58.3" step="0.01">
                </div>
                <div class="form-group">
                    <label>RSI 状态</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="rsiStatus" value="金叉📈中"> 金叉📈中
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="rsiStatus" value="死叉📉中"> 死叉📉中
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="rsiStatus" value="即将金叉"> 即将金叉
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="rsiStatus" value="即将死叉"> 即将死叉
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">KDJ 指标</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>K 值</label>
                    <input type="number" id="kdjK" placeholder="如: 75.2" step="0.01">
                </div>
                <div class="form-group">
                    <label>D 值</label>
                    <input type="number" id="kdjD" placeholder="如: 68.5" step="0.01">
                </div>
                <div class="form-group">
                    <label>J 值</label>
                    <input type="number" id="kdjJ" placeholder="如: 88.6" step="0.01">
                </div>
                <div class="form-group">
                    <label>KDJ 状态</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="kdjStatus" value="金叉📈中"> 金叉📈中
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="kdjStatus" value="死叉📉中"> 死叉📉中
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="kdjStatus" value="即将金叉"> 即将金叉
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="kdjStatus" value="即将死叉"> 即将死叉
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">MACD 指标</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>MACD 柱状线</label>
                    <input type="number" id="macdBar" placeholder="如: 0.23" step="0.001">
                </div>
                <div class="form-group">
                    <label>DIFF 值</label>
                    <input type="number" id="macdDiff" placeholder="如: 0.85" step="0.001">
                </div>
                <div class="form-group">
                    <label>DEA 值</label>
                    <input type="number" id="macdDea" placeholder="如: 0.62" step="0.001">
                </div>
                <div class="form-group">
                    <label>MACD 状态</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="macdStatus" value="金叉📈中"> 金叉📈中
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="macdStatus" value="死叉📉中"> 死叉📉中
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="macdStatus" value="即将金叉"> 即将金叉
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="macdStatus" value="即将死叉"> 即将死叉
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>MACD动能柱状态</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="macdBarStatus" value="放量"> 放量
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="macdBarStatus" value="缩量"> 缩量
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="macdBarStatus" value="持平"> 持平
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">成交量指标</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>成交量柱颜色</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="barColor" value="红柱"> 红柱
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="barColor" value="绿柱"> 绿柱
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>成交量状态</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="barVolume" value="放量"> 放量
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="barVolume" value="缩量"> 缩量
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="barVolume" value="持平"> 持平
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">其他信息（可选）</div>
            <div class="form-grid">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>补充说明 / 市场环境 / 个人判断</label>
                    <input type="text" id="extraInfo" placeholder="如: 大盘今日上涨2%，板块轮动明显...">
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="generatePrompt()">🚀 生成 AI 提示词</button>
            <button class="btn btn-secondary" onclick="copyToClipboard()">📋 一键复制</button>
            <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空数据</button>
        </div>

        <div class="output-section card">
            <div class="output-header">
                <span class="output-title">📤 生成的提示词（可直接粘贴到 AI 助手）</span>
                <span class="copy-hint">点击"一键复制"后粘贴到 AI 助手进行分析</span>
            </div>
            <textarea id="output" placeholder="点击"生成 AI 提示词"后，内容将显示在这里..."></textarea>
        </div>
    </div>

    <div class="toast" id="toast">已复制到剪贴板！</div>

    <script>
        document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];

        const stockList = [
            {name: '贵州茅台', code: '600519'},
            {name: '招商银行', code: '600036'},
            {name: '比亚迪', code: '002594'},
            {name: '宁德时代', code: '300750'},
            {name: '中国平安', code: '601318'},
            {name: '五粮液', code: '000858'},
            {name: '腾讯控股', code: 'H00700'},
            {name: '阿里巴巴', code: 'H09988'}
        ];

        function parseStockInput() {
            const input = document.getElementById('stockInput').value.trim();
            const hint = document.getElementById('stockParseHint');
            const codeField = document.getElementById('stockCode');
            const nameField = document.getElementById('stockName');

            if (!input) {
                hint.textContent = '';
                codeField.value = '';
                nameField.value = '';
                showStockDropdown();
                return;
            }

            const isCode = /^\d+$/.test(input);
            const isUSCode = /^[A-Za-z]+$/.test(input);

            if (isCode || isUSCode) {
                codeField.value = input;
                nameField.value = '';
                hint.textContent = `已识别为股票代码: ${input}`;
                hint.style.color = '#00d4ff';
            } else {
                codeField.value = '';
                nameField.value = input;
                hint.textContent = `已识别为股票名称: ${input}`;
                hint.style.color = '#00d4ff';
            }

            filterStockDropdown(input);
        }

        function showStockDropdown() {
            const dropdown = document.getElementById('stockDropdown');
            const input = document.getElementById('stockInput').value.trim();
            filterStockDropdown(input);
            dropdown.classList.add('show');
        }

        function filterStockDropdown(keyword) {
            const dropdown = document.getElementById('stockDropdown');
            let filtered = stockList;

            if (keyword) {
                const lowerKeyword = keyword.toLowerCase();
                filtered = stockList.filter(s =>
                    s.name.includes(keyword) ||
                    s.code.toLowerCase().includes(lowerKeyword)
                );
            }

            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="stock-dropdown-empty">无匹配股票</div>';
            } else {
                dropdown.innerHTML = filtered.map(s => `
                    <div class="stock-dropdown-item" onclick="selectStock('${s.code}', '${s.name}')">
                        <span class="stock-name">${s.name}</span>
                        <span class="stock-code">${s.code}</span>
                    </div>
                `).join('');
            }
        }

        function selectStock(code, name) {
            document.getElementById('stockInput').value = `${name} (${code})`;
            document.getElementById('stockCode').value = code;
            document.getElementById('stockName').value = name;
            document.getElementById('stockParseHint').textContent = `已选择: ${name} ${code}`;
            document.getElementById('stockParseHint').style.color = '#00d4ff';
            document.getElementById('stockDropdown').classList.remove('show');
            document.getElementById('stockClearBtn').classList.add('visible');
        }

        function clearStockSelection() {
            document.getElementById('stockInput').value = '';
            document.getElementById('stockCode').value = '';
            document.getElementById('stockName').value = '';
            document.getElementById('stockParseHint').textContent = '';
            document.getElementById('stockClearBtn').classList.remove('visible');
            showStockDropdown();
            document.getElementById('stockInput').focus();
        }

        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.stock-select-wrapper');
            if (!wrapper.contains(e.target)) {
                document.getElementById('stockDropdown').classList.remove('show');
            }
        });

        function calcProfit() {
            const current = parseFloat(document.getElementById('currentPrice').value);
            const cost = parseFloat(document.getElementById('costPrice').value);
            if (current && cost) {
                const profit = ((current - cost) / cost * 100).toFixed(2);
                document.getElementById('profitPct').value = profit;
            }
        }
        document.getElementById('currentPrice').addEventListener('input', calcProfit);
        document.getElementById('costPrice').addEventListener('input', calcProfit);

        function getRadioValue(name) {
            const radios = document.getElementsByName(name);
            for (let r of radios) {
                if (r.checked) return r.value;
            }
            return '未选择';
        }

        function generatePrompt() {
            const stockCode = document.getElementById('stockCode').value || '未填写';
            const stockName = document.getElementById('stockName').value || '未填写';
            const currentPrice = document.getElementById('currentPrice').value || '未填写';
            const tradeDate = document.getElementById('tradeDate').value || '未填写';
            const holdShares = document.getElementById('holdShares').value || '未填写';
            const costPrice = document.getElementById('costPrice').value || '未填写';
            const profitPct = document.getElementById('profitPct').value || '未填写';

            const rsi6 = document.getElementById('rsi6').value || '未填写';
            const rsi14 = document.getElementById('rsi14').value || '未填写';
            const rsiStatus = getRadioValue('rsiStatus');

            const macdDiff = document.getElementById('macdDiff').value || '未填写';
            const macdDea = document.getElementById('macdDea').value || '未填写';
            const macdBar = document.getElementById('macdBar').value || '未填写';
            const macdStatus = getRadioValue('macdStatus');
            const macdBarStatus = getRadioValue('macdBarStatus');
            const barColor = getRadioValue('barColor');
            const barVolume = getRadioValue('barVolume');

            const kdjK = document.getElementById('kdjK').value || '未填写';
            const kdjD = document.getElementById('kdjD').value || '未填写';
            const kdjJ = document.getElementById('kdjJ').value || '未填写';
            const kdjStatus = getRadioValue('kdjStatus');

            const extraInfo = document.getElementById('extraInfo').value;

            const prompt = `请基于以下股票的技术指标、量价状态和持仓信息，帮我分析并给出未来的交易策略建议：

【基本信息】
- 股票代码: ${stockCode}
- 股票名称: ${stockName}
- 分析日期: ${tradeDate}

        function copyToClipboard() {
            const output = document.getElementById('output');
            if (!output.value.trim()) {
                showToast('请先生成提示词！');
                return;
            }
            output.select();
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            showToast('已复制到剪贴板！');
        }

        function clearAll() {
            const inputs = document.querySelectorAll('input[type="text"], input[type="number"], textarea');
            inputs.forEach(input => input.value = '');
            const radios = document.querySelectorAll('input[type="radio"]');
            radios.forEach(r => r.checked = false);
            document.getElementById('stockCode').value = '';
            document.getElementById('stockName').value = '';
            document.getElementById('stockParseHint').textContent = '';
            document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];
            showToast('已清空所有数据');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
    </script>
