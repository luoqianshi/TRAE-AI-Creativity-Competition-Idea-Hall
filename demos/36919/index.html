<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.CUS (Obfuscated)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="toast" id="toast"></div>

<div class="home-screen" id="homeScreen">
    <div class="home-container">
        <h1 class="home-title">.CUS</h1>

        <div class="home-last-card" id="lastWorkCard" style="display:none;">
            <div class="home-preview" id="homePreview"></div>
            <div class="home-last-meta" id="lastWorkMeta"></div>
            <button class="btn btn-primary home-btn home-continue-btn" id="btnContinue">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </button>
        </div>

        <div class="home-actions">
            <button class="btn btn-secondary home-btn" id="btnNewMap">
                + 新建思维导图
            </button>
            <button class="btn btn-secondary home-btn" id="btnImportHome">
                导入 JSON
            </button>
        </div>
    </div>
</div>

<div class="toolbar">
    <div class="toolbar-left">
        <div class="toolbar-title">.CUS</div>
        <div class="input-group">

            </button>
            <button class="btn btn-primary btn-icon" id="btnAddText" title="添加文字">
                <svg viewBox="0 0 1024 1024"><path d="M213.333333 213.333333v597.333334h597.333334V213.333333H213.333333zM170.666667 128h682.666666a42.666667 42.666667 0 0 1 42.666667 42.666667v682.666666a42.666667 42.666667 0 0 1-42.666667 42.666667H170.666667a42.666667 42.666667 0 0 1-42.666667-42.666667V170.666667a42.666667 42.666667 0 0 1 42.666667-42.666667z m384 298.666667v298.666666h-85.333334v-298.666666H298.666667V341.333333h426.666666v85.333334h-170.666666z"/></svg>

    <div class="toolbar-right">

        </button>

            <span class="btn-tooltip">导入 JSON</span>
        </button>
    </div>

    <div class="drag-drop-dialog" id="dragDropDialog">
        <div class="drag-drop-zone" id="dragDropZone">
            <div class="drag-drop-plus">+</div>
            <div class="drag-drop-text">拖拽 JSON 文件到此处</div>
        </div>
        <button class="drag-drop-close" id="dragDropClose">×</button>
    </div>
    </div>
</div>

<div class="canvas-container" id="canvas" style="display:none;">
    <div class="canvas-world" id="canvasWorld">
        <svg class="connections-layer" id="svgLayer"></svg>
        <div class="selection-box" id="selectionBox"></div>
    </div>
    
    <div class="presentation-overlay" id="presentationOverlay">
        <div class="present-indicator" id="presentIndicator">
            <span id="presentCounter">1 / 10</span>
        </div>
        
        <button class="present-exit-btn" id="presentExitBtn" title="退出演示 (ESC)">
            <svg viewBox="0 0 1024 1024"><path d="M563.8 512l262.5-312.9c4.4-5.2.7-13.1-6.1-13.1h-79.8c-4.7 0-9.2 2.1-12.3 5.7L511.6 449.8 295.1 191.7c-3-3.6-7.5-5.7-12.3-5.7H203c-6.8 0-10.5 7.9-6.1 13.1L459.4 512 196.9 824.9c-4.4 5.2-.7 13.1 6.1 13.1h79.8c4.7 0 9.2-2.1 12.3-5.7l216.5-258.1 216.5 258.1c3 3.6 7.5 5.7 12.3 5.7h79.8c6.8 0 10.5-7.9 6.1-13.1L563.8 512z"/></svg>
        </button>
        
        <svg class="present-node-connections" id="presentNodeConnections"></svg>
        
        <div class="present-main-view" id="presentMainView">
            <div class="present-node-detail present-enter" id="presentNodeDetail">
                <div class="present-node-title" id="presentNodeTitle" contenteditable="true" spellcheck="false"></div>
                <div class="present-node-image-wrap" id="presentNodeImageWrap"></div>
                <div class="present-node-desc" id="presentNodeDesc">
                    <div class="present-desc-image-wrap" id="presentDescImageWrap">
                        <img id="presentDescImage" src="" alt="">
                        <div class="present-desc-image-resize" id="presentDescImageResize"></div>
                    </div>
                    <div class="present-desc-textarea-wrap">
                        <textarea placeholder="点击添加详细描述..." spellcheck="false"></textarea>
                        <button class="present-desc-add-img-btn" id="presentDescAddImgBtn">
                            <svg width="14" height="14" viewBox="0 0 1024 1024"><path d="M512 102.4a409.6 409.6 0 1 0 0 819.2 409.6 409.6 0 0 0 0-819.2z m0 76.8a332.8 332.8 0 1 1 0 665.6 332.8 332.8 0 0 1 0-665.6z" fill="currentColor"/><path d="M512 307.2a38.4 38.4 0 0 1 38.4 38.4v128h128a38.4 38.4 0 0 1 0 76.8h-128v128a38.4 38.4 0 0 1-76.8 0v-128h-128a38.4 38.4 0 0 1 0-76.8h128v-128a38.4 38.4 0 0 1 38.4-38.4z" fill="currentColor"/></svg>
                            添加图片
                        </button>
                        <input type="file" id="presentDescImgInput" accept="image/*" class="hidden-input">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="present-nav-panel" id="presentNavPanel">
            <div class="present-nav-resize-handle top-left" data-handle="tl"></div>
            <div class="present-nav-resize-handle top-right" data-handle="tr"></div>
            <div class="present-nav-resize-handle bottom-left" data-handle="bl"></div>
            <div class="present-nav-resize-handle bottom-right" data-handle="br"></div>
            <div class="present-nav-track" id="presentNavTrack"></div>
        </div>
    </div>
</div>

<div class="status-bar">
    <span id="statusInfo">节点数: 0 / 50 | 分组数: 0</span>
    <span class="hint">提示: 拖拽移动节点 | 右键拖拽平移画布 | Delete删除 | 框选后可分组 | cmd+鼠标左键连接</span>
</div>

<input type="file" class="hidden-input" id="fileInput" accept=".json">

<script src="state.js"></script>
<script src="history.js"></script>
<script src="nodes.js"></script>
<script src="render.js"></script>
<script src="interactions.js"></script>
<script src="presentation.js"></script>
<script src="keyboard.js"></script>
<script src="init.js"></script>
</body>
</html>
