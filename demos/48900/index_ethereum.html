<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔗 区块链安全响应系统 (以太坊版)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid #0f3460; margin-bottom: 30px; }
        header h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: rgba(15, 52, 96, 0.5); border: 1px solid #0f3460; border-radius: 10px; padding: 25px; text-align: center; }
        .stat-value { font-size: 2.5em; font-weight: bold; color: #00d4ff; margin: 10px 0; }
        .stat-label { color: #aaa; text-transform: uppercase; font-size: 0.9em; }
        .card { background: rgba(15, 52, 96, 0.3); border: 1px solid #0f3460; border-radius: 10px; padding: 25px; margin-bottom: 20px; }
        .card h2 { margin-bottom: 20px; color: #00ff88; border-bottom: 1px solid #0f3460; padding-bottom: 10px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .two-col { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid #0f3460; border-radius: 5px; color: #fff; font-size: 1em;
        }
        .btn { background: linear-gradient(45deg, #00d4ff, #00ff88); border: none; padding: 12px 25px; border-radius: 5px; color: #1a1a2e; font-weight: bold; cursor: pointer; margin-right: 10px; }
        .btn:hover { transform: scale(1.05); }
        .btn-danger { background: #ff4444; color: white; }
        .btn-secondary { background: rgba(0,0,0,0.3); color: #00d4ff; border: 1px solid #00d4ff; }
        .wallet-info { background: rgba(0,212,255,0.1); border: 1px solid #00d4ff; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .wallet-info code { word-break: break-all; color: #00ff88; font-family: monospace; }
        .event-item { background: rgba(0,0,0,0.3); border: 1px solid #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
        .event-item:hover { border-color: #00d4ff; transform: translateX(5px); }
        .notification { position: fixed; top: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; z-index: 1000; display: none; animation: slideIn 0.3s ease; }
        .notification.success { background: #00ff88; color: #1a1a2e; }
        .notification.error { background: #ff4444; color: #fff; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .empty-state { text-align: center; padding: 40px; color: #888; }
        .blockchain-viewer { max-height: 500px; overflow-y: auto; }
        .recommendation-section { margin-bottom: 20px; }
        .recommendation-section h4 { color: #ffcc00; margin-bottom: 10px; }
        .recommendation-item { padding: 8px; margin: 5px 0; background: rgba(0,0,0,0.2); border-left: 3px solid #00ff88; }
        .severity-critical { color: #ff4444; }
        .severity-high { color: #ff8800; }
        .severity-medium { color: #ffcc00; }
        .severity-low { color: #00ff88; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔗 区块链安全响应系统 (以太坊版)</h1>
            <p>基于以太坊智能合约的安全事件响应系统</p>
        </header>
        
        <div class="card">
            <h2>💼 MetaMask 连接</h2>
            <div id="walletDisplay" class="wallet-info">
                <p>尚未连接到 MetaMask，请点击下方按钮连接钱包</p>
                <div style="margin-top: 10px;">
                    <button class="btn" onclick="connectWallet()">连接 MetaMask</button>
                </div>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">总事件数</div>
                <div class="stat-value" id="totalEvents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">严重事件</div>
                <div class="stat-value" id="criticalEvents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">高危事件</div>
                <div class="stat-value" id="highEvents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">已验证</div>
                <div class="stat-value" id="verifiedEvents">0</div>
            </div>
        </div>
        
        <div class="two-col">
            <div class="card">
                <h2>📝 报告安全事件</h2>
                <form id="eventForm">
                    <div class="form-group">
                        <label>事件类型 *</label>
                        <select id="eventType" required onchange="showRecommendations()">
                            <option value="">选择事件类型</option>
                            <option value="malware">恶意软件</option>
                            <option value="phishing">网络钓鱼</option>
                            <option value="unauthorized_access">未授权访问</option>
                            <option value="data_breach">数据泄露</option>
                            <option value="ddos">DDoS攻击</option>
                            <option value="intrusion">入侵检测</option>
                            <option value="vulnerability">漏洞发现</option>
                            <option value="policy_violation">策略违规</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>严重程度 *</label>
                        <select id="severity" required>
                            <option value="">选择严重程度</option>
                            <option value="low">低</option>
                            <option value="medium">中</option>
                            <option value="high">高</option>
                            <option value="critical">严重</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>来源 *</label>
                        <input type="text" id="source" placeholder="例如：服务器 IP、用户 ID" required>
                    </div>
                    <div class="form-group">
                        <label>描述 *</label>
                        <textarea id="description" rows="3" placeholder="详细描述安全事件" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>证据哈希 (可选)</label>
                        <input type="text" id="evidenceHash" placeholder="SHA-256 证据哈希">
                    </div>
                    <button type="submit" class="btn">发送到以太坊</button>
                </form>
            </div>
            
            <div class="card">
                <h2>💡 响应建议</h2>
                <div id="recommendations">
                    <div class="empty-state">选择事件类型查看建议</div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <h2>📋 事件列表 (链上数据)</h2>
            <button class="btn-secondary" style="margin-bottom: 15px;" onclick="loadEvents()">刷新事件</button>
            <div class="blockchain-viewer" id="eventsList">
                <div class="empty-state">暂无事件，请先连接钱包并报告事件</div>
            </div>
        </div>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <script>
        let provider;
        let signer;
        let contract;
        let allEvents = [];
        
        // 响应建议数据
        const recommendations = {
            malware: {
                immediate: ['隔离受感染主机', '断开网络连接', '保存内存取证'],
                investigation: ['扫描关联设备', '分析恶意样本', '查找感染源'],
                recovery: ['系统重装或恢复', '更新病毒库', '加强防护策略']
            },
            unauthorized_access: {
                immediate: ['重置受影响账户', '封锁攻击源 IP', '检查访问日志'],
                investigation: ['分析攻击路径', '评估数据泄露', '修复漏洞'],
                recovery: ['强制密码', '启用 MFA', '审计权限']
            },
            phishing: {
                immediate: ['阻止钓鱼 URL', '提醒用户', '扫描点击'],
                investigation: ['分析钓鱼邮件', '查找受影响用户', '检查凭据泄露'],
                recovery: ['用户安全培训', '升级邮件过滤', '部署 SPF/DKIM']
            },
            data_breach: {
                immediate: ['停止数据泄露', '保护受影响系统', '启动应急响应'],
                investigation: ['确定泄露范围', '评估法律影响', '通知受影响方'],
                recovery: ['修复安全控制', '加强数据加密', '合规报告']
            },
            ddos: {
                immediate: ['启用 DDoS 防护', '流量清洗', '通知 ISP'],
                investigation: ['分析攻击流量', '识别攻击源', '评估影响范围'],
                recovery: ['加强网络架构', '配置 CDN/WAF', '更新防护策略']
            }
        };
        
        // 响应建议默认值
        const defaultRecommendations = {
            immediate: ['标准响应流程'],
            investigation: ['调查事件详情'],
            recovery: ['恢复正常运营']
        };
        
        function showNotification(msg, type = 'success') {
            const n = document.getElementById('notification');
            n.textContent = msg;
            n.className = `notification ${type}`;
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 3000);
        }
        
        async function connectWallet() {
            try {
                if (typeof window.ethereum !== 'undefined') {
                    await window.ethereum.request({ method: 'eth_requestAccounts' });
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    
                    const address = await signer.getAddress();
                    updateWalletDisplay(address);
                    
                    showNotification('✅ 成功连接 MetaMask！');
                    await initContract();
                    await loadEvents();
                    await loadStatistics();
                } else {
                    showNotification('❌ 请先安装 MetaMask', 'error');
                }
            } catch (error) {
                console.error(error);
                showNotification('❌ 连接失败: ' + error.message, 'error');
            }
        }
        
        function updateWalletDisplay(address) {
            const display = document.getElementById('walletDisplay');
            display.innerHTML = `
                <p><strong>已连接的钱包地址:</strong></p>
                <code>${address}</code>
                <div style="margin-top: 10px;">
                    <button class="btn-danger" onclick="disconnectWallet()">断开连接</button>
                </div>
            `;
        }
        
        async function initContract() {
            // 这里使用简化的 ABI，实际部署时需要完整的合约地址和 ABI
            const abi = [
                "function reportSecurityEvent(string, string, string, string, string, string) returns (uint256)",
                "function getAllEvents() view returns (tuple(uint256, string, string, string, string, string, string, address, uint256, bool)[])",
                "function getStatistics() view returns (uint256, uint256, uint256, uint256, uint256, uint256)",
                "event SecurityEventReported(uint256 indexed, address indexed, string, uint256)"
            ];
            
            // 演示模式：在没有真实合约的情况下也能运行
            console.log("⚠️ 演示模式：未连接到真实合约");
        }
        
        async function loadEvents() {
            const eventsList = document.getElementById('eventsList');
            
            // 演示模式：显示模拟数据
            if (!allEvents || allEvents.length === 0) {
                allEvents = [
                    { id: 1, eventType: 'malware', severity: 'critical', source: '192.168.1.10', description: '检测到勒索软件攻击', timestamp: Date.now() - 3600000 },
                    { id: 2, eventType: 'phishing', severity: 'high', source: 'email.server', description: '钓鱼邮件攻击', timestamp: Date.now() - 7200000 }
                ];
            }
            
            eventsList.innerHTML = allEvents.map(evt => `
                <div class="event-item">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <strong class="severity-${evt.severity}">${evt.eventType.toUpperCase()}</strong>
                        <span class="severity-${evt.severity}" style="font-size: 0.9em;">${evt.severity}</span>
                    </div>
                    <p style="margin: 5px 0;">${evt.description}</p>
                    <p style="font-size: 0.85em; color: #aaa;">来源: ${evt.source} | ${new Date(evt.timestamp).toLocaleString()}</p>
                </div>
            `).join('');
        }
        
        async function loadStatistics() {
            document.getElementById('totalEvents').textContent = allEvents.length;
            document.getElementById('criticalEvents').textContent = allEvents.filter(e => e.severity === 'critical').length;
            document.getElementById('highEvents').textContent = allEvents.filter(e => e.severity === 'high').length;
            document.getElementById('verifiedEvents').textContent = 0;
        }
        
        function showRecommendations() {
            const type = document.getElementById('eventType').value;
            const recs = recommendations[type] || defaultRecommendations;
            
            const container = document.getElementById('recommendations');
            container.innerHTML = `
                <div class="recommendation-section">
                    <h4>🚨 立即执行</h4>
                    ${recs.immediate.map(item => `<div class="recommendation-item">✅ ${item}</div>`).join('')}
                </div>
                <div class="recommendation-section">
                    <h4>🔍 调查阶段</h4>
                    ${recs.investigation.map(item => `<div class="recommendation-item">🔍 ${item}</div>`).join('')}
                </div>
                <div class="recommendation-section">
                    <h4>🔄 恢复阶段</h4>
                    ${recs.recovery.map(item => `<div class="recommendation-item">🔄 ${item}</div>`).join('')}
                </div>
            `;
        }
        
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const eventData = {
                id: Date.now(),
                eventType: document.getElementById('eventType').value,
                severity: document.getElementById('severity').value,
                source: document.getElementById('source').value,
                description: document.getElementById('description').value,
                evidenceHash: document.getElementById('evidenceHash').value,
                timestamp: Date.now()
            };
            
            allEvents.push(eventData);
            showNotification('✅ 事件已添加到本地缓存！');
            document.getElementById('eventForm').reset();
            document.getElementById('recommendations').innerHTML = '<div class="empty-state">选择事件类型查看建议</div>';
            loadEvents();
            loadStatistics();
        });
        
        // 页面加载时检查
        window.addEventListener('load', () => {
            if (typeof window.ethereum !== 'undefined') {
                window.ethereum.on('accountsChanged', () => connectWallet());
                window.ethereum.on('chainChanged', () => window.location.reload());
            }
        });
    </script>
</body>
</html>
