<!DOCTYPE html>

<html lang="zh">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">

  <title>生活微光 · 灵感便签</title>

  <style>

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;

    }



    body {

      background: #faf6f0;

      background-image: radial-gradient(circle at 10% 20%, #fff8f0 0%, #f3ede7 100%);

      min-height: 100vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 1.5rem;

    }



    .notebook {

      max-width: 720px;

      width: 100%;

      background: #fffdf9;

      background-image: 

        linear-gradient(0deg, rgba(245, 235, 220, 0.2) 0%, transparent 10%),

        repeating-linear-gradient(45deg, #f7efe8 0px, #f7efe8 1px, transparent 1px, transparent 8px);

      border-radius: 48px 48px 40px 40px;

      box-shadow: 

        0 20px 40px -12px rgba(120, 80, 60, 0.25),

        0 4px 18px rgba(160, 120, 90, 0.08),

        inset 0 1px 0 #fffefc;

      padding: 2.2rem 1.8rem 2.8rem;

      border: 1px solid #ede3d7;

      position: relative;

    }



    .notebook::before {

      content: '';

      position: absolute;

      top: 20px;

      left: 20px;

      right: 20px;

      height: 3px;

      background: linear-gradient(90deg, #e5d4c0, #dcc6b0, #e5d4c0);

      border-radius: 10px;

      opacity: 0.5;

    }



    .header {

      display: flex;

      align-items: baseline;

      justify-content: space-between;

      flex-wrap: wrap;

      margin-bottom: 1.8rem;

      padding-top: 0.5rem;

    }



    .header h1 {

      font-size: 2.4rem;

      font-weight: 600;

      letter-spacing: -0.02em;

      color: #4f3a2b;

      background: linear-gradient(135deg, #6b4f3a, #8b6e55);

      -webkit-background-clip: text;

      background-clip: text;

      -webkit-text-fill-color: transparent;

      display: inline-flex;

      align-items: center;

      gap: 0.3rem;

      line-height: 1.2;

    }



    .header h1 small {

      font-size: 1rem;

      font-weight: 400;

      background: #ede3d7;

      -webkit-text-fill-color: #6b4f3a;

      background-clip: unset;

      color: #6b4f3a;

      padding: 0.1rem 0.8rem;

      border-radius: 30px;

      letter-spacing: 0.3px;

      margin-left: 0.2rem;

      background: #f1e6db;

      font-size: 0.9rem;

    }



    .date-badge {

      background: #ebdfd2;

      padding: 0.4rem 1rem;

      border-radius: 40px;

      font-size: 0.8rem;

      font-weight: 450;

      color: #5e4535;

      letter-spacing: 0.3px;

      border: 1px solid #ddd0c0;

      box-shadow: inset 0 1px 3px rgba(255, 245, 235, 0.6);

    }



    /* 三卡片 */

    .grid-3 {

      display: grid;

      grid-template-columns: 1fr 1fr 1fr;

      gap: 0.8rem;

      margin: 1.2rem 0 1.8rem;

    }



    .card-mini {

      background: #fcf8f4;

      border-radius: 28px;

      padding: 0.9rem 0.4rem 0.7rem;

      text-align: center;

      border: 1px solid #ece0d3;

      box-shadow: 0 4px 8px rgba(140, 100, 70, 0.04);

      transition: 0.15s ease;

      backdrop-filter: blur(2px);

    }



    .card-mini:hover {

      transform: translateY(-3px);

      border-color: #d8c2b0;

      background: #fffbf7;

      box-shadow: 0 12px 18px -8px rgba(100, 70, 50, 0.12);

    }



    .card-mini .emoji-big {

      font-size: 2.1rem;

      display: block;

      margin-bottom: 0.2rem;

      line-height: 1.3;

    }



    .card-mini .label {

      font-size: 0.75rem;

      font-weight: 500;

      color: #6c5543;

      letter-spacing: 0.3px;

      text-transform: uppercase;

      opacity: 0.8;

    }



    .card-mini .value {

      font-size: 1.5rem;

      font-weight: 550;

      color: #4f3523;

      line-height: 1.4;

      margin-top: 0.1rem;

    }



    /* 灵感输入 */

    .inspire-area {

      background: #fbf7f2;

      border-radius: 36px;

      padding: 1.8rem 1.5rem 1.5rem;

      margin: 1.2rem 0 1.8rem;

      border: 1px solid #e5d6c6;

      box-shadow: inset 0 2px 6px rgba(180, 140, 110, 0.06);

    }



    .inspire-area .section-label {

      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 0.9rem;

      font-weight: 500;

      color: #735f4d;

      letter-spacing: 0.4px;

      margin-bottom: 1rem;

    }



    .inspire-area .section-label span {

      background: #e5d6c6;

      padding: 0.2rem 0.8rem;

      border-radius: 30px;

      font-size: 0.7rem;

      color: #4d3a2b;

    }



    .input-wrap {

      display: flex;

      flex-wrap: wrap;

      align-items: center;

      gap: 0.5rem;

    }



    .input-wrap input {

      flex: 2 1 200px;

      background: #fefcf9;

      border: 1px solid #decbb9;

      border-radius: 60px;

      padding: 0.9rem 1.5rem;

      font-size: 1rem;

      outline: none;

      transition: 0.15s;

      color: #2d241c;

      box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);

      font-weight: 400;

    }



    .input-wrap input:focus {

      border-color: #b5957a;

      background: #ffffff;

      box-shadow: 0 0 0 3px rgba(180, 140, 110, 0.15);

    }



    .input-wrap input::placeholder {

      color: #b9a696;

      font-weight: 300;

      letter-spacing: 0.2px;

    }



    .btn-primary {

      background: #dac6b4;

      border: none;

      border-radius: 60px;

      padding: 0.9rem 1.8rem;

      font-weight: 550;

      color: #3f2e20;

      font-size: 1rem;

      display: inline-flex;

      align-items: center;

      gap: 0.4rem;

      background: #e6d4c2;

      box-shadow: 0 4px 6px rgba(130, 90, 60, 0.08);

      transition: 0.15s;

      cursor: pointer;

      border: 1px solid #d4beab;

      flex: 1 0 auto;

      justify-content: center;

    }



    .btn-primary:hover {

      background: #dec9b5;

      border-color: #bc9f88;

      box-shadow: 0 6px 12px rgba(130, 90, 60, 0.12);

      transform: scale(0.98);

    }



    .btn-primary:active {

      background: #d1baa5;

      transform: scale(0.96);

    }



    /* 列表 */

    .list-header {

      display: flex;

      justify-content: space-between;

      align-items: baseline;

      margin: 0.8rem 0 0.6rem;

      padding: 0 0.2rem;

    }



    .list-header h3 {

      font-weight: 500;

      color: #4d3a2b;

      font-size: 1.1rem;

      letter-spacing: -0.2px;

      display: flex;

      align-items: center;

      gap: 0.3rem;

    }



    .list-header .count-badge {

      background: #e4d4c4;

      padding: 0.1rem 0.7rem;

      border-radius: 30px;

      font-size: 0.7rem;

      font-weight: 500;

      color: #4f3929;

    }



    .inspire-list {

      background: #fcf8f3;

      border-radius: 32px;

      padding: 0.2rem 0.2rem 0.1rem;

      border: 1px solid #e6d8ca;

      min-height: 110px;

      max-height: 320px;

      overflow-y: auto;

    }



    .list-item {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0.8rem 1.2rem 0.8rem 1.8rem;

      border-bottom: 1px dashed #e4d2c0;

      transition: 0.1s ease;

      color: #3b2d21;

      animation: fadeIn 0.25s ease;

    }



    .list-item:last-child {

      border-bottom: none;

    }



    .list-item .item-text {

      font-size: 1rem;

      font-weight: 400;

      word-break: break-word;

      padding-right: 0.5rem;

      display: flex;

      align-items: center;

      gap: 0.4rem;

    }



    .list-item .item-text .tag-emoji {

      font-size: 1.2rem;

    }



    .list-item .item-actions {

      display: flex;

      gap: 0.3rem;

      flex-shrink: 0;

    }



    .icon-btn {

      background: transparent;

      border: none;

      font-size: 1.2rem;

      padding: 0.2rem 0.4rem;

      border-radius: 30px;

      cursor: pointer;

      transition: 0.1s;

      color: #856b58;

      line-height: 1;

    }



    .icon-btn:hover {

      background: #e8dbcf;

      transform: scale(1.1);

    }



    .icon-btn.done {

      color: #7e9f7a;

    }

    .icon-btn.done:hover {

      background: #dcebd6;

    }

    .icon-btn.delete:hover {

      background: #f6e0d8;

      color: #b1624b;

    }



    .list-item.completed .item-text {

      opacity: 0.6;

      text-decoration: line-through;

      text-decoration-color: #b5957a;

    }



    .empty-state {

      text-align: center;

      padding: 1.8rem 0.5rem;

      color: #b09a88;

      font-size: 0.95rem;

      letter-spacing: 0.4px;

    }



    .empty-state span {

      display: block;

      font-size: 2.8rem;

      margin-bottom: 0.3rem;

      opacity: 0.5;

    }



    /* 底部：心情 + 挑战 */

    .footer-extra {

      margin-top: 2rem;

      display: flex;

      flex-wrap: wrap;

      justify-content: space-between;

      align-items: center;

      gap: 1rem;

      background: #f4ede6;

      border-radius: 40px;

      padding: 0.9rem 1.5rem 0.9rem 2rem;

      border: 1px solid #e2d2c2;

    }



    .mood-tag {

      display: flex;

      align-items: center;

      gap: 0.6rem;

      font-size: 0.95rem;

      color: #4d3827;

    }



    .mood-tag .mood-emoji {

      font-size: 1.7rem;

      line-height: 1;

      cursor: pointer;

      transition: 0.1s;

    }

    .mood-tag .mood-emoji:hover {

      transform: scale(1.1);

    }



    .challenge-area {

      display: flex;

      align-items: center;

      gap: 0.6rem;

      flex-wrap: wrap;

    }



    .challenge-text {

      font-size: 0.95rem;

      color: #4d3827;

      background: #faf3eb;

      padding: 0.3rem 1rem;

      border-radius: 40px;

      border: 1px solid #dccbbc;

      max-width: 200px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }



    .challenge-btn {

      background: #e7d9cc;

      border: none;

      border-radius: 60px;

      padding: 0.5rem 1.2rem;

      font-weight: 450;

      color: #3f2e1f;

      border: 1px solid #d4beab;

      box-shadow: 0 2px 6px rgba(100, 70, 40, 0.06);

      transition: 0.12s;

      cursor: pointer;

      font-size: 0.85rem;

      display: inline-flex;

      align-items: center;

      gap: 0.3rem;

    }



    .challenge-btn:hover {

      background: #ddcdbc;

      border-color: #b99d87;

      transform: scale(0.96);

    }



    .challenge-btn:active {

      background: #cebbaa;

    }



    @keyframes fadeIn {

      from { opacity: 0; transform: translateY(6px); }

      to { opacity: 1; transform: translateY(0); }

    }



    @media (max-width: 550px) {

      .notebook {

        padding: 1.5rem 1rem 2rem;

        border-radius: 36px;

      }

      .header h1 {

        font-size: 2rem;

      }

      .grid-3 {

        gap: 0.5rem;

      }

      .card-mini .emoji-big {

        font-size: 1.6rem;

      }

      .inspire-area {

        padding: 1.2rem 1rem;

      }

      .input-wrap input {

        padding: 0.7rem 1rem;

        font-size: 0.95rem;

      }

      .btn-primary {

        padding: 0.7rem 1.2rem;

        font-size: 0.9rem;

      }

      .footer-extra {

        flex-direction: column;

        align-items: flex-start;

        padding: 1rem 1.2rem;

      }

      .challenge-text {

        max-width: 150px;

        white-space: normal;

      }

    }

  </style>

</head>

<body>

<div class="notebook">

  <div class="header">

    <h1>

      ✦ 生活微光

      <small>灵感便签</small>

    </h1>

    <div class="date-badge" id="dateDisplay">🌸 今日</div>

  </div>



  <!-- 三卡片 -->

  <div class="grid-3">

    <div class="card-mini">

      <span class="emoji-big">💡</span>

      <div class="label">今日灵感</div>

      <div class="value" id="inspireCount">0</div>

    </div>

    <div class="card-mini">

      <span class="emoji-big">☀️</span>

      <div class="label">心情签到</div>

      <div class="value" id="moodDisplay">🌱</div>

    </div>

    <div class="card-mini">

      <span class="emoji-big">✨</span>

      <div class="label">小挑战</div>

      <div class="value" id="challengeDisplay">🎯</div>

    </div>

  </div>



  <!-- 输入灵感 -->

  <div class="inspire-area">

    <div class="section-label">

      ✏️ 记下你的生活新花样

      <span>随手造</span>

    </div>

    <div class="input-wrap">

      <input type="text" id="inspireInput" placeholder="比如：做一杯蜂蜜柠檬水" maxlength="60" autocomplete="off">

      <button class="btn-primary" id="addInspireBtn">➕ 添加</button>

    </div>

  </div>



  <!-- 灵感列表 -->

  <div class="list-header">

    <h3>📋 今日花样清单 <span class="count-badge" id="listCount">0</span></h3>

  </div>

  <div class="inspire-list" id="inspireListContainer">

    <div class="empty-state" id="emptyState">

      <span>🕊️</span>

      还没有灵感，写一个吧～

    </div>

    <!-- 动态列表会渲染到这里 -->

  </div>



  <!-- 底部：心情 + 挑战 -->

  <div class="footer-extra">

    <div class="mood-tag">

      <span class="mood-emoji" id="moodPicker" title="点击切换心情">🌱</span>

      <span id="moodLabel">今日心情</span>

    </div>

    <div class="challenge-area">

      <span class="challenge-text" id="challengeText">点击🎲换一个</span>

      <button class="challenge-btn" id="nextChallengeBtn">🎲 换一个</button>

      <button class="challenge-btn" id="completeChallengeBtn" style="background:#d4e0d0; border-color:#b3c9ad;">✅ 完成</button>

    </div>

  </div>

</div>



<script>

  (function() {

    // ---------- 数据 ----------

    let inspirations = [];

    let currentMood = '🌱';

    let currentChallenge = '';



    const challengePool = [

      '给窗台上的植物拍一张照片 📸',

      '关掉手机，专注阅读15分钟 📖',

      '给老朋友发条问候信息 💬',

      '用现有食材创造一道新菜 🍳',

      '写下今天最开心的三件小事 ✍️',

      '整理一个角落，让它焕然一新 🧹',

      '听一首从未听过的歌 🎵',

      '对着镜子给自己一个微笑 😊',

      '走一条没走过的路回家 🚶',

      '给家人或朋友一个拥抱 🤗'

    ];



    // DOM 引用

    const inspireInput = document.getElementById('inspireInput');

    const addBtn = document.getElementById('addInspireBtn');

    const listContainer = document.getElementById('inspireListContainer');

    const emptyState = document.getElementById('emptyState');

    const inspireCountSpan = document.getElementById('inspireCount');

    const listCountSpan = document.getElementById('listCount');

    const moodDisplay = document.getElementById('moodDisplay');

    const moodPicker = document.getElementById('moodPicker');

    const moodLabel = document.getElementById('moodLabel');

    const challengeText = document.getElementById('challengeText');

    const nextChallengeBtn = document.getElementById('nextChallengeBtn');

    const completeChallengeBtn = document.getElementById('completeChallengeBtn');

    const dateDisplay = document.getElementById('dateDisplay');



    // 今日日期

    function updateDate() {

      const now = new Date();

      const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };

      dateDisplay.textContent = '🌸 ' + now.toLocaleDateString('zh-CN', opts);

    }

    updateDate();



    // ---------- 本地存储 ----------

    function loadData() {

      try {

        const saved = localStorage.getItem('inspirationData');

        if (saved) {

          const parsed = JSON.parse(saved);

          inspirations = parsed.inspirations || [];

          currentMood = parsed.mood || '🌱';

          currentChallenge = parsed.challenge || '';

        } else {

          // 首次使用，设置默认挑战

          pickRandomChallenge();

        }

      } catch (e) {

        inspirations = [];

        currentMood = '🌱';

      }

      // 确保挑战有值

      if (!currentChallenge) pickRandomChallenge();

    }



    function saveData() {

      try {

        localStorage.setItem('inspirationData', JSON.stringify({

          inspirations: inspirations,

          mood: currentMood,

          challenge: currentChallenge

        }));

      } catch (e) {}

    }



    // ---------- 挑战 ----------

    function pickRandomChallenge() {

      if (challengePool.length === 0) {

        currentChallenge = '今天给自己一个小惊喜 ✨';

      } else {

        const randomIndex = Math.floor(Math.random() * challengePool.length);

        currentChallenge = challengePool[randomIndex];

      }

      challengeText.textContent = currentChallenge;

      document.getElementById('challengeDisplay').textContent = '🎯';

      saveData();

    }



    // ---------- 渲染列表 ----------

    function renderList() {

      // 清空容器，保留 emptyState 占位

      const items = listContainer.querySelectorAll('.list-item');

      items.forEach(el => el.remove());



      if (inspirations.length === 0) {

        emptyState.style.display = 'block';

      } else {

        emptyState.style.display = 'none';

        // 倒序显示（最新的在前）

        const sorted = [...inspirations].reverse();

        sorted.forEach((item, index) => {

          const div = document.createElement('div');

          div.className = 'list-item' + (item.done ? ' completed' : '');

          div.dataset.id = item.id || index;



          const textSpan = document.createElement('span');

          textSpan.className = 'item-text';

          const emojiSpan = document.createElement('span');

          emojiSpan.className = 'tag-emoji';

          emojiSpan.textContent = item.emoji || '💡';

          textSpan.appendChild(emojiSpan);

          const textNode = document.createTextNode(' ' + item.text);

          textSpan.appendChild(textNode);



          const actionsDiv = document.createElement('div');

          actionsDiv.className = 'item-actions';



          const doneBtn = document.createElement('button');

          doneBtn.className = 'icon-btn done';

          doneBtn.textContent = item.done ? '✅' : '☑️';

          doneBtn.title = '标记完成/待办';

          doneBtn.addEventListener('click', function(e) {

            e.stopPropagation();

            toggleDone(item.id);

          });



          const deleteBtn = document.createElement('button');

          deleteBtn.className = 'icon-btn delete';

          deleteBtn.textContent = '🗑️';

          deleteBtn.title = '删除';

          deleteBtn.addEventListener('click', function(e) {

            e.stopPropagation();

            deleteInspiration(item.id);

          });



          actionsDiv.appendChild(doneBtn);

          actionsDiv.appendChild(deleteBtn);

          div.appendChild(textSpan);

          div.appendChild(actionsDiv);

          listContainer.appendChild(div);

        });

      }



      // 更新计数

      const total = inspirations.length;

      inspireCountSpan.textContent = total;

      listCountSpan.textContent = total;

    }



    // ---------- 操作 ----------

    function addInspiration() {

      const rawText = inspireInput.value.trim();

      if (rawText === '') {

        inspireInput.focus();

        return;

      }



      // 简单提取 emoji (如果开头有)

      let emoji = '💡';

      let text = rawText;

      const emojiMatch = rawText.match(/^([\u{1F000}-\u{1FFFF}]|[\u2600-\u27BF]|[\u{2700}-\u{27BF}]|[✅☑️📸📖💬🍳✍️🧹🎵😊🚶🤗])/u);

      if (emojiMatch) {

        emoji = emojiMatch[0];

        text = rawText.slice(emoji.length).trim() || rawText;

      }



      const newItem = {

        id: Date.now() + Math.random() * 1000,

        text: text,

        emoji: emoji,

        done: false,

        createdAt: new Date().toISOString()

      };

      inspirations.push(newItem);

      inspireInput.value = '';

      saveData();

      renderList();

      inspireInput.focus();

    }



    function toggleDone(id) {

      const item = inspirations.find(i => i.id === id);

      if (item) {

        item.done = !item.done;

        saveData();

        renderList();

      }

    }



    function deleteInspiration(id) {

      inspirations = inspirations.filter(i => i.id !== id);

      saveData();

      renderList();

    }



    // ---------- 心情 ----------

    const moodOptions = ['🌱', '😊', '😌', '🥰', '😎', '🤗', '😴', '💪', '🌸', '🌈'];

    let moodIndex = moodOptions.indexOf(currentMood);

    if (moodIndex === -1) moodIndex = 0;



    function updateMoodDisplay() {

      moodDisplay.textContent = currentMood;

      moodPicker.textContent = currentMood;

      // 更新卡片

      document.getElementById('moodDisplay').textContent = currentMood;

      saveData();

    }



    function cycleMood() {

      moodIndex = (moodIndex + 1) % moodOptions.length;

      currentMood = moodOptions[moodIndex];

      updateMoodDisplay();

    }



    // ---------- 初始化 ----------

    function init() {

      loadData();

      // 确保 mood 显示

      updateMoodDisplay();

      // 确保挑战显示

      if (currentChallenge) {

        challengeText.textContent = currentChallenge;

      } else {

        pickRandomChallenge();

      }

      renderList();



      // 事件绑定

      addBtn.addEventListener('click', addInspiration);

      inspireInput.addEventListener('keydown', function(e) {

        if (e.key === 'Enter') {

          e.preventDefault();

          addInspiration();

        }

      });



      moodPicker.addEventListener('click', cycleMood);

      moodLabel.addEventListener('click', cycleMood);



      nextChallengeBtn.addEventListener('click', function() {

        pickRandomChallenge();

        // 更新挑战显示卡片

        document.getElementById('challengeDisplay').textContent = '🎲';

      });



      completeChallengeBtn.addEventListener('click', function() {

        // 完成挑战：记录一条完成信息

        if (currentChallenge) {

          const challengeTextClean = currentChallenge.replace(/[📸📖💬🍳✍️🧹🎵😊🚶🤗]/g, '').trim();

          const newInsp = {

            id: Date.now() + Math.random() * 1000,

            text: '✅ 完成挑战：' + challengeTextClean,

            emoji: '🏆',

            done: true,

            createdAt: new Date().toISOString()

          };

          inspirations.push(newInsp);

          saveData();

          renderList();

          // 换一个新挑战

          pickRandomChallenge();

          document.getElementById('challengeDisplay').textContent = '🎯';

          // 简单反馈

          completeChallengeBtn.textContent = '✅ 已记录';

          setTimeout(() => {

            completeChallengeBtn.textContent = '✅ 完成';

          }, 1200);

        }

      });



      // 点击空白区域可添加

      document.addEventListener('click', function(e) {

        if (e.target.tagName === 'BODY') {

          inspireInput.focus();

        }

      });

    }



    init();

  })();

</script>

</body>

</html>
