<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ Algorithm RPG — 算法打怪升级平台</title>
<link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
<link rel="stylesheet" href="https://unpkg.com/rpg-awesome@0.2.0/css/rpg-awesome.min.css">
<style>
/* ========== Font ========== */
@font-face {
  font-family: 'zpix';
  src: url('public/assets/fonts/zpix.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}

/* ========== Reset & Vars ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0F172A; --fg: #F8FAFC; --primary: #1E293B; --secondary: #334155;
  --accent: #39FF14; --destructive: #EF4444; --warning: #FFD700;
  --muted: #94A3B8; --blue: #60A5FA;
  --border: 3px solid #000;
  --shadow: 4px 4px 0px 0px rgba(0,0,0,1);
  --shadow-sm: 2px 2px 0px 0px rgba(0,0,0,1);
}

html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: 'zpix', sans-serif;
  cursor: pointer;
}

/* ========== Utility ========== */
.hidden { display: none !important; }
.pixel-rendering { image-rendering: pixelated; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes shake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}
@keyframes bounce-short {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-25%); }
}
@keyframes toastIn {
  from { transform: translateX(120%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
@keyframes pulse-glow {
  0%, 100% { filter: drop-shadow(0 0 4px var(--warning)); }
  50% { filter: drop-shadow(0 0 12px var(--warning)); }
}

.animate-float { animation: float 3s ease-in-out infinite; }
.animate-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
.animate-bounce-short { animation: bounce-short 0.5s ease-out; }
.animate-pulse-glow { animation: pulse-glow 1.5s ease-in-out infinite; }

/* Scrollbar */
::-webkit-scrollbar { width: 12px; }
::-webkit-scrollbar-track { background: #0f172a; border-left: 2px solid #000; }
::-webkit-scrollbar-thumb { background: #475569; border: 2px solid #000; }
::-webkit-scrollbar-thumb:hover { background: #64748b; }

/* ========== Layout ========== */
#app {
  height: 100vh; display: flex; flex-direction: column;
  padding: 8px 12px; overflow: hidden;
}

/* Header */
#header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 4px; margin-bottom: 8px; flex-shrink: 0; flex-wrap: wrap; gap: 6px;
}
#header h1 { font-size: 13px; color: var(--warning); display: flex; align-items: center; gap: 8px; }
#header .stats-row { display: flex; gap: 12px; font-size: 11px; align-items: center; flex-wrap: wrap; }
#header .stats-row span { display: flex; align-items: center; gap: 4px; }

/* ========== PixelButton ========== */
.pixel-btn {
  font-family: 'zpix', sans-serif; font-size: 10px; cursor: pointer; text-transform: uppercase;
  letter-spacing: 1px; border: var(--border); padding: 5px 12px;
  box-shadow: var(--shadow-sm); position: relative;
  transition: all 0.05s; display: inline-flex; align-items: center; gap: 6px;
  line-height: 1;
}
.pixel-btn:active { transform: translate(2px, 2px); box-shadow: none; }
.pixel-btn:disabled { opacity: 0.5; pointer-events: none; }
.pixel-btn-default { background: var(--secondary); color: var(--fg); }
.pixel-btn-default:hover { background: #3b4f6b; }
.pixel-btn-accent { background: var(--accent); color: #000; }
.pixel-btn-accent:hover { background: #2de000; }
.pixel-btn-destructive { background: var(--destructive); color: var(--fg); }
.pixel-btn-destructive:hover { background: #dc2626; }
.pixel-btn-warning { background: var(--warning); color: #000; }
.pixel-btn-warning:hover { background: #e6c200; }
.pixel-btn-sm { font-size: 9px; padding: 3px 8px; height: 28px; }
.pixel-btn-lg { font-size: 12px; padding: 10px 20px; }

/* ========== PixelCard ========== */
.pixel-card {
  border: var(--border); box-shadow: var(--shadow); overflow: hidden;
}
.pixel-card-default { background: var(--primary); }
.pixel-card-dark { background: var(--bg); }

/* ========== Game View ========== */
#game-view {
  flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0;
}

/* Top row: Arena + Visualizer */
.top-row {
  display: flex; gap: 10px; height: 42vh; flex-shrink: 0;
}

/* ── Arena ── */
#arena {
  flex: 1; min-width: 280px; height: 100%; position: relative;
  display: flex; flex-direction: column; justify-content: space-between;
}
#arena .bg-layer {
  position: absolute; inset: 0;
  background: url('public/assets/images/background.jpg') center/cover;
  opacity: 0.6; image-rendering: pixelated;
}
#arena .arena-content { position: relative; z-index: 10; display: flex; flex-direction: column; height: 100%; }

/* HP bars */
.hp-bars { display: flex; justify-content: space-between; padding: 12px; width: 100%; }
.hp-bar-group { display: flex; flex-direction: column; gap: 2px; }
.hp-bar-group.player { align-items: flex-start; }
.hp-bar-group.boss { align-items: flex-end; }
.hp-bar-label { font-size: 9px; }
.hp-bar-label.player { color: var(--accent); }
.hp-bar-label.boss { color: var(--destructive); }
.hp-bar-track {
  height: 14px; border: 2px solid #000; background: rgba(15,23,42,.8);
  overflow: hidden; padding: 2px;
}
.hp-bar-track.player { width: 130px; }
.hp-bar-track.boss { width: 130px; display: flex; justify-content: flex-end; }
.hp-bar-fill { height: 100%; transition: width 0.3s; }
.hp-bar-fill.player { background: var(--accent); }
.hp-bar-fill.boss { background: var(--destructive); }

/* Sprites */
.battle-scene {
  flex: 1; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 40px 16px;
}
.sprite-container { position: relative; display: flex; flex-direction: column; align-items: center; }
.sprite-box {
  overflow: hidden; position: relative;
}
.sprite-box.player { width: 300px; height: 300px; }
.sprite-box.boss { width: 320px; height: 320px; }
.sprite-box img {
  position: absolute; top: 0; height: 100%;
  image-rendering: pixelated; max-width: none;
}
.sprite-box.player img { width: 1800px; }
.sprite-box.boss img { width: 1920px; transform: scaleX(-1); }
.sprite-label { font-size: 10px; margin-top: 4px; }
.sprite-label.boss { color: var(--destructive); }

/* Hit flash */
.sprite-hit {
  filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5) !important;
  transition: filter 0.1s;
}

/* ── Visualizer ── */
#visualizer {
  flex: 1; min-width: 280px; height: 100%; padding: 14px;
  display: flex; flex-direction: column; gap: 16px;
}
#visualizer h3 { font-size: 11px; color: var(--warning); display: flex; align-items: center; gap: 6px; }

.ll-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px; }
.ll-node {
  width: 40px; height: 40px; border: 3px solid #000;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: bold; box-shadow: var(--shadow-sm);
}
.ll-node.reversed { border-color: var(--accent); background: rgba(57,255,20,.15); color: var(--accent); }
.ll-node.remaining { background: var(--secondary); }
.ll-arrow { font-size: 16px; font-weight: bold; }
.ll-arrow.reversed { color: var(--accent); }
.ll-arrow.remaining { color: var(--fg); }

.pointers { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 8px; }
.pointer-box { text-align: center; }
.pointer-box .pname { font-size: 8px; color: var(--muted); margin-bottom: 2px; }
.pointer-box .pval {
  min-width: 50px; height: 24px; border: 2px solid; display: flex;
  align-items: center; justify-content: center; font-size: 12px; font-weight: bold;
  padding: 0 4px;
}
.pval-prev { border-style: dashed; border-color: rgba(239,68,68,.4); color: var(--destructive); }
.pval-curr { background: var(--accent); border-color: #000; color: #000; box-shadow: var(--shadow-sm); }
.pval-next { border-style: dashed; border-color: rgba(96,165,250,.4); color: var(--blue); }

/* ── Console ── */
#console-wrapper { flex: 1; min-height: 0; position: relative; }
#console-area { height: 100%; display: flex; flex-direction: column; }
.console-header {
  background: #0a0f1a; padding: 6px 12px; font-size: 9px;
  border-bottom: 2px solid #000; color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.console-body { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.console-text { font-size: 16px; line-height: 1.8; min-height: 2.5em; white-space: pre-wrap; }
.console-cursor { display: inline-block; width: 10px; height: 18px; background: var(--fg); margin-left: 2px; vertical-align: middle; animation: blink 0.8s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

.options-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.option-btn {
  font-family: 'zpix', sans-serif; font-size: 10px; text-align: left; cursor: pointer;
  border: var(--border); padding: 14px 16px;
  background: var(--secondary); color: var(--fg);
  box-shadow: var(--shadow-sm); transition: all 0.1s;
  display: flex; align-items: flex-start; gap: 10px;
  text-transform: none; letter-spacing: 0;
}
.option-btn:hover { background: #3b4f6b; }
.option-btn:active { transform: translate(2px, 2px); box-shadow: none; }
.option-btn:disabled { opacity: 0.5; pointer-events: none; }
.option-btn .key { color: var(--warning); font-size: 14px; flex-shrink: 0; font-weight: bold; }
.option-btn.correct { background: var(--accent) !important; color: #000 !important; }
.option-btn.wrong { background: var(--destructive) !important; color: #fff !important; animation: shake 0.3s ease; }

/* Feedback overlay */
.feedback-overlay {
  position: absolute; inset: 0; z-index: 20; border: 3px solid #000;
  box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center;
  text-align: center; padding: 20px; font-size: 24px;
}
.fb-correct { background: var(--accent); color: #000; }
.fb-wrong { background: var(--destructive); color: #fff; }

/* ========== Profile View ========== */
#profile-view {
  flex: 1; display: flex; gap: 12px; overflow: hidden; width: 100%; max-width: 1280px; margin: 0 auto;
}
#profile-view .left-col {
  width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px;
}
#profile-view .right-col {
  flex: 1; display: flex; flex-direction: column; gap: 12px; overflow: hidden;
}
.profile-avatar-card { padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
.profile-avatar-card .bg { position: absolute; inset: 0; background: url('public/assets/images/background.jpg') center/cover; opacity: .2; image-rendering: pixelated; }
.profile-avatar-card .content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.avatar-box {
  width: 100px; height: 100px; border: 4px solid #000; box-shadow: var(--shadow-sm);
  background: var(--secondary); display: flex; align-items: center; justify-content: center;
  margin-bottom: 8px; overflow: hidden;
}
.avatar-box img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }

.exp-bar-track {
  width: 100%; height: 14px; border: 2px solid #000;
  background: rgba(15,23,42,.8); overflow: hidden; padding: 2px; margin: 4px 0;
}
.exp-bar-fill { height: 100%; background: var(--blue); transition: width .3s; }

.stat-table { padding: 12px; }
.stat-table .stat-item {
  display: flex; justify-content: space-between; align-items: center; padding: 7px 0;
  font-size: 12px;
}

/* Achievements */
.ach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ach-card {
  border: 2px solid #000; padding: 10px; text-align: center;
  transition: all .3s;
}
.ach-card.unlocked { background: var(--secondary); }
.ach-card.locked { background: rgba(51,65,85,.3); opacity: .6; filter: grayscale(1); }
.ach-card .ach-icon {
  width: 36px; height: 36px; margin: 0 auto 6px; border-radius: 50%;
  border: 2px solid #000; display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.ach-card.unlocked .ach-icon { background: rgba(57,255,20,.15); color: var(--accent); }
.ach-card.locked .ach-icon { background: var(--primary); color: var(--muted); }
.ach-card .ach-title { font-size: 9px; margin-bottom: 2px; }
.ach-card .ach-desc { font-size: 8px; color: var(--muted); }

/* History */
.history-list { overflow-y: auto; flex: 1; }
.history-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border: 2px solid #000; margin-bottom: 4px; font-size: 9px;
  background: rgba(15,23,42,.5); cursor: pointer; transition: background .2s;
}
.history-item:hover { background: var(--secondary); }
.history-item .result { margin-left: auto; font-weight: bold; }
.history-item .result.win { color: var(--accent); }
.history-item .result.lose { color: var(--destructive); }

/* ========== Modals ========== */
.modal-bg {
  position: fixed; inset: 0; z-index: 50; display: flex;
  align-items: center; justify-content: center; padding: 16px;
}
.upload-bg { background: rgba(0,0,0,.8); backdrop-filter: blur(4px); }
.victory-bg { background: rgba(0,0,0,.8); backdrop-filter: blur(4px); }
.gameover-bg { background: rgba(0,0,0,.9); backdrop-filter: blur(4px); }

.modal-card { max-width: 500px; width: 100%; padding: 24px; position: relative; }
.modal-card textarea {
  width: 100%; height: 140px; font-family: 'zpix', sans-serif; font-size: 12px;
  background: var(--secondary); color: var(--fg); border: 3px solid #000;
  padding: 10px; resize: vertical; box-shadow: var(--shadow-sm);
}
.modal-card textarea:focus { outline: none; border-color: var(--accent); }
.modal-close {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px;
}
.modal-close:hover { color: var(--fg); }

.victory-card { border-color: var(--warning) !important; box-shadow: 0 0 20px rgba(255,215,0,.3), var(--shadow) !important; padding: 28px; text-align: center; }
.gameover-card { border-color: var(--destructive) !important; box-shadow: 0 0 20px rgba(239,68,68,.3), var(--shadow) !important; padding: 28px; text-align: center; }

/* ========== Achievement Toast ========== */
.ach-toast {
  position: fixed; bottom: 16px; right: 16px; z-index: 70;
  background: var(--secondary); border: 4px solid var(--warning);
  box-shadow: 0 0 15px rgba(255,215,0,.5); padding: 12px 16px;
  display: flex; align-items: center; gap: 12px; min-width: 220px;
  animation: toastIn 0.4s ease-out;
}

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .top-row { flex-direction: column; height: auto !important; }
  #arena { min-height: 200px; }
  #visualizer { min-height: 160px; }
  .options-grid { grid-template-columns: 1fr; }
  #profile-view { flex-direction: column; }
  #profile-view .left-col { width: 100%; }
  .ach-grid { grid-template-columns: repeat(2, 1fr); }
  .sprite-box.player { width: 180px; height: 180px; }
  .sprite-box.boss { width: 192px; height: 192px; }
  .sprite-box.player img { width: 1080px; }
  .sprite-box.boss img { width: 1152px; }
  .battle-scene { padding: 0 16px 8px; }
}
</style>
</head>
<body>

<div id="app">
  <!-- ═══════════ Header ═══════════ -->
  <header id="header">
    <h1>
      <i class="ra ra-dragon"></i>
      <span id="header-title">当前关卡: 链表魔龙</span>
    </h1>
    <div class="stats-row">
      <span><i class="ra ra-crystal-wand" style="color:var(--blue)"></i> 经验: <b id="header-exp">0</b></span>
      <span style="color:var(--warning)"><i class="ra ra-gold-bar" style="color:var(--warning)"></i> 金币: <b id="header-gold">0</b></span>
      <button class="pixel-btn pixel-btn-default pixel-btn-sm" onclick="toggleView()" id="btn-toggle-view">
        <i class="ra ra-player"></i> 档案
      </button>
      <button class="pixel-btn pixel-btn-accent pixel-btn-sm" onclick="openUploadModal()">
        <i class="ra ra-book"></i> 新挑战
      </button>
    </div>
  </header>

  <!-- ═══════════ Game View ═══════════ -->
  <div id="game-view">
    <!-- Top: Arena + Visualizer -->
    <div class="top-row">
      <!-- Arena -->
      <div id="arena" class="pixel-card pixel-card-dark">
        <div class="bg-layer"></div>
        <div class="arena-content">
          <div class="hp-bars">
            <div class="hp-bar-group player">
              <span class="hp-bar-label player">英雄生命值</span>
              <div class="hp-bar-track player">
                <div class="hp-bar-fill player" id="player-hp-bar" style="width:100%"></div>
              </div>
            </div>
            <div class="hp-bar-group boss">
              <span class="hp-bar-label boss">怪物生命值</span>
              <div class="hp-bar-track boss">
                <div class="hp-bar-fill boss" id="boss-hp-bar" style="width:100%"></div>
              </div>
            </div>
          </div>
          <div class="battle-scene">
            <div class="sprite-container">
              <div class="sprite-box player" id="hero-sprite-box">
                <img src="public/assets/images/hero_idle.png" alt="hero" id="hero-sprite-img" style="left:0">
              </div>
            </div>
            <div class="sprite-container">
              <div class="sprite-box boss" id="boss-sprite-box">
                <img src="public/assets/images/goblin_idle.png" alt="boss" id="boss-sprite-img" style="left:0">
              </div>
              <span class="sprite-label boss" id="boss-label">链表魔龙</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Visualizer -->
      <div id="visualizer" class="pixel-card pixel-card-dark">
        <h3><i class="ra ra-scroll-unfurled"></i> 内存状态</h3>
        <div id="ll-display" style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:20px;">
          <div class="ll-row" id="ll-nodes"></div>
          <div class="pointers" id="ll-pointers"></div>
        </div>
      </div>
    </div>

    <!-- Bottom: Console -->
    <div id="console-wrapper">
      <div id="console-area" class="pixel-card pixel-card-default" style="border-top:0;">
        <div class="console-header">
          ▸ 战斗日志 ── Step <span id="step-num">1</span>/<span id="step-total">3</span>
        </div>
        <div class="console-body">
          <div class="console-text" id="console-text"></div>
          <div class="options-grid" id="options-grid"></div>
        </div>
      </div>
      <div class="feedback-overlay hidden" id="feedback-overlay"></div>
    </div>
  </div>

  <!-- ═══════════ Profile View ═══════════ -->
  <div id="profile-view" class="hidden">
    <div class="left-col">
      <div class="pixel-card pixel-card-dark profile-avatar-card">
        <div class="bg"></div>
        <div class="content">
          <h2 style="font-size:14px;color:var(--accent);margin-bottom:10px;"><i class="ra ra-helmet"></i> 勇者档案</h2>
          <div class="avatar-box">
            <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=HeroKnight" alt="avatar" onerror="this.style.display='none'">
          </div>
          <h3 style="font-size:12px;margin-bottom:2px;">Pixel Hero</h3>
          <p style="font-size:10px;color:var(--muted);margin-bottom:8px;"><i class="ra ra-crossed-swords"></i> Lv.<span id="profile-level">1</span> 算法剑士</p>
          <div style="width:100%;">
            <div style="display:flex;justify-content:space-between;font-size:8px;margin-bottom:2px;">
              <span>EXP</span><span id="profile-exp-text">0 / 1000</span>
            </div>
            <div class="exp-bar-track">
              <div class="exp-bar-fill" id="profile-exp-bar" style="width:0%"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="pixel-card pixel-card-default stat-table">
        <h3 style="font-size:10px;margin-bottom:8px;border-bottom:2px solid #000;padding-bottom:6px;">
          <i class="ra ra-bar-chart"></i> 数据统计
        </h3>
        <div class="stat-item"><span><i class="ra ra-scroll-unfurled"></i> 斩杀魔物</span><span style="color:var(--accent);font-weight:bold;" id="stat-solved">0 只</span></div>
        <div class="stat-item"><span><i class="ra ra-gold-bar" style="color:var(--warning)"></i> 累计财富</span><span style="color:var(--warning);font-weight:bold;" id="stat-gold">0 G</span></div>
        <div class="stat-item"><span><i class="ra ra-swords" style="color:var(--destructive)"></i> 胜率</span><span style="font-weight:bold;" id="stat-rate">-</span></div>
      </div>
    </div>

    <div class="right-col">
      <div class="pixel-card pixel-card-dark" style="padding:14px;">
        <h3 style="font-size:10px;color:var(--warning);margin-bottom:10px;border-bottom:2px solid rgba(0,0,0,.5);padding-bottom:6px;">
          <i class="ra ra-trophy"></i> 荣誉勋章 (成就)
        </h3>
        <div class="ach-grid" id="ach-grid"></div>
      </div>
      <div class="pixel-card pixel-card-default history-list" style="padding:14px;">
        <h3 style="font-size:10px;margin-bottom:10px;border-bottom:2px solid #000;padding-bottom:6px;">
          <i class="ra ra-hourglass"></i> 战斗编年史 (历史)
        </h3>

<script>
// ==================== SPRITE ANIMATION ENGINE ====================
// Replicates the original SpriteAnimator component behavior
class SpriteAnimator {
  constructor(imgId, frameCount, fps) {
    this.img = document.getElementById(imgId);
    this.frameCount = frameCount;
    this.fps = fps || 8;
    this.frame = 0;
    this.timer = null;
    this._isHit = false;
  }

  start() {
    if (this.timer) return;
    this.timer = setInterval(() => {
      this.frame = (this.frame + 1) % this.frameCount;
      this._updateFrame();
    }, 1000 / this.fps);
  }

  stop() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  }

  hit(duration) {
    if (this._isHit) return;
    this._isHit = true;
    this.img.classList.add('sprite-hit');
    const box = this.img.parentElement;
    if (box) box.classList.add('animate-shake');
    setTimeout(() => {
      this.img.classList.remove('sprite-hit');
      if (box) box.classList.remove('animate-shake');
      this._isHit = false;
    }, duration || 500);
  }

  _updateFrame() {
    const box = this.img.parentElement;
    if (!box) return;
    // In the original: left = -(frame * frameWidth * scale)
    // But we use image width/height set via CSS, so we just shift by box width
    const boxWidth = box.offsetWidth;
    this.img.style.left = -(this.frame * boxWidth) + 'px';
  }
}

// ==================== DATA ====================

      { step_id:2, description:"数组变为[3,5,8,1]。比较5和8。",
        visual_state:{ reversed:[3], remaining:[5,8,1], prev:3, curr:5, next:8 },
        question:"5 < 8，应该怎么做？", options:[

          { id:"B", text:"交换5和8", is_correct:false, damage:0, feedback:"错误！正序对不需要交换。" }]},
      { step_id:3, description:"数组[3,5,8,1]。比较8和1。",
        visual_state:{ reversed:[3,5], remaining:[8,1], prev:5, curr:8, next:1 },
        question:"8 > 1，应该怎么做？", options:[
          { id:"A", text:"交换8和1", is_correct:true, damage:20, feedback:"正确！8和1交换，第一轮结束，最大值8已浮到末尾。战斗胜利！" },
          { id:"B", text:"保持不动", is_correct:false, damage:0, feedback:"错误！逆序对必须交换。" }]}
    ]
  }
];

// ==================== GAME STATE ====================
let currentView = 'game';
let currentStep = 0;
let playerHp = 100;
let feedbackTimer = null;
let typewriterTimer = null;
let demoLevelIndex = 0;
let levelData = DEMO_LEVELS[0];
let showVictory = false, showGameOver = false;
let rewards = { exp: 0, gold: 0 };

let userStats = {
  exp: 0, maxExp: 1000, level: 1, solvedCount: 0, gold: 0,
  history: [],
  achievements: ACHIEVEMENTS.map(a => ({...a}))
};

let achievementQueue = [];
let prevUnlocked = ACHIEVEMENTS.map(() => false);
let toastTimer = null;

let heroAnim = null;
let bossAnim = null;

// ==================== INIT ====================
function init() {
  heroAnim = new SpriteAnimator('hero-sprite-img', 6, 8);
  bossAnim = new SpriteAnimator('boss-sprite-img', 6, 8);
  heroAnim.start();
  bossAnim.start();
  prevUnlocked = userStats.achievements.map(() => false);
  renderAll();
}

// ==================== RENDER ====================
function renderAll() {
  renderArena();
  renderVisualizer();
  renderConsole();
  renderProfile();
  // Header
  document.getElementById('header-exp').textContent = userStats.exp;
  document.getElementById('header-gold').textContent = userStats.gold;
  document.getElementById('header-title').textContent = '当前关卡: ' + levelData.monster_name;
  document.getElementById('boss-label').textContent = levelData.monster_name;
}

function renderArena() {
  const bossHp = levelData.total_steps > 0
    ? Math.max(0, 100 - Math.floor((currentStep / levelData.total_steps) * 100))
    : 100;
  document.getElementById('player-hp-bar').style.width = playerHp + '%';
  document.getElementById('boss-hp-bar').style.width = bossHp + '%';
}

function renderVisualizer() {
  const vs = levelData.steps[currentStep].visual_state;
  const nodesDiv = document.getElementById('ll-nodes');
  const ptrDiv = document.getElementById('ll-pointers');

  // Linked list nodes
  let h = '';
  if (vs.reversed && vs.reversed.length > 0) {
    vs.reversed.forEach((n, i) => {
      h += `<div class="ll-node reversed">${n}</div>`;
      h += `<span class="ll-arrow reversed">→</span>`;
    });
  }
  if (vs.remaining && vs.remaining.length > 0) {
    vs.remaining.forEach((n, i) => {
      h += `<div class="ll-node remaining">${n}</div>`;
      if (i < vs.remaining.length - 1) h += `<span class="ll-arrow remaining">→</span>`;
    });
  }
  nodesDiv.innerHTML = h || '<span style="color:var(--muted);font-size:12px;">（空链表）</span>';

  // Pointers
  ptrDiv.innerHTML = `
    <div class="pointer-box">
      <div class="pname">prev</div>
      <div class="pval pval-prev">${vs.prev === null ? 'null' : vs.prev}</div>
    </div>
    <div class="pointer-box">
      <div class="pname">curr</div>
      <div class="pval pval-curr">${vs.curr === null ? 'null' : vs.curr}</div>
    </div>
    <div class="pointer-box">
      <div class="pname">next</div>
      <div class="pval pval-next">${vs.next === null ? 'null' : vs.next}</div>
    </div>`;
}

function renderConsole() {
  const step = levelData.steps[currentStep];
  document.getElementById('step-num').textContent = currentStep + 1;
  document.getElementById('step-total').textContent = levelData.total_steps;

  // Clear previous typewriter
  if (typewriterTimer) clearInterval(typewriterTimer);

  // Typewriter effect with cursor
  const textEl = document.getElementById('console-text');
  const fullText = step.description + '\n\n' + step.question;
  textEl.innerHTML = '<span class="console-cursor"></span>';
  let i = 0;
  typewriterTimer = setInterval(() => {
    if (i < fullText.length) {
      const cursor = textEl.querySelector('.console-cursor');
      textEl.insertBefore(document.createTextNode(fullText.charAt(i)), cursor);
      i++;
    } else {
      clearInterval(typewriterTimer);
      typewriterTimer = null;
      const cursor = textEl.querySelector('.console-cursor');
      if (cursor) cursor.remove();
    }
  }, 30);

  // Options
  const optGrid = document.getElementById('options-grid');
  const labels = ['A', 'B', 'C', 'D'];
  optGrid.innerHTML = step.options.map((o, i) =>
    `<button class="option-btn" onclick="selectOption(${o.is_correct},'${escAttr(o.feedback)}',this)" data-idx="${i}">
      <span class="key">[${labels[i]}]</span>
      <span>⚔️ ${escHtml(o.text)}</span>
    </button>`
  ).join('');
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function renderProfile() {
  document.getElementById('profile-level').textContent = userStats.level;
  const expPct = Math.min(100, Math.floor((userStats.exp / userStats.maxExp) * 100));
  document.getElementById('profile-exp-bar').style.width = expPct + '%';
  document.getElementById('profile-exp-text').textContent = userStats.exp + ' / ' + userStats.maxExp;
  document.getElementById('stat-solved').textContent = userStats.solvedCount + ' 只';
  document.getElementById('stat-gold').textContent = userStats.gold + ' G';
  const total = userStats.history.length;
  const wins = userStats.history.filter(h => h.result === 'victory').length;
  document.getElementById('stat-rate').textContent = total > 0 ? Math.round((wins/total)*100) + '%' : '-';

  // Achievements
  document.getElementById('ach-grid').innerHTML = userStats.achievements.map(a =>
    `<div class="ach-card ${a.unlocked ? 'unlocked' : 'locked'}">
      <div class="ach-icon"><i class="ra ${a.icon}"></i></div>
      <div class="ach-title">${a.title}</div>
      <div class="ach-desc">${a.desc}</div>
    </div>`
  ).join('');

  // History
  const hDiv = document.getElementById('history-entries');
  if (userStats.history.length === 0) {
    hDiv.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:12px;">暂无战斗记录，快去挑战魔物吧！</div>';
  } else {
    hDiv.innerHTML = userStats.history.map(h =>
      `<div class="history-item">
        <i class="ra ${h.result === 'victory' ? 'ra-laurel' : 'ra-skull'}" style="color:${h.result === 'victory' ? 'var(--accent)' : 'var(--destructive)'};font-size:16px;"></i>
        <div style="flex:1;">
          <div style="font-size:10px;">${h.problem}</div>
          <div style="font-size:8px;color:var(--muted);">${h.date} · 对战 ${h.boss}</div>
        </div>
        <span class="result ${h.result === 'victory' ? 'win' : 'lose'}">
          <i class="ra ${h.result === 'victory' ? 'ra-laurel' : 'ra-skull'}"></i>
          ${h.result === 'victory' ? '胜利' : '阵亡'}
        </span>
      </div>`
    ).join('');
  }
}

// ==================== GAME LOGIC ====================
function selectOption(isCorrect, feedbackMsg, btnEl) {
  if (feedbackTimer) clearTimeout(feedbackTimer);
  if (typewriterTimer) { clearInterval(typewriterTimer); typewriterTimer = null; }

  // Remove cursor
  const cursor = document.querySelector('.console-cursor');
  if (cursor) cursor.remove();

  // Disable all option buttons
  document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

  // Highlight clicked button
  btnEl.classList.add(isCorrect ? 'correct' : 'wrong');

  // Sprite animations
  if (isCorrect) {
    bossAnim.hit(500);
  } else {
    heroAnim.hit(500);
  }

  // Show feedback
  const overlay = document.getElementById('feedback-overlay');
  overlay.className = 'feedback-overlay ' + (isCorrect ? 'fb-correct' : 'fb-wrong');
  overlay.innerHTML = `<div>${feedbackMsg}</div>`;
  overlay.classList.remove('hidden');

  if (isCorrect) {
    feedbackTimer = setTimeout(() => {
      overlay.classList.add('hidden');
      if (currentStep < levelData.total_steps - 1) {
        currentStep++;
        renderArena();
        renderVisualizer();
        renderConsole();
      } else {
        // VICTORY!
        const expEarned = Math.floor(Math.random() * 50) + 100;
        const goldEarned = Math.floor(Math.random() * 30) + 20;
        rewards = { exp: expEarned, gold: goldEarned };
        showVictory = true;
        document.getElementById('victory-boss').textContent = levelData.monster_name;
        document.getElementById('victory-exp').textContent = '+' + expEarned;
        document.getElementById('victory-gold').textContent = '+' + goldEarned;
        document.getElementById('victory-overlay').classList.remove('hidden');

        // Update stats
        let newExp = userStats.exp + expEarned;
        let newLevel = userStats.level;
        let newMaxExp = userStats.maxExp;
        if (newExp >= newMaxExp) { newLevel++; newExp -= newMaxExp; newMaxExp = Math.floor(newMaxExp * 1.5); }
        const newGold = userStats.gold + goldEarned;
        const newSolved = userStats.solvedCount + 1;
        const newHistory = [{
          id: Date.now().toString(), date: new Date().toLocaleDateString(),
          problem: '算法题挑战', boss: levelData.monster_name, result: 'victory'
        }, ...userStats.history];

        const newAch = userStats.achievements.map((a, i) => {
          const cpy = {...a};
          if (i === 0 && newSolved >= 1) cpy.unlocked = true;
          if (i === 1 && newSolved >= 5) cpy.unlocked = true;
          if (i === 2 && newSolved >= 10) cpy.unlocked = true;
          if (i === 3 && playerHp === 100) cpy.unlocked = true;
          if (i === 5 && newGold >= 200) cpy.unlocked = true;
          return cpy;
        });
        checkAchievements(newAch);
        userStats = { ...userStats, exp: newExp, maxExp: newMaxExp, level: newLevel, gold: newGold, solvedCount: newSolved, history: newHistory, achievements: newAch };
        renderAll();
      }
    }, 1800);
  } else {
    playerHp = Math.max(0, playerHp - 20);
    renderArena();

    if (playerHp <= 0) {
      feedbackTimer = setTimeout(() => {
        overlay.classList.add('hidden');
        showGameOver = true;
        document.getElementById('gameover-overlay').classList.remove('hidden');

        const newHistory = [{
          id: Date.now().toString(), date: new Date().toLocaleDateString(),
          problem: '算法题挑战', boss: levelData.monster_name, result: 'defeat'
        }, ...userStats.history];
        const deathCount = newHistory.filter(h => h.result === 'defeat').length;
        const newAch = userStats.achievements.map((a, i) => {
          const cpy = {...a};
          if (i === 4 && deathCount >= 3) cpy.unlocked = true;
          return cpy;
        });
        checkAchievements(newAch);
        userStats = { ...userStats, history: newHistory, achievements: newAch };
        renderAll();
      }, 800);
    } else {
      feedbackTimer = setTimeout(() => {
        overlay.classList.add('hidden');
        renderConsole();
        renderArena();
      }, 2500);
    }
  }
}

function checkAchievements(newAch) {
  const newly = newAch.filter((a, i) => a.unlocked && !prevUnlocked[i]);
  prevUnlocked = newAch.map(a => a.unlocked);
  if (newly.length > 0) {
    setTimeout(() => { achievementQueue.push(...newly); showNextToast(); }, 1000);
  }
}

function showNextToast() {
  if (toastTimer) clearTimeout(toastTimer);
  if (achievementQueue.length === 0) {
    document.getElementById('ach-toast').classList.add('hidden');
    return;
  }
  const a = achievementQueue[0];
  document.getElementById('ach-toast-icon').innerHTML = `<i class="ra ${a.icon}"></i>`;
  document.getElementById('ach-toast-title').textContent = a.title;
  document.getElementById('ach-toast').classList.remove('hidden');
  toastTimer = setTimeout(() => { achievementQueue.shift(); showNextToast(); }, 4000);
}

function resetGame() {
  currentStep = 0;
  playerHp = 100;
  showVictory = false;
  showGameOver = false;
  document.getElementById('victory-overlay').classList.add('hidden');
  document.getElementById('gameover-overlay').classList.add('hidden');
  document.getElementById('feedback-overlay').classList.add('hidden');
  renderAll();
}

// ==================== UPLOAD / GENERATE ====================
function openUploadModal() {
  document.getElementById('upload-modal').classList.remove('hidden');
  document.getElementById('upload-textarea').value = '';
}
function closeUploadModal() {
  document.getElementById('upload-modal').classList.add('hidden');
}
function handleGenerate() {
  demoLevelIndex = (demoLevelIndex + 1) % DEMO_LEVELS.length;
  levelData = DEMO_LEVELS[demoLevelIndex];
  closeUploadModal();
  resetGame();
}

// ==================== VIEW TOGGLE ====================
function toggleView() {
  const gv = document.getElementById('game-view');
  const pv = document.getElementById('profile-view');
  const btn = document.getElementById('btn-toggle-view');
  if (currentView === 'game') {
    currentView = 'profile';
    gv.style.display = 'none';
    pv.classList.remove('hidden');
    btn.innerHTML = '<i class="ra ra-crossed-swords"></i> 战斗';
    renderProfile();
  } else {
    currentView = 'game';
    gv.style.display = '';
    pv.classList.add('hidden');
    btn.innerHTML = '<i class="ra ra-player"></i> 档案';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
