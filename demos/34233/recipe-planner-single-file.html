<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>食谱助手 - AI 智能规划</title>
  <style>
    /* ===== Botanical Garden 主题变量 ===== */
    :root {
      --fern-green: #4a7c59;
      --fern-green-light: #5c9e6e;
      --fern-green-dark: #3a6347;
      --fern-green-bg: #e8f2ea;
      --marigold: #f9a620;
      --marigold-light: #fbbd4d;
      --marigold-dark: #d88e0a;
      --marigold-bg: #fef7e8;
      --terracotta: #b7472a;
      --terracotta-light: #d45d3d;
      --terracotta-bg: #fdf0ec;
      --cream: #f5f3ed;
      --cream-dark: #e8e4d8;
      --cream-light: #faf9f6;

      --color-primary: var(--fern-green);
      --color-primary-hover: var(--fern-green-light);
      --color-primary-bg: var(--fern-green-bg);
      --color-accent: var(--marigold);
      --color-accent-hover: var(--marigold-light);
      --color-accent-bg: var(--marigold-bg);
      --color-danger: var(--terracotta);
      --color-danger-hover: var(--terracotta-light);
      --color-danger-bg: var(--terracotta-bg);
      --color-bg: var(--cream-light);
      --color-surface: #ffffff;
      --color-border: var(--cream-dark);
      --color-text: #2d2a24;
      --color-text-secondary: #6b6558;
      --color-text-muted: #a09b8f;

      --font-heading: 'DejaVu Serif', 'Noto Serif CJK SC', 'WenQuanYi Micro Hei', serif;
      --font-body: 'DejaVu Sans', 'Noto Sans CJK SC', 'WenQuanYi Micro Hei', sans-serif;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.10);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font-body);
      color: var(--color-text);
      background: var(--color-bg);
      line-height: 1.6;
      min-height: 100vh;
    }
    h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: 700; line-height: 1.3; }
    h1 { font-size: 1.75rem; } h2 { font-size: 1.35rem; } h3 { font-size: 1.1rem; }
    button { cursor: pointer; border: none; font-family: inherit; font-size: inherit; transition: all var(--transition); }
    input, select, textarea { font-family: inherit; font-size: inherit; transition: all var(--transition); }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--color-primary); outline-offset: -1px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

    .app { display: flex; min-height: 100vh; }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .content { flex: 1; padding: 24px; overflow-y: auto; background: var(--color-bg); }

    /* 侧边栏 */
    .sidebar {
      width: 220px; min-width: 220px; background: var(--color-surface);
      border-right: 1px solid var(--color-border); display: flex; flex-direction: column;
      padding: 20px 12px; box-shadow: var(--shadow-sm);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; border-bottom: 1px solid var(--color-border); margin-bottom: 16px; }
    .logo { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--color-accent-bg); display: flex; align-items: center; justify-content: center; color: var(--color-accent); }
    .brand-title { font-size: 1.1rem; color: var(--color-text); }
    .brand-subtitle { font-size: 0.72rem; color: var(--color-text-muted); font-family: var(--font-body); }
    .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md);
      font-size: 0.88rem; font-weight: 500; color: var(--color-text-secondary); background: transparent;
      text-align: left; font-family: inherit; width: 100%;
    }
    .nav-item:hover { background: var(--color-bg); }
    .nav-item.active { background: var(--color-primary-bg); color: var(--color-primary); font-weight: 600; }
    .nav-item .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; background: var(--color-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
    .sidebar-footer { padding: 16px 8px 0; border-top: 1px solid var(--color-border); margin-top: auto; }
    .sidebar-footer p { font-size: 0.7rem; color: var(--color-text-muted); }

    /* 顶部栏 */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); box-shadow: var(--shadow-sm);
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .page-title { font-size: 1.1rem; font-family: var(--font-heading); color: var(--color-text); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .stat { display: flex; align-items: center; gap: 4px; }
    .stat-value { font-size: 0.9rem; font-weight: 700; color: var(--color-text); }
    .stat-label { font-size: 0.78rem; color: var(--color-text-muted); }
    .divider-v { width: 1px; height: 20px; background: var(--color-border); }

    /* 通用组件 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 18px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.9rem;
      letter-spacing: 0.01em; white-space: nowrap; background: transparent; color: var(--color-text);
    }
    .btn-primary { background: var(--color-primary); color: #fff; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .btn-accent { background: var(--color-accent); color: #fff; box-shadow: var(--shadow-sm); font-size: 1rem; padding: 12px 28px; }
    .btn-accent:hover { background: var(--color-accent-hover); box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .btn-danger { background: var(--color-danger); color: #fff; }
    .btn-danger:hover { background: var(--color-danger-hover); }
    .btn-outline { background: transparent; color: var(--color-primary); border: 1.5px solid var(--color-primary); }
    .btn-outline:hover { background: var(--color-primary-bg); }
    .btn-ghost { background: transparent; color: var(--color-text-secondary); padding: 6px 10px; }
    .btn-ghost:hover { background: var(--color-bg); color: var(--color-text); }
    .btn-sm { padding: 4px 12px; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-md); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

    .card { background: var(--color-surface); border-radius: var(--radius-lg); border: 1px solid var(--color-border); padding: 20px; box-shadow: var(--shadow-sm); transition: box-shadow var(--transition); }
    .card:hover { box-shadow: var(--shadow-md); }
    .input {
      width: 100%; padding: 10px 14px; border: 1.5px solid var(--color-border); border-radius: var(--radius-md);
      background: var(--color-surface); color: var(--color-text); font-size: 0.9rem;
    }
    .input:focus { border-color: var(--color-primary); }
    .label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 4px; }
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 500; background: var(--color-primary-bg); color: var(--color-primary); }
    .tag-green { background: var(--color-primary-bg); color: var(--color-primary); }
    .tag-gold { background: var(--color-accent-bg); color: var(--marigold-dark); }
    .tag-red { background: var(--color-danger-bg); color: var(--color-danger); }

    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: var(--radius-md); font-size: 0.88rem; font-weight: 500; color: #fff; box-shadow: var(--shadow-lg); animation: toastIn 0.3s ease; cursor: pointer; }
    .toast-success { background: var(--color-primary); }
    .toast-error { background: var(--color-danger); }
    .toast-info { background: #5b7eb5; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; text-align: center; color: var(--color-text-muted); }
    .empty-state > svg { margin-bottom: 16px; opacity: 0.4; }
    .empty-state h3 { font-family: var(--font-heading); color: var(--color-text-secondary); margin-bottom: 6px; }
    .empty-state p { font-size: 0.88rem; max-width: 280px; }

    @media (max-width: 768px) {
      html { font-size: 14px; }
      .sidebar { width: 64px; min-width: 64px; padding: 16px 8px; }
      .brand, .sidebar-footer, .nav-item span { display: none; }
      .nav-item { justify-content: center; padding: 12px; }
      .card { padding: 14px; border-radius: var(--radius-md); }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo" id="brand-logo"></div>
        <div>
          <h1 class="brand-title">食谱助手</h1>
          <p class="brand-subtitle">AI 智能规划</p>
        </div>
      </div>
      <nav class="nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer"><p>Botanical Garden</p></div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-left" id="header-left"></div>
        <div class="header-right" id="header-right"></div>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    /* ===== 图标 SVG ===== */
    const ICONS = {
      sparkles: (s=20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 5H5"/><path d="M19 19v4"/><path d="M15 21h4"/></svg>`,

      settings: (s=18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`,

      refresh: (s=16) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>`,

    };
    function icon(name, size) { return ICONS[name] ? ICONS[name](size) : ''; }

        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({ model, messages, temperature, max_tokens: 4096 }),
      });
      if (!response.ok) {
        const errorBody = await response.text();
        let errorMsg;
        try { const err = JSON.parse(errorBody); errorMsg = err.error?.message || `HTTP ${response.status}`; }
        catch { errorMsg = `HTTP ${response.status}: ${errorBody.slice(0, 200)}`; }
        throw new Error(`LLM 调用失败: ${errorMsg}`);
      }
      const data = await response.json();
      return data.choices[0].message.content;
    }

    function renderDishCard(dish, index) {

                <div style="display:flex;gap:2px;flex-shrink:0">
                  <button class="btn btn-ghost btn-sm" onclick="updateIngredient('${item.id}', {amount: Math.max(0, ${item.amount} - 1)})">${icon('minus', 14)}</button>

          </div>

      const quickAdd = Object.entries(ingredientCategories).map(([key, cat]) => `

          <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:0.88rem"><span style="color:var(--color-text-secondary);font-weight:500">API Key</span><span style="color:var(--color-text);font-family:monospace;font-size:0.82rem">${state.llmConfig.apiKey ? '已设置 (●●●●●●●)' : '未设置'}</span></div>
        </div>
      </div>`;
    }
    window.saveLLMConfig = function() {
      if (!llmForm.baseUrl || !llmForm.apiKey || !llmForm.model) { showToast('请填写完整的配置信息', 'error'); return; }
      setLLMConfig({ ...llmForm });
      showToast('配置已保存', 'success');
    };
    window.testLLM = async function() {
      const el = document.getElementById('content');
      el.dataset.testing = 'true'; render();
      try {
        await testLLMConnection(llmForm);
        showToast('连接测试成功！模型可用', 'success');
      } catch (e) {
        showToast(`连接失败: ${e.message}`, 'error');
      } finally {
        el.dataset.testing = 'false'; render();
      }
    };
    window.resetLLMConfig = function() {
      llmForm = { ...DEFAULT_LLM_CONFIG };
      setLLMConfig({ ...DEFAULT_LLM_CONFIG });
      showToast('已恢复默认配置', 'info');
    };

    /* ===== 历史记录 ===== */
    function renderHistory(el) {
      const grouped = {};
      state.history.forEach(item => {
        const date = item.mealPlan?.date || item.confirmedAt?.slice(0, 10) || '未知日期';
        if (!grouped[date]) grouped[date] = [];
        grouped[date].push(item);
      });
      const list = Object.entries(grouped).map(([date, items]) => `
        <div style="display:flex;flex-direction:column;gap:8px">
          <h4 style="font-size:0.8rem;color:var(--color-text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em">${date}</h4>
          ${items.map(item => `
            <div class="card" style="padding:14px 18px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <div style="display:flex;align-items:center;gap:8px">${icon('chefHat', 16)}<span style="font-weight:600;font-size:0.9rem">${item.mealPlan?.meal || '餐'}</span><span style="font-size:0.78rem;color:var(--color-text-muted)">${item.mealPlan?.servings}人</span></div>
                <span class="tag tag-green">${icon('clock', 12)} ${item.mealPlan?.totalTime}分钟</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${(item.mealPlan?.dishes || []).map(d => `<span style="padding:3px 10px;border-radius:20px;font-size:0.78rem;background:var(--color-primary-bg);color:var(--color-primary);font-weight:500">${d.name}</span>`).join('')}</div>
              ${item.summary ? `<p style="font-size:0.82rem;color:var(--color-text-muted);font-style:italic">${item.summary}</p>` : ''}
            </div>
          `).join('')}
        </div>
      `).join('');
      el.innerHTML = `
        <div style="max-width:700px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><h3>${state.history.length} 条历史记录</h3>${state.history.length ? `<button class="btn btn-ghost btn-sm" onclick="clearHistory()">${icon('trash', 14)} 清空</button>` : ''}</div>
          ${state.history.length ? `<div style="display:flex;flex-direction:column;gap:16px">${list}</div>` : `<div class="empty-state" style="margin-top:48px">${icon('calendar', 48)}<h3>暂无历史记录</h3><p>确认规划方案后会自动保存到历史记录</p></div>`}
        </div>
      `;
    }
    window.clearHistory = function() {
      state.history = []; saveStorage(STORAGE_KEYS.history, []);
      showToast('历史记录已清空', 'info'); render();
    };

    /* ===== 初始化 ===== */
    render();
  </script>
</body>
</html>
