<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聊天应用</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <div id="app"></div>

    <!-- 登录/注册页 -->
    <template id="tpl-auth">
        <div class="auth-page">
            <div class="auth-card">
                <div class="auth-logo">💬</div>
                <h1 class="auth-title">聊天应用</h1>
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>
                <form id="login-form" class="auth-form">
                    <input type="text" name="username" placeholder="用户名" required autocomplete="username">
                    <input type="password" name="password" placeholder="密码（至少6位）" required autocomplete="current-password">
                    <button type="submit" class="btn-primary">登录</button>
                </form>
                <form id="register-form" class="auth-form" style="display:none;">
                    <input type="text" name="username" placeholder="用户名" required autocomplete="username">
                    <input type="password" name="password" placeholder="密码（至少6位）" required autocomplete="new-password">
                    <input type="text" name="nickname" placeholder="昵称（可选）">
                    <button type="submit" class="btn-primary">注册</button>
                </form>
                <div id="auth-error" class="auth-error"></div>
            </div>
        </div>
    </template>

    <!-- 主应用 -->
    <template id="tpl-main">
        <div class="main-layout">
            <!-- 侧边栏 -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="user-info">
                        <div class="avatar" id="my-avatar"></div>
                        <div class="user-name" id="my-nickname"></div>
                    </div>
                    <div class="nav-tabs">
                        <button class="nav-tab active" data-view="chats" title="聊天">
                            <span>💬</span><span class="nav-label">聊天</span>
                        </button>
                        <button class="nav-tab" data-view="friends" title="好友">
                            <span>👥</span><span class="nav-label">好友</span>
                            <span class="badge" id="friend-request-badge" style="display:none;"></span>
                        </button>
                        <button class="nav-tab" data-view="settings" title="设置">
                            <span>⚙️</span><span class="nav-label">设置</span>
                        </button>
                    </div>
                </div>
                <div class="sidebar-content" id="sidebar-content"></div>
            </aside>

            <!-- 聊天区 -->
            <main class="chat-area" id="chat-area">
                <div class="chat-empty" id="chat-empty">
                    <div class="empty-icon">💬</div>
                    <p>选择一个会话开始聊天</p>
                </div>
            </main>
        </div>
    </template>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/ws.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
