# ========================================
# IM 聊天应用 - 配置文件
# ========================================

# 服务配置
server:
  host: "0.0.0.0"      # 监听地址，0.0.0.0 允许手机同局域网访问
  port: 8000

# JWT 配置
jwt:
  secret: "change_me_to_a_random_string_at_least_32_chars"  # 生产环境请修改
  expire_days: 7

# 默认 AI 机器人配置（启动时自动创建，可登录后在设置页修改）
default_bot:
  name: "AI助手"
  username: "ai_assistant"          # 默认 bot 登录名（系统占用，不可注册）
  nickname: "AI助手"
  provider: "local"                 # local | deepseek | openai
  # 本地 llama.cpp server（OpenAI 兼容协议，0 token）
  # 启动方式：运行 客服AI助手/start_local.bat 或手动启动 llama-server
  api_key: "local"
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen2.5"
  system_prompt: |
    你是一个友好的 AI 聊天助手。请用简洁、自然的语言回答用户问题。
    如果用户请求画图（如"画一张猫"），请回复 [IMAGE:图片描述]，系统会自动生成图片。
  max_history: 10
  temperature: 0.7
  max_tokens: 256
  image_gen_enabled: true

# 图片生成配置
image_gen:
  provider: "stub"                  # stub（PIL占位图，离线免费）| dall_e | jimeng
  cache_dir: "media/images"
  # DALL-E 配置（provider=dall_e 时使用）
  dall_e:
    api_key: ""
    size: "1024x1024"
