iginalText:`子曰：温故而知新，可以为师矣。
子曰：学而不思则罔，思而不学则殆。`,keyTerms:[{term:"罔",pinyin:"wǎng",meaning:"迷惑、迷茫",context:"形容只学习不思考的状态"},{term:"殆",pinyin:"dài",meaning:"危险、懈怠",context:"形容只思考不学习的后果"}],translation:`孔子说：在温习旧知识的过程中，能够有新的体会和发现，这样的人就可以做老师了。
孔子说：只学习而不思考，就会感到迷茫无所得；只思考而不学习，就会陷入空想的危险境地。`,interpretation:"这两段话揭示了学习的方法论：温故知新强调的是知识的融会贯通，学思结合强调的是学习与思考的辩证统一。这是中国古代教育思想中最具代表性的方法论。",characters:["孔子"],events:["杏坛讲学"],keywords:["学习方法","温故知新","学思结合","方法论"],modernLesson:"在信息爆炸的时代，批判性思维和知识整合能力比单纯记忆更重要。持续复盘、结合实践思考，是终身学习的核心方法。"},{id:"li-ren",title:"里仁篇",originalText:`子曰：里仁为美。择不处仁，焉得知？
子曰：君子怀德，小人怀土；君子怀刑，小人怀惠。`,keyTerms:[{term:"里",pinyin:"lǐ",meaning:"居住",context:"此处作动词用"},{term:"怀",pinyin:"huái",meaning:"挂念、放在心上",context:"表示内心所关注的对象"}],translation:`孔子说：居住在有仁德的地方是美好的。如果选择居所不居住在有仁德的地方，怎么能算是明智呢？
孔子说：君子心中挂念的是道德修养，小人心中挂念的是乡土利益；君子心中考虑的是法度规范，小人心中考虑的是恩惠私利。`,interpretation:'孔子以居所为例，说明环境对人的影响，强调选择的重要性。"君子与小人"的对比，揭示了两种不同的人生取向——追求精神价值与追求物质利益的区别。',characters:["孔子"],events:["仁道传播"],keywords:["仁德","环境","君子","小人","价值取向"],modernLesson:"选择什么样的环境和朋友圈，就会成为什么样的人。在职场中，与优秀的人为伍，关注长期价值而非短期利益，是个人成长的关键。"},{id:"shu-er",title:"述而篇",originalText:'子曰："述而不作，信而好古，窃比于我老彭。"子曰："默而识之，学而不厌，诲人不倦，何有于我哉？"子曰："德之不修，学之不讲，闻义不能徙，不善不能改，是吾忧也。"',keyTerms:[{term:"述而不作",pinyin:"shù ér bù zuò",meaning:"传述而不创作",context:"孔子自谦之辞，反映其治学态度"},{term:"学而不厌",pinyin:"xué ér bù yàn",meaning:"学习而不满足",context:"孔子终身学习的精神写照"},{term:"诲人不倦",pinyin:"huì rén bù juàn",meaning:"教诲他人不知疲倦",context:"孔子教育精神的体现"}],translation:'孔子说："只传述旧有的文化而不创作新的，相信并喜爱古代文化，我私下里把自己比作老彭。"孔子说："默默地记住所学的知识，努力学习而从不满足，教导别人而不知疲倦，这些事情我做到了哪些呢？"孔子说："品德不去修养，学问不去讲求，听到义不能去做，有了不善的事不能改正，这些都是我所忧虑的事情。"',interpretation:"《述而》篇是孔子自我写照的集中体现。述而不作不是保守主义，而是一种文化传承的自觉。学而不厌、诲人不倦展现了孔子作为学者与师者的双重品格。孔子所忧虑的四件事——德之不修、学之不讲、闻义不能徙、不善不能改——恰恰是修身的四个维度，展现了孔子谦逊好学、自省不怠的真实人格。",characters:["孔子","老彭"],events:["孔子自述治学与修身之志"],keywords:["述而不作","终身学习","自省","修养"],modernLesson:"述而不作的精神在知识爆炸的时代尤为珍贵。现代人强调创新原创，而忽视知识体系的深度传承。真正的创新往往建立在对传统深刻理解的基础上。学而不厌对应于现代终身学习理念——在快速变化的职业环境中，持续学习能力是核心竞争力。孔子的四忧提醒管理者定期自我审视：在忙忙碌碌中，是否忽视了根本的修养与成长？"},{id:"zi-han",title:"子罕篇",originalText:'子罕言利与命与仁。达巷党人曰："大哉孔子！博学而无所成名。"子闻之，谓门弟子曰："吾何执？执御乎？执射乎？吾执御矣。"',keyTerms:[{term:"罕言利",pinyin:"hǎn yán lì",meaning:"很少谈论利益",context:"反映孔子重义轻利的态度"},{term:"博学",pinyin:"bó xué",meaning:"学识渊博",context:"孔子的学问特点"},{term:"执御",pinyin:"zhí yù",meaning:"执掌驾车",context:"孔子自谦选择驾车"}],translation:'孔子很少谈论利益、命运和仁德。达巷这个地方有人说："伟大啊孔子！他学识渊博，但没有可以成名的专长。"孔子听到这话，对弟子们说："我专长什么呢？是专长驾车呢？还是专长射箭呢？我还是专长驾车吧。"',interpretation:'《子罕》篇展现了孔子人格的多面性与魅力。子罕言利，反映了孔子对功利主义的警惕；子罕言命，体现了孔子对不可知事物的审慎；子罕言仁，则恰恰说明仁在孔子心中的崇高——不是轻易可以言说的。达巷党人之叹"大哉孔子！博学而无所成名"——这是对孔子最深刻的赞美：他不是某一领域的专家，而是人格的典范、人文的化身。孔子闻之而自谦"执御"——选择驾车——这一细节展现了孔子谦逊幽默的人格魅力。',characters:["孔子","达巷党人"],events:["达巷党人叹孔子之博学"],keywords:["人格","谦逊","博学","通才"],modernLesson:'现代组织中，专家型人才与通才型人才各有价值。孔子的"无所成名"恰恰是最高的成名——以人格魅力和综合素养超越专业领域的局限。T型人才和π型人才理念与此相通。管理者的最高境界不是成为某一功能的专家，而是成为组织灵魂的塑造者。孔子的谦逊给现代领导者以深刻启示：权力与影响力来自于谦逊、来自于真诚、来自于人格。真正的领导力不是职位赋予的，而是人格赢得的。'}]},{id:"daodejing",title:"道德经",subtitle:"老子的哲学思考",author:"老子（李耳）",dynasty:"春秋末期",description:'道家学派的核心经典，以"道"为核心概念，探讨宇宙本源、治国方略与人生哲理，被誉为"万经之王"。',coverColor:"#5C8A6A",category:"philosophy",chapters:[{id:"chapter-1",title:"第一章",originalText:"道可道，非常道；名可名，非常名。无名，天地之始；有名，万物之母。故常无欲，以观其妙；常有欲，以观其徼。此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。",keyTerms:[{term:"道",pinyin:"dào",meaning:"宇宙本源、规律",context:"老子哲学的核心概念"},{term:"玄",pinyin:"xuán",meaning:"深远、奥妙",context:"形容道的深奥难测"},{term:"徼",pinyin:"jiào",meaning:"边际、端倪",context:"指道的外在表现"}],translation:'可以用言语表达的道，就不是永恒的道；可以用名称定义的名，就不是永恒的名。"无"是天地的本始，"有"是万物的根源。所以要经常从"无欲"的状态去观察道的奥妙，经常从"有欲"的状态去观察道的端倪。"无"和"有"这两者，来源相同而名称不同，都可以说是深远玄妙。深远又深远，是一切奥妙的门户。',interpretation:'老子开篇即揭示了语言的局限性和道的超越性。道是不可言说、不可定义的宇宙本源，人类只能通过"观"来体悟。有与无的辩证关系，开启了中国哲学中最深刻的形而上学思考。',characters:["老子"],events:["骑青牛出函谷关","关令尹喜问道"],keywords:["道","有","无","形而上学","辩证法"],modernLesson:'在产品设计和管理中，超越既定框架的"无"的思维，往往比局限于已有认知的"有"的思维更具创造力。保持开放性和不确定性意识，是创新的源泉。'},{id:"chapter-2",title:"第二章",originalText:"天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。故有无相生，难易相成，长短相形，高下相倾，音声相和，前后相随。是以圣人处无为之事，行不言之教。",keyTerms:[{term:"无为",pinyin:"wú wéi",meaning:"不刻意妄为",context:"老子思想的核心主张"},{term:"有无相生",pinyin:"yǒu wú xiāng shēng",meaning:"有和无相互生成",context:"老子的辩证思维核心"}],translation:'天下人都知道美之所以为美，是因为有丑陋的存在；都知道善之所以为善，是因为有不善的存在。所以有和无相互依存，难和易相互成就，长和短相互显现，高和下相互包容，音和声相互和谐，前和后相互跟随。因此圣人以"无为"的态度处理世事，用"不言"的方式施行教化。',interpretation:'老子揭示了事物的对立统一规律——任何事物都是以对立面作为自身存在的条件。在此基础上，他提出了"无为"的主张：不强行干预，而是顺应事物的自然规律。',characters:["老子"],events:["著书立说"],keywords:["辩证法","对立统一","无为而治","自然"],modernLesson:'现代管理学中的"最小干预原则"、设计中的"顺其自然"、产品开发中的"用户价值驱动"，都与老子的无为思想有着深刻的共鸣。'},{id:"chapter-36",title:"第三十六章",originalText:"将欲歙之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲取之，必固与之。是谓微明。柔弱胜刚强。鱼不可脱于渊，国之利器不可以示人。",keyTerms:[{term:"歙",pinyin:"xī",meaning:"收敛、闭合",context:'与"张"相对'},{term:"微明",pinyin:"wēi míng",meaning:"微妙的智慧",context:"洞察事物发展的先机"},{term:"柔弱胜强",pinyin:"róu ruò shèng qiáng",meaning:"柔弱最终胜过刚强",context:"老子的核心洞见之一"}],translation:"想要收敛它，必先暂时张开它；想要削弱它，必先暂时增强它；想要废除它，必先暂时兴盛它；想要夺取它，必先暂时给予它。这就叫做微妙的智慧。柔弱的东西最终会胜过刚强的东西。鱼不能脱离深渊，国家的重要策略不能轻易展示于人。",interpretation:'这一章揭示了事物发展的辩证规律——对立面的相互转化。"物极必反"、"盛极而衰"的思想在此得到了系统表达。柔弱胜刚强是老子的核心洞见之一，这一思想对中国的政治、军事、外交思想产生了深远影响。',characters:["老子"],events:["道家哲学传播"],keywords:["物极必反","柔弱胜强","辩证策略","藏锋"],modernLesson:"在商业竞争中，以退为进、以柔克刚的策略往往比硬碰硬更有效。低调积累实力、不张扬核心优势，是长期主义的重要策略。"},{id:"chapter-10",title:"第十章（修身）",originalText:"载营魄抱一，能无离乎？专气致柔，能婴儿乎？涤除玄览，能无疵乎？爱民治国，能无知乎？天门开阖，能为雌乎？明白四达，能无知乎？生之畜之，生而不有，为而不恃，长而不宰，是谓玄德。",keyTerms:[{term:"营魄抱一",pinyin:"yíng pò bào yī",meaning:"精神与体魄合一",context:"老子的形神修养论"},{term:"专气致柔",pinyin:"zhuān qì zhì róu",meaning:"凝聚精气达到柔和",context:"老子的修养方法"},{term:"玄德",pinyin:"xuán dé",meaning:"深远的德",context:"老子所崇尚的最高德行"}],translation:"精神与体魄合一，能不分离吗？凝聚精气达到柔和，能像婴儿一样吗？清除杂念深入静观，能没有瑕疵吗？爱护人民治理国家，能不用心机吗？感官开合接触外物，能守静吗？明白四方通达事理，能不依赖知识吗？生长万物养育万物，生养了万物而不据为己有，作育了万物而不自恃有功，长养了万物而不作主宰，这就叫做深远的德。",interpretation:'《道德经》第十章是老子修身哲学的集中体现。老子以六个连续的反问，提出了修身的六项准则：形神合一、专气致柔、涤除玄览、爱民治国无知、天门开阖为雌、明白四达无知。这六项准则层层递进，从个人修养到政治实践，构建了一个完整的修身治国体系。老子的修身不是儒家意义上的道德修养，而是一种存在论意义上的复归——回归生命的本真状态。"生而不有、为而不恃、长而不宰"的玄德，是老子所推崇的最高德行。',characters:["老子"],events:["老子阐述修身准则"],keywords:["修身","抱一","玄德","复归"],modernLesson:'老子的修身准则在现代领导力理论中有深刻的对应。"营魄抱一"对应于工作与生活平衡的重要性——现代职业人普遍面临的身心分离困境。"专气致柔"对应于压力管理与情绪调节——在高压环境中保持内心平和。"玄德"则是服务型领导的精髓——成就他人而不争功，赋能下属而不控制。玄德的三项准则——生而不有、为而不恃、长而不宰——正是现代赋能型领导的核心特征。'},{id:"chapter-25",title:"第二十五章（道的本质）",originalText:"有物混成，先天地生。寂兮寥兮，独立而不改，周行而不殆，可以为天下母。吾不知其名，字之曰道，强为之名曰大。大曰逝，逝曰远，远曰反。",keyTerms:[{term:"混成",pinyin:"hùn chéng",meaning:"混沌中浑然一体",context:"老子用以形容道的存在状态"},{term:"周行不殆",pinyin:"zhōu xíng bù dài",meaning:"循环运行永不停息",context:"道的运行规律"},{term:"大逝远反",pinyin:"dà shì yuǎn fǎn",meaning:"大、逝、远、反循环",context:"道的辩证运动规律"}],translation:"有一个东西混然而成，在天地形成以前就已经存在。听不到它的声音也看不见它的形体，寂静而空虚，不依靠任何外力而独立长存永不停息，循环运行而永不衰竭，可以作为万物的根本。我不知道它的名字，所以勉强把它叫做道，再勉强给它起个名字叫做大。它广大无边而运行不息，运行不息而伸展遥远，伸展遥远而又返回本原。",interpretation:'第二十五章是老子道论的形而上学篇章。老子在此对"道"的存在状态、本质属性和运动规律进行了系统的哲学阐述。"有物混成"强调道的整体性与不可分割性。"先天地生"强调道的先在性与超越性。"寂兮寥兮"强调道的虚无性。"独立而不改"强调道的自性与恒常性。"周行而不殆"强调道的运动性与永恒性。"可以为天下母"强调道的创生性与根源性。老子用"大、逝、远、反"四个概念描述道的运动规律，揭示了宇宙万物循环往复、物极必反的辩证规律。',characters:["老子"],events:["老子论道的本质"],keywords:["道","混成","循环","物极必反"],modernLesson:'老子的道论思想对现代系统思维具有深刻启示。"混成"思想对应于现代复杂系统理论——系统不是部分的简单相加，而是有机的整体。"周行不殆"对应于组织生命周期与循环经济理念——事物在循环中生生不息。"反者道之动"对应于战略拐点思维——在事物发展的极点处寻找反向的机会。"大逝远反"的循环规律提醒管理者：任何趋势都不会永远持续，在最鼎盛时期就要准备迎接反面的到来。这种反向思维是战略洞察力的核心。'}]},{id:"sunzi",title:"孙子兵法",subtitle:"兵家智慧的巅峰之作",author:"孙武",dynasty:"春秋末期",description:'中国古代最著名的军事著作，被誉为"兵学圣典"。其十三篇蕴含的战略思维，至今仍被广泛应用于军事、商业、管理等各个领域。',coverColor:"#B23A48",category:"strategy",chapters:[{id:"ji-pian",title:"始计篇",originalText:`孙子曰：兵者，国之大事，死生之地，存亡之道，不可不察也。
故经之以五事，校之以计，而索其情：一曰道，二曰天，三曰地，四曰将，五曰法。`,keyTerms:[{term:"道",pinyin:"dào",meaning:"政治、民心",context:"指使民众与君主同心同德"},{term:"天",pinyin:"tiān",meaning:"天时",context:"指季节、气候、时机"},{term:"地",pinyin:"dì",meaning:"地利",context:"指地理环境和战场条件"}],translation:`孙子说：战争是国家的头等大事，关系到军民的生死，决定着国家的存亡，不能不认真考察研究。
所以要从五个方面来分析比较，探索敌我双方的真实情况：一是政治与民心，二是天时气候，三是地理环境，四是将领才能，五是军法制度。`,interpretation:'《孙子兵法》开篇即强调战争的严肃性和重要性。"五事"是孙子战略分析的框架，体现了中国兵家"慎战"的思想——战争不是冒险，而是基于系统分析的理性决策。',characters:["孙武","吴王阖闾"],events:["吴宫教战","孙武献兵法"],keywords:["战略分析","五事七计","慎战","决策框架"],modernLesson:'孙子的"五事"框架可直接应用于商业战略：市场认知（道）、时机把握（天）、环境分析（地）、团队能力（将）、制度执行（法）。系统性思维是战略决策的基石。'},{id:"mou-gong",title:"谋攻篇",originalText:`孙子曰：凡用兵之法，全国为上，破国次之；全军为上，破军次之。是故百战百胜，非善之善者也；不战而屈人之兵，善之善者也。
故上兵伐谋，其次伐交，其次伐兵，其下攻城。`,keyTerms:[{term:"全国",pinyin:"quán guó",meaning:"使敌国完整降服",context:"以最小代价取得最大胜利"},{term:"不战而胜",pinyin:"bù zhàn ér shèng",meaning:"不战而使敌人屈服",context:"孙子的最高战略理想"},{term:"伐谋",pinyin:"fá móu",meaning:"挫败敌人的谋略",context:"最高层次的战略"}],translation:`孙子说：大凡用兵的原则，使敌国完整降服是上策，击破敌国就次一等；使敌军完整降服是上策，击破敌军就次一等。因此，百战百胜，不算是最高明的；不通过战斗就能使敌人屈服，才算是最高明的。
所以，最上等的军事行动是挫败敌人的谋略，其次是挫败敌人的外交，再次是直接进攻敌军，最下等的是攻打城池。`,interpretation:'这是《孙子兵法》中最著名的论述之一。孙子提出"不战而屈人之兵"的最高战略理想，强调以最小代价取得最大胜利。战略层次由高到低：伐谋→伐交→伐兵→攻城，体现了东方战略文化的精髓。',characters:["孙武"],events:["吴楚之战"],keywords:["不战而胜","伐谋","战略层次","全胜思想"],modernLesson:"商业竞争中，通过改变游戏规则（伐谋）、建立生态壁垒（伐交）、积累核心优势（伐兵），远比价格战和同质化竞争（攻城）更为高明。"},{id:"jun-zheng",title:"军争篇（战略主动权）",originalText:"孙子曰：凡用兵之法，将受命于君，合军聚众，交和而舍，莫难于军争。军争之难者，以迂为直，以患为利。故迂其途，而诱之以利，后人发，先人至，此知迂直之计者也。",keyTerms:[{term:"军争",pinyin:"jūn zhēng",meaning:"两军争夺先机之利",context:"战争中争夺主动权的核心"},{term:"以迂为直",pinyin:"yǐ yū wéi zhí",meaning:"把迂回的路当作直路",context:"孙子的战略迂回战术"},{term:"后人发先人至",pinyin:"hòu rén fā xiān rén zhì",meaning:"后出发先到达",context:"争取先机的最高境界"}],translation:"孙子说：大凡用兵的法则，主将接受国君的命令，从组织军队、聚集民众，到与敌军对阵，没有比争夺先机更困难的事情了。争夺先机之所以困难，在于要把迂回的弯路变为直路，把不利的条件变为有利的条件。所以，用迂回绕道的办法，并用小利引诱敌人，这样就能比敌人后出动而先到达所要争夺的要地，这就是懂得以迂为直的计谋了。",interpretation:'《军争篇》是《孙子兵法》中关于争夺战争主动权的核心篇章。军争的本质不是简单的速度竞争，而是战略主动权的争夺。孙子提出"以迂为直"的战略思想——这是一种反直觉的智慧：表面上的捷径往往是陷阱，而迂回的道路反而可能是最快的路径。"以患为利"则揭示了战争中利害的辩证关系——不利的条件中蕴含着有利的机会。"后人发，先人至"——这是军争的最高境界：后发制人，以静制动，在动态中捕捉先机。这一篇集中体现了孙子兵学思想的辩证智慧与动态思维。',characters:["孙武"],events:["孙子论军争之法"],keywords:["军争","以迂为直","后发先至","战略主动权"],modernLesson:'商场如战场，现代商战中军争思想的运用尤为明显。"以迂为直"对应于蓝海战略——避开正面竞争，寻找新的市场空间。"以患为利"对应于危机管理与危机中的机遇思维——在危机中发现转机。"后人发先人至"则是后发优势与快速跟随战略的精髓。现代竞争中，速度与时机比规模与资源更重要——这正是敏捷组织与精益创业的核心理念。市场先行者未必最终胜出，那些能够"后人发先人至"的敏捷者往往笑到最后。'},{id:"jiu-di",title:"九地篇（情境化战略）",originalText:"孙子曰：用兵之法，有散地，有轻地，有争地，有交地，有衢地，有重地，有圮地，有围地，有死地。诸侯自战其地，为散地。入人之地不深者，为轻地。我得则利，彼得亦利者，为争地。",keyTerms:[{term:"九地",pinyin:"jiǔ dì",meaning:"九种作战地形/环境",context:"孙子对作战环境的分类"},{term:"散地",pinyin:"sàn dì",meaning:"在本国境内作战",context:"士兵容易逃散，故名散地"},{term:"死地",pinyin:"sǐ dì",meaning:"速战则生不战则亡",context:"极端环境下的作战原则"}],translation:"孙子说：按照用兵的原则，军事地理有散地、轻地、争地、交地、衢地、重地、圮地、围地、死地。诸侯在本国境内作战的地区，叫做散地。进入敌国不深的地区，叫做轻地。我方得到有利、敌方得到也有利的地区，叫做争地。",interpretation:"《九地篇》是《孙子兵法》中最长的篇章，也是孙子战略地理学的系统阐述。孙子根据战争的进程和战场的地理特征，将作战环境划分为九种不同的地形，针对每种地形提出相应的作战原则与应对策略。这是一种高度情境化的战略思维——不同的环境需要不同的战略。孙子在不同的地形中，提出了不同的指挥艺术：散地则无战、轻地则无止、争地则无攻、交地则无绝、衢地则合交、重地则掠、圮地则行、围地则谋、死地则战。这一系列原则构成了一个完整的战略矩阵，体现了孙子因地制变、因势而谋的战略智慧。",characters:["孙武"],events:["孙子阐述九地作战原则"],keywords:["九地","因地制变","情境战略","战略矩阵"],modernLesson:'九地篇的情境化思维对现代战略管理与商业模式设计具有深刻的借鉴意义。现代企业面临的市场环境千差万别——新兴市场、成熟市场、细分市场、竞争激烈市场——每一种市场环境需要不同的战略。企业进入不同的市场如同军队进入不同的地形——需要因地制宜的灵活战略。"散地吾将一其志"——在本土市场要统一意志，专注核心；"轻地吾将使之属"——在初期探索要保持连续性，不轻易冒进；"争地吾将趋其后"——在关键市场要抢占先机，快速行动；"重地吾将继其食"——在深入竞争的市场要补给资源，持续投入；"死地吾将示之以不活"——在绝境中要展现决心，激发潜能。这种情境化的战略思维，正是现代管理者从《孙子兵法》中可以汲取的最宝贵的智慧。'}]},{id:"mengzi",title:"孟子",subtitle:"儒家心性之学的集大成者",author:"孟子及其弟子",dynasty:"战国",description:"《孟子》是儒家经典之一，记录孟子及其弟子的政治、教育、哲学思想。孟子继承并发展了孔子的思想，提出性善论、仁政学说，倡导民本思想，对后世影响深远。",coverColor:"#7A6B4F",category:"philosophy",chapters:[{id:"liang-hui-wang",title:"梁惠王（义利之辨）",originalText:'孟子见梁惠王。王曰："叟，不远千里而来，亦将有以利吾国乎？"孟子对曰："王何必曰利？亦有仁义而已矣。王曰何以利吾国，大夫曰何以利吾家，士庶人曰何以利吾身，上下交征利而国危矣。"',keyTerms:[{term:"义利之辨",pinyin:"yì lì zhī biàn",meaning:"道义与利益的辨别取舍",context:"孟子主张先义后利，反对以利为先"},{term:"仁义",pinyin:"rén yì",meaning:"仁爱与正义",context:"儒家核心价值观，仁在内，义在外"},{term:"上下交征利",pinyin:"shàng xià jiāo zhēng lì",meaning:"上下互相争夺利益",context:"孟子警示：上下皆逐利则国家危亡"}],translation:'孟子拜见梁惠王。惠王说："老先生，您不远千里而来，将有什么办法使我的国家获利吗？"孟子回答说："大王何必说利呢？只要讲仁义就可以了。大王说怎样使我的国家获利，大夫说怎样使我的家族获利，士人和百姓说怎样使我自己获利，上上下下互相争夺利益，国家就危险了。"',interpretation:"本章是《孟子》的开篇，其意义非同寻常。孟子在此提出了一个深刻的政治伦理学命题——义利之辨，这是儒家思想的核心议题之一。孟子并非否定利的存在，而是主张利必须以义为前提。他敏锐地洞察到：当一个社会从君王到庶人都以利为行为准则时，必然导致互相算计、尔虞我诈，最终使整个社会陷入道德崩溃的危机。这一洞见在两千多年后依然具有震撼力。孟子所倡导的义利观，实际上是在为人类社会寻求一种超越功利主义的价值秩序——一种以道德为基础的政治哲学。他认为，仁义不是获取更大、更持久的利的前提条件，而非利的对立面。这一章确立了整部《孟子》的基调：道义优先，利益次之。",characters:["孟子","梁惠王"],events:["孟子见梁惠王"],keywords:["义利之辨","仁政","民本","义利观"],modernLesson:"在现代商业社会中，义利之辨的问题以新的形式出现。企业追求利润天经地义，但利润至上的短视行为正在侵蚀商业伦理。孟子的教诲提醒我们：短期利益的最大化往往伴随着长期信任的流失。职场中，那些以诚信为根基的企业，虽然在短期内可能牺牲部分利益，但长期来看，其品牌价值和客户信任带来的回报远超短暂的收益。管理者应将伦理准则置于短期绩效指标之前，方能行稳致远。"},{id:"gong-sun-chou",title:"公孙丑（养气说）",originalText:`"敢问夫子之不动心，与告子之不动心，可得闻与？""告子曰：'不得于言，勿求于心；不得于心，勿求于气。不得于心，勿求于气，可；不得于言，勿求于心，不可。夫志，气之帅也；气，体之充也。夫志至焉，气次焉。"`,keyTerms:[{term:"不动心",pinyin:"bù dòng xīn",meaning:"心志坚定不为外物所动",context:"孟子所追求的精神境界"},{term:"养气",pinyin:"yǎng qì",meaning:"培养浩然正气",context:"孟子提出的精神修养方法"},{term:"志帅气",pinyin:"zhì shuài qì",meaning:"意志是气的统帅",context:"说明意志主导精神力量"}],translation:`公孙丑问："请问老师的不动心和告子的不动心，可以讲给我听听吗？"孟子说："告子说：'言语上得不到的，不必在心中寻求；心中得不到的，不必在意气上寻求。'心中得不到的，不必在意气上寻求，这是可以的；言语上得不到的，不必在心中寻求，这是不可以的。意志是气的统帅，气是充满身体的力量。意志是根本，气是从属的。"`,interpretation:"本章是孟子心性修养论的核心篇章。孟子在此提出了影响深远的养气说和不动心说。告子主张将心与气相分离，而孟子则主张志与气的统一——以志帅气，以气充体。孟子所讲的气，不是生理意义上的呼吸之气，而是一种由道义所涵养的精神力量——浩然之气。这种气需要长期修养，集义所生，非义袭而取。不动心也不是麻木不仁，而是经过深刻的道德自觉之后所达到的一种精神境界。这种境界不是对外界刺激无动于衷，而是在理性与情感的高度统一中所呈现的从容与坚定。这是一种在世俗的纷扰中依然能够保持内心自由与尊严的人格力量。",characters:["孟子","公孙丑","告子"],events:["孟子与公孙丑论心性修养"],keywords:["养气","不动心","浩然之气","心性修养"],modernLesson:'现代心理学中的情绪管理和心理韧性的培养，与孟子的养气说有异曲同工之妙。在职场中，面对压力、挫折、不公，如何保持内心的平静与坚定——这正是孟子所谓不动心的现代诠释。领导者尤其需要培养这种精神力量，在危机时刻保持清醒判断，不被情绪左右决策。持续的自我修养、价值观的明确与坚持，是现代职业人应对复杂环境的精神铠甲。孟子的"我善养吾浩然之气"，至今仍是知识分子和管理者的精神追求。'},{id:"teng-wen-gong",title:"滕文公（性善论）",originalText:'孟子道性善，言必称尧舜。滕文公为世子，将之楚，过宋而见孟子。孟子道性善，言必称尧舜。世子自楚反，复见孟子。孟子曰："世子疑吾言乎？夫道一而已矣。"',keyTerms:[{term:"性善论",pinyin:"xìng shàn lùn",meaning:"人性本善的学说",context:"孟子人性论的核心主张"},{term:"尧舜",pinyin:"Yáo Shùn",meaning:"唐尧、虞舜，古代圣君",context:"儒家推崇的理想君主典范"},{term:"道一",pinyin:"dào yī",meaning:"真理是统一的",context:"孟子强调真理的普遍性与统一性"}],translation:'孟子讲人性本善，言语之间必称颂尧舜。滕文公做太子时，要到楚国去，经过宋国时拜见孟子。孟子讲人性本善的道理，言语必称颂尧舜。太子从楚国回来，又去见孟子。孟子说："太子怀疑我的话吗？真理只有一个罢了。"',interpretation:'性善论是孟子对儒家思想最具原创性的贡献。孟子认为，人性中本有善的萌芽——恻隐之心、羞恶之心、辞让之心、是非之心，这四端是人人皆有的。性善论不是说人一生下来就是完美的善人，而是说人具有向善的潜能和内在的道德禀赋。孟子强调，只要充分发展这些内在善端，就可以成为尧舜那样的圣人。这一学说在中国思想史上具有重大意义：它为儒家的道德修养论提供了人性论的基础，也为仁政学说奠定了哲学根基。性善论同时也是一种深刻的乐观主义——它相信人的可完善性，相信教育与修养的力量。孟子曰："人皆可以为尧舜"——这句激励了无数中国人。',characters:["孟子","滕文公","尧舜"],events:["滕文公见孟子问性善"],keywords:["性善论","四端说","人性","人皆可以为尧舜"],modernLesson:"性善论对现代人力资源管理和教育理念有深刻启示。相信员工或学生具有向上向善的内在潜能，是激励式管理和启发式教育的哲学基础。管理者如果预设人性本恶，则倾向于严密监控与惩罚；反之，如果相信人性本善，则更注重引导与培养。孟子的智慧在于强调内在动机的激发，而非外在约束的强化——这正是现代管理学从X理论向Y理论、自我决定理论演进的方向。在现代组织中，创造一个激发员工内在善端的环境，比设计繁琐的规则制度更能激发持久的创造力与奉献精神。"},{id:"li-lou",title:"离娄（仁政制度）",originalText:'孟子曰："离娄之明、公输子之巧，不以规矩，不能成方圆；师旷之聪，不以六律，不能正五音；尧舜之道，不以仁政，不能平治天下。"',keyTerms:[{term:"规矩",pinyin:"guī jǔ",meaning:"圆规和曲尺，引申为法则",context:"孟子用以比喻治国的根本原则"},{term:"仁政",pinyin:"rén zhèng",meaning:"以仁爱为本的政治",context:"孟子政治思想的核心"},{term:"平治天下",pinyin:"píng zhì tiān xià",meaning:"使天下太平治理",context:"儒家治国平天下的理想"}],translation:'孟子说："即使有离娄那样的视力、公输般那样的技巧，如果不使用圆规和曲尺，也不能画出方形和圆形；即使有师旷那样的听力，如果不使用六律，也不能校正五音；即使有尧舜之道，如果不实行仁政，也不能治理好天下。"',interpretation:"孟子以精妙的比喻阐明了一个深刻的政治哲学命题。离娄之明、公输子之巧、师旷之聪，这些都是天赋的才能，但仅有才能而无工具、无方法、无制度，则一事无成。同样，仅有尧舜的道德理想，如果没有仁政的制度实践，也不能平治天下。孟子这里强调的是，道德理想必须制度化、具体化——制度的重要性。这一章在儒家思想发展史上具有重要意义，它将抽象的道德原则转化为具体的政治行动纲领。仁政不是空洞的道德说教，而是以民为本的具体政治措施——制民之产，省刑罚，薄税敛，深耕易耨。孟子的这一思想是对孔子德治思想的重大发展。",characters:["孟子","离娄","公输子","师旷","尧舜"],events:["孟子论仁政与制度"],keywords:["仁政","规矩","制度","民本思想"],modernLesson:'现代组织管理中，仅有愿景和价值观是不够的，必须有制度设计与流程保障。优秀的领导者如同优秀的工匠，需要将高远的理想与具体的方法工具相结合。企业愿景需要制度落地，企业文化需要制度保障，人才战略需要制度激励。孟子的智慧在于强调：再好的理念，如果缺乏行之有效的制度体系，终成空中楼阁。这正是现代组织建设的核心命题——以制度承载价值，以文化涵养制度。制度不是创造价值的根本，但制度是价值得以实现的保障。现代管理者的核心挑战，正在于如何在"规矩"与"创新"之间找到平衡。'}]},{id:"zhuangzi",title:"庄子",subtitle:"道家逍遥思想的巅峰之作",author:"庄子及其后学",dynasty:"战国",description:"《庄子》是道家学派的重要经典，以汪洋恣肆的文笔和深邃的哲学思辨著称。庄子主张顺应自然、追求精神自由，其相对主义认识论和齐物思想对中国哲学、文学、艺术产生了深远影响。",coverColor:"#4A6B5A",category:"philosophy",chapters:[{id:"xiao-yao-you",title:"逍遥游（精神自由）",originalText:"北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也。怒而飞，其翼若垂天之云。",keyTerms:[{term:"逍遥",pinyin:"xiāo yáo",meaning:"自由自在、无拘无束",context:"庄子所追求的精神自由境界"},{term:"鲲鹏",pinyin:"kūn péng",meaning:"大鱼化为大鸟",context:"庄子用以比喻精神超越的象征"},{term:"小大之辨",pinyin:"xiǎo dà zhī biàn",meaning:"小与大的区别",context:"庄子揭示的认知局限问题"}],translation:"北海有一条鱼，它的名字叫鲲。鲲的身体之大，不知道有几千里。鲲变化成为鸟，它的名字叫鹏。鹏的脊背之宽阔，不知道有几千里。当它奋起而飞的时候，那展开的双翅就像天边的云。",interpretation:"《逍遥游》是《庄子》的首篇，也是庄子哲学的总纲。庄子以鲲鹏之变的宏大寓言开篇，展现了其独特的哲学视野。鲲在北冥深潜，化为鹏而高飞，象征着人的精神从有限到无限的跃迁。庄子在此提出了一个震撼人心的问题：什么是真正的自由？真正的逍遥不是在世俗意义上的功成名就，而是精神上的无待——不依赖任何外在条件而获得的精神自由。庄子通过大鹏与斥鷃的对比，揭示了小大之辨的哲学命题：小知不及大知，小年不及大年。人的认知局限于自身的存在方式，唯有超越自身的有限性，才能进入逍遥的境界。这是一种存在论层面的自由论，而非认识论层面的自由论。",characters:["庄子","鲲","鹏"],events:["鲲鹏之变","庄子论逍遥"],keywords:["逍遥","自由","超越","无待","小大之辨"],modernLesson:"现代社会中，人们常常被外在的评价标准所束缚——职位、收入、地位、头衔。庄子的逍遥思想提醒我们：真正的自由不是拥有什么，而是成为什么。职业发展不应被社会期待的奴隶，而应是内在价值实现的过程。庄子教给我们的是一种存在的智慧——从他人的评价体系中解放出来，回归本真的自我。在追求卓越的过程中保持内心的逍遥，这是现代人最难能可贵的精神品质。真正的职业自由，不是频繁跳槽的自由，而是在任何岗位上都能保持精神自主的自由。"},{id:"qi-wu-lun",title:"齐物论（万物齐一）",originalText:'南郭子綦隐机而坐，仰天而嘘，荅焉似丧其耦。颜成子游立侍乎前，曰："何居乎？形固可使如槁木，而心固可使如死灰乎？今之隐机者，非昔之隐机者也。"',keyTerms:[{term:"齐物",pinyin:"qí wù",meaning:"万物齐一、平等",context:"庄子相对主义认识论的核心"},{term:"吾丧我",pinyin:"wú sàng wǒ",meaning:"忘却自我",context:"超越主客二分的精神状态"},{term:"两行",pinyin:"liǎng xíng",meaning:"两个方面都可行",context:"庄子主张的超越对立的方法"}],translation:'南郭子綦靠着几案而坐，仰首向天缓缓地吐着气，那离神去智的样子真好像精神脱出了躯体。颜成子游陪站在跟前说道："这是怎么啦？形体诚然可以使它像干枯的树木，精神和思想诚然可以使它像死灰吗？您今天凭几而坐，跟往常凭几而坐的情景大不一样啊。"',interpretation:'《齐物论》是庄子哲学最深刻的篇章，也是中国哲学史上最具思辨色彩的文字之一。庄子以南郭子綦"吾丧我"的寓言开篇，提出消解主客二分、打破自我中心封闭的命题。庄子认为，世间的是非、善恶、美丑的对立都是相对的，取决于观察的视角。各种学说的纷争，本质上是各自以自我为中心的产物。庄子提出"两行"的方法——是亦彼也，彼亦是也——超越对立的二元思维。这是一种深刻的相对主义和视角主义。庄子不是否定差异的存在，而是主张在承认差异的基础上超越差异，进入万物一体的境界。这种思想对中国艺术精神——特别是禅宗的形成，产生了深远影响。',characters:["南郭子綦","颜成子游"],events:["南郭子綦论吾丧我"],keywords:["齐物","相对主义","两行","吾丧我","视角"],modernLesson:'现代组织中，不同部门、不同角色、不同个体的视角差异，往往导致协作障碍和内耗。庄子的齐物思想启示管理者：学会从不同视角看问题，理解差异的合理性。项目管理中的换位思考，正是这种智慧的体现。真正的领导力不在于统一思想，而在于整合差异；不在于消除分歧，而在于在分歧中发现新的可能。庄子的"彼亦一是非，此亦一是非"提醒我们：真理是多面的，组织需要的不是众口一词，而是在多样中寻求和谐。这种包容性思维是现代创新型组织最稀缺的品质。'},{id:"yang-sheng-zhu",title:"养生主（顺应自然）",originalText:"庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。合于桑林之舞，乃中经首之会。",keyTerms:[{term:"庖丁解牛",pinyin:"páo dīng jiě niú",meaning:"厨师解剖牛的比喻",context:"庄子用以比喻顺应自然的处世艺术"},{term:"养生",pinyin:"yǎng shēng",meaning:"养护生命",context:"庄子主张顺应自然的生命哲学"},{term:"缘督以为经",pinyin:"yuán dū yǐ wéi jīng",meaning:"顺应中道以为常法",context:"庄子的处世原则"}],translation:"有一个名叫丁的厨师替梁惠王宰牛，手接触的地方，肩靠着的地方，脚踩着的地方，膝顶着的地方，发出皮骨相离声，进刀时发出騞騞的响声，没有不合乎音律的。合乎《桑林》舞乐的节拍，又合乎《经首》乐曲的节奏。",interpretation:'庖丁解牛是庄子哲学中最脍炙人口的寓言之一。庖丁解牛的技艺已经超越了一般的技术层面，进入了道的境界——以无厚入有间，游刃有余。庖丁用了十九年，解了数千头牛，而刀刃若新发于硎，这是因为他能够"依乎天理"，"因其固然"。庄子以此比喻养生的真谛：不是强行干预，而是顺应事物的自然规律。"缘督以为经"——顺应虚妙之道以为常法，可以保身，可以全生，可以养亲，可以尽年。这是一种深刻的生命艺术：在复杂的现实世界中，如何以最小的代价实现最大的生命价值。庄子的养生不是苟且偷生，而是在深刻理解事物本质后的自由运用。',characters:["庄子","庖丁","文惠君"],events:["庖丁为文惠君解牛","庄子阐述养生之道"],keywords:["养生","顺应自然","游刃有余","依乎天理"],modernLesson:'现代职场中，人们面临的压力与复杂程度前所未有。庖丁解牛的智慧启示我们：真正的专业能力不是与问题硬碰硬，而是深刻理解规律后的游刃有余。优秀的管理者如同庖丁——他不是强行推动变革，而是洞察组织的肌理，在关键节点施加恰到好处的力。产品经理理解用户需求的本质，设计师理解技术与美学的契合点，销售人员理解客户决策的心理机制。顺应规律的力量，远比蛮力有效得多。"以无厚入有间"的智慧，可以应用于现代工作的方方面面。'}]},{id:"liji",title:"礼记",subtitle:"儒家礼仪制度与修身治国经典",author:"孔门后学编纂",dynasty:"战国至秦汉",description:"《礼记》是儒家重要经典之一，记载了古代的礼仪制度、社会规范和修身治国思想。其中《大学》《中庸》两篇尤为重要，与《论语》《孟子》合称为四书。",coverColor:"#8B6F47",category:"philosophy",chapters:[{id:"da-xue",title:"大学（三纲领八条目）",originalText:"大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始，知所先后，则近道矣。",keyTerms:[{term:"三纲领",pinyin:"sān gāng lǐng",meaning:"明明德、亲民、止于至善",context:"《大学》提出的三大纲领"},{term:"八条目",pinyin:"bā tiáo mù",meaning:"格物、致知、诚意、正心、修身、齐家、治国、平天下",context:"《大学》的修养实践路径"},{term:"明明德",pinyin:"míng míng dé",meaning:"彰明本有的光明德性",context:"儒家修身的根本"}],translation:"大学的宗旨，在于彰明人们本有的光明德性，在于革新人们的思想观念，在于达到最高的善。知道应达到的境界然后才能志向坚定，志向坚定然后才能镇静不躁，镇静不躁然后才能心安理得，心安理得然后才能思虑周详，思虑周详然后才能有所收获。每样东西都有根本有枝末，每件事情都有开始有终结。明白了这本末始终的道理，就接近事物发展的规律了。",interpretation:'《大学》是儒家思想体系中系统阐述修身治国纲领的重要文献。三纲领八条目构建了一个完整的内圣外王的哲学体系。"明明德"是内圣的根本——唤醒人内在的道德自觉；"亲民"是外王的实践——将内在的德性转化为对外的教化；"止于至善"是终极目标——人格与社会的最高理想。八条目则提供了从个人修养到社会治理的递进路径：格物、致知是知识层面，诚意、正心是道德层面，修身是枢纽，齐家、治国、平天下是政治实践层面。这一体系将个人道德修养与社会政治治理有机结合，体现了儒家伦理政治一体的思想特征。',characters:["曾子"],events:["《大学》阐述三纲领八条目"],keywords:["三纲领","八条目","修齐治平","内圣外王"],modernLesson:'现代领导力理论中的自我领导理论与《大学》的修齐治平思想高度契合。管理者必先自我管理，才能领导他人。"知止而后有定"对应于现代的目标管理——明确方向是一切的起点。"物有本末，事有终始"则提醒管理者：分清主次、抓住根本是管理有效性的关键。八条目对现代企业管理的启示尤为深刻：格物致知——深入了解业务本质；诚意正心——以诚信和正直建立组织文化；修身——领导者的自我修养与人格塑造；齐家——构建健康的组织关系；治国平天下——实现企业的社会价值。这一从内到外的修养逻辑，与现代领导力从"自我领导"到"组织领导"的演进路径不谋而合。'},{id:"zhong-yong",title:"中庸（诚与中道）",originalText:"天命之谓性，率性之谓道，修道之谓教。道也者，不可须臾离也，可离非道也。诚者，天之道也；诚之者，人之道也。诚者不勉而中，不思而得，从容中道，圣人也。",keyTerms:[{term:"中庸",pinyin:"zhōng yōng",meaning:"不偏不倚、不过不及",context:"儒家的最高道德准则和方法论"},{term:"诚",pinyin:"chéng",meaning:"真实无妄、诚心诚意",context:"《中庸》哲学的核心范畴"},{term:"率性",pinyin:"shuài xìng",meaning:"遵循本性",context:"顺循天赋本性而行即为道"}],translation:"上天所赋予人的叫做性，遵循本性叫做道，修养并加以修养叫做教。道是不可以片刻离开的，可以离开的那就不是道了。诚是天道的本然状态；追求诚是做人的道理。诚的人不勉强而行就符合中道，不思索而得就达到目的，从容不迫地达到中庸之道，这种人就是圣人。",interpretation:'《中庸》是儒家哲学的形而上学著作，被宋儒称为孔门传授心法。中庸并非流俗所理解的平庸调和，而是极高明而道中庸——一种在日常中实现超越的智慧。诚是《中庸》的核心范畴，它既是本体论范畴，也是工夫论范畴。作为天道之本然状态，诚是天地万物的本真存在；作为人道之实践原则，诚是主体修养的极致境界。诚者与诚之者的区分，揭示了圣人与常人的修养差异：圣人是生而知之安而行之，常人是学而知之利而行之或困而知之勉强而行之。《中庸》将儒家心性论推向了形而上学的高度，为宋明理学的心性之学奠定了经典文本基础。"致中和，天地位焉，万物育焉"——达到中和境界，天地各安其位，万物生生不息。',characters:["子思"],events:["《中庸》阐述诚与中道"],keywords:["中庸","诚","率性","中和","致中和"],modernLesson:'中庸之道对现代决策与管理具有多方面的启示。决策中，中庸不是妥协折中，而是在全面把握事物本质后的精准判断——这正是战略思维的精髓。"诚者，天之道也"对应于现代诚信经营理念——要求企业对用户真诚，领导者对下属真诚。"率性为道"对应于真诚领导理论——领导者以本真自我领导，而非扮演角色。"致中和"则是组织管理的最高境界——在复杂的组织生态中，找到动态平衡的黄金分割点，使各要素各安其位、协同发力。中庸智慧还是复杂环境中寻求平衡的艺术——在短期利益与长期价值之间、在创新与传承之间、在控制与放权之间寻找恰到好处的平衡点。这种"执两用中"的智慧，是现代管理者从《中庸》中可以汲取的核心教诲。'}]}],Cl=[{id:"confucius",name:"孔子",fullTitle:"至圣先师 · 孔夫子",era:"公元前551年-前479年",avatar:"🎓",introduction:'儒家学派创始人，名丘，字仲尼。他整理六经，开创私学之风，其"仁"的思想深刻影响了中华文明两千余年。',personality:"温和而坚定，循循善诱，重视德行修养",signatureQuotes:["学而时习之，不亦说乎？","己所不欲，勿施于人。","知之者不如好之者，好之者不如乐之者。"],themes:["教育方法","修身养性","人际关系","政治理念","人生意义"],speakingStyle:"以问答方式引导思考，言简意赅，常常引用生活中的例子来阐述深刻道理。"},{id:"laozi",name:"老子",fullTitle:"道家始祖 · 太上老君",era:"约公元前571年-前471年",avatar:"☯️",introduction:"道家学派创始人，姓李名耳，字聃。曾任周朝守藏室之史，后骑青牛西出函谷关，留下五千言《道德经》，成为人类思想史上的不朽经典。",personality:"深邃而超脱，以柔克刚，主张无为而治",signatureQuotes:["道可道，非常道。","上善若水，水善利万物而不争。","千里之行，始于足下。"],themes:["道的本质","无为而治","处世哲学","养生之道","辩证思维"],speakingStyle:"语言晦涩玄妙，喜欢用水、谷、母等自然意象来比喻抽象道理，话中有话，需要细细品味，强调反向思维。"},{id:"sunzi",name:"孙子",fullTitle:"兵学圣典 · 孙武",era:"约公元前545年-前470年",avatar:"⚔️",introduction:'春秋末期著名军事家，名孙武，字长卿。他所著的《孙子兵法》十三篇，被誉为"兵学圣典"，是世界上最早的军事理论著作。',personality:"冷静理性，洞察入微，善于分析利害",signatureQuotes:["知彼知己，百战不殆。","不战而屈人之兵，善之善者也。","兵无常势，水无常形。"],themes:["战略思维","竞争策略","团队管理","情报分析","风险管理"],speakingStyle:'语言简洁有力，善于归纳总结，常用"故曰"引出结论，分析透彻，逻辑严密，注重情报与分析。'},{id:"zhuangzi",name:"庄子",fullTitle:"道家逍遥 · 庄周",era:"约公元前369年-前286年",avatar:"🦋",introduction:"道家学派代表人物，名周。他继承并发展了老子的思想，著有《庄子》一书，文风汪洋恣肆，想象奇特瑰丽。",personality:"洒脱逍遥，幽默诙谐，善于用寓言表达思想",signatureQuotes:["北冥有鱼，其名为鲲。","吾生也有涯，而知也无涯。","至人无己，神人无功，圣人无名。"],themes:["精神自由","生死观","自然之道","艺术审美","价值相对论"],speakingStyle:"喜欢用寓言故事来表达思想，想象力丰富，语言飘逸灵动，常以辩论的方式阐述观点，带有超然与幽默的色彩。"},{id:"mengzi",name:"孟子",fullTitle:"亚圣 · 孟轲",era:"约公元前372年-前289年",avatar:"📜",introduction:'儒家学派代表人物，名轲，字子舆。他继承并发展了孔子的思想，提出性善论、仁政学说，被后世尊为"亚圣"。',personality:"善辩而坚定，民本思想浓厚，重视心性修养",signatureQuotes:["富贵不能淫，贫贱不能移，威武不能屈。","穷则独善其身，达则兼济天下。","天将降大任于斯人也，必先苦其心志。"],themes:["性善论","仁政思想","民本主义","道德修养","义利观"],speakingStyle:"善于辩论，言辞犀利，善于运用比喻和排比，气势磅礴，逻辑严密。"}],er=[{id:"w1",source:"《论语·学而》",originalText:"吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？",translation:"我每天多次反省自己：为别人谋划事情是否尽心尽力？与朋友交往是否诚实守信？学到的知识是否认真实践？",category:"growth",reflection:'曾子提出的"每日三问"是中国古代修身文化的精髓。在快节奏的现代生活中，我们是否还有时间停下来审视自己？反思不是自责，而是调整航向的必要动作。',actionableSteps:["每天预留15分钟写反思日记","对重要承诺进行追踪记录",'每周进行一次"进度回顾"',"向信任的朋友请求定期反馈"]},{id:"w2",source:"《道德经·第三十三章》",originalText:"知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。",translation:"能够了解别人的人是智慧的，能够了解自己的人是高明的。能够战胜别人的人是有力量的，能够战胜自己的人是真正坚强的。知道满足的人是富有的，坚持力行的人是有志向的。",category:"life",reflection:'老子揭示了一个深刻的人生悖论：向外征服容易，向内超越困难。真正的强者不是战胜多少人，而是能否战胜自己的弱点。在消费主义盛行的今天，"知足"二字尤为珍贵。',actionableSteps:["识别并记录自己的三个核心弱点","设定可衡量的自我超越目标","定期清理物质和精神上的冗余","坚持一项需要长期投入的技能学习"]},{id:"w3",source:"《孙子兵法·始计篇》",originalText:"多算胜，少算不胜，而况于无算乎？",translation:"筹划周密的能够取胜，筹划疏漏的难以取胜，更何况完全没有筹划的呢？",category:"management",reflection:"孙子用最简单的语言道出了战略规划的重要性。在VUCA（易变、不确定、复杂、模糊）时代，周密的规划比以往任何时候都更加重要——但这并不意味着僵化，而是建立框架后保持灵活。",actionableSteps:["决策前进行五要素系统性分析（道天地将法）","建立情景模拟和预案","识别关键风险点并制定应对方案","定期复盘调整策略"]},{id:"w4",source:"《孟子·梁惠王上》",originalText:"老吾老，以及人之老；幼吾幼，以及人之幼。",translation:"尊敬自己的长辈，进而推广到尊敬别人的长辈；爱护自己的子女，进而推广到爱护别人的子女。",category:"relationships",reflection:'孟子提出的"推恩"思想，是儒家仁爱的扩展路径。现代人常常被"同理心疲劳"所困扰，但孟子告诉我们：仁爱的起点是身边的人，力量会从这里向外扩散。',actionableSteps:["每周至少安排一次与家人的深度交流",'在工作中建立"帮助同事"的习惯',"参与一次志愿服务活动",'记录自己"善意传递"的瞬间']},{id:"w5",source:"《庄子·养生主》",originalText:"庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。",translation:"庖丁为文惠君宰牛，手所接触的地方，肩所倚靠的地方，脚所踩踏的地方，膝盖所抵住的地方，都发出皮骨分离的声音，进刀时发出更大的响声，没有不符合音律的。",category:"health",reflection:'庄子用"庖丁解牛"的故事，揭示了技艺与养生的深层联系。当一个人真正理解事物的内在规律，操作就会变得像艺术一样流畅。这不仅是养生之道，更是在任何领域达到卓越的方法论。',actionableSteps:["专注于一件事，探索其内在规律",'在工作中寻找"游刃有余"的节奏','建立"深度工作"时段，避免碎片化干扰',"定期休假让身心恢复"]},{id:"w6",source:"《大学》",originalText:"大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。",translation:"大学的宗旨，在于彰显光明的品德，在于使民众革故鼎新，在于达到至善的最高境界。知道目标所在然后意志才有定向，志向定向然后内心才能宁静，内心宁静然后处境才能安稳，处境安稳然后思虑才能周详，思虑周详然后才能有所收获。",category:"growth",reflection:'《大学》提出的"三纲领八条目"是中国古代知识分子的人生纲领。"知止"是这一切的起点——知道自己的边界和目标，才能获得内心的宁静。这是现代人最稀缺的心理品质：确定性。',actionableSteps:["为自己写下人生使命宣言",'识别3-5个"非做不可"的核心目标','对不重要的机会学会说"不"','建立每日"静心时刻"的习惯']},{id:"w7",source:"《中庸》",originalText:"诚者，物之终始，不诚无物。是故君子诚之为贵。",translation:"诚贯穿于万物的始终，没有诚就没有万物。所以君子把诚看作是最宝贵的。",category:"life",reflection:'《中庸》将"诚"提升到本体论的高度——诚不仅是人的道德品质，更是天地万物的存在本质。在诚信缺失的现代社会，重提"诚"的价值，具有深刻的现实意义。诚是一切价值的根基。',actionableSteps:["识别并记录自己不诚的时刻",'在人际关系中实践"言出必行"',"不轻易许诺，一旦许诺必兑现","对自己诚实——承认真实的感受和想法"]},{id:"w8",source:"《道德经·第六十四章》",originalText:"合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。",translation:"合抱的大树，生长于细小的萌芽；九层的高台，筑起于每一堆泥土；千里的远行，是从脚下第一步开始走出来的。",category:"management",reflection:"老子用三个生动的比喻道出了积累的力量。现代社会追求速成、渴望一夜成名，但事物的发展自有其规律。伟大的事业都是从微不足道的起点开始的，这是一种深刻的耐心教育。",actionableSteps:['为重要目标分解出"第一步"',"建立每日微习惯（15分钟起步）","用日记记录成长轨迹","庆祝小胜利，积累前进动力"]}],di=[{id:"confucius",label:"孔子",type:"person",x:300,y:150,connections:["lunyu","ren","li","mengzi","xunzi"]},{id:"laozi",label:"老子",type:"person",x:600,y:100,connections:["daode","dao","wuwei","zhuangzi"]},{id:"sunzi",label:"孙子",type:"person",x:900,y:150,connections:["sunzi-book","zhanlue","bingfa","wushi"]},{id:"zhuangzi",label:"庄子",type:"person",x:600,y:350,connections:["laozi","xiaoyao","qiwu"]},{id:"mengzi",label:"孟子",type:"person",x:150,y:300,connections:["confucius","xing-shan","ren-zheng"]},{id:"xunzi",label:"荀子",type:"person",x:150,y:450,connections:["confucius","xing-e","li-fa"]},{id:"lunyu",label:"论语",type:"concept",x:400,y:2 相当于国家图书馆馆长），他目睹了周王朝的衰落和诸侯的争霸，对人类文明的发展趋势有着深刻的反思。在这样的背景下，老子提出"道"作为宇宙万物的本源和规律，试图在混乱的时代中寻找确定性。':e.includes("兵者")||e.includes("国之大事")?'此段出自《孙子兵法·始计篇》，是全书的开篇。孙子所处的春秋末期，诸侯兼并战争频繁，战争规模和残酷程度不断升级。孙子在这样的时代背景下，提出了"慎战"思想——不是反对战争，而是强调战争的严肃性和决策的科学性。这与西方军事思想中"战争是政治的延续"有着异曲同工之妙。':e.includes("孟子")||e.includes("梁惠王")?"此段出自《孟子·梁惠王上》，是孟子与梁惠王的著名对话。战国时期，各国君主追求富国强兵，功利主义盛行。孟子在此提出义利之辨，试图为政治重新确立道德基础。这一对话奠定了孟子仁政学说的基础。":e.includes("北冥")||e.includes("逍遥")?"此段出自《庄子·逍遥游》，是庄子哲学的开篇宣言。庄子所处的战国中期，社会动荡，生命无常。庄子在这样的环境中寻求精神的解放与自由，提出了逍遥游的人生理想——一种超越世俗束缚的精神境界。":e.includes("大学之道")?'此段出自《礼记·大学》，是儒家修身治国的总纲领。"三纲领八条目"构建了一个完整的内圣外王体系，成为宋明理学最重要的经典文本之一。朱熹将《大学》《中庸》从《礼记》中抽出，与《论语》《孟子》合编为四书。':"这段话承载着中国古代思想家对人生、社会、政治、军事等领域的深刻观察和智慧总结。在现代社会，这些古老的智慧仍然具有重要的启发意义。",Cy=async e=>(await new Promise(n=>setTimeout(n,1e3)),[{id:"scene-1",title:"第一章：杏坛春风",narration:"公元前五世纪的一个春日，鲁国曲阜的杏坛之上，一位老者正与弟子们围坐论学。微风吹过，杏花飘落，孔子轻抚琴弦，开始了今天的讲授...",dialogue:[{speaker:"弟子",text:"夫子，请问学习的真谛是什么？为何有人学而无所得？"},{speaker:"孔子",text:"学习的真谛不在于记忆，而在于理解与实践。学而时习之——学到的道理要在适当的时候去践行它，这样知识才能真正成为你自己的一部分。"},{speaker:"弟子",text:"那如果践行了却无人理解，又当如何？"},{speaker:"孔子",text:"人不知而不愠，不亦君子乎？真正的学者，学习是为了提升自己，而非获得他人的认可。当你内心充实，外在的评价便不再重要。"}],mood:"wise",visualPrompt:"An ancient Chinese classroom scene under an apricot tree (杏坛) in spring, with Confucius teaching his disciples, traditional Chinese architecture, cherry blossoms falling, warm golden sunlight, ink painting style"},{id:"scene-2",title:"第二章：函谷关外",narration:"公元前516年，周朝王室发生内乱，老子目睹了这一切，决定隐退。他骑着一头青牛，缓缓西行。在函谷关前，守关的尹喜望见东方有紫气飘来...",dialogue:[{speaker:"尹喜",text:"先生留步！我望见东方紫气浩荡，知道有圣人即将经过。先生莫非就是那位通古今之变的智者？"},{speaker:"老子",text:"紫气东来，不过是自然之象罢了。我不过是一个即将归隐的老人。"},{speaker:"尹喜",text:"先生即将隐去，可否将您的智慧留下，以飨后人？"},{speaker:"老子",text:"唉...道可道，非常道。但既然你诚心问道，我便留下五千言吧。"}],mood:"peaceful",visualPrompt:"Laozi riding an ox at the Hangu Pass, misty mountains in background, purple energy clouds in the east sky, ancient Chinese guard post, mystical atmosphere, traditional Chinese landscape painting style, scroll format"},{id:"scene-3",title:"第三章：运筹帷幄",narratio
