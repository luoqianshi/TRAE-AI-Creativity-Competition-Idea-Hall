<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyWeb · 本地学习应用</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main" class="skip-link">跳转到主要内容</a>
  <header class="top-bar">
    <button class="menu-btn" id="menuBtn" aria-label="切换目录">☰</button>
    <h1 class="logo" id="logoBtn">StudyWeb</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索项目或章节..." autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>
    <nav class="top-actions">
      <button id="statsBtn" class="icon-btn" title="学习统计" aria-label="学习统计">📊</button>
      <button id="fontBtn" class="icon-btn" title="字体大小" aria-label="字体大小">Aa</button>
      <button id="helpBtn" class="icon-btn" title="快捷键" aria-label="快捷键">⌨</button>
      <button id="bookmarkBtn" class="icon-btn" title="书签" aria-label="书签">🔖</button>
      <button id="themeBtn" class="icon-btn" title="切换主题" aria-label="切换主题">🌙</button>
    </nav>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="project-title" id="projectTitle">学习项目</div>
        <div class="sidebar-header-actions">
          <button class="back-home" id="backHome">← 返回首页</button>
          <button class="sidebar-toggle" id="sidebarToggle" title="收起侧边栏" aria-label="收起侧边栏">◀</button>
        </div>
      </div>
      <div class="toc" id="toc"></div>
    </aside>

    <main class="main" id="main">
      <div class="home-view" id="homeView">
        <section class="hero">
          <h2>本地学习中心</h2>
          <p>动态加载 HTML 学习项目，统一入口、进度追踪、书签管理。</p>
        </section>

        <section class="section-block" id="continueSection">
          <h3>继续学习</h3>
          <div class="card-list" id="continueList"></div>
        </section>

        <section class="section-block" id="projectsSection">
          <div class="section-header">
            <h3>全部项目</h3>
            <div class="filter-bar" id="filterBar"></div>
          </div>
          <div class="card-grid" id="projectsGrid"></div>
        </section>
      </div>

      <div class="reader-view hidden" id="readerView">
        <div class="reader-toolbar">
          <div class="breadcrumbs" id="breadcrumbs"></div>
          <div class="reader-actions">
            <button id="readerBookmarkBtn" class="text-btn">添加书签</button>
            <button id="prevChapterBtn" class="text-btn">上一章</button>
            <button id="nextChapterBtn" class="text-btn">下一章</button>
          </div>
        </div>
        <iframe id="contentFrame" title="学习内容"></iframe>
      </div>
    </main>
  </div>

  <div class="drawer-overlay hidden" id="drawerOverlay"></div>
  <aside class="bookmark-drawer hidden" id="bookmarkDrawer">
    <div class="drawer-header">
      <h3>我的书签</h3>
      <button class="close-btn" id="closeDrawer">×</button>
    </div>
    <div class="bookmark-list" id="bookmarkList"></div>
  </aside>

  <div class="modal-overlay hidden" id="modalOverlay"></div>
  <div class="modal hidden" id="statsModal">
    <div class="modal-header">
      <h3>学习统计</h3>
      <button class="close-btn" id="closeStats">×</button>
    </div>
    <div class="modal-body" id="statsBody"></div>
  </div>

  <div class="modal hidden" id="fontModal">
    <div class="modal-header">
      <h3>字体大小</h3>
      <button class="close-btn" id="closeFont">×</button>
    </div>
    <div class="modal-body">
      <div class="font-control">
        <button id="fontDecrease" class="text-btn">A-</button>
        <span id="fontSizeLabel">16px</span>
        <button id="fontIncrease" class="text-btn">A+</button>
      </div>
      <div class="font-preview" id="fontPreview">预览文字 Abc 123</div>
    </div>
  </div>

  <div class="modal hidden" id="helpModal">
    <div class="modal-header">
      <h3>键盘快捷键</h3>
      <button class="close-btn" id="closeHelp">×</button>
    </div>
    <div class="modal-body">
      <div class="shortcut-grid">
        <div class="shortcut-item"><kbd>←</kbd> 上一章</div>
        <div class="shortcut-item"><kbd>→</kbd> 下一章</div>
        <div class="shortcut-item"><kbd>B</kbd> 添加/移除书签</div>
        <div class="shortcut-item"><kbd>/</kbd> 聚焦搜索框</div>
        <div class="shortcut-item"><kbd>Esc</kbd> 关闭面板/返回首页</div>
        <div class="shortcut-item"><kbd>Home</kbd> 跳到第一章</div>
        <div class="shortcut-item"><kbd>End</kbd> 跳到最后一章</div>
        <div class="shortcut-item"><kbd>1-9</kbd> 跳转到第N个项目</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
