<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2C3E50">
  <title>灵感笔 · AI写小说APP UI演示</title>

  <!-- 字体：Noto Serif SC（衬线·标题）+ Noto Sans SC（无衬线·正文） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- 样式表（按依赖顺序） -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">

  <style>
    /* 桌面端居中展示手机框 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #1a1f2e 0%, #2d3548 100%);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    /* 装饰性背景纹理 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(212,165,116,0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(102,126,234,0.08) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }
    #app {
      position: relative;
      z-index: 1;
    }
    /* 小屏幕设备自适应 */
    @media (max-width: 480px) {
      body { background: var(--bg-base, #F5F2EC); }
      .phone-frame {
        width: 100vw !important;
        height: 100vh !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- 应用根容器，由 app.js 动态渲染 .phone-frame -->
  <div id="app"></div>

  <!-- 脚本（按依赖顺序加载：data → components → screens → app） -->
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
