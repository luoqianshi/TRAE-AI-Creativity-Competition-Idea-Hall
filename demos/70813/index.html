    /**
     * 绑定导航栏事件
     */
    function bindNavEvents() {
      document.getElementById("addBtn").addEventListener("click", () => navigate("add"));

      // 搜索输入（防抖）
      document.getElementById("searchInput").addEventListener("input", (e) => {
        debouncedSearch(e.target.value);
      });

      // 搜索切换（移动端）
      document.getElementById("searchToggle").addEventListener("click", () => {
        const searchBox = document.querySelector(".nav__search");
        searchBox.classList.toggle("is-open");
        if (searchBox.classList.contains("is-open")) {
          document.getElementById("searchInput").focus();
        }
      });

      // 设置按钮
      document.getElementById("settingsBtn").addEventListener("click", openSettings);
    }

    /**
     * 绑定视图切换事件
     */
    function bindViewToggleEvents() {
      document.querySelectorAll("#viewToggle .view-toggle__btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll("#viewToggle .view-toggle__btn")
            .forEach((b) => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          router.viewMode = btn.dataset.view;
          renderGallery();
        });
      });
    }

    /**
     * 绑定筛选面板事件（标签多选 / 心情单选 / 评分范围 / 年份 / 清除）
     */
    function bindFilterEvents() {
      const panel = document.getElementById("filterPanel");

      // ===== 点击事件委托：标签 pill 多选 + 心情 pill 单选 =====
      panel.addEventListener("click", (e) => {
        // 标签 pill（多选，点击切换）
        const tagPill = e.target.closest(".filter-pill[data-tag-id]");
        if (tagPill) {
          const tagId = tagPill.dataset.tagId;
          const idx = router.filterTags.indexOf(tagId);
          if (idx === -1) {
            router.filterTags.push(tagId);
          } else {
            router.filterTags.splice(idx, 1);
          }
          renderGallery();
          return;
        }

        // 心情 pill（单选，再次点击取消）
        const moodPill = e.target.closest(".filter-pill[data-mood]");
        if (moodPill) {
          const mood = moodPill.dataset.mood;
          router.filterMood = router.filterMood === mood ? "" : mood;
          renderGallery();
          return;
        }

        // 清除筛选按钮
        if (e.target.id === "clearFiltersBtn") {
          clearAllFilters();
          return;
        }
      });

      // ===== 评分下限变化 =====
      document.getElementById("scoreMinSelect").addEventListener("change", (e) => {
        const v = e.target.value;
        router.scoreMin = v === "" ? null : parseInt(v);
        // 保证 min ≤ max
        if (router.scoreMax !== null && router.scoreMin !== null && router.scoreMin > router.scoreMax) {
          router.scoreMax = router.scoreMin;
        }
        renderGallery();
      });

      // ===== 评分上限变化 =====
      document.getElementById("scoreMaxSelect").addEventListener("change", (e) => {
        const v = e.target.value;
        router.scoreMax = v === "" ? null : parseInt(v);
        // 保证 min ≤ max
        if (router.scoreMin !== null && router.scoreMax !== null && router.scoreMin > router.scoreMax) {
          router.scoreMin = router.scoreMax;
        }
        renderGallery();
      });

      // ===== 年份变化 =====
      document.getElementById("yearSelect").addEventListener("change", (e) => {
        router.filterYear = e.target.value;
        renderGallery();
      });
    }

    /**
     * 绑定空状态事件
     */
    function bindEmptyStateEvents() {
      document
        .getElementById("emptyAddBtn")
        .addEventListener("click", () => navigate("add"));
    }

    /**
     * 绑定图片上传事件
     */
    function bindImageUploadEvents() {
      const uploadZone = document.getElementById("uploadZone");
      const imageInput = document.getElementById("imageInput");
      const uploadPreview = document.getElementById("uploadPreview");
      const uploadPlaceholder = document.getElementById("uploadPlaceholder");

      uploadZone.addEventListener("click", () => imageInput.click());

      uploadZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadZone.classList.add("is-dragover");
      });

      uploadZone.addEventListener("dragleave", () => {
        uploadZone.classList.remove("is-dragover");
      });

      uploadZone.addEventListener("drop", async (e) => {
        e.preventDefault();
        uploadZone.classList.remove("is-dragover");
        const file = e.dataTransfer.files[0];
        if (file) {
          try {
            addState.image = await imageCompress(file);
            uploadPreview.src = addState.image;
            uploadPreview.hidden = false;
            uploadPlaceholder.hidden = true;
          } catch (err) {
            showToast(err.message || "图片加载失败");
          }
        }
      });

      imageInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (file) {
          try {
            addState.image = await imageCompress(file);
            uploadPreview.src = addState.image;
            uploadPreview.hidden = false;
            uploadPlaceholder.hidden = true;
          } catch (err) {
            showToast(err.message || "图片加载失败");
          }
        }
      });
    }

    /**
     * 绑定标签选择器外部点击事件
     */
    function bindTagSelectorEvents() {
      // 点击其他地方收起新建标签输入框
      document.addEventListener("click", (e) => {
        if (addState.isCreatingTag) {
          const tagSelector = document.getElementById("tagSelector");
          const inlineInput = document.getElementById("tagAddInline");
          if (
            tagSelector &&
            !tagSelector.contains(e.target) &&
            (!inlineInput || !inlineInput.contains(e.target))
          ) {
            addState.isCreatingTag = false;
            updateTagSelector();
          }
        }
      });
    }

    /**
     * 绑定心情标签事件
     */
    function bindMoodEvents() {
      document.querySelectorAll(".mood-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          const mood = btn.dataset.mood;
          if (addState.mood === mood) {
            addState.mood = "";
          } else {
            addState.mood = mood;
          }
          updateMoodUI();
        });
      });
    }

    /**
     * 绑定评分事件
     */
    function bindRatingEvents() {
      document.getElementById("scoreRange").addEventListener("input", (e) => {
        const value = parseInt(e.target.value);
        addState.rating = value;
        document.getElementById("scoreValue").textContent = value;
        updateRatingUI();
      });

      document.querySelectorAll(".star-rating .star").forEach((star) => {
        star.addEventListener("click", () => {
          const starValue = parseInt(star.dataset.value);
          const value = getValueFromStar(starValue);
          addState.rating = value;
          document.getElementById("scoreRange").value = value;
          document.getElementById("scoreValue").textContent = value;
          updateRatingUI();
        });
        star.addEventListener("mouseenter", () => {
          const starCount = getStarFromValue(addState.rating);
          document.querySelectorAll(".star-rating .star").forEach((s, idx) => {
            const sv = idx + 1;
            s.classList.remove("is-active", "is-preview");
            if (sv <= parseInt(star.dataset.value)) {
              s.classList.add("is-preview");
            } else if (sv <= starCount) {
              s.classList.add("is-active");
            }
          });
        });
        star.addEventListener("mouseleave", () => {
          updateRatingUI();
        });
      });

      document.querySelectorAll(".rating-number").forEach((btn) => {
        btn.addEventListener("click", () => {
          const value = parseInt(btn.dataset.value);
          addState.rating = value;
          document.getElementById("scoreRange").value = value;
          document.getElementById("scoreValue").textContent = value;
          updateRatingUI();
        });
      });
    }

    /**
     * 绑定日期输入事件
     */
    function bindDateInputEvents() {
      const dateInput = document.getElementById("dateInput");
      const datePicker = document.getElementById("datePicker");
      const dateError = document.getElementById("dateError");

      // 文本输入blur时解析
      dateInput.addEventListener("blur", () => {
        const value = dateInput.value.trim();
        if (!value) {
          dateInput.classList.remove("is-error");
          dateError.classList.remove("is-visible");
          return;
        }

        const parsed = parseDate(value);
        if (parsed) {
          // 解析成功，格式化为中文显示
          dateInput.value = formatDate(parsed);
          dateInput.dataset.isoDate = parsed;
          dateInput.classList.remove("is-error");
          dateError.classList.remove("is-visible");
        } else {
          // 解析失败
          dateInput.classList.add("is-error");
          dateError.classList.add("is-visible");
        }
      });

      // 聚焦时显示ISO格式（方便编辑）
      dateInput.addEventListener("focus", () => {
        if (dateInput.dataset.isoDate) {
          dateInput.value = dateInput.dataset.isoDate;
        }
        dateInput.classList.remove("is-error");
        dateError.classList.remove("is-visible");
      });

      // 回车时触发blur
      dateInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          dateInput.blur();
        }
      });

      // 日期选择器同步
      datePicker.addEventListener("change", () => {
        if (datePicker.value) {
          dateInput.value = formatDate(datePicker.value);
          dateInput.dataset.isoDate = datePicker.value;
          dateInput.classList.remove("is-error");
          dateError.classList.remove("is-visible");
        }
      });
    }

    /**
     * 绑定表单提交事件
     */
    function bindFormSubmitEvents() {
      document.getElementById("addForm").addEventListener("submit", (e) => {
        e.preventDefault();

        // 名称验证
        let name = document.getElementById("nameInput").value.trim();
        name = filterControlChars(name);
        if (!name) {
          showToast("请输入名称");
          return;
        }
        if (name.length > CHAR_LIMITS.NAME_MAX) {
          showToast(`名称不能超过${CHAR_LIMITS.NAME_MAX}个字符`);
          return;
        }

        // 日期验证
        const dateInput = document.getElementById("dateInput");
        let dateValue = null;
        if (dateInput.value.trim()) {
          if (dateInput.dataset.isoDate) {
            dateValue = dateInput.dataset.isoDate;
          } else {
            const parsed = parseDate(dateInput.value.trim());
            if (!parsed) {
              showToast("请输入正确的日期格式");
              return;
            }
            dateValue = parsed;
          }
        }

        // 故事验证
        let story = document.getElementById("storyInput").value;
        story = filterControlChars(story).trim();
        if (story.length > CHAR_LIMITS.STORY_MAX) {
          showToast(`故事不能超过${CHAR_LIMITS.STORY_MAX}个字符`);
          return;
        }

        // 图片大小验证
        if (addState.image && getBase64Size(addState.image) > SIZE_LIMITS.IMAGE_MAX) {
          showToast("图片过大，请选择较小的图片");
          return;
        }

        const newItem = {
          name: name,
          date: dateValue,
          tag: addState.selectedTagId,
          mood: addState.mood,
          rating: addState.rating,
          story: story,
          image: addState.image,
        };

        const created = addItem(newItem);
        if (created) {
          showToast("藏品已添加");
          navigate("gallery");
        }
      });
    }

    /**
     * 绑定模态框事件
     */
    function bindModalEvents() {
      document.getElementById("modalCancel").addEventListener("click", hideDeleteModal);

      document.getElementById("modalConfirm").addEventListener("click", () => {
        if (deleteTargetId) {
          deleteItem(deleteTargetId);
          hideDeleteModal();
          showToast("藏品已删除");
          navigate("gallery");
        }
      });

      document.getElementById("confirmModal").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) hideDeleteModal();
      });
    }

    /**
     * 绑定设置面板事件
     */
    function bindSettingsEvents() {
      document.getElementById("settingsClose").addEventListener("click", closeSettings);

      document.getElementById("settingsOverlay").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeSettings();
      });

      // 主题切换
      document.querySelectorAll("#themeGroup .settings-radio").forEach((btn) => {
        btn.addEventListener("click", () => {
          const settings = getSettings();
          settings.theme = btn.dataset.theme;
          saveSettings(settings);
          syncSettingsUI();
        });
      });

      // 默认视图切换
      document.querySelectorAll("#viewGroup .settings-radio").forEach((btn) => {
        btn.addEventListener("click", () => {
          const settings = getSettings();
          settings.defaultView = btn.dataset.view;
          saveSettings(settings);
          syncSettingsUI();
        });
      });

      // 排序切换
      document.getElementById("sortSelect").addEventListener("change", (e) => {
        const settings = getSettings();
        settings.defaultSort = e.target.value;
        saveSettings(settings);
        renderGallery();
      });

      // 数据导出
      document.getElementById("exportSettingsBtn").addEventListener("click", () => {
        const data = {
          items: getItems(),
          tags: getTags(),
          settings: getSettings(),
          exportedAt: new Date().toISOString(),
          version: "2.0",
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `digital-museum-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("数据已导出");
      });

      // 数据导入
      document.getElementById("importSettingsBtn").addEventListener("click", () => {
        document.getElementById("importFile").click();
      });

      document.getElementById("importFile").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.items && Array.isArray(data.items)) {
              saveItems(data.items.filter(isValidItem));
            }
            if (data.tags && Array.isArray(data.tags)) {
              const validTags = data.tags.filter(isValidTag);
              if (validTags.length > 0) {
                localStorage.setItem(STORAGE_KEYS.TAGS, JSON.stringify(validTags));
              }
            }
            if (data.settings) {
              saveSettings(data.settings);
            }
            showToast("数据已导入");
            closeSettings();
            navigate("gallery");
          } catch (err) {
            showToast("导入失败：文件格式错误");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });

      // 清空数据
      document.getElementById("clearDataBtn").addEventListener("click", () => {
        if (confirm("确定要清空所有数据吗？此操作无法撤销。")) {
          localStorage.removeItem(STORAGE_KEYS.ITEMS);
          localStorage.removeItem(STORAGE_KEYS.TAGS);
          showToast("所有数据已清空");
          closeSettings();
          navigate("gallery");
        }
      });
    }

    /**
     * 绑定系统主题变化监听
     */
    function bindThemeChangeListener() {
      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", () => {
          const settings = getSettings();
          if (settings.theme === "system") {
            applySettings(settings);
          }
        });
    }

    // 启动应用
    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
