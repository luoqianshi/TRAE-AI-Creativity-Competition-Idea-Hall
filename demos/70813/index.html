<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字物品博物馆</title>
  <style>
    /* ============================================================
     * 设计 Token
     * ============================================================ */
    :root {
      --bg-primary: #FAF6F1;
      --bg-card: #FFFFFF;
      --bg-dark: #2C1810;
      --accent: #C8956C;
      --accent-light: #F0DFD0;
      --text-primary: #2C1810;
      --text-secondary: #8B7355;
      --border: #E8DFD5;
      --danger: #C0392B;
      --danger-light: rgba(192, 57, 43, 0.1);

      --shadow-sm: 0 2px 8px rgba(44, 24, 16, 0.04);
      --shadow-md: 0 6px 20px rgba(44, 24, 16, 0.08);
      --shadow-lg: 0 12px 40px rgba(44, 24, 16, 0.12);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 40px;
      --font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      --transition: 0.25s ease;
    }

    /* ===== 深色主题 ===== */
    .theme-dark {
      --bg-primary: #1A1410;
      --bg-card: #2C2420;
      --bg-dark: #FAF6F1;
      --accent: #D4A574;
      --accent-light: rgba(212, 165, 116, 0.15);
      --text-primary: #FAF6F1;
      --text-secondary: #A89886;
      --border: #3D3530;
      --danger-light: rgba(192, 57, 43, 0.15);
    }

    /* ============================================================
     * 基础重置
     * ============================================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-family);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea, select { font-family: inherit; }

    /* ============================================================
     * 顶部导航栏
     * ============================================================ */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-md) var(--spacing-xl);
      background-color: rgba(250, 246, 241, 0.85);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border);
      transition: background-color 0.3s ease;
    }
    .theme-dark .nav {
      background-color: rgba(26, 20, 16, 0.9);
    }
    .nav__logo {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }
    .nav__logo::before {
      content: "";
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-light);
    }
    .nav__actions {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    .nav__add-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      color: var(--bg-primary);
      background-color: var(--bg-dark);
      border-radius: var(--radius-md);
      transition: transform var(--transition), box-shadow var(--transition), background-color var(--transition);
    }
    .nav__add-btn:hover {
      background-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .nav__add-btn:active { transform: translateY(0); }
    .nav__add-btn::before { content: "+"; font-size: 18px; font-weight: 300; line-height: 1; }

    /* ===== 导航搜索按钮 ===== */
    .nav__search-btn {
      flex: 0 1 360px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-sm);
      padding: 9px 16px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-secondary);
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: border-color var(--transition), box-shadow var(--transition);
      position: relative;
    }
    .nav__search-btn:hover,
    .nav__search-btn.is-active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
      color: var(--text-primary);
    }
    .nav__search-icon { font-size: 16px; }
    .nav__search-text { flex: 1; text-align: left; }
    .nav__search-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background-color: var(--danger);
      border-radius: 9px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .nav__search-badge.is-visible { display: inline-flex; }

    /* ===== 搜索筛选下拉面板 ===== */
    .search-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: var(--spacing-xl);
      right: var(--spacing-xl);
      max-width: 600px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: var(--spacing-md);
      z-index: 200;
      display: none;
      animation: dropdownIn 0.2s ease;
    }
    .search-dropdown.is-open { display: block; }
    @keyframes dropdownIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .search-dropdown__input-wrap {
      position: relative;
      margin-bottom: var(--spacing-md);
    }
    .search-dropdown__input {
      width: 100%;
      padding: 10px 40px 10px 16px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: none;
      transition: border-color var(--transition);
    }
    .search-dropdown__input:focus { border-color: var(--accent); }
    .search-dropdown__input::placeholder { color: var(--text-secondary); }
    .search-dropdown__clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      font-size: 18px;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .search-dropdown__clear:hover { color: var(--danger); border-color: var(--danger); }

    .search-dropdown__section {
      margin-bottom: var(--spacing-md);
    }
    .search-dropdown__section:last-of-type { margin-bottom: 0; }
    .search-dropdown__label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-xs);
    }
    .search-dropdown__pills {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-xs);
    }
    .search-dropdown__pill {
      padding: 5px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .search-dropdown__pill:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .search-dropdown__pill.is-active {
      color: #fff;
      background-color: var(--accent);
      border-color: var(--accent);
    }
    .search-dropdown__pill.is-active--tag {
      color: #fff;
    }

    .search-dropdown__score {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }
    .search-dropdown__score-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px;
    }
    .search-dropdown__score-btn {
      width: 28px;
      height: 28px;
      font-size: 16px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all var(--transition);
    }
    .search-dropdown__score-btn:hover {
      color: var(--accent);
      background-color: var(--accent-light);
    }
    .search-dropdown__score-value {
      min-width: 36px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: center;
    }
    .search-dropdown__score-sep {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .search-dropdown__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px dashed var(--border);
    }
    .search-dropdown__count {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .search-dropdown__count strong {
      color: var(--accent);
      font-weight: 600;
    }
    .search-dropdown__reset {
      padding: 6px 16px;
      font-size: 12px;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: all var(--transition);
    }
    .search-dropdown__reset:hover {
      color: #e85d5d;
      border-color: #e85d5d;
    }
    .nav__icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      font-size: 16px;
      color: var(--text-primary);
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 50%;
      transition: all var(--transition);
    }
    .nav__icon-btn:hover {
      color: var(--bg-primary);
      background-color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    @media (max-width: 720px) {
      .nav { flex-wrap: wrap; gap: var(--spacing-sm); padding: var(--spacing-md); }
      .nav__search-btn { flex: 1 1 100%; order: 3; justify-content: flex-start; }
      .search-dropdown {
        position: fixed;
        top: 60px;
        left: 0;
        right: 0;
        max-width: none;
        border-radius: 0;
        border-left: none;
        border-right: none;
        border-top: none;
        box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        max-height: calc(100vh - 60px);
        overflow-y: auto;
      }
      .search-dropdown__pills {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
      }
    }

    /* ============================================================
     * 页面切换
     * ============================================================ */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--spacing-xl);
      animation: fadeIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .page[hidden] { display: none; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
     * 通用按钮
     * ============================================================ */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 500;
      color: var(--bg-primary);
      background-color: var(--accent);
      border-radius: var(--radius-md);
      transition: transform var(--transition), box-shadow var(--transition), background-color var(--transition);
    }
    .btn-primary:hover {
      background-color: var(--bg-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-lg { padding: 14px 32px; font-size: 15px; }
    .btn-block { width: 100%; }

    /* ============================================================
     * 统计栏
     * ============================================================ */
    .gallery-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--spacing-lg);
      flex-wrap: wrap;
      gap: var(--spacing-md);
    }
    .gallery-stats {
      display: flex;
      align-items: baseline;
      gap: var(--spacing-sm);
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0;
    }
    .gallery-stats__count {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    /* ===== 视图切换 ===== */
    .view-toggle {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
    .view-toggle__btn {
      width: 36px;
      height: 32px;
      font-size: 16px;
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }
    .view-toggle__btn:hover { color: var(--accent); }
    .view-toggle__btn.is-active { color: var(--bg-primary); background-color: var(--accent); }



    /* ============================================================
     * 展厅网格
     * ============================================================ */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--spacing-lg);
    }
    @media (max-width: 1024px) { .gallery-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .gallery-grid { grid-template-columns: 1fr; } }



    /* ============================================================
     * 物品卡片
     * ============================================================ */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px);
      animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .card:hover { transform: translateY(-4px) scale(1.02); box-shadow: var(--shadow-lg); }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card__image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background-color: var(--accent-light);
    }
    .card__body { padding: var(--spacing-md); }
    .card__name { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: var(--spacing-xs); }
    .card__story { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: var(--spacing-md); min-height: 39px; }
    .card__footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--spacing-xs); }
    .tag-badge {
      display: inline-block;
      padding: 3px 10px;
      font-size: 12px;
      border-radius: 999px;
      background-color: var(--accent-light);
      color: var(--text-primary);
    }
    .stars { color: var(--accent); font-size: 13px; letter-spacing: 1px; }
    .stars .star-empty { color: var(--border); }
    .mood-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 4px;
      background-color: var(--accent-light);
      color: var(--text-primary);
    }
    .rating-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    /* ============================================================
     * 空状态
     * ============================================================ */
    .empty-state {
      text-align: center;
      padding: var(--spacing-xl) var(--spacing-md);
    }
    .empty-state__icon {
      width: 96px;
      height: 96px;
      margin: 0 auto var(--spacing-lg);
      color: var(--accent);
      opacity: 0.55;
    }
    .empty-state__icon svg { width: 100%; height: 100%; display: block; }
    .empty-state__text { font-size: 16px; color: var(--text-secondary); margin-bottom: var(--spacing-xl); }

    /* ============================================================
     * 时间线视图
     * ============================================================ */
    .timeline-container {
      position: relative;
      padding-left: 80px;
    }
    .timeline-nav {
      position: fixed;
      left: 20px;
      top: 120px;
      width: 40px;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--spacing-sm) 0;
      z-index: 50;
      box-shadow: var(--shadow-md);
    }
    .timeline-nav__year {
      display: block;
      width: 100%;
      padding: var(--spacing-sm) var(--spacing-xs);
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }
    .timeline-nav__year:hover { color: var(--accent); background-color: var(--accent-light); }
    .timeline-nav__year.is-active {
      color: var(--bg-primary);
      background-color: var(--accent);
    }
    .timeline {
      position: relative;
      padding: var(--spacing-md) 0;
    }
    .timeline::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--border);
      transform: translateX(-50%);
    }
    .timeline-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      margin-bottom: var(--spacing-xl);
      animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    .timeline-item:nth-child(odd) { justify-content: flex-end; }
    .timeline-item__date {
      flex: 0 0 calc(50% - 40px);
      font-size: 13px;
      color: var(--text-secondary);
      padding: var(--spacing-md) var(--spacing-lg);
      text-align: right;
    }
    .timeline-item:nth-child(odd) .timeline-item__date { order: 1; text-align: left; }
    .timeline-item__node {
      position: absolute;
      left: 50%;
      top: 18px;
      width: 14px;
      height: 14px;
      background-color: var(--accent);
      border: 3px solid var(--bg-primary);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 0 2px var(--accent);
      z-index: 1;
    }
    .timeline-item__card {
      flex: 0 0 calc(50% - 40px);
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
    }
    .timeline-item__card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .timeline-item__name { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .timeline-item__story { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin-bottom: var(--spacing-sm); }
    .timeline-item__footer { display: flex; align-items: center; gap: var(--spacing-sm); flex-wrap: wrap; }

    @media (max-width: 640px) {
      .timeline-container { padding-left: 50px; }
      .timeline-nav { left: 10px; width: 30px; }
      .timeline-nav__year { font-size: 10px; padding: 6px 2px; }
      .timeline::before { left: 25px; }
      .timeline-item, .timeline-item:nth-child(odd) { justify-content: flex-end; }
      .timeline-item__node { left: 25px; }
      .timeline-item__date, .timeline-item:nth-child(odd) .timeline-item__date {
        flex: 0 0 30px; text-align: right; padding-right: 20px; padding-left: 0; font-size: 11px;
      }
      .timeline-item__card, .timeline-item:nth-child(odd) .timeline-item__card {
        flex: 0 0 calc(100% - 50px);
      }
    }

    /* ============================================================
     * 详情页
     * ============================================================ */
    .detail-wrap { max-width: 760px; margin: 0 auto; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--spacing-xs);
      padding: 8px 0;
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-lg);
      transition: color var(--transition);
    }
    .back-btn:hover { color: var(--accent); }
    .detail__image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      margin-bottom: var(--spacing-xl);
      background-color: var(--accent-light);
    }
    .detail__name { font-size: 32px; font-weight: 700; color: var(--text-primary); margin-bottom: var(--spacing-sm); }
    .detail__meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-md);
      font-size: 14px;
      color: var(--text-secondary);
    }
    .detail__mood {
      margin-bottom: var(--spacing-md);
      font-size: 14px;
    }
    .detail__rating {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-lg);
      font-size: 16px;
    }
    .detail__rating .rating-value {
      font-weight: 600;
      color: var(--accent);
    }
    .detail__story {
      max-width: 640px;
      margin: var(--spacing-lg) auto 0;
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-primary);
      padding: var(--spacing-lg);
      background-color: var(--accent-light);
      border-left: 4px solid var(--accent);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      white-space: pre-wrap;
    }
    .detail__delete {
      display: block;
      margin: var(--spacing-xl) auto 0;
      padding: 10px 28px;
      font-size: 14px;
      color: #C0392B;
      background: transparent;
      border: 1px solid #C0392B;
      border-radius: var(--radius-md);
      transition: all var(--transition);
    }

    /* ============================================================
     * 自定义模态框
     * ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(44, 24, 16, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      z-index: 2000;
    }
    .modal-overlay.is-open { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(360px, 90vw);
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl) var(--spacing-lg) var(--spacing-lg);

    }
    .modal-overlay.is-open .modal { transform: translateY(0) scale(1); }
    .modal__title { font-size: 18px; font-weight: 600; color: var(--text-primary); margin-bottom: var(--spacing-sm); }
    .modal__desc { font-size: 14px; color: var(--text-secondary); margin-bottom: var(--spacing-lg); line-height: 1.5; }
    .modal__actions { display: flex; gap: var(--spacing-sm); }
    .modal__actions button {

      font-size: 14px;
      font-weight: 500;
      border-radius: var(--radius-md);

    .modal__cancel { color: var(--text-secondary); background-color: var(--bg-primary); border: 1px solid var(--border); }

    /* ============================================================

    .toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ============================================================
     * 设置面板
     * ============================================================ */
    .settings-overlay {
      position: fixed;

    .settings-header {

    .settings-group { margin-bottom: var(--spacing-xl); }
    .settings-label {

      color: var(--text-primary);

    }
    .settings-radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
    }
    .settings-radio {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--bg-primary);

    .settings-btn {

      border: 1px solid var(--border);

</head>

  <script>
    /* ============================================================
     * 第一部分：常量定义
     * ============================================================ */

    // localStorage 键名常量
    const STORAGE_KEYS = {
      ITEMS: "digital_museum_items",
      TAGS: "digital_museum_tags",
      SETTINGS: "digital_museum_settings",
    };

    // 预设标签颜色组（循环使用）
    const TAG_COLORS = [
      "#E8B4B8",
      "#A8D5BA",
      "#B8CCE8",
      "#E8D5A8",
      "#D4A5D4",
      "#A5D4D4",
      "#F0C8A0",
      "#C8B8E8",
    ];

    // 默认标签列表
    const DEFAULT_TAGS = ["礼物", "旅行", "日常", "收藏", "其他"];

    // 情感标签定义
    const EMOTION_OPTIONS = [
      { label: "珍藏", emoji: "❤️", minValue: 9 },
      { label: "喜爱", emoji: "⭐", minValue: 7 },
      { label: "喜欢", emoji: "😊", minValue: 5 },
      { label: "平淡", emoji: "😐", minValue: 3 },
      { label: "怀念", emoji: "💭", minValue: 1 },
    ];

    // 字符限制常量
    const CHAR_LIMITS = {
      NAME_MAX: 50,
      STORY_MAX: 2000,
      TAG_MAX: 15,
    };

    // 数据大小限制（字节）
    const SIZE_LIMITS = {
      IMAGE_MAX: 500 * 1024, // 500KB
      TOTAL_MAX: 4 * 1024 * 1024, // 4MB
    };

    // 搜索防抖延迟（毫秒）
    const SEARCH_DEBOUNCE_MS = 300;

    // 默认设置
    const DEFAULT_SETTINGS = {
      theme: "system",
      defaultView: "grid",
      defaultSort: "added",
    };

    /* ============================================================
     * 第二部分：工具函数
     * ============================================================ */

    /**
     * HTML 转义函数，防止 XSS 注入
     * @param {string} str - 需要转义的字符串
     * @returns {string} 转义后的安全字符串
     */
    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /**
     * 正则表达式特殊字符转义，防止搜索注入
     * @param {string} str - 需要转义的字符串
     * @returns {string} 转义后的安全正则字符串
     */
    function escapeRegex(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    /**
     * 过滤控制字符
     * @param {string} str - 输入字符串
     * @returns {string} 过滤后的字符串
     */
    function filterControlChars(str) {
      return String(str).replace(/[\x00-\x1F\x7F-\x9F]/g, "");
    }

    /**
     * 验证标签名格式：只允许中文、英文、数字、空格
     * @param {string} name - 标签名
     * @returns {boolean} 是否合法
     */
    function isValidTagName(name) {
      return /^[\u4e00-\u9fa5a-zA-Z0-9\s]+$/.test(name);
    }

    /**
     * 生成唯一ID
     * @returns {string} 唯一标识符
     */
    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    /**
     * 截断文本
     * @param {string} text - 原文本
     * @param {number} len - 最大长度
     * @returns {string} 截断后的文本
     */
    function truncateText(text, len) {
      if (!text) return "";
      return text.length > len ? text.slice(0, len) + "…" : text;
    }

    /**
     * 格式化日期为中文格式：YYYY年M月D日
     * @param {string|Date} date - 日期
     * @returns {string} 格式化后的日期字符串
     */
    function formatDate(date) {
      const d = new Date(date);
      if (isNaN(d.getTime())) return "";
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    /**
     * 多格式日期解析
     * 支持格式：
     * - 2023-05-12
     * - 2023/05/12
     * - 2023.05.12
     * - 2023年5月12日
     * - 23/5/12（两位年份，默认20xx）
     * - 5/12/2023（美式格式：月/日/年）
     * @param {string} input - 日期输入字符串
     * @returns {string|null} ISO格式日期字符串，解析失败返回null
     */
    function parseDate(input) {
      if (!input || !input.trim()) return null;
      const str = input.trim();

      let year, month, day;

      // 格式1：2023年5月12日
      let match = str.match(/^(\d{4})年(\d{1,2})月(\d{1,2})日$/);
      if (match) {
        year = parseInt(match[1]);
        month = parseInt(match[2]);
        day = parseInt(match[3]);
      }

      // 格式2：2023-05-12、2023/05/12、2023.05.12
      if (!match) {
        match = str.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
        if (match) {
          year = parseInt(match[1]);
          month = parseInt(match[2]);
          day = parseInt(match[3]);
        }
      }

      // 格式3：23/5/12（两位年份，两位月日）
      if (!match) {
        match = str.match(/^(\d{2})[-/.](\d{1,2})[-/.](\d{1,2})$/);
        if (match) {
          year = 2000 + parseInt(match[1]);
          month = parseInt(match[2]);
          day = parseInt(match[3]);
        }
      }

      // 格式4：5/12/2023（美式格式：月/日/年，四位年份在最后）
      if (!match) {
        match = str.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/);
        if (match) {
          month = parseInt(match[1]);
          day = parseInt(match[2]);
          year = parseInt(match[3]);
        }
      }

      if (!year || !month || !day) return null;

      // 验证日期合法性
      const date = new Date(year, month - 1, day);
      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ) {
        return null;
      }

      // 返回 ISO 格式日期（YYYY-MM-DD）
      const mm = String(month).padStart(2, "0");
      const dd = String(day).padStart(2, "0");
      return `${year}-${mm}-${dd}`;
    }

    /**
     * 计算 Base64 字符串大小（字节）
     * @param {string} base64 - Base64编码字符串
     * @returns {number} 字节数
     */
    function getBase64Size(base64) {
      if (!base64) return 0;
      // 去掉 data:image/xxx;base64, 前缀
      const clean = base64.includes(",") ? base64.split(",")[1] : base64;
      // Base64 编码每4个字符表示3字节
      return Math.floor((clean.length * 3) / 4);
    }

    /**
     * 获取 localStorage 中数据的总大小
     * @returns {number} 总字节数
     */
    function getTotalStorageSize() {
      let total = 0;
      for (let key in localStorage) {
        if (localStorage.hasOwnProperty(key)) {
          total += (localStorage[key].length + key.length) * 2; // UTF-16
        }
      }
      return total;
    }

    /**
     * 防抖函数
     * @param {Function} func - 要防抖的函数
     * @param {number} delay - 延迟毫秒数
     * @returns {Function} 防抖后的函数
     */
    function debounce(func, delay) {
      let timeoutId;
      return function (...args) {
        clearTimeout(timeoutId);
        timeoutId = setTimeout(() => func.apply(this, args), delay);
      };
    }

    /* ============================================================
     * 第三部分：数据层
     * ============================================================ */

    /* ---------- 物品数据管理 ---------- */

    /**
     * 验证物品数据 schema
     * @param {any} item - 待验证的物品
     * @returns {boolean} 是否为合法的物品数据
     */
    function isValidItem(item) {
      if (!item || typeof item !== "object") return false;
      if (typeof item.id !== "string") return false;
      if (typeof item.name !== "string" || item.name.length === 0) return false;
      return true;
    }

    /**
     * 净化物品输入数据：长度限制、控制字符过滤
     * @param {object} item - 原始物品数据
     * @returns {object} 净化后的物品数据
     */
    function sanitizeItem(item) {
      const result = { ...item };
      // 名称：过滤控制字符 + 长度限制
      if (typeof result.name === "string") {
        result.name = filterControlChars(result.name).trim();
        if (result.name.length > CHAR_LIMITS.NAME_MAX) {
          result.name = result.name.slice(0, CHAR_LIMITS.NAME_MAX);
        }
      }
      // 故事：长度限制（保留换行）
      if (typeof result.story === "string") {
        let s = result.story;
        // 过滤除 \n \r \t 之外的控制字符
        s = s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]/g, "");
        if (s.length > CHAR_LIMITS.STORY_MAX) {
          s = s.slice(0, CHAR_LIMITS.STORY_MAX);
        }
        result.story = s;
      }
      // 标签：item.tag 存储的是标签 ID（由 generateId 生成），
      // 不是用户输入的标签名，因此不应按标签名规则净化，只做基本字符串校验
      if (result.tag !== null && result.tag !== undefined) {
        result.tag = String(result.tag).trim();
      }
      return result;
    }

    /**
     * 获取所有物品（带 schema 校验和脏数据过滤）
     * @returns {Array} 物品列表
     */
    /**
     * 迁移旧的 emotion 数据格式到新的 mood/rating 字段
     * @param {object} item - 物品对象
     * @returns {object} 迁移后的物品对象
     */
    function migrateItemEmotion(item) {
      if (!item) return item;
      if ("emotion" in item) {
        const emotion = item.emotion;
        let mood = "";
        let rating = 0;
        if (typeof emotion === "object" && emotion !== null) {
          mood = emotion.label || "";
          rating = emotion.value || 0;
        } else if (typeof emotion === "number") {
          rating = emotion * 2;
        }
        delete item.emotion;
        item.mood = mood;
        item.rating = rating;
        console.log("[数据迁移] 物品", item.id, "emotion 迁移完成:", { mood, rating });
        return true;
      }
      return false;
    }

    function getItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.ITEMS);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        let needsSave = false;
        const items = parsed.map((item) => {
          if (migrateItemEmotion(item)) {
            needsSave = true;
          }
          return item;
        }).filter((item) => isValidItem(item));
        if (needsSave) {
          saveItems(items);
          console.log("[数据迁移] 已将旧 emotion 格式迁移为 mood/rating");
        }
        return items;
      } catch (err) {
        console.error("读取物品数据失败:", err);
        return [];
      }
    }

    /**
     * 根据ID获取单个物品
     * @param {string} id - 物品ID
     * @returns {object|null} 物品对象，不存在返回null
     */
    function getItem(id) {
      return getItems().find((it) => it.id === id) || null;
    }

    /**
     * 添加新物品
     * @param {object} item - 物品数据
     * @returns {object|null} 新创建的物品对象，失败返回null
     */
    function addItem(item) {
      // 检查总数据量限制
      if (getTotalStorageSize() > SIZE_LIMITS.TOTAL_MAX) {
        showToast("存储空间不足，请删除部分藏品后再添加");
        return null;
      }

      // 输入净化
      const clean = sanitizeItem(item);

      const items = getItems();
      const newItem = {
        ...clean,
        id: generateId(),
        createdAt: new Date().toISOString(),
      };
      items.push(newItem);
      saveItems(items);
      return newItem;
    }

    /**
     * 更新物品
     * @param {string} id - 物品ID
     * @param {object} data - 更新数据
     * @returns {object|null} 更新后的物品对象
     */
    function updateItem(id, data) {
      const items = getItems();
      const index = items.findIndex((it) => it.id === id);
      if (index === -1) return null;
      const clean = sanitizeItem(data);
      items[index] = { ...items[index], ...clean, id };
      saveItems(items);
      return items[index];
    }

    /**
     * 删除物品
     * @param {string} id - 物品ID
     * @returns {boolean} 是否成功删除
     */
    function deleteItem(id) {
      const items = getItems();
      const next = items.filter((it) => it.id !== id);
      if (next.length === items.length) return false;
      saveItems(next);
      return true;
    }

    /**
     * 保存物品列表到 localStorage
     * @param {Array} items - 物品列表
     */
    function saveItems(items) {
      localStorage.setItem(STORAGE_KEYS.ITEMS, JSON.stringify(items));
    }

    /* ---------- 标签数据管理 ---------- */

    /**
     * 验证标签数据 schema
     * @param {any} tag - 待验证的标签
     * @returns {boolean} 是否合法
     */
    function isValidTag(tag) {
      if (!tag || typeof tag !== "object") return false;
      if (typeof tag.id !== "string") return false;
      if (typeof tag.name !== "string" || tag.name.length === 0) return false;
      return true;
    }

    /**
     * 初始化默认标签
     * @returns {Array} 默认标签列表
     */
    function initDefaultTags() {
      const tags = DEFAULT_TAGS.map((name, i) => ({
        id: generateId(),
        name,
        color: TAG_COLORS[i % TAG_COLORS.length],
      }));
      saveTags(tags);
      console.log("[标签管理] 初始化默认标签:", tags.map((t) => t.name));
      return tags;
    }

    /**
     * 获取所有标签（带 schema 校验）
     * @returns {Array} 标签列表
     */
    function getTags() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.TAGS);
        if (!raw) {
          console.log("[标签管理] localStorage 中无标签数据，初始化默认标签");
          return initDefaultTags();
        }
        const parsed = JSON.parse(raw);
        console.log("[标签管理] 从 localStorage 读取标签:", parsed.length, "个");
        if (!Array.isArray(parsed) || parsed.length === 0) {
          console.log("[标签管理] 标签数据格式异常，初始化默认标签");
          return initDefaultTags();
        }
        const validTags = parsed.filter((tag) => isValidTag(tag));
        if (validTags.length === 0) {
          console.log("[标签管理] 无有效标签，初始化默认标签");
          return initDefaultTags();
        }
        return validTags;
      } catch (err) {
        console.error("[标签管理] 读取标签数据失败:", err);
        return initDefaultTags();
      }
    }

    /**
     * 保存标签列表到 localStorage
     * @param {Array} tags - 标签列表
     */
    function saveTags(tags) {
      const json = JSON.stringify(tags);
      localStorage.setItem(STORAGE_KEYS.TAGS, json);
      console.log("[标签管理] 标签已保存到 localStorage，共", tags.length, "个");
      console.log("[标签管理] 标签数据:", tags.map((t) => ({ id: t.id, name: t.name, color: t.color })));
    }

    /**
     * 添加新标签
     * @param {string} name - 标签名称
     * @returns {object|null} 新创建的标签对象，失败返回null
     */
    function addTag(name) {
      console.log("[标签管理] addTag 调用，输入:", name);
      const cleanName = filterControlChars(name).trim();
      if (!cleanName || cleanName.length > CHAR_LIMITS.TAG_MAX) {
        showToast(`标签名不能超过${CHAR_LIMITS.TAG_MAX}个字符`);
        return null;
      }
      if (!isValidTagName(cleanName)) {
        showToast("标签名只能包含中文、英文、数字和空格");
        return null;
      }

      const tags = getTags();
      const existing = tags.find(
        (t) => t.name.toLowerCase() === cleanName.toLowerCase()
      );
      if (existing) {
        console.log("[标签管理] 标签已存在:", cleanName);
        showToast("标签已存在");
        return existing;
      }

      const newTag = {
        id: generateId(),
        name: cleanName,
        color: TAG_COLORS[tags.length % TAG_COLORS.length],
      };
      tags.push(newTag);
      saveTags(tags);
      console.log("[标签管理] 新标签创建成功:", newTag);
      showToast(`标签「${cleanName}」创建成功`);
      return newTag;
    }

    /**
     * 删除标签
     * @param {string} tagId - 标签ID
     * @returns {boolean} 是否成功删除
     */
    function deleteTag(tagId) {
      console.log("[标签管理] deleteTag 调用，ID:", tagId);
      const tags = getTags();
      const beforeCount = tags.length;
      const next = tags.filter((t) => t.id !== tagId);
      if (next.length === beforeCount) {
        console.log("[标签管理] 标签不存在，删除失败");
        return false;
      }
      saveTags(next);
      console.log("[标签管理] 标签删除成功，剩余:", next.length, "个");
      return true;
    }

    /* ---------- 设置数据管理 ---------- */

    /**
     * 验证并修复设置数据
     * @param {any} settings - 待验证的设置
     * @returns {object} 合法的设置对象
     */
    function normalizeSettings(settings) {
      const defaults = getDefaultSettings();
      if (!settings || typeof settings !== "object") return defaults;

      return {
        theme: ["light", "dark", "system"].includes(settings.theme)
          ? settings.theme
          : defaults.theme,
        defaultView: ["grid", "timeline"].includes(settings.defaultView)
          ? settings.defaultView
          : defaults.defaultView,
        defaultSort: ["added", "date", "rating", "name"].includes(settings.defaultSort)
          ? settings.defaultSort
          : defaults.defaultSort,
      };
    }

    /**
     * 获取默认设置
     * @returns {object} 默认设置
     */
    function getDefaultSettings() {
      return { ...DEFAULT_SETTINGS };
    }

    /**
     * 获取设置（带校验）
     * @returns {object} 设置对象
     */
    function getSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.SETTINGS);
        if (!raw) return getDefaultSettings();
        const parsed = JSON.parse(raw);
        return normalizeSettings(parsed);
      } catch (err) {
        console.error("读取设置失败:", err);
        return getDefaultSettings();
      }
    }

    /**
     * 保存设置
     * @param {object} settings - 设置对象
     */
    function saveSettings(settings) {
      const validSettings = normalizeSettings(settings);
      localStorage.setItem(STORAGE_KEYS.SETTINGS, JSON.stringify(validSettings));
      applySettings(validSettings);
    }

    /**
     * 应用设置到界面
     * @param {object} settings - 设置对象
     */
    function applySettings(settings) {
      const html = document.documentElement;
      html.classList.remove("theme-dark");
      if (settings.theme === "dark") {
        html.classList.add("theme-dark");
      } else if (settings.theme === "system") {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          html.classList.add("theme-dark");
        }
      }
    }

    /* ---------- 情感数据工具 ---------- */

    /**
     * 标准化情感数据，兼容旧格式（数字）
     * @param {any} raw - 原始情感数据
     * @returns {object} 标准化的情感对象 { label, value }
     */
    function normalizeEmotion(raw) {
      // 空值返回默认
      if (!raw) return { label: "喜欢", value: 5 };

      // 旧格式：数字类型
      if (typeof raw === "number") {
        const value = Math.min(10, Math.max(1, Math.round(raw * 2)));
        return {
          label: getEmotionLabelFromValue(value),
          value: value,
        };
      }

      // 新格式：对象类型
      if (typeof raw === "object" && raw.value !== undefined) {
        const value = Math.min(10, Math.max(1, Math.round(parseFloat(raw.value) || 5)));
        const label = EMOTION_OPTIONS.some((e) => e.label === raw.label)
          ? raw.label
          : getEmotionLabelFromValue(value);
        return { label, value };
      }

      return { label: "喜欢", value: 5 };
    }

    /**
     * 根据数值获取最近似的情感标签
     * @param {number} value - 评分值 1-10
     * @returns {string} 情感标签
     */
    function getEmotionLabelFromValue(value) {
      for (const option of EMOTION_OPTIONS) {
        if (value >= option.minValue) {
          return option.label;
        }
      }
      return "平淡";
    }

    /**
     * 根据星级获取数值（1星=2分，5星=10分）
     * @param {number} star - 星级 1-5
     * @returns {number} 数值 2-10
     */
    function getValueFromStar(star) {
      return star * 2;
    }

    /**
     * 根据数值获取星级（四舍五入）
     * @param {number} value - 数值 1-10
     * @returns {number} 星级 1-5
     */
    function getStarFromValue(value) {
      return Math.max(1, Math.min(5, Math.round(value / 2)));
    }

    /* ---------- 排序工具 ---------- */

    /**
     * 排序物品列表
     * @param {Array} items - 物品列表
     * @param {string} sortBy - 排序方式
     * @returns {Array} 排序后的列表
     */
    function sortItems(items, sortBy) {
      const sorted = [...items];
      switch (sortBy) {
        case "date":
          return sorted.sort(
            (a, b) => new Date(b.date || 0) - new Date(a.date || 0)
          );
        case "rating":
          return sorted.sort(
            (a, b) => (b.rating || 0) - (a.rating || 0)
          );
        case "name":
          return sorted.sort((a, b) =>
            (a.name || "").localeCompare(b.name || "", "zh-CN")
          );
        case "added":
        default:
          return sorted.sort(
            (a, b) =>
              new Date(b.createdAt || 0) - new Date(a.createdAt || 0)
          );
      }
    }

    /* ---------- 搜索工具 ---------- */

    /**
     * 根据搜索关键词过滤物品（纯文本模糊匹配名称和故事）
     * @param {Array} items - 物品列表
     * @param {string} keyword - 搜索关键词
     * @returns {Array} 过滤后的物品列表
     */
    function filterItemsByKeyword(items, keyword) {
      if (!keyword || !keyword.trim()) return items;
      const kw = keyword.trim().toLowerCase();
      return items.filter((item) => {
        const name = (item.name || "").toLowerCase();
        const story = (item.story || "").toLowerCase();
        return name.includes(kw) || story.includes(kw);
      });
    }

    /**
     * 获取所有物品涉及的年份列表（降序）
     * @returns {Array<number>} 年份数组
     */
    function getAllYears() {
      const items = getItems();
      const years = items
        .map((it) => {
          if (!it.date) return null;
          const d = new Date(it.date);
          return isNaN(d.getTime()) ? null : d.getFullYear();
        })
        .filter((y) => y !== null);
      return [...new Set(years)].sort((a, b) => b - a);
    }

    /**
     * 统计当前激活的筛选条件数量
     * @returns {number} 激活条件数
     */
    function countActiveFilters() {
      let count = 0;
      if (router.searchKeyword.trim()) count++;
      if (router.filterTags.length > 0) count++;
      if (router.filterMood) count++;
      if (router.scoreMin !== null) count++;
      if (router.scoreMax !== null) count++;
      if (router.filterYear) count++;
      return count;
    }

     */
    function clearAllFilters() {
      router.searchKeyword = "";
      router.filterTags = [];
      router.filterMood = "";

      router.scoreMax = null;

      renderFilterPanel();

    }

    /* ---------- 图片压缩 ---------- */

    /**
     * 图片压缩函数
     * @param {File} file - 图片文件
     * @returns {Promise<string>} 压缩后的Base64图片
     */
    function imageCompress(file) {
      const MAX_WIDTH = 800;
      const QUALITY = 0.6;
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith("image/")) {
          reject(new Error("非图片文件"));
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const base64 = canvas.toDataURL("image/jpeg", QUALITY);

            // 检查压缩后大小
            if (getBase64Size(base64) > SIZE_LIMITS.IMAGE_MAX) {
              reject(new Error("图片过大，请选择较小的图片"));
              return;
            }

            resolve(base64);
          };
          img.onerror = () => reject(new Error("图片加载失败"));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("文件读取失败"));
        reader.readAsDataURL(file);
      });
    }

    /* ============================================================
     * 第四部分：视图层（渲染函数）
     * ============================================================ */

    /**
     * 渲染星级显示
     * @param {number} value - 评分值
     * @returns {string} HTML字符串
     */
    function renderStars(value) {
      const starCount = getStarFromValue(value);
      let html = "";
      for (let i = 1; i <= 5; i++) {
        html +=
          i <= starCount
            ? "★"
            : `<span class="star-empty">★</span>`;
      }
      return `<span class="stars">${html}</span>`;
    }

    /* ---------- 展厅页渲染 ---------- */

    /**
     * 渲染展厅页面
     */
    function renderGallery() {
      const grid = document.getElementById("galleryGrid");
      const timelineContainer = document.getElementById("timelineContainer");
      const timelineNav = document.getElementById("timelineNav");
      const timelineView = document.getElementById("timelineView");
      const empty = document.getElementById("emptyState");
      const statsCount = document.getElementById("statsCount");

      let items = getItems();
      const allItemsCount = items.length;

      // 标签筛选（多选 AND：物品 tag 需在选中列表中）
      if (router.filterTags.length > 0) {
        items = items.filter((it) => router.filterTags.includes(it.tag));
      }

      // 心情筛选（使用分离的 mood 字段）
      if (router.filterMood) {
        items = items.filter((it) => it.mood === router.filterMood);
      }

      // 评分范围筛选（使用分离的 rating 字段）
      if (router.scoreMin !== null || router.scoreMax !== null) {
        items = items.filter((it) => {
          const rating = it.rating || 0;
          if (router.scoreMin !== null && rating < router.scoreMin) return false;
          if (router.scoreMax !== null && rating > router.scoreMax) return false;
          return true;
        });
      }

      // 年份筛选
      if (router.filterYear) {
        const year = parseInt(router.filterYear);
        items = items.filter((it) => {
          if (!it.date) return false;
          const d = new Date(it.date);
          return !isNaN(d.getTime()) && d.getFullYear() === year;
        });
      }

      // 关键词搜索（纯文本模糊匹配）
      items = filterItemsByKeyword(items, router.searchKeyword);

      // 排序
      const settings = getSettings();
      items = sortItems(items, settings.defaultSort);

      // 更新统计
      statsCount.textContent = allItemsCount;

      // 更新搜索下拉面板计数（同步徽章）
      updateSearchDropdownCount();

      // 空状态处理
      if (allItemsCount === 0) {
        grid.innerHTML = "";
        grid.hidden = false;
        timelineContainer.hidden = true;
        empty.hidden = false;
        empty.querySelector(".empty-state__text").textContent =
          "还没有藏品，添加你的第一件回忆吧";
        return;
      }

      if (items.length === 0) {
        grid.innerHTML = "";
        grid.hidden = false;
        timelineContainer.hidden = true;
        empty.hidden = false;
        empty.querySelector(".empty-state__text").textContent =
          "没有找到符合条件的藏品，试试调整筛选条件";
        return;
      }

      empty.hidden = true;

      // 根据视图模式渲染
      if (router.viewMode === "timeline") {
        grid.hidden = true;
        timelineContainer.hidden = false;
        renderTimelineNav(timelineNav, items);
        renderTimeline(timelineView, items);
        initTimelineScrollHighlight();
      } else {
        grid.hidden = false;
        timelineContainer.hidden = true;
        renderGrid(grid, items);
      }
    }

    /**
     * 渲染搜索筛选下拉面板
     * 每次调用都从 localStorage 动态读取最新标签列表
     */
    function renderSearchDropdown() {
      const tags = getTags();
      const years = getAllYears();

      // ===== 标签筛选（多选 pill） =====
      const tagContainer = document.getElementById("searchTagFilters");
      tagContainer.innerHTML = tags
        .map((t) => {
          const isActive = router.filterTags.includes(t.id);
          const bgStyle = isActive
            ? `background-color:${t.color};border-color:${t.color}`
            : "";
          return `<button class="search-dropdown__pill ${isActive ? "is-active is-active--tag" : ""}" data-tag-id="${t.id}" style="${bgStyle}">${escapeHtml(t.name)}</button>`;
        })
        .join("");

      // ===== 心情筛选（单选 emoji pill） =====
      const moodContainer = document.getElementById("searchMoodFilters");
      moodContainer.innerHTML = EMOTION_OPTIONS.map((e) => {
        const isActive = router.filterMood === e.label;
        return `<button class="search-dropdown__pill ${isActive ? "is-active" : ""}" data-mood="${e.label}">${e.emoji} ${e.label}</button>`;
      }).join("");

      // ===== 评分范围（按钮组） =====
      const minVal = router.scoreMin !== null ? `≥ ${router.scoreMin}` : "不限";
      const maxVal = router.scoreMax !== null ? `≤ ${router.scoreMax}` : "不限";
      document.getElementById("scoreMinValue").textContent = minVal;
      document.getElementById("scoreMaxValue").textContent = maxVal;

      // ===== 年份筛选（pill） =====
      const yearContainer = document.getElementById("searchYearFilters");
      let yearPills = `<button class="search-dropdown__pill ${!router.filterYear ? "is-active" : ""}" data-year="">全部</button>`;
      for (const y of years) {
        const isActive = router.filterYear === String(y);
        yearPills += `<button class="search-dropdown__pill ${isActive ? "is-active" : ""}" data-year="${y}">${y} 年</button>`;
      }
      yearContainer.innerHTML = yearPills;

      // 更新结果数量
      updateSearchDropdownCount();
    }

    /**
     * 更新搜索下拉面板计数显示
     */
    function updateSearchDropdownCount() {
      const count = countActiveFilters();
      const badge = document.getElementById("searchBadge");
      if (count > 0) {
        badge.textContent = count;
        badge.classList.add("is-visible");
      } else {
        badge.classList.remove("is-visible");
      }

      const resultCount = document.getElementById("searchResultCount");
      if (resultCount) {
        const items = getItems();
        let filtered = items;
        if (router.filterTags.length > 0) {
          filtered = filtered.filter((it) => router.filterTags.includes(it.tag));
        }
        if (router.filterMood) {
          filtered = filtered.filter((it) => it.mood === router.filterMood);
        }
        if (router.scoreMin !== null || router.scoreMax !== null) {
          filtered = filtered.filter((it) => {
            const r = it.rating || 0;
            if (router.scoreMin !== null && r < router.scoreMin) return false;
            if (router.scoreMax !== null && r > router.scoreMax) return false;
            return true;
          });
        }
        if (router.filterYear) {
          const year = parseInt(router.filterYear);
          filtered = filtered.filter((it) => {
            if (!it.date) return false;
            const d = new Date(it.date);
            return !isNaN(d.getTime()) && d.getFullYear() === year;
          });
        }
        if (router.searchKeyword.trim()) {
          filtered = filterItemsByKeyword(filtered, router.searchKeyword);
        }
        resultCount.textContent = `共 ${filtered.length} 件藏品`;
      }
    }

    function renderGrid(grid, items) {

          const ratingBadge = it.rating && it.rating > 0 ? `<span class="rating-badge">★ ${it.rating}</span>` : "";

          return `

              it.id
            }" style="animation-delay:${idx * 50}ms">

    /**
     * 渲染时间线导航（年份）
     * @param {HTMLElement} nav - 导航容器
     * @param {Array} items - 物品列表
     */
    function renderTimelineNav(nav, items) {
      const years = [
        ...new Set(
          items.map((it) => {
            const d = new Date(it.date);
            return isNaN(d.getTime()) ? "未知" : d.getFullYear();
          })
        ),
      ].sort((a, b) => b - a);

      nav.innerHTML = years
        .map(
          (year) => `
        <button class="timeline-nav__year" data-year="${year}">${year}</button>
      `
        )
        .join("");

      nav.querySelectorAll(".timeline-nav__year").forEach((btn) => {
        btn.addEventListener("click", () => {
          const year = btn.dataset.year;
          const firstItem = items.find((it) => {
            const d = new Date(it.date);
            return !isNaN(d.getTime()) && d.getFullYear() == year;
          });
          if (firstItem) {
            const el = document.querySelector(
              `[data-timeline-id="${firstItem.id}"]`
            );
            if (el) {
              el.scrollIntoView({ behavior: "smooth", block: "center" });
            }
          }
        });
      });

          const moodBadge = it.mood ? `<span class="mood-badge">${moodEmoji} ${escapeHtml(it.mood)}</span>` : "";

    /**
     * 初始化时间线滚动高亮
     */
    let timelineObserver = null;
    function initTimelineScrollHighlight() {
      if (timelineObserver) {
        timelineObserver.disconnect();
      }
      const nav = document.getElementById("timelineNav");
      timelineObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const id = entry.target.dataset.timelineId;
              const item = getItem(id);
              if (item) {
                const d = new Date(item.date);
                const year = isNaN(d.getTime()) ? "未知" : d.getFullYear();
                nav.querySelectorAll(".timeline-nav__year").forEach((btn) => {
                  btn.classList.toggle("is-active", btn.dataset.year == year);
                });
              }
            }
          });
        },
        { rootMargin: "-20%", threshold: 0.3 }
      );

      document
        .querySelectorAll(".timeline-item")
        .forEach((el) => timelineObserver.observe(el));
    }

    function updateTagSelector() {

      let html = tags
        .map(
          (t) => `
        <button type="button" class="tag-pill ${
          addState.selectedTagId === t.id ? "is-selected" : ""
        }" data-tag-id="${t.id}" style="${
            addState.selectedTagId === t.id
              ? `background-color:${t.color};`
              : ""
          }">${escapeHtml(t.name)}</button>
      `
        )
        .join("");

      // 新建标签输入框或按钮
      if (addState.isCreatingTag) {
        html += `
          <span class="tag-add-inline" id="tagAddInline">
            <input type="text" id="newTagInput" placeholder="标签名（最多15字）" maxlength="${CHAR_LIMITS.TAG_MAX}" />
            <button type="button" class="tag-add-inline__btn confirm" id="tagConfirmBtn" title="确认">✓</button>
            <button type="button" class="tag-add-inline__btn" id="tagCancelBtn" title="取消">✗</button>
          </span>
        `;
      } else {
        html += `
          <button type="button" class="tag-add-btn" id="tagAddBtn">
            <span>+</span> 新建标签
          </button>
        `;
      }

      container.innerHTML = html;

      // 绑定标签点击事件
      container.querySelectorAll(".tag-pill").forEach((btn) => {
        btn.addEventListener("click", () => {
          const tagId = btn.dataset.tagId;
          // 再次点击取消选中
          addState.selectedTagId = addState.selectedTagId === tagId ? null : tagId;
          updateTagSelector();
        });
      });

      // 新建标签按钮
      const addBtn = document.getElementById("tagAddBtn");
      if (addBtn) {
        addBtn.addEventListener("click", () => {
          addState.isCreatingTag = true;
          updateTagSelector();
          // 自动聚焦
          setTimeout(() => {
            const input = document.getElementById("newTagInput");
            if (input) input.focus();
          }, 0);
        });
      }

      // 确认创建标签
      const confirmBtn = document.getElementById("tagConfirmBtn");
      const newTagInput = document.getElementById("newTagInput");
      if (confirmBtn && newTagInput) {
        const confirmCreate = () => {
          const name = newTagInput.value.trim();
          if (!name) return;
          // 检查是否已存在（忽略大小写），用于区分提示文案
          const existedBefore = getTags().some(
            (t) => t.name.toLowerCase() === name.toLowerCase()
          );
          const newTag = addTag(name);
          if (newTag) {
            addState.selectedTagId = newTag.id;
            addState.isCreatingTag = false;
            updateTagSelector();
            // 仅在真正新建时提示，重复情况由 addTag 自行提示"标签已存在"
            if (!existedBefore) {
              showToast("新标签已创建");
            }
          }
        };

        confirmBtn.addEventListener("click", confirmCreate);
        newTagInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            confirmCreate();
          } else if (e.key === "Escape") {
            addState.isCreatingTag = false;
            updateTagSelector();
          }
        });
      }

      // 取消创建标签
      const cancelBtn = document.getElementById("tagCancelBtn");
      if (cancelBtn) {
        cancelBtn.addEventListener("click", () => {
          addState.isCreatingTag = false;
          updateTagSelector();
        });
      }
    }

    /**
     * 更新情感评分UI
     */
    function updateMoodUI() {
      document.querySelectorAll(".mood-pill").forEach((btn) => {
        btn.classList.toggle(
          "is-selected",
          btn.dataset.mood === addState.mood
        );
      });
    }

    function updateRatingUI() {
      const value = addState.rating;
      document.getElementById("scoreRange").value = value;
      document.getElementById("scoreValue").textContent = value;
      const starCount = getStarFromValue(value);
      document.querySelectorAll(".star-rating .star").forEach((star, idx) => {
        const starValue = idx + 1;
        star.classList.remove("is-active", "is-preview");
        if (starValue <= starCount) star.classList.add("is-active");
      });
      document.querySelectorAll(".rating-number").forEach((btn) => {
        btn.classList.toggle(
          "is-selected",
          parseInt(btn.dataset.value) === value
        );
      });
    }

    /* ============================================================
     * 第五部分：控制层（事件处理 & 业务逻辑）
     * ============================================================ */

    // 路由状态
    const router = {
      currentPage: "gallery",
      currentId: null,
      searchKeyword: "",        // 纯文本搜索关键词
      filterTags: [],           // 标签筛选（多选，存 tag ID 数组）
      filterMood: "",           // 心情筛选（单选，空字符串=不限）
      scoreMin: null,           // 评分下限（null=不限）
      scoreMax: null,           // 评分上限（null=不限）
      filterYear: "",           // 年份筛选（空字符串=不限）
      viewMode: "grid",
    };

    // 添加页状态
    const addState = {
      image: "",
      mood: "",           // 心情标签（独立字段）
      rating: 0,          // 数值评分（独立字段）
      selectedTagId: null,
      isCreatingTag: false,
    };

    // 删除模态框状态
    let deleteTargetId = null;

    // 搜索防抖函数（纯关键词搜索）
    const debouncedSearch = debounce((query) => {
      router.searchKeyword = query;
      renderGallery();
    }, SEARCH_DEBOUNCE_MS);

    /**
     * 页面导航
     * @param {string} page - 页面名称
     * @param {string} id - 物品ID（详情页用）
     */
    function navigate(page, id) {
      router.currentPage = page;
      router.currentId = id || null;
      document.querySelectorAll(".page").forEach((el) => {
        el.hidden = el.dataset.page !== page;
      });
      window.scrollTo({ top: 0, behavior: "instant" });
      switch (page) {
        case "gallery":
          renderGallery();
          break;
        case "detail":
          renderDetail(id);
          break;
        case "add":
          renderAdd();
          break;
      }
    }

    /**
     * 显示Toast提示
     * @param {string} message - 提示消息
     */
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      requestAnimationFrame(() => toast.classList.add("is-visible"));
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => {
        toast.classList.remove("is-visible");
      }, 3000);
    }

    /* ---------- 删除模态框控制 ---------- */

    /**
     * 显示删除确认模态框
     * @param {string} id - 物品ID
     */
    function showDeleteModal(id) {
      deleteTargetId = id;
      const modal = document.getElementById("confirmModal");
      modal.classList.add("is-open");
    }

    /**
     * 隐藏删除确认模态框
     */
    function hideDeleteModal() {
      deleteTargetId = null;
      const modal = document.getElementById("confirmModal");
      modal.classList.remove("is-open");
    }

    /* ---------- 设置面板控制 ---------- */

    /**
     * 打开设置面板
     */
    function openSettings() {
      const overlay = document.getElementById("settingsOverlay");
      overlay.classList.add("is-open");
      syncSettingsUI();
    }

    /**
     * 关闭设置面板
     */
    function closeSettings() {
      const overlay = document.getElementById("settingsOverlay");
      overlay.classList.remove("is-open");
    }

    /**
     * 同步设置UI状态
     */
    function syncSettingsUI() {
      const settings = getSettings();
      document
        .querySelectorAll("#themeGroup .settings-radio")
        .forEach((btn) => {
          btn.classList.toggle("is-selected", btn.dataset.theme === settings.theme);
        });
      document
        .querySelectorAll("#viewGroup .settings-radio")
        .forEach((btn) => {
          btn.classList.toggle(
            "is-selected",
            btn.dataset.view === settings.defaultView
          );
        });
      document.getElementById("sortSelect").value = settings.defaultSort;
    }

    /* ============================================================
     * 第六部分：初始化 & 事件绑定
     * ============================================================ */

    /**
     * 初始化应用
     */
    function initApp() {
      const settings = getSettings();
      applySettings(settings);
      router.viewMode = settings.defaultView || "grid";

      // 同步视图切换按钮状态
      if (router.viewMode === "timeline") {
        document.querySelectorAll("#viewToggle .view-toggle__btn").forEach((b) => {
          b.classList.toggle("is-active", b.dataset.view === "timeline");
        });
      }

      bindEvents();
      navigate("gallery");
    }

    /**
     * 绑定所有事件
     */
    function bindEvents() {
      // ===== 导航栏事件 =====
      bindNavEvents();

      // ===== 视图切换事件 =====
      bindViewToggleEvents();

      // ===== 筛选栏事件 =====
      bindFilterEvents();

      // ===== 空状态事件 =====
      bindEmptyStateEvents();

      // ===== 图片上传事件 =====
      bindImageUploadEvents();

      // ===== 标签选择器事件（点击外部关闭新建输入框） =====
      bindTagSelectorEvents();

      // ===== 评分事件 =====

      bindDateInputEvents();

      // ===== 表单提交事件 =====
      bindFormSubmitEvents();

      // ===== 删除模态框事件 =====
      bindModalEvents();

      // ===== 设置面板事件 =====
      bindSettingsEvents();

      // ===== 系统主题变化监听 =====
      bindThemeChangeListener();
