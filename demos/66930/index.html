<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智行规划 - 智能出行路线规划</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bg-deep: #0a0e1a;
            --bg-card: rgba(15, 23, 42, 0.85);
            --bg-card-hover: rgba(30, 41, 59, 0.9);
            --border-glow: rgba(59, 130, 246, 0.3);
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-orange: #f97316;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .bg-effects {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-effects::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 60%);
            animation: bgPulse 20s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(1deg); }
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .sidebar {
            width: 420px;
            min-width: 420px;
            height: 100vh;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            z-index: 10;
            position: relative;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(to bottom, 
                transparent 0%, 
                var(--accent-blue) 20%, 
                var(--accent-cyan) 50%, 
                var(--accent-blue) 80%, 
                transparent 100%);
            opacity: 0.5;
        }

        .sidebar-header {
            padding: 24px 28px 20px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
            position: relative;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 6px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            animation: logoShine 3s ease-in-out infinite;
        }

        @keyframes logoShine {
            0%, 100% { transform: translateX(-100%) rotate(45deg); }
            50% { transform: translateX(100%) rotate(45deg); }
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
            position: relative;
            z-index: 1;
        }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            margin-left: 2px;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 3px;
        }

        .sidebar-content::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.5);
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(to bottom, var(--accent-blue), var(--accent-cyan));
            border-radius: 2px;
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15),
                        0 0 20px rgba(59, 130, 246, 0.1);
            background: rgba(30, 41, 59, 0.8);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--text-muted);
            pointer-events: none;
        }

        .search-suggestions {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            max-height: 280px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .search-suggestions.active {
            display: block;
            animation: slideDown 0.25s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(59, 130, 246, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: rgba(59, 130, 246, 0.1);
            padding-left: 20px;
        }

        .suggestion-icon {
            width: 32px;
            height: 32px;
            background: rgba(59, 130, 246, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .suggestion-icon svg {
            width: 16px;
            height: 16px;
            fill: var(--accent-blue);
        }

        .suggestion-info {
            flex: 1;
            min-width: 0;
        }

        .suggestion-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestion-address {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .locations-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .location-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.12);
            border-radius: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .location-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--location-color, var(--accent-blue));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .location-item:hover::before {
            opacity: 1;
        }

        .location-item:hover {
            background: var(--bg-card-hover);
            border-color: rgba(59, 130, 246, 0.25);
            transform: translateX(2px);
        }

        .location-number {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }

        .location-info {
            flex: 1;
            min-width: 0;
        }

        .location-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .location-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .location-badge.start {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .location-badge.end {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .location-badge.start-end {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(6, 182, 212, 0.15));
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .location-address {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .location-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 28px;
            height: 28px;
            background: rgba(148, 163, 184, 0.1);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(148, 163, 184, 0.2);
            transform: scale(1.1);
        }

        .action-btn svg {
            width: 14px;
            height: 14px;
            stroke: var(--text-muted);
            transition: stroke 0.2s ease;
        }

        .action-btn.active {
            background: rgba(34, 197, 94, 0.2);
        }

        .action-btn.active svg {
            stroke: #22c55e;
        }

        .action-btn.delete {
            background: rgba(239, 68, 68, 0.1);
        }

        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .action-btn.delete svg {
            stroke: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            background: rgba(59, 130, 246, 0.08);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--text-muted);
        }

        .empty-state-text {
            font-size: 14px;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .mode-btn {
            padding: 12px 8px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.12);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .mode-btn:hover {
            background: var(--bg-card-hover);
            border-color: rgba(59, 130, 246, 0.25);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(6, 182, 212, 0.15));
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .mode-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-secondary);
            transition: stroke 0.3s ease;
        }

        .mode-btn.active svg {
            stroke: var(--accent-cyan);
        }

        .mode-btn span {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .mode-btn.active span {
            color: var(--text-primary);
        }

        .strategy-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .strategy-btn {
            padding: 14px 16px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(59, 130, 246, 0.12);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .strategy-btn:hover {
            background: var(--bg-card-hover);
            border-color: rgba(59, 130, 246, 0.25);
        }

        .strategy-btn.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(6, 182, 212, 0.1));
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
        }

        .strategy-icon {
            width: 36px;
            height: 36px;
            background: rgba(59, 130, 246, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .strategy-btn.active .strategy-icon {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
        }

        .strategy-icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--accent-blue);
        }

        .strategy-btn.active .strategy-icon svg {
            stroke: white;
        }

        .strategy-info {
            flex: 1;
        }

        .strategy-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .strategy-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .plan-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .plan-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.6s ease;
        }

        .plan-btn:hover::before {
            left: 100%;
        }

        .plan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
        }

        .plan-btn:active {
            transform: translateY(0);
        }

        .plan-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .plan-btn:disabled::before {
            display: none;
        }

        .plan-btn svg {
            width: 18px;
            height: 18px;
            stroke: white;
        }

        .sidebar-footer {
            padding: 16px 24px 20px;
            border-top: 1px solid rgba(59, 130, 246, 0.15);
            background: rgba(15, 23, 42, 0.5);
        }

        .map-container {
            flex: 1;
            position: relative;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-overlay-top {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .route-summary {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            padding: 18px 22px;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .route-summary.active {
            display: block;
            animation: slideInRight 0.4s ease-out;
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(59, 130, 246, 0.15);
        }

        .summary-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .summary-badge {
            padding: 4px 10px;
            background: linear-gradient(135deg, var(--accent-green), #059669);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: white;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
            background: rgba(59, 130, 246, 0.06);
            border-radius: 10px;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .route-steps {
            margin-top: 14px;
            max-height: 200px;
            overflow-y: auto;
        }

        .route-steps::-webkit-scrollbar {
            width: 4px;
        }

        .route-steps::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 2px;
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(59, 130, 246, 0.06);
        }

        .step-item:last-child {
            border-bottom: none;
        }

        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-blue);
            margin-top: 5px;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }

        .step-info {
            flex: 1;
        }

        .step-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .step-detail {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .transit-lines {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .transit-line-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            color: #60a5fa;
            white-space: nowrap;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(59, 130, 246, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .loading-subtext {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 12px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: toastIn 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.success {
            border-color: rgba(34, 197, 94, 0.4);
        }

        .toast.error {
            border-color: rgba(239, 68, 68, 0.4);
        }

        .toast svg {
            width: 18px;
            height: 18px;
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .BMap_cpyCtrl,
        .anchorBL {
            display: none !important;
        }
    </style>
</head>

    <div class="toast-container" id="toastContainer"></div>

    <script type="text/javascript" src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=bSikoz3lE2iqK5yXBLNz24lgV5hmV3ky"></script>
    <script>
        const state = {
            map: null,
            localSearch: null,
            locations: [],
            startId: null,
            endId: null,
            currentMode: 'driving',
            currentStrategy: 'fastest',
            routePolylines: [],
            markers: [],
            isPlanning: false
        };

        const locationColors = [
            '#ef4444', '#f97316', '#eab308', '#22c55e',
            '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899',
            '#14b8a6', '#f59e0b'
        ];

        function initMap() {
            state.map = new BMapGL.Map('map');
            state.map.centerAndZoom(new BMapGL.Point(116.404, 39.915), 12);
            state.map.enableScrollWheelZoom(true);
            
            state.localSearch = new BMapGL.LocalSearch(state.map, {
                onSearchComplete: handleSearchResults
            });

            setupSearch();
            setupEventListeners();
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const suggestions = document.getElementById('searchSuggestions');
            let searchTimeout;

            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const keyword = e.target.value.trim();
                
                if (keyword.length < 1) {
                    suggestions.classList.remove('active');
                    return;
                }

                searchTimeout = setTimeout(() => {
                    state.localSearch.search(keyword, {
                        pageCapacity: 10
                    });
                }, 300);
            });

            searchInput.addEventListener('focus', () => {
                if (suggestions.children.length > 0) {
                    suggestions.classList.add('active');
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-box')) {
                    suggestions.classList.remove('active');
                }
            });
        }

        function handleSearchResults(results) {
            const suggestions = document.getElementById('searchSuggestions');
            suggestions.innerHTML = '';

            if (!results) {
                suggestions.classList.remove('active');
                return;
            }

            const numPois = results.getCurrentNumPois ? results.getCurrentNumPois() : 0;
            
            if (numPois === 0) {
                suggestions.classList.remove('active');
                return;
            }

            const pois = [];
            const count = Math.min(numPois, 8);
            
            for (let i = 0; i < count; i++) {
                const poi = results.getPoi(i);
                if (poi) {
                    pois.push(poi);
                }
            }

            if (pois.length === 0) {
                suggestions.classList.remove('active');
                return;
            }

            pois.forEach((poi, index) => {
                const item = document.createElement('div');
                item.className = 'suggestion-item';
                const address = poi.address || ((poi.province || '') + (poi.city || '') + (poi.area || ''));
                
                item.innerHTML = `
                    <div class="suggestion-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                    </div>
                    <div class="suggestion-info">
                        <div class="suggestion-name">${poi.title || poi.name || '未知地点'}</div>
                        <div class="suggestion-address">${address || '暂无地址信息'}</div>
                    </div>
                `;
                
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    addLocation(poi);
                    suggestions.classList.remove('active');
                    document.getElementById('searchInput').value = '';
                });
                
                suggestions.appendChild(item);
            });

            suggestions.classList.add('active');
        }

        function setupEventListeners() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.currentMode = btn.dataset.mode;
                });
            });

            document.querySelectorAll('.strategy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.strategy-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.currentStrategy = btn.dataset.strategy;
                    updateStrategyBadge();
                });
            });

            document.getElementById('planBtn').addEventListener('click', planOptimalRoute);
        }

        function addLocation(poi) {
            const location = {
                id: Date.now() + Math.random(),
                name: poi.title,
                address: poi.address || (poi.province || '') + (poi.city || '') + (poi.address || ''),
                point: poi.point,
                index: state.locations.length + 1
            };

            state.locations.push(location);
            addMarker(location);
            updateLocationsList();
            updatePlanButton();
            showToast('success', `已添加: ${location.name}`);
        }

        function removeLocation(id) {
            const index = state.locations.findIndex(l => l.id === id);
            if (index === -1) return;

            const location = state.locations[index];
            state.locations.splice(index, 1);
            
            if (state.startId === id) state.startId = null;
            if (state.endId === id) state.endId = null;

            state.locations.forEach((loc, i) => {
                loc.index = i + 1;
            });

            removeMarker(id);
            clearRoutes();
            updateLocationsList();
            updatePlanButton();
            showToast('info', `已移除: ${location.name}`);
        }

        function setAsStart(id) {
            state.startId = state.startId === id ? null : id;
            clearRoutes();
            updateLocationsList();
            updateMarkers();
            if (state.startId) {
                const loc = state.locations.find(l => l.id === id);
                showToast('success', `已设置起点: ${loc.name}`);
            }
        }

        function setAsEnd(id) {
            state.endId = state.endId === id ? null : id;
            clearRoutes();
            updateLocationsList();
            updateMarkers();
            if (state.endId) {
                const loc = state.locations.find(l => l.id === id);
                showToast('success', `已设置终点: ${loc.name}`);
            }
        }

        function updateMarkers() {
            state.markers.forEach((m, i) => {
                const loc = state.locations[i];
                if (loc) {
                    let color = locationColors[i % locationColors.length];
                    let labelText = loc.name;
                    
                    if (loc.id === state.startId && loc.id === state.endId) {
                        color = '#22c55e';
                        labelText = '起/终 · ' + loc.name;
                    } else if (loc.id === state.startId) {
                        color = '#22c55e';
                        labelText = '起点 · ' + loc.name;
                    } else if (loc.id === state.endId) {
                        color = '#ef4444';
                        labelText = '终点 · ' + loc.name;
                    }
                    
                    const icon = new BMapGL.Icon(
                        createMarkerSVG(color, loc.id === state.startId ? '起' : (loc.id === state.endId ? '终' : (i + 1))),
                        new BMapGL.Size(32, 40),
                        { anchor: new BMapGL.Size(16, 40) }
                    );
                    m.marker.setIcon(icon);
                    m.label.setContent(labelText);
                }
            });
        }

        function addMarker(location) {
            const color = locationColors[(location.index - 1) % locationColors.length];
            
            const icon = new BMapGL.Icon(
                createMarkerSVG(color, location.index),
                new BMapGL.Size(32, 40),
                { anchor: new BMapGL.Size(16, 40) }
            );

            const marker = new BMapGL.Marker(location.point, { icon: icon });
            marker.id = location.id;
            
            const label = new BMapGL.Label(location.name, {
                position: location.point,
                offset: new BMapGL.Size(20, -10)
            });
            label.setStyle({
                color: '#fff',
                backgroundColor: 'rgba(15, 23, 42, 0.9)',
                border: '1px solid rgba(59, 130, 246, 0.3)',
                borderRadius: '6px',
                padding: '4px 10px',
                fontSize: '12px',
                fontWeight: '500'
            });

            state.map.addOverlay(marker);
            state.map.addOverlay(label);
            state.markers.push({ marker, label, id: location.id });

            if (state.locations.length === 1) {
                state.map.centerAndZoom(location.point, 14);
            } else {
                fitMapToLocations();
            }
        }

        function removeMarker(id) {
            const markerIndex = state.markers.findIndex(m => m.id === id);
            if (markerIndex === -1) return;

            const { marker, label } = state.markers[markerIndex];
            state.map.removeOverlay(marker);
            state.map.removeOverlay(label);
            state.markers.splice(markerIndex, 1);

            state.markers.forEach((m, i) => {
                const loc = state.locations[i];
                if (loc) {
                    const color = locationColors[i % locationColors.length];
                    const icon = new BMapGL.Icon(
                        createMarkerSVG(color, i + 1),
                        new BMapGL.Size(32, 40),
                        { anchor: new BMapGL.Size(16, 40) }
                    );
                    m.marker.setIcon(icon);
                }
            });
        }

        function createMarkerSVG(color, number) {
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">
                    <defs>
                        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="${color}" flood-opacity="0.5"/>
                        </filter>
                    </defs>
                    <path d="M16 0C7.163 0 0 7.163 0 16c0 12 16 24 16 24s16-12 16-24C32 7.163 24.837 0 16 0z" fill="${color}" filter="url(#shadow)"/>
                    <circle cx="16" cy="15" r="9" fill="white" fill-opacity="0.95"/>
                    <text x="16" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="${color}">${number}</text>
                </svg>
            `;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function fitMapToLocations() {
            if (state.locations.length === 0) return;
            
            const viewport = state.map.getViewport(state.locations.map(l => l.point));
            state.map.centerAndZoom(viewport.center, viewport.zoom - 1);
        }

        function updateLocationsList() {
            const list = document.getElementById('locationsList');
            const countEl = document.getElementById('locationCount');
            
            countEl.textContent = `(${state.locations.length})`;

            if (state.locations.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                        </div>
                        <div class="empty-state-text">搜索并添加地点开始规划</div>
                    </div>
                `;
                return;
            }

            list.innerHTML = state.locations.map((loc, i) => {
                const color = locationColors[i % locationColors.length];
                const isStart = loc.id === state.startId;
                const isEnd = loc.id === state.endId;
                const isStartEnd = isStart && isEnd;
                
                let borderColor = '';
                let badge = '';
                
                if (isStartEnd) {
                    borderColor = '#22c55e';
                    badge = '<span class="location-badge start-end">起/终</span>';
                } else if (isStart) {
                    borderColor = '#22c55e';
                    badge = '<span class="location-badge start">起点</span>';
                } else if (isEnd) {
                    borderColor = '#ef4444';
                    badge = '<span class="location-badge end">终点</span>';
                }
                
                return `
                    <div class="location-item" style="--location-color: ${borderColor || color}; ${borderColor ? 'border-color: ' + borderColor + '40;' : ''}">
                        <div class="location-number" style="background: linear-gradient(135deg, ${borderColor || color}, ${adjustColor(borderColor || color, 20)})">${isStart ? '起' : (isEnd ? '终' : (i + 1))}</div>
                        <div class="location-info">
                            <div class="location-name-row">
                                <div class="location-name">${loc.name}</div>
                                ${badge}
                            </div>
                            <div class="location-address">${loc.address || '未知地址'}</div>
                        </div>
                        <div class="location-actions">
                            <button class="action-btn ${isStart ? 'active' : ''}" onclick="setAsStart(${loc.id})" title="${isStart ? '取消起点' : '设为起点'}">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 12h14"/>
                                    <path d="m12 5 7 7-7 7"/>
                                </svg>
                            </button>
                            <button class="action-btn ${isEnd ? 'active' : ''}" onclick="setAsEnd(${loc.id})" title="${isEnd ? '取消终点' : '设为终点'}">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M5 12h14"/>
                                    <path d="m12 5 7 7-7 7"/>
                                </svg>
                            </button>
                            <button class="action-btn delete" onclick="removeLocation(${loc.id})" title="移除">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function adjustColor(color, amount) {
            const hex = color.replace('#', '');
            const r = Math.min(255, parseInt(hex.substr(0, 2), 16) + amount);
            const g = Math.min(255, parseInt(hex.substr(2, 2), 16) + amount);
            const b = Math.min(255, parseInt(hex.substr(4, 2), 16) + amount);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function updatePlanButton() {
            const btn = document.getElementById('planBtn');
            btn.disabled = state.locations.length < 2;
        }

        function updateStrategyBadge() {
            const badge = document.getElementById('strategyBadge');
            const labels = {
                fastest: '最快',
                shortest: '最短',
                economical: '经济'
            };
            badge.textContent = labels[state.currentStrategy] || '最优';
        }

        async function planOptimalRoute() {
            if (state.locations.length < 2) {
                showToast('error', '请至少添加2个地点');
                return;
            }

            const hasStart = state.startId !== null;
            const hasEnd = state.endId !== null;
            const isRoundTrip = hasStart && hasEnd && state.startId === state.endId;

            state.isPlanning = true;
            showLoading(true);
            clearRoutes();

            try {
                const startIdx = hasStart ? state.locations.findIndex(l => l.id === state.startId) : -1;
                const endIdx = hasEnd ? state.locations.findIndex(l => l.id === state.endId) : -1;

                let permutations;
                let totalPermutations;

                if (isRoundTrip) {
                    const waypointIdxs = state.locations.map((_, i) => i).filter(i => i !== startIdx);
                    permutations = getPermutationsOfArray(waypointIdxs);
                    permutations = permutations.map(p => [startIdx, ...p, startIdx]);
                    totalPermutations = permutations.length;
                } else if (hasStart && hasEnd && startIdx !== endIdx) {
                    const waypointIdxs = state.locations.map((_, i) => i).filter(i => i !== startIdx && i !== endIdx);
                    permutations = getPermutationsOfArray(waypointIdxs);
                    permutations = permutations.map(p => [startIdx, ...p, endIdx]);
                    totalPermutations = permutations.length;
                } else if (hasStart && !hasEnd) {
                    const waypointIdxs = state.locations.map((_, i) => i).filter(i => i !== startIdx);
                    permutations = getPermutationsOfArray(waypointIdxs);
                    permutations = permutations.map(p => [startIdx, ...p]);
                    totalPermutations = permutations.length;
                } else if (!hasStart && hasEnd) {
                    const waypointIdxs = state.locations.map((_, i) => i).filter(i => i !== endIdx);
                    permutations = getPermutationsOfArray(waypointIdxs);
                    permutations = permutations.map(p => [...p, endIdx]);
                    totalPermutations = permutations.length;
                } else {
                    permutations = getPermutations(state.locations.length);
                    totalPermutations = permutations.length;
                }
                
                updateLoadingText(`正在计算 ${totalPermutations} 种路线组合...`);

                const routeMatrix = await calculateAllRoutes();
                
                let bestOrder = null;
                let bestCost = Infinity;
                let bestRouteData = null;

                for (let i = 0; i < permutations.length; i++) {
                    const order = permutations[i];
                    const result = calculateRouteCost(order, routeMatrix);
                    
                    if (result.totalCost < bestCost) {
                        bestCost = result.totalCost;
                        bestOrder = order;
                        bestRouteData = result;
                    }
                }

                await drawOptimalRoute(bestOrder, routeMatrix);
                showRouteSummary(bestOrder, bestRouteData);
                
                showToast('success', '路线规划完成！');
            } catch (error) {
                console.error('规划失败:', error);
                showToast('error', '路线规划失败，请重试');
            } finally {
                state.isPlanning = false;
                showLoading(false);
            }
        }

        function getPermutations(n) {
            return getPermutationsOfArray(Array.from({ length: n }, (_, i) => i));
        }

        function getPermutationsOfArray(arr) {
            const result = [];

            function permute(a, start) {
                if (start === a.length - 1) {
                    result.push([...a]);
                    return;
                }
                for (let i = start; i < a.length; i++) {
                    [a[start], a[i]] = [a[i], a[start]];
                    permute(a, start + 1);
                    [a[start], a[i]] = [a[i], a[start]];
                }
            }

            permute([...arr], 0);
            return result;
        }

        async function calculateAllRoutes() {
            const n = state.locations.length;
            const matrix = {};

            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    if (i !== j) {
                        updateLoadingText(`正在计算路线 (${i * n + j + 1}/${n * n - n})...`);
                        const route = await getRouteInfo(state.locations[i], state.locations[j]);
                        matrix[`${i}-${j}`] = route;
                        await delay(200);
                    }
                }
            }

            return matrix;
        }

        function getRouteInfo(start, end) {
            return new Promise((resolve, reject) => {
                const mode = state.currentMode;
                
                if (mode === 'driving') {
                    const driving = new BMapGL.DrivingRoute(state.map, {
                        onSearchComplete: function(results) {
                            if (driving.getStatus() === BMAP_STATUS_SUCCESS && results && results.getPlan(0)) {
                                const plan = results.getPlan(0);
                                const route = plan.getRoute(0);
                                if (route) {
                                    resolve({
                                        distance: plan.getDistance(true),
                                        distanceValue: plan.getDistance(false),
                                        time: plan.getDuration(true),
                                        timeValue: plan.getDuration(false),
                                        path: route.getPath(),
                                        steps: getRouteSteps(plan)
                                    });
                                } else {
                                    resolve(getFallbackRoute(start, end));
                                }
                            } else {
                                resolve(getFallbackRoute(start, end));
                            }
                        }
                    });
                    driving.search(start.point, end.point);
                } else if (mode === 'walking') {
                    const walking = new BMapGL.WalkingRoute(state.map, {
                        onSearchComplete: function(results) {
                            if (walking.getStatus() === BMAP_STATUS_SUCCESS && results && results.getPlan(0)) {
                                const plan = results.getPlan(0);
                                const route = plan.getRoute(0);
                                if (route) {
                                    resolve({
                                        distance: plan.getDistance(true),
                                        distanceValue: plan.getDistance(false),
                                        time: plan.getDuration(true),
                                        timeValue: plan.getDuration(false),
                                        path: route.getPath(),
                                        steps: getRouteSteps(plan)
                                    });
                                } else {
                                    resolve(getFallbackRoute(start, end));
                                }
                            } else {
                                resolve(getFallbackRoute(start, end));
                            }
                        }
                    });
                    walking.search(start.point, end.point);
                } else if (mode === 'riding') {
                    const riding = new BMapGL.RidingRoute(state.map, {
                        onSearchComplete: function(results) {
                            if (riding.getStatus() === BMAP_STATUS_SUCCESS && results && results.getPlan(0)) {
                                const plan = results.getPlan(0);
                                const route = plan.getRoute(0);
                                if (route) {
                                    resolve({
                                        distance: plan.getDistance(true),
                                        distanceValue: plan.getDistance(false),
                                        time: plan.getDuration(true),
                                        timeValue: plan.getDuration(false),
                                        path: route.getPath(),
                                        steps: getRouteSteps(plan)
                                    });
                                } else {
                                    resolve(getFallbackRoute(start, end));
                                }
                            } else {
                                resolve(getFallbackRoute(start, end));
                            }
                        }
                    });
                    riding.search(start.point, end.point);
                } else if (mode === 'transit') {
                    const transit = new BMapGL.TransitRoute(state.map, {
                        onSearchComplete: function(results) {
                            if (transit.getStatus() === BMAP_STATUS_SUCCESS && results && results.getPlan(0)) {
                                const plan = results.getPlan(0);
                                resolve({
                                    distance: plan.getDistance(true),
                                    distanceValue: plan.getDistance(false) || 0,
                                    time: plan.getDuration(true),
                                    timeValue: plan.getDuration(false) || 0,
                                    path: getTransitPath(plan),
                                    steps: getTransitSteps(plan)
                                });
                            } else {
                                resolve(getFallbackRoute(start, end));
                            }
                        }
                    });
                    transit.search(start.point, end.point);
                }
            });
        }

        function getFallbackRoute(start, end) {
            const distance = getDistance(start.point, end.point);
            let speed = 60;
            if (state.currentMode === 'walking') speed = 5;
            else if (state.currentMode === 'riding') speed = 20;
            else if (state.currentMode === 'transit') speed = 30;

            const timeMinutes = Math.round((distance / 1000 / speed) * 60);
            
            return {
                distance: (distance / 1000).toFixed(1) + '公里',
                distanceValue: distance,
                time: timeMinutes >= 60 
                    ? Math.floor(timeMinutes / 60) + '小时' + (timeMinutes % 60) + '分钟' 
                    : timeMinutes + '分钟',
                timeValue: timeMinutes * 60,
                path: [start.point, end.point],
                steps: [{ description: `从 ${start.name} 到 ${end.name}`, distance: (distance / 1000).toFixed(1) + '公里' }]
            };
        }

        function getDistance(p1, p2) {
            const radLat1 = p1.lat * Math.PI / 180;
            const radLat2 = p2.lat * Math.PI / 180;
            const a = radLat1 - radLat2;
            const b = p1.lng * Math.PI / 180 - p2.lng * Math.PI / 180;
            const s = 2 * Math.asin(Math.sqrt(Math.pow(Math.sin(a / 2), 2) +
                Math.cos(radLat1) * Math.cos(radLat2) * Math.pow(Math.sin(b / 2), 2)));
            return s * 6378.137 * 1000;
        }

        function getRouteSteps(plan) {
            const steps = [];
            const route = plan.getRoute(0);
            if (route) {
                for (let i = 0; i < route.getNumSteps(); i++) {
                    const step = route.getStep(i);
                    steps.push({
                        description: step.getDescription(),
                        distance: step.getDistance(true)
                    });
                }
            }
            return steps;
        }

        function getTransitPath(plan) {
            const path = [];
            for (let i = 0; i < plan.getNumLines(); i++) {
                const line = plan.getLine(i);
                if (line && line.getPath) {
                    path.push(...line.getPath());
                }
            }
            return path;
        }

        function getTransitSteps(plan) {
            const steps = [];
            for (let i = 0; i < plan.getNumLines(); i++) {
                const line = plan.getLine(i);
                steps.push({
                    description: line.getTitle(),
                    distance: line.getDistance(true)
                });
            }
            return steps;
        }

        function calculateRouteCost(order, matrix) {
            let totalDistance = 0;
            let totalTime = 0;
            const segmentDistances = [];
            const segmentTimes = [];
            const segmentSteps = [];

            for (let i = 0; i < order.length - 1; i++) {
                const key = `${order[i]}-${order[i + 1]}`;
                const route = matrix[key];
                if (route) {
                    totalDistance += route.distanceValue;
                    totalTime += route.timeValue;
                    segmentDistances.push(route.distance);
                    segmentTimes.push(route.time);
                    segmentSteps.push(route.steps || []);
                }
            }

            let totalCost;
            switch (state.currentStrategy) {
                case 'fastest':
                    totalCost = totalTime;
                    break;
                case 'shortest':
                    totalCost = totalDistance;
                    break;
                case 'economical':
                    totalCost = totalDistance * 0.6 + totalTime * 0.4;
                    break;
                default:
                    totalCost = totalTime;
            }

            return {
                totalCost,
                totalDistance,
                totalTime,
                segmentDistances,
                segmentTimes,
                segmentSteps
            };
        }

        async function drawOptimalRoute(order, matrix) {
            const colors = ['#3b82f6', '#06b6d4', '#10b981', '#f97316', '#8b5cf6'];
            
            for (let i = 0; i < order.length - 1; i++) {
                const key = `${order[i]}-${order[i + 1]}`;
                const route = matrix[key];
                
                if (route && route.path && route.path.length > 0) {
                    const color = colors[i % colors.length];
                    const polyline = new BMapGL.Polyline(route.path, {
                        strokeColor: color,
                        strokeWeight: 5,
                        strokeOpacity: 0.85,
                        strokeStyle: 'solid',
                        enableMassClear: false
                    });
                    
                    state.map.addOverlay(polyline);
                    state.routePolylines.push(polyline);

                    const glowLine = new BMapGL.Polyline(route.path, {
                        strokeColor: color,
                        strokeWeight: 12,
                        strokeOpacity: 0.2,
                        strokeStyle: 'solid',
                        enableMassClear: false
                    });
                    state.map.addOverlay(glowLine);
                    state.routePolylines.push(glowLine);
                }
            }

            setTimeout(() => fitMapToLocations(), 100);
        }

        function clearRoutes() {
            state.routePolylines.forEach(line => {
                state.map.removeOverlay(line);
            });
            state.routePolylines = [];
            document.getElementById('routeSummary').classList.remove('active');
        }

        function showRouteSummary(order, routeData) {
            const summary = document.getElementById('routeSummary');
            const distanceEl = document.getElementById('totalDistance');
            const timeEl = document.getElementById('totalTime');
            const stepsEl = document.getElementById('routeSteps');

            const totalKm = (routeData.totalDistance / 1000).toFixed(1);
            distanceEl.textContent = totalKm + ' km';

            const totalMinutes = Math.round(routeData.totalTime / 60);
            if (totalMinutes >= 60) {
                timeEl.textContent = Math.floor(totalMinutes / 60) + 'h ' + (totalMinutes % 60) + 'm';
            } else {
                timeEl.textContent = totalMinutes + ' min';
            }

            stepsEl.innerHTML = order.map((idx, i) => {
                const loc = state.locations[idx];
                const color = locationColors[i % locationColors.length];
                let stepDetail = '';
                let transitLines = '';
                
                if (i < order.length - 1) {
                    stepDetail = routeData.segmentDistances[i] + ' · ' + routeData.segmentTimes[i];
                    
                    const steps = routeData.segmentSteps[i] || [];
                    if (steps.length > 0 && state.currentMode === 'transit') {
                        const lines = steps.map(s => s.description).filter(Boolean);
                        if (lines.length > 0) {
                            transitLines = `
                                <div class="transit-lines">
                                    ${lines.map(line => `
                                        <span class="transit-line-badge">${line}</span>
                                    `).join('')}
                                </div>
                            `;
                        }
                    }
                }
                
                return `
                    <div class="step-item">
                        <div class="step-dot" style="background: ${color}; box-shadow: 0 0 8px ${color}80"></div>
                        <div class="step-info">
                            <div class="step-name">${loc.name}</div>
                            <div class="step-detail">${stepDetail}</div>
                            ${transitLines}
                        </div>
                    </div>
                `;
            }).join('');

            summary.classList.add('active');
        }

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

        function updateLoadingText(text) {
            document.getElementById('loadingSubtext').textContent = text;
        }

        function showToast(type, message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = '';
            if (type === 'success') {
                icon = '<svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
            } else if (type === 'error') {
                icon = '<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>';
            } else {
                icon = '<svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
            }

            toast.innerHTML = icon + '<span>' + message + '</span>';
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        window.removeLocation = removeLocation;

        window.onload = initMap;
    </script>
</body>
</html>
