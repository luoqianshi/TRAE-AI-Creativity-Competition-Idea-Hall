<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能笔记整理助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .upload-zone {
            border: 3px dashed rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .note-card {
            transition: all 0.3s ease;
        }

        .note-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            transition: width 0.3s ease;
        }

        .category-tag {
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.4);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.6);
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-4 md:p-8">
        <header class="text-center mb-8 fade-in">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2 flex items-center justify-center gap-3">
                <i class="fa fa-sticky-note-o"></i>
                智能笔记整理助手
            </h1>
            <p class="text-white/80 text-sm md:text-base">拍照上传手写笔记，AI自动识别整理归档</p>
        </header>

        <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="glass p-6 slide-up" style="animation-delay: 0.1s;">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
                            <i class="fa fa-camera text-purple-600"></i>
                            上传笔记
                        </h2>
                        <span class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-full">支持 JPG, PNG</span>
                    </div>

                    <div id="uploadZone" class="upload-zone rounded-xl p-8 text-center cursor-pointer relative overflow-hidden">
                        <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div class="upload-content">
                            <div class="w-20 h-20 mx-auto bg-purple-100 rounded-full flex items-center justify-center mb-4">
                                <i class="fa fa-camera text-4xl text-purple-600"></i>
                            </div>
                            <h3 class="text-lg font-medium text-gray-700 mb-2">点击拍照或上传图片</h3>
                            <p class="text-sm text-gray-500">将手写笔记拍照上传，AI将自动识别整理</p>
                        </div>
                        <div id="previewImage" class="hidden absolute inset-0 bg-gray-900 flex items-center justify-center">
                            <img id="previewImg" src="" alt="预览" class="max-w-full max-h-full object-contain">
                            <button id="removePreview" class="absolute top-4 right-4 text-white bg-black/50 p-2 rounded-full hover:bg-black/70">
                                <i class="fa fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <button id="processBtn" class="btn-gradient w-full mt-4 text-white py-3 px-6 rounded-xl font-medium flex items-center justify-center gap-2">
                        <i class="fa fa-magic"></i>
                        开始智能整理
                    </button>
                </div>

                <div id="resultSection" class="hidden glass p-6 slide-up">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
                            <i class="fa fa-file-text-o text-green-600"></i>
                            识别结果
                        </h2>
                        <div class="flex gap-2">
                            <button id="editBtn" class="text-sm text-purple-600 hover:bg-purple-50 px-3 py-1 rounded-lg">
                                <i class="fa fa-edit"></i> 编辑
                            </button>
                            <button id="saveBtn" class="text-sm bg-green-500 text-white px-3 py-1 rounded-lg hover:bg-green-600">
                                <i class="fa fa-save"></i> 保存
                            </button>
                        </div>
                    </div>

                    <div id="loadingState" class="hidden py-8 text-center">
                        <div class="loader mx-auto mb-4"></div>
                        <p class="text-gray-600">AI正在识别笔记内容...</p>
                        <div class="mt-4 w-full bg-gray-200 rounded-full h-2">
                            <div id="progressBar" class="progress-bar bg-purple-600 h-2 rounded-full" style="width: 0%"></div>
                        </div>
                        <p id="progressText" class="text-xs text-gray-500 mt-2">正在分析图片...</p>
                    </div>

                    <div id="resultContent" class="hidden">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">笔记标题</label>
                            <input type="text" id="noteTitle" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent" placeholder="自动生成标题">
                        </div>

                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">分类标签</label>
                            <div class="flex flex-wrap gap-2">
                                <span class="category-tag bg-blue-100 text-blue-700 cursor-pointer hover:bg-blue-200 selected" data-category="数学">数学</span>
                                <span class="category-tag bg-green-100 text-green-700 cursor-pointer hover:bg-green-200" data-category="语文">语文</span>
                                <span class="category-tag bg-orange-100 text-orange-700 cursor-pointer hover:bg-orange-200" data-category="英语">英语</span>
                                <span class="category-tag bg-red-100 text-red-700 cursor-pointer hover:bg-red-200" data-category="物理">物理</span>
                                <span class="category-tag bg-purple-100 text-purple-700 cursor-pointer hover:bg-purple-200" data-category="化学">化学</span>
                                <span class="category-tag bg-yellow-100 text-yellow-700 cursor-pointer hover:bg-yellow-200" data-category="其他">其他</span>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">笔记内容</label>
                            <textarea id="noteContent" class="w-full h-40 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent resize-none" placeholder="识别后的笔记内容..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="glass p-6 slide-up" style="animation-delay: 0.2s;">
                    <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2 mb-4">
                        <i class="fa fa-folder-open text-orange-500"></i>
                        笔记归档
                    </h2>

                    <div class="flex gap-2 mb-4">
                        <button class="filter-btn active px-3 py-1 rounded-full text-sm bg-purple-600 text-white" data-filter="all">全部</button>
                        <button class="filter-btn px-3 py-1 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="数学">数学</button>
                        <button class="filter-btn px-3 py-1 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="语文">语文</button>
                        <button class="filter-btn px-3 py-1 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="英语">英语</button>
                        <button class="filter-btn px-3 py-1 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="物理">物理</button>
                        <button class="filter-btn px-3 py-1 rounded-full text-sm bg-gray-100 text-gray-600 hover:bg-gray-200" data-filter="化学">化学</button>
                    </div>

                    <div id="notesList" class="space-y-3 max-h-[600px] overflow-y-auto pr-2">
                        <div class="text-center py-8 text-gray-400">
                            <i class="fa fa-folder-open-o text-4xl mb-3"></i>
                            <p>暂无笔记</p>
                            <p class="text-xs mt-1">上传笔记后将自动归档到这里</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-lg opacity-0 transition-opacity duration-300 flex items-center gap-2">
            <i class="fa fa-check-circle text-green-400"></i>
            <span id="toastMessage">操作成功</span>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const previewImage = document.getElementById('previewImage');
        const previewImg = document.getElementById('previewImg');
        const removePreview = document.getElementById('removePreview');
        const processBtn = document.getElementById('processBtn');
        const resultSection = document.getElementById('resultSection');
        const loadingState = document.getElementById('loadingState');
        const resultContent = document.getElementById('resultContent');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const noteTitle = document.getElementById('noteTitle');
        const noteContent = document.getElementById('noteContent');
        const categoryTags = document.querySelectorAll('.category-tag');
        const notesList = document.getElementById('notesList');
        const saveBtn = document.getElementById('saveBtn');
        const editBtn = document.getElementById('editBtn');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        let selectedCategory = '数学';
        let notes = [];

        const mockNotes = [
            {
                id: 1,
                title: '高等数学 - 极限的概念',
                content: '极限是微积分的基础概念。函数f(x)在x趋近于a时的极限，记作lim(x→a)f(x)=L。\n\n极限的性质：\n1. 唯一性：极限如果存在，则唯一\n2. 局部有界性：在x=a的某个去心邻域内有界\n3. 保号性：如果极限大于0，则在邻域内f(x)也大于0\n\n重要极限：\nlim(x→0)sinx/x = 1\nlim(x→0)(1+x)^(1/x) = e',
                category: '数学',
                date: '2024-01-15',
                image: 'https://neeko-copilot.bytedance.net/api/text2image?prompt=handwritten%20mathematics%20notes%20on%20notebook%20paper%20with%20calculus%20formulas&image_size=square'
            },
            {
                id: 2,
                title: '英语语法 - 虚拟语气',
                content: '虚拟语气用于表达与事实相反的情况。\n\n基本结构：\n- 与现在事实相反：If + 主语 + 动词过去式, 主语 + would/could/might + 动词原形\n- 与过去事实相反：If + 主语 + had + 过去分词, 主语 + would/could/might + have + 过去分词\n- 与将来事实相反：If + 主语 + should/were to + 动词原形, 主语 + would/could/might + 动词原形\n\n例句：\nIf I were you, I would study harder.\nIf she had known, she would have come.',
                category: '英语',
                date: '2024-01-14',
                image: 'https://neeko-copilot.bytedance.net/api/text2image?prompt=handwritten%20english%20grammar%20notes%20on%20notebook%20paper&image_size=square'
            },
            {
                id: 3,
                title: '物理 - 牛顿运动定律',
                content: '牛顿三大运动定律：\n\n第一定律（惯性定律）：物体保持静止或匀速直线运动，除非受到外力作用。\n\n第二定律：F=ma，力等于质量乘以加速度。\n\n第三定律：作用力与反作用力大小相等、方向相反。\n\n动量定理：Ft=Δmv\n动能定理：W=ΔEk',
                category: '物理',
                date: '2024-01-13',
                image: 'https://neeko-copilot.bytedance.net/api/text2image?prompt=handwritten%20physics%20notes%20newton%20laws%20on%20notebook%20paper&image_size=square'
            }
        ];

        const generateMockResult = () => {
            const templates = [
                {
                    title: '课堂笔记 - 函数与导数',
                    content: '导数的定义：f\'(x) = lim(Δx→0) [f(x+Δx) - f(x)]/Δx\n\n基本导数公式：\n- (x^n)\' = nx^(n-1)\n- (sinx)\' = cosx\n- (cosx)\' = -sinx\n- (e^x)\' = e^x\n- (lnx)\' = 1/x\n\n复合函数求导法则：链式法则\n若y=f(u), u=g(x)，则dy/dx = dy/du * du/dx',
                    category: '数学'
                },
                {
                    title: '文言文阅读技巧',
                    content: '文言文阅读方法：\n\n1. 通读全文，了解大意\n2. 逐句翻译，注意实词虚词\n3. 分析句式，掌握特殊语法\n4. 理解主旨，把握作者意图\n\n常见虚词：之、其、以、而、于、则、者、也\n\n词类活用：名词作动词、形容词作动词、使动用法、意动用法',
                    category: '语文'
                },
                {
                    title: '化学方程式配平',
                    content: '化学方程式配平方法：\n\n1. 观察法：直接观察配平\n2. 最小公倍数法：找各元素最小公倍数\n3. 奇偶配平法：适用于有奇数偶数的情况\n\n示例：\n2H₂ + O₂ → 2H₂O\nFe + O₂ → Fe₂O₃ → 4Fe + 3O₂ → 2Fe₂O₃\n\n质量守恒定律：反应前后原子种类和数量不变',
                    category: '化学'
                }
            ];
            return templates[Math.floor(Math.random() * templates.length)];
        };

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImg.src = event.target.result;
                    previewImage.classList.remove('hidden');
                    uploadZone.querySelector('.upload-content').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        removePreview.addEventListener('click', () => {
            previewImage.classList.add('hidden');
            uploadZone.querySelector('.upload-content').classList.remove('hidden');
            fileInput.value = '';
        });

        categoryTags.forEach(tag => {
            tag.addEventListener('click', () => {
                categoryTags.forEach(t => t.classList.remove('selected', 'ring-2', 'ring-purple-500'));
                tag.classList.add('selected', 'ring-2', 'ring-purple-500');
                selectedCategory = tag.dataset.category;
            });
        });

        processBtn.addEventListener('click', async () => {
            if (!fileInput.files[0]) {
                showToast('请先上传笔记图片');
                return;
            }

            resultSection.classList.remove('hidden');
            loadingState.classList.remove('hidden');
            resultContent.classList.add('hidden');

            const progressSteps = [
                { text: '正在分析图片...', percent: 20 },
                { text: '识别手写文字...', percent: 50 },
                { text: '整理笔记内容...', percent: 80 },
                { text: '生成结构化笔记...', percent: 100 }
            ];

            for (let i = 0; i < progressSteps.length; i++) {
                await new Promise(resolve => setTimeout(resolve, 800));
                progressBar.style.width = progressSteps[i].percent + '%';
                progressText.textContent = progressSteps[i].text;
            }

            await new Promise(resolve => setTimeout(resolve, 500));

            const mockResult = generateMockResult();
            noteTitle.value = mockResult.title;
            noteContent.value = mockResult.content;
            
            categoryTags.forEach(tag => {
                tag.classList.remove('selected', 'ring-2', 'ring-purple-500');
                if (tag.dataset.category === mockResult.category) {
                    tag.classList.add('selected', 'ring-2', 'ring-purple-500');
                    selectedCategory = mockResult.category;
                }
            });

            loadingState.classList.add('hidden');
            resultContent.classList.remove('hidden');
            showToast('笔记识别完成！');
        });

        saveBtn.addEventListener('click', () => {
            const title = noteTitle.value.trim();
            const content = noteContent.value.trim();

            if (!title || !content) {
                showToast('请填写笔记标题和内容');
                return;
            }

            const newNote = {
                id: Date.now(),
                title,
                content,
                category: selectedCategory,
                date: new Date().toISOString().split('T')[0],
                image: previewImg.src
            };

            notes.unshift(newNote);
            renderNotes();
            showToast('笔记保存成功！');
            
            previewImage.classList.add('hidden');
            uploadZone.querySelector('.upload-content').classList.remove('hidden');
            fileInput.value = '';
            resultSection.classList.add('hidden');
        });

        editBtn.addEventListener('click', () => {
            noteTitle.readOnly = !noteTitle.readOnly;
            noteContent.readOnly = !noteContent.readOnly;
            
            if (noteTitle.readOnly) {
                editBtn.innerHTML = '<i class="fa fa-edit"></i> 编辑';
                editBtn.classList.remove('bg-purple-100');
            } else {
                editBtn.innerHTML = '<i class="fa fa-lock"></i> 锁定';
                editBtn.classList.add('bg-purple-100');
            }
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('active', 'bg-purple-600', 'text-white');
                    b.classList.add('bg-gray-100', 'text-gray-600');
                });
                btn.classList.remove('bg-gray-100', 'text-gray-600');
                btn.classList.add('active', 'bg-purple-600', 'text-white');
                
                renderNotes(btn.dataset.filter);
            });
        });

        const renderNotes = (filter = 'all') => {
            const filteredNotes = filter === 'all' 
                ? notes 
                : notes.filter(n => n.category === filter);

            if (filteredNotes.length === 0) {
                notesList.innerHTML = `
                    <div class="text-center py-8 text-gray-400">
                        <i class="fa fa-folder-open-o text-4xl mb-3"></i>
                        <p>暂无笔记</p>
                        <p class="text-xs mt-1">上传笔记后将自动归档到这里</p>
                    </div>
                `;
                return;
            }

            notesList.innerHTML = filteredNotes.map(note => `
                <div class="note-card bg-white rounded-xl p-4 border border-gray-100">
                    <div class="flex items-start justify-between mb-2">
                        <h3 class="font-medium text-gray-800 text-sm line-clamp-1 flex-1">${note.title}</h3>
                        <span class="category-tag bg-${getCategoryColor(note.category)}-100 text-${getCategoryColor(note.category)}-700">${note.category}</span>
                    </div>
                    <p class="text-xs text-gray-500 mb-2">${note.date}</p>
                    <p class="text-sm text-gray-600 line-clamp-2">${note.content}</p>
                    <div class="flex gap-2 mt-3">
                        <button onclick="viewNote(${note.id})" class="text-xs text-purple-600 hover:bg-purple-50 px-2 py-1 rounded">查看</button>
                        <button onclick="deleteNote(${note.id})" class="text-xs text-red-500 hover:bg-red-50 px-2 py-1 rounded">删除</button>
                    </div>
                </div>
            `).join('');
        };

        const getCategoryColor = (category) => {
            const colors = {
                '数学': 'blue',
                '语文': 'green',
                '英语': 'orange',
                '物理': 'red',
                '化学': 'purple',
                '其他': 'yellow'
            };
            return colors[category] || 'gray';
        };

        window.viewNote = (id) => {
            const note = notes.find(n => n.id === id);
            if (note) {
                resultSection.classList.remove('hidden');
                loadingState.classList.add('hidden');
                resultContent.classList.remove('hidden');
                
                noteTitle.value = note.title;
                noteContent.value = note.content;
                
                categoryTags.forEach(tag => {
                    tag.classList.remove('selected', 'ring-2', 'ring-purple-500');
                    if (tag.dataset.category === note.category) {
                        tag.classList.add('selected', 'ring-2', 'ring-purple-500');
                        selectedCategory = note.category;
                    }
                });
            }
        };

        window.deleteNote = (id) => {
            if (confirm('确定要删除这条笔记吗？')) {
                notes = notes.filter(n => n.id !== id);
                renderNotes();
                showToast('笔记已删除');
            }
        };

        const showToast = (message) => {
            toastMessage.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        };

        notes = [...mockNotes];
        renderNotes();
    </script>
</body>
</html>
