
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医院指标SQL生成器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 40px;
        }
        
        .step {
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 5px solid #667eea;
        }
        
        .step h2 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 1.4em;
        }
        
        .file-input-wrapper {
            margin: 15px 0;
        }
        
        .file-input-wrapper label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 1em;
        }
        
        input[type="file"]:hover {
            border-color: #764ba2;
            background: #f0f4ff;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .status {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .result-section {
            margin-top: 30px;
            display: none;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-section h2 {
            margin-bottom: 15px;
            color: #1e3c72;
        }
        
        .sql-preview {
            width: 100%;
            height: 400px;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
            resize: vertical;
            font-size: 12px;
            line-height: 1.5;
        }
        
        .download-btn {
            margin-top: 15px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .instructions {
            background: #fff3cd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 5px solid #ffc107;
        }
        
        .instructions h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        
        .instructions ol {
            margin-left: 20px;
            color: #856404;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 医院指标SQL生成器</h1>
            <p>从Excel文件生成指标元数据的SQL插入语句</p>
        </div>
        
        <div class="content">
            <div class="instructions">
                <h3>📋 使用说明</h3>
                <ol>
                    <li>在 <code>D:\Projects\text\excel_temp\xl\</code> 文件夹中找到 <code>sharedStrings.xml</code> 和 <code>sheet1.xml</code></li>
                    <li>分别选择这两个文件</li>
                    <li>点击"生成SQL"按钮</li>
                    <li>预览并下载生成的SQL文件</li>
                </ol>
            </div>
            
            <div class="step">
                <h2>1️⃣ 选择XML文件</h2>
                <div class="file-input-wrapper">
                    <label for="sharedStrings">sharedStrings.xml (包含所有文本内容)</label>
                    <input type="file" id="sharedStrings" accept=".xml">
                </div>
                <div class="file-input-wrapper">
                    <label for="sheet1">sheet1.xml (包含表格结构)</label>
                    <input type="file" id="sheet1" accept=".xml">
                </div>
            </div>
            
            <div class="step">
                <h2>2️⃣ 生成SQL</h2>
                <button id="generateBtn" disabled>生成SQL插入语句</button>
                <div id="status"></div>
            </div>
            
            <div class="result-section" id="resultSection">
                <h2>3️⃣ 预览和下载</h2>
                <textarea id="sqlPreview" class="sql-preview" readonly></textarea>
                <button id="downloadBtn" class="download-btn">💾 下载SQL文件</button>
            </div>
        </div>
    </div>

    <script>
        let sharedStringsContent = null;
        let sheet1Content = null;
        let generatedSql = null;

        document.getElementById('sharedStrings').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                sharedStringsContent = await readFile(file);
                updateStatus(`✓ 已加载: ${file.name}`, 'info');
                checkReady();
            }
        });

        document.getElementById('sheet1').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (file) {
                sheet1Content = await readFile(file);
                updateStatus(`✓ 已加载: ${file.name}`, 'info');
                checkReady();
            }
        });

        function readFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        function checkReady() {
            document.getElementById('generateBtn').disabled = !(sharedStringsContent && sheet1Content);
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }

        function extractStrings(xml) {
            const strings = [];
            const siPattern = /<si>[\s\S]*?<\/si>/g;
            const siMatches = xml.match(siPattern) || [];
            
            for (const si of siMatches) {
                let text = '';
                const tPattern = /<t>([\s\S]*?)<\/t>/g;
                let tMatch;
                while ((tMatch = tPattern.exec(si)) !== null) {
                    text += tMatch[1];
                }
                strings.push(text);
            }
            
            return strings;
        }

        function parseSheet(xml, strings) {
            const data = [];
            const rowPattern = /<row[^>]*>([\s\S]*?)<\/row>/g;
            let rowMatch;
            
            while ((rowMatch = rowPattern.exec(xml)) !== null) {
                const rowData = {};
                const rowContent = rowMatch[1];
                
                const cellPattern = /<c[^>]*r="([A-Z]+[0-9]+)"[^>]*>([\s\S]*?)<\/c>/g;
                let cellMatch;
                
                while ((cellMatch = cellPattern.exec(rowContent)) !== null) {
                    const ref = cellMatch[1];
                    const cellInner = cellMatch[2];
                    const col = ref.replace(/[0-9]/g, '');
                    
                    let value = '';
                    if (cellInner.includes('t="s"')) {
                        const vMatch = cellInner.match(/<v>(\d+)<\/v>/);
                        if (vMatch) {
                            const idx = parseInt(vMatch[1]);
                            if (idx < strings.length) {
                                value = strings[idx];
                            }
                        }
                    }
                    
                    rowData[col] = value;
                }
                
                if (Object.keys(rowData).length > 0) {
                    data.push(rowData);
                }
            }
            
            return data;
        }

        function getCategory(metricName) {
            if (!metricName) return '其他';
            if (/门诊|诊/.test(metricName)) return '门诊服务';
            if (/住院|床|病房/.test(metricName)) return '住院服务';
            if (/质量|率|治愈|好转|抢救|死亡/.test(metricName)) return '医疗质量';
            if (/预约|挂号/.test(metricName)) return '预约管理';
            if (/中医|中药/.test(metricName)) return '中医中药';
            if (/收入|支出|成本|费用|财务|经营|经济/.test(metricName)) return '经营管理';
            return '其他';
        }

        function getUnit(metricName, description) {
            const text = (metricName || '') + (description || '');
            if (/%/.test(text) || (metricName && /率/.test(metricName))) return '%';
            if (metricName && (/人/.test(metricName) || /人次/.test(metricName))) return '人次';
            if (metricName && /天/.test(metricName)) return '天';
            if (metricName && /床/.test(metricName)) return '张';
            if (/元/.test(text)) return '元';
            return '';
        }

        function getDataType(metricName, description) {
            const desc = description || '';
            const name = metricName || '';
            if (desc.includes('=')) return 'formula';
            if (name.includes('率') || desc.includes('%')) return 'percentage';
            return 'number';
        }

        function getDecimalPlaces(dataType) {
            return dataType === 'percentage' ? 2 : 0;
        }

        function escapeSql(s) {
            if (!s) return '';
            return s.replace(/'/g, "''");
        }

        function generateSql(data) {
            const sqlLines = [];
            const now = new Date().toLocaleString('zh-CN');
            
            sqlLines.push('-- 指标元数据插入语句');
            sqlLines.push(`-- 生成时间: ${now}`);
            sqlLines.push(`-- 共 ${data.length - 1} 条记录`);
            sqlLines.push('');
            sqlLines.push('USE hospital_dashboard;');
            sqlLines.push('');
            
            for (let i = 1; i < data.length; i++) {
                const row = data[i];
                const metricName = row['A'] || '';
                const description = row['B'] || '';
                
                if (!metricName) continue;
                
                const metricCode = `MET_${String(i).padStart(4, '0')}`;
                const category = getCategory(metricName);
                const unit = getUnit(metricName, description);
                const dataType = getDataType(metricName, description);
                const decimalPlaces = getDecimalPlaces(dataType);
                
                const sql = `INSERT INTO hospital_dashboard.metric_metadata (
    metric_code, metric_name, category, unit, data_type, decimal_places,
    description, available_dimensions, comparison_supported, comparison_types,
    sort_order, is_active, metric_type, status, creator, is_quoted, audit_status,
    deleted, created_at, updated_at
) VALUES (
    '${metricCode}', '${escapeSql(metricName)}', '${category}', '${unit}', '${dataType}', ${decimalPlaces},
    '${escapeSql(description)}', '昨日,本周,本月,本年', 1, '同比,环比',
    ${i}, 1, '基础指标', 1, 'admin', 0, 1,
    0, NOW(), NOW()
);`;
                sqlLines.push(sql);
                sqlLines.push('');
            }
            
            return sqlLines.join('\n');
        }

        document.getElementById('generateBtn').addEventListener('click', () => {
            try {
                updateStatus('正在解析文件...', 'info');
                
                const strings = extractStrings(sharedStringsContent);
                const data = parseSheet(sheet1Content, strings);
                
                updateStatus(`解析完成！找到 ${strings.length} 个字符串和 ${data.length} 行数据`, 'info');
                
                generatedSql = generateSql(data);
                
                document.getElementById('sqlPreview').value = generatedSql;
                document.getElementById('resultSection').classList.add('show');
                
                updateStatus(`✓ 成功生成 ${data.length - 1} 条INSERT语句！`, 'success');
            } catch (error) {
                updateStatus(`错误: ${error.message}`, 'error');
                console.error(error);
            }
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!generatedSql) return;
            
            const blob = new Blob([generatedSql], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'insert_metric_metadata.sql';
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
