<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="火烧云预测器 - 基于气象数据预测火烧云出现概率，双模型对比（BestMatch + ECMWF）">
    <meta name="theme-color" content="#FF4500">
    <title>火烧云预测器 | FireCloud Predictor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>"
</head>
<body>
    <div id="app-bg"></div>

    <div class="container">
        <!-- 头部 -->
        <header class="app-header">
            <h1 class="app-title">火烧云预测器</h1>
            <p class="app-subtitle">基于 BestMatch + ECMWF 双模型气象数据，预测今日火烧云出现概率</p>
        </header>

        <!-- 城市选择 -->
        <div class="card">
            <div class="city-selector">
                <input type="text" id="city-search" placeholder="搜索城市（北京、上海、拉萨...）" autocomplete="off">
                <div class="city-dropdown" id="city-dropdown"></div>
            </div>
            <div class="info-bar">
                <span>📍 <span id="city-name">定位中...</span></span>
                <span id="city-coords"></span>
                <span id="sun-times">--</span>
                <button class="btn btn-secondary" id="refresh-btn" style="padding: 6px 12px; font-size: 0.8rem;">刷新</button>
            </div>
        </div>

        <!-- 加载状态 -->
        <div id="loading-overlay">
            <div class="loader">
                <div class="loader-spinner"></div>
                <div class="loader-text">正在获取 BestMatch + ECMWF 气象数据...</div>
            </div>
        </div>

        <!-- 错误信息 -->
        <div id="error-message"></div>

        <!-- 结果区域 -->
        <div id="result-section" style="display: none;">

            <!-- 预测等级 -->
            <div class="card level-banner">
                <span class="level-emoji" id="level-emoji">🌅</span>
                <div class="level-text" id="level-text">预测中...</div>
                <div class="level-desc" id="level-desc"></div>
            </div>

            <!-- 倒计时 -->
            <div class="card">
                <div id="countdown"></div>
            </div>

            <!-- 双模型对比 -->
            <div class="card">
                <div class="card-title">模型对比</div>
                <div class="model-comparison" id="model-comparison"></div>
            </div>

            <!-- 仪表盘 + 雷达图 -->
            <div class="dual-panel">
                <div class="card gauge-container">
                    <div class="card-title">综合评分 (BestMatch)</div>
                    <canvas id="gauge-canvas" class="gauge-canvas"></canvas>
                </div>
                <div class="card">
                    <div class="card-title">多维度分析</div>
                    <div class="canvas-container">
                        <canvas id="radar-canvas" class="radar-canvas"></canvas>
                    </div>
                </div>
            </div>

            <!-- 太阳轨迹图 -->
            <div class="card">
                <div class="card-title">太阳轨迹</div>
                <div class="canvas-container">
                    <canvas id="trajectory-canvas" class="trajectory-canvas"></canvas>
                </div>
            </div>

            <!-- 天气参数卡片 -->
            <div class="card">
                <div class="card-title">气象参数详情</div>
                <div class="weather-cards-grid" id="weather-cards"></div>
            </div>

            <!-- 小时预报时间线 -->
            <div class="card">
                <div class="card-title">逐小时预报</div>
                <div class="hourly-timeline" id="hourly-timeline"></div>
            </div>

            <!-- 观赏建议 -->
            <div class="card">
                <div class="card-title">观赏建议</div>
                <div class="advice-list" id="advice-list"></div>
            </div>

            <!-- 信息栏 -->
            <div class="card" style="padding: 12px 20px;">
                <div class="info-bar">
                    <span>🌡️ <span id="current-weather"></span></span>
                    <span id="data-source"></span>
                    <span>🕐 <span id="update-time"></span></span>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="app-footer">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px;">
                <div class="algo-badge">🔬 基于瑞利散射理论</div>
                <div class="algo-badge">📊 BestMatch（多模型融合）</div>
                <div class="algo-badge">🌍 ECMWF（欧洲中心）</div>
            </div>
            <p>火烧云预测器 v2.0 | 仅供娱乐参考，不作为精确气象预报</p>
            <p>天气数据：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (完全免费、开源)</p>
            <p>TRAE AI 创造力大赛参赛作品</p>
        </footer>
    </div>

    <div id="toast"></div>

    <script src="js/cities.js"></script>
    <script src="js/astronomy.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/predictor.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
