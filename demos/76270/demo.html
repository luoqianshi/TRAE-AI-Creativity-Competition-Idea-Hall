<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知悟 - AI驱动的知识内化助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fb; color: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; border-radius: 24px; padding: 32px; max-width: 420px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .logo { width: 48px; height: 48px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; }
    h1 { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 14px; color: #6b7280; margin-top: 4px; }
    .input-area { background: #f9fafb; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    textarea { width: 100%; border: none; background: transparent; resize: none; font-size: 15px; line-height: 1.5; outline: none; font-family: inherit; color: #1f2937; }
    textarea::placeholder { color: #9ca3af; }
    .btn { background: #6366f1; color: white; border: none; border-radius: 14px; padding: 14px 20px; font-size: 16px; font-weight: 600; width: 100%; cursor: pointer; transition: 0.2s; margin-bottom: 20px; }
    .btn:hover { background: #4f46e5; }
    .question-card { background: #f0f4ff; border-radius: 16px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #6366f1; }
    .question { font-weight: 600; margin-bottom: 8px; font-size: 15px; }
    .hint { font-size: 13px; color: #4b5563; }
    .schedule { display: flex; justify-content: space-between; font-size: 13px; color: #6b7280; margin-top: 16px; }
    .badge { background: #6366f1; color: white; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">🧠</div>
      <div>
        <h1>知悟</h1>
        <div class="subtitle">把笔记变成你的私人考官</div>
      </div>
    </div>

    <div class="input-area">
      <textarea placeholder="粘贴课堂笔记、文章摘要或任何你想记住的内容..." rows="4"></textarea>
    </div>
    <button class="btn" onclick="generateQuestions()">✨ 生成内化问题</button>

    <div id="questions-container">
      <div class="question-card">
        <div class="question">🔹 用自己的话说说「间隔重复」为什么比临时抱佛脚更有效？</div>
        <div class="hint">💡 提示：想到突触可塑性和遗忘曲线</div>
      </div>
      <div class="question-card">
        <div class="question">🔹 如果向一个10岁的孩子解释「费曼学习法」，你会怎么举例？</div>
        <div class="hint">💡 提示：试着用“教”的方式学</div>
      </div>
    </div>

    <div class="schedule">
      <span>⏰ 下一次复习：明天 9:00</span>
      <span class="badge">记忆强度 72%</span>
    </div>
  </div>

  <script>
    function generateQuestions() {
      const container = document.getElementById('questions-container');
      container.innerHTML = `
        <div class="question-card">
          <div class="question">🔹 这份笔记中最重要的三个概念是什么？它们之间如何关联？</div>
          <div class="hint">💡 试着用思维导图的方式说出来</div>
        </div>
        <div class="question-card">
          <div class="question">🔹 如果你要向同事讲解这个主题，会用什么生活案例来开场？</div>
          <div class="hint">💡 费曼技巧：简单 + 类比</div>
        </div>
        <div class="question-card">
          <div class="question">🔹 有哪些你原本知道但现在已经过时的理解需要纠正？</div>
          <div class="hint">💡 知识内化的关键是打破错觉</div>
        </div>
      `;
    }
  </script>
</body>
</html>
