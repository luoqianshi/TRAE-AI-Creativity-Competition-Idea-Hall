<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棱镜 Prism — 反碎片化知识图谱</title>
<script src="https://d3js.org/d3.v7.min.js">
</script>
<style>
/* ============================================================
   CSS Reset & Base — 暗黑太空星系风
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

@font-face {
  font-family: 'SpaceFont';
  src: local('Microsoft YaHei'), local('PingFang SC'), local('sans-serif');
}

:root {
  --bg-deep: #06061a;
  --bg-panel: #0c0c28;
  --accent-cyan: #00e5ff;
  --accent-gold: #ffd740;
  --accent-purple: #b388ff;
  --text-primary: #e0e0f0;
  --text-secondary: #9090b8;
  --sidebar-width: 420px;
  --header-height: 60px;
}

body {
  font-family: 'SpaceFont', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
  -webkit-user-select: none;
}

/* 背景星场 */
#starfield {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ============================================================
   Header
   ============================================================ */
#header {
  position: relative;
  z-index: 10;
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 24px;
  background: linear-gradient(180deg, rgba(12,12,40,0.95) 0%, rgba(6,6,26,0) 100%);
  backdrop-filter: blur(8px);
}

#header .logo {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#header .subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 2px;
}

#header .search-box {
  position: relative;
  margin-left: 24px;
}

#header .search-box input {
  width: 220px;
  padding: 8px 14px 8px 36px;
  border-radius: 20px;
  border: 1px solid rgba(0,229,255,0.25);
  background: rgba(12,12,40,0.8);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  transition: border-color 0.3s;
  letter-spacing: 1px;
}

#header .search-box input:focus {
  border-color: var(--accent-cyan);
}

#header .search-box .search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent-cyan);
  font-size: 14px;
  pointer-events: none;
}

#header .hint-text {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 1px;
  opacity: 0.7;
}

/* 搜索输入框 */
#header .search-box {
  position: relative;
  margin-left: 18px;
}

#header .search-box input {
  width: 200px;
  padding: 8px 14px 8px 36px;
  border-radius: 20px;
  border: 1px solid rgba(0,229,255,0.25);
  background: rgba(12,12,40,0.8);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  letter-spacing: 1px;
  cursor: default;
  font-family: inherit;
}

#header .search-box input:focus {
  border-color: var(--accent-cyan);
}

#header .search-box .search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent-cyan);
  font-size: 14px;
  pointer-events: none;
}

/* 历史记录切换按钮 */
.history-toggle {
  position: fixed;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 12;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(0,229,255,0.25);
  background: rgba(12,12,40,0.85);
  color: var(--accent-cyan);
  font-size: 17px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
}

.history-toggle:hover {
  border-color: var(--accent-cyan);
  background: rgba(0,229,255,0.12);
  box-shadow: 0 0 16px rgba(0,229,255,0.15);
}

/* 左侧历史抽屉 */
#history-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0);
  pointer-events: none;
  z-index: 18;
  transition: background 0.35s ease;
}

#history-overlay.active {
  background: rgba(0,0,0,0.3);
  pointer-events: all;
}

#history-drawer {
  position: fixed;
  top: 0;
  left: -300px;
  width: 280px;
  height: 100%;
  background: linear-gradient(180deg,
    rgba(14,14,44,0.98) 0%,
    rgba(8,8,30,0.98) 100%);
  border-right: 1px solid rgba(0,229,255,0.12);
  backdrop-filter: blur(20px);
  z-index: 22;
  transition: left 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  box-shadow: 8px 0 40px rgba(0,0,0,0.4);
}

#history-drawer.open {
  left: 0;
}

#history-drawer .drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

#history-drawer .drawer-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--accent-cyan);
}

#history-drawer .drawer-close {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}

#history-drawer .drawer-close:hover {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
}

#history-drawer .history-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#history-drawer .history-item {
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.03);
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.3s ease;
}

#history-drawer .history-item:hover {
  border-color: rgba(0,229,255,0.3);
  background: rgba(0,229,255,0.08);
  color: var(--accent-cyan);
}

#history-drawer .history-item.active {
  border-color: rgba(0,229,255,0.35);
  background: rgba(0,229,255,0.1);
  color: var(--accent-cyan);
  font-weight: 600;
}

/* 重组按钮 */
#header .regenerate-btn {
  margin-left: 10px;
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid rgba(255,215,64,0.4);
  background: rgba(255,215,64,0.08);
  color: var(--accent-gold);
  font-size: 13px;
  cursor: pointer;
  letter-spacing: 2px;
  font-family: inherit;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

#header .regenerate-btn::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

#header .regenerate-btn:hover {
  border-color: var(--accent-gold);
  background: rgba(255,215,64,0.15);
  box-shadow: 0 0 20px rgba(255,215,64,0.15);
}

#header .regenerate-btn:active::before {
  width: 300px;
  height: 300px;
}

/* 白光射入遮罩 */
#white-flash {
  position: fixed;
  top: 50%; left: 50%;
  width: 0; height: 0;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,240,200,0.5) 40%, transparent 70%);
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 30;
  transition: width 0.5s cubic-bezier(0.25, 0.8, 0.25, 1),
              height 0.5s cubic-bezier(0.25, 0.8, 0.25, 1),
              opacity 0.3s ease 0.3s;
  opacity: 0;
}

#white-flash.flash {
  width: 200vmax;
  height: 200vmax;
  opacity: 0;
}

/* ============================================================
   搜索弹窗
   ============================================================ */
#search-modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(4,4,22,0);
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  transition: background 0.4s ease;
}

#search-modal-overlay.active {
  background: rgba(4,4,22,0.75);
  pointer-events: all;
  backdrop-filter: blur(4px);
}

#search-modal-card {
  background: linear-gradient(135deg,
    rgba(16,16,50,0.97) 0%,
    rgba(10,10,36,0.97) 100%);
  border: 1px solid rgba(0,229,255,0.18);
  border-radius: 20px;
  padding: 40px 36px 32px;
  width: 440px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 80px rgba(0,229,255,0.06);
  transform: scale(0.85) translateY(20px);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.22, 0.61, 0.36, 1),
              opacity 0.35s ease;
}

#search-modal-overlay.active #search-modal-card {
  transform: scale(1) translateY(0);
  opacity: 1;
}

#search-modal-card .modal-logo {
  text-align: center;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--accent-cyan);
  margin-bottom: 6px;
}

#search-modal-card .modal-subtitle {
  text-align: center;
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  margin-bottom: 24px;
  opacity: 0.6;
}

#search-modal-card .modal-input-wrap {
  position: relative;
  margin-bottom: 20px;
}

#search-modal-card .modal-input-wrap .modal-search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--accent-cyan);
  font-size: 18px;
  pointer-events: none;
}

#search-modal-card .modal-input {
  width: 100%;
  padding: 14px 18px 14px 46px;
  border-radius: 14px;
  border: 2px solid rgba(0,229,255,0.25);
  background: rgba(8,8,30,0.9);
  color: #fff;
  font-size: 17px;
  outline: none;
  letter-spacing: 2px;
  cursor: default;
  font-family: inherit;
  text-align: center;
  transition: border-color 0.3s, box-shadow 0.3s;
  box-sizing: border-box;
}

#search-modal-card .modal-input:hover {
  cursor: not-allowed;
}

#search-modal-card .modal-input:focus {
  border-color: var(--accent-cyan);
  box-shadow: 0 0 24px rgba(0,229,255,0.12);
}

#search-modal-card .modal-history-label {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  margin-bottom: 10px;
  text-align: center;
  opacity: 0.5;
}

#search-modal-card .modal-history-chips {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
}

#search-modal-card .modal-chip {
  padding: 8px 20px;
  border-radius: 20px;
  border: 1px solid rgba(255,215,64,0.25);
  background: rgba(255,215,64,0.05);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all 0.3s ease;
  font-family: inherit;
}

#search-modal-card .modal-chip:hover {
  border-color: var(--accent-gold);
  background: rgba(255,215,64,0.12);
  color: var(--accent-gold);
}

#search-modal-card .modal-chip.active {
  border-color: var(--accent-gold);
  background: rgba(255,215,64,0.15);
  color: var(--accent-gold);
  font-weight: 600;
}

#search-modal-card .modal-regenerate-btn {
  display: block;
  width: 100%;
  padding: 13px;
  border-radius: 14px;
  border: 1px solid rgba(255,215,64,0.35);
  background: rgba(255,215,64,0.08);
  color: var(--accent-gold);
  font-size: 16px;
  cursor: pointer;
  letter-spacing: 3px;
  font-family: inherit;
  font-weight: 600;
  transition: all 0.3s ease;
}

#search-modal-card .modal-regenerate-btn:hover {
  border-color: var(--accent-gold);
  background: rgba(255,215,64,0.18);
  box-shadow: 0 0 28px rgba(255,215,64,0.15);
}

/* ============================================================
   Graph Container
   ============================================================ */
#graph-container {
  position: absolute;
  top: var(--header-height);
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
}

#graph-container svg {
  width: 100%;
  height: 100%;
}

/* 节点样式 */
.node-circle {
  cursor: pointer;
  transition: opacity 0.4s ease;
}

.node-center {
  filter: url(#glow-strong);
}

.node-branch {
  filter: url(#glow-moderate);
}

.node-leaf {
  filter: url(#glow-subtle);
}

.node-label {
  font-size: 13px;
  fill: #c8d6f8;
  text-anchor: middle;
  pointer-events: none;
  letter-spacing: 1px;
  transition: fill 0.4s, opacity 0.4s;
}

.node-label.center-label {
  font-size: 17px;
  font-weight: 700;
  fill: #ffe8a0;
}

/* 连线样式 */
.edge-line {
  stroke: rgba(100, 180, 240, 0.35);
  stroke-width: 1.5;
  transition: stroke 0.4s, stroke-width 0.4s, opacity 0.4s;
}

.edge-label {
  font-size: 11px;
  fill: #8899cc;
  text-anchor: middle;
  pointer-events: none;
  letter-spacing: 0.5px;
  paint-order: stroke;
  stroke: rgba(6,6,26,0.85);
  stroke-width: 3px;
  stroke-linejoin: round;
  transition: fill 0.4s, opacity 0.4s;
}

/* Focus Mode 调暗 */
.dimmed {
  opacity: 0.08 !important;
}

.highlighted-edge {
  stroke: var(--accent-cyan) !important;
  stroke-width: 3px !important;
  opacity: 1 !important;
  filter: url(#glow-moderate);
}

.highlighted-label {
  fill: var(--accent-cyan) !important;
  opacity: 1 !important;
  font-weight: 700;
}

/* 步长虚化 */
.step-hidden {
  opacity: 0 !important;
  pointer-events: none !important;
}

.step-dimmed {
  opacity: 0.12 !important;
}

.step-glow {
  filter: url(#glow-moderate);
}

/* ============================================================
   Sidebar — 知识卡片
   ============================================================ */
#sidebar-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0);
  pointer-events: none;
  z-index: 20;
  transition: background 0.4s ease;
}

#sidebar-overlay.active {
  background: rgba(0,0,0,0.35);
  pointer-events: all;
}

#sidebar {
  position: fixed;
  top: 0;
  right: calc(-1 * var(--sidebar-width));
  width: var(--sidebar-width);
  height: 100%;
  background: linear-gradient(180deg, 
    rgba(14,14,44,0.98) 0%, 
    rgba(8,8,30,0.98) 100%);
  border-left: 1px solid rgba(0,229,255,0.15);
  backdrop-filter: blur(20px);
  z-index: 25;
  transition: right 0.45s cubic-bezier(0.22, 0.61, 0.36, 1);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  box-shadow: -8px 0 40px rgba(0,0,0,0.5);
}

#sidebar.open {
  right: 0;
}

#sidebar .close-btn {
  position: absolute;
  top: 16px;
  right: 20px;
  width: 36px;
  height: 36px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  background: rgba(255,255,255,0.04);
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}

#sidebar .close-btn:hover {
  border-color: var(--accent-cyan);
  color: var(--accent-cyan);
  background: rgba(0,229,255,0.08);
}

#sidebar .card-header {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

#sidebar .card-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}

#sidebar .card-type {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  text-transform: uppercase;
}

#sidebar .card-section {
  margin-bottom: 20px;
}

#sidebar .card-section .section-label {
  font-size: 11px;
  color: var(--accent-purple);
  letter-spacing: 3px;
  margin-bottom: 8px;
  font-weight: 600;
}

#sidebar .card-section .section-content {
  font-size: 14px;
  line-height: 1.8;
  color: #d0d0e8;
  letter-spacing: 0.5px;
}

#sidebar .card-section .metaphor-box {
  background: rgba(179,136,255,0.06);
  border-left: 2px solid var(--accent-purple);
  border-radius: 0 8px 8px 0;
  padding: 14px 16px;
  margin-top: 8px;
}

#sidebar .card-section .metaphor-box .metaphor-text {
  font-size: 13px;
  line-height: 1.8;
  color: #c8c0e8;
  font-style: italic;
}

#sidebar .card-decoration {
  margin-top: auto;
  text-align: center;
  opacity: 0.25;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-secondary);
  padding-top: 20px;
}

/* ============================================================
   Focus 提示条
   ============================================================ */
#focus-indicator {
  position: fixed;
  top: calc(var(--header-height) + 16px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  padding: 10px 22px;
  border-radius: 24px;
  background: rgba(0,229,255,0.12);
  border: 1px solid rgba(0,229,255,0.3);
  backdrop-filter: blur(10px);
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--accent-cyan);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s ease;
}

#focus-indicator.visible {
  opacity: 1;
}

/* ============================================================
   Zoom Controls
   ============================================================ */
#zoom-controls {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 16;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

#zoom-controls button {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid rgba(0,229,255,0.2);
  background: rgba(12,12,40,0.85);
  color: var(--accent-cyan);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
  font-family: inherit;
  line-height: 1;
}

#zoom-controls button:hover {
  border-color: var(--accent-cyan);
  background: rgba(0,229,255,0.12);
  box-shadow: 0 0 16px rgba(0,229,255,0.12);
}

#zoom-controls button.reset-btn {
  font-size: 15px;
  color: var(--text-secondary);
  border-color: rgba(255,255,255,0.12);
}

#zoom-controls button.reset-btn:hover {
  color: var(--accent-gold);
  border-color: var(--accent-gold);
  box-shadow: 0 0 12px rgba(255,215,64,0.1);
}

/* ============================================================
   Animations
   ============================================================ */
@keyframes pulse-glow {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

.node-center {
  animation: pulse-glow 2.5s ease-in-out infinite;
}

/* 响应式 */
@media (max-width: 768px) {
  :root { --sidebar-width: 100vw; }
  #header .subtitle, #header .hint-text { display: none; }
  #header .search-box input { width: 150px; }
}
</style>
</head>
<body>

<!-- 背景星场 Canvas -->
<canvas id="starfield"></canvas>

<!-- 白光射入遮罩 -->
<div id="white-flash"></div>

<!-- 历史记录切换按钮 -->
<button class="history-toggle" id="history-toggle-btn" title="搜索历史">☰</button>

<!-- 左侧历史抽屉遮罩 -->
<div id="history-overlay"></div>

<!-- 左侧历史抽屉 -->
<div id="history-drawer">
  <div class="drawer-header">
    <span class="drawer-title">📜 搜索历史</span>
    <button class="drawer-close" id="drawer-close-btn">✕</button>
  </div>

// ============================================================
// 2. 动态状态管理（支持数据集切换）
// ============================================================
let currentNodeMap = new Map();
let currentEdgeMap = new Map();
let currentChildrenMap = new Map();
let currentParentMap = new Map();
let currentLeafDetails = {};
let currentDatasetKey = 'llm';

const state = {
  visibleNodeIds: new Set(),
  visibleEdgeIds: new Set(),
  expandedBranches: new Set(),
  stepFocusNode: null,
  nodeSteps: new Map(),
  sidebarOpen: false,
};

function loadDataset(key) {
  if (!DATASETS[key]) return;
  currentDatasetKey = key;
  const ds = DATASETS[key];

  // 重置数据结构
  currentNodeMap = new Map(ds.nodes.map(n => [n.id, { ...n }]));
  currentEdgeMap = new Map(ds.edges.map(e => [e.id, { ...e }]));
  currentLeafDetails = ds.leafDetails || {};

  // 重建父子索引
  currentChildrenMap.clear();
  currentParentMap.clear();
  ds.edges.forEach(e => {
    if (!currentChildrenMap.has(e.source)) currentChildrenMap.set(e.source, []);
    currentChildrenMap.get(e.source).push(e.target);
    currentParentMap.set(e.target, e.source);
  });

  // 重置状态：只显示中心 + L1
  const centerId = ds.centerId;
  const l1NodeIds = ds.nodes.filter(n => n.level === 1).map(n => n.id);
  const initialEdgeIds = ds.edges
    .filter(e => e.source === centerId && l1NodeIds.includes(e.target))
    .map(e => e.id);

  state.visibleNodeIds = new Set([centerId, ...l1NodeIds]);
  state.visibleEdgeIds = new Set(initialEdgeIds);
  state.expandedBranches = new Set();
  state.stepFocusNode = null;
  state.nodeSteps = new Map();
  state.sidebarOpen = false;

  // 预置坐标
  currentNodeMap.forEach(node => {
    node.x = undefined; node.y = undefined;
    node.fx = undefined; node.fy = undefined;
  });

  // 中心节点固定在屏幕中央
  const ctr = currentNodeMap.get(centerId);
  if (ctr) {
    ctr.x = CX; ctr.y = CY;
    ctr.fx = CX; ctr.fy = CY;
  }

  // L1 节点初始位置
  const radius = Math.min(W, H) * 0.32;
  l1NodeIds.forEach((id, i) => {
    const node = currentNodeMap.get(id);
    if (!node) return;
    const angle = (2 * Math.PI * i) / l1NodeIds.length - Math.PI / 2;
    node.x = CX + radius * Math.cos(angle);
    node.y = CY + radius * Math.sin(angle);
  });

  // 关闭侧边栏
  closeSidebar();

  // 更新动态引用
  nodeMap = currentNodeMap;
  edgeMap = currentEdgeMap;
  childrenMap = currentChildrenMap;
  parentMap = currentParentMap;
  LEAF_DETAILS = currentLeafDetails;
}

// 动态引用（每次 loadDataset 后指向当前数据集）
let nodeMap, edgeMap, childrenMap, parentMap, LEAF_DETAILS;

// ============================================================
// 3. D3 初始化
// ============================================================
const container = document.getElementById('graph-container');
const W = container.clientWidth;
const H = container.clientHeight;
const CX = W / 2;
const CY = H / 2;

const svg = d3.select('#graph-svg')
  .attr('viewBox', `0 0 ${W} ${H}`)
  .attr('width', W)
  .attr('height', H);

// SVG 滤镜定义
const defs = svg.append('defs');

// 强辉光（中心节点）
const glowStrong = defs.append('filter').attr('id', 'glow-strong')

glowStrong.append('feGaussianBlur').attr('stdDeviation', '5').attr('result', 'blur');
glowStrong.append('feMerge')
  .selectAll('feMergeNode').data(['blur', 'blur', 'SourceGraphic'])
  .join('feMergeNode').attr('in', d => d);

// 中等辉光（枝干节点）
const glowMod = defs.append('filter').attr('id', 'glow-moderate')
  .attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
glowMod.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
glowMod.append('feMerge')
  .selectAll('feMergeNode').data(['blur', 'SourceGraphic'])
  .join('feMergeNode').attr('in', d => d);

// 微辉光（叶子节点）
const glowSub = defs.append('filter').attr('id', 'glow-subtle')
  .attr('x', '-40%').attr('y', '-40%').attr('width', '180%').attr('height', '180%');
glowSub.append('feGaussianBlur').attr('stdDeviation', '1.5').attr('result', 'blur');
glowSub.append('feMerge')
  .selectAll('feMergeNode').data(['blur', 'SourceGraphic'])
  .join('feMergeNode').attr('in', d => d);

// 径向渐变（中心恒星）
const centerGrad = defs.append('radialGradient')
  .attr('id', 'center-grad')
  .attr('cx', '50%').attr('cy', '50%').attr('r', '50%');
centerGrad.append('stop').attr('offset', '0%').attr('stop-color', '#fffbe0');
centerGrad.append('stop').attr('offset', '40%').attr('stop-color', '#ffd740');
centerGrad.append('stop').attr('offset', '100%').attr('stop-color', '#ff8f00');

// 分组（zoom 容器包裹所有图谱元素）
const zoomContainer = svg.append('g').attr('class', 'zoom-container');
const linkGroup = zoomContainer.append('g').attr('id', 'link-group');
const linkLabelGroup = zoomContainer.append('g').attr('id', 'link-label-group');
const nodeGroup = zoomContainer.append('g').attr('id', 'node-group');

// ============================================================
// 4. 缩放行为
// ============================================================
let currentZoom = d3.zoomIdentity.scale(1.2);  // 初始放大 1.2x
let wasDragging = false;

const zoomBehavior = d3.zoom()
  .scaleExtent([0.3, 4])
  .on('start', () => { wasDragging = false; })
  .on('zoom', (event) => {
    currentZoom = event.transform;
    zoomContainer.attr('transform', event.transform);
    if (event.sourceEvent && event.sourceEvent.type === 'mousemove') {
      wasDragging = true;
    }
  })
  .on('end', () => {
    // 延迟重置拖拽标记，让 click 事件有时间读取
    setTimeout(() => { wasDragging = false; }, 0);
  });

svg.call(zoomBehavior);
// 应用初始缩放
svg.call(zoomBehavior.transform, currentZoom);

// 缩放按钮
document.getElementById('zoom-in').addEventListener('click', () => {
  svg.transition().duration(300).call(zoomBehavior.scaleBy, 1.4);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  svg.transition().duration(300).call(zoomBehavior.scaleBy, 0.7);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  svg.transition().duration(400).call(zoomBehavior.transform, d3.zoomIdentity.scale(1.2));
});

// ============================================================
// 5. 力导向模拟
// ============================================================
let simulation = d3.forceSimulation()
  .force('link', d3.forceLink().id(d => d.id).distance(170))
  .force('charge', d3.forceManyBody().strength(-550))
  .force('center', d3.forceCenter(CX, CY))
  .force('collision', d3.forceCollide().radius(d => getNodeRadius(d) + 22))
  .alphaDecay(0.02)
  .on('tick', ticked);

function ticked() {
  linkGroup.selectAll('line.edge-line')
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);

  linkLabelGroup.selectAll('text.edge-label')
    .attr('x', d => (d.source.x + d.target.x) / 2)
    .attr('y', d => (d.source.y + d.target.y) / 2);

  nodeGroup.selectAll('g.node')
    .attr('transform', d => `translate(${d.x},${d.y})`);
}

// ============================================================
// 6. 辅助函数
// ============================================================
function getNodeRadius(d) {
  switch (d.type) {
    case 'center': return 30;
    case 'branch': return d.level === 1 ? 18 : 14;
    case 'leaf': return 10;
    default: return 10;
  }
}

function getNodeColor(d) {
  switch (d.type) {
    case 'center': return 'url(#center-grad)';
    case 'branch':
      return d.level === 1 ? '#00e5ff' : '#64b5f6';
    case 'leaf': return '#cec0f0';
    default: return '#90a0c0';
  }
}

function getVisibleNodes() {
  return Array.from(state.visibleNodeIds).map(id => ({ ...nodeMap.get(id) }));
}

function getVisibleEdges() {
  return Array.from(state.visibleEdgeIds).map(id => {
    const e = edgeMap.get(id);
    return { ...e };
  });
}

// ============================================================
// 7. 核心渲染
// ============================================================
function renderGraph() {
  const nodesData = getVisibleNodes();
  const edgesData = getVisibleEdges();

  // --- 连线 ---
  const linkSel = linkGroup.selectAll('line.edge-line')
    .data(edgesData, d => d.id);

  linkSel.exit().remove();

  const linkEnter = linkSel.enter().append('line')
    .attr('class', 'edge-line')
    .attr('stroke', 'rgba(100,180,240,0.35)')
    .attr('stroke-width', 1.5)
    .style('opacity', 0);

  linkEnter.transition().duration(600).style('opacity', 1);

  // --- 连线标签 ---
  const linkLabelSel = linkLabelGroup.selectAll('text.edge-label')
    .data(edgesData, d => d.id);

  linkLabelSel.exit().remove();

  const linkLabelEnter = linkLabelSel.enter().append('text')
    .attr('class', 'edge-label')
    .text(d => d.label)
    .style('opacity', 0);

  linkLabelEnter.transition().duration(600).style('opacity', 1);

  // --- 节点 ---
  const nodeSel = nodeGroup.selectAll('g.node')
    .data(nodesData, d => d.id);

  // Exit
  nodeSel.exit().remove();

  // Enter
  const nodeEnter = nodeSel.enter().append('g')
    .attr('class', 'node')
    .style('cursor', d => d.type === 'center' ? 'default' : 'pointer')
    .style('opacity', 0)
    .on('click', handleNodeClick);

  nodeEnter.append('circle')
    .attr('class', d => `node-circle node-${d.type}`)
    .attr('r', d => getNodeRadius(d))
    .attr('fill', d => getNodeColor(d));

  nodeEnter.append('text')
    .attr('class', d => `node-label${d.type === 'center' ? ' center-label' : ''}`)
    .attr('dy', d => getNodeRadius(d) + 16)
    .text(d => d.label);

  nodeEnter.transition().duration(500)
    .style('opacity', 1);

  // 更新 simulation
  simulation.nodes(nodesData);
  simulation.force('link').links(edgesData);
  simulation.alpha(0.4).restart();

  // 修复中心节点
  const centerId = DATASETS[currentDatasetKey].centerId;
  const centerNode = nodesData.find(n => n.id === centerId);
  if (centerNode) {
    centerNode.fx = CX;
    centerNode.fy = CY;
  }

  // 更新 focus 视觉效果
  applyStepFocusVisuals();
}

// ============================================================
// 8. 交互：节点点击
// ============================================================
function handleNodeClick(event, d) {
  event.stopPropagation();

  // 中心节点：重置所有
  const centerId = DATASETS[currentDatasetKey].centerId;
  if (d.id === centerId) {
    exitStepFocus();
    return;
  }

  // 枝干节点：展开子节点（如果尚未展开）
  if (d.type === 'branch' && !state.expandedBranches.has(d.id)) {
    expandBranch(d.id);
  }

  // 叶子节点：打开侧边栏
  if (d.type === 'leaf') {
    openSidebar(d.id);
  }

  // 点击任意节点：应用步长虚化聚焦
  enterStepFocus(d.id);
}

// ============================================================
// 9. 交互：渐进式展开
// ============================================================
function expandBranch(branchId) {
  state.expandedBranches.add(branchId);

  const childIds = childrenMap.get(branchId) || [];
  if (childIds.length === 0) return;

  // 获取父节点的当前位置
  const parentNode = simulation.nodes().find(n => n.id === branchId);
  const px = parentNode ? parentNode.x : CX;
  const py = parentNode ? parentNode.y : CY;

  // 子节点初始位置：父节点周围随机散布
  childIds.forEach((cid, i) => {
    state.visibleNodeIds.add(cid);
    const childData = nodeMap.get(cid);
    // 预设初始坐标：父节点周围环形散布
    const angle = (2 * Math.PI * i) / childIds.length - Math.PI / 2;
    const dist = 50 + Math.random() * 30;
    childData.x = px + dist * Math.cos(angle);
    childData.y = py + dist * Math.sin(angle);
  });

  // 添加对应边
  const newEdges = Array.from(edgeMap.values()).filter(e => e.source === branchId && childIds.includes(e.target));
  newEdges.forEach(e => state.visibleEdgeIds.add(e.id));

  renderGraph();
}

// ============================================================
// 10. 交互：侧边栏（知识降维）
// ============================================================
function openSidebar(nodeId) {
  const node = nodeMap.get(nodeId);
  const details = LEAF_DETAILS[nodeId] || {
    summary: '暂无详细解释。',
    metaphor: '这个知识点如同一颗未命名的星星，等待你来点亮。'
  };

  document.getElementById('sidebar-title').textContent = node.label;
  document.getElementById('sidebar-type').textContent = '知识卡片 · 叶子节点';
  document.getElementById('sidebar-summary').textContent = details.summary;
  document.getElementById('sidebar-metaphor').textContent = details.metaphor;

  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('active');
  state.sidebarOpen = true;
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('active');
  state.sidebarOpen = false;
}

document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);

// ESC 关闭
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    // 优先关闭弹窗
    const modalOverlay = document.getElementById('search-modal-overlay');
    if (modalOverlay.classList.contains('active')) {
      closeSearchModal();
      return;
    }
    if (state.sidebarOpen) closeSidebar();
    else if (state.stepFocusNode) exitStepFocus();
  }
});

// ============================================================
// 10. 交互：步长虚化聚焦
// ============================================================
function buildAdjacency() {
  const adj = new Map();
  edgeMap.forEach(edge => {
    if (!state.visibleEdgeIds.has(edge.id)) return;
    if (!adj.has(edge.source)) adj.set(edge.source, []);
    if (!adj.has(edge.target)) adj.set(edge.target, []);
    adj.get(edge.source).push(edge.target);
    adj.get(edge.target).push(edge.source);
  });
  return adj;
}

function calculateSteps(nodeId) {
  const adj = buildAdjacency();
  const distances = new Map();
  const queue = [nodeId];
  distances.set(nodeId, 0);
  let head = 0;

  while (head < queue.length) {
    const current = queue[head++];
    const curDist = distances.get(current);
    const neighbors = adj.get(current) || [];
    for (const nb of neighbors) {
      if (!distances.has(nb)) {
        distances.set(nb, curDist + 1);
        queue.push(nb);
      }
    }
  }

  return distances;
}

function enterStepFocus(nodeId) {
  state.stepFocusNode = nodeId;
  const steps = calculateSteps(nodeId);
  state.nodeSteps = steps;
  applyStepFocusVisuals();

  const node = nodeMap.get(nodeId);
  const indicator = document.getElementById('focus-indicator');
  indicator.textContent = `✦ 节点聚焦 · ${node ? node.label : ''} · 步长 1 可见 · 步长 2 虚化 · ≥3 隐藏`;
  indicator.classList.add('visible');
  setTimeout(() => indicator.classList.remove('visible'), 3500);
}

function exitStepFocus() {
  state.stepFocusNode = null;
  state.nodeSteps = new Map();
  applyStepFocusVisuals();
  document.getElementById('focus-indicator').classList.remove('visible');
}

function applyStepFocusVisuals() {
  const inStepFocus = state.stepFocusNode !== null;

  // 节点
  nodeGroup.selectAll('g.node').each(function (d) {
    const el = d3.select(this);
    if (!inStepFocus) {
      el.select('circle').classed('step-hidden step-dimmed step-glow', false);
      el.select('text').classed('step-hidden step-dimmed', false);
      el.style('pointer-events', 'all');
    } else {
      const dist = state.nodeSteps.get(d.id);
      if (dist === undefined) {
        // 节点不在当前可见图中
        el.style('pointer-events', 'none');
        return;
      }
      if (dist === 0) {
        el.select('circle').classed('step-hidden step-dimmed', false).classed('step-glow', true);
        el.select('text').classed('step-hidden step-dimmed', false);
        el.style('pointer-events', 'all');
      } else if (dist === 1) {
        el.select('circle').classed('step-hidden step-dimmed step-glow', false);
        el.select('text').classed('step-hidden step-dimmed', false);
        el.style('pointer-events', 'all');
      } else if (dist === 2) {
        el.select('circle').classed('step-hidden', false).classed('step-dimmed', true).classed('step-glow', false);
        el.select('text').classed('step-hidden', false).classed('step-dimmed', true);
        el.style('pointer-events', 'none');
      } else { // dist >= 3
        el.select('circle').classed('step-hidden', true).classed('step-dimmed', false).classed('step-glow', false);
        el.select('text').classed('step-hidden', true).classed('step-dimmed', false);
        el.style('pointer-events', 'none');
      }
    }
  });

  // 连线
  linkGroup.selectAll('line.edge-line').each(function (d) {
    const el = d3.select(this);
    if (!inStepFocus) {
      el.classed('step-hidden step-dimmed highlighted-edge', false);
    } else {
      const srcDist = state.nodeSteps.get(d.source.id || d.source);
      const tgtDist = state.nodeSteps.get(d.target.id || d.target);
      if (srcDist === undefined || tgtDist === undefined) return;
      const maxDist = Math.max(srcDist, tgtDist);
      if (maxDist <= 1) {
        el.classed('highlighted-edge', true).classed('step-hidden step-dimmed', false);
      } else if (maxDist === 2) {
        el.classed('highlighted-edge', false).classed('step-hidden', false).classed('step-dimmed', true);
      } else {
        el.classed('highlighted-edge', false).classed('step-hidden', true).classed('step-dimmed', false);
      }
    }
  });

  // 连线标签
  linkLabelGroup.selectAll('text.edge-label').each(function (d) {
    const el = d3.select(this);
    if (!inStepFocus) {
      el.classed('step-hidden step-dimmed highlighted-label', false);
    } else {
      const srcDist = state.nodeSteps.get(d.source.id || d.source);
      const tgtDist = state.nodeSteps.get(d.target.id || d.target);
      if (srcDist === undefined || tgtDist === undefined) return;
      const maxDist = Math.max(srcDist, tgtDist);
      if (maxDist <= 1) {
        el.classed('highlighted-label', true).classed('step-hidden step-dimmed', false);
      } else if (maxDist === 2) {
        el.classed('highlighted-label', false).classed('step-hidden', false).classed('step-dimmed', true);
      } else {
        el.classed('highlighted-label', false).classed('step-hidden', true).classed('step-dimmed', false);
      }
    }
  });
}

// 点击空白处退出步长聚焦（排除拖拽）
svg.on('click', () => {
  if (wasDragging) return;
  if (state.stepFocusNode) exitStepFocus();
});

// ============================================================
// 12. 背景星场
// ============================================================
(function initStarfield() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const stars = [];
  const STAR_COUNT = 300;
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.3,
      opacity: Math.random() * 0.6 + 0.1,
      twinkleSpeed: Math.random() * 0.02 + 0.005,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }

  function drawStars(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      const alpha = s.opacity + Math.sin(time * s.twinkleSpeed + s.twinkleOffset) * 0.25;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,200,255,${Math.max(0.05, alpha)})`;
      ctx.fill();
    });
    requestAnimationFrame(drawStars);
  }
  requestAnimationFrame(drawStars);

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars.forEach(s => {
      s.x = Math.random() * canvas.width;
      s.y = Math.random() * canvas.height;
    });
  });
})();

// ============================================================
// 13. 窗口大小自适应
// ============================================================
window.addEventListener('resize', () => {
  const newW = container.clientWidth;
  const newH = container.clientHeight;
  svg.attr('viewBox', `0 0 ${newW} ${newH}`)
     .attr('width', newW)
     .attr('height', newH);

  const centerId2 = DATASETS[currentDatasetKey].centerId;
  const centerNode = simulation.nodes().find(n => n.id === centerId2);
  if (centerNode) {
    centerNode.fx = newW / 2;
    centerNode.fy = newH / 2;
  }
  simulation.force('center', d3.forceCenter(newW / 2, newH / 2));
  simulation.alpha(0.1).restart();
});

// ============================================================
// 14. 白光射入动画
// ============================================================
function triggerFlash(callback) {
  const flash = document.getElementById('white-flash');
  // 第一阶段：快速展开
  flash.style.transition = 'width 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), height 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0s';
  flash.style.opacity = '0.7';
  flash.classList.add('flash');

  // 第二阶段：淡出
  setTimeout(() => {
    flash.style.transition = 'opacity 0.6s ease';
    flash.style.opacity = '0';
  }, 200);

  // 执行回调（在闪光最亮时切换数据）
  if (callback) setTimeout(callback, 150);
}

// ============================================================
// 15. 搜索弹窗交互
// ============================================================
const INPUT_KEY_MAP = {
  '大语言模型': 'llm',
  'Transformer': 'transformer'
};

const searchModal = document.getElementById('search-modal-overlay');
const modalInput = document.getElementById('modal-search-input');
const headerInput = document.getElementById('search-input');

function syncInputs(value, key) {
  headerInput.value = value;
  modalInput.value = value;
  // 同步芯片高亮
  document.querySelectorAll('#search-modal-card .modal-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.key === key);
  });
  // 同步历史抽屉高亮
  document.querySelectorAll('#history-drawer .history-item').forEach(item => {
    item.classList.toggle('active', item.dataset.key === key);
  });
}

function openSearchModal() {
  // 同步当前值到弹窗
  modalInput.value = headerInput.value;
  const currentKey = INPUT_KEY_MAP[headerInput.value.trim()] || 'llm';
  document.querySelectorAll('#search-modal-card .modal-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.key === currentKey);
  });
  searchModal.classList.add('active');
  setTimeout(() => modalInput.focus(), 100);
}

function closeSearchModal() {
  searchModal.classList.remove('active');
}

// 点击 header 输入框 → 打开弹窗
headerInput.addEventListener('click', openSearchModal);

// 点击弹窗遮罩 → 关闭
searchModal.addEventListener('click', (e) => {
  if (e.target === searchModal) closeSearchModal();
});

// 弹窗内芯片点击 → 填入输入框
document.querySelectorAll('#search-modal-card .modal-chip').forEach(chip => {
  chip.addEventListener('click', (e) => {
    e.stopPropagation();
    const key = chip.dataset.key;
    const ds = DATASETS[key];
    if (!ds) return;
    syncInputs(ds.centerLabel, key);
  });
});

// 弹窗内“重组”按钮
document.getElementById('modal-regenerate-btn').addEventListener('click', () => {
  const inputVal = modalInput.value.trim();
  const key = INPUT_KEY_MAP[inputVal];
  if (!key || !DATASETS[key]) return;

  closeSearchModal();
  triggerFlash(() => {
    simulation.stop();
    linkGroup.selectAll('*').remove();
    linkLabelGroup.selectAll('*').remove();
    nodeGroup.selectAll('*').remove();

    currentDatasetKey = key;
    loadDataset(key);
    renderGraph();
    syncInputs(DATASETS[key].centerLabel, key);

    document.getElementById('focus-indicator').textContent =
      `✦ 步长聚焦 · ${DATASETS[key].centerLabel} · 点击任意节点开始探索`;
  });
});

  const inputVal = headerInput.value.trim();
  const key = INPUT_KEY_MAP[inputVal];

  triggerFlash(() => {
    simulation.stop();
    linkGroup.selectAll('*').remove();
    linkLabelGroup.selectAll('*').remove();
    nodeGroup.selectAll('*').remove();

    currentDatasetKey = key;
    loadDataset(key);
    renderGraph();
    syncInputs(DATASETS[key].centerLabel, key);

    document.getElementById('focus-indicator').textContent =
      `✦ 步长聚焦 · ${DATASETS[key].centerLabel} · 点击任意节点开始探索`;
  });
});
