<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>答辩精简器</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #6c757d;
      --accent: #4a6fa5;
      --accent-light: #e6f0ff;
      --border: #e9ecef;
      --success: #28a745;
      --warning: #ffc107;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #1a1d25;
      --bg-card: #252a35;
      --text-primary: #f1f3f5;
      --text-secondary: #a9b7c6;
      --accent: #5d8aa8;
      --accent-light: #2a3d56;
      --border: #3a4252;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 20px;
      transition: var(--transition);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-light);
      border: none;
      color: var(--accent);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: var(--transition);
      z-index: 10;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      background: var(--accent);
      color: white;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 24px;
      transition: var(--transition);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text-primary);
      resize: vertical;
      transition: var(--transition);
      font-family: inherit;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.15);
    }

    .control-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 16px 0;
    }

    .time-option {
      padding: 10px 16px;
      background: var(--accent-light);
      color: var(--accent);
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
    }

    .time-option.active {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 6px rgba(74, 111, 165, 0.3);
    }

    .time-option:hover:not(.active) {
      background: #d0e1ff;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--accent-light);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .progress-container {
      flex: 1;
      height: 6px;
      background: #e0e7ff;
      border-radius: 3px;
      overflow: hidden;
      margin: 0 8px;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: var(--transition);
      box-shadow: 0 2px 8px rgba(74, 111, 165, 0.2);
    }

    .btn:hover:not(:disabled) {
      background: #3a5a8c;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(74, 111, 165, 0.3);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-section {
      display: none;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .highlight-toggle {
      padding: 6px 12px;
      background: var(--accent-light);
      color: var(--accent);
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .highlight-toggle:hover:not(.active) {
      background: #d0e1ff;
    }

    .highlight-toggle.active {
      background: var(--accent);
      color: white;
    }

    .result-content {
      line-height: 1.7;
      word-break: break-word;
    }

    .highlight {
      background: linear-gradient(120deg, rgba(93, 138, 168, 0.3) 0%, rgba(93, 138, 168, 0.1) 100%);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      display: inline;
    }

    .tip {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      .container {
        padding: 0;
      }
      h1 {
        font-size: 1.5rem;
      }
      .card {
        padding: 20px;
      }
      .control-group {
        flex-direction: column;
      }
      .time-option {
        width: 100%;
        text-align: center;
      }
      .stats-bar {
        flex-direction: column;
        align-items: flex-start;
      }
      .progress-container {
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .theme-toggle {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
      textarea {
        min-height: 140px;
      }
      .btn {
        padding: 12px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" aria-label="切换主题">☀️</button>

  <div class="container">
    <header>
      <h1>答辩精简器</h1>
      <p class="subtitle">粘贴你的答辩稿 → 选择目标时长 → 获取口语化精简稿 + 重点句高亮</p>
    </header>

    <main>
      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/><path d="M14 7.5V3l-5 5h3.5z"/></svg>
          1. 粘贴你的答辩稿
        </h2>
        <textarea id="inputArea" placeholder="请粘贴你的答辩原文（例如：本研究聚焦于……）"></textarea>
        <div class="stats-bar">
          <span id="wordCount">0 字</span>
          <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 0%"></div>
          </div>
          <span id="timeEstimate">约 0 分钟</span>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
          2. 选择目标时长
        </h2>
        <div class="control-group">
          <button class="time-option active" data-minutes="2">2 分钟</button>
          <button class="time-option" data-minutes="3">3 分钟</button>
          <button class="time-option" data-minutes="5">5 分钟</button>
        </div>
        <button class="btn" id="generateBtn">生成精简稿</button>
      </section>

      <section class="card result-section" id="resultSection">
        <h2 class="card-title">
          <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          3. 精简稿预览（已高亮核心句）
        </h2>
        <div class="result-header">
          <div>共 <span id="resultWordCount">0</span> 字 · 约 <span id="resultTime">0</span> 分钟</div>
          <button class="highlight-toggle active" id="toggleHighlight">显示重点句</button>
        </div>
        <div class="result-content" id="resultContent">
          <!-- 生成内容将插入此处 -->
        </div>
        <p class="tip">💡 小提示：点击任意段落，可查看该段重点句高亮效果 —— 模拟答辩时评委最关注的核心信息点</p>
      </section>
    </main>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('themeToggle');
    const body = document.body;
    const isDark = localStorage.getItem('darkTheme') === 'true';
    if (isDark) {
      body.classList.add('dark-theme');
      themeToggle.innerHTML = '🌙';
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      const isNowDark = body.classList.contains('dark-theme');
      localStorage.setItem('darkTheme', isNowDark);
      themeToggle.innerHTML = isNowDark ? '🌙' : '☀️';
    });

    // 字数与时长统计
    const inputArea = document.getElementById('inputArea');
    const wordCountEl = document.getElementById('wordCount');
    const timeEstimateEl = document.getElementById('timeEstimate');
    const progressBar = document.getElementById('progressBar');

    function updateStats() {
      const text = inputArea.value.trim();
      const words = text.length;
      wordCountEl.textContent = `${words} 字`;

      // 口语语速按180字/分钟估算
      const minutes = words / 180;
      timeEstimateEl.textContent = `约 ${minutes.toFixed(1)} 分钟`;

      // 进度条：按3分钟目标（540字）计算占比，上限100%
      const target = 540;
      const percent = Math.min(100, (words / target) * 100);
      progressBar.style.width = `${percent}%`;
    }

    inputArea.addEventListener('input', updateStats);

    // 时长选项切换
    const timeOptions = document.querySelectorAll('.time-option');
    let selectedMinutes = 3;

    timeOptions.forEach(option => {
      option.addEventListener('click', () => {
        timeOptions.forEach(o => o.classList.remove('active'));
        option.classList.add('active');
        selectedMinutes = parseInt(option.dataset.minutes);
      });
    });

    // 生成精简稿（简易模拟）
    const generateBtn = document.getElementById('generateBtn');
    const resultSection = document.getElementById('resultSection');
    const resultContent = document.getElementById('resultContent');
    const resultWordCount = document.getElementById('resultWordCount');
    const resultTime = document.getElementById('resultTime');
    const toggleHighlight = document.getElementById('toggleHighlight');

    // 简易模拟AI精简逻辑（基于规则 + 随机截断 + 关键句识别）
    function simulateSimplify(text, targetMinutes) {
      if (!text.trim()) return '';

      const targetWords = Math.round(targetMinutes * 180 * 0.85); // 保留85%容错率
      const sentences = text.split(/(?<=[。！？])\s*/).filter(s => s.trim());
      let result = [];
      let currentLength = 0;

      // 优先保留含动词+名词的短句（简易核心句识别）
      const coreSentences = [];
      const otherSentences = [];

      sentences.forEach(s => {
        const trimmed = s.trim();
        if (!trimmed) return;
        // 简单启发式：含“分析/提出/验证/构建/实现/表明/证明/发现”且有明确名词（非“方面”“问题”等泛词）
        const hasCoreVerb = /(分析|提出|验证|构建|实现|表明|证明|发现|设计|开发|评估)/.test(trimmed);
        const hasKeyNoun = /(模型|算法|系统|方法|框架|机制|策略|实验|数据|结果|性能|效果)/.test(trimmed);
        if (hasCoreVerb && hasKeyNoun && trimmed.length < 50) {
          coreSentences.push(trimmed);
        } else {
          otherSentences.push(trimmed);
        }
      });

      // 先塞核心句
      for (let s of coreSentences) {
        if (currentLength + s.length <= targetWords) {
          result.push(s);
          currentLength += s.length;
        }
      }

      // 再补其他句（随机顺序，避免首尾依赖）
      const shuffledOthers = [...otherSentences].sort(() => Math.random() - 0.5);
      for (let s of shuffledOthers) {
        if (currentLength + s.length <= targetWords) {
          result.push(s);
          currentLength += s.length;
        }
      }

      // 若仍不足，补充开头/结尾句
      if (result.length === 0 && sentences.length > 0) {
        result = [sentences[0]];
      }

      return result.join(' ');
    }

    // 高亮核心句（复用上面的规则）
    function highlightCoreSentences(text) {
      if (!text) return text;
      const sentences = text.split(/(?<=[。！？])\s*/);
      return sentences.map(s => {
        const trimmed = s.trim();
        if (!trimmed) return s;
        const hasCoreVerb = /(分析|提出|验证|构建|实现|表明|证明|发现|设计|开发|评估)/.test(trimmed);
        const hasKeyNoun = /(模型|算法|系统|方法|框架|机制|策略|实验|数据|结果|性能|效果)/.test(trimmed);
        if (hasCoreVerb && hasKeyNoun && trimmed.length < 50) {
          return `<span class="highlight">${trimmed}</span>`;
        }
        return trimmed;
      }).join(' ');
    }

    generateBtn.addEventListener('click', () => {
      const rawText = inputArea.value.trim();
      if (!rawText) {
        alert('请先粘贴答辩稿');
        return;
      }

      const simplified = simulateSimplify(rawText, selectedMinutes);
      const highlighted = highlightCoreSentences(simplified);

      resultContent.innerHTML = simplified.split(/(?<=[。！？])\s*/).map((s, i) => 
        `<p>${i + 1}. ${s.trim()}</p>`
      ).join('');

      // 初始加载时即高亮
      setTimeout(() => {
        const paras = resultContent.querySelectorAll('p');
        paras.forEach(p => {
          p.addEventListener('click', function() {
            const text = this.textContent.trim().replace(/^\d+\.\s*/, '');
            const highlightedText = highlightCoreSentences(text);
            this.innerHTML = `<strong>${this.textContent.match(/^\d+\.\s*/)[0]}</strong>${highlightedText}`;
          });
        });
      }, 10);

      resultWordCount.textContent = simplified.length;
      resultTime.textContent = (simplified.length / 180).toFixed(1);

      resultSection.style.display = 'block';
      resultSection.scrollIntoView({ behavior: 'smooth' });
    });

    // 高亮开关（仅控制初始显示状态）
    let isHighlighting = true;
    toggleHighlight.addEventListener('click', () => {
      isHighlighting = !isHighlighting;
      toggleHighlight.classList.toggle('active');
      if (isHighlighting) {
        // 重新渲染高亮版
        const raw = resultContent.innerHTML;
        const paras = Array.from(resultContent.querySelectorAll('p'));
        paras.forEach(p => {
          const text = p.textContent.trim().replace(/^\d+\.\s*/, '');
          const highlightedText = highlightCoreSentences(text);
          p.innerHTML = `<strong>${p.textContent.match(/^\d+\.\s*/)[0]}</strong>${highlightedText}`;
        });
      } else {
        // 还原纯文本
        const paras = Array.from(resultContent.querySelectorAll('p'));
        paras.forEach(p => {
          const text = p.textContent.replace(/^\d+\.\s*/, '').trim();
          p.innerHTML = `<strong>${p.textContent.match(/^\d+\.\s*/)[0]}</strong>${text}`;
        });
      }
    });

    // 初始化统计
    updateStats();
  </script>
</body>
</html>
