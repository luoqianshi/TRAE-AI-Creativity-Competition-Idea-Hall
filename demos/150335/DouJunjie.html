-of-heaven",name:"天坛公园",nameEn:"Temple of Heaven",position:[116.4074,39.8822],type:"culture",description:"明清两代皇帝祭天祀谷的场所",duration:"2小时"}],afternoon:[{id:"summer-palace",name:"颐和园",nameEn:"Summer Palace",position:[116.2755,39.9999],type:"nature",description:"中国古典园林之首",duration:"3-4小时"}],evening:[]}],C5=[{id:"kb-001",category:"history",title:"故宫建筑美学：散发型与聚焦型的东方智慧",content:'故宫建筑群采用"散发型"美学布局，与西方凡尔赛宫的"聚焦型"美学形成鲜明对比。这种布局体现了中国传统哲学中"天人合一"的思想，建筑群体围绕中轴线对称分布，但每个院落又保持相对独立的审美空间。',tags:["故宫","建筑","美学","中西方对比","文化翻译"],relatedAttractions:["forbidden-city"]},{id:"kb-002",category:"culture",title:"中国茶文化：片刻的宁静与自我对话",content:'中国茶不仅是一种饮品，更是一种生活哲学。品茶的过程象征着在繁忙生活中寻找"片刻的宁静与自我对话"。茶道中的"和、敬、清、寂"四字，体现了中国人对内心平静与人际和谐的追求。',tags:["茶","哲学","文化体验","非遗"],relatedAttractions:["tea-house","temple-of-heaven"]},{id:"kb-003",category:"practical",title:"北京入境游实用攻略：交通与票务",content:"北京首都国际机场到大兴国际机场均有直达市区的机场快轨。故宫、国博等热门景点需提前7天在官方平台预约。建议外国游客使用支付宝国际版或微信支付国际卡绑定功能。",tags:["交通","票务","实用信息","入境"],relatedAttractions:[]},{id:"kb-004",category:"attraction",title:"长城讲解框架：40%+40%+20%矩阵应用",content:"长城导游词创作遵循40%历史与建筑事实（秦始皇统一、明代重建、砖石结构）、40%人物故事与体验（孟姜女传说、古代士兵生活、攀登体验）、20%精神升华（中华民族坚韧不屈的象征、人类文明的奇迹）。",tags:["长城","导游词","40-40-20","讲解"],relatedAttractions:["great-wall"]},{id:"kb-005",category:"career",title:'导游"三硬四软"素质模型详解',content:'"三硬"指语言能力、知识储备、服务技能；"四软"指产业大局观、共情力、叙事能力、产品思维。初级导游年入20万的路径不是单纯提高报价，而是从第一纬度（带团服务）向第二纬度（内容创作与知识付费）跃迁。',tags:["三硬四软","职业发展","收入提升","能力模型"],relatedAttractions:[]},{id:"kb-006",category:"industry",title:"入境游三大赚钱机会：渠道、产品、人才",content:"当前入境游市场存在三大结构性机会：渠道端（MCN化与DOL化，即目的地意见领袖）、产品端（从观光游向沉浸式体验转型）、人才端（系统性培训体系替代经验传承）。导游DOL化概念由窦俊杰于2021年首次提出。",tags:["行业趋势","MCN","DOL","商业模式"],relatedAttractions:[]},{id:"kb-007",category:"culture",title:"京剧艺术：脸谱背后的性格哲学",content:'京剧脸谱色彩系统是中国传统性格符号学的集中体现。红色代表忠勇（关羽）、黑色代表刚直（包拯）、白色代表奸诈（曹操）。这种直观的视觉符号系统，为跨文化叙事提供了天然的"翻译"素材。',tags:["京剧","脸谱","非遗","文化翻译"],relatedAttractions:["houhai","lao-she-teahouse"]},{id:"kb-008",category:"practical",title:"北京中轴线：7.8公里的城市脊梁",content:"北京中轴线南起永定门，北至钟鼓楼，全长7.8公里，是世界现存最长的城市轴线。2024年成功列入《世界遗产名录》。沿线串联起正阳门、天安门、故宫、景山等核心景点，是理解北京城市格局的最佳线索。",tags:["中轴线","世界遗产","城市规划","讲解"],relatedAttractions:["tiananmen","forbidden-city","jingshan"]},{id:"kb-009",category:"career",title:'从"持证"到"成熟"：英文导游成长时间线',content:"一般而言，考取导游证后需1-2年完成基础带团技能积累，3-5年形成个人讲解风格，5年以上可向精讲导游或DOL转型。关键在于前三年是否建立了系统的知识框架而非碎片化信息积累。",tags:["职业规划","英文导游","成长路径","三硬四软"],relatedAttractions:[]},{id:"kb-010",category:"history",title:"天坛：数字中的宇宙观",content:'天坛建筑的数字设计蕴含中国古代宇宙观。圜丘坛三层台面，每层四面九级台阶，取"九"为至阳之数。祈年殿内柱12根象征十二月，外柱12根象征十二时辰，合计24根代表二十四节气。这种数字宇宙观是向西方游客讲解的绝佳切入点。',tags:["天坛","宇宙观","数字","讲解技巧"],relatedAttractions:["temple-of-heaven"]}],zp={zh:{consult:["故宫怎么预约？","北京三天怎么玩？","长城怎么去最方便？","推荐北京特色美食"],planning:["帮我规划3天行程","带老人游北京推荐","亲子游北京路线","北京深度文化游"],guide:["讲解一下故宫","天坛有什么故事？","长城的历史","四合院文化"],script:["生成故宫5分钟导游词","京剧主题英文导游词","茶文化讲解词","中轴线解说词"],career:["初级导游如何提升收入？","三硬四软具体指什么？","精讲导游与普通导游区别","如何成为DOL？"],industry:["入境游最新政策","旅行社MCN化怎么做？","2025入境游趋势","导游DOL化是什么？"]},en:{consult:["How to book Forbidden City?","Best 3-day itinerary","How to get to Great Wall?","Beijing food recommendations"],planning:["Plan a 3-day trip","Senior-friendly Beijing tour","Family trip to Beijing","Deep cultural experience"],guide:["Tell me about Forbidden City","Stories of Temple of Heaven","History of Great Wall","Hutong culture"],script:["5-min Forbidden City script","Peking Opera guide script","Tea culture script","Central Axis script"],career:["How to increase income?","What is 3-Hard 4-Soft?","Elite vs standard guide","How to become a DOL?"],industry:["Inbound tourism policy","MCN for travel agencies","2025 inbound trends","What is guide DOL?"]}},hh=()=>{const n=navigator.language.toLowerCase();return n.startsWith("zh")?"zh":n.startsWith("en")?"en":n.startsWith("ja")?"ja":n.startsWith("ko")?"ko":n.startsWith("fr")?"fr":n.startsWith("de")?"de":n.startsWith("es")?"es":n.startsWith("ru")?"ru":n.startsWith("ar")?"ar":"en"},pl=Date.now(),Fp={id:`session-${pl}`,title:"新对话",messages:[],currentSkill:"consult",ragStatus:"i
