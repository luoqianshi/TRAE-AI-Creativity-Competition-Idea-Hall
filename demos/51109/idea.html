<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智汇笔记 - 智能学习笔记整理工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #1a202c; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 2rem; text-align: center; }
        .header h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .header p { opacity: 0.9; font-size: 1.1rem; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .card-icon { font-size: 2rem; margin-bottom: 0.5rem; }
        .card h3 { color: #667eea; margin-bottom: 0.5rem; }
        .card p { color: #64748b; line-height: 1.6; }
        .preview { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .preview h2 { color: #1a202c; margin-bottom: 1rem; }
        .note-list { list-style: none; }
        .note-item { display: flex; align-items: center; padding: 1rem; border-bottom: 1px solid #e2e8f0; }
        .note-item:last-child { border-bottom: none; }
        .note-tag { background: #e0e7ff; color: #667eea; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; margin-right: 0.75rem; }
        .note-title { flex: 1; font-weight: 500; }
        .note-date { color: #94a3b8; font-size: 0.85rem; }
        .btn { display: inline-block; background: #667eea; color: #fff; padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 1rem; }
        .footer { text-align: center; padding: 2rem; color: #94a3b8; margin-top: 2rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>智汇笔记</h1>
        <p>AI驱动的智能学习笔记整理工具</p>
    </div>
    <div class="container">
        <div class="features">
            <div class="card">
                <div class="card-icon">📝</div>
                <h3>智能整理</h3>
                <p>自动识别笔记重点，生成结构化知识框架，告别杂乱无章的笔记。</p>
            </div>
            <div class="card">
                <div class="card-icon">🔗</div>
                <h3>知识关联</h3>
                <p>AI自动发现不同笔记之间的关联，构建个人知识图谱。</p>
            </div>
            <div class="card">
                <div class="card-icon">📊</div>
                <h3>复习规划</h3>
                <p>基于艾宾浩斯遗忘曲线，智能推荐最佳复习时间。</p>
            </div>
        </div>
        <div class="preview">
            <h2>我的笔记</h2>
            <ul class="note-list">
                <li class="note-item">
                    <span class="note-tag">数学</span>
                    <span class="note-title">微积分核心概念整理</span>
                    <span class="note-date">2024-01-15</span>
                </li>
                <li class="note-item">
                    <span class="note-tag">英语</span>
                    <span class="note-title">雅思写作高分句型汇总</span>
                    <span class="note-date">2024-01-14</span>
                </li>
                <li class="note-item">
                    <span class="note-tag">计算机</span>
                    <span class="note-title">操作系统内存管理笔记</span>
                    <span class="note-date">2024-01-13</span>
                </li>
            </ul>
            <button class="btn">+ 新建笔记</button>
        </div>
    </div>
    <div class="footer">
        <p>智汇笔记 &copy; 2024 | 让学习更高效</p>
    </div>
</body>
</html>
