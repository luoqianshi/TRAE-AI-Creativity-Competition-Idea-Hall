<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
<title>候鸟旅居通 - 退休旅居决策平台</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="header-inner">
      <div class="logo" onclick="navigate('home')">🏡 候鸟旅居通</div>
      <div class="header-right">
        <div class="search-box" onclick="navigate('search')">🔍 搜索目的地...</div>
      </div>
    </div>
  </header>

  <nav class="tab-bar">
    <button class="tab active" data-page="home">🏠 首页</button>
    <button class="tab" data-page="summer">🌿 避暑</button>
    <button class="tab" data-page="winter">☀️ 避寒</button>
    <button class="tab" data-page="houses">🏘️ 找房</button>
    <button class="tab" data-page="recommend">🤖 推荐</button>
    <button class="tab" data-page="guides">📖 攻略</button>
    <button class="tab" data-page="rural">🌾 农村</button>
  </nav>

  <main id="main-content">
    <div class="loading">加载中...</div>
  </main>
</div>

<div id="city-detail" class="page-overlay hidden" onclick="closeCityDetail(event)">
  <div class="detail-content" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeCityDetail()">✕</button>
    <div id="detail-body"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
