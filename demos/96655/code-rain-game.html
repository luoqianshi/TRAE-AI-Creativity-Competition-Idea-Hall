<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码雨打字挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        canvas#codeRain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
        }

        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .screen.active {
            display: flex;
        }

        .container {
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ff41;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3),
                        inset 0 0 30px rgba(0, 255, 65, 0.1);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41; }
            50% { text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41, 0 0 60px #00ff41; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes scorePop {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #00ffff;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            background: transparent;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 10px;
        }

        .btn:hover {
            background: #00ff41;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
            animation: pulse 0.5s ease;
        }

        .rules {
            text-align: left;
            margin: 20px 0;
            padding: 20px;
            background: rgba(0, 255, 65, 0.05);
            border-left: 3px solid #00ff41;
        }

        .rules li {
            margin: 10px 0;
            list-style: none;
            padding-left: 20px;
            position: relative;
        }

        .rules li::before {
            content: '>';
            position: absolute;
            left: 0;
            color: #00ff41;
        }

        /* Game UI */
        #gameScreen {
            flex-direction: column;
            justify-content: flex-start;
            padding: 20px;
        }

        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #00ff41;
            z-index: 20;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
        }

        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }

        .stat-value {
            color: #00ff41;
            font-weight: bold;
            font-size: 1.5rem;
        }

        .lives {
            display: flex;
            gap: 5px;
        }

        .heart {
            color: #ff4444;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .heart.lost {
            opacity: 0.2;
            transform: scale(0.8);
        }

        .game-area {
            flex: 1;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .falling-char {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41;
            transition: all 0.1s ease;
            user-select: none;
            pointer-events: none;
        }

        .falling-char.target {
            color: #ffd700;
            text-shadow: 0 0 15px #ffd700, 0 0 30px #ffd700;
            animation: pulse 0.5s ease infinite;
            font-size: 2.5rem;
        }

        .falling-char.hit {
            animation: scorePop 0.5s ease forwards;
            color: #00ffff;
        }

        .falling-char.missed {
            color: #ff4444;
            animation: glitch 0.3s ease;
        }

        .input-area {
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #00ff41;
            text-align: center;
            z-index: 20;
        }

        .target-char {
            font-size: 4rem;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            margin: 10px 0;
            animation: pulse 1s ease infinite;
        }

        .input-hint {
            color: #888;
            font-size: 1rem;
        }

        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: #00ffff;
            text-shadow: 0 0 30px #00ffff;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .combo-display.show {
            opacity: 1;
            animation: pulse 0.3s ease;
        }

        /* Game Over */
        .game-over-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid #00ff41;
            padding: 20px;
            border-radius: 5px;
        }

        .stat-card .value {
            font-size: 2.5rem;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        .stat-card .label {
            font-size: 0.9rem;
            color: #888;
            margin-top: 5px;
        }

        .new-record {
            color: #ff4444;
            font-size: 1.2rem;
            animation: pulse 0.5s ease infinite;
            margin: 10px 0;
        }

        /* Particles */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: particleFade 0.8s ease forwards;
        }

        @keyframes particleFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Level display */
        .level-indicator {
            position: fixed;
            top: 80px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff41;
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 20;
        }

        .level-text {
            color: #00ffff;
            font-size: 0.9rem;
        }

        .level-number {
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Mobile keyboard hint */
        .mobile-hint {
            display: none;
            color: #888;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .container { padding: 20px; }
            .falling-char { font-size: 1.5rem; }
            .falling-char.target { font-size: 2rem; }
            .target-char { font-size: 3rem; }
            .mobile-hint { display: block; }
        }
    </style>
</head>
<body>
    <canvas id="codeRain"></canvas>

    <!-- Combo Display -->
    <div class="combo-display" id="comboDisplay"></div>

    <!-- Start Screen -->
    <div class="screen active" id="startScreen">
        <div class="container">
            <h1>代码雨</h1>
            <h2>打字挑战</h2>
            <div class="rules">
                <ul>
                    <li>代码字符从天而降</li>
                    <li>在字符落地前输入对应按键</li>
                    <li>连续命中获得连击加成</li>
                    <li>字符落地将扣除生命值</li>
                    <li>挑战你的极限手速！</li>
                </ul>
            </div>
            <p class="subtitle">准备好了吗？按任意键或点击开始！</p>
            <button class="btn" onclick="startGame()">开始游戏</button>
            <p class="mobile-hint">提示：移动端请使用屏幕键盘</p>
        </div>
    </div>

    <!-- Game Screen -->
    <div class="screen" id="gameScreen">
        <div class="game-header">
            <div class="stat">
                <span class="stat-label">得分</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">连击</span>
                <span class="stat-value" id="combo">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">生命</span>
                <div class="lives" id="lives"></div>
            </div>
            <div class="stat">
                <span class="stat-label">时间</span>
                <span class="stat-value" id="time">0s</span>
            </div>
        </div>

        <div class="level-indicator">
            <div class="level-text">等级</div>
            <div class="level-number" id="level">1</div>
        </div>

        <div class="game-area" id="gameArea"></div>

        <div class="input-area">
            <div class="input-hint">按下对应按键消除字符</div>
            <div class="target-char" id="targetChar">等待字符...</div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div class="screen" id="gameOverScreen">
        <div class="container">
            <h1>游戏结束</h1>
            <div class="new-record" id="newRecord" style="display: none;">
                新纪录！
            </div>
            <div class="game-over-stats">
                <div class="stat-card">
                    <div class="value" id="finalScore">0</div>
                    <div class="label">最终得分</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="finalCombo">0</div>
                    <div class="label">最高连击</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="finalTime">0s</div>
                    <div class="label">存活时间</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="finalLevel">1</div>
                    <div class="label">达到等级</div>
                </div>
            </div>
            <button class="btn" onclick="restartGame()">再来一次</button>
            <button class="btn" onclick="backToStart()">返回主页</button>
        </div>
    </div>

    <script>
        // Game State
        const state = {
            status: 'idle',
            score: 0,
            lives: 5,
            combo: 0,
            maxCombo: 0,
            time: 0,
            level: 1,
            highScore: parseInt(localStorage.getItem('codeRainHighScore') || '0'),
            characters: [],
            lastSpawnTime: 0,
            spawnInterval: 2000,
            gameStartTime: 0,
            animationFrame: null,
            timeInterval: null
        };

        // Character pool
        const charPool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const codeSymbols = '{}[]()=+-*/<>!&|?:;.,@#$%^~`';

        // Canvas setup
        const canvas = document.getElementById('codeRain');
        const ctx = canvas.getContext('2d');
        let columns = [];
        let drops = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const fontSize = 16;
            const cols = Math.floor(canvas.width / fontSize);
            columns = new Array(cols).fill(0);
            drops = new Array(cols).fill(1);
        }

        // Code rain background animation
        function drawCodeRain() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff41';
            ctx.font = '16px Courier New';

            for (let i = 0; i < drops.length; i++) {
                const char = charPool[Math.floor(Math.random() * charPool.length)];
                ctx.fillText(char, i * 16, drops[i] * 16);

                if (drops[i] * 16 > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            requestAnimationFrame(drawCodeRain);
        }

        // Initialize
        initCanvas();
        drawCodeRain();
        window.addEventListener('resize', initCanvas);

        // DOM Elements
        const screens = {
            start: document.getElementById('startScreen'),
            game: document.getElementById('gameScreen'),
            gameOver: document.getElementById('gameOverScreen')
        };

        const elements = {
            score: document.getElementById('score'),
            combo: document.getElementById('combo'),
            lives: document.getElementById('lives'),
            time: document.getElementById('time'),
            level: document.getElementById('level'),
            targetChar: document.getElementById('targetChar'),
            gameArea: document.getElementById('gameArea'),
            comboDisplay: document.getElementById('comboDisplay'),
            finalScore: document.getElementById('finalScore'),
            finalCombo: document.getElementById('finalCombo'),
            finalTime: document.getElementById('finalTime'),
            finalLevel: document.getElementById('finalLevel'),
            newRecord: document.getElementById('newRecord')
        };

        // Screen management
        function showScreen(screenId) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenId].classList.add('active');
        }

        // Create falling character element
        function createFallingChar() {
            const gameArea = elements.gameArea;
            const char = charPool[Math.floor(Math.random() * charPool.length)];
            const el = document.createElement('div');
            el.className = 'falling-char';
            el.textContent = char;
            el.dataset.char = char;

            const maxX = gameArea.offsetWidth - 50;
            el.style.left = Math.random() * maxX + 'px';
            el.style.top = '-50px';

            gameArea.appendChild(el);

            const speed = 1 + (state.level * 0.2) + (Math.random() * 0.5);
            const charObj = {
                element: el,
                char: char,
                y: -50,
                speed: speed,
                active: true
            };

            state.characters.push(charObj);

            // Set first character as target if none exists
            if (!state.characters.find(c => c.element.classList.contains('target'))) {
                el.classList.add('target');
                elements.targetChar.textContent = char;
            }
        }

        // Update game state
        function updateGame() {
            if (state.status !== 'playing') return;

            const gameArea = elements.gameArea;
            const maxY = gameArea.offsetHeight;

            // Update character positions
            state.characters.forEach((charObj, index) => {
                if (!charObj.active) return;

                charObj.y += charObj.speed;
                charObj.element.style.top = charObj.y + 'px';

                // Character reached bottom
                if (charObj.y > maxY) {
                    charObj.active = false;
                    charObj.element.classList.add('missed');
                    setTimeout(() => charObj.element.remove(), 300);

                    // Only lose life if it was the target
                    if (charObj.element.classList.contains('target')) {
                        loseLife();
                    }

                    // Remove from array
                    state.characters.splice(index, 1);

                    // Set new target
                    setNextTarget();
                }
            });

            // Spawn new characters
            const now = Date.now();
            if (now - state.lastSpawnTime > state.spawnInterval) {
                createFallingChar();
                state.lastSpawnTime = now;
            }

            // Update level
            const newLevel = Math.floor(state.score / 500) + 1;
            if (newLevel > state.level) {
                state.level = newLevel;
                elements.level.textContent = state.level;
                state.spawnInterval = Math.max(800, 2000 - (state.level * 100));
                showComboMessage('升级！', '#00ffff');
            }

            state.animationFrame = requestAnimationFrame(updateGame);
        }

        // Set next target character
        function setNextTarget() {
            const activeChars = state.characters.filter(c => c.active);
            if (activeChars.length > 0) {
                const nextTarget = activeChars[0];
                nextTarget.element.classList.add('target');
                elements.targetChar.textContent = nextTarget.char;
            } else {
                elements.targetChar.textContent = '等待字符...';
            }
        }

        // Lose life
        function loseLife() {
            state.lives--;
            updateLivesDisplay();

            if (state.lives <= 0) {
                gameOver();
            }
        }

        // Update lives display
        function updateLivesDisplay() {
            elements.lives.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart' + (i >= state.lives ? ' lost' : '');
                heart.textContent = '❤';
                elements.lives.appendChild(heart);
            }
        }

        // Handle keyboard input
        function handleInput(key) {
            if (state.status !== 'playing') return;

            const targetChar = state.characters.find(c =>
                c.active && c.element.classList.contains('target')
            );

            if (!targetChar) return;

            if (key.toUpperCase() === targetChar.char) {
                // Hit!
                hitChar(targetChar);
            }
        }

        // Hit character
        function hitChar(charObj) {
            charObj.active = false;
            charObj.element.classList.remove('target');
            charObj.element.classList.add('hit');

            // Create particles
            createParticles(charObj.element);

            // Remove after animation
            setTimeout(() => charObj.element.remove(), 500);

            // Update score
            state.combo++;
            if (state.combo > state.maxCombo) {
                state.maxCombo = state.combo;
            }

            const baseScore = 10;
            const comboBonus = Math.floor(state.combo / 5) * 5;
            const levelBonus = state.level * 2;
            const totalScore = baseScore + comboBonus + levelBonus;

            state.score += totalScore;
            elements.score.textContent = state.score;
            elements.combo.textContent = state.combo;

            // Show combo message
            if (state.combo > 0 && state.combo % 5 === 0) {
                showComboMessage(`${state.combo} 连击！`, '#ffd700');
            }

            // Remove from array
            const index = state.characters.indexOf(charObj);
            if (index > -1) {
                state.characters.splice(index, 1);
            }

            // Set new target
            setNextTarget();
        }

        // Create particle effects
        function createParticles(element) {
            const rect = element.getBoundingClientRect();
            const gameArea = elements.gameArea;
            const areaRect = gameArea.getBoundingClientRect();

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.cssText = `
                    left: ${rect.left - areaRect.left + rect.width / 2}px;
                    top: ${rect.top - areaRect.top + rect.height / 2}px;
                    width: 8px;
                    height: 8px;
                    background: #00ff41;
                    box-shadow: 0 0 10px #00ff41;
                `;

                const angle = (i / 8) * Math.PI * 2;
                const velocity = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;

                particle.style.transform = `translate(${tx}px, ${ty}px)`;
                gameArea.appendChild(particle);

                setTimeout(() => particle.remove(), 800);
            }
        }

        // Show combo message
        function showComboMessage(text, color) {
            const display = elements.comboDisplay;
            display.textContent = text;
            display.style.color = color;
            display.style.textShadow = `0 0 30px ${color}`;
            display.classList.add('show');

            setTimeout(() => {
                display.classList.remove('show');
            }, 1000);
        }

        // Update time display
        function updateTime() {
            if (state.status !== 'playing') return;
            state.time = Math.floor((Date.now() - state.gameStartTime) / 1000);
            elements.time.textContent = state.time + 's';
        }

        // Start game
        function startGame() {
            state.status = 'playing';
            state.score = 0;
            state.lives = 5;
            state.combo = 0;
            state.maxCombo = 0;
            state.time = 0;
            state.level = 1;
            state.characters = [];
            state.lastSpawnTime = Date.now();
            state.spawnInterval = 2000;
            state.gameStartTime = Date.now();

            // Clear game area
            elements.gameArea.innerHTML = '';
            elements.score.textContent = '0';
            elements.combo.textContent = '0';
            elements.level.textContent = '1';
            elements.time.textContent = '0s';
            elements.targetChar.textContent = '等待字符...';

            updateLivesDisplay();
            showScreen('game');

            // Start game loop
            updateGame();

            // Start time counter
            state.timeInterval = setInterval(updateTime, 1000);

            // Spawn first character
            setTimeout(createFallingChar, 500);
        }

        // Game over
        function gameOver() {
            state.status = 'gameover';

            // Stop game loop
            if (state.animationFrame) {
                cancelAnimationFrame(state.animationFrame);
            }
            if (state.timeInterval) {
                clearInterval(state.timeInterval);
            }

            // Clear remaining characters
            state.characters.forEach(c => c.element.remove());
            state.characters = [];

            // Check high score
            const isNewRecord = state.score > state.highScore;
            if (isNewRecord) {
                state.highScore = state.score;
                localStorage.setItem('codeRainHighScore', state.highScore.toString());
            }

            // Update game over screen
            elements.finalScore.textContent = state.score;
            elements.finalCombo.textContent = state.maxCombo;
            elements.finalTime.textContent = state.time + 's';
            elements.finalLevel.textContent = state.level;
            elements.newRecord.style.display = isNewRecord ? 'block' : 'none';

            showScreen('gameOver');
        }

        // Restart game
        function restartGame() {
            startGame();
        }

        // Back to start
        function backToStart() {
            showScreen('start');
        }

        // Keyboard event listener
        document.addEventListener('keydown', (e) => {
            if (state.status === 'idle') {
                startGame();
                return;
            }

            if (state.status === 'playing') {
                // Only handle single character keys
                if (e.key.length === 1 && /[a-zA-Z0-9]/.test(e.key)) {
                    handleInput(e.key);
                }
            }
        });

        // Touch support for mobile
        let touchInput = '';
        document.addEventListener('touchstart', (e) => {
            if (state.status === 'idle') {
                startGame();
                return;
            }
        });
    </script>
</body>
</html>
