<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 多平台文案生成 & 分发系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#12121a;--card-hover:#1a1a25;--primary:#8b5cf6;--primary-light:#a78bfa;--accent:#06b6d4;--gold:#f59e0b;--text:#f1f5f9;--text-secondary:#94a3b8;--border:#1e293b;--success:#10b981;--danger:#ef4444;--radius:16px;--shadow:0 4px 24px rgba(0,0,0,.4)}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 20%,rgba(139,92,246,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(6,182,212,.06) 0%,transparent 50%);pointer-events:none;z-index:0}
.container{max-width:1280px;margin:0 auto;padding:32px 24px;position:relative;z-index:1}
header{text-align:center;padding:48px 20px 40px;position:relative}
header h1{font-size:42px;font-weight:800;background:linear-gradient(135deg,#8b5cf6,#06b6d4,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;letter-spacing:-1px}
header p{color:var(--text-secondary);font-size:16px;font-weight:300}

/* Steps */
.steps{display:flex;justify-content:center;gap:12px;margin:0 auto 48px;max-width:560px}
.step-dot{width:12px;height:12px;border-radius:50%;background:var(--border);transition:.4s cubic-bezier(.4,0,.2,1);cursor:pointer}
.step-dot.active{background:var(--primary);transform:scale(1.4);box-shadow:0 0 16px rgba(139,92,246,.5)}
.step-dot.done{background:var(--success)}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;margin-bottom:24px;transition:.3s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.3),transparent)}
.card:hover{border-color:rgba(139,92,246,.3);box-shadow:var(--shadow)}
.card-title{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.card-title .icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}

/* Form */
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input[type=text],input[type=datetime-local],textarea,select{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;transition:.3s;background:rgba(255,255,255,.03);color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);background:rgba(139,92,246,.05);box-shadow:0 0 0 4px rgba(139,92,246,.15)}
input::placeholder,textarea::placeholder{color:#475569}
textarea{resize:vertical;min-height:80px}

/* Buttons */
.btn{padding:12px 28px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.3s;display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:50%;left:50%;width:0;height:0;background:rgba(255,255,255,.1);border-radius:50%;transform:translate(-50%,-50%);transition:width .6s,height .6s}
.btn:active::after{width:300px;height:300px}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;box-shadow:0 4px 16px rgba(139,92,246,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,92,246,.4)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 16px rgba(16,185,129,.3)}
.btn-success:hover{transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 16px rgba(245,158,11,.3)}
.btn-gold:hover{transform:translateY(-2px)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-secondary)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:8px 16px;font-size:12px}
.btn-block{width:100%;justify-content:center;padding:14px}
.btn-distribute{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:.3s;display:flex;align-items:center;gap:6px}
.btn-distribute:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(6,182,212,.4)}

/* Platform tabs */
.platform-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;padding:14px;background:rgba(255,255,255,.02);border-radius:12px;border:1px solid var(--border)}
.platform-tab{padding:10px 18px;border-radius:10px;border:1.5px solid transparent;background:transparent;font-size:13px;font-weight:600;cursor:pointer;transition:.3s;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.platform-tab:hover{background:rgba(139,92,246,.1);color:var(--text)}
.platform-tab.active{background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(6,182,212,.1));border-color:var(--primary);color:#fff;box-shadow:0 2px 12px rgba(139,92,246,.25)}
.platform-tab .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* Platform panel */
.platform-panel{display:none}
.platform-panel.active{display:block;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Copy output */
.copy-section{margin-top:16px}
.copy-section h4{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.copy-box{background:rgba(255,255,255,.02);border:1.5px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;transition:.3s;position:relative}
.copy-box:hover{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.03)}
.copy-box .label{font-size:11px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.copy-box .text{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.copy-box .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* Schedule list */
.schedule-list{display:grid;gap:12px}
.schedule-item{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;transition:.3s}
.schedule-item:hover{background:rgba(139,92,246,.05);border-color:rgba(139,92,246,.3)}
.schedule-item .time{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;min-width:150px;font-family:'Courier New',monospace}
.schedule-item .platform-tag{font-size:12px;padding:4px 12px;border-radius:6px;font-weight:600;color:#fff}
.schedule-item .status{margin-left:auto;font-size:11px;padding:4px 12px;border-radius:6px;font-weight:600}
.status-pending{background:rgba(245,158,11,.15);color:var(--gold)}
.status-done{background:rgba(16,185,129,.15);color:var(--success)}

/* Stats bar */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;transition:.3s}
.stat-card:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.3)}
.stat-card .num{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .label{font-size:12px;color:var(--text-secondary);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* Toast */
.toast{position:fixed;bottom:32px;right:32px;padding:14px 24px;border-radius:12px;color:#fff;font-size:14px;font-weight:600;z-index:999;transform:translateY(80px);opacity:0;transition:.4s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(10px)}
.toast.show{transform:translateY(0);opacity:1}
.toast-success{background:rgba(16,185,129,.9)}
.toast-info{background:rgba(139,92,246,.9)}

/* Divider */
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:28px 0}

/* Tone selector */
.tone-chips{display:flex;flex-wrap:wrap;gap:8px}
.tone-chip{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);font-size:13px;cursor:pointer;transition:.3s;background:transparent;color:var(--text-secondary)}
.tone-chip:hover{border-color:var(--primary-light);color:var(--text)}
.tone-chip.selected{background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(6,182,212,.15));color:#fff;border-color:var(--primary)}

/* Preview card */
.preview-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);transition:.3s}
.preview-card:hover{border-color:rgba(139,92,246,.3);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.preview-header{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.preview-avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.preview-body{padding:18px}
.preview-body .avatar-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.preview-body .avatar-row .name{font-weight:700;font-size:15px}
.preview-body .avatar-row .handle{font-size:12px;color:var(--text-secondary)}
.preview-body .content{font-size:14px;line-height:1.8;margin-bottom:14px;color:var(--text-secondary)}
.preview-body .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.preview-body .tags span{font-size:12px;color:var(--primary);background:rgba(139,92,246,.1);padding:3px 10px;border-radius:6px}
.preview-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:24px;font-size:13px;color:var(--text-secondary)}

/* Export area */
.export-area{background:rgba(0,0,0,.4);color:#a5f3fc;border-radius:12px;padding:20px;font-family:'Courier New',monospace;font-size:12px;max-height:400px;overflow:auto;white-space:pre-wrap;line-height:1.7;border:1px solid var(--border)}
.export-area .copy-btn{position:absolute;top:12px;right:12px}

/* Checkbox grid */
.checkbox-grid{display:flex;flex-wrap:wrap;gap:10px}
.checkbox-label{display:flex;align-items:center;gap:8px;padding:8px 16px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;transition:.3s;background:rgba(255,255,255,.02)}
.checkbox-label:hover{border-color:var(--primary);background:rgba(139,92,246,.05)}
.checkbox-label input{accent-color:var(--primary);width:16px;height:16px}
.checkbox-label .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* Platform distribute section */
.distribute-section{margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.distribute-section h4{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text)}
.distribute-buttons{display:flex;flex-wrap:wrap;gap:10px}
.dist-btn{padding:10px 20px;border-radius:10px;border:1.5px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:.3s;display:flex;align-items:center;gap:8px}
.dist-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.dist-btn.sent{background:rgba(16,185,129,.15);border-color:var(--success);color:var(--success)}

/* Responsive */
@media(max-width:768px){.form-row{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.platform-tabs{gap:4px}.platform-tab{padding:8px 12px;font-size:12px}header h1{font-size:28px}}

/* Loading animation */
.loading-spinner{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Glow effect */
.glow{position:relative}
.glow::after{content:'';position:absolute;inset:-2px;border-radius:inherit;background:linear-gradient(135deg,var(--primary),var(--accent),var(--gold));z-index:-1;opacity:0;transition:.3s;filter:blur(8px)}
.glow:hover::after{opacity:.4}

/* Scrollbar */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--primary)}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>✦ AI 多平台文案引擎 ✦</h1>
    <p>输入主题 · 智能适配 · 一键分发</p>
  </header>

  <!-- Steps -->
  <div class="steps" id="stepIndicator">
    <div class="step-dot active"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
    <div class="step-dot"></div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsBar" style="display:none">
    <div class="stat-card"><div class="num" id="statPlatforms">0</div><div class="label">适配平台</div></div>
    <div class="stat-card"><div class="num" id="statCopies">0</div><div class="label">生成文案</div></div>
    <div class="stat-card"><div class="num" id="statSchedules">0</div><div class="label">定时任务</div></div>
    <div class="stat-card"><div class="num" id="statChars">0</div><div class="label">总字数</div></div>
  </div>

  <!-- Step 1: Topic Input -->
  <div class="card glow" id="step1">
    <div class="card-title"><span class="icon" style="background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(6,182,212,.15));color:var(--primary-light)">01</span> 输入主题与创作参数</div>
    <div class="form-group">
      <label>内容主题 / 核心关键词</label>
      <input type="text" id="topicInput" placeholder="例如：AI 如何改变短视频创作、夏季旅行攻略、个人成长方法论...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>目标受众</label>
        <select id="audienceSelect">
          <option value="general">大众用户</option>
          <option value="young">年轻人 (18-28岁)</option>
          <option value="professionals">职场人士</option>
          <option value="parents">家长群体</option>
          <option value="tech">科技爱好者</option>
          <option value="creators">创作者/自媒体人</option>
        </select>
      </div>
      <div class="form-group">
        <label>内容类型</label>
        <select id="contentType">
          <option value="tips">干货技巧</option>
          <option value="story">故事分享</option>
          <option value="review">评测推荐</option>
          <option value="vlog">Vlog 记录</option>
          <option value="opinion">观点表达</option>
          <option value="tutorial">教程教学</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>语气风格（可多选）</label>
      <div class="tone-chips" id="toneChips">
        <span class="tone-chip selected" data-tone="professional">🎯 专业严谨</span>
        <span class="tone-chip" data-tone="humorous">😄 幽默风趣</span>
        <span class="tone-chip" data-tone="emotional">❤️ 情感共鸣</span>
        <span class="tone-chip" data-tone="educational">📚 知识科普</span>
        <span class="tone-chip" data-tone="inspirational">💪 励志向上</span>
        <span class="tone-chip" data-tone="casual">☕ 轻松日常</span>
      </div>
    </div>
    <div class="form-group">
      <label>额外补充信息（可选）</label>
      <textarea id="extraInfo" rows="2" placeholder="例如：产品链接、个人观点、特定要求等..."></textarea>
    </div>
    <div style="display:flex;gap:12px;margin-top:12px">
      <button class="btn btn-primary btn-block glow" onclick="generateAll()">✨ 一键生成全部平台文案</button>
    </div>
  </div>

  <!-- Step 2: Platform Selection & Content -->
  <div class="card" id="step2" style="display:none">
    <div class="card-title"><span class="icon" style="background:rgba(16,185,129,.15);color:var(--success)">02</span> 平台文案管理与编辑</div>
    <div class="form-group">
      <label>选择需要生成的平台</label>
      <div class="checkbox-grid" id="platformCheckboxes"></div>
    </div>
    <div class="divider"></div>
    <div id="platformTabsContainer"></div>
    <div id="platformPanelsContainer"></div>
  </div>

  <!-- Step 3: Schedule -->
  <div class="card" id="step3" style="display:none">
    <div class="card-title"><span class="icon" style="background:rgba(245,158,11,.15);color:var(--gold)">03</span> 定时发送设置</div>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:20px">为每个平台的文案设置独立的发送时间和日期，支持智能推荐最佳发布时间</p>
    <div id="scheduleList" class="schedule-list"></div>
    <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap">
      <button class="btn btn-glow" onclick="autoSchedule()" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff">⏰ 智能推荐最佳发布时间</button>
      <button class="btn btn-outline" onclick="goToStep(4)">下一步：预览导出 →</button>
    </div>
  </div>

  <!-- Step 4: Preview & Export -->
  <div class="card" id="step4" style="display:none">
    <div class="card-title"><span class="icon" style="background:rgba(236,72,153,.15);color:#ec4899">04</span> 预览与导出</div>
    <div id="previewContainer"></div>
    <div class="divider"></div>
    <div class="form-group">
      <label>完整 JSON 数据（可直接用于 API 调用）</label>
      <div class="export-area" id="jsonExport" style="position:relative"></div>
    </div>
    <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap">
      <button class="btn btn-outline" onclick="copyJSON()">📋 复制 JSON</button>
      <button class="btn btn-primary" onclick="downloadHTML()">💾 下载 HTML 报告</button>
      <button class="btn btn-success" onclick="simulatePublish()">🚀 模拟发布</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== DATA ==========
const PLATFORMS = [
  {id:'douyin',name:'抖音',color:'#fe2c55',emoji:'🎵',desc:'快节奏短视频平台，黄金3秒法则，强视觉冲击'},
  {id:'xiaohongshu',name:'小红书',color:'#ff2442',emoji:'📕',desc:'精致生活分享社区，种草笔记，实用价值优先'},
  {id:'kuaishou',name:'快手',color:'#ffc107',emoji:'⚡',desc:'真实接地气的生活平台，老铁文化，情感连接'},
  {id:'bilibili',name:'B站',color:'#00a1d6',emoji:'📺',desc:'年轻兴趣社区，深度内容，弹幕互动文化'},
  {id:'weibo',name:'微博',color:'#e6162d',emoji:'🔥',desc:'热点驱动社交平台，短平快，话题传播'},
  {id:'wechat',name:'微信公众号',color:'#07c160',emoji:'💬',desc:'深度阅读私域平台，专业内容，长文生态'}
];

const TONE_CONFIG = {
  professional:{label:'专业严谨',emoji:'🎯'},
  humorous:{label:'幽默风趣',emoji:'😄'},
  emotional:{label:'情感共鸣',emoji:'❤️'},
  educational:{label:'知识科普',emoji:'📚'},
  inspirational:{label:'励志向上',emoji:'💪'},
  casual:{label:'轻松日常',emoji:'☕'}
};

const BEST_TIMES = {
  douyin:{weekdays:['12:00','18:30','21:00'],weekends:['10:00','15:00','20:00']},
  xiaohongshu:{weekdays:['08:00','12:30','19:00'],weekends:['09:30','14:00','20:30']},
  kuaishou:{weekdays:['07:30','12:00','17:30'],weekends:['09:00','16:00','19:30']},
  bilibili:{weekdays:['12:30','18:00','21:00'],weekends:['10:30','15:00','20:00']},
  weibo:{weekdays:['08:30','12:00','18:30'],weekends:['10:00','15:30','20:30']},
  wechat:{weekdays:['07:30','12:30','20:30'],weekends:['09:00','15:00','20:00']}
};

let state = {
  topic:'',audience:'',contentType:'',tones:[],selectedPlatforms:['douyin','xiaohongshu','kuaishou','bilibili','weibo','wechat'],
  copies:{},schedules:{}
};

// ========== INIT ==========
document.querySelectorAll('.tone-chip').forEach(chip=>{
  chip.addEventListener('click',()=>chip.classList.toggle('selected'));
});

function showToast(msg,type='info'){
  const t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+type+' show';
  setTimeout(()=>t.classList.remove('show'),2500);
}

function updateSteps(step){
  document.querySelectorAll('.step-dot').forEach((d,i)=>{
    d.className='step-dot'+(i<step?' done':'')+(i===step?' active':'');
  });
}

function updateStats(){
  const platforms=state.selectedPlatforms.length;
  const copies=Object.keys(state.copies).length;
  const schedules=Object.keys(state.schedules).length;
  let totalChars=0;

function generateTitle(topic, ct, tones, platform){
  const toneLabel = tones[0] ? TONE_CONFIG[tones[0]].label : '专业';

    douyin: ['深度解析｜', '必看指南｜', '干货分享｜', '揭秘｜'],

    wechat: ['深度｜', '详解：', '思考：', '指南：']

function generateAll(){
  const topic=document.getElementById('topicInput').value.trim();
  if(!topic){showToast('请输入内容主题！','');return}
  
  state.topic=topic;
  state.audience=document.getElementById('audienceSelect').value;
  state.contentType=document.getElementById('contentType').value;
  state.tones=[...document.querySelectorAll('.tone-chip.selected')].map(c=>c.dataset.tone);
  if(!state.tones.length)state.tones=['professional'];
  
  // Generate copies for selected platforms
  state.copies={};
  state.selectedPlatforms.forEach(pid=>{
    state.copies[pid]=generatePlatformCopy(pid,state.topic,state.audience,state.contentType,state.tones,'');
  });
  
  // Show steps
  document.getElementById('step2').style.display='block';
  renderPlatformTabs();
  renderPlatformPanels();
  updateSteps(1);
  updateStats();
  showToast('✅ 文案生成完成！','success');
}

  container.innerHTML=html;
}

function switchPlatform(pid,el){
  document.querySelectorAll('.platform-tab').forEach(t=>t.classList.remove('active'));

  document.getElementById('panel-'+pid)?.classList.add('active');
}

function escHtml(str){return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function copyText(pid,type){
  const el=document.getElementById(`${type}-${pid}`);
  navigator.clipboard.writeText(el.textContent).then(()=>showToast('✅ 已复制到剪贴板','success'));
}

function copyAll(pid){
  const title=document.getElementById('title-'+pid).textContent;
  const script=document.getElementById('script-'+pid).textContent;
  const tags=document.getElementById('tags-'+pid).textContent;
  const allText=`标题：${title}\n\n正文：${script}\n\n标签：${tags}`;
  navigator.clipboard.writeText(allText).then(()=>showToast('✅ 全部内容已复制','success'));

function regenerateField(pid,type){
  const topic=state.topic;
  const audience=state.audience;
  const contentType=state.contentType;
  const tones=state.tones;
  const newCopy=generatePlatformCopy(pid,topic,audience,contentType,tones,'');
  if(newCopy){
    if(type==='title')document.getElementById(`title-${pid}`).textContent=newCopy.title;
    if(type==='script')document.getElementById(`script-${pid}`).textContent=newCopy.script;
    if(type==='tags')document.getElementById(`tags-${pid}`).textContent=newCopy.tags.join(' ');
    showToast('🔄 已重新生成','info');
  }
}

function updateSchedule(pid,val){
  state.schedules[pid]=val;
  updateStats();
}

function autoSchedule(){
  const now=new Date();
  state.selectedPlatforms.forEach(pid=>{
    const isWeekend=now.getDay()===0||now.getDay()===6;
    const times=BEST_TIMES[pid][isWeekend?'weekends':'weekdays'];
    const bestHour=times[Math.floor(Math.random()*times.length)];
    
    const tomorrow=new Date(now);
    tomorrow.setDate(tomorrow.getDate()+1);
    const [h,m]=bestHour.split(':').map(Number);
    tomorrow.setHours(h,m,0,0);
    
    const dateStr=tomorrow.toISOString().slice(0,16);
    state.schedules[pid]=dateStr;
    const input=document.getElementById('schedule-'+pid);
    if(input)input.value=dateStr;
  });
  updateStats();
  showToast('⏰ 已智能推荐最佳发布时间','success');
}

function useSmartTime(pid){
  const now=new Date();
  const isWeekend=now.getDay()===0||now.getDay()===6;
  const times=BEST_TIMES[pid][isWeekend?'weekends':'weekdays'];
  const bestHour=times[Math.floor(Math.random()*times.length)];
  const tomorrow=new Date(now);
  tomorrow.setDate(tomorrow.getDate()+1);
  const [h,m]=bestHour.split(':').map(Number);
  tomorrow.setHours(h,m,0,0);
  const dateStr=tomorrow.toISOString().slice(0,16);
  state.schedules[pid]=dateStr;
  const input=document.getElementById('schedule-'+pid);
  if(input)input.value=dateStr;
  updateStats();
  showToast(`⏰ ${PLATFORMS.find(p=>p.id===pid).name} 已设置发送时间`,'success');
}

  updateStats();
  document.getElementById('step'+step).scrollIntoView({behavior:'smooth'});
}

  state.selectedPlatforms.forEach(pid=>{
    const p=PLATFORMS.find(x=>x.id===pid);
    const c=state.copies[pid];
    const schedule=state.schedules[pid];
    if(!c)return;
    
    const titleEl=document.getElementById('title-'+pid);
    const scriptEl=document.getElementById('script-'+pid);
    const tagsEl=document.getElementById('tags-'+pid);
    const title=titleEl?titleEl.textContent:c.title;
    const script=scriptEl?scriptEl.textContent:c.script;
    const tags=tagsEl?tagsEl.textContent.split(/\s+/):c.tags;
    
    jsonData.posts.push({
      platform:pid,platformName:p.name,color:p.color,emoji:p.emoji,
      title,schedule,
      content:script,
      tags
    });
    
    previewHtml+=`
    <div class="preview-card" style="margin-bottom:16px">
      <div class="preview-header" style="background:${p.color}15;border-bottom-color:${p.color}30">
        <span style="font-size:22px">${p.emoji}</span>
        <span style="font-weight:700;color:${p.color}">${p.name}</span>
        ${schedule?`<span style="margin-left:auto;font-size:12px;color:var(--text-secondary)">📅 ${new Date(schedule).toLocaleString('zh-CN')}</span>`:''}
      </div>
      <div class="preview-body">
        <div class="avatar-row">
          <div class="preview-avatar" style="background:${p.color}20;color:${p.color}">${p.emoji}</div>
          <div>
            <div class="name">${title}</div>
            <div class="handle">${p.name} · ${(script||'').replace(/\s/g,'').length}字</div>
          </div>
        </div>
        <div class="content">${escHtml(script).substring(0,200)}${script.length>200?'...':''}</div>
        <div class="tags">${tags.slice(0,5).map(t=>`<span>${t}</span>`).join('')}</div>
      </div>
      <div class="preview-footer">
        <span>❤️ 点赞</span><span>💬 评论</span><span>⭐ 收藏</span><span>↗️ 分享</span>
      </div>
    </div>`;
  });
  
  container.innerHTML=previewHtml;
  exportArea.textContent=JSON.stringify(jsonData,null,2);
}

function copyJSON(){
  const text=document.getElementById('jsonExport').textContent;
  navigator.clipboard.writeText(text).then(()=>showToast('✅ JSON 已复制','success'));
}

function downloadHTML(){
  const jsonData={topic:state.topic,audience:state.audience,contentType:state.contentType,tones:state.tones,generatedAt:new Date().toISOString(),posts:[]};
  state.selectedPlatforms.forEach(pid=>{
    const p=PLATFORMS.find(x=>x.id===pid);
    const c=state.copies[pid];
    const titleEl=document.getElementById('title-'+pid);
    const scriptEl=document.getElementById('script-'+pid);
    const tagsEl=document.getElementById('tags-'+pid);
    jsonData.posts.push({
      platform:pid,platformName:p.name,color:p.color,emoji:p.emoji,
      title:titleEl?titleEl.textContent:c.title,
      schedule:state.schedules[pid],
      content:scriptEl?scriptEl.textContent:c.script,
      tags:tagsEl?tagsEl.textContent.split(/\s+/):c.tags
    });
  });
  
  const reportHTML=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>多平台文案报告</title>
<style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:800px;margin:0 auto;padding:24px;background:#f5f5f5}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{color:#333;margin-bottom:8px}h2{color:#555;margin:20px 0 12px;border-bottom:2px solid #eee;padding-bottom:8px}
.meta{color:#888;font-size:13px;margin-bottom:24px}
.post{border-left:4px solid #4f46e5;padding:16px;margin:12px 0;background:#f8f9fa;border-radius:0 8px 8px 0}
.post-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.post-header .emoji{font-size:20px}.post-header .name{font-weight:700}.post-header .time{margin-left:auto;font-size:12px;color:#888}
.post-title{font-weight:700;margin:8px 0;font-size:15px}.post-content{line-height:1.8;white-space:pre-wrap;font-size:14px;color:#444}
.post-tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}.post-tags span{background:#eef2ff;color:#4f46e5;padding:2px 8px;border-radius:4px;font-size:12px}
.schedule{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
</style></head><body>
<h1>✦ 多平台文案生成报告 ✦</h1>
<p class="meta">主题：${escHtml(state.topic)} | 受众：${state.audience} | 类型：${state.contentType} | 生成时间：${new Date().toLocaleString('zh-CN')}</p>`;
  
  jsonData.posts.forEach(post=>{
    reportHTML+=`<div class="post" style="border-left-color:${post.color}"><div class="post-header"><span class="emoji">${post.emoji}</span><span class="name" style="color:${post.color}">${post.platformName}</span>${post.schedule?`<span class="schedule">📅 ${new Date(post.schedule).toLocaleString('zh-CN')}</span>`:''}</div>
    <div class="post-title">${escHtml(post.title)}</div>
    <div class="post-content">${escHtml(post.content)}</div>
    <div class="post-tags">${post.tags.map(t=>`<span>${t}</span>`).join('')}</div></div>`;
  });
  
  reportHTML+=`<p style="text-align:center;color:#aaa;margin-top:32px;font-size:12px">由 AI 多平台文案生成系统自动生成</p></body></html>`;
  
  const blob=new Blob([reportHTML],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`多平台文案报告_${state.topic.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.html`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast('✅ HTML 报告已下载','success');
}

function simulatePublish(){
  const pending=[];
  state.selectedPlatforms.forEach(pid=>{
    if(state.schedules[pid])pending.push(PLATFORMS.find(p=>p.id===pid).name);
  });
  if(pending.length){
    showToast(`🚀 已模拟发布 ${pending.length} 个平台：${pending.join('、')}`,'success');
  }else{
    showToast('⚠️ 请先设置发送时间','');
  }
}

// ========== PLATFORM CHECKBOXES ==========
(function initPlatformCheckboxes(){
  const container=document.getElementById('platformCheckboxes');
  let html='';
  PLATFORMS.forEach(p=>{
    html+=`<label class="checkbox-label" style="display:flex;align-items:center;gap:6px;padding:8px 14px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;font-size:13px;transition:.3s" onmouseover="this.style.borderColor='#8b5cf6'" onmouseout="this.style.borderColor='#1e293b'">
      <input type="checkbox" value="${p.id}" checked onchange="togglePlatform('${p.id}',this.checked)" style="accent-color:var(--primary)">
      <span class="dot" style="width:10px;height:10px;border-radius:50%;background:${p.color};display:inline-block"></span>${p.emoji} ${p.name}
    </label>`;
  });
  container.innerHTML=html;
})();

function togglePlatform(pid,checked){
  if(checked){
    if(!state.selectedPlatforms.includes(pid))state.selectedPlatforms.push(pid);
  }else{
    state.selectedPlatforms=state.selectedPlatforms.filter(x=>x!==pid);
    delete state.copies[pid];
    delete state.schedules[pid];
  }
}
</script>
