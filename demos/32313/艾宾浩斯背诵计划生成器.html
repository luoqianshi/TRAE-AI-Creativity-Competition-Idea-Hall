<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艾宾浩斯背诵计划生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .form-section {
            padding: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-group .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: #fafafa;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-control[type="number"] {
            max-width: 120px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-top: 15px;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .result-section {
            padding: 25px;
            border-top: 1px solid #eee;
            display: none;
        }
        
        .result-section.show {
            display: block;
        }
        
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            margin-top: 15px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }
        
        th {
            background: #f8f9fa;
            font-weight: 600;
            font-size: 14px;
            color: #555;
            white-space: nowrap;
        }
        
        td {
            font-size: 14px;
            color: #333;
        }
        
        tr:hover {
            background: #fafafa;
        }
        
        tr:last-child td {
            border-bottom: none;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: center;
        }
        
        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            cursor: pointer;
        }
        
        .checkbox-wrapper span {
            flex: 1;
            word-break: break-all;
        }
        
        .completed {
            text-decoration: line-through;
            color: #999;
        }
        
        .weekend {
            background: #fff5f5;
        }
        
        .weekend td {
            color: #e74c3c;
        }
        
        .copy-message {
            text-align: center;
            color: #27ae60;
            font-size: 14px;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .copy-message.show {
            opacity: 1;
        }
        
        .footer-note {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #e0e0e0;
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 22px;
            }
            
            .form-section, .result-section {
                padding: 15px;
            }
            
            .form-control {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>艾宾浩斯背诵计划生成器</h1>
            <p>基于间隔重复记忆法 · 科学安排背诵复习节奏</p>
        </div>
        
        <div class="form-section">
            <div class="form-group">
                <label for="contentName">背诵内容名称</label>
                <input type="text" id="contentName" class="form-control" value="背诵任务">
            </div>
            
            <div class="form-group">
                <label for="startDate">开始背诵日期</label>
                <input type="date" id="startDate" class="form-control">
            </div>
            
            <div class="form-group">
                <label for="groupCount">背诵分组数量</label>
                <input type="number" id="groupCount" class="form-control" value="1" min="1" max="30">
                <div class="hint">将内容拆分为N天完成，每天1组，每组独立生成复习计划</div>
            </div>
            
            <div class="form-group">
                <label for="reviewMode">复习模式</label>
                <select id="reviewMode" class="form-control">
                    <option value="standard">标准版（6轮复习）</option>
                    <option value="simple">精简版（4轮复习）</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="weekendSetting">周末设置</label>
                <select id="weekendSetting" class="form-control">
                    <option value="include">不跳过周末</option>
                    <option value="exclude">跳过周末</option>
                </select>
            </div>
            
            <button class="btn" onclick="generatePlan()">生成背诵计划</button>
        </div>
        
        <div class="result-section" id="resultSection">
            <button class="btn btn-secondary" onclick="copyPlan()">一键复制计划表</button>
            <div class="copy-message" id="copyMessage">✓ 已复制到剪贴板</div>
            <div class="table-wrapper">
                <table id="planTable">
                    <thead>
                        <tr>
                            <th style="width: 20px;"></th>
                            <th>日期</th>
                            <th>星期</th>
                            <th>今日新背内容</th>
                            <th>今日需复习内容</th>
                        </tr>
                    </thead>
                    <tbody id="planBody"></tbody>
                </table>
            </div>
            <div class="footer-note">
                本计划基于艾宾浩斯遗忘曲线规律生成，可根据自身记忆情况灵活调整
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            loadCheckboxes();
        });

        function getWeekendSkipDate(date) {
            const day = date.getDay();
            if (day === 6) {
                date.setDate(date.getDate() + 2);
            } else if (day === 0) {
                date.setDate(date.getDate() + 1);
            }
            return date;
        }

        function getWeekdayName(day) {
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            return weekdays[day];
        }

        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function generatePlan() {
            const contentName = document.getElementById('contentName').value || '背诵任务';
            const startDate = new Date(document.getElementById('startDate').value);
            const groupCount = parseInt(document.getElementById('groupCount').value) || 1;
            const reviewMode = document.getElementById('reviewMode').value;
            const weekendSetting = document.getElementById('weekendSetting').value;

            const intervals = reviewMode === 'standard' 
                ? [0, 1, 2, 4, 7, 15] 
                : [0, 2, 7, 30];

            const planMap = {};

            for (let group = 1; group <= groupCount; group++) {
                const groupStartDate = new Date(startDate);
                groupStartDate.setDate(startDate.getDate() + group - 1);

                intervals.forEach(interval => {
                    const reviewDate = new Date(groupStartDate);
                    reviewDate.setDate(groupStartDate.getDate() + interval);

                    if (weekendSetting === 'exclude') {
                        const originalDay = reviewDate.getDay();
                        if (originalDay === 6 || originalDay === 0) {
                            getWeekendSkipDate(reviewDate);
                        }
                    }

                    const dateStr = formatDate(reviewDate);
                    const dayOfWeek = reviewDate.getDay();
                    const isNew = interval === 0;

                    if (!planMap[dateStr]) {
                        planMap[dateStr] = {
                            date: reviewDate,
                            dayOfWeek: dayOfWeek,
                            newContent: [],
                            reviewContent: []
                        };
                    }

                    const taskName = `${contentName} - 第${group}组`;
                    if (isNew) {
                        planMap[dateStr].newContent.push(taskName);
                    } else {
                        planMap[dateStr].reviewContent.push(taskName);
                    }
                });
            }

            const sortedDates = Object.keys(planMap).sort();
            const resultSection = document.getElementById('resultSection');
            const planBody = document.getElementById('planBody');
            planBody.innerHTML = '';

            sortedDates.forEach(dateStr => {
                const plan = planMap[dateStr];
                const row = document.createElement('tr');
                const isWeekend = plan.dayOfWeek === 0 || plan.dayOfWeek === 6;
                if (isWeekend) row.classList.add('weekend');

                const checkboxId = `cb_${dateStr}`;
                const isChecked = localStorage.getItem(checkboxId) === 'true';

                row.innerHTML = `
                    <td>
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="${checkboxId}" ${isChecked ? 'checked' : ''} onchange="saveCheckbox('${checkboxId}', this.checked)">
                        </div>
                    </td>
                    <td>${dateStr}</td>
                    <td>${getWeekdayName(plan.dayOfWeek)}</td>
                    <td>
                        <div class="checkbox-wrapper">
                            <span ${isChecked ? 'class="completed"' : ''}>${plan.newContent.length > 0 ? plan.newContent.join('<br>') : '-'}</span>
                        </div>
                    </td>
                    <td>
                        <div class="checkbox-wrapper">
                            <span ${isChecked ? 'class="completed"' : ''}>${plan.reviewContent.length > 0 ? plan.reviewContent.join('<br>') : '-'}</span>
                        </div>
                    </td>
                `;
                planBody.appendChild(row);
            });

            resultSection.classList.add('show');
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function saveCheckbox(id, checked) {
            localStorage.setItem(id, checked);
            const row = document.querySelector(`input[id="${id}"]`).closest('tr');
            const spans = row.querySelectorAll('span');
            spans.forEach(span => {
                span.classList.toggle('completed', checked);
            });
        }

        function loadCheckboxes() {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                const isChecked = localStorage.getItem(cb.id) === 'true';
                cb.checked = isChecked;
                if (isChecked) {
                    const row = cb.closest('tr');
                    const spans = row.querySelectorAll('span');
                    spans.forEach(span => span.classList.add('completed'));
                }
            });
        }

        function copyPlan() {
            const planBody = document.getElementById('planBody');
            let text = '日期\t星期\t今日新背内容\t今日需复习内容\n';
            let separator = '──────────────────────────────────────────────────────────\n';
            text += separator;

            planBody.querySelectorAll('tr').forEach(row => {
                const cells = row.querySelectorAll('td');
                const date = cells[1].textContent;
                const weekday = cells[2].textContent;
                const newContent = cells[3].textContent.replace(/\n/g, ' ');
                const reviewContent = cells[4].textContent.replace(/\n/g, ' ');
                text += `${date}\t${weekday}\t${newContent}\t${reviewContent}\n`;
            });

            text += '\n' + separator;
            text += '本计划基于艾宾浩斯遗忘曲线规律生成，可根据自身记忆情况灵活调整';

            navigator.clipboard.writeText(text).then(() => {
                const copyMessage = document.getElementById('copyMessage');
                copyMessage.classList.add('show');
                setTimeout(() => {
                    copyMessage.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('复制失败，请手动复制');
            });
        }
    </script>
</body>
</html>
