<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LookUs</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #0f1115;
  --bg2: #1a1d24;
  --bg3: #232730;
  --ink: #e8e9ec;
  --muted: #8b8f99;
  --rule: #2a2e38;
  --accent: #ff6b4a;
  --accent2: #4a9eff;
  --success: #4ade80;
  --radius: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ===== App Shell ===== */
#app {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===== Screens ===== */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 10;
  background: var(--bg);
}
.screen.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

/* ===== Header ===== */
.app-header {
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 20;
}
.app-header h1 {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--bg3);
  border: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
}
.icon-btn:active { background: var(--rule); transform: scale(0.95); }

/* ===== Scrollable Content ===== */
.scroll-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(80px + var(--safe-bottom));
}
.scroll-content::-webkit-scrollbar { display: none; }

/* ===== Industry Tabs ===== */
.industry-tabs {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--rule);
}
.industry-tabs::-webkit-scrollbar { display: none; }
.tab-chip {
  flex-shrink: 0;
  padding: 6px 16px;
  border-radius: 20px;
  background: var(--bg2);
  border: 1px solid var(--rule);
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-chip.active {
  background: linear-gradient(135deg, var(--accent), #ff8f70);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 2px 12px rgba(255,107,74,0.3);
}
.tab-chip:active { transform: scale(0.95); }

/* ===== Section Title ===== */
.section-title {
  padding: 16px 16px 8px;
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}

/* ===== News Cards ===== */
.news-card {
  margin: 8px 16px;
  padding: 14px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: all 0.2s;
}
.news-card:active { background: var(--bg3); }
.news-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.brand-avatar {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent2), #7ab8ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.brand-info { flex: 1; min-width: 0; }
.brand-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}
.brand-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.news-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 10px;
}
.news-image {
  width: 100%;
  height: 160px;
  border-radius: 10px;
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 10px;
  overflow: hidden;
  position: relative;
}
.news-image::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,107,74,0.1), rgba(74,158,255,0.1));
}
.news-actions {
  display: flex;
  gap: 20px;
  color: var(--muted);
  font-size: 13px;
}
.news-actions span {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* ===== Hot Banner ===== */
.hot-banner {
  margin: 12px 16px;
  padding: 16px;
  background: linear-gradient(135deg, rgba(255,107,74,0.15), rgba(74,158,255,0.15));
  border-radius: var(--radius);
  border: 1px solid rgba(255,107,74,0.2);
}
.hot-banner h3 {
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.hot-banner h3 .fire { color: var(--accent); }
.hot-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 14px;
}
.hot-item:last-child { border-bottom: none; }
.hot-rank {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}
.hot-rank.top { background: var(--accent); color: #fff; }
.hot-item p { margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hot-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--muted);
  flex-shrink: 0;
}

/* ===== Arena Hierarchy ===== */
.arena-hierarchy {
  padding: 8px 16px;
}
.event-block {
  margin-bottom: 12px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  overflow: hidden;
}
.event-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(255,107,74,0.08), rgba(74,158,255,0.08));
  cursor: pointer;
  transition: all 0.2s;
}
.event-header:active { background: var(--bg3); }
.event-name {
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.event-name .trophy { font-size: 18px; }
.event-toggle {
  font-size: 12px;
  color: var(--muted);
  transition: transform 0.3s;
}
.event-block.expanded .event-toggle { transform: rotate(180deg); }

.zone-block {
  border-top: 1px solid var(--rule);
}
.zone-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px 12px 28px;
  cursor: pointer;
  transition: all 0.2s;
}
.zone-header:active { background: var(--bg3); }
.zone-name {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
.zone-name .flag { font-size: 14px; }
.zone-toggle {
  font-size: 11px;
  color: var(--muted);
  transition: transform 0.3s;
}
.zone-block.expanded .zone-toggle { transform: rotate(180deg); }

.level-block {
  border-top: 1px solid var(--rule);
  background: rgba(0,0,0,0.15);
}
.level-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 10px 40px;
  cursor: pointer;
  transition: all 0.2s;
}
.level-header:active { background: var(--bg3); }
.level-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.level-name .tag { font-size: 12px; }
.level-toggle {
  font-size: 11px;
  color: var(--muted);
  transition: transform 0.3s;
}
.level-block.expanded .level-toggle { transform: rotate(180deg); }

.arena-list {
  border-top: 1px solid var(--rule);
}
.arena-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px 12px 52px;
  cursor: pointer;
  transition: all 0.2s;
  border-bottom: 1px solid var(--rule);
}
.arena-item:last-child { border-bottom: none; }
.arena-item:active { background: var(--bg3); }
.arena-item-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--accent2), #7ab8ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.arena-item-info {
  flex: 1;
  min-width: 0;
}
.arena-item-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 2px;
}
.arena-item-meta {
  font-size: 12px;
  color: var(--muted);
}
.arena-item-rank {
  text-align: right;
  flex-shrink: 0;
}
.arena-item-rank .rank-label {
  font-size: 11px;
  color: var(--muted);
}
.arena-item-rank .rank-value {
  font-size: 16px;
  font-weight: 800;
  color: var(--accent);
}
.arena-item-rank .rank-brand {
  font-size: 11px;
  color: var(--muted);
}

/* ===== Breadcrumb ===== */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--rule);
  font-size: 12px;
  color: var(--muted);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.breadcrumb::-webkit-scrollbar { display: none; }
.breadcrumb span { white-space: nowrap; }
.breadcrumb .crumb-active { color: var(--accent); font-weight: 600; }
.breadcrumb .crumb-sep { color: var(--rule); }

/* ===== Profile ===== */
.profile-header {
  padding: 24px 16px;
  text-align: center;
  background: var(--bg2);
  border-bottom: 1px solid var(--rule);
}
.profile-avatar {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  margin: 0 auto 12px;
  border: 3px solid var(--bg);
  box-shadow: 0 4px 20px rgba(255,107,74,0.2);
}
.profile-name {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.profile-role {
  font-size: 13px;
  color: var(--muted);
}
.role-switcher {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 16px;
}
.role-btn {
  padding: 8px 20px;
  border-radius: 20px;
  background: var(--bg3);
  border: 1px solid var(--rule);
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.role-btn.active {
  background: linear-gradient(135deg, var(--accent), #ff8f70);
  color: #fff;
  border-color: transparent;
}
.role-btn:active { transform: scale(0.95); }

.profile-stats {
  display: flex;
  padding: 16px;
  gap: 8px;
}
.stat-card {
  flex: 1;
  padding: 14px;
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  text-align: center;
}
.stat-num {
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
}
.stat-label {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.menu-list {
  padding: 0 16px;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: all 0.2s;
}
.menu-item:active { opacity: 0.7; }
.menu-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--bg2);
  border: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.menu-text {
  flex: 1;
  font-size: 15px;
  font-weight: 500;
}
.menu-arrow {
  color: var(--muted);
  font-size: 14px;
}

/* ===== Bottom Nav ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  padding: 8px 0 calc(8px + var(--safe-bottom));
  background: rgba(26,29,36,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--rule);
  z-index: 100;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 16px;
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  border: none;
  background: none;
}
.nav-item .nav-icon {
  font-size: 22px;
  line-height: 1;
}
.nav-item.active {
  color: var(--accent);
}
.nav-item:active { opacity: 0.7; }

/* ===== Modal / Detail Pages ===== */
.detail-header {
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.back-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--bg3);
  border: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  font-size: 18px;
  cursor: pointer;
}
.detail-header h2 {
  font-size: 17px;
  font-weight: 700;
  margin: 0;
  flex: 1;
}

.detail-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.detail-image {
  width: 100%;
  height: 200px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 16px;
  border: 1px solid var(--rule);
}

.detail-body h3 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}
.detail-body p {
  color: var(--muted);
  line-height: 1.8;
  margin-bottom: 16px;
}

/* ===== Arena Detail Specific ===== */
.leaderboard {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  overflow: hidden;
  margin-bottom: 16px;
}
.lb-header {
  display: grid;
  grid-template-columns: 50px 1fr 80px;
  padding: 12px 16px;
  background: var(--bg3);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.lb-row {
  display: grid;
  grid-template-columns: 50px 1fr 80px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--rule);
  align-items: center;
  transition: background 0.2s;
}
.lb-row:last-child { border-bottom: none; }
.lb-row:active { background: var(--bg3); }
.lb-rank {
  font-size: 16px;
  font-weight: 800;
}
.lb-rank.gold { color: #ffd700; }
.lb-rank.silver { color: #c0c0c0; }
.lb-rank.bronze { color: #cd7f32; }
.lb-brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.lb-brand-avatar {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent2), #7ab8ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}
.lb-brand-name {
  font-size: 14px;
  font-weight: 600;
}
.lb-brand-model {
  font-size: 12px;
  color: var(--muted);
}
.lb-score {
  text-align: right;
  font-size: 15px;
  font-weight: 700;
  color: var(--accent);
}

.arena-rules {
  background: var(--bg2);
  border-radius: var(--radius);
  border: 1px solid var(--rule);
  padding: 16px;
  margin-bottom: 16px;
}
.arena-rules h4 {
  font-size: 14px;
  font-weight: 700;
  margin: 0 0 10px;
  color: var(--accent2);
}
.arena-rules ul {
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.8;
}

/* ===== Splash / Launch ===== */
#screen-splash {
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
#screen-splash.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}
.splash-logo {
  font-size: 48px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
  letter-spacing: -2px;
}
.splash-tagline {
  font-size: 15px;
  color: var(--muted);
  margin-bottom: 40px;
}
.splash-loader {
  width: 120px;
  height: 3px;
  background: var(--bg2);
  border-radius: 3px;
  overflow: hidden;
}
.splash-loader-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 3px;
  animation: loadBar 1.5s ease forwards;
}
@keyframes loadBar {
  0% { width: 0%; }
  100% { width: 100%; }
}

/* ===== Responsive ===== */
@media (min-width: 420px) {
  #app { max-width: 420px; margin: 0 auto; }
  .screen { max-width: 420px; left: 50%; transform: translateX(-50%); }
  .bottom-nav { max-width: 420px; left: 50%; transform: translateX(-50%); }
}
</style>
</head>
<body>

<div id="app">

<!-- ===== SPLASH ===== -->
<div id="screen-splash" class="screen active">
  <div class="splash-logo">LookUs</div>
  <div class="splash-tagline">品牌与用户共建的对抗型社区</div>
  <div class="splash-loader"><div class="splash-loader-bar"></div></div>
</div>

<!-- ===== NEWS SCREEN ===== -->
<div id="screen-news" class="screen">
  <div class="app-header">
    <h1>LookUs</h1>
    <div class="header-actions">
      <button class="icon-btn" aria-label="搜索">&#128269;</button>
      <button class="icon-btn" aria-label="消息">&#128276;</button>
    </div>
  </div>
  <div class="industry-tabs" id="newsTabs"></div>
  <div class="scroll-content" id="newsContent"></div>
</div>

<!-- ===== ARENA SCREEN ===== -->
<div id="screen-arena" class="screen">
  <div class="app-header">
    <h1>品牌角斗场</h1>
    <div class="header-actions">
      <button class="icon-btn" aria-label="筛选">&#9881;</button>
    </div>
  </div>
  <div class="industry-tabs" id="arenaTabs"></div>
  <div class="scroll-content" id="arenaContent"></div>
</div>

<!-- ===== PROFILE SCREEN ===== -->
<div id="screen-profile" class="screen">
  <div class="app-header">
    <h1>我的</h1>
    <div class="header-actions">
      <button class="icon-btn" aria-label="设置">&#9881;</button>

// ===== UTILS =====
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function showScreen(name) {
  $$('.screen').forEach(s => s.classList.remove('active'));
  const target = $('#screen-' + name);
  if (target) target.classList.add('active');
  currentScreen = name;

  // Update nav
  $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.screen === name));
}

function formatNumber(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return n.toString();
}

// ===== RENDER NEWS =====
function renderNewsTabs() {
  const container = $('#newsTabs');
  container.innerHTML = industries.map(ind =>
    `<button class="tab-chip ${ind.id === currentIndustry ? 'active' : ''}" data-industry="${ind.id}">${ind.name}</button>`
  ).join('');

  container.querySelectorAll('.tab-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      currentIndustry = btn.dataset.industry;
      renderNewsTabs();
      renderNewsContent();
    });
  });
}

function renderNewsContent() {
  const container = $('#newsContent');
  const items = newsData[currentIndustry] || [];
  const hotItems = items.filter(i => i.hot);

  let html = '';

  // Hot banner
  if (hotItems.length > 0) {
    html += `<div class="hot-banner">
      <h3><span class="fire">&#128293;</span> 今日热点</h3>`;
    hotItems.slice(0, 3).forEach((item, idx) => {
      html += `<div class="hot-item">
        <span class="hot-rank ${idx < 3 ? 'top' : ''}">${idx + 1}</span>
        <p>${item.title}</p>
        <span class="hot-tag">${item.brand}</span>
      </div>`;
    });
    html += `</div>`;
  }

  // News list
  html += `<div class="section-title"><span class="dot"></span>最新资讯</div>`;
  items.forEach(item => {
    html += `<div class="news-card" data-news-id="${item.id}">
      <div class="news-header">
        <div class="brand-avatar">${item.avatar}</div>
        <div class="brand-info">
          <div class="brand-name">${item.brand}</div>
          <div class="brand-meta">${item.time} · 官方发布</div>
        </div>
      </div>
      <div class="news-title">${item.title}</div>
      <div class="news-image">${item.image}</div>
      <div class="news-actions">
        <span>&#9829; ${formatNumber(item.likes)}</span>
        <span>&#128172; ${formatNumber(item.comments)}</span>
        <span>&#10150; 分享</span>
      </div>
    </div>`;
  });

  container.innerHTML = html;

  // Bind click
  container.querySelectorAll('.news-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = parseInt(card.dataset.newsId);
      showNewsDetail(id);
    });
  });
}

function showNewsDetail(id) {
  let item = null;
  Object.values(newsData).forEach(list => {
    list.forEach(n => { if (n.id === id) item = n; });
  });
  if (!item) return;

  $('#newsDetailContent').innerHTML = `
    <div class="detail-image">${item.image}</div>
    <div class="detail-body">
      <div class="news-header" style="margin-bottom:16px;">
        <div class="brand-avatar">${item.avatar}</div>
        <div class="brand-info">
          <div class="brand-name">${item.brand}</div>

  container.querySelectorAll('.arena-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      showArenaDetail(item.dataset.arenaId);
    });
  });

  // Auto-expand first event
  const firstEvent = container.querySelector('.event-header');
  if (firstEvent) firstEvent.click();
}

function findArenaById(id) {
  for (const industry in arenaHierarchy) {
    for (const event of arenaHierarchy[industry]) {
      for (const zone of event.zones) {
        for (const level of zone.levels) {
          for (const arena of level.arenas) {
            if (arena.id === id) {
              return { arena, event, zone, level };
            }
          }
        }
      }
    }
  }
  return null;
}

function showArenaDetail(id) {
  const result = findArenaById(id);
  if (!result) return;
  const { arena, event, zone, level } = result;

  const rankClass = ['gold', 'silver', 'bronze'];

  $('#arenaDetailContent').innerHTML = `
    <div class="breadcrumb">
      <span>${event.name}</span>
      <span class="crumb-sep">&#8250;</span>
      <span>${zone.name}</span>
      <span class="crumb-sep">&#8250;</span>
      <span>${level.name}</span>
      <span class="crumb-sep">&#8250;</span>
      <span class="crumb-active">${arena.name}</span>
    </div>

    <div style="padding:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h3 style="margin:0;font-size:18px;">${arena.name}</h3>
        <span class="arena-badge">${arena.badge}</span>
      </div>
      <div class="arena-desc" style="margin-bottom:16px;">${arena.desc}</div>

      <div class="leaderboard">
        <div class="lb-header">
          <span>排名</span>
          <span>品牌 / 型号</span>
          <span style="text-align:right;">成绩</span>
        </div>
        ${arena.brands.map((b, i) => `
          <div class="lb-row">
            <span class="lb-rank ${i < 3 ? rankClass[i] : ''}">${b.rank}</span>
            <div class="lb-brand">
              <div class="lb-brand-avatar">${b.name[0]}</div>
              <div>
                <div class="lb-brand-name">${b.name}</div>
                <div class="lb-brand-model">${b.model}</div>
              </div>
            </div>
            <div class="lb-score">${b.score}</div>
          </div>
        `).join('')}
      </div>

      <div class="arena-rules">
        <h4>&#128220; 擂台规则</h4>
        <ul>
          <li>所有数据必须由品牌官方提交，并附第三方机构认证报告</li>
          <li>数据有效期为6个月，过期需重新提交</li>
          <li>用户和品牌均可对数据真实性进行举报</li>
          <li>平台每周进行随机抽查，确保数据准确</li>
          <li>虚假数据一经核实，品牌将被暂停发布权限30天</li>
        </ul>
      </div>

      <div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">
        ${arena.participants} 家品牌参与 · ${arena.updated}更新
      </div>
    </div>
  `;
  showScreen('arena-detail');
}

// ===== RENDER PROFILE =====
function renderProfile() {
  const container = $('#profileContent');

  const consumerMenu = [
    { icon: '&#11088;', text: '我的收藏' },
    { icon: '&#128172;', text: '我的评论' },
    { icon: '&#128276;', text: '消息中心' },
    { icon: '&#128269;', text: '关注管理' },
    { icon: '&#9881;', text: '设置' }
  ];

  const brandMenu = [
    { icon: '&#128240;', text: '资讯管理' },
    { icon: '&#127942;', text: '擂台参与' },
    { icon: '&#128202;', text: '数据报表' },
    { icon: '&#128172;', text: '评论回复' },
    { icon: '&#128100;', text: '认证中心' }
  ];

  const menu = currentRole === 'consumer' ? consumerMenu : brandMenu;
  const roleName = currentRole === 'consumer' ? '消费者' : '品牌方';
  const avatarEmoji = currentRole === 'consumer' ? '&#128100;' : '&#127942;';

  container.innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">${avatarEmoji}</div>
      <div class="profile-name">LookUs 用户</div>
      <div class="profile-role">当前身份：${roleName}</div>
      <div class="role-switcher">
        <button class="role-btn ${currentRole === 'consumer' ? 'active' : ''}" data-role="consumer">消费者</button>
        <button class="role-btn ${currentRole === 'brand' ? 'active' : ''}" data-role="brand">品牌方</button>
      </div>
    </div>
    <div class="profile-stats">
      <div class="stat-card">
        <div class="stat-num">12</div>
        <div class="stat-label">关注行业</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">48</div>
        <div class="stat-label">关注品牌</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">156</div>
        <div class="stat-label">收藏资讯</div>
      </div>
    </div>
    <div class="menu-list">
      ${menu.map(m => `
        <div class="menu-item">
          <div class="menu-icon">${m.icon}</div>
          <div class="menu-text">${m.text}</div>
          <div class="menu-arrow">&#8250;</div>
        </div>
      `).join('')}
    </div>
  `;

  container.querySelectorAll('.role-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentRole = btn.dataset.role;
      renderProfile();
    });
  });
}

// ===== NAVIGATION =====
function initNav() {
  $$('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const screen = btn.dataset.screen;
      showScreen(screen);
      if (screen === 'profile') renderProfile();
    });
  });

  $$('.back-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      showScreen(btn.dataset.back);
    });
  });
}

// ===== INIT =====
function initApp() {
  try {
    renderNewsTabs();
    renderNewsContent();
    renderArenaTabs();
    renderArenaContent();
    renderProfile();
    initNav();

    // Splash -> main after 1.8s
    setTimeout(() => {
      showScreen('news');
    }, 1800);
  } catch (error) {
    console.error(error);
    const fallback = document.createElement('div');
    fallback.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#e8e9ec;font-size:18px;padding:24px;text-align:center;z-index:9999;flex-direction:column;gap:16px;';
    fallback.innerHTML = '<div style="font-size:32px;">&#128531;</div><div>哎呀，出错了，请刷新重试~</div>';
    document.body.innerHTML = '';
    document.body.appendChild(fallback);
  }
}

window.addEventListener('load', initApp);
})();
</script>
</body>
</html>
