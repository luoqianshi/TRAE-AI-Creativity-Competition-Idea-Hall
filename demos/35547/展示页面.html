<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>川南旅行规划助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-purple: #a855f7;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --btn-gradient: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', sans-serif; background: var(--primary-gradient); min-height: 100vh; color: var(--text-primary); overflow-x: hidden; position: relative; }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%); pointer-events: none; z-index: 0; }
        .particles, .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
        .particle { position: absolute; border-radius: 50%; animation: particleFloat 20s infinite ease-in-out; }
        .particle:nth-child(odd) { background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, transparent 70%); }
        .particle:nth-child(even) { background: radial-gradient(circle, rgba(6, 182, 212, 0.4) 0%, transparent 70%); }
        @keyframes particleFloat { 0%, 100% { transform: translateY(100vh) scale(0.5); opacity: 0; } 10% { opacity: 0.8; } 50% { opacity: 0.6; transform: translateY(40vh) scale(1.2); } }
        .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .main-container { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .hero-section { text-align: center; padding: 80px 0 60px; }
        .hero-title { font-family: 'Noto Serif SC', serif; font-size: 5em; font-weight: 900; background: linear-gradient(135deg, #fff 0%, #c4b5fd 50%, #67e8f9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px; letter-spacing: 3px; }
        .hero-subtitle { font-size: 1.6em; color: var(--text-secondary); font-weight: 300; margin-bottom: 30px; }
        .hero-badge { display: inline-block; background: rgba(255,255,255,0.1); backdrop-filter: blur(20px); padding: 12px 40px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); margin-top: 20px; }
        .feature-tags { display: flex; justify-content: center; gap: 20px; margin-top: 40px; flex-wrap: wrap; }
        .feature-tag { background: rgba(255,255,255,0.08); backdrop-filter: blur(15px); padding: 12px 25px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.15); transition: all 0.3s; }
        .feature-tag:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(168,85,247,0.2); }
        .feature-tag i { margin-right: 10px; color: var(--accent-cyan); }
        .input-card { background: var(--card-bg); backdrop-filter: blur(30px); border-radius: 30px; padding: 60px; border: 1px solid var(--card-border); box-shadow: 0 25px 80px rgba(0,0,0,0.3); margin: 40px auto; max-width: 900px; position: relative; }
        .card-title { font-family: 'Noto Serif SC', serif; font-size: 2.2em; margin-bottom: 40px; text-align: center; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 35px; margin-bottom: 50px; }
        .form-group { position: relative; }
        .form-label { display: block; font-size: 1.2em; color: var(--text-secondary); margin-bottom: 15px; display: flex; align-items: center; gap: 12px; }
        .form-label i { color: var(--accent-purple); font-size: 1.3em; }
        .form-input, .form-select { width: 100%; padding: 22px 28px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; font-size: 1.1em; color: var(--text-primary); transition: all 0.3s; outline: none; }
        .form-input:focus, .form-select:focus { border-color: var(--accent-purple); box-shadow: 0 0 0 4px rgba(168,85,247,0.2); transform: translateY(-2px); }
        .form-select option { background: #1a1a2e; }
        .submit-btn { width: 100%; padding: 25px 50px; background: var(--btn-gradient); color: var(--text-primary); border: none; border-radius: 20px; font-size: 1.4em; font-weight: 700; cursor: pointer; transition: all 0.4s; box-shadow: 0 10px 40px rgba(168,85,247,0.4); }
        .submit-btn:hover { transform: translateY(-5px); box-shadow: 0 20px 60px rgba(168,85,247,0.5); }
        .submit-btn i { margin-right: 12px; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,12,41,0.98); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .loading-overlay.active { display: flex; }
        .loading-spinner { width: 100px; height: 100px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent-purple); border-bottom-color: var(--accent-cyan); border-radius: 50%; animation: spin 1.5s linear infinite; margin-bottom: 40px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--text-primary); font-size: 1.6em; font-weight: 300; letter-spacing: 3px; }
        .result-section { display: none; margin-top: 50px; }
        .result-section.active { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; animation: fadeInUp 0.6s; }
        .result-column { display: flex; flex-direction: column; gap: 40px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; } }
        .result-card { background: var(--card-bg); backdrop-filter: blur(30px); border-radius: 30px; padding: 35px; border: 1px solid var(--card-border); box-shadow: 0 20px 60px rgba(0,0,0,0.25); position: relative; }
        .result-title { font-family: 'Noto Serif SC', serif; font-size: 2em; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .result-title i { color: var(--accent-cyan); }
        .day-card { margin-bottom: 25px; border-radius: 15px; background: rgba(78,205,196,0.05); border: 1px solid rgba(78,205,196,0.2); }
        .day-header { display: flex; justify-content: space-between; padding: 15px 20px; background: linear-gradient(135deg, rgba(78,205,196,0.15), rgba(68,160,141,0.1)); cursor: pointer; }
        .day-header h3 { color: #4ECDC4; font-size: 1.3em; }
        .day-content { padding: 20px; }
        .itinerary-content { font-size: 1em; line-height: 2.2; }
        .itinerary-content h2 { font-family: 'Noto Serif SC', serif; font-size: 1.8em; background: linear-gradient(135deg, #c4b5fd, #67e8f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
        .itinerary-content hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); margin: 30px 0; }
        .food-tag { display: inline-block; background: linear-gradient(135deg, rgba(236,72,153,0.2), rgba(168,85,247,0.2)); padding: 10px 20px; border-radius: 25px; margin: 8px; border: 1px solid rgba(236,72,153,0.3); }
        .map-container { width: 100%; height: 450px; border-radius: 25px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .map-placeholder { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; color: var(--text-secondary); }
        .map-placeholder i { font-size: 4em; color: var(--accent-cyan); margin-bottom: 20px; }
        .timeline-container { position: relative; padding-left: 40px; max-height: 500px; overflow-y: auto; }
        .timeline-container::before { content: ''; position: absolute; left: 15px; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--accent-purple), var(--accent-cyan), var(--accent-pink)); }
        .timeline-item { position: relative; margin-bottom: 35px; animation: fadeInLeft 0.5s forwards; opacity: 0; }
        @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; } }
        .timeline-dot { position: absolute; left: -33px; top: 8px; width: 14px; height: 14px; background: var(--accent-purple); border-radius: 50%; box-shadow: 0 0 15px rgba(168,85,247,0.5); }
        .timeline-time { display: inline-block; background: linear-gradient(135deg, rgba(168,85,247,0.2), rgba(6,182,212,0.2)); padding: 6px 18px; border-radius: 20px; font-size: 0.9em; font-weight: 600; margin-bottom: 12px; }
        .timeline-content { background: rgba(0,0,0,0.15); border-radius: 18px; padding: 22px; border-left: 3px solid var(--accent-purple); }
        .timeline-title { font-size: 1.2em; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .timeline-title i { color: var(--accent-cyan); }
        .timeline-desc { font-size: 0.95em; color: var(--text-secondary); line-height: 1.8; }
        .weather-card { background: linear-gradient(135deg, rgba(15,12,41,0.9), rgba(48,43,99,0.9)); backdrop-filter: blur(30px); border-radius: 30px; padding: 35px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; }
        .weather-title { font-family: 'Noto Serif SC', serif; font-size: 1.8em; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
        .weather-title i { color: var(--accent-cyan); }
        .weather-content { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 25px; }
        .weather-day { text-align: center; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); transition: all 0.4s; }
        .weather-day:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(6,182,212,0.2); }
        .weather-day-name { font-size: 0.95em; margin-bottom: 15px; color: var(--text-secondary); }
        .weather-icon { font-size: 3em; margin-bottom: 15px; }
        .weather-temp { font-size: 1.5em; font-weight: 700; margin-bottom: 8px; }
        .weather-desc { font-size: 0.9em; color: var(--text-secondary); }
        .weather-current { background: rgba(255,255,255,0.08); backdrop-filter: blur(15px); padding: 30px; border-radius: 25px; margin-bottom: 30px; display: flex; align-items: center; gap: 40px; }
        .weather-current-icon { font-size: 5em; }
        .weather-current-temp { font-size: 3.5em; font-weight: 900; background: linear-gradient(135deg, #fff, #67e8f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .weather-current-desc { font-size: 1.4em; opacity: 0.9; }
        .weather-current-details { font-size: 1em; opacity: 0.7; color: var(--text-secondary); }
        .footer { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .footer i { color: var(--accent-pink); }
        @media (max-width: 1024px) { .result-section.active { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .hero-title { font-size: 3em; } .input-card { padding: 35px; } .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="stars" id="stars"></div>
    <div class="main-container">
        <section class="hero-section">
            <h1 class="hero-title">🗺️ 川南旅行规划助手</h1>
            <p class="hero-subtitle">让每一次出行都充满期待</p>
            <div class="hero-badge"><i class="fas fa-map-marker-alt"></i> 自贡 · 宜宾</div>
            <div class="feature-tags">
                <div class="feature-tag"><i class="fas fa-route"></i> 智能规划</div>
                <div class="feature-tag"><i class="fas fa-utensils"></i> 美食推荐</div>
                <div class="feature-tag"><i class="fas fa-map"></i> 地图导航</div>
            </div>
        </section>
        <section class="input-card">
            <h2 class="card-title">✨ 开始规划你的旅程</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-location-dot"></i> 目的地</label>
                    <select class="form-select" id="destination" required>
                        <option value="">请选择目的地</option>
                        <option value="自贡">🏛️ 自贡 · 恐龙与灯会的城市</option>
                        <option value="宜宾">🎋 宜宾 · 长江第一城</option>
                        <option value="泸州">🍶 泸州 · 酒城之都</option>
                        <option value="内江">🎨 内江 · 书画之乡</option>
                        <option value="乐山">🗿 乐山 · 大佛之乡</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-calendar-alt"></i> 游玩天数</label>
                    <input type="number" class="form-input" id="days" min="1" max="7" value="2" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-wallet"></i> 预算档位</label>
                    <select class="form-select" id="budget" required>
                        <option value="平价">💵 平价（300-500元/天）</option>
                        <option value="中档" selected>💴 中档（500-800元/天）</option>
                        <option value="高端">💎 高端（800-1500元/天）</option>
                    </select>
                </div>
            </div>
            <button class="submit-btn" onclick="onButtonClick()"><i class="fas fa-magic"></i> 生成专属行程</button>
        </section>
        <div class="loading-overlay" id="loading"><div class="loading-spinner"></div><div class="loading-text">正在为您规划完美行程...</div></div>
        <section class="result-section" id="result-section">
            <div class="result-column">
                <div class="result-card">
                    <h3 class="result-title"><i class="fas fa-clipboard-list"></i> 行程清单</h3>
                    <div class="itinerary-content" id="itinerary-display"></div>
                    <div style="margin-top:30px;padding-top:20px;border-top:1px solid #E0E0E0;">
                        <button class="submit-btn" style="background:linear-gradient(135deg,#4ECDC4,#44A08D);box-shadow:0 8px 25px rgba(78,205,196,0.4);" onclick="shareItinerary()"><i class="fas fa-share-alt"></i> 分享行程</button>
                    </div>
                </div>
            </div>
            <div class="result-column">
                <div class="result-card">
                    <h3 class="result-title"><i class="fas fa-map-marked-alt"></i> 景点地图</h3>
                    <div class="map-container" id="map-container"><div class="map-placeholder"><i class="fas fa-map"></i><p>地图加载中...</p></div></div>
                </div>
                <div class="weather-card" id="weather-card">
                    <h3 class="weather-title"><i class="fas fa-cloud-sun"></i> 天气预报</h3>
                    <div class="weather-current" id="weather-current"><div class="weather-current-icon">☀️</div><div class="weather-current-info"><div class="weather-current-temp">--°C</div><div class="weather-current-desc">加载中...</div><div class="weather-current-details">风力: --</div></div></div>
                    <div class="weather-content" id="weather-content"></div>
                </div>
                <div class="result-card">
                    <h3 class="result-title"><i class="fas fa-clock"></i> 推荐时间计划</h3>
                    <div class="timeline-container" id="timeline-container"><div class="timeline-placeholder"><i class="fas fa-calendar-alt"></i><p>请先生成行程</p></div></div>
                </div>
            </div>
        </section>
        <footer class="footer"><p>© 2026 川南旅行规划助手 · Made with <i class="fas fa-heart" style="color:#FF6B6B;"></i></p></footer>
    </div>
    <script>

/span>`;});h+=`</div><hr><h2 style="color:#4ECDC4;">💡 省钱攻略</h2><ul style="list-style:none;padding:0;">`;data.moneySavingTips.forEach(t=>{h+=`<li style="margin:10px 0;padding-left:20px;"><i class="fas fa-check-circle" style="color:#4ECDC4;"></i>${t}</li>`;});h+=`</ul>`;id.innerHTML=h;}

        function displayTimeline(data){const tc=document.getElementById('timeline-container');let html='';data.dailyPlans.forEach(day=>{html+=`<div style="margin:40px 0 30px;font-family:'Noto Serif SC',serif;font-size:1.6em;background:linear-gradient(135deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">📅 Day ${day.day}</div>`;const plans=[{time:'09:00-12:00',icon:'sun',title:day.morning.name,desc:day.morning.address},{time:'12:00-13:30',icon:'utensils',title:day.lunch.name,desc:day.lunch.desc+' · '+day.lunch.price},{time:'14:00-17:00',icon:'image',title:day.afternoon.name,desc:day.afternoon.address},{time:'18:00-19:30',icon:'moon',title:day.dinner.name,desc:day.dinner.desc+' · '+day.dinner.price}];plans.forEach(p=>{html+=`<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-time">${p.time}</div><div class="timeline-content"><div class="timeline-title"><i class="fas fa-${p.icon}"></i>${p.title}</div><div class="timeline-desc">${p.desc}</div></div></div>`;});});tc.innerHTML=html;}
        function initMap(data){try{const cp={'自贡':[104.77,29.34],'宜宾':[104.62,28.76],'泸州':[105.35,28.88],'内江':[105.05,29.57],'乐山':[103.76,29.56]};const center=cp[data.city]||[104.77,29.34];if(currentMap)currentMap.destroy();const map=new AMap.Map('map-container',{zoom:11,center:center,viewMode:'2D'});currentMap=map;const md=[];data.dailyPlans.forEach(day=>{md.push({name:day.morning.name,city:data.city});md.push({name:day.afternoon.name,city:data.city});});let added=0;md.forEach(place=>{AMap.plugin('AMap.PlaceSearch',function(){const ps=new AMap.PlaceSearch({city:place.city,pageSize:1});ps.search(place.name,function(status,result){if(status==='complete'&&result.poiList&&result.poiList.pois.length>0){const loc=result.poiList.pois[0].location;const marker=new AMap.Marker({position:loc,map:map,title:place.name,animation:AMap.Animation.DROP});const iw=new AMap.InfoWindow({content:`<div style="padding:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-radius:15px;"><h4>${place.name}</h4></div>`,offset:new AMap.Pixel(0,-30)});marker.on('click',function(){iw.open(map,marker.getPosition());});markersData[place.name]={marker,infoWindow:iw,location:loc};added++;if(added===md.length)map.setFitView();}});});});}catch(e){console.error('地图初始化失败',e);}}
        document.addEventListener('DOMContentLoaded',function(){createParticles();loadAmapScript();});
    </script>
