<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>技能罗盘 v1.4</title>
<style>
*{box-sizing:border-box}
:root{--p:#0f766e;--p-h:#115e59;--p-l:#99f6e4;--p-t:#f0fdfa;--p-dt:#2dd4bf;--p-db:#042f2e}
html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;color:#18181b;background:#fafafa;min-height:100vh;margin:0;padding:0;-webkit-font-smoothing:antialiased}
.svg-ic{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.svg-ic svg{display:block;width:1em;height:1em;fill:currentColor}
body.dark{background:#09090b;color:#fafafa}
body.senior{font-size:18px}
body.senior .btn{padding:16px 24px}
body.no-anim *{animation:none!important;transition:none!important}

.top-bar{position:sticky;top:0;background:rgba(250,250,250,.95);backdrop-filter:blur(12px);padding:12px 16px;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;justify-content:space-between;z-index:100;height:56px}
body.dark .top-bar{background:rgba(9,9,11,.95);border-bottom-color:#27272a}
.top-bar .loc-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#fff;border:1px solid #e4e4e7;border-radius:999px;font-size:13px;color:var(--p);cursor:pointer;font-weight:600;transition:all .15s}
body.dark .top-bar .loc-btn{background:#18181b;border-color:#27272a;color:var(--p-dt)}
.top-bar .loc-btn:hover{border-color:var(--p)}
.logo{font-weight:800;font-size:17px;color:#18181b;letter-spacing:-.02em}
body.dark .logo{color:#fafafa}
.top-bar .act{display:flex;gap:8px}
.top-bar .act button{height:36px;border-radius:999px;border:1px solid #e4e4e7;background:#fff;cursor:pointer;font-size:13px;color:#52525b;font-weight:600;transition:all .15s;padding:0 14px;white-space:nowrap}
body.dark .top-bar .act button{background:#18181b;border-color:#27272a;color:#a1a1aa}
.top-bar .act button:hover{border-color:var(--p);color:var(--p)}

main{max-width:640px;margin:0 auto;padding:16px;padding-bottom:100px}

.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;border:1px solid #e4e4e7;box-shadow:0 1px 3px rgba(0,0,0,.04)}
body.dark .card{background:#18181b;border-color:#27272a}
.card-title{font-size:15px;font-weight:700;color:#18181b;margin-bottom:14px;letter-spacing:-.01em}
body.dark .card-title{color:#fafafa}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;border:none;background:var(--p);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--p-h)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sec{background:#f4f4f5;color:#3f3f46;border:1px solid #e4e4e7}
.btn-sec:hover{background:#e4e4e7}
.btn-ghost{background:transparent;color:var(--p);border:1.5px solid var(--p-l)}
.btn-ghost:hover{background:var(--p-t)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:8px}
.btn-full{width:100%}
body.dark .btn-sec{background:#27272a;color:#d4d4d8;border-color:#3f3f3f}
body.dark .btn-ghost{color:var(--p-dt);border-color:var(--p-h)}

.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,250,.96);backdrop-filter:blur(12px);padding:8px 12px 16px;border-top:1px solid #e4e4e7;z-index:99}
body.dark .nav-bar{background:rgba(9,9,11,.96);border-top-color:#27272a}
.nav-row{display:grid;grid-template-columns:repeat(6,1fr);max-width:640px;margin:0 auto}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;cursor:pointer;color:#71717a;border:none;background:transparent;font-size:11px;font-weight:600;position:relative;transition:all .15s;min-width:0}
.nav-item .nav-lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nav-item.active{color:var(--p);background:var(--p-t)}
body.dark .nav-item.active{background:var(--p-db)}

.home-hero{text-align:center;padding:32px 20px 24px}
.home-big{font-size:26px;font-weight:800;color:#18181b;margin-bottom:8px;letter-spacing:-.02em}
body.dark .home-big{color:#fafafa}
.home-sub{font-size:15px;color:#52525b;margin-bottom:24px;line-height:1.6;max-width:320px;margin-left:auto;margin-right:auto}
body.dark .home-sub{color:#a1a1aa}
.home-compass{width:68px;height:68px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--p-t);color:var(--p);border:1px solid var(--p-l)}
body.dark .home-compass{background:var(--p-db);color:var(--p-dt);border-color:var(--p-h)}
.home-compass svg{width:36px;height:36px;fill:currentColor;animation:compass-spin 10s linear infinite}
.home-start{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 32px;font-size:16px;border-radius:12px;background:var(--p);color:#fff;font-weight:700;border:none;cursor:pointer;transition:all .15s;box-shadow:0 4px 14px rgba(15,118,110,.2)}
.home-start:hover{background:var(--p-h)}
.home-start:active{transform:scale(.98)}

.step-card{display:flex;align-items:center;gap:14px;padding:14px;background:#fff;border-radius:12px;margin-bottom:8px;border:1px solid #e4e4e7}
body.dark .step-card{background:#18181b;border-color:#27272a}
.step-card .num{width:28px;height:28px;border-radius:50%;background:#f4f4f5;color:#52525b;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.step-card .body{flex:1}
.step-card .body .t{font-size:14px;font-weight:700;color:#18181b;margin-bottom:2px}
body.dark .step-card .body .t{color:#fafafa}
.step-card .body .d{font-size:12px;color:#71717a;line-height:1.5}

.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.feature-card{background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:all .15s}
.feature-card:hover{border-color:var(--p);box-shadow:0 4px 12px rgba(15,118,110,.08)}
body.dark .feature-card{background:#18181b;border-color:#27272a}
.feature-card .fc-ic{width:40px;height:40px;border-radius:10px;background:var(--p-t);color:var(--p);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin:0 auto 10px}
.feature-card .fc-t{font-size:14px;font-weight:700;color:#18181b;margin-bottom:4px}
body.dark .feature-card .fc-t{color:#fafafa}
.feature-card .fc-d{font-size:11px;color:#71717a}

.feature-list{display:flex;flex-direction:column;gap:10px;margin:20px 0}
.feature-list-item{display:flex;align-items:center;gap:14px;padding:14px;background:#fff;border:1px solid #e4e4e7;border-radius:14px;cursor:pointer;transition:all .15s}
body.dark .feature-list-item{background:#18181b;border-color:#27272a}
.feature-list-item:hover{border-color:var(--p);background:#fafafa}
body.dark .feature-list-item:hover{background:#27272a}
.feature-list-item .fli-ic{width:42px;height:42px;border-radius:12px;background:var(--p-t);color:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0}
body.dark .feature-list-item .fli-ic{background:var(--p-db);color:var(--p-dt)}
.feature-list-item .fli-ic svg{width:22px;height:22px;fill:currentColor}
.feature-list-item .fli-info{flex:1;min-width:0}
.feature-list-item .fli-t{font-size:15px;font-weight:700;color:#18181b;margin-bottom:2px}
body.dark .feature-list-item .fli-t{color:#fafafa}
.feature-list-item .fli-d{font-size:13px;color:#71717a}
.feature-list-item .fli-arrow{color:#a1a1aa;font-size:18px;flex-shrink:0}

.q-card{padding:20px;background:#fff;border-radius:16px;margin-bottom:14px;border:1px solid #e4e4e7}
body.dark .q-card{background:#18181b;border-color:#27272a}
.q-q{font-size:16px;font-weight:700;color:#18181b;margin-bottom:18px;line-height:1.5}
body.dark .q-q{color:#fafafa}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid #e4e4e7;border-radius:12px;cursor:pointer;background:#fff;font-size:15px;color:#18181b;width:100%;text-align:left;margin-bottom:8px;transition:all .15s}
body.dark .opt{background:#18181b;border-color:#27272a;color:#fafafa}
.opt:hover{border-color:var(--p);background:#fafafa}
body.dark .opt:hover{background:#27272a}
.opt.selected{border-color:var(--p);background:var(--p-t);color:var(--p);font-weight:600}
body.dark .opt.selected{background:var(--p-db);color:var(--p-dt)}
.opt .box{width:20px;height:20px;border:2px solid #d4d4d8;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.opt.selected .box{border-color:var(--p);background:var(--p);color:#fff;font-size:11px}
.opt.selected .box::before{content:"✓"}
.inp{width:100%;padding:12px 14px;border:1.5px solid #e4e4e7;border-radius:10px;font-size:15px;color:#18181b;background:#fff;outline:none;transition:border-color .15s}
body.dark .inp{background:#18181b;border-color:#27272a;color:#fafafa}
.inp:focus{border-color:var(--p)}
.ta{width:100%;padding:12px 14px;border:1.5px solid #e4e4e7;border-radius:10px;font-size:15px;color:#18181b;background:#fff;outline:none;min-height:100px;resize:vertical;font-family:inherit;transition:border-color .15s}
body.dark .ta{background:#18181b;border-color:#27272a;color:#fafafa}
.ta:focus{border-color:var(--p)}
.btn-row{display:flex;gap:10px;margin-top:18px}
.pg{height:4px;background:#e4e4e7;border-radius:2px;overflow:hidden;margin-top:10px}
.pg-fill{height:100%;background:var(--p);border-radius:2px;transition:width .4s}

.thinking{text-align:center;padding:40px 20px}
.th-ic{width:64px;height:64px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--p-t);color:var(--p);font-size:30px;font-weight:700;animation:spin 1.5s linear infinite}.th-ic svg{width:34px;height:34px;fill:currentColor}
body.dark .th-ic{background:var(--p-db);color:var(--p-dt)}
.th-steps{display:flex;flex-direction:column;gap:8px;text-align:left;margin-top:24px}
.th-step{padding:12px 16px;background:#fff;border-radius:10px;font-size:13px;color:#71717a;border:1px solid #e4e4e7;display:flex;align-items:center;gap:10px}
body.dark .th-step{background:#18181b;border-color:#27272a}
.th-step.active{color:var(--p);background:var(--p-t);border-color:var(--p-l);font-weight:600}
body.dark .th-step.active{background:var(--p-db);color:var(--p-dt)}
.th-step.done{color:#16a34a;background:#f0fdf4;border-color:#bbf7d0}
body.dark .th-step.done{background:#052e16;color:#86efac;border-color:#166534}

.j-card{padding:16px;background:#fff;border-radius:16px;margin-bottom:12px;border:1px solid #e4e4e7}
body.dark .j-card{background:#18181b;border-color:#27272a}
.j-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.j-rank{width:36px;height:36px;border-radius:10px;background:#f4f4f5;color:#52525b;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.j-nm{font-size:15px;font-weight:700;color:#18181b}
body.dark .j-nm{color:#fafafa}
.j-score{font-size:20px;font-weight:800;color:var(--p);white-space:nowrap;text-align:right}
.j-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.j-tag{display:inline-block;padding:4px 10px;background:#f4f4f5;color:#52525b;border-radius:999px;font-size:12px;font-weight:600}
.j-tag.g{background:#f0fdf4;color:#15803d}
.j-desc{font-size:13px;color:#52525b;margin:10px 0;line-height:1.6}
body.dark .j-desc{color:#d4d4d8}
.j-fit{background:#f0fdf4;border-radius:10px;padding:12px 14px;margin:10px 0;border:1px solid #bbf7d0}
body.dark .j-fit{background:#052e16;border-color:#166534}
.j-fit-title{font-size:13px;font-weight:700;color:#15803d;margin-bottom:6px}
body.dark .j-fit-title{color:#86efac}
.j-fit-list{font-size:13px;color:#18181b;line-height:1.7}
.j-ent{background:#fafafa;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #e4e4e7}
body.dark .j-ent{background:#18181b;border-color:#27272a}
.j-ent-title{font-size:12px;color:#71717a;font-weight:700;margin-bottom:8px}
.j-ent-row{padding:10px 0;border-bottom:1px solid #e4e4e7}
.j-ent-row:last-child{border-bottom:none}
.j-ent-nm{font-size:13px;font-weight:600;color:#18181b}
body.dark .j-ent-nm{color:#fafafa}
.j-ent-ad{font-size:12px;color:#71717a;margin:2px 0}
.j-ent-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.map-card{padding:14px;background:var(--p-t);border-radius:10px;margin-top:10px;border:1px solid var(--p-l)}
body.dark .map-card{background:var(--p-db);border-color:var(--p-h)}
.map-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.map-opt{padding:10px 4px;background:#fff;border-radius:8px;text-align:center;cursor:pointer;border:1px solid #e4e4e7;font-size:12px;color:#18181b;transition:all .15s}
body.dark .map-opt{background:#18181b;border-color:#27272a;color:#fafafa}
.map-opt:hover{border-color:var(--p);background:#fafafa}
body.dark .map-opt:hover{background:#27272a}
.map-opt .ic{font-size:18px;display:block;margin-bottom:4px;color:var(--p)}.map-opt .ic svg{width:22px;height:22px;fill:currentColor}

.lp-step{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border-radius:12px;margin-bottom:10px;border:1px solid #e4e4e7}
body.dark .lp-step{background:#18181b;border-color:#27272a}
.lp-step.done{background:#f0fdf4;border-color:#bbf7d0}
body.dark .lp-step.done{background:#052e16;border-color:#166534}
.lp-step .idx{width:32px;height:32px;border-radius:8px;background:#f4f4f5;color:#52525b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.lp-step.done .idx{background:#16a34a;color:#fff}
.lp-step .bdy{flex:1}
.lp-step .bdy .t{font-size:14px;font-weight:700;color:#18181b;margin-bottom:4px}
body.dark .lp-step .bdy .t{color:#fafafa}
.lp-step.done .bdy .t{color:#15803d}
body.dark .lp-step.done .bdy .t{color:#86efac}
.lp-step .bdy .d{font-size:12px;color:#71717a;line-height:1.6}
.lp-step .chck{width:28px;height:28px;border-radius:50%;border:2px solid #e4e4e7;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#a1a1aa;flex-shrink:0;transition:all .15s}
body.dark .lp-step .chck{background:#18181b;border-color:#27272a;color:#71717a}
.lp-step.done .chck{background:#16a34a;border-color:#16a34a;color:#fff}

.set-group{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:12px;border:1px solid #e4e4e7}
body.dark .set-group{background:#18181b;border-color:#27272a}
.set-item{padding:14px 16px;border-bottom:1px solid #f4f4f5;display:flex;align-items:center;gap:12px;cursor:pointer}
.set-item:last-child{border-bottom:none}
.set-item:hover{background:#fafafa}
body.dark .set-item:hover{background:#27272a}
.set-ic{width:32px;height:32px;border-radius:8px;background:#f4f4f5;color:#52525b;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.set-main{flex:1}
.set-main .t{font-size:15px;font-weight:600;color:#18181b}
body.dark .set-main .t{color:#fafafa}
.set-main .s{font-size:12px;color:#a1a1aa;margin-top:2px}
.set-arrow{color:#a1a1aa;font-size:16px}
.set-switch{width:44px;height:24px;background:#e4e4e7;border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.set-switch.on{background:var(--p)}
.set-switch::before{content:"";position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.set-switch.on::before{transform:translateX(20px)}

.sub-page{position:fixed;top:0;left:0;right:0;bottom:0;background:#fafafa;z-index:200;overflow-y:auto;display:none}
body.dark .sub-page{background:#09090b}
.sub-page.active{display:block}
.sub-head{position:sticky;top:0;background:rgba(250,250,250,.95);backdrop-filter:blur(12px);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e4e4e7;z-index:10}
body.dark .sub-head{background:rgba(9,9,11,.95);border-bottom-color:#27272a}
.sub-head button{padding:8px 14px;background:transparent;border:1px solid #e4e4e7;border-radius:8px;font-size:14px;color:#52525b;font-weight:600;cursor:pointer;transition:all .15s}
.sub-head h3{flex:1;font-size:16px;font-weight:700;color:#18181b;margin:0;text-align:center}
body.dark .sub-head h3{color:#fafafa}
.sub-body{max-width:640px;margin:0 auto;padding:16px;padding-bottom:40px}
.theme-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.theme-swatch{width:100%;aspect-ratio:1;border-radius:14px;cursor:pointer;position:relative;transition:all .15s;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.theme-swatch:hover{transform:scale(1.05)}
.theme-swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--p),0 4px 12px rgba(15,118,110,.2);transform:scale(1.05)}
.bg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bg-swatch{width:100%;aspect-ratio:1.5;border-radius:12px;cursor:pointer;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .15s}
.bg-swatch:hover{transform:scale(1.03)}
.bg-swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--p),0 4px 12px rgba(15,118,110,.2);transform:scale(1.03)}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(9,9,11,.5);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal.active{display:flex;animation:fade .2s ease}
.modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;padding:24px 20px;animation:slide .25s cubic-bezier(.4,0,.2,1);position:relative}
body.dark .modal-box{background:#18181b}
.modal h3{font-size:17px;font-weight:700;color:#18181b;margin:0 0 18px;text-align:center}
body.dark .modal h3{color:#fafafa}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:1px solid #e4e4e7;background:#fff;color:#71717a;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
body.dark .modal-close{background:#18181b;border-color:#27272a;color:#a1a1aa}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#18181b;color:#fff;border-radius:999px;font-size:14px;font-weight:600;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.empty{text-align:center;padding:50px 20px}
.empty .ic{width:64px;height:64px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#f4f4f5;color:#71717a;font-size:28px;font-weight:700}.empty .ic svg{width:32px;height:32px;fill:currentColor}
.empty h3{font-size:17px;font-weight:700;color:#18181b;margin-bottom:6px;margin-top:0}
body.dark .empty h3{color:#fafafa}
.empty p{font-size:14px;color:#71717a;margin-bottom:18px}
.loc-btn-hero{padding:14px;background:var(--p-t);border-radius:12px;text-align:center;cursor:pointer;margin-bottom:14px;border:1.5px dashed var(--p-l);font-weight:700;color:var(--p);font-size:14px;transition:all .15s}
body.dark .loc-btn-hero{background:var(--p-db);border-color:var(--p-h);color:var(--p-dt)}
.loc-btn-hero:hover{background:var(--p-t)}
.loc-btn-hero.loading{pointer-events:none;opacity:.6}
.loc-label{font-size:11px;font-weight:700;color:#71717a;margin:12px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.loc-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}

function icon(n){ return '<span class="svg-ic">' + (ICONS[n] || '') + '</span>'; }
function loadState() {
  try {
    var s = localStorage.getItem(STORAGE_KEY);
    if (!s) return;
    var obj = JSON.parse(s);
    if (obj && typeof obj === "object") {
      state.province = obj.province || ""; state.city = obj.city || ""; state.district = obj.district || "";
      state.answers = obj.answers || {};
      state.selectedJobId = obj.selectedJobId || null;
      state.recommendedJobs = obj.recommendedJobs || [];
      state.learningDone = obj.learningDone || {};
      state.interviewReport = obj.interviewReport || null;
      state.firstUse = obj.firstUse === undefined ? true : obj.firstUse;
      state.currentPage = obj.currentPage || "home";
      state.settings = obj.settings || state.settings;
      state.currentQuestionIndex = obj.currentQuestionIndex || 0;
      applySettings();
    }
  } catch (e) {}
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {} }
function applySettings() {
  document.body.classList.toggle("dark", state.settings.dark);
  document.body.classList.toggle("senior", state.settings.elder);
  document.body.classList.toggle("no-anim", state.settings.noAnim);
  document.getElementById("locText").textContent = state.city ? (state.district ? state.city + "·" + state.district : state.city) : "选择地区";
  applyTheme();
}

/* ============ Toast & Modal ============ */
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(function () { el.classList.remove("show"); }, 1800);
}
function showModal(html) {
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modal").classList.add("active");
}
function hideModal() { document.getElementById("modal").classList.remove("active"); }
document.getElementById("modalClose").addEventListener("click", hideModal);
document.getElementById("modal").addEventListener("click", function (e) { if (e.target.id === "modal") hideModal(); });

/* ============ 地区选择 ============ */
function openLocationModal() {
  var html = '<h3>选择您所在的地区</h3>';
  html += '<div style="font-size:13px;color:#71717a;margin:0 0 12px;text-align:center">选择后为您匹配本地岗位</div>';
  html += '<div class="loc-btn-hero" id="autoLocBtn">自动定位我所在的城市</div>';
  html += '<div class="loc-label">选择省份</div>';
  html += '<div class="loc-grid">';
  var provinces = Object.keys(REGION_DATA);
  for (var i = 0; i < provinces.length; i++) {
    html += '<div class="loc-btn" data-prov="' + provinces[i] + '">' + provinces[i] + '</div>';
  }
  html += '</div>';
  showModal(html);
  document.getElementById("autoLocBtn").addEventListener("click", autoLocate);
  var provBtns = document.querySelectorAll("[data-prov]");
  for (var p = 0; p < provBtns.length; p++) {
    (function (el) {
      el.addEventListener("click", function () { pickProvince(el.getAttribute("data-prov")); });
    })(provBtns[p]);
  }
}
function autoLocate() {
  if (!navigator.geolocation) {
    toast("您的浏览器不支持自动定位");
    return;
  }
  toast("正在获取位置…");
  var btn = document.getElementById("autoLocBtn");
  if (btn) btn.classList.add("loading");
  navigator.geolocation.getCurrentPosition(function (pos) {
    if (btn) btn.classList.remove("loading");
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    var city = nearestCity(lat, lng);
    if (city) {
      state.city = city.city;
      state.province = city.province;
      state.district = "";
      applySettings();
      saveState(); hideModal();
      toast("已定位：" + city.province + "·" + city.city);
      var page = state.currentPage || "home";
      renderPage(page);
    } else {
      toast("未识别到附近城市，请手动选择");
    }
  }, function (err) {
    if (btn) btn.classList.remove("loading");
    toast("定位失败：" + (err.message || "请检查权限"));
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 });
}

function pickProvince(prov) {
  state.province = prov;
  var cities = Object.keys(REGION_DATA[prov]);
  var html = '<h3>' + prov + '</h3>';
  html += '<div style="font-size:13px;color:#71717a;margin:0 0 14px;text-align:center">请选择城市</div>';
  html += '<div style="display:grid;grid-template-columns:1fr;gap:8px">';
  for (var i = 0; i < cities.length; i++) {
    html += '<button class="btn btn-sec" data-city="' + cities[i] + '" style="justify-content:flex-start;padding:12px 14px">' + cities[i] + '</button>';
  }
  html += '<button class="btn btn-ghost" id="backProv" style="margin-top:10px">返回省份</button></div>';
  showModal(html);
  document.getElementById("backProv").addEventListener("click", openLocationModal);
  var cityBtns = document.querySelectorAll("[data-city]");
  for (var c = 0; c < cityBtns.length; c++) {
    (function (el) {
      el.addEventListener("click", function () { pickCity(prov, el.getAttribute("data-city")); });
    })(cityBtns[c]);
  }
}
function pickCity(prov, city) {
  state.city = city;
  var districts = REGION_DATA[prov][city] || [];
  if (districts.length === 0) { doneLocation(); return; }
  var html = '<h3>' + prov + ' · ' + city + '</h3>';
  html += '<div style="font-size:13px;color:#71717a;margin:0 0 14px;text-align:center">请选择区（可不选）</div>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  for (var i = 0; i < districts.length; i++) {
    html += '<button class="btn btn-sec" data-dist="' + districts[i] + '" style="padding:10px;font-size:13px">' + districts[i] + '</button>';
  }
  html += '</div>';
  html += '<button class="btn btn-ghost" id="backCity" style="margin-top:14px">返回城市</button>';
  html += '<button class="btn btn-full" id="confirmCity" style="margin-top:10px">确认使用 ' + city + '</button>';
  showModal(html);
  document.getElementById("backCity").addEventListener("click", function () { pickProvince(prov); });
  document.getElementById("confirmCity").addEventListener("click", doneLocation);
  var distBtns = document.querySelectorAll("[data-dist]");
  for (var d = 0; d < distBtns.length; d++) {
    (function (el) {
      el.addEventListener("click", function () {
        state.district = el.getAttribute("data-dist"); doneLocation();
      });
    })(distBtns[d]);
  }
}
function doneLocation() {
  document.getElementById("locText").textContent = state.city ? (state.district ? state.city + "·" + state.district : state.city) : "选择地区";
  saveState(); hideModal();
  toast("已设置：" + (state.city || state.province));
}
document.getElementById("btnLoc").addEventListener("click", openLocationModal);

/* ============ 导航 ============ */
document.querySelectorAll(".nav-item").forEach(function (el) {
  el.addEventListener("click", function () {
    var page = el.getAttribute("data-page");
    document.querySelectorAll(".nav-item").forEach(function (n) { n.classList.remove("active"); });
    el.classList.add("active"); renderPage(page);
  });
});
function goTo(page) {
  document.querySelectorAll(".nav-item").forEach(function (n) {
    n.classList.toggle("active", n.getAttribute("data-page") === page);
  });
  renderPage(page);
}
function renderPage(page) {
  state.currentPage = page;
  var app = document.getElementById("app");
  if (!app) return;
  if (page === "home") renderHome(app);
  else if (page === "assessment") renderAssessment(app);
  else if (page === "result") renderResult(app);
  else if (page === "learning") renderLearning(app);
  else if (page === "resume") renderResume(app);
  else if (page === "settings") renderSettings(app);
  else renderHome(app);
}

/* ============ 首页 ============ */

  html += '<div class="feature-list-item" id="ca4"><div class="fli-ic">' + icon('card') + '</div><div class="fli-info"><div class="fli-t">职业名片</div><div class="fli-d">生成专属求职名片</div></div><div class="fli-arrow">' + icon('chevron') + '</div></div>';
  html += '</div>';
  if (hasData) {
    html += '<div class="card"><div class="card-title">推荐岗位</div>';
    var topJobs = state.recommendedJobs.slice(0, 3);
    for (var i = 0; i < topJobs.length; i++) {
      var job = topJobs[i].job || topJobs[i];
      var score = topJobs[i].score || 0;
      html += '<div class="hj-item">';
      html += '<div class="hj-rank">' + (i + 1) + '</div>';
      html += '<div class="hj-info"><div class="hj-name">' + job.name + '</div><div class="hj-meta">' + job.cat + ' · ' + job.salaryMin + '-' + job.salaryMax + '元</div></div>';
      html += '<div class="hj-score">' + score + '%</div>';
      html += '</div>';
    }
    html += '<button class="btn btn-full btn-ghost" id="homeMoreBtn" style="margin-top:12px">查看全部推荐</button></div>';
  }
  app.innerHTML = html;
  document.getElementById("homeStartBtn").addEventListener("click", function () {

  });

    document.getElementById("homeMoreBtn").addEventListener("click", function () { goTo("result"); });

/* ============ 测评页 ============ */
function renderAssessment(app) {
  var total = QUESTIONS.length;
  var idx = state.currentQuestionIndex;
  if (idx >= total) { return showThinking(); }
  var q = QUESTIONS[idx];
  var html = '';
  html += '<div class="card q-header"><div class="label">第 ' + (idx + 1) + ' 题 / 共 ' + total + ' 题</div>';

/* ============ 匹配算法 ============ */
function computeMatch() {
  var answers = state.answers;
  var pool = [];
  if (state.city) {
    for (var i = 0; i < JOBS.length; i++) { if (JOBS[i].city === state.city) pool.push(JOBS[i]); }
  }
  if (pool.length === 0) pool = JOBS.slice();
  var skills = answers.skills || [];
  var digital = answers.digital;
  var workStyle = answers.workStyle;
  var physical = answers.physical;
  var edu = answers.education;
  var lic = answers.hasLicense;
  var env = answers.workEnvironment;

  var results = [];
  for (var j = 0; j < pool.length; j++) {
    var job = pool[j];
    var score = 40;
    var reasons = [];
    var required = job.requiredSkills || [];
    if (skills.length > 0 && required.length > 0) {
      var matched = 0;
      for (var s = 0; s < skills.length; s++) { if (required.indexOf(skills[s]) !== -1) matched++; }
      if (matched === required.length) { score += 20; reasons.push("技能完全匹配"); }
      else if (matched > 0) { score += 10; reasons.push("部分技能匹配"); }
    } else if (required.length === 0) score += 15;

    if (workStyle === job.workStyle) { score += 10; reasons.push("工作方式偏好匹配"); }
    var dlMap = { none: 0, basic: 1, proficient: 2, expert: 3 };
    var userDl = typeof dlMap[digital] !== "undefined" ? dlMap[digital] : 1;
    var jobDl = typeof dlMap[job.digitalLevel] !== "undefined" ? dlMap[job.digitalLevel] : 1;
    if (userDl >= jobDl) { score += 10; reasons.push("数码工具能力达标"); }
    else if (userDl + 1 >= jobDl) score += 5;
    var physMap = { light: 0, medium: 1, heavy: 2 };
    var userP = typeof physMap[physical] !== "undefined" ? physMap[physical] : 1;
    var jobP = typeof physMap[job.physicalLevel] !== "undefined" ? physMap[job.physicalLevel] : 1;
    if (userP >= jobP) { score += 8; reasons.push("体力匹配"); }
    var eduMap = { none: 0, primary: 1, middle: 2, high: 3, college: 4, bachelor: 5 };
    var ue = typeof eduMap[edu] !== "undefined" ? eduMap[edu] : 2;
    var je = typeof eduMap[job.education] !== "undefined" ? eduMap[job.education] : 0;
    if (ue >= je) score += 6;
    if (lic && lic !== "none") score += 3;
    if (!job.licenseRequired) score += 2;
    if (env === job.env || env === "any") { score += 3; reasons.push("工作环境偏好匹配"); }
    if (score > 100) score = 100;
    results.push({ job: job, score: score, reasons: reasons });
  }
  results.sort(function (a, b) { return b.score - a.score; });
  state.recommendedJobs = results.slice(0, 5);
  saveState();
}

/* ============ 雷达图 ============ */
function drawRadar() {
  var canvas = document.getElementById("radar");
  if (!canvas) return;
  var rect = canvas.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  var W = Math.max(1, Math.floor(rect.width));
  var H = Math.max(1, Math.floor(rect.height));
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  var ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var cx = W / 2, cy = H / 2;
  var R = Math.min(W, H) / 2 - 30;
  var skills = answersToSkills();
  var labels = skills.labels;
  var values = skills.values;
  var n = labels.length;
  ctx.clearRect(0, 0, W, H);
  // 网格
  for (var lv = 1; lv <= 5; lv++) {
    ctx.beginPath();
    for (var k = 0; k < n; k++) {
      var a = -Math.PI / 2 + (2 * Math.PI * k) / n;
      var x = cx + Math.cos(a) * R * lv / 5;
      var y = cy + Math.sin(a) * R * lv / 5;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = document.body.classList.contains("dark") ? "#3f3f46" : "#e4e4e7";
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // 轴线
  for (var a2 = 0; a2 < n; a2++) {
    var ang = -Math.PI / 2 + (2 * Math.PI * a2) / n;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
    ctx.strokeStyle = document.body.classList.contains("dark") ? "#52525b" : "#d4d4d8";
    ctx.stroke();
  }
  // 数据多边形
  var grad = ctx.createLinearGradient(0, 0, W, H);
  var pColor = getComputedStyle(document.documentElement).getPropertyValue("--p").trim() || "#0f766e";
  var c = hexToRgb(pColor);
  grad.addColorStop(0, "rgba(" + c.r + "," + c.g + "," + c.b + ",0.3)");
  grad.addColorStop(1, "rgba(" + c.r + "," + c.g + "," + c.b + ",0.15)");
  ctx.beginPath();
  for (var p = 0; p < n; p++) {
    var ang2 = -Math.PI / 2 + (2 * Math.PI * p) / n;
    var vv = Math.max(0, Math.min(100, values[p]));
    var xx = cx + Math.cos(ang2) * R * vv / 100;
    var yy = cy + Math.sin(ang2) * R * vv / 100;
    if (p === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
  }
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = pColor;
  ctx.lineWidth = 2;
  ctx.stroke();
  // 数据点
  for (var q = 0; q < n; q++) {
    var ang3 = -Math.PI / 2 + (2 * Math.PI * q) / n;
    var v2 = Math.max(0, Math.min(100, values[q]));
    var x2 = cx + Math.cos(ang3) * R * v2 / 100;
    var y2 = cy + Math.sin(ang3) * R * v2 / 100;
    ctx.beginPath();
    ctx.arc(x2, y2, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = pColor;
    ctx.stroke();
  }
  // 标签
  ctx.font = "12px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillStyle = document.body.classList.contains("dark") ? "#d4d4d8" : "#52525b";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (var lb = 0; lb < n; lb++) {
    var ang4 = -Math.PI / 2 + (2 * Math.PI * lb) / n;
    var lx = cx + Math.cos(ang4) * (R + 18);
    var ly = cy + Math.sin(ang4) * (R + 18);
    ctx.fillText(labels[lb], lx, ly);
  }
}
function hexToRgb(hex) {
  var m = hex.match(/^#([a-f0-9]{2})([a-f0-9]{2})([a-f0-9]{2})$/i);
  if (m) return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
  var m3 = hex.match(/^#([a-f0-9])([a-f0-9])([a-f0-9])$/i);
  if (m3) return { r: parseInt(m3[1] + m3[1], 16), g: parseInt(m3[2] + m3[2], 16), b: parseInt(m3[3] + m3[3], 16) };
  return { r: 15, g: 118, b: 110 };
}
function answersToSkills() {
  var a = state.answers;
  var skillMap = { cleaning: 0, cooking: 0, delivery: 0, childcare: 0, sales: 0, office: 0, repair: 0, manual: 0, security: 0, beauty: 0 };
  var list = a.skills || [];
  for (var i = 0; i < list.length; i++) if (typeof skillMap[list[i]] !== "undefined") skillMap[list[i]] = 85;
  // 基于其他答案补充
  var digitalScore = 30;
  if (a.digital === "none") digitalScore = 20;
  else if (a.digital === "basic") digitalScore = 55;
  else if (a.digital === "proficient") digitalScore = 80;
  else if (a.digital === "expert") digitalScore = 95;
  var physScore = 30;
  if (a.physical === "light") physScore = 35;
  else if (a.physical === "medium") physScore = 65;
  else if (a.physical === "heavy") physScore = 90;
  return {
    labels: ["技能", "数字", "体力", "沟通", "细致"],
    values: [Math.max(40, (list.length * 30) % 100 || 50), digitalScore, physScore,
      (a.workStyle === "social" || a.workStyle === "analytical") ? 85 : 60,
      (a.workStyle === "detailed" || a.personality === "careful") ? 90 : 55]
  };
}

  for (var s2 = 0; s2 < steps.length; s2++) {

    if (cb) (function (sj) {
      cb.addEventListener("click", function () {

        state.learningDone[key] = !state.learningDone[key];

/* ============ 模拟面试 ============ */
var INTERVIEW_QUESTIONS = [
  { t: "你为什么对这个岗位感兴趣？", opts: ["之前有类似经验，想持续深耕", "对工作内容很感兴趣，愿意学习", "稳定收入，养家糊口", "需要一份工作过渡"] },
  { t: "面对压力较大的工作场景，你的处理方式？", opts: ["冷静分析，分步骤处理", "求助同事或领导", "自己扛，不给别人添麻烦", "会焦虑，需要调整"] },
  { t: "如何看待重复性的日常工作？", opts: ["细致认真做好每一件事", "思考优化方式提升效率", "可以接受但希望有变化", "不喜欢，希望有趣的工作"] },
  { t: "与同事发生意见分歧时？", opts: ["冷静沟通，寻找共识", "听从领导安排", "坚持自己认为对的", "会避开冲突"] },
  { t: "你理想中的工作节奏？", opts: ["白班稳定，作息规律", "有弹性时间更好", "愿意接受加班增加收入", "希望轻松一点"] },
  { t: "对这份工作最大的顾虑是什么？", opts: ["工作强度是否太大", "收入是否稳定", "职业发展空间", "没有明显顾虑"] },
  { t: "你计划多久内上岗？", opts: ["一周内即可", "半个月左右", "一个月内", "还没有明确计划"] }
];
function startInterview(job) {
  var html = '<div class="card" style="padding:12px 14px;margin-bottom:12px;border-left:4px solid #f59e0b"><div style="font-size:12px;color:#d97706;font-weight:700">模拟面试 · ' + job.name + '</div>';
  html += '<div style="font-size:11px;color:#71717a;margin-top:2px">共 ' + INTERVIEW_QUESTIONS.length + ' 题 · 答完自动生成报告</div></div>';
  for (var i = 0; i < INTERVIEW_QUESTIONS.length; i++) {
    html += '<div class="card" style="padding:14px;margin-bottom:10px">';
    html += '<div style="font-size:13px;font-weight:700;color:#18181b;margin-bottom:10px">第 ' + (i + 1) + ' 题：' + INTERVIEW_QUESTIONS[i].t + '</div>';
    for (var j = 0; j < INTERVIEW_QUESTIONS[i].opts.length; j++) {
      html += '<div class="opt intOpt" data-q="' + i + '" data-v="' + j + '" style="margin-bottom:6px;padding:10px 14px;font-size:13px">' + INTERVIEW_QUESTIONS[i].opts[j] + '</div>';
    }
    html += '</div>';
  }
  html += '<button class="btn btn-full" id="submitInterview">生成面试报告</button>';
  document.getElementById("app").innerHTML = html;
  var answers = {};
  var opts = document.querySelectorAll(".intOpt");
  for (var o = 0; o < opts.length; o++) {
    (function (el) {
      el.addEventListener("click", function () {
        var qi = parseInt(el.getAttribute("data-q"));
        document.querySelectorAll('[data-q="' + qi + '"]').forEach(function (e2) { e2.classList.remove("selected"); });
        el.classList.add("selected");
        answers[qi] = parseInt(el.getAttribute("data-v"));
      });
    })(opts[o]);
  }
  document.getElementById("submitInterview").addEventListener("click", function () {
    if (Object.keys(answers).length < INTERVIEW_QUESTIONS.length) { toast("请完成所有题目"); return; }
    var score = 30;
    var goodPoints = [];
    var improvePoints = [];
    if (answers[0] === 0 || answers[0] === 1) { score += 15; goodPoints.push("对岗位有真实兴趣和热情"); }
    else improvePoints.push("建议更深入了解岗位内容");
    if (answers[1] === 0 || answers[1] === 1) { score += 15; goodPoints.push("能合理处理压力和困难"); }
    else improvePoints.push("压力管理需要加强");
    if (answers[2] === 0 || answers[2] === 1) { score += 15; goodPoints.push("对日常工作态度积极"); }
    else improvePoints.push("可以更积极对待日常工作");
    if (answers[3] === 0) { score += 10; goodPoints.push("沟通能力强，团队协作好"); }
    else improvePoints.push("可以更主动沟通");
    if (answers[4] === 0 || answers[4] === 1) { score += 10; goodPoints.push("工作期望符合实际"); }
    if (answers[5] === 3) { score += 5; goodPoints.push("心态开放"); }
    if (answers[6] === 0 || answers[6] === 1) { score += 10; goodPoints.push("有明确的时间计划"); }
    else improvePoints.push("可以更明确上岗时间");
    if (score > 100) score = 100;
    var level = score >= 85 ? "优秀" : (score >= 70 ? "良好" : (score >= 55 ? "合格" : "需提升"));
    state.interviewReport = { jobId: job.id, score: score, level: level, good: goodPoints, improve: improvePoints, time: new Date().toLocaleString() };
    saveState();
    showInterviewReport(job);
  });
}
function showInterviewReport(job) {
  var rep = state.interviewReport;
  if (!rep) { toast("请先完成模拟面试"); return; }
  var html = '<div class="card report-score">';
  html += '<div class="num">' + rep.score + '</div>';
  html += '<div class="level">面试评分 · ' + rep.level + '</div>';
  html += '<div class="job">' + job.name + '</div>';
  html += '<div class="time">完成时间：' + rep.time + '</div>';
  html += '</div>';
  html += '<div class="card report-section">';
  html += '<div class="title green">你的优势</div>';
  html += '<ul>';
  for (var i = 0; i < rep.good.length; i++) html += '<li>' + rep.good[i] + '</li>';
  html += '</ul></div>';
  html += '<div class="card report-section">';
  html += '<div class="title red">可提升方向</div>';
  html += '<ul>';
  for (var j = 0; j < rep.improve.length; j++) html += '<li>' + rep.improve[j] + '</li>';
  html += '</ul></div>';
  html += '<div class="card report-section">';
  html += '<div class="title blue">下一步建议</div>';
  html += '<div class="body">根据你的面试表现，建议您继续完善学习路径，同时准备一份简洁的职业名片，突出您的关键优势。企业面试前建议多做模拟练习。</div></div>';
  html += '<div class="btn-row">';
  html += '<button class="btn btn-sec" id="redoInterviewBtn" style="flex:1">再试一次</button>';
  html += '<button class="btn" id="toResumeBtn" style="flex:1">生成职业名片</button>';
  html += '</div>';
  document.getElementById("app").innerHTML = html;
  document.getElementById("redoInterviewBtn").addEventListener("click", function () { startInterview(job); });
  document.getElementById("toResumeBtn").addEventListener("click", function () { goTo("resume"); });
}

    {p:'#10b981',h:'#047857',l:'#a7f3d0',t:'#ecfdf5',dt:'#34d399',db:'#064e3b'},
    {p:'#d97706',h:'#b45309',l:'#fde68a',t:'#fffbeb',dt:'#fbbf24',db:'#78350f'},
    {p:'#f43f5e',h:'#be123c',l:'#fecdd3',t:'#fff1f2',dt:'#fb7185',db:'#881337'}
  ];
  var t = map[state.settings.themeIdx] || map[0];
  var css = ':root{--p:' + t.p + ';--p-h:' + t.h + ';--p-l:' + t.l + ';--p-t:' + t.t + ';--p-dt:' + t.dt + ';--p-db:' + t.db + '}';
  document.getElementById('themeStyle').textContent = css;
}

/* ============ 启动 ============ */
function showFirstUseGuide() {
  var html = '<h3>欢迎使用技能罗盘</h3>';
  html += '<div style="font-size:13px;color:#71717a;margin:0 0 16px;text-align:center">3 步找到最匹配您的工作</div>';
  html += '<div class="guide-box">';
  html += '<div class="guide-step"><div class="gn">1</div><div><div class="gt">选择您所在的城市</div><div class="gd">点击顶部地区按钮，可自动定位或手动选择。系统会为您推荐本地的真实岗位。</div></div></div>';
  html += '<div class="guide-step"><div class="gn">2</div><div><div class="gt">完成技能测评</div><div class="gd">约 2 分钟，回答您的技能、工作方式、收入期望等问题。系统会智能匹配岗位。</div></div></div>';
  html += '<div class="guide-step"><div class="gn">3</div><div><div class="gt">查看推荐岗位并应聘</div><div class="gd">查看为您筛选的岗位、附近企业、学习路径，一键导航、应聘、生成名片。</div></div></div>';
  html += '</div>';
  html += '<div class="guide-tip"><b>温馨提示：</b>所有数据保存在本地，关闭浏览器不会丢失。右上角可切换暗色模式、字体放大和语音朗读。</div>';
  html += '<button class="btn btn-full" id="startUseBtn" style="margin-bottom:8px">开始使用</button>';
  html += '<button class="btn btn-ghost btn-full" id="locFirstBtn" style="font-size:13px">先定位我的城市</button>';
  showModal(html);
  document.getElementById("startUseBtn").addEventListener("click", function () {
    state.firstUse = false;
    saveState();
    hideModal();
  });
  document.getElementById("locFirstBtn").addEventListener("click", function () {
    state.firstUse = false;
    saveState();
    hideModal();
    setTimeout(openLocationModal, 200);
  });
}

document.addEventListener("DOMContentLoaded", function () {
  loadState();
  applySettings();
  renderHome(document.getElementById("app"));
  document.querySelector('[data-page="home"]').classList.add("active");

  // 首次使用引导
  if (state.firstUse !== false) {
    setTimeout(showFirstUseGuide, 400);
  }

  // 讲述人：全局点击朗读
  document.addEventListener("click", function (e) {
    if (!state.settings.talk) return;
    if (!("speechSynthesis" in window)) return;
    var target = e.target;
    for (var i = 0; i < 4; i++) {
      if (!target) break;
      var cn = target.className || "";
      if (typeof cn === "string" && (cn.indexOf("j-card") !== -1 || cn.indexOf("card") !== -1 || cn.indexOf("lp-step") !== -1)) {
        var text = target.innerText || "";
        if (text.length > 10 && text.length < 200) {
          try {
            var u = new SpeechSynthesisUtterance(text);
            u.lang = "zh-CN"; u.rate = 0.9;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
          } catch (ee) {}
        }
        break;
      }
      target = target.parentNode;
    }
  });
});
</script>
