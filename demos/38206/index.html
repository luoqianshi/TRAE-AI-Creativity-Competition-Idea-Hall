<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学星球 - 小学数学游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            color: white;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: auto;
        }
        
        .score-board .score {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 5px;
        }
        
        .level-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 25px;
            color: white;
            font-size: 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: auto;
        }
        
        .level-info .level {
            font-size: 24px;
            font-weight: bold;
            color: #4ecdc4;
            margin-top: 5px;
        }
        
        #question-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            min-width: 400px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            display: none;
            animation: popIn 0.3s ease-out;
        }
        
        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        
        #question-panel h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .question-text {
            font-size: 36px;
            color: #2c3e50;
            margin: 30px 0;
            font-weight: bold;
        }
        
        .answer-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .answer-btn {
            padding: 15px 20px;
            font-size: 24px;
            border: 2px solid #3498db;
            background: white;
            color: #3498db;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        .answer-btn:hover {
            background: #3498db;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }
        
        .answer-btn.correct {
            background: #2ecc71;
            border-color: #2ecc71;
            color: white;
        }
        
        .answer-btn.wrong {
            background: #e74c3c;
            border-color: #e74c3c;
            color: white;
        }
        
        .feedback {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
        }
        
        .feedback.correct {
            color: #2ecc71;
        }
        
        .feedback.wrong {
            color: #e74c3c;
        }
        
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }
        
        #start-screen h1 {
            color: #ffd700;
            font-size: 64px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        #start-screen p {
            color: white;
            font-size: 20px;
            margin-bottom: 40px;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
        }
        
        .start-btn {
            padding: 20px 60px;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        
        .planet-label {
            position: absolute;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        
        .planet-label:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .stars-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="stars-bg" id="stars-bg"></div>
        
        <div id="ui-layer">
            <div class="score-board">
                <div>得分</div>
                <div class="score" id="score">0</div>
            </div>
            
            <div class="level-info">
                <div>等级</div>
                <div class="level" id="level">1</div>
            </div>
        </div>
        
        <div id="question-panel">
            <h2>🌟 数学挑战 🌟</h2>
            <div class="question-text" id="question-text"></div>
            <div class="answer-options" id="answer-options"></div>
            <div class="feedback" id="feedback"></div>
        </div>
        
        <div id="start-screen">
            <h1>数学星球</h1>
            <p>欢迎来到数学星球！在这里，你将探索各种数学星球，解决有趣的数学问题。点击星球开始挑战，答对题目获得积分，提升等级！</p>
            <button class="start-btn" onclick="startGame()">开始探索</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 游戏状态
        let gameState = {
            score: 0,
            level: 1,
            currentPlanet: null,
            isPlaying: false,
            answeredPlanets: new Set()
        };

        // Three.js 场景
        let scene, camera, renderer;
        let planets = [];
        let raycaster, mouse;
        let animationId;

        // 数学题目生成器
        const MathQuestions = {
            // 加法题目
            generateAddition: function(level) {
                const max = 10 + level * 5;
                const a = Math.floor(Math.random() * max) + 1;
                const b = Math.floor(Math.random() * max) + 1;
                const answer = a + b;
                const options = this.generateOptions(answer, level);
                return {
                    question: `${a} + ${b} = ?`,
                    answer: answer,
                    options: options,
                    type: 'addition'
                };
            },

            // 减法题目
            generateSubtraction: function(level) {
                const max = 10 + level * 5;
                const a = Math.floor(Math.random() * max) + 5;
                const b = Math.floor(Math.random() * a) + 1;
                const answer = a - b;
                const options = this.generateOptions(answer, level);
                return {
                    question: `${a} - ${b} = ?`,
                    answer: answer,
                    options: options,
                    type: 'subtraction'
                };
            },

            // 乘法题目
            generateMultiplication: function(level) {
                const max = 3 + level;
                const a = Math.floor(Math.random() * max) + 2;
                const b = Math.floor(Math.random() * 9) + 2;
                const answer = a * b;
                const options = this.generateOptions(answer, level);
                return {
                    question: `${a} × ${b} = ?`,
                    answer: answer,
                    options: options,
                    type: 'multiplication'
                };
            },

            // 除法题目
            generateDivision: function(level) {
                const max = 3 + level;
                const b = Math.floor(Math.random() * 8) + 2;
                const answer = Math.floor(Math.random() * max) + 2;
                const a = b * answer;
                const options = this.generateOptions(answer, level);
                return {
                    question: `${a} ÷ ${b} = ?`,
                    answer: answer,
                    options: options,
                    type: 'division'
                };
            },

            // 生成选项
            generateOptions: function(answer, level) {
                const options = [answer];
                while (options.length < 4) {
                    const offset = Math.floor(Math.random() * 10) + 1;
                    const wrong = Math.random() > 0.5 ? answer + offset : Math.max(1, answer - offset);
                    if (!options.includes(wrong)) {
                        options.push(wrong);
                    }
                }
                return options.sort(() => Math.random() - 0.5);
            },

            // 根据等级生成题目
            generateQuestion: function(level) {
                const types = ['addition', 'subtraction'];
                if (level >= 2) types.push('multiplication');
                if (level >= 3) types.push('division');
                
                const type = types[Math.floor(Math.random() * types.length)];
                switch(type) {
                    case 'addition': return this.generateAddition(level);
                    case 'subtraction': return this.generateSubtraction(level);
                    case 'multiplication': return this.generateMultiplication(level);
                    case 'division': return this.generateDivision(level);
                }
            }
        };

        // 初始化 Three.js
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            // 场景
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x1a1a2e, 20, 100);
            
            // 相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);
            
            // 光照
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0xffd700, 0.5, 100);
            pointLight.position.set(0, 0, 10);
            scene.add(pointLight);
            
            // 射线检测
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // 创建星空背景
            createStarField();
            
            // 创建数学星球
            createMathPlanets();
            
            // 事件监听
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onMouseClick);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            
            // 开始动画
            animate();
        }

        // 创建星空背景
        function createStarField() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            
            for (let i = 0; i < starCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 200;
                
                const color = new THREE.Color();
                color.setHSL(Math.random(), 0.8, 0.8);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }
            
            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const starMaterial = new THREE.PointsMaterial({
                size: 0.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });
            
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }

        // 创建数学星球
        function createMathPlanets() {
            const planetConfigs = [
                { name: '加法星球', color: 0xff6b6b, position: [-8, 4, 0], type: 'addition' },
                { name: '减法星球', color: 0x4ecdc4, position: [8, 4, 0], type: 'subtraction' },
                { name: '乘法星球', color: 0x45b7d1, position: [-8, -4, 0], type: 'multiplication' },
                { name: '除法星球', color: 0xf9ca24, position: [8, -4, 0], type: 'division' },
                { name: '混合星球', color: 0x6c5ce7, position: [0, 0, -5], type: 'mixed' }
            ];
            
            planetConfigs.forEach((config, index) => {
                const planet = createPlanet(config);
                planets.push(planet);
                scene.add(planet.mesh);
                
                // 创建星球标签
                createPlanetLabel(planet);
            });
        }
        
        // 创建星球标签
        function createPlanetLabel(planet) {
            const label = document.createElement('div');
            label.className = 'planet-label';
            label.textContent = planet.config.name;
            label.id = 'label-' + planet.config.name;
            document.getElementById('canvas-container').appendChild(label);
            planet.label = label;
        }
        
        // 更新星球标签位置
        function updatePlanetLabels() {
            planets.forEach(planet => {
                if (planet.label && !gameState.answeredPlanets.has(planet.config.name)) {
                    const vector = new THREE.Vector3();
                    planet.mesh.getWorldPosition(vector);
                    vector.y += 3; // 标签在星球上方
                    
                    vector.project(camera);
                    
                    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                    
                    planet.label.style.left = x + 'px';
                    planet.label.style.top = y + 'px';
                    planet.label.style.display = vector.z < 1 ? 'block' : 'none';
                } else if (planet.label) {
                    planet.label.style.display = 'none';
                }
            });
        }

        // 创建单个星球
        function createPlanet(config) {
            const geometry = new THREE.SphereGeometry(2, 32, 32);
            const material = new THREE.MeshPhongMaterial({
                color: config.color,
                emissive: config.color,
                emissiveIntensity: 0.2,
                shininess: 100,
                transparent: true,
                opacity: 0.9
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(...config.position);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // 添加光环
            const ringGeometry = new THREE.RingGeometry(2.5, 3.5, 64);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: config.color,
                transparent: true,
                opacity: 0.3,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            mesh.add(ring);
            
            // 添加卫星
            const satelliteGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const satelliteMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });
            const satellite = new THREE.Mesh(satelliteGeometry, satelliteMaterial);
            satellite.position.set(4, 0, 0);
            mesh.add(satellite);
            
            return {
                mesh: mesh,
                config: config,
                satellite: satellite,
                ring: ring,
                originalScale: 1,
                hovered: false
            };
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 鼠标移动
        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planets.map(p => p.mesh));
            
            planets.forEach(planet => {
                if (intersects.find(i => i.object === planet.mesh)) {
                    if (!planet.hovered) {
                        planet.hovered = true;
                        document.body.style.cursor = 'pointer';
                    }
                } else {
                    if (planet.hovered) {
                        planet.hovered = false;
                        document.body.style.cursor = 'default';
                    }
                }
            });
        }

        // 鼠标点击
        function onMouseClick(event) {
            if (!gameState.isPlaying) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planets.map(p => p.mesh));
            
            if (intersects.length > 0) {
                const clickedPlanet = planets.find(p => p.mesh === intersects[0].object);
                if (clickedPlanet && !gameState.answeredPlanets.has(clickedPlanet.config.name)) {
                    showQuestion(clickedPlanet);
                }
            }
        }

        // 显示题目
        function showQuestion(planet) {
            gameState.currentPlanet = planet;
            const question = MathQuestions.generateQuestion(gameState.level);
            
            const panel = document.getElementById('question-panel');
            const questionText = document.getElementById('question-text');
            const optionsContainer = document.getElementById('answer-options');
            const feedback = document.getElementById('feedback');
            
            questionText.textContent = question.question;
            feedback.textContent = '';
            feedback.className = 'feedback';
            
            optionsContainer.innerHTML = '';
            question.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = option;
                btn.onclick = () => checkAnswer(option, question.answer, btn);
                optionsContainer.appendChild(btn);
            });
            
            panel.style.display = 'block';
        }

        // 检查答案
        function checkAnswer(selected, correct, btn) {
            const feedback = document.getElementById('feedback');
            const options = document.querySelectorAll('.answer-btn');
            
            options.forEach(opt => opt.disabled = true);
            
            if (selected === correct) {
                btn.classList.add('correct');
                feedback.textContent = '✅ 回答正确！+' + (10 * gameState.level) + '分';
                feedback.classList.add('correct');
                
                gameState.score += 10 * gameState.level;
                gameState.answeredPlanets.add(gameState.currentPlanet.config.name);
                
                updateScore();
                checkLevelUp();
                
                setTimeout(() => {
                    hideQuestion();
                    if (gameState.answeredPlanets.size === planets.length) {
                        setTimeout(() => {
                            alert('🎉 恭喜！你已完成所有星球挑战！\n最终得分：' + gameState.score);
                            resetGame();
                        }, 500);
                    }
                }, 1500);
            } else {
                btn.classList.add('wrong');
                feedback.textContent = '❌ 回答错误，正确答案是：' + correct;
                feedback.classList.add('wrong');
                
                setTimeout(() => {
                    hideQuestion();
                }, 2000);
            }
        }

        // 隐藏题目面板
        function hideQuestion() {
            document.getElementById('question-panel').style.display = 'none';
            gameState.currentPlanet = null;
        }

        // 更新分数
        function updateScore() {
            document.getElementById('score').textContent = gameState.score;
        }

        // 检查升级
        function checkLevelUp() {
            const newLevel = Math.floor(gameState.score / 50) + 1;
            if (newLevel > gameState.level) {
                gameState.level = newLevel;
                document.getElementById('level').textContent = gameState.level;
                
                // 显示升级提示
                const levelInfo = document.querySelector('.level-info');
                levelInfo.style.animation = 'none';
                setTimeout(() => {
                    levelInfo.style.animation = 'popIn 0.5s ease-out';
                }, 10);
            }
        }

        // 开始游戏
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameState.isPlaying = true;
        }

        // 重置游戏
        function resetGame() {
            gameState.score = 0;
            gameState.level = 1;
            gameState.answeredPlanets.clear();
            gameState.isPlaying = false;
            
            updateScore();
            document.getElementById('level').textContent = '1';
            document.getElementById('start-screen').style.display = 'flex';
        }

        // 动画循环
        function animate() {
            animationId = requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            // 星球动画
            planets.forEach((planet, index) => {
                // 自转
                planet.mesh.rotation.y += 0.01;
                
                // 卫星公转
                const satelliteAngle = time * 0.5 + index * Math.PI * 0.4;
                planet.satellite.position.x = Math.cos(satelliteAngle) * 4;
                planet.satellite.position.z = Math.sin(satelliteAngle) * 4;
                
                // 悬浮效果
                planet.mesh.position.y += Math.sin(time * 2 + index) * 0.002;
                
                // 悬停效果
                if (planet.hovered) {
                    planet.mesh.scale.lerp(new THREE.Vector3(1.2, 1.2, 1.2), 0.1);
                    planet.ring.rotation.z += 0.02;
                } else {
                    planet.mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                }
                
                // 已回答的星球变暗
                if (gameState.answeredPlanets.has(planet.config.name)) {
                    planet.mesh.material.opacity = 0.3;
                    planet.ring.material.opacity = 0.1;
                } else {
                    planet.mesh.material.opacity = 0.9;
                    planet.ring.material.opacity = 0.3;
                }
            });
            
            // 相机缓慢旋转
            if (gameState.isPlaying) {
                camera.position.x = Math.sin(time * 0.1) * 5;
                camera.position.y = Math.cos(time * 0.1) * 3;
                camera.lookAt(0, 0, 0);
            }
            
            // 更新星球标签位置
            updatePlanetLabels();
            
            renderer.render(scene, camera);
        }

        // 初始化
        initThreeJS();
    </script>
</body>
</html>
