<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思维圆桌 MindRoundtable</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;
  --fg:#e8e4df;--fg2:#9a9490;--fg3:#5a5550;
  --accent:#e8a838;--accent2:#d4763a;--accent3:#38b8a8;
  --card:#16161f;--border:#2a2a3a;
  --glow:rgba(232,168,56,.15);
  --font-display:'Noto Serif SC',serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font-display);background:var(--bg);color:var(--fg);overflow-x:hidden;min-height:100vh}
::selection{background:var(--accent);color:var(--bg)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== PAGE SYSTEM ===== */
.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s ease;transform:translateY(20px);z-index:1}
.page.active{opacity:1;pointer-events:all;transform:translateY(0);z-index:10}

/* ===== BACKGROUND ===== */
.bg-noise{position:fixed;inset:0;z-index:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.bg-glow{position:fixed;z-index:0;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none}
.bg-glow-1{width:600px;height:600px;background:var(--accent);top:-200px;right:-100px}
.bg-glow-2{width:500px;height:500px;background:var(--accent3);bottom:-150px;left:-100px}

/* ===== PAGE 1: LANDING ===== */
.landing-content{text-align:center;position:relative;z-index:2}
.logo-mark{font-size:3.6rem;font-weight:900;letter-spacing:-.02em;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem;line-height:1.2}
.logo-sub{font-family:var(--font-mono);font-size:.75rem;color:var(--fg3);letter-spacing:.3em;text-transform:uppercase;margin-bottom:3rem}
.input-wrap{position:relative;width:560px;max-width:90vw;margin-bottom:1.5rem}
.topic-input{width:100%;padding:1.2rem 1.6rem;font-family:var(--font-display);font-size:1.1rem;color:var(--fg);background:var(--bg2);border:1px solid var(--border);border-radius:12px;outline:none;transition:all .3s ease}
.topic-input::placeholder{color:var(--fg3)}
.topic-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow),0 8px 32px rgba(0,0,0,.4)}
.btn-row{display:flex;gap:1rem;justify-content:center}
.btn{font-family:var(--font-display);font-size:.95rem;padding:.85rem 2rem;border:none;border-radius:10px;cursor:pointer;transition:all .25s ease;position:relative;overflow:hidden}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--bg);font-weight:700}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(232,168,56,.35)}
.btn-secondary{background:var(--bg3);color:var(--fg);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent3);color:var(--accent3);transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.example-topics{margin-top:2.5rem;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;max-width:560px}
.example-tag{font-family:var(--font-mono);font-size:.72rem;color:var(--fg3);padding:.4rem .8rem;border:1px solid var(--border);border-radius:20px;cursor:pointer;transition:all .2s}
.example-tag:hover{color:var(--accent);border-color:var(--accent);background:var(--glow)}

/* ===== PAGE 2: CHARACTER SELECT ===== */
.select-page{justify-content:flex-start;padding-top:4vh}
.select-header{text-align:center;margin-bottom:1.5rem;position:relative;z-index:2}
.select-title{font-size:1.6rem;font-weight:700;margin-bottom:.5rem}
.select-hint{font-family:var(--font-mono);font-size:.78rem;color:var(--fg3)}
.tension-bar{position:relative;z-index:2;width:90vw;max-width:900px;height:48px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-bottom:2rem;overflow:hidden;display:flex;align-items:center;padding:0 1rem}
.tension-label{font-family:var(--font-mono);font-size:.65rem;color:var(--fg3);white-space:nowrap;margin-right:.8rem}
.tension-dots{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tension-dot{width:10px;height:10px;border-radius:50%;transition:all .4s ease;opacity:0;transform:scale(0)}
.tension-dot.visible{opacity:1;transform:scale(1)}
.tension-dot.stance-0{background:#e85d5d}
.tension-dot.stance-1{background:#e8a838}
.tension-dot.stance-2{background:#38b8a8}
.tension-dot.stance-3{background:#5d8de8}
.tension-dot.stance-4{background:#b85de8}
.card-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1rem;width:90vw;max-width:900px;max-height:52vh;overflow-y:auto;padding:1rem 0}
.char-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;cursor:pointer;transition:all .3s ease;opacity:0;transform:translateY(40px) scale(.9);position:relative;overflow:hidden}
.char-card.fly-in{opacity:1;transform:translateY(0) scale(1)}
.char-card:hover{border-color:var(--fg3);transform:translateY(-3px) scale(1.02)}
.char-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow),0 4px 20px rgba(232,168,56,.2)}
.char-card.selected::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.char-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900;margin-bottom:.6rem;border:2px solid var(--border)}
.char-card.selected .char-avatar{border-color:var(--accent)}
.char-name{font-size:.85rem;font-weight:700;margin-bottom:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.char-stance{font-family:var(--font-mono);font-size:.62rem;color:var(--fg2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.char-mbti{font-family:var(--font-mono);font-size:.58rem;color:var(--fg3);margin-top:.4rem;padding:.15rem .4rem;background:var(--bg);border-radius:4px;display:inline-block}
.char-check{position:absolute;top:.6rem;right:.6rem;width:18px;height:18px;border-radius:50%;border:2px solid var(--border);transition:all .2s;display:flex;align-items:center;justify-content:center}
.char-card.selected .char-check{background:var(--accent);border-color:var(--accent)}
.char-check::after{content:'✓';font-size:.65rem;color:var(--bg);opacity:0;transition:opacity .2s}
.char-card.selected .char-check::after{opacity:1}
.select-actions{position:relative;z-index:2;margin-top:1.5rem;display:flex;gap:1rem;align-items:center}
.selected-count{font-family:var(--font-mono);font-size:.75rem;color:var(--fg3)}
.selected-count span{color:var(--accent);font-weight:700}

/* ===== PAGE 3: DISCUSSION ===== */
.disc-page{display:flex!important;flex-direction:row!important;justify-content:stretch;align-items:stretch;padding:0}
.disc-left{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--border);min-width:0;min-height:0;height:100%}
.disc-right{width:420px;min-width:320px;display:flex;flex-direction:column;background:var(--bg2)}
.disc-header{padding:1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;flex-shrink:0}
.disc-header .topic-label{font-size:.9rem;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc-header .round-badge{font-family:var(--font-mono);font-size:.65rem;color:var(--accent);padding:.25rem .6rem;border:1px solid var(--accent);border-radius:6px}
.disc-messages{flex:1;min-height:0;overflow-y:auto;padding:1rem 1.5rem;display:flex;flex-direction:column;gap:1rem}
.msg{display:flex;gap:.8rem;animation:msgIn .4s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;flex-shrink:0;border:2px solid var(--border)}
.msg-body{flex:1;min-width:0}
.msg-meta{display:flex;align-items:center;gap:.6rem;margin-bottom:.3rem}
.msg-name{font-size:.8rem;font-weight:700}
.msg-action{font-family:var(--font-mono);font-size:.6rem;padding:.1rem .4rem;border-radius:4px;font-weight:500}
.msg-action.action-陈述{background:rgba(56,184,168,.15);color:var(--accent3)}
.msg-action.action-质疑{background:rgba(232,93,93,.15);color:#e85d5d}
.msg-action.action-反驳{background:rgba(232,168,56,.15);color:var(--accent)}
.msg-action.action-补充{background:rgba(93,141,232,.15);color:#5d8de8}
.msg-action.action-综合{background:rgba(184,93,232,.15);color:#b85de8}
.msg-text{font-size:.85rem;line-height:1.7;color:var(--fg2)}
.msg-summary{font-family:var(--font-mono);font-size:.7rem;color:var(--accent);margin-top:.4rem;font-style:italic}
.msg-host .msg-avatar{border-color:var(--accent)}
.msg-host .msg-name{color:var(--accent)}
.msg-me .msg-avatar{border-color:#a0e8a0}
.msg-me .msg-name{color:#a0e8a0}

/* Human input */
.disc-input{padding:.8rem 1.2rem;border-top:1px solid var(--border);display:flex;align-items:center;gap:.6rem;background:var(--bg);flex-shrink:0}
.disc-input-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;border:2px solid #a0e8a0;color:#a0e8a0;background:rgba(160,232,160,.08)}
.disc-input-field{flex:1;padding:.6rem 1rem;font-family:var(--font-display);font-size:.82rem;color:var(--fg);background:var(--bg3);border:1px solid var(--border);border-radius:8px;outline:none;transition:all .25s}
.disc-input-field::placeholder{color:var(--fg3)}
.disc-input-field:focus{border-color:#a0e8a0;box-shadow:0 0 0 2px rgba(160,232,160,.15)}
.disc-input-btn{width:34px;height:34px;border-radius:50%;border:none;background:#a0e8a0;color:var(--bg);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.disc-input-btn:hover{transform:scale(1.1);box-shadow:0 2px 12px rgba(160,232,160,.3)}
.disc-input-btn:active{transform:scale(.95)}
.disc-input-btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.disc-controls{padding:.8rem 1.2rem;border-top:1px solid var(--border);display:flex;gap:.4rem;flex-wrap:wrap;background:var(--bg);flex-shrink:0}
.ctrl-btn{font-family:var(--font-mono);font-size:.72rem;padding:.5rem 1rem;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--fg2);cursor:pointer;transition:all .2s}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.ctrl-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.ctrl-btn.primary:hover{box-shadow:0 2px 12px rgba(232,168,56,.3)}

/* Right panel: knowledge network */
.kn-header{padding:1rem 1.2rem;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:700;display:flex;align-items:center;gap:.6rem}
.kn-header .dot{width:8px;height:8px;border-radius:50%;background:var(--accent3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.kn-canvas{flex:1;position:relative;overflow:hidden}
.kn-canvas svg{width:100%;height:100%}
.kn-summary{padding:1rem 1.2rem;border-top:1px solid var(--border)}
.kn-summary-title{font-size:.75rem;font-weight:700;color:var(--accent);margin-bottom:.5rem;font-family:var(--font-mono)}
.kn-summary-text{font-size:.78rem;line-height:1.6;color:var(--fg2)}
.kn-issues{margin-top:.8rem}
.kn-issue{font-family:var(--font-mono);font-size:.68rem;color:var(--fg3);padding:.3rem 0;border-bottom:1px solid var(--border)}
.kn-issue:last-child{border-bottom:none}

/* SVG graph styles */
.graph-node{cursor:pointer;transition:all .3s}
.graph-node:hover .node-circle{filter:brightness(1.3)}
.graph-edge{stroke:var(--border);stroke-width:1.5;opacity:.6}
.graph-edge.active{stroke:var(--accent);opacity:1;stroke-dasharray:4 2;animation:dashFlow 1s linear infinite}
@keyframes dashFlow{to{stroke-dashoffset:-6}}
.node-label{font-family:var(--font-mono);font-size:10px;fill:var(--fg2)}
.node-circle{transition:all .3s}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:.5rem 0}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--fg3);animation:typeDot 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes typeDot{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}

/* Back button */
.btn-back{position:absolute;top:1.5rem;left:1.5rem;font-family:var(--font-mono);font-size:.72rem;color:var(--fg3);background:none;border:1px solid var(--border);padding:.4rem .8rem;border-radius:6px;cursor:pointer;z-index:20;transition:all .2s}
.btn-back:hover{color:var(--fg);border-color:var(--fg3)}

/* Responsive - always show split view */
@media(max-width:600px){
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .disc-right{width:280px;min-width:240px}
}
</style>
</head>
<body>

<div class="bg-noise"></div>
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<!-- ===== PAGE 1: LANDING ===== -->
<div class="page active" id="page-landing">
  <div class="landing-content">
    <div class="logo-mark">思维圆桌</div>
    <div class="logo-sub">MindRoundtable &mdash; AI 驱动的多视角深度对话</div>
    <div class="input-wrap">
      <input class="topic-input" id="topicInput" type="text" placeholder="输入你想探讨的议题..." maxlength="100">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btnQuick" disabled>快速开始</button>
      <button class="btn btn-secondary" id="btnSelect" disabled>选择人物</button>
    </div>
    <div class="example-topics">
      <span class="example-tag" data-topic="人工智能是否拥有真正的创造力？">AI创造力</span>
      <span class="example-tag" data-topic="自由意志是否只是一种幻觉？">自由意志</span>
      <span class="example-tag" data-topic="社交媒体是否正在摧毁深度思考？">社交媒体</span>
      <span class="example-tag" data-topic="人类是否应该追求永生？">永生</span>
      <span class="example-tag" data-topic="教育应该培养专才还是通才？">教育方向</span>
    </div>
  </div>
</div>

<!-- ===== PAGE 2: CHARACTER SELECT ===== -->
<div class="page" id="page-select">
  <button class="btn-back" id="btnBack1">&larr; 返回</button>
  <div class="select-header">
    <div class="select-title" id="selectTitle">选择你的圆桌嘉宾</div>
    <div class="select-hint">点击卡片选择/取消，已选 <span id="countNum">0</span>/5 位</div>
  </div>
  <div class="tension-bar">
    <span class="tension-label">团队张力</span>
    <div class="tension-dots" id="tensionDots"></div>
  </div>
  <div class="card-grid" id="cardGrid"></div>
  <div class="select-actions">
    <div class="selected-count">已选 <span id="countNum2">0</span>/5 位嘉宾</div>
    <button class="btn btn-primary" id="btnStart" disabled>开始圆桌</button>
  </div>
</div>

<!-- ===== PAGE 3: DISCUSSION ===== -->
<div class="page" id="page-discuss" style="display:flex;flex-direction:row">
  <div class="disc-left">
    <div class="disc-header">
      <span class="topic-label" id="discTopic"></span>
      <span class="round-badge" id="roundBadge">第 1 轮</span>
    </div>
    <div class="disc-messages" id="msgContainer"></div>
    <div class="disc-input" id="discInput">
      <div class="disc-input-avatar">我</div>
      <input class="disc-input-field" id="humanInput" type="text" placeholder="输入你的看法..." maxlength="200">
      <button class="disc-input-btn" id="btnSend" disabled>&#10148;</button>
    </div>
    <div class="disc-controls">
      <button class="ctrl-btn primary" id="ctrlContinue">继续</button>
      <button class="ctrl-btn" id="ctrlDeep">深入此节</button>
      <button class="ctrl-btn" id="ctrlNew">引入新人物</button>
      <button class="ctrl-btn" id="ctrlEnd">结束讨论</button>
    </div>
  </div>
  <div class="disc-right">
    <div class="kn-header"><span class="dot"></span>实时知识网络</div>
    <div class="kn-canvas" id="knCanvas">
      <svg id="knSvg" viewBox="0 0 400 500"></svg>
    </div>
    <div class="kn-summary">
      <div class="kn-summary-title">主持人综述</div>
      <div class="kn-summary-text" id="summaryText">等待讨论开始...</div>
      <div class="kn-issues" id="issuesList"></div>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const CHARACTERS_DB = {
  "人工智能是否拥有真正的创造力？": [
    {name:"玛格丽特·博登",mbti:"INTJ",stance:"创造力需要跨越概念空间，AI只能探索已有空间",color:"#e85d5d",icon:"M"},
    {name:"玛格丽特·博登",mbti:"INTJ",stance:"创造力需要跨越概念空间，AI只能探索已有空间",color:"#e85d5d",icon:"M"},
    {name:"丹尼特",mbti:"ENTP",stance:"意识是多重草稿过程，创造力是涌现属性",color:"#e8a838",icon:"D"},

    {name:"庄子",mbti:"INFP",stance:"无为而治，真正的创造在于忘我之境",color:"#38b8a8",icon:"庄"},
    {name:"尼采",mbti:"INFJ",stance:"创造力是权力意志的最高表达，超人才能创造价值",color:"#b85de8",icon:"尼"},
    {name:"康德",mbti:"ISTJ",stance:"创造力是天才的产物，审美判断不可还原为规则",color:"#e8a838",icon:"康"},
    {name:"西蒙",mbti:"INTJ",stance:"创造力是搜索足够大的问题空间，AI可以做到",color:"#5d8de8",icon:"西"},
    {name:"道金斯",mbti:"ENTJ",stance:"进化是盲目的钟表匠，AI的创造力是另一种进化",color:"#e85d5d",icon:"道"},
    {name:"维特根斯坦",mbti:"INTP",stance:"语言的边界就是世界的边界，AI的创造力受限于语言游戏",color:"#38b8a8",icon:"维"},
    {name:"苏轼",mbti:"ENFP",stance:"文章本天成，妙手偶得之，创造力不可强求",color:"#e8a838",icon:"苏"},
    {name:"莱布尼茨",mbti:"INTJ",stance:"一切可能世界中最优的创造，是理性的组合艺术",color:"#5d8de8",icon:"莱"},
    {name:"海德格尔",mbti:"INFJ",stance:"技术是座架，AI的'创造'是对存在的遗忘",color:"#b85de8",icon:"海"},
    {name:"波普尔",mbti:"ENTP",stance:"创造力来自大胆猜想与严格反驳，AI缺乏批判精神",color:"#e85d5d",icon:"波"},

// ===== STATE =====
let currentTopic = '';
let selectedChars = [];
let currentRound = 1;
let msgIndex = 0;

// ===== PAGE NAVIGATION =====
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  setTimeout(() => document.getElementById(id).classList.add('active'), 50);
}

// ===== LANDING PAGE =====
const topicInput = document.getElementById('topicInput');
const btnQuick = document.getElementById('btnQuick');
const btnSelect = document.getElementById('btnSelect');

topicInput.addEventListener('input', () => {
  const hasValue = topicInput.value.trim().length > 0;
  btnQuick.disabled = !hasValue;
  btnSelect.disabled = !hasValue;
});

document.querySelectorAll('.example-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    topicInput.value = tag.dataset.topic;
    topicInput.dispatchEvent(new Event('input'));
    topicInput.focus();
  });
});

btnQuick.addEventListener('click', () => {
  currentTopic = topicInput.value.trim();
  startDemoDiscussion();
});

btnSelect.addEventListener('click', () => {
  currentTopic = topicInput.value.trim();
  showCharacterSelect();
});

// ===== CHARACTER SELECT =====
function showCharacterSelect() {
  selectedChars = [];
  const chars = CHARACTERS_DB[currentTopic] || CHARACTERS_DB["default"];
  const grid = document.getElementById('cardGrid');
  const dotsContainer = document.getElementById('tensionDots');
  grid.innerHTML = '';
  dotsContainer.innerHTML = '';

  document.getElementById('selectTitle').textContent = `「${currentTopic}」— 选择你的圆桌嘉宾`;
  updateCount();

  chars.forEach((char, i) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    card.dataset.index = i;
    card.innerHTML = `
      <div class="char-check"></div>
      <div class="char-avatar" style="border-color:${char.color};color:${char.color}">${char.icon}</div>
      <div class="char-name">${char.name}</div>
      <div class="char-stance">${char.stance}</div>
      <div class="char-mbti">${char.mbti}</div>
    `;
    card.addEventListener('click', () => toggleChar(card, char, chars));
    grid.appendChild(card);

    // Fly-in animation with stagger
    setTimeout(() => card.classList.add('fly-in'), 60 * i + 100);
  });

  showPage('page-select');
}

function toggleChar(card, char, allChars) {
  const idx = selectedChars.findIndex(c => c.name === char.name);
  if (idx > -1) {
    selectedChars.splice(idx, 1);
    card.classList.remove('selected');
  } else {
    if (selectedChars.length >= 5) return;
    selectedChars.push(char);
    card.classList.add('selected');
  }
  updateCount();
  updateTensionDots(allChars);
}

function updateCount() {
  document.getElementById('countNum').textContent = selectedChars.length;
  document.getElementById('countNum2').textContent = selectedChars.length;
  document.getElementById('btnStart').disabled = selectedChars.length < 3;
}

function updateTensionDots(allChars) {
  const container = document.getElementById('tensionDots');
  container.innerHTML = '';
  if (selectedChars.length < 2) return;

  // Generate tension dots based on stance diversity
  const stanceTypes = [...new Set(selectedChars.map(c => c.stance.substring(0, 4)))];
  const dotCount = Math.min(stanceTypes.length * 3 + selectedChars.length, 20);

  for (let i = 0; i < dotCount; i++) {
    const dot = document.createElement('div');
    const stanceIdx = i % 5;
    dot.className = `tension-dot stance-${stanceIdx}`;
    container.appendChild(dot);
    setTimeout(() => dot.classList.add('visible'), 30 * i);
  }
}

document.getElementById('btnBack1').addEventListener('click', () => showPage('page-landing'));
document.getElementById('btnStart').addEventListener('click', () => {

function startDemoDiscussion() {
  const data = SAMPLE_DISCUSSION;
  document.getElementById('discTopic').textContent = data.topic;

  msgIndex = 0;

  showPage('page-discuss');
  drawGraph(data.graph);

  // Animate messages one by one
  data.messages.forEach((msg, i) => {
    setTimeout(() => addMessage(msg), 800 + i * 1500);
  });

  // Show summary after all messages
  setTimeout(() => {
    document.getElementById('summaryText').textContent = data.summary;
    data.issues.forEach(issue => {
      const div = document.createElement('div');
      div.className = 'kn-issue';
      div.textContent = '▸ ' + issue;
      document.getElementById('issuesList').appendChild(div);
    });
  }, 800 + data.messages.length * 1500 + 500);
}

function addMessage(msg) {
  const container = document.getElementById('msgContainer');
  const div = document.createElement('div');

  let extraClass = '';
  if (msg.type === 'host') extraClass = 'msg-host';
  else if (msg.type === 'me') extraClass = 'msg-me';
  div.className = `msg ${extraClass}`;

  let avatarColor, avatarText;
  if (msg.type === 'host') {
    avatarColor = 'var(--accent)';
    avatarText = '主持';
  } else if (msg.type === 'me') {
    avatarColor = '#a0e8a0';
    avatarText = '我';
  } else {
    avatarColor = msg.color || 'var(--border)';
    avatarText = msg.icon || msg.name[0];
  }

  div.innerHTML = `
    <div class="msg-avatar" style="border-color:${avatarColor};color:${avatarColor}">${avatarText}</div>
    <div class="msg-body">
      <div class="msg-meta">
        <span class="msg-name">${msg.name}</span>
        <span class="msg-action action-${msg.action}">${msg.action}</span>
      </div>
      <div class="msg-text">${msg.text}</div>
      ${msg.summary ? `<div class="msg-summary">简言之：${msg.summary}</div>` : ''}
    </div>
  `;

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ===== KNOWLEDGE NETWORK GRAPH =====
function drawGraph(graph) {
  const svg = document.getElementById('knSvg');
  svg.innerHTML = '';

  // Defs for glow
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  `;
  svg.appendChild(defs);

  // Draw edges
  graph.edges.forEach(edge => {
    const from = graph.nodes.find(n => n.id === edge.from);
    const to = graph.nodes.find(n => n.id === edge.to);
    if (!from || !to) return;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', from.x);
    line.setAttribute('y1', from.y);
    line.setAttribute('x2', to.x);
    line.setAttribute('y2', to.y);
    line.setAttribute('class', `graph-edge ${edge.active ? 'active' : ''}`);
    svg.appendChild(line);
  });

  // Draw nodes
  graph.nodes.forEach((node, i) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'graph-node');
    g.style.opacity = '0';
    g.style.transition = `opacity .5s ease ${i * 0.1}s`;

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', node.x);
    circle.setAttribute('cy', node.y);
    circle.setAttribute('r', node.r);
    circle.setAttribute('fill', node.color + '33');
    circle.setAttribute('stroke', node.color);
    circle.setAttribute('stroke-width', '2');
    circle.setAttribute('class', 'node-circle');
    if (node.r > 20) circle.setAttribute('filter', 'url(#glow)');

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', node.x);
    text.setAttribute('y', node.y + node.r + 14);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('class', 'node-label');
    text.textContent = node.label;

    g.appendChild(circle);
    g.appendChild(text);
    svg.appendChild(g);

    // Animate in
    setTimeout(() => g.style.opacity = '1', 200 + i * 100);
  });
}
