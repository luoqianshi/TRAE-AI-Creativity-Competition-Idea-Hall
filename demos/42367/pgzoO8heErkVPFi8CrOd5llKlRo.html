<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先别开工 · AI 任务需求防返工扫描仪</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ============ 全局变量与基础 ============ */
:root{
  --primary:#6366F1;
  --primary-2:#8B5CF6;
  --primary-grad:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%);
  --risk-high:#EF4444;
  --risk-mid:#F59E0B;
  --risk-low:#10B981;
  --text-1:#1F2937;
  --text-2:#6B7280;
  --text-3:#9CA3AF;
  --bg:#F9FAFB;
  --card:#FFFFFF;
  --border:#E5E7EB;
  --highlight:#FEF3C7;
  --shadow-sm:0 1px 2px rgba(17,24,39,.06),0 1px 3px rgba(17,24,39,.04);
  --shadow-md:0 4px 12px rgba(17,24,39,.08),0 2px 4px rgba(17,24,39,.04);
  --shadow-lg:0 12px 32px rgba(99,102,241,.12),0 4px 8px rgba(17,24,39,.06);
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text-1);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
textarea{font-family:inherit;}

/* ============ 视图容器与切换 ============ */
.view{display:none;min-height:100vh;}
.view.active{display:block;animation:fadeIn .5s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ============ 输入页 ============ */
.input-wrap{max-width:960px;margin:0 auto;padding:48px 24px 80px;}
.brand{text-align:center;margin-bottom:40px;}
.brand .logo{
  display:inline-flex;align-items:center;justify-content:center;
  width:64px;height:64px;border-radius:18px;
  background:var(--primary-grad);
  box-shadow:0 8px 24px rgba(99,102,241,.35);
  margin-bottom:18px;
}
.brand .logo i{font-size:28px;color:#fff;}
.brand h1{
  font-size:38px;font-weight:800;letter-spacing:-.5px;
  background:var(--primary-grad);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{color:var(--text-2);font-size:16px;margin-top:8px;}

.section-label{
  font-size:13px;font-weight:600;color:var(--text-2);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.section-label::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--primary-grad);}

.identity-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:36px;
}
.identity-chip{
  padding:14px 8px;border:1.5px solid var(--border);border-radius:10px;
  background:#fff;text-align:center;font-size:14px;color:var(--text-1);
  transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.identity-chip i{font-size:18px;color:var(--text-3);transition:color .2s;}
.identity-chip:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-sm);}
.identity-chip.selected{
  border-color:var(--primary);background:rgba(99,102,241,.06);
  color:var(--primary);font-weight:600;box-shadow:0 4px 12px rgba(99,102,241,.15);
}
.identity-chip.selected i{color:var(--primary);}

.task-input{
  width:100%;min-height:140px;padding:18px 20px;
  border:1.5px solid var(--border);border-radius:var(--radius);
  font-size:15px;color:var(--text-1);resize:vertical;
  transition:all .2s;background:#fff;line-height:1.7;
}
.task-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.12);}
.task-input::placeholder{color:var(--text-3);}

.examples{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px;}
.example-card{
  padding:16px;border:1.5px solid var(--border);border-radius:var(--radius);
  background:#fff;cursor:pointer;transition:all .25s;
  display:flex;flex-direction:column;gap:8px;text-align:left;
}
.example-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow-md);}
.example-card .ex-tag{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;color:var(--primary);
}
.example-card .ex-tag i{font-size:11px;}
.example-card .ex-text{font-size:13px;color:var(--text-2);line-height:1.6;}

.scan-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;margin-top:36px;padding:18px;
  background:var(--primary-grad);color:#fff;
  font-size:17px;font-weight:700;border-radius:10px;
  transition:all .25s;box-shadow:0 8px 20px rgba(99,102,241,.3);
}
.scan-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(99,102,241,.4);}
.scan-btn:active{transform:translateY(0);}
.scan-btn i{font-size:16px;}

/* ============ 扫描动画页 ============ */
.scan-wrap{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:36px;padding:40px;
}
.scan-stage{
  position:relative;width:280px;height:280px;
  display:flex;align-items:center;justify-content:center;
}
.scan-ring{
  position:absolute;inset:0;border-radius:50%;
  border:2px solid rgba(99,102,241,.15);
}
.scan-ring.r2{inset:24px;border-color:rgba(139,92,246,.18);animation:spin 3s linear infinite reverse;}
.scan-ring.r3{inset:48px;border-color:rgba(99,102,241,.22);animation:spin 2s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.scan-doc{
  width:120px;height:150px;background:#fff;border-radius:10px;
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  display:flex;flex-direction:column;padding:16px 14px;gap:7px;z-index:2;
}
.scan-doc .ln{height:6px;border-radius:3px;background:#E5E7EB;}
.scan-doc .ln.s{width:60%;}
.scan-doc .ln.m{width:80%;}
.scan-doc .ln.l{width:90%;}
.scan-line{
  position:absolute;left:0;right:0;height:3px;top:0;
  background:linear-gradient(90deg,transparent,#6366F1,#8B5CF6,transparent);
  box-shadow:0 0 20px 4px rgba(99,102,241,.6);
  animation:scanMove 1.6s ease-in-out infinite;z-index:3;
}
@keyframes scanMove{
  0%,100%{top:8px;opacity:.4;}
  50%{top:calc(100% - 12px);opacity:1;}
}
.scan-glow{
  position:absolute;inset:-40px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,102,241,.18),transparent 60%);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.08);}}

.scan-status{
  font-size:18px;font-weight:600;color:var(--text-1);
  display:flex;align-items:center;gap:10px;min-height:30px;
}
.scan-status i{color:var(--primary);animation:blink 1s ease infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

.scan-progress{width:340px;max-width:80vw;}
.scan-bar{
  height:6px;background:#E5E7EB;border-radius:3px;overflow:hidden;
}
.scan-bar-fill{
  height:100%;width:0;border-radius:3px;
  background:var(--primary-grad);
  transition:width .3s ease;
}
.scan-percent{font-size:13px;color:var(--text-2);margin-top:10px;text-align:right;font-variant-numeric:tabular-nums;}

/* ============ 结果页 ============ */
.result-wrap{max-width:1280px;margin:0 auto;padding:32px 24px 80px;}
.result-top{
  display:grid;grid-template-columns:280px 1fr;gap:32px;align-items:center;
  background:#fff;border-radius:var(--radius);padding:28px 32px;
  box-shadow:var(--shadow-sm);margin-bottom:24px;
}
.gauge{display:flex;flex-direction:column;align-items:center;gap:8px;}
.gauge svg{transform:rotate(-90deg);}
.gauge-track{stroke:#EEF0F4;}
.gauge-fill{stroke-linecap:round;transition:stroke-dashoffset 1.2s ease;}
.gauge-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;
}
.gauge-score{font-size:36px;font-weight:800;line-height:1;}
.gauge-label{font-size:12px;color:var(--text-2);margin-top:4px;}
.gauge-wrap{position:relative;width:180px;height:180px;}
.result-summary{flex:1;}
.result-summary .tag{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px;
}
.result-summary h2{font-size:22px;font-weight:700;color:var(--text-1);margin-bottom:8px;}
.result-summary p{color:var(--text-2);font-size:15px;}
.rescan-btn{
  margin-top:18px;display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border:1.5px solid var(--border);border-radius:8px;
  background:#fff;color:var(--text-1);font-size:14px;font-weight:600;transition:all .2s;
}
.rescan-btn:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px);}

/* 三栏布局 */
.three-col{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:20px;margin-bottom:24px;}
.card{
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-sm);
  overflow:hidden;transition:box-shadow .2s;
}
.card:hover{box-shadow:var(--shadow-md);}
.card-head{
  padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;}
.card-head h3 i{color:var(--primary);font-size:15px;}
.card-body{padding:20px 22px;}

/* 原始任务高亮 */
.orig-text{font-size:15px;line-height:2;color:var(--text-1);}
.hl{
  background:var(--highlight);color:#92400E;
  padding:1px 4px;border-radius:4px;font-weight:600;
  position:relative;cursor:help;border-bottom:2px dotted #F59E0B;
}
.hl:hover{background:#FDE68A;}
.hl .tip{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  background:#1F2937;color:#fff;font-size:12px;font-weight:400;
  padding:8px 12px;border-radius:8px;width:220px;line-height:1.5;
  opacity:0;visibility:hidden;transition:all .2s;z-index:50;pointer-events:none;
  white-space:normal;text-align:left;
}
.hl .tip::after{
  content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:#1F2937;
}
.hl:hover .tip{opacity:1;visibility:visible;bottom:calc(100% + 6px);}

/* 风险报告 */
.risk-group{margin-bottom:6px;}
.risk-group-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 0;cursor:pointer;user-select:none;
}
.risk-group-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;}
.risk-group-title .gicon{
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  background:rgba(99,102,241,.1);color:var(--primary);font-size:13px;
}
.risk-group-count{font-size:12px;color:var(--text-3);}
.risk-group-head .chev{transition:transform .25s;color:var(--text-3);}
.risk-group.open .chev{transform:rotate(180deg);}
.risk-items{max-height:0;overflow:hidden;transition:max-height .35s ease;}
.risk-group.open .risk-items{max-height:1200px;}
.risk-item{
  padding:14px 0 14px 38px;border-top:1px dashed var(--border);
}
.risk-item-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.lvl{
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;
}
.lvl.high{background:rgba(239,68,68,.12);color:var(--risk-high);}
.lvl.mid{background:rgba(245,158,11,.12);color:var(--risk-mid);}
.lvl.low{background:rgba(16,185,129,.12);color:var(--risk-low);}
.risk-quote{
  font-size:13px;color:var(--text-2);background:#F9FAFB;
  border-left:3px solid var(--border);padding:6px 10px;border-radius:0 6px 6px 0;
  margin:6px 0;font-style:italic;
}
.risk-conseq,.risk-suggest{font-size:13px;margin-top:6px;line-height:1.7;}
.risk-conseq b{color:var(--risk-high);}
.risk-suggest b{color:var(--primary);}

/* 追问清单 */
.q-group{margin-bottom:20px;}
.q-group-title{
  font-size:13px;font-weight:700;margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.q-dot{width:8px;height:8px;border-radius:50%;}
.q-dot.must{background:var(--risk-high);}
.q-dot.later{background:var(--risk-mid);}
.q-item{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
  border-radius:8px;background:#F9FAFB;margin-bottom:8px;transition:background .2s;
}
.q-item:hover{background:#F3F4F6;}
.q-item .q-text{flex:1;font-size:13.5px;line-height:1.6;}
.q-copy{
  flex-shrink:0;width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:all .2s;font-size:12px;
}
.q-copy:hover{background:var(--primary);color:#fff;}
.q-copy-all{
  width:100%;margin-top:8px;padding:12px;border:1.5px dashed var(--primary);
  border-radius:8px;color:var(--primary);font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;background:rgba(99,102,241,.04);
}
.q-copy-all:hover{background:var(--primary);color:#fff;}

/* 底部两栏 */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;}

/* 时间线 */
.timeline{position:relative;padding-left:8px;}
.timeline::before{
  content:"";position:absolute;left:18px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(to bottom,var(--primary),var(--primary-2),transparent);
}
.tl-step{position:relative;padding:0 0 22px 44px;}
.tl-step:last-child{padding-bottom:0;}
.tl-node{
  position:absolute;left:10px;top:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;border:3px solid var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--primary);z-index:2;
}
.tl-step h4{font-size:14px;font-weight:700;margin-bottom:4px;}
.tl-step p{font-size:13px;color:var(--text-2);line-height:1.6;}

/* 确认话术 */
.script-box{position:relative;}
.script-text{
  font-size:14px;line-height:1.9;color:var(--text-1);
  background:#F9FAFB;border-radius:8px;padding:18px 20px;
  border:1px solid var(--border);white-space:pre-wrap;
}
.script-copy{
  position:absolute;top:14px;right:14px;
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:6px;background:#fff;
  border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text-1);
  transition:all .2s;
}
.script-copy:hover{border-color:var(--primary);color:var(--primary);}

/* Toast */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1F2937;color:#fff;padding:12px 22px;border-radius:10px;
  font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;
  box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transition:all .3s;z-index:9999;
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
.toast i{color:var(--risk-low);}

/* 响应式 */
@media (max-width:1024px){
  .three-col{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
  .result-top{grid-template-columns:1fr;text-align:center;}
  .identity-grid{grid-template-columns:repeat(3,1fr);}
  .examples{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:600px){
  .identity-grid{grid-template-columns:repeat(2,1fr);}
  .examples{grid-template-columns:1fr;}
  .brand h1{font-size:30px;}
}
</style>
</head>
<body>

<!-- ============ 视图一：输入页 ============ -->
<section class="view active" id="view-input">
  <div class="input-wrap">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
      <h1>先别开工</h1>
      <p>开工前，先扫一遍返工风险</p>
    </div>

    <div class="section-label">选择你的身份</div>
    <div class="identity-grid" id="identityGrid">
      <button class="identity-chip" data-id="student"><i class="fa-solid fa-user-graduate"></i><span>学生</span></button>
      <button class="identity-chip" data-id="intern"><i class="fa-solid fa-seedling"></i><span>实习生</span></button>
      <button class="identity-chip" data-id="developer"><i class="fa-solid fa-code"></i><span>开发者</span></button>
      <button class="identity-chip" data-id="designer"><i class="fa-solid fa-pen-ruler"></i><span>设计师</span></button>
      <button class="identity-chip" data-id="pm"><i class="fa-solid fa-chart-line"></i><span>产品/运营</span></button>
      <button class="identity-chip" data-id="lead"><i class="fa-solid fa-user-tie"></i><span>项目负责人</span></button>
    </div>

    <div class="section-label">粘贴你的任务说明</div>
    <textarea class="task-input" id="taskInput" placeholder="把收到的任务、需求、作业要求粘贴到这里……&#10;例如：帮我把首页优化一下，做得更有质感一点，明天下午给我看个版本。"></textarea>

    <div class="section-label" style="margin-top:28px;">或试试这些示例任务</div>
    <div class="examples" id="examples"></div>

    <button class="scan-btn" id="startScan">
      <i class="fa-solid fa-magnifying-glass-chart"></i>
      <span>开始扫描返工风险</span>
    </button>
  </div>
</section>

<!-- ============ 视图二：扫描动画页 ============ -->
<section class="view" id="view-scan">
  <div class="scan-wrap">
    <div class="scan-stage">
      <div class="scan-glow"></div>
      <div class="scan-ring"></div>
      <div class="scan-ring r2"></div>
      <div class="scan-ring r3"></div>
      <div class="scan-doc">
        <div class="scan-line"></div>
        <div class="ln l"></div><div class="ln m"></div><div class="ln l"></div>
        <div class="ln s"></div><div class="ln m"></div><div class="ln l"></div>
        <div class="ln s"></div><div class="ln m"></div>
      </div>
    </div>
    <div class="scan-status" id="scanStatus">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <span>正在解析任务...</span>
    </div>
    <div class="scan-progress">
      <div class="scan-bar"><div class="scan-bar-fill" id="scanBar"></div></div>
      <div class="scan-percent" id="scanPercent">0%</div>
    </div>
  </div>
</section>

<!-- ============ 视图三：结果页 ============ -->
<section class="view" id="view-result">
  <div class="result-wrap">
    <!-- 顶部：评分 + 总结 -->
    <div class="result-top">
      <div class="gauge">
        <div class="gauge-wrap">
          <svg width="180" height="180" viewBox="0 0 180 180">
            <circle class="gauge-track" cx="90" cy="90" r="78" fill="none" stroke-width="12"/>
            <circle class="gauge-fill" id="gaugeFill" cx="90" cy="90" r="78" fill="none" stroke-width="12"
              stroke="#EF4444" stroke-dasharray="490" stroke-dashoffset="490"/>
          </svg>
          <div class="gauge-center">
            <div class="gauge-score" id="gaugeScore">0</div>
            <div class="gauge-label">返工风险 / 100</div>
          </div>
        </div>
      </div>
      <div class="result-summary">
        <span class="tag" id="riskTag"></span>
        <h2 id="summaryTitle"></h2>
        <p id="summaryText"></p>
        <button class="rescan-btn" id="rescanBtn"><i class="fa-solid fa-rotate-left"></i>重新扫描</button>
      </div>
    </div>

    <!-- 三栏：原始任务 / 风险报告 / 追问清单 -->
    <div class="three-col">
      <!-- 左：原始任务 -->
      <div class="card">
        <div class="card-head"><h3><i class="fa-solid fa-file-lines"></i>原始任务</h3></div>
        <div class="card-body"><div class="orig-text" id="origText"></div></div>
      </div>
      <!-- 中：风险报告 -->
      <div class="card">
        <div class="card-head"><h3><i class="fa-solid fa-triangle-exclamation"></i>风险扫描报告</h3></div>
        <div class="card-body" id="riskReport"></div>
      </div>
      <!-- 右：追问清单 -->
      <div class="card">
        <div class="card-head"><h3><i class="fa-solid fa-clipboard-question"></i>追问清单</h3></div>
        <div class="card-body" id="questionList"></div>
      </div>
    </div>

    <!-- 两栏：安全开工路线 / 确认话术 -->
    <div class="two-col">
      <div class="card">
        <div class="card-head"><h3><i class="fa-solid fa-route"></i>安全开工路线</h3></div>

function renderExamples(){
  const box = document.getElementById('examples');
  box.innerHTML = EXAMPLES.map(e=>`
    <button class="example-card" data-text="${e.text}">
      <span class="ex-tag"><i class="fa-solid ${e.icon}"></i>${e.tag}</span>
      <span class="ex-text">“${e.text}”</span>
    </button>`).join('');
  box.querySelectorAll('.example-card').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.getElementById('taskInput').value = c.dataset.text;
      document.getElementById('taskInput').focus();
    });
  });
}

function bindIdentity(){
  document.querySelectorAll('.identity-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('.identity-chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedIdentity = chip.dataset.id;
    });
  });
}

/* ============================================================
   视图切换
   ============================================================ */
function switchView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   扫描流程
   ============================================================ */
function startScan(){
  const text = document.getElementById('taskInput').value.trim();
  if(!text){ showToast('请先输入任务说明'); return; }
  currentTaskText = text;
  switchView('view-scan');
  runScanAnimation(()=>{
    const data = TASKS[text] || generateFallback(text);
    renderResult(data, text);
    switchView('view-result');
  });
}

function runScanAnimation(done){
  const statusEl = document.getElementById('scanStatus').querySelector('span');
  const bar = document.getElementById('scanBar');
  const pct = document.getElementById('scanPercent');
  const steps = ["正在解析任务...","识别模糊表达...","扫描返工风险...","生成确认话术..."];
  let progress = 0, stepIdx = 0;
  statusEl.textContent = steps[0];
  const tick = setInterval(()=>{
    progress += 2;
    if(progress % 25 === 0 && stepIdx < steps.length-1){ stepIdx++; statusEl.textContent = steps[stepIdx]; }
    bar.style.width = progress + '%';
    pct.textContent = progress + '%';
    if(progress >= 100){ clearInterval(tick); setTimeout(done, 250); }
  }, 50);
}

      {title:"执行交付", desc:"按约定推进并阶段性同步。"},
      {title:"复盘对齐", desc:"交付后确认是否符合预期。"}
    ]
  };
}

/* ============================================================
   结果页渲染
   ============================================================ */
function renderResult(data, text){
  renderGauge(data.score);
  renderSummary(data);
  renderOrigText(text, data.highlights);
  renderRiskReport(data.riskGroups);
  renderQuestions(data.questions);
  renderTimeline(data.timeline);
  renderScript(data.questions);
}

function renderGauge(score){
  const fill = document.getElementById('gaugeFill');
  const scoreEl = document.getElementById('gaugeScore');
  const tag = document.getElementById('riskTag');
  const circumference = 2 * Math.PI * 78; // ≈490
  const offset = circumference * (1 - score/100);
  let color, label;
  if(score >= 70){ color = "#EF4444"; label = "高风险"; }
  else if(score >= 50){ color = "#F59E0B"; label = "中风险"; }
  else { color = "#10B981"; label = "低风险"; }
  fill.setAttribute('stroke', color);
  // 动画起始
  fill.style.strokeDashoffset = circumference;
  setTimeout(()=>{ fill.style.strokeDashoffset = offset; }, 100);
  // 数字动画
  let n = 0; const step = Math.ceil(score/30);
  const timer = setInterval(()=>{ n += step; if(n >= score){ n = score; clearInterval(timer); } scoreEl.textContent = n; scoreEl.style.color = color; }, 30);
  tag.style.background = color + "20";
  tag.style.color = color;
  tag.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>${label}`;
}

function renderSummary(data){
  document.getElementById('summaryTitle').textContent = `返工风险 ${data.score}/100`;
  document.getElementById('summaryText').textContent = data.summary;
}

function renderOrigText(text, highlights){
  const el = document.getElementById('origText');
  let html = escapeHtml(text);
  // 按词替换（倒序避免位置错乱）
  highlights.forEach(h=>{
    const tip = escapeHtml(h.tip);
    const re = new RegExp(escapeRegExp(h.word), 'g');
    html = html.replace(re, `<span class="hl">${escapeHtml(h.word)}<span class="tip">${tip}</span></span>`);
  });
  el.innerHTML = html;
}

function renderRiskReport(groups){
  const el = document.getElementById('riskReport');
  el.innerHTML = groups.map((g,i)=>{
    const itemsHtml = g.items.map(it=>`
      <div class="risk-item">
        <div class="risk-item-head">
          <span class="lvl ${it.lvl}">${it.lvl==='high'?'高风险':it.lvl==='mid'?'中风险':'低风险'}</span>
        </div>
        <div class="risk-quote">“${escapeHtml(it.quote)}”</div>
        <div class="risk-conseq"><b>可能后果：</b>${escapeHtml(it.conseq)}</div>
        <div class="risk-suggest"><b>建议处理：</b>${escapeHtml(it.suggest)}</div>
      </div>`).join('');
    return `
      <div class="risk-group ${i===0?'open':''}" data-idx="${i}">
        <div class="risk-group-head">
          <div class="risk-group-title">
            <span class="gicon"><i class="fa-solid ${g.icon}"></i></span>
            <span>${escapeHtml(g.title)}</span>
            <span class="risk-group-count">${g.items.length} 项</span>
          </div>
          <i class="fa-solid fa-chevron-down chev"></i>
        </div>
        <div class="risk-items">${itemsHtml}</div>
      </div>`;
  }).join('');
  // 绑定折叠
  el.querySelectorAll('.risk-group-head').forEach(head=>{
    head.addEventListener('click', ()=>head.parentElement.classList.toggle('open'));
  });
}

function renderQuestions(q){
  const el = document.getElementById('questionList');
  const mustHtml = q.must.map((t,i)=>qItemHtml(t,'must',i)).join('');
  const laterHtml = q.later.map((t,i)=>qItemHtml(t,'later',i)).join('');
  el.innerHTML = `
    <div class="q-group">
      <div class="q-group-title"><span class="q-dot must"></span>开工前必须问（${q.must.length}）</div>
      ${mustHtml}
    </div>
    <div class="q-group">
      <div class="q-group-title"><span class="q-dot later"></span>可以边做边确认（${q.later.length}）</div>
      ${laterHtml}
    </div>
    <button class="q-copy-all" id="qCopyAll"><i class="fa-regular fa-copy"></i>一键复制全部问题</button>`;
  // 单条复制
  el.querySelectorAll('.q-copy').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      copyText(btn.dataset.text);
    });
  });
  // 全部复制
  document.getElementById('qCopyAll').addEventListener('click', ()=>{
    const all = [...q.must, ...q.later].map((t,i)=>`${i+1}. ${t}`).join('\n');
    copyText(all);
  });
}

function qItemHtml(text, type, idx){
  return `
    <div class="q-item">
      <span class="q-text">${escapeHtml(text)}</span>
      <button class="q-copy" data-text="${escapeAttr(text)}" title="复制"><i class="fa-regular fa-copy"></i></button>
    </div>`;
}

function renderTimeline(steps){
  document.getElementById('timeline').innerHTML = steps.map((s,i)=>`
    <div class="tl-step">
      <div class="tl-node">${i+1}</div>
      <h4>${escapeHtml(s.title)}</h4>
      <p>${escapeHtml(s.desc)}</p>
    </div>`).join('');
}

function renderScript(q){
  const style = IDENTITY_STYLES[selectedIdentity] || IDENTITY_STYLES.intern;
  const mustQ = q.must.map((t,i)=>`${i+1}. ${t}`).join('\n');
  const laterQ = q.later.map((t,i)=>`${i+1}. ${t}`).join('\n');
  const script = `${style.prefix}\n\n【开工前必须确认】\n${mustQ}\n\n【可以边做边确认】\n${laterQ}\n\n麻烦先回复以上关键点，我再开始动手，这样能尽量一次做对，减少返工。谢谢！`;
  document.getElementById('scriptText').textContent = script;
}

function copyScript(){
  copyText(document.getElementById('scriptText').textContent);
}

/* ============================================================
   工具函数
   ============================================================ */
function copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>showToast('已复制到剪贴板')).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); showToast('已复制到剪贴板'); }
  catch(e){ showToast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2000);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function escapeRegExp(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

init();
</script>
