<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>思豪大酒店 — 互动拼图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#FBF7F0;--bg2:#F5EDE0;--ink:#2D2418;--muted:#7A6B5D;--rule:#E0D5C7;
  --accent:#C75B39;--accent2:#5B8A72;--accent3:#D4A574;--success:#4CAF50;
}
body{font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;height:100vh;width:100vw;touch-action:none;-webkit-user-select:none;user-select:none;}

/* ====== SCREENS ====== */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,transform .5s;}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.95);}

/* ====== START SCREEN ====== */
#start{background:linear-gradient(180deg,#E8D5C4 0%,var(--bg) 100%);}
#start .title{font-size:2rem;font-weight:700;color:var(--ink);margin-bottom:.25rem;text-align:center;}
#start .subtitle{font-size:.9rem;color:var(--muted);margin-bottom:2rem;text-align:center;}
#start .hotel-preview{width:160px;height:240px;position:relative;margin:0 auto 2rem;}
#start .hotel-preview .floor{position:absolute;width:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#fff;font-weight:700;opacity:0;animation:floorAppear .5s forwards;}
#start .hotel-preview .floor:nth-child(7){bottom:0;height:32px;background:#5B6B48;border-radius:0 0 6px 6px;animation-delay:0s;}
#start .hotel-preview .floor:nth-child(6){bottom:34px;height:36px;background:#6B7D52;animation-delay:.1s;}
#start .hotel-preview .floor:nth-child(5){bottom:72px;height:32px;background:#8B9A6B;animation-delay:.2s;}
#start .hotel-preview .floor:nth-child(4){bottom:106px;height:32px;background:#A08850;animation-delay:.3s;}
#start .hotel-preview .floor:nth-child(3){bottom:140px;height:32px;background:#B8703E;animation-delay:.4s;}
#start .hotel-preview .floor:nth-child(2){bottom:174px;height:36px;background:#C75B39;animation-delay:.5s;}
#start .hotel-preview .floor:nth-child(1){bottom:212px;height:28px;width:40px;left:50%;transform:translateX(-50%);background:#A0402A;border-radius:4px 4px 0 0;animation-delay:.6s;}
@keyframes floorAppear{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.btn-start{background:var(--accent);color:#fff;border:none;padding:14px 48px;border-radius:30px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 16px rgba(199,91,57,.3);}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(199,91,57,.4);}
.btn-start:active{transform:translateY(0);}

/* ====== GAME SCREEN ====== */
#game{background:linear-gradient(180deg,#E8D5C4 0%,#D4C4B0 100%);justify-content:flex-start;padding-top:1rem;}
.game-header{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:0 1rem;margin-bottom:.5rem;}
.game-header .logo{font-size:.75rem;background:var(--accent);color:#fff;padding:3px 12px;border-radius:12px;font-weight:700;}
.game-header .progress{font-size:.8rem;color:var(--muted);}
.game-body{flex:1;width:100%;max-width:600px;display:flex;gap:1rem;padding:0 1rem;align-items:flex-start;justify-content:center;}

/* Build Area */
.build-area{flex:0 0 auto;position:relative;width:180px;}
.build-label{font-size:.7rem;color:var(--muted);text-align:center;margin-bottom:.5rem;}
.build-target{position:relative;width:180px;}
.build-slot{width:100%;border:2px dashed rgba(0,0,0,.2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:rgba(0,0,0,.2);font-weight:700;transition:all .3s;position:absolute;}
.build-slot.filled{border:none;opacity:1;}
.build-slot.highlight{border-color:var(--accent);background:rgba(199,91,57,.1);}

/* Piece Pool */
.piece-pool{flex:1;position:relative;min-height:300px;max-height:420px;overflow:visible;}
.pool-label{font-size:.7rem;color:var(--muted);margin-bottom:.5rem;text-align:center;}

/* Draggable Piece */
.piece{position:absolute;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;font-weight:700;cursor:grab;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:box-shadow .2s;border:2px solid rgba(255,255,255,.2);touch-action:none;}
.piece:active{cursor:grabbing;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:100;}
.piece.placed{pointer-events:none;opacity:0;transition:opacity .3s;}

/* ====== CARD MODAL ====== */
#card-modal{background:rgba(0,0,0,.45);z-index:200;}
#card-modal .card{background:#fff;border-radius:12px;padding:1.5rem;max-width:340px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.15);position:relative;transform:translateY(0);animation:cardIn .3s;}
@keyframes cardIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card .card-badge{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:#fff;font-size:.75rem;font-weight:700;margin-bottom:.5rem;}
.card .card-title{font-size:1.1rem;font-weight:700;margin-bottom:.15rem;}
.card .card-year{font-size:.75rem;color:var(--accent);font-weight:700;margin-bottom:.75rem;}
.card .card-body{font-size:.85rem;color:var(--muted);line-height:1.7;margin-bottom:1rem;}
.card .card-body p{margin-bottom:.5rem;}
.card .card-actions{display:flex;gap:.5rem;justify-content:flex-end;}
.card .btn{border:none;padding:8px 20px;border-radius:20px;font-size:.8rem;font-weight:700;cursor:pointer;transition:transform .15s;}
.card .btn:active{transform:scale(.95);}
.card .btn-speak{background:var(--accent3);color:#fff;}
.card .btn-close{background:var(--bg2);color:var(--ink);}

/* ====== COMPLETE SCREEN ====== */
#complete{background:linear-gradient(180deg,#E8D5C4 0%,var(--bg) 100%);z-index:150;}
#complete .badge-icon{width:80px;height:80px;background:var(--accent2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;margin-bottom:1rem;animation:badgePop .5s;}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
#complete h2{font-size:1.5rem;color:var(--accent);margin-bottom:.25rem;}
#complete p{color:var(--muted);margin-bottom:1.5rem;font-size:.9rem;}
.timeline{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:2rem;max-width:400px;}
.timeline .tl-item{background:var(--accent2);color:#fff;padding:4px 12px;border-radius:12px;font-size:.7rem;font-weight:700;}
.timeline .tl-item:nth-child(even){background:var(--accent3);}
.timeline .tl-item:last-child{background:var(--accent);}
.btn-explore{background:var(--accent2);color:#fff;border:none;padding:12px 36px;border-radius:30px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:.5rem;transition:transform .2s;}
.btn-explore:hover{transform:translateY(-2px);}
.btn-replay{background:none;border:2px solid var(--rule);color:var(--muted);padding:10px 36px;border-radius:30px;font-size:.9rem;font-weight:700;cursor:pointer;transition:border-color .2s;}
.btn-replay:hover{border-color:var(--muted);}

/* ====== EXPLORE SCREEN ====== */
#explore{background:linear-gradient(180deg,#E8D5C4 0%,#D4C4B0 100%);justify-content:flex-start;padding-top:1.5rem;}
#explore .explore-title{font-size:.8rem;color:var(--muted);margin-bottom:1rem;}
.explore-hotel{position:relative;width:180px;height:262px;cursor:pointer;}
.explore-floor{position:absolute;width:100%;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;font-weight:700;transition:all .2s;cursor:pointer;border:2px solid transparent;}
.explore-floor:hover{filter:brightness(1.15);border-color:rgba(255,255,255,.4);transform:scale(1.02);}
.explore-floor .floor-label{opacity:0;transition:opacity .2s;font-size:.6rem;}
.explore-floor:hover .floor-label{opacity:1;}
#explore .btn-back{position:fixed;top:1rem;right:1rem;background:var(--bg2);border:1px solid var(--rule);padding:6px 16px;border-radius:16px;font-size:.75rem;font-weight:700;color:var(--muted);cursor:pointer;z-index:10;}

/* Confetti */
.confetti{position:fixed;pointer-events:none;z-index:300;}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall 2s forwards;}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Clock animation */
@keyframes clockTick{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.clock-hand{animation:clockTick 60s linear infinite;transform-origin:bottom center;}

/* Window glow */
@keyframes windowGlow{0%,100%{opacity:.3}50%{opacity:.8}}
.window-glow{animation:windowGlow 3s ease-in-out infinite;}

/* Responsive */
@media(max-width:480px){
  #start .title{font-size:1.5rem;}
  .game-body{flex-direction:column;align-items:center;}
  .build-area{width:160px;}
  .build-target{width:160px;}
  .piece-pool{min-height:200px;width:100%;max-width:300px;}
  .card .card-body{font-size:.8rem;}
}
</style>
</head>
<body>

<!-- ====== START SCREEN ====== -->
<div id="start" class="screen">
  <div class="title">思豪大酒店</div>
  <div class="subtitle">把散落的建筑拼起来，了解百年历史</div>
  <div class="hotel-preview" id="preview"></div>
  <button class="btn-start" onclick="startGame()">开始拼装</button>
</div>

<!-- ====== GAME SCREEN ====== -->
<div id="game" class="screen hidden">
  <div class="game-header">
    <span class="logo">思豪大酒店</span>
    <span class="progress" id="progress-text">已完成 0/7</span>
  </div>
  <div class="game-body">
    <div style="text-align:center">
      <div class="build-label">拼接区</div>
      <div class="build-area">
        <div class="build-target" id="build-target"></div>
      </div>
    </div>
    <div style="flex:1">
      <div class="pool-label">碎片池 — 拖拽到左边</div>
      <div class="piece-pool" id="piece-pool"></div>
    </div>
  </div>
</div>

<!-- ====== CARD MODAL ====== -->
<div id="card-modal" class="screen hidden" onclick="closeCardOutside(event)">
  <div class="card" id="card-content"></div>
</div>

<!-- ====== COMPLETE SCREEN ====== -->
<div id="complete" class="screen hidden">
  <div class="badge-icon">&#9733;</div>
  <h2>小小建筑师</h2>
  <p>你完成了思豪大酒店的拼装！</p>
  <div class="timeline" id="timeline"></div>
  <button class="btn-explore" onclick="startExplore()">继续探索</button>
  <br>
  <button class="btn-replay" onclick="resetGame()">再玩一次</button>
</div>

<!-- ====== EXPLORE SCREEN ====== -->
<div id="explore" class="screen hidden">
  <button class="btn-back" onclick="backFromExplore()">返回</button>
  <div class="explore-title">点击任意楼层查看历史故事</div>
  <div class="explore-hotel" id="explore-hotel"></div>
</div>

<!-- ====== CONFETTI ====== -->
<div class="confetti" id="confetti" style="display:none"></div>

<script>
// ====== DATA ======
var PIECES = [
  {
    id:'P1', floor:'骑楼基座', year:'1924', date:'1924年', title:'香山银行诞生',
    color:'#5B6B48', height:32, top:0,
    paragraphs:[
      '有一位从澳大利亚回来的华侨叔叔，叫郭四泉。他回到家乡中山，开了一家银行，叫"香山银行"。',
      '这栋楼用了意大利进口的水磨石做地面，窗户是英式拱券造型，是中山最早的现代建筑之一！'
    ],
    funFact:'"香山"是中山市的旧称，因为孙中山先生的缘故，1925年改名为中山。'
  },
  {
    id:'P2', floor:'一楼大堂', year:'1948', date:'1948年4月4日', title:'思豪大酒店开业',
    color:'#6B7D52', height:36, top:0,
    paragraphs:[
      '中山县商会会长李德联在原来的废墟上，重建了一栋五层楼的大酒店，取名叫"思豪大酒店"。',
      '开业那天可热闹了，连澳门和香港的报纸都来报道！酒店创下了三个"第一"：第一家现代旅社、第一间西餐厅、最有名的酒店。',
      '全县的旅店一共只有15部电话，这里就占了6部！每间客房还配了收音机，在当时非常时髦。'
    ],
    funFact:'"思豪"这个名字来自香港的一家同名酒店，家具也是从香港运来的哦！'
  },
  {
    id:'P3', floor:'二楼客房', year:'抗战时期', date:'抗日战争', title:'炸毁与重建',
    color:'#8B9A6B', height:32, top:0,
    paragraphs:[
      '抗日战争期间，日本军队多次轰炸中山，这栋漂亮的大楼被炸成了废墟，只剩下前厅的一小部分。',
      '战争结束后，李德联先生没有放弃，他在废墟上重新建起了思豪大酒店，让这座地标建筑获得了新生。'
    ],
    funFact:'重建后的酒店有43间客房，每间都配有当时最先进的设备。'
  },
  {
    id:'P4', floor:'三楼餐饮', year:'1960-2000', date:'1960年代', title:'国营石岐旅店',
    color:'#A08850', height:32, top:0,
    paragraphs:[
      '新中国成立后，这栋楼经历了很多变化。50年代变成了公安局的办公大楼，60年代改名叫做"国营石岐旅店"。',
      '后来，随着新酒店越来越多，石岐旅店的设备变得旧旧的，生意慢慢淡了。90年代一楼租给别人卖衣服，到了2000年就停止营业了。'
    ],
    funFact:'2025年翻修的时候，工人们拆掉旧广告牌，意外发现了"石岐旅店"的老招牌！'
  },
  {
    id:'P5', floor:'四楼', year:'2009', date:'2009年9月30日', title:'文物保护单位',
    color:'#B8703E', height:32, top:0,
    paragraphs:[
      '虽然酒店不再营业了，但这栋楼的历史价值被大家认可。2009年，中山市政府把它列为"文物保护单位"。',
      '这意味着这栋楼受到了法律保护，任何人都不可以随意拆除或破坏它，它是中山宝贵的历史遗产。'
    ],
    funFact:'中山市第五批一共有37处文物保护单位，思豪大酒店是其中之一。'
  },
  {
    id:'P6', floor:'五楼', year:'2022-2025', date:'2022年', title:'微改造焕新',
    color:'#C75B39', height:36, top:0,
    paragraphs:[
      '中山市决定让这栋百年老楼"活"过来！工程师们用了很厉害的技术，比如用干冰来清除旧涂料，露出了漂亮的青砖墙壁。',
      '每间客房都恢复了原来的样子，一共43间。老招牌、雕花楼梯、铁艺窗花这些"老物件"都被小心保留下来。'
    ],
    funFact:'设计团队来自上海的同济大学，他们用了"修旧如旧"的方法，让老建筑看起来和以前一样。'
  },
  {
    id:'P7', floor:'钟楼', year:'2025', date:'2025年6月18日', title:'焕新启幕',
    color:'#A0402A', height:28, top:0, isTower:true,
    paragraphs:[
      '2025年6月18日，思豪大酒店终于重新开门啦！一楼的西餐厅可以吃到葡国特色美食。',
      '高高的钟楼再次成为孙文西路步行街上最醒目的地标，就像100年前香山银行刚建好时一样引人注目。'
    ],
    funFact:'焕新后的步行街在"五一"假期迎来了60万人次的游客！'
  }
];

// ====== STATE ======
var placedCount = 0;
var dragPiece = null;
var dragOffsetX = 0, dragOffsetY = 0;
var savedProgress = null;

// Load saved progress
try {
  var saved = localStorage.getItem('sihao_progress');
  if (saved) savedProgress = JSON.parse(saved);
} catch(e) {}

// ====== INIT START SCREEN ======
(function initPreview(){
  var preview = document.getElementById('preview');
  PIECES.forEach(function(p){
    var div = document.createElement('div');
    div.className = 'floor';
    div.textContent = p.isTower ? '' : p.floor;
    preview.appendChild(div);
  });
})();

// ====== SCREEN TRANSITIONS ======
function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.add('hidden'); });
  document.getElementById(id).classList.remove('hidden');
}

// ====== START GAME ======
function startGame(){
  showScreen('game');
  placedCount = 0;
  updateProgress();
  buildTarget();
  buildPieces();
}

// ====== BUILD TARGET SLOTS ======
function buildTarget(){
  var target = document.getElementById('build-target');
  target.innerHTML = '';
  var totalH = 0;
  var positions = [];
  PIECES.forEach(function(p){
    positions.push(totalH);
    totalH += p.height + 2;
  });
  target.style.height = totalH + 'px';
  target.style.position = 'relative';

  PIECES.forEach(function(p, i){
    var slot = document.createElement('div');
    slot.className = 'build-slot';
    slot.id = 'slot-' + p.id;
    slot.dataset.index = i;
    slot.style.height = p.height + 'px';
    slot.style.top = positions[i] + 'px';
    slot.textContent = p.isTower ? '钟楼' : p.floor;
    if(p.isTower){
      slot.style.width = '40px';
      slot.style.left = '50%';
      slot.style.transform = 'translateX(-50%)';
      slot.style.borderRadius = '4px 4px 0 0';
    }
    target.appendChild(slot);
  });
}

// ====== BUILD PIECES (scattered) ======
function buildPieces(){
  var pool = document.getElementById('piece-pool');
  pool.innerHTML = '';
  var poolRect = pool.getBoundingClientRect();
  var poolW = pool.offsetWidth || 200;
  var poolH = pool.offsetHeight || 300;

  // Restore saved progress
  if(savedProgress && savedProgress.placed){
    savedProgress.placed.forEach(function(pid){
      PIECES.forEach(function(p){
        if(p.id === pid){
          placedCount++;
          var slot = document.getElementById('slot-' + pid);
          if(slot){
            slot.classList.add('filled');
            slot.style.background = p.color;
            slot.style.opacity = '1';
          }
        }
      });
    });
    updateProgress();
  }

  var remaining = PIECES.filter(function(p){
    return !(savedProgress && savedProgress.placed && savedProgress.placed.indexOf(p.id) >= 0);
  });

  // Shuffle remaining
  for(var i = remaining.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = remaining[i]; remaining[i] = remaining[j]; remaining[j] = tmp;
  }

  remaining.forEach(function(p, idx){
    var el = document.createElement('div');
    el.className = 'piece';
    el.id = 'piece-' + p.id;
    el.dataset.index = PIECES.indexOf(p);
    el.textContent = p.isTower ? '钟楼' : p.floor;
    el.style.width = p.isTower ? '50px' : (poolW > 120 ? '90%' : '80%');
    el.style.maxWidth = p.isTower ? '50px' : '140px';
    el.style.height = Math.max(p.height, 44) + 'px';
    el.style.background = p.color;
    // Scatter
    var x = Math.random() * (poolW - 100);
    var y = idx * (Math.max(p.height, 44) + 8);
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.position = 'absolute';
    pool.appendChild(el);

    // Mouse events
    el.addEventListener('mousedown', onPieceDown);
    el.addEventListener('touchstart', onPieceDown, {passive:false});
  });

  if(placedCount >= 7){
    setTimeout(function(){ showComplete(); }, 300);
  }
}

// ====== DRAG & DROP ======
function onPieceDown(e){
  if(dragPiece) return;
  e.preventDefault();
  var el = e.currentTarget;
  dragPiece = el;
  var rect = el.getBoundingClientRect();
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  var clientY = e.touches ? e.touches[0].clientY : e.clientY;
  dragOffsetX = clientX - rect.left;
  dragOffsetY = clientY - rect.top;
  // Move to body for free dragging
  el.style.position = 'fixed';
  el.style.left = rect.left + 'px';
  el.style.top = rect.top + 'px';
  el.style.zIndex = '100';
  el.style.transition = 'none';
  el.style.width = el.offsetWidth + 'px';
  document.body.appendChild(el);
}

document.addEventListener('mousemove', onDragMove);
document.addEventListener('touchmove', onDragMove, {passive:false});
function onDragMove(e){
  if(!dragPiece) return;
  e.preventDefault();
  var clientX = e.touches ? e.touches[0].clientX : e.clientX;
  var clientY = e.touches ? e.touches[0].clientY : e.clientY;
  dragPiece.style.left = (clientX - dragOffsetX) + 'px';
  dragPiece.style.top = (clientY - dragOffsetY) + 'px';
  // Highlight target slot
  highlightSlots(clientX, clientY);
}

document.addEventListener('mouseup', onDragEnd);
document.addEventListener('touchend', onDragEnd);
function onDragEnd(e){
  if(!dragPiece) return;
  clearHighlights();
  var el = dragPiece;
  var idx = parseInt(el.dataset.index);
  var piece = PIECES[idx];
  var slot = document.getElementById('slot-' + piece.id);

  var elRect = el.getBoundingClientRect();
  var slotRect = slot.getBoundingClientRect();
  var elCX = elRect.left + elRect.width / 2;
  var elCY = elRect.top + elRect.height / 2;

  var dx = Math.abs(elCX - (slotRect.left + slotRect.width / 2));
  var dy = Math.abs(elCY - (slotRect.top + slotRect.height / 2));

  if(dx < 60 && dy < 30){
    // Correct placement
    slot.classList.add('filled');
    slot.style.background = piece.color;
    slot.style.opacity = '1';
    slot.style.border = '2px solid rgba(255,255,255,.3)';
    slot.style.boxShadow = '0 0 10px rgba(255,255,255,.3)';
    setTimeout(function(){
      slot.style.boxShadow = 'none';
      slot.style.border = 'none';
    }, 500);
    el.remove();
    placedCount++;
    updateProgress();
    saveProgress(piece.id);
    setTimeout(function(){ showCard(piece); }, 400);
    if(placedCount >= 7){
      setTimeout(function(){ showComplete(); }, 1500);
    }
  } else {
    // Return to pool
    returnToPool(el);
  }
  dragPiece = null;
}

function highlightSlots(cx, cy){
  PIECES.forEach(function(p){
    var slot = document.getElementById('slot-' + p.id);
    if(slot.classList.contains('filled')) return;
    var r = slot.getBoundingClientRect();
    if(cx > r.left - 30 && cx < r.right + 30 && cy > r.top - 20 && cy < r.bottom + 20){
      slot.classList.add('highlight');
    } else {
      slot.classList.remove('highlight');
    }
  });
}
function clearHighlights(){
  document.querySelectorAll('.build-slot.highlight').forEach(function(s){ s.classList.remove('highlight'); });
}

function returnToPool(el){
  var pool = document.getElementById('piece-pool');
  var poolRect = pool.getBoundingClientRect();
  el.style.transition = 'all .3s';
  el.style.position = 'absolute';
  el.style.left = (Math.random() * (pool.offsetWidth - 80)) + 'px';
  el.style.top = (Math.random() * (pool.offsetHeight - 60)) + 'px';
  el.style.zIndex = '10';
  el.style.transform = '';
  pool.appendChild(el);
  setTimeout(function(){ el.style.transition = ''; }, 300);
}

function updateProgress(){
  document.getElementById('progress-text').textContent = '已完成 ' + placedCount + '/7';
}

function saveProgress(id){
  if(!savedProgress) savedProgress = {placed:[]};
  if(savedProgress.placed.indexOf(id) < 0) savedProgress.placed.push(id);
  try{ localStorage.setItem('sihao_progress', JSON.stringify(savedProgress)); }catch(e){}
}

// ====== CARD ======
function showCard(piece){
  var modal = document.getElementById('card-modal');
  var content = document.getElementById('card-content');
  var parasHtml = piece.paragraphs.map(function(p){ return '<p>' + p + '</p>'; }).join('');
  content.innerHTML =
    '<div class="card-badge" style="background:' + piece.color + '">' + piece.id.replace('P','') + '</div>' +
    '<div class="card-title">' + piece.title + '</div>' +
    '<div class="card-year">' + piece.date + '</div>' +
    '<div class="card-body">' + parasHtml +
      '<p style="color:var(--accent);font-weight:700;font-size:.8rem;margin-top:.5rem;">&#9733; ' + piece.funFact + '</p>' +
    '</div>' +
    '<div class="card-actions">' +
      '<button class="btn btn-speak" onclick="speakCard(this)">朗读</button>' +
      '<button class="btn btn-close" onclick="closeCard()">关闭</button>' +
    '</div>';
  showScreen('card-modal');
  showScreen('game'); // keep game visible behind
  modal.classList.remove('hidden');
}

function closeCard(){
  document.getElementById('card-modal').classList.add('hidden');
}
function closeCardOutside(e){
  if(e.target === document.getElementById('card-modal')) closeCard();
}

function speakCard(btn){
  var body = document.querySelector('#card-content .card-body');
  var text = body.innerText;
  if(window.speechSynthesis){
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.9;
    u.onend = function(){ btn.textContent = '朗读'; };
    btn.textContent = '停止';
    window.speechSynthesis.speak(u);
  }
}

// ====== COMPLETE ======
function showComplete(){
  launchConfetti();
  var tl = document.getElementById('timeline');
  tl.innerHTML = '';
  PIECES.forEach(function(p){
    var span = document.createElement('span');
    span.className = 'tl-item';
    span.textContent = p.date + ' ' + (p.isTower ? '焕新' : p.floor);
    tl.appendChild(span);
  });
  showScreen('complete');
}

function launchConfetti(){
  var container = document.getElementById('confetti');
  container.style.display = 'block';
  container.innerHTML = '';
  var colors = ['#C75B39','#5B8A72','#D4A574','#E8D5C4','#A08850','#6B7D52'];
  for(var i = 0; i < 40; i++){
    var p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.top = '-10px';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = Math.random() * 1 + 's';
    p.style.animationDuration = (1.5 + Math.random()) + 's';
    container.appendChild(p);
  }
  setTimeout(function(){ container.style.display = 'none'; }, 3000);
}

// ====== EXPLORE ======
function startExplore(){
  document.getElementById('confetti').style.display = 'none';
  buildExploreHotel();
  showScreen('explore');
}

function buildExploreHotel(){
  var hotel = document.getElementById('explore-hotel');
  hotel.innerHTML = '';
  var totalH = 0;
  var positions = [];
  PIECES.forEach(function(p){ positions.push(totalH); totalH += p.height + 2; });
  hotel.style.height = totalH + 'px';

  PIECES.forEach(function(p, i){
    var div = document.createElement('div');
    div.className = 'explore-floor';
    div.style.height = p.height + 'px';
    div.style.top = positions[i] + 'px';
    div.style.background = p.color;
    div.dataset.index = i;
    if(p.isTower){
      div.style.width = '40px';
      div.style.left = '50%';
      div.style.transform = 'translateX(-50%)';
      div.style.borderRadius = '4px 4px 0 0';
      // Clock animation
      div.innerHTML = '<div style="position:absolute;bottom:2px;left:50%;width:2px;height:10px;background:#fff;transform-origin:bottom center;" class="clock-hand"></div>';
    } else {
      // Windows glow
      div.innerHTML = '<span class="floor-label">' + p.floor + '</span><span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:rgba(255,220,150,.6);" class="window-glow"></span>';
    }
    div.onclick = function(){ showCard(p); };
    hotel.appendChild(div);
  });
}

function backFromExplore(){
  closeCard();
  showScreen('complete');
}

// ====== RESET ======
function resetGame(){
  savedProgress = null;
  try{ localStorage.removeItem('sihao_progress'); }catch(e){}
  placedCount = 0;
  startGame();
}
</script>
