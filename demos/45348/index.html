<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI第三成员 · 协同编程工作台</title>

<!-- ============================================================
     Prism.js（CDN）：用于代码语法高亮
     - tomorrow 主题：暗色风格，与 VS Code 主题协调
     - 组件：core / clike / javascript / markup / css
     除此之外不依赖任何外部资源，所有逻辑在浏览器端完成。
     ============================================================ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-clike.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markup.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js" defer></script>

<style>
/* ============================================================
   全局样式：暗色 VS Code 风格主题
   - 通过 CSS 变量统一管理配色，便于二次开发与换肤
   ============================================================ */
:root{
  --bg:        #1e1e1e;  /* 主背景 */
  --bg-edit:   #252526;  /* 编辑区背景 */
  --bg-block:  #2d2d30;  /* 建议块/卡片背景 */
  --bg-elev:   #333333;  /* 悬浮元素背景 */
  --border:    #3c3c3c;  /* 边框 */
  --fg:        #d4d4d4;  /* 主文字 */
  --fg-muted:  #9d9d9d;  /* 次要文字 */
  --accent:    #0e639c;  /* VS Code 蓝（按钮） */
  --accent-hi: #1177bb;  /* 按钮 hover */
  --user-a:    #4fc3f7;  /* 用户A 蓝 */
  --user-b:    #81c784;  /* 用户B 绿 */
  --user-c:    #ffb74d;  /* 用户C 橙 */
  --accept:    #4caf50;  /* 采纳绿 */
  --reject:    #757575;  /* 拒绝灰 */
  --warn:      #ffb74d;  /* 警告 */
  --line-h: 21px;        /* 编辑器单行高度 */
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--fg);font-size:13px;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}

/* 顶部标题栏 */
#topbar{
  height:36px;background:#323233;border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:10px;
  -webkit-app-region:drag;
}
#topbar .logo{font-weight:600;letter-spacing:.3px;color:#fff}
#topbar .logo b{color:var(--user-a)}
#topbar .badge{font-size:11px;color:var(--fg-muted);padding:2px 8px;border:1px solid var(--border);border-radius:10px}
#topbar .spacer{flex:1}
#topbar .conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--user-b)}
#topbar .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--user-b);box-shadow:0 0 6px var(--user-b)}

/* 主区域：左 文件树 / 中 编辑器 / 右 建议面板 */
#main{display:flex;height:calc(100% - 36px - 44px)}

/* ---------- 左侧文件树 ---------- */
#sidebar{
  width:200px;min-width:200px;background:var(--bg-edit);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.side-title{
  padding:8px 14px;font-size:11px;letter-spacing:1px;color:var(--fg-muted);
  text-transform:uppercase;border-bottom:1px solid var(--border);user-select:none;
}
.file-tree{flex:1;overflow:auto;padding:6px 0}
.file-item{
  display:flex;align-items:center;gap:6px;padding:4px 14px;cursor:pointer;
  position:relative;white-space:nowrap;font-size:13px;color:var(--fg);
}
.file-item:hover{background:rgba(255,255,255,.04)}
.file-item.active{background:rgba(14,99,156,.35)}
.file-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--user-a)}
.file-item .ico{width:14px;color:#519aba;font-size:13px;text-align:center}
.file-item .name{flex:1;overflow:hidden;text-overflow:ellipsis}
/* 文件旁的协作者编辑状态小圆点 */
.file-item .dots{display:flex;gap:3px;align-items:center}
.file-item .dots .d{width:8px;height:8px;border-radius:50%;border:1.5px solid transparent}
.file-item .dots .d.on{box-shadow:0 0 5px currentColor}

/* ---------- 中央编辑器 ---------- */
#editor-wrap{flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg-edit);min-width:0}
.editor-tabbar{display:flex;background:var(--bg-edit);border-bottom:1px solid var(--border);height:34px;overflow:hidden}
.etab{display:flex;align-items:center;gap:6px;padding:0 14px;font-size:12px;color:var(--fg-muted);border-right:1px solid var(--border);cursor:pointer;white-space:nowrap}
.etab.active{background:var(--bg-edit);color:var(--fg);position:relative}
.etab.active::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--user-a)}
.etab .x{opacity:.5;font-size:13px}
.etab .x:hover{opacity:1}

/* 编辑器主体：行号 + 高亮层 + textarea 叠加 */
#editor{
  flex:1;position:relative;overflow:auto;display:flex;background:#1e1e1e;
}
.editor-lines{
  flex:0 0 auto;text-align:right;padding:10px 8px 200px 12px;color:#858585;
  font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:13px;line-height:var(--line-h);
  user-select:none;background:var(--bg-edit);border-right:1px solid var(--border);
}
.editor-area{position:relative;flex:1;min-width:0;padding:10px 12px 200px 12px}
.highlight-layer, .code-input{
  font-family:"JetBrains Mono","Fira Code",Consolas,monospace;
  font-size:13px;line-height:var(--line-h);
  white-space:pre;word-wrap:normal;tab-size:2;margin:0;border:0;
}
.highlight-layer{
  position:absolute;top:10px;left:12px;right:12px;bottom:200px;
  pointer-events:none;overflow:hidden;color:var(--fg);
}
.highlight-layer pre{margin:0;white-space:pre;background:transparent;padding:0}
.code-input{
  position:absolute;top:10px;left:12px;right:12px;bottom:200px;
  width:calc(100% - 24px);height:calc(100% - 210px);
  background:transparent;color:transparent;caret-color:var(--user-a);
  resize:none;outline:none;overflow:auto;white-space:pre;
  border:0;padding:0;
}
.code-input::selection{background:rgba(79,195,247,.3)}

/* 浮层容器：光标 + 建议块 */
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#overlay > *{pointer-events:auto}

/* 多人光标 */
.cursor{
  position:absolute;width:2px;height:var(--line-h);
  transition:left .35s cubic-bezier(.22,.61,.36,1), top .35s cubic-bezier(.22,.61,.36,1);
  z-index:5;pointer-events:auto;cursor:grab;
}
.cursor:active{cursor:grabbing}
.cursor .bar{width:2px;height:100%;background:currentColor;box-shadow:0 0 6px currentColor}
.cursor .tag{
  position:absolute;top:-18px;left:0;background:currentColor;color:#000;
  font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px 3px 3px 0;
  white-space:nowrap;line-height:16px;
}
.cursor.me{cursor:grab}
.cursor .flag{position:absolute;top:-2px;left:-2px;width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 5px currentColor}

/* ---------- 建议块（浮动）---------- */
.suggestion-block{
  position:absolute;left:60px;min-width:380px;max-width:560px;
  background:var(--bg-block);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 12px 32px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  z-index:20;animation:floatIn .28s cubic-bezier(.22,.61,.36,1);overflow:hidden;
}
@keyframes floatIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}
.suggestion-block.accepted{border-color:var(--accept);box-shadow:0 0 0 1px var(--accept),0 12px 32px rgba(0,0,0,.55)}
.suggestion-block.rejected{opacity:.65;border-color:var(--reject)}

.sb-head{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:linear-gradient(180deg,#323234,#2d2d30);border-bottom:1px solid var(--border);
}
.sb-avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,#9b59b6,#6c5ce7)}
.sb-meta{flex:1;min-width:0}
.sb-meta .t1{font-size:12px;font-weight:600;color:#fff}
.sb-meta .t1 .role{color:var(--user-a);font-weight:400;margin-left:4px;font-size:11px}
.sb-meta .t2{font-size:11px;color:var(--fg-muted);margin-top:1px}
.sb-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600}
.sb-badge.accepted{background:rgba(76,175,80,.18);color:var(--accept);border:1px solid rgba(76,175,80,.5)}
.sb-badge.rejected{background:rgba(117,117,117,.18);color:var(--reject);border:1px solid rgba(117,117,117,.5)}
.sb-badge.pending{background:rgba(255,183,77,.12);color:var(--warn);border:1px solid rgba(255,183,77,.4)}

.sb-code{max-height:200px;overflow:auto;background:#1e1e1e;border-bottom:1px solid var(--border)}
.sb-code pre{margin:0;padding:10px 12px;font-size:12px;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;line-height:1.5}
.sb-code::-webkit-scrollbar{width:8px;height:8px}
.sb-code::-webkit-scrollbar-thumb{background:#424242;border-radius:4px}

.sb-foot{display:flex;align-items:center;gap:6px;padding:7px 10px;flex-wrap:wrap}
.sb-btn{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 9px;
  border:1px solid var(--border);border-radius:5px;color:var(--fg);background:var(--bg-elev);
  transition:all .15s;
}
.sb-btn:hover{background:#3d3d3d;border-color:#555}
.sb-btn.up:hover{border-color:var(--accept);color:var(--accept)}
.sb-btn.down:hover{border-color:#e57373;color:#e57373}
.sb-btn.accept{color:var(--accept);border-color:rgba(76,175,80,.5)}
.sb-btn.accept:hover{background:rgba(76,175,80,.15)}
.sb-btn.reject{color:#e57373}
.sb-btn.reject:hover{background:rgba(229,115,115,.12)}
.sb-btn .cnt{font-size:11px;color:var(--fg-muted);margin-left:2px}
.sb-btn.voted-up{color:var(--accept);border-color:var(--accept)}
.sb-btn.voted-down{color:#e57373;border-color:#e57373}
/* 投票者头像缩略图 */
.voters{display:inline-flex;margin-left:2px}
.voters .v{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--bg-block);font-size:10px;font-weight:700;color:#000;display:flex;align-items:center;justify-content:center;margin-left:-5px}
.voters .v:first-child{margin-left:0}

/* 讨论区 */
.sb-discuss{border-top:1px solid var(--border);background:#262626;display:none;flex-direction:column;max-height:160px}
.sb-discuss.open{display:flex}
.sb-comments{flex:1;overflow:auto;padding:6px 10px}
.sb-comment{font-size:11px;margin-bottom:6px;display:flex;gap:6px;align-items:flex-start}
.sb-comment .cu{flex:0 0 18px;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700;color:#000;display:flex;align-items:center;justify-content:center}
.sb-comment .ct{flex:1}
.sb-comment .cn{font-weight:600;margin-right:6px}
.sb-comment .ct .text{color:var(--fg);display:inline}
.sb-comment .ct .time{color:var(--fg-muted);font-size:10px;margin-left:4px}
.sb-comment-empty{font-size:11px;color:var(--fg-muted);padding:6px 0;text-align:center}
.sb-comment-input{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--border)}
.sb-comment-input input{flex:1;background:#1e1e1e;border:1px solid var(--border);border-radius:4px;padding:4px 8px;color:var(--fg);font-size:12px;outline:none}
.sb-comment-input input:focus{border-color:var(--user-a)}
.sb-comment-input button{padding:4px 10px;background:var(--accent);color:#fff;border-radius:4px;font-size:12px}

/* 二次确认条 */
.sb-confirm{border-top:1px solid var(--border);background:#2a1d1d;padding:8px 10px;display:none;align-items:center;gap:8px}
.sb-confirm.open{display:flex}
.sb-confirm .msg{flex:1;font-size:12px;color:#e57373}
.sb-confirm button{padding:4px 10px;border-radius:4px;font-size:12px}
.sb-confirm .yes{background:#e57373;color:#fff}
.sb-confirm .no{background:var(--bg-elev);color:var(--fg);border:1px solid var(--border)}

/* ---------- 右侧建议面板 ---------- */
#panel{
  width:280px;min-width:280px;background:var(--bg-edit);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.panel-head{padding:9px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-head .ttl{font-size:12px;font-weight:600;color:#fff;letter-spacing:.3px}
.panel-head .cnt{font-size:11px;color:var(--fg-muted)}
.panel-list{flex:1;overflow:auto;padding:8px}
.panel-list::-webkit-scrollbar{width:8px}
.panel-list::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}
.panel-empty{padding:30px 14px;text-align:center;color:var(--fg-muted);font-size:12px;line-height:1.7}
.panel-card{
  background:var(--bg-block);border:1px solid var(--border);border-radius:6px;padding:9px 10px;margin-bottom:8px;
  cursor:pointer;transition:border-color .15s;position:relative;
}
.panel-card:hover{border-color:#555}
.panel-card.accepted{border-color:rgba(76,175,80,.5);border-left:3px solid var(--accept)}
.panel-card.rejected{border-color:rgba(117,117,117,.5);border-left:3px solid var(--reject);opacity:.75}
.panel-card.pending{border-left:3px solid var(--warn)}
.pc-head{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.pc-head .ttl{flex:1;font-size:12px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-head .tag{font-size:10px;padding:1px 6px;border-radius:8px}
.pc-head .tag.accepted{background:rgba(76,175,80,.18);color:var(--accept)}
.pc-head .tag.rejected{background:rgba(117,117,117,.18);color:var(--reject)}
.pc-head .tag.pending{background:rgba(255,183,77,.12);color:var(--warn)}
.pc-code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:11px;color:var(--fg-muted);background:#1e1e1e;padding:6px 8px;border-radius:4px;max-height:54px;overflow:hidden;white-space:pre;position:relative}
.pc-code::after{content:"";position:absolute;bottom:0;left:0;right:0;height:18px;background:linear-gradient(transparent,#1e1e1e)}
.pc-foot{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:11px;color:var(--fg-muted)}
.pc-foot .v{display:inline-flex;align-items:center;gap:3px}
.pc-foot .v.up{color:var(--accept)}
.pc-foot .v.down{color:#e57373}
.pc-foot .c{display:inline-flex;align-items:center;gap:3px}

/* ---------- 底部状态栏 ---------- */
#statusbar{
  height:44px;background:#007acc;display:flex;align-items:center;padding:0 12px;gap:10px;
  color:#fff;
}
.ai-prompt{display:flex;align-items:center;gap:6px;flex:1;background:rgba(0,0,0,.25);border-radius:6px;padding:4px 8px}
.ai-prompt .ai-ico{font-size:16px}
.ai-prompt input{
  flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:13px;
}
.ai-prompt input::placeholder{color:rgba(255,255,255,.7)}
.ai-prompt .send{
  background:#fff;color:#007acc;font-weight:600;font-size:12px;padding:4px 14px;border-radius:4px;
}
.ai-prompt .send:hover{background:#e6f4ff}
.sb-hint{font-size:11px;color:rgba(255,255,255,.85);padding:0 4px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collab-bar{display:flex;align-items:center;gap:6px}
.collab{
  position:relative;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;color:#000;cursor:pointer;border:2px solid rgba(255,255,255,.85);
}
.collab .online{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#4caf50;border:1.5px solid #007acc}
.collab .nm{position:absolute;top:32px;right:0;background:#1e1e1e;color:#fff;font-size:11px;padding:2px 6px;border-radius:3px;white-space:nowrap;display:none;z-index:30;border:1px solid var(--border)}
.collab:hover .nm{display:block}

/* Toast 提示 */
#toast{position:fixed;bottom:54px;left:50%;transform:translateX(-50%);background:#2d2d30;border:1px solid var(--border);color:var(--fg);padding:8px 16px;border-radius:6px;font-size:12px;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* 滚动条统一样式 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-edit)}
::-webkit-scrollbar-thumb{background:#424242;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#4f4f4f}

/* 响应式：中小屏缩窄侧栏 */
@media (max-width:1100px){
  #sidebar{width:170px;min-width:170px}
  #panel{width:240px;min-width:240px}
}
@media (max-width:820px){
  #sidebar{display:none}
  #panel{width:200px;min-width:200px}
}
</style>
</head>
<body>

<!-- 顶部标题栏 -->
<div id="topbar">
  <span class="logo">AI<b>第三成员</b> · 协同编程工作台</span>
  <span class="badge">本地演示 · 模拟实时协作</span>
  <span class="spacer"></span>
  <span class="conn"><span class="dot"></span>已连接 · 3 位协作者在线</span>
</div>

<!-- 主区域：文件树 / 编辑器 / 建议面板 -->
<div id="main">
  <!-- 左侧文件树 -->
  <aside id="sidebar">
    <div class="side-title">资源管理器</div>
    <div class="file-tree" id="fileTree"></div>
  </aside>

  <!-- 中央编辑器 -->
  <main id="editor-wrap">
    <div class="editor-tabbar" id="tabbar"></div>
    <div id="editor">
      <div class="editor-lines" id="editorLines"></div>
      <div class="editor-area" id="editorArea">
        <!-- 高亮层：显示 Prism 高亮后的代码（背景层） -->
        <div class="highlight-layer"><pre><code id="hlCode" class="language-javascript"></code></pre></div>
        <!-- 输入层：透明文字、可见光标，叠在高亮层之上 -->
        <textarea class="code-input" id="codeInput" spellcheck="false"></textarea>
        <!-- 浮层：光标与建议块 -->
        <div id="overlay"></div>
      </div>
    </div>
  </main>

  <!-- 右侧建议面板 -->
  <aside id="panel">
    <div class="panel-head">
      <span class="ttl">建议面板</span>
      <span class="cnt" id="panelCnt">0 条</span>
    </div>
    <div class="panel-list" id="panelList"></div>
  </aside>
</div>

<!-- 底部状态栏：向 AI 提问 + 协作者头像 -->
<div id="statusbar">
  <div class="ai-prompt">
    <span class="ai-ico">🤖</span>
    <input id="aiInput" type="text" placeholder="向 AI 提问，例如：写一个防抖函数 / 节流 / 深拷贝 / 排序 / fetch 请求" />
    <button class="send" id="aiSend">发送</button>
  </div>
  <span class="sb-hint" id="sbHint">当前文件：<b id="curFileHint">src/main.js</b></span>
  <div class="collab-bar" id="collabBar"></div>
</div>

<!-- Toast 容器 -->
<div id="toast"></div>

<script>
/* ============================================================
   全局状态管理（state）
   所有数据集中管理，所有操作（光标移动、投票、评论、采纳/拒绝）
   均更新 state 后触发重新渲染，模拟实时同步。
   ============================================================ */
const state = {
  // 文件内容键值对：文件名 -> 代码内容
  files: {
    'src/main.js':
`console.log('Hello World')

function init() {
  // 初始化应用
  console.log('App initialized')
}`,
    'src/utils/helper.js':
`// 通用工具函数集合

export function formatDate(date) {
  return new Date(date).toLocaleString()
}`,
    'index.html':
`<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Demo</title>
</head>
<body>
  <div id="app"></div>
</body>
</html>`,
    'style.css':
`body {

// 返回 HH:MM 时间字符串
function nowStr(){
  const d = new Date()
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
}

// 根据文件名推断 Prism 语言
function langOf(fileName){
  if(fileName.endsWith('.js'))   return 'javascript'
  if(fileName.endsWith('.html'))return 'markup'
  if(fileName.endsWith('.css'))  return 'css'
  return 'javascript'
}

// 简易 HTML 转义（用于将代码安全插入 innerHTML 之前；Prism 会输出已转义内容）
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}

// 简易 toast 提示
let toastTimer = null
function toast(msg){
  const el = document.getElementById('toast')
  el.textContent = msg
  el.classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1800)
}

// 生成唯一 id
function uid(prefix='s'){ return prefix + '-' + Math.random().toString(36).slice(2,9) }

/* ============================================================
   渲染函数群：文件树 / 编辑器 / 光标 / 建议面板 / 协作者头像
   每次状态变化后调用对应渲染函数刷新 UI。
   ============================================================ */

// ---------- 渲染：文件树 ----------
function renderFileTree(){
  const tree = document.getElementById('fileTree')
  tree.innerHTML = ''
  Object.keys(state.files).forEach(name=>{
    const item = document.createElement('div')
    item.className = 'file-item' + (name===state.currentFile?' active':'')
    item.dataset.file = name

    // 文件图标（按扩展名区分）
    const ico = document.createElement('span')
    ico.className = 'ico'
    ico.textContent = name.endsWith('.js') ? 'JS' : (name.endsWith('.css')?'CSS':'<>')

    const nm = document.createElement('span')
    nm.className = 'name'
    nm.textContent = name.split('/').pop()

    // 协作者编辑状态圆点：正在编辑该文件的协作者用对应颜色
    const dots = document.createElement('span')
    dots.className = 'dots'
    state.collaborators.forEach(c=>{
      if(c.editing === name){
        const d = document.createElement('span')
        d.className = 'd on'
        d.style.background = c.color
        d.style.color = c.color
        d.title = c.name + ' 正在编辑'
        dots.appendChild(d)
      }
    })

    item.appendChild(ico); item.appendChild(nm); item.appendChild(dots)
    item.addEventListener('click', ()=> switchFile(name))
    tree.appendChild(item)
  })
}

// ---------- 渲染：编辑器（行号 + 高亮层 + textarea）----------
function renderEditor(){
  const content = state.files[state.currentFile] || ''
  const lang = langOf(state.currentFile)

  // 行号
  const lines = content.split('\n').length
  const linesEl = document.getElementById('editorLines')
  linesEl.innerHTML = Array.from({length:lines}, (_,i)=> i+1).join('\n') + '\n'

  // 高亮层：先转义再交 Prism 高亮
  const hl = document.getElementById('hlCode')
  hl.className = 'language-' + lang
  hl.textContent = content + '\n'   // 用 textContent 避免 XSS；末尾加换行便于对齐
  if(window.Prism) Prism.highlightElement(hl)

  // textarea 内容（仅切换文件时同步；用户输入时由 input 事件反向更新）
  const ta = document.getElementById('codeInput')
  ta.value = content
  // 切换文件后重置滚动位置与高亮层 transform，避免残留上一文件的滚动偏移
  ta.scrollTop = 0; ta.scrollLeft = 0
  hl.parentElement.style.transform = 'none'

  // 标签栏
  renderTabbar()

  // 底部当前文件提示
  document.getElementById('curFileHint').textContent = state.currentFile

  // 切换语言后调整 textarea 与高亮层字体度量一致（已由 CSS 保证）
}

// ---------- 渲染：标签栏 ----------
function renderTabbar(){
  const bar = document.getElementById('tabbar')
  bar.innerHTML = ''
  state.openTabs.forEach(name=>{
    const tab = document.createElement('div')
    tab.className = 'etab' + (name===state.currentFile?' active':'')
    const nm = document.createElement('span')
    nm.textContent = name.split('/').pop()
    const x = document.createElement('span')
    x.className = 'x'
    x.textContent = '×'
    x.title = '关闭'
    x.addEventListener('click', (e)=>{
      e.stopPropagation()
      // 简化：仅从 openTabs 移除；若关闭的是当前文件，切到剩余第一个
      state.openTabs = state.openTabs.filter(t=>t!==name)
      if(state.currentFile===name){
        state.currentFile = state.openTabs[0] || Object.keys(state.files)[0]
      }
      renderAll()
    })
    tab.appendChild(nm); tab.appendChild(x)
    tab.addEventListener('click', ()=> switchFile(name))
    bar.appendChild(tab)
  })
}

// ---------- 渲染：多人光标 ----------
function renderCursors(){
  const overlay = document.getElementById('overlay')
  // 移除旧光标
  overlay.querySelectorAll('.cursor').forEach(el=>el.remove())
  state.cursors.forEach(c=>{
    const el = document.createElement('div')
    el.className = 'cursor' + (c.isMe?' me':'')
    el.dataset.user = c.id
    el.style.left = c.x + 'px'
    el.style.top  = c.y + 'px'
    el.style.color = c.color
    el.innerHTML = `<div class="bar"></div><div class="tag">${c.name}</div><div class="flag"></div>`
    overlay.appendChild(el)

    // 用户 A 的光标可拖动；B/C 由定时器更新（不绑定拖动）
    if(c.isMe) bindDrag(el, c)
  })
}

// 仅更新某光标位置（B/C 随机移动时调用，避免整体重渲染）
function updateCursorEl(c){
  const el = document.querySelector(`.cursor[data-user="${c.id}"]`)
  if(el){ el.style.left = c.x + 'px'; el.style.top = c.y + 'px' }
}

// 拖动光标实现
function bindDrag(el, c){
  let dragging = false, ox=0, oy=0
  el.addEventListener('mousedown', (e)=>{
    dragging = true
    ox = e.clientX - c.x
    oy = e.clientY - c.y
    e.preventDefault()
  })
  document.addEventListener('mousemove', (e)=>{
    if(!dragging) return
    const area = document.getElementById('editorArea').getBoundingClientRect()
    c.x = Math.max(0, Math.min(e.clientX - ox, area.width - 20))
    c.y = Math.max(0, Math.min(e.clientY - oy, area.height - 20))
    el.style.left = c.x + 'px'
    el.style.top  = c.y + 'px'
  })
  document.addEventListener('mouseup', ()=> dragging=false)
}

// ---------- 渲染：右侧建议面板 ----------
function renderPanel(){
  const list = document.getElementById('panelList')
  // 按当前文件过滤；已采纳置顶；其余按时间倒序
  const items = state.suggestions
    .filter(s => s.file === state.currentFile)
    .slice()
    .sort((a,b)=>{
      if(a.status==='accepted' && b.status!=='accepted') return -1
      if(b.status==='accepted' && a.status!=='accepted') return 1
      return b.timestamp < a.timestamp ? -1 : 1
    })

  document.getElementById('panelCnt').textContent = items.length + ' 条'

  if(items.length===0){
    list.innerHTML = `<div class="panel-empty">当前文件暂无建议。<br/>在底部输入框向 AI 提问即可生成建议块。</div>`
    return
  }

  list.innerHTML = ''
  items.forEach(s=>{
    const card = document.createElement('div')
    card.className = 'panel-card ' + s.status
    const tagText = s.status==='accepted'?'已采纳':(s.status==='rejected'?'已拒绝':'待评审')
    const codePreview = s.code.split('\n').slice(0,3).join('\n')
    card.innerHTML = `
      <div class="pc-head">
        <span class="ttl">${escapeHtml(s.title||'代码建议')}</span>
        <span class="tag ${s.status}">${tagText}</span>
      </div>
      <div class="pc-code">${escapeHtml(codePreview)}</div>
      <div class="pc-foot">
        <span class="v up">▲ ${s.votes.up.length}</span>
        <span class="v down">▼ ${s.votes.down.length}</span>
        <span class="c">💬 ${s.comments.length}</span>
        <span style="margin-left:auto;color:var(--fg-muted)">${s.timestamp}</span>
      </div>`
    // 点击卡片：定位到对应浮动建议块（若存在则高亮闪烁）
    card.addEventListener('click', ()=>{
      const block = document.querySelector(`.suggestion-block[data-id="${s.id}"]`)
      if(block){
        block.style.boxShadow = '0 0 0 2px #fff, 0 12px 32px rgba(0,0,0,.55)'
        block.scrollIntoView({behavior:'smooth', block:'center'})
        setTimeout(()=> block.style.boxShadow = '', 900)
      } else {
        toast('该建议当前未在编辑器中浮动显示，可继续提问生成新建议。')
      }
    })
    list.appendChild(card)
  })
}

// ---------- 渲染：浮动建议块（叠加在编辑器上）----------
function renderSuggestionBlocks(){
  const overlay = document.getElementById('overlay')
  overlay.querySelectorAll('.suggestion-block').forEach(el=>el.remove())
  // 仅显示当前文件中 pending / accepted 的浮动块（rejected 仍保留但不浮在编辑器，只在面板回顾）
  const items = state.suggestions.filter(s => s.file===state.currentFile && s.status!=='rejected')
  let yOffset = 60
  items.forEach(s=>{
    const block = buildSuggestionBlock(s, yOffset)
    overlay.appendChild(block)
    yOffset += block.offsetHeight + 14
  })
}

// 构建单个建议块 DOM
function buildSuggestionBlock(s, topOffset){
  const block = document.createElement('div')
  block.className = 'suggestion-block ' + s.status
  block.dataset.id = s.id
  block.style.top = (state.lastCaretPos.y + topOffset) + 'px'
  block.style.left = Math.max(20, state.lastCaretPos.x) + 'px'

  // 投票者头像 HTML
  const upVoters = s.votes.up.map(id=>{
    const c = state.collaborators.find(x=>x.id===id) || {name:'?',color:'#888'}
    return `<span class="v" style="background:${c.color}" title="${c.name} 赞成">${c.name.slice(0,1)}</span>`
  }).join('')
  const downVoters = s.votes.down.map(id=>{
    const c = state.collaborators.find(x=>x.id===id) || {name:'?',color:'#888'}
    return `<span class="v" style="background:${c.color}" title="${c.name} 反对">${c.name.slice(0,1)}</span>`
  }).join('')

  // 当前用户是否已投票（用于按钮高亮）
  const me = state.user.id
  const votedUp = s.votes.up.includes(me) ? 'voted-up' : ''
  const votedDown = s.votes.down.includes(me) ? 'voted-down' : ''

  // 操作按钮（采纳/拒绝仅当前用户可执行；已终态时隐藏）
  const isClosed = s.status !== 'pending'
  const actions = isClosed ? '' : `
    <button class="sb-btn accept" data-act="accept">✅ 采纳</button>
    <button class="sb-btn reject" data-act="reject">❌ 拒绝</button>`

  // 状态徽标
  const badge = s.status==='accepted'
    ? `<span class="sb-badge accepted">✅ 已采纳</span>`
    : (s.status==='rejected' ? `<span class="sb-badge rejected">❌ 已拒绝</span>` : `<span class="sb-badge pending">评审中</span>`)

  // 代码高亮
  const codeHtml = window.Prism ? Prism.highlight(s.code, Prism.languages[s.language]||Prism.languages.javascript, s.language) : escapeHtml(s.code)

  // 评论列表
  const commentsHtml = s.comments.length===0
    ? `<div class="sb-comment-empty">暂无讨论，发表第一条评论吧</div>`
    : s.comments.map(cm=>`
        <div class="sb-comment">
          <span class="cu" style="background:${cm.color}">${cm.name.slice(0,1)}</span>
          <div class="ct"><span class="cn">${escapeHtml(cm.name)}</span><span class="text">${escapeHtml(cm.text)}</span><span class="time">${cm.time}</span></div>
        </div>`).join('')

  block.innerHTML = `
    <div class="sb-head">
      <div class="sb-avatar">${escapeHtml(s.author.avatar)}</div>
      <div class="sb-meta">
        <div class="t1">${escapeHtml(s.author.name)}<span class="role">· 第三成员</span></div>
        <div class="t2">${escapeHtml(s.title||'代码建议')} · 关联 ${escapeHtml(s.file)} · ${s.timestamp}</div>
      </div>
      ${badge}
    </div>
    <div class="sb-code"><pre><code class="language-${s.language}">${codeHtml}</code></pre></div>
    <div class="sb-foot">
      <button class="sb-btn up ${votedUp}" data-act="up">👍 <span class="cnt">${s.votes.up.length}</span></button>
      <span class="voters">${upVoters}</span>
      <button class="sb-btn down ${votedDown}" data-act="down" style="margin-left:8px">👎 <span class="cnt">${s.votes.down.length}</span></button>
      <span class="voters">${downVoters}</span>
      <button class="sb-btn" data-act="discuss" style="margin-left:8px">💬 讨论 <span class="cnt">${s.comments.length}</span></button>
      <span style="flex:1"></span>
      ${actions}
    </div>
    <div class="sb-discuss">
      <div class="sb-comments">${commentsHtml}</div>
      <div class="sb-comment-input">
        <input type="text" placeholder="发表评论…" data-role="comment-input" />
        <button data-role="comment-send">发送</button>
      </div>
    </div>
    <div class="sb-confirm">
      <span class="msg">确定拒绝该建议吗？拒绝后将从编辑器移除，但仍保留在面板供回顾。</span>
      <button class="no" data-role="confirm-no">取消</button>
      <button class="yes" data-role="confirm-yes">确认拒绝</button>
    </div>`

  // 事件绑定
  bindSuggestionBlockEvents(block, s)
  return block
}

// 建议块事件绑定
function bindSuggestionBlockEvents(block, s){
  block.addEventListener('click', (e)=>{
    const act = e.target.closest('[data-act]')?.dataset.act
    if(act==='up')   vote(s.id, 'up')
    if(act==='down') vote(s.id, 'down')
    if(act==='discuss'){
      const d = block.querySelector('.sb-discuss')
      d.classList.toggle('open')
      if(d.classList.contains('open')){
        const input = d.querySelector('[data-role="comment-input"]')
        input && input.focus()
      }
    }
    if(act==='accept') accept(s.id)
    if(act==='reject'){
      block.querySelector('.sb-confirm').classList.add('open')
    }
  })

  // 评论发送
  const sendBtn = block.querySelector('[data-role="comment-send"]')
  const input = block.querySelector('[data-role="comment-input"]')
  const sendComment = ()=>{
    const text = input.value.trim()
    if(!text) return
    addComment(s.id, text)
    input.value = ''
  }
  sendBtn.addEventListener('click', sendComment)
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') sendComment() })

  // 二次确认
  block.querySelector('[data-role="confirm-yes"]').addEventListener('click', ()=> reject(s.id))
  block.querySelector('[data-role="confirm-no"]').addEventListener('click', ()=>{
    block.querySelector('.sb-confirm').classList.remove('open')
  })
}

/* ============================================================
   业务操作：切换文件 / 投票 / 评论 / 采纳 / 拒绝 / 向 AI 提问
   ============================================================ */

// 切换文件
function switchFile(name){
  if(!state.files[name]) return
  state.currentFile = name
  if(!state.openTabs.includes(name)) state.openTabs.push(name)
  // 模拟：切换文件时，用户 A 的光标回到编辑区左上
  const me = state.cursors.find(c=>c.isMe)
  if(me){ me.x = 20; me.y = 10; updateCursorEl(me) }
  renderAll()
}

// 投票（同一用户对同一条建议只能投一票，赞成/反对互斥）
function vote(id, type){
  const s = state.suggestions.find(x=>x.id===id)
  if(!s) return
  const me = state.user.id
  // 移除已有投票
  s.votes.up   = s.votes.up.filter(u=>u!==me)
  s.votes.down = s.votes.down.filter(u=>u!==me)
  // 若与当前已有同向则视为取消；否则加入
  if(type==='up' && !s.votes.up.includes(me)) s.votes.up.push(me)
  if(type==='down' && !s.votes.down.includes(me)) s.votes.down.push(me)
  toast(state.user.name + ' 投票：' + (type==='up'?'赞成 👍':'反对 👎'))
  renderSuggestionBlocks(); renderPanel()
}

// 添加评论
function addComment(id, text){
  const s = state.suggestions.find(x=>x.id===id)
  if(!s) return
  const me = state.collaborators.find(c=>c.id===state.user.id)
  s.comments.push({ user:me.id, name:me.name, color:me.color, text, time: nowStr() })
  renderSuggestionBlocks(); renderPanel()
}

// 采纳：将建议代码插入到 textarea 当前光标位置
function accept(id){
  const s = state.suggestions.find(x=>x.id===id)
  if(!s || s.status!=='pending') return
  const ta = document.getElementById('codeInput')
  const start = ta.selectionStart
  const end = ta.selectionEnd
  const content = state.files[state.currentFile]
  const insert = '\n' + s.code + '\n'
  const newContent = content.slice(0,start) + insert + content.slice(end)
  state.files[state.currentFile] = newContent
  // 重设光标位置
  const caret = start + insert.length
  renderEditor()
  ta.selectionStart = ta.selectionEnd = caret
  // 标记已采纳
  s.status = 'accepted'
  toast('已采纳该建议，代码已插入到当前光标位置 ✅')
  renderSuggestionBlocks(); renderPanel()
}

// 拒绝（二次确认后调用）
function reject(id){
  const s = state.suggestions.find(x=>x.id===id)
  if(!s || s.status!=='pending') return
  s.status = 'rejected'
  toast('已拒绝该建议，可右侧面板回顾 ❌')
  renderSuggestionBlocks(); renderPanel()
}

   内置 AI 回复逻辑（无真实 API）
   根据关键词匹配返回对应代码片段。
   ============================================================ */
const AI_RESPONSES = [
  { keys:['防抖','debounce'], title:'防抖函数 debounce',
    code:
`// 防抖：事件停止触发 n 秒后执行，n 秒内再次触发则重新计时
function debounce(fn, delay = 300) {
  let timer = null
  return function (...args) {
    if (timer) clearTimeout(timer)
    timer = setTimeout(() => fn.apply(this, args), delay)
  }
}` },
  { keys:['节流','throttle'], title:'节流函数 throttle',
    code:
`// 节流：n 秒内只执行一次，常用于滚动/resize 等高频事件
function throttle(fn, delay = 300) {
  let last = 0
  return function (...args) {
    const now = Date.now()
    if (now - last >= delay) {
      last = now
      fn.apply(this, args)
    }
  }
}` },
  { keys:['深拷贝','deepclone','深复制'], title:'深拷贝 deepClone',
    code:
`// 深拷贝（基于 JSON 序列化，适用于可序列化数据）
function deepClone(obj) {
  return JSON.parse(JSON.stringify(obj))
}

// 进阶版本：支持函数/正则等特殊类型（简版）
function deepCloneAdvanced(obj, map = new WeakMap()) {
  if (obj === null || typeof obj !== 'object') return obj
  if (map.has(obj)) return map.get(obj)
  const clone = Array.isArray(obj) ? [] : {}
  map.set(obj, clone)
  Object.keys(obj).forEach(k => { clone[k] = deepCloneAdvanced(obj[k], map) })
  return clone
}` },
  { keys:['排序','sort','快排','quicksort'], title:'快速排序 quickSort',
    code:
`// 快速排序（原地分区版本）
function quickSort(arr, lo = 0, hi = arr.length - 1) {
  if (lo >= hi) return arr
  const pivot = arr[hi]
  let i = lo
  for (let j = lo; j < hi; j++) {
    if (arr[j] < pivot) { [arr[i], arr[j]] = [arr[j], arr[i]]; i++ }
  }
  ;[arr[i], arr[hi]] = [arr[hi], arr[i]]
  quickSort(arr, lo, i - 1)
  quickSort(arr, i + 1, hi)
  return arr
}` },
  { keys:['fetch','请求','request','http'], title:'异步 fetch 请求函数',
    code:
`// 通用异步请求封装（含错误处理与超时）
async function request(url, options = {}, timeout = 8000) {
  const controller = new AbortController()
  const timer = setTimeout(() => controller.abort(), timeout)
  try {
    const res = await fetch(url, { ...options, signal: controller.signal })
    if (!res.ok) throw new Error('HTTP ' + res.status)
    return await res.json()
  } finally {
    clearTimeout(timer)
  }
}` }
]

// 处理用户提问：匹配关键词生成建议块
function handleAskAI(text){
  text = (text||'').trim()
  if(!text){ toast('请输入你的需求～'); return }

  // 记录当前 textarea 光标像素位置（粗略：用 A 光标位置作为浮动基准）
  const me = state.cursors.find(c=>c.isMe)
  if(me){ state.lastCaretPos = { x: me.x, y: me.y } }

  // 关键词匹配
  const hit = AI_RESPONSES.find(r => r.keys.some(k => text.toLowerCase().includes(k.toLowerCase())))
  let suggestion
  if(hit){
    suggestion = {
      id: uid(),
      file: state.currentFile,
      title: hit.title,
      code: hit.code,
      language: langOf(state.currentFile),
      author:{ name:'AI助理', avatar:'AI' },
      timestamp: nowStr(),
      votes:{ up:[], down:[] },
      comments:[],
      status:'pending'
    }
  } else {
    // 通用提示
    suggestion = {
      id: uid(),
      file: state.currentFile,
      title:'通用提示',
      code:
`// AI 助理：请更具体描述你的需求。
// 支持的关键词示例：防抖 / 节流 / 深拷贝 / 排序 / fetch 请求
// 你可以说："写一个防抖函数"`,
      language: langOf(state.currentFile),
      author:{ name:'AI助理', avatar:'AI' },
      timestamp: nowStr(),
      votes:{ up:[], down:[] },
      comments:[],
      status:'pending'
    }
  }
  state.suggestions.push(suggestion)
  toast('AI 已生成新建议：' + suggestion.title)
  renderSuggestionBlocks(); renderPanel()
}

/* ============================================================
   模拟实时协作：B/C 随机移动光标 + 偶发投票/评论
   ============================================================ */
function startSimulation(){
  // 每 2 秒：B/C 光标在编辑器可见区域内随机移动
  setInterval(()=>{
    const area = document.getElementById('editorArea')
    if(!area) return
    const rect = area.getBoundingClientRect()
    state.cursors.filter(c=>!c.isMe).forEach(c=>{
      c.x = Math.max(10, Math.min(rect.width - 40,  c.x + (Math.random()*120-60)))
      c.y = Math.max(10, Math.min(rect.height - 40, c.y + (Math.random()*80-40)))
      updateCursorEl(c)
    })
  }, 2000)

  // 每 5 秒：B/C 偶发对当前文件的 pending 建议投票或评论
  setInterval(()=>{
    const pendings = state.suggestions.filter(s=>s.file===state.currentFile && s.status==='pending')
    if(pendings.length===0) return
    const s = pendings[Math.floor(Math.random()*pendings.length)]
    const others = state.collaborators.filter(c=>c.id!==state.user.id)
    const who = others[Math.floor(Math.random()*others.length)]
    const action = Math.random()
    if(action < 0.5){
      // 投票
      if(!s.votes.up.includes(who.id) && !s.votes.down.includes(who.id)){
        const t = Math.random()<0.7 ? 'up' : 'down'
        s.votes[t].push(who.id)
        toast(who.name + ' 投票：' + (t==='up'?'赞成 👍':'反对 👎'))
        renderSuggestionBlocks(); renderPanel()
      }
    } else {
      // 评论
      const remarks = [
        '这段实现可以考虑边界情况。',
        '建议加上类型注释，方便团队维护。',
        '命名很清晰，赞一个。',
        '能否补充复杂度说明？',
        '可以接受，准备采纳。'
      ]
      s.comments.push({ user:who.id, name:who.name, color:who.color, text: remarks[Math.floor(Math.random()*remarks.length)], time: nowStr() })
      toast(who.name + ' 发表了评论')
      renderSuggestionBlocks(); renderPanel()
    }
  }, 5000)
}

/* ============================================================
   全局事件绑定
   ============================================================ */
function bindGlobalEvents(){
  const ta = document.getElementById('codeInput')
  const hl = document.getElementById('hlCode')

  // 用户输入：同步更新 state.files 并刷新高亮层（不重置光标）
  ta.addEventListener('input', ()=>{
    state.files[state.currentFile] = ta.value
    // 仅更新高亮层内容与行号，避免 textarea 失焦
    hl.textContent = ta.value + '\n'
    if(window.Prism) Prism.highlightElement(hl)
    const lines = ta.value.split('\n').length
    document.getElementById('editorLines').innerHTML = Array.from({length:lines}, (_,i)=>i+1).join('\n') + '\n'
    renderPanel() // 内容变化不影响面板，但保持一致性
  })

  // 同步滚动：textarea 滚动时，高亮层通过 transform 跟随（高亮层 overflow:hidden 不产生滚动条）
  ta.addEventListener('scroll', ()=>{
    const pre = hl.parentElement
    pre.style.transform = `translate(${-ta.scrollLeft}px, ${-ta.scrollTop}px)`
  })

  // Tab 键插入两个空格
  ta.addEventListener('keydown', (e)=>{
    if(e.key==='Tab'){
      e.preventDefault()
      const s = ta.selectionStart, en = ta.selectionEnd
      const val = ta.value
      ta.value = val.slice(0,s) + '  ' + val.slice(en)
      ta.selectionStart = ta.selectionEnd = s + 2
      state.files[state.currentFile] = ta.value
      hl.textContent = ta.value + '\n'
      if(window.Prism) Prism.highlightElement(hl)
    }
  })

  // AI 提问
  const input = document.getElementById('aiInput')
  const send = document.getElementById('aiSend')
  const doAsk = ()=>{
    handleAskAI(input.value)
    input.value = ''
  }
  send.addEventListener('click', doAsk)
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') doAsk() })

  // 窗口尺寸变化时，光标保持可见
  window.addEventListener('resize', ()=>{
    state.cursors.forEach(c=> updateCursorEl(c))
  })
}

/* ============================================================
   全量渲染入口
   ============================================================ */
function renderAll(){
  renderFileTree()
  renderEditor()
  renderCursors()
  renderPanel()
  renderCollabBar()
  renderSuggestionBlocks()
}

/* ============================================================
   初始化：等待 Prism 加载后渲染
   ============================================================ */
function boot(){
  renderAll()
  bindGlobalEvents()
  startSimulation()
  toast('协作工作台已就绪：3 位协作者在线 🤖')
}

// Prism 通过 defer 加载，DOMContentLoaded 后再执行
window.addEventListener('DOMContentLoaded', ()=>{
  // 若 Prism 尚未就绪（defer 顺序），稍作等待
  if(window.Prism){ boot() }
  else { window.addEventListener('load', boot) }
})
</script>
