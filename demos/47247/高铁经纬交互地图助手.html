<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高铁经纬 · 交互地图助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060d1a;--s1:#0a1628;--s2:#0f1f38;--s3:#152d4a;
  --gold:#f0c040;--gold2:#d4a520;--text:#f0f0f0;--text2:#8899aa;
  --red:#e74c3c;--blue:#3498db;--green:#2ecc71;--purple:#9b59b6;
  --teal:#1abc9c;--orange:#e67e22;--pink:#e91e63;--cyan:#00bcd4;
}
html,body{height:100%;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.layout{display:flex;height:100vh;flex-direction:column}
.header{
  display:flex;align-items:center;gap:16px;padding:10px 24px;
  background:linear-gradient(135deg,var(--s1),var(--s2));
  border-bottom:1px solid rgba(240,192,64,0.15);flex-shrink:0;z-index:10;
  flex-wrap:wrap;
}
.header .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.header .logo .icon{font-size:28px}
.header .logo .sub{font-size:13px;font-weight:400;color:var(--text2);letter-spacing:1px}
.header .search-box{display:flex;align-items:center;gap:8px;margin-left:auto}
.header .search-box input{
  background:var(--bg);border:1px solid var(--s3);border-radius:6px;padding:8px 14px;
  color:var(--text);font-size:14px;width:200px;outline:none;transition:.2s
}
.header .search-box input:focus{border-color:var(--gold)}
.header .search-box .btn{background:var(--gold);color:var(--bg);border:none;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.header .search-box .btn:hover{background:#ffd700}
.header .btn-ghost{
  background:transparent;border:1px solid var(--s3);border-radius:6px;padding:8px 16px;
  color:var(--text2);font-size:13px;cursor:pointer;transition:.2s;white-space:nowrap
}
.header .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{
  width:260px;flex-shrink:0;background:var(--s1);border-right:1px solid rgba(240,192,64,0.08);
  display:flex;flex-direction:column;overflow-y:auto;padding:16px;gap:16px
}
.sidebar .section h3{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;font-weight:600}
.sidebar .line-filter{display:flex;flex-direction:column;gap:4px}
.sidebar .line-filter label{
  display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:4px;
  cursor:pointer;transition:.15s;font-size:13px;color:var(--text2)
}
.sidebar .line-filter label:hover{background:var(--s2);color:var(--text)}
.sidebar .line-filter input[type=checkbox]{accent-color:var(--gold);width:14px;height:14px;cursor:pointer}
.sidebar .line-filter .dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block
}
.sidebar .stats{
  background:var(--s2);border-radius:8px;padding:12px;font-size:13px;line-height:1.8
}
.sidebar .stats span{color:var(--gold);font-weight:600}
.main-map{flex:1;position:relative;overflow:hidden}
.main-map canvas{width:100%;height:100%;display:block}
.panel-right{
  width:280px;flex-shrink:0;background:var(--s1);border-left:1px solid rgba(240,192,64,0.08);
  display:flex;flex-direction:column;overflow-y:auto;padding:16px;gap:16px
}
.panel-right .section h3{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;font-weight:600}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.form-group select,.form-group input[type=text]{
  width:100%;background:var(--bg);border:1px solid var(--s3);border-radius:6px;padding:8px 10px;
  color:var(--text);font-size:13px;outline:none;transition:.2s
}
.form-group select:focus,.form-group input[type=text]:focus{border-color:var(--gold)}
.form-group select option{background:var(--s1);color:var(--text)}
.btn-primary{
  width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--bg);
  border:none;border-radius:6px;padding:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.2s
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(240,192,64,0.3)}
.btn-secondary{
  width:100%;background:var(--s3);color:var(--text);border:1px solid var(--s3);
  border-radius:6px;padding:8px;font-size:13px;cursor:pointer;transition:.2s
}
.btn-secondary:hover{background:var(--s2);border-color:var(--gold)}
.route-result{
  background:var(--s2);border-radius:8px;padding:12px;font-size:13px;line-height:1.7;min-height:80px
}
.route-result .path{color:var(--gold);font-weight:600}
.route-result .info{color:var(--text2);font-size:12px;margin-top:6px}
.knowledge-card{
  background:linear-gradient(135deg,var(--s2),var(--s3));border-radius:10px;padding:14px;
  border-left:3px solid var(--gold);cursor:pointer;transition:.2s
}
.knowledge-card:hover{transform:translateX(2px)}
.knowledge-card .fact{font-size:13px;line-height:1.6}
.knowledge-card .src{font-size:11px;color:var(--text2);margin-top:6px}
.tooltip{
  position:fixed;background:var(--s2);border:1px solid var(--gold);border-radius:8px;
  padding:10px 14px;font-size:13px;pointer-events:none;z-index:100;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none;min-width:140px
}
.tooltip .name{font-size:15px;font-weight:600;color:var(--gold)}
.tooltip .info{font-size:12px;color:var(--text2);margin-top:4px}
@media(max-width:900px){
  .sidebar{width:200px;padding:10px;gap:10px}
  .panel-right{width:220px;padding:10px;gap:10px}
  .header .search-box input{width:140px}
}
@media(max-width:680px){
  .body-wrap{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;padding:8px;border-right:none;border-bottom:1px solid rgba(240,192,64,0.08);max-height:140px;overflow-y:auto}
  .sidebar .section{flex:1;min-width:120px}
  .panel-right{width:100%;border-left:none;border-top:1px solid rgba(240,192,64,0.08);max-height:200px}
  .header .search-box input{width:100px}
}
</style>
</head>
<body>
<div class="layout">
  <header class="header">
    <div class="logo">
      <span class="icon">🚄</span>
      <div><div>高铁经纬</div><div class="sub">CHINA HSR · 交互地图</div></div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索站点..." oninput="onSearch(this.value)">
      <button class="btn" onclick="clearSearch()">⌕</button>
    </div>
    <button class="btn-ghost" onclick="showRandomFact()">📖 知识卡</button>
    <button class="btn-ghost" onclick="resetView()">⟲ 重置</button>
  </header>
  <div class="body-wrap">
    <aside class="sidebar">
      <div class="section">
        <h3>线路筛选</h3>
        <div class="line-filter" id="lineFilter"></div>
      </div>
      <div class="section">
        <h3>路网统计</h3>
        <div class="stats" id="statsBox">

          站点: <span id="statStations">0</span> 座<br>
          里程: <span id="statMileage">0</span> km
        </div>
      </div>
    </aside>
    <main class="main-map">
      <canvas id="mapCanvas"></canvas>
    </main>
    <aside class="panel-right">
      <div class="section">
        <h3>行程规划</h3>
        <div class="form-group">
          <label>出发站</label>
          <select id="fromStation"></select>
        </div>
        <div class="form-group">
          <label>到达站</label>
          <select id="toStation"></select>
        </div>
        <button class="btn-primary" onclick="planRoute()">🚄 查询最优路径</button>
        <button class="btn-secondary" onclick="clearRoute()" style="margin-top:6px">清空路线</button>
      </div>
      <div class="section">
        <h3>规划结果</h3>
        <div class="route-result" id="routeResult">选择出发站与到达站，点击查询</div>
      </div>
      <div class="section">
        <h3>知识卡片</h3>
        <div class="knowledge-card" id="knowledgeCard" onclick="nextFact()">
          <div class="fact" id="factText">中国高铁总里程超过 45,000 公里，位居世界第一。</div>
          <div class="src" id="factSrc">📊 中国国家铁路集团</div>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="tooltip" id="tooltip">
  <div class="name" id="ttName"></div>
  <div class="info" id="ttInfo"></div>
</div>
<script>

const stMap = Object.fromEntries(STATIONS.map(s=>[s.id,s]));

const LINES = [
  {id:'jh',name:'京沪高铁',color:'#e74c3c',stations:['beijing','tianjin','jinan','xuzhou','nanjing','shanghai']},
  {id:'jg',name:'京广高铁',color:'#3498db',stations:['beijing','shijiazhuang','zhengzhou','wuhan','changsha','guangzhou','shenzhen']},
  {id:'hk',name:'沪昆高铁',color:'#2ecc71',stations:['shanghai','hangzhou','nanchang','changsha','guiyang','kunming']},
  {id:'hd',name:'哈大高铁',color:'#9b59b6',stations:['harbin','changchun','shenyang','dalian']},
  {id:'yh',name:'沿海通道',color:'#1abc9c',stations:['dalian','tianjin','qingdao','shanghai','hangzhou','wenzhou','fuzhou','xiamen','shenzhen']},
  {id:'xl',name:'徐兰高铁',color:'#e67e22',stations:['xuzhou','zhengzhou','xi_an','lanzhou']},
  {id:'jha',name:'京哈高铁',color:'#f1c40f',stations:['beijing','shenyang','changchun','harbin']},
  {id:'cy',name:'成渝高铁',color:'#e91e63',stations:['chengdu','chongqing']},
  {id:'xc',name:'西成高铁',color:'#00bcd4',stations:['xi_an','chengdu']},
  {id:'gg',name:'贵广高铁',color:'#8bc34a',stations:['guiyang','guangzhou']},
  {id:'ng',name:'南广高铁',color:'#ff9800',stations:['nanning','guangzhou']},
  {id:'hf',name:'合福高铁',color:'#795548',stations:['hefei','huangshan','fuzhou']},
  {id:'hsh',name:'杭深高铁',color:'#607d8b',stations:['hangzhou','wenzhou','fuzhou','xiamen','shenzhen']},
  {id:'jij',name:'京津城际',color:'#ff5722',stations:['beijing','tianjin']},
  {id:'hn',name:'沪宁城际',color:'#03a9f4',stations:['shanghai','suzhou','nanjing']},
];
const LINES_VISIBLE = Object.fromEntries(LINES.map(l=>[l.id,true]));

const FACTS = [
  {t:'中国高铁总里程超过 45,000 公里，位居世界第一，占全球高铁总里程的三分之二以上。',s:'中国国家铁路集团·2024'},
  {t:'"复兴号"动车组最高运营时速达 350 km/h，是全球商业运营速度最快的列车之一。',s:'中国中车'},
  {t:'京沪高铁全长 1,318 公里，是世界上运营里程最长、运输密度最高的高速铁路之一。',s:'国铁集团'},

  {t:'"八纵八横"高铁网主骨架已建成约 80%，预计 2030 年将全面贯通。',s:'《中长期铁路网规划》'},
  {t:'贵广高铁穿行黔桂山区，桥隧比超过 80%，是世界上最难修建的山区高铁之一。',s:'中铁建设'},
  {t:'拉林铁路（拉萨-林芝）是青藏高原首条电气化铁路，最高海拔 3,650 米。',s:'国铁集团'},
  {t:'CR450 动车组正在研发中，目标运营时速提升至 400 公里，将刷新世界纪录。',s:'中国中车·2025'},
];
let factIdx = 0;
let hoveredStation = null;
let selectedRoute = null;
let animTrains = [];

// ─── HELPERS ────────────────────────────────────────────────────
function haversine(a,b){
  const R=6371; const dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const aa=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(aa),Math.sqrt(1-aa));
}
const LINE_STATION_SET = new Set();
LINES.forEach(l=>l.stations.forEach(s=>LINE_STATION_SET.add(s)));

function getStation(id){return stMap[id]}
function getStationByName(name){return STATIONS.find(s=>s.name.includes(name)||name.includes(s.name))}

// build graph
const graph = {};
STATIONS.forEach(s=>{graph[s.id]={}});
function addEdge(a,b){
  const d = Math.round(haversine(stMap[a],stMap[b]));
  graph[a][b]=d; graph[b][a]=d;
}
LINES.forEach(l=>{
  for(let i=0;i<l.stations.length-1;i++) addEdge(l.stations[i],l.stations[i+1]);
});
// extra connections
addEdge('beijing','tianjin'); addEdge('nanjing','hefei');
addEdge('zhengzhou','luoyang'); addEdge('xuzhou','nanjing');

// ─── DIJKSTRA ───────────────────────────────────────────────────
function dijkstra(from,to){
  const dist={},prev={},visited={},pq=[[0,from]];
  Object.keys(graph).forEach(k=>{dist[k]=Infinity});
  dist[from]=0;
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]);
    const [d,u]=pq.shift();
    if(u===to)break;
    if(visited[u])continue;
    visited[u]=true;
    for(const [v,w] of Object.entries(graph[u])){
      if(visited[v])continue;
      const nd=d+w;
      if(nd<dist[v]){dist[v]=nd;prev[v]=u;pq.push([nd,v])}
    }
  }
  if(dist[to]===Infinity)return null;
  const path=[]; let cur=to;
  while(cur){path.unshift(cur);cur=prev[cur]}
  return {path,dist:dist[to]};
}

// ─── PROJECTION ─────────────────────────────────────────────────
const BOUNDS={minLng:73,maxLng:135,minLat:18,maxLat:54};
function project(lat,lng,w,h,pad){
  const p=pad||40;
  const x = (lng-BOUNDS.minLng)/(BOUNDS.maxLng-BOUNDS.minLng)*(w-2*p)+p;
  const y = (BOUNDS.maxLat-lat)/(BOUNDS.maxLat-BOUNDS.minLat)*(h-2*p)+p;
  return {x,y};
}

// ─── CANVAS SETUP ───────────────────────────────────────────────
const canvas=document.getElementById('mapCanvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  canvas.width=r.width*devicePixelRatio;
  canvas.height=r.height*devicePixelRatio;
  canvas.style.width=r.width+'px';
  canvas.style.height=r.height+'px';
  W=r.width; H=r.height;
  ctx.scale(devicePixelRatio,devicePixelRatio);
  draw();
}
window.addEventListener('resize',resize);

// ─── DRAWING ─────────────────────────────────────────────────────
function draw(){
  if(!W)return;
  ctx.clearRect(0,0,W,H);
  const pad=40;
  const p=(lat,lng)=>project(lat,lng,W,H,pad);

  // background
  const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
  grad.addColorStop(0,'#0a1628'); grad.addColorStop(1,'#060d1a');
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

  // graticule
  ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
  for(let lng=75;lng<=135;lng+=5){
    const {x:xx}=p(30,lng);
    ctx.beginPath(); ctx.moveTo(xx,pad); ctx.lineTo(xx,H-pad); ctx.stroke();
  }
  for(let lat=20;lat<=55;lat+=5){
    const {y:yy}=p(lat,100);
    ctx.beginPath(); ctx.moveTo(pad,yy); ctx.lineTo(W-pad,yy); ctx.stroke();
  }

  // simplified coastline
  ctx.strokeStyle='rgba(240,192,64,0.06)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  const coast = [
    [40.5,119.9],[39.5,119.8],[38.5,119.3],[37.5,119.5],[36.5,120.5],
    [36.0,120.8],[35.5,121.2],[35.0,121.5],[34.5,121.8],[34.0,122.0],
    [33.5,121.5],[33.0,121.2],[32.5,121.5],[32.0,121.8],[31.5,122.0],
    [31.0,122.2],[30.5,122.0],[30.0,121.5],[29.5,121.8],[29.0,122.0],
    [28.5,121.5],[28.0,121.0],[27.5,120.5],[27.0,120.0],[26.5,119.8],
    [26.0,119.5],[25.5,119.8],[25.0,119.5],[24.5,118.5],[24.0,118.0],
    [23.5,117.5],[23.0,116.8],[22.5,114.5],[22.0,113.5],[21.5,111.5],
    [21.0,110.0],[20.5,109.5],[20.0,109.0]
  ];
  coast.forEach(([lat,lng],i)=>{const {x,y}=p(lat,lng);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.stroke();

  // south china sea outline
  ctx.strokeStyle='rgba(240,192,64,0.04)'; ctx.lineWidth=1;
  ctx.beginPath();
  const scs = [[18,108],[18,112],[20,114],[22,114],[22,110],[20,108],[18,108]];
  scs.forEach(([lat,lng],i)=>{const {x,y}=p(lat,lng);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.stroke();

  // border rivers (subtle)
  ctx.strokeStyle='rgba(100,150,200,0.05)'; ctx.lineWidth=1;
  ctx.beginPath();
  const river = [[31,121],[31,120],[31,119],[31,118],[31,117],[31,116],[31,115],[31,114],[31,113],[31,112],[31,111],[31,110],[31,109],[31,108]];
  river.forEach(([lat,lng],i)=>{const {x,y}=p(lat,lng);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});
  ctx.stroke();

  // active lines
  LINES.forEach(l=>{
    if(!LINES_VISIBLE[l.id])return;
    const pts = l.stations.map(sid=>p(stMap[sid].lat,stMap[sid].lng));
    const isRoute = selectedRoute && selectedRoute.path.length>=2 && 
      selectedRoute.path.every((sid,i)=>{
        if(i===0)return true;
        const prev=selectedRoute.path[i-1];
        return l.stations.indexOf(prev)>=0 && l.stations.indexOf(sid)>=0 && 
          Math.abs(l.stations.indexOf(sid)-l.stations.indexOf(prev))===1;
      });
    if(isRoute){
      // highlight route segments on this line
      for(let i=0;i<selectedRoute.path.length-1;i++){
        const a=stMap[selectedRoute.path[i]], b=stMap[selectedRoute.path[i+1]];
        const pa=p(a.lat,a.lng), pb=p(b.lat,b.lng);
        const grad2=ctx.createLinearGradient(pa.x,pa.y,pb.x,pb.y);
        grad2.addColorStop(0,'#ffd700'); grad2.addColorStop(1,'#ff6b00');
        ctx.beginPath(); ctx.moveTo(pa.x,pa.y);
        const midLat=(a.lat+b.lat)/2, midLng=(a.lng+b.lng)/2;
        const pm=p(midLat,midLng);
        ctx.quadraticCurveTo(pm.x,pm.y,pb.x,pb.y);
        ctx.strokeStyle=grad2; ctx.lineWidth=5; ctx.shadowColor='rgba(255,215,0,0.5)'; ctx.shadowBlur=12;
        ctx.stroke(); ctx.shadowBlur=0;
      }
    }
    // draw line
    ctx.beginPath();
    pts.forEach((pt,i)=>{i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y)});
    ctx.strokeStyle=l.color; ctx.lineWidth=2; ctx.globalAlpha=0.7;
    ctx.stroke(); ctx.globalAlpha=1;

    // glow
    ctx.beginPath();
    pts.forEach((pt,i)=>{i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y)});
    ctx.strokeStyle=l.color; ctx.lineWidth=6; ctx.globalAlpha=0.1;
    ctx.stroke(); ctx.globalAlpha=1;
  });

  // stations
  STATIONS.forEach(s=>{
    if(!LINE_STATION_SET.has(s.id))return;
    const {x,y}=p(s.lat,s.lng);
    const isHL = hoveredStation===s.id;
    const inRoute = selectedRoute && selectedRoute.path.includes(s.id);
    const r = isHL?9:(inRoute?7:5);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = isHL?'#ffd700':(inRoute?'#ffd700':'#c0c0c0');
    ctx.fill();
    if(isHL||inRoute){
      ctx.shadowColor='rgba(255,215,0,0.6)'; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    }
    // label
    if(isHL || inRoute || s.id==='beijing'||s.id==='shanghai'||s.id==='guangzhou'){
      ctx.fillStyle=isHL?'#ffd700':'rgba(240,240,240,0.7)';
      ctx.font='11px "Segoe UI","PingFang SC",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(s.name,x,y-r-4);
    }
  });

  // animated trains
  animTrains = animTrains.filter(t=>{
    const l=LINES.find(ln=>ln.id===t.lineId);
    if(!l || !LINES_VISIBLE[t.lineId])return false;
    t.progress+=0.003;
    if(t.progress>=1){t.progress=0}
    const idx = t.progress*(l.stations.length-1);
    const i0=Math.floor(idx), i1=Math.min(i0+1,l.stations.length-1);
    const frac=idx-i0;
    const a=stMap[l.stations[i0]], b=stMap[l.stations[i1]];
    if(!a||!b)return false;
    const pa=p(a.lat,a.lng), pb=p(b.lat,b.lng);
    const cx=pa.x+(pb.x-pa.x)*frac, cy=pa.y+(pb.y-pa.y)*frac;
    ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2);
    ctx.fillStyle=l.color; ctx.globalAlpha=0.9; ctx.fill();
    ctx.shadowColor=l.color; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    return true;
  });
  requestAnimationFrame(draw);
}

// ─── INTERACTION ────────────────────────────────────────────────
function getMousePos(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX||e.touches?.[0]?.clientX||0)-r.left,y:(e.clientY||e.touches?.[0]?.clientY||0)-r.top};
}
function findStation(mx,my){
  const pad=40; const p=(lat,lng)=>project(lat,lng,W,H,pad);
  let best=null,bestD=Infinity;
  STATIONS.forEach(s=>{
    if(!LINE_STATION_SET.has(s.id))return;
    const {x,y}=p(s.lat,s.lng);
    const d=Math.hypot(mx-x,my-y);
    if(d<bestD&&d<20){bestD=d;best=s}
  });
  return best;
}
canvas.addEventListener('mousemove',e=>{
  const {x,y}=getMousePos(e);
  const s=findStation(x,y);
  hoveredStation=s?s.id:null;
  const tt=document.getElementById('tooltip');
  if(s){
    const lines=LINES.filter(l=>l.stations.includes(s.id));
    tt.style.display='block';
    tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-10)+'px';
    document.getElementById('ttName').textContent=s.name;
    document.getElementById('ttInfo').textContent='途经线路: '+lines.map(l=>l.name).join('、');
  }else{tt.style.display='none'}
});
canvas.addEventListener('mouseleave',()=>{hoveredStation=null;document.getElementById('tooltip').style.display='none'});
canvas.addEventListener('click',e=>{
  const {x,y}=getMousePos(e);
  const s=findStation(x,y);
  if(s){
    const from=document.getElementById('fromStation');
    const to=document.getElementById('toStation');
    if(!from.value||from.value===to.value){from.value=s.id}
    else{to.value=s.id; planRoute()}
  }
});

// ─── UI ──────────────────────────────────────────────────────────
function initUI(){
  // line filters
  const cont=document.getElementById('lineFilter');
  cont.innerHTML=LINES.map(l=>`
    <label>
      <input type="checkbox" checked onchange="toggleLine('${l.id}',this.checked)">
      <span class="dot" style="background:${l.color}"></span> ${l.name}
    </label>
  `).join('');

  // station selects
  const sel=[document.getElementById('fromStation'),document.getElementById('toStation')];
  sel.forEach(s=>{
    s.innerHTML='<option value="">选择站点</option>'+
      STATIONS.filter(st=>LINE_STATION_SET.has(st.id))
        .sort((a,b)=>a.name.localeCompare(b.name))
        .map(st=>`<option value="${st.id}">${st.name}</option>`).join('');
  });

  // stats
  const totalKM = LINES.reduce((sum,l)=>{
    let d=0;
    for(let i=0;i<l.stations.length-1;i++) d+=haversine(stMap[l.stations[i]],stMap[l.stations[i+1]]);
    return sum+Math.round(d);
  },0);
  document.getElementById('statLines').textContent=LINES.length;
  document.getElementById('statStations').textContent=[...LINE_STATION_SET].length;
  document.getElementById('statMileage').textContent=totalKM;

  // knowledge
  showFact(0);
}
function toggleLine(id,vis){LINES_VISIBLE[id]=vis}
function onSearch(q){
  if(!q.trim())return;
  const s=STATIONS.find(st=>st.name.includes(q));
  if(s){hoveredStation=s.id}
}
function clearSearch(){
  document.getElementById('searchInput').value='';
  hoveredStation=null;
}
function resetView(){
  selectedRoute=null; hoveredStation=null;
  document.getElementById('routeResult').innerHTML='选择出发站与到达站，点击查询';
  document.getElementById('fromStation').value='';
  document.getElementById('toStation').value='';
}
function planRoute(){
  const from=document.getElementById('fromStation').value;
  const to=document.getElementById('toStation').value;
  if(!from||!to){document.getElementById('routeResult').innerHTML='⚠️ 请选择出发站和到达站';return}
  if(from===to){document.getElementById('routeResult').innerHTML='⚠️ 出发站与到达站相同';return}
  const res=dijkstra(from,to);
  const el=document.getElementById('routeResult');
  if(!res){el.innerHTML='❌ 未找到可行路径';return}
  selectedRoute=res;
  const names=res.path.map(sid=>stMap[sid].name);
  const linesUsed=[];
  LINES.forEach(l=>{
    for(let i=0;i<res.path.length-1;i++){
      const a=res.path[i], b=res.path[i+1];
      if(l.stations.includes(a)&&l.stations.includes(b)&&
         Math.abs(l.stations.indexOf(a)-l.stations.indexOf(b))===1){
        if(!linesUsed.includes(l.name))linesUsed.push(l.name);
      }
    }
  });
  el.innerHTML=`
    <div class="path">🚄 ${names.join(' → ')}</div>
    <div class="info">全程约 ${res.dist} km · 经停 ${res.path.length-2} 站</div>
    <div class="info">途经线路: ${linesUsed.join('、')}</div>
    <div class="info">⏱ 参考时长: 约 ${Math.round(res.dist/300*60+res.path.length*2)} 分钟</div>
  `;
}
function clearRoute(){
  selectedRoute=null;
  document.getElementById('routeResult').innerHTML='选择出发站与到达站，点击查询';
}
function showFact(i){
  const f=FACTS[i%FACTS.length];
  document.getElementById('factText').textContent=f.t;
  document.getElementById('factSrc').textContent='📊 '+f.s;
}
function nextFact(){factIdx=(factIdx+1)%FACTS.length;showFact(factIdx)}
function showRandomFact(){
  factIdx=Math.floor(Math.random()*FACTS.length);
  showFact(factIdx);
}

// ─── INIT ────────────────────────────────────────────────────────
initUI();
resize();
// auto rotate facts
setInterval(nextFact,12000);

// init trains
LINES.forEach(l=>{
  for(let i=0;i<3;i++) animTrains.push({lineId:l.id,progress:i/3});
});
</script>
