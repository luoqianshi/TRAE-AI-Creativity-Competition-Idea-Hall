<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公众号格式编辑器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <header class="toolbar">
            <div class="toolbar-left"><h1 class="logo">公众号编辑器</h1></div>
            <div class="toolbar-center">
                <button class="btn btn-secondary" id="btn-undo">↩ 撤销</button>
                <button class="btn btn-secondary" id="btn-redo">↪ 重做</button>
                <span class="divider"></span>
                <button class="btn btn-secondary" id="btn-preview">👁 预览</button>
                <button class="btn btn-primary" id="btn-copy">📋 复制到公众号</button>
                <button class="btn btn-danger" id="btn-clear">🗑 清空</button>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-secondary" id="btn-templates">📁 模板</button>
            </div>
        </header>
        <main class="main">
            <aside class="sidebar sidebar-left">
                <div class="panel-title">工具箱</div>
                <div class="tool-groups">
                    <div class="group">
                        <div class="group-title">添加方框</div>
                        <div class="tool-list">
                            <div class="tool-item tool-add-box">
                                <span class="tool-icon">▦</span>
                                <span>新建方框</span>
                            </div>
                        </div>
                    </div>
                    <div class="group">
                        <div class="group-title">快速样式</div>
                        <div class="preset-list">
                            <div class="preset-item" data-preset="title">
                                <div class="preset-preview preset-title">标题</div>
                                <span>大标题</span>
                            </div>
                            <div class="preset-item" data-preset="quote">
                                <div class="preset-preview preset-quote">"</div>
                                <span>引用框</span>
                            </div>
                            <div class="preset-item" data-preset="card">
                                <div class="preset-preview preset-card">▦</div>
                                <span>卡片</span>
                            </div>
                            <div class="preset-item" data-preset="notice">
                                <div class="preset-preview preset-notice">!</div>
                                <span>提示框</span>
                            </div>
                            <div class="preset-item" data-preset="divider">
                                <div class="preset-preview preset-divider">—</div>
                                <span>分割线</span>
                            </div>
                            <div class="preset-item" data-preset="imageFrame">
                                <div class="preset-preview preset-image">🖼</div>
                                <span>图框</span>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>
            <section class="canvas-area">
                <div class="canvas-wrapper">
                    <div class="canvas" id="canvas">
                        <div class="empty-state" id="empty-state">
                            <div class="empty-icon">+</div>
                            <p>点击左侧「新建方框」开始编辑</p>
                            <p class="empty-sub">像PPT一样编辑你的公众号文章</p>
                        </div>
                    </div>
                </div>
            </section>
            <aside class="sidebar sidebar-right" id="properties-panel">
                <div class="panel-title">属性设置</div>
                <div class="empty-props" id="empty-props"><p>点击画布中的方框进行编辑</p></div>
                <div class="props-content" id="props-content" style="display:none;"></div>
            </aside>
        </main>
    </div>
    <div class="modal" id="preview-modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header"><h3>预览效果</h3><button class="modal-close" id="modal-close">×</button></div>
            <div class="modal-body"><div class="preview-phone"><div class="preview-screen" id="preview-screen"></div></div></div>
        </div>
    </div>
    <div class="modal" id="templates-modal">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-large">
            <div class="modal-header"><h3>模板库</h3><button class="modal-close" id="templates-close">×</button></div>
            <div class="modal-body"><div class="templates-grid" id="templates-grid"></div></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <input type="file" id="file-input" accept="image/*" style="display:none;">
    <script src="js/components.js"></script>
    <script src="js/templates.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
