<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>永恒之花</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #02040a;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .login-galaxy-shell {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: #f8fbff;
      background: #02040a;
      cursor: grab;
      isolation: isolate;
    }

    .login-particle-galaxy,
    .login-entry-copy,
    .login-galaxy-actions,
    .login-galaxy-dock {
      position: absolute;
    }

    .login-particle-galaxy {
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 52% 45%, rgba(93, 169, 255, 0.12), transparent 23%),
        radial-gradient(circle at 44% 55%, rgba(244, 114, 182, 0.09), transparent 28%),
        #02040a;
    }

    .login-particle-galaxy canvas {
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      display: block;
    }

    .login-particle-galaxy canvas.is-dragging {
      cursor: grabbing;
    }

    .login-particle-galaxy canvas.is-selecting-star {
      cursor: pointer;
    }

    .agent-universe-stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #02040a;
    }

    .login-galaxy-actions {
      top: 24px;
      right: 24px;
      z-index: 12;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .login-galaxy-action {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid rgba(191, 219, 254, 0.24);
      border-radius: 999px;
      padding: 0 14px;
      color: #e5f6ff;
      background: rgba(2, 6, 23, 0.58);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.26);
      font-size: 13px;
      font-weight: 850;
      backdrop-filter: blur(16px);
    }

    .login-galaxy-action:hover {
      border-color: rgba(186, 230, 253, 0.42);
      color: #fff;
      background: rgba(15, 23, 42, 0.72);
      transform: translateY(-1px);
    }

    .login-galaxy-action.primary {
      color: #06111b;
      background: linear-gradient(135deg, #f8fbff, #bae6fd 58%, #f9a8d4);
    }

    .login-entry-copy {
      left: 50%;
      top: clamp(22px, 5vh, 62px);
      z-index: 8;
      width: min(860px, calc(100vw - 56px));
      display: grid;
      gap: 18px;
      justify-items: center;
      padding: 0;
      border: 0;
      color: #f8fbff;
      background: transparent;
      box-shadow: none;
      text-align: center;
      pointer-events: auto;
      transform: translateX(-50%);
      transition:
        opacity 520ms ease,
        transform 720ms cubic-bezier(0.2, 0.82, 0.18, 1);
    }

    .login-galaxy-shell.is-auth-open .login-entry-copy {
      opacity: 0.18;
      pointer-events: none;
      transform: translate(-50%, -16px);
    }

    .login-galaxy-brand span {
      color: #bae6fd;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.72);
    }

    .login-galaxy-brand h1 {
      max-width: none;
      margin: 10px 0 0;
      color: #ffffff;
      font-size: clamp(42px, 5.4vw, 78px);
      line-height: 1.04;
      letter-spacing: 0;
      text-shadow: 0 10px 36px rgba(0, 0, 0, 0.58);
      text-wrap: balance;
    }

    .login-galaxy-brand p {
      margin: 16px 0 0;
      color: #f8d982;
      background: linear-gradient(92deg, #f4c96b 0%, #fff2b8 42%, #d6a746 100%);
      background-clip: text;
      font-family: "Songti SC", "SimSun", "STSong", "Noto Serif CJK SC", serif;
      font-size: clamp(18px, 1.65vw, 28px);
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1.45;
      text-shadow:
        0 0 20px rgba(250, 204, 21, 0.24),
        0 10px 28px rgba(0, 0, 0, 0.72);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-entry-actions {
      width: 100%;
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .login-enter-button {
      min-width: 176px;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      padding: 0 20px;
      color: #06111b;
      background: linear-gradient(135deg, #f8fbff, #bae6fd 48%, #f9a8d4);
      box-shadow: 0 18px 44px rgba(56, 189, 248, 0.18);
      font-weight: 850;
    }

    .login-enter-button.secondary {
      background:
        linear-gradient(135deg, rgba(248, 251, 255, 0.9), rgba(186, 230, 253, 0.72) 48%, rgba(249, 168, 212, 0.84)),
        rgba(226, 241, 255, 0.7);
      backdrop-filter: blur(14px);
    }

    .login-enter-button:hover {
      transform: translateY(-1px);
    }

    .login-galaxy-dock {
      left: 50%;
      top: 54%;
      bottom: auto;
      z-index: 11;
      width: min(430px, calc(100vw - 48px));
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -42%) scale(0.96);
      transform-origin: center center;
      transition:
        opacity 440ms ease,
        transform 760ms cubic-bezier(0.2, 0.82, 0.18, 1);
    }

    .login-galaxy-shell.is-auth-open .login-galaxy-dock {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .login-galaxy-panel {
      display: grid;
      gap: 12px;
      max-height: calc(100dvh - 48px);
      overflow: auto;
      padding: 14px 14px 10px;
      border: 1px solid rgba(125, 211, 252, 0.26);
      border-radius: 8px;
      color: #f8fbff;
      background:
        linear-gradient(180deg, rgba(8, 18, 34, 0.76), rgba(2, 6, 23, 0.82)),
        rgba(2, 6, 23, 0.72);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.34),
        0 0 42px rgba(56, 189, 248, 0.12);
      backdrop-filter: blur(16px);
    }

    .panel-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title h2 {
      margin: 0;
      color: #fff;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .panel-title span {
      color: #bfdbfe;
      font-size: 12px;
      font-weight: 850;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 0;
      padding: 4px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 999px;
      background: rgba(2, 6, 23, 0.62);
    }

    .auth-tabs button {
      min-height: 34px;
      border: 0;
      border-radius: 999px;
      color: #a8c5d8;
      background: transparent;
      font-size: 13px;
      font-weight: 850;
    }

    .auth-tabs button.is-active {
      color: #07111c;
      background: #e0f7ff;
      box-shadow: 0 10px 26px rgba(56, 189, 248, 0.22);
    }

    .auth-form {
      display: grid;
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 7px;
      color: #d7ebfb;
      font-size: 13px;
      font-weight: 850;
    }

    .field input {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 8px;
      padding: 0 12px;
      color: #f8fafc;
      background: rgba(2, 6, 23, 0.58);
      outline: none;
    }

    .field input::placeholder {
      color: #8ba6b8;
    }

    .field input:focus {
      border-color: rgba(56, 189, 248, 0.58);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
    }

    .auth-links {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 24px;
    }

    .auth-link-button {
      border: 0;
      padding: 0;
      color: #bae6fd;
      background: transparent;
      font-size: 12px;
      font-weight: 850;
    }

    .primary-action,
    .ghost-action {
      min-height: 42px;
      border-radius: 999px;
      font-weight: 900;
    }

    .primary-action {
      border: 0;
      color: #06111b;
      background: linear-gradient(135deg, #f8fbff, #7dd3fc 54%, #f9a8d4);
    }

    .ghost-action {
      border: 1px solid rgba(148, 163, 184, 0.26);
      color: #dff7ff;
      background: rgba(15, 23, 42, 0.68);
    }

    .load-fallback {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      color: #bae6fd;
      background: #02040a;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .login-particle-galaxy.is-loading .load-fallback {
      opacity: 1;
    }

    @media (max-width: 760px) {
      .login-galaxy-actions {
        top: 12px;
        right: 12px;
      }

      .login-galaxy-dock {
        left: 12px;
        top: 70px;
        width: calc(100vw - 24px);
        transform: translate(0, -12px) scale(0.98);
        transform-origin: center top;
      }

      .login-galaxy-shell.is-auth-open .login-galaxy-dock {
        transform: translate(0, 0) scale(1);
      }

      .login-galaxy-panel {
        max-height: calc(100dvh - 82px);
      }

      .login-entry-copy {
        top: 70px;
        width: calc(100vw - 24px);
      }

      .login-galaxy-shell.is-auth-open .login-entry-copy {
        display: none;
      }

      .login-galaxy-brand h1 {
        font-size: clamp(32px, 8vw, 48px);
      }

      .login-galaxy-brand p {
        font-size: 16px;
      }

      .login-entry-actions {
        gap: 10px;
      }

      .login-enter-button {
        min-width: 142px;
        min-height: 46px;
        padding: 0 14px;
      }
    }

    @media (max-width: 520px) {
      .login-galaxy-brand h1 {
        font-size: 28px;
      }

      .login-galaxy-brand p {
        font-size: 14px;
      }

      .login-entry-copy {
        top: 62px;
        width: calc(100vw - 20px);
      }

      .login-enter-button {
        width: min(100%, 260px);
      }
    }
  </style>
</head>
<body>
  <main id="shell" class="login-galaxy-shell login-universe-shell agent-universe-stage is-entered">
    <div id="galaxyMount" class="login-particle-galaxy is-loading" aria-hidden="true">
      <div class="load-fallback">星域渲染中...</div>
    </div>

    <section class="login-galaxy-actions" aria-label="登录操作">
      <button type="button" class="login-galaxy-action" id="backButton">‹ 返回</button>
      <button type="button" class="login-galaxy-action primary" id="topLoginButton">登录</button>
    </section>

    <section class="login-entry-copy" aria-label="登录引导">
      <div class="login-galaxy-brand">
        <span>WEB4.0 AGENT COMMUNITY</span>
        <h1>每一颗星星，都是我们来过的证明</h1>
        <p>Web4.0已至，邀您共建AI社区。</p>
      </div>

      <div class="login-entry-actions">
        <button type="button" class="login-enter-button" data-open-login>进入星系 ›</button>
        <button type="button" class="login-enter-button secondary" data-open-login>进入社区 ›</button>
      </div>
    </section>

    <section class="login-galaxy-dock" aria-label="登录">
      <section class="login-galaxy-panel">
        <div class="panel-title">
          <h2>账号登录</h2>
          <span>登录后进入</span>
        </div>

        <div class="auth-tabs">
          <button type="button" class="is-active">登录</button>
          <button type="button">注册</button>
        </div>

        <div class="auth-form">
          <label class="field">
            用户名或邮箱
            <input placeholder="用户名 / 邮箱" autocomplete="username">
          </label>

          <label class="field">
            密码
            <input placeholder="请输入密码" type="password" autocomplete="current-password">
          </label>

          <div class="auth-links">
            <button type="button" class="auth-link-button">忘记密码？</button>
            <button type="button" class="auth-link-button">邮箱验证码登录</button>
          </div>

          <button type="button" class="primary-action">登录</button>
        </div>
      </section>
    </section>
  </main>

  <script type="module">
    async function loadThree() {
      try {
        return await import("./node_modules/three/build/three.module.min.js");
      } catch (localError) {
        return await import("https://unpkg.com/three@0.184.0/build/three.module.min.js");
      }
    }

    const THREE = await loadThree();
    const shell = document.getElementById("shell");
    const mount = document.getElementById("galaxyMount");

    function openLoginDock() {
      shell.classList.add("is-entered", "is-auth-open");
    }

    function closeLoginDock() {
      shell.classList.remove("is-auth-open");
    }

    document.getElementById("topLoginButton").addEventListener("click", openLoginDock);
    document.querySelectorAll("[data-open-login]").forEach((button) => {
      button.addEventListener("click", openLoginDock);
    });
    document.getElementById("backButton").addEventListener("click", () => {
      closeLoginDock();
      shell.classList.remove("is-entered");
      window.setTimeout(() => shell.classList.add("is-entered"), 320);
    });

    const LOGIN_STAR_SLOTS = [
      { arm: 0, radius: 0.18, angle: 0.1, height: 0.02, size: 10, glow: 1, hue: 0.54, delay: "0s" },
      { arm: 1, radius: 0.24, angle: 0.85, height: -0.03, size: 8, glow: 0.86, hue: 0.58, delay: "-1.4s" },
      { arm: 2, radius: 0.3, angle: 1.55, height: 0.04, size: 9, glow: 0.92, hue: 0.62, delay: "-2.6s" },
      { arm: 0, radius: 0.36, angle: 2.25, height: -0.01, size: 7, glow: 0.74, hue: 0.5, delay: "-0.8s" },
      { arm: 1, radius: 0.42, angle: 2.95, height: 0.05, size: 11, glow: 0.98, hue: 0.66, delay: "-3.1s" },
      { arm: 2, radius: 0.48, angle: 3.65, height: -0.04, size: 8, glow: 0.8, hue: 0.57, delay: "-1.9s" },
      { arm: 0, radius: 0.53, angle: 4.32, height: 0.02, size: 12, glow: 1, hue: 0.6, delay: "-0.4s" },
      { arm: 1, radius: 0.58, angle: 5.04, height: -0.02, size: 9, glow: 0.88, hue: 0.7, delay: "-2.2s" },
      { arm: 2, radius: 0.63, angle: 5.72, height: 0.06, size: 10, glow: 0.94, hue: 0.52, delay: "-3.7s" },
      { arm: 0, radius: 0.68, angle: 6.36, height: -0.05, size: 6, glow: 0.62, hue: 0.74, delay: "-1.1s" },
      { arm: 1, radius: 0.72, angle: 7.04, height: 0.03, size: 8, glow: 0.78, hue: 0.56, delay: "-2.9s" },
      { arm: 2, radius: 0.76, angle: 7.75, height: -0.03, size: 11, glow: 0.9, hue: 0.64, delay: "-0.2s" },
      { arm: 0, radius: 0.8, angle: 8.44, height: 0.04, size: 7, glow: 0.68, hue: 0.5, delay: "-3.4s" },
      { arm: 1, radius: 0.84, angle: 9.12, height: -0.05, size: 9, glow: 0.82, hue: 0.68, delay: "-1.7s" },
      { arm: 2, radius: 0.88, angle: 9.82, height: 0.02, size: 6, glow: 0.58, hue: 0.58, delay: "-2.4s" },
      { arm: 0, radius: 0.92, angle: 10.46, height: 0.06, size: 10, glow: 0.84, hue: 0.72, delay: "-0.9s" },
      { arm: 1, radius: 0.96, angle: 11.12, height: -0.04, size: 6, glow: 0.54, hue: 0.55, delay: "-2s" },
      { arm: 2, radius: 1, angle: 11.86, height: 0.03, size: 5, glow: 0.44, hue: 0.63, delay: "-3.8s" }
    ];

    const demoStars = LOGIN_STAR_SLOTS.map((slot, index) => {
      const heat = index < 10 ? Math.max(0.18, 1 - index * 0.055) : 0;
      return {
        key: `demo-${index}`,
        agent: index < 10 ? { id: `agent-${index}` } : null,
        favorites: index < 10 ? 1000 - index * 60 : 0,
        heat,
        size: Math.round(slot.size * (index < 10 ? 0.72 + heat * 1.72 : 0.45 + slot.glow * 0.28)),
        brightness: index < 10 ? 0.52 + heat * 0.48 : slot.glow * 0.24,
        ...slot
      };
    });

    function seededUnit(index) {
      const value = Math.sin(index * 127.1 + 311.7) * 43758.5453123;
      return value - Math.floor(value);
    }

    function createParticleMaterial(maxPointSize, alphaBoost) {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: true,
        uniforms: {
          uTime: { value: 0 }
        },
        vertexShader: `
          attribute float aSize;
          attribute float aTwinkle;
          varying vec3 vColor;
          varying float vAlpha;
          uniform float uTime;
          void main() {
            vColor = color;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            float pulse = 0.78 + 0.22 * sin(uTime * 0.9 + aTwinkle);
            gl_PointSize = clamp(aSize * pulse * (270.0 / max(42.0, -mvPosition.z)), 0.7, ${maxPointSize.toFixed(1)});
            gl_Position = projectionMatrix * mvPosition;
            vAlpha = pulse;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vec2 uv = gl_PointCoord.xy - 0.5;
            float distanceFromCenter = length(uv);
            if (distanceFromCenter > 0.5) discard;
            float core = smoothstep(0.22, 0.0, distanceFromCenter);
            float halo = smoothstep(0.42, 0.18, distanceFromCenter);
            float alpha = (core * 0.9 + halo * 0.1) * vAlpha;
            gl_FragColor = vec4(vColor, min(alpha * ${alphaBoost.toFixed(2)}, 1.0));
          }
        `
      });
    }

    function makeParticleCloud(count, fill, material) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const twinkles = new Float32Array(count);
      const color = new THREE.Color();

      for (let index = 0; index < count; index += 1) {
        fill(index, { positions, colors, sizes, twinkles, color });
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute("aTwinkle", new THREE.BufferAttribute(twinkles, 1));
      const cloud = new THREE.Points(geometry, material);
      return { cloud, geometry, material };
    }

    function createAgentStarTexture(kind) {
      const textureCanvas = document.createElement("canvas");
      textureCanvas.width = 128;
      textureCanvas.height = 128;
      const context = textureCanvas.getContext("2d");
      if (context) {
        const center = 64;
        const haloRadius = kind === "core" ? 42 : 58;
        const halo = context.createRadialGradient(center, center, 0, center, center, haloRadius);
        halo.addColorStop(0, "rgba(255,255,255,1)");
        halo.addColorStop(kind === "core" ? 0.16 : 0.1, "rgba(255,255,255,0.92)");
        halo.addColorStop(kind === "core" ? 0.38 : 0.34, "rgba(255,255,255,0.28)");
        halo.addColorStop(1, "rgba(255,255,255,0)");
        context.fillStyle = halo;
        context.beginPath();
        context.arc(center, center, haloRadius, 0, Math.PI * 2);
        context.fill();

        if (kind === "core") {
          const drawRay = (length, width, alpha) => {
            const ray = context.createLinearGradient(0, 0, length, 0);
            ray.addColorStop(0, `rgba(255,255,255,${alpha})`);
            ray.addColorStop(0.38, `rgba(255,255,255,${alpha * 0.24})`);
            ray.addColorStop(1, "rgba(255,255,255,0)");
            context.fillStyle = ray;
            context.beginPath();
            context.moveTo(0, -width);
            context.quadraticCurveTo(length * 0.5, -width * 0.22, length, 0);
            context.quadraticCurveTo(length * 0.5, width * 0.22, 0, width);
            context.closePath();
            context.fill();
          };

          context.save();
          context.translate(center, center);
          for (let rayIndex = 0; rayIndex < 4; rayIndex += 1) {
            drawRay(34, 2.6, 0.62);
            context.rotate(Math.PI / 2);
          }
          context.rotate(Math.PI / 4);
          for (let rayIndex = 0; rayIndex < 4; rayIndex += 1) {
            drawRay(20, 1.5, 0.24);
            context.rotate(Math.PI / 2);
          }
          context.restore();
        }
      }
      const texture = new THREE.CanvasTexture(textureCanvas);
      texture.needsUpdate = true;
      return texture;
    }

    const isUniverseView = true;
    const cameraView = "flowerFront";
    const isFlowerFrontView = cameraView === "flowerFront";
    const galaxyScale = 1.16;
    const particleSizeScale = 1.05;
    const outerParticleSizeScale = 1.22;
    const agentPickScale = 2.05;
    const cameraStartY = isFlowerFrontView ? 72 : 285;
    const cameraStartZ = isFlowerFrontView ? 760 : -92;
    const overviewPitch = isFlowerFrontView ? -0.02 : -1.32;
    const galaxyRotationX = isFlowerFrontView ? -0.02 : -0.12;

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02040a, 0.0026);

    const camera = new THREE.PerspectiveCamera(64, 1, 0.1, 2400);
    camera.position.set(0, cameraStartY, cameraStartZ);
    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    renderer.setClearColor(0x02040a, 1);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.domElement.tabIndex = 0;
    mount.appendChild(renderer.domElement);
    mount.classList.remove("is-loading");

    const galaxyGroup = new THREE.Group();
    galaxyGroup.rotation.x = galaxyRotationX;
    galaxyGroup.scale.setScalar(galaxyScale);
    scene.add(galaxyGroup);

    const baseParticleMaterial = createParticleMaterial(14, 1);
    const particleCloud = makeParticleCloud(18000, (index, target) => {
      const { positions, colors, sizes, twinkles, color } = target;
      const layer = seededUnit(index + 5);
      const arm = index % 6;
      const radiusUnit = Math.pow(seededUnit(index + 3), 0.52);
      let coreFalloff = Math.max(0.1, 1 - radiusUnit);
      const sphereRadius = 238;
      let x = 0;
      let y = 0;
      let z = 0;
      let goldChance = 0.12;
      let goldFalloff = 1 - radiusUnit;
      let isCorollaParticle = false;
      let isNebulaFunnelParticle = false;
      let sizeBoost = 0;

      if (layer < 0.24) {
        const shell = Math.pow(seededUnit(index + 101), 0.42);
        const theta = seededUnit(index + 107) * Math.PI * 2;
        const phi = Math.acos(1 - 2 * seededUnit(index + 109));
        const radius = shell * sphereRadius;
        x = Math.sin(phi) * Math.cos(theta) * radius;
        y = Math.cos(phi) * radius * 0.78;
        z = Math.sin(phi) * Math.sin(theta) * radius;
        goldFalloff = 1 - shell;
        coreFalloff = Math.max(0.08, goldFalloff);
        goldChance = 0.06 + Math.pow(goldFalloff, 1.7) * 0.34;
      } else if (layer < 0.58) {
        isCorollaParticle = true;
        const petalUnit = Math.pow(seededUnit(index + 3), 0.56);
        const petalFalloff = 1 - petalUnit;
        const petalRadius = 8 + petalUnit * 172;
        const armAngle = (arm / 6) * Math.PI * 2;
        const angleJitter = (seededUnit(index + 91) - 0.5) * (0.22 + petalUnit * 0.72);
        const angle = armAngle + petalUnit * 10.6 + angleJitter;
        const petalWave = Math.sin(angle * 2.2 + petalUnit * 6.4);
        const scatter = (seededUnit(index + 17) - 0.5) * (10 + petalUnit * 46);
        const bloom = 0.76 + Math.max(0, petalWave) * 0.28 + seededUnit(index + 47) * 0.22;
        x = Math.cos(angle) * (petalRadius + scatter) * bloom;
        y =
          Math.sin(angle * 1.1 + petalUnit * 5.6) * (8 + petalUnit * 28) +
          (seededUnit(index + 43) - 0.5) * (18 + petalUnit * 46);
        z =
          Math.sin(angle) * (petalRadius + scatter) * bloom +
          Math.cos(angle * 0.64 + arm) * petalUnit * 16;
        goldFalloff = petalFalloff;
        coreFalloff = Math.max(0.12, petalFalloff);
        goldChance = 0.28 + Math.pow(petalFalloff, 1.22) * 0.48;
        sizeBoost = 0.28 + petalFalloff * 0.62;
      } else {
        isNebulaFunnelParticle = true;
        const funnelUnit = Math.pow(seededUnit(index + 131), 0.72);
        const direction = seededUnit(index + 137) > 0.5 ? 1 : -1;
        const funnelArm = arm % 4;
        const funnelAngle =
          (funnelArm / 4) * Math.PI * 2 +
          direction * funnelUnit * 8.8 +
          (seededUnit(index + 139) - 0.5) * (0.4 + funnelUnit * 0.92);
        const funnelRadius =
          10 +
          funnelUnit * 128 +
          Math.sin(funnelAngle * 1.7 + funnelUnit * 4.8) * (4 + funnelUnit * 18) +
          (seededUnit(index + 141) - 0.5) * (9 + funnelUnit * 28);
        const funnelHeight = direction * (16 + funnelUnit * 162);
        x = Math.cos(funnelAngle) * funnelRadius;
        y = funnelHeight + Math.sin(funnelAngle * 1.18 + funnelUnit * 5.8) * (5 + funnelUnit * 24);
        z = Math.sin(funnelAngle) * funnelRadius + Math.cos(funnelAngle * 0.72 + funnelArm) * funnelUnit * 18;
        goldFalloff = 1 - funnelUnit;
        coreFalloff = Math.max(0.14, goldFalloff * 0.8);
        goldChance = 0.2 + Math.pow(goldFalloff, 1.35) * 0.42;
        sizeBoost = 0.42 + (1 - funnelUnit) * 0.7;
      }

      const isGoldParticle = seededUnit(index + 29) < goldChance;
      const hue = isNebulaFunnelParticle
        ? isGoldParticle
          ? 0.085 + seededUnit(index + 31) * 0.06
          : 0.5 + seededUnit(index + 29) * 0.3
        : isGoldParticle
          ? 0.085 + seededUnit(index + 31) * 0.07
          : 0.53 + seededUnit(index + 29) * (isCorollaParticle ? 0.32 : 0.2);
      const saturation = isNebulaFunnelParticle
        ? isGoldParticle
          ? 0.58 + seededUnit(index + 37) * 0.26
          : 0.56 + seededUnit(index + 31) * 0.38
        : isGoldParticle
          ? 0.62 + seededUnit(index + 37) * 0.28
          : 0.48 + seededUnit(index + 31) * 0.42;
      const lightness = isNebulaFunnelParticle
        ? isGoldParticle
          ? 0.72 + Math.pow(goldFalloff, 1.25) * 0.16 + seededUnit(index + 41) * 0.1
          : 0.58 + seededUnit(index + 37) * 0.26 + Math.pow(goldFalloff, 1.2) * 0.12
        : isGoldParticle
          ? 0.68 + Math.pow(goldFalloff, 1.2) * 0.18 + seededUnit(index + 41) * 0.12
          : 0.56 + seededUnit(index + 37) * 0.28;

      positions[index * 3] = x;
      positions[index * 3 + 1] = y;
      positions[index * 3 + 2] = z;
      color.setHSL(hue, saturation, lightness);
      colors[index * 3] = color.r;
      colors[index * 3 + 1] = color.g;
      colors[index * 3 + 2] = color.b;
      sizes[index] = (1.25 + seededUnit(index + 59) * 3.8 + coreFalloff * 2.1 + (isGoldParticle ? 0.55 : 0) + sizeBoost) * particleSizeScale;
      twinkles[index] = seededUnit(index + 71) * Math.PI * 2;
    }, baseParticleMaterial);
    galaxyGroup.add(particleCloud.cloud);

    const coreMaterial = createParticleMaterial(14, 1);
    const coreParticleCloud = makeParticleCloud(3600, (index, target) => {
      const { positions, colors, sizes, twinkles, color } = target;
      const arm = index % 6;
      const radiusUnit = Math.pow(seededUnit(index + 701), 1.08);
      const radius = 3 + radiusUnit * 112;
      const armAngle = (arm / 6) * Math.PI * 2;
      const angleJitter = (seededUnit(index + 709) - 0.5) * (0.18 + radiusUnit * 0.68);
      const angle = armAngle + radiusUnit * 11.8 + angleJitter;
      const laneScale = 0.68 + seededUnit(index + 733) * 0.56;
      const height =
        Math.sin(angle * 1.18 + radiusUnit * 5.6) * (5 + radiusUnit * 22) +
        (seededUnit(index + 719) - 0.5) * (14 + radiusUnit * 40);
      const whiteGold = seededUnit(index + 727) > 0.68;
      positions[index * 3] = Math.cos(angle) * radius * laneScale;
      positions[index * 3 + 1] = height;
      positions[index * 3 + 2] = Math.sin(angle) * radius * laneScale + Math.cos(angle * 0.72 + arm) * radiusUnit * 13;
      color.setHSL(
        whiteGold ? 0.12 + seededUnit(index + 737) * 0.03 : 0.075 + seededUnit(index + 737) * 0.055,
        whiteGold ? 0.34 + seededUnit(index + 741) * 0.16 : 0.78 + seededUnit(index + 741) * 0.14,
        whiteGold ? 0.84 + seededUnit(index + 743) * 0.12 : 0.74 + seededUnit(index + 743) * 0.16
      );
      colors[index * 3] = color.r;
      colors[index * 3 + 1] = color.g;
      colors[index * 3 + 2] = color.b;
      sizes[index] = (1.7 + seededUnit(index + 751) * 3.35 + (1 - radiusUnit) * 4.8) * particleSizeScale;
      twinkles[index] = seededUnit(index + 757) * Math.PI * 2;
    }, coreMaterial);
    galaxyGroup.add(coreParticleCloud.cloud);

    const nucleusMaterial = createParticleMaterial(14, 1);
    const nucleusParticleCloud = makeParticleCloud(2800, (index, target) => {
      const { positions, colors, sizes, twinkles, color } = target;
      const arm = index % 6;
      const radiusUnit = Math.pow(seededUnit(index + 901), 1.42);
      const radius = 0.7 + radiusUnit * 44;
      const armAngle = (arm / 6) * Math.PI * 2;
      const angle = armAngle + radiusUnit * 11.8 + (seededUnit(index + 907) - 0.5) * (0.24 + radiusUnit * 0.26);
      const crossingWeight = 1 - radiusUnit;
      const laneScale = 0.58 + seededUnit(index + 911) * 0.4;
      positions[index * 3] = Math.cos(angle) * radius * laneScale + (seededUnit(index + 917) - 0.5) * crossingWeight * 3.2;
      positions[index * 3 + 1] =
        (seededUnit(index + 915) - 0.5) * 42 +
        Math.sin(angle * 1.14 + radiusUnit * 5.8) * (1.2 + radiusUnit * 12) +
        (seededUnit(index + 919) - 0.5) * (6 + crossingWeight * 8);
      positions[index * 3 + 2] =
        Math.sin(angle) * radius * laneScale +
        Math.cos(angle * 0.72 + arm) * radiusUnit * 3.4 +
        (seededUnit(index + 923) - 0.5) * crossingWeight * 3.2;
      const whiteGold = seededUnit(index + 929) > 0.52;
      color.setHSL(
        whiteGold ? 0.115 + seededUnit(index + 931) * 0.025 : 0.07 + seededUnit(index + 931) * 0.055,
        whiteGold ? 0.3 + seededUnit(index + 937) * 0.16 : 0.84 + seededUnit(index + 937) * 0.12,
        whiteGold ? 0.88 + seededUnit(index + 941) * 0.1 : 0.8 + seededUnit(index + 941) * 0.14
      );
      colors[index * 3] = color.r;
      colors[index * 3 + 1] = color.g;
      colors[index * 3 + 2] = color.b;
      sizes[index] = (1.9 + seededUnit(index + 947) * 3.6 + crossingWeight * 5.2) * particleSizeScale;
      twinkles[index] = seededUnit(index + 953) * Math.PI * 2;
    }, nucleusMaterial);
    galaxyGroup.add(nucleusParticleCloud.cloud);

    const outerDiskMaterial = createParticleMaterial(18, 1.78);
    const colorZones = [
      { hue: 0.59, saturation: 0.98, lightness: 0.78 },
      { hue: 0.52, saturation: 0.96, lightness: 0.78 },
      { hue: 0.12, saturation: 0.98, lightness: 0.84 },
      { hue: 0.94, saturation: 0.96, lightness: 0.84 },
      { hue: 0.01, saturation: 0.94, lightness: 0.78 },
      { hue: 0.72, saturation: 0.92, lightness: 0.8 },
      { hue: 0.41, saturation: 0.9, lightness: 0.78 }
    ];
    const outerDiskCloud = makeParticleCloud(32000, (index, target) => {
      const { positions, colors, sizes, twinkles, color } = target;
      const curtain = index % colorZones.length;
      const radiusUnit = Math.pow(seededUnit(index + 1201), 0.55);
      const radius = 340 + radiusUnit * 680;
      const centerAngle = (curtain / colorZones.length) * Math.PI * 2 + Math.sin(curtain * 1.7) * 0.22;
      const arcWidth = 0.72 + seededUnit(curtain + 1511) * 0.28;
      const angleOffset = (seededUnit(index + 1211) - 0.5) * arcWidth;
      const twist = radiusUnit * (2.5 + curtain * 0.1);
      const angle = centerAngle + angleOffset + twist;
      const bandDepth = (seededUnit(index + 1217) - 0.5) * (60 + radiusUnit * 112);
      const heightSeed = seededUnit(index + 1223) - 0.5;
      const height =
        Math.sign(heightSeed) * Math.pow(Math.abs(heightSeed) * 2, 0.72) * 260 +
        Math.sin(angle * 1.16 + radiusUnit * 4.8 + curtain) * (28 + radiusUnit * 66);
      const radialFeather = Math.cos(angleOffset / Math.max(0.01, arcWidth) * Math.PI) * (32 + radiusUnit * 58);
      const radiusWithDepth = radius + bandDepth + radialFeather;
      positions[index * 3] = Math.cos(angle) * radiusWithDepth;
      positions[index * 3 + 1] = height;
      positions[index * 3 + 2] = Math.sin(angle) * radiusWithDepth + Math.cos(angle * 0.48 + curtain) * (28 + radiusUnit * 62);

      const zoneIndex = curtain % colorZones.length;
      const nextZone = (zoneIndex + 1) % colorZones.length;
      const blend = THREE.MathUtils.clamp(Math.abs(angleOffset / Math.max(0.01, arcWidth)) * 1.35 + radiusUnit * 0.06, 0, 1);
      const first = colorZones[zoneIndex];
      const second = colorZones[nextZone];
      const softBlend = blend * blend * (3 - 2 * blend);
      const hue = first.hue + (second.hue - first.hue) * softBlend * 0.42 + (seededUnit(index + 1229) - 0.5) * 0.012;
      const saturation = first.saturation + (second.saturation - first.saturation) * softBlend * 0.3 + (seededUnit(index + 1231) - 0.5) * 0.05;
      const lightness = first.lightness + (second.lightness - first.lightness) * softBlend * 0.34 + (seededUnit(index + 1235) - 0.5) * 0.05;
      color.setHSL((hue + 1) % 1, THREE.MathUtils.clamp(saturation, 0.68, 1), THREE.MathUtils.clamp(lightness + 0.09, 0.72, 0.98));
      colors[index * 3] = color.r;
      colors[index * 3 + 1] = color.g;
      colors[index * 3 + 2] = color.b;
      sizes[index] =
        (1.55 + seededUnit(index + 1241) * 3.6 + (1 - Math.abs(angleOffset) / arcWidth) * 1.9 + (1 - radiusUnit) * 0.9 + radiusUnit * 0.45) *
        particleSizeScale * outerParticleSizeScale;
      twinkles[index] = seededUnit(index + 1249) * Math.PI * 2;
    }, outerDiskMaterial);
    galaxyGroup.add(outerDiskCloud.cloud);

    const distantMaterial = createParticleMaterial(18, 1.32);
    const distantStars = makeParticleCloud(9000, (index, target) => {
      const { positions, colors, sizes, twinkles, color } = target;
      const direction = new THREE.Vector3(
        seededUnit(index + 211) - 0.5,
        seededUnit(index + 223) - 0.5,
        seededUnit(index + 241) - 0.5
      ).normalize();
      const distance = 320 + seededUnit(index + 251) * 1120;
      positions[index * 3] = direction.x * distance;
      positions[index * 3 + 1] = direction.y * distance;
      positions[index * 3 + 2] = direction.z * distance;
      const isDistantGold = seededUnit(index + 263) > 0.82;
      color.setHSL(
        isDistantGold ? 0.09 + seededUnit(index + 267) * 0.08 : 0.55 + seededUnit(index + 263) * 0.14,
        isDistantGold ? 0.66 + seededUnit(index + 271) * 0.26 : 0.48 + seededUnit(index + 271) * 0.18,
        isDistantGold ? 0.78 + seededUnit(index + 273) * 0.18 : 0.7 + seededUnit(index + 269) * 0.22
      );
      colors[index * 3] = color.r;
      colors[index * 3 + 1] = color.g;
      colors[index * 3 + 2] = color.b;
      sizes[index] = (1 + seededUnit(index + 277) * 2.7 + (isDistantGold ? 0.75 : 0.18)) * particleSizeScale * outerParticleSizeScale;
      twinkles[index] = seededUnit(index + 281) * Math.PI * 2;
    }, distantMaterial);
    scene.add(distantStars.cloud);

    const agentStarTexture = createAgentStarTexture("core");
    const agentGlowTexture = createAgentStarTexture("glow");
    const agentPickGeometry = new THREE.SphereGeometry(1, 24, 16);
    const agentPickMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false, color: 0xffffff });
    agentPickMaterial.colorWrite = false;
    const agentPoints = [];
    const agentColorZones = [
      { hue: 0.59, center: 0 },
      { hue: 0.52, center: 1 },
      { hue: 0.12, center: 2 },
      { hue: 0.94, center: 3 },
      { hue: 0.01, center: 4 }
    ];

    demoStars.forEach((star, index) => {
      const zone = agentColorZones[index % agentColorZones.length];
      const zoneTier = Math.floor(index / agentColorZones.length);
      const centerAngle = (zone.center / agentColorZones.length) * Math.PI * 2 + Math.sin(zone.center * 1.7) * 0.18;
      const angle = centerAngle + (zoneTier - 1.4) * 0.095 + (seededUnit(index + 811) - 0.5) * 0.065;
      const radius = 312 + (zoneTier % 4) * 46 + seededUnit(index + 817) * 22;
      const verticalSlots = [-118, -34, 58, 136];
      const y =
        verticalSlots[zoneTier % verticalSlots.length] +
        (seededUnit(index + 823) - 0.5) * 28 +
        Math.sin(angle * 1.2 + zoneTier) * 18;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius + Math.cos(angle * 0.55 + zone.center) * 22;
      const displayHue = zone.hue;
      const agentColor = new THREE.Color().setHSL(displayHue, star.agent ? 0.9 : 0.62, star.agent ? 0.72 + star.heat * 0.12 : 0.5);
      const glowColor = new THREE.Color().setHSL(displayHue, star.agent ? 0.98 : 0.72, star.agent ? 0.84 + star.heat * 0.08 : 0.64);
      const baseStarScale = star.agent ? 6.8 + star.heat * 2.4 : 4.6 + star.brightness * 1.4;
      const baseGlowScale = baseStarScale * (star.agent ? 2.7 : 2.2);
      const starMaterial = new THREE.SpriteMaterial({
        map: agentStarTexture,
        color: agentColor,
        transparent: true,
        opacity: star.agent ? 0.96 : 0.66,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const glowMaterial = new THREE.SpriteMaterial({
        map: agentGlowTexture,
        color: glowColor,
        transparent: true,
        opacity: star.agent ? 0.3 : 0.12,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      const starMesh = new THREE.Sprite(starMaterial);
      starMesh.position.set(x, y, z);
      starMesh.scale.setScalar(baseStarScale);
      galaxyGroup.add(starMesh);
      const glowMesh = new THREE.Sprite(glowMaterial);
      glowMesh.position.set(x, y, z);
      glowMesh.scale.setScalar(baseGlowScale);
      galaxyGroup.add(glowMesh);
      const pickMesh = new THREE.Mesh(agentPickGeometry, agentPickMaterial);
      pickMesh.position.set(x, y, z);
      const basePickScale = (star.agent ? 6.6 + star.heat * 2.2 : 5.8 + star.brightness * 1.6) * agentPickScale;
      pickMesh.scale.setScalar(basePickScale);
      galaxyGroup.add(pickMesh);
      agentPoints.push({ pickMesh, starMesh, glowMesh, starMaterial, glowMaterial, star, baseScale: baseStarScale, baseGlowScale, basePickScale });
    });

    const raycaster = new THREE.Raycaster();
    const pointerVector = new THREE.Vector2();
    const projectedAgentPosition = new THREE.Vector3();
    const forwardVector = new THREE.Vector3();
    const rightVector = new THREE.Vector3();
    const verticalVector = new THREE.Vector3(0, 1, 0);
    const flightVelocity = new THREE.Vector3();
    const flightDirection = new THREE.Vector3();
    const keys = new Set();
    const flight = {
      down: false,
      lastX: 0,
      lastY: 0,
      moved: 0,
      yaw: 0,
      pitch: overviewPitch,
      targetYaw: 0,
      targetPitch: overviewPitch,
      manual: false,
      hoveredIndex: -1
    };

    const clampCameraPosition = () => {
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -980, 980);
      camera.position.y = THREE.MathUtils.clamp(camera.position.y, -320, 660);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -1020, 1020);
    };

    function getNearestAgentAtPointer(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const pointerX = event.clientX - rect.left;
      const pointerY = event.clientY - rect.top;
      let nearestIndex = -1;
      let nearestDistance = Number.POSITIVE_INFINITY;
      agentPoints.forEach((point, index) => {
        point.pickMesh.getWorldPosition(projectedAgentPosition);
        projectedAgentPosition.project(camera);
        if (projectedAgentPosition.z < -1 || projectedAgentPosition.z > 1) return;
        const screenX = ((projectedAgentPosition.x + 1) / 2) * rect.width;
        const screenY = ((1 - projectedAgentPosition.y) / 2) * rect.height;
        const distance = Math.hypot(pointerX - screenX, pointerY - screenY);
        const threshold = THREE.MathUtils.clamp(point.star.agent ? 58 + point.star.heat * 34 : 44 + point.star.brightness * 26, 42, 124);
        if (distance <= threshold && distance < nearestDistance) {
          nearestIndex = index;
          nearestDistance = distance;
        }
      });
      return nearestIndex;
    }

    renderer.domElement.addEventListener("pointerdown", (event) => {
      flight.down = true;
      flight.lastX = event.clientX;
      flight.lastY = event.clientY;
      flight.moved = 0;
      renderer.domElement.focus({ preventScroll: true });
      renderer.domElement.classList.add("is-dragging");
      renderer.domElement.setPointerCapture?.(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (!flight.down) {
        flight.hoveredIndex = getNearestAgentAtPointer(event);
        renderer.domElement.classList.toggle("is-selecting-star", flight.hoveredIndex >= 0);
        return;
      }
      const deltaX = event.clientX - flight.lastX;
      const deltaY = event.clientY - flight.lastY;
      flight.lastX = event.clientX;
      flight.lastY = event.clientY;
      flight.moved += Math.abs(deltaX) + Math.abs(deltaY);
      flight.targetYaw -= deltaX * 0.0038;
      flight.targetPitch = THREE.MathUtils.clamp(flight.targetPitch - deltaY * 0.0028, -1.52, 1.08);
      flight.manual = true;
      shell.classList.add("is-entered");
    });

    const stopDrag = (event) => {
      renderer.domElement.classList.remove("is-dragging");
      renderer.domElement.releasePointerCapture?.(event.pointerId);
      flight.down = false;
      flight.hoveredIndex = getNearestAgentAtPointer(event);
      renderer.domElement.classList.toggle("is-selecting-star", flight.hoveredIndex >= 0);
    };
    renderer.domElement.addEventListener("pointerup", stopDrag);
    renderer.domElement.addEventListener("pointercancel", stopDrag);

    renderer.domElement.addEventListener("wheel", (event) => {
      event.preventDefault();
      camera.getWorldDirection(forwardVector);
      camera.position.addScaledVector(forwardVector, -event.deltaY * 0.08);
      clampCameraPosition();
      flight.manual = true;
      shell.classList.add("is-entered");
    }, { passive: false });

    const movementKeyCodes = new Set([
      "KeyW", "KeyA", "KeyS", "KeyD", "KeyQ", "KeyE", "KeyC",
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space",
      "ShiftLeft", "ShiftRight", "ControlLeft", "ControlRight"
    ]);
    window.addEventListener("keydown", (event) => {
      const target = event.target;
      const isEditing = target instanceof HTMLElement && ["input", "textarea", "select"].includes(target.tagName.toLowerCase());
      if (isEditing || !movementKeyCodes.has(event.code)) return;
      keys.add(event.code);
      flight.manual = true;
      event.preventDefault();
    });
    window.addEventListener("keyup", (event) => {
      if (!movementKeyCodes.has(event.code)) return;
      keys.delete(event.code);
      event.preventDefault();
    });

    function resize() {
      const rect = mount.getBoundingClientRect();
      const width = Math.max(1, Math.floor(rect.width));
      const height = Math.max(1, Math.floor(rect.height));
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(mount);
    resize();

    const animatedMaterials = [baseParticleMaterial, coreMaterial, nucleusMaterial, outerDiskMaterial, distantMaterial];
    let lastTime = performance.now();
    const startTime = lastTime;

    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const time = (now - startTime) / 1000;
      const delta = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      animatedMaterials.forEach((material) => {
        material.uniforms.uTime.value = time;
      });

      if (!flight.manual) {
        flight.targetYaw = Math.sin(time * 0.12) * 0.08;
        flight.targetPitch = overviewPitch + Math.sin(time * 0.1) * 0.018;
      }
      flight.yaw += Math.atan2(Math.sin(flight.targetYaw - flight.yaw), Math.cos(flight.targetYaw - flight.yaw)) * 0.09;
      flight.pitch += (flight.targetPitch - flight.pitch) * 0.09;
      camera.rotation.set(flight.pitch, flight.yaw, 0);

      camera.getWorldDirection(forwardVector).normalize();
      rightVector.crossVectors(forwardVector, verticalVector).normalize();
      flightDirection.set(0, 0, 0);
      if (keys.has("KeyW") || keys.has("ArrowUp")) flightDirection.add(forwardVector);
      if (keys.has("KeyS") || keys.has("ArrowDown")) flightDirection.addScaledVector(forwardVector, -1);
      if (keys.has("KeyD") || keys.has("ArrowRight")) flightDirection.add(rightVector);
      if (keys.has("KeyA") || keys.has("ArrowLeft")) flightDirection.addScaledVector(rightVector, -1);
      if (keys.has("Space") || keys.has("KeyE")) flightDirection.add(verticalVector);
      if (keys.has("ControlLeft") || keys.has("ControlRight") || keys.has("KeyC") || keys.has("KeyQ")) {
        flightDirection.addScaledVector(verticalVector, -1);
      }
      if (flightDirection.lengthSq() > 0) flightDirection.normalize();
      const flightSpeed = keys.has("ShiftLeft") || keys.has("ShiftRight") ? 96 : 34;
      flightVelocity.lerp(flightDirection.multiplyScalar(flightSpeed), 1 - Math.exp(-delta * 8));
      camera.position.addScaledVector(flightVelocity, delta);
      clampCameraPosition();

      galaxyGroup.rotation.y += delta * 0.032;
      galaxyGroup.rotation.x += (galaxyRotationX - galaxyGroup.rotation.x) * 0.016;
      distantStars.cloud.rotation.y -= delta * 0.01;

      agentPoints.forEach((point, index) => {
        const hovered = index === flight.hoveredIndex;
        const pulse = 1 + Math.sin(time * 2.4 + index * 0.72) * 0.06;
        const hoverScale = hovered ? 1.14 : 1;
        point.starMesh.scale.setScalar(point.baseScale * pulse * hoverScale);
        point.glowMesh.scale.setScalar(point.baseGlowScale * (1 + Math.sin(time * 2.8 + index) * 0.05) * hoverScale);
        point.starMaterial.rotation = time * 0.08 + index * 0.12;
        point.starMaterial.opacity = point.star.agent ? (hovered ? 1 : 0.92) : hovered ? 0.82 : 0.58;
        point.glowMaterial.opacity = point.star.agent ? (hovered ? 0.42 : 0.24) : hovered ? 0.2 : 0.1;
        point.pickMesh.scale.setScalar(point.basePickScale * hoverScale);
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
