<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发声台 - AI演讲口才训练营</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --gold: #ffd54f;
  --gold-deep: #ff8f00;
  --red: #ff5252;
  --blue: #1a1a2e;
  --blue-light: #2a2a4e;
  --glass: rgba(20, 20, 40, 0.72);
  --border: rgba(255, 213, 79, 0.22);
}
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: radial-gradient(ellipse at 50% 20%, #2a1d10 0%, #1a1a2e 50%, #0d0d18 100%);
  min-height: 100vh;
  overflow-x: hidden;
  color: #fff;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}
.header {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 18px;
  background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
}
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 4px;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255,213,79,0.4);
}
.logo svg { filter: drop-shadow(0 0 8px rgba(255,213,79,0.6)); }
.subtitle { color: rgba(255,255,255,0.6); font-size: 13px; margin-top: 6px; letter-spacing: 2px; }
.app {
  position: relative;
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr 360px;
  grid-template-rows: 160px 1fr 200px;
  grid-template-areas:
    "wave stats"
    "stage radar"
    "script script";
  gap: 22px;
  padding: 22px;
  max-width: 1500px;
  margin: 0 auto;
  min-height: calc(100vh - 86px);
}
.panel {
  background: var(--glass);
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  padding: 18px;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(12px);
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.7;
}
.panel-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--gold);
  font-size: 13px;
  letter-spacing: 2px;
  margin-bottom: 12px;
  font-weight: 600;
}
.panel-title svg { width: 18px; height: 18px; }
/* 声波区 */
.wave-area { grid-area: wave; }
.wave-wrap {
  position: relative;
  height: 100px;
  border-radius: 14px;
  background: rgba(0,0,0,0.35);
  border: 1px solid rgba(255,213,79,0.15);
  overflow: hidden;
}
#waveCanvas { width: 100%; height: 100%; display: block; }
.wave-grid {
  position: absolute;
  inset: 0;
  background-image: linear-gradient(90deg, rgba(255,213,79,0.06) 1px, transparent 1px);
  background-size: 24px 100%;
  pointer-events: none;
}
/* 舞台区 */
.stage-area { grid-area: stage; padding: 0; min-height: 380px; }
.stage-inner {
  position: relative;
  width: 100%; height: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
  border-radius: 20px;
}
.curtain-left, .curtain-right {
  position: absolute;
  top: 0; bottom: 0;
  width: 120px;
  z-index: 4;
  pointer-events: none;
}
.curtain-left { left: 0; background: linear-gradient(90deg, #5a0a0a, #8a1a1a, #5a0a0a); box-shadow: 8px 0 30px rgba(0,0,0,0.5); }
.curtain-right { right: 0; background: linear-gradient(90deg, #5a0a0a, #8a1a1a, #5a0a0a); box-shadow: -8px 0 30px rgba(0,0,0,0.5); }
.curtain-left::after, .curtain-right::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0, transparent 14px, rgba(0,0,0,0.2) 14px, rgba(0,0,0,0.2) 16px);
}
.curtain-right::after { transform: scaleX(-1); }
.spotlight-beam {
  position: absolute;
  top: -60px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
  height: 420px;
  background: conic-gradient(from 180deg at 50% 0%, transparent 0deg, rgba(255,235,150,0.18) 30deg, rgba(255,235,150,0.32) 60deg, rgba(255,235,150,0.18) 90deg, transparent 120deg);
  filter: blur(10px);
  animation: beamBreathe 3.5s ease-in-out infinite;
  z-index: 2;
  pointer-events: none;
}
@keyframes beamBreathe {
  0%, 100% { opacity: 0.6; transform: translateX(-50%) scaleX(1); }
  50% { opacity: 1; transform: translateX(-50%) scaleX(1.15); }
}
.floor {
  width: 76%;
  height: 200px;
  background: linear-gradient(180deg, #5c4025 0%, #3a2615 100%);
  transform: rotateX(58deg);
  transform-origin: center bottom;
  position: relative;
  z-index: 3;
  box-shadow: 0 0 80px rgba(255,180,60,0.25), inset 0 10px 40px rgba(0,0,0,0.4);
  border-top: 4px solid rgba(255,213,79,0.2);
}
.floor-lines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0, transparent 60px, rgba(255,220,150,0.12) 60px, rgba(255,220,150,0.12) 62px);
}
.mic-stand {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.mic-stand-base {
  width: 70px;
  height: 14px;
  background: radial-gradient(ellipse at center, #555 0%, #222 100%);
  border-radius: 50%;
  box-shadow: 0 6px 12px rgba(0,0,0,0.6);
}
.mic-stand-pole {
  width: 6px;
  height: 90px;
  background: linear-gradient(90deg, #444, #777, #444);
}
.mic-stand-head {
  width: 46px;
  height: 56px;
  background: linear-gradient(135deg, #ffd54f, #ff8f00, #e65100);
  border-radius: 24px 24px 18px 18px;
  margin-bottom: 8px;
  box-shadow: 0 0 35px rgba(255,200,80,0.55);
  position: relative;
}
.mic-stand-head::before {
  content: '';
  position: absolute;
  inset: 8px;
  border: 2px dashed rgba(60,30,0,0.35);
  border-radius: 18px;
}
.mic-stand-head::after {
  content: '';
  position: absolute;
  top: 8px; left: 50%; transform: translateX(-50%);
  width: 28px; height: 6px;
  background: rgba(255,255,255,0.3);
  border-radius: 3px;
}
.stage-hud {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 6;
  display: flex;
  gap: 10px;
}
.hud-badge {
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,213,79,0.25);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  display: flex;
  align-items: center;
  gap: 6px;
}
.hud-badge.recording { color: var(--red); border-color: rgba(255,82,82,0.4); animation: recPulse 1.2s infinite; }
@keyframes recPulse { 50% { box-shadow: 0 0 15px rgba(255,82,82,0.4); } }
.hud-badge span.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
/* 控制按钮 */
.control-bar {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 7;
}
.btn-start {
  background: linear-gradient(135deg, var(--gold-deep), var(--gold));
  color: #1a0f00;
  border: none;
  padding: 14px 44px;
  font-size: 17px;
  border-radius: 40px;
  cursor: pointer;
  font-weight: bold;
  letter-spacing: 4px;
  box-shadow: 0 6px 24px rgba(255,143,0,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
  transition: all 0.25s ease;
}
.btn-start:hover { transform: translateX(-50%) scale(1.06); box-shadow: 0 8px 30px rgba(255,143,0,0.6); }
.btn-start.active {
  background: linear-gradient(135deg, var(--red), #c62828);
  color: #fff;
  animation: pulseRed 1.2s infinite;
}
@keyframes pulseRed { 0%,100%{box-shadow:0 6px 24px rgba(255,82,82,0.4);} 50%{box-shadow:0 8px 38px rgba(255,82,82,0.75);} }
/* 实时统计区 */
.stats-area { grid-area: stats; }
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  height: 100%;
}
.stat-card {
  background: rgba(0,0,0,0.35);
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.08);
  transition: transform 0.2s;
}
.stat-card:hover { transform: translateY(-3px); }
.stat-card .stat-icon { width: 24px; height: 24px; margin: 0 auto 6px; color: var(--gold); }
.stat-card .stat-value { font-size: 26px; font-weight: bold; color: #fff; line-height: 1; }
.stat-card .stat-label { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 6px; letter-spacing: 1px; }
.stat-card.active .stat-value { color: var(--gold); text-shadow: 0 0 12px rgba(255,213,79,0.5); }
/* 雷达区 */
.radar-area { grid-area: radar; }
#radarCanvas { width: 100%; height: 220px; display: block; }
.scores { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.score-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
.score-row span:first-child { width: 36px; color: rgba(255,255,255,0.7); }
.score-bar-bg { flex: 1; height: 7px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; }
.score-bar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-deep)); border-radius: 4px; transition: width 0.6s ease; box-shadow: 0 0 8px rgba(255,143,0,0.35); position: relative; }
.score-bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); animation: barShimmer 2s infinite; }
@keyframes barShimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
.score-row span:last-child { width: 28px; text-align: right; color: var(--gold); font-weight: bold; }
/* AI建议 */
.ai-tip {
  margin-top: 14px;
  background: rgba(255,213,79,0.08);
  border-left: 3px solid var(--gold);
  border-radius: 0 10px 10px 0;
  padding: 10px 12px;
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  line-height: 1.6;
}
.ai-tip strong { color: var(--gold); }
/* 提词器 */
.script-area { grid-area: script; }
.script-frame {
  position: relative;
  height: 100%;
  border-radius: 14px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,213,79,0.12);
  overflow: hidden;
}
.script-frame::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
  z-index: 5;
  pointer-events: none;
}
.script-frame::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40px;
  background: linear-gradient(0deg, rgba(0,0,0,0.8), transparent);
  z-index: 5;
  pointer-events: none;
}
.script-scroll { height: 100%; overflow: hidden; position: relative; }
.script-content { transition: transform 0.5s cubic-bezier(0.25,0.46,0.45,0.94); padding: 80px 20px; }
.script-para {
  padding: 14px 20px;
  margin: 8px 0;
  color: rgba(255,255,255,0.35);
  font-size: 16px;
  line-height: 1.9;
  border-left: 3px solid transparent;
  border-radius: 0 10px 10px 0;
  transition: all 0.4s ease;
}
.script-para.active {
  color: #fff8e1;
  border-left-color: var(--gold);
  background: rgba(255,213,79,0.12);
  font-size: 21px;
  text-shadow: 0 0 20px rgba(255,213,79,0.25);
  transform: scale(1.02);
}
.speed-tip {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(211,47,47,0.92);
  color: #fff;
  padding: 8px 18px;
  border-radius: 24px;
  font-size: 13px;
  opacity: 0;
  transform: translateY(-12px);
  transition: all 0.35s ease;
  z-index: 10;
  box-shadow: 0 4px 16px rgba(211,47,47,0.4);
  display: flex;
  align-items: center;
  gap: 8px;
}
.speed-tip.show { opacity: 1; transform: translateY(0); }
.speed-tip svg { width: 16px; height: 16px; }
/* 响应式 */
@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 140px 360px 1fr 420px 200px; grid-template-areas: "wave" "stage" "radar" "stats" "script"; }
  .stage-area { min-height: 360px; }
  .btn-start:hover { transform: translateX(-50%) scale(1); }
  .btn-start.active:hover { transform: translateX(-50%) scale(1); }
}
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    发声台
  </div>
  <div class="subtitle">AI演讲口才训练营 · 让每一次开口都有舞台</div>
</div>

<div class="app">
  <div class="panel wave-area">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      实时声波
    </div>
    <div class="wave-wrap">
      <div class="wave-grid"></div>
      <canvas id="waveCanvas"></canvas>
    </div>
  </div>

  <div class="panel stats-area">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      实时数据
    </div>
    <div class="stats-grid">
      <div class="stat-card" id="statTime">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></div>
        <div class="stat-value" id="timeVal">00:00</div>
        <div class="stat-label">演讲时长</div>
      </div>
      <div class="stat-card" id="statWords">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></div>
        <div class="stat-value" id="wordsVal">0</div>
        <div class="stat-label">预估字数</div>
      </div>
      <div class="stat-card" id="statScore">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.48 12.35c-1.57-4.08-7.16-4.29-8.35-1.26-1.27 3.3.46 7.15 4.85 8.08 2.57.56 5.43-.04 7.08-1.85 1.36-1.49 1.88-3.63 1.33-5.55-.51-1.75-1.96-3.09-3.91-3.42zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg></div>
        <div class="stat-value" id="scoreVal">--</div>
        <div class="stat-label">综合评分</div>
      </div>
      <div class="stat-card" id="statStatus">
        <div class="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg></div>
        <div class="stat-value" id="statusVal">待机</div>
        <div class="stat-label">训练状态</div>
      </div>
    </div>
  </div>

  <div class="panel stage-area">
    <div class="stage-inner">
      <div class="curtain-left"></div>
      <div class="curtain-right"></div>
      <div class="spotlight-beam"></div>
      <div class="stage-hud">
        <div class="hud-badge" id="recBadge"><span class="dot"></span> REC</div>
        <div class="hud-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> 舞台模式</div>
      </div>
      <div class="floor"><div class="floor-lines"></div></div>
      <div class="mic-stand">
        <div class="mic-stand-head"></div>
        <div class="mic-stand-pole"></div>
        <div class="mic-stand-base"></div>
      </div>
      <div class="control-bar">
        <button class="btn-start" id="btnStart">开始演讲</button>
      </div>
    </div>
  </div>

  <div class="panel radar-area">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      五维评分
    </div>
    <canvas id="radarCanvas"></canvas>
    <div class="scores">
      <div class="score-row"><span>音量</span><div class="score-bar-bg"><div class="score-bar" id="s0" style="width:50%"></div></div><span id="v0">50</span></div>
      <div class="score-row"><span>语速</span><div class="score-bar-bg"><div class="score-bar" id="s1" style="width:60%"></div></div><span id="v1">60</span></div>
      <div class="score-row"><span>停顿</span><div class="score-bar-bg"><div class="score-bar" id="s2" style="width:55%"></div></div><span id="v2">55</span></div>
      <div class="score-row"><span>情感</span><div class="score-bar-bg"><div class="score-bar" id="s3" style="width:65%"></div></div><span id="v3">65</span></div>
      <div class="score-row"><span>清晰度</span><div class="score-bar-bg"><div class="score-bar" id="s4" style="width:70%"></div></div><span id="v4">70</span></div>
    </div>
    <div class="ai-tip" id="aiTip">
      <strong>AI 教练建议：</strong>点击下方「开始演讲」，系统将实时分析你的音量、语速、停顿、情感与清晰度，并在偏离最优区间时给出即时提示。
    </div>
  </div>

  <div class="panel script-area">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      智能提词器
    </div>
    <div class="script-frame">
      <div class="speed-tip" id="speedTip">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 6 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <span>语速过快，请放慢</span>
      </div>
      <div class="script-scroll">
        <div class="script-content" id="scriptContent"></div>
      </div>
    </div>
  </div>
</div>

<script>
const paragraphs = [
  "尊敬的各位来宾，大家好。今天我非常荣幸站在这里，与大家分享一个重要的话题。",
  "在这个快速变化的时代，沟通能力已经成为每个人不可或缺的核心竞争力。",
  "一场成功的演讲，不仅需要清晰的表达，更需要打动人心的情感传递。",
  "让我们从眼神交流开始，建立与听众之间真诚而有力的连接。",
  "记住，每一次开口，都是一次影响世界的机会。谢谢大家！"
];
const sc = document.getElementById('scriptContent');
paragraphs.forEach((p, i) => {
  const d = document.createElement('div');
  d.className = 'script-para';
  d.textContent = p;
  d.dataset.idx = i;
  sc.appendChild(d);
});

let active = false, curPara = 0, paraTimer = null, radarTimer = null, waveAnim = null, timerInterval = null;
let startTime = 0, elapsed = 0, totalWords = 0;

const waveCanvas = document.getElementById('waveCanvas');
const wctx = waveCanvas.getContext('2d');
function resizeWave() { waveCanvas.width = waveCanvas.offsetWidth * 2; waveCanvas.height = waveCanvas.offsetHeight * 2; }
resizeWave();
window.addEventListener('resize', () => { resizeWave(); resizeRadar(); });

let waveData = new Array(100).fill(0);
let phase = 0;
function drawWave() {
  const w = waveCanvas.width, h = waveCanvas.height;
  wctx.clearRect(0, 0, w, h);
  wctx.lineWidth = 3;

  // 低频层
  wctx.beginPath();
  wctx.strokeStyle = 'rgba(255,213,79,0.25)';
  for (let i = 0; i < waveData.length; i++) {
    const x = (i / (waveData.length - 1)) * w;
    const base = active ? waveData[i] * 0.6 : Math.sin(i * 0.15 + phase) * 0.15;
    const y = h/2 + base * h * 0.45;
    if (i === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
  }
  wctx.stroke();

  // 主波形
  wctx.beginPath();
  wctx.strokeStyle = '#ffd54f';
  wctx.shadowBlur = active ? 20 : 10;
  wctx.shadowColor = 'rgba(255,213,79,0.5)';
  for (let i = 0; i < waveData.length; i++) {
    const x = (i / (waveData.length - 1)) * w;
    const base = active ? waveData[i] : Math.sin(i * 0.25 + phase) * 0.08;
    const y = h/2 + base * h * 0.4;
    if (i === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
  }
  wctx.stroke();
  wctx.shadowBlur = 0;

  // 填充区域
  wctx.lineTo(w, h/2);
  wctx.lineTo(0, h/2);
  wctx.closePath();
  const grad = wctx.createLinearGradient(0, h/2, 0, h);
  grad.addColorStop(0, 'rgba(255,213,79,0.18)');
  grad.addColorStop(1, 'rgba(255,213,79,0)');
  wctx.fillStyle = grad;
  wctx.fill();
}

function updateWave() {
  phase += 0.04;
  if (active) {
    for (let i = 0; i < waveData.length; i++) {
      waveData[i] = waveData[i] * 0.72 + (Math.random() * 2 - 1) * 0.35 + Math.sin(Date.now() * 0.006 + i * 0.18) * 0.35;
      waveData[i] = Math.max(-1, Math.min(1, waveData[i]));
    }
  }
  drawWave();
  waveAnim = requestAnimationFrame(updateWave);
}
updateWave();

const radarCanvas = document.getElementById('radarCanvas');
const rctx = radarCanvas.getContext('2d');
function resizeRadar() { radarCanvas.width = radarCanvas.offsetWidth * 2; radarCanvas.height = radarCanvas.offsetHeight * 2; }
resizeRadar();
let scores = [50, 60, 55, 65, 70];
const labels = ['音量', '语速', '停顿', '情感', '清晰度'];
let targetScores = scores.slice();
let currentScores = scores.slice();

function drawRadar() {
  const w = radarCanvas.width, h = radarCanvas.height;
  const dpr = 2;
  rctx.clearRect(0, 0, w, h);
  const cx = w/2, cy = h/2 + 10;
  const R = Math.min(w, h) * 0.34;
  const n = 5;

  // 网格
  for (let layer = 1; layer <= 4; layer++) {
    rctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a = (i / n) * Math.PI * 2 - Math.PI/2;
      const r = R * layer / 4;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
    }
    rctx.strokeStyle = layer === 4 ? 'rgba(255,213,79,0.35)' : 'rgba(255,235,150,0.12)';
    rctx.lineWidth = layer === 4 ? 2 : 1;
    rctx.stroke();
  }
  // 轴线
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI/2;
    rctx.beginPath();
    rctx.moveTo(cx, cy);
    rctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    rctx.strokeStyle = 'rgba(255,235,150,0.12)';
    rctx.lineWidth = 1;
    rctx.stroke();
  }
  // 数据区域
  rctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI/2;
    const r = R * currentScores[i % n] / 100;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    if (i === 0) rctx.moveTo(x, y); else rctx.lineTo(x, y);
  }
  rctx.closePath();
  const grad = rctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  grad.addColorStop(0, 'rgba(255,143,0,0.25)');
  grad.addColorStop(1, 'rgba(255,213,79,0.05)');
  rctx.fillStyle = grad;
  rctx.fill();
  rctx.strokeStyle = '#ff8f00';
  rctx.lineWidth = 3;
  rctx.shadowBlur = 15;
  rctx.shadowColor = 'rgba(255,143,0,0.5)';
  rctx.stroke();
  rctx.shadowBlur = 0;

  // 数据点
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI/2;
    const r = R * currentScores[i] / 100;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    rctx.beginPath();
    rctx.arc(x, y, 6, 0, Math.PI * 2);
    rctx.fillStyle = '#fff8e1';
    rctx.fill();
    rctx.strokeStyle = '#ff8f00';
    rctx.lineWidth = 2;
    rctx.stroke();
  }
  // 标签
  rctx.fillStyle = 'rgba(255,255,255,0.8)';
  rctx.font = 'bold ' + (13 * dpr) + 'px Microsoft YaHei';
  rctx.textAlign = 'center';
  rctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI/2;
    const x = cx + Math.cos(a) * (R + 28);
    const y = cy + Math.sin(a) * (R + 28);
    rctx.fillText(labels[i], x, y);
  }
}
drawRadar();

function interpolateScores() {
  for (let i = 0; i < 5; i++) {
    const diff = targetScores[i] - currentScores[i];
    if (Math.abs(diff) > 0.5) currentScores[i] += diff * 0.15;
    else currentScores[i] = targetScores[i];
  }
  drawRadar();
  requestAnimationFrame(interpolateScores);
}
interpolateScores();

function updateScores() {
  for (let i = 0; i < 5; i++) {
    targetScores[i] = Math.max(20, Math.min(98, targetScores[i] + (Math.random() * 10 - 5)));
    document.getElementById('s' + i).style.width = targetScores[i] + '%';
    document.getElementById('v' + i).textContent = Math.round(targetScores[i]);
  }
  // 综合评分
  const avg = targetScores.reduce((a,b)=>a+b,0)/5;
  if (active) document.getElementById('scoreVal').textContent = Math.round(avg);
  // AI建议
  updateAITip(avg, targetScores[1]);
  // 语速提示
  if (targetScores[1] > 85) showTip('语速过快，请放慢');
  else if (targetScores[1] < 35) showTip('语速过慢，请加快');
}

function updateAITip(avg, speed) {
  const tip = document.getElementById('aiTip');
  let msg = '';
  if (avg >= 85) msg = '整体表现优秀，情感饱满、表达清晰，建议保持当前节奏，适当增加停顿以突出重点。';
  else if (avg >= 70) msg = '整体表现良好，可在语速控制与情感起伏上继续打磨，让重点更有张力。';
  else if (speed > 85) msg = '当前语速偏快，容易导致听众跟不上节奏，建议深呼吸，在句间多留半秒停顿。';
  else if (speed < 40) msg = '当前语速偏慢，容易让听众注意力分散，可在关键信息处适当加快节奏。';
  else msg = '综合评分仍有提升空间，建议针对音量稳定性与停顿节奏进行专项练习。';
  tip.innerHTML = '<strong>AI 教练建议：</strong>' + msg;
}

function showTip(msg) {
  const t = document.getElementById('speedTip');
  t.querySelector('span').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60).toString().padStart(2, '0');
  const s = Math.floor(seconds % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function updateTimer() {
  elapsed = (Date.now() - startTime) / 1000;
  document.getElementById('timeVal').textContent = formatTime(elapsed);
  totalWords = Math.round(elapsed * 2.5);
  document.getElementById('wordsVal').textContent = totalWords;
}

const btn = document.getElementById('btnStart');
const recBadge = document.getElementById('recBadge');
btn.addEventListener('click', () => {
  active = !active;
  btn.textContent = active ? '结束演讲' : '开始演讲';
  btn.classList.toggle('active', active);
  recBadge.classList.toggle('recording', active);
  document.getElementById('statusVal').textContent = active ? '训练中' : '待机';
  document.querySelectorAll('.stat-card').forEach(c => c.classList.toggle('active', active));
  if (active) {
    curPara = 0;
    startTime = Date.now();
    elapsed = 0;
    highlightPara();
    paraTimer = setInterval(() => {
      curPara = (curPara + 1) % paragraphs.length;
      highlightPara();
    }, 3000);
    radarTimer = setInterval(updateScores, 1500);
    timerInterval = setInterval(updateTimer, 1000);
  } else {
    clearInterval(paraTimer);
    clearInterval(radarTimer);
    clearInterval(timerInterval);
    document.querySelectorAll('.script-para').forEach(p => p.classList.remove('active'));
    sc.style.transform = 'translateY(0)';
    document.getElementById('scoreVal').textContent = '--';
    document.getElementById('statusVal').textContent = '待机';
  }
});

function highlightPara() {
  document.querySelectorAll('.script-para').forEach((p, i) => {
    p.classList.toggle('active', i === curPara);
  });
  const activeP = document.querySelector('.script-para.active');
  if (activeP) {
    const container = document.querySelector('.script-scroll');
    const targetOffset = activeP.offsetTop - container.clientHeight/2 + activeP.clientHeight/2;
    sc.style.transform = 'translateY(-' + targetOffset + 'px)';
  }
}
</script>
</body>
</html>
