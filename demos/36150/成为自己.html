      <div class="input-block" id="inputBlock">
        <input class="answer" id="answerInput" autocomplete="off" placeholder="写下此刻浮现的内容" />
        <canvas class="draw-pad" id="drawPad" aria-label="也可以在这里画图案"></canvas>
        <div class="draw-note">可以写字，也可以画一笔</div>
        <div class="dialogue-row">
          <button class="button small-button clear-button" id="clearDrawButton" type="button">清除</button>
          <button class="button small-button" id="nextButton">继续</button>
        </div>
        <div class="observe-sentence" id="observeSentence" aria-live="polite"></div>

  <section class="page" id="page3" aria-label="生长观察">

        </div>

          <dt>模式：</dt>
          <dd id="patternText">你的回答中多次出现“探索 / 感觉 / 变化”</dd>

    <div class="signal-text small" id="signalMark"><p>这是你此刻留下的痕迹。</p></div>
    <div class="signal-text small" id="signalFuture"><p>未来部分，由你继续书写。</p></div>
    <div class="signal-text" id="signalFinal"><p>成为自己</p></div>
    <div class="signal-bottom" id="signalQuestion">取消了考试！我们该如何评定或者选拔人才？</div>

<script>
  const pages = [
    document.getElementById('page1'),
    document.getElementById('page2'),
    document.getElementById('page3'),
    document.getElementById('page4')
  ];

  const questions = [
    '你们学校有没有一条规定，你一直想修改？你会怎么改？',
    '给你一台手机，24小时无限使用，你最想拿它干什么？',
    '你欠了六个亿，接下来你打算怎么办？'
  ];

  const answers = [];
  const drawings = [];
  const traits = { explore: 1, express: 1, action: 1, think: 1 };
  let pageIndex = 0;
  let qIndex = 0;
  let hasDrawing = false;
  let drawing = false;
  let treeStarted = false;
  let audioStarted = false;
  let audioMuted = false;
  let audioContext;
  let ambientGain;
  let sfxGain;
  let hoverBreathGain;
  let hoverBreathSource;
  let pageWaveGain;
  let pageWaveSource;
  let pageWaveFilter;
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  function goPage(index) {
    if (pageIndex === 2 && index !== 2) stopPageWave();
    pages[pageIndex].classList.remove('active');
    pageIndex = index;
    pages[pageIndex].classList.add('active');
    if (index === 1) setTimeout(showQuestion, 850);
    if (index === 2) setTimeout(startPageWave, 600);
    if (index === 3 && !treeStarted) {
      treeStarted = true;
      startAmbient();
      setTimeout(startLifeSignal, 900);
    }
  }

  async function typeLine(el, text, speed = 78) {
    el.classList.remove('done');
    el.textContent = '';
    for (let i = 0; i < text.length; i++) {
      el.textContent += text[i];
      playTypeTick(text[i]);
      await wait(speed + Math.random() * 32);
    }
    el.classList.add('done');
  }

  async function showQuestion() {
    const inputBlock = document.getElementById('inputBlock');
    const input = document.getElementById('answerInput');
    const sentence = document.getElementById('observeSentence');
    document.getElementById('qIndex').textContent = `Q${qIndex + 1} / 03`;
    inputBlock.classList.remove('show');
    sentence.classList.remove('show');
    sentence.textContent = '';
    input.value = '';
    clearDrawing();
    await typeLine(document.getElementById('questionText'), questions[qIndex]);
    await wait(250);
    inputBlock.classList.add('show');
    input.focus();
  }

  function collectTraits(text) {
    const value = text.trim();
    if (/探索|发现|试|好奇|自由|如果|可能|未知|远方|风|海|天空|新|想/.test(value)) traits.explore += 2;
    if (/感觉|声音|颜色|蓝|画|写|唱|表达|创造|音乐|像|梦|诗|安静|温柔/.test(value)) traits.express += 2;
    if (/做|跑|走|去|跳|创造|制作|练|玩|开始|行动|动手|工作/.test(value)) traits.action += 2;
    if (/思考|为什么|时间|记忆|意义|问题|知道|理解|选择|忘记/.test(value)) traits.think += 2;
    if (value.length > 14) traits.think += 0.8;
    if (value.length > 0) traits.express += 0.4;
  }

  function collectDrawingTraits(didDraw) {
    if (!didDraw) return;
    traits.express += 1.6;
    traits.explore += 0.9;
    traits.action += 0.7;
  }

  function observeText(text) {
    const value = text.trim();
    if (!value && hasDrawing) return '这里出现了一幅图案。它也被记录。';
    if (!value) return '这里出现了一次停顿。停顿也被记录。';
    if (/感觉|声音|颜色|蓝|像|安静|温柔/.test(value)) return '你在描述中使用了感受词。';
    if (/探索|发现|试|好奇|自由|可能|未知|如果/.test(value)) return '你的表达中出现了探索倾向。';
    if (/做|时候|忘记|时间|正在|一直|慢慢|看|画|写|听/.test(value)) return '你更关注过程而不是结果。';
    return '我没有判断它，只记录它出现的方式。';
  }

  async function nextQuestion() {
    const input = document.getElementById('answerInput');
    const value = input.value.trim();
    answers[qIndex] = value;
    drawings[qIndex] = hasDrawing;
    collectTraits(value);
    collectDrawingTraits(hasDrawing);
    const sentence = document.getElementById('observeSentence');
    sentence.textContent = observeText(value);
    sentence.classList.add('show');
    await wait(1350);
    qIndex++;
    if (qIndex < questions.length) {
      showQuestion();
    } else {
      buildObservation();
      goPage(2);
    }
  }

  function buildObservation() {
    const text = answers.join(' ');
    const drew = drawings.some(Boolean);
    const words = [];
    if (/探索|发现|试|好奇|自由|可能|未知|如果|新/.test(text)) words.push('探索');
    if (/感觉|声音|颜色|蓝|像|安静|温柔|音乐/.test(text)) words.push('感觉');
    if (/变化|慢慢|成为|生长|走|去|开始|风|海/.test(text)) words.push('变化');
    if (/思考|为什么|意义|问题|选择|理解|时间/.test(text)) words.push('思考');
    if (drew) words.push('图案');
    ['探索', '感觉', '变化'].forEach(word => {
      if (words.length < 3 && !words.includes(word)) words.push(word);
    });
    const processLike = /过程|做|忘记|时间|时候|正在|一直|慢慢|看|画|写|听/.test(text);
    document.getElementById('observationText').textContent = processLike
      ? '你更倾向描述过程，而不是结果'
      : (drew ? '你用图案留下了一种正在生成的表达' : '你没有急着给出结论，而是在靠近一种感受');
    document.getElementById('patternText').textContent = `你的回答中多次出现“${words.slice(0, 3).join(' / ')}”`;
  }

  document.getElementById('startButton').addEventListener('click', () => {
    ensureAudioContext();
    stopHoverBreath();
    goPage(1);
  });
  document.getElementById('startButton').addEventListener('pointerenter', startHoverBreath);
  document.getElementById('startButton').addEventListener('pointerleave', stopHoverBreath);
  document.getElementById('startButton').addEventListener('focus', startHoverBreath);
  document.getElementById('startButton').addEventListener('blur', stopHoverBreath);
  document.getElementById('nextButton').addEventListener('click', nextQuestion);
  document.getElementById('clearDrawButton').addEventListener('click', clearDrawing);
  document.getElementById('treeButton').addEventListener('click', () => goPage(3));
  document.getElementById('answerInput').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      nextQuestion();
    }
  });

  function setupDrawingPad() {
    const canvas = document.getElementById('drawPad');
    const ctx = canvas.getContext('2d');
    const resize = () => {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      clearDrawing();
    };
    const point = event => {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    };
    canvas.addEventListener('pointerdown', event => {
      drawing = true;
      hasDrawing = true;
      canvas.setPointerCapture(event.pointerId);
      const p = point(event);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drawing) return;
      const p = point(event);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = 'rgba(184,231,195,.82)';
      ctx.lineWidth = 1.6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(184,231,195,.45)';
      ctx.shadowBlur = 10;
      ctx.stroke();
    });
    const end = () => { drawing = false; };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    window.addEventListener('resize', resize);
    setTimeout(resize, 300);
  }

  function clearDrawing() {
    const canvas = document.getElementById('drawPad');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawing = false;
    drawing = false;
  }

  setupDrawingPad();

  document.getElementById('soundToggle').addEventListener('click', () => {
    if (!ambientGain) return;
    audioMuted = !audioMuted;
    const now = audioContext.currentTime;
    ambientGain.gain.cancelScheduledValues(now);
    ambientGain.gain.setTargetAtTime(audioMuted ? 0 : 0.15, now, 0.8);
    document.getElementById('soundToggle').textContent = audioMuted ? '开启' : '静音';
    document.getElementById('soundToggle').setAttribute('aria-label', audioMuted ? '开启环境音' : '静音环境音');
  });

  function ensureAudioContext() {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return null;
    if (!audioContext) audioContext = new AudioCtor();
    if (audioContext.state === 'suspended') audioContext.resume();
    if (!sfxGain) {
      sfxGain = audioContext.createGain();
      sfxGain.gain.value = 0.55;
      sfxGain.connect(audioContext.destination);
    }
    return audioContext;
  }

  function startHoverBreath() {
    const context = ensureAudioContext();
    if (!context || hoverBreathGain) return;
    hoverBreathSource = createNoiseSource(context, 2.5);
    const filter = context.createBiquadFilter();
    const lfo = context.createOscillator();
    const lfoGain = context.createGain();
    hoverBreathGain = context.createGain();
    filter.type = 'lowpass';
    filter.frequency.value = 430;
    lfo.type = 'sine';
    lfo.frequency.value = 0.22;
    lfoGain.gain.value = 0.032;
    hoverBreathGain.gain.value = 0.012;
    lfo.connect(lfoGain);
    lfoGain.connect(hoverBreathGain.gain);
    hoverBreathSource.connect(filter);
    filter.connect(hoverBreathGain);
    hoverBreathGain.connect(sfxGain);
    hoverBreathSource.start();
    lfo.start();
    hoverBreathGain._lfo = lfo;
    hoverBreathGain.gain.setTargetAtTime(0.055, context.currentTime, 0.45);
  }

  function stopHoverBreath() {
    if (!audioContext || !hoverBreathGain) return;
    const gain = hoverBreathGain;
    const source = hoverBreathSource;
    const lfo = hoverBreathGain._lfo;
    gain.gain.cancelScheduledValues(audioContext.currentTime);
    gain.gain.setTargetAtTime(0, audioContext.currentTime, 0.35);
    setTimeout(() => {
      try { if (source) source.stop(); } catch (e) {}
      try { if (lfo) lfo.stop(); } catch (e) {}
      try { gain.disconnect(); } catch (e) {}
    }, 900);
    hoverBreathGain = null;
    hoverBreathSource = null;
  }

  function playTypeTick(char) {
    if (pageIndex !== 1 || !audioContext || !sfxGain || !char.trim()) return;
    const length = Math.floor(audioContext.sampleRate * 0.026);
    const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < length; i++) {
      const t = i / length;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6);
    }
    const source = audioContext.createBufferSource();
    const filter = audioContext.createBiquadFilter();
    const gain = audioContext.createGain();
    filter.type = 'bandpass';
    filter.frequency.value = 900 + Math.random() * 700;
    filter.Q.value = 0.9;
    gain.gain.value = 0.018;
    source.buffer = buffer;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(sfxGain);
    source.start();
  }

  function startPageWave() {
    const context = ensureAudioContext();
    if (!context || pageWaveGain) return;
    pageWaveSource = createWaveSource(context, 5);
    pageWaveFilter = context.createBiquadFilter();
    pageWaveGain = context.createGain();
    const swell = context.createOscillator();
    const swellGain = context.createGain();
    pageWaveFilter.type = 'lowpass';
    pageWaveFilter.frequency.value = 620;
    pageWaveFilter.Q.value = 0.42;
    pageWaveGain.gain.value = 0;
    swell.type = 'sine';
    swell.frequency.value = 0.115;
    swellGain.gain.value = 0.045;
    swell.connect(swellGain);
    swellGain.connect(pageWaveGain.gain);
    pageWaveSource.connect(pageWaveFilter);
    pageWaveFilter.connect(pageWaveGain);
    pageWaveGain.connect(sfxGain);
    pageWaveSource.start();
    swell.start();
    pageWaveGain._swell = swell;
    pageWaveGain.gain.setTargetAtTime(0.07, context.currentTime, 1.8);
  }

  function stopPageWave() {
    if (!audioContext || !pageWaveGain) return;
    const gain = pageWaveGain;
    const source = pageWaveSource;
    const swell = pageWaveGain._swell;
    gain.gain.cancelScheduledValues(audioContext.currentTime);
    gain.gain.setTargetAtTime(0, audioContext.currentTime, 0.9);
    setTimeout(() => {
      try { if (source) source.stop(); } catch (e) {}
      try { if (swell) swell.stop(); } catch (e) {}
      try { gain.disconnect(); } catch (e) {}
    }, 1500);
    pageWaveGain = null;
    pageWaveSource = null;
    pageWaveFilter = null;
  }

  function startAmbient() {
    if (audioStarted) {
      if (audioContext && audioContext.state === 'suspended') audioContext.resume();
      return;
    }
    audioStarted = true;

    if (!ensureAudioContext()) return;

    const master = audioContext.createGain();
    ambientGain = audioContext.createGain();
    ambientGain.gain.value = 0;
    master.gain.value = 0.9;
    ambientGain.connect(master);
    master.connect(audioContext.destination);

    const convolver = audioContext.createConvolver();
    convolver.buffer = createReverbImpulse(audioContext, 3.8, 1.7);
    const reverbGain = audioContext.createGain();
    reverbGain.gain.value = 0.32;
    convolver.connect(reverbGain);
    reverbGain.connect(ambientGain);

    const waveSource = createWaveSource(audioContext, 6);
    const waveLow = audioContext.createBiquadFilter();
    const waveBody = audioContext.createBiquadFilter();
    const waveGain = audioContext.createGain();
    const waveSwell = audioContext.createOscillator();
    const waveSwellGain = audioContext.createGain();
    waveLow.type = 'lowpass';
    waveLow.frequency.value = 720;
    waveLow.Q.value = 0.5;
    waveBody.type = 'bandpass';
    waveBody.frequency.value = 180;
    waveBody.Q.value = 0.72;
    waveGain.gain.value = 0.18;
    waveSwell.type = 'sine';
    waveSwell.frequency.value = 0.09;
    waveSwellGain.gain.value = 0.13;
    waveSwell.connect(waveSwellGain);
    waveSwellGain.connect(waveGain.gain);
    waveSource.connect(waveLow);
    waveLow.connect(waveBody);
    waveBody.connect(waveGain);
    waveGain.connect(ambientGain);
    waveGain.connect(convolver);
    waveSource.start();
    waveSwell.start();

    const foamSource = createNoiseSource(audioContext, 5);
    const foamFilter = audioContext.createBiquadFilter();
    const foamGain = audioContext.createGain();
    foamFilter.type = 'highpass';
    foamFilter.frequency.value = 1250;
    foamGain.gain.value = 0.026;
    foamSource.connect(foamFilter);
    foamFilter.connect(foamGain);
    foamGain.connect(convolver);
    foamSource.start();

    ambientGain.gain.setTargetAtTime(0.15, audioContext.currentTime + 0.15, 2.2);
    if (audioContext.state === 'suspended') audioContext.resume();
  }

  function createNoiseSource(context, seconds) {
    const length = context.sampleRate * seconds;
    const buffer = context.createBuffer(1, length, context.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < length; i++) {
      const white = Math.random() * 2 - 1;
      last = last * 0.985 + white * 0.015;
      data[i] = last;
    }
    const source = context.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    return source;
  }

  function createWaveSource(context, seconds) {
    const length = context.sampleRate * seconds;
    const buffer = context.createBuffer(1, length, context.sampleRate);
    const data = buffer.getChannelData(0);
    let low = 0;
    let mid = 0;
    for (let i = 0; i < length; i++) {
      const t = i / context.sampleRate;
      const white = Math.random() * 2 - 1;
      low = low * 0.992 + white * 0.008;
      mid = mid * 0.94 + white * 0.06;
      const swell = 0.55 + 0.45 * Math.sin(t * Math.PI * 2 * 0.18 + Math.sin(t * 0.21));
      const foam = (Math.random() * 2 - 1) * 0.055 * Math.pow(swell, 2.2);
      data[i] = (low * 1.2 + mid * 0.28 + foam) * (0.45 + swell * 0.7);
    }
    const source = context.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    return source;
  }

  function createReverbImpulse(context, seconds, decay) {
    const length = context.sampleRate * seconds;
    const impulse = context.createBuffer(2, length, context.sampleRate);
    for (let channel = 0; channel < 2; channel++) {
      const data = impulse.getChannelData(channel);
      for (let i = 0; i < length; i++) {
        const t = i / length;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * 0.35;
      }
    }
    return impulse;
  }

  async function startLifeSignal() {
    const canvas = document.getElementById('signalCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const duration = 6000;
    let w = 0;
    let h = 0;
    let points = [];
    let startedAt = 0;

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildSignal();
    }

    function signalRandom(seed) {
      const answerSeed = answers.join('').length * 19.31 + traits.explore * 5.1 + traits.think * 7.7;
      const x = Math.sin(seed * 921.17 + answerSeed) * 10000;
      return x - Math.floor(x);
    }

    function buildSignal() {
      points = [];
      const startX = w * 0.12;
      const endX = w * 0.88;
      const baseY = h * 0.52;
      const amp = Math.min(h * 0.105, 72);
      let memory = 0;
      let pauseDrift = 0;
      const total = 260;
      for (let i = 0; i < total; i++) {
        const t = i / (total - 1);
        const x = startX + (endX - startX) * t;
        const breath = Math.sin(t * Math.PI * 5.1 + signalRandom(2) * 2) * amp * 0.34;
        const slow = Math.sin(t * Math.PI * 1.6 + signalRandom(5) * 3) * amp * 0.26;
        const micro = (signalRandom(i + 20) - 0.5) * amp * 0.34;
        memory = memory * 0.88 + micro * 0.12;
        if (t > 0.32 && t < 0.42) pauseDrift *= 0.9;
        else if (t > 0.62 && t < 0.70) pauseDrift *= 0.86;
        else pauseDrift = pauseDrift * 0.94 + (signalRandom(i + 80) - 0.5) * amp * 0.035;
        const y = baseY + breath + slow + memory + pauseDrift;
        points.push({ x, y });
      }
    }

    function show(id) {
      document.getElementById(id).classList.add('show');
    }

    function hide(id) {
      document.getElementById(id).classList.remove('show');
    }

    show('signalIntro');
    await wait(1850);
    hide('signalIntro');
    await wait(850);
    startedAt = performance.now();
    requestAnimationFrame(draw);

    let traceShown = false;
    let futureShown = false;
    let finalShown = false;
    let futureScheduled = false;

    function draw(now) {
      const elapsed = now - startedAt;
      const progress = Math.min(1, elapsed / duration);
      const pulse = 0.72 + Math.sin(now / 1200) * 0.18;
      ctx.clearRect(0, 0, w, h);

      const glow = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.min(w, h) * 0.38);
      glow.addColorStop(0, 'rgba(184,231,195,0.055)');
      glow.addColorStop(1, 'rgba(184,231,195,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      const drawCount = Math.max(2, Math.floor(points.length * progress));
      drawCurve(points.slice(0, Math.min(drawCount, Math.floor(points.length * 0.8))), false, pulse);
      if (progress > 0.8) {
        drawCurve(points.slice(Math.floor(points.length * 0.8), drawCount), true, pulse);
      }

      if (progress >= 0.8 && !traceShown) {
        traceShown = true;
        show('signalTrace');
        setTimeout(() => {
          hide('signalTrace');
          setTimeout(() => {
            show('signalMark');
          }, 550);
        }, 4200);
      }

      if (progress >= 1 && !futureScheduled) {
        futureScheduled = true;
        setTimeout(() => {
          hide('signalMark');
          setTimeout(() => {
            futureShown = true;
            show('signalFuture');
            setTimeout(() => {
              hide('signalFuture');
              setTimeout(() => {
                show('signalFinal');
                finalShown = true;
                setTimeout(() => {
                  show('signalQuestion');
                }, 2600);
              }, 700);
            }, 3400);
          }, 700);
        }, 6200);
      }

      if (progress < 1 || !finalShown) {
        requestAnimationFrame(draw);
      } else {
        requestAnimationFrame(hold);
      }
    }

    function drawCurve(segment, dashed, pulse) {
      if (segment.length < 2) return;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.beginPath();
      ctx.moveTo(segment[0].x, segment[0].y);
      for (let i = 1; i < segment.length - 1; i++) {
        const midX = (segment[i].x + segment[i + 1].x) / 2;
        const midY = (segment[i].y + segment[i + 1].y) / 2;
        ctx.quadraticCurveTo(segment[i].x, segment[i].y, midX, midY);
      }
      if (dashed) ctx.setLineDash([8, 10]);
      ctx.strokeStyle = `rgba(184,231,195,${0.62 + pulse * 0.22})`;
      ctx.lineWidth = 1.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(184,231,195,0.64)';
      ctx.shadowBlur = 14;
      ctx.stroke();
      ctx.restore();
    }

    function hold(now) {
      const pulse = 0.72 + Math.sin(now / 1200) * 0.18;
      ctx.fillStyle = 'rgba(0,0,0,0.035)';
      ctx.fillRect(0, 0, w, h);
      drawCurve(points.slice(0, Math.floor(points.length * 0.8)), false, pulse);
      drawCurve(points.slice(Math.floor(points.length * 0.8)), true, pulse);
      requestAnimationFrame(hold);
    }

    window.addEventListener('resize', resize);
    resize();
  }
</script>
