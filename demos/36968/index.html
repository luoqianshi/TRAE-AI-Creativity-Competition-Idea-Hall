<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型额度监控器</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ====== CSS 变量 - 温馨米白主题 ====== */
:root, [data-theme="light"] {
  --bg: #F6F1E9;
  --card: #FFFDFA;
  --bg-soft: #F0EAE0;
  --text: #3D3833;
  --text-muted: #8C8378;
  --border: #EAE2D6;
  --accent: #C8895C;
  --accent-dark: #B5774A;
  --ok: #7C9A6B;
  --warn: #D9A441;
  --danger: #CB6A52;
  --info: #6E8CA3;
  --radius-card: 16px;
  --radius-btn: 10px;
  --shadow: 0 2px 12px rgba(120,100,80,0.06);
  --shadow-hover: 0 4px 20px rgba(120,100,80,0.1);
  --font-stack: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}

[data-theme="dark"] {
  --bg: #2A2520;
  --card: #3A332E;
  --bg-soft: #332E28;
  --text: #F0EBE3;
  --text-muted: #A09585;
  --border: #4A4238;
  --accent: #D49A6D;
  --accent-dark: #C8895C;
  --ok: #8DB07A;
  --warn: #E0B34E;
  --danger: #D87A64;
  --info: #7E9CB5;
  --shadow: 0 2px 12px rgba(0,0,0,0.2);
  --shadow-hover: 0 4px 20px rgba(0,0,0,0.3);
}

/* ====== 全局重置 ====== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; scroll-behavior: smooth; }
body {
  font-family: var(--font-stack);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}
button { cursor: pointer; font-family: inherit; }
input { font-family: inherit; }

/* ====== 顶栏 ====== */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.topbar-brand {
  font-size: 1.25rem; font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  display: flex; align-items: center; gap: 8px;
}
.topbar-brand svg { width: 24px; height: 24px; }
.topbar-search {
  flex: 1; min-width: 180px; max-width: 360px;
  position: relative;
}
.topbar-search input {
  width: 100%; padding: 8px 12px 8px 36px;
  border: 1px solid var(--border); border-radius: var(--radius-btn);
  background: var(--bg-soft); color: var(--text);
  font-size: 0.9rem; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.topbar-search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(200,137,92,0.15);
}
.topbar-search .search-icon {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%); color: var(--text-muted);
  pointer-events: none;
}
.topbar-right {
  display: flex; align-items: center; gap: 16px;
  margin-left: auto;
}
.live-indicator {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.85rem; color: var(--text-muted);
  white-space: nowrap;
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ok);
  animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}
.btn-add {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 14px;
  border: 1px solid var(--accent); border-radius: var(--radius-btn);
  background: var(--accent); color: #fff;
  font-size: 0.85rem; font-weight: 500;
  transition: background 0.2s, transform 0.1s;
  white-space: nowrap;
}
.btn-add:hover { background: var(--accent-dark); }
.btn-add:active { transform: scale(0.97); }
.btn-theme {
  width: 36px; height: 36px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-soft);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-size: 1.1rem;
  transition: background 0.2s, color 0.2s;
}
.btn-theme:hover { color: var(--accent); background: var(--card); }

/* ====== 容器 ====== */
.container { max-width: 1320px; margin: 0 auto; padding: 24px; }

/* ====== KPI 概览 ====== */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px; margin-bottom: 24px;
}
.kpi-card {
  background: var(--card); border-radius: var(--radius-card);
  padding: 20px 24px; box-shadow: var(--shadow);
  border: 2px solid transparent;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.3s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.kpi-card.alert-active { border-color: var(--danger); }
.kpi-title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-value { font-size: 1.85rem; font-weight: 700; display: flex; align-items: baseline; gap: 4px; }
.kpi-value .unit { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); }
.kpi-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
.kpi-sub .up { color: var(--ok); }
.kpi-sub .down { color: var(--danger); }
.kpi-icon {
  float: right; width: 40px; height: 40px;
  border-radius: 10px; display: flex;
  align-items: center; justify-content: center;
  font-size: 1.2rem;
}
.kpi-icon.remain { background: rgba(200,137,92,0.12); color: var(--accent); }
.kpi-icon.cost { background: rgba(110,140,163,0.12); color: var(--info); }
.kpi-icon.keys { background: rgba(124,154,107,0.12); color: var(--ok); }
.kpi-icon.alerts { background: rgba(203,106,82,0.12); color: var(--danger); }

/* ====== 中间区：趋势 + 告警 ====== */
.mid-section {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 16px; margin-bottom: 24px;
}
.trend-card, .alert-card {
  background: var(--card); border-radius: var(--radius-card);
  padding: 20px 24px; box-shadow: var(--shadow);
}
.trend-card h3, .alert-card h3 {
  font-size: 1rem; font-weight: 600; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
#trendChart { width: 100%; height: 260px; }

/* ====== 告警列表 ====== */
.alert-list { list-style: none; max-height: 240px; overflow-y: auto; }
.alert-list::-webkit-scrollbar { width: 4px; }
.alert-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.alert-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
}
.alert-item:last-child { border-bottom: none; }
.alert-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0; margin-top: 6px;
}
.alert-dot.info { background: var(--info); }
.alert-dot.warning { background: var(--warn); }
.alert-dot.critical { background: var(--danger); }
.alert-body { flex: 1; }
.alert-target { font-weight: 600; }
.alert-msg { color: var(--text-muted); margin-top: 2px; }
.alert-time { color: var(--text-muted); font-size: 0.78rem; white-space: nowrap; }

/* ====== 工具栏：视图切换 + 筛选 ====== */
.toolbar {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.view-toggle {
  display: flex; border: 1px solid var(--border);
  border-radius: var(--radius-btn); overflow: hidden;
}
.view-btn {
  padding: 6px 14px; border: none;
  background: var(--bg-soft); color: var(--text-muted);
  font-size: 0.85rem; transition: all 0.2s;
  display: flex; align-items: center; gap: 4px;
}
.view-btn.active { background: var(--accent); color: #fff; }
.filter-select {
  padding: 6px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-btn); background: var(--card);
  color: var(--text); font-size: 0.85rem;
  outline: none; cursor: pointer;
}

/* ====== 监控卡片网格 ====== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.svc-card {
  background: var(--card); border-radius: var(--radius-card);
  padding: 20px; box-shadow: var(--shadow);
  position: relative; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.svc-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.svc-card.active-card::before {
  content: ''; position: absolute;
  top: 16px; left: 16px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--ok);
  animation: breathe 2s ease-in-out infinite;
}

/* 卡片头部 */
.svc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.status-badge {
  padding: 2px 10px; border-radius: 20px;
  font-size: 0.72rem; font-weight: 600;
  letter-spacing: 0.3px;
}
.status-badge.healthy { background: rgba(124,154,107,0.15); color: var(--ok); }
.status-badge.warning { background: rgba(217,164,65,0.15); color: var(--warn); }
.status-badge.danger { background: rgba(203,106,82,0.15); color: var(--danger); }
.status-badge.unknown { background: rgba(100,100,100,0.15); color: var(--muted); }

/* 环形进度区域 */
.ring-area {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 16px;
}
.ring-svg { width: 90px; height: 90px; flex-shrink: 0; }
.ring-bg { fill: none; stroke: var(--bg-soft); stroke-width: 8; }
.ring-fg { fill: none; stroke-width: 8; stroke-linecap: round;
  transform: rotate(-90deg); transform-origin: center;
  transition: stroke-dashoffset 1s ease, stroke 0.5s;
}
.ring-center-val { font-size: 0.78rem; fill: var(--text); font-weight: 600; }
.ring-center-unit { font-size: 0.6rem; fill: var(--text-muted); }
.ring-info { flex: 1; }
.ring-remaining { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
.ring-remaining .cur { color: var(--text); }
.ring-remaining .sep { color: var(--text-muted); font-weight: 400; margin: 0 2px; }
.ring-remaining .total { color: var(--text-muted); font-weight: 400; font-size: 0.9rem; }

/* 指标行 */
.svc-metrics {
  display: flex; gap: 16px; margin-bottom: 12px;
  font-size: 0.82rem;
}
.metric-item { color: var(--text-muted); }
.metric-item .label { font-size: 0.72rem; display: block; margin-bottom: 2px; }
.metric-item .val { font-weight: 600; color: var(--text); }
.metric-item .val.eta-warn { color: var(--warn); }
.metric-item .val.eta-danger { color: var(--danger); }

/* 限流进度条 */
.rate-bars { margin-bottom: 12px; }
.rate-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.75rem; color: var(--text-muted);
  margin-bottom: 6px;
}
.rate-label { width: 28px; font-weight: 600; }
.rate-track {
  flex: 1; height: 6px; background: var(--bg-soft);
  border-radius: 3px; overflow: hidden;
}
.rate-fill {
  height: 100%; border-radius: 3px;
  transition: width 1s ease, background 0.5s;
}
.rate-fill.ok { background: var(--ok); }
.rate-fill.warn { background: var(--warn); }
.rate-fill.danger { background: var(--danger); }
.rate-val { width: 56px; text-align: right; font-size: 0.72rem; }

/* 卡片底部 */
.svc-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 12px; border-top: 1px solid var(--border);
  font-size: 0.78rem; color: var(--text-muted);
}
.sparkline-canvas { width: 72px; height: 24px; }

/* ====== 列表视图 ====== */
.list-view { display: none; }
.list-view.active { display: block; }
.card-grid.hidden { display: none; }
.list-table {
  width: 100%; border-collapse: separate;
  border-spacing: 0;
  background: var(--card); border-radius: var(--radius-card);
  overflow: hidden; box-shadow: var(--shadow);
}
.list-table th {
  text-align: left; padding: 12px 16px;
  background: var(--bg-soft); color: var(--text-muted);
  font-size: 0.78rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.3px;
  border-bottom: 1px solid var(--border);
}
.list-table td {
  padding: 12px 16px; font-size: 0.85rem;
  border-bottom: 1px solid var(--border);
}
.list-table tr { cursor: pointer; transition: background 0.15s; }
.list-table tr:hover td { background: var(--bg-soft); }
.list-table tr:last-child td { border-bottom: none; }
.list-mini-ring { width: 28px; height: 28px; vertical-align: middle; margin-right: 8px; }
.list-bar { width: 60px; height: 6px; background: var(--bg-soft); border-radius: 3px; display: inline-block; overflow: hidden; vertical-align: middle; margin-right: 6px; }
.list-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

/* ====== 详情抽屉 ====== */
.drawer-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(60,50,40,0.3);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer-panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 480px; max-width: 90vw;
  background: var(--card);
  box-shadow: -4px 0 24px rgba(0,0,0,0.1);
  z-index: 201; overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
}
.drawer-panel.open { transform: translateX(0); }
.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--card); z-index: 1;
}
.drawer-header h2 { font-size: 1.1rem; font-weight: 600; }
.drawer-close {
  width: 32px; height: 32px; border: none; border-radius: 50%;
  background: var(--bg-soft); color: var(--text-muted);
  font-size: 1.2rem; display: flex; align-items: center;
  justify-content: center; transition: all 0.2s;
}
.drawer-close:hover { background: var(--border); color: var(--text); }
.drawer-body { padding: 24px; }
.drawer-section { margin-bottom: 24px; }
.drawer-section h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
#drawerChart { width: 100%; height: 200px; }
.drawer-detail-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.drawer-detail-item {
  padding: 12px; background: var(--bg-soft);
  border-radius: var(--radius-btn);
}
.drawer-detail-item .label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
.drawer-detail-item .value { font-size: 1rem; font-weight: 600; }
.drawer-alert-item {
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
}
.drawer-alert-item:last-child { border-bottom: none; }

/* ====== Modal - 添加数据源 ====== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(60,50,40,0.35);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--card); border-radius: var(--radius-card);
  padding: 32px; width: 420px; max-width: 90vw;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
  transform: scale(0.95); transition: transform 0.25s;
}
.modal-overlay.open .modal-box { transform: scale(1); }
.modal-box h2 { font-size: 1.15rem; margin-bottom: 8px; }
.modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.6; }
.modal-box .modal-placeholder {
  padding: 24px; background: var(--bg-soft);
  border: 2px dashed var(--border); border-radius: var(--radius-card);
  text-align: center; color: var(--text-muted);
  font-size: 0.88rem; margin-bottom: 20px;
}
.modal-close-btn {
  padding: 8px 24px; border: none; border-radius: var(--radius-btn);
  background: var(--accent); color: #fff; font-size: 0.9rem;
  font-weight: 500; transition: background 0.2s;
}
.modal-close-btn:hover { background: var(--accent-dark); }

/* ====== 添加数据源 Modal · 供应商卡片网格 ====== */
.provider-modal {
  width: 780px; max-width: 92vw; padding: 28px 32px;
}
.provider-modal .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
}
.provider-modal .modal-close-x { background: none; border: none; font-size: 1.4rem; color: var(--text-muted); cursor: pointer; padding: 4px 10px; border-radius: 6px;
}
.provider-modal .modal-close-x:hover { background: var(--bg-soft); }
.provider-body { display: flex; gap: 20px; margin-top: 16px; }

.provider-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1.1;
  max-height: 520px; overflow-y: auto; padding-right: 4px;
}
.provider-card {
  background: var(--bg-soft); border: 2px solid var(--border); border-radius: 10px;
  padding: 14px 10px; text-align: center; cursor: pointer; transition: all 0.18s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.provider-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.provider-card.selected { border-color: var(--accent); background: var(--accent-light); }
.provider-logo { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fff; overflow: hidden;
}
.provider-logo img { width: 24px; height: 24px; object-fit: contain; }
.provider-logo svg { width: 24px; height: 24px; }
.provider-name { font-size: 0.82rem; color: var(--text); font-weight: 500; line-height: 1.3;
}
.provider-type { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px;
}

.provider-form-panel {
  flex: 1; background: var(--card-soft); border-radius: 12px; padding: 20px;
  display: flex; flex-direction: column; min-height: 420px;
}
.form-state { min-height: 420px; flex: 1;
}
.form-placeholder { text-align: center; color: var(--text-muted); padding: 60px 20px;
}
.form-placeholder .icon { font-size: 2.5rem; display: block; margin-bottom: 12px; opacity: 0.5;
}
.form-group { margin-bottom: 14px;
}
.form-group label { display: block; font-size: 0.82rem; color: var(--text); margin-bottom: 6px; font-weight: 500;
}
.form-group input[type="text"], .form-group input[type="password"], .form-group input[type="number"] {
  width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--card); color: var(--text); font-size: 0.85rem; transition: border-color 0.2s; outline: none;
}
.form-group input:focus { border-color: var(--accent); }
.form-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px;
}
.form-row { display: flex; gap: 12px;
}
.form-row .form-group { flex: 1;
}
.btn-submit {
  width: 100%; padding: 10px 24px; border: none; border-radius: 8px; background: var(--accent);
  color: #fff; font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: background 0.2s; margin-top: 8px;
}
.btn-submit:hover { background: var(--accent-dark); }
.btn-submit:disabled { background: var(--text-muted); cursor: not-allowed; opacity: 0.6;
}
.form-status { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 0.82rem; line-height: 1.5;
}
.form-status.success { background: rgba(76, 175, 80, 0.12); color: #2e7d32;
}
.form-status.error { background: rgba(244, 67, 54, 0.12); color: #c62828;
}
.form-status.info { background: rgba(33, 150, 243, 0.12); color: #1565c0;
}
.success-card { padding: 20px; text-align: center;
}
.success-card .success-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 8px;
}
.success-card .success-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;
}
.success-card .success-icon { font-size: 3rem; margin-bottom: 12px;
}
.success-card .success-detail { text-align: left; background: var(--card); padding: 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.82rem;
}
.success-detail-row { display: flex; justify-content: space-between; padding: 4px 0;
}
.success-detail-row .label { color: var(--text-muted);
}
.success-detail-row .value { color: var(--text); font-weight: 500;
}
/* ====== 卡片头部删除按钮 ====== */
.svc-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  gap: 12px;
}
.svc-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}
.svc-name {
  font-weight: 600;
  font-size: 1rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.svc-name .provider { color: var(--text-muted); font-weight: 400; font-size: 0.82rem; margin-left: 6px; }
.svc-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.svc-delete {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 32px;
  height: 32px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.svc-delete:hover {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
  transform: scale(1.05);
}
.svc-delete:active { transform: scale(0.95); }
.svc-delete svg { pointer-events: none; }

.svc-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 0.78rem;
  color: var(--text-muted);
}
/* ====== 空状态 ====== */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 40px;
  background: var(--card);
  border-radius: 12px;
  border: 1px dashed var(--border);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6;
}
.empty-title {
  font-size: 1.05rem;
  color: var(--text);
  font-weight: 600;
  margin-bottom: 8px;
}
.empty-desc { font-size: 0.8rem;
  color: var(--text-muted);
}
/* ====== 剩余不可查询样式 ====== */
.cur-meta {
  color: var(--text-muted);
  font-size: 1.2rem;
  font-weight: 500;
}
/* ====== 检测/手动按钮 ====== */
.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-secondary:hover {
  background: var(--hover);
  border-color: var(--primary);
  color: var(--primary);
}
.btn-secondary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
/* ====== 模型多选卡片 ====== */
.model-chip {
  display: flex;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  font-size: 0.78rem;
  transition: all 0.2s;
}
.model-chip:hover {
  border-color: var(--primary);
  background: var(--hover);
}
.model-chip input[type="checkbox"] {
  cursor: pointer;
  accent-color: var(--primary);
}
.model-chip-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: monospace;
}
/* ====== 数字滚动动画 ====== */
.num-animate {
  display: inline-block;
  transition: opacity 0.3s, transform 0.3s;
}
.num-animate.changing {
  opacity: 0.3; transform: translateY(-2px);
}

/* ====== 响应式 ====== */
@media (max-width: 900px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .mid-section { grid-template-columns: 1fr; }
  .container { padding: 16px; }
}
@media (max-width: 600px) {
  .kpi-grid { grid-template-columns: 1fr; }
  .topbar { padding: 10px 16px; }
  .topbar-search { max-width: 100%; order: 3; flex-basis: 100%; }
  .card-grid { grid-template-columns: 1fr; }
  .svc-card { padding: 16px; }
}
</style>
</head>

<script>
/* ========================================================
 * 模型额度监控器 - Mock 数据与核心逻辑
 * ======================================================== */

/* ---- 生成 24 小时趋势数据 ---- */
function genTrend(base, variance, len) {
  len = len || 24;
  var arr = [];
  for (var i = 0; i < len; i++) {
    arr.push(Math.max(0, +(base + (Math.random() - 0.5) * variance * 2).toFixed(2)));
  }
  return arr;
}

/* ---- 核心共享函数 ---- */
function calcStatus(remaining, total) {
  var pct = total > 0 ? remaining / total : 0;
  if (pct < 0.05) return 'danger';
  if (pct < 0.20) return 'warning';
  return 'healthy';
}

function statusColor(status) {
  if (status === 'danger') return 'var(--danger)';
  if (status === 'warning') return 'var(--warn)';
  if (status === 'unknown') return 'var(--muted)';
  return 'var(--ok)';
}

function statusText(status) {
  if (status === 'danger') return '危险';
  if (status === 'warning') return '警告';
  if (status === 'unknown') return '不可查询';
  return '充足';
}

function rateBarClass(pct) {
  if (pct > 0.95) return 'danger';
  if (pct > 0.80) return 'warn';
  return 'ok';
}

/* ---- 后端 API 配置与全局状态 ---- */
var API_BASE = (location.protocol === 'file:' || location.port === '8080')
  ? 'http://localhost:8000/api/v1'
  : '/api/v1';

var servicesState = [];       // 最新 /services 数据
var alertsState = [];         // 最新 /alerts 数据
var summaryState = null;      // 最新 /summary 数据
var lastDangerIds = {};       // 已通知过的 danger 告警 id，避免重复弹窗
var apiAvailable = false;     // 后端是否可达

/* ========================================================
 * 渲染函数
 * ======================================================== */

/* ---- KPI 概览 ---- */
function renderKPI() {
  var totalRemain = 0, todayCost = 0, activeKeys = 0, alertCount = 0;
  if (summaryState) {
    totalRemain = summaryState.totalRemaining || 0;
    todayCost = summaryState.todayCost || 0;
    activeKeys = summaryState.activeKeys || 0;
    alertCount = summaryState.alertCount || 0;
  } else {
    servicesState.forEach(function(s) {
      if (s.quotaType === 'balance' && s.currency === 'CNY') {
        totalRemain += s.remaining;
      }
      todayCost += s.burnRate * 8;
      if (s.active) activeKeys++;
      if (s.status === 'danger' || s.status === 'warning') alertCount++;
    });
  }
  var html = '';
  html += '<div class="kpi-card"><div class="kpi-icon remain" style="float:right">💰</div><div class="kpi-title">总剩余余额</div><div class="kpi-value"><span class="unit">¥</span>' + totalRemain.toFixed(1) + '</div><div class="kpi-sub"><span class="down">↓ 3.2%</span> 较昨日</div></div>';
  html += '<div class="kpi-card"><div class="kpi-icon cost" style="float:right">📊</div><div class="kpi-title">今日消耗</div><div class="kpi-value"><span class="unit">¥</span>' + todayCost.toFixed(1) + '</div><div class="kpi-sub"><span class="up">↑ 8.5%</span> 较昨日</div></div>';
  html += '<div class="kpi-card"><div class="kpi-icon keys" style="float:right">🔑</div><div class="kpi-title">活跃 Key</div><div class="kpi-value">' + activeKeys + '<span class="unit"> / ' + servicesState.length + '</span></div><div class="kpi-sub">' + servicesState.length + ' 个服务</div></div>';
  var alertCardClass = alertCount > 0 ? ' alert-active' : '';
  html += '<div class="kpi-card' + alertCardClass + '"><div class="kpi-icon alerts" style="float:right">🔔</div><div class="kpi-title">当前告警</div><div class="kpi-value">' + alertCount + '</div><div class="kpi-sub">需及时处理' + (apiAvailable ? '' : ' · 未连接后端') + '</div></div>';
  document.getElementById('kpiGrid').innerHTML = html;
}

/* ---- 趋势图 ---- */
var trendChart = null;
function renderTrendChart() {
  var dom = document.getElementById('trendChart');
  if (!trendChart) {
    trendChart = echarts.init(dom, null, { renderer: 'canvas' });
  }
  var hours = [];
  for (var i = 0; i < 24; i++) hours.push((i < 10 ? '0' : '') + i + ':00');
  var series = [];
  var colors = ['#C8895C', '#7C9A6B', '#6E8CA3', '#CB6A52', '#D9A441', '#8C8378', '#6E8CA3'];
  servicesState.forEach(function(s, idx) {
    var data = (s.trend || []).map(function(v) {
      return s.quotaType === 'balance' ? +Number(v).toFixed(1) : +v;
    });
    series.push({
      name: s.provider + ' · ' + s.model,
      type: 'line',
      smooth: true,
      symbol: 'none',
      lineStyle: { width: 2, color: colors[idx % colors.length] },
      areaStyle: {
        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: colors[idx % colors.length] + '30' },
          { offset: 1, color: colors[idx % colors.length] + '05' }
        ])
      },
      data: data
    });
  });
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var axisLineColor = isDark ? '#5A5048' : '#EAE2D6';
  var textColor = isDark ? '#A09585' : '#8C8378';
  var option = {
    tooltip: { trigger: 'axis' },
    grid: { top: 24, right: 16, bottom: 24, left: 48 },
    xAxis: {
      type: 'category', data: hours, boundaryGap: false,
      axisLine: { lineStyle: { color: axisLineColor } },
      axisTick: { show: false },
      axisLabel: { color: textColor, fontSize: 11, interval: 3 }
    },
    yAxis: {
      type: 'value',
      splitLine: { lineStyle: { color: axisLineColor, type: 'dashed' } },
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: { color: textColor, fontSize: 11 }
    },
    series: series.length ? series : [{ type: 'line', data: [] }]
  };
  trendChart.setOption(option, true);
}

/* ---- 告警列表 ---- */
function renderAlerts() {
  var html = '';
  if (!alertsState || alertsState.length === 0) {
    html = '<li class="alert-item"><span class="alert-dot info"></span><div class="alert-body"><span class="alert-target">提示</span><div class="alert-msg">暂无告警，一切正常</div></div><span class="alert-time">—</span></li>';
    document.getElementById('alertList').innerHTML = html;
    return;
  }
  alertsState.forEach(function(a) {
    html += '<li class="alert-item">' +
      '<span class="alert-dot ' + a.level + '"></span>' +
      '<div class="alert-body"><span class="alert-target">' + a.target + '</span><div class="alert-msg">' + a.message + '</div></div>' +
      '<span class="alert-time">' + a.timeLabel + '</span>' +
      '</li>';
  });
  document.getElementById('alertList').innerHTML = html;
}

/* ---- 构建环形 SVG（卡片用） ---- */
function ringSVG(remaining, total, status, size) {
  size = size || 90;
  var r = (size - 16) / 2;
  var circ = 2 * Math.PI * r;
  if (remaining === null || remaining === undefined) {
    var cx = size / 2, cy = size / 2;
    return '<svg class="ring-svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle class="ring-bg" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>' +
      '<text class="ring-center-val" x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" dominant-baseline="central" fill="var(--text-muted)">—</text>' +
      '</svg>';
  }
  var cx = size / 2, cy = size / 2;
  var color = statusColor(status);
  // 余额型（无总配额）：显示一个完整的彩色圆环 + 状态文本，不显示百分比
  if (total === null || total === undefined || total <= 0) {
    return '<svg class="ring-svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle class="ring-bg" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>' +
      '<circle class="ring-fg" cx="' + cx + '" cy="' + cy + '" r="' + r + '" ' +
        'stroke="' + color + '" stroke-dasharray="' + circ + '" stroke-dashoffset="0"/>' +
      '<text class="ring-center-val" x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" dominant-baseline="central">' + statusText(status) + '</text>' +
      '</svg>';
  }
  var pct = remaining / total;
  var offset = circ * (1 - pct);
  var displayPct = (pct * 100).toFixed(1);
  return '<svg class="ring-svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle class="ring-bg" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>' +
    '<circle class="ring-fg" cx="' + cx + '" cy="' + cy + '" r="' + r + '" ' +
      'stroke="' + color + '" stroke-dasharray="' + circ + '" stroke-dashoffset="' + offset + '"/>' +
    '<text class="ring-center-val" x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" dominant-baseline="central">' + displayPct + '%</text>' +
    '</svg>';
}

/* ---- Sparkline 绘制 ---- */
function drawSparkline(canvas, data, status) {
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width = 72 * 2;
  var h = canvas.height = 24 * 2;
  canvas.style.width = '72px';
  canvas.style.height = '24px';
  ctx.clearRect(0, 0, w, h);
  if (!data || data.length < 2) return;
  var min = Math.min.apply(null, data);
  var max = Math.max.apply(null, data);
  var range = max - min || 1;
  var step = w / (data.length - 1);
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var lineColor = status === 'danger' ? '#CB6A52' : status === 'warning' ? '#D9A441' : '#7C9A6B';
  var fillColor = lineColor + '20';
  ctx.beginPath();
  ctx.moveTo(0, h - ((data[0] - min) / range) * h * 0.8 - h * 0.1);
  for (var i = 1; i < data.length; i++) {
    var x = i * step;
    var y = h - ((data[i] - min) / range) * h * 0.8 - h * 0.1;
    ctx.lineTo(x, y);
  }
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
}

/* ---- 监控卡片网格 ---- */
function renderCardGrid(filter) {
  filter = filter || 'all';
  var search = (document.getElementById('globalSearch').value || '').toLowerCase();
  var html = '';
  var visibleCount = 0;
  servicesState.forEach(function(s) {
    if (filter !== 'all' && s.status !== filter) return;
    if (search && s.provider.toLowerCase().indexOf(search) < 0 &&
        s.model.toLowerCase().indexOf(search) < 0 &&
        s.apiKey.toLowerCase().indexOf(search) < 0) return;
    visibleCount++;
    var tpmMax = (s.rateLimit && s.rateLimit.tpm && s.rateLimit.tpm.max) || 0;
    var tpmUsed = (s.rateLimit && s.rateLimit.tpm && s.rateLimit.tpm.used) || 0;
    var rpmMax = (s.rateLimit && s.rateLimit.rpm && s.rateLimit.rpm.max) || 0;
    var rpmUsed = (s.rateLimit && s.rateLimit.rpm && s.rateLimit.rpm.used) || 0;
    var tpmPct = tpmMax > 0 ? tpmUsed / tpmMax : 0;
    var rpmPct = rpmMax > 0 ? rpmUsed / rpmMax : 0;
    var tpmClass = rateBarClass(tpmPct);
    var rpmClass = rateBarClass(rpmPct);
    var etaClass = s.etaHours !== null && s.etaHours !== undefined && s.etaHours < 5 ? 'eta-danger' : (s.etaHours !== null && s.etaHours !== undefined && s.etaHours < 12 ? 'eta-warn' : '');
    var etaText = s.etaHours !== null && s.etaHours !== undefined && s.etaHours > 0 ? ('约 ' + s.etaHours + ' 小时后耗尽') : '—';
    var activeClass = s.active ? ' active-card' : '';
    var hasRemaining = s.remaining !== null && s.remaining !== undefined;
    var hasTotal = s.total !== null && s.total !== undefined;
    var remainDisplay;
    if (!hasRemaining) {
      remainDisplay = '<span class="cur cur-meta">— 不可查询</span>';
    } else if (s.quotaType === 'balance' && !hasTotal) {
      remainDisplay = '<span class="cur">' + s.unit + Number(s.remaining).toFixed(1) + '</span><span class="sep"> · 余额型</span>';
    } else {
      remainDisplay = s.quotaType === 'balance' ?
        ('<span class="cur">' + s.unit + Number(s.remaining).toFixed(1) + '</span><span class="sep">/</span><span class="total">' + s.unit + Number(s.total).toFixed(1) + '</span>') :
        ('<span class="cur">' + Number(s.remaining).toLocaleString() + '</span><span class="sep"> / </span><span class="total">' + Number(s.total).toLocaleString() + ' ' + s.unit + '</span>');
    }
    var burnDisplay;
    if (!hasRemaining) {
      burnDisplay = '—';
    } else {

        '<div class="metric-item"><span class="label">预计耗尽</span><span class="val ' + etaClass + '">' + etaText + '</span></div>' +

      '</div>' +
    '</div>';
  });

  // 空状态：无服务或无匹配
  if (visibleCount === 0) {
    if (servicesState.length === 0) {
      html = '<div class="empty-state">' +
        '<div class="empty-icon">📊</div>' +
        '<div class="empty-title">暂无数据源</div>' +

/* ---- 列表视图 ---- */
function renderListView(filter) {
  filter = filter || 'all';
  var search = (document.getElementById('globalSearch').value || '').toLowerCase();
  var html = '';
  servicesState.forEach(function(s) {
    if (filter !== 'all' && s.status !== filter) return;
    if (search && s.provider.toLowerCase().indexOf(search) < 0 &&
        s.model.toLowerCase().indexOf(search) < 0) return;
    var tpmMax = (s.rateLimit && s.rateLimit.tpm && s.rateLimit.tpm.max) || 0;
    var tpmUsed = (s.rateLimit && s.rateLimit.tpm && s.rateLimit.tpm.used) || 0;
    var rpmMax = (s.rateLimit && s.rateLimit.rpm && s.rateLimit.rpm.max) || 0;
    var rpmUsed = (s.rateLimit && s.rateLimit.rpm && s.rateLimit.rpm.used) || 0;
    var tpmPct = tpmMax > 0 ? tpmUsed / tpmMax : 0;
    var rpmPct = rpmMax > 0 ? rpmUsed / rpmMax : 0;
    var etaText = s.etaHours !== null && s.etaHours !== undefined && s.etaHours > 0 ? (s.etaHours + 'h') : '—';
    var burnDisplay;
    if (s.remaining === null || s.remaining === undefined) {
      burnDisplay = '—';
    } else {
      burnDisplay = s.quotaType === 'balance' ? (s.unit + Number(s.burnRate || 0).toFixed(1) + '/h') : (Number(s.burnRate || 0).toLocaleString() + '/h');
    }
    var hasTotal = s.total !== null && s.total !== undefined;
    var remainDisplay;
    if (s.remaining === null || s.remaining === undefined) {
      remainDisplay = '<span style="color:var(--text-muted)">— 不可查询</span>';
    } else if (s.quotaType === 'balance' && !hasTotal) {
      remainDisplay = s.unit + Number(s.remaining).toFixed(1) + ' <span style="color:var(--text-muted);font-size:0.78rem">余额型</span>';
    } else {
      remainDisplay = s.quotaType === 'balance' ? (s.unit + Number(s.remaining).toFixed(1) + ' / ' + s.unit + Number(s.total).toFixed(1)) : (Number(s.remaining).toLocaleString() + ' / ' + Number(s.total).toLocaleString());
    }
    html += '<tr data-id="' + s.id + '">' +
      '<td><strong>' + s.provider + '</strong><br><span style="color:var(--text-muted);font-size:0.78rem">' + s.model + '</span></td>' +
      '<td><span class="status-badge ' + s.status + '">' + statusText(s.status) + '</span></td>' +
      '<td>' + remainDisplay + '</td>' +
      '<td>' + burnDisplay + '</td>' +
      '<td>' + etaText + '</td>' +
      '<td>' + (tpmMax > 0 ? ('<div class="list-bar"><div class="list-bar-fill" style="width:' + (tpmPct * 100) + '%;background:' + statusColor(calcStatus(1 - tpmPct, 1)) + '"></div></div>' + (tpmPct * 100).toFixed(0) + '%') : '—') + '</td>' +
      '<td>' + (rpmMax > 0 ? ('<div class="list-bar"><div class="list-bar-fill" style="width:' + (rpmPct * 100) + '%;background:' + statusColor(calcStatus(1 - rpmPct, 1)) + '"></div></div>' + (rpmPct * 100).toFixed(0) + '%') : '—') + '</td>' +
      '<td style="font-size:0.78rem;color:var(--text-muted)">' + s.apiKey + '</td>' +
    '</tr>';

  document.querySelectorAll('#listBody tr').forEach(function(tr) {
    tr.addEventListener('click', function() {
      openDrawer(tr.getAttribute('data-id'));
    });

/* ---- 卡片点击/删除 ---- */
function bindCardClicks() {
  document.querySelectorAll('.svc-card').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('.sparkline-canvas')) return;
      if (e.target.closest('.svc-delete')) return;
      openDrawer(card.getAttribute('data-id'));
    });
  });
  document.querySelectorAll('.svc-delete').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var id = btn.getAttribute('data-id');
      var svc = servicesState.find(function(s) { return s.id === id; });
      var title = svc ? (svc.provider + (svc.model ? ' · ' + svc.model : '')) : id;
      if (confirm('确认删除该数据源？\n\n  ' + title + '\n\n删除后无法恢复，相关配额快照与告警也会被一并清除。')) {
        deleteService(id);
      }
    });
  });
}

function deleteService(id) {
  return fetch(API_BASE + '/services/' + encodeURIComponent(id), {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
  })
    .then(function(r) {
      if (!r.ok) {
        return r.text().then(function(t) {
          var msg = 'HTTP ' + r.status;
          try {
            var j = JSON.parse(t);
            if (j && j.detail) msg = j.detail;
          } catch (e) { /* ignore */ }
          throw new Error(msg);
        });
      }
      return r.json();
    })
    .then(function(data) {
      servicesState = servicesState.filter(function(s) { return s.id !== id; });
      var drawerEl = document.getElementById('drawerPanel');
      if (drawerEl && drawerEl.classList.contains('open')) {
        if (drawerEl.getAttribute('data-svc-id') === id) {
          drawerEl.classList.remove('open');
          document.getElementById('drawerOverlay').classList.remove('open');
        }
      }
      renderCurrentView();
      renderKPI();
      return data;
    })
    .catch(function(err) {
      alert('删除失败：' + (err.message || err));
      throw err;
    });
}

function renderCurrentView() {
  if (currentView === 'list') {
    renderListView(currentFilter);
  } else {
    renderCardGrid(currentFilter);
  }
}

var drawerChartInstance = null;

function openDrawer(svcId) {
  var svc = servicesState.find(function(s) { return s.id === svcId; });
  if (!svc) return;
  document.getElementById('drawerTitle').textContent = svc.provider + ' · ' + svc.model;
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('drawerPanel').classList.add('open');
  renderDrawerDetail(svc);
  renderDrawerChart(svc);
  renderDrawerAlerts(svc);
  renderDrawerKeyInfo(svc);
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('drawerPanel').classList.remove('open');
}

function renderDrawerDetail(svc) {
  var hasRemaining = svc.remaining !== null && svc.remaining !== undefined;
  var hasTotal = svc.total !== null && svc.total !== undefined;
  var pct = (hasRemaining && hasTotal && svc.total > 0) ? (svc.remaining / svc.total * 100).toFixed(1) + '%' : '—';
  var burnDisplay = hasRemaining ? (svc.quotaType === 'balance' ? (svc.unit + Number(svc.burnRate || 0).toFixed(1) + '/小时') : (Number(svc.burnRate || 0).toLocaleString() + ' ' + svc.unit + '/小时')) : '—';
  var etaText = svc.etaHours !== null && svc.etaHours !== undefined && svc.etaHours > 0 ? ('约 ' + svc.etaHours + ' 小时') : '—';
  var tpmMax = (svc.rateLimit && svc.rateLimit.tpm && svc.rateLimit.tpm.max) || 0;
  var tpmUsed = (svc.rateLimit && svc.rateLimit.tpm && svc.rateLimit.tpm.used) || 0;
  var rpmMax = (svc.rateLimit && svc.rateLimit.rpm && svc.rateLimit.rpm.max) || 0;
  var rpmUsed = (svc.rateLimit && svc.rateLimit.rpm && svc.rateLimit.rpm.used) || 0;
  var html = '';
  html += detailItem('额度类型', svc.quotaType === 'balance' ? '余额型' : svc.quotaType === 'token' ? 'Token 配额' : '请求配额');
  if (hasRemaining) {
    if (svc.quotaType === 'balance' && !hasTotal) {
      html += detailItem('剩余额度', svc.unit + Number(svc.remaining).toFixed(1));
    } else {
      html += detailItem('剩余额度', svc.unit + Number(svc.remaining).toFixed(1) + ' / ' + (hasTotal ? svc.unit + Number(svc.total).toFixed(1) : '—'));
    }
    html += detailItem('剩余比例', pct);
  } else {
    html += detailItem('剩余额度', '<span style="color:var(--text-muted)">— 不可查询</span>');
    html += detailItem('剩余比例', '—');
  }
  html += detailItem('消耗速率', burnDisplay);
  html += detailItem('预计耗尽', etaText);
  html += detailItem('TPM 占用', tpmMax > 0 ? (Number(tpmUsed).toLocaleString() + ' / ' + Number(tpmMax).toLocaleString()) : '—');
  html += detailItem('RPM 占用', rpmMax > 0 ? (rpmUsed + ' / ' + rpmMax) : '—');
  html += detailItem('状态', statusText(svc.status));
  html += detailItem('活跃状态', svc.active ? '运行中' : '已暂停');
  document.getElementById('drawerDetail').innerHTML = html;
}
function detailItem(label, value) {
  return '<div class="drawer-detail-item"><div class="label">' + label + '</div><div class="value">' + value + '</div></div>';
}

function renderDrawerChart(svc) {
  var dom = document.getElementById('drawerChart');
  if (drawerChartInstance) { drawerChartInstance.dispose(); }
  drawerChartInstance = echarts.init(dom, null, { renderer: 'canvas' });
  var hours = [];
  for (var i = 0; i < 24; i++) hours.push((i < 10 ? '0' : '') + i + ':00');
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var axisLineColor = isDark ? '#5A5048' : '#EAE2D6';
  var textColor = isDark ? '#A09585' : '#8C8378';
  var option = {
    grid: { top: 16, right: 12, bottom: 24, left: 44 },
    xAxis: { type: 'category', data: hours, boundaryGap: false,
      axisLine: { lineStyle: { color: axisLineColor } },
      axisTick: { show: false },
      axisLabel: { color: textColor, fontSize: 10, interval: 5 }
    },
    yAxis: { type: 'value',
      splitLine: { lineStyle: { color: axisLineColor, type: 'dashed' } },
      axisLine: { show: false }, axisTick: { show: false },
      axisLabel: { color: textColor, fontSize: 10 }
    },
    tooltip: { trigger: 'axis' },
    series: [{
      type: 'line', smooth: true, symbol: 'none',
      lineStyle: { width: 2, color: '#C8895C' },
      areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: '#C8895C30' },
        { offset: 1, color: '#C8895C05' }
      ]) },
      data: svc.trend || []
    }]
  };
  drawerChartInstance.setOption(option);
}

function renderDrawerAlerts(svc) {
  var rel = alertsState.filter(function(a) {
    return (a.target || '').indexOf(svc.provider) >= 0 || (a.target || '').indexOf(svc.model) >= 0;

    document.getElementById('drawerAlerts').innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;padding:8px 0">暂无告警记录</div>';
    return;
  }
  var html = '';
  rel.forEach(function(a) {
    html += '<div class="drawer-alert-item"><span style="display:inline-block;margin-right:8px;width:8px;height:8px;border-radius:50%;background:var(--' + (a.level === 'danger' || a.level === 'critical' ? 'danger' : a.level === 'warning' ? 'warn' : 'info') + ');vertical-align:middle"></span>' + a.message + '<span style="float:right;color:var(--text-muted);font-size:0.72rem">' + a.timeLabel + '</span></div>';
  });
  document.getElementById('drawerAlerts').innerHTML = html;
}

function renderDrawerKeyInfo(svc) {

    '<div style="font-size:0.75rem; color:var(--text-muted);">供应商类型：' + p.type + '</div></div></div>';

  if (isCustom) {
    html += '<div class="form-group"><label>API 基础地址</label>' +
      '<input type="text" id="formBaseUrl" placeholder="https://api.example.com/v1">' +
      '<div class="form-hint">自定义供应商需提供完整的 API 基础地址</div></div>';
  }
  html += '<div class="form-group"><label>API Key <span style="color:var(--danger);">*</span></label>' +
    '<input type="password" id="formApiKey" placeholder="sk-..." autocomplete="off" style="font-family:monospace">' +
    '<div class="form-hint">API Key 将在本地加密存储，不会上传到任何服务器</div></div>';

  // ===== 模型列表检测 =====
  html += '<div class="form-group">' +
    '<label>选择监控模型</label>' +
    '<div style="display:flex; gap:8px; align-items:center;">' +
    '<button class="btn-secondary" id="btnFetchModels" type="button" style="flex:0 0 auto; padding:8px 14px;">检测可用模型</button>' +
    '<button class="btn-secondary" id="btnManualModel" type="button" style="flex:0 0 auto; padding:8px 14px;">手动输入</button>' +
    '<span id="modelStatus" style="font-size:0.78rem; color:var(--text-muted); flex:1;"></span>' +
    '</div>' +
    '<div id="modelPickerArea" style="margin-top:10px; max-height:200px; overflow-y:auto; padding:8px 0; display:none;"></div>' +
    '<div id="manualModelArea" style="margin-top:10px; display:none;">' +
    '<input type="text" id="formModel" placeholder="例如：gpt-4o 或 deepseek-chat" value="' + (p.defaultModel || '') + '" style="width:100%">' +
    '</div>' +
    '<div class="form-hint">可多选，每个模型会创建独立的监控卡片</div>' +
    '</div>';

  html += '<div class="form-group"><label>告警阈值（¥）</label>' +
    '<input type="number" id="formThreshold" value="50" min="0">' +
    '<div class="form-hint">当剩余额度低于此值时触发告警</div></div>';
  html += '<button class="btn-submit" id="btnSubmitProvider" disabled style="opacity:0.5;">接入并开始监控</button>';

  panel.innerHTML = html;

  // 事件绑定
  var fetchBtn = document.getElementById('btnFetchModels');
  var manualBtn = document.getElementById('btnManualModel');
  var modelStatus = document.getElementById('modelStatus');
  var modelPicker = document.getElementById('modelPickerArea');
  var manualArea = document.getElementById('manualModelArea');
  var formModel = document.getElementById('formModel');
  var submitBtn = document.getElementById('btnSubmitProvider');
  var formApiKey = document.getElementById('formApiKey');

  function setSubmitEnabled() {
    var hasSelectedModels = modelPicker.querySelectorAll('input[type="checkbox"]:checked').length > 0;
    var hasManualModel = !manualArea.style.display.includes('none') && formModel.value.trim().length > 0;
    submitBtn.disabled = !(hasSelectedModels || hasManualModel) || !formApiKey.value.trim();
    submitBtn.style.opacity = submitBtn.disabled ? '0.5' : '1';
  }
  formApiKey.addEventListener('input', setSubmitEnabled);

  fetchBtn.addEventListener('click', async function() {
    var apiKey = formApiKey.value.trim();
    if (!apiKey) {
      modelStatus.style.color = 'var(--danger)';
      modelStatus.textContent = '请先填写 API Key';
      return;
    }
    modelStatus.style.color = 'var(--text-muted)';
    modelStatus.textContent = '正在检测...';
    fetchBtn.disabled = true;
    var baseUrl = '';
    if (isCustom) {
      var fbu = document.getElementById('formBaseUrl');
      baseUrl = fbu ? fbu.value.trim() : '';
    }
    try {
      var resp = await fetch(API_BASE + '/providers/models', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: p.type, apiKey: apiKey, baseUrl: baseUrl || undefined })
      });
      var data = await resp.json();
      var models = (data.models || []).slice(0, 50);
      if (!models.length) {
        modelStatus.style.color = 'var(--warn)';
        modelStatus.textContent = '未检测到可用模型，请尝试手动输入';
        modelPicker.style.display = 'none';
        manualArea.style.display = 'block';
        formModel.addEventListener('input', setSubmitEnabled);
        setSubmitEnabled();
        return;
      }
      // 展示多选
      var inner = '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:6px;">';
      models.forEach(function(m, idx) {
        inner += '<label class="model-chip">' +
          '<input type="checkbox" value="' + m + '" style="margin-right:6px;" ' + (idx === 0 ? 'checked' : '') + '>' +
          '<span class="model-chip-name">' + m + '</span></label>';
      });
      inner += '</div>';
      modelPicker.innerHTML = inner;
      modelPicker.style.display = 'block';
      manualArea.style.display = 'none';
      modelStatus.style.color = 'var(--ok)';
      modelStatus.textContent = '已检测到 ' + models.length + ' 个模型，请勾选要监控的';
      modelPicker.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
        cb.addEventListener('change', setSubmitEnabled);
      });
      setSubmitEnabled();
    } catch (err) {
      modelStatus.style.color = 'var(--danger)';
      modelStatus.textContent = '检测失败：' + err.message;
    } finally {
      fetchBtn.disabled = false;
    }
  });

  manualBtn.addEventListener('click', function() {
    manualArea.style.display = 'block';
    modelPicker.style.display = 'none';
    modelStatus.style.color = 'var(--text-muted)';
    modelStatus.textContent = '请在下方输入模型名称';
    formModel.addEventListener('input', setSubmitEnabled);
    setSubmitEnabled();
  });

  submitBtn.addEventListener('click', handleProviderSubmit);
}

async function handleProviderSubmit() {
  if (!currentProvider) return;
  var apiKey = document.getElementById('formApiKey').value.trim();
  if (!apiKey) {
    showFormStatus('error', '请填写 API Key');
    return;
  }

  // 读取用户的模型选择：先看 modelPicker 中的多选，再看手动输入
  var modelPicker = document.getElementById('modelPickerArea');
  var manualArea = document.getElementById('manualModelArea');
  var formModel = document.getElementById('formModel');
  var models = [];
  if (modelPicker && modelPicker.style.display && !modelPicker.style.display.includes('none')) {
    modelPicker.querySelectorAll('input[type="checkbox"]:checked').forEach(function(cb) {
      if (cb.value) models.push(cb.value);
    });
  } else if (manualArea && formModel && formModel.value.trim()) {
    models = [formModel.value.trim()];
  }

  if (models.length === 0) {
    showFormStatus('error', '请至少选择或输入一个模型');
    return;
  }

  var btn = document.getElementById('btnSubmitProvider');
  btn.disabled = true;
  btn.textContent = '提交中...';
  showFormStatus('info', '正在接入并建立 ' + models.length + ' 个监控项...');

  var threshold = document.getElementById('formThreshold').value.trim() || '50';
  var baseUrl = document.getElementById('formBaseUrl') ? document.getElementById('formBaseUrl').value.trim() : '';

  var payload = {
    name: currentProvider.name,
    type: currentProvider.type,
    apiKey: apiKey,
    models: models,
    alertThreshold: threshold,
    quotaType: 'balance'
  };
  if (baseUrl) payload.baseUrl = baseUrl;

  try {
    var resp = await fetch(API_BASE + '/providers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    var data = await resp.json();
    if (resp.ok) {
      renderSuccessState(data);
      setTimeout(loadAllData, 800);
    } else {
      showFormStatus('error', '接入失败：' + (data.detail || '请检查 API Key 和网络连接'));
      btn.disabled = false;
      btn.textContent = '接入并开始监控';
    }
  } catch (err) {
    showFormStatus('error', '网络错误：' + err.message + '（后端是否启动？）');
    btn.disabled = false;
    btn.textContent = '接入并开始监控';
  }
}

function showFormStatus(kind, text) {
  var panel = document.getElementById('providerFormPanel');
  if (!panel) return;
  var existing = panel.querySelector('.form-status');
  if (existing) existing.remove();
  var div = document.createElement('div');
  div.className = 'form-status ' + kind;
  div.textContent = text;
  var first = panel.firstChild;
  panel.insertBefore(div, first);
}

function renderSuccessState(data) {
  var panel = document.getElementById('providerFormPanel');
  if (!panel) return;
  var ids = (data.ids && data.ids.length) ? data.ids : (data.id ? [data.id] : []);
  var idList = ids.map(function(id) {
    return '<div style="font-size:0.72rem; color:var(--text-muted); padding:3px 0; font-family:monospace">' + id + '</div>';
  }).join('');
  var html = '<div class="success-card">' +
    '<div class="success-icon">✅</div>' +
    '<div class="success-title">数据源接入成功！</div>' +
    '<div class="success-subtitle">已创建 ' + ids.length + ' 个监控项，正在开始采集额度数据...</div>' +
    '<div class="success-detail">' +
    '<div class="success-detail-row"><span class="label">供应商</span><span class="value">' + (data.name || currentProvider.name) + '</span></div>' +
    '<div class="success-detail-row"><span class="label">类型</span><span class="value">' + (data.type || currentProvider.type) + '</span></div>' +
    '<div class="success-detail-row" style="align-items:flex-start;"><span class="label">服务 ID</span><span class="value" style="display:block;">' + idList + '</span></div>' +
    '<div class="success-detail-row"><span class="label">Key 状态</span><span class="value">' + (data.validateOk === false ? '⚠️ Key 校验失败' : '✓ 正常') + '</span></div>' +
    '<div class="success-detail-row"><span class="label">采集状态</span><span class="value">active</span></div>' +
    '</div>' +
    '<button class="btn-submit" id="btnCloseSuccess">完成</button></div>';
  panel.innerHTML = html;
  document.getElementById('btnCloseSuccess').addEventListener('click', function() {
    document.getElementById('modalOverlay').classList.remove('open');
  });
}

document.getElementById('btnAddSource').addEventListener('click', function() {
  renderProviderGrid();
  currentProvider = null;
  var panel = document.getElementById('providerFormPanel');
  if (panel) panel.innerHTML = '<div class="form-placeholder"><span class="icon">👈</span>请先在左侧选择一个供应商</div>';
  document.getElementById('modalOverlay').classList.add('open');
});
document.getElementById('modalClose').addEventListener('click', function() {
  document.getElementById('modalOverlay').classList.remove('open');
});
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

/* ---- 主题切换 ---- */
document.getElementById('btnTheme').addEventListener('click', function() {
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  this.textContent = isDark ? '🌙' : '☀️';
  renderTrendChart();
  setTimeout(function() {
    if (drawerChartInstance) drawerChartInstance.resize();
  }, 100);
});

/* ========================================================
 * 时间显示 & API 拉取 / 轮询 / Web 通知
 * ======================================================== */
function updateLastTime() {
  var now = new Date();
  var h = (now.getHours() < 10 ? '0' : '') + now.getHours();
  var m = (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
  var s = (now.getSeconds() < 10 ? '0' : '') + now.getSeconds();
  var hint = apiAvailable ? '' : '（未连接）';
  document.getElementById('lastUpdate').textContent = h + ':' + m + ':' + s + hint;
}

function _toTimeLabel(createdAt) {
  if (!createdAt) return '—';
  try {
    var then = new Date(createdAt.replace('Z', 'Z'));
    var diff = Math.floor((Date.now() - then.getTime()) / 1000);
    if (diff < 60) return diff + '秒前';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    return Math.floor(diff / 86400) + '天前';
  } catch (e) { return createdAt; }
}

async function fetchFromBackend(url) {
  try {
    var res = await fetch(url, { mode: 'cors' });
    if (!res.ok) return null;
    return await res.json();
  } catch (err) {
    return null;
  }
}

async function loadAllData() {
  var summary = await fetchFromBackend(API_BASE + '/summary');
  var services = await fetchFromBackend(API_BASE + '/services');
  var alerts = await fetchFromBackend(API_BASE + '/alerts?limit=20');

  if (services && Array.isArray(services.data) && services.data.length) {
    apiAvailable = true;
    servicesState = services.data.map(function(s) {
      if (!s.trend || s.trend.length === 0) s.trend = [s.remaining !== null && s.remaining !== undefined ? s.remaining : 0];
      if (!s.status) s.status = calcStatus(s.remaining, s.total);
      return s;
    });
    if (summary) summaryState = summary;
    if (alerts && Array.isArray(alerts.data)) {
      alertsState = alerts.data.map(function(a) {
        var level = (a.level || 'info');
        if (level === 'critical') level = 'danger';
        return {
          id: a.id,
          level: level,
          target: (a.provider || '') + (a.model ? ' · ' + a.model : ''),
          message: a.message || '',
          timeLabel: _toTimeLabel(a.createdAt)
        };
      });
      alertsState.forEach(function(a) {
        if (a.level === 'danger' && !lastDangerIds[a.id + '_' + (a.createdAt || '')]) {
          lastDangerIds[a.id + '_' + (a.createdAt || '')] = true;
          fireNotification(a);
        }
      });
    }
  } else {
    servicesState = [];
    alertsState = [];
    summaryState = null;
    // 当后端不可用或返回空数据时，正确标记 apiAvailable
    apiAvailable = services !== null;
  }
}

function fireNotification(alert) {
  try {
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
      new Notification('⚠️ 模型额度警告', {
        body: (alert.target || '') + ': ' + (alert.message || '')
      });
    }
  } catch (e) { /* 静默失败，不影响主流程 */ }
}

async function refreshCycle() {
  await loadAllData();
  renderKPI();
  renderTrendChart();
  renderAlerts();
  renderCardGrid(currentFilter);
  if (currentView === 'list') renderListView(currentFilter);
  updateLastTime();
}

/* ========================================================
 * 应用入口：请求通知权限 -> 首屏数据 -> 起轮询
 * ======================================================== */
(async function initApp() {
  if (typeof Notification !== 'undefined' && Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch (e) { /* ignore */ }
  }
  await refreshCycle();
  setInterval(refreshCycle, 6000);    // 每 6 秒重新拉取后端接口
  setInterval(updateLastTime, 1000); // 每秒刷新时间显示
})();

window.addEventListener('resize', function() {
  if (trendChart) trendChart.resize();
  if (drawerChartInstance) drawerChartInstance.resize();
});
</script>
