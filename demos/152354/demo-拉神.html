<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拉神 - 运动后拉伸 (无示意图)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --primary-light: #FF8A5C;
            --primary-glow: rgba(255, 107, 53, 0.3);
            --bg-primary: #0F0F1A;
            --bg-secondary: #1A1A2E;
            --bg-card: rgba(255, 255, 255, 0.06);
            --bg-card-hover: rgba(255, 255, 255, 0.10);
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.40);
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-glow: 0 8px 32px rgba(255, 107, 53, 0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-height: 64px;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0 10px 0;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-nav .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #FF9A56);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .top-nav .brand i {
            font-size: 28px;
            -webkit-text-fill-color: initial;
            color: var(--primary);
        }
        .top-nav .slogan {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .top-nav .nav-links {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            padding: 4px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
        .top-nav .nav-links button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: var(--radius-xs);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .top-nav .nav-links button:hover {
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
        }
        .top-nav .nav-links button.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 12px var(--primary-glow);
        }

        .pages {
            flex: 1;
            overflow: hidden;
            position: relative;
            margin-top: 12px;
        }
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0 4px 20px 4px;
            overflow-y: auto;
            overflow-x: hidden;
            opacity: 0;
            visibility: hidden;
            transform: translateY(12px) scale(0.98);
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0s 0.4s;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .page.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition: opacity 0.4s ease, transform 0.4s ease, visibility 0s 0s;
        }
        .page::-webkit-scrollbar {
            width: 4px;
        }
        .page::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 14px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title .sub {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: auto;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            margin-bottom: 20px;
        }

        .sport-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .sport-item {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 14px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            min-width: 72px;
        }
        .sport-item .icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }
        .sport-item .label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .sport-item.active {
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.10);
        }
        .sport-item.active .icon {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 24px var(--primary-glow);
        }
        .sport-item.active .label {
            color: var(--primary);
        }
        .sport-item:hover {
            transform: translateY(-2px);
        }
        .sport-item:active {
            transform: scale(0.94);
        }

        .plan-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 8px 0 12px 0;
        }
        .plan-actions .action-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-xs);
            font-size: 14px;
            transition: background 0.2s ease;
        }
        .plan-actions .action-item .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
        }
        .plan-actions .action-item .time-tag {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 12px;
            border-radius: 20px;
        }
        .plan-actions .action-item .side-tag {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .btn-start {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--primary-glow);
        }
        .btn-start:active {
            transform: scale(0.96);
        }

        /* ===== 执行页 (无示意图) ===== */
        .exec-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            padding-bottom: 10px;
        }
        .exec-info {
            text-align: center;
            max-width: 500px;
        }
        .exec-info .name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .exec-info .desc {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .exec-info .muscle {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 22px;
            background: rgba(255, 107, 53, 0.15);
            color: var(--primary-light);
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
        }

        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .timer-circle-wrap {
            position: relative;
            width: 140px;
            height: 140px;
        }
        .timer-circle-wrap svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .timer-circle-wrap .bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 6;
        }
        .timer-circle-wrap .progress {
            fill: none;
            stroke: var(--primary);
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 38px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .timer-text .unit {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .exec-controls {
            display: flex;
            gap: 16px;
            margin-top: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .exec-controls button {
            padding: 12px 32px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .exec-controls .btn-pause {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .exec-controls .btn-pause:hover {
            background: var(--bg-card-hover);
        }
        .exec-controls .btn-pause.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .exec-controls .btn-skip {
            background: transparent;
            color: var(--text-muted);
            font-size: 15px;
            padding: 12px 24px;
        }
        .exec-controls .btn-skip:hover {
            color: var(--text-secondary);
        }
        .exec-controls button:active {
            transform: scale(0.94);
        }

        .exec-side-hint {
            padding: 8px 24px;
            border-radius: 30px;
            background: rgba(255, 107, 53, 0.12);
            color: var(--primary-light);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: pulse-glow 1.8s ease-in-out infinite;
            justify-content: center;
            margin-top: 2px;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                opacity: 0.8;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        .exec-progress-dots {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .exec-progress-dots .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        .exec-progress-dots .dot.done {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 14px var(--primary-glow);
        }
        .exec-progress-dots .dot.current {
            border-color: var(--primary);
            background: rgba(255, 107, 53, 0.2);
            box-shadow: 0 0 24px var(--primary-glow);
            transform: scale(1.25);
        }

        .exec-step-info {
            font-size: 16px;
            color: var(--text-muted);
            font-weight: 500;
            text-align: center;
            margin-bottom: 4px;
        }

        .exec-exit-btn {
            margin-top: 8px;
            background: var(--bg-card);
            box-shadow: none;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 10px 28px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .exec-exit-btn:hover {
            background: var(--bg-card-hover);
        }
        .exec-exit-btn:active {
            transform: scale(0.94);
        }

        /* ===== 记录页 ===== */
        .record-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 16px 12px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .stat-card .num {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-primary);
        }
        .stat-card .num.primary {
            color: var(--primary);
        }
        .stat-card .label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .record-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 18px 0;
        }
        .record-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: background 0.2s ease;
        }
        .record-item:hover {
            background: var(--bg-card-hover);
        }
        .record-item .icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 107, 53, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 18px;
            flex-shrink: 0;
        }
        .record-item .info {
            flex: 1;
        }
        .record-item .info .name {
            font-size: 15px;
            font-weight: 600;
        }
        .record-item .info .date {
            font-size: 12px;
            color: var(--text-muted);
        }
        .record-item .rate {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .chart-wrap {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 18px 16px 12px 16px;
            border: 1px solid var(--border-color);
            margin: 6px 0 12px 0;
        }
        .chart-wrap .chart-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-wrap canvas {
            width: 100% !important;
            height: auto !important;
            aspect-ratio: 16/5;
            display: block;
            border-radius: var(--radius-xs);
        }

        /* ===== 方案页 ===== */
        .scheme-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
            margin: 6px 0 16px 0;
        }
        .scheme-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .scheme-item:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
        }
        .scheme-item .icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: rgba(255, 107, 53, 0.10);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
            flex-shrink: 0;
        }
        .scheme-item .info {
            flex: 1;
        }
        .scheme-item .info .name {
            font-size: 16px;
            font-weight: 600;
        }
        .scheme-item .info .desc {
            font-size: 13px;
            color: var(--text-muted);
        }
        .scheme-item .badge {
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 14px;
            border-radius: 20px;
        }

        .custom-entry {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px;
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 4px;
        }
        .custom-entry:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* ===== 我的页 ===== */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 6px 0 16px 0;
        }
        .profile-header .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #FF9A56);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            box-shadow: 0 4px 24px var(--primary-glow);
            flex-shrink: 0;
        }
        .profile-header .info .name {
            font-size: 22px;
            font-weight: 700;
        }
        .profile-header .info .sub {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 14px;
            margin: 6px 0 18px 0;
        }

        .profile-setting {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            margin: 6px 0 10px 0;
        }
        .profile-setting .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .profile-setting .left i {
            font-size: 20px;
            color: var(--text-secondary);
            width: 28px;
            text-align: center;
        }
        .profile-setting .left .label {
            font-size: 15px;
            font-weight: 500;
        }
        .toggle-switch {
            width: 48px;
            height: 28px;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        .toggle-switch .thumb {
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .toggle-switch.active .thumb {
            left: 22px;
        }

        .profile-month-title {
            font-size: 15px;
            font-weight: 600;
            margin: 14px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== 完成遮罩 ===== */
        .complete-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            border-radius: var(--radius-lg);
        }
        .complete-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .complete-overlay .big-icon {
            font-size: 72px;
            color: var(--primary);
            animation: bounce-in 0.6s ease;
        }
        .complete-overlay .title {
            font-size: 28px;
            font-weight: 800;
            margin-top: 18px;
        }
        .complete-overlay .sub {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .complete-overlay .btn-done {
            margin-top: 28px;
            padding: 14px 56px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--primary);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px var(--primary-glow);
        }
        .complete-overlay .btn-done:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--primary-glow);
        }
        .complete-overlay .btn-done:active {
            transform: scale(0.94);
        }

        @keyframes bounce-in {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.2);
                opacity: 1;
            }
            100% {
                transform: scale(1);
            }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: var(--radius-md);
            font-size: 14px;
            color: #fff;
            border: 1px solid var(--border-color);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
            z-index: 200;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .app-container {

    <script>

                    { name: '脊柱扭转', desc: '坐姿，身体向一侧扭转，手扶对侧膝盖', muscle: '脊柱 · 竖脊肌', side: true },
                    { name: '大腿前侧拉伸', desc: '站立，手抓同侧脚踝，膝盖指向地面', muscle: '大腿前侧 · 股四头肌', side: true },

                ]
            }
        };

        const RECORDS = [
            { date: '7月15日', sport: '跑步', rate: 92 },
            { date: '7月14日', sport: '撸铁', rate: 78 },
            { date: '7月13日', sport: '打球', rate: 85 },
            { date: '7月12日', sport: '骑行', rate: 90 },
            { date: '7月11日', sport: '跑步', rate: 65 },
            { date: '7月10日', sport: '其他', rate: 70 },
            { date: '7月9日', sport: '跑步', rate: 88 },
        ];

        const SCHEMES = [
            { name: '跑步必拉', icon: 'fa-running', desc: '6个动作 · 下肢放松', count: 6 },
            { name: '撸铁恢复', icon: 'fa-dumbbell', desc: '5个动作 · 全身拉伸', count: 5 },

            { name: '骑行修复', icon: 'fa-bicycle', desc: '5个动作 · 下肢恢复', count: 5 },
        ];

        // ============================================================
        // 状态
        // ============================================================
        let currentSport = 'running';
        let currentActions = [];
        let currentActionIndex = 0;

        let timerMax = 30;
        let timerInterval = null;
        let isPaused = false;
        let isExecuting = false;
        let currentSide = 0;
        let totalActions = 0;
        let _stepMap = [];
        let _totalSteps = 0;
        let _currentStep = 0;

        // ============================================================

            home: document.getElementById('pageHome'),

            record: document.getElementById('pageRecord'),
            scheme: document.getElementById('pageScheme'),
            me: document.getElementById('pageMe'),
        };

        const navExec = document.getElementById('navExec');

        const planCount = document.getElementById('planCount');
        const planActions = document.getElementById('planActions');
        const btnStart = document.getElementById('btnStart');

        const execBack = document.getElementById('execBack');
        const execStep = document.getElementById('execStep');
        const actionName = document.getElementById('actionName');
        const actionDesc = document.getElementById('actionDesc');
        const actionMuscle = document.getElementById('actionMuscle');
        const timerText = document.getElementById('timerText');
        const timerCircle = document.getElementById('timerCircle');
        const execSideHint = document.getElementById('execSideHint');
        const btnPause = document.getElementById('btnPause');
        const btnSkip = document.getElementById('btnSkip');
        const execDots = document.getElementById('execDots');
        const completeOverlay = document.getElementById('completeOverlay');
        const completeDone = document.getElementById('completeDone');
        const toast = document.getElementById('toast');

        const recordList = document.getElementById('recordList');
        const trendChart = document.getElementById('trendChart');
        const schemeList = document.getElementById('schemeList');
        const customEntry = document.getElementById('customEntry');
        const remindToggle = document.getElementById('remindToggle');
        const monthChart = document.getElementById('monthChart');

        let toastTimer = null;

        // ============================================================
        // 工具函数
        // ============================================================
        function showToast(msg, duration = 1800) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
        }

        function switchPage(pageName) {
            Object.keys(pages).forEach(key => {
                pages[key].classList.toggle('active', key === pageName);
            });
            navBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.page === pageName);
            });
            if (pageName !== 'exec') {
                navExec.style.display = 'none';
            } else {
                navExec.style.display = 'block';
            }
            pages[pageName].scrollTop = 0;
            if (pageName === 'record') {
                renderTrendChart();
            }
            if (pageName === 'me') {
                renderMonthChart();
            }
        }

        // ============================================================
        // 首页 - 运动选择
        // ============================================================
        sportItems.forEach(item => {
            item.addEventListener('click', function() {
                sportItems.forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                currentSport = this.dataset.sport;
                updatePlan();
            });
        });

        function updatePlan() {
            const data = SPORT_DATA[currentSport];
            if (!data) return;
            planName.textContent = data.name;
            planCount.textContent = data.actions.length;
            planActions.innerHTML = '';
            data.actions.forEach((act) => {
                const div = document.createElement('div');
                div.className = 'action-item';
                div.innerHTML = `
                    <span class="dot"></span>
                    <span>${act.name}</span>
                    ${act.side ? '<span class="side-tag">左右</span>' : ''}
                    <span class="time-tag">30s</span>
                `;
                planActions.appendChild(div);
            });
            currentActions = data.actions;
        }

        // ============================================================
        // 开始拉伸
        // ============================================================
        btnStart.addEventListener('click', function() {
            if (currentActions.length === 0) return;
            startExecution();
        });

        function startExecution() {
            isExecuting = true;
            currentActionIndex = 0;
            currentSide = 0;
            navExec.style.display = 'block';
            switchPage('exec');
            buildStepMap();
            renderDots();
            loadAction(0);
            completeOverlay.classList.remove('show');
            navBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.page === 'exec'));
        }

        function buildStepMap() {
            _stepMap = [];
            currentActions.forEach((act, idx) => {
                if (act.side) {
                    _stepMap.push({ idx, side: 0 });
                    _stepMap.push({ idx, side: 1 });
                } else {
                    _stepMap.push({ idx, side: -1 });
                }
            });
            _totalSteps = _stepMap.length;
        }

        function renderDots() {
            execDots.innerHTML = '';
            _stepMap.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i === 0) dot.classList.add('current');
                execDots.appendChild(dot);
            });
        }

        function updateDots(currentStep) {
            const dots = execDots.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.remove('done', 'current');
                if (i < currentStep) dot.classList.add('done');
                if (i === currentStep) dot.classList.add('current');
            });
        }

        function loadAction(stepIndex) {
            if (!_stepMap || stepIndex >= _stepMap.length) {
                finishExecution();
                return;
            }
            const step = _stepMap[stepIndex];
            const action = currentActions[step.idx];
            const isSide = step.side >= 0;
            const sideLabel = isSide ? (step.side === 0 ? '左' : '右') : '';

            actionName.textContent = isSide ? `${sideLabel}侧 ${action.name}` : action.name;
            actionDesc.textContent = action.desc;
            actionMuscle.innerHTML = `<i class="fas fa-bullseye"></i> ${action.muscle}`;
            execStep.textContent = `${stepIndex + 1} / ${_stepMap.length}`;

            if (isSide) {
                execSideHint.style.display = 'flex';
                execSideHint.innerHTML = `<i class="fas fa-arrows-left-right"></i> ${sideLabel}侧 · 换边提示`;
            } else {
                execSideHint.style.display = 'none';
            }

            timerMax = 30;
            timerSeconds = 30;
            timerText.innerHTML = `30 <span class="unit">s</span>`;
            updateCircle(30, 30);
            isPaused = false;
            btnPause.innerHTML = '<i class="fas fa-pause"></i> 暂停';
            btnPause.classList.remove('active');

            updateDots(stepIndex);
            _currentStep = stepIndex;
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPaused) return;
                timerSeconds -= 1;
                timerText.innerHTML = `${timerSeconds} <span class="unit">s</span>`;
                updateCircle(timerSeconds, timerMax);
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    const nextStep = _currentStep + 1;
                    if (nextStep < _totalSteps) {
                        loadAction(nextStep);
                    } else {
                        finishExecution();
                    }
                }
            }, 1000);
        }

        function updateCircle(current, max) {
            const circumference = 263.89;
            const progress = current / max;
            const offset = circumference * (1 - progress);
            timerCircle.setAttribute('stroke-dashoffset', offset);
        }

        // ============================================================
        // 执行控制
        // ============================================================
        btnPause.addEventListener('click', function() {
            if (!isExecuting) return;
            isPaused = !isPaused;
            if (isPaused) {
                btnPause.innerHTML = '<i class="fas fa-play"></i> 继续';
                btnPause.classList.add('active');
            } else {
                btnPause.innerHTML = '<i class="fas fa-pause"></i> 暂停';
                btnPause.classList.remove('active');
            }
        });

        btnSkip.addEventListener('click', function() {
            if (!isExecuting) return;
            clearInterval(timerInterval);
            const nextStep = _currentStep + 1;
            if (nextStep < _totalSteps) {
                loadAction(nextStep);
            } else {
                finishExecution();
            }
        });

        execBack.addEventListener('click', function() {
            if (isExecuting) {
                if (confirm('确定要退出拉伸吗？进度将不会保存。')) {
                    clearInterval(timerInterval);
                    isExecuting = false;
                    navExec.style.display = 'none';
                    switchPage('home');
                    showToast('已退出拉伸');
                }
            } else {
                switchPage('home');
            }
        });

        function finishExecution() {
            clearInterval(timerInterval);
            isExecuting = false;
            completeOverlay.classList.add('show');
            updateRecords();
        }

        completeDone.addEventListener('click', function() {
            completeOverlay.classList.remove('show');
            navExec.style.display = 'none';
            switchPage('home');
            showToast('🎉 拉伸完成，恢复更高效！');
        });

        // ============================================================
        // 更新记录
        // ============================================================
        function updateRecords() {
            const sportNames = {
                running: '跑步',
                gym: '撸铁',
                ball: '打球',
                cycle: '骑行',
                other: '其他'
            };
            const rate = Math.floor(Math.random() * 15) + 80;
            const newRecord = {
                date: new Date().toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' }),
                sport: sportNames[currentSport] || '运动',
                rate: rate
            };
            RECORDS.unshift(newRecord);
            if (RECORDS.length > 7) RECORDS.pop();
            renderRecords();
            renderTrendChart();
        }

        // ============================================================
        // 渲染记录
        // ============================================================
        function renderRecords() {
            recordList.innerHTML = '';
            RECORDS.slice(0, 7).forEach(r => {
                const div = document.createElement('div');
                div.className = 'record-item';
                const iconMap = { '跑步': 'fa-running', '撸铁': 'fa-dumbbell', '打球': 'fa-basketball-ball', '骑行': 'fa-bicycle',
                    '其他': 'fa-plus' };
                const icon = iconMap[r.sport] || 'fa-running';
                div.innerHTML = `
                    <div class="icon"><i class="fas ${icon}"></i></div>
                    <div class="info">
                        <div class="name">${r.sport}</div>
                        <div class="date">${r.date}</div>
                    </div>
                    <div class="rate">${r.rate}%</div>
                `;
                recordList.appendChild(div);
            });
        }

        // ============================================================
        // 趋势图
        // ============================================================
        function renderTrendChart() {
            const canvas = trendChart;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const data = RECORDS.slice(0, 7).reverse();
            const values = data.map(r => r.rate);
            const labels = data.map(r => r.date.replace(/月/g, '/').replace(/日/g, ''));

            const pad = { top: 20, bottom: 30, left: 30, right: 20 };
            const chartW = w - pad.left - pad.right;
            const chartH = h - pad.top - pad.bottom;
            const maxVal = 100;
            const minVal = 40;

            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                const y = pad.top + chartH - (i / 4) * chartH;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(w - pad.right, y);
                ctx.stroke();
            }

            if (values.length > 0) {
                const points = values.map((v, i) => {
                    const x = pad.left + (i / (values.length - 1 || 1)) * chartW;
                    const y = pad.top + chartH - ((v - minVal) / (maxVal - minVal)) * chartH;
                    return { x, y };
                });

                ctx.beginPath();
                ctx.moveTo(points[0].x, pad.top + chartH);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.lineTo(points[points.length - 1].x, pad.top + chartH);
                ctx.closePath();
                const grad = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
                grad.addColorStop(0, 'rgba(255,107,53,0.25)');
                grad.addColorStop(1, 'rgba(255,107,53,0.02)');
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                points.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.strokeStyle = '#FF6B35';
                ctx.lineWidth = 2.5;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';
                ctx.stroke();

                points.forEach((p, i) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#FF6B35';
                    ctx.fill();
                    ctx.shadowColor = 'rgba(255,107,53,0.4)';
                    ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(values[i] + '%', p.x, p.y - 12);
                });

                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                labels.forEach((label, i) => {
                    const x = pad.left + (i / (labels.length - 1 || 1)) * chartW;
                    ctx.fillText(label, x, h - 6);
                });
            }
        }

        // ============================================================
        // 月度图表
        // ============================================================
        function renderMonthChart() {
            const canvas = monthChart;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const days = 30;
            const cols = 7;
            const rows = Math.ceil(days / cols);
            const size = Math.min((w - 40) / cols, (h - 20) / rows);
            const offsetX = (w - size * cols) / 2;
            const offsetY = (h - size * rows) / 2;

            const today = new Date();
            const month = today.getMonth();
            const year = today.getFullYear();
            const firstDay = new Date(year, month, 1).getDay();

            for (let i = 0; i < days; i++) {
                const day = i + 1;
                const col = (i + firstDay) % cols;
                const row = Math.floor((i + firstDay) / cols);
                const x = offsetX + col * size;
                const y = offsetY + row * size;

                const done = Math.random() > 0.35;
                const intensity = done ? 0.5 + Math.random() * 0.5 : 0.1;

                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, size - 2, size - 2, 3);
                if (done) {
                    const alpha = 0.3 + intensity * 0.5;
                    ctx.fillStyle = `rgba(255,107,53,${alpha})`;
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.06)';
                }
                ctx.fill();

                if (done) {
                    ctx.fillStyle = 'rgba(255,107,53,0.5)';
                    ctx.font = `${size * 0.5}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('✓', x + size / 2, y + size / 2 + 1);
                }

                if (size > 12) {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = `${Math.min(size * 0.3, 8)}px sans-serif`;
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText(day, x + size - 2, y + size - 2);
                }
            }

            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.font = '9px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            ctx.fillText(`${monthNames[month]} ${year}`, 4, h - 2);
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.textAlign = 'right';
            ctx.fillText('已完成 ✓', w - 4, h - 2);
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ============================================================
        // 渲染方案
        // ============================================================
        function renderSchemes() {
            schemeList.innerHTML = '';
            SCHEMES.forEach(s => {
                const div = document.createElement('div');
                div.className = 'scheme-item';
                div.innerHTML = `
                    <div class="icon"><i class="fas ${s.icon}"></i></div>
                    <div class="info">
                        <div class="name">${s.name}</div>
                        <div class="desc">${s.desc}</div>
                    </div>
                    <div class="badge">${s.count} 动作</div>
                `;
                div.addEventListener('click', function() {
                    showToast(`已加载「${s.name}」方案`);
                });
                schemeList.appendChild(div);
            });
        }

        // ============================================================
        // 导航切换
        // ============================================================
        navBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const page = this.dataset.page;
                if (page === 'exec' && !isExecuting) {
                    showToast('暂无进行中的拉伸');
                    return;
                }
                if (page === 'exec') {
                    switchPage('exec');
                } else {
                    if (isExecuting && page !== 'exec') {
                        if (!confirm('拉伸进行中，切换到其他页面会中断，确定吗？')) return;
                        clearInterval(timerInterval);
                        isExecuting = false;
                        navExec.style.display = 'none';
                    }
                    switchPage(page);
                }
            });
        });

        // ============================================================
        // 其他交互
        // ============================================================
        customEntry.addEventListener('click', function() {
            showToast('✨ 自定义组合功能开发中');
        });

        remindToggle.addEventListener('click', function() {
            this.classList.toggle('active');
            showToast(this.classList.contains('active') ? '🔔 提醒已开启' : '🔕 提醒已关闭');
        });

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            updatePlan();
            renderRecords();
            renderTrendChart();
            renderSchemes();
            renderMonthChart();

            // 初始化执行页默认状态
            buildStepMap();
            renderDots();
            // 显示第一个动作的信息（但未开始）
            if (currentActions.length > 0) {
                const first = currentActions[0];
                actionName.textContent = first.name;
                actionDesc.textContent = first.desc;
                actionMuscle.innerHTML = `<i class="fas fa-bullseye"></i> ${first.muscle}`;
                execStep.textContent = `1 / ${_totalSteps}`;
                execSideHint.style.display = 'flex';
                execSideHint.innerHTML = `<i class="fas fa-arrows-left-right"></i> 左腿 · 换边提示`;
                timerText.innerHTML = `30 <span class="unit">s</span>`;
                updateCircle(30, 30);
            }

            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (pages.record.classList.contains('active')) renderTrendChart();
                    if (pages.me.classList.contains('active')) renderMonthChart();
                }, 300);
            });

            console.log('🏋️ 拉神 Web 版 (无示意图) 已加载');
        }

        init();
        window.__app = { currentSport, currentActions, isExecuting, RECORDS, SCHEMES, switchPage, showToast };
    </script>
