<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国哲学文献查索智能体</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary-color: #8B4513;
    --secondary-color: #D4AF37;
    --accent-color: #CD853F;
    --bg-color: #FAF8F5;
    --text-color: #333;
    --light-text: #666;
    --border-color: #E8E4DF;
    --card-bg: #FFFFFF;
}

body {
    font-family: 'Noto Serif SC', 'SimSun', serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    line-height: 1.8;
}

.app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.header {
    background: linear-gradient(135deg, #8B4513 0%, #A0522D 50%, #6B3E26 100%);
    padding: 40px 20px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(139, 69, 19, 0.3);
}

.header-content .title {
    font-size: 2rem;
    color: #fff;
    margin-bottom: 10px;
    font-weight: 600;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.header-content .subtitle {
    font-size: 1.1rem;
    color: #FFE4B5;
    font-style: italic;
}

.main {
    flex: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px;
    width: 100%;
}

.search-section {
    margin-bottom: 40px;
}

.search-box {
    display: flex;
    max-width: 600px;
    margin: 0 auto 20px;
    border-radius: 50px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

#search-input {
    flex: 1;
    padding: 15px 25px;
    border: none;
    font-size: 1rem;
    background: #fff;
    outline: none;
    font-family: inherit;
}

.search-btn {
    background: linear-gradient(135deg, #8B4513, #A0522D);
    border: none;
    padding: 15px 25px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.search-btn:hover {
    background: linear-gradient(135deg, #A0522D, #8B4513);
    transform: scale(1.05);
}

.search-icon {
    font-size: 1.2rem;
}

.filter-tabs {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.filter-tab {
    padding: 10px 25px;
    border: 2px solid var(--border-color);
    background: #fff;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    font-size: 0.9rem;
}

.filter-tab:hover {
    border-color: var(--primary-color);
    color: var(--primary-color);
}

.filter-tab.active {
    background: var(--primary-color);
    color: #fff;
    border-color: var(--primary-color);
}

.books-section {
    margin-bottom: 40px;
}

.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
}

.book-card {
    background: var(--card-bg);
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
    cursor: pointer;
}

.book-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
}

.book-cover {
    height: 200px;
    background: linear-gradient(135deg, #F5DEB3 0%, #DEB887 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.book-cover::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    border: 2px solid rgba(139, 69, 19, 0.2);
    border-radius: 8px;
}

.cover-icon {
    font-size: 4rem;
    color: var(--primary-color);
    font-weight: bold;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.book-title {
    padding: 20px 20px 10px;
    font-size: 1.4rem;
    color: var(--primary-color);
    border-bottom: 1px solid var(--border-color);
}

.book-author {
    padding: 10px 20px;
    color: var(--light-text);
    font-size: 0.9rem;
}

.book-summary {
    padding: 0 20px 15px;
    color: var(--text-color);
    font-size: 0.9rem;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.read-btn {
    margin: 0 20px 20px;
    width: calc(100% - 40px);
    padding: 12px;
    background: linear-gradient(135deg, var(--primary-color), #A0522D);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.read-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 15px rgba(139, 69, 19, 0.3);
}

.chapters-section,
.search-results {
    display: none;
}

.chapters-section.active,
.search-results.active {
    display: block;
    margin-bottom: 40px;
}

.section-title {
    font-size: 1.5rem;
    color: var(--primary-color);
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--secondary-color);
    position: relative;
}

.section-title::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 60px;
    height: 2px;
    background: var(--primary-color);
}

.chapters-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.chapter-item {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    cursor: pointer;
    transition: all 0.3s ease;
    border-left: 4px solid var(--border-color);
}

.chapter-item:hover {
    border-left-color: var(--primary-color);
    transform: translateX(5px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
}

.chapter-item h4 {
    color: var(--primary-color);
    margin-bottom: 8px;
    font-size: 1.1rem;
}

.chapter-item .chapter-preview {
    color: var(--light-text);
    font-size: 0.9rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.reader-section {
    display: none;
}

.reader-section.active {
    display: block;
    background: var(--card-bg);
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    overflow: hidden;
}

.reader-header {
    display: flex;
    align-items: center;
    padding: 20px 25px;
    background: linear-gradient(135deg, #FAF8F5, #F5F0E8);
    border-bottom: 1px solid var(--border-color);
}

.back-btn {
    background: none;
    border: none;
    color: var(--primary-color);
    font-size: 1.2rem;
    cursor: pointer;
    margin-right: 20px;
    padding: 8px 15px;
    border-radius: 8px;
    transition: all 0.3s ease;
}

.back-btn:hover {
    background: rgba(139, 69, 19, 0.1);
}

.reader-title {
    font-size: 1.4rem;
    color: var(--primary-color);
}

.reader-content {
    padding: 30px;
    font-size: 1.1rem;
    line-height: 2;
    color: var(--text-color);
    text-align: justify;
    white-space: pre-wrap;
    font-family: 'Noto Serif SC', 'SimSun', serif;
}

.reader-keywords {
    padding: 20px 30px 30px;
    border-top: 1px solid var(--border-color);
}

.reader-keywords .keywords-label {
    color: var(--light-text);
    font-size: 0.9rem;
    margin-bottom: 10px;
    display: block;
}

.keyword-tag {
    display: inline-block;
    background: linear-gradient(135deg, rgba(139, 69, 19, 0.1), rgba(160, 82, 45, 0.1));
    color: var(--primary-color);
    padding: 6px 15px;
    border-radius: 20px;
    margin: 5px;
    font-size: 0.9rem;
    border: 1px solid rgba(139, 69, 19, 0.2);
}

.results-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.result-item {
    background: var(--card-bg);
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    cursor: pointer;
    transition: all 0.3s ease;
}

.result-item:hover {
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
}

.result-item .result-header {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
}

.result-item .book-label {
    background: var(--primary-color);
    color: #fff;
    padding: 4px 12px;
    border-radius: 15px;
    font-size: 0.8rem;
    margin-right: 10px;
}

.result-item .chapter-title {
    color: var(--primary-color);
    font-weight: 600;
}

.result-item .result-preview {
    color: var(--text-color);
    font-size: 0.95rem;
    line-height: 1.7;
}

.result-item .highlight {
    background: #FFF8DC;
    padding: 2px 4px;
    border-radius: 3px;
}

.footer {
    text-align: center;
    padding: 30px;
    background: #F5F0E8;
    color: var(--light-text);
    font-size: 0.9rem;
}

@media (max-width: 768px) {
    .header-content .title {
        font-size: 1.5rem;
    }

    .books-grid {
        grid-template-columns: 1fr;
    }

    .reader-content {
        padding: 20px;
        font-size: 1rem;
    }

    .search-box {
        margin: 0 10px 20px;
    }
}
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <h1 class="title">中国哲学文献查索智能体</h1>
                <p class="subtitle">《张载集》·《庄子》</p>
            </div>
        </header>

        <main class="main">
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="输入关键词检索文献...">
                    <button id="search-btn" class="search-btn">
                        <span class="search-icon">🔍</span>
                    </button>
                </div>
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">全部</button>
                    <button class="filter-tab" data-filter="zhuangzi">庄子</button>
                    <button class="filter-tab" data-filter="zhangzai">张载集</button>
                </div>
            </div>

            <div class="books-section">
                <div class="books-grid">
                    <div class="book-card" data-book="zhuangzi">
                        <div class="book-cover">
                            <div class="cover-icon">庄</div>
                        </div>
                        <h3 class="book-title">庄子</h3>
                        <p class="book-author">庄周 · 战国</p>
                        <p class="book-summary">道家学派重要著作，以丰富想象和深刻哲理著称</p>
                        <button class="read-btn" data-book="zhuangzi">阅读</button>
                    </div>

                    <div class="book-card" data-book="zhangzai">
                        <div class="book-cover">
                            <div class="cover-icon">张</div>
                        </div>
                        <h3 class="book-title">张载集</h3>
                        <p class="book-author">张载 · 北宋</p>
                        <p class="book-summary">关学思想集大成之作，提出太虚即气等重要命题</p>
                        <button class="read-btn" data-book="zhangzai">阅读</button>
                    </div>
                </div>
            </div>

            <div class="chapters-section" id="chapters-section">
                <h2 class="section-title">章节列表</h2>
                <div class="chapters-list" id="chapters-list"></div>
            </div>

            <div class="reader-section" id="reader-section">
                <div class="reader-header">
                    <button id="back-btn" class="back-btn">← 返回</button>
                    <h3 class="reader-title" id="reader-title"></h3>
                </div>
                <div class="reader-content" id="reader-content"></div>
                <div class="reader-keywords" id="reader-keywords"></div>
            </div>

            <div class="search-results" id="search-results">
                <h2 class="section-title">检索结果</h2>
                <div class="results-list" id="results-list"></div>
            </div>
        </main>

        <footer class="footer">
            <p>中国哲学文献查索智能体 · 传承经典智慧</p>
        </footer>
    </div>

    <script>
const literatureData = {

        {

                    keywords: ['齐物', '天籁', '地籁', '人籁', '吾丧我']
                },
                {
                    id: 'xiaoyaoyou',
                    title: '逍遥游',
                    content: '北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。《齐谐》者，志怪者也。《谐》之言曰：「鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。」野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。且夫水之积也不厚，则其负大舟也无力。覆杯水于坳堂之上，则芥为之舟，置杯焉则胶，水浅而舟大也。风之积也不厚，则其负大翼也无力。故九万里，则风斯在下矣，而后乃今培风；背负青天而莫之夭阏者，而后乃今将图南。',
                    keywords: ['鲲鹏', '逍遥', '大鹏', '天池', '扶摇']

                {

                    title: '养生主',
                    content: '吾生也有涯，而知也无涯。以有涯随无涯，殆已！已而为知者，殆而已矣！为善无近名，为恶无近刑。缘督以为经，可以保身，可以全生，可以养亲，可以尽年。庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。合于《桑林》之舞，乃中《经首》之会。文惠君曰：「嘻，善哉！技盖至此乎？」庖丁释刀对曰：「臣之所好者道也，进乎技矣。始臣之解牛之时，所见无非牛者。三年之后，未尝见全牛也。方今之时，臣以神遇而不以目视，官知止而神欲行。依乎天理，批大郤，导大窾，因其固然。技经肯綮之未尝，而况大乎！良庖岁更刀，割也；族庖月更刀，折也。今臣之刀十九年矣，所解数千牛矣，而刀刃若新发于硎。彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣，是以十九年而刀刃若新发于硎。」',

                {
                    id: 'ximing',
                    title: '西铭',
                    content: '乾称父，坤称母；予兹藐焉，乃混然中处。故天地之塞，吾其体；天地之帅，吾其性。民，吾同胞；物，吾与也。大君者，吾父母宗子；其大臣，宗子之家相也。尊高年，所以长其长；慈孤弱，所以幼其幼；圣，其合德；贤，其秀也。凡天下疲癃残疾、惸独鳏寡，皆吾兄弟之颠连而无告者也。于时保之，子之翼也；乐且不忧，纯乎孝者也。违曰悖德，害仁曰贼，济恶者不才，其践形，惟肖者也。知化则善述其事，穷神则善继其志。不愧屋漏为无忝，存心养性为匪懈。恶旨酒，崇伯子之顾养；育英才，颍封人之锡类。不弛劳而底豫，舜其功也；无所逃而待烹，申生其恭也。体其受而归全者，参乎！勇于从而顺令者，伯奇也。富贵福泽，将厚吾之生也；贫贱忧戚，庸玉汝于成也。存，吾顺事；没，吾宁也。',

                    content: '太虚无形，气之本体；其聚其散，变化之客形尔。至静无感，性之渊源；有识有知，物交之客感尔。客感客形与无感无形，惟尽性者一之。天地之气，虽聚散、攻取百涂，然其为理也顺而不妄。气之为物，散入无形，适得吾体；聚为有象，不失吾常。太虚不能无气，气不能不聚而为万物，万物不能不散而为太虚。循是出入，是皆不得已而然也。',
                    keywords: ['太虚', '气', '太极', '万物', '性']
                },
                {
                    id: 'xingxue',
                    title: '性理拾遗',
                    content: '性者万物之一源，非有我之得私也。惟大人为能尽其道，是故立必俱立，知必周知，爱必兼爱，成不独成。彼自蔽塞而不知顺吾理者，则亦未如之何矣。故圣人语性与天道之极，尽于参伍之神变易而已。诸子浅妄，有有无之分，非穷理之学也。',
                    keywords: ['性', '理', '万物', '圣人', '天道']

                {

                    title: '正蒙·太和',
                    content: '太和所谓道，中涵浮沉、升降、动静、相感之性，是生缊、相荡、胜负、屈伸之始。其来也几微易简，其究也广大坚固。起知于易者乾乎！效法于简者坤乎！散殊而可象为气，清通而不可象为神。不如野马、絪缊，不足谓之太和。语道者知此，谓之知道；学《易》者见此，谓之见《易》。不如是，虽周公才美，其智不足称也已。',
                    keywords: ['太和', '道', '气', '神', '易']
                }
            ]
        }
    ]
};

class LiteratureSearch {
    constructor() {
        this.currentBook = null;
        this.currentChapter = null;
        this.filter = 'all';
        this.init();
    }

    init() {
        this.bindEvents();
        this.loadBooks();
    }

    bindEvents() {
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const backBtn = document.getElementById('back-btn');
        const filterTabs = document.querySelectorAll('.filter-tab');
        const readBtns = document.querySelectorAll('.read-btn');

        searchBtn.addEventListener('click', () => this.search());
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') this.search();
        });

        backBtn.addEventListener('click', () => this.goBack());

        filterTabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                filterTabs.forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                this.filter = e.target.dataset.filter;
                this.search();
            });
        });

        readBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const bookId = e.target.dataset.book;
                this.showChapters(bookId);
            });
        });

        document.querySelectorAll('.book-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if (!e.target.classList.contains('read-btn')) {
                    const bookId = card.dataset.book;
                    this.showChapters(bookId);
                }
            });
        });
    }

    loadBooks() {
        this.hideSections(['chapters-section', 'reader-section', 'search-results']);
        this.showSection('books-section');
    }

    showChapters(bookId) {
        this.currentBook = bookId;
        const book = literatureData.books.find(b => b.id === bookId);
        
        if (!book) return;

        const chaptersList = document.getElementById('chapters-list');
        chaptersList.innerHTML = book.chapters.map(chapter => `
            <div class="chapter-item" data-book="${bookId}" data-chapter="${chapter.id}">
                <h4>${chapter.title}</h4>
                <p class="chapter-preview">${chapter.content.substring(0, 100)}...</p>
            </div>
        `).join('');

        document.querySelectorAll('.chapter-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const bookId = e.currentTarget.dataset.book;
                const chapterId = e.currentTarget.dataset.chapter;
                this.showReader(bookId, chapterId);
            });
        });

        this.hideSections(['books-section', 'reader-section', 'search-results']);
        this.showSection('chapters-section');
    }

    showReader(bookId, chapterId) {
        const book = literatureData.books.find(b => b.id === bookId);
        const chapter = book?.chapters.find(c => c.id === chapterId);

        if (!book || !chapter) return;

        document.getElementById('reader-title').textContent = `${book.title} · ${chapter.title}`;
        document.getElementById('reader-content').textContent = chapter.content;
        
        const keywordsContainer = document.getElementById('reader-keywords');
        keywordsContainer.innerHTML = `
            <span class="keywords-label">关键词：</span>
            ${chapter.keywords.map(k => `<span class="keyword-tag">${k}</span>`).join('')}
        `;

        this.hideSections(['books-section', 'chapters-section', 'search-results']);
        this.showSection('reader-section');
    }

    search() {
        const query = document.getElementById('search-input').value.trim();
        
        if (!query) {
            this.loadBooks();
            return;
        }

        const results = [];
        
        literatureData.books.forEach(book => {
            if (this.filter !== 'all' && book.id !== this.filter) return;
            
            book.chapters.forEach(chapter => {
                const contentLower = chapter.content.toLowerCase();
                const titleLower = chapter.title.toLowerCase();
                const queryLower = query.toLowerCase();
                
                if (contentLower.includes(queryLower) || 
                    titleLower.includes(queryLower) ||
                    chapter.keywords.some(k => k.toLowerCase().includes(queryLower))) {
                    
                    let preview = chapter.content;
                    const index = contentLower.indexOf(queryLower);
                    if (index !== -1) {
                        const start = Math.max(0, index - 30);
                        const end = Math.min(chapter.content.length, index + query.length + 30);
                        preview = (start > 0 ? '...' : '') + 
                                  chapter.content.substring(start, end) + 
                                  (end < chapter.content.length ? '...' : '');
                        preview = preview.replace(new RegExp(query, 'gi'), '<span class="highlight">$&</span>');
                    } else {
                        preview = chapter.content.substring(0, 100) + '...';
                    }
                    
                    results.push({
                        bookId: book.id,
                        bookTitle: book.title,
                        chapterId: chapter.id,
                        chapterTitle: chapter.title,
                        preview: preview
                    });
                }
            });
        });

        const resultsList = document.getElementById('results-list');
        
        if (results.length === 0) {
            resultsList.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">未找到相关内容</p>';
        } else {
            resultsList.innerHTML = results.map(result => `
                <div class="result-item" data-book="${result.bookId}" data-chapter="${result.chapterId}">
                    <div class="result-header">
                        <span class="book-label">${result.bookTitle}</span>
                        <span class="chapter-title">${result.chapterTitle}</span>
                    </div>
                    <p class="result-preview">${result.preview}</p>
                </div>
            `).join('');

            document.querySelectorAll('.result-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const bookId = e.currentTarget.dataset.book;
                    const chapterId = e.currentTarget.dataset.chapter;
                    this.showReader(bookId, chapterId);
                });
            });
        }

        this.hideSections(['books-section', 'chapters-section', 'reader-section']);
        this.showSection('search-results');
    }

    goBack() {
        const readerSection = document.getElementById('reader-section');
        const chaptersSection = document.getElementById('chapters-section');
        
        if (readerSection.classList.contains('active')) {
            this.showChapters(this.currentBook);
        } else if (chaptersSection.classList.contains('active')) {
            this.loadBooks();
        } else {
            this.loadBooks();
        }
    }

    showSection(sectionId) {
        const section = document.getElementById(sectionId) || 
                       document.querySelector(`.${sectionId}`);
        if (section) {
            section.classList.add('active');
        }
    }

    hideSections(sectionIds) {
        sectionIds.forEach(id => {
            const section = document.getElementById(id) || 
                           document.querySelector(`.${id}`);
            if (section) {
                section.classList.remove('active');
            }
        });
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new LiteratureSearch();
});
    </script>
</body>
</html>
