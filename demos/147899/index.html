<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么 · AI 决策小游戏</title>
<style>
:root{
  --tomato:#E8472B; --tomato-d:#C9381F; --yolk:#F5A623; --herb:#5FA052;
  --cream:#FBF3E8; --paper:#FFFDF9; --ink:#3A2E28; --gray:#8A7B70; --line:#F0E0CC;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
body{background:#EAD9C2;display:flex;justify-content:center;padding:20px;min-height:100vh;}
.phone{width:360px;background:var(--cream);border-radius:36px;box-shadow:0 16px 50px rgba(120,70,30,.25);overflow:hidden;position:relative;border:6px solid #fff;}
.screen{display:none;padding:22px 20px 26px;min-height:684px;}
.screen.active{display:block;}
.statusbar{display:flex;justify-content:space-between;font-size:12px;color:var(--ink);margin-bottom:10px;}
.appbar{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:800;color:var(--tomato);}
.logo{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD27A,var(--yolk));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 3px 8px rgba(245,166,35,.4);}
.appsub{font-size:12px;color:var(--gray);margin:4px 0 18px;}
.label{font-size:14px;font-weight:800;color:var(--ink);margin:6px 0 10px;display:flex;align-items:center;gap:7px;}
.label::before{content:"";width:4px;height:15px;background:var(--tomato);border-radius:2px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.chip{padding:9px 14px;border-radius:16px;background:#FFF1E0;color:var(--tomato-d);font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid transparent;user-select:none;transition:.15s;}
.chip.on{background:var(--tomato);color:#fff;box-shadow:0 4px 10px rgba(232,71,43,.3);}
.pref{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.pref .pill{font-size:12px;color:var(--gray);background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px;}
.pref .pill b{color:var(--ink);}
.btn{width:100%;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#F4623F,var(--tomato));color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(232,71,43,.32);}
.btn.ghost{background:#fff;color:var(--tomato);border:1.8px solid var(--tomato);box-shadow:none;}
.btn.douyin{background:#161823;color:#fff;box-shadow:0 6px 16px rgba(20,20,35,.3);display:flex;align-items:center;justify-content:center;gap:9px;font-size:14px;}
.btn.douyin .ico{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,#25F4EE,#FE2C55);display:inline-block;}
.btn.douyin .txt{font-weight:700;}
.footer{font-size:11px;color:var(--gray);text-align:center;margin-top:16px;}
.result-card{position:relative;background:linear-gradient(160deg,#FFF3E6,#FFE3D0);border-radius:22px;padding:22px 18px 20px;margin:8px 0 16px;border:1px solid #FBD9C2;overflow:hidden;}
.plate{position:absolute;right:-34px;top:-34px;width:128px;height:128px;border-radius:50%;border:14px solid #ffffff66;}
.dish{font-size:27px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:9px;}
.meta{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;}
.meta span{font-size:12px;background:#fff;color:var(--gray);padding:5px 11px;border-radius:11px;border:1px solid var(--line);}
.meta .hot{color:var(--tomato-d);font-weight:700;}
.ings{margin:6px 0 12px;}
.ing{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:#fff;border-radius:12px;margin-bottom:8px;font-size:14px;border:1px solid var(--line);}
.ing .miss{color:#E03B3B;font-weight:700;}
.ing .ok{color:var(--herb);font-weight:700;}
.shop{background:#FDECEC;border:1px solid #F6CFCF;color:#C0322F;border-radius:13px;padding:12px;font-size:13px;margin-bottom:16px;}
.row{display:flex;gap:12px;}
.row .btn{flex:1;}
.egg{font-size:12px;color:var(--gray);text-align:center;margin-top:14px;}
.steps{margin:10px 0 14px;}
.step{display:flex;gap:11px;margin-bottom:14px;font-size:14px;color:var(--ink);line-height:1.55;}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--yolk);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.note{font-size:11px;color:var(--gray);text-align:center;margin-top:8px;}
.back{font-size:13px;color:var(--gray);margin-bottom:12px;cursor:pointer;display:inline-block;font-weight:600;}
.confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none;}
</style>
</head>
<body>
<div class="phone">
  <!-- Home -->
  <div class="screen active" id="home">
    <div class="statusbar"><span>9:41</span><span>🔋</span></div>
    <div class="appbar"><span class="logo">🍳</span>今天吃什么</div>
    <div class="appsub">冰箱有啥就吃啥，让 AI 替你纠结</div>
    <div class="label">冰箱里有什么？</div>
    <div class="chips" id="chips"></div>
    <div class="label">口味偏好</div>
    <div class="pref">
      <span class="pill">口味 <b>家常</b></span>
      <span class="pill">忌口 <b>不要辣</b></span>
      <span class="pill">人数 <b>2人</b></span>
    </div>
    <button class="btn" onclick="draw()">🎲 抽签决定吃什么</button>
    <div class="footer">已收录 1286 道菜谱 · 按你手头的食材智能匹配</div>
  </div>
  <!-- Result -->
  <div class="screen" id="result">
    <div class="statusbar"><span>9:41</span><span>🔋</span></div>
    <div class="appsub" style="margin:0 0 8px;color:var(--tomato);font-weight:800;">🎉 为你抽到</div>
    <div class="result-card">
      <div class="plate"></div>
      <div class="dish" id="dishName">番茄炒蛋 🍅🍳</div>
      <div class="meta" id="dishMeta"></div>
    </div>
    <div class="label">需要准备</div>
    <div class="ings" id="ings"></div>
    <div class="shop" id="shop"></div>
    <div class="row">
      <button class="btn ghost" onclick="draw()">换一道</button>
      <button class="btn" onclick="showRecipe()">就它了 · 看做法</button>
    </div>
    <button class="btn douyin" style="margin-top:12px" onclick="openDouyin()"><span class="ico"></span><span class="txt">抖音 · 看真实做法视频</span></button>
    <div class="egg">据说今天吃这个，心情会变好 😊</div>
  </div>
  <!-- Recipe -->
  <div class="screen" id="recipe">
    <div class="statusbar"><span>9:41</span><span>🔋</span></div>
    <span class="back" onclick="go('result')">‹ 返回</span>
    <div class="appbar" id="rcName" style="font-size:22px">番茄炒蛋</div>
    <div class="appsub" id="rcMeta">简单 · 15分钟 · 2人份</div>
    <div class="steps" id="steps"></div>
    <button class="btn" onclick="finish()">完成 · 开吃 🍽</button>
    <button class="btn douyin" style="margin-top:12px" onclick="openDouyin()"><span class="ico"></span><span class="txt">抖音 · 看真实做法视频</span></button>
    <div class="note">视频来自抖音真实做菜内容，跟着大厨边看边做</div>
  </div>
  <canvas class="confetti" id="confetti"></canvas>
</div>
<script>
const POOL=["鸡蛋","番茄","土豆","青菜","猪肉","鸡肉","牛肉","豆腐","米饭","面条","青椒","葱","蒜","辣椒"];
const RECIPES=[
 {name:"番茄炒蛋",emoji:"🍅🍳",level:"简单",time:15,servings:2,tags:["家常","下饭"],ings:["番茄","鸡蛋","葱"],steps:["鸡蛋打散加少许盐，番茄切块","热油下蛋液炒至凝固盛出","下番茄炒出汁，回锅鸡蛋翻炒","加盐糖调味，撒葱花出锅"]},
 {name:"青椒炒肉",emoji:"🫑🥩",level:"简单",time:20,servings:2,tags:["下饭"],ings:["青椒","猪肉","蒜"],steps:["猪肉切丝用酱油腌10分钟","青椒切丝，蒜切片","热油爆香蒜，下肉丝炒变色","下青椒翻炒，加盐出锅"]},
 {name:"清炒青菜",emoji:"🥬",level:"简单",time:8,servings:2,tags:["清淡"],ings:["青菜","蒜"],steps:["青菜洗净沥干","热油爆香蒜末","下青菜大火快炒","加盐翻炒1分钟出锅"]},
 {name:"土豆炖牛肉",emoji:"🥔🥩",level:"中等",time:45,servings:3,tags:["家常"],ings:["土豆","牛肉","葱"],steps:["牛肉切块焯水","土豆切块","砂锅炒香葱姜，下牛肉加水炖30分","下土豆再炖15分钟调味"]},
 {name:"西红柿鸡蛋面",emoji:"🍜",level:"简单",time:12,servings:1,tags:["家常","快手"],ings:["番茄","鸡蛋","面条","葱"],steps:["番茄切块炒出汁","加水煮开下面条","淋蛋液成蛋花","加盐撒葱花出锅"]},
 {name:"麻婆豆腐",emoji:"🌶️",level:"中等",time:20,servings:2,tags:["下饭","重口"],ings:["豆腐","猪肉","葱"],steps:["豆腐切块焯水","炒肉末加豆瓣酱","加水下豆腐烧入味","勾芡撒葱花花椒面"]},
 {name:"蛋炒饭",emoji:"🍚",level:"简单",time:10,servings:1,tags:["快手"],ings:["米饭","鸡蛋","葱"],steps:["鸡蛋打散，米饭弄散","热油炒蛋至半凝固下米饭","翻炒均匀加盐","撒葱花出锅"]},
 {name:"可乐鸡翅",emoji:"🍗",level:"中等",time:30,servings:2,tags:["家常"],ings:["鸡肉","葱"],steps:["鸡翅划刀焯水","煎至两面金黄","倒入可乐没过鸡翅","中小火收汁撒芝麻"]},
 {name:"酸辣土豆丝",emoji:"🥔🌶️",level:"简单",time:12,servings:2,tags:["下饭","重口"],ings:["土豆","辣椒","葱"],steps:["土豆切丝泡水去淀粉","热油爆香辣椒","下土豆丝大火快炒","加醋盐炒匀撒葱"]},
 {name:"红烧肉",emoji:"🥩",level:"难",time:60,servings:3,tags:["硬菜"],ings:["猪肉","葱"],steps:["五花肉切块焯水","冰糖炒糖色下肉上色","加料酒酱油葱姜炖40分","大火收汁油亮"]},
 {name:"紫菜蛋花汤",emoji:"🥚",level:"简单",time:10,servings:2,tags:["清淡","快手"],ings:["紫菜","鸡蛋","葱"],steps:["水烧开下紫菜","淋蛋液成蛋花","加盐胡椒粉","撒葱花出锅"]},
 {name:"蒜蓉西兰花",emoji:"🥦",level:"简单",time:10,servings:2,tags:["清淡"],ings:["西兰花","蒜"],steps:["西兰花掰小朵焯水","热油爆香蒜末","下西兰花翻炒","加盐炒匀出锅"]}
];
let current=null;
function openDouyin(){
  if(!current) return;
  const q=encodeURIComponent(current.name+" 做法");
  window.open("https://www.douyin.com/search/"+q,"_blank");
}
const selected=new Set();
const chipsEl=document.getElementById('chips');
POOL.forEach(p=>{
  const c=document.createElement('div');c.className='chip';c.textContent=p;
  c.onclick=()=>{c.classList.toggle('on');if(selected.has(p))selected.delete(p);else selected.add(p);};
  chipsEl.appendChild(c);
});
function score(r){let m=r.ings.filter(i=>selected.has(i)).length;return m/r.ings.length;}
function draw(){
  if(selected.size===0){alert('先选点冰箱里的食材吧～');return;}
  let pool=RECIPES.map(r=>({r,s:score(r)})).filter(x=>x.s>0);
  pool.sort((a,b)=>b.s-a.s);
  const top=pool.slice(0,Math.max(3,Math.ceil(pool.length/2)));
  current=top[Math.floor(Math.random()*top.length)].r;
  renderResult();go('result');
}
function renderResult(){
  document.getElementById('dishName').textContent=current.name+' '+current.emoji;
  document.getElementById('dishMeta').innerHTML=
    `<span>难度 ${current.level}</span><span>⏱ ${current.time}分钟</span><span>👥 ${current.servings}人份</span><span class="hot">🔥 人气 4.8</span>`;
  const ingsEl=document.getElementById('ings');ingsEl.innerHTML='';
  let miss=[];
  current.ings.forEach(i=>{
    const has=selected.has(i);
    if(!has)miss.push(i);
    const d=document.createElement('div');d.className='ing';
    d.innerHTML=`<span>${i}</span><span class="${has?'ok':'miss'}">${has?'✓ 有':'✗ 缺'}</span>`;
    ingsEl.appendChild(d);
  });
  document.getElementById('shop').innerHTML=miss.length?`🛒 购物清单：${miss.join('、')}（缺 ${miss.length} 样）`:'🛒 食材齐全，直接开做！';
}
function showRecipe(){
  document.getElementById('rcName').textContent=current.name;
  document.getElementById('rcMeta').textContent=`${current.level} · ${current.time}分钟 · ${current.servings}人份`;
  const s=document.getElementById('steps');s.innerHTML='';
  current.steps.forEach((t,i)=>{const d=document.createElement('div');d.className='step';d.innerHTML=`<div class="n">${i+1}</div><div>${t}</div>`;s.appendChild(d);});
  go('recipe');
}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function finish(){
  const cv=document.getElementById('confetti');cv.style.display='block';
  const ctx=cv.getContext('2d');cv.width=360;cv.height=684;
  for(let i=0;i<80;i++){ctx.fillStyle=`hsl(${Math.random()*360},80%,60%)`;ctx.beginPath();ctx.arc(Math.random()*360,Math.random()*684,Math.random()*5+2,0,7);ctx.fill();}
  setTimeout(()=>{cv.style.display='none';ctx.clearRect(0,0,360,684);},1800);
}
</script>
</body>
</html>
