<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyVision — Python代码智能可视化分析平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
/* =========================== CSS Variables =========================== */
:root {
  --bg-root:        #0d0d0d;
  --bg-base:        #141414;
  --bg-surface:     #1a1a1a;
  --bg-raised:      #222222;
  --bg-overlay:     #2a2a2a;

  --border-subtle:  #2a2a2a;
  --border-default: #333333;

  --text-primary:   #e4e4e4;
  --text-secondary: #888888;
  --text-tertiary:  #555555;
  --text-muted:     #444444;

  --accent:         #3b9eff;
  --accent-dim:     #2a6fbf;
  --accent-bg:      rgba(59, 158, 255, 0.08);

  --node-file:      #f0c060;
  --node-class:     #60c0f0;
  --node-function:  #60f0a0;

  --link-contains:       #555555;
  --link-calls:          #3b9eff;
  --link-instantiates:   #8b6fbf;
  --link-imports:        #555555;
  --link-dimmed:         rgba(255,255,255,0.04);

  --highlight-node:      #3b9eff;
  --highlight-upstream:  rgba(59, 158, 255, 0.4);
  --highlight-downstream:rgba(240, 192, 96, 0.4);
  --dimmed:              rgba(255,255,255,0.06);

  --diff-add-bg:    rgba(96, 240, 160, 0.12);
  --diff-add-line:  #60f0a0;
  --diff-remove-bg: rgba(240, 96, 96, 0.12);
  --diff-remove-line:#f06060;

  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Consolas', monospace;
  --font-ui:   system-ui, -apple-system, 'Segoe UI', sans-serif;
}

/* =========================== Reset & Base =========================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-ui);
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-primary);
  background: var(--bg-root);
  -webkit-font-smoothing: antialiased;
}

/* =========================== Scrollbar =========================== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-default); }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

/* =========================== Layout =========================== */
#app {
  display: grid;
  grid-template-columns: minmax(180px, 260px) minmax(160px, 1fr) minmax(280px, 400px);
  height: 100vh;
  width: 100vw;
}

/* =========================== Left Panel - Sidebar =========================== */
#sidebar {
  background: var(--bg-base);
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border-subtle);
  overflow: hidden;
  animation: slideInLeft 0.4s ease-out;
}

.sidebar-header {
  padding: 16px 12px 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.sidebar-logo {
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.5px;
}
.sidebar-logo span { color: var(--accent); }
.sidebar-version {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
  font-family: var(--font-mono);
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}
.stat-item {
  background: var(--bg-base);
  padding: 10px 12px;
  text-align: center;
}
.stat-value {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}
.stat-label {
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 2px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* File Tree */
.sidebar-section {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-subtle);
}
.sidebar-section-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.file-tree { flex: 1; overflow-y: auto; padding: 4px 0; }
.tree-item { user-select: none; }
.tree-row {
  display: flex;
  align-items: center;
  padding: 3px 12px;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--text-secondary);
  border-left: 2px solid transparent;
  transition: background 0.1s, color 0.1s;
}
.tree-row:hover { background: var(--bg-surface); color: var(--text-primary); }
.tree-row.active { background: var(--accent-bg); color: var(--text-primary); border-left-color: var(--accent); }
.tree-row .dot {
  width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0;
}
.tree-row .dot.file { background: var(--node-file); }
.tree-row .dot.class { background: var(--node-class); }
.tree-row .dot.function { background: var(--node-function); }
.tree-row .chevron {
  width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
  color: var(--text-tertiary); font-size: 10px; margin-right: 2px; flex-shrink: 0;
  transition: transform 0.15s;
}
.tree-row .chevron.expanded { transform: rotate(90deg); }
.tree-children { display: none; }
.tree-children.expanded { display: block; }
.tree-children .tree-row { padding-left: 36px; }
.tree-children .tree-children .tree-row { padding-left: 56px; }

/* Legend */
.legend-block { margin-top: 8px; }
.legend-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
  font-size: 11px; color: var(--text-secondary);
}
.legend-icon {
  width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
}
.legend-icon.file { background: var(--node-file); }
.legend-icon.class { background: var(--node-class); }
.legend-icon.func { background: var(--node-function); }
.legend-line {
  width: 20px; height: 2px; flex-shrink: 0; border-radius: 1px;
}
.legend-line.calls { background: var(--link-calls); }
.legend-line.imports { background: var(--link-imports); }
.legend-line.instantiates { background: var(--link-instantiates); border: none; }
.legend-line.instantiates { border-top: 1px dashed var(--link-instantiates); background: none; height: 0; }
.legend-line.contains { border-top: 1px dashed var(--link-contains); background: none; height: 0; }

/* =========================== Center Panel - Graph Canvas =========================== */
#graph {
  position: relative;
  background: var(--bg-root);
  overflow: hidden;
}

#graph svg {
  width: 100%;
  height: 100%;
}

/* Graph Tooltip */
.graph-tooltip {
  position: absolute;
  pointer-events: none;
  padding: 6px 10px;
  background: var(--bg-overlay);
  color: var(--text-primary);
  font-size: 11px;
  font-family: var(--font-mono);
  border: 1px solid var(--border-default);
  opacity: 0;
  transition: opacity 0.12s;
  z-index: 100;
  white-space: nowrap;
}
.graph-tooltip.visible { opacity: 1; }

/* Graph Toolbar */
.graph-toolbar {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: var(--bg-raised);
  border: 1px solid var(--border-default);
  padding: 4px;
  z-index: 50;
}
.graph-toolbar button {
  background: none;
  border: none;
  color: var(--text-secondary);
  padding: 6px 10px;
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 11px;
  transition: color 0.12s, background 0.12s;
}
.graph-toolbar button:hover { color: var(--text-primary); background: var(--bg-surface); }
.graph-toolbar button:active { color: var(--accent); }
.graph-toolbar .divider {
  width: 1px; background: var(--border-default); margin: 2px 4px;
}
.graph-search {
  background: none; border: none; outline: none;
  color: var(--text-primary); font-family: var(--font-mono);
  font-size: 11px; padding: 6px 8px; width: 120px;
}
.graph-search::placeholder { color: var(--text-tertiary); }

/* Graph watermark */
.graph-watermark {
  position: absolute;
  top: 16px;
  left: 16px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  pointer-events: none;
  opacity: 0.6;
}

/* =========================== Right Panel - Detail =========================== */
#detail {
  background: var(--bg-base);
  border-left: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: slideInRight 0.4s ease-out;
}

/* Tab Bar */
.detail-tabs {
  display: flex;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.detail-tab {
  flex: 1;
  padding: 10px 12px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-tertiary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: var(--font-ui);
  box-sizing: border-box;
}
.detail-tab:hover { color: var(--text-secondary); }
.detail-tab.active { color: var(--text-primary); border-bottom-color: var(--accent); }

/* Code Panel */
.detail-panel { flex: 1; overflow-y: auto; display: none; }
.detail-panel.visible { display: flex; flex-direction: column; }

.panel-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.panel-header .file-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-bg);
  padding: 2px 8px;
}
.panel-header .node-name {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.code-body {
  flex: 1;
  overflow-y: auto;
  counter-reset: line;
}
.code-line {
  display: flex;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  min-height: 21px;
  transition: background 0.12s;
}
.code-line:hover { background: var(--bg-surface); }
.code-line .line-num {
  width: 40px;
  flex-shrink: 0;
  text-align: right;
  padding-right: 12px;
  color: var(--text-muted);
  user-select: none;
}
.code-line .line-content {
  flex: 1;
  white-space: pre;
  padding-right: 12px;
  color: var(--text-secondary);
}

/* Syntax highlighting */
.token-keyword { color: #c792ea; }
.token-builtin { color: #82aaff; }
.token-string { color: #c3e88d; }
.token-comment { color: #546e7a; font-style: italic; }
.token-name { color: #ffcb6b; }
.token-decorator { color: #89ddff; }
.token-number { color: #f78c6c; }
.token-punctuation { color: var(--text-secondary); }
.token-self { color: #ff5370; }

/* Explanation Panel */
.explanation-body { flex: 1; overflow-y: auto; }
.explanation-item {
  display: flex;
  padding: 6px 12px;
  border-bottom: 1px solid var(--border-subtle);
  transition: background 0.12s;
  min-height: 35px;
  align-items: flex-start;
}
.explanation-item:hover { background: var(--bg-surface); }
.explanation-item .exp-line-num {
  width: 32px; flex-shrink: 0; color: var(--text-muted); font-family: var(--font-mono);
  font-size: 11px; padding-top: 2px;
}
.explanation-item .exp-code {
  width: 180px; flex-shrink: 0; font-family: var(--font-mono); font-size: 11px;
  color: var(--text-secondary); white-space: pre; padding-top: 2px; overflow: hidden;
  text-overflow: ellipsis;
}
.explanation-item .exp-comment {
  flex: 1; font-size: 11px; color: var(--text-primary); padding-top: 2px;
  padding-left: 8px; border-left: 1px solid var(--border-default);
}

/* Chat Panel */
.chat-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.chat-msg {
  max-width: 90%;
  padding: 8px 12px;
  font-size: 12px;
  line-height: 1.5;
  animation: msgIn 0.2s ease-out;
}
.chat-msg.user {
  align-self: flex-end;
  background: var(--accent-bg);
  color: var(--text-primary);
  border: 1px solid rgba(59, 158, 255, 0.2);
}
.chat-msg.ai {
  align-self: flex-start;
  background: var(--bg-surface);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
}
.chat-msg .msg-label {
  font-size: 10px; font-weight: 600; color: var(--text-tertiary); margin-bottom: 4px;
}
.chat-msg.user .msg-label { color: var(--accent); }

.chat-btn {
  background: var(--accent-bg);
  border: 1px solid rgba(59, 158, 255, 0.2);
  color: var(--accent);
  font-size: 11px;
  font-family: var(--font-ui);
  padding: 6px 12px;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.12s;
}
.chat-btn:hover { background: rgba(59, 158, 255, 0.16); }

.chat-input-area {
  padding: 10px 12px;
  border-top: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.chat-input {
  width: 100%;
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  color: var(--text-tertiary);
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  outline: none;
  cursor: not-allowed;
}
.chat-input::placeholder { color: var(--text-muted); }

/* Diff View */
.diff-container { display: none; margin-top: 8px; }
.diff-container.visible { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border-default); }
.diff-side { overflow: hidden; }
.diff-header {
  padding: 6px 10px; font-size: 10px; font-weight: 600;
  color: var(--text-tertiary); text-transform: uppercase;
  letter-spacing: 0.5px; border-bottom: 1px solid var(--border-subtle);
}
.diff-header.old { color: var(--diff-remove-line); }
.diff-header.new { color: var(--diff-add-line); }
.diff-line {
  display: flex; font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
  padding: 1px 8px; min-height: 20px;
}
.diff-line .dl-num { width: 28px; flex-shrink: 0; color: var(--text-muted); font-size: 10px; }
.diff-line .dl-code { flex: 1; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.diff-line.added { background: var(--diff-add-bg); }
.diff-line.added .dl-code { color: var(--diff-add-line); }
.diff-line.removed { background: var(--diff-remove-bg); }
.diff-line.removed .dl-code { color: var(--diff-remove-line); }
.diff-line.unchanged .dl-code { color: var(--text-secondary); }

/* =========================== Flow Panel =========================== */
.flow-status {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  padding: 2px 8px;
  border: 1px solid rgba(59, 158, 255, 0.2);
  margin-left: auto;
}
.flow-status.running { color: #f0c060; border-color: rgba(240, 192, 96, 0.3); }
.flow-status.done { color: #60f0a0; border-color: rgba(96, 240, 160, 0.2); }

.flow-body {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}

.flow-step {
  display: flex;
  align-items: flex-start;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-subtle);
  transition: background 0.2s;
  gap: 10px;
  position: relative;
}
.flow-step:hover { background: var(--bg-surface); }
.flow-step.active { background: var(--accent-bg); border-left: 2px solid var(--accent); padding-left: 10px; }
.flow-step.done { opacity: 0.5; }
.flow-step .step-num {
  width: 22px; height: 22px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 1px;
}
.flow-step.active .step-num { background: var(--accent); color: #fff; border-color: var(--accent); }
.flow-step.done .step-num { background: var(--bg-raised); color: var(--text-muted); }
.flow-step .step-info { flex: 1; min-width: 0; }
.flow-step .step-node {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 6px;
}
.flow-step .step-node .node-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.flow-step .step-node .node-dot.file { background: var(--node-file); }
.flow-step .step-node .node-dot.class { background: var(--node-class); }
.flow-step .step-node .node-dot.func { background: var(--node-function); }
.flow-step .step-action {
  font-size: 10px;
  color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.flow-step .step-io {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 11px;
}
.flow-step .step-io-row {
  display: flex;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.5;
}
.flow-step .step-io-label {
  color: var(--text-tertiary);
  flex-shrink: 0;
  min-width: 28px;
}
.flow-step .step-io-label.in { color: #f0c060; }
.flow-step .step-io-label.out { color: #60f0a0; }
.flow-step .step-io-value {
  color: var(--text-secondary);
  word-break: break-all;
}
.flow-step .step-desc {
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 4px;
  font-style: italic;
}

/* Flow token on graph */
.flow-token {
  fill: #fff;
  stroke: var(--accent);
  stroke-width: 2;
  filter: url(#glow);
  pointer-events: none;
}

.run-btn-inline {
  background: var(--accent-bg);
  border: 1px solid rgba(59, 158, 255, 0.2);
  color: var(--accent);
  font-size: 12px;
  font-family: var(--font-ui);
  padding: 8px 20px;
  cursor: pointer;
  margin-top: 12px;
  transition: background 0.12s;
}
.run-btn-inline:hover { background: rgba(59, 158, 255, 0.16); }

/* Data pulse on edges */
@keyframes dataPulse {
  0% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: -20; }
}
.flow-edge-active {
  stroke-dasharray: 8, 4;
  animation: dataPulse 0.6s linear infinite;
}

/* Empty state */
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: var(--text-tertiary); gap: 8px;
}
.empty-state .empty-icon { font-size: 32px; opacity: 0.3; }
.empty-state .empty-text { font-size: 12px; }

/* =========================== Animations =========================== */
@keyframes slideInLeft {
  from { transform: translateX(-40px); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}
@keyframes slideInRight {
  from { transform: translateX(40px); opacity: 0; }
  to   { transform: translateX(0); opacity: 1; }
}
@keyframes msgIn {
  from { transform: translateY(8px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
@keyframes nodeAppear {
  from { opacity: 0; transform: scale(0.6); }
  to   { opacity: 1; transform: scale(1); }
}

/* Node hover transition */
.graph-node { cursor: pointer; transition: opacity 0.15s; }
.graph-link { transition: opacity 0.15s, stroke-width 0.15s; }
</style>
</head>
<body>

<div id="app">
  <!-- ====================== Left Panel: Sidebar ====================== -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">Py<span>Vision</span></div>
      <div class="sidebar-version">v0.1.0-demo</div>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <div class="sidebar-section-title">项目文件</div>
      <div class="file-tree" id="fileTree"></div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">图例</div>
      <div class="legend-block">
        <div class="legend-row"><span class="legend-icon file"></span> 文件</div>
        <div class="legend-row"><span class="legend-icon class"></span> 类</div>
        <div class="legend-row"><span class="legend-icon func"></span> 函数/方法</div>
      </div>
      <div class="legend-block" style="margin-top:8px;">
        <div class="legend-row"><span class="legend-line calls"></span> 调用</div>
        <div class="legend-row"><span class="legend-line contains"></span> 包含</div>
        <div class="legend-row"><span class="legend-line imports"></span> 导入</div>
        <div class="legend-row"><span class="legend-line instantiates"></span> 实例化</div>
      </div>
    </div>
  </aside>

  <!-- ====================== Center Panel: Graph Canvas ====================== -->
  <main id="graph">
    <div class="graph-watermark">PyVision — 节点关系图谱</div>
    <div class="graph-tooltip" id="graphTooltip"></div>
    <div class="graph-toolbar">
      <button id="btnZoomIn" title="放大">+</button>
      <button id="btnZoomOut" title="缩小">−</button>

class EventEmitter {
  constructor() { this._events = {}; }
  on(event, fn) { (this._events[event] || (this._events[event] = [])).push(fn); return this; }
  off(event, fn) { if (this._events[event]) this._events[event] = this._events[event].filter(f => f !== fn); return this; }
  emit(event, ...args) { if (this._events[event]) this._events[event].forEach(fn => fn(...args)); return this; }
}

function highlightPython(code) {
  return code
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/(#.*)/g, '<span class="token-comment">$1</span>')
    .replace(/("(?:[^"\\]|\\.)*")/g, '<span class="token-string">$1</span>')
    .replace(/('(?:[^'\\]|\\.)*')/g, '<span class="token-string">$1</span>')
    .replace(/\b(class|def|return|if|else|elif|for|while|import|from|as|try|except|raise|with|yield|not|in|is|and|or|pass|break|continue|lambda|None|True|False)\b/g,
      '<span class="token-keyword">$1</span>')
    .replace(/\b(print|range|len|int|str|float|bool|list|dict|set|tuple|type|isinstance|hasattr|getattr|setattr|delattr|super)\b/g,
      '<span class="token-builtin">$1</span>')
    .replace(/@\w+/g, '<span class="token-decorator">$&</span>')
    .replace(/\b(self)\b/g, '<span class="token-self">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="token-number">$1</span>');
}

function renderCodePanel(nodeId) {

  body.innerHTML = lines.map((line, i) =>
    `<div class="code-line"><span class="line-num">${i + 1}</span><span class="line-content">${highlightPython(line)}</span></div>`
  ).join("");
}

function renderExplanationPanel(nodeId) {
  const node = NODES.find(n => n.id === nodeId);
  if (!node) return;

  document.getElementById("explainNodeName").textContent = node.label + " — 逐行解释";

  const expl = NODE_EXPLANATIONS[nodeId] || [];

  }
  body.innerHTML = expl.map(e =>
    `<div class="explanation-item">
      <span class="exp-line-num">${e.line}</span>
      <span class="exp-code">${highlightPython(e.code)}</span>
      <span class="exp-comment">${e.comment || ""}</span>
    </div>`
  ).join("");
}

function renderChatPanel() {
  const body = document.getElementById("chatBody");
  let html = "";
  CHAT_DATA.forEach((msg, i) => {
    html += `<div class="chat-msg ${msg.role}" style="animation-delay:${i * 0.1}s">
      <div class="msg-label">${msg.role === "user" ? "你" : "PyVision AI"}</div>
      <div>${msg.text.replace(/\n/g, "<br>")}</div>
      ${msg.hasDiff ? '<button class="chat-btn" id="btnShowDiff">查看建议修改</button>' : ""}
    </div>`;
  });
  body.innerHTML = html;

  const diffBtn = document.getElementById("btnShowDiff");

      if (existing) existing.remove();
      renderDiffView(body);
    });
  }
}

function renderDiffView(parent) {
  const container = document.createElement("div");
  container.className = "diff-container visible";
  container.id = "diffContainer";

  const maxLen = Math.max(DIFF_DATA.old.length, DIFF_DATA.new.length);
  let oldHtml = `<div class="diff-side"><div class="diff-header old">原始代码</div>`;
  let newHtml = `<div class="diff-side"><div class="diff-header new">优化后代码</div>`;

  for (let i = 0; i < maxLen; i++) {
    const oldLine = DIFF_DATA.old[i];
    const newLine = DIFF_DATA.new[i];

    if (oldLine === newLine) {
      oldHtml += `<div class="diff-line unchanged"><span class="dl-num">${i+1}</span><span class="dl-code">${highlightPython(oldLine||"")}</span></div>`;
      newHtml += `<div class="diff-line unchanged"><span class="dl-num">${i+1}</span><span class="dl-code">${highlightPython(newLine||"")}</span></div>`;
    } else {
      if (oldLine !== undefined) {
        oldHtml += `<div class="diff-line removed"><span class="dl-num">${i+1}</span><span class="dl-code">${highlightPython(oldLine)}</span></div>`;
      } else {
        oldHtml += `<div class="diff-line"><span class="dl-num"></span><span class="dl-code"></span></div>`;
      }
      if (newLine !== undefined) {
        newHtml += `<div class="diff-line added"><span class="dl-num">${i+1}</span><span class="dl-code">${highlightPython(newLine)}</span></div>`;
      } else {
        newHtml += `<div class="diff-line"><span class="dl-num"></span><span class="dl-code"></span></div>`;
      }
    }
  }

  oldHtml += `</div>`; newHtml += `</div>`;
  container.innerHTML = oldHtml + newHtml;
  parent.appendChild(container);
  container.scrollIntoView({ behavior: "smooth" });
}

// ====================== Graph Visualization ======================
let svg, gRoot, gLinks, gNodes, gLabels, simulation, zoomBehavior;
let selectedNodeId = null;

function initGraph() {
  const container = document.getElementById("graph");
  const width = container.clientWidth;
  const height = container.clientHeight;

  svg = d3.select("#graphSvg")
    .attr("width", width)
    .attr("height", height);

  // Defs
  const defs = svg.append("defs");

  // Arrow marker for calls
  defs.append("marker")
    .attr("id", "arrow-calls")
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 22)
    .attr("refY", 0)
    .attr("markerWidth", 8)
    .attr("markerHeight", 8)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-5L10,0L0,5")
    .attr("fill", "#3b9eff");

  // Arrow marker for instantiates
  defs.append("marker")
    .attr("id", "arrow-inst")
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 22)
    .attr("refY", 0)
    .attr("markerWidth", 8)
    .attr("markerHeight", 8)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-5L10,0L0,5")
    .attr("fill", "#8b6fbf");

  // Glow filter
  const filter = defs.append("filter").attr("id", "glow");
  filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "blur");
  filter.append("feMerge").selectAll("feMergeNode")
    .data(["blur", "SourceGraphic"])
    .enter().append("feMergeNode").attr("in", d => d);

  // Zoom
  zoomBehavior = d3.zoom()
    .scaleExtent([0.2, 3])
    .on("zoom", (event) => {
      gRoot.attr("transform", event.transform);
    });
  svg.call(zoomBehavior);

  gRoot = svg.append("g");
  gLinks = gRoot.append("g").attr("class", "links");
  gNodes = gRoot.append("g").attr("class", "nodes");
  gLabels = gRoot.append("g").attr("class", "labels");

  // Simulation
  simulation = d3.forceSimulation(NODES)
    .force("link", d3.forceLink(LINKS).id(d => d.id)
      .distance(d => {
        if (d.type === "contains") return 35;
        if (d.type === "calls") return 70;
        if (d.type === "imports") return 90;
        return 60;
      })
      .strength(d => d.type === "contains" ? 0.7 : 0.25))
    .force("charge", d3.forceManyBody()
      .strength(d => d.type === "file" ? -500 : d.type === "class" ? -300 : -150))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide()
      .radius(d => d.type === "file" ? 35 : d.type === "class" ? 25 : 15))
    .alphaDecay(0.015)
    .velocityDecay(0.35)
    .on("tick", ticked);

  renderGraphElements();
  setupZoomButtons();
  setupSearch();
  setupResize();

  // Initial zoom to fit
  setTimeout(() => {
    const bounds = gRoot.node().getBBox();
    const dx = bounds.width, dy = bounds.height;
    const x = bounds.x + dx / 2, y = bounds.y + dy / 2;
    const scale = Math.min(0.8, Math.min(width / dx, height / dy) * 0.85);
    const tx = width / 2 - scale * x;
    const ty = height / 2 - scale * y;
    svg.transition().duration(600).call(
      zoomBehavior.transform,
      d3.zoomIdentity.translate(tx, ty).scale(scale)
    );
  }, 1200);
}

function renderGraphElements() {
  // Links
  const link = gLinks.selectAll("line")
    .data(LINKS)
    .join("line")
    .attr("class", d => "graph-link link-" + d.type)
    .attr("stroke", d => {
      if (d.type === "contains") return "#555555";
      if (d.type === "calls") return "#3b9eff";
      if (d.type === "imports") return "#555555";
      if (d.type === "instantiates") return "#8b6fbf";
      return "#555555";
    })
    .attr("stroke-width", 1.2)
    .attr("stroke-dasharray", d => (d.type === "contains" || d.type === "instantiates") ? "4,3" : null)
    .attr("marker-end", d => {
      if (d.type === "calls") return "url(#arrow-calls)";
      if (d.type === "instantiates") return "url(#arrow-inst)";
      return null;
    })
    .attr("opacity", 0.5);

  // Nodes - group
  const node = gNodes.selectAll("g")
    .data(NODES)
    .join("g")
    .attr("class", "graph-node")
    .style("animation", (d, i) => `nodeAppear 0.3s ease-out ${i * 0.03}s both`)
    .call(dragBehavior());

  // File nodes: rect
  node.filter(d => d.type === "file").append("rect")
    .attr("width", 70).attr("height", 28)
    .attr("x", -35).attr("y", -14)
    .attr("rx", 4).attr("ry", 4)
    .attr("fill", "#f0c060")
    .attr("stroke", "none")
    .attr("opacity", 0.9);

  // Class nodes: hexagon
  node.filter(d => d.type === "class").each(function() {
    const r = 18;
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const angle = Math.PI / 6 + i * Math.PI / 3;
      pts.push([r * Math.cos(angle), r * Math.sin(angle)]);
    }
    d3.select(this).append("polygon")
      .attr("points", pts.map(p => p.join(",")).join(" "))
      .attr("fill", "#60c0f0")
      .attr("stroke", "none")
      .attr("opacity", 0.9);
  });

  // Function nodes: circle
  node.filter(d => d.type === "function").append("circle")
    .attr("r", 12)
    .attr("fill", "#60f0a0")
    .attr("stroke", "none")
    .attr("opacity", 0.9);

  // Small icon letter inside nodes
  node.filter(d => d.type === "class").append("text")
    .attr("text-anchor", "middle").attr("dy", "0.4em")
    .attr("fill", "#0d0d0d").attr("font-size", "10px")
    .attr("font-family", "var(--font-mono)").attr("font-weight", "600")
    .text("C");
  node.filter(d => d.type === "function").append("text")
    .attr("text-anchor", "middle").attr("dy", "0.4em")
    .attr("fill", "#0d0d0d").attr("font-size", "9px")
    .attr("font-family", "var(--font-mono)").attr("font-weight", "600")
    .text("f");

  // Labels
  gLabels.selectAll("text")
    .data(NODES)
    .join("text")
    .attr("class", "graph-label")
    .text(d => d.label)
    .attr("text-anchor", "middle")
    .attr("dy", d => d.type === "file" ? 22 : d.type === "class" ? 26 : 18)
    .attr("fill", "#888888")
    .attr("font-family", "var(--font-mono)")
    .attr("font-size", d => d.type === "file" ? "10px" : "9px")
    .style("pointer-events", "none")
    .style("animation", (d, i) => `nodeAppear 0.3s ease-out ${i * 0.03 + 0.1}s both`);

  // Node interactions
  node.on("mouseenter", handleNodeMouseEnter)
      .on("mouseleave", handleNodeMouseLeave)
      .on("click", handleNodeClick);
}

function ticked() {
  gLinks.selectAll("line")
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  gNodes.selectAll("g")
    .attr("transform", d => `translate(${d.x},${d.y})`);

  gLabels.selectAll("text")
    .attr("x", d => d.x)
    .attr("y", d => d.y);
}

function dragBehavior() {
  return d3.drag()
    .on("start", (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (event, d) => {
      d.fx = event.x; d.fy = event.y;
    })
    .on("end", (event, d) => {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
}

// ====================== Graph Interactions ======================
function getNeighbors(nodeId) {
  const upstream = new Set();
  const downstream = new Set();
  const relatedEdges = new Set();

  LINKS.forEach((l, i) => {
    const sId = typeof l.source === "object" ? l.source.id : l.source;
    const tId = typeof l.target === "object" ? l.target.id : l.target;

    if (sId === nodeId) {
      downstream.add(tId);
      relatedEdges.add(i);
    }
    if (tId === nodeId) {
      upstream.add(sId);
      relatedEdges.add(i);
    }
  });

  return { upstream, downstream, relatedEdges };
}

function handleNodeMouseEnter(event, d) {
  const { upstream, downstream, relatedEdges } = getNeighbors(d.id);
  const allNeighbors = new Set([...upstream, ...downstream]);

  const tooltip = document.getElementById("graphTooltip");
  tooltip.textContent = `${d.label} — ${d.description || ""}`;
  tooltip.classList.add("visible");
  tooltip.style.left = (event.pageX + 12) + "px";
  tooltip.style.top = (event.pageY - 10) + "px";

  // Dim all nodes and links
  gNodes.selectAll("g").transition().duration(150)
    .style("opacity", nd => nd.id === d.id ? 1 : allNeighbors.has(nd.id) ? 0.8 : 0.12);

  gLinks.selectAll("line").transition().duration(150)
    .style("opacity", (ld, i) => relatedEdges.has(i) ? 0.8 : 0.04);

  gLabels.selectAll("text").transition().duration(150)
    .style("opacity", nd => nd.id === d.id ? 1 : allNeighbors.has(nd.id) ? 0.7 : 0);

  // Highlight current node
  d3.select(event.currentTarget).select("circle, rect, polygon")
    .transition().duration(150)
    .attr("stroke", "#3b9eff").attr("stroke-width", 2)
    .attr("filter", "url(#glow)");
}

function handleNodeMouseLeave(event, d) {
  const tooltip = document.getElementById("graphTooltip");
  tooltip.classList.remove("visible");

  gNodes.selectAll("g").transition().duration(150).style("opacity", 1);
  gLinks.selectAll("line").transition().duration(150).style("opacity", 0.5);
  gLabels.selectAll("text").transition().duration(150).style("opacity", 1);

  d3.select(event.currentTarget).select("circle, rect, polygon")
    .transition().duration(150)
    .attr("stroke", selectedNodeId === d.id ? "#3b9eff" : "none")
    .attr("stroke-width", selectedNodeId === d.id ? 2 : 0)
    .attr("filter", selectedNodeId === d.id ? "url(#glow)" : "none");
}

function handleNodeClick(event, d) {
  // Reset previous selection
  gNodes.selectAll("g").select("circle, rect, polygon")
    .attr("stroke", "none").attr("stroke-width", 0).attr("filter", "none");

  // Set new selection
  selectedNodeId = d.id;
  d3.select(event.currentTarget).select("circle, rect, polygon")
    .attr("stroke", "#3b9eff").attr("stroke-width", 2).attr("filter", "url(#glow)");

  bus.emit("node:click", d.id);
}

// ====================== Zoom Buttons ======================
function setupZoomButtons() {
  document.getElementById("btnZoomIn").addEventListener("click", () => {
    svg.transition().duration(200).call(zoomBehavior.scaleBy, 1.3);
  });
  document.getElementById("btnZoomOut").addEventListener("click", () => {
    svg.transition().duration(200).call(zoomBehavior.scaleBy, 0.7);
  });
  document.getElementById("btnReset").addEventListener("click", () => {
    const container = document.getElementById("graph");
    const w = container.clientWidth, h = container.clientHeight;
    const bounds = gRoot.node().getBBox();
    const scale = Math.min(0.8, Math.min(w / bounds.width, h / bounds.height) * 0.85);
    const tx = w / 2 - scale * (bounds.x + bounds.width / 2);
    const ty = h / 2 - scale * (bounds.y + bounds.height / 2);
    svg.transition().duration(400).call(
      zoomBehavior.transform,
      d3.zoomIdentity.translate(tx, ty).scale(scale)
    );
  });
}

function setupResize() {
  window.addEventListener("resize", () => {
    const container = document.getElementById("graph");

    simulation.force("center", d3.forceCenter(w / 2, h / 2)).restart();
  });
}

let flowRunning = false;
let flowTimer = null;
let flowToken = null;

function renderFlowPanel() {
  const body = document.getElementById("flowBody");
  const empty = document.getElementById("flowEmpty");
  if (empty) empty.style.display = "none";

  let html = "";
  EXECUTION_TRACE.forEach((trace, i) => {
    html += `<div class="flow-step" id="flowStep${i}" data-node-id="${trace.nodeId}">`;
    html += `<div class="step-num">${trace.step}</div>`;
    html += `<div class="step-info">`;
    const node = NODES.find(n => n.id === trace.nodeId);
    const dotType = node ? (node.type === "file" ? "file" : node.type === "class" ? "class" : "func") : "func";
    html += `<div class="step-node"><span class="node-dot ${dotType}"></span>${trace.nodeId}</div>`;
    html += `<div class="step-action">${trace.action}</div>`;
    if (trace.inputs || trace.outputs) {
      html += `<div class="step-io">`;
      if (trace.inputs) {
        Object.entries(trace.inputs).forEach(([k, v]) => {
          html += `<div class="step-io-row"><span class="step-io-label in">IN</span><span class="step-io-value">${k} = ${v}</span></div>`;
        });
      }
      if (trace.outputs) {
        Object.entries(trace.outputs).forEach(([k, v]) => {
          html += `<div class="step-io-row"><span class="step-io-label out">OUT</span><span class="step-io-value">${k} ${v}</span></div>`;
        });
      }
      html += `</div>`;
    }
    html += `<div class="step-desc">${trace.description}</div>`;
    html += `</div></div>`;
  });
  body.innerHTML = html;
}

function startFlowAnimation() {
  if (flowRunning) return;
  flowRunning = true;

  document.getElementById("btnRun").textContent = "■ 停止";

  const status = document.getElementById("flowStatus");
  status.textContent = "运行中...";
  status.className = "flow-status running";

  renderFlowPanel();
  switchPanel("flow");

  // Reset all graph elements
  gNodes.selectAll("g").transition().duration(200).style("opacity", 1);
  gLinks.selectAll("line").transition().duration(200).style("opacity", 0.5);
  gLinks.selectAll("line").classed("flow-edge-active", false)
    .attr("stroke-dasharray", null);
  gLabels.selectAll("text").transition().duration(200).style("opacity", 1);
  gNodes.selectAll("g").select("circle, rect, polygon")
    .attr("stroke", "none").attr("stroke-width", 0).attr("filter", "none");

  // Create flow token
  if (flowToken) flowToken.remove();
  flowToken = gRoot.append("circle")
    .attr("class", "flow-token")
    .attr("r", 6)
    .style("opacity", 0);

  // Center on first node
  const firstNode = NODES.find(n => n.id === EXECUTION_TRACE[0].nodeId);
  if (firstNode) {
    const container = document.getElementById("graph");
    const w = container.clientWidth, h = container.clientHeight;
    const transform = d3.zoomTransform(svg.node());
    const tx = w / 2 - firstNode.x * transform.k;
    const ty = h / 2 - firstNode.y * transform.k;
    svg.transition().duration(500).call(
      zoomBehavior.transform,
      d3.zoomIdentity.translate(tx, ty).scale(transform.k)
    );
  }

  // Animate step by step
  let currentStep = 0;
  const totalSteps = EXECUTION_TRACE.length;

  function advanceStep() {
    if (currentStep >= totalSteps) {
      // Done
      flowRunning = false;
      document.getElementById("btnRun").textContent = "▶ 运行";
      status.textContent = "完成";
      status.className = "flow-status done";
      if (flowToken) flowToken.transition().duration(300).style("opacity", 0).remove();
      flowToken = null;
      return;
    }

    const trace = EXECUTION_TRACE[currentStep];
    const node = NODES.find(n => n.id === trace.nodeId);
    if (!node) { currentStep++; advanceStep(); return; }

    // Update flow panel
    document.querySelectorAll(".flow-step").forEach(s => {
      s.classList.remove("active");
      if (s.classList.contains("done")) return;
    });
    const stepEl = document.getElementById("flowStep" + currentStep);
    if (stepEl) {
      stepEl.classList.add("active");
      stepEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    // Mark previous steps as done
    for (let i = 0; i < currentStep; i++) {
      const prev = document.getElementById("flowStep" + i);
      if (prev) prev.classList.add("done");
    }

    // Highlight node on graph
    gNodes.selectAll("g").select("circle, rect, polygon")
      .transition().duration(200)
      .attr("stroke", "none").attr("stroke-width", 0).attr("filter", "none");
    gNodes.selectAll("g").transition().duration(200)
      .style("opacity", nd => nd.id === trace.nodeId ? 1 : 0.2);

    const nodeEl = gNodes.selectAll("g").filter(d => d.id === trace.nodeId);
    nodeEl.select("circle, rect, polygon")
      .transition().duration(200)
      .attr("stroke", "#3b9eff").attr("stroke-width", 2.5).attr("filter", "url(#glow)");

    // Highlight related edges
    const relatedEdges = new Set();
    LINKS.forEach((l, i) => {
      const sId = typeof l.source === "object" ? l.source.id : l.source;
      const tId = typeof l.target === "object" ? l.target.id : l.target;
      if (sId === trace.nodeId || tId === trace.nodeId) relatedEdges.add(i);
    });
    gLinks.selectAll("line").transition().duration(200)
      .style("opacity", (ld, i) => relatedEdges.has(i) ? 0.9 : 0.04);

    // Animate flow token to node
    flowToken.transition().duration(400)
      .style("opacity", 1)
      .attr("cx", node.x).attr("cy", node.y);

    // If next step is a different node, animate edge
    if (currentStep < totalSteps - 1) {
      const nextTrace = EXECUTION_TRACE[currentStep + 1];
      if (nextTrace.nodeId !== trace.nodeId) {
        // Find the edge between current and next
        const edgeIdx = LINKS.findIndex(l => {
          const sId = typeof l.source === "object" ? l.source.id : l.source;
          const tId = typeof l.target === "object" ? l.target.id : l.target;
          return (sId === trace.nodeId && tId === nextTrace.nodeId) ||
                 (sId === nextTrace.nodeId && tId === trace.nodeId);
        });
        if (edgeIdx >= 0) {
          gLinks.selectAll("line").filter((ld, i) => i === edgeIdx)
            .classed("flow-edge-active", true)
            .attr("stroke", "#3b9eff")
            .attr("stroke-width", 2.5);
        }
      }
    }

    currentStep++;
    flowTimer = setTimeout(advanceStep, 1800);
  }

  setTimeout(advanceStep, 400);
}

function stopFlowAnimation() {
  if (flowTimer) clearTimeout(flowTimer);
  flowTimer = null;
  flowRunning = false;

  document.getElementById("btnRun").textContent = "▶ 运行";

  const status = document.getElementById("flowStatus");
  status.textContent = "已停止";
  status.className = "flow-status";

  if (flowToken) { flowToken.remove(); flowToken = null; }

  gLinks.selectAll("line").transition().duration(300)
    .style("opacity", 0.5)
    .attr("stroke-dasharray", null)
    .attr("stroke", d => {
      if (d.type === "contains") return "#555555";
      if (d.type === "calls") return "#3b9eff";
      if (d.type === "imports") return "#555555";
      if (d.type === "instantiates") return "#8b6fbf";
      return "#555555";
    }).attr("stroke-width", 1.2);
  gLinks.selectAll("line").classed("flow-edge-active", false);
  gNodes.selectAll("g").transition().duration(300).style("opacity", 1);
  gLabels.selectAll("text").transition().duration(300).style("opacity", 1);
  gNodes.selectAll("g").select("circle, rect, polygon")
    .transition().duration(300)
    .attr("stroke", "none").attr("stroke-width", 0).attr("filter", "none");
}

function setupFlowButtons() {
  document.getElementById("btnRun").addEventListener("click", () => {
    if (flowRunning) { stopFlowAnimation(); return; }
    startFlowAnimation();
  });
  const btnInline = document.getElementById("btnRunInline");
  if (btnInline) {
    btnInline.addEventListener("click", () => startFlowAnimation());
  }
}

// ====================== Event Bus Wiring ======================
bus.on("node:click", (nodeId) => {
  renderCodePanel(nodeId);
  renderExplanationPanel(nodeId);
  switchPanel("code");

  // Highlight in file tree
  document.querySelectorAll(".tree-row").forEach(r => r.classList.remove("active"));
  const treeRow = document.querySelector(`.tree-row[data-node-id="${nodeId}"]`);
  if (treeRow) {
    treeRow.classList.add("active");
    treeRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});

bus.on("filetree:click", (nodeId) => {
  // Find and click the node in graph
  const nodeData = NODES.find(n => n.id === nodeId);
  if (!nodeData) return;

  // Reset previous
  gNodes.selectAll("g").select("circle, rect, polygon")
    .attr("stroke", "none").attr("stroke-width", 0).attr("filter", "none");

  selectedNodeId = nodeId;

  const nodeEl = gNodes.selectAll("g").filter(d => d.id === nodeId);
  nodeEl.select("circle, rect, polygon")
    .attr("stroke", "#3b9eff").attr("stroke-width", 2).attr("filter", "url(#glow)");

  // Center on node
  const container = document.getElementById("graph");
  const w = container.clientWidth, h = container.clientHeight;
  const transform = d3.zoomTransform(svg.node());
  const tx = w / 2 - nodeData.x * transform.k;
  const ty = h / 2 - nodeData.y * transform.k;
  svg.transition().duration(400).call(
    zoomBehavior.transform,
    d3.zoomIdentity.translate(tx, ty).scale(transform.k)
  );

  bus.emit("node:click", nodeId);
});

// ====================== Init ======================
document.addEventListener("DOMContentLoaded", () => {
  renderStats();
  renderFileTree();
  renderChatPanel();
  initGraph();
  setupFlowButtons();
});
</script>
