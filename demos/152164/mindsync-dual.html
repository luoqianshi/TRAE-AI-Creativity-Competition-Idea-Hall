<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>心晴双擎 MindSync Dual</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        teal: {
          50: '#f0fdfa',
          100: '#ccfbf1',
          200: '#99f6e4',
          300: '#5eead4',
          400: '#2dd4bf',
          500: '#14b8a6',
          600: '#0d9488',
          700: '#0f766e',
          800: '#115e59',
          900: '#134e4a',
        },
        amber: {
          50: '#fffbeb',
          100: '#fef3c7',
          200: '#fde68a',
          300: '#fcd34d',
          400: '#fbbf24',
          500: '#f59e0b',
          600: '#d97706',
          700: '#b45309',
        },
      },
      fontFamily: {
        sans: ['"Noto Sans CJK SC"', '"PingFang SC"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
      },
      animation: {
        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
        'bounce-slow': 'bounce 1.5s infinite',
        'fade-in': 'fadeIn 0.5s ease-in-out',
        'slide-up': 'slideUp 0.4s ease-out',
      },
      keyframes: {
        fadeIn: {
          '0%': { opacity: '0' },
          '100%': { opacity: '1' },
        },
        slideUp: {
          '0%': { transform: 'translateY(20px)', opacity: '0' },
          '100%': { transform: 'translateY(0)', opacity: '1' },
        },
      },
    },
  },
};
</script>
<style>
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
  ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #64748b; }

  .bg-gradient-teal {
    background: linear-gradient(135deg, #0d9488 0%, #14b8a6 50%, #2dd4bf 100%);
  }
  .bg-gradient-card {
    background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 50%, #fffbeb 100%);
  }
  .glass {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
</style>
</head>
<body class="bg-slate-50 font-sans min-h-screen">
<div id="root"></div>

<script>
const { useState, useRef } = React;
const html = htm.bind(React.createElement);

// ==================== 加载动画组件 ====================
function LoadingSpinner({ text = "AI 正在分析中..." }) {
  return html`
    <div className="flex flex-col items-center justify-center py-12 animate-fade-in">
      <div className="relative w-16 h-16 mb-4">
        <div className="absolute inset-0 border-4 border-teal-200 rounded-full"></div>
        <div className="absolute inset-0 border-4 border-teal-600 rounded-full border-t-transparent animate-spin"></div>
        <div className="absolute inset-2 border-4 border-amber-400 rounded-full border-b-transparent animate-spin" style=${{animationDirection: 'reverse', animationDuration: '1.5s'}}></div>
      </div>
      <p className="text-teal-700 font-medium">${text}</p>
      <div className="flex gap-1 mt-2">
        <span className="w-2 h-2 bg-teal-500 rounded-full animate-bounce" style=${{animationDelay: '0s'}}></span>
        <span className="w-2 h-2 bg-teal-500 rounded-full animate-bounce" style=${{animationDelay: '0.2s'}}></span>
        <span className="w-2 h-2 bg-teal-500 rounded-full animate-bounce" style=${{animationDelay: '0.4s'}}></span>
      </div>
    </div>
  `;
}

// ==================== 顶部导航栏 ====================
function NavBar({ activeMode, setActiveMode }) {
  const modes = [
    { id: 'research', label: '🔬 科研质控端', sub: 'Research Pilot' },
    { id: 'public', label: '🛡️ 大众护航端', sub: '心晴罗盘' },
  ];

  return html`
    <nav className="bg-gradient-teal shadow-lg sticky top-0 z-50">
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="flex items-center justify-between h-16">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
              <span className="text-2xl">🧠</span>
            </div>
            <div>
              <h1 className="text-white font-bold text-lg tracking-wide">心晴双擎</h1>
              <p className="text-teal-100 text-xs">MindSync Dual Engine</p>
            </div>
          </div>
          <div className="flex bg-white/15 rounded-xl p-1 backdrop-blur-sm">
            ${modes.map((mode) => html`
              <button
                key=${mode.id}
                onClick=${() => setActiveMode(mode.id)}
                className=${'px-4 py-2 rounded-lg transition-all duration-300 text-sm font-medium ' +
                  (activeMode === mode.id
                    ? 'bg-white text-teal-700 shadow-md transform scale-105'
                    : 'text-white/90 hover:bg-white/10')}
              >
                <span className="block">${mode.label}</span>
                <span className=${'block text-xs ' + (activeMode === mode.id ? 'text-teal-500' : 'text-teal-100')}>
                  ${mode.sub}
                </span>
              </button>
            `)}
          </div>
        </div>
      </div>
    </nav>
  `;
}

// ==================== 模式一：科研质控端 ====================
function ResearchPilot() {
  const [formData, setFormData] = useState({
    title: '唐山市某高校大学生抑郁症状影响因素研究',
    design: 'cross-sectional',
    population: '唐山市某高校全日制本科在校大学生，年龄18-25岁',
  });
  const [isLoading, setIsLoading] = useState(false);
  const [result, setResult] = useState(null);
  const resultRef = useRef(null);

  const designOptions = [
    { value: 'cross-sectional', label: '横断面研究 (Cross-sectional Study)' },
    { value: 'rct', label: '随机对照试验 (Randomized Controlled Trial)' },
    { value: 'cohort', label: '队列研究 (Cohort Study)' },
    { value: 'case-control', label: '病例对照研究 (Case-Control Study)' },
    { value: 'qualitative', label: '质性研究 (Qualitative Study)' },
  ];

  const handleGenerate = () => {
    setIsLoading(true);
    setResult(null);
    setTimeout(() => {
      const title = formData.title;
      // 使用正则：匹配"抑郁症"但后面不跟"状"（避免"抑郁症状"被误判）
      const hasDepression = /抑郁症(?!状)/.test(title);
      const hasSymptom = title.includes('抑郁症状') || title.includes('抑郁情绪');

      const design = formData.design;
      let sampleFormula = '';
      let sampleNote = '';
      if (design === 'cross-sectional') {
        sampleFormula = 'n = Z² × P(1-P) / d²';
        sampleNote = '其中 Z=1.96（95%置信度），P=预估患病率，d=容许误差';
      } else if (design === 'rct') {
        sampleFormula = 'n = 2 × (Zα/2 + Zβ)² × σ² / δ²';
        sampleNote = '其中 α=0.05，β=0.2（检验效能80%），σ=标准差，δ=效应量';
      } else {
        sampleFormula = '根据研究类型调整样本量计算公式';
        sampleNote = '建议参考同类研究的样本量范围进行估算';
      }

      const designLabel = designOptions.find(d => d.value === formData.design)?.label || '';

      setResult({
        termCheck: {
          pass: !hasDepression,
          message: hasDepression
            ? '⚠️ 检测到您使用了"抑郁症"一词。在横断面研究中，建议使用"抑郁症状"或"抑郁情绪"更为严谨。"抑郁症"为临床诊断术语，需由精神科医师确诊后使用。'
            : hasSymptom
            ? '✅ 术语校验：检测到您使用了"抑郁症状"，符合横断面研究背景，表述严谨规范。'
            : '✅ 术语校验：研究题目术语使用规范，未发现不当表述。',
          suggestion: hasDepression ? '建议修改为："抑郁症状"或"抑郁情绪状态"' : null,
        },
        threePrinciples: [
          { name: '随机化 (Randomization)', applicable: design === 'rct', checked: design === 'rct', note: design === 'rct' ? 'RCT核心原则，需采用恰当的随机分配方法' : '横断面研究不适用随机化分组' },
          { name: '对照 (Control)', applicable: true, checked: true, note: design === 'cross-sectional' ? '可设置对照组或进行多因素分析控制混杂' : '研究设计的基本原则' },
          { name: '盲法 (Blinding)', applicable: design === 'rct' || design === 'cohort', checked: design === 'rct', note: design === 'rct' ? '建议采用双盲设计以减少偏倚' : '横断面研究通常不涉及盲法' },
        ],
        sampleSize: {
          method: design === 'cross-sectional' ? '简单随机抽样 / 分层整群抽样' : design === 'rct' ? '平行对照设计' : '目的抽样 / 滚雪球抽样',
          formula: sampleFormula,
          note: sampleNote,
          reference: design === 'cross-sectional' ? '参考：假设抑郁症状检出率约25%，容许误差d=0.05，则n ≈ 289例，考虑20%失访，建议样本量≥361例' : '建议参考同类已发表研究的样本量确定',
        },
        designDraft:
`## 研究设计草案摘要

**研究题目**：${formData.title}

**研究类型**：${designLabel}

**研究对象**：${formData.population}

**研究目的**：
1. 描述目标人群中心理状态波动的分布特征
2. 分析影响情绪状态的相关因素
3. 为心理健康促进策略提供科学依据

**主要研究指标**：
- 情绪状态评估（采用标准化量表）
- 社会人口学特征
- 生活方式与行为因素
- 社会支持与应对方式

**统计分析方法**：
- 描述性统计分析
- 单因素分析（t检验、卡方检验等）
- 多因素分析（Logistic回归 / 线性回归）
- 显著性水平 α = 0.05`,
      });
      setIsLoading(false);
      setTimeout(() => {
        if (resultRef.current) {
          resultRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 100);
    }, 1800);
  };

  return html`
    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div className="text-center mb-8 animate-fade-in">
        <h2 className="text-2xl font-bold text-slate-800 mb-2">
          🔬 科研质控端 · Research Quality Control
        </h2>
        <p className="text-slate-500">AI 辅助科研设计审查 · 术语规范 · 方法学质控</p>
      </div>

      <div className="grid lg:grid-cols-2 gap-8">
        <!-- 左侧：表单区域 -->
        <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-100 animate-slide-up">
          <div className="flex items-center gap-2 mb-6">
            <div className="w-8 h-8 bg-teal-100 rounded-lg flex items-center justify-center">
              <span className="text-teal-600 font-bold text-sm">📝</span>
            </div>
            <h3 className="text-lg font-bold text-slate-800">研究设计信息录入</h3>
          </div>

          <div className="space-y-5">
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-2">
                研究题目 <span className="text-red-500">*</span>
              </label>
              <textarea
                value=${formData.title}
                onChange=${(e) => setFormData({ ...formData, title: e.target.value })}
                rows="2"
                className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all resize-none text-slate-700"
                placeholder="请输入研究题目..."
              ></textarea>
              <p className="text-xs text-slate-400 mt-1">提示：使用"抑郁症状"等表述更符合科研规范</p>
            </div>

            <div>
              <label className="block text-sm font-medium text-slate-700 mb-2">
                研究设计类型 <span className="text-red-500">*</span>
              </label>
              <select
                value=${formData.design}
                onChange=${(e) => setFormData({ ...formData, design: e.target.value })}
                className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all bg-white text-slate-700"
              >
                ${designOptions.map((opt) => html`
                  <option key=${opt.value} value=${opt.value}>${opt.label}</option>
                `)}
              </select>
            </div>

            <div>
              <label className="block text-sm font-medium text-slate-700 mb-2">
                目标人群 <span className="text-red-500">*</span>
              </label>
              <textarea
                value=${formData.population}
                onChange=${(e) => setFormData({ ...formData, population: e.target.value })}
                rows="2"
                className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all resize-none text-slate-700"
                placeholder="请描述研究的目标人群..."
              ></textarea>
            </div>

            <button
              onClick=${handleGenerate}
              disabled=${isLoading}
              className="w-full bg-gradient-teal text-white font-bold py-4 px-6 rounded-xl hover:shadow-lg hover:shadow-teal-500/30 transform hover:-translate-y-0.5 transition-all duration-300 disabled:opacity-70 disabled:cursor-not-allowed disabled:transform-none"
            >
              ${isLoading
                ? html`<span className="flex items-center justify-center gap-2">
                    <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    AI 审查中...
                  </span>`
                : html`<span className="flex items-center justify-center gap-2">
                    ⚡ 生成并审查研究设计
                  </span>`}
            </button>
          </div>
        </div>

        <!-- 右侧：结果展示区 -->
        <div ref=${resultRef} className="bg-white rounded-2xl shadow-lg p-6 border border-slate-100 animate-slide-up" style=${{animationDelay: '0.1s'}}>
          <div className="flex items-center gap-2 mb-6">
            <div className="w-8 h-8 bg-amber-100 rounded-lg flex items-center justify-center">
              <span className="text-amber-600 font-bold text-sm">🛡️</span>
            </div>
            <h3 className="text-lg font-bold text-slate-800">质控审查结果</h3>
            <span className="ml-auto text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">
              AI 智能审查
            </span>
          </div>

          ${!result && !isLoading && html`
            <div className="flex flex-col items-center justify-center py-16 text-slate-400">
              <div className="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center mb-4">
                <span className="text-4xl">🔍</span>
              </div>
              <p className="font-medium text-slate-500">等待审查</p>
              <p className="text-sm mt-1">填写左侧表单后点击"生成并审查"</p>
            </div>
          `}

          ${isLoading && html`<${LoadingSpinner} text="AI 正在审查研究设计..." />`}

          ${result && !isLoading && html`
            <div className="space-y-5 animate-fade-in max-h-[600px] overflow-y-auto pr-2">
              <!-- 术语校验 -->
              <div className=${'p-4 rounded-xl border ' + (result.termCheck.pass ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200')}>
                <div className="flex items-start gap-3">
                  <span className="text-xl">${result.termCheck.pass ? '✅' : '⚠️'}</span>
                  <div>
                    <h4 className=${'font-bold text-sm mb-1 ' + (result.termCheck.pass ? 'text-green-800' : 'text-red-800')}>
                      术语规范性校验
                    </h4>
                    <p className=${'text-sm ' + (result.termCheck.pass ? 'text-green-700' : 'text-red-700')}>
                      ${result.termCheck.message}
                    </p>
                    ${result.termCheck.suggestion && html`
                      <p className="text-sm text-red-600 mt-2 font-medium">
                        💡 ${result.termCheck.suggestion}
                      </p>
                    `}
                  </div>
                </div>
              </div>

              <!-- 三原则核对 -->
              <div className="p-4 rounded-xl border border-teal-100 bg-teal-50/50">
                <h4 className="font-bold text-sm text-teal-800 mb-3 flex items-center gap-2">
                  ✅ 科研三原则适用性核对清单
                </h4>
                <div className="space-y-2">
                  ${result.threePrinciples.map((principle, idx) => html`
                    <div key=${idx} className="flex items-start gap-2 bg-white/70 p-3 rounded-lg">
                      <span className=${'mt-0.5 w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ' +
                        (principle.checked ? 'bg-green-500 text-white' : principle.applicable ? 'bg-amber-400 text-white' : 'bg-slate-300 text-white')}>
                        ${principle.checked ? '✓' : principle.applicable ? '!' : '○'}
                      </span>
                      <div>
                        <p className="text-sm font-medium text-slate-700">${principle.name}</p>
                        <p className="text-xs text-slate-500 mt-0.5">${principle.note}</p>
                      </div>
                    </div>
                  `)}
                </div>
              </div>

              <!-- 样本量提示 -->
              <div className="p-4 rounded-xl border border-amber-100 bg-amber-50/50">
                <h4 className="font-bold text-sm text-amber-800 mb-3 flex items-center gap-2">
                  📊 样本量与抽样方法建议
                </h4>
                <div className="space-y-2 text-sm">
                  <div className="flex items-start gap-2">
                    <span className="text-amber-600 font-medium">抽样方法：</span>
                    <span className="text-slate-700">${result.sampleSize.method}</span>
                  </div>
                  <div className="flex items-start gap-2">
                    <span className="text-amber-600 font-medium">计算公式：</span>
                    <span className="font-mono bg-white px-2 py-1 rounded text-teal-700 border border-amber-200">
                      ${result.sampleSize.formula}
                    </span>
                  </div>
                  <p className="text-xs text-slate-500 italic">${result.sampleSize.note}</p>
                  <div className="mt-2 p-3 bg-white rounded-lg border border-amber-200">
                    <p className="text-xs text-slate-600">
                      <span className="font-medium text-amber-700">💡 参考估算：</span>
                      ${result.sampleSize.reference}
                    </p>
                  </div>
                </div>
              </div>

              <!-- 研究设计草案 -->
              <div className="p-4 rounded-xl border border-slate-200 bg-slate-50">
                <h4 className="font-bold text-sm text-slate-800 mb-3 flex items-center gap-2">
                  📄 AI 生成研究设计草案摘要
                </h4>
                <pre className="text-sm text-slate-600 whitespace-pre-wrap font-sans leading-relaxed">
                  ${result.designDraft}
                </pre>
              </div>

              <!-- 底部提示 -->
              <div className="text-center text-xs text-slate-400 pt-2 border-t border-slate-100">
                <p>⚠️ 以上为 AI 辅助生成的参考建议，最终研究设计请由专业研究者审核确认</p>
              </div>
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

// ==================== 模式二：大众护航端 ====================
function PublicGuard() {
  const [activeTab, setActiveTab] = useState('clinical');
  const [showCard, setShowCard] = useState(false);
  const [cardGenerating, setCardGenerating] = useState(false);

  const aiResponses = {
    clinical: {
      title: '🧐 严谨临床版',
      subtitle: '专业视角 · 科学严谨',
      content:
`您好，感谢您的信任与分享。

根据您的描述"总觉得提不起劲"，这是一种常见的情绪体验。从专业角度来说：

📌 "抑郁症"是严格的临床诊断，需要由精神科医生根据诊断标准（如ICD-11或DSM-5）进行综合评估后才能确诊，不能仅凭单一症状自行判断。

📌 您目前描述的状态，更倾向于"抑郁情绪"或"抑郁症状"的范畴，这是很多人在生活压力、作息变化或特定阶段都可能出现的情绪波动。

📌 建议关注的早期干预信号：
• 持续两周以上的情绪低落
• 对以往感兴趣的事物失去兴趣
• 睡眠或食欲明显改变
• 精力下降、容易疲劳
• 自我评价降低或有无助感

如果这些状态持续时间较长且影响到日常生活，建议及时寻求专业帮助。学校心理辅导中心、精神卫生机构都是可以信赖的资源。`,
    },
    casual: {
      title: '🎤 脱口秀轻松版',
      subtitle: '轻松幽默 · 减压疏导',
      content:
`嘿朋友！先给你一个大大的虚拟拥抱 🤗
