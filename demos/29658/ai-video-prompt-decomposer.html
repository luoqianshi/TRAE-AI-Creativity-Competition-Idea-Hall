<!DOCTYPE html>
<!-- AI 视频 Prompt 拆解器 — 创意产物演示 Demo / 桌面端 1440px -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 视频 Prompt 拆解器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  ::-webkit-scrollbar { width: 0; height: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
  .grad-text { background: linear-gradient(135deg,#a78bfa,#22d3ee); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .grad-btn { background: linear-gradient(135deg,#7c3aed,#06b6d4); }
  .grad-btn:hover { filter: brightness(1.12); }
  .card-anim { animation: fadeInUp .5s cubic-bezier(0.25,0.46,0.45,0.94) both; }
  @keyframes fadeInUp { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .chip:hover { background: rgba(167,139,250,0.18); }
</style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">

<div class="max-w-6xl mx-auto px-6 py-10">

  <!-- Header -->
  <header class="flex items-center justify-between mb-10">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl grad-btn flex items-center justify-center">
        <iconify-icon icon="lucide:clapperboard" class="text-2xl text-white"></iconify-icon>
      </div>
      <div>
        <h1 class="text-xl font-bold grad-text">AI 视频 Prompt 拆解器</h1>
        <p class="text-xs text-gray-500">一句话创意 → 结构化提示词，少抽卡，多出片</p>
      </div>
    </div>
    <span class="text-xs px-3 py-1 rounded-full glass text-cyan-300">学习工作赛道 · 创意产物 Demo</span>
  </header>

  <!-- Input -->
  <section class="glass rounded-2xl p-6 mb-6">
    <label class="text-sm text-gray-400 mb-2 flex items-center gap-2">
      <iconify-icon icon="lucide:pencil-line"></iconify-icon> 输入你的一句话创意
    </label>
    <textarea id="ideaInput" rows="2" class="w-full bg-gray-900/60 border border-white/10 rounded-xl px-4 py-3 text-gray-100 outline-none focus:border-violet-400 resize-none" placeholder="例如：一个女孩在雨夜的霓虹街道上奔跑，回头一笑"></textarea>

    <div class="flex flex-wrap gap-2 mt-3">
      <span class="text-xs text-gray-500 self-center mr-1">试试：</span>
      <button class="chip text-xs px-3 py-1 rounded-full bg-white/5 transition" onclick="setIdea(this)">一个女孩在雨夜的霓虹街道上奔跑，回头一笑</button>
      <button class="chip text-xs px-3 py-1 rounded-full bg-white/5 transition" onclick="setIdea(this)">一只橘猫在阳光洒落的窗台上慵懒打哈欠</button>
      <button class="chip text-xs px-3 py-1 rounded-full bg-white/5 transition" onclick="setIdea(this)">未来城市的清晨，一辆飞行汽车缓缓驶过摩天楼</button>
    </div>

    <div class="flex flex-wrap items-center gap-4 mt-5">
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400">风格</span>
        <select id="styleSel" class="bg-gray-900/60 border border-white/10 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-violet-400">
          <option value="电影感写实">电影感写实</option>
          <option value="赛博朋克">赛博朋克</option>
          <option value="日系动画">日系动画</option>
          <option value="3D 皮克斯风">3D 皮克斯风</option>
          <option value="复古胶片">复古胶片</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-gray-400">时长</span>
        <select id="durSel" class="bg-gray-900/60 border border-white/10 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-violet-400">
          <option value="3-5 秒短镜头">3-5 秒短镜头</option>
          <option value="5-10 秒标准镜头">5-10 秒标准镜头</option>
          <option value="10 秒以上长镜头">10 秒以上长镜头</option>
        </select>
      </div>
      <button onclick="decompose()" class="grad-btn ml-auto px-6 py-2.5 rounded-xl text-white font-medium flex items-center gap-2 transition">
        <iconify-icon icon="lucide:wand-2"></iconify-icon> 拆解
      </button>
    </div>
  </section>

  <!-- Empty state -->
  <div id="emptyState" class="text-center py-16 text-gray-600">
    <iconify-icon icon="lucide:sparkles" class="text-5xl"></iconify-icon>
    <p class="mt-3 text-sm">输入创意后点击「拆解」，自动生成结构化提示词模块</p>
  </div>

  <!-- Output -->
  <section id="output" class="hidden">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-sm text-gray-400 flex items-center gap-2"><iconify-icon icon="lucide:layout-grid"></iconify-icon> 拆解结果（7 大模块）</h2>
      <button onclick="copyAll()" id="copyBtn" class="text-xs px-4 py-2 rounded-lg glass hover:bg-white/10 flex items-center gap-2 transition">
        <iconify-icon icon="lucide:copy"></iconify-icon> 一键复制完整 Prompt
      </button>
    </div>
    <div id="cards" class="grid grid-cols-2 gap-4 mb-6"></div>

    <div class="glass rounded-2xl p-5">
      <p class="text-xs text-gray-400 mb-2 flex items-center gap-2"><iconify-icon icon="lucide:terminal"></iconify-icon> 拼接后的完整提示词（可直接粘贴到 Sora / 可灵 / 即梦）</p>
      <p id="finalPrompt" class="text-sm text-cyan-200 leading-relaxed font-mono"></p>
    </div>
  </section>

  <footer class="text-center text-xs text-gray-600 mt-12">
    本页为创意方案演示原型 · 拆解逻辑基于结构化模板，实际产品将接入大模型自动补全
  </footer>
</div>

<script>
const MODULES = [
  { key:'subject',  icon:'lucide:user',          name:'主体 Subject',     color:'text-violet-300' },
  { key:'action',   icon:'lucide:activity',      name:'动作 Action',      color:'text-pink-300' },
  { key:'scene',    icon:'lucide:mountain',      name:'场景 Scene',       color:'text-emerald-300' },
  { key:'camera',   icon:'lucide:video',         name:'镜头运动 Camera',  color:'text-cyan-300' },
  { key:'light',    icon:'lucide:sun',           name:'光影 Lighting',    color:'text-amber-300' },
  { key:'style',    icon:'lucide:palette',       name:'风格 Style',       color:'text-fuchsia-300' },
  { key:'tempo',    icon:'lucide:gauge',         name:'节奏/时长 Tempo',  color:'text-sky-300' },
];

function setIdea(btn){ document.getElementById('ideaInput').value = btn.textContent.trim(); }

// 轻量规则拆解：从一句话里抽取/补全各模块（演示用，真实产品由大模型完成）
function analyze(text, style, dur){
  const t = text.trim();
  // 主体：取主语线索
  let subject = t.match(/(一[只个位名头条]\S{0,8}|[一-龥]{1,6}(女孩|男孩|女人|男人|猫|狗|人|汽车|城市|机器人))/);
  subject = subject ? subject[0] : '画面主体';
  // 动作
  let action = t.match(/(奔跑|行走|回头|微笑|打哈欠|驶过|飞行|跳跃|转身|凝视|挥手|奔向|缓缓\S{0,4})/g);
  action = action ? action.join('、') : '自然的动态动作';
  // 场景
  let scene = t.match(/(雨夜|霓虹|街道|窗台|阳光|城市|清晨|森林|海边|沙漠|室内|夜晚|黄昏)/g);
  scene = scene ? scene.join('、') + '环境' : '与主体氛围匹配的环境';

  const cameraMap = {
    '电影感写实':'缓慢推近 + 轻微手持跟拍，浅景深',
    '赛博朋克':'低角度环绕运镜，广角畸变，动态追焦',
    '日系动画':'平移横移 + 定格回头，2D 分层视差',
    '3D 皮克斯风':'弧形环绕 + 拉远展示全景',
    '复古胶片':'固定机位轻微晃动，胶片颗粒感'
  };
  const lightMap = {
    '电影感写实':'柔和侧逆光，体积光，冷暖对比',
    '赛博朋克':'霓虹反射光，青品紫高饱和，湿地面反光',
    '日系动画':'通透自然光，柔和高光，清新色调',
    '3D 皮克斯风':'明亮主光 + 柔和补光，饱满色彩',
    '复古胶片':'暖黄阳光，轻微漏光，低对比'
  };

  return {
    subject,
    action,
    scene,
    camera: cameraMap[style],
    light: lightMap[style],
    style: style + '，4K 高清，电影级画质',
    tempo: dur + '，运动流畅自然'
  };
}

let lastResult = null;

function decompose(){
  const text = document.getElementById('ideaInput').value.trim();
  if(!text){ document.getElementById('ideaInput').focus(); return; }
  const style = document.getElementById('styleSel').value;
  const dur = document.getElementById('durSel').value;
  const r = analyze(text, style, dur);
  lastResult = r;

  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('output').classList.remove('hidden');

  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  MODULES.forEach((m,i)=>{
    const div = document.createElement('div');
    div.className = 'glass rounded-xl p-4 card-anim';
    div.style.animationDelay = (i*0.06)+'s';
    div.innerHTML = `
      <div class="flex items-center gap-2 mb-2">
        <iconify-icon icon="${m.icon}" class="${m.color} text-lg"></iconify-icon>
        <span class="text-sm font-medium ${m.color}">${m.name}</span>
      </div>
      <p class="text-sm text-gray-300 leading-relaxed">${r[m.key]}</p>`;
    cards.appendChild(div);
  });

  const final = `${r.subject}，${r.action}，置身${r.scene}；镜头：${r.camera}；光影：${r.light}；风格：${r.style}；${r.tempo}。`;
  document.getElementById('finalPrompt').textContent = final;
}

function copyAll(){
  if(!document.getElementById('finalPrompt').textContent) return;
  navigator.clipboard.writeText(document.getElementById('finalPrompt').textContent).then(()=>{
    const b = document.getElementById('copyBtn');
    const old = b.innerHTML;
    b.innerHTML = '<iconify-icon icon="lucide:check"></iconify-icon> 已复制';
    setTimeout(()=> b.innerHTML = old, 1600);
  });
}
</script>
</body>
</html>
