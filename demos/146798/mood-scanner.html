<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心境体检仪 | Mood Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Quicksand:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================
   全局重置 & 字体
   ============================ */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: #FFF9F0;
  --bg-card: #FFFFFF;
  --bg-soft: #FFF5E4;
  --orange: #FF9F43;
  --yellow: #FECA57;
  --green: #6BCB77;
  --purple: #A29BFE;
  --pink: #FF6B9D;
  --blue: #54A0FF;
  --red: #EE5A6F;
  --text-main: #5A4A3A;
  --text-soft: #A89580;
  --text-light: #D4C5B0;
  --shadow-warm: 0 4px 20px rgba(255, 159, 67, 0.12);
  --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.04);
  --shadow-card: 0 8px 30px rgba(255, 159, 67, 0.08);
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --font-cute: 'ZCOOL KuaiLe', 'Quicksand', 'Noto Sans SC', sans-serif;
  --font-body: 'Quicksand', 'Noto Sans SC', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text-main);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  line-height: 1.7;
}

/* 背景花朵装饰 */
.bg-deco {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.bg-deco svg {
  position: absolute;
  opacity: 0.5;
}

.float-1 { top: 5%; left: 3%; animation: float-slow 8s ease-in-out infinite; }
.float-2 { top: 15%; right: 4%; animation: float-slow 10s ease-in-out infinite 1s; }
.float-3 { top: 45%; left: 2%; animation: float-slow 7s ease-in-out infinite 2s; }
.float-4 { top: 70%; right: 3%; animation: float-slow 9s ease-in-out infinite 0.5s; }
.float-5 { bottom: 8%; left: 5%; animation: float-slow 11s ease-in-out infinite 3s; }
.float-6 { bottom: 20%; right: 6%; animation: float-slow 8s ease-in-out infinite 1.5s; }

@keyframes float-slow {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(5deg); }
}

/* ============================
   主容器
   ============================ */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 24px 80px;
  position: relative;
  z-index: 1;
}

/* ============================
   标题区
   ============================ */
.header {
  text-align: center;
  margin-bottom: 36px;
  position: relative;
}

.mascot-area {
  position: relative;
  display: inline-block;
  margin-bottom: 12px;
}

.title {
  font-family: var(--font-cute);
  font-size: 38px;
  font-weight: 400;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--orange) 0%, var(--pink) 50%, var(--purple) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative;
  display: inline-block;
}

.title-emoji {
  font-size: 32px;
  vertical-align: middle;
  margin: 0 6px;
  animation: wiggle 3s ease-in-out infinite;
  display: inline-block;
}

@keyframes wiggle {
  0%, 100% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(-10deg) scale(1.1); }
  75% { transform: rotate(10deg) scale(1.1); }
}

.subtitle {
  margin-top: 8px;
  font-size: 13px;
  color: var(--text-soft);
  letter-spacing: 3px;
  font-weight: 500;
}

.status-bar {
  margin-top: 12px;
  font-size: 12px;
  color: var(--green);
  letter-spacing: 1px;
  font-weight: 600;
}

.status-bar .dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  margin-right: 6px;
  animation: pulse-dot 1.5s infinite;
  vertical-align: middle;
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(107, 203, 119, 0.4); }
  50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(107, 203, 119, 0); }
}

/* ============================
   输入区
   ============================ */
.input-section {
  position: relative;
  margin-bottom: 28px;
}

.input-label {
  font-size: 14px;
  color: var(--orange);
  letter-spacing: 2px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
}

.input-label::before {
  content: '🌸';
  font-size: 16px;
}

.input-box {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 24px;
  position: relative;
  transition: box-shadow 0.3s, border-color 0.3s;
  border: 2px solid transparent;
  box-shadow: var(--shadow-card);
}

.input-box:focus-within {
  border-color: var(--orange);
  box-shadow: 0 0 0 4px rgba(255, 159, 67, 0.1), var(--shadow-card);
}

#userInput {
  width: 100%;
  min-height: 140px;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.8;
  resize: vertical;
}

#userInput::placeholder {
  color: var(--text-light);
}

.char-count {
  text-align: right;
  font-size: 12px;
  color: var(--text-soft);
  margin-top: 6px;
  letter-spacing: 1px;
}

/* 扫描按钮 */
.scan-btn {
  display: block;
  width: 100%;
  padding: 18px;
  margin-top: 16px;
  background: linear-gradient(135deg, var(--orange) 0%, var(--pink) 100%);
  border: none;
  border-radius: var(--radius-md);
  color: #fff;
  font-family: var(--font-cute);
  font-size: 18px;
  font-weight: 400;
  letter-spacing: 4px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.3s;
  box-shadow: 0 4px 15px rgba(255, 159, 67, 0.3);
}

.scan-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.5s;
}

.scan-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(255, 159, 67, 0.4);
}

.scan-btn:hover::before {
  left: 100%;
}

.scan-btn:active {
  transform: translateY(0);
}

.scan-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.scan-btn .btn-icon {
  margin-right: 8px;
  display: inline-block;
  animation: bounce-icon 1.5s ease-in-out infinite;
}

@keyframes bounce-icon {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ============================
   扫描动画区
   ============================ */
.scan-overlay {
  display: none;
  position: relative;
  padding: 50px 20px;
  text-align: center;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 28px;
  box-shadow: var(--shadow-card);
}

.scan-overlay.active {
  display: block;
}

.scan-cat-container {
  display: inline-block;
  position: relative;
  margin-bottom: 20px;
}

.scan-cat-container svg {
  animation: scan-bounce 0.8s ease-in-out infinite;
}

@keyframes scan-bounce {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(3deg); }
}

.scan-text {
  font-size: 16px;
  color: var(--purple);
  letter-spacing: 3px;
  font-weight: 600;
  font-family: var(--font-cute);
}

.scan-text .dots::after {
  content: '';
  animation: dots-anim 1.2s infinite;
}

@keyframes dots-anim {
  0% { content: ''; }
  25% { content: '·'; }
  50% { content: '··'; }
  75% { content: '···'; }
}

.scan-code {
  margin-top: 12px;
  font-size: 11px;
  color: var(--text-light);
  letter-spacing: 1px;
  line-height: 1.8;
  font-family: var(--font-body);
}

/* 飘落花瓣 */
.petal-rain {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
}

.petal {
  position: absolute;
  font-size: 14px;
  animation: petal-fall linear infinite;
}

@keyframes petal-fall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
  100% { transform: translateY(300px) rotate(360deg); opacity: 0; }
}

/* ============================
   结果区
   ============================ */
.result-section {
  display: none;
  margin-bottom: 36px;
}

.result-section.show {
  display: block;
  animation: result-pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes result-pop-in {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.result-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  font-size: 13px;
  color: var(--green);
  letter-spacing: 2px;
  font-weight: 600;
}

.result-header .line {
  flex: 1;
  height: 2px;
  background: linear-gradient(90deg, var(--green), transparent);
  border-radius: 1px;
}

/* 情绪雷达 */
.radar-box {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  margin-bottom: 16px;
  position: relative;
  box-shadow: var(--shadow-card);
}

.radar-box::before {
  content: '🎈 情绪雷达';
  position: absolute;
  top: -12px;
  left: 24px;
  background: var(--bg);
  padding: 2px 14px;
  font-size: 13px;
  color: var(--blue);
  letter-spacing: 1px;
  font-weight: 600;
  border-radius: 20px;
}

.emotion-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.emotion-bar:last-child {
  margin-bottom: 0;
}

.emotion-label {
  width: 64px;
  font-size: 15px;
  font-weight: 700;
  text-align: right;
  flex-shrink: 0;
}

.emotion-track {
  flex: 1;
  height: 24px;
  background: var(--bg-soft);
  border-radius: 20px;
  overflow: hidden;
  position: relative;
}

.emotion-fill {
  height: 100%;
  border-radius: 20px;
  width: 0;
  transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

.emotion-fill::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { left: -100%; }
  100% { left: 200%; }
}

.emotion-percent {
  width: 50px;
  font-size: 14px;
  font-weight: 700;
  text-align: right;
  flex-shrink: 0;
}

/* 一句话洞察 - 对话气泡 */
.insight-box {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 28px 24px 24px;
  margin-bottom: 16px;
  position: relative;
  box-shadow: var(--shadow-card);
}

.insight-box::before {
  content: '💡 一句话洞察';
  position: absolute;
  top: -12px;
  left: 24px;
  background: var(--bg);
  padding: 2px 14px;
  font-size: 13px;
  color: var(--purple);
  letter-spacing: 1px;
  font-weight: 600;
  border-radius: 20px;
}

.insight-content {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.insight-avatar {
  flex-shrink: 0;
  width: 56px;
  height: 56px;
  position: relative;
}

.insight-avatar svg {
  width: 100%;
  height: 100%;
}

.insight-bubble {
  flex: 1;
  background: var(--bg-soft);
  border-radius: 4px 20px 20px 20px;
  padding: 16px 18px;
  position: relative;
}

.insight-bubble::before {
  content: '';
  position: absolute;
  left: -8px;
  top: 12px;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 8px 10px 8px 0;
  border-color: transparent var(--bg-soft) transparent transparent;
}

.insight-text {
  font-size: 16px;
  line-height: 1.8;
  color: var(--text-main);
  font-weight: 500;
  min-height: 28px;
}

.insight-text .cursor-blink {
  display: inline-block;
  width: 8px;
  height: 18px;
  background: var(--orange);
  margin-left: 2px;
  animation: blink-cursor 0.8s infinite;
  vertical-align: text-bottom;
  border-radius: 2px;
}

@keyframes blink-cursor {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

/* 微动作处方 */
.prescription-box {
  background: linear-gradient(135deg, #FFF5E4 0%, #FFE8D6 100%);
  border-radius: var(--radius-lg);
  padding: 28px 24px 24px;
  margin-bottom: 16px;
  position: relative;
  box-shadow: 0 8px 30px rgba(255, 159, 67, 0.12);
  border: 2px solid var(--yellow);
}

.prescription-box::before {
  content: '🌿 微动作处方';
  position: absolute;
  top: -12px;
  left: 24px;
  background: var(--bg);
  padding: 2px 14px;
  font-size: 13px;
  color: var(--green);
  letter-spacing: 1px;
  font-weight: 600;
  border-radius: 20px;
}

.prescription-content {
  display: flex;
  gap: 16px;
  align-items: center;
}

.prescription-icon {
  font-size: 40px;
  flex-shrink: 0;
  animation: prescription-pulse 2s ease-in-out infinite;
}

@keyframes prescription-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

.prescription-info {
  flex: 1;
}

.prescription-text {
  font-size: 18px;
  font-weight: 700;
  color: var(--orange);
  line-height: 1.6;
}

.prescription-time {
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-soft);
  letter-spacing: 1px;
}

/* 重新扫描按钮 */
.rescan-btn {
  display: block;
  width: 100%;
  padding: 14px;
  background: var(--bg-card);
  border: 2px solid var(--bg-soft);
  color: var(--text-soft);
  font-family: var(--font-cute);
  font-size: 14px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s;
  border-radius: var(--radius-md);
  margin-top: 4px;
  font-weight: 400;
}

.rescan-btn:hover {
  border-color: var(--purple);
  color: var(--purple);
  background: rgba(162, 155, 254, 0.05);
}

/* ============================
   情绪记录墙
   ============================ */
.history-section {
  margin-top: 48px;
  border-top: 2px dashed var(--bg-soft);
  padding-top: 36px;
}

.history-header {
  font-size: 15px;
  color: var(--pink);
  letter-spacing: 2px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
}

.history-header::before {
  content: '🐾';
  font-size: 18px;
}

.history-empty {
  text-align: center;
  padding: 36px 20px;
  color: var(--text-light);
  font-size: 14px;
  letter-spacing: 1px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-soft);
}

.history-empty .empty-icon {
  font-size: 36px;
  display: block;
  margin-bottom: 12px;
  opacity: 0.4;
}

.history-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.history-item {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  box-shadow: var(--shadow-soft);
  border-left: 4px solid var(--yellow);
}

.history-item:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-warm);
}

.history-time {
  font-size: 12px;
  color: var(--text-soft);
  letter-spacing: 1px;
  flex-shrink: 0;
  width: 90px;
  font-weight: 600;
}

.history-emotions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.history-tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 1px;
  font-weight: 600;
}

.history-insight {
  flex: 1;
  font-size: 13px;
  color: var(--text-main);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.5;
}

.history-delete {
  background: none;
  border: none;
  color: var(--text-light);
  cursor: pointer;
  font-size: 16px;
  padding: 4px 8px;
  transition: color 0.3s, transform 0.2s;
  flex-shrink: 0;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.history-delete:hover {
  color: var(--red);
  background: rgba(238, 90, 111, 0.1);
  transform: scale(1.1);
}

/* 周报总结 */
.weekly-report {
  background: linear-gradient(135deg, #F3E8FF 0%, #FFF0F5 100%);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
  position: relative;
  display: none;
  border: 2px solid var(--purple);
}

.weekly-report.show {
  display: block;
  animation: result-pop-in 0.5s ease;
}

.weekly-report::before {
  content: '📊 本周情绪报告';
  position: absolute;
  top: -12px;
  left: 24px;
  background: var(--bg);
  padding: 2px 14px;
  font-size: 13px;
  color: var(--purple);
  letter-spacing: 1px;
  font-weight: 600;
  border-radius: 20px;
}

.weekly-text {
  font-size: 14px;
  line-height: 2;
  color: var(--text-main);
}

.clear-history-btn {
  display: block;
  margin-top: 16px;
  background: none;
  border: 2px solid var(--bg-soft);
  color: var(--text-soft);
  font-family: var(--font-body);
  font-size: 12px;
  padding: 8px 16px;
  cursor: pointer;
  border-radius: var(--radius-sm);
  letter-spacing: 1px;
  transition: all 0.3s;
  font-weight: 600;
}

.clear-history-btn:hover {
  border-color: var(--red);
  color: var(--red);
  background: rgba(238, 90, 111, 0.05);
}

/* ============================
   底部装饰
   ============================ */
.footer-deco {
  text-align: center;
  margin-top: 40px;
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: 2px;
}

.footer-deco .flowers {
  font-size: 20px;
  margin-bottom: 8px;
  letter-spacing: 8px;
}

/* ============================
   响应式
   ============================ */
@media (max-width: 600px) {
  .container {
    padding: 24px 16px 60px;
  }
  .title {
    font-size: 28px;
    letter-spacing: 2px;
  }
  #userInput {
    font-size: 15px;
  }
  .history-item {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .history-insight {
    white-space: normal;
  }
  .emotion-label {
    width: 52px;
    font-size: 14px;
  }
  .insight-content {
    flex-direction: column;
    gap: 0;
  }
  .insight-avatar {
    width: 44px;
    height: 44px;
    margin-bottom: -10px;
    margin-left: 10px;
    z-index: 2;
    position: relative;
  }
  .insight-bubble::before {
    display: none;
  }
  .insight-bubble {
    border-radius: 20px;
  }
  .prescription-content {
    gap: 10px;
  }
  .prescription-icon {
    font-size: 32px;
  }
  .prescription-text {
    font-size: 16px;
  }
}

/* 滚动条 */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg-soft);
}

::-webkit-scrollbar-thumb {
  background: var(--orange);
  border-radius: 4px;
  opacity: 0.5;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--pink);
}

/* 选中文字颜色 */
::selection {
  background: rgba(255, 159, 67, 0.2);
  color: var(--text-main);
}
</style>
</head>
<body>

<!-- 背景花朵装饰 -->

/* ============================================================
   核心分析函数
   ============================================================ */
function analyzeMood(text) {
  const scores = {};
  let totalWeight = 0;

  for (const [key, data] of Object.entries(EMOTION_DB)) {
    let score = 0;
    for (const kw of data.keywords) {
      if (text.includes(kw)) {
        score += Math.max(kw.length, 1) * 2;
      }
    }
    scores[key] = score;
    totalWeight += score;
  }

  if (totalWeight === 0) {
    scores.anxiety = 1;
    scores.fatigue = 1;
    scores.confusion = 1;
    totalWeight = 3;
  }

  const sorted = Object.entries(scores)
    .filter(([k, v]) => v > 0)
    .sort((a, b) => b[1] - a[1]);

  const allKeys = Object.keys(EMOTION_DB);
  while (sorted.length < 3) {
    const remaining = allKeys.filter(k => !sorted.some(([s]) => s === k));
    if (remaining.length === 0) break;
    const pick = remaining[Math.floor(Math.random() * remaining.length)];
    scores[pick] = scores[pick] || 1;
    totalWeight += scores[pick];
    sorted.push([pick, scores[pick]]);
  }

  const top3 = sorted.slice(0, 3);
  const top3Sum = top3.reduce((sum, [, v]) => sum + v, 0);
  
  const emotions = top3.map(([key, val], idx) => {
    let pct = Math.round((val / top3Sum) * 100);
    if (idx === 0 && pct < 35) pct = 35;
    if (idx === 2 && pct < 5) pct = 5;
    return {
      key,
      label: EMOTION_DB[key].label,
      color: EMOTION_DB[key].color,
      bg: EMOTION_DB[key].bg,
      emoji: EMOTION_DB[key].emoji,
      percent: pct
    };
  });

  const sum = emotions.reduce((s, e) => s + e.percent, 0);
  if (sum !== 100) {
    emotions[0].percent += (100 - sum);
  }

  const insight = generateInsight(emotions, text);
  const prescription = PRESCRIPTIONS[Math.floor(Math.random() * PRESCRIPTIONS.length)];

  return { emotions, insight, prescription };
}

function generateInsight(emotions, text) {
  const topKeys = emotions.map(e => e.key);
  const top1 = topKeys[0];
  const top2 = topKeys[1];

  for (const combo of COMBO_INSIGHTS) {
    if (topKeys.includes(combo.combo[0]) && topKeys.includes(combo.combo[1])) {
      if ((top1 === combo.combo[0] || top1 === combo.combo[1]) &&
          (top2 === combo.combo[0] || top2 === combo.combo[1])) {
        return combo.texts[Math.floor(Math.random() * combo.texts.length)];
      }
    }
  }

  const templates = INSIGHT_TEMPLATES[top1];
  if (templates) {
    return templates[Math.floor(Math.random() * templates.length)];
  }

  return "你现在的状态，像是把所有情绪都压在了一个很小的盒子里。试试打开它，看看里面到底是什么。";
}

/* ============================================================
   UI 交互逻辑
   ============================================================ */
let currentResult = null;
let scanTimer = null;

document.getElementById('userInput').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length;
});

document.getElementById('userInput').addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    startScan();
  }
});

function startScan() {
  const text = document.getElementById('userInput').value.trim();
  if (!text) {
    flashInput();
    return;
  }

  document.getElementById('resultSection').classList.remove('show');
  
  const overlay = document.getElementById('scanOverlay');
  overlay.classList.add('active');
  
  // 生成花瓣雨
  createPetals();
  
  const btn = document.getElementById('scanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="btn-icon">🐾</span>小柴犬听ing...';

  const codes = [
    '> 🌸 正在阅读你的心声...',
    '> 🐱 分析情绪波长中...',
    '> ✨ 寻找那些没说出口的话...',
    '> 💝 感受你文字里的温度...',
    '> 🌈 为你准备一个温柔的回应...',
    '> ✅ 完成！'
  ];
  
  let codeIdx = 0;
  const codeEl = document.getElementById('scanCode');
  codeEl.innerHTML = '';
  
  scanTimer = setInterval(() => {
    if (codeIdx < codes.length) {
      codeEl.innerHTML += codes[codeIdx] + '<br>';
      codeIdx++;
    }
  }, 380);

  setTimeout(() => {
    clearInterval(scanTimer);
    overlay.classList.remove('active');
    
    currentResult = analyzeMood(text);
    renderResult(currentResult);
    saveToHistory(text, currentResult);
    
    btn.disabled = false;
    btn.innerHTML = '<span class="btn-icon">🐾</span>扫描心境';
  }, 2500);
}

function createPetals() {
  const container = document.getElementById('petalRain');
  container.innerHTML = '';
  const petals = ['🌸', '🌼', '🌷', '✨', '💛', '🦋'];
  
  for (let i = 0; i < 12; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.textContent = petals[Math.floor(Math.random() * petals.length)];
    petal.style.left = Math.random() * 100 + '%';
    petal.style.animationDuration = (2 + Math.random() * 2) + 's';
    petal.style.animationDelay = (Math.random() * 2) + 's';
    petal.style.fontSize = (12 + Math.random() * 8) + 'px';
    container.appendChild(petal);
  }
}

function flashInput() {
  const box = document.querySelector('.input-box');
  box.style.borderColor = 'var(--red)';
  box.style.boxShadow = '0 0 0 4px rgba(238, 90, 111, 0.1)';
  setTimeout(() => {
    box.style.borderColor = '';
    box.style.boxShadow = '';
  }, 800);
}

function renderResult(result) {
  const section = document.getElementById('resultSection');
  
  const now = new Date();
  const timeStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('resultTime').textContent = timeStr;

  const radarBox = document.getElementById('radarBox');
  radarBox.innerHTML = result.emotions.map(e => `
    <div class="emotion-bar">
      <div class="emotion-label" style="color:${e.color}">${e.emoji} ${e.label}</div>
      <div class="emotion-track">
        <div class="emotion-fill" style="background:${e.color}" data-width="${e.percent}"></div>
      </div>
      <div class="emotion-percent" style="color:${e.color}">${e.percent}%</div>
    </div>
  `).join('');

  const insightEl = document.getElementById('insightText');
  insightEl.innerHTML = '<span class="cursor-blink"></span>';
  typewriter(insightEl, result.insight, 40);

  document.getElementById('prescriptionText').textContent = result.prescription.text;
  document.getElementById('prescriptionIcon').textContent = result.prescription.icon;

  section.classList.add('show');

  setTimeout(() => {
    document.querySelectorAll('.emotion-fill').forEach(bar => {
      bar.style.width = bar.dataset.width + '%';
    });
  }, 100);
}

function typewriter(el, text, speed) {
  let i = 0;
  el.innerHTML = '<span class="cursor-blink"></span>';
  const cursor = el.querySelector('.cursor-blink');
  
  function type() {
    if (i < text.length) {
      cursor.insertAdjacentText('beforebegin', text[i]);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

function resetAll() {
  document.getElementById('resultSection').classList.remove('show');
  document.getElementById('userInput').value = '';
  document.getElementById('charCount').textContent = '0';
  document.getElementById('userInput').focus();
  currentResult = null;
}

/* ============================================================
   情绪记录墙 - localStorage 持久化
   ============================================================ */
const STORAGE_KEY = 'mood_scanner_history';

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch {
    return [];
  }
}

function saveToHistory(text, result) {
  const history = getHistory();
  history.unshift({
    id: Date.now(),
    timestamp: new Date().toISOString(),
    text: text.substring(0, 200),
    emotions: result.emotions.map(e => ({ label: e.label, percent: e.percent, color: e.color, emoji: e.emoji })),
    insight: result.insight,
    prescription: result.prescription.text
  });
  
  if (history.length > 50) history.length = 50;
  
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  renderHistory();
}

function deleteHistory(id) {
  const history = getHistory().filter(h => h.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  renderHistory();
}

function clearHistory() {
  if (confirm('确定要清空所有情绪记录吗？小柴犬会想它们的 🥺')) {
    localStorage.removeItem(STORAGE_KEY);
    renderHistory();
  }
}

function renderHistory() {
  const history = getHistory();
  const container = document.getElementById('historyContent');
  const reportEl = document.getElementById('weeklyReport');

  if (history.length === 0) {
    container.innerHTML = '<div class="history-empty"><span class="empty-icon">🌸</span>暂无记录 · 完成第一次扫描后，这里会开满小花</div>';
    reportEl.classList.remove('show');
    return;
  }

  let html = '<div class="history-list">';
  for (const item of history.slice(0, 20)) {
    const date = new Date(item.timestamp);
    const dateStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    const tags = item.emotions.slice(0, 3).map(e => 
      `<span class="history-tag" style="background:${e.color}22;color:${e.color}">${e.emoji} ${e.label} ${e.percent}%</span>`
    ).join('');
    
    html += `
      <div class="history-item" style="border-left-color:${item.emotions[0].color}">
        <div class="history-time">${dateStr}</div>
        <div class="history-emotions">${tags}</div>
        <div class="history-insight">${escapeHtml(item.insight)}</div>
        <button class="history-delete" onclick="deleteHistory(${item.id})" title="删除">✕</button>
      </div>
    `;
  }
  html += '</div>';
  
  if (history.length > 0) {
    html += '<button class="clear-history-btn" onclick="clearHistory()">🗑️ 清空记录</button>';
  }
  
  container.innerHTML = html;
  renderWeeklyReport(history);
}

function renderWeeklyReport(history) {
  const reportEl = document.getElementById('weeklyReport');
  
  const now = new Date();
  const weekStart = new Date(now);
  weekStart.setDate(now.getDate() - now.getDay());
  weekStart.setHours(0, 0, 0, 0);

  const thisWeek = history.filter(h => new Date(h.timestamp) >= weekStart);
  
  if (thisWeek.length < 2) {
    reportEl.classList.remove('show');
    return;
  }

  const emotionStats = {};
  for (const item of thisWeek) {
    for (const e of item.emotions) {
      if (!emotionStats[e.label]) {
        emotionStats[e.label] = { count: 0, maxPercent: 0, color: e.color, emoji: e.emoji };
      }
      emotionStats[e.label].count++;
      if (e.percent > emotionStats[e.label].maxPercent) {
        emotionStats[e.label].maxPercent = e.percent;
        emotionStats[e.label].peakTime = new Date(item.timestamp);
      }
    }
  }

  const sortedEmotions = Object.entries(emotionStats).sort((a, b) => b[1].count - a[1].count);
  const topEmotion = sortedEmotions[0];
  const topEmotionName = topEmotion[0];
  const topEmotionData = topEmotion[1];

  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  const peakDay = weekdays[topEmotionData.peakTime.getDay()];

  let anxietyPeak = null;
  if (emotionStats['焦虑']) {
    anxietyPeak = emotionStats['焦虑'];
  }

  let reportText = `本周共记录 <b style="color:var(--orange)">${thisWeek.length} 次</b>心境扫描 🌸<br><br>`;
  reportText += `主导情绪：<b style="color:${topEmotionData.color}">${topEmotionData.emoji} ${topEmotionName}</b>，出现 ${topEmotionData.count} 次，峰值 ${topEmotionData.maxPercent}%<br><br>`;
  
  if (anxietyPeak && topEmotionName !== '焦虑') {
    const anxietyDay = weekdays[anxietyPeak.peakTime.getDay()];
    reportText += `本周"焦虑"峰值出现在<b style="color:var(--red)">${anxietyDay}</b>（${anxietyPeak.maxPercent}%），那天是不是发生了什么？`;
  } else if (topEmotionName === '焦虑') {
    reportText += `本周"焦虑"峰值出现在<b style="color:var(--red)">${peakDay}</b>（${topEmotionData.maxPercent}%），也许和那天的某件事有关？`;
  } else {
    reportText += `本周情绪整体偏向<b style="color:${topEmotionData.color}">${topEmotionData.emoji} ${topEmotionName}</b>，峰值出现在<b>${peakDay}</b> 🌷`;
  }

  reportEl.innerHTML = `<div class="weekly-text">${reportText}</div>`;
  reportEl.classList.add('show');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderHistory();
