<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weight and Weather</title>
  <style>
    /* ==========================================================================
       1. 基础全局变量及重置
       ========================================================================== */
    :root, [data-theme="cyber"] {
      --bg-1: #070a17; /* 背景深蓝一 */
      --bg-2: #0f1630; /* 背景深蓝二 */
      --panel: rgba(13, 22, 44, 0.68); /* 面板毛玻璃背景 */
      --card-bg: rgba(13, 22, 44, 0.4); /* 内部卡片背景 */
      --card-hover: rgba(0, 229, 255, 0.08); /* 卡片悬浮背景 */
      --header-bg: linear-gradient(180deg, rgba(55, 213, 255, 0.12) 0%, rgba(13, 22, 44, 0) 100%); /* 表头背景 */
      --line: rgba(111, 177, 255, 0.26); /* 分割线颜色 */
      --text: #d8e9ff; /* 主文本颜色 */
      --header-text: #eaf4ff; /* 表头高亮文字 */
      --muted: #86a2cb; /* 弱化提示文字颜色 */
      --cyan: #37d5ff; /* 赛博青色（高亮） */
      --purple: #7f6bff; /* 赛博紫色（高亮） */
      --today: #00e5ff; /* “今天”标记颜色 */
      --selected: #7f6bff; /* 选中状态颜色 */
      --danger: #ff6f91; /* 危险/提示色 */
      --ai-title: rgba(127, 107, 255, 0.8);
      --ai-icon: rgba(127, 107, 255, 0.5);
      --bg-image: radial-gradient(circle at 15% 20%, rgba(55, 213, 255, 0.15), transparent 35%),
                  radial-gradient(circle at 85% 80%, rgba(127, 107, 255, 0.16), transparent 35%),
                  linear-gradient(140deg, var(--bg-1), var(--bg-2));
    }

    [data-theme="dark"] {
      --bg-1: #121212; 
      --bg-2: #1a1a1a; 
      --panel: rgba(30, 30, 30, 0.8); 
      --card-bg: rgba(40, 40, 40, 0.5);
      --card-hover: rgba(255, 255, 255, 0.05);
      --header-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(30, 30, 30, 0) 100%);
      --line: rgba(255, 255, 255, 0.15); 
      --text: #f0f0f0; 
      --header-text: #ffffff;
      --muted: rgba(255, 255, 255, 0.4); 
      --cyan: #66b2ff; 
      --purple: #a58ae1;
      --today: #ffffff;
      --selected: #66b2ff;
      --danger: #ff6f91;
      --ai-title: #a58ae1;
      --ai-icon: #a58ae1;
      --bg-image: linear-gradient(140deg, var(--bg-1), var(--bg-2));
    }

    [data-theme="light"] {
      --bg-1: #f5f7fa; 
      --bg-2: #ffffff; 
      --panel: rgba(255, 255, 255, 0.85); 
      --card-bg: rgba(240, 244, 248, 0.6);
      --card-hover: rgba(0, 0, 0, 0.04);
      --header-bg: linear-gradient(180deg, rgba(0, 136, 204, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
      --line: rgba(0, 0, 0, 0.1); 
      --text: #2c3e50; 
      --header-text: #1a252f;
      --muted: rgba(44, 62, 80, 0.6); 
      --cyan: #0088cc; 
      --purple: #6a4bcf;
      --today: #1a56db;
      --selected: #6a4bcf;
      --danger: #e74c3c;
      --ai-title: #6a4bcf;
      --ai-icon: rgba(106, 75, 207, 0.4);
      --bg-image: linear-gradient(140deg, var(--bg-1), var(--bg-2));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-image);
      color: var(--text);
      overflow-y: auto; /* 允许页面内容过长时垂直滚动 */
      overflow-x: hidden; /* 禁用水平滚动 */
      transition: background 0.3s, color 0.3s;
    }

    /* --------------------------------------------------------------------------
       自定义 Webkit 滚动条样式（未来科幻感）
       -------------------------------------------------------------------------- */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 19, 37, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(55, 213, 255, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(55, 213, 255, 0.5);
    }

    /* ==========================================================================
       2. 页面背景层装饰元素
       ========================================================================== */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none; /* 穿透鼠标事件，仅作视觉背景 */
      /* 多层径向渐变模拟远近大小不一的繁星 */
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255, 255, 255, 0.35), transparent 75%),
        radial-gradient(1.5px 1.5px at 30% 80%, rgba(255, 255, 255, 0.28), transparent 75%),
        radial-gradient(1.8px 1.8px at 65% 30%, rgba(255, 255, 255, 0.30), transparent 75%),
        radial-gradient(1.6px 1.6px at 84% 56%, rgba(255, 255, 255, 0.32), transparent 75%),
        radial-gradient(1.4px 1.4px at 92% 12%, rgba(255, 255, 255, 0.24), transparent 75%);
      opacity: 0.9;
    }

    /* ==========================================================================
       3. 页面主体应用面板区
       ========================================================================== */
    .app {
      position: relative;
      width: min(920px, 94vw); /* PC 端定宽，移动端自适应 */
      margin: 4vh auto;
      padding: 24px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px); /* 毛玻璃滤镜 */
      box-shadow:
        inset 0 0 40px rgba(55, 213, 255, 0.08),
        0 0 35px rgba(55, 213, 255, 0.12),
        0 0 55px rgba(127, 107, 255, 0.12);
      transition: background 0.3s, border-color 0.3s;
    }

    /* 应用面板的发光渐变内边框遮罩实现 */
    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(55, 213, 255, 0.55), rgba(127, 107, 255, 0.35));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* --------------------------------------------------------------------------
       3.0 主题切换器 (下拉菜单)
       -------------------------------------------------------------------------- */
    .theme-switcher {
      margin-left: auto;
      flex-shrink: 0;
      z-index: 1;
    }
    
    .theme-trigger {
      cursor: pointer;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 600;
      border-bottom: 2px dashed transparent;
      transition: 0.2s;
      text-shadow: 0 0 10px rgba(55, 213, 255, 0.35);
      padding: 2px 0;
      user-select: none;
      white-space: nowrap;
    }

    .theme-trigger:hover {
      border-bottom-color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan);
    }

    /* --------------------------------------------------------------------------
       3.1 顶部标题区
       -------------------------------------------------------------------------- */
    .top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .title-wrapper > div:last-child {
      min-width: 0;
    }

    .greeting {
      font-size: clamp(20px, 2.8vw, 28px); /* 动态大小：早中晚问候语 */
      letter-spacing: 1px;
      font-weight: 600;
      text-shadow: 0 0 14px rgba(55, 213, 255, 0.45);
      color: var(--cyan);
      border-right: 1px solid rgba(119, 184, 255, 0.2);
      padding-right: 16px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .title {
      font-size: clamp(16px, 2.2vw, 22px);
      letter-spacing: 1px;
      font-weight: 600;
      color: var(--header-text);
    }

    .sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
      max-width: 100%;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    /* --------------------------------------------------------------------------
       3.2 通用控制按钮区
       -------------------------------------------------------------------------- */
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    button:hover:not(:disabled) {
      border-color: var(--cyan);
      background: var(--card-hover);
      box-shadow: 0 0 15px rgba(55, 213, 255, 0.24);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    /* 禁用状态（针对“下一月”不可越界的限制） */
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(119, 184, 255, 0.1);
      box-shadow: none;
    }

    /* --------------------------------------------------------------------------
       3.3 操作栏（年月选择与切换按钮）
       -------------------------------------------------------------------------- */
    .month-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(119, 184, 255, 0.15);
      position: relative;
    }

    /* 底部极光分割线特效 */
    .month-line::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, var(--cyan), transparent);
      box-shadow: 0 0 10px var(--cyan);
    }

    .month-label-container {
      font-size: clamp(24px, 3.5vw, 36px);
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--header-text);
      text-shadow:
        0 0 8px rgba(55, 213, 255, 0.55),
        0 0 18px rgba(127, 107, 255, 0.45);
    }

    /* 可点击元素：年、月触发器 */
    .clickable {
      cursor: pointer;
      transition: 0.2s;
      border-bottom: 2px dashed transparent;
    }

    .clickable:hover {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
      text-shadow: 0 0 12px var(--cyan);
    }

    /* ==========================================================================
       4. 弹出层弹窗（选择年/月）
       ========================================================================== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(4, 8, 19, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none; /* 隐藏时禁止点击穿透 */
      transition: 0.3s;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      width: 320px;
      max-width: 90vw;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 0 40px rgba(127, 107, 255, 0.15), inset 0 0 20px rgba(55, 213, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* “回到今年” 快速定位按钮 */
    .current-year-btn {
      font-size: 12px;
      padding: 2px 8px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: var(--today);
      border-radius: 4px;
      background: rgba(0, 229, 255, 0.1);
      cursor: pointer;
      display: none; /* 默认隐藏，仅在年份选择模式下可见 */
    }

    .current-year-btn:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      text-shadow: 0 0 8px rgba(55, 213, 255, 0.5);
    }

    .icon-btn {
      padding: 4px 12px;
      background: transparent;
      border: 1px solid rgba(119, 184, 255, 0.3);
      color: var(--cyan);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    .icon-btn:hover {
      background: rgba(55, 213, 255, 0.1);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .modal-item {
      padding: 12px 0;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      font-size: 14px;
      transition: 0.2s;
    }

    .modal-item:hover, .modal-item.active {
      border-color: var(--cyan);
      background: var(--card-hover);
      box-shadow: 0 0 15px rgba(55, 213, 255, 0.2);
    }

    /* 未来月份/年份置灰且不可点击 */
    .modal-item.disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    .close-btn {
      width: 100%;
      padding: 10px;
      background: rgba(255, 111, 145, 0.15);
      border: 1px solid rgba(255, 111, 145, 0.4);
      color: #ff9eb4;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .close-btn:hover {
      background: rgba(255, 111, 145, 0.3);
      box-shadow: 0 0 15px rgba(255, 111, 145, 0.3);
    }

    /* ==========================================================================
       5. 页面统计数据与天气卡片区
       ========================================================================== */
    /* --------------------------------------------------------------------------
       5.1 天气与AI评价栏
       -------------------------------------------------------------------------- */
    .weather-board {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .weather-card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: 0.2s;
    }

    .weather-card:hover {
      background: var(--card-hover);
      border-color: var(--cyan);
      box-shadow: inset 0 0 20px rgba(55, 213, 255, 0.08);
    }

    .w-icon {
      font-size: 32px;
      filter: drop-shadow(0 0 8px rgba(55, 213, 255, 0.4));
    }

    .w-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1; /* 左侧内容占满剩余空间 */
    }

    .w-title {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .w-val {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .ai-text {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.4;
      color: var(--text);
    }

    /* 天气卡片右侧的数据强调展示区 */
    .w-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 60px;
    }

    .w-right-main {
      font-size: 18px;
      font-weight: 700;
      color: var(--cyan);
    }

    .w-right-sub {
      font-size: 11px;
      color: var(--muted);
    }

    .ai-card .w-right {
      font-size: 24px;
      color: var(--ai-icon);
      min-width: auto;
    }

    /* --------------------------------------------------------------------------
       5.2 数据指标栏（打卡天数等 - 总结区）
       -------------------------------------------------------------------------- */
    .stats {
      margin-top: 16px;
      padding-top: 16px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      border-top: 1px solid rgba(119, 184, 255, 0.12);
      position: relative;
    }

    /* 顶部青色发光光晕点缀，作为对日历网格的承接总结 */
    .stats::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 12px var(--cyan);
      opacity: 0.8;
    }

    .stat-card {
      border: 1px solid var(--line);
      background: var(--card-bg);
      border-radius: 10px;
      padding: 10px;
      min-height: 62px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
    }

    .stat-value {
      margin-top: 6px;
      font-size: 20px;
      font-weight: 650;
      color: var(--text);
      text-shadow: 0 0 12px rgba(55, 213, 255, 0.28);
    }

    .stat-unit {
      margin-left: 2px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }

    /* ==========================================================================
       6. 日历网格核心展示区
       ========================================================================== */
    .weekdays,
    .grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr)); /* 一周7天等分 */
      gap: 10px;
    }

    /* 星期表头容器 */
    .weekdays {
      margin-bottom: 12px;
      background: var(--header-bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 0;
      box-shadow: inset 0 10px 20px -10px rgba(55, 213, 255, 0.05);
    }

    .weekdays div {
      text-align: center;
      font-size: 13px;
      color: var(--header-text);
      font-weight: 600;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(55, 213, 255, 0.3);
    }

    /* 单个日期单元格卡片 */
    .day {
      min-height: 110px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card-bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 10px;
      cursor: pointer;
      transition: 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .day:hover {
      border-color: rgba(55, 213, 255, 0.5);
      box-shadow: inset 0 0 24px rgba(55, 213, 255, 0.12);
    }

    /* 跨月的非当前月日期淡化 */
    .day.other {
      opacity: 0.38;
    }

    /* 未来的日期置灰并不可点击 */
    .day.future {
      opacity: 0.25;
      cursor: not-allowed;
      background: transparent;
      border-color: rgba(119, 184, 255, 0.05);
    }

    .day.future:hover {
      border-color: rgba(119, 184, 255, 0.05);
      box-shadow: none;
    }

    /* 今天的日期发光强调 */
    .day.today {
      border-color: rgba(0, 229, 255, 0.88);
      box-shadow:
        0 0 18px rgba(0, 229, 255, 0.2),
        inset 0 0 24px rgba(0, 229, 255, 0.12);
    }

    .day.today::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      right: 4px;
      bottom: 4px;
      border-radius: 50%;
      background: var(--today);
      box-shadow: 0 0 6px var(--today);
    }

    /* 选中的日期卡片高亮紫光 */
    .day.selected {
      border-color: rgba(127, 107, 255, 0.9);
      box-shadow:
        0 0 20px rgba(127, 107, 255, 0.26),
        inset 0 0 25px rgba(127, 107, 255, 0.2);
      transform: translateY(-1px);
    }

    .date-no {
      font-size: 18px;
      font-weight: 600;
    }

    .day-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .weight-line {
      font-size: 12px;
      line-height: 1.25;
      color: var(--text);
    }

    /* Light 主题下提高文本锐度，减少霓虹阴影导致的发糊感 */
    [data-theme="light"] .title,
    [data-theme="light"] .month-label-container {
      color: var(--text);
      text-shadow: none;
    }

    [data-theme="light"] .weight-line {
      color: #1f3448;
      font-weight: 600;
    }

    [data-theme="light"] .clickable:hover {
      text-shadow: none;
    }

    .delta-line {
      font-size: 12px;
      line-height: 1.25;
      margin-top: 2px;
      color: var(--muted);
    }

    /* 体重增加为粉红色，降低为青绿色 */
    .delta-up {
      color: #ff9eb4;
    }

    .delta-down {
      color: #72f7ca;
    }

    /* 数据产生的青色小圆点标记（仅悬浮或选中时显示） */
    .event-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      opacity: 0;
      transition: 0.2s;
    }

    .day:hover .event-dot,
    .day.selected .event-dot {
      opacity: 1;
    }

    /* ==========================================================================
       7. 底部辅助信息区
       ========================================================================== */
    .info {
      margin-top: 16px;
      border-top: 1px solid rgba(119, 184, 255, 0.22);
      padding-top: 12px;
      color: var(--muted);
      min-height: 24px;
      font-size: 14px;
    }

    .info strong {
      color: var(--text);
      text-shadow: 0 0 12px rgba(55, 213, 255, 0.35);
    }

    .footer {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(143, 170, 208, 0.8);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ==========================================================================
       8. 移动端自适应 (Max Width: 720px)
       ========================================================================== */
    @media (max-width: 720px) {
      .app {
        margin: 2vh auto;
        padding: 12px;
        width: 96vw;
      }

      .top {
        margin-bottom: 8px;
        flex-wrap: nowrap;
        align-items: center;
      }

      .theme-switcher {
        margin-left: auto;
      }

      .theme-trigger {
        font-size: 12px;
      }

      .controls {
        gap: 6px;
      }

      button {
        padding: 4px 10px;
        font-size: 12px;
      }

      .greeting {
        font-size: 15px;
        padding-right: 6px;
        border-right: 1px solid rgba(119, 184, 255, 0.2);
        max-width: 13em;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .title {
        font-size: 14px;
      }

      .title-wrapper {
        gap: 8px;
        flex: 1;
        min-width: 0;
      }

      .title-wrapper > div:last-child {
        flex: 1;
        min-width: 0;
      }

      .sub {
        font-size: 10px;
        margin-top: 2px;
        white-space: normal;
        word-break: break-all;
      }

      .month-line {
        margin: 4px 0 8px;
      }

      .month-label-container {
        font-size: 20px;
      }

      /* 移动端天气与AI简评板块重新排版（变紧凑） */
      .weather-board {
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 8px;
      }

      .weather-card {
        padding: 8px;
        gap: 6px;
        flex-direction: column;
        align-items: flex-start;
      }

      .ai-card {
        grid-column: 1 / -1; /* 横跨两列占满全行 */
        flex-direction: row;
        align-items: center;
      }

      .w-icon {
        font-size: 20px;
        margin-bottom: -4px;
      }

      .ai-card .w-icon {
        font-size: 24px;
        margin-bottom: 0;
      }

      /* 移动端右侧数据展示为横向靠左以避免折行溢出 */
      .w-right {
        text-align: left;
        min-width: auto;
        flex-direction: row;
        align-items: baseline;
        justify-content: flex-start;
      }

      .ai-card .w-right {
        justify-content: center;
      }

      .w-title {
        font-size: 10px;
      }

      .w-val {
        font-size: 13px;
      }

      .w-right-main {
        font-size: 14px;
      }

      .weekdays {
        margin-bottom: 6px;
      }

      /* 压缩网格间距以适应小屏幕 */
      .weekdays,
      .grid {
        gap: 4px;
      }

      .day {
        min-height: 56px;
        padding: 4px;
        border-radius: 6px;
      }

      .day-top {
        margin-bottom: 2px;
      }

      .date-no {
        font-size: 14px;
      }

      .weight-line {
        font-size: 10px;
        line-height: 1.1;
      }

      .delta-line {
        font-size: 10px;
        line-height: 1.1;
        margin-top: 1px;
      }

      .stats {
        margin-top: 12px;
        padding-top: 12px;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
      }

      .stat-card {
        min-height: auto;
        padding: 6px 4px;
        text-align: center;
        border-radius: 6px;
      }

      .stat-label {
        font-size: 10px;
      }

      .stat-value {
        font-size: 14px;
        margin-top: 2px;
      }

      .stat-unit {
        font-size: 10px;
      }

      .info {
        margin-top: 8px;
        padding-top: 8px;
        font-size: 12px;
        min-height: 20px;
      }

      .footer {
        margin-top: 6px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- 背景星空层 -->
  <div class="stars"></div>

  <!-- 页面主体容器 -->
  <div class="app">
    <!-- 1. 顶部标题与问候区 -->
    <div class="top">
      <div class="title-wrapper">
        <div class="greeting" id="greetingLabel">宁宁 早上好！</div>
        <div>
          <div class="title">Quantum Calendar</div>
          <div class="sub">保持热爱，奔赴下一程星光。</div>
        </div>
      </div>
      <!-- 主题切换控件 -->
      <div class="theme-switcher">

    <!-- 2. 日历控制（年月选择与翻页按钮） -->

    <!-- 3. 天气与AI评价模块 -->

      <div class="weather-card">

      <!-- 3.3 AI 综合简评卡片 -->
      <div class="weather-card ai-card">
        <div class="w-icon" id="aiReviewIcon">🤖</div>
        <div class="w-info">
          <div class="w-title" style="color: var(--ai-title);">AI 综合简评</div>
          <div class="w-val ai-text" id="aiReviewText">分析中...</div>

        <div class="w-right">✧</div>

    <!-- 5. 日历网格区 -->
    <div class="weekdays">
      <div>周一</div>
      <div>周二</div>
      <div>周三</div>

      <div>周六</div>
      <div>周日</div>

    <div id="calendarGrid" class="grid"></div>

    <!-- 4. 当月体重打卡数据统计 -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">打卡天数</div>
        <div class="stat-value" id="checkinDays">0<span class="stat-unit">天</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">增重天数</div>
        <div class="stat-value" id="gainDays" style="color: #ff9eb4;">0<span class="stat-unit">天</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">减重天数</div>
        <div class="stat-value" id="lossDays" style="color: #72f7ca;">0<span class="stat-unit">天</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">本月变化</div>
        <div class="stat-value" id="monthChange">0.0<span class="stat-unit">kg</span></div>
      </div>

    <!-- 6. 底部选中提示与页脚 -->
    <div class="info" id="info">请选择一个日期。</div>
    <div class="footer">
      <span>Tip: 点击日期可查看详情，支持跨月显示完整周。</span>
    </div>
  </div>

  <!-- 7. 选择年份/月份的模态弹窗组件 -->
  <div class="modal" id="selectorModal">
    <div class="modal-panel">
      <div class="modal-top">
        <div class="modal-title-wrapper">
          <div class="modal-title" id="modalTitle">选择年份</div>
          <button class="current-year-btn" id="currentYearBtn">今年</button>
        </div>
        <div>
          <button class="icon-btn" id="modalPrev">&lt;</button>
          <button class="icon-btn" id="modalNext">&gt;</button>
        </div>
      </div>
      <div class="modal-grid" id="modalGrid"></div>
      <button class="close-btn" id="modalClose">关闭</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       核心 JavaScript 逻辑层
       包含：状态管理、假数据生成、天气获取、日历渲染、弹窗控制
       ========================================================================== */
    (function () {
      // --------------------------------------------------------------------------
      // 1. DOM 元素获取
      // --------------------------------------------------------------------------
      var yearLabel = document.getElementById("yearLabel");
      var monthLabelOnly = document.getElementById("monthLabelOnly");
      var grid = document.getElementById("calendarGrid");
      var info = document.getElementById("info");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var todayBtn = document.getElementById("todayBtn");
      var checkinDaysNode = document.getElementById("checkinDays");
      var gainDaysNode = document.getElementById("gainDays");
      var lossDaysNode = document.getElementById("lossDays");
      var monthChangeNode = document.getElementById("monthChange");

      var greetingLabel = document.getElementById("greetingLabel");

      var weightWeatherIcon = document.getElementById("weightWeatherIcon");
      var weightWeatherText = document.getElementById("weightWeatherText");
      var weightWeatherRight = document.getElementById("weightWeatherRight");

      var realWeatherIcon = document.getElementById("realWeatherIcon");
      var realWeatherText = document.getElementById("realWeatherText");
      var realWeatherRight = document.getElementById("realWeatherRight");

      var aiReviewIcon = document.getElementById("aiReviewIcon");
      var aiReviewText = document.getElementById("aiReviewText");

      // --------------------------------------------------------------------------
      // 2. 全局状态与基础函数
      // --------------------------------------------------------------------------
      var now = new Date();
      var viewYear = now.getFullYear();
      var viewMonth = now.getMonth();
      var selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var weightCache = {};
      var userNickname = "宁宁";

      // 补零工具函数 (如：9 -> "09")
      function pad(n) {
        return n < 10 ? "0" + n : String(n);
      }

      function formatDateCN(d) {
        return d.getFullYear() + "年" + pad(d.getMonth() + 1) + "月" + pad(d.getDate()) + "日";
      }

      function dateKey(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
      }

      // 获取某个日期的前一天
      function addDays(d, n) {
        return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
      }

      // --------------------------------------------------------------------------
      // 3. 假数据生成与计算逻辑（体重与变化量）
      // --------------------------------------------------------------------------
      // 根据日期生成一个伪随机但固定的体重值
      function getWeight(d) {
        var key = dateKey(d);
        if (Object.prototype.hasOwnProperty.call(weightCache, key)) {
          return weightCache[key];
        }

        var seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
        var noise = ((seed * 9301 + 49297) % 233280) / 233280;
        var trend = Math.sin((d.getDate() + d.getMonth() * 3) / 4.2) * 0.55;
        var base = 63.2;
        var weight = base + trend + (noise - 0.5) * 0.8;
        var rounded = Number(weight.toFixed(1));
        weightCache[key] = rounded;
        return rounded;
      }

      // 计算当天体重相比前一天的变化量（差值）
      function getDelta(d) {
        var current = getWeight(d);
        var prev = getWeight(addDays(d, -1));
        return Number((current - prev).toFixed(1));
      }

      // 格式化变化量，增加上下箭头前缀
      function formatDelta(delta) {
        if (delta > 0) {
          return "↑ " + delta.toFixed(1) + "";
        }
        if (delta < 0) {
          return "↓ " + Math.abs(delta).toFixed(1) + "";
        }
        return "0.0";
      }

      // --------------------------------------------------------------------------
      // 4. 天气与 AI 评价业务逻辑
      // --------------------------------------------------------------------------
      // 真实天气的本地缓存字典
      var weatherCache = {};

      // 解析 API 返回的 WMO 天气代码，转化为表情、文字与类型标识
      function parseWeatherCode(code) {
        if (code === 0) return { icon: "☀️", text: "晴朗", type: "sunny" };
        if (code === 1 || code === 2 || code === 3) return { icon: "⛅", text: "多云", type: "cloudy" };
        if (code >= 45 && code <= 48) return { icon: "🌫️", text: "雾天", type: "fog" };
        if (code >= 51 && code <= 57) return { icon: "🌧️", text: "毛毛雨", type: "rain" };
        if (code >= 61 && code <= 67) return { icon: "🌧️", text: "雨天", type: "rain" };
        if (code >= 71 && code <= 77) return { icon: "❄️", text: "雪天", type: "snow" };
        if (code >= 80 && code <= 82) return { icon: "🌧️", text: "阵雨", type: "rain" };
        if (code >= 95 && code <= 99) return { icon: "⛈️", text: "雷暴", type: "storm" };
        return { icon: "🌍", text: "未知", type: "unknown" };
      }

      // 请求 Open-Meteo 历史/预测 API 获取指定日期的真实天气
      async function fetchRealWeather(dateStr, delta) {
        // 如果在当前会话已经查询过，则直接返回缓存结果
        if (weatherCache[dateStr]) {
          var weatherData = weatherCache[dateStr];
          realWeatherIcon.textContent = weatherData.parsed.icon;
          realWeatherText.textContent = weatherData.parsed.text;
          realWeatherRight.innerHTML = "<div class='w-right-main'>" + weatherData.temp + "°C</div><div class='w-right-sub'>最高风速 " + weatherData.wind + "</div>";
          aiReviewText.textContent = generateAIReview(delta, weatherData);
          if (delta < 0) aiReviewIcon.textContent = "🌟";
          else if (delta > 0) aiReviewIcon.textContent = "⚖️";
          else aiReviewIcon.textContent = "🍵";
          return;
        }

        realWeatherIcon.textContent = "⌛";
        realWeatherText.textContent = "加载中...";
        realWeatherRight.innerHTML = "<div class='w-right-main'>--</div><div class='w-right-sub'>获取中</div>";
        aiReviewIcon.textContent = "🤖";
        aiReviewText.textContent = "正在思考中...";

        // 边界判断：未来最多 16 天，历史最早支持到 1940-01-01
        var dateObj = new Date(dateStr);
        var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var minHistoryDate = new Date(1940, 0, 1);
        var diffDays = Math.floor((dateObj.getTime() - todayStart.getTime()) / (1000 * 3600 * 24));

        if (diffDays > 16) {
          realWeatherIcon.textContent = "🔮";
          realWeatherText.textContent = "未知时空";
          realWeatherRight.innerHTML = "<div class='w-right-main'>--</div><div class='w-right-sub'>未来太远</div>";
          aiReviewText.textContent = "这么遥远的未来，连AI也无法预知你的体重和天气，随遇而安吧！";
          return;
        } else if (dateObj.getTime() < minHistoryDate.getTime()) {
          realWeatherIcon.textContent = "📜";
          realWeatherText.textContent = "数据尘封";
          realWeatherRight.innerHTML = "<div class='w-right-main'>--</div><div class='w-right-sub'>历史太久</div>";
          aiReviewText.textContent = "过去的历史已经模糊，但现在的努力清晰可见，专注当下！";
          return;
        }

        try {
          // 规则：>= 今天用 forecast；< 今天用 archive
          var isTodayOrFuture = dateObj.getTime() >= todayStart.getTime();
          var baseUrl = isTodayOrFuture
            ? "https://api.open-meteo.com/v1/forecast"
            : "https://archive-api.open-meteo.com/v1/archive";
          var url =
            baseUrl + "?latitude=31.11&longitude=121.38" +
            "&daily=weather_code,temperature_2m_max,wind_speed_10m_max" +
            "&timezone=Asia%2FShanghai" +
            "&start_date=" + dateStr + "&end_date=" + dateStr;

          var res = await fetch(url);
          var data = await res.json();

          if (data.daily && data.daily.weather_code && data.daily.weather_code.length > 0) {
            var code = data.daily.weather_code[0];
            var temp = data.daily.temperature_2m_max[0];
            var wind = data.daily.wind_speed_10m_max[0];
            
            var result = {
              code: code,
              temp: temp,
              wind: wind,
              parsed: parseWeatherCode(code)
            };
            weatherCache[dateStr] = result;
            
            realWeatherIcon.textContent = result.parsed.icon;
            realWeatherText.textContent = result.parsed.text;
            realWeatherRight.innerHTML = "<div class='w-right-main'>" + result.temp + "°C</div><div class='w-right-sub'>最高风速 " + result.wind + "</div>";
            aiReviewText.textContent = generateAIReview(delta, result);
            if (delta < 0) aiReviewIcon.textContent = "🌟";
            else if (delta > 0) aiReviewIcon.textContent = "⚖️";
            else aiReviewIcon.textContent = "🍵";
          } else {
            realWeatherIcon.textContent = "🤷";
            realWeatherText.textContent = "暂无数据";
            realWeatherRight.innerHTML = "<div class='w-right-main'>--</div><div class='w-right-sub'>记录缺失</div>";
            aiReviewText.textContent = "今天的天气系统似乎摸鱼去了，不过你的体重变化记录得很清楚！";
          }
        } catch (e) {
          console.error("Fetch weather error", e);
          realWeatherIcon.textContent = "❌";
          realWeatherText.textContent = "请求失败";
          realWeatherRight.innerHTML = "<div class='w-right-main'>--</div><div class='w-right-sub'>网络异常</div>";
          aiReviewText.textContent = "虽然没获取到天气，但你的努力已被记录。";
        }
      }

      // 综合当天的体重变化和真实天气，由“AI”生成一段简单的趣味点评
      function generateAIReview(delta, weatherObj) {
        var wType = weatherObj && weatherObj.parsed ? weatherObj.parsed.type : "unknown";
        var isUp = delta > 0;
        var isDown = delta < 0;
        var isFlat = delta === 0;

        if (wType === "sunny") {
          if (isDown) return "掉秤如神助，加之天气晴好，今日宜出门散发魅力！";
          if (isUp) return "阳光明媚，微涨的体重可能是刚喝了水，不妨出门走走。";
          return "阳光正好，体重稳如泰山，保持当前好状态！";
        }
        if (wType === "rain" || wType === "storm") {
          if (isUp) return "下雨天果然容易囤积水分，体重微涨，明后天再战。";
          if (isDown) return "风雨交加也挡不住你掉秤的步伐，太棒了！";
          return "阴雨连绵，窝在家里也能保持体重平稳，很不错。";
        }
        if (wType === "snow") {
          if (isUp) return "下雪天需要热量御寒，微涨属于身体的自我保护。";
          if (isDown) return "雪天掉秤，脂肪在寒冷中燃烧得更猛烈了！";
          return "雪花飘飘，体重静悄悄，一杯热茶刚刚好。";
        }
        
        // 默认或其他天气类型
        if (isDown) return "体重稳步下降中，看来最近的饮食控制很有效！";
        if (isUp) return "偶尔的反弹是身体在蓄力，别灰心，继续加油。";
        return "平稳是福，保持现在的节奏，时间会给你答案。";
      }

      // 更新体重天气卡片
      function updateWeightWeather(delta) {
        var icon = "";
        var text = "";
        var color = "";
        if (delta <= -0.5) {
          icon = "☀️"; text = "晴空万里"; color = "#72f7ca"; // 大幅下降，非常好
        } else if (delta < 0 && delta > -0.5) {
          icon = "⛅"; text = "多云转晴"; color = "#a6fcd8"; // 小幅下降，好
        } else if (delta === 0) {
          icon = "☁️"; text = "阴天持平"; color = "var(--muted)"; // 持平
        } else if (delta > 0 && delta <= 0.5) {
          icon = "🌧️"; text = "小雨淅沥"; color = "#ffb6c1"; // 小幅上升，差
        } else {
          icon = "⛈️"; text = "狂风暴雨"; color = "#ff6f91"; // 大幅上升，极差
        }
        weightWeatherIcon.textContent = icon;
        weightWeatherText.textContent = text;
        weightWeatherText.style.color = color;
        
        var trend = delta > 0 ? "上升" : delta < 0 ? "下降" : "持平";
        var valText = delta === 0 ? "0.0kg" : Math.abs(delta).toFixed(1) + "kg";
        
        weightWeatherRight.innerHTML = 
          "<div class='w-right-main'>" + valText + "</div>" +
          "<div class='w-right-sub'>" + trend + "</div>";
      }

      // 更新选中日期的底部详细信息栏（包括体重变化提示和天气看板刷新）
      function updateSelectedInfo() {
        var weight = getWeight(selectedDate);
        var delta = getDelta(selectedDate);
        var trendText = delta > 0 ? "上升 " : delta < 0 ? "下降 " : "持平 ";
        
        // 1. 更新底部单行文字详情
        info.innerHTML =
          "<strong>已选择：</strong>" +
          formatDateCN(selectedDate) +
          "，体重 <span style='color:#37d5ff'>" +
          weight.toFixed(1) +
          "kg</span>，较前日" +
          trendText +
          Math.abs(delta).toFixed(1) +
          "kg";

        // 2. 更新上方第一个卡片：基于体重变化的虚拟“体重天气”
        updateWeightWeather(delta);
        
        // 3. 更新上方第二个卡片：请求真实天气 API
        fetchRealWeather(selectedDate, delta);
      }

      function getMonthRecordEndDate() {
        var monthEnd = new Date(viewYear, viewMonth + 1, 0);
        var todayMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        var viewedMonthStart = new Date(viewYear, viewMonth, 1);

        if (viewedMonthStart.getTime() > todayMonthStart.getTime()) {
          return null;
        }
        if (viewYear === now.getFullYear() && viewMonth === now.getMonth()) {
          return new Date(now.getFullYear(), now.getMonth(), now.getDate());
        }
        return monthEnd;
      }

      function updateMonthStats() {
        var start = new Date(viewYear, viewMonth, 1);
        var end = getMonthRecordEndDate();

        if (!end) {
          checkinDaysNode.innerHTML = "0<span class='stat-unit'>天</span>";
          gainDaysNode.innerHTML = "0<span class='stat-unit'>天</span>";
          lossDaysNode.innerHTML = "0<span class='stat-unit'>天</span>";
          monthChangeNode.innerHTML = "0.0<span class='stat-unit'>kg</span>";
          return;
        }

        var checkinDays = 0;
        var gainDays = 0;
        var lossDays = 0;
        var firstWeight = null;
        var lastWeight = null;

        for (var d = 1; ; d++) {
          var current = new Date(viewYear, viewMonth, d);
          if (current.getMonth() !== viewMonth || current.getTime() > end.getTime()) {
            break;
          }
          checkinDays += 1;
          var currentWeight = getWeight(current);
          if (firstWeight === null) {
            firstWeight = currentWeight;
          }
          lastWeight = currentWeight;
          var delta = getDelta(current);
          if (delta > 0) {
            gainDays += 1;
          } else if (delta < 0) {
            lossDays += 1;
          }
        }

        var monthChange = firstWeight === null || lastWeight === null ? 0 : Number((lastWeight - firstWeight).toFixed(1));
        var monthText = monthChange > 0 ? "+" + monthChange.toFixed(1) : monthChange.toFixed(1);

        checkinDaysNode.innerHTML = checkinDays + "<span class='stat-unit'>天</span>";
        gainDaysNode.innerHTML = gainDays + "<span class='stat-unit'>天</span>";
        lossDaysNode.innerHTML = lossDays + "<span class='stat-unit'>天</span>";
        monthChangeNode.innerHTML = monthText + "<span class='stat-unit'>kg</span>";
      }

      // --------------------------------------------------------------------------
      // 4. 天气与 AI 评价业务逻辑
      // --------------------------------------------------------------------------
      var realWeatherCache = {};

      function getWmoIconAndDesc(code) {
        var iconText = "☁️";
        var desc = "未知";
        if (code === 0) { iconText = "☀️"; desc = "晴朗"; }
        else if (code === 1 || code === 2 || code === 3) { iconText = "⛅"; desc = "多云"; }
        else if (code === 45 || code === 48) { iconText = "🌫️"; desc = "雾"; }
        else if (code >= 51 && code <= 55) { iconText = "🌧️"; desc = "毛毛雨"; }
        else if (code >= 61 && code <= 65) { iconText = "🌧️"; desc = "雨"; }
        else if (code >= 71 && code <= 75) { iconText = "❄️"; desc = "雪"; }
        else if (code >= 80 && code <= 82) { iconText = "🌧️"; desc = "阵雨"; }
        else if (code >= 95 && code <= 99) { iconText = "⛈️"; desc = "雷暴"; }
        return { iconText: iconText, desc: desc };
      }

      function renderRealWeatherUI(icon, text, rightHtml) {
        realWeatherIcon.textContent = icon;
        realWeatherText.textContent = text;
        realWeatherRight.innerHTML = rightHtml;
      }

      // 根据体重变化与天气状态生成 AI 简评
      function generateAIReview(delta, realWeatherCode) {
        var review = "";
        var aiIcon = "🤖";
        
        var isGoodWeather = (realWeatherCode === 0 || realWeatherCode === 1 || realWeatherCode === 2 || realWeatherCode === 3);
        var isBadWeather = (realWeatherCode >= 61 && realWeatherCode <= 99);

        if (delta <= -0.5) {
          aiIcon = "🌟";
          if (isGoodWeather) review = "掉秤如神助，加之天气晴好，今日宜出门散发魅力！";
          else if (isBadWeather) review = "外面狂风骤雨，你却在悄悄瘦成一道闪电，牛！";
          else review = "体重断崖下跌！这状态，什么天气都挡不住你的光芒。";
        } else if (delta < 0 && delta > -0.5) {
          aiIcon = "✨";
          if (isGoodWeather) review = "微风不燥，体重微降，继续保持这绝佳的节奏。";
          else if (isBadWeather) review = "天气虽差，但掉秤的快乐足以点亮一整天。";
          else review = "稳步减重中，平淡的日子里也有稳稳的幸福。";
        } else if (delta === 0) {
          aiIcon = "⚖️";
          if (isGoodWeather) review = "体重稳如泰山。天气这么好，出去跑两圈打破僵局吧！";
          else if (isBadWeather) review = "天气不好，体重也没变，是个宜居家躺平的休整日。";
          else review = "不增不减，薛定谔的肉肉。今日保持即可。";
        } else if (delta > 0 && delta <= 0.5) {
          aiIcon = "😅";
          if (isGoodWeather) review = "微涨了一点，可能是天气太好让你多吃了一口？问题不大。";
          else if (isBadWeather) review = "下雨天果然容易囤积水分，体重微涨，明后天再战。";
          else review = "正常波动，喝杯黑咖啡消消肿，明天又是一条好汉。";
        } else {
          aiIcon = "😱";
          if (isGoodWeather) review = "天气大好，体重却暴涨？一定是肌肉量增加了（确信）。";
          else if (isBadWeather) review = "天气恶劣，体重狂飙，今天的你吸收了太多天地精华...";
          else review = "涨幅惊人！快回顾下昨天是不是背着大家吃了满汉全席。";
        }

        aiReviewIcon.textContent = aiIcon;
        aiReviewText.textContent = review;
      }

      // 获取 Open-Meteo 天气数据
      function fetchRealWeather(date, delta) {
        var today = new Date();
        var todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        var minHistoryDate = new Date(1940, 0, 1);
        var selectedDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        var diffDays = Math.floor((selectedDate.getTime() - todayStart.getTime()) / (1000 * 60 * 60 * 24));
        var dStr = dateKey(date);

        // 使用缓存
        if (realWeatherCache[dStr]) {
          var cache = realWeatherCache[dStr];
          renderRealWeatherUI(cache.icon, cache.text, cache.rightHtml);
          generateAIReview(delta, cache.code);
          return;
        }

        var loadingHtml = "<div class='w-right-sub'>API Data</div>";
        renderRealWeatherUI("⌛", "加载中...", loadingHtml);
        aiReviewIcon.textContent = "🤖";
        aiReviewText.textContent = "分析中...";

        if (diffDays > 16) {
          renderRealWeatherUI("🔮", "未知时空", loadingHtml);
          generateAIReview(delta, -1);
          return;
        }
        if (selectedDate.getTime() < minHistoryDate.getTime()) {
          renderRealWeatherUI("📜", "数据尘封", loadingHtml);
          generateAIReview(delta, -1);
          return;
        }

        var isTodayOrFuture = selectedDate.getTime() >= todayStart.getTime();
        var baseUrl = isTodayOrFuture
          ? "https://api.open-meteo.com/v1/forecast"
          : "https://archive-api.open-meteo.com/v1/archive";
        var url = baseUrl + "?latitude=31.11&longitude=121.38&daily=weather_code,weathercode,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,windspeed_10m_max&timezone=Asia%2FShanghai&start_date=" + dStr + "&end_date=" + dStr;
        
        fetch(url)
          .then(function(res) { return res.json(); })
          .then(function(data) {
            var daily = data && data.daily ? data.daily : null;
            var weatherCodes = daily ? (daily.weather_code || daily.weathercode) : null;
            var windValues = daily ? (daily.wind_speed_10m_max || daily.windspeed_10m_max) : null;
            if (daily && weatherCodes && weatherCodes.length > 0) {
              var weatherCode = weatherCodes[0];
              var tempMax = data.daily.temperature_2m_max[0];
              var tempMin = data.daily.temperature_2m_min[0];
              var wind = windValues && windValues.length > 0 ? windValues[0] : "-";
              
              var wmoInfo = getWmoIconAndDesc(weatherCode);
              var icon = wmoInfo.iconText;
              var text = wmoInfo.desc;
              var rightHtml = 
                "<div class='w-right-main' style='color:var(--text);'>" + tempMax + "°C</div>" +
                "<div class='w-right-sub'>最高风速 " + wind + "km/h</div>";

              realWeatherCache[dStr] = { icon: icon, text: text, rightHtml: rightHtml, code: weatherCode };
              renderRealWeatherUI(icon, text, rightHtml);
              generateAIReview(delta, weatherCode);
            } else {
              renderRealWeatherUI("🤷", "暂无数据", loadingHtml);
              generateAIReview(delta, -1);
            }
          })
          .catch(function(err) {
            console.error("天气获取失败", err);
            renderRealWeatherUI("❌", "获取失败", loadingHtml);
            generateAIReview(delta, -1);
          });
      }

      // --------------------------------------------------------------------------
      // 5. 日历核心逻辑：数据统计与网格渲染
      // --------------------------------------------------------------------------
      // 获取当前可视月份的最后一天有效记录日期（用于当月统计）
      function getMonthRecordEndDate() {
        var monthEnd = new Date(viewYear, viewMonth + 1, 0);
        var todayMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        var viewedMonthStart = new Date(viewYear, viewMonth, 1);

        if (viewedMonthStart.getTime() > todayMonthStart.getTime()) {
          return null; // 未来的月份
        }
        if (viewYear === now.getFullYear() && viewMonth === now.getMonth()) {
          return new Date(now.getFullYear(), now.getMonth(), now.getDate()); // 当月，截止到今天
        }
        return monthEnd; // 过去的月份，截止到月末
      }

      // --------------------------------------------------------------------------
      // 6. 日历导航与交互事件绑定
      // --------------------------------------------------------------------------
      function updateGreeting() {
        var t = new Date();
        var h = t.getHours();
        var displayName = (userNickname || "宁宁").slice(0, 5);
        var timeSlot = "好";
        if (h >= 5 && h < 11) {
          timeSlot = "早上好";
        } else if (h >= 11 && h < 14) {
          timeSlot = "中午好";
        } else if (h >= 14 && h < 18) {
          timeSlot = "下午好";
        } else if (h >= 18 || h < 5) {
          timeSlot = "晚上好";
        }
        greetingLabel.textContent = displayName + " " + timeSlot + "！";
      }

      // 判断两个日期对象是否是同一天
      function isSameDate(a, b) {
        return (
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate()
        );
      }

      // 核心渲染函数：重新生成日历网格及月份标签
      function renderCalendar() {
        yearLabel.firstElementChild.textContent = viewYear;
        monthLabelOnly.firstElementChild.textContent = pad(viewMonth + 1);
        grid.innerHTML = "";

        // 计算网格中第一天（可能跨到上个月）
        var firstDay = new Date(viewYear, viewMonth, 1);
        var firstWeekday = firstDay.getDay(); // 0(周日)-6(周六)
        var mondayBased = firstWeekday === 0 ? 6 : firstWeekday - 1; // 转换为周一为起始

        var gridStart = new Date(viewYear, viewMonth, 1 - mondayBased);

        var todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        // 判断当前浏览的年月是否已经达到或超过真实年月，处理“下月”按钮禁用状态
        if (viewYear > now.getFullYear() || (viewYear === now.getFullYear() && viewMonth >= now.getMonth())) {
          nextBtn.disabled = true;
        } else {
          nextBtn.disabled = false;
        }

        // 渲染 6 行 7 列共 42 个格子
        for (var i = 0; i < 42; i++) {
          var day = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
          var isFuture = day.getTime() > todayZero.getTime();

          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "day";
          btn.dataset.year = String(day.getFullYear());
          btn.dataset.month = String(day.getMonth());
          btn.dataset.date = String(day.getDate());

          // 跨月样式
          if (day.getMonth() !== viewMonth) {
            btn.classList.add("other");
          }

          // 未来样式
          if (isFuture) {
            btn.classList.add("future");
          }

          // 标记今天
          if (isSameDate(day, now)) {
            btn.classList.add("today");
          }

          // 标记被选中的日期
          if (isSameDate(day, selectedDate) && !isFuture) {
            btn.classList.add("selected");
          }

          // 日期数字
          var dateNo = document.createElement("span");
          dateNo.className = "date-no";
          dateNo.textContent = String(day.getDate());

          var top = document.createElement("div");
          top.className = "day-top";
          top.appendChild(dateNo);

          // 仅对过去和今天的日期渲染打卡数据
          if (!isFuture) {
            var dot = document.createElement("span");
            dot.className = "event-dot";
            top.appendChild(dot);

            var weightLine = document.createElement("div");
            weightLine.className = "weight-line";
            weightLine.textContent = "" + getWeight(day).toFixed(1) + "";

            var delta = getDelta(day);
            var deltaLine = document.createElement("div");
            deltaLine.className = "delta-line";
            if (delta > 0) {
              deltaLine.classList.add("delta-up");
            } else if (delta < 0) {
              deltaLine.classList.add("delta-down");
            }
            deltaLine.textContent = "" + formatDelta(delta);

            btn.appendChild(top);
            btn.appendChild(weightLine);
            btn.appendChild(deltaLine);
          } else {
            // 未来日期仅添加顶部日期编号
            btn.appendChild(top);
          }
          
          grid.appendChild(btn);
        }

        updateSelectedInfo();
        updateMonthStats();
      }

      // 点击单个日历格子时的交互处理
      function selectFromButton(target) {
        if (target.classList.contains("future")) {
          return; // 未来日期不可点击
        }

        var y = Number(target.dataset.year);
        var m = Number(target.dataset.month);
        var d = Number(target.dataset.date);
        selectedDate = new Date(y, m, d);

        // 如果点击的是跨月日期，则直接切换整个视图
        if (m !== viewMonth || y !== viewYear) {
          viewYear = y;
          viewMonth = m;
          renderCalendar();
          return;
        }

        // 本月内的切换：只更新选中样式和底部详情
        var dayNodes = grid.querySelectorAll(".day");
        dayNodes.forEach(function (node) {
          node.classList.remove("selected");
        });
        target.classList.add("selected");
        updateSelectedInfo();
      }

      // 使用事件委托绑定日历格子的点击
      grid.addEventListener("click", function (e) {
        var target = e.target;
        while (target && target !== grid && !target.classList.contains("day")) {
          target = target.parentElement;
        }
        if (!target || target === grid) {
          return;
        }
        selectFromButton(target);
      });

      // 翻到上个月
      prevBtn.addEventListener("click", function () {
        if (viewMonth === 0) {
          viewMonth = 11;
          viewYear -= 1;
        } else {
          viewMonth -= 1;
        }
        renderCalendar();
      });

      // 翻到下个月
      nextBtn.addEventListener("click", function () {
        var currentYear = now.getFullYear();
        var currentMonth = now.getMonth();
        
        // 如果当前查看的年月已经 >= 真实时间的年月，则不允许继续向后翻
        if (viewYear > currentYear || (viewYear === currentYear && viewMonth >= currentMonth)) {
          return;
        }

        if (viewMonth === 11) {
          viewMonth = 0;
          viewYear += 1;
        } else {
          viewMonth += 1;
        }
        renderCalendar();
      });

      // 回到今天
      todayBtn.addEventListener("click", function () {
        now = new Date();
        viewYear = now.getFullYear();
        viewMonth = now.getMonth();
        selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        renderCalendar();
      });

      // --------------------------------------------------------------------------
      // 7. 弹出层组件逻辑（选择年/月）
      // --------------------------------------------------------------------------
      var modal = document.getElementById("selectorModal");
      var modalTitle = document.getElementById("modalTitle");
      var modalGrid = document.getElementById("modalGrid");
      var modalPrev = document.getElementById("modalPrev");
      var modalNext = document.getElementById("modalNext");
      var modalClose = document.getElementById("modalClose");
      var currentYearBtn = document.getElementById("currentYearBtn");
      var themeTrigger = document.getElementById("themeTrigger");

      var modalType = '';
      var modalYearPage = viewYear;
      var minSelectableYear = 1940;
      var themeMap = {
        cyber: "Cyber",
        dark: "Dark",
        light: "Light"
      };
      var currentTheme = localStorage.getItem("app-theme") || "cyber";

      function refreshThemeTriggerText() {
        var label = themeMap[currentTheme] || "Cyber";
        themeTrigger.textContent = "" + label;
      }

      // 打开弹窗并根据类型（年/月）初始化界面
      function openModal(type) {
        modalType = type;
        modal.classList.add("show");
        if (type === 'year') {
          modalYearPage = viewYear;
          modalPrev.style.visibility = 'visible';
          modalNext.style.visibility = 'visible';
          currentYearBtn.style.display = 'block';
          renderModalYears();
        } else if (type === 'month') {
          modalPrev.style.visibility = 'hidden';
          modalNext.style.visibility = 'hidden';
          currentYearBtn.style.display = 'none';
          renderModalMonths();
        } else {
          modalPrev.style.visibility = 'hidden';
          modalNext.style.visibility = 'hidden';
          currentYearBtn.style.display = 'none';
          renderModalThemes();
        }
      }

      function closeModal() {
        modal.classList.remove("show");
      }

      // 渲染年份选择列表（支持左右翻页，并且不可越过今年）
      function renderModalYears() {
        modalTitle.textContent = "选择年份";
        modalGrid.innerHTML = "";
        var startYear = Math.floor(modalYearPage / 12) * 12;
        var currentYear = now.getFullYear();

        for (var i = 0; i < 12; i++) {
          var y = startYear + i;
          var btn = document.createElement("div");
          btn.className = "modal-item";
          
          if (y === viewYear) btn.classList.add("active");
          if (y < minSelectableYear) btn.classList.add("disabled"); // 1940 年以前不可选
          if (y > currentYear) btn.classList.add("disabled"); // 未来的年份不可选

          btn.textContent = y;
          btn.dataset.val = y;
          btn.onclick = function() {
            if (this.classList.contains("disabled")) return;
            viewYear = parseInt(this.dataset.val);
            // 如果新选年份刚好等于真实时间年份，且目前viewMonth已超过真实月份，则修正月份到当月
            if (viewYear === currentYear && viewMonth > now.getMonth()) {
              viewMonth = now.getMonth();
            }
            renderCalendar();
            closeModal();
          };
          modalGrid.appendChild(btn);
        }
      }

      // 渲染月份选择列表（1~12月，若在当前年，则未来月份不可选）
      function renderModalMonths() {
        modalTitle.textContent = viewYear + "年";
        modalGrid.innerHTML = "";
        var currentYear = now.getFullYear();
        var currentMonth = now.getMonth();

        for (var i = 0; i < 12; i++) {
          var btn = document.createElement("div");
          btn.className = "modal-item";
          
          if (i === viewMonth) btn.classList.add("active");
          // 在当前年份下，未来的月份置灰不可点
          if (viewYear === currentYear && i > currentMonth) {
            btn.classList.add("disabled");
          }

          btn.textContent = (i + 1) + "月";
          btn.dataset.val = i;
          btn.onclick = function() {
            viewMonth = parseInt(this.dataset.val);
            renderCalendar();
            closeModal();
          };
          modalGrid.appendChild(btn);
        }
      }

      // 渲染主题选择列表（复用年/月弹窗样式）
      function renderModalThemes() {
        modalTitle.textContent = "切换主题";
        modalGrid.innerHTML = "";
        var themes = ["cyber", "dark", "light"];
        for (var i = 0; i < themes.length; i++) {
          var key = themes[i];
          var btn = document.createElement("div");
          btn.className = "modal-item";
          if (key === currentTheme) btn.classList.add("active");
          btn.textContent = themeMap[key];
          btn.dataset.val = key;
          btn.onclick = function() {
            currentTheme = this.dataset.val;
            document.documentElement.setAttribute("data-theme", currentTheme);
            localStorage.setItem("app-theme", currentTheme);
            refreshThemeTriggerText();
            closeModal();
          };
          modalGrid.appendChild(btn);
        }
      }

      // --------------------------------------------------------------------------
      // 8. 弹窗事件绑定与初始化入口
      // --------------------------------------------------------------------------
      // 弹窗中：向左翻 12 年
      modalPrev.onclick = function() {
        if (modalType === 'year') {
          var minPageStart = Math.floor(minSelectableYear / 12) * 12;
          var nextPage = modalYearPage - 12;
          if (nextPage < minPageStart) {
            modalYearPage = minPageStart;
          } else {
            modalYearPage = nextPage;
          }
          renderModalYears();
        }
      };

      // 弹窗中：向右翻 12 年
      modalNext.onclick = function() {
        if (modalType === 'year') {
          modalYearPage += 12;
          renderModalYears();
        }
      };

      // 弹窗中：点击“今年”直接定位到当前年份页
      currentYearBtn.onclick = function() {
        modalYearPage = now.getFullYear();
        renderModalYears();
      };

      modalClose.onclick = closeModal;
      
      // 标题栏点击年月呼出对应弹窗
      yearLabel.onclick = function() { openModal('year'); };
      monthLabelOnly.onclick = function() { openModal('month'); };
      themeTrigger.onclick = function() { openModal('theme'); };

      // 初始化：时间问候与首次日历渲染
      updateGreeting();
      setInterval(updateGreeting, 60000); // 问候语不需要每秒刷新，每分钟检查一次即可
      renderCalendar();

      // --------------------------------------------------------------------------
      // 8. 主题切换逻辑
      // --------------------------------------------------------------------------
      document.documentElement.setAttribute("data-theme", currentTheme);
      refreshThemeTriggerText();

    })();
  </script>
</body>
</html>
