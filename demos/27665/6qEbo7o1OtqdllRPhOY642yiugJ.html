<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周报自动生成器 · 概念 Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-1: #f6f8fc;
    --bg-2: #e9eef7;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-2: #334155;
    --ink-3: #64748b;
    --ink-4: #94a3b8;
    --line: #e2e8f0;
    --line-soft: #f1f5f9;
    --primary: #3b82f6;
    --primary-2: #06b6d4;
    --primary-deep: #2563eb;
    --accent: #6366f1;
    --success: #10b981;
    --warn: #f59e0b;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 10px 30px -10px rgba(15, 23, 42, 0.18);
    --shadow-glow: 0 8px 24px -4px rgba(59, 130, 246, 0.45);
  }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(ellipse 70% 50% at 15% 0%, rgba(99, 102, 241, 0.10), transparent 50%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(6, 182, 212, 0.10), transparent 50%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    overflow: hidden;
  }

  /* ============ Topbar ============ */
  .topbar {
    height: 60px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(226, 232, 240, 0.6);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    box-shadow: var(--shadow-glow);
    color: #fff;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .brand-sub { font-size: 11px; color: var(--ink-3); letter-spacing: 0.06em; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px;
    border-radius: 20px;
    background: rgba(16, 185, 129, 0.1);
    color: var(--success);
    font-size: 11px; font-weight: 500; letter-spacing: 0.05em;
  }
  .badge-dot {
    width: 6px; height: 6px;
    background: var(--success);
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  /* ============ Layout ============ */
  .layout {
    display: grid;
    grid-template-columns: 4fr 6fr;
    gap: 20px;
    padding: 20px 28px;
    height: calc(100vh - 60px);
    min-height: 0;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .panel-header {
    padding: 18px 22px 14px;
    border-bottom: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 15px; font-weight: 600; letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title .icon { font-size: 16px; }
  .panel-meta { font-size: 12px; color: var(--ink-3); }
  .panel-body { flex: 1; overflow-y: auto; padding: 14px 22px 8px; min-height: 0; }
  .panel-footer {
    padding: 14px 22px 18px;
    border-top: 1px solid var(--line-soft);
    background: var(--card);
    flex-shrink: 0;
  }

  /* ============ Day Accordion ============ */
  .day-list { display: flex; flex-direction: column; gap: 10px; }
  .day-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .day-item:hover { border-color: #cbd5e1; }
  .day-item.open {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.10);
  }
  .day-header {
    width: 100%;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    background: transparent; border: none; cursor: pointer;
    font-family: inherit; font-size: 13.5px; color: var(--ink);
    text-align: left;
  }
  .day-emoji {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .day-item:nth-child(1) .day-emoji { background: linear-gradient(135deg, #ede9fe, #ddd6fe); }
  .day-item:nth-child(2) .day-emoji { background: linear-gradient(135deg, #fef3c7, #fde68a); }
  .day-item:nth-child(3) .day-emoji { background: linear-gradient(135deg, #d1fae5, #a7f3d0); }
  .day-item:nth-child(4) .day-emoji { background: linear-gradient(135deg, #dbeafe, #bfdbfe); }
  .day-item:nth-child(5) .day-emoji { background: linear-gradient(135deg, #fce7f3, #fbcfe8); }

  .day-name { font-weight: 600; }
  .day-date { color: var(--ink-3); font-size: 11.5px; }
  .day-status {
    margin-left: auto;
    font-size: 10.5px; color: var(--ink-4);
    padding: 2px 8px; border-radius: 10px;
    background: var(--line-soft);
    transition: all 0.2s;
  }
  .day-status.has-content {
    color: var(--success);
    background: rgba(16, 185, 129, 0.10);
  }
  .day-arrow {
    color: var(--ink-3);
    transition: transform 0.25s;
    font-size: 11px;
  }
  .day-item.open .day-arrow { transform: rotate(180deg); color: var(--primary); }

  .day-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .day-item.open .day-body { max-height: 220px; }
  .day-body-inner { padding: 0 14px 14px; }
  .day-textarea {
    width: 100%;
    min-height: 90px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13px;
    line-height: 1.65;
    color: var(--ink);
    background: #fafbfc;
    resize: vertical;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .day-textarea:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.10);
  }
  .day-textarea::placeholder {
    color: var(--ink-4);
    font-size: 12.5px;
  }

  /* ============ Generate Button ============ */
  .generate-btn {
    width: 100%;
    padding: 14px 20px;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
    color: #fff;
    font-family: inherit; font-size: 14.5px; font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    position: relative; overflow: hidden;
    box-shadow: var(--shadow-glow);
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .generate-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent 50%);
    opacity: 0.6;
    pointer-events: none;
  }
  .generate-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 12px 28px -4px rgba(59, 130, 246, 0.55);
  }
  .generate-btn:active:not(:disabled) { transform: translateY(1px); }
  .generate-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
  .generate-btn .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    pointer-events: none;
    transform: scale(0);
    animation: ripple 0.6s linear;
  }
  @keyframes ripple {
    to { transform: scale(4); opacity: 0; }
  }
  .generate-tip {
    margin-top: 10px;
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-3);
  }
  .generate-tip kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 4px;
    font-family: inherit;
    font-size: 10.5px;
    background: var(--line-soft);
    color: var(--ink-2);
  }

  /* ============ Output Area ============ */
  .output-area {
    flex: 1; overflow-y: auto;
    padding: 22px 26px;
    background:
      linear-gradient(180deg, rgba(248, 250, 252, 0.5) 0%, transparent 200px),
      var(--card);
    min-height: 0;
  }

  .empty-state {
    height: 100%;
    min-height: 380px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    color: var(--ink-3);
    gap: 18px;
    padding: 40px 20px;
  }
  .empty-illustration {
    width: 110px; height: 110px;
    border-radius: 26px;
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
    position: relative;
    box-shadow: var(--shadow-md);
  }
  .empty-illustration::before {
    content: '';
    position: absolute; inset: -6px;
    border-radius: 30px;
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.18), transparent 70%);
    z-index: -1;
  }
  .empty-text-main {
    font-size: 15px;
    color: var(--ink-2);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .empty-text-sub {
    font-size: 12.5px;
    color: var(--ink-3);
    line-height: 1.8;
  }

  /* ============ Skeleton ============ */
  .skeleton-wrap { padding: 4px 0; }
  .skel-bar {
    background: linear-gradient(90deg, #f1f5f9 0%, #e6ecf5 50%, #f1f5f9 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skel-title { height: 22px; width: 55%; margin-bottom: 14px; }
  .skel-meta { display: flex; gap: 14px; margin-bottom: 28px; }
  .skel-meta .skel-bar { height: 11px; width: 80px; }
  .skel-section { margin-bottom: 22px; }
  .skel-section-title { height: 14px; width: 28%; margin-bottom: 12px; border-radius: 4px; }
  .skel-line { height: 12px; margin-bottom: 8px; border-radius: 4px; }
  .skel-line.w-100 { width: 100%; }
  .skel-line.w-90  { width: 90%; }
  .skel-line.w-80  { width: 80%; }
  .skel-line.w-70  { width: 70%; }
  .skel-line.w-60  { width: 60%; }
  .skel-line.w-50  { width: 50%; }
  .skel-status {
    text-align: center;
    margin-top: 24px;
    color: var(--ink-3);
    font-size: 13px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .skel-spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(59, 130, 246, 0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ Report ============ */
  .report { animation: fadeUp 0.5s; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .report-header {
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 22px;
  }
  .report-title {
    font-size: 20px; font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #0f172a 0%, #6366f1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.01em;
    min-height: 26px;
  }
  .report-meta {
    display: flex; flex-wrap: wrap; gap: 14px;
    font-size: 12px; color: var(--ink-3);
  }
  .report-meta span { display: inline-block; }
  .report-meta span + span::before {
    content: '·'; margin-right: 8px; color: var(--ink-4);
  }

  .report-section { margin-bottom: 24px; }
  .report-section h3 {
    display: flex; align-items: center; gap: 10px;
    font-size: 14.5px; font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .section-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px;
    border-radius: 6px;
    font-size: 12px; font-weight: 600;
    color: #fff;
    box-shadow: var(--shadow-sm);
  }
  .section-num.cat-done  { background: linear-gradient(135deg, #10b981, #059669); }
  .section-num.cat-issue { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .section-num.cat-plan  { background: linear-gradient(135deg, #6366f1, #4f46e5); }
  .section-count {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--ink-3);
    font-weight: 400;
    background: var(--line-soft);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .report-section ul { list-style: none; padding: 0; }
  .report-section li {
    position: relative;
    padding: 8px 0 8px 22px;
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.75;
    border-bottom: 1px dashed var(--line-soft);
    min-height: 1em;
  }
  .report-section li:last-child { border-bottom: none; }
  .report-section li::before {
    content: '';
    position: absolute;
    left: 4px; top: 17px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
  }

  .cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: var(--primary);
    margin-left: 1px;
    vertical-align: text-bottom;
    animation: blink 0.8s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .report-footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11.5px; color: var(--ink-3);
  }
  .report-footer .stamp {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px;
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.10), rgba(6, 182, 212, 0.10));
    color: var(--accent);
    font-weight: 500;
  }

  /* ============ Copy Button ============ */
  .copy-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    border-radius: 8px;
    font-family: inherit; font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: rgba(59, 130, 246, 0.05);
  }
  .copy-btn.copied {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
  }

  /* ============ Toast ============ */
  .toast {
    position: fixed;
    bottom: 36px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    padding: 12px 20px;
    background: rgba(15, 23, 42, 0.95);
    color: #fff;
    border-radius: 12px;
    font-size: 13px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 1000;
    pointer-events: none;
    backdrop-filter: blur(10px);
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--success);
    font-size: 11px; font-weight: 600;
  }

  /* ============ Scrollbar ============ */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }
</style>
</head>
<body>
  <nav class="topbar">
    <div class="brand">
      <div class="brand-logo">📝</div>
      <div class="brand-text">
        <span class="brand-name">周报自动生成器</span>
        <span class="brand-sub">Weekly Report AI · v1.0</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge"><span class="badge-dot"></span>AI 引擎已就绪</span>
    </div>
  </nav>

  <main class="layout">
    <section class="panel left-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="icon">📋</span>
          本周记录
        </div>
        <span class="panel-meta" id="progress">已记录 0 / 5 天</span>
      </div>
      <div class="panel-body">
        <div class="day-list" id="dayList"></div>
      </div>
      <div class="panel-footer">
        <button class="generate-btn" id="generate">✨ 一键生成老板爱看的周报</button>
        <div class="generate-tip">快捷键 <kbd>Ctrl</kbd> + <kbd>Enter</kbd></div>
      </div>
    </section>

    <section class="panel right-panel">
      <div class="panel-header">
        <div class="panel-title">
          <span class="icon">📄</span>
          周报预览
        </div>
        <button class="copy-btn" id="copyBtn" style="display:none">📋 一键复制</button>
      </div>
      <div class="output-area" id="output">
        <div class="empty-state" id="emptyState">
          <div class="empty-illustration">📑</div>
          <div class="empty-text-main">你的摸鱼 / 奋斗记录将在这里变成高级周报…</div>
          <div class="empty-text-sub">
            在左侧记录你这一周的故事<br>
            AI 帮你把大白话翻译成职场黑话
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">
    <span class="toast-icon">✓</span>
    <span id="toastText">复制成功</span>
  </div>

<script>
  // ===== 星期数据 =====
  const DAY_LABELS = [
    { id: 'mon', name: '周一', date: '6月16日', emoji: '🌙' },
    { id: 'tue', name: '周二', date: '6月17日', emoji: '🔥' },
    { id: 'wed', name: '周三', date: '6月18日', emoji: '⚡' },
    { id: 'thu', name: '周四', date: '6月19日', emoji: '💡' },
    { id: 'fri', name: '周五', date: '6月20日', emoji: '🎯' }
  ];

  const DAY_PLACEHOLDERS = {
    mon: '今天跟产品经理吵了一架，需求又改了3版，最后还是用了第一版。下午修了2个老bug，晚上开会开到9点。',
    tue: '上午写了个新功能PRD，下午跟后端联调接口被怼了，说字段没写清楚。加班到10点才搞定，晚饭吃的黄焖鸡。',
    wed: '终于把上周遗留的支付模块对接完了，不过测试环境的bug搞得头皮发麻。摸鱼看了会儿掘金，学了个新轮子。',
    thu: '上线了新功能，结果发现一个严重bug，半夜被叫起来回滚。复盘了下，灰度机制得改改。本周数据涨了20%，算好消息。',
    fri: '本周冲刺收尾，开了复盘会，写了总结文档。下周计划搞一个用户激励体系，已经跟产品初步对齐了。'
  };

  // ===== 状态 =====
  const state = {
    days: { mon: '', tue: '', wed: '', thu: '', fri: '' },
    reportText: ''
  };

  // ===== 渲染星期列表 =====
  function renderDays() {
    const list = document.getElementById('dayList');
    list.innerHTML = DAY_LABELS.map(d => `
      <div class="day-item" data-day="${d.id}">
        <button class="day-header" type="button">
          <span class="day-emoji">${d.emoji}</span>
          <span class="day-name">${d.name}</span>
          <span class="day-date">${d.date}</span>
          <span class="day-status" data-status="${d.id}">未记录</span>
          <span class="day-arrow">▾</span>
        </button>
        <div class="day-body">
          <div class="day-body-inner">
            <textarea
              class="day-textarea"
              data-day="${d.id}"
              placeholder="${DAY_PLACEHOLDERS[d.id]}"
            ></textarea>
          </div>
        </div>
      </div>
    `).join('');

    list.querySelector('.day-item').classList.add('open');

    list.querySelectorAll('.day-header').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.parentElement.classList.toggle('open');
      });
    });
    list.querySelectorAll('.day-textarea').forEach(ta => {
      ta.addEventListener('input', () => {
        state.days[ta.dataset.day] = ta.value;
        updateStatus(ta.dataset.day, ta.value.trim());
        updateProgress();
      });
    });
  }

  function updateStatus(day, value) {
    const status = document.querySelector(`[data-status="${day}"]`);
    if (value.length > 0) {
      status.textContent = `已记录 ${value.length} 字`;
      status.classList.add('has-content');
    } else {
      status.textContent = '未记录';
      status.classList.remove('has-content');
    }
  }

  function updateProgress() {
    const count = Object.values(state.days).filter(v => v.trim().length > 0).length;
    document.getElementById('progress').textContent = `已记录 ${count} / 5 天`;
  }

  // ===== 润色规则 =====
  const POLISH_RULES = [

    [/数据(涨|增)(了)?(\d+%)?/g, '核心指标提升 $3'],
    [/\b黄焖鸡\b/g, '简餐'],
    [/\b挺\b/g, '较为'],
    [/\b蛮\b/g, '较为'],
    [/\b差不多\b/g, '基本'],
    [/\b大概\b/g, '基本'],
    [/\b挺多的\b/g, '多项'],
    [/\b还(行|可以|不错|好)\b/g, '表现平稳'],
    [/\b一上午\b/g, '整个上午'],
    [/\b一下午\b/g, '整个下午'],
    [/\b一晚上\b/g, '整个晚间'],
    [/\b一整天\b/g, '全天候'],
    [/\b和(.{1,6})开(了)?(个)?会\b/g, '与 $1 召开协同会议'],
    [/\b跟(.{1,6})开(了)?(个)?会\b/g, '与 $1 召开协同会议'],
    [/(.{1,6})那边\b/g, '$1 侧'],
    [/\b需求(又)?改了?\b/g, '需求项迭代'],
    [/\b用了?第一版\b/g, '复用初版方案'],
    [/\b看(了)?会儿/g, '查阅'],
    [/[哈哦嗯啊]{2,}/g, ''],
    [/[吧呢啊]+$/g, ''],
    [/,/g, '、'],
    [/\.{2,}/g, '……'],
  ];

  function polish(text) {
    let t = text.trim();
    t = t.replace(/^[\s·\-\*•。,，]+/, '');
    for (const [pattern, replacement] of POLISH_RULES) {
      t = t.replace(pattern, replacement);
    }
    t = t.replace(/[、,，;；。]+$/, '');
    if (!/[。;；?？]$/.test(t)) t += '。';
    if (!/^(完成|推进|协调|梳理|优化|对接|处理|参与|支持|跟进|制定|开展|修复|整理|编写|输出|审阅|组织|召开|拉通|学习|研究|总结|沉淀|对齐|确保|明确|确认|按计划|持续|本月|本周|执行|复用|推出|落地)/.test(t)) {
      t = '完成' + t;
    }
    return t;
  }

  function splitItems(text) {
    if (!text) return [];
    return text.split(/[。!！?？\n;；]+/).map(s => s.trim()).filter(s => s.length > 1);
  }

  // ===== 分类关键词 =====
  const CAT_KW = {
    issue: ['问题','卡点','困难','阻塞','风险','bug','异常','崩溃','挂','延期','拖','报错','回滚','来不及','搞不定','搞砸','瓶颈','失败','严重'],
    plan:  ['下周','下一步','接下来','计划','准备','打算','即将','安排','规划','会做','要做','继续'],
    done:  []
  };

  function classifyItem(text) {
    for (const [cat, kws] of Object.entries(CAT_KW)) {
      if (kws.some(k => text.toLowerCase().includes(k))) return cat;
    }
    return 'done';
  }

  // ===== 兜底内容 =====
  const FALLBACK = {
    done: [
      '按计划推进本周既定工作，关键节点按时交付。',
      '与项目组成员保持高频协同，持续对齐目标与节奏。',
      '处理日常需求与跨团队协作事项，及时响应反馈。',
      '梳理并优化部分工作流程，提升整体执行效率。'
    ],
    issue: [
      '部分跨团队事项存在信息同步不及时的问题，建议建立日报同步机制。',
      '上线流程中偶发回滚风险，需补充灰度验证环节。'
    ],
    plan: [
      '继续推进重点项目落地，确保下一里程碑如期达成。',
      '跟进本周遗留问题，明确责任人并闭环处理。',
      '沉淀本周工作经验，形成可复用的方法文档。',
      '与上下游团队保持紧密协作，提前对齐下周排期。'
    ]
  };

  // ===== 构建报告 =====
  function buildReport() {
    const buckets = { done: [], issue: [], plan: [] };
    Object.values(state.days).forEach(text => {
      if (!text.trim()) return;
      const items = splitItems(text);
      items.forEach(it => {
        const cat = classifyItem(it);
        const polished = polish(it);
        if (polished) buckets[cat].push(polished);
      });
    });

    Object.keys(buckets).forEach(cat => {
      if (buckets[cat].length === 0) buckets[cat] = FALLBACK[cat].slice();
    });

    const d = new Date();
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const w = weekOfYear(d);

    return {
      header: {
        title: `${y} 年第 ${w} 周 个人周报`,
        period: `汇报周期：${formatPeriod(d)}`,
        date: `汇报日期：${y}.${pad(m)}.${pad(day)}`,
        author: '汇报人：__________'
      },
      sections: [
        { cat: 'done',  no: '一', title: '本周核心工作', items: buckets.done },
        { cat: 'issue', no: '二', title: '问题与解决',  items: buckets.issue },
        { cat: 'plan',  no: '三', title: '下周计划',     items: buckets.plan }
      ]
    };
  }

  // ===== 骨架屏 =====
  function renderSkeleton() {
    return `
      <div class="skeleton-wrap">
        <div class="skel-bar skel-title"></div>
        <div class="skel-meta">
          <div class="skel-bar"></div>
          <div class="skel-bar"></div>
          <div class="skel-bar"></div>
        </div>
        <div class="skel-section">
          <div class="skel-bar skel-section-title"></div>
          <div class="skel-bar skel-line w-100"></div>
          <div class="skel-bar skel-line w-90"></div>
          <div class="skel-bar skel-line w-80"></div>
          <div class="skel-bar skel-line w-70"></div>
        </div>
        <div class="skel-section">
          <div class="skel-bar skel-section-title"></div>
          <div class="skel-bar skel-line w-100"></div>
          <div class="skel-bar skel-line w-85"></div>
        </div>
        <div class="skel-section">
          <div class="skel-bar skel-section-title"></div>
          <div class="skel-bar skel-line w-100"></div>
          <div class="skel-bar skel-line w-90"></div>
          <div class="skel-bar skel-line w-75"></div>
          <div class="skel-bar skel-line w-60"></div>
        </div>
        <div class="skel-status">
          <span class="skel-spinner"></span>
          <span class="skel-status-text">AI 正在分析输入…</span>
        </div>
      </div>
    `;
  }

  // ===== 主流程 =====
  async function generate() {
    const genBtn = document.getElementById('generate');
    if (genBtn.disabled) return;

    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');

    // 1. 骨架屏
    output.innerHTML = renderSkeleton();
    genBtn.disabled = true;
    copyBtn.style.display = 'none';

    // 2. 加载阶段文案(累计 2s)
    const status = output.querySelector('.skel-status-text');
    const steps = ['AI 正在分析输入…', 'AI 正在识别关键事项…', 'AI 正在润色措辞…', 'AI 正在排版输出…'];
    for (let i = 0; i < steps.length; i++) {
      status.textContent = steps[i];
      await sleep(500);
    }

    // 3. 构建报告
    const report = buildReport();
    state.reportText = reportToText(report);

    // 4. 准备容器
    output.innerHTML = `
      <div class="report">
        <div class="report-header">
          <div class="report-title" id="rTitle"></div>
          <div class="report-meta">
            <span id="rPeriod"></span>
            <span id="rDate"></span>
            <span id="rAuthor"></span>
          </div>
        </div>
        <div id="rSections"></div>
        <div class="report-footer" id="rFooter" style="display:none">
          <span class="stamp">✨ 由 AI 智能润色生成</span>
          <span id="rTotal"></span>
        </div>
      </div>
    `;

    // 5. 逐字渲染
    await typeInto(output.querySelector('#rTitle'), report.header.title, 22);
    await typeInto(output.querySelector('#rPeriod'), report.header.period, 16);
    await typeInto(output.querySelector('#rDate'), report.header.date, 16);
    await typeInto(output.querySelector('#rAuthor'), report.header.author, 16);

    const sectionsEl = document.getElementById('rSections');
    for (const sec of report.sections) {
      const secEl = document.createElement('div');
      secEl.className = 'report-section';
      secEl.innerHTML = `
        <h3>
          <span class="section-num cat-${sec.cat}">${sec.no}</span>
          <span data-typing="title"></span>
          <span class="section-count">（${sec.items.length} 项）</span>
        </h3>
        <ul></ul>
      `;
      sectionsEl.appendChild(secEl);

      await typeInto(secEl.querySelector('[data-typing="title"]'), sec.title, 14);

      const ul = secEl.querySelector('ul');
      for (const item of sec.items) {
        const li = document.createElement('li');
        ul.appendChild(li);
        await typeInto(li, item, 14);
        await sleep(40);
      }
    }

    // 6. 页脚
    const footer = document.getElementById('rFooter');
    document.getElementById('rTotal').textContent = `共 ${report.sections.reduce((a,s)=>a+s.items.length,0)} 项 · 已完成`;
    footer.style.display = 'flex';

    // 7. 显示复制按钮
    copyBtn.style.display = 'inline-flex';
    genBtn.disabled = false;
  }

  // ===== 打字机 =====
  function typeInto(el, text, speed = 16) {
    return new Promise(resolve => {
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      el.appendChild(cursor);
      let i = 0;
      const tick = () => {
        if (i >= text.length) {
          cursor.remove();
          resolve();
          return;
        }
        const ch = text[i++];
        cursor.insertAdjacentText('beforebegin', ch);
        if (cursor.scrollIntoView) {
          try { cursor.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
        }
        const isPunc = /[，。、；：？!！…\.]/.test(ch);
        setTimeout(tick, isPunc ? speed * 3 : speed);
      };
      tick();
    });
  }

  // ===== 复制 =====
  function copyReport() {
    const text = state.reportText;
    const btn = document.getElementById('copyBtn');
    const onDone = () => {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ 已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.classList.remove('copied');
      }, 1600);
      showToast('复制成功，粘贴到汇报群吧～');
    };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove();
      onDone();
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(onDone).catch(fallback);
    } else {
      fallback();
    }
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    document.getElementById('toastText').textContent = message;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ===== 报告转纯文本 =====
  function reportToText(report) {
    const lines = [
      report.header.title,
      `${report.header.period}    ${report.header.date}    ${report.header.author}`,
      ''
    ];
    report.sections.forEach(s => {
      lines.push(`${s.no}、${s.title}（${s.items.length} 项）`);
      s.items.forEach((t, i) => lines.push(`  ${i+1}. ${t}`));
      lines.push('');
    });
    lines.push('✨ 由 AI 智能润色生成');
    return lines.join('\n');
  }

  // ===== 工具 =====
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function weekOfYear(d) {
    const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const jan1 = new Date(date.getFullYear(), 0, 1);
    return Math.ceil((((date - jan1) / 86400000) + jan1.getDay() + 1) / 7);
  }
  function formatPeriod(d) {
    const day = d.getDay() || 7;
    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day + 1);
    const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
    return `${monday.getMonth() + 1}.${pad(monday.getDate())} – ${sunday.getMonth() + 1}.${pad(sunday.getDate())}`;
  }

  // ===== 按钮波纹 =====
  function bindRipple(btn) {
    btn.addEventListener('click', e => {
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  }

  // ===== 初始化 =====
  renderDays();
  updateProgress();
  const genBtn = document.getElementById('generate');
  genBtn.addEventListener('click', generate);
  document.getElementById('copyBtn').addEventListener('click', copyReport);
  bindRipple(genBtn);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      generate();
    }
  });
</script>
