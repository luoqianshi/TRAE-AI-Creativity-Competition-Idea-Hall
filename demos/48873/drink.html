<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天喝什么</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #f6f4ff;
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    overflow-x: hidden;
  }

  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.22;
  }
  .blob1 { width: 580px; height: 580px; background: #7c6af7; top: -180px; left: -120px; }
  .blob2 { width: 420px; height: 420px; background: #41c9a3; bottom: -100px; right: -100px; }

  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 2rem;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: #5a4fd6;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: opacity 0.2s;
  }
  .back-btn:hover { opacity: 0.7; }

  .page-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: #2a2218;
    letter-spacing: 0.06em;
  }

  .spacer { width: 80px; }

  .main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem 1.5rem 3rem;
    min-height: calc(100vh - 70px);
  }

  .subtitle {
    font-size: 0.9rem;
    color: #8070b0;
    margin-bottom: 2rem;
    letter-spacing: 0.08em;
  }

  .arena {
    position: relative;
    width: 100%;
    max-width: 780px;
    min-height: 360px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 1rem 1.4rem;
    padding: 2.5rem 2rem;
    background: rgba(255,255,255,0.6);
    border-radius: 28px;
    border: 0.5px solid rgba(124,106,247,0.15);
    backdrop-filter: blur(6px);
    margin-bottom: 2rem;
  }

  .option {
    cursor: default;
    border-radius: 12px;
    padding: 0.5em 1em;
    font-weight: 600;
    white-space: nowrap;
    transition: opacity 0.15s, transform 0.15s;
    position: relative;
    user-select: none;
  }

  .btn-spin {
    width: 200px;
    height: 56px;
    border-radius: 28px;
    border: none;
    background: linear-gradient(135deg, #9b8af8, #5a4fd6);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(90,79,214,0.38);
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
  }

  .btn-spin:hover:not(:disabled) {
    transform: scale(1.06) translateY(-3px);
    box-shadow: 0 14px 36px rgba(90,79,214,0.48);
  }

  .btn-spin:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .result-board {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: 1.8rem;
    animation: result-pop 0.6s cubic-bezier(.34,1.56,.64,1) forwards;
  }

  .result-board.show { display: flex; }

  @keyframes result-pop {
    from { opacity: 0; transform: scale(0.6) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .result-label {
    font-size: 0.9rem;
    color: #8070b0;
    letter-spacing: 0.1em;
    margin-bottom: 0.6rem;
  }

  .result-text {
    font-size: 2.2rem;
    font-weight: 800;
    color: #5a4fd6;
    letter-spacing: 0.06em;
    text-shadow: 0 2px 16px rgba(90,79,214,0.28);
  }

  .result-emoji {
    font-size: 3rem;
    margin-bottom: 0.4rem;
    animation: bounce-emoji 0.8s ease 0.3s infinite alternate;
  }

  @keyframes bounce-emoji {
    from { transform: translateY(0); }
    to { transform: translateY(-10px); }
  }

  .confetti-wrap {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    border-radius: 2px;
    animation: confetti-fall linear forwards;
  }

  @keyframes confetti-fall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
  }

  .winner-glow {
    animation: winner-pulse 0.7s ease-in-out infinite alternate !important;
    box-shadow: 0 0 0 4px rgba(90,79,214,0.2), 0 0 32px rgba(90,79,214,0.4) !important;
  }

  @keyframes winner-pulse {
    from { transform: scale(1.08); box-shadow: 0 0 0 4px rgba(90,79,214,0.2), 0 0 32px rgba(90,79,214,0.4); }
    to { transform: scale(1.14); box-shadow: 0 0 0 8px rgba(90,79,214,0.12), 0 0 52px rgba(90,79,214,0.55); }
  }

  /* ---- 左下角装饰 ---- */
  .deco-left {
    position: fixed;
    bottom: 32px;
    left: 32px;
    width: 130px;
    height: 130px;
    z-index: 5;
    pointer-events: none;
  }
  .deco-ring {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 2px dashed rgba(124,106,247,0.38);
    position: absolute;
    top: 0; left: 0;
    animation: deco-spin 18s linear infinite;
  }
  .deco-ring2 {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 1.5px dashed rgba(124,106,247,0.24);
    position: absolute;
    top: 20px; left: 20px;
    animation: deco-spin 12s linear infinite reverse;
  }
  .deco-dot {
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(124,106,247,0.58);
  }
  @keyframes deco-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .deco-emoji {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.4rem;
    opacity: 0.55;
  }

  /* ---- 右下角 DeepSeek 入口 ---- */
  .ds-corner {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .ds-tip {
    background: rgba(255,255,255,0.94);
    border: 1px solid rgba(124,106,247,0.28);
    border-radius: 18px 18px 4px 18px;
    padding: 10px 18px;
    font-size: 0.92rem;
    color: #6658c0;
    letter-spacing: 0.04em;
    white-space: nowrap;
    backdrop-filter: blur(6px);
    pointer-events: none;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(124,106,247,0.12);
  }

  .ds-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: linear-gradient(135deg, #9b8af8, #5a4fd6);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 24px rgba(90,79,214,0.42);
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
    font-size: 1.9rem;
  }
  .ds-btn:hover {
    transform: scale(1.12);
    box-shadow: 0 10px 32px rgba(90,79,214,0.52);
  }

  /* ---- DeepSeek 弹层 ---- */
  .ds-modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 200;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 0 28px 92px 0;
  }
  .ds-modal-bg.open { display: flex; }

  .ds-modal {
    width: 340px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.14);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: modal-slide-up 0.32s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes modal-slide-up {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .ds-modal-header {
    background: linear-gradient(135deg, #9b8af8, #5a4fd6);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .ds-modal-title {
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .ds-modal-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.85);
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }
  .ds-modal-close:hover { color: #fff; }

  .ds-chat-area {
    flex: 1;
    padding: 14px 16px;
    min-height: 120px;
    max-height: 240px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f8f6ff;
  }

  .ds-msg {
    max-width: 85%;
    border-radius: 12px;
    padding: 9px 13px;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .ds-msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #9b8af8, #5a4fd6);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .ds-msg.bot {
    align-self: flex-start;
    background: #fff;
    color: #2a2040;
    border: 0.5px solid rgba(124,106,247,0.15);
    border-bottom-left-radius: 4px;
  }
  .ds-msg.typing { color: #8070b0; font-style: italic; }

  .ds-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    border-top: 0.5px solid rgba(124,106,247,0.12);
    background: #fff;
  }
  .ds-input {
    flex: 1;
    border: 0.5px solid rgba(124,106,247,0.28);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 0.85rem;
    outline: none;
    font-family: inherit;
    color: #2a2040;
    background: #f8f6ff;
  }
  .ds-input:focus { border-color: rgba(124,106,247,0.5); }
  .ds-send {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #9b8af8, #5a4fd6);
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .ds-send:hover { transform: scale(1.1); }
  .ds-send:disabled { opacity: 0.5; cursor: not-allowed; }

  .ds-quick-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 14px 0;
    background: #fff;
  }
  .ds-quick {
    border: 0.5px solid rgba(124,106,247,0.3);
    border-radius: 16px;
    padding: 4px 10px;
    font-size: 0.76rem;
    color: #5a4fd6;
    background: rgba(124,106,247,0.06);
    cursor: pointer;
    transition: background 0.15s;
  }
  .ds-quick:hover { background: rgba(124,106,247,0.14); }

  .bubbles-wrap {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: -60px;
    border-radius: 50%;
    opacity: 0;
    animation: rise-bubble ease-in infinite;
  }

  @keyframes rise-bubble {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    15% { opacity: 0.18; }
    85% { opacity: 0.12; }
    100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
  }
</style>
</head>
<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<div class="bubbles-wrap" id="bubblesWrap"></div>

<header>
  <a href="index.html" class="back-btn">← 返回首页</a>
  <div class="page-title">今天喝什么</div>
  <div class="spacer"></div>
</header>

<div class="main">
  <p class="subtitle">✦ 点击按钮，让随机替你决定 ✦</p>

  <div class="arena" id="arena"></div>

  <button class="btn-spin" id="spinBtn" onclick="startSpin()">帮我决定！</button>

  <div class="result-board" id="resultBoard">
    <div class="result-emoji" id="resultEmoji"></div>
    <div class="result-label">今天就喝</div>
    <div class="result-text" id="resultText"></div>
  </div>
</div>

<!-- 左下角装饰 -->
<div class="deco-left">
  <div class="deco-ring"></div>
  <div class="deco-ring2"></div>
  <div class="deco-dot" style="top:-5px;left:55px;"></div>
  <div class="deco-dot" style="top:55px;right:-5px;background:rgba(124,106,247,0.38);width:8px;height:8px;"></div>
  <div class="deco-dot" style="bottom:-5px;left:55px;background:rgba(65,201,163,0.65);width:9px;height:9px;"></div>
  <div class="deco-emoji">🧋</div>
</div>


<!-- 右下角 DeepSeek 入口 -->
<div class="ds-corner">
  <div class="ds-tip">选不了？问问 AI 来帮你 ✨</div>
  <button class="ds-btn" onclick="openDsModal()" title="向 DeepSeek 提问">🤖</button>
</div>

<!-- DeepSeek 弹层 -->
<div class="ds-modal-bg" id="dsModalBg" onclick="closeDsOnBg(event)">
  <div class="ds-modal">
    <div class="ds-modal-header">
      <span class="ds-modal-title">问 DeepSeek — 今天喝什么？</span>
      <button class="ds-modal-close" onclick="closeDsModal()">✕</button>
    </div>
    <div class="ds-quick-btns">
      <button class="ds-quick" onclick="quickAsk('今天喝什么好？帮我推荐一杯')">今天喝什么好？</button>
      <button class="ds-quick" onclick="quickAsk('我想喝点清爽的，推荐什么饮料？')">想喝清爽的</button>
      <button class="ds-quick" onclick="quickAsk('推荐一杯奶茶或咖啡，要有创意')">奶茶或咖啡</button>
    </div>
    <div class="ds-chat-area" id="dsChatArea">
      <div class="ds-msg bot">你好！告诉我你的口味偏好，我来帮你选今天的饮品 🧋</div>
    </div>
    <div class="ds-input-row">
      <input class="ds-input" id="dsInput" placeholder="输入你的口味偏好..." onkeydown="if(event.key==='Enter')sendDs()">
      <button class="ds-send" id="dsSendBtn" onclick="sendDs()">➤</button>
    </div>
  </div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>

<script>
const items = [
  { name: '珍珠奶茶',   emoji: '🧋', color: '#c05a00' },
  { name: '杨枝甘露',   emoji: '🥭', color: '#e0a010' },
  { name: '生椰拿铁',   emoji: '🥥', color: '#41a882' },
  { name: '草莓果茶',   emoji: '🍓', color: '#d43060' },
  { name: '抹茶拿铁',   emoji: '🍵', color: '#3a9a50' },
  { name: '美式咖啡',   emoji: '☕', color: '#5a3510' },
  { name: '柠檬气泡水', emoji: '🍋', color: '#c8b000' },
  { name: '西柚茶',     emoji: '🍊', color: '#d05a10' },
  { name: '葡萄乌龙',   emoji: '🍇', color: '#7c3aaa' },
  { name: '多肉葡萄',   emoji: '🫧', color: '#9b4fc8' },
  { name: '冰淇淋奶昔', emoji: '🍦', color: '#d060a0' },
  { name: '燕麦拿铁', emoji: '🌾', color: '#8a7020' },
];

const sizes = [1.2, 1.5, 1.8, 1.1, 1.65, 1.35, 1.25, 1.55, 1.4, 1.7, 1.15, 1.45];
const opacities = [0.85, 0.95, 1.0, 0.75, 0.9, 0.8, 0.7, 0.88, 0.92, 1.0, 0.78, 0.86];

const arena = document.getElementById('arena');

function buildOptions() {
  arena.innerHTML = '';
  items.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'option';
    el.id = 'opt-' + i;
    el.textContent = item.emoji + ' ' + item.name;
    el.style.fontSize = sizes[i] + 'rem';
    el.style.color = item.color;
    el.style.opacity = opacities[i];
    arena.appendChild(el);
  });
}

buildOptions();

function buildBubbles() {
  const wrap = document.getElementById('bubblesWrap');
  const colors = ['#7c6af7', '#41c9a3', '#d4b0ff', '#9be0c8', '#f7c9ff'];
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 16 + Math.random() * 40;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.background = colors[Math.floor(Math.random() * colors.length)];
    b.style.left = (Math.random() * 100) + '%';
    const dur = 8 + Math.random() * 10;
    const delay = Math.random() * -15;
    b.style.animation = `rise-bubble ${dur}s ${delay}s ease-in infinite`;
    wrap.appendChild(b);
  }
}

buildBubbles();

let spinning = false;

function startSpin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  document.getElementById('resultBoard').classList.remove('show');

  const opts = document.querySelectorAll('.option');
  opts.forEach(o => {
    o.classList.remove('winner-glow');
    o.style.filter = 'none';
    o.style.opacity = opacities[parseInt(o.id.split('-')[1])];
  });

  const winnerIdx = Math.floor(Math.random() * items.length);
  let flashCount = 0;
  const totalFlashes = 28 + Math.floor(Math.random() * 12);

  function flash() {
    opts.forEach((o, i) => {
      const t = flashCount / totalFlashes;
      const flickerProb = 0.5 + 0.4 * t;
      if (Math.random() < flickerProb) {
        o.style.opacity = (0.06 + Math.random() * 0.2).toFixed(2);
      } else {
        o.style.opacity = (0.6 + Math.random() * 0.4).toFixed(2);
      }
    });

    flashCount++;
    const slowdown = flashCount < totalFlashes * 0.5
      ? 60
      : 60 + Math.floor(Math.pow((flashCount - totalFlashes * 0.5) / (totalFlashes * 0.5), 1.8) * 220);

    if (flashCount < totalFlashes) {
      setTimeout(flash, slowdown);
    } else {
      revealWinner(winnerIdx);
    }
  }

  flash();
}

function revealWinner(idx) {
  const opts = document.querySelectorAll('.option');
  opts.forEach((o, i) => {
    if (i !== idx) {
      o.style.opacity = '0.07';
      o.style.filter = 'grayscale(1)';
    } else {
      o.style.opacity = '1';
      o.style.filter = 'none';
      o.classList.add('winner-glow');
    }
  });

  const winner = items[idx];
  document.getElementById('resultEmoji').textContent = winner.emoji;
  document.getElementById('resultText').textContent = winner.name;
  document.getElementById('resultBoard').classList.add('show');

  launchConfetti(winner.color);

  setTimeout(() => {
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
    document.getElementById('spinBtn').textContent = '再选一次';
    opts.forEach((o) => {
      o.style.filter = 'none';
    });
  }, 2000);
}

function launchConfetti(baseColor) {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = [baseColor, '#7c6af7', '#41c9a3', '#f7c942', '#d4b0ff', '#fff'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const color = colors[Math.floor(Math.random() * colors.length)];
    piece.style.background = color;
    piece.style.left = (Math.random() * 100) + '%';
    piece.style.top = '0';
    const dur = 1.8 + Math.random() * 1.4;
    const delay = Math.random() * 0.8;
    piece.style.animation = `confetti-fall ${dur}s ${delay}s ease-in forwards`;
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = (6 + Math.random() * 8) + 'px';
    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    wrap.appendChild(piece);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 4000);
}

// ---- DeepSeek 对话 ----
const DS_API_KEY = 'sk-534900877d0f4373a7b865cfdc52e503';
const DS_BASE_URL = 'https://api.deepseek.com';
const DS_MODEL = 'deepseek-v4-pro';
const dsHistory = [
  { role: 'system', content: '你是一个饮品顾问，帮用户决定今天喝什么。回答要简洁有趣，控制在100字以内，可以推荐具体饮品并给出1-2个理由。' }
];

function openDsModal() {
  document.getElementById('dsModalBg').classList.add('open');
  document.getElementById('dsInput').focus();
}
function closeDsModal() {
  document.getElementById('dsModalBg').classList.remove('open');
}
function closeDsOnBg(e) {
  if (e.target === document.getElementById('dsModalBg')) closeDsModal();
}
function quickAsk(text) {
  document.getElementById('dsInput').value = text;
  sendDs();
}

function appendMsg(role, text) {
  const area = document.getElementById('dsChatArea');
  const div = document.createElement('div');
  div.className = 'ds-msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

async function sendDs() {
  const input = document.getElementById('dsInput');
  const btn = document.getElementById('dsSendBtn');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  btn.disabled = true;

  appendMsg('user', text);
  dsHistory.push({ role: 'user', content: text });

  const typingEl = appendMsg('bot', '正在思考中…');
  typingEl.classList.add('typing');

  try {
    const res = await fetch(DS_BASE_URL + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + DS_API_KEY
      },
      body: JSON.stringify({
        model: DS_MODEL,
        messages: dsHistory,
        max_tokens: 200,
        temperature: 0.9
      })
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || '抱歉，暂时无法回复，请稍后再试。';
    typingEl.textContent = reply;
    typingEl.classList.remove('typing');
    dsHistory.push({ role: 'assistant', content: reply });
  } catch(e) {
    typingEl.textContent = '网络请求失败，请检查连接后重试。';
    typingEl.classList.remove('typing');
  }
  btn.disabled = false;
  input.focus();
}
</script>
