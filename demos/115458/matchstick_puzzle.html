<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴棒题目生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .controls {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }
        .control-group label {
            font-weight: 600;
            color: #333;
        }
        .type-buttons {
            display: flex;
            gap: 10px;
        }
        .type-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .type-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .type-btn:hover {
            border-color: #667eea;
        }
        .generate-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .custom-input-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .custom-input-section input {
            width: 200px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: monospace;
            margin-right: 10px;
        }
        .custom-input-section input:focus {
            outline: none;
            border-color: #667eea;
        }
        .custom-btn {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .custom-btn:hover {
            background: #218838;
        }
        .puzzles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
        }
        .puzzle-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
        }
        .puzzle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .puzzle-number {
            font-weight: 700;
            color: #667eea;
            font-size: 18px;
        }
        .puzzle-type {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .type-add {
            background: #d4edda;
            color: #155724;
        }
        .type-remove {
            background: #f8d7da;
            color: #721c24;
        }
        .type-move {
            background: #d1ecf1;
            color: #0c5460;
        }
        .matchstick-svg {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            min-height: 90px;
        }
        .answer-section {
            margin-top: 15px;
        }
        .show-answer-btn {
            padding: 8px 16px;
            background: #ffc107;
            color: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .show-answer-btn:hover {
            background: #e0a800;
        }
        .answer-box {
            margin-top: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            font-family: monospace;
            font-size: 18px;
            color: #333;
            display: none;
        }
        .answer-box.show {
            display: block;
        }
        .download-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .download-btn:hover {
            background: #0069d9;
        }
        @media (max-width: 768px) {
            .control-group {
                flex-direction: column;
                align-items: flex-start;
            }
            .type-buttons {
                flex-wrap: wrap;
            }
            .custom-input-section input {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 火柴棒题目生成器</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>选择题目类型：</label>
                <div class="type-buttons">
                    <button class="type-btn active" data-type="add">添加一根火柴</button>
                    <button class="type-btn" data-type="remove">删除一根火柴</button>
                    <button class="type-btn" data-type="move">移动一根火柴</button>
                </div>
                <button class="generate-btn" onclick="generatePuzzles()">生成10道题目</button>
            </div>
            
            <div class="custom-input-section">
                <label>自定义输入：</label>
                <input type="text" id="customInput" placeholder="例如：1+2=3" maxlength="20">
                <button class="custom-btn" onclick="renderCustom()">生成火柴棒图片</button>
            </div>
        </div>
        
        <div id="puzzlesContainer" class="puzzles-grid">
        </div>
        
        <div id="customDisplay" class="puzzles-grid" style="display: none;">
            <div class="puzzle-card">
                <div class="puzzle-header">
                    <span class="puzzle-number">自定义题目</span>
                    <span class="puzzle-type type-move">预览</span>
                </div>
                <div id="customMatchstick" class="matchstick-svg"></div>
                <button class="download-btn" onclick="downloadCustom()">下载图片</button>
            </div>
        </div>
    </div>

    <script>
        // 数字到七段数码管的映射
        // 段索引: 0=上, 1=右上, 2=右下, 3=下, 4=左下, 5=左上, 6=中
        const digitSegments = {
            '0': [0, 1, 2, 3, 4, 5],
            '1': [1, 2],
            '2': [0, 1, 6, 4, 3],
            '3': [0, 1, 6, 2, 3],
            '4': [5, 6, 1, 2],
            '5': [0, 5, 6, 2, 3],
            '6': [0, 5, 6, 2, 3, 4],
            '7': [0, 1, 2],
            '8': [0, 1, 2, 3, 4, 5, 6],
            '9': [0, 5, 6, 1, 2, 3]
        };

        // 数字对应的火柴棒数量
        const stickCounts = {
            '0': 6, '1': 2, '2': 5, '3': 5, '4': 4,
            '5': 5, '6': 6, '7': 3, '8': 7, '9': 6,
            '+': 2, '-': 1, '=': 2
        };

        // 去掉一根火柴的变换（用于从答案生成"添加一根"的题目）
        const removeOneTransforms = {
            '8': ['0', '6', '9'],
            '9': ['3', '5'],
            '6': ['5'],
            '7': ['1'],
            '+': ['-']
        };

        // 添加一根火柴的变换（用于从答案生成"删除一根"的题目）
        const addOneTransforms = {
            '0': ['8'],
            '1': ['7'],
            '3': ['9'],
            '5': ['6', '9'],
            '6': ['8'],
            '9': ['8'],
            '-': ['+']
        };

        // 移动一根火柴的单个数字变换
        const moveSingleTransforms = {
            '0': ['6', '9'],
            '2': ['3'],
            '3': ['2', '5'],
            '5': ['3'],
            '6': ['0', '9'],
            '9': ['0', '6']
        };

        // 绘制参数
        const CHAR_WIDTH = 60;
        const CHAR_HEIGHT = 90;
        const STICK_WIDTH = 6;
        const STICK_COLOR = '#8B4513';
        const DOT_COLOR = '#5D3A1A';
        const DOT_RADIUS = 5;

        // 数字段坐标
        const segments = [
            { x1: 10, y1: 10, x2: 50, y2: 10 },      // 0 上
            { x1: 50, y1: 10, x2: 50, y2: 50 },      // 1 右上
            { x1: 50, y1: 50, x2: 50, y2: 90 },      // 2 右下
            { x1: 10, y1: 90, x2: 50, y2: 90 },      // 3 下
            { x1: 10, y1: 50, x2: 10, y2: 90 },      // 4 左下
            { x1: 10, y1: 10, x2: 10, y2: 50 },      // 5 左上
            { x1: 10, y1: 50, x2: 50, y2: 50 }       // 6 中
        ];

        function createStickLine(x1, y1, x2, y2) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', STICK_COLOR);
            line.setAttribute('stroke-width', STICK_WIDTH);
            line.setAttribute('stroke-linecap', 'round');
            return line;
        }

        function createDot(cx, cy) {
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('cx', cx);
            dot.setAttribute('cy', cy);
            dot.setAttribute('r', DOT_RADIUS);
            dot.setAttribute('fill', DOT_COLOR);
            return dot;
        }

        function drawDigit(svg, digit, offsetX) {
            const activeSegments = digitSegments[digit];
            if (!activeSegments) return;
            
            activeSegments.forEach(segIndex => {
                const seg = segments[segIndex];
                const x1 = seg.x1 + offsetX;
                const x2 = seg.x2 + offsetX;
                svg.appendChild(createStickLine(x1, seg.y1, x2, seg.y2));
                svg.appendChild(createDot(x1, seg.y1));
                svg.appendChild(createDot(x2, seg.y2));
            });
        }

        function drawOperator(svg, op, offsetX) {
            const cx = offsetX + CHAR_WIDTH / 2;
            if (op === '+') {
                // 垂直线
                svg.appendChild(createStickLine(cx, 25, cx, 75));
                svg.appendChild(createDot(cx, 25));
                svg.appendChild(createDot(cx, 75));
                // 水平线
                svg.appendChild(createStickLine(offsetX + 5, 50, offsetX + 55, 50));
                svg.appendChild(createDot(offsetX + 5, 50));
                svg.appendChild(createDot(offsetX + 55, 50));
            } else if (op === '-') {
                svg.appendChild(createStickLine(offsetX + 5, 50, offsetX + 55, 50));
                svg.appendChild(createDot(offsetX + 5, 50));
                svg.appendChild(createDot(offsetX + 55, 50));
            } else if (op === '=') {
                svg.appendChild(createStickLine(offsetX + 5, 35, offsetX + 55, 35));
                svg.appendChild(createDot(offsetX + 5, 35));
                svg.appendChild(createDot(offsetX + 55, 35));
                svg.appendChild(createStickLine(offsetX + 5, 65, offsetX + 55, 65));
                svg.appendChild(createDot(offsetX + 5, 65));
                svg.appendChild(createDot(offsetX + 55, 65));
            }
        }

        function drawMatchstickSVG(expression) {
            const chars = expression.split('');
            const totalWidth = chars.length * CHAR_WIDTH;
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', totalWidth);
            svg.setAttribute('height', CHAR_HEIGHT);
            svg.setAttribute('viewBox', `0 0 ${totalWidth} ${CHAR_HEIGHT}`);

            chars.forEach((char, index) => {
                const offsetX = index * CHAR_WIDTH;
                if (digitSegments[char]) {
                    drawDigit(svg, char, offsetX);
                } else if (['+', '-', '='].includes(char)) {
                    drawOperator(svg, char, offsetX);
                }
            });

            return svg;
        }

        function parseEquation(expr) {
            const match = expr.match(/^(\d)([+-])(\d)=(\d)$/);
            if (!match) return null;
            return {
                left: parseInt(match[1]),
                op: match[2],
                right: parseInt(match[3]),
                result: parseInt(match[4])
            };
        }

        function evaluate(left, op, right) {
            return op === '+' ? left + right : left - right;
        }

        function isValidEquation(expr) {
            const parsed = parseEquation(expr);
            if (!parsed) return false;
            return evaluate(parsed.left, parsed.op, parsed.right) === parsed.result;
        }

        // 生成所有正确的个位数等式
        function generateAllEquations() {
            const equations = [];
            for (let a = 0; a <= 9; a++) {
                for (let b = 0; b <= 9; b++) {
                    if (a + b <= 9) {
                        equations.push(`${a}+${b}=${a + b}`);
                    }
                    if (a - b >= 0) {
                        equations.push(`${a}-${b}=${a - b}`);
                    }
                }
            }
            return equations;
        }

        function uniqueQuestions(questions) {
            const seen = new Set();
            return questions.filter(q => {
                const key = q.question + '|' + q.answer;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        // 生成"添加一根"的题目：从正确答案去掉一根得到错误等式
        function generateAddQuestions(equations) {
            const questions = [];
            for (const answer of equations) {
                for (let i = 0; i < answer.length; i++) {
                    const ch = answer[i];
                    if (!removeOneTransforms[ch]) continue;
                    for (const newCh of removeOneTransforms[ch]) {
                        const question = answer.slice(0, i) + newCh + answer.slice(i + 1);
                        if (question !== answer && !isValidEquation(question) && isValidEquation(answer)) {
                            questions.push({ question, answer, type: 'add' });
                        }
                    }
                }
            }
            return uniqueQuestions(questions);
        }

        // 生成"删除一根"的题目：从正确答案添加一根得到错误等式
        function generateRemoveQuestions(equations) {
            const questions = [];
            for (const answer of equations) {
                for (let i = 0; i < answer.length; i++) {
                    const ch = answer[i];
                    if (!addOneTransforms[ch]) continue;
                    for (const newCh of addOneTransforms[ch]) {
                        const question = answer.slice(0, i) + newCh + answer.slice(i + 1);
                        if (question !== answer && !isValidEquation(question) && isValidEquation(answer)) {
                            questions.push({ question, answer, type: 'remove' });
                        }
                    }
                }
            }
            return uniqueQuestions(questions);
        }

        // 生成"移动一根"的题目（单数字变换）
        function generateSingleMoveQuestions(equations) {
            const questions = [];
            for (const answer of equations) {
                for (let i = 0; i < answer.length; i++) {
                    const ch = answer[i];
                    if (!moveSingleTransforms[ch]) continue;
                    for (const newCh of moveSingleTransforms[ch]) {
                        const question = answer.slice(0, i) + newCh + answer.slice(i + 1);
                        if (question !== answer && !isValidEquation(question) && isValidEquation(answer)) {
                            questions.push({ question, answer, type: 'move' });
                        }
                    }
                }
            }
            return uniqueQuestions(questions);
        }

        // 生成"移动一根"的题目（跨字符移动：从A位置去掉一根，放到B位置添加一根）
        function generateCrossMoveQuestions(equations) {
            const questions = [];
            for (const answer of equations) {
                for (let i = 0; i < answer.length; i++) {
                    const srcCh = answer[i];
                    if (!removeOneTransforms[srcCh]) continue;
                    for (const midSrcCh of removeOneTransforms[srcCh]) {
                        const mid = answer.slice(0, i) + midSrcCh + answer.slice(i + 1);
                        for (let j = 0; j < mid.length; j++) {
                            if (j === i) continue; // 必须移动到不同位置
                            const dstCh = mid[j];
                            if (!addOneTransforms[dstCh]) continue;
                            for (const newDstCh of addOneTransforms[dstCh]) {
                                const question = mid.slice(0, j) + newDstCh + mid.slice(j + 1);
                                if (question !== answer && !isValidEquation(question) && isValidEquation(answer)) {
                                    questions.push({ question, answer, type: 'move' });
                                }
                            }
                        }
                    }
                }
            }
            return uniqueQuestions(questions);
        }

        // 预生成题库
        const allEquations = generateAllEquations();
        const puzzleBank = {
            add: generateAddQuestions(allEquations),
            remove: generateRemoveQuestions(allEquations),
            move: [...generateSingleMoveQuestions(allEquations), ...generateCrossMoveQuestions(allEquations)]
        };

        let currentType = 'add';

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentType = this.dataset.type;
            });
        });

        function generatePuzzles() {
            const container = document.getElementById('puzzlesContainer');
            container.innerHTML = '';
            
            const bank = puzzleBank[currentType];
            const shuffled = [...bank].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, Math.min(10, shuffled.length));
            
            selected.forEach((puzzle, index) => {
                const card = document.createElement('div');
                card.className = 'puzzle-card';
                
                let typeClass = '';
                let typeText = '';
                switch(puzzle.type) {
                    case 'add': typeClass = 'type-add'; typeText = '添加一根火柴'; break;
                    case 'remove': typeClass = 'type-remove'; typeText = '删除一根火柴'; break;
                    case 'move': typeClass = 'type-move'; typeText = '移动一根火柴'; break;
                }
                
                card.innerHTML = `
                    <div class="puzzle-header">
                        <span class="puzzle-number">第${index + 1}题</span>
                        <span class="puzzle-type ${typeClass}">${typeText}</span>
                    </div>
                    <div class="matchstick-svg" id="puzzle-${index}"></div>
                    <div class="answer-section">
                        <button class="show-answer-btn" onclick="toggleAnswer(${index})">显示答案</button>
                        <div class="answer-box" id="answer-${index}">
                            ${puzzle.answer}
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
                
                const svgContainer = document.getElementById(`puzzle-${index}`);
                const svg = drawMatchstickSVG(puzzle.question);
                svgContainer.appendChild(svg);
            });
            
            document.getElementById('customDisplay').style.display = 'none';
        }

        function toggleAnswer(index) {
            const answerBox = document.getElementById(`answer-${index}`);
            answerBox.classList.toggle('show');
        }

        function renderCustom() {
            const input = document.getElementById('customInput').value.trim();
            if (!input) return;
            
            const container = document.getElementById('customMatchstick');
            container.innerHTML = '';
            
            const svg = drawMatchstickSVG(input);
            container.appendChild(svg);
            
            document.getElementById('customDisplay').style.display = 'grid';
            document.getElementById('puzzlesContainer').innerHTML = '';
        }

        function downloadCustom() {
            const container = document.getElementById('customMatchstick');
            const svg = container.querySelector('svg');
            if (!svg) return;
            
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                
                const link = document.createElement('a');
                link.download = 'matchstick-puzzle.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            
            const blob = new Blob([svgData], { type: 'image/svg+xml' });
            img.src = URL.createObjectURL(blob);
        }

        generatePuzzles();
    </script>
</body>
</html>
