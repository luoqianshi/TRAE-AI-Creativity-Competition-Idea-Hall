<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的饮品工坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #e74c3c;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .main-content {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .preview-section {
            width: 350px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .cup-container {
            width: 200px;
            height: 280px;
            position: relative;
            margin-bottom: 20px;
        }

        .cup {
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.8);
            border-radius: 10px 10px 50px 50px;
            border: 4px solid #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .cup-rim {
            width: 100%;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: -10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .liquid {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            transition: height 0.5s ease, background-color 0.5s ease;
        }

        .foam {
            position: absolute;
            bottom: 75%;
            left: 5%;
            right: 5%;
            height: 15%;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .foam.active {
            opacity: 1;
        }

        .toppings {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .topping {
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .topping.active {
            opacity: 1;
        }

        .straw {
            position: absolute;
            top: -60px;
            right: 30px;
            width: 12px;
            height: 200px;
            background: linear-gradient(to right, #ff6b6b, #ee5a5a);
            border-radius: 6px;
            transform: rotate(15deg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .straw.active {
            opacity: 1;
        }

        .straw-hole {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 2px;
        }

        .decoration {
            position: absolute;
            font-size: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .decoration.active {
            opacity: 1;
        }

        .decoration.left {
            top: 10px;
            left: -20px;
        }

        .decoration.right {
            top: 20px;
            right: -15px;
        }

        .drink-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .controls-section {
            width: 400px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group h3 {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 1.1rem;
            padding-left: 10px;
            border-left: 4px solid #e74c3c;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
        }

        .option-btn {
            padding: 12px 8px;
            border: 2px solid #eee;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 0.9rem;
        }

        .option-btn:hover {
            border-color: #e74c3c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231,76,60,0.2);
        }

        .option-btn.active {
            border-color: #e74c3c;
            background: #fff5f5;
            color: #e74c3c;
            font-weight: bold;
        }

        .range-control {
            width: 100%;
            margin-top: 10px;
        }

        .range-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn.reset {
            background: #ecf0f1;
            color: #7f8c8d;
        }

        .action-btn.reset:hover {
            background: #bdc3c7;
        }

        .action-btn.share {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 5px 15px rgba(231,76,60,0.3);
        }

        .action-btn.share:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(231,76,60,0.4);
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translate(-50%, -50%) scale(1);
        }

        @media (max-width: 800px) {
            .main-content {
                flex-direction: column;
                align-items: center;
            }

            .controls-section {
                width: 100%;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍹 我的饮品工坊 🍵</h1>
        
        <div class="main-content">
            <div class="section preview-section">
                <div class="cup-container">
                    <div class="straw" id="straw">
                        <div class="straw-hole"></div>
                    </div>
                    <div class="decoration left" id="decorationLeft">🌸</div>
                    <div class="decoration right" id="decorationRight">🍓</div>
                    <div class="cup">
                        <div class="cup-rim"></div>
                        <div class="liquid" id="liquid"></div>
                        <div class="foam" id="foam"></div>
                        <div class="toppings" id="toppings"></div>
                    </div>
                </div>
                <div class="drink-name" id="drinkName">请选择饮品</div>
                <div style="font-size: 0.9rem; color: #666; text-align: center;" id="drinkDesc"></div>
            </div>

            <div class="section controls-section">
                <div class="control-group">
                    <h3>🥤 选择基础饮品 (15种)</h3>
                    <div class="options-grid" id="baseDrinks">
                        <button class="option-btn" data-type="milk-tea">🧋 珍珠奶茶</button>
                        <button class="option-btn" data-type="fruit-tea">🍊 水果茶</button>
                        <button class="option-btn" data-type="coffee">☕ 咖啡</button>
                        <button class="option-btn" data-type="soda">🥤 气泡水</button>
                        <button class="option-btn" data-type="smoothie">🍧 冰沙</button>
                        <button class="option-btn" data-type="matcha">🍵 抹茶拿铁</button>
                        <button class="option-btn" data-type="yogurt">🥛 酸奶杯</button>
                        <button class="option-btn" data-type="juice">🍎 果汁</button>
                        <button class="option-btn" data-type="hot-chocolate">🍫 热可可</button>
                        <button class="option-btn" data-type="milkshake">🍦 奶昔</button>
                        <button class="option-btn" data-type="lemon-tea">🍋 柠檬茶</button>
                        <button class="option-btn" data-type="green-tea">🍃 绿茶</button>
                        <button class="option-btn" data-type="red-tea">🌹 红茶</button>
                        <button class="option-btn" data-type="mango">🥭 芒果冰</button>
                        <button class="option-btn" data-type="blueberry">🫐 蓝莓饮</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>🧊 配料选择</h3>
                    <div class="options-grid" id="toppings">
                        <button class="option-btn" data-topping="pearl">⚫ 珍珠</button>
                        <button class="option-btn" data-topping="coconut">🥥 椰果</button>
                        <button class="option-btn" data-topping="pudding">🍮 布丁</button>
                        <button class="option-btn" data-topping="aloe">🌿 芦荟</button>
                        <button class="option-btn" data-topping="grass-jelly">🟢 仙草</button>
                        <button class="option-btn" data-topping="taro-ball">🔵 芋圆</button>
                        <button class="option-btn" data-topping="milk-foam">🥛 奶盖</button>
                        <button class="option-btn" data-topping="cheese-foam">🧀 芝士</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>🎨 口味与颜色</h3>
                    <div class="options-grid" id="flavors">
                        <button class="option-btn" data-flavor="original">🥛 原味</button>
                        <button class="option-btn" data-flavor="strawberry">🍓 草莓</button>
                        <button class="option-btn" data-flavor="mango">🥭 芒果</button>
                        <button class="option-btn" data-flavor="chocolate">🍫 巧克力</button>
                        <button class="option-btn" data-flavor="matcha">🍵 抹茶</button>
                        <button class="option-btn" data-flavor="blueberry">🫐 蓝莓</button>
                        <button class="option-btn" data-flavor="watermelon">🍉 西瓜</button>
                        <button class="option-btn" data-flavor="grape">🍇 葡萄</button>
                    </div>
                </div>

                <div class="control-group">
                    <h3>🍬 甜度</h3>
                    <input type="range" class="range-control" id="sweetness" min="0" max="100" value="50">
                    <div class="range-label">
                        <span>无糖</span>
                        <span id="sweetnessValue">50%</span>
                        <span>超甜</span>
                    </div>
                </div>

                <div class="control-group">
                    <h3>🧊 冰量</h3>
                    <input type="range" class="range-control" id="iceLevel" min="0" max="100" value="50">
                    <div class="range-label">
                        <span>热饮</span>
                        <span id="iceValue">50%</span>
                        <span>加冰</span>
                    </div>
                </div>

                <div class="control-group">
                    <h3>✨ 装饰</h3>
                    <div class="options-grid" id="decorations">
                        <button class="option-btn" data-decoration="straw">🥤 吸管</button>
                        <button class="option-btn" data-decoration="flower">🌸 樱花</button>
                        <button class="option-btn" data-decoration="strawberry">🍓 草莓</button>
                        <button class="option-btn" data-decoration="umbrella">☂️ 小伞</button>
                        <button class="option-btn" data-decoration="lemon">🍋 柠檬片</button>
                        <button class="option-btn" data-decoration="mint">🌿 薄荷叶</button>
                    </div>
                </div>

                <div class="actions">
                    <button class="action-btn reset" onclick="resetDrink()">🔄 重置</button>
                    <button class="action-btn share" onclick="shareDrink()">📸 展示成品</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const drinkData = {
            'milk-tea': { name: '珍珠奶茶', color: '#d4a574', desc: '经典港式风味' },
            'fruit-tea': { name: '水果茶', color: '#ff9f43', desc: '新鲜水果调制' },
            'coffee': { name: '咖啡', color: '#4a3728', desc: '香浓现磨咖啡' },
            'soda': { name: '气泡水', color: '#87ceeb', desc: '清爽气泡口感' },
            'smoothie': { name: '冰沙', color: '#ff6b6b', desc: '细腻冰爽口感' },
            'matcha': { name: '抹茶拿铁', color: '#90EE90', desc: '日式抹茶风味' },
            'yogurt': { name: '酸奶杯', color: '#f5deb3', desc: '健康乳酸菌饮品' },
            'juice': { name: '果汁', color: '#ff6347', desc: '纯天然果汁' },
            'hot-chocolate': { name: '热可可', color: '#8b4513', desc: '温暖甜蜜饮品' },
            'milkshake': { name: '奶昔', color: '#dda0dd', desc: '绵密奶昔口感' },
            'lemon-tea': { name: '柠檬茶', color: '#fffacd', desc: '清新酸甜风味' },
            'green-tea': { name: '绿茶', color: '#98fb98', desc: '清香淡雅绿茶' },
            'red-tea': { name: '红茶', color: '#bc5a3e', desc: '醇厚红茶风味' },
            'mango': { name: '芒果冰', color: '#ffa500', desc: '浓郁芒果香气' },
            'blueberry': { name: '蓝莓饮', color: '#4169e1', desc: '清新蓝莓风味' }
        };

        const flavorColors = {
            'original': '#f5deb3',
            'strawberry': '#ff6b81',
            'mango': '#ffa502',
            'chocolate': '#5d4e37',
            'matcha': '#7bed9f',
            'blueberry': '#6c5ce7',
            'watermelon': '#ff6348',
            'grape': '#8b5cf6'
        };

        const toppingIcons = {
            'pearl': '⚫',
            'coconut': '🥥',
            'pudding': '🍮',
            'aloe': '🌿',
            'grass-jelly': '🟢',
            'taro-ball': '🔵',
            'milk-foam': '☁️',
            'cheese-foam': '🧀'
        };

        let currentDrink = null;
        let currentFlavor = null;
        let selectedToppings = new Set();
        let selectedDecorations = new Set();
        let sweetness = 50;
        let iceLevel = 50;

        function updateLiquidColor() {
            const liquid = document.getElementById('liquid');
            if (currentFlavor && flavorColors[currentFlavor]) {
                liquid.style.backgroundColor = flavorColors[currentFlavor];
            } else if (currentDrink && drinkData[currentDrink]) {
                liquid.style.backgroundColor = drinkData[currentDrink].color;
            }
        }

        function updateFoam() {
            const foam = document.getElementById('foam');
            const hasFoam = selectedToppings.has('milk-foam') || selectedToppings.has('cheese-foam');
            foam.classList.toggle('active', hasFoam);
        }

        function updateToppingsDisplay() {
            const toppingsContainer = document.getElementById('toppings');
            toppingsContainer.innerHTML = '';
            
            selectedToppings.forEach(topping => {
                if (toppingIcons[topping]) {
                    const span = document.createElement('span');
                    span.className = 'topping active';
                    span.textContent = toppingIcons[topping];
                    toppingsContainer.appendChild(span);
                }
            });
        }

        function updateDecorations() {
            const straw = document.getElementById('straw');
            const decorationLeft = document.getElementById('decorationLeft');
            const decorationRight = document.getElementById('decorationRight');

            straw.classList.toggle('active', selectedDecorations.has('straw'));
            
            if (selectedDecorations.has('flower')) {
                decorationLeft.textContent = '🌸';
                decorationLeft.classList.add('active');
            } else if (selectedDecorations.has('lemon')) {
                decorationLeft.textContent = '🍋';
                decorationLeft.classList.add('active');
            } else if (selectedDecorations.has('mint')) {
                decorationLeft.textContent = '🌿';
                decorationLeft.classList.add('active');
            } else {
                decorationLeft.classList.remove('active');
            }

            if (selectedDecorations.has('strawberry')) {
                decorationRight.textContent = '🍓';
                decorationRight.classList.add('active');
            } else if (selectedDecorations.has('umbrella')) {
                decorationRight.textContent = '☂️';
                decorationRight.classList.add('active');
            } else {
                decorationRight.classList.remove('active');
            }
        }

        document.getElementById('baseDrinks').addEventListener('click', (e) => {
            const btn = e.target.closest('.option-btn');
            if (!btn) return;

            document.querySelectorAll('#baseDrinks .option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentDrink = btn.dataset.type;
            const data = drinkData[currentDrink];
            
            document.getElementById('drinkName').textContent = data.name;
            document.getElementById('drinkDesc').textContent = data.desc;
            
            updateLiquidColor();
        });

        document.getElementById('flavors').addEventListener('click', (e) => {
            const btn = e.target.closest('.option-btn');
            if (!btn) return;

            document.querySelectorAll('#flavors .option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentFlavor = btn.dataset.flavor;
            updateLiquidColor();
        });

        document.getElementById('toppings').addEventListener('click', (e) => {
            const btn = e.target.closest('.option-btn');
            if (!btn) return;

            const topping = btn.dataset.topping;
            
            if (selectedToppings.has(topping)) {
                selectedToppings.delete(topping);
                btn.classList.remove('active');
            } else {
                selectedToppings.add(topping);
                btn.classList.add('active');
            }

            updateFoam();
            updateToppingsDisplay();
        });

        document.getElementById('decorations').addEventListener('click', (e) => {
            const btn = e.target.closest('.option-btn');
            if (!btn) return;

            const decoration = btn.dataset.decoration;
            
            if (selectedDecorations.has(decoration)) {
                selectedDecorations.delete(decoration);
                btn.classList.remove('active');
            } else {
                selectedDecorations.add(decoration);
                btn.classList.add('active');
            }

            updateDecorations();
        });

        document.getElementById('sweetness').addEventListener('input', (e) => {
            sweetness = e.target.value;
            document.getElementById('sweetnessValue').textContent = sweetness + '%';
        });

        document.getElementById('iceLevel').addEventListener('input', (e) => {
            iceLevel = e.target.value;
            document.getElementById('iceValue').textContent = iceLevel + '%';
        });

        function resetDrink() {
            currentDrink = null;
            currentFlavor = null;
            selectedToppings.clear();
            selectedDecorations.clear();
            sweetness = 50;
            iceLevel = 50;

            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('sweetness').value = 50;
            document.getElementById('iceLevel').value = 50;
            document.getElementById('sweetnessValue').textContent = '50%';
            document.getElementById('iceValue').textContent = '50%';
            document.getElementById('drinkName').textContent = '请选择饮品';
            document.getElementById('drinkDesc').textContent = '';

            document.getElementById('liquid').style.backgroundColor = '';
            document.getElementById('foam').classList.remove('active');
            document.getElementById('straw').classList.remove('active');
            document.getElementById('decorationLeft').classList.remove('active');
            document.getElementById('decorationRight').classList.remove('active');
            document.getElementById('toppings').innerHTML = '';
        }

        function shareDrink() {
            if (!currentDrink) {
                showToast('请先选择一款基础饮品！');
                return;
            }

            const drinkName = drinkData[currentDrink].name;
            const flavorName = currentFlavor ? document.querySelector(`[data-flavor="${currentFlavor}"]`).textContent : '';
            const toppingsList = Array.from(selectedToppings).map(t => document.querySelector(`[data-topping="${t}"]`).textContent).join('、');
            
            let message = `我制作了一杯${drinkName}！`;
            if (flavorName) message += `\n口味：${flavorName}`;
            if (toppingsList) message += `\n配料：${toppingsList}`;
            message += `\n甜度：${sweetness}% | 冰量：${iceLevel}%`;

            showToast(message);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
