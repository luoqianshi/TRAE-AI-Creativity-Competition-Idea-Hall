<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR训练与识别系统</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-eye"></i>
                <span>OCR识别系统</span>
            </div>
            <nav class="nav">
                <button class="nav-btn active" data-tab="recognize">
                    <i class="fas fa-camera"></i>
                    <span>图像识别</span>
                </button>
                <button class="nav-btn" data-tab="train">
                    <i class="fas fa-network-wired"></i>
                    <span>模型训练</span>
                </button>
                <button class="nav-btn" data-tab="history">
                    <i class="fas fa-history"></i>
                    <span>历史记录</span>
                </button>
            </nav>
            <div class="status-indicator">
                <span class="status-dot online"></span>
                <span>服务在线</span>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 识别模块 -->
            <section id="recognize" class="tab-content active">
                <div class="section-header">
                    <h2>图像识别</h2>
                    <p>上传图片进行车牌、集装箱或火车号识别</p>
                </div>
                
                <div class="recognize-container">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">
                            <i class="fas fa-upload"></i>
                        </div>
                        <p>点击或拖拽上传图片</p>
                        <small>支持 JPG、PNG、BMP 格式</small>
                        <input type="file" id="imageInput" accept="image/*" hidden>
                    </div>
                    
                    <div class="preview-container" id="previewContainer" style="display: none;">
                        <img id="previewImage" src="" alt="预览">
                        <button class="remove-btn" id="removeImageBtn">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <div class="recognize-options">
                        <div class="option-group">
                            <label>识别类型</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="recognizeType" value="plate" checked>
                                    <span><i class="fas fa-car"></i> 车牌</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="recognizeType" value="container">
                                    <span><i class="fas fa-shipping-container"></i> 集装箱</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="recognizeType" value="train">
                                    <span><i class="fas fa-train"></i> 火车号</span>
                                </label>
                            </div>
                        </div>
                        <div class="option-group">
                            <label>
                                <input type="checkbox" id="detectMultiple">
                                <span>检测多个目标</span>
                            </label>
                        </div>
                    </div>
                    
                    <button class="recognize-btn" id="recognizeBtn">
                        <i class="fas fa-magic"></i>
                        <span>开始识别</span>
                    </button>
                </div>
                
                <!-- 识别结果 -->
                <div class="result-container" id="resultContainer" style="display: none;">
                    <div class="result-header">
                        <h3>识别结果</h3>
                        <div class="result-stats">
                            <span class="stat-item">
                                <i class="fas fa-clock"></i>
                                <span>耗时: <span id="inferenceTime">0</span>ms</span>
                            </span>
                        </div>
                    </div>
                    <div class="result-card" id="resultCard">
                        <!-- 结果内容将动态填充 -->
                    </div>
                </div>
            </section>

            <!-- 训练模块 -->
            <section id="train" class="tab-content">
                <div class="section-header">
                    <h2>模型训练</h2>
                    <p>训练或微调OCR识别模型</p>
                </div>
                
                <div class="train-container">
                    <div class="train-options">
                        <div class="option-group">
                            <label>训练类型</label>
                            <select id="trainType">
                                <option value="synthetic">使用合成数据</option>
                                <option value="real">使用真实数据</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>目标类型</label>
                            <select id="trainTarget">
                                <option value="plate">车牌识别</option>
                                <option value="container">集装箱识别</option>
                                <option value="train">火车号识别</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>训练参数</label>
                            <div class="param-grid">
                                <div class="param-item">
                                    <label>训练轮数</label>
                                    <input type="number" id="epochs" value="20" min="1" max="100">
                                </div>
                                <div class="param-item">
                                    <label>批次大小</label>
                                    <input type="number" id="batchSize" value="16" min="1" max="64">
                                </div>
                                <div class="param-item">
                                    <label>学习率</label>
                                    <input type="number" id="learningRate" value="0.001" step="0.0001" min="0.0001" max="0.01">
                                </div>
                                <div class="param-item">
                                    <label>样本数量</label>
                                    <input type="number" id="numSamples" value="2000" min="100" max="10000">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="train-actions">
                        <button class="train-btn" id="startTrainBtn">
                            <i class="fas fa-play"></i>
                            <span>开始训练</span>
                        </button>
                        <button class="stop-btn" id="stopTrainBtn" style="display: none;">
                            <i class="fas fa-stop"></i>
                            <span>停止训练</span>
                        </button>
                    </div>
                    
                    <!-- 训练进度 -->
                    <div class="train-progress" id="trainProgress" style="display: none;">
                        <div class="progress-header">
                            <h3>训练进度</h3>
                            <span class="progress-status" id="progressStatus">初始化...</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                            <span class="progress-text" id="progressText">0%</span>
                        </div>
                        <div class="train-metrics">
                            <div class="metric-item">
                                <label>训练损失</label>
                                <span id="trainLoss">-</span>
                            </div>
                            <div class="metric-item">
                                <label>训练准确率</label>
                                <span id="trainAccuracy">-</span>
                            </div>
                            <div class="metric-item">
                                <label>验证损失</label>
                                <span id="valLoss">-</span>
                            </div>
                            <div class="metric-item">
                                <label>验证准确率</label>
                                <span id="valAccuracy">-</span>
                            </div>
                        </div>
                        <div class="train-log" id="trainLog"></div>
                    </div>
                </div>
            </section>

            <!-- 历史记录模块 -->
            <section id="history" class="tab-content">
                <div class="section-header">
                    <h2>历史记录</h2>
                    <p>查看识别历史和训练记录</p>
                </div>
                
                <div class="history-container">
                    <div class="history-tabs">
                        <button class="history-tab active" data-history="recognize">识别记录</button>
                        <button class="history-tab" data-history="train">训练记录</button>
                    </div>
                    
                    <div class="history-list" id="historyList">
                        <div class="empty-state">
                            <i class="fas fa-history"></i>
                            <p>暂无记录</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部 -->
        <footer class="footer">
            <p>OCR训练与识别系统 v1.0</p>
            <p>基于 CRNN + CTC 实现</p>
        </footer>
    </div>

    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay" style="display: none;">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loadingText">处理中...</p>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast" id="toast">
        <i class="toast-icon"></i>
        <span class="toast-message"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
