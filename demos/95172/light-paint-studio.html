<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>光绘工坊 - 创意视觉绘画工具</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --bg: #0d0d12;
  --surface: #1a1a24;
  --surface-light: #252532;
  --border: rgba(255,255,255,0.08);
  --text: #e8e8ec;
  --text-secondary: #8a8a9a;
  --accent: #00d4ff;
  --accent-glow: rgba(0,212,255,0.3);
  --danger: #ff4757;
  --success: #2ed573;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  user-select: none;
  -webkit-user-select: none;
}

/* ===== Layout ===== */
.app {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ===== Toolbar (Left) ===== */
.toolbar {
  width: 72px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
  gap: 8px;
  z-index: 100;
  flex-shrink: 0;
}

.tool-btn {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
}

.tool-btn:hover {
  background: var(--surface-light);
  color: var(--text);
}

.tool-btn.active {
  background: rgba(0,212,255,0.12);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 20px rgba(0,212,255,0.15);
}

.tool-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.tool-separator {
  width: 32px;
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

.tool-label {
  position: absolute;
  left: 56px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--surface-light);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  border: 1px solid var(--border);
  z-index: 200;
}

.tool-btn:hover .tool-label {
  opacity: 1;
}

/* ===== Main Area ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

/* ===== Top Bar ===== */
.topbar {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 100;
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.logo-icon {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-icon svg {
  width: 20px;
  height: 20px;
  fill: #fff;
}

.top-actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-light);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.action-btn:hover {
  border-color: var(--accent);
  background: rgba(0,212,255,0.08);
}

.action-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.action-btn.primary {
  background: linear-gradient(135deg, var(--accent), #7c3aed);
  border-color: transparent;
  color: #fff;
  font-weight: 500;
}

.action-btn.primary:hover {
  box-shadow: 0 4px 20px var(--accent-glow);
}

/* ===== Canvas Container ===== */
.canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  cursor: crosshair;
  background: 
    radial-gradient(circle at 20% 50%, rgba(0,212,255,0.03) 0%, transparent 50%),
    radial-gradient(circle at 80% 50%, rgba(124,58,237,0.03) 0%, transparent 50%),
    var(--bg);
}

#main-canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* ===== Properties Panel (Right) ===== */
.properties {
  width: 260px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  z-index: 100;
  flex-shrink: 0;
  overflow-y: auto;
}

.prop-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.prop-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-secondary);
  font-weight: 500;
}

/* Color Picker */
.color-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}

.color-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  position: relative;
}

.color-cell:hover {
  transform: scale(1.1);
}

.color-cell.active {
  border-color: #fff;
  box-shadow: 0 0 12px rgba(255,255,255,0.3);
}

.color-cell.active::after {
  content: '';
  position: absolute;
  inset: 2px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.3);
}

.custom-color {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
}

.custom-color input[type="color"] {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: none;
}

.custom-color input[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.custom-color input[type="color"]::-webkit-color-swatch {
  border-radius: 8px;
  border: 2px solid var(--border);
}

.custom-color span {
  font-size: 13px;
  color: var(--text-secondary);
}

/* Sliders */
.slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.slider-row span {
  font-size: 12px;
  color: var(--text-secondary);
  min-width: 32px;
}

input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  border-radius: 2px;
  background: var(--surface-light);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 0 10px var(--accent-glow);
}

/* Blend Modes */
.mode-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}

.mode-btn {
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-light);
  color: var(--text-secondary);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}

.mode-btn:hover {
  border-color: var(--accent);
  color: var(--text);
}

.mode-btn.active {
  border-color: var(--accent);
  background: rgba(0,212,255,0.1);
  color: var(--accent);
}

/* ===== Overlay UI ===== */
.coords {
  position: absolute;
  bottom: 12px;
  left: 12px;
  font-size: 11px;
  color: var(--text-secondary);
  font-family: 'Courier New', monospace;
  pointer-events: none;
  z-index: 50;
}

.brush-preview {
  position: absolute;
  pointer-events: none;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.3);
  transform: translate(-50%, -50%);
  z-index: 50;
  display: none;
}

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-overlay.show {
  display: flex;
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  max-width: 480px;
  width: 90%;
  text-align: center;
  box-shadow: 0 25px 80px rgba(0,0,0,0.5);
}

.modal h2 {
  margin-bottom: 12px;
  font-size: 22px;
}

.modal p {
  color: var(--text-secondary);
  margin-bottom: 24px;
  font-size: 14px;
  line-height: 1.6;
}

.modal-actions {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.modal-btn {
  padding: 10px 24px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-light);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
}

.modal-btn:hover {
  border-color: var(--accent);
}

.modal-btn.danger {
  background: rgba(255,71,87,0.1);
  border-color: var(--danger);
  color: var(--danger);
}

.modal-btn.danger:hover {
  background: rgba(255,71,87,0.2);
}

/* ===== Toast ===== */
.toast-container {
  position: fixed;
  top: 72px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 1000;
  pointer-events: none;
}

.toast {
  background: var(--surface-light);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 13px;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: auto;
}

.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--accent); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

.toast.hide {
  animation: toastOut 0.3s forwards;
}

@keyframes toastOut {
  to { opacity: 0; transform: translateX(20px); }
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .toolbar { width: 56px; padding: 10px 0; }
  .tool-btn { width: 40px; height: 40px; }
  .tool-btn svg { width: 20px; height: 20px; }
  .properties { display: none; }
  .top-actions .action-btn span { display: none; }
  .modal { padding: 24px; }
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ===== Animations ===== */
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 5px var(--accent-glow); }
  50% { box-shadow: 0 0 20px var(--accent-glow); }
}

.recording .action-btn.primary {
  animation: pulse-glow 1.5s infinite;
}
</style>
</head>
<body>

<div class="app">
  <!-- Toolbar -->
  <div class="toolbar">
    <button class="tool-btn active" data-tool="particle" title="粒子笔">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="tool-label">粒子笔</span>
    </button>
    <button class="tool-btn" data-tool="light" title="光线笔">
      <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
      <span class="tool-label">光线笔</span>
    </button>
    <button class="tool-btn" data-tool="neon" title="霓虹笔">
      <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
      <span class="tool-label">霓虹笔</span>
    </button>
    <button class="tool-btn" data-tool="ink" title="水墨笔">
      <svg viewBox="0 0 24 24"><path d="M12 2c-5.33 4.55-8 8.48-8 11.8 0 4.98 3.8 8.2 8 8.2s8-3.22 8-8.2c0-3.32-2.67-7.25-8-11.8zm0 18c-2.21 0-4-1.79-4-4 0-1.45.93-3.26 2.68-5.41.6-.72 1.26-1.4 1.96-2.03.19-.16.36-.3.36-.3s.17.14.36.3c.7.63 1.36 1.31 1.96 2.03C16.07 12.74 17 14.55 17 16c0 2.21-1.79 4-4 4z"/></svg>
      <span class="tool-label">水墨笔</span>
    </button>
    <button class="tool-btn" data-tool="rainbow" title="彩虹笔">
      <svg viewBox="0 0 24 24"><path d="M12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4z" opacity=".5"/></svg>
      <span class="tool-label">彩虹笔</span>
    </button>
    <button class="tool-btn" data-tool="eraser" title="橡皮擦">
      <svg viewBox="0 0 24 24"><path d="M15.14 3c-.51 0-1.02.2-1.41.59L2.59 14.73c-.78.78-.78 2.05 0 2.83L5.03 20h7.35l8.62-8.62c.78-.78.78-2.05 0-2.83l-4.24-4.24c-.39-.39-.9-.59-1.41-.59zM7.26 18l-2.12-2.12 6.36-6.36 2.12 2.12L7.26 18z"/></svg>
      <span class="tool-label">橡皮擦</span>
    </button>

    <div class="tool-separator"></div>

    <button class="tool-btn" id="btn-undo" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      <span class="tool-label">撤销</span>
    </button>
    <button class="tool-btn" id="btn-redo" title="重做 (Ctrl+Y)">
      <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
      <span class="tool-label">重做</span>
    </button>

    <div class="tool-separator"></div>

    <button class="tool-btn" id="btn-clear" title="清空画布">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      <span class="tool-label">清空</span>
    </button>
    <button class="tool-btn" id="btn-save" title="保存作品">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span class="tool-label">保存</span>
    </button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        光绘工坊
      </div>
      <div class="top-actions">
        <button class="action-btn" id="btn-replay">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>回放</span>
        </button>
        <button class="action-btn" id="btn-record">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
          <span>录制</span>
        </button>
        <button class="action-btn primary" id="btn-export">
          <svg viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/></svg>
          <span>导出 PNG</span>
        </button>
      </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-container" id="canvas-container">
      <canvas id="main-canvas"></canvas>
      <div class="coords" id="coords">0, 0</div>
      <div class="brush-preview" id="brush-preview"></div>
    </div>
  </div>

  <!-- Properties Panel -->
  <div class="properties">
    <div class="prop-group">
      <div class="prop-label">画笔颜色</div>
      <div class="color-grid" id="color-grid">
        <div class="color-cell active" style="background:#ffffff" data-color="#ffffff"></div>
        <div class="color-cell" style="background:#ff4757" data-color="#ff4757"></div>
        <div class="color-cell" style="background:#ff6b81" data-color="#ff6b81"></div>
        <div class="color-cell" style="background:#ffa502" data-color="#ffa502"></div>
        <div class="color-cell" style="background:#eccc68" data-color="#eccc68"></div>
        <div class="color-cell" style="background:#2ed573" data-color="#2ed573"></div>
        <div class="color-cell" style="background:#1e90ff" data-color="#1e90ff"></div>
        <div class="color-cell" style="background:#00d4ff" data-color="#00d4ff"></div>
        <div class="color-cell" style="background:#3742fa" data-color="#3742fa"></div>
        <div class="color-cell" style="background:#7c3aed" data-color="#7c3aed"></div>
        <div class="color-cell" style="background:#ff9ff3" data-color="#ff9ff3"></div>
        <div class="color-cell" style="background:#f8f9fa" data-color="#f8f9fa"></div>
      </div>
      <div class="custom-color">
        <input type="color" id="color-picker" value="#00d4ff">
        <span>自定义颜色</span>
      </div>
    </div>

    <div class="prop-group">
      <div class="prop-label">画笔大小</div>
      <div class="slider-row">
        <span id="size-val">12</span>
        <input type="range" id="brush-size" min="1" max="100" value="12">
      </div>
    </div>

    <div class="prop-group">
      <div class="prop-label">不透明度</div>
      <div class="slider-row">
        <span id="opacity-val">100%</span>
        <input type="range" id="brush-opacity" min="1" max="100" value="100">
      </div>
    </div>

    <div class="prop-group">
      <div class="prop-label">混合模式</div>
      <div class="mode-grid" id="mode-grid">
        <button class="mode-btn active" data-mode="source-over">正常</button>
        <button class="mode-btn" data-mode="lighter">发光</button>
        <button class="mode-btn" data-mode="multiply">正片叠底</button>
        <button class="mode-btn" data-mode="screen">滤色</button>
        <button class="mode-btn" data-mode="overlay">叠加</button>
        <button class="mode-btn" data-mode="xor">差值</button>
      </div>
    </div>

    <div class="prop-group">
      <div class="prop-label">当前工具</div>
      <div style="font-size:14px;color:var(--text-secondary);padding:8px;background:var(--surface-light);border-radius:8px;border:1px solid var(--border);" id="tool-info">
        粒子笔 - 绘制流动的彩色粒子
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">确认</h2>
    <p id="modal-msg">确定要清空画布吗？此操作不可撤销。</p>
    <div class="modal-actions">
      <button class="modal-btn" id="modal-cancel">取消</button>
      <button class="modal-btn danger" id="modal-confirm">确定</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script>
// ============================================================
// 光绘工坊 - Light Paint Studio
// 一个完整的创意视觉绘画工具
// ============================================================

class LightPaintStudio {
  constructor() {
    this.canvas = document.getElementById('main-canvas');
    this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
    this.container = document.getElementById('canvas-container');
    
    // State
    this.isDrawing = false;
    this.currentTool = 'particle';
    this.color = '#ffffff';
    this.size = 12;
    this.opacity = 1;
    this.blendMode = 'source-over';
    this.lastX = 0;
    this.lastY = 0;
    this.hue = 0;
    this.particles = [];
    this.inkDrops = [];
    
    // History
    this.history = [];
    this.historyStep = -1;
    this.maxHistory = 30;
    
    // Recording
    this.isRecording = false;
    this.recordedStrokes = [];
    this.currentStroke = null;
    this.isReplaying = false;
    
    // Tools config
    this.toolInfo = {
      particle: '粒子笔 - 绘制流动的彩色粒子',
      light: '光线笔 - 绘制带有光晕的发光线条',
      neon: '霓虹笔 - 绘制霓虹灯管效果',
      ink: '水墨笔 - 模拟水墨晕染扩散效果',
      rainbow: '彩虹笔 - 自动循环彩虹色彩',
      eraser: '橡皮擦 - 擦除画布内容'
    };
    
    this.init();
  }
  
  init() {
    this.resize();
    window.addEventListener('resize', () => this.resize());
    
    // Canvas events
    this.canvas.addEventListener('mousedown', (e) => this.startDraw(e));
    this.canvas.addEventListener('mousemove', (e) => this.draw(e));
    this.canvas.addEventListener('mouseup', () => this.endDraw());
    this.canvas.addEventListener('mouseout', () => this.endDraw());
    
    // Touch events
    this.canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      this.startDraw({ clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });
    this.canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      this.draw({ clientX: touch.clientX, clientY: touch.clientY });
    }, { passive: false });
    this.canvas.addEventListener('touchend', () => this.endDraw());
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => this.handleKey(e));
    
    // UI bindings
    this.bindUI();
    
    // Save initial blank state
    this.saveState();
    
    // Animation loop for particles
    this.animate();
  }
  
  resize() {
    const rect = this.container.getBoundingClientRect();
    this.canvas.width = rect.width;
    this.canvas.height = rect.height;
    this.ctx.lineCap = 'round';
    this.ctx.lineJoin = 'round';
  }
  
  // ===== Drawing Core =====
  startDraw(e) {
    if (this.isReplaying) return;
    
    this.isDrawing = true;
    const rect = this.canvas.getBoundingClientRect();
    this.lastX = e.clientX - rect.left;
    this.lastY = e.clientY - rect.top;
    
    // For recording
    this.currentStroke = {
      tool: this.currentTool,
      color: this.color,
      size: this.size,
      opacity: this.opacity,
      blendMode: this.blendMode,
      points: [{ x: this.lastX, y: this.lastY, time: Date.now() }]
    };
    
    this.ctx.globalAlpha = this.opacity;
    this.ctx.globalCompositeOperation = this.currentTool === 'eraser' ? 'destination-out' : this.blendMode;
    
    // Tool-specific init
    if (this.currentTool === 'ink') {
      this.addInkDrop(this.lastX, this.lastY);
    }
  }
  
  draw(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    // Update coords display
    document.getElementById('coords').textContent = `${Math.round(x)}, ${Math.round(y)}`;
    
    // Update brush preview
    const preview = document.getElementById('brush-preview');
    preview.style.left = e.clientX + 'px';
    preview.style.top = e.clientY + 'px';
    preview.style.width = this.size + 'px';
    preview.style.height = this.size + 'px';
    preview.style.borderColor = this.currentTool === 'eraser' ? '#ff4757' : this.color;
    preview.style.display = 'block';
    
    if (!this.isDrawing) return;
    
    // Record point
    if (this.currentStroke) {
      this.currentStroke.points.push({ x, y, time: Date.now() });
    }
    
    switch (this.currentTool) {
      case 'particle': this.drawParticle(x, y); break;
      case 'light': this.drawLight(x, y); break;
      case 'neon': this.drawNeon(x, y); break;
      case 'ink': this.drawInk(x, y); break;
      case 'rainbow': this.drawRainbow(x, y); break;
      case 'eraser': this.drawEraser(x, y); break;
    }
    
    this.lastX = x;
    this.lastY = y;
  }
  
  endDraw() {
    if (!this.isDrawing) return;
    this.isDrawing = false;
    this.ctx.beginPath();
    
    // Save stroke to recording
    if (this.currentStroke && this.currentStroke.points.length > 1) {
      this.recordedStrokes.push(this.currentStroke);
    }
    this.currentStroke = null;
    
    // Save state for undo
    setTimeout(() => this.saveState(), 10);
  }
  
  // ===== Brush Engines =====
  drawParticle(x, y) {
    const dx = x - this.lastX;
    const dy = y - this.lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const steps = Math.max(1, Math.floor(dist / 2));
    
    for (let i = 0; i < steps; i++) {
      const t = i / steps;
      const px = this.lastX + dx * t;
      const py = this.lastY + dy * t;
      
      // Spawn particles
      for (let j = 0; j < 3; j++) {
        this.particles.push({
          x: px + (Math.random() - 0.5) * this.size,
          y: py + (Math.random() - 0.5) * this.size,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2,
          life: 1,
          decay: 0.02 + Math.random() * 0.03,
          size: Math.random() * this.size * 0.5 + 2,
          color: this.color
        });
      }
    }
  }
  
  drawLight(x, y) {
    // Main line
    this.ctx.strokeStyle = this.color;
    this.ctx.lineWidth = this.size;
    this.ctx.shadowBlur = this.size * 2;
    this.ctx.shadowColor = this.color;
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.stroke();
    
    // Core highlight
    this.ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    this.ctx.lineWidth = this.size * 0.3;
    this.ctx.shadowBlur = 0;
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.stroke();
  }
  
  drawNeon(x, y) {
    // Outer glow
    this.ctx.strokeStyle = this.color;
    this.ctx.lineWidth = this.size * 1.5;
    this.ctx.shadowBlur = this.size * 3;
    this.ctx.shadowColor = this.color;
    this.ctx.globalAlpha = this.opacity * 0.3;
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.stroke();
    
    // Inner bright
    this.ctx.lineWidth = this.size * 0.5;
    this.ctx.globalAlpha = this.opacity;
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.stroke();
    
    // White core
    this.ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    this.ctx.lineWidth = this.size * 0.2;
    this.ctx.shadowBlur = 0;
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.stroke();
  }
  
  drawInk(x, y) {
    const dx = x - this.lastX;
    const dy = y - this.lastY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist > this.size * 2) {
      this.addInkDrop(x, y);
    }
    
    // Draw connecting line with varying opacity
    this.ctx.strokeStyle = this.color;
    this.ctx.lineWidth = this.size * 0.5;
    this.ctx.shadowBlur = 0;
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.stroke();
  }
  
  addInkDrop(x, y) {
    this.inkDrops.push({
      x, y,
      radius: 0,
      maxRadius: this.size * (2 + Math.random() * 3),
      color: this.color,
      opacity: this.opacity * 0.3,
      growing: true,
      growSpeed: 0.5 + Math.random() * 1
    });
  }
  
  drawRainbow(x, y) {
    this.hue = (this.hue + 2) % 360;
    const color = `hsl(${this.hue}, 100%, 60%)`;
    
    this.ctx.strokeStyle = color;
    this.ctx.lineWidth = this.size;
    this.ctx.shadowBlur = this.size;
    this.ctx.shadowColor = color;
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.stroke();
  }
  
  drawEraser(x, y) {
    this.ctx.strokeStyle = 'rgba(0,0,0,1)';
    this.ctx.lineWidth = this.size * 2;
    this.ctx.shadowBlur = 0;
    this.ctx.beginPath();
    this.ctx.moveTo(this.lastX, this.lastY);
    this.ctx.lineTo(x, y);
    this.ctx.stroke();
  }
  
  // ===== Animation Loop =====
  animate() {
    // Update and draw particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      p.vx *= 0.98;
      p.vy *= 0.98;
      
      if (p.life <= 0) {
        this.particles.splice(i, 1);
        continue;
      }
      
      this.ctx.globalCompositeOperation = 'lighter';
      this.ctx.globalAlpha = p.life * this.opacity;
      this.ctx.fillStyle = p.color;
      this.ctx.shadowBlur = p.size;
      this.ctx.shadowColor = p.color;
      this.ctx.beginPath();
      this.ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      this.ctx.fill();
    }
    
    // Update ink drops
    for (let i = this.inkDrops.length - 1; i >= 0; i--) {
      const drop = this.inkDrops[i];
      
      if (drop.growing) {
        drop.radius += drop.growSpeed;
        if (drop.radius >= drop.maxRadius) {
          drop.growing = false;
        }
      } else {
        drop.opacity -= 0.005;
      }
      
      if (drop.opacity <= 0) {
        this.inkDrops.splice(i, 1);
        continue;
      }
      
      this.ctx.globalCompositeOperation = this.blendMode;
      this.ctx.globalAlpha = drop.opacity;
      this.ctx.fillStyle = drop.color;
      this.ctx.shadowBlur = 0;
      this.ctx.beginPath();
      this.ctx.arc(drop.x, drop.y, drop.radius, 0, Math.PI * 2);
      this.ctx.fill();
    }
    
    this.ctx.globalCompositeOperation = 'source-over';
    this.ctx.globalAlpha = 1;
    this.ctx.shadowBlur = 0;
    
    requestAnimationFrame(() => this.animate());
  }
  
  // ===== History =====
  saveState() {
    if (this.historyStep < this.history.length - 1) {
      this.history = this.history.slice(0, this.historyStep + 1);
    }
    
    this.history.push(this.canvas.toDataURL());
    if (this.history.length > this.maxHistory) {
      this.history.shift();
    } else {
      this.historyStep++;
    }
  }
  
  undo() {
    if (this.historyStep > 0) {
      this.historyStep--;
      this.restoreState(this.history[this.historyStep]);
      this.showToast('已撤销', 'info');
    }
  }
  
  redo() {
    if (this.historyStep < this.history.length - 1) {
      this.historyStep++;
      this.restoreState(this.history[this.historyStep]);
      this.showToast('已重做', 'info');
    }
  }
  
  restoreState(dataUrl) {
    const img = new Image();
    img.onload = () => {
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      this.ctx.drawImage(img, 0, 0);
    };
    img.src = dataUrl;
  }
  
  // ===== Recording & Replay =====
  toggleRecord() {
    this.isRecording = !this.isRecording;
    const btn = document.getElementById('btn-record');
    
    if (this.isRecording) {
      this.recordedStrokes = [];
      btn.classList.add('recording');
      btn.querySelector('span').textContent = '停止';
      this.showToast('开始录制绘画过程', 'info');
    } else {
      btn.classList.remove('recording');
      btn.querySelector('span').textContent = '录制';
      this.showToast(`录制完成！共 ${this.recordedStrokes.length} 笔`, 'success');
    }
  }
  
  async replay() {
    if (this.isReplaying || this.recordedStrokes.length === 0) {
      if (this.recordedStrokes.length === 0) {
        this.showToast('暂无录制内容，请先录制', 'error');
      }
      return;
    }
    
    this.isReplaying = true;
    this.showToast('开始回放...', 'info');
    
    // Clear and redraw from start
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    
    for (const stroke of this.recordedStrokes) {
      this.currentTool = stroke.tool;
      this.color = stroke.color;
      this.size = stroke.size;
      this.opacity = stroke.opacity;
      this.blendMode = stroke.blendMode;
      
      this.ctx.globalAlpha = this.opacity;
      this.ctx.globalCompositeOperation = this.currentTool === 'eraser' ? 'destination-out' : this.blendMode;
      
      for (let i = 1; i < stroke.points.length; i++) {
        const p1 = stroke.points[i - 1];
        const p2 = stroke.points[i];
        this.lastX = p1.x;
        this.lastY = p1.y;
        
        switch (this.currentTool) {
          case 'particle': this.drawParticle(p2.x, p2.y); break;
          case 'light': this.drawLight(p2.x, p2.y); break;
          case 'neon': this.drawNeon(p2.x, p2.y); break;
          case 'ink': this.drawInk(p2.x, p2.y); break;
          case 'rainbow': this.drawRainbow(p2.x, p2.y); break;
          case 'eraser': this.drawEraser(p2.x, p2.y); break;
        }
        
        await new Promise(r => setTimeout(r, 10));
      }
    }
    
    this.isReplaying = false;
    this.showToast('回放完成', 'success');
  }
  
  // ===== Export =====
  exportPNG() {
    const link = document.createElement('a');
    link.download = `光绘工坊_${new Date().getTime()}.png`;
    link.href = this.canvas.toDataURL('image/png');
    link.click();
    this.showToast('作品已保存', 'success');
  }
  
  clear() {
    this.showModal('清空画布', '确定要清空画布吗？此操作不可撤销。', () => {
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      this.particles = [];
      this.inkDrops = [];
      this.recordedStrokes = [];
      this.saveState();
      this.showToast('画布已清空', 'info');
    });
  }
  
  // ===== UI Bindings =====
  bindUI() {
    // Tool buttons
    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.currentTool = btn.dataset.tool;
        document.getElementById('tool-info').textContent = this.toolInfo[this.currentTool];
      });
    });
    
    // Color grid
    document.querySelectorAll('.color-cell').forEach(cell => {
      cell.addEventListener('click', () => {
        document.querySelectorAll('.color-cell').forEach(c => c.classList.remove('active'));
        cell.classList.add('active');
        this.color = cell.dataset.color;
        document.getElementById('color-picker').value = this.color;
      });
    });
    
    // Custom color
    document.getElementById('color-picker').addEventListener('input', (e) => {
      this.color = e.target.value;
      document.querySelectorAll('.color-cell').forEach(c => c.classList.remove('active'));
    });
    
    // Brush size
    document.getElementById('brush-size').addEventListener('input', (e) => {
      this.size = parseInt(e.target.value);
      document.getElementById('size-val').textContent = this.size;
    });
    
    // Opacity
    document.getElementById('brush-opacity').addEventListener('input', (e) => {
      this.opacity = parseInt(e.target.value) / 100;
      document.getElementById('opacity-val').textContent = e.target.value + '%';
    });
    
    // Blend modes
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.blendMode = btn.dataset.mode;
      });
    });
    
    // Action buttons
    document.getElementById('btn-undo').addEventListener('click', () => this.undo());
    document.getElementById('btn-redo').addEventListener('click', () => this.redo());
    document.getElementById('btn-clear').addEventListener('click', () => this.clear());
    document.getElementById('btn-save').addEventListener('click', () => this.exportPNG());
    document.getElementById('btn-export').addEventListener('click', () => this.exportPNG());
    document.getElementById('btn-record').addEventListener('click', () => this.toggleRecord());
    document.getElementById('btn-replay').addEventListener('click', () => this.replay());
    
    // Modal
    document.getElementById('modal-cancel').addEventListener('click', () => this.hideModal());
  }
  
  // ===== Keyboard Shortcuts =====
  handleKey(e) {
    if (e.ctrlKey || e.metaKey) {
      switch (e.key.toLowerCase()) {
        case 'z': e.preventDefault(); this.undo(); break;
        case 'y': e.preventDefault(); this.redo(); break;
        case 's': e.preventDefault(); this.exportPNG(); break;
      }
    }
    
    switch (e.key.toLowerCase()) {
      case 'b': this.selectTool('particle'); break;
      case 'l': this.selectTool('light'); break;
      case 'n': this.selectTool('neon'); break;
      case 'i': this.selectTool('ink'); break;
      case 'r': this.selectTool('rainbow'); break;
      case 'e': this.selectTool('eraser'); break;
      case '[': this.adjustSize(-2); break;
      case ']': this.adjustSize(2); break;
    }
  }
  
  selectTool(tool) {
    const btn = document.querySelector(`.tool-btn[data-tool="${tool}"]`);
    if (btn) btn.click();
  }
  
  adjustSize(delta) {
    const slider = document.getElementById('brush-size');
    const newVal = Math.max(1, Math.min(100, parseInt(slider.value) + delta));
    slider.value = newVal;
    slider.dispatchEvent(new Event('input'));
  }
  
  // ===== Modal =====
  showModal(title, msg, onConfirm) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-msg').textContent = msg;
    document.getElementById('modal').classList.add('show');
    
    const confirmBtn = document.getElementById('modal-confirm');
    confirmBtn.onclick = () => {
      this.hideModal();
      onConfirm();
    };
  }
  
  hideModal() {
    document.getElementById('modal').classList.remove('show');
  }
  
  // ===== Toast =====
  showToast(msg, type = 'info') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = msg;
    container.appendChild(toast);
    
    setTimeout(() => {
      toast.classList.add('hide');
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  }
}

// Initialize
window.addEventListener('DOMContentLoaded', () => {
  new LightPaintStudio();
});
</script>

</body>
</html>
