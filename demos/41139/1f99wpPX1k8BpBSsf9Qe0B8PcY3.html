<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九色鹿心灵奇旅 — AI情绪自愈交互绘本</title>
  <!-- 字体引入 -->
  <style>
    @font-face {
      font-family: 'Bricolage';
      src: url('./_shared/fonts/BricolageGrotesque-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Bricolage';
      src: url('./_shared/fonts/BricolageGrotesque-Bold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
  </style>

  <!-- ========== 全局样式 ========== -->
  <style>
    /* === 敦煌色彩系统 === */
    :root {
      --bg: #1a0f0a;
      --bg2: #2c1810;
      --ink: #f3e8d0;
      --muted: #a89880;
      --rule: #5c4a32;
      --accent: #c9a84c;
      --accent2: #b5453a;
      --green: #2ecc71;
      --blue: #3498db;
      --purple: #9b59b6;
      --font: 'Bricolage', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', serif;
      /* 九色鹿专用 */
      --deer-c1: #e74c3c; --deer-c2: #e67e22; --deer-c3: #f1c40f;
      --deer-c4: #2ecc71; --deer-c5: #1abc9c; --deer-c6: #3498db;
      --deer-c7: #9b59b6; --deer-c8: #e91e63; --deer-c9: #ff6f61;
      --deer-body: #fef9ef;
      --deer-outline: #8b6914;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.7;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* === 全局动画关键帧 === */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(201,168,76,0.3); } 50% { box-shadow: 0 0 50px rgba(201,168,76,0.6), 0 0 80px rgba(201,168,76,0.2); } }
    @keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
    @keyframes sparkle { 0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(180deg); } }
    @keyframes breatheIn { 0% { transform: scale(0.5); opacity: 0.3; border-color: rgba(201,168,76,0.3); } 100% { transform: scale(1); opacity: 1; border-color: var(--accent); } }
    @keyframes breatheHold { 0%, 100% { transform: scale(1); opacity: 1; } 50% { opacity: 0.85; } }
    @keyframes breatheOut { 0% { transform: scale(1); opacity: 1; border-color: var(--accent); } 100% { transform: scale(0.5); opacity: 0.3; border-color: rgba(201,168,76,0.3); } }
    @keyframes rotateGlow { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes particleDrift { 0% { opacity: 0; transform: translateY(0) translateX(0); } 20% { opacity: 0.8; } 80% { opacity: 0.4; } 100% { opacity: 0; transform: translateY(-120px) translateX(30px); } }
    @keyframes cloudDrift { 0% { transform: translateX(-10%); } 100% { transform: translateX(110%); } }
    @keyframes deerBreathe { 0%, 100% { transform: translateX(-50%) scaleY(1); } 50% { transform: translateX(-50%) scaleY(1.025); } }
    @keyframes auraRotate { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    @keyframes particleFloat { 0% { opacity: 0; transform: translateY(0) scale(0.5); } 30% { opacity: 0.9; } 70% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-50px) scale(1.2); } }
    @keyframes cardFlip { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(180deg); } }
    @keyframes bloomIn { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes typewriter { from { width: 0; } to { width: 100%; } }
    @keyframes blink { 0%, 100% { border-color: var(--accent); } 50% { border-color: transparent; } }
    @keyframes ripple { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(2.5); opacity: 0; } }
    @keyframes starTwinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

    /* === 页面容器 === */
    .app { width: 100%; min-height: 100vh; position: relative; }
    .page-view {
      display: none;
      width: 100%;
      min-height: 100vh;
      position: relative;
    }
    .page-view.active { display: flex; flex-direction: column; animation: fadeIn 0.7s ease; }

    /* === 进度条 === */
    .progress-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 4px;
      z-index: 100; background: rgba(255,255,255,0.08);
      display: none;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
      background-size: 200% 100%;
      animation: shimmer 3s linear infinite;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 0 2px 2px 0;
    }

    /* === 按钮通用 === */
    .btn-primary {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.85rem 2.2rem;
      background: linear-gradient(135deg, var(--accent), #d4a843, var(--accent));
      background-size: 200% 200%;
      animation: shimmer 4s ease infinite;
      color: var(--bg); border: none; border-radius: 999px;
      font-family: var(--font); font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(201,168,76,0.3);
      position: relative; z-index: 1;
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(201,168,76,0.5); }
    .btn-primary:active { transform: translateY(-1px); }

    .btn-secondary {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.65rem 1.6rem;
      background: transparent; color: var(--accent);
      border: 1.5px solid rgba(201,168,76,0.4); border-radius: 999px;
      font-family: var(--font); font-size: 0.9rem; cursor: pointer;
      transition: all 0.3s;
    }
    .btn-secondary:hover { background: rgba(201,168,76,0.1); border-color: var(--accent); }

    /* === 敦煌壁画纹理叠加 === */
    .dunhuang-texture::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 1;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 4px, rgba(139,105,20,0.025) 4px, rgba(139,105,20,0.025) 5px),
        repeating-linear-gradient(90deg, transparent, transparent 6px, rgba(139,105,20,0.015) 6px, rgba(139,105,20,0.015) 7px);
    }

    /* === 金色粒子容器 === */
    .golden-particles {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
    }
    .golden-particle {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: particleDrift linear infinite;
    }

    /* === 祥云装饰 === */
    .cloud {
      position: absolute; pointer-events: none; opacity: 0.15; z-index: 0;
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute; background: var(--accent); border-radius: 50%;
    }
    .cloud::before { width: 80px; height: 35px; top: 15px; left: 0; }
    .cloud::after { width: 110px; height: 40px; top: 0; right: 0; }
    .cloud-1 { top: 8%; animation: cloudDrift 25s linear infinite; }
    .cloud-2 { top: 18%; animation: cloudDrift 35s linear infinite; animation-delay: -10s; }
    .cloud-3 { top: 35%; animation: cloudDrift 30s linear infinite; animation-delay: -20s; }
    .cloud-4 { top: 55%; animation: cloudDrift 40s linear infinite; animation-delay: -5s; }

    /* === 星星背景 === */
    .stars-bg {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(1.5px 1.5px at 8% 12%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 22% 6%, #ffd 50%, transparent 100%),
        radial-gradient(2px 2px at 38% 20%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 52% 4%, #ffd 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 68% 15%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 82% 9%, #fff 50%, transparent 100%),
        radial-gradient(2px 2px at 12% 30%, #ffd 50%, transparent 100%),
        radial-gradient(1px 1px at 45% 28%, #fff 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 75% 25%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 90% 18%, #ffd 50%, transparent 100%),
        radial-gradient(1px 1px at 33% 38%, #fff 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 60% 35%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 5% 45%, #ffd 50%, transparent 100%),
        radial-gradient(1px 1px at 95% 40%, #fff 50%, transparent 100%);
      animation: starTwinkle 4s ease-in-out infinite alternate;
    }

    /* === 沙丘剪影 === */
    .dune-silhouette {
      position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 350px 70px at 15% 100%, rgba(232,213,183,0.25) 0%, transparent 100%),
        radial-gradient(ellipse 500px 90px at 55% 100%, rgba(232,213,183,0.2) 0%, transparent 100%),
        radial-gradient(ellipse 300px 60px at 85% 100%, rgba(232,213,183,0.15) 0%, transparent 100%);
    }

    /* ================================================================
       九色鹿纯CSS形象
       ================================================================ */
    .nine-color-deer {
      position: relative; width: 280px; height: 320px; margin: 0 auto;
    }

    /* 鹿身体 */
    .deer-body {
      position: absolute; width: 140px; height: 90px;
      background: var(--deer-body);
      border-radius: 50% 50% 45% 45%;
      bottom: 80px; left: 50%; transform: translateX(-50%);
      border: 2.5px solid var(--deer-outline);
      box-shadow: inset 0 0 20px rgba(201,168,76,0.15), 0 4px 15px rgba(0,0,0,0.1);
      animation: deerBreathe 4s ease-in-out infinite;
      overflow: hidden;
    }
    /* 九色花纹 */
    .deer-body::before {
      content: ''; position: absolute; width: 100%; height: 100%; border-radius: inherit;
      background:
        radial-gradient(circle 8px at 25% 35%, var(--deer-c1) 70%, transparent 71%),
        radial-gradient(circle 6px at 50% 25%, var(--deer-c6) 70%, transparent 71%),
        radial-gradient(circle 7px at 75% 35%, var(--deer-c3) 70%, transparent 71%),
        radial-gradient(circle 6px at 35% 60%, var(--deer-c4) 70%, transparent 71%),
        radial-gradient(circle 8px at 60% 55%, var(--deer-c7) 70%, transparent 71%),
        radial-gradient(circle 5px at 20% 50%, var(--deer-c2) 70%, transparent 71%),
        radial-gradient(circle 6px at 80% 55%, var(--deer-c8) 70%, transparent 71%),
        radial-gradient(circle 5px at 45% 70%, var(--deer-c5) 70%, transparent 71%),
        radial-gradient(circle 6px at 65% 40%, var(--deer-c9) 70%, transparent 71%);
      opacity: 0.85;
    }

    /* 鹿脖子 */
    .deer-neck {
      position: absolute; width: 40px; height: 70px;
      background: var(--deer-body); border: 2.5px solid var(--deer-outline);
      border-radius: 20px 20px 10px 10px;
      bottom: 155px; left: 50%; transform: translateX(-50%);
      box-shadow: inset 0 0 10px rgba(201,168,76,0.1);
    }

    /* 鹿头 */
    .deer-head {
      position: absolute; width: 55px; height: 50px;
      background: var(--deer-body); border: 2.5px solid var(--deer-outline);
      border-radius: 50% 50% 40% 40%;
      bottom: 210px; left: 50%; transform: translateX(-50%);
      box-shadow: inset 0 0 15px rgba(201,168,76,0.12), 0 2px 8px rgba(0,0,0,0.08);
    }

    /* 鹿眼睛 */
    .deer-eye {
      position: absolute; width: 10px; height: 12px;
      background: var(--bg2); border-radius: 50%;
      bottom: 225px; left: calc(50% + 8px);
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.3);
    }
    .deer-eye::after {
      content: ''; position: absolute; width: 4px; height: 4px;
      background: white; border-radius: 50%; top: 2px; right: 2px;
    }

    /* 鹿耳朵 */
    .deer-ear {
      position: absolute; width: 18px; height: 30px;
      background: var(--deer-body); border: 2.5px solid var(--deer-outline);
      border-radius: 50% 50% 30% 30%; bottom: 245px;
    }
    .deer-ear--left { left: calc(50% - 32px); transform: rotate(-15deg); }
    .deer-ear--right { right: calc(50% - 32px); transform: rotate(15deg); }
    .deer-ear::after {
      content: ''; position: absolute; width: 8px; height: 16px;
      background: linear-gradient(135deg, var(--deer-c8), var(--deer-c1));
      border-radius: 50%; top: 6px; left: 50%; transform: translateX(-50%); opacity: 0.6;
    }

    /* 鹿角 - 祥云风格 */
    .deer-antler {
      position: absolute; bottom: 255px; width: 6px; height: 45px;
      background: var(--accent); border-radius: 3px;
    }
    .deer-antler::before, .deer-antler::after {
      content: ''; position: absolute; width: 6px; height: 25px;
      background: var(--accent); border-radius: 3px;
    }
    .deer-antler--left { left: calc(50% - 20px); transform: rotate(-12deg); }
    .deer-antler--left::before { top: 5px; left: -14px; transform: rotate(-35deg); border-radius: 50% 50% 3px 3px; }
    .deer-antler--left::after { top: 18px; left: -12px; transform: rotate(-25deg); }
    .deer-antler--right { right: calc(50% - 20px); transform: rotate(12deg); }
    .deer-antler--right::before { top: 5px; right: -14px; transform: rotate(35deg); border-radius: 50% 50% 3px 3px; }
    .deer-antler--right::after { top: 18px; right: -12px; transform: rotate(25deg); }

    /* 鹿腿 */
    .deer-leg {
      position: absolute; width: 14px; height: 60px;
      background: var(--deer-body); border: 2.5px solid var(--deer-outline);
      border-radius: 7px 7px 5px 5px; bottom: 20px;
    }
    .deer-leg::after {
      content: ''; position: absolute; bottom: 0; width: 16px; height: 8px;
      background: var(--accent); border-radius: 3px 3px 5px 5px; left: -1px;
    }
    .deer-leg--fl { left: calc(50% - 45px); }
    .deer-leg--fr { left: calc(50% - 20px); }
    .deer-leg--bl { right: calc(50% - 20px); }
    .deer-leg--br { right: calc(50% - 45px); }

    /* 鹿尾 */
    .deer-tail {
      position: absolute; width: 20px; height: 25px;
      background: var(--deer-body); border: 2.5px solid var(--deer-outline);
      border-radius: 0 50% 50% 0; bottom: 100px;
      right: calc(50% - 80px); transform: rotate(-10deg);
    }
    .deer-tail::after {
      content: ''; position: absolute; width: 12px; height: 12px;
      background: radial-gradient(circle, var(--deer-c3), var(--deer-c2));
      border-radius: 50%; top: 2px; right: 2px;
    }

    /* 九色光环 */
    .deer-aura {
      position: absolute; width: 220px; height: 220px; border-radius: 50%;
      bottom: 50px; left: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(231,76,60,0.1), rgba(230,126,34,0.1), rgba(241,196,15,0.1),
        rgba(46,204,113,0.1), rgba(26,188,156,0.1), rgba(52,152,219,0.1),
        rgba(155,89,182,0.1), rgba(233,30,99,0.1), rgba(255,111,97,0.1),
        rgba(231,76,60,0.1)
      );
      animation: auraRotate 12s linear infinite;
      filter: blur(18px); pointer-events: none;
    }

    /* 鹿身粒子 */
    .deer-particles { position: absolute; width: 100%; height: 100%; pointer-events: none; }
    .deer-particle {
      position: absolute; width: 5px; height: 5px; border-radius: 50%;
      animation: particleFloat 4s ease-in-out infinite; opacity: 0;
    }
    .deer-particle:nth-child(1) { background: var(--deer-c1); left: 25%; top: 35%; animation-delay: 0s; }
    .deer-particle:nth-child(2) { background: var(--deer-c6); left: 65%; top: 25%; animation-delay: 0.8s; }
    .deer-particle:nth-child(3) { background: var(--deer-c3); left: 40%; top: 55%; animation-delay: 1.6s; }
    .deer-particle:nth-child(4) { background: var(--deer-c4); left: 75%; top: 45%; animation-delay: 2.4s; }
    .deer-particle:nth-child(5) { background: var(--deer-c7); left: 20%; top: 60%; animation-delay: 3.2s; }
    .deer-particle:nth-child(6) { background: var(--deer-c8); left: 55%; top: 15%; animation-delay: 1.2s; }
    .deer-particle:nth-child(7) { background: var(--deer-c2); left: 80%; top: 65%; animation-delay: 2.8s; }

    /* 倾听姿态 */
    .nine-color-deer--listening .deer-head { transform: translateX(-50%) rotate(5deg); bottom: 205px; }
    .nine-color-deer--listening .deer-neck { height: 65px; bottom: 150px; transform: translateX(-50%) rotate(3deg); }

    /* ================================================================
       首页 / 倾听室
       ================================================================ */
    .home-page {
      background:
        radial-gradient(ellipse at 50% 20%, rgba(201,168,76,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 80%, rgba(181,69,58,0.08) 0%, transparent 40%),
        radial-gradient(ellipse at 80% 70%, rgba(26,58,92,0.15) 0%, transparent 40%),
        linear-gradient(180deg, #0c1445 0%, #1a237e 25%, #1e3a5f 45%, #2c1810 65%, #1a0f0a 100%);
      align-items: center; justify-content: center; text-align: center;
      padding: 2rem 1.5rem; position: relative; overflow: hidden;
    }

    .home-logo { position: relative; z-index: 2; margin-bottom: 1.2rem; }
    .home-logo h1 {
      font-size: 2.6rem; font-weight: 700; color: var(--accent);
      text-shadow: 0 0 40px rgba(201,168,76,0.4), 0 2px 4px rgba(0,0,0,0.5);
      letter-spacing: 0.12em; margin-bottom: 0.4rem;
    }
    .home-logo .subtitle {
      font-size: 1rem; color: var(--muted); font-weight: 400;
      letter-spacing: 0.08em;
    }

    .deer-container {
      position: relative; z-index: 2; margin: 1rem auto;
      animation: float 5s ease-in-out infinite;
    }

    /* 对话气泡 */
    .deer-speech-bubble {
      position: relative; z-index: 2;
      background: rgba(201,168,76,0.1);
      border: 1.5px solid rgba(201,168,76,0.25);
      border-radius: 18px; padding: 1rem 1.5rem;
      max-width: 420px; margin: 0 auto 1.5rem;
      font-size: 0.95rem; color: var(--ink); line-height: 1.7;
      backdrop-filter: blur(8px);
    }
    .deer-speech-bubble::after {
      content: ''; position: absolute; bottom: -10px; left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent; border-right: 10px solid transparent;
      border-top: 10px solid rgba(201,168,76,0.25);
    }
    .deer-speech-bubble .typing-cursor {
      display: inline-block; width: 2px; height: 1em;
      background: var(--accent); margin-left: 2px;
      animation: blink 0.8s step-end infinite; vertical-align: text-bottom;
    }

    /* 情绪标签 */
    .emotion-tags {
      display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;
      margin: 0.8rem 0; position: relative; z-index: 2;
    }
    .emotion-tag {
      font-size: 0.82rem; padding: 0.35rem 0.9rem;
      border-radius: 999px; border: 1.5px solid var(--rule);
      background: rgba(44,24,16,0.5); color: var(--muted);
      cursor: pointer; transition: all 0.3s; backdrop-filter: blur(4px);
    }
    .emotion-tag:hover, .emotion-tag.selected {
      border-color: var(--accent); color: var(--accent);
      background: rgba(201,168,76,0.12);
      box-shadow: 0 0 12px rgba(201,168,76,0.15);
    }

    /* 文本输入 */
    .input-area {
      position: relative; z-index: 2; width: 100%; max-width: 500px; margin: 0 auto;
    }
    .input-area textarea {
      width: 100%; min-height: 90px;
      background: rgba(44,24,16,0.7); border: 1.5px solid var(--rule);
      border-radius: 14px; padding: 1rem; color: var(--ink);
      font-family: var(--font); font-size: 0.95rem; resize: none; outline: none;
      transition: all 0.3s; backdrop-filter: blur(4px);
    }
    .input-area textarea::placeholder { color: var(--muted); }
    .input-area textarea:focus { border-color: var(--accent); box-shadow: 0 0 20px rgba(201,168,76,0.15); }

    .home-buttons {
      margin-top: 1.5rem; position: relative; z-index: 2;
      display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
    }

    /* ================================================================
       绘本页面
       ================================================================ */
    .storybook-page { position: relative; overflow: hidden; }

    .story-scene {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      transition: background 1.2s ease;
    }

    .scene-particles {
      position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1;
    }
    .scene-particle {
      position: absolute; border-radius: 50%; opacity: 0;
      animation: sparkle 3s ease-in-out infinite;
    }

    .story-content {
      position: relative; z-index: 2;
      flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
      padding: 2rem 2rem 6rem; max-width: 640px; margin: 0 auto; width: 100%;
    }
    /* 内容区域深色渐变遮罩，确保任何场景背景下文字都清晰可读 */
    .story-content::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(26,15,10,0.5) 0%,
        rgba(26,15,10,0.65) 30%,
        rgba(26,15,10,0.8) 70%,
        rgba(26,15,10,0.92) 100%);
      pointer-events: none; z-index: -1;
      border-radius: 0;
    }

    .story-chapter {
      font-size: 0.72rem; color: var(--accent); text-transform: uppercase;
      letter-spacing: 0.18em; margin-bottom: 0.4rem; opacity: 0.75;
    }
    .story-title {
      font-size: 1.7rem; font-weight: 700; color: var(--ink);
      margin-bottom: 1rem; text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      animation: slideDown 0.6s ease;
    }
    .story-narrative {
      font-size: 0.95rem; color: rgba(243,232,208,0.92);
      margin-bottom: 1rem; line-height: 1.85;
      animation: slideUp 0.7s ease;
    }

    /* 角色对话 */
    .story-dialogue {
      background: rgba(0,0,0,0.35); backdrop-filter: blur(6px);
      border-left: 3px solid var(--accent); border-radius: 0 14px 14px 0;
      padding: 0.85rem 1.1rem; margin-bottom: 0.7rem;
      animation: slideUp 0.8s ease;
    }
    .story-dialogue .speaker {
      font-size: 0.78rem; font-weight: 700; margin-bottom: 0.2rem;
    }
    .story-dialogue .speaker--deer { color: var(--accent); }
    .story-dialogue .speaker--boy { color: #7ec8e3; }
    .story-dialogue .speaker--monster { color: var(--purple); }
    .story-dialogue .dialogue-text {
      font-size: 0.9rem; color: var(--ink); font-style: italic; line-height: 1.7;
    }

    /* 互动面板 */
    .interaction-area {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      background: rgba(26,15,10,0.75); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(201,168,76,0.15);
      padding: 1.2rem 1.5rem 1.5rem;
      transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 55vh; overflow-y: auto;
    }
    .interaction-area.show { transform: translateY(0); }

    .interaction-prompt {
      font-size: 0.9rem; color: var(--accent); margin-bottom: 1rem;
      text-align: center; font-weight: 600;
    }

    .interaction-response {
      text-align: center; font-size: 0.9rem; color: var(--ink);
      padding: 1rem; background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.15); border-radius: 14px;
      margin-top: 1rem; display: none; line-height: 1.7;
    }
    .interaction-response.show { display: block; animation: fadeInScale 0.5s ease; }

    /* 选项按钮 */
    .interaction-options { display: flex; flex-direction: column; gap: 0.5rem; max-width: 500px; margin: 0 auto; }
    .interaction-option {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.8rem 1rem; background: rgba(44,24,16,0.5);
      border: 1.5px solid var(--rule); border-radius: 14px;
      color: var(--ink); font-family: var(--font); font-size: 0.9rem;
      cursor: pointer; transition: all 0.3s; backdrop-filter: blur(4px);
    }
    .interaction-option:hover {
      border-color: var(--accent); background: rgba(201,168,76,0.1);
      transform: translateX(6px);
    }
    .interaction-option.selected {
      border-color: var(--accent); background: rgba(201,168,76,0.15);
      box-shadow: 0 0 15px rgba(201,168,76,0.15);
    }
    .interaction-option.disabled { opacity: 0.35; pointer-events: none; }
    .interaction-option .opt-emoji { font-size: 1.3rem; }

    /* 呼吸练习 */
    .breath-container { text-align: center; padding: 1rem 0; }
    .breath-circle {
      width: 130px; height: 130px; border-radius: 50%;
      border: 3px solid var(--accent); margin: 0.8rem auto;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: var(--accent); font-weight: 600;
      position: relative; transition: all 0.5s;
      background: rgba(201,168,76,0.05);
    }
    .breath-circle.inhale { animation: breatheIn 4s ease forwards; }
    .breath-circle.hold { animation: breatheHold 2s ease; }
    .breath-circle.exhale { animation: breatheOut 6s ease forwards; }
    .breath-circle::before {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.2);
    }
    .breath-circle::after {
      content: ''; position: absolute; inset: -18px; border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.1);
    }
    .breath-status { color: var(--muted); font-size: 0.85rem; margin-top: 0.6rem; }
    .breath-cycle { color: var(--accent); font-size: 0.78rem; margin-top: 0.3rem; opacity: 0.7; }

    /* 记忆卡片 */
    .memory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; max-width: 420px; margin: 0 auto; }
    .memory-card {
      padding: 0.85rem; background: rgba(44,24,16,0.5);
      border: 1.5px solid var(--rule); border-radius: 12px;
      cursor: pointer; transition: all 0.4s; text-align: center;
      perspective: 600px; position: relative; overflow: hidden;
    }
    .memory-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(201,168,76,0.1) 0%, transparent 70%);
      opacity: 0; transition: opacity 0.3s;
    }
    .memory-card:hover::before { opacity: 1; }
    .memory-card.revealed {
      border-color: var(--accent); background: rgba(201,168,76,0.08);
      animation: fadeInScale 0.5s ease;
    }
    .memory-card .memory-title { font-size: 0.85rem; font-weight: 700; color: var(--accent); }
    .memory-card .memory-desc {
      font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem;
      max-height: 0; overflow: hidden; transition: max-height 0.5s ease, opacity 0.5s; opacity: 0;
    }
    .memory-card.revealed .memory-desc { max-height: 200px; opacity: 1; }
    .memory-card .memory-icon { font-size: 1.5rem; margin-bottom: 0.3rem; }

    /* 法宝收集 */
    .tools-grid { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .tool-card {
      width: 140px; padding: 1.1rem 0.8rem;
      background: rgba(44,24,16,0.5); border: 1.5px solid var(--rule);
      border-radius: 14px; text-align: center; cursor: pointer;
      transition: all 0.4s; position: relative; overflow: hidden;
    }
    .tool-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(201,168,76,0.15) 0%, transparent 70%);
      opacity: 0; transition: opacity 0.3s;
    }
    .tool-card:hover { border-color: rgba(201,168,76,0.4); transform: translateY(-4px); }
    .tool-card:hover::before { opacity: 1; }
    .tool-card.collected {
      border-color: var(--accent); transform: translateY(-4px);
      box-shadow: 0 6px 25px rgba(201,168,76,0.25);
      animation: bloomIn 0.6s ease;
    }
    .tool-card .tool-icon { font-size: 2.2rem; margin-bottom: 0.4rem; position: relative; z-index: 1; }
    .tool-card .tool-name { font-size: 0.85rem; font-weight: 700; color: var(--ink); position: relative; z-index: 1; }
    .tool-card .tool-desc {
      font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.5;
      max-height: 0; overflow: hidden; transition: max-height 0.5s ease, opacity 0.5s; opacity: 0;
      position: relative; z-index: 1;
    }
    .tool-card.collected .tool-desc { max-height: 200px; opacity: 1; }

    /* 最终反思 */
    .reflection-questions { max-width: 500px; margin: 0 auto; }
    .reflection-item {
      background: rgba(44,24,16,0.5); border: 1.5px solid var(--rule);
      border-radius: 12px; padding: 0.85rem 1rem; margin-bottom: 0.5rem;
      cursor: pointer; transition: all 0.3s;
    }
    .reflection-item:hover { border-color: rgba(201,168,76,0.3); }
    .reflection-item .q-text { font-size: 0.9rem; font-weight: 700; color: var(--accent); }
    .reflection-item .q-answer {
      font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; line-height: 1.7;
      max-height: 0; overflow: hidden; transition: max-height 0.5s ease, opacity 0.5s; opacity: 0;
    }
    .reflection-item.open .q-answer { max-height: 300px; opacity: 1; }
    .reflection-item .q-arrow {
      display: inline-block; margin-left: 0.3rem; transition: transform 0.3s; font-size: 0.8rem;
    }
    .reflection-item.open .q-arrow { transform: rotate(90deg); }

    /* 翻页导航 */
    .page-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1.5rem;
      background: rgba(26,15,10,0.6); backdrop-filter: blur(12px);
      border-top: 1px solid rgba(201,168,76,0.1);
    }
    .page-nav .page-indicator { font-size: 0.8rem; color: var(--muted); }
    .page-nav .progress-dots { display: flex; gap: 6px; align-items: center; }
    .page-nav .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(201,168,76,0.2); transition: all 0.3s;
    }
    .page-nav .dot.active { background: var(--accent); transform: scale(1.3); box-shadow: 0 0 8px rgba(201,168,76,0.5); }
    .page-nav .dot.done { background: var(--green); }
    .nav-btn {
      padding: 0.5rem 1.2rem; background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.25); border-radius: 10px;
      color: var(--accent); font-family: var(--font); font-size: 0.85rem;
      cursor: pointer; transition: all 0.3s;
    }
    .nav-btn:hover { background: rgba(201,168,76,0.2); }
    .nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

    /* ================================================================
       心灵花园
       ================================================================ */
    .garden-page {
      background:
        radial-gradient(ellipse at 50% 30%, rgba(201,168,76,0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0c1445 0%, #1a237e 25%, #2c1810 65%, #1a0f0a 100%);
      padding: 2rem 1.5rem; align-items: center; position: relative; overflow: hidden;
    }
    .garden-header { text-align: center; margin-bottom: 2rem; position: relative; z-index: 2; }
    .garden-header h1 { font-size: 1.9rem; color: var(--accent); margin-bottom: 0.4rem; text-shadow: 0 0 20px rgba(201,168,76,0.3); }
    .garden-header p { color: var(--muted); font-size: 0.9rem; }

    .garden-flowers {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 1.2rem; max-width: 600px; width: 100%; margin-bottom: 2.5rem;
      position: relative; z-index: 2;
    }
    .garden-flower {
      aspect-ratio: 1; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; background: rgba(44,24,16,0.5);
      border: 2px solid var(--rule); transition: all 0.3s;
    }
    .garden-flower.bloomed {
      border-color: var(--accent);
      box-shadow: 0 0 25px rgba(201,168,76,0.25);
      animation: floatSlow 4s ease-in-out infinite;
    }
    .garden-flower:not(.bloomed) { opacity: 0.35; }

    .achievements { max-width: 520px; width: 100%; position: relative; z-index: 2; }
    .achievements h3 { font-size: 1rem; color: var(--accent); margin-bottom: 1rem; text-align: center; }
    .achievement-item {
      display: flex; align-items: center; gap: 0.8rem;
      padding: 0.85rem 1rem; background: rgba(44,24,16,0.5);
      border: 1px solid var(--rule); border-radius: 12px; margin-bottom: 0.5rem;
      backdrop-filter: blur(4px); transition: all 0.3s;
    }
    .achievement-item:hover { border-color: rgba(201,168,76,0.3); }
    .achievement-item .ach-icon { font-size: 1.6rem; }
    .achievement-item .ach-name { font-size: 0.9rem; font-weight: 700; color: var(--ink); }
    .achievement-item .ach-desc { font-size: 0.78rem; color: var(--muted); }

    /* ================================================================
       结局页面
       ================================================================ */
    .ending-page {
      background:
        radial-gradient(circle at 50% 30%, rgba(255,215,0,0.3) 0%, transparent 50%),
        radial-gradient(circle at 30% 70%, rgba(255,154,86,0.15) 0%, transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(241,196,15,0.1) 0%, transparent 40%),
        linear-gradient(180deg, #ff9a56 0%, #ffcd69 15%, #ffeaa7 30%, #f5e6ca 45%, #2c1810 65%, #1a0f0a 100%);
      align-items: center; justify-content: center; text-align: center;
      padding: 2rem 1.5rem; position: relative; overflow: hidden;
    }
    .ending-content { position: relative; z-index: 2; animation: fadeInScale 0.8s ease; }
    .ending-page h1 {
      font-size: 2.2rem; color: var(--bg); margin-bottom: 0.8rem;
      text-shadow: 0 2px 8px rgba(255,255,255,0.2);
    }
    .ending-page .message {
      font-size: 1.05rem; color: rgba(44,24,16,0.85); margin-bottom: 2rem;
      font-weight: 600;
    }
    .ending-achievements {
      display: flex; gap: 1.2rem; flex-wrap: wrap; justify-content: center; margin-bottom: 2rem;
    }
    .ending-ach {
      width: 85px; text-align: center; padding: 0.8rem 0.5rem;
      background: rgba(255,255,255,0.5); border-radius: 14px;
      backdrop-filter: blur(6px); animation: bloomIn 0.6s ease;
    }
    .ending-ach .icon { font-size: 2.2rem; }
    .ending-ach .name { font-size: 0.72rem; color: rgba(44,24,16,0.7); margin-top: 0.3rem; font-weight: 600; }
    .ending-encouragement {
      max-width: 420px; color: rgba(44,24,16,0.75); font-size: 0.92rem;
      margin-bottom: 2rem; line-height: 1.8;
    }
    .ending-buttons { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .ending-buttons .btn-secondary { color: var(--bg); border-color: var(--bg); }
    .ending-buttons .btn-secondary:hover { background: rgba(44,24,16,0.1); }

    /* === 响应式 === */
    @media (max-width: 600px) {
      .home-logo h1 { font-size: 1.9rem; }
      .story-title { font-size: 1.35rem; }
      .story-content { padding: 1.5rem 1.5rem 6rem; }
      .memory-grid { grid-template-columns: 1fr; }
      .tools-grid { flex-direction: column; align-items: center; }
      .tool-card { width: 100%; max-width: 260px; }
      .nine-color-deer { transform: scale(0.8); }
      .interaction-area { padding: 1rem 1rem 1.2rem; }
    }
    @media (max-width: 380px) {
      .nine-color-deer { transform: scale(0.65); }
      .home-logo h1 { font-size: 1.6rem; }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <!-- 进度条 -->
    <div class="progress-bar" id="progressBar">
      <div class="fill" id="progressFill" style="width:0%"></div>
    </div>

    <!-- ============================================================
         首页：倾听室
         ============================================================ -->
    <div class="page-view home-page active dunhuang-texture" id="homePage">
      <!-- 背景装饰 -->
      <div class="stars-bg"></div>
      <div class="golden-particles" id="homeParticles"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="dune-silhouette"></div>

      <!-- 标题 -->
      <div class="home-logo">
        <h1>九色鹿心灵奇旅</h1>
        <div class="subtitle">来自敦煌壁画的心灵守护者</div>
      </div>

      <!-- 九色鹿形象 -->
      <div class="deer-container">
        <div class="nine-color-deer nine-color-deer--listening" id="deerAvatar">
          <div class="deer-aura"></div>
          <div class="deer-particles">
            <div class="deer-particle"></div><div class="deer-particle"></div>
            <div class="deer-particle"></div><div class="deer-particle"></div>
            <div class="deer-particle"></div><div class="deer-particle"></div>
            <div class="deer-particle"></div>
          </div>
          <div class="deer-body"></div>
          <div class="deer-neck"></div>
          <div class="deer-head">
            <div class="deer-eye"></div>
          </div>
          <div class="deer-ear deer-ear--left"></div>
          <div class="deer-ear deer-ear--right"></div>
          <div class="deer-antler deer-antler--left"></div>
          <div class="deer-antler deer-antler--right"></div>
          <div class="deer-leg deer-leg--fl"></div>
          <div class="deer-leg deer-leg--fr"></div>
          <div class="deer-leg deer-leg--bl"></div>
          <div class="deer-leg deer-leg--br"></div>
          <div class="deer-tail"></div>
        </div>
      </div>

      <!-- 对话气泡 -->
      <div class="deer-speech-bubble" id="deerBubble">
        <span id="deerText"></span><span class="typing-cursor" id="typingCursor"></span>
      </div>

      <!-- 情绪标签 -->
      <div class="emotion-tags">
        <span class="emotion-tag" data-emotion="考试压力" onclick="selectEmotion(this)">考试压力</span>
        <span class="emotion-tag" data-emotion="人际烦恼" onclick="selectEmotion(this)">人际烦恼</span>
        <span class="emotion-tag" data-emotion="家庭矛盾" onclick="selectEmotion(this)">家庭矛盾</span>
        <span class="emotion-tag" data-emotion="自我怀疑" onclick="selectEmotion(this)">自我怀疑</span>
        <span class="emotion-tag" data-emotion="孤独感" onclick="selectEmotion(this)">孤独感</span>
      </div>

      <!-- 文本输入 -->
      <div class="input-area">
        <textarea id="worryInput" placeholder="在这里写下你的烦恼，九色鹿会认真倾听..."></textarea>
      </div>

      <!-- 按钮 -->
      <div class="home-buttons">
        <button class="btn-primary" onclick="startJourney()">开始心灵奇旅</button>
        <button class="btn-secondary" onclick="showGarden()">我的心灵花园</button>
      </div>
    </div>

    <!-- ============================================================
         绘本页面
         ============================================================ -->
    <div class="page-view storybook-page" id="storybookPage">
      <div class="story-scene" id="storyScene"></div>
      <div class="scene-particles" id="sceneParticles"></div>

      <div class="story-content" id="storyContent">
        <!-- 动态渲染 -->
      </div>

      <div class="interaction-area" id="interactionArea">
        <div class="interaction-prompt" id="interactionPrompt"></div>
        <div id="interactionContent"></div>
        <div class="interaction-response" id="interactionResponse"></div>
      </div>

      <div class="page-nav" id="pageNav">
        <button class="nav-btn" id="prevBtn" onclick="prevPage()" disabled>&larr; 上一页</button>
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
          <div class="progress-dots" id="progressDots"></div>
          <span class="page-indicator" id="pageIndicator">1 / 8</span>
        </div>
        <button class="nav-btn" id="nextBtn" onclick="nextPage()">下一页 &rarr;</button>
      </div>
    </div>

    <!-- ============================================================
         心灵花园
         ============================================================ -->
    <div class="page-view garden-page dunhuang-texture" id="gardenPage">
      <div class="stars-bg"></div>
      <div class="golden-particles" id="gardenParticles"></div>

      <div class="garden-header">
        <h1>我的心灵花园</h1>
        <p>每一次心灵奇旅，都会在这里开出一朵花</p>
      </div>

      <div class="garden-flowers" id="gardenFlowers">
        <!-- 动态渲染 -->
      </div>

      <div class="achievements" id="achievementsList">
        <h3>成就徽章</h3>
        <!-- 动态渲染 -->
      </div>

      <div style="margin-top:2rem;position:relative;z-index:2;">
        <button class="btn-secondary" onclick="goHome()">返回倾听室</button>
      </div>
    </div>

    <!-- ============================================================
         结局页面
         ============================================================ -->
    <div class="page-view ending-page" id="endingPage">
      <div class="stars-bg" style="opacity:0.3;"></div>
      <div class="golden-particles" id="endingParticles"></div>

      <div class="ending-content">
        <h1>九色鹿的心灵礼物</h1>
        <p class="message">恭喜你完成了这次心灵奇旅！</p>

        <div class="ending-achievements" id="endingAchievements">
          <!-- 动态渲染 -->
        </div>

        <p class="ending-encouragement">
          你和小星一样勇敢！记住，每个人心里都住着一只九色鹿，每当你需要勇气的时候，它就会出现在你身边。
        </p>

        <div class="ending-buttons">
          <button class="btn-primary" onclick="showGarden()">查看心灵花园</button>
          <button class="btn-secondary" onclick="goHome()">再来一次</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== JavaScript ========== -->
  <script>
    /* ============================================================
       故事数据（完整内联）
       ============================================================ */
    const STORY = {
      meta: {
        id: 'exam-anxiety',
        title: '小星的考试奇旅',
        subtitle: '九色鹿带你穿越焦虑的迷雾',
        totalPages: 8
      },
      pages: [
        // ===== 第1页：引入 - 窗外的阳光 =====
        {
          id: 'page-1', chapter: '引入', title: '窗外的阳光',
          scene: {
            bgGradient: 'linear-gradient(180deg, #87ceeb 0%, #98d4ee 20%, #e8f5e9 60%, #c8e6c9 100%)',

    /* ============================================================
       页面切换
       ============================================================ */
    function showPage(pageId) {
      document.querySelectorAll('.page-view').forEach(function(p) { p.classList.remove('active'); });
      document.getElementById(pageId).classList.add('active');
    }

    function goHome() {
      showPage('homePage');
      document.getElementById('progressBar').style.display = 'none';
      generateGoldenParticles('homeParticles', 25);
    }

    function showGarden() {
      showPage('gardenPage');
      document.getElementById('progressBar').style.display = 'none';
      renderGarden();
      generateGoldenParticles('gardenParticles', 20);
    }

    /* ============================================================
       首页功能
       ============================================================ */
    // 打字机效果
    function typeText(elementId, text, speed, callback) {
      var el = document.getElementById(elementId);
      var cursor = document.getElementById('typingCursor');
      el.textContent = '';
      cursor.style.display = 'inline-block';
      var i = 0;
      if (typingTimer) clearInterval(typingTimer);
      typingTimer = setInterval(function() {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
        } else {
          clearInterval(typingTimer);
          cursor.style.display = 'none';
          if (callback) callback();
        }
      }, speed || 50);
    }

    function initHome() {
      var welcomeText = '你好呀，我是九色鹿。今天有什么心事想跟我说吗？不管是开心的、难过的、还是让你烦恼的事情，我都在这里听你说。';

        setTimeout(function() {
          currentPage = 0;

    /* ============================================================
       绘本渲染
       ============================================================ */
    function renderPage(pageIndex) {
      var page = STORY.pages[pageIndex];
      interactionCompleted = false;
      if (breathTimer) { clearTimeout(breathTimer); breathTimer = null; }

      // 更新进度条
      var progress = ((pageIndex + 1) / totalPages) * 100;
      document.getElementById('progressFill').style.width = progress + '%';

      // 更新场景背景
      document.getElementById('storyScene').style.background = page.scene.bgGradient;

      // 生成场景粒子
      generateSceneParticles(page);

      // 渲染故事内容
      var content = document.getElementById('storyContent');
      var html = '';
      html += '<div class="story-chapter">' + page.chapter + '</div>';
      html += '<div class="story-title">' + page.title + '</div>';
      html += '<div class="story-narrative">' + page.narrative + '</div>';

      // 对话
      if (page.dialogues && page.dialogues.length > 0) {
        page.dialogues.forEach(function(d, idx) {
          var speakerClass = 'speaker--' + (d.type || 'deer');
          html += '<div class="story-dialogue" style="animation-delay:' + (0.3 + idx * 0.15) + 's">';
          html += '<div class="speaker ' + speakerClass + '">' + d.speaker + '</div>';
          html += '<div class="dialogue-text">' + d.text + '</div>';
          html += '</div>';
        });
      }

      content.innerHTML = html;

      // 渲染互动区域
      renderInteraction(page);

      // 更新导航
      document.getElementById('pageIndicator').textContent = (pageIndex + 1) + ' / ' + totalPages;
      document.getElementById('prevBtn').disabled = (pageIndex === 0);
      document.getElementById('nextBtn').disabled = (pageIndex === totalPages - 1);
      updateProgressDots(pageIndex);

      // 隐藏互动面板后重新显示
      var area = document.getElementById('interactionArea');
      area.classList.remove('show');
      setTimeout(function() { area.classList.add('show'); }, 300);

      window.scrollTo(0, 0);
    }

    // 进度点
    function renderProgressDots() {
      var container = document.getElementById('progressDots');
      var html = '';
      for (var i = 0; i < totalPages; i++) {
        html += '<div class="dot" id="dot-' + i + '"></div>';
      }
      container.innerHTML = html;
    }

    function updateProgressDots(activeIndex) {
      for (var i = 0; i < totalPages; i++) {
        var dot = document.getElementById('dot-' + i);
        if (!dot) continue;
        dot.className = 'dot';
        if (i < activeIndex) dot.classList.add('done');
        if (i === activeIndex) dot.classList.add('active');
      }
    }

    /* ============================================================
       互动渲染（6种类型）
       ============================================================ */
    function renderInteraction(page) {
      var area = document.getElementById('interactionArea');
      var prompt = document.getElementById('interactionPrompt');
      var content = document.getElementById('interactionContent');
      var response = document.getElementById('interactionResponse');

      response.classList.remove('show');
      response.textContent = '';
      content.innerHTML = '';

      if (!page.interaction) { area.classList.remove('show'); return; }

      prompt.textContent = page.interaction.prompt;

      switch (page.interaction.type) {
        case 'emotion-check':     renderOptions(page.interaction); break;
        case 'choice':            renderOptions(page.interaction); break;
        case 'perspective-shift': renderOptions(page.interaction); break;
        case 'promise':           renderOptions(page.interaction); break;
        case 'breathing-exercise': renderBreathingExercise(page.interaction); break;
        case 'memory-explore':    renderMemoryExplore(page.interaction); break;
        case 'tool-collection':   renderToolCollection(page.interaction); break;
        case 'final-reflection':  renderFinalReflection(page.interaction); break;
      }
    }

    // --- 类型1：选项互动（情绪检查、选择、视角转换、承诺） ---
    function renderOptions(interaction) {
      var content = document.getElementById('interactionContent');
      var html = '<div class="interaction-options">';
      interaction.options.forEach(function(opt) {
        html += '<div class="interaction-option" data-id="' + opt.id + '" onclick="selectOption(this)">';
        html += '<span class="opt-emoji">' + opt.emoji + '</span>';
        html += '<span>' + opt.label + '</span>';
        html += '</div>';
      });
      html += '</div>';
      content.innerHTML = html;

      // 存储response数据
      content.dataset.responses = JSON.stringify(
        interaction.options.reduce(function(map, opt) { map[opt.id] = opt.response; return map; }, {})
      );
    }

    function selectOption(el) {
      // 禁用其他选项
      document.querySelectorAll('.interaction-option').forEach(function(o) {
        o.classList.add('disabled');
      });
      el.classList.remove('disabled');
      el.classList.add('selected');

      var responses = JSON.parse(document.getElementById('interactionContent').dataset.responses || '{}');
      var respText = responses[el.dataset.id] || '';

      var resp = document.getElementById('interactionResponse');
      resp.textContent = respText;
      resp.classList.add('show');
      interactionCompleted = true;
    }

    // --- 类型2：呼吸练习 ---
    function renderBreathingExercise(interaction) {
      var content = document.getElementById('interactionContent');
      var html = '<div class="breath-container">';
      html += '<div class="breath-circle" id="breathCircle">准备</div>';
      html += '<div class="breath-status" id="breathStatus">' + (interaction.instruction || '跟着圆圈的节奏') + '</div>';
      html += '<div class="breath-cycle" id="breathCycle"></div>';
      html += '</div>';
      content.innerHTML = html;

      setTimeout(function() { startBreathing(interaction.breathPattern, interaction.completionMessage); }, 800);
    }

    function startBreathing(pattern, completionMsg) {
      var circle = document.getElementById('breathCircle');
      var status = document.getElementById('breathStatus');
      var cycleInfo = document.getElementById('breathCycle');
      var cycle = 0;
      var totalCycles = pattern.cycles || 3;

      function runCycle() {
        if (cycle >= totalCycles) {
          circle.className = 'breath-circle';
          circle.textContent = '完成!';
          circle.style.borderColor = 'var(--green)';
          status.textContent = '太棒了，你做到了！';
          cycleInfo.textContent = '';
          var resp = document.getElementById('interactionResponse');
          resp.textContent = completionMsg;
          resp.classList.add('show');
          interactionCompleted = true;
          return;
        }
        cycle++;
        cycleInfo.textContent = '第 ' + cycle + ' / ' + totalCycles + ' 轮';

        // 吸气
        circle.className = 'breath-circle inhale';
        circle.textContent = '吸气';
        circle.style.borderColor = '';
        status.textContent = '慢慢吸气...';
        breathTimer = setTimeout(function() {
          // 屏住
          circle.className = 'breath-circle hold';
          circle.textContent = '屏住';
          status.textContent = '屏住呼吸...';
          breathTimer = setTimeout(function() {
            // 呼气
            circle.className = 'breath-circle exhale';
            circle.textContent = '呼气';
            circle.style.borderColor = '';
            status.textContent = '慢慢呼气...';
            breathTimer = setTimeout(function() {
              runCycle();
            }, pattern.exhale * 1000);
          }, pattern.hold * 1000);
        }, pattern.inhale * 1000);
      }

      runCycle();
    }

    // --- 类型3：记忆探索 ---
    var revealedCount = 0;
    function renderMemoryExplore(interaction) {
      revealedCount = 0;
      var content = document.getElementById('interactionContent');
      var html = '<div class="memory-grid">';
      interaction.memories.forEach(function(mem) {
        html += '<div class="memory-card" data-id="' + mem.id + '" onclick="revealMemory(this)">';
        html += '<div class="memory-icon">' + mem.icon + '</div>';
        html += '<div class="memory-title">' + mem.title + '</div>';
        html += '<div class="memory-desc">' + mem.description + '</div>';
        html += '</div>';
      });
      html += '</div>';
      content.innerHTML = html;

      // 存储洞察文本
      content.dataset.insight = interaction.insightAfterAll || '';
    }

    function revealMemory(el) {
      if (el.classList.contains('revealed')) return;
      el.classList.add('revealed');
      revealedCount++;

      if (revealedCount >= 4) {
        setTimeout(function() {
          var resp = document.getElementById('interactionResponse');
          resp.textContent = document.getElementById('interactionContent').dataset.insight;
          resp.classList.add('show');
          interactionCompleted = true;
        }, 600);
      }
    }

    // --- 类型4：法宝收集 ---
    var collectedCount = 0;
    function renderToolCollection(interaction) {
      collectedCount = 0;
      var content = document.getElementById('interactionContent');
      var html = '<div class="tools-grid">';
      interaction.tools.forEach(function(tool) {
        html += '<div class="tool-card" data-id="' + tool.id + '" onclick="collectTool(this)">';
        html += '<div class="tool-icon">' + tool.icon + '</div>';
        html += '<div class="tool-name">' + tool.name + '</div>';
        html += '<div class="tool-desc">' + tool.description + '</div>';
        html += '</div>';
      });
      html += '</div>';
      content.innerHTML = html;

      content.dataset.completionMsg = interaction.completionMessage || '';
    }

    function collectTool(el) {
      if (el.classList.contains('collected')) return;
      el.classList.add('collected');
      collectedCount++;

      if (collectedCount >= 3) {
        setTimeout(function() {
          var resp = document.getElementById('interactionResponse');
          resp.textContent = document.getElementById('interactionContent').dataset.completionMsg;
          resp.classList.add('show');
          interactionCompleted = true;
        }, 600);
      }
    }

    // --- 类型5：最终反思 ---
    function renderFinalReflection(interaction) {
      var content = document.getElementById('interactionContent');
      var html = '<div class="reflection-questions">';
      interaction.reflectionQuestions.forEach(function(q, idx) {
        html += '<div class="reflection-item" onclick="toggleReflection(this)">';
        html += '<div class="q-text">' + q.question + ' <span class="q-arrow">&#9654;</span></div>';
        html += '<div class="q-answer">' + q.answer + '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div style="text-align:center;margin-top:1.2rem;">';
      html += '<button class="btn-primary" onclick="completeStory()">完成旅程</button>';
      html += '</div>';
      content.innerHTML = html;
    }

    function toggleReflection(el) {
      el.classList.toggle('open');
    }

    function completeStory() {
      showPage('endingPage');
      document.getElementById('progressBar').style.display = 'none';
      renderEnding();
      generateGoldenParticles('endingParticles', 30);
    }

    /* ============================================================
       翻页
       ============================================================ */
    function nextPage() {
      if (currentPage < totalPages - 1) {
        currentPage++;
        revealedCount = 0;
        collectedCount = 0;
        renderPage(currentPage);
      }
    }

    function prevPage() {
      if (currentPage > 0) {
        currentPage--;
        revealedCount = 0;
        collectedCount = 0;
        renderPage(currentPage);
      }
    }

    /* ============================================================
       心灵花园渲染
       ============================================================ */
    function renderGarden() {
      var flowers = document.getElementById('gardenFlowers');
      var achievements = document.getElementById('achievementsList');
      var achData = STORY.conclusion.achievements;

      // 花朵
      var flowerEmojis = ['\u{1F338}', '\u{1F33A}', '\u{1F33B}', '\u{1F337}', '\u{1F339}', '\u{1F490}'];
      var flowerHtml = '';
      flowerEmojis.forEach(function(f, i) {
        var bloomed = i < 4 ? ' bloomed' : '';
        var delay = i * 0.3;
        flowerHtml += '<div class="garden-flower' + bloomed + '" style="animation-delay:' + delay + 's">' + f + '</div>';
      });
      flowers.innerHTML = flowerHtml;

      // 成就
      var achHtml = '<h3>成就徽章</h3>';
      achData.forEach(function(ach) {
        achHtml += '<div class="achievement-item">';
        achHtml += '<span class="ach-icon">' + ach.icon + '</span>';
        achHtml += '<div><div class="ach-name">' + ach.name + '</div>';
        achHtml += '<div class="ach-desc">' + ach.description + '</div></div>';
        achHtml += '</div>';
      });
      achievements.innerHTML = achHtml;
    }

    /* ============================================================
       结局页面渲染
       ============================================================ */
    function renderEnding() {
      var container = document.getElementById('endingAchievements');
      var achData = STORY.conclusion.achievements;
      var html = '';
      achData.forEach(function(ach, i) {
        html += '<div class="ending-ach" style="animation-delay:' + (i * 0.15) + 's">';
        html += '<div class="icon">' + ach.icon + '</div>';
        html += '<div class="name">' + ach.name + '</div>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    /* ============================================================
       粒子效果
       ============================================================ */
    // 金色粒子（首页、花园、结局）
    function generateGoldenParticles(containerId, count) {
      var container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = '';
      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'golden-particle';
        var size = 2 + Math.random() * 4;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = (20 + Math.random() * 80) + '%';
        p.style.background = Math.random() > 0.5 ? 'var(--accent)' : 'rgba(255,215,0,0.8)';
        p.style.animationDuration = (4 + Math.random() * 6) + 's';
        p.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(p);
      }
    }

    // 场景粒子
    function generateSceneParticles(page) {
      var container = document.getElementById('sceneParticles');
      container.innerHTML = '';
      var count = page.scene.particleCount || 10;
      var color = page.scene.particleColor || 'rgba(201,168,76,0.5)';
      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'scene-particle';
        var size = 2 + Math.random() * 5;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.background = color;
        p.style.animationDuration = (2 + Math.random() * 4) + 's';
        p.style.animationDelay = Math.random() * 4 + 's';
        container.appendChild(p);
      }
    }

    /* ============================================================
       初始化
       ============================================================ */
    window.addEventListener('DOMContentLoaded', function() {
      initHome();
    });
  </script>
</body>
</html>
