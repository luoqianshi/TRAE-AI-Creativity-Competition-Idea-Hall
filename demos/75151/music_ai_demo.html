<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐随心 - AI 个性化音乐生成伴侣</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .card-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title .icon {
            font-size: 1.2em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #555;
        }
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            resize: vertical;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .style-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .style-tag {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
            font-size: 0.95em;
        }
        .style-tag:hover {
            border-color: #667eea;
            color: #667eea;
        }
        .style-tag.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        .btn-generate {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-generate:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-generate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .generating {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .generating.active {
            display: block;
        }
        .music-wave {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            height: 60px;
            margin-bottom: 20px;
        }
        .wave-bar {
            width: 6px;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 3px;
            animation: wave 1.2s ease-in-out infinite;
        }
        .wave-bar:nth-child(1) { height: 20px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 35px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 50px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 40px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 55px; animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { height: 30px; animation-delay: 0.5s; }
        .wave-bar:nth-child(7) { height: 45px; animation-delay: 0.6s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
        }
        .result-card {
            display: none;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .result-card.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .song-info h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1.2em;
        }
        .song-meta {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .song-meta span {
            background: white;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            color: #666;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .player-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .play-btn:hover {
            transform: scale(1.1);
        }
        .progress-container {
            flex: 1;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.3s;
        }
        .time {
            font-size: 0.85em;
            color: #888;
            min-width: 40px;
            text-align: right;
        }
        .playlist {
            margin-top: 10px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .playlist-item:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }
        .playlist-item .num {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 15px;
            font-size: 0.9em;
        }
        .playlist-item .info {
            flex: 1;
        }
        .playlist-item .info .name {
            font-weight: 600;
            color: #333;
            margin-bottom: 3px;
        }
        .playlist-item .info .desc {
            font-size: 0.85em;
            color: #888;
        }
        .playlist-item .tag {
            padding: 4px 12px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 0.8em;
            color: #666;
        }
        .playlist-item .tag.new {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }
        .tag-section {
            margin-bottom: 15px;
        }
        .tag-section-title {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 10px;
        }
        .lyrics-preview {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
            line-height: 1.8;
            color: #555;
            max-height: 150px;
            overflow-y: auto;
        }
        .lyrics-preview::-webkit-scrollbar {
            width: 6px;
        }
        .lyrics-preview::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 乐随心</h1>
            <p>AI 个性化音乐生成伴侣 —— 想听什么，就创造什么</p>
        </div>

        <!-- 生成区域 -->
        <div class="card">
            <div class="card-title">
                <span class="icon">✨</span>
                创作你的专属音乐
            </div>
            <div class="form-group">
                <label>💭 输入你的诉求</label>
                <textarea id="prompt" rows="3" placeholder="例如：我想听一首适合深夜加班的轻音乐，节奏舒缓，能帮助我集中注意力..."></textarea>
            </div>
            <div class="form-group">
                <label>🎸 选择曲风</label>
                <div class="style-options" id="styleOptions">
                    <span class="style-tag active" data-style="轻音乐">🎹 轻音乐</span>
                    <span class="style-tag" data-style="流行">🎤 流行</span>
                    <span class="style-tag" data-style="电子">🎛️ 电子</span>
                    <span class="style-tag" data-style="古典">🎻 古典</span>
                    <span class="style-tag" data-style="爵士">🎷 爵士</span>
                    <span class="style-tag" data-style="摇滚">🎸 摇滚</span>
                    <span class="style-tag" data-style="民谣">🪕 民谣</span>
                    <span class="style-tag" data-style="嘻哈">🎤 嘻哈</span>
                </div>
            </div>
            <button class="btn-generate" id="generateBtn" onclick="generateSong()">
                <span>🎵</span> 生成专属歌曲
            </button>
            <div class="generating" id="generating">
                <div class="music-wave">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <p>AI 正在理解你的诉求，为你创作专属歌曲...</p>
                <p style="font-size: 0.9em; color: #888; margin-top: 10px;">预计需要 10-20 秒</p>
            </div>
        </div>

        <!-- 生成结果 -->
        <div class="result-card" id="resultCard">
            <div class="song-info">
                <h3 id="songTitle">《深夜的星光》</h3>
                <div class="song-meta">
                    <span id="songStyle">🎹 轻音乐</span>
                    <span id="songDuration">⏱️ 3:24</span>
                    <span>🤖 AI 生成</span>
                </div>
            </div>
            <div class="player-bar">
                <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <span class="time" id="timeText">0:00 / 3:24</span>
            </div>
            <div class="lyrics-preview" id="lyricsPreview">
                正在生成歌词...
            </div>
        </div>

        <!-- 我的歌单 -->
        <div class="card">
            <div class="card-title">
                <span class="icon">📋</span>
                我的歌曲清单
            </div>
            <div class="playlist" id="playlist">
                <div class="empty-state" id="emptyState">
                    <div class="icon">🎵</div>
                    <p>还没有生成过歌曲</p>
                    <p style="font-size: 0.9em; margin-top: 5px;">上方输入诉求，开始创作你的第一首歌吧</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedStyle = '轻音乐';
        let isPlaying = false;
        let playInterval;
        let currentProgress = 0;
        let songCount = 0;
        let playlist = [];

        // 曲风选择
        document.querySelectorAll('.style-tag').forEach(tag => {
            tag.addEventListener('click', function() {
                document.querySelectorAll('.style-tag').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                selectedStyle = this.dataset.style;
            });
        });

        // 模拟歌曲数据
        const songDatabase = {
            '轻音乐': [
                { title: '《深夜的星光》', duration: '3:24', lyrics: '星光洒在窗台\n宁静的夜晚\n思绪在漂浮\n寻找那一份安宁\n\n钢琴声缓缓\n像流水一样\n带走所有疲惫\n留下温柔梦乡' },
                { title: '《雨后的清晨》', duration: '4:01', lyrics: '雨滴停在花瓣\n空气如此清新\n阳光穿透云层\n照亮前行的路\n\n深呼吸\n感受这一刻\n生活原本\n可以如此简单' },
                { title: '《咖啡与书》', duration: '3:15', lyrics: '午后阳光斜照\n咖啡香气缭绕\n翻开一本旧书\n时光慢慢流淌\n\n字里行间\n藏着故事\n像一首老歌\n轻轻哼唱' }
            ],
            '流行': [
                { title: '《追光者》', duration: '3:45', lyrics: '每个人都在奔跑\n追逐心中的光\n不怕跌倒不怕伤\n只为那一抹明亮\n\n就算世界喧嚣\n我听见自己的心跳\n勇敢去爱去闯\n这就是我的信仰' },
                { title: '《城市月光》', duration: '3:52', lyrics: '霓虹灯下的街角\n人来人往匆忙\n抬头看见月亮\n它也在守望\n\n给每个孤独灵魂\n一点温暖力量\n明天的太阳\n会照常升起' }
            ],
            '电子': [
                { title: '《赛博梦境》', duration: '4:30', lyrics: '数据流在穿梭\n未来就在眼前\n数字与心跳\n交织成和弦\n\n跳出虚拟边界\n释放真实自我\n在电子海洋\n自由遨游' }
            ],
            '古典': [
                { title: '《永恒的华尔兹》', duration: '5:12', lyrics: '（纯音乐，无歌词）\n\n弦乐四重奏\n优雅地旋转\n像舞者在月光下\n翩翩起舞\n\n每一个音符\n都是一封情书\n写给时光\n写给永恒' }
            ],
            '爵士': [
                { title: '《午夜蓝调》', duration: '4:05', lyrics: '萨克斯在低语\n讲述旧时光\n威士忌加冰块\n融化成过往\n\n城市的夜晚\n总有故事发生\n爵士乐响起\n一切刚刚好' }
            ],
            '摇滚': [
                { title: '《燃烧的青春》', duration: '3:38', lyrics: '电吉他嘶吼\n鼓点震心房\n不妥协不投降\n热血在流淌\n\n就算世界\n给我一千个理由放弃\n我选择摇滚\n选择坚持到底' }
            ],
            '民谣': [
                { title: '《故乡的河》', duration: '4:20', lyrics: '那条河还在流\n像小时候一样\n柳树依旧垂\n蝉鸣在耳旁\n\n走远了的岁月\n回不去的时光\n唯有民谣\n能把记忆珍藏' }
            ],
            '嘻哈': [
                { title: '《都市节奏》', duration: '3:10', lyrics: 'Yo 听我说\n城市节奏这么快\n每个人都在拼\n为了梦想和未来\n\nFlow 要够狠\n歌词要够真\n用嘻哈的态度\n面对每个清晨' }
            ]
        };

        function generateSong() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) {
                alert('请先输入你的诉求哦~');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const generating = document.getElementById('generating');
            const resultCard = document.getElementById('resultCard');

            btn.disabled = true;
            generating.classList.add('active');
            resultCard.classList.remove('active');

            // 模拟生成延迟
            setTimeout(() => {
                const songs = songDatabase[selectedStyle] || songDatabase['轻音乐'];
                const song = songs[Math.floor(Math.random() * songs.length)];
                
                songCount++;
                const songData = {
                    id: songCount,
                    title: song.title,
                    style: selectedStyle,
                    duration: song.duration,
                    lyrics: song.lyrics,
                    prompt: prompt,
                    time: new Date().toLocaleString('zh-CN')
                };
                playlist.unshift(songData);

                // 显示结果
                document.getElementById('songTitle').textContent = song.title;
                document.getElementById('songStyle').textContent = '🎵 ' + selectedStyle;
                document.getElementById('songDuration').textContent = '⏱️ ' + song.duration;
                document.getElementById('lyricsPreview').textContent = song.lyrics;
                document.getElementById('timeText').textContent = '0:00 / ' + song.duration;
                document.getElementById('progressBar').style.width = '0%';
                currentProgress = 0;
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶';
                clearInterval(playInterval);

                generating.classList.remove('active');
                resultCard.classList.add('active');
                btn.disabled = false;

                // 更新歌单
                renderPlaylist();

                // 清空输入
                document.getElementById('prompt').value = '';
            }, 2500);
        }

        function togglePlay() {
            const btn = document.getElementById('playBtn');
            if (isPlaying) {
                isPlaying = false;
                btn.textContent = '▶';
                clearInterval(playInterval);
            } else {
                isPlaying = true;
                btn.textContent = '⏸';
                playInterval = setInterval(() => {
                    currentProgress += 0.5;
                    if (currentProgress >= 100) {
                        currentProgress = 0;
                        isPlaying = false;
                        btn.textContent = '▶';
                        clearInterval(playInterval);
                    }
                    document.getElementById('progressBar').style.width = currentProgress + '%';
                }, 100);
            }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist');
            if (playlist.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎵</div>
                        <p>还没有生成过歌曲</p>
                        <p style="font-size: 0.9em; margin-top: 5px;">上方输入诉求，开始创作你的第一首歌吧</p>
                    </div>
                `;
                return;
            }

            let html = '';
            playlist.forEach((song, index) => {
                const isNew = index === 0;
                html += `
                    <div class="playlist-item" onclick="loadSong(${song.id})">
                        <div class="num">${playlist.length - index}</div>
                        <div class="info">
                            <div class="name">${song.title}</div>
                            <div class="desc">${song.prompt.substring(0, 30)}${song.prompt.length > 30 ? '...' : ''} · ${song.time}</div>
                        </div>
                        <span class="tag ${isNew ? 'new' : ''}">${isNew ? '✨ 刚刚生成' : song.style}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function loadSong(id) {
            const song = playlist.find(s => s.id === id);
            if (!song) return;

            document.getElementById('songTitle').textContent = song.title;
            document.getElementById('songStyle').textContent = '🎵 ' + song.style;
            document.getElementById('songDuration').textContent = '⏱️ ' + song.duration;
            document.getElementById('lyricsPreview').textContent = song.lyrics;
            document.getElementById('timeText').textContent = '0:00 / ' + song.duration;
            document.getElementById('progressBar').style.width = '0%';
            currentProgress = 0;
            isPlaying = false;
            document.getElementById('playBtn').textContent = '▶';
            clearInterval(playInterval);
            document.getElementById('resultCard').classList.add('active');

            // 滚动到结果
            document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
