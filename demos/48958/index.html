<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇宙技能星系</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; color: #fff; }
    #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    
    .search-bar {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
    .search-input {
      width: 400px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(100, 200, 255, 0.3);
      border-radius: 25px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }
    .search-input:focus { border-color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); }
    .search-input::placeholder { color: rgba(255, 255, 255, 0.4); }
    
    .state-label {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 4px;
    }
    
    .info-panel {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100%;
      background: rgba(5, 5, 20, 0.95);
      border-left: 1px solid rgba(100, 200, 255, 0.2);
      padding: 30px 20px;
      transition: right 0.4s;
      z-index: 200;
      overflow-y: auto;
    }
    .info-panel.visible { right: 0; }
    .info-title { color: #00ffff; font-size: 18px; margin-bottom: 8px; }
    .info-subtitle { color: #ff66aa; font-size: 14px; margin-bottom: 20px; }
    .info-desc { color: rgba(255, 255, 255, 0.6); font-size: 13px; line-height: 1.6; }
    
    .breadcrumbs {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 20px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .breadcrumbs.visible { opacity: 1; }
    .breadcrumb-item { color: rgba(255, 255, 255, 0.6); font-size: 12px; cursor: pointer; }
    .breadcrumb-item.active { color: #00ffff; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索宇宙中的技能...">
  </div>
  
  <div class="breadcrumbs" id="breadcrumbs">
    <span class="breadcrumb-item active" id="bcUniverse">宇宙</span>
    <span>→</span>
    <span class="breadcrumb-item" id="bcNebula">星云</span>
    <span>→</span>
    <span class="breadcrumb-item" id="bcCluster">恒星群</span>
  </div>
  
  <div class="state-label">UNIVERSE</div>
  
  <div class="info-panel" id="infoPanel">
    <div class="info-title" id="infoTitle">技能名称</div>
    <div class="info-subtitle" id="infoSubtitle">中文名称</div>
    <div class="info-desc" id="infoDesc">技能描述...</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let mouseX = 0, mouseY = 0;
    
    const STATE = { UNIVERSE: 'universe', WARP: 'warp', NEBULA: 'nebula', CLUSTER: 'cluster' };
    let currentState = STATE.UNIVERSE;
    let selectedGalaxy = null;
    let selectedCluster = null;
    let warpProgress = 0;
    let warpTarget = null;
    
    const galaxies = [
      { 
        id: 'video', name: '视频星系', color: '#ff8800', 
        x: 0.30, y: 0.35, size: 0.14, rotation: 0, rotationSpeed: 0.00005, depth: 1,
        clusters: [
          { id: 'motion', name: '动态图形', color: '#00ffff', skills: [
            { name: 'Logo动画', desc: '企业标志动态呈现效果' },
            { name: '界面转场', desc: '流畅的用户界面过渡效果' },
            { name: '粒子特效', desc: '炫酷的粒子动画效果' },
            { name: '文字动画', desc: '创意文字动态展示' }
          ]},
          { id: 'color', name: '色彩校正', color: '#ff66aa', skills: [
            { name: '电影质感', desc: '专业电影级调色风格' },
            { name: '色彩校正', desc: '精确的颜色调整优化' },
            { name: '风格化滤镜', desc: '独特的视觉风格滤镜' }
          ]},
          { id: 'compositing', name: '合成技术', color: '#88ff00', skills: [
            { name: '绿幕抠像', desc: '专业的色度键合成' },
            { name: '多图层合成', desc: '复杂场景多层叠加' },
            { name: '蒙版追踪', desc: '精准的蒙版动画追踪' }
          ]}
        ]
      },
      { 
        id: 'audio', name: '音频星系', color: '#ff3333', 
        x: 0.68, y: 0.38, size: 0.13, rotation: 0, rotationSpeed: -0.00004, depth: 1.2,
        clusters: [
          { id: 'sound', name: '声音设计', color: '#00ffff', skills: [
            { name: '拟音艺术', desc: '逼真的环境音效制作' },
            { name: '音效库管理', desc: '专业音效素材管理' },
            { name: '空间音频', desc: '沉浸式3D音频效果' }
          ]},
          { id: 'mixing', name: '混音技术', color: '#ff66aa', skills: [
            { name: '多轨混音', desc: '专业音频轨道混合' },
            { name: '母带处理', desc: '成品音频优化处理' },
            { name: '降噪处理', desc: '智能音频降噪技术' }
          ]}
        ]
      },
      { 
        id: '3d', name: '三维星系', color: '#00ff66', 
        x: 0.32, y: 0.65, size: 0.135, rotation: 0, rotationSpeed: 0.00006, depth: 0.8,
        clusters: [
          { id: 'model', name: '三维建模', color: '#ffff00', skills: [
            { name: '角色建模', desc: '精细的三维角色创建' },
            { name: '场景建模', desc: '宏大场景搭建' },
            { name: '道具建模', desc: '精致道具细节刻画' }
          ]},
          { id: 'render', name: '渲染技术', color: '#00ffff', skills: [
            { name: '光线追踪', desc: '真实物理光照模拟' },
            { name: '全局照明', desc: '全局光照计算渲染' },
            { name: '材质制作', desc: '逼真材质贴图制作' }
          ]}
        ]
      },
      { 
        id: 'ai', name: 'AI星系', color: '#aa44ff', 
        x: 0.66, y: 0.62, size: 0.15, rotation: 0, rotationSpeed: -0.00003, depth: 1.1,
        clusters: [
          { id: 'gen', name: 'AI生成', color: '#00ff88', skills: [
            { name: '图像生成', desc: 'AI驱动的图像创作' },
            { name: '视频生成', desc: '从文本到视频的端到端生成' },
            { name: '风格迁移', desc: '艺术风格智能转换' }
          ]},
          { id: 'analysis', name: 'AI分析', color: '#ff88ff', skills: [
            { name: '图像识别', desc: '智能图像内容识别' },
            { name: '视频分析', desc: '视频内容智能分析' },
            { name: '语音识别', desc: '精准语音转文字' }
          ]}
        ]
      }
    ];
    
    let stars = [];
    let warpStars = [];
    let nebulaStars = [];
    
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initStars();
    }
    
    function initStars() {
      stars = [];
      for (let i = 0; i < 600; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 1.5 + 0.3,
          brightness: Math.random() * 0.5 + 0.3,
          twinkle: Math.random() * Math.PI * 2,
          depth: Math.floor(Math.random() * 3)
        });
      }
    }
    
    function drawBackgroundStars() {
      stars.forEach(star => {
        star.twinkle += 0.0005;
        const alpha = star.brightness * 0.6 + Math.sin(star.twinkle) * 0.05;
        
        const parallaxX = (mouseX - width/2) * star.depth * 0.002;
        const parallaxY = (mouseY - height/2) * star.depth * 0.002;
        const x = ((star.x + parallaxX) % width + width) % width;
        const y = ((star.y + parallaxY) % height + height) % height;
        
        const starGlow = ctx.createRadialGradient(x, y, 0, x, y, star.size * 4);
        starGlow.addColorStop(0, `rgba(180, 190, 220, ${alpha})`);
        starGlow.addColorStop(0.5, `rgba(180, 190, 220, ${alpha * 0.3})`);
        starGlow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(x, y, star.size * 4, 0, Math.PI * 2);
        ctx.fillStyle = starGlow;
        ctx.fill();
      });
    }
    
    function drawGalaxy(g) {
      const baseSize = Math.min(width, height) * g.size;
      const depth = g.depth || 1;
      const perspective = 800;
      const z = depth * 200;
      const scale = perspective / (perspective + z);
      
      let cx = width * g.x;
      let cy = height * g.y;
      
      const parallaxX = (mouseX - width/2) * (1 - depth) * 0.05;
      const parallaxY = (mouseY - height/2) * (1 - depth) * 0.05;
      cx += parallaxX;
      cy += parallaxY;
      
      const size = baseSize * scale;
      
      g.rotation += g.rotationSpeed;
      
      const dist = Math.hypot(mouseX - cx, mouseY - cy);
      const isHovered = dist < size * 1.5;
      const hoverScale = isHovered ? 1.1 : 1;
      const finalScale = scale * hoverScale;
      const glowIntensity = isHovered ? 1.3 : 1 * (2 - depth);
      
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(finalScale, finalScale);
      
      const tiltAngle = Math.sin(g.rotation * 0.5) * 0.1;
      ctx.rotate(tiltAngle);
      
      // 多层模糊光晕 - 颜色作为背景弥散（3D效果）
      for (let i = 0; i < 12; i++) {
        const r = baseSize * (0.4 + i * 0.18);
        const alpha = 0.05 * glowIntensity / (i * 0.2 + 1) * (2 - depth);
        const gradient = ctx.createRadialGradient(0, 0, baseSize * 0.05, 0, 0, r);
        gradient.addColorStop(0, 'transparent');
        gradient.addColorStop(0.3, g.color + Math.floor(Math.min(alpha * 2, 0.5) * 255).toString(16).padStart(2, '0'));
        gradient.addColorStop(0.6, g.color + Math.floor(Math.min(alpha, 0.3) * 255).toString(16).padStart(2, '0'));
        gradient.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }
      
      ctx.save();
      ctx.rotate(g.rotation);
      
      // 核心光晕 - 模糊背景，无具体轮廓（3D效果）
      const coreGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, baseSize * 0.5);
      coreGradient.addColorStop(0, g.color + '20');
      coreGradient.addColorStop(0.3, g.color + '12');
      coreGradient.addColorStop(0.6, g.color + '06');
      coreGradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(0, 0, baseSize * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = coreGradient;
      ctx.fill();
      
      // 3D感的颜色弥散层 - 模拟光晕的3D厚度
      for (let layer = 0; layer < 3; layer++) {
        const layerOffset = (layer - 1) * 0.05;
        const layerAlpha = (1 - Math.abs(layerOffset)) * 0.8;
        
        for (let i = 0; i < 4; i++) {
          const angle = (i / 4) * Math.PI * 2 + g.rotation;
          const r = baseSize * (0.3 + layerOffset);
          const sx = Math.cos(angle) * r;
          const sy = Math.sin(angle) * r + layerOffset * baseSize * 0.3;
          
          const diffuseGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, baseSize * 0.25);
          diffuseGlow.addColorStop(0, g.color + Math.floor(16 * layerAlpha).toString(16).padStart(2, '0'));
          diffuseGlow.addColorStop(0.5, g.color + Math.floor(8 * layerAlpha).toString(16).padStart(2, '0'));
          diffuseGlow.addColorStop(1, 'transparent');
          ctx.beginPath();
          ctx.arc(sx, sy, baseSize * 0.25, 0, Math.PI * 2);
          ctx.fillStyle = diffuseGlow;
          ctx.fill();
        }
      }
      
      // 恒星群位置模糊光晕 - 仅作为颜色背景提示（3D效果）
      g.clusters.forEach((cluster, idx) => {
        const angle = (idx / g.clusters.length) * Math.PI * 2 + g.rotation;
        const r = baseSize * 0.35;
        const sx = Math.cos(angle) * r;
        const sy = Math.sin(angle) * r;
        
        const clusterGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, baseSize * 0.2);
        clusterGlow.addColorStop(0, cluster.color + '20');
        clusterGlow.addColorStop(0.5, cluster.color + '10');
        clusterGlow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(sx, sy, baseSize * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = clusterGlow;
        ctx.fill();
      });
      
      ctx.restore();
      
      // 3D阴影效果
      const shadowGradient = ctx.createRadialGradient(baseSize * 0.1, baseSize * 0.1, 0, 0, 0, baseSize * 0.4);
      shadowGradient.addColorStop(0, 'rgba(0, 0, 0, 0.15)');
      shadowGradient.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(0, 0, baseSize * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = shadowGradient;
      ctx.fill();
      
      ctx.restore();
      
      if (isHovered) {
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = g.color + '70';
        ctx.shadowColor = g.color;
        ctx.shadowBlur = 10;
        ctx.fillText(g.name, cx, cy + size * 1.4);
        ctx.shadowBlur = 0;
      }
    }
    
    function startWarp(target, type) {
      warpTarget = { target, type };
      currentState = STATE.WARP;
      warpProgress = 0;
      
      warpStars = [];
      for (let i = 0; i < 400; i++) {
        warpStars.push({
          angle: Math.random() * Math.PI * 2,
          distance: Math.random() * Math.max(width, height) * 2,
          size: Math.random() * 2 + 0.5,
          color: ['#ffffff', '#aaddff', '#ffffaa'][Math.floor(Math.random() * 3)]
        });
      }
    }
    
    function renderWarp() {
      warpProgress += 0.015;
      
      ctx.fillStyle = '#000005';
      ctx.fillRect(0, 0, width, height);
      
      const speed = 1 + warpProgress * 10;
      
      warpStars.forEach(star => {
        star.distance -= star.size * speed * 5;
        if (star.distance < 0) star.distance = Math.max(width, height) * 2;
        
        const x = width/2 + Math.cos(star.angle) * star.distance;
        const y = height/2 + Math.sin(star.angle) * star.distance;
        
        const streakLength = Math.min(star.distance * 0.1 * speed, 600);
        const endX = width/2 + Math.cos(star.angle) * (star.distance + streakLength);
        const endY = height/2 + Math.sin(star.angle) * (star.distance + streakLength);
        
        const gradient = ctx.createLinearGradient(x, y, endX, endY);
        gradient.addColorStop(0, star.color);
        gradient.addColorStop(1, 'transparent');
        
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = gradient;
        ctx.lineWidth = star.size * (1 + warpProgress);
        ctx.lineCap = 'round';
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(x, y, star.size * (1 + warpProgress * 0.5), 0, Math.PI * 2);
        ctx.fillStyle = star.color;
        ctx.fill();
      });
      
      if (warpProgress > 0.5) {
        const intensity = (warpProgress - 0.5) / 0.5;
        const color = warpTarget.type === 'galaxy' ? warpTarget.target.color : warpTarget.target.color;
        const centerGlow = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width * 0.5);
        centerGlow.addColorStop(0, color + Math.floor(intensity * 230).toString(16).padStart(2, '0'));
        centerGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = centerGlow;
        ctx.fillRect(0, 0, width, height);
      }
      
      if (warpProgress >= 1) {
        if (warpTarget.type === 'galaxy') {
          selectedGalaxy = warpTarget.target;
          initNebula();
          currentState = STATE.NEBULA;
        } else {
          selectedCluster = warpTarget.target;
          currentState = STATE.CLUSTER;
        }
        updateBreadcrumbs();
      }
    }
    
    function initNebula() {
      nebulaStars = [];
      const cx = width / 2;
      const cy = height / 2;
      const radius = Math.min(width, height) * 0.4;
      
      for (let i = 0; i < 300; i++) {
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * radius;
        nebulaStars.push({
          x: cx + Math.cos(angle) * r,
          y: cy + Math.sin(angle) * r,
          size: Math.random() * 2 + 0.5,
          color: selectedGalaxy.color
        });
      }
    }
    
    function renderNebula() {
      const cx = width / 2;
      const cy = height / 2;
      
      const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height));
      bgGradient.addColorStop(0, selectedGalaxy.color + '30');
      bgGradient.addColorStop(1, '#000005');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, width, height);
      
      drawBackgroundStars();
      
      nebulaStars.forEach(star => {
        const starGlow = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.size * 3);
        starGlow.addColorStop(0, star.color + '70');
        starGlow.addColorStop(0.5, star.color + '30');
        starGlow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size * 3, 0, Math.PI * 2);
        ctx.fillStyle = starGlow;
        ctx.fill();
      });
      
      selectedGalaxy.clusters.forEach((cluster, idx) => {
        const angle = (idx / selectedGalaxy.clusters.length) * Math.PI * 2;
        const r = Math.min(width, height) * 0.25;
        const clusterX = cx + Math.cos(angle) * r;
        const clusterY = cy + Math.sin(angle) * r;
        
        const dist = Math.hypot(mouseX - clusterX, mouseY - clusterY);
        const isHovered = dist < 70;
        
        const glowSize = isHovered ? 100 : 60;
        const glow = ctx.createRadialGradient(clusterX, clusterY, 0, clusterX, clusterY, glowSize);
        glow.addColorStop(0, cluster.color + '80');
        glow.addColorStop(0.5, cluster.color + '40');
        glow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(clusterX, clusterY, glowSize, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
        
        // 连接线到中心 - 仅用光晕
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(clusterX, clusterY);
        ctx.strokeStyle = cluster.color + '30';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 恒星群核心 - 仅用光晕
        const coreGlow = ctx.createRadialGradient(clusterX, clusterY, 0, clusterX, clusterY, isHovered ? 20 : 15);
        coreGlow.addColorStop(0, cluster.color + '80');
        coreGlow.addColorStop(0.5, cluster.color + '40');
        coreGlow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(clusterX, clusterY, isHovered ? 20 : 15, 0, Math.PI * 2);
        ctx.fillStyle = coreGlow;
        ctx.fill();
        
        // 恒星群中的小星星光晕
        for (let i = 0; i < 8; i++) {
          const sa = Math.random() * Math.PI * 2;
          const sr = Math.random() * 25 + 15;
          const sx = clusterX + Math.cos(sa) * sr;
          const sy = clusterY + Math.sin(sa) * sr;
          
          const miniGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 5);
          miniGlow.addColorStop(0, cluster.color + '60');
          miniGlow.addColorStop(1, 'transparent');
          ctx.beginPath();
          ctx.arc(sx, sy, 5, 0, Math.PI * 2);
          ctx.fillStyle = miniGlow;
          ctx.fill();
        }
        
        if (isHovered) {
          ctx.font = '16px Arial';
          ctx.textAlign = 'center';
          ctx.fillStyle = cluster.color + '99';
          ctx.shadowColor = cluster.color;
          ctx.shadowBlur = 20;
          ctx.fillText(cluster.name, clusterX, clusterY + 50);
          ctx.shadowBlur = 0;
          
          ctx.font = '12px Arial';
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.fillText(`${cluster.skills.length} 个技能`, clusterX, clusterY + 70);
        }
      });
      
      // 星系中心名称
      ctx.font = '24px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = selectedGalaxy.color + '80';
      ctx.shadowColor = selectedGalaxy.color;
      ctx.shadowBlur = 30;
      ctx.fillText(selectedGalaxy.name, cx, cy);
      ctx.shadowBlur = 0;
    }
    
    function renderCluster() {
      const cx = width / 2;
      const cy = height / 2;
      
      const bgGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(width, height));
      bgGradient.addColorStop(0, selectedCluster.color + '40');
      bgGradient.addColorStop(1, '#000005');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, width, height);
      
      drawBackgroundStars();
      
      // 连接线 - 仅用光晕效果
      selectedCluster.skills.forEach((skill, idx) => {
        const angle = (idx / selectedCluster.skills.length) * Math.PI * 2;
        const r = Math.min(width, height) * 0.3;
        const skillX = cx + Math.cos(angle) * r;
        const skillY = cy + Math.sin(angle) * r;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(skillX, skillY);
        ctx.strokeStyle = '#ffffff20';
        ctx.lineWidth = 2;
        ctx.stroke();
      });
      
      // 技能星星 - 仅用光晕效果
      selectedCluster.skills.forEach((skill, idx) => {
        const angle = (idx / selectedCluster.skills.length) * Math.PI * 2;
        const r = Math.min(width, height) * 0.3;
        const skillX = cx + Math.cos(angle) * r;
        const skillY = cy + Math.sin(angle) * r;
        
        const dist = Math.hypot(mouseX - skillX, mouseY - skillY);
        const isHovered = dist < 30;
        
        const glowSize = isHovered ? 50 : 25;
        const glow = ctx.createRadialGradient(skillX, skillY, 0, skillX, skillY, glowSize);
        glow.addColorStop(0, selectedCluster.color + '90');
        glow.addColorStop(0.5, selectedCluster.color + '50');
        glow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(skillX, skillY, glowSize, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
        
        // 技能核心光晕
        const coreGlow = ctx.createRadialGradient(skillX, skillY, 0, skillX, skillY, isHovered ? 12 : 8);
        coreGlow.addColorStop(0, '#ffffff80');
        coreGlow.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(skillX, skillY, isHovered ? 12 : 8, 0, Math.PI * 2);
        ctx.fillStyle = coreGlow;
        ctx.fill();
        
        if (isHovered) {
          ctx.font = '14px Arial';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(skill.name, skillX, skillY + 40);
          
          const infoPanel = document.getElementById('infoPanel');
          document.getElementById('infoTitle').textContent = skill.name;
          document.getElementById('infoSubtitle').textContent = selectedCluster.name;
          document.getElementById('infoDesc').textContent = skill.desc;
          infoPanel.classList.add('visible');
        }
      });
      
      // 恒星群中心名称
      ctx.font = '20px Arial';
      ctx.textAlign = 'center';
      ctx.fillStyle = selectedCluster.color + '80';
      ctx.shadowColor = selectedCluster.color;
      ctx.shadowBlur = 30;
      ctx.fillText(selectedCluster.name, cx, cy);
      ctx.shadowBlur = 0;
    }
    
    function renderUniverse() {
      const bgGradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height));
      bgGradient.addColorStop(0, '#000015');
      bgGradient.addColorStop(1, '#000005');
      ctx.fillStyle = bgGradient;
      ctx.fillRect(0, 0, width, height);
      
      drawBackgroundStars();
      
      galaxies.sort((a, b) => (b.depth || 1) - (a.depth || 1)).forEach(drawGalaxy);
    }
    
    function render() {
      switch (currentState) {
        case STATE.UNIVERSE: renderUniverse(); break;
        case STATE.WARP: renderWarp(); break;
        case STATE.NEBULA: renderNebula(); break;
        case STATE.CLUSTER: renderCluster(); break;
      }
      requestAnimationFrame(render);
    }
    
    function updateBreadcrumbs() {
      const bc = document.getElementById('breadcrumbs');
      bc.classList.add('visible');
      
      document.getElementById('bcUniverse').className = 'breadcrumb-item';
      document.getElementById('bcNebula').className = 'breadcrumb-item';
      document.getElementById('bcCluster').className = 'breadcrumb-item';
      
      if (currentState === STATE.NEBULA) {
        document.getElementById('bcUniverse').className = 'breadcrumb-item active';
        document.getElementById('bcNebula').className = 'breadcrumb-item active';
        document.getElementById('bcNebula').textContent = selectedGalaxy?.name || '星云';
      } else if (currentState === STATE.CLUSTER) {
        document.getElementById('bcUniverse').className = 'breadcrumb-item active';
        document.getElementById('bcNebula').className = 'breadcrumb-item active';
        document.getElementById('bcCluster').className = 'breadcrumb-item active';
        document.getElementById('bcNebula').textContent = selectedGalaxy?.name || '星云';
        document.getElementById('bcCluster').textContent = selectedCluster?.name || '恒星群';
      }
    }
    
    canvas.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      
      if (currentState === STATE.CLUSTER) {
        let isHovering = false;
        selectedCluster.skills.forEach((skill, idx) => {
          const angle = (idx / selectedCluster.skills.length) * Math.PI * 2;
          const r = Math.min(width, height) * 0.3;
          const skillX = width/2 + Math.cos(angle) * r;
          const skillY = height/2 + Math.sin(angle) * r;
          const dist = Math.hypot(mouseX - skillX, mouseY - skillY);
          if (dist < 30) isHovering = true;
        });
        if (!isHovering) {
          document.getElementById('infoPanel').classList.remove('visible');
        }
      }
    });
    
    canvas.addEventListener('click', e => {
      if (currentState === STATE.UNIVERSE) {
        galaxies.forEach(g => {
          const cx = width * g.x;
          const cy = height * g.y;
          const size = Math.min(width, height) * g.size;
          const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
          if (dist < size * 1.2) {
            startWarp(g, 'galaxy');
          }
        });
      } else if (currentState === STATE.NEBULA) {
        selectedGalaxy.clusters.forEach(cluster => {
          const angle = (selectedGalaxy.clusters.indexOf(cluster) / selectedGalaxy.clusters.length) * Math.PI * 2;
          const r = Math.min(width, height) * 0.25;
          const clusterX = width/2 + Math.cos(angle) * r;
          const clusterY = height/2 + Math.sin(angle) * r;
          const dist = Math.hypot(e.clientX - clusterX, e.clientY - clusterY);
          if (dist < 70) {
            startWarp(cluster, 'cluster');
          }
        });
      }
    });
    
    document.getElementById('bcUniverse').addEventListener('click', () => {
      currentState = STATE.UNIVERSE;
      selectedGalaxy = null;
      selectedCluster = null;
      document.getElementById('breadcrumbs').classList.remove('visible');
      document.getElementById('infoPanel').classList.remove('visible');
    });
    
    document.getElementById('bcNebula').addEventListener('click', () => {
      if (selectedGalaxy) {
        currentState = STATE.NEBULA;
        selectedCluster = null;
        document.getElementById('infoPanel').classList.remove('visible');
      }
    });
    
    document.getElementById('searchInput').addEventListener('input', e => {
      const query = e.target.value.toLowerCase();
      if (!query) return;
      
      const matched = galaxies.find(g => g.name.includes(query) || g.id.includes(query));
      if (matched) {
        startWarp(matched, 'galaxy');
      }
    });
    
    resize();
    render();
  </script>
</body>
</html>
