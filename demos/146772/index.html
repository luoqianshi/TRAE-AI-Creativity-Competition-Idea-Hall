<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>如果我老了 · V2</title>
  <style>
    :root {

    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%} body{min-height:100vh;overflow-x:hidden}
    button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid rgba(31,116,106,.28);outline-offset:3px}

    .scene-list{display:grid;gap:9px;margin:24px 0}.scene{min-height:66px;border:1px solid var(--line);background:transparent;padding:0 15px;display:flex;align-items:center;justify-content:space-between;text-align:left}.scene.active{border:2px solid var(--ink);background:var(--surface)}.scene strong{display:block;font-size:15px}.scene small{display:block;color:var(--muted);margin-top:4px}.scene-state{font-size:11px;color:var(--muted)}
    .age-head{display:flex;align-items:end;justify-content:space-between;margin-top:25px}.age-head span{color:var(--muted);font-size:13px}.age{font-size:44px;font-weight:790;line-height:1;font-variant-numeric:tabular-nums}.age small{font-size:15px;margin-left:3px}input[type=range]{width:100%;accent-color:var(--coral);margin-top:14px}.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
    .score-line{margin-top:22px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.score-top{display:flex;align-items:end;justify-content:space-between}.score-title{font-size:13px;color:var(--muted)}.score{font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}.score small{font-size:13px;color:var(--muted)}.bar{height:7px;background:#dcdbd4;margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:92%;background:var(--teal);transition:width .2s,background .2s}
    .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;margin:18px 0 0}.metric{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.metric b{color:var(--ink);font-variant-numeric:tabular-nums}
    .primary{width:100%;min-height:54px;border:0;background:var(--ink);color:white;font-weight:760;font-size:15px;margin-top:22px;transition:transform .18s,background .18s}.primary:hover:not(:disabled){transform:translateY(-2px);background:var(--coral-dark)}.primary:disabled{opacity:.3;cursor:not-allowed}.secondary{width:100%;min-height:48px;border:1px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;margin-top:10px}.small-note{font-size:12px;line-height:1.6;color:var(--muted);margin:11px 0 0}
    .live{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}.live-title{font-size:12px;color:var(--muted);margin-bottom:13px}.live-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.live-stat{background:rgba(255,253,248,.7);padding:13px 10px}.live-stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.live-stat span{font-size:11px;color:var(--muted)}
    .diagnoses{display:grid;gap:9px;margin-top:19px}.diagnosis{border-left:3px solid var(--danger);background:rgba(255,253,248,.75);padding:12px 13px}.diagnosis-top{display:flex;justify-content:space-between;font-size:13px;font-weight:750}.diagnosis-top span{color:var(--danger);font-size:11px}.diagnosis p{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 0}
    .engine-steps{margin-top:20px}.engine-step{display:grid;grid-template-columns:27px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}.engine-step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-style:normal;font-size:11px}.engine-step.active{color:var(--ink);font-weight:700}.engine-step.active i{background:var(--ink);border-color:var(--ink);color:white}.engine-step.done i{background:var(--teal);border-color:var(--teal);color:white}.engine-step small{font-size:11px;color:var(--teal)}
    .comparison{margin-top:20px}.compare-row{display:grid;grid-template-columns:90px 1fr 54px;gap:10px;align-items:center;margin:13px 0;font-size:12px}.compare-track{height:9px;background:#dfddd6;position:relative}.compare-track i{display:block;height:100%}.before{background:var(--danger)}.after{background:var(--teal)}.compare-row b{text-align:right;font-variant-numeric:tabular-nums}.final-quote{font-size:20px;line-height:1.5;margin:24px 0 0;font-weight:750}
    .workspace{min-height:760px;position:relative;display:grid;place-items:center;border-left:1px solid var(--line);overflow:visible}.workspace-head{position:absolute;top:2px;left:31px;right:0;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}.live-dot{display:flex;align-items:center;gap:7px}.live-dot::before{content:"";width:7px;height:7px;background:var(--coral);border-radius:50%}
    .phone{width:var(--phone-w);height:var(--phone-h);border:10px solid #252824;border-radius:34px;background:var(--surface);position:relative;overflow:hidden;box-shadow:0 24px 60px rgba(32,35,31,.16)}.phone::before{content:"";position:absolute;z-index:30;top:8px;left:50%;transform:translateX(-50%);width:84px;height:20px;border-radius:12px;background:#252824}.status{height:36px;display:flex;align-items:center;justify-content:space-between;padding:8px 18px 0;font-size:10px;font-weight:750}.screen{height:calc(100% - 36px);position:relative;overflow:hidden;background:#f6f7f4}
    .app-head{background:#3e7b74;color:white;padding:17px 15px 18px}.app-brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:750}.plus{width:25px;height:25px;border-radius:50%;background:white;color:#3e7b74;display:grid;place-items:center;font-weight:900}.search{height:31px;margin-top:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);padding:8px 9px;font-size:10px;color:rgba(255,255,255,.85)}
    .app-banner{height:72px;margin:11px 11px 5px;background:#f1e0b7;padding:13px;position:relative;overflow:hidden}.app-banner strong{display:block;font-size:13px}.app-banner span{font-size:9px;color:#725f39}.app-banner::after{content:"";position:absolute;width:62px;height:62px;border:11px solid rgba(185,121,29,.2);border-radius:50%;right:-6px;top:-16px}
    .service-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:9px 10px 13px;background:white}.service{border:0;background:transparent;font-size:9px;color:#505650;padding:3px 0}.service i{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 4px;border-radius:50%;border:1px solid #dfe3de;background:white;color:#3e7b74;font-style:normal}
    .app-section{margin-top:7px;background:white;padding:13px 11px}.section-title{display:flex;justify-content:space-between;font-size:12px;font-weight:750}.section-title span{font-size:9px;color:#8a908a;font-weight:500}.row-btn{width:100%;border:0;border-bottom:1px solid #ecece8;background:white;min-height:57px;display:flex;align-items:center;text-align:left;padding:8px 3px;gap:10px}.row-btn:hover{background:#f6f5f0}.row-icon{width:34px;height:34px;border-radius:50%;background:#dfe5e1;display:grid;place-items:center;color:#3e7b74;font-size:11px;flex:0 0 auto}.row-text{flex:1;min-width:0}.row-text strong{font-size:11px}.row-text small{display:block;color:#929792;font-size:9px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny{font-size:9px;padding:5px 6px;background:#e6f1ed;color:#3e7b74}.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:49px;background:white;border-top:1px solid #e5e6e1;display:grid;grid-template-columns:repeat(4,1fr);place-items:center;font-size:9px;color:#838983}
    .back{border:0;background:transparent;color:white;padding:0 7px 0 0;font-size:18px}.page-title{font-size:16px;font-weight:750}.dense-list{background:white;padding:5px 10px 58px}.dense-btn{width:100%;min-height:45px;border:0;border-bottom:1px solid #ecece8;background:white;text-align:left;padding:8px;font-size:11px;display:flex;justify-content:space-between;align-items:center}.dense-btn small{color:#979c97}.dense-btn:hover{background:#f5f5f0}.date-chip{font-size:9px;border:1px solid #d5d7d1;padding:6px 7px;color:#777d77}
    .modern{background:var(--surface);height:100%}.modern-head{padding:19px 19px 16px;border-bottom:1px solid #dedfd9}.modern-brand{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:780}.modern .plus{background:var(--teal);color:white}.task{margin-top:14px;background:var(--teal-soft);padding:12px 13px;color:#174f49;font-size:12px;line-height:1.45}.stepper{display:flex;gap:5px;margin-top:14px}.stepper i{height:4px;flex:1;background:#d2d7d2}.stepper i.on{background:var(--teal)}.modern-body{padding:19px}.modern-body h2{font-size:23px;margin:0 0 6px}.modern-body>p{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 16px}.choice{width:100%;min-height:59px;border:1px solid #cfd2cc;background:white;margin-bottom:10px;padding:0 15px;display:flex;justify-content:space-between;align-items:center;text-align:left;font-weight:730}.choice small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.choice em{font-style:normal;color:var(--teal);font-size:12px}.choice:hover,.choice.selected{border:2px solid var(--teal);background:#f2f8f5}.big-confirm{width:100%;min-height:55px;border:0;background:var(--teal);color:white;font-weight:780;font-size:15px;margin-top:5px}.assist{text-align:center;color:var(--muted);font-size:11px;margin-top:17px}
    .toast{position:absolute;z-index:40;left:50%;bottom:68px;transform:translateX(-50%) translateY(12px);width:76%;padding:12px 14px;background:var(--ink);color:white;font-size:11px;line-height:1.5;opacity:0;transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .heat{position:absolute;z-index:18;border:2px solid var(--danger);background:rgba(182,65,58,.09);opacity:0;pointer-events:none}.phone.heatmap .heat{opacity:1}.heat::after{content:attr(data-note);position:absolute;left:-2px;top:-22px;background:var(--danger);color:white;font-size:8px;padding:4px 6px;white-space:nowrap}.h1{left:10px;top:184px;width:334px;height:92px}.h2{right:12px;top:390px;width:38px;height:27px}.h3{left:10px;top:342px;width:334px;height:45px}
    .scan{position:absolute;z-index:35;top:0;bottom:0;width:5px;left:-15px;background:white;box-shadow:0 0 19px 6px white,0 0 43px 15px rgba(31,116,106,.5);opacity:0}.phone.scanning .scan{opacity:1;animation:sweep 3.6s cubic-bezier(.7,0,.25,1) forwards}@keyframes sweep{to{left:calc(100% + 15px)}}
    .ghost-layer{position:absolute;z-index:45;inset:0;pointer-events:none;opacity:0}.phone.ghosting .ghost-layer{opacity:1}.ghost-path{position:absolute;height:3px;transform-origin:0 50%;opacity:.65}.ghost-path.red{background:var(--danger)}.ghost-path.green{background:var(--teal)}.cursor{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 2px 7px rgba(0,0,0,.28)}.cursor.red{background:var(--danger);animation:redRoute 7s linear infinite}.cursor.green{background:var(--teal);animation:greenRoute 4s linear infinite}@keyframes redRoute{0%{left:44px;top:126px}20%{left:260px;top:170px}36%{left:72px;top:260px}58%{left:286px;top:415px}80%{left:120px;top:480px}100%{left:290px;top:550px}}@keyframes greenRoute{0%{left:58px;top:198px}34%{left:285px;top:290px}68%{left:72px;top:395px}100%{left:270px;top:520px}}
    .floating-result{position:absolute;z-index:55;right:-13px;bottom:66px;background:var(--ink);color:white;width:196px;padding:14px 15px;opacity:0;transform:translateY(10px);transition:.3s}.floating-result.show{opacity:1;transform:translateY(0)}.floating-result strong{font-size:22px}.floating-result span{display:block;font-size:10px;color:#c9d0c9;margin-top:5px}.floating-result b{display:block;color:#8dd3c3;font-size:11px;margin-top:9px}
    @media(max-width:900px){header{padding:0 17px}.version{display:none}main{width:min(100% - 28px,570px);grid-template-columns:minmax(0,1fr);gap:25px;padding:28px 0 42px}h1{font-size:38px}.workspace{border-left:0;border-top:1px solid var(--line);min-height:750px;padding-top:28px}.workspace-head{left:0;top:8px}.panel{min-width:0}.floating-result{right:0}}
    @media(max-width:430px){:root{--phone-w:344px;--phone-h:650px}main{width:100vw;max-width:100vw;margin:0;padding:26px 14px 38px;overflow:hidden}main>*{min-width:0;max-width:100%}h1{font-size:34px}.age-head,.score-top{display:grid;grid-template-columns:minmax(0,1fr) auto}.workspace{min-height:700px}.h1,.h3{width:304px}.floating-result{bottom:16px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div class="brand"><span class="mark">时</span><span>如果我老了</span><span class="version">未来可用性实验 · V2</span></div><div class="top-actions"><button class="text-btn" id="restart">重新开始</button></div></header>
    <main>
      <section class="panel" id="panel" aria-live="polite"></section>
      <section class="workspace" aria-label="医院界面互动实验">
        <div class="workspace-head"><span class="live-dot" id="workspaceState">等待开始</span><span>示例界面 · 安心市民医院</span></div>
        <div class="phone" id="phone"><div class="status"><span>9:41</span><span>5G · 82%</span></div><div class="screen" id="screen"></div><div class="scan"></div><div class="ghost-layer"><div class="cursor red"></div><div class="cursor green"></div></div></div>
        <div class="floating-result" id="floatingResult"><strong>31 → 89</strong><span>同一个人 · 同一个任务</span><b>改变的只是界面</b></div>
      </section>
    </main>
  </div>
  <script>
    const panel=document.querySelector('#panel'),screen=document.querySelector('#screen'),phone=document.querySelector('#phone'),workspaceState=document.querySelector('#workspaceState'),floatingResult=document.querySelector('#floatingResult');
    const state={stage:'intro',age:20,attempt:1,step:'home',startedAt:0,timer:null,elapsed:0,wrong:0,back:0,clicks:0,first:null,second:null,engineStep:0};
    const services=['在线问诊','报告查询','门诊缴费','院内导航','住院服务','体检中心','健康档案'];
    const oldSteps=['home','departments','doctors','schedule','confirm'];
    const newSteps=['departments','schedule','confirm'];
    const score=age=>Math.round(92-Math.pow((age-20)/55,1.32)*61);
    const sec=n=>`${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`;

    function oldHeader(title='安心市民医院',back=false){return `<div class="app-head"><div class="app-brand">${back?'<button class="back" data-action="back">‹</button>':'<span class="plus">+</span>'}<span>${title}</span></div>${back?'':'<div class="search">搜索医生、科室、疾病、服务</div>'}</div>`}
    function modernHeader(step){return `<div class="modern-head"><div class="modern-brand"><span class="plus">+</span>安心市民医院</div><div class="task"><strong>当前任务</strong><br>预约明天上午的心内科</div><div class="stepper"><i class="on"></i><i class="${step>=2?'on':''}"></i><i class="${step>=3?'on':''}"></i></div></div>`}
    function oldHome(){return `${oldHeader()}<div class="app-banner"><strong>健康管理月</strong><span>线上问诊享便民服务优惠</span></div><div class="service-grid"><button class="service" data-action="book"><i>挂</i>预约挂号</button>${services.map((x,i)=>`<button class="service" data-action="wrong"><i>${['诊','报','缴','导','住','检','全'][i]}</i>${x}</button>`).join('')}</div><div class="app-section"><div class="section-title">热门科室 <span>查看全部 ›</span></div><button class="row-btn" data-action="wrong"><span class="row-icon">心</span><span class="row-text"><strong>心内科 · 李敏主任</strong><small>冠心病、高血压、心律失常诊疗</small></span><span class="tiny">预约</span></button><button class="row-btn" data-action="wrong"><span class="row-icon">呼</span><span class="row-text"><strong>呼吸科 · 陈晓主任</strong><small>慢性咳嗽、哮喘、肺部疾病</small></span><span class="tiny">预约</span></button></div><div class="bottom-nav"><span>首页</span><span>服务</span><span>消息</span><span>我的</span></div>`}
    function oldDepartments(){const ds=['内科','外科','妇产科','儿科','眼科','耳鼻喉科','口腔科','皮肤科','神经内科','消化内科','内分泌科','心内科','肾内科'];return `${oldHeader('选择科室',true)}<div class="dense-list"><div class="section-title" style="padding:9px 7px">全部科室 <span>按名称排序</span></div>${ds.map(x=>`<button class="dense-btn" data-action="${x==='心内科'?'heart':'wrong'}"><span>${x}</span><small>剩余号源 ›</small></button>`).join('')}</div>`}
    function oldDoctors(){return `${oldHeader('心内科医生',true)}<div class="dense-list"><div class="section-title" style="padding:9px 7px">明日出诊 <span>专家优先</span></div>${['李敏 主任医师','王建国 副主任医师','赵欣 主治医师','周伟 主任医师','孙晴 副主任医师'].map((x,i)=>`<button class="row-btn" data-action="${i===1?'doctor':'wrong'}"><span class="row-icon">${x[0]}</span><span class="row-text"><strong>${x}</strong><small>${i===1?'明日上午有号 · 擅长心律失常':'号源紧张 · 查看详情'}</small></span><span class="tiny">预约</span></button>`).join('')}</div>`}
    function oldSchedule(){return `${oldHeader('选择就诊时间',true)}<div class="dense-list"><div class="section-title" style="padding:9px 7px">王建国 · 心内科 <span>普通门诊</span></div>${['今天 下午','明天 上午','明天 下午','后天 上午','后天 下午'].map((x,i)=>`<button class="dense-btn" data-action="${i===1?'time':'wrong'}"><span>${x}</span><span class="date-chip">${i===0?'已满':'剩余 '+(i+2)+' 号'}</span></button>`).join('')}</div>`}
    function oldConfirm(){return `${oldHeader('确认挂号',true)}<div class="app-section" style="margin:12px"><div class="section-title">预约信息 <span>请仔细核对</span></div><p style="font-size:11px;line-height:1.8;color:#666">心内科 · 王建国副主任医师<br>明天上午 09:20<br>门诊楼 3 层 12 诊室</p><button class="row-btn" data-action="wrong"><span class="row-text"><strong>就诊人：张华</strong><small>身份证尾号 1732</small></span><span class="tiny">切换</span></button><button class="tiny" style="float:right;margin-top:20px;border:0" data-action="finish">确认预约</button></div>`}
    function modernDepartments(){return `<div class="modern">${modernHeader(1)}<div class="modern-body"><h2>选择科室</h2><p>根据本次任务，系统已经将最相关科室置顶。</p><button class="choice selected" data-action="heart"><span>心内科<small>心脏不适、高血压、心律问题</small></span><em>选择 ›</em></button><button class="choice" data-action="wrong"><span>呼吸科<small>咳嗽、哮喘、呼吸困难</small></span><em>选择</em></button><div class="assist">没有找到？使用语音描述症状</div></div></div>`}
    function modernSchedule(){return `<div class="modern">${modernHeader(2)}<div class="modern-body"><h2>选择就诊时间</h2><p>只显示当前任务需要的“明天上午”可预约号源。</p><button class="choice selected" data-action="time"><span>明天上午<small>09:20 · 王建国副主任医师</small></span><em>可预约 ✓</em></button><button class="choice" data-action="wrong"><span>明天下午<small>14:40 · 李敏主任医师</small></span><em>可预约</em></button><div class="assist">需要帮助？让家人远程协助</div></div></div>`}
    function modernConfirm(){return `<div class="modern">${modernHeader(3)}<div class="modern-body"><h2>确认预约</h2><p>信息已经简化，请确认时间和科室。</p><button class="choice selected"><span>心内科 · 明天上午<small>09:20 · 王建国副主任医师</small></span><em>已选择</em></button><button class="big-confirm" data-action="finish">确认预约</button><div class="assist">就诊人：张华 · 信息已核验</div></div></div>`}
    function heatOverlay(){return `<div class="heat h1" data-note="8 个同级入口"></div><div class="heat h2" data-note="按钮仅 28px"></div><div class="heat h3" data-note="任务层级不清"></div>`}
    function renderPhone(){phone.classList.remove('heatmap','ghosting');floatingResult.classList.remove('show');if(state.stage==='diagnosis'){screen.innerHTML=oldHome()+heatOverlay();phone.classList.add('heatmap');return}if(state.stage==='final'){screen.innerHTML=modernConfirm();phone.classList.add('ghosting');floatingResult.classList.add('show');return}const modern=state.attempt===2||state.stage==='redesign';if(modern){screen.innerHTML=state.step==='departments'?modernDepartments():state.step==='schedule'?modernSchedule():modernConfirm()}else{screen.innerHTML=state.step==='home'?oldHome():state.step==='departments'?oldDepartments():state.step==='doctors'?oldDoctors():state.step==='schedule'?oldSchedule():oldConfirm()}attachPhoneEvents()}
    function attachPhoneEvents(){screen.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>handleAction(btn.dataset.action)))}
    function correctAction(){if(state.attempt===1)return {home:'book',departments:'heart',doctors:'doctor',schedule:'time',confirm:'finish'}[state.step];return {departments:'heart',schedule:'time',confirm:'finish'}[state.step]}
    function handleAction(action){if(!['challenge','retry'].includes(state.stage))return;state.clicks++;if(action==='back'){state.back++;const steps=state.attempt===1?oldSteps:newSteps;const i=steps.indexOf(state.step);state.step=steps[Math.max(0,i-1)];renderPhone();renderPanel();return}if(action!==correctAction()){state.wrong++;showToast('这不是当前任务需要的入口');renderPanel();return}const steps=state.attempt===1?oldSteps:newSteps;const i=steps.indexOf(state.step);if(action==='finish'){finishAttempt();return}state.step=steps[i+1];renderPhone();renderPanel()}
    function showToast(text){let t=document.createElement('div');t.className='toast show';t.textContent=text;screen.appendChild(t);setTimeout(()=>t.remove(),1300)}
    function startTimer(){clearInterval(state.timer);state.startedAt=Date.now();state.elapsed=0;state.timer=setInterval(()=>{state.elapsed=Math.floor((Date.now()-state.startedAt)/1000);const el=document.querySelector('#liveTime');if(el)el.textContent=sec(state.elapsed)},1000)}
    function beginChallenge(attempt){state.attempt=attempt;state.stage=attempt===1?'challenge':'retry';state.step=attempt===1?'home':'departments';state.wrong=0;state.back=0;state.clicks=0;workspaceState.textContent=attempt===1?'75 岁挑战进行中':'重构后验证进行中';startTimer();renderPhone();renderPanel()}
    function finishAttempt(){clearInterval(state.timer);const base=state.attempt===1?42:14;const result={time:Math.max(base,state.elapsed),wrong:state.wrong+(state.attempt===1?3:0),back:state.back+(state.attempt===1?1:0),steps:state.attempt===1?6:3};if(state.attempt===1){state.first=result;state.stage='diagnosis';workspaceState.textContent='AI 正在读取行为证据';renderPhone();renderPanel()}else{state.second=result;state.stage='final';workspaceState.textContent='结果验证完成';renderPhone();renderPanel()}}
    function runEngine(){state.stage='redesign';state.engineStep=0;state.attempt=2;state.step='departments';workspaceState.textContent='AI 正在重构界面';phone.classList.add('scanning');renderPhone();renderPanel();const timer=setInterval(()=>{state.engineStep++;renderPanel();if(state.engineStep>=5){clearInterval(timer);setTimeout(()=>{phone.classList.remove('scanning');state.stage='readyRetry';workspaceState.textContent='未来界面已生成';renderPhone();renderPanel()},450)}},650)}
    function panelIntro(){return `<div class="kicker">未来可用性测试 <span class="stage-count">01 / 05</span></div><h1>55 年后，你还会用今天的软件吗？</h1><p class="lead">选择一个日常任务，把界面拖到 75 岁。你会亲手经历问题，也会看见 AI 如何改变结果。</p><div class="scene-list"><button class="scene active"><span><strong>医院挂号</strong><small>预约明天上午的心内科</small></span><span class="scene-state">可体验</span></button><button class="scene" disabled><span><strong>手机支付</strong><small>完成一次生活缴费</small></span><span class="scene-state">即将开放</span></button><button class="scene" disabled><span><strong>视频通话</strong><small>找到并联系家人</small></span><span class="scene-state">即将开放</span></button></div><div class="age-head"><span>你的未来年龄</span><div class="age"><span id="ageValue">${state.age}</span><small>岁</small></div></div><input id="ageSlider" type="range" min="20" max="75" value="${state.age}" aria-label="未来年龄"><div class="ticks"><span>20</span><span>35</span><span>50</span><span>65</span><span>75</span></div><div class="score-line"><div class="score-top"><span class="score-title">未来可用性</span><div class="score"><span id="scoreValue">${score(state.age)}</span><small>/100</small></div></div><div class="bar"><i id="scoreBar" style="width:${score(state.age)}%;background:${score(state.age)<50?'var(--danger)':'var(--teal)'}"></i></div></div><button class="primary" id="startBtn" ${state.age<65?'disabled':''}>${state.age<65?'先把年龄拖到 65 岁以后':'开始 75 岁挂号挑战'}</button><p class="small-note">变老的是你，界面却停留在设计它的那一天。</p>`}
    function panelChallenge(){return `<div class="kicker">亲手完成一次任务 <span class="stage-count">${state.attempt===1?'02':'05'} / 05</span></div><h1>${state.attempt===1?'现在，你 75 岁。':'同一个任务，再来一次。'}</h1><p class="lead">${state.attempt===1?'请在右侧医院 App 中，预约明天上午的心内科。系统只记录操作，不会故意阻止你。':'使用 AI 重构后的界面，完成相同的挂号任务。'}</p><div class="live"><div class="live-title">实时操作记录</div><div class="live-grid"><div class="live-stat"><b id="liveTime">${sec(state.elapsed)}</b><span>用时</span></div><div class="live-stat"><b>${state.wrong}</b><span>误触</span></div><div class="live-stat"><b>${state.back}</b><span>返回</span></div></div></div><div class="score-line"><div class="metric"><span>当前步骤</span><b>${({home:'寻找入口',departments:'选择科室',doctors:'选择医生',schedule:'选择时间',confirm:'确认预约'})[state.step]}</b></div><div class="metric" style="margin-top:10px"><span>目标</span><b>明天上午 · 心内科</b></div></div><p class="small-note">提示：错误入口会被记录，但不会让流程卡死。</p>`}
    function panelDiagnosis(){const f=state.first;return `<div class="kicker">刚才发生了什么 <span class="stage-count">03 / 05</span></div><h1>你没有突然变笨。</h1><p class="lead">系统把你的操作与界面结构对应起来，发现阻力来自设计，而不是年龄本身。</p><div class="live-grid"><div class="live-stat"><b>${f.time}s</b><span>完成时间</span></div><div class="live-stat"><b>${f.wrong}</b><span>误触</span></div><div class="live-stat"><b>${f.steps}</b><span>操作步骤</span></div></div><div class="diagnoses"><div class="diagnosis"><div class="diagnosis-top">入口太密 <span>高风险</span></div><p>首页同时展示 8 个同级入口，挂号任务缺少优先级。</p></div><div class="diagnosis"><div class="diagnosis-top">按钮太小 <span>高风险</span></div><p>关键预约按钮只有约 28px，未来操作容错不足。</p></div><div class="diagnosis"><div class="diagnosis-top">路径太深 <span>中风险</span></div><p>从首页到确认需要跨越 6 个决策步骤。</p></div></div><button class="primary" id="engineBtn">让 AI 重构这个界面</button><p class="small-note">右侧红色区域来自本次任务的界面结构与操作记录。</p>`}
    function panelEngine(){const labels=[['清理无关信息','8 个入口减少为 3 个'],['提升任务入口','心内科自动置顶'],['扩大点击区域','28px 提升至 52px'],['增强状态表达','颜色增加文字说明'],['缩短任务路径','6 步压缩为 3 步']];return `<div class="kicker">AI 适老化重构 <span class="stage-count">04 / 05</span></div><h1>让界面追上时间。</h1><p class="lead">AI 正在根据刚才的行为证据，逐层改变信息、按钮和任务路径。</p><div class="engine-steps">${labels.map((x,i)=>`<div class="engine-step ${state.engineStep>i?'done':state.engineStep===i?'active':''}"><i>${state.engineStep>i?'✓':i+1}</i><span>${x[0]}</span><small>${state.engineStep>=i?x[1]:''}</small></div>`).join('')}</div><p class="small-note">光线扫到哪里，哪里的结构才会发生变化。</p>`}
    function panelReady(){return `<div class="kicker">未来界面已生成 <span class="stage-count">05 / 05</span></div><h1>同一个人，同一个任务。</h1><p class="lead">现在使用重构后的界面，再预约一次明天上午的心内科。结果会告诉我们改造是否真的有效。</p><div class="score-line"><div class="metric"><span>操作步骤</span><b>6 → 3</b></div><div class="metric" style="margin-top:11px"><span>最小点击区域</span><b>28px → 52px</b></div><div class="metric" style="margin-top:11px"><span>任务入口</span><b>从 8 个中寻找 → 自动置顶</b></div></div><button class="primary" id="retryBtn">开始第二次挑战</button><button class="secondary" id="oldBtn">暂时查看原始界面</button>`}
    function panelFinal(){const a=state.first,b=state.second;return `<div class="kicker">结果验证完成 <span class="stage-count">完成</span></div><h1>改变的，只是界面。</h1><p class="lead">红色指针是重构前，绿色指针是重构后。它们正在同时重演同一个挂号任务。</p><div class="comparison"><div class="compare-row"><span>重构前用时</span><div class="compare-track"><i class="before" style="width:100%"></i></div><b>${a.time}s</b></div><div class="compare-row"><span>重构后用时</span><div class="compare-track"><i class="after" style="width:${Math.max(22,Math.round(b.time/a.time*100))}%"></i></div><b>${b.time}s</b></div><div class="compare-row"><span>重构前误触</span><div class="compare-track"><i class="before" style="width:78%"></i></div><b>${a.wrong}</b></div><div class="compare-row"><span>重构后误触</span><div class="compare-track"><i class="after" style="width:${Math.max(8,b.wrong*15)}%"></i></div><b>${b.wrong}</b></div></div><p class="final-quote">人一定会变老。<br>软件也应该学会成长。</p><button class="primary" id="againBtn">再体验一次</button>`}
    function renderPanel(){panel.innerHTML=state.stage==='intro'?panelIntro():['challenge','retry'].includes(state.stage)?panelChallenge():state.stage==='diagnosis'?panelDiagnosis():state.stage==='redesign'?panelEngine():state.stage==='readyRetry'?panelReady():panelFinal();attachPanelEvents()}
    function attachPanelEvents(){const slider=document.querySelector('#ageSlider');if(slider)slider.addEventListener('input',e=>{state.age=Number(e.target.value);renderPanel();renderPhone()});document.querySelector('#startBtn')?.addEventListener('click',()=>beginChallenge(1));document.querySelector('#engineBtn')?.addEventListener('click',runEngine);document.querySelector('#retryBtn')?.addEventListener('click',()=>beginChallenge(2));document.querySelector('#oldBtn')?.addEventListener('click',()=>{phone.classList.toggle('heatmap');screen.innerHTML=phone.classList.contains('heatmap')?oldHome()+heatOverlay():modernDepartments()});document.querySelector('#againBtn')?.addEventListener('click',reset)}
    function reset(){clearInterval(state.timer);Object.assign(state,{stage:'intro',age:20,attempt:1,step:'home',startedAt:0,elapsed:0,wrong:0,back:0,clicks:0,first:null,second:null,engineStep:0});phone.className='phone';workspaceState.textContent='等待开始';renderPhone();renderPanel()}
    document.querySelector('#restart').addEventListener('click',reset);reset();
    const previewState=new URLSearchParams(location.search).get('state');
    if(previewState==='final'){
      Object.assign(state,{stage:'final',age:75,first:{time:76,wrong:5,back:2,steps:6},second:{time:24,wrong:1,back:0,steps:3}});
      workspaceState.textContent='结果验证完成';renderPhone();renderPanel();
    }else if(previewState==='diagnosis'){
      Object.assign(state,{stage:'diagnosis',age:75,first:{time:76,wrong:5,back:2,steps:6}});
      workspaceState.textContent='AI 正在读取行为证据';renderPhone();renderPanel();
    }
  </script>
</body>
</html>
