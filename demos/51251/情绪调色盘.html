<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪调色盘 - 专属氛围</title>
    <style>
        body { margin: 0; height: 100vh; font-family: "Microsoft YaHei", sans-serif; overflow: hidden; background: linear-gradient(45deg, #2c3e50, #4a235a, #1b2631); background-size: 400% 400%; animation: gradient 15s ease infinite; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .container { text-align: center; z-index: 2; padding: 20px; backdrop-filter: blur(5px); background: rgba(0,0,0,0.2); border-radius: 20px; max-width: 90%; }
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 10px; }
        .mood-text { font-size: 18px; opacity: 0.8; margin-bottom: 30px; font-style: italic; }
        .color-name { font-size: 32px; font-weight: bold; margin-bottom: 20px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .player { display: flex; align-items: center; justify-content: center; margin-top: 20px; }
        .play-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border: 1px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; transition: all 0.3s; }
        .play-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }
        .music-info { margin-left: 15px; text-align: left; }
        .track { font-size: 16px; }
        .artist { font-size: 12px; opacity: 0.6; }
        .visualizer { display: flex; align-items: flex-end; height: 30px; gap: 3px; margin-top: 20px; justify-content: center; }
        .bar { width: 4px; background: rgba(255,255,255,0.6); animation: bounce 1s infinite; }
        .bar:nth-child(2) { animation-delay: 0.2s; } .bar:nth-child(3) { animation-delay: 0.4s; } .bar:nth-child(4) { animation-delay: 0.6s; } .bar:nth-child(5) { animation-delay: 0.8s; }
        @keyframes bounce { 0%, 100% { height: 5px; } 50% { height: 25px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>你的专属情绪调色盘</h1>
        <div class="mood-text">"今天周二，下雨，我很累，但又对周末有点小期待"</div>
        <div class="color-name">🌧️ 雾霾紫与深蓝交融</div>
        
        <div class="player">
            <div class="play-btn">▶</div>
            <div class="music-info">
                <div class="track">Rainy Anticipation</div>
                <div class="artist">AI生成氛围白噪音 + 轻爵士</div>
            </div>
        </div>

        <div class="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div>
</body>
</html>
