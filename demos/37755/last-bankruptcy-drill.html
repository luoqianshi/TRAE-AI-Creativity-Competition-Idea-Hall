<div class="container">

  <!-- Header -->
  <header class="app-header">
    <div class="logo">🏪</div>
    <h1>小微企业经营风险评估工具</h1>
    <div class="subtitle">小微经营者风险模拟器 · 用AI预演你的生意危机</div>

  <!-- Step Indicator -->

    <div class="step-dot active" id="stepDot1">
      <div class="circle">1</div>
      <div class="line"></div>
    </div>
    <div class="step-dot" id="stepDot2">
      <div class="circle">2</div>
      <div class="line"></div>
    </div>
    <div class="step-dot" id="stepDot3">
      <div class="circle">3</div>
    </div>
  </div>

  <!-- ==================== STEP 1: 经营数据输入 ==================== -->
  <div class="step active fade-in" id="step1">
    <div class="card">
      <div class="guide-text">像聊天一样告诉我你的生意情况，AI 帮你预演危机</div>

      <div class="form-group">
        <label>经营类型</label>
        <select id="bizType">
          <option value="">请选择经营类型</option>
          <option value="餐饮/茶饮">🍜 餐饮/茶饮</option>
          <option value="零售/便利店">🏪 零售/便利店</option>
          <option value="电商/网店">📱 电商/网店</option>
          <option value="五金/建材">🔧 五金/建材</option>
          <option value="服装加工">👗 服装加工</option>
          <option value="其他">📋 其他</option>
        </select>
      </div>

      <div class="form-row-3">
        <div class="form-group">
          <label>每月固定成本 <span class="hint">（元）</span></label>
          <input type="number" id="monthlyCost" placeholder="如 30000" min="0" step="100">
        </div>
        <div class="form-group">
          <label>每月平均收入 <span class="hint">（元）</span></label>
          <input type="number" id="monthlyRevenue" placeholder="如 50000" min="0" step="100">
        </div>
        <div class="form-group">
          <label>账上现有现金 <span class="hint">（元）</span></label>
          <input type="number" id="cashOnHand" placeholder="如 80000" min="0" step="100">
        </div>
      </div>

      <div class="form-group">
        <label>毛利率 <span class="hint">（%）</span></label>
        <input type="number" id="grossMargin" value="55" min="0" max="100" step="1">
      </div>

      <div class="form-group">
        <label>补充描述 <span class="hint">—— 用你自己的话描述生意情况</span></label>
        <textarea id="extraDesc" placeholder="比如：&quot;开在中学对面，主要做学生生意，寒暑假是淡季&quot; 或 &quot;做了三年，有一批老客户，但最近附近开了两家竞品店&quot;"></textarea>
      </div>

      <div class="warning-msg" id="costWarning">⚠️ 固定成本高于平均收入，当前处于亏损状态，但仍可继续模拟</div>

      <button class="btn btn-primary btn-block btn-lg" onclick="goToStep2()">
        下一步：选择危机情景 →
      </button>
    </div>
  </div>

  <!-- ==================== STEP 2: 风险情景选择 ==================== -->
  <div class="step fade-in" id="step2">
    <div class="card">
      <div class="guide-text">勾选一种或多种你最担心的危机情景（可多选），为每种情景设定严重程度</div>

      <div id="scenarioGridWrapper">
        <!-- Generated by JS -->
      </div>

      <div class="severity-section" id="severitySection">
        <div class="sev-title">选择严重程度：</div>
        <div id="severityList">
          <!-- Generated by JS: one severity row per selected scenario -->
        </div>
      </div>

      <div class="action-bar" style="margin-top: 24px;">
        <button class="btn btn-secondary" onclick="goToStep1()">← 返回修改数据</button>
        <button class="btn btn-primary btn-lg" id="btnStartSim" disabled onclick="runSimulation()">
          🔮 开始模拟
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== STEP 3: 模拟报告 ==================== -->
  <div class="step fade-in" id="step3">
    <div class="card" id="resultCard">
      <!-- Generated by JS -->
    </div>
    <div class="action-bar">
      <button class="btn btn-secondary" onclick="goToStep2()">← 换一个情景再试</button>
      <button class="btn btn-secondary" onclick="goToStep1()">📝 修改经营数据</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ 打印报告</button>
    </div>
  </div>

</div>

// Merge common + industry scenarios for a given biz type
function getScenariosForBizType(bizType) {
  var industry = INDUSTRY_SCENARIOS[bizType] || INDUSTRY_SCENARIOS['其他'];
  return COMMON_SCENARIOS.concat(industry);
}

const TOTAL_WEEKS = 24;
// selectedScenarios: { [idx]: severityKey }

// ==================== STEP MANAGEMENT ====================
function setStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
  // Update step dots
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById('stepDot' + i);
    dot.classList.remove('active', 'done');
    if (i < n) dot.classList.add('done');
    if (i === n) dot.classList.add('active');
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goToStep1() { setStep(1); }
function goToStep2() {
  if (!validateStep1()) return;
  selectedScenarios = {};
  setStep(2);
  renderScenarios();
}
function goToStep3() { setStep(3); }

// ==================== VALIDATION ====================
function validateStep1() {
  const bizType = document.getElementById('bizType').value;
  const monthlyCost = parseFloat(document.getElementById('monthlyCost').value);
  const monthlyRevenue = parseFloat(document.getElementById('monthlyRevenue').value);
  const cashOnHand = parseFloat(document.getElementById('cashOnHand').value);
  const grossMargin = parseFloat(document.getElementById('grossMargin').value);
  const warningEl = document.getElementById('costWarning');

  // Clear previous errors
  document.querySelectorAll('input.error').forEach(el => el.classList.remove('error'));
  warningEl.classList.remove('show');

  let valid = true;
  const fields = [
    { id: 'bizType', val: bizType, msg: '请选择经营类型' },
    { id: 'monthlyCost', val: monthlyCost, msg: '请输入每月固定成本' },
    { id: 'monthlyRevenue', val: monthlyRevenue, msg: '请输入每月平均收入' },
    { id: 'cashOnHand', val: cashOnHand, msg: '请输入账上现有现金' },
    { id: 'grossMargin', val: grossMargin, msg: '请输入毛利率' }
  ];

  for (const f of fields) {
    if (f.id === 'bizType') {
      if (!f.val) { alert(f.msg); valid = false; break; }
      continue;
    }
    if (isNaN(f.val) || f.val < 0) {
      document.getElementById(f.id).classList.add('error');
      alert(f.msg + '（不能为负数）');
      valid = false;
      break;
    }
    if (f.id === 'grossMargin' && (f.val < 0 || f.val > 100)) {
      document.getElementById(f.id).classList.add('error');
      alert('毛利率应在 0-100 之间');
      valid = false;
      break;
    }
  }

  if (valid && monthlyCost > monthlyRevenue) {
    warningEl.classList.add('show');
  }

  return valid;
}

function renderScenarioCardHTML(sc, idx) {
  var isSelected = selectedScenarios.hasOwnProperty(idx);
  return '<div class="scenario-card' + (isSelected ? ' selected' : '') + '" onclick="toggleScenario(' + idx + ')">' +
    '<div class="sc-check">✓</div>' +
    '<div class="sc-badge">已选</div>' +
    '<div class="sc-emoji">' + sc.emoji + '</div>' +
    '<div class="sc-title">' + sc.name + '</div>' +
    '<div class="sc-desc">' + sc.desc + '</div>' +
    '</div>';
}

function renderScenarios() {
  var wrapper = document.getElementById('scenarioGridWrapper');
  var bizType = document.getElementById('bizType').value;
  var currentScenarios = getScenariosForBizType(bizType);
  var commonCount = COMMON_SCENARIOS.length;

  var html = '';

  // Common scenarios section
  html += '<div class="scenario-section-label">🌐 通用风险情景</div>';
  html += '<div class="scenario-grid">';
  for (var i = 0; i < commonCount; i++) {
    html += renderScenarioCardHTML(currentScenarios[i], i);
  }
  html += '</div>';

  // Industry-specific scenarios section
  if (currentScenarios.length > commonCount) {
    html += '<div class="scenario-section-label" style="margin-top:20px;">🏭 「' + bizType + '」行业特有风险</div>';
    html += '<div class="scenario-grid">';
    for (var i = commonCount; i < currentScenarios.length; i++) {
      html += renderScenarioCardHTML(currentScenarios[i], i);
    }
    html += '</div>';
  }

  wrapper.innerHTML = html;

  renderSeverity();
}

function toggleScenario(idx) {
  if (selectedScenarios.hasOwnProperty(idx)) {
    // If already selected, remove it
    delete selectedScenarios[idx];
  } else {
    // Add with default severity (mild)
    selectedScenarios[idx] = 'mild';
  }
  renderScenarios();
  renderSeverity();
  updateStartBtn();
}

function renderSeverity() {
  var section = document.getElementById('severitySection');
  var list = document.getElementById('severityList');

  var bizType = document.getElementById('bizType').value;
  var currentScenarios = getScenariosForBizType(bizType);
  var keys = Object.keys(selectedScenarios);

  if (keys.length === 0) {
    section.classList.remove('show');
    return;
  }

  section.classList.add('show');

  var html = '';
  for (var k = 0; k < keys.length; k++) {
    var idx = parseInt(keys[k]);
    var sc = currentScenarios[idx];
    var curSeverity = selectedScenarios[idx];
    var levels = sc.levels;
    var levelKeys = Object.keys(levels);

    html += '<div class="severity-row">';
    html += '<div class="svr-name">' + sc.emoji + ' ' + sc.name;
    html += '<button class="svr-remove" onclick="removeScenario(' + idx + ')">✕ 移除</button>';
    html += '</div>';
    html += '<div class="severity-btns">';
    for (var j = 0; j < levelKeys.length; j++) {
      var key = levelKeys[j];
      var lv = levels[key];
      html += '<button class="severity-btn' + (curSeverity === key ? ' selected' : '') + '" onclick="setSeverity(' + idx + ',\'' + key + '\')">' +
        lv.label +
        '<span class="sev-level">' + lv.sub + '</span>' +
        '</button>';
    }
    html += '</div>';
    html += '</div>';
  }

  list.innerHTML = html;
}

function setSeverity(idx, key) {
  selectedScenarios[idx] = key;
  renderSeverity();
  updateStartBtn();
}

function removeScenario(idx) {
  delete selectedScenarios[idx];
  renderScenarios();
  renderSeverity();
  updateStartBtn();
}

function updateStartBtn() {
  var keys = Object.keys(selectedScenarios);
  document.getElementById('btnStartSim').disabled = (keys.length === 0);
}

// ==================== SIMULATION ENGINE ====================
function runSimulation() {
  const monthlyCost = parseFloat(document.getElementById('monthlyCost').value);
  const monthlyRevenue = parseFloat(document.getElementById('monthlyRevenue').value);
  const cashOnHand = parseFloat(document.getElementById('cashOnHand').value);
  const grossMargin = parseFloat(document.getElementById('grossMargin').value) / 100;
  const bizType = document.getElementById('bizType').value;
  const extraDesc = document.getElementById('extraDesc').value;

  const currentScenarios = getScenariosForBizType(bizType);
  var selectedList = [];
  var keys = Object.keys(selectedScenarios);
  for (var k = 0; k < keys.length; k++) {
    var idx = parseInt(keys[k]);
    selectedList.push({
      scenario: currentScenarios[idx],
      level: currentScenarios[idx].levels[selectedScenarios[idx]],
      severityKey: selectedScenarios[idx]
    });
  }

  const weeklyRevenueBase = monthlyRevenue / 4;
  const weeklyCostBase = monthlyCost / 4;

  let cash = cashOnHand;
  const weeks = [];
  let lowestCash = cash;
  let lowestWeek = 0;
  let bankruptWeek = -1;
  let totalNetFlow = 0;

  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    // Combine all selected scenarios: multiply shock factors, multiply cost factors, sum extra costs
    var combinedShock = 1.0;
    var combinedCostFactor = 1.0;
    var combinedExtraCost = 0;

    for (var s = 0; s < selectedList.length; s++) {
      var lv = selectedList[s].level;
      var d = lv.duration;
      var shockFactor, costFactor;

      if (w <= d) {
        shockFactor = lv.shock;
        costFactor = lv.costFactor;
      } else {
        var recoveryProgress = (w - d) / (TOTAL_WEEKS - d);
        shockFactor = lv.shock + (1.0 - lv.shock) * Math.min(1, recoveryProgress);
        costFactor = lv.costFactor + (1.0 - lv.costFactor) * Math.min(1, recoveryProgress);
      }

      combinedShock *= shockFactor;
      combinedCostFactor *= costFactor;
      if (w === 1 && lv.extraCost > 0) {
        combinedExtraCost += lv.extraCost;
      }
    }

    const weeklyRevenue = weeklyRevenueBase * combinedShock;
    const weeklyGrossProfit = weeklyRevenue * grossMargin;
    const weeklyCost = weeklyCostBase * combinedCostFactor;

    const netFlow = weeklyGrossProfit - weeklyCost - combinedExtraCost;
    cash += netFlow;
    totalNetFlow += netFlow;

    if (cash < lowestCash) {
      lowestCash = cash;
      lowestWeek = w;
    }

    if (bankruptWeek < 0 && cash <= 0) {
      bankruptWeek = w;
    }

    weeks.push({
      week: w,
      revenue: weeklyRevenue,
      grossProfit: weeklyGrossProfit,
      cost: weeklyCost,
      extraCost: combinedExtraCost,
      netFlow: netFlow,
      cash: cash,
      shockFactor: combinedShock,
      costFactor: combinedCostFactor
    });
  }

  simResult = {
    selectedList: selectedList,
    bizType: bizType,
    monthlyCost: monthlyCost,
    monthlyRevenue: monthlyRevenue,
    cashOnHand: cashOnHand,
    grossMargin: grossMargin * 100,
    extraDesc: extraDesc,
    weeklyRevenueBase: weeklyRevenueBase,
    weeklyCostBase: weeklyCostBase,
    weeks: weeks,
    finalCash: cash,
    lowestCash: lowestCash,
    lowestWeek: lowestWeek,
    bankruptWeek: bankruptWeek,
    survived: bankruptWeek < 0,
    totalNetFlow: totalNetFlow
  };

  goToStep3();
  renderResults();
}

// ==================== RESULTS RENDERING ====================
function renderResults() {
  const r = simResult;
  const card = document.getElementById('resultCard');

  // Verdict
  let verdictEmoji, verdictText, verdictSub;
  if (r.survived) {
    if (r.finalCash >= r.cashOnHand * 0.8) {
      verdictEmoji = '🛡️';
      verdictText = '恭喜！你的生意扛住了这些冲击';
      verdictSub = '现金流充足，抗风险能力较强';
    } else if (r.finalCash >= r.cashOnHand * 0.3) {
      verdictEmoji = '⚠️';
      verdictText = '勉强撑过了，但元气大伤';
      verdictSub = '现金流大幅消耗，后续经营需谨慎';
    } else {
      verdictEmoji = '🆘';
      verdictText = '极其惊险地活了下来';
      verdictSub = '现金流接近枯竭，再有一次冲击就危险了';
    }
  } else {
    verdictEmoji = '💔';
    verdictText = `第 ${r.bankruptWeek} 周现金流断裂`;
    verdictSub = '如果没有外部资金注入，生意将无法继续';
  }

  const formatMoney = v => {
    if (Math.abs(v) >= 10000) return (v / 10000).toFixed(1) + '万';
    return v.toFixed(0);
  };

  // Build scenario list string
  var scenarioListHtml = r.selectedList.map(function(item) {
    return item.scenario.emoji + ' ' + item.scenario.name + '（' + item.level.label + '）';
  }).join('<br>');

  let html = `
    <div class="result-header">
      <div class="result-verdict">${verdictEmoji}</div>
      <div class="result-verdict-text">${verdictText}</div>
      <div class="result-verdict-sub">${verdictSub}</div>
    </div>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-value ${r.finalCash >= 0 ? 'success' : 'danger'}">¥${formatMoney(r.finalCash)}</div>
        <div class="metric-label">24周后剩余现金</div>
      </div>
      <div class="metric-card">
        <div class="metric-value ${r.lowestCash >= 0 ? 'success' : 'danger'}">¥${formatMoney(r.lowestCash)}</div>
        <div class="metric-label">最低现金余额（第${r.lowestWeek}周）</div>
      </div>
      <div class="metric-card">
        <div class="metric-value">¥${formatMoney(r.cashOnHand)}</div>
        <div class="metric-label">初始现金</div>
      </div>
      <div class="metric-card">
        <div class="metric-value ${r.totalNetFlow >= 0 ? 'success' : 'danger'}">${r.totalNetFlow >= 0 ? '+' : ''}¥${formatMoney(r.totalNetFlow)}</div>
        <div class="metric-label">24周累计净现金流</div>
      </div>
    </div>

    <div class="chart-wrap">
      <h3>📊 24周现金流变化趋势</h3>
      <canvas id="cashFlowChart" style="max-height: 360px;"></canvas>
    </div>

    <div class="analysis-card">
      <h3>🤖 AI 生存分析</h3>
      <div class="analysis-text">${generateAnalysis(r)}</div>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 12px;">📋 模拟参数</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;">
        <div><span style="color:var(--muted)">经营类型：</span>${r.bizType}</div>
        <div><span style="color:var(--muted)">危机情景（${r.selectedList.length}个）：</span><br>${scenarioListHtml}</div>
        <div><span style="color:var(--muted)">月固定成本：</span>¥${r.monthlyCost.toLocaleString()}</div>
        <div><span style="color:var(--muted)">月均收入：</span>¥${r.monthlyRevenue.toLocaleString()}</div>
        <div><span style="color:var(--muted)">初始现金：</span>¥${r.cashOnHand.toLocaleString()}</div>
        <div><span style="color:var(--muted)">毛利率：</span>${r.grossMargin}%</div>
      </div>
      ${r.extraDesc ? `<div style="margin-top:12px;font-size:14px;"><span style="color:var(--muted)">补充描述：</span>${r.extraDesc}</div>` : ''}
    </div>

    <div class="card" style="margin-top:0;">
      <h3 style="margin-bottom:12px;">📅 每周明细</h3>
      <div class="weekly-table-wrap">
        <table class="weekly-table">
          <thead>
            <tr>
              <th>周</th>
              <th>收入</th>
              <th>毛利</th>
              <th>成本</th>
              <th>额外支出</th>
              <th>净现金流</th>
              <th>现金余额</th>
            </tr>
          </thead>
          <tbody>
            ${r.weeks.map(w => `
              <tr class="${w.cash < 0 ? 'negative' : ''}">
                <td>${w.week}</td>
                <td>¥${w.revenue.toFixed(0)}</td>
                <td>¥${w.grossProfit.toFixed(0)}</td>
                <td>¥${w.cost.toFixed(0)}</td>
                <td>${w.extraCost > 0 ? '¥' + w.extraCost.toFixed(0) : '—'}</td>
                <td class="${w.netFlow >= 0 ? 'net-positive' : 'net-negative'}">${w.netFlow >= 0 ? '+' : ''}¥${w.netFlow.toFixed(0)}</td>
                <td style="font-weight:700;">¥${w.cash.toFixed(0)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  card.innerHTML = html;

  // Render chart after DOM is settled
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      renderChart();
    });
  });
}

function renderChart() {
  var r = simResult;
  var canvas = document.getElementById('cashFlowChart');
  if (!canvas) return;

  // Set explicit canvas dimensions to prevent resize loops
  var container = canvas.parentElement;
  var w = container.clientWidth || 700;
  canvas.width = w;
  canvas.style.width = w + 'px';
  canvas.style.height = '360px';
  canvas.style.maxHeight = '360px';

  var ctx = canvas.getContext('2d');

  // Destroy previous chart if exists
  if (canvas._chart) {
    canvas._chart.destroy();
    canvas._chart = null;
  }

  var labels = r.weeks.map(function(w) { return 'W' + w.week; });
  var cashData = r.weeks.map(function(w) { return w.cash; });
  var netFlowData = r.weeks.map(function(w) { return w.netFlow; });

  // Mark bankrupt point
  var pointColors = r.weeks.map(function(w) { return w.cash < 0 ? '#E53935' : '#FF6B35'; });

  canvas._chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: '现金余额',
          data: cashData,
          borderColor: '#FF6B35',
          backgroundColor: 'rgba(255,107,53,0.08)',
          borderWidth: 2.5,
          fill: true,
          tension: 0.3,
          pointRadius: 3,
          pointBackgroundColor: pointColors,
          pointBorderColor: pointColors,
          yAxisID: 'y'
        },
        {
          label: '周净现金流',
          data: netFlowData,
          borderColor: '#8B7355',
          borderWidth: 1.5,
          borderDash: [4, 3],
          fill: false,
          tension: 0.3,
          pointRadius: 0,
          yAxisID: 'y'
        }
      ]
    },
    options: {
      responsive: false,
      animation: false,
      interaction: {
        mode: 'index',
        intersect: false
      },
      plugins: {
        tooltip: {
          callbacks: {
            label: function(ctx) {
              var v = ctx.parsed.y;
              return ctx.dataset.label + ': ¥' + v.toLocaleString();
            }
          }
        },
        legend: {
          labels: {
            usePointStyle: true,
            padding: 20
          }
        }
      },
      scales: {
        x: {
          grid: { color: '#f0e8dc' },
          ticks: { font: { size: 11 } }
        },
        y: {
          grid: { color: '#f0e8dc' },
          ticks: {
            font: { size: 11 },
            callback: function(v) { return '¥' + (v / 10000).toFixed(1) + '万'; }
          }
        }
      }
    },
    plugins: [{
      id: 'zeroLine',
      beforeDraw: function(chart) {
        var ctx = chart.ctx;
        var yScale = chart.scales.y;
        var xScale = chart.scales.x;
        var yZero = yScale.getPixelForValue(0);
        ctx.save();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = '#E53935';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(xScale.left, yZero);
        ctx.lineTo(xScale.right, yZero);
        ctx.stroke();
        ctx.restore();
      }
    }]
  });
}

// ==================== AI ANALYSIS GENERATOR ====================
function generateAnalysis(r) {
  var parts = [];
  var selectedList = r.selectedList;
  var isMulti = selectedList.length > 1;

  // Build scenario list description
  var scenarioListStr = selectedList.map(function(item) {
    return '<strong>' + item.scenario.emoji + ' ' + item.scenario.name + '</strong>（' + item.level.label + '）';
  }).join('、');

  // Opening
  parts.push('<p>模拟情景' + (isMulti ? '（' + selectedList.length + '个危机叠加）' : '') + '：' + scenarioListStr + '，模拟周期为 <strong>24 周</strong>（约6个月）。</p>');

  if (isMulti) {
    parts.push('<p>⚠️ <strong>多个危机同时发生，冲击效果相互叠加放大。</strong>收入冲击因子相乘、成本上涨因子相乘，额外赔偿累加。这是比单一危机更严峻的压力测试。</p>');
  }

  // Cash impact
  var cashChange = r.finalCash - r.cashOnHand;
  var cashChangePct = ((cashChange / r.cashOnHand) * 100).toFixed(1);
  parts.push('<p>初始现金 <strong>¥' + r.cashOnHand.toLocaleString() + '</strong>，24周后剩余 <strong>¥' + r.finalCash.toLocaleString() + '</strong>，现金消耗 <strong>¥' + Math.abs(cashChange).toLocaleString() + '</strong>（' + cashChangePct + '%）。最低点出现在 <strong>第' + r.lowestWeek + '周</strong>，仅剩 <strong>¥' + r.lowestCash.toLocaleString() + '</strong>。</p>');

  // Survival verdict
  if (!r.survived) {
    parts.push('<p>⚠️ <strong>严重警告：现金流在第 ' + r.bankruptWeek + ' 周断裂。</strong>这意味着在没有外部资金注入的情况下，你的生意将在约 ' + Math.ceil(r.bankruptWeek / 4) + ' 个月内无法继续。建议立即采取以下措施：</p>');
    parts.push('<ul style="padding-left:20px;margin-top:8px;">');
    parts.push('<li><strong>紧急融资：</strong>联系银行申请小额经营贷，或向亲友筹措周转资金</li>');
    parts.push('<li><strong>成本削减：</strong>立即与房东协商减租、暂缓非必要支出</li>');
    parts.push('<li><strong>收入开源：</strong>尝试线上渠道、团购、外卖等方式弥补客流下降</li>');
    // Check if any scenario is PR-related
    var hasPR = selectedList.some(function(item) {
      var id = item.scenario.id;
      return id === 'prcrisis' || id === 'foodsafety' || id === 'prcrisis_retail';
    });
    if (hasPR) {
      parts.push('<li><strong>舆情应对：</strong>主动发布澄清声明，联系老客户挽回信任</li>');
    }
    parts.push('</ul>');
  } else if (r.finalCash < r.cashOnHand * 0.3) {
    parts.push('<p>🆘 <strong>虽然撑过了24周，但现金流已严重消耗。</strong>你的生意抗风险能力较弱，如果再来一次冲击，很可能会撑不住。建议：</p>');
    parts.push('<ul style="padding-left:20px;margin-top:8px;">');
    parts.push('<li><strong>建立现金储备：</strong>目标至少储备3-6个月的固定成本</li>');
    parts.push('<li><strong>优化成本结构：</strong>审查每项固定支出，寻找可压缩空间</li>');
    parts.push('<li><strong>拓展收入来源：</strong>考虑增加产品线或服务项目</li>');
    parts.push('</ul>');
  } else if (r.finalCash < r.cashOnHand * 0.8) {
    parts.push('<p>⚠️ <strong>基本扛住了，但消耗了不少现金。</strong>你的生意有一定韧性，但仍有优化空间。建议关注：</p>');
    parts.push('<ul style="padding-left:20px;margin-top:8px;">');
    parts.push('<li><strong>持续监控现金流：</strong>建议每周追踪现金余额，设置预警线</li>');
    parts.push('<li><strong>建立应急计划：</strong>针对可能出现的危机提前做好预案</li>');
    parts.push('</ul>');
  } else {
    parts.push('<p>🛡️ <strong>表现出色！你的生意具有较好的抗风险能力。</strong>现金流充足，即使面对' + (isMulti ? '多个危机叠加' : selectedList[0].level.label + '的' + selectedList[0].scenario.name) + '，也能从容应对。继续保持：</p>');
    parts.push('<ul style="padding-left:20px;margin-top:8px;">');
    parts.push('<li><strong>保持现金储备：</strong>充足的现金流是最好的护城河</li>');
    parts.push('<li><strong>定期做压力测试：</strong>建议每季度用不同情景做一次模拟</li>');
    parts.push('</ul>');
  }

  // Scenario-specific advice — show for each selected scenario
  var specificAdvice = {
    roadwork: '修路期间可与施工方沟通了解工期，同时加强线上外卖/配送服务弥补线下客流。在门口设置醒目指引牌，减少客流损失。',
    keyperson: '核心人员离职前应有交接机制，关键技能应形成SOP文档。平时可培养1-2名备选人员，避免单点依赖。',
    customerloss: '分析客户流失原因，推出老客户回馈活动。建立会员体系和客户微信群，增强客户粘性。',
    costincrease: '与供应商签订长期锁价协议，寻找替代原料或第二供应商。适当调整产品结构和定价策略。',
    offseason: '提前规划淡季营销活动，推出季节性产品。利用淡季做员工培训、设备维护和流程优化。',
    prcrisis: '建立舆情监控机制，第一时间回应负面信息。准备危机公关预案，保持与核心客户的直接沟通渠道。',
    costincrease_food: '与多家供应商建立合作关系，分散采购风险。关注食材价格波动周期，在低价时适当囤货。调整菜单结构和份量，优化成本。',
    foodsafety: '建立严格的食材溯源和留样制度，定期自查卫生。一旦出事，第一时间诚恳道歉并提出补偿方案，不要推诿。主动邀请监管部门检查以重建信任。',
    platformfee: '不要过度依赖单一外卖平台，尝试自建小程序或社群接单。提高堂食比例，用菜品品质吸引顾客到店消费。',
    costincrease_retail: '与供应商协商阶梯定价或锁价协议。优化SKU结构，减少低毛利品类。关注批发市场价格波动，灵活调整进货节奏。',
    bigcompetitor: '发挥便利性和人情味优势，强化社区服务属性。增加差异化商品（如本地特产、手工食品），避免与大连锁正面价格战。',
    prcrisis_retail: '建立商品质量台账，定期自查临期商品。出现客诉第一时间解决并给予补偿，将负面评价转化为口碑修复的机会。',
    platformchange: '不要把所有鸡蛋放在一个篮子里，多平台布局。建立私域流量（微信群、公众号），积累自己的客户池。优化SEO和内容营销，降低对平台算法的依赖。',
    supplybreak: '建立备选供应商清单，保持至少2-3家可替代供应商。适当提高安全库存，预留应急物流方案。',
    returnsurge: '优化商品详情页（尺码表、材质说明、实拍图），降低信息不对称导致的退货。分析退货原因，从源头改进产品质量。',
    materialprice: '关注大宗商品期货价格走势，提前预判价格波动。与供应商签订浮动价格协议，锁定合理的涨价上限。考虑期货套保等手段对冲风险。',
    realestate: '拓展客户行业多样性，不过度依赖房地产单一行业。关注基建、市政工程等政策支持领域，寻找替代市场。',
    paymentdelay: '建立客户信用评级体系，对大额订单要求预付款或阶段性付款。合同中明确付款节点和违约责任，必要时通过法律途径追讨。',
    fabricprice: '与面料供应商建立长期合作，争取价格保护。关注面料市场行情，灵活调整采购策略，可考虑联合采购以降低单价。',
    ordercancel: '合同中明确取消订单的赔偿条款，对大额订单要求定金。分散客户来源，避免单一大客户占比过高。',
    inventory: '建立灵活的"小单快反"生产模式，减少单批次产量。利用直播带货、社群团购等渠道快速消化库存，宁可少赚也要回笼资金。'

  for (var s = 0; s < selectedList.length; s++) {

    parts.push('<p>' + advice + '</p>');

  return parts.join('');

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', function() {
  // Real-time validation
  const costInput = document.getElementById('monthlyCost');
  const revenueInput = document.getElementById('monthlyRevenue');
  const warningEl = document.getElementById('costWarning');

  function checkCostWarning() {
    const cost = parseFloat(costInput.value);
    const revenue = parseFloat(revenueInput.value);
    if (!isNaN(cost) && !isNaN(revenue) && cost > revenue && cost > 0 && revenue > 0) {
      warningEl.classList.add('show');
    } else {
      warningEl.classList.remove('show');
    }
  }

  costInput.addEventListener('input', checkCostWarning);
  revenueInput.addEventListener('input', checkCostWarning);

  // Negative number prevention
  document.querySelectorAll('input[type="number"]').forEach(input => {
    input.addEventListener('input', function() {
      if (this.value < 0) this.value = 0;
    });
  });
});
</script>
