<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外卖返利统一控制台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="topbar-title">外卖返利统一控制台</h1>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btn-refresh-all">刷新当前页</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-tab="tokens">Token管理</button>
      <button class="tab-btn" data-tab="tasks">自动任务</button>
      <button class="tab-btn" data-tab="scanner">扫描机器人</button>
      <button class="tab-btn" data-tab="history">运行历史</button>
    </nav>

    <main>
      <!-- ====== Tab 1: Token管理 ====== -->
      <section class="tab-panel active" id="tab-tokens">
        <div class="panel-header">
          <h2 class="panel-title">Token 管理</h2>
          <div class="panel-actions">
            <button class="btn btn-primary" id="btn-capture">一键抓取 Token</button>
            <button class="btn" id="btn-reload-tokens">重新加载</button>
          </div>
        </div>

        <div class="capture-status" id="capture-status">
          <div class="capture-meta">
            <span>抓取状态：<b id="cap-running">未知</b></span>
            <span>PID：<b id="cap-pid">-</b></span>
            <span>退出码：<b id="cap-exit">-</b></span>
            <span>已启动：<b id="cap-started">-</b></span>
          </div>
          <pre id="capture-log" class="log-pre">暂无日志</pre>
        </div>

        <div class="table-wrap">
          <table class="data-table" id="tokens-table">
            <thead>
              <tr>
                <th>平台</th>
                <th>Token(脱敏)</th>
                <th>长度</th>
                <th>captured_at</th>
                <th>source</th>
                <th>user_id</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tokens-tbody">
              <tr><td colspan="7" class="muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ====== Tab 2: 自动任务 ====== -->
      <section class="tab-panel" id="tab-tasks">
        <div class="panel-header">
          <h2 class="panel-title">自动任务</h2>
          <div class="panel-actions">
            <button class="btn" id="btn-reload-accounts">重新加载账号</button>
          </div>
        </div>
        <p class="muted" style="text-align:left;">编辑账号后点击「保存账号」，再点击「运行全部」启动任务。运行中会自动轮询进度。</p>
        <div id="tasks-cards"></div>
      </section>

      <!-- ====== Tab 3: 扫描机器人 ====== -->
      <section class="tab-panel" id="tab-scanner">
        <div class="panel-header">
          <h2 class="panel-title">扫描机器人</h2>
          <div class="panel-actions">
            <button class="btn btn-primary" id="btn-save-scanner-config">保存配置</button>
            <button class="btn btn-primary" id="btn-start-scan">启动扫描</button>
            <button class="btn btn-danger" id="btn-stop-scan">停止扫描</button>
          </div>
        </div>

        <div class="scanner-grid">
          <div class="card config-card">
            <h3 class="card-title">扫描配置</h3>
            <div class="form-row">
              <label>关键词</label>
              <div class="keyword-control">
                <input type="text" id="kw-input" placeholder="输入关键词后点击添加">
                <button class="btn" id="btn-add-kw">添加</button>
              </div>
              <div class="keyword-tags" id="keyword-tags"></div>
            </div>
            <div class="form-row">
              <label>扫描平台</label>
              <div class="checkbox-group" id="platforms-group">
                <label class="checkbox"><input type="checkbox" value="waimai"> 歪麦</label>
                <label class="checkbox"><input type="checkbox" value="xiaoxiao"> 晓晓</label>
                <label class="checkbox"><input type="checkbox" value="yuechi"> 越吃越有</label>
                <label class="checkbox"><input type="checkbox" value="xiaocan"> 小蚕</label>
              </div>
            </div>
            <div class="form-row">
              <label>位置</label>
              <div class="inline-inputs">
                <input type="number" id="cfg-lon" placeholder="经度" step="0.000001">
                <input type="number" id="cfg-lat" placeholder="纬度" step="0.000001">
                <input type="text" id="cfg-city" placeholder="城市">
              </div>
            </div>
            <div class="form-row">
              <label>最大距离(米)</label>
              <input type="number" id="cfg-distance" step="100" placeholder="6000">
            </div>
            <div class="form-row">
              <label>调度时间</label>
              <div class="inline-inputs">
                <label class="inline-label">开始</label>
                <input type="time" id="cfg-start-time">
                <label class="inline-label">结束</label>
                <input type="time" id="cfg-end-time">
                <label class="inline-label">间隔(秒)</label>
                <input type="number" id="cfg-interval" placeholder="300" step="1" min="60">
              </div>
            </div>
            <div class="form-row">
              <label>通知</label>
              <div class="inline-inputs">
                <label class="checkbox"><input type="checkbox" id="cfg-only-grabbable"> 仅可抢</label>
                <input type="number" id="cfg-cooldown" placeholder="冷却分钟" step="1">
              </div>
            </div>
          </div>
          <div class="card status-card">
            <h3 class="card-title">扫描状态</h3>
            <div class="status-line" id="scanner-status">加载中...</div>
          </div>
        </div>

        <h3 class="card-title">匹配结果 <button class="btn btn-sm btn-danger" id="btn-clear-matches" style="margin-left:12px;">清空匹配</button></h3>
        <div class="table-wrap">
          <table class="data-table" id="matches-table">
            <thead>
              <tr>
                <th>店铺名</th>
                <th>平台</th>
                <th>配送平台</th>
                <th>距离</th>
                <th>返利</th>
                <th>关键词</th>
                <th>可抢</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody id="matches-tbody">
              <tr><td colspan="8" class="muted">暂无数据</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- ====== Tab 4: 运行历史 ====== -->
      <section class="tab-panel" id="tab-history">
        <div class="panel-header">
          <h2 class="panel-title">运行历史</h2>
          <div class="panel-actions">
            <button class="btn btn-primary" id="btn-refresh-history">刷新</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table" id="history-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>平台</th>
                <th>状态</th>
                <th>账号数</th>
                <th>完成</th>
                <th>详情</th>
              </tr>
            </thead>
            <tbody id="history-tbody">
              <tr><td colspan="6" class="muted">加载中...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="history-detail" class="history-detail"></div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
