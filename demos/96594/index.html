<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>变画 - 像素协作画布 | ChangingPicture</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        /* ======== CSS 变量 ======== */
        :root {
            --color-primary: #209cee;
            --color-accent: #f7d51d;
            --color-success: #92cc41;
            --color-error: #e73232;
            --color-warning: #f7d51d;
            --color-bg-dark: #1a1a2e;
            --color-bg-panel: #2d2d44;
            --color-bg-surface: #363652;
            --color-border: #444466;
            --color-text: #e0e0e0;
            --color-text-dim: #8888aa;
            --color-text-bright: #ffffff;
            --font-pixel: 'Press Start 2P', cursive;
            --font-body: 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            --nav-height: 52px;
            --toolbar-width: 220px;
            --panel-width: 280px;
            --pixel-border-shadow:
                4px 0 0 0 #444466,
                -4px 0 0 0 #444466,
                0 4px 0 0 #444466,
                0 -4px 0 0 #444466,
                4px 4px 0 0 #555577,
                -4px -4px 0 0 #333355,
                4px -4px 0 0 #555577,
                -4px 4px 0 0 #333355;
            --pixel-border-shadow-sm:
                2px 0 0 0 #444466,
                -2px 0 0 0 #444466,
                0 2px 0 0 #444466,
                0 -2px 0 0 #444466,
                2px 2px 0 0 #555577,
                -2px -2px 0 0 #333355,
                2px -2px 0 0 #555577,
                -2px 2px 0 0 #333355;
        }

        /* ======== 重置 & 基础 ======== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--color-bg-dark);
            color: var(--color-text);
            font-family: var(--font-body);
            font-size: 13px;
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
        }

        /* ======== 像素风通用组件 ======== */
        .pixel-box {
            background: var(--color-bg-panel);
            border: 4px solid var(--color-border);
            box-shadow: var(--pixel-border-shadow);
            padding: 12px;
        }
        .pixel-btn {
            font-family: var(--font-pixel);
            font-size: 9px;
            padding: 8px 16px;
            background: var(--color-bg-surface);
            color: var(--color-text);
            border: 4px solid var(--color-border);
            box-shadow: var(--pixel-border-shadow-sm);
            cursor: pointer;
            transition: all 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .pixel-btn:hover { background: #444466; }
        .pixel-btn:active {
            box-shadow: none;
            transform: translate(2px, 2px);
        }
        .pixel-btn-primary {
            background: var(--color-primary);
            color: #fff;
            border-color: #1a8fd0;
        }
        .pixel-btn-primary:hover { background: #1a8fd0; }
        .pixel-btn-success {
            background: var(--color-success);
            color: #fff;
            border-color: #76a830;
        }
        .pixel-btn-success:hover { background: #76a830; }
        .pixel-btn-error {
            background: var(--color-error);
            color: #fff;
            border-color: #c22a2a;
        }
        .pixel-btn-error:hover { background: #c22a2a; }
        .pixel-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pixel-btn:disabled:hover { background: var(--color-bg-surface); }
        .pixel-btn-sm {
            font-size: 7px;
            padding: 5px 10px;
            border-width: 2px;
            box-shadow:
                2px 0 0 0 var(--color-border),
                -2px 0 0 0 var(--color-border),
                0 2px 0 0 var(--color-border),
                0 -2px 0 0 var(--color-border);
        }
        .pixel-input {
            font-family: var(--font-body);
            font-size: 13px;
            padding: 8px 12px;
            background: var(--color-bg-dark);
            color: var(--color-text);
            border: 4px solid var(--color-border);
            outline: none;
            width: 100%;
        }
        .pixel-input:focus { border-color: var(--color-primary); }
        .pixel-label {
            font-family: var(--font-pixel);
            font-size: 8px;
            color: var(--color-text-dim);
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ======== 导航栏 ======== */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--nav-height);
            background: var(--color-bg-panel);
            border-bottom: 4px solid var(--color-border);
            box-shadow: 0 4px 0 0 #333355;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }
        .navbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .navbar-logo {
            font-family: var(--font-pixel);
            font-size: 14px;
            color: var(--color-accent);
            text-shadow: 2px 2px 0 #b89a10;
            cursor: default;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-logo .logo-icon {
            width: 24px; height: 24px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1px;
        }
        .navbar-logo .logo-icon span {
            background: var(--color-primary);
            animation: logoPulse 3s infinite;
        }
        .navbar-logo .logo-icon span:nth-child(1) { background: var(--color-error); }
        .navbar-logo .logo-icon span:nth-child(2) { background: var(--color-success); }
        .navbar-logo .logo-icon span:nth-child(3) { background: var(--color-accent); }
        .navbar-logo .logo-icon span:nth-child(5) { background: var(--color-primary); }
        .navbar-logo .logo-icon span:nth-child(7) { background: #e040fb; }
        .navbar-logo .logo-icon span:nth-child(9) { background: #ff6e40; }
        @keyframes logoPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .navbar-stats {
            display: flex;
            gap: 16px;
            font-size: 11px;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--color-text-dim);
        }
        .stat-item .stat-value {
            color: var(--color-text-bright);
            font-weight: bold;
        }
        .navbar-center {
            display: flex;
            gap: 8px;
        }
        .navbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 8px;
        }
        .user-area:hover { background: var(--color-bg-surface); }
        .user-avatar {
            width: 28px; height: 28px;
            background: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-pixel);
            font-size: 10px;
            color: #fff;
            border: 2px solid var(--color-border);
        }
        .user-name {
            font-size: 12px;
            color: var(--color-text);
        }
        .guest-badge {
            font-family: var(--font-pixel);
            font-size: 8px;
            color: var(--color-text-dim);
            padding: 4px 8px;
            border: 2px dashed var(--color-text-dim);
        }

        /* ======== 主布局 ======== */
        .app-layout {
            display: flex;
            height: calc(100vh - var(--nav-height));
            margin-top: var(--nav-height);
        }

        /* ======== 左侧工具栏 ======== */
        .toolbar {
            width: var(--toolbar-width);
            min-width: var(--toolbar-width);
            background: var(--color-bg-panel);
            border-right: 4px solid var(--color-border);
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .toolbar::-webkit-scrollbar { width: 8px; }
        .toolbar::-webkit-scrollbar-track { background: var(--color-bg-dark); }
        .toolbar::-webkit-scrollbar-thumb { background: var(--color-border); }
        .toolbar-section {
            padding: 10px;
            background: var(--color-bg-surface);
            border: 3px solid var(--color-border);
            box-shadow: var(--pixel-border-shadow-sm);
        }
        .toolbar-title {
            font-family: var(--font-pixel);
            font-size: 8px;
            color: var(--color-accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ======== 调色板 ======== */
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            margin-bottom: 10px;
        }
        .palette-color {
            aspect-ratio: 1;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }
        .palette-color:hover {
            transform: scale(1.2);
            z-index: 1;
            border-color: #fff;
        }
        .palette-color.active {
            border-color: #fff;
            box-shadow: 0 0 0 2px var(--color-accent);
            transform: scale(1.15);
        }
        .custom-color-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .custom-color-input {
            width: 32px;
            height: 32px;
            border: 3px solid var(--color-border);
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .custom-color-input::-webkit-color-swatch-wrapper { padding: 2px; }
        .custom-color-input::-webkit-color-swatch { border: none; border-radius: 0; }
        .color-hex-display {
            font-family: var(--font-pixel);
            font-size: 8px;
            color: var(--color-text-dim);
            flex: 1;
        }
        .recent-colors {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .recent-color {
            width: 18px;
            height: 18px;
            border: 2px solid var(--color-border);
            cursor: pointer;
        }
        .recent-color:hover { border-color: #fff; }

        /* ======== 冷却计时器 ======== */
        .cooldown-timer {
            text-align: center;
            padding: 10px;
        }
        .cooldown-ring {
            width: 80px;
            height: 80px;
            margin: 0 auto 8px;
            position: relative;
        }
        .cooldown-ring svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .cooldown-ring .ring-bg {
            fill: none;
            stroke: var(--color-bg-dark);
            stroke-width: 6;
        }
        .cooldown-ring .ring-progress {
            fill: none;
            stroke: var(--color-primary);
            stroke-width: 6;
            stroke-linecap: butt;
            transition: stroke-dashoffset 1s linear;
        }
        .cooldown-ring .ring-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: var(--font-pixel);
            font-size: 12px;
            color: var(--color-text-bright);
        }
        .cooldown-status {
            font-size: 11px;
            color: var(--color-text-dim);
        }
        .cooldown-status.ready {
            color: var(--color-success);
        }

        /* ======== 缩放控制 ======== */
        .zoom-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .zoom-value {
            font-family: var(--font-pixel);
            font-size: 8px;
            color: var(--color-text);
            min-width: 50px;
            text-align: center;
        }

        /* ======== 工具按钮 ======== */
        .tool-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tool-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-dark);
            border: 3px solid var(--color-border);
            color: var(--color-text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.1s;
        }
        .tool-btn:hover { background: var(--color-bg-surface); border-color: var(--color-primary); }
        .tool-btn.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }

        /* ======== 小地图 ======== */
        .minimap-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #fff;
            border: 3px solid var(--color-border);
            overflow: hidden;
            cursor: pointer;
        }
        .minimap-canvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        .minimap-viewport {
            position: absolute;
            border: 2px solid var(--color-accent);
            pointer-events: none;
        }

        /* ======== 画布区域 ======== */
        .canvas-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--color-bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .canvas-wrapper {
            position: relative;
            /* Canvas will fill available space */
        }
        #pixelCanvas {
            display: block;
            cursor: crosshair;
            image-rendering: pixelated;
        }
        /* 棋盘格透明背景 */
        .canvas-bg-pattern {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image:
                linear-gradient(45deg, #eee 25%, transparent 25%),
                linear-gradient(-45deg, #eee 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eee 75%),
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            pointer-events: none;
            z-index: 0;
        }
        .canvas-statusbar {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 46, 0.85);
            border: 3px solid var(--color-border);
            padding: 6px 16px;
            display: flex;
            gap: 20px;
            font-size: 11px;
            z-index: 10;
            font-family: var(--font-pixel);
            font-size: 7px;
        }
        .statusbar-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--color-text-dim);
        }
        .statusbar-item .val { color: var(--color-text-bright); }

        /* ======== 右侧面板 ======== */
        .user-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--color-bg-panel);
            border-left: 4px solid var(--color-border);
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.3s, width 0.3s;
        }
        .user-panel.collapsed {
            width: 0;
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border-left: none;
        }
        .user-panel::-webkit-scrollbar { width: 8px; }
        .user-panel::-webkit-scrollbar-track { background: var(--color-bg-dark); }
        .user-panel::-webkit-scrollbar-thumb { background: var(--color-border); }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 3px solid var(--color-border);
        }
        .panel-title {
            font-family: var(--font-pixel);
            font-size: 9px;
            color: var(--color-accent);
        }
        .panel-toggle {
            width: 24px; height: 24px;
            background: var(--color-bg-surface);
            border: 2px solid var(--color-border);
            color: var(--color-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .panel-section {
            padding: 10px;
            background: var(--color-bg-surface);
            border: 3px solid var(--color-border);
        }
        .panel-section-title {
            font-family: var(--font-pixel);
            font-size: 7px;
            color: var(--color-text-dim);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .user-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .user-stat-card {
            text-align: center;
            padding: 8px;
            background: var(--color-bg-dark);
            border: 2px solid var(--color-border);
        }
        .user-stat-card .stat-num {
            font-family: var(--font-pixel);
            font-size: 14px;
            color: var(--color-accent);
            display: block;
            margin-bottom: 4px;
        }
        .user-stat-card .stat-label {
            font-size: 10px;
            color: var(--color-text-dim);
        }
        /* 颜色统计 */
        .color-stats-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .color-stat-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
        }
        .color-stat-swatch {
            width: 16px;
            height: 16px;
            border: 2px solid var(--color-border);
            flex-shrink: 0;
        }
        .color-stat-bar-bg {
            flex: 1;
            height: 10px;
            background: var(--color-bg-dark);
            border: 2px solid var(--color-border);
        }
        .color-stat-bar {
            height: 100%;
            background: var(--color-primary);
            transition: width 0.3s;
        }
        .color-stat-count {
            font-family: var(--font-pixel);
            font-size: 7px;
            color: var(--color-text-dim);
            min-width: 28px;
            text-align: right;
        }
        /* 历史列表 */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--color-border); }
        .history-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            background: var(--color-bg-dark);
            border: 2px solid var(--color-border);
            font-size: 11px;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .history-item:hover { border-color: var(--color-primary); }
        .history-item-color {
            width: 14px;
            height: 14px;
            border: 2px solid var(--color-border);
            flex-shrink: 0;
        }
        .history-item-coord {
            font-family: var(--font-pixel);
            font-size: 7px;
            color: var(--color-primary);
        }
        .history-item-time {
            margin-left: auto;
            color: var(--color-text-dim);
            font-size: 10px;
        }
        /* 成就 */
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .achievement-badge {
            text-align: center;
            padding: 8px 4px;
            background: var(--color-bg-dark);
            border: 2px solid var(--color-border);
            font-size: 9px;
            color: var(--color-text-dim);
        }
        .achievement-badge.earned {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }
        .achievement-badge .badge-icon {
            font-size: 16px;
            display: block;
            margin-bottom: 4px;
        }
        .login-required-overlay {
            text-align: center;
            padding: 20px;
            color: var(--color-text-dim);
        }
        .login-required-overlay i {
            font-size: 32px;
            margin-bottom: 10px;
            display: block;
        }

        /* ======== 弹窗 ======== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-box {
            background: var(--color-bg-panel);
            border: 4px solid var(--color-border);
            box-shadow: var(--pixel-border-shadow);
            padding: 0;
            max-width: 420px;
            width: 90%;
            transform: translateY(-10px);
            transition: transform 0.2s;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }
        .modal-header {
            padding: 14px 18px;
            border-bottom: 4px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--color-bg-surface);
        }
        .modal-title {
            font-family: var(--font-pixel);
            font-size: 10px;
            color: var(--color-accent);
        }
        .modal-close {
            width: 28px; height: 28px;
            background: var(--color-bg-dark);
            border: 3px solid var(--color-border);
            color: var(--color-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .modal-close:hover { background: var(--color-error); color: #fff; }
        .modal-body { padding: 18px; }
        .modal-footer {
            padding: 14px 18px;
            border-top: 4px solid var(--color-border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* ======== 格子信息弹窗 ======== */
        .pixel-info-current {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--color-bg-dark);
            border: 3px solid var(--color-border);
            margin-bottom: 14px;
        }
        .pixel-info-swatch {
            width: 48px;
            height: 48px;
            border: 3px solid var(--color-border);
            background-image:
                linear-gradient(45deg, #eee 25%, transparent 25%),
                linear-gradient(-45deg, #eee 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eee 75%),
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 10px 10px;
            background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
            position: relative;
        }
        .pixel-info-swatch .swatch-color {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;

    <script>
    // ================================================================
    //  变画 ChangingPicture - 像素协作画布原型
    // ================================================================

    (function() {
        'use strict';

        // ======== 常量 ========
        const CANVAS_W = 800;
        const CANVAS_H = 600;
        const COOLDOWN_MS = 60000; // 60秒冷却
        const PALETTE_COLORS = [
            '#000000','#555555','#AAAAAA','#FFFFFF',
            '#E73232','#FF6E40','#FF9800','#F7D51D',
            '#92CC41','#00E676','#00BCD4','#209CEE',
            '#2979FF','#7C4DFF','#E040FB','#FF4081',
            '#8D6E63','#5D4037','#37474F','#78909C',
            '#C62828','#EF6C00','#9E9D24','#2E7D32',
            '#00838F','#1565C0','#4527A0','#AD1457',
            '#4E342E','#D4A373','#A8DADC','#F1FAEE',
        ];
        const ZOOM_LEVELS = [1, 2, 4, 8, 10, 12, 16, 20, 24, 32];
        const ZOOM_MIN = 1;
        const ZOOM_MAX = 32;

        // ======== 应用状态 ========
        const AppState = {
            user: null, // { username, loggedAt } 或 null (游客)
            selectedColor: '#209cee',
            recentColors: [],
            currentTool: 'brush', // brush | eyedropper
            cooldown: {
                lastActionTime: 0,
                timerInterval: null,
            },
            // 像素数据: Uint8ClampedArray CANVAS_W * CANVAS_H * 4
            pixelData: new Uint8ClampedArray(CANVAS_W * CANVAS_H * 4),
            // 历史记录: Map<"x,y", [{color, user, timestamp}]>
            historyMap: new Map(),
            // 用户个人历史: [{x, y, color, timestamp}]
            userHistory: [],
            // 用户颜色统计: Map<color, count>
            userColorStats: new Map(),
            // 视口状态
            viewport: { x: 0, y: 0, zoom: 8 },
            // 渲染标记
            needsRender: true,
            // 拖拽状态
            isDragging: false,
            dragStartX: 0, dragStartY: 0,
            dragStartVpX: 0, dragStartVpY: 0,
            mouseDownX: 0, mouseDownY: 0,
            hoveredPixel: null, // {x, y}
            panelCollapsed: false,
            theme: 'dark',
        };

        // ======== DOM 引用 ========
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);
        const pixelCanvas = $('#pixelCanvas');
        const ctx = pixelCanvas.getContext('2d');
        const minimapCanvas = $('#minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        // ======== 初始化 ========
        function init() {
            setupCanvas();
            generateMockData();
            setupPalette();
            setupEventListeners();
            updateNavbarUser();
            updatePanelContent();
            updateCooldownUI();
            fitCanvasToScreen();
            startRenderLoop();
            updateMinimap();
            updateStatColored();
        }

        // ======== Canvas 设置 ========
        function setupCanvas() {
            const area = $('#canvasArea');
            pixelCanvas.width = area.clientWidth;
            pixelCanvas.height = area.clientHeight;
        }

        function resizeCanvas() {
            const area = $('#canvasArea');
            pixelCanvas.width = area.clientWidth;
            pixelCanvas.height = area.clientHeight;
            AppState.needsRender = true;
            AppState.needsMinimapUpdate = true;
        }

        // ======== 画布渲染引擎 ========
        function startRenderLoop() {
            function loop() {
                if (AppState.needsRender) {
                    render();
                    AppState.needsRender = false;
                }
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function render() {
            const vp = AppState.viewport;
            const cw = pixelCanvas.width;
            const ch = pixelCanvas.height;
            ctx.clearRect(0, 0, cw, ch);

            // 绘制白色底
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, cw, ch);

            // 计算可见像素范围
            const cellW = Math.max(1, Math.ceil(cw / vp.zoom));
            const cellH = Math.max(1, Math.ceil(ch / vp.zoom));
            const startX = Math.max(0, Math.floor(-vp.x / vp.zoom));
            const startY = Math.max(0, Math.floor(-vp.y / vp.zoom));
            const endX = Math.min(CANVAS_W, startX + cellW + 2);
            const endY = Math.min(CANVAS_H, startY + cellH + 2);

            // 绘制有颜色的像素
            for (let py = startY; py < endY; py++) {
                for (let px = startX; px < endX; px++) {
                    const idx = (py * CANVAS_W + px) * 4;
                    const a = AppState.pixelData[idx + 3];
                    if (a === 0) continue; // 透明，显示白色背景
                    const r = AppState.pixelData[idx];
                    const g = AppState.pixelData[idx + 1];
                    const b = AppState.pixelData[idx + 2];
                    const screenX = vp.x + px * vp.zoom;
                    const screenY = vp.y + py * vp.zoom;
                    ctx.fillStyle = `rgba(${r},${g},${b},${a/255})`;
                    ctx.fillRect(screenX, screenY, vp.zoom, vp.zoom);
                }
            }

            // 绘制网格线 (zoom >= 4)
            if (vp.zoom >= 4) {
                ctx.strokeStyle = 'rgba(180,180,200,0.25)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                for (let px = startX; px <= endX; px++) {
                    const sx = vp.x + px * vp.zoom;
                    ctx.moveTo(sx, Math.max(0, vp.y + startY * vp.zoom));
                    ctx.lineTo(sx, Math.min(ch, vp.y + endY * vp.zoom));
                }
                for (let py = startY; py <= endY; py++) {
                    const sy = vp.y + py * vp.zoom;
                    ctx.moveTo(Math.max(0, vp.x + startX * vp.zoom), sy);
                    ctx.lineTo(Math.min(cw, vp.x + endX * vp.zoom), sy);
                }
                ctx.stroke();
            }

            // 悬浮高亮
            if (AppState.hoveredPixel) {
                const hx = AppState.hoveredPixel.x;
                const hy = AppState.hoveredPixel.y;
                if (hx >= 0 && hx < CANVAS_W && hy >= 0 && hy < CANVAS_H) {
                    const sx = vp.x + hx * vp.zoom;
                    const sy = vp.y + hy * vp.zoom;
                    // 十字准心
                    ctx.strokeStyle = 'rgba(247,213,29,0.6)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.beginPath();
                    ctx.moveTo(sx + vp.zoom/2, Math.max(0, vp.y));
                    ctx.lineTo(sx + vp.zoom/2, Math.min(ch, vp.y + CANVAS_H * vp.zoom));
                    ctx.moveTo(Math.max(0, vp.x), sy + vp.zoom/2);
                    ctx.lineTo(Math.min(cw, vp.x + CANVAS_W * vp.zoom), sy + vp.zoom/2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    // 高亮框
                    ctx.strokeStyle = 'rgba(247,213,29,0.9)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx, sy, vp.zoom, vp.zoom);
                }
            }
        }

        // ======== 小地图 ========
        function updateMinimap() {
            // 将 800x600 画到 160x120
            const mw = minimapCanvas.width;
            const mh = minimapCanvas.height;
            minimapCtx.clearRect(0, 0, mw, mh);

            // 白色底
            minimapCtx.fillStyle = '#fff';
            minimapCtx.fillRect(0, 0, mw, mh);

            // 缩放绘制像素数据
            const imgData = minimapCtx.createImageData(mw, mh);
            const scaleX = CANVAS_W / mw;
            const scaleY = CANVAS_H / mh;
            for (let my = 0; my < mh; my++) {
                for (let mx = 0; mx < mw; mx++) {
                    const px = Math.floor(mx * scaleX);
                    const py = Math.floor(my * scaleY);
                    const srcIdx = (py * CANVAS_W + px) * 4;
                    const dstIdx = (my * mw + mx) * 4;
                    imgData.data[dstIdx] = AppState.pixelData[srcIdx];
                    imgData.data[dstIdx+1] = AppState.pixelData[srcIdx+1];
                    imgData.data[dstIdx+2] = AppState.pixelData[srcIdx+2];
                    imgData.data[dstIdx+3] = AppState.pixelData[srcIdx+3];
                }
            }
            minimapCtx.putImageData(imgData, 0, 0);

            // 视口框
            updateMinimapViewport();
            AppState.needsMinimapUpdate = false;
        }

        function updateMinimapViewport() {
            const vp = AppState.viewport;
            const cw = pixelCanvas.width;
            const ch = pixelCanvas.height;
            const mw = minimapCanvas.width;
            const mh = minimapCanvas.height;

            // 视口在画布坐标系中的范围
            const vpLeft = Math.max(0, -vp.x / vp.zoom);
            const vpTop = Math.max(0, -vp.y / vp.zoom);
            const vpRight = Math.min(CANVAS_W, (cw - vp.x) / vp.zoom);
            const vpBottom = Math.min(CANVAS_H, (ch - vp.y) / vp.zoom);

            // 映射到小地图像素
            const vpEl = $('#minimapViewport');
            vpEl.style.left = (vpLeft / CANVAS_W * mw) + 'px';
            vpEl.style.top = (vpTop / CANVAS_H * mh) + 'px';
            vpEl.style.width = Math.max(4, ((vpRight - vpLeft) / CANVAS_W * mw)) + 'px';
            vpEl.style.height = Math.max(4, ((vpBottom - vpTop) / CANVAS_H * mh)) + 'px';
        }

        // ======== 缩放 ========
        function zoomTo(newZoom, centerX, centerY) {
            newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
            if (centerX === undefined) centerX = pixelCanvas.width / 2;
            if (centerY === undefined) centerY = pixelCanvas.height / 2;

            const vp = AppState.viewport;
            const oldZoom = vp.zoom;
            vp.x = centerX - (centerX - vp.x) * (newZoom / oldZoom);
            vp.y = centerY - (centerY - vp.y) * (newZoom / oldZoom);
            vp.zoom = newZoom;

            clampViewport();
            updateZoomUI();
            AppState.needsRender = true;
            updateMinimapViewport();
        }

        function clampViewport() {
            const vp = AppState.viewport;
            const cw = pixelCanvas.width;
            const ch = pixelCanvas.height;
            const totalW = CANVAS_W * vp.zoom;
            const totalH = CANVAS_H * vp.zoom;

            if (totalW <= cw) {
                vp.x = (cw - totalW) / 2;
            } else {
                vp.x = Math.min(0, Math.max(cw - totalW, vp.x));
            }
            if (totalH <= ch) {
                vp.y = (ch - totalH) / 2;
            } else {
                vp.y = Math.min(0, Math.max(ch - totalH, vp.y));
            }
        }

        function fitCanvasToScreen() {
            const cw = pixelCanvas.width;
            const ch = pixelCanvas.height;
            const zoomX = cw / CANVAS_W;
            const zoomY = ch / CANVAS_H;
            const zoom = Math.floor(Math.min(zoomX, zoomY) * 10) / 10;
            AppState.viewport.zoom = Math.max(1, zoom);
            clampViewport();
            updateZoomUI();
            AppState.needsRender = true;
            updateMinimapViewport();
        }

        function updateZoomUI() {
            const zoom = AppState.viewport.zoom;
            const pct = Math.round(zoom * 100);
            $('#zoomValue').textContent = pct + '%';
            $('#statusZoom').textContent = pct + '%';
        }

        // ======== 像素坐标计算 ========
        function getPixelFromScreen(screenX, screenY) {
            const vp = AppState.viewport;
            const px = Math.floor((screenX - vp.x) / vp.zoom);
            const py = Math.floor((screenY - vp.y) / vp.zoom);
            return { x: px, y: py };
        }

        function getPixelColor(x, y) {
            if (x < 0 || x >= CANVAS_W || y < 0 || y >= CANVAS_H) return null;
            const idx = (y * CANVAS_W + x) * 4;
            const r = AppState.pixelData[idx];
            const g = AppState.pixelData[idx + 1];
            const b = AppState.pixelData[idx + 2];
            const a = AppState.pixelData[idx + 3];
            if (a === 0) return null; // 透明
            return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
        }

        function setPixelColor(x, y, hexColor) {
            if (x < 0 || x >= CANVAS_W || y < 0 || y >= CANVAS_H) return;
            const idx = (y * CANVAS_W + x) * 4;
            const r = parseInt(hexColor.slice(1,3), 16);
            const g = parseInt(hexColor.slice(3,5), 16);
            const b = parseInt(hexColor.slice(5,7), 16);
            AppState.pixelData[idx] = r;
            AppState.pixelData[idx + 1] = g;
            AppState.pixelData[idx + 2] = b;
            AppState.pixelData[idx + 3] = 255;
        }

        // ======== 调色板 ========
        function setupPalette() {
            const grid = $('#paletteGrid');
            PALETTE_COLORS.forEach(color => {
                const el = document.createElement('div');
                el.className = 'palette-color' + (color === AppState.selectedColor ? ' active' : '');
                el.style.background = color;
                if (color === '#FFFFFF') {
                    el.style.border = '2px solid #aaa';
                }
                el.addEventListener('click', () => selectColor(color));
                grid.appendChild(el);
            });
            updateRecentColors();
        }

        function selectColor(color) {
            AppState.selectedColor = color.toUpperCase();
            AppState.currentTool = 'brush';
            updateActiveTool();
            // 更新调色板激活状态
            $$('.palette-color').forEach(el => {
                el.classList.toggle('active', rgbToHex(el.style.background).toUpperCase() === color.toUpperCase());
            });
            $('#customColor').value = color;
            $('#colorHexDisplay').textContent = color.toUpperCase();
            // 添加到最近使用
            addRecentColor(color);
        }

        function addRecentColor(color) {
            const upper = color.toUpperCase();
            AppState.recentColors = AppState.recentColors.filter(c => c !== upper);
            AppState.recentColors.unshift(upper);
            if (AppState.recentColors.length > 16) AppState.recentColors.pop();
            updateRecentColors();
        }

        function updateRecentColors() {
            const container = $('#recentColors');
            container.innerHTML = '';
            AppState.recentColors.forEach(color => {
                const el = document.createElement('div');
                el.className = 'recent-color';
                el.style.background = color;
                el.addEventListener('click', () => selectColor(color));
                container.appendChild(el);
            });
        }

        function rgbToHex(rgb) {
            if (!rgb) return '#000000';
            if (rgb.startsWith('#')) return rgb;
            const match = rgb.match(/\d+/g);
            if (!match || match.length < 3) return '#000000';
            return '#' + match.slice(0,3).map(v => parseInt(v).toString(16).padStart(2,'0')).join('');
        }

        // ======== 工具切换 ========
        function updateActiveTool() {
            $('#toolBrush').classList.toggle('active', AppState.currentTool === 'brush');
            $('#toolEyedropper').classList.toggle('active', AppState.currentTool === 'eyedropper');
            pixelCanvas.style.cursor = AppState.currentTool === 'brush' ? 'crosshair' : 'cell';
        }

        // ======== 冷却管理 ========
        function canAct() {
            return Date.now() - AppState.cooldown.lastActionTime >= COOLDOWN_MS;
        }

        function getCooldownRemaining() {
            const elapsed = Date.now() - AppState.cooldown.lastActionTime;
            return Math.max(0, Math.ceil((COOLDOWN_MS - elapsed) / 1000));
        }

        function recordAction() {
            AppState.cooldown.lastActionTime = Date.now();
            startCooldownTimer();
        }

        function startCooldownTimer() {
            if (AppState.cooldown.timerInterval) clearInterval(AppState.cooldown.timerInterval);
            updateCooldownUI();
            AppState.cooldown.timerInterval = setInterval(() => {
                updateCooldownUI();
                if (canAct()) {
                    clearInterval(AppState.cooldown.timerInterval);
                    AppState.cooldown.timerInterval = null;
                    showToast('冷却结束，可以再次操作了！', 'success');
                }
            }, 1000);
        }

        function updateCooldownUI() {
            const remaining = getCooldownRemaining();
            const isReady = canAct();
            const pct = isReady ? 0 : remaining / (COOLDOWN_MS / 1000);
            const circumference = 2 * Math.PI * 40; // r=40
            const offset = circumference * (1 - pct);

            const ring = $('#cooldownRing');
            ring.style.strokeDasharray = circumference.toFixed(2);
            ring.style.strokeDashoffset = offset.toFixed(2);
            ring.style.stroke = isReady ? 'var(--color-success)' : 'var(--color-primary)';

            $('#cooldownText').textContent = isReady ? 'OK' : remaining;
            $('#cooldownText').style.color = isReady ? 'var(--color-success)' : 'var(--color-text-bright)';

            const statusEl = $('#cooldownStatus');
            if (isReady) {
                statusEl.textContent = '可以操作';
                statusEl.className = 'cooldown-status ready';
            } else {
                statusEl.textContent = '冷却中...';
                statusEl.className = 'cooldown-status';
            }
        }

            // 成就
            const achievements = [
                { icon: '🌱', name: '初来乍到', desc: '完成首次修改', earned: totalEdits >= 1 },
                { icon: '🎨', name: '调色师', desc: '使用5种颜色', earned: uniqueColors >= 5 },
                { icon: '🔥', name: '活跃画家', desc: '修改10次', earned: totalEdits >= 10 },
                { icon: '💎', name: '色彩大师', desc: '使用10种颜色', earned: uniqueColors >= 10 },
                { icon: '⭐', name: '百格达人', desc: '修改50次', earned: totalEdits >= 50 },
                { icon: '👑', name: '传奇画家', desc: '修改100次', earned: totalEdits >= 100 },

            let achievementHTML = '';
            achievements.forEach(a => {
                achievementHTML += `

                        </div>

                            <span class="stat-num">${uniqueColors}</span>
                            <span class="stat-label">使用颜色</span>
                        </div>
                    </div>
                </div>
                <div class="panel-section">
                    <div class="panel-section-title"><i class="fa fa-history"></i> 修改历史</div>
                    <div class="history-list" id="panelHistoryList">${historyHTML}</div>
                </div>
                <div class="panel-section">
                    <div class="panel-section-title"><i class="fa fa-bar-chart"></i> 颜色统计</div>
                    <div class="color-stats-list">${colorStatsHTML}</div>
                </div>
                <div class="panel-section">
                    <div class="panel-section-title"><i class="fa fa-trophy"></i> 成就徽章</div>
                    <div class="achievements-grid">${achievementHTML}</div>
                </div>
            `;

            // 绑定历史列表点击跳转
            container.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    const x = parseInt(item.dataset.x);
                    const y = parseInt(item.dataset.y);
                    jumpToPixel(x, y);
                });
            });
        }

        // ======== 跳转到指定像素 ========
        function jumpToPixel(x, y) {
            const vp = AppState.viewport;
            vp.x = pixelCanvas.width / 2 - x * vp.zoom - vp.zoom / 2;
            vp.y = pixelCanvas.height / 2 - y * vp.zoom - vp.zoom / 2;
            clampViewport();
            AppState.needsRender = true;
            updateMinimapViewport();
        }

        // ======== 修改像素 ========
        function modifyPixel(x, y) {
            if (!AppState.user) {
                showToast('请先登录', 'error');
                openLoginModal();
                return;
            }
            if (!canAct()) {
                showToast('冷却中，请等待 ' + getCooldownRemaining() + ' 秒', 'error');
                return;
            }
            if (x < 0 || x >= CANVAS_W || y < 0 || y >= CANVAS_H) return;

            const color = AppState.selectedColor;
            setPixelColor(x, y, color);

            // 记录历史
            const key = x + ',' + y;
            if (!AppState.historyMap.has(key)) AppState.historyMap.set(key, []);
            AppState.historyMap.get(key).push({
                color,
                user: AppState.user.username,
                timestamp: Date.now(),
            });

            // 记录用户历史
            AppState.userHistory.push({ x, y, color, timestamp: Date.now() });
            // 颜色统计
            const upperColor = color.toUpperCase();
            AppState.userColorStats.set(upperColor, (AppState.userColorStats.get(upperColor) || 0) + 1);
            // 保存到 localStorage
            localStorage.setItem('cp_history', JSON.stringify(AppState.userHistory));
            localStorage.setItem('cp_colorStats', JSON.stringify(Array.from(AppState.userColorStats.entries())));

            // 冷却
            recordAction();

            // 更新UI
            addRecentColor(color);
            updateStatColored();
            updatePanelContent();
            AppState.needsRender = true;
            AppState.needsMinimapUpdate = true;
            updateMinimap();
            showToast(`成功修改 (${x}, ${y}) 为 ${color}`, 'success');

            // 闪烁动画
            flashPixel(x, y);
        }

        function flashPixel(x, y) {
            let count = 0;
            const interval = setInterval(() => {
                const idx = (y * CANVAS_W + x) * 4;
                if (count % 2 === 0) {
                    AppState.pixelData[idx + 3] = 0; // 临时透明
                } else {
                    const hex = AppState.selectedColor;
                    AppState.pixelData[idx] = parseInt(hex.slice(1,3),16);
                    AppState.pixelData[idx+1] = parseInt(hex.slice(3,5),16);
                    AppState.pixelData[idx+2] = parseInt(hex.slice(5,7),16);
                    AppState.pixelData[idx + 3] = 255;
                }
                AppState.needsRender = true;
                count++;
                if (count >= 6) clearInterval(interval);
            }, 100);
        }

                        <i class="fa fa-sign-in"></i> 登录后修改
                    </button>

        // ======== 弹窗管理 ========

        function showToast(message, type) {
            type = type || 'info';

            const toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            const iconMap = { success: 'check-circle', error: 'times-circle', info: 'info-circle' };
            toast.innerHTML = `<i class="fa fa-${iconMap[type] || 'info-circle'}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {

            }, 3000);

        // ======== 统计更新 ========
        function updateStatColored() {

                if (AppState.pixelData[i] > 0) count++;
            }
            $('#statColored').textContent = count;

        // ======== 模拟数据 ========
        function generateMockData() {
            // 模拟一些已有像素（简单的图案）
            const colors = ['#E73232','#FF6E40','#FF9800','#F7D51D','#92CC41','#00E676','#00BCD4','#209cee','#2979FF','#7C4DFF','#E040FB','#FF4081'];

            // 随机散布一些像素
            for (let i = 0; i < 2000; i++) {
                const x = Math.floor(Math.random() * CANVAS_W);
                const y = Math.floor(Math.random() * CANVAS_H);
                const color = colors[Math.floor(Math.random() * colors.length)];
                setPixelColor(x, y, color);
                const key = x + ',' + y;
                if (!AppState.historyMap.has(key)) AppState.historyMap.set(key, []);
                const mockUsers = ['像素侠','色彩师','画家小王','夜猫子','彩虹兔','大白菜','涂鸦侠','方块君'];
                AppState.historyMap.get(key).push({
                    color,
                    user: mockUsers[Math.floor(Math.random() * mockUsers.length)],
                    timestamp: Date.now() - Math.floor(Math.random() * 7 * 24 * 3600 * 1000),
                });
            }

            // 画一个简单的爱心图案
            const heartPixels = [
                [2,0],[3,0],[5,0],[6,0],[8,0],[9,0],
                [1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],
                [1,2],[2,2],[3,2],[4,2],[5,2],[6,2],[7,2],[8,2],[9,2],[10,2],
                [2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],
                [3,4],[4,4],[5,4],[6,4],[7,4],[8,4],
                [4,5],[5,5],[6,5],[7,5],
                [5,6],[6,6],
            ];
            const heartOX = 390, heartOY = 280;
            const heartScale = 8;
            heartPixels.forEach(([hx, hy]) => {
                for (let sy = 0; sy < heartScale; sy++) {
                    for (let sx = 0; sx < heartScale; sx++) {
                        const px = heartOX + hx * heartScale + sx;
                        const py = heartOY + hy * heartScale + sy;
                        if (px < CANVAS_W && py < CANVAS_H) {
                            setPixelColor(px, py, '#E73232');
                            const key = px + ',' + py;
                            if (!AppState.historyMap.has(key)) AppState.historyMap.set(key, []);
                            AppState.historyMap.get(key).push({
                                color: '#E73232',
                                user: '像素侠',
                                timestamp: Date.now() - 86400000,
                            });
                        }
                    }
                }
            });

            // 画文字 "CP" (ChangingPicture)
            const cpPixels = [
                // C
                [1,0],[2,0],[3,0],
                [0,1],
                [0,2],
                [1,3],[2,3],[3,3],
                // gap
                // P
                [7,0],[8,0],[9,0],[10,0],
                [6,1],
                [6,2],[7,2],[8,2],[9,2],
                [6,3],
                [6,4],
            ];
            const cpOX = 350, cpOY = 200, cpScale = 6;
            cpPixels.forEach(([cx, cy]) => {
                for (let sy = 0; sy < cpScale; sy++) {
                    for (let sx = 0; sx < cpScale; sx++) {
                        const px = cpOX + cx * cpScale + sx;
                        const py = cpOY + cy * cpScale + sy;
                        if (px < CANVAS_W && py < CANVAS_H) {
                            setPixelColor(px, py, '#209cee');
                            const key = px + ',' + py;
                            if (!AppState.historyMap.has(key)) AppState.historyMap.set(key, []);
                            AppState.historyMap.get(key).push({
                                color: '#209cee',
                                user: '色彩师',
                                timestamp: Date.now() - 172800000,
                            });
                        }
                    }
                }
            });
        }

        // ======== 事件监听 ========
        function setupEventListeners() {
            // 画布 - 鼠标
            pixelCanvas.addEventListener('mousedown', onCanvasMouseDown);
            pixelCanvas.addEventListener('mousemove', onCanvasMouseMove);
            pixelCanvas.addEventListener('mouseup', onCanvasMouseUp);
            pixelCanvas.addEventListener('mouseleave', onCanvasMouseLeave);
            pixelCanvas.addEventListener('wheel', onCanvasWheel, { passive: false });
            pixelCanvas.addEventListener('contextmenu', e => e.preventDefault());

            // 画布 - 触摸
            let touchStartDist = 0;
            let touchStartZoom = 1;
            pixelCanvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const t = e.touches[0];
                    const rect = pixelCanvas.getBoundingClientRect();
                    onCanvasMouseDown({ offsetX: t.clientX - rect.left, offsetY: t.clientY - rect.top, button: 0 });
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    touchStartDist = Math.sqrt(dx*dx + dy*dy);
                    touchStartZoom = AppState.viewport.zoom;
                    AppState.isDragging = false;
                }
                e.preventDefault();
            }, { passive: false });
            pixelCanvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && AppState.isDragging) {
                    const t = e.touches[0];
                    const rect = pixelCanvas.getBoundingClientRect();
                    onCanvasMouseMove({ offsetX: t.clientX - rect.left, offsetY: t.clientY - rect.top });
                } else if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const newZoom = touchStartZoom * (dist / touchStartDist);
                    zoomTo(newZoom);
                    e.preventDefault();
                }
            }, { passive: false });
            pixelCanvas.addEventListener('touchend', (e) => {
                if (e.changedTouches.length === 1 && !AppState.isDragging) {
                    const t = e.changedTouches[0];
                    const rect = pixelCanvas.getBoundingClientRect();
                    onCanvasMouseUp({ offsetX: t.clientX - rect.left, offsetY: t.clientY - rect.top });
                }
                AppState.isDragging = false;
            });

            // 工具栏按钮
            $('#toolBrush').addEventListener('click', () => {
                AppState.currentTool = 'brush';
                updateActiveTool();
            });
            $('#toolEyedropper').addEventListener('click', () => {
                AppState.currentTool = 'eyedropper';
                updateActiveTool();
            });
            $('#toolGoto').addEventListener('click', () => openModal('gotoModal'));

            // 缩放
            $('#zoomIn').addEventListener('click', () => zoomTo(AppState.viewport.zoom * 1.5));
            $('#zoomOut').addEventListener('click', () => zoomTo(AppState.viewport.zoom / 1.5));
            $('#zoomFit').addEventListener('click', fitCanvasToScreen);

            // 自定义颜色
            $('#customColor').addEventListener('input', (e) => {
                selectColor(e.target.value);
            });

            // 小地图点击
            $('#minimapContainer').addEventListener('click', (e) => {
                const rect = minimapCanvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                const px = Math.floor(mx / rect.width * CANVAS_W);
                const py = Math.floor(my / rect.height * CANVAS_H);
                jumpToPixel(px, py);
            });

            // 登录
            $('#loginClose').addEventListener('click', () => closeModal('loginModal'));
            $('#loginGuestBtn').addEventListener('click', () => closeModal('loginModal'));
            $('#loginSubmitBtn').addEventListener('click', submitLogin);
            $('#loginPassword').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') submitLogin();
            });
            $('#loginUsername').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') $('#loginPassword').focus();
            });

            // 坐标跳转
            $('#gotoClose').addEventListener('click', () => closeModal('gotoModal'));
            $('#gotoSubmitBtn').addEventListener('click', submitGoto);

            // 格子信息关闭
            $('#pixelInfoClose').addEventListener('click', () => closeModal('pixelInfoModal'));

            // 弹窗点击外部关闭
            $$('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) modal.classList.remove('active');
                });
            });

            // 主题切换
            $('#btnThemeToggle').addEventListener('click', toggleTheme);

            // 全屏
            $('#btnFullscreen').addEventListener('click', toggleFullscreen);

            // 面板折叠
            $('#panelCollapseBtn').addEventListener('click', togglePanel);
            $('#panelCloseBtn').addEventListener('click', togglePanel);

            // 窗口大小变化
            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                // 如果焦点在输入框中，不处理
                if (e.target.tagName === 'INPUT') return;
                switch(e.key) {
                    case '+': case '=':
                        zoomTo(AppState.viewport.zoom * 1.5);
                        break;
                    case '-':
                        zoomTo(AppState.viewport.zoom / 1.5);
                        break;
                    case 'ArrowLeft':
                        AppState.viewport.x += 50;
                        clampViewport(); AppState.needsRender = true; updateMinimapViewport();
                        break;
                    case 'ArrowRight':
                        AppState.viewport.x -= 50;
                        clampViewport(); AppState.needsRender = true; updateMinimapViewport();
                        break;
                    case 'ArrowUp':
                        AppState.viewport.y += 50;
                        clampViewport(); AppState.needsRender = true; updateMinimapViewport();
                        break;
                    case 'ArrowDown':
                        AppState.viewport.y -= 50;
                        clampViewport(); AppState.needsRender = true; updateMinimapViewport();
                        break;
                    case 'Escape':
                        $$('.modal-overlay.active').forEach(m => m.classList.remove('active'));
                        break;
                }
            });

            // 移动端工具栏切换
            if (window.innerWidth <= 767) {
                // 需要一个按钮来打开工具栏 - 这里通过双击画布打开
            }
        }

        function onCanvasMouseDown(e) {
            if (e.button !== 0) return;
            AppState.isDragging = true;
            AppState.dragStartX = e.offsetX;
            AppState.dragStartY = e.offsetY;
            AppState.dragStartVpX = AppState.viewport.x;
            AppState.dragStartVpY = AppState.viewport.y;
            AppState.mouseDownX = e.offsetX;
            AppState.mouseDownY = e.offsetY;
        }

        function onCanvasMouseMove(e) {
            // 更新悬浮像素
            const pixel = getPixelFromScreen(e.offsetX, e.offsetY);
            AppState.hoveredPixel = pixel;
            if (pixel.x >= 0 && pixel.x < CANVAS_W && pixel.y >= 0 && pixel.y < CANVAS_H) {
                $('#statusX').textContent = pixel.x;
                $('#statusY').textContent = pixel.y;
            }
            AppState.needsRender = true;

            if (!AppState.isDragging) return;

            // 拖拽平移
            const dx = e.offsetX - AppState.dragStartX;
            const dy = e.offsetY - AppState.dragStartY;
            AppState.viewport.x = AppState.dragStartVpX + dx;
            AppState.viewport.y = AppState.dragStartVpY + dy;
            clampViewport();
            AppState.needsRender = true;
            updateMinimapViewport();
        }

        function onCanvasMouseUp(e) {
            if (!AppState.isDragging) return;
            AppState.isDragging = false;

            // 判断是点击还是拖拽
            const dx = e.offsetX - AppState.mouseDownX;
            const dy = e.offsetY - AppState.mouseDownY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 3) {
                // 这是一次点击
                const pixel = getPixelFromScreen(e.offsetX, e.offsetY);
                if (pixel.x >= 0 && pixel.x < CANVAS_W && pixel.y >= 0 && pixel.y < CANVAS_H) {
                    if (AppState.currentTool === 'eyedropper') {
                        // 吸色器
                        const color = getPixelColor(pixel.x, pixel.y);
                        if (color) {
                            selectColor(color);
                            showToast('已选取颜色 ' + color.toUpperCase(), 'info');
                        } else {
                            showToast('该格子为透明', 'info');
                        }
                        // 切回画笔
                        AppState.currentTool = 'brush';
                        updateActiveTool();
                    } else {
                        // 画笔模式 - 显示格子信息
                        showPixelInfo(pixel.x, pixel.y);
                    }
                }
            }
        }

        function onCanvasMouseLeave() {
            AppState.hoveredPixel = null;
            AppState.isDragging = false;
            $('#statusX').textContent = '-';
            $('#statusY').textContent = '-';
            AppState.needsRender = true;
        }

        function onCanvasWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.8 : 1.25;
            zoomTo(AppState.viewport.zoom * delta, e.offsetX, e.offsetY);
        }

        // ======== 登录提交 ========
        function submitLogin() {
            const username = $('#loginUsername').value.trim();
            if (!username) {
                showToast('请输入用户名', 'error');
                return;
            }
            login(username);
            closeModal('loginModal');
            $('#loginUsername').value = '';
            $('#loginPassword').value = '';
        }

        // ======== 坐标跳转提交 ========
        function submitGoto() {
            const x = parseInt($('#gotoX').value);
            const y = parseInt($('#gotoY').value);
            if (isNaN(x) || isNaN(y) || x < 0 || x >= CANVAS_W || y < 0 || y >= CANVAS_H) {
                showToast('坐标无效 (X: 0-799, Y: 0-599)', 'error');
                return;
            }
            jumpToPixel(x, y);
            closeModal('gotoModal');
            showToast(`已跳转到 (${x}, ${y})`, 'info');
        }

        // ======== 主题切换 ========
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            AppState.theme = document.body.classList.contains('light-theme') ? 'light' : 'dark';
        }

        // ======== 全屏 ========
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        // ======== 面板折叠 ========
        function togglePanel() {
            const panel = $('#userPanel');
            const btn = $('#panelCollapseBtn');
            AppState.panelCollapsed = !AppState.panelCollapsed;
            if (window.innerWidth >= 1200) {
                panel.classList.toggle('collapsed');
            } else {
                panel.classList.toggle('show');
            }
            btn.innerHTML = AppState.panelCollapsed
                ? '<i class="fa fa-chevron-left"></i>'
                : '<i class="fa fa-chevron-right"></i>';
            setTimeout(() => {
                resizeCanvas();
            }, 350);
        }

        // ======== 启动 ========
        loadUserFromStorage();
        init();

    })();
    </script>
</body>
</html>
