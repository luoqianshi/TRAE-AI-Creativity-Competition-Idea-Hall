<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>试验地规划工具 - 地块画布</title>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f0f2f5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部标题栏 */
.header {
  background: #fff;
  border-bottom: 1px solid #e8e8e8;
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  z-index: 10;
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  color: #1a1a2e;
  display: flex;
  align-items: center;
  gap: 8px;
}
.header h1 .icon { font-size: 22px; }
.header-actions {
  display: flex;
  gap: 8px;
}
.header-actions button {
  padding: 6px 16px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 13px;
  color: #333;
  transition: all 0.2s;
}
.header-actions button:hover { border-color: #4a6cf7; color: #4a6cf7; }
.header-actions .btn-primary {
  background: #4a6cf7;
  color: #fff;
  border-color: #4a6cf7;
}
.header-actions .btn-primary:hover { background: #3b5de7; }

/* 主体布局 */
.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* 左侧工具栏 */
.toolbar {
  width: 72px;
  background: #fff;
  border-right: 1px solid #e8e8e8;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 4px;
  flex-shrink: 0;
}
.tool-btn {
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  color: #666;
  transition: all 0.15s;
  position: relative;
}
.tool-btn .tool-icon { font-size: 20px; line-height: 1; }
.tool-btn:hover { background: #f5f5ff; color: #4a6cf7; }
.tool-btn.active { background: #eef1ff; color: #4a6cf7; font-weight: 600; }
.tool-btn.danger:hover { background: #fff1f0; color: #ff4d4f; }
.tool-divider {
  width: 36px;
  height: 1px;
  background: #e8e8e8;
  margin: 6px 0;
}

/* 颜色面板 */
.color-panel {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px;
  justify-content: center;
}
.color-swatch {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.15s;
}
.color-swatch:hover { transform: scale(1.2); }
.color-swatch.active { border-color: #333; transform: scale(1.15); }

/* 画布区域 */
.canvas-wrapper {
  flex: 1;
  position: relative;
  background: #e8ecf1;
  background-image:
    radial-gradient(circle, #ccd0d8 1px, transparent 1px);
  background-size: 20px 20px;
  overflow: hidden;
}
.canvas-wrapper canvas { display: block; }

/* 右下角提示 */
.canvas-hint {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  color: #fff;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  pointer-events: none;
  transition: opacity 0.5s;
}

/* 右侧属性面板 */
.properties-panel {
  width: 260px;
  background: #fff;
  border-left: 1px solid #e8e8e8;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
.panel-header {
  padding: 16px 16px 12px;
  font-size: 14px;
  font-weight: 600;
  color: #333;
  border-bottom: 1px solid #f0f0f0;
}
.panel-empty {
  padding: 40px 16px;
  text-align: center;
  color: #999;
  font-size: 13px;
  line-height: 1.6;
}
.panel-content {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label {
  font-size: 12px;
  color: #888;
  font-weight: 500;
}
.form-group input, .form-group select {
  padding: 8px 10px;
  border: 1px solid #d9d9d9;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus, .form-group select:focus { border-color: #4a6cf7; }
.form-group .input-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.form-group .input-row input { flex: 1; }
.form-group .input-row span { font-size: 12px; color: #999; flex-shrink: 0; }
.area-display {
  background: #f5f5ff;
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  color: #4a6cf7;
  text-align: center;
}
.panel-color-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-color-row span { font-size: 12px; color: #888; }
.panel-color-row input[type="color"] {
  width: 32px; height: 32px; border: none; cursor: pointer; border-radius: 4px;
}
.btn-delete {
  width: 100%;
  padding: 8px;
  border: 1px solid #ffccc7;
  background: #fff;
  color: #ff4d4f;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.btn-delete:hover { background: #fff1f0; }

/* 地块列表 */
.plot-list {
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.plot-list-title {
  font-size: 12px;
  color: #888;
  font-weight: 500;
  padding: 0 0 6px;
}
.plot-list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s;
}
.plot-list-item:hover { background: #f5f5ff; }
.plot-list-item.active { background: #eef1ff; font-weight: 500; }
.plot-list-item .plot-dot {
  width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; margin-right: 8px;
}
.plot-list-item .plot-name { flex: 1; }
.plot-list-item .plot-area { font-size: 11px; color: #999; }

/* 模态框 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 100;
}
.modal {
  background: #fff; border-radius: 12px; padding: 24px;
  width: 400px; max-width: 90vw;
}
.modal h3 { margin-bottom: 12px; font-size: 16px; }
.modal p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.6; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal-actions button {
  padding: 8px 20px; border-radius: 6px; border: 1px solid #d9d9d9;
  background: #fff; cursor: pointer; font-size: 13px;
}
.modal-actions .btn-confirm { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }

/* 提示消息 */
.toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 8px 20px; border-radius: 20px;
  font-size: 13px; z-index: 200; pointer-events: none;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
  white-space: nowrap;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

/* 响应式 */
@media (max-width: 768px) {
  .properties-panel { width: 220px; }
  .toolbar { width: 56px; }
  .tool-btn { width: 42px; height: 44px; font-size: 10px; }
  .tool-btn .tool-icon { font-size: 17px; }
}
</style>
</head>
<body>

<!-- 顶部标题栏 -->
<div class="header">
  <h1><span class="icon">🌾</span>试验地规划工具</h1>
  <div class="header-actions">
    <button onclick="exportImage()">📷 导出图片</button>
    <button onclick="clearAll()">🗑 清空画布</button>
    <button class="btn-primary" onclick="exportPDF()">📄 导出PDF</button>
  </div>
</div>

<!-- 主体 -->
<div class="main-container">
  <!-- 左侧工具栏 -->
  <div class="toolbar">
    <button class="tool-btn active" id="tool-select" onclick="setTool('select')" title="选择/移动">
      <span class="tool-icon">🖱</span>选择
    </button>
    <button class="tool-btn" id="tool-rect" onclick="setTool('rect')" title="绘制矩形地块">
      <span class="tool-icon">⬜</span>矩形
    </button>
    <button class="tool-btn" id="tool-polygon" onclick="setTool('polygon')" title="绘制多边形地块">
      <span class="tool-icon">🔷</span>多边形
    </button>
    <div class="tool-divider"></div>
    <button class="tool-btn danger" id="tool-delete" onclick="deleteSelected()" title="删除选中地块">
      <span class="tool-icon">🗑</span>删除
    </button>
    <button class="tool-btn" onclick="undoAction()" title="撤销">
      <span class="tool-icon">↩</span>撤销
    </button>
    <div class="tool-divider"></div>
    <!-- 颜色选择 -->
    <div class="color-panel">
      <div class="color-swatch active" style="background:#4a6cf7" data-color="#4a6cf7" onclick="setPlotColor('#4a6cf7', this)"></div>
      <div class="color-swatch" style="background:#52c41a" data-color="#52c41a" onclick="setPlotColor('#52c41a', this)"></div>
      <div class="color-swatch" style="background:#fa8c16" data-color="#fa8c16" onclick="setPlotColor('#fa8c16', this)"></div>
      <div class="color-swatch" style="background:#f5222d" data-color="#f5222d" onclick="setPlotColor('#f5222d', this)"></div>
      <div class="color-swatch" style="background:#722ed1" data-color="#722ed1" onclick="setPlotColor('#722ed1', this)"></div>
      <div class="color-swatch" style="background:#13c2c2" data-color="#13c2c2" onclick="setPlotColor('#13c2c2', this)"></div>
      <div class="color-swatch" style="background:#eb2f96" data-color="#eb2f96" onclick="setPlotColor('#eb2f96', this)"></div>
      <div class="color-swatch" style="background:#faad14" data-color="#faad14" onclick="setPlotColor('#faad14', this)"></div>
    </div>
  </div>

  <!-- 画布区域 -->
  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="mainCanvas"></canvas>
    <div class="canvas-hint" id="canvasHint">点击画布拖拽绘制地块，或在工具栏选择工具</div>
  </div>

  <!-- 右侧属性面板 -->
  <div class="properties-panel" id="propertiesPanel">
    <div class="panel-header">📋 地块属性</div>
    <div class="panel-empty" id="panelEmpty">请选择画布上的地块<br>以查看和编辑属性</div>
    <div class="panel-content" id="panelContent" style="display:none;">
      <div class="form-group">
        <label>地块名称</label>
        <input type="text" id="plotName" placeholder="输入地块名称" onchange="updatePlotName()">
      </div>
      <div class="form-group">
        <label>地块尺寸（米）</label>
        <div class="input-row">
          <input type="number" id="plotWidth" placeholder="宽" min="1" onchange="updatePlotSize()">
          <span>×</span>
          <input type="number" id="plotHeight" placeholder="高" min="1" onchange="updatePlotSize()">
          <span>m</span>
        </div>
      </div>
      <div class="area-display" id="areaDisplay">面积：— ㎡</div>
      <div class="form-group">
        <label>填充颜色</label>
        <div class="panel-color-row">
          <input type="color" id="plotColorPicker" value="#4a6cf7" onchange="updatePlotColorFromPicker()">
          <span id="colorHexLabel">#4a6cf7</span>
        </div>
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="plotNote" placeholder="可选备注信息" onchange="updatePlotNote()">
      </div>
      <button class="btn-delete" onclick="deleteSelected()">🗑 删除该地块</button>
    </div>
    <!-- 地块列表 -->
    <div class="plot-list" id="plotList">
      <div class="plot-list-title">地块列表</div>
    </div>
  </div>
</div>

<script>
// ==================== 主程序 ====================
let canvas;
let currentTool = 'select';
let currentColor = '#4a6cf7';
let selectedPlot = null;
let plotCounter = 0;
let undoStack = [];
let isDrawing = false;
let drawStart = null;
let drawShape = null;
let polygonPoints = [];
let polygonTempLine = null;
let plotDataMap = new Map(); // 存储每个地块的元数据

// 初始化画布
function initCanvas() {
  const wrapper = document.getElementById('canvasWrapper');
  const w = wrapper.clientWidth;
  const h = wrapper.clientHeight;

  canvas = new fabric.Canvas('mainCanvas', {
    width: w,
    height: h,
    selection: true,
    backgroundColor: 'transparent',
    preserveObjectStacking: true,
  });

  // 网格背景
  drawGrid(w, h);

  // 窗口大小变化
  window.addEventListener('resize', () => {
    const nw = wrapper.clientWidth;
    const nh = wrapper.clientHeight;
    canvas.setWidth(nw);
    canvas.setHeight(nh);
    drawGrid(nw, nh);
    canvas.renderAll();
  });

  // 选择事件
  canvas.on('selection:created', onSelect);
  canvas.on('selection:updated', onSelect);
  canvas.on('selection:cleared', onDeselect);

  // 对象修改事件
  canvas.on('object:modified', onObjectModified);

  // 鼠标事件 - 绘图
  canvas.on('mouse:down', onMouseDown);
  canvas.on('mouse:move', onMouseMove);
  canvas.on('mouse:up', onMouseUp);
  canvas.on('mouse:dblclick', onDblClick);

  // 键盘快捷键
  document.addEventListener('keydown', onKeyDown);

  updateCanvasHint();
}

// 绘制网格背景
function drawGrid(w, h) {
  // 使用 CSS 背景来画网格，这里只做参考线
  // 实际网格由 .canvas-wrapper 的 radial-gradient 实现
}

// ==================== 工具切换 ====================
function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('tool-' + tool);
  if (btn) btn.classList.add('active');

  canvas.isDrawingMode = false;
  canvas.selection = (tool === 'select');
  canvas.defaultCursor = (tool === 'select') ? 'default' : 'crosshair';

  // 取消正在进行的多边形绘制
  if (tool !== 'polygon' && polygonPoints.length > 0) {
    finishPolygon();
  }

  updateCanvasHint();
}

function setPlotColor(color, el) {
  currentColor = color;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('plotColorPicker').value = color;
  document.getElementById('colorHexLabel').textContent = color;
}

function updateCanvasHint() {
  const hint = document.getElementById('canvasHint');
  const hints = {
    'select': '点击地块选中，拖拽移动调整',
    'rect': '在画布上按住鼠标拖拽绘制矩形地块',
    'polygon': '依次点击画布添加顶点，双击完成多边形',
    'delete': '点击要删除的地块'
  };
  hint.textContent = hints[currentTool] || '';
}

// ==================== 鼠标事件 ====================
function onMouseDown(opt) {
  if (currentTool === 'select') return;

  const pointer = canvas.getPointer(opt.e);

  if (currentTool === 'rect') {
    isDrawing = true;
    drawStart = pointer;
    drawShape = new fabric.Rect({
      left: pointer.x,
      top: pointer.y,
      width: 0,
      height: 0,
      fill: currentColor + '88',
      stroke: currentColor,
      strokeWidth: 2,
      strokeUniform: true,
      rx: 4,
      ry: 4,
      selectable: false,
      evented: false,
    });
    canvas.add(drawShape);
  }

  if (currentTool === 'polygon') {
    polygonPoints.push({ x: pointer.x, y: pointer.y });
    // 绘制顶点标记
    const dot = new fabric.Circle({
      left: pointer.x - 4,
      top: pointer.y - 4,
      radius: 4,
      fill: currentColor,
      stroke: '#fff',
      strokeWidth: 1,
      selectable: false,
      evented: false,
    });
    canvas.add(dot);
    polygonTempLine = null;
  }
}

function onMouseMove(opt) {
  if (!isDrawing || currentTool !== 'rect') return;

  const pointer = canvas.getPointer(opt.e);
  const w = pointer.x - drawStart.x;
  const h = pointer.y - drawStart.y;

  if (drawShape) {
    drawShape.set({
      width: Math.abs(w),
      height: Math.abs(h),
      left: w > 0 ? drawStart.x : pointer.x,
      top: h > 0 ? drawStart.y : pointer.y,
    });
    canvas.renderAll();
  }
}

function onMouseUp(opt) {
  if (currentTool === 'rect' && isDrawing) {
    isDrawing = false;
    if (drawShape && drawShape.width > 5 && drawShape.height > 5) {
      finalizeRect(drawShape);
    } else if (drawShape) {
      canvas.remove(drawShape);
    }
    drawShape = null;
    drawStart = null;
  }
}

function onDblClick(opt) {
  if (currentTool === 'polygon' && polygonPoints.length >= 3) {
    finishPolygon();
  }
}

// 完成矩形绘制
function finalizeRect(rect) {
  plotCounter++;
  const id = 'plot_' + plotCounter + '_' + Date.now();
  const w = Math.round(rect.width * 100) / 100;
  const h = Math.round(rect.height * 100) / 100;

  rect.set({
    fill: currentColor + '66',
    stroke: currentColor,
    strokeWidth: 2,
    selectable: true,
    evented: true,
    id: id,
  });

  plotDataMap.set(id, {
    name: '地块 ' + plotCounter,
    width: w,
    height: h,
    area: w * h,
    color: currentColor,
    note: '',
  });

  addPlotLabel(rect, '地块 ' + plotCounter);
  pushUndo('add', id);
  updatePlotList();
  canvas.setActiveObject(rect);
  canvas.renderAll();
}

// 完成多边形绘制
function finishPolygon() {
  if (polygonPoints.length < 3) {
    clearPolygonDots();
    polygonPoints = [];
    return;
  }

  plotCounter++;
  const id = 'plot_' + plotCounter + '_' + Date.now();

  // 计算多边形面积和边界框
  const area = polygonArea(polygonPoints);
  const bounds = getBounds(polygonPoints);

  const poly = new fabric.Polygon(polygonPoints, {
    fill: currentColor + '66',
    stroke: currentColor,
    strokeWidth: 2,
    selectable: true,
    evented: true,
    id: id,
  });

  plotDataMap.set(id, {
    name: '地块 ' + plotCounter,
    width: Math.round(bounds.w * 100) / 100,
    height: Math.round(bounds.h * 100) / 100,
    area: Math.round(area * 100) / 100,
    color: currentColor,
    note: '',
    isPolygon: true,
    polygonPoints: polygonPoints,
  });

  clearPolygonDots();
  canvas.add(poly);
  addPlotLabel(poly, '地块 ' + plotCounter);
  pushUndo('add', id);
  updatePlotList();
  canvas.setActiveObject(poly);
  canvas.renderAll();
  polygonPoints = [];
}

function clearPolygonDots() {
  const dots = canvas.getObjects().filter(o => o.type === 'circle' && !o.id);
  dots.forEach(d => canvas.remove(d));
  canvas.renderAll();
}

// 多边形面积（鞋带公式）
function polygonArea(points) {
  let area = 0;
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    area += points[i].x * points[j].y;
    area -= points[j].x * points[i].y;
  }
  return Math.abs(area) / 2;
}

function getBounds(points) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  points.forEach(p => {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  });
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// 添加标签
function addPlotLabel(obj, text) {
  const label = new fabric.Text(text, {
    left: obj.left + obj.width / 2,
    top: obj.top + obj.height / 2,
    fontSize: 14,
    fontWeight: '600',
    fill: '#333',
    fontFamily: 'PingFang SC, Microsoft YaHei, sans-serif',
    originX: 'center',
    originY: 'center',
    selectable: false,
    evented: false,
    id: obj.id + '_label',
  });
  canvas.add(label);

  // 绑定标签跟随对象
  obj.on('moving', () => {
    label.set({ left: obj.left + obj.width / 2, top: obj.top + obj.height / 2 });
    canvas.renderAll();
  });
  obj.on('scaling', () => {
    label.set({ left: obj.left + obj.width / 2, top: obj.top + obj.height / 2 });
    canvas.renderAll();
  });
  obj.on('rotating', () => {
    label.set({ left: obj.left + obj.width / 2, top: obj.top + obj.height / 2 });
    canvas.renderAll();
  });

  obj._label = label;
}

// ==================== 选择与属性面板 ====================
function onSelect(e) {
  const obj = e.selected?.[0] || canvas.getActiveObject();
  if (!obj || !obj.id) { onDeselect(); return; }
  selectedPlot = obj;
  updatePropertiesPanel(obj);
  highlightPlotList(obj.id);
}

function onDeselect() {
  selectedPlot = null;
  document.getElementById('panelContent').style.display = 'none';
  document.getElementById('panelEmpty').style.display = 'block';
  document.querySelectorAll('.plot-list-item').forEach(i => i.classList.remove('active'));
}

function updatePropertiesPanel(obj) {
  const data = plotDataMap.get(obj.id);
  if (!data) return;

  document.getElementById('panelContent').style.display = 'flex';
  document.getElementById('panelEmpty').style.display = 'none';

  document.getElementById('plotName').value = data.name;
  document.getElementById('plotWidth').value = data.width;
  document.getElementById('plotHeight').value = data.height;
  document.getElementById('plotColorPicker').value = data.color;
  document.getElementById('colorHexLabel').textContent = data.color;
  document.getElementById('plotNote').value = data.note || '';
  document.getElementById('areaDisplay').textContent = '面积：' + data.area.toFixed(2) + ' ㎡';
}

function updatePlotName() {
  if (!selectedPlot) return;
  const data = plotDataMap.get(selectedPlot.id);
  if (!data) return;
  data.name = document.getElementById('plotName').value;
  updatePlotLabel(selectedPlot, data.name);
  updatePlotList();
}

function updatePlotSize() {
  if (!selectedPlot) return;
  const data = plotDataMap.get(selectedPlot.id);
  if (!data) return;
  const w = parseFloat(document.getElementById('plotWidth').value) || data.width;
  const h = parseFloat(document.getElementById('plotHeight').value) || data.height;
  data.width = w;
  data.height = h;
  data.area = w * h;
  document.getElementById('areaDisplay').textContent = '面积：' + data.area.toFixed(2) + ' ㎡';
  updatePlotList();
}

function updatePlotColorFromPicker() {
  const color = document.getElementById('plotColorPicker').value;
  document.getElementById('colorHexLabel').textContent = color;
  if (!selectedPlot) return;
  const data = plotDataMap.get(selectedPlot.id);
  if (!data) return;
  data.color = color;
  selectedPlot.set({ fill: color + '66', stroke: color });
  canvas.renderAll();
  updatePlotList();
}

function updatePlotNote() {
  if (!selectedPlot) return;
  const data = plotDataMap.get(selectedPlot.id);
  if (!data) return;
  data.note = document.getElementById('plotNote').value;
}

function updatePlotLabel(obj, text) {
  if (obj._label) {
    obj._label.set({ text: text });
    canvas.renderAll();
  }
}

function onObjectModified(e) {
  const obj = e.target;
  if (!obj || !obj.id) return;
  const data = plotDataMap.get(obj.id);
  if (!data) return;

  // 更新尺寸数据
  const w = Math.round(obj.width * obj.scaleX * 100) / 100;
  const h = Math.round(obj.height * obj.scaleY * 100) / 100;
  data.width = w;
  data.height = h;
  data.area = w * h;

  // 如果多边形被缩放，重新计算面积
  if (data.isPolygon && obj.type === 'polygon') {
    const scaledPoints = obj.points.map(p => ({
      x: p.x * obj.scaleX + obj.left,
      y: p.y * obj.scaleY + obj.top,
    }));
    data.area = Math.round(polygonArea(scaledPoints) * 100) / 100;
  }

  if (selectedPlot && selectedPlot.id === obj.id) {
    updatePropertiesPanel(obj);
  }
  updatePlotList();
}

// ==================== 地块列表 ====================
function updatePlotList() {
  const container = document.getElementById('plotList');
  let html = '<div class="plot-list-title">地块列表</div>';
  const allPlots = canvas.getObjects().filter(o => o.id && o.id.indexOf('_label') === -1);

  allPlots.forEach(obj => {
    const data = plotDataMap.get(obj.id);
    if (!data) return;
    const isActive = selectedPlot && selectedPlot.id === obj.id;
    html += `
      <div class="plot-list-item${isActive ? ' active' : ''}" onclick="selectPlotById('${obj.id}')">
        <div class="plot-dot" style="background:${data.color}"></div>
        <span class="plot-name">${data.name}</span>
        <span class="plot-area">${data.area.toFixed(1)}㎡</span>
      </div>`;
  });

  if (allPlots.length === 0) {
    html += '<div style="text-align:center;color:#ccc;font-size:12px;padding:12px;">暂无地块</div>';
  }

  container.innerHTML = html;
}

function selectPlotById(id) {
  const obj = canvas.getObjects().find(o => o.id === id);
  if (obj) {
    canvas.setActiveObject(obj);
    canvas.renderAll();
    onSelect({ selected: [obj] });
    highlightPlotList(id);
  }
}

function highlightPlotList(id) {
  document.querySelectorAll('.plot-list-item').forEach(i => i.classList.remove('active'));
  const items = document.querySelectorAll('.plot-list-item');
  items.forEach(item => {
    if (item.getAttribute('onclick') && item.getAttribute('onclick').includes(id)) {
      item.classList.add('active');
    }
  });
}

// ==================== 删除 ====================
function deleteSelected() {
  if (!selectedPlot) {
    showToast('请先选择要删除的地块');
    return;
  }
  const id = selectedPlot.id;
  pushUndo('delete', id);
  removePlot(id);
  onDeselect();
  updatePlotList();
  canvas.renderAll();
}

function removePlot(id) {
  const obj = canvas.getObjects().find(o => o.id === id);
  if (obj) {
    if (obj._label) canvas.remove(obj._label);
    canvas.remove(obj);
  }
  plotDataMap.delete(id);
}

// ==================== 撤销 ====================
function pushUndo(action, id) {
  const data = action === 'delete' ? { ...plotDataMap.get(id) } : null;
  const obj = action === 'delete' ? canvas.getObjects().find(o => o.id === id) : null;
  const objJson = obj ? obj.toJSON() : null;
  undoStack.push({ action, id, data, objJson, labelJson: obj?._label?.toJSON() || null });
  if (undoStack.length > 50) undoStack.shift();
}

function undoAction() {
  if (undoStack.length === 0) { showToast('没有可撤销的操作'); return; }
  const last = undoStack.pop();
  if (last.action === 'add') {
    removePlot(last.id);
    onDeselect();
  } else if (last.action === 'delete') {
    restorePlot(last);
  }
  updatePlotList();
  canvas.renderAll();
  showToast('已撤销');
}

function restorePlot(entry) {
  if (entry.objJson) {
    fabric.util.enlivenObjects([entry.objJson], (objects) => {
      const obj = objects[0];
      obj.set({ id: entry.id });
      canvas.add(obj);
      plotDataMap.set(entry.id, entry.data);
      if (entry.labelJson) {
        fabric.util.enlivenObjects([entry.labelJson], (labels) => {
          const label = labels[0];
          label.set({ id: entry.id + '_label' });
          canvas.add(label);
          obj._label = label;
          bindLabelToObject(obj, label);
          canvas.renderAll();
        });
      }
    });
  }
}

function bindLabelToObject(obj, label) {
  obj.on('moving', () => {
    label.set({ left: obj.left + obj.width / 2, top: obj.top + obj.height / 2 });
    canvas.renderAll();
  });
  obj.on('scaling', () => {
    label.set({ left: obj.left + obj.width / 2, top: obj.top + obj.height / 2 });
    canvas.renderAll();
  });
  obj.on('rotating', () => {
    label.set({ left: obj.left + obj.width / 2, top: obj.top + obj.height / 2 });
    canvas.renderAll();
  });
}

// ==================== 清空 ====================
function clearAll() {
  const plots = canvas.getObjects().filter(o => o.id && o.id.indexOf('_label') === -1);
  if (plots.length === 0) return;
  if (confirm('确定要清空画布上所有地块吗？此操作不可撤销。')) {
    canvas.getObjects().forEach(o => {
      if (o.id) canvas.remove(o);
    });
    plotDataMap.clear();
    undoStack = [];
    plotCounter = 0;
    onDeselect();
    updatePlotList();
    canvas.renderAll();
    showToast('画布已清空');
  }
}

// ==================== 导出 ====================
function exportImage() {
  // 临时隐藏选中框
  canvas.discardActiveObject();
  canvas.renderAll();

  const dataURL = canvas.toDataURL({
    format: 'png',
    quality: 1,
    multiplier: 2,
  });

  const link = document.createElement('a');
  link.download = '试验地规划_' + formatDate() + '.png';
  link.href = dataURL;
  link.click();
  showToast('图片已导出');
}

function exportPDF() {
  showToast('PDF导出功能开发中，请先使用"导出图片"功能');
}

function formatDate() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

// ==================== 键盘快捷键 ====================
function onKeyDown(e) {
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (document.activeElement.tagName === 'INPUT') return;
    deleteSelected();
  }
  if (e.ctrlKey && e.key === 'z') {
    e.preventDefault();
    undoAction();
  }
  if (e.key === 'v' || e.key === 'V') {
    if (document.activeElement.tagName === 'INPUT') return;
    setTool('select');
  }
  if (e.key === 'r' || e.key === 'R') {
    if (document.activeElement.tagName === 'INPUT') return;
    setTool('rect');
  }
  if (e.key === 'p' || e.key === 'P') {
    if (document.activeElement.tagName === 'INPUT') return;
    setTool('polygon');
  }
}

// ==================== 提示消息 ====================
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

// ==================== 启动 ====================
window.addEventListener('DOMContentLoaded', () => {
  initCanvas();
  showToast('🎨 选择工具开始绘制地块吧！快捷键：R=矩形 P=多边形 V=选择');
});
</script>
