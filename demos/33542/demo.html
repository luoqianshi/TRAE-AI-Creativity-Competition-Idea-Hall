<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZMAGT - UI Demo</title>
<style>
  :root {
    --bg-panel: rgba(99,102,241,0.04);
    --bg-body: #f5f3ff;
    --bg-card: rgba(255,255,255,0.85);
    --bg-input: rgba(255,255,255,0.9);
    --bg-hover: rgba(139,92,246,0.08);
    --text-main: #1e1b4b;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --border-color: rgba(99,102,241,0.15);
    --border-hover: rgba(139,92,246,0.35);
    --primary: #6366f1;
    --primary-light: #8b5cf6;
    --primary-glow: rgba(99,102,241,0.2);
    --shadow-sm: 0 1px 2px rgba(99,102,241,0.04);
    --shadow-md: 0 4px 12px rgba(99,102,241,0.08);
    --shadow-lg: 0 8px 32px rgba(99,102,241,0.12);
    --shadow-xl: 0 24px 64px rgba(99,102,241,0.18);
    --success: #22c55e;
    --danger: #ef4444;
    --warn: #f59e0b;
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
    --radius-full: 9999px;
    --font-xs: 10px;
    --font-sm: 12px;
    --font-md: 13px;
    --font-lg: 14px;
    --font-xl: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 40%, #f093fb 100%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .demo-wrapper {
    width: 100%;
    max-width: 880px;
    background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(237,233,254,0.95) 50%, rgba(224,231,255,0.92) 100%);
    border-radius: 20px;
    box-shadow: 0 24px 64px rgba(99,102,241,0.25), 0 0 0 1px rgba(255,255,255,0.4), inset 0 1px 0 rgba(255,255,255,0.6);
    overflow: hidden;
    backdrop-filter: blur(20px);
  }

  .panel-header {
    padding: 16px 20px;
    background: linear-gradient(135deg, #7c3aed 0%, #6366f1 50%, #8b5cf6 100%);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: move;
    box-shadow: 0 4px 16px rgba(99,102,241,0.3);
  }
  .panel-header h3 { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
  .header-actions { display: flex; gap: 8px; }
  .header-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12); color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .header-btn:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }

  .panel-body { padding: 20px; }
  .three-col { display: flex; gap: 20px; }
  .col-left { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; }
  .col-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

  .module-title {
    font-size: var(--font-xs); font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .section { margin-bottom: 12px; }
  .label { display: block; font-size: var(--font-xs); font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
  .input-row { display: flex; gap: 6px; }
  .input, .textarea, .select {
    width: 100%; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border-color);
    border-radius: var(--radius-md); color: var(--text-main); font-size: var(--font-md); outline: none;
    transition: all 0.15s; font-family: inherit;
  }
  .input:focus, .textarea:focus, .select:focus {
    border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow);
  }
  .input::placeholder, .textarea::placeholder { color: var(--text-muted); }
  .textarea { resize: none; min-height: 80px; }
  .btn-sm {
    padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-color);
    background: var(--bg-card); color: var(--text-main); font-size: var(--font-xs); font-weight: 600;
    cursor: pointer; transition: all 0.15s; white-space: nowrap; font-family: inherit;
  }
  .btn-sm:hover { background: var(--bg-hover); border-color: var(--border-hover); }
  .btn-sm.primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border-color: transparent; box-shadow: 0 2px 8px rgba(99,102,241,0.25); }
  .btn-sm.primary:hover { background: linear-gradient(135deg, #818cf8, #a78bfa); box-shadow: 0 4px 12px rgba(99,102,241,0.35); }
  .btn-sm.danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }
  .btn-sm.danger:hover { background: #fef2f2; border-color: var(--danger); }

  .config-row { display: flex; gap: 10px; margin-bottom: 8px; }
  .config-row .col { flex: 1; }
  .config-row .select { padding: 6px 8px; font-size: var(--font-xs); }

  .col-mid-body { display: flex; gap: 14px; min-height: 200px; }
  .col-mid-left { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  .col-mid-right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

  .queue-toolbar { display: flex; gap: 4px; }
  .queue-toolbar .input { font-size: var(--font-xs); padding: 6px 8px; }
  .queue-toolbar .btn-sm { font-size: 10px; padding: 5px 8px; }

  .queue-ops { display: flex; align-items: center; gap: 6px; font-size: var(--font-xs); color: var(--text-muted); }
  .count { font-weight: 700; color: var(--primary); }

  .queue-list, .image-list { display: flex; flex-direction: column; gap: 4px; max-height: 180px; overflow-y: auto; }
  .queue-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--bg-card);
    border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: var(--font-xs);
    cursor: pointer; transition: all 0.15s;
  }
  .queue-item:hover { border-color: var(--primary); background: rgba(99,102,241,0.03); }
  .queue-item.checked { border-color: var(--primary); background: rgba(99,102,241,0.06); }
  .queue-item .status { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .queue-item .status.pending { background: var(--text-muted); }
  .queue-item .status.active { background: var(--primary); animation: flowPulse 1s infinite; }
  .queue-item .status.done { background: var(--success); }
  .queue-item .status.fail { background: var(--danger); }
  .queue-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
  .queue-item .del { color: var(--text-muted); cursor: pointer; font-size: 14px; }
  .queue-item .del:hover { color: var(--danger); }

  .origin-preview {
    width: 100%; aspect-ratio: 3/4; background: var(--bg-hover); border: 1px dashed var(--border-color);
    border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center;
    color: var(--text-muted); font-size: var(--font-xs); overflow: hidden; position: relative;
  }
  .origin-preview img { width: 100%; height: 100%; object-fit: contain; }
  .origin-preview .placeholder { color: var(--text-muted); font-size: var(--font-xs); }

  .action-row { display: flex; gap: 6px; }
  .action-row > * { flex: 1 !important; height: 34px !important; text-align: center; font-size: var(--font-xs) !important; font-weight: 600 !important; padding: 0 10px !important; border-radius: var(--radius-md) !important; white-space: nowrap !important; letter-spacing: 0.2px !important; transition: all 0.15s; font-family: inherit; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: 1px solid transparent; box-shadow: 0 2px 8px rgba(99,102,241,0.25); }
  .btn-primary:hover { background: linear-gradient(135deg, #818cf8, #a78bfa); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,0.35); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary { background: rgba(255,255,255,0.8); color: var(--text-main); border: 1px solid var(--border-color); }
  .btn-secondary:hover { background: rgba(139,92,246,0.1); border-color: var(--primary-light); }
  .flow-canvas-btn { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .flow-canvas-btn:hover { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; transform: translateY(-1px); box-shadow: 0 4px 12px var(--primary-glow); }

  .progress {
    height: 6px; background: var(--bg-hover); border-radius: var(--radius-full); overflow: hidden;
  }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6, #a855f7); border-radius: var(--radius-full); transition: width 0.3s; width: 0%; }
  .status-text { font-size: var(--font-xs); color: var(--text-muted); margin-top: 4px; text-align: center; }

  .feature-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .feature-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(237,233,254,0.9) 100%);
    border: 1px solid rgba(139,92,246,0.2); border-radius: var(--radius-lg);
    padding: 18px 14px; text-align: center; transition: all 0.2s; cursor: default;
    box-shadow: 0 2px 8px rgba(99,102,241,0.06);
  }
  .feature-card:hover {
    border-color: rgba(139,92,246,0.5); transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(99,102,241,0.2);
    background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(221,214,254,0.95) 100%);
  }
  .feature-icon { font-size: 22px; margin-bottom: 8px; }
  .feature-title { font-size: var(--font-sm); font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
  .feature-desc { font-size: 10px; color: var(--text-muted); line-height: 1.5; }

  .flow-overlay {
    position: fixed; inset: 0; z-index: 2147483646; background: var(--bg-body);
    display: none; flex-direction: column;
  }
  .flow-overlay.visible { display: flex; }
  .flow-overlay-header {
    padding: 14px 20px; background: linear-gradient(135deg, #4f46e5, #6366f1);
    color: white; display: flex; align-items: center; justify-content: space-between;
  }
  .flow-overlay-title { font-size: var(--font-xl); font-weight: 700; }
  .flow-overlay-stats { font-size: var(--font-xs); opacity: 0.9; background: rgba(255,255,255,0.12); padding: 4px 12px; border-radius: var(--radius-full); }
  .flow-overlay-close {
    width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); color: white; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .flow-overlay-close:hover { background: rgba(255,255,255,0.2); }
  .flow-overlay-body { flex: 1; overflow: auto; padding: 24px; }

  .lightbox {
    position: fixed; inset: 0; z-index: 2147483647; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
  }
  .lightbox.visible { display: flex; }
  .lightbox-close { position: absolute; top: 20px; right: 24px; color: white; font-size: 24px; cursor: pointer; }
  .lightbox-img { max-width: 90vw; max-height: 80vh; border-radius: var(--radius-lg); box-shadow: 0 24px 64px rgba(0,0,0,0.4); }
  .lightbox-actions { display: flex; gap: 10px; }
  .lightbox-actions button {
    padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1); color: white; cursor: pointer; font-size: var(--font-sm); font-family: inherit;
  }
  .lightbox-actions button:hover { background: rgba(255,255,255,0.2); }

  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2147483647; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    padding: 10px 16px; border-radius: var(--radius-md); color: white; font-size: var(--font-sm);
    font-weight: 600; box-shadow: var(--shadow-lg); animation: toastIn 0.3s ease; min-width: 200px;
  }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.info { background: var(--primary); }
  .toast.warn { background: var(--warn); color: #1e1b4b; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  @keyframes flowPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
</style>
</head>
<body>

<div class="demo-wrapper">
  <div class="panel-header" id="dragHandle">
    <h3>ZMAGT — AI 智能图片生成助手</h3>
    <div class="header-actions">
      <button class="header-btn" title="切换主题">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <button class="header-btn" title="全屏">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </button>
      <button class="header-btn" title="最小化">&#9472;</button>
    </div>
  </div>

  <div class="panel-body">
    <div class="three-col">
      <div class="col-left">
        <div class="module-title">提示词</div>
        <div class="section">
          <label class="label">API Key</label>
          <div class="input-row">
            <input class="input" type="password" placeholder="输入API Key">
            <button class="btn-sm primary">显示</button>
          </div>
        </div>
        <div class="section">
          <label class="label">提示词</label>
          <textarea class="textarea" placeholder="描述你要生成的图片..." rows="3"></textarea>
          <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
            <span class="btn-sm" style="cursor:pointer;">📋 自定义模板</span>
            <span class="btn-sm primary" style="cursor:pointer;">＋ 保存当前</span>
          </div>
        </div>
        <div class="module-title">配置</div>
        <div class="config-row">
          <div class="col">
            <label class="label">比例</label>
            <select class="select"><option>3:4</option><option>1:1</option><option>16:9</option></select>
          </div>
        </div>
        <div class="config-row">
          <div class="col">
            <label class="label">分辨率</label>
            <select class="select"><option>1K</option><option selected>2K</option><option>4K</option></select>
          </div>
          <div class="col">
            <label class="label">并发数</label>
            <select class="select"><option>1</option><option selected>5</option><option>10</option><option>20</option></select>
          </div>
        </div>
      </div>

      <div class="col-mid">
        <div class="module-title">原图</div>
        <div class="col-mid-body">
          <div class="col-mid-left">
            <div class="queue-toolbar">
              <input class="input" placeholder="图片URL，回车添加">
              <button class="btn-sm primary">＋</button>
              <button class="btn-sm">采集</button>
              <button class="btn-sm">目标</button>
            </div>
            <div class="queue-ops">
              <span class="count">0 张</span>
              <button class="btn-sm">全选</button>
              <button class="btn-sm">反选</button>
              <button class="btn-sm danger">清空</button>
            </div>
            <div class="queue-list">
              <div class="queue-item checked">
                <div class="status active"></div>
                <span class="name">product_001.jpg</span>
                <span class="del">✕</span>
              </div>
              <div class="queue-item checked">
                <div class="status pending"></div>
                <span class="name">product_002.jpg</span>
                <span class="del">✕</span>
              </div>
              <div class="queue-item">
                <div class="status done"></div>
                <span class="name">product_003.jpg</span>
                <span class="del">✕</span>
              </div>
            </div>
            <div class="image-list" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px;">
              <div style="aspect-ratio:1; background:#e2e8f0; border-radius:6px;"></div>
              <div style="aspect-ratio:1; background:#e2e8f0; border-radius:6px;"></div>
              <div style="aspect-ratio:1; background:#e2e8f0; border-radius:6px;"></div>
            </div>
          </div>
          <div class="col-mid-right">
            <div class="origin-preview">
              <span class="placeholder">点击队列图片预览</span>
            </div>
            <div class="action-row">
              <button class="btn-primary">▶ 批量选中</button>
              <button class="btn-primary">▶ 单张</button>
              <button class="btn-secondary">重试</button>
              <button class="flow-canvas-btn">画布</button>
              <button class="btn-primary" disabled>套图</button>
            </div>
            <div class="progress">
              <div class="progress-bar" style="width: 45%;"></div>
            </div>
            <div class="status-text">处理中 1~5/10...</div>
          </div>
        </div>

        <div class="feature-cards">
          <div class="feature-card">
            <div class="feature-icon">⚡</div>
            <div class="feature-title">高效生成</div>
            <div class="feature-desc">批量处理多张图片<br>快速生成高质量结果</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🟣</div>
            <div class="feature-title">智能优化</div>
            <div class="feature-desc">AI智能优化提示词<br>提升生成效果</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">📦</div>
            <div class="feature-title">批量管理</div>
            <div class="feature-desc">支持批量上传<br>统一管理原图</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">✅</div>
            <div class="feature-title">专业输出</div>
            <div class="feature-desc">多种尺寸比例<br>满足不同平台需求</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="flow-overlay" id="flowOverlay">
  <div class="flow-overlay-header">
    <div>
      <span class="flow-overlay-title">连线画布</span>
      <span class="flow-overlay-stats" style="margin-left:12px;">3 原图 → 12 新图</span>
    </div>
    <button class="flow-overlay-close" onclick="document.getElementById('flowOverlay').classList.remove('visible')">✕</button>
  </div>
  <div class="flow-overlay-body">
    <div style="display:flex; align-items:center; justify-content:center; height:100%; color: var(--text-muted);">
      连线画布预览区域
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('visible')">✕</div>
  <img class="lightbox-img" src="" alt="预览">
  <div class="lightbox-actions">
    <button>上一张</button>
    <button>复制链接</button>
    <button>下载图片</button>
    <button>新标签打开</button>
    <button>下一张</button>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
  function showToast(msg, type='info') {
    const container = document.getElementById('toastContainer')
    const toast = document.createElement('div')
    toast.className = 'toast ' + type
    toast.textContent = msg
    container.appendChild(toast)
    setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300) }, 2500)
  }
  document.querySelectorAll('.queue-item').forEach(item => {
    item.addEventListener('click', () => item.classList.toggle('checked'))
  })
  document.querySelectorAll('.header-btn').forEach(btn => {
    btn.addEventListener('click', () => showToast('功能演示', 'info'))
  })
</script>

</body>
</html>
