<body>
  <div class="container">
    <header>
      <h1>学生成绩统计系统</h1>
      <p>录入、管理和分析学生成绩数据，支持实时统计与可视化展示</p>
    </header>

    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="label">学生总数</div>
        <div class="value" id="totalStudents">0</div>
      </div>
      <div class="stat-card">
        <div class="label">平均分</div>
        <div class="value" id="avgScore">0</div>
      </div>
      <div class="stat-card">
        <div class="label">最高分</div>
        <div class="value" id="maxScore">0</div>
      </div>
      <div class="stat-card">
        <div class="label">最低分</div>
        <div class="value" id="minScore">0</div>
      </div>
      <div class="stat-card">
        <div class="label">及格率</div>
        <div class="value" id="passRate">0%</div>
      </div>
      <div class="stat-card">
        <div class="label">优秀率</div>
        <div class="value" id="excellentRate">0%</div>
      </div>
    </div>

    <!-- 录入表单 -->
    <div class="form-section">
      <h2>成绩录入</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="studentName">学生姓名</label>
          <input type="text" id="studentName" placeholder="请输入学生姓名">
        </div>
        <div class="form-group">
          <label for="studentId">学号</label>
          <input type="text" id="studentId" placeholder="请输入学号">
        </div>
        <div class="form-group">
          <label for="subject">科目</label>
          <select id="subject">
            <option value="语文">语文</option>
            <option value="数学">数学</option>
            <option value="英语">英语</option>
            <option value="物理">物理</option>
            <option value="化学">化学</option>
            <option value="生物">生物</option>
            <option value="历史">历史</option>
            <option value="地理">地理</option>
            <option value="政治">政治</option>
          </select>
        </div>
        <div class="form-group">
          <label for="score">成绩</label>
          <input type="number" id="score" min="0" max="100" placeholder="0-100">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addRecord()">添加成绩</button>
        <button class="btn btn-success" onclick="importDemoData()">导入示例数据</button>
        <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
        <button class="btn btn-danger" onclick="clearAllData()">清空数据</button>
      </div>
    </div>

    <!-- 成绩表格 -->
    <div class="table-section">
      <h2>成绩列表</h2>
      <div class="table-wrap">
        <table id="gradeTable">
          <thead>
            <tr>
              <th>学号</th>
              <th>姓名</th>
              <th>科目</th>
              <th>成绩</th>
              <th>等级</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="6" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <path d="M3 9h18M9 21V9"/>
                </svg>
                <p>暂无成绩数据，请添加或导入示例数据</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 图表区域 -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3>成绩分布</h3>
        <div id="gradeDistributionChart" class="chart-container"></div>
      </div>
      <div class="chart-card">
        <h3>科目平均分对比</h3>
        <div id="subjectAvgChart" class="chart-container"></div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>成绩等级分布</h3>
        <div id="gradeLevelChart" class="chart-container"></div>
      </div>
      <div class="chart-card">
        <h3>学生成绩趋势</h3>
        <div id="studentTrendChart" class="chart-container"></div>
      </div>
    </div>
  </div>

  <!-- 编辑模态框 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>编辑成绩</h3>
      <div class="form-group">
        <label>学生姓名</label>
        <input type="text" id="editName" readonly>
      </div>
      <div class="form-group">
        <label>学号</label>
        <input type="text" id="editId" readonly>
      </div>
      <div class="form-group">
        <label>科目</label>
        <input type="text" id="editSubject" readonly>
      </div>
      <div class="form-group">
        <label>成绩</label>
        <input type="number" id="editScore" min="0" max="100">
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="saveEdit()">保存</button>
      </div>
    </div>
  </div>

  <!-- 提示消息 -->
  <div class="toast" id="toast"></div>

  <script>
    // 数据存储
    let grades = JSON.parse(localStorage.getItem('studentGrades')) || [];
    let editingIndex = -1;

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      renderTable();
      updateStats();
      initCharts();
    });

    // 获取等级
    function getGradeLevel(score) {
      if (score >= 90) return { level: '优秀', class: 'grade-excellent' };
      if (score >= 80) return { level: '良好', class: 'grade-good' };
      if (score >= 60) return { level: '及格', class: 'grade-pass' };
      return { level: '不及格', class: 'grade-fail' };
    }

    // 添加记录
    function addRecord() {
      const name = document.getElementById('studentName').value.trim();
      const id = document.getElementById('studentId').value.trim();
      const subject = document.getElementById('subject').value;
      const score = parseFloat(document.getElementById('score').value);

      if (!name || !id || isNaN(score) || score < 0 || score > 100) {
        showToast('请填写完整信息，成绩范围为0-100', 'error');
        return;
      }

      // 检查是否已存在相同学号+科目的记录
      const existingIndex = grades.findIndex(g => g.id === id && g.subject === subject);
      if (existingIndex !== -1) {
        if (!confirm('该学生此科目已有成绩，是否覆盖？')) return;
        grades[existingIndex] = { id, name, subject, score, time: new Date().toISOString() };
      } else {
        grades.push({ id, name, subject, score, time: new Date().toISOString() });
      }

      saveData();
      renderTable();
      updateStats();
      updateCharts();
      clearForm();
      showToast('成绩添加成功', 'success');
    }

    // 删除记录
    function deleteRecord(index) {
      if (!confirm('确定要删除这条记录吗？')) return;
      grades.splice(index, 1);
      saveData();
      renderTable();
      updateStats();
      updateCharts();
      showToast('记录已删除', 'info');
    }

    // 打开编辑模态框
    function editRecord(index) {
      editingIndex = index;
      const record = grades[index];
      document.getElementById('editName').value = record.name;
      document.getElementById('editId').value = record.id;
      document.getElementById('editSubject').value = record.subject;
      document.getElementById('editScore').value = record.score;
      document.getElementById('editModal').classList.add('active');
    }

    // 关闭模态框
    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
      editingIndex = -1;
    }

    // 保存编辑
    function saveEdit() {
      if (editingIndex === -1) return;
      const score = parseFloat(document.getElementById('editScore').value);
      if (isNaN(score) || score < 0 || score > 100) {
        showToast('成绩范围为0-100', 'error');
        return;
      }
      grades[editingIndex].score = score;
      grades[editingIndex].time = new Date().toISOString();
      saveData();
      renderTable();
      updateStats();
      updateCharts();
      closeModal();
      showToast('成绩修改成功', 'success');
    }

    // 渲染表格
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      if (grades.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M9 21V9"/>
              </svg>
              <p>暂无成绩数据，请添加或导入示例数据</p>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = grades.map((record, index) => {
        const gradeInfo = getGradeLevel(record.score);
        return `
          <tr>
            <td>${record.id}</td>
            <td>${record.name}</td>
            <td>${record.subject}</td>
            <td class="${gradeInfo.class}">${record.score}</td>
            <td class="${gradeInfo.class}">${gradeInfo.level}</td>
            <td>
              <div class="actions">
                <button class="btn btn-primary" onclick="editRecord(${index})">编辑</button>
                <button class="btn btn-danger" onclick="deleteRecord(${index})">删除</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 更新统计
    function updateStats() {
      const total = grades.length;
      document.getElementById('totalStudents').textContent = total;

      if (total === 0) {
        document.getElementById('avgScore').textContent = '0';
        document.getElementById('maxScore').textContent = '0';
        document.getElementById('minScore').textContent = '0';
        document.getElementById('passRate').textContent = '0%';
        document.getElementById('excellentRate').textContent = '0%';
        return;
      }

      const scores = grades.map(g => g.score);
      const avg = (scores.reduce((a, b) => a + b, 0) / total).toFixed(1);
      const max = Math.max(...scores);
      const min = Math.min(...scores);
      const passCount = scores.filter(s => s >= 60).length;
      const excellentCount = scores.filter(s => s >= 90).length;

      document.getElementById('avgScore').textContent = avg;
      document.getElementById('maxScore').textContent = max;
      document.getElementById('minScore').textContent = min;
      document.getElementById('passRate').textContent = ((passCount / total) * 100).toFixed(1) + '%';
      document.getElementById('excellentRate').textContent = ((excellentCount / total) * 100).toFixed(1) + '%';
    }

    // 保存数据到本地存储
    function saveData() {
      localStorage.setItem('studentGrades', JSON.stringify(grades));
    }

    // 清空表单
    function clearForm() {
      document.getElementById('studentName').value = '';
      document.getElementById('studentId').value = '';
      document.getElementById('score').value = '';
    }

    // 导入示例数据
    function importDemoData() {
      const demoData = [
        { id: '2024001', name: '张三', subject: '语文', score: 85, time: new Date().toISOString() },
        { id: '2024001', name: '张三', subject: '数学', score: 92, time: new Date().toISOString() },
        { id: '2024001', name: '张三', subject: '英语', score: 78, time: new Date().toISOString() },
        { id: '2024002', name: '李四', subject: '语文', score: 76, time: new Date().toISOString() },
        { id: '2024002', name: '李四', subject: '数学', score: 88, time: new Date().toISOString() },
        { id: '2024002', name: '李四', subject: '英语', score: 95, time: new Date().toISOString() },
        { id: '2024003', name: '王五', subject: '语文', score: 92, time: new Date().toISOString() },
        { id: '2024003', name: '王五', subject: '数学', score: 65, time: new Date().toISOString() },
        { id: '2024003', name: '王五', subject: '英语', score: 82, time: new Date().toISOString() },
        { id: '2024004', name: '赵六', subject: '语文', score: 58, time: new Date().toISOString() },
        { id: '2024004', name: '赵六', subject: '数学', score: 72, time: new Date().toISOString() },
        { id: '2024004', name: '赵六', subject: '英语', score: 68, time: new Date().toISOString() },
        { id: '2024005', name: '钱七', subject: '语文', score: 90, time: new Date().toISOString() },
        { id: '2024005', name: '钱七', subject: '数学', score: 95, time: new Date().toISOString() },
        { id: '2024005', name: '钱七', subject: '英语', score: 88, time: new Date().toISOString() },
        { id: '2024006', name: '孙八', subject: '语文', score: 72, time: new Date().toISOString() },
        { id: '2024006', name: '孙八', subject: '数学', score: 78, time: new Date().toISOString() },
        { id: '2024006', name: '孙八', subject: '英语', score: 65, time: new Date().toISOString() },
      ];

      grades = [...grades, ...demoData];
      saveData();
      renderTable();
      updateStats();
      updateCharts();
      showToast('示例数据导入成功', 'success');
    }

    // 导出数据
    function exportData() {
      if (grades.length === 0) {
        showToast('没有数据可导出', 'error');
        return;
      }
      const dataStr = JSON.stringify(grades, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '学生成绩数据.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('数据已导出', 'success');
    }

    // 清空所有数据
    function clearAllData() {
      if (!confirm('确定要清空所有数据吗？此操作不可恢复！')) return;
      grades = [];
      saveData();
      renderTable();
      updateStats();
      updateCharts();
      showToast('所有数据已清空', 'info');
    }

    // 显示提示
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // 图表实例
    let gradeDistChart, subjectAvgChart, gradeLevelChart, studentTrendChart;

    // 初始化图表
    function initCharts() {
      const style = getComputedStyle(document.documentElement);
      const accent = style.getPropertyValue('--accent').trim();
      const accent2 = style.getPropertyValue('--accent2').trim();
      const muted = style.getPropertyValue('--muted').trim();
      const danger = style.getPropertyValue('--danger').trim();
      const warning = style.getPropertyValue('--warning').trim();

      gradeDistChart = echarts.init(document.getElementById('gradeDistributionChart'), null, { renderer: 'svg' });
      subjectAvgChart = echarts.init(document.getElementById('subjectAvgChart'), null, { renderer: 'svg' });
      gradeLevelChart = echarts.init(document.getElementById('gradeLevelChart'), null, { renderer: 'svg' });
      studentTrendChart = echarts.init(document.getElementById('studentTrendChart'), null, { renderer: 'svg' });

      updateCharts();

      window.addEventListener('resize', function() {
        gradeDistChart.resize();
        subjectAvgChart.resize();
        gradeLevelChart.resize();
        studentTrendChart.resize();
      });
    }

    // 更新图表
    function updateCharts() {
      if (grades.length === 0) {
        gradeDistChart.clear();
        subjectAvgChart.clear();
        gradeLevelChart.clear();
        studentTrendChart.clear();
        return;
      }

      const style = getComputedStyle(document.documentElement);
      const accent = style.getPropertyValue('--accent').trim();
      const accent2 = style.getPropertyValue('--accent2').trim();
      const muted = style.getPropertyValue('--muted').trim();
      const danger = style.getPropertyValue('--danger').trim();
      const warning = style.getPropertyValue('--warning').trim();
      const ink = style.getPropertyValue('--ink').trim();
      const bg2 = style.getPropertyValue('--bg2').trim();

      // 1. 成绩分布柱状图
      const scoreRanges = ['0-59', '60-69', '70-79', '80-89', '90-100'];
      const rangeCounts = [0, 0, 0, 0, 0];
      grades.forEach(g => {
        const s = g.score;
        if (s < 60) rangeCounts[0]++;
        else if (s < 70) rangeCounts[1]++;
        else if (s < 80) rangeCounts[2]++;
        else if (s < 90) rangeCounts[3]++;
        else rangeCounts[4]++;
      });

      gradeDistChart.setOption({
        animation: false,
        tooltip: { trigger: 'axis', appendToBody: true },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: {
          type: 'category',
          data: scoreRanges,
          axisLabel: { color: muted },
          axisLine: { lineStyle: { color: '#e2e8f0' } }
        },
        yAxis: {
          type: 'value',
          axisLabel: { color: muted },
          splitLine: { lineStyle: { color: '#f1f5f9' } }
        },
        series: [{
          data: rangeCounts,
          type: 'bar',
          barWidth: '60%',
          itemStyle: {
            color: function(params) {
              const colors = [danger, warning, warning + 'cc', accent, accent2];
              return colors[params.dataIndex];
            },
            borderRadius: [4, 4, 0, 0]
          },
          label: { show: true, position: 'top', color: ink }
        }]
      });

      // 2. 科目平均分对比
      const subjectMap = {};
      const subjectCount = {};
      grades.forEach(g => {
        if (!subjectMap[g.subject]) { subjectMap[g.subject] = 0; subjectCount[g.subject] = 0; }
        subjectMap[g.subject] += g.score;
        subjectCount[g.subject]++;
      });
      const subjects = Object.keys(subjectMap);
      const subjectAvgs = subjects.map(s => (subjectMap[s] / subjectCount[s]).toFixed(1));

      subjectAvgChart.setOption({
        animation: false,
        tooltip: { trigger: 'axis', appendToBody: true, formatter: '{b}: {c}分' },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: {
          type: 'value',
          max: 100,
          axisLabel: { color: muted },
          splitLine: { lineStyle: { color: '#f1f5f9' } }
        },
        yAxis: {
          type: 'category',
          data: subjects,
          axisLabel: { color: muted },
          axisLine: { lineStyle: { color: '#e2e8f0' } }
        },
        series: [{
          data: subjectAvgs,
          type: 'bar',
          barWidth: '50%',
          itemStyle: { color: accent, borderRadius: [0, 4, 4, 0] },
          label: { show: true, position: 'right', color: ink, formatter: '{c}分' }
        }]
      });

      // 3. 成绩等级分布饼图
      const levelCounts = { '优秀': 0, '良好': 0, '及格': 0, '不及格': 0 };
      grades.forEach(g => {
        const level = getGradeLevel(g.score).level;
        levelCounts[level]++;
      });

      gradeLevelChart.setOption({
        animation: false,
        tooltip: { trigger: 'item', appendToBody: true, formatter: '{b}: {c}人 ({d}%)' },
        legend: { bottom: '5%', textStyle: { color: muted } },
        series: [{
          type: 'pie',
          radius: ['40%', '70%'],
          center: ['50%', '45%'],
          avoidLabelOverlap: false,
          itemStyle: { borderRadius: 6, borderColor: bg2, borderWidth: 2 },
          label: { show: true, formatter: '{b}\n{c}人', color: ink },
          data: [
            { value: levelCounts['优秀'], name: '优秀', itemStyle: { color: accent2 } },
            { value: levelCounts['良好'], name: '良好', itemStyle: { color: accent } },
            { value: levelCounts['及格'], name: '及格', itemStyle: { color: warning } },
            { value: levelCounts['不及格'], name: '不及格', itemStyle: { color: danger } }
          ]
        }]
      });

      // 4. 学生成绩趋势（取前8个学生的平均分）
      const studentMap = {};
      const studentCount = {};
      grades.forEach(g => {
        if (!studentMap[g.name]) { studentMap[g.name] = 0; studentCount[g.name] = 0; }
        studentMap[g.name] += g.score;
        studentCount[g.name]++;
      });
      const studentNames = Object.keys(studentMap).slice(0, 8);
      const studentAvgs = studentNames.map(s => (studentMap[s] / studentCount[s]).toFixed(1));

      studentTrendChart.setOption({
        animation: false,
        tooltip: { trigger: 'axis', appendToBody: true },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: {
          type: 'category',
          data: studentNames,
          axisLabel: { color: muted, rotate: 30 },
          axisLine: { lineStyle: { color: '#e2e8f0' } }
        },
        yAxis: {
          type: 'value',
          max: 100,
          axisLabel: { color: muted },
          splitLine: { lineStyle: { color: '#f1f5f9' } }
        },
        series: [{
          data: studentAvgs,
          type: 'line',
          smooth: true,
          symbol: 'circle',
          symbolSize: 8,
          lineStyle: { color: accent, width: 3 },
          itemStyle: { color: accent, borderWidth: 2, borderColor: bg2 },
          areaStyle: {
            color: {
              type: 'linear',
              x: 0, y: 0, x2: 0, y2: 1,
              colorStops: [
                { offset: 0, color: accent + '40' },
                { offset: 1, color: accent + '05' }
              ]
            }
          },
          label: { show: true, position: 'top', color: ink, formatter: '{c}分' }
        }]
      });
    }
  </script>
</body>
</html>
