<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鸿蒙心流番茄打卡器</title>
<style>
  :root {
    --bg: #FFFBF5;
    --bg2: #FFF5E6;
    --ink: #2D2A26;
    --muted: #8A827A;
    --rule: #E8E0D6;
    --accent: #E85D3F;
    --accent-light: #F5A89A;
    --accent2: #2AAE9A;
    --accent2-light: #7DD4C6;
    --white: #FFFFFF;
    --shadow: 0 4px 20px rgba(45,42,38,0.08);
    --shadow-lg: 0 8px 32px rgba(45,42,38,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    font-size: 15px;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Header */
  .app-header {
    background: linear-gradient(135deg, var(--accent) 0%, #D44A2F 100%);
    color: var(--white);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(232,93,63,0.3);
  }
  .app-header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .header-date {
    font-size: 12px;
    opacity: 0.9;
  }

  /* Tab Bar */
  .tab-bar {
    display: flex;
    background: var(--white);
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: 56px;
    z-index: 99;
  }
  .tab-btn {
    flex: 1;
    padding: 14px 0;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
  }
  .tab-btn.active {
    color: var(--accent);
  }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 25%;
    right: 25%;
    height: 3px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }

  /* Tab Content */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Timer Section */
  .timer-section {
    padding: 32px 20px;
    text-align: center;
  }

  .timer-modes {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .mode-btn {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1px solid var(--rule);
    background: var(--white);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--accent);
    color: var(--white);
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(232,93,63,0.3);
  }

  /* Tomato Circle */
  .timer-circle-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 0 auto 28px;
  }
  .timer-circle-bg {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(var(--accent) 0deg, var(--accent-light) 0deg, var(--bg2) 0deg);
    padding: 8px;
    transition: background 0.3s;
  }
  .timer-circle-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
  }
  .timer-display {
    font-size: 56px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    line-height: 1;
  }
  .timer-label {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  .timer-status {
    font-size: 12px;
    color: var(--accent);
    margin-top: 4px;
    font-weight: 600;
  }

  /* Timer Controls */
  .timer-controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  .ctrl-btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    box-shadow: var(--shadow);
  }
  .ctrl-btn:active { transform: scale(0.95); }
  .ctrl-btn.primary {
    background: linear-gradient(135deg, var(--accent) 0%, #D44A2F 100%);
    color: var(--white);
    width: 72px;
    height: 72px;
    font-size: 28px;
    box-shadow: 0 4px 16px rgba(232,93,63,0.35);
  }
  .ctrl-btn.secondary {
    background: var(--white);
    color: var(--muted);
    border: 1px solid var(--rule);
  }

  /* Timer Stats Row */
  .timer-stats-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 8px;
  }
  .timer-stat {
    text-align: center;
  }
  .timer-stat .val {
    font-size: 20px;
    font-weight: 700;
    color: var(--ink);
  }
  .timer-stat .lab {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Task Section */
  .task-section {
    padding: 20px;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 17px;
    font-weight: 700;
  }
  .section-action {
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    background: none;
    border: none;
  }

  /* Add Task Input */
  .add-task-box {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    padding: 12px;
    background: var(--white);
    border-radius: 12px;
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
  }
  .add-task-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    background: transparent;
    color: var(--ink);
  }
  .add-task-box input::placeholder { color: var(--muted); }
  .add-task-box button {
    background: var(--accent);
    color: var(--white);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* Task List */
  .task-list { list-style: none; }
  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--white);
    border-radius: 12px;
    margin-bottom: 10px;
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
    transition: all 0.2s;
  }
  .task-item:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-1px);
  }
  .task-item.completed .task-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .task-check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--rule);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s;
    font-size: 14px;
    color: transparent;
  }
  .task-item.completed .task-check {
    background: var(--accent2);
    border-color: var(--accent2);
    color: var(--white);
  }
  .task-text {
    flex: 1;
    font-size: 15px;
    color: var(--ink);
  }
  .task-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .task-delete:hover { opacity: 1; color: var(--accent); }

  .task-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  /* Stats Section */
  .stats-section {
    padding: 20px;
  }

  .stats-cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stats-card {
    background: var(--white);
    border-radius: 14px;
    padding: 18px 16px;
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
    text-align: center;
  }
  .stats-card .icon {
    font-size: 28px;
    margin-bottom: 8px;
  }
  .stats-card .val {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .stats-card .val.green { color: var(--accent2); }
  .stats-card .lab {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Chart Box */
  .chart-box {
    background: var(--white);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid var(--rule);
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .chart-box h4 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .week-bar-chart {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    height: 160px;
    gap: 8px;
  }
  .bar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .bar-fill {
    width: 100%;
    max-width: 36px;
    background: linear-gradient(to top, var(--accent), var(--accent-light));
    border-radius: 6px 6px 0 0;
    transition: height 0.5s ease;
    min-height: 4px;
  }
  .bar-fill.today {
    background: linear-gradient(to top, var(--accent2), var(--accent2-light));
  }
  .bar-label {
    font-size: 11px;
    color: var(--muted);
  }
  .bar-val {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink);
  }

  /* Heatmap */
  .heatmap-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .heatmap-cell {
    aspect-ratio: 1;
    border-radius: 4px;
    background: var(--bg2);
    transition: transform 0.15s;
  }
  .heatmap-cell.l1 { background: var(--accent-light); opacity: 0.3; }
  .heatmap-cell.l2 { background: var(--accent-light); opacity: 0.55; }
  .heatmap-cell.l3 { background: var(--accent-light); opacity: 0.8; }
  .heatmap-cell.l4 { background: var(--accent); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Focus overlay */
  .focus-overlay {
    position: fixed;
    inset: 0;
    background: rgba(45,42,38,0.92);
    z-index: 150;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--white);
  }
  .focus-overlay.active { display: flex; }
  .focus-overlay .focus-timer {
    font-size: 80px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 20px;
  }
  .focus-overlay .focus-text {
    font-size: 18px;
    opacity: 0.8;
    margin-bottom: 40px;
  }
  .focus-overlay .focus-exit {
    background: rgba(255,255,255,0.15);
    color: var(--white);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 12px 32px;
    border-radius: 24px;
    font-size: 15px;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  .focus-overlay .focus-exit:hover {
    background: rgba(255,255,255,0.25);
  }

  /* Animations */
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  .timer-circle-wrap.running {
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-item {
    animation: slideIn 0.3s ease;
  }

  /* Responsive */
  @media (min-width: 600px) {
    body {
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 0 40px rgba(0,0,0,0.08);
    }
  }
</style>
</head>
<body>

<header class="app-header">
  <h1>🍅 鸿蒙心流番茄打卡器</h1>
  <span class="header-date" id="headerDate"></span>
</header>

<nav class="tab-bar">
  <button class="tab-btn active" data-tab="timer">⏱️ 专注</button>
  <button class="tab-btn" data-tab="tasks">✅ 打卡</button>
  <button class="tab-btn" data-tab="stats">📊 统计</button>
</nav>

<!-- Timer Tab -->
<div class="tab-content active" id="tab-timer">
  <div class="timer-section">
    <div class="timer-modes">
      <button class="mode-btn active" data-min="25">专注 25分</button>
      <button class="mode-btn" data-min="5">休息 5分</button>
      <button class="mode-btn" data-min="15">长休 15分</button>
    </div>

    <div class="timer-circle-wrap" id="timerCircleWrap">
      <div class="timer-circle-bg" id="timerCircleBg">
        <div class="timer-circle-inner">
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div class="timer-label" id="timerLabel">准备开始专注</div>
          <div class="timer-status" id="timerStatus">点击开始</div>
        </div>
      </div>
    </div>

    <div class="timer-controls">
      <button class="ctrl-btn secondary" id="btnReset" title="重置">↺</button>
      <button class="ctrl-btn primary" id="btnToggle" title="开始">▶</button>
      <button class="ctrl-btn secondary" id="btnFocus" title="沉浸模式">⛶</button>
    </div>

    <div class="timer-stats-row">
      <div class="timer-stat">
        <div class="val" id="statTodayCount">0</div>
        <div class="lab">今日番茄</div>
      </div>
      <div class="timer-stat">
        <div class="val" id="statTodayMin">0</div>
        <div class="lab">专注分钟</div>
      </div>
      <div class="timer-stat">
        <div class="val" id="statStreak">0</div>
        <div class="lab">连续天数</div>
      </div>
    </div>
  </div>
</div>

<!-- Tasks Tab -->
<div class="tab-content" id="tab-tasks">
  <div class="task-section">
    <div class="section-header">
      <h3 class="section-title">今日任务</h3>
      <button class="section-action" id="clearCompleted">清除已完成</button>
    </div>

    <div class="add-task-box">
      <input type="text" id="taskInput" placeholder="添加一个新任务..." maxlength="50">
      <button id="btnAddTask">+</button>
    </div>

    <ul class="task-list" id="taskList"></ul>
    <div class="task-empty" id="taskEmpty" style="display:none">暂无任务，添加一个开始打卡吧！</div>
  </div>
</div>

<!-- Stats Tab -->
<div class="tab-content" id="tab-stats">
  <div class="stats-section">
    <div class="stats-cards">
      <div class="stats-card">
        <div class="icon">🍅</div>
        <div class="val" id="statsTotalTomato">0</div>
        <div class="lab">累计番茄数</div>
      </div>
      <div class="stats-card">
        <div class="icon">⏱️</div>
        <div class="val green" id="statsTotalHours">0</div>
        <div class="lab">专注小时</div>
      </div>
      <div class="stats-card">
        <div class="icon">✅</div>
        <div class="val" id="statsTaskRate">0%</div>
        <div class="lab">任务完成率</div>
      </div>
      <div class="stats-card">
        <div class="icon">🔥</div>
        <div class="val green" id="statsStreak">0</div>
        <div class="lab">连续打卡天</div>
      </div>
    </div>

    <div class="chart-box">
      <h4>本周专注时长（分钟）</h4>
      <div class="week-bar-chart" id="weekChart"></div>
    </div>

    <div class="chart-box">
      <h4>近30天打卡热力图</h4>
      <div class="heatmap-grid" id="heatmapGrid"></div>
    </div>
  </div>
</div>

<!-- Focus Overlay -->
<div class="focus-overlay" id="focusOverlay">
  <div class="focus-timer" id="focusTimerDisplay">25:00</div>
  <div class="focus-text">保持专注，远离干扰</div>
  <button class="focus-exit" id="btnExitFocus">退出沉浸模式</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ==================== Data ====================
const STORAGE_KEY = 'harmony_tomato_data';

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) return JSON.parse(raw);
  return {
    tasks: [
      { id: 1, text: '阅读专业书籍 30 分钟', completed: false },
      { id: 2, text: '完成数学练习题', completed: true },
      { id: 3, text: '背诵英语单词 50 个', completed: false },
    ],
    history: {},
    totalTomato: 12,
    streak: 3,
    lastDate: new Date().toDateString()
  };
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();

// Ensure today's entry exists
const todayStr = new Date().toDateString();
if (!data.history[todayStr]) {
  data.history[todayStr] = { tomato: 0, minutes: 0, tasks: 0 };
}

// ==================== Timer ====================
let timerState = {
  totalSeconds: 25 * 60,
  remaining: 25 * 60,
  running: false,
  interval: null,
  mode: 25
};

const timerDisplay = document.getElementById('timerDisplay');
const timerLabel = document.getElementById('timerLabel');
const timerStatus = document.getElementById('timerStatus');
const timerCircleBg = document.getElementById('timerCircleBg');
const timerCircleWrap = document.getElementById('timerCircleWrap');
const btnToggle = document.getElementById('btnToggle');
const btnReset = document.getElementById('btnReset');
const btnFocus = document.getElementById('btnFocus');
const focusOverlay = document.getElementById('focusOverlay');
const focusTimerDisplay = document.getElementById('focusTimerDisplay');
const btnExitFocus = document.getElementById('btnExitFocus');

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function updateTimerDisplay() {
  const text = formatTime(timerState.remaining);
  timerDisplay.textContent = text;
  focusTimerDisplay.textContent = text;

  const pct = 1 - (timerState.remaining / timerState.totalSeconds);
  const deg = pct * 360;
  timerCircleBg.style.background = `conic-gradient(var(--accent) ${deg}deg, var(--bg2) ${deg}deg)`;
}

function setTimerMode(minutes) {
  if (timerState.running) pauseTimer();
  timerState.mode = minutes;
  timerState.totalSeconds = minutes * 60;
  timerState.remaining = timerState.totalSeconds;
  timerLabel.textContent = minutes === 25 ? '准备开始专注' : minutes === 5 ? '休息一下' : '长休息';
  timerStatus.textContent = '点击开始';
  updateTimerDisplay();
}

function startTimer() {
  timerState.running = true;
  timerCircleWrap.classList.add('running');
  timerStatus.textContent = timerState.mode === 25 ? '专注中...' : '休息中...';
  btnToggle.innerHTML = '⏸';
  timerState.interval = setInterval(() => {
    timerState.remaining--;
    updateTimerDisplay();
    if (timerState.remaining <= 0) {
      completeTimer();
    }
  }, 1000);
}

function pauseTimer() {
  timerState.running = false;
  timerCircleWrap.classList.remove('running');
  timerStatus.textContent = '已暂停';
  btnToggle.innerHTML = '▶';
  clearInterval(timerState.interval);
}

function resetTimer() {
  pauseTimer();
  timerState.remaining = timerState.totalSeconds;
  timerStatus.textContent = '点击开始';
  updateTimerDisplay();
}

function completeTimer() {
  pauseTimer();
  timerState.remaining = 0;
  updateTimerDisplay();
  timerStatus.textContent = '已完成！';
  timerLabel.textContent = '太棒了！';

  if (timerState.mode === 25) {
    data.history[todayStr].tomato++;
    data.history[todayStr].minutes += 25;
    data.totalTomato++;
    saveData();
    updateTimerStats();
    updateStatsTab();
    showToast('🎉 完成一个番茄！继续保持！');
  } else {
    showToast('☕ 休息结束，准备下一轮！');
  }

  setTimeout(() => {
    resetTimer();
    timerLabel.textContent = timerState.mode === 25 ? '准备开始专注' : '休息一下';
  }, 2000);
}

btnToggle.addEventListener('click', () => {
  if (timerState.running) pauseTimer();
  else startTimer();
});

btnReset.addEventListener('click', resetTimer);

btnFocus.addEventListener('click', () => {
  focusOverlay.classList.add('active');
});

btnExitFocus.addEventListener('click', () => {
  focusOverlay.classList.remove('active');
});

// Mode buttons
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setTimerMode(parseInt(btn.dataset.min));
  });
});

function updateTimerStats() {
  document.getElementById('statTodayCount').textContent = data.history[todayStr].tomato;
  document.getElementById('statTodayMin').textContent = data.history[todayStr].minutes;
  document.getElementById('statStreak').textContent = data.streak;
}

// ==================== Tasks ====================
const taskInput = document.getElementById('taskInput');
const btnAddTask = document.getElementById('btnAddTask');
const taskList = document.getElementById('taskList');
const taskEmpty = document.getElementById('taskEmpty');
const clearCompleted = document.getElementById('clearCompleted');

function renderTasks() {
  taskList.innerHTML = '';
  if (data.tasks.length === 0) {
    taskEmpty.style.display = 'block';
    return;
  }
  taskEmpty.style.display = 'none';

  data.tasks.forEach(task => {
    const li = document.createElement('li');
    li.className = 'task-item' + (task.completed ? ' completed' : '');
    li.innerHTML = `
      <div class="task-check">✓</div>
      <span class="task-text">${escapeHtml(task.text)}</span>
      <button class="task-delete">×</button>
    `;

    li.querySelector('.task-check').addEventListener('click', () => {
      task.completed = !task.completed;
      saveData();
      renderTasks();
      updateStatsTab();
      if (task.completed) showToast('✅ 打卡成功！');
    });

    li.querySelector('.task-delete').addEventListener('click', () => {
      data.tasks = data.tasks.filter(t => t.id !== task.id);
      saveData();
      renderTasks();
      updateStatsTab();
    });

    taskList.appendChild(li);
  });
}

function addTask() {
  const text = taskInput.value.trim();
  if (!text) return;
  data.tasks.push({
    id: Date.now(),
    text: text,
    completed: false
  });
  taskInput.value = '';
  saveData();
  renderTasks();
  updateStatsTab();
  showToast('✨ 任务添加成功');
}

btnAddTask.addEventListener('click', addTask);
taskInput.addEventListener('keypress', e => {
  if (e.key === 'Enter') addTask();
});

clearCompleted.addEventListener('click', () => {
  const before = data.tasks.length;
  data.tasks = data.tasks.filter(t => !t.completed);
  if (data.tasks.length < before) {
    saveData();
    renderTasks();
    updateStatsTab();
    showToast('🧹 已清除已完成任务');
  }
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==================== Stats ====================
function updateStatsTab() {
  const totalCompleted = data.tasks.filter(t => t.completed).length;
  const totalTasks = data.tasks.length;
  const rate = totalTasks > 0 ? Math.round((totalCompleted / totalTasks) * 100) : 0;

  document.getElementById('statsTotalTomato').textContent = data.totalTomato;
  document.getElementById('statsTotalHours').textContent = (data.totalTomato * 25 / 60).toFixed(1);
  document.getElementById('statsTaskRate').textContent = rate + '%';
  document.getElementById('statsStreak').textContent = data.streak;

  renderWeekChart();
  renderHeatmap();
}

function renderWeekChart() {
  const container = document.getElementById('weekChart');
  container.innerHTML = '';
  const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const today = new Date();

  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - (6 - i));
    const key = d.toDateString();
    const mins = data.history[key]?.minutes || 0;
    const maxMins = 120;
    const heightPct = Math.min((mins / maxMins) * 100, 100);
    const isToday = i === 6;

    const item = document.createElement('div');
    item.className = 'bar-item';
    item.innerHTML = `
      <div class="bar-val">${mins}</div>
      <div class="bar-fill ${isToday ? 'today' : ''}" style="height:${Math.max(heightPct, 4)}%"></div>
      <div class="bar-label">${days[i]}</div>
    `;
    container.appendChild(item);
  }
}

function renderHeatmap() {
  const grid = document.getElementById('heatmapGrid');
  grid.innerHTML = '';
  const today = new Date();

  for (let i = 29; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.toDateString();
    const tomato = data.history[key]?.tomato || 0;
    let level = '';
    if (tomato >= 4) level = 'l4';
    else if (tomato >= 3) level = 'l3';
    else if (tomato >= 2) level = 'l2';
    else if (tomato >= 1) level = 'l1';

    const cell = document.createElement('div');
    cell.className = 'heatmap-cell ' + level;
    cell.title = `${d.getMonth()+1}/${d.getDate()}: ${tomato} 个番茄`;
    grid.appendChild(cell);
  }
}

// ==================== Tabs ====================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'stats') updateStatsTab();
  });
});

// ==================== Toast ====================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}

// ==================== Header Date ====================
function updateHeaderDate() {
  const now = new Date();
  const opts = { month: 'short', day: 'numeric', weekday: 'short' };
  document.getElementById('headerDate').textContent = now.toLocaleDateString('zh-CN', opts);
}

// ==================== Init ====================
updateHeaderDate();
updateTimerDisplay();
updateTimerStats();
renderTasks();
updateStatsTab();
</script>
