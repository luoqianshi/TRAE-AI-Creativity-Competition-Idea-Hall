<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球体物理赛跑</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #eee; overflow: hidden; }
    #app { display: flex; height: 100vh; }
    
    .sidebar {
      width: 320px;
      background: #16213e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    
    .sidebar h1 { font-size: 1.4rem; color: #4ecca3; margin-bottom: 8px; }
    
    .config-section {
      background: #1f2b47;
      border-radius: 12px;
      padding: 16px;
    }
    
    .config-section h3 {
      font-size: 0.95rem;
      color: #4ecca3;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .ball-config {
      background: #0f172a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    
    .ball-config:last-child { margin-bottom: 0; }
    
    .ball-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    
    .ball-preview {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #4ecca3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      overflow: hidden;
    }
    
    .ball-preview img { width: 100%; height: 100%; object-fit: cover; }
    
    .ball-input {
      flex: 1;
      background: #1f2b47;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 10px;
      color: #eee;
      font-size: 0.85rem;
    }
    
    .ball-input:focus { outline: none; border-color: #4ecca3; }
    
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .color-row label { font-size: 0.8rem; color: #94a3b8; width: 50px; }
    
    .color-picker {
      width: 40px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }
    
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .slider-row label { font-size: 0.8rem; color: #94a3b8; }
    
    input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: #334155;
      border-radius: 3px;
      cursor: pointer;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #4ecca3;
      border-radius: 50%;
      cursor: pointer;
    }
    
    input[type="color"] {
      width: 36px;
      height: 28px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .texture-upload {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    
    .texture-upload label { font-size: 0.8rem; color: #94a3b8; }
    
    .texture-upload input[type="file"] {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary { background: #4ecca3; color: #1a1a2e; }
    .btn-primary:hover { background: #3db892; transform: translateY(-1px); }
    .btn-secondary { background: #334155; color: #eee; }
    .btn-secondary:hover { background: #475569; }
    .btn-warning { background: #f59e0b; color: #1a1a2e; }
    .btn-warning:hover { background: #d97706; }
    
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; padding: 12px; }
    
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    
    #game-canvas { flex: 1; display: block; }
    
    .ranking-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(22, 33, 62, 0.95);
      border-radius: 12px;
      padding: 16px;
      min-width: 200px;
      max-width: 260px;
    }
    
    .ranking-panel h3 {
      font-size: 0.95rem;
      color: #4ecca3;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .ranking-item {
      display: flex;
      align-items: center;
      padding: 8px;
      margin-bottom: 6px;
      background: #1f2b47;
      border-radius: 8px;
      transition: all 0.3s;
    }
    
    .ranking-item.finished {
      background: #064e3b;
      border-left: 3px solid #4ecca3;
    }
    
    .rank-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      margin-right: 10px;
    }
    
    .ranking-item.finished .rank-num { background: #4ecca3; color: #1a1a2e; }
    
    .rank-ball {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-right: 10px;
      flex-shrink: 0;
    }
    
    .rank-name { flex: 1; font-size: 0.85rem; }
    .rank-time { font-size: 0.75rem; color: #94a3b8; }
    .rank-progress { font-size: 0.7rem; color: #64748b; }
    
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: #16213e;
      border-radius: 16px;
      padding: 32px;
      min-width: 400px;
      max-width: 500px;
      animation: modalIn 0.3s ease;
    }
    
    @keyframes modalIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    
    .modal h2 {
      color: #4ecca3;
      font-size: 1.6rem;
      margin-bottom: 24px;
      text-align: center;
    }
    
    .result-list { margin-bottom: 24px; }
    
    .result-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #1f2b47;
      border-radius: 10px;
      margin-bottom: 8px;
    }
    
    .result-item.gold { background: linear-gradient(90deg, #422006 0%, #1f2b47 100%); border-left: 4px solid #fbbf24; }
    .result-item.silver { background: linear-gradient(90deg, #374151 0%, #1f2b47 100%); border-left: 4px solid #9ca3af; }
    .result-item.bronze { background: linear-gradient(90deg, #78350f 0%, #1f2b47 100%); border-left: 4px solid #d97706; }
    
    .result-rank {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 14px;
      font-size: 1rem;
    }
    
    .result-item.gold .result-rank { background: #fbbf24; color: #1a1a2e; }
    .result-item.silver .result-rank { background: #9ca3af; color: #1a1a2e; }
    .result-item.bronze .result-rank { background: #d97706; color: #1a1a2e; }
    
    .result-ball {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin-right: 12px;
    }
    
    .result-info { flex: 1; }
    .result-name { font-size: 1rem; margin-bottom: 2px; }
    .result-time { font-size: 0.8rem; color: #94a3b8; }
    
    .modal .btn-row { margin-top: 8px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="sidebar">
      <h1>🏅 球体物理赛跑</h1>
      
      <div class="config-section">
        <h3>⚙️ 球体数量</h3>
        <div class="slider-row">
          <label>参赛数量:</label>
          <input type="range" v-model.number="ballCount" min="2" max="12" @change="updateBallCount">
          <span>{{ ballCount }}</span>
        </div>
      </div>
      
      <div class="config-section" style="flex:1; overflow-y:auto;">
        <h3>🎨 球体配置</h3>
        <div v-for="(ball, idx) in balls" :key="idx" class="ball-config">
          <div class="ball-header">
            <div class="ball-preview" :style="getBallStyle(ball)">
              <img v-if="ball.texture" :src="ball.texture" @error="ball.texture=''">
              <span v-else>{{ ball.name.charAt(0) }}</span>
            </div>
            <input type="text" class="ball-input" v-model="ball.name" placeholder="球体名称" maxlength="8">
          </div>
          <div class="color-row">
            <label>颜色:</label>
            <input type="color" v-model="ball.color">
            <span style="font-size:0.75rem; color:#94a3b8;">{{ ball.color }}</span>
          </div>
          <div class="color-row">
            <label>渐变:</label>
            <input type="color" v-model="ball.color2">
            <span style="font-size:0.75rem; color:#94a3b8;">{{ ball.color2 }}</span>
          </div>
          <div class="texture-upload">
            <label>贴图:</label>
            <input type="file" accept="image/*" @change="e => setTexture(idx, e)">
          </div>
        </div>
      </div>
      
      <div class="btn-row">
        <button class="btn btn-primary" @click="startRace" :disabled="gameState === 'running'">开始竞速</button>
        <button class="btn btn-warning" @click="resetGame">重置</button>
      </div>
      <button class="btn btn-secondary" style="width:100%; margin-top:8px;" @click="regenerateTrack">重新生成赛道</button>
    </div>
    
    <div class="main-area">
      <canvas ref="gameCanvas" id="game-canvas"></canvas>
      
      <div class="ranking-panel" v-if="gameState !== 'idle'">
        <h3>📊 实时排名</h3>
        <div v-for="(item, idx) in liveRanking" :key="idx" class="ranking-item" :class="{finished: item.finished}">
          <div class="rank-num">{{ item.rank }}</div>
          <div class="rank-ball" :style="{background: item.gradient}"></div>
          <div class="rank-name">{{ item.name }}</div>
          <div class="rank-time" v-if="item.finished">{{ item.time }}s</div>
          <div class="rank-progress" v-else>{{ Math.round(item.progress) }}%</div>
        </div>
      </div>
    </div>
    
    <div class="modal-overlay" v-if="showResult" @click.self="showResult = false">
      <div class="modal">
        <h2>🏆 比赛结果</h2>
        <div class="result-list">
          <div v-for="(item, idx) in finalResults" :key="idx" 
               class="result-item" 
               :class="{gold: idx===0, silver: idx===1, bronze: idx===2}">
            <div class="result-rank">{{ idx + 1 }}</div>
            <div class="result-ball" :style="{background: item.gradient}"></div>
            <div class="result-info">
              <div class="result-name">{{ item.name }}</div>
              <div class="result-time">用时: {{ item.time.toFixed(3) }}秒</div>
            </div>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" @click="startRace">再来一局</button>
          <button class="btn btn-secondary" @click="showResult = false">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, computed, onMounted, watch } = Vue;
    
    createApp({
      setup() {
        const gameCanvas = ref(null);
        const ballCount = ref(4);
        const gameState = ref('idle');
        const showResult = ref(false);
        const startTime = ref(0);
        const finishOrder = ref([]);
        
        const balls = ref([]);
        const liveRanking = ref([]);
        const finalResults = ref([]);
        
        let engine, render, runner, world;
        let ballBodies = [];
        let finishLineY = 0;
        const canvasWidth = ref(800);
        const canvasHeight = ref(600);
        const trackTop = 60;
        
        const defaultNames = ['红球', '蓝球', '绿球', '黄球', '紫球', '橙球', '青球', '粉球', '棕球', '灰球', '金球', '银球'];
        const defaultColors = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#f97316', '#06b6d4', '#ec4899', '#92400e', '#6b7280', '#fbbf24', '#9ca3af'];
        
        function initBalls() {
          balls.value = [];
          for (let i = 0; i < ballCount.value; i++) {
            balls.value.push({
              name: defaultNames[i] || `球${i+1}`,
              color: defaultColors[i] || '#888888',
              color2: adjustColor(defaultColors[i] || '#888888', -30),
              texture: '',
              gradient: ''
            });
          }
          updateBallGradients();
        }
        
        function adjustColor(hex, amount) {
          const num = parseInt(hex.slice(1), 16);
          const r = Math.min(255, Math.max(0, (num >> 16) + amount));
          const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
          const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
          return `#${(1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1)}`;
        }
        
        function updateBallGradients() {
          balls.value.forEach(b => {
            b.gradient = `radial-gradient(circle at 30% 30%, ${b.color2}, ${b.color})`;
          });
        }
        
        function getBallStyle(ball) {
          if (ball.texture) {
            return { backgroundImage: `url(${ball.texture})`, backgroundSize: 'cover' };
          }
          return { background: ball.gradient };
        }
        
        function updateBallCount() {
          const oldCount = balls.value.length;
          if (ballCount.value > oldCount) {
            for (let i = oldCount; i < ballCount.value; i++) {
              balls.value.push({
                name: defaultNames[i] || `球${i+1}`,
                color: defaultColors[i] || '#888888',
                color2: adjustColor(defaultColors[i] || '#888888', -30),
                texture: '',
                gradient: ''
              });
            }
          } else {
            balls.value = balls.value.slice(0, ballCount.value);
          }
          updateBallGradients();
        }
        
        function setTexture(idx, event) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              balls.value[idx].texture = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        }
        
        function initPhysics() {
          if (render) {
            Matter.Render.stop(render);
            Matter.Render.world(render);
          }
          if (runner) Matter.Runner.stop(runner);
          
          engine = Matter.Engine.create();
          world = engine.world;
          engine.gravity.y = 1.2;
          
          const canvas = gameCanvas.value;
          canvasWidth.value = canvas.offsetWidth;
          canvasHeight.value = canvas.offsetHeight;
          canvas.width = canvasWidth.value;
          canvas.height = canvasHeight.value;
          
          render = Matter.Render.create({
            canvas: canvas,
            engine: engine,
            options: {
              width: canvasWidth.value,
              height: canvasHeight.value,
              wireframes: false,
              background: '#0f172a'
            }
          });
          
          finishLineY = canvasHeight.value - 40;
          
          createTrack();
          
          runner = Matter.Runner.create();
          Matter.Runner.run(runner, engine);
          Matter.Render.run(render);
          
          Matter.Events.on(engine, 'beforeUpdate', () => {
            if (gameState.value === 'running') {
              updateLiveRanking();
              checkFinish();
            }
          });
        }
        
        function createTrack() {
          const w = canvasWidth.value;
          const h = canvasHeight.value;
          
          // 边界墙
          const wallOpts = { isStatic: true, render: { fillStyle: '#334155' }, friction: 0.3, restitution: 0.4 };
          const leftWall = Matter.Bodies.rectangle(-10, h/2, 20, h, wallOpts);
          const rightWall = Matter.Bodies.rectangle(w + 10, h/2, 20, h, wallOpts);
          
          // 底部边界（终点区）
          const bottom = Matter.Bodies.rectangle(w/2, h + 25, w, 50, { ...wallOpts, label: 'floor' });
          
          Matter.Composite.add(world, [leftWall, rightWall, bottom]);
          
          // 随机生成障碍物
          const obstacleCount = 5 + Math.floor(Math.random() * 6);
          const types = ['pin', 'plank', 'arc', 'bumper'];
          
          for (let i = 0; i < obstacleCount; i++) {
            const type = types[Math.floor(Math.random() * types.length)];
            const y = trackTop + 80 + (i * (h - trackTop - 160) / obstacleCount);
            
            if (type === 'pin') {
              // 钉板 - 多个小圆形障碍
              const pinCount = 3 + Math.floor(Math.random() * 4);
              const spacing = 50 + Math.random() * 40;
              const startX = w/2 - (pinCount - 1) * spacing / 2;
              for (let j = 0; j < pinCount; j++) {
                const x = startX + j * spacing + (Math.random() - 0.5) * 30;
                const pin = Matter.Bodies.circle(x, y + (Math.random() - 0.5) * 40, 
                  8 + Math.random() * 6, {
                    isStatic: true,
                    render: { fillStyle: '#64748b' },
                    restitution: 0.8
                  });
                Matter.Composite.add(world, pin);
              }
            } else if (type === 'plank') {
              // 倾斜挡板
              const x = 100 + Math.random() * (w - 200);
              const angle = (Math.random() - 0.5) * Math.PI / 3;
              const plank = Matter.Bodies.rectangle(x, y, 80 + Math.random() * 60, 12, {
                isStatic: true,
                angle: angle,
                render: { fillStyle: '#78716c' },
                friction: 0.2,
                restitution: 0.5
              });
              Matter.Composite.add(world, plank);
            } else if (type === 'arc') {
              // 弧形障碍
              const cx = 100 + Math.random() * (w - 200);
              const arcCount = 3 + Math.floor(Math.random() * 3);
              for (let j = 0; j < arcCount; j++) {
                const a = (j - arcCount/2) * (Math.PI / 8);
                const arc = Matter.Bodies.circle(
                  cx + Math.cos(a) * 40,
                  y + Math.sin(a) * 40,
                  10 + Math.random() * 5, {
                    isStatic: true,
                    render: { fillStyle: '#6366f1' },
                    restitution: 0.7
                  });
                Matter.Composite.add(world, arc);
              }
            } else {
              // 弹力球障碍
              const bx = 100 + Math.random() * (w - 200);
              const bumper = Matter.Bodies.circle(bx, y, 15 + Math.random() * 10, {
                isStatic: true,
                render: { fillStyle: '#f43f5e' },
                restitution: 1.2,
                label: 'bumper'
              });
              Matter.Composite.add(world, bumper);
            }
          }
          
          // 终点线
          const finishLine = Matter.Bodies.rectangle(w/2, finishLineY, w - 60, 4, {
            isStatic: true,
            isSensor: true,
            label: 'finish',
            render: { fillStyle: '#4ecca3' }
          });
          Matter.Composite.add(world, finishLine);
        }
        
        function createBallBodies() {
          ballBodies.forEach(b => Matter.Composite.remove(world, b));
          ballBodies = [];
          
          const w = canvasWidth.value;
          const spacing = Math.min(60, (w - 100) / balls.value.length);
          const startX = (w - (balls.value.length - 1) * spacing) / 2;
          
          balls.value.forEach((ball, i) => {
            const body = Matter.Bodies.circle(
              startX + i * spacing,
              30,
              18,
              {
                restitution: 0.6,
                friction: 0.1,
                frictionAir: 0.01,
                label: `ball_${i}`,
                render: {
                  fillStyle: ball.color,
                  strokeStyle: ball.color2,
                  lineWidth: 2
                }
              }
            );
            ballBodies.push(body);
            Matter.Composite.add(world, body);
          });
        }
        
        function updateBallTextures() {
          balls.value.forEach((ball, i) => {
            if (ball.texture && ballBodies[i]) {
              ballBodies[i].render.sprite = {
                texture: ball.texture,
                xScale: 36 / 40,
                yScale: 36 / 40
              };
            }
          });
        }
        
        function startRace() {
          if (gameState.value === 'running') return;
          
          gameState.value = 'running';
          finishOrder.value = [];
          showResult.value = false;
          startTime.value = Date.now();
          
          initPhysics();
          createBallBodies();
          updateBallTextures();
        }
        
        function resetGame() {
          gameState.value = 'idle';
          showResult.value = false;
          finishOrder.value = [];
          initPhysics();
        }
        
        function regenerateTrack() {
          if (gameState.value === 'running') return;
          gameState.value = 'idle';
          initPhysics();
        }
        
        function updateLiveRanking() {
          const w = canvasHeight.value;
          const sorted = balls.value.map((ball, i) => {
            const body = ballBodies[i];
            const progress = body ? Math.min(100, Math.max(0, ((body.position.y - trackTop) / (finishLineY - trackTop)) * 100)) : 0;
            return {
              idx: i,
              name: ball.name,
              gradient: ball.gradient,
              progress: progress,
              finished: finishOrder.value.includes(i),
              rank: 0
            };
          });
          
          // 按进度和完成状态排序
          sorted.sort((a, b) => {
            if (a.finished !== b.finished) return a.finished ? -1 : 1;
            return b.progress - a.progress;
          });
          
          sorted.forEach((item, i) => {
            item.rank = i + 1;
          });
          
          liveRanking.value = sorted;
        }
        
        function checkFinish() {
          const now = Date.now();
          const elapsed = (now - startTime.value) / 1000;
          
          ballBodies.forEach((body, i) => {
            if (body.position.y >= finishLineY && !finishOrder.value.includes(i)) {
              finishOrder.value.push(i);
              
              // 检测到球体到达终点
              Matter.Events.off(engine, 'afterUpdate', checkFinishHandler);
            }
          });
          
          // 更新已完成球体的时间
          liveRanking.value.forEach(item => {
            if (item.finished && !item.time) {
              const body = ballBodies[item.idx];
              if (body.position.y >= finishLineY) {
                item.time = elapsed.toFixed(3);
              }
            }
          });
        }
        
        let checkFinishHandler = null;
        
        function setupFinishDetection() {
          checkFinishHandler = () => {
            if (gameState.value !== 'running') return;
            const now = Date.now();
            const elapsed = (now - startTime.value) / 1000;
            
            ballBodies.forEach((body, i) => {
              if (body.position.y >= finishLineY && !finishOrder.value.find(f => f.idx === i)) {
                finishOrder.value.push({ idx: i, time: elapsed });
              }
            });
            
            if (finishOrder.value.length === ballBodies.length) {
              endRace();
            }
          };
          
          Matter.Events.on(engine, 'afterUpdate', checkFinishHandler);
        }
        
        function endRace() {
          gameState.value = 'finished';
          showResult.value = true;
          
          finalResults.value = finishOrder.value.map((item, i) => ({
            name: balls.value[item.idx].name,
            gradient: balls.value[item.idx].gradient,
            time: item.time
          }));
        }
        
        onMounted(() => {
          initBalls();
          initPhysics();
          
          // 响应式调整
          const handleResize = () => {
            if (gameState.value !== 'running') {
              initPhysics();
            }
          };
          window.addEventListener('resize', handleResize);
          
          // 定期检测完成
          setInterval(() => {
            if (gameState.value === 'running') {
              const now = Date.now();
              const elapsed = (now - startTime.value) / 1000;
              
              ballBodies.forEach((body, i) => {
                if (body.position.y >= finishLineY) {
                  const existing = finishOrder.value.find(f => f.idx === i);
                  if (!existing) {
                    finishOrder.value.push({ idx: i, time: elapsed });
                  }
                }
              });
              
              if (finishOrder.value.length === ballBodies.length && ballBodies.length > 0) {
                endRace();
              }
            }
          }, 50);
        });
        
        return {
          gameCanvas,
          ballCount,
          balls,
          gameState,
          showResult,
          liveRanking,
          finalResults,
          getBallStyle,
          updateBallCount,
          setTexture,
          startRace,
          resetGame,
          regenerateTrack
        };
      }
    }).mount('#app');
  </script>
</body>
