<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>站名记词</title>
  <style>
    :root {
      --bg-primary: #f9f9fb;
      --bg-card: #ffffff;
      --text-primary: #333333;
      --text-secondary: #666666;
      --accent: #4a6fa5;
      --accent-light: #6b8cbf;
      --border: #e0e6ed;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      --radius: 12px;
      --transition: all 0.25s ease;
    }

    .dark-theme {
      --bg-primary: #1a1d25;
      --bg-card: #252a35;
      --text-primary: #f0f0f0;
      --text-secondary: #a0a7b5;
      --accent: #5d89c3;
      --accent-light: #7aa1d9;
      --border: #3a4252;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 16px;
      transition: var(--transition);
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 16px;
    }

    h1 {
      font-weight: 700;
      font-size: 1.8rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .input-section {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
      border: 1px solid var(--border);
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: var(--transition);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(74, 111, 165, 0.15);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 24px;
      animation: fadeInUp 0.3s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .card-content {
      margin-bottom: 16px;
    }

    .zh-en {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .example {
      background: rgba(91, 140, 191, 0.05);
      border-left: 4px solid var(--accent-light);
      padding: 12px 16px;
      margin: 16px 0;
      border-radius: 0 4px 4px 0;
      font-style: italic;
      color: var(--text-secondary);
    }

    .pronunciation {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .pronunciation span {
      background: rgba(74, 111, 165, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
    }

    .hint {
      font-size: 0.95rem;
      padding: 10px 14px;
      background: rgba(255, 220, 180, 0.15);
      border-radius: 6px;
      color: #d97706;
      border-left: 3px solid #f97316;
      margin-top: 12px;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(74, 111, 165, 0.1);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid rgba(74, 111, 165, 0.2);
    }

    .play-btn:hover:not(:disabled) {
      background: rgba(74, 111, 165, 0.2);
    }

    .play-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 100;
      transition: var(--transition);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .empty-state p {
      margin-top: 12px;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-bottom: 20px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .input-group {
        flex-direction: column;
      }

      h1 {
        font-size: 1.5rem;
      }

      .card {
        padding: 20px;
      }

      .zh-en {
        font-size: 1.2rem;
      }

      .example {
        padding: 10px 14px;
      }

      .pronunciation span {
        padding: 4px 8px;
        font-size: 0.9rem;
      }
    }

    /* Hide scrollbar for theme toggle */
    .theme-toggle::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>站名记词</h1>
      <p class="subtitle">把通勤路上的地铁站名，变成你的随身英语单词卡｜输入站名，立刻生成学习卡片</p>
    </header>

    <main>
      <section class="input-section">
        <div class="input-group">
          <input type="text" id="station-input" placeholder="例如：西直门、龙阳路、静安寺…" maxlength="20" autocomplete="off" />
          <button id="generate-btn">生成卡片</button>
        </div>
        <p style="font-size:0.9rem; color:var(--text-secondary); margin-top:8px;">支持全国主流城市地铁站名（中文），无需联网，纯前端即时生成</p>
      </section>

      <section id="result-area">
        <!-- Generated cards will appear here -->
        <div class="empty-state">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4l3 3"></path></svg>
          <h2>开始你的第一张站名卡片</h2>
          <p>在上方输入一个地铁站名，点击「生成卡片」，立刻获得中英对照、例句、发音提示与记忆技巧</p>
        </div>
      </section>
    </main>

    <footer>
      <p>卡片内容由本地AI逻辑模拟生成｜所有处理均在浏览器内完成，不上传任何数据</p>
    </footer>

    <button id="theme-toggle" class="theme-toggle" aria-label="切换深色/浅色主题">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <script>
    // 主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
      body.classList.add('dark-theme');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-theme');
      const isDark = body.classList.contains('dark-theme');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 模拟站名卡片生成
    const stationInput = document.getElementById('station-input');
    const generateBtn = document.getElementById('generate-btn');
    const resultArea = document.getElementById('result-area');

    // 预设高频站名映射（模拟TRAE Work AI生成逻辑）
    const stationDB = {
      '西直门': {
        en: 'Xizhimen Station',
        example: 'Take Line 2 to Xizhimen Station — it’s right next to Beijing Zoo.',
        pronunciation: ['Xī-zhí-mén', "'Shee-jee-mun'"],
        hint: "‘Xī’ like ‘she’, ‘zhí’ like ‘j’ in ‘jeep’, ‘mén’ like ‘mun’ in ‘summer’"
      },
      '龙阳路': {
        en: 'Longyang Road Station',
        example: 'Transfer to Line 16 at Longyang Road Station — it connects to Pudong Airport.',
        pronunciation: ['Lóng-yáng-lù', "'Long-yang-loo'"],
        hint: "‘Lóng’ rhymes with ‘song’, ‘yáng’ like ‘young’, ‘lù’ like ‘loo’"
      },
      '静安寺': {
        en: 'Jing’an Temple Station',
        example: 'Exit A at Jing’an Temple Station leads directly to the historic temple and shopping district.',
        pronunciation: ['Jìng-ān Sì', "'Jing-an-see'"],
        hint: "‘Jìng’ like ‘jing’ in ‘jingling’, ‘ān’ like ‘on’, ‘Sì’ sounds like ‘see’ — not ‘si’ as in ‘silk’"
      },
      '团结湖': {
        en: 'Tuanjiehu Station',
        example: 'Tuanjiehu Station is a quiet stop between Chaoyang Park and the diplomatic area.',
        pronunciation: ['Tuán-jié-hú', "'Two-an-jee-hoo'"],
        hint: "‘Tuán’ like ‘two-an’, ‘jié’ like ‘jee’, ‘hú’ like ‘hoo’ — no ‘lake’ translation!"
      },
      '世纪大道': {
        en: 'Century Avenue Station',
        example: 'Century Avenue Station has 4 lines crossing — perfect for catching up on news while transferring.',
        pronunciation: ['Shì-jì Dà-dào', "'Shir-jee-dah-dow'"],
        hint: "‘Shì’ like ‘shir’ in ‘shirt’, ‘jì’ like ‘jee’, ‘Dà-dào’ = ‘dah-dow’ — ‘Avenue’, not ‘Road’"
      },
      '北苑路北': {
        en: 'Beiyuan Road North Station',
        example: 'Beiyuan Road North Station serves residential communities — great place to practice “Where’s the nearest pharmacy?”',
        pronunciation: ['Běi-yuàn Lù Běi', "'Bay-ywen-loo-bay'"],
        hint: "First ‘Běi’ = ‘bay’, second ‘Běi’ = same sound — both mean ‘north’"
      }
    };

    // 语音播放（使用Web Speech API）
    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        speechSynthesis.speak(utterance);
      }
    }

    // 生成卡片
    function generateCard(station) {
      const cleanStation = station.trim();
      if (!cleanStation) return;

      // 查找匹配（忽略空格、大小写）
      let matched = null;
      for (const key in stationDB) {
        if (key.replace(/\s/g, '').toLowerCase() === cleanStation.replace(/\s/g, '').toLowerCase()) {
          matched = stationDB[key];
          break;
        }
      }

      // 若未命中，生成基础模板（保持可信度）
      if (!matched) {
        const baseEn = cleanStation + ' Station';
        matched = {
          en: baseEn,
          example: `You can reach ${cleanStation} Station via Line 1, 2 or 10.`,
          pronunciation: [cleanStation.split('').map(c => c.charCodeAt(0)).join('-'), `'${cleanStation}' Station`],
          hint: `Pronounced as written in pinyin — check official metro signage!`
        };
      }

      const cardHTML = `
        <div class="card">
          <h2 class="card-title">地铁站名卡片</h2>
          <div class="card-content">
            <div class="zh-en">${cleanStation} → ${matched.en}</div>
            <div class="example">💬 ${matched.example}</div>
            <div class="pronunciation">
              <span>${matched.pronunciation[0]}</span>
              <span>${matched.pronunciation[1]}</span>
            </div>
            <div class="hint">💡 ${matched.hint}</div>
            <div style="margin-top:16px;">
              <button class="play-btn" data-text="${matched.en}. ${matched.example}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 8 12 2 19 8 12 14"></polygon><line x1="12" y1="22" x2="12" y2="14"></line></svg>
                听发音
              </button>
            </div>
          </div>
        </div>
      `;

      resultArea.innerHTML = cardHTML;

      // 绑定播放按钮事件（需在插入后绑定）
      const playBtn = resultArea.querySelector('.play-btn');
      if (playBtn) {
        playBtn.addEventListener('click', (e) => {
          e.target.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15.5V8.5M16 12.5H8"></path></svg> 正在朗读…';
          speak(playBtn.dataset.text);
          setTimeout(() => {
            playBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 8 12 2 19 8 12 14"></polygon><line x1="12" y1="22" x2="12" y2="14"></line></svg> 听发音';
          }, 2000);
        });
      }
    }

    // 初始化：回车提交
    stationInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        generateCard(stationInput.value);
      }
    });

    generateBtn.addEventListener('click', () => {
      generateCard(stationInput.value);
    });

    // 示例快捷输入（首次访问时预填一个）
    if (!localStorage.getItem('hasDemoShown')) {
      setTimeout(() => {
        stationInput.value = '西直门';
        localStorage.setItem('hasDemoShown', 'true');
      }, 800);
    }
  </script>
</body>
</html>
