<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漫游灵感地图｜城市与乡村短视频策划器</title>
  <style>
    :root {
      --bg: #f7f1e6;
      --paper: #fffaf0;
      --ink: #2f2a23;
      --muted: #746b5f;
      --line: #e2d3bd;
      --green: #6e8b72;
      --green-dark: #49624e;
      --blue: #6d8fa6;
      --clay: #c9895b;
      --yellow: #efd9a1;
      --shadow: 0 24px 60px rgba(68, 47, 30, 0.14);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(239, 217, 161, 0.7), transparent 34%),
        radial-gradient(circle at 90% 20%, rgba(109, 143, 166, 0.22), transparent 32%),
        linear-gradient(135deg, #f7f1e6 0%, #f1e6d2 45%, #e7efe5 100%);
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.2;
      background-image:
        linear-gradient(90deg, rgba(255, 255, 255, 0.35) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.25) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    .page {
      position: relative;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 44px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      padding: 34px;
      min-height: 300px;
      border: 1px solid rgba(226, 211, 189, 0.9);
      border-radius: var(--radius-xl);
      background: rgba(255, 250, 240, 0.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -80px;
      bottom: -90px;
      border-radius: 999px;
      background: rgba(110, 139, 114, 0.15);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 8px 13px;
      color: var(--green-dark);
      border: 1px solid rgba(110, 139, 114, 0.25);
      border-radius: 999px;
      background: rgba(232, 240, 224, 0.82);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0 0 16px;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1.04;
      letter-spacing: -0.04em;
    }

    .hero p {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
    }

    .mini-map {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      padding: 28px;
      border: 1px solid rgba(226, 211, 189, 0.95);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(150deg, rgba(255, 250, 240, 0.9), rgba(230, 238, 226, 0.78)),
        repeating-linear-gradient(45deg, transparent 0, transparent 19px, rgba(201, 137, 91, 0.05) 20px);
      box-shadow: var(--shadow);
    }

    .route-sketch {
      position: relative;
      min-height: 190px;
      border-radius: 24px;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.45) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.45) 1px, transparent 1px),
        rgba(255, 250, 240, 0.45);
      background-size: 28px 28px;
      overflow: hidden;
    }

    .route-line {
      position: absolute;
      inset: 26px;
      border: 3px dashed rgba(73, 98, 78, 0.58);
      border-left-color: transparent;
      border-bottom-color: transparent;
      border-radius: 46% 54% 50% 40%;
      transform: rotate(-8deg);
    }

    .pin {
      position: absolute;
      width: 22px;
      height: 22px;
      border: 4px solid var(--paper);
      border-radius: 50%;
      background: var(--clay);
      box-shadow: 0 6px 14px rgba(80, 49, 27, 0.2);
    }

    .pin:nth-child(2) { left: 16%; top: 28%; }
    .pin:nth-child(3) { left: 46%; top: 15%; background: var(--green); }
    .pin:nth-child(4) { right: 20%; top: 44%; background: var(--blue); }
    .pin:nth-child(5) { left: 36%; bottom: 18%; background: #d7a867; }

    .demo-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .demo-tags span {
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--green-dark);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(110, 139, 114, 0.2);
      font-size: 13px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 24px;
      align-items: start;
    }

    .panel {
      border: 1px solid rgba(226, 211, 189, 0.95);
      border-radius: var(--radius-xl);
      background: rgba(255, 250, 240, 0.88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .form-panel {
      position: sticky;
      top: 20px;
      padding: 24px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .panel-title h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -0.02em;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 6px;
      margin-bottom: 20px;
      border: 1px solid rgba(226, 211, 189, 0.86);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.45);
    }

    .mode-btn {
      border: 0;
      border-radius: 13px;
      padding: 12px 10px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .mode-btn.active {
      color: #fff;
      background: var(--green);
      box-shadow: 0 10px 22px rgba(73, 98, 78, 0.22);
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: var(--ink);
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid rgba(185, 161, 130, 0.65);
      border-radius: 15px;
      padding: 13px 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.62);
      font: inherit;
      outline: none;
      transition: 0.2s ease;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(73, 98, 78, 0.65);
      box-shadow: 0 0 0 4px rgba(110, 139, 114, 0.12);
    }

    .generate-btn {
      width: 100%;
      margin-top: 22px;
      border: 0;
      border-radius: 18px;
      padding: 15px 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--green-dark), var(--green));
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 16px 30px rgba(73, 98, 78, 0.25);
      transition: 0.2s ease;
    }

    .generate-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 36px rgba(73, 98, 78, 0.3);
    }

    .sample-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .sample-btn {
      border: 1px solid rgba(185, 161, 130, 0.55);
      border-radius: 14px;
      padding: 11px 10px;
      color: var(--green-dark);
      background: rgba(255, 255, 255, 0.48);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .result-panel {
      min-height: 720px;
      overflow: hidden;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 28px 30px 22px;
      border-bottom: 1px solid rgba(226, 211, 189, 0.9);
      background:
        linear-gradient(135deg, rgba(255, 250, 240, 0.96), rgba(232, 240, 224, 0.8));
    }

    .result-header h2 {
      margin: 0 0 8px;
      font-size: 25px;
      letter-spacing: -0.02em;
    }

    .result-header p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .badge {
      align-self: flex-start;
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 10px 13px;
      color: var(--green-dark);
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(110, 139, 114, 0.22);
      font-size: 13px;
    }

    .result-body {
      padding: 28px 30px 32px;
    }

    .title-card {
      padding: 24px;
      margin-bottom: 22px;
      border-radius: 24px;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(47, 42, 35, 0.86), rgba(73, 98, 78, 0.9)),
        url("data:image/svg+xml,%3Csvg width='160' height='160' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 90 C50 20, 90 145, 140 55' stroke='rgba(255,255,255,.22)' stroke-width='4' fill='none' stroke-dasharray='8 10'/%3E%3C/svg%3E");
      box-shadow: 0 18px 40px rgba(47, 42, 35, 0.18);
    }

    .title-card .small {
      margin-bottom: 9px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    .title-card h3 {
      margin: 0 0 14px;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.18;
    }

    .title-card p {
      margin: 0;
      max-width: 720px;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .info-card {
      padding: 20px;
      border: 1px solid rgba(226, 211, 189, 0.9);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.46);
    }

    .info-card h4 {
      margin: 0 0 12px;
      font-size: 17px;
    }

    .info-card p, .info-card li {
      color: var(--muted);
      line-height: 1.75;
    }

    .info-card p {
      margin: 0;
    }

    .info-card ul {
      margin: 0;
      padding-left: 18px;
    }

    .route-board {
      padding: 22px;
      border-radius: 24px;
      background: rgba(247, 241, 230, 0.7);
      border: 1px solid rgba(226, 211, 189, 0.95);
    }

    .route-board h4 {
      margin: 0 0 18px;
      font-size: 19px;
    }

    .route-list {
      position: relative;
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .route-list::before {
      content: "";
      position: absolute;
      left: 17px;
      top: 22px;
      bottom: 22px;
      width: 2px;
      background: linear-gradient(var(--green), rgba(110, 139, 114, 0.08));
    }

    .node {
      position: relative;
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      align-items: start;
    }

    .node-dot {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 3px solid var(--paper);
      border-radius: 50%;
      color: #fff;
      background: var(--clay);
      font-size: 13px;
      box-shadow: 0 8px 16px rgba(80, 49, 27, 0.18);
    }

    .node:nth-child(even) .node-dot {
      background: var(--green);
    }

    .node-content {
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(226, 211, 189, 0.7);
    }

    .node-content strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
    }

    .node-content span {
      display: block;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .script {
      display: grid;
      gap: 12px;
    }

    .script-line {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(226, 211, 189, 0.72);
    }

    .time {
      color: var(--green-dark);
      font-weight: 700;
    }

    .copy-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 24px;
      color: #fff;
      background: linear-gradient(135deg, rgba(201, 137, 91, 0.92), rgba(171, 111, 70, 0.92));
    }

    .copy-box h4 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .copy-box p {
      margin: 0 0 12px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.88);
    }

    .hashtags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hashtags span {
      padding: 7px 10px;
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.88);
      background: rgba(255, 255, 255, 0.16);
    }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 520px;
      padding: 44px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state h3 {
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 28px;
    }

    .empty-state p {
      max-width: 480px;
      margin: 0;
      line-height: 1.8;
    }

    @media (max-width: 980px) {
      .hero, .workspace {
        grid-template-columns: 1fr;
      }

      .form-panel {
        position: static;
      }
    }

    @media (max-width: 680px) {
      .page {
        width: min(100% - 22px, 1180px);
        padding-top: 18px;
      }

      .hero-card, .mini-map, .form-panel, .result-body, .result-header {
        padding: 20px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .result-header {
        flex-direction: column;
      }

      .script-line {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <main class="page">
    <section class="hero">
      <div class="hero-card">
        <div class="eyebrow">AI 短视频策划工具 · MVP Demo</div>
        <h1>漫游灵感地图</h1>
        <p>
          输入一个城市街区或乡村地点，生成一张有路线、有镜头、有旁白、有发布文案的短视频策划卡。
          适合城市漫游、乡村漫游、空间观察、文旅探访和生活方式内容创作。
        </p>
      </div>
      <div class="mini-map" aria-label="路线示意图">
        <div class="route-sketch">
          <div class="route-line"></div>
          <div class="pin"></div>
          <div class="pin"></div>
          <div class="pin"></div>
          <div class="pin"></div>
        </div>
        <div class="demo-tags">
          <span>老街</span>
          <span>菜市场</span>
          <span>村口广场</span>
          <span>河边步道</span>
          <span>公共空间</span>
        </div>
      </div>
    </section>

    <section class="workspace">
      <aside class="panel form-panel">
        <div class="panel-title">
          <h2>生成策划卡</h2>
          <span class="badge">MVP</span>
        </div>

        <div class="mode-switch">
          <button class="mode-btn active" type="button" data-mode="city">城市漫游</button>
          <button class="mode-btn" type="button" data-mode="village">乡村漫游</button>
        </div>

        <label for="placeType">地点类型</label>
        <select id="placeType">
          <option>老街</option>
          <option>菜市场</option>
          <option>公园</option>
          <option>河边步道</option>
          <option>社区公共空间</option>
          <option>村口广场</option>
          <option>乡村道路</option>
          <option>田野与水系</option>
        </select>

        <label for="placeName">具体地点</label>
        <input id="placeName" value="县城东门老街" placeholder="例如：县城东门老街、江南水乡村落" />

        <label for="theme">想表达的主题</label>
        <input id="theme" value="烟火气与城市更新" placeholder="例如：烟火气、乡村记忆、公共空间、慢生活" />

        <label for="style">视频风格</label>
        <select id="style">
          <option>治愈、慢节奏、有观察感</option>
          <option>纪实、真实、有人情味</option>
          <option>活泼、轻松、适合探店</option>
          <option>知识科普、适合城市观察</option>
          <option>怀旧、温柔、电影感</option>
        </select>

        <label for="duration">视频时长</label>
        <select id="duration">
          <option>60 秒</option>
          <option>30 秒</option>
          <option>90 秒</option>
        </select>

        <label for="platform">发布平台</label>
        <select id="platform">
          <option>小红书</option>
          <option>抖音</option>
          <option>视频号</option>
          <option>B站</option>
        </select>

        <button class="generate-btn" type="button" id="generateBtn">生成漫游短视频方案</button>

        <div class="sample-row">
          <button class="sample-btn" type="button" data-sample="city">试试城市样例</button>
          <button class="sample-btn" type="button" data-sample="village">试试乡村样例</button>
        </div>
      </aside>

      <section class="panel result-panel">
        <div class="result-header">
          <div>
            <h2>短视频策划卡</h2>
            <p>生成结果会拆成标题、内容角度、漫游路线、分镜脚本、发布文案，方便直接拿去拍摄或继续修改。</p>
          </div>
          <span class="badge" id="modeBadge">城市漫游</span>
        </div>
        <div class="result-body" id="resultBody">
          <div class="empty-state">
            <div>
              <h3>准备好开始漫游了吗？</h3>
              <p>填写左侧信息，点击生成。你也可以先点击样例，看看城市与乡村两种模式的效果。</p>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const state = {
      mode: "city"
    };

    const modeButtons = document.querySelectorAll(".mode-btn");
    const modeBadge = document.getElementById("modeBadge");
    const placeType = document.getElementById("placeType");
    const placeName = document.getElementById("placeName");
    const theme = document.getElementById("theme");
    const style = document.getElementById("style");
    const duration = document.getElementById("duration");
    const platform = document.getElementById("platform");
    const resultBody = document.getElementById("resultBody");

    const cityNodes = [
      ["街区入口", "拍摄街道全貌、人流方向、招牌和转角。用一个缓慢推进镜头建立地点氛围。"],
      ["生活摊点", "拍早餐、摊主动作、顾客交流、蒸汽与声音。把城市的日常节奏拍出来。"],
      ["老建筑细节", "拍门头、墙面、窗框、旧标语或路牌。用细节连接空间记忆。"],
      ["停留空间", "拍树荫、长椅、街边聊天的人。强调一个地方为什么让人愿意停下来。"],
      ["收束视角", "用傍晚、背影或街灯作为结尾，留下一个关于生活变化的问题。"]
    ];

    const villageNodes = [
      ["村口节点", "拍村牌、老树、入口小路和来往的人。先交代村庄的第一印象。"],
      ["公共空间", "拍广场、长椅、健身器材、老人聊天和孩子玩耍。呈现真实使用场景。"],
      ["水系或田野", "拍水边、田埂、菜地、桥和风吹过的植物。让画面更松弛。"],
      ["生活院落", "拍晒衣、门前小凳、柴火、花盆和家常声音。突出乡村生活细节。"],
      ["傍晚结尾", "拍晚饭前后的路、灯光和散步的人。用温柔旁白收束主题。"]
    ];

    const cityTitles = [
      "这条{place}，藏着一座城最真实的生活节奏",
      "我在{place}，看见了城市更新之外的烟火气",
      "{place}不只是好逛，它还保存着城市的日常表情"
    ];

    const villageTitles = [
      "这个{place}，把日子过成了风景",
      "在{place}慢慢走，才知道乡村的美不只在远方",
      "{place}最动人的地方，是被大家真正使用的角落"
    ];

    function setMode(mode) {
      state.mode = mode;
      modeButtons.forEach(btn => btn.classList.toggle("active", btn.dataset.mode === mode));
      modeBadge.textContent = mode === "city" ? "城市漫游" : "乡村漫游";

      if (mode === "city") {
        placeType.value = "老街";
        placeName.value = "县城东门老街";
        theme.value = "烟火气与城市更新";
      } else {
        placeType.value = "村口广场";
        placeName.value = "江南水乡村落";
        theme.value = "乡村公共空间";
      }
    }

    function pickTitle(mode, place) {
      const list = mode === "city" ? cityTitles : villageTitles;
      const index = Math.abs(place.length + theme.value.length) % list.length;
      return list[index].replace("{place}", place);
    }

    function buildAngle(mode, place, currentTheme, currentStyle) {
      if (mode === "city") {
        return `从${place}的街道入口、摊点、老建筑和停留空间切入，用${currentStyle}的方式呈现“${currentTheme}”。重点不是拍一个景点，而是拍人在街区里的真实活动。`;
      }
      return `从${place}的村口、广场、水系、院落和傍晚生活切入，用${currentStyle}的方式呈现“${currentTheme}”。重点不是把乡村拍成风景照，而是拍出生活如何在空间里发生。`;
    }

    function buildScript(mode, place, currentTheme, seconds) {
      const isShort = seconds.includes("30");
      const isLong = seconds.includes("90");

      if (mode === "city") {
        return [
          [isShort ? "0-3 秒" : "0-5 秒", `街道入口慢慢推进，拍人流、招牌和街角声音。旁白：很多城市的故事，不在地标里，而在像${place}这样的日常街区。`],
          [isShort ? "3-15 秒" : "5-25 秒", `切到摊点、店铺、路边座椅和旧建筑细节。旁白围绕“${currentTheme}”展开，讲这里为什么让人愿意走、愿意停、愿意回来。`],
          [isShort ? "15-24 秒" : isLong ? "25-70 秒" : "25-45 秒", "用 3 到 5 个镜头连接空间变化：新的路面、旧的门头、熟悉的摊主、坐在树下的人。画面尽量保留环境声。"],
          [isShort ? "24-30 秒" : isLong ? "70-90 秒" : "45-60 秒", "结尾拍一个慢镜头，例如街灯亮起或行人远去。旁白：你家附近，还有这样让人想慢下来走一走的地方吗？"]
        ];
      }

      return [
        [isShort ? "0-3 秒" : "0-5 秒", `从村口或小路进入，拍风、树、水声和人的背影。旁白：有些乡村的美，不在景点里，而在每天都有人使用的地方。`],
        [isShort ? "3-15 秒" : "5-25 秒", `切到${place}的公共活动、院落细节和水边路径。旁白围绕“${currentTheme}”展开，讲村庄的生活怎样自然聚在一起。`],
        [isShort ? "15-24 秒" : isLong ? "25-70 秒" : "25-45 秒", "用连续镜头拍村民聊天、孩子跑过、老人散步、门前花盆和晒衣绳。让生活细节成为视频主角。"],
        [isShort ? "24-30 秒" : isLong ? "70-90 秒" : "45-60 秒", "结尾拍傍晚的广场或小路。旁白：一个好的村庄，不只是房子变新了，也是人还愿意走出来、坐下来、聊一会儿。"]
      ];
    }

    function renderNodes(nodes) {
      return nodes.map((node, index) => `
        <li class="node">
          <div class="node-dot">${index + 1}</div>
          <div class="node-content">
            <strong>${node[0]}</strong>
            <span>${node[1]}</span>
          </div>
        </li>
      `).join("");
    }

    function renderScript(lines) {
      return lines.map(line => `
        <div class="script-line">
          <div class="time">${line[0]}</div>
          <div>${line[1]}</div>
        </div>
      `).join("");
    }

    function generatePlan() {
      const mode = state.mode;
      const currentPlace = placeName.value.trim() || (mode === "city" ? "一条老街" : "一个村庄");
      const currentTheme = theme.value.trim() || (mode === "city" ? "城市生活" : "乡村生活");
      const currentStyle = style.value;
      const currentDuration = duration.value;
      const currentPlatform = platform.value;
      const nodes = mode === "city" ? cityNodes : villageNodes;
      const title = pickTitle(mode, currentPlace);
      const angle = buildAngle(mode, currentPlace, currentTheme, currentStyle);
      const scripts = buildScript(mode, currentPlace, currentTheme, currentDuration);
      const tags = mode === "city"
        ? ["#城市漫游", "#老街观察", "#城市更新", "#烟火气", "#短视频脚本"]
        : ["#乡村漫游", "#村庄观察", "#乡村生活", "#公共空间", "#治愈系视频"];

      const publishCopy = mode === "city"
        ? `${currentPlace}最迷人的地方，可能不是某个网红机位，而是那些被日常生活反复使用的角落。今天换一种方式走一走，看看“${currentTheme}”藏在哪里。`
        : `${currentPlace}的美，不只在风景里，也在村口、树下、水边和傍晚的闲聊里。慢慢走一遍，才会发现“${currentTheme}”其实离生活很近。`;

      resultBody.innerHTML = `
        <div class="title-card">
          <div class="small">${mode === "city" ? "城市漫游策划" : "乡村漫游策划"} · ${currentDuration} · ${currentPlatform}</div>
          <h3>${title}</h3>
          <p>${angle}</p>
        </div>

        <div class="cards">
          <div class="info-card">
            <h4>内容定位</h4>
            <p>${mode === "city"
              ? `适合拍成一条有观察感的城市生活视频，突出${currentPlace}的空间细节、生活节奏和人的活动。`
              : `适合拍成一条有温度的乡村生活视频，突出${currentPlace}的公共空间、生活场景和慢节奏氛围。`
            }</p>
          </div>
          <div class="info-card">
            <h4>拍摄建议</h4>
            <ul>
              <li>多拍手部动作、脚步、声音来源和停留的人。</li>
              <li>少用大段空镜，尽量让画面里有人和生活痕迹。</li>
              <li>开头 5 秒用最有氛围的镜头吸引停留。</li>
            </ul>
          </div>
        </div>

        <div class="route-board">
          <h4>漫游路线</h4>
          <ul class="route-list">${renderNodes(nodes)}</ul>
        </div>

        <div class="cards" style="margin-top: 20px;">
          <div class="info-card" style="grid-column: 1 / -1;">
            <h4>${currentDuration} 分镜脚本</h4>
            <div class="script">${renderScript(scripts)}</div>
          </div>
        </div>

        <div class="copy-box">
          <h4>发布文案</h4>
          <p>${publishCopy}</p>
          <div class="hashtags">${tags.map(tag => `<span>${tag}</span>`).join("")}</div>
        </div>
      `;
    }

    modeButtons.forEach(button => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });

    document.getElementById("generateBtn").addEventListener("click", generatePlan);

    document.querySelectorAll(".sample-btn").forEach(button => {
      button.addEventListener("click", () => {
        setMode(button.dataset.sample);
        generatePlan();
      });
    });

    generatePlan();
  </script>
</body>
</html>
