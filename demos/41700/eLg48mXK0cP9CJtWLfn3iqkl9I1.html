      /* ===== Preload images ===== */
      DYNASTIES.forEach(function (d) {
        var img = new Image();
        img.src = 'assets/' + d.img;
      });

      /* ===== Select Dynasty ===== */
      function selectDynasty(index, skipScroll) {
        if (index === currentNodeIndex && skipScroll) return;
        currentNodeIndex = index;
        var d = DYNASTIES[index];

        // Fade out
        centerBookName.style.opacity = '0';
        centerDesc.style.opacity = '0';
        centerCta.style.opacity = '0';

        // Switch background
        bgLayer.style.opacity = '0';
        setTimeout(function () {
          bgImg.src = 'assets/' + d.img;
          bgLayer.style.opacity = '1';
        }, 400);

        // Update center
        setTimeout(function () {
          centerBookName.textContent = d.bookLabel;
          centerDesc.textContent = d.desc || '敬请期待';
          centerCta.className = 'center-cta' + (d.active ? '' : ' locked');
          centerCta.href = d.active ? '#shiji' : '#';
          centerBookName.style.opacity = '1';
          centerDesc.style.opacity = '1';
          centerCta.style.opacity = '1';
        }, 300);

        // Update dynasty labels
        var labels = timelineDynasties.querySelectorAll('.dynasty-label');
        labels.forEach(function (l, i) {
          l.classList.toggle('active', i === index);
        });

        // Move highlight bar to dynasty center
        var midYear = (d.start + d.end) / 2;
        var pos = ((midYear - TIMELINE_START) / TIMELINE_RANGE) * 100;
        highlightBar.style.left = pos + '%';

        // Scroll timeline to center the dynasty
        if (!skipScroll) {
          var scrollTarget = (pos / 100) * totalWidth - timelineScale.offsetWidth / 2;
          scrollTarget = Math.max(
            0,
            Math.min(scrollTarget, totalWidth - timelineScale.offsetWidth)
          );
          timelineScale.scrollTo({ left: scrollTarget, behavior: 'smooth' });
        }

        scrollHint.classList.add('hidden');
      }

      // Initial
      selectDynasty(0, true);

      /* ===== Smooth wheel → horizontal scroll ===== */
      var scrollAccumulator = 0;
      var lastWheelTime = 0;
      var rafId = null;

      document.addEventListener(
        'wheel',
        function (e) {
          e.preventDefault();
          var now = Date.now();
          var delta = e.deltaY !== 0 ? e.deltaY : e.deltaX;
          scrollAccumulator += delta;

          if (!rafId) {
            rafId = requestAnimationFrame(function () {
              var amount = scrollAccumulator;
              scrollAccumulator = 0;
              rafId = null;

              timelineScale.scrollLeft += amount;

              // Find closest dynasty
              var scrollCenter = timelineScale.scrollLeft + timelineScale.offsetWidth / 2;
              var closestIndex = 0;
              var closestDist = Infinity;
              DYNASTIES.forEach(function (d, i) {
                var midYear = (d.start + d.end) / 2;
                var px = ((midYear - TIMELINE_START) / TIMELINE_RANGE) * totalWidth;
                var dist = Math.abs(px - scrollCenter);
                if (dist < closestDist) {
                  closestDist = dist;
                  closestIndex = i;
                }
              });

              if (closestIndex !== currentNodeIndex) {
                selectDynasty(closestIndex, true);
              }
            });
          }
        },
        { passive: false }
      );

      /* ===== Vortex Particle System ===== */
      (function () {
        var canvas = document.getElementById('vortex-canvas');
        var ctx = canvas.getContext('2d');
        var width, height;
        var particles = [];
        var PARTICLE_COUNT = 2000;
        var targetX, targetY;

        function resize() {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          updateTarget();
        }

        function updateTarget() {
          var cta = document.getElementById('center-cta');
          if (cta) {
            var rect = cta.getBoundingClientRect();
            targetX = rect.left + rect.width / 2;
            targetY = rect.top + rect.height / 2;
          } else {
            targetX = width / 2;
            targetY = height / 2;
          }
        }

        function createParticle() {
          var angle = Math.random() * Math.PI * 2;
          // Start from edge of screen
          var edgeDist = Math.max(width, height) * (0.5 + Math.random() * 0.3);
          var layer = Math.random();
          var size, opacity, speed;

          if (layer < 0.4) {
            size = Math.random() * 1 + 0.3;
            opacity = Math.random() * 0.08 + 0.02;
            speed = Math.random() * 0.3 + 0.15;
          } else if (layer < 0.75) {
            size = Math.random() * 1.8 + 0.5;
            opacity = Math.random() * 0.12 + 0.04;
            speed = Math.random() * 0.5 + 0.25;
          } else {
            size = Math.random() * 2.5 + 1;
            opacity = Math.random() * 0.18 + 0.05;
            speed = Math.random() * 0.7 + 0.35;
          }

          return {
            x: targetX + Math.cos(angle) * edgeDist,
            y: targetY + Math.sin(angle) * edgeDist,
            size: size,
            opacity: opacity,
            speed: speed,
            angle: angle,
            angularSpeed: (0.008 + Math.random() * 0.015) * (Math.random() < 0.5 ? 1 : -1),
            life: 0,
            maxLife: 300 + Math.random() * 400,
          };
        }

        function init() {
          resize();
          for (var i = 0; i < PARTICLE_COUNT; i++) {
            var p = createParticle();
            // Randomize initial life so they don't all start at edge
            p.life = Math.random() * p.maxLife * 0.8;
            particles.push(p);
          }
        }

        function update() {
          ctx.clearRect(0, 0, width, height);
          updateTarget();

          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.life++;

            // Direction toward target
            var dx = targetX - p.x;
            var dy = targetY - p.y;
            var dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > 1) {
              // Normalize direction
              var nx = dx / dist;
              var ny = dy / dist;

              // Add perpendicular component for spiral (rotate direction 90 degrees)
              var perpX = -ny;
              var perpY = nx;

              // Spiral: mix inward + tangential
              var spiralRatio = Math.min(0.6, 50 / dist); // more tangential when far, more inward when close
              var moveX = (nx * (1 - spiralRatio) + perpX * spiralRatio) * p.speed;
              var moveY = (ny * (1 - spiralRatio) + perpY * spiralRatio) * p.speed;

              p.x += moveX;
              p.y += moveY;
            }

            // Fade based on life and distance
            var lifeRatio = p.life / p.maxLife;
            var alpha = p.opacity;

            // Fade in at start
            if (lifeRatio < 0.1) {
              alpha *= lifeRatio / 0.1;
            }

            // Fade out near target
            if (dist < 80) {
              alpha *= dist / 80;
            }

            // Fade out at end of life
            if (lifeRatio > 0.8) {
              alpha *= (1 - lifeRatio) / 0.2;
            }

            // Draw
            var gradSize = Math.max(0.1, p.size * 2);
            var gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gradSize);
            gradient.addColorStop(0, 'rgba(26,26,26,' + alpha + ')');
            gradient.addColorStop(0.5, 'rgba(26,26,26,' + alpha * 0.3 + ')');
            gradient.addColorStop(1, 'rgba(26,26,26,0)');
            ctx.beginPath();
            ctx.arc(p.x, p.y, gradSize, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Reset
            if (p.life >= p.maxLife || dist < 5) {
              particles[i] = createParticle();
            }
          }

          requestAnimationFrame(update);
        }

        window.addEventListener('resize', resize);
        init();
        update();
      })();
    </script>
  </body>
</html>
