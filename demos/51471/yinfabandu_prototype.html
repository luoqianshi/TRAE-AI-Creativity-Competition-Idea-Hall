<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>“银发伴读”小程序原型 - TRAE Work 创意产物</title>
    <style>
        :root {
            --primary-color: #2e7d32; /* 深绿色，给人稳重健康的感觉 */
            --primary-light: #e8f5e9;
            --accent-color: #ff9800;  /* 温暖的橙色，用于高亮 */
            --text-dark: #1a1a1a;    /* 超高对比度文字 */
            --text-muted: #555555;
            --bg-phone: #fcfbfa;     /* 护眼暖白背景 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 模拟手机外壳容器 */
        .phone-container {
            width: 412px;
            height: 846px;
            background: #000;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            border: 4px solid #333;
        }

        /* 手机屏幕 */
        .phone-screen {
            width: 100%;
            height: 100%;
            background-color: var(--bg-phone);
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 手机状态栏 */
        .status-bar {
            height: 30px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 14px;
            font-weight: bold;
        }

        /* 小程序导航栏 */
        .nav-bar {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .nav-bar .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            cursor: pointer;
            display: none;
        }

        /* 主体内容滚动区 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 120px; /* 为底部控制栏留出空间 */
        }

        /* 欢迎语及时间 */
        .welcome-section {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }

        .welcome-title {
            font-size: 28px;
            color: var(--text-dark);
            font-weight: bold;
            margin-bottom: 8px;
        }

        .welcome-sub {
            font-size: 18px;
            color: var(--text-muted);
        }

        /* 核心语音交互区 */
        .voice-section {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border: 3px solid var(--primary-color);
            border-radius: 24px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(46, 125, 50, 0.15);
        }

        .voice-prompt {
            font-size: 22px;
            color: #1b5e20;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .mic-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: var(--primary-color);
            border: 6px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .mic-button:active {
            transform: scale(0.92);
            background-color: #1b5e20;
        }

        .mic-icon {
            width: 44px;
            height: 44px;
            fill: white;
        }

        /* 语音波纹动画 */
        .wave-container {
            display: none;
            justify-content: center;
            align-items: center;
            height: 30px;
            margin-top: 15px;
        }

        .wave-bar {
            width: 6px;
            height: 10px;
            background-color: var(--primary-color);
            margin: 0 4px;
            border-radius: 3px;
            animation: pulse 1s infinite ease-in-out;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .wave-bar:nth-child(4) { animation-delay: 0.6s; }

        @keyframes pulse {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }

        /* 大字板块网格 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .menu-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.04);
            transition: border-color 0.2s;
        }

        .menu-card:active {
            background-color: #f5f5f5;
            border-color: var(--primary-color);
        }

        .menu-icon {
            width: 50px;
            height: 50px;
            margin-bottom: 12px;
        }

        .menu-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-dark);
        }

        /* 内容详情页展示 (默认隐藏) */
        .detail-page {
            display: none;
        }

        .article-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .article-meta {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .article-body {
            font-size: 24px; /* 默认超大字号 */
            line-height: 1.6;
            color: var(--text-dark);
            text-align: justify;
        }
        
        .article-body p {
            margin-bottom: 20px;
        }

        /* 适老化全局底部悬浮控制栏 */
        .bottom-control-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 3px solid #e0e0e0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 32px;
            border-bottom-right-radius: 32px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
            z-index: 10;
        }

        .ctrl-btn {
            background: var(--primary-light);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ctrl-btn:active {
            background: var(--primary-color);
            color: white;
        }

        .play-main-btn {
            background: var(--accent-color);
            border: 2px solid #e65100;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: pointer;
        }

        /* 右上角水印提示（用于竞赛展示） */
        .trae-badge {
            position: absolute;
            top: -35px;
            right: 10px;
            background: #1e88e5;
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div style="position: relative;">
        <div class="trae-badge">TRAE Work - Auto模式原型</div>
        
        <!-- 手机容器 -->
        <div class="phone-container">
            <div class="phone-screen">
                
                <!-- 状态栏 -->
                <div class="status-bar">
                    <span>10:30</span>
                    <span>信号 📶 电池 🔋 100%</span>
                </div>

                <!-- 导航栏 -->
                <div class="nav-bar">
                    <span class="back-btn" id="backBtn" onclick="goBack()">◀ 返回</span>
                    <span id="navTitle">银发伴读</span>
                </div>

                <!-- 主内容区 -->
                <div class="main-content" id="mainScroll">
                    
                    <!-- 首页视图 -->
                    <div id="homePage">
                        <div class="welcome-section">
                            <div class="welcome-title">上午好，张大爷</div>
                            <div class="welcome-sub">今天是2026年6月30日 星期二</div>
                        </div>

                        <!-- 语音中心 -->
                        <div class="voice-section">
                            <div class="voice-prompt" id="voiceText">点大按钮，对我说：“我想听新闻”</div>
                            <div class="mic-button" onclick="triggerVoice()">
                                <svg class="mic-icon" viewBox="0 0 24 24">
                                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                                </svg>
                            </div>
                            <div class="wave-container" id="waveAnim">
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                                <div class="wave-bar"></div>
                            </div>
                        </div>

                        <!-- 大字功能菜单 -->
                        <div class="menu-grid">
                            <div class="menu-card" onclick="openArticle('news')">
                                <img class="menu-icon" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232e7d32'><path d='M20 5H4c-1.1 0-1.99.9-1.99 2L2 19c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-5 14H4v-4h11v4zm0-5H4v-4h11v4zm5 9h-4V10h4v9zm0-11h-9V7h9v2z'/></svg>" alt="新闻">
                                <div class="menu-title">每日新闻</div>
                            </div>
                            <div class="menu-card" onclick="openArticle('health')">
                                <img class="menu-icon" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23e53935'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.5 3 21 5.42 21 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>" alt="养生">
                                <div class="menu-title">健康养生</div>
                            </div>
                            <div class="menu-card" onclick="simulateVoiceCommand('我想听评书')">
                                <img class="menu-icon" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231565c0'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" alt="有声书">
                                <div class="menu-title">经典有声书</div>
                            </div>
                            <div class="menu-card" onclick="simulateVoiceCommand('今天天气怎么样')">
                                <img class="menu-icon" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23fbc02d'><path d='M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-6.8V1h-2v2.7h2zM20.01 4.46l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zM12 6c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm7 4.5h3v2h-3v-2zM5.38 17.59l-1.79 1.78 1.41 1.41 1.79-1.79-1.41-1.41zm14.18 0l-1.41 1.41 1.79 1.79 1.41-1.41-1.79-1.79zM11 18.3v2.7h2v-2.7h-2z'/></svg>" alt="天气">
                                <div class="menu-title">天气预报</div>
                            </div>
                        </div>
                    </div>

                    <!-- 详情页视图 -->
                    <div id="detailPage" class="detail-page">
                        <div class="article-title" id="artTitle">今日头条要闻</div>
                        <div class="article-meta" id="artMeta">来源：官方新华网 • 语音正在朗读</div>
                        <div class="article-body" id="artBody">
                            <!-- 内容动态加载 -->
                        </div>
                    </div>

                </div>

                <!-- 适老化控制栏 -->
                <div class="bottom-control-bar">
                    <button class="ctrl-btn" onclick="adjustFont()">
                        <span>字号</span> <span id="fontSizeLabel" style="color: var(--accent-color);">大</span>
                    </button>
                    
                    <div class="play-main-btn" id="playBtn" onclick="togglePlay()">
                        <!-- 暂停状态图标 -->
                        <svg id="playIcon" style="width:30px; height:30px; fill:white;" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <!-- 播放状态图标 -->
                        <svg id="pauseIcon" style="width:30px; height:30px; fill:white; display:none;" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </div>

                    <button class="ctrl-btn" onclick="toggleSpeed()">
                        <span>语速</span> <span id="speedLabel" style="color: var(--accent-color);">稍慢</span>
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        let isListening = false;
        let isPlaying = false;
        let fontSizeMode = 1; // 0:中, 1:大, 2:特大
        let speedMode = 1;    // 0:正常, 1:稍慢

        const articles = {
            news: {
                title: "关注老年人精神文化生活，全国多地推进数字产品适老化改造",
                meta: "来源：新华社 • 播报音：温和男声",
                content: "<p>随着我国老龄化进程加速，如何让老年人跨越“数字鸿沟”成为社会广泛关注的话题。</p><p>今年，各部门积极出台新举措，鼓励软件厂商推出大字体、纯净版、具备语音交互功能的智慧适老应用，让银发一族也能畅享智能时代的便利与精彩。</p>"
            },
            health: {
                title: "夏季老年人养生要点：多喝温水，清淡饮食",
                meta: "来源：健康生活报 • 播报音：亲切女声",
                content: "<p>炎炎夏日，气温升高，老年人要注意及时补充水分。专家建议，不要等到口渴时再喝水，应当定时定量饮用温开水。</p><p>在饮食方面，应以清淡、易消化为主，少吃生冷油腻的食物，保证充足的睡眠，避免午后高温时段外出。</p>"
            }
        };

        function triggerVoice() {
            isListening = !isListening;
            const voiceText = document.getElementById('voiceText');
            const waveAnim = document.getElementById('waveAnim');
            
            if(isListening) {
                voiceText.innerText = "正在听您说话... 请说...";
                voiceText.style.color = "#ff9800";
                waveAnim.style.display = "flex";
                
                // 模拟3秒后听到指令
                setTimeout(() => {
                    if(isListening) {
                        simulateVoiceCommand("我想听新闻");
                    }
                }, 3000);
            } else {
                resetVoiceElement();
            }
        }

        function resetVoiceElement() {
            isListening = false;
            document.getElementById('voiceText').innerText = "点大按钮，对我说：“我想听新闻”";
            document.getElementById('voiceText').style.color = "#1b5e20";
            document.getElementById('waveAnim').style.display = "none";
        }

        function simulateVoiceCommand(command) {
            resetVoiceElement();
            alert("【智能语音识别】成功！收到指令：\"" + command + "\"，正在为您跳转并开启语音朗读。");
            if(command.includes("新闻")) {
                openArticle('news');
            } else if(command.includes("养生")) {
                openArticle('health');
            } else {
                // 其他模拟
                document.getElementById('homePage').style.display = 'none';
                document.getElementById('detailPage').style.display = 'block';
                document.getElementById('backBtn').style.display = 'block';
                document.getElementById('navTitle').innerText = "语音播报中";
                document.getElementById('artTitle').innerText = "正在为您播放：" + command;
                document.getElementById('artMeta').innerText = "为您找到的相关电台内容";
                document.getElementById('artBody').innerHTML = "<p>正在智能搜索并播放适合老年人聆听的《" + command + "》相关音频内容。语速已自动设为慢速，声音调至最大。</p>";
                setPlayState(true);
            }
        }

        function openArticle(key) {
            const art = articles[key];
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('detailPage').style.display = 'block';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('navTitle').innerText = "正在听书";
            
            document.getElementById('artTitle').innerText = art.title;
            document.getElementById('artMeta').innerText = art.meta;
            document.getElementById('artBody').innerHTML = art.content;
            
            setPlayState(true);
            document.getElementById('mainScroll').scrollTop = 0;
        }

        function goBack() {
            document.getElementById('homePage').style.display = 'block';
            document.getElementById('detailPage').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            document.getElementById('navTitle').innerText = "银发伴读";
            setPlayState(false);
        }

        function togglePlay() {
            setPlayState(!isPlaying);
        }

        function setPlayState(play) {
            isPlaying = play;
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            if(isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        function adjustFont() {
            fontSizeMode = (fontSizeMode + 1) % 3;
            const body = document.getElementById('artBody');
            const label = document.getElementById('fontSizeLabel');
            
            if(fontSizeMode === 0) {
                body.style.fontSize = "20px";
                label.innerText = "中";
            } else if(fontSizeMode === 1) {
                body.style.fontSize = "26px";
                label.innerText = "大";
            } else {
                body.style.fontSize = "32px";
                label.innerText = "特大";
            }
        }

        function toggleSpeed() {
            speedMode = (speedMode + 1) % 2;
            const label = document.getElementById('speedLabel');
            if(speedMode === 0) {
                label.innerText = "正常";
            } else {
                label.innerText = "稍慢";
            }
        }
    </script>
</body>
</html>
