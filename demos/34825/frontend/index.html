<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Scene - 虚拟主播系统控制端</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-page">
    <canvas id="particle-canvas"></canvas>
    <div class="landing-glow"></div>

    <main class="landing-main">
        <div class="brand fade-in-up" style="animation-delay: 0.2s">
            <div class="brand-icon">◈</div>
            <h1 class="brand-title">FUTURE SCENE</h1>
        </div>

        <p class="brand-subtitle fade-in-up" style="animation-delay: 0.5s">
            虚拟主播系统控制端
        </p>

        <p class="brand-slogan fade-in-up" style="animation-delay: 0.8s">
            一套框架 · 无限角色
        </p>

        <a href="control.html" class="enter-btn fade-in-up" style="animation-delay: 1.1s">
            <span>进入控制端</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </a>
    </main>

    <footer class="landing-footer fade-in" style="animation-delay: 1.5s">
        <p>Future Scene · 2026</p>
    </footer>

    <script src="js/main.js"></script>
