<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人话翻译官 · 把专业话术翻译成大白话</title>
  <meta name="description" content="让普通人也能听懂专业话术——医嘱、合同、HR、中介、平台规则、相亲介绍，一键翻译成人话。" />
  <style>
    /* ============ 基础 ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #6366F1;
      --primary-dark: #4F46E5;
      --primary-light: #EEF2FF;
      --accent: #10B981;
      --danger: #DC2626;
      --danger-light: #FEF2F2;
      --warn: #F59E0B;
      --warn-light: #FFFBEB;
      --info: #3B82F6;
      --info-light: #EFF6FF;
      --bg: #FAFAFA;
      --bg-soft: #F4F4F5;
      --card: #FFFFFF;
      --border: #E5E7EB;
      --border-soft: #F3F4F6;
      --text: #18181B;
      --text-soft: #52525B;
      --text-mute: #A1A1AA;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
      --shadow: 0 4px 12px rgba(0,0,0,.06);
      --shadow-lg: 0 12px 32px rgba(0,0,0,.10);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --header-h: 60px;
      --transition: .2s ease;
    }
    [data-theme="dark"] {
      --primary: #818CF8;
      --primary-dark: #6366F1;
      --primary-light: #1E1B4B;
      --accent: #34D399;
      --danger: #F87171;
      --danger-light: #450A0A;
      --warn: #FBBF24;
      --warn-light: #451A03;
      --info: #60A5FA;
      --info-light: #172554;
      --bg: #0B0B10;
      --bg-soft: #15151B;
      --card: #1A1A22;
      --border: #2A2A35;
      --border-soft: #22222C;
      --text: #F4F4F5;
      --text-soft: #A1A1AA;
      --text-mute: #71717A;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
      --shadow: 0 4px 12px rgba(0,0,0,.4);
      --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      transition: background var(--transition), color var(--transition);
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    textarea { font-family: inherit; }

    /* ============ 顶部栏 ============ */
    .topbar {
      height: var(--header-h);
      padding: 0 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px;
      box-shadow: 0 4px 12px rgba(99,102,241,.3);
    }
    .brand-text h1 { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .brand-text span { font-size: 12px; color: var(--text-mute); }
    .topnav { display: flex; align-items: center; gap: 4px; }
    .nav-btn {
      padding: 8px 12px; border-radius: var(--radius-sm);
      display: flex; align-items: center; gap: 6px;
      color: var(--text-soft); font-size: 13px;
      transition: var(--transition);
    }
    .nav-btn:hover { background: var(--bg-soft); color: var(--text); }
    .nav-btn.active { background: var(--primary-light); color: var(--primary); }
    .nav-btn i { width: 16px; height: 16px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-soft); transition: var(--transition);
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--text); }
    .icon-btn i { width: 18px; height: 18px; }

    /* ============ 主体 ============ */
    .main { flex: 1; padding: 24px; max-width: 1280px; margin: 0 auto; width: 100%; }
    .view { display: none; }
    .view.active { display: block; animation: fadeIn .3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ============ 场景选择 ============ */
    .scene-bar {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .scene-bar-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; color: var(--text-soft);
      margin-bottom: 12px;
    }
    .scene-bar-title i { width: 16px; height: 16px; }
    .scene-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px;
    }
    .scene-chip {
      padding: 10px 12px; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--card);
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; transition: var(--transition);
      text-align: left; color: var(--text);
    }
    .scene-chip:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); }
    .scene-chip.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .scene-chip .emoji { font-size: 18px; }
    .scene-chip .label { flex: 1; }

    /* ============ 工作区 ============ */
    .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .panel {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); display: flex; flex-direction: column;
      overflow: hidden; box-shadow: var(--shadow-sm); min-height: 480px;
    }
    .panel-head {
      padding: 12px 16px; border-bottom: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card);
    }
    .panel-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
    .panel-title i { width: 16px; height: 16px; color: var(--primary); }
    .panel-actions { display: flex; gap: 4px; }
    .ghost-btn {
      padding: 6px 10px; border-radius: 6px; font-size: 12px;
      color: var(--text-soft); display: flex; align-items: center; gap: 4px;
      transition: var(--transition);
    }
    .ghost-btn:hover:not(:disabled) { background: var(--bg-soft); color: var(--text); }
    .ghost-btn:disabled { opacity: .4; cursor: not-allowed; }
    .ghost-btn i { width: 14px; height: 14px; }

    #inputText {
      flex: 1; border: none; outline: none; padding: 16px;
      background: var(--card); color: var(--text);
      font-size: 14px; line-height: 1.7; resize: none; min-height: 360px;
    }
    #inputText::placeholder { color: var(--text-mute); }

    .panel-foot {
      padding: 12px 16px; border-top: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-soft);
    }
    .meta { font-size: 12px; color: var(--text-mute); display: flex; align-items: center; gap: 8px; }
    .dot { color: var(--text-mute); }
    .primary-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff; border-radius: 8px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 12px rgba(99,102,241,.3); transition: var(--transition);
    }
    .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,.4); }
    .primary-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .primary-btn i { width: 16px; height: 16px; }

    /* ============ 结果区 ============ */
    .result-body { flex: 1; padding: 20px; overflow-y: auto; max-height: 600px; }
    .empty-state {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text-mute); text-align: center;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }
    .empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text-soft); margin-bottom: 4px; }
    .empty-state p { font-size: 13px; }

    .result-section { margin-bottom: 24px; }
    .result-section:last-child { margin-bottom: 0; }
    .result-section-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; color: var(--text-soft);
      margin-bottom: 12px; padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }
    .result-section-title i { width: 16px; height: 16px; }

    .translate-item {
      background: var(--bg-soft); border-radius: var(--radius-sm);
      padding: 12px 14px; margin-bottom: 8px;
      border-left: 3px solid var(--info); transition: var(--transition);
    }
    .translate-item.danger { border-left-color: var(--danger); background: var(--danger-light); }
    .translate-item.warn { border-left-color: var(--warn); background: var(--warn-light); }
    .translate-item.ok { border-left-color: var(--accent); background: rgba(16,185,129,.08); }
    [data-theme="dark"] .translate-item.ok { background: rgba(16,185,129,.12); }

    .translate-original {
      font-size: 12px; color: var(--text-mute);
      margin-bottom: 6px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .translate-original .tag {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      background: var(--card); color: var(--primary);
      font-weight: 600; font-size: 11px; border: 1px solid var(--primary);
    }
    .translate-result { font-size: 14px; color: var(--text); font-weight: 500; line-height: 1.6; }

    mark.term {
      background: rgba(99,102,241,.15); color: var(--primary);
      padding: 0 2px; border-radius: 3px; font-weight: 500;
      cursor: help; border-bottom: 1px dashed var(--primary);
    }
    mark.risk {
      background: rgba(220,38,38,.15); color: var(--danger);
      border-bottom: 1px dashed var(--danger); font-weight: 600;
    }
    [data-theme="dark"] mark.term { background: rgba(129,140,248,.2); }
    [data-theme="dark"] mark.risk { background: rgba(248,113,113,.2); }

    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .summary-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm);
    }
    .summary-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .summary-icon.danger { background: var(--danger-light); color: var(--danger); }
    .summary-icon.warn { background: var(--warn-light); color: var(--warn); }
    .summary-icon.info { background: var(--info-light); color: var(--info); }
    .summary-icon.ok { background: rgba(16,185,129,.12); color: var(--accent); }
    .summary-icon i { width: 20px; height: 20px; }
    .summary-num { font-size: 24px; font-weight: 700; line-height: 1; color: var(--text); }
    .summary-label { font-size: 12px; color: var(--text-mute); margin-top: 2px; }

    .tip-list { display: flex; flex-direction: column; gap: 8px; }
    .tip-item {
      background: var(--bg-soft); padding: 10px 12px; border-radius: var(--radius-sm);
      font-size: 13px; display: flex; align-items: flex-start; gap: 8px; line-height: 1.6;
    }
    .tip-item .tip-icon { flex-shrink: 0; margin-top: 1px; }
    .tip-item.danger .tip-icon { color: var(--danger); }
    .tip-item.warn .tip-icon { color: var(--warn); }
    .tip-item.ok .tip-icon { color: var(--accent); }
    .tip-item i { width: 16px; height: 16px; }

    /* ============ 场景页 ============ */
    .page-head { margin-bottom: 24px; }
    .page-head h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .page-head p { color: var(--text-mute); font-size: 14px; }
    .scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .scene-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; cursor: pointer;
      transition: var(--transition); box-shadow: var(--shadow-sm);
    }
    .scene-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--primary); }
    .scene-card .emoji { font-size: 32px; margin-bottom: 8px; }
    .scene-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .scene-card p { font-size: 13px; color: var(--text-mute); line-height: 1.5; }

    .list { display: flex; flex-direction: column; gap: 12px; }
    .list-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      display: flex; gap: 12px; box-shadow: var(--shadow-sm); transition: var(--transition);
    }
    .list-item:hover { box-shadow: var(--shadow); }
    .list-item .meta { flex: 1; min-width: 0; }
    .list-item .scene-tag {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600;
      background: var(--primary-light); color: var(--primary); margin-bottom: 6px;
    }
    .list-item .text {
      font-size: 13px; color: var(--text-soft);
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 4px;
    }
    .list-item .time { font-size: 11px; color: var(--text-mute); }
    .list-item .actions { display: flex; flex-direction: column; gap: 4px; }
    .empty { text-align: center; padding: 60px 20px; color: var(--text-mute); font-size: 14px; }
    .empty .emoji { font-size: 48px; margin-bottom: 12px; opacity: .4; }

    /* ============ 底部 ============ */
    .footer {
      padding: 16px 24px; border-top: 1px solid var(--border);
      text-align: center; font-size: 12px; color: var(--text-mute);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    /* ============ Toast ============ */
    .toast {
      position: fixed; top: 80px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--text); color: var(--card);
      padding: 10px 18px; border-radius: 8px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: all .3s;
      z-index: 1000; box-shadow: var(--shadow-lg);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--accent); }
    .toast.error { background: var(--danger); }

    /* ============ 弹窗 ============ */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px; animation: fadeIn .2s;
    }
    .modal-card {
      background: var(--card); border-radius: var(--radius-lg);
      width: 100%; max-width: 480px; box-shadow: var(--shadow-lg);
      overflow: hidden; animation: slideUp .3s;
    }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-head {
      padding: 16px 20px; border-bottom: 1px solid var(--border-soft);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-head h3 { font-size: 16px; font-weight: 600; }
    .modal-body { padding: 20px; line-height: 1.7; }
    .modal-body p { margin-bottom: 12px; font-size: 14px; }
    .modal-body ul { padding-left: 20px; }
    .modal-body li { margin-bottom: 4px; }
    .modal-body .muted { color: var(--text-mute); font-size: 12px; margin-top: 12px; margin-bottom: 0; }

    /* ============ 响应式 ============ */
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .panel { min-height: 320px; }
    }
    @media (max-width: 600px) {
      .main { padding: 12px; }
      .topbar { padding: 0 12px; }
      .brand-text span { display: none; }
      .nav-btn span { display: none; }
      .nav-btn { padding: 8px; }
      .scene-list { grid-template-columns: repeat(2, 1fr); }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .summary-card { padding: 12px; }
      .summary-num { font-size: 20px; }
      .footer { font-size: 11px; }
      .empty-state { padding: 40px 20px; }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-mute); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">译</div>
      <div class="brand-text">
        <h1>人话翻译官</h1>
        <span>让专业话术不再难懂</span>
      </div>
    </div>
    <nav class="topnav">
      <button class="nav-btn active" data-view="home" title="首页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>首页</span>
      </button>
      <button class="nav-btn" data-view="scenes" title="场景">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        <span>场景</span>
      </button>
      <button class="nav-btn" data-view="history" title="历史">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>历史</span>
      </button>
      <button class="nav-btn" data-view="favorites" title="收藏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>收藏</span>
      </button>
      <button class="icon-btn" id="themeToggle" title="切换主题">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </nav>
  </header>

  <main class="main">
    <section class="view active" data-view="home">
      <div class="scene-bar">
        <div class="scene-bar-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          <span>选择场景</span>
        </div>
        <div class="scene-list" id="sceneList"></div>
      </div>

      <div class="workspace">
        <div class="panel input-panel">
          <div class="panel-head">
            <div class="panel-title">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              <span>原话</span>
            </div>
            <div class="panel-actions">
              <button class="ghost-btn" id="loadExample">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                加载示例
              </button>
              <button class="ghost-btn" id="clearInput">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                清空
              </button>
            </div>
          </div>
          <textarea
            id="inputText"
            placeholder="把看不懂的话粘贴在这里……&#10;&#10;例如：&#10;· 一段租房合同&#10;· 一份检查报告&#10;· 一句 HR 的话&#10;· 一段房源描述"
            spellcheck="false"
          ></textarea>
          <div class="panel-foot">
            <div class="meta">
              <span id="charCount">0</span> 字
              <span class="dot">·</span>
              <span id="sceneLabel">未选择场景</span>

  /* ==================== 工具 ==================== */
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
    if (diff < 604800) return `${Math.floor(diff / 86400)} 天前`;
    return d.toLocaleDateString('zh-CN');
  }

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  /* ==================== 存储 ==================== */
  const Storage = {
    get(key, def) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
      catch { return def; }
    },
    set(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); }
      catch (e) { console.warn('storage failed', e); }
    },
  };

  function getHistory() { return Storage.get('rhh:history', []); }
  function addHistory(r) {
    const list = getHistory().filter(x => !(x.text === r.text && x.scene === r.scene));
    list.unshift({
      id: newId(),
      text: r.text,
      scene: r.scene,
      sceneName: r.sceneName,
      stats: r.stats,
      createdAt: new Date().toISOString(),
    });
    Storage.set('rhh:history', list.slice(0, 50));
  }
  function deleteHistory(id) {
    Storage.set('rhh:history', getHistory().filter(x => x.id !== id));
  }
  function clearHistory() { Storage.set('rhh:history', []); }

  function getFavorites() { return Storage.get('rhh:favorites', []); }
  function isFavorited(text, scene) {
    return getFavorites().some(x => x.text === text && x.scene === scene);
  }
  function addFavorite(r) {
    const list = getFavorites();
    if (isFavorited(r.text, r.scene)) return false;
    list.unshift({
      id: newId(),
      title: r.title || `${r.sceneName} - ${(r.text || '').slice(0, 20)}...`,
      text: r.text,
      scene: r.scene,
      sceneName: r.sceneName,
      stats: r.stats,
      items: r.items,
      createdAt: new Date().toISOString(),
    });
    Storage.set('rhh:favorites', list.slice(0, 100));
    return true;
  }
  function removeFavorite(id) {
    Storage.set('rhh:favorites', getFavorites().filter(x => x.id !== id));
  }

  function getTheme() { try { return localStorage.getItem('rhh:theme') || 'light'; } catch { return 'light'; } }
  function setTheme(t) { try { localStorage.setItem('rhh:theme', t); } catch {} }

  /* ==================== 翻译引擎 ==================== */
  function translate(text, scene) {
    if (!text || !scene) {
      return { items: [], highlighted: escapeHtml(text || ''),
               stats: { termCount: 0, riskCount: 0, dangerCount: 0, warnCount: 0, infoCount: 0 } };
    }
    const items = [];
    const used = [];
    const sortedTerms = Object.entries(scene.terms || {}).sort((a, b) => b[0].length - a[0].length);
    for (const [term, info] of sortedTerms) {
      const safe = escapeRegExp(term);
      const pattern = /[a-zA-Z]/.test(term)
        ? new RegExp(`\\b${safe}\\b`, 'g')
        : new RegExp(safe, 'g');
      let m;
      while ((m = pattern.exec(text)) !== null) {
        const s = m.index, e = s + m[0].length;
        if (used.some(([a, b]) => s < b && e > a)) continue;
        used.push([s, e]);
        items.push({ start: s, end: e, original: m[0], plain: info.plain, severity: info.severity || 'info', type: 'term' });
      }
    }
    for (const risk of (scene.risks || [])) {
      const p = new RegExp(risk.pattern.source, risk.pattern.flags);
      let m;
      while ((m = p.exec(text)) !== null) {
        const s = m.index, e = s + m[0].length;
        if (used.some(([a, b]) => s < b && e > a)) continue;
        used.push([s, e]);
        items.push({ start: s, end: e, original: m[0], plain: risk.msg, severity: risk.type, type: 'risk' });
      }
    }
    items.sort((a, b) => a.start - b.start);

    // 生成高亮 HTML
    let html = '';
    let cursor = 0;
    for (const it of items) {
      if (it.start > cursor) html += escapeHtml(text.slice(cursor, it.start));
      const cls = it.type === 'risk' ? 'mark risk' : 'mark term';
      html += `<mark class="${cls}" title="${escapeHtml(it.plain)}">${escapeHtml(text.slice(it.start, it.end))}</mark>`;
      cursor = it.end;
    }
    if (cursor < text.length) html += escapeHtml(text.slice(cursor));

    const stats = {
      termCount: items.filter(i => i.type === 'term').length,
      riskCount: items.filter(i => i.type === 'risk').length,
      dangerCount: items.filter(i => i.severity === 'danger').length,
      warnCount: items.filter(i => i.severity === 'warn').length,
      infoCount: items.filter(i => i.severity === 'info').length,
    };
    return { items, highlighted: html, stats };
  }

  function assessRisk(result, scene) {
    const { stats, items } = result;
    let level = 'low', label = '整体安全', color = 'ok';
    if (stats.dangerCount > 0) { level = 'high'; label = '高风险 · 建议谨慎'; color = 'danger'; }
    else if (stats.warnCount >= 3) { level = 'medium'; label = '中风险 · 需要注意'; color = 'warn'; }
    else if (stats.warnCount > 0) { level = 'low-medium'; label = '低风险 · 留意一下'; color = 'warn'; }

    const actions = [];
    items.filter(i => i.severity === 'danger').slice(0, 3).forEach(i => {
      actions.push({ type: 'danger', icon: 'alert-triangle', text: i.plain });
    });
    items.filter(i => i.severity === 'warn' && i.type === 'risk').slice(0, 2).forEach(i => {
      actions.push({ type: 'warn', icon: 'alert-circle', text: i.plain });
    });
    if (actions.length < 3) {
      (scene.tips || []).slice(0, 3 - actions.length).forEach(t => {
        actions.push({ type: 'ok', icon: 'lightbulb', text: t });
      });
    }
    return { level, label, color, actions, stats };
  }

  /* ==================== UI 渲染 ==================== */
  function renderSceneChips() {
    const box = document.getElementById('sceneList');
    box.innerHTML = SCENE_LIST.map(s => `
      <button class="scene-chip" data-scene="${s.id}">
        <span class="emoji">${s.emoji}</span>
        <span class="label">${s.name}</span>
      </button>
    `).join('');
    box.querySelectorAll('.scene-chip').forEach(b => {
      b.addEventListener('click', () => selectScene(b.dataset.scene));
    });
  }

  function selectScene(id) {
    const scene = SCENES[id];
    if (!scene) return;
    document.querySelectorAll('.scene-chip').forEach(b => b.classList.toggle('active', b.dataset.scene === id));
    document.getElementById('inputText').placeholder = scene.placeholder || '把看不懂的话粘贴在这里...';
    document.getElementById('sceneLabel').textContent = `${scene.emoji} ${scene.name}`;
    document.body.dataset.currentScene = id;
  }

  function getCurrentScene() {
    return SCENES[document.body.dataset.currentScene];
  }

  function renderResult(result, risk, scene) {
    const body = document.getElementById('resultBody');
    if (!result.items.length) {
      body.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><h3>没找到匹配的专业术语</h3><p>试试选择其他场景，或粘贴更长的文本</p></div>`;
      return;
    }
    const iconMap = {
      'alert-triangle': '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>',
      'alert-circle': '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
      'lightbulb': '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="9" x2="15" y1="18" y2="18"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>',
    };
    const sorted = [...result.items].sort((a, b) => {
      const o = { danger: 0, warn: 1, info: 2, ok: 3 };
      return o[a.severity] - o[b.severity];
    });
    body.innerHTML = `
      <div class="result-section">
        <div class="result-section-title">⚠️ <span>风险概览：${risk.label}</span></div>
        <div class="tip-list">
          ${risk.actions.map(a => `
            <div class="tip-item ${a.type}">
              <span class="tip-icon">${iconMap[a.icon] || ''}</span>
              <span>${a.text}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="result-section">
        <div class="result-section-title">🔍 <span>原文标注（鼠标悬停查看翻译）</span></div>
        <div class="translate-item">
          <div class="translate-result highlighted-text" style="font-size:15px;line-height:1.8;">${result.highlighted}</div>
        </div>
      </div>
      <div class="result-section">
        <div class="result-section-title">📖 <span>详细解释（${result.items.length} 条）</span></div>
        ${sorted.map(it => `
          <div class="translate-item ${it.severity}">
            <div class="translate-original">
              <span class="tag">${escapeHtml(it.original)}</span>
              ${it.type === 'risk' ? '<span style="color:var(--danger);font-size:11px;">⚠️ 风险</span>' : ''}
            </div>
            <div class="translate-result">${escapeHtml(it.plain)}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderSummary(stats) {
    const box = document.getElementById('summary');
    if (!stats || (!stats.termCount && !stats.riskCount)) { box.hidden = true; return; }
    box.hidden = false;
    document.getElementById('riskCount').textContent = stats.dangerCount || 0;
    document.getElementById('jargonCount').textContent = (stats.warnCount || 0) + (stats.dangerCount || 0);
    document.getElementById('termCount').textContent = stats.termCount || 0;
    document.getElementById('tipCount').textContent = (stats.dangerCount || 0) + (stats.warnCount || 0);
  }

  function renderSceneGrid() {
    const grid = document.getElementById('sceneGrid');
    grid.innerHTML = SCENE_LIST.map(s => `
      <div class="scene-card" data-scene="${s.id}">
        <div class="emoji">${s.emoji}</div>
        <h3>${s.name}</h3>
        <p>${s.description}</p>
      </div>
    `).join('');
    grid.querySelectorAll('.scene-card').forEach(c => {
      c.addEventListener('click', () => {
        selectScene(c.dataset.scene);
        switchView('home');
        document.getElementById('inputText').focus();
      });
    });
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    const items = getHistory();
    if (!items.length) {
      list.innerHTML = `<div class="empty"><div class="emoji">📝</div><p>还没有翻译记录</p></div>`;
      return;
    }
    list.innerHTML = items.map(r => `
      <div class="list-item" data-id="${r.id}">
        <div class="meta">
          <div class="scene-tag">${escapeHtml(r.sceneName || r.scene)}</div>
          <div class="text">${escapeHtml(r.text)}</div>
          <div class="time">${formatTime(r.createdAt)} · 已识别 ${r.stats?.termCount || 0} 词条</div>
        </div>
        <div class="actions">
          <button class="ghost-btn reuse-btn" data-id="${r.id}">↻ 重新查看</button>
          <button class="ghost-btn delete-btn" data-id="${r.id}">🗑 删除</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.delete-btn').forEach(b => {
      b.addEventListener('click', () => { deleteHistory(b.dataset.id); renderHistory(); toast('已删除', 'success'); });
    });
    list.querySelectorAll('.reuse-btn').forEach(b => {
      b.addEventListener('click', () => {
        const item = getHistory().find(x => x.id === b.dataset.id);
        if (item) {
          selectScene(item.scene);
          document.getElementById('inputText').value = item.text;
          updateCharCount();
          switchView('home');
          setTimeout(doTranslate, 200);
        }
      });
    });
  }

  function renderFavorites() {
    const list = document.getElementById('favoritesList');
    const items = getFavorites();
    if (!items.length) {
      list.innerHTML = `<div class="empty"><div class="emoji">⭐</div><p>还没有收藏的翻译</p><p style="font-size:12px;margin-top:8px;">翻译后点击「收藏」按钮即可保存</p></div>`;
      return;
    }
    list.innerHTML = items.map(r => `
      <div class="list-item" data-id="${r.id}">
        <div class="meta">
          <div class="scene-tag">${escapeHtml(r.sceneName || r.scene)}</div>
          <div class="text" style="font-weight:600;color:var(--text);">${escapeHtml(r.title)}</div>
          <div class="text">${escapeHtml(r.text)}</div>
          <div class="time">${formatTime(r.createdAt)}</div>
        </div>
        <div class="actions">
          <button class="ghost-btn view-fav" data-id="${r.id}">👁 查看</button>
          <button class="ghost-btn del-fav" data-id="${r.id}">🗑 删除</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('.del-fav').forEach(b => {
      b.addEventListener('click', () => { removeFavorite(b.dataset.id); renderFavorites(); toast('已删除收藏', 'success'); });
    });
    list.querySelectorAll('.view-fav').forEach(b => {
      b.addEventListener('click', () => {
        const item = getFavorites().find(x => x.id === b.dataset.id);
        if (item) {
          selectScene(item.scene);
          document.getElementById('inputText').value = item.text;
          updateCharCount();
          switchView('home');
          setTimeout(doTranslate, 200);
        }
      });
    });
  }

  function switchView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.dataset.view === name));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === name));
    if (name === 'history') renderHistory();
    if (name === 'favorites') renderFavorites();
    if (name === 'scenes') renderSceneGrid();
  }

  function toast(text, type) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = 'toast show ' + (type || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function updateCharCount() {
    document.getElementById('charCount').textContent = document.getElementById('inputText').value.length;
  }

  function toggleResultActions(enabled) {
    ['copyResult', 'favoriteBtn', 'shareBtn'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.disabled = !enabled;
    });
  }

  /* ==================== 主流程 ==================== */
  const state = { currentText: '', currentResult: null, currentRisk: null, currentScene: null };

  function doTranslate() {
    const text = document.getElementById('inputText').value.trim();
    if (!text) { toast('请先输入或粘贴内容', 'error'); return; }
    const scene = getCurrentScene();
    if (!scene) { toast('请先选择场景', 'error'); return; }
    const result = translate(text, scene);
    const risk = assessRisk(result, scene);
    state.currentText = text;
    state.currentResult = result;
    state.currentRisk = risk;
    state.currentScene = scene;
    renderResult(result, risk, scene);
    renderSummary(result.stats);
    toggleResultActions(true);
    updateFavoriteBtn();
    addHistory({ text, scene: scene.id, sceneName: `${scene.emoji} ${scene.name}`, stats: result.stats });
  }

  function loadExample() {
    const scene = getCurrentScene();
    if (!scene) { toast('请先选择场景', 'error'); return; }
    const exs = scene.examples || [];
    if (!exs.length) { toast('该场景暂无示例', ''); return; }
    const ex = exs[Math.floor(Math.random() * exs.length)];
    document.getElementById('inputText').value = ex;
    updateCharCount();
    setTimeout(doTranslate, 100);
    toast('已加载示例', 'success');
  }

  function formatResultAsText(text, result, scene) {
    let out = `【${scene.name}】人话翻译\n\n`;
    out += `原文：\n${text}\n\n`;
    out += `风险等级：${state.currentRisk.label}\n\n`;
    out += `解读：\n`;
    const sorted = [...result.items].sort((a, b) => {
      const o = { danger: 0, warn: 1, info: 2, ok: 3 };
      return o[a.severity] - o[b.severity];
    });
    sorted.forEach((item, i) => { out += `${i + 1}. ${item.original} → ${item.plain}\n`; });
    out += `\n— 来自「人话翻译官」`;
    return out;
  }

  async function copyResult() {
    if (!state.currentResult) return;
    const text = formatResultAsText(state.currentText, state.currentResult, state.currentScene);
    try {
      await navigator.clipboard.writeText(text);
      toast('✅ 已复制到剪贴板', 'success');
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('✅ 已复制', 'success'); }
      catch { toast('复制失败', 'error'); }
      document.body.removeChild(ta);
    }
  }

  function toggleFavorite() {
    if (!state.currentText || !state.currentScene) return;
    const fav = isFavorited(state.currentText, state.currentScene.id);
    if (fav) {
      const target = getFavorites().find(x => x.text === state.currentText && x.scene === state.currentScene.id);
      if (target) removeFavorite(target.id);
      toast('已取消收藏', '');
    } else {
      addFavorite({
        text: state.currentText,
        scene: state.currentScene.id,
        sceneName: `${state.currentScene.emoji} ${state.currentScene.name}`,
        stats: state.currentResult.stats,
        items: state.currentResult.items,
      });
      toast('⭐ 已收藏', 'success');
    }
    updateFavoriteBtn();
  }

  function updateFavoriteBtn() {
    const btn = document.getElementById('favoriteBtn');
    if (!btn || !state.currentScene) return;
    const fav = isFavorited(state.currentText, state.currentScene.id);
    btn.innerHTML = fav
      ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--warn);"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>已收藏`
      : `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>收藏`;
  }

  async function shareResult() {
    if (!state.currentResult) return;
    const text = formatResultAsText(state.currentText, state.currentResult, state.currentScene);
    if (navigator.share) {
      try { await navigator.share({ title: `人话翻译 - ${state.currentScene.name}`, text }); }
      catch (e) {}
    } else {
      try { await navigator.clipboard.writeText(text); toast('✅ 已复制（可粘贴分享）', 'success'); }
      catch { toast('分享失败', 'error'); }
    }
  }

  /* ==================== 主题 ==================== */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const btn = document.getElementById('themeToggle');
    btn.innerHTML = theme === 'dark'
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" x2="12" y1="1" y2="3"/><line x1="12" x2="12" y1="21" y2="23"/><line x1="4.22" x2="5.64" y1="4.22" y2="5.64"/><line x1="18.36" x2="19.78" y1="18.36" y2="19.78"/><line x1="1" x2="3" y1="12" y2="12"/><line x1="21" x2="23" y1="12" y2="12"/><line x1="4.22" x2="5.64" y1="19.78" y2="18.36"/><line x1="18.36" x2="19.78" y1="5.64" y2="4.22"/></svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  }

  /* ==================== 初始化 ==================== */
  function init() {
    applyTheme(getTheme());
    renderSceneChips();
    if (SCENE_LIST.length) selectScene(SCENE_LIST[0].id);
    updateCharCount();

    document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = getTheme() === 'dark' ? 'light' : 'dark';
      setTheme(next); applyTheme(next);
      toast(next === 'dark' ? '🌙 暗色模式' : '☀️ 亮色模式', 'success');
    });

    const input = document.getElementById('inputText');
    input.addEventListener('input', updateCharCount);
    input.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); doTranslate(); }
    });

    document.getElementById('translateBtn').addEventListener('click', doTranslate);
    document.getElementById('clearInput').addEventListener('click', () => {
      input.value = ''; updateCharCount();
      document.getElementById('resultBody').innerHTML = `<div class="empty-state"><div class="empty-icon">💬</div><h3>把看不懂的话粘到左边</h3><p>选择场景后点击「翻译成人话」开始</p></div>`;
      document.getElementById('summary').hidden = true;
      toggleResultActions(false);
    });
    document.getElementById('loadExample').addEventListener('click', loadExample);
    document.getElementById('copyResult').addEventListener('click', copyResult);
    document.getElementById('favoriteBtn').addEventListener('click', toggleFavorite);
    document.getElementById('shareBtn').addEventListener('click', shareResult);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  </script>
</body>
</html>
