<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互联网人格诊断书</title>
  <!-- 截图依赖：html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* ==================== 变量与重置 ==================== */
    :root {
      --paper: #fffef8;        /* 病历单纸色 */
      --bg: #f5f0e1;           /* 旧纸张背景 */
      --ink: #2b2b2b;          /* 正文墨黑 */
      --muted: #6b5e4b;        /* 次要文字 */
      --red: #c41e3a;          /* 诊断标题/印章红 */
      --brown: #8b4513;        /* 章节标题棕 */
      --border: #d4c5a8;       /* 卡片边框 */
      --dash: #b0a080;         /* 虚线边框 */
      --shadow: rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      font-family: "Courier New", Courier, "SimHei", monospace;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
      line-height: 1.6;
    }

    /* 旧纸张噪点纹理 */
    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
    }

    /* ==================== 页面切换 ==================== */
    .screen {
      display: none;
      animation: fadeIn 0.5s ease both;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== 通用卡片 ==================== */
    .card {
      background: var(--paper);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px var(--shadow);
      border-radius: 4px;
      padding: 32px 24px;
    }

    /* ==================== 欢迎页 ==================== */
    .welcome-card {
      text-align: center;
    }

    .welcome-card h1 {
      font-family: "SimSun", "Songti SC", "STSong", serif;
      color: var(--red);
      font-size: 1.9rem;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    .nickname-wrap {
      margin-bottom: 24px;
      text-align: left;
    }

    .nickname-wrap label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .nickname-wrap input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      background: #fffdf6;
      font-family: inherit;
      font-size: 1rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
    }

    .nickname-wrap input:focus {
      border-color: var(--red);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      border: none;
      font-family: "SimSun", "Songti SC", "STSong", serif;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      border-radius: 2px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
    }

    .btn-secondary {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
    }

    /* ==================== 问卷页 ==================== */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .progress-track {
      height: 4px;
      background: #e6dec8;
      border-radius: 2px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--red);
      width: 0%;
      transition: width 0.4s ease;
    }

    .question-box {
      animation: fadeIn 0.4s ease both;
    }

    .question-title {
      font-family: "SimSun", "Songti SC", "STSong", serif;
      font-size: 1.25rem;
      color: var(--ink);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #fffdf6;
      border: 1px solid var(--border);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      font-size: 0.95rem;
    }

    .option:hover {
      border-color: var(--red);
      background: #fff5f5;
    }

    .option-letter {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      line-height: 24px;
      text-align: center;
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .option-text {
      padding-top: 2px;
    }

    /* ==================== 加载页 ==================== */
    .loading-box {
      text-align: center;
      padding: 60px 24px;
    }

    .printer-text {
      display: inline-block;
      font-family: "Courier New", Courier, monospace;
      font-size: 1.05rem;
      color: var(--muted);
      min-height: 1.6em;
      border-right: 2px solid var(--muted);
      animation: blinkCaret 0.75s step-end infinite;
      white-space: pre-wrap;
      word-break: break-all;
    }

    @keyframes blinkCaret {
      0%, 100% { border-color: transparent; }
      50% { border-color: var(--muted); }
    }

    .printer-dots {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .printer-dot {
      width: 8px;
      height: 8px;
      background: var(--red);
      border-radius: 50%;
      opacity: 0.3;
      animation: dotPulse 1s ease-in-out infinite;
    }

    .printer-dot:nth-child(2) { animation-delay: 0.2s; }
    .printer-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* ==================== 结果页 ==================== */
    .result-card {
      background: var(--paper);
      border: 1px dashed var(--dash);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
      border-radius: 2px;
      padding: 28px 24px 120px;
      position: relative;
      /* 打印机"吐纸"动画 */
      animation: printSlide 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes printSlide {
      0% { opacity: 0; transform: translateY(-50px) scale(0.98); }
      60% { transform: translateY(8px) scale(1); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .result-header {
      border-bottom: 2px solid var(--red);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    .result-header h2 {
      font-family: "SimSun", "Songti SC", "STSong", serif;
      color: var(--red);
      font-size: 1.5rem;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .result-no {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .info-label {
      color: var(--muted);
    }

    .info-value {
      color: var(--ink);
      font-weight: bold;
    }

    .diagnosis-row {
      margin: 18px 0 14px;
      padding: 14px;
      background: #fff5f5;
      border-left: 4px solid var(--red);
    }

    .diagnosis-name {
      font-family: "SimSun", "Songti SC", "STSong", serif;
      font-size: 1.35rem;
      color: var(--red);
      font-weight: bold;
    }

    .severity {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 10px;
      border: 1px solid var(--red);
      color: var(--red);
      font-size: 0.78rem;
      font-family: "Courier New", Courier, monospace;
    }

    .section {
      margin-top: 16px;
    }

    .section-title {
      font-family: "SimSun", "Songti SC", "STSong", serif;
      color: var(--brown);
      font-size: 0.95rem;
      margin-bottom: 6px;
      border-left: 3px solid var(--red);
      padding-left: 8px;
    }

    .section-content {
      font-size: 0.9rem;
      color: var(--ink);
      padding-left: 11px;
    }

    .symptom-list {
      list-style: decimal inside;
      padding-left: 0;
    }

    .symptom-list li {
      margin-bottom: 4px;
    }

    .doctor-line {
      margin-top: 28px;
      font-family: "SimSun", "Songti SC", "STSong", serif;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .signature {
      font-family: "Brush Script MT", "KaiTi", cursive;
      font-size: 1.3rem;
      color: var(--ink);
      margin-left: 8px;
    }

    /* 红色印章 */
    .stamp {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 88px;
      height: 88px;
      border: 3px solid var(--red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--red);
      font-family: "SimSun", "Songti SC", "STSong", serif;
      font-weight: bold;
      font-size: 1.05rem;
      transform: rotate(-14deg);
      opacity: 0.9;
      box-shadow: inset 0 0 0 2px rgba(196, 30, 58, 0.15);
      user-select: none;
    }

    .stamp::after {
      content: "诊断专用";
    }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ==================== 响应式微调 ==================== */
    @media (max-width: 400px) {
      .welcome-card h1 { font-size: 1.6rem; }
      .question-title { font-size: 1.1rem; }
      .result-card { padding: 22px 18px 110px; }
      .stamp { width: 76px; height: 76px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <main class="app">
    <!-- ===== 欢迎页 ===== -->
    <section id="welcome" class="screen active">
      <div class="card welcome-card">
        <h1>互联网人格诊断书</h1>
        <p class="subtitle">5 分钟测试，领取你的互联网生存诊断报告</p>
        <div class="nickname-wrap">
          <label for="nickname">你的昵称（选填）</label>
          <input type="text" id="nickname" placeholder="输入昵称，留空则为匿名网友" maxlength="16">
        </div>
        <button id="startBtn" class="btn btn-primary">开始诊断</button>
      </div>
    </section>

    <!-- ===== 问卷页 ===== -->
    <section id="quiz" class="screen">
      <div class="card quiz-card">
        <div class="quiz-header">
          <span id="progressText">第 1/5 题</span>
          <span>互联网人格诊断书</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="questionBox" class="question-box">
          <h2 id="questionText" class="question-title"></h2>
          <div id="options" class="options"></div>
        </div>
      </div>
    </section>

    <!-- ===== 加载页 ===== -->
    <section id="loading" class="screen">
      <div class="card loading-box">
        <p id="loadingText" class="printer-text"></p>
        <div class="printer-dots">
          <span class="printer-dot"></span>
          <span class="printer-dot"></span>
          <span class="printer-dot"></span>
        </div>
      </div>
    </section>

    <!-- ===== 结果页 ===== -->
    <section id="result" class="screen">
      <div id="resultCard" class="result-card">
        <div class="result-header">
          <h2>互联网人格诊断中心</h2>
          <div id="diagnosisNo" class="result-no"></div>
        </div>

        <div class="info-row">
          <span class="info-label">患者</span>
          <span id="patientName" class="info-value"></span>
        </div>
        <div class="info-row">
          <span class="info-label">日期</span>
          <span id="diagnosisDate" class="info-value"></span>
        </div>

        <div class="diagnosis-row">
          <div id="diagnosisName" class="diagnosis-name"></div>
          <span id="severity" class="severity"></span>
        </div>

        <div class="section">
          <div class="section-title">症状</div>
          <div class="section-content">
            <ol id="symptomList" class="symptom-list"></ol>
          </div>
        </div>

        <div class="section">
          <div class="section-title">病因</div>
          <div id="cause" class="section-content"></div>
        </div>

        <div class="section">
          <div class="section-title">治疗方案</div>
          <div id="treatment" class="section-content"></div>
        </div>

        <div class="section">
          <div class="section-title">预后</div>
          <div id="prognosis" class="section-content"></div>
        </div>

        <div class="doctor-line">
          主治医师 Dr. 互联网
          <span class="signature">Internet</span>
        </div>

        <div class="stamp"></div>
      </div>

      <div class="actions">
        <button id="saveBtn" class="btn btn-primary">保存诊断书</button>
        <button id="retestBtn" class="btn btn-secondary">重新诊断</button>
      </div>
    </section>
  </main>

  <script>
    /* ==================== 人格数据 ==================== */
    const personalities = [
      {
        id: "emo",
        name: "深夜 emo 型冲浪选手",
        symptoms: [
          "凌晨 2 点还在刷手机",
          "白天嘻嘻哈哈，晚上网抑云",
          "收藏了 300 条\"人间清醒\"语录"
        ],
        cause: "白天情绪透支，深夜大脑开始强制复盘",
        treatment: "每晚 11 点把手机放在客厅充电，坚持 3 天",
        prognosis: "复发率 99%，建议放弃治疗，直接 emo"
      },
      {
        id: "cold",
        name: "已读不回冷面杀手",
        symptoms: [
          "消息显示已读但人间蒸发",
          "对方以为你死了，其实你在刷短视频",
          "回复间隔以天为单位"
        ],
        cause: "社交能量极低，打字需要心理建设",
        treatment: "设置自动回复\"还活着，稍后回\"，减轻心理负担",
        prognosis: "良好，但朋友数量持续下降"
      },
      {
        id: "emoji",
        name: "表情包外交大使",
        symptoms: [
          "能用表情包绝不打字",
          "收藏 5000 张表情包，分类清晰",
          "吵架时先发一个\"狗头\"保命"
        ],
        cause: "文字表达能力退化，表情包成为第二母语",
        treatment: "每周手写一段 50 字以上的文字消息",
        prognosis: "极佳，你是群聊气氛组核心"
      },
      {
        id: "ghost",
        name: "朋友圈三天可见隐士",
        symptoms: [
          "发了朋友圈 2 小时后设为私密",
          "精心 P 图 2 小时，发完 10 分钟就删",
          "半年可见是最后的体面"
        ],
        cause: "既渴望被关注，又害怕被审视",
        treatment: "发一条\"仅自己可见\"的日记，坚持 7 天",
        prognosis: "堪忧，建议直接关闭朋友圈"
      },
      {
        id: "fighter",
        name: "互联网正义喷子",
        symptoms: [
          "看到不顺眼的评论必须回复",
          "键盘战斗力爆表，现实中礼貌客气",
          "认为自己在\"整顿网络风气\""
        ],
        cause: "现实中缺乏表达渠道，网络成为情绪出口",
        treatment: "每次想评论时，先深呼吸 10 秒，问自己\"这关我什么事\"",
        prognosis: "良好，但需终身服药（断网）"
      },
      {
        id: "liker",
        name: "点赞狂魔",
        symptoms: [
          "朋友圈逢赞必点",
          "给三年没联系的人点赞",
          "连\"今天吃了碗面\"都点"
        ],
        cause: "用点赞维持最低成本的社交存在感",
        treatment: "尝试点一个\"踩\"（如果平台支持的话）",
        prognosis: "极佳，你是互联网和平使者"
      },
      {
        id: "screenshot",
        name: "截图传播者",
        symptoms: [
          "任何对话都要截图保存",
          "聊天记录是你的情报库",
          "家族群里的\"震惊体\"文章是你转的"
        ],
        cause: "信息焦虑，害怕错过任何瓜",
        treatment: "删除相册里 6 个月前的截图，释放内存和空间",
        prognosis: "良好，但手机存储空间持续告急"
      },
      {
        id: "lurker",
        name: "潜水万年老粉",
        symptoms: [
          "群聊 1000 条消息从不发言",
          "但每条都看了",
          "知道所有人的八卦，但没人知道你存在"
        ],
        cause: "极致的旁观者心态，享受\"隐身\"的安全感",
        treatment: "在一个群里发一个\"哈哈\"，打破 0 发言记录",
        prognosis: "极佳，互联网因你而安静"
      }
    ];

    /* ==================== 题目数据 ==================== */
    const questions = [
      {
        text: "收到朋友消息，你通常？",
        options: [
          { letter: "A", text: "秒回，手速比脑子快", type: "liker" },
          { letter: "B", text: "已读不回，等对方再发一条", type: "cold" },
          { letter: "C", text: "截图发群，和闺蜜/兄弟一起分析", type: "screenshot" },
          { letter: "D", text: "意念回复，三天后才想起来", type: "lurker" }
        ]
      },
      {
        text: "刷到一条很离谱的谣言，你会？",
        options: [
          { letter: "A", text: "立刻转发家族群提醒爸妈", type: "screenshot" },
          { letter: "B", text: "默默划走，不关我事", type: "lurker" },
          { letter: "C", text: "写一段长文有理有据反驳", type: "fighter" },
          { letter: "D", text: "点举报，然后继续刷", type: "liker" }
        ]
      },
      {
        text: "你的朋友圈状态是？",
        options: [
          { letter: "A", text: "日更三条，生活全记录", type: "emoji" },
          { letter: "B", text: "三天可见，偶尔发一条", type: "ghost" },
          { letter: "C", text: "半年可见，内容全是转发", type: "lurker" },
          { letter: "D", text: "从不发，但天天看别人的", type: "cold" }
        ]
      },
      {
        text: "和朋友吵架了，你会？",
        options: [
          { letter: "A", text: "疯狂发 60 秒语音方阵", type: "emoji" },
          { letter: "B", text: "冷处理，等对方先道歉", type: "cold" },
          { letter: "C", text: "写一段网易云式伤感文字发朋友圈", type: "emo" },
          { letter: "D", text: "假装无事，继续发表情包", type: "ghost" }
        ]
      },
      {
        text: "深夜 12 点，你在？",
        options: [
          { letter: "A", text: "在各个 App 之间反复横跳", type: "emo" },
          { letter: "B", text: "给三天前的消息统一回复", type: "liker" },
          { letter: "C", text: "在评论区和陌生人对线", type: "fighter" },
          { letter: "D", text: "打开相册 P 三年前的照片准备发", type: "ghost" }
        ]
      }
    ];

    /* ==================== 状态变量 ==================== */
    let nickname = "";
    let currentQuestionIndex = 0;
    let scores = {};

    /* ==================== DOM 元素 ==================== */
    const welcomeScreen = document.getElementById("welcome");
    const quizScreen = document.getElementById("quiz");
    const loadingScreen = document.getElementById("loading");
    const resultScreen = document.getElementById("result");

    const nicknameInput = document.getElementById("nickname");
    const startBtn = document.getElementById("startBtn");

    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const questionBox = document.getElementById("questionBox");
    const questionText = document.getElementById("questionText");
    const optionsContainer = document.getElementById("options");

    const loadingText = document.getElementById("loadingText");

    const resultCard = document.getElementById("resultCard");
    const diagnosisNo = document.getElementById("diagnosisNo");
    const patientName = document.getElementById("patientName");
    const diagnosisDate = document.getElementById("diagnosisDate");
    const diagnosisName = document.getElementById("diagnosisName");
    const severityEl = document.getElementById("severity");
    const symptomList = document.getElementById("symptomList");
    const causeEl = document.getElementById("cause");
    const treatmentEl = document.getElementById("treatment");
    const prognosisEl = document.getElementById("prognosis");

    const saveBtn = document.getElementById("saveBtn");
    const retestBtn = document.getElementById("retestBtn");

    /* ==================== 工具函数 ==================== */
    function showScreen(screenEl) {
      [welcomeScreen, quizScreen, loadingScreen, resultScreen].forEach(s => s.classList.remove("active"));
      screenEl.classList.add("active");
    }

    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      return `${y}年${m}月${d}日`;
    }

    function getDiagnosisNo() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, "0");
      const d = String(now.getDate()).padStart(2, "0");
      const serial = String(Math.floor(Math.random() * 900) + 100); // 100-999
      return `No.${y}${m}${d}-${serial}`;
    }

    function getSeverityText(maxScore) {
      if (maxScore >= 3) return "重度";
      if (maxScore === 2) return "中度";
      return "轻度";
    }

    /* ==================== 欢迎页 ==================== */
    startBtn.addEventListener("click", () => {
      const raw = nicknameInput.value.trim();
      nickname = raw || "匿名网友";
      currentQuestionIndex = 0;
      scores = {};
      showScreen(quizScreen);
      renderQuestion();
    });

    /* ==================== 问卷页 ==================== */
    function renderQuestion() {
      const q = questions[currentQuestionIndex];

      // 进度更新
      progressText.textContent = `第 ${currentQuestionIndex + 1}/5 题`;
      progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;

      // 先移除动画类，触发重排后再加入，实现每次淡入
      questionBox.classList.remove("fade-in");
      void questionBox.offsetWidth;

      questionText.textContent = q.text;
      optionsContainer.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerHTML = `
          <span class="option-letter">${opt.letter}</span>
          <span class="option-text">${opt.text}</span>
        `;
        btn.addEventListener("click", () => selectOption(opt.type));
        optionsContainer.appendChild(btn);
      });

      questionBox.classList.add("fade-in");
    }

    function selectOption(type) {
      // 记分
      scores[type] = (scores[type] || 0) + 1;

      // 禁用选项，防止快速连点
      const buttons = optionsContainer.querySelectorAll(".option");
      buttons.forEach(b => b.disabled = true);

      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        setTimeout(renderQuestion, 260);
      } else {
        setTimeout(showLoading, 260);
      }
    }

    /* ==================== 加载页（打字机） ==================== */
    function showLoading() {
      showScreen(loadingScreen);
      const text = "正在分析你的互联网生存数据...";
      loadingText.textContent = "";
      let i = 0;
      const step = Math.floor(2000 / text.length); // 约 2 秒打完

      const timer = setInterval(() => {
        if (i < text.length) {
          loadingText.textContent += text.charAt(i);
          i++;
        } else {
          clearInterval(timer);
          // 打完后再停顿约 300ms 进入结果
          setTimeout(showResult, 300);
        }
      }, step);
    }

    /* ==================== 结果页 ==================== */
    function showResult() {
      // 计算得分最高的人格；并列时取数组中靠前（ID 较小）者
      let best = personalities[0];
      let maxScore = scores[best.id] || 0;

      for (let i = 1; i < personalities.length; i++) {
        const p = personalities[i];
        const s = scores[p.id] || 0;
        if (s > maxScore) {
          best = p;
          maxScore = s;
        }
      }

      // 填充诊断书
      diagnosisNo.textContent = getDiagnosisNo();
      patientName.textContent = "@" + nickname;
      diagnosisDate.textContent = getTodayString();
      diagnosisName.textContent = best.name;
      severityEl.textContent = getSeverityText(maxScore);

      symptomList.innerHTML = best.symptoms.map(s => `<li>${s}</li>`).join("");
      causeEl.textContent = best.cause;
      treatmentEl.textContent = best.treatment;
      prognosisEl.textContent = best.prognosis;

      // 重置动画：移除后再加入，保证重测时动画能再次触发
      resultCard.style.animation = "none";
      void resultCard.offsetWidth;
      resultCard.style.animation = "";

      showScreen(resultScreen);
    }

    /* ==================== 保存截图 ==================== */
    saveBtn.addEventListener("click", async () => {
      if (typeof html2canvas !== "function") {
        alert("截图工具加载失败，请检查网络后重试。");
        return;
      }

      try {
        const canvas = await html2canvas(resultCard, {
          scale: 2,
          backgroundColor: "#fffef8",
          useCORS: true
        });

        const link = document.createElement("a");
        link.download = `互联网人格诊断书_${nickname}_${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (err) {
        console.error(err);
        alert("保存失败，请重试。");
      }
    });

    /* ==================== 重新诊断 ==================== */
    retestBtn.addEventListener("click", () => {
      nicknameInput.value = "";
      nickname = "";
      currentQuestionIndex = 0;
      scores = {};
      showScreen(welcomeScreen);
    });
  </script>
</body>
</html>
