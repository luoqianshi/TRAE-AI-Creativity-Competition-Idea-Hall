<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>当前地址天气</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { margin-top: 0; font-size: 24px; }
        #status { font-size: 16px; margin-bottom: 20px; min-height: 24px; }
        .weather-info { display: none; }
        .temp { font-size: 48px; font-weight: bold; margin: 10px 0; }
        .desc { font-size: 20px; text-transform: capitalize; margin-bottom: 20px; opacity: 0.9; }
        .details { display: flex; justify-content: space-around; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; }
        .detail-item { text-align: center; }
        .detail-item span { display: block; font-size: 14px; opacity: 0.7; margin-bottom: 5px; }
        .error { color: #ffcccc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="weather-card">
        <h1>📍 我的当前位置天气</h1>
        <p id="status">正在获取您的位置...</p>
        
        <div id="weather-info" class="weather-info">
            <h2 id="city-name">--</h2>
            <div class="temp" id="temperature">--°C</div>
            <div class="desc" id="description">--</div>
            <div class="details">
                <div class="detail-item">
                    <span>湿度</span>
                    <strong id="humidity">--%</strong>
                </div>
                <div class="detail-item">
                    <span>风速</span>
                    <strong id="wind-speed">-- m/s</strong>
                </div>
                <div class="detail-item">
                    <span>体感温度</span>
                    <strong id="feels-like">--°C</strong>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 请将此处替换为你自己的 OpenWeatherMap API Key
        // 免费注册获取地址: https://openweathermap.org/api
        const API_KEY = 'YOUR_API_KEY_HERE'; 

        const statusEl = document.getElementById('status');
        const weatherInfoEl = document.getElementById('weather-info');
        const cityNameEl = document.getElementById('city-name');
        const temperatureEl = document.getElementById('temperature');
        const descriptionEl = document.getElementById('description');
        const humidityEl = document.getElementById('humidity');
        const windSpeedEl = document.getElementById('wind-speed');
        const feelsLikeEl = document.getElementById('feels-like');

        function showError(message) {
            statusEl.textContent = message;
            statusEl.classList.add('error');
        }

        function showWeather(data) {
            statusEl.style.display = 'none';
            weatherInfoEl.style.display = 'block';

            // ⚠️ 安全提示：一律使用 textContent 赋值，避免使用 innerHTML 拼接导致 XSS 漏洞
            cityNameEl.textContent = data.name || '未知地区';
            temperatureEl.textContent = `${Math.round(data.main.temp)}°C`;
            descriptionEl.textContent = data.weather[0].description; // 必须加索引，weather是数组
            humidityEl.textContent = `${data.main.humidity}%`;
            windSpeedEl.textContent = `${data.wind.speed} m/s`;
            feelsLikeEl.textContent = `${Math.round(data.main.feels_like)}°C`;
        }

        async function fetchWeather(lat, lon) {
            statusEl.textContent = '正在获取天气数据...';
            // units=metric 返回摄氏度，lang=zh_cn 返回中文描述
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=zh_cn`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    if (response.status === 401) throw new Error('API Key 无效或未生效（新Key可能需等几分钟）');
                    throw new Error(`HTTP 错误: ${response.status}`);
                }
                const data = await response.json();
                showWeather(data);
            } catch (error) {
                showError(`获取天气失败: ${error.message}`);
            }
        }

        function handleLocationError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    showError('您拒绝了地理位置请求，请在浏览器设置中允许获取位置。');
                    break;
                case error.POSITION_UNAVAILABLE:
                    showError('位置信息不可用，请检查网络或GPS。');
                    break;
                case error.TIMEOUT:
                    showError('获取位置超时，请刷新重试。');
                    break;
                default:
                    showError('获取位置时发生未知错误。');
                    break;
            }
        }

        // 页面加载后初始化
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    fetchWeather(position.coords.latitude, position.coords.longitude);
                },
                handleLocationError,
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        } else {
            showError('您的浏览器不支持地理位置功能。');
        }
    </script>
</body>
</html>
