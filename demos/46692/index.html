<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadFlow 智读伴侣 - AI学习助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
            color: white;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section label {
            display: block;
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 10px;
            color: #555;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1em;
            resize: vertical;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border-left: 4px solid #667eea;
        }

        .result-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .result-card p, .result-card ul {
            color: #555;
            line-height: 1.6;
        }

        .result-card ul {
            padding-left: 20px;
        }

        .result-card li {
            margin-bottom: 5px;
        }

        .flashcards-section {
            margin-top: 30px;
        }

        .flashcards-section h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .flashcards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .flashcard {
            height: 180px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .flashcard-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 1.1em;
        }

        .flashcard-back {
            background: white;
            color: #333;
            transform: rotateY(180deg);
            border: 2px solid #667eea;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .progress-section {
            margin-top: 30px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 1s ease;
            width: 0%;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            margin: 3px;
        }

        .sample-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 20px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .sample-btn:hover {
            background: #667eea;
            color: white;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.7);
        }

        @media (max-width: 768px) {
            header h1 { font-size: 1.8em; }
            .result-grid { grid-template-columns: 1fr; }
            .flashcards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ReadFlow 智读伴侣</h1>
            <p>AI驱动的智能阅读与学习助手，让知识吸收更高效</p>
        </header>

        <div class="main-card">
            <div class="input-section">
                <label>
                    粘贴你的学习资料（论文、文章、笔记等）
                    <button class="btn sample-btn" onclick="loadSample()">加载示例</button>
                </label>
                <textarea id="inputText" placeholder="在此粘贴文本内容，ReadFlow将自动为你提取摘要、关键概念，并生成知识卡片..."></textarea>
                <button class="btn" id="analyzeBtn" onclick="analyzeText()">开始智能分析</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>AI正在分析内容，提取知识要点...</p>
            </div>

            <div class="results-section" id="results">
                <div class="result-grid">
                    <div class="result-card">
                        <h3>📋 智能摘要</h3>
                        <p id="summary">-</p>
                    </div>
                    <div class="result-card">
                        <h3>🔑 关键词</h3>
                        <div id="keywords">-</div>
                    </div>
                    <div class="result-card">
                        <h3>📊 内容分析</h3>
                        <ul id="analysis">
                            <li>-</li>
                        </ul>
                    </div>
                    <div class="result-card">
                        <h3>💡 核心概念</h3>
                        <ul id="concepts">
                            <li>-</li>
                        </ul>
                    </div>
                </div>

                <div class="flashcards-section">
                    <h2>🎴 知识卡片（点击翻转复习）</h2>
                    <div class="flashcards-grid" id="flashcards"></div>
                </div>

                <div class="progress-section">
                    <h3>📈 学习进度</h3>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="stats">
                        <div class="stat-item">
                            <div class="stat-value" id="statConcepts">0</div>
                            <div class="stat-label">核心概念</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statCards">0</div>
                            <div class="stat-label">知识卡片</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statTime">0</div>
                            <div class="stat-label">预计学习(分钟)</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>ReadFlow 智读伴侣 - TRAE AI 创造力大赛 Demo | 学习工作赛道</p>
        </footer>
    </div>

    <script>
        const sampleText = `深度学习是机器学习的一个子领域，它基于人工神经网络，特别是深层神经网络。深度学习的核心思想是通过多层非线性变换来自动学习数据的层次化表示。

神经网络由输入层、隐藏层和输出层组成。每一层包含多个神经元，神经元之间通过权重连接。训练过程中，网络通过反向传播算法调整权重，以最小化预测误差。

卷积神经网络（CNN）是深度学习的重要架构之一，特别适用于图像处理。它通过卷积层提取图像的局部特征，池化层降低特征维度，全连接层进行分类。

循环神经网络（RNN）则擅长处理序列数据，如文本和语音。LSTM和GRU是RNN的改进版本，通过门控机制解决了长期依赖问题。

Transformer架构引入了自注意力机制，能够并行处理序列数据，成为现代自然语言处理的基础。BERT、GPT等预训练模型都基于Transformer。`;

        function loadSample() {
            document.getElementById('inputText').value = sampleText;
        }

        function analyzeText() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                alert('请先输入文本内容');
                return;
            }

            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            btn.disabled = true;
            results.classList.remove('active');
            loading.classList.add('active');

            setTimeout(() => {
                const analysisResult = simulateAIAnalysis(text);
                displayResults(analysisResult);
                loading.classList.remove('active');
                results.classList.add('active');
                btn.disabled = false;

                // Animate progress
                setTimeout(() => {
                    document.getElementById('progressFill').style.width = '65%';
                }, 300);
            }, 2000);
        }

        function simulateAIAnalysis(text) {
            const sentences = text.split(/[。！？.!?]/).filter(s => s.trim().length > 5);
            const words = text.match(/[\u4e00-\u9fa5]+|[a-zA-Z]+/g) || [];

            // Extract key concepts (words that appear multiple times or are proper nouns)
            const conceptCandidates = [
                '深度学习', '神经网络', '机器学习', '卷积神经网络', 'CNN',
                '循环神经网络', 'RNN', 'LSTM', 'GRU', 'Transformer',
                '自注意力机制', 'BERT', 'GPT', '预训练模型', '反向传播'
            ];

            const foundConcepts = conceptCandidates.filter(c => text.includes(c));

            // Generate summary from first few sentences
            const summary = sentences.slice(0, 2).join('。') + '。';

            // Extract keywords
            const keywords = foundConcepts.slice(0, 6);
            if (keywords.length < 4) {
                keywords.push('人工智能', '算法', '模型训练');
            }

            // Create flashcards from concepts
            const flashcardData = [
                { q: '什么是深度学习？', a: '机器学习的一个子领域，基于深层神经网络，通过多层非线性变换自动学习数据的层次化表示。' },
                { q: 'CNN的主要用途是什么？', a: '卷积神经网络特别适用于图像处理，通过卷积层提取局部特征。' },
                { q: 'RNN适合处理什么数据？', a: '循环神经网络擅长处理序列数据，如文本和语音。' },
                { q: 'LSTM解决了什么问题？', a: '通过门控机制解决了传统RNN的长期依赖问题。' },
                { q: 'Transformer的核心创新是什么？', a: '引入了自注意力机制，能够并行处理序列数据。' },
                { q: 'BERT和GPT基于什么架构？', a: '都基于Transformer架构，是现代自然语言处理的基础。' }
            ];

            return {
                summary: summary || '本文介绍了深度学习的基本概念和主要架构。',
                keywords: keywords.slice(0, 5),
                concepts: foundConcepts.length > 0 ? foundConcepts : ['深度学习', '神经网络', '机器学习'],
                analysis: [
                    `文本长度: ${text.length} 字符`,
                    `句子数量: ${sentences.length} 句`,
                    `核心概念: ${foundConcepts.length} 个`,
                    `内容类型: ${foundConcepts.length > 3 ? '专业学术' : '科普入门'}`
                ],
                flashcards: flashcardData
            };
        }

        function displayResults(data) {
            document.getElementById('summary').textContent = data.summary;

            const keywordsHtml = data.keywords.map(k => `<span class="tag">${k}</span>`).join('');
            document.getElementById('keywords').innerHTML = keywordsHtml;

            document.getElementById('analysis').innerHTML = data.analysis.map(a => `<li>${a}</li>`).join('');
            document.getElementById('concepts').innerHTML = data.concepts.map(c => `<li>${c}</li>`).join('');

            const flashcardsContainer = document.getElementById('flashcards');
            flashcardsContainer.innerHTML = data.flashcards.map((card, i) => `
                <div class="flashcard" onclick="this.classList.toggle('flipped')">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">${card.q}</div>
                        <div class="flashcard-back">${card.a}</div>
                    </div>
                </div>
            `).join('');

            // Update stats
            document.getElementById('statConcepts').textContent = data.concepts.length;
            document.getElementById('statCards').textContent = data.flashcards.length;
            document.getElementById('statTime').textContent = Math.ceil(data.flashcards.length * 3);
        }
    </script>
</body>
</html>
