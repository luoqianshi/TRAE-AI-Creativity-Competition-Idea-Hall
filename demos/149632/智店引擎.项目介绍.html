    }
    function setEstimatedQuantity(variantId, value) { store.setEstimatedQuantity(variantId, parseInt(value) || 0); renderApp(); }
    function setRemainingQuantity(variantId, value) { store.setRemainingQuantity(variantId, parseInt(value) || 0); renderApp(); }
    function adjustEstimated(variantId, delta) { store.adjustEstimated(variantId, delta); renderApp(); }
    function adjustRemaining(variantId, delta) { store.adjustRemaining(variantId, delta); renderApp(); }
    function handleDailyForecast(variantId, date, value) { store.setDailyForecast(variantId, date, parseInt(value) || 0); }
    function setProductionDept(dept) { window.productionDept = dept; renderApp(); }
    function toggleProductionForecast() { window.showProductionForecast = !window.showProductionForecast; renderApp(); }
    function showAddCategoryModal() { window.showAddCategory = true; renderApp(); }
    function addCategory() {
      const name = document.getElementById('new-category-name').value.trim();
      if (name) { store.addCategory(name); window.showAddCategory = false; renderApp(); }
    }
    function editRecipe(recipeId) { window.editingRecipeId = recipeId; renderApp(); }
    function saveRecipe() {
      if (!window.editingRecipeId) return;
      const name = document.getElementById('edit-recipe-name').value;
      const shelfLife = parseInt(document.getElementById('edit-recipe-shelf-life').value) || 0;
      const output = parseInt(document.getElementById('edit-recipe-output').value) || 0;
      store.updateRecipe(window.editingRecipeId, { name, shelfLifeHours: shelfLife, standardOutput: output });
      window.editingRecipeId = null; renderApp();
    }
    function setInventoryTab(tab) { window.inventoryTab = tab; renderApp(); }
    function toggleSemiDept(dept) {
      if (!window.hiddenSemiDepts) window.hiddenSemiDepts = [];
      if (window.hiddenSemiDepts.includes(dept)) window.hiddenSemiDepts = window.hiddenSemiDepts.filter(d => d !== dept);
      else window.hiddenSemiDepts.push(dept);
      renderApp();
    }
    function toggleForecastDept(dept) {
      if (!window.expandedForecastDepts) window.expandedForecastDepts = [];
      if (window.expandedForecastDepts.includes(dept)) window.expandedForecastDepts = window.expandedForecastDepts.filter(d => d !== dept);
      else window.expandedForecastDepts.push(dept);
      renderApp();
    }
    function adjustRawInventory(materialId, delta) {
      const inv = store.state.rawInventory.find(i => i.materialId === materialId);
      if (inv) { store.updateRawInventory(materialId, inv.quantity + delta); renderApp(); }
    }
    function adjustSemiInventory(semiProductId, delta) {
      const inv = store.state.semiInventory.find(i => i.semiProductId === semiProductId);
      if (inv) { store.updateSemiInventory(semiProductId, inv.quantity + delta); renderApp(); }
    }
    function toggleWidgetConfig() { window.widgetConfigOpen = !window.widgetConfigOpen; renderApp(); }
    function handleToggleWidget(widgetId) { store.toggleWidgetVisibility(widgetId); renderApp(); }
    function handleWidgetReorder(widgetId, newOrder) { store.reorderWidgets(widgetId, parseInt(newOrder)); renderApp(); }
    document.addEventListener('DOMContentLoaded', () => renderApp());
  </script>
</body>
</html>
