<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能源动力工程 — 在线考试系统</title>
<style>
/* ========== Reset & Variables ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0ea884;--primary-dark:#09856a;--primary-light:#14c9a0;
  --accent:#00b4d8;--accent-dark:#0096c7;
  --bg:#0a0e13;--bg-card:#121820;--bg-card-hover:#18202c;
  --text:#e0e8f0;--text-muted:#8899aa;--text-dim:#556677;
  --success:#2ecc71;--danger:#e74c3c;--warning:#f39c12;
  --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --shadow-md:0 4px 20px rgba(0,0,0,.4);
  --shadow-lg:0 8px 40px rgba(0,0,0,.5);
  --shadow-glow:0 0 30px rgba(14,168,132,.15);
  --radius-sm:8px;--radius:14px;--radius-lg:20px;
  --ease-out:cubic-bezier(.25,.46,.45,.94);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
  --font-mono:'JetBrains Mono','Fira Code',monospace;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  overflow-x:hidden;line-height:1.6;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(14,168,132,.08),transparent),
              radial-gradient(ellipse 60% 50% at 100% 80%,rgba(0,180,216,.06),transparent);
  pointer-events:none;z-index:0;
}

/* ========== Scrollbar ========== */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text-dim);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

/* ========== BGM Player ========== */
.bgm-player{
  position:fixed;top:16px;right:16px;z-index:1000;
  display:flex;align-items:center;gap:8px;
  background:var(--bg-card);border:1px solid rgba(255,255,255,.08);
  border-radius:30px;padding:6px 16px 6px 6px;
  box-shadow:var(--shadow-md);backdrop-filter:blur(12px);
  transition:all .3s var(--ease-out);
}
.bgm-player:hover{border-color:var(--primary);box-shadow:var(--shadow-glow)}
.bgm-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s var(--ease-bounce),box-shadow .2s;
  position:relative;overflow:hidden;
}
.bgm-btn:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(14,168,132,.4)}
.bgm-btn:active{transform:scale(.94)}
.bgm-btn.paused{background:var(--text-dim)}
.bgm-label{font-size:12px;color:var(--text-muted);white-space:nowrap}
.bgm-vol{width:60px;accent-color:var(--primary);cursor:pointer}

/* ========== Screens ========== */
.screen{display:none;position:relative;z-index:1;min-height:100vh}
.screen.active{display:block;animation:fadeSlideIn .45s var(--ease-out)}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes ripple{
  to{transform:scale(4);opacity:0}
}
@keyframes countUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{
  0%{background-position:-200% center}100%{background-position:200% center}
}
@keyframes cardEnter{
  from{opacity:0;transform:translateY(24px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* ========== Container ========== */
.container{max-width:860px;margin:0 auto;padding:40px 20px}

/* ========== HOME Screen ========== */
.home-header{text-align:center;padding:60px 0 40px}
.home-header .logo{
  width:72px;height:72px;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:inline-flex;align-items:center;justify-content:center;
  font-size:32px;margin-bottom:20px;
  box-shadow:0 8px 32px rgba(14,168,132,.25);
  animation:pulse 2s ease-in-out infinite;
}
.home-header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--primary-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.home-header .subtitle{color:var(--text-muted);font-size:.95rem}

.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:40px}
.subject-card{
  background:var(--bg-card);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius-lg);padding:32px 24px;
  cursor:pointer;transition:all .35s var(--ease-out);position:relative;
  overflow:hidden;text-align:center;
}
.subject-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg),var(--shadow-glow);border-color:var(--primary)}
.subject-card:active{transform:scale(.98)}
.subject-card .icon{font-size:40px;margin-bottom:12px;transition:transform .3s var(--ease-bounce)}
.subject-card:hover .icon{transform:scale(1.15)}
.subject-card h3{font-size:1.2rem;margin-bottom:6px;color:var(--text)}
.subject-card .count{font-size:.85rem;color:var(--text-muted)}
.subject-card .bar{
  position:absolute;bottom:0;left:0;height:3px;
  border-radius:0 3px 0 0;transition:width .4s var(--ease-out);
}
.subject-card .bar.red{background:linear-gradient(90deg,#e74c3c,#ff6b6b);width:30%}
.subject-card .bar.orange{background:linear-gradient(90deg,#f39c12,#ffa502);width:30%}
.subject-card .bar.teal{background:linear-gradient(90deg,#1abc9c,#00d2d3);width:30%}
.subject-card:hover .bar{width:100%}

/* ========== QUIZ Screen ========== */
.quiz-topbar{
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;padding:16px 20px;
  background:var(--bg-card);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius);margin-bottom:24px;
  box-shadow:var(--shadow-sm);position:sticky;top:16px;z-index:10;
  backdrop-filter:blur(8px);
}
.quiz-topbar .subject-badge{
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;padding:6px 14px;border-radius:20px;font-size:.85rem;font-weight:600;
}
.quiz-topbar .timer{
  font-family:var(--font-mono);font-size:1.3rem;font-weight:700;
  color:var(--accent);display:flex;align-items:center;gap:6px;
}
.quiz-topbar .timer.warning{color:var(--warning);animation:pulse 1s ease-in-out infinite}
.quiz-topbar .timer.danger{color:var(--danger);animation:pulse .6s ease-in-out infinite}
.quiz-topbar .progress-text{color:var(--text-muted);font-size:.85rem}

.question-card{
  background:var(--bg-card);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius-lg);padding:28px;margin-bottom:20px;
  box-shadow:var(--shadow-md);transition:all .3s;
  animation:cardEnter .4s var(--ease-out);
}
.question-card .q-type{
  display:inline-block;padding:4px 12px;border-radius:12px;
  font-size:.75rem;font-weight:600;margin-bottom:12px;
  letter-spacing:.5px;
}
.q-type.single{background:rgba(14,168,132,.2);color:var(--primary-light)}
.q-type.fill{background:rgba(0,180,216,.2);color:var(--accent)}
.q-type.judge{background:rgba(243,156,18,.2);color:var(--warning)}
.q-type.essay{background:rgba(46,204,113,.2);color:var(--success)}
.question-card .q-text{font-size:1.1rem;line-height:1.7;margin-bottom:20px;font-weight:500}

/* Options */
.options-list{display:flex;flex-direction:column;gap:10px}
.option-item{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.08);
  border-radius:var(--radius);cursor:pointer;
  transition:all .25s var(--ease-out);position:relative;overflow:hidden;
}
.option-item:hover{background:rgba(14,168,132,.08);border-color:var(--primary);}
.option-item.selected{background:rgba(14,168,132,.15);border-color:var(--primary-light);box-shadow:0 0 16px rgba(14,168,132,.1)}
.option-item.correct{background:rgba(46,204,113,.12);border-color:var(--success)}
.option-item.wrong{background:rgba(231,76,60,.12);border-color:var(--danger)}
.option-item .opt-letter{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.06);display:flex;
  align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;flex-shrink:0;
  transition:all .25s;
}
.option-item.selected .opt-letter{background:var(--primary);color:#fff}
.option-item.correct .opt-letter{background:var(--success);color:#fff}
.option-item.wrong .opt-letter{background:var(--danger);color:#fff}

/* Fill input */
.fill-input{
  width:100%;padding:14px 18px;border:1.5px solid rgba(255,255,255,.1);
  border-radius:var(--radius);background:rgba(255,255,255,.04);color:var(--text);
  font-size:1rem;transition:all .3s;font-family:inherit;
}
.fill-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,168,132,.12)}
.fill-input.correct{border-color:var(--success)}
.fill-input.wrong{border-color:var(--danger)}

/* Essay textarea */
.essay-textarea{
  width:100%;padding:14px 18px;border:1.5px solid rgba(255,255,255,.1);
  border-radius:var(--radius);background:rgba(255,255,255,.04);color:var(--text);
  font-size:1rem;min-height:120px;resize:vertical;font-family:inherit;line-height:1.6;
  transition:all .3s;
}
.essay-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,168,132,.12)}

/* Judge buttons */
.judge-btns{display:flex;gap:12px}
.judge-btn{
  flex:1;padding:16px;border:2px solid rgba(255,255,255,.1);
  border-radius:var(--radius);background:rgba(255,255,255,.03);
  color:var(--text);font-size:1.1rem;font-weight:600;cursor:pointer;
  transition:all .25s var(--ease-out);text-align:center;
}
.judge-btn:hover{border-color:var(--primary);background:rgba(14,168,132,.06)}
.judge-btn.selected{border-color:var(--primary-light);background:rgba(14,168,132,.15);box-shadow:0 0 16px rgba(14,168,132,.1)}
.judge-btn.correct{border-color:var(--success);background:rgba(46,204,113,.12)}
.judge-btn.wrong{border-color:var(--danger);background:rgba(231,76,60,.12)}

/* Quiz nav */
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:12px}
.btn{
  padding:12px 28px;border:none;border-radius:30px;font-size:.95rem;
  font-weight:600;cursor:pointer;transition:all .25s var(--ease-out);
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:0 4px 16px rgba(14,168,132,.3)}
.btn-primary:hover{box-shadow:0 6px 24px rgba(14,168,132,.45);transform:translateY(-1px)}
.btn-secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)}
.btn-secondary:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#c0392b);color:#fff;box-shadow:0 4px 16px rgba(231,76,60,.3)}
.btn-danger:hover{box-shadow:0 6px 24px rgba(231,76,60,.45)}

/* Ripple */
.ripple-effect{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}

/* ========== Answer Card ========== */
.answer-card-toggle{
  display:flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:20px;background:var(--bg-card);border:1px solid rgba(255,255,255,.08);
  color:var(--text-muted);cursor:pointer;font-size:.85rem;transition:all .25s;
}
.answer-card-toggle:hover{border-color:var(--primary);color:var(--text)}
.answer-card-panel{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));
  gap:8px;padding:16px;background:var(--bg-card);
  border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);
  margin-bottom:20px;box-shadow:var(--shadow-md);
  animation:slideUp .3s var(--ease-out);
  max-height:300px;overflow-y:auto;
}
.answer-card-panel.hidden{display:none}
.ac-dot{
  width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;
  color:var(--text-muted);
}
.ac-dot:hover{border-color:var(--primary);color:var(--text)}
.ac-dot.current{border-color:var(--primary);background:rgba(14,168,132,.2);color:var(--primary-light)}
.ac-dot.answered{background:rgba(14,168,132,.25);border-color:var(--primary);color:#fff}
.ac-dot.correct-dot{background:var(--success);border-color:var(--success);color:#fff}
.ac-dot.wrong-dot{background:var(--danger);border-color:var(--danger);color:#fff}

/* ========== RESULT Screen ========== */
.result-header{text-align:center;padding:40px 0 30px}
.result-score{
  font-family:var(--font-mono);font-size:4rem;font-weight:800;
  background:linear-gradient(135deg,var(--primary-light),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:countUp .6s var(--ease-out);
}
.result-label{color:var(--text-muted);font-size:1rem;margin-top:4px}
.result-grade{
  display:inline-block;padding:6px 20px;border-radius:20px;font-weight:700;margin-top:12px;font-size:.9rem;
}
.grade-a{background:rgba(46,204,113,.2);color:var(--success)}
.grade-b{background:rgba(14,168,132,.2);color:var(--primary-light)}
.grade-c{background:rgba(243,156,18,.2);color:var(--warning)}
.grade-d{background:rgba(231,76,60,.2);color:var(--danger)}

/* Chart */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:30px 0}
.stat-card{
  background:var(--bg-card);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius);padding:20px;text-align:center;
  box-shadow:var(--shadow-sm);transition:all .3s;
  animation:cardEnter .4s var(--ease-out);
}
.stat-card:nth-child(1){animation-delay:.1s}
.stat-card:nth-child(2){animation-delay:.2s}
.stat-card:nth-child(3){animation-delay:.3s}
.stat-card:nth-child(4){animation-delay:.4s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card .stat-num{font-size:2rem;font-weight:700;font-family:var(--font-mono)}
.stat-card .stat-label{color:var(--text-muted);font-size:.82rem;margin-top:4px}
.stat-card.correct .stat-num{color:var(--success)}
.stat-card.wrong .stat-num{color:var(--danger)}
.stat-card.rate .stat-num{color:var(--accent)}
.stat-card.time .stat-num{color:var(--primary-light)}

.chart-container{
  background:var(--bg-card);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--radius-lg);padding:24px;margin:20px 0;
  box-shadow:var(--shadow-md);
}
.chart-container h3{font-size:1rem;color:var(--text-muted);margin-bottom:16px;font-weight:500}
.chart-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.chart-row .chart-label{width:60px;font-size:.85rem;color:var(--text-muted);text-align:right;flex-shrink:0}
.chart-row .chart-bar-wrap{flex:1;height:24px;background:rgba(255,255,255,.04);border-radius:12px;overflow:hidden;position:relative}
.chart-row .chart-bar{
  height:100%;border-radius:12px;transition:width .8s var(--ease-out);
  display:flex;align-items:center;justify-content:flex-end;padding-right:10px;
  font-size:.75rem;font-weight:600;color:#fff;min-width:fit-content;
}
.chart-bar.correct-bar{background:linear-gradient(90deg,var(--success),#27ae60)}
.chart-bar.wrong-bar{background:linear-gradient(90deg,var(--danger),#c0392b)}
.chart-row .chart-val{width:50px;font-size:.85rem;color:var(--text);text-align:left;flex-shrink:0}

/* ========== REVIEW Screen ========== */
.review-header{text-align:center;padding:30px 0}
.review-header h2{margin-bottom:8px;font-size:1.5rem}
.review-item{
  background:var(--bg-card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm);
  animation:cardEnter .35s var(--ease-out);
  border-left:3px solid var(--danger);
}
.review-item.essay-item{border-left-color:var(--warning)}
.review-item .review-q{font-weight:600;margin-bottom:8px}
.review-item .review-ans{margin-top:10px;padding:12px;background:rgba(46,204,113,.06);border-radius:var(--radius-sm);border:1px solid rgba(46,204,113,.15);font-size:.9rem;color:var(--success)}
.review-item .review-yours{margin-top:8px;padding:10px;background:rgba(231,76,60,.06);border-radius:var(--radius-sm);border:1px solid rgba(231,76,60,.15);font-size:.9rem;color:var(--danger)}

/* ========== PODCAST Screen ========== */
.podcast-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin:30px 0}
.podcast-card{
  background:var(--bg-card);border:1px solid rgba(255,255,255,.06);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md);transition:all .35s var(--ease-out);
}
.podcast-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg),var(--shadow-glow)}
.podcast-card .pc-header{padding:20px;text-align:center}
.podcast-card .pc-icon{font-size:42px;margin-bottom:8px}
.podcast-card h3{font-size:1.1rem;margin-bottom:4px}
.podcast-card .pc-desc{color:var(--text-muted);font-size:.85rem}
.podcast-card video,.podcast-card audio{width:100%;display:block;background:#000;aspect-ratio:16/9}
.podcast-card video:not([src]),.podcast-card video[src=""]{display:none}
.podcast-card .pc-placeholder{
  aspect-ratio:16/9;background:var(--bg);display:flex;
  align-items:center;justify-content:center;color:var(--text-dim);
  font-size:.85rem;text-align:center;padding:20px;
}

/* ========== Empty state ========== */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px}
.empty-state h3{color:var(--text-muted);margin-bottom:8px}

/* ========== Nav Tabs ========== */
.nav-tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--bg-card);border-radius:30px;padding:4px;border:1px solid rgba(255,255,255,.06)}
.nav-tab{
  flex:1;padding:10px 20px;border-radius:26px;border:none;
  background:transparent;color:var(--text-muted);cursor:pointer;
  font-size:.9rem;font-weight:500;transition:all .25s;
  text-align:center;
}
.nav-tab.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;box-shadow:var(--shadow-sm)}
.nav-tab:hover:not(.active){color:var(--text)}

/* ========== Footer ========== */
.screen-footer{text-align:center;padding:40px 0 20px;color:var(--text-dim);font-size:.8rem}

/* ========== Responsive ========== */
@media(max-width:640px){
  .container{padding:20px 12px}
  .home-header h1{font-size:1.5rem}
  .subject-grid{grid-template-columns:1fr}
  .quiz-topbar{flex-direction:column;align-items:flex-start}
  .result-score{font-size:3rem}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .podcast-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- BGM Player -->
<div class="bgm-player" id="bgmPlayer">
  <button class="bgm-btn paused" id="bgmBtn" title="播放/暂停背景音乐">&#9654;</button>
  <span class="bgm-label">BGM</span>
  <input type="range" class="bgm-vol" id="bgmVol" min="0" max="100" value="30" title="音量">
</div>

<!-- ==================== HOME SCREEN ==================== -->
<div class="screen active" id="screenHome">
  <div class="container">
    <div class="home-header">
      <div class="logo">&#9881;</div>
      <h1>能源动力工程 — 在线考试</h1>
      <p class="subtitle">锅炉原理 · 太阳能技术 · 热工基础</p>
    </div>
    <div class="subject-grid" id="subjectGrid"></div>
    <!-- Podcast preview -->
    <div style="text-align:center;margin-top:20px">
      <button class="btn btn-secondary" onclick="switchScreen('podcast')">
        &#127911; 三科目播客视频
      </button>
    </div>
    <div class="screen-footer">考试数据本地存储，支持断点续考 &middot; 按学科随机出题</div>
  </div>
</div>

<!-- ==================== QUIZ SCREEN ==================== -->
<div class="screen" id="screenQuiz">
  <div class="container">

<script>
/* ========================================================
   ENERGY EXAM SYSTEM — v2.0
   ======================================================== */
(function() {
'use strict';

// ─── BGM ────────────────────────────────────────────────
const bgmBtn = document.getElementById('bgmBtn');
const bgmVol = document.getElementById('bgmVol');
let bgmAudio = null;
let bgmPlaying = false;

function initBGM() {
  // 使用 Web Audio API 生成环境音乐（无外部依赖）
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const gainNode = ctx.createGain();
    gainNode.gain.value = parseFloat(bgmVol.value) / 100 * 0.08;
    gainNode.connect(ctx.destination);

    let osc1, osc2, isPlaying = false;

    function startTone() {
      if (isPlaying) return;
      isPlaying = true;
      osc1 = ctx.createOscillator();
      osc2 = ctx.createOscillator();
      osc1.type = 'sine';
      osc2.type = 'sine';
      osc1.frequency.value = 220;
      osc2.frequency.value = 330;
      const g1 = ctx.createGain(); g1.gain.value = 0.35;
      const g2 = ctx.createGain(); g2.gain.value = 0.25;
      osc1.connect(g1); g1.connect(gainNode);
      osc2.connect(g2); g2.connect(gainNode);
      osc1.start(); osc2.start();
      // Subtle frequency modulation
      let t = 0;
      function modulate() {
        if (!isPlaying) return;
        t += 0.02;
        osc1.frequency.value = 220 + Math.sin(t * 0.3) * 8;
        osc2.frequency.value = 330 + Math.sin(t * 0.37 + 1) * 6;
        requestAnimationFrame(() => { if (isPlaying) setTimeout(modulate, 50); });
      }
      modulate();
      bgmPlaying = true;
    }
    function stopTone() {
      isPlaying = false;
      try { osc1.stop(); osc2.stop(); } catch(e) {}
      bgmPlaying = false;
    }
    bgmBtn.addEventListener('click', () => {
      if (bgmPlaying) {
        stopTone();
        bgmBtn.classList.add('paused');
        bgmBtn.innerHTML = '&#9654;';
      } else {
        startTone();
        bgmBtn.classList.remove('paused');
        bgmBtn.innerHTML = '&#10074;&#10074;';
      }
    });
    bgmVol.addEventListener('input', () => {
      gainNode.gain.value = parseFloat(bgmVol.value) / 100 * 0.08;
    });
  } catch(e) { console.warn('BGM init failed:', e.message); }
}

// ─── Ripple Effect ──────────────────────────────────────
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.btn,.subject-card,.option-item,.judge-btn,.ac-dot');
  if (!btn) return;
  if (btn.querySelector('.ripple-effect')) return;
  const ripple = document.createElement('span');
  ripple.className = 'ripple-effect';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

// ─── Screen Navigation ──────────────────────────────────
function switchScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen' + name.charAt(0).toUpperCase() + name.slice(1));
  if (target) target.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.switchScreen = switchScreen;

// ─── Field Mapping ──────────────────────────────────────
function normalizeQuestion(q) {
  return {
    q: q.q || q.question,
    opts: q.opts || q.options,
    ans: q.ans !== undefined ? q.ans : q.answer
  };
}

// ─── Subject Card Rendering ─────────────────────────────
function renderSubjectCards() {
  const grid = document.getElementById('subjectGrid');
  const colors = { boiler: 'red', solar: 'orange', thermal: 'teal' };
  grid.innerHTML = Object.entries(EXAM_DATA).map(([key, subj]) => {
    const total = (subj.single?.length || 0) + (subj.fill?.length || 0) +
                  (subj.judge?.length || 0) + (subj.essay?.length || 0);
    return `
      <div class="subject-card" onclick="startExam('${key}')">
        <div class="icon">${subj.icon}</div>
        <h3>${subj.name}</h3>
        <p class="count">${total} 道题 · 4种题型</p>
        <div class="bar ${colors[key] || 'teal'}"></div>
      </div>`;
  }).join('');
}

// ─── Exam State ─────────────────────────────────────────
let examState = {
  subject: null,
  questions: [],
  answers: {},
  currentIdx: 0,
  startTime: 0,
  elapsed: 0,
  timerInterval: null,
  submitted: false,
  showAnswerCard: false
};

// ─── Build Question Pool ────────────────────────────────
function buildQuestionPool(subjectKey) {
  const data = EXAM_DATA[subjectKey];
  const pool = [];
  (data.single || []).forEach(q => pool.push({ ...normalizeQuestion(q), type: 'single' }));
  (data.fill || []).forEach(q => pool.push({ ...normalizeQuestion(q), type: 'fill' }));
  (data.judge || []).forEach(q => pool.push({ ...normalizeQuestion(q), type: 'judge' }));
  (data.essay || []).forEach(q => pool.push({ ...normalizeQuestion(q), type: 'essay' }));
  return shuffle(pool);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── Start Exam ─────────────────────────────────────────
function startExam(subjectKey) {
  // Check for saved progress
  const saved = loadProgress(subjectKey);
  if (saved && saved.answers && Object.keys(saved.answers).length > 0) {
    const resume = confirm(
      `检测到「${EXAM_DATA[subjectKey].name}」之前的答题进度（已完成 ${Object.keys(saved.answers).length} 题），是否恢复？\n\n点击"确定"恢复进度，"取消"重新开始。`
    );
    if (resume) {
      examState.subject = subjectKey;
      examState.questions = saved.questions;
      examState.answers = saved.answers;
      examState.currentIdx = saved.currentIdx || 0;
      examState.elapsed = saved.elapsed || 0;
      examState.submitted = false;
      examState.showAnswerCard = false;
      document.getElementById('quizSubjectBadge').textContent = EXAM_DATA[subjectKey].name;
      switchScreen('quiz');
      document.getElementById('answerCard').classList.add('hidden');
      renderQuestion();
      startTimer();
      renderAnswerCard();
      return;
    }
  }
  // Fresh start
  examState.subject = subjectKey;
  examState.questions = buildQuestionPool(subjectKey);
  examState.answers = {};
  examState.currentIdx = 0;
  examState.elapsed = 0;
  examState.submitted = false;
  examState.showAnswerCard = false;
  document.getElementById('quizSubjectBadge').textContent = EXAM_DATA[subjectKey].name;
  switchScreen('quiz');
  document.getElementById('answerCard').classList.add('hidden');
  renderQuestion();
  startTimer();
  renderAnswerCard();
}
window.startExam = startExam;

// ─── Timer ──────────────────────────────────────────────
function startTimer() {
  clearInterval(examState.timerInterval);
  examState.startTime = Date.now() - examState.elapsed * 1000;
  examState.timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  if (examState.submitted) { clearInterval(examState.timerInterval); return; }
  const elapsed = Math.floor((Date.now() - examState.startTime) / 1000);
  examState.elapsed = elapsed;
  const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
  const s = (elapsed % 60).toString().padStart(2, '0');
  const timerEl = document.getElementById('quizTimer');
  timerEl.textContent = `${m}:${s}`;
  timerEl.className = 'timer' + (elapsed > 600 ? ' danger' : elapsed > 300 ? ' warning' : '');
}

function stopTimer() { clearInterval(examState.timerInterval); }

// ─── Render Question ────────────────────────────────────
function renderQuestion() {
  const area = document.getElementById('questionArea');
  const q = examState.questions[examState.currentIdx];
  if (!q) return;
  const typeLabels = { single: '单选题', fill: '填空题', judge: '判断题', essay: '简答题' };
  const userAns = examState.answers[examState.currentIdx];
  let inputHTML = '';

  if (examState.submitted) {
    // Show results
    if (q.type === 'single') {
      inputHTML = '<div class="options-list">' + q.opts.map((o, i) => {
        let cls = 'option-item';
        if (i === q.ans) cls += ' correct';
        else if (userAns === i) cls += ' wrong';
        if (userAns === i) cls += ' selected';
        return `<div class="${cls}"><span class="opt-letter">${'ABCD'[i]}</span>${o}</div>`;
      }).join('') + '</div>';
    } else if (q.type === 'fill') {
      const correct = userAns !== undefined && String(userAns).trim() === String(q.ans).trim();
      inputHTML = `<input class="fill-input ${correct ? 'correct' : 'wrong'}" value="${userAns || ''}" disabled>
        <div style="margin-top:8px;color:var(--success);font-size:.9rem">✓ 正确答案：${q.ans}</div>`;
    } else if (q.type === 'judge') {
      inputHTML = '<div class="judge-btns">' + [true, false].map(v => {
        let cls = 'judge-btn';
        if (v === q.ans) cls += ' correct';
        else if (userAns === v) cls += ' wrong';
        if (userAns === v) cls += ' selected';
        return `<div class="${cls}">${v ? '✓ 正确' : '✗ 错误'}</div>`;
      }).join('') + '</div>';
    } else if (q.type === 'essay') {
      inputHTML = `<textarea class="essay-textarea" disabled>${userAns || ''}</textarea>
        <div style="margin-top:10px;padding:12px;background:rgba(46,204,113,.06);border-radius:8px;border:1px solid rgba(46,204,113,.15);font-size:.9rem;color:var(--success)">
        📝 参考答案：${q.ans || '略'}</div>`;
    }
  } else {
    // Interactive
    if (q.type === 'single') {
      inputHTML = '<div class="options-list">' + q.opts.map((o, i) => {
        return `<div class="option-item${userAns === i ? ' selected' : ''}" onclick="selectOption(${i})">
          <span class="opt-letter">${'ABCD'[i]}</span>${o}</div>`;
      }).join('') + '</div>';
    } else if (q.type === 'fill') {
      inputHTML = `<input class="fill-input" id="fillInput" value="${userAns || ''}" 
        onchange="saveFillAnswer(this.value)" oninput="saveFillAnswer(this.value)" 
        placeholder="请输入你的答案...">`;
    } else if (q.type === 'judge') {
      inputHTML = '<div class="judge-btns">' + [true, false].map(v => {
        return `<div class="judge-btn${userAns === v ? ' selected' : ''}" onclick="selectJudge(${v})">
          ${v ? '✓ 正确' : '✗ 错误'}</div>`;
      }).join('') + '</div>';
    } else if (q.type === 'essay') {
      inputHTML = `<textarea class="essay-textarea" id="essayInput" 
        onchange="saveEssayAnswer(this.value)" oninput="debounceSaveEssay(this.value)"
        placeholder="请输入你的答案...">${userAns || ''}</textarea>`;
    }
  }

  area.innerHTML = `
    <div class="question-card">
      <span class="q-type ${q.type}">${typeLabels[q.type]}</span>
      <div class="q-text">${examState.currentIdx + 1}. ${q.q}</div>
      ${inputHTML}
    </div>`;

  updateNavButtons();
  document.getElementById('quizProgress').textContent = 
    `${examState.currentIdx + 1}/${examState.questions.length}`;
  renderAnswerCard();
  saveProgress();
}

// ─── Answer handlers ────────────────────────────────────
function selectOption(idx) {
  if (examState.submitted) return;
  examState.answers[examState.currentIdx] = idx;
  renderQuestion();
}
function selectJudge(val) {
  if (examState.submitted) return;
  examState.answers[examState.currentIdx] = val;
  renderQuestion();
}
function saveFillAnswer(val) {
  if (examState.submitted) return;
  examState.answers[examState.currentIdx] = val;
  saveProgress();
}
let essayTimer = null;
function debounceSaveEssay(val) {
  clearTimeout(essayTimer);
  essayTimer = setTimeout(() => { examState.answers[examState.currentIdx] = val; saveProgress(); }, 400);
}
function saveEssayAnswer(val) {
  examState.answers[examState.currentIdx] = val;
  saveProgress();
}
window.selectOption = selectOption;
window.selectJudge = selectJudge;
window.saveFillAnswer = saveFillAnswer;
window.saveEssayAnswer = saveEssayAnswer;
window.debounceSaveEssay = debounceSaveEssay;

// ─── Navigation ─────────────────────────────────────────
function navigateQuestion(dir) {
  const newIdx = examState.currentIdx + dir;
  if (newIdx < 0 || newIdx >= examState.questions.length) return;
  examState.currentIdx = newIdx;
  renderQuestion();
}
function updateNavButtons() {
  document.getElementById('btnPrev').style.visibility = examState.currentIdx === 0 ? 'hidden' : 'visible';
  const isLast = examState.currentIdx === examState.questions.length - 1;
  document.getElementById('btnNext').style.display = isLast ? 'none' : '';
  document.getElementById('btnSubmit').style.display = 'none';
  if (isLast && !examState.submitted) {
    document.getElementById('btnSubmit').style.display = '';
    document.getElementById('btnSubmit').onclick = submitExam;
  }
}
window.navigateQuestion = navigateQuestion;

// ─── Answer Card ────────────────────────────────────────
function toggleAnswerCard() {
  examState.showAnswerCard = !examState.showAnswerCard;
  const panel = document.getElementById('answerCard');
  if (examState.showAnswerCard) panel.classList.remove('hidden');
  else panel.classList.add('hidden');
  renderAnswerCard();
}
function renderAnswerCard() {
  const panel = document.getElementById('answerCard');
  if (!examState.showAnswerCard) return;
  panel.innerHTML = examState.questions.map((q, i) => {
    let cls = 'ac-dot';
    if (i === examState.currentIdx) cls += ' current';
    if (examState.answers[i] !== undefined && examState.answers[i] !== null && examState.answers[i] !== '') 
      cls += ' answered';
    if (examState.submitted) {
      if (isCorrect(i)) cls += ' correct-dot';
      else if (examState.answers[i] !== undefined) cls += ' wrong-dot';
    }
    return `<div class="${cls}" onclick="jumpTo(${i})">${i + 1}</div>`;
  }).join('');
}
function jumpTo(idx) {
  examState.currentIdx = idx;
  renderQuestion();
}
window.toggleAnswerCard = toggleAnswerCard;
window.jumpTo = jumpTo;

// ─── Scoring ────────────────────────────────────────────
function isCorrect(idx) {
  const q = examState.questions[idx];
  const ua = examState.answers[idx];
  if (ua === undefined || ua === null || ua === '') return false;
  if (q.type === 'fill') return String(ua).trim() === String(q.ans).trim();
  if (q.type === 'essay') return String(ua).trim().length >= 10; // 简答10字以上判对
  return ua === q.ans;
}

function submitExam() {
  if (!examState.submitted && Object.keys(examState.answers).length < examState.questions.length) {
    const unanswered = examState.questions.length - Object.keys(examState.answers).length;
    if (!confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`)) return;
  }
  examState.submitted = true;
  stopTimer();
  clearProgress();
  renderQuestion();
  renderAnswerCard();
  updateNavButtons();
  showResults();
}
window.submitExam = submitExam;

function confirmExit() {
  if (!examState.submitted && Object.keys(examState.answers).length > 0) {
    if (!confirm('退出将保存当前进度，确定退出吗？')) return;
    saveProgress();
  }
  stopTimer();
  switchScreen('home');
}
window.confirmExit = confirmExit;

// ─── Results ────────────────────────────────────────────
function showResults() {
  switchScreen('result');
  let correct = 0, wrong = 0, total = examState.questions.length;
  const typeStats = { single: {c:0,t:0}, fill: {c:0,t:0}, judge: {c:0,t:0}, essay: {c:0,t:0} };

  examState.questions.forEach((q, i) => {
    typeStats[q.type].t++;
    if (isCorrect(i)) { correct++; typeStats[q.type].c++; }
    else wrong++;
  });

  const score = Math.round((correct / total) * 100);
  const scoreEl = document.getElementById('resultScore');
  scoreEl.textContent = '0';
  // Animate score
  let cur = 0;
  const animateScore = setInterval(() => {
    cur += Math.ceil((score - cur) / 8);
    if (cur >= score) { cur = score; clearInterval(animateScore); }
    scoreEl.textContent = cur;
  }, 40);

  let grade, gradeCls;
  if (score >= 90) { grade = '优秀 (A)'; gradeCls = 'grade-a'; }
  else if (score >= 75) { grade = '良好 (B)'; gradeCls = 'grade-b'; }
  else if (score >= 60) { grade = '合格 (C)'; gradeCls = 'grade-c'; }
  else { grade = '需努力 (D)'; gradeCls = 'grade-d'; }

  document.getElementById('resultGrade').innerHTML = 
    `<span class="result-grade ${gradeCls}">${grade}</span>`;

  const m = Math.floor(examState.elapsed / 60);
  const s = examState.elapsed % 60;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card correct"><div class="stat-num">${correct}</div><div class="stat-label">✓ 正确</div></div>
    <div class="stat-card wrong"><div class="stat-num">${wrong}</div><div class="stat-label">✗ 错误</div></div>
    <div class="stat-card rate"><div class="stat-num">${score}%</div><div class="stat-label">正确率</div></div>
    <div class="stat-card time"><div class="stat-num">${m}分${s}秒</div><div class="stat-label">用时</div></div>
  `;

  // Type chart
  renderTypeChart(typeStats);
}

function renderTypeChart(typeStats) {
  const container = document.getElementById('typeChart');
  const labels = { single: '单选题', fill: '填空题', judge: '判断题', essay: '简答题' };
  container.innerHTML = Object.entries(typeStats).map(([type, s]) => {
    const pct = s.t > 0 ? Math.round(s.c / s.t * 100) : 0;
    return `
      <div class="chart-row">
        <span class="chart-label">${labels[type]}</span>
        <div class="chart-bar-wrap">
          <div class="chart-bar correct-bar" style="width:${pct}%">${pct}%</div>
        </div>
        <span class="chart-val">${s.c}/${s.t}</span>
      </div>`;
  }).join('');
}

// ─── Review ─────────────────────────────────────────────
function reviewWrong() {
  switchScreen('review');
  const wrongQs = examState.questions.filter((q, i) => !isCorrect(i));
  if (wrongQs.length === 0) {
    document.getElementById('reviewList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎉</div>
        <h3>太棒了！全部回答正确</h3>
      </div>`;
    return;
  }
  document.getElementById('reviewList').innerHTML = wrongQs.map((q, ri) => {
    const origIdx = examState.questions.indexOf(q);
    const ua = examState.answers[origIdx];
    const typeLabels = { single: '单选题', fill: '填空题', judge: '判断题', essay: '简答题' };
    let yourAnsStr = '';
    if (q.type === 'single') yourAnsStr = ua !== undefined ? (q.opts ? q.opts[ua] : '未知') : '未作答';
    else if (q.type === 'judge') yourAnsStr = ua !== undefined ? (ua ? '✓ 正确' : '✗ 错误') : '未作答';
    else yourAnsStr = ua || '未作答';

    let correctAnsStr = '';
    if (q.type === 'single') correctAnsStr = q.opts ? q.opts[q.ans] : '';
    else if (q.type === 'judge') correctAnsStr = q.ans ? '✓ 正确' : '✗ 错误';
    else correctAnsStr = q.ans;

    return `
      <div class="review-item ${q.type === 'essay' ? 'essay-item' : ''}">
        <span class="q-type ${q.type}">${typeLabels[q.type]}</span>
        <div class="review-q">${origIdx + 1}. ${q.q}</div>
        <div class="review-yours">❌ 你的答案：${yourAnsStr}</div>
        <div class="review-ans">✅ 正确答案：${correctAnsStr}</div>
      </div>`;
  }).join('');
}
window.reviewWrong = reviewWrong;

function restartExam() {
  stopTimer();
  clearProgress();
  startExam(examState.subject);
}
window.restartExam = restartExam;

// ─── Progress Save/Restore ──────────────────────────────
const STORAGE_KEY = 'exam_progress_';

function saveProgress() {
  if (examState.submitted) return;
  try {
    const data = {
      subject: examState.subject,
      questions: examState.questions,
      answers: examState.answers,
      currentIdx: examState.currentIdx,
      elapsed: examState.elapsed,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY + examState.subject, JSON.stringify(data));
  } catch(e) { console.warn('Save progress failed:', e.message); }
}

function loadProgress(subjectKey) {
  try {
    const raw = localStorage.getItem(STORAGE_KEY + subjectKey);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function clearProgress() {
  try {
    localStorage.removeItem(STORAGE_KEY + examState.subject);
  } catch(e) {}
}

// ─── Keyboard Navigation ────────────────────────────────
document.addEventListener('keydown', function(e) {
  const quizScreen = document.getElementById('screenQuiz');
  if (!quizScreen.classList.contains('active') || examState.submitted) return;

  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); navigateQuestion(-1);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); navigateQuestion(1);
  } else if (e.key === 'Enter' && examState.currentIdx === examState.questions.length - 1) {
    e.preventDefault(); submitExam();
  } else if (e.key === 'a' || e.key === 'A') { selectOption(0);
  } else if (e.key === 'b' || e.key === 'B') { selectOption(1);
  } else if (e.key === 'c' || e.key === 'C') { selectOption(2);
  } else if (e.key === 'd' || e.key === 'D') { selectOption(3);
  }
});

// ─── Init ────────────────────────────────────────────────
renderSubjectCards();
initBGM();

})();
</script>
</body>
</html>
