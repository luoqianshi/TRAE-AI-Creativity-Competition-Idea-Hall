<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活小账本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        .stat-item {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .stat-item.income {
            border-left: 4px solid #4CAF50;
        }
        .stat-item.expense {
            border-left: 4px solid #FF5722;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        .stat-value.income { color: #4CAF50; }
        .stat-value.expense { color: #FF5722; }
        .balance {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .balance-label {
            font-size: 14px;
            opacity: 0.9;
        }
        .balance-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #667eea;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-income {
            background: #4CAF50;
            color: #fff;
        }
        .btn-expense {
            background: #FF5722;
            color: #fff;
        }
        .btn-clear {
            background: #9e9e9e;
            color: #fff;
        }
        .records-title {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .record-item:last-child {
            border-bottom: none;
        }
        .record-info {
            flex: 1;
        }
        .record-desc {
            font-size: 14px;
            color: #333;
        }
        .record-meta {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }
        .record-amount {
            font-size: 16px;
            font-weight: 600;
        }
        .record-amount.income { color: #4CAF50; }
        .record-amount.expense { color: #FF5722; }
        .record-actions {
            margin-left: 12px;
        }
        .delete-btn {
            padding: 4px 8px;
            font-size: 12px;
            background: #ffebee;
            color: #f44336;
            border-radius: 4px;
            flex: none;
        }
        .empty {
            text-align: center;
            color: #999;
            padding: 40px 0;
            font-size: 14px;
        }
        .chart-container {
            margin-top: 16px;
        }
        .chart-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }
        .category-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .category-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f9f9f9;
            border-radius: 6px;
            font-size: 13px;
        }
        .category-name {
            color: #666;
        }
        .category-amount {
            color: #FF5722;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>生活小账本</h1>

        <div class="balance">
            <div class="balance-label">本月结余</div>
            <div class="balance-value" id="balance">¥0.00</div>
        </div>

        <div class="stats">
            <div class="stat-item income">
                <div class="stat-label">本月收入</div>
                <div class="stat-value income" id="totalIncome">¥0.00</div>
            </div>
            <div class="stat-item expense">
                <div class="stat-label">本月支出</div>
                <div class="stat-value expense" id="totalExpense">¥0.00</div>
            </div>
        </div>

        <div class="card">
            <div class="form-group">
                <div class="form-row">
                    <div>
                        <label>类型</label>
                        <select id="type">
                            <option value="expense">支出</option>
                            <option value="income">收入</option>
                        </select>
                    </div>
                    <div>
                        <label>金额 (¥)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <div class="form-row">
                    <div>
                        <label>分类</label>
                        <select id="category">
                            <option value="餐饮">餐饮</option>
                            <option value="交通">交通</option>
                            <option value="购物">购物</option>
                            <option value="娱乐">娱乐</option>
                            <option value="居住">居住</option>
                            <option value="医疗">医疗</option>
                            <option value="工资">工资</option>
                            <option value="理财">理财</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div>
                        <label>日期</label>
                        <input type="date" id="date">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" id="desc" placeholder="简单描述这笔账...">
            </div>
            <div class="btn-group">
                <button class="btn-expense" onclick="addRecord('expense')">记支出</button>
                <button class="btn-income" onclick="addRecord('income')">记收入</button>
                <button class="btn-clear" onclick="clearAll()">清空</button>
            </div>
        </div>

        <div class="card" id="chartCard">
            <div class="chart-title">支出分类统计</div>
            <div class="category-stats" id="categoryStats">
                <div class="category-item">
                    <span class="category-name">餐饮</span>
                    <span class="category-amount">¥0</span>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="records-title">记账记录</div>
            <div id="recordsList">
                <div class="empty">暂无记录，开始记账吧~</div>
            </div>
        </div>
    </div>

    <script>
        // 初始化日期为今天
        document.getElementById('date').value = new Date().toISOString().split('T')[0];

        // 从localStorage加载数据
        let records = JSON.parse(localStorage.getItem('myAccountBook') || '[]');

        function saveData() {
            localStorage.setItem('myAccountBook', JSON.stringify(records));
        }

        function addRecord(type) {
            const amount = parseFloat(document.getElementById('amount').value);
            if (!amount || amount <= 0) {
                alert('请输入有效金额');
                return;
            }

            const record = {
                id: Date.now(),
                type: type,
                amount: amount,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                desc: document.getElementById('desc').value || '无'
            };

            records.unshift(record);
            saveData();
            renderRecords();
            updateStats();
            clearForm();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveData();
            renderRecords();
            updateStats();
        }

        function clearAll() {
            if (confirm('确定要清空所有记录吗？')) {
                records = [];
                saveData();
                renderRecords();
                updateStats();
            }
        }

        function clearForm() {
            document.getElementById('amount').value = '';
            document.getElementById('desc').value = '';
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        }

        function getCurrentMonthRecords() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            return records.filter(r => {
                const d = new Date(r.date);
                return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
            });
        }

        function updateStats() {
            const monthRecords = getCurrentMonthRecords();
            let income = 0, expense = 0;

            monthRecords.forEach(r => {
                if (r.type === 'income') income += r.amount;
                else expense += r.amount;
            });

            document.getElementById('totalIncome').textContent = '¥' + income.toFixed(2);
            document.getElementById('totalExpense').textContent = '¥' + expense.toFixed(2);
            document.getElementById('balance').textContent = '¥' + (income - expense).toFixed(2);

            // 更新分类统计
            const categoryData = {};
            monthRecords.filter(r => r.type === 'expense').forEach(r => {
                categoryData[r.category] = (categoryData[r.category] || 0) + r.amount;
            });

            const sortedCategories = Object.entries(categoryData)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6);

            const chartHtml = sortedCategories.length > 0
                ? sortedCategories.map(([name, amount]) => `
                    <div class="category-item">
                        <span class="category-name">${name}</span>
                        <span class="category-amount">¥${amount.toFixed(2)}</span>
                    </div>
                `).join('')
                : '<div class="empty">暂无支出记录</div>';

            document.getElementById('categoryStats').innerHTML = chartHtml;
        }

        function renderRecords() {
            const container = document.getElementById('recordsList');

            if (records.length === 0) {
                container.innerHTML = '<div class="empty">暂无记录，开始记账吧~</div>';
                return;
            }

            const html = records.map(r => {
                const date = new Date(r.date);
                const dateStr = `${date.getMonth() + 1}月${date.getDate()}日`;
                const typeText = r.type === 'income' ? '收入' : '支出';
                const prefix = r.type === 'income' ? '+' : '-';

                return `
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-desc">${r.desc} <span style="color:#999;font-size:12px">[${r.category}]</span></div>
                            <div class="record-meta">${dateStr} · ${typeText}</div>
                        </div>
                        <div class="record-amount ${r.type}">${prefix}¥${r.amount.toFixed(2)}</div>
                        <div class="record-actions">
                            <button class="delete-btn" onclick="deleteRecord(${r.id})">删除</button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        // 初始化渲染
        renderRecords();
        updateStats();
    </script>
</body>
</html>
