<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>执行评估 - 颐养评估</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/common.css">
    <link rel="stylesheet" href="../shared/css/mobile-theme.css">
    <style>
        .m-elder-info-card {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
            margin: 0;
            padding: 16px;
            color: white;
        }
        .m-elder-info-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .m-elder-avatar-lg {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .m-elder-name-lg {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .m-elder-meta {
            font-size: 13px;
            opacity: 0.9;
        }
        .m-status-tag {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        .m-sync-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .m-sync-bar.synced {
            background: #ECFDF5;
            color: #059669;
        }
        .m-sync-bar.pending {
            background: #FEF3C7;
            color: #D97706;
        }
        .m-sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .m-sync-bar.synced .m-sync-dot {
            background: #059669;
        }
        .m-sync-bar.pending .m-sync-dot {
            background: #D97706;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .m-assessment-progress {
            padding: 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
        }
        .m-progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .m-progress-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .m-progress-percent {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-primary);
        }
        .m-progress-bar-lg {
            height: 8px;
            background: var(--bg-gray);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .m-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary), var(--color-primary-light));
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .m-progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-tertiary);
        }
        .m-dim-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            overflow-x: auto;
        }
        .m-dim-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 70px;
        }
        .m-dim-tab.active {
            background: var(--color-primary);
            color: white;
            font-weight: 500;
        }
        .m-dim-tab.done {
            color: #059669;
        }
        .m-dim-tab.done .m-dim-dot {
            background: #059669;
            color: white;
        }
        .m-dim-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-gray);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        .m-dim-tab.active .m-dim-dot {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }
        .m-question-list {
            padding: 12px 16px 100px;
            background: var(--bg-secondary);
        }
        .m-question-card {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .m-question-number {
            font-size: 12px;
            color: var(--color-primary);
            font-weight: 500;
            margin-bottom: 4px;
        }
        .m-question-dim {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }
        .m-question-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            line-height: 1.5;
        }
        .m-question-desc {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .m-option-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .m-option-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px;
            border: 2px solid var(--border-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--bg-card);
        }
        .m-option-item:active {
            transform: scale(0.98);
        }
        .m-option-item.selected {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
        }
        .m-option-radio {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
            margin-top: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .m-option-item.selected .m-option-radio {
            border-color: var(--color-primary);
            background: var(--color-primary);
        }
        .m-option-radio svg {
            width: 12px;
            height: 12px;
            color: white;
            display: none;
        }
        .m-option-item.selected .m-option-radio svg {
            display: block;
        }
        .m-option-content {
            flex: 1;
        }
        .m-option-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .m-option-item.selected .m-option-label {
            color: var(--color-primary);
        }
        .m-option-desc {
            font-size: 12px;
            color: var(--text-tertiary);
            line-height: 1.4;
        }
        .m-option-score {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .m-option-item.selected .m-option-score {
            color: var(--color-primary);
        }
        .m-question-remark {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
        }
        .m-remark-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .m-remark-label svg {
            width: 16px;
            height: 16px;
        }
        .m-textarea {
            width: 100%;
            min-height: 60px;
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            resize: vertical;
            box-sizing: border-box;
        }
        .m-textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .m-bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            z-index: 100;
        }
        .m-bottom-bar .m-btn {
            flex: 1;
            height: 48px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .m-bottom-bar .m-btn-primary {
            background: var(--color-primary);
            color: white;
        }
        .m-bottom-bar .m-btn-primary:active {
            background: var(--color-primary-dark);
            transform: scale(0.98);
        }
        .m-bottom-bar .m-btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }
        .m-bottom-bar .m-btn-secondary:active {
            background: var(--bg-gray);
            transform: scale(0.98);
        }
        .m-bottom-bar .m-btn-next {
            flex: 2;
        }
        .m-score-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
        }
        .m-score-num {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1;
        }
        .m-score-label {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
        .m-confirm-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }
        .m-confirm-modal.hidden {
            display: none;
        }
        .m-confirm-box {
            width: 100%;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px 20px;
            animation: slideUp 0.3s ease;
            position: relative;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .m-confirm-title {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .m-confirm-desc {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .m-confirm-score {
            background: var(--color-primary-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }
        .m-confirm-score-num {
            font-size: 36px;
            font-weight: 700;
            color: var(--color-primary);
            line-height: 1;
            margin-bottom: 4px;
        }
        .m-confirm-score-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .m-confirm-buttons {
            display: flex;
            gap: 10px;
        }
        .m-confirm-btn {
            flex: 1;
            height: 48px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .m-confirm-btn-secondary {
            background: var(--bg-gray);
            color: var(--text-secondary);
        }
        .m-confirm-btn-primary {
            background: var(--color-primary);
            color: white;
        }
        .m-confirm-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
<div class="m-container">
    <div class="m-phone">
        <!-- 状态栏 -->
        <div class="m-status-bar">
            <span class="m-status-time">9:41</span>
            <div class="m-status-icons">
                <svg width="16" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <svg width="16" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
                <svg width="24" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="m-navbar m-navbar-solid">
            <div class="m-navbar-back" onclick="goBack()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </div>
            <div class="m-navbar-title">ADL量表评估</div>
            <div class="m-navbar-action">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="m-content m-scroll" style="padding-top: 56px;">
            <!-- 老人信息卡片 -->
            <div class="m-elder-info-card">
                <div class="m-elder-info-row">
                    <div class="m-elder-avatar-lg">张</div>
                    <div style="flex: 1;">
                        <div class="m-elder-name-lg">张桂英</div>
                        <div class="m-elder-meta">女 · 78岁 · 和平街道阳光社区</div>
                    </div>
                    <div class="m-status-tag">首次评估</div>
                </div>
            </div>

            <!-- 同步状态条 -->
            <div class="m-sync-bar synced" id="sync-bar" onclick="toggleSync()">
                <span class="m-sync-dot"></span>
                <span id="sync-text">数据已同步</span>
            </div>

            <!-- 进度条 -->
            <div class="m-assessment-progress">
                <div class="m-progress-header">
                    <span class="m-progress-title">评估进度</span>
                    <span class="m-progress-percent" id="progress-percent">0%</span>
                </div>
                <div class="m-progress-bar-lg">
                    <div class="m-progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
                <div class="m-progress-stats">
                    <span id="progress-text">已完成 0/10 题</span>
                    <span>预计剩余 15 分钟</span>
                </div>
            </div>

            <!-- 维度导航 -->
            <div class="m-dim-tabs">
                <div class="m-dim-tab active" id="dim-tab-1" onclick="goToDim(0)">
                    <div class="m-dim-dot" id="dim-dot-1">1</div>
                    <span>日常生活</span>
                </div>
            </div>

            <!-- 题目列表 -->
            <div class="m-question-list" id="question-list">
                <!-- 动态生成题目 -->
            </div>
        </div>

        <!-- 底部操作栏 -->
        <div class="m-bottom-bar">
            <button class="m-btn m-btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                上一题
            </button>
            <div class="m-score-display">
                <div class="m-score-num" id="current-score">0</div>
                <div class="m-score-label">当前得分</div>
            </div>
            <button class="m-btn m-btn-primary m-btn-next" id="next-btn" onclick="nextQuestion()">
                下一题
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>

        <!-- 提交确认弹窗 -->
        <div class="m-confirm-modal hidden" id="submit-modal">
            <div class="m-confirm-box">
                <div style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-tertiary); font-size: 20px; z-index: 10;" onclick="closeSubmitModal()">×</div>
                <div class="m-confirm-title">确认提交评估？</div>
                <div class="m-confirm-desc">提交后将进入审核流程，审核通过后生成正式报告</div>
                <div class="m-confirm-score">
                    <div class="m-confirm-score-num" id="final-score">0</div>
                    <div class="m-confirm-score-label">总分（满分100分）</div>
                </div>
                <div class="m-confirm-buttons">
                    <button class="m-confirm-btn m-confirm-btn-secondary" onclick="closeSubmitModal()">继续修改</button>
                    <button class="m-confirm-btn m-confirm-btn-primary" onclick="submitAssessment()">确认提交</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            id: 'q1',
            title: '进食',
            desc: '评估老人自主进食的能力，包括使用餐具、将食物送入口中等',
            dim: '日常生活活动',
            options: [
                { label: '可独立进食', desc: '能用筷子或勺子自主进食，无需帮助', score: 10 },
                { label: '需部分帮助', desc: '需要他人协助准备食物或辅助进食', score: 5 },
                { label: '完全依赖', desc: '完全需要他人喂食，无法自主进食', score: 0 }
            ]
        },
        {
            id: 'q2',
            title: '洗澡',
            desc: '评估老人独立完成洗澡的能力，包括进出浴室、擦洗身体等',
            dim: '日常生活活动',
            options: [
                { label: '可独立完成', desc: '能独立完成洗澡全过程，无需帮助', score: 5 },
                { label: '需部分帮助', desc: '需要协助准备水或进出浴室', score: 3 },
                { label: '完全依赖', desc: '完全需要他人帮助洗澡', score: 0 }
            ]
        },
        {
            id: 'q3',
            title: '修饰',
            desc: '评估老人完成个人卫生修饰的能力，包括洗脸、刷牙、梳头等',
            dim: '日常生活活动',
            options: [
                { label: '可独立完成', desc: '能独立完成洗脸、刷牙、梳头、剃须', score: 5 },
                { label: '需部分帮助', desc: '需要部分帮助或指导', score: 3 },
                { label: '完全依赖', desc: '完全需要他人帮助完成修饰', score: 0 }
            ]
        },
        {
            id: 'q4',
            title: '穿衣',
            desc: '评估老人独立穿脱衣物的能力，包括穿脱内衣、外衣、鞋袜等',
            dim: '日常生活活动',
            options: [
                { label: '可独立完成', desc: '能独立穿脱所有衣物，包括系扣子、拉拉链', score: 10 },
                { label: '需部分帮助', desc: '需要部分帮助穿脱衣物', score: 5 },
                { label: '完全依赖', desc: '完全需要他人帮助穿衣', score: 0 }
            ]
        },
        {
            id: 'q5',
            title: '大便控制',
            desc: '评估老人控制排便的能力',
            dim: '日常生活活动',
            options: [
                { label: '可控制', desc: '能自主控制排便，无失禁', score: 10 },
                { label: '偶有失禁', desc: '每周失禁不超过1次', score: 5 },
                { label: '经常失禁', desc: '经常失禁或完全失控', score: 0 }
            ]
        },
        {
            id: 'q6',
            title: '小便控制',
            desc: '评估老人控制排尿的能力',
            dim: '日常生活活动',
            options: [
                { label: '可控制', desc: '能自主控制排尿，无失禁', score: 10 },
                { label: '偶有失禁', desc: '每日失禁不超过1次', score: 5 },
                { label: '经常失禁', desc: '经常失禁或完全失控', score: 0 }
            ]
        },
        {
            id: 'q7',
            title: '如厕',
            desc: '评估老人独立如厕的能力，包括进出厕所、使用卫生纸等',
            dim: '日常生活活动',
            options: [
                { label: '可独立完成', desc: '能独立如厕，包括清洁和整理衣裤', score: 10 },
                { label: '需部分帮助', desc: '需要部分帮助或辅助器具', score: 5 },
                { label: '完全依赖', desc: '完全需要他人帮助如厕', score: 0 }
            ]
        },
        {
            id: 'q8',
            title: '床椅转移',
            desc: '评估老人从床上转移到椅子上的能力',
            dim: '日常生活活动',
            options: [
                { label: '可独立完成', desc: '能独立完成床椅转移', score: 15 },
                { label: '需部分帮助', desc: '需要少量帮助或指导', score: 10 },
                { label: '需极大帮助', desc: '需要大量帮助才能完成转移', score: 5 },
                { label: '完全依赖', desc: '完全无法转移，需要他人搬运', score: 0 }
            ]
        },
        {
            id: 'q9',
            title: '平地行走',
            desc: '评估老人在平地上行走的能力，距离约45米',
            dim: '日常生活活动',
            options: [
                { label: '可独立行走', desc: '能独立行走45米以上', score: 15 },
                { label: '需部分帮助', desc: '需要他人搀扶或使用助行器', score: 10 },
                { label: '需极大帮助', desc: '需要大量帮助才能行走', score: 5 },
                { label: '完全不能独立', desc: '完全不能行走，依赖轮椅', score: 0 }
            ]
        },
        {
            id: 'q10',
            title: '上下楼梯',
            desc: '评估老人上下楼梯的能力',
            dim: '日常生活活动',
            options: [
                { label: '可独立完成', desc: '能独立上下一段楼梯', score: 10 },
                { label: '需部分帮助', desc: '需要扶手或他人搀扶', score: 5 },
                { label: '完全依赖', desc: '完全无法上下楼梯', score: 0 }
            ]
        }
    ];

    let currentQuestion = 0;
    let answers = {};
    let totalScore = 0;
    let isSynced = true;

    function initQuestions() {
        const list = document.getElementById('question-list');
        list.innerHTML = '';
        questions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'm-question-card';
            card.id = 'card-' + idx;
            card.innerHTML = `
                <div class="m-question-number">第 ${idx + 1} 题 / 共 ${questions.length} 题</div>
                <div class="m-question-dim">${q.dim}</div>
                <div class="m-question-title">${q.title}</div>
                <div class="m-question-desc">${q.desc}</div>
                <div class="m-option-group">
                    ${q.options.map((opt, oIdx) => `
                        <div class="m-option-item" data-q="${idx}" data-opt="${oIdx}" onclick="selectOption(${idx}, ${oIdx})">
                            <div class="m-option-radio">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                            <div class="m-option-content">
                                <div class="m-option-label">${opt.label}</div>
                                <div class="m-option-desc">${opt.desc}</div>
                            </div>
                            <div class="m-option-score">${opt.score}分</div>
                        </div>
                    `).join('')}
                </div>
                <div class="m-question-remark">
                    <div class="m-remark-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/></svg>
                        评估备注（选填）
                    </div>
                    <textarea class="m-textarea" placeholder="记录观察到的具体表现..."></textarea>
                </div>
            `;
            list.appendChild(card);
        });
        scrollToQuestion(0);
    }

    function selectOption(qIdx, oIdx) {
        const question = questions[qIdx];
        const option = question.options[oIdx];
        const prevScore = answers[qIdx] ? answers[qIdx].score : 0;

        answers[qIdx] = {
            optionIndex: oIdx,
            score: option.score
        };

        totalScore = totalScore - prevScore + option.score;

        document.querySelectorAll(`[data-q="${qIdx}"]`).forEach(el => {
            el.classList.remove('selected');
        });
        document.querySelector(`[data-q="${qIdx}"][data-opt="${oIdx}"]`).classList.add('selected');

        updateProgress();
        updateScore();
    }

    function updateProgress() {
        const answered = Object.keys(answers).length;
        const percent = Math.round((answered / questions.length) * 100);
        document.getElementById('progress-percent').textContent = percent + '%';
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('progress-text').textContent = `已完成 ${answered}/${questions.length} 题`;
    }

    function updateScore() {
        document.getElementById('current-score').textContent = totalScore;
        document.getElementById('final-score').textContent = totalScore;
    }

    function scrollToQuestion(idx) {
        const card = document.getElementById('card-' + idx);
        if (card) {
            card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        updateNavButtons();
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            scrollToQuestion(currentQuestion);
        }
    }

    function nextQuestion() {
        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            scrollToQuestion(currentQuestion);
        } else {
            showSubmitModal();
        }
    }

    function updateNavButtons() {
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        
        prevBtn.disabled = currentQuestion === 0;
        prevBtn.style.opacity = currentQuestion === 0 ? '0.5' : '1';
        
        if (currentQuestion === questions.length - 1) {
            nextBtn.innerHTML = `
                提交评估
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            `;
        } else {
            nextBtn.innerHTML = `
                下一题
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            `;
        }
    }

    function goToDim(idx) {
        currentQuestion = idx;
        scrollToQuestion(currentQuestion);
    }

    function toggleSync() {
        isSynced = !isSynced;
        const bar = document.getElementById('sync-bar');
        const text = document.getElementById('sync-text');
        
        if (isSynced) {
            bar.className = 'm-sync-bar synced';
            text.textContent = '数据已同步';
        } else {
            bar.className = 'm-sync-bar pending';
            text.textContent = '暂存中，网络恢复后自动上传';
        }
    }

    function showSubmitModal() {
        document.getElementById('submit-modal').classList.remove('hidden');
    }

    function closeSubmitModal() {
        document.getElementById('submit-modal').classList.add('hidden');
    }

    function submitAssessment() {
        window.location.href = 'report.html';
    }

    function goBack() {
        window.location.href = 'tasks.html';
    }

    initQuestions();

    document.getElementById('submit-modal').addEventListener('click', function(e) {
        if (e.target === this) closeSubmitModal();
    });
</script>
</body>
</html>
