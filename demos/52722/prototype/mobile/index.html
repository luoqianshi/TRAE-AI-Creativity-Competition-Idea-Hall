<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 颐养评估</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/common.css">
    <link rel="stylesheet" href="../shared/css/mobile-theme.css">
    <style>
        .login-page {
            background: linear-gradient(180deg, var(--color-primary) 0%, var(--color-primary-light) 50%, var(--bg-secondary) 50%, var(--bg-secondary) 100%);
            min-height: 100%;
            display: flex;
            flex-direction: column;
        }
        .login-header {
            padding: 60px 24px 40px;
            color: white;
            text-align: center;
        }
        .login-logo {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            backdrop-filter: blur(10px);
        }
        .login-title {
            font-size: 28px;
            font-weight: 700;
            font-family: 'Noto Serif SC', serif;
            margin-bottom: 6px;
        }
        .login-subtitle {
            font-size: 14px;
            opacity: 0.85;
        }
        .login-card {
            margin: 0 16px;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 12px 40px rgba(30, 77, 92, 0.15);
        }
        .login-form-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }
        .form-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1.5px solid transparent;
            transition: all 0.2s ease;
        }
        .form-input-wrapper:focus-within {
            border-color: var(--color-primary);
            background: var(--bg-card);
        }
        .form-input-icon {
            padding: 0 12px 0 14px;
            color: var(--text-tertiary);
            display: flex;
        }
        .form-input {
            flex: 1;
            height: 52px;
            border: none;
            background: transparent;
            font-size: 16px;
            color: var(--text-primary);
            font-family: inherit;
        }
        .form-input:focus {
            outline: none;
        }
        .form-input::placeholder {
            color: var(--text-tertiary);
        }
        .code-btn {
            height: 36px;
            padding: 0 14px;
            margin-right: 8px;
            background: var(--color-primary-bg);
            color: var(--color-primary);
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .code-btn:active {
            transform: scale(0.96);
        }
        .code-btn:disabled {
            color: var(--text-tertiary);
            background: var(--bg-gray);
            cursor: not-allowed;
        }
        .login-btn {
            width: 100%;
            height: 52px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-top: 24px;
            transition: all 0.2s ease;
        }
        .login-btn:active {
            background: var(--color-primary-dark);
            transform: scale(0.98);
        }
        .login-footer {
            margin-top: auto;
            padding: 24px 20px 32px;
            text-align: center;
        }
        .login-agreement {
            font-size: 12px;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
        }
        .checkbox-custom {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1.5px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            flex-shrink: 0;
        }
        .checkbox-custom.checked {
            background: var(--color-primary);
            border-color: var(--color-primary);
        }
        .checkbox-custom.checked svg {
            width: 12px;
            height: 12px;
            color: white;
        }
        .login-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .login-links a {
            color: var(--text-secondary);
            text-decoration: none;
        }
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            width: 100%;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px 20px;
            animation: slideUp 0.3s ease;
            position: relative;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--color-warning-bg);
            color: #E89B4A;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .modal-desc {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .modal-info {
            background: var(--bg-secondary);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .modal-info div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .modal-info div:last-child {
            margin-bottom: 0;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            height: 48px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .modal-btn-secondary {
            background: var(--bg-gray);
            color: var(--text-secondary);
        }
        .modal-btn-primary {
            background: var(--color-primary);
            color: white;
        }
        .modal-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
<div class="m-container">
    <div class="m-phone">
        <!-- 状态栏 -->
        <div class="m-status-bar" style="color: white;">
            <span class="m-status-time">9:41</span>
            <div class="m-status-icons">
                <svg width="16" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                <svg width="16" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
                <svg width="24" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <div class="login-page">
            <!-- 头部 -->
            <div class="login-header">
                <div class="login-logo">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </div>
                <div class="login-title">颐养评估</div>
                <div class="login-subtitle">社区居家养老评估系统</div>
            </div>

            <!-- 登录卡片 -->
            <div class="login-card">
                <div class="login-form-title">评估员登录</div>
                
                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <div class="form-input-wrapper">
                        <div class="form-input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        </div>
                        <input type="tel" class="form-input" id="phone" placeholder="请输入手机号" maxlength="11" value="13800138000">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">验证码</label>
                    <div class="form-input-wrapper">
                        <div class="form-input-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </div>
                        <input type="text" class="form-input" id="code" placeholder="请输入验证码" maxlength="6">
                        <button class="code-btn" id="code-btn" onclick="sendCode()">获取验证码</button>
                    </div>
                </div>

                <button class="login-btn" onclick="doLogin()">登 录</button>
            </div>

            <!-- 底部 -->
            <div class="login-footer">
                <div class="login-agreement">
                    <div class="checkbox-custom checked" id="agree-box" onclick="toggleAgree()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <span>我已阅读并同意<span style="color: var(--color-primary);">《用户协议》</span>和<span style="color: var(--color-primary);">《隐私政策》</span></span>
                </div>
                <div class="login-links">
                    <a href="#">忘记密码？</a>
                    <a href="#">联系管理员</a>
                </div>
            </div>
        </div>

        <!-- 设备绑定提示弹窗 -->
        <div class="modal-overlay hidden" id="device-modal">
            <div class="modal-box">
                <div style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-tertiary); font-size: 20px; z-index: 10;" onclick="closeDeviceModal()">×</div>
                <div class="modal-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>
                </div>
                <div class="modal-title">新设备登录确认</div>
                <div class="modal-desc">检测到您正在使用新设备登录，请确认是否为本机设备。</div>
                <div class="modal-info">
                    <div><span>设备名称</span><span style="color: var(--text-primary);">iPhone 14 Pro</span></div>
                    <div><span>登录地点</span><span style="color: var(--text-primary);">上海市 浦东新区</span></div>
                    <div><span>登录时间</span><span style="color: var(--text-primary);">2024-06-28 09:41</span></div>
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn modal-btn-secondary" onclick="closeDeviceModal()">取消</button>
                    <button class="modal-btn modal-btn-primary" onclick="confirmDevice()">确认登录</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let codeCountdown = 0;
    let agreed = true;

    function toggleAgree() {
        agreed = !agreed;
        const box = document.getElementById('agree-box');
        if (agreed) {
            box.classList.add('checked');
            box.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        } else {
            box.classList.remove('checked');
            box.innerHTML = '';
        }
    }

    function sendCode() {
        if (codeCountdown > 0) return;
        const phone = document.getElementById('phone').value;
        if (!phone || phone.length !== 11) {
            alert('请输入正确的手机号');
            return;
        }
        codeCountdown = 60;
        const btn = document.getElementById('code-btn');
        btn.disabled = true;
        btn.textContent = codeCountdown + 's';
        const timer = setInterval(() => {
            codeCountdown--;
            if (codeCountdown <= 0) {
                clearInterval(timer);
                btn.disabled = false;
                btn.textContent = '重新获取';
            } else {
                btn.textContent = codeCountdown + 's';
            }
        }, 1000);
    }

    function doLogin() {
        const phone = document.getElementById('phone').value;
        const code = document.getElementById('code').value;
        
        if (!phone || phone.length !== 11) {
            alert('请输入正确的手机号');
            return;
        }
        if (!agreed) {
            alert('请先阅读并同意用户协议和隐私政策');
            return;
        }
        
        // 模拟登录
        if (code && code.length === 6) {
            document.getElementById('device-modal').classList.remove('hidden');
        } else {
            alert('请输入6位验证码');
        }
    }

    function closeDeviceModal() {
        document.getElementById('device-modal').classList.add('hidden');
    }

    function confirmDevice() {
        closeDeviceModal();
        // 跳转到任务列表页
        window.location.href = 'tasks.html';
    }

    document.getElementById('device-modal').addEventListener('click', function(e) {
        if (e.target === this) closeDeviceModal();
    });
</script>
</body>
</html>
