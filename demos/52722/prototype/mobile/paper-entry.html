<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸质补录 - 颐养评估</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/css/common.css">
    <link rel="stylesheet" href="../shared/css/mobile-theme.css">
    <style>
        .m-paper-badge {
            background: linear-gradient(135deg, #DC2626 0%, #EF4444 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 0 0 12px 12px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-left: 16px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }
        .m-paper-badge::before {
            content: '';
            position: absolute;
            top: 0;
            right: -8px;
            width: 0;
            height: 0;
            border-left: 8px solid #DC2626;
            border-top: 16px solid transparent;
            border-bottom: 16px solid transparent;
        }
        .m-paper-header {
            background: linear-gradient(135deg, #DC2626 0%, #EF4444 100%);
            padding: 50px 20px 20px;
            color: white;
            position: relative;
        }
        .m-paper-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .m-paper-subtitle {
            font-size: 13px;
            opacity: 0.9;
        }
        .m-select-section {
            padding: 16px;
            background: var(--bg-card);
            margin-bottom: 10px;
        }
        .m-select-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .m-select-picker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: var(--bg-secondary);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .m-select-picker:active {
            background: var(--bg-gray);
        }
        .m-select-value {
            font-size: 14px;
            color: var(--text-primary);
        }
        .m-select-value.placeholder {
            color: var(--text-tertiary);
        }
        .m-select-arrow {
            width: 20px;
            height: 20px;
            color: var(--text-tertiary);
        }
        .m-quick-questions {
            padding: 0 16px 100px;
            background: var(--bg-secondary);
        }
        .m-quick-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .m-quick-q-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .m-quick-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .m-quick-opt {
            flex: 1;
            min-width: 70px;
            padding: 10px 8px;
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .m-quick-opt:active {
            transform: scale(0.96);
        }
        .m-quick-opt.selected {
            border-color: var(--color-primary);
            background: var(--color-primary-bg);
            color: var(--color-primary);
            font-weight: 500;
        }
        .m-quick-opt-score {
            font-size: 11px;
            opacity: 0.8;
            margin-top: 2px;
        }
        .m-upload-section {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border-top: 1px solid var(--border-light);
            padding: 12px 16px;
            display: flex;
            gap: 10px;
        }
        .m-btn {
            flex: 1;
            height: 48px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .m-btn-primary {
            background: #DC2626;
            color: white;
        }
        .m-btn-primary:active {
            background: #B91C1C;
            transform: scale(0.98);
        }
        .m-btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }
        .m-btn-secondary:active {
            background: var(--bg-gray);
            transform: scale(0.98);
        }
        .m-upload-preview {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--bg-secondary);
        }
        .m-upload-item {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .m-upload-item.has-image {
            border-style: solid;
            border-color: var(--border-light);
        }
        .m-upload-item svg {
            width: 24px;
            height: 24px;
            color: var(--text-tertiary);
        }
        .m-upload-close {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .m-upload-close svg {
            width: 12px;
            height: 12px;
            color: white;
        }
        .m-uploading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            font-size: 12px;
        }
        .m-uploading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .m-start-btn {
            margin: 16px;
            width: calc(100% - 32px);
            height: 48px;
            background: #DC2626;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .m-start-btn:active {
            background: #B91C1C;
            transform: scale(0.98);
        }
        .m-start-btn:disabled {
            background: var(--bg-gray);
            color: var(--text-tertiary);
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="m-container">
    <div class="m-phone">
        <!-- 状态栏 -->
        <div class="m-status-bar" style="color: white; background: #DC2626;">
            <span class="m-status-time">9:41</span>
            <div class="m-status-icons">
                <svg width="16" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <svg width="16" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M2 22h20V2z"/></svg>
                <svg width="24" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="m-navbar m-navbar-solid" style="background: #DC2626; color: white;">
            <div class="m-navbar-back" onclick="goBack()" style="color: white;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
            </div>
            <div class="m-navbar-title" style="color: white;">纸质补录</div>
            <div style="width: 20px;"></div>
        </div>

        <!-- 内容区 -->
        <div class="m-content m-scroll" id="paper-content" style="padding-top: 0; padding-bottom: 80px; background: var(--bg-secondary);">
            <!-- 红色头部 -->
            <div class="m-paper-header">
                <div class="m-paper-title">纸质表单补录</div>
                <div class="m-paper-subtitle">快速录入纸质评估结果，支持拍照上传</div>
            </div>

            <!-- 选择老人 -->
            <div class="m-select-section">
                <div class="m-select-label">选择老人</div>
                <div class="m-select-picker" onclick="showElderPicker()">
                    <span class="m-select-value" id="elder-value">请选择评估老人</span>
                    <svg class="m-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <!-- 选择量表 -->
            <div class="m-select-section">
                <div class="m-select-label">选择量表</div>
                <div class="m-select-picker" onclick="showScalePicker()">
                    <span class="m-select-value" id="scale-value">请选择评估量表</span>
                    <svg class="m-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
            </div>

            <!-- 开始补录按钮 -->
            <button class="m-start-btn" id="start-btn" onclick="startEntry()" disabled>开始补录</button>

            <!-- 快速录入区域（默认隐藏） -->
            <div id="entry-section" style="display: none;">
                <div class="m-quick-questions" style="padding-top: 12px;">
                    <div class="m-quick-card">
                        <div class="m-quick-q-title">1. 进食</div>
                        <div class="m-quick-options">
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 10)">独立
                                <div class="m-quick-opt-score">10分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 5)">需帮助
                                <div class="m-quick-opt-score">5分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 0)">依赖
                                <div class="m-quick-opt-score">0分</div>
                            </div>
                        </div>
                    </div>
                    <div class="m-quick-card">
                        <div class="m-quick-q-title">2. 洗澡</div>
                        <div class="m-quick-options">
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 5)">独立
                                <div class="m-quick-opt-score">5分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 3)">需帮助
                                <div class="m-quick-opt-score">3分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 0)">依赖
                                <div class="m-quick-opt-score">0分</div>
                            </div>
                        </div>
                    </div>
                    <div class="m-quick-card">
                        <div class="m-quick-q-title">3. 穿衣</div>
                        <div class="m-quick-options">
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 10)">独立
                                <div class="m-quick-opt-score">10分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 5)">需帮助
                                <div class="m-quick-opt-score">5分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 0)">依赖
                                <div class="m-quick-opt-score">0分</div>
                            </div>
                        </div>
                    </div>
                    <div class="m-quick-card">
                        <div class="m-quick-q-title">4. 床椅转移</div>
                        <div class="m-quick-options">
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 15)">独立
                                <div class="m-quick-opt-score">15分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 10)">小助
                                <div class="m-quick-opt-score">10分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 5)">大助
                                <div class="m-quick-opt-score">5分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 0)">依赖
                                <div class="m-quick-opt-score">0分</div>
                            </div>
                        </div>
                    </div>
                    <div class="m-quick-card">
                        <div class="m-quick-q-title">5. 平地行走</div>
                        <div class="m-quick-options">
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 15)">独立
                                <div class="m-quick-opt-score">15分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 10)">需帮助
                                <div class="m-quick-opt-score">10分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 5)">大助
                                <div class="m-quick-opt-score">5分</div>
                            </div>
                            <div class="m-quick-opt" onclick="selectQuickOpt(this, 0)">依赖
                                <div class="m-quick-opt-score">0分</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 拍照上传预览 -->
                <div class="m-upload-preview" id="upload-preview" style="display: none;">
                    <div class="m-upload-item has-image" id="photo-1">
                        <div class="m-uploading" id="uploading-1" style="display: none;">
                            <div class="m-uploading-spinner"></div>
                            <span>上传中</span>
                        </div>
                        <div class="m-upload-close" onclick="removePhoto(1)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                        </div>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                    </div>
                    <div class="m-upload-item" onclick="uploadPhoto()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部操作 -->
        <div class="m-upload-section" id="bottom-section" style="display: none;">
            <button class="m-btn m-btn-secondary" onclick="uploadPhoto()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                拍照上传
            </button>
            <button class="m-btn m-btn-primary" onclick="submitPaperEntry()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                提交补录
            </button>
        </div>
    </div>
</div>

<script>
    let elderSelected = false;
    let scaleSelected = false;

    function goBack() {
        window.location.href = 'tasks.html';
    }

    function showElderPicker() {
        document.getElementById('elder-value').textContent = '张桂英 · 女 · 78岁';
        document.getElementById('elder-value').classList.remove('placeholder');
        elderSelected = true;
        checkCanStart();
    }

    function showScalePicker() {
        document.getElementById('scale-value').textContent = 'ADL量表（Barthel指数）';
        document.getElementById('scale-value').classList.remove('placeholder');
        scaleSelected = true;
        checkCanStart();
    }

    function checkCanStart() {
        const btn = document.getElementById('start-btn');
        btn.disabled = !(elderSelected && scaleSelected);
    }

    function startEntry() {
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('entry-section').style.display = 'block';
        document.getElementById('bottom-section').style.display = 'flex';
        document.getElementById('paper-content').style.paddingBottom = '80px';
    }

    function selectQuickOpt(el, score) {
        const options = el.parentElement.querySelectorAll('.m-quick-opt');
        options.forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
    }

    function uploadPhoto() {
        document.getElementById('upload-preview').style.display = 'flex';
        document.getElementById('photo-1').style.display = 'flex';
        document.getElementById('uploading-1').style.display = 'flex';
        
        setTimeout(() => {
            document.getElementById('uploading-1').style.display = 'none';
        }, 2000);
    }

    function removePhoto(num) {
        document.getElementById('photo-' + num).style.display = 'none';
    }

    function submitPaperEntry() {
        alert('补录提交成功，等待审核');
        window.location.href = 'tasks.html';
    }
</script>
</body>
</html>
