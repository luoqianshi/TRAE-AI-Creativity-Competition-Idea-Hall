  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;700&display=swap');
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background-color: #f9fafb; }

    #root { min-height: 100dvh; }
    .card { border-radius: 1rem; background: white; padding: 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

    .input-base {
      width: 100%; border-radius: 0.75rem; border: 1px solid #e5e7eb; background: #f9fafb;

    .btn-primary:hover { background: #d97706; }
    .dark .btn-primary { background: #d97706; }
    .dark .btn-primary:hover { background: #b45309; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      border-radius: 9999px; background: #f3f4f6; color: #374151; padding: 0.625rem 1.5rem;
      font-size: 0.875rem; font-weight: 500; border: none; cursor: pointer; transition: all 0.15s;

    .btn-secondary:active { transform: scale(0.95); }

    @keyframes toastSlideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.25s ease-out; }

</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-type="text/javascript">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    const { PieChart, Pie, Cell, LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid } = Recharts;

    // ==================== 工具函数 ====================
    const WEEK_DAYS = ['一','二','三','四','五','六','日'];
    const MOOD_VALUE = { good: 3, normal: 2, bad: 1 };
    const MOOD_COLOR = { good: '#10B981', normal: '#94A3B8', bad: '#EF4444' };
    const MOOD_LABEL = { good: '好', normal: '一般', bad: '差' };

    function formatDateStr(d) {
      const dt = d instanceof Date ? d : new Date(d);
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function formatDuration(mins) {
      if (!mins) return '0分钟';
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (h === 0) return `${m}分钟`;
      if (m === 0) return `${h}小时`;
      return `${h}小时${m}分钟`;
    }

    function formatDisplayDate(d) {
      const dt = d instanceof Date ? d : new Date(d);
      const weekNames = ['日','一','二','三','四','五','六'];
      return `${dt.getMonth()+1}月${dt.getDate()}日 星期${weekNames[dt.getDay()]}`;
    }

    function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }

    function getWeekRange(d) {
      const dt = new Date(d);
      const day = dt.getDay();
      const diff = day === 0 ? 6 : day - 1;
      const start = new Date(dt);
      start.setDate(dt.getDate() - diff);
      start.setHours(0,0,0,0);
      const end = addDays(start, 6);
      end.setHours(23,59,59,999);
      return { start, end };
    }

    function getMonthRange(d) {
      const dt = new Date(d);
      const start = new Date(dt.getFullYear(), dt.getMonth(), 1);
      const end = new Date(dt.getFullYear(), dt.getMonth() + 1, 0);
      return { start, end };
    }

    function eachDayOfInterval(start, end) {
      const days = [];
      let cur = new Date(start);
      while (cur <= end) {
        days.push(new Date(cur));
        cur = addDays(cur, 1);
      }
      return days;
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function isToday(d) { return isSameDay(d, new Date()); }

    function startOfWeek(d) {
      const dt = new Date(d);
      const day = dt.getDay();
      const diff = day === 0 ? 6 : day - 1;
      const r = new Date(dt);
      r.setDate(dt.getDate() - diff);
      return r;
    }

    function endOfWeek(d) {
      const s = startOfWeek(d);
      return addDays(s, 6);
    }

    // ==================== mockDB ====================
    const mockDB = {
      _get(key) {
        try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
      },
      _set(key, val) {
        localStorage.setItem(key, JSON.stringify(val));
      },

      getCurrentUser() {
        return this._get('review_app_current_user');
      },

      register(email, password, nickname) {
        const users = this._get('review_app_users') || [];
        if (users.find(u => u.email === email)) throw new Error('邮箱已注册');
        const user = { id: Date.now(), email, nickname: nickname || email.split('@')[0], password };
        users.push(user);
        this._set('review_app_users', users);
        this._set('review_app_current_user', { id: user.id, email: user.email, nickname: user.nickname });
        return user;
      },

      login(email, password) {
        const users = this._get('review_app_users') || [];
        const user = users.find(u => u.email === email && u.password === password);
        if (!user) throw new Error('邮箱或密码错误');
        this._set('review_app_current_user', { id: user.id, email: user.email, nickname: user.nickname });
        return user;
      },

      logout() {
        localStorage.removeItem('review_app_current_user');
      },

      getRecords(startDate, endDate) {
        const records = this._get('review_app_records') || [];
        return records.filter(r => {
          if (startDate && r.date < startDate) return false;
          if (endDate && r.date > endDate) return false;
          return true;
        }).sort((a, b) => b.date.localeCompare(a.date));
      },

      getRecordByDate(date) {
        const records = this._get('review_app_records') || [];
        return records.find(r => r.date === date) || null;
      },

      saveRecord(data) {
        const records = this._get('review_app_records') || [];
        const idx = records.findIndex(r => r.date === data.date);
        const record = {
          date: data.date,
          progress: data.progress,
          progress_note: data.progressNote || '',
          mood: data.mood,
          mood_note: data.moodNote || '',
          math_content: data.mathContent || '',
          math_duration: data.mathMinutes || 0,
          course858_content: data.course858Content || '',
          course858_duration: data.course858Minutes || 0,
        };
        if (idx >= 0) {
          records[idx] = { ...records[idx], ...record };
        } else {
          records.push(record);
        }
        this._set('review_app_records', records);
        return record;
      },

      getImportantDates() {
        return this._get('review_app_important_dates') || [];
      },

      saveImportantDate(data) {
        const dates = this._get('review_app_important_dates') || [];
        if (data.id) {
          const idx = dates.findIndex(d => d.id === data.id);
          if (idx >= 0) dates[idx] = { ...dates[idx], ...data };
        } else {
          const item = { id: Date.now(), start_date: data.startDate, end_date: data.endDate, label: data.label };
          dates.push(item);
          this._set('review_app_important_dates', dates);
          return item;
        }
        this._set('review_app_important_dates', dates);
        return data;
      },

      deleteImportantDate(id) {
        let dates = this._get('review_app_important_dates') || [];
        dates = dates.filter(d => d.id !== id);
        this._set('review_app_important_dates', dates);
      },

      getSettings() {
        return this._get('review_app_settings') || {
          darkMode: false,
          reminderEnabled: true,
          reminderTime: '21:00',
          dailyGoalMinutes: 240,
          streakGoalDays: 30,
        };
      },

      updateSettings(data) {
        const settings = { ...this.getSettings(), ...data };
        this._set('review_app_settings', settings);
        return settings;
      },

      getAnalysis(type, period, date) {
        const refDate = new Date(date);
        const range = period === 'week' ? getWeekRange(refDate) : getMonthRange(refDate);
        const records = this.getRecords(formatDateStr(range.start), formatDateStr(range.end));

        if (type === 'mood') {
          const dist = { good: 0, normal: 0, bad: 0 };
          const trend = [];
          const notes = [];
          records.forEach(r => {
            if (r.mood) dist[r.mood] = (dist[r.mood] || 0) + 1;
          });
          const allDays = eachDayOfInterval(range.start, range.end);
          allDays.forEach(day => {
            const rec = records.find(r => r.date === formatDateStr(day));
            trend.push({
              date: formatDateStr(day),
              value: rec ? MOOD_VALUE[rec.mood] || 0 : 0,
            });
            if (rec && rec.mood_note) {
              notes.push({ date: rec.date, note: rec.mood_note, mood: rec.mood });
            }
          });
          return { distribution: dist, trend, notes };
        }

        if (type === 'progress') {
          const dist = { good: 0, normal: 0, bad: 0 };
          const trend = [];
          const notes = [];
          records.forEach(r => {
            if (r.progress) dist[r.progress] = (dist[r.progress] || 0) + 1;
          });
          const allDays = eachDayOfInterval(range.start, range.end);
          allDays.forEach(day => {
            const rec = records.find(r => r.date === formatDateStr(day));
            trend.push({
              date: formatDateStr(day),
              value: rec ? MOOD_VALUE[rec.progress] || 0 : 0,
            });
            if (rec && rec.progress_note) {
              notes.push({ date: rec.date, note: rec.progress_note, progress: rec.progress });
            }
          });
          return { distribution: dist, trend, notes };
        }

        if (type === 'math') {
          let totalDuration = 0;
          const trend = [];
          const contents = [];
          records.forEach(r => {
            totalDuration += r.math_duration || 0;
            if (r.math_duration > 0) {
              trend.push({ date: r.date, duration: r.math_duration });
            }
            if (r.math_content) {
              contents.push({ date: r.date, content: r.math_content });
            }
          });
          return { totalDuration, trend, contents };
        }

        if (type === 'course858') {
          let totalDuration = 0;
          const trend = [];
          const contents = [];
          records.forEach(r => {
            totalDuration += r.course858_duration || 0;
            if (r.course858_duration > 0) {
              trend.push({ date: r.date, duration: r.course858_duration });
            }
            if (r.course858_content) {
              contents.push({ date: r.date, content: r.course858_content });
            }
          });
          return { totalDuration, trend, contents };
        }

        return null;
      },

      getPomodoroSessions(date) {
        const sessions = this._get('review_app_pomodoro') || [];
        const filtered = sessions.filter(s => s.date === date);
        const count = filtered.length;
        const totalDuration = filtered.reduce((sum, s) => sum + s.duration, 0);
        return { sessions: filtered, summary: { count, totalDuration } };
      },

      savePomodoroSession(data) {
        const sessions = this._get('review_app_pomodoro') || [];
        sessions.push({ id: Date.now(), ...data });
        this._set('review_app_pomodoro', sessions);
      },

      getMaterials() {
        return this._get('review_app_materials') || [];
      },

      deleteMaterial(id) {
        let materials = this._get('review_app_materials') || [];
        materials = materials.filter(m => m.id !== id);
        this._set('review_app_materials', materials);
      },

      getStreakDays() {
        const records = this._get('review_app_records') || [];
        if (records.length === 0) return 0;
        const sortedDates = records.map(r => r.date).sort().reverse();
        let streak = 0;
        let checkDate = new Date();
        checkDate.setHours(0,0,0,0);
        for (let i = 0; i < 365; i++) {
          const dateStr = formatDateStr(checkDate);
          if (sortedDates.includes(dateStr)) {
            streak++;
            checkDate = addDays(checkDate, -1);
          } else {
            break;
          }
        }
        return streak;
      },
    };

    // ==================== 预填充演示数据 ====================
    function seedDemoData() {
      if (mockDB._get('review_app_seeded')) return;
      const levels = ['good', 'normal', 'bad'];
      const mathTopics = [
        '高等数学极限与连续', '微分中值定理', '不定积分计算', '定积分应用',
        '多元函数微分学', '重积分计算', '曲线积分与曲面积分', '无穷级数',
        '常微分方程', '线性代数行列式', '矩阵运算与逆矩阵', '向量与线性方程组',
        '特征值与特征向量', '二次型', '概率论随机事件与概率',
      ];
      const course858Topics = [
        '数据结构链表与树', '图的遍历与最短路径', '排序算法比较',
        '动态规划专题', '贪心算法应用', '分治法与回溯', '计算机网络协议栈',
        '操作系统进程管理', '内存管理与虚拟内存', '文件系统与IO',
        '数据库关系代数', 'SQL查询优化', '事务与并发控制',
      ];
      const progressNotes = ['效率不错', '有点走神', '状态很好', '比较疲惫', '正常发挥', '今天特别专注', '需要加强'];
      const moodNotes = ['心态平稳', '有点焦虑', '信心满满', '压力较大', '放松状态', '需要调整'];

      const records = [];
      for (let i = 1; i <= 14; i++) {
        const d = addDays(new Date(), -i);
        const dateStr = formatDateStr(d);
        const progress = levels[Math.floor(Math.random() * 3)];
        const mood = levels[Math.floor(Math.random() * 3)];
        const mathHours = 1 + Math.floor(Math.random() * 3);
        const mathMins = Math.floor(Math.random() * 60);
        const c858Hours = 1 + Math.floor(Math.random() * 2);
        const c858Mins = Math.floor(Math.random() * 60);
        records.push({
          date: dateStr,
          progress,
          progress_note: Math.random() > 0.4 ? progressNotes[Math.floor(Math.random() * progressNotes.length)] : '',
          mood,
          mood_note: Math.random() > 0.5 ? moodNotes[Math.floor(Math.random() * moodNotes.length)] : '',
          math_content: mathTopics[Math.floor(Math.random() * mathTopics.length)],
          math_duration: mathHours * 60 + mathMins,
          course858_content: course858Topics[Math.floor(Math.random() * course858Topics.length)],
          course858_duration: c858Hours * 60 + c858Mins,
        });
      }
      mockDB._set('review_app_records', records);

      // 重点日期
      const today = new Date();
      mockDB._set('review_app_important_dates', [
        { id: 1, start_date: formatDateStr(addDays(today, 30)), end_date: formatDateStr(addDays(today, 32)), label: '考研初试' },
        { id: 2, start_date: formatDateStr(addDays(today, 60)), end_date: formatDateStr(addDays(today, 60)), label: '复试' },
        { id: 3, start_date: formatDateStr(addDays(today, 7)), end_date: formatDateStr(addDays(today, 7)), label: '模拟考试' },
      ]);

      // 资料
      mockDB._set('review_app_materials', [
        { id: 1, name: '高等数学复习全书.pdf', category: '数学', file_url: 'test.pdf', created_at: new Date().toISOString() },
        { id: 2, name: '数据结构笔记.pdf', category: '858', file_url: 'test.pdf', created_at: new Date().toISOString() },
        { id: 3, name: '历年真题汇总.pdf', category: '其他', file_url: 'test.pdf', created_at: new Date().toISOString() },
      ]);

      // 默认用户
      mockDB._set('review_app_users', [{ id: 1, email: 'demo@test.com', nickname: '考研人', password: '123456' }]);
      mockDB._set('review_app_current_user', { id: 1, email: 'demo@test.com', nickname: '考研人' });

      mockDB._set('review_app_seeded', true);
    }
    seedDemoData();

    // ==================== SVG 图标组件 ====================
    function IconHome({ size = 22, active }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={active ? 2.2 : 1.8} strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    }
    function IconCalendar({ size = 22, active }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={active ? 2.2 : 1.8} strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    }
    function IconBarChart({ size = 22, active }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={active ? 2.2 : 1.8} strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>;
    }
    function IconFolder({ size = 22, active }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={active ? 2.2 : 1.8} strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>;
    }
    function IconUser({ size = 22, active }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={active ? 2.2 : 1.8} strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    }
    function IconChevronLeft({ size = 20 }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>;
    }
    function IconChevronRight({ size = 20 }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;
    }
    function IconArrowLeft({ size = 18 }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>;
    }
    function IconPlus({ size = 18 }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
    }
    function IconX({ size = 20 }) {
      return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;

    // ==================== FaceIcon 组件 ====================
    function FaceIcon({ type, size = 48, selected = false, onClick }) {
      const config = { good: { color: '#10B981', glowClass: 'face-glow-good', label: '好' }, normal: { color: '#64748B', glowClass: 'face-glow-normal', label: '一般' }, bad: { color: '#EF4444', glowClass: 'face-glow-bad', label: '差' } };
      const c = config[type];
      const s = size;
      const cx = s / 2, cy = s / 2, r = s / 2 - 2, faceR = r * 0.7;

      return (
        <button type="button" onClick={onClick} className={`flex flex-col items-center gap-1 transition-transform ${selected ? 'scale-110' : ''} ${onClick ? 'cursor-pointer active:scale-95' : ''}`}>
          <div className={`rounded-full transition-all duration-200 ${selected ? c.glowClass : ''} ${selected ? 'face-icon-bounce' : ''}`} style={{ width: s, height: s }}>
            <svg width={s} height={s} viewBox={`0 0 ${s} ${s}`} fill="none">
              <circle cx={cx} cy={cy} r={r} fill={selected ? c.color : '#F3F4F6'} stroke={c.color} strokeWidth={selected ? 0 : 2} className="transition-all duration-200" style={selected ? {} : {}} />
              {type === 'good' && <>
                <circle cx={cx - faceR * 0.35} cy={cy - faceR * 0.15} r={s * 0.035} fill={selected ? '#fff' : c.color} />
                <circle cx={cx + faceR * 0.35} cy={cy - faceR * 0.15} r={s * 0.035} fill={selected ? '#fff' : c.color} />
              </>}
              {type === 'normal' && <>
                <line x1={cx - faceR * 0.45} y1={cy - faceR * 0.15} x2={cx - faceR * 0.2} y2={cy - faceR * 0.15} stroke={selected ? '#fff' : c.color} strokeWidth={2} strokeLinecap="round" />
                <line x1={cx + faceR * 0.2} y1={cy - faceR * 0.15} x2={cx + faceR * 0.45} y2={cy - faceR * 0.15} stroke={selected ? '#fff' : c.color} strokeWidth={2} strokeLinecap="round" />
              </>}
              {type === 'bad' && <>
                <circle cx={cx - faceR * 0.35} cy={cy - faceR * 0.05} r={s * 0.035} fill={selected ? '#fff' : c.color} />
                <circle cx={cx + faceR * 0.35} cy={cy - faceR * 0.05} r={s * 0.035} fill={selected ? '#fff' : c.color} />
                <line x1={cx - faceR * 0.5} y1={cy - faceR * 0.35} x2={cx - faceR * 0.2} y2={cy - faceR * 0.25} stroke={selected ? '#fff' : c.color} strokeWidth={2} strokeLinecap="round" />
                <line x1={cx + faceR * 0.5} y1={cy - faceR * 0.35} x2={cx + faceR * 0.2} y2={cy - faceR * 0.25} stroke={selected ? '#fff' : c.color} strokeWidth={2} strokeLinecap="round" />
              </>}
              {type === 'good' && <path d={`M ${cx - faceR * 0.3} ${cy + faceR * 0.2} Q ${cx} ${cy + faceR * 0.55} ${cx + faceR * 0.3} ${cy + faceR * 0.2}`} stroke={selected ? '#fff' : c.color} strokeWidth={2} strokeLinecap="round" fill="none" />}
              {type === 'normal' && <line x1={cx - faceR * 0.25} y1={cy + faceR * 0.3} x2={cx + faceR * 0.25} y2={cy + faceR * 0.3} stroke={selected ? '#fff' : c.color} strokeWidth={2} strokeLinecap="round" />}
              {type === 'bad' && <path d={`M ${cx - faceR * 0.3} ${cy + faceR * 0.4} Q ${cx} ${cy + faceR * 0.1} ${cx + faceR * 0.3} ${cy + faceR * 0.4}`} stroke={selected ? '#fff' : c.color} strokeWidth={2} strokeLinecap="round" fill="none" />}
            </svg>
          </div>
          <span className={`text-xs transition-colors ${selected ? 'font-medium' : 'text-gray-400 dark:text-gray-500'}`} style={selected ? { color: c.color } : undefined}>{c.label}</span>
        </button>
      );
    }

    // ==================== 首页 ====================
    function HomePage({ navigate }) {
      const [progress, setProgress] = useState(null);
      const [progressNote, setProgressNote] = useState('');
      const [mood, setMood] = useState(null);
      const [moodNote, setMoodNote] = useState('');
      const [mathContent, setMathContent] = useState('');
      const [mathHours, setMathHours] = useState(0);
      const [mathMinutes, setMathMinutes] = useState(0);
      const [course858Content, setCourse858Content] = useState('');
      const [course858Hours, setCourse858Hours] = useState(0);
      const [course858Minutes, setCourse858Minutes] = useState(0);
      const [toast, setToast] = useState(null);
      const [showPomodoro, setShowPomodoro] = useState(false);
      const [streakDays, setStreakDays] = useState(0);

      useEffect(() => {
        const today = formatDateStr(new Date());
        const record = mockDB.getRecordByDate(today);
        if (record) {
          setProgress(record.progress);
          setProgressNote(record.progress_note || '');
          setMood(record.mood);
          setMoodNote(record.mood_note || '');
          setMathContent(record.math_content || '');
          setMathHours(Math.floor((record.math_duration || 0) / 60));
          setMathMinutes((record.math_duration || 0) % 60);
          setCourse858Content(record.course858_content || '');
          setCourse858Hours(Math.floor((record.course858_duration || 0) / 60));
          setCourse858Minutes((record.course858_duration || 0) % 60);
        }
        setStreakDays(mockDB.getStreakDays());
      }, []);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2000); };

      const handleSave = () => {
        if (!progress || !mood) { showToast('请选择今日进度和心态'); return; }
        mockDB.saveRecord({
          date: formatDateStr(new Date()),
          progress, progressNote: progressNote.trim(),

    // ==================== 番茄钟弹窗 ====================
    function PomodoroModal({ onClose }) {
      const FOCUS_SECONDS = 25 * 60;
      const BREAK_SECONDS = 5 * 60;
      const RADIUS = 90;
      const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

      const [mode, setMode] = useState('focus');
      const [status, setStatus] = useState('idle');
      const [timeLeft, setTimeLeft] = useState(FOCUS_SECONDS);
      const [subject, setSubject] = useState('数学');
      const [toast, setToast] = useState(null);
      const [todayCount, setTodayCount] = useState(0);
      const [todayMinutes, setTodayMinutes] = useState(0);
      const modeRef = useRef(mode);
      const subjectRef = useRef(subject);
      modeRef.current = mode;
      subjectRef.current = subject;

      const fetchStats = useCallback(() => {
        const result = mockDB.getPomodoroSessions(formatDateStr(new Date()));
        setTodayCount(result.summary.count);
        setTodayMinutes(result.summary.totalDuration);
      }, []);

      useEffect(() => { fetchStats(); }, [fetchStats]);

      useEffect(() => {
        if (status !== 'running') return;
        const id = setInterval(() => setTimeLeft(prev => prev <= 1 ? 0 : prev - 1), 1000);
        return () => clearInterval(id);
      }, [status]);

      useEffect(() => {
        if (timeLeft > 0 || status !== 'running') return;
        setStatus('idle');
        if (modeRef.current === 'focus') {
          mockDB.savePomodoroSession({ date: formatDateStr(new Date()), duration: 25, course: subjectRef.current });
          setToast('专注完成！休息5分钟');
          setTimeout(() => setToast(null), 3000);
          setMode('break');
          setTimeLeft(BREAK_SECONDS);
          fetchStats();
        } else {
          setMode('focus');
          setTimeLeft(FOCUS_SECONDS);
        }
      }, [timeLeft, status, fetchStats]);

      const toggleTimer = () => setStatus(s => s === 'running' ? 'paused' : 'running');
      const resetTimer = () => { setStatus('idle'); setTimeLeft(mode === 'focus' ? FOCUS_SECONDS : BREAK_SECONDS); };
      const completeEarly = () => {
        if (mode !== 'focus' || status === 'idle') return;
        setStatus('idle');
        const elapsed = FOCUS_SECONDS - timeLeft;
        if (elapsed > 60) {
          mockDB.savePomodoroSession({ date: formatDateStr(new Date()), duration: Math.round(elapsed / 60), course: subject });
          fetchStats();
        }
        setToast('专注已记录');
        setTimeout(() => setToast(null), 2000);
        setMode('break');
        setTimeLeft(BREAK_SECONDS);
      };

      const totalSeconds = mode === 'focus' ? FOCUS_SECONDS : BREAK_SECONDS;
      const progress = timeLeft / totalSeconds;
      const dashOffset = CIRCUMFERENCE * (1 - progress);
      const mins = String(Math.floor(timeLeft / 60)).padStart(2, '0');
      const secs = String(timeLeft % 60).padStart(2, '0');

      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center">
          <div className="absolute inset-0 bg-black/40" onClick={onClose} />
          <div className="relative z-10 w-full max-w-[480px] animate-slide-up rounded-t-3xl bg-white px-6 pb-8 pt-5 dark:bg-gray-800">
            <div className="mx-auto mb-5 flex w-48 rounded-full bg-gray-100 p-1 dark:bg-gray-700">
              {['focus', 'break'].map(m => (
                <button key={m} type="button" onClick={() => { if (status !== 'idle') return; setMode(m); setTimeLeft(m === 'focus' ? FOCUS_SECONDS : BREAK_SECONDS); }}
                  className={`flex-1 rounded-full py-1.5 text-sm font-medium transition-colors ${mode === m ? 'bg-amber-400 text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'} ${status !== 'idle' && mode !== m ? 'opacity-50' : ''}`}>
                  {m === 'focus' ? '专注' : '休息'}
                </button>
              ))}
            </div>
            {mode === 'focus' && (
              <div className="mb-4 flex justify-center gap-2">
                {['数学', '858'].map(s => (
                  <button key={s} type="button" onClick={() => status === 'idle' && setSubject(s)}
                    className={`rounded-full px-4 py-1 text-xs font-medium transition-colors ${subject === s ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400' : 'bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400'} ${status !== 'idle' ? 'opacity-50' : ''}`}>
                    {s}
                  </button>
                ))}
              </div>
            )}
            <div className="relative mx-auto mb-6 flex items-center justify-center" style={{ width: 220, height: 220 }}>
              <svg className="absolute" width={220} height={220}>
                <circle cx={110} cy={110} r={RADIUS} fill="none" strokeWidth={8} stroke="currentColor" className="text-gray-100 dark:text-gray-700" />
                <circle cx={110} cy={110} r={RADIUS} fill="none" strokeWidth={8} strokeLinecap="round" stroke="currentColor" strokeDasharray={CIRCUMFERENCE} strokeDashoffset={dashOffset} className="text-amber-400 dark:text-amber-500" style={{ transform: 'rotate(-90deg)', transformOrigin: '110px 110px', transition: 'stroke-dashoffset 0.5s ease' }} />
              </svg>
              <span className="text-5xl font-medium tracking-wider text-gray-800 dark:text-gray-100" style={{ fontFamily: "'DM Mono', monospace" }}>{mins}:{secs}</span>
            </div>
            <div className="flex items-center justify-center gap-5">
              <button type="button" onClick={resetTimer} className="flex h-11 w-11 items-center justify-center rounded-full bg-gray-100 text-gray-500 transition-colors active:scale-90 dark:bg-gray-700 dark:text-gray-400"><IconRotateCcw /></button>
              <button type="button" onClick={toggleTimer} className="flex h-14 w-14 items-center justify-center rounded-full bg-amber-400 text-white shadow-lg transition-transform active:scale-90 dark:bg-amber-500">
                {status === 'running' ? <IconPause /> : <IconPlay />}
              </button>
              <button type="button" onClick={completeEarly} disabled={mode !== 'focus' || status === 'idle'} className="flex h-11 w-11 items-center justify-center rounded-full bg-gray-100 text-gray-500 transition-colors active:scale-90 disabled:opacity-30 dark:bg-gray-700 dark:text-gray-400"><IconCheck size={20} /></button>
            </div>
            <div className="mt-5 text-center text-xs text-gray-400 dark:text-gray-500">今日专注 {todayCount} 次，共 {todayMinutes} 分钟</div>
            {toast && (
              <div className="toast-enter absolute left-1/2 top-2 -translate-x-1/2">
                <div className="rounded-full bg-gray-800 px-4 py-1.5 text-sm text-white shadow-lg dark:bg-gray-200 dark:text-gray-800">{toast}</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==================== 日历页 ====================
    function CalendarPage({ navigate }) {
      const [currentMonth, setCurrentMonth] = useState(new Date());
      const [records, setRecords] = useState([]);
      const [importantDates, setImportantDates] = useState([]);
      const [selectedDate, setSelectedDate] = useState(null);
      const [selectedRecord, setSelectedRecord] = useState(null);
      const [showMarkDialog, setShowMarkDialog] = useState(false);
      const [markDate, setMarkDate] = useState(null);
      const [markName, setMarkName] = useState('');
      const longPressTimer = useRef(null);

      useEffect(() => {
        const monthStart = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
        const monthEnd = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
        const calStart = startOfWeek(monthStart);
        const calEnd = endOfWeek(monthEnd);
        const recs = mockDB.getRecords(formatDateStr(calStart), formatDateStr(calEnd));
        setRecords(recs);
        setImportantDates(mockDB.getImportantDates());
      }, [currentMonth]);

      const monthStart = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
      const monthEnd = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
      const calStart = startOfWeek(monthStart);
      const calEnd = endOfWeek(monthEnd);
      const allDays = eachDayOfInterval(calStart, calEnd);
      const recordMap = new Map();
      records.forEach(r => recordMap.set(r.date, r));
      const importantSet = new Set();
      importantDates.forEach(imp => {
        const start = new Date(imp.start_date);
        const end = new Date(imp.end_date);
        let cur = new Date(start);
        while (cur <= end) {
          importantSet.add(formatDateStr(cur));
          cur = addDays(cur, 1);
        }
      });

      const days = allDays.map(date => ({
        date,
        isCurrentMonth: date.getMonth() === currentMonth.getMonth(),
        record: recordMap.get(formatDateStr(date)) || null,
        isImportant: importantSet.has(formatDateStr(date)),
      }));

      const handleDayClick = (day) => {
        if (!day.record) return;
        setSelectedDate(day.date);
        setSelectedRecord(day.record);
      };
      const handleLongPressStart = (day) => {
        longPressTimer.current = setTimeout(() => { setMarkDate(day.date); setMarkName(''); setShowMarkDialog(true); }, 600);
      };
      const handleLongPressEnd = () => {
        if (longPressTimer.current) { clearTimeout(longPressTimer.current); longPressTimer.current = null; }
      };
      const handleSaveMark = () => {
        if (!markDate || !markName.trim()) return;
        mockDB.saveImportantDate({ startDate: formatDateStr(markDate), endDate: formatDateStr(markDate), label: markName.trim() });
        setImportantDates(mockDB.getImportantDates());
        setShowMarkDialog(false);
      };

      const monthLabel = `${currentMonth.getFullYear()}年${currentMonth.getMonth() + 1}月`;

      return (
        <div className="px-4 pb-24 pt-2">
          <div className="mb-4 flex items-center justify-center gap-4">
            <button type="button" onClick={() => setCurrentMonth(m => new Date(m.getFullYear(), m.getMonth() - 1))} className="rounded-full p-1.5 transition-colors hover:bg-gray-100 dark:hover:bg-gray-700">
              <span className="text-gray-500 dark:text-gray-400"><IconChevronLeft /></span>
            </button>
            <span className="min-w-[120px] text-center text-base font-semibold text-gray-800 dark:text-gray-100">{monthLabel}</span>
            <button type="button" onClick={() => setCurrentMonth(m => new Date(m.getFullYear(), m.getMonth() + 1))} className="rounded-full p-1.5 transition-colors hover:bg-gray-100 dark:hover:bg-gray-700">
              <span className="text-gray-500 dark:text-gray-400"><IconChevronRight /></span>
            </button>
          </div>

          <div className="card overflow-hidden p-0">
            <div className="grid grid-cols-7 border-b border-gray-100 dark:border-gray-700">
              {WEEK_DAYS.map(d => <div key={d} className="py-2 text-center text-xs font-medium text-gray-400 dark:text-gray-500">{d}</div>)}
            </div>
            <div className="grid grid-cols-7">
              {days.map((day, i) => {
                const dayNum = day.date.getDate();
                const today = isToday(day.date);
                const hasRecord = !!day.record;
                const faceType = day.record?.progress;
                return (
                  <div key={i}
                    className={`relative flex min-h-[56px] flex-col items-center justify-center border-b border-r border-gray-50 py-1 dark:border-gray-700/50 ${!day.isCurrentMonth ? 'opacity-30' : ''} ${hasRecord ? 'cursor-pointer active:bg-gray-50 dark:active:bg-gray-700/50' : ''}`}
                    onClick={() => handleDayClick(day)}
                    onTouchStart={() => handleLongPressStart(day)}
                    onTouchEnd={handleLongPressEnd}
                    onMouseDown={() => handleLongPressStart(day)}
                    onMouseUp={handleLongPressEnd}
                    onMouseLeave={handleLongPressEnd}
                  >
                    <span className={`text-xs leading-none ${today ? 'flex h-5 w-5 items-center justify-center rounded-full bg-amber-500 font-bold text-white' : 'text-gray-700 dark:text-gray-300'}`}>{dayNum}</span>
                    {hasRecord && faceType && <div className="mt-0.5 scale-50 origin-center"><FaceIcon type={faceType} size={16} /></div>}
                    {day.isImportant && <div className="absolute bottom-1 h-1.5 w-1.5 rounded-full bg-red-500" />}
                  </div>
                );
              })}
            </div>
          </div>

          {selectedDate && selectedRecord && (
            <div className="fixed inset-0 z-50 flex items-end justify-center" onClick={() => setSelectedDate(null)}>
              <div className="absolute inset-0 bg-black/40" />
              <div className="relative z-10 w-full max-w-[480px] animate-slide-up rounded-t-2xl bg-white p-5 shadow-xl dark:bg-gray-800" onClick={e => e.stopPropagation()}>
                <div className="mb-3 flex items-center justify-between">
                  <h3 className="text-sm font-semibold text-gray-800 dark:text-gray-100">{formatDisplayDate(selectedDate)}</h3>
                  <button type="button" onClick={() => setSelectedDate(null)} className="text-gray-400"><IconX size={18} /></button>
                </div>
                <div className="space-y-3">
                  <div className="flex items-center gap-3">
                    <span className="w-10 text-xs text-gray-400 dark:text-gray-500">进度</span>
                    <FaceIcon type={selectedRecord.progress} size={24} selected />
                    {selectedRecord.progress_note && <span className="text-xs text-gray-600 dark:text-gray-300">{selectedRecord.progress_note}</span>}
                  </div>
                  <div className="flex items-center gap-3">
                    <span className="w-10 text-xs text-gray-400 dark:text-gray-500">心态</span>
                    <FaceIcon type={selectedRecord.mood} size={24} selected />
                    {selectedRecord.mood_note && <span className="text-xs text-gray-600 dark:text-gray-300">{selectedRecord.mood_note}</span>}
                  </div>
                  {selectedRecord.math_content && (
                    <div className="flex items-start gap-3">
                      <span className="w-10 shrink-0 text-xs text-gray-400 dark:text-gray-500">数学</span>
                      <div className="flex-1">
                        <p className="text-xs text-gray-600 dark:text-gray-300">{selectedRecord.math_content}</p>
                        {selectedRecord.math_duration ? <p className="mt-0.5 text-xs text-gray-400">{formatDuration(selectedRecord.math_duration)}</p> : null}

                    <div className="flex items-start gap-3">
                      <span className="w-10 shrink-0 text-xs text-gray-400 dark:text-gray-500">858</span>
                      <div className="flex-1">
                        <p className="text-xs text-gray-600 dark:text-gray-300">{selectedRecord.course858_content}</p>
                        {selectedRecord.course858_duration ? <p className="mt-0.5 text-xs text-gray-400">{formatDuration(selectedRecord.course858_duration)}</p> : null}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {showMarkDialog && markDate && (
            <div className="fixed inset-0 z-50 flex items-center justify-center px-6" onClick={() => setShowMarkDialog(false)}>
              <div className="absolute inset-0 bg-black/40" />
              <div className="relative z-10 w-full max-w-sm rounded-2xl bg-white p-5 shadow-xl dark:bg-gray-800" onClick={e => e.stopPropagation()}>
                <h3 className="mb-3 text-sm font-semibold text-gray-800 dark:text-gray-100">标注重点日期</h3>
                <p className="mb-3 text-xs text-gray-400 dark:text-gray-500">{formatDateStr(markDate)}</p>
                <input type="text" value={markName} onChange={e => setMarkName(e.target.value)} placeholder="输入标注说明" className="input-base mb-4" autoFocus />
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowMarkDialog(false)} className="btn-secondary flex-1">取消</button>
                  <button type="button" onClick={handleSaveMark} disabled={!markName.trim()} className="btn-primary flex-1 disabled:opacity-50">保存</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== 心态/进度分析（通用） ====================
    function MoodOrProgressAnalysis({ type, navigate }) {
      const isMood = type === 'mood';
      const title = isMood ? '心态分析' : '进度分析';
      const [period, setPeriod] = useState('week');
      const [refDate, setRefDate] = useState(new Date());
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        const range = period === 'week' ? getWeekRange(refDate) : getMonthRange(refDate);
        const result = mockDB.getAnalysis(type, period, formatDateStr(range.end));
        setData(result);
        setLoading(false);
      }, [period, refDate, type]);

      const goPrev = () => setRefDate(d => period === 'week' ? addDays(d, -7) : new Date(d.getFullYear(), d.getMonth() - 1, 1));
      const goNext = () => setRefDate(d => period === 'week' ? addDays(d, 7) : new Date(d.getFullYear(), d.getMonth() + 1, 1));

      const range = period === 'week' ? getWeekRange(refDate) : getMonthRange(refDate);
      const periodLabel = period === 'week'
        ? `${range.start.getMonth()+1}/${range.start.getDate()} - ${range.end.getMonth()+1}/${range.end.getDate()}`
        : `${refDate.getFullYear()}年${refDate.getMonth()+1}月`;

      const pieData = data ? [
        { name: '好', value: data.distribution.good, level: 'good' },
        { name: '一般', value: data.distribution.normal, level: 'normal' },
        { name: '差', value: data.distribution.bad, level: 'bad' },
      ].filter(d => d.value > 0) : [];

      const total = data ? data.distribution.good + data.distribution.normal + data.distribution.bad : 0;

      const lineData = data ? data.trend.map(d => ({
        date: `${new Date(d.date).getMonth()+1}/${new Date(d.date).getDate()}`,
        value: d.value,
      })) : [];

      return (
        <div className="px-4 pb-24 pt-2">
          <BackHeader title={title} onBack={() => navigate('analysis')} />
          <div className="mb-3 flex justify-center">
            <div className="flex rounded-full border border-gray-200 p-0.5 dark:border-gray-600">
              {['week', 'month'].map(p => (
                <button key={p} type="button" onClick={() => { setPeriod(p); setRefDate(new Date()); }}
                  className={`rounded-full px-4 py-1 text-xs font-medium transition-all ${period === p ? 'bg-amber-500 text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'}`}>
                  {p === 'week' ? '周' : '月'}
                </button>
              ))}
            </div>
          </div>
          <div className="mb-4 flex items-center justify-center gap-3">
            <button type="button" onClick={goPrev} className="rounded-full p-1 hover:bg-gray-100 dark:hover:bg-gray-700"><span className="text-gray-400"><IconChevronLeft size={18} /></span></button>
            <span className="min-w-[140px] text-center text-sm font-medium text-gray-700 dark:text-gray-200">{periodLabel}</span>
            <button type="button" onClick={goNext} className="rounded-full p-1 hover:bg-gray-100 dark:hover:bg-gray-700"><span className="text-gray-400"><IconChevronRight size={18} /></span></button>
          </div>

          {loading ? (
            <div className="flex items-center justify-center py-16"><span className="text-sm text-gray-400">加载中...</span></div>
          ) : !data || total === 0 ? (
            <div className="card flex flex-col items-center justify-center py-12">
              <FaceIcon type="normal" size={40} />
              <p className="mt-3 text-sm text-gray-400 dark:text-gray-500">暂无数据</p>
            </div>
          ) : (
            <>
              <div className="card mb-3">
                <h3 className="mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">{isMood ? '心态分布' : '进度分布'}</h3>
                <div className="relative mx-auto h-40 w-40">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie data={pieData} dataKey="value" innerRadius={40} outerRadius={65} paddingAngle={2} stroke="none">
                        {pieData.map(entry => <Cell key={entry.level} fill={MOOD_COLOR[entry.level]} />)}
                      </Pie>
                    </PieChart>
                  </ResponsiveContainer>
                  <div className="absolute inset-0 flex flex-col items-center justify-center">
                    <span className="text-xl font-bold text-gray-800 dark:text-gray-100">{total}</span>
                    <span className="text-[10px] text-gray-400">总计</span>
                  </div>
                </div>
                <div className="mt-2 flex justify-center gap-4">
                  {['good', 'normal', 'bad'].map(level => (
                    <div key={level} className="flex items-center gap-1">
                      <div className="h-2 w-2 rounded-full" style={{ background: MOOD_COLOR[level] }} />
                      <span className="text-[10px] text-gray-400">{MOOD_LABEL[level]} {data.distribution[level]}</span>
                    </div>
                  ))}
                </div>
              </div>

              {lineData.length > 1 && (
                <div className="card mb-3">
                  <h3 className="mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">{isMood ? '心态变化' : '进度变化'}</h3>
                  <ResponsiveContainer width="100%" height={160}>
                    <LineChart data={lineData}>
                      <XAxis dataKey="date" tick={{ fontSize: 10, fill: '#9CA3AF' }} axisLine={false} tickLine={false} />
                      <YAxis domain={[0.5, 3.5]} ticks={[1, 2, 3]} tick={{ fontSize: 10, fill: '#9CA3AF' }} axisLine={false} tickLine={false} tickFormatter={v => v === 3 ? '好' : v === 2 ? '一般' : '差'} />
                      <Tooltip formatter={value => [value === 3 ? '好' : value === 2 ? '一般' : '差', isMood ? '心态' : '进度']} contentStyle={{ fontSize: 12, borderRadius: 8, border: 'none', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }} />
                      <Line type="monotone" dataKey="value" stroke="#F59E0B" strokeWidth={2} dot={{ r: 3, fill: '#F59E0B' }} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              )}

              {data.notes.length > 0 && (
                <div className="card">
                  <h3 className="mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">{isMood ? '心态记录' : '进度记录'}</h3>

                      <div key={i} className="flex items-center gap-3 rounded-xl bg-gray-50 px-3 py-2 dark:bg-gray-700/50">
                        <span className="shrink-0 text-[10px] text-gray-400 dark:text-gray-500">{new Date(item.date).getMonth()+1}/{new Date(item.date).getDate()}</span>
                        <span className="flex-1 truncate text-xs text-gray-600 dark:text-gray-300">{item.note}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    // ==================== 数学/858总结（通用） ====================

      useEffect(() => {
        const range = period === 'week' ? getWeekRange(refDate) : getMonthRange(refDate);
        const result = mockDB.getAnalysis(analysisType, period, formatDateStr(range.end));
        setData(result);
        setLoading(false);
      }, [period, refDate, analysisType]);

      const goPrev = () => setRefDate(d => period === 'week' ? addDays(d, -7) : new Date(d.getFullYear(), d.getMonth() - 1, 1));

      const range = period === 'week' ? getWeekRange(refDate) : getMonthRange(refDate);
      const periodLabel = period === 'week'
        ? `${range.start.getMonth()+1}/${range.start.getDate()} - ${range.end.getMonth()+1}/${range.end.getDate()}`
        : `${refDate.getFullYear()}年${refDate.getMonth()+1}月`;

      const barData = data ? data.trend.map(d => ({
        date: `${new Date(d.date).getMonth()+1}/${new Date(d.date).getDate()}`,
        minutes: d.duration,
      })) : [];

      return (
        <div className="px-4 pb-24 pt-2">
          <BackHeader title={title} onBack={() => navigate('analysis')} />
          <div className="mb-3 flex justify-center">
            <div className="flex rounded-full border border-gray-200 p-0.5 dark:border-gray-600">
              {['week', 'month'].map(p => (
                <button key={p} type="button" onClick={() => { setPeriod(p); setRefDate(new Date()); }}
                  className={`rounded-full px-4 py-1 text-xs font-medium transition-all ${period === p ? 'bg-amber-500 text-white shadow-sm' : 'text-gray-500 dark:text-gray-400'}`}>
                  {p === 'week' ? '周' : '月'}
                </button>
              ))}
            </div>
          </div>
          <div className="mb-4 flex items-center justify-center gap-3">
            <button type="button" onClick={goPrev} className="rounded-full p-1 hover:bg-gray-100 dark:hover:bg-gray-700"><span className="text-gray-400"><IconChevronLeft size={18} /></span></button>
            <span className="min-w-[140px] text-center text-sm font-medium text-gray-700 dark:text-gray-200">{periodLabel}</span>
            <button type="button" onClick={goNext} className="rounded-full p-1 hover:bg-gray-100 dark:hover:bg-gray-700"><span className="text-gray-400"><IconChevronRight size={18} /></span></button>
          </div>

          {loading ? (
            <div className="flex items-center justify-center py-16"><span className="text-sm text-gray-400">加载中...</span></div>
          ) : !data || data.contents.length === 0 ? (
            <div className="card flex flex-col items-center justify-center py-12">
              <span className="mb-3 text-purple-300 dark:text-purple-700"><IconCalculator size={40} /></span>
              <p className="text-sm text-gray-400 dark:text-gray-500">暂无复习数据</p>
            </div>
          ) : (
            <>
              <div className="card mb-3 flex flex-col items-center py-6">
                <span className="font-mono text-4xl font-bold text-amber-500 dark:text-amber-400">{formatDuration(data.totalDuration)}</span>
                <span className="mt-1 text-xs text-gray-400 dark:text-gray-500">总复习时长</span>
              </div>
              {barData.length > 0 && (
                <div className="card mb-3">
                  <h3 className="mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">每日时长</h3>
                  <ResponsiveContainer width="100%" height={160}>
                    <BarChart data={barData}>
                      <XAxis dataKey="date" tick={{ fontSize: 10, fill: '#9CA3AF' }} axisLine={false} tickLine={false} />
                      <YAxis tick={{ fontSize: 10, fill: '#9CA3AF' }} axisLine={false} tickLine={false} />
                      <Tooltip formatter={value => [`${value}分钟`, '时长']} contentStyle={{ fontSize: 12, borderRadius: 8, border: 'none', boxShadow: '0 2px 8px rgba(0,0,0,0.1)' }} />
                      <Bar dataKey="minutes" fill={barColor} radius={[4, 4, 0, 0]} />
                    </BarChart>
                  </ResponsiveContainer>
                </div>
              )}
              <div className="card">
                <h3 className="mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">复习内容</h3>
                <div className="space-y-2">
                  {data.contents.map((item, i) => {
                    const trendItem = data.trend.find(t => t.date === item.date);
                    return (
                      <div key={i} className="flex items-start gap-3 rounded-xl bg-gray-50 px-3 py-2 dark:bg-gray-700/50">
                        <span className="shrink-0 pt-0.5 text-[10px] text-gray-400 dark:text-gray-500">{new Date(item.date).getMonth()+1}/{new Date(item.date).getDate()}</span>
                        <div className="min-w-0 flex-1">
                          <p className="text-xs text-gray-600 dark:text-gray-300 line-clamp-2">{item.content}</p>
                          {trendItem ? <p className="mt-0.5 text-[10px] text-gray-400">{formatDuration(trendItem.duration)}</p> : null}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    function ReminderSettingsPage({ navigate }) {

              <label className="mb-1 block text-sm text-gray-700 dark:text-gray-200">提醒时间</label>

            </div>

    // ==================== 复习目标 ====================
    function GoalSettingsPage({ navigate }) {
      const settings = mockDB.getSettings();
      const [hours, setHours] = useState(Math.floor(settings.dailyGoalMinutes / 60));
      const [minutes, setMinutes] = useState(settings.dailyGoalMinutes % 60);
      const [streakGoal, setStreakGoal] = useState(settings.streakGoalDays);
      const [toast, setToast] = useState(null);

      const handleSave = () => {
        const totalMinutes = hours * 60 + minutes;
        if (totalMinutes <= 0) return;
        mockDB.updateSettings({ dailyGoalMinutes: totalMinutes, streakGoalDays: streakGoal });
        setToast('保存成功');
        setTimeout(() => setToast(null), 2000);
      };

      return (
        <div className="p-4">
          <BackHeader title="复习目标" onBack={() => navigate('settings')} />
          <div className="card space-y-4">
            <div>
              <label className="mb-1 block text-sm text-gray-700 dark:text-gray-200">每日目标时长</label>
              <div className="flex items-center gap-2">
                <input type="number" value={hours} onChange={e => setHours(Math.max(0, Number(e.target.value)))} min={0} max={24} className="input-base w-20 text-center" />
                <span className="text-xs text-gray-400 dark:text-gray-500">小时</span>
                <input type="number" value={minutes} onChange={e => setMinutes(Math.min(59, Math.max(0, Number(e.target.value))))} min={0} max={59} className="input-base w-20 text-center" />
                <span className="text-xs text-gray-400 dark:text-gray-500">分钟</span>
              </div>
            </div>
            <div>
              <label className="mb-1 block text-sm text-gray-700 dark:text-gray-200">连续打卡目标（天）</label>
              <input type="number" value={streakGoal} onChange={e => setStreakGoal(Math.max(1, Number(e.target.value)))} min={1} className="input-base" />
            </div>
            <button type="button" onClick={handleSave} className="btn-primary w-full">保存</button>
          </div>
          {toast && (
            <div className="toast-enter fixed left-1/2 top-20 z-50 -translate-x-1/2">
              <div className="flex items-center gap-2 rounded-full bg-gray-800 px-4 py-2 text-sm text-white shadow-lg dark:bg-gray-200 dark:text-gray-800">
                <span className="text-green-400 dark:text-green-600"><IconCheck /></span>{toast}
              </div>
            </div>
          )}
        </div>
      );

    // ==================== 导出报告 ====================
    function ExportPage({ navigate }) {
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [format, setFormat] = useState('png');
      const [error, setError] = useState('');
      const [recordCount, setRecordCount] = useState(null);

      const handlePreview = () => {
        if (!startDate || !endDate) { setError('请选择日期范围'); return; }
        if (startDate > endDate) { setError('结束日期不能早于开始日期'); return; }
        setError('');
        const records = mockDB.getRecords(startDate, endDate);
        setRecordCount(records.length);
      };

      const handleExport = () => {
        if (!startDate || !endDate) { setError('请选择日期范围'); return; }
        if (startDate > endDate) { setError('结束日期不能早于开始日期'); return; }
        setError('');
        const records = mockDB.getRecords(startDate, endDate);
        if (records.length === 0) { setError('该日期范围内无数据'); return; }
        // 简化导出：生成文本文件
        let text = `复习报告 ${startDate} ~ ${endDate}\n\n`;
        text += `共 ${records.length} 条记录\n\n`;
        records.forEach(r => {
          text += `日期: ${r.date}\n`;
          text += `  进度: ${MOOD_LABEL[r.progress] || r.progress} ${r.progress_note ? '(' + r.progress_note + ')' : ''}\n`;
          text += `  心态: ${MOOD_LABEL[r.mood] || r.mood} ${r.mood_note ? '(' + r.mood_note + ')' : ''}\n`;
          if (r.math_content) text += `  数学: ${r.math_content} (${formatDuration(r.math_duration)})\n`;
          if (r.course858_content) text += `  858: ${r.course858_content} (${formatDuration(r.course858_duration)})\n`;
          text += '\n';
        });
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `复习报告_${startDate}_${endDate}.txt`;
        a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div className="p-4">
          <BackHeader title="导出报告" onBack={() => navigate('settings')} />
          <div className="card mb-3 space-y-3">
            <div>
              <label className="mb-1 block text-sm text-gray-700 dark:text-gray-200">开始日期</label>
              <input type="date" value={startDate} onChange={e => { setStartDate(e.target.value); setRecordCount(null); }} className="input-base" />
            </div>
            <div>
              <label className="mb-1 block text-sm text-gray-700 dark:text-gray-200">结束日期</label>
              <input type="date" value={endDate} onChange={e => { setEndDate(e.target.value); setRecordCount(null); }} className="input-base" />
            </div>
            {error && <p className="text-sm text-red-500">{error}</p>}
            <button type="button" onClick={handlePreview} className="btn-secondary w-full">预览数据</button>
          </div>
          <div className="card mb-3">
            <label className="mb-2 block text-sm text-gray-700 dark:text-gray-200">导出格式</label>
            <div className="flex gap-3">
              <button type="button" onClick={() => setFormat('png')} className={`flex flex-1 items-center justify-center gap-2 rounded-full py-2 text-sm font-medium transition-colors ${format === 'png' ? 'bg-amber-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300'}`}>PNG</button>
              <button type="button" onClick={() => setFormat('txt')} className={`flex flex-1 items-center justify-center gap-2 rounded-full py-2 text-sm font-medium transition-colors ${format === 'txt' ? 'bg-amber-500 text-white' : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300'}`}>TXT</button>
            </div>
          </div>
          <div className="card mb-3">
            <p className="mb-2 text-sm font-medium text-gray-700 dark:text-gray-200">报告预览</p>
            {recordCount !== null ? (
              <div className="space-y-1 text-xs text-gray-500 dark:text-gray-400">
                <p>日期范围：{startDate} ~ {endDate}</p>
                <p>复习记录：{recordCount} 条</p>
                <p>包含内容：每日进度、心态、数学复习、858复习</p>
              </div>
            ) : (
              <p className="text-xs text-gray-400 dark:text-gray-500">选择日期范围后点击"预览数据"查看</p>
            )}
          </div>
          <div className="space-y-3">
            <button type="button" onClick={handleExport} className="btn-primary w-full">导出报告</button>
            <button type="button" className="flex w-full items-center justify-center gap-2 rounded-full bg-green-500 py-2.5 text-sm font-medium text-white transition-all active:scale-95">
              <IconShare /> 分享到微信
            </button>
          </div>
        </div>
      );
    }

    // ==================== 重点日期管理 ====================
    function ImportantDatesPage({ navigate }) {
      const [dates, setDates] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [form, setForm] = useState({ startDate: '', endDate: '', note: '' });
      const [formError, setFormError] = useState('');
      const [deleteId, setDeleteId] = useState(null);

      useEffect(() => { setDates(mockDB.getImportantDates()); }, []);

      const openAdd = () => { setEditingId(null); setForm({ startDate: '', endDate: '', note: '' }); setFormError(''); setShowForm(true); };
      const openEdit = (item) => { setEditingId(item.id); setForm({ startDate: item.start_date, endDate: item.end_date, note: item.label }); setFormError(''); setShowForm(true); };

      const handleSubmit = () => {
        if (!form.startDate || !form.endDate) { setFormError('请选择起止日期'); return; }
        if (form.startDate > form.endDate) { setFormError('结束日期不能早于开始日期'); return; }
        if (!form.note.trim()) { setFormError('请输入标注说明'); return; }
        mockDB.saveImportantDate({ id: editingId, startDate: form.startDate, endDate: form.endDate, label: form.note.trim() });
        setDates(mockDB.getImportantDates());
        setShowForm(false);
      };

      const handleDelete = () => {
        if (!deleteId) return;
        mockDB.deleteImportantDate(deleteId);
        setDates(prev => prev.filter(d => d.id !== deleteId));
        setDeleteId(null);
      };

      return (
        <div className="p-4">
          <div className="mb-4 flex items-center justify-between">
            <BackHeader title="重点日期" onBack={() => navigate('settings')} />
            <button type="button" onClick={openAdd} className="flex h-8 w-8 items-center justify-center rounded-full bg-amber-500 text-white"><IconPlus /></button>
          </div>
          {dates.length === 0 ? (
            <div className="py-12 text-center text-sm text-gray-400 dark:text-gray-500">暂无重点日期，点击右上角添加</div>
          ) : (
            <div className="space-y-3">
              {dates.map(d => (
                <div key={d.id} className="card flex items-stretch overflow-hidden">
                  <div className="w-1 shrink-0 bg-amber-400" />
                  <div className="flex flex-1 items-center justify-between px-3 py-3">
                    <div>
                      <p className="text-sm font-medium text-gray-800 dark:text-gray-100">{d.label}</p>
                      <p className="text-xs text-gray-400 dark:text-gray-500">{d.start_date === d.end_date ? d.start_date : `${d.start_date} ~ ${d.end_date}`}</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button type="button" onClick={() => openEdit(d)} className="text-gray-400 hover:text-amber-500 dark:text-gray-500"><IconPencil /></button>
                      <button type="button" onClick={() => setDeleteId(d.id)} className="text-gray-400 hover:text-red-500 dark:text-gray-500"><IconTrash /></button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {showForm && (
            <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/40">
              <div className="w-full max-w-[480px] rounded-t-2xl bg-white p-5 dark:bg-gray-800">
                <div className="mb-4 flex items-center justify-between">
                  <h3 className="font-medium text-gray-800 dark:text-gray-100">{editingId ? '编辑日期' : '添加日期'}</h3>
                  <button type="button" onClick={() => setShowForm(false)} className="text-gray-400"><IconX /></button>
                </div>
                <div className="space-y-3">
                  <div><label className="mb-1 block text-sm text-gray-700 dark:text-gray-200">开始日期</label><input type="date" value={form.startDate} onChange={e => setForm({...form, startDate: e.target.value})} className="input-base" /></div>
                  <div><label className="mb-1 block text-sm text-gray-700 dark:text-gray-200">结束日期</label><input type="date" value={form.endDate} onChange={e => setForm({...form, endDate: e.target.value})} className="input-base" /></div>
                  <div><label className="mb-1 block text-sm text-gray-700 dark:text-gray-200">标注说明</label><input type="text" placeholder="如：考研初试" value={form.note} onChange={e => setForm({...form, note: e.target.value})} className="input-base" /></div>
                  {formError && <p className="text-sm text-red-500">{formError}</p>}
                  <button type="button" onClick={handleSubmit} className="btn-primary w-full">保存</button>
                </div>
              </div>
            </div>
          )}

          {deleteId !== null && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40">
              <div className="mx-6 w-full max-w-sm rounded-2xl bg-white p-5 dark:bg-gray-800">
                <h3 className="mb-2 font-medium text-gray-800 dark:text-gray-100">确认删除</h3>
                <p className="mb-4 text-sm text-gray-500 dark:text-gray-400">删除后无法恢复，确定要删除吗？</p>
                <div className="flex gap-3">
                  <button type="button" onClick={() => setDeleteId(null)} className="btn-secondary flex-1">取消</button>
                  <button type="button" onClick={handleDelete} className="flex-1 rounded-full bg-red-500 py-2.5 text-sm font-medium text-white active:scale-95">删除</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== 复习资料 ====================
    function MaterialsPage({ navigate }) {
      const [materials, setMaterials] = useState([]);
      const [category, setCategory] = useState('全部');
      const [deleteTarget, setDeleteTarget] = useState(null);
      const CATEGORIES = ['全部', '数学', '858', '其他'];

      useEffect(() => { setMaterials(mockDB.getMaterials()); }, []);

      const filtered = category === '全部' ? materials : materials.filter(m => (m.category || '其他') === category);

      const handleDelete = () => {
        if (!deleteTarget) return;
        mockDB.deleteMaterial(deleteTarget.id);
        setMaterials(prev => prev.filter(m => m.id !== deleteTarget.id));
        setDeleteTarget(null);
      };

      return (
        <div className="px-4 pb-24 pt-2">
          <div className="mb-4 flex items-center justify-between">
            <h2 className="text-lg font-bold text-gray-800 dark:text-gray-100">复习资料</h2>
            <button type="button" className="flex items-center gap-1 rounded-full bg-amber-500 px-3 py-1.5 text-xs font-medium text-white transition-colors active:scale-95 dark:bg-amber-600">
              <IconUpload /> 上传
            </button>
          </div>
          <div className="mb-4 flex gap-2 overflow-x-auto">
            {CATEGORIES.map(c => (
              <button key={c} type="button" onClick={() => setCategory(c)}
                className={`shrink-0 rounded-full px-3 py-1 text-xs font-medium transition-colors ${category === c ? 'bg-amber-400 text-white' : 'bg-gray-100 text-gray-500 dark:bg-gray-700 dark:text-gray-400'}`}>
                {c}
              </button>
            ))}
          </div>
          {filtered.length === 0 ? (
            <div className="card flex flex-col items-center justify-center py-16">
              <span className="mb-3 text-amber-300 dark:text-amber-700"><IconFolder size={48} /></span>
              <p className="text-sm text-gray-400 dark:text-gray-500">暂无资料</p>
            </div>
          ) : (
            <div className="space-y-2">
              {filtered.map(item => (
                <div key={item.id} className="card flex items-center gap-3 py-3">
                  <span className="text-red-500 dark:text-red-400"><IconFileText /></span>
                  <div className="min-w-0 flex-1">
                    <p className="truncate text-sm font-medium text-gray-800 dark:text-gray-100">{item.name}</p>
                    <div className="flex items-center gap-2 text-xs text-gray-400 dark:text-gray-500">
                      <span className="rounded bg-gray-100 px-1.5 py-0.5 dark:bg-gray-700">{item.category || '其他'}</span>
                      <span>{new Date(item.created_at).getMonth()+1}/{new Date(item.created_at).getDate()}</span>
                    </div>
                  </div>
                  <button type="button" onClick={() => setDeleteTarget(item)} className="shrink-0 p-1 text-gray-300 transition-colors hover:text-red-500 dark:text-gray-600 dark:hover:text-red-400"><IconTrash size={18} /></button>
                </div>
              ))}
            </div>
          )}

          {deleteTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/40" onClick={() => setDeleteTarget(null)} />
              <div className="relative z-10 w-full max-w-sm rounded-2xl bg-white p-5 dark:bg-gray-800">
                <h3 className="mb-2 text-base font-bold text-gray-800 dark:text-gray-100">确认删除</h3>
                <p className="mb-4 text-sm text-gray-500 dark:text-gray-400">确定删除「{deleteTarget.name}」吗？此操作不可撤销。</p>
                <div className="flex gap-3">
                  <button type="button" onClick={() => setDeleteTarget(null)} className="btn-secondary flex-1">取消</button>
                  <button type="button" onClick={handleDelete} className="flex-1 rounded-full bg-red-500 px-6 py-2.5 text-sm font-medium text-white transition-all active:scale-95">删除</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== TabBar ====================
    function TabBar({ currentPage, navigate }) {
      const tabs = [
        { page: 'home', label: '首页', icon: IconHome },
        { page: 'calendar', label: '日历', icon: IconCalendar },
        { page: 'analysis', label: '分析', icon: IconBarChart },
        { page: 'materials', label: '资料', icon: IconFolder },
        { page: 'profile', label: '我的', icon: IconUser },
      ];
      return (
        <nav className="fixed bottom-0 left-1/2 z-40 flex w-full max-w-[480px] -translate-x-1/2 items-center justify-around border-t border-gray-100 bg-white/90 backdrop-blur-md dark:border-gray-800 dark:bg-gray-900/90" style={{ paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
          {tabs.map(tab => {
            const active = currentPage === tab.page;
            return (
              <button key={tab.page} type="button" onClick={() => navigate(tab.page)}
                className={`flex flex-1 flex-col items-center gap-0.5 py-2 transition-colors ${active ? 'text-amber-500 dark:text-amber-400' : 'text-gray-400 dark:text-gray-500'}`}>
                <tab.icon size={22} active={active} />
                <span className="text-[10px]">{tab.label}</span>
              </button>
            );
          })}
        </nav>
      );
    }

    // ==================== 主应用 ====================
    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      const [pageParams, setPageParams] = useState({});

      const navigate = (page, params = {}) => {
        setCurrentPage(page);
        setPageParams(params);
        window.scrollTo(0, 0);
      };

      // 检查登录状态
      const user = mockDB.getCurrentUser();
      useEffect(() => {
        if (!user && currentPage !== 'login' && currentPage !== 'register') {
          setCurrentPage('login');
        }
      }, []);

      // 初始化深色模式
      useEffect(() => {
        const settings = mockDB.getSettings();
        document.documentElement.classList.toggle('dark', settings.darkMode);
      }, []);

      // 判断是否需要 TabBar
      const tabPages = ['home', 'calendar', 'analysis', 'materials', 'profile'];
      const showTabBar = tabPages.includes(currentPage);

      // 渲染页面
      const renderPage = () => {
        switch (currentPage) {
          case 'login': return <LoginPage navigate={navigate} />;
          case 'register': return <RegisterPage navigate={navigate} />;
          case 'home': return <HomePage navigate={navigate} />;
          case 'calendar': return <CalendarPage navigate={navigate} />;
          case 'analysis': return <AnalysisPage navigate={navigate} />;
          case 'moodAnalysis': return <MoodOrProgressAnalysis type="mood" navigate={navigate} />;
          case 'progressAnalysis': return <MoodOrProgressAnalysis type="progress" navigate={navigate} />;
          case 'mathSummary': return <SubjectSummary subject="math" navigate={navigate} />;
          case 'course858Summary': return <SubjectSummary subject="course858" navigate={navigate} />;
          case 'profile': return <ProfilePage navigate={navigate} />;
          case 'settings': return <SettingsPage navigate={navigate} />;
          case 'reminderSettings': return <ReminderSettingsPage navigate={navigate} />;
          case 'goalSettings': return <GoalSettingsPage navigate={navigate} />;
          case 'exportPage': return <ExportPage navigate={navigate} />;
          case 'importantDates': return <ImportantDatesPage navigate={navigate} />;
          case 'materials': return <MaterialsPage navigate={navigate} />;
          default: return <HomePage navigate={navigate} />;
        }
      };

      if (currentPage === 'login' || currentPage === 'register') {
        return renderPage();
      }

      return (
        <div className="mx-auto flex min-h-screen max-w-[480px] flex-col bg-gray-50 dark:bg-gray-900">
          <header className="sticky top-0 z-30 flex h-12 items-center justify-center border-b border-gray-100 bg-white/80 px-4 backdrop-blur-md dark:border-gray-800 dark:bg-gray-900/80">
            <h1 className="text-base font-bold text-gray-800 dark:text-gray-100">考研打卡</h1>
          </header>
          <main className="flex-1 overflow-y-auto pb-16">
            {renderPage()}
          </main>
          {showTabBar && <TabBar currentPage={currentPage} navigate={navigate} />}
        </div>
      );
    }

    // ==================== 渲染 ====================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
