<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1419">
<title>心屿 · 24h 主动戒断 AI 陪练</title>
<style>
:root{
  --bg-base:#0f1419;--bg-card:#1a2028;--bg-elevated:#232a35;
  --text-primary:#e8eef5;--text-secondary:#8b95a5;--text-muted:#5a6470;
  --accent-orange:#ff8a65;--accent-blue:#5fb3d4;--border-subtle:#2a3340;
  --success:#7dd3a0;--warning:#f4b860;
  --radius:12px;--shadow:0 2px 8px rgba(0,0,0,0.15);
  --transition:200ms cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font-family:"Noto Sans SC","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg-base);color:var(--text-primary);overflow:hidden}
button,input{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column}
.hidden{display:none!important}

/* 欢迎页 */
#lock-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg-base);padding:24px;text-align:center}
.lock-logo{width:72px;height:72px;margin-bottom:20px;border-radius:50%;background:linear-gradient(135deg,var(--accent-orange),#ff6b6b);display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(255,138,101,0.25)}
.lock-logo svg{width:40px;height:40px;color:#fff}
.lock-title{font-size:28px;font-weight:600;margin-bottom:8px;letter-spacing:2px}
.lock-sub{color:var(--text-secondary);font-size:14px;margin-bottom:28px;line-height:1.6}
.lock-form{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
.lock-form input{width:100%;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius);color:var(--text-primary);font-size:18px;text-align:center;letter-spacing:8px;outline:none;transition:border-color var(--transition)}
.lock-form input:focus{border-color:var(--accent-orange)}
.lock-form button{padding:14px;border:none;border-radius:var(--radius);background:var(--accent-orange);color:#fff;font-size:15px;font-weight:500;cursor:pointer;transition:opacity var(--transition)}
.lock-form button:hover{opacity:.9}
.lock-hint{color:var(--text-muted);font-size:12px;margin-top:12px}
.lock-error{color:var(--accent-orange);font-size:13px;min-height:20px}
.lock-actions{margin-top:16px;display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--text-muted)}
.lock-actions a{color:var(--text-secondary);text-decoration:none;cursor:pointer}
.lock-actions a:hover{color:var(--accent-orange)}

/* 布局 */
#main{display:flex;height:100%;width:100%}
#sidebar{width:240px;flex-shrink:0;background:var(--bg-card);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;transition:transform var(--transition)}
#chat-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-base)}

/* 侧栏 */
.sidebar-header{padding:16px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between}
.new-chat-top{width:32px;height:32px;border-radius:50%;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition)}
.new-chat-top:hover{color:var(--accent-orange);border-color:var(--accent-orange)}
.sidebar-title{font-size:14px;font-weight:600;color:var(--text-secondary);letter-spacing:1px}
#companion-list{flex:1;overflow-y:auto;padding:8px}
.companion-folder{margin-bottom:4px;border-radius:var(--radius);overflow:hidden}
.companion-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-radius:var(--radius);transition:background var(--transition)}
.companion-header:hover{background:var(--bg-elevated)}
.companion-header.active{background:rgba(255,138,101,0.12)}
.companion-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0}
.companion-avatar svg{width:100%;height:100%;display:block}
.companion-info{flex:1;min-width:0}
.companion-name{font-size:14px;font-weight:500}
.companion-role{font-size:11px;color:var(--text-muted)}
.companion-chevron{margin-left:auto;color:var(--text-muted);transition:transform var(--transition)}
.companion-folder.open .companion-chevron{transform:rotate(90deg)}
.companion-convs{display:none;padding:4px 0 4px 44px}
.companion-folder.open .companion-convs{display:block}
.conv-item{padding:8px 10px;border-radius:8px;font-size:13px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all var(--transition)}
.conv-item:hover,.conv-item.active{background:var(--bg-elevated);color:var(--text-primary)}
.sidebar-footer{padding:12px;border-top:1px solid var(--border-subtle)}
#lock-btn{width:100%;padding:10px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);border-radius:var(--radius);cursor:pointer;font-size:13px;transition:all var(--transition)}
#lock-btn:hover{border-color:var(--accent-orange);color:var(--accent-orange)}

/* 聊天头部 */
#chat-header{height:60px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg-card)}
#current-companion{display:flex;align-items:center;gap:12px}
#current-companion .avatar{width:36px;height:36px;border-radius:50%}
#current-companion .avatar svg{width:100%;height:100%;display:block}
#current-companion .name{font-size:15px;font-weight:500}
#current-companion .tag{font-size:11px;color:var(--text-muted)}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--transition)}
.icon-btn:hover{color:var(--accent-orange);background:rgba(255,138,101,0.1)}

/* 消息区 */
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.welcome-msg{text-align:center;color:var(--text-muted);font-size:13px;margin:20px 0}
.message{max-width:80%;display:flex;flex-direction:column;gap:4px;animation:fadeIn .25s ease}
.message.user{align-self:flex-end;align-items:flex-end}
.message.companion{align-self:flex-start;align-items:flex-start}
.bubble{padding:12px 14px;border-radius:var(--radius);font-size:14px;line-height:1.65;word-break:break-word;box-shadow:var(--shadow)}
.message.user .bubble{background:var(--accent-orange);color:#fff;border-bottom-right-radius:4px}
.message.companion .bubble{background:var(--bg-elevated);color:var(--text-primary);border-bottom-left-radius:4px}
.message-time{font-size:10px;color:var(--text-muted)}

/* 卡片消息 */
.card-msg{width:100%;max-width:420px;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);align-self:center}
.card-title{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text-primary)}
.card-body{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:12px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.card-actions button{flex:1;min-width:80px;padding:8px 10px;border:1px solid var(--border-subtle);background:var(--bg-elevated);color:var(--text-primary);border-radius:8px;font-size:13px;cursor:pointer;transition:all var(--transition)}
.card-actions button:hover{border-color:var(--accent-orange);color:var(--accent-orange)}

/* 计时器 */
.timer-overlay{position:fixed;inset:0;z-index:90;background:#0f1419;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.timer-overlay.grayscale{filter:grayscale(100%)}
.timer-circle{width:240px;height:240px;border-radius:50%;border:4px solid var(--border-subtle);position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:24px}
.timer-progress{position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--accent-orange);clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transition:clip-path 1s linear}
.timer-text{font-size:48px;font-weight:300;letter-spacing:2px;color:var(--text-primary)}
.timer-label{color:var(--text-secondary);font-size:14px;margin-bottom:24px}
.timer-overlay button{padding:12px 24px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);border-radius:var(--radius);cursor:pointer;transition:all var(--transition)}
.timer-overlay button:hover{border-color:var(--accent-orange);color:var(--accent-orange)}

/* 呼吸 */
.breath-container{align-self:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}
.breath-circle{width:140px;height:140px;border-radius:50%;background:rgba(95,179,212,0.15);border:2px solid var(--accent-blue);display:flex;align-items:center;justify-content:center;animation:breathe 8s infinite ease-in-out}
.breath-text{font-size:14px;color:var(--text-secondary)}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.4);opacity:1}}

/* 输入区 */
#input-area{padding:12px 16px 16px;background:var(--bg-card);border-top:1px solid var(--border-subtle)}
#input-box{display:flex;gap:10px;align-items:flex-end;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:8px 12px;transition:border-color var(--transition)}
#input-box:focus-within{border-color:var(--accent-orange)}
#user-input{flex:1;background:transparent;border:none;color:var(--text-primary);font-size:14px;line-height:1.5;max-height:120px;min-height:24px;resize:none;outline:none;padding:6px 0}
#send-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--accent-orange);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity var(--transition);flex-shrink:0}
#send-btn:hover{opacity:.9}
#send-btn:disabled{opacity:.4;cursor:not-allowed}

/* 影响力页 */
#impact-page{position:fixed;inset:0;z-index:80;background:var(--bg-base);display:flex;flex-direction:column}
#impact-header{height:60px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg-card)}
#impact-header h2{font-size:16px;font-weight:500}
.impact-content{flex:1;overflow-y:auto;padding:20px}
.chart-card{background:var(--bg-card);border-radius:var(--radius);padding:16px;margin-bottom:16px;border:1px solid var(--border-subtle)}
.chart-card h3{font-size:14px;font-weight:500;margin:0 0 12px;color:var(--text-secondary)}
.chart-svg{width:100%;height:180px}
.report-list{display:flex;flex-direction:column;gap:10px}
.report-item{background:var(--bg-card);border-radius:var(--radius);padding:14px;border:1px solid var(--border-subtle)}
.report-item .week{font-size:13px;font-weight:500;margin-bottom:6px}
.report-item .txt{font-size:13px;color:var(--text-secondary);line-height:1.6}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* 菜单与模态 */
#overlay{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity var(--transition)}
#overlay.show{opacity:1;pointer-events:auto}
#menu-dropdown{position:absolute;top:54px;right:16px;z-index:96;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:6px;min-width:160px;box-shadow:var(--shadow);transform:scale(.95);opacity:0;pointer-events:none;transition:all var(--transition)}
#menu-dropdown.show{transform:scale(1);opacity:1;pointer-events:auto}
.menu-item{padding:10px 12px;border-radius:8px;font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all var(--transition)}
.menu-item:hover{background:var(--bg-elevated);color:var(--text-primary)}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.95);z-index:97;background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius);padding:20px;width:90%;max-width:420px;opacity:0;pointer-events:none;transition:all var(--transition)}
.modal.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.modal h3{margin:0 0 12px;font-size:15px}
.modal p{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-actions button{padding:8px 16px;border-radius:8px;border:1px solid var(--border-subtle);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer}
.modal-actions button.primary{background:var(--accent-orange);color:#fff;border-color:var(--accent-orange)}

/* 移动端 */
#mobile-nav{display:none}
@media(max-width:767px){
  #sidebar{display:none}
  #mobile-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--bg-card);border-top:1px solid var(--border-subtle);display:flex;justify-content:space-around;align-items:center;z-index:70;padding-bottom:env(safe-area-inset-bottom)}
  #chat-area{padding-bottom:64px}
  #input-area{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .mobile-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;color:var(--text-muted);cursor:pointer;transition:color var(--transition)}
  .mobile-tab.active{color:var(--accent-orange)}
  .mobile-tab svg{width:22px;height:22px}
  .mobile-tab span{font-size:10px}
  .message{max-width:90%}
}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--border-subtle);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <!-- 锁屏/欢迎 -->
  <div id="lock-screen">
    <div class="lock-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 8v4l3 3"/></svg>
    </div>
    <div class="lock-title">心屿</div>
    <div class="lock-sub">你的数据不出你的手机<br>24h 主动戒断 AI 陪练</div>
    <div class="lock-form">
      <!-- type=tel + inputmode=numeric 方便纯数字输入 -->
      <input id="pwd-input" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="输入 4-6 位数字密码" autocomplete="off">
      <div class="lock-error" id="pwd-error"></div>
      <button id="pwd-btn">进入</button>
    </div>
    <div class="lock-hint" id="pwd-hint">首次使用请设置密码</div>
    <div class="lock-actions">
      <a id="reset-data">重置（清空所有数据）</a>
      <a id="toggle-notif">开启通知</a>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="main" class="hidden">
    <!-- 侧栏 -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">陪伴师</span>
        <button class="new-chat-top" id="new-chat-sidebar" title="新对话">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7.5"/><line x1="9" y1="5" x2="9" y2="13"/><line x1="5" y1="9" x2="13" y2="9"/></svg>
        </button>
      </div>
      <div id="companion-list"></div>
      <div class="sidebar-footer">
        <button id="lock-btn">锁定</button>
      </div>
    </aside>

    <!-- 聊天区 -->
    <section id="chat-area">
      <header id="chat-header">
        <div id="current-companion">
          <div class="avatar" id="current-avatar"></div>
          <div>
            <div class="name" id="current-name">--</div>
            <div class="tag" id="current-tag">--</div>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn new-chat-top" id="new-chat-header" title="新对话">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="7.5"/><line x1="9" y1="5" x2="9" y2="13"/><line x1="5" y1="9" x2="13" y2="9"/></svg>
          </button>
          <button class="icon-btn" id="menu-btn" title="菜单">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="18" r="1.5" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <div id="messages"></div>

      <div id="input-area">
        <div id="input-box">
          <textarea id="user-input" rows="1" placeholder="想说点什么..."></textarea>
          <button id="send-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- 底部导航（移动端） -->
  <nav id="mobile-nav"></nav>

  <!-- 影响力页 -->
  <div id="impact-page" class="hidden">
    <header id="impact-header">
      <h2>影响力</h2>
      <button class="icon-btn" id="close-impact">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>
    <div class="impact-content">
      <div class="chart-card">
        <h3>过去 7 天</h3>
        <svg id="impact-chart" class="chart-svg" viewBox="0 0 360 180" preserveAspectRatio="none"></svg>
        <div class="legend">
          <span><i style="background:var(--accent-orange)"></i>内耗次数</span>
          <span><i style="background:var(--accent-blue)"></i>安静时长(分)</span>
          <span><i style="background:var(--success)"></i>主动断网</span>
        </div>
      </div>
      <div class="chart-card">
        <h3>周报文字列表</h3>
        <div id="weekly-list" class="report-list"></div>
      </div>
    </div>
  </div>

  <!-- 菜单 -->
  <div id="overlay"></div>
  <div id="menu-dropdown">
    <div class="menu-item" id="menu-impact">影响力</div>
    <div class="menu-item" id="menu-export">导出数据</div>
    <div class="menu-item" id="menu-settings">设置</div>
    <div class="menu-item" id="menu-lock">锁定</div>
  </div>

  <!-- 通用模态 -->
  <div id="modal" class="modal">
    <h3 id="modal-title">提示</h3>
    <p id="modal-body"></p>
    <div class="modal-actions">
      <button id="modal-cancel">取消</button>
      <button class="primary" id="modal-confirm">确定</button>
    </div>
  </div>
</div>

<script>
/* ===================== util 模块 ===================== */
const Util=(()=>{
  /* 纯 JS SHA-256 实现（UTF-8 安全）
     作为 crypto.subtle 在 file:// 协议下不可用时的 fallback。
     crypto.subtle 只在安全上下文（HTTPS/localhost）可用，双击打开 HTML 走 file:// 必然失败。 */
  const K=new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);
  const rotr=(n,x)=>(x>>>n)|(x<<(32-n));
  const sha256Sync=(str)=>{
    const bytes=new TextEncoder().encode(str);
    const l=bytes.length,bitLen=l*8;
    // 计算填充后长度（含 0x80 与 8 字节长度，对齐到 64 字节）
    const padLen=((((l+9)>>6)+1)<<6);
    const buf=new Uint8Array(padLen);
    buf.set(bytes);
    buf[l]=0x80;
    const dv=new DataView(buf.buffer);
    dv.setUint32(padLen-8,Math.floor(bitLen/0x100000000),false);
    dv.setUint32(padLen-4,bitLen>>>0,false);
    const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
    const W=new Uint32Array(64);
    for(let i=0;i<padLen;i+=64){
      for(let t=0;t<16;t++) W[t]=dv.getUint32(i+t*4,false);
      for(let t=16;t<64;t++){
        const s0=rotr(7,W[t-15])^rotr(18,W[t-15])^(W[t-15]>>>3);
        const s1=rotr(17,W[t-2])^rotr(19,W[t-2])^(W[t-2]>>>10);
        W[t]=(W[t-16]+s0+W[t-7]+s1)>>>0;
      }
      let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(let t=0;t<64;t++){
        const S1=rotr(6,e)^rotr(11,e)^rotr(25,e);
        const ch=(e&f)^(~e&g);
        const t1=(h+S1+ch+K[t]+W[t])>>>0;
        const S0=rotr(2,a)^rotr(13,a)^rotr(22,a);
        const maj=(a&b)^(a&c)^(b&c);
        const t2=(S0+maj)>>>0;
        h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
      }
      H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
    }
    let hex='';
    for(let i=0;i<8;i++) hex+=H[i].toString(16).padStart(8,'0');
    return hex;
  };

  // 优先用 crypto.subtle（安全上下文），失败则回退纯 JS（file:// 必走回退）
  const sha256=async(str)=>{
    const enc=new TextEncoder().encode(str);
    if(crypto&&crypto.subtle&&typeof crypto.subtle.digest==='function'){
      try{
        const buf=await crypto.subtle.digest('SHA-256',enc);
        if(buf){return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
      }catch(e){console.warn('crypto.subtle.digest 不可用，回退纯 JS SHA-256',e);}
    }
    return sha256Sync(str);
  };

  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const fmtTime=(ts)=>{const d=new Date(ts);return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;};
  const today=()=>{const d=new Date();return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;};
  const debounce=(fn,ms)=>{let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms);};};
  return{sha256,sha256Sync,uid,fmtTime,today,debounce};
})();

/* ===================== 数据层 db 模块 =====================
   所有操作均带 try-catch：IndexedDB 初始化失败 / 读取失败时不会让 UI 崩溃，
   数据降级为内存态（仅本次会话有效）。 */
const DB=(()=>{
  const NAME='XinYuDB',VER=1;let db=null;
  const open=()=>new Promise((res,rej)=>{
    if(!('indexedDB' in window)){rej(new Error('IndexedDB 不支持'));return;}
    const r=indexedDB.open(NAME,VER);
    r.onerror=()=>rej(r.error);
    r.onsuccess=()=>{db=r.result;res(db);};
    r.onupgradeneeded=(e)=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('user')) d.createObjectStore('user',{keyPath:'id'});
      if(!d.objectStoreNames.contains('conversations')) d.createObjectStore('conversations',{keyPath:'companion'});
      if(!d.objectStoreNames.contains('dailyRecords')) d.createObjectStore('dailyRecords',{keyPath:'date'});
      if(!d.objectStoreNames.contains('weeklyReviews')) d.createObjectStore('weeklyReviews',{keyPath:'week'});
    };
  });
  const tx=(store,mode='readonly')=>db.transaction(store,mode).objectStore(store);
  const _get=(store,key)=>new Promise((res,rej)=>{const q=tx(store).get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
  const _put=(store,data)=>new Promise((res,rej)=>{const q=tx(store,'readwrite').put(data);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});
  const _getAll=(store)=>new Promise((res,rej)=>{const q=tx(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});
  const _clearAll=()=>new Promise((res,rej)=>{const t=db.transaction(db.objectStoreNames,'readwrite');Array.from(db.objectStoreNames).forEach(s=>t.objectStore(s).clear());t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});

  // 安全封装：失败仅打印日志并返回 null / 空值，不抛出
  const init=async()=>{try{await open();}catch(e){console.error('DB.init 失败，使用内存模式',e);db=null;}};
  const get=async(store,key)=>{if(!db)return null;try{return await _get(store,key);}catch(e){console.error('DB.get 失败',store,key,e);return null;}};
  const getAll=async(store)=>{if(!db)return[];try{return await _getAll(store)||[];}catch(e){console.error('DB.getAll 失败',store,e);return[];}};
  const put=async(store,data)=>{if(!db)return;try{await _put(store,data);}catch(e){console.error('DB.put 失败',store,e);}};
  const clear=async()=>{if(!db)return;try{await _clearAll();}catch(e){console.error('DB.clear 失败',e);}};

  return{init,open,get,put,getAll,clear};
})();

/* ===================== AI 引擎 ===================== */
const AI=(()=>{
  const D=AI_DATA;
  const analyzeEmotion=(text)=>{
    let score=5,neg=0,pos=0,crisis=false;const lower=text.toLowerCase();
    Object.entries(D.emotionDict).forEach(([w,v])=>{
      if(lower.includes(w)){
        if(v>0)pos+=v;else neg+=-v;
        if(v<=-10)crisis=true;
      }
    });
    if(pos||neg) score=Math.max(0,Math.min(10,5+(pos-neg)*0.6));
    let label=score<=3?'low':score<=6?'mid':'high';
    if(crisis){label='crisis';score=0;}
    return{score,label,crisis};
  };
  const detectScene=(text)=>{
    const lower=text.toLowerCase();
    for(const [scene,words] of Object.entries(D.scenes)){
      if(words.some(w=>lower.includes(w))) return scene;
    }
    return 'self';
  };
  const isStuck=(text)=>D.stuckTriggers.some(t=>text.includes(t));
  const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
  const getOpening=(comp)=>pick(comp.opening);
  const getSecond=(comp)=>pick(comp.second);
  const getDeep=(comp)=>pick(comp.deep);
  const getFarewell=(comp)=>pick(comp.farewell);
  const getResponse=(comp,scene,emotionLabel,emotionScore)=>{
    const t=comp.templates[scene]||comp.templates.self;
    let line=t[emotionLabel]||t.mid;
    if(emotionLabel==='crisis') line=comp.templates.crisis?comp.templates.crisis.low||comp.templates.crisis.mid:line;
    return line;
  };
  const getSocratic=(comp,step)=>{
    const s=D.socratic[comp.id];
    return s[step%s.length];
  };
  return{analyzeEmotion,detectScene,isStuck,pick,getOpening,getSecond,getDeep,getFarewell,getResponse,getSocratic};
})();

/* ===================== 4 Agent（反向场景规则分支） ===================== */
const Agent=(()=>{
  const rule=(cond,action)=>({cond,action});
  const runRules=(rules,ctx)=>{for(const r of rules) if(r.cond(ctx)) return r.action(ctx);return null;};

  // 场景 1：22:00 断网仪式
  const offlineRules=[
    rule(c=>c.phase==='start',c=>({type:'timer',minutes:30,grayscale:true,after:'ask-kept'})),
    rule(c=>c.phase==='ask-kept',c=>({type:'card',title:'断网仪式完成',body:'今晚最想保留的 3 件事是什么？',actions:['记录','跳过','再 10 分钟']}))
  ];
  // 场景 2：短视频干预（三选一）
  const shortVideoRules=[
    rule(c=>c.phase==='trigger',c=>({type:'card',title:`今天第 ${c.count||1} 次打开`,body:'想继续吗？',actions:['继续刷','看 30 秒就退','4-7-8 呼吸']})),
    rule(c=>c.phase==='continue',c=>({type:'text',text:'好，30 分钟后我们可以再碰一面。'})),
    rule(c=>c.phase==='stop30',c=>({type:'timer',minutes:0.5,after:'back-to-chat'})),
    rule(c=>c.phase==='breath',c=>({type:'breath',rounds:4}))
  ];
  // 场景 3：周末反向日
  const reverseDayRules=[
    rule(c=>c.phase==='plan',c=>({type:'card',title:'周末反向日计划',body:'1 个最难目标 + 3 个小步骤',actions:['制定计划','跳过']}))
  ];
  // 场景 4：周记意义感回望
  const weeklyRules=[
    rule(c=>c.phase==='start',c=>({type:'card',title:'本周意义感回望',body:'我们来做 3 问对话，生成你的周记。',actions:['开始']}))
  ];

  const buildScenario=(type,companion,ctx={})=>{
    const text=companion.scenario[type].replace(/{{(\w+)}}/g,(m,k)=>ctx[k]??'');
    let action=null;
    if(type==='offline') action=runRules(offlineRules,{...ctx,phase:ctx.phase||'start'});
    if(type==='shortVideo') action=runRules(shortVideoRules,{...ctx,phase:ctx.phase||'trigger'});
    if(type==='reverseDay') action=runRules(reverseDayRules,{...ctx,phase:ctx.phase||'plan'});
    if(type==='weekly') action=runRules(weeklyRules,{...ctx,phase:ctx.phase||'start'});
    return{text,action};
  };

  // 触发时点判断：22:00 / 周五 18:00 / 周日 21:00
  const checkTriggers=()=>{
    const now=new Date(),h=now.getHours(),m=now.getMinutes(),dow=now.getDay();
    const triggers=[];
    if(h===22&&m===0) triggers.push({type:'offline'});
    if(dow===5&&h===18&&m===0) triggers.push({type:'reverseDay'});
    if(dow===0&&h===21&&m===0) triggers.push({type:'weekly'});
    return triggers;
  };

  return{buildScenario,checkTriggers};
})();

        (m.actions||[]).forEach(a=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>handleCardAction(a,m);acts.appendChild(b);});
        div.appendChild(title);div.appendChild(body);div.appendChild(acts);
        return box.appendChild(div);
      }else if(m.type==='breath'){
        div.className+=' breath-container';
        div.innerHTML='<div class="breath-circle"><span style="color:var(--accent-blue);font-size:13px">呼吸</span></div><div class="breath-text">吸气 4 秒 · 屏息 7 秒 · 呼气 8 秒</div>';
      }else if(m.type==='timer'){
        const overlay=document.createElement('div');overlay.className='timer-overlay'+(m.grayscale?' grayscale':'');
        box.appendChild(overlay);renderTimer(overlay,m.minutes||30,m.after);return;
      }else if(m.type==='data'){
        div.className+=' card-msg';
        div.innerHTML=`<div class="card-title">${m.title||'数据卡片'}</div><div class="card-body">${m.body||''}</div>`;
      }
      const t=document.createElement('div');t.className='message-time';t.textContent=Util.fmtTime(m.timestamp);div.appendChild(t);
      box.appendChild(div);
    });
    box.scrollTop=box.scrollHeight;
  };

  const renderTimer=(container,minutes,after)=>{
    container.innerHTML=`<div class="timer-circle"><div class="timer-progress" id="tp"></div><div class="timer-text" id="tt">${Math.floor(minutes)}:00</div></div><div class="timer-label">无手机窗口 · ${minutes} 分钟</div><button id="timer-skip">提前结束</button>`;
    let total=Math.round(minutes*60),left=total;const tp=$('tp'),tt=$('tt');
    const iv=setInterval(()=>{
      left--;
      if(left<0){clearInterval(iv);return;}
      const m=Math.floor(left/60).toString().padStart(2,'0'),s=(left%60).toString().padStart(2,'0');tt.textContent=`${m}:${s}`;
      const pct=1-left/total;tp.style.clipPath=`polygon(0 0,100% 0,100% ${pct*100}%,0 ${pct*100}%)`;
      if(left<=0){clearInterval(iv);finishTimer(after);}
    },1000);
    const skip=$('timer-skip');if(skip)skip.onclick=()=>{clearInterval(iv);finishTimer(after);};
  };

  const finishTimer=(after)=>{
    if(after==='ask-kept') insertCard('断网仪式完成','今晚最想保留的 3 件事是什么？',['记录','跳过']);
    else renderMessages();
  };

  const insertCard=(title,body,actions)=>{
    const conv=state.conversation;if(!conv)return;
    conv.messages.push({role:state.currentCompanion.name,title,body,text:body,timestamp:Date.now(),type:'card',actions});
    conv.updatedAt=Date.now();saveCurrentConv();renderMessages();
  };

  const handleCardAction=(action,msg)=>{
    const comp=state.currentCompanion;
    if(action.includes('记录')){addMessage('user','我想记录一下');setTimeout(()=>addMessage(comp.name,'好的，一件一件说，我会帮你整理。','text'),400);}
    else if(action.includes('跳过')||action.includes('再')){addMessage('user','跳过');setTimeout(()=>addMessage(comp.name,'没关系，下次再说。','text'),400);}
    else if(action.includes('30 秒')){addMessage(comp.name,'','timer',{minutes:0.5,after:'back-to-chat'});}
    else if(action.includes('呼吸')){addMessage(comp.name,'','breath');}
    else if(action.includes('继续')){addMessage(comp.name,'好，那我们不打扰你，需要时再叫我。','text');}
    else if(action.includes('制定')||action.includes('开始')){addMessage('user','开始');setTimeout(()=>addMessage(comp.name,'第一个问题：这周哪一件事，让你觉得自己在活着？','text'),400);}
  };

  const addMessage=(role,text,type='text',extra={})=>{
    const conv=state.conversation;if(!conv)return false;
    conv.messages.push({role,text,timestamp:Date.now(),type,...extra});
    conv.updatedAt=Date.now();
    // 自动标题：首条用户消息前 15 字
    if(role==='user'&&conv.title==='新对话'){
      const title=text.slice(0,15)+(text.length>15?'...':'');conv.title=title;
    }
    saveCurrentConv();renderMessages();renderSidebar();return true;
  };

  const saveCurrentConv=async()=>{
    const comp=state.currentCompanion.name;
    if(state.conversations&&state.conversations[comp])await DB.put('conversations',{companion:comp,list:state.conversations[comp]});
  };

  // 发送用户消息并生成回复
  const sendUserMessage=async()=>{
    const input=$('user-input');const text=input.value.trim();if(!text)return;
    input.value='';input.style.height='auto';
    if(!state.conversation) await newConversation();
    addMessage('user',text);
    await generateReply(text);
  };

  const generateReply=async(text)=>{
    const comp=state.currentCompanion;const emotion=AI.analyzeEmotion(text);const scene=AI.detectScene(text);
    let replyText='';
    // 短句破冰：连续 3 条 1-3 字短句主动破冰
    if(text.length<=3){state.shortStreak++;}else{state.shortStreak=0;}
    if(state.shortStreak>=3&&!emotion.crisis){
      replyText='你想聊一句长一点的话吗？也可以不说话。';state.stuckStep=0;
    }else if(emotion.crisis){
      replyText='我听到你说这些，真的很担心你。你现在身边有人吗？可以先联系信赖的朋友，或拨打 24 小时心理援助热线 400-161-9995。';
      state.stuckStep=0;
    }else if(AI.isStuck(text)){
      const step=state.stuckStep;replyText=AI.getSocratic(comp,step);state.stuckStep=step+1;
    }else{
      replyText=AI.getResponse(comp,scene,emotion.label,emotion.score);
      state.stuckStep=0;
    }
    setTimeout(()=>{addMessage(comp.name,replyText,'text');},Math.max(300,Math.min(800,replyText.length*15)));
  };

  // 影响力页
  const showImpact=async()=>{
    $('impact-page').classList.remove('hidden');
    const records=await DB.getAll('dailyRecords');const reviews=await DB.getAll('weeklyReviews');
    drawChart(records);renderWeeklyList(reviews);
  };
  const hideImpact=()=>$('impact-page').classList.add('hidden');
  const drawChart=(records)=>{
    const svg=$('impact-chart');if(!svg)return;svg.innerHTML='';
    const days=[];
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(`${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`);}
    const data=days.map(date=>{const r=(records||[]).find(x=>x.date===date);return{date,i:r?.innerCount||0,q:r?.quietMin||0,o:r?.offlineDone?1:0};});
    const W=360,H=180,PAD=30;const max=Math.max(1,...data.map(d=>Math.max(d.i,d.q,d.o*5)));
    const xOf=i=>PAD+(i*(W-PAD*2)/6);
    const bar=(d,i)=>{const bh=Math.max(2,(d.i/max)*(H-PAD*2));return `<rect x="${xOf(i)-6}" y="${H-PAD-bh}" width="5" height="${bh}" fill="var(--accent-orange)" rx="2"/><rect x="${xOf(i)+1}" y="${H-PAD-(Math.max(2,(d.q/max)*(H-PAD*2)))}" width="5" height="${Math.max(2,(d.q/max)*(H-PAD*2))}" fill="var(--accent-blue)" rx="2"/>${d.o?`<circle cx="${xOf(i)+8}" cy="${H-PAD-10}" r="4" fill="var(--success)"/>`:''}`;};
    const labels=days.map((d,i)=>`<text x="${xOf(i)}" y="${H-8}" font-size="8" fill="var(--text-muted)" text-anchor="middle">${d.slice(5)}</text>`).join('');
    svg.innerHTML=data.map((d,i)=>bar(d,i)).join('')+labels;
  };
  const renderWeeklyList=(reviews)=>{
    const list=$('weekly-list');if(!list)return;list.innerHTML='';
    if(!reviews||!reviews.length){list.innerHTML='<div class="empty-state">还没有周报，周日 21 点会自动生成。</div>';return;}
    reviews.sort((a,b)=>(b.week||'').localeCompare(a.week||'')).forEach(r=>{
      const item=document.createElement('div');item.className='report-item';
      item.innerHTML=`<div class="week">${r.week||'--'} · 意义感 ${r.meaningScore||'--'}/10</div><div class="txt">${(r.highlights||[]).join(' · ')||'暂无记录'}</div>`;
      list.appendChild(item);
    });
  };

  // 菜单
  const toggleMenu=()=>{const m=$('menu-dropdown'),o=$('overlay');const s=!m.classList.contains('show');m.classList.toggle('show',s);o.classList.toggle('show',s);};
  const closeMenu=()=>{$('menu-dropdown').classList.remove('show');$('overlay').classList.remove('show');if($('modal').classList.contains('show'))return;};

  // 导出 JSON
  const exportJSON=async()=>{
    const data={user:state.user,conversations:state.conversations||{},dailyRecords:await DB.getAll('dailyRecords'),weeklyReviews:await DB.getAll('weeklyReviews'),exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`心屿备份_${Util.today()}.json`;a.click();URL.revokeObjectURL(url);
  };

  // 模态
  const showModal=(title,body,onConfirm,onCancel)=>{
    $('modal-title').textContent=title;$('modal-body').textContent=body;
    const m=$('modal'),o=$('overlay');m.classList.add('show');o.classList.add('show');
    const confirm=()=>{hideModal();if(onConfirm)onConfirm();};
    const cancel=()=>{hideModal();if(onCancel)onCancel();};
    $('modal-confirm').onclick=confirm;$('modal-cancel').onclick=cancel;
  };
  const hideModal=()=>{$('modal').classList.remove('show');$('overlay').classList.remove('show');};

  // 锁定：跳回欢迎页，清空临时状态
  const lockApp=()=>{
    $('main').classList.add('hidden');
    $('lock-screen').classList.remove('hidden');
    const pi=$('pwd-input');pi.value='';$('pwd-error').textContent='';
    pi.focus();
    state.currentConvId=null;state.conversation=null;state.stuckStep=0;state.shortStreak=0;
    if(state.user&&state.user.passwordHash)$('pwd-hint').textContent='请输入密码进入';
  };

  // 通知：用 requestPermission 返回值接收权限，Notification.permission 只读不可赋值
  const requestNotification=async()=>{
    if(!('Notification' in window)){alert('浏览器不支持通知');return;}
    try{
      const permission=await Notification.requestPermission();
      if(state.user){state.user.notificationsEnabled=(permission==='granted');await DB.put('user',state.user);}
      updateNotifText();
    }catch(e){console.error('请求通知权限失败',e);}
  };
  const updateNotifText=()=>{const el=$('toggle-notif');if(el)el.textContent=state.user?.notificationsEnabled?'关闭通知':'开启通知';};
  const maybeNotify=async()=>{
    if(!state.user?.notificationsEnabled)return;
    const triggers=Agent.checkTriggers();if(!triggers.length)return;
    const comp=state.currentCompanion||AI_DATA.companions.find(c=>c.id===state.user.currentCompanion)||AI_DATA.companions[0];
    triggers.forEach(t=>{
      const {text}=Agent.buildScenario(t.type,comp,{count:1});
      try{new Notification('心屿',{body:text,icon:'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="%23ff8a65"/></svg>'});}catch(e){console.warn('通知发送失败',e);}
    });
  };

  /* ===== 事件绑定 =====
     关键修复：必须在 DB.init() 之前同步绑定，确保 IndexedDB 初始化失败时按钮仍可点击。 */
  const bindEvents=()=>{
    // 主对话区按钮
    const ncs=$('new-chat-sidebar');if(ncs)ncs.onclick=newConversation;
    const nch=$('new-chat-header');if(nch)nch.onclick=newConversation;
    const sb=$('send-btn');if(sb)sb.onclick=sendUserMessage;
    const ta=$('user-input');
    if(ta){
      ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendUserMessage();}});
      ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';});
    }
    const mb=$('menu-btn');if(mb)mb.onclick=toggleMenu;
    const ov=$('overlay');if(ov)ov.onclick=closeMenu;
    const mi=$('menu-impact');if(mi)mi.onclick=()=>{closeMenu();showImpact();};
    const me=$('menu-export');if(me)me.onclick=()=>{closeMenu();exportJSON();};
    const ms=$('menu-settings');if(ms)ms.onclick=()=>{closeMenu();showModal('设置','通知、隐私与数据均保存在本地 IndexedDB，你的数据不出你的手机。',()=>{});};
    const ml=$('menu-lock');if(ml)ml.onclick=()=>{closeMenu();lockApp();};
    const lb=$('lock-btn');if(lb)lb.onclick=lockApp;
    const ci=$('close-impact');if(ci)ci.onclick=hideImpact;

    // 锁屏按钮（即使 DB 未就绪也要可点击）
    const pb=$('pwd-btn');if(pb)pb.onclick=checkPassword;
    const pi=$('pwd-input');
    if(pi)pi.addEventListener('keydown',e=>{if(e.key==='Enter')checkPassword();});
    const rd=$('reset-data');if(rd)rd.onclick=()=>showModal('重置数据','警告：无法找回密码，重置将清空所有本地数据。',async()=>{await DB.clear();location.reload();});
    const tn=$('toggle-notif');if(tn)tn.onclick=()=>{if(state.user&&state.user.notificationsEnabled){state.user.notificationsEnabled=false;DB.put('user',state.user);updateNotifText();}else requestNotification();};
  };

  // 密码校验：sha256 失败时显示错误，不崩溃
  const checkPassword=async()=>{
    const input=$('pwd-input').value.trim();const err=$('pwd-error');
    if(!/^\d{4,6}$/.test(input)){err.textContent='请输入 4-6 位数字';return;}
    let hash;
    try{hash=await Util.sha256(input);}
    catch(e){console.error('sha256 失败',e);err.textContent='密码加密失败，请重试';return;}
    if(!state.user){
      // user 还没加载完（极端情况），创建默认
      state.user={id:'default',passwordHash:'',createdAt:Date.now(),totalDays:1,currentCompanion:'wenyan',notificationsEnabled:false};
    }
    if(!state.user.passwordHash){state.user.passwordHash=hash;await DB.put('user',state.user);enterApp();}
    else if(hash===state.user.passwordHash) enterApp();
    else err.textContent='密码错误';
  };

  const enterApp=()=>{
    $('lock-screen').classList.add('hidden');$('main').classList.remove('hidden');$('pwd-error').textContent='';
    if(!state.conversation)newConversation();
  };

  // 初始化
  const init=async()=>{
    // 1) 先绑定全部事件（DB 未就绪也可点击）
    bindEvents();
    // 2) 再初始化数据库（失败降级为内存模式）
    await DB.init();
    // 3) 加载用户
    let user=await DB.get('user','default');
    if(!user) user={id:'default',passwordHash:'',createdAt:Date.now(),totalDays:1,currentCompanion:'wenyan',notificationsEnabled:false};
    state.user=user;
    if(user.currentCompanion) state.currentCompanion=AI_DATA.companions.find(c=>c.id===user.currentCompanion)||AI_DATA.companions[0];
    // 4) 加载对话
    const convData=await DB.get('conversations',state.currentCompanion.name)||{companion:state.currentCompanion.name,list:[]};
    state.conversations={};state.conversations[state.currentCompanion.name]=convData.list||[];
    // 5) 渲染
    updateNotifText();renderHeader();renderSidebar();renderMessages();
    // 6) 锁屏文案
    if(user.passwordHash){$('pwd-hint').textContent='请输入密码进入';}else{$('pwd-hint').textContent='首次使用请设置 4-6 位数字密码';}
    // 7) 通知检查
    setInterval(maybeNotify,60000);
  };

  return{init,avatars,getAvatar};
})();

// 启动
UI.init();
</script>
</body>
</html>
