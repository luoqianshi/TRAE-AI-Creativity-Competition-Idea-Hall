// ========== 渲染函数 ==========
function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);
    if (currentView === 'national') { renderNational(); }
    else { renderJiankang(); }
    ctx.restore();
}

function renderNational() {
    // 疆域
    ctx.beginPath();
    ctx.moveTo(nationalBoundary[0][0]*width, nationalBoundary[0][1]*height);
    for (var i=1;i<nationalBoundary.length;i++) {
        ctx.lineTo(nationalBoundary[i][0]*width, nationalBoundary[i][1]*height);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(139,69,19,.06)'; ctx.fill();
    ctx.strokeStyle='#8b4513'; ctx.lineWidth=2; ctx.stroke();

    // 州界
    ctx.strokeStyle='#8b451430'; ctx.lineWidth=1;
    var lines=[
        [[0.62,0.23],[0.62,0.43],[0.58,0.36],[0.55,0.42]],
        [[0.70,0.23],[0.70,0.40],[0.65,0.46],[0.63,0.53]],
        [[0.78,0.22],[0.78,0.30],[0.84,0.36],[0.82,0.45]]
    ];
    for(var li=0;li<lines.length;li++){
        ctx.beginPath();ctx.moveTo(lines[li][0][0]*width,lines[li][0][1]*height);
        for(var lj=1;lj<lines[li].length;lj++)ctx.lineTo(lines[li][lj][0]*width,lines[li][lj][1]*height);
        ctx.stroke();
    }

    // 山脉
    for(var mi=0;mi<nationalMountains.length;mi++){
        var m=nationalMountains[mi];
        ctx.beginPath();ctx.moveTo(m.pts[0][0]*width,m.pts[0][1]*height);
        for(var mj=1;mj<m.pts.length;mj++)ctx.lineTo(m.pts[mj][0]*width,m.pts[mj][1]*height);
        ctx.strokeStyle='#6b5b3e';ctx.lineWidth=3;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
        var mp=m.pts[Math.floor(m.pts.length/2)];
        ctx.fillStyle='#6b5b3e';ctx.font='10px serif';ctx.textAlign='center';
        ctx.fillText(m.name,mp[0]*width,mp[1]*height-6);
    }

    // 湖泊
    for(var li=0;li<nationalLakes.length;li++){
        var lk=nationalLakes[li];
        ctx.beginPath();ctx.arc(lk.x*width,lk.y*height,lk.r,0,Math.PI*2);
        ctx.fillStyle='#5082dc20';ctx.fill();
        ctx.strokeStyle='#5082dc60';ctx.lineWidth=1;ctx.stroke();
        ctx.fillStyle='#5082dc90';ctx.font='10px serif';ctx.textAlign='center';
        ctx.fillText(lk.name,lk.x*width,lk.y*height+4);
    }

    // 河流
    for(var ri=0;ri<nationalRivers.length;ri++){
        var rv=nationalRivers[ri];
        ctx.beginPath();ctx.moveTo(rv.pts[0][0]*width,rv.pts[0][1]*height);
        for(var rj=1;rj<rv.pts.length;rj++)ctx.lineTo(rv.pts[rj][0]*width,rv.pts[rj][1]*height);
        ctx.strokeStyle='#5082dc';ctx.lineWidth=rv.w;ctx.stroke();
        var rmp=rv.pts[Math.floor(rv.pts.length/2)];
        ctx.fillStyle='#5082dccc';ctx.font='11px serif';ctx.textAlign='center';
        ctx.fillText(rv.name,rmp[0]*width,rmp[1]*height-8);
    }

    // 州治
    for(var si=0;si<nationalStates.length;si++){
        var s=nationalStates[si];
        var sx=s.x*width, sy=s.y*height;
        // 扬州脉冲
        if(s.id==='yangzhou'){
            var t=Date.now()/800;
            var pr=13+Math.sin(t)*4;
            ctx.beginPath();ctx.arc(sx,sy,pr,0,Math.PI*2);
            ctx.strokeStyle='rgba(212,168,83,.3)';ctx.lineWidth=1.5;ctx.stroke();
        }
        if(s===selectedRegion||s===hoveredRegion){
            ctx.beginPath();ctx.arc(sx,sy,20,0,Math.PI*2);
            ctx.fillStyle=s.color+'25';ctx.fill();ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.stroke();
        }
        ctx.beginPath();ctx.arc(sx,sy,s.type==='capital'?11:8,0,Math.PI*2);
        ctx.fillStyle=s.color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#e8d5b7';ctx.font=(s.type==='capital'?'bold ':'')+'13px serif';ctx.textAlign='center';
        ctx.fillText(s.name,sx,sy-15);
        ctx.fillStyle=s.color+'cc';ctx.font='10px serif';
        ctx.fillText('('+s.capital+')',sx,sy+22);
    }

    ctx.fillStyle='#8b6914';ctx.font='12px serif';ctx.textAlign='left';
    ctx.fillText('南朝疆域示意图（萧梁时期）',20,height-20);
    ctx.fillStyle='#6b5b3e';ctx.font='10px serif';
    ctx.fillText('参考：谭其骧《中国历史地图集》第四册',20,height-38);
}

function renderJiankang() {
    // 城垣
    var wallColors={palace:'rgba(212,168,83,.12)',city:'rgba(139,69,19,.06)',outer:'rgba(60,180,120,.04)'};
    var wallStrokes={palace:'#d4a853',city:'#8b4513',outer:'#3cb47860'};
    for(var wi=0;wi<jkWalls.length;wi++){
        var w=jkWalls[wi];
        var wx=w.rect[0]*width,wy=w.rect[1]*height,ww=w.rect[2]*width,wh=w.rect[3]*height;
        ctx.fillStyle=wallColors[w.type];ctx.fillRect(wx,wy,ww,wh);
        ctx.strokeStyle=wallStrokes[w.type];
        ctx.lineWidth=w.type==='palace'?3:w.type==='city'?2:1;
        ctx.setLineDash(w.type==='outer'?[8,4]:[]);ctx.strokeRect(wx,wy,ww,wh);ctx.setLineDash([]);
        ctx.fillStyle=wallStrokes[w.type];ctx.font='11px serif';ctx.textAlign='left';
        ctx.fillText(w.name,wx+5,wy+15);
    }
    // 街道
    for(var si=0;si<jkStreets.length;si++){
        var st=jkStreets[si];
        ctx.beginPath();ctx.moveTo(st.from[0]*width,st.from[1]*height);
        ctx.lineTo(st.to[0]*width,st.to[1]*height);
        ctx.strokeStyle=st.main?'#b8956a50':'#b8956a25';
        ctx.lineWidth=st.main?3:1.5;ctx.stroke();
        var smx=(st.from[0]+st.to[0])/2*width, smy=(st.from[1]+st.to[1])/2*height;
        ctx.fillStyle='#b8956a80';ctx.font='9px serif';ctx.textAlign='center';
        ctx.fillText(st.name,smx,smy-4);
    }
    // 河流
    for(var ri=0;ri<jkRivers.length;ri++){
        var rv=jkRivers[ri];
        ctx.beginPath();ctx.moveTo(rv.from[0]*width,rv.from[1]*height);
        ctx.lineTo(rv.to[0]*width,rv.to[1]*height);
        ctx.strokeStyle=rv.main?'#5082dcb0':'#5082dc70';
        ctx.lineWidth=rv.main?10:5;ctx.stroke();
        var rmx=(rv.from[0]+rv.to[0])/2*width, rmy=(rv.from[1]+rv.to[1])/2*height;
        ctx.fillStyle='#5082dccc';ctx.font='11px serif';ctx.textAlign='center';
        ctx.fillText(rv.name,rmx,rmy-12);
    }
    // 城门
    for(var gi=0;gi<jkGates.length;gi++){
        var g=jkGates[gi];
        var gx=g.x*width,gy=g.y*height;
        ctx.beginPath();ctx.arc(gx,gy,6,0,Math.PI*2);
        ctx.fillStyle='#dc5040';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#e8d5b7';ctx.font='9px serif';ctx.textAlign='center';
        ctx.fillText(g.name,gx,gy+16);
    }
    // 地标
    var typeColors={gate:'#dc5040',residence:'#c89664',fort:'#a050b4',market:'#64b4c8',temple:'#d4a853',mountain:'#8b6914',water:'#5082dc',palace:'#d4a853',craft:'#b46464'};
    for(var li=0;li<jkLandmarks.length;li++){
        var lm=jkLandmarks[li];
        var lx=lm.x*width, ly=lm.y*height;
        if(lm===selectedRegion||lm===hoveredRegion){
            ctx.beginPath();ctx.arc(lx,ly,lm.r+6,0,Math.PI*2);
            ctx.fillStyle='rgba(212,168,83,.15)';ctx.fill();ctx.strokeStyle='#d4a853';ctx.lineWidth=2;ctx.stroke();
        }
        ctx.beginPath();ctx.arc(lx,ly,lm.r,0,Math.PI*2);
        ctx.fillStyle=typeColors[lm.type]||'#d4a853';ctx.fill();
        ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#e8d5b7';ctx.font='bold 11px serif';ctx.textAlign='center';
        ctx.fillText(lm.name,lx,ly+lm.r+14);
    }
    // 区域标签
    ctx.fillStyle='rgba(200,150,100,.2)';ctx.font='bold 14px serif';ctx.textAlign='center';
    ctx.fillText('长干里居民区',0.56*width,0.86*height);
    ctx.fillStyle='rgba(100,180,200,.2)';
    ctx.fillText('秦淮商业区',0.50*width,0.68*height);
    ctx.fillStyle='rgba(180,100,100,.2)';ctx.font='bold 13px serif';
    ctx.fillText('斗场手工业区',0.68*width,0.56*height);

    ctx.fillStyle='#8b6914';ctx.font='12px serif';ctx.textAlign='left';
    ctx.fillText('建康城平面图（萧梁时期）',20,height-20);
    ctx.fillStyle='#6b5b3e';ctx.font='10px serif';
    ctx.fillText('数据来源：《景定建康志》《丹阳记》',20,height-38);
    ctx.fillText('参考：谭其骧《中国历史地图集》、考古发现',20,height-52);
}

// ========== 交互 ==========
function getRegionAt(x,y){
    var mx=(x-offsetX)/scale, my=(y-offsetY)/scale;
    if(currentView==='national'){
        for(var i=0;i<nationalStates.length;i++){
            var s=nationalStates[i];
            var dx=mx-s.x*width, dy=my-s.y*height;
            if(Math.sqrt(dx*dx+dy*dy)<=22) return s;
        }
    }else{
        for(var i=0;i<jkLandmarks.length;i++){
            var lm=jkLandmarks[i];
            var dx=mx-lm.x*width, dy=my-lm.y*height;
            if(Math.sqrt(dx*dx+dy*dy)<=lm.r+5) return lm;
        }
        for(var i=0;i<jkGates.length;i++){
            var g=jkGates[i];
            var dx=mx-g.x*width, dy=my-g.y*height;
            if(Math.sqrt(dx*dx+dy*dy)<=12) return g;
        }
        for(var i=0;i<jkWalls.length;i++){
            var w=jkWalls[i];
            var r=w.rect;
            if(mx>=r[0]*width&&mx<=(r[0]+r[2])*width&&my>=r[1]*height&&my<=(r[1]+r[3])*height) return w;
        }
    }
    return null;
}

        var typeMap={palace:'宫殿',city:'城墙',outer:'外郭',gate:'城门',residence:'民居',fort:'城垒',market:'市集',temple:'寺院',mountain:'山岳',water:'水域',craft:'作坊'};
        var tagCls={residence:'tag-residence',market:'tag-market',craft:'tag-craft',palace:'tag-capital',fort:'tag-military',temple:'tag-cultural'};
        tagsHtml='<span class="tag '+(tagCls[region.type]||'tag-cultural')+'">'+(typeMap[region.type]||region.type)+'</span>';
        bodyHtml='<div class="panel-section"><h3>位置与功能</h3><p>'+region.desc+'</p></div>';
    }
    document.getElementById('panelBody').innerHTML='<div class="tag-list">'+tagsHtml+'</div>'+bodyHtml;

    // 绑定按钮
    var enterBtn=document.getElementById('enterJiankang');
    if(enterBtn) enterBtn.onclick=switchToJiankang;
}

function switchToJiankang(){
    document.querySelectorAll('.view-tab').forEach(function(t){t.classList.remove('active');});
    document.querySelector('[data-view="jiankang"]').classList.add('active');
    currentView='jiankang';
    document.getElementById('controlTitle').textContent='建康城 · 平民生活视角';
    scale=1.1;offsetX=-width*0.05;offsetY=-height*0.03;
    selectedRegion=null;
    updateLegend();
    document.getElementById('emptyState').style.display='block';
    document.getElementById('panelContent').style.display='none';
    render();
}

function switchToNational(){
    document.querySelectorAll('.view-tab').forEach(function(t){t.classList.remove('active');});
    document.querySelector('[data-view="national"]').classList.add('active');
    currentView='national';
    document.getElementById('controlTitle').textContent='南朝地理空间系统';
    scale=1;offsetX=0;offsetY=0;selectedRegion=null;
    updateLegend();
    document.getElementById('emptyState').style.display='block';
    document.getElementById('panelContent').style.display='none';
    render();
}

function updateLegend(){
    var legend=document.getElementById('mapLegend');
    if(currentView==='national'){
        legend.innerHTML='<div class="legend-title">图例</div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#d4a853;width:12px;height:12px"></div><span>京畿（扬州）</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#dc5040"></div><span>军事重镇</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#3cb478"></div><span>经济中心</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#a050b4"></div><span>边陲州郡</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#5082dc;width:20px;height:3px;border-radius:0"></div><span>河流</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#6b5b3e;width:20px;height:2px;border-radius:0"></div><span>山脉</span></div>';
    }else{
        legend.innerHTML='<div class="legend-title">图例</div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#d4a853"></div><span>宫殿/寺庙</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#c89664"></div><span>居民区</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#64b4c8"></div><span>商业区</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#b46464"></div><span>手工业区</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#dc5040"></div><span>城门/要塞</span></div>'+
            '<div class="legend-item"><div class="legend-dot" style="background:#5082dc;width:20px;height:4px;border-radius:0"></div><span>秦淮河</span></div>';
    }
}

// ========== 事件绑定 ==========
canvas.addEventListener('mousedown',function(e){
    var rect=canvas.getBoundingClientRect();
    lastX=e.clientX-rect.left;lastY=e.clientY-rect.top;isDragging=true;
    var region=getRegionAt(lastX,lastY);
    if(region){selectedRegion=region;showRegionDetail(region);}
});
canvas.addEventListener('mousemove',function(e){
    var rect=canvas.getBoundingClientRect();
    var x=e.clientX-rect.left,y=e.clientY-rect.top;
    if(isDragging){offsetX+=x-lastX;offsetY+=y-lastY;lastX=x;lastY=y;render();}
    else{hoveredRegion=getRegionAt(x,y);canvas.style.cursor=hoveredRegion?'pointer':'grab';render();}
});
canvas.addEventListener('mouseup',function(){isDragging=false;});
canvas.addEventListener('mouseleave',function(){isDragging=false;});
canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    var rect=canvas.getBoundingClientRect();
    var x=e.clientX-rect.left,y=e.clientY-rect.top;
    var factor=e.deltaY<0?1.1:0.9;
    var ns=Math.max(0.5,Math.min(4,scale*factor));
    offsetX=x-(x-offsetX)*(ns/scale);offsetY=y-(y-offsetY)*(ns/scale);scale=ns;render();
},{passive:false});

canvas.addEventListener('touchstart',function(e){
    e.preventDefault();
    var touch=e.touches[0],rect=canvas.getBoundingClientRect();
    lastX=touch.clientX-rect.left;lastY=touch.clientY-rect.top;isDragging=true;
    var region=getRegionAt(lastX,lastY);
    if(region){selectedRegion=region;showRegionDetail(region);}
},{passive:false});
canvas.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(isDragging&&e.touches.length===1){
        var touch=e.touches[0],rect=canvas.getBoundingClientRect();
        var x=touch.clientX-rect.left,y=touch.clientY-rect.top;
        offsetX+=x-lastX;offsetY+=y-lastY;lastX=x;lastY=y;render();
    }
},{passive:false});
canvas.addEventListener('touchend',function(){isDragging=false;});

document.querySelectorAll('.view-tab').forEach(function(tab){
    tab.addEventListener('click',function(){
        document.querySelectorAll('.view-tab').forEach(function(t){t.classList.remove('active');});
        tab.classList.add('active');
        currentView=tab.dataset.view;
        document.getElementById('controlTitle').textContent=currentView==='national'?'南朝地理空间系统':'建康城 · 平民生活视角';
        scale=1;offsetX=0;offsetY=0;selectedRegion=null;
        updateLegend();
        document.getElementById('emptyState').style.display='block';
        document.getElementById('panelContent').style.display='none';
        render();
    });
});

document.getElementById('zoomIn').addEventListener('click',function(){scale=Math.min(4,scale*1.2);render();});
document.getElementById('zoomOut').addEventListener('click',function(){scale=Math.max(0.5,scale/1.2);render();});
document.getElementById('zoomReset').addEventListener('click',function(){scale=1;offsetX=0;offsetY=0;render();});

// ========== 初始化 ==========
resize();
updateLegend();
render();
// 延迟再渲染一次，确保布局完成
setTimeout(function(){resize();render();},200);
// 扬州脉冲动画
setInterval(function(){if(currentView==='national')render();},800);
// 窗口大小变化
window.addEventListener('resize',function(){resize();render();});
</script>
</body>
</html>
