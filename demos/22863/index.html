<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星途成长档案馆</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #0C1929;
            --primary-gold: #FFD700;
            --nebu-purple: #6B4E9E;
            --aurora-green: #00FF88;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--primary-blue);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: var(--glass-hover);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.15);
        }

        .gold-gradient {
            background: linear-gradient(135deg, var(--primary-gold), #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gold-border {
            border: 2px solid var(--primary-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(12, 25, 41, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-logo i {
            color: var(--primary-gold);
            animation: pulse 2s infinite;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary-gold);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .main-content {
            margin-top: 70px;
            padding: 40px 20px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-section {
            text-align: center;
            padding: 80px 20px;
            animation: fadeInUp 1s ease;
        }

        .hero-title {
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff, var(--primary-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
        }

        .hero-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-gold);
            animation: countUp 2s ease;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .dashboard-card {
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        .dashboard-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary-gold), transparent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, 0.1);
            color: var(--primary-gold);
        }

        .card-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .card-value {
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
        }

        .category-bar {
            margin-top: 15px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .category-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-gold), #FFA500);
            border-radius: 3px;
            transition: width 1s ease;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .action-btn {
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        .action-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(107, 78, 158, 0.2));
            color: var(--primary-gold);
            transition: all 0.3s ease;
        }

        .action-btn:hover .action-icon {
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            transform: rotate(10deg);
        }

        .action-text {
            font-size: 16px;
            font-weight: 500;
        }

        .section-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-gold), transparent);
        }

        .honor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .honor-card {
            padding: 20px;
            cursor: pointer;
            position: relative;
        }

        .honor-card .category-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
        }

        .honor-image {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(107, 78, 158, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--primary-gold);
            position: relative;
            overflow: hidden;
        }

        .honor-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .honor-card:hover .honor-image::after {
            opacity: 1;
        }

        .honor-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .honor-date {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .honor-desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .timeline-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, var(--primary-gold), rgba(255, 215, 0, 0.3), transparent);
            transform: translateX(-50%);
        }

        .timeline-items {
            position: relative;
            z-index: 1;
        }

        .timeline-item {
            display: flex;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
        }

        .timeline-item:nth-child(odd) {
            flex-direction: row;
        }

        .timeline-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        .timeline-content {
            width: 45%;
            padding: 20px;
            position: relative;
        }

        .timeline-content::before {
            content: '';
            position: absolute;
            top: 20px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .timeline-item:nth-child(odd) .timeline-content::before {
            right: -110px;
        }

        .timeline-item:nth-child(even) .timeline-content::before {
            left: -110px;
        }

        .timeline-year {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary-gold);
            color: var(--primary-blue);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            top: -5px;
            z-index: 2;
        }

        .filter-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 10px 25px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .filter-tab:hover,
        .filter-tab.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: var(--primary-gold);
            color: var(--primary-gold);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(12, 25, 41, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-gold);
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .form-select {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .form-textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            font-size: 16px;
            min-height: 100px;
            resize: vertical;
            transition: all 0.3s ease;
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .form-submit {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-gold), #FFA500);
            color: var(--primary-blue);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
        }

        .honor-detail-image {
            width: 100%;
            max-height: 400px;
            border-radius: 12px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(107, 78, 158, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: var(--primary-gold);
        }

        .honor-detail-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .info-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 14px;
            color: #ffffff;
        }

        .page-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .page-section.active {
            display: block;
        }

        .recent-honors {
            grid-column: 1 / -1;
        }

        .recent-list {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .recent-list::-webkit-scrollbar {
            height: 6px;
        }

        .recent-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .recent-list::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.5);
            border-radius: 3px;
        }

        .recent-item {
            flex: 0 0 200px;
            padding: 15px;
            cursor: pointer;
        }

        .export-section {
            text-align: center;
            padding: 60px 20px;
        }

        .export-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 20px 40px;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--primary-gold), #FFA500);
            color: var(--primary-blue);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            margin-top: 30px;
        }

        .export-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.4);
        }

        .report-preview {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            text-align: left;
        }

        .report-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .report-title {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary-gold);
            margin-bottom: 10px;
        }

        .report-date {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .report-content {
            margin-bottom: 20px;
        }

        .report-section-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .report-honor-list {
            display: grid;
            gap: 15px;
        }

        .report-honor-item {
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .report-honor-title {
            font-size: 14px;
            color: #ffffff;
        }

        .report-honor-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .report-stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .report-stat-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .report-stat-value {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-gold);
        }

        .report-stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary-gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes countUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .hero-title {
                font-size: 36px;
            }

            .hero-stats {
                gap: 30px;
            }

            .stat-number {
                font-size: 36px;
            }

            .honor-grid {
                grid-template-columns: 1fr;
            }

            .timeline-line {
                left: 20px;
            }

            .timeline-item {
                flex-direction: column !important;
            }

            .timeline-content {
                width: 100%;
                margin-left: 40px;
            }

            .timeline-content::before {
                left: -30px !important;
                right: auto !important;
            }

            .timeline-year {
                left: 20px;
                transform: translateX(-50%);
            }

            .report-stat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>

    <nav class="nav-bar">
        <div class="nav-content">
            <div class="nav-logo" onclick="showPage('home')">
                <i class="fas fa-star"></i>
                <span class="gold-gradient">星途成长档案馆</span>
            </div>
            <div class="nav-links">
                <a href="#" class="active" onclick="showPage('home')">首页</a>
                <a href="#" onclick="showPage('honor-wall')">荣誉墙</a>
                <a href="#" onclick="showPage('timeline')">成长轨迹</a>
                <a href="#" onclick="showPage('export')">导出报告</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section id="page-home" class="page-section active">
            <div class="hero-section">
                <h1 class="hero-title">星途成长档案馆</h1>
                <p class="hero-subtitle">记录每一次闪耀，见证成长的足迹</p>
                <div class="hero-stats">
                    <div class="stat-item">
                        <div class="stat-number" id="stat-honors">0</div>
                        <div class="stat-label">荣誉总数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="stat-years">0</div>
                        <div class="stat-label">记录年份</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="stat-levels">0</div>
                        <div class="stat-label">获得等级</div>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="dashboard-card glass-card">
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas fa-trophy"></i>
                        </div>

        function saveData() {
            localStorage.setItem('honors', JSON.stringify(honors));
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById('page-' + pageId).classList.add('active');
            
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.classList.remove('active');
            });
            document.querySelector('.nav-links a[onclick="showPage(\'' + pageId + '\')"]')?.classList.add('active');

            if (pageId === 'home') renderHome();
            if (pageId === 'honor-wall') renderHonorWall();
            if (pageId === 'timeline') renderTimeline();
            if (pageId === 'export') renderExport();
        }

        function renderHome() {
            const totalHonors = honors.length;
            const years = [...new Set(honors.map(h => h.date.split('-')[0]))].length;
            const topLevel = honors.length > 0 ? getTopLevel() : '-';
            const academicCount = honors.filter(h => h.category === '学术').length;
            const academicPercent = honors.length > 0 ? Math.round((academicCount / honors.length) * 100) : 0;
            
            animateNumber('stat-honors', totalHonors);
            animateNumber('stat-years', years);
            animateNumber('stat-levels', levels.length);
            animateNumber('month-count', getMonthCount());
            animateNumber('streak-days', Math.floor(Math.random() * 100) + 1);
            
            document.getElementById('top-level').textContent = topLevel;
            document.getElementById('academic-percent').textContent = academicPercent + '%';

            const recentList = document.getElementById('recent-honors-list');
            recentList.innerHTML = '';
            const recentHonors = [...honors].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
            
            recentHonors.forEach(honor => {
                const item = document.createElement('div');
                item.className = 'recent-item glass-card';
                item.onclick = () => showHonorDetail(honor);
                item.innerHTML = `
                    <div class="honor-image" style="height: 100px; font-size: 32px;">
                        <i class="${categories[honor.category]?.icon || 'fas fa-star'}"></i>
                    </div>
                    <div class="honor-title" style="font-size: 14px; margin-bottom: 5px;">${honor.title}</div>
                    <div class="honor-date">${honor.date}</div>
                `;
                recentList.appendChild(item);
            });
        }

        function renderHonorWall(filter = 'all') {
            const grid = document.getElementById('honor-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? honors : honors.filter(h => h.category === filter);
            const sorted = [...filtered].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sorted.forEach((honor, index) => {
                const card = document.createElement('div');
                card.className = 'honor-card glass-card';
                card.style.animationDelay = index * 0.1 + 's';
                card.onclick = () => showHonorDetail(honor);
                
                const categoryInfo = categories[honor.category];
                
                card.innerHTML = `
                    <div class="category-badge" style="color: ${categoryInfo?.color || '#FFD700'}; border: 1px solid ${categoryInfo?.color || '#FFD700'}40;">
                        ${honor.category}
                    </div>
                    <div class="honor-image">
                        <i class="${categoryInfo?.icon || 'fas fa-star'}"></i>
                    </div>
                    <div class="honor-title">${honor.title}</div>
                    <div class="honor-date">${honor.date} · ${honor.level}</div>
                    <div class="honor-desc">${honor.description}</div>
                `;
                grid.appendChild(card);
            });
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-items');
            container.innerHTML = '';
            
            const sorted = [...honors].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            let currentYear = '';
            sorted.forEach((honor, index) => {
                const year = honor.date.split('-')[0];
                const categoryInfo = categories[honor.category];
                
                if (year !== currentYear) {
                    currentYear = year;
                    const yearMarker = document.createElement('div');
                    yearMarker.className = 'timeline-year';
                    yearMarker.textContent = year;
                    container.appendChild(yearMarker);
                }
                
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.style.animationDelay = index * 0.15 + 's';
                
                item.innerHTML = `
                    <div class="timeline-content glass-card">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                            <i class="${categoryInfo?.icon || 'fas fa-star'}" style="color: ${categoryInfo?.color || '#FFD700'}"></i>
                            <span style="color: ${categoryInfo?.color || '#FFD700'}; font-size: 12px;">${honor.category}</span>
                        </div>
                        <h3 style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">${honor.title}</h3>
                        <p style="font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 10px;">${honor.description}</p>
                        <div style="display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,0.5);">
                            <span>${honor.level}</span>
                            <span>${honor.date}</span>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function renderExport() {
            const total = honors.length;
            const years = [...new Set(honors.map(h => h.date.split('-')[0]))].length;
            const categoriesCount = [...new Set(honors.map(h => h.category))].length;
            
            document.getElementById('report-total').textContent = total;
            document.getElementById('report-years').textContent = years;
            document.getElementById('report-categories').textContent = categoriesCount;
            document.getElementById('report-date').textContent = new Date().toLocaleDateString('zh-CN');
            
            const list = document.getElementById('report-honor-list');
            list.innerHTML = '';
            
            const sorted = [...honors].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sorted.forEach(honor => {
                const item = document.createElement('div');
                item.className = 'report-honor-item';
                item.innerHTML = `
                    <div>
                        <div class="report-honor-title">${honor.title}</div>
                        <div class="report-honor-date">${honor.category} · ${honor.level} · ${honor.date}</div>
                    </div>
                    <i class="fas fa-award" style="color: ${categories[honor.category]?.color || '#FFD700'}"></i>
                `;
                list.appendChild(item);
            });
        }

        function filterHonors(category) {
            document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            renderHonorWall(category);
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.add('show');
            document.getElementById('honor-date').valueAsDate = new Date();
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }

        function handleAddHonor(e) {
            e.preventDefault();
            
            const newHonor = {
                id: Date.now().toString(),
                title: document.getElementById('honor-title').value,
                category: document.getElementById('honor-category').value,
                level: document.getElementById('honor-level').value,
                date: document.getElementById('honor-date').value,
                organization: document.getElementById('honor-organization').value,
                certificateNumber: document.getElementById('honor-certificate').value,
                description: document.getElementById('honor-description').value
            };
            
            honors.push(newHonor);
            saveData();
            closeModal('add-modal');
            e.target.reset();
            showPage('home');
        }

        function showHonorDetail(honor) {
            const content = document.getElementById('honor-detail-content');
            const categoryInfo = categories[honor.category];
            
            content.innerHTML = `
                <div class="honor-detail-image">
                    <i class="${categoryInfo?.icon || 'fas fa-star'}"></i>
                </div>
                <h2 style="font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #ffffff;">${honor.title}</h2>
                <div class="honor-detail-info">
                    <div class="info-item">
                        <div class="info-label">分类</div>
                        <div class="info-value" style="color: ${categoryInfo?.color || '#FFD700'}">${honor.category}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">等级</div>
                        <div class="info-value">${honor.level}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">获得日期</div>
                        <div class="info-value">${honor.date}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">颁发机构</div>
                        <div class="info-value">${honor.organization || '-'}</div>
                    </div>
                </div>
                ${honor.certificateNumber ? `
                    <div class="info-item" style="margin-bottom: 20px;">
                        <div class="info-label">证书编号</div>
                        <div class="info-value">${honor.certificateNumber}</div>
                    </div>
                ` : ''}
                <div style="margin-bottom: 20px;">
                    <div class="info-label">荣誉描述</div>
                    <p style="font-size: 16px; color: rgba(255, 255, 255, 0.8); line-height: 1.6;">${honor.description || '暂无描述'}</p>
                </div>
            `;
            
            document.getElementById('detail-modal').classList.add('show');
        }

        function generateReport() {
            alert('成长报告已生成！\n\n报告包含：\n- 荣誉总数：' + honors.length + '项\n- 记录年份：' + [...new Set(honors.map(h => h.date.split('-')[0]))].length + '年\n- 涵盖领域：' + [...new Set(honors.map(h => h.category))].length + '个\n\n实际项目中将使用 jsPDF 库生成 PDF 文件。');
        }

        function animateNumber(elementId, target) {
            const element = document.getElementById(elementId);
            let current = 0;
            const duration = 2000;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                current = Math.floor(progress * target);
                element.textContent = current;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        function getTopLevel() {
            const levelOrder = ['校级', '市级', '省级', '国家级', '国际级'];
            let highestIndex = -1;
            
            honors.forEach(honor => {
                const index = levelOrder.indexOf(honor.level);
                if (index > highestIndex) {
                    highestIndex = index;
                }
            });
            
            return levelOrder[highestIndex] || '-';
        }

        function getMonthCount() {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            return honors.filter(h => {
                const date = new Date(h.date);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            }).length;
        }

        function initStars() {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            
            let width, height;
            let stars = [];
            
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            
            function createStars() {
                stars = [];
                const count = Math.floor((width * height) / 3000);
                
                for (let i = 0; i < count; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        radius: Math.random() * 1.5 + 0.5,
                        alpha: Math.random(),
                        speedX: (Math.random() - 0.5) * 0.2,
                        speedY: (Math.random() - 0.5) * 0.2
                    });
                }
            }
            
            function drawStars() {
                ctx.clearRect(0, 0, width, height);
                
                stars.forEach((star, i) => {
                    star.x += star.speedX;
                    star.y += star.speedY;
                    
                    if (star.x < 0) star.x = width;
                    if (star.x > width) star.x = 0;
                    if (star.y < 0) star.y = height;
                    if (star.y > height) star.y = 0;
                    
                    star.alpha += (Math.random() - 0.5) * 0.02;
                    star.alpha = Math.max(0.2, Math.min(1, star.alpha));
                    
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                    ctx.fill();
                    
                    stars.slice(i + 1).forEach(otherStar => {
                        const dx = star.x - otherStar.x;
                        const dy = star.y - otherStar.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 100) {
                            ctx.beginPath();
                            ctx.moveTo(star.x, star.y);
                            ctx.lineTo(otherStar.x, otherStar.y);
                            ctx.strokeStyle = `rgba(255, 215, 0, ${0.1 * (1 - distance / 100)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    });
                });
                
                requestAnimationFrame(drawStars);
            }
            
            resize();
            createStars();
            drawStars();
            
            window.addEventListener('resize', () => {
                resize();
                createStars();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initData();
            initStars();
            renderHome();
        });

        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
