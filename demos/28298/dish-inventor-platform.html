function renderCatFilters() {
  const el = document.getElementById('catFilters');
  const cats = ING_DB.categories;
  let html = '<span class="cat-filter active" data-cat="all">全部</span>';
  for (const [key, info] of Object.entries(cats)) {
    html += `<span class="cat-filter" data-cat="${key}">${info.icon} ${info.name}</span>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('.cat-filter').forEach(f => {
    f.addEventListener('click', () => {
      el.querySelectorAll('.cat-filter').forEach(x => x.classList.remove('active'));
      f.classList.add('active');
      activeCat = f.dataset.cat;
      renderGrid();
    });
  });
}

function renderGrid() {
  const el = document.getElementById('ingGrid');
  let items = ING_DB.ingredients;
  if (activeCat !== 'all') items = items.filter(i => i.category === activeCat);
  const cats = ING_DB.categories;
  el.innerHTML = items.map(ing => {
    const catInfo = cats[ing.category];
    const sel = selectedIds.has(ing.id) ? 'selected' : '';
    return `
      <div class="ing-card ${sel}" data-id="${ing.id}">
        <div class="check">✓</div>
        <div class="icon">${catInfo.icon}</div>
        <div class="name">${ing.name}</div>
        <div class="cat-tag">${catInfo.name}</div>
      </div>`;
  }).join('');
  el.querySelectorAll('.ing-card').forEach(card => {
    card.addEventListener('click', () => toggleIngredient(card.dataset.id));
    card.addEventListener('dblclick', () => showDetail(card.dataset.id));
  });
}

function toggleIngredient(id) {
  if (selectedIds.has(id)) {
    selectedIds.delete(id);
  } else {
    if (selectedIds.size >= 6) { alert('最多选 6 种食材哦'); return; }
    selectedIds.add(id);
  }
  renderGrid();
  renderFridge();
  document.getElementById('btnInvent').disabled = selectedIds.size < 2;
}

function renderFridge() {
  const el = document.getElementById('fridgeItems');
  if (selectedIds.size === 0) {
    el.innerHTML = '<span class="fridge-empty">还没选食材，去「食材库」挑几个吧</span>';
    return;
  }
  const items = ING_DB.ingredients.filter(i => selectedIds.has(i.id));
  el.innerHTML = items.map(i => `
    <span class="fridge-item" data-id="${i.id}">
      ${ING_DB.categories[i.category].icon} ${i.name}
      <span class="x">&times;</span>
    </span>
  `).join('');
  el.querySelectorAll('.fridge-item .x').forEach(x => {
    x.addEventListener('click', e => {
      e.stopPropagation();
      toggleIngredient(x.parentElement.dataset.id);
    });
  });
  el.querySelectorAll('.fridge-item').forEach(item => {
    item.addEventListener('click', () => showDetail(item.dataset.id));
  });
}

  const ing = ING_DB.ingredients.find(i => i.id === id);

// ============================================================
//  INVENT ENGINE
// ============================================================
const DISH_NAMES = {
  protein: ['碗','煲','饭','锅','盘','塔','卷','饼','碗饭','一锅出'],
  carb: ['粥','碗','饭','塔','饼','碗饭','一锅出'],
  cruciferous: ['碗','沙拉','塔','盘','一锅出'],
  veggie: ['碗','沙拉','塔','盘','卷','一锅出'],
  fungi: ['煲','汤','碗','盘','一锅出'],
  fat: ['碗','塔','沙拉','酱'],
  spice: ['风味','香','辣','清新']
};

const STYLES = ['地中海风','亚洲家常','轻食碗','一锅出','日式简约','墨西哥风','北欧极简'];

function inventDish() {
  const items = ING_DB.ingredients.filter(i => selectedIds.has(i.id));
  if (items.length < 2) return null;

  // 分类统计
  const catCount = {};
  items.forEach(i => { catCount[i.category] = (catCount[i.category]||0)+1; });
  const mainCat = Object.entries(catCount).sort((a,b)=>b[1]-a[1])[0][0];

  // 选风格
  const style = STYLES[Math.floor(Math.random()*STYLES.length)];

  // 选桥接调味剂
  const spices = items.filter(i => i.category === 'spice');
  const bridge = spices.length > 0
    ? spices[Math.floor(Math.random()*spices.length)]
    : ING_DB.ingredients.filter(i => i.category === 'spice')[Math.floor(Math.random()*12)];

  // 菜名生成
  const mainItems = items.filter(i => i.category !== 'spice').slice(0, 3);
  const nameParts = mainItems.map(i => i.name);
  const suffix = DISH_NAMES[mainCat] ? DISH_NAMES[mainCat][Math.floor(Math.random()*DISH_NAMES[mainCat].length)] : '碗';
  const dishName = nameParts.join('') + suffix;

  // 灵感故事
  const stories = [
    `这是一道为${mainItems.map(i=>i.name).join('、')}的奇妙相遇而生的菜：${bridge.name}作为风味桥梁，把${mainItems[0].name}的${mainItems[0].flavor[0]}与${mainItems[1]?.name||mainItems[0].name}的${mainItems[1]?.flavor[0]||mainItems[0].flavor[0]}完美连接。`,
    `灵感来自${style}的餐桌哲学：用最简单的食材，做出最有层次的味道。${bridge.name}是这道菜的灵魂。`,
    `当${mainItems[0].name}遇上${mainItems[1]?.name||mainItems[0].name}，再加上${bridge.name}的点睛，一道全新的${style}美味就此诞生。`,
    `这是一道为「冰箱救星」时刻准备的菜：${mainItems.map(i=>i.name).join('、')}的组合，在${bridge.name}的调和下焕发出意想不到的风味。`
  ];
  const story = stories[Math.floor(Math.random()*stories.length)];

  // 步骤生成
  const steps = generateSteps(items, bridge, style);

  // 营养计算
  const nutri = calcNutri(items);

  // 时间
  const time = 10 + Math.floor(Math.random()*25);

  return {
    id: 'dish_' + Date.now(),
    name: dishName,
    story: story,
    style: style,
    time: time,
    items: items,
    bridge: bridge,
    steps: steps,
    nutri: nutri,
    created: new Date().toLocaleDateString('zh-CN')
  };
}

function generateSteps(items, bridge, style) {
  const mains = items.filter(i => i.category !== 'spice');
  const steps = [];

  // 预处理
  const prepItems = mains.slice(0, 2);
  steps.push(`将${prepItems.map(i=>i.name).join('、')}洗净、切好备用。`);

  // 调味准备
  if (bridge) {
    steps.push(`${bridge.name}${bridge.methods[0]}，作为整道菜的风味基底。`);
  }

  // 烹饪主体
  if (mains.length >= 2) {
    const method = mains[0].methods[Math.floor(Math.random()*mains[0].methods.length)];
    steps.push(`热锅少油，先${method}${mains[0].name}至表面微焦。`);
    steps.push(`加入${mains[1].name}一起翻炒，让两种食材的风味互相渗透。`);
  }

  // 加入其他
  const others = mains.slice(2);
  if (others.length > 0) {
    steps.push(`放入${others.map(i=>i.name).join('、')}，继续翻炒至断生。`);
  }

  // 调味收尾
  const extraSpices = items.filter(i => i.category === 'spice' && i.id !== bridge.id);
  if (extraSpices.length > 0) {
    steps.push(`撒上${extraSpices.map(i=>i.name).join('、')}调味，翻匀。`);
  }
  steps.push('出锅装盘，趁热享用。');

  return steps;
}

function calcNutri(items) {
  let kcal=0, p=0, f=0, c=0, fb=0;
  items.forEach(i => {
    const n = i.nutri;
    const ratio = 0.5 + Math.random()*0.5; // 假设用量为50-100g
    kcal += n.kcal * ratio;
    p += n.p * ratio;
    f += n.f * ratio;
    c += n.c * ratio;
    fb += n.fb * ratio;
  });
  return { kcal: Math.round(kcal), p: Math.round(p), f: Math.round(f), c: Math.round(c), fb: Math.round(fb) };
}

        <strong>${dish.bridge.name}</strong> — ${dish.bridge.pairing}
      </p>

      <h4>做法</h4>
      <ol class="steps">
        ${dish.steps.map(s => `<li>${s}</li>`).join('')}
      </ol>

      <h4>营养估算</h4>
      <div class="nutri-note">
        热量 ≈ ${dish.nutri.kcal} kcal · 蛋白质 ≈ ${dish.nutri.p}g · 脂肪 ≈ ${dish.nutri.f}g · 碳水 ≈ ${dish.nutri.c}g · 纤维 ≈ ${dish.nutri.fb}g
      </div>
      <div class="nutri-chart-wrap" id="nutriChart"></div>

      <div class="action-row" style="margin-top:1.5rem;">
        <button class="btn btn-primary" id="btnSave">收藏这道菜</button>
        <button class="btn btn-secondary" id="btnAgain">再来一道</button>
        <button class="btn btn-secondary" id="btnShare">复制分享</button>
      </div>
    </div>
  `;

  // 绑定按钮
  document.getElementById('btnSave').addEventListener('click', saveRecipe);
  document.getElementById('btnAgain').addEventListener('click', () => {
    const d = inventDish();
    if (d) renderResult(d);
  });
  document.getElementById('btnShare').addEventListener('click', () => {
    const text = `【${dish.name}】\n${dish.story}\n\n主要食材：${dish.items.map(i=>i.name).join('、')}\n\n做法：\n${dish.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')}\n\n营养：热量≈${dish.nutri.kcal}kcal`;
    navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板！'));
  });

  // 渲染雷达图
  setTimeout(() => renderNutriChart(dish.nutri), 50);
}

function renderNutriChart(n) {
  const chartDom = document.getElementById('nutriChart');
  if (!chartDom) return;
  const chart = echarts.init(chartDom, null, { renderer: 'svg' });
  const maxVal = Math.max(n.p, n.f, n.c, n.fb, 10);
  chart.setOption({
    animation: false,
    tooltip: { trigger: 'item' },
    radar: {
      indicator: [
        { name: '蛋白质', max: maxVal * 1.5 },
        { name: '脂肪', max: maxVal * 1.5 },
        { name: '碳水', max: maxVal * 1.5 },
        { name: '纤维', max: maxVal * 1.5 }
      ],
      shape: 'polygon',
      splitNumber: 4,
      axisName: { color: '#7a6a5a', fontSize: 12, fontFamily: 'Outfit' },
      splitLine: { lineStyle: { color: '#e2d6bf' } },
      splitArea: { show: true, areaStyle: { color: ['#faf6ef', '#f1e9d8'] } },
      axisLine: { lineStyle: { color: '#e2d6bf' } }
    },
    series: [{
      type: 'radar',
      data: [{
        value: [n.p, n.f, n.c, n.fb],
        name: '营养分布',
        areaStyle: { color: 'rgba(192,83,43,0.15)' },
        lineStyle: { color: '#c0532b', width: 2 },
        itemStyle: { color: '#c0532b' }
      }]
    }]
  });
  window.addEventListener('resize', () => chart.resize());
}

// ============================================================
//  SAVE / SAVED RECIPES
// ============================================================
function saveRecipe() {
  if (!currentResult) return;
  if (savedRecipes.find(r => r.name === currentResult.name && r.created === currentResult.created)) {
    alert('这道菜已经在菜谱本里了！');
    return;
  }
  savedRecipes.push({...currentResult});
  alert('已收藏到「我的菜谱本」！');
}

function renderSaved() {
  const grid = document.getElementById('savedGrid');
  const empty = document.getElementById('savedEmpty');
  if (savedRecipes.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = savedRecipes.map((r, idx) => `
    <div class="saved-card" data-idx="${idx}">
      <div class="saved-name">${r.name}</div>
      <div class="saved-meta">${r.style} · ${r.time}分钟 · ${r.created}</div>
      <div class="saved-ing">${r.items.map(i=>i.name).join('、')}</div>
      <div class="saved-actions">
        <button data-action="view" data-idx="${idx}">查看详情</button>
        <button data-action="del" data-idx="${idx}">删除</button>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.saved-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.dataset.action === 'view') {
        const r = savedRecipes[parseInt(e.target.dataset.idx)];
        renderResult(r);
        document.querySelector('.tab-btn[data-tab="invent"]').click();
      } else if (e.target.dataset.action === 'del') {
        savedRecipes.splice(parseInt(e.target.dataset.idx), 1);
        renderSaved();
      }
    });
  });
}

// ============================================================
//  BUTTON HANDLERS
// ============================================================
document.getElementById('btnInvent').addEventListener('click', () => {
  const dish = inventDish();
  if (dish) renderResult(dish);
});

document.getElementById('btnRandom').addEventListener('click', () => {
  // 随机选 3-5 个食材
  selectedIds.clear();
  const all = ING_DB.ingredients;
  const count = 3 + Math.floor(Math.random()*3);
  const shuffled = [...all].sort(() => Math.random()-0.5);
  for (let i=0; i<count; i++) selectedIds.add(shuffled[i].id);
  renderGrid();
  renderFridge();
  document.getElementById('btnInvent').disabled = false;
  // 自动发明
  const dish = inventDish();
  if (dish) renderResult(dish);
  // 切到发明页
  document.querySelector('.tab-btn[data-tab="invent"]').click();
});

document.getElementById('btnClear').addEventListener('click', () => {
  selectedIds.clear();
  renderGrid();
  renderFridge();
  document.getElementById('btnInvent').disabled = true;
  document.getElementById('inventResult').innerHTML = '';
});

// ============================================================
//  INIT
// ============================================================
renderCatFilters();
renderGrid();
renderFridge();
</script>
