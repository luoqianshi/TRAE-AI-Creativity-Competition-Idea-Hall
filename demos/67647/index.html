<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单词速通</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="stats">
        <div class="stat-item remembered">
          <i class="fa-solid fa-check"></i>
          <span id="rememberedCount">0</span>
          <span class="stat-label">记住</span>
        </div>
        <div class="stat-item forgotten">
          <i class="fa-solid fa-xmark"></i>
          <span id="forgottenCount">0</span>
          <span class="stat-label">没记住</span>
        </div>
      </div>
      <div class="book-select">
        <select id="bookSelect">
          <option value="cet4">四级词汇</option>
          <option value="cet6">六级词汇</option>
          <option value="bec">BEC词汇</option>
          <option value="chengren">成人词汇</option>
        </select>
      </div>
    </header>

    <main class="card-area">
      <div class="related-cards" id="relatedCards"></div>
      <div class="main-card" id="mainCard">
        <div class="card-inner">
          <div class="card-front">
            <div class="word" id="word">loading...</div>
            <div class="phonetic" id="phonetic"></div>
            <button class="btn-show-answer" id="showAnswerBtn">
              <i class="fa-solid fa-eye"></i>
              查看答案
            </button>
          </div>
          <div class="card-back">
            <div class="word" id="wordBack">loading...</div>
            <div class="translation" id="translation"></div>
            <div class="example" id="example"></div>
            <div class="action-buttons">
              <button class="btn-forgot" id="forgotBtn">
                <i class="fa-solid fa-xmark"></i>
                没记住
              </button>
              <button class="btn-remember" id="rememberBtn">
                <i class="fa-solid fa-check"></i>
                记住
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="empty-state" id="emptyState" style="display:none;">
      <i class="fa-solid fa-trophy"></i>
      <h2>太棒了！</h2>
      <p>这一组单词已全部过完</p>
      <button class="btn-restart" id="restartBtn">
        <i class="fa-solid fa-rotate-right"></i>
        重新开始
      </button>
    </div>
  </div>

  <script src="bec.js"></script>
  <script src="cet4.js"></script>
  <script src="cet6.js"></script>
  <script src="chengren.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
