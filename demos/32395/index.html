<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧药盒扫描助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background-color: #FFF8E7;
            min-height: 100vh;
            padding-bottom: 120px;
        }

        .header {
            background-color: #5D4E37;
            color: #FFF8E7;
            padding: 30px 20px;
            text-align: center;
        }

        .header-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header-subtitle {
            font-size: 18px;
            opacity: 0.9;
        }

        .warning-banner {
            background-color: #E53935;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .warning-icon {
            margin-right: 8px;
            font-size: 24px;
        }

        .main-content {
            padding: 25px 20px;
        }

        .section {
            background-color: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .scan-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .scan-btn {
            width: 100%;
            height: 100px;
            border: none;
            border-radius: 16px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .scan-btn.medicine {
            background: linear-gradient(135deg, #FF7043 0%, #E64A19 100%);
            color: white;
        }

        .scan-btn.report {
            background: linear-gradient(135deg, #42A5F5 0%, #1E88E5 100%);
            color: white;
        }

        .scan-btn:active {
            transform: scale(0.98);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .scan-icon {
            font-size: 40px;
        }

        .medicine-name {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background-color: #F5F5F5;
            border-radius: 12px;
        }

        .detail-item {
            margin-bottom: 20px;
            padding: 20px;
            background-color: #FAFAFA;
            border-radius: 12px;
        }

        .detail-label {
            font-size: 20px;
            color: #666;
            margin-bottom: 10px;
        }

        .detail-value {
            font-size: 24px;
            color: #333;
            font-weight: 500;
        }

        .detail-value.warning {
            color: #E53935;
            font-weight: bold;
        }

        .detail-value.highlight {
            color: #1E88E5;
            font-weight: bold;
        }

        .duration-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background-color: #E3F2FD;
            border-radius: 12px;
            margin-top: 15px;
        }

        .duration-icon {
            font-size: 32px;
        }

        .duration-text {
            font-size: 22px;
            color: #1E88E5;
            font-weight: 500;
        }

        .time-section {
            margin-bottom: 25px;
        }

        .time-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-icon {
            font-size: 28px;
        }

        .medicine-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background-color: #FAFAFA;
            border-radius: 12px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .medicine-item:hover {
            background-color: #F0F0F0;
        }

        .medicine-item.taken {
            background-color: #E8F5E9;
        }

        .medicine-info {
            flex: 1;
        }

        .medicine-title {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .medicine-dosage {
            font-size: 18px;
            color: #666;
        }

        .status-checkbox {
            width: 50px;
            height: 50px;
            border: 4px solid #BDBDBD;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .status-checkbox:hover {
            border-color: #4CAF50;
        }

        .status-checkbox.taken {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }

        .check-icon {
            font-size: 30px;
            color: white;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            padding: 20px;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.08);
        }

        .family-btn {
            width: 100%;
            height: 70px;
            background-color: #5D4E37;
            color: #FFF8E7;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .family-btn:active {
            background-color: #4A3F2E;
            transform: scale(0.98);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background-color: white;
            border-radius: 20px;
            padding: 40px 30px;
            margin: 20px;
            max-width: 400px;
            width: 100%;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 25px;
        }

        .modal-content {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .modal-text {
            font-size: 24px;
            color: #333;
            line-height: 1.6;
        }

        .modal-text.success {
            color: #4CAF50;
        }

        .modal-btn {
            width: 100%;
            height: 65px;
            background-color: #FF7043;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 26px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn:active {
            background-color: #E64A19;
            transform: scale(0.98);
        }

        .loading-text {
            font-size: 28px;
            color: #FF7043;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .notification-badge {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 20px;
            margin-left: 10px;
        }

        .family-list {
            margin-top: 20px;
        }

        .family-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background-color: #FAFAFA;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .family-avatar {
            font-size: 40px;
            margin-right: 15px;
        }

        .family-info {
            flex: 1;
        }

        .family-name {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .family-relation {
            font-size: 18px;
            color: #666;
        }

        .family-status {
            font-size: 18px;
            color: #4CAF50;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="header-title">智慧药盒扫描助手</h1>
        <p class="header-subtitle">智能识别 · 精准用药 · 关爱家人</p>
    </div>

    <div class="warning-banner">
        <span class="warning-icon">⚠️</span>
        <span>药品过期预警：您的「硝苯地平缓释片」还有7天过期</span>
    </div>

    <div class="main-content">
        <div class="section">
            <h2 class="section-title">扫描识别</h2>
            <div class="scan-buttons">
                <button class="scan-btn medicine" id="scanMedicineBtn">
                    <span class="scan-icon">💊</span>
                    <span>扫描药盒</span>
                </button>
                <button class="scan-btn report" id="scanReportBtn">
                    <span class="scan-icon">📋</span>
                    <span>扫描报告单</span>
                </button>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">用药详情</h2>
            <div class="medicine-name" id="medicineName">
                点击扫描获取药品信息
            </div>
            <div class="detail-item">
                <div class="detail-label">用法用量</div>
                <div class="detail-value" id="dosage">
                    请先扫描药盒或报告单
                </div>
            </div>
            <div class="detail-item">
                <div class="detail-label">禁忌提示</div>
                <div class="detail-value warning" id="warning">
                    请先扫描药盒或报告单
                </div>
            </div>
            <div class="duration-info" id="durationInfo" style="display: none;">
                <span class="duration-icon">📅</span>
                <div class="duration-text" id="durationText"></div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">今日服药计划</h2>
            
            <div class="time-section">
                <div class="time-title">
                    <span class="time-icon">🌅</span>
                    <span>早上</span>
                </div>
                <div id="morningMedicines">
                    <div class="medicine-item">
                        <div class="medicine-info">
                            <div class="medicine-title">点击扫描添加药品</div>
                            <div class="medicine-dosage">暂无药品</div>
                        </div>
                        <div class="status-checkbox" style="opacity: 0.5;">
                            <span class="check-icon">☐</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="time-section">
                <div class="time-title">
                    <span class="time-icon">☀️</span>
                    <span>中午</span>
                </div>
                <div id="noonMedicines">
                    <div class="medicine-item">
                        <div class="medicine-info">
                            <div class="medicine-title">点击扫描添加药品</div>
                            <div class="medicine-dosage">暂无药品</div>
                        </div>
                        <div class="status-checkbox" style="opacity: 0.5;">
                            <span class="check-icon">☐</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="time-section">
                <div class="time-title">
                    <span class="time-icon">🌙</span>
                    <span>晚上</span>
                </div>
                <div id="eveningMedicines">
                    <div class="medicine-item">
                        <div class="medicine-info">
                            <div class="medicine-title">点击扫描添加药品</div>
                            <div class="medicine-dosage">暂无药品</div>
                        </div>
                        <div class="status-checkbox" style="opacity: 0.5;">
                            <span class="check-icon">☐</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">家庭成员</h2>
            <div class="family-list" id="familyList">
                <div class="family-item">
                    <span class="family-avatar">👧</span>
                    <div class="family-info">
                        <div class="family-name">女儿 - 小美</div>
                        <div class="family-relation">女儿</div>
                    </div>
                    <span class="family-status">已绑定</span>
                </div>
                <div class="family-item">
                    <span class="family-avatar">👨</span>
                    <div class="family-info">
                        <div class="family-name">儿子 - 小明</div>
                        <div class="family-relation">儿子</div>
                    </div>
                    <span class="family-status">已绑定</span>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="family-btn" id="familyBtn">
            <span>👨‍👩‍👧‍👦</span>
            <span>添加家庭成员</span>
        </button>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle">识别结果</div>
            <div class="modal-content" id="modalContent">
                <div class="modal-icon" id="modalIcon">🔍</div>
                <div class="modal-text" id="modalText">AI识别中...</div>
            </div>
            <button class="modal-btn" id="modalBtn" style="display: none;">确认</button>
        </div>
    </div>

    <script>
        const scanMedicineBtn = document.getElementById('scanMedicineBtn');
        const scanReportBtn = document.getElementById('scanReportBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalIcon = document.getElementById('modalIcon');
        const modalText = document.getElementById('modalText');
        const modalBtn = document.getElementById('modalBtn');

        const medicineName = document.getElementById('medicineName');
        const dosage = document.getElementById('dosage');
        const warning = document.getElementById('warning');
        const durationInfo = document.getElementById('durationInfo');
        const durationText = document.getElementById('durationText');

        const morningMedicines = document.getElementById('morningMedicines');
        const noonMedicines = document.getElementById('noonMedicines');
        const eveningMedicines = document.getElementById('eveningMedicines');

        const familyBtn = document.getElementById('familyBtn');

        const mockMedicineData = {
            name: '阿司匹林肠溶片',
            dosage: '每日一次，每次一片，早餐后服用',
            warning: '严禁嚼碎服用',
            duration: 14,
            startDate: '2026-06-18',
            endDate: '2026-07-01',
            currentDay: 1
        };

        const mockReportData = {
            patientName: '张三',
            hospital: '市第一人民医院',
            department: '心内科',
            doctor: '李医生',
            medicines: [
                { id: 1, name: '阿司匹林肠溶片', dosage: '每次1片', time: 'morning', taken: true },
                { id: 2, name: '硝苯地平缓释片', dosage: '每次1片', time: 'morning', taken: false },
                { id: 3, name: '丹参滴丸', dosage: '每次10丸', time: 'noon', taken: false },
                { id: 4, name: '阿托伐他汀钙片', dosage: '每次1片', time: 'evening', taken: false },
                { id: 5, name: '硝酸异山梨酯片', dosage: '每次2片', time: 'evening', taken: false }
            ],
            duration: 7,
            startDate: '2026-06-18',
            endDate: '2026-06-24',
            currentDay: 1
        };

        function showNotificationModal(title, icon, text, isSuccess = false) {
            modalOverlay.classList.add('show');
            modalTitle.textContent = title;
            modalIcon.textContent = icon;
            modalText.textContent = text;
            modalText.className = isSuccess ? 'modal-text success' : 'modal-text';
            modalBtn.style.display = 'block';
        }

        function generateMedicineItem(medicine) {
            const item = document.createElement('div');
            item.className = `medicine-item ${medicine.taken ? 'taken' : ''}`;
            item.dataset.id = medicine.id;
            item.dataset.time = medicine.time;
            
            item.innerHTML = `
                <div class="medicine-info">
                    <div class="medicine-title">${medicine.name}</div>
                    <div class="medicine-dosage">${medicine.dosage}</div>
                </div>
                <div class="status-checkbox ${medicine.taken ? 'taken' : ''}" onclick="toggleMedicineStatus(${medicine.id}, '${medicine.time}')">
                    <span class="check-icon">${medicine.taken ? '☑' : '☐'}</span>
                </div>
            `;
            
            return item;
        }

        function updateMedicineList(medicines) {
            morningMedicines.innerHTML = '';
            noonMedicines.innerHTML = '';
            eveningMedicines.innerHTML = '';

            const morningList = medicines.filter(m => m.time === 'morning');
            const noonList = medicines.filter(m => m.time === 'noon');
            const eveningList = medicines.filter(m => m.time === 'evening');

            if (morningList.length === 0) {
                morningMedicines.innerHTML = `
                    <div class="medicine-item">
                        <div class="medicine-info">
                            <div class="medicine-title">暂无药品</div>
                            <div class="medicine-dosage">点击扫描报告单添加</div>
                        </div>
                        <div class="status-checkbox" style="opacity: 0.5;">
                            <span class="check-icon">☐</span>
                        </div>
                    </div>
                `;
            } else {
                morningList.forEach(medicine => {
                    morningMedicines.appendChild(generateMedicineItem(medicine));
                });
            }

            if (noonList.length === 0) {
                noonMedicines.innerHTML = `
                    <div class="medicine-item">
                        <div class="medicine-info">
                            <div class="medicine-title">暂无药品</div>
                            <div class="medicine-dosage">点击扫描报告单添加</div>
                        </div>
                        <div class="status-checkbox" style="opacity: 0.5;">
                            <span class="check-icon">☐</span>
                        </div>
                    </div>
                `;
            } else {
                noonList.forEach(medicine => {
                    noonMedicines.appendChild(generateMedicineItem(medicine));
                });
            }

            if (eveningList.length === 0) {
                eveningMedicines.innerHTML = `
                    <div class="medicine-item">
                        <div class="medicine-info">
                            <div class="medicine-title">暂无药品</div>
                            <div class="medicine-dosage">点击扫描报告单添加</div>
                        </div>
                        <div class="status-checkbox" style="opacity: 0.5;">
                            <span class="check-icon">☐</span>
                        </div>
                    </div>
                `;
            } else {
                eveningList.forEach(medicine => {
                    eveningMedicines.appendChild(generateMedicineItem(medicine));
                });
            }
        }

        scanMedicineBtn.addEventListener('click', function() {
            modalOverlay.classList.add('show');
            modalTitle.textContent = '正在识别';
            modalIcon.textContent = '🔍';
            modalText.innerHTML = '<span class="loading-text">AI识别中...</span>';
            modalBtn.style.display = 'none';

            setTimeout(function() {
                modalTitle.textContent = '识别成功';
                modalIcon.textContent = '✅';
                modalText.textContent = `识别到：${mockMedicineData.name}`;
                modalBtn.style.display = 'block';

                medicineName.textContent = mockMedicineData.name;
                dosage.textContent = mockMedicineData.dosage;
                warning.textContent = mockMedicineData.warning;
                
                durationInfo.style.display = 'flex';
                durationText.textContent = `服药周期：${mockMedicineData.currentDay}/${mockMedicineData.duration}天（${mockMedicineData.startDate} - ${mockMedicineData.endDate}）`;
            }, 2000);
        });

        scanReportBtn.addEventListener('click', function() {
            modalOverlay.classList.add('show');
            modalTitle.textContent = '正在识别';
            modalIcon.textContent = '📋';
            modalText.innerHTML = '<span class="loading-text">AI识别中...</span>';
            modalBtn.style.display = 'none';

            setTimeout(function() {
                modalTitle.textContent = '识别成功';
                modalIcon.textContent = '✅';
                modalText.textContent = `识别到${mockReportData.medicines.length}种药品，已更新服药计划`;
                modalBtn.style.display = 'block';

                medicineName.textContent = `${mockReportData.patientName}的用药方案`;
                dosage.textContent = `就诊医院：${mockReportData.hospital} | 医生：${mockReportData.doctor}`;
                warning.textContent = `请严格按照医嘱服药`;
                
                durationInfo.style.display = 'flex';
                durationText.textContent = `服药周期：${mockReportData.currentDay}/${mockReportData.duration}天（${mockReportData.startDate} - ${mockReportData.endDate}）`;

                updateMedicineList(mockReportData.medicines);
            }, 2000);
        });

        window.toggleMedicineStatus = function(id, time) {
            const item = document.querySelector(`[data-id="${id}"][data-time="${time}"]`);
            const checkbox = item.querySelector('.status-checkbox');
            const icon = item.querySelector('.check-icon');

            if (checkbox.classList.contains('taken')) {
                checkbox.classList.remove('taken');
                item.classList.remove('taken');
                icon.textContent = '☐';
            } else {
                checkbox.classList.add('taken');
                item.classList.add('taken');
                icon.textContent = '☑';

                const medicineTitle = item.querySelector('.medicine-title').textContent;
                setTimeout(() => {
                    showNotificationModal('发送成功', '✉️', `已将「${medicineTitle}」服药信息发送给家庭成员`, true);
                }, 500);
            }
        };

        modalBtn.addEventListener('click', function() {
            modalOverlay.classList.remove('show');
        });

        familyBtn.addEventListener('click', function() {
            showNotificationModal('添加成功', '👨‍👩‍👧‍👦', '家庭成员添加功能即将上线，敬请期待！');
        });
    </script>
</body>
</html>
