<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        .glow-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: pulse 4s ease-in-out infinite;
        }

        .circle-1 {
            width: 400px;
            height: 400px;
            background: #00ffff;
            top: -200px;
            left: -200px;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 300px;
            height: 300px;
            background: #ff00ff;
            bottom: -150px;
            right: -150px;
            animation-delay: 2s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .logo {
            font-size: 4rem;
            font-weight: 300;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 8px;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
            margin-bottom: 60px;
        }

        .search-box {
            width: 500px;
            max-width: 90%;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            margin-bottom: 60px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-box:focus-within {
            border-color: rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-icon {
            color: rgba(0, 255, 255, 0.6);
            font-size: 1.2rem;
            margin-right: 12px;
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 24px;
            max-width: 800px;
            width: 90%;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .nav-item:hover {
            background: rgba(0, 255, 255, 0.08);
            border-color: rgba(0, 255, 255, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.15);
        }

        .nav-icon {
            font-size: 2rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.3));
        }

        .nav-label {
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .time {
            position: absolute;
            top: 40px;
            right: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
        }

        @media (max-width: 768px) {
            .nav-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }

            .logo {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }

            .time {
                top: 20px;
                right: 20px;
                font-size: 0.75rem;
            }

            .search-box {
                height: 44px;
                margin-bottom: 40px;
            }
        }

        @media (max-width: 480px) {
            .nav-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .logo {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .nav-item {
                padding: 16px 12px;
            }

            .nav-icon {
                font-size: 1.5rem;
            }

            .nav-label {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="glow-circle circle-1"></div>
    <div class="glow-circle circle-2"></div>
    
    <div class="time" id="time"></div>

    <div class="container">
        <h1 class="logo">NAV</h1>
        <p class="subtitle">TECHNOLOGY</p>

        <div class="search-box">
            <span class="search-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </span>
            <input type="text" class="search-input" placeholder="Search..." />
        </div>

        <div class="nav-grid">
            <a href="#" class="nav-item">

                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>

                        <circle cx="12" cy="10" r="3"></circle>

                </span>
                <span class="nav-label">Maps</span>

            <a href="#" class="nav-item">
                <span class="nav-icon">

                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                </span>
                <span class="nav-label">Photos</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </span>
                <span class="nav-label">Files</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </span>
                <span class="nav-label">Users</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                </span>
                <span class="nav-label">Send</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                </span>
                <span class="nav-label">Mail</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </span>
                <span class="nav-label">Music</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="1" y="3" width="15" height="13"></rect>
                        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                        <circle cx="5.5" cy="18.5" r="2.5"></circle>
                        <circle cx="18.5" cy="18.5" r="2.5"></circle>
                    </svg>
                </span>
                <span class="nav-label">Video</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M15 3h6v6h-6zM9 3h6v6h-6zM9 15h6v6h-6zM3 9h6v6H3z"></path>
                    </svg>
                </span>
                <span class="nav-label">Apps</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <polyline points="9 12 12 15 15 12"></polyline>
                        <line x1="12" y1="8" x2="12" y2="14"></line>
                    </svg>
                </span>
                <span class="nav-label">Lock</span>
            </a>
            <a href="#" class="nav-item">
                <span class="nav-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                </span>
                <span class="nav-label">Settings</span>
            </a>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
