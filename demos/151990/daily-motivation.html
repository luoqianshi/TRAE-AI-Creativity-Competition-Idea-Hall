<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日一语 · 心灵加油站</title>
<style>
  :root {
    --green-deep: #1b3a2a;
    --green-mid: #2d6a4f;
    --green-soft: #52b788;
    --green-light: #95d5b2;
    --green-pale: #d8f3dc;
    --accent: #ffe66d;
    --accent-soft: #b7e4c7;
    --text: #e8f5e9;
    --text-dim: rgba(232, 245, 233, 0.7);
    --glass: rgba(255, 255, 255, 0.1);
    --glass-border: rgba(255, 255, 255, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: linear-gradient(135deg, var(--green-deep), var(--green-mid), var(--green-deep));
    background-size: 200% 200%;
    animation: bgShift 30s ease infinite;
    color: var(--text);
  }

  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* ====== 护眼背景：漂浮光球 ====== */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    pointer-events: none;
    will-change: transform;
  }
  .orb-1 { width: 400px; height: 400px; background: rgba(82, 183, 136, 0.25); left: -100px; top: -50px; animation: drift1 28s ease-in-out infinite; }
  .orb-2 { width: 350px; height: 350px; background: rgba(149, 213, 178, 0.18); right: -80px; top: 10%; animation: drift2 35s ease-in-out infinite; }
  .orb-3 { width: 300px; height: 300px; background: rgba(45, 106, 79, 0.3); left: 20%; bottom: -100px; animation: drift3 32s ease-in-out infinite; }
  .orb-4 { width: 250px; height: 250px; background: rgba(183, 228, 199, 0.15); right: 15%; bottom: 5%; animation: drift4 40s ease-in-out infinite; }
  .orb-5 { width: 200px; height: 200px; background: rgba(82, 183, 136, 0.2); left: 50%; top: 60%; animation: drift5 25s ease-in-out infinite; }

  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px,80px) scale(1.15); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-100px,120px) scale(0.9); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(80px,-100px) scale(1.2); } }
  @keyframes drift4 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-120px,-60px) scale(0.85); } }
  @keyframes drift5 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,-80px) scale(1.1); } }

  /* ====== 漂浮粒子 ====== */
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: rgba(216, 243, 220, 0.5);
    border-radius: 50%;
    pointer-events: none;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
  }

  /* ====== 主卡片 ====== */
  .card {
    position: relative;
    z-index: 10;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 0;
    max-width: 580px;
    width: 90%;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    animation: cardEnter 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ====== 顶部栏：Tab + 护眼按钮 ====== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 24px 0;
    flex-shrink: 0;
  }
  .tabs {
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.15);
    border-radius: 14px;
    padding: 4px;
  }
  .tab {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 8px 18px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .tab.active {
    background: rgba(82, 183, 136, 0.4);
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .tab:hover:not(.active) { color: var(--text); }

  .eye-care-btn {
    background: rgba(82, 183, 136, 0.25);
    border: 1px solid var(--glass-border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    flex-shrink: 0;
  }
  .eye-care-btn:hover {
    background: rgba(82, 183, 136, 0.45);
    transform: scale(1.08);
  }

  /* ====== Tab 内容区 ====== */
  .tab-content {
    display: none;
    padding: 24px 28px 28px;
    overflow-y: auto;
    flex: 1;
  }
  .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* 滚动条 */
  .tab-content::-webkit-scrollbar { width: 5px; }
  .tab-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

  /* ====== 每日一语 Tab ====== */
  .date-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  .date-block .month-day { font-size: 26px; font-weight: 700; }
  .date-block .weekday { font-size: 13px; opacity: 0.75; margin-top: 3px; }
  .day-counter { text-align: right; }
  .day-counter .label { font-size: 11px; opacity: 0.7; letter-spacing: 2px; }
  .day-counter .number { font-size: 30px; font-weight: 800; line-height: 1.2; color: var(--accent-soft); }

  .tag-line {
    display: inline-block;
    background: rgba(82, 183, 136, 0.25);
    padding: 6px 18px;
    border-radius: 18px;
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }
  .quote-mark { font-size: 50px; font-family: Georgia, serif; opacity: 0.3; line-height: 0.4; margin-bottom: 12px; }
  .quote-text {
    font-size: 24px; font-weight: 600; line-height: 1.7; margin-bottom: 16px;
    min-height: 82px; text-shadow: 0 1px 8px rgba(0,0,0,0.1);
  }
  .quote-author { font-size: 14px; opacity: 0.7; margin-bottom: 24px; letter-spacing: 1px; }
  .quote-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .events-section {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .events-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .events-header .events-title { font-size: 13px; opacity: 0.7; letter-spacing: 1px; }
  .settings-gear {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 15px; padding: 2px 4px;
    transition: color 0.3s; opacity: 0.5;
  }
  .settings-gear:hover { color: var(--text); opacity: 1; }
  .event-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0;
    font-size: 14px;
    opacity: 0.88;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .event-row:last-child { border-bottom: none; }
  .event-name { opacity: 0.8; }
  .event-days strong { font-size: 18px; color: var(--accent); font-weight: 700; }
  .event-days .unit { font-size: 13px; opacity: 0.7; }

  /* ====== 声音控制 ====== */
  .sound-btn {
    background: rgba(82, 183, 136, 0.25);
    border: 1px solid var(--glass-border);
    color: var(--text);
    width: 38px; height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    flex-shrink: 0;
    position: relative;
  }
  .sound-btn:hover { background: rgba(82, 183, 136, 0.45); transform: scale(1.08); }
  .sound-btn.playing { background: rgba(82, 183, 136, 0.55); }
  .sound-btn.playing::after {
    content: "";
    position: absolute;
    top: -2px; right: -2px;
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 50%;
    animation: soundPulse 1.5s ease-in-out infinite;
  }
  @keyframes soundPulse { 0%,100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.3); } }

  .sound-panel {
    background: rgba(27, 58, 42, 0.9);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 28px;
    max-width: 420px;
    width: 100%;
    color: var(--text);
    animation: cardEnter 0.4s ease;
  }
  .sound-panel h3 { font-size: 18px; text-align: center; margin-bottom: 6px; }
  .sound-panel .sound-sub { font-size: 12px; text-align: center; opacity: 0.6; margin-bottom: 20px; }
  .sound-grid { display: flex; flex-direction: column; gap: 8px; }
  .sound-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid transparent;
  }
  .sound-item:hover { background: rgba(0,0,0,0.25); }
  .sound-item.active { background: rgba(82, 183, 136, 0.25); border-color: var(--green-soft); }
  .sound-item-left { display: flex; align-items: center; gap: 12px; }
  .sound-icon { font-size: 20px; }
  .sound-name { font-size: 15px; }
  .sound-toggle {
    width: 42px; height: 24px;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    position: relative;
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .sound-toggle::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 18px; height: 18px;
    background: var(--text);
    border-radius: 50%;
    transition: transform 0.3s;
  }
  .sound-item.active .sound-toggle { background: var(--green-soft); }
  .sound-item.active .sound-toggle::after { transform: translateX(18px); }
  .sound-volume-row {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 0 16px 8px;
    margin-top: -4px;
  }
  .sound-item.active + .sound-volume-row { display: flex; }
  .sound-volume-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
  }
  .sound-volume-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: var(--green-soft);
    border-radius: 50%;
    cursor: pointer;
  }
  .sound-volume-row input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--green-soft);
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }

  /* ====== 自定义音频上传 ====== */
  .sound-divider {
    height: 1px;
    background: rgba(255,255,255,0.12);
    margin: 14px 0;
  }
  .custom-section-label {
    font-size: 13px;
    opacity: 0.6;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .custom-upload-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    border: 1px dashed rgba(149,213,178,0.3);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .custom-upload-row:hover {
    background: rgba(82,183,136,0.15);
    border-color: var(--green-soft);
  }
  .custom-upload-row .upload-icon { font-size: 20px; }
  .custom-upload-row .upload-text { font-size: 14px; flex: 1; }
  .custom-upload-row .upload-text .filename { font-weight: 600; color: var(--accent-soft); }
  .custom-upload-row .upload-text .placeholder { opacity: 0.6; }
  .custom-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid transparent;
    margin-top: 6px;
  }
  .custom-item:hover { background: rgba(0,0,0,0.25); }
  .custom-item.active { background: rgba(82,183,136,0.25); border-color: var(--green-soft); }
  .custom-item-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .custom-item-left .sound-icon { font-size: 20px; flex-shrink: 0; }
  .custom-item-left .sound-name {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .custom-item-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .custom-delete-btn {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 16px; padding: 2px 6px;
    opacity: 0.5; transition: opacity 0.3s;
  }
  .custom-delete-btn:hover { opacity: 1; color: #ff6b6b; }

  /* ====== 事件设置弹层 ====== */
  .events-modal-panel {
    background: rgba(27, 58, 42, 0.9);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 28px;
    max-width: 460px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    color: var(--text);
    animation: cardEnter 0.4s ease;
  }
  .events-modal-panel h3 { font-size: 18px; text-align: center; margin-bottom: 8px; }
  .events-modal-panel .hint { font-size: 12px; opacity: 0.6; margin-bottom: 18px; line-height: 1.5; text-align: center; }
  .event-setting-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    align-items: center;
  }
  .event-setting-row input[type="text"] {
    flex: 1;
    min-width: 0;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .event-setting-row input[type="text"]::placeholder { color: var(--text-dim); }
  .event-setting-row input[type="date"] {
    width: 140px;
    flex-shrink: 0;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    color-scheme: dark;
  }
  .events-modal-panel .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }

  /* ====== 通用按钮 ====== */
  .btn {
    background: rgba(82, 183, 136, 0.2);
    border: 1px solid var(--glass-border);
    color: var(--text);
    padding: 10px 24px;
    border-radius: 50px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .btn:hover {
    background: rgba(82, 183, 136, 0.38);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn.primary { background: rgba(82, 183, 136, 0.5); }
  .btn.primary:hover { background: rgba(82, 183, 136, 0.7); }
  .btn.danger { background: rgba(255, 107, 107, 0.2); border-color: rgba(255,107,107,0.3); }
  .btn.danger:hover { background: rgba(255, 107, 107, 0.35); }
  .btn.small { padding: 6px 16px; font-size: 13px; }

  /* ====== 专注计时 Tab ====== */
  .course-input-wrap { margin-bottom: 18px; }
  .course-input {
    width: 100%;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s;
  }
  .course-input::placeholder { color: var(--text-dim); }
  .course-input:focus { border-color: var(--green-soft); }

  .mode-toggle {
    display: flex;
    gap: 4px;
    background: rgba(0,0,0,0.15);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .mode-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 9px;
    border-radius: 9px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
  }
  .mode-btn.active {
    background: rgba(82, 183, 136, 0.4);
    color: var(--text);
  }

  .timer-display {
    text-align: center;
    font-size: 56px;
    font-weight: 200;
    font-family: "SF Mono", "Fira Code", "Courier New", monospace;
    letter-spacing: 4px;
    padding: 20px 0;
    color: var(--accent-soft);
    text-shadow: 0 0 30px rgba(149, 213, 178, 0.3);
    transition: text-shadow 0.3s;
  }
  .timer-display.running { animation: timerPulse 2s ease-in-out infinite; }
  @keyframes timerPulse {
    0%, 100% { text-shadow: 0 0 30px rgba(149, 213, 178, 0.3); }
    50% { text-shadow: 0 0 50px rgba(149, 213, 178, 0.5); }
  }

  .countdown-presets {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .preset-btn {
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
  }
  .preset-btn:hover { color: var(--text); border-color: var(--green-soft); }
  .preset-btn.active { background: rgba(82, 183, 136, 0.35); color: var(--text); border-color: var(--green-soft); }
  .custom-duration {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
    font-size: 14px;
  }
  .custom-duration.show { display: flex; }
  .custom-duration input {
    width: 60px;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    text-align: center;
  }

  .timer-controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 24px;
  }

  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    flex: 1;
    background: rgba(0,0,0,0.15);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .stat-card .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 6px; letter-spacing: 1px; }
  .stat-card .stat-value { font-size: 22px; font-weight: 700; color: var(--accent-soft); }

  .records-section { margin-top: 8px; }
  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .records-header h4 { font-size: 15px; font-weight: 600; }
  .records-list {
    max-height: 200px;
    overflow-y: auto;
  }
  .records-list::-webkit-scrollbar { width: 4px; }
  .records-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

  .record-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(0,0,0,0.1);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 13px;
    transition: background 0.3s;
  }
  .record-item:hover { background: rgba(0,0,0,0.2); }
  .record-info { display: flex; align-items: center; gap: 8px; }
  .record-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(82, 183, 136, 0.25);
  }
  .record-tag.down { background: rgba(255, 230, 109, 0.2); color: var(--accent); }
  .record-duration { font-weight: 600; color: var(--accent-soft); }
  .record-delete {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 16px; padding: 2px 6px; opacity: 0.5;
    transition: opacity 0.3s;
  }
  .record-delete:hover { opacity: 1; color: #ff6b6b; }

    { text: "行动是治愈一切焦虑的良药。", author: "每日一语" },
    { text: "不要等到万事俱备才开始，开始了才会万事俱备。", author: "每日一语" },
    { text: "你想要的生活，不会自己跑来找你。", author: "每日一语" },
    { text: "每一个优秀的人，都有一段沉默的时光。", author: "每日一语" },
    { text: "那段时光，付出了很多努力，忍受孤独和寂寞。", author: "每日一语" },
    { text: "不抱怨、不诉苦，日后说起时，连自己都能被感动。", author: "每日一语" },
    { text: "耐得住寂寞，才守得住繁华。", author: "每日一语" },
    { text: "奋斗如登山，每一步都很累，但每一步都在向上。", author: "每日一语" },
    { text: "山顶的风景，只有爬上去的人才能看到。", author: "每日一语" },
    { text: "别在最该奋斗的年纪，选择安逸。", author: "每日一语" },
    { text: "你的对手在看书，你的仇人在磨刀，你的闺蜜在减肥。", author: "每日一语" },
    { text: "隔壁老王在练腰，而你还在刷手机，你必须不断地前进。", author: "每日一语" },
    { text: "如果你不努力，一年后的你还是原来的你，只是老了一岁。", author: "每日一语" },
    { text: "人生路上，三分天注定，七分靠打拼。", author: "每日一语" },
    { text: "剩下的九十分，靠的是日复一日的坚持。", author: "每日一语" },
    { text: "不要问成功有多远，问自己今天够不够努力。", author: "每日一语" },
    { text: "每一个不曾起舞的日子，都是对生命的辜负。", author: "尼采" },
    { text: "既然选择了远方，便只顾风雨兼程。", author: "汪国真" },
    { text: "我不去想是否能够成功，既然选择了远方，便只顾风雨兼程。", author: "每日一语" },
    { text: "宝剑锋从磨砺出，梅花香自苦寒来。", author: "古训" },
    { text: "千淘万漉虽辛苦，吹尽狂沙始到金。", author: "刘禹锡" },
    { text: "长风破浪会有时，直挂云帆济沧海。", author: "李白" },
    { text: "会当凌绝顶，一览众山小。", author: "杜甫" },
    { text: "路漫漫其修远兮，吾将上下而求索。", author: "屈原" },
    { text: "天生我材必有用，千金散尽还复来。", author: "李白" },
    { text: "锲而不舍，金石可镂。", author: "荀子" },
    { text: "不积跬步，无以至千里；不积小流，无以成江海。", author: "荀子" },
    { text: "业精于勤，荒于嬉；行成于思，毁于随。", author: "韩愈" },
    { text: "黑发不知勤学早，白首方悔读书迟。", author: "颜真卿" },
    { text: "书山有路勤为径，学海无涯苦作舟。", author: "韩愈" },
    { text: "奋斗的路上，你不是一个人在战斗。", author: "每日一语" },
    { text: "无数追梦人陪你一起，在黑夜里赶路，在黎明前到达。", author: "每日一语" },
    { text: "你现在的坚持，是未来成功后最骄傲的回忆。", author: "每日一语" },
    { text: "不要小看每天的一点点进步，时间会给你答案。", author: "每日一语" },
    { text: "奋斗拼到最后，拼的就是心态和体力。", author: "每日一语" },
    { text: "身体是革命的本钱，努力也要注意锻炼。", author: "每日一语" },
    { text: "劳逸结合，才能走得更远。", author: "每日一语" },
    { text: "睡好每一个觉，是为了更高效地学习。", author: "每日一语" },
    { text: "知识每天积累一点点，关键时刻才能信手拈来。", author: "每日一语" },
    { text: "方法技巧千千万，适合自己的才是最好的。", author: "每日一语" },
    { text: "基础扎实是提升的利器，一定要拿下。", author: "每日一语" },
    { text: "难题有规律，多练多总结就能突破。", author: "每日一语" },
    { text: "理解能力靠积累，但积累也是练出来的。", author: "每日一语" },
    { text: "难题不要怕，掌握方法也能拿下。", author: "每日一语" },
    { text: "知识面要广，但每一点都要争取。", author: "每日一语" },
    { text: "你的竞争对手也在焦虑，谁能稳住谁就赢了。", author: "每日一语" },
    { text: "学习是一场信息战，及时获取有用的信息。", author: "每日一语" },
    { text: "选择很重要，有时候选择比努力更关键。", author: "每日一语" },
    { text: "不要好高骛远，也不要妄自菲薄，选适合自己的路。", author: "每日一语" },
    { text: "努力要有计划，更要有执行力。", author: "每日一语" },
    { text: "计划不执行，等于没有计划。", author: "每日一语" },
    { text: "每周复盘一次，看看自己哪里做得好、哪里要改进。", author: "每日一语" },
    { text: "学习需要专注，放下手机，专注当下。", author: "每日一语" },
    { text: "番茄工作法试试看，25分钟专注加5分钟休息。", author: "每日一语" },
    { text: "图书馆和自习室，是最好的学习场所。", author: "每日一语" },
    { text: "找到志同道合的人，互相监督、共同进步。", author: "每日一语" },
    { text: "但记住，成长最终还是要靠自己。", author: "每日一语" },
    { text: "你今天偷的懒，都是给未来挖的坑。", author: "每日一语" },
    { text: "你今天流的汗，都会变成未来的从容。", author: "每日一语" },
    { text: "努力不是人生的唯一出路，但既然选了，就别辜负自己。", author: "每日一语" },
    { text: "成功的那一刻，你会感谢现在拼命的自己。", author: "每日一语" },
    { text: "所有的坚持，都会在未来某天给你回报。", author: "每日一语" },
    { text: "成功不是终点，但它是很多人向往的起点。", author: "每日一语" },
    { text: "实现价值，从成为更好的自己开始。", author: "每日一语" },
    { text: "你的志向不应该只是成功，而是成功后做更好的自己。", author: "每日一语" },
    { text: "把努力当成一种修行，修的是知识，更是心性。", author: "每日一语" },
    { text: "每一个想要放弃的瞬间，都请再多坚持一秒。", author: "每日一语" },
    { text: "一秒又一秒，你就走过了最难的路。", author: "每日一语" },
    { text: "你不必很厉害才能开始，但你必须开始才能很厉害。", author: "齐格·齐格勒" },
    { text: "种下努力的种子，收获成功的果实。", author: "每日一语" },
    { text: "人生没有白走的路，每一步都算数。", author: "每日一语" },
    { text: "成长路上没有白练的题，每一道都算数。", author: "每日一语" },
    { text: "如果这条路很难，那说明你走对了，因为容易的路通向平庸。", author: "每日一语" },
    { text: "山高路远，看世界，也找自己。", author: "每日一语" },
    { text: "奋斗的意义，也许就在于让你成为一个更好的自己。", author: "每日一语" },
    { text: "自律的本质，是把未来的自己当成现在的朋友来对待。", author: "每日一语" },
    { text: "今天自控，是为了明天自由。", author: "每日一语" },
    { text: "自由不是随心所欲，而是自我主宰。", author: "康德" },
    { text: "最大的自由，是成功后可以选择自己想要的生活。", author: "每日一语" },
    { text: "不要让今天的懒，成为明天的难。", author: "每日一语" },
    { text: "少想多做，行动是打败焦虑的最好武器。", author: "每日一语" },
    { text: "与其担心做不到，不如多努力一些。", author: "每日一语" },
    { text: "焦虑不会让你少一道错题，但行动会。", author: "每日一语" },
    { text: "把焦虑的时间用来学习，你会发现自己比想象中强大。", author: "每日一语" },
    { text: "成长路上，最大的谎言就是'来不及了'。", author: "每日一语" },
    { text: "只要你开始了，就永远来得及。", author: "每日一语" },
    { text: "种树最好的时间是十年前，其次是现在，努力也一样。", author: "每日一语" },
    { text: "别等准备好了才开始，开始了才会准备好。", author: "每日一语" },
    { text: "完美主义是拖延的借口，先完成再完美。", author: "每日一语" },
    { text: "做总比不做好，做错也比不做强。", author: "每日一语" },
    { text: "错题不可怕，可怕的是不敢面对错题。", author: "每日一语" },
    { text: "每道错题都是一盏灯，照亮你的知识盲区。", author: "每日一语" },
    { text: "错题本越厚，你离成功越近。", author: "每日一语" },
    { text: "因为你在填补漏洞，而不是制造漏洞。", author: "每日一语" },
    { text: "高分不是梦，前提是你真的付出了相应的努力。", author: "每日一语" },
    { text: "结果不会骗人，你付出多少，它就回报多少。", author: "每日一语" },
    { text: "别羡慕别人的优秀，去追赶别人的努力。", author: "每日一语" },
    { text: "成功不是运气，是日积月累的必然。", author: "每日一语" },
    { text: "运气是强者的谦辞，弱者的借口。", author: "每日一语" },
    { text: "你只管努力到无能为力，好运自会不期而遇。", author: "每日一语" },
    { text: "成长是一场修行，修的是耐心、毅力和恒心。", author: "每日一语" },
    { text: "把每一次练习都当成一次修行，心会越来越静。", author: "每日一语" },
    { text: "心静了，事自然就顺了。", author: "每日一语" },
    { text: "关键时刻的从容，来自平时的千百次练习。", author: "每日一语" },
    { text: "你平时的每一次练习，都是在为未来攒底气。", author: "每日一语" },
    { text: "底气不是天生的，是一点一滴练出来的。", author: "每日一语" },
    { text: "自信不是盲目的，是你真的准备充分后的自然流露。", author: "每日一语" },
    { text: "当你的实力配得上你的野心，成功只是时间问题。", author: "每日一语" },
    { text: "成长不问出身，不问起点，只问你是否足够努力。", author: "每日一语" },
    { text: "这是一条相对公平的路，值得你全力以赴。", author: "每日一语" },
    { text: "既然选择了这条路，就别给自己留退路。", author: "每日一语" },
    { text: "退路越多，前进的动力越少。", author: "每日一语" },
    { text: "把后路断了，你才会拼命向前。", author: "每日一语" },
    { text: "破釜沉舟，百二秦关终属楚。", author: "蒲松龄" },
    { text: "卧薪尝胆，三千越甲可吞吴。", author: "蒲松龄" },
    { text: "有志者事竟成，坚持者终成功。", author: "每日一语" },
    { text: "苦心人天不负，你的努力上天看得见。", author: "每日一语" },
    { text: "天道酬勤，这不是鸡汤，是真理。", author: "每日一语" },
    { text: "越努力越幸运，这是追梦人最该信的话。", author: "每日一语" },
    { text: "每天给自己一个小目标，完成了就是胜利。", author: "每日一语" },
    { text: "小目标一个个实现，大目标就不再遥远。", author: "每日一语" },
    { text: "今日事今日毕，别把今天的任务拖到明天。", author: "每日一语" },
    { text: "明天的你会感谢今天努力的自己。", author: "每日一语" },
    { text: "别让明天的你，为今天的懈怠买单。", author: "每日一语" },
    { text: "今天的辛苦，是明天的底气，后天的成功。", author: "每日一语" },
    { text: "奋斗是一场孤独的旅行，但终点的风景值得期待。", author: "每日一语" },
    { text: "孤独的时候，就把寂寞当作动力。", author: "每日一语" },
    { text: "别人在热闹，你在读书，这就是你的不一样。", author: "每日一语" },
    { text: "不是所有的坚持都有结果，但总有一些坚持能从冰封的土地里绽放出十万朵怒放的蔷薇。", author: "每日一语" },
    { text: "这十万朵蔷薇，就是你的成功果实。", author: "每日一语" },
    { text: "你只管盛开，蝴蝶自来。", author: "每日一语" },
    { text: "你只管努力，成功自来。", author: "每日一语" },
    { text: "做一个有准备的人，机会来时才能抓住。", author: "每日一语" },
    { text: "机会总是留给有准备的人，成长更是如此。", author: "每日一语" },
    { text: "你现在的每一分准备，都是在等待那个成功的机会。", author: "每日一语" },
    { text: "学习如逆水行舟，不进则退。", author: "每日一语" },
    { text: "停下来休息可以，但别停下来放弃。", author: "每日一语" },
    { text: "累了就歇会儿，但歇完记得继续赶路。", author: "每日一语" },
    { text: "奋斗路上，允许自己疲惫，但不允许自己认输。", author: "每日一语" },
    { text: "承认累是正常的，但累不是放弃的理由。", author: "每日一语" },
    { text: "你比想象中更能扛，再坚持一下就好了。", author: "每日一语" },
    { text: "很多成功的人回首来路，都说最难的是坚持。", author: "每日一语" },
    { text: "而他们之所以成功，就是因为在最难的时候选择了坚持。", author: "每日一语" },
    { text: "你也可以成为那个在最难时选择坚持的人。", author: "每日一语" },
    { text: "成功不是奇迹，是每一个平凡日子的不平凡坚持。", author: "每日一语" },
    { text: "加油！你的成功之日，终将到来。", author: "每日一语" },
    { text: "愿你披星戴月走过的路，终将繁花满地。", author: "每日一语" },
    { text: "愿你合上笔盖的那一刻，有战士收刀入鞘的骄傲。", author: "每日一语" },
    { text: "愿你走出难关时，嘴角上扬，心中无悔。", author: "每日一语" },
    { text: "愿你的收获，配得上你的努力。", author: "每日一语" },
    { text: "愿你的成功，不只是达成目标，更是通过自己的考验。", author: "每日一语" },
    { text: "愿所有追梦人，都能得偿所愿，梦想成真。", author: "每日一语" },
    { text: "今日不搏，更待何时？加油！", author: "每日一语" },
    { text: "把野心写在脸上，把努力刻在心里。", author: "每日一语" },
    { text: "少说多做，用行动证明自己。", author: "每日一语" },
    { text: "追梦人的字典里，没有'不可能'三个字。", author: "每日一语" },
    { text: "你说不可能，别人就把它变成了可能。", author: "每日一语" },
    { text: "所以，别说不可能，去试试看。", author: "每日一语" },
    { text: "试试就能行，争争就能赢。", author: "每日一语" },
    { text: "追梦人的口号：不抛弃、不放弃。", author: "每日一语" },
    { text: "不抛弃每一个知识点，不放弃每一次进步的机会。", author: "每日一语" },
    { text: "你负责努力，时间负责证明。", author: "每日一语" },
    { text: "时间不会辜负任何一个认真生活、努力奋斗的人。", author: "每日一语" },
    { text: "你认真努力的样子，真的很美。", author: "每日一语" },
    { text: "每一个认真努力的人，都值得被温柔以待。", author: "每日一语" },
    { text: "而这份温柔，就是成功时那份属于自己的荣耀。", author: "每日一语" },
    { text: "今天也是认真努力的一天，加油！", author: "每日一语" },
    { text: "学习使人进步，奋斗让人成长。", author: "每日一语" },
    { text: "不管结果如何，努力的过程已经让你变得更好。", author: "每日一语" },
    { text: "知识是带不走的财富，学习让你终生受益。", author: "每日一语" },
    { text: "奋斗的路上，你收获的不只是成绩，还有更好的自己。", author: "每日一语" },
    { text: "成为更好的自己，这本身就是最大的胜利。", author: "每日一语" },
    { text: "向前走，别回头，成功就在前方。", author: "每日一语" },
    { text: "前路漫漫亦灿灿，成功之日终可期。", author: "每日一语" },
    { text: "愿你历经千帆，终能成功。", author: "每日一语" },
    { text: "愿你走过风雨，终见彩虹。", author: "每日一语" },
    { text: "今天的你，离成功又近了一步。", author: "每日一语" },
    { text: "明天的你，会感谢今天没有放弃的自己。", author: "每日一语" },
    { text: "成长路上，每一步都算数，每一步都算。", author: "每日一语" },
    { text: "把热爱做到极致，成功便是水到渠成。", author: "每日一语" },
    { text: "认真且努力，温柔且坚定。这是追梦人最好的状态。", author: "每日一语" },
    { text: "你的认真，终将被看见。", author: "每日一语" },
    { text: "你的努力，终将有回报。", author: "每日一语" },
    { text: "你的坚持，终将成就成功。", author: "每日一语" },
    { text: "所有的终将，都要从今天开始。", author: "每日一语" },
    { text: "所以，从现在开始，别犹豫，去学吧！", author: "每日一语" },
    { text: "成长的路上没有白费的努力，也没有碰巧的成功。", author: "每日一语" },
    { text: "你的每一分付出，都在为成功蓄力。", author: "每日一语" },
    { text: "蓄力到一定程度，爆发只是时间问题。", author: "每日一语" },
    { text: "愿你如竹，厚积薄发，一鸣惊人。", author: "每日一语" },
    { text: "竹子用了4年长3厘米，第5年开始每天长30厘米。", author: "每日一语" },

  // ========== 日期处理 ==========
  const WEEKDAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

  function getDayOfYear(date) {
    const start = new Date(date.getFullYear(), 0, 0);
    return Math.floor((date - start) / 86400000);
  }
  function formatDate(date) {
    return `${date.getMonth() + 1}月${date.getDate()}日`;
  }

  // ========== 坚持天数 ==========
  function getStartDate() {
    let start = localStorage.getItem("daily_start_date");
    if (!start) {
      start = new Date().toDateString();
      localStorage.setItem("daily_start_date", start);
    }
    return new Date(start);
  }
  function getStreakDays() {
    const diff = Math.floor((new Date() - getStartDate()) / 86400000) + 1;
    return Math.max(1, diff);
  }

  // ========== 今日激励语 ==========
  function getTodayQuote() {
    const dayOfYear = getDayOfYear(new Date());
    const index = dayOfYear % QUOTES.length;
    return { ...QUOTES[index], index: dayOfYear };
  }

  // ========== 事件倒计时（5条可自定义）==========
  const DEFAULT_EVENTS = [
    { name: "今年", date: new Date(new Date().getFullYear(), 11, 31).toISOString().split("T")[0] },
    { name: "", date: "" },
    { name: "", date: "" },
    { name: "", date: "" },
    { name: "", date: "" }
  ];

  function getEvents() {
    const saved = localStorage.getItem("custom_events");
    if (saved) {
      try { return JSON.parse(saved); } catch (e) {}
    }
    return DEFAULT_EVENTS.slice();
  }

  function getEventDays(dateStr) {
    if (!dateStr) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(dateStr);
    target.setHours(0, 0, 0, 0);
    const diff = Math.ceil((target - today) / 86400000);
    return Math.max(0, diff);
  }

  function renderEvents() {
    const events = getEvents();
    const container = document.getElementById("eventsList");
    container.innerHTML = "";
    events.forEach(ev => {
      if (!ev.name || !ev.date) return;
      const days = getEventDays(ev.date);
      if (days === null) return;
      const row = document.createElement("div");
      row.className = "event-row";
      row.innerHTML = `<span class="event-name">${ev.name}</span><span class="event-days"><strong>${days}</strong> <span class="unit">天后</span></span>`;
      container.appendChild(row);
    });
    // 如果没有显示的事件，显示一个默认提示
    if (container.children.length === 0) {
      container.innerHTML = '<div class="event-row" style="opacity:0.5"><span class="event-name">点击 ⚙ 设置事件倒计时</span></div>';
    }
  }

  function openEventSettings() {
    const events = getEvents();
    const list = document.getElementById("eventSettingsList");
    list.innerHTML = "";
    events.forEach((ev, i) => {
      const row = document.createElement("div");
      row.className = "event-setting-row";
      row.innerHTML = `<input type="text" placeholder="事件名称" value="${ev.name}" data-idx="${i}" data-field="name" maxlength="12"><input type="date" value="${ev.date}" data-idx="${i}" data-field="date">`;
      list.appendChild(row);
    });
    document.getElementById("dateOverlay").classList.add("active");
  }
  function closeEventSettings() {
    document.getElementById("dateOverlay").classList.remove("active");
  }
  function saveEventSettings() {
    const inputs = document.querySelectorAll("#eventSettingsList input");
    const events = [];
    for (let i = 0; i < 5; i++) {
      const nameEl = document.querySelector(`#eventSettingsList input[data-idx="${i}"][data-field="name"]`);
      const dateEl = document.querySelector(`#eventSettingsList input[data-idx="${i}"][data-field="date"]`);
      events.push({
        name: nameEl ? nameEl.value.trim() : "",
        date: dateEl ? dateEl.value : ""
      });
    }
    localStorage.setItem("custom_events", JSON.stringify(events));
    closeEventSettings();
    renderEvents();
    showToast("设置已保存");
  }

  // ========== 渲染每日一语 ==========
  let currentQuote = null;
  function renderQuote() {
    const today = new Date();
    currentQuote = getTodayQuote();
    document.getElementById("monthDay").textContent = formatDate(today);
    document.getElementById("weekday").textContent = WEEKDAYS[today.getDay()];

  // ========== 复制 / 换一句 / 往期 ==========
  function copyQuote() {
    const text = `"${currentQuote.text}" — ${currentQuote.author}`;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => showToast("已复制到剪贴板"))
        .catch(() => fallbackCopy(text));
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast("已复制到剪贴板"); }
    catch (e) { showToast("复制失败，请手动复制"); }
    document.body.removeChild(ta);
  }
  let lastRand = -1;
  function refreshQuote() {
    let idx;
    do { idx = Math.floor(Math.random() * QUOTES.length); }
    while (idx === lastRand || QUOTES[idx].text === currentQuote.text);
    lastRand = idx;
    currentQuote = { ...QUOTES[idx] };
    const qe = document.getElementById("quoteText");
    const ae = document.getElementById("quoteAuthor");
    qe.style.animation = "none"; ae.style.animation = "none";
    void qe.offsetWidth;

  // ========== 计时器 ==========
  let timerMode = "up"; // "up" | "down"
  let timerRunning = false;
  let timerStartTs = null;
  let timerElapsed = 0; // 暂停前已累计秒数
  let timerInterval = null;
  let countdownDuration = 25 * 60; // 倒计时总秒数
  let currentPreset = 25;

  function formatTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function getCurrentElapsed() {
    if (timerRunning) return timerElapsed + Math.floor((Date.now() - timerStartTs) / 1000);
    return timerElapsed;
  }

  function updateTimerDisplay() {
    const display = document.getElementById("timerDisplay");
    if (timerMode === "up") {
      display.textContent = formatTime(getCurrentElapsed());
    } else {
      const remaining = countdownDuration - getCurrentElapsed();
      if (remaining <= 0) {
        display.textContent = "00:00:00";
        onCountdownFinish();
        return;
      }
      display.textContent = formatTime(remaining);
    }
  }

  function setTimerMode(mode) {
    if (timerRunning) { showToast("请先停止当前计时"); return; }
    timerMode = mode;
    timerElapsed = 0;
    document.querySelectorAll(".mode-btn").forEach((b, i) => {
      b.classList.toggle("active", (i === 0 && mode === "up") || (i === 1 && mode === "down"));
    });
    document.getElementById("countdownPresets").style.display = mode === "down" ? "flex" : "none";
    document.getElementById("customDuration").classList.remove("show");
    if (mode === "down") {
      timerElapsed = 0;
      updateTimerDisplay();
    } else {
      document.getElementById("timerDisplay").textContent = "00:00:00";
    }
  }

  function setPreset(val) {
    if (timerRunning) { showToast("请先停止当前计时"); return; }
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
    if (val === "custom") {
      document.getElementById("customDuration").classList.add("show");
      document.querySelectorAll(".preset-btn").forEach(b => {
        if (b.textContent === "自定义") b.classList.add("active");
      });
      return;
    }
    document.getElementById("customDuration").classList.remove("show");
    currentPreset = val;
    countdownDuration = val * 60;
    timerElapsed = 0;
    document.querySelectorAll(".preset-btn").forEach(b => {
      if (parseInt(b.textContent) === val) b.classList.add("active");
    });
    document.getElementById("timerDisplay").textContent = formatTime(countdownDuration);
  }

  function applyCustomDuration() {
    const mins = parseInt(document.getElementById("customMinutes").value);
    if (!mins || mins < 1 || mins > 600) { showToast("请输入1-600之间的数字"); return; }
    countdownDuration = mins * 60;
    timerElapsed = 0;
    currentPreset = mins;
    document.getElementById("timerDisplay").textContent = formatTime(countdownDuration);
    showToast(`已设置为 ${mins} 分钟`);
  }

  function startTimer() {
    if (timerRunning) return;
    if (timerMode === "down" && timerElapsed >= countdownDuration) {
      timerElapsed = 0;
    }
    timerRunning = true;
    timerStartTs = Date.now();
    timerInterval = setInterval(updateTimerDisplay, 200);
    document.getElementById("timerDisplay").classList.add("running");
    document.getElementById("startBtn").disabled = true;
    document.getElementById("pauseBtn").disabled = false;
    document.getElementById("stopBtn").disabled = false;
  }

  function pauseTimer() {
    if (!timerRunning) return;
    timerRunning = false;
    timerElapsed += Math.floor((Date.now() - timerStartTs) / 1000);
    clearInterval(timerInterval);
    document.getElementById("timerDisplay").classList.remove("running");
    document.getElementById("startBtn").disabled = false;
    document.getElementById("startBtn").textContent = "继续";
    document.getElementById("pauseBtn").disabled = true;
  }

  function stopTimer() {
    const elapsed = getCurrentElapsed();
    if (elapsed > 0) {
      saveSession(elapsed);
      showToast(`已记录 ${formatDuration(elapsed)}`);
    }
    timerRunning = false;
    clearInterval(timerInterval);
    timerElapsed = 0;
    document.getElementById("timerDisplay").classList.remove("running");
    document.getElementById("startBtn").disabled = false;
    document.getElementById("startBtn").textContent = "开始";
    document.getElementById("pauseBtn").disabled = true;
    document.getElementById("stopBtn").disabled = true;
    if (timerMode === "down") {
      document.getElementById("timerDisplay").textContent = formatTime(countdownDuration);
    } else {
      document.getElementById("timerDisplay").textContent = "00:00:00";
    }
  }

  function onCountdownFinish() {
    timerRunning = false;
    clearInterval(timerInterval);
    const elapsed = countdownDuration;
    saveSession(elapsed);
    playBeep();
    showToast("倒计时完成！已记录学习时间");
    document.getElementById("timerDisplay").classList.remove("running");
    document.getElementById("startBtn").disabled = false;
    document.getElementById("startBtn").textContent = "开始";
    document.getElementById("pauseBtn").disabled = true;
    document.getElementById("stopBtn").disabled = true;
    document.getElementById("timerDisplay").textContent = formatTime(countdownDuration);
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.3, 0.6].forEach(delay => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880; osc.type = "sine";
        gain.gain.setValueAtTime(0.25, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + delay + 0.25);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.25);
      });
    } catch (e) {}
  }

    });

    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (h > 0) return `${h}小时${m}分`;
    if (m > 0) return `${m}分钟`;
    return `${sec}秒`;
  }

  // ========== 眼球跟随放松训练 ==========
  // 训练课程：每项包含 name（名称）、hint（提示）、duration（秒）、trail（SVG路径）、
  // path（运动函数：t∈[0,1) → {x: px, y: px}，以stage中心为原点）
  // R = 运动半径（像素），在运行时根据屏幕动态计算
  let eyeRadius = 150;

  const EYE_EXERCISES = [
    {
      name: "左右移动",
      hint: "头部不动，眼球跟随小球左右移动",
      duration: 12,
      trail: `M ${200 - eyeRadius} 200 L ${200 + eyeRadius} 200`,
      path: (t, R) => {
        const x = Math.sin(t * Math.PI * 2 * 4) * R; // 4次往返
        return { x, y: 0 };
      }
    },
    {
      name: "上下移动",
      hint: "头部不动，眼球跟随小球上下移动",
      duration: 12,
      trail: `M 200 ${200 - eyeRadius} L 200 ${200 + eyeRadius}`,
      path: (t, R) => {
        const y = Math.sin(t * Math.PI * 2 * 4) * R;
        return { x: 0, y };
      }
    },
    {
      name: "对角线移动",
      hint: "眼球沿对角线方向跟随小球",
      duration: 12,
      trail: `M ${200 - eyeRadius} ${200 - eyeRadius} L ${200 + eyeRadius} ${200 + eyeRadius} M ${200 - eyeRadius} ${200 + eyeRadius} L ${200 + eyeRadius} ${200 - eyeRadius}`,
      path: (t, R) => {
        const phase = t * Math.PI * 2 * 2;
        const s = Math.sin(phase);

        return { x: s * R, y: c * R };
      }
    },

      hint: "眼球顺时针画圆跟随小球",

      path: (t, R) => {
        const a = t * Math.PI * 2 * 3; // 3圈
        return { x: Math.cos(a) * R, y: Math.sin(a) * R };
      }
    },

      path: (t, R) => {

  function openEyeCare() {

    eyeRadius = Math.max(80, Math.min(180, Math.floor(size * 0.3)));
    updateEyeProgress();
    drawTrail();
  }

  function closeEyeCare() {
    stopEyeCare();
    document.getElementById("eyeOverlay").classList.remove("active");
  }

  function toggleEyeCare() {
    if (eyeCareActive) {
      pauseEyeCare();
    } else {
      startEyeCare();
    }
  }

  function startEyeCare() {
    eyeCareActive = true;
    eyeExercisePaused = false;
    eyeExerciseStart = performance.now();
    document.getElementById("eyeStartBtn").textContent = "暂停";
    document.getElementById("eyeBall").classList.remove("paused");
    document.getElementById("eyeTrail").classList.add("visible");
    runEyeCareFrame();
  }

  function pauseEyeCare() {
    eyeCareActive = false;
    eyeExercisePaused = true;
    cancelAnimationFrame(eyeCareRAF);
    document.getElementById("eyeStartBtn").textContent = "继续";
    document.getElementById("eyeBall").classList.add("paused");
    document.getElementById("eyeInstruction").textContent = "已暂停";
  }

  function stopEyeCare() {
    eyeCareActive = false;
    eyeExercisePaused = false;
    cancelAnimationFrame(eyeCareRAF);
    document.getElementById("eyeStartBtn").textContent = "开始训练";
    document.getElementById("eyeBall").classList.add("paused");
    document.getElementById("eyeTrail").classList.remove("visible");
    // 重置球到中心
    moveEyeBall(0, 0, 1);
    eyeCurrentIdx = 0;
    updateEyeProgress();
    document.getElementById("eyeInstruction").textContent = "点击\"开始训练\"";
  }

  function runEyeCareFrame() {
    if (!eyeCareActive) return;
    const now = performance.now();
    const elapsed = (now - eyeExerciseStart) / 1000;
    const ex = EYE_EXERCISES[eyeCurrentIdx];
    const t = Math.min(elapsed / ex.duration, 1);

    // 计算小球位置
    const pos = ex.path(t, eyeRadius);
    moveEyeBall(pos.x, pos.y, pos.scale || 1);

    // 更新指令文字
    const remaining = Math.ceil(ex.duration - elapsed);
    document.getElementById("eyeInstruction").textContent = ex.name + " · 剩余 " + remaining + "s";

    if (t >= 1) {
      // 本项完成，进入下一项
      nextEyeExercise(true);
    } else {
      eyeCareRAF = requestAnimationFrame(runEyeCareFrame);
    }
  }

  function moveEyeBall(x, y, scale) {
    const ball = document.getElementById("eyeBall");
    ball.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }

  function nextEyeExercise(autoAdvance) {
    eyeCurrentIdx++;
    if (eyeCurrentIdx >= EYE_EXERCISES.length) {
      // 全部完成
      eyeCareActive = false;
      cancelAnimationFrame(eyeCareRAF);
      moveEyeBall(0, 0, 1);
      document.getElementById("eyeInstruction").textContent = "训练完成！眼部已放松～";
      document.getElementById("eyeStartBtn").textContent = "再来一次";
      eyeCurrentIdx = 0;
      updateEyeProgress();
      document.getElementById("eyeTrail").classList.remove("visible");
      return;
    }
    eyeExerciseStart = performance.now();
    drawTrail();
    updateEyeProgress();
    if (!eyeCareActive && !autoAdvance) {
      // 如果是手动跳过且当前未运行，不需要启动
      return;
    }
    if (eyeCareActive) {
      runEyeCareFrame();
    }
  }

  function prevEyeExercise() {
    if (eyeCurrentIdx > 0) eyeCurrentIdx--;
    eyeExerciseStart = performance.now();
    drawTrail();
    updateEyeProgress();
    if (eyeCareActive) {
      runEyeCareFrame();
    }
  }

  function updateEyeProgress() {
    document.getElementById("eyeProgressText").textContent =
      `第 ${eyeCurrentIdx + 1} / ${EYE_EXERCISES.length} 项 · ${EYE_EXERCISES[eyeCurrentIdx].name}`;
    document.getElementById("eyeHint").textContent = EYE_EXERCISES[eyeCurrentIdx].hint;
  }

  function drawTrail() {
    const ex = EYE_EXERCISES[eyeCurrentIdx];
    const trail = document.getElementById("eyeTrail");
    const path = document.getElementById("eyeTrailPath");
    if (ex.trail) {
      // 重新生成带当前半径的路径
      const R = eyeRadius;
      const cx = 200, cy = 200;
      let d = "";
      if (ex.name === "左右移动") {
        d = `M ${cx - R} ${cy} L ${cx + R} ${cy}`;
      } else if (ex.name === "上下移动") {
        d = `M ${cx} ${cy - R} L ${cx} ${cy + R}`;
      } else if (ex.name === "对角线移动") {
        d = `M ${cx - R} ${cy - R} L ${cx + R} ${cy + R} M ${cx - R} ${cy + R} L ${cx + R} ${cy - R}`;
      } else if (ex.name === "顺时针转圈") {
        d = `M ${cx + R} ${cy} A ${R} ${R} 0 1 1 ${cx - R} ${cy} A ${R} ${R} 0 1 1 ${cx + R} ${cy}`;
      } else if (ex.name === "逆时针转圈") {
        d = `M ${cx - R} ${cy} A ${R} ${R} 0 1 0 ${cx + R} ${cy} A ${R} ${R} 0 1 0 ${cx - R} ${cy}`;
      } else if (ex.name === "8字运动") {
        d = `M ${cx} ${cy - R} C ${cx + R * 0.8} ${cy - R * 0.5}, ${cx + R} ${cy + R * 0.5}, ${cx} ${cy + R} C ${cx - R * 0.8} ${cy + R * 0.5}, ${cx - R} ${cy - R * 0.5}, ${cx} ${cy - R}`;
      }
      path.setAttribute("d", d);
      trail.classList.add("visible");
    } else {
      path.setAttribute("d", "");
      trail.classList.remove("visible");
    }
  }

  // ========== 专注白噪音（Web Audio API 程序生成）==========
  let audioCtx = null;
  const soundNodes = {}; // { soundId: { gain, nodes: [], interval } }
  const soundVolumes = {}; // { soundId: 0.0-1.0 }

  const SOUND_LIST = [
    { id: "rain", icon: "🌧", name: "雨声" },
    { id: "ocean", icon: "🌊", name: "海浪" },
    { id: "forest", icon: "🍃", name: "森林" },
    { id: "stream", icon: "💧", name: "溪流" },
    { id: "whitenoise", icon: "📡", name: "白噪音" },
    { id: "thunder", icon: "⛈", name: "雷雨" }
  ];

  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  // 创建噪声缓冲区
  function createNoiseBuffer(ctx, type) {
    const bufferSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    if (type === "white") {
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    } else if (type === "brown") {
      let last = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        last = (last + 0.02 * white) / 1.02;
        data[i] = last * 3.5;
      }
    } else if (type === "pink") {
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886*b0 + white*0.0555179;
        b1 = 0.99332*b1 + white*0.0750759;
        b2 = 0.96900*b2 + white*0.1538520;
        b3 = 0.86650*b3 + white*0.3104856;
        b4 = 0.55000*b4 + white*0.5329522;
        b5 = -0.7616*b5 - white*0.0168980;
        data[i] = (b0+b1+b2+b3+b4+b5+b6+white*0.5362) * 0.11;
        b6 = white * 0.115926;
      }
    }
    return buffer;
  }

  function startSound(soundId) {
    const ctx = ensureAudioCtx();
    const gain = ctx.createGain();
    const vol = soundVolumes[soundId] !== undefined ? soundVolumes[soundId] : 0.5;
    gain.gain.value = vol;
    gain.connect(ctx.destination);

    if (soundId === "rain") {
      // 雨声 = 高频白噪音 + 低通滤波
      const noise = ctx.createBufferSource();
      noise.buffer = createNoiseBuffer(ctx, "white");
      noise.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 2400;
      noise.connect(filter).connect(gain);
      noise.start();
      soundNodes[soundId] = { gain, nodes: [noise, filter] };
    } else if (soundId === "ocean") {
      // 海浪 = 棕噪音 + 慢速音量调制
      const noise = ctx.createBufferSource();
      noise.buffer = createNoiseBuffer(ctx, "brown");
      noise.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 800;
      noise.connect(filter).connect(gain);
      noise.start();
      // 慢速音量起伏模拟海浪
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 0.1;
      lfoGain.gain.value = 0.3;
      lfo.connect(lfoGain).connect(gain.gain);
      lfo.start();
      soundNodes[soundId] = { gain, nodes: [noise, filter, lfo, lfoGain] };
    } else if (soundId === "forest") {
      // 森林 = 粉噪音 + 随机鸟鸣
      const noise = ctx.createBufferSource();
      noise.buffer = createNoiseBuffer(ctx, "pink");
      noise.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 1200;
      filter.Q.value = 0.5;
      noise.connect(filter).connect(gain);
      noise.start();
      // 随机鸟鸣
      const birdInterval = setInterval(() => {
        if (!soundNodes[soundId]) return;
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = "sine";
        const baseFreq = 1500 + Math.random() * 2000;
        osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * (1 + Math.random() * 0.3), ctx.currentTime + 0.1);
        oscGain.gain.setValueAtTime(0, ctx.currentTime);
        oscGain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 0.02);
        oscGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.connect(oscGain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      }, 2000 + Math.random() * 3000);
      soundNodes[soundId] = { gain, nodes: [noise, filter], interval: birdInterval };
    } else if (soundId === "stream") {
      // 溪流 = 白噪音 + 带通滤波 + 中频
      const noise = ctx.createBufferSource();
      noise.buffer = createNoiseBuffer(ctx, "white");
      noise.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 600;
      filter.Q.value = 1.5;
      const filter2 = ctx.createBiquadFilter();
      filter2.type = "lowpass";
      filter2.frequency.value = 1500;
      noise.connect(filter).connect(filter2).connect(gain);
      noise.start();
      // 轻微频率漂移
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.frequency.value = 0.3;
      lfoGain.gain.value = 200;
      lfo.connect(lfoGain).connect(filter.frequency);
      lfo.start();
      soundNodes[soundId] = { gain, nodes: [noise, filter, filter2, lfo, lfoGain] };
    } else if (soundId === "whitenoise") {
      // 白噪音
      const noise = ctx.createBufferSource();
      noise.buffer = createNoiseBuffer(ctx, "white");
      noise.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 6000;
      noise.connect(filter).connect(gain);
      noise.start();
      soundNodes[soundId] = { gain, nodes: [noise, filter] };
    } else if (soundId === "thunder") {
      // 雷雨 = 雨声底 + 随机雷声
      const noise = ctx.createBufferSource();
      noise.buffer = createNoiseBuffer(ctx, "white");
      noise.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 3000;
      noise.connect(filter).connect(gain);
      noise.start();
      // 随机雷声
      const thunderInterval = setInterval(() => {
        if (!soundNodes[soundId]) return;
        const tNoise = ctx.createBufferSource();
        tNoise.buffer = createNoiseBuffer(ctx, "brown");
        const tGain = ctx.createGain();
        const tFilter = ctx.createBiquadFilter();
        tFilter.type = "lowpass";
        tFilter.frequency.value = 400;
        tGain.gain.setValueAtTime(0, ctx.currentTime);
        tGain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.1);
        tGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
        tNoise.connect(tFilter).connect(tGain).connect(ctx.destination);
        tNoise.start();
        tNoise.stop(ctx.currentTime + 1.5);
      }, 8000 + Math.random() * 12000);
      soundNodes[soundId] = { gain, nodes: [noise, filter], interval: thunderInterval };
    }
  }

  function stopSound(soundId) {
    const sn = soundNodes[soundId];
    if (!sn) return;
    if (sn.interval) clearInterval(sn.interval);
    sn.nodes.forEach(n => {
      try { if (n.stop) n.stop(); } catch (e) {}
      try { n.disconnect(); } catch (e) {}
    });
    delete soundNodes[soundId];
  }

  function isSoundPlaying(soundId) {
    return !!soundNodes[soundId];
  }

  function toggleSound(soundId) {
    if (isSoundPlaying(soundId)) {
      stopSound(soundId);
    } else {
      startSound(soundId);
    }
    renderSoundGrid();
    updateSoundBarBtn();
  }

  function setSoundVolume(soundId, vol) {
    soundVolumes[soundId] = vol;
    if (soundNodes[soundId]) {
      soundNodes[soundId].gain.gain.value = vol;
    }
  }

  function updateSoundBarBtn() {
    const btn = document.getElementById("soundBarBtn");
    const anyPlaying = Object.keys(soundNodes).length > 0;
    btn.classList.toggle("playing", anyPlaying);
  }

  function renderSoundGrid() {
    const grid = document.getElementById("soundGrid");
    grid.innerHTML = "";
    SOUND_LIST.forEach(s => {
      const playing = isSoundPlaying(s.id);
      const vol = soundVolumes[s.id] !== undefined ? soundVolumes[s.id] : 0.5;
      const item = document.createElement("div");
      item.className = "sound-item" + (playing ? " active" : "");
      item.innerHTML = `
        <div class="sound-item-left">
          <span class="sound-icon">${s.icon}</span>
          <span class="sound-name">${s.name}</span>
        </div>
        <div class="sound-toggle"></div>
      `;
      item.addEventListener("click", (e) => {
        if (e.target.tagName === "INPUT") return;
        toggleSound(s.id);
      });
      grid.appendChild(item);

      // 音量行
      const volRow = document.createElement("div");
      volRow.className = "sound-volume-row";
      volRow.innerHTML = `<span style="font-size:12px;opacity:0.6">🔈</span><input type="range" min="0" max="1" step="0.05" value="${vol}" data-sound="${s.id}"><span style="font-size:12px;opacity:0.6">🔊</span>`;
      const slider = volRow.querySelector("input");
      slider.addEventListener("input", (e) => {
        e.stopPropagation();
        setSoundVolume(s.id, parseFloat(e.target.value));
      });
      slider.addEventListener("click", (e) => e.stopPropagation());
      grid.appendChild(volRow);
    });

    // ====== 自定义音频区域 ======
    const divider = document.createElement("div");
    divider.className = "sound-divider";
    grid.appendChild(divider);

    const label = document.createElement("div");
    label.className = "custom-section-label";
    label.textContent = "自定义音频";
    grid.appendChild(label);

    // 上传按钮
    const uploadRow = document.createElement("div");
    uploadRow.className = "custom-upload-row";
    uploadRow.innerHTML = `
      <span class="upload-icon">📂</span>
      <div class="upload-text"><span class="placeholder">点击上传音频文件（mp3/wav/ogg/m4a…）</span></div>
      <span style="font-size:18px;opacity:0.6">＋</span>
    `;
    uploadRow.addEventListener("click", () => {
      document.getElementById("customAudioInput").click();
    });
    grid.appendChild(uploadRow);

    // 已上传的自定义音频列表
    customAudioMeta.forEach(m => {
      const playing = isSoundPlaying(m.id);
      const vol = soundVolumes[m.id] !== undefined ? soundVolumes[m.id] : 0.5;
      const hasBuffer = !!customAudioBuffers[m.id];
      const item = document.createElement("div");
      item.className = "custom-item" + (playing ? " active" : "");
      item.innerHTML = `
        <div class="custom-item-left">
          <span class="sound-icon">🎵</span>
          <span class="sound-name">${m.name}${hasBuffer ? "" : "（需重新上传）"}</span>
        </div>
        <div class="custom-item-actions">
          <div class="sound-toggle"></div>
          <button class="custom-delete-btn" title="删除">×</button>
        </div>
      `;
      // 点击播放/暂停
      item.addEventListener("click", (e) => {
        if (e.target.classList.contains("custom-delete-btn")) return;
        if (e.target.tagName === "INPUT") return;
        if (!hasBuffer) { showToast("请重新上传此音频文件"); return; }
        toggleCustomSound(m.id);
      });
      // 删除按钮
      item.querySelector(".custom-delete-btn").addEventListener("click", (e) => {
        e.stopPropagation();
        deleteCustomSound(m.id);
      });
      grid.appendChild(item);

      // 音量行
      const volRow = document.createElement("div");
      volRow.className = "sound-volume-row";
      volRow.innerHTML = `<span style="font-size:12px;opacity:0.6">🔈</span><input type="range" min="0" max="1" step="0.05" value="${vol}"><span style="font-size:12px;opacity:0.6">🔊</span>`;
      const slider = volRow.querySelector("input");
      slider.addEventListener("input", (e) => {
        e.stopPropagation();
        setSoundVolume(m.id, parseFloat(e.target.value));
      });
      slider.addEventListener("click", (e) => e.stopPropagation());
      grid.appendChild(volRow);
    });
  }

  function toggleSoundPanel(e) {
    if (e) e.stopPropagation();
    const overlay = document.getElementById("soundOverlay");
    if (overlay.classList.contains("active")) {
      closeSoundPanel();
    } else {
      renderSoundGrid();
      overlay.classList.add("active");
    }
  }
  function closeSoundPanel() {
    document.getElementById("soundOverlay").classList.remove("active");
  }

  // ========== 自定义音频文件 ==========
  // 使用自定义ID前缀区分，自定义声音ID以 "custom_" 开头
  const customAudioBuffers = {}; // { customId: AudioBuffer }
  const customAudioMeta = JSON.parse(localStorage.getItem("custom_audio_meta") || "[]"); // [{id, name}]

  function handleAudioUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    // 校验文件类型
    if (!file.type.startsWith("audio/") && !/\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(file.name)) {
      showToast("请选择音频文件");
      return;
    }
    const ctx = ensureAudioCtx();
    const reader = new FileReader();
    reader.onload = function(e) {
      ctx.decodeAudioData(e.target.result, function(buffer) {
        const customId = "custom_" + Date.now();
        const displayName = file.name.length > 20 ? file.name.substring(0, 18) + "…" : file.name;
        customAudioBuffers[customId] = buffer;
        customAudioMeta.push({ id: customId, name: displayName });
        localStorage.setItem("custom_audio_meta", JSON.stringify(customAudioMeta));
        renderSoundGrid();
        showToast("音频已添加：" + displayName);
      }, function() {
        showToast("音频解码失败，请换一个文件");
      });
    };
    reader.onerror = function() { showToast("文件读取失败"); };
    reader.readAsArrayBuffer(file);
    // 清空input以便重复上传同一文件
    event.target.value = "";
  }

  function startCustomSound(customId) {
    const ctx = ensureAudioCtx();
    const buffer = customAudioBuffers[customId];
    if (!buffer) { showToast("音频数据丢失，请重新上传"); return; }
    const gain = ctx.createGain();
    const vol = soundVolumes[customId] !== undefined ? soundVolumes[customId] : 0.5;
    gain.gain.value = vol;
    gain.connect(ctx.destination);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    source.connect(gain);
    source.start();
    soundNodes[customId] = { gain, nodes: [source], isCustom: true };
  }

  function deleteCustomSound(customId) {
    stopSound(customId);
    delete customAudioBuffers[customId];
    const idx = customAudioMeta.findIndex(m => m.id === customId);
    if (idx >= 0) customAudioMeta.splice(idx, 1);
    localStorage.setItem("custom_audio_meta", JSON.stringify(customAudioMeta));
    renderSoundGrid();
    updateSoundBarBtn();
    showToast("已删除自定义音频");
  }

  function toggleCustomSound(customId) {
    if (isSoundPlaying(customId)) {
      stopSound(customId);
    } else {
      startCustomSound(customId);
    }
    renderSoundGrid();
    updateSoundBarBtn();
  }

  // 停止所有声音
  function stopAllSounds() {
    Object.keys(soundNodes).forEach(id => stopSound(id));
    updateSoundBarBtn();
  }

  // ========== Toast ==========
  function showToast(msg) {
    let toast = document.querySelector(".toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.className = "toast";
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = "1";
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => { toast.style.opacity = "0"; }, 2500);
  }

  // ========== 漂浮粒子 ==========
  function createParticles() {
    const container = document.getElementById("particles");
    for (let i = 0; i < 15; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * 100 + "%";
      p.style.animationDuration = (15 + Math.random() * 20) + "s";
      p.style.animationDelay = -Math.random() * 20 + "s";
      p.style.opacity = 0.2 + Math.random() * 0.3;
      const size = 2 + Math.random() * 4;
      p.style.width = size + "px";
      p.style.height = size + "px";
      container.appendChild(p);
    }
  }

  // ========== 初始化 ==========
  renderQuote();
  renderEvents();
  updateRecordsDisplay();
  createParticles();
</script>
</body>
