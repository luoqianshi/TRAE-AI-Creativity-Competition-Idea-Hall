<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星夜 · 深夜失眠打卡</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg0: #0b0f2a;
  --bg1: #1a1245;
  --bg2: #2a1b5e;
  --card-bg: rgba(26, 18, 69, 0.75);
  --card-border: rgba(255, 210, 122, 0.18);
  --text: #e8e8f0;
  --muted: #9a9abd;
  --accent: #ffd27a;
  --accent2: #ffb56b;
  --pink: #f06d92;
  --shadow: 0 10px 30px rgba(0,0,0,0.4);
}
html, body {
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  color: var(--text);
  background: radial-gradient(ellipse at top, var(--bg2), var(--bg0));
  overflow: hidden;
  font-size: 15px;
  line-height: 1.55;
}

/* ========= 星空背景 ========= */
.stars {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.85), transparent),
    radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 90px 40px, rgba(255,210,122,0.8), transparent),
    radial-gradient(1.5px 1.5px at 160px 120px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 200px 50px, rgba(125,211,252,0.6), transparent),
    radial-gradient(1px 1px at 260px 160px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 310px 80px, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 360px 200px, rgba(255,210,122,0.7), transparent);
  background-size: 400px 300px;
  animation: drift 120s linear infinite;
}
.stars2 {
  background-size: 600px 450px;
  animation-duration: 180s;
  opacity: 0.5;
}
@keyframes drift {
  from { transform: translate(0, 0); }
  to { transform: translate(-400px, -300px); }
}

/* ========= APP 布局 ========= */
.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 560px;
  margin: 0 auto;
  background: linear-gradient(180deg, rgba(26,18,69,0.6) 0%, rgba(11,15,42,0.85) 100%);
  box-shadow: var(--shadow);
}

.app-header {
  padding: 16px 18px 12px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  background: rgba(11,15,42,0.6);
  backdrop-filter: blur(6px);
}
.app-title {
  font-size: 20px; font-weight: 700; color: var(--accent);
  letter-spacing: 1px;
}
.app-greet { font-size: 13px; color: var(--muted); }

.pages {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px 80px;
  scroll-behavior: smooth;
}
.page {
  display: none;
  animation: fadeIn 0.35s ease;
}
.page.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========= 卡片 & 按钮 ========= */
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 18px 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  backdrop-filter: blur(8px);
}
.card h2 { font-size: 17px; color: var(--accent); margin-bottom: 6px; }
.card h3 { font-size: 14px; color: var(--accent2); margin: 12px 0 8px; }
.card p, .card label, .card input, .card select, .card textarea { font-size: 14px; }
.muted { color: var(--muted); font-size: 13px; margin-bottom: 10px; }

.btn-primary {
  display: inline-block;
  background: linear-gradient(135deg, #ffd27a, #f06d92);
  border: none; color: #2a1b5e; font-weight: 700;
  padding: 12px 22px; border-radius: 14px;
  cursor: pointer; font-size: 14px;
  transition: transform 0.1s ease, box-shadow 0.2s ease;
  box-shadow: 0 6px 16px rgba(255, 210, 122, 0.35);
}
.btn-primary:hover { transform: translateY(-1px); }
.btn-primary:active { transform: translateY(0); }
.btn-primary.btn-block { display: block; width: 100%; margin-top: 8px; }
.btn-primary.btn-secondary {
  background: linear-gradient(135deg, #7dd3fc, #b794f4);
  color: #0f0c29;
}

.btn-ghost {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
}
.btn-ghost:hover { background: rgba(255,255,255,0.14); }
.btn-small { padding: 6px 12px; font-size: 12px; }

/* ========= Hero ========= */
.hero-card {
  background: linear-gradient(135deg, rgba(125, 211, 252, 0.18), rgba(255, 181, 107, 0.15));
  border: 1px solid rgba(255, 210, 122, 0.25);
  border-radius: 20px;
  padding: 20px 18px;
  margin-bottom: 14px;
  text-align: center;
}
.hero-card h1 { font-size: 22px; color: var(--accent); margin-bottom: 4px; }
.hero-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.quote {
  background: rgba(0,0,0,0.25);
  padding: 14px;
  border-radius: 14px;
  text-align: left;
  border: 1px dashed rgba(255,255,255,0.1);
}
.quote-text { font-size: 14px; color: var(--text); line-height: 1.6; }
.quote-author { font-size: 12px; color: var(--accent); margin-top: 6px; text-align: right; }

/* ========= 打卡表单 ========= */
.reason-grid {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin: 10px 0 12px;
}
.reason-chip {
  padding: 7px 14px; border-radius: 999px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 13px; color: var(--text);
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex; align-items: center; gap: 4px;
}
.reason-chip:hover { background: rgba(255,210,122,0.15); }
.reason-chip.active {
  background: linear-gradient(135deg, #ffd27a, #f06d92);
  color: #2a1b5e; font-weight: 600;
  border-color: transparent;
}
.reason-chip.custom { border-color: rgba(125,211,252,0.4); color: #9cdcfe; }
.reason-chip .del-chip {
  font-size: 11px; color: #ffb3b3; margin-left: 4px;
}

.custom-reason {
  display: flex; gap: 8px; margin: 8px 0 10px;
}
.custom-reason input { flex: 1; }

.row {
  display: flex; align-items: center; gap: 8px;
  margin: 8px 0;
  flex-wrap: wrap;
}
.row > label {
  color: var(--muted); font-size: 13px; min-width: 70px;
}
.row input, .row select {
  flex: 1;
  min-width: 120px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 10px;
  outline: none;
}
.row input:focus, .row select:focus { border-color: var(--accent); }
input[type="text"], input[type="number"], textarea, select {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 10px;
  outline: none;
  margin: 6px 0;
  font-family: inherit;
}
textarea { resize: vertical; min-height: 80px; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }

.switch { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--accent2); font-size: 13px; }
.switch input { accent-color: var(--accent); width: auto; min-width: auto; margin: 0; }

.msg { margin-top: 10px; font-size: 13px; min-height: 1.2em; color: var(--accent); }

/* ========= 小统计卡 ========= */
.small-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 12px 10px;
}
.stat {
  text-align: center;
  padding: 8px 4px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
}
.stat-num {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}
.stat-label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

/* ========= 柱状图 & 原因分布 ========= */
.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 120px;
  padding: 10px 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.bar-item { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.bar {
  width: 70%;
  background: linear-gradient(180deg, #ffd27a, #f06d92);
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  transition: height 0.4s ease;
}
.bar-label { font-size: 10px; color: var(--muted); margin-top: 6px; white-space: nowrap; }

.reason-list { margin-top: 8px; }
.reason-row {
  display: flex; align-items: center; gap: 8px;
  margin: 6px 0;
  font-size: 13px;
}
.reason-row .rname { width: 120px; color: var(--muted); font-size: 12px; }
.reason-row .rbar {
  flex: 1; height: 8px;
  background: rgba(255,255,255,0.05);
  border-radius: 4px;
  overflow: hidden;
}
.reason-row .rbar-fill {
  height: 100%;
  background: linear-gradient(90deg, #ffd27a, #f06d92);
  border-radius: 4px;
  transition: width 0.4s ease;
}
.reason-row .rnum { width: 30px; text-align: right; color: var(--accent); font-size: 12px; }

/* ========= 最近打卡列表 ========= */
.recent-list { margin-top: 4px; }
.recent-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,0.04);
}
.recent-item .content { flex: 1; }
.recent-item .tags { font-size: 13px; color: var(--text); margin-bottom: 4px; }
.recent-item .tags span { margin-right: 10px; color: var(--accent2); }
.recent-item .time { font-size: 11px; color: var(--muted); }
.del-btn {
  background: rgba(255,107,107,0.15);
  color: #ffb3b3;
  border: 1px solid rgba(255,107,107,0.25);
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
}

/* ========= 地图 ========= */
.map-wrap {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 18px;
  padding: 10px;
  margin-bottom: 14px;
}
.leaflet-map {
  width: 100%;
  height: 360px;
  border-radius: 14px;
  overflow: hidden;
  background: linear-gradient(135deg, rgba(28,30,72,0.8), rgba(14,16,40,0.9));
}
.map-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px;
}
.light-dot {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffd27a 0%, #ffb56b 45%, rgba(255,181,107,0.2) 80%, transparent 100%);
  box-shadow: 0 0 14px #ffb56b, 0 0 28px rgba(255,181,107,0.6);
  animation: pulse 2.2s ease-in-out infinite;
}
.light-dot.mine {
  background: radial-gradient(circle, #7dd3fc 0%, #7dd3fc 45%, rgba(125,211,252,0.2) 80%, transparent 100%);
  box-shadow: 0 0 14px #7dd3fc, 0 0 32px rgba(125,211,252,0.7);
  width: 22px; height: 22px;
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.85; }
}
.leaflet-container { background: #0e1230 !important; }
.leaflet-control-zoom a {
  background: rgba(26, 18, 69, 0.85) !important;
  color: #ffd27a !important;
  border: 1px solid rgba(255,255,255,0.15) !important;
}
.leaflet-popup-content-wrapper, .leaflet-popup-tip {
  background: rgba(26, 18, 69, 0.95) !important;
  color: #eee !important;
  border: 1px solid rgba(255,181,107,0.35);
}
.leaflet-popup-content { font-size: 13px; line-height: 1.5; }
.leaflet-popup-content b { color: #ffb56b; }

/* ========= 聊天列表 ========= */
.chat-list { margin-top: 6px; }
.chat-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.04);
  transition: background 0.15s ease;
}
.chat-item:hover { background: rgba(255,210,122,0.08); }
.chat-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, #ffd27a, #f06d92);
  display: flex; align-items: center; justify-content: center;
  color: #2a1b5e; font-weight: 700; font-size: 15px;
  flex-shrink: 0;
}
.chat-body-inner { flex: 1; min-width: 0; }
.chat-name { font-size: 14px; color: var(--accent); font-weight: 600; }
.chat-reason { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ========= 聊天弹窗 ========= */
.chat-modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(10, 12, 35, 0.75);
  backdrop-filter: blur(8px);
  display: flex; justify-content: center; align-items: flex-end;
  z-index: 1000;
}
.chat-panel {
  width: 100%; max-width: 560px;
  height: 80vh;
  background: linear-gradient(160deg, rgba(28,30,72,0.98), rgba(14,16,40,0.98));
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px 22px 0 0;
  display: flex; flex-direction: column;
  overflow: hidden;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  color: #eee;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.chat-header {
  padding: 14px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(255,255,255,0.02);
}
.chat-title { font-size: 16px; font-weight: 600; color: var(--accent); }
.chat-header > div { display: flex; align-items: center; gap: 10px; }
.chat-sub { font-size: 12px; color: var(--muted); }
.chat-body {
  flex: 1; overflow-y: auto;
  padding: 16px; display: flex; flex-direction: column; gap: 10px;
}
.chat-msg {
  display: flex; flex-direction: column; max-width: 78%;
  font-size: 14px; line-height: 1.55;
}
.chat-msg .meta { font-size: 11px; color: #8f92b0; margin-bottom: 3px; }
.chat-msg.mine { align-self: flex-end; align-items: flex-end; }
.chat-msg.mine .meta { color: var(--accent); }
.chat-msg.other { align-self: flex-start; }
.chat-msg .bubble {
  padding: 10px 14px; border-radius: 14px;
  word-break: break-word;
}
.chat-msg.mine .bubble {
  background: linear-gradient(135deg, #ffd27a, #f06d92);
  color: #2a1b5e;
  font-weight: 500;
  border-bottom-right-radius: 4px;
}
.chat-msg.other .bubble {
  background: rgba(255,255,255,0.08);
  color: #eee; border-bottom-left-radius: 4px;
  border: 1px solid rgba(255,255,255,0.06);
}
.chat-input {
  padding: 12px 14px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; gap: 10px; align-items: flex-end;
  background: rgba(0,0,0,0.2);
}
.chat-input textarea {
  flex: 1; margin: 0; padding: 10px 12px; min-height: 40px; max-height: 120px;
}
.chat-input .btn-primary { padding: 10px 18px; }

.hidden { display: none !important; }

/* ========= 日记 ========= */
.diary-list { margin-top: 6px; }
.diary-item {
  padding: 12px 14px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
  margin-bottom: 10px;
}
.diary-item .time { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* ========= 漂流瓶卡片 ========= */
.bottle-card {
  background: linear-gradient(135deg, rgba(125,211,252,0.12), rgba(255,210,122,0.1));
  border: 1px solid rgba(255,210,122,0.3);
  padding: 16px;
  border-radius: 14px;
  margin-top: 10px;
  font-size: 14px;
  line-height: 1.6;
  animation: fadeIn 0.5s ease;
}
.bottle-count { text-align: center; margin-top: 10px; font-size: 12px; }

/* ========= 底部导航 ========= */
.tabbar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: rgba(11,15,42,0.92);
  border-top: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index: 10;
}
.tab {
  background: transparent;
  border: none;
  padding: 6px 4px;
  cursor: pointer;
  color: var(--muted);
  display: flex; flex-direction: column; align-items: center;
  gap: 2px;
  transition: all 0.15s ease;
  border-radius: 10px;
}
.tab:hover { background: rgba(255,255,255,0.04); }
.tab.active { color: var(--accent); }
.tab.active .tab-icon { transform: scale(1.1); }
.tab-icon {
  font-size: 20px;
  line-height: 1;
  transition: transform 0.2s ease;
}
.tab-label {
  font-size: 11px;
  font-weight: 500;
}

/* ========= 小屏优化 ========= */
@media (max-width: 480px) {
  .app { max-width: 100%; }
  .chat-panel { height: 85vh; }
  .card { padding: 16px 14px; }
}
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="stars stars2"></div>

  <div class="app">
    <header class="app-header">
      <div class="app-title" id="pageTitle">星夜</div>
      <div class="app-greet" id="greeting">深夜好</div>
    </header>

    <main class="pages">
      <!-- 首页：打卡 -->
      <section class="page" data-page="home">
        <div class="hero-card">
          <h1>🌙 星夜</h1>
          <p class="sub" id="greeting2">这里属于每一个睡不着的你</p>
          <div class="quote">
            <p class="quote-text" id="quoteText">加载一句温柔的话...</p>
            <p class="quote-author" id="quoteAuthor"></p>
            <button id="refreshQuote" class="btn-ghost btn-small">换一句</button>
          </div>
        </div>

        <div class="card">
          <h2>💤 今日打卡</h2>
          <p class="muted">选择你睡不着的原因，打个卡吧～</p>
          <div class="reason-grid" id="reasonGrid"></div>
          <div class="custom-reason">
            <input type="text" id="customReasonInput" placeholder="+ 添加你自己的失眠原因..." maxlength="30" />
            <button id="addReasonBtn" class="btn-ghost btn-small">添加</button>
          </div>

          <div class="row">
            <label>心情</label>
            <select id="mood">
              <option>平静</option>
              <option>有点焦虑</option>
              <option>emo</option>
              <option>烦躁</option>
              <option>兴奋</option>
              <option>一般</option>
            </select>
          </div>
          <div class="row">
            <label>昵称</label>
            <input type="text" id="nickname" maxlength="20" placeholder="深夜的陌生人" />
          </div>
          <div class="row">
            <label>位置</label>
            <label class="switch">
              <input type="checkbox" id="shareLoc" checked />
              <span>点亮地图</span>
            </label>
            <span id="locStatus" class="muted small">未定位</span>
            <button id="btnLocate" class="btn-ghost btn-small">定位</button>
          </div>
          <div class="row">
            <label>预计躺平多久（小时）</label>
            <input type="number" id="hours" min="0" max="24" step="0.5" placeholder="例如 2.5" />
          </div>
          <button id="checkinBtn" class="btn-primary btn-block">✨ 打卡一下</button>
          <p id="checkinMsg" class="msg"></p>
        </div>

        <div class="card small-stats">
          <div class="stat"><span class="stat-num" id="totalNum">0</span><span class="stat-label">累计</span></div>
          <div class="stat"><span class="stat-num" id="avgHours">0</span><span class="stat-label">平均时长</span></div>
          <div class="stat"><span class="stat-num" id="weekNum">0</span><span class="stat-label">本周</span></div>
        </div>

        <div class="card">
          <h2>📅 最近打卡</h2>
          <div id="recentList" class="recent-list"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
/* ========================================================================

(function () {

  const STORAGE_KEYS = {

    { text: '深呼吸，把所有的烦恼都留在这个深夜。', author: '星夜' }
  ];

  const defaultBottles = [

  ];

  const autoReplyTemplates = [

  // 预设种子数据：全国主要城市打卡光点
  const defaultCities = [
    { name: '北京', lat: 39.9042, lng: 116.4074 },
    { name: '上海', lat: 31.2304, lng: 121.4737 },
    { name: '广州', lat: 23.1291, lng: 113.2644 },

    { name: '厦门', lat: 24.4798, lng: 118.0894 },
    { name: '哈尔滨', lat: 45.8038, lng: 126.5349 },
    { name: '沈阳', lat: 41.8057, lng: 123.4315 },
    { name: '郑州', lat: 34.7466, lng: 113.6253 },
    { name: '合肥', lat: 31.8206, lng: 117.2272 },
    { name: '福州', lat: 26.0745, lng: 119.2965 },
    { name: '济南', lat: 36.6512, lng: 117.1201 },
    { name: '昆明', lat: 25.0389, lng: 102.7183 },
    { name: '大理', lat: 25.6066, lng: 100.2679 },
    { name: '丽江', lat: 26.8552, lng: 100.2271 },
    { name: '三亚', lat: 18.2528, lng: 109.5119 },
    { name: '乌鲁木齐', lat: 43.8256, lng: 87.6168 },
    { name: '拉萨', lat: 29.6500, lng: 91.1000 },
    { name: '呼和浩特', lat: 40.8426, lng: 111.7511 },
    { name: '兰州', lat: 36.0611, lng: 103.8343 },
    { name: '太原', lat: 37.8706, lng: 112.5489 }
  ];

  const seedNicknames = ['深夜的猫头鹰', '月亮守望者', '星空旅人', '失眠的鱼', '夜猫子', '夜行诗人', '月光收集家', '不眠的萤火虫'];
  const moods = ['平静', '有点焦虑', 'emo', '烦躁', '兴奋'];

  // 本地存储读写
  function getList(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function setList(key, data) {
    try {
      localStorage.setItem(key, JSON.stringify(data));
    } catch (e) { /* ignore */ }
  }

  // 为首次体验注入种子数据
  function seedIfEmpty() {
    if (!getList(STORAGE_KEYS.checkins)) {
      const now = Date.now();
      const seed = defaultCities.map((c, idx) => {
        const lat = c.lat + (Math.random() - 0.5) * 0.6;
        const lng = c.lng + (Math.random() - 0.5) * 0.6;
        return {
          id: 'seed_' + idx,
          reason: defaultReasons[Math.floor(Math.random() * defaultReasons.length)],
          mood: moods[Math.floor(Math.random() * moods.length)],
          hours: Math.round(Math.random() * 30) / 10,
          from: seedNicknames[Math.floor(Math.random() * seedNicknames.length)],
          lat: +lat.toFixed(6),
          lng: +lng.toFixed(6),
          time: new Date(now - Math.floor(Math.random() * 1000 * 60 * 60 * 24 * 3)).toISOString()
        };
      });
      setList(STORAGE_KEYS.checkins, seed);
    }
    if (!getList(STORAGE_KEYS.bottles)) {
      const now = Date.now();
      setList(STORAGE_KEYS.bottles, defaultBottles.map((text, i) => ({
        id: 'seed_bottle_' + i,
        content: text,
        from: seedNicknames[i % seedNicknames.length],
        time: new Date(now - Math.random() * 1000 * 60 * 60 * 48).toISOString()
      })));
    }
    if (!getList(STORAGE_KEYS.diaries)) setList(STORAGE_KEYS.diaries, []);
    if (!getList(STORAGE_KEYS.reasons)) setList(STORAGE_KEYS.reasons, []);
    if (!getList(STORAGE_KEYS.messages)) setList(STORAGE_KEYS.messages, []);
  }
  seedIfEmpty();

  // ========== 2. 模拟 API ==========
  // 返回 Promise，模拟异步请求
  function mockAPI(path, options) {
    return new Promise((resolve) => {
      // 模拟网络延迟
      setTimeout(() => {
        const method = (options && options.method) || 'GET';
        const body = (options && options.body) ? (typeof options.body === 'string' ? JSON.parse(options.body) : options.body) : {};

        // 路由
        if (path === '/api/hello') {
          return resolve({ message: '深夜好！这里是失眠打卡服务', time: new Date().toISOString() });
        }

        if (path === '/api/quote') {
          return resolve(encouragingQuotes[Math.floor(Math.random() * encouragingQuotes.length)]);
        }

        if (path === '/api/reasons') {
          if (method === 'POST') {
            const clean = String(body.text || '').trim();
            if (!clean) return resolve({ _error: '原因不能为空' });
            if (clean.length > 30) return resolve({ _error: '原因太长啦（最多30字）' });
            const custom = getList(STORAGE_KEYS.reasons) || [];
            if (custom.some(c => c.text === clean) || defaultReasons.includes(clean)) {
              return resolve({ _error: '已经有这个原因啦～' });
            }
            const entry = { id: Date.now().toString(), text: clean, time: new Date().toISOString() };
            custom.push(entry);
            setList(STORAGE_KEYS.reasons, custom);
            return resolve({ ok: true, entry });
          }
          if (method === 'DELETE') {
            const id = path.split('/').pop(); // not used
            return resolve({ ok: true });
          }
          const custom = getList(STORAGE_KEYS.reasons) || [];
          return resolve({ reasons: [...defaultReasons, ...custom.map(c => c.text)], defaultReasons, customReasons: custom });
        }

        // reasons delete
        if (path.startsWith('/api/reasons/')) {
          const id = path.substring('/api/reasons/'.length);
          const custom = getList(STORAGE_KEYS.reasons) || [];
          setList(STORAGE_KEYS.reasons, custom.filter(c => c.id !== id));
          return resolve({ ok: true });
        }

        if (path === '/api/checkin' && method === 'POST') {
          if (!body.reason) return resolve({ _error: '请选择失眠原因' });
          const checkins = getList(STORAGE_KEYS.checkins) || [];
          const record = {
            id: Date.now().toString(),
            reason: body.reason,
            mood: body.mood || '一般',
            hours: typeof body.hours === 'number' ? +body.hours.toFixed(2) : null,
            from: String(body.from || '深夜的陌生人').slice(0, 20),
            lat: typeof body.lat === 'number' ? +body.lat.toFixed(6) : null,
            lng: typeof body.lng === 'number' ? +body.lng.toFixed(6) : null,
            time: new Date().toISOString()
          };
          checkins.unshift(record);
          setList(STORAGE_KEYS.checkins, checkins);
          const quote = encouragingQuotes[Math.floor(Math.random() * encouragingQuotes.length)];
          return resolve({ ok: true, record, quote });
        }

        if (path.startsWith('/api/checkins') && method === 'GET') {
          const checkins = getList(STORAGE_KEYS.checkins) || [];
          // 解析 limit
          const urlObj = new URL('http://x' + path.replace('/api/checkins', ''));
          const limit = urlObj.searchParams.get('limit');
          const n = limit ? parseInt(limit, 10) : checkins.length;
          return resolve({ checkins: checkins.slice(0, n), total: checkins.length });
        }

        if (path === '/api/stats') {
          const checkins = getList(STORAGE_KEYS.checkins) || [];
          const total = checkins.length;
          const reasonMap = {};
          let totalHours = 0; let withHours = 0;
          const today = new Date(); today.setHours(0, 0, 0, 0);
          const weekMap = {};
          for (const c of checkins) {
            reasonMap[c.reason] = (reasonMap[c.reason] || 0) + 1;
            if (typeof c.hours === 'number') { totalHours += c.hours; withHours += 1; }
            const d = new Date(c.time); d.setHours(0, 0, 0, 0);
            const key = d.toISOString().slice(0, 10);
            if ((today - d) / (1000 * 60 * 60 * 24) <= 6) {
              weekMap[key] = (weekMap[key] || 0) + 1;
            }
          }
          const week = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date(today); d.setDate(today.getDate() - i);
            const key = d.toISOString().slice(0, 10);
            week.push({ date: key, count: weekMap[key] || 0 });
          }
          return resolve({
            total,
            avgHours: withHours ? +(totalHours / withHours).toFixed(2) : 0,
            reasonMap, week
          });
        }

        if (path.startsWith('/api/checkins/') && method === 'DELETE') {
          const id = path.substring('/api/checkins/'.length);
          const checkins = (getList(STORAGE_KEYS.checkins) || []).filter(c => c.id !== id);
          setList(STORAGE_KEYS.checkins, checkins);
          return resolve({ ok: true });
        }

        if (path.startsWith('/api/checkins/map') || path.startsWith('/api/nearby')) {
          const checkins = getList(STORAGE_KEYS.checkins) || [];
          const users = getList(STORAGE_KEYS.users) || [];
          const seen = new Set();
          const points = [];

          for (const u of users) {
            if (typeof u.lat !== 'number' || typeof u.lng !== 'number') continue;
            points.push({
              id: 'user_' + u.id, userId: u.id, kind: 'user',
              nickname: u.nickname, lat: u.lat, lng: u.lng,
              time: u.time, reason: '在这里', mood: '平静'
            });
            seen.add(u.id);
          }

          for (const c of checkins) {
            if (typeof c.lat !== 'number' || typeof c.lng !== 'number') continue;
            points.push({
              id: 'ck_' + c.id, kind: 'stranger',
              nickname: c.from, lat: c.lat, lng: c.lng,
              time: c.time, reason: c.reason, mood: c.mood
            });
          }

          // checkins/map 返回带坐标的点；nearby 返回同样结构
          return resolve({ total: points.length, points });
        }

        if (path === '/api/diary') {
          if (method === 'POST') {
            const content = String(body.content || '').trim();
            if (!content) return resolve({ _error: '日记内容不能为空' });
            const diaries = getList(STORAGE_KEYS.diaries) || [];
            const entry = {
              id: Date.now().toString(),
              content: content.slice(0, 1000),
              time: new Date().toISOString()
            };
            diaries.unshift(entry);
            setList(STORAGE_KEYS.diaries, diaries);
            return resolve({ ok: true, entry });
          }
          return resolve({ diaries: getList(STORAGE_KEYS.diaries) || [] });
        }

        if (path === '/api/bottle/throw' && method === 'POST') {
          const clean = String(body.content || '').trim();
          if (!clean) return resolve({ _error: '心事内容不能为空' });
          if (clean.length > 300) return resolve({ _error: '最多300字哦' });
          const bottles = getList(STORAGE_KEYS.bottles) || [];
          const entry = {
            id: Date.now().toString(),
            content: clean,
            from: String(body.from || '深夜的陌生人').slice(0, 20),
            time: new Date().toISOString()
          };
          bottles.push(entry);
          setList(STORAGE_KEYS.bottles, bottles);
          return resolve({ ok: true, bottle: entry, total: bottles.length });
        }

        if (path === '/api/bottle/pick') {
          const bottles = getList(STORAGE_KEYS.bottles) || [];
          if (!bottles.length) {
            const text = defaultBottles[Math.floor(Math.random() * defaultBottles.length)];
            return resolve({ ok: true, bottle: { id: 'default', content: text, from: '月亮', time: new Date().toISOString() }, fromDefault: true });
          }
          const pick = bottles[Math.floor(Math.random() * bottles.length)];
          return resolve({ ok: true, bottle: pick, total: bottles.length });
        }

        if (path === '/api/bottles') {
          const bottles = getList(STORAGE_KEYS.bottles) || [];
          return resolve({ bottles: bottles.slice(-50).reverse(), total: bottles.length });
        }

        if (path === '/api/user/register' && method === 'POST') {
          const users = getList(STORAGE_KEYS.users) || [];
          const id = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          const user = {
            id,
            nickname: String(body.nickname || ('深夜的' + seedNicknames[Math.floor(Math.random()*seedNicknames.length)])).slice(0, 20),
            lat: typeof body.lat === 'number' ? +body.lat.toFixed(6) : null,
            lng: typeof body.lng === 'number' ? +body.lng.toFixed(6) : null,
            time: new Date().toISOString()
          };
          users.push(user);
          setList(STORAGE_KEYS.users, users);
          return resolve({ ok: true, user });
        }

        if (path.startsWith('/api/user/') && path.endsWith('/update') && method === 'POST') {
          const id = path.substring('/api/user/'.length, path.length - '/update'.length);
          const users = getList(STORAGE_KEYS.users) || [];
          const idx = users.findIndex(u => u.id === id);
          if (idx < 0) {
            // 重新注册
            return mockAPI('/api/user/register', { method: 'POST', body });
          }
          if (typeof body.nickname === 'string' && body.nickname.trim()) users[idx].nickname = body.nickname.slice(0, 20);
          if (typeof body.lat === 'number' && typeof body.lng === 'number') {
            users[idx].lat = +body.lat.toFixed(6);
            users[idx].lng = +body.lng.toFixed(6);
          }
          setList(STORAGE_KEYS.users, users);
          return resolve({ ok: true, user: users[idx] });
        }

        if (path.startsWith('/api/user/') && method === 'GET') {
          const id = path.substring('/api/user/'.length);
          const users = getList(STORAGE_KEYS.users) || [];
          const user = users.find(u => u.id === id);
          if (!user) return resolve({ _error: '用户不存在' });
          return resolve({ user });
        }

        if (path === '/api/message/send' && method === 'POST') {
          const text = String(body.content || '').trim();
          if (!text) return resolve({ _error: '内容不能为空' });
          if (text.length > 500) return resolve({ _error: '消息过长（最多 500 字）' });
          const msgs = getList(STORAGE_KEYS.messages) || [];
          const mine = {
            id: 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            fromId: String(body.fromId),
            toId: String(body.toId),
            fromNickname: String(body.fromNickname || '我').slice(0, 20),
            toNickname: String(body.toNickname || '对方').slice(0, 20),
            content: text,
            time: new Date().toISOString(),
            mine: true
          };
          msgs.push(mine);

          const reply = {
            id: 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            fromId: String(body.toId),
            toId: String(body.fromId),
            fromNickname: String(body.toNickname || '对方').slice(0, 20),
            toNickname: String(body.fromNickname || '我').slice(0, 20),
            content: autoReplyTemplates[Math.floor(Math.random() * autoReplyTemplates.length)],
            time: new Date(Date.now() + 1500).toISOString(),
            mine: false
          };
          msgs.push(reply);
          setList(STORAGE_KEYS.messages, msgs);
          return resolve({ ok: true, message: mine, reply });
        }

        if (path.startsWith('/api/messages')) {
          // 解析 query
          const urlObj = new URL('http://x' + path);
          const fromId = urlObj.searchParams.get('fromId');
          const toId = urlObj.searchParams.get('toId');
          const msgs = getList(STORAGE_KEYS.messages) || [];
          if (!fromId || !toId) return resolve({ messages: msgs.slice(-20) });
          const a = String(fromId), b = String(toId);
          const chat = msgs
            .filter(m => (m.fromId === a && m.toId === b) || (m.fromId === b && m.toId === a))
            .sort((x, y) => new Date(x.time) - new Date(y.time))
            .slice(-100);
          return resolve({ total: chat.length, messages: chat });
        }

        // 兜底
        return resolve({ ok: true, _note: 'no match: ' + path });
      }, 120 + Math.random() * 200);
    });
  }

  // 封装 fetchJSON
  function fetchJSON(url, options) {
    // 解析 path（去掉域名和 query 中的 API 前缀）
    let path = url;
    if (path.startsWith('http')) {
      const u = new URL(url);
      path = u.pathname + u.search;
    }
    return mockAPI(path, options).then(data => {
      if (data && data._error) {
        const err = new Error(data._error);
        err.status = 400;
        throw err;
      }
      return data;
    });
  }

  // ========== 3. 前端交互逻辑 ==========
  const PAGE_NAMES = {
    home: '星夜 · 首页',
    map: '今夜地图',
    diary: '失眠日记',
    bottle: '漂流瓶',
    chat: '消息'
  };

  let selectedReason = null;
  let customReasonList = [];
  let userLoc = null;
  let currentUser = null;
  let currentChatTarget = null;
  let myMap = null;
  let markersLayer = null;
  let mapReady = false;

  function $(id) { return document.getElementById(id); }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function setMsg(id, text) {
    const el = $(id);
    if (!el) return;
    el.textContent = text || '';
    if (text) {
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.textContent = ''; }, 4000);
    }
  }

  // ---------- 路由 ----------
  function route() {
    const hash = (location.hash || '#home').replace('#', '');
    const page = PAGE_NAMES[hash] ? hash : 'home';
    document.querySelectorAll('.page').forEach(p => {
      p.classList.toggle('active', p.dataset.page === page);
    });
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.to === page);
    });
    if ($('pageTitle')) $('pageTitle').textContent = PAGE_NAMES[page] || '星夜';
    if (page === 'home') renderReasons();
    if (page === 'map') { ensureMap(); refreshMap(); }
    if (page === 'chat') { refreshNearbyList('chatListBig'); }
    if (page === 'diary') { refreshDiaryList(); }
    if (page === 'bottle') { refreshBottleCount(); }
  }

  // ---------- 首页：名言 & 打卡 ----------
  async function refreshQuote() {
    try {
      const data = await fetchJSON('/api/quote');
      $('quoteText').textContent = data.quote || data.text || '愿你今晚有好梦';
      $('quoteAuthor').textContent = data.author ? ('—— ' + data.author) : '—— 月亮';
    } catch (e) {
      $('quoteText').textContent = '月亮说：放轻松，深呼吸，会好起来的';
    }
  }

  async function renderReasons() {
    const grid = $('reasonGrid');
    if (!grid) return;
    grid.innerHTML = '';
    let list = [];
    try {
      const data = await fetchJSON('/api/reasons');
      if (data && Array.isArray(data.reasons)) list = data.reasons;
      if (data && Array.isArray(data.customReasons)) customReasonList = data.customReasons;
    } catch (e) { /* ignore */ }
    list.forEach(name => {
      const chip = document.createElement('button');
      chip.className = 'reason-chip';
      chip.type = 'button';
      chip.textContent = name;
      chip.onclick = () => {
        grid.querySelectorAll('.reason-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedReason = name;
      };
      grid.appendChild(chip);
    });
    customReasonList.forEach(entry => {
      const chip = document.createElement('button');
      chip.className = 'reason-chip custom';
      chip.type = 'button';
      chip.innerHTML = escapeHtml(entry.text) + '<span class="del-chip" title="删除">×</span>';
      chip.onclick = (ev) => {
        if (ev.target.classList.contains('del-chip')) {
          ev.stopPropagation();
          deleteCustomReason(entry.id);
          return;
        }
        grid.querySelectorAll('.reason-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        selectedReason = entry.text;
      };
      grid.appendChild(chip);
    });
  }

  async function addCustomReason() {
    const input = $('customReasonInput');
    const name = (input.value || '').trim();
    if (!name) return;
    if (name.length > 30) { setMsg('checkinMsg', '原因太长啦（最多 30 字）'); return; }
    try {
      await fetchJSON('/api/reasons', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({ text: name })
      });
      input.value = '';
      renderReasons();
    } catch (e) {
      setMsg('checkinMsg', '添加失败：' + e.message);
    }
  }

  async function deleteCustomReason(id) {
    try {
      await fetchJSON('/api/reasons/' + id, { method: 'DELETE' });
      renderReasons();
    } catch (e) {
      setMsg('checkinMsg', '删除失败：' + e.message);
    }
  }

  async function ensureCurrentUser() {
    if (currentUser) return currentUser;
    try {
      let savedId = localStorage.getItem(STORAGE_KEYS.currentUser);
      let savedNick = localStorage.getItem('xingye_nickname');
      let currentNick = $('nickname') ? ($('nickname').value.trim() || savedNick || '') : '';

      if (!savedId) {
        const data = await fetchJSON('/api/user/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=utf-8' },
          body: JSON.stringify({
            nickname: currentNick || ('深夜的' + seedNicknames[Math.floor(Math.random()*seedNicknames.length)]),
            lat: userLoc ? userLoc.lat : null,
            lng: userLoc ? userLoc.lng : null
          })
        });
        savedId = data.user.id;
        localStorage.setItem(STORAGE_KEYS.currentUser, savedId);
        if (data.user.nickname) localStorage.setItem('xingye_nickname', data.user.nickname);
        currentUser = data.user;
      } else {
        try {
          const data = await fetchJSON('/api/user/' + savedId + '/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({
              nickname: currentNick || undefined,
              lat: userLoc ? userLoc.lat : undefined,
              lng: userLoc ? userLoc.lng : undefined
            })
          });
          currentUser = data.user;
          if (currentUser && currentUser.nickname) localStorage.setItem('xingye_nickname', currentUser.nickname);
        } catch (e) {
          localStorage.removeItem(STORAGE_KEYS.currentUser);
          return ensureCurrentUser();
        }
      }
    } catch (e) { /* 不阻塞 */ }
    return currentUser;
  }

  async function doCheckin() {
    if (!selectedReason) { setMsg('checkinMsg', '请先选择一个原因～'); return; }
    const mood = $('mood') ? $('mood').value : '平静';
    const hours = parseFloat($('hours').value) || 0;
    const shareLoc = $('shareLoc') && $('shareLoc').checked;
    await ensureCurrentUser();
    const body = {
      reason: selectedReason,
      mood: mood,
      hours: hours,
      from: (currentUser && currentUser.nickname) || '深夜的陌生人'
    };
    if (shareLoc && userLoc) {
      body.lat = userLoc.lat; body.lng = userLoc.lng;
    }
    try {
      await fetchJSON('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify(body)
      });
      setMsg('checkinMsg', '打卡成功！✨ 今晚的月亮与你作伴');
      refreshQuote();
      renderRecent();
      renderStats();
    } catch (e) {
      setMsg('checkinMsg', '打卡失败：' + e.message);
    }
  }

  async function renderRecent() {
    const list = $('recentList');
    if (!list) return;
    try {

  async function deleteCheckin(id) {
    if (!confirm('确定删除这条打卡记录吗？')) return;
    try {
      await fetchJSON('/api/checkins/' + id, { method: 'DELETE' });
      renderRecent();
      renderStats();
    } catch (e) {
      setMsg('checkinMsg', '删除失败：' + e.message);
    }
  }

  async function renderStats() {
    try {
      const data = await fetchJSON('/api/stats');
      $('totalNum').textContent = data.total || 0;
      $('avgHours').textContent = data.avgHours ? Number(data.avgHours).toFixed(1) : '0';
      const weekArr = Array.isArray(data.week) ? data.week : [];
      const weekTotal = weekArr.reduce((a, b) => a + (Number(b.count) || 0), 0);
      if ($('weekNum')) $('weekNum').textContent = weekTotal;

      const bar = $('barChart');
      if (bar) {
        const max = Math.max.apply(null, weekArr.map(d => Number(d.count) || 0).concat([1]));
        bar.innerHTML = weekArr.map(d => {
          const h = Math.round(((Number(d.count) || 0) / max) * 100);
          const label = String(d.day || d.date || '').slice(5);
          return '<div class="bar-item"><div class="bar" style="height:' + Math.max(h, 4) + '%"></div><div class="bar-label">' + escapeHtml(label) + '</div></div>';
        }).join('');
      }
      const rlist = $('reasonList');
      if (rlist) {
        let rows = [];
        if (data.reasonMap && typeof data.reasonMap === 'object') {
          rows = Object.keys(data.reasonMap).map(k => ({ reason: k, count: Number(data.reasonMap[k]) || 0 }));
        }
        rows.sort((a, b) => b.count - a.count);
        const total = rows.reduce((a, b) => a + b.count, 0) || 1;
        if (!rows.length) {
          rlist.innerHTML = '<p class="muted">暂无数据</p>';
        } else {
          rlist.innerHTML = rows.slice(0, 8).map(r => {
            const w = Math.round((r.count / total) * 100);
            return '<div class="reason-row"><span class="rname">' + escapeHtml(r.reason) + '</span>' +
                   '<div class="rbar"><div class="rbar-fill" style="width:' + w + '%"></div></div>' +
                   '<span class="rnum">' + r.count + '</span></div>';
          }).join('');
        }
      }
    } catch (e) { /* ignore */ }
  }

  // ---------- 定位 & 地图 ----------
  function doLocate() {
    $('locStatus').textContent = '定位中...';
    const fallback = () => {
      userLoc = { lat: 39.9042 + (Math.random() - 0.5) * 0.3, lng: 116.4074 + (Math.random() - 0.5) * 0.3 };
      $('locStatus').textContent = '使用默认位置体验';
      ensureCurrentUser();
      if (myMap) myMap.flyTo([userLoc.lat, userLoc.lng], 10);
    };
    if (!navigator.geolocation) { fallback(); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        $('locStatus').textContent = '已定位 ' + userLoc.lat.toFixed(3) + ', ' + userLoc.lng.toFixed(3);
        ensureCurrentUser();
        if (myMap) myMap.flyTo([userLoc.lat, userLoc.lng], 10);
      },
      () => fallback(),
      { timeout: 8000, enableHighAccuracy: false }
    );
  }

  async function refreshMap() {
    if (!mapReady) return;
    if (!markersLayer) return;
    try {
      const url = userLoc ? '/api/nearby?lat=' + userLoc.lat + '&lng=' + userLoc.lng + '&radius=30' : '/api/nearby';
      const data = await fetchJSON(url);
      const points = data.points || [];
      markersLayer.clearLayers();
      const myId = currentUser ? currentUser.id : null;
      points.forEach(p => {
        const isMine = myId && p.kind === 'user' && p.userId === myId;
        const icon = L.divIcon({
          className: '',
          html: '<div class="light-dot' + (isMine ? ' mine' : '') + '"></div>',
          iconSize: isMine ? [24, 24] : [18, 18],
          iconAnchor: isMine ? [12, 12] : [9, 9]
        });
        const t = new Date(p.time);
        const popupInfo =
          '<b>' + escapeHtml(p.nickname || '深夜的陌生人') + (isMine ? ' · 这是你 🌙' : '') + '</b><br/>' +
          '原因：' + escapeHtml(p.reason || '-') + '<br/>' +
          '心情：' + escapeHtml(p.mood || '-') + '<br/>' +
          t.toLocaleString('zh-CN', { hour12: false });
        const marker = L.marker([p.lat, p.lng], { icon }).bindPopup(popupInfo);
        marker.on('click', () => { if (!isMine) openChat(p); });
        markersLayer.addLayer(marker);
      });
      $('mapCount').textContent = '今夜有 ' + points.length + ' 个光点在闪烁（蓝色 = 你）';
      refreshNearbyList('nearbyList');
    } catch (e) {
      if ($('mapCount')) $('mapCount').textContent = '光点加载失败：' + e.message;
    }
  }

  // ---------- 附近的人 & 消息列表 ----------
  async function refreshNearbyList(listId) {
    const list = $(listId);
    if (!list) return;
    try {
      const url = '/api/nearby' + (userLoc ? '?lat=' + userLoc.lat + '&lng=' + userLoc.lng + '&radius=30' : '');
      const data = await fetchJSON(url);
      const points = (data.points || []).slice(0, 10);
      if (!points.length) {
        list.innerHTML = '<p class="muted">还没有附近的人，去打个卡吧～</p>';
        return;
      }
      const myId = currentUser ? currentUser.id : null;
      list.innerHTML = points.map(p => {
        const isMine = myId && p.kind === 'user' && p.userId === myId;
        const nick = (p.nickname || '深夜的陌生人') + (isMine ? ' · 这是你' : '');
        return (
          '<div class="chat-item" data-target="' + encodeURIComponent(JSON.stringify(p)) + '">' +
            '<div class="chat-avatar">' + escapeHtml(String(nick).slice(0, 1).toUpperCase()) + '</div>' +
            '<div class="chat-body-inner">' +
              '<div class="chat-name">' + escapeHtml(nick) + '</div>' +
              '<div class="chat-reason">' + escapeHtml(p.reason || '-') + ' · ' + escapeHtml(p.mood || '') + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');
      list.querySelectorAll('.chat-item').forEach(item => {
        item.onclick = () => {
          try {
            const target = JSON.parse(decodeURIComponent(item.dataset.target));

              alert('这是你自己呀 🌙');
            } else {
              openChat(target);

          } catch (e) { /* ignore */ }
        };
      });
    } catch (e) {
      list.innerHTML = '<p class="muted">加载失败：' + escapeHtml(e.message) + '</p>';
    }
  }

  // ---------- 聊天 ----------
  async function openChat(target) {
    currentChatTarget = target;
    $('chatTitle').textContent = target.nickname || '深夜的陌生人';
    $('chatSub').textContent = '心情：' + (target.mood || '-') + ' · 原因：' + (target.reason || '-');
    $('chatBody').innerHTML = '';
    $('chatModal').classList.remove('hidden');
    $('chatText').value = '';

    if (!currentUser) await ensureCurrentUser();
    try {
      const data = await fetchJSON('/api/messages?fromId=' + currentUser.id + '&toId=' + target.id);
      for (const m of (data.messages || [])) appendMessage(m);
    } catch (e) { /* ignore */ }

    const item = document.createElement('div');
    item.className = 'chat-msg other';
    item.innerHTML = '<div class="meta">' + escapeHtml(target.nickname || '陌生人') + '</div>' +
      '<div class="bubble">嗨～我也是今夜没睡的人，想聊聊吗？ 🌙</div>';
    $('chatBody').appendChild(item);
    $('chatBody').scrollTop = $('chatBody').scrollHeight;
    setTimeout(() => $('chatText').focus(), 100);
  }

  function closeChat() {
    $('chatModal').classList.add('hidden');
    currentChatTarget = null;
  }

  function appendMessage(m) {
    if (!currentUser) return;
    const isMine = String(m.fromId) === String(currentUser.id);
    const item = document.createElement('div');
    item.className = 'chat-msg ' + (isMine ? 'mine' : 'other');
    const t = new Date(m.time);
    item.innerHTML =
      '<div class="meta">' + escapeHtml(m.fromNickname || (isMine ? '我' : '对方')) + ' · ' + t.toLocaleTimeString('zh-CN', { hour12: false }) + '</div>' +
      '<div class="bubble">' + escapeHtml(m.content) + '</div>';
    $('chatBody').appendChild(item);
    $('chatBody').scrollTop = $('chatBody').scrollHeight;
  }

  async function sendChatMessage() {
    const textarea = $('chatText');
    const text = (textarea.value || '').trim();
    if (!text || !currentUser || !currentChatTarget) return;
    textarea.value = '';
    const pseudo = {
      id: 'p_' + Date.now(),
      fromId: currentUser.id, toId: currentChatTarget.id,
      fromNickname: currentUser.nickname || '我',
      content: text, time: new Date().toISOString()
    };
    appendMessage(pseudo);
    try {
      const data = await fetchJSON('/api/message/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({
          fromId: currentUser.id, toId: currentChatTarget.id,
          fromNickname: currentUser.nickname || '我',
          toNickname: currentChatTarget.nickname || '陌生人',
          content: text
        })
      });
      if (data && data.reply) {
        setTimeout(() => appendMessage(data.reply), 1200 + Math.random() * 1800);
      }
    } catch (e) {
      const item = document.createElement('div');
      item.className = 'chat-msg other';
      item.innerHTML = '<div class="meta">系统</div><div class="bubble">发送失败：' + escapeHtml(e.message) + '</div>';
      $('chatBody').appendChild(item);
    }
  }

  // ---------- 日记 ----------
  async function saveDiary() {
    const content = ($('diaryInput').value || '').trim();
    if (!content) { setMsg('diaryMsg', '日记内容不能为空～'); return; }
    if (content.length > 2000) { setMsg('diaryMsg', '最多 2000 字'); return; }
    try {
      await fetchJSON('/api/diary', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({ content: content })
      });
      $('diaryInput').value = '';
      setMsg('diaryMsg', '已保存，愿今晚的心事被月亮收藏 ✨');
      refreshDiaryList();
    } catch (e) {
      setMsg('diaryMsg', '保存失败：' + e.message);
    }
  }

  async function refreshDiaryList() {
    const list = $('diaryList');
    if (!list) return;
    try {
      const data = await fetchJSON('/api/diary');
      const items = data.diaries || [];
      if (!items.length) { list.innerHTML = '<p class="muted">还没有日记，写一段心事试试？</p>'; return; }
      list.innerHTML = items.slice(0, 12).map(d => {
        const t = new Date(d.time);
        return '<div class="diary-item"><div>' + escapeHtml(d.content) + '</div>' +
               '<div class="time">' + t.toLocaleString('zh-CN', { hour12: false }) + '</div></div>';
      }).join('');
    } catch (e) {
      list.innerHTML = '<p class="muted">加载失败：' + escapeHtml(e.message) + '</p>';
    }
  }

  // ---------- 漂流瓶 ----------
  async function throwBottle() {
    const from = ($('bottleFrom').value || '').trim() || '深夜的陌生人';
    const content = ($('bottleInput').value || '').trim();
    if (!content) { setMsg('throwMsg', '瓶子里要有心事哦～'); return; }
    try {
      await fetchJSON('/api/bottle/throw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=utf-8' },
        body: JSON.stringify({ from: from, content: content })
      });
      $('bottleInput').value = '';
      setMsg('throwMsg', '瓶子扔进海里了 🌊');
      refreshBottleCount();
    } catch (e) {
      setMsg('throwMsg', '扔失败：' + e.message);
    }
  }
  async function pickBottle() {
    try {
      const data = await fetchJSON('/api/bottle/pick');
      const b = (data && data.bottle && typeof data.bottle === 'object') ? data.bottle : data;
      const picked = $('pickedBottle');
      picked.classList.remove('hidden');
      const t = new Date(b.time || Date.now());
      picked.innerHTML = '<div style="font-size:14px;line-height:1.6;color:#eee;">' + escapeHtml(b.content || '（空瓶子）') +
        '</div><div style="font-size:11px;color:#9a9abd;margin-top:10px;text-align:right;">—— 来自 ' + escapeHtml(b.from || '陌生人') + ' · ' + t.toLocaleString('zh-CN', { hour12: false }) + '</div>';
      refreshBottleCount();
    } catch (e) {
      setMsg('pickMsg', '今天海里没有更多瓶子，试试再扔一个？');
    }
  }
  async function refreshBottleCount() {
    try {
      const data = await fetchJSON('/api/bottles');
      if ($('bottleCount')) $('bottleCount').textContent = '海里此刻有 ' + (data.total || 0) + ' 个心事漂浮着…';
    } catch (e) { /* ignore */ }
  }

  // ---------- 初始化 ----------
  function greet() {
    const h = new Date().getHours();
    let g = '深夜好';
    if (h < 5) g = '这么晚还没睡，抱抱 🌙';
    else if (h < 11) g = '早上好，失眠好点了吗？';
    else if (h < 14) g = '中午好，记得午睡～';
    else if (h < 18) g = '下午好';
    else if (h < 22) g = '晚上好，放轻松';
    else g = '深夜好，辛苦了一天';
    $('greeting').textContent = g;
    if ($('greeting2')) $('greeting2').textContent = g;
  }

  function initEvents() {
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => { location.hash = tab.dataset.to; };
    });
    if ($('refreshQuote')) $('refreshQuote').onclick = refreshQuote;
    if ($('addReasonBtn')) $('addReasonBtn').onclick = addCustomReason;
    if ($('customReasonInput')) $('customReasonInput').addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); addCustomReason(); }
    });
    if ($('checkinBtn')) $('checkinBtn').onclick = doCheckin;
    if ($('btnLocate')) $('btnLocate').onclick = doLocate;

    if ($('diaryBtn')) $('diaryBtn').onclick = saveDiary;
    if ($('throwBtn')) $('throwBtn').onclick = throwBottle;
    if ($('pickBtn')) $('pickBtn').onclick = pickBottle;
    if ($('refreshMap')) $('refreshMap').onclick = refreshMap;
    if ($('chatClose')) $('chatClose').onclick = closeChat;
    if ($('chatSend')) $('chatSend').onclick = sendChatMessage;
    if ($('chatText')) $('chatText').addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); sendChatMessage(); }
    });
    if ($('chatModal')) $('chatModal').addEventListener('click', ev => {
      if (ev.target.id === 'chatModal') closeChat();
    });
  }

  // 首次打开应用
  document.addEventListener('DOMContentLoaded', function () {
    greet();
    initEvents();
    if (!location.hash) location.hash = 'home';
    route();
    refreshQuote();
    renderRecent();
    renderStats();
    if ($('nickname')) {
      const saved = localStorage.getItem('xingye_nickname');
      if (saved) $('nickname').value = saved;
    }
  });
  window.addEventListener('hashchange', route);
})();
  </script>
</body>
</html>
