    /* ====== Layout ====== */

      align-items: center;

      transition: all 0.2s;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

    .nav-section { padding: 0.75rem 0; flex: 1; overflow-y: auto; }

    }

    /* Image Carousel */
    .carousel {

    .carousel-btn.prev { left: 0.75rem; }

      width: 100%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;

    }
    @keyframes modalIn {

    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { font-size: 1.05rem; }
    .modal-close {

    .form-group { margin-bottom: 1rem; }

      align-items: center;
    }
    .tag-input:focus-within { border-color: var(--accent); }

      gap: 0.25rem;

      padding: 1rem;
    }
    .confirm-overlay.active { display: flex; }
    .confirm-box {
      background: var(--bg2);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 1.5rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: modalIn 0.2s;
    }
    .confirm-box .icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .confirm-box h4 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .confirm-box p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .confirm-box .actions { display: flex; gap: 0.6rem; justify-content: center; }

    /* ====== Industry Manager ====== */
    .industry-manager { display: none; }
    .industry-manager.active { display: block; animation: fadeIn 0.3s; }
    .industry-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.875rem 1.25rem;
      background: var(--bg2);

    /* ====== Empty State ====== */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      grid-column: 1 / -1;
    }
    .empty-state .icon { font-size: 3.5rem; margin-bottom: 1rem; opacity: 0.25; }
    .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.4rem; color: var(--ink); }

    /* ====== Toast ====== */
    .toast-container {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .toast {
      padding: 0.7rem 1.25rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      animation: toastIn 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .toast-success { background: var(--accent); color: #fff; }
    .toast-error { background: var(--accent2); color: #fff; }

    /* ====== Responsive ====== */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; max-width: 100%; padding: 1rem; }
      .carousel { width: 100%; height: 220px; }
      .detail-header { flex-direction: column; }
      .form-row { grid-template-columns: 1fr; }
      .cards-grid { grid-template-columns: 1fr; }
    }
    .mobile-toggle {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 200;
      background: var(--bg2);
      border: 1px solid var(--rule);
      color: var(--ink);
      padding: 0.5rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    @media (max-width: 768px) { .mobile-toggle { display: block; } }
  </style>
</head>

        </div>

    ];

    // 初始化：优先使用嵌入的默认数据，除非用户已显式保存过数据
    const savedVersion = localStorage.getItem('dm_data_version');
    const currentVersion = 'v2-36devices';
    let industries, devices;
    if (savedVersion === currentVersion) {
      industries = JSON.parse(localStorage.getItem('dm_industries')) || defaultIndustries;
      devices = JSON.parse(localStorage.getItem('dm_devices')) || defaultDevices;
    } else {
      // 首次加载或数据版本更新：使用嵌入的完整默认数据
      industries = JSON.parse(JSON.stringify(defaultIndustries));
      devices = JSON.parse(JSON.stringify(defaultDevices));
      localStorage.setItem('dm_data_version', currentVersion);
      localStorage.setItem('dm_industries', JSON.stringify(industries));
      localStorage.setItem('dm_devices', JSON.stringify(devices));
    }
    let currentIndustry = 'all';
    let currentDevice = null;
    let editingFeatures = [];
    let editingImages = [];
    let carouselIndex = 0;
    let carouselTimer = null;

    // ==================== Storage ====================
    function saveStorage() {
      localStorage.setItem('dm_industries', JSON.stringify(industries));
      localStorage.setItem('dm_devices', JSON.stringify(devices));
    }

    // ==================== Navigation ====================
    function showPage(page) {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelector(`[data-page="${page}"]`)?.classList.add('active');

      document.getElementById('devicesPage').style.display = page === 'devices' ? 'block' : 'none';
      document.getElementById('industryPage').classList.toggle('active', page === 'industries');
      document.getElementById('detailPage').classList.remove('active');

      if (page === 'devices') renderDevices();
      if (page === 'industries') renderIndustryManager();
    }

    // ==================== Sidebar Industry Nav ====================
    function renderIndustryNav() {
      const container = document.getElementById('industryNav');
      if (!container) return;
      container.innerHTML = industries.map(ind => {
        const count = devices.filter(d => d.industryId === ind.id).length;
        return `
          <div class="industry-tag ${currentIndustry === ind.id ? 'active' : ''}" onclick="setIndustryFilter('${ind.id}')">
            <span>${ind.icon} ${ind.name}</span>
            <span class="count">${count}</span>
          </div>
        `;
      }).join('');
    }

    // ==================== Industry Filter Chips ====================
    function renderIndustryFilter() {
      const container = document.getElementById('industryFilter');
      container.innerHTML = `
        <div class="filter-chip ${currentIndustry === 'all' ? 'active' : ''}" onclick="setIndustryFilter('all')">全部</div>
        ${industries.map(ind => `
          <div class="filter-chip ${currentIndustry === ind.id ? 'active' : ''}" onclick="setIndustryFilter('${ind.id}')">${ind.icon} ${ind.name}</div>
        `).join('')}
      `;
    }

    function setIndustryFilter(id) {
      currentIndustry = id;
      renderIndustryFilter();
      renderDevices();
    }

    // ==================== Render Devices ====================
    function renderDevices() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      let filtered = devices.filter(d => {
        if (currentIndustry !== 'all' && d.industryId !== currentIndustry) return false;
        if (!search) return true;
        return d.name.toLowerCase().includes(search) ||
               (d.brand && d.brand.toLowerCase().includes(search)) ||
               (d.model && d.model.toLowerCase().includes(search));
      });

      filtered.sort((a, b) => {
        if (sort === 'price-asc') return (a.price || 0) - (b.price || 0);
        if (sort === 'price-desc') return (b.price || 0) - (a.price || 0);
        if (sort === 'name') return a.name.localeCompare(b.name);
        return 0;
      });

      document.getElementById('deviceCount').textContent = filtered.length;
      const ind = currentIndustry === 'all' ? null : industries.find(i => i.id === currentIndustry);
      document.getElementById('pageTitle').textContent = ind ? ind.name : '全部设备';
      document.getElementById('pageSubtitle').innerHTML = `共 <span id="deviceCount">${filtered.length}</span> 个设备`;

      const grid = document.getElementById('devicesGrid');
      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <h3>暂无设备</h3>
            <p>点击右上角"添加设备"按钮开始管理</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(d => {
        const ind = industries.find(i => i.id === d.industryId);
        const imgCount = d.images?.length || 1;
        return `
          <div class="device-card" onclick="showDetail('${d.id}')">
            <div class="card-image-wrap">
              <img class="card-image" src="${d.images?.[0] || d.image || 'https://via.placeholder.com/400x300?text=No+Image'}" alt="${d.name}" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
              ${imgCount > 1 ? `<span class="card-image-badge">${imgCount} 张</span>` : ''}
            </div>
            <div class="card-body">
              <div class="card-industry">${ind?.icon || ''} ${ind?.name || '未分类'}</div>
              <div class="card-title">${d.name}</div>
              <div class="card-brand">${d.brand || ''} ${d.model ? '· ' + d.model : ''}</div>
              <div class="card-footer">
                <span class="card-price">${d.priceRange || (d.price ? '¥' + d.price.toLocaleString() : '价格待定')}</span>
                <div class="card-actions" onclick="event.stopPropagation()">
                  <button class="btn-edit" onclick="editDevice('${d.id}')" title="编辑">✏️</button>
                  <button class="btn-delete" onclick="confirmDeleteDeviceFromCard('${d.id}')" title="删除">🗑️</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==================== Carousel ====================
    function initCarousel(images) {
      const track = document.getElementById('carouselTrack');
      const dots = document.getElementById('carouselDots');
      const counter = document.getElementById('carouselCounter');
      carouselIndex = 0;
      clearInterval(carouselTimer);

      if (!images || images.length === 0) {
        track.innerHTML = '<div class="carousel-slide"><img src="https://via.placeholder.com/600x450?text=No+Image" alt=""></div>';
        dots.innerHTML = '<div class="carousel-dot active"></div>';
        counter.textContent = '0 / 0';
        return;
      }

      track.innerHTML = images.map(img => `
        <div class="carousel-slide"><img src="${img}" alt="" onerror="this.src='https://via.placeholder.com/600x450?text=No+Image'"></div>
      `).join('');

      dots.innerHTML = images.map((_, i) => `
        <div class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>
      `).join('');

      updateCarousel();

      // Auto-play every 10 seconds
      carouselTimer = setInterval(() => {
        nextSlide();
      }, 10000);
    }

    function updateCarousel() {
      const track = document.getElementById('carouselTrack');
      const dots = document.querySelectorAll('.carousel-dot');
      const counter = document.getElementById('carouselCounter');
      const slides = track.children;

      if (slides.length === 0) return;
      track.style.transform = `translateX(-${carouselIndex * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === carouselIndex));
      counter.textContent = `${carouselIndex + 1} / ${slides.length}`;
    }

    function nextSlide() {
      const total = document.getElementById('carouselTrack').children.length;
      if (total === 0) return;
      carouselIndex = (carouselIndex + 1) % total;
      updateCarousel();
    }

    function prevSlide() {
      const total = document.getElementById('carouselTrack').children.length;
      if (total === 0) return;
      carouselIndex = (carouselIndex - 1 + total) % total;
      updateCarousel();
    }

    function goToSlide(index) {
      carouselIndex = index;
      updateCarousel();
    }

    // ==================== Detail Page ====================
    function showDetail(deviceId) {
      const d = devices.find(x => x.id === deviceId);
      if (!d) return;
      currentDevice = d;

      const ind = industries.find(i => i.id === d.industryId);
      document.getElementById('detailIndustry').textContent = `${ind?.icon || ''} ${ind?.name || '未分类'}`;
      document.getElementById('detailTitle').textContent = d.name;
      document.getElementById('detailBrand').textContent = `${d.brand || ''} ${d.model ? '· 型号：' + d.model : ''}`;
      document.getElementById('detailPrice').textContent = d.priceRange || (d.price ? '¥' + d.price.toLocaleString() : '价格待定');
      document.getElementById('detailDesc').textContent = d.desc || '暂无描述';
      document.getElementById('detailLink').href = d.link || '#';
      document.getElementById('detailLink').style.display = d.link && d.link !== '#' ? 'inline-flex' : 'none';

      // Carousel
      initCarousel(d.images || (d.image ? [d.image] : []));

      // Specs
      const specsTable = document.getElementById('detailSpecs');
      if (d.specs && Object.keys(d.specs).length > 0) {
        specsTable.innerHTML = Object.entries(d.specs).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
      } else {
        specsTable.innerHTML = '<tr><td colspan="2" style="color:var(--muted)">暂无参数信息</td></tr>';
      }

      // Features
      const featuresList = document.getElementById('detailFeatures');
      if (d.features && d.features.length > 0) {
        featuresList.innerHTML = d.features.map(f => `<li>${f}</li>`).join('');
      } else {
        featuresList.innerHTML = '<li style="color:var(--muted)">暂无特点信息</li>';
      }

      document.getElementById('devicesPage').style.display = 'none';
      document.getElementById('industryPage').classList.remove('active');
      document.getElementById('detailPage').classList.add('active');
      window.scrollTo(0, 0);
    }

    function backToList() {
      clearInterval(carouselTimer);
      document.getElementById('detailPage').classList.remove('active');
      showPage('devices');
    }

    // ==================== Confirm Dialog ====================
    let confirmCallback = null;

    function showConfirm(title, message, icon, btnText, callback) {
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmIcon').textContent = icon;
      document.getElementById('confirmBtn').textContent = btnText;
      confirmCallback = callback;
      document.getElementById('confirmDialog').classList.add('active');
    }

    function closeConfirm() {
      document.getElementById('confirmDialog').classList.remove('active');
      confirmCallback = null;
    }

    function executeConfirm() {
      if (confirmCallback) confirmCallback();
      closeConfirm();
    }

    function confirmDeleteDevice() {
      if (!currentDevice) return;
      showConfirm('确认删除设备？', `确定要删除 "${currentDevice.name}" 吗？此操作不可撤销。`, '🗑️', '确认删除', () => {
        deleteDevice(currentDevice.id);
      });
    }

    function confirmDeleteDeviceFromCard(deviceId) {
      const d = devices.find(x => x.id === deviceId);
      if (!d) return;
      showConfirm('确认删除设备？', `确定要删除 "${d.name}" 吗？此操作不可撤销。`, '🗑️', '确认删除', () => {
        deleteDevice(deviceId);
      });
    }

    function confirmDeleteIndustry(industryId) {
      const ind = industries.find(i => i.id === industryId);
      const count = devices.filter(d => d.industryId === industryId).length;
      if (count > 0) {
        showToast(`该行业下有 ${count} 个设备，请先移除设备`, 'error');
        return;
      }
      showConfirm('确认删除行业？', `确定要删除 "${ind?.name}" 吗？`, '🗑️', '确认删除', () => {
        industries = industries.filter(i => i.id !== industryId);
        saveStorage();
        renderIndustryNav();
        renderIndustryFilter();
        renderIndustryManager();
        renderDevices();
        showToast('行业已删除', 'success');
      });
    }

    // ==================== Device Modal ====================
    function openDeviceModal(deviceId = null) {
      const modal = document.getElementById('deviceModal');
      document.getElementById('deviceForm').reset();
      editingFeatures = [];
      editingImages = [];
      renderFeatureTags();
      renderUploadedImages();

      const select = document.getElementById('deviceIndustry');
      select.innerHTML = industries.map(i => `<option value="${i.id}">${i.icon} ${i.name}</option>`).join('');

      if (deviceId) {
        const d = devices.find(x => x.id === deviceId);
        if (!d) return;
        document.getElementById('deviceModalTitle').textContent = '编辑设备';
        document.getElementById('deviceId').value = d.id;
        document.getElementById('deviceName').value = d.name;
        document.getElementById('deviceIndustry').value = d.industryId;
        document.getElementById('deviceBrand').value = d.brand || '';
        document.getElementById('deviceModel').value = d.model || '';
        document.getElementById('devicePrice').value = d.price || '';
        document.getElementById('devicePriceRange').value = d.priceRange || '';
        document.getElementById('deviceLink').value = d.link || '';
        document.getElementById('deviceDesc').value = d.desc || '';
        document.getElementById('deviceSpecs').value = d.specs ? Object.entries(d.specs).map(([k,v]) => `${k}: ${v}`).join('\n') : '';
        editingFeatures = d.features ? [...d.features] : [];
        editingImages = d.images ? [...d.images] : (d.image ? [d.image] : []);
        renderFeatureTags();
        renderUploadedImages();
      } else {
        document.getElementById('deviceModalTitle').textContent = '添加设备';
        document.getElementById('deviceId').value = '';
      }

      modal.classList.add('active');
    }

    function closeDeviceModal() {
      document.getElementById('deviceModal').classList.remove('active');
    }

    function saveDevice() {
      const id = document.getElementById('deviceId').value;
      const name = document.getElementById('deviceName').value.trim();
      const industryId = document.getElementById('deviceIndustry').value;

      if (!name || !industryId) {
        showToast('请填写设备名称和所属行业', 'error');
        return;
      }

      const specsText = document.getElementById('deviceSpecs').value;
      const specs = {};
      specsText.split('\n').forEach(line => {
        const idx = line.indexOf(':');
        if (idx > 0) specs[line.substring(0, idx).trim()] = line.substring(idx + 1).trim();
      });

      const deviceData = {
        id: id || 'd' + Date.now(),
        name,
        industryId,
        brand: document.getElementById('deviceBrand').value.trim(),
        model: document.getElementById('deviceModel').value.trim(),
        price: parseFloat(document.getElementById('devicePrice').value) || 0,
        priceRange: document.getElementById('devicePriceRange').value.trim(),
        images: editingImages,
        link: document.getElementById('deviceLink').value.trim(),
        desc: document.getElementById('deviceDesc').value.trim(),
        specs,
        features: editingFeatures
      };

      if (id) {
        const idx = devices.findIndex(d => d.id === id);
        if (idx >= 0) devices[idx] = deviceData;
      } else {
        devices.unshift(deviceData);
      }

      saveStorage();
      closeDeviceModal();
      renderDevices();
      renderIndustryNav();
      showToast(id ? '设备已更新' : '设备已添加', 'success');
    }

    function editDevice(deviceId) {
      openDeviceModal(deviceId);
    }

    function deleteDevice(deviceId) {
      devices = devices.filter(d => d.id !== deviceId);
      saveStorage();
      renderDevices();
      renderIndustryNav();
      showToast('设备已删除', 'success');
      if (currentDevice && currentDevice.id === deviceId) {
        backToList();
      }
    }

    function editCurrentDevice() {
      if (currentDevice) editDevice(currentDevice.id);
    }

    // ==================== Image Upload ====================
    function handleImageUpload(event) {
      const files = event.target.files;
      if (!files.length) return;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          editingImages.push(e.target.result);
          renderUploadedImages();
        };
        reader.readAsDataURL(file);
      });
      event.target.value = '';
    }

    function renderUploadedImages() {
      const container = document.getElementById('uploadedImages');
      container.innerHTML = editingImages.map((img, i) => `
        <div class="uploaded-image">
          <img src="${img}" alt="">
          <button class="remove-img" onclick="removeImage(${i})">&times;</button>
        </div>
      `).join('');
    }

    function removeImage(index) {
      editingImages.splice(index, 1);
      renderUploadedImages();
    }

    // ==================== Feature Tags ====================
    function handleFeatureKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const val = e.target.value.trim();
        if (val && !editingFeatures.includes(val)) {
          editingFeatures.push(val);
          renderFeatureTags();
        }
        e.target.value = '';
      }
    }

    function renderFeatureTags() {
      const container = document.getElementById('featureInput');
      container.innerHTML = editingFeatures.map((f, i) => `
        <span class="tag">${f} <button onclick="removeFeature(${i})">&times;</button></span>
      `).join('') + '<input type="text" placeholder="输入特点后按回车..." onkeydown="handleFeatureKey(event)">';
      const input = container.querySelector('input');
      if (input) input.focus();
    }

    function removeFeature(index) {
      editingFeatures.splice(index, 1);
      renderFeatureTags();
    }

    // ==================== Industry Manager ====================
    function renderIndustryManager() {
      const list = document.getElementById('industryList');
      list.innerHTML = industries.map(ind => {
        const count = devices.filter(d => d.industryId === ind.id).length;
        return `
          <div class="industry-item">
            <div>
              <span style="font-size:1.1rem;margin-right:0.4rem">${ind.icon}</span>
              <span class="industry-item-name">${ind.name}</span>
              <span class="industry-item-count">（${count} 个设备）</span>
            </div>
            <div class="card-actions">
              <button class="btn-edit" onclick="editIndustry('${ind.id}')" title="编辑">✏️</button>
              <button class="btn-delete" onclick="confirmDeleteIndustry('${ind.id}')" title="删除">🗑️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openIndustryModal(industryId = null) {
      const modal = document.getElementById('industryModal');
      document.getElementById('industryForm').reset();

      if (industryId) {
        const ind = industries.find(i => i.id === industryId);
        if (!ind) return;
        document.getElementById('industryModalTitle').textContent = '编辑行业';
        document.getElementById('industryId').value = ind.id;
        document.getElementById('industryName').value = ind.name;
        document.getElementById('industryIcon').value = ind.icon;
      } else {
        document.getElementById('industryModalTitle').textContent = '添加行业';
        document.getElementById('industryId').value = '';
      }

      modal.classList.add('active');
    }

    function closeIndustryModal() {
      document.getElementById('industryModal').classList.remove('active');
    }

    function saveIndustry() {
      const id = document.getElementById('industryId').value;
      const name = document.getElementById('industryName').value.trim();
      const icon = document.getElementById('industryIcon').value.trim() || '📦';

      if (!name) {
        showToast('请填写行业名称', 'error');
        return;
      }

      if (id) {
        const idx = industries.findIndex(i => i.id === id);
        if (idx >= 0) industries[idx] = { ...industries[idx], name, icon };
      } else {
        industries.push({ id: 'ind_' + Date.now(), name, icon });
      }

      saveStorage();
      closeIndustryModal();
      renderIndustryNav();
      renderIndustryFilter();
      renderIndustryManager();
      renderDevices();
      showToast(id ? '行业已更新' : '行业已添加', 'success');
    }

    function editIndustry(industryId) {
      openIndustryModal(industryId);
    }

    // ==================== Import/Export ====================
    function exportData() {
      const data = { industries, devices, exportDate: new Date().toISOString() };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `device-manager-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('数据已导出', 'success');
    }

    function importData(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          if (data.industries) industries = data.industries;
          if (data.devices) devices = data.devices;
          saveStorage();
          renderIndustryNav();
          renderIndustryFilter();
          renderDevices();
          showToast('数据导入成功', 'success');
        } catch (err) {
          showToast('导入失败：文件格式错误', 'error');
        }
      };
      reader.readAsText(file);
      input.value = '';
    }

    // ==================== Toast ====================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ==================== Mobile ====================
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // ==================== Init ====================
    function init() {
      renderIndustryNav();
      renderIndustryFilter();
      renderDevices();
    }

    init();
  </script>
</body>
</html>
