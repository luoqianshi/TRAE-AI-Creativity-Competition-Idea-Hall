<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
    <title>GTA Street Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: crosshair;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            background: #1a1a2e;
        }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        .ui-element {
            position: absolute;
            background: rgba(10,10,20,0.85);
            border: 2px solid #ff006e;
            padding: 6px 10px;
            color: #fff;
            text-shadow: 0 0 10px #ff006e;
            font-size: 11px;
            border-radius: 4px;
        }
        #healthBar {
            top: 20px;
            left: 20px;
            width: 140px;
        }
        #healthBar .bar-bg {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 3px;
        }
        #healthBar .bar-fill {
            height: 100%;
            background: linear-gradient(90deg,#00ff88,#00ffaa);
            transition: width 0.3s;
            box-shadow: 0 0 8px #00ff88;
        }
        #wantedLevel {
            top: 20px;
            right: 20px;
            text-align: right;
        }
        .stars {
            font-size: 18px;
            color: #ffcc00;
            text-shadow: 0 0 12px #ffcc00;
            letter-spacing: 2px;
        }
        #minimap {
            top: 85px;
            right: 20px;
            width: 100px;
            height: 100px;
            border: 2px solid #00fff5;
            border-radius: 5px;
            overflow: hidden;
            padding: 0;
        }
        #minimapCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #score {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            border-color: #00fff5;
        }
        #score .money {
            color: #00ff88;
            font-size: 16px;
            text-shadow: 0 0 12px #00ff88;
        }
        #weaponIndicator {
            top: 50px;
            left: 20px;
            color: #ff6600;
            font-size: 11px;
            display: none;
        }
        #vulcanIndicator {
            top: 50px;
            left: 90px;
            color: #ff0000;
            font-size: 11px;
            display: none;
        }
        #message {
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 18px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
            background: rgba(10,10,20,0.95);
            padding: 15px 30px;
            border-radius: 8px;
        }
        #message.show {
            opacity: 1;
        }
        #easterEggMsg {
            position: fixed;
            top: 25%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            z-index: 250;
            text-shadow: 0 0 10px #fff, 0 0 20px #ff00de, 0 0 30px #ff00de;
            animation: colorChange 2s infinite;
        }
        #easterEggMsg.show {
            opacity: 1;
        }
        @keyframes colorChange {
            0%{color:#ff0000}
            20%{color:#ff9900}
            40%{color:#ffff00}
            60%{color:#00ff00}
            80%{color:#0099ff}
            100%{color:#9900ff}
        }
        #gameOver {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }
        #gameOver h1 {
            color: #ff006e;
            font-size: 48px;
            text-shadow: 0 0 25px #ff006e;
            margin-bottom: 15px;
        }
        #gameOver p {
            color: #fff;
            font-size: 18px;
            margin-bottom: 25px;
        }
        #restartBtn {
            background: linear-gradient(135deg,#ff006e,#ff3366);
            border: none;
            padding: 10px 35px;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            pointer-events: auto;
            border-radius: 5px;
        }
        #restartBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px #ff006e;
        }
        #vehicleIndicator {
            top: 200px;
            left: 20px;
            color: #ffaa00;
            font-size: 11px;
            display: none;
        }
        #joystickContainer {
            position: fixed;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
            z-index: 150;
        }
        #joystickBase {
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0,255,245,0.4);
            border-radius: 50%;
            position: relative;
        }
        #joystickKnob {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg,#00fff5,#00cccc);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #00fff5;
            transition: none;
        }
        #fireBtn {
            position: fixed;
            bottom: 60px;
            right: 60px;
            width: 80px;
            height: 80px;
            background: rgba(255,0,110,0.3);
            border: 3px solid #ff006e;
            border-radius: 50%;
            pointer-events: auto;
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #ff006e;
            text-shadow: 0 0 8px #ff006e;
            cursor: pointer;
            font-weight: bold;
        }
        #fireBtn:active {
            background: rgba(255,0,110,0.6);
            transform: scale(0.92);
        }
        #sprintBtn {
            position: fixed;
            bottom: 160px;
            left: 40px;
            width: 70px;
            height: 70px;
            background: rgba(0,255,100,0.2);
            border: 3px solid #00ff64;
            border-radius: 50%;
            pointer-events: auto;
            z-index: 150;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #00ff64;
            text-shadow: 0 0 8px #00ff64;
            cursor: pointer;
            font-weight: bold;
        }
        #sprintBtn:active {
            background: rgba(0,255,100,0.5);
            transform: scale(0.92);
        }
        #sprintBtn.active {
            background: rgba(0,255,100,0.5);
        }
        #interactHint {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,200,0,0.9);
            border: 2px solid #ffcc00;
            padding: 8px 16px;
            color: #000;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            pointer-events: auto;
            z-index: 160;
            display: none;
            text-shadow: none;
        }
        #actionBtn {
            position: fixed;
            bottom: 180px;
            right: 60px;
            width: 60px;
            height: 60px;
            background: rgba(255,170,0,0.3);
            border: 2px solid #ffaa00;
            border-radius: 50%;
            pointer-events: auto;
            z-index: 150;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #ffaa00;
            text-shadow: 0 0 8px #ffaa00;
            cursor: pointer;
            font-weight: bold;
        }
        #actionBtn:active {
            background: rgba(255,170,0,0.6);
        }
        #npcDialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background: rgba(20,20,40,0.95);
            border: 3px solid #00ff00;
            border-radius: 12px;
            padding: 25px 35px;
            z-index: 300;
            display: none;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,255,0,0.3);
        }
        #npcDialog h2 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 18px;
        }
        #npcDialog p {
            color: #fff;
            margin-bottom: 20px;
            font-size: 14px;
        }
        #npcDialog .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        #npcDialog button {
            padding: 10px 25px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
        }
        #buyYesBtn {
            background: #00ff00;
            color: #000;
        }
        #buyNoBtn {
            background: #ff0000;
            color: #fff;
        }
        #npcDialog button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="ui">
        <div id="healthBar" class="ui-element">
            <div>生命</div>
            <div class="bar-bg">
                <div class="bar-fill" id="healthFill"></div>
            </div>
        </div>
        <div id="wantedLevel" class="ui-element">
            <div>通缉</div>
            <div class="stars" id="stars">☆☆☆☆☆</div>
        </div>
        <div id="minimap" class="ui-element">
            <canvas id="minimapCanvas" width="100" height="100"></canvas>
        </div>
        <div id="vehicleIndicator" class="ui-element">驾驶中</div>
        <div id="weaponIndicator" class="ui-element">加特林</div>
        <div id="vulcanIndicator" class="ui-element">火神炮</div>
        <div id="score" class="ui-element">
            <div class="money">$<span id="money">0</span></div>
        </div>
        <div id="message" class="ui-element"></div>
        <div id="easterEggMsg"></div>
    </div>
    <div id="interactHint">上车</div>
    <div id="actionBtn">E</div>
    <div id="sprintBtn">冲刺</div>
    <div id="joystickContainer">
        <div id="joystickBase">
            <div id="joystickKnob"></div>
        </div>
    </div>
    <div id="fireBtn">射击</div>
    <div id="npcDialog">
        <h2>是否花费3000美金购买神秘增益？</h2>
        <div class="btn-group">
            <button id="buyYesBtn">是</button>
            <button id="buyNoBtn">否</button>
        </div>
    </div>
    <div id="gameOver">
        <h1>游戏结束</h1>
        <p>得分:$<span id="finalScore">0</span></p>
        <button id="restartBtn">重新开始</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        const joystickBase = document.getElementById('joystickBase');
        const joystickKnob = document.getElementById('joystickKnob');
        const fireBtn = document.getElementById('fireBtn');
        const sprintBtn = document.getElementById('sprintBtn');
        const actionBtn = document.getElementById('actionBtn');
        const interactHint = document.getElementById('interactHint');
        const npcDialog = document.getElementById('npcDialog');
        const buyYesBtn = document.getElementById('buyYesBtn');
        const buyNoBtn = document.getElementById('buyNoBtn');
        const easterEggMsg = document.getElementById('easterEggMsg');
        let joystickInput = {x: 0, y: 0, active: false};
        let isSprinting = false;
        let dialogActive = false;
        let joystickTouchId = null;
        const JOYSTICK_DEADZONE = 0.15;
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const WORLD_SIZE = 2400;
        const BLOCK_SIZE = 300;
        const MARGIN = 50;
        const VEHICLE_SIZES = {
            sedan: {w: 40, h: 70},
            sports: {w: 35, h: 65},
            suv: {w: 50, h: 80},
            apc: {w: 70, h: 100},
            tank: {w: 85, h: 120},
            helicopter: {w: 90, h: 90}
        };
        let gameState = {
            running: true,
            money: 0,
            wantedLevel: 0,
            wantedTimer: 0,
            hasGatling: false,
            hasVulcan: false,
            npcKilled: false
        };
        let player = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            vx: 0,
            vy: 0,
            angle: 0,
            health: 100,
            speed: 200,
            sprintSpeed: 450,
            inVehicle: null,
            shootCooldown: 0,
            moveAngle: 0,
            interactCooldown: false
        };
        let camera = {x: WORLD_SIZE / 2, y: WORLD_SIZE / 2};
        let keys = {};
        let bullets = [];
        let enemyBullets = [];
        let npcBullets = [];
        let enemies = [];
        let enemyVehicles = [];
        let particles = [];
        let buildings = [];
        let vehicles = [];
        let gasStations = [];
        let roads = [];
        let healthPacks = [];
        let moneyDrops = [];
        let npc = {
            x: 0,
            y: 0,
            health: 1600,
            maxHealth: 1600,
            alive: true,
            shelter: null,
            shootCooldown: 0
        };
        let npcShelters = [];
        let nearNPCThisFrame = false;
        let nearVehicleThisFrame = false;
        function initWorld() {
            buildings = [];
            vehicles = [];
            gasStations = [];
            roads = [];
            enemies = [];
            enemyVehicles = [];
            bullets = [];
            enemyBullets = [];
            npcBullets = [];
            particles = [];
            healthPacks = [];
            moneyDrops = [];
            nearNPCThisFrame = false;
            nearVehicleThisFrame = false;
            player.x = WORLD_SIZE / 2;
            player.y = WORLD_SIZE / 2;
            player.vx = 0;
            player.vy = 0;
            camera.x = player.x;
            camera.y = player.y;
            for (let x = 0; x < WORLD_SIZE; x += BLOCK_SIZE) {
                roads.push({x: x, y: 0, w: 80, h: WORLD_SIZE, horizontal: true});
            }
            for (let y = 0; y < WORLD_SIZE; y += BLOCK_SIZE) {
                roads.push({x: 0, y: y, w: WORLD_SIZE, h: 80, horizontal: false});
            }
            for (let bx = 0; bx < WORLD_SIZE; bx += BLOCK_SIZE) {
                for (let by = 0; by < WORLD_SIZE; by += BLOCK_SIZE) {
                    if (roads.some(r => Math.abs(r.x - bx) < 100 || Math.abs(r.y - by) < 100)) continue;
                    const numBuildings = 2 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < numBuildings; i++) {
                        const bw = 60 + Math.random() * 80;
                        const bh = 60 + Math.random() * 80;
                        const px = bx + 50 + Math.random() * (BLOCK_SIZE - 80 - bw - 100);
                        const py = by + 50 + Math.random() * (BLOCK_SIZE - 80 - bh - 100);
                        if (px > 0 && py > 0 && px + bw < WORLD_SIZE && py + bh < WORLD_SIZE) {
                            buildings.push({
                                x: px,
                                y: py,
                                w: bw,
                                h: bh,
                                color: `hsl(${Math.random() * 360},20%,${20 + Math.random() * 20}%)`
                            });
                        }
                    }
                }
            }
            const intersections = [];
            for (let x = 0; x < WORLD_SIZE; x += BLOCK_SIZE) {
                for (let y = 0; y < WORLD_SIZE; y += BLOCK_SIZE) {
                    intersections.push({x: x, y: y});
                }
            }
            for (let i = 0; i < 3; i++) {
                const idx = Math.floor(Math.random() * intersections.length);
                const pos = intersections.splice(idx, 1)[0];
                if (pos.x + 60 < WORLD_SIZE && pos.y + 60 < WORLD_SIZE) {
                    gasStations.push({x: pos.x + 20, y: pos.y + 20, w: 60, h: 60, fuel: 100});
                }
            }
            const vehicleTypes = ['sedan', 'sports', 'suv'];
            const vehicleColors = {
                sedan: ['#ffcc00', '#ff6600', '#ffffff'],
                sports: ['#ff0000', '#0000ff', '#00ff00'],
                suv: ['#333333', '#666666', '#884400']
            };
            for (let i = 0; i < 15; i++) {
                const type = vehicleTypes[Math.floor(Math.random() * vehicleTypes.length)];
                const colors = vehicleColors[type];
                const road = roads[Math.floor(Math.random() * roads.length)];
                let vx, vy, angle;
                if (road.horizontal) {
                    vx = road.x + Math.random() * (road.w - 60);
                    vy = road.y + (Math.random() > 0.5 ? 5 : road.h - 65);
                    angle = Math.random() > 0.5 ? 0 : Math.PI;
                } else {
                    vx = road.x + (Math.random() > 0.5 ? 5 : road.w - 65);
                    vy = road.y + Math.random() * (road.h - 60);
                    angle = Math.random() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
                }
                const baseSpeed = type === 'sports' ? 450 : (type === 'sedan' ? 350 : 300);
                const handling = type === 'sports' ? 0.055 : (type === 'sedan' ? 0.045 : 0.038);
                const vHealth = type === 'suv' ? 150 : 100;
                if (vx > 40 && vy > 40 && vx < WORLD_SIZE - 100 && vy < WORLD_SIZE - 100) {
                    vehicles.push({
                        x: vx,
                        y: vy,
                        vx: 0,
                        vy: 0,
                        angle: angle,
                        type: type,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        speed: baseSpeed,
                        handling: handling,
                        fuel: 80 + Math.random() * 20,
                        health: vHealth,
                        occupied: false
                    });
                }
            }
            for (let i = 0; i < 5; i++) spawnHealthPack();
            for (let i = 0; i < 15; i++) spawnMoneyDrop();
            spawnNPCShelter();
            spawnEnemies(5);
        }
        function spawnNPCShelter() {
            const validSpots = [];
            for (let bx = BLOCK_SIZE; bx < WORLD_SIZE - BLOCK_SIZE; bx += BLOCK_SIZE) {
                for (let by = BLOCK_SIZE; by < WORLD_SIZE - BLOCK_SIZE; by += BLOCK_SIZE) {
                    if (roads.some(r => Math.abs(r.x - bx) < 150 || Math.abs(r.y - by) < 150)) continue;
                    const cx = bx + BLOCK_SIZE / 2;
                    const cy = by + BLOCK_SIZE / 2;
                    if (cx > 400 && cy > 400 && cx < WORLD_SIZE - 400 && cy < WORLD_SIZE - 400) {
                        let clear = true;
                        for (const b of buildings) {
                            if (cx > b.x - 60 && cx < b.x + b.w + 60 && cy > b.y - 60 && cy < b.y + b.h + 60) {
                                clear = false;
                                break;
                            }
                        }
                        if (clear) validSpots.push({x: cx, y: cy});
                    }
                }
            }
            if (validSpots.length > 0) {
                const spot = validSpots[Math.floor(Math.random() * validSpots.length)];
                npcShelters.push({x: spot.x - 50, y: spot.y - 50, w: 100, h: 100});
                npc.x = spot.x;
                npc.y = spot.y;
                npc.health = npc.maxHealth;
                npc.alive = true;
                npc.shelter = spot;
            } else {
                npc.x = WORLD_SIZE / 2;
                npc.y = WORLD_SIZE / 2;
                npc.health = npc.maxHealth;
                npc.alive = true;
                npcShelters.push({x: WORLD_SIZE / 2 - 50, y: WORLD_SIZE / 2 - 50, w: 100, h: 100});
                npc.shelter = {x: WORLD_SIZE / 2, y: WORLD_SIZE / 2};
            }
        }
        function spawnHealthPack() {
            let hx, hy;
            let valid = false;
            for (let attempt = 0; attempt < 50 && !valid; attempt++) {
                hx = 100 + Math.random() * (WORLD_SIZE - 200);
                hy = 100 + Math.random() * (WORLD_SIZE - 200);
                valid = true;
                for (const b of buildings) {
                    if (hx > b.x - 20 && hx < b.x + b.w + 20 && hy > b.y - 20 && hy < b.y + b.h + 20) {
                        valid = false;
                        break;
                    }
                }
                for (const gs of gasStations) {
                    if (hx > gs.x - 20 && hx < gs.x + gs.w + 20 && hy > gs.y - 20 && hy < gs.y + gs.h + 20) {
                        valid = false;
                        break;
                    }
                }
                for (const s of npcShelters) {
                    if (hx > s.x - 20 && hx < s.x + s.w + 20 && hy > s.y - 20 && hy < s.y + s.h + 20) {
                        valid = false;
                        break;
                    }
                }
            }
            if (valid) healthPacks.push({x: hx, y: hy, life: 0});
        }
        function spawnMoneyDrop() {
            let mx, my;
            let valid = false;
            for (let attempt = 0; attempt < 50 && !valid; attempt++) {
                mx = 100 + Math.random() * (WORLD_SIZE - 200);
                my = 100 + Math.random() * (WORLD_SIZE - 200);
                valid = true;
                for (const b of buildings) {
                    if (mx > b.x - 20 && mx < b.x + b.w + 20 && my > b.y - 20 && my < b.y + b.h + 20) {
                        valid = false;
                        break;
                    }
                }
                for (const r of roads) {
                    if (mx > r.x - 20 && mx < r.x + r.w + 20 && my > r.y - 20 && my < r.y + r.h + 20) {
                        valid = false;
                        break;
                    }
                }
            }
            if (valid) {
                const values = [10, 20, 50];
                const value = values[Math.floor(Math.random() * values.length)];
                moneyDrops.push({x: mx, y: my, value: value, life: 0});
            }
        }
        function spawnAPC() {
            const road = roads[Math.floor(Math.random() * roads.length)];
            let vx, vy, angle;
            if (road.horizontal) {
                vx = road.x + Math.random() * (road.w - 70);
                vy = road.y + (Math.random() > 0.5 ? 5 : road.h - 95);
                angle = Math.random() > 0.5 ? 0 : Math.PI;
            } else {
                vx = road.x + (Math.random() > 0.5 ? 5 : road.w - 95);
                vy = road.y + Math.random() * (road.h - 70);
                angle = Math.random() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
            }
            const v = {
                x: vx,
                y: vy,
                vx: 0,
                vy: 0,
                angle: angle,
                type: 'apc',
                color: '#444444',
                speed: 250,
                handling: 0.03,
                fuel: 100,
                health: 400,
                occupied: true,
                isEnemy: true,
                isAPC: true,
                isTank: false,
                isHelicopter: false
            };
            enemyVehicles.push(v);
            return v;
        }
        function spawnTank() {
            const road = roads[Math.floor(Math.random() * roads.length)];
            let vx, vy, angle;
            if (road.horizontal) {
                vx = road.x + Math.random() * (road.w - 85);
                vy = road.y + (Math.random() > 0.5 ? 5 : road.h - 125);
                angle = Math.random() > 0.5 ? 0 : Math.PI;
            } else {

        function rectCollision(x1, y1, w1, h1, x2, y2, w2, h2) {

        }
        function pointInRect(px, py, rx, ry, rw, rh) {
            return px >= rx && px <= rx + rw && py >= ry && py <= ry + rh;

        function updatePlayer(dt) {
            let speed = player.sprintSpeed * (isSprinting ? 1.5 : 1);
            if (player.inVehicle) {
                updateVehicle(dt, player.inVehicle);
                document.getElementById('vehicleIndicator').style.display = 'block';
                document.getElementById('fireBtn').textContent = '喇叭';
            } else {
                document.getElementById('vehicleIndicator').style.display = 'none';
                if (gameState.hasVulcan) document.getElementById('fireBtn').textContent = '火神';
                else if (gameState.hasGatling) document.getElementById('fireBtn').textContent = '加特林';
                else document.getElementById('fireBtn').textContent = '射击';

                if (joystickInput.active) {
                    mx = joystickInput.x;
                    my = joystickInput.y;
                }
                if (Math.abs(mx) < JOYSTICK_DEADZONE) mx = 0;
                if (Math.abs(my) < JOYSTICK_DEADZONE) my = 0;
                if (mx !== 0 || my !== 0) {
                    const len = Math.sqrt(mx * mx + my * my);
                    mx /= len;
                    my /= len;
                    player.moveAngle = Math.atan2(my, mx);
                    player.angle = player.moveAngle;
                    const targetVx = mx * speed;
                    const targetVy = my * speed;
                    player.vx += (targetVx - player.vx) * 10 * dt;
                    player.vy += (targetVy - player.vy) * 10 * dt;
                } else {
                    player.vx *= 0.85;
                    player.vy *= 0.85;
                }
                const playerSize = 10;
                let nextX = player.x + player.vx * dt;
                let nextY = player.y + player.vy * dt;
                let collidedX = false;

                for (const b of buildings) {
                    if (rectCollision(nextX - playerSize, player.y - playerSize, playerSize * 2, playerSize * 2, b.x, b.y, b.w, b.h)) collidedX = true;
                    if (rectCollision(player.x - playerSize, nextY - playerSize, playerSize * 2, playerSize * 2, b.x, b.y, b.w, b.h)) collidedY = true;
                }
                for (const s of npcShelters) {

                        {x: s.x, y: s.y + s.h - 15, w: s.w, h: 15},

                    for (const wall of walls) {
                        if (rectCollision(nextX - playerSize, player.y - playerSize, playerSize * 2, playerSize * 2, wall.x, wall.y, wall.w, wall.h)) collidedX = true;
                        if (rectCollision(player.x - playerSize, nextY - playerSize, playerSize * 2, playerSize * 2, wall.x, wall.y, wall.w, wall.h)) collidedY = true;

                }
                if (!collidedX) player.x = nextX;
                else player.vx = 0;
                if (!collidedY) player.y = nextY;
                else player.vy = 0;
                player.x = Math.max(MARGIN, Math.min(WORLD_SIZE - MARGIN, player.x));

        function updateVehicle(dt, v) {
            if (v.isHelicopter) {
                updateHelicopter(dt, v);
                return;
            }
            let accel = 0;
            let steer = 0;
            if (joystickInput.active) {
                if (joystickInput.y <= -JOYSTICK_DEADZONE) accel = v.speed;
                if (joystickInput.y >= JOYSTICK_DEADZONE) accel = -v.speed * 0.5;
                if (Math.abs(joystickInput.x) > JOYSTICK_DEADZONE) steer = joystickInput.x;
            }
            const velocity = Math.sqrt(v.vx * v.vx + v.vy * v.vy);
            v.angle += steer * v.handling * (velocity / 80);
            const moveAngle = v.angle + Math.PI / 2;
            let moveX = 0, moveY = 0;
            if (accel > 0) {
                moveX = -Math.cos(moveAngle);
                moveY = -Math.sin(moveAngle);
            }
            if (accel < 0) {
                moveX = Math.cos(moveAngle);
                moveY = Math.sin(moveAngle);
            }
            if (moveX !== 0 || moveY !== 0) player.angle = v.angle;
            if (accel > 0) {
                v.vx += moveX * accel * dt;
                v.vy += moveY * accel * dt;
            } else {
                v.vx += Math.cos(v.angle) * accel * dt;
                v.vy += Math.sin(v.angle) * accel * dt;
            }
            v.vx *= 0.96;
            v.vy *= 0.96;
            const vw = VEHICLE_SIZES[v.type].w;
            const vh = VEHICLE_SIZES[v.type].h;
            let nextX = v.x + v.vx * dt;
            let nextY = v.y + v.vy * dt;
            let collidedX = false;
            let collidedY = false;
            for (const b of buildings) {
                if (rectCollision(nextX - vw / 2, v.y - vh / 2, vw, vh, b.x, b.y, b.w, b.h)) {
                    collidedX = true;
                    v.health -= Math.abs(velocity) * 0.15;
                }
                if (rectCollision(v.x - vw / 2, nextY - vh / 2, vw, vh, b.x, b.y, b.w, b.h)) {
                    collidedY = true;
                    v.health -= Math.abs(velocity) * 0.15;
                }
            }
            for (const s of npcShelters) {
                const walls = [
                    {x: s.x, y: s.y, w: s.w, h: 15},
                    {x: s.x, y: s.y + s.h - 15, w: s.w, h: 15},
                    {x: s.x, y: s.y, w: 15, h: s.h}
                ];
                for (const wall of walls) {
                    if (rectCollision(nextX - vw / 2, v.y - vh / 2, vw, vh, wall.x, wall.y, wall.w, wall.h)) collidedX = true;
                    if (rectCollision(v.x - vw / 2, nextY - vh / 2, vw, vh, wall.x, wall.y, wall.w, wall.h)) collidedY = true;
                }
            }
            if (collidedX) {
                v.vx *= -0.3;
                nextX = v.x;
            }
            if (collidedY) {
                v.vy *= -0.3;
                nextY = v.y;
            }
            v.x = Math.max(vw, Math.min(WORLD_SIZE - vw, nextX));
            v.y = Math.max(vh, Math.min(WORLD_SIZE - vh, nextY));
            if (velocity > 5) v.fuel -= 0.015 * dt;
            for (const gs of gasStations) {
                if (rectCollision(v.x - vw / 2, v.y - vh / 2, vw, vh, gs.x, gs.y, gs.w, gs.h)) v.fuel = Math.min(100, v.fuel + 60 * dt);

        function updateHelicopter(dt, v) {

            if (dist > 0.1) v.angle = Math.atan2(dy, dx);
            const flySpeed = v.speed * 0.6;
            if (dist > 200) {
                v.vx += (dx / dist) * flySpeed * dt;
                v.vy += (dy / dist) * flySpeed * dt;
            } else if (dist < 150) {
                v.vx -= (dx / dist) * flySpeed * 0.3 * dt;
                v.vy -= (dy / dist) * flySpeed * 0.3 * dt;
            } else {
                v.vx *= 0.97;
                v.vy *= 0.97;
            }
            const currentSpeed = Math.sqrt(v.vx * v.vx + v.vy * v.vy);

                const scale = flySpeed / currentSpeed;
                v.vx *= scale;
                v.vy *= scale;

            v.x += v.vx * dt;
            v.y += v.vy * dt;

        function shadeColor(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return '#' + (0x1000000 + (R < 255 ? (R < 1 ? 0 : R) : 255) * 0x10000 + (G < 255 ? (G < 1 ? 0 : G) : 255) * 0x100 + (B < 255 ? (B < 1 ? 0 : B) : 255)).toString(16).slice(1);
        }

            for (const gs of gasStations) minimapCtx.fillRect(gs.x * scale, gs.y * scale, gs.w * scale, gs.h * scale);

        let joystickActive = false;
        let joystickCenter = {x: 0, y: 0};
        const joystickMaxDist = 35;
        function handleJoystickStart(e) {
            e.preventDefault();
            const rect = joystickBase.getBoundingClientRect();
            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];
                    const dx = touch.clientX - (rect.left + rect.width / 2);
                    const dy = touch.clientY - (rect.top + rect.height / 2);
                    if (Math.sqrt(dx * dx + dy * dy) < 60) {
                        joystickTouchId = touch.identifier;
                        joystickActive = true;
                        joystickCenter = {x: rect.left + rect.width / 2, y: rect.top + rect.height / 2};
                        updateJoystickInput(touch.clientX, touch.clientY);
                        break;
                    }
                }
            } else {
                joystickActive = true;
                joystickCenter = {x: rect.left + rect.width / 2, y: rect.top + rect.height / 2};
                updateJoystickInput(e.clientX, e.clientY);
            }
        }
        function updateJoystickInput(clientX, clientY) {
            let dx = clientX - joystickCenter.x;
            let dy = clientY - joystickCenter.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > joystickMaxDist) {
                dx = dx / dist * joystickMaxDist;
                dy = dy / dist * joystickMaxDist;
            }
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickInput.x = dx / joystickMaxDist;
            joystickInput.y = dy / joystickMaxDist;
            joystickInput.active = true;
        }
        function handleJoystickMove(e) {
            if (!joystickActive) return;
            e.preventDefault();
            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === joystickTouchId) {
                        updateJoystickInput(e.touches[i].clientX, e.touches[i].clientY);
                        break;
                    }
                }
            } else {
                updateJoystickInput(e.clientX, e.clientY);
            }
        }
        function handleJoystickEnd(e) {
            if (e.changedTouches) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        e.preventDefault();
                        joystickTouchId = null;
                        joystickActive = false;
                        joystickKnob.style.transform = 'translate(-50%, -50%)';
                        joystickInput = {x: 0, y: 0, active: false};
                        break;
                    }
                }
            } else {
                if (joystickActive) {
                    e.preventDefault();
                    joystickActive = false;
                    joystickKnob.style.transform = 'translate(-50%, -50%)';
                    joystickInput = {x: 0, y: 0, active: false};
                }
            }
            if (!joystickActive) joystickInput = {x: 0, y: 0, active: false};
        }
        joystickBase.addEventListener('mousedown', handleJoystickStart);
        joystickBase.addEventListener('touchstart', handleJoystickStart, true);
        document.addEventListener('mousemove', handleJoystickMove);
        document.addEventListener('touchmove', handleJoystickMove, true);
        document.addEventListener('mouseup', handleJoystickEnd);
        document.addEventListener('touchend', handleJoystickEnd, true);

        actionBtn.addEventListener('mousedown', e => {
            e.preventDefault();
            e.stopPropagation();
            actionBtnPressed = true;
        });
        actionBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            e.stopPropagation();
            actionBtnPressed = true;
        });
        actionBtn.addEventListener('mouseup', e => {
            e.preventDefault();
            e.stopPropagation();
            actionBtnPressed = false;
        });
        actionBtn.addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            actionBtnPressed = false;
        });
        interactHint.addEventListener('mousedown', e => {
            e.preventDefault();
            e.stopPropagation();
            interactHintPressed = true;
        });
        interactHint.addEventListener('touchstart', e => {
            e.preventDefault();
            e.stopPropagation();
            interactHintPressed = true;
        });
        interactHint.addEventListener('mouseup', e => {
            e.preventDefault();
            e.stopPropagation();
            interactHintPressed = false;
        });
        interactHint.addEventListener('touchend', e => {
            e.preventDefault();
            e.stopPropagation();
            interactHintPressed = false;
        });
        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;
            update(dt);
            render();
            requestAnimationFrame(gameLoop);
        }
        initWorld();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
