<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神器传说：炼器开箱</title>
<style>
    /* 基础样式，模拟仙侠风和手机屏幕比例 */
    body {
        margin: 0;
        padding: 0;
        background-color: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Microsoft YaHei", sans-serif;
        color: #333;
    }
    #game-container {
        width: 100%;
        max-width: 400px;
        height: 100vh;
        max-height: 800px;
        background: linear-gradient(135deg, #c4e0e5, #4ca1af); /* 水墨青色背景 */
        position: relative;
        overflow-y: auto;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    /* 顶部信息栏 */
    header {
        background: rgba(0, 0, 0, 0.2);
        padding: 15px;
        display: flex;
        justify-content: space-between;
        color: #fff;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
    }
    .stat-item {
        font-size: 16px;
    }
    /* 炼器炉主区域 */
    #main-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px 0;
    }
    #cauldron {
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, #f39c12, #d35400);
        border-radius: 20px 20px 50px 50px;
        border: 4px solid #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 50px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        margin-bottom: 30px;
        transition: transform 0.1s;
    }
    .shake {
        animation: shake 0.3s;
    }
    @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        20% { transform: translate(-3px, 0px) rotate(5deg); }
        40% { transform: translate(1px, -1px) rotate(-5deg); }
        60% { transform: translate(-1px, 2px) rotate(0deg); }
        80% { transform: translate(3px, -1px) rotate(5deg); }
        100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    /* 按钮组 */
    .btn-group {
        display: flex;
        gap: 15px;
    }
    button {
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        border: 2px solid #8e44ad;
        border-radius: 8px;
        background: linear-gradient(to bottom, #f1c40f, #f39c12);
        color: #fff;
        cursor: pointer;
        text-shadow: 1px 1px 2px #d35400;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    button:active {
        transform: translateY(2px);
        box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    button:disabled {
        background: #ccc;
        border-color: #999;
        color: #666;
        cursor: not-allowed;
    }
    /* 背包/展示区 */
    #inventory-section {
        padding: 15px;
    }
    h3 {
        text-align: center;
        color: #fff;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        margin-top: 0;
    }
    #inventory {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }
    .item-slot {
        background: rgba(255, 255, 255, 0.7);
        border: 2px solid #ccc;
        border-radius: 8px;
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 12px;
        position: relative;
        overflow: hidden;
    }
    .item-icon {
        font-size: 24px;
        margin-bottom: 5px;
    }
    .item-level {
        position: absolute;
        bottom: 2px;
        background: rgba(0,0,0,0.6);
        color: #fff;
        width: 100%;
        text-align: center;
        font-size: 10px;
    }
    /* 稀有度颜色 */
    .rarity-1 { border-color: #bdc3c7; background: #ecf0f1; } /* 普通 白 */
    .rarity-2 { border-color: #2ecc71; background: #e8f8f5; } /* 优秀 绿 */
    .rarity-3 { border-color: #3498db; background: #ebf5fb; } /* 精良 蓝 */
    .rarity-4 { border-color: #9b59b6; background: #f5eef8; } /* 史诗 紫 */
    .rarity-5 { border-color: #f1c40f; background: #fef9e7; box-shadow: 0 0 10px #f1c40f; } /* 传说 金 */
    .rarity-6 { border-color: #e74c3c; background: #fdedec; box-shadow: 0 0 15px #e74c3c; } /* 神话 红 */
    
    /* 消息提示框 */
    #message-box {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 10px 20px;
        border-radius: 10px;
        display: none;
        text-align: center;
        z-index: 10;
        width: 80%;
    }
</style>
</head>
<body>

<div id="game-container">
    <header>
        <div class="stat-item">💰 灵石: <span id="coins">5000</span></div>
        <div class="stat-item">⚔️ 战力: <span id="power">0</span></div>
    </header>

    <div id="main-area">
        <div id="cauldron">🔥</div>
        <div class="btn-group">
            <button id="btn-single" onclick="unbox(1)">炼器 (100灵石)</button>
            <button id="btn-ten" onclick="unbox(10)">十连 (1000灵石)</button>
        </div>
    </div>

    <div id="inventory-section">
        <h3>我的法宝</h3>
        <div id="inventory">
            <!-- 物品槽位将通过 JS 动态生成 -->
        </div>
    </div>

    <div id="message-box"></div>
</div>

<script>
    // 游戏数据
    let state = {
        coins: 5000,
        power: 0,
        inventory: []
    };

    // 物品库与稀有度配置
    const rarities = [
        { level: 1, name: "普通", color: "白", weight: 450, basePower: 10 },
        { level: 2, name: "优秀", color: "绿", weight: 300, basePower: 50 },
        { level: 3, name: "精良", color: "蓝", weight: 150, basePower: 200 },
        { level: 4, name: "史诗", color: "紫", weight: 70,  basePower: 800 },
        { level: 5, name: "传说", color: "金", weight: 25,  basePower: 3000 },
        { level: 6, name: "神话", color: "红", weight: 5,   basePower: 10000 }
    ];

    const itemsDB = [
        { icon: "🗡️", names: ["铁剑", "青锋剑", "寒冰剑", "紫雷剑", "太阿剑", "诛仙剑"] },
        { icon: "👕", names: ["布衣", "皮甲", "玄铁甲", "幽冥铠", "金丝软甲", "天帝道袍"] },
        { icon: "💍", names: ["草指环", "玉扳指", "凝神戒", "空间戒", "乾坤戒", "造化神戒"] },
        { icon: "📜", names: ["残卷", "吐纳法", "御剑术", "天雷诀", "八荒功", "大品天仙决"] },
        { icon: "🕷️", names: ["黑蛛", "毒蛛", "鬼面蛛", "紫魔蛛", "金甲蛛王", "血色神蛛"] }
    ];

    // 更新UI
    function updateUI() {
        document.getElementById('coins').innerText = state.coins;
        document.getElementById('power').innerText = state.power;
        
        const invDiv = document.getElementById('inventory');
        invDiv.innerHTML = '';
        
        // 倒序显示，最新获得的在最前面
        [...state.inventory].reverse().forEach(item => {
            const div = document.createElement('div');
            div.className = `item-slot rarity-${item.rarity}`;
            div.innerHTML = `
                <div class="item-icon">${item.icon}</div>
                <div style="font-size: 10px; text-align: center;">${item.name}</div>
                <div class="item-level">Lv.${item.level}</div>
            `;
            invDiv.appendChild(div);
        });
    }

    // 随机获取物品算法 (带权重)
    function getRandomItem() {
        // 计算总权重
        let totalWeight = rarities.reduce((sum, r) => sum + r.weight, 0);
        let randomNum = Math.random() * totalWeight;
        
        // 确定稀有度
        let currentWeight = 0;
        let selectedRarity = rarities[0];
        for (let r of rarities) {
            currentWeight += r.weight;
            if (randomNum <= currentWeight) {
                selectedRarity = r;
                break;
            }
        }

        // 随机选择种类
        let type = itemsDB[Math.floor(Math.random() * itemsDB.length)];
        
        // 生成最终物品
        // 等级随机浮动
        let itemLevel = selectedRarity.level * 20 + Math.floor(Math.random() * 20); 
        let powerCalc = selectedRarity.basePower + (itemLevel * selectedRarity.level * 2);

        return {
            icon: type.icon,
            name: type.names[selectedRarity.level - 1], // 根据稀有度给名字
            rarity: selectedRarity.level,
            level: itemLevel,
            power: powerCalc
        };
    }

    // 显示提示消息
    function showMessage(text) {
        const msgBox = document.getElementById('message-box');
        msgBox.innerHTML = text;
        msgBox.style.display = 'block';
        setTimeout(() => {
            msgBox.style.display = 'none';
        }, 1500);
    }

    // 炼器核心逻辑
    function unbox(times) {
        const cost = times * 100;
        if (state.coins < cost) {
            showMessage("灵石不足！");
            return;
        }

        // 动画效果
        const cauldron = document.getElementById('cauldron');
        cauldron.classList.add('shake');
        setTimeout(() => cauldron.classList.remove('shake'), 300);

        // 扣除资源
        state.coins -= cost;

        let newItems = [];
        let addedPower = 0;
        let highestRarity = 1;

        for (let i = 0; i < times; i++) {
            let item = getRandomItem();
            newItems.push(item);
            state.inventory.push(item);
            addedPower += item.power;
            if (item.rarity > highestRarity) highestRarity = item.rarity;
        }

        // 战力增加
        state.power += addedPower;

        // 特效提示 (如果抽到紫金红)
        if (highestRarity >= 4) {
            showMessage(`✨ 祥云涌动！获得了高阶神器！战力暴涨 ${addedPower}`);
        }

        updateUI();
    }

    // 初始化界面
    updateUI();
</script>

</body>
</html>
