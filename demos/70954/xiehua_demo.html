<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「卸话」偏见卸妆师</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  color: #e8e8e8;
  overflow-x: hidden;
}

.mirror-frame {
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, #2a2a4a 0%, #1a1a3a 60%, #0a0a2a 100%);
  border: 12px solid #d4af37;
  box-shadow: 
    0 0 60px rgba(212, 175, 55, 0.3),
    inset 0 0 100px rgba(0,0,0,0.5),
    0 20px 60px rgba(0,0,0,0.5);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

.mirror-frame::before {
  content: '';
  position: absolute;
  top: 30px;
  left: 50px;
  width: 150px;
  height: 200px;
  background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
  border-radius: 50%;
  transform: rotate(-30deg);
  pointer-events: none;
}

.mirror-content {
  text-align: center;
  padding: 40px;
  max-width: 450px;
}

.input-mirror {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(212, 175, 55, 0.3);
  border-radius: 20px;
  padding: 20px;
  font-size: 18px;
  color: #fff;
  text-align: center;
  outline: none;
  transition: all 0.3s;
  font-family: 'Noto Sans SC', sans-serif;
  resize: none;
}

.input-mirror:focus {
  border-color: #d4af37;
  box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
}

.input-mirror::placeholder {
  color: rgba(255,255,255,0.4);
}

.preset-btn {
  background: rgba(212, 175, 55, 0.15);
  border: 1px solid rgba(212, 175, 55, 0.4);
  color: #d4af37;
  padding: 10px 20px;
  border-radius: 25px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  font-family: 'Noto Sans SC', sans-serif;
}

.preset-btn:hover {
  background: rgba(212, 175, 55, 0.3);
  transform: translateY(-2px);
}

.analyze-btn {
  background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
  color: #1a1a2e;
  border: none;
  padding: 15px 50px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.3s;
  font-family: 'Noto Sans SC', sans-serif;
}

.analyze-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
}

.text-display {
  font-size: 28px;
  line-height: 1.8;
  margin: 30px 0;
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
}

.word {
  display: inline-block;
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  cursor: pointer;
}

.word.spike::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-bottom: 8px solid #e74c3c;
  animation: spikeGrow 0.5s forwards;
}

@keyframes spikeGrow {
  to { opacity: 1; }
}

.ear-slider {
  width: 300px;
  margin: 30px auto;
  position: relative;
}

.ear-slider input[type="range"] {
  width: 100%;
  -webkit-appearance: none;
  height: 8px;
  border-radius: 4px;
  background: linear-gradient(to right, #3498db, #e74c3c);
  outline: none;
}

.ear-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #fff;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.ear-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
  font-size: 14px;
  color: rgba(255,255,255,0.7);
}

.agent-panel {
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px;
  margin: 15px 0;
  border-left: 4px solid;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.5s;
}

.agent-panel.visible {
  opacity: 1;
  transform: translateY(0);
}

.agent-panel.intent { border-color: #f39c12; }
.agent-panel.echo { border-color: #9b59b6; }
.agent-panel.detective { border-color: #3498db; }
.agent-panel.empathy { border-color: #2ecc71; }
.agent-panel.rewrite { border-color: #f1c40f; }

.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 36px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #d4af37, #f4d03f);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.slogan {
  text-align: center;
  font-size: 16px;
  color: rgba(255,255,255,0.6);
  margin: 20px 0 40px;
  font-style: italic;
}

.preset-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 20px 0;
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid rgba(212, 175, 55, 0.3);
  border-top-color: #d4af37;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.hidden { display: none !important; }

.rewrite-card {
  background: rgba(241, 196, 15, 0.1);
  border: 1px solid rgba(241, 196, 15, 0.3);
  border-radius: 12px;
  padding: 15px;
  margin: 10px 0;
}

.rewrite-bad {
  color: #e74c3c;
  text-decoration: line-through;
  opacity: 0.7;
}

.rewrite-good {
  color: #2ecc71;
  font-weight: 500;
}

.tooltip {
  position: absolute;
  background: rgba(0,0,0,0.9);
  color: #fff;
  padding: 10px 15px;
  border-radius: 8px;
  font-size: 14px;
  max-width: 250px;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  bottom: 120%;
  left: 50%;
  transform: translateX(-50%);
}

.word:hover .tooltip {
  opacity: 1;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;
}

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  margin-top: 40px;
}

@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
  .mirror-frame { width: 350px; height: 350px; }
}
</style>
</head>
<body>

<div class="container">
  <h1 class="section-title">「卸话」偏见卸妆师</h1>
  <p class="slogan">你的话，在别人耳中是什么样子？</p>

  <div id="stage1">
    <div class="mirror-frame">
      <div class="mirror-content">
        <textarea id="inputText" class="input-mirror" rows="3" placeholder="把你想说但怕说不对的话，写在这里..."></textarea>
        <div class="preset-grid">
          <button class="preset-btn" onclick="usePreset('你一个女生写代码居然这么厉害')">💬 "你一个女生/男生怎么..."</button>
          <button class="preset-btn" onclick="usePreset('我都是为你好')">💬 "我都是为你好"</button>
          <button class="preset-btn" onclick="usePreset('我说话直你别介意')">💬 "我说话直你别介意"</button>
          <button class="preset-btn" onclick="usePreset('你太年轻了不懂')">💬 "你太年轻了不懂"</button>
        </div>
        <button class="analyze-btn" onclick="startAnalyze()">✨ 开始卸妆</button>
      </div>
    </div>
  </div>

  <div id="stage2" class="hidden">
    <div class="mirror-frame" style="width: 500px; height: 500px;">
      <div class="mirror-content">
        <div class="text-display" id="textDisplay"></div>
        <div class="ear-slider">
          <input type="range" id="earSlider" min="0" max="100" value="0" oninput="updateEarView(this.value)">
          <div class="ear-labels">
            <span>👂 我的耳朵</span>
            <span>👂 TA的耳朵</span>
          </div>
        </div>
      </div>
    </div>

    <div class="two-col">
      <div>
        <h3 class="text-xl font-bold mb-4" style="color: #d4af37;">🔍 五视角深度拆解</h3>
        <div id="agentPanels"></div>
      </div>
      <div>
        <h3 class="text-xl font-bold mb-4" style="color: #d4af37;">✨ 善意重构</h3>
        <div id="rewritePanel"></div>
        <button class="preset-btn mt-4" onclick="reset()">🔄 再来一句</button>
      </div>
    </div>
  </div>
</div>

<script>
const presetAnalyses = {
  '你一个女生写代码居然这么厉害': {
    words: [
      { text: '你', type: 'normal' },
      { text: '一个', type: 'normal' },
      { text: '女生', type: 'spike', color: '#e74c3c', tip: '将能力与性别绑定，暗示"女生整体不行"' },
      { text: '写', type: 'normal' },
      { text: '代码', type: 'normal' },
      { text: '居然', type: 'twist', color: '#e67e22', tip: "'居然'意味着预设了低预期，惊讶大于认可" },
      { text: '这么', type: 'normal' },
      { text: '厉害', type: 'sugar', color: '#f1c40f', tip: '你的善意是真心的，但被前面的词硌到了' },
    ],
    panels: [
      { type: 'intent', icon: '🎭', title: '本意卸妆棉', color: '#f39c12', content: '你想夸她能力强、为她高兴，这是真心的。你没有任何恶意，你是真的觉得她做得好。' },
      { type: 'echo', icon: '💔', title: '回声放大镜', color: '#9b59b6', content: '她听到的可能是："女生本来写不好代码，你是个例外。"如果你说"你代码写得真好"，她听到的就是纯粹的夸奖。加上"女生"和"居然"，味道就变了。' },
      { type: 'detective', icon: '🔍', title: '微偏见镊子', color: '#3498db', content: '逐字拆解：①"女生"将能力与性别绑定 ②"居然"暗示了低预期 ③"厉害"是真心夸奖——三个词组合，你肯定的是"她是例外"，而不是"她这个人厉害"。' },
      { type: 'empathy', icon: '🌍', title: '换位梳妆台', color: '#2ecc71', content: '想象一下：如果你从小到大每次做得好，别人都说"你一个男生居然这么细心""你一个理科生文笔居然这么好"——前半句永远在提醒你"你不属于这里"，你会是什么感受？' },
    ],
    rewrites: [
      { bad: '你一个女生写代码居然这么厉害', good: '你代码写得真厉害！', note: '最简版：去掉性别词，夸奖直达' },
      { bad: '', good: '这段异常处理写得太漂亮了，怎么想到的？', note: '具体版：夸具体细节，比泛泛夸奖真诚10倍' },
      { bad: '', good: '你这个思路太清晰了，以后多带带大家', note: '鼓励版：把"例外"变成"榜样"' },
    ]
  },
  '我都是为你好': {
    words: [
      { text: '我', type: 'normal' },
      { text: '都', type: 'normal' },
      { text: '是', type: 'normal' },
      { text: '为', type: 'normal' },
      { text: '你', type: 'normal' },
      { text: '好', type: 'sugar', color: '#f1c40f', tip: '外面是糖衣' },
    ],
    panels: [
      { type: 'intent', icon: '🎭', title: '本意卸妆棉', color: '#f39c12', content: '你是真的关心对方，怕对方走弯路、受伤害，你的出发点是爱和在乎。' },
      { type: 'echo', icon: '💔', title: '回声放大镜', color: '#9b59b6', content: '对方听到的是："我比你懂，你必须听我的，你的感受不重要。"这句话一出口，后面所有的道理对方都听不进去了。' },
      { type: 'detective', icon: '🔍', title: '微偏见镊子', color: '#3498db', content: '这句话的潜台词是：①我知道什么对你好 ②你不知道 ③所以你要听我的——它否定了对方的自主选择权，把关心变成了控制。' },
      { type: 'empathy', icon: '🌍', title: '换位梳妆台', color: '#2ecc71', content: '回忆一下小时候父母对你说"我都是为你好"的时候，你感受到的是爱还是压力？你想给对方的，是那种喘不过气的感觉吗？' },
    ],
    rewrites: [
      { bad: '我都是为你好，你必须听我的', good: '我有点担心你，要不要聊聊我的想法？', note: '把命令变成关心，把"必须"变成"要不要"' },
      { bad: '', good: '这件事我之前踩过坑，如果你想听我可以说说经验', note: '提供经验而不是下达指令，选择权还给对方' },
    ]
  },
  '我说话直你别介意': {
    words: [
      { text: '我', type: 'normal' },
      { text: '说话', type: 'normal' },
      { text: '直', type: 'spike', color: '#e74c3c', tip: '提前声明：我接下来要伤害你了' },
      { text: '你', type: 'normal' },
      { text: '别', type: 'twist', color: '#e67e22', tip: '不是请求，是命令你不准介意' },
      { text: '介意', type: 'normal' },
    ],
    panels: [
      { type: 'intent', icon: '🎭', title: '本意卸妆棉', color: '#f39c12', content: '你可能觉得自己是真诚、不绕弯子、不玩心机，想让对方知道你没有恶意。' },
      { type: 'echo', icon: '💔', title: '回声放大镜', color: '#9b59b6', content: '对方听到的是："我接下来要说难听话了，而且你不准生气，生气就是你小心眼。"这是一份"伤害预告+免责声明"。' },
      { type: 'detective', icon: '🔍', title: '微偏见镊子', color: '#3498db', content: '这句话的问题在于：①它先说"我要伤害你"再说"你不准介意" ②把"没礼貌"包装成"直爽" ③剥夺了对方生气的权利。' },
      { type: 'empathy', icon: '🌍', title: '换位梳妆台', color: '#2ecc71', content: '如果有人对你说"我说话直你别介意"，你是不是已经开始紧张了？你知道接下来不会是什么好话，而且还不能生气——这种感觉舒服吗？' },
    ],
    rewrites: [
      { bad: '我说话直你别介意，你这个方案做得真烂', good: '这个方案我有些不同想法，能说说吗？', note: '把"直"变成"讨论"，对事不对人' },
      { bad: '', good: '有句话不知道该不该说，我觉得...（说完问）你觉得呢？', note: '用商量的语气，给对方回应的空间' },
    ]
  },
  '你太年轻了不懂': {
    words: [
      { text: '你', type: 'normal' },
      { text: '太', type: 'spike', color: '#e74c3c', tip: '强调程度，暗含否定' },
      { text: '年轻', type: 'normal' },
      { text: '了', type: 'normal' },
      { text: '不懂', type: 'twist', color: '#e67e22', tip: '直接否定对方的认知能力' },
    ],
    panels: [
      { type: 'intent', icon: '🎭', title: '本意卸妆棉', color: '#f39c12', content: '你可能是想分享经验，觉得自己走过的弯路对方没必要再走，是善意的提醒。' },
      { type: 'echo', icon: '💔', title: '回声放大镜', color: '#9b59b6', content: '对方听到的是："你太小了，没资格跟我讨论这个，我说什么你听着就行。"这句话一出来，讨论就结束了，只剩下居高临下的说教。' },
      { type: 'detective', icon: '🔍', title: '微偏见镊子', color: '#3498db', content: '这句话的逻辑谬误：①把年龄和能力直接挂钩 ②否定对方的思考能力 ③拒绝讨论直接下结论——年龄大不等于一定对，年轻不等于一定错。' },
      { type: 'empathy', icon: '🌍', title: '换位梳妆台', color: '#2ecc71', content: '你年轻的时候，有没有年长的人跟你说过这句话？你当时是心服口服，还是觉得对方根本不了解你就下判断？' },
    ],
    rewrites: [
      { bad: '你太年轻了不懂', good: '我在这件事上有些经验，要不要听听？', note: '分享经验而不是否定对方' },
      { bad: '', good: '你这个角度挺有意思，我之前没这么想过。不过我有个顾虑...', note: '先肯定对方，再提出你的想法，平等交流' },
    ]
  }
};

function usePreset(text) {
  document.getElementById('inputText').value = text;
}

function startAnalyze() {
  const text = document.getElementById('inputText').value.trim();
  if (!text) {
    alert('请先输入一句话，或点击下方预设体验');
    return;
  }

  const analysis = presetAnalyses[text] || generateGenericAnalysis(text);
  
  document.getElementById('stage1').classList.add('hidden');
  document.getElementById('stage2').classList.remove('hidden');
  
  renderTextDisplay(analysis.words);
  renderPanels(analysis.panels);
  renderRewrites(analysis.rewrites);
}

function generateGenericAnalysis(text) {
  return {
    words: text.split('').map(c => ({ text: c, type: 'normal' })),
    panels: [
      { type: 'intent', icon: '🎭', title: '本意卸妆棉', color: '#f39c12', content: '（完整Demo接入LLM后将显示你的真实本意分析）你说这句话一定有你的理由和善意。' },
      { type: 'echo', icon: '💔', title: '回声放大镜', color: '#9b59b6', content: '（完整Demo接入LLM后将显示对方视角的感受分析）' },
      { type: 'detective', icon: '🔍', title: '微偏见镊子', color: '#3498db', content: '（完整Demo接入LLM后将逐字拆解可能存在的刻板印象和预设）' },
      { type: 'empathy', icon: '🌍', title: '换位梳妆台', color: '#2ecc71', content: '（完整Demo接入LLM后将引导你换位思考）' },
    ],
    rewrites: [
      { bad: text, good: '（完整Demo将提供3个善意重构版本）', note: '接入LLM后自动生成' }
    ]
  };
}

function renderTextDisplay(words) {
  const container = document.getElementById('textDisplay');
  container.innerHTML = '';
  words.forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w.text;
    span.dataset.type = w.type;
    span.dataset.color = w.color || '';
    span.dataset.tip = w.tip || '';
    
    if (w.tip) {
      const tip = document.createElement('div');
      tip.className = 'tooltip';
      tip.textContent = w.tip;
      span.appendChild(tip);
    }
    
    container.appendChild(span);
  });
  
  setTimeout(() => updateEarView(0), 100);
}

function updateEarView(value) {
  const ratio = value / 100;
  const words = document.querySelectorAll('.word');
  
  words.forEach(word => {
    const type = word.dataset.type;
    const color = word.dataset.color;
    
    word.style.transform = '';
    word.style.color = '';
    word.style.opacity = '';
    word.classList.remove('spike');
    
    if (type === 'spike') {
      word.style.color = ratio > 0.3 ? color : '';
      word.style.fontWeight = ratio > 0.5 ? 'bold' : '';
      if (ratio > 0.6) word.classList.add('spike');
    } else if (type === 'twist') {
      word.style.color = ratio > 0.4 ? color : '';
      word.style.transform = ratio > 0.5 ? `rotate(${ratio * 15}deg) scale(${1 + ratio * 0.3})` : '';
    } else if (type === 'sugar') {
      if (ratio > 0.7) {
        word.style.opacity = 0.5;
        word.style.textDecoration = 'line-through';
        word.style.textDecorationColor = '#e74c3c';
      }
    }
  });
}

function renderPanels(panels) {
  const container = document.getElementById('agentPanels');
  container.innerHTML = '';
  
  panels.forEach((p, i) => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = `agent-panel ${p.type}`;
      div.style.borderLeftColor = p.color;
      div.innerHTML = `
        <div class="flex items-start gap-3">
          <span class="text-2xl">${p.icon}</span>
          <div>
            <h4 class="font-bold mb-2" style="color: ${p.color}">${p.title}</h4>
            <p class="text-gray-300 text-sm leading-relaxed">${p.content}</p>
          </div>
        </div>
      `;
      container.appendChild(div);
      setTimeout(() => div.classList.add('visible'), 50);
    }, i * 600);
  });
}

function renderRewrites(rewrites) {
  const container = document.getElementById('rewritePanel');
  container.innerHTML = '';
  
  setTimeout(() => {
    rewrites.forEach((r, i) => {
      setTimeout(() => {
        const div = document.createElement('div');
        div.className = 'rewrite-card';
        div.style.opacity = '0';
        div.style.transform = 'translateY(10px)';
        div.style.transition = 'all 0.5s';
        div.innerHTML = `
          ${r.bad ? `<div class="rewrite-bad mb-2">❌ ${r.bad}</div>` : ''}
          <div class="rewrite-good mb-1">✅ ${r.good}</div>
          <div class="text-xs text-gray-400">💡 ${r.note}</div>
        `;
        container.appendChild(div);
        setTimeout(() => {
          div.style.opacity = '1';
          div.style.transform = 'translateY(0)';
        }, 50);
      }, i * 400);
    });
  }, panels.length * 600 + 500);
}

function reset() {
  document.getElementById('stage1').classList.remove('hidden');
  document.getElementById('stage2').classList.add('hidden');
  document.getElementById('inputText').value = '';
  document.getElementById('earSlider').value = 0;
}
</script>

</body>
</html>
