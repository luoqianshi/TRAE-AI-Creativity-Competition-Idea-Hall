<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食光笔记</title>
    <style id="theme-vars">
:root {
  /* === Brand Color System === */
  --color-primary: #2D8B4E;
  --color-primary-light: #3DA863;
  --color-primary-dark: #236B3D;
  --color-primary-50: #E8F5EC;
  --color-primary-100: #C8E6D0;
  --color-primary-200: #A3D5AF;
  --color-primary-300: #7BC48C;
  --color-primary-400: #5BB86E;
  --color-primary-500: #2D8B4E;
  --color-primary-600: #267A44;
  --color-primary-700: #1F693A;
  --color-primary-800: #185830;
  --color-primary-900: #0F3E22;

  /* === Warm Accent (for food/energy warmth) === */
  --color-warm: #F59E42;
  --color-warm-light: #FBBF24;
  --color-warm-dark: #E88D2C;
  --color-warm-50: #FFF8EB;
  --color-warm-100: #FFECC6;
  --color-warm-200: #FFDC9D;
  --color-warm-300: #FFC76B;
  --color-warm-400: #FFB342;
  --color-warm-500: #F59E42;
  --color-warm-600: #E88D2C;
  --color-warm-700: #CC7A20;
  --color-warm-800: #A16218;
  --color-warm-900: #7A4A12;

  /* === Neutral Palette === */
  --color-bg: #FAFDF8;
  --color-bg-elevated: #FFFFFF;
  --color-bg-sunken: #F0F5EC;
  --color-text: #1A2E1F;
  --color-text-secondary: #4A6352;
  --color-text-tertiary: #7A9A82;
  --color-border: #D8E5DA;
  --color-border-light: #E8F0EA;

  /* === State Colors === */
  --state-success: #2D8B4E;
  --state-warning: #F59E42;
  --state-error: #DC4A4A;
  --state-info: #4A90C8;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadow System === */
  --shadow-sm: 0 1px 2px rgba(45, 139, 78, 0.03);
  --shadow-md: 0 2px 8px rgba(45, 139, 78, 0.04);
  --shadow-lg: 0 4px 16px rgba(45, 139, 78, 0.05);
  --shadow-float: 0 8px 32px rgba(45, 139, 78, 0.08);
}

/* === Typography System === */
.font-display {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}

.font-body {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
}

.text-hero {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: var(--color-text);
}

.text-h1 {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: clamp(1.5rem, 3.5vw, 2.25rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.01em;
  color: var(--color-text);
}

.text-h2 {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: clamp(1.125rem, 2.5vw, 1.75rem);
  font-weight: 600;
  line-height: 1.3;
  color: var(--color-text);
}

.text-h3 {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: clamp(1rem, 2vw, 1.25rem);
  font-weight: 600;
  line-height: 1.4;
  color: var(--color-text);
}

.text-body {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 1rem;
  font-weight: 400;
  line-height: 1.6;
  color: var(--color-text-secondary);
}

.text-small {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 0.875rem;
  font-weight: 400;
  line-height: 1.5;
  color: var(--color-text-tertiary);
}

.text-caption {
  font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 1.4;
  color: var(--color-text-tertiary);
}

/* === Component Tokens === */
.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.625rem 1.5rem;
  background: var(--color-primary);
  color: #FFFFFF;
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: 0.9375rem;
  font-weight: 600;
  border-radius: var(--radius-lg);
  border: none;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}

.btn-primary:hover {
  background: var(--color-primary-light);
  transform: translateY(-1px);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.625rem 1.5rem;
  background: var(--color-primary-50);
  color: var(--color-primary);
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: 0.9375rem;
  font-weight: 600;
  border-radius: var(--radius-lg);
  border: 1.5px solid var(--color-primary-200);
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.btn-secondary:hover {
  background: var(--color-primary-100);
  border-color: var(--color-primary-300);
}

.card {
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, transform 0.15s;
}

.card:hover {
  box-shadow: var(--shadow-md);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
  @layer components {
    .category-chip {
      @apply inline-flex items-center whitespace-nowrap px-4 py-2 text-sm font-medium rounded-full shrink-0 transition-colors duration-150 cursor-pointer;
    }
    .category-chip-active {
      background: var(--color-primary);
      color: #FFFFFF;
    }
    .category-chip-inactive {
      background: var(--color-bg-sunken);
      color: var(--color-text-secondary);
    }
    .category-chip-inactive:hover {
      background: var(--color-primary-50);
      color: var(--color-primary);
    }
    .food-card {
      @apply flex items-center rounded-lg border bg-[var(--color-bg-elevated)] p-3 transition-shadow duration-150 cursor-pointer;
      border-color: var(--color-border-light);
      border-left: 3px solid var(--color-primary);
    }
    .food-card:hover {
      box-shadow: var(--shadow-md);
    }
    .calorie-pill {
      @apply inline-flex items-center whitespace-nowrap px-2.5 py-0.5 text-xs font-semibold rounded-full;
      background: var(--color-warm-50);
      color: var(--color-warm-700);
    }
    .recent-item {
      @apply flex items-center gap-3 rounded-lg border bg-[var(--color-bg-elevated)] p-3 transition-shadow duration-150 cursor-pointer;
      border-color: var(--color-border-light);
    }
    .recent-item:hover {
      box-shadow: var(--shadow-md);
    }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg);">

    <!-- Shared App Header -->
    <header class="sticky top-0 z-30 border-b border-[var(--color-border-light)] bg-[var(--color-bg)]/95 backdrop-blur">
      <div class="flex h-14 max-w-md mx-auto items-center px-4">
        <!-- Left: Leaf Icon -->
        <div class="flex w-10 items-center justify-start">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.5 19 2c1 2 2 4.5 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <!-- Center: App Name -->
        <div class="min-w-0 flex-1 text-center">
          <span class="text-[17px] font-semibold tracking-[-0.02em] truncate" style="color: var(--color-text);">食光笔记</span>
        </div>
        <!-- Right: Date Display -->
        <div class="flex w-10 items-center justify-end">
          <span class="text-caption whitespace-nowrap" style="color: var(--color-text-tertiary);">6月26日</span>
        </div>
      </div>
    </header>

    <!-- Page Sub-Header with Back Button -->
    <div class="sticky top-14 z-20 bg-[var(--color-bg)]/95 backdrop-blur">
      <div class="flex h-12 max-w-md mx-auto items-center px-4 gap-2">
        <button data-dom-id="btn-back" class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--color-border-light)] bg-[var(--color-bg-elevated)] transition-colors hover:bg-[var(--color-primary-50)]" aria-label="返回">
          <i data-lucide="chevron-left" class="h-4 w-4" style="color: var(--color-text);"></i>
        </button>
        <span class="text-[16px] font-semibold tracking-[-0.01em]" style="color: var(--color-text);">添加食物</span>
      </div>
    </div>

    <!-- Page Main Content -->
    <main class="max-w-md mx-auto px-4 pb-6">

        <!-- Section 1: Search Bar -->
        <section class="mt-4 mb-5">
          <div class="relative">
            <div class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2">
              <i data-lucide="search" class="h-5 w-5" style="color: var(--color-text-tertiary);"></i>
            </div>
            <input
              type="text"
              placeholder="搜索食物，如「鸡胸肉」「米饭」"
              class="w-full rounded-full border bg-[var(--color-bg-sunken)] py-3.5 pl-12 pr-4 text-[15px] placeholder:text-[var(--color-text-tertiary)] focus:border-[var(--color-primary)] focus:bg-[var(--color-bg-elevated)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary-100)] transition-colors"
              style="border-color: var(--color-border-light); color: var(--color-text);"
            />
          </div>
        </section>

        <!-- Section 2: Food Category Chips -->
        <section class="mb-6">
          <div class="flex flex-nowrap gap-2 overflow-x-auto no-scrollbar -mx-4 px-4">
            <span class="category-chip category-chip-active">全部</span>
            <span class="category-chip category-chip-inactive">主食</span>
            <span class="category-chip category-chip-inactive">蔬菜</span>
            <span class="category-chip category-chip-inactive">肉类</span>
            <span class="category-chip category-chip-inactive">水果</span>
            <span class="category-chip category-chip-inactive">奶制品</span>
            <span class="category-chip category-chip-inactive">饮品</span>
            <span class="category-chip category-chip-inactive">零食</span>
          </div>
        </section>

        <!-- Section 3: Recently Added -->
        <section class="mb-6">
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="clock" class="h-4 w-4" style="color: var(--color-text-tertiary);"></i>
            <h2 class="text-[15px] font-semibold" style="color: var(--color-text);">最近添加</h2>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <!-- Recent Item 1 -->
            <div class="recent-item flex-col !gap-1.5 !p-2.5">
              <div class="flex items-center justify-between w-full">
                <span class="text-[14px] font-semibold truncate" style="color: var(--color-text);">牛奶</span>
                <span class="calorie-pill">165千卡</span>
              </div>
              <span class="text-[12px] truncate" style="color: var(--color-text-tertiary);">250ml</span>
            </div>
            <!-- Recent Item 2 -->
            <div class="recent-item flex-col !gap-1.5 !p-2.5">
              <div class="flex items-center justify-between w-full">
                <span class="text-[14px] font-semibold truncate" style="color: var(--color-text);">全麦面包</span>
                <span class="calorie-pill">180千卡</span>
              </div>
              <span class="text-[12px] truncate" style="color: var(--color-text-tertiary);">2片</span>
            </div>
            <!-- Recent Item 3 -->
            <div class="recent-item flex-col !gap-1.5 !p-2.5">
              <div class="flex items-center justify-between w-full">
                <span class="text-[14px] font-semibold truncate" style="color: var(--color-text);">鸡蛋</span>
                <span class="calorie-pill">78千卡</span>
              </div>
              <span class="text-[12px] truncate" style="color: var(--color-text-tertiary);">1个</span>
            </div>
          </div>
        </section>

        <!-- Section 4: Popular Foods -->
        <section>
          <div class="flex items-center gap-2 mb-3">
            <i data-lucide="flame" class="h-4 w-4" style="color: var(--color-warm);"></i>
            <h2 class="text-[15px] font-semibold" style="color: var(--color-text);">热门食物</h2>
          </div>
          <div class="flex flex-col gap-2">
            <!-- Food Item 1 -->
            <div class="food-card">
              <div class="flex-1 min-w-0">
                <span class="text-[15px] font-semibold truncate block" style="color: var(--color-text);">白米饭</span>
                <span class="text-[13px] truncate block" style="color: var(--color-text-tertiary);">1碗(200g)</span>
              </div>
              <div class="flex items-center gap-2 shrink-0 ml-2">
                <span class="calorie-pill">232千卡</span>
                <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--color-primary-50)] transition-colors hover:bg-[var(--color-primary)]" aria-label="添加白米饭">
                  <i data-lucide="plus" class="h-4 w-4" style="color: var(--color-primary);"></i>
                </button>
              </div>
            </div>
            <!-- Food Item 2 -->
            <div class="food-card">
              <div class="flex-1 min-w-0">
                <span class="text-[15px] font-semibold truncate block" style="color: var(--color-text);">鸡胸肉</span>
                <span class="text-[13px] truncate block" style="color: var(--color-text-tertiary);">100g</span>
              </div>
              <div class="flex items-center gap-2 shrink-0 ml-2">
                <span class="calorie-pill">165千卡</span>
                <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--color-primary-50)] transition-colors hover:bg-[var(--color-primary)]" aria-label="添加鸡胸肉">
                  <i data-lucide="plus" class="h-4 w-4" style="color: var(--color-primary);"></i>
                </button>
              </div>
            </div>
            <!-- Food Item 3 -->
            <div class="food-card">
              <div class="flex-1 min-w-0">
                <span class="text-[15px] font-semibold truncate block" style="color: var(--color-text);">西兰花</span>
                <span class="text-[13px] truncate block" style="color: var(--color-text-tertiary);">100g</span>
              </div>
              <div class="flex items-center gap-2 shrink-0 ml-2">
                <span class="calorie-pill">34千卡</span>
                <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--color-primary-50)] transition-colors hover:bg-[var(--color-primary)]" aria-label="添加西兰花">
                  <i data-lucide="plus" class="h-4 w-4" style="color: var(--color-primary);"></i>
                </button>
              </div>
            </div>
            <!-- Food Item 4 -->
            <div class="food-card">
              <div class="flex-1 min-w-0">
                <span class="text-[15px] font-semibold truncate block" style="color: var(--color-text);">苹果</span>
                <span class="text-[13px] truncate block" style="color: var(--color-text-tertiary);">1个(200g)</span>
              </div>
              <div class="flex items-center gap-2 shrink-0 ml-2">
                <span class="calorie-pill">104千卡</span>
                <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--color-primary-50)] transition-colors hover:bg-[var(--color-primary)]" aria-label="添加苹果">
                  <i data-lucide="plus" class="h-4 w-4" style="color: var(--color-primary);"></i>
                </button>
              </div>
            </div>
            <!-- Food Item 5 -->
            <div class="food-card">
              <div class="flex-1 min-w-0">
                <span class="text-[15px] font-semibold truncate block" style="color: var(--color-text);">酸奶</span>
                <span class="text-[13px] truncate block" style="color: var(--color-text-tertiary);">200ml</span>
              </div>
              <div class="flex items-center gap-2 shrink-0 ml-2">
                <span class="calorie-pill">144千卡</span>
                <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--color-primary-50)] transition-colors hover:bg-[var(--color-primary)]" aria-label="添加酸奶">
                  <i data-lucide="plus" class="h-4 w-4" style="color: var(--color-primary);"></i>
                </button>
              </div>
            </div>
            <!-- Food Item 6 -->
            <div class="food-card">
              <div class="flex-1 min-w-0">
                <span class="text-[15px] font-semibold truncate block" style="color: var(--color-text);">三文鱼</span>
                <span class="text-[13px] truncate block" style="color: var(--color-text-tertiary);">100g</span>
              </div>
              <div class="flex items-center gap-2 shrink-0 ml-2">
                <span class="calorie-pill">208千卡</span>
                <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--color-primary-50)] transition-colors hover:bg-[var(--color-primary)]" aria-label="添加三文鱼">
                  <i data-lucide="plus" class="h-4 w-4" style="color: var(--color-primary);"></i>
                </button>
              </div>
            </div>
            <!-- Food Item 7 -->
            <div class="food-card">
              <div class="flex-1 min-w-0">
                <span class="text-[15px] font-semibold truncate block" style="color: var(--color-text);">燕麦粥</span>
                <span class="text-[13px] truncate block" style="color: var(--color-text-tertiary);">1碗</span>
              </div>
              <div class="flex items-center gap-2 shrink-0 ml-2">
                <span class="calorie-pill">150千卡</span>
                <button class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--color-primary-50)] transition-colors hover:bg-[var(--color-primary)]" aria-label="添加燕麦粥">
                  <i data-lucide="plus" class="h-4 w-4" style="color: var(--color-primary);"></i>
                </button>
              </div>
            </div>
          </div>
        </section>

    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
