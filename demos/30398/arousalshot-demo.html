<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清醒弹射器 ArousalShot — 产品概念演示</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;600;700&display=swap');

  :root {
    --bg: #1a1a2e;
    --bg-deep: #0f0f1e;
    --fg: #e0e0e0;
    --muted: #6a6a8a;
    --accent: #00ff88;
    --accent-dim: #00cc6a;
    --accent-glow: rgba(0, 255, 136, 0.3);
    --card: rgba(255, 255, 255, 0.04);
    --card-border: rgba(0, 255, 136, 0.12);
    --danger: #ff4466;
    --warn: #ffaa00;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 背景网格 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* 背景光晕 */
  body::after {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(0,255,136,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }

  /* ===== 顶部标题 ===== */
  .header {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeSlideDown 0.8s ease-out;
  }

  .brand-badge {
    display: inline-block;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--card-border);
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 14px;
    background: rgba(0,255,136,0.05);
  }

  .header h1 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 900;
    color: #fff;
    letter-spacing: 2px;
    line-height: 1.2;
  }

  .header h1 .sub {
    display: block;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: clamp(13px, 3.5vw, 16px);
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 6px;
    margin-top: 6px;
  }

  .header .tagline {
    font-size: 13px;
    color: var(--accent-dim);
    margin-top: 12px;
    font-weight: 300;
    letter-spacing: 1px;
  }

  /* ===== 产品外观区域 ===== */
  .product-section {
    margin-bottom: 28px;
    animation: fadeSlideDown 0.8s ease-out 0.15s both;
  }

  .section-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--card-border), transparent);
  }

  .product-visual {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
  }

  .product-visual::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center bottom, rgba(0,255,136,0.06), transparent 60%);
  }

  /* 出风口 */
  .vent {
    position: relative;
    width: 160px;
    height: 60px;
    border: 2px solid #3a3a5a;
    border-radius: 8px;
    background: linear-gradient(180deg, #2a2a44 0%, #222240 100%);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
  }

  .vent-slats {
    position: absolute;
    inset: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .vent-slat {
    height: 3px;
    background: linear-gradient(90deg, #1a1a30, #3a3a5a, #1a1a30);
    border-radius: 2px;
  }

  /* 夹具装置 */
  .device {
    position: absolute;
    bottom: -70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
  }

  .device-clip {
    width: 14px;
    height: 30px;
    background: linear-gradient(180deg, #555, #333);
    margin: 0 auto;
    border-radius: 0 0 4px 4px;
    position: relative;
  }

  .device-clip::before,
  .device-clip::after {
    content: '';
    position: absolute;
    top: 0;
    width: 6px;
    height: 100%;
    background: #444;
    border-radius: 2px;
  }

  .device-clip::before { left: -8px; }
  .device-clip::after { right: -8px; }

  .device-body {
    width: 52px;
    height: 80px;
    background: linear-gradient(135deg, #2d2d4a 0%, #1e1e38 50%, #2a2a48 100%);
    border: 1.5px solid var(--accent-dim);
    border-radius: 10px;
    margin: 0 auto;
    position: relative;
    box-shadow:
      0 0 20px rgba(0,255,136,0.15),
      0 4px 16px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  .device-body::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: radial-gradient(circle, rgba(0,255,136,0.2), transparent);
    animation: pulse-ring 2s ease-in-out infinite;
  }

  .device-body::after {
    content: '';
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 6px;
    background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
    border-radius: 3px;
  }

  .device-nozzle {
    width: 10px;
    height: 14px;
    background: linear-gradient(180deg, var(--accent-dim), #1a1a30);
    margin: 0 auto;
    border-radius: 3px 3px 0 0;
    position: relative;
    box-shadow: 0 -2px 8px rgba(0,255,136,0.2);
  }

  .device-label {
    position: absolute;
    bottom: -28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', monospace;
    font-size: 8px;
    color: var(--accent);
    letter-spacing: 2px;
    white-space: nowrap;
    opacity: 0.7;
  }

  /* 喷嘴粒子容器 */
  .spray-container {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    pointer-events: none;
    z-index: 10;
  }

  .spray-particle {
    position: absolute;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
  }

  @keyframes spray-burst {
    0% {
      opacity: 0.9;
      transform: translate(0, 0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx), var(--dy)) scale(0.2);
    }
  }

  /* ===== 计时器区域 ===== */
  .timer-section {
    margin-bottom: 28px;
    animation: fadeSlideDown 0.8s ease-out 0.3s both;
  }

  .timer-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .timer-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .timer-status {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.5s ease-in-out infinite;
  }

  .status-dot.idle { background: var(--muted); animation: none; }
  .status-dot.alert { background: var(--warn); }

  .timer-display {
    font-family: 'Orbitron', monospace;
    font-size: clamp(48px, 14vw, 72px);
    font-weight: 900;
    color: #fff;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 6px;
    text-shadow: 0 0 30px rgba(0,255,136,0.15);
  }

  .timer-label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
  }

  .timer-progress {
    margin-top: 20px;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .timer-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 2px;
    transition: width 0.5s linear;
    box-shadow: 0 0 8px var(--accent-glow);
  }

  .timer-progress-bar.warning {
    background: linear-gradient(90deg, var(--warn), var(--danger));
    box-shadow: 0 0 8px rgba(255,68,102,0.3);
  }

  /* 喷射提示 */
  .spray-alert {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(0,255,136,0.08);
    border: 1px solid rgba(0,255,136,0.2);
    border-radius: 10px;
    font-size: 13px;
    color: var(--accent);
    display: none;
    align-items: center;
    gap: 8px;
    animation: fadeSlideUp 0.4s ease-out;
  }

  .spray-alert.visible { display: flex; }

  .spray-alert-icon {
    font-size: 18px;
    flex-shrink: 0;
    animation: pulse-ring 1s ease-in-out infinite;
  }

  /* 手动触发按钮 */
  .manual-btn {
    margin-top: 16px;
    width: 100%;
    padding: 14px 24px;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .manual-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform 0.6s ease;
  }

  .manual-btn:hover::before { transform: translateX(100%); }
  .manual-btn:hover {
    box-shadow: 0 0 24px var(--accent-glow), 0 4px 16px rgba(0,0,0,0.3);
    transform: translateY(-1px);
  }

  .manual-btn:active {
    transform: translateY(0);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .manual-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ===== 数据面板 ===== */
  .data-section {
    animation: fadeSlideDown 0.8s ease-out 0.45s both;
  }

  .data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .data-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 18px 16px;
    position: relative;
    overflow: hidden;
  }

  .data-card.wide { grid-column: 1 / -1; }

  .data-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
    opacity: 0.6;
  }

  .data-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 400;
  }

  .data-value {
    font-family: 'Orbitron', monospace;
    font-size: 24px;
    font-weight: 700;
    color: #fff;
  }

  .data-value .unit {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    margin-left: 4px;
  }

  /* 气雾剂剩余量进度条 */
  .aerosol-bar-wrap {
    margin-top: 10px;
    height: 8px;
    background: rgba(255,255,255,0.06);
    border-radius: 4px;
    overflow: hidden;
  }

  .aerosol-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 4px;
    transition: width 0.6s ease;
    box-shadow: 0 0 6px var(--accent-glow);
  }

  .aerosol-bar.low {
    background: linear-gradient(90deg, var(--danger), var(--warn));
    box-shadow: 0 0 6px rgba(255,68,102,0.3);
  }

  .aerosol-info {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  /* ===== 底部信息 ===== */
  .footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.04);
    animation: fadeSlideDown 0.8s ease-out 0.6s both;
  }

  .footer p {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    line-height: 1.8;
  }

  .footer .highlight { color: var(--accent-dim); }

  /* ===== 动画 ===== */
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,136,0.3); }
    50% { box-shadow: 0 0 0 6px rgba(0,255,136,0); }
  }

  /* 全屏粒子层 */
  .global-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  .global-particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  @keyframes float-up {
    0% {
      opacity: 0.8;
      transform: translate(0, 0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(var(--dx), var(--dy)) scale(0.1);
    }
  }

  /* 响应式 */
  @media (max-width: 400px) {
    .container { padding: 16px 14px 32px; }
    .timer-display { letter-spacing: 2px; }
    .data-value { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="global-particles" id="globalParticles"></div>

<div class="container">
  <!-- 标题 -->
  <header class="header">
    <div class="brand-badge">Product Concept</div>
    <h1>
      AROUSALSHOT
      <span class="sub">清醒弹射器</span>
    </h1>
    <p class="tagline">疲劳驾驶智能干预系统 · 自动薄荷气雾释放</p>
  </header>

  <!-- 产品外观 -->
  <section class="product-section">
    <div class="section-label">产品外观</div>
    <div class="product-visual">
      <div class="vent">
        <div class="vent-slats">
          <div class="vent-slat"></div>
          <div class="vent-slat"></div>
          <div class="vent-slat"></div>
          <div class="vent-slat"></div>
          <div class="vent-slat"></div>
          <div class="vent-slat"></div>
          <div class="vent-slat"></div>
        </div>
        <div class="device">
          <div class="device-nozzle"></div>
          <div class="device-body">
            <div class="spray-container" id="sprayContainer"></div>
          </div>
          <div class="device-clip"></div>
          <div class="device-label">AROUSALSHOT</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 计时器与交互 -->
  <section class="timer-section">
    <div class="section-label">驾驶监控</div>
    <div class="timer-card">
      <div class="timer-status">
        <span class="status-dot idle" id="statusDot"></span>
        <span id="statusText">待机中</span>
      </div>
      <div class="timer-display" id="timerDisplay">00:00</div>
      <div class="timer-label">连续行驶时间（演示模式：30秒 = 90分钟）</div>
      <div class="timer-progress">
        <div class="timer-progress-bar" id="timerProgress"></div>
      </div>
      <div class="spray-alert" id="sprayAlert">
        <span class="spray-alert-icon">&#9672;</span>
        <span>薄荷气雾已释放 · 预计清醒效果持续15分钟</span>
      </div>
      <button class="manual-btn" id="manualBtn" onclick="manualTrigger()">
        手动触发喷射
      </button>
    </div>
  </section>

  <!-- 数据面板 -->
  <section class="data-section">
    <div class="section-label">实时数据</div>
    <div class="data-grid">
      <div class="data-card">
        <div class="data-label">今日行驶时长</div>
        <div class="data-value" id="todayTime">00:00</div>
      </div>
      <div class="data-card">
        <div class="data-label">累计触发次数</div>
        <div class="data-value" id="triggerCount">0<span class="unit">次</span></div>
      </div>
      <div class="data-card wide">
        <div class="data-label">气雾剂剩余量</div>
        <div class="data-value" id="aerosolPercent">100<span class="unit">%</span></div>
        <div class="aerosol-bar-wrap">
          <div class="aerosol-bar" id="aerosolBar"></div>
        </div>
        <div class="aerosol-info">
          <span id="aerosolStatus">状态良好</span>
          <span id="aerosolEst">预计可用 30 次</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 底部 -->
  <footer class="footer">
    <p>
      <span class="highlight">清醒弹射器 ArousalShot</span><br>
      概念演示 · 非实际产品<br>
      建议每连续驾驶 90 分钟进行一次清醒干预
    </p>
  </footer>
</div>

<script>
(function() {
  // ===== 状态 =====
  const DEMO_TRIGGER_SECONDS = 30; // 演示模式：30秒触发
  const AEROSOL_PER_TRIGGER = 3.3; // 每次消耗百分比
  let elapsedSeconds = 0;
  let triggerCount = 0;
  let aerosolRemaining = 100;
  let isRunning = false;
  let timerInterval = null;
  let isSpraying = false;
  let sprayTimeout = null;

  // ===== DOM =====
  const timerDisplay = document.getElementById('timerDisplay');
  const timerProgress = document.getElementById('timerProgress');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const sprayAlert = document.getElementById('sprayAlert');
  const manualBtn = document.getElementById('manualBtn');
  const todayTimeEl = document.getElementById('todayTime');
  const triggerCountEl = document.getElementById('triggerCount');
  const aerosolPercentEl = document.getElementById('aerosolPercent');
  const aerosolBar = document.getElementById('aerosolBar');
  const aerosolStatus = document.getElementById('aerosolStatus');
  const aerosolEst = document.getElementById('aerosolEst');
  const globalParticles = document.getElementById('globalParticles');
  const sprayContainer = document.getElementById('sprayContainer');

  // ===== 格式化 =====
  function formatTime(sec) {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    return m + ':' + s;
  }

  // ===== 更新UI =====
  function updateUI() {
    timerDisplay.textContent = formatTime(elapsedSeconds);
    todayTimeEl.textContent = formatTime(elapsedSeconds);
    triggerCountEl.innerHTML = triggerCount + '<span class="unit">次</span>';

    const pct = Math.max(0, Math.round(aerosolRemaining));
    aerosolPercentEl.innerHTML = pct + '<span class="unit">%</span>';
    aerosolBar.style.width = pct + '%';
    aerosolBar.className = 'aerosol-bar' + (pct <= 20 ? ' low' : '');

    if (pct <= 10) {
      aerosolStatus.textContent = '即将耗尽';
      aerosolStatus.style.color = 'var(--danger)';
    } else if (pct <= 30) {
      aerosolStatus.textContent = '余量偏低';
      aerosolStatus.style.color = 'var(--warn)';
    } else {
      aerosolStatus.textContent = '状态良好';
      aerosolStatus.style.color = 'var(--muted)';
    }

    const remaining = Math.floor(aerosolRemaining / AEROSOL_PER_TRIGGER);
    aerosolEst.textContent = '预计可用 ' + remaining + ' 次';

    // 进度条
    const progress = Math.min(100, (elapsedSeconds / DEMO_TRIGGER_SECONDS) * 100);
    timerProgress.style.width = progress + '%';

    if (progress >= 80) {
      timerProgress.className = 'timer-progress-bar warning';
      statusDot.className = 'status-dot alert';
      statusText.textContent = '接近疲劳阈值';
      statusText.style.color = 'var(--warn)';
    } else if (isRunning) {
      timerProgress.className = 'timer-progress-bar';
      statusDot.className = 'status-dot';
      statusText.textContent = '行驶监测中';
      statusText.style.color = 'var(--accent)';
    }
  }

  // ===== 粒子效果 =====
  function createLocalParticles() {
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'spray-particle';
      const size = 3 + Math.random() * 5;
      const dx = (Math.random() - 0.5) * 160;
      const dy = -(40 + Math.random() * 120);
      const dur = 0.6 + Math.random() * 0.8;
      p.style.cssText =
        'width:' + size + 'px;height:' + size + 'px;' +
        'left:50%;top:10px;' +
        '--dx:' + dx + 'px;--dy:' + dy + 'px;' +
        'animation:spray-burst ' + dur + 's ease-out forwards;' +
        'animation-delay:' + (Math.random() * 0.15) + 's;' +
        'box-shadow:0 0 ' + (size * 2) + 'px rgba(0,255,136,0.5);';
      sprayContainer.appendChild(p);
      setTimeout(function() { p.remove(); }, (dur + 0.2) * 1000);
    }
  }

  function createGlobalParticles() {
    const count = 50;
    for (let i = 0; i < count; i++) {
      (function(idx) {
        setTimeout(function() {
          const p = document.createElement('div');
          p.className = 'global-particle';
          const size = 2 + Math.random() * 6;
          const x = 30 + Math.random() * 40; // 30%-70% 横向
          const dx = (Math.random() - 0.5) * 300;
          const dy = -(100 + Math.random() * 400);
          const dur = 1.2 + Math.random() * 1.5;
          p.style.cssText =
            'width:' + size + 'px;height:' + size + 'px;' +
            'left:' + x + '%;top:50%;' +
            'background:radial-gradient(circle,rgba(0,255,136,0.9),rgba(0,255,136,0.1));' +
            'box-shadow:0 0 ' + (size * 3) + 'px rgba(0,255,136,0.4);' +
            '--dx:' + dx + 'px;--dy:' + dy + 'px;' +
            'animation:float-up ' + dur + 's ease-out forwards;';
          globalParticles.appendChild(p);
          setTimeout(function() { p.remove(); }, dur * 1000);
        }, idx * 30);
      })(i);
    }
  }

  // ===== 喷射 =====
  function triggerSpray(isAuto) {
    if (isSpraying || aerosolRemaining <= 0) return;
    isSpraying = true;

    // 更新数据
    triggerCount++;
    aerosolRemaining = Math.max(0, aerosolRemaining - AEROSOL_PER_TRIGGER);

    // 粒子
    createLocalParticles();
    createGlobalParticles();

    // 提示
    sprayAlert.classList.add('visible');

    // 禁用按钮
    manualBtn.disabled = true;
    manualBtn.textContent = '气雾释放中...';

    // 状态
    statusText.textContent = '气雾已释放';
    statusText.style.color = 'var(--accent)';
    statusDot.className = 'status-dot';

    updateUI();

    // 恢复
    sprayTimeout = setTimeout(function() {
      isSpraying = false;
      sprayAlert.classList.remove('visible');
      manualBtn.disabled = false;
      manualBtn.textContent = '手动触发喷射';

      if (isAuto) {
        // 自动触发后重置计时
        elapsedSeconds = 0;
        timerProgress.className = 'timer-progress-bar';
      }

      updateUI();
    }, 5000);
  }

  // ===== 手动触发 =====
  window.manualTrigger = function() {
    triggerSpray(false);
  };

  // ===== 计时器 =====
  function startTimer() {
    if (isRunning) return;
    isRunning = true;

    statusDot.className = 'status-dot';
    statusText.textContent = '行驶监测中';
    statusText.style.color = 'var(--accent)';

    timerInterval = setInterval(function() {
      elapsedSeconds++;
      updateUI();

      if (elapsedSeconds >= DEMO_TRIGGER_SECONDS) {
        triggerSpray(true);
      }
    }, 1000);
  }

  // ===== 启动 =====
  function init() {
    updateUI();

    // 自动开始计时
    startTimer();
  }

  // 页面加载后启动
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
