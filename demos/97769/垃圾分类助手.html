<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能垃圾分类助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide@0.511.0/dist/umd/lucide.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.511.0/dist/umd/lucide.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .page {
            display: none;
            min-height: 100vh;
        }
        .page.active {
            display: block;
        }
        .camera-btn {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            transition: all 0.3s ease;
        }
        .camera-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 20px 40px rgba(34, 197, 94, 0.4);
        }
        .camera-btn:active {
            transform: scale(0.95);
        }
        .category-card {
            transition: all 0.3s ease;
        }
        .category-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50">

    <div id="home-page" class="page active">
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="leaf" class="w-8 h-8 text-green-500"></i>
                    <h1 class="text-xl font-bold text-gray-800">智能垃圾分类</h1>
                </div>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4 py-6">
            <div class="flex flex-col items-center justify-center py-12">
                <div class="relative">
                    <button id="camera-btn" class="camera-btn w-32 h-32 rounded-full flex items-center justify-center shadow-lg">
                        <i data-lucide="camera" class="w-16 h-16 text-white"></i>
                    </button>
                    <div class="absolute -bottom-8 left-1/2 -translate-x-1/2 text-center">
                        <p class="text-gray-600 font-medium">点击拍照识别</p>
                        <p class="text-xs text-gray-400 mt-1">支持相机拍摄或相册上传</p>
                    </div>
                </div>
                <input id="file-input" type="file" accept="image/*" class="hidden">
            </div>

            <div id="loading-overlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
                <div class="bg-white rounded-2xl p-8 text-center">
                    <div class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full spin mx-auto mb-4"></div>
                    <p class="text-gray-600 font-medium">正在识别中...</p>
                    <p class="text-xs text-gray-400 mt-2">AI正在分析图片内容</p>
                </div>
            </div>

            <div class="relative bg-white rounded-2xl shadow-md overflow-hidden mb-6">
                <div class="flex items-center justify-between p-4 border-b border-gray-100">
                    <div class="flex items-center gap-2">
                        <i data-lucide="info" class="w-5 h-5 text-green-500"></i>
                        <span class="font-medium text-gray-800">垃圾分类小贴士</span>
                    </div>
                    <div class="flex gap-2">
                        <button id="prev-tip" class="p-1 hover:bg-gray-100 rounded-full">
                            <i data-lucide="chevron-left" class="w-5 h-5 text-gray-500"></i>
                        </button>
                        <button id="next-tip" class="p-1 hover:bg-gray-100 rounded-full">
                            <i data-lucide="chevron-right" class="w-5 h-5 text-gray-500"></i>
                        </button>
                    </div>
                </div>
                <div id="tip-content" class="p-6">
                    <div class="flex items-start gap-4">
                        <span id="tip-icon" class="text-3xl">♻️</span>
                        <div>
                            <h3 id="tip-title" class="font-semibold text-gray-800 mb-2">塑料瓶处理</h3>
                            <p id="tip-desc" class="text-gray-600 text-sm">投放前请将瓶盖取下，瓶内清洗干净后再投放</p>
                        </div>
                    </div>
                    <div id="tip-dots" class="flex justify-center gap-2 mt-4">
                        <button class="w-2 h-2 rounded-full bg-green-500"></button>
                        <button class="w-2 h-2 rounded-full bg-gray-300"></button>
                        <button class="w-2 h-2 rounded-full bg-gray-300"></button>
                        <button class="w-2 h-2 rounded-full bg-gray-300"></button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button id="knowledge-btn" class="bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center">
                        <i data-lucide="book-open" class="w-5 h-5 text-blue-500"></i>
                    </div>
                    <div class="text-left">
                        <p class="font-medium text-gray-800">分类知识库</p>
                        <p class="text-xs text-gray-500">了解更多分类知识</p>
                    </div>
                </button>
                <button id="history-btn" class="bg-white rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-orange-100 flex items-center justify-center">
                        <i data-lucide="history" class="w-5 h-5 text-orange-500"></i>
                    </div>
                    <div class="text-left">
                        <p class="font-medium text-gray-800">识别历史</p>
                        <p class="text-xs text-gray-500">查看过往记录</p>
                    </div>
                </button>
            </div>

            <div class="mt-8 text-center">
                <p class="text-sm text-gray-400">让垃圾分类更简单</p>
            </div>
        </main>
    </div>

    <div id="result-page" class="page">
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                <button id="result-back" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-gray-600"></i>
                </button>
                <h1 class="text-lg font-bold text-gray-800">识别结果</h1>
                <div class="w-10"></div>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4 py-6">
            <div id="result-content" class="bg-white rounded-2xl shadow-md overflow-hidden mb-6">
                <div class="relative h-48 bg-gray-100">
                    <img id="result-image" src="" alt="识别的物品" class="w-full h-full object-cover">
                </div>
                <div class="p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 id="result-name" class="text-2xl font-bold text-gray-800">物品名称</h2>
                        <span id="result-icon" class="text-3xl">♻️</span>
                    </div>
                    <div id="result-category" class="inline-flex items-center gap-2 px-4 py-2 rounded-full text-white font-semibold mb-6" style="background-color: #3b82f6;">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                        <span>可回收物</span>
                    </div>
                    <div class="space-y-4">
                        <div class="bg-gray-50 rounded-xl p-4">
                            <h3 class="font-medium text-gray-800 mb-2">物品描述</h3>
                            <p id="result-desc" class="text-gray-600 text-sm"></p>
                        </div>
                        <div class="bg-yellow-50 rounded-xl p-4">
                            <div class="flex items-start gap-3">
                                <i data-lucide="lightbulb" class="w-5 h-5 text-yellow-500 mt-0.5"></i>
                                <div>
                                    <h3 class="font-medium text-gray-800 mb-1">投放建议</h3>
                                    <p id="result-tips" class="text-gray-600 text-sm"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button id="save-history" class="w-full mt-6 py-3 bg-gradient-to-r from-green-400 to-green-600 text-white font-medium rounded-xl hover:shadow-lg transition-all active:scale-95">
                        保存到历史记录
                    </button>
                </div>
            </div>

            <button id="result-continue" class="w-full py-3 bg-white text-gray-700 font-medium rounded-xl border border-gray-200 hover:bg-gray-50 transition-colors flex items-center justify-center gap-2">
                <i data-lucide="camera" class="w-5 h-5"></i>
                <span>继续识别</span>
            </button>
        </main>
    </div>

    <div id="knowledge-page" class="page">
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                <button id="knowledge-back" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-gray-600"></i>
                </button>
                <h1 class="text-lg font-bold text-gray-800">分类知识库</h1>
                <div class="w-10"></div>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4 py-6">
            <div id="category-tabs" class="flex gap-2 mb-6 bg-white p-1 rounded-xl shadow-sm">
                <button class="category-tab flex-1 flex flex-col items-center gap-1 py-3 px-2 rounded-lg bg-gray-100 ring-2 ring-offset-1" data-category="recyclable" style="--tw-ring-color: #3b82f6;">
                    <i data-lucide="recycle" class="w-5 h-5" style="color: #3b82f6;"></i>
                    <span class="text-xs font-medium text-gray-800">可回收物</span>
                </button>
                <button class="category-tab flex-1 flex flex-col items-center gap-1 py-3 px-2 rounded-lg hover:bg-gray-50" data-category="kitchen">
                    <i data-lucide="apple" class="w-5 h-5 text-gray-400"></i>
                    <span class="text-xs font-medium text-gray-500">厨余垃圾</span>
                </button>
                <button class="category-tab flex-1 flex flex-col items-center gap-1 py-3 px-2 rounded-lg hover:bg-gray-50" data-category="hazardous">
                    <i data-lucide="alert-triangle" class="w-5 h-5 text-gray-400"></i>
                    <span class="text-xs font-medium text-gray-500">有害垃圾</span>
                </button>
                <button class="category-tab flex-1 flex flex-col items-center gap-1 py-3 px-2 rounded-lg hover:bg-gray-50" data-category="other">
                    <i data-lucide="trash-2" class="w-5 h-5 text-gray-400"></i>
                    <span class="text-xs font-medium text-gray-500">其他垃圾</span>
                </button>
            </div>

            <div id="knowledge-content" class="bg-white rounded-2xl shadow-md overflow-hidden">
                <div id="category-header" class="p-6 text-white" style="background-color: #3b82f6;">
                    <h2 id="category-name" class="text-2xl font-bold mb-2">可回收物</h2>
                    <p id="category-desc" class="text-white/80 text-sm">适宜回收利用的生活垃圾，包括纸类、塑料、金属、玻璃制品等</p>
                </div>
                <div class="p-6">
                    <h3 class="font-medium text-gray-800 mb-4">常见物品</h3>
                    <div id="category-items" class="grid grid-cols-2 gap-3">
                    </div>
                </div>
                <div class="px-6 pb-6">
                    <div class="bg-yellow-50 rounded-xl p-4">
                        <h4 class="font-medium text-gray-800 mb-2">💡 温馨提示</h4>
                        <ul id="category-tips" class="text-gray-600 text-sm space-y-2">
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="history-page" class="page">
        <header class="bg-white shadow-sm sticky top-0 z-10">
            <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                <button id="history-back" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                    <i data-lucide="arrow-left" class="w-6 h-6 text-gray-600"></i>
                </button>
                <h1 class="text-lg font-bold text-gray-800">识别历史</h1>
                <div class="w-10"></div>
            </div>
        </header>

        <main class="max-w-md mx-auto px-4 py-6">
            <div id="history-list" class="space-y-4">
                <div class="bg-white rounded-2xl shadow-md p-12 text-center">
                    <div class="text-6xl mb-4">📷</div>
                    <h2 class="text-xl font-bold text-gray-800 mb-2">暂无识别记录</h2>
                    <p class="text-gray-500 text-sm mb-6">点击首页的拍照按钮开始识别</p>
                    <button id="history-go-home" class="px-6 py-3 bg-gradient-to-r from-green-400 to-green-600 text-white font-medium rounded-xl hover:shadow-lg transition-all">
                        去识别
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const categories = {
            recyclable: { name: '可回收物', color: '#3b82f6', icon: '♻️', description: '适宜回收利用的生活垃圾，包括纸类、塑料、金属、玻璃制品等', items: ['塑料瓶', '废纸', '易拉罐', '玻璃瓶'], tips: ['投放前请将物品清洗干净', '去除非可回收部分', '压扁体积大的物品节省空间'] },
            kitchen: { name: '厨余垃圾', color: '#22c55e', icon: '🥗', description: '易腐烂的生物质废弃物，包括剩菜剩饭、瓜果皮核、花卉绿植等', items: ['剩菜剩饭', '果皮果核', '过期食品', '花卉绿植'], tips: ['沥干水分后投放', '建议使用可降解垃圾袋', '去除骨头、贝壳等不易腐烂的部分'] },
            hazardous: { name: '有害垃圾', color: '#ef4444', icon: '⚠️', description: '对人体健康或者自然环境造成直接或者潜在危害的生活废弃物', items: ['电池', '灯管', '药品', '油漆'], tips: ['请放入专门的回收箱', '确保容器密封完好', '不要随意丢弃'] },
            other: { name: '其他垃圾', color: '#6b7280', icon: '🗑️', description: '除可回收物、厨余垃圾、有害垃圾以外的其他生活废弃物', items: ['餐巾纸', '烟蒂', '陶瓷', '一次性餐具'], tips: ['无法回收利用的垃圾', '被污染无法再利用的物品', '请确保投放准确'] }
        };

        const items = [
            { name: '塑料瓶', category: 'recyclable', description: '各种塑料饮料瓶、矿泉水瓶', tips: '请将瓶盖取下，瓶内清洗干净后投放' },
            { name: '废纸', category: 'recyclable', description: '报纸、杂志、书本、纸箱等纸质物品', tips: '请将纸张整理平整，去除胶带和塑料包装' },
            { name: '易拉罐', category: 'recyclable', description: '各种金属饮料罐、食品罐', tips: '请将罐内液体倒空，压扁后投放' },
            { name: '玻璃瓶', category: 'recyclable', description: '各种玻璃容器', tips: '请小心轻放，避免破碎' },
            { name: '剩菜剩饭', category: 'kitchen', description: '家庭厨余垃圾、剩菜剩饭', tips: '请沥干水分后投放，建议使用可降解垃圾袋' },
            { name: '果皮果核', category: 'kitchen', description: '水果皮、果核、蔬菜残渣', tips: '请去除非食用部分后投放' },
            { name: '过期食品', category: 'kitchen', description: '过期的零食、面包、调味品等', tips: '请去除外包装后投放' },
            { name: '花卉绿植', category: 'kitchen', description: '枯萎的花草、落叶等', tips: '请去除花盆和土壤后投放' },
            { name: '电池', category: 'hazardous', description: '各种干电池、蓄电池', tips: '请放入专门的电池回收箱' },
            { name: '灯管', category: 'hazardous', description: '荧光灯管、节能灯', tips: '请小心轻放，避免破碎导致汞泄漏' },
            { name: '药品', category: 'hazardous', description: '过期药品、药品包装', tips: '请放入专门的药品回收点' },
            { name: '油漆', category: 'hazardous', description: '油漆桶、涂料、溶剂', tips: '请确保容器密封完好后投放' },
            { name: '餐巾纸', category: 'other', description: '用过的纸巾、湿巾', tips: '请放入其他垃圾桶' },
            { name: '烟蒂', category: 'other', description: '烟头、烟灰', tips: '请熄灭后放入其他垃圾桶' },
            { name: '陶瓷', category: 'other', description: '碎陶瓷、花盆', tips: '请放入其他垃圾桶' },
            { name: '一次性餐具', category: 'other', description: '一次性筷子、餐盒', tips: '请放入其他垃圾桶' }
        ];

        const tips = [
            { icon: '♻️', title: '塑料瓶处理', content: '投放前请将瓶盖取下，瓶内清洗干净后再投放' },
            { icon: '🥗', title: '厨余垃圾', content: '请沥干水分后投放，建议使用可降解垃圾袋' },
            { icon: '🔋', title: '电池回收', content: '废旧电池请放入专门的电池回收箱，不要混入其他垃圾' },
            { icon: '📄', title: '纸张整理', content: '废纸请整理平整，去除胶带和塑料包装后投放' }
        ];

        let currentTipIndex = 0;
        let history = [];
        let currentResult = null;

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            lucide.createIcons();
        }

        function updateTip(index) {
            currentTipIndex = index;
            const tip = tips[index];
            document.getElementById('tip-icon').textContent = tip.icon;
            document.getElementById('tip-title').textContent = tip.title;
            document.getElementById('tip-desc').textContent = tip.content;
            document.querySelectorAll('#tip-dots button').forEach((dot, i) => {
                dot.className = `w-2 h-2 rounded-full transition-colors ${i === index ? 'bg-green-500' : 'bg-gray-300'}`;
            });
        }

        function showKnowledge(categoryId) {
            const category = categories[categoryId];
            document.getElementById('category-name').textContent = category.name;
            document.getElementById('category-desc').textContent = category.description;
            document.getElementById('category-header').style.backgroundColor = category.color;

            const itemsHtml = category.items.map((item, i) => `
                <div class="flex items-center gap-3 bg-gray-50 rounded-xl p-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-medium" style="background-color: ${category.color}">${i + 1}</div>
                    <span class="text-gray-700 text-sm">${item}</span>
                </div>
            `).join('');
            document.getElementById('category-items').innerHTML = itemsHtml;

            const tipsHtml = category.tips.map(tip => `<li>• ${tip}</li>`).join('');
            document.getElementById('category-tips').innerHTML = tipsHtml;

            document.querySelectorAll('.category-tab').forEach(tab => {
                const isActive = tab.dataset.category === categoryId;
                tab.className = `category-tab flex-1 flex flex-col items-center gap-1 py-3 px-2 rounded-lg transition-all ${isActive ? 'bg-gray-100 ring-2 ring-offset-1' : 'hover:bg-gray-50'}`;
                tab.style.setProperty('--tw-ring-color', isActive ? category.color : 'transparent');
                tab.querySelector('svg').style.color = isActive ? category.color : '#9ca3af';
                tab.querySelector('span').className = `text-xs font-medium ${isActive ? 'text-gray-800' : 'text-gray-500'}`;
            });
        }

        function showHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-md p-12 text-center">
                        <div class="text-6xl mb-4">📷</div>
                        <h2 class="text-xl font-bold text-gray-800 mb-2">暂无识别记录</h2>
                        <p class="text-gray-500 text-sm mb-6">点击首页的拍照按钮开始识别</p>
                        <button id="history-go-home" class="px-6 py-3 bg-gradient-to-r from-green-400 to-green-600 text-white font-medium rounded-xl hover:shadow-lg transition-all">
                            去识别
                        </button>
                    </div>
                `;
                document.getElementById('history-go-home').addEventListener('click', () => showPage('home-page'));
                return;
            }

            list.innerHTML = history.map(item => {
                const category = categories[item.category];
                return `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden flex">
                        <div class="w-24 h-24 flex-shrink-0">
                            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 p-4 flex flex-col justify-between">
                            <div>
                                <h3 class="font-semibold text-gray-800">${item.name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-lg">${category.icon}</span>
                                    <span class="text-xs font-medium px-2 py-0.5 rounded-full text-white" style="background-color: ${category.color}">${category.name}</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-1 text-gray-400 text-xs">
                                    <i data-lucide="clock" class="w-3 h-3"></i>
                                    <span>${item.time}</span>
                                </div>
                                <button class="delete-btn p-2 hover:bg-red-50 rounded-full transition-colors" data-id="${item.id}">
                                    <i data-lucide="trash-2" class="w-4 h-4 text-red-400"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.currentTarget.dataset.id);
                    history = history.filter(h => h.id !== id);
                    showHistory();
                });
            });
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            document.getElementById('camera-btn').addEventListener('click', () => {
                document.getElementById('file-input').click();
            });

            document.getElementById('file-input').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const imageUrl = event.target.result;
                    document.getElementById('loading-overlay').classList.remove('hidden');

                    setTimeout(() => {
                        const randomItem = items[Math.floor(Math.random() * items.length)];
                        const category = categories[randomItem.category];

                        currentResult = {
                            image: imageUrl,
                            name: randomItem.name,
                            category: randomItem.category,
                            categoryName: category.name,
                            categoryColor: category.color,
                            categoryIcon: category.icon,
                            description: randomItem.description,
                            tips: randomItem.tips
                        };

                        document.getElementById('result-image').src = currentResult.image;
                        document.getElementById('result-name').textContent = currentResult.name;
                        document.getElementById('result-icon').textContent = currentResult.categoryIcon;
                        document.getElementById('result-category').innerHTML = `<i data-lucide="trash-2" class="w-5 h-5"></i><span>${currentResult.categoryName}</span>`;
                        document.getElementById('result-category').style.backgroundColor = currentResult.categoryColor;
                        document.getElementById('result-desc').textContent = currentResult.description;
                        document.getElementById('result-tips').textContent = currentResult.tips;

                        document.getElementById('loading-overlay').classList.add('hidden');
                        showPage('result-page');
                    }, 1500);
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('prev-tip').addEventListener('click', () => {
                updateTip((currentTipIndex - 1 + tips.length) % tips.length);
            });

            document.getElementById('next-tip').addEventListener('click', () => {
                updateTip((currentTipIndex + 1) % tips.length);
            });

            document.querySelectorAll('#tip-dots button').forEach((dot, i) => {
                dot.addEventListener('click', () => updateTip(i));
            });

            document.getElementById('knowledge-btn').addEventListener('click', () => {
                showKnowledge('recyclable');
                showPage('knowledge-page');
            });

            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    showKnowledge(tab.dataset.category);
                });
            });

            document.getElementById('history-btn').addEventListener('click', () => {
                showHistory();
                showPage('history-page');
            });

            document.getElementById('result-back').addEventListener('click', () => {
                showPage('home-page');
            });

            document.getElementById('result-continue').addEventListener('click', () => {
                showPage('home-page');
            });

            document.getElementById('save-history').addEventListener('click', () => {
                if (!currentResult) return;
                history.unshift({
                    id: Date.now(),
                    image: currentResult.image,
                    name: currentResult.name,
                    category: currentResult.category,
                    time: '刚刚'
                });
                alert('已保存到历史记录');
            });

            document.getElementById('knowledge-back').addEventListener('click', () => {
                showPage('home-page');
            });

            document.getElementById('history-back').addEventListener('click', () => {
                showPage('home-page');
            });
        });
    </script>
</body>
</html>
