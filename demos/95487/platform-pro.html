function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      // 简单完整性校验
      if (data.reagents && data.devices && data.users) return data;
    }
  } catch (e) { console.warn('数据加载失败', e); }
  const data = getDefaultData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  return data;
}

function loadSession() {
  try {
    const s = localStorage.getItem(SESSION_KEY);
    if (s) return JSON.parse(s);
  } catch (e) {}
  return { userId: null };
}

function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
function saveSession() { localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); }

function resetData() {
  DB = getDefaultData();
  saveData();
  showToast('数据已重置为初始状态', 'success');
  if (SESSION.userId) enterApp();
}

  const colors = {
    info: 'bg-teal-600/20 border-teal-500/50 text-teal-300',
    success: 'bg-emerald-600/20 border-emerald-500/50 text-emerald-300',
    warning: 'bg-amber-600/20 border-amber-500/50 text-amber-300',
    error: 'bg-rose-600/20 border-rose-500/50 text-rose-300',
  };
  const toast = document.createElement('div');
  toast.className = `fade-in border rounded-lg px-4 py-2.5 text-sm backdrop-blur-md ${colors[type]} min-w-[200px] max-w-sm`;

function formatTime(d) {
  const date = new Date(d);
  const now = new Date();
  const diffMs = now - date;
  const diffMin = Math.floor(diffMs / 60000);
  const diffHour = Math.floor(diffMs / 3600000);
  const diffDay = Math.floor(diffMs / 86400000);
  if (diffMin < 1) return '刚刚';
  if (diffMin < 60) return `${diffMin}分钟前`;
  if (diffHour < 24) return `${diffHour}小时前`;
  if (diffDay < 7) return `${diffDay}天前`;
  return `${date.getMonth()+1}月${date.getDate()}日`;
}

function formatDateTime(d) {
  const date = new Date(d);
  return `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
}

function daysUntil(date) {
  const target = new Date(date);
  const now = new Date();
  return Math.ceil((target - now) / 86400000);
}

function riskBadge(level) {
  const config = {
    LOW: 'border-emerald-500/50 text-emerald-400 bg-emerald-950/30',
    HIGH: 'border-rose-500/50 text-rose-400 bg-rose-950/30',
    MEDIUM: 'border-amber-500/50 text-amber-400 bg-amber-950/30',
    CRITICAL: 'border-rose-700/50 text-rose-300 bg-rose-950/50',
  };
  const labels = { LOW: '低风险', MEDIUM: '中风险', HIGH: '高风险', CRITICAL: '极高危' };
  return `<span class="px-2 py-0.5 rounded text-[10px] border ${config[level] || config.LOW}">${labels[level] || level}</span>`;
}

function statusBadge(status) {
  const config = {
    PENDING: 'border-amber-500/50 text-amber-400 bg-amber-950/30',
    APPROVED: 'border-emerald-500/50 text-emerald-400 bg-emerald-950/30',
    REJECTED: 'border-rose-500/50 text-rose-400 bg-rose-950/30',
    COMPLETED: 'border-slate-500/50 text-slate-400 bg-slate-950/30',
    ACTIVE: 'border-emerald-500/50 text-emerald-400 bg-emerald-950/30',
    MAINTENANCE: 'border-amber-500/50 text-amber-400 bg-amber-950/30',
    SCRAPPED: 'border-slate-600/50 text-slate-500 bg-slate-950/30',
  };
  const labels = { PENDING: '待审核', APPROVED: '已通过', REJECTED: '已拒绝', COMPLETED: '已完成', ACTIVE: '运行中', MAINTENANCE: '维护中', SCRAPPED: '已报废' };
  return `<span class="px-2 py-0.5 rounded text-[10px] border ${config[status] || config.PENDING}">${labels[status] || status}</span>`;
}

function controlledBadge(is) {
  return is ? `<span class="px-2 py-0.5 rounded text-[10px] border border-fuchsia-500/50 text-fuchsia-400 bg-fuchsia-950/30">管制品</span>` : '';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function exportCSV(filename, rows) {
  if (!rows || !rows.length) { showToast('没有可导出的数据', 'warning'); return; }
  const headers = Object.keys(rows[0]);
  const csv = [
    headers.join(','),
    ...rows.map(r => headers.map(h => `"${String(r[h] ?? '').replace(/"/g, '""')}"`).join(','))
  ].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已导出 ${rows.length} 条数据`, 'success');
  logAudit('EXPORT', null, `导出 ${filename} (${rows.length} 条)`);
}

  const agent = AGENTS[agentKey];

    DB.agentStats[agentKey].calls++;
    DB.agentStats[agentKey].lastActive = new Date().toISOString();

  // 显示火花提示

function logAudit(action, target, detail) {
  const user = currentUser();
  DB.auditLogs.unshift({
    id: uid('log'),
    action,
    operator: user?.id || 'system',
    operatorName: user?.name || '系统',
    target: target || '-',
    detail,
    time: new Date().toISOString(),
  });
  if (DB.auditLogs.length > 200) DB.auditLogs = DB.auditLogs.slice(0, 200);
  saveData();
}

  DB.notifications.unshift({
    id: uid('n'),
    title, content, level,
    time: new Date().toISOString(),
    read: false,
    targetUser,
  });
  saveData();
  updateBellBadge();
}

function updateBellBadge() {
  const user = currentUser();
  const unread = DB.notifications.filter(n => !n.read && (n.targetUser === null || n.targetUser === user?.id)).length;
  const badge = document.getElementById('bellBadge');
  if (unread > 0) {
    badge.textContent = unread > 9 ? '9+' : unread;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

      class="nav-item w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm border-l-2 border-transparent text-slate-300 hover:bg-slate-800/60 transition ${currentPage === item.key ? 'active' : ''}">
      <span class="text-base">${item.icon}</span>
      <span class="flex-1 text-left">${item.label}</span>
    </button>
  `).join('');
}

function navigateTo(page) {
  currentPage = page;
  renderNav();
  const main = document.getElementById('mainContent');
  main.classList.remove('fade-in');
  void main.offsetWidth;
  main.classList.add('fade-in');

  const renderers = {
    dashboard: renderDashboard,
    reagents: renderReagents,
    devices: renderDevices,
    review: renderReview,
    alerts: renderAlerts,
    compounds: renderCompounds,
    announcements: renderAnnouncements,
    users: renderUsers,
    audit: renderAudit,
    agents: renderAgents,
    myapps: renderMyApps,
  };
  (renderers[page] || renderDashboard)();
}

function renderAgentMiniStatus() {
  const stats = DB.agentStats;

    <div class="flex items-center justify-between text-slate-500">

    </div>
    <div class="flex items-center justify-between text-slate-500">
      <span>✅ 在线智能体</span>
      <span class="text-emerald-400">7 / 7</span>
    </div>
  `;
  document.getElementById('agentMiniStatus').innerHTML = html;
}

function renderReagentRows() {
  let list = DB.reagents.filter(r => {
    if (reagentFilter.search) {
      const s = reagentFilter.search.toLowerCase();
      if (!r.name.toLowerCase().includes(s) && !r.cas.toLowerCase().includes(s) && !r.location.toLowerCase().includes(s)) return false;
    }
    if (reagentFilter.risk !== 'ALL' && r.riskLevel !== reagentFilter.risk) return false;
    if (reagentFilter.controlled === 'YES' && !r.isControlled) return false;
    if (reagentFilter.controlled === 'NO' && r.isControlled) return false;
    return true;
  });

  const rows = list.map(r => {
    const days = daysUntil(r.expiry);
    const stockColor = r.stock < r.minStock ? 'text-rose-400' : (r.stock < r.minStock * 2 ? 'text-amber-400' : 'text-emerald-400');
    const expiryText = days < 0 ? `<span class="text-rose-400">已过期 ${-days}天</span>` : (days <= 30 ? `<span class="text-amber-400">${days}天后</span>` : `${days}天后`);
    return `
      <tr class="border-t border-slate-800 hover:bg-slate-800/40">
        <td class="px-4 py-2.5">
          <div class="text-white font-medium">${escapeHtml(r.name)} ${controlledBadge(r.isControlled)}</div>
          <div class="text-[10px] text-slate-500">CAS: ${r.cas} · ${r.supplier || '-'}</div>
        </td>
        <td class="px-3 py-2.5">${riskBadge(r.riskLevel)}</td>
        <td class="px-3 py-2.5">
          <div class="${stockColor} font-medium">${r.stock} ${r.unit}</div>
          <div class="text-[10px] text-slate-500">min: ${r.minStock}</div>
        </td>
        <td class="px-3 py-2.5 text-slate-300">${r.location}</td>
        <td class="px-3 py-2.5 text-slate-300">${expiryText}<div class="text-[10px] text-slate-500">${r.expiry}</div></td>
        <td class="px-4 py-2.5 text-right space-x-1">
          <button onclick="viewReagent('${r.id}')" class="text-[10px] text-slate-400 hover:text-cyan-400">详情</button>
          ${isAdmin() ? `<button onclick="openReagentForm('${r.id}')" class="text-[10px] text-slate-400 hover:text-teal-400">编辑</button>
                         <button onclick="restockReagent('${r.id}')" class="text-[10px] text-slate-400 hover:text-emerald-400">补货</button>
                         <button onclick="deleteReagent('${r.id}')" class="text-[10px] text-slate-400 hover:text-rose-400">删除</button>` : ''}
          <button onclick="checkoutReagent('${r.id}')" class="text-[10px] px-2 py-0.5 bg-teal-600/30 border border-teal-500/40 hover:bg-teal-600/50 text-teal-200 rounded">领用</button>
        </td>
      </tr>
    `;
  }).join('');

  document.getElementById('reagentRows').innerHTML = rows || `<tr><td colspan="6" class="text-center py-8 text-slate-500 text-xs">无匹配试剂</td></tr>`;
}

function viewReagent(id) {

  const operator = DB.users.find(u => u.id === r.stockInOperator);
  openModal(`试剂详情 · ${r.name}`, `
    <div class="space-y-3 text-xs">
      <div class="grid grid-cols-2 gap-3">
        <div><div class="text-slate-500">CAS 号</div><div class="text-white">${r.cas}</div></div>
        <div><div class="text-slate-500">分子式</div><div class="text-white">${r.formula || '-'}</div></div>

function saveReagent(id) {
  const name = document.getElementById('rf_name').value.trim();
  const cas = document.getElementById('rf_cas').value.trim();
  if (!name || !cas) { showToast('名称和 CAS 必填', 'error'); return; }
  const data = {
    name, cas,
    riskLevel: document.getElementById('rf_risk').value,
    isControlled: document.getElementById('rf_controlled').value === 'true',
    stock: +document.getElementById('rf_stock').value || 0,
    minStock: +document.getElementById('rf_minStock').value || 0,
    unit: document.getElementById('rf_unit').value.trim() || 'ml',
    location: document.getElementById('rf_location').value.trim(),
    expiry: document.getElementById('rf_expiry').value,
    supplier: document.getElementById('rf_supplier').value.trim(),
  };
  if (id) {
    const r = DB.reagents.find(x => x.id === id);
    Object.assign(r, data);
    logAudit('REAGENT_UPDATE', name, `更新试剂信息`);
    triggerAgent('reagentKeeper', `更新试剂 ${name}`);
    showToast('试剂已更新', 'success');
  } else {
    data.id = uid('r');
    data.stockInDate = new Date().toISOString().slice(0,10);
    data.stockInOperator = currentUser().id;
    DB.reagents.push(data);
    logAudit('REAGENT_CREATE', name, `新增试剂 ${name} (${data.stock}${data.unit})`);
    triggerAgent('reagentKeeper', `新增试剂 ${name}`);
    showToast('试剂已创建', 'success');
  }
  saveData();
  closeModal();
  renderReagents();
  renderAgentMiniStatus();
}

function doCheckout(id, mode) {
  const r = DB.reagents.find(x => x.id === id);
  const user = currentUser();
  const qty = +document.getElementById('co_qty').value || 0;
  const time = document.getElementById('co_time').value;
  const purpose = document.getElementById('co_purpose').value.trim();
  if (qty <= 0) { showToast('数量必须 > 0', 'error'); return; }
  if (qty > r.stock) { showToast('库存不足', 'error'); return; }
  if (mode === 'APPLY' && (!time || !purpose)) { showToast('申请模式需填写使用时间和用途', 'error'); return; }

  if (mode === 'CHECKOUT') {
    // 直接扣库存
    const before = r.stock;
    r.stock -= qty;
    saveData();
    logAudit('REAGENT_CHECKOUT', r.name, `${user.name} 领用 ${qty}${r.unit} (${before} → ${r.stock})`);
    triggerAgent('reagentKeeper', `${user.name} 领用 ${r.name} ${qty}${r.unit}`);
    if (r.stock < r.minStock) {
      pushNotification(`${r.name} 库存不足`, `当前库存 ${r.stock}${r.unit}，已低于最小库存 ${r.minStock}${r.unit}`, 'WARNING', 'admin1');
      triggerAgent('safetyGuard', `触发低库存预警: ${r.name}`);
    }
    showToast(`已领用 ${qty}${r.unit}`, 'success');
  } else {
    // 申请审批
    DB.requisitions.push({
      id: uid('req'),
      reagentId: id,
      userId: user.id,
      userName: user.name,
      quantity: qty,
      purpose,
      useTime: time,
      status: 'PENDING',
      mode: 'APPLY',
      createdAt: new Date().toISOString(),
    });
    saveData();
    logAudit('REAGENT_APPLY', r.name, `${user.name} 申请 ${qty}${r.unit} 用途: ${purpose}`);
    triggerAgent('procureMaster', `${user.name} 申请 ${r.name} ${qty}${r.unit}`);
    pushNotification('新领用申请待审批', `${user.name} 申请 ${r.name} ${qty}${r.unit}`, 'INFO', 'admin1');
    showToast('申请已提交，等待审批', 'success');
  }
  closeModal();
  renderReagents();
  updateBellBadge();
}

function simulateOCR() {
  triggerAgent('reagentKeeper', 'OCR 入库扫描中...');
  openModal('📷 OCR 智能入库', `
    <div class="text-center py-6">
      <div class="size-16 mx-auto mb-3 rounded-full bg-violet-950/40 border border-violet-500/30 flex items-center justify-center">
        <div class="text-2xl animate-pulse">📷</div>
      </div>
      <div class="text-xs text-slate-400 mb-3">PaddleOCR-VL 正在识别试剂标签...</div>
      <div class="text-[10px] text-violet-400 typing" id="ocrProgress">扫描中</div>
    </div>
  `, '', 'sm');
  let progress = 0;
  const steps = ['扫描中', '识别文字', '提取字段', 'PubChem 补全', '完成'];
  const interval = setInterval(() => {
    progress++;
    if (progress >= steps.length) {
      clearInterval(interval);
      closeModal();
      // 模拟识别结果
      const samples = [
        { name: '甲苯', cas: '108-88-3', riskLevel: 'HIGH', isControlled: false, unit: 'ml', supplier: '国药集团' },
        { name: '四氢呋喃', cas: '109-99-9', riskLevel: 'HIGH', isControlled: false, unit: 'ml', supplier: 'Sigma-Aldrich' },
        { name: 'N,N-二甲基甲酰胺', cas: '68-12-2', riskLevel: 'HIGH', isControlled: false, unit: 'ml', supplier: '化学试剂厂' },
      ];
      const sample = samples[Math.floor(Math.random() * samples.length)];
      sample.stock = Math.floor(Math.random() * 3000) + 500;
      sample.minStock = 500;
      sample.location = 'A' + (Math.floor(Math.random()*3)+1) + '-' + String(Math.floor(Math.random()*9)+1).padStart(2,'0');
      const future = new Date();
      future.setFullYear(future.getFullYear() + 1 + Math.floor(Math.random()*2));
      sample.expiry = future.toISOString().slice(0,10);
      // 自动填入表单
      setTimeout(() => {
        openReagentForm();
        setTimeout(() => {
          document.getElementById('rf_name').value = sample.name;
          document.getElementById('rf_cas').value = sample.cas;
          document.getElementById('rf_risk').value = sample.riskLevel;
          document.getElementById('rf_controlled').value = String(sample.isControlled);
          document.getElementById('rf_stock').value = sample.stock;
          document.getElementById('rf_minStock').value = sample.minStock;
          document.getElementById('rf_unit').value = sample.unit;
          document.getElementById('rf_location').value = sample.location;
          document.getElementById('rf_expiry').value = sample.expiry;
          document.getElementById('rf_supplier').value = sample.supplier;
          showToast('OCR 识别完成，已自动填充', 'success');
        }, 100);
      }, 200);
    } else {
      const el = document.getElementById('ocrProgress');
      if (el) el.textContent = steps[progress];
    }
  }, 400);
}

      <button onclick="saveDevice(${id?`'${id}'`:'null'})" class="px-3 py-1.5 text-xs bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg">${id?'保存':'创建'}</button>`);
}

function saveDevice(id) {
  const name = document.getElementById('df_name').value.trim();
  if (!name) { showToast('名称必填', 'error'); return; }
  const data = {
    name,
    model: document.getElementById('df_model').value.trim(),
    location: document.getElementById('df_location').value.trim(),
    riskLevel: document.getElementById('df_risk').value,
    status: document.getElementById('df_status').value,
    requiredQual: document.getElementById('df_qual').value.trim() || null,
  };
  if (id) {
    const d = DB.devices.find(x => x.id === id);
    Object.assign(d, data);
    logAudit('DEVICE_UPDATE', name, `更新设备信息`);
    triggerAgent('resourceShare', `更新设备 ${name}`);
    showToast('设备已更新', 'success');
  } else {
    data.id = uid('d');
    data.usageCount = 0;
    DB.devices.push(data);
    logAudit('DEVICE_CREATE', name, `新增设备 ${name}`);
    triggerAgent('resourceShare', `新增设备 ${name}`);
    showToast('设备已创建', 'success');
  }
  saveData();
  closeModal();
  renderDevices();
  renderAgentMiniStatus();
}

function scrapDevice(id) {
  const d = DB.devices.find(x => x.id === id);
  if (!d) return;
  openModal(`报废设备 · ${d.name}`, `
    <p class="text-sm text-slate-300 mb-2">确认报废 <b class="text-rose-400">${d.name}</b>？</p>
    <p class="text-xs text-amber-400">报废后设备将不可预约，但保留历史记录</p>
  `, `<button onclick="closeModal()" class="px-3 py-1.5 text-xs border border-slate-700 rounded-lg text-slate-300 hover:bg-slate-800">取消</button>
      <button onclick="doScrapDevice('${id}')" class="px-3 py-1.5 text-xs bg-rose-600 hover:bg-rose-500 text-white rounded-lg">确认报废</button>`, 'sm');
}

function doScrapDevice(id) {
  const d = DB.devices.find(x => x.id === id);
  d.status = 'SCRAPPED';
  saveData();
  logAudit('DEVICE_SCRAP', d.name, `设备报废`);
  triggerAgent('resourceShare', `报废设备 ${d.name}`);
  showToast('设备已报废', 'success');
  closeModal();
  renderDevices();
}

function viewDeviceSchedule(id) {
  const d = DB.devices.find(x => x.id === id);
  if (!d) return;
  const user = currentUser();
  if (d.status !== 'ACTIVE') { showToast('设备当前不可预约', 'warning'); return; }
  if (d.requiredQual && !(user.qualifications || []).includes(d.requiredQual)) {
    showToast(`缺少资质: ${d.requiredQual}`, 'error');
    triggerAgent('safetyGuard', `拦截无资质预约: ${d.name} by ${user.name}`);
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  const dayRes = DB.reservations.filter(r => r.deviceId === id && r.startTime.startsWith(today) && r.status !== 'REJECTED');
  // 8:00 - 22:00 30分钟粒度
  const slots = [];
  for (let h = 8; h <= 21; h++) {
    for (let m of [0, 30]) {
      if (h === 21 && m === 30) break;
      const time = `${today}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      const booked = dayRes.some(r => r.startTime <= time && r.endTime > time);
      slots.push({ time, label: `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`, booked });
    }
  }
  const slotHTML = slots.map(s => `
    <div class="slot ${s.booked?'booked':''} border border-slate-700 rounded text-[10px] text-center py-1.5 cursor-pointer ${s.booked?'':'hover:bg-teal-900/30'}"
         data-time="${s.time}" onclick="${s.booked?'':`selectSlot('${s.time}')`}">
      ${s.label}${s.booked?' 🔒':''}
    </div>
  `).join('');

  openModal(`预约 · ${d.name}`, `
    <div class="space-y-3 text-xs">
      <div class="text-slate-400">${today} · 已预约 ${dayRes.length} 场</div>
      <div class="grid grid-cols-6 gap-1.5">${slotHTML}</div>
      <div id="slotInfo" class="text-[10px] text-slate-500">点击时间段选择起止时间（需选择两个时间点）</div>
      <div><label class="block text-slate-400 mb-1">使用目的</label><textarea id="res_purpose" rows="2" class="w-full bg-slate-900/60 border border-slate-700 rounded px-2 py-1.5 text-white" placeholder="例如：产物纯度分析"></textarea></div>
    </div>
  `, `<button onclick="closeModal()" class="px-3 py-1.5 text-xs border border-slate-700 rounded-lg text-slate-300 hover:bg-slate-800">取消</button>
      <button onclick="bookDevice('${id}')" class="px-3 py-1.5 text-xs bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg">提交预约</button>`, 'xl');

  window._selectedSlots = [];
}

function selectSlot(time) {
  const slots = window._selectedSlots;
  if (slots.length >= 2) {
    document.querySelectorAll('.slot.selected').forEach(el => el.classList.remove('selected'));
    window._selectedSlots = [time];
    document.querySelector(`[data-time="${time}"]`)?.classList.add('selected');
  } else {
    window._selectedSlots.push(time);
    document.querySelector(`[data-time="${time}"]`)?.classList.add('selected');
  }
  if (window._selectedSlots.length === 2) {
    const [s, e] = window._selectedSlots.sort();
    document.getElementById('slotInfo').innerHTML = `已选择: <span class="text-teal-400">${s.slice(11,16)} → ${e.slice(11,16)}</span>`;
  }
}

function bookDevice(id) {
  if (window._selectedSlots.length !== 2) { showToast('请选择起止时间', 'error'); return; }
  const [s, e] = window._selectedSlots.sort();
  const purpose = document.getElementById('res_purpose').value.trim();
  if (!purpose) { showToast('请填写使用目的', 'error'); return; }
  const d = DB.devices.find(x => x.id === id);
  const user = currentUser();
  // 冲突检测
  const conflict = DB.reservations.some(r => r.deviceId === id && r.status !== 'REJECTED' && r.startTime < e && r.endTime > s);
  if (conflict) { showToast('所选时段与已有预约冲突', 'error'); triggerAgent('safetyGuard', `拦截预约冲突: ${d.name}`); return; }

  const needsApproval = d.riskLevel === 'HIGH';
  const status = needsApproval ? 'PENDING' : 'APPROVED';
  DB.reservations.push({
    id: uid('res'),
    deviceId: id,
    userId: user.id,
    userName: user.name,
    startTime: s,
    endTime: e,
    purpose,
    status,
    createdAt: new Date().toISOString(),
  });
  d.usageCount++;
  saveData();
  logAudit('DEVICE_RESERVE', d.name, `${user.name} 预约 ${s.slice(11,16)}-${e.slice(11,16)} (${status==='PENDING'?'待审批':'已批准'})`);
  triggerAgent('resourceShare', `${user.name} 预约 ${d.name}`);
  if (needsApproval) {
    pushNotification('新设备预约待审批', `${user.name} 预约 ${d.name} ${s.slice(11,16)}-${e.slice(11,16)}`, 'INFO', 'admin1');
    showToast('预约已提交，等待审批', 'success');
  } else {
    showToast('预约已自动批准', 'success');
  }
  closeModal();
  renderDevices();
  updateBellBadge();
}

function reviewReq(id, decision) {
  const r = DB.requisitions.find(x => x.id === id);
  if (!r) return;
  const reagent = DB.reagents.find(x => x.id === r.reagentId);
  if (decision === 'APPROVED') {
    if (reagent.stock < r.quantity) { showToast('库存不足，无法通过', 'error'); return; }
    reagent.stock -= r.quantity;
    pushNotification('领用申请已通过', `${r.userName} 申请的 ${reagent.name} ${r.quantity}${reagent.unit} 已批准`, 'INFO', r.userId);
    triggerAgent('procureMaster', `审批通过: ${reagent.name} ${r.quantity}${reagent.unit}`);
    if (reagent.stock < reagent.minStock) {
      pushNotification(`${reagent.name} 库存不足`, `当前库存 ${reagent.stock}${reagent.unit}，已低于最小库存`, 'WARNING', 'admin1');
      triggerAgent('safetyGuard', `触发低库存预警: ${reagent.name}`);
    }
  } else {
    pushNotification('领用申请被拒绝', `${r.userName} 申请的 ${reagent.name} ${r.quantity}${reagent.unit} 被拒绝`, 'WARNING', r.userId);
    triggerAgent('procureMaster', `审批拒绝: ${reagent.name}`);
  }
  r.status = decision;
  r.reviewedAt = new Date().toISOString();
  saveData();
  logAudit('REQ_REVIEW', reagent.name, `${decision === 'APPROVED' ? '通过' : '拒绝'} ${r.userName} 领用 ${r.quantity}${reagent.unit}`);
  showToast(decision === 'APPROVED' ? '已通过' : '已拒绝', decision === 'APPROVED' ? 'success' : 'warning');
  renderReview();
  updateBellBadge();
}

function reviewRes(id, decision) {
  const r = DB.reservations.find(x => x.id === id);
  if (!r) return;
  const device = DB.devices.find(x => x.id === r.deviceId);
  r.status = decision;
  r.reviewedAt = new Date().toISOString();
  pushNotification(decision === 'APPROVED' ? '设备预约已通过' : '设备预约被拒绝',
    `${r.userName} 预约的 ${device.name} ${formatDateTime(r.startTime)} ${decision === 'APPROVED' ? '已批准' : '被拒绝'}`,
    decision === 'APPROVED' ? 'INFO' : 'WARNING', r.userId);
  triggerAgent('resourceShare', `审批${decision==='APPROVED'?'通过':'拒绝'}: ${device.name}`);
  saveData();
  logAudit('RES_REVIEW', device.name, `${decision === 'APPROVED' ? '通过' : '拒绝'} ${r.userName} 预约`);
  showToast(decision === 'APPROVED' ? '已通过' : '已拒绝', decision === 'APPROVED' ? 'success' : 'warning');
  renderReview();
  updateBellBadge();
}

function renderAlerts() {
  const user = currentUser();
  const list = DB.notifications.filter(n => n.targetUser === null || n.targetUser === user.id);
  const unread = list.filter(n => !n.read);
  const read = list.filter(n => n.read);

  const renderItem = (n) => {
    const colors = {
      CRITICAL: 'border-rose-500/40 bg-rose-950/20',
      WARNING: 'border-amber-500/40 bg-amber-950/20',
      INFO: 'border-teal-500/40 bg-teal-950/20',
    };
    const icons = { CRITICAL: '🚨', WARNING: '⚠️', INFO: 'ℹ️' };
    return `
      <div class="border ${colors[n.level]} rounded-lg p-3 flex items-start gap-3 ${n.read ? 'opacity-60' : ''}">
        <div class="text-base">${icons[n.level]}</div>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-medium text-white">${escapeHtml(n.title)}</div>
          <div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(n.content)}</div>
          <div class="text-[10px] text-slate-600 mt-1">${formatTime(n.time)}</div>
        </div>
        ${!n.read ? `<button onclick="markRead('${n.id}')" class="text-[10px] text-slate-400 hover:text-emerald-400">标记已读</button>` : ''}
      </div>
    `;
  };

  document.getElementById('mainContent').innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div>
        <h1 class="text-xl font-semibold text-white">预警中心</h1>
        <p class="text-xs text-slate-500">${unread.length} 未读 · ${list.length} 总计</p>
      </div>
      ${unread.length ? `<button onclick="markAllRead()" class="text-xs px-3 py-1.5 border border-slate-700 rounded-lg text-slate-300 hover:bg-slate-800">全部已读</button>` : ''}
    </div>

    ${unread.length ? `
      <h3 class="text-xs text-amber-400 mb-2">未读 (${unread.length})</h3>
      <div class="space-y-2 mb-4">${unread.map(renderItem).join('')}</div>
    ` : ''}

    ${read.length ? `
      <h3 class="text-xs text-slate-500 mb-2">已读 (${read.length})</h3>
      <div class="space-y-2">${read.map(renderItem).join('')}</div>
    ` : ''}
  `;
}

function markRead(id) {
  const n = DB.notifications.find(x => x.id === id);
  if (n) { n.read = true; saveData(); updateBellBadge(); renderAlerts(); }
}

function markAllRead() {
  DB.notifications.forEach(n => { if (!n.read) n.read = true; });
  saveData();
  updateBellBadge();
  renderAlerts();
  showToast('已全部标记为已读', 'success');
}

function saveCompound(id) {
  const name = document.getElementById('cf_name').value.trim();
  const smiles = document.getElementById('cf_smiles').value.trim();
  if (!name || !smiles) { showToast('名称和 SMILES 必填', 'error'); return; }
  const data = {
    name, smiles,
    formula: document.getElementById('cf_formula').value.trim(),
    mw: +document.getElementById('cf_mw').value || 0,
    activity: {
      type: document.getElementById('cf_atype').value.trim(),
      value: document.getElementById('cf_avalue').value.trim(),
      cell: document.getElementById('cf_cell').value.trim(),
    },
    project: document.getElementById('cf_project').value.trim(),
  };
  if (id) {
    const c = DB.compounds.find(x => x.id === id);
    Object.assign(c, data);
    logAudit('COMPOUND_UPDATE', name, `更新化合物 ${name}`);
    triggerAgent('bioKeeper', `更新化合物 ${name}`);
    showToast('化合物已更新', 'success');
  } else {
    data.id = uid('c');
    data.contributor = currentUser().id;
    data.createdAt = new Date().toISOString().slice(0,10);
    DB.compounds.push(data);
    logAudit('COMPOUND_CREATE', name, `录入化合物 ${name}`);
    triggerAgent('bioKeeper', `录入新化合物 ${name}`);
    showToast('化合物已录入', 'success');
  }
  saveData();
  closeModal();
  renderCompounds();
  renderAgentMiniStatus();
}

function deleteCompound(id) {
  const c = DB.compounds.find(x => x.id === id);
  if (!c) return;
  openModal(`删除化合物`, `
    <p class="text-sm text-slate-300 mb-2">确认删除 <b class="text-rose-400">${c.name}</b>？</p>
    <p class="text-xs text-amber-400">⚠️ 私域化合物库数据将永久丢失</p>
  `, `<button onclick="closeModal()" class="px-3 py-1.5 text-xs border border-slate-700 rounded-lg text-slate-300 hover:bg-slate-800">取消</button>
      <button onclick="doDeleteCompound('${id}')" class="px-3 py-1.5 text-xs bg-rose-600 hover:bg-rose-500 text-white rounded-lg">确认删除</button>`, 'sm');
}

function doDeleteCompound(id) {
  const c = DB.compounds.find(x => x.id === id);
  if (!c) return;
  DB.compounds = DB.compounds.filter(x => x.id !== id);
  saveData();
  logAudit('COMPOUND_DELETE', c.name, `删除化合物 ${c.name}`);
  triggerAgent('bioKeeper', `删除化合物 ${c.name}`);
  showToast('化合物已删除', 'success');
  closeModal();
  renderCompounds();
}

function editAnnouncement(id) {
  const a = id ? DB.announcements.find(x => x.id === id) : {};

    <div class="space-y-3 text-xs">

function optimizeAnnouncement() {
  const title = document.getElementById('an_title').value;
  const content = document.getElementById('an_content').value;
  if (!content) { showToast('请先输入内容', 'warning'); return; }
  triggerAgent('concierge', 'LLM 文案优化中...');
  const original = content;
  const optimized = `【${title || '实验室通告'}】\n\n${original}\n\n—— 请各位同事知悉并配合执行。如有疑问，请联系管理员。\n（ICAN实验室 · ${new Date().toLocaleDateString('zh-CN')}）`;
  setTimeout(() => {
    document.getElementById('an_content').value = optimized;
    showToast('LLM 已优化文案', 'success');
  }, 800);
}

function saveAnnouncement(id) {
  const title = document.getElementById('an_title').value.trim();
  const content = document.getElementById('an_content').value.trim();
  if (!title || !content) { showToast('标题和内容必填', 'error'); return; }
  const target = document.getElementById('an_target').value;
  const user = currentUser();
  if (id) {
    const a = DB.announcements.find(x => x.id === id);
    a.title = title; a.content = content; a.targetRole = target;
    logAudit('ANNOUNCE_UPDATE', title, `更新通告`);
    showToast('通告已更新', 'success');
  } else {
    DB.announcements.unshift({
      id: uid('a'),
      title, content, targetRole: target,
      author: user.id, authorName: user.name,
      createdAt: new Date().toISOString(),
      readBy: [],
    });
    logAudit('ANNOUNCE_PUBLISH', title, `发布通告给 ${target}`);
    triggerAgent('concierge', `发布通告: ${title}`);
    // 推送通知给目标用户
    DB.users.filter(u => target === 'ALL' || u.role === target).forEach(u => {
      if (u.id !== user.id) {
        pushNotification('新通告', title, 'INFO', u.id);
      }
    });
    showToast('通告已发布', 'success');
  }
  saveData();
  closeModal();
  renderAnnouncements();
  updateBellBadge();
}

function deleteAnnouncement(id) {
  const a = DB.announcements.find(x => x.id === id);
  if (!a) return;
  openModal('删除通告', `<p class="text-sm text-slate-300">确认删除通告 <b class="text-rose-400">${a.title}</b>？</p>`,
    `<button onclick="closeModal()" class="px-3 py-1.5 text-xs border border-slate-700 rounded-lg text-slate-300 hover:bg-slate-800">取消</button>
     <button onclick="doDeleteAnnouncement('${id}')" class="px-3 py-1.5 text-xs bg-rose-600 hover:bg-rose-500 text-white rounded-lg">删除</button>`, 'sm');
}

function doDeleteAnnouncement(id) {
  const a = DB.announcements.find(x => x.id === id);
  DB.announcements = DB.announcements.filter(x => x.id !== id);
  saveData();
  logAudit('ANNOUNCE_DELETE', a.title, `删除通告`);
  showToast('已删除', 'success');
  closeModal();
  renderAnnouncements();
}

function markAnnouncementRead(id) {
  const user = currentUser();
  const a = DB.announcements.find(x => x.id === id);
  if (a && !a.readBy.includes(user.id)) {
    a.readBy.push(user.id);
    saveData();
    renderAnnouncements();
  }
}

function toggleAI() {
  const panel = document.getElementById('aiPanel');
  const isHidden = panel.classList.contains('hidden');
  if (isHidden) {
    panel.classList.remove('hidden');
    panel.classList.add('flex');
    if (aiContext.length === 0) {
      pushAIMessage('bot', `您好 ${currentUser().name}，我是 Concierge 统筹官。我可以调度 6 个分管智能体为您服务。请问有什么可以帮您？`, 'bot');
    }
  } else {
    panel.classList.add('hidden');
    panel.classList.remove('flex');
  }
  document.getElementById('aiUnread').classList.add('hidden');
}

function pushAIMessage(type, content, role = 'bot') {
  const container = document.getElementById('aiMessages');
  if (!container) return;
  const styles = {
    bot: 'bg-violet-950/30 border-violet-500/30 text-violet-100',
    user: 'bg-slate-800 border-slate-700 text-slate-200 ml-8',
    agent: 'bg-teal-950/30 border-teal-500/30 text-teal-100 text-[10px]',
    system: 'bg-slate-900/40 border-slate-700 text-slate-400 text-[10px] italic',
  };
  const msg = document.createElement('div');
  msg.className = `border rounded-lg px-3 py-2 ${styles[role] || styles.bot} fade-in`;
  msg.innerHTML = content;
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;

  // 上下文保存（仅 bot/user）
  if (role === 'bot' || role === 'user') {
    aiContext.push({ role, content: type === 'text' ? content : content.replace(/<[^>]+>/g, ''), time: Date.now() });
    if (aiContext.length > 10) aiContext = aiContext.slice(-10);
  }

  // 未读计数
  if (role === 'bot' || role === 'agent') {
    const panel = document.getElementById('aiPanel');
    if (panel.classList.contains('hidden')) {
      const badge = document.getElementById('aiUnread');
      badge.classList.remove('hidden');
      badge.textContent = (parseInt(badge.textContent) || 0) + 1;
    }
  }
}

function sendAI() {
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if (!text) return;
  pushAIMessage('text', escapeHtml(text), 'user');
  input.value = '';
  triggerAgent('concierge', `处理用户提问: ${text.slice(0,20)}...`);
  setTimeout(() => {
    const reply = generateAIReply(text);
    pushAIMessage('text', reply, 'bot');
  }, 500 + Math.random() * 500);
}

function askAI(text) {
  document.getElementById('aiPanel').classList.remove('hidden');
  document.getElementById('aiPanel').classList.add('flex');
  pushAIMessage('text', escapeHtml(text), 'user');
  triggerAgent('concierge', `快捷查询: ${text}`);
  setTimeout(() => {
    const reply = generateAIReply(text);
    pushAIMessage('text', reply, 'bot');
  }, 400);
}

function generateAIReply(input) {
  const q = input.toLowerCase();
  const user = currentUser();

  // 低库存
  if (q.includes('低库存') || q.includes('库存不足') || q.includes('缺货')) {
    const low = DB.reagents.filter(r => r.stock < r.minStock);
    if (!low.length) return '✅ 当前所有试剂库存充足，无低库存预警。';
    return `📦 <b>ReagentKeeper 报告</b>：检测到 <b>${low.length}</b> 种低库存试剂：<br>${low.map(r => `• ${r.name}：${r.stock}${r.unit}（最低 ${r.minStock}${r.unit}）`).join('<br>')}<br><br>建议尽快安排补货。`;
  }

  // 待办
  if (q.includes('待办') || q.includes('审批') || q.includes('pending')) {
    if (isAdmin()) {
      const req = DB.requisitions.filter(r => r.status === 'PENDING').length;
      const res = DB.reservations.filter(r => r.status === 'PENDING').length;
      return `⏰ <b>今日待办</b>：<br>• 试剂领用审批：<b>${req}</b> 项<br>• 设备预约审批：<b>${res}</b> 项<br><br>点击侧栏「审批中心」即可处理。`;
    } else {
      const myReq = DB.requisitions.filter(r => r.userId === user.id && r.status === 'PENDING').length;
      return `⏰ 您有 <b>${myReq}</b> 项领用申请待审批。`;
    }
  }

  // 月报/趋势
  if (q.includes('月报') || q.includes('趋势') || q.includes('统计') || q.includes('报告')) {
    const totalReagents = DB.reagents.length;
    const totalCalls = Object.values(DB.agentStats).reduce((s,a) => s+a.calls, 0);
    const totalRes = DB.reservations.length;
    const totalReq = DB.requisitions.length;
    return `📊 <b>本月运营月报</b>：<br>• 试剂种类：<b>${totalReagents}</b><br>• 领用申请：<b>${totalReq}</b> 次<br>• 设备预约：<b>${totalRes}</b> 次<br>• 智能体总调用：<b>${totalCalls}</b> 次<br>• 化合物入库：<b>${DB.compounds.length}</b> 个<br><br>整体运行平稳，建议关注低库存试剂补货。`;
  }

  // 化合物
  if (q.includes('化合物') || q.includes('biokeeper') || q.includes('私域')) {
    const projects = {};
    DB.compounds.forEach(c => { projects[c.project] = (projects[c.project]||0) + 1; });
    return `🧬 <b>BioKeeper 化合物库概况</b>：<br>• 总化合物数：<b>${DB.compounds.length}</b><br>• 活性类型：<b>${new Set(DB.compounds.map(c=>c.activity?.type).filter(Boolean)).size}</b> 类<br>• 项目分布：${Object.entries(projects).map(([k,v])=>`${k}(${v})`).join('、')}<br><br>第三层 SAR 智能发现已就绪，可基于结构相似性挖掘潜在活性化合物。`;
  }

  // 设备
  if (q.includes('设备') || q.includes('预约') || q.includes('instrument')) {
    const active = DB.devices.filter(d => d.status === 'ACTIVE').length;
    const maintenance = DB.devices.filter(d => d.status === 'MAINTENANCE').length;
    const todayRes = DB.reservations.filter(r => r.startTime.startsWith(new Date().toISOString().slice(0,10))).length;
    return `🔬 <b>ResourceShare 设备概况</b>：<br>• 总设备数：<b>${DB.devices.length}</b><br>• 运行中：<b>${active}</b> · 维护中：<b>${maintenance}</b><br>• 今日预约：<b>${todayRes}</b> 场<br><br>低风险设备可直接预约，高风险设备需管理员审批。`;
  }

  // 风险
  if (q.includes('风险') || q.includes('安全') || q.includes('warning')) {
    const low = DB.reagents.filter(r => r.stock < r.minStock).length;
    const expiring = DB.reagents.filter(r => { const d = daysUntil(r.expiry); return d >= 0 && d <= 30; }).length;
    const expired = DB.reagents.filter(r => daysUntil(r.expiry) < 0).length;
    return `🛡️ <b>SafetyGuard 安全基线</b>：<br>• 低库存预警：<b>${low}</b> 项<br>• 临期试剂（30天内）：<b>${expiring}</b> 项<br>• 已过期试剂：<b>${expired}</b> 项<br><br>当前风险等级：<b>${low+expired > 3 ? '较高' : (low+expired > 0 ? '中等' : '低')}</b>，建议${low+expired > 0 ? '尽快处理预警项' : '保持现状'}。`;
  }

  // 问候
  if (q.includes('你好') || q.includes('hello') || q.includes('hi') || q.includes('在吗')) {
    return `您好 ${user.name}！我是 Concierge 统筹官，可调度 7 个智能体为您服务。您可以问我：低库存、待办、月报、化合物、设备、风险等。`;
  }

  // 帮助
  if (q.includes('帮助') || q.includes('help') || q.includes('能做什么')) {
    return `🤖 我可以帮您：<br>• 查询低库存试剂<br>• 查看待办审批<br>• 生成本月运营月报<br>• 查看 BioKeeper 化合物库<br>• 查询设备状态<br>• 评估安全风险<br><br>试试点击下方快捷按钮，或直接输入您的问题。`;
  }

  // 默认
  return `🤔 我理解您的问题是「${escapeHtml(input.slice(0,40))}」。目前我支持以下关键词：<br>• 低库存 / 待办 / 月报 / 化合物 / 设备 / 风险<br><br>请尝试使用这些关键词，或点击下方快捷按钮。`;
}

// 跨实体搜索
// ════════════════════════════════════════════════════════
function setupGlobalSearch() {
  const input = document.getElementById('globalSearch');
  const results = document.getElementById('searchResults');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { results.classList.add('hidden'); return; }
    const matches = [];
    // 试剂
    DB.reagents.forEach(r => {
      if (r.name.toLowerCase().includes(q) || r.cas.toLowerCase().includes(q)) {
        matches.push({ type: '试剂', icon: '🧪', title: r.name, sub: `CAS: ${r.cas} · 库存 ${r.stock}${r.unit}`, action: `viewReagent('${r.id}')` });
      }
    });
    // 设备
    DB.devices.forEach(d => {
      if (d.name.toLowerCase().includes(q) || (d.model||'').toLowerCase().includes(q)) {
        matches.push({ type: '设备', icon: '🔬', title: d.name, sub: `${d.model} · ${d.location}`, action: `navigateTo('devices')` });
      }
    });
    // 化合物
    DB.compounds.forEach(c => {
      if (c.name.toLowerCase().includes(q) || (c.smiles||'').toLowerCase().includes(q)) {
        matches.push({ type: '化合物', icon: '🧬', title: c.name, sub: `${c.formula} · ${c.activity?.value||'-'}`, action: `navigateTo('compounds')` });
      }
    });
    // 通告
    DB.announcements.forEach(a => {
      if (a.title.toLowerCase().includes(q) || a.content.toLowerCase().includes(q)) {
        matches.push({ type: '通告', icon: '📢', title: a.title, sub: a.content.slice(0, 60), action: `navigateTo('announcements')` });
      }
    });
    // 用户
    DB.users.forEach(u => {
      if (u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)) {
        matches.push({ type: '人员', icon: '👤', title: u.name, sub: `${u.email} · ${u.role}`, action: `navigateTo('users')` });
      }
    });

    if (!matches.length) {
      results.innerHTML = `<div class="px-3 py-4 text-xs text-slate-500 text-center">无匹配结果</div>`;
    } else {
      results.innerHTML = matches.slice(0, 12).map(m => `
        <button onclick="document.getElementById('searchResults').classList.add('hidden');document.getElementById('globalSearch').value='';${m.action}" class="w-full text-left px-3 py-2 hover:bg-slate-800 border-b border-slate-800 last:border-0 transition">
          <div class="flex items-center gap-2">
            <span class="text-base">${m.icon}</span>
            <div class="flex-1 min-w-0">
              <div class="text-xs text-white truncate">${escapeHtml(m.title)} <span class="text-[9px] text-slate-500 ml-1">[${m.type}]</span></div>
              <div class="text-[10px] text-slate-500 truncate">${escapeHtml(m.sub)}</div>
            </div>
          </div>
        </button>
      `).join('');
    }
    results.classList.remove('hidden');
  });
  input.addEventListener('blur', () => setTimeout(() => results.classList.add('hidden'), 200));
}

// ════════════════════════════════════════════════════════
// 键盘快捷键
// ════════════════════════════════════════════════════════
function setupShortcuts() {
  let keyBuffer = [];
  let bufferTimer = null;
  document.addEventListener('keydown', (e) => {
    // Esc 关闭弹窗
    if (e.key === 'Escape') {
      closeModal();
      document.getElementById('shortcutsHelp').classList.add('hidden');
      document.getElementById('searchResults').classList.add('hidden');
      return;
    }
    // 忽略输入框中的快捷键（除了 / 和 Escape）
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
      if (e.key === '/' && e.target.id !== 'globalSearch') return;
      if (e.target.id === 'globalSearch') return;
    }
    // ? 显示帮助
    if (e.key === '?' && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      document.getElementById('shortcutsHelp').classList.toggle('hidden');
      return;
    }
    // / 聚焦搜索
    if (e.key === '/') {
      e.preventDefault();
      document.getElementById('globalSearch').focus();
      return;
    }
    // Cmd/Ctrl + K 切换 AI
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      toggleAI();
      return;
    }
    // g + 字母 导航
    if (e.key === 'g') {
      keyBuffer = ['g'];
      clearTimeout(bufferTimer);
      bufferTimer = setTimeout(() => keyBuffer = [], 800);
      return;
    }
    if (keyBuffer[0] === 'g') {
      const map = { d: 'dashboard', r: 'reagents', e: 'devices', a: 'review', c: 'compounds', u: 'users', l: 'audit', m: 'myapps', n: 'announcements', s: 'alerts', g: 'agents' };
      if (map[e.key] && (!isAdmin() || true)) {
        const nav = isAdmin() ? NAV_ADMIN : NAV_MEMBER;
        if (nav.find(n => n.key === map[e.key])) {
          navigateTo(map[e.key]);
        }
        keyBuffer = [];
      }
    }
  });
}

    if (!SESSION.userId) {
      const badge = document.getElementById('aiUnread');
      badge.classList.remove('hidden');
      badge.textContent = '1';
    }
  }, 1500);
}

// 启动
init();
</script>
