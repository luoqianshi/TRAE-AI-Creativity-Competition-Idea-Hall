<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衣食无忧｜三口之家一日三餐采买 H5演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f6fbf8;
            color: #333;
            overflow-x: hidden;
            padding-bottom: 120px;
        }

        /* 异形浮动装饰 */
        .shape {
            position: absolute;
            opacity: 0.12;
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }
        .s1 {
            top: 50px;
            left: 5%;
            width: 110px;
            height: 110px;
            background: #52c41a;
            border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
        }
        .s2 {
            top: 400px;
            right: 6%;
            width: 150px;
            height: 150px;
            background: #73d13d;
            border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%;
            animation-delay: 1s;
        }
        .s3 {
            bottom: 120px;
            left: 18%;
            width: 90px;
            height: 90px;
            background: #b7eb8f;
            border-radius: 60% 40% 70% 30% / 30% 40% 60% 70%;
            animation-delay: 2s;
        }

        @keyframes float {
            0%,100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1s ease;
        }

        .header h1 {
            color: #2f850d;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .header p {
            color: #507c38;
            font-size: 16px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(82, 196, 26, 0.12);
            transition: 0.3s ease;
            animation: fadeInUp 0.8s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(82, 196, 26, 0.18);
        }

        .card h3 {
            color: #389e0d;
            font-size: 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .card h3::before {
            content: "";
            width: 6px;
            height: 20px;
            background: #52c41a;
            border-radius: 3px;
            margin-right: 10px;
        }

        /* 时段大标题 早餐/午餐/晚餐 */
        .time-title {
            font-size: 18px;
            color: #2f850d;
            font-weight: 600;
            margin: 26px 0 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #d9f7be;
        }
        .time-title:first-of-type {
            margin-top: 0;
        }

        /* 菜品名称 */
        .menu-title {
            font-size: 16px;
            color: #237804;
            font-weight: 500;
            margin: 14px 0 8px 6px;
        }

        /* 食材条目 */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0 7px 18px;
            font-size: 15px;
        }

        .normal-text {
            color: #389e0d;
            font-weight: 500;
        }

        /* 缺货提醒按钮 */
        .warn-btn {
            padding: 4px 10px;
            border: 1px solid #cf1322;
            color: #cf1322;
            background: #fff2f0;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        /* 卡片内确定菜单按钮 */
        #confirmBtn {
            width: 100%;
            height: 44px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            background: #389e0d;
            color: #fff;
            margin-top: 30px;
        }
        #confirmBtn:active {
            opacity: 0.8;
        }

        /* 右下角悬浮圆形刷新按钮 */
        #refreshBtn {
            position: fixed;
            right: 24px;
            bottom: 40px;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: none;
            background: #389e0d;
            color: #fff;
            font-size: 15px;
            line-height: 1.4;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(56, 158, 13, 0.3);
            z-index: 999;
            transition: transform 0.2s ease;
        }
        #refreshBtn:active {
            transform: scale(0.92);
        }

        .tip-box {
            background: #edf7e9;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            color: #237804;
            margin-top: 30px;
            font-weight: 500;
        }

        @keyframes fadeIn {
            from {opacity:0;}
            to {opacity:1;}
        }

        @keyframes fadeInUp {
            from {opacity:0; transform: translateY(20px);}
            to {opacity:1; transform: translateY(0);}
        }

        @media (max-width: 768px) {
            .shape {display: none;}
            .header h1 {font-size: 26px;}
            #refreshBtn {
                width: 76px;
                height: 76px;
                right: 16px;
                bottom: 24px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- 异形浮动绿色背景装饰 -->
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>

    <div class="container">
        <div class="header">
            <h1>衣食无忧</h1>
            <p>三口之家 · 一日三餐标准化采买清单</p>
            <p>直接照单采购，无需纠结三餐吃什么</p>
        </div>

        <!-- 三餐清单主卡片 -->
        <div class="card">
            <h3>今日三餐菜谱 & 对应采购食材</h3>
            <div id="menuBox">
                <!-- 菜单内容JS动态切换 -->
            </div>
            <button id="confirmBtn">确定菜单</button>
        </div>

        <!-- 厨房油盐酱醋辅料补货提醒 -->
        <div class="card">
            <h3>厨房油盐酱醋｜辅料补货提醒</h3>
            <div class="list-item">
                <span>食用油</span>
                <button class="warn-btn" onclick="alert('已经补货')">即将耗尽｜今日需补货</button>
            </div>
            <div class="list-item">
                <span>生抽/酱油</span>
                <button class="warn-btn" onclick="alert('已经补货')">余量偏低｜建议补货</button>
            </div>
            <div class="list-item">
                <span>食用盐</span>
                <span class="normal-text">库存充足</span>
            </div>
            <div class="list-item">
                <span>陈醋、料酒、白糖、八角、花椒</span>
                <span class="normal-text">无需采购</span>
            </div>
        </div>

        <!-- 新增：卫浴日用品补货提醒卡片 -->
        <div class="card">
            <h3>卫浴日用品｜补货提醒</h3>
            <div class="list-item">
                <span>卫生纸</span>
                <button class="warn-btn" onclick="alert('已经补货')">即将耗尽｜今日需补货</button>
            </div>
            <div class="list-item">
                <span>沐浴露</span>
                <button class="warn-btn" onclick="alert('已经补货')">余量偏低｜建议补货</button>
            </div>
            <div class="list-item">
                <span>洗发水</span>
                <button class="warn-btn" onclick="alert('已经补货')">余量偏低｜建议补货</button>
            </div>
            <div class="list-item">
                <span>蚊香液</span>
                <span class="normal-text">库存充足</span>
            </div>
            <div class="list-item">
                <span>卫生巾</span>
                <button class="warn-btn" onclick="alert('已经补货')">即将耗尽｜今日需补货</button>
            </div>
            <div class="list-item">
                <span>护发素</span>
                <span class="normal-text">库存充足</span>
            </div>
            <div class="list-item">
                <span>花露水</span>
                <span class="normal-text">无需采购</span>
            </div>
        </div>

    </div>

    <!-- 右下角固定圆形悬浮刷新按钮，两行文字 -->
    <button id="refreshBtn">
        刷新<br>菜单
    </button>

<script>
// 两套菜单数据
const menuList = [
    // 第一套初始菜单
    `
    <div class="time-title">☀️ 早餐</div>
    <div class="menu-title">套餐：纯牛奶 + 白面馒头 + 水煮鸡蛋</div>
    <div class="list-item">
        <span>纯牛奶</span>
        <span>3盒（250ml/盒）</span>
    </div>
    <div class="list-item">
        <span>白面馒头</span>
        <span>3个</span>
    </div>
    <div class="list-item">
        <span>新鲜鸡蛋</span>
        <span>3枚</span>
    </div>

    <div class="time-title">🌤️ 午餐（3菜1汤）</div>
    <div class="menu-title">菜品1：青椒炒瘦肉（猪肉）</div>
    <div class="list-item">
        <span>猪瘦肉</span>
        <span>350g</span>
    </div>
    <div class="list-item">
        <span>青椒</span>
        <span>3个</span>
    </div>

    <div class="menu-title">菜品2：清蒸鲈鱼（鱼肉）</div>
    <div class="list-item">
        <span>鲈鱼</span>
        <span>1条（500g左右）</span>
    </div>
    <div class="list-item">
        <span>生姜、葱段</span>
        <span>少许</span>
    </div>

    <div class="menu-title">菜品3：清炒上海青</div>
    <div class="list-item">
        <span>上海青</span>
        <span>1大把</span>
    </div>

    <div class="menu-title">汤品：番茄鸡蛋汤</div>
    <div class="list-item">
        <span>番茄</span>
        <span>2个</span>
    </div>
    <div class="list-item">
        <span>鸡蛋</span>
        <span>2枚</span>
    </div>

    <div class="time-title">🌙 晚餐（3菜1汤）</div>
    <div class="menu-title">菜品1：香煎鸡胸肉（鸡肉）</div>
    <div class="list-item">
        <span>鸡胸肉</span>
        <span>300g</span>
    </div>

    <div class="menu-title">菜品2：土豆炒牛肉</div>
    <div class="list-item">
        <span>牛里脊</span>
        <span>250g</span>
    </div>
    <div class="list-item">
        <span>土豆</span>
        <span>2个中等大小</span>
    </div>

    <div class="menu-title">菜品3：蒜蓉油麦菜</div>
    <div class="list-item">
        <span>油麦菜</span>
        <span>1大把</span>
    </div>

    <div class="menu-title">汤品：嫩豆腐菌菇汤</div>
    <div class="list-item">
        <span>嫩豆腐</span>
        <span>1块</span>
    </div>
    <div class="list-item">
        <span>鲜香菇</span>
        <span>4朵</span>
    </div>

    <div class="menu-title">餐后搭配</div>
    <div class="list-item">
        <span>应季水果</span>
        <span>3人份适量</span>
    </div>
    `,
    // 第二套刷新后菜单
    `
    <div class="time-title">☀️ 早餐</div>
    <div class="menu-title">套餐：小米粥 + 吐司面包 + 水煮鸡蛋</div>
    <div class="list-item">
        <span>小米</span>
        <span>一小碗（熬粥）</span>
    </div>
    <div class="list-item">
        <span>吐司面包</span>
        <span>6片</span>
    </div>
    <div class="list-item">
        <span>新鲜鸡蛋</span>
        <span>3枚</span>
    </div>

    <div class="time-title">🌤️ 午餐（3菜1汤）</div>
    <div class="menu-title">菜品1：红烧鸡块（鸡肉）</div>
    <div class="list-item">
        <span>三黄鸡半只</span>
        <span>约600g</span>
    </div>
    <div class="list-item">
        <span>青椒、土豆</span>
        <span>各1个</span>
    </div>

    <div class="menu-title">菜品2：蒜苗炒五花肉（猪肉）</div>
    <div class="list-item">
        <span>五花肉</span>
        <span>300g</span>
    </div>
    <div class="list-item">
        <span>蒜苗</span>
        <span>1把</span>
    </div>

    <div class="menu-title">菜品3：清炒娃娃菜</div>
    <div class="list-item">
        <span>娃娃菜</span>
        <span>1颗</span>
    </div>

    <div class="menu-title">汤品：冬瓜丸子汤</div>
    <div class="list-item">
        <span>冬瓜</span>
        <span>400g</span>
    </div>
    <div class="list-item">
        <span>猪肉馅</span>
        <span>200g</span>
    </div>

    <div class="time-title">🌙 晚餐（3菜1汤）</div>
    <div class="menu-title">菜品1：香煎巴沙鱼（鱼肉）</div>
    <div class="list-item">
        <span>巴沙鱼柳</span>
        <span>2片共400g</span>
    </div>

    <div class="menu-title">菜品2：洋葱炒羊肉</div>
    <div class="list-item">
        <span>羊肉片</span>
        <span>300g</span>
    </div>
    <div class="list-item">
        <span>洋葱</span>
        <span>1个</span>
    </div>

    <div class="menu-title">菜品3：清炒空心菜</div>
    <div class="list-item">
        <span>空心菜</span>
        <span>1大把</span>
    </div>

    <div class="menu-title">汤品：丝瓜鸡蛋汤</div>
    <div class="list-item">
        <span>丝瓜</span>
        <span>1根</span>
    </div>
    <div class="list-item">
        <span>鸡蛋</span>
        <span>2枚</span>
    </div>

    <div class="menu-title">餐后搭配</div>
    <div class="list-item">
        <span>应季水果</span>
        <span>3人份适量</span>
    </div>
    `
];

let currentIndex = 0;
const menuBox = document.getElementById('menuBox');
const refreshBtn = document.getElementById('refreshBtn');
const confirmBtn = document.getElementById('confirmBtn');

// 初始化渲染第一套菜单
menuBox.innerHTML = menuList[currentIndex];

// 刷新菜单：静默切换，无弹窗
refreshBtn.onclick = function() {
    currentIndex = currentIndex === 0 ? 1 : 0;
    menuBox.innerHTML = menuList[currentIndex];
}

// 确定菜单弹窗
confirmBtn.onclick = function() {
    alert('菜单已确认，可对照清单前往采购！');
}
</script>
</body>
</html>
