<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo抽签系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f1117;--bg2:#1a1d2e;--bg3:#252840;--fg:#e8e8ed;--fg2:#8b8fa3;--accent:#f59e0b;--accent2:#fbbf24;--border:rgba(255,255,255,0.1);--radius:12px;--radius-sm:8px;--transition:all 0.3s ease;}
body.light{--bg:#f5f6fa;--bg2:#ffffff;--bg3:#e8eaf0;--fg:#1a1a2e;--fg2:#6b7280;--accent:#d97706;--accent2:#f59e0b;--border:rgba(0,0,0,0.1);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--fg);transition:var(--transition);}
.page{display:none;position:relative;z-index:1;padding:20px;max-width:800px;margin:0 auto;min-height:100vh;}
.page.active{display:block;}
#pageDraw{position:relative;z-index:1;height:100vh;max-width:none;margin:0;overflow:hidden;display:none;flex-direction:column;padding:0;}
#pageDraw.active{display:flex;}
#pageDraw .back-btn{position:absolute;top:12px;left:12px;z-index:200;background:var(--bg2);color:var(--fg);border:1px solid var(--border);padding:6px 14px;border-radius:var(--radius-sm);font-size:0.8rem;cursor:pointer;}
#drawModules{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:40px 20px 10px;overflow:hidden;min-height:0;}
#drawModules .draw-module{width:100%;max-width:none;margin:0;flex-shrink:0;}
#drawModules .draw-module[data-module="button"]{flex-shrink:1;}
#drawModules .draw-module[data-module="result"]{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;}
/* 编辑模式：工具栏fixed不占空间 */
.edit-toolbar{position:fixed;top:0;left:0;right:0;z-index:250;display:none;background:rgba(30,32,40,0.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:6px 12px;gap:4px;flex-wrap:wrap;align-items:center;}
#pageDraw.fullscreen .back-btn,
#pageDraw.fullscreen .timer-bar,
#pageDraw.fullscreen .edit-toolbar,
#pageDraw.fullscreen .editSaveBar,
#pageDraw.fullscreen .pos-label,
#pageDraw.fullscreen .resize-handle,
#pageDraw.fullscreen .shape-delete,
#pageDraw.fullscreen #modeOneBtn,
#pageDraw.fullscreen #modeAllBtn,
#pageDraw.fullscreen #remainCount{display:none !important;}
#pageDraw.fullscreen #drawPageTitle{cursor:pointer;user-select:none;}
#pageDraw.fullscreen #drawPageTitle:hover{opacity:0.8;}
#pageDraw.fullscreen{padding-bottom:0;}
#pageDraw.fullscreen #drawModules{padding-top:20px;}
.draw-page-bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;}
.draw-module{position:relative;padding:10px 16px;margin:0;border-radius:var(--radius);background:transparent;border:none;transition:var(--transition);}
body.light .draw-module{background:transparent;}
.editable-element.selected{outline:none;}
.editable-element.selected::before{content:'';position:absolute;inset:-1px;border:1px dashed #3b82f6;pointer-events:none;z-index:1;}
.editable-element.selected .handle-tl,.editable-element.selected .handle-tc,.editable-element.selected .handle-tr,
.editable-element.selected .handle-ml,.editable-element.selected .handle-mr,
.editable-element.selected .handle-bl,.editable-element.selected .handle-bc,.editable-element.selected .handle-br{display:block;position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #3b82f6;z-index:2;pointer-events:none;}
.editable-element.selected .handle-tl{top:-5px;left:-5px;cursor:nwse-resize;pointer-events:auto;}
.editable-element.selected .handle-tc{top:-5px;left:50%;margin-left:-4px;cursor:ns-resize;pointer-events:auto;}
.editable-element.selected .handle-tr{top:-5px;right:-5px;cursor:nesw-resize;pointer-events:auto;}
.editable-element.selected .handle-ml{top:50%;margin-top:-4px;left:-5px;cursor:ew-resize;pointer-events:auto;}
.editable-element.selected .handle-mr{top:50%;margin-top:-4px;right:-5px;cursor:ew-resize;pointer-events:auto;}
.editable-element.selected .handle-bl{bottom:-5px;left:-5px;cursor:nesw-resize;pointer-events:auto;}
.editable-element.selected .handle-bc{bottom:-5px;left:50%;margin-left:-4px;cursor:ns-resize;pointer-events:auto;}
.editable-element.selected .handle-br{bottom:-5px;right:-5px;cursor:nwse-resize;pointer-events:auto;}
.resize-handle{position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize;opacity:0;transition:opacity 0.2s;}
.draw-module:hover .resize-handle,.editing .resize-handle{opacity:1;}
.resize-handle::after{content:'';position:absolute;bottom:2px;right:2px;width:10px;height:10px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);}
.pos-label{position:absolute;top:-18px;left:8px;font-size:0.65rem;color:var(--fg2);opacity:0;transition:opacity 0.2s;}
.editing .pos-label{opacity:1;}
.result-item{padding:12px 20px;background:linear-gradient(135deg,rgba(245,158,11,0.15),rgba(245,158,11,0.05));border:1px solid var(--accent);border-radius:var(--radius);font-size:1rem;font-weight:600;color:var(--accent2);animation:drawResult 0.5s ease;}
@keyframes drawResult{from{transform:scale(0.8);opacity:0;}to{transform:scale(1);opacity:1;}}
.draw-btn{width:180px;height:180px;border-radius:50%;border:none;font-size:22px;font-weight:700;cursor:pointer;transition:var(--transition);display:inline-flex;align-items:center;justify-content:center;}
.draw-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(245,158,11,0.4);}
.draw-btn:active{transform:scale(0.95);}
.draw-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.edit-toolbar.visible{display:flex;}
.edit-toolbar .tool-group{position:relative;}
.edit-toolbar .tool-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:4px 10px;border-radius:4px;font-size:0.75rem;cursor:pointer;display:flex;align-items:center;gap:4px;transition:var(--transition);}
.edit-toolbar .tool-btn:hover{background:rgba(255,255,255,0.2);}
.edit-toolbar .tool-btn.active{background:var(--accent);color:#000;}
.edit-toolbar .tool-dropdown{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:rgba(30,32,40,0.98);border:1px solid var(--border);border-radius:6px;padding:10px;min-width:200px;z-index:260;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
.edit-toolbar .tool-dropdown.open{display:block;}
.edit-toolbar .tool-dropdown label{font-size:0.7rem;color:var(--fg2);display:block;margin-bottom:3px;}
.edit-toolbar .tool-dropdown .form-input{font-size:0.78rem;padding:4px 6px;width:100%;}
.edit-toolbar .tool-dropdown .dd-btn{display:block;width:100%;text-align:left;background:none;border:none;color:#fff;padding:6px 8px;border-radius:4px;font-size:0.78rem;cursor:pointer;transition:var(--transition);}
.edit-toolbar .tool-dropdown .dd-btn:hover{background:rgba(255,255,255,0.1);}
.edit-toolbar .tool-dropdown .dd-btn.disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}
.edit-toolbar .tool-dropdown .color-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.edit-toolbar .tool-dropdown .color-row input[type="color"]{width:32px;height:24px;border:none;background:none;cursor:pointer;padding:0;}
.edit-toolbar .dd-submenu-trigger{position:relative;}
.edit-toolbar .dd-submenu{display:none;position:absolute;left:100%;top:0;margin-left:4px;background:rgba(30,32,40,0.98);border:1px solid var(--border);border-radius:6px;padding:6px;min-width:140px;z-index:270;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
.edit-toolbar .dd-submenu.open{display:block;}
.edit-toolbar .tool-separator{width:1px;height:24px;background:rgba(255,255,255,0.15);margin:0 4px;}
.timer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;z-index:300;}
.timer-display{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;}
.timer-display.urgent{color:#ef4444;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
.decor-shape{position:absolute;cursor:move;transition:box-shadow 0.2s;}
.decor-shape .resize-handle{opacity:0;}
.decor-shape:hover .resize-handle,.editing .decor-shape .resize-handle{opacity:1;}
.shape-delete{position:absolute;top:-10px;right:-10px;width:20px;height:20px;background:#ef4444;color:#fff;border-radius:50%;font-size:0.65rem;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:10;}
.editing .shape-delete{display:flex;}
.btn{padding:8px 16px;border:none;border-radius:var(--radius-sm);font-size:0.85rem;cursor:pointer;transition:var(--transition);}
.btn-primary{background:var(--accent);color:#000;font-weight:600;}
.btn-primary:hover{opacity:0.9;}
.btn-secondary{background:var(--bg3);color:var(--fg);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--border);}
.btn-sm{padding:4px 10px;font-size:0.78rem;}
.btn-danger{background:#ef4444;color:#fff;}
.setup-tab{flex:1;padding:10px 8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--fg2);font-size:0.85rem;cursor:pointer;transition:var(--transition);margin-bottom:-2px;}
.setup-tab:hover{color:var(--fg);}
.setup-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.setup-panel{display:none;}
.form-input{width:100%;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--fg);font-size:0.85rem;}
.form-input:focus{outline:none;border-color:var(--accent);}
.form-label{font-size:0.8rem;color:var(--fg2);margin-bottom:4px;display:block;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;}
.modal h3{margin-bottom:16px;font-size:1.1rem;}
#toastContainer{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:10px 16px;border-radius:var(--radius-sm);font-size:0.85rem;color:#fff;animation:toastIn 0.3s ease;min-width:200px;}
.toast.success{background:#22c55e;}
.toast.error{background:#ef4444;}
.toast.info{background:#3b82f6;}
@keyframes toastIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
#editSaveBar{position:fixed;bottom:0;left:0;right:0;background:rgba(30,32,40,0.95);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:12px 20px;display:none;align-items:center;justify-content:center;gap:12px;z-index:310;}
#editSaveBar.visible{display:flex;}
</style>
</head>
<body class="dark">
<div id="toastContainer"></div>

<!-- 页面1: 活动列表 -->
<div class="page active" id="pageList">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
    <h1 style="font-size:1.8rem;">Bingo抽签系统</h1>
    <button class="btn btn-secondary" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  <button class="btn btn-primary" style="width:100%;margin-bottom:20px;padding:12px;font-size:1rem;" onclick="createActivity()">＋ 创建新活动</button>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <h2 style="font-size:1.1rem;">🎯 活动列表</h2>
  </div>
  <div id="activityList"></div>
  <div style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <h2 style="font-size:1.1rem;">📋 名单管理</h2>
    <button class="btn btn-secondary btn-sm" onclick="openRosterModal()">＋ 新建名单</button>
  </div>
  <div id="rosterListHome"></div>
</div>

<!-- 页面2: 活动设置 -->
<div class="page" id="pageSetup">
  <button class="btn btn-secondary" style="margin-bottom:16px;" onclick="goBack()">← 返回列表</button>
  <h2 style="margin-bottom:8px;">活动设置</h2>
  <div style="color:var(--fg2);font-size:0.8rem;margin-bottom:16px;">设置完成后，进入抽签页点击「全屏模式」即可进入正式抽签场景</div>
  <div class="card" style="margin-bottom:16px;">
    <label class="form-label">活动名称</label>
    <div style="display:flex;gap:8px;">
      <input class="form-input" id="setupName" placeholder="请输入活动名称" style="flex:1;">
      <button class="btn btn-primary btn-sm" onclick="saveSetupName()">保存</button>
    </div>
  </div>
  <button class="btn btn-primary" style="width:100%;margin-bottom:16px;padding:12px;font-size:1rem;" onclick="startDrawing()">进入活动</button>
  <!-- 分页标签 -->
  <div style="display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border);">
    <button class="setup-tab active" id="tabTime" onclick="switchSetupTab('time')">⏰ 活动时间</button>
    <button class="setup-tab" id="tabCandidates" onclick="switchSetupTab('candidates')">👥 候选人管理</button>
    <button class="setup-tab" id="tabItems" onclick="switchSetupTab('items')">🎯 抽签名目</button>
  </div>
  <!-- 分页内容 -->
  <div id="setupPanelTime" class="setup-panel">
    <div class="card">
      <label class="form-label">日期</label>
      <input class="form-input" type="date" id="setupDate">
      <div style="display:flex;gap:12px;margin-top:8px;">
        <div style="flex:1;">
          <label class="form-label">开始时间</label>
          <input class="form-input" type="time" id="setupStartTime">
        </div>
        <div style="flex:1;">
          <label class="form-label">结束时间</label>
          <input class="form-input" type="time" id="setupEndTime">
        </div>
      </div>
      <div style="margin-top:8px;">
        <label class="form-label">可能超时时间（分钟）</label>
        <input class="form-input" type="number" id="setupOvertime" min="0" value="0" placeholder="0" style="max-width:200px;">
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:12px;padding:10px;" onclick="saveSetupTime()">保存时间设置</button>
  </div>
  <div id="setupPanelCandidates" class="setup-panel" style="display:none;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3>候选人管理</h3>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary btn-sm" onclick="document.getElementById('excelFileInput').click()">Excel导入</button>
          <button class="btn btn-secondary btn-sm" onclick="openRosterSelectModal()">📋 从名单导入</button>
          <input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="importExcel(this.files[0])">
        </div>
      </div>
      <div id="fieldMappingArea" style="display:none;margin-bottom:12px;">
        <label class="form-label">姓名列映射</label>
        <select class="form-input" id="fieldMappingSelect" onchange="applyFieldMapping()">
          <option value="">请选择姓名列</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <textarea class="form-input" id="addCandidateInput" placeholder="输入候选人姓名，支持从Excel粘贴多行" style="flex:1;min-height:60px;resize:vertical;font-size:0.8rem;"></textarea>
        <button class="btn btn-primary btn-sm" onclick="addCandidateManual()">添加</button>
      </div>
      <div id="rosterList" style="max-height:300px;overflow-y:auto;"></div>
    </div>
  </div>
  <div id="setupPanelItems" class="setup-panel" style="display:none;">
    <div class="card">
      <h3 style="margin-bottom:12px;">抽签名目</h3>
      <div style="margin-bottom:12px;display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--fg2);">
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;"><input type="checkbox" id="allowRepeatGlobal" onchange="updateAllowRepeat(this.checked)"> 允许重复抽签（抽中后候选人回到抽签池）</label>
      </div>
      <div id="drawItemsList"></div>
      <button class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="addDrawItem()">＋ 添加名目</button>
    </div>
  </div>
</div>

<!-- 页面3: 抽签页面 -->
<div class="page" id="pageDraw">
  <div class="draw-page-bg" id="drawPageBg" style="display:none;"></div>
  <button class="back-btn" id="backBtn" onclick="exitDrawing()">← 返回设置</button>

  <!-- 编辑工具栏 -->
  <div class="edit-toolbar" id="editToolbar">
    <!-- 插入 -->
    <div class="tool-group">
      <button class="tool-btn" id="tbShapeBtn" onclick="toggleToolDropdown('shape')"><span>＋</span> 插入</button>
      <div class="tool-dropdown" id="ddShape" style="min-width:160px;">
        <div class="dd-submenu-trigger" onmouseenter="showSubmenu('subShapes')" onmouseleave="scheduleHideSubmenu('subShapes')">
          <button class="dd-btn" style="display:flex;justify-content:space-between;align-items:center;">形状 <span style="opacity:0.5;">▶</span></button>
          <div class="dd-submenu" id="subShapes">
            <button class="dd-btn" onclick="addDecorShape('rect');closeAllDropdowns()">＋ 矩形</button>
            <button class="dd-btn" onclick="addDecorShape('circle');closeAllDropdowns()">＋ 圆形</button>
            <button class="dd-btn" onclick="addDecorShape('triangle');closeAllDropdowns()">＋ 三角形</button>
            <button class="dd-btn" onclick="addDecorShape('line');closeAllDropdowns()">＋ 横线</button>
          </div>
        </div>
        <button class="dd-btn" onclick="addDecorText();closeAllDropdowns()">＋ 文字</button>
      </div>
    </div>
    <!-- 形状颜色 -->
    <div class="tool-group" id="tbShapeColorGroup" style="display:none;">
      <button class="tool-btn" id="tbShapeColorBtn" onclick="toggleToolDropdown('shapecolor')"><span>🎨</span> 形状颜色</button>
      <div class="tool-dropdown" id="ddShapecolor">
        <div class="color-row"><label>填充色</label><input type="color" id="tbShapeFill" value="#f59e0b" onchange="applyShapeColor('fill', this.value)"></div>
        <div class="color-row"><label>边框色</label><input type="color" id="tbShapeBorder" value="#f59e0b" onchange="applyShapeColor('border', this.value)"></div>
      </div>
    </div>
    <div class="tool-separator"></div>
    <!-- 层次 -->
    <div class="tool-group">
      <button class="tool-btn" id="tbLayerBtn" onclick="toggleToolDropdown('layer')"><span>☰</span> 层次</button>
      <div class="tool-dropdown" id="ddLayer">
        <button class="dd-btn" onclick="bringToFront()">置于顶层</button>
        <button class="dd-btn" onclick="sendToBack()">置于底层</button>
        <button class="dd-btn" onclick="bringForward()">向上一层</button>
        <button class="dd-btn" onclick="sendBackward()">向下一层</button>
      </div>
    </div>
    <div class="tool-separator"></div>
    <!-- 对齐 -->
    <div class="tool-group">
      <button class="tool-btn" id="tbAlignBtn" onclick="toggleToolDropdown('align')"><span>≡</span> 对齐</button>
      <div class="tool-dropdown" id="ddAlign">
        <button class="dd-btn" onclick="alignElement('left')">← 左对齐</button>
        <button class="dd-btn" onclick="alignElement('centerH')">↔ 水平居中</button>
        <button class="dd-btn" onclick="alignElement('right')">→ 右对齐</button>
        <button class="dd-btn" onclick="alignElement('top')">↑ 顶对齐</button>
        <button class="dd-btn" onclick="alignElement('centerV')">↕ 垂直居中</button>
        <button class="dd-btn" onclick="alignElement('bottom')">↓ 底对齐</button>
      </div>
    </div>
    <div class="tool-separator"></div>
    <!-- 标题样式 -->
    <div class="tool-group">
      <button class="tool-btn" id="tbTitleBtn" onclick="toggleToolDropdown('title')"><span>T</span> 标题</button>
      <div class="tool-dropdown" id="ddTitle">
        <div class="color-row"><label>颜色</label><input type="checkbox" id="epTitleColorNone" onchange="toggleColorNone('epTitleColor',this.checked);livePreviewStyle()"><input type="color" id="epTitleColor" value="#f59e0b" oninput="livePreviewStyle()"><input type="text" class="form-input" id="epTitleColorText" value="#f59e0b" style="flex:1;padding:2px 4px;font-size:0.72rem;" oninput="syncEPColor('epTitleColor',this.value);livePreviewStyle()"></div>
        <label>字号</label>
        <div style="display:flex;align-items:center;gap:6px;"><input type="range" id="epTitleSize" min="16" max="216" value="28" style="flex:1;" oninput="document.getElementById('epTitleSizeVal').textContent=this.value+'px';livePreviewStyle()"><span id="epTitleSizeVal" style="font-size:0.7rem;color:var(--fg2);min-width:40px;">28px</span></div>
      </div>
    </div>
    <!-- 名目样式 -->
    <div class="tool-group">
      <button class="tool-btn" id="tbItemBtn" onclick="toggleToolDropdown('item')"><span>I</span> 名目</button>
      <div class="tool-dropdown" id="ddItem">
        <div class="color-row"><label>颜色</label><input type="checkbox" id="epItemColorNone" onchange="toggleColorNone('epItemColor',this.checked);livePreviewStyle()"><input type="color" id="epItemColor" value="#f59e0b" oninput="livePreviewStyle()"><input type="text" class="form-input" id="epItemColorText" value="#f59e0b" style="flex:1;padding:2px 4px;font-size:0.72rem;" oninput="syncEPColor('epItemColor',this.value);livePreviewStyle()"></div>
        <label>字号</label>

<script>
/* ========== 数据与状态 ========== */
const STORAGE_KEY = 'lottery_app_data';
let data = { activities: [], rosters: [], currentTheme: 'dark' };
let currentActivityId = null;
let isEditMode = false;
let selectedElements = [];
let drawMode = 'one';
let lastDrawnName = '';
let decorCounter = 0;
let timerInterval = null;
let submenuTimeout = null;
let isDragging = false;
let dragTarget = null;
let dragStartX = 0;
let dragStartY = 0;
let dragOffsets = [];
let isResizing = false;
let resizeTarget = null;
let resizeDir = 'br';
let resizeStartX = 0;
let resizeStartY = 0;
let resizeStartW = 0;
let resizeStartH = 0;
let resizeStartLeft = 0;
let resizeStartTop = 0;
let editBackup = null;
let importedRawData = null;
let importedFields = null;

const defaultPageStyle = {
  titleColor: '#f59e0b', titleSize: 28,
  itemColor: '#f59e0b', itemSize: 18,
  resultColor: '#fbbf24', resultSize: 16,
  resultBg: '#f59e0b', resultBorder: '#f59e0b',
  resultRadius: 12, resultPadding: 12, resultWeight: 700,
  btnShape: 'circle', btnSize: 180,
  btnBg: '#f59e0b', btnTextColor: '#000000',
  btnText: '抽取', btnFontSize: 22, btnBorderColor: '#f59e0b'
};

const defaultModuleZindex = { header: 1, item: 2, result: 3, button: 4 };

/* ========== 数据持久化 ========== */
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    showToast('保存数据失败: ' + e.message, 'error');
  }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      data = JSON.parse(raw);
      if (!data.activities) data.activities = [];
      if (!data.currentTheme) data.currentTheme = 'dark';
    }
  } catch (e) {
    data = { activities: [], currentTheme: 'dark' };
  }
}

/* ========== 页面导航 ========== */
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
}

function switchSetupTab(tab) {
  document.querySelectorAll('.setup-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.setup-panel').forEach(p => p.style.display = 'none');
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  document.getElementById('setupPanel' + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = 'block';
}

function goBack() {
  stopTimer();
  showPage('pageList');
  renderRosterListHome();
  renderActivityList();
}

/* ========== 名单管理 ========== */
let tempRosterMembers = [];

function renderRosterListHome() {
  const container = document.getElementById('rosterListHome');
  if (!data.rosters || data.rosters.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--fg2);padding:16px;font-size:0.85rem;border:1px dashed var(--border);border-radius:var(--radius);">暂无名单，点击上方按钮创建</div>';
    return;
  }
  container.innerHTML = data.rosters.map((r, i) => `
    <div class="card" style="padding:12px;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div style="font-weight:600;font-size:0.9rem;">${esc(r.name)}</div>
        <div style="font-size:0.75rem;color:var(--fg2);">${r.members.length} 人</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-secondary btn-sm" onclick="editRoster(${i})">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="deleteRoster(${i})">删除</button>
      </div>
    </div>
  `).join('');
}

function openRosterModal(editId) {
  document.getElementById('rosterEditId').value = editId !== undefined ? editId : '';
  if (editId !== undefined && data.rosters[editId]) {
    document.getElementById('rosterModalTitle').textContent = '编辑名单';
    document.getElementById('rosterNameInput').value = data.rosters[editId].name;
    tempRosterMembers = [...data.rosters[editId].members];
  } else {
    document.getElementById('rosterModalTitle').textContent = '新建名单';
    document.getElementById('rosterNameInput').value = '';
    tempRosterMembers = [];
  }
  renderRosterMembers();
  openModal('modalRoster');
}

function editRoster(index) {
  openRosterModal(index);
}

function deleteRoster(index) {
  if (!confirm('确定删除名单"' + data.rosters[index].name + '"？')) return;
  data.rosters.splice(index, 1);
  saveData();
  renderRosterListHome();
  showToast('名单已删除', 'success');
}

function renderRosterMembers() {
  const container = document.getElementById('rosterMemberList');
  const countEl = document.getElementById('rosterMemberCount');
  countEl.textContent = '共 ' + tempRosterMembers.length + ' 人';
  if (tempRosterMembers.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--fg2);padding:8px;font-size:0.8rem;">暂无成员</div>';
    return;
  }
  container.innerHTML = tempRosterMembers.map((m, i) => `

      <span>${esc(m)}</span>
      <button style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:0.75rem;" onclick="tempRosterMembers.splice(${i},1);renderRosterMembers();">删除</button>
    </div>
  `).join('');
}

function rosterParseBulk() {
  const text = document.getElementById('rosterBulkInput').value.trim();
  if (!text) { showToast('请先输入名单内容', 'error'); return; }
  // 支持多种分隔符：换行、逗号、中文逗号、分号、制表符、多个空格
  const names = text.split(/[\n,，;；\t]+/)
    .map(s => s.trim())
    .filter(s => s.length > 0 && s.length < 50); // 过滤空行和过长内容
  // 去重
  const unique = [...new Set(names)];
  // 与已有成员去重
  const existingSet = new Set(tempRosterMembers);
  let added = 0;
  unique.forEach(name => {
    if (!existingSet.has(name)) {
      tempRosterMembers.push(name);
      existingSet.add(name);
      added++;
    }
  });
  renderRosterMembers();
  if (added > 0) {
    showToast('已识别 ' + added + ' 个姓名', 'success');
  } else {
    showToast('没有新的姓名被识别（可能全部重复）', 'info');
  }
}

function rosterAddSingle() {
  const input = document.getElementById('rosterSingleInput');
  const name = input.value.trim();
  if (!name) return;
  tempRosterMembers.push(name);
  input.value = '';
  renderRosterMembers();
}

function rosterImportExcel() {

function rosterHandleExcel(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
      if (rows.length === 0) { showToast('表格为空', 'error'); return; }
      // Use first column as names
      rows.forEach(row => {
        const name = String(row[0] || '').trim();
        if (name) tempRosterMembers.push(name);
      });
      renderRosterMembers();
      showToast('已导入 ' + rows.length + ' 条记录', 'success');
    } catch (err) {
      showToast('导入失败: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function saveRoster() {
  const name = document.getElementById('rosterNameInput').value.trim();
  if (!name) { showToast('请输入名单名称', 'error'); return; }
  // Also add members from bulk input
  const bulkText = document.getElementById('rosterBulkInput').value.trim();
  if (bulkText) {
    bulkText.split('\n').forEach(line => {
      const n = line.trim();
      if (n && !tempRosterMembers.includes(n)) tempRosterMembers.push(n);
    });
  }
  const editId = document.getElementById('rosterEditId').value;
  const roster = { name, members: [...tempRosterMembers] };
  if (editId !== '') {
    data.rosters[parseInt(editId)] = roster;
  } else {
    if (!data.rosters) data.rosters = [];
    data.rosters.push(roster);
  }
  saveData();
  closeModal('modalRoster');
  renderRosterListHome();
  showToast('名单已保存', 'success');
}

function importRosterToActivity(index) {
  const roster = data.rosters[index];
  if (!roster) return;
  const a = data.activities.find(x => x.id === currentActivityId);

  if (!a.candidates) a.candidates = [];

  const existingNames = new Set(a.candidates.map(c => c.name));

  roster.members.forEach(name => {

      existingNames.add(name);
      added++;

/* ========== 活动列表 ========== */
function renderActivityList() {
  const container = document.getElementById('activityList');

    return;
  }
  let html = '';
  data.activities.forEach(a => {
    const status = getActivityStatus(a);
    const statusText = status === 'pending' ? '未开始' : status === 'running' ? '进行中' : '已结束';
    const statusColor = status === 'pending' ? 'var(--fg2)' : status === 'running' ? '#22c55e' : '#ef4444';
    html += '<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">';
    html += '<div style="flex:1;min-width:200px;">';

    html += '<div style="font-size:0.8rem;color:var(--fg2);">';
    html += escHtml(a.date || '') + ' ' + escHtml(a.startTime || '') + ' - ' + escHtml(a.endTime || '');
    html += ' | 候选人: ' + (a.candidates ? a.candidates.length : 0);
    html += '</div>';
    html += '<div style="font-size:0.8rem;color:' + statusColor + ';margin-top:2px;">' + statusText + '</div>';
    html += '</div>';

    html += '</div></div>';
  });
  container.innerHTML = html;
}

function getActivityStatus(a) {
  if (!a.date) return 'pending';
  const now = new Date();
  const startDt = new Date(a.date + 'T' + (a.startTime || '00:00'));
  const endDt = getEndTime(a);
  if (now < startDt) return 'pending';
  if (now > endDt) return 'ended';
  return 'running';
}

function getEndTime(a) {
  let endStr = a.date + 'T' + (a.endTime || '23:59');
  let endDt = new Date(endStr);
  if (a.overtime && a.overtime > 0) {
    endDt = new Date(endDt.getTime() + a.overtime * 60 * 1000);
  }
  return endDt;
}

function getEndTimeStr(a) {
  let endDt = getEndTime(a);
  let h = String(endDt.getHours()).padStart(2, '0');
  let m = String(endDt.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}

function addCandidateManual() {
  const input = document.getElementById('addCandidateInput');
  const text = input.value.trim();
  if (!text) return;
  const a = data.activities.find(x => x.id === currentActivityId);

  // 支持多种分隔符：换行、制表符、逗号、中文逗号、分号

  const existingSet = new Set(a.candidates.map(c => c.name));
  let added = 0;

function editCandidate(index) {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a || !a.candidates[index]) return;
  const span = document.getElementById('candidateName' + index);
  if (!span) return;
  const oldName = a.candidates[index].name;
  span.innerHTML = '<input class="form-input" style="padding:2px 6px;font-size:0.82rem;width:120px;" value="' + escHtml(oldName) + '" id="editCandidateInput' + index + '">';
  const input = document.getElementById('editCandidateInput' + index);
  input.focus();
  input.select();
  let saved = false;
  input.addEventListener('blur', function() {
    if (saved) return;
    saved = true;
    const newName = input.value.trim();
    if (newName && newName !== oldName) {
      a.candidates[index].name = newName;
      saveData();
      showToast('已修改: ' + newName, 'success');
    }
    renderRosterList();
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') { saved = true; renderRosterList(); }
  });
}

function removeCandidate(index) {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  a.candidates.splice(index, 1);
  saveData();
  renderRosterList();
}

function importExcel(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      if (json.length === 0) {
        showToast('文件中没有数据', 'error');
        return;
      }
      importedRawData = json;
      importedFields = Object.keys(json[0]);
      const a = data.activities.find(x => x.id === currentActivityId);
      if (!a) return;

      // Show field mapping
      const mappingArea = document.getElementById('fieldMappingArea');
      const select = document.getElementById('fieldMappingSelect');
      select.innerHTML = '<option value="">请选择姓名列</option>';
      importedFields.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f;
        opt.textContent = f;
        select.appendChild(opt);
      });
      mappingArea.style.display = 'block';

      // Auto-detect name field
      const nameField = importedFields.find(f => f.includes('姓名') || f.includes('名字') || f.toLowerCase() === 'name');
      if (nameField) {
        select.value = nameField;
        applyFieldMapping();
      }
      showToast('已导入 ' + json.length + ' 条数据', 'success');
    } catch (err) {
      showToast('导入失败: ' + err.message, 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function applyFieldMapping() {
  const field = document.getElementById('fieldMappingSelect').value;
  if (!field || !importedRawData) return;
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  a.candidates = importedRawData.map(row => ({ name: String(row[field] || '').trim() })).filter(c => c.name);
  a.fields = importedFields.map(f => ({ name: f, key: f }));
  saveData();
  renderRosterList();
}

/* ========== 抽签名目管理 ========== */
let dragItemIndex = null;

function renderDrawItemsList() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const container = document.getElementById('drawItemsList');
  if (!a.items || a.items.length === 0) {

    return;
  }
  let html = '';
  a.items.forEach((item, i) => {
    html += '<div class="card" style="padding:12px;cursor:grab;" draggable="true" data-item-index="' + i + '" ondragstart="onItemDragStart(event,' + i + ')" ondragover="onItemDragOver(event)" ondrop="onItemDrop(event,' + i + ')" ondragend="onItemDragEnd(event)">';
    html += '<div style="display:flex;gap:8px;align-items:center;">';
    html += '<span style="cursor:grab;color:var(--fg2);font-size:1rem;user-select:none;" title="拖拽排序">⠿</span>';
    html += '<input class="form-input" value="' + escHtml(item.name) + '" onchange="updateDrawItem(' + i + ',\'name\',this.value)" style="flex:1;" onclick="event.stopPropagation()">';
    html += '<input class="form-input" type="number" value="' + item.count + '" min="1" onchange="updateDrawItem(' + i + ',\'count\',parseInt(this.value)||1)" style="width:70px;" onclick="event.stopPropagation()">';
    html += '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();removeDrawItem(' + i + ')">删除</button>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function onItemDragStart(e, index) {
  dragItemIndex = index;
  e.dataTransfer.effectAllowed = 'move';
  e.target.style.opacity = '0.5';
}

function onItemDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function onItemDrop(e, targetIndex) {
  e.preventDefault();
  if (dragItemIndex === null || dragItemIndex === targetIndex) return;
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const moved = a.items.splice(dragItemIndex, 1)[0];
  a.items.splice(targetIndex, 0, moved);
  saveData();
  renderDrawItemsList();
}

function onItemDragEnd(e) {
  dragItemIndex = null;
  e.target.style.opacity = '1';
}

function addDrawItem() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  a.items.push({ name: '新名目', count: 1 });

}

function updateAllowRepeat(checked) {

function updateDrawItem(index, prop, value) {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a || !a.items[index]) return;
  a.items[index][prop] = value;

function removeDrawItem(index) {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  a.items.splice(index, 1);
  saveData();
  renderDrawItemsList();
}

/* ========== 进入抽签 ========== */
function startDrawing() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  saveSetup();
  isEditMode = false;
  selectedElements = [];

  // Reset draw state if needed
  if (!a.drawState) {
    a.drawState = { currentItemIndex: 0, drawnInItem: [], results: [] };
  }
  // 活动未开始时，重置抽签池（测试模式）
  const status = getActivityStatus(a);
  if (status === 'pending') {
    a.drawState = { currentItemIndex: 0, drawnInItem: [], results: [] };
  }
  if (!a.pageStyle) {
    a.pageStyle = JSON.parse(JSON.stringify(defaultPageStyle));
  }
  if (!a.moduleZindex) {
    a.moduleZindex = JSON.parse(JSON.stringify(defaultModuleZindex));
  }
  if (!a.decorShapes) {
    a.decorShapes = [];
  }

  drawMode = 'one';
  // 清除所有模块的inline样式，避免上一个活动的布局影响当前活动
  ['header', 'item', 'result', 'button'].forEach(key => {
    const el = document.getElementById('module' + key.charAt(0).toUpperCase() + key.slice(1));
    if (el) {
      el.style.position = '';
      el.style.left = '';
      el.style.top = '';
      el.style.width = '';
      el.style.height = '';
      el.style.maxWidth = '';
      el.style.zIndex = '';
    }
  });
  showPage('pageDraw');
  applyDrawPageStyle(a);
  applyModuleZindex(a);
  if (a.positionsManuallySet) {
    applyModulePositions(a);
  }
  renderAllDecorShapes(a);
  applyWallpaper(a);
  updateDrawUI();
  // 显示活动状态提示
  const statusLabel = document.getElementById('drawStatusLabel');
  if (statusLabel) {
    if (status === 'pending') {
      statusLabel.textContent = '测试模式（活动未开始）';
      statusLabel.style.color = '#f59e0b';
    } else if (status === 'running') {
      statusLabel.textContent = '';
    } else {
      statusLabel.textContent = '活动已结束';
      statusLabel.style.color = '#ef4444';
    }
  }
  startTimer();
}

function exitDrawing() {
  if (isEditMode) {
    cancelAndExitEdit();
    return;
  }
  stopTimer();
  // 重新填充设置页表单
  const a = data.activities.find(x => x.id === currentActivityId);
  if (a) {
    document.getElementById('setupName').value = a.name || '';
    document.getElementById('setupDate').value = a.date || '';
    document.getElementById('setupStartTime').value = a.startTime || '';
    document.getElementById('setupEndTime').value = a.endTime || '';
    document.getElementById('setupOvertime').value = a.overtime || 0;
    document.getElementById('allowRepeatGlobal').checked = !!a.allowRepeat;
    renderRosterList();
    renderDrawItemsList();
    switchSetupTab('time');
  }
  showPage('pageSetup');
}

/* ========== 抽签UI更新 ========== */
function updateDrawUI() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const s = a.pageStyle;

  // Title
  document.getElementById('drawPageTitle').textContent = a.name;

  // Current item
  if (a.items && a.items.length > 0) {
    const idx = Math.min(a.drawState.currentItemIndex, a.items.length - 1);
    const item = a.items[idx];
    document.getElementById('currentDrawItem').textContent = item.name;
    if (a.drawState.currentItemIndex < a.items.length) {
      const drawn = (a.drawState.drawnInItem || []).length;
      document.getElementById('remainCount').textContent = '剩余: ' + Math.max(0, item.count - drawn) + ' / ' + item.count;
    } else {
      document.getElementById('remainCount').textContent = '已完成';
    }
  } else {
    document.getElementById('currentDrawItem').textContent = '所有名目已完成';
    document.getElementById('remainCount').textContent = '';
  }

  // Draw mode buttons
  document.getElementById('modeOneBtn').style.background = drawMode === 'one' ? 'var(--accent)' : 'var(--bg3)';
  document.getElementById('modeOneBtn').style.color = drawMode === 'one' ? '#000' : 'var(--fg)';
  document.getElementById('modeAllBtn').style.background = drawMode === 'all' ? 'var(--accent)' : 'var(--bg3)';
  document.getElementById('modeAllBtn').style.color = drawMode === 'all' ? '#000' : 'var(--fg)';

  // Button
  const btn = document.getElementById('drawButton');
  btn.textContent = s.btnText || '抽取';
  const actStatus = getActivityStatus(a);
  if (actStatus === 'ended') {
    btn.disabled = true;
    btn.textContent = '活动已结束';
  } else if (isAllItemsComplete(a)) {
    btn.disabled = true;
    btn.textContent = '抽取完毕';
  } else {
    btn.disabled = isAllItemsComplete(a);
  }

  renderCurrentResults();
}

function isAllItemsComplete(a) {
  if (!a.items || a.items.length === 0) return true;
  return a.drawState.currentItemIndex >= a.items.length;
}

function setDrawMode(mode) {
  drawMode = mode;
  updateDrawUI();
}

/* ========== 抽签逻辑 ========== */
function performDraw() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const status = getActivityStatus(a);
  if (status === 'ended') {
    showToast('活动已结束，无法抽取', 'info');
    return;
  }
  if (isAllItemsComplete(a)) {
    showToast('所有名目已完成抽取', 'info');
    return;
  }
  if (!a.candidates || a.candidates.length === 0) {
    showToast('没有候选人', 'error');
    return;
  }

  const item = a.items[a.drawState.currentItemIndex];
  const drawn = a.drawState.drawnInItem || [];
  const remaining = item.count - drawn.length;
  if (remaining <= 0) {
    nextDrawItem();
    return;
  }

  // Get all candidates not yet drawn in this item
  const allDrawnNames = new Set();
  if (!a.allowRepeat) {
    (a.drawState.results || []).forEach(r => {
      if (r.names) r.names.forEach(n => allDrawnNames.add(n));
    });
  }

  const available = a.candidates.filter(c => !allDrawnNames.has(c.name));
  if (available.length === 0) {
    showToast('所有候选人都已被抽取', 'info');
    return;
  }

  const count = drawMode === 'all' ? remaining : 1;

  // Animation
  const btn = document.getElementById('drawButton');
  btn.disabled = true;
  let rollCount = 0;
  const maxRolls = 20;
  const rollInterval = setInterval(() => {
    const randomName = available[Math.floor(Math.random() * available.length)].name;
    const a2 = data.activities.find(x => x.id === currentActivityId);
    const s2 = (a2 && a2.pageStyle) ? a2.pageStyle : {};
    const animSize = s2.resultSize || 32;
    const animColor = s2.resultColor && s2.resultColor !== 'transparent' ? s2.resultColor : 'inherit';
    const animBg = s2.resultBg && s2.resultBg !== 'transparent' ? s2.resultBg : 'transparent';
    document.getElementById('resultArea').innerHTML = '<div class="result-item" style="font-size:' + animSize + 'px;color:' + animColor + ';background:' + animBg + ';">' + escHtml(randomName) + '</div>';
    rollCount++;
    if (rollCount >= maxRolls) {
      clearInterval(rollInterval);
      // Final selection
      const shuffled = [...available].sort(() => Math.random() - 0.5);
      const drawn = shuffled.slice(0, Math.min(count, shuffled.length));
      const drawnNames = drawn.map(c => c.name);
      if (drawMode === 'all' && drawnNames.length > 1) {
        // 一次抽取：弹窗显示结果
        showDrawResultModal(drawnNames);
        finalizeDraw(drawnNames);
      } else {
        finalizeDraw(drawnNames);
      }
    }
  }, 60);
}

function showDrawResultModal(drawnNames) {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const item = a.items[a.drawState.currentItemIndex];
  const s = a.pageStyle;
  const color = s.resultColor && s.resultColor !== 'transparent' ? s.resultColor : 'inherit';
  document.getElementById('drawResultTitle').textContent = item.name + ' - 抽取结果';
  // 根据人数动态调整字号，确保不溢出
  const len = drawnNames.length;
  let fontSize = 40;
  if (len <= 3) fontSize = 52;
  else if (len <= 6) fontSize = 40;
  else if (len <= 10) fontSize = 32;
  else if (len <= 20) fontSize = 26;
  else fontSize = 20;
  let html = '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:12px 20px;">';
  drawnNames.forEach(n => {
    html += '<span style="font-size:' + fontSize + 'px;color:#fff;font-weight:700;padding:6px 14px;border-radius:6px;background:rgba(255,255,255,0.12);text-shadow:0 1px 4px rgba(0,0,0,0.5);">' + escHtml(n) + '</span>';
  });
  html += '</div>';
  document.getElementById('drawResultContent').innerHTML = html;
  openModal('modalDrawResult');
}

function finalizeDraw(drawnNames) {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const item = a.items[a.drawState.currentItemIndex];
  const status = getActivityStatus(a);

  if (!a.drawState.results) a.drawState.results = [];
  if (!a.drawState.drawnInItem) a.drawState.drawnInItem = [];

  // 活动进行中才记录正式结果
  if (status === 'running') {
    a.drawState.results.push({
      itemIndex: a.drawState.currentItemIndex,
      itemName: item.name,
      names: drawnNames.map(n => n),
      time: new Date().toLocaleTimeString()
    });
    saveData();
  }

  drawnNames.forEach(n => a.drawState.drawnInItem.push(n));
  if (status === 'running') saveData();

  // Check if current item is complete
  if (a.drawState.drawnInItem.length >= item.count) {
    setTimeout(() => {
      nextDrawItem();
    }, 1500);
  }

  renderCurrentResults();
  updateDrawUI();
}

function nextDrawItem() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  a.drawState.currentItemIndex++;
  if (a.drawState.currentItemIndex < a.items.length) {
    a.drawState.drawnInItem = [];
    saveData();
    updateDrawUI();
    showToast('切换到: ' + a.items[a.drawState.currentItemIndex].name, 'info');
  } else {
    // 所有名目完成，保持最后结果显示
    saveData();
    updateDrawUI();
    showToast('所有名目已完成抽取', 'success');
  }
}

function renderCurrentResults() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const container = document.getElementById('resultArea');
  const s = a.pageStyle;

  if (drawMode === 'one') {
    // Show only latest result
    const results = a.drawState.results || [];
    const drawnInItem = a.drawState.drawnInItem || [];
    if (results.length > 0) {
      const last = results[results.length - 1];
      let html = '';
      last.names.forEach(n => {
        html += '<div class="result-item">' + escHtml(n) + '</div>';
      });
      container.innerHTML = html;
    } else if (drawnInItem.length > 0) {
      // 测试模式下显示当前已抽取的
      container.innerHTML = '<div class="result-item">' + escHtml(drawnInItem[drawnInItem.length - 1]) + '</div>';
    } else {
      container.innerHTML = '<div style="color:var(--fg2);font-size:0.9rem;">等待抽取...</div>';
    }
  } else {
    // Show all results for current item
    const results = (a.drawState.results || []).filter(r => r.itemIndex === a.drawState.currentItemIndex);
    const drawnInItem = a.drawState.drawnInItem || [];
    if (results.length > 0) {
      let html = '';
      results.forEach(r => {
        r.names.forEach(n => {
          html += '<div class="result-item">' + escHtml(n) + '</div>';
        });
      });
      container.innerHTML = html;
    } else if (drawnInItem.length > 0) {
      let html = '';
      drawnInItem.forEach(n => {
        html += '<div class="result-item">' + escHtml(n) + '</div>';
      });
      container.innerHTML = html;
    } else {
      container.innerHTML = '<div style="color:var(--fg2);font-size:0.9rem;">等待抽取...</div>';
    }
  }

  // Apply result styles
  container.querySelectorAll('.result-item').forEach(el => {
    el.style.color = s.resultColor && s.resultColor !== 'transparent' ? s.resultColor : 'inherit';
    el.style.fontSize = s.resultSize + 'px';
    el.style.background = s.resultBg && s.resultBg !== 'transparent' ? s.resultBg : 'transparent';
    el.style.borderColor = s.resultBorder && s.resultBorder !== 'transparent' ? s.resultBorder : 'transparent';
    el.style.borderRadius = s.resultRadius + 'px';
    el.style.padding = s.resultPadding + 'px';
    el.style.fontWeight = s.resultWeight;
    if (s.resultBorder === 'transparent') el.style.border = 'none';
  });
}

/* ========== 计时器 ========== */
function startTimer() {
  stopTimer();
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function updateTimer() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const now = new Date();
  const label = document.getElementById('timerLabel');
  const display = document.getElementById('timerDisplay');

  const status = getActivityStatus(a);
  if (status === 'pending') {
    const startDt = new Date(a.date + 'T' + (a.startTime || '00:00'));
    const diff = startDt.getTime() - now.getTime();
    if (diff <= 0) {
      label.textContent = '活动倒计时';
      display.textContent = '00:00:00';
      display.classList.remove('urgent');
    } else {
      label.textContent = '距离活动开始还有';
      display.textContent = formatDuration(diff);
      display.classList.remove('urgent');
    }
  } else if (status === 'running') {
    const endDt = getEndTime(a);
    const diff = endDt.getTime() - now.getTime();
    if (diff <= 0) {
      label.textContent = '活动已结束';
      display.textContent = '00:00:00';
      display.classList.add('urgent');
    } else {
      label.textContent = '活动倒计时';
      display.textContent = formatDuration(diff);
      display.classList.toggle('urgent', diff < 60000);
    }
  } else {
    label.textContent = '活动已结束';
    display.textContent = '00:00:00';
    display.classList.remove('urgent');
  }
  // 实时更新状态标签
  const statusLabel = document.getElementById('drawStatusLabel');
  if (statusLabel) {
    if (status === 'pending') {
      statusLabel.textContent = '测试模式（活动未开始）';
      statusLabel.style.color = '#f59e0b';
    } else if (status === 'running') {
      statusLabel.textContent = '';
    } else {
      statusLabel.textContent = '活动已结束';
      statusLabel.style.color = '#ef4444';
    }
  }
  // 实时更新按钮状态
  const btn = document.getElementById('drawButton');
  if (btn) {
    if (status === 'ended') {
      btn.disabled = true;
      btn.textContent = '活动已结束';
    } else {
      btn.disabled = isAllItemsComplete(a);
    }
  }
}

function formatDuration(ms) {
  const totalSec = Math.floor(Math.max(0, ms) / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

let pendingWallpaperColor = null;

function applyPresetColor(color) {
  pendingWallpaperColor = color;
  const bg = document.getElementById('drawPageBg');
  bg.style.backgroundImage = 'none';
  bg.style.backgroundColor = color;
  bg.style.display = 'block';
}

function confirmWallpaper() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) { closeModal('modalWallpaper'); return; }
  if (pendingWallpaperColor) {
    a.wallpaper = 'color:' + pendingWallpaperColor;
    saveData();
    applyWallpaper(a);
    showToast('背景已设置', 'success');
  }
  closeModal('modalWallpaper');
  pendingWallpaperColor = null;
}

function setWallpaper(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const a = data.activities.find(x => x.id === currentActivityId);
    if (!a) return;
    a.wallpaper = e.target.result;
    saveData();
    applyWallpaper(a);
    showToast('壁纸已设置', 'success');
  };
  reader.readAsDataURL(file);
}

function removeWallpaper() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  a.wallpaper = null;
  saveData();
  applyWallpaper(a);
  showToast('壁纸已移除', 'success');
}

function applyWallpaper(a) {
  const bg = document.getElementById('drawPageBg');
  if (a.wallpaper) {
    if (a.wallpaper.startsWith('color:')) {
      bg.style.backgroundImage = 'none';
      bg.style.backgroundColor = a.wallpaper.replace('color:', '');
      bg.style.display = 'block';
    } else {
      bg.style.backgroundImage = 'url(' + a.wallpaper + ')';
      bg.style.backgroundColor = '';
      bg.style.display = 'block';
    }
  } else {
    bg.style.backgroundImage = '';
    bg.style.backgroundColor = '';
    bg.style.display = 'none';
  }
}

    btn.style.background = s.btnBg;
    btn.style.color = s.btnTextColor;
    btn.style.fontSize = s.btnFontSize + 'px';
    btn.textContent = s.btnText || '抽取';
    if (s.btnShape === 'circle') {
      btn.style.borderRadius = '50%';
    } else if (s.btnShape === 'rounded') {
      btn.style.borderRadius = '16px';
    } else {
      btn.style.borderRadius = '4px';
    }
    if (s.btnBorderColor && s.btnBorderColor !== 'transparent') {
      btn.style.border = '3px solid ' + s.btnBorderColor;
    } else {
      btn.style.border = 'none';
    }
  }

  // Re-render results with new style
  renderCurrentResults();
}

/* ========== 颜色辅助 ========== */
function setColorToPanel(id, val) {
  const colorInput = document.getElementById(id);
  const textInput = document.getElementById(id + 'Text');
  const noneCheckbox = document.getElementById(id + 'None');
  if (colorInput) colorInput.value = (val && val !== 'transparent') ? val : '#000000';
  if (textInput) textInput.value = val || '';
  if (noneCheckbox) noneCheckbox.checked = (val === 'transparent');
}

function getColorValue(id) {
  const noneCheckbox = document.getElementById(id + 'None');
  if (noneCheckbox && noneCheckbox.checked) return 'transparent';
  const colorInput = document.getElementById(id);
  return colorInput ? colorInput.value : '#000000';
}

function toggleColorNone(id, checked) {
  const colorInput = document.getElementById(id);
  if (colorInput) colorInput.disabled = checked;
}

function syncEPColor(id, val) {
  const colorInput = document.getElementById(id);
  if (colorInput && /^#[0-9a-fA-F]{6}$/.test(val)) {
    colorInput.value = val;
  }
}

/* ========== 工具栏下拉菜单 ========== */
function toggleToolDropdown(name) {
  const dd = document.getElementById('dd' + name.charAt(0).toUpperCase() + name.slice(1));
  if (!dd) return;
  const isOpen = dd.classList.contains('open');
  closeAllDropdowns();
  if (!isOpen) {
    dd.classList.add('open');
  }
}

function closeAllDropdowns() {
  document.querySelectorAll('.edit-toolbar .tool-dropdown').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.edit-toolbar .dd-submenu').forEach(d => d.classList.remove('open'));
}

function showSubmenu(id) {
  if (submenuTimeout) { clearTimeout(submenuTimeout); submenuTimeout = null; }
  const sub = document.getElementById(id);
  if (sub) sub.classList.add('open');
}

function scheduleHideSubmenu(id) {
  submenuTimeout = setTimeout(() => {
    const sub = document.getElementById(id);
    if (sub) sub.classList.remove('open');
  }, 300);
}

/* ========== 元素选择 ========== */
function selectElement(el) {
  if (!el) return;
  if (!selectedElements.includes(el)) {
    selectedElements.push(el);
    el.classList.add('selected');
    addSelectionHandles(el);
  }
  updateToolbarButtonStates();
}

function addSelectionHandles(el) {
  removeSelectionHandles(el);
  const positions = ['tl','tc','tr','ml','mr','bl','bc','br'];
  positions.forEach(pos => {
    const handle = document.createElement('div');
    handle.className = 'handle-' + pos;
    handle.dataset.handle = pos;
    el.appendChild(handle);
  });
}

function removeSelectionHandles(el) {
  el.querySelectorAll('[data-handle]').forEach(h => h.remove());
}

function deselectElement() {
  selectedElements.forEach(el => {
    el.classList.remove('selected');
    removeSelectionHandles(el);
  });
  selectedElements = [];
  updateToolbarButtonStates();
}

function getSelectedElement() {
  return selectedElements.length > 0 ? selectedElements[selectedElements.length - 1] : null;
}

function updateToolbarButtonStates() {
  const sel = getSelectedElement();
  const isShape = sel && sel.classList && sel.classList.contains('decor-shape');
  document.getElementById('tbShapeColorGroup').style.display = isShape ? '' : 'none';
}

function onEditableElementClick(e) {
  if (!isEditMode) return;
  const el = e.target.closest('.editable-element, .decor-shape');
  if (el) {
    if (e.ctrlKey || e.metaKey) {
      if (el.classList.contains('selected')) {
        el.classList.remove('selected');
        selectedElements = selectedElements.filter(x => x !== el);
      } else {
        selectElement(el);
      }
    } else {
      deselectElement();
      selectElement(el);
    }
    e.stopPropagation();
  }
}

function onDrawModulesBlankClick(e) {
  if (!isEditMode) return;
  if (e.target.id === 'drawModules' || e.target.id === 'pageDraw') {
    deselectElement();
  }
}

function onEditKeyDown(e) {
  if (!isEditMode) return;
  if (e.key === 'Delete' || e.key === 'Backspace') {
    // Don't delete if editing text or in input/textarea
    if (document.activeElement && document.activeElement.contentEditable === 'true') return;
    if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT')) return;
    e.preventDefault();
    // Delete all selected decor shapes
    const toDelete = [...selectedElements].filter(el => el.classList.contains('decor-shape'));
    toDelete.forEach(el => {
      const id = el.getAttribute('data-shape-id');
      if (id) deleteDecorShape(id);
    });
    if (toDelete.length > 0) {
      deselectElement();
    }
  }
}

/* ========== 层次操作 ========== */
function bringToFront() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const sel = getSelectedElement();
  if (!sel) return;
  const key = sel.getAttribute('data-module') || sel.getAttribute('data-shape-id');
  if (!key) return;
  const maxZ = Math.max(...Object.values(a.moduleZindex || {}), ...a.decorShapes.map(s => s.z || 0), 0);
  if (sel.getAttribute('data-module')) {
    a.moduleZindex[key] = maxZ + 1;
  } else {
    const shape = a.decorShapes.find(s => s.id === key);
    if (shape) shape.z = maxZ + 1;
  }
  applyModuleZindex(a);
  saveData();
}

function sendToBack() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const sel = getSelectedElement();
  if (!sel) return;
  const key = sel.getAttribute('data-module') || sel.getAttribute('data-shape-id');
  if (!key) return;
  if (sel.getAttribute('data-module')) {
    a.moduleZindex[key] = 0;
  } else {
    const shape = a.decorShapes.find(s => s.id === key);
    if (shape) shape.z = 0;
  }
  applyModuleZindex(a);
  saveData();
}

function bringForward() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const sel = getSelectedElement();
  if (!sel) return;
  const key = sel.getAttribute('data-module') || sel.getAttribute('data-shape-id');
  if (!key) return;
  const currentZ = sel.getAttribute('data-module') ? (a.moduleZindex[key] || 0) : (a.decorShapes.find(s => s.id === key) || {}).z || 0;
  if (sel.getAttribute('data-module')) {
    a.moduleZindex[key] = currentZ + 1;
  } else {
    const shape = a.decorShapes.find(s => s.id === key);
    if (shape) shape.z = currentZ + 1;
  }
  applyModuleZindex(a);
  saveData();
}

function sendBackward() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const sel = getSelectedElement();
  if (!sel) return;
  const key = sel.getAttribute('data-module') || sel.getAttribute('data-shape-id');
  if (!key) return;
  const currentZ = sel.getAttribute('data-module') ? (a.moduleZindex[key] || 0) : (a.decorShapes.find(s => s.id === key) || {}).z || 0;
  const newZ = Math.max(0, currentZ - 1);
  if (sel.getAttribute('data-module')) {
    a.moduleZindex[key] = newZ;
  } else {
    const shape = a.decorShapes.find(s => s.id === key);
    if (shape) shape.z = newZ;
  }
  applyModuleZindex(a);
  saveData();
}

/* ========== 对齐 ========== */
function alignElement(direction) {
  const sel = getSelectedElement();
  if (!sel) return;
  const container = document.getElementById('pageDraw');
  const cw = container.offsetWidth;
  const ch = container.offsetHeight;
  const rect = sel.getBoundingClientRect();
  const cRect = container.getBoundingClientRect();

  switch (direction) {
    case 'left':
      sel.style.left = '0px';
      break;
    case 'centerH':
      sel.style.left = ((cw - rect.width) / 2) + 'px';
      break;
    case 'right':
      sel.style.left = (cw - rect.width) + 'px';
      break;
    case 'top':
      sel.style.top = '0px';
      break;
    case 'centerV':
      sel.style.top = ((ch - rect.height) / 2) + 'px';
      break;
    case 'bottom':
      sel.style.top = (ch - rect.height) + 'px';
      break;
  }
  savePositionAndZindex();
}

/* ========== 位置和层次保存 ========== */
function savePositionAndZindex() {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  a.modulePositions = {};
  a.positionsManuallySet = true;
  ['header', 'item', 'result', 'button'].forEach(key => {
    const el = document.getElementById('module' + key.charAt(0).toUpperCase() + key.slice(1));
    if (el) {
      a.modulePositions[key] = {
        left: el.style.left || '',
        top: el.style.top || '',
        width: el.style.width || '',
        height: el.style.height || ''
      };
    }
  });
  // Save decor shapes positions
  a.decorShapes.forEach(shape => {
    const el = document.querySelector('[data-shape-id="' + shape.id + '"]');
    if (el) {
      shape.left = el.style.left || shape.left;
      shape.top = el.style.top || shape.top;
      shape.width = el.style.width || shape.width;
      shape.height = el.style.height || shape.height;
    }
  });
  saveData();
}

function applyModulePositions(a) {
  ['header', 'item', 'result', 'button'].forEach(key => {
    const el = document.getElementById('module' + key.charAt(0).toUpperCase() + key.slice(1));
    const pos = (a.modulePositions || {})[key];
    if (el && pos && pos.left && pos.top) {
      el.style.position = 'absolute';
      el.style.left = pos.left;
      el.style.top = pos.top;
      if (pos.width) el.style.width = pos.width;
      if (pos.height) el.style.height = pos.height;
    }
  });
}

function applyModuleZindex(a) {
  ['header', 'item', 'result', 'button'].forEach(key => {
    const el = document.getElementById('module' + key.charAt(0).toUpperCase() + key.slice(1));
    if (el) {
      el.style.zIndex = (a.moduleZindex || {})[key] || defaultModuleZindex[key];
    }
  });
  (a.decorShapes || []).forEach(shape => {
    const el = document.querySelector('[data-shape-id="' + shape.id + '"]');
    if (el) {
      el.style.zIndex = shape.z || 0;
    }
  });
}

function addDecorShape(type) {

function addDecorText() {

  decorCounter++;

    id: 'decor_' + Date.now() + '_' + decorCounter,

function deleteDecorShape(id) {
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  a.decorShapes = a.decorShapes.filter(s => s.id !== id);
  saveData();
  const el = document.querySelector('[data-shape-id="' + id + '"]');
  if (el) el.remove();
  selectedElements = selectedElements.filter(s => !s.getAttribute || s.getAttribute('data-shape-id') !== id);
}

function renderDecorShape(shape) {
  const container = document.getElementById('pageDraw');
  const el = document.createElement('div');
  el.className = 'decor-shape editable-element';
  el.setAttribute('data-shape-id', shape.id);
  el.style.left = shape.left;
  el.style.top = shape.top;
  el.style.zIndex = shape.z || 0;

  if (shape.type === 'rect') {
    el.style.width = shape.width;
    el.style.height = shape.height;
    el.style.background = shape.fill || 'transparent';
    el.style.border = '2px solid ' + (shape.border || 'transparent');
    el.style.borderRadius = '4px';
  } else if (shape.type === 'circle') {
    el.style.width = shape.width;
    el.style.height = shape.height;
    el.style.background = shape.fill || 'transparent';
    el.style.border = '2px solid ' + (shape.border || 'transparent');
    el.style.borderRadius = '50%';
  } else if (shape.type === 'triangle') {
    el.style.width = '0';
    el.style.height = '0';
    el.style.borderLeft = '50px solid transparent';
    el.style.borderRight = '50px solid transparent';
    el.style.borderBottom = '100px solid ' + (shape.fill || '#f59e0b');
    el.style.background = 'transparent';
  } else if (shape.type === 'line') {
    el.style.width = shape.width;
    el.style.height = shape.height;
    el.style.background = shape.fill || '#f59e0b';
  } else if (shape.type === 'text') {
    el.style.color = shape.fill || '#f59e0b';
    el.style.fontSize = '18px';
    el.style.fontWeight = '600';
    el.style.padding = '4px 8px';
    el.style.whiteSpace = 'nowrap';
    el.textContent = shape.text || '';
    el.setAttribute('data-text-content', shape.text || '');
  }

  // Delete button
  const delBtn = document.createElement('div');
  delBtn.className = 'shape-delete';
  delBtn.textContent = '×';
  delBtn.onclick = function(e) {
    e.stopPropagation();
    deleteDecorShape(shape.id);
  };
  el.appendChild(delBtn);

  // Resize handle
  if (shape.type !== 'text') {
    const rh = document.createElement('div');
    rh.className = 'resize-handle';
    rh.setAttribute('data-resize-shape', shape.id);
    el.appendChild(rh);
  }

  // Double click for text editing
  if (shape.type === 'text') {
    el.ondblclick = function(e) {
      e.stopPropagation();
      const newText = prompt('编辑文字:', shape.text || '');
      if (newText !== null) {
        shape.text = newText;
        el.textContent = newText;
        el.setAttribute('data-text-content', newText);
        saveData();
      }
    };
  }

  container.appendChild(el);
}

function renderAllDecorShapes(a) {
  // Remove existing decor shapes from DOM
  document.querySelectorAll('.decor-shape').forEach(el => el.remove());
  (a.decorShapes || []).forEach(shape => renderDecorShape(shape));
}

function applyShapeColor(prop, value) {
  const sel = getSelectedElement();
  if (!sel || !sel.classList.contains('decor-shape')) return;
  const id = sel.getAttribute('data-shape-id');
  const a = data.activities.find(x => x.id === currentActivityId);
  if (!a) return;
  const shape = a.decorShapes.find(s => s.id === id);
  if (!shape) return;

  if (prop === 'fill') {
    shape.fill = value;
    if (shape.type === 'triangle') {
      sel.style.borderBottomColor = value;
    } else {
      sel.style.background = value;
    }
    if (shape.type === 'text') {
      sel.style.color = value;
    }
  } else if (prop === 'border') {
    shape.border = value;
    if (shape.type === 'triangle') {
      // Triangle doesn't use border in the same way
    } else {
      sel.style.border = '2px solid ' + value;
    }
  }
  saveData();
}

/* ========== 拖拽和缩放 ========== */
function enableDragResize() {
  document.addEventListener('mousedown', onDragStart);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

function disableDragResize() {
  document.removeEventListener('mousedown', onDragStart);
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
}

function onDragStart(e) {
  if (!isEditMode) return;

  // 点击工具栏外部时关闭菜单
  if (!e.target.closest('.edit-toolbar')) {
    closeAllDropdowns();
  }

  // Check 8-point selection handles
  const selHandle = e.target.closest('[data-handle]');
  if (selHandle) {
    e.preventDefault();
    isResizing = true;
    const parent = selHandle.closest('.editable-element');
    resizeTarget = parent;
    resizeDir = selHandle.dataset.handle;
    resizeStartX = e.clientX;
    resizeStartY = e.clientY;
    resizeStartW = parent.offsetWidth;
    resizeStartH = parent.offsetHeight;
    resizeStartLeft = parseInt(parent.style.left) || 0;
    resizeStartTop = parseInt(parent.style.top) || 0;
    return;
  }

  // Check resize handle (old bottom-right handle)
  const resizeHandle = e.target.closest('.resize-handle');
  if (resizeHandle) {
    e.preventDefault();
    isResizing = true;
    const parent = resizeHandle.closest('.editable-element');
    resizeTarget = parent;
    resizeDir = 'br';
    resizeStartX = e.clientX;
    resizeStartY = e.clientY;
    resizeStartW = parent.offsetWidth;
    resizeStartH = parent.offsetHeight;
    resizeStartLeft = parseInt(parent.style.left) || 0;
    resizeStartTop = parseInt(parent.style.top) || 0;
    return;
  }

  // Check draggable element
  const el = e.target.closest('.editable-element');
  if (el && !e.target.closest('.shape-delete') && !e.target.closest('input') && !e.target.closest('button') && !e.target.closest('select') && !e.target.closest('[data-handle]')) {
    e.preventDefault();
    isDragging = true;
    dragTarget = el;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    const parentRect = document.getElementById('pageDraw').getBoundingClientRect();
    // 记录所有被选中元素的起始位置
    dragOffsets = [];
    selectedElements.forEach(sel => {
      const r = sel.getBoundingClientRect();
      dragOffsets.push({ el: sel, startLeft: r.left - parentRect.left, startTop: r.top - parentRect.top });
    });
  }
}

function onDragMove(e) {
  if (isDragging && dragTarget) {
    e.preventDefault();
    const dx = e.clientX - dragStartX;
    const dy = e.clientY - dragStartY;
    const container = document.getElementById('drawModules');
    const cRect = container.getBoundingClientRect();
    const maxX = cRect.width;
    const maxY = cRect.height;
    // 移动所有被选中的元素，限制在容器内
    dragOffsets.forEach(item => {
      let newLeft = item.startLeft + dx;
      let newTop = item.startTop + dy;
      const elW = item.el.offsetWidth;
      const elH = item.el.offsetHeight;
      newLeft = Math.max(0, Math.min(newLeft, maxX - elW));
      newTop = Math.max(0, Math.min(newTop, maxY - elH));
      item.el.style.left = newLeft + 'px';
      item.el.style.top = newTop + 'px';
      item.el.style.position = 'absolute';
      const posLabel = item.el.querySelector('.pos-label');
      if (posLabel) {
        posLabel.textContent = Math.round(newLeft) + ', ' + Math.round(newTop);
      }
    });
  }
  if (isResizing && resizeTarget) {
    e.preventDefault();
    const dx = e.clientX - resizeStartX;
    const dy = e.clientY - resizeStartY;
    const dir = resizeDir;
    const minW = 50, minH = 30;
    let newW = resizeStartW, newH = resizeStartH, newLeft = resizeStartLeft, newTop = resizeStartTop;
    // 水平方向
    if (dir === 'tl' || dir === 'ml' || dir === 'bl') {
      newW = Math.max(minW, resizeStartW - dx);
      newLeft = resizeStartLeft + (resizeStartW - newW);
    } else if (dir === 'tr' || dir === 'mr' || dir === 'br') {
      newW = Math.max(minW, resizeStartW + dx);
    }
    // 垂直方向
    if (dir === 'tl' || dir === 'tc' || dir === 'tr') {
      newH = Math.max(minH, resizeStartH - dy);
      newTop = resizeStartTop + (resizeStartH - newH);
    } else if (dir === 'bl' || dir === 'bc' || dir === 'br') {
      newH = Math.max(minH, resizeStartH + dy);
    }
    resizeTarget.style.maxWidth = 'none';
    resizeTarget.style.width = newW + 'px';
    resizeTarget.style.height = newH + 'px';
    if (dir.includes('l') || dir === 'tl' || dir === 'ml' || dir === 'bl') {
      resizeTarget.style.left = newLeft + 'px';
    }
    if (dir.includes('t') || dir === 'tl' || dir === 'tc' || dir === 'tr') {
      resizeTarget.style.top = newTop + 'px';
    }
    resizeTarget.style.position = 'absolute';
  }
}

function onDragEnd(e) {
  if (isDragging || isResizing) {
    savePositionAndZindex();
  }
  isDragging = false;
  isResizing = false;
  dragTarget = null;
  resizeTarget = null;
}

/* ========== Toast ========== */
function showToast(msg, type) {
  type = type || 'info';
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

/* ========== Modal ========== */
function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

/* ========== 工具函数 ========== */
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
const esc = escHtml;

/* ========== 全局事件 ========== */
document.addEventListener('click', function(e) {
  // Close dropdowns when clicking outside
  if (!e.target.closest('.edit-toolbar .tool-group')) {
    closeAllDropdowns();
  }
  // Blank click in draw page
  if (isEditMode) {
    onDrawModulesBlankClick(e);
  }
});

document.getElementById('pageDraw').addEventListener('click', function(e) {
  if (isEditMode) {
    onEditableElementClick(e);
  }
});

document.addEventListener('keydown', function(e) {
  onEditKeyDown(e);
});

// Enter key for adding candidates
document.getElementById('addCandidateInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addCandidateManual();
});

/* ========== 初始化 ========== */
function init() {
  loadData();
  applyTheme();
  renderRosterListHome();
  renderActivityList();
}

init();
</script>
