<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智记卡片 - AI学习卡片生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ===== NAV ===== */
        .nav {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            max-width: 960px;
            margin: 0 auto;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--primary);
        }
        .logo-icon {
            width: 36px; height: 36px;
            background: var(--primary);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 1.1rem;
        }
        .nav-links {
            display: flex;
            gap: 8px;
        }
        .nav-links button {
            background: none;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-light);
            transition: all 0.2s;
        }
        .nav-links button:hover, .nav-links button.active {
            background: #eef2ff;
            color: var(--primary);
        }

        /* ===== PAGE CONTAINER ===== */
        .page {
            display: none;
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 24px;
            animation: fadeIn 0.4s ease;
        }
        .page.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== HERO SECTION ===== */
        .hero {
            text-align: center;
            padding: 48px 20px;
        }
        .hero h1 {
            font-size: 2.4rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: var(--text-light);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto 32px;
        }

        /* ===== INPUT AREA ===== */
        .input-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .input-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .input-tab {
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .input-tab:hover { border-color: var(--primary); }
        .input-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .input-area textarea {
            width: 100%;
            min-height: 160px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }
        .input-area .placeholder-hint {
            color: var(--text-light);
            font-size: 0.85rem;
            margin-top: 8px;
        }
        .input-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .settings {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .setting-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.9rem;
            color: var(--text-light);
        }
        .setting-item select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 0.85rem;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99,102,241,0.3);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== LOADING ===== */
        .loading-area {
            text-align: center;
            padding: 80px 20px;
        }
        .spinner {
            width: 56px; height: 56px;
            border: 4px solid #e0e7ff;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-steps {
            max-width: 400px;
            margin: 32px auto 0;
            text-align: left;
        }
        .loading-step {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 0;
            color: var(--text-light);
            font-size: 0.95rem;
        }
        .loading-step.done { color: var(--success); }
        .loading-step .step-dot {
            width: 20px; height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .loading-step.done .step-dot {
            background: var(--success);
            border-color: var(--success);
            color: #fff;
        }

        /* ===== CARDS RESULT ===== */
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .result-header h2 {
            font-size: 1.4rem;
        }
        .result-actions {
            display: flex;
            gap: 10px;
        }
        .btn-secondary {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .study-card {
            background: var(--card-bg);
            border-radius: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            perspective: 1000px;
            min-height: 280px;
            position: relative;
        }
        .study-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 280px;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .study-card.flipped .study-card-inner {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        .card-face.back {
            transform: rotateY(180deg);
        }
        .card-front-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .card-type-badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .card-speak-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .card-speak-btn:hover { background: #eef2ff; }
        .card-keyword {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }
        .card-phonetic {
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: auto;
        }
        .card-flip-hint {
            text-align: center;
            color: var(--text-light);
            font-size: 0.8rem;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
        }
        .card-meaning {
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 14px;
        }
        .card-example {
            background: #f8fafc;
            border-left: 3px solid var(--accent);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            font-size: 0.9rem;
            color: #475569;
            margin-bottom: 12px;
        }
        .card-tip {
            background: #ecfdf5;
            color: #065f46;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.88rem;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }
        .card-tip-icon { flex-shrink: 0; margin-top: 2px; }

        /* ===== REVIEW MODE ===== */
        .review-area {
            max-width: 520px;
            margin: 0 auto;
        }
        .review-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .progress-bar {
            flex: 1;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.3s;
        }
        .review-card-wrap {
            margin-bottom: 24px;
        }
        .review-card-wrap .study-card {
            min-height: 360px;
            cursor: default;
        }
        .review-card-wrap .study-card-inner {
            min-height: 360px;
        }
        .review-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
        }
        .review-btn {
            padding: 14px 8px;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .review-btn:hover { transform: translateY(-2px); }
        .review-btn.again { background: #fee2e2; color: #991b1b; }
        .review-btn.hard { background: #ffedd5; color: #9a3412; }
        .review-btn.good { background: #dbeafe; color: #1e40af; }
        .review-btn.easy { background: #d1fae5; color: #065f46; }
        .review-btn-label { font-size: 0.75rem; opacity: 0.8; margin-top: 2px; }

        /* ===== MY CARDS ===== */
        .deck-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .deck-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        .deck-item:hover {
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }
        .deck-title {
            font-weight: 600;
            margin-bottom: 6px;
        }
        .deck-meta {
            color: var(--text-light);
            font-size: 0.85rem;
        }
        .deck-count {
            display: inline-block;
            background: #eef2ff;
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            opacity: 0;
            transition: all 0.3s;
            z-index: 200;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .hero h1 { font-size: 1.8rem; }
            .cards-grid { grid-template-columns: 1fr; }
            .review-buttons { grid-template-columns: 1fr 1fr; }
            .result-header { flex-direction: column; align-items: flex-start; }
            .input-actions { flex-direction: column; align-items: stretch; }
            .settings { justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- NAV -->
    <nav class="nav">
        <div class="nav-inner">
            <div class="logo">
                <div class="logo-icon">🃏</div>
                <span>智记卡片</span>
            </div>
            <div class="nav-links">
                <button class="active" onclick="goPage('home')">制作卡片</button>
                <button onclick="goPage('mycards')">我的卡片</button>
                <button onclick="goPage('review')">开始复习</button>
            </div>
        </div>
    </nav>

    <!-- ===== PAGE: HOME / CREATE ===== -->
    <div id="page-home" class="page active">
        <div class="hero">
            <h1>AI 一键生成学习卡片</h1>
            <p>粘贴任意内容，AI自动提取知识点，生成包含释义、例句和记忆技巧的智能卡片</p>
        </div>

        <div class="input-card">
            <div class="input-tabs">
                <div class="input-tab active" onclick="switchTab(this,'text')">
                    <span>📝</span> 文本输入
                </div>
                <div class="input-tab" onclick="switchTab(this,'image')">
                    <span>📷</span> 图片识别
                </div>
                <div class="input-tab" onclick="switchTab(this,'file')">
                    <span>📄</span> 文件上传
                </div>
            </div>

            <div class="input-area">
                <textarea id="contentInput" placeholder="在此粘贴学习内容...&#10;&#10;示例：&#10;photosynthesis&#10;mitochondria&#10;chlorophyll&#10;&#10;或粘贴一段文章，AI会自动提取关键概念"></textarea>
                <div class="placeholder-hint">💡 支持单词、短语、段落或整篇文章，AI会自动分析并生成结构化卡片</div>
            </div>

            <div class="input-actions">
                <div class="settings">
                    <div class="setting-item">
                        <span>语言：</span>
                        <select id="langSelect">
                            <option>自动检测</option>
                            <option>英语</option>
                            <option>中文</option>
                            <option>日语</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <span>卡片风格：</span>
                        <select id="styleSelect">
                            <option>标准</option>
                            <option>简洁</option>
                            <option>详细</option>
                        </select>
                    </div>
                </div>
                <button class="btn-primary" onclick="generateCards()">
                    <span>✨</span> 生成卡片
                </button>
            </div>
        </div>
    </div>

    <!-- ===== PAGE: LOADING ===== -->
    <div id="page-loading" class="page">
        <div class="loading-area">
            <div class="spinner"></div>
            <h2>AI 正在分析内容...</h2>
            <p style="color: var(--text-light); margin-top: 8px;">预计需要 10-20 秒</p>
            <div class="loading-steps">
                <div class="loading-step" id="step1">
                    <div class="step-dot">1</div>
                    <span>解析输入内容，提取关键知识点</span>
                </div>
                <div class="loading-step" id="step2">
                    <div class="step-dot">2</div>
                    <span>生成释义和例句</span>
                </div>
                <div class="loading-step" id="step3">
                    <div class="step-dot">3</div>
                    <span>设计记忆技巧和关联知识</span>
                </div>
                <div class="loading-step" id="step4">
                    <div class="step-dot">4</div>
                    <span>构建卡片集</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== PAGE: RESULT ===== -->
    <div id="page-result" class="page">
        <div class="result-header">
            <h2>🎉 已生成 <span id="cardCount">5</span> 张学习卡片</h2>
            <div class="result-actions">
                <button class="btn-secondary" onclick="goPage('home')">
                    <span>←</span> 重新制作
                </button>
                <button class="btn-secondary" onclick="showToast('卡片集已保存到"我的卡片"')">
                    <span>💾</span> 保存
                </button>
                <button class="btn-primary" onclick="goPage('review')">
                    <span>▶</span> 开始复习
                </button>
            </div>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <!-- ===== PAGE: REVIEW ===== -->
    <div id="page-review" class="page">
        <div class="review-area">
            <div class="review-progress">
                <span id="reviewCounter">1 / 5</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 20%"></div>
                </div>
            </div>
            <div class="review-card-wrap">
                <div class="study-card" id="reviewCard" onclick="flipReviewCard()">
                    <div class="study-card-inner">
                        <div class="card-face front" id="reviewFront"></div>
                        <div class="card-face back" id="reviewBack"></div>
                    </div>
                </div>
            </div>
            <div class="review-buttons" id="reviewButtons" style="opacity:0; pointer-events:none; transition:opacity 0.3s;">
                <button class="review-btn again" onclick="nextReview(0)">
                    <div>再次学习</div>
                    <div class="review-btn-label">&lt; 1分钟</div>
                </button>
                <button class="review-btn hard" onclick="nextReview(1)">
                    <div>困难</div>
                    <div class="review-btn-label">6分钟后</div>
                </button>
                <button class="review-btn good" onclick="nextReview(2)">
                    <div>良好</div>
                    <div class="review-btn-label">10分钟后</div>
                </button>
                <button class="review-btn easy" onclick="nextReview(3)">
                    <div>简单</div>
                    <div class="review-btn-label">4天后</div>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== PAGE: MY CARDS ===== -->
    <div id="page-mycards" class="page">
        <div class="result-header">
            <h2>📚 我的卡片集</h2>
            <button class="btn-primary" onclick="goPage('home')">
                <span>+</span> 新建卡片集
            </button>
        </div>
        <div class="deck-list" id="deckList"></div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== DATA =====
        const demoCards = [
            {
                type: '单词',
                keyword: 'photosynthesis',
                phonetic: '/ˌfoʊtoʊˈsɪnθəsɪs/',
                meaning: '光合作用。植物、藻类及某些细菌利用光能，将二氧化碳和水转化为葡萄糖和氧气的过程。',
                example: '"Plants use photosynthesis to convert sunlight into chemical energy."\n植物通过光合作用将阳光转化为化学能。',
                tip: 'photo（光）+ synthesis（合成）= 光合成 → 光合作用。记住 photo 就是"照片"，照片需要光！'
            },
            {
                type: '概念',
                keyword: 'mitochondria',
                phonetic: '/ˌmaɪtəˈkɒndriə/',
                meaning: '线粒体。细胞中进行有氧呼吸的主要场所，被称为细胞的"动力工厂"，负责产生ATP（能量货币）。',
                example: '"Mitochondria produce about 90% of the energy that cells need to survive."\n线粒体产生细胞生存所需约90%的能量。',
                tip: '联想：mite（小虫）+ con（共同）+ drea → 想象小虫在细胞里共同开工厂，生产能量！'
            },
            {
                type: '单词',
                keyword: 'chlorophyll',
                phonetic: '/ˈklɔːrəfɪl/',
                meaning: '叶绿素。植物中吸收光能的绿色色素，主要吸收红光和蓝紫光，反射绿光，因此植物呈现绿色。',
                example: '"Chlorophyll absorbs red and blue light most efficiently."\n叶绿素最高效地吸收红光和蓝光。',
                tip: 'chloro（绿色）+ phyll（叶子）= 绿色叶子的东西 → 叶绿素。chloro 就是 chlorine（氯）的词根！'
            },
            {
                type: '概念',
                keyword: 'cellular respiration',
                phonetic: '/ˈseljələr respəˈreɪʃn/',
                meaning: '细胞呼吸。细胞将葡萄糖等有机物分解，释放能量的过程，分为有氧呼吸和无氧呼吸两种类型。',
                example: '"Cellular respiration breaks down glucose to produce ATP."\n细胞呼吸分解葡萄糖以产生ATP。',
                tip: '对比记忆：photosynthesis（光合作用）储存能量，cellular respiration（细胞呼吸）释放能量。一进一出！'
            },
            {
                type: '概念',
                keyword: 'ATP',
                phonetic: '/ˌeɪ tiː ˈpiː/',
                meaning: '腺苷三磷酸（Adenosine Triphosphate）。细胞的直接能量来源，被称为细胞的"能量货币"，通过水解高能磷酸键释放能量。',
                example: '"ATP provides energy for most cellular processes."\nATP为大多数细胞过程提供能量。',
                tip: '把 ATP 想象成 A-T-M（自动取款机），细胞需要能量时就去"取"！Tri- 表示"三"，对应三个磷酸基团。'
            }
        ];

        const myDecks = [
            { title: '生物学术语', count: 5, date: '2026-06-30', cards: demoCards },
            { title: '雅思核心词汇', count: 12, date: '2026-06-28', cards: [] },
            { title: 'JavaScript概念', count: 8, date: '2026-06-25', cards: [] }
        ];

        let currentCards = [];
        let reviewIndex = 0;

        // ===== NAVIGATION =====
        function goPage(name) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + name).classList.add('active');

            const navMap = { home: 0, mycards: 1, review: 2 };
            if (navMap[name] !== undefined) {
                document.querySelectorAll('.nav-links button')[navMap[name]].classList.add('active');
            }

            if (name === 'mycards') renderDecks();
            if (name === 'review') startReview();
        }

        function switchTab(el, type) {
            document.querySelectorAll('.input-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const hints = {
                text: '在此粘贴学习内容...\n\n示例：\nphotosynthesis\nmitochondria\nchlorophyll\n\n或粘贴一段文章，AI会自动提取关键概念',
                image: '点击上传图片，支持教材、笔记、PPT截图等\n\nAI将自动识别图片中的文字内容并生成学习卡片',
                file: '支持上传 PDF、Word、TXT 文件\n\nAI将自动解析文件内容，提取关键知识点生成卡片'
            };
            document.getElementById('contentInput').placeholder = hints[type];
        }

        // ===== GENERATE =====
        function generateCards() {
            const content = document.getElementById('contentInput').value.trim();
            if (!content) {
                showToast('请先输入学习内容');
                return;
            }

            goPage('loading');
            let step = 1;
            const interval = setInterval(() => {
                if (step <= 4) {
                    document.getElementById('step' + step).classList.add('done');
                    document.querySelector('#step' + step + ' .step-dot').textContent = '✓';
                    step++;
                }
            }, 1500);

            setTimeout(() => {
                clearInterval(interval);
                currentCards = [...demoCards];
                renderCards();
                goPage('result');
                // reset steps
                for (let i = 1; i <= 4; i++) {
                    document.getElementById('step' + i).classList.remove('done');
                    document.querySelector('#step' + i + ' .step-dot').textContent = i;
                }
            }, 6500);
        }

        function renderCards() {
            document.getElementById('cardCount').textContent = currentCards.length;
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = currentCards.map((c, i) => `
                <div class="study-card" id="card-${i}" onclick="flipCard(${i})">
                    <div class="study-card-inner">
                        <div class="card-face front">
                            <div class="card-front-header">
                                <span class="card-type-badge">${c.type}</span>
                                <button class="card-speak-btn" onclick="event.stopPropagation(); showToast('🔊 ' + c.keyword)">🔊</button>
                            </div>
                            <div class="card-keyword">${c.keyword}</div>
                            <div class="card-phonetic">${c.phonetic}</div>
                            <div class="card-flip-hint">👆 点击翻转查看释义</div>
                        </div>
                        <div class="card-face back">
                            <div class="card-front-header">
                                <span class="card-type-badge">${c.type}</span>
                                <button class="card-speak-btn" onclick="event.stopPropagation(); showToast('🔊 朗读释义')">🔊</button>
                            </div>
                            <div class="card-meaning">${c.meaning}</div>
                            <div class="card-example">${c.example.replace(/\n/g,'<br>')}</div>
                            <div class="card-tip">
                                <span class="card-tip-icon">💡</span>
                                <span>${c.tip}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function flipCard(i) {
            document.getElementById('card-' + i).classList.toggle('flipped');
        }

        // ===== REVIEW =====
        function startReview() {
            if (currentCards.length === 0) currentCards = [...demoCards];
            reviewIndex = 0;
            renderReviewCard();
        }

        function renderReviewCard() {
            const c = currentCards[reviewIndex];
            document.getElementById('reviewCounter').textContent = (reviewIndex + 1) + ' / ' + currentCards.length;
            document.getElementById('progressFill').style.width = ((reviewIndex + 1) / currentCards.length * 100) + '%';

            document.getElementById('reviewFront').innerHTML = `
                <div class="card-front-header">
                    <span class="card-type-badge">${c.type}</span>
                    <button class="card-speak-btn" onclick="event.stopPropagation(); showToast('🔊 ' + c.keyword)">🔊</button>
                </div>
                <div style="margin:auto; text-align:center;">
                    <div class="card-keyword" style="font-size:2.2rem;">${c.keyword}</div>
                    <div class="card-phonetic" style="font-size:1.1rem;">${c.phonetic}</div>
                </div>
                <div class="card-flip-hint">👆 点击翻转查看答案</div>
            `;

            document.getElementById('reviewBack').innerHTML = `
                <div class="card-front-header">
                    <span class="card-type-badge">${c.type}</span>
                    <button class="card-speak-btn" onclick="event.stopPropagation(); showToast('🔊 朗读释义')">🔊</button>
                </div>
                <div class="card-meaning">${c.meaning}</div>
                <div class="card-example">${c.example.replace(/\n/g,'<br>')}</div>
                <div class="card-tip">
                    <span class="card-tip-icon">💡</span>
                    <span>${c.tip}</span>
                </div>
            `;

            document.getElementById('reviewCard').classList.remove('flipped');
            document.getElementById('reviewButtons').style.opacity = '0';
            document.getElementById('reviewButtons').style.pointerEvents = 'none';
        }

        function flipReviewCard() {
            const card = document.getElementById('reviewCard');
            card.classList.toggle('flipped');
            if (card.classList.contains('flipped')) {
                document.getElementById('reviewButtons').style.opacity = '1';
                document.getElementById('reviewButtons').style.pointerEvents = 'auto';
            } else {
                document.getElementById('reviewButtons').style.opacity = '0';
                document.getElementById('reviewButtons').style.pointerEvents = 'none';
            }
        }

        function nextReview(difficulty) {
            reviewIndex++;
            if (reviewIndex >= currentCards.length) {
                showToast('🎉 本轮复习完成！');
                goPage('mycards');
                return;
            }
            renderReviewCard();
        }

        // ===== MY CARDS =====
        function renderDecks() {
            document.getElementById('deckList').innerHTML = myDecks.map((d, i) => `
                <div class="deck-item" onclick="loadDeck(${i})">
                    <div class="deck-title">${d.title}</div>
                    <div class="deck-meta">${d.date} · ${d.count} 张卡片</div>
                    <span class="deck-count">${d.count} 张待复习</span>
                </div>
            `).join('');
        }

        function loadDeck(i) {
            currentCards = myDecks[i].cards.length > 0 ? myDecks[i].cards : [...demoCards];
            showToast('已加载「' + myDecks[i].title + '」');
            goPage('review');
        }

        // ===== TOAST =====
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
