  @media (max-width: 480px) {

<body>

<div id="toast" class="toast"></div>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>个人记账本</h1>
    <p>轻量记录每一笔收支</p>
  </div>

  <!-- Summary Card -->
  <div class="card">
    <div class="card-title">
      <span class="icon icon-stats">S</span>
      金额统计
    </div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="label">总收入</div>
        <div class="value income" id="totalIncome">0.00</div>
      </div>
      <div class="stat-box">
        <div class="label">总支出</div>
        <div class="value expense" id="totalExpense">0.00</div>
      </div>
      <div class="stat-box">
        <div class="label">结余</div>
        <div class="value balance" id="totalBalance">0.00</div>
      </div>
    </div>
  </div>

  <!-- Add Record Card -->
  <div class="card">
    <div class="card-title">
      <span class="icon icon-form">+</span>
      记一笔
    </div>
    <div class="type-toggle">
      <button class="type-btn active-income" id="btnIncome" onclick="setType('income')">收入</button>
      <button class="type-btn" id="btnExpense" onclick="setType('expense')">支出</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="inputDate">
      </div>
      <div class="form-group">
        <label>分类</label>
        <select id="inputCategory">
          <option value="餐饮">餐饮</option>
          <option value="交通">交通</option>
          <option value="购物">购物</option>
          <option value="娱乐">娱乐</option>
          <option value="居住">居住</option>
          <option value="医疗">医疗</option>
          <option value="教育">教育</option>
          <option value="工资">工资</option>
          <option value="兼职">兼职</option>
          <option value="理财">理财</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>金额 (元)</label>
        <input type="number" id="inputAmount" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="inputNote" placeholder="可选">
      </div>
    </div>
    <button class="submit-btn" onclick="addRecord()">添加记录</button>
  </div>

  <!-- Records Card -->
  <div class="card">
    <div class="card-title">
      <span class="icon icon-income">L</span>
      收支明细
    </div>
    <div class="filter-bar">
      <div style="display:flex;gap:0.5rem;align-items:center;">
        <select id="filterMonth" onchange="renderRecords()">
          <option value="all">全部月份</option>
        </select>
        <select id="filterType" onchange="renderRecords()">
          <option value="all">收支全部</option>
          <option value="income">仅收入</option>
          <option value="expense">仅支出</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <span class="record-count" id="recordCount">0 条记录</span>
        <button class="clear-btn" onclick="clearAll()">清空全部</button>
      </div>
    </div>
    <div id="recordList"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var STORAGE_KEY = 'personal_account_book_records';
  var currentType = 'income';

  // Init date input to today
  var today = new Date();
  document.getElementById('inputDate').value = formatDateISO(today);

  function formatDateISO(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function getRecords() {
    try {
      var data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return [];
    }
  }

  function saveRecords(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 1800);
  }

  // Add record
  window.addRecord = function() {
    var dateVal = document.getElementById('inputDate').value;
    var category = document.getElementById('inputCategory').value;
    var amountVal = document.getElementById('inputAmount').value;
    var note = document.getElementById('inputNote').value.trim();

    if (!dateVal) { showToast('请选择日期'); return; }
    if (!amountVal || parseFloat(amountVal) <= 0) { showToast('请输入有效金额'); return; }

    var record = {
      id: Date.now() + Math.random(),
      type: currentType,
      date: dateVal,
      category: category,
      amount: parseFloat(parseFloat(amountVal).toFixed(2)),
      note: note
    };

    var records = getRecords();
    records.unshift(record);
    saveRecords(records);

    document.getElementById('inputAmount').value = '';
    document.getElementById('inputNote').value = '';

    showToast(currentType === 'income' ? '收入已记录' : '支出已记录');
    renderAll();
  };

  // Delete record
  window.deleteRecord = function(id) {
    var records = getRecords();
    records = records.filter(function(r) { return r.id !== id; });
    saveRecords(records);
    showToast('已删除');
    renderAll();
  };

  // Clear all
  window.clearAll = function() {
    if (getRecords().length === 0) return;
    if (confirm('确定要清空所有记录吗？此操作不可撤销。')) {
      saveRecords([]);
      showToast('已清空全部记录');
      renderAll();
    }
  };

  // Type toggle
  window.setType = function(type) {
    currentType = type;
    var btnI = document.getElementById('btnIncome');
    var btnE = document.getElementById('btnExpense');
    btnI.className = 'type-btn' + (type === 'income' ? ' active-income' : '');
    btnE.className = 'type-btn' + (type === 'expense' ? ' active-expense' : '');
  };

  // Update filter month options
  function updateMonthFilter() {
    var records = getRecords();
    var months = {};
    records.forEach(function(r) {
      months[r.date.substring(0, 7)] = true;
    });
    var sorted = Object.keys(months).sort().reverse();
    var select = document.getElementById('filterMonth');
    var current = select.value;
    select.innerHTML = '<option value="all">全部月份</option>';
    sorted.forEach(function(m) {
      var label = m.substring(0, 4) + '年' + parseInt(m.substring(5, 7)) + '月';
      var opt = document.createElement('option');
      opt.value = m;
      opt.textContent = label;
      select.appendChild(opt);
    });
    if (current && months[current]) select.value = current;
  }

  // Render summary stats
  function renderStats() {
    var records = getRecords();
    var totalIn = 0, totalOut = 0;
    records.forEach(function(r) {
      if (r.type === 'income') totalIn += r.amount;
      else totalOut += r.amount;
    });
    var balance = totalIn - totalOut;

    document.getElementById('totalIncome').textContent = totalIn.toFixed(2);
    document.getElementById('totalExpense').textContent = totalOut.toFixed(2);

    var balEl = document.getElementById('totalBalance');
    balEl.textContent = (balance >= 0 ? '' : '-') + Math.abs(balance).toFixed(2);
    balEl.className = 'value balance' + (balance < 0 ? ' negative' : '');
  }

  // Render records list grouped by month
  window.renderRecords = function() {
    var records = getRecords();
    var filterMonth = document.getElementById('filterMonth').value;
    var filterType = document.getElementById('filterType').value;

    var filtered = records.filter(function(r) {
      if (filterMonth !== 'all' && r.date.substring(0, 7) !== filterMonth) return false;
      if (filterType !== 'all' && r.type !== filterType) return false;
      return true;
    });

    // Group by month
    var groups = {};
    filtered.forEach(function(r) {
      var m = r.date.substring(0, 7);
      if (!groups[m]) groups[m] = [];
      groups[m].push(r);
    });

    var sortedMonths = Object.keys(groups).sort().reverse();
    var container = document.getElementById('recordList');

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">"></div><p>暂无记录，快去记一笔吧</p></div>';
      document.getElementById('recordCount').textContent = '0 条记录';
      return;
    }

    var html = '';
    var totalCount = 0;

    sortedMonths.forEach(function(m) {
      var items = groups[m].sort(function(a, b) { return b.date.localeCompare(a.date) || b.id - a.id; });
      var mIncome = 0, mExpense = 0;
      items.forEach(function(r) {
        if (r.type === 'income') mIncome += r.amount;
        else mExpense += r.amount;
      });

      var label = m.substring(0, 4) + '年' + parseInt(m.substring(5, 7)) + '月';
      html += '<div class="month-group-title">';
      html += '<span>' + label + '</span>';
      html += '<span class="month-stats"><span style="color:var(--green)">+' + mIncome.toFixed(2) + '</span> / <span style="color:var(--accent2)">-' + mExpense.toFixed(2) + '</span></span>';
      html += '</div>';
      html += '<ul class="record-list">';

      items.forEach(function(r) {
        totalCount++;
        var dateDisplay = parseInt(m.substring(5, 7)) + '/' + parseInt(r.date.substring(8, 10));
        var sign = r.type === 'income' ? '+' : '-';
        html += '<li class="record-item">';
        html += '<span class="record-dot ' + r.type + '"></span>';
        html += '<div class="record-info">';
        html += '<div class="desc">' + escapeHtml(r.category) + (r.note ? ' · ' + escapeHtml(r.note) : '') + '</div>';
        html += '<div class="meta">' + dateDisplay + '</div>';
        html += '</div>';
        html += '<span class="record-amount ' + r.type + '">' + sign + r.amount.toFixed(2) + '</span>';
        html += '<button class="record-delete" onclick="deleteRecord(' + r.id + ')" title="删除">&times;</button>';
        html += '</li>';
      });

      html += '</ul>';
    });

    container.innerHTML = html;
    document.getElementById('recordCount').textContent = totalCount + ' 条记录';
  };

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderAll() {
    updateMonthFilter();
    renderStats();
    renderRecords();
  }

  // Initial render
  renderAll();

})();
</script>
</body>
</html>
