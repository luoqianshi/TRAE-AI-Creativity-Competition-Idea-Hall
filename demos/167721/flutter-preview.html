<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JiazhengOS - Flutter App Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bgDeep:#050A14;--bgBase:#0A1128;--bgCard:#0F1A2E;--bgElevated:#152238;--bgInput:#0D1629;--bgHover:#1A2A45;
  --primary:#00E5C3;--primaryDark:#00B89C;--primaryLight:#33FFD9;
  --accent:#6C5CE7;--accentSoft:#8B7CF7;
  --success:#00D68F;--warning:#FFB020;--danger:#FF3D71;--info:#339AF0;
  --textPrimary:#E8ECF4;--textSecondary:#8892A4;--textTertiary:#5A6478;--textHint:#3D4A5C;--textInverse:#0A1128;
  --border:#1E2D45;--borderLight:#253552;--borderFocus:#00E5C3;
  --glass:rgba(255,255,255,0.08);--glassBorder:rgba(255,255,255,0.12);
  --glowPrimary:rgba(0,229,195,0.25);--glowSuccess:rgba(0,214,143,0.25);--glowWarning:rgba(255,176,32,0.25);--glowDanger:rgba(255,61,113,0.25);
}
html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#020510;color:var(--textPrimary);overflow:hidden;}
.app{display:flex;height:100vh;}
.sidebar{width:300px;min-width:300px;background:var(--bgDeep);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:20px;border-bottom:1px solid var(--border);}
.sidebar-logo{font-size:18px;font-weight:700;color:var(--primary);text-shadow:0 0 20px var(--glowPrimary),0 0 40px rgba(0,229,195,0.15);letter-spacing:1.5px;}
.sidebar-sub{font-size:11px;color:var(--textTertiary);margin-top:4px;}
.sidebar-search{margin:12px 16px 8px;position:relative;}
.sidebar-search input{width:100%;padding:8px 12px 8px 32px;background:var(--bgInput);border:1px solid var(--border);border-radius:8px;color:var(--textPrimary);font-size:12px;outline:none;}
.sidebar-search input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--glowPrimary);}
.sidebar-search::before{content:'🔍';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;}
.sidebar-tree{flex:1;overflow-y:auto;padding:8px 0;}
.sidebar-tree::-webkit-scrollbar{width:4px;}
.sidebar-tree::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.tree-group{margin-bottom:4px;}
.tree-group-header{display:flex;align-items:center;gap:6px;padding:8px 16px;cursor:pointer;font-size:12px;font-weight:600;color:var(--textSecondary);transition:all .2s;user-select:none;}
.tree-group-header:hover{color:var(--textPrimary);background:var(--bgHover);}
.tree-group-header .arrow{transition:transform .2s;font-size:10px;}
.tree-group.open .arrow{transform:rotate(90deg);}
.tree-group-items{display:none;}
.tree-group.open .tree-group-items{display:block;}
.tree-item{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 28px;cursor:pointer;font-size:12px;color:var(--textTertiary);transition:all .15s;position:relative;}
.tree-item:hover{color:var(--textSecondary);background:rgba(0,229,195,0.03);}
.tree-item.active{color:var(--primary);background:rgba(0,229,195,0.06);}
.tree-item.active::before{content:'';position:absolute;left:16px;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--primary);border-radius:2px;box-shadow:0 0 8px var(--glowPrimary);}
.tree-item .ai-badge{font-size:9px;padding:1px 5px;background:rgba(0,229,195,0.12);color:var(--primary);border-radius:4px;font-weight:600;margin-left:auto;}
.tree-count{margin-left:auto;font-size:11px;color:var(--textTertiary);opacity:0.6;}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--textTertiary);text-align:center;}
.center{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,rgba(0,229,195,0.03) 0%,transparent 70%);}
.phone{width:375px;height:812px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 0 0 2px #1a2744,0 0 0 4px #0d1629,0 0 60px rgba(0,229,195,0.08),0 20px 60px rgba(0,0,0,0.5);}
.phone-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:34px;background:#000;border-radius:0 0 20px 20px;z-index:100;display:flex;align-items:center;justify-content:center;gap:8px;}
.phone-notch-cam{width:12px;height:12px;background:#1a2744;border-radius:50%;border:2px solid #0d1629;}
.phone-screen{width:100%;height:100%;background:var(--bgBase);display:flex;flex-direction:column;overflow:hidden;}
.status-bar{height:54px;padding:14px 24px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--textPrimary);flex-shrink:0;z-index:50;}
.app-bar{height:48px;display:flex;align-items:center;justify-content:center;padding:0 16px;flex-shrink:0;position:relative;}
.app-bar-back{position:absolute;left:4px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--textPrimary);border-radius:50%;transition:background .2s;font-size:22px;}
.app-bar-back:hover{background:var(--bgHover);}
.app-bar-title{font-size:16px;font-weight:600;color:var(--textPrimary);}
.app-bar-right{position:absolute;right:8px;display:flex;gap:4px;}
.app-bar-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--textSecondary);border-radius:50%;transition:all .2s;font-size:18px;}
.app-bar-btn:hover{background:var(--bgHover);color:var(--textPrimary);}
.page-content{flex:1;overflow-y:auto;overflow-x:hidden;}
.page-content::-webkit-scrollbar{width:0;}
.page{display:none;animation:pageIn .3s ease;}
.page.active{display:block;}
@keyframes pageIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.bottom-nav{height:64px;background:var(--bgDeep);border-top:1px solid var(--border);display:flex;flex-shrink:0;padding-bottom:8px;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:all .2s;}
.nav-item .nav-icon{font-size:20px;transition:all .2s;}
.nav-item .nav-label{font-size:10px;font-weight:500;transition:all .2s;}
.nav-item.active .nav-icon{color:var(--primary);text-shadow:0 0 12px var(--glowPrimary);}
.nav-item.active .nav-label{color:var(--primary);font-weight:600;text-shadow:0 0 10px var(--glowPrimary);}
.glass-card{background:var(--bgCard);border:1px solid var(--border);border-radius:16px;}
.glass-surface{background:var(--glass);border:1px solid var(--glassBorder);border-radius:12px;}
.section-title{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.section-title .bar{width:3px;height:16px;background:var(--primary);border-radius:2px;box-shadow:0 0 8px var(--glowPrimary);}
.section-title .label{font-size:16px;font-weight:600;color:var(--textPrimary);}
.glow-pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;border:0.5px solid;}
.glow-pill-success{background:rgba(0,214,143,0.12);color:var(--success);border-color:rgba(0,214,143,0.3);box-shadow:0 0 8px rgba(0,214,143,0.15);}
.glow-pill-warning{background:rgba(255,176,32,0.12);color:var(--warning);border-color:rgba(255,176,32,0.3);box-shadow:0 0 8px rgba(255,176,32,0.15);}
.glow-pill-danger{background:rgba(255,61,113,0.12);color:var(--danger);border-color:rgba(255,61,113,0.3);box-shadow:0 0 8px rgba(255,61,113,0.15);}
.glow-pill-info{background:rgba(51,154,240,0.12);color:var(--info);border-color:rgba(51,154,240,0.3);box-shadow:0 0 8px rgba(51,154,240,0.15);}
.glow-pill-primary{background:rgba(0,229,195,0.12);color:var(--primary);border-color:rgba(0,229,195,0.3);box-shadow:0 0 8px var(--glowPrimary);}
.glow-pill-muted{background:rgba(90,100,120,0.2);color:var(--textTertiary);border-color:rgba(90,100,120,0.3);}
.gradient-btn{background:linear-gradient(135deg,var(--primary),#00B4D8);border:none;color:var(--textInverse);font-weight:600;border-radius:12px;cursor:pointer;box-shadow:0 4px 15px var(--glowPrimary);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.gradient-btn:hover{box-shadow:0 6px 25px rgba(0,229,195,0.35);transform:translateY(-1px);}
.gradient-btn-sm{height:32px;padding:0 14px;font-size:12px;border-radius:16px;}
.gradient-btn-md{height:44px;padding:0 20px;font-size:14px;}
.gradient-btn-lg{height:48px;width:100%;font-size:15px;}
.input-field{width:100%;padding:10px 14px 10px 40px;background:var(--bgInput);border:1px solid var(--border);border-radius:12px;color:var(--textPrimary);font-size:13px;outline:none;transition:border-color .2s;font-family:inherit;}
.input-field:focus{border-color:var(--primary);}
.input-field::placeholder{color:var(--textHint);}
.input-group{position:relative;}
.input-group .input-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--textTertiary);pointer-events:none;z-index:1;}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--bgElevated);color:var(--textSecondary);}
.chip.active{background:var(--primary);color:var(--textInverse);border-color:var(--primary);box-shadow:0 0 12px var(--glowPrimary);}
.stat-num{font-weight:700;font-size:20px;text-shadow:0 0 12px currentColor;}
.fab{position:absolute;bottom:80px;right:16px;width:52px;height:52px;border-radius:16px;background:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 20px var(--glowPrimary);transition:all .2s;z-index:10;font-size:22px;color:var(--textInverse);}
.fab:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,229,195,0.4);}
.pad16{padding:16px;}.mb8{margin-bottom:8px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}.mb20{margin-bottom:20px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}
.flex{display:flex;}.items-center{align-items:center;}.justify-between{justify-content:space-between;}.gap8{gap:8px;}.gap12{gap:12px;}.gap16{gap:16px;}
.flex-1{flex:1;}.text-center{text-align:center;}
.text-xs{font-size:11px;}.text-sm{font-size:13px;}.text-lg{font-size:15px;}.text-xl{font-size:18px;}.text-2xl{font-size:20px;}.text-4xl{font-size:44px;}
.font-bold{font-weight:700;}.font-semibold{font-weight:600;}.font-medium{font-weight:500;}
.text-primary-c{color:var(--textPrimary);}.text-secondary-c{color:var(--textSecondary);}.text-tertiary-c{color:var(--textTertiary);}
.text-primary-accent{color:var(--primary);}.text-success-c{color:var(--success);}.text-warning-c{color:var(--warning);}.text-danger-c{color:var(--danger);}.text-info-c{color:var(--info);}.text-accent-c{color:var(--accent);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.avatar{display:flex;align-items:center;justify-content:center;border-radius:50%;}
.shimmer{animation:shimmer 2s ease-in-out infinite alternate;}
@keyframes shimmer{0%{opacity:0.4;}100%{opacity:1;}}
.glow-pulse{animation:glowPulse 2s ease-in-out infinite alternate;}
@keyframes glowPulse{0%{box-shadow:0 0 8px var(--glowPrimary);}100%{box-shadow:0 0 24px var(--glowPrimary),0 0 48px rgba(0,229,195,0.1);}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-header"><div class="sidebar-logo">JiazhengOS</div><div class="sidebar-sub">Premium Dark UI Preview - 37 Pages</div></div>
  <div class="sidebar-search"><input type="text" placeholder="搜索页面..." id="searchInput" oninput="filterPages(this.value)"></div>
  <div class="sidebar-tree" id="sidebarTree"></div>
  <div class="sidebar-footer">v2.0.0 | Premium Dark Theme</div>
</aside>
<main class="center"><div class="phone"><div class="phone-notch"><div class="phone-notch-cam"></div></div>
<div class="phone-screen">
  <div class="status-bar"><div>9:41</div><div style="display:flex;gap:6px;align-items:center;font-size:11px;"><span>5G</span><span>86%</span><span>🔋</span></div></div>
  <div id="pageContainer"></div>
  <div class="bottom-nav" id="bottomNav"></div>
</div></div></main>
</div>
<script>
const PAGES={
  'home':{g:'首页',l:'首页仪表盘',t:0,nv:false,bk:false},
  'ai-chat':{g:'AI智能',l:'AI智能客服',t:-1,nv:false,bk:true,ai:true},
  'ai-match':{g:'AI智能',l:'AI智能匹配',t:-1,nv:false,bk:true,ai:true},
  'ai-payslip':{g:'AI智能',l:'AI工资条',t:-1,nv:false,bk:true,ai:true},
  'ai-outbound':{g:'AI智能',l:'AI外呼',t:-1,nv:false,bk:true,ai:true},
  'ai-marketing':{g:'AI智能',l:'AI营销',t:-1,nv:false,bk:true,ai:true},
  'ai-report':{g:'AI智能',l:'AI报告',t:-1,nv:false,bk:true,ai:true},
  'ai-skill-profile':{g:'AI智能',l:'AI技能画像',t:-1,nv:false,bk:true,ai:true},
  'worker-list':{g:'阿姨管理',l:'阿姨列表',t:1,nv:false,bk:false},
  'worker-detail':{g:'阿姨管理',l:'阿姨详情',t:-1,nv:false,bk:true},
  'worker-edit':{g:'阿姨管理',l:'阿姨编辑(AI)',t:-1,nv:false,bk:true,ai:true},
  'worker-create':{g:'阿姨管理',l:'新增阿姨',t:-1,nv:false,bk:true},
  'worker-gps':{g:'阿姨管理',l:'GPS考勤',t:-1,nv:false,bk:true},
  'worker-insurance':{g:'阿姨管理',l:'保险管理',t:-1,nv:false,bk:true},
  'worker-risk':{g:'阿姨管理',l:'风控画像',t:-1,nv:false,bk:true},
  'customer-list':{g:'客户管理',l:'客户列表',t:2,nv:false,bk:false},
  'customer-detail':{g:'客户管理',l:'客户详情',t:-1,nv:false,bk:true},
  'customer-create':{g:'客户管理',l:'新增客户',t:-1,nv:false,bk:true},
  'customer-follow':{g:'客户管理',l:'跟进记录',t:-1,nv:false,bk:true},
  'order-list':{g:'工单管理',l:'工单列表',t:3,nv:false,bk:false},
  'order-detail':{g:'工单管理',l:'工单详情',t:-1,nv:false,bk:true},
  'order-create':{g:'工单管理',l:'创建工单',t:-1,nv:false,bk:true},
  'order-timeline':{g:'工单管理',l:'工单时间线',t:-1,nv:false,bk:true},
  'contract-list':{g:'合同管理',l:'合同列表',t:-1,nv:false,bk:true},
  'contract-detail':{g:'合同管理',l:'合同详情',t:-1,nv:false,bk:true},
  'contract-create':{g:'合同管理',l:'创建合同',t:-1,nv:false,bk:true},
  'interview-list':{g:'面试管理',l:'面试列表',t:-1,nv:false,bk:true},
  'interview-detail':{g:'面试管理',l:'面试详情',t:-1,nv:false,bk:true},
  'interview-schedule':{g:'面试管理',l:'面试安排',t:-1,nv:false,bk:true},
  'finance-payment':{g:'财务管理',l:'收付款管理',t:-1,nv:false,bk:true},
  'finance-record':{g:'财务管理',l:'财务流水',t:-1,nv:false,bk:true},
  'finance-stat':{g:'财务管理',l:'财务统计',t:-1,nv:false,bk:true},
  'marketing-qrcode':{g:'营销管理',l:'营销二维码',t:-1,nv:false,bk:true},
  'marketing-campaign':{g:'营销管理',l:'营销活动',t:-1,nv:false,bk:true},
  'notification-list':{g:'通知',l:'通知列表',t:-1,nv:false,bk:true},
  'notification-detail':{g:'通知',l:'通知详情',t:-1,nv:false,bk:true},
  'profile':{g:'个人中心',l:'个人中心',t:4,nv:false,bk:false},
  'settings':{g:'个人中心',l:'系统设置',t:-1,nv:false,bk:true},
  'about':{g:'个人中心',l:'关于',t:-1,nv:false,bk:true},
};
let currentPage='home',activeTab=0;
const navTabs=[{id:'home',icon:'🏠',label:'首页'},{id:'worker-list',icon:'👩',label:'阿姨'},{id:'customer-list',icon:'👤',label:'客户'},{id:'order-list',icon:'📋',label:'工单'},{id:'profile',icon:'⚙️',label:'我的'}];
document.addEventListener('DOMContentLoaded',()=>{buildSidebar();buildBottomNav();navigateTo('home');});

function buildSidebar(){
  const tree=document.getElementById('sidebarTree'),groups={};
  for(const[id,p]of Object.entries(PAGES)){if(!groups[p.g])groups[p.g]=[];groups[p.g].push({id,...p});}
  let h='';
  for(const gn of ['首页','AI智能','阿姨管理','客户管理','工单管理','合同管理','面试管理','财务管理','营销管理','通知','个人中心']){
    const items=groups[gn];if(!items)continue;
    const isOpen=gn==='首页'||gn==='AI智能';
    h+=`<div class="tree-group ${isOpen?'open':''}"><div class="tree-group-header" onclick="this.parentElement.classList.toggle('open')"><span class="arrow">▶</span><span>${gn}</span><span class="tree-count">${items.length}</span></div><div class="tree-group-items">`;
    for(const it of items){const ic=it.ai?'🤖':it.id.startsWith('worker')?'👩':it.id.startsWith('customer')?'👤':it.id.startsWith('order')?'📋':it.id.startsWith('contract')?'📄':it.id.startsWith('interview')?'📹':it.id.startsWith('finance')?'💰':it.id.startsWith('marketing')?'📲':it.id.startsWith('notification')?'🔔':it.id==='home'?'🏠':'⚙️';
    h+=`<div class="tree-item" data-page="${it.id}" onclick="navigateTo('${it.id}')"><span style="font-size:14px">${ic}</span><span>${it.l}</span>${it.ai?'<span class="ai-badge">AI</span>':''}</div>`;}
    h+=`</div></div>`;
  }
  tree.innerHTML=h;
}
function filterPages(q){q=q.toLowerCase();document.querySelectorAll('.tree-item').forEach(e=>{e.style.display=e.textContent.toLowerCase().includes(q)?'':'none';});document.querySelectorAll('.tree-group').forEach(g=>{g.style.display=g.querySelector('.tree-item[style=""],.tree-item:not([style])')?'':'none';});}
function buildBottomNav(){document.getElementById('bottomNav').innerHTML=navTabs.map((t,i)=>`<div class="nav-item ${i===0?'active':''}" onclick="onTab(${i})"><span class="nav-icon">${t.icon}</span><span class="nav-label">${t.label}</span></div>`).join('');}
function onTab(i){activeTab=i;navigateTo(navTabs[i].id,true);}
function navigateTo(id,fromTab=false){
  const p=PAGES[id];if(!p)return;currentPage=id;
  if(fromTab||p.t>=0)activeTab=p.t;
  document.querySelectorAll('.tree-item').forEach(e=>e.classList.toggle('active',e.dataset.page===id));
  const ai=document.querySelector(`.tree-item[data-page="${id}"]`);if(ai){const g=ai.closest('.tree-group');if(g)g.classList.add('open');ai.scrollIntoView({block:'nearest',behavior:'smooth'});}
  document.querySelectorAll('.nav-item').forEach((e,i)=>e.classList.toggle('active',i===activeTab));
  const showNav=p.t>=0||!p.bk;
  document.getElementById('bottomNav').style.display=showNav?'flex':'none';
  const bk=p.bk?`<div class="app-bar-back" onclick="history.back()">‹</div>`:'';
  let ar='';if(id==='home')ar=`<div class="app-bar-btn" onclick="navigateTo('notification-list')">🔔</div>`;
  if(id==='worker-detail')ar=`<div class="app-bar-btn">✏️</div><div class="app-bar-btn">✓</div>`;
  if(id==='worker-edit')ar=`<span style="color:var(--primary);font-size:14px;font-weight:600;cursor:pointer;">保存</span>`;
  document.getElementById('pageContainer').innerHTML=`<div class="app-bar">${bk}<div class="app-bar-title">${p.l}</div><div class="app-bar-right">${ar}</div></div><div class="page-content">${renderPage(id)}</div>`;
}

// === HELPERS ===
function hInput(ph,ic='🔍'){return `<div class="input-group mb12"><span class="input-icon">${ic}</span><input class="input-field" placeholder="${ph}" readonly></div>`;}
function hChips(arr,ai=0){return `<div class="flex gap8 mb12" style="overflow-x:auto;padding-bottom:4px;">${arr.map((c,i)=>`<span class="chip ${i===ai?'active':''}">${c}</span>`).join('')}</div>`;}
function hCard(inn){return `<div class="glass-card" style="padding:14px;">${inn}</div>`;}
function hStat(t,v,ic,cl){return `<div class="glass-card" style="padding:14px;cursor:pointer;"><div style="width:36px;height:36px;border-radius:10px;background:${cl}18;box-shadow:0 0 12px ${cl}30;display:flex;align-items:center;justify-content:center;margin-bottom:8px;"><span style="color:${cl};font-size:18px;">${ic}</span></div><div class="stat-num" style="color:${cl};">${v}</div><div class="text-xs text-secondary-c mt12" style="margin-top:4px;">${t}</div></div>`;}
