<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>老年人用药安全解读系统</title>
<style>
/* ============================================================
   老年人用药安全解读系统 — 专业医疗版
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 全局变量：医疗专业配色 */
:root {
  --primary:    #1e3a5f;
  --primary-dark: #152a45;
  --primary-light: #2a4a73;
  --secondary:  #5a6c7d;
  --bg:         #f5f6f8;
  --card-bg:    #ffffff;
  --text:       #1a1a1a;
  --text-secondary: #4a4a4a;
  --text-muted: #6a6a6a;
  --border:     #d0d4d8;
  --border-light: #e5e8eb;
  --warn:       #b83232;
  --warn-bg:    #fdf2f2;
  --warn-border: #f5c6c6;
  --ok:         #256f3a;
  --ok-bg:      #f0f7f2;
  --ok-border:  #b8d8c0;
  --info-bg:    #f0f4f8;
  --info-border: #c8d4e0;
  --radius:     6px;
  --radius-lg:  8px;
}

html { font-size: 18px; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ===== 顶部标题栏 ===== */
.header-bar {
  background: var(--primary);
  color: #fff;
  text-align: center;
  padding: 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--primary-dark);
}
.header-bar h1 {
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: 2px;
}
.header-bar .subtitle {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-top: 4px;
  letter-spacing: 1px;
}
.header-bar .header-actions {
  position: absolute;
  left: 16px; top: 50%;
  transform: translateY(-50%);
  display: none;
}
.header-bar .btn-back {
  background: rgba(255,255,255,0.1);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.2);
  font-size: 0.95rem;
  padding: 8px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 500;
  transition: background 0.15s;
}
.header-bar .btn-back:hover { background: rgba(255,255,255,0.2); }

/* ===== 主容器 ===== */
.main-wrap {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
  min-height: 60vh;
}

/* ===== 页面切换 ===== */
.page { display: none; }
.page.active { display: block; }

/* ===== 首页 ===== */
.home-hero { text-align: center; padding: 30px 0 20px; }
.home-hero h2 {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}
.home-hero p { font-size: 0.95rem; color: var(--text-muted); }

/* 主要功能入口 */
.main-actions { display: flex; flex-direction: column; gap: 14px; margin: 24px 0; }
.main-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 64px;
  font-size: 1.2rem;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-lg);
  cursor: pointer;
  transition: background 0.15s;
  letter-spacing: 1px;
  color: #fff;
  background: var(--primary);
}
.main-btn:hover { background: var(--primary-light); }
.main-btn:active { background: var(--primary-dark); }
.main-btn.secondary {
  background: var(--card-bg);
  color: var(--primary);
  border: 1px solid var(--border);
}
.main-btn.secondary:hover { background: var(--info-bg); }

/* 次要入口 */
.sub-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.sub-btn {
  height: 50px;
  font-size: 1rem;
  font-weight: 500;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--card-bg);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}
.sub-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--info-bg); }

/* ===== 搜索页 ===== */
.section-title {
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-light);
}
.search-box {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.search-box input {
  flex: 1;
  height: 48px;
  padding: 0 16px;
  font-size: 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  min-width: 0;
  transition: border-color 0.2s;
  background: var(--card-bg);
}
.search-box input:focus { border-color: var(--primary); }
.search-box button {
  height: 48px;
  padding: 0 22px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}
.search-box button:hover { background: var(--primary-light); }

/* 药品快捷列表 */
.quick-meds { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.quick-med {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 16px;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-secondary);
}
.quick-med:hover { border-color: var(--primary); color: var(--primary); background: var(--info-bg); }

/* ===== 药品解读结果 ===== */
.drug-result { margin-top: 16px; }
.drug-card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 12px;
  border: 1px solid var(--border-light);
}
.drug-card h3 {
  font-size: 1.25rem;
  color: var(--text);
  margin-bottom: 4px;
  font-weight: 600;
}
.drug-card .drug-type {
  display: inline-block;
  background: var(--info-bg);
  color: var(--primary);
  padding: 3px 12px;
  border-radius: var(--radius);
  font-size: 0.8rem;
  margin-bottom: 12px;
  border: 1px solid var(--info-border);
}

/* 解读分块 */
.info-block {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  border: 1px solid var(--border-light);
}
.info-block h4 {
  font-size: 1rem;
  color: var(--primary);
  margin-bottom: 6px;
  font-weight: 600;
}
.info-block p, .info-block li {
  font-size: 0.95rem;
  line-height: 1.7;
  color: var(--text-secondary);
}
.info-block ul { padding-left: 20px; }
.info-block li { margin-bottom: 3px; }

/* 高亮色块 */
.highlight-warn {
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 6px;
}
.highlight-warn strong { color: var(--warn); }
.highlight-ok {
  background: var(--ok-bg);
  border: 1px solid var(--ok-border);
  border-radius: var(--radius);
  padding: 10px 14px;
  margin-top: 6px;
}

/* 操作按钮 */
.action-btns {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.btn-speak {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-speak:hover { background: var(--primary-light); }
.btn-speak.speaking { background: var(--warn); }
.btn-fav {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  background: var(--card-bg);
  color: var(--primary);
  border: 1px solid var(--primary);
  border-radius: var(--radius);
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-fav:hover { background: var(--info-bg); }
.btn-fav.saved { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }

/* ===== 常用药页 ===== */
.fav-list { display: flex; flex-direction: column; gap: 10px; }
.fav-item {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid var(--border-light);
}
.fav-item:hover { border-color: var(--primary); }
.fav-item .fav-name { font-size: 1.05rem; font-weight: 600; color: var(--text); }
.fav-item .fav-type { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
.fav-item .fav-arrow { font-size: 1.2rem; color: var(--border); }
.fav-remove {
  background: var(--card-bg);
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 12px;
  font-size: 0.8rem;
  cursor: pointer;
  margin-right: 8px;
  transition: all 0.15s;
}
.fav-remove:hover { color: var(--warn); border-color: var(--warn); }

/* ===== 服药提醒页 ===== */
.reminder-form {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 16px;
  border: 1px solid var(--border-light);
}
.form-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.form-row label {
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text);
  min-width: 80px;
}
.form-row input, .form-row select {
  flex: 1;
  height: 44px;
  padding: 0 12px;
  font-size: 0.95rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  min-width: 0;
  background: var(--card-bg);
}
.form-row input:focus, .form-row select:focus { border-color: var(--primary); }
.btn-add-reminder {
  width: 100%;
  height: 50px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 1.05rem;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 1px;
  transition: background 0.15s;
  margin-top: 6px;
}
.btn-add-reminder:hover { background: var(--primary-light); }

/* 提醒列表 */
.reminder-list { display: flex; flex-direction: column; gap: 10px; }
.reminder-item {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  border: 1px solid var(--border-light);
}
.reminder-item .rem-info { flex: 1; min-width: 0; }
.reminder-item .rem-drug { font-size: 1.05rem; font-weight: 600; color: var(--text); }
.reminder-item .rem-time { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
.reminder-item .rem-dose {
  font-size: 0.85rem;
  color: var(--ok);
  font-weight: 500;
  margin-top: 2px;
}
.btn-taken {
  height: 42px;
  padding: 0 18px;
  background: var(--ok);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-taken:hover { background: #1e5a2e; }
.btn-taken.done { background: var(--border); color: var(--text-muted); pointer-events: none; }

.btn-del-rem {
  height: 42px;
  width: 42px;
  background: var(--card-bg);
  color: var(--text-muted);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 1rem;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-del-rem:hover { color: var(--warn); border-color: var(--warn); }

/* ===== 提醒弹窗 ===== */
.alert-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 999;
  justify-content: center;
  align-items: center;
}
.alert-overlay.show { display: flex; }
.alert-box {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  border: 1px solid var(--border);
}
.alert-box h3 { font-size: 1.2rem; color: var(--warn); margin-bottom: 12px; font-weight: 600; }
.alert-box .alert-drug { font-size: 1.15rem; font-weight: 600; margin-bottom: 4px; color: var(--text); }
.alert-box .alert-dose { font-size: 1rem; color: var(--text-muted); margin-bottom: 20px; }
.alert-box .alert-actions { display: flex; gap: 10px; }
.alert-box button {
  flex: 1;
  height: 46px;
  font-size: 1rem;
  font-weight: 500;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s;
}
.alert-box .btn-confirm { background: var(--ok); color: #fff; }
.alert-box .btn-confirm:hover { background: #1e5a2e; }
.alert-box .btn-snooze { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.alert-box .btn-snooze:hover { background: var(--border-light); }

/* ===== 空状态 ===== */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}
.empty-state .empty-icon {
  width: 48px;
  height: 48px;
  margin: 0 auto 12px;
  border: 2px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  color: var(--border);
}
.empty-state p { font-size: 1rem; }
.empty-state .empty-hint { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }

/* ===== 底部导航 ===== */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--card-bg);
  border-top: 1px solid var(--border-light);
  justify-content: space-around;
  padding: 6px 0 env(safe-area-inset-bottom, 6px);
  z-index: 90;
}
.bottom-nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 0.7rem;
  cursor: pointer;
  padding: 6px 12px;
}
.bottom-nav button .nav-icon {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
}
.bottom-nav button.active { color: var(--primary); }

/* ===== 页脚 ===== */
.footer-info {
  text-align: center;
  padding: 20px;
  color: var(--text-muted);
  font-size: 0.75rem;
  border-top: 1px solid var(--border-light);
  margin-top: 20px;
}

/* ===== 响应式 ===== */
@media (max-width: 480px) {
  html { font-size: 16px; }
  .header-bar { padding: 16px; }
  .header-bar h1 { font-size: 1.3rem; }
  .main-btn { height: 56px; font-size: 1.1rem; }
  .sub-actions { gap: 10px; }
  .sub-btn { height: 46px; font-size: 0.95rem; }
  .bottom-nav { display: flex; }
  .main-wrap { padding-bottom: 70px; }
}
@media (min-width: 481px) {
  .bottom-nav { display: none; }
}
</style>
</head>
<body>

<!-- ===== 顶部标题栏 ===== -->
<header class="header-bar" id="headerBar">
  <div class="header-actions" id="headerBack">
    <button class="btn-back" onclick="goHome()">返回首页</button>
  </div>
  <h1>用药安全解读系统</h1>
  <div class="subtitle">老年人用药指导与提醒服务</div>
</header>

<!-- ===== 主内容区 ===== -->
<main class="main-wrap" id="mainWrap">

  <!-- 首页 -->
  <div class="page active" id="page-home">
    <div class="home-hero">
      <h2>欢迎使用用药安全解读系统</h2>
      <p>请选择以下功能进行操作</p>
    </div>
    <div class="main-actions">
      <button class="main-btn" onclick="openCamera()">
        <span>拍照识别药品</span>
      </button>
      <button class="main-btn secondary" onclick="openSearch()">
        <span>输入药品名称查询</span>
      </button>
    </div>
    <div class="sub-actions">
      <button class="sub-btn" onclick="openFav()">我的常用药</button>
      <button class="sub-btn" onclick="openReminder()">服药提醒</button>
    </div>
  </div>

  <!-- 药品搜索页 -->
  <div class="page" id="page-search">
    <div class="section-title">药品名称查询</div>
    <div class="search-box">
      <input type="text" id="drugInput" placeholder="请输入药品名称，如：硝苯地平" oninput="filterQuickMeds()">
      <button onclick="searchDrug()">查询</button>
    </div>
    <div class="quick-meds" id="quickMeds">
      <!-- JS渲染 -->
    </div>
    <div class="drug-result" id="drugResult"></div>
  </div>

  <!-- 拍照查药 -->
  <div class="page" id="page-camera">
    <div class="section-title">拍照识别药品</div>
    <div style="background:var(--card-bg);border-radius:var(--radius-lg);padding:30px 20px;text-align:center;border:1px solid var(--border-light);margin-bottom:14px;">
      <div style="width:64px;height:64px;margin:0 auto 16px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--text-muted);">相机</div>
      <p style="font-size:1rem;color:var(--text-secondary);">请将药品包装对准摄像头</p>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-top:8px;">（演示模式：点击下方按钮模拟识别）</p>
    </div>
    <button class="main-btn" style="width:100%;" onclick="simulateCamera()">
      <span>模拟拍照识别</span>
    </button>
    <div class="drug-result" id="cameraResult" style="margin-top:16px;"></div>
  </div>

  <!-- 我的常用药 -->
  <div class="page" id="page-fav">
    <div class="section-title">我的常用药</div>
    <div class="fav-list" id="favList">
      <div class="empty-state">
        <div class="empty-icon">无</div>
        <p>暂无收藏的药品</p>
        <p class="empty-hint">查询药品后点击"收藏"即可添加</p>
      </div>
    </div>
  </div>

  <!-- 服药提醒 -->
  <div class="page" id="page-reminder">
    <div class="section-title">服药提醒设置</div>
    <div class="reminder-form">
      <div class="form-row">
        <label>药品名称</label>
        <input type="text" id="remDrug" placeholder="请输入药品名称">
      </div>
      <div class="form-row">
        <label>服药时间</label>
        <input type="time" id="remTime" value="08:00">
      </div>
      <div class="form-row">
        <label>单次剂量</label>
        <select id="remDose">
          <option value="1片">1片</option>
          <option value="2片">2片</option>
          <option value="半片">半片</option>
          <option value="1粒">1粒</option>
          <option value="2粒">2粒</option>
          <option value="1包">1包</option>
        </select>
      </div>
      <button class="btn-add-reminder" onclick="addReminder()">添加提醒</button>
    </div>
    <div class="section-title" style="margin-top:8px;">已设置提醒</div>
    <div class="reminder-list" id="reminderList">
      <div class="empty-state">
        <div class="empty-icon">无</div>
        <p>暂无服药提醒</p>
      </div>
    </div>
  </div>

</main>

<!-- ===== 底部导航 ===== -->
<nav class="bottom-nav" id="bottomNav">
  <button class="active" onclick="goHome()"><span class="nav-icon">首页</span>首页</button>
  <button onclick="openSearch()"><span class="nav-icon">查询</span>查药</button>
  <button onclick="openFav()"><span class="nav-icon">收藏</span>常用药</button>
  <button onclick="openReminder()"><span class="nav-icon">提醒</span>提醒</button>
</nav>

<!-- ===== 服药提醒弹窗 ===== -->
<div class="alert-overlay" id="alertOverlay">
  <div class="alert-box">
    <h3>服药时间到</h3>
    <div class="alert-drug" id="alertDrug"></div>
    <div class="alert-dose" id="alertDose"></div>
    <div class="alert-actions">
      <button class="btn-snooze" onclick="snoozeAlert()">稍后提醒</button>
      <button class="btn-confirm" onclick="confirmAlert()">已服药</button>
    </div>
  </div>
</div>

var drugNames = Object.keys(drugDB);

/* ==================== 页面路由 ==================== */
var curPage = 'home';

function showPage(name) {
  var pages = document.querySelectorAll('.page');
  for (var i=0; i<pages.length; i++) pages[i].classList.remove('active');
  var p = document.getElementById('page-'+name);
  if (p) p.classList.add('active');
  curPage = name;
  var isHome = (name==='home');
  document.getElementById('headerBack').style.display = isHome ? 'none' : '';
  document.getElementById('bottomNav').style.display = isHome ? '' : 'none';
  var navs = document.querySelectorAll('.bottom-nav button');
  for (var j=0; j<navs.length; j++) navs[j].classList.remove('active');
  var idx = {'home':0, 'search':1, 'fav':2, 'reminder':3, 'camera':1};
  if (navs[idx[name]]) navs[idx[name]].classList.add('active');
  window.scrollTo({top:0, behavior:'auto'});
}

function goHome() {
  stopSpeak();
  showPage('home');
  document.getElementById('drugResult').innerHTML = '';
  document.getElementById('cameraResult').innerHTML = '';
  if (document.getElementById('drugInput')) document.getElementById('drugInput').value = '';
}

/* ==================== 搜索功能 ==================== */
function openSearch() { showPage('search'); renderQuickMeds(); }

function renderQuickMeds(filter) {
  var list = drugNames;
  if (filter) {
    var lf = filter.toLowerCase();
    list = drugNames.filter(function(n){ return n.toLowerCase().indexOf(lf)>=0; });
  }
  var html = '';
  for (var i=0; i<list.length; i++) {
    html += '<span class="quick-med" onclick="quickQuery(\''+list[i]+'\')">'+list[i]+'</span>';
  }
  document.getElementById('quickMeds').innerHTML = html;
}

function filterQuickMeds() {
  var val = document.getElementById('drugInput').value.trim();
  renderQuickMeds(val);
}

function quickQuery(name) {
  document.getElementById('drugInput').value = name;
  searchDrug();
}

function searchDrug() {
  stopSpeak();
  var input = document.getElementById('drugInput').value.trim();
  if (!input) { document.getElementById('drugResult').innerHTML = ''; return; }
  var found = null;
  for (var i=0; i<drugNames.length; i++) {
    if (drugNames[i].toLowerCase().indexOf(input.toLowerCase()) >= 0 ||
        input.toLowerCase().indexOf(drugNames[i].toLowerCase()) >= 0) {
      found = drugNames[i];
      break;
    }
  }
  if (!found) {
    document.getElementById('drugResult').innerHTML =
      '<div class="empty-state"><div class="empty-icon">查</div><p>未找到"<strong>'+escHtml(input)+'</strong>"的相关信息</p><p class="empty-hint">可尝试输入：硝苯地平、二甲双胍、布洛芬、阿司匹林、奥美拉唑</p></div>';
    return;
  }
  renderDrugResult(found, 'drugResult');
}

function renderDrugResult(drugKey, containerId) {
  var d = drugDB[drugKey];
  var isFav = isFavorited(drugKey);
  document.getElementById(containerId).innerHTML =
    '<div class="drug-card">'
    + '<h3>'+escHtml(d.name)+'</h3>'
    + '<span class="drug-type">'+escHtml(d.type)+'</span>'

    + '<div class="info-block">'
    + '<h4>用法用量</h4>'
    + '<p>'+escHtml(d.usage)+'</p>'
    + '</div>'

    + '<div class="info-block">'
    + '<h4>饮食禁忌</h4>'
    + '<p>'+escHtml(d.diet)+'</p>'
    + '<div class="highlight-warn"><strong>重要提示：</strong>请严格遵医嘱，以上为通用建议，具体情况请咨询医生或药师。</div>'
    + '</div>'

    + '<div class="info-block">'
    + '<h4>常见不良反应</h4>'
    + '<p>'+escHtml(d.sideEffects)+'</p>'
    + '</div>'

    + '<div class="info-block">'
    + '<h4>注意事项</h4>'
    + '<p>'+escHtml(d.warnings)+'</p>'
    + '</div>'

    + '<div class="action-btns">'
    + '<button class="btn-speak" id="btnSpeak" onclick="startSpeak(\''+drugKey+'\')">语音播报</button>'
    + '<button class="btn-fav'+(isFav?' saved':'')+'" id="btnFav" onclick="toggleFav(\''+drugKey+'\', this)">'+(isFav?'已收藏':'收藏')+'</button>'
    + '</div>'
    + '</div>';
}

/* ==================== 拍照识别 ==================== */
function openCamera() { showPage('camera'); }

function simulateCamera() {
  stopSpeak();
  var idx = Math.floor(Math.random() * drugNames.length);
  var found = drugNames[idx];
  document.getElementById('cameraResult').innerHTML =
    '<div class="highlight-ok" style="margin-bottom:12px;">'
    + '<strong>识别成功</strong> — 检测到药品：'+escHtml(found)
    + '</div>';
  renderDrugResult(found, 'cameraResult');
}

/* ==================== 语音播报 ==================== */
var speechSynth = window.speechSynthesis;
var speaking = false;

function startSpeak(drugKey) {
  if (speaking) { stopSpeak(); return; }
  var d = drugDB[drugKey];
  var text = d.name + '。' + d.type + '。用法用量：' + d.usage + '饮食禁忌：' + d.diet + '常见不良反应：' + d.sideEffects + '注意事项：' + d.warnings;
  var btn = document.getElementById('btnSpeak');
  if (btn) { btn.textContent = '停止播报'; btn.classList.add('speaking'); }
  var utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  utter.rate = 0.85;
  utter.pitch = 1;
  utter.onend = function() {
    speaking = false;
    if (btn) { btn.textContent = '语音播报'; btn.classList.remove('speaking'); }
  };
  utter.onerror = function() {
    speaking = false;
    if (btn) { btn.textContent = '语音播报'; btn.classList.remove('speaking'); }
  };
  speaking = true;
  speechSynth.speak(utter);
}

function stopSpeak() {
  speechSynth.cancel();
  speaking = false;
  var btn = document.getElementById('btnSpeak');
  if (btn) { btn.textContent = '语音播报'; btn.classList.remove('speaking'); }
}

/* ==================== 常用药收藏 ==================== */
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('medFavorites') || '[]'); }
  catch(e) { return []; }
}

function saveFavorites(arr) {
  try { localStorage.setItem('medFavorites', JSON.stringify(arr)); }
  catch(e) {}
}

function isFavorited(key) {
  var favs = getFavorites();
  return favs.indexOf(key) >= 0;
}

function toggleFav(key, btn) {
  var favs = getFavorites();
  var idx = favs.indexOf(key);
  if (idx >= 0) {
    favs.splice(idx, 1);
    saveFavorites(favs);
    if (btn) { btn.textContent = '收藏'; btn.classList.remove('saved'); }
  } else {
    favs.push(key);
    saveFavorites(favs);
    if (btn) { btn.textContent = '已收藏'; btn.classList.add('saved'); }
  }
}

function openFav() {
  showPage('fav');
  renderFavorites();
}

function renderFavorites() {
  var favs = getFavorites();
  var list = document.getElementById('favList');
  if (favs.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">无</div><p>暂无收藏的药品</p><p class="empty-hint">查询药品后点击"收藏"即可添加</p></div>';
    return;
  }
  var html = '';
  for (var i=0; i<favs.length; i++) {
    var d = drugDB[favs[i]];
    if (!d) continue;
    html += '<div class="fav-item">'
          + '<div style="flex:1;min-width:0;" onclick="openSearch();document.getElementById(\'drugInput\').value=\''+favs[i]+'\';searchDrug();">'
          + '<div class="fav-name">'+escHtml(d.name)+'</div>'
          + '<div class="fav-type">'+escHtml(d.type)+'</div>'
          + '</div>'
          + '<button class="fav-remove" onclick="event.stopPropagation();removeFav(\''+favs[i]+'\')">移除</button>'
          + '<span class="fav-arrow">&rsaquo;</span>'
          + '</div>';
  }
  list.innerHTML = html;
}

function removeFav(key) {
  var favs = getFavorites();
  var idx = favs.indexOf(key);
  if (idx >= 0) { favs.splice(idx, 1); saveFavorites(favs); }
  renderFavorites();
}

/* ==================== 服药提醒 ==================== */
function openReminder() {
  showPage('reminder');
  renderReminders();
}

function getReminders() {
  try { return JSON.parse(localStorage.getItem('medReminders') || '[]'); }
  catch(e) { return []; }
}

function saveReminders(arr) {
  try { localStorage.setItem('medReminders', JSON.stringify(arr)); }
  catch(e) {}
  renderReminders();
}

function addReminder() {
  var drug = document.getElementById('remDrug').value.trim();
  var time = document.getElementById('remTime').value;
  var dose = document.getElementById('remDose').value;
  if (!drug) { alert('请输入药品名称'); return; }
  if (!time) { alert('请选择服药时间'); return; }
  var reminders = getReminders();
  reminders.push({
    id: Date.now(),
    drug: drug,
    time: time,
    dose: dose,
    taken: false,
    alerted: false,
  });
  reminders.sort(function(a,b){ return a.time.localeCompare(b.time); });
  saveReminders(reminders);
  document.getElementById('remDrug').value = '';
  document.getElementById('remTime').value = '08:00';
}

function renderReminders() {
  var reminders = getReminders();
  var list = document.getElementById('reminderList');
  if (reminders.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">无</div><p>暂无服药提醒</p></div>';
    return;
  }
  var html = '';
  for (var i=0; i<reminders.length; i++) {
    var r = reminders[i];
    html += '<div class="reminder-item">'
          + '<div class="rem-info">'
          + '<div class="rem-drug">'+escHtml(r.drug)+'</div>'
          + '<div class="rem-time">'+r.time+'</div>'
          + '<div class="rem-dose">每次'+escHtml(r.dose)+'</div>'
          + '</div>'
          + (r.taken
            ? '<button class="btn-taken done">已服</button>'
            : '<button class="btn-taken" onclick="markTaken('+r.id+')">已服药</button>')
          + '<button class="btn-del-rem" onclick="delReminder('+r.id+')">删</button>'
          + '</div>';
  }
  list.innerHTML = html;
}

function markTaken(id) {
  var reminders = getReminders();
  for (var i=0; i<reminders.length; i++) {
    if (reminders[i].id === id) { reminders[i].taken = true; break; }
  }
  saveReminders(reminders);
}

function delReminder(id) {
  var reminders = getReminders();
  reminders = reminders.filter(function(r){ return r.id !== id; });
  saveReminders(reminders);
}

/* ==================== 定时提醒 ==================== */
var alertTimer = null;
var alertReminderId = null;

function startReminderChecker() {
  alertTimer = setInterval(checkReminders, 60000);
  setTimeout(checkReminders, 1000);
}

function checkReminders() {
  var now = new Date();
  var hh = String(now.getHours()).padStart(2,'0');
  var mm = String(now.getMinutes()).padStart(2,'0');
  var curTime = hh+':'+mm;
  var reminders = getReminders();
  for (var i=0; i<reminders.length; i++) {
    var r = reminders[i];
    if (!r.taken && !r.alerted && r.time === curTime) {
      showAlert(r);
      r.alerted = true;
      saveReminders(reminders);
      break;
    }
  }
  if (hh==='00' && mm==='00') resetAlertedFlags();
}

function resetAlertedFlags() {
  var reminders = getReminders();
  var changed = false;
  for (var i=0; i<reminders.length; i++) {
    if (reminders[i].alerted) { reminders[i].alerted = false; changed = true; }
    if (reminders[i].taken) { reminders[i].taken = false; changed = true; }
  }
  if (changed) saveReminders(reminders);
}

function showAlert(reminder) {
  alertReminderId = reminder.id;
  document.getElementById('alertDrug').textContent = reminder.drug;
  document.getElementById('alertDose').textContent = '每次 ' + reminder.dose + ' · ' + reminder.time;
  document.getElementById('alertOverlay').classList.add('show');
  try {
    var audio = document.getElementById('alertSound');
    audio.currentTime = 0;
    audio.play().catch(function(){});
  } catch(e) {}
}

function snoozeAlert() {
  document.getElementById('alertOverlay').classList.remove('show');
  alertReminderId = null;
  setTimeout(function(){
    var reminders = getReminders();
    for (var i=0; i<reminders.length; i++) {
      if (reminders[i].id === alertReminderId) {
        reminders[i].alerted = false;
        saveReminders(reminders);
        break;
      }
    }
  }, 300000);
}

function confirmAlert() {
  document.getElementById('alertOverlay').classList.remove('show');
  if (alertReminderId) {
    markTaken(alertReminderId);
    alertReminderId = null;
  }
  try {
    var audio = document.getElementById('alertSound');
    audio.pause();
    audio.currentTime = 0;
  } catch(e) {}
}

/* ==================== 工具函数 ==================== */
function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ==================== 初始化 ==================== */
document.addEventListener('DOMContentLoaded', function(){
  renderQuickMeds();
  showPage('home');
  startReminderChecker();
});

document.addEventListener('keydown', function(e){
  if (e.key==='Enter' && document.activeElement===document.getElementById('drugInput')) {
    searchDrug();
  }
});

window.addEventListener('beforeunload', function(){
  stopSpeak();
});
</script>
