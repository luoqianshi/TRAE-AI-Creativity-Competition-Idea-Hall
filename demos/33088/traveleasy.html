<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅简 TravelEasy - 一站式智能旅游规划助手</title>
<style>
:root {
  --primary:#FF6B35; --primary-dark:#E55A2B; --primary-light:#FFF0EB;
  --bg:#F5F5F5; --card-bg:#FFF; --text:#1A1A1A;
  --text-secondary:#666; --text-muted:#999; --border:#EEE;
  --success:#2ECC71; --warning:#F39C12; --danger:#E74C3C; --info:#3498DB;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.06);
  --shadow-md:0 4px 16px rgba(0,0,0,0.1);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#F0F0F0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}
.phone-frame{width:420px;max-width:100vw;height:90vh;max-height:900px;background:var(--bg);border-radius:28px;box-shadow:var(--shadow-lg),0 0 0 8px #1a1a1a,0 0 0 10px #333;display:flex;flex-direction:column;overflow:hidden;position:relative}
.status-bar{background:#FFF;padding:12px 20px 8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text);font-weight:600;border-bottom:1px solid var(--border);flex-shrink:0}
.main-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.main-scroll::-webkit-scrollbar{display:none}
.tab-page{display:none;padding-bottom:20px}
.tab-page.active{display:block}
/* 头部 */
.app-header{background:linear-gradient(135deg,#FF6B35,#FF8E53);padding:24px 20px 28px;color:#FFF;text-align:center}
.food-page-header{background:linear-gradient(135deg,#E74C3C,#F39C12);padding:28px 20px 24px;color:#FFF;text-align:center}
.trip-page-header{background:linear-gradient(135deg,#2980B9,#3498DB);padding:28px 20px 24px;color:#FFF;text-align:center}
.my-trip-header{background:linear-gradient(135deg,#27AE60,#2ECC71);padding:28px 20px 24px;color:#FFF;text-align:center}
.app-header h2,.food-page-header h2,.trip-page-header h2,.my-trip-header h2{font-size:22px;font-weight:800}
.app-header p,.food-page-header p,.trip-page-header p,.my-trip-header p{font-size:13px;opacity:0.85;margin-top:4px}
.app-logo{font-size:28px;font-weight:800;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:10px}
.logo-icon{width:42px;height:42px;background:rgba(255,255,255,0.25);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.app-slogan{font-size:13px;opacity:0.85;margin-top:4px}
.search-section{margin:-14px 16px 0;position:relative;z-index:10}
.search-card{background:#FFF;border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-md)}
.search-row{display:flex;gap:8px}
.search-input{width:100%;height:44px;border:2px solid var(--border);border-radius:var(--radius-md);padding:0 12px 0 36px;font-size:15px;color:var(--text);outline:none;background:#FAFAFA;transition:border-color 0.2s}
.search-input:focus{border-color:var(--primary);background:#FFF}
.search-input-wrap{flex:1;position:relative}
.search-input-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-muted)}
.date-input{height:44px;border:2px solid var(--border);border-radius:var(--radius-md);padding:0 10px;font-size:14px;color:var(--text);outline:none;background:#FAFAFA;cursor:pointer;min-width:115px}
.btn-search{height:44px;padding:0 20px;background:var(--primary);color:#FFF;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;font-family:inherit}
.btn-search:active{transform:scale(0.96)}
.quick-tags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.quick-tag{padding:6px 14px;border-radius:20px;font-size:12px;background:var(--primary-light);color:var(--primary);cursor:pointer;border:none;font-weight:500;white-space:nowrap;font-family:inherit}
.loading-section{display:none;text-align:center;padding:32px 20px}
.loading-section.active{display:block}
.loading-step{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#FFF;border-radius:var(--radius-md);font-size:14px;color:var(--text-secondary);box-shadow:var(--shadow-sm);margin-bottom:8px}
.loading-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);animation:pulse 1s infinite}
.loading-dot.done{background:var(--success);animation:none}
.loading-dot.wait{background:#DDD;animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
.result-summary{display:flex;gap:10px;padding:0 16px;margin:20px 0 16px}
.summary-card{flex:1;background:#FFF;border-radius:var(--radius-md);padding:14px 12px;text-align:center;box-shadow:var(--shadow-sm)}
.summary-card .num{font-size:26px;font-weight:700;color:var(--primary)}
.summary-card .label{font-size:11px;color:var(--text-muted);margin-top:2px}
.section-title{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin:20px 0 12px}
.section-title h3{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.section-title .badge{font-size:11px;background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:12px;font-weight:500}
.section-title .tip{font-size:12px;color:var(--text-muted)}
.info-card{background:#FFF;border-radius:var(--radius-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-sm);transition:all 0.2s;cursor:pointer;border:1px solid transparent}
.info-card:hover{box-shadow:var(--shadow-md);border-color:var(--primary-light)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.card-title-row{display:flex;align-items:center;gap:8px}
.card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.card-icon.scenic{background:#E8F8F5}
.card-icon.food{background:#FFF5EE}
.card-icon.transport{background:#EBF5FB}
.card-name{font-size:16px;font-weight:700;color:var(--text)}
.card-rating{display:flex;align-items:center;gap:4px;background:#FFF9E6;padding:4px 10px;border-radius:16px;font-size:13px;font-weight:600;color:#E67E22;white-space:nowrap}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500;white-space:nowrap}
.tag-price{background:#FDEBD0;color:#E67E22}
.tag-time{background:#D5F5E3;color:#27AE60}
.tag-status{background:#D6EAF8;color:#2980B9}
.tag-green{background:#D5F5E3;color:#27AE60}
.card-desc{font-size:13px;color:var(--text-secondary);line-height:1.6;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);flex-wrap:wrap;gap:6px}
.card-footer .info-item{display:flex;align-items:center;gap:4px}
.transport-tip{margin-top:8px;font-size:12px;padding:6px 10px;border-radius:8px}
.plan-card{background:#FFF;border-radius:var(--radius-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-sm);border:2px solid transparent}
.plan-card.recommend{border-color:var(--primary);position:relative}
.plan-card.recommend::before{content:"推荐方案";position:absolute;top:-1px;right:16px;background:var(--primary);color:#FFF;font-size:10px;padding:3px 10px;border-radius:0 0 8px 8px;font-weight:600}
.plan-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.plan-name{font-size:16px;font-weight:700;color:var(--text)}
.plan-theme{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500}
.theme-leisure{background:#E8F8F5;color:#1ABC9C}
.theme-intense{background:#FDEDEC;color:#E74C3C}
.theme-culture{background:#F5EEF8;color:#8E44AD}
.timeline{position:relative;padding-left:24px;margin-top:12px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:#EEE}
.timeline-item{position:relative;margin-bottom:14px;font-size:13px}
.timeline-item::before{content:"";position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:#FFF;border:2px solid var(--primary)}
.timeline-item.done::before{background:var(--primary)}
.timeline-time{font-weight:600;color:var(--primary);font-size:12px;margin-bottom:2px}
.timeline-activity{color:var(--text);font-weight:500}
.timeline-note{color:var(--text-muted);font-size:11px}
.plan-stats{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
.plan-stats span{display:flex;align-items:center;gap:4px}
.btn-select-plan{width:100%;height:38px;margin-top:12px;border-radius:var(--radius-md);border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-select-plan.primary{background:var(--primary);color:#FFF}
.btn-select-plan.outline{background:#FFF;color:var(--primary);border:2px solid var(--primary)}
.bottom-nav{display:flex;background:#FFF;border-top:1px solid var(--border);padding:8px 16px 20px;gap:4px;flex-shrink:0}
.nav-item{flex:1;text-align:center;cursor:pointer;padding:6px 0;border-radius:var(--radius-sm);border:none;background:transparent;font-family:inherit;min-width:0}
.nav-item .nav-icon{font-size:18px;margin-bottom:2px}
.nav-item .nav-label{font-size:10px;color:var(--text-muted);font-weight:500}
.nav-item.active .nav-label{color:var(--primary);font-weight:600}
.toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#FFF;padding:10px 20px;border-radius:20px;font-size:13px;z-index:200;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap}
.toast.show{opacity:1}
.modal-overlay{display:none;position:absolute;inset:0;background:rgba(0,0,0,0.55);z-index:150;justify-content:center;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal-sheet{background:#FFF;width:100%;border-radius:20px 20px 0 0;max-height:70vh;overflow-y:auto;padding:24px 20px 32px;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:40px;height:4px;background:#DDD;border-radius:2px;margin:0 auto 16px}
.modal-scenic-name{font-size:20px;font-weight:800;margin-bottom:4px}
.modal-scenic-meta{font-size:13px;color:var(--text-muted);margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap}
.modal-desc{font-size:14px;color:var(--text-secondary);line-height:1.7;margin-bottom:16px}
.modal-section-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.modal-nearby-item{display:flex;gap:12px;padding:12px;background:#F9F9F9;border-radius:var(--radius-md);margin-bottom:8px;align-items:center}
.modal-nearby-item .food-icon{font-size:28px;flex-shrink:0}
.modal-nearby-item .food-info{flex:1}
.modal-nearby-item .food-name{font-size:15px;font-weight:600;color:var(--text)}
.modal-nearby-item .food-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.modal-nearby-item .food-distance{font-size:12px;color:var(--primary);font-weight:600;white-space:nowrap}
.btn-add-trip{width:100%;height:48px;border-radius:var(--radius-md);background:var(--success);color:#FFF;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-add-trip:active{background:#27AE60;transform:scale(0.96)}
.btn-add-trip.done{background:#CCC;pointer-events:none}
.modal-close-btn{width:100%;height:44px;border-radius:var(--radius-md);background:#F0F0F0;border:none;font-size:15px;font-weight:600;color:var(--text-secondary);cursor:pointer;margin-top:8px;font-family:inherit}
.food-filter-bar{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.food-filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:8px 16px;border-radius:20px;font-size:13px;border:1.5px solid var(--border);background:#FFF;cursor:pointer;font-weight:500;white-space:nowrap;font-family:inherit}
.filter-chip.active{background:var(--primary);color:#FFF;border-color:var(--primary)}
.food-card-extended{background:#FFF;border-radius:var(--radius-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-sm);display:flex;gap:14px;cursor:pointer}
.food-card-extended .food-img{width:70px;height:70px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0}
.food-card-extended .food-content{flex:1;min-width:0}
.food-card-extended .food-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.food-card-extended .food-subtitle{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.food-card-extended .food-keywords{font-size:11px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.food-card-extended .food-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.platform-tag{font-size:10px;background:#F0F0F0;color:#888;padding:2px 8px;border-radius:10px}
/* 出行方案 */
.trip-search-row{display:flex;gap:8px;padding:16px 16px 0}
.trip-search-row input{flex:1;height:42px;border:2px solid var(--border);border-radius:var(--radius-md);padding:0 12px;font-size:14px;outline:none;background:#FAFAFA}
.trip-search-row input:focus{border-color:var(--info)}
.trip-search-row button{height:42px;padding:0 18px;background:var(--info);color:#FFF;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.multi-dest-row{display:flex;gap:6px;padding:12px 16px 0;flex-wrap:wrap;align-items:center}
.multi-dest-row input{flex:1;min-width:70px;height:36px;border:2px solid var(--border);border-radius:var(--radius-md);padding:0 10px;font-size:13px;outline:none;background:#FAFAFA}
.multi-dest-row button{height:36px;padding:0 12px;border-radius:var(--radius-md);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;border:none;white-space:nowrap}
.btn-add-dest{background:var(--success);color:#FFF}
.btn-remove-dest{background:#FDEDEC;color:#E74C3C}
.transport-tabs{display:flex;gap:4px;padding:16px 16px 0}
.transport-tab{flex:1;padding:10px 0;text-align:center;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;border:none;background:#FFF;color:var(--text-secondary);font-family:inherit}
.transport-tab.active{background:var(--info);color:#FFF}
.ticket-card{background:#FFF;border-radius:var(--radius-lg);padding:16px;margin:12px 16px;box-shadow:var(--shadow-sm)}
.ticket-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.ticket-type-badge{font-size:13px;font-weight:700;color:var(--info)}
.ticket-company{font-size:12px;color:var(--text-muted)}
.ticket-route{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ticket-station{text-align:center}
.ticket-station .time{font-size:22px;font-weight:700;color:var(--text)}
.ticket-station .station{font-size:12px;color:var(--text-muted);margin-top:2px}
.ticket-line{flex:1;height:2px;background:#E0E0E0;position:relative;text-align:center}
.ticket-line .duration{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-muted);white-space:nowrap}
.ticket-line::after{content:"→";position:absolute;right:-8px;top:50%;transform:translateY(-50%);color:#BBB}
.ticket-details{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ticket-price{font-size:20px;font-weight:700;color:#E74C3C}
.ticket-price small{font-size:12px;color:var(--text-muted);font-weight:400}
.ticket-remain{font-size:12px;padding:4px 10px;border-radius:12px;font-weight:600}
.ticket-remain.plenty{background:#D5F5E3;color:#27AE60}
.ticket-remain.few{background:#FDEBD0;color:#E67E22}
.ticket-remain.none{background:#FDEDEC;color:#E74C3C}
.btn-book{padding:8px 18px;background:var(--info);color:#FFF;border:none;border-radius:var(--radius-md);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
/* 推荐组合方案 */
.combo-card{position:relative;background:linear-gradient(135deg,#EBF5FB,#E8F8F5);border-radius:var(--radius-lg);padding:16px;margin:12px 16px;border:2px solid var(--info);box-shadow:var(--shadow-sm)}
.combo-card.best{border-color:#27AE60;background:linear-gradient(135deg,#E8F8F5,#F0FFF4)}
.combo-card.best::before{content:"🌟 最优组合";position:absolute;top:-1px;right:16px;background:#27AE60;color:#FFF;font-size:10px;padding:3px 10px;border-radius:0 0 8px 8px;font-weight:600;z-index:1}
.combo-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.combo-title{font-size:15px;font-weight:700;color:var(--text)}
.combo-total{font-size:14px;font-weight:700;color:var(--info)}
.combo-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.combo-step{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#FFF;border-radius:10px;font-size:12px}
.combo-step .step-num{width:22px;height:22px;border-radius:50%;background:var(--info);color:#FFF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.combo-step .step-info{flex:1}
.combo-step .step-mode{color:var(--info);font-weight:600}
.combo-step .step-price{color:#E74C3C;font-weight:600;white-space:nowrap}
.combo-meta{display:flex;gap:12px;font-size:11px;color:var(--text-muted);padding-top:8px;border-top:1px solid #DDD}
.hotel-card{background:#FFF;border-radius:var(--radius-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-sm);display:flex;gap:12px}
.hotel-icon{font-size:36px;flex-shrink:0;width:60px;height:60px;background:#F0F8FF;border-radius:12px;display:flex;align-items:center;justify-content:center}
.hotel-content{flex:1}
.hotel-name{font-size:15px;font-weight:700;color:var(--text)}
.hotel-area{font-size:12px;color:var(--text-muted);margin-top:2px}
.hotel-meta{display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
/* 我的行程 */
.saved-item{background:#FFF;border-radius:var(--radius-lg);padding:14px;margin:0 16px 10px;box-shadow:var(--shadow-sm);display:flex;gap:10px;align-items:center}
.saved-item .saved-icon{font-size:28px;flex-shrink:0}
.saved-item .saved-info{flex:1;min-width:0}
.saved-item .saved-name{font-size:14px;font-weight:700;color:var(--text)}
.saved-item .saved-city{font-size:11px;color:var(--primary);margin-top:2px}
.saved-item .saved-time{font-size:11px;color:var(--text-muted)}
.saved-item .btn-remove{background:#FDEDEC;border:none;color:#E74C3C;font-size:11px;padding:4px 10px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:600}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-state .empty-icon{font-size:50px;margin-bottom:12px}
.empty-state .empty-text{font-size:14px;margin-bottom:6px}
.empty-state .empty-hint{font-size:12px}
.btn-generate{width:calc(100% - 32px);height:46px;margin:16px 16px 0;border-radius:var(--radius-md);background:var(--success);color:#FFF;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-generate:active{background:#27AE60;transform:scale(0.96)}
.btn-generate:disabled{background:#CCC;pointer-events:none}
.full-plan-card{background:#FFF;border-radius:var(--radius-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-md);border:2px solid var(--success)}
.full-plan-card .fp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.full-plan-card .fp-title{font-size:16px;font-weight:700;color:var(--success)}
.full-plan-card .fp-date{font-size:12px;color:var(--text-muted)}
.full-plan-card .fp-day-title{font-size:14px;font-weight:700;color:var(--text);margin:14px 0 8px;padding:4px 10px;background:#F0F8FF;border-radius:8px;display:inline-block}
.full-plan-card .fp-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #EEE;align-items:flex-start}
.full-plan-card .fp-item:last-child{border-bottom:none}
.full-plan-card .fp-item-time{font-size:11px;color:var(--info);font-weight:600;min-width:55px}
.full-plan-card .fp-item-act{flex:1;font-size:13px;color:var(--text)}
.full-plan-card .fp-item-note{font-size:11px;color:var(--text-muted)}
.full-plan-card .fp-transport{background:#EBF5FB;padding:6px 10px;border-radius:8px;font-size:11px;color:var(--info);margin:4px 0;display:flex;align-items:center;gap:6px}
/* 天气卡片 */
.weather-card{background:linear-gradient(135deg,#EBF5FB,#D6EAF8);border-radius:var(--radius-lg);padding:16px;margin:0 16px 12px;box-shadow:var(--shadow-sm);border:1px solid #AED6F1}
.weather-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.weather-city{font-size:15px;font-weight:700;color:var(--text)}
.weather-date{font-size:11px;color:var(--text-muted)}
.weather-now{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.weather-now .w-icon{font-size:40px}
.weather-now .w-info{flex:1}
.weather-now .w-temp{font-size:28px;font-weight:800;color:var(--text)}
.weather-now .w-desc{font-size:13px;color:var(--text-secondary);margin-top:2px}
.weather-forecast{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 0}
.weather-forecast::-webkit-scrollbar{display:none}
.w-day{min-width:60px;text-align:center;padding:8px 6px;background:rgba(255,255,255,0.7);border-radius:10px;flex-shrink:0}
.w-day .w-d-icon{font-size:22px}
.w-day .w-d-name{font-size:10px;color:var(--text-muted);margin-top:2px}
.w-day .w-d-temp{font-size:11px;font-weight:600;color:var(--text);margin-top:2px}
.w-day .w-d-hilo{font-size:9px;color:var(--text-muted)}
.w-impact{background:#FFF9E6;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12px;display:flex;align-items:flex-start;gap:8px}
.w-impact .w-impact-icon{font-size:16px;flex-shrink:0}
.w-impact .w-impact-text{color:#E67E22;line-height:1.5}
.w-impact.good{background:#F0FFF4}.w-impact.good .w-impact-text{color:#27AE60}
.w-impact.warn{background:#FFF5F5}.w-impact.warn .w-impact-text{color:#E74C3C}
/* 方案中的天气标注 */
.weather-note{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:4px;font-weight:500}
.weather-note.sunny{background:#FFF9E6;color:#E67E22}
.weather-note.rain{background:#EBF5FB;color:#2980B9}
.weather-note.good{background:#E8F8F5;color:#27AE60}
@media(max-width:440px){.phone-frame{border-radius:0;height:100vh;max-height:none;box-shadow:none}body{padding:0}}
</style>

<body>

      <button class="btn-generate" id="btnGenerateFull" onclick="generateFullPlan()" disabled>请先在首页添加至少1个景点到行程</button>

<script>
// ==================== 工具 ====================
function showToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove("show")},2000)}
function scrollTo(el){if(el)document.getElementById("mainScroll").scrollTo({top:el.offsetTop-60,behavior:"smooth"})}
function getStars(r){var s="";var f=Math.floor(r);var h=r-f>=0.5;for(var i=0;i<5;i++){if(i<f)s+="⭐";else if(i===f&&h)s+="✨";else s+="☆"}return s}
function switchPage(page,el){
  var pages=document.querySelectorAll(".tab-page");for(var i=0;i<pages.length;i++)pages[i].classList.remove("active");
  document.getElementById("page"+(page.charAt(0).toUpperCase()+page.slice(1))).classList.add("active");
  var navs=document.querySelectorAll(".nav-item");for(var j=0;j<navs.length;j++)navs[j].classList.remove("active");
  el.classList.add("active");document.getElementById("mainScroll").scrollTop=0;
  if(page==="profile"){renderSavedItems();updateGenerateBtn()}
  if(page==="trip"&&document.getElementById("ticketList").innerHTML==="")renderTickets();
}

// ==================== 我的行程 - 数据 ====================
var savedScenics=[];
var generatedFullPlans=[];
var _currentModalScenic=null;

function addToMyTrip(){
  if(!_currentModalScenic)return;
  var s=_currentModalScenic;
  for(var i=0;i<savedScenics.length;i++){if(savedScenics[i].id===s.id){showToast("该景点已在行程中");document.getElementById("btnAddTrip").classList.add("done");document.getElementById("btnAddTrip").textContent="✅ 已在行程中";return}}
  var now=new Date();
  savedScenics.push({id:s.id,name:s.name,city:s._city||"",rating:s.rating,price:s.price,time:s.time,type:s.type,desc:s.desc,addedAt:now.toLocaleString()});
  showToast("✅ 「"+s.name+"」已加入行程");
  document.getElementById("btnAddTrip").classList.add("done");
  document.getElementById("btnAddTrip").textContent="✅ 已在行程中";
  updateGenerateBtn();
}

function renderSavedItems(){
  var html="";
  if(savedScenics.length===0){
    html='<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">还没有保存任何景点</div><div class="empty-hint">去首页搜索目的地 → 点击景点卡片 → "加入我的行程"</div></div>';
  }else{
    html+='<div class="section-title"><h3>📍 已保存景点 ('+savedScenics.length+')</h3></div>';
    savedScenics.forEach(function(s,i){
      html+='<div class="saved-item"><div class="saved-icon">🏞️</div><div class="saved-info"><div class="saved-name">'+s.name+'</div><div class="saved-city">'+s.city+' · '+s.type+' · 💰'+s.price+' · ⭐'+s.rating+'</div><div class="saved-time">添加于 '+s.addedAt+'</div></div><button class="btn-remove" onclick="removeScenic('+i+')">移除</button></div>';
    });
  }
  document.getElementById("savedScenics").innerHTML=html;
  var ghtml="";
  if(generatedFullPlans.length>0){
    ghtml+='<div class="section-title" style="margin-top:24px"><h3>🗺️ 已生成的旅游安排</h3></div>';
    generatedFullPlans.forEach(function(p){
      ghtml+='<div class="full-plan-card"><div class="fp-header"><span class="fp-title">✨ '+p.title+'</span><span class="fp-date">'+p.date+'</span></div>';
      if(p.weatherNote)ghtml+='<div class="w-impact" style="margin-bottom:12px"><span class="w-impact-icon">🌤️</span><span class="w-impact-text">'+p.weatherNote+'</span></div>';
      p.days.forEach(function(day){
        ghtml+='<div class="fp-day-title">📅 '+day.label+'</div>';
        day.items.forEach(function(item){
          if(item.isTransport){ghtml+='<div class="fp-transport">🚄 '+item.text+'</div>'}
          else{ghtml+='<div class="fp-item"><div class="fp-item-time">'+item.time+'</div><div class="fp-item-act"><div>'+item.act+'</div><div class="fp-item-note">'+item.note+'</div></div></div>'}
        });
      });
      ghtml+='<div class="plan-stats"><span>📅 '+p.totalDays+'天</span><span>💰 '+p.budget+'</span><span>🌱 '+p.carbon+'</span></div></div>';
    });
  }
  document.getElementById("generatedPlans").innerHTML=ghtml;
}

function removeScenic(idx){savedScenics.splice(idx,1);renderSavedItems();updateGenerateBtn();showToast("已从行程中移除")}

function updateGenerateBtn(){
  var btn=document.getElementById("btnGenerateFull");
  if(savedScenics.length>=2){btn.disabled=false;btn.textContent="✨ 一键生成完整旅游安排（"+savedScenics.length+"个景点）"}
  else if(savedScenics.length===1){btn.disabled=false;btn.textContent="✨ 一键生成完整旅游安排（仅1个景点，将结合推荐方案）"}
  else{btn.disabled=true;btn.textContent="请先在首页添加至少1个景点到行程"}
}

function generateFullPlan(){
  if(savedScenics.length===0){showToast("请先添加景点到行程");return}
  var cities={};
  savedScenics.forEach(function(s){if(s.city&&!cities[s.city])cities[s.city]=[];if(s.city)cities[s.city].push(s)});
  var cityNames=Object.keys(cities);
  var mainCity=cityNames[0]||"未知";
  // 天气因素：获取主要城市的天气
  var w=weatherData[mainCity];
  var weatherNote=w?"（当前"+w.now.temp+"°C "+w.now.desc+" · "+w.impact+"）":"";
  var plan={title:mainCity+"深度游 · 智能行程",date:new Date().toLocaleDateString(),totalDays:Math.max(3,savedScenics.length),budget:"人均"+(savedScenics.length*200+800)+"元",carbon:"低碳约"+(savedScenics.length*8+10)+"kg",days:[],weatherNote:weatherNote};
  var dayIdx=0;
  savedScenics.forEach(function(s,i){
    dayIdx=Math.floor(i/2);
    if(!plan.days[dayIdx])plan.days[dayIdx]={label:"第"+(dayIdx+1)+"天",items:[]};
    // 根据是否为户外景点给天气建议
    var isOutdoor=s.type.indexOf("自然")!==-1||s.name.indexOf("熊猫")!==-1||s.name.indexOf("洱海")!==-1||s.name.indexOf("橘子洲")!==-1||s.name.indexOf("岳麓")!==-1||s.name.indexOf("鼓浪")!==-1;
    var wxSuggestion="";
    if(w&&isOutdoor&&w.now.temp>=34){wxSuggestion=" <span class=\"weather-note sunny\">高温"+w.now.temp+"°C·建议清晨/傍晚</span>"}
    else if(w&&isOutdoor&&w.forecast[1]&&w.forecast[1].desc.indexOf("雨")!==-1){wxSuggestion=" <span class=\"weather-note rain\">明日有雨·建议今天游览</span>"}
    else if(w&&!isOutdoor&&w.now.temp>=34){wxSuggestion=" <span class=\"weather-note sunny\">"+w.now.temp+"°C·室内景点避暑佳选</span>"}
    else if(w&&isOutdoor&&w.now.temp<=28){wxSuggestion=" <span class=\"weather-note good\">"+w.now.temp+"°C·适合户外游玩</span>"}
    plan.days[dayIdx].items.push({time:(dayIdx+1)===1&&i%2===0?"上午":i%2===0?"上午":"下午",act:"游览 "+s.name+wxSuggestion,note:s.type+" · 💰"+s.price+" · ⭐"+s.rating});
    if(i>0&&savedScenics[i].city!==savedScenics[i-1].city){
      plan.days[dayIdx].items.push({isTransport:true,text:"推荐高铁 "+savedScenics[i-1].city+"→"+s.city+" 约2-5小时 · ¥300-800"});
    }
  });
  plan.totalDays=plan.days.length;
  generatedFullPlans.unshift(plan);
  renderSavedItems();
  scrollTo(document.getElementById("generatedPlans"));
  showToast("✨ 已生成完整旅游安排！详情查看下方");
}

function doSearch(){

  var matched=null,matchedKey=null;
  Object.keys(cityData).forEach(function(k){if(k.indexOf(city)!==-1||city.indexOf(k)!==-1){matched=cityData[k];matchedKey=k}});

  var html="";for(var i=0;i<steps.length;i++)html+='<div class="loading-step"><span class="loading-dot wait" id="dot'+(i+1)+'"></span>'+steps[i]+'</div>';

function openScenicModal(scenicId){

  _currentModalScenic=scenic;
  var btn=document.getElementById("btnAddTrip");btn.classList.remove("done");
  var already=false;
  for(var j=0;j<savedScenics.length;j++){if(savedScenics[j].id===scenic.id){already=true;break}}
  if(already){btn.classList.add("done");btn.textContent="✅ 已在行程中"}else{btn.textContent="📌 加入我的行程"}
  var html='<div class="modal-scenic-name">'+scenic.name+'</div><div class="modal-scenic-meta"><span>⭐ '+scenic.rating+'</span><span>💰 '+scenic.price+'</span><span>🕐 '+scenic.time+'</span><span>📍 '+scenic.distance+'</span></div><div class="modal-desc">'+scenic.desc+'</div>';

var currentTransport="train";

function addDest(){
  var row=document.getElementById("multiDestRow");
  var inputs=row.querySelectorAll("input");var count=inputs.length;
  if(count>=5){showToast("最多支持5个目的地");return}
  var arrows=row.querySelectorAll("span");var lastArrow=arrows[arrows.length-1];
  var newInput=document.createElement("input");newInput.type="text";newInput.id="dest"+count;newInput.placeholder="第"+count+"站(可选)";
  var newArrow=document.createElement("span");newArrow.style.cssText="font-size:18px;color:var(--info)";newArrow.textContent="→";
  var addBtn=row.querySelector(".btn-add-dest");
  row.insertBefore(newInput,addBtn);row.insertBefore(newArrow,addBtn);
  // 如果有超过2个input，给第3个之后的加移除按钮
  if(count>=2){
    var rm=document.createElement("button");rm.className="btn-remove-dest";rm.textContent="✕";rm.onclick=function(){this.previousElementSibling&&this.previousElementSibling.remove();this.previousElementSibling&&this.previousElementSibling.remove();this.remove()};
    row.insertBefore(rm,addBtn);
  }
}

function searchTransport(){
  var inputs=document.getElementById("multiDestRow").querySelectorAll("input");var dests=[];
  inputs.forEach(function(inp){if(inp.value.trim())dests.push(inp.value.trim())});
  if(dests.length<2){showToast("请至少输入出发地和1个目的地");return}
  renderComboPlans(dests);renderTickets();

function renderComboPlans(dests){

    for(var j=2;j<dests.length;j++)c2.steps.push({mode:"🚄 高铁",route:dests[j-1]+" → "+dests[j],price:"¥779",time:"约7-8h"});
