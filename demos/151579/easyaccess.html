<!DOCTYPE html>
<!-- 设计系统：银发无忧 EasyAccess · 明黄#FFD400 × 深蓝#0B2A5B 高对比无障碍令牌（见 DESIGN.md） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B2A5B" />
  <title>银发无忧 · AI 语音导诊</title>

  <!-- FontAwesome（图标） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <!-- 圆润字体：Nunito / Quicksand（Latin）→ 中文圆体回退 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#FFD400', press: '#E6BE00', soft: '#FFF3BF' },
            ink:     { DEFAULT: '#0B2A5B', soft: '#3A4A66' },
            surface: { DEFAULT: '#FFFFFF', warm: '#FFF8E1' },
            success: '#0B5E2E',
            warning: '#6B4000',
            danger:  '#8E0010'
          },
          fontFamily: {
            sans: ['Nunito','Quicksand','Baloo 2','Yuanti SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','system-ui','sans-serif']
          },
          fontSize: {
            micro:'1.125rem', sm:'1.25rem', base:'1.5rem', lg:'1.75rem', btn:'2rem',
            h3:'2.25rem', h2:'2.5rem', h1:'3rem', display:'3.75rem', hero:'4.5rem'
          },
          spacing: { 1:'8px', 2:'16px', 3:'24px', 4:'32px', 5:'48px', 6:'64px', 7:'80px', 8:'96px' },
          borderRadius: { sm:'12px', md:'20px', lg:'28px', xl:'36px' },
          transitionDuration: { fast:'200ms', base:'350ms', slow:'500ms' },
          boxShadow: { raised:'0 6px 0 rgba(11,42,91,0.20)', floating:'0 8px 24px rgba(11,42,91,0.35)' }
        }
      }
    };
  </script>

  <style>
    /* ===== 设计令牌（DESIGN.md §2/§3/§5） ===== */
    :root{
      --color-primary:#FFD400; --color-primary-press:#E6BE00; --color-primary-soft:#FFF3BF;
      --color-bg:#0B2A5B; --color-surface:#FFFFFF; --color-surface-warm:#FFF8E1;
      --color-text-on-dark:#FFFFFF; --color-text-on-dark-soft:#FFF8E1;
      --color-text-on-light:#0B2A5B; --color-text-on-light-soft:#3A4A66;
      --color-success:#0B5E2E; --color-warning:#6B4000; --color-danger:#8E0010;
      --color-focus-on-dark:#FFD400; --color-focus-on-light:#0B2A5B;
      --space-1:8px; --space-2:16px; --space-3:24px; --space-4:32px;
      --space-5:48px; --space-6:64px; --space-7:80px; --space-8:96px;
      --radius-sm:12px; --radius-md:20px; --radius-lg:28px; --radius-xl:36px; --radius-full:9999px;
      --text-base:1.5rem; --text-btn:2rem; --text-h1:3rem; --text-hero:4.5rem;
      --motion-fast:200ms; --motion-base:350ms; --motion-slow:500ms;
      --motion-ease:cubic-bezier(0.22,1,0.36,1);
      --font-sans:"Nunito","Quicksand","Baloo 2","Yuanti SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
      --shadow-floating:0 8px 24px rgba(11,42,91,0.35);
      --shadow-overlay:0 12px 32px rgba(11,42,91,0.45);
    }

    *{ box-sizing:border-box; }
    html{ font-size:16px; }                 /* 老年预设基准字号（固定，不随档位缩放） */

    body{
      margin:0;
      font-family:var(--font-sans);
      background:var(--color-bg);
      color:var(--color-text-on-dark);
      font-size:var(--text-base);           /* 正文下限 24px */
      line-height:1.6;
      font-weight:400;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
      overflow-x:hidden;            /* 防止录音脉冲环横向溢出产生滚动 */
    }

    /* 焦点环：深蓝底上用明黄，清晰可达 */
    :focus-visible{ outline:4px solid var(--color-focus-on-dark); outline-offset:5px; }

    .sr-only{
      position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }

    /* 容器：移动端单列，桌面端深蓝信箱留边 */
    .app{
      max-width:480px; margin:0 auto; min-height:100vh;
      padding:var(--space-4) var(--space-4) var(--space-7);
      display:flex; flex-direction:column; gap:var(--space-6);
    }

    /* ===== Header ===== */
    header{ display:flex; flex-direction:column; align-items:center; gap:var(--space-4); text-align:center; }
    .app-title{
      font-size:var(--text-h1); font-weight:800; color:var(--color-primary);
      margin:0; line-height:1.2; letter-spacing:1px;
    }
    .emergency-row{ display:flex; gap:var(--space-2); justify-content:center; flex-wrap:wrap; }

    /* 紧急快捷键：≥88×88px，按钮文字 ≥32px（DESIGN §4.2） */
    .btn-emergency{
      width:min(40vw,140px); height:min(40vw,140px);
      border-radius:var(--radius-lg);
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--space-1);
      font-size:var(--text-btn); font-weight:800; cursor:pointer;
      box-shadow:0 6px 0 rgba(0,0,0,0.28);
      font-family:inherit; line-height:1.1;
      transition:transform var(--motion-fast) var(--motion-ease), background-color var(--motion-fast);
    }
    .btn-emergency .ico{ font-size:32px; line-height:1; }
    .btn-emergency .lbl{ font-size:var(--text-btn); font-weight:800; }   /* 按钮文字 ≥32px */
    .btn-emergency:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.28); }

    /* 紧急（危险红 + 白字 + 白环） */
    .btn-emergency.is-danger{ background:var(--color-danger); color:#FFFFFF; border:4px solid #FFFFFF; }
    .btn-emergency.is-danger:hover{ background:#A3001A; }
    .btn-emergency.is-danger:focus-visible{ outline:4px solid var(--color-focus-on-dark); outline-offset:5px; }

    /* ===== 语音交互区 ===== */
    .voice-area{ display:flex; flex-direction:column; align-items:center; gap:var(--space-4); }

    .mic-wrap{
      position:relative; width:min(70vw,320px); height:min(70vw,320px);
      display:flex; align-items:center; justify-content:center;
    }

    /* 录音脉冲环（纯装饰） */
    .pulse{
      position:absolute; inset:0; border-radius:var(--radius-full);
      border:6px solid var(--color-primary); opacity:0; pointer-events:none; z-index:0;
    }
    .mic-wrap.recording .pulse{ animation:ea-pulse 1.8s var(--motion-ease) infinite; }
    .mic-wrap.recording .pulse:nth-child(2){ animation-delay:.6s; }
    .mic-wrap.recording .pulse:nth-child(3){ animation-delay:1.2s; }
    @keyframes ea-pulse{ 0%{ transform:scale(1); opacity:.55; } 100%{ transform:scale(1.85); opacity:0; } }

    /* 麦克风主按钮：正圆，明黄底深蓝图标 */
    .mic{
      position:relative; z-index:2;
      width:100%; height:100%; border-radius:var(--radius-full);
      background:var(--color-primary); color:var(--color-bg);
      border:6px solid #FFFFFF;
      box-shadow:var(--shadow-overlay);
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      font-family:inherit;
      transition:transform var(--motion-fast) var(--motion-ease), background-color var(--motion-fast);
    }
    .mic .fa-microphone{ font-size:clamp(64px,22vw,96px); color:var(--color-bg); }
    .mic:hover{ background:var(--color-primary-press); }
    .mic:active{ transform:scale(.97); }
    .mic[aria-pressed="true"]{ background:var(--color-primary-press); }

    .mic-hint{
      font-size:var(--text-btn); font-weight:700; color:var(--color-text-on-dark);
      text-align:center; margin:0; max-width:18em;
    }

    /* 模拟输入气泡（语音回显） */
    .bubble{
      max-width:100%;
      background:var(--color-surface); color:var(--color-text-on-light);
      border-radius:var(--radius-lg);
      padding:var(--space-3) var(--space-4);
      font-size:var(--text-lg); font-weight:700; line-height:1.5;
      display:flex; gap:var(--space-2); align-items:flex-start;
      box-shadow:var(--shadow-floating);
      position:relative;
    }
    .bubble .ico{ color:var(--color-bg); font-size:28px; margin-top:4px; flex:none; }
    .bubble[hidden]{ display:none; }
    .bubble::before{                       /* 指向上方麦克风的小尾巴 */
      content:''; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
      border-left:14px solid transparent; border-right:14px solid transparent;
      border-bottom:14px solid var(--color-surface);
    }

    /* ===== 结果卡片 ===== */
    .result[hidden]{ display:none; }
    .result-card{
      background:var(--color-surface-warm); color:var(--color-text-on-light);
      border:3px solid var(--color-bg); border-radius:var(--radius-lg);
      padding:var(--space-5);
      box-shadow:0 8px 24px rgba(11,42,91,0.15);
    }
    /* 紧急度标签：图标 + 颜色 + 文字（三重编码） */
    .dept-tag{
      display:flex; align-items:center; gap:var(--space-2);
      color:var(--color-warning); font-weight:800; font-size:var(--text-h3);
      margin-bottom:var(--space-3);
    }
    .dept-tag .ico{ font-size:32px; }
    .result-card p{ margin:0 0 var(--space-3); font-size:var(--text-lg); line-height:1.5; }
    .result-card .line-dept{ font-size:var(--text-h2); font-weight:800; }
    .result-card .line-dept b{ font-size:var(--text-h2); }
    .result-card .line-floor{ font-size:var(--text-h3); font-weight:800; }
    .result-card .line-notify{ color:var(--color-text-on-light-soft); font-weight:700; }

    /* 极简路线指示 */
    .route{
      margin-top:var(--space-4); padding-top:var(--space-4);
      border-top:2px dashed var(--color-bg);
      display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2);
      font-size:var(--text-base); font-weight:700; color:var(--color-text-on-light);
    }
    .route .step{ display:inline-flex; align-items:center; gap:var(--space-1); }
    .route .step .pin{ color:var(--color-bg); font-size:24px; }
    .route .arrow{ color:var(--color-bg); font-size:24px; }

    /* 重新说一次 */
    .reset{
      margin-top:var(--space-4);
      background:var(--color-primary); color:var(--color-bg);
      border:none; border-radius:var(--radius-lg);
      padding:var(--space-3) var(--space-5);
      font-size:var(--text-btn); font-weight:800; cursor:pointer;
      box-shadow:0 6px 0 rgba(11,42,91,0.20);
      font-family:inherit;
      transition:transform var(--motion-fast) var(--motion-ease), background-color var(--motion-fast);
    }
    .reset:hover{ background:var(--color-primary-press); }
    .reset:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(11,42,91,0.20); }
    .reset:focus-visible{ outline:4px solid var(--color-focus-on-dark); outline-offset:5px; }
    .reset[hidden]{ display:none; }

    /* ===== 紧急通知 Toast（assertive） ===== */
    .toast{
      position:fixed; top:var(--space-4); left:50%; transform:translateX(-50%);
      max-width:calc(100% - 32px);
      background:var(--color-bg); color:#FFFFFF;
      border:3px solid var(--color-primary); border-radius:var(--radius-lg);
      padding:var(--space-3) var(--space-4);
      font-size:var(--text-base); font-weight:700;
      display:flex; gap:var(--space-2); align-items:center;
      box-shadow:var(--shadow-overlay); z-index:400;
    }
    .toast .ico{ color:var(--color-primary); font-size:28px; flex:none; }
    .toast[hidden]{ display:none; }

    /* 淡入（300–500ms） */
    .fade-in{ animation:ea-fade var(--motion-slow) var(--motion-ease) both; }
    @keyframes ea-fade{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

    /* ===== 减弱动效降级（DESIGN.md §9） ===== */
    @media (prefers-reduced-motion: reduce){
      *{ animation:none !important; transition-duration:0.01ms !important; transition-delay:0ms !important; scroll-behavior:auto !important; }
      .pulse{ display:none !important; }   /* 关闭脉冲装饰 */
    }

    /* 横屏适配：麦克风收缩，避免超高溢出 */
    @media (orientation: landscape){
      .mic-wrap{ width:min(40vh,280px); height:min(40vh,280px); }
      .app{ gap:var(--space-4); padding-top:var(--space-3); padding-bottom:var(--space-4); }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- ===== Header ===== -->
    <header>
      <h1 class="app-title">银发无忧 🏥</h1>
      <div class="emergency-row">
        <button id="btnVolume" class="btn-emergency is-danger" type="button"
                aria-label="声音放大/缩小，当前音量：中">
          <i class="ico fa-solid fa-volume" aria-hidden="true"></i>
          <span class="lbl">声音放大/缩小</span>
        </button>
        <button id="btnCall" class="btn-emergency is-danger" type="button"
                aria-label="紧急联系子女">
          <i class="ico fa-solid fa-phone" aria-hidden="true"></i>
          <span class="lbl">联系子女</span>
        </button>
      </div>
    </header>

    <!-- ===== 主体：AI 语音交互区 ===== -->
    <main>
      <section class="voice-area" aria-label="语音导诊">
        <div id="micWrap" class="mic-wrap">
          <span class="pulse" aria-hidden="true"></span>
          <span class="pulse" aria-hidden="true"></span>
          <span class="pulse" aria-hidden="true"></span>
          <button id="btnMic" class="mic" type="button"
                  aria-label="按这里，对我说哪里不舒服"
                  aria-pressed="false">
            <i class="fa-solid fa-microphone" aria-hidden="true"></i>
          </button>
        </div>
        <p class="mic-hint">按这里，对我说哪里不舒服</p>

        <!-- 模拟输入气泡：aria-live polite -->
        <div id="transcript" class="bubble" aria-live="polite" role="status" hidden>
          <i class="ico fa-solid fa-comment-dots" aria-hidden="true"></i>
          <span id="transcriptText">我这几天总觉得膝盖疼，上下楼吃力</span>
        </div>
      </section>

      <!-- ===== 下部结果区（默认隐藏，淡入显示） ===== -->
      <section id="result" class="result" aria-live="polite" role="status" hidden>
        <div class="result-card">
          <div class="dept-tag">
            <i class="ico fa-solid fa-circle-info" aria-hidden="true"></i>
            <span>建议门诊</span>
          </div>
          <p class="line-dept">推荐您挂【<b>骨科</b>】。</p>
          <p class="line-floor">具体位置：门诊楼 2 楼 203 诊室。</p>
          <p class="line-notify">已帮您通知儿子小明，他正在赶来。</p>

          <!-- 极简路线指示：图标+文字，等价说明见 aria-label -->
          <div class="route" aria-label="路线说明：从 1 楼大厅出发，直走，转弯上楼，到达 2 楼 203 诊室">
            <span class="step"><i class="pin fa-solid fa-location-dot" aria-hidden="true"></i>① 1楼大厅</span>
            <i class="arrow fa-solid fa-arrow-right-long" aria-hidden="true"></i>
            <span class="step">直走</span>
            <i class="arrow fa-solid fa-arrow-right-long" aria-hidden="true"></i>
            <span class="step">转弯上楼</span>
            <i class="arrow fa-solid fa-arrow-right-long" aria-hidden="true"></i>
            <span class="step"><i class="pin fa-solid fa-location-dot" aria-hidden="true"></i>② 2楼 203 诊室</span>
          </div>
        </div>

        <button id="btnReset" class="reset" type="button" hidden>重新说一次</button>
      </section>
    </main>
  </div>

  <!-- 紧急通知 Toast：assertive -->
  <div id="toast" class="toast" role="alert" aria-live="assertive" hidden>
    <i class="ico fa-solid fa-circle-check" aria-hidden="true"></i>
    <span id="toastText">已通知儿子小明，他正在赶来</span>
  </div>

  <script>
    (function () {
      'use strict';

      var micWrap   = document.getElementById('micWrap');
      var btnMic    = document.getElementById('btnMic');
      var transcript= document.getElementById('transcript');
      var result    = document.getElementById('result');
      var btnReset  = document.getElementById('btnReset');
      var btnVolume = document.getElementById('btnVolume');
      var btnCall   = document.getElementById('btnCall');
      var toast     = document.getElementById('toast');
      var transcriptText = document.getElementById('transcriptText');
      var resultCardHTML = result.querySelector('.result-card').outerHTML; // 保存模板，揭示时重新注入以触发 aria-live 播报

      var state = 'idle';          // idle → recording → input_shown → result_shown
      var timers = [];

      // 语音音量档位（模拟）：未来接入 speechSynthesis 时赋给 utterance.volume
      var VOLUME_LEVELS = [
        { name: '小', icon: 'fa-volume-low', value: 0.4 },
        { name: '中', icon: 'fa-volume',      value: 0.7 },
        { name: '大', icon: 'fa-volume-high', value: 1.0 }
      ];
      var volumeIndex = 1;                 // 默认"中"
      var voiceVolume = VOLUME_LEVELS[volumeIndex].value;

      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 减弱动效时关闭波形/淡入，并直接显示结果（不再长时间等待）
      var INPUT_DELAY  = prefersReduced ? 300 : 3000;   // 录音 3 秒（减弱动效下 0.3 秒）
      var RESULT_DELAY = prefersReduced ? 300 : 1200;   // 输入后短暂间隔再出结果

      function clearTimers() {
        timers.forEach(function (t) { clearTimeout(t); });
        timers = [];
      }

      // 复位到 idle（隐藏气泡与结果，清除计时器）
      function resetAll() {
        clearTimers();
        state = 'idle';
        micWrap.classList.remove('recording');
        btnMic.setAttribute('aria-pressed', 'false');
        transcript.hidden = true;
        result.hidden = true;
        btnReset.hidden = true;
      }

      // 整条演示链路（仅麦克风触发）
      function startDemo() {
        if (state === 'recording') return;   // 防止重复触发
        resetAll();

        state = 'recording';
        micWrap.classList.add('recording');
        btnMic.setAttribute('aria-pressed', 'true');

        timers.push(setTimeout(function () {
          // 显示模拟输入（重设文本以触发 aria-live 播报）
          transcriptText.textContent = '我这几天总觉得膝盖疼，上下楼吃力';
          transcript.hidden = false;
          transcript.classList.add('fade-in');
          state = 'input_shown';

          timers.push(setTimeout(function () {
            // 重新注入结果卡片 → 触发所在 aria-live 区播报，随后淡入
            var card = result.querySelector('.result-card');
            if (card) { card.outerHTML = resultCardHTML; }
            result.hidden = false;
            result.classList.add('fade-in');
            btnReset.hidden = false;
            micWrap.classList.remove('recording');
            btnMic.setAttribute('aria-pressed', 'false');
            state = 'result_shown';
          }, RESULT_DELAY));
        }, INPUT_DELAY));
      }

      // 声音放大/缩小：循环切换 3 档（小 → 中 → 大 → 小），控制语音输出音量（当前为模拟）
      function applyVolume(idx) {
        volumeIndex = idx;
        var lvl = VOLUME_LEVELS[idx];
        voiceVolume = lvl.value;            // 模拟接线：未来接入 speechSynthesis 时赋给 utterance.volume
        var ico = btnVolume.querySelector('.ico');
        ico.className = 'ico fa-solid ' + lvl.icon;
        btnVolume.setAttribute('aria-label', '声音放大/缩小，当前音量：' + lvl.name);
      }
      function cycleVolume() {
        applyVolume((volumeIndex + 1) % VOLUME_LEVELS.length);
      }

      // 联系子女（独立功能，模拟通知；Toast 为 role=alert 自动播报）
      function notifySon() {
        var toastText = document.getElementById('toastText');
        toastText.textContent = '已通知儿子小明，他正在赶来';
        toast.hidden = false;
        // 数秒后自动收起提示（非必须，仅提升体验）
        clearTimeout(notifySon._t);
        notifySon._t = setTimeout(function () { toast.hidden = true; }, 6000);
      }

      btnMic.addEventListener('click', startDemo);
      btnReset.addEventListener('click', resetAll);
      btnVolume.addEventListener('click', cycleVolume);
      btnCall.addEventListener('click', notifySon);

      // 键盘可达性：按钮均为原生 <button>，天然支持 Enter/Space
    })();
  </script>
</body>
</html>
