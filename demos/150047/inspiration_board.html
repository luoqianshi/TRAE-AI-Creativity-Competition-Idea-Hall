<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灵感速记板 - 会"生长"的碎片化知识卡片</title>
    <style>
        :root {
            --bg: #faf8f5;
            --card-bg: #ffffff;
            --text: #2c2c2c;
            --text-secondary: #6b6b6b;
            --accent: #5b7fff;
            --accent-light: #eef1ff;
            --accent-warm: #ff7b5b;
            --green: #3cb878;
            --yellow: #f5b83d;
            --purple: #8b5cf6;
            --border: #eae6df;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.1);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 20px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #5b7fff, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            flex-shrink: 0;
        }
        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .logo-sub {
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 400;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 9px 18px;
            border-radius: 24px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            letter-spacing: 0.01em;
            font-family: inherit;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(91, 127, 255, 0.35);
        }
        .btn-primary:hover {
            background: #4a6ef0;
            box-shadow: 0 4px 16px rgba(91, 127, 255, 0.45);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: #fff;
            color: var(--accent);
            border: 1.5px solid var(--border);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.8rem;
            border-radius: 20px;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 120px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }
        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .stat-icon.blue {
            background: #eef1ff;
            color: #5b7fff;
        }
        .stat-icon.green {
            background: #e8f8f0;
            color: #3cb878;
        }
        .stat-icon.orange {
            background: #fff4e8;
            color: #f5b83d;
        }
        .stat-icon.purple {
            background: #f3efff;
            color: #8b5cf6;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        /* Main layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: var(--transition);
        }
        .panel:hover {
            box-shadow: var(--shadow-md);
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .panel-title {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-badge {
            font-size: 0.7rem;
            background: var(--accent-light);
            color: var(--accent);
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 500;
        }

        /* Input area */
        .quick-input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-field {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1.5px solid var(--border);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            background: #fafaf8;
            font-family: inherit;
        }
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(91, 127, 255, 0.1);
            background: #fff;
        }
        .type-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .type-tag {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: #fff;
            transition: var(--transition);
            font-weight: 500;
            user-select: none;
            font-family: inherit;
        }
        .type-tag.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }
        .type-tag:hover {
            border-color: var(--accent);
            background: #f9faff;
        }

        /* Cards */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
            scroll-behavior: smooth;
        }
        .card-list::-webkit-scrollbar {
            width: 4px;
        }
        .card-list::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 4px;
        }
        .idea-card {
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: #fefefe;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            animation: cardIn 0.35s ease-out;
        }
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .idea-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        .idea-card .card-tag {
            display: inline-block;
            font-size: 0.68rem;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.02em;
            width: fit-content;
        }
        .tag-灵感 {
            background: #fef3e8;
            color: #e8943a;
        }
        .tag-待办 {
            background: #e8f0fe;
            color: #4a7de0;
        }
        .tag-摘录 {
            background: #e8f8f0;
            color: #3cb878;
        }
        .tag-问题 {
            background: #f3efff;
            color: #8b5cf6;
        }
        .card-time {
            font-size: 0.7rem;
            color: #aaa;
        }
        .card-content {
            font-size: 0.88rem;
            line-height: 1.5;
            color: #3a3a3a;
        }

        /* Knowledge map */
        .map-area {
            position: relative;
            min-height: 260px;
            background: #fdfcfa;
            border-radius: var(--radius);
            border: 1.5px dashed var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            padding: 20px;
            transition: var(--transition);
        }
        .map-node {
            background: #fff;
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            box-shadow: var(--shadow-sm);
            border: 1.5px solid var(--border);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            position: relative;
            z-index: 1;
            letter-spacing: 0.01em;
        }
        .map-node:hover {
            box-shadow: var(--shadow-lg);
            transform: scale(1.04);
            border-color: var(--accent);
            z-index: 2;
        }
        .map-node.root {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-size: 0.9rem;
            padding: 14px 20px;
            border-radius: 24px;
            box-shadow: 0 4px 16px rgba(91, 127, 255, 0.3);
        }
        .map-line {
            position: absolute;
            pointer-events: none;
            opacity: 0.5;
        }
        .connector-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            position: absolute;
            z-index: 0;
            opacity: 0.6;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2c2c;
            color: #fff;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 100;
            animation: toastIn 0.4s ease-out, toastOut 0.4s 2s ease-out forwards;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toastOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            color: #c0c0c0;
            padding: 40px 20px;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .empty-state .icon-large {
            font-size: 3rem;
            opacity: 0.5;
        }

        /* Footer note */
        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #bbb;
            padding: 8px;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">💡</div>
                <div>
                    <div class="logo-text">灵感速记板</div>
                    <div class="logo-sub">碎片想法 · AI 自动生长为知识体系</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline btn-sm" onclick="triggerAISort()" title="AI 自动整理所有卡片">🤖 AI 整理</button>
                <button class="btn btn-outline btn-sm" onclick="showMap()">🗺️ 知识地图</button>
                <button class="btn btn-primary btn-sm" onclick="exportAll()">📤 导出</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon blue">📝</div>
                <div>
                    <div class="stat-value" id="totalCount">6</div>
                    <div class="stat-label">灵感卡片</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">🔗</div>
                <div>
                    <div class="stat-value" id="linkCount">3</div>
                    <div class="stat-label">AI 关联</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">📂</div>
                <div>
                    <div class="stat-value" id="catCount">3</div>
                    <div class="stat-label">主题分类</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">🧠</div>
                <div>
                    <div class="stat-value" id="growthScore">72</div>
                    <div class="stat-label">知识生长指数</div>
                </div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Left: Input + Card List -->
            <div class="panel" id="leftPanel">
                <div class="panel-header">
                    <span class="panel-title">✍️ 快速捕获灵感</span>
                    <span class="panel-badge">Auto 模式</span>
                </div>
                <div class="quick-input-area">
                    <div class="input-row">
                        <input type="text" class="input-field" id="ideaInput" placeholder="输入一闪而过的想法、摘录或待办..." onkeydown="if(event.key==='Enter')addIdea()">
                        <button class="btn btn-primary" onclick="addIdea()" style="flex-shrink:0;">记录</button>
                    </div>
                    <div class="type-tags" id="typeTags">
                        <span class="type-tag active" data-type="灵感">💭 灵感</span>
                        <span class="type-tag" data-type="待办">✅ 待办</span>
                        <span class="type-tag" data-type="摘录">📖 摘录</span>
                        <span class="type-tag" data-type="问题">❓ 问题</span>
                    </div>
                </div>
                <div class="card-list" id="cardList">
                    <!-- Cards rendered by JS -->
                </div>
            </div>

            <!-- Right: Knowledge Map -->
            <div class="panel" id="rightPanel">
                <div class="panel-header">
                    <span class="panel-title">🗺️ 知识地图 · AI 自动聚类</span>
                    <button class="btn btn-outline btn-sm" onclick="refreshMap()">🔄 刷新视图</button>
                </div>
                <div class="map-area" id="mapArea">
                    <!-- Map rendered by JS -->
                </div>
                <div style="font-size:0.75rem;color:#999;text-align:center;">
                    💡 点击节点可高亮关联卡片 | AI 自动识别碎片间的深层联系
                </div>
            </div>
        </div>

        <div class="footer-note">
            🏗️ 本页面由 <strong>TRAE Work</strong> 生成 · 创意产物展示 · 灵感速记板 v1.0 原型
        </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <script>
        // --- Data Store ---
        const defaultIdeas = [{
            id: 1,
            type: '灵感',
            content: '用 AI 把碎片笔记自动聚类成主题地图，像拼图一样自动拼合知识',
            time: '2 分钟前',
            cluster: 'AI工具'
        }, {
            id: 2,
            type: '摘录',
            content: '「写作不是从空白页开始，而是从碎片笔记中涌现结构」—— 卡片笔记法',
            time: '18 分钟前',
            cluster: '知识管理'
        }, {
            id: 3,
            type: '待办',
            content: '调研 Notion、Obsidian、Roam Research 的知识图谱实现方式',
            time: '1 小时前',
            cluster: '知识管理'
        }, {
            id: 4,
            type: '问题',
            content: '为什么大多数灵感记录工具都无法让人持续使用超过一周？',
            time: '2 小时前',
            cluster: '产品思考'
        }, {
            id: 5,
            type: '灵感',
            content: '加一个「生长指数」—— 可视化展示碎片知识逐渐形成体系的过程',
            time: '3 小时前',
            cluster: 'AI工具'
        }, {
            id: 6,
            type: '摘录',
            content: '「The best tool is the one that disappears and lets you think.」',
            time: '5 小时前',
            cluster: '产品思考'
        }];

        let ideas = [...defaultIdeas];
        let nextId = 7;
        let selectedType = '灵感';

        // Clusters definition
        const clusterColors = {
            'AI工具': '#5b7fff',
            '知识管理': '#3cb878',
            '产品思考': '#f5b83d',
            '未分类': '#aaa'
        };

        // --- Init ---
        function init() {
            // Type tag listeners
            document.querySelectorAll('#typeTags .type-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    document.querySelectorAll('#typeTags .type-tag').forEach(t => t.classList
                        .remove('active'));
                    this.classList.add('active');
                    selectedType = this.dataset.type;
                    document.getElementById('ideaInput').focus();
                });
            });
            renderCards();
            renderMap();
            updateStats();
        }

        // --- Add Idea ---
        function addIdea() {
            const input = document.getElementById('ideaInput');
            const content = input.value.trim();
            if (!content) {
                showToast('✏️ 请输入灵感内容再记录哦');
                input.focus();
                return;
            }
            // Auto-detect cluster
            const cluster = detectCluster(content);
            const newIdea = {
                id: nextId++,
                type: selectedType,
                content: content,
                time: '刚刚',
                cluster: cluster
            };
            ideas.unshift(newIdea);
            input.value = '';
            renderCards();
            renderMap();
            updateStats();
            showToast('✅ 灵感已捕获！AI 自动归类至「' + cluster + '」');
            // Highlight the new card briefly
            setTimeout(() => {
                const firstCard = document.querySelector('.idea-card');
                if (firstCard) {
                    firstCard.style.borderColor = 'var(--accent)';
                    firstCard.style.boxShadow = '0 0 0 4px rgba(91,127,255,0.2)';
                    setTimeout(() => {
                        firstCard.style.borderColor = 'var(--border)';
                        firstCard.style.boxShadow = 'var(--shadow-sm)';
                    }, 800);
                }
            }, 100);
        }

        function detectCluster(content) {
            const lower = content.toLowerCase();
            if (lower.includes('ai') || lower.includes('自动') || lower.includes('聚类') || lower.includes('生成') || lower
                .includes('工具') || lower.includes('算法')) {
                return 'AI工具';
            }
            if (lower.includes('笔记') || lower.includes('知识') || lower.includes('卡片') || lower.includes('整理') || lower
                .includes('管理') || lower.includes('obsidian') || lower.includes('notion')) {
                return '知识管理';
            }
            if (lower.includes('产品') || lower.includes('用户') || lower.includes('体验') || lower.includes('设计') || lower
                .includes('工具') || lower.includes('持续')) {
                return '产品思考';
            }
            return '未分类';
        }

        // --- Render Cards ---
        function renderCards() {
            const container = document.getElementById('cardList');
            if (ideas.length === 0) {
                container.innerHTML = `
                <div class="empty-state">
                  <span class="icon-large">📭</span>
                  <span>还没有灵感卡片</span>
                  <span style="font-size:0.75rem;">在上方输入框记录你的第一条灵感吧</span>
                </div>`;
                return;
            }
            container.innerHTML = ideas.map(idea => `
            <div class="idea-card" data-id="${idea.id}" data-cluster="${idea.cluster}" onclick="highlightCluster('${idea.cluster}')">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="card-tag tag-${idea.type}">${idea.type}</span>
                <span class="card-time">${idea.time}</span>
              </div>
              <div class="card-content">${escapeHtml(idea.content)}</div>
              <div style="font-size:0.7rem;color:var(--accent);font-weight:500;">📁 ${idea.cluster}</div>
            </div>
          `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // --- Render Map ---
        function renderMap() {
            const mapArea = document.getElementById('mapArea');
            const clusters = {};
            ideas.forEach(idea => {
                if (!clusters[idea.cluster]) clusters[idea.cluster] = [];
                clusters[idea.cluster].push(idea);
            });
            const clusterNames = Object.keys(clusters);
            if (clusterNames.length === 0) {
                mapArea.innerHTML = `
                <div class="empty-state">
                  <span class="icon-large">🗺️</span>
                  <span>知识地图等待构建</span>
                  <span style="font-size:0.75rem;">记录灵感后 AI 将自动生成知识地图</span>
                </div>`;
                return;
            }
            // Build map with root + cluster nodes
            let html = '<div class="map-node root" onclick="showAllCards()">🧠 我的知识库</div>';
            clusterNames.forEach(name => {
                const color = clusterColors[name] || '#888';
                const count = clusters[name].length;
                html +=
                    `<div class="map-node" style="border-color:${color};color:${color};" data-cluster="${name}" onclick="highlightCluster('${name}')">📁 ${name} <span style="font-size:0.7rem;opacity:0.7;">(${count})</span></div>`;
            });
            mapArea.innerHTML = html;
            // Add connector dots (decorative)
            const dotPositions = [
                { top: '40%', left: '25%' },
                { top: '55%', left: '45%' },
                { top: '35%', left: '60%' },
                { top: '50%', left: '70%' },
            ];
            dotPositions.forEach((pos, i) => {
                if (i < clusterNames.length) {
                    const dot = document.createElement('div');
                    dot.className = 'connector-dot';
                    dot.style.cssText = `top:${pos.top};left:${pos.left};`;
                    mapArea.appendChild(dot);
                }
            });
        }

        // --- Interactions ---
        function highlightCluster(clusterName) {
            const allCards = document.querySelectorAll('.idea-card');
            allCards.forEach(card => {
                if (card.dataset.cluster === clusterName) {
                    card.style.borderColor = 'var(--accent)';
                    card.style.boxShadow = '0 0 0 3px rgba(91,127,255,0.25)';
                    card.style.background = '#fafbff';
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    card.style.borderColor = 'var(--border)';
                    card.style.boxShadow = 'var(--shadow-sm)';
                    card.style.background = '#fefefe';
                    card.style.opacity = '0.55';
                }
            });
            // Reset after 2.5 seconds
            setTimeout(() => {
                allCards.forEach(card => {
                    card.style.borderColor = 'var(--border)';
                    card.style.boxShadow = 'var(--shadow-sm)';
                    card.style.background = '#fefefe';
                    card.style.opacity = '1';
                });
            }, 2500);
            showToast('🔍 已高亮「' + clusterName + '」关联的所有卡片');
        }

        function showAllCards() {
            const allCards = document.querySelectorAll('.idea-card');
            allCards.forEach(card => {
                card.style.borderColor = 'var(--border)';
                card.style.boxShadow = 'var(--shadow-sm)';
                card.style.background = '#fefefe';
                card.style.opacity = '1';
            });
            showToast('📋 显示全部灵感卡片');
        }

        function showMap() {
            document.getElementById('rightPanel').scrollIntoView({ behavior: 'smooth' });
            highlightMapBriefly();
            showToast('🗺️ 知识地图已定位，点击节点查看关联');
        }

        function highlightMapBriefly() {
            const mapArea = document.getElementById('mapArea');
            mapArea.style.borderColor = 'var(--accent)';
            mapArea.style.boxShadow = '0 0 0 6px rgba(91,127,255,0.12)';
            setTimeout(() => {
                mapArea.style.borderColor = 'var(--border)';
                mapArea.style.boxShadow = 'none';
            }, 1500);
        }

        function refreshMap() {
            renderMap();
            highlightMapBriefly();
            showToast('🔄 知识地图已刷新');
        }

        function triggerAISort() {
            // Simulate AI sorting: re-cluster all ideas with smarter detection
            ideas.forEach(idea => {
                idea.cluster = detectCluster(idea.content);
            });
            // Sort by cluster
            ideas.sort((a, b) => a.cluster.localeCompare(b.cluster));
            renderCards();
            renderMap();
            updateStats();
            showToast('🤖 AI 已重新整理所有卡片，优化聚类结果');
        }

        function exportAll() {
            const text = ideas.map(i => `[${i.type}] ${i.content} (分类: ${i.cluster})`).join('\n');
            const blob = new Blob(['灵感速记板 · 导出\n' + new Date().toLocaleString() + '\n\n' + text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '灵感速记板_导出_' + new Date().toISOString().slice(0, 10) + '.txt';
            a.click();
            URL.revokeObjectURL(url);
            showToast('📤 已导出全部灵感卡片');
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = ideas.length;
            const clusters = new Set(ideas.map(i => i.cluster));
            document.getElementById('catCount').textContent = clusters.size;
            document.getElementById('linkCount').textContent = Math.min(ideas.length * 2, 15);
            document.getElementById('growthScore').textContent = Math.min(Math.floor(ideas.length * 12 + clusters.size * 6),
                99);
        }

        // --- Toast ---
        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 2500);
        }

        // --- Init on load ---
        document.addEventListener('DOMContentLoaded', init);

        // --- Keyboard shortcut ---
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                document.getElementById('ideaInput').focus();
                showToast('⌨️ 快捷键 Ctrl+K 聚焦输入框');
            }
        });

        console.log('🌟 灵感速记板 v1.0 原型已就绪');
        console.log('   - 输入灵感并回车记录');
        console.log('   - 点击知识地图节点高亮关联卡片');
        console.log('   - 点击 AI 整理按钮自动聚类');
        console.log('   - Ctrl+K 快速聚焦输入框');
        console.log('   本页面由 TRAE Work 生成 · 用于大赛创意展示');
    </script>
</body>
</html>
