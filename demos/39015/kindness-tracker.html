</style>

<body>
<div class="container">
  <header>
    <h1>善行积分记录</h1>
    <p>记录每一份善意，积累正能量</p>
  </header>

  <div class="score-card">
    <div class="label">当前积分</div>
    <div class="score high" id="scoreDisplay">60</div>
    <div class="max">满分 100</div>
    <div class="progress-bar">
      <div class="fill" id="progressFill" style="width:60%; background:var(--accent)"></div>
    </div>
    <div class="streak" id="streakRow"></div>
    <div class="rank-badge" id="rankBadge">好人等级：初出茅庐</div>
    <div class="hint" id="hintText">距满分还需 40 分，加油！</div>
    <div class="stat-row">
      <div class="stat-item">
        <div class="val" id="totalDays">0</div>
        <div class="lbl">记录天数</div>
      </div>
      <div class="stat-item">
        <div class="val" id="goodCount">0</div>
        <div class="lbl">善行次数</div>
      </div>
      <div class="stat-item">
        <div class="val" id="avgScore">0</div>
        <div class="lbl">日均得分</div>
      </div>
    </div>
  </div>

  <div class="section-title">每日签到</div>
  <button class="checkin-btn" id="checkinBtn">今日签到 +1 分</button>

  <div class="section-title">心情记录</div>
  <div class="mood-row">
    <button class="mood-btn" data-mood="开心" data-points="1" title="开心 +1">😄</button>
    <button class="mood-btn" data-mood="平静" data-points="0.5" title="平静 +0.5">😊</button>
    <button class="mood-btn" data-mood="一般" data-points="0" title="一般 0">😐</button>
    <button class="mood-btn" data-mood="低落" data-points="-0.5" title="低落 -0.5">😔</button>
    <button class="mood-btn" data-mood="难过" data-points="-1" title="难过 -1">😢</button>
  </div>

  <div class="section-title">加分项</div>
  <div class="actions-grid">
    <div class="action-btn positive" data-name="帮助他人" data-points="1.5">
      <div class="icon">🤝</div>
      <div class="name">帮助他人</div>
      <div class="points">+1.5</div>
    </div>
    <div class="action-btn positive" data-name="志愿服务" data-points="2">
      <div class="icon">🙌</div>
      <div class="name">志愿服务</div>
      <div class="points">+2</div>
    </div>
    <div class="action-btn positive" data-name="捐款捐物" data-points="1.5">
      <div class="icon">💝</div>
      <div class="name">捐款捐物</div>
      <div class="points">+1.5</div>
    </div>
    <div class="action-btn positive" data-name="环保行动" data-points="1">
      <div class="icon">🌱</div>
      <div class="name">环保行动</div>
      <div class="points">+1</div>
    </div>
    <div class="action-btn positive" data-name="传播正能量" data-points="1">
      <div class="icon">✨</div>
      <div class="name">传播正能量</div>
      <div class="points">+1</div>
    </div>
    <div class="action-btn positive" data-name="学习进步" data-points="0.5">
      <div class="icon">📚</div>
      <div class="name">学习进步</div>
      <div class="points">+0.5</div>
    </div>
    <div class="action-btn positive" data-name="运动健身" data-points="0.5">
      <div class="icon">🏃</div>
      <div class="name">运动健身</div>
      <div class="points">+0.5</div>
    </div>
    <div class="action-btn positive" data-name="孝敬父母" data-points="2">
      <div class="icon">👨‍👩‍👧</div>
      <div class="name">孝敬父母</div>
      <div class="points">+2</div>
    </div>
    <div class="action-btn positive" data-name="随手公益" data-points="0.5">
      <div class="icon">🎁</div>
      <div class="name">随手公益</div>
      <div class="points">+0.5</div>
    </div>
  </div>

  <div class="section-title">减分项</div>
  <div class="actions-grid">
    <div class="action-btn negative" data-name="说谎欺骗" data-points="-1">
      <div class="icon">🤥</div>
      <div class="name">说谎欺骗</div>
      <div class="points">-1</div>
    </div>
    <div class="action-btn negative" data-name="伤害他人" data-points="-2">
      <div class="icon">💔</div>
      <div class="name">伤害他人</div>
      <div class="points">-2</div>
    </div>
    <div class="action-btn negative" data-name="破坏环境" data-points="-1">
      <div class="icon">🚯</div>
      <div class="name">破坏环境</div>
      <div class="points">-1</div>
    </div>
    <div class="action-btn negative" data-name="浪费资源" data-points="-0.5">
      <div class="icon">🚰</div>
      <div class="name">浪费资源</div>
      <div class="points">-0.5</div>
    </div>
    <div class="action-btn negative" data-name="言语伤人" data-points="-1">
      <div class="icon">💬</div>
      <div class="name">言语伤人</div>
      <div class="points">-1</div>
    </div>
    <div class="action-btn negative" data-name="消极抱怨" data-points="-0.5">
      <div class="icon">😤</div>
      <div class="name">消极抱怨</div>
      <div class="points">-0.5</div>
    </div>
  </div>

  <div class="history-card">
    <h3>记录日志</h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="reset-row">
    <button id="resetBtn">重置积分</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  const MAX_SCORE = 100;
  const INITIAL_SCORE = 60;
  const STORAGE_KEY = 'kindness_tracker_v2';

  function loadData() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      score: INITIAL_SCORE,
      history: [],
      streak: [],
      lastCheckin: null,
      todayMood: null,
      totalDays: 0,
      goodCount: 0,
      startDate: new Date().toLocaleDateString('zh-CN')
    };
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  let data = loadData();

  const scoreDisplay = document.getElementById('scoreDisplay');
  const progressFill = document.getElementById('progressFill');
  const streakRow = document.getElementById('streakRow');
  const rankBadge = document.getElementById('rankBadge');
  const hintText = document.getElementById('hintText');
  const historyList = document.getElementById('historyList');
  const toast = document.getElementById('toast');
  const checkinBtn = document.getElementById('checkinBtn');
  const totalDaysEl = document.getElementById('totalDays');
  const goodCountEl = document.getElementById('goodCount');
  const avgScoreEl = document.getElementById('avgScore');

  function getRank(score) {
    if (score >= 95) return '圣人境界';
    if (score >= 88) return '大德之人';
    if (score >= 80) return '品德高尚';
    if (score >= 72) return '好人一枚';
    if (score >= 65) return '初出茅庐';
    if (score >= 55) return '尚需努力';
    return '浪子回头';
  }

  function fmt(n) {
    return (n % 1 === 0 ? n.toFixed(0) : n.toFixed(1));
  }

  function updateUI() {
    const s = data.score;
    scoreDisplay.textContent = fmt(s);
    scoreDisplay.className = 'score ' + (s >= 80 ? 'high' : s >= 60 ? 'medium' : 'low');
    progressFill.style.width = Math.max(0, Math.min(100, s)) + '%';
    progressFill.style.background = s >= 80 ? 'var(--accent)' : s >= 60 ? 'var(--accent3)' : 'var(--accent2)';
    rankBadge.textContent = '好人等级：' + getRank(s);

    const remaining = MAX_SCORE - s;
    if (remaining <= 0) {
      hintText.textContent = '已达成满分，继续保持！';
    } else {
      hintText.textContent = '距满分还需 ' + fmt(remaining) + ' 分，加油！';
    }

    streakRow.innerHTML = '';
    const days = ['一','二','三','四','五','六','日'];
    for (let i = 0; i < 7; i++) {
      const el = document.createElement('div');
      el.className = 'streak-day' + (data.streak[i] ? ' done' : '');
      el.textContent = days[i];
      streakRow.appendChild(el);
    }

    totalDaysEl.textContent = data.totalDays;
    goodCountEl.textContent = data.goodCount;
    if (data.totalDays > 0) {
      avgScoreEl.textContent = fmt((s - INITIAL_SCORE) / data.totalDays);
    } else {
      avgScoreEl.textContent = '0';
    }

    historyList.innerHTML = '';
    if (data.history.length === 0) {
      historyList.innerHTML = '<div class="history-item"><span class="name" style="color:var(--muted)">暂无记录，开始行动吧！</span></div>';
    } else {
      [...data.history].reverse().slice(0, 30).forEach(function(item) {
        var row = document.createElement('div');
        row.className = 'history-item';
        var pos = item.points >= 0;
        var prefix = item.points > 0 ? '+' : '';
        row.innerHTML = '<div class="info"><span class="name">' + escapeHtml(item.name) + '</span><span class="time">' + item.time + '</span></div><span class="delta ' + (pos ? 'positive' : 'negative') + '">' + prefix + fmt(item.points) + '</span>';
        historyList.appendChild(row);
      });
    }

    var today = new Date().toLocaleDateString('zh-CN');
    if (data.lastCheckin === today) {
      checkinBtn.disabled = true;
      checkinBtn.textContent = '今日已签到 ✓';
    } else {
      checkinBtn.disabled = false;
      checkinBtn.textContent = '今日签到 +1 分';
    }

    document.querySelectorAll('.mood-btn').forEach(function(btn) {
      btn.classList.toggle('selected', data.todayMood === btn.dataset.mood);
    });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 1800);
  }

  function addRecord(name, points) {
    var oldScore = data.score;
    data.score = Math.max(0, Math.min(MAX_SCORE, data.score + points));
    var delta = data.score - oldScore;
    var now = new Date();
    var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

    if (delta !== 0) {
      if (delta > 0) data.goodCount++;
      data.history.push({ name: name, points: delta, time: timeStr });
      saveData(data);
      updateUI();
      var prefix = delta > 0 ? '+' : '';
      showToast(name + ' ' + prefix + fmt(delta));
    }
  }

  checkinBtn.addEventListener('click', function() {
    var today = new Date().toLocaleDateString('zh-CN');
    if (data.lastCheckin === today) return;
    data.lastCheckin = today;
    data.totalDays++;
    var dayIdx = (new Date().getDay() + 6) % 7;
    data.streak[dayIdx] = true;
    addRecord('每日签到', 1);
  });

  document.querySelectorAll('.mood-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var mood = btn.dataset.mood;
      var points = parseFloat(btn.dataset.points);
      if (data.todayMood === mood) return;
      if (data.todayMood) {
        var prevBtn = document.querySelector('.mood-btn[data-mood="' + data.todayMood + '"]');
        var prevPoints = prevBtn ? parseFloat(prevBtn.dataset.points) : 0;
        data.score = Math.max(0, Math.min(MAX_SCORE, data.score - prevPoints));
      }
      data.todayMood = mood;
      addRecord('心情：' + mood, points);
    });
  });

  document.querySelectorAll('.action-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var name = btn.dataset.name;
      var points = parseFloat(btn.dataset.points);
      addRecord(name, points);
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (confirm('确定要重置所有积分和记录吗？')) {
      data = { score: INITIAL_SCORE, history: [], streak: [], lastCheckin: null, todayMood: null, totalDays: 0, goodCount: 0, startDate: new Date().toLocaleDateString('zh-CN') };
      saveData(data);
      updateUI();
      showToast('已重置');
    }
  });

  updateUI();
})();
</script>
</body>
</html>
