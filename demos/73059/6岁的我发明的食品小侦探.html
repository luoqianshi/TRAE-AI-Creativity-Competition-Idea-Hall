<div id="home-page" class="page active home-page">

      <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">
    </div>
  </div>
  <div class="action-buttons">

  </div>
  <div class="voice-hint" id="voice-hint">🎤 试试说："开始""再扫一次""回家"</div>
</div>

<div id="result-page" class="page result-page">

  <div class="result-card" id="result-card">
    <div class="result-emoji" id="result-emoji">😊</div>

    <button class="btn-rescan" onclick="showPage('home-page')">🔄 再扫一次</button>
  </div>
</div>

<div id="favorites-page" class="page favorites-page">

    <button class="back-btn" onclick="showPage('home-page')">← 返回</button>
    <h1>❤️ 我的收藏</h1>
  </header>
  <div class="empty-hint" id="favorites-empty" style="display:none;">还没有收藏哦，快去扫描吧！</div>
  <div class="favorite-list" id="favorite-list"></div>
</div>

<div id="database-page" class="page database-page">

    <h1>📖 添加剂百科</h1>
  </header>
  <div class="category-tabs">

    <button class="yellow" onclick="showCategory('yellow')">🟡 少吃点</button>
    <button class="red" onclick="showCategory('red')">🔴 科技狠活</button>
  </div>

</div>

<div id="scanning-overlay" class="scanning-overlay" style="display:none;">

  <div class="scan-progress">

    { name: "花椒", harm: "调味料，适量就行", emoji: "🌶️" },
    { name: "八角", harm: "调味料，适量就行", emoji: "⭐" },
    { name: "桂皮", harm: "调味料，适量就行", emoji: "🪵" },
    { name: "香叶", harm: "调味料，适量就行", emoji: "🍃" },
  ]
};

function createConfetti() {
  const container = document.getElementById('confetti-container');
  const colors = ['#FF6B6B', '#FFE66D', '#4ECDC4', '#FF9F43', '#A55EEA'];
  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 2 + 's';
    container.appendChild(piece);
  }
  setTimeout(() => {
    container.innerHTML = '';
  }, 3000);
}

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  if (pageId === 'home-page') {
    currentImage = null;
    document.getElementById('camera-preview').innerHTML = '<span class="placeholder">📸 拍一张配料表的照片<br>或上传一张照片</span>';
    document.getElementById('btn-scan').style.display = 'none';
  }
}

function takePhoto() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      const video = document.createElement('video');
      video.srcObject = stream;
      video.autoplay = true;
      video.style.width = '100%';
      video.style.height = '100%';
      
      const preview = document.getElementById('camera-preview');
      preview.innerHTML = '';
      preview.appendChild(video);
      
      const captureBtn = document.createElement('button');
      captureBtn.textContent = '📷 拍照';
      captureBtn.style.position = 'absolute';
      captureBtn.style.bottom = '20px';
      captureBtn.style.left = '50%';
      captureBtn.style.transform = 'translateX(-50%)';
      captureBtn.style.padding = '10px 30px';
      captureBtn.style.fontSize = '20px';
      captureBtn.style.borderRadius = '50px';
      captureBtn.style.border = 'none';
      captureBtn.style.background = '#FF6B6B';
      captureBtn.style.color = '#FFF';
      captureBtn.style.cursor = 'pointer';
      preview.style.position = 'relative';
      preview.appendChild(captureBtn);
      
      captureBtn.onclick = () => {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        stream.getTracks().forEach(track => track.stop());
        currentImage = canvas.toDataURL('image/jpeg');
        preview.innerHTML = `<img src="${currentImage}" alt="拍摄的照片">`;
        document.getElementById('btn-scan').style.display = 'block';
        speak("拍照成功，点击开始扫描");
      };
    })
    .catch(err => {
      console.error('相机访问失败:', err);
      speak("相机打不开，试试上传照片吧");
    });
}

function handleFileUpload(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      currentImage = e.target.result;
      document.getElementById('camera-preview').innerHTML = `<img src="${currentImage}" alt="上传的照片">`;
      document.getElementById('btn-scan').style.display = 'block';
      speak("照片上传成功，点击开始扫描");
    };
    reader.readAsDataURL(file);
  }
}

async function startScan() {
  if (!currentImage) return;
  
  const overlay = document.getElementById('scanning-overlay');
  const scanImg = document.getElementById('scan-image');
  const progress = document.getElementById('scan-progress');
  
  overlay.style.display = 'flex';
  scanImg.src = currentImage;
  progress.style.width = '0%';
  
  speak("开始扫描，正在识别配料表...");
  
  try {
    progress.style.width = '20%';
    const worker = await Tesseract.createWorker('chi_sim', 1, {
      logger: m => {
        if (m.status === 'recognizing text') {
          progress.style.width = Math.min(90, (m.progress * 100)) + '%';
        }
      }
    });
    
    progress.style.width = '50%';
    const { data: { text } } = await worker.recognize(currentImage);
    await worker.terminate();
    
    progress.style.width = '100%';
    setTimeout(() => {
      overlay.style.display = 'none';
      analyzeText(text);
    }, 500);
    
  } catch (err) {
    console.error('OCR识别失败:', err);
    overlay.style.display = 'none';
    speak("识别失败，请靠近一点拍清楚哦");
    alert("识别失败，请靠近一点拍清楚哦");
  }
}

function analyzeText(text) {
  const redMatches = [];
  const yellowMatches = [];
  const greenMatches = [];
  
  ADDITIVES.red.forEach(additive => {
    if (text.includes(additive.name)) {
      redMatches.push(additive);
    }
  });
  
  ADDITIVES.yellow.forEach(additive => {
    if (text.includes(additive.name)) {
      yellowMatches.push(additive);
    }
  });
  
  ADDITIVES.green.forEach(additive => {
    if (text.includes(additive.name)) {
      greenMatches.push(additive);
    }
  });
  
  let overallLevel = 'green';
  let emoji = '😊';
  let title = '放心吃！';
  let desc = '这个食品很健康，小朋友可以放心吃哦！';
  
  if (redMatches.length > 0) {
    overallLevel = 'red';
    emoji = '😨';
    title = '不能吃！';
    desc = '里面有科技与狠活，小朋友最好别吃！';
  } else if (yellowMatches.length > 0) {
    overallLevel = 'yellow';
    emoji = '😐';
    title = '少吃点！';
    desc = '里面有些配料要注意，偶尔吃一点可以。';
  }
  
  currentResult = {
    level: overallLevel,
    emoji,
    title,
    desc,
    redMatches,
    yellowMatches,
    greenMatches,
    image: currentImage,
    text,
    date: new Date().toLocaleString()
  };
  
  showResult();
}

function showResult() {
  const card = document.getElementById('result-card');
  card.className = `result-card ${currentResult.level}`;
  document.getElementById('result-emoji').textContent = currentResult.emoji;
  document.getElementById('result-title').textContent = currentResult.title;
  document.getElementById('result-desc').textContent = currentResult.desc;
  
  const tagsContainer = document.getElementById('ingredient-tags');
  tagsContainer.innerHTML = '';
  
  currentResult.redMatches.forEach(a => {
    const tag = document.createElement('span');
    tag.className = 'ingredient-tag red';
    tag.textContent = `${a.emoji} ${a.name}`;
    tagsContainer.appendChild(tag);
  });
  
  currentResult.yellowMatches.forEach(a => {
    const tag = document.createElement('span');
    tag.className = 'ingredient-tag yellow';
    tag.textContent = `${a.emoji} ${a.name}`;
    tagsContainer.appendChild(tag);
  });
  
  currentResult.greenMatches.forEach(a => {
    const tag = document.createElement('span');
    tag.className = 'ingredient-tag green';
    tag.textContent = `${a.emoji} ${a.name}`;
    tagsContainer.appendChild(tag);
  });
  
  showPage('result-page');
  speakResult();
}

function speakResult() {
  let speech = `小朋友你好！我帮你看了这个食品的配料表。`;
  
  if (currentResult.redMatches.length > 0) {
    speech += `里面有${currentResult.redMatches.length}种科技狠活，`;
    speech += `${currentResult.redMatches[0].name}${currentResult.redMatches[0].harm}。`;
    speech += `所以这个食品最好别吃哦！`;
  }
  
  if (currentResult.yellowMatches.length > 0) {
    speech += `里面有${currentResult.yellowMatches.length}种要少吃的，`;
    speech += `${currentResult.yellowMatches[0].name}${currentResult.yellowMatches[0].harm}。`;
    speech += `所以这个食品偶尔吃一点可以。`;
  }
  
  if (currentResult.greenMatches.length > 0 && currentResult.redMatches.length === 0 && currentResult.yellowMatches.length === 0) {
    speech += `里面有${currentResult.greenMatches.length}种安全的配料。`;
    speech += `这个食品很健康，小朋友可以放心吃哦！`;
  }
  
  speech += `记住，多吃水果蔬菜，少吃带颜色的零食！`;
  
  speak(speech);
}

function replayResult() {
  speakResult();
}

function saveFavorite() {
  if (!currentResult) return;
  
  const favorites = JSON.parse(localStorage.getItem('foodFavorites') || '[]');
  favorites.unshift(currentResult);
  localStorage.setItem('foodFavorites', JSON.stringify(favorites));
  
  speak("收藏成功！");
  createConfetti();
}

function showFavorites() {
  const favorites = JSON.parse(localStorage.getItem('foodFavorites') || '[]');
  const list = document.getElementById('favorite-list');
  const empty = document.getElementById('favorites-empty');
  
  if (favorites.length === 0) {
    empty.style.display = 'block';
    list.innerHTML = '';
  } else {
    empty.style.display = 'none';
    list.innerHTML = favorites.map((item, index) => `
      <div class="favorite-item">
        <div class="color-bar" style="background: ${item.level === 'green' ? '#4CAF50' : item.level === 'yellow' ? '#FFC107' : '#F44336'}"></div>
        <div class="info">
          <h3>${item.emoji} ${item.title}</h3>
          <p>${item.date}</p>
        </div>
        <button class="play-btn" onclick="playFavorite(${index})">🔊</button>
        <button class="del-btn" onclick="deleteFavorite(${index})">🗑️</button>
      </div>
    `).join('');
  }
}

function playFavorite(index) {
  const favorites = JSON.parse(localStorage.getItem('foodFavorites') || '[]');
  const item = favorites[index];
  if (item) {
    speak(`${item.emoji}${item.title}。${item.desc}`);
  }
}

function deleteFavorite(index) {
  const favorites = JSON.parse(localStorage.getItem('foodFavorites') || '[]');
  favorites.splice(index, 1);
  localStorage.setItem('foodFavorites', JSON.stringify(favorites));
  showFavorites();
}

function showCategory(category) {
  const grid = document.getElementById('additive-grid');
  const items = ADDITIVES[category];
  
  grid.innerHTML = items.map(item => `
    <div class="additive-card ${category}-border" onclick="speak('${item.name}，${item.harm}')">
      <div class="header">
        <span class="name">${item.name}</span>
        <span class="emoji">${item.emoji}</span>
      </div>
      <div class="desc">${item.harm}</div>
    </div>
  `).join('');
}

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.9;
    utterance.pitch = 1.1;
    window.speechSynthesis.speak(utterance);
  }
}

function toggleVoice() {
  const btn = document.getElementById('voice-btn');
  const hint = document.getElementById('voice-hint');
  
  if (voiceEnabled) {
    voiceEnabled = false;
    btn.style.background = 'linear-gradient(180deg, #AB47BC 0%, #7B1FA2 100%)';
    hint.style.display = 'none';
    if (recognition) recognition.stop();
    speak("语音控制已关闭");
  } else {
    voiceEnabled = true;
    btn.style.background = 'linear-gradient(180deg, #FF6B6B 0%, #E53935 100%)';
    hint.style.display = 'block';
    speak("语音控制已开启，请说开始、再扫一次或回家");
    startVoiceRecognition();
  }
}

function startVoiceRecognition() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    speak("你的浏览器不支持语音识别");
    return;
  }
  
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.continuous = true;
  recognition.interimResults = false;
  
  recognition.onresult = (event) => {
    const result = event.results[event.results.length - 1][0].transcript.trim();
    console.log('语音识别结果:', result);
    
    if (result.includes('开始') || result.includes('拍照')) {
      takePhoto();
    } else if (result.includes('再扫一次') || result.includes('重新扫描')) {
      showPage('home-page');
    } else if (result.includes('回家') || result.includes('返回')) {
      showPage('home-page');
    } else if (result.includes('扫描')) {
      if (document.getElementById('btn-scan').style.display !== 'none') {
        startScan();
      }
    } else if (result.includes('收藏')) {
      saveFavorite();
    }
  };
  
  recognition.onerror = () => {
    if (voiceEnabled) {
      setTimeout(startVoiceRecognition, 1000);
    }
  };
  
  recognition.start();
}

document.getElementById('favorites-page').addEventListener('click', () => {
  showFavorites();
});

document.getElementById('database-page').addEventListener('click', () => {
  showCategory('green');
});

showCategory('green');
</script>
