<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID 生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f7f8fa;
    color: #1d2129;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .container {
    width: 100%;
    max-width: 720px;
  }
  h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #86909c; margin-bottom: 28px; }

  .card {
    background: #fff;
    border-radius: 10px;
    padding: 24px 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    margin-bottom: 24px;
  }
  .form-row { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #4e5969;
    margin-bottom: 8px;
  }
  select {
    width: 200px;
    height: 38px;
    padding: 0 12px;
    border: 1px solid #c9cdd4;
    border-radius: 6px;
    font-size: 14px;
    background: #fff;
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: #6f42c1; }

  .checkbox-group {
    display: inline-flex;
    gap: 18px;
    align-items: center;
    vertical-align: middle;
    margin-left: 14px;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    user-select: none;
    font-size: 14px;
    color: #4e5969;
  }
  .checkbox-item input[type="checkbox"] {
    width: 15px; height: 15px;
    accent-color: #6f42c1;
    cursor: pointer;
  }

  .btn-generate {
    background: #6f42c1;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 32px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .btn-generate:hover { background: #5a349e; }
  .btn-generate:active { transform: scale(.97); }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .result-header span { font-size: 13px; color: #4e5969; }
  .btn-copy {
    background: transparent;
    border: 1px solid #c9cdd4;
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 13px;
    color: #4e5969;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-copy:hover { border-color: #6f42c1; color: #6f42c1; }

  .result-list { list-style: none; }
  .result-list li {
    display: flex;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f2f3f5;
    font-size: 14px;
    font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
  }
  .result-list li:last-child { border-bottom: none; }
  .idx {
    width: 36px; flex-shrink: 0;
    font-size: 13px;
    color: #86909c;
  }
  .uuid-text {
    flex: 1;
    word-break: break-all;
    color: #1d2129;
    cursor: pointer;
  }
  .uuid-text:hover { color: #6f42c1; }
</style>
</head>
<body>
<div class="container">
  <h1>UUID 生成器</h1>
  <p class="subtitle">在线 UUID/GUID 批量生成器，支持格式自定义。</p>

  <div class="card">
    <div class="form-row">
      <label>生成数量</label>
      <select id="countSel">
        <option value="1">1 个</option>
        <option value="5">5 个</option>
        <option value="10" selected>10 个</option>
        <option value="20">20 个</option>
        <option value="50">50 个</option>
        <option value="100">100 个</option>
      </select>
      <span class="checkbox-group">
        <label class="checkbox-item"><input type="checkbox" id="chkUpper"> 大写</label>
        <label class="checkbox-item"><input type="checkbox" id="chkNoDash"> 去除连字符</label>
      </span>
    </div>
    <button class="btn-generate" onclick="generate()">生成 UUID</button>
  </div>

  <div class="card">
    <div class="result-header">
      <span id="summary">共 0 个 UUID</span>
      <button class="btn-copy" onclick="copyAll()">一键复制全部</button>
    </div>
    <ul class="result-list" id="resultList"></ul>
  </div>
</div>

<script>
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function format(u) {
  if (document.getElementById('chkUpper').checked) u = u.toUpperCase();
  if (document.getElementById('chkNoDash').checked) u = u.replace(/-/g, '');
  return u;
}

function generate() {
  const n = +document.getElementById('countSel').value;
  const list = document.getElementById('resultList');
  list.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const li = document.createElement('li');
    const formatted = format(uuid());
    li.innerHTML = `<span class="idx">${i + 1}</span><span class="uuid-text" onclick="copyText(this)">${formatted}</span>`;
    list.appendChild(li);
  }
  document.getElementById('summary').textContent = `共 ${n} 个 UUID`;
}

function copyText(el) {
  navigator.clipboard.writeText(el.textContent).then(() => {
    const orig = el.textContent;
    el.textContent = '已复制';
    el.style.color = '#6f42c1';
    setTimeout(() => { el.textContent = orig; el.style.color = ''; }, 800);
  }).catch(() => {});
}

function copyAll() {
  const texts = [...document.querySelectorAll('.uuid-text')].map(el => el.textContent).join('\n');
  navigator.clipboard.writeText(texts).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = '一键复制全部'; }, 1200);
  }).catch(() => {});
}
</script>
</body>
</html>
