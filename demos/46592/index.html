<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日历相册 · 宝贝成长日记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #FDF6F0;
    --bg-warm: #FAF0E6;
    --card: #FFFFFF;
    --card-hover: #FFF8F3;
    --text: #3D2C2C;
    --text-light: #8B7B7B;
    --text-lighter: #B8A8A8;
    --accent: #E8A87C;
    --accent-soft: #F5D5C0;
    --accent-deep: #D4845A;
    --rose: #E8B4B8;
    --rose-soft: #F5DDE0;
    --sage: #C5D5C0;
    --sage-soft: #E5EDE3;
    --lavender: #D5C8E8;
    --lavender-soft: #EDE8F5;
    --gold: #E8D5A0;
    --gold-soft: #F5ECD5;
    --sky: #B8D4E8;
    --sky-soft: #E0EDF5;
    --lunar-color: #9B7BA0;
    --lunar-festival: #D4845A;
    --shadow-sm: 0 1px 3px rgba(61,44,44,0.06);
    --shadow-md: 0 4px 12px rgba(61,44,44,0.08);
    --shadow-lg: 0 8px 30px rgba(61,44,44,0.12);
    --shadow-xl: 0 16px 50px rgba(61,44,44,0.16);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 32px;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.25;
    pointer-events: none;
    z-index: 0;
    animation: blobFloat 20s ease-in-out infinite;
  }
  .bg-blob-1 { width: 400px; height: 400px; background: var(--rose-soft); top: -100px; right: -100px; }
  .bg-blob-2 { width: 350px; height: 350px; background: var(--sage-soft); bottom: -80px; left: -80px; animation-delay: -7s; }
  .bg-blob-3 { width: 300px; height: 300px; background: var(--lavender-soft); top: 40%; left: 50%; animation-delay: -14s; }

  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.05); }
    66% { transform: translate(-20px, 15px) scale(0.95); }
  }

  .app {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 0 28px;
    animation: fadeInDown 0.8s ease-out;
  }

  .header-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--accent-soft), var(--rose-soft));
    border-radius: var(--radius-md);
    margin-bottom: 16px;
    font-size: 28px;
    box-shadow: var(--shadow-sm);
  }

  .header h1 {
    font-family: var(--font-display);
    font-size: 2.8rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .header h1 span {
    background: linear-gradient(135deg, var(--accent-deep), var(--rose));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-subtitle {
    font-size: 0.95rem;
    color: var(--text-light);
    margin-top: 8px;
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  /* Navigation Bar */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
    animation: fadeInDown 0.8s ease-out 0.1s both;
    flex-wrap: wrap;
  }

  .month-nav-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: 1.5px solid var(--accent-soft);
    background: var(--card);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    color: var(--accent-deep);
    font-size: 18px;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }

  .month-nav-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
    transform: scale(1.08);
    box-shadow: var(--shadow-md);
  }

  .month-nav-btn:active { transform: scale(0.95); }

  .nav-center {
    text-align: center;
    min-width: 180px;
  }

  .nav-center .year {
    font-family: var(--font-display);
    font-size: 1rem;
    color: var(--text-light);
    font-weight: 400;
    letter-spacing: 0.1em;
  }

  .nav-center .month {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
  }

  .nav-center .lunar-year {
    font-size: 0.78rem;
    color: var(--lunar-color);
    margin-top: 2px;
    font-weight: 400;
  }

  .nav-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .today-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 14px;
    background: var(--card);
    border: 1.5px solid var(--accent-soft);
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.78rem;
    color: var(--accent-deep);
    font-family: var(--font-body);
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .today-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .today-btn svg { width: 13px; height: 13px; }

  /* View Switcher */
  .view-switcher {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1.5px solid var(--accent-soft);
    border-radius: 24px;
    padding: 3px;
    box-shadow: var(--shadow-sm);
  }

  .view-btn {
    padding: 6px 16px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 500;
    font-family: var(--font-body);
    color: var(--text-light);
    background: transparent;
    transition: all 0.3s ease;
    white-space: nowrap;
  }

  .view-btn.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: white;
    box-shadow: var(--shadow-sm);
  }

  .view-btn:not(.active):hover {
    color: var(--accent-deep);
    background: var(--accent-soft);
  }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 24px;
    animation: fadeInDown 0.8s ease-out 0.2s both;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-light);
  }

  .stat-dot { width: 8px; height: 8px; border-radius: 50%; }
  .stat-dot.photos { background: var(--accent); }
  .stat-dot.days { background: var(--sage); }
  .stat-dot.streak { background: var(--rose); }

  .stat-value { font-weight: 700; color: var(--text); font-size: 1rem; }

  /* Calendar Wrapper */
  .calendar-wrapper {
    animation: fadeInUp 0.8s ease-out 0.3s both;
  }

  /* Weekday Header */
  .weekday-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 8px;
    padding: 0 2px;
  }

  .weekday-header span {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-lighter);
    letter-spacing: 0.1em;
    padding: 8px 0;
  }

  .weekday-header .weekday-lunar {
    font-size: 0.6rem;
    color: var(--lunar-color);
    opacity: 0.6;
    margin-top: 1px;
  }

  /* Calendar Grid - Month View */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    padding: 0 2px;
  }

  /* Day Cell - Month View */
  .day-cell {
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-md);
    background: var(--card);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow-sm);
    opacity: 0;
    animation: cellAppear 0.5s ease-out forwards;
  }

  .day-cell:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent-soft);
  }

  .day-cell.empty {
    background: transparent;
    box-shadow: none;
    cursor: default;
    border: none;
    animation: none;
    opacity: 1;
  }

  .day-cell.empty:hover { transform: none; box-shadow: none; }

  .day-cell.today {
    border-color: var(--accent);
    box-shadow: var(--shadow-md), 0 0 0 3px rgba(232,168,124,0.15);
  }

  .day-cell.has-photos { border-color: var(--accent-soft); }
  .day-cell.has-photos:hover { border-color: var(--accent); }

  .day-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 8px;
  }

  .day-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 3px;
    z-index: 2;
    position: relative;
  }

  .day-number {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-light);
    line-height: 1;
  }

  .day-cell.today .day-number {
    color: var(--accent-deep);
    font-weight: 700;
  }

  .day-lunar {
    font-size: 0.6rem;
    color: var(--lunar-color);
    line-height: 1;
    text-align: right;
    max-width: 50%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .day-lunar.festival {
    color: var(--lunar-festival);
    font-weight: 600;
  }

  .day-lunar.term {
    color: var(--sage);
  }

  .day-photos {
    flex: 1;
    display: grid;
    gap: 3px;
    overflow: hidden;
    border-radius: var(--radius-sm);
    z-index: 1;
    position: relative;
  }

  .day-photos.count-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .day-photos.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
  .day-photos.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .day-photos.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .day-photos.count-many { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

  .day-photo-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 6px;
    transition: transform 0.3s ease;
  }

  .day-cell:hover .day-photo-thumb { transform: scale(1.05); }

  .day-photo-more {
    position: absolute;
    bottom: 4px;
    right: 4px;
    background: rgba(61,44,44,0.75);
    color: white;
    font-size: 0.65rem;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 10px;
    backdrop-filter: blur(4px);
    z-index: 3;
  }

  .day-badge {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    font-size: 0.6rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    box-shadow: 0 2px 6px rgba(232,168,124,0.4);
  }

  .day-cell:not(.empty):not(.has-photos) .day-inner::after {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0.03;
    background-image: radial-gradient(circle, var(--text) 0.5px, transparent 0.5px);
    background-size: 12px 12px;
    border-radius: var(--radius-md);
  }

  /* ─── Week View ─────────────────────────────────────── */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    padding: 0 2px;
  }

  .week-cell {
    border-radius: var(--radius-lg);
    background: var(--card);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow-sm);
    opacity: 0;
    animation: cellAppear 0.5s ease-out forwards;
    min-height: 320px;
  }

  .week-cell:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent-soft);
  }

  .week-cell.today {
    border-color: var(--accent);
    box-shadow: var(--shadow-md), 0 0 0 3px rgba(232,168,124,0.15);
  }

  .week-cell.has-photos { border-color: var(--accent-soft); }
  .week-cell.has-photos:hover { border-color: var(--accent); }

  .week-inner {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 12px 10px;
  }

  .week-header {
    text-align: center;
    margin-bottom: 8px;
    position: relative;
    z-index: 2;
  }

  .week-weekday {
    font-size: 0.7rem;
    color: var(--text-lighter);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .week-day-num {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
    font-family: var(--font-display);
  }

  .week-cell.today .week-day-num {
    color: var(--accent-deep);
  }

  .week-lunar {
    font-size: 0.72rem;
    color: var(--lunar-color);
    margin-top: 2px;
  }

  .week-lunar.festival {
    color: var(--lunar-festival);
    font-weight: 600;
  }

  .week-lunar.term {
    color: var(--sage);
  }

  .week-photos {
    flex: 1;
    display: grid;
    gap: 4px;
    overflow: hidden;
    border-radius: var(--radius-sm);
  }

  .week-photos.count-1 { grid-template-columns: 1fr; }
  .week-photos.count-2 { grid-template-columns: 1fr 1fr; }
  .week-photos.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .week-photos.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .week-photos.count-many { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

  .week-photo-thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    transition: transform 0.3s ease;
  }

  .week-cell:hover .week-photo-thumb { transform: scale(1.05); }

  .week-photo-more {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(61,44,44,0.75);
    color: white;
    font-size: 0.7rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 12px;
    backdrop-filter: blur(4px);
    z-index: 3;
  }

  .week-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    min-width: 22px;
    height: 22px;
    border-radius: 11px;
    background: var(--accent);
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    box-shadow: 0 2px 6px rgba(232,168,124,0.4);
    padding: 0 5px;
  }

  /* ─── Year View ─────────────────────────────────────── */
  .year-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 0 2px;
  }

  .year-month-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    border: 1.5px solid transparent;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    opacity: 0;
    animation: cellAppear 0.5s ease-out forwards;
  }

  .year-month-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent-soft);
  }

  .year-month-card.current-month {
    border-color: var(--accent);
    box-shadow: var(--shadow-md), 0 0 0 3px rgba(232,168,124,0.1);
  }

  .year-month-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .year-month-name {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }

  .year-month-card.current-month .year-month-name {
    color: var(--accent-deep);
  }

  .year-month-lunar {
    font-size: 0.7rem;
    color: var(--lunar-color);
  }

  .year-month-stats {
    font-size: 0.72rem;
    color: var(--text-lighter);
  }

  .year-mini-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .year-mini-header span {
    text-align: center;
    font-size: 0.5rem;
    color: var(--text-lighter);
    padding: 2px 0;
    font-weight: 500;
  }

  .year-mini-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.55rem;
    color: var(--text-lighter);
    border-radius: 3px;
    position: relative;
  }

  .year-mini-day.has-photos {
    background: var(--accent-soft);
    color: var(--accent-deep);
    font-weight: 600;
  }

  .year-mini-day.today {
    background: var(--accent);
    color: white;
    font-weight: 700;
  }

  .year-mini-day.festival::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--lunar-festival);
  }

  /* ─── Lightbox ──────────────────────────────────────── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(30,20,20,0.85);
    backdrop-filter: blur(20px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .lightbox.active { opacity: 1; visibility: visible; }

  .lightbox-content {
    width: 90%;
    max-width: 900px;
    max-height: 90vh;
    background: var(--card);
    border-radius: var(--radius-xl);
    overflow: hidden;
    box-shadow: var(--shadow-xl);
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
  }

  .lightbox.active .lightbox-content { transform: scale(1) translateY(0); }

  .lightbox-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px 16px;
    border-bottom: 1px solid rgba(61,44,44,0.06);
  }

  .lightbox-date {
    font-family: var(--font-display);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
  }

  .lightbox-date-sub {
    font-size: 0.8rem;
    color: var(--text-light);
    font-weight: 300;
    margin-top: 2px;
  }

  .lightbox-date-lunar {
    font-size: 0.78rem;
    color: var(--lunar-color);
    margin-top: 2px;
  }

  .lightbox-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    cursor: pointer;
    transition: all 0.3s ease;
    color: var(--text-light);
    font-size: 20px;
  }

  .lightbox-close:hover {
    background: var(--rose-soft);
    color: var(--text);
    transform: rotate(90deg);
  }

  .lightbox-body {
    padding: 20px 24px 24px;
    overflow-y: auto;
    flex: 1;
  }

  .lightbox-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .lightbox-photo {
    aspect-ratio: 1;
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;

<script>
(function() {

  ];

  const Gan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  const Zhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const Animals = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  const lunarMonthNames = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  const lunarDayNames = [
    '初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
    '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
    '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'
  ];

  // Solar terms data
  const solarTerm = [
    '小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨',
    '立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑',
    '白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'
  ];
  const sTermInfo = [
    0,21208,42467,63836,85337,107014,128867,150921,
    173149,195551,218072,240693,263343,285989,308563,331033,
    353350,375494,397447,419210,440795,462224,483532,504758
  ];

  function lYearDays(y) {
    let sum = 348;
    for (let i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
    return sum + leapDays(y);
  }

  function leapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
  function leapDays(y) { if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29; return 0; }
  function monthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }

  function solar2lunar(yy, mm, dd) {
    if (yy < 1900 || yy > 2100) return null;
    const baseDate = new Date(1900, 0, 31);
    const objDate = new Date(yy, mm - 1, dd);
    let offset = Math.floor((objDate - baseDate) / 86400000);

    let lunarYear, lunarMonth, lunarDay, isLeap = false;

    for (lunarYear = 1900; lunarYear < 2101 && offset > 0; lunarYear++) {
      const daysInYear = lYearDays(lunarYear);
      offset -= daysInYear;
    }
    if (offset < 0) { offset += lYearDays(--lunarYear); }

    const leap = leapMonth(lunarYear);
    let isLeapMonth = false;

    for (lunarMonth = 1; lunarMonth < 13 && offset > 0; lunarMonth++) {
      if (leap > 0 && lunarMonth === (leap + 1) && !isLeapMonth) {
        --lunarMonth;
        isLeapMonth = true;
        const daysInMonth = leapDays(lunarYear);
        if (offset < daysInMonth) { isLeap = true; break; }
        offset -= daysInMonth;
        isLeapMonth = false;
      } else {
        const daysInMonth = monthDays(lunarYear, lunarMonth);
        if (offset < daysInMonth) break;
        offset -= daysInMonth;
      }
    }

    lunarDay = offset + 1;
    if (isLeap) lunarMonth = leap;

    return {
      lYear: lunarYear,
      lMonth: lunarMonth,
      lDay: lunarDay,
      isLeap: isLeap,
      yearGanZhi: Gan[(lunarYear - 4) % 10] + Zhi[(lunarYear - 4) % 12],
      animal: Animals[(lunarYear - 4) % 12],
      lunarMonthStr: (isLeap ? '闰' : '') + lunarMonthNames[lunarMonth - 1] + '月',
      lunarDayStr: lunarDayNames[lunarDay - 1]
    };
  }

  // Get solar term for a given date
  function getSolarTerm(yy, mm, dd) {
    const baseDate = new Date(1900, 0, 6, 2, 5);
    const objDate = new Date(yy, mm - 1, dd);
    const offset = Math.floor((objDate - baseDate) / 86400000);
    const idx = Math.floor(offset / 15.22);
    if (idx >= 0 && idx < 24) {
      const termOffset = Math.floor(sTermInfo[idx] / 86400000);
      if (offset === termOffset) return solarTerm[idx];
    }
    return null;
  }

  // Get lunar festival or solar term for display
  function getLunarLabel(yy, mm, dd) {
    const lunar = solar2lunar(yy, mm, dd);
    if (!lunar) return { text: '', type: '' };

    // Check lunar festivals
    const lunarFestivals = {
      '1-1': '春节', '1-15': '元宵', '5-5': '端午', '7-7': '七夕',
      '7-15': '中元', '8-15': '中秋', '9-9': '重阳', '12-8': '腊八',
      '12-30': '除夕', '12-29': '除夕'
    };
    const lfKey = lunar.lMonth + '-' + lunar.lDay;
    if (lunarFestivals[lfKey]) return { text: lunarFestivals[lfKey], type: 'festival' };

    // Check solar festivals
    const solarFestivals = {
      '1-1': '元旦', '2-14': '情人节', '3-8': '妇女节', '4-1': '愚人节',
      '5-1': '劳动节', '5-4': '青年节', '6-1': '儿童节', '7-1': '建党节',

    };
    const sfKey = mm + '-' + dd;
    if (solarFestivals[sfKey]) return { text: solarFestivals[sfKey], type: 'festival' };

    // Check solar term
    const term = getSolarTerm(yy, mm, dd);
    if (term) return { text: term, type: 'term' };

    // Check if first day of lunar month
    if (lunar.lDay === 1) return { text: lunar.lunarMonthStr, type: 'festival' };

    // Default: show lunar day
    return { text: lunar.lunarDayStr, type: 'normal' };
  }

  // ═══════════════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════════════

  const state = {
    currentYear: 2026,
    currentMonth: 5,
    currentView: 'month', // 'week' | 'month' | 'year'
    weekStart: null, // Date object for week view

    const y = state.currentYear;
    const m = state.currentMonth;
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const assignments = [
      {day:1,count:3},{day:2,count:1},{day:3,count:5},{day:5,count:2},{day:6,count:4},

    assignments.forEach(a => {
      if (a.day <= daysInMonth) {
        const key = fmtKey(y, m, a.day);
        if (!photosDB[key]) {
          photosDB[key] = [];
          for (let i = 0; i < a.count; i++) photosDB[key].push(sampleImages[i % sampleImages.length]);
        }
      }
    });
  }

  // ─── Helpers ───────────────────────────────────────────
  function fmtKey(y, m, d) {
    return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

  function getFirstDayOfMonth(y, m) { return new Date(y, m, 1).getDay(); }
  function isToday(y, m, d) {
    const n = new Date();
    return n.getFullYear() === y && n.getMonth() === m && n.getDate() === d;

  function getWeekStart(date) {
    const d = new Date(date);
    const day = d.getDay();
    d.setDate(d.getDate() - day);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  // ═══════════════════════════════════════════════════════
  //  RENDER
  // ═══════════════════════════════════════════════════════

  function render() {
    updateNavDisplay();
    updateStats();
    const wrapper = document.getElementById('calendarWrapper');

    if (state.currentView === 'month') renderMonthView(wrapper);
    else if (state.currentView === 'week') renderWeekView(wrapper);
    else if (state.currentView === 'year') renderYearView(wrapper);
  }

  function updateNavDisplay() {
    const y = state.currentYear;
    const m = state.currentMonth;

    document.getElementById('yearDisplay').textContent = y + '年';

    if (state.currentView === 'year') {
      document.getElementById('monthDisplay').textContent = '';
    } else if (state.currentView === 'week') {
      if (state.weekStart) {
        const ws = state.weekStart;
        const we = new Date(ws);
        we.setDate(we.getDate() + 6);
        document.getElementById('monthDisplay').textContent =
          `${ws.getMonth() + 1}/${ws.getDate()} - ${we.getMonth() + 1}/${we.getDate()}`;
      }
    } else {
      document.getElementById('monthDisplay').textContent = monthNames[m];
    }

    // Lunar year display
    const lunar = solar2lunar(y, 6, 15); // mid-year approximation
    if (lunar) {
      document.getElementById('lunarYearDisplay').textContent =
        `${lunar.yearGanZhi}年（${lunar.animal}年）`;
    }
  }

  // ─── Month View ───────────────────────────────────────
  function renderMonthView(wrapper) {
    const y = state.currentYear;
    const m = state.currentMonth;
    const daysInMonth = getDaysInMonth(y, m);
    const firstDay = getFirstDayOfMonth(y, m);

    let html = `<div class="weekday-header">`;
    ['日','一','二','三','四','五','六'].forEach(w => {
      html += `<span>${w}</span>`;
    });
    html += `</div><div class="calendar-grid">`;

    for (let i = 0; i < firstDay; i++) {
      html += '<div class="day-cell empty"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const key = fmtKey(y, m, d);
      const photos = photosDB[key] || [];
      const count = photos.length;
      const today = isToday(y, m, d);
      const lunar = getLunarLabel(y, m + 1, d);

      let cls = 'day-cell';
      if (today) cls += ' today';
      if (count > 0) cls += ' has-photos';
      const delay = (firstDay + d - 1) * 12;

      html += `<div class="${cls}" data-date="${key}" style="animation-delay:${delay}ms" onclick="app.openDay('${key}')">`;
      html += '<div class="day-inner">';
      html += '<div class="day-header">';
      html += `<div class="day-number">${d}</div>`;
      html += `<div class="day-lunar ${lunar.type}">${lunar.text}</div>`;
      html += '</div>';

      if (count > 0) {
        html += `<div class="day-badge">${count}</div>`;
        let gc = 'day-photos';
        if (count === 1) gc += ' count-1';
        else if (count === 2) gc += ' count-2';
        else if (count === 3) gc += ' count-3';
        else if (count === 4) gc += ' count-4';
        else gc += ' count-many';
        html += `<div class="${gc}">`;
        const show = Math.min(count, 4);
        for (let i = 0; i < show; i++) {
          html += `<img class="day-photo-thumb" src="${photos[i]}" alt="照片" loading="lazy">`;
        }
        if (count > 4) html += `<div class="day-photo-more">+${count - 4}</div>`;
        html += '</div>';
      }

      html += '</div></div>';
    }

    html += '</div>';
    wrapper.innerHTML = html;
  }

  // ─── Week View ────────────────────────────────────────
  function renderWeekView(wrapper) {
    if (!state.weekStart) {
      const now = new Date();
      state.weekStart = getWeekStart(now);
    }

    const ws = new Date(state.weekStart);

    let html = `<div class="weekday-header">`;
    for (let i = 0; i < 7; i++) {
      const d = new Date(ws);
      d.setDate(d.getDate() + i);
      html += `<span>${['日','一','二','三','四','五','六'][i]}</span>`;
    }
    html += `</div><div class="week-grid">`;

    for (let i = 0; i < 7; i++) {
      const d = new Date(ws);
      d.setDate(d.getDate() + i);
      const dy = d.getFullYear(), dm = d.getMonth(), dd = d.getDate();
      const key = fmtKey(dy, dm, dd);
      const photos = photosDB[key] || [];
      const count = photos.length;
      const today = isToday(dy, dm, dd);
      const lunar = getLunarLabel(dy, dm + 1, dd);

      let cls = 'week-cell';
      if (today) cls += ' today';
      if (count > 0) cls += ' has-photos';
      const delay = i * 60;

      html += `<div class="${cls}" data-date="${key}" style="animation-delay:${delay}ms" onclick="app.openDay('${key}')">`;
      html += '<div class="week-inner">';
      html += '<div class="week-header">';
      html += `<div class="week-weekday">${weekdayShort[i]}</div>`;
      html += `<div class="week-day-num">${dd}</div>`;
      html += `<div class="week-lunar ${lunar.type}">${lunar.text}</div>`;
      html += '</div>';

      if (count > 0) {
        html += `<div class="week-badge">${count}</div>`;
        let gc = 'week-photos';
        if (count === 1) gc += ' count-1';
        else if (count === 2) gc += ' count-2';
        else if (count === 3) gc += ' count-3';
        else if (count === 4) gc += ' count-4';
        else gc += ' count-many';
        html += `<div class="${gc}">`;
        const show = Math.min(count, 4);
        for (let j = 0; j < show; j++) {
          html += `<img class="week-photo-thumb" src="${photos[j]}" alt="照片" loading="lazy">`;
        }
        if (count > 4) html += `<div class="week-photo-more">+${count - 4}</div>`;
        html += '</div>';
      }

      html += '</div></div>';
    }

    html += '</div>';
    wrapper.innerHTML = html;
  }

  // ─── Year View ───────────────────────────────────────
  function renderYearView(wrapper) {
    const y = state.currentYear;
    const now = new Date();

    let html = '<div class="year-grid">';

    for (let m = 0; m < 12; m++) {
      const daysInMonth = getDaysInMonth(y, m);
      const firstDay = getFirstDayOfMonth(y, m);
      const isCurrentMonth = (now.getFullYear() === y && now.getMonth() === m);

      let monthPhotos = 0;
      let daysWithPhotos = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const key = fmtKey(y, m, d);
        const p = photosDB[key] || [];
        if (p.length > 0) { monthPhotos += p.length; daysWithPhotos++; }
      }

      // Get lunar month name for first day
      const lunarLabel = getLunarLabel(y, m + 1, 1);

      let cls = 'year-month-card';
      if (isCurrentMonth) cls += ' current-month';
      const delay = m * 40;

      html += `<div class="${cls}" style="animation-delay:${delay}ms" onclick="app.goMonth(${m})">`;
      html += '<div class="year-month-header">';
      html += `<div class="year-month-name">${monthNames[m]}</div>`;
      html += `<div class="year-month-lunar">${lunarLabel.type === 'festival' ? lunarLabel.text : lunarMonthNames[m] + '月'}</div>`;
      html += '</div>';
      html += `<div class="year-month-stats">${monthPhotos}张 · ${daysWithPhotos}天</div>`;

      // Mini calendar
      html += '<div class="year-mini-grid">';
      html += '<div class="year-mini-header">';
      ['日','一','二','三','四','五','六'].forEach(w => html += `<span>${w}</span>`);
      html += '</div>';

      for (let i = 0; i < firstDay; i++) {
        html += '<div class="year-mini-day"></div>';
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const key = fmtKey(y, m, d);
        const p = photosDB[key] || [];
        const today = isToday(y, m, d);
        const lunar = getLunarLabel(y, m + 1, d);

        let dc = 'year-mini-day';
        if (today) dc += ' today';
        else if (p.length > 0) dc += ' has-photos';
        if (lunar.type === 'festival' && !today) dc += ' festival';

        html += `<div class="${dc}">${d}</div>`;
      }

      html += '</div></div>';
    }

    html += '</div>';
    wrapper.innerHTML = html;
  }

  // ─── Stats ────────────────────────────────────────────
  function updateStats() {
    const y = state.currentYear;
    const m = state.currentMonth;
    const daysInMonth = getDaysInMonth(y, m);

    let totalPhotos = 0, daysWithPhotos = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const key = fmtKey(y, m, d);
      const p = photosDB[key] || [];
      if (p.length > 0) { totalPhotos += p.length; daysWithPhotos++; }
    }

    let streak = 0;
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === y && today.getMonth() === m;
    const startD = isCurrentMonth ? today.getDate() : daysInMonth;
    for (let d = startD; d >= 1; d--) {
      const key = fmtKey(y, m, d);
      if (photosDB[key] && photosDB[key].length > 0) streak++;
      else break;
    }

    document.getElementById('statPhotos').textContent = totalPhotos;
    document.getElementById('statDays').textContent = daysWithPhotos;
    document.getElementById('statStreak').textContent = streak;
  }

  // ─── Navigation ──────────────────────────────────────
  function prev() {
    if (state.currentView === 'year') {
      state.currentYear--;
    } else if (state.currentView === 'month') {
      state.currentMonth--;
      if (state.currentMonth < 0) { state.currentMonth = 11; state.currentYear--; }
    } else if (state.currentView === 'week') {
      state.weekStart.setDate(state.weekStart.getDate() - 7);
      const ws = state.weekStart;
      state.currentYear = ws.getFullYear();
      state.currentMonth = ws.getMonth();
    }
    render();
  }

  function next() {
    if (state.currentView === 'year') {
      state.currentYear++;
    } else if (state.currentView === 'month') {
      state.currentMonth++;
      if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
    } else if (state.currentView === 'week') {
      state.weekStart.setDate(state.weekStart.getDate() + 7);
      const ws = state.weekStart;
      state.currentYear = ws.getFullYear();
      state.currentMonth = ws.getMonth();
    }
    render();
  }

  function goToday() {
    const now = new Date();
    state.currentYear = now.getFullYear();
    state.currentMonth = now.getMonth();
    state.weekStart = getWeekStart(now);
    render();
    showToast('已回到今天');
  }

  function goMonth(m) {
    state.currentMonth = m;
    state.currentView = 'month';
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.view-btn[data-view="month"]').classList.add('active');
    render();
  }

  function switchView(view) {
    state.currentView = view;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.view-btn[data-view="${view}"]`).classList.add('active');

    if (view === 'week' && !state.weekStart) {
      state.weekStart = getWeekStart(new Date());
    }

    render();
  }

  // ─── Lightbox ────────────────────────────────────────
  function openDay(dateKey) {
    const photos = photosDB[dateKey] || [];
    if (photos.length === 0) return;

    state.selectedDate = dateKey;
    const parts = dateKey.split('-');
    const y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
    const dayOfWeek = new Date(y, m - 1, d).getDay();
    const lunar = solar2lunar(y, m, d);

    document.getElementById('lightboxDate').textContent = `${m}月${d}日`;
    document.getElementById('lightboxDateSub').textContent =
      `${y}年 · ${weekdayNames[dayOfWeek]} · ${photos.length}张照片`;

    if (lunar) {
      document.getElementById('lightboxDateLunar').textContent =
        `${lunar.lunarMonthStr}${lunar.lunarDayStr} · ${lunar.yearGanZhi}年`;
    }

    const grid = document.getElementById('lightboxGrid');
    grid.innerHTML = photos.map((src, i) => `
      <div class="lightbox-photo" onclick="app.openFullview(${i})">
        <img src="${src}" alt="照片 ${i + 1}" loading="lazy">
      </div>
    `).join('');

    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
    state.selectedDate = null;
  }

  // ─── Fullview ────────────────────────────────────────
  function openFullview(index) {
    if (!state.selectedDate) return;
    const photos = photosDB[state.selectedDate] || [];
    if (photos.length === 0) return;
    state.fullviewPhotos = photos;
    state.fullviewIndex = index;
    updateFullview();
    document.getElementById('fullview').classList.add('active');
  }

  function updateFullview() {
    const photos = state.fullviewPhotos;
    const idx = state.fullviewIndex;
    document.getElementById('fullviewImg').src = photos[idx];
    document.getElementById('fullviewCounter').textContent = `${idx + 1} / ${photos.length}`;
    document.getElementById('fullviewPrev').style.display = idx > 0 ? 'flex' : 'none';
    document.getElementById('fullviewNext').style.display = idx < photos.length - 1 ? 'flex' : 'none';
  }

  function closeFullview() { document.getElementById('fullview').classList.remove('active'); }
  function fullviewPrev() { if (state.fullviewIndex > 0) { state.fullviewIndex--; updateFullview(); } }
  function fullviewNext() { if (state.fullviewIndex < state.fullviewPhotos.length - 1) { state.fullviewIndex++; updateFullview(); } }

  // ─── Upload ──────────────────────────────────────────
  function handleUpload(files) {
    if (!state.selectedDate || files.length === 0) return;
    const readers = [];
    Array.from(files).forEach(file => {
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        readers.push(new Promise(resolve => {
          reader.onload = e => resolve(e.target.result);
          reader.readAsDataURL(file);
        }));
      }
    });
    Promise.all(readers).then(results => {
      if (!photosDB[state.selectedDate]) photosDB[state.selectedDate] = [];
      photosDB[state.selectedDate].push(...results);
      showToast(`成功添加 ${results.length} 张照片`);
      render();
      openDay(state.selectedDate);
    });
  }

  // ─── Toast ────────────────────────────────────────────
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ─── Keyboard ─────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('fullview').classList.contains('active')) closeFullview();
      else if (document.getElementById('lightbox').classList.contains('active')) closeLightbox();
    }
    if (document.getElementById('fullview').classList.contains('active')) {
      if (e.key === 'ArrowLeft') fullviewPrev();
      if (e.key === 'ArrowRight') fullviewNext();
    }
  });

  // ─── Event Listeners ─────────────────────────────────
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('todayBtn').addEventListener('click', goToday);
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);

  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLightbox();
  });

  document.getElementById('fullview').addEventListener('click', e => {
    if (e.target === document.getElementById('fullview')) closeFullview();
  });

  document.getElementById('fullviewPrev').addEventListener('click', e => { e.stopPropagation(); fullviewPrev(); });
  document.getElementById('fullviewNext').addEventListener('click', e => { e.stopPropagation(); fullviewNext(); });

  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');

  uploadArea.addEventListener('click', () => fileInput.click());
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; uploadArea.style.background = 'var(--accent-soft)'; });
  uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; uploadArea.style.background = ''; });
  uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor = ''; uploadArea.style.background = ''; handleUpload(e.dataTransfer.files); });
  fileInput.addEventListener('change', e => { handleUpload(e.target.files); e.target.value = ''; });

  // ─── Init ─────────────────────────────────────────────
  seedSampleData();
  render();

  window.app = { openDay, openFullview, goMonth };
})();
</script>
</body>
</html>
