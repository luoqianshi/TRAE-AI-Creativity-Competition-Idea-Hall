<body>
  <article class="page">
    <nav class="topbar" aria-label="页面信息">
      <span>Photo Story Polaroid</span>
      <span>本地保存 · 可换边框 · 记忆编号</span>
    </nav>

    <header class="hero">
      <section class="intro panel">
        <div>
          <span class="eyebrow">Moment Archive</span>
          <h1>把照片变成<span class="serif">有故事</span>的拍立得</h1>
          <p class="lead">拍下或上传照片，写下当时发生的事情、地点、心情和一句关键词。系统会自动生成一个“故事 IP”，像给每一段记忆盖上专属编号。</p>
        </div>
        <div class="mini-stats">
          <span class="mini">已保存 <strong id="savedCount">0</strong> 张</span>
          <span class="mini">当前边框 <strong id="currentFrame">纯白</strong></span>
          <span class="mini">最后编辑 <strong id="lastEdit">—</strong></span>
        </div>
      </section>

      <section class="composer panel" aria-label="创建照片故事">
        <div class="polaroid-stage">
          <div class="polaroid frame-plain" id="previewCard">
            <div class="photo-box" id="photoBox">
              <img id="previewImage" alt="照片预览">
              <div class="placeholder">上传照片或直接拍照<br>你的故事会出现在下方</div>
            </div>
            <p class="caption" id="previewCaption">“那一刻的光，后来一直留在这里。”</p>
            <div class="meta-line">
              <span id="previewDate">Today</span>
              <span id="previewIp">IP-0000</span>
            </div>
          </div>
        </div>

        <form class="controls" id="storyForm">
          <div class="field full">
            <label for="photoInput">照片</label>
            <input id="photoInput" type="file" accept="image/*" capture="environment">
          </div>

          <div class="field">
            <label for="titleInput">这一刻的标题</label>
            <input id="titleInput" type="text" maxlength="34" placeholder="比如：雨后便利店">
          </div>

          <div class="field">
            <label for="placeInput">地点 / 场景</label>
            <input id="placeInput" type="text" maxlength="28" placeholder="比如：街角、海边、厨房">
          </div>

          <div class="field">
            <label for="moodInput">心情</label>
            <select id="moodInput">
              <option value="安静">安静</option>
              <option value="浪漫">浪漫</option>
              <option value="松弛">松弛</option>
              <option value="热烈">热烈</option>
              <option value="微醺">微醺</option>
              <option value="怀念">怀念</option>
            </select>
          </div>

          <div class="field">
            <label for="frameInput">拍立得边框</label>
            <select id="frameInput">
              <option value="plain">纯白</option>
              <option value="stripe">细条纹</option>
              <option value="dot">小波点</option>
              <option value="thin">画廊细边</option>
              <option value="noir">黑胶片</option>
            </select>
          </div>

          <div class="field full">
            <label for="storyInput">当时发生的故事</label>
            <textarea id="storyInput" maxlength="260" placeholder="写下当时发生了什么：谁在场？说了什么？为什么这一刻值得被留下？"></textarea>
          </div>

          <div class="actions">
            <button class="btn primary" type="submit">保存为拍立得故事</button>
            <button class="btn" id="randomStory" type="button">给我一个灵感开头</button>
            <button class="btn subtle" id="clearDraft" type="button">清空草稿</button>
          </div>
        </form>
      </section>
    </header>

    <main>
      <section aria-labelledby="archiveTitle">
        <div class="section-head">
          <div>
            <h2 id="archiveTitle">照片故事墙</h2>
            <p class="hint">故事会保存在当前浏览器里。刷新页面后仍能看到；如果换设备或清理浏览器数据，记录会消失。</p>
          </div>
          <button class="btn subtle" id="clearAll" type="button">清空故事墙</button>
        </div>
        <div class="archive" id="archive"></div>
      </section>
    </main>

    <footer>
      <p>照片只存在你的浏览器本地。这个版本不联网、不上传、不调用外部存储。</p>
    </footer>
  </article>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>
