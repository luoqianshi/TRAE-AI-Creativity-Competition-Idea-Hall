<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI漫剧风云榜 — 全平台排名整合</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg-primary: #0a0e1a;
  --bg-secondary: #111627;
  --bg-card: #141829;
  --bg-card-hover: #1a1f35;
  --bg-input: #1a1e2e;
  --text-primary: #e8eaed;
  --text-secondary: #8892a4;
  --text-muted: #5a6170;
  --accent-1: #6c5ce7;
  --accent-2: #00cec9;
  --accent-gradient: linear-gradient(135deg, #6c5ce7, #00cec9);
  --gold: #ffd700;
  --gold-dark: #b8960f;
  --silver: #c0c0c0;
  --silver-dark: #8a8a8a;
  --bronze: #cd7f32;
  --bronze-dark: #8b5523;
  --border: #1e2338;
  --border-light: #2a3050;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 20px;
  --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-glow: 0 0 30px rgba(108,92,231,0.15);
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== Animated BG Particles ===== */
.bg-particles {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  overflow: hidden;
}
.bg-particles .orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.08;
  animation: float 20s infinite ease-in-out;
}
.bg-particles .orb:nth-child(1) {
  width: 500px; height: 500px;
  background: #6c5ce7;
  top: -150px; left: -100px;
  animation-delay: 0s;
}
.bg-particles .orb:nth-child(2) {
  width: 400px; height: 400px;
  background: #00cec9;
  bottom: -100px; right: -100px;
  animation-delay: -7s;
}
.bg-particles .orb:nth-child(3) {
  width: 300px; height: 300px;
  background: #fd79a8;
  top: 50%; left: 50%;
  animation-delay: -14s;
}
@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(60px, -40px) scale(1.1); }
  50% { transform: translate(-30px, 50px) scale(0.9); }
  75% { transform: translate(-50px, -30px) scale(1.05); }
}

/* ===== Container ===== */
.container {
  position: relative; z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ===== Hero Banner ===== */
.hero {
  position: relative;
  text-align: center;
  padding: 60px 20px 40px;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 600px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-2), transparent);
}
.hero-icon {
  font-size: 56px;
  margin-bottom: 12px;
  display: inline-block;
  animation: bounce 2s infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.hero h1 {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 800;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.hero .subtitle {
  color: var(--text-secondary);
  font-size: 15px;
  letter-spacing: 4px;
  text-transform: uppercase;
}

/* Stats Row */
.stats-row {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 28px;
  flex-wrap: wrap;
}
.stat-item {
  text-align: center;
}
.stat-value {
  font-size: 28px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  letter-spacing: 2px;
  margin-top: 2px;
}

/* ===== Filter Section ===== */
.filter-section {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 16px 0;
}
.filter-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 13px;
  color: var(--text-muted);
  white-space: nowrap;
  letter-spacing: 1px;
  min-width: 38px;
}
.filter-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  border: 1px solid var(--border-light);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  user-select: none;
}
.chip:hover {
  border-color: var(--accent-1);
  color: var(--text-primary);
  background: rgba(108,92,231,0.08);
}
.chip.active {
  background: var(--accent-gradient);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
  box-shadow: 0 2px 12px rgba(108,92,231,0.3);
}

/* Platform-specific chip active colors */
.chip.platform.active[data-value="B站"] {
  background: linear-gradient(135deg, #fb7299, #e85d8b);
  box-shadow: 0 2px 12px rgba(251,114,153,0.35);
}
.chip.platform.active[data-value="抖音"] {
  background: linear-gradient(135deg, #ff0050, #e60046);
  box-shadow: 0 2px 12px rgba(255,0,80,0.35);
}
.chip.platform.active[data-value="快手"] {
  background: linear-gradient(135deg, #ff4906, #e64105);
  box-shadow: 0 2px 12px rgba(255,73,6,0.35);
}
.chip.platform.active[data-value="腾讯视频"] {
  background: linear-gradient(135deg, #12b7f5, #0e9fd6);
  box-shadow: 0 2px 12px rgba(18,183,245,0.35);
}
.chip.platform.active[data-value="爱奇艺"] {
  background: linear-gradient(135deg, #00be06, #00a305);
  box-shadow: 0 2px 12px rgba(0,190,6,0.35);
}
.chip.platform.active[data-value="优酷"] {
  background: linear-gradient(135deg, #00a0e9, #0089c9);
  box-shadow: 0 2px 12px rgba(0,160,233,0.35);
}

/* Filter divider */
.filter-divider {
  width: 100%;
  height: 1px;
  background: var(--border);
  margin: 10px 0;
}

/* Search + Sort Row */
.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.search-box {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 320px;
}
.search-box input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  border-radius: 20px;
  border: 1px solid var(--border-light);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: var(--transition);
}
.search-box input:focus {
  border-color: var(--accent-1);
  box-shadow: 0 0 0 3px rgba(108,92,231,0.12);
}
.search-box input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
  pointer-events: none;
}
.sort-group {
  display: flex;
  gap: 6px;
  align-items: center;
}
.sort-btn {
  padding: 8px 14px;
  border-radius: 20px;
  font-size: 13px;
  border: 1px solid var(--border-light);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 4px;
}
.sort-btn:hover { border-color: var(--accent-1); color: var(--text-primary); }
.sort-btn.active {
  background: rgba(108,92,231,0.15);
  border-color: var(--accent-1);
  color: var(--accent-1);
  font-weight: 600;
}
.sort-arrow { font-size: 11px; }

/* Result summary */
.result-summary {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0 6px;
  flex-wrap: wrap;
  gap: 8px;
}
.result-count {
  font-size: 14px;
  color: var(--text-secondary);
}
.result-count strong { color: var(--text-primary); }
.clear-filter {
  font-size: 12px;
  color: var(--accent-1);
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px 10px;
  border-radius: 12px;
  transition: var(--transition);
}
.clear-filter:hover { background: rgba(108,92,231,0.12); }

/* ===== Ranking List ===== */
.ranking-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 40px;
}

/* Card */
.rank-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
  animation: fadeInUp 0.4s ease both;
  position: relative;
  overflow: hidden;
}
.rank-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-light);
  transform: translateY(-2px);
  box-shadow: var(--shadow-glow);
}
/* Top 3 special borders */
.rank-card.top-1 {
  border-color: transparent;
  background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
              linear-gradient(135deg, #ffd700, #ffaa00, #ffd700) border-box;
  box-shadow: 0 0 24px rgba(255,215,0,0.12);
}
.rank-card.top-2 {
  border-color: transparent;
  background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
              linear-gradient(135deg, #c0c0c0, #e8e8e8, #a0a0a0) border-box;
  box-shadow: 0 0 20px rgba(192,192,192,0.1);
}
.rank-card.top-3 {
  border-color: transparent;
  background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
              linear-gradient(135deg, #cd7f32, #e8a850, #b8702a) border-box;
  box-shadow: 0 0 18px rgba(205,127,50,0.1);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Rank Number */
.rank-num {
  width: 44px;
  min-width: 44px;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  color: var(--text-secondary);
  font-style: italic;
}
.top-1 .rank-num { color: var(--gold); font-size: 28px; }
.top-2 .rank-num { color: var(--silver); font-size: 26px; }
.top-3 .rank-num { color: var(--bronze); font-size: 24px; }

.rank-medal {
  font-size: 30px;
  line-height: 1;
}
.top-1 .rank-medal::before { content: '🥇'; }
.top-2 .rank-medal::before { content: '🥈'; }
.top-3 .rank-medal::before { content: '🥉'; }

/* Cover thumbnail */
.cover {
  width: 72px; min-width: 72px; height: 96px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  position: relative;
  overflow: hidden;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
.cover::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.35) 100%);
}
.cover .cover-episodes {
  position: absolute;
  bottom: 4px; left: 6px;
  font-size: 10px;
  font-weight: 500;
  z-index: 1;
  color: rgba(255,255,255,0.9);
  text-shadow: none;
}

/* Info */
.card-info {
  flex: 1;
  min-width: 0;
}
.card-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-bottom: 8px;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-platform {
  color: #fff;
}
.badge-platform.bilibili { background: #fb7299; }
.badge-platform.douyin { background: #ff0050; }
.badge-platform.kuaishou { background: #ff4906; }
.badge-platform.tencent { background: #12b7f5; }
.badge-platform.iqiyi { background: #00be06; }
.badge-platform.youku { background: #00a0e9; }

.badge-category {
  background: rgba(108,92,231,0.12);
  color: #a29bfe;
  border: 1px solid rgba(108,92,231,0.2);
}

/* Score + Stats Column */
.card-stats {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  min-width: 100px;
}
.score-row {
  display: flex;
  align-items: center;
  gap: 4px;
}
.score-value {
  font-size: 22px;
  font-weight: 800;
  color: #ffd700;
}
.score-max {
  font-size: 12px;
  color: var(--text-muted);
}
.score-stars {
  color: #ffd700;
  font-size: 12px;
  letter-spacing: 1px;
}
.views {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}
.trend-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.trend-up { color: #00cec9; background: rgba(0,206,201,0.1); }
.trend-down { color: #ff4757; background: rgba(255,71,87,0.1); }
.trend-stable { color: var(--text-muted); background: rgba(136,146,164,0.08); }

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 30px 20px;
  border-top: 1px solid var(--border);
  color: var(--text-muted);
  font-size: 12px;
  letter-spacing: 1px;
}
.footer a { color: var(--accent-1); text-decoration: none; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .hero { padding: 40px 16px 30px; }
  .hero h1 { font-size: 24px; }
  .stats-row { gap: 24px; }
  .stat-value { font-size: 22px; }

  .rank-card {
    padding: 12px 14px;
    gap: 10px;
  }
  .cover {
    width: 56px; min-width: 56px; height: 76px;
    font-size: 22px;
  }
  .rank-num {
    width: 32px; min-width: 32px;
    font-size: 18px;
  }
  .top-1 .rank-num { font-size: 22px; }
  .top-2 .rank-num { font-size: 20px; }
  .top-3 .rank-num { font-size: 19px; }
  .card-title { font-size: 15px; }
  .card-desc { font-size: 12px; }
  .card-stats { min-width: 80px; }
  .score-value { font-size: 18px; }

  .filter-chips { gap: 6px; }
  .chip { padding: 5px 12px; font-size: 12px; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .search-box { max-width: none; }
  .sort-group { justify-content: flex-end; }
}

@media (max-width: 480px) {
  .rank-card {
    flex-wrap: wrap;
    gap: 8px;
  }
  .card-stats {
    flex-direction: row;
    align-items: center;
    gap: 12px;
    min-width: auto;
    width: 100%;
    justify-content: flex-start;
    padding-left: 42px;
  }
}
</style>
</head>
<body>

<!-- Background particles -->
<div class="bg-particles">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<!-- Hero -->
<header class="hero">
  <div class="hero-icon">🤖</div>
  <h1>AI 漫剧风云榜</h1>
  <p class="subtitle">全平台 AI 短剧 · 排名整合 · 一站纵览</p>
  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-value" id="stat-shows">36</div>
      <div class="stat-label">收录作品</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-platforms">6</div>
      <div class="stat-label">覆盖平台</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="stat-categories">10</div>
      <div class="stat-label">内容分类</div>
    </div>
  </div>
</header>

<!-- Filter Section -->
<section class="filter-section" id="filterSection">
  <div class="container">
    <!-- Platform filter -->
    <div class="filter-row">
      <span class="filter-label">📺 平台</span>
      <div class="filter-chips" id="platformChips">
        <button class="chip platform active" data-value="全部">全部</button>
        <button class="chip platform" data-value="B站">B站</button>
        <button class="chip platform" data-value="抖音">抖音</button>
        <button class="chip platform" data-value="快手">快手</button>
        <button class="chip platform" data-value="腾讯视频">腾讯视频</button>
        <button class="chip platform" data-value="爱奇艺">爱奇艺</button>
        <button class="chip platform" data-value="优酷">优酷</button>
      </div>
    </div>
    <div class="filter-divider"></div>
    <!-- Category filter -->
    <div class="filter-row">
      <span class="filter-label">🏷️ 分类</span>
      <div class="filter-chips" id="categoryChips">
        <button class="chip category active" data-value="全部">全部</button>
        <button class="chip category" data-value="热血">热血</button>
        <button class="chip category" data-value="搞笑">搞笑</button>
        <button class="chip category" data-value="悬疑">悬疑</button>
        <button class="chip category" data-value="爱情">爱情</button>
        <button class="chip category" data-value="科幻">科幻</button>
        <button class="chip category" data-value="奇幻">奇幻</button>
        <button class="chip category" data-value="都市">都市</button>
        <button class="chip category" data-value="古装">古装</button>
        <button class="chip category" data-value="校园">校园</button>
        <button class="chip category" data-value="恐怖">恐怖</button>
      </div>
    </div>
    <div class="filter-divider"></div>
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索剧名...">
      </div>
      <div class="sort-group" id="sortGroup">
        <button class="sort-btn active" data-sort="score">
          按评分 <span class="sort-arrow">↓</span>
        </button>
        <button class="sort-btn" data-sort="views">
          按播放量 <span class="sort-arrow">↓</span>
        </button>
        <button class="sort-btn" data-sort="episodes">
          按集数 <span class="sort-arrow">↓</span>
        </button>
      </div>
    </div>
    <!-- Result summary -->
    <div class="result-summary">
      <span class="result-count">共 <strong id="resultCount">36</strong> 部作品</span>
      <button class="clear-filter" id="clearFilter" style="display:none;">✕ 清除筛选</button>
    </div>
  </div>
</section>

<!-- Ranking List -->
<main class="container">
  <div class="ranking-list" id="rankingList">
    <!-- Cards rendered by JS -->
  </div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">📭</div>
    <p>没有找到匹配的作品</p>
  </div>
</main>

<!-- Footer -->
<footer class="footer">
  <p>数据来源：各平台公开排行榜 · 每日 12:00 更新 · AI 漫剧风云榜 © 2026</p>
  <p style="margin-top:4px;">本站仅做排名整合展示，版权归原平台所有</p>
</footer>

<script>
// ===== DATA =====

// Platform badge CSS class mapping
const PLATFORM_CLASS = {
  'B站':     'bilibili',
  '抖音':    'douyin',
  '快手':    'kuaishou',
  '腾讯视频': 'tencent',
  '爱奇艺':   'iqiyi',
  '优酷':    'youku',
};

// ===== STATE =====
let state = {
  platform: '全部',
  category: '全部',
  sortField: 'score',
  sortOrder: 'desc',  // desc | asc
  searchQuery: '',
};

// ===== DOM REFS =====
const rankingList = document.getElementById('rankingList');
const emptyState = document.getElementById('emptyState');
const resultCount = document.getElementById('resultCount');
const clearFilterBtn = document.getElementById('clearFilter');
const searchInput = document.getElementById('searchInput');
const statShows = document.getElementById('stat-shows');

// ===== RENDER =====
function getFilteredData() {
  let data = [...RAW_DATA];

  if (state.platform !== '全部') {
    data = data.filter(d => d.platform === state.platform);
  }
  if (state.category !== '全部') {
    data = data.filter(d => d.category === state.category);
  }
  if (state.searchQuery.trim()) {
    const q = state.searchQuery.trim().toLowerCase();
    data = data.filter(d => d.title.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q));
  }

  // Sort
  const order = state.sortOrder === 'desc' ? -1 : 1;
  data.sort((a, b) => {
    if (state.sortField === 'score') return (a.score - b.score) * order;
    if (state.sortField === 'views') return (a.views - b.views) * order;
    if (state.sortField === 'episodes') return (a.episodes - b.episodes) * order;
    return 0;
  });

  return data;
}

function getStars(score) {
  const full = Math.floor(score / 2);
  const half = (score / 2 - full) >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '☆' : '') + '☆'.repeat(empty);
}

function getTrendHTML(trend) {
  if (trend === 'up') return '<span class="trend-badge trend-up">▲ 上升</span>';
  if (trend === 'down') return '<span class="trend-badge trend-down">▼ 下降</span>';
  return '<span class="trend-badge trend-stable">─ 持平</span>';
}

function formatViews(views) {
  if (views >= 10000) return (views / 10000).toFixed(1) + '亿';
  return views + '万';
}

function getTopClass(rank) {
  if (rank === 1) return ' top-1';
  if (rank === 2) return ' top-2';
  if (rank === 3) return ' top-3';
  return '';
}

function getRankHTML(rank) {
  if (rank === 1) return '<span class="rank-medal"></span>';
  if (rank === 2) return '<span class="rank-medal"></span>';
  if (rank === 3) return '<span class="rank-medal"></span>';
  return rank;
}

function render() {
  const data = getFilteredData();
  const platformLabel = state.platform === '全部' ? '' : state.platform;
  const categoryLabel = state.category === '全部' ? '' : state.category;
  const hasFilter = platformLabel || categoryLabel || state.searchQuery.trim();

  // Update result count
  resultCount.textContent = data.length;
  statShows.textContent = data.length;

  // Update clear filter button
  clearFilterBtn.style.display = hasFilter ? 'inline-block' : 'none';

  // Empty state
  if (data.length === 0) {
    rankingList.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  // Build cards
  rankingList.innerHTML = data.map((item, i) => {
    const rank = i + 1;
    const topClass = getTopClass(rank);
    const pc = PLATFORM_CLASS[item.platform] || '';
    const coverChar = item.title.charAt(0);

    return `
      <div class="rank-card${topClass}" style="animation-delay:${i * 0.04}s" data-id="${item.id}">
        <div class="rank-num">${getRankHTML(rank)}</div>
        <div class="cover" style="background:${item.coverGrad}">
          ${coverChar}
          <span class="cover-episodes">${item.episodes}集</span>
        </div>
        <div class="card-info">
          <div class="card-title">
            ${item.title}
            ${getTrendHTML(item.trend)}
          </div>
          <div class="card-desc">${item.desc}</div>
          <div class="card-meta">
            <span class="badge badge-platform ${pc}">${item.platform}</span>
            <span class="badge badge-category">${item.category}</span>
          </div>
        </div>
        <div class="card-stats">
          <div class="score-row">
            <span class="score-value">${item.score.toFixed(1)}</span>
            <span class="score-max">/10</span>
          </div>
          <div class="score-stars">${getStars(item.score)}</div>
          <div class="views">👁 ${formatViews(item.views)} 播放</div>
          <div class="views">📺 ${item.episodes}/${item.totalEpisodes} 集</div>
        </div>
      </div>
    `;
  }).join('');
}

// ===== EVENT HANDLERS =====
function setActiveChip(containerId, value) {
  const container = document.getElementById(containerId);
  container.querySelectorAll('.chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.value === value);
  });
}

// Platform chips
document.getElementById('platformChips').addEventListener('click', (e) => {
  if (!e.target.classList.contains('chip')) return;
  state.platform = e.target.dataset.value;
  setActiveChip('platformChips', state.platform);
  updateHash();
  render();
});

// Category chips
document.getElementById('categoryChips').addEventListener('click', (e) => {
  if (!e.target.classList.contains('chip')) return;
  state.category = e.target.dataset.value;
  setActiveChip('categoryChips', state.category);
  updateHash();
  render();
});

// Sort buttons
document.getElementById('sortGroup').addEventListener('click', (e) => {
  const btn = e.target.closest('.sort-btn');
  if (!btn) return;

  const field = btn.dataset.sort;

  if (state.sortField === field) {
    // Toggle order
    state.sortOrder = state.sortOrder === 'desc' ? 'asc' : 'desc';
  } else {
    state.sortField = field;
    state.sortOrder = 'desc';
  }

  // Update active state and arrows
  document.querySelectorAll('#sortGroup .sort-btn').forEach(b => {
    b.classList.remove('active');
    b.querySelector('.sort-arrow').textContent = '↓';
  });
  btn.classList.add('active');
  btn.querySelector('.sort-arrow').textContent = state.sortOrder === 'desc' ? '↓' : '↑';

  updateHash();
  render();
});

// Search input
let searchTimeout;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    state.searchQuery = searchInput.value;
    updateHash();
    render();
  }, 250);
});

// Clear all filters
clearFilterBtn.addEventListener('click', () => {
  state.platform = '全部';
  state.category = '全部';
  state.searchQuery = '';
  searchInput.value = '';
  setActiveChip('platformChips', '全部');
  setActiveChip('categoryChips', '全部');
  clearFilterBtn.style.display = 'none';
  updateHash();
  render();
});

// ===== URL HASH SYNC =====
function updateHash() {
  const params = [];
  if (state.platform !== '全部') params.push('platform=' + encodeURIComponent(state.platform));
  if (state.category !== '全部') params.push('category=' + encodeURIComponent(state.category));
  if (state.sortField !== 'score') params.push('sort=' + state.sortField);
  if (state.sortOrder !== 'desc') params.push('order=asc');
  if (state.searchQuery.trim()) params.push('search=' + encodeURIComponent(state.searchQuery.trim()));

  const hash = params.length ? '#' + params.join('&') : '';
  if (window.location.hash !== hash) {
    history.replaceState(null, '', hash || window.location.pathname);
  }
}

function loadFromHash() {
  const hash = window.location.hash.replace('#', '');
  if (!hash) return;

  const params = new URLSearchParams(hash);
  if (params.has('platform')) state.platform = params.get('platform');
  if (params.has('category')) state.category = params.get('category');
  if (params.has('sort')) state.sortField = params.get('sort');
  if (params.has('order')) state.sortOrder = params.get('order');
  if (params.has('search')) {
    state.searchQuery = params.get('search');
    searchInput.value = state.searchQuery;
  }

  // Sync UI
  setActiveChip('platformChips', state.platform);
  setActiveChip('categoryChips', state.category);

  document.querySelectorAll('#sortGroup .sort-btn').forEach(b => {
    const isActive = b.dataset.sort === state.sortField;
    b.classList.toggle('active', isActive);
    b.querySelector('.sort-arrow').textContent = state.sortOrder === 'desc' ? '↓' : '↑';
    if (!isActive) b.querySelector('.sort-arrow').textContent = '↓';
  });
}

// ===== INIT =====
function init() {
  loadFromHash();
  render();
}

// Run
init();

// Handle browser back/forward
window.addEventListener('hashchange', () => {
  loadFromHash();
  render();
});

console.log('🤖 AI漫剧风云榜 已就绪');
console.log('  收录 ' + RAW_DATA.length + ' 部作品 | ' + new Set(RAW_DATA.map(d => d.platform)).size + ' 个平台 | ' + new Set(RAW_DATA.map(d => d.category)).size + ' 个分类');
