<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食转转乐 - 解决你的选择困难症</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* 头部样式 */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* 导航标签 */
        .nav-tabs {
            display: flex;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .nav-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            color: white;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 面板样式 */
        .panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 转盘容器 */
        .spinner-container {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 25px;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #ff6b6b;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,0.3));
            z-index: 10;
        }

        .center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ff8e53);
            border: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255,107,107,0.5);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .center-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 8px 30px rgba(255,107,107,0.6);
        }

        .center-btn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .center-btn.spinning {
            pointer-events: none;
            opacity: 0.7;
        }

        /* 结果显示 */
        .result-box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: bounceIn 0.5s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .result-box h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .result-box .result-text {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .result-btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .result-btn.accept {
            background: white;
            color: #667eea;
        }

        .result-btn.reject {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        .result-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 选项管理 */
        .options-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .options-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .add-option-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-option-form input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .add-option-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-option-form button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .add-option-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .options-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .option-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background: linear-gradient(135deg, #f5f7fa, #e8ecf1);
            border-radius: 20px;
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
        }

        .option-tag:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .option-tag .delete-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .option-tag:hover .delete-btn {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        /* 菜单识别面板 */
        .menu-panel {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .upload-area {
            border: 3px dashed #ddd;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102,126,234,0.05);
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: rgba(102,126,234,0.1);
        }

        .upload-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .upload-area h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .upload-area p {
            color: #999;
            font-size: 14px;
        }

        #menuImageInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-bottom: 20px;
        }

        .preview-container.show {
            display: block;
        }

        .preview-image {
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .analyze-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 推荐结果 */
        .recommendations {
            display: none;
            margin-top: 25px;
        }

        .recommendations.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .recommendations h3 {
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .recommendation-card {
            background: linear-gradient(135deg, #f5f7fa, #e8ecf1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .recommendation-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .recommendation-card .dish-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .recommendation-card .dish-reason {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .recommendation-card .dish-tags {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .dish-tag {
            padding: 4px 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 12px;
            font-size: 12px;
        }

        /* 历史记录 */
        .history-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .history-section h3 {
            color: #333;
            margin-bottom: 15px;
        }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item .time {
            color: #999;
            font-size: 12px;
        }

        .history-item .choice {
            font-weight: 500;
            color: #667eea;
        }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-width: 400px) {
            .header h1 {
                font-size: 2em;
            }

            .wheel-wrapper {
                width: 280px;
                height: 280px;
            }

            .center-btn {
                width: 65px;
                height: 65px;
                font-size: 14px;
            }

            .result-actions {
                flex-direction: column;
            }

            .result-btn {
                width: 100%;
            }
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        /* 预设选项按钮 */
        .preset-section {
            margin-bottom: 20px;
        }

        .preset-section h4 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .preset-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .preset-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #f5f7fa, #e8ecf1);
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
        }

        .preset-btn:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-2px);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 30px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🍽️ 美食转转乐</h1>
            <p>告别选择困难，一键决定今天吃什么</p>
        </div>

        <!-- 导航标签 -->
        <div class="nav-tabs">
            <div class="nav-tab active" data-tab="spinner">🎯 转盘选择</div>
            <div class="nav-tab" data-tab="menu">📸 菜单推荐</div>
        </div>

        <!-- 转盘选择面板 -->
        <div class="panel active" id="spinnerPanel">
            <div class="spinner-container">
                <!-- 结果显示 -->
                <div class="result-box" id="resultBox">
                    <h3>🎉 恭喜你抽中了</h3>
                    <div class="result-text" id="resultText">火锅</div>
                    <div class="result-actions">
                        <button class="result-btn accept" onclick="acceptResult()">✅ 就吃这个</button>
                        <button class="result-btn reject" onclick="rejectResult()">🔄 重新选择</button>
                    </div>
                </div>

                <!-- 转盘 -->
                <div class="wheel-wrapper">
                    <div class="pointer"></div>
                    <canvas id="wheelCanvas" width="320" height="320"></canvas>
                    <button class="center-btn" id="spinBtn" onclick="spin()">开始<br>选择</button>
                </div>

                <!-- 预设选项 -->
                <div class="preset-section">
                    <h4>💡 快速添加</h4>
                    <div class="preset-btns">
                        <button class="preset-btn" onclick="addPreset('火锅')">火锅</button>
                        <button class="preset-btn" onclick="addPreset('烧烤')">烧烤</button>
                        <button class="preset-btn" onclick="addPreset('日料')">日料</button>
                        <button class="preset-btn" onclick="addPreset('韩餐')">韩餐</button>
                        <button class="preset-btn" onclick="addPreset('西餐')">西餐</button>
                        <button class="preset-btn" onclick="addPreset('快餐')">快餐</button>
                        <button class="preset-btn" onclick="addPreset('川菜')">川菜</button>
                        <button class="preset-btn" onclick="addPreset('粤菜')">粤菜</button>
                        <button class="preset-btn" onclick="addPreset('小吃')">小吃</button>
                        <button class="preset-btn" onclick="addPreset('奶茶')">奶茶</button>
                    </div>
                </div>
            </div>

            <!-- 选项管理 -->
            <div class="options-section">
                <h3>⚙️ 自定义选项</h3>
                <div class="add-option-form">
                    <input type="text" id="newOption" placeholder="输入新的选项..." maxlength="10">
                    <button onclick="addOption()">添加</button>
                </div>
                <div class="options-list" id="optionsList"></div>
            </div>

            <!-- 历史记录 -->
            <div class="history-section">
                <h3>📝 今日选择记录</h3>
                <div class="history-list" id="historyList">
                    <div class="empty-state">
                        <div class="icon">🎲</div>
                        <p>还没有选择记录，快去转一转吧！</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 菜单推荐面板 -->
        <div class="panel" id="menuPanel">
            <div class="menu-panel">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📷</div>
                    <h3>上传菜单照片</h3>
                    <p>点击或拖拽图片到此处</p>
                    <p style="margin-top: 10px; font-size: 12px;">支持 JPG、PNG 格式</p>
                </div>
                <input type="file" id="menuImageInput" accept="image/*">

                <div class="preview-container" id="previewContainer">
                    <img class="preview-image" id="previewImage" src="" alt="菜单预览">
                    <button class="analyze-btn" id="analyzeBtn" onclick="analyzeMenu()">🔍 智能分析菜单</button>
                </div>

                <!-- 加载状态 -->
                <div class="loading" id="loadingState">
                    <div class="spinner"></div>
                    <p>正在分析菜单...</p>
                </div>

                <!-- 推荐结果 -->
                <div class="recommendations" id="recommendations">
                    <h3>🌟 为你推荐以下菜品</h3>
                    <div id="recommendationList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script>
        // ==================== 全局变量 ====================
        let options = ['火锅', '烧烤', '日料', '韩餐', '西餐', '快餐'];
        let history = [];
        let currentAngle = 0;
        let isSpinning = false;
        let currentResult = '';

        // 颜色配置
        const colors = [
            '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
            '#FFEAA7', '#DDA0DD', '#98D8C8', '#F7DC6F',
            '#BB8FCE', '#85C1E9', '#F8B500', '#00CED1'
        ];

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            initWheel();
            renderOptions();
            initTabs();
            initUpload();
        });

        // ==================== 标签切换 ====================
        function initTabs() {
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    const panels = document.querySelectorAll('.panel');
                    panels.forEach(p => p.classList.remove('active'));
                    
                    const targetPanel = document.getElementById(this.dataset.tab + 'Panel');
                    targetPanel.classList.add('active');
                });
            });
        }

        // ==================== 转盘绘制 ====================
        function initWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            drawWheel(ctx, canvas.width, canvas.height);
        }

        function drawWheel(ctx, width, height) {
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) / 2 - 10;

            ctx.clearRect(0, 0, width, height);
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentAngle * Math.PI / 180);
            ctx.translate(-centerX, -centerY);

            if (options.length === 0) {
                // 空状态
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#f0f0f0';
                ctx.fill();
                ctx.fillStyle = '#999';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('请添加选项', centerX, centerY);
                ctx.restore();
                return;
            }

            const sliceAngle = (2 * Math.PI) / options.length;

            options.forEach((option, index) => {
                const startAngle = index * sliceAngle - Math.PI / 2;
                const endAngle = startAngle + sliceAngle;

                // 绘制扇形
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();

                // 绘制边框
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 绘制文字
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 3;
                ctx.fillText(option, radius - 20, 5);
                ctx.restore();
            });

            ctx.restore();
        }

        // ==================== 转盘旋转 ====================
        function spin() {
            if (isSpinning || options.length === 0) {
                if (options.length === 0) {
                    showToast('请先添加选项！');
                }
                return;
            }

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.classList.add('spinning');
            spinBtn.innerHTML = '转动中...';

            // 隐藏之前的结果
            document.getElementById('resultBox').classList.remove('show');

            // 随机选择结果
            const resultIndex = Math.floor(Math.random() * options.length);
            currentResult = options[resultIndex];

            // 计算旋转角度
            const sliceAngle = 360 / options.length;
            const targetAngle = 360 - (resultIndex * sliceAngle + sliceAngle / 2);
            const spins = 5 + Math.random() * 3; // 5-8圈
            const totalRotation = spins * 360 + targetAngle - (currentAngle % 360);

            // 动画
            const startTime = Date.now();
            const duration = 4000;
            const startAngle = currentAngle;

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // 缓动函数
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = startAngle + totalRotation * easeOut;

                const canvas = document.getElementById('wheelCanvas');
                const ctx = canvas.getContext('2d');
                drawWheel(ctx, canvas.width, canvas.height);

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // 动画结束
                    isSpinning = false;
                    spinBtn.classList.remove('spinning');
                    spinBtn.innerHTML = '开始<br>选择';
                    showResult();
                }
            }

            animate();
        }

        function showResult() {
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');
            resultText.textContent = currentResult;
            resultBox.classList.add('show');
        }

        function acceptResult() {
            addToHistory(currentResult, true);
            showToast(`太棒了！今天就吃${currentResult}！🎉`);
            document.getElementById('resultBox').classList.remove('show');
        }

        function rejectResult() {
            addToHistory(currentResult, false);
            // 移除当前选项
            const index = options.indexOf(currentResult);
            if (index > -1) {
                options.splice(index, 1);
                renderOptions();
                initWheel();
            }
            document.getElementById('resultBox').classList.remove('show');
            
            if (options.length === 0) {
                showToast('所有选项都已排除，请重新添加！');
            } else {
                showToast(`已排除${currentResult}，重新选择中...`);
                setTimeout(() => spin(), 500);
            }
        }

        // ==================== 选项管理 ====================
        function addOption() {
            const input = document.getElementById('newOption');
            const value = input.value.trim();
            
            if (!value) {
                showToast('请输入选项内容');
                return;
            }
            
            if (options.includes(value)) {
                showToast('该选项已存在');
                return;
            }
            
            if (options.length >= 12) {
                showToast('最多支持12个选项');
                return;
            }
            
            options.push(value);
            input.value = '';
            renderOptions();
            initWheel();
            showToast(`已添加"${value}"`);
        }

        function addPreset(value) {
            if (options.includes(value)) {
                showToast(`"${value}"已在选项中`);
                return;
            }
            
            if (options.length >= 12) {
                showToast('最多支持12个选项');
                return;
            }
            
            options.push(value);
            renderOptions();
            initWheel();
            showToast(`已添加"${value}"`);
        }

        function removeOption(index) {
            const removed = options[index];
            options.splice(index, 1);
            renderOptions();
            initWheel();
            showToast(`已移除"${removed}"`);
        }

        function renderOptions() {
            const container = document.getElementById('optionsList');
            
            if (options.length === 0) {
                container.innerHTML = '<div class="empty-state" style="width: 100%; padding: 20px;"><p>暂无选项，请添加</p></div>';
                return;
            }
            
            container.innerHTML = options.map((opt, index) => `
                <div class="option-tag">
                    <span>${opt}</span>
                    <button class="delete-btn" onclick="removeOption(${index})">✕</button>
                </div>
            `).join('');
        }

        // ==================== 历史记录 ====================
        function addToHistory(choice, accepted) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            history.unshift({
                choice: choice,
                time: timeStr,
                accepted: accepted
            });
            
            // 只保留最近10条
            if (history.length > 10) {
                history.pop();
            }
            
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            
            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🎲</div>
                        <p>还没有选择记录，快去转一转吧！</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = history.map(item => `
                <div class="history-item">
                    <div>
                        <span class="time">${item.time}</span>
                        <span class="choice" style="margin-left: 10px;">${item.choice}</span>
                    </div>
                    <span style="color: ${item.accepted ? '#4CAF50' : '#ff6b6b'}">
                        ${item.accepted ? '✅ 已采纳' : '❌ 已排除'}
                    </span>
                </div>
            `).join('');
        }

        // ==================== 菜单上传 ====================
        function initUpload() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('menuImageInput');

            uploadArea.addEventListener('click', () => fileInput.click());
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            });
            
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showToast('请上传图片文件');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewImage').src = e.target.result;
                document.getElementById('previewContainer').classList.add('show');
                document.getElementById('uploadArea').style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // ==================== 菜单分析（模拟AI） ====================
        function analyzeMenu() {
            const loadingState = document.getElementById('loadingState');
            const recommendations = document.getElementById('recommendations');
            const analyzeBtn = document.getElementById('analyzeBtn');
            
            loadingState.classList.add('show');
            analyzeBtn.disabled = true;
            recommendations.classList.remove('show');
            
            // 模拟AI分析延迟
            setTimeout(() => {
                loadingState.classList.remove('show');
                analyzeBtn.disabled = false;
                showRecommendations();
            }, 2000);
        }

        function showRecommendations() {
            const container = document.getElementById('recommendationList');
            
            // 模拟推荐数据
            const recommendations = [
                {
                    name: '招牌红烧肉',
                    reason: '根据您的口味偏好，这道菜肥而不腻，入口即化，是本店的必点招牌菜，强烈推荐！',
                    tags: ['招牌', '热销', '下饭']
                },
                {
                    name: '清蒸鲈鱼',
                    reason: '清淡健康，富含优质蛋白质，适合注重养生的您，搭配特制酱汁鲜美无比。',
                    tags: ['健康', '清淡', '高蛋白']
                },
                {
                    name: '蒜蓉西兰花',
                    reason: '营养均衡的素菜选择，口感爽脆，蒜香浓郁，可以很好地平衡荤菜。',
                    tags: ['素菜', '营养', '爽口']
                }
            ];
            
            container.innerHTML = recommendations.map(item => `
                <div class="recommendation-card">
                    <div class="dish-name">${item.name}</div>
                    <div class="dish-reason">${item.reason}</div>
                    <div class="dish-tags">
                        ${item.tags.map(tag => `<span class="dish-tag">${tag}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('recommendations').classList.add('show');
            showToast('分析完成！为您推荐了3道菜品');
        }

        // ==================== Toast 提示 ====================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ==================== 键盘事件 ====================
        document.getElementById('newOption').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addOption();
            }
        });
    </script>
</body>
</html>
