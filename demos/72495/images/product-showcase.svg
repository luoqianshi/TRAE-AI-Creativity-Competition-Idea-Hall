<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="40" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">回声副屏桌面 - 17 Widgets Grid Dashboard</text>

  <!-- Main Dashboard Container -->
  <rect x="50" y="70" width="1100" height="575" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>

  <!-- Widget: Clock (top-left, large) -->
  <rect x="70" y="90" width="340" height="200" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="90" y="120" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">CLOCK</text>
  <text x="240" y="180" font-family="'Courier New', monospace" font-size="52" fill="#f8fafc" text-anchor="middle" filter="url(#glow)">14:32</text>
  <text x="240" y="220" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">2026年7月5日 星期日</text>
  <text x="240" y="250" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#3b82f6" text-anchor="middle">农历 六月二十一</text>
  <circle cx="100" cy="265" r="4" fill="#22c55e"/>
  <text x="112" y="270" font-family="sans-serif" font-size="11" fill="#64748b">系统在线</text>

  <!-- Widget: Weather (top-right) -->
  <rect x="430" y="90" width="280" height="200" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="450" y="120" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">WEATHER</text>
  <text x="570" y="170" font-family="sans-serif" font-size="48" fill="#fbbf24" text-anchor="middle">☀</text>
  <text x="570" y="210" font-family="'Courier New', monospace" font-size="36" fill="#f8fafc" text-anchor="middle">28°C</text>
  <text x="570" y="240" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">晴 · 杭州</text>
  <text x="570" y="265" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">湿度 45% · 风速 3km/h</text>

  <!-- Widget: Pomodoro (middle-left) -->
  <rect x="730" y="90" width="220" height="200" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="750" y="120" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">POMODORO</text>
  <circle cx="840" cy="185" r="55" fill="none" stroke="#334155" stroke-width="4"/>
  <circle cx="840" cy="185" r="55" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="289" stroke-dashoffset="72" transform="rotate(-90 840 185)"/>
  <text x="840" y="180" font-family="'Courier New', monospace" font-size="28" fill="#f8fafc" text-anchor="middle">18:42</text>
  <text x="840" y="205" font-family="sans-serif" font-size="11" fill="#8b5cf6" text-anchor="middle">专注中</text>
  <circle cx="840" cy="260" r="3" fill="#8b5cf6"/>

  <!-- Widget: System Monitor (top-right corner) -->
  <rect x="970" y="90" width="160" height="200" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="990" y="120" font-family="sans-serif" font-size="11" fill="#64748b">SYSTEM</text>
  <text x="990" y="145" font-family="sans-serif" font-size="10" fill="#64748b">CPU</text>
  <rect x="990" y="152" width="120" height="6" rx="3" fill="#334155"/>
  <rect x="990" y="152" width="82" height="6" rx="3" fill="#22c55e"/>
  <text x="1115" y="158" font-family="'Courier New', monospace" font-size="10" fill="#22c55e" text-anchor="end">68%</text>
  <text x="990" y="180" font-family="sans-serif" font-size="10" fill="#64748b">MEM</text>
  <rect x="990" y="187" width="120" height="6" rx="3" fill="#334155"/>
  <rect x="990" y="187" width="54" height="6" rx="3" fill="#3b82f6"/>
  <text x="1115" y="193" font-family="'Courier New', monospace" font-size="10" fill="#3b82f6" text-anchor="end">45%</text>
  <text x="990" y="215" font-family="sans-serif" font-size="10" fill="#64748b">GPU</text>
  <rect x="990" y="222" width="120" height="6" rx="3" fill="#334155"/>
  <rect x="990" y="222" width="36" height="6" rx="3" fill="#fbbf24"/>
  <text x="1115" y="228" font-family="'Courier New', monospace" font-size="10" fill="#fbbf24" text-anchor="end">30%</text>
  <!-- Mini chart -->
  <polyline points="990,270 1010,260 1030,255 1050,250 1070,258 1090,245 1110,250" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>

  <!-- Widget: Dev Tools (bottom-left) -->
  <rect x="70" y="310" width="340" height="160" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="90" y="340" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">DEV TOOLS</text>
  <!-- Tool tabs -->
  <rect x="90" y="355" width="70" height="28" rx="6" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="125" y="374" font-family="sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">JSON</text>
  <rect x="170" y="355" width="70" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="205" y="374" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Base64</text>
  <rect x="250" y="355" width="70" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="285" y="374" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">UUID</text>
  <rect x="330" y="355" width="70" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1"/>
  <text x="365" y="374" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Hash</text>
  <!-- Code preview -->
  <rect x="90" y="395" width="300" height="60" rx="6" fill="#0f172a"/>
  <text x="100" y="412" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">{</text>
  <text x="110" y="427" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">"name": "echo",</text>
  <text x="110" y="442" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">"version": "0.1.2"</text>
  <text x="100" y="457" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">}</text>

  <!-- Widget: Countdown (bottom-middle) -->
  <rect x="430" y="310" width="280" height="160" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="450" y="340" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">COUNTDOWN</text>
  <text x="570" y="380" font-family="'Courier New', monospace" font-size="28" fill="#f8fafc" text-anchor="middle">42天18时</text>
  <text x="570" y="408" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle">考研倒计时</text>
  <rect x="450" y="425" width="240" height="4" rx="2" fill="#334155"/>
  <rect x="450" y="425" width="96" height="4" rx="2" fill="#f59e0b"/>

  <!-- Widget: Sticky Note (bottom-right) -->
  <rect x="730" y="310" width="220" height="160" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="750" y="340" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#64748b">STICKY NOTE</text>
  <rect x="750" y="355" width="180" height="95" rx="6" fill="#fef9c3" fill-opacity="0.15"/>
  <text x="760" y="375" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#fef9c3">- 完成 PRD 完善</text>
  <text x="760" y="395" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#fef9c3">- naive-ui 按需导入</text>
  <text x="760" y="415" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#fef9c3">- formatTime 合并</text>
  <text x="760" y="435" font-family="'Noto Sans CJK SC', sans-serif" font-size="12" fill="#fef9c3" opacity="0.6">- 编写测试...</text>

  <!-- Widget: Quick Launch (far bottom-right) -->
  <rect x="970" y="310" width="160" height="160" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <text x="990" y="340" font-family="sans-serif" font-size="11" fill="#64748b">QUICK LAUNCH</text>
  <rect x="990" y="355" width="55" height="40" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="1017" y="380" font-family="sans-serif" font-size="16" fill="#3b82f6" text-anchor="middle">⚡</text>
  <rect x="1055" y="355" width="55" height="40" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
  <text x="1082" y="380" font-family="sans-serif" font-size="16" fill="#8b5cf6" text-anchor="middle">📊</text>
  <rect x="990" y="405" width="55" height="40" rx="8" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <text x="1017" y="430" font-family="sans-serif" font-size="16" fill="#22c55e" text-anchor="middle">🔧</text>
  <rect x="1055" y="405" width="55" height="40" rx="8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="1082" y="430" font-family="sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">📝</text>

  <!-- Bottom Status Bar -->
  <rect x="70" y="490" width="1060" height="50" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="1"/>
  <circle cx="90" cy="515" r="4" fill="#22c55e"/>
  <text x="102" y="520" font-family="sans-serif" font-size="12" fill="#64748b">17 Widgets Active</text>
  <text x="280" y="520" font-family="sans-serif" font-size="12" fill="#64748b">|</text>
  <text x="295" y="520" font-family="sans-serif" font-size="12" fill="#3b82f6">Electron 41 + Vue 3 + Pinia 3</text>
  <text x="530" y="520" font-family="sans-serif" font-size="12" fill="#64748b">|</text>
  <text x="545" y="520" font-family="sans-serif" font-size="12" fill="#8b5cf6">Powered by TRAE</text>
  <text x="1100" y="520" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="end">v0.1.2</text>

  <!-- Grid layout indicator -->
  <text x="70" y="570" font-family="sans-serif" font-size="10" fill="#475569">← Grid Layout: 12 columns × drag & resize →</text>

  <!-- Tech badges -->
  <rect x="70" y="590" width="80" height="24" rx="12" fill="#42b883" fill-opacity="0.15" stroke="#42b883" stroke-width="1"/>
  <text x="110" y="606" font-family="sans-serif" font-size="10" fill="#42b883" text-anchor="middle">Vue 3</text>
  <rect x="160" y="590" width="80" height="24" rx="12" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="200" y="606" font-family="sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">TypeScript</text>
  <rect x="250" y="590" width="80" height="24" rx="12" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
  <text x="290" y="606" font-family="sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">Electron</text>
  <rect x="340" y="590" width="80" height="24" rx="12" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="380" y="606" font-family="sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">Pinia</text>
  <rect x="430" y="590" width="90" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="475" y="606" font-family="sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">Naive UI</text>
  <rect x="530" y="590" width="100" height="24" rx="12" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
  <text x="580" y="606" font-family="sans-serif" font-size="10" fill="#ec4899" text-anchor="middle">Vitest 750+</text>
</svg>
