<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs>
    <linearGradient id="bgG3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="beforeG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="afterG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="600" fill="url(#bgG3)"/>

  <!-- Title -->
  <text x="550" y="40" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" fill="#f8fafc" text-anchor="middle" font-weight="bold">代码重构影响图谱</text>
  <text x="550" y="65" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">PRD 完善 → 代码优化 → 测试覆盖 → 安全审查 → 包体积缩减</text>

  <!-- LEFT SIDE: Before (Problems) -->
  <rect x="40" y="90" width="480" height="490" rx="12" fill="url(#beforeG)" stroke="#ef4444" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="40" y="90" width="480" height="36" rx="12" fill="#ef4444" fill-opacity="0.2"/>
  <text x="280" y="113" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#ef4444" text-anchor="middle" font-weight="bold">重构前 - 存在的问题</text>

  <!-- Problem 1 -->
  <rect x="60" y="140" width="440" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="80" cy="160" r="8" fill="#ef4444"/>
  <text x="80" y="164" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">1</text>
  <text x="100" y="162" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">naive-ui 全量导入</text>
  <text x="100" y="180" font-family="sans-serif" font-size="11" fill="#94a3b8">app.use(naive) 加载全部 100+ 组件</text>
  <text x="100" y="195" font-family="'Courier New', monospace" font-size="10" fill="#ef4444">chunk: 2.5MB（项目仅用 29 个）</text>

  <!-- Problem 2 -->
  <rect x="60" y="220" width="440" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="80" cy="240" r="8" fill="#ef4444"/>
  <text x="80" y="244" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">2</text>
  <text x="100" y="242" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">fundebug 静态导入</text>
  <text x="100" y="260" font-family="sans-serif" font-size="11" fill="#94a3b8">开发环境也加载错误监控模块</text>
  <text x="100" y="275" font-family="'Courier New', monospace" font-size="10" fill="#ef4444">index chunk: 234KB（含 fundebug ~48KB）</text>

  <!-- Problem 3 -->
  <rect x="60" y="300" width="440" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="80" cy="320" r="8" fill="#ef4444"/>
  <text x="80" y="324" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">3</text>
  <text x="100" y="322" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">formatTime 三处重复实现</text>
  <text x="100" y="340" font-family="sans-serif" font-size="11" fill="#94a3b8">useTimer.ts / clipboardUtils.ts / StopwatchWidget.vue</text>
  <text x="100" y="355" font-family="'Courier New', monospace" font-size="10" fill="#ef4444">3 份相同的 padStart + formatTime 逻辑</text>

  <!-- Problem 4 -->
  <rect x="60" y="380" width="440" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="80" cy="400" r="8" fill="#ef4444"/>
  <text x="80" y="404" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">4</text>
  <text x="100" y="402" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">useLocalStorage / useSessionStorage 重复</text>
  <text x="100" y="420" font-family="sans-serif" font-size="11" fill="#94a3b8">两个 composable ~89 行几乎完全相同</text>
  <text x="100" y="435" font-family="'Courier New', monospace" font-size="10" fill="#ef4444">代码重复率 > 90%</text>

  <!-- Problem 5: PRD issues -->
  <rect x="60" y="460" width="440" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="80" cy="480" r="8" fill="#ef4444"/>
  <text x="80" y="484" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">5</text>
  <text x="100" y="482" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">PRD 文档不一致</text>
  <text x="100" y="500" font-family="sans-serif" font-size="11" fill="#94a3b8">Sentry vs fundebug | hasSettings 矛盾 | HOLIDAY_DATA 过期</text>
  <text x="100" y="515" font-family="'Courier New', monospace" font-size="10" fill="#ef4444">5 处 PRD 与实际代码不符</text>

  <!-- Arrow -->
  <polygon points="540,300 560,290 560,310" fill="#fbbf24"/>
  <line x1="525" y1="300" x2="560" y2="300" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,3"/>
  <text x="542" y="285" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">TRAE</text>
  <text x="542" y="330" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">重构</text>

  <!-- RIGHT SIDE: After (Solutions) -->
  <rect x="580" y="90" width="480" height="490" rx="12" fill="url(#afterG)" stroke="#22c55e" stroke-width="1" stroke-dasharray="6,3"/>
  <rect x="580" y="90" width="480" height="36" rx="12" fill="#22c55e" fill-opacity="0.2"/>
  <text x="820" y="113" font-family="'Noto Sans CJK SC', sans-serif" font-size="15" fill="#22c55e" text-anchor="middle" font-weight="bold">重构后 - TRAE 驱动的解决方案</text>

  <!-- Solution 1 -->
  <rect x="600" y="140" width="440" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="620" cy="160" r="8" fill="#22c55e"/>
  <text x="620" y="164" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">1</text>
  <text x="640" y="162" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">naive-ui 按需导入</text>
  <text x="640" y="180" font-family="sans-serif" font-size="11" fill="#94a3b8">create({ components: [29个组件] })</text>
  <text x="640" y="195" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">chunk: 1.5MB（-963KB, -39%）</text>

  <!-- Solution 2 -->
  <rect x="600" y="220" width="440" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="620" cy="240" r="8" fill="#22c55e"/>
  <text x="620" y="244" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">2</text>
  <text x="640" y="242" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">fundebug 动态加载</text>
  <text x="640" y="260" font-family="sans-serif" font-size="11" fill="#94a3b8">import() 懒加载 + 懒代理 notifyError</text>
  <text x="640" y="275" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">index chunk: 212KB（-22KB）</text>

  <!-- Solution 3 -->
  <rect x="600" y="300" width="440" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="620" cy="320" r="8" fill="#22c55e"/>
  <text x="620" y="324" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">3</text>
  <text x="640" y="322" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">formatTime 统一到 utils/format.ts</text>
  <text x="640" y="340" font-family="sans-serif" font-size="11" fill="#94a3b8">padZero + formatTime + formatTimeWithMs</text>
  <text x="640" y="355" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">1 处实现，3 处引用</text>

  <!-- Solution 4 -->
  <rect x="600" y="380" width="440" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="620" cy="400" r="8" fill="#22c55e"/>
  <text x="620" y="404" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">4</text>
  <text x="640" y="402" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">createStorage 工厂模式</text>
  <text x="640" y="420" font-family="sans-serif" font-size="11" fill="#94a3b8">useLocalStorage/useSessionStorage 委托工厂</text>
  <text x="640" y="435" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">消除 ~89 行重复代码</text>

  <!-- Solution 5: PRD fixes -->
  <rect x="600" y="460" width="440" height="70" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="620" cy="480" r="8" fill="#22c55e"/>
  <text x="620" y="484" font-family="sans-serif" font-size="10" fill="#fff" text-anchor="middle">5</text>
  <text x="640" y="482" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">PRD 文档完善</text>
  <text x="640" y="500" font-family="sans-serif" font-size="11" fill="#94a3b8">Sentry→fundebug | hasSettings修正 | 假期策略</text>
  <text x="640" y="515" font-family="'Courier New', monospace" font-size="10" fill="#22c55e">5 处修正 + a11y/迁移/离线降级</text>

  <!-- Bottom: Test & Security -->
  <rect x="580" y="540" width="480" height="40" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="600" y="560" font-family="sans-serif" font-size="11" fill="#22c55e">750 tests passed</text>
  <text x="730" y="560" font-family="sans-serif" font-size="11" fill="#3b82f6">0 TS errors</text>
  <text x="860" y="560" font-family="sans-serif" font-size="11" fill="#f59e0b">0 vulnerabilities</text>
</svg>
