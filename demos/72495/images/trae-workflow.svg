<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="url(#bgG)"/>

  <!-- Title -->
  <text x="600" y="45" font-family="'Noto Sans CJK SC', sans-serif" font-size="24" fill="#f8fafc" text-anchor="middle" font-weight="bold">TRAE 全程驱动开发流程</text>
  <text x="600" y="70" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#64748b" text-anchor="middle">AGENTS.md Refactoring Skill Rules: brainstorming → writing-plans → TDD → security-review</text>

  <!-- Step 1: Brainstorming -->
  <rect x="60" y="110" width="220" height="140" rx="16" fill="#1e293b" stroke="url(#blueG)" stroke-width="2"/>
  <rect x="60" y="110" width="220" height="40" rx="16" fill="url(#blueG)" fill-opacity="0.2"/>
  <text x="170" y="136" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#3b82f6" text-anchor="middle" font-weight="bold">Step 1</text>
  <text x="170" y="170" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">brainstorming</text>
  <text x="170" y="195" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">探索重构方案</text>
  <text x="170" y="213" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">评估多种实现路径</text>
  <text x="170" y="233" font-family="sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">输出: 实现方案</text>

  <!-- Arrow 1 -->
  <polygon points="285,180 305,170 305,190" fill="#3b82f6"/>
  <line x1="280" y1="180" x2="305" y2="180" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Step 2: Writing Plans -->
  <rect x="310" y="110" width="220" height="140" rx="16" fill="#1e293b" stroke="url(#purpleG)" stroke-width="2"/>
  <rect x="310" y="110" width="220" height="40" rx="16" fill="url(#purpleG)" fill-opacity="0.2"/>
  <text x="420" y="136" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#8b5cf6" text-anchor="middle" font-weight="bold">Step 2</text>
  <text x="420" y="170" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">writing-plans</text>
  <text x="420" y="195" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">拆解为可执行步骤</text>
  <text x="420" y="213" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">每步含目标+验证方式</text>
  <text x="420" y="233" font-family="sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">输出: 步骤清单</text>

  <!-- Arrow 2 -->
  <polygon points="535,180 555,170 555,190" fill="#8b5cf6"/>
  <line x1="530" y1="180" x2="555" y2="180" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Step 3: TDD -->
  <rect x="560" y="110" width="220" height="140" rx="16" fill="#1e293b" stroke="url(#greenG)" stroke-width="2"/>
  <rect x="560" y="110" width="220" height="40" rx="16" fill="url(#greenG)" fill-opacity="0.2"/>
  <text x="670" y="136" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#22c55e" text-anchor="middle" font-weight="bold">Step 3</text>
  <text x="670" y="170" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">test-driven-dev</text>
  <text x="670" y="195" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">RED → GREEN → REFACTOR</text>
  <text x="670" y="213" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">先写测试再改代码</text>
  <text x="670" y="233" font-family="sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">输出: 测试+代码</text>

  <!-- Arrow 3 -->
  <polygon points="785,180 805,170 805,190" fill="#22c55e"/>
  <line x1="780" y1="180" x2="805" y2="180" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Step 4: Security Review -->
  <rect x="810" y="110" width="220" height="140" rx="16" fill="#1e293b" stroke="url(#orangeG)" stroke-width="2"/>
  <rect x="810" y="110" width="220" height="40" rx="16" fill="url(#orangeG)" fill-opacity="0.2"/>
  <text x="920" y="136" font-family="'Noto Sans CJK SC', sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle" font-weight="bold">Step 4</text>
  <text x="920" y="170" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#f8fafc" text-anchor="middle">security-review</text>
  <text x="920" y="195" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">CSP/加密/权限检查</text>
  <text x="920" y="213" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">验证无安全漏洞</text>
  <text x="920" y="233" font-family="sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">输出: 安全报告</text>

  <!-- ssapp-testing bar (spans all) -->
  <rect x="60" y="280" width="970" height="50" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="545" y="302" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">贯穿全程: ssapp-testing Skill</text>
  <text x="545" y="320" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">查阅已知测试坑点 (import.meta.env / Pinia实例共享 / Timer冲突 / Vue nextTick / naive-ui mock)</text>

  <!-- Results section -->
  <rect x="60" y="360" width="970" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Result items -->
  <text x="90" y="390" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#f8fafc" font-weight="bold">本次重构成果</text>

  <rect x="90" y="400" width="140" height="28" rx="6" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="160" y="419" font-family="sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">750 tests passed</text>

  <rect x="245" y="400" width="120" height="28" rx="6" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="305" y="419" font-family="sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">TypeScript 0 errors</text>

  <rect x="380" y="400" width="110" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
  <text x="435" y="419" font-family="sans-serif" font-size="11" fill="#8b5cf6" text-anchor="middle">-980KB bundle</text>

  <rect x="505" y="400" width="110" height="28" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="560" y="419" font-family="sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">0 vulnerabilities</text>

  <rect x="630" y="400" width="130" height="28" rx="6" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
  <text x="695" y="419" font-family="sans-serif" font-size="11" fill="#ec4899" text-anchor="middle">24 new tests added</text>

  <rect x="775" y="400" width="130" height="28" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
  <text x="840" y="419" font-family="sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">8 tasks completed</text>

  <!-- Session IDs -->
  <text x="90" y="455" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#64748b">Session IDs:</text>
  <text x="175" y="455" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6">6a491f60d7f5485f1c7c5e8f</text>
  <text x="420" y="455" font-family="'Courier New', monospace" font-size="11" fill="#8b5cf6">6a48c021d7f5485f1c7c5a4d</text>
  <text x="665" y="455" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">6a378c0089cef5b010548bd3</text>
</svg>
