  <text x="270" y="178" font-family="'Courier New', monospace" font-size="10" fill="#569cd6">const</text>
  <text x="310" y="178" font-family="'Courier New', monospace" font-size="10" fill="#9cdcfe"> h</text>
  <text x="330" y="178" font-family="'Courier New', monospace" font-size="10" fill="#ccc"> = </text>
  <text x="355" y="178" font-family="'Courier New', monospace" font-size="10" fill="#dcdcaa">Math</text>
  <text x="385" y="178" font-family="'Courier New', monospace" font-size="10" fill="#ccc">.</text>
  <text x="390" y="178" font-family="'Courier New', monospace" font-size="10" fill="#dcdcaa">floor</text>
  <text x="425" y="178" font-family="'Courier New', monospace" font-size="10" fill="#ccc">(totalSeconds / </text>
  <text x="540" y="178" font-family="'Courier New', monospace" font-size="10" fill="#b5cea8">3600</text>
  <text x="565" y="178" font-family="'Courier New', monospace" font-size="10" fill="#ccc">)</text>
  <text x="270" y="196" font-family="'Courier New', monospace" font-size="10" fill="#569cd6">const</text>
  <text x="310" y="196" font-family="'Courier New', monospace" font-size="10" fill="#9cdcfe"> m</text>
  <text x="330" y="196" font-family="'Courier New', monospace" font-size="10" fill="#ccc"> = </text>
  <text x="355" y="196" font-family="'Courier New', monospace" font-size="10" fill="#dcdcaa">Math</text>
  <text x="385" y="196" font-family="'Courier New', monospace" font-size="10" fill="#ccc">.</text>
  <text x="390" y="196" font-family="'Courier New', monospace" font-size="10" fill="#dcdcaa">floor</text>
  <text x="425" y="196" font-family="'Courier New', monospace" font-size="10" fill="#ccc">((totalSeconds % </text>
  <text x="555" y="196" font-family="'Courier New', monospace" font-size="10" fill="#b5cea8">3600</text>
  <text x="580" y="196" font-family="'Courier New', monospace" font-size="10" fill="#ccc">) / </text>
  <text x="610" y="196" font-family="'Courier New', monospace" font-size="10" fill="#b5cea8">60</text>
  <text x="630" y="196" font-family="'Courier New', monospace" font-size="10" fill="#ccc">)</text>
  <text x="270" y="214" font-family="'Courier New', monospace" font-size="10" fill="#c586c0">if</text>
  <text x="290" y="214" font-family="'Courier New', monospace" font-size="10" fill="#ccc"> (h > </text>
  <text x="335" y="214" font-family="'Courier New', monospace" font-size="10" fill="#b5cea8">0</text>
  <text x="345" y="214" font-family="'Courier New', monospace" font-size="10" fill="#ccc">) {</text>
  <text x="282" y="232" font-family="'Courier New', monospace" font-size="10" fill="#c586c0">return</text>
  <text x="325" y="232" font-family="'Courier New', monospace" font-size="10" fill="#ccc">`${</text>
