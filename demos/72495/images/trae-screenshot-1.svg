  <text x="465" y="116" font-family="'Courier New', monospace" font-size="10" fill="#ce9178">'0'</text>
  <text x="480" y="116" font-family="'Courier New', monospace" font-size="10" fill="#ccc">)</text>
  <text x="258" y="134" font-family="'Courier New', monospace" font-size="10" fill="#ccc">}</text>
  <text x="258" y="160" font-family="'Courier New', monospace" font-size="10" fill="#569cd6">export function</text>
  <text x="350" y="160" font-family="'Courier New', monospace" font-size="10" fill="#dcdcaa">formatTime</text>
  <text x="420" y="160" font-family="'Courier New', monospace" font-size="10" fill="#ccc">(totalSeconds: </text>
  <text x="520" y="160" font-family="'Courier New', monospace" font-size="10" fill="#4ec9b0">number</text>
