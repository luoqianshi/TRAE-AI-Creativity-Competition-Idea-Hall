  <text x="270" y="116" font-family="'Courier New', monospace" font-size="10" fill="#c586c0">return</text>
  <text x="320" y="116" font-family="'Courier New', monospace" font-size="10" fill="#9cdcfe">String</text>
  <text x="360" y="116" font-family="'Courier New', monospace" font-size="10" fill="#ccc">(n).</text>
