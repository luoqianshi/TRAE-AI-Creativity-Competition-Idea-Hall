<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#b91c1c;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="520" fill="url(#bgG2)"/>

  <!-- Title -->
  <text x="500" y="40" font-family="'Noto Sans CJK SC', sans-serif" font-size="22" fill="#f8fafc" text-anchor="middle" font-weight="bold">包体积优化对比</text>
  <text x="500" y="65" font-family="'Noto Sans CJK SC', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">4 项优化措施，总节省 ~980KB</text>

  <!-- Chart area -->
  <!-- Y-axis -->
  <line x1="180" y1="100" x2="180" y2="380" stroke="#334155" stroke-width="2"/>
  <!-- X-axis -->
  <line x1="180" y1="380" x2="920" y2="380" stroke="#334155" stroke-width="2"/>

  <!-- Y-axis labels -->
  <text x="165" y="385" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">0</text>
  <text x="165" y="320" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">1MB</text>
  <text x="165" y="255" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">2MB</text>
  <text x="165" y="190" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">2.5MB</text>

  <!-- Grid lines -->
  <line x1="180" y1="320" x2="920" y2="320" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="180" y1="255" x2="920" y2="255" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="180" y1="190" x2="920" y2="190" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bar 1: naive-ui Before -->
  <rect x="220" y="190" width="60" height="190" fill="url(#redBar)" rx="4"/>
  <text x="250" y="183" font-family="'Courier New', monospace" font-size="12" fill="#ef4444" text-anchor="middle">2.5MB</text>
  <text x="250" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">naive-ui</text>
  <text x="250" y="415" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">优化前</text>

  <!-- Bar 1: naive-ui After -->
  <rect x="290" y="284" width="60" height="96" fill="url(#greenBar)" rx="4"/>
  <text x="320" y="277" font-family="'Courier New', monospace" font-size="12" fill="#22c55e" text-anchor="middle">1.5MB</text>
  <text x="320" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">naive-ui</text>
  <text x="320" y="415" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">按需导入</text>

  <!-- Reduction arrow for naive-ui -->
  <text x="275" y="240" font-family="sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle">↓</text>
  <text x="275" y="255" font-family="'Courier New', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">-963KB</text>
  <text x="275" y="270" font-family="sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">-39%</text>

  <!-- Bar 2: index.js Before -->
  <rect x="410" y="308" width="60" height="72" fill="url(#redBar)" rx="4"/>
  <text x="440" y="301" font-family="'Courier New', monospace" font-size="12" fill="#ef4444" text-anchor="middle">234KB</text>
  <text x="440" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">index.js</text>
  <text x="440" y="415" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">优化前</text>

  <!-- Bar 2: index.js After -->
  <rect x="480" y="314" width="60" height="66" fill="url(#greenBar)" rx="4"/>
  <text x="510" y="307" font-family="'Courier New', monospace" font-size="12" fill="#22c55e" text-anchor="middle">212KB</text>
  <text x="510" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">index.js</text>
  <text x="510" y="415" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">fundebug懒加载</text>

  <!-- Reduction arrow for index -->
  <text x="465" y="294" font-family="sans-serif" font-size="14" fill="#fbbf24" text-anchor="middle">↓</text>
  <text x="465" y="280" font-family="'Courier New', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">-22KB</text>

  <!-- Bar 3: formatTime dedup Before -->
  <rect x="600" y="340" width="60" height="40" fill="url(#blueBar)" rx="4"/>
  <text x="630" y="333" font-family="'Courier New', monospace" font-size="11" fill="#3b82f6" text-anchor="middle">~3KB</text>
  <text x="630" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">formatTime</text>
  <text x="630" y="415" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">3处重复</text>

  <!-- Bar 3: formatTime After -->
  <rect x="670" y="353" width="60" height="27" fill="url(#greenBar)" rx="4"/>
  <text x="700" y="346" font-family="'Courier New', monospace" font-size="11" fill="#22c55e" text-anchor="middle">~1KB</text>
  <text x="700" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">formatTime</text>
  <text x="700" y="415" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">统一到format.ts</text>

  <!-- Reduction arrow for formatTime -->
  <text x="645" y="337" font-family="sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">↓</text>

  <!-- Bar 4: useStorage Before -->
  <rect x="790" y="315" width="60" height="65" fill="url(#purpleBar)" rx="4"/>
  <text x="820" y="308" font-family="'Courier New', monospace" font-size="11" fill="#a855f7" text-anchor="middle">~178KB</text>
  <text x="820" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">useStorage</text>
  <text x="820" y="415" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">~89行重复</text>

  <!-- Bar 4: useStorage After -->
  <rect x="860" y="342" width="60" height="38" fill="url(#greenBar)" rx="4"/>
  <text x="890" y="335" font-family="'Courier New', monospace" font-size="11" fill="#22c55e" text-anchor="middle">~89KB</text>
  <text x="890" y="400" font-family="'Noto Sans CJK SC', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">useStorage</text>
  <text x="890" y="415" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">createStorage工厂</text>

  <!-- Reduction arrow for useStorage -->
  <text x="835" y="330" font-family="sans-serif" font-size="12" fill="#fbbf24" text-anchor="middle">↓</text>
  <text x="835" y="318" font-family="'Courier New', monospace" font-size="9" fill="#fbbf24" text-anchor="middle">-89行</text>

  <!-- Summary box -->
  <rect x="180" y="440" width="740" height="60" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="220" y="465" font-family="'Noto Sans CJK SC', sans-serif" font-size="14" fill="#f8fafc" font-weight="bold">总节省: ~980KB</text>
  <text x="220" y="485" font-family="sans-serif" font-size="11" fill="#94a3b8">naive-ui -963KB | fundebug -22KB | formatTime 去重 | useStorage 去重 -89行</text>

  <!-- Optimization tags -->
  <rect x="600" y="455" width="90" height="22" rx="11" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
  <text x="645" y="470" font-family="sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">按需导入</text>
  <rect x="700" y="455" width="90" height="22" rx="11" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="745" y="470" font-family="sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">动态加载</text>
  <rect x="800" y="455" width="90" height="22" rx="11" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
  <text x="845" y="470" font-family="sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">代码去重</text>
</svg>
