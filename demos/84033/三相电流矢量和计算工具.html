<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三相电流矢量和计算工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 600;
        }

        .top-buttons {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
            gap: 10px;
        }

        .save-btn, .add-btn, .reset-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .reset-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .add-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            width: 100%;
            margin: 20px 0;
        }

        .save-btn:hover, .add-btn:hover, .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .add-btn:hover {
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }

        .reset-btn:hover {
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);
        }

        .save-btn:active, .add-btn:active, .reset-btn:active {
            transform: translateY(0);
        }

        .calculation-item {
            margin-bottom: 5px;
            padding: 8px;
            background: #f8fafc;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            transition: border-color 0.3s ease;
        }

        .calculation-item:hover {
            border-color: #667eea;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .item-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .sync-btn {
            padding: 2px 8px;
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sync-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .calc-btn {
            padding: 2px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .calc-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .inputs-row {
            display: flex;
            gap: 4px;
            align-items: stretch;
            flex-wrap: nowrap;
        }

        .phase-group {
            display: flex;
            gap: 3px;
            align-items: stretch;
            padding: 4px;
            border-radius: 5px;
        }

        .phase-group.phase-a {
            background: #fef9c3;
            border: 1.5px solid #eab308;
        }

        .phase-group.phase-b {
            background: #dcfce7;
            border: 1.5px solid #22c55e;
        }

        .phase-group.phase-c {
            background: #fee2e2;
            border: 1.5px solid #ef4444;
        }

        .input-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            background: white;
            padding: 4px 3px 2px 3px;
            border-radius: 4px;
            position: relative;
            min-width: 70px;
        }

        .input-item .field-label {
            font-size: 13px;
            color: #666;
            font-weight: 600;
        }

        .input-item .field-label .unit {
            font-size: 12px;
            color: #888;
            margin-left: 2px;
            margin-top: 0;
        }

        .input-item input {
            padding: 3px 2px;
            border: 1px solid #d0d0d0;
            border-radius: 3px;
            font-size: 13px;
            width: 60px;
            text-align: center;
        }

        .input-item input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .output-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            background: #e0f2fe;
            padding: 4px 6px 2px 6px;
            border-radius: 5px;
            border: 1.5px solid #38bdf8;
            min-width: 85px;
        }

        .output-item .output-label {
            font-size: 13px;
            color: #0369a1;
            font-weight: 600;
            white-space: nowrap;
        }

        .output-item .output-value {
            font-size: 16px;
            font-weight: 700;
            color: #0c4a6e;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #718096;
            line-height: 1.5;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px 20px;
            }
            
            h1 {
                font-size: 22px;
            }
            
            .inputs-row {
                gap: 3px;
            }
            
            .input-item {
                padding: 3px 5px;
            }
            
            .input-item input {
                width: 50px;
            }

            .top-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ 三相电流矢量和计算工具</h1>
        
        <div class="top-buttons">
            <button class="reset-btn" onclick="resetAllData()">🔄 重置所有数据</button>
            <button class="save-btn" onclick="saveAllData()">💾 保存所有数据</button>
        </div>

        <div id="calculationsContainer">
            <!-- 计算项将通过JS动态生成 -->
        </div>

        <button class="add-btn" onclick="addCalculationItem()">➕ 新增计算项</button>

        <div class="note">
            说明：默认值为三相平衡电流（10A，相位差120°），计算结果应为0A，可用于验证功能正确性。<br>
            点击「同步到后续」按钮可将当前计算项的输入值同步到所有后面的计算项中。<br>
            角度输入支持正负值，0°为参考相位，计算结果角度自动调整到0-360°范围。
        </div>
    </div>

    <script>
        let calculationCount = 0;

        // 初始化创建5个计算项
        function init() {
            for (let i = 0; i < 5; i++) {
                addCalculationItem();
            }
        }

        // 添加新的计算项
        function addCalculationItem() {
            calculationCount++;
            const container = document.getElementById('calculationsContainer');
            
            const itemHtml = `
                <div class="calculation-item" id="item-${calculationCount}">
                    <div class="item-header">
                        <div class="item-title">计算项 ${calculationCount}</div>
                        <div class="header-actions">
                            <button class="sync-btn" onclick="syncToNext(${calculationCount})">🔄 同步到后续</button>
                            <button class="calc-btn" onclick="calculate(${calculationCount})">计算矢量和</button>
                        </div>
                    </div>
                    
                    <div class="inputs-row">
                        <div class="phase-group phase-a">
                            <div class="input-item">
                                <span class="field-label">A电流<span class="unit">(A)</span></span>
                                <input type="number" step="1" id="iA-${calculationCount}" value="5">
                            </div>
                            <div class="input-item">
                                <span class="field-label">A角度<span class="unit">(°)</span></span>
                                <input type="number" step="1" id="angleA-${calculationCount}" value="0">
                            </div>
                        </div>
                        
                        <div class="phase-group phase-b">
                            <div class="input-item">
                                <span class="field-label">B电流<span class="unit">(A)</span></span>
                                <input type="number" step="1" id="iB-${calculationCount}" value="5">
                            </div>
                            <div class="input-item">
                                <span class="field-label">B角度<span class="unit">(°)</span></span>
                                <input type="number" step="1" id="angleB-${calculationCount}" value="120">
                            </div>
                        </div>
                        
                        <div class="phase-group phase-c">
                            <div class="input-item">
                                <span class="field-label">C电流<span class="unit">(A)</span></span>
                                <input type="number" step="1" id="iC-${calculationCount}" value="5">
                            </div>
                            <div class="input-item">
                                <span class="field-label">C角度<span class="unit">(°)</span></span>
                                <input type="number" step="1" id="angleC-${calculationCount}" value="240">
                            </div>
                        </div>
                        
                        <div class="output-item" id="outputCurrent-${calculationCount}">
                            <span class="output-label">矢量和(A)</span>
                            <span class="output-value">0.00</span>
                        </div>
                        <div class="output-item" id="outputAngle-${calculationCount}">
                            <span class="output-label">总相位(°)</span>
                            <span class="output-value">0.00</span>
                        </div>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', itemHtml);

            // 为输入框添加回车键触发计算
            document.querySelectorAll(`#item-${calculationCount} input`).forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        calculate(calculationCount);
                    }
                });
            });
        }

        // 计算单个项
        function calculate(id) {
            // 获取输入值
            const iA = parseFloat(document.getElementById(`iA-${id}`).value) || 0;
            const angleA = parseFloat(document.getElementById(`angleA-${id}`).value) || 0;
            const iB = parseFloat(document.getElementById(`iB-${id}`).value) || 0;
            const angleB = parseFloat(document.getElementById(`angleB-${id}`).value) || 0;
            const iC = parseFloat(document.getElementById(`iC-${id}`).value) || 0;
            const angleC = parseFloat(document.getElementById(`angleC-${id}`).value) || 0;

            // 角度转弧度
            const radA = angleA * Math.PI / 180;
            const radB = angleB * Math.PI / 180;
            const radC = angleC * Math.PI / 180;

            // 计算各相的实部和虚部
            const realA = iA * Math.cos(radA);
            const imagA = iA * Math.sin(radA);
            const realB = iB * Math.cos(radB);
            const imagB = iB * Math.sin(radB);
            const realC = iC * Math.cos(radC);
            const imagC = iC * Math.sin(radC);

            // 求和
            const totalReal = realA + realB + realC;
            const totalImag = imagA + imagB + imagC;

            // 计算总电流大小和角度
            const totalCurrent = Math.sqrt(totalReal * totalReal + totalImag * totalImag);
            let totalAngle = Math.atan2(totalImag, totalReal) * 180 / Math.PI;
            
            // 角度调整到0-360范围
            if (totalAngle < 0) {
                totalAngle += 360;
            }

            // 显示结果
            document.querySelector(`#outputCurrent-${id} .output-value`).textContent = totalCurrent.toFixed(2);
            document.querySelector(`#outputAngle-${id} .output-value`).textContent = totalAngle.toFixed(2);
        }

        // 同步到后续计算项
        function syncToNext(currentId) {
            // 获取当前项的输入值
            const iA = document.getElementById(`iA-${currentId}`).value;
            const angleA = document.getElementById(`angleA-${currentId}`).value;
            const iB = document.getElementById(`iB-${currentId}`).value;
            const angleB = document.getElementById(`angleB-${currentId}`).value;
            const iC = document.getElementById(`iC-${currentId}`).value;
            const angleC = document.getElementById(`angleC-${currentId}`).value;

            // 同步到所有ID大于currentId的项
            for (let id = currentId + 1; id <= calculationCount; id++) {
                document.getElementById(`iA-${id}`).value = iA;
                document.getElementById(`angleA-${id}`).value = angleA;
                document.getElementById(`iB-${id}`).value = iB;
                document.getElementById(`angleB-${id}`).value = angleB;
                document.getElementById(`iC-${id}`).value = iC;
                document.getElementById(`angleC-${id}`).value = angleC;
            }
        }

        // 重置所有数据到默认值
        function resetAllData() {
            for (let id = 1; id <= calculationCount; id++) {
                document.getElementById(`iA-${id}`).value = 5;
                document.getElementById(`angleA-${id}`).value = 0;
                document.getElementById(`iB-${id}`).value = 5;
                document.getElementById(`angleB-${id}`).value = 120;
                document.getElementById(`iC-${id}`).value = 5;
                document.getElementById(`angleC-${id}`).value = 240;
                document.querySelector(`#outputCurrent-${id} .output-value`).textContent = '0.00';
                document.querySelector(`#outputAngle-${id} .output-value`).textContent = '0.00';
            }
        }

        // 保存所有数据到txt
        function saveAllData() {
            let content = "三相电流矢量和计算结果\n";
            content += "生成时间: " + new Date().toLocaleString('zh-CN') + "\n";
            content += "=".repeat(50) + "\n\n";

            for (let id = 1; id <= calculationCount; id++) {
                // 获取输入值
                const iA = parseFloat(document.getElementById(`iA-${id}`).value) || 0;
                const angleA = parseFloat(document.getElementById(`angleA-${id}`).value) || 0;
                const iB = parseFloat(document.getElementById(`iB-${id}`).value) || 0;
                const angleB = parseFloat(document.getElementById(`angleB-${id}`).value) || 0;
                const iC = parseFloat(document.getElementById(`iC-${id}`).value) || 0;
                const angleC = parseFloat(document.getElementById(`angleC-${id}`).value) || 0;

                // 获取结果
                const totalCurrent = document.querySelector(`#outputCurrent-${id} .output-value`).textContent + ' A';
                const totalAngle = document.querySelector(`#outputAngle-${id} .output-value`).textContent + ' °';

                content += `计算项 ${id}:\n`;
                content += `  A相: ${iA} A, ${angleA}°\n`;
                content += `  B相: ${iB} A, ${angleB}°\n`;
                content += `  C相: ${iC} A, ${angleC}°\n`;
                content += `  计算结果: 矢量和 ${totalCurrent}, 总相位 ${totalAngle}\n`;
                content += "-".repeat(50) + "\n";
            }

            // 创建下载链接
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `三相电流计算结果_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
            URL.revokeObjectURL(url);

            alert('数据已保存为TXT文件！');
        }

        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
