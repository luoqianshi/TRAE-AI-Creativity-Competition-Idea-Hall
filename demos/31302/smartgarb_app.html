
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartGarb - 智衣视界</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'PingFang SC', sans-serif; background-color: #0f0f0f; color: #fff; height: 100vh; overflow: hidden; }
        
        /* App Container */
        .app-container { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .page { display: none; flex: 1; overflow-y: auto; padding: 20px; }
        .page.active { display: block; }
        
        /* Nav */
        .nav-bar { height: 60px; background: #1a1a1a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; }
        .nav-item { cursor: pointer; color: #888; font-size: 12px; }
        .nav-item.active { color: #e0ff4f; }
        
        /* Common Components */
        h2 { font-size: 18px; margin-bottom: 15px; }
        .card { background: #222; border-radius: 15px; padding: 15px; margin-bottom: 15px; }
        
        /* Creation Center Specific */
        .canvas-box { width: 100%; height: 250px; background: #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 20px; }
        .tool-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .tool-btn { background: #333; padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; }
        
        /* Plaza Specific */
        .plaza-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .plaza-item { min-width: 150px; height: 220px; background: #2a2a2a; border-radius: 12px; }
        
        /* Profile Specific */
        .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar { width: 60px; height: 60px; border-radius: 30px; background: #444; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .asset-box { aspect-ratio: 1; background: #222; border-radius: 8px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 1. 创作中心 -->
    <div id="page-creation" class="page active">
        <h2>3D智能创作中心</h2>
        <div class="canvas-box">
            <div style="color: #666;">[3D服装预览区域]</div>
        </div>
        <div class="card">
            <p>选择部位进行材质渲染：</p>
            <div class="tool-grid">
                <div class="tool-btn">领口</div>
                <div class="tool-btn">袖口</div>
                <div class="tool-btn">胸前</div>
                <div class="tool-btn">渲染</div>
            </div>
        </div>
    </div>

    <!-- 2. 创意广场 -->
    <div id="page-plaza" class="page">
        <h2>创意广场</h2>
        <div class="plaza-scroll">
            <div class="plaza-item"></div>
            <div class="plaza-item"></div>
            <div class="plaza-item"></div>
        </div>
        <div class="card">
            <h3>热门设计趋势</h3>
            <p style="color: #888;">向上滑动查看更多AI生成设计...</p>
        </div>
    </div>

    <!-- 3. 个人中心 -->
    <div id="page-profile" class="page">
        <div class="profile-header">
            <div class="avatar"></div>
            <div>
                <div style="font-weight: bold;">内蒙刘德华</div>
                <div style="color: #e0ff4f; font-size: 12px;">Lv 1 初级设计师</div>
            </div>
        </div>
        <h2>我的素材库</h2>
        <div class="grid-3">
            <div class="asset-box"></div>
            <div class="asset-box"></div>
            <div class="asset-box"></div>
            <div class="asset-box"></div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="showPage('creation', this)">创作中心</div>
        <div class="nav-item" onclick="showPage('plaza', this)">创意广场</div>
        <div class="nav-item" onclick="showPage('profile', this)">个人中心</div>
    </div>
</div>

<script>
    function showPage(pageName, element) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('page-' + pageName).classList.add('active');
        element.classList.add('active');
    }
</script>
</body>
</html>
