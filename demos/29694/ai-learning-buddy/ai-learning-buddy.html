  afterMotivation: [
    { text: '好的丞相，我先从AI论文开始', action: null },
    { text: '我想先练习英语听力', action: null },
    { text: '背《出师表》！这是丞相的文章，要好好学', action: null },
  ],
  afterLazy: [
    { text: '丞相说得对，我至少完成三项', action: null },
    { text: '好，先背两句出师表暖暖身', action: null },
  ],
  afterPlan: [
    { text: '多谢丞相！我很期待赤壁之战的讲解', action: null },
    { text: '好的，那我开始今日学习', action: 'motivation' },
  ],
  afterAllDone: [
    { text: '丞相辛苦了！明日继续', action: null },
    { text: '请丞相帮我预览明日计划', action: 'plan' },
  ],
  default: [
    { text: '丞相教训得是', action: null },
    { text: '我想调整一下学习计划', action: 'plan' },
  ],
};

// ==================== STATE ====================
let dialogueStage = 'intro';
let currentReplySet = 'afterGreeting';
let tasks = todayTasks.map(t => ({...t}));
let dialogueQueue = [];
let isTyping = false;

// ==================== DOM REFS ====================
const chatArea = document.getElementById('chatArea');
const quickReplies = document.getElementById('quickReplies');
const taskList = document.getElementById('taskList');
const progressPct = document.getElementById('progressPct');
const progressFill = document.getElementById('progressFill');
const taskDate = document.getElementById('taskDate');

// ==================== INIT ====================
function init() {
  // Set date
  const now = new Date();
  const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  taskDate.textContent = dateStr;

  // Render tasks
  renderTasks();

  // Start with intro modal (shown by default)
  // The modal will trigger startLearning()
}

function startLearning() {
  document.getElementById('introModal').remove();
  showTyping();
  setTimeout(() => {
    hideTyping();
    playDialogues('intro', 'afterGreeting');
  }, 1200);
}

// ==================== TASKS ====================
function renderTasks() {
  taskList.innerHTML = tasks.map(t => `
    <li class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask('${t.id}')" data-id="${t.id}">
      <div class="task-checkbox">${t.done ? '✓' : ''}</div>
      <span class="task-label">${t.label}</span>
      <span class="task-badge">${t.domain}</span>
    </li>
  `).join('');
  updateProgress();
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  task.done = !task.done;
  renderTasks();

  if (task.done) {
    // Play praise
    playDialogues('taskDone', null);
  }

  // Check if all done
  if (tasks.every(t => t.done)) {
    setTimeout(() => {
      playDialogues('allDone', 'afterAllDone');
    }, 1500);
  }

  // If just became undone, don't scold
}

function updateProgress() {
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct = Math.round((done / total) * 100);
  progressPct.textContent = `${pct}%`;
  progressFill.style.width = `${pct}%`;
}

// ==================== DIALOGUE ====================
function playDialogues(stage, replySetAfter) {
  const msgs = dialogues[stage];
  if (!msgs || msgs.length === 0) return;

  dialogueQueue = [...msgs];
  dialogueStage = stage;
  if (replySetAfter) currentReplySet = replySetAfter;
  processQueue();
}

function processQueue() {
  if (dialogueQueue.length === 0) {
    // Show quick replies
    if (currentReplySet) {
      showQuickReplies(currentReplySet);
    }
    return;
  }

  const msg = dialogueQueue.shift();
  showTyping();

  setTimeout(() => {
    hideTyping();
    if (msg.type === 'character') {
      addChatMessage('character', msg.text, '诸葛亮');
    }
    // Process next with delay
    setTimeout(() => processQueue(), 400);
  }, msg.delay || 600);
}

function addChatMessage(type, text, name) {
  const div = document.createElement('div');
  div.className = `chat-message ${type}`;

  if (type === 'character') {
    div.innerHTML = `
      <div class="chat-avatar"><img src="assets/zhugeliang-avatar.jpg" alt="诸葛亮"></div>
      <div class="chat-bubble">
        <div class="ch-name">${name}</div>
        ${text}
      </div>
    `;
  } else if (type === 'user') {
    div.innerHTML = `
      <div class="chat-avatar">斗</div>
      <div class="chat-bubble">${text}</div>
    `;
  }

  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// ==================== QUICK REPLIES ====================
function showQuickReplies(setKey) {
  const replies = replySets[setKey] || replySets.default;
  quickReplies.innerHTML = replies.map((r, i) =>
    `<button class="quick-reply-btn" onclick="handleReply('${setKey}', ${i})">${r.text}</button>`
  ).join('');
}

function handleReply(setKey, index) {
  const reply = replySets[setKey][index];
  if (!reply) return;

  // Show user message
  addChatMessage('user', reply.text);
  quickReplies.innerHTML = '';

  if (reply.action) {
    // Trigger next dialogue stage
    setTimeout(() => {
      showTyping();
      setTimeout(() => {
        hideTyping();
        playDialogues(reply.action, getReplySetForAction(reply.action));
      }, 800);
    }, 400);
  } else {
    // No follow-up dialogue, show default replies
    setTimeout(() => {
      showQuickReplies('default');
    }, 500);
  }
}

function getReplySetForAction(action) {
  const map = {
    'motivation': 'afterMotivation',
    'lazy': 'afterLazy',
    'plan': 'afterPlan',
  };
  return map[action] || 'default';
}

// ==================== TYPING INDICATOR ====================
function showTyping() {
  if (isTyping) return;
  isTyping = true;
  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.id = 'typingIndicator';
  indicator.innerHTML = `
    <div class="chat-avatar"><img src="assets/zhugeliang-avatar.jpg" alt="诸葛亮"></div>
    <div class="typing-dots"><span></span><span></span><span></span></div>
  `;
  chatArea.appendChild(indicator);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  isTyping = false;
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

// ==================== START ====================
init();
</script>

</body>
</html>
