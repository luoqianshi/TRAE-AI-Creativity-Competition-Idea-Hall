<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FitFlow · 智能健身计划</title>
<style>
/* ============ CSS Variables & Reset ============ */
:root {
  --bg: #0a0a0f;
  --surface: #14141f;
  --surface2: #1a1a2e;
  --card: #1e1e32;
  --border: #2a2a40;
  --text: #e0e0f0;
  --text2: #9090b0;
  --text3: #606080;
  --cyan: #00e5ff;
  --cyan2: #00b8d4;
  --green: #00e676;
  --green2: #00c853;
  --orange: #ff9100;
  --orange2: #ff6d00;
  --red: #ff5252;
  --purple: #b388ff;
  --pink: #ff4081;
  --gold: #ffd740;
  --glow-cyan: 0 0 20px rgba(0,229,255,0.3), 0 0 60px rgba(0,229,255,0.1);
  --glow-green: 0 0 20px rgba(0,230,118,0.3), 0 0 60px rgba(0,230,118,0.1);
  --glow-orange: 0 0 20px rgba(255,145,0,0.3);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { font-size:16px; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ============ Background Effects ============ */
.bg-mesh {
  position: fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(0,229,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(179,136,255,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,230,118,0.03) 0%, transparent 70%);
}
.bg-particles {
  position: fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
}
.particle {
  position: absolute;
  border-radius: 50%;
  background: var(--cyan);
  opacity: 0;
  animation: floatUp 8s infinite;
}
@keyframes floatUp {
  0% { transform:translateY(100vh) scale(0); opacity:0; }
  10% { opacity:0.8; }
  90% { opacity:0.2; }
  100% { transform:translateY(-10vh) scale(1.5); opacity:0; }
}

/* ============ App Shell ============ */
.app {
  position:relative; z-index:1;
  max-width:480px; margin:0 auto;
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  padding-bottom: calc(80px + var(--safe-bottom));
}

/* ============ Header ============ */
.header {
  padding: 20px 20px 12px;
  display:flex; align-items:center; justify-content:space-between;
  position: sticky; top:0; z-index:10;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(10,10,15,0.7);
}
.header-brand {
  display:flex; align-items:center; gap:10px;
}
.logo {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  display:flex; align-items:center; justify-content:center;
  font-size: 20px;
  box-shadow: var(--glow-cyan);
}
.logo svg { width:22px; height:22px; fill:none; stroke:#fff; stroke-width:2; }
.header-title { font-size:1.2rem; font-weight:700; letter-spacing:-0.3px; }
.header-sub { font-size:0.7rem; color:var(--cyan); font-weight:500; letter-spacing:1px; text-transform:uppercase; }

.streak-badge {
  display:flex; align-items:center; gap:6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size:0.85rem; font-weight:700;
  color: var(--orange);
  animation: pulse 2s infinite;
}
.streak-badge .flame { font-size:1.1rem; }
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,145,0,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(255,145,0,0); }
}

/* ============ Main Content ============ */
.main { flex:1; padding:0 16px; }

/* ============ View Switching ============ */
.view { display:none; animation: fadeSlideIn 0.4s ease; }
.view.active { display:block; }
@keyframes fadeSlideIn {
  from { opacity:0; transform:translateY(12px); }
  to { opacity:1; transform:translateY(0); }
}

/* ============ Cards ============ */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  backdrop-filter: blur(10px);
  transition: var(--transition);
}
.card-glow {
  border-color: rgba(0,229,255,0.2);
  box-shadow: 0 4px 32px rgba(0,229,255,0.06);
}
.card-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom: 14px;
}
.card-title {
  font-size:0.95rem; font-weight:700;
  display:flex; align-items:center; gap:8px;
}
.card-title .icon { font-size:1.2rem; }
.card-badge {
  font-size:0.7rem; padding:4px 10px; border-radius:12px;
  font-weight:600; letter-spacing:0.5px;
}
.badge-cyan { background:rgba(0,229,255,0.12); color:var(--cyan); }
.badge-green { background:rgba(0,230,118,0.12); color:var(--green); }
.badge-purple { background:rgba(179,136,255,0.12); color:var(--purple); }
.badge-orange { background:rgba(255,145,0,0.12); color:var(--orange); }

/* ============ Hero / Goal Card ============ */
.hero-card {
  background: linear-gradient(135deg, rgba(0,229,255,0.08) 0%, rgba(179,136,255,0.08) 100%);
  border: 1px solid rgba(0,229,255,0.15);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 14px;
  position:relative; overflow:hidden;
}
.hero-card::before {
  content:''; position:absolute; top:-50%; right:-30%;
  width:150px; height:150px;
  background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, transparent 70%);
  border-radius:50%;
}
.hero-goal { font-size:1.6rem; font-weight:800; margin-bottom:4px; }
.hero-desc { font-size:0.85rem; color:var(--text2); margin-bottom:12px; }
.hero-stats { display:flex; gap:20px; }
.hero-stat { text-align:center; }
.hero-stat-val { font-size:1.4rem; font-weight:800; color:var(--cyan); }
.hero-stat-label { font-size:0.7rem; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; }

/* ============ Progress Ring ============ */
.progress-ring-wrap {
  display:flex; align-items:center; gap:16px;
}
.progress-ring { position:relative; width:70px; height:70px; flex-shrink:0; }
.progress-ring svg { transform:rotate(-90deg); }
.progress-ring .bg { fill:none; stroke:var(--border); stroke-width:5; }
.progress-ring .fill { fill:none; stroke:var(--cyan); stroke-width:5; stroke-linecap:round; transition: stroke-dashoffset 1s ease; }
.progress-ring .pct {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:1.1rem; font-weight:800; color:var(--cyan);
}
.progress-info { flex:1; }
.progress-bar-label { display:flex; justify-content:space-between; font-size:0.8rem; margin-bottom:4px; }
.progress-bar-label span:last-child { color:var(--text2); }
.progress-bar {
  height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin-bottom:8px;
}
.progress-bar-fill {
  height:100%; border-radius:3px;
  background: linear-gradient(90deg, var(--cyan), var(--green));
  transition: width 1s ease;
}

/* ============ Exercise List ============ */
.exercise-item {
  display:flex; align-items:center; gap:14px;
  padding: 14px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  border: 1px solid transparent;
  transition: var(--transition);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.exercise-item:active { transform:scale(0.98); }
.exercise-item.done {
  border-color: rgba(0,230,118,0.3);
  background: rgba(0,230,118,0.05);
}
.exercise-item.done .ex-check { background:var(--green); border-color:var(--green); }
.ex-icon {
  width:44px; height:44px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; flex-shrink:0;
  background: var(--surface);
}
.ex-info { flex:1; min-width:0; }
.ex-name { font-weight:600; font-size:0.9rem; }
.ex-detail { font-size:0.75rem; color:var(--text2); margin-top:1px; }
.ex-check {
  width:26px; height:26px; border-radius:50%;
  border: 2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  transition: var(--transition);
  font-size:0.7rem; color:#fff;
}

/* ============ Buttons ============ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding: 14px 28px; border-radius: 14px; font-weight:700; font-size:0.95rem;
  border:none; cursor:pointer; transition:var(--transition);
  font-family:inherit; letter-spacing:0.2px;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform:scale(0.96); }
.btn-primary {
  width:100%;
  background: linear-gradient(135deg, var(--cyan), var(--cyan2));
  color: #000;
  box-shadow: var(--glow-cyan);
  font-size:1rem;
}
.btn-secondary {
  width:100%;
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-sm {
  padding:8px 16px; font-size:0.8rem; border-radius:10px;
}
.btn-icon {
  width:40px; height:40px; padding:0; border-radius:12px;
  background: var(--surface2); border:1px solid var(--border);
  color:var(--text); font-size:1.1rem;
}

/* ============ Feedback Modal ============ */
.modal-overlay {
  position:fixed; inset:0; z-index:100;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  display:flex; align-items:flex-end; justify-content:center;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal {
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  width:100%; max-width:480px;
  padding: 24px 20px calc(24px + var(--safe-bottom));
  animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
  max-height:90vh; overflow-y:auto;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-handle {
  width:36px; height:4px; background:var(--border); border-radius:2px;
  margin:0 auto 20px;
}
.modal-title { font-size:1.2rem; font-weight:700; margin-bottom:20px; text-align:center; }

.feedback-group { margin-bottom:20px; }
.feedback-label { font-size:0.85rem; color:var(--text2); margin-bottom:8px; font-weight:600; }
.feedback-options { display:flex; gap:8px; }
.feedback-btn {
  flex:1; padding:12px 8px; border-radius:12px;
  border: 2px solid var(--border); background:var(--surface2);
  text-align:center; cursor:pointer; transition:var(--transition);
  font-family:inherit; color:var(--text);
  -webkit-tap-highlight-color: transparent;
}
.feedback-btn.selected { border-color:var(--cyan); background:rgba(0,229,255,0.1); }
.feedback-btn .emoji { font-size:1.5rem; display:block; margin-bottom:4px; }
.feedback-btn .label { font-size:0.7rem; color:var(--text2); }
.feedback-btn.selected .label { color:var(--cyan); }

.feedback-slider {
  width:100%; -webkit-appearance:none; appearance:none;
  height:6px; border-radius:3px; background:var(--border); outline:none;
}
.feedback-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:28px; height:28px;
  border-radius:50%; background:var(--cyan);
  cursor:pointer; box-shadow:var(--glow-cyan);
}

/* ============ Goal Select (Onboarding) ============ */
.goal-options { display:flex; flex-direction:column; gap:10px; }
.goal-option {
  display:flex; align-items:center; gap:14px;
  padding: 16px; border-radius: var(--radius-sm);
  border: 2px solid var(--border); background:var(--surface2);
  cursor:pointer; transition:var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.goal-option:active { transform:scale(0.98); }
.goal-option.selected { border-color:var(--cyan); background:rgba(0,229,255,0.06); }
.goal-option .g-icon { font-size:2rem; }
.goal-option .g-info { flex:1; }
.goal-option .g-name { font-weight:700; font-size:0.95rem; }
.goal-option .g-desc { font-size:0.75rem; color:var(--text2); }

/* ============ Level Picker ============ */
.level-options { display:flex; gap:8px; }
.level-option {
  flex:1; padding:14px; border-radius:12px; text-align:center;
  border:2px solid var(--border); background:var(--surface2);
  cursor:pointer; transition:var(--transition); font-family:inherit; color:var(--text);
  -webkit-tap-highlight-color: transparent;
}
.level-option.selected { border-color:var(--purple); background:rgba(179,136,255,0.08); }
.level-option .l-name { font-weight:700; font-size:0.85rem; }
.level-option .l-desc { font-size:0.7rem; color:var(--text2); }

/* ============ Tab Bar ============ */
.tab-bar {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:480px;
  display:flex; gap:4px; padding: 10px 16px calc(10px + var(--safe-bottom));
  background: rgba(20,20,31,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  z-index:50;
}
.tab {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:8px 4px; border-radius:12px; cursor:pointer;
  transition:var(--transition); border:none; background:none; color:var(--text3);
  font-family:inherit; font-size:0.65rem; font-weight:600;
  -webkit-tap-highlight-color: transparent;
}
.tab.active { color:var(--cyan); }
.tab .t-icon { font-size:1.3rem; transition:var(--transition); }
.tab.active .t-icon { text-shadow: 0 0 12px rgba(0,229,255,0.5); }
.tab-dot {
  width:6px; height:6px; border-radius:50%; background:var(--cyan);
  position:absolute; top:4px; right:50%; transform:translateX(14px);
  display:none;
}
.tab.has-dot .tab-dot { display:block; }

/* ============ History ============ */
.history-item {
  display:flex; align-items:center; gap:12px;
  padding: 14px; background:var(--surface2); border-radius:var(--radius-sm);
  margin-bottom:8px;
}
.history-date { font-size:0.8rem; color:var(--text2); min-width:60px; }
.history-info { flex:1; }
.history-title { font-weight:600; font-size:0.85rem; }
.history-detail { font-size:0.7rem; color:var(--text2); }
.history-mood { font-size:1.5rem; }

/* ============ Celebration ============ */
.confetti-container {
  position:fixed; inset:0; pointer-events:none; z-index:200;
}
.confetti {
  position:absolute; width:10px; height:10px;
  animation: confettiFall 2s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform:translateY(-100vh) rotate(0deg) scale(1); opacity:1; }
  100% { transform:translateY(110vh) rotate(720deg) scale(0); opacity:0; }
}

/* ============ Empty State ============ */
.empty-state { text-align:center; padding:40px 20px; }
.empty-icon { font-size:3rem; margin-bottom:12px; }
.empty-title { font-weight:700; font-size:1rem; margin-bottom:4px; }
.empty-desc { font-size:0.8rem; color:var(--text2); }

/* ============ Toast ============ */
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  background:var(--card); border:1px solid var(--border);
  padding:12px 24px; border-radius:24px;
  font-weight:600; font-size:0.85rem;
  z-index:300; animation: toastIn 0.4s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  white-space:nowrap;
}
@keyframes toastIn {
  from { opacity:0; transform:translateX(-50%) translateY(-20px); }
  to { opacity:1; transform:translateX(-50%) translateY(0); }
}

/* ============ Utility ============ */
.text-cyan { color:var(--cyan); }
.text-green { color:var(--green); }
.text-orange { color:var(--orange); }
.text-purple { color:var(--purple); }
.text-center { text-align:center; }
.mt-2 { margin-top:8px; }
.mt-3 { margin-top:14px; }
.mb-2 { margin-bottom:8px; }
.hidden { display:none !important; }

/* ============ Scrollbar ============ */
::-webkit-scrollbar { width:0; }

/* ============ Plan Edit ============ */
.plan-day {
  background:var(--surface2); border-radius:var(--radius-sm);
  padding:14px; margin-bottom:8px; border:1px solid var(--border);
}
.plan-day-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:8px;
}
.plan-day-name { font-weight:700; font-size:0.9rem; }
.plan-day-tag { font-size:0.7rem; padding:3px 8px; border-radius:8px; }
.tag-workout { background:rgba(0,229,255,0.12); color:var(--cyan); }
.tag-rest { background:rgba(179,136,255,0.12); color:var(--purple); }
.plan-ex-list { font-size:0.8rem; color:var(--text2); }
.plan-ex-list span { margin-right:8px; }
</style>
</head>
<body>

<!-- Background Effects -->
<div class="bg-mesh"></div>
<div class="bg-particles" id="particles"></div>

<!-- App Shell -->
<div class="app" id="app">

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M20 8h-2.8c.5-.7.8-1.5.8-2.5C18 3.5 16.5 2 14.5 2c-1.5 0-2.8.8-3.5 2-.7-1.2-2-2-3.5-2C5.5 2 4 3.5 4 5.5c0 1 .3 1.8.8 2.5H2l1 12h4l.5-6h3l.5 6h4l1-12h-2.8c.5-.7.8-1.5.8-2.5C16 3.5 14.5 2 12.5 2c-.4 0-.7.1-1 .2"/></svg>
      </div>
      <div>
        <div class="header-title">FitFlow</div>
        <div class="header-sub">健身小管家</div>
      </div>
    </div>
    <div class="streak-badge" id="streakBadge">
      <span class="flame">🔥</span> <span id="streakCount">0</span>天
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">

    <!-- ===== Dashboard View ===== -->
    <div class="view active" id="view-dashboard">
      <div class="hero-card" id="heroCard">
        <div class="hero-goal" id="heroGoal">开始你的旅程</div>
        <div class="hero-desc" id="heroDesc">设定目标，让 AI 为你定制专属计划</div>
        <div class="hero-stats">
          <div class="hero-stat"><div class="hero-stat-val" id="statTotal">0</div><div class="hero-stat-label">总训练</div></div>
          <div class="hero-stat"><div class="hero-stat-val" id="statWeek">0</div><div class="hero-stat-label">本周</div></div>
          <div class="hero-stat"><div class="hero-stat-val text-green" id="statRate">0%</div><div class="hero-stat-label">完成率</div></div>
        </div>
      </div>

      <div class="card card-glow" id="todayPreview" style="cursor:pointer">
        <div class="card-header">
          <div class="card-title"><span class="icon">📋</span>今日训练</div>
          <span class="card-badge badge-cyan" id="todayBadge">待完成</span>
        </div>
        <div id="todayPreviewContent" style="font-size:0.85rem;color:var(--text2);">
          还没有今日计划，先去设定目标吧
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title"><span class="icon">📊</span>本周进度</div>
        </div>
        <div class="progress-ring-wrap">
          <div class="progress-ring">
            <svg width="70" height="70" viewBox="0 0 70 70">
              <circle class="bg" cx="35" cy="35" r="30"/>
              <circle class="fill" id="weeklyRing" cx="35" cy="35" r="30"
                stroke-dasharray="188.5" stroke-dashoffset="188.5"/>
            </svg>
            <div class="pct" id="weeklyPct">0%</div>
          </div>
          <div class="progress-info">
            <div class="progress-bar-label"><span>目标完成度</span><span id="weeklyLabel">0/7天</span></div>
            <div class="progress-bar"><div class="progress-bar-fill" id="weeklyBar" style="width:0%"></div></div>
            <div style="font-size:0.75rem;color:var(--text2);">
              当前强度: <span style="color:var(--cyan);font-weight:600;" id="currentIntensity">-</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Today's Workout View ===== -->
    <div class="view" id="view-today">
      <div class="card card-glow">
        <div class="card-header">
          <div class="card-title"><span class="icon">🎯</span><span id="todayTitle">今日训练</span></div>
          <span class="card-badge" id="todayIntensityBadge">中等强度</span>
        </div>
        <div id="todayMeta" style="font-size:0.8rem;color:var(--text2);margin-bottom:12px;"></div>
        <div id="exerciseList"></div>
        <button class="btn btn-primary mt-3" id="btnComplete" style="display:none;">
          ✅ 完成全部训练
        </button>
        <button class="btn btn-secondary mt-2" id="btnSkip" style="display:none;">
          跳过今天
        </button>

// ── Generate Weekly Plan ────────────────────────────────────────
function generateWeeklyPlan(goal, level, daysPerWeek) {
  const baseExercises = EXERCISES[goal]?.[level] || EXERCISES['general'].beginner;
  const plan = [];
  const workoutDays = distributeWorkoutDays(daysPerWeek);

  for (let d = 0; d < 7; d++) {
    if (workoutDays.includes(d)) {
      // Deep copy and adjust intensity
      const exercises = baseExercises.map(ex => ({ ...ex }));
      plan.push({ day:d, type:'workout', exercises, completed:false });
    } else {
      plan.push({ day:d, type:'rest', exercises:[], completed:false });
    }
  }
  return plan;
}

function distributeWorkoutDays(daysPerWeek) {
  // Smart distribution: spread workout days across the week
  const patterns = {
    2: [1, 4],
    3: [1, 3, 5],
    4: [1, 2, 4, 5],
    5: [1, 2, 3, 5, 6],
    6: [1, 2, 3, 4, 5, 6],
    7: [0, 1, 2, 3, 4, 5, 6],
  };
  return patterns[daysPerWeek] || [1, 3, 5];
}

// ── Get Today's Workout ────────────────────────────────────────
function getTodayPlan() {
  const today = new Date().getDay(); // 0=Sun ... 6=Sat
  return state.weeklyPlan.find(p => p.day === today) || null;
}

function getTodayDate() {
  return new Date().toISOString().split('T')[0];

// ── Dynamic Adjustment Algorithm ────────────────────────────────
function adjustIntensity(fatigue, difficulty) {
  // Core algorithm: adjust intensity based on feedback
  let delta = 0;
  const avgFatigue = calcAvgFatigue();

  // Fatigue-based adjustment
  if (fatigue >= 4) {
    delta -= 0.20; // Major reduction for high fatigue
  } else if (fatigue === 3) {
    delta -= 0.05; // Slight reduction for normal fatigue
  } else if (fatigue <= 2) {
    delta += 0.05; // Slight increase when feeling good
  }

  // Difficulty-based adjustment
  if (difficulty <= 2 && fatigue <= 2) {
    delta += 0.10; // Too easy & feeling good → push harder
  } else if (difficulty >= 4) {
    delta -= 0.10; // Too hard → ease off
  }

  // Overtraining detection: if avg fatigue > 3.5 over last 3 workouts
  if (state.fatigueHistory.length >= 3 && avgFatigue > 3.5) {
    delta -= 0.10; // Recovery week needed
  }

  // Apply delta with bounds
  let newIntensity = state.intensity + delta;
  newIntensity = Math.max(0.5, Math.min(1.5, newIntensity));
  // Round to 2 decimals
  newIntensity = Math.round(newIntensity * 100) / 100;

  return newIntensity;
}

function calcAvgFatigue() {
  if (state.fatigueHistory.length === 0) return 3;
  const sum = state.fatigueHistory.reduce((a,b) => a+b, 0);
  return sum / state.fatigueHistory.length;
}

function getIntensityLabel(intensity) {
  if (intensity <= 0.6) return { text:'恢复模式', cls:'badge-purple' };
  if (intensity <= 0.85) return { text:'低强度', cls:'badge-green' };
  if (intensity <= 1.1) return { text:'中等强度', cls:'badge-cyan' };
  if (intensity <= 1.3) return { text:'高强度', cls:'badge-orange' };
  return { text:'挑战模式', cls:'badge-orange' };
}

function getAdjustmentMessage(prevIntensity, newIntensity, fatigue, difficulty) {
  const diff = newIntensity - prevIntensity;
  const messages = [];

  if (fatigue >= 4) {
    messages.push('检测到较高疲劳度，已降低训练强度让你充分恢复');
  }
  if (difficulty >= 4) {
    messages.push('上次训练对你来说偏难，已适当调整');
  }
  if (fatigue <= 2 && difficulty <= 2 && diff > 0) {
    messages.push('你状态很好！已适当增加强度挑战自我 💪');
  }
  if (calcAvgFatigue() > 3.5) {
    messages.push('最近疲劳度偏高，建议多注意休息和营养补充 🛌');
  }
  if (Math.abs(diff) < 0.05) {
    messages.push('强度保持不变，继续稳定输出！');
  }

  return messages.length > 0 ? messages.join('；') : '根据你的反馈，计划保持稳定。加油！';
}

function applyIntensityToExercises(exercises, intensity) {
  return exercises.map(ex => {
    const adjusted = { ...ex };
    // Adjust reps (multiply by intensity factor for number-based reps)
    const repsMatch = ex.reps.match(/\d+/g);
    if (repsMatch) {
      let newReps = ex.reps;
      repsMatch.forEach(num => {
        const adjustedNum = Math.round(parseInt(num) * intensity);
        newReps = newReps.replace(num, adjustedNum);
      });
      adjusted.reps = newReps;
    }
    // Adjust sets (only if intensity changes significantly)
    if (intensity >= 1.3 && !ex.sets.includes('5')) {
      const setNum = parseInt(ex.sets);
      if (setNum && setNum < 6) {
        adjusted.sets = (setNum + 1) + '组';
      }
    } else if (intensity <= 0.6) {
      const setNum = parseInt(ex.sets);
      if (setNum && setNum > 1) {
        adjusted.sets = (setNum - 1) + '组';
      }
    }
    return adjusted;
  });
}

// ── Week Start ───────────────────────────────────────────────────
function getWeekStart() {
  const now = new Date();
  const day = now.getDay();
  const diff = now.getDate() - day + (day === 0 ? -6 : 1); // Monday start
  return new Date(now.setDate(diff)).toISOString().split('T')[0];
}

// ── Reset weekly plan if needed ─────────────────────────────────
function checkWeeklyReset() {
  const weekStart = getWeekStart();
  const today = getTodayDate();
  const todayDay = new Date().getDay();

  // If no plan or plan is from a previous setup without goal
  if (!state.weeklyPlan || state.weeklyPlan.length === 0) return;

  // Check if we need to reset completed status for new week
  // We check if all days are completed → new week
  const allCompleted = state.weeklyPlan.every(p => p.completed);
  if (allCompleted) {
    // Reset for new week
    state.weeklyPlan = state.weeklyPlan.map(p => ({ ...p, completed: false }));
    saveState();
  }
}

// ── Render Functions ────────────────────────────────────────────

function renderAll() {
  checkWeeklyReset();
  renderDashboard();
  renderToday();
  renderPlan();
  renderHistory();
  updateStreak();
}

function updateStreak() {
  $('#streakCount').textContent = state.streak;
  if (state.streak >= 7) {
    $('#streakBadge').style.color = 'var(--gold)';
  }
}

function renderDashboard() {
  const hasGoal = !!state.goal;
  const todayPlan = getTodayPlan();
  const weekStart = getWeekStart();

  // Hero
  if (hasGoal) {
    const goalNames = { 'lose-fat':'减脂塑形 🔥', 'build-muscle':'增肌增重 💪', 'endurance':'提升耐力 🏃', 'general':'综合健康 ✨' };
    const levelNames = { 'beginner':'新手', 'intermediate':'进阶', 'advanced':'高手' };
    $('#heroGoal').textContent = goalNames[state.goal] || '自定义计划';
    $('#heroDesc').textContent = `${levelNames[state.level]} · 每周${state.daysPerWeek}天 · ${getIntensityLabel(state.intensity).text}`;
  }

  $('#statTotal').textContent = state.totalWorkouts;
  $('#statRate').textContent = calcCompletionRate() + '%';

  // This week's workouts
  const thisWeekHistory = state.history.filter(h => h.date >= weekStart);
  $('#statWeek').textContent = thisWeekHistory.length;

  // Weekly progress
  const completedThisWeek = state.weeklyPlan.filter(p => p.completed).length;
  const weeklyPct = state.daysPerWeek > 0 ? Math.round((completedThisWeek / state.daysPerWeek) * 100) : 0;
  const circumference = 188.5; // 2*PI*30
  const offset = circumference - (weeklyPct / 100) * circumference;
  $('#weeklyRing').style.strokeDashoffset = offset;
  $('#weeklyPct').textContent = weeklyPct + '%';
  $('#weeklyLabel').textContent = `${completedThisWeek}/${state.daysPerWeek}天`;
  $('#weeklyBar').style.width = weeklyPct + '%';
  $('#currentIntensity').textContent = getIntensityLabel(state.intensity).text;

  // Today preview
  if (todayPlan && todayPlan.type === 'workout') {
    const doneCount = todayPlan.exercises.filter(e => e._done).length;
    const total = todayPlan.exercises.length;
    if (doneCount === total && total > 0) {
      $('#todayBadge').textContent = '已完成 ✅';
      $('#todayBadge').className = 'card-badge badge-green';
      $('#todayPreviewContent').textContent = '太棒了！今天的训练已经全部完成 🎉';
    } else if (doneCount > 0) {
      $('#todayBadge').textContent = `进行中 ${doneCount}/${total}`;
      $('#todayBadge').className = 'card-badge badge-orange';
      $('#todayPreviewContent').textContent = `还有 ${total - doneCount} 个动作等你完成`;
    } else {
      $('#todayBadge').textContent = '待完成';
      $('#todayBadge').className = 'card-badge badge-cyan';
      $('#todayPreviewContent').textContent = `${total} 个训练动作等待挑战`;
    }
  } else if (todayPlan && todayPlan.type === 'rest') {
    $('#todayBadge').textContent = '休息日';
    $('#todayBadge').className = 'card-badge badge-purple';
    $('#todayPreviewContent').textContent = '今天是休息日，好好恢复吧 🌿';
  } else {
    $('#todayBadge').textContent = '未设置';
    $('#todayBadge').className = 'card-badge badge-cyan';
    $('#todayPreviewContent').textContent = '还没有今日计划，先去设定目标吧';
  }

  // If no goal set, show CTA
  if (!hasGoal && !state.createdAt) {
    setTimeout(() => showOnboarding(), 500);
  }
}

function renderToday() {
  const todayPlan = getTodayPlan();
  const todayDate = getTodayDate();

  if (!todayPlan) {
    $('#todayTitle').textContent = '今日训练';
    $('#todayMeta').textContent = '';
    $('#exerciseList').innerHTML = '';
    $('#btnComplete').style.display = 'none';
    $('#btnSkip').style.display = 'none';
    $('#todayEmpty').style.display = 'block';
    $('#adjustmentCard').style.display = 'none';
    return;
  }

  if (todayPlan.type === 'rest') {
    $('#todayTitle').textContent = '休息日 🏖️';
    $('#todayMeta').textContent = '';
    $('#exerciseList').innerHTML = '';
    $('#btnComplete').style.display = 'none';
    $('#btnSkip').style.display = 'none';
    $('#todayEmpty').style.display = 'block';
    $('#adjustmentCard').style.display = 'none';
    $('#todayIntensityBadge').textContent = '休息';
    $('#todayIntensityBadge').className = 'card-badge badge-purple';
    return;
  }

  // Workout day
  $('#todayEmpty').style.display = 'none';
  const intensity = state.intensity;
  const intensityInfo = getIntensityLabel(intensity);
  $('#todayIntensityBadge').textContent = intensityInfo.text;
  $('#todayIntensityBadge').className = 'card-badge ' + intensityInfo.cls;

  // Check if today's workout has been logged
  const todayLogged = state.history.some(h => h.date === todayDate);
  const allDone = todayPlan.exercises.every(e => e._done);
  const exercises = applyIntensityToExercises(todayPlan.exercises, intensity);

  const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
  const todayName = dayNames[new Date().getDay()];
  $('#todayTitle').textContent = todayName + '训练';
  $('#todayMeta').textContent = `${exercises.length} 个动作 · 预计${Math.round(exercises.length * 5 * intensity)}分钟`;

  // Render exercises
  $('#exerciseList').innerHTML = exercises.map((ex, i) => {
    const done = ex._done || todayLogged;
    return `
      <div class="exercise-item${done ? ' done' : ''}" data-index="${i}" onclick="window._toggleExercise(${i})">
        <div class="ex-icon">${ex.icon}</div>
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-detail">${ex.sets} · ${ex.reps} · 休息${ex.rest} · ${ex.kcal}</div>
        </div>
        <div class="ex-check">${done ? '✓' : ''}</div>
      </div>
    `;
  }).join('');

  // Buttons
  if (todayLogged) {
    $('#btnComplete').style.display = 'none';
    $('#btnSkip').style.display = 'none';
  } else {
    $('#btnComplete').style.display = 'block';
    $('#btnSkip').style.display = 'block';
  }

  // Adjustment info
  if (state.history.length > 0) {
    const lastHistory = state.history[state.history.length - 1];
    if (lastHistory && lastHistory.date !== todayDate) {
      $('#adjustmentCard').style.display = 'block';
      const prevIntensity = lastHistory.intensity || 1.0;
      const msg = getAdjustmentMessage(prevIntensity, intensity, lastHistory.fatigue, lastHistory.difficulty);
      $('#adjustmentContent').textContent = msg;
    } else {
      $('#adjustmentCard').style.display = 'none';
    }
  }
}

// Toggle exercise done state (exposed globally for onclick)
window._toggleExercise = function(index) {
  const todayPlan = getTodayPlan();
  if (!todayPlan || todayPlan.type === 'rest') return;
  const todayDate = getTodayDate();
  if (state.history.some(h => h.date === todayDate)) return; // already logged

  todayPlan.exercises[index]._done = !todayPlan.exercises[index]._done;
  saveState();
  renderToday();
  renderDashboard();

  // Check if all done
  if (todayPlan.exercises.every(e => e._done)) {
    setTimeout(() => showToast('🎉 全部完成！记录你的感受吧'), 300);
  }
};

function renderPlan() {
  const dayNames = ['周日','周一','周二','周三','周四','周五','周六'];
  const today = new Date().getDay();

  if (!state.weeklyPlan || state.weeklyPlan.length === 0) {
    $('#planContent').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📅</div>
        <div class="empty-title">还没有计划</div>
        <div class="empty-desc">先设定目标生成计划吧</div>
      </div>`;
    return;
  }

  $('#planContent').innerHTML = state.weeklyPlan.map((p, i) => {
    const isToday = p.day === today;
    const isWorkout = p.type === 'workout';
    const tagClass = isWorkout ? 'tag-workout' : 'tag-rest';
    const tagText = isWorkout ? `${p.exercises.length}个动作` : '休息';
    const doneMark = p.completed ? ' ✅' : '';

    return `
      <div class="plan-day" style="${isToday ? 'border-color:rgba(0,229,255,0.3);box-shadow:0 0 16px rgba(0,229,255,0.08);' : ''}">
        <div class="plan-day-header">
          <span class="plan-day-name">${dayNames[p.day]}${isToday ? ' 👈' : ''}${doneMark}</span>
          <span class="plan-day-tag ${tagClass}">${tagText}</span>
        </div>
        ${isWorkout ? `<div class="plan-ex-list">
          ${p.exercises.map(e => `<span>${e.icon} ${e.name}</span>`).join('')}
        </div>` : '<div style="font-size:0.8rem;color:var(--text2);">放松恢复，为下次训练蓄力</div>'}
      </div>
    `;
  }).join('');
}

function renderHistory() {
  if (state.history.length === 0) {
    $('#historyList').innerHTML = '';
    $('#historyEmpty').style.display = 'block';
    return;
  }

  $('#historyEmpty').style.display = 'none';
  $('#historyList').innerHTML = state.history.slice().reverse().slice(0, 30).map(h => {
    const date = new Date(h.date);
    const dateStr = `${date.getMonth()+1}/${date.getDate()}`;
    const dayNames = ['日','一','二','三','四','五','六'];
    const dayStr = `周${dayNames[date.getDay()]}`;
    const fatigueEmoji = ['','⚡','😊','😐','😫','🥵'][h.fatigue] || '😐';
    const intensityLabel = getIntensityLabel(h.intensity || 1.0);
    return `
      <div class="history-item">
        <div class="history-date">${dateStr}<br><small>${dayStr}</small></div>
        <div class="history-info">
          <div class="history-title">${h.exercises.length}个动作完成</div>
          <div class="history-detail">
            疲劳: ${fatigueEmoji} · 强度: ${intensityLabel.text}
            ${h.note ? ' · ' + h.note : ''}
          </div>
        </div>
        <div class="history-mood">${h.mood || '🙂'}</div>
      </div>
    `;
  }).join('');
}

function calcCompletionRate() {
  if (state.history.length === 0) return 0;
  // Days since creation
  const created = state.createdAt ? new Date(state.createdAt) : new Date();
  const now = new Date();
  const daysSince = Math.max(1, Math.ceil((now - created) / (1000 * 60 * 60 * 24)));
  // Expected workout days based on daysPerWeek
  const weeksSince = Math.max(1, daysSince / 7);
  const expectedWorkouts = Math.round(weeksSince * state.daysPerWeek);
  const actualWorkouts = state.totalWorkouts;
  return Math.min(100, Math.round((actualWorkouts / Math.max(1, expectedWorkouts)) * 100));
}

// ── Actions ──────────────────────────────────────────────────────

function showOnboarding() {
  $('#onboardingModal').classList.remove('hidden');
  // Reset selections
  document.querySelectorAll('#goalOptions .goal-option').forEach((el,i) => el.classList.toggle('selected', i===0));
  document.querySelectorAll('#levelOptions .level-option').forEach((el,i) => el.classList.toggle('selected', i===0));
  $('#daysPerWeek').value = 4;
  $('#daysLabel').textContent = '4 天/周';
}

function hideOnboarding() {
  $('#onboardingModal').classList.add('hidden');
}

function completeWorkout() {
  const todayPlan = getTodayPlan();
  const todayDate = getTodayDate();
  if (!todayPlan || todayPlan.type !== 'workout') return;
  if (state.history.some(h => h.date === todayDate)) return;

  // Check all exercises are checked
  if (!todayPlan.exercises.every(e => e._done)) {
    showToast('请先完成所有训练动作 ✅');
    return;
  }

  // Show feedback modal
  $('#feedbackModal').classList.remove('hidden');
  // Reset feedback selections
  document.querySelectorAll('#fatigueOptions .feedback-btn').forEach((el,i) => el.classList.toggle('selected', i===2));
  document.querySelectorAll('#difficultyOptions .feedback-btn').forEach((el,i) => el.classList.toggle('selected', i===2));
  document.querySelectorAll('#moodOptions .feedback-btn').forEach((el,i) => el.classList.toggle('selected', i===2));
  $('#feedbackNote').value = '';
}

function submitFeedback() {
  const fatigue = parseInt(document.querySelector('#fatigueOptions .feedback-btn.selected')?.dataset?.value || 3);
  const difficulty = parseInt(document.querySelector('#difficultyOptions .feedback-btn.selected')?.dataset?.value || 3);
  const mood = document.querySelector('#moodOptions .feedback-btn.selected')?.dataset?.value || '🙂';
  const note = $('#feedbackNote').value.trim();
  const todayDate = getTodayDate();
  const todayPlan = getTodayPlan();

  if (!todayPlan) return;

  // Mark today's plan as completed
  todayPlan.completed = true;
  todayPlan.exercises.forEach(e => e._done = true);

  // Update streak
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = yesterday.toISOString().split('T')[0];

  if (state.lastWorkoutDate === yesterdayStr) {
    state.streak += 1;
  } else if (state.lastWorkoutDate === todayDate) {
    // Already logged today (shouldn't happen)
  } else {
    state.streak = 1;
  }
  state.lastWorkoutDate = todayDate;
  state.totalWorkouts += 1;

  // Adjust intensity
  const oldIntensity = state.intensity;
  const newIntensity = adjustIntensity(fatigue, difficulty);
  state.intensity = newIntensity;

  // Track fatigue history (keep last 7)
  state.fatigueHistory.push(fatigue);
  if (state.fatigueHistory.length > 7) state.fatigueHistory.shift();

  // Add to history
  state.history.push({
    date: todayDate,
    goal: state.goal,
    exercises: todayPlan.exercises.map(e => ({ name: e.name, icon: e.icon })),
    fatigue,
    difficulty,
    mood,
    note,
    intensity: oldIntensity,
    newIntensity,
  });

  // Adjust remaining week plan exercises based on new intensity
  const today = new Date().getDay();
  state.weeklyPlan.forEach(p => {
    if (p.day > today && p.type === 'workout') {
      // Future workouts will use the new intensity when rendered
      // No need to modify stored exercises, intensity is applied at render time
    }
  });

  saveState();
  hideFeedback();
  renderAll();

  // Celebration!
  if (fatigue <= 2 && difficulty <= 3) {
    spawnConfetti();
    showToast('🔥 状态火热！明天加强挑战！');
  } else if (state.streak >= 7) {
    spawnConfetti();
    showToast(`🎉 连续${state.streak}天！你太强了！`);
  } else {
    showToast('✅ 训练记录已保存！');
  }
}

function skipToday() {
  const todayPlan = getTodayPlan();
  const todayDate = getTodayDate();
  if (!todayPlan || todayPlan.type !== 'workout') return;
  if (state.history.some(h => h.date === todayDate)) return;

  // Mark as completed (skipped)
  todayPlan.completed = true;
  state.streak = 0; // Reset streak on skip
  state.lastWorkoutDate = todayDate;

  // Slightly reduce intensity
  state.intensity = Math.max(0.5, state.intensity - 0.05);
  state.intensity = Math.round(state.intensity * 100) / 100;

  state.history.push({
    date: todayDate,
    goal: state.goal,
    exercises: [],
    fatigue: 3,
    difficulty: 3,
    mood: '😴',
    note: '休息日跳过',
    intensity: state.intensity,
    newIntensity: state.intensity,
  });

  saveState();
  renderAll();
  showToast('已跳过今日训练，好好休息 🛌');
}

function hideFeedback() {
  $('#feedbackModal').classList.add('hidden');
}

function startPlan() {
  const goalEl = document.querySelector('#goalOptions .goal-option.selected');
  const levelEl = document.querySelector('#levelOptions .level-option.selected');
  const goal = goalEl?.dataset?.goal || 'general';
  const level = levelEl?.dataset?.level || 'beginner';
  const daysPerWeek = parseInt($('#daysPerWeek').value) || 4;

  state.goal = goal;
  state.level = level;
  state.daysPerWeek = daysPerWeek;
  state.intensity = 1.0;
  state.weeklyPlan = generateWeeklyPlan(goal, level, daysPerWeek);
  state.createdAt = state.createdAt || getTodayDate();

  saveState();
  hideOnboarding();
  renderAll();
  showToast('🚀 你的专属计划已生成！');
  switchView('today');
}

function regeneratePlan() {
  if (!state.goal) { showOnboarding(); return; }
  state.weeklyPlan = generateWeeklyPlan(state.goal, state.level, state.daysPerWeek);
  state.intensity = 1.0;
  state.fatigueHistory = [];
  saveState();
  renderAll();
  showToast('🔄 计划已重新生成');
}

// ── View Switching ──────────────────────────────────────────────
function switchView(viewName) {
  $$('.view').forEach(v => v.classList.remove('active'));
  $$('.tab').forEach(t => t.classList.remove('active'));
  $(`#view-${viewName}`).classList.add('active');
  const tab = document.querySelector(`.tab[data-view="${viewName}"]`);
  if (tab) tab.classList.add('active');
  renderAll();
}

// ── Toast ────────────────────────────────────────────────────────
function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  $('#toastContainer').appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s ease';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

// ── Confetti ─────────────────────────────────────────────────────
function spawnConfetti() {
  const container = $('#confettiContainer');
  container.classList.remove('hidden');
  container.innerHTML = '';
  const colors = ['#00e5ff','#00e676','#ff9100','#b388ff','#ff4081','#ffd740','#00b8d4','#ff5252'];

  for (let i = 0; i < 80; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.top = -(Math.random() * 20) + 'px';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.width = (Math.random() * 10 + 6) + 'px';
    confetti.style.height = (Math.random() * 10 + 6) + 'px';
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
    confetti.style.animationDelay = Math.random() * 0.8 + 's';
    container.appendChild(confetti);
  }
  setTimeout(() => {
    container.classList.add('hidden');
    container.innerHTML = '';
  }, 3000);
}

// ── Background Particles ────────────────────────────────────────
function spawnParticles() {
  const container = $('#particles');
  for (let i = 0; i < 20; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.left = Math.random() * 100 + '%';
    particle.style.width = (Math.random() * 3 + 1) + 'px';
    particle.style.height = particle.style.width;
    particle.style.animationDelay = Math.random() * 8 + 's';
    particle.style.animationDuration = (Math.random() * 6 + 6) + 's';
    particle.style.background = Math.random() > 0.5 ? 'var(--cyan)' : 'var(--purple)';
    container.appendChild(particle);
  }
}

// ── Event Listeners ─────────────────────────────────────────────

// Tab switching
$$('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const view = tab.dataset.view;
    switchView(view);
  });
});

// Dashboard → Today navigation
$('#todayPreview').addEventListener('click', () => switchView('today'));

// Complete button
$('#btnComplete').addEventListener('click', completeWorkout);

// Skip button
$('#btnSkip').addEventListener('click', skipToday);

// Feedback submit
$('#btnSubmitFeedback').addEventListener('click', submitFeedback);

// Feedback modal backdrop close
$('#feedbackModal').addEventListener('click', function(e) {
  if (e.target === this) hideFeedback();
});

// Feedback option selection
document.querySelectorAll('.feedback-options').forEach(group => {
  group.addEventListener('click', function(e) {
    const btn = e.target.closest('.feedback-btn');
    if (!btn) return;
    this.querySelectorAll('.feedback-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  });
});

// Onboarding
$('#btnStartPlan').addEventListener('click', startPlan);
$('#onboardingModal').addEventListener('click', function(e) {
  if (e.target === this && state.goal) hideOnboarding();
});
$('#btnEditGoal').addEventListener('click', showOnboarding);
$('#btnRegenerate').addEventListener('click', regeneratePlan);

// Goal options
document.querySelectorAll('#goalOptions .goal-option').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#goalOptions .goal-option').forEach(b => b.classList.remove('selected'));
    this.classList.add('selected');
  });
});

// Level options
document.querySelectorAll('#levelOptions .level-option').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('#levelOptions .level-option').forEach(b => b.classList.remove('selected'));
    this.classList.add('selected');
  });
});

// Days per week slider
$('#daysPerWeek').addEventListener('input', function() {
  $('#daysLabel').textContent = this.value + ' 天/周';
});

// ── Init ────────────────────────────────────────────────────────
function init() {
  spawnParticles();

  // If no plan yet, show onboarding
  if (!state.goal) {
    showOnboarding();
  } else {
    // If plan is empty (maybe from older version), regenerate
    if (!state.weeklyPlan || state.weeklyPlan.length === 0) {
      state.weeklyPlan = generateWeeklyPlan(state.goal, state.level, state.daysPerWeek);
      saveState();
    }
    renderAll();
  }

  // Check if today's workout was already logged and update view
  const todayDate = getTodayDate();
  const todayPlan = getTodayPlan();
  if (todayPlan && state.history.some(h => h.date === todayDate)) {
    todayPlan.completed = true;
    todayPlan.exercises.forEach(e => e._done = true);
    saveState();
  }
}

// Start the app
init();

})();
</script>
