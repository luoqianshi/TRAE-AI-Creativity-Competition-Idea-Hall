<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼豆图纸生成器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-upload" viewBox="0 0 24 24">
        <path d="M12 3v11" />
        <path d="m7.5 8 4.5-4.5L16.5 8" />
        <path d="M6 17.5a4 4 0 0 1 .6-8 5.5 5.5 0 0 1 10.8 0 4 4 0 0 1 .6 8H6Z" />
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path d="m15.5 5.5 3 3" />
        <path d="M4 20h3.5L19 8.5 15.5 5 4 16.5V20Z" />
      </symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24">
        <path d="m12 3 1.7 5.1L19 10l-5.3 1.9L12 17l-1.7-5.1L5 10l5.3-1.9L12 3Z" />
        <path d="M19 16v4" />
        <path d="M17 18h4" />
      </symbol>
      <symbol id="icon-download" viewBox="0 0 24 24">
        <path d="M12 3v12" />
        <path d="m7 10 5 5 5-5" />
        <path d="M4 20h16" />
      </symbol>
      <symbol id="icon-file" viewBox="0 0 24 24">
        <path d="M6 3h8l4 4v14H6V3Z" />
        <path d="M14 3v5h5" />
        <path d="M9 13h6" />
        <path d="M9 17h6" />
      </symbol>
      <symbol id="icon-share" viewBox="0 0 24 24">
        <path d="M18 8a3 3 0 1 0-2.8-4" />
        <path d="M6 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
        <path d="M18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
        <path d="m8.6 12.6 6.8 4" />
        <path d="m15.4 7.4-6.8 4" />
      </symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24">
        <path d="M5 12h14" />
        <path d="m13 6 6 6-6 6" />
      </symbol>
      <symbol id="icon-help" viewBox="0 0 24 24">
        <path d="M12 17h.01" />
        <path d="M9.5 9.4a2.7 2.7 0 1 1 4.6 1.9c-.9.8-1.5 1.3-1.7 2.7" />
        <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z" />
      </symbol>
    </svg>

    <div class="page-bg">
      <main class="app-shell">
        <header class="topbar">
          <div class="window-dots" aria-hidden="true">
            <span class="dot-red"></span>
            <span class="dot-yellow"></span>
            <span class="dot-green"></span>
          </div>

          <div class="brand">
            <div class="brand-mark" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <h1>拼豆图纸生成器</h1>
          </div>

          <nav class="tabs" aria-label="主导航">
            <button class="tab is-active" type="button">首页</button>
            <button class="tab" type="button">模板</button>
            <button class="tab" type="button">帮助</button>
          </nav>

          <button id="topGenerateBtn" class="primary-top" type="button">开始生成</button>
        </header>

        <section class="workspace" aria-label="拼豆图纸工作区">
          <aside class="panel controls-panel">
            <div class="setting-block upload-block">
              <div class="section-title">
                <h2>上传图片</h2>
                <button class="icon-button help-button" type="button" title="支持 JPG、PNG、WebP，最大 10MB">
                  <svg><use href="#icon-help"></use></svg>
                </button>
              </div>

              <label id="dropZone" class="drop-zone" for="imageInput">
                <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" />
                <svg class="upload-icon"><use href="#icon-upload"></use></svg>
                <span>点击上传或拖拽图片到此处</span>
                <small>支持 JPG / PNG / WebP</small>
                <small>最大 10MB</small>
              </label>
            </div>

            <div class="setting-block">
              <div class="section-title">
                <h2>颗粒尺寸</h2>
                <button class="icon-button help-button" type="button" title="成品尺寸会根据颗粒直径自动估算">
                  <svg><use href="#icon-help"></use></svg>
                </button>
              </div>
              <div class="segmented" role="radiogroup" aria-label="颗粒尺寸">
                <button class="choice is-active" type="button" data-size="2.6">2.6mm</button>
                <button class="choice" type="button" data-size="5">5mm</button>
                <button class="choice" type="button" data-size="10">10mm</button>
              </div>
            </div>

            <div class="setting-block">
              <div class="section-title">
                <h2>色板数量</h2>
                <button class="icon-button help-button" type="button" title="颜色越多越接近原图，越少越容易配豆">
                  <svg><use href="#icon-help"></use></svg>
                </button>
              </div>
              <div class="segmented palette-options" role="radiogroup" aria-label="色板数量">
                <button class="choice" type="button" data-palette="16">16色</button>
                <button class="choice is-active" type="button" data-palette="32">32色</button>
                <button class="choice" type="button" data-palette="48">48色</button>
                <button class="choice" type="button" data-palette="64">64色</button>
              </div>
            </div>

            <div class="setting-block density-block">
              <div class="section-title">
                <h2>网格密度</h2>
                <strong id="densityLabel">中等</strong>
              </div>
              <input id="densitySlider" class="range" type="range" min="64" max="140" step="4" value="116" />
              <div class="range-labels">
                <span>低</span>
                <span>中</span>
                <span>高</span>
              </div>
            </div>

            <div class="setting-block correction-row">
              <div>
                <h2>自动修正</h2>
                <p>优化颜色数量，提升图案还原度</p>
              </div>
              <label class="switch">
                <input id="autoEnhance" type="checkbox" checked />
                <span></span>
              </label>
            </div>

            <button id="generateBtn" class="generate-button" type="button">
              <svg><use href="#icon-spark"></use></svg>
              生成图纸
            </button>
          </aside>

          <section class="main-column">
            <article class="panel original-panel">
              <h2>原始图片</h2>
              <div class="image-frame">
                <canvas id="originalCanvas"></canvas>
                <button id="changeImageBtn" class="change-image" type="button">
                  <svg><use href="#icon-edit"></use></svg>
                  更换图片
                </button>
              </div>
            </article>

            <article class="panel palette-panel">
              <div class="palette-header">
                <h2>色板（<span id="paletteCountText">32</span>色）</h2>
                <button id="editPaletteBtn" class="soft-button" type="button">
                  <svg><use href="#icon-edit"></use></svg>
                  编辑色板
                </button>
              </div>
              <div id="swatchGrid" class="swatch-grid" aria-label="生成色板"></div>
            </article>
          </section>

          <div class="flow-arrow" aria-hidden="true">
            <svg><use href="#icon-arrow"></use></svg>
          </div>

          <section class="preview-column">
            <article class="panel preview-panel">
              <h2>拼豆图纸预览</h2>
              <div class="preview-frame">
                <canvas id="previewCanvas"></canvas>
              </div>
            </article>

            <article class="panel info-panel">
              <h2>图纸信息</h2>
              <div class="stats-grid">
                <div class="stat-card">
                  <span>成品尺寸</span>
                  <strong id="sizeText">30.2 × 30.2 cm</strong>
                  <small id="gridText">116 × 116 格</small>
                </div>
                <div class="stat-card">
                  <span>使用颜色</span>
                  <strong id="usedColorText">32 种</strong>
                  <small id="coverageText">覆盖率 89%</small>
                </div>
                <div class="stat-card">
                  <span>颗粒总数</span>
                  <strong id="beadCountText">13,456 颗</strong>
                  <small id="weightText">预估重量 约 148g</small>
                </div>
              </div>
            </article>
          </section>
        </section>

        <footer class="bottom-bar">
          <div class="feature-strip">
            <div class="feature-card">
              <span class="feature-icon">
                <svg><use href="#icon-upload"></use></svg>
              </span>
              <div>
                <strong>AI 自动识别</strong>
                <small>智能识别主体与轮廓</small>
              </div>
            </div>
            <div class="feature-card">
              <span class="feature-icon">
                <svg><use href="#icon-spark"></use></svg>
              </span>
              <div>
                <strong>一键配色</strong>
                <small>科学配色，减少误差</small>
              </div>
            </div>
            <div class="feature-card">
              <span class="feature-icon">
                <svg><use href="#icon-download"></use></svg>
              </span>
              <div>
                <strong>高清导出</strong>
                <small>支持高清 PNG / PDF</small>
              </div>
            </div>
          </div>

          <div class="export-actions">
            <button id="downloadBtn" class="export-button" type="button">
              <svg><use href="#icon-download"></use></svg>
              下载图纸
            </button>
            <button id="pdfBtn" class="export-button" type="button">
              <svg><use href="#icon-file"></use></svg>
              导出 PDF
            </button>
            <button id="shareBtn" class="export-button" type="button">
              <svg><use href="#icon-share"></use></svg>
              分享
            </button>
          </div>
        </footer>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
