<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SilentBridge — 手语学习交互平台 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
/* ===================== CSS 变量 & 重置 ===================== */
:root {
  --bg-cream: #faf6f1;
  --bg-warm: #f5efe7;
  --bg-card: #fffefc;
  --bg-hover: #f0e9df;
  --border-subtle: rgba(45,41,38,0.06);
  --border-default: rgba(45,41,38,0.10);
  --border-strong: rgba(45,41,38,0.18);
  --text-primary: #2d2926;
  --text-secondary: #6b6560;
  --text-tertiary: #a39d96;
  --terracotta: #c4715a;
  --terracotta-dim: rgba(196,113,90,0.12);
  --terracotta-glow: rgba(196,113,90,0.2);
  --sea: #4a9b8e;
  --sea-dim: rgba(74,155,142,0.12);
  --gold: #d4a843;
  --gold-dim: rgba(212,168,67,0.12);
  --lavender: #9b8ec7;
  --lavender-dim: rgba(155,142,199,0.12);
  --coral: #e07a5f;
  --coral-dim: rgba(224,122,95,0.12);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --shadow-sm: 0 2px 8px rgba(45,41,38,0.06);
  --shadow-md: 0 4px 20px rgba(45,41,38,0.08);
  --shadow-lg: 0 8px 40px rgba(45,41,38,0.10);
  --font-display: 'DM Serif Display', serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --header-height: 64px;
  --tab-height: 72px;
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 300ms cubic-bezier(0.22, 1, 0.36, 1);
  --transition-slow: 500ms cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 15px; -webkit-font-smoothing: antialiased; }

body {
  font-family: var(--font-body);
  background: var(--bg-cream);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 10px; }

/* ===================== 应用布局 ===================== */
.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  position: relative;
}

/* ===================== 顶部栏 ===================== */
.top-bar {
  height: var(--header-height);
  min-height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: rgba(250,246,241,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-subtle);
  z-index: 100;
  position: relative;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--terracotta), var(--coral));
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-size: 16px;
  box-shadow: 0 2px 12px var(--terracotta-glow);
}

.brand-text {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 20px;
  color: var(--text-primary);
  letter-spacing: -0.3px;
}

.brand-tag {
  font-size: 10px;
  color: var(--text-tertiary);
  background: var(--bg-warm);
  padding: 2px 10px;
  border-radius: 20px;
  border: 1px solid var(--border-subtle);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.top-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 14px;
}

.top-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

.streak-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--gold-dim);
  border: 1px solid rgba(212,168,67,0.15);
  border-radius: 20px;
  font-size: 13px;
  color: var(--gold);
  font-weight: 600;
}

.streak-badge i { font-size: 14px; }

/* ===================== 内容区 ===================== */
.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  padding-bottom: calc(var(--tab-height) + 16px);
}

/* ===================== 底部导航 ===================== */
.bottom-tab {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: var(--tab-height);
  background: rgba(255,254,252,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
  padding: 0 12px;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

.tab-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition-fast);
  color: var(--text-tertiary);
  font-size: 11px;
  user-select: none;
  position: relative;
}

.tab-item i { font-size: 20px; transition: transform var(--transition-fast); }

.tab-item:hover { color: var(--text-secondary); }
.tab-item:hover i { transform: translateY(-2px); }

.tab-item.active {
  color: var(--terracotta);
  font-weight: 500;
}

.tab-item.active::after {
  content: '';
  position: absolute;
  bottom: -8px;
  width: 20px; height: 3px;
  background: var(--terracotta);
  border-radius: 3px;
}

/* ===================== 页面视图 ===================== */
.page-view { display: none; animation: pageIn 400ms ease-out; }
.page-view.active { display: block; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-padding { padding: 20px 24px; }

/* ===================== 首页仪表盘 ===================== */
.hero-card {
  background: linear-gradient(135deg, var(--terracotta), var(--coral));
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  color: white;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.hero-card::before {
  content: '';
  position: absolute;
  top: -40px; right: -40px;
  width: 160px; height: 160px;
  background: rgba(255,255,255,0.08);
  border-radius: 50%;
}

.hero-card::after {
  content: '';
  position: absolute;
  bottom: -30px; left: 40%;
  width: 100px; height: 100px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
}

.hero-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 400;
  margin-bottom: 8px;
  position: relative;
  z-index: 1;
}

.hero-subtitle {
  font-size: 14px;
  opacity: 0.85;
  line-height: 1.6;
  position: relative;
  z-index: 1;
}

.hero-progress {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
  position: relative;
  z-index: 1;
}

.hero-progress-bar {
  flex: 1;
  height: 8px;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  overflow: hidden;
}

.hero-progress-fill {
  height: 100%;
  background: rgba(255,255,255,0.9);
  border-radius: 10px;
  transition: width 800ms ease-out;
}

.hero-progress-text {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

/* 统计小卡片 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.stat-mini {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px 12px;
  text-align: center;
  transition: all var(--transition-fast);
}

.stat-mini:hover { box-shadow: var(--shadow-sm); transform: translateY(-2px); }

.stat-mini-icon {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
  font-size: 16px;
}

.stat-mini-value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
}

.stat-mini-label {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
}

/* 今日挑战卡片 */
.challenge-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 20px;
  cursor: pointer;
  transition: all var(--transition-normal);
  position: relative;
  overflow: hidden;
}

.challenge-card:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--border-default);
}

.challenge-card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 80px; height: 80px;
  background: linear-gradient(135deg, var(--sea-dim), transparent);
  border-radius: 0 0 0 80px;
}

.challenge-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.challenge-badge {
  background: var(--sea-dim);
  color: var(--sea);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 20px;
}

.challenge-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.challenge-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.challenge-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  padding: 10px 20px;
  background: linear-gradient(135deg, var(--sea), #3d8a7e);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition-fast);
  font-family: var(--font-body);
}

.challenge-btn:hover { box-shadow: 0 4px 16px var(--sea-dim); transform: translateY(-1px); }

/* 最近学习 */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.section-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 400;
  color: var(--text-primary);
}

.section-more {
  font-size: 13px;
  color: var(--terracotta);
  cursor: pointer;
  font-weight: 500;
  transition: opacity var(--transition-fast);
}

.section-more:hover { opacity: 0.7; }

.recent-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.recent-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.recent-item:hover {
  border-color: var(--border-default);
  box-shadow: var(--shadow-sm);
}

.recent-thumb {
  width: 48px; height: 48px;
  border-radius: var(--radius-sm);
  background: var(--bg-warm);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}

.recent-info { flex: 1; min-width: 0; }
.recent-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
.recent-meta { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; }

.recent-progress {
  width: 40px; height: 40px;
  position: relative;
  flex-shrink: 0;
}

.recent-progress svg { transform: rotate(-90deg); }
.recent-progress-value {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-secondary);
}

/* ===================== 词汇库页面 ===================== */
.category-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 6px;
  margin-bottom: 16px;
  scrollbar-width: none;
}

.category-tabs::-webkit-scrollbar { display: none; }

.cat-chip {
  padding: 8px 18px;
  font-size: 13px;
  border-radius: 20px;
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-family: var(--font-body);
  white-space: nowrap;
  flex-shrink: 0;
}

.cat-chip:hover { border-color: var(--border-default); color: var(--text-primary); }
.cat-chip.active {
  background: var(--terracotta);
  color: white;
  border-color: var(--terracotta);
  font-weight: 500;
}

.vocab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}

.vocab-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition-normal);
  position: relative;
}

.vocab-card:hover {
  border-color: var(--border-default);
  box-shadow: var(--shadow-md);
  transform: translateY(-3px);
}

.vocab-card.learned::after {
  content: '';
  position: absolute;
  top: 8px; right: 8px;
  width: 8px; height: 8px;
  background: var(--sea);
  border-radius: 50%;
  box-shadow: 0 0 0 2px var(--bg-card);
}

.vocab-hand {
  width: 60px; height: 60px;
  margin: 0 auto 10px;
  position: relative;
}

.vocab-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.vocab-pinyin {
  font-size: 12px;
  color: var(--text-tertiary);
}

/* ===================== 学习模式 ===================== */
.learn-stage {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
}

.learn-hand-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 0;
}

/* 手势动画引擎 — 手部模型 */
.hand-model {
  width: 140px;
  height: 180px;
  position: relative;
  margin: 0 auto;
}

.hand-palm {
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 70px; height: 75px;
  background: linear-gradient(180deg, #e8c4a8, #d4a88a);
  border-radius: 50% 50% 45% 45%;
  z-index: 2;
}

.hand-palm::after {
  content: '';
  position: absolute;
  top: 15px; left: 50%;
  transform: translateX(-50%);
  width: 30px; height: 20px;
  background: rgba(180,130,90,0.2);
  border-radius: 50%;
}

/* 手指基础样式 */
.finger {
  position: absolute;
  background: linear-gradient(180deg, #e8c4a8, #d4a88a);
  border-radius: 10px 10px 6px 6px;
  transform-origin: bottom center;
  transition: transform 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
}

.finger::after {
  content: '';
  position: absolute;
  top: 2px; left: 50%;
  transform: translateX(-50%);
  width: 60%; height: 8px;
  background: rgba(180,130,90,0.15);
  border-radius: 4px;
}

/* 食指 */
.finger-index {
  width: 16px; height: 58px;
  bottom: 55px; left: 50%;
  transform: translateX(-50%) translateX(-24px) rotate(-8deg);
  z-index: 3;
}

/* 中指 */
.finger-middle {
  width: 16px; height: 64px;
  bottom: 58px; left: 50%;
  transform: translateX(-50%) rotate(0deg);
  z-index: 3;
}

/* 无名指 */
.finger-ring {
  width: 16px; height: 56px;
  bottom: 54px; left: 50%;
  transform: translateX(-50%) translateX(24px) rotate(8deg);
  z-index: 3;
}

/* 小指 */
.finger-pinky {
  width: 14px; height: 44px;
  bottom: 48px; left: 50%;
  transform: translateX(-50%) translateX(44px) rotate(16deg);
  z-index: 1;
}

/* 拇指 */
.finger-thumb {
  width: 18px; height: 36px;
  bottom: 28px; left: 50%;
  transform: translateX(-50%) translateX(-42px) rotate(-55deg);
  border-radius: 10px 8px 6px 12px;
  z-index: 4;
}

/* ===== 手势状态 ===== */

/* 五指张开 */
.hand-open .finger-index { transform: translateX(-50%) translateX(-30px) rotate(-20deg); }
.hand-open .finger-middle { transform: translateX(-50%) rotate(0deg); }
.hand-open .finger-ring { transform: translateX(-50%) translateX(30px) rotate(20deg); }
.hand-open .finger-pinky { transform: translateX(-50%) translateX(48px) rotate(35deg); }
.hand-open .finger-thumb { transform: translateX(-50%) translateX(-48px) rotate(-45deg); }

/* 握拳 */
.hand-fist .finger-index { transform: translateX(-50%) translateX(-18px) rotate(0deg) scaleY(0.4); }
.hand-fist .finger-middle { transform: translateX(-50%) rotate(0deg) scaleY(0.4); }
.hand-fist .finger-ring { transform: translateX(-50%) translateX(18px) rotate(0deg) scaleY(0.4); }
.hand-fist .finger-pinky { transform: translateX(-50%) translateX(34px) rotate(0deg) scaleY(0.4); }
.hand-fist .finger-thumb { transform: translateX(-50%) translateX(-30px) rotate(-30deg) scaleY(0.7); }

/* 食指指向前方 */
.hand-point .finger-index { transform: translateX(-50%) translateX(-24px) rotate(-8deg) scaleY(1); }
.hand-point .finger-middle { transform: translateX(-50%) rotate(0deg) scaleY(0.35); }
.hand-point .finger-ring { transform: translateX(-50%) translateX(24px) rotate(8deg) scaleY(0.35); }
.hand-point .finger-pinky { transform: translateX(-50%) translateX(44px) rotate(16deg) scaleY(0.3); }
.hand-point .finger-thumb { transform: translateX(-50%) translateX(-36px) rotate(-50deg) scaleY(0.7); }

/* 竖大拇指 */
.hand-thumbup .finger-index { transform: translateX(-50%) translateX(-18px) rotate(0deg) scaleY(0.3); }
.hand-thumbup .finger-middle { transform: translateX(-50%) rotate(0deg) scaleY(0.3); }
.hand-thumbup .finger-ring { transform: translateX(-50%) translateX(18px) rotate(0deg) scaleY(0.3); }
.hand-thumbup .finger-pinky { transform: translateX(-50%) translateX(34px) rotate(0deg) scaleY(0.3); }
.hand-thumbup .finger-thumb { transform: translateX(-50%) translateX(-38px) rotate(-85deg) scaleY(1.2); }

/* OK手势 */
.hand-ok .finger-index { transform: translateX(-50%) translateX(-18px) rotate(0deg) scaleY(0.45); }
.hand-ok .finger-middle { transform: translateX(-50%) rotate(0deg) scaleY(0.45); }
.hand-ok .finger-ring { transform: translateX(-50%) translateX(18px) rotate(0deg) scaleY(0.45); }
.hand-ok .finger-pinky { transform: translateX(-50%) translateX(34px) rotate(0deg) scaleY(0.4); }
.hand-ok .finger-thumb { transform: translateX(-50%) translateX(-28px) rotate(-25deg) scaleY(0.6); }

/* 数字2（V字） */
.hand-peace .finger-index { transform: translateX(-50%) translateX(-26px) rotate(-18deg) scaleY(1); }
.hand-peace .finger-middle { transform: translateX(-50%) rotate(12deg) scaleY(1); }
.hand-peace .finger-ring { transform: translateX(-50%) translateX(22px) rotate(0deg) scaleY(0.3); }
.hand-peace .finger-pinky { transform: translateX(-50%) translateX(38px) rotate(0deg) scaleY(0.25); }
.hand-peace .finger-thumb { transform: translateX(-50%) translateX(-30px) rotate(-45deg) scaleY(0.6); }

/* 数字3 */
.hand-three .finger-index { transform: translateX(-50%) translateX(-28px) rotate(-14deg) scaleY(1); }
.hand-three .finger-middle { transform: translateX(-50%) rotate(0deg) scaleY(1); }
.hand-three .finger-ring { transform: translateX(-50%) translateX(26px) rotate(14deg) scaleY(1); }
.hand-three .finger-pinky { transform: translateX(-50%) translateX(42px) rotate(0deg) scaleY(0.25); }
.hand-three .finger-thumb { transform: translateX(-50%) translateX(-30px) rotate(-45deg) scaleY(0.6); }

/* 数字4 */
.hand-four .finger-index { transform: translateX(-50%) translateX(-30px) rotate(-16deg) scaleY(1); }
.hand-four .finger-middle { transform: translateX(-50%) rotate(-2deg) scaleY(1); }
.hand-four .finger-ring { transform: translateX(-50%) translateX(28px) rotate(12deg) scaleY(1); }
.hand-four .finger-pinky { transform: translateX(-50%) translateX(48px) rotate(28deg) scaleY(1); }
.hand-four .finger-thumb { transform: translateX(-50%) translateX(-28px) rotate(-30deg) scaleY(0.55); }

/* 数字5 */
.hand-five .finger-index { transform: translateX(-50%) translateX(-30px) rotate(-18deg) scaleY(1); }
.hand-five .finger-middle { transform: translateX(-50%) rotate(0deg) scaleY(1); }
.hand-five .finger-ring { transform: translateX(-50%) translateX(30px) rotate(16deg) scaleY(1); }
.hand-five .finger-pinky { transform: translateX(-50%) translateX(50px) rotate(32deg) scaleY(1); }
.hand-five .finger-thumb { transform: translateX(-50%) translateX(-46px) rotate(-40deg) scaleY(1); }

/* 爱心（单手示意） */
.hand-love .finger-index { transform: translateX(-50%) translateX(-22px) rotate(-35deg) scaleY(0.8); }
.hand-love .finger-middle { transform: translateX(-50%) rotate(0deg) scaleY(0.5); }
.hand-love .finger-ring { transform: translateX(-50%) translateX(22px) rotate(35deg) scaleY(0.8); }
.hand-love .finger-pinky { transform: translateX(-50%) translateX(38px) rotate(20deg) scaleY(0.3); }
.hand-love .finger-thumb { transform: translateX(-50%) translateX(-36px) rotate(-60deg) scaleY(0.8); }

/* 挥手动画 */
@keyframes waveHand {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(15deg); }
  75% { transform: rotate(-15deg); }
}

.hand-wave { animation: waveHand 1.2s ease-in-out infinite; }
.hand-wave .finger-index { transform: translateX(-50%) translateX(-30px) rotate(-20deg) scaleY(1); }
.hand-wave .finger-middle { transform: translateX(-50%) rotate(0deg) scaleY(1); }
.hand-wave .finger-ring { transform: translateX(-50%) translateX(30px) rotate(20deg) scaleY(1); }
.hand-wave .finger-pinky { transform: translateX(-50%) translateX(48px) rotate(35deg) scaleY(1); }
.hand-wave .finger-thumb { transform: translateX(-50%) translateX(-48px) rotate(-45deg) scaleY(1); }

/* 步骤指示器 */
.step-indicator {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 20px;
}

.step-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border-default);
  transition: all var(--transition-normal);
}

.step-dot.active {
  width: 28px;
  border-radius: 10px;
  background: var(--terracotta);
}

.step-label {
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.learn-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.learn-control-btn {
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: 1px solid var(--border-subtle);
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 16px;
  transition: all var(--transition-fast);
}

.learn-control-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

.learn-control-btn.primary {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--terracotta), var(--coral));

  font-size: 20px;
  box-shadow: 0 4px 16px var(--terracotta-glow);
}

.learn-control-btn.primary:hover { transform: scale(1.05); }

.learn-speed {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
  font-size: 12px;
  color: var(--text-tertiary);
}

.learn-speed span { cursor: pointer; padding: 2px 8px; border-radius: 4px; transition: all var(--transition-fast); }
.learn-speed span:hover { color: var(--text-secondary); }
.learn-speed span.active { color: var(--terracotta); font-weight: 600; background: var(--terracotta-dim); }

/* ===================== 场景对话 ===================== */
.scene-card {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;

  transition: all var(--transition-normal);
}

.scene-card:hover {
  box-shadow: var(--shadow-md);

}

.scene-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.scene-icon {

  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.scene-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.scene-desc { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

.scene-words {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.scene-word {
  padding: 6px 14px;
  background: var(--bg-warm);
  border-radius: 20px;
  font-size: 13px;
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
}

/* 对话模拟器 */
.chat-simulator {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
}

.chat-bubble {

  gap: 10px;
  margin-bottom: 14px;
  animation: fadeUp 400ms ease-out both;
}

.chat-bubble.self { flex-direction: row-reverse; }

.chat-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.chat-content {
  background: var(--bg-warm);
  padding: 10px 14px;
  border-radius: 16px;
  border-bottom-left-radius: 4px;
  font-size: 13px;
  color: var(--text-primary);
  max-width: 70%;
  line-height: 1.5;
}

.chat-bubble.self .chat-content {
  background: var(--terracotta-dim);
  border-bottom-left-radius: 16px;
  border-bottom-right-radius: 4px;
}

.chat-sign {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--bg-card);
  border: 1px dashed var(--border-default);
  border-radius: var(--radius-sm);
  margin-top: 6px;
  font-size: 12px;
  color: var(--terracotta);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.chat-sign:hover { background: var(--terracotta-dim); border-style: solid; }

/* ===================== 每日挑战 ===================== */
.challenge-game {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
  text-align: center;
}

.challenge-question {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.challenge-hint {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-bottom: 24px;
}

.challenge-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}

.challenge-option {
  padding: 16px;
  background: var(--bg-warm);
  border: 2px solid transparent;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
}

.challenge-option:hover { border-color: var(--border-default); background: var(--bg-hover); }

.challenge-option.correct {
  border-color: var(--sea);
  background: var(--sea-dim);
  color: var(--sea);
}

.challenge-option.wrong {
  border-color: var(--coral);
  background: var(--coral-dim);
  color: var(--coral);
}

.challenge-result {
  padding: 16px;
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  font-size: 14px;
  display: none;
}

.challenge-result.show { display: block; }
.challenge-result.correct { background: var(--sea-dim); color: var(--sea); }
.challenge-result.wrong { background: var(--coral-dim); color: var(--coral); }

/* ===================== 个人中心 ===================== */
.profile-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  padding: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
}

.profile-avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--terracotta), var(--coral));
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  color: white;
  flex-shrink: 0;
}

.profile-name { font-size: 18px; font-weight: 600; color: var(--text-primary); }
.profile-level { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

.achievement-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.achievement-item {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 16px 10px;
  text-align: center;
  transition: all var(--transition-fast);
}

.achievement-item:hover { box-shadow: var(--shadow-sm); }

.achievement-item.locked { opacity: 0.4; }

.achievement-icon {
  font-size: 28px;
  margin-bottom: 6px;
}

.achievement-name { font-size: 11px; color: var(--text-secondary); }

.settings-list {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: background var(--transition-fast);
}

.settings-item:last-child { border-bottom: none; }

.settings-item:hover { background: var(--bg-hover); }

.settings-item-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.settings-item-icon {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

.settings-item-text { font-size: 14px; color: var(--text-primary); }
.settings-item-arrow { color: var(--text-tertiary); font-size: 12px; }

/* ===================== 弹窗 ===================== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(45,41,38,0.4);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition-normal);
}

.modal-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.modal-sheet {
  background: var(--bg-card);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  transform: translateY(100%);
  transition: transform var(--transition-slow);
  display: flex;
  flex-direction: column;
}

.modal-overlay.visible .modal-sheet {
  transform: translateY(0);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px 12px;
}

.modal-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 400;
}

.modal-close {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: none;
  background: var(--bg-warm);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  transition: all var(--transition-fast);
}

.modal-close:hover { background: var(--bg-hover); color: var(--text-primary); }

.modal-body {
  padding: 0 20px 20px;
  overflow-y: auto;
  flex: 1;
}

/* ===================== Toast ===================== */
.toast-container {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 90%;
  max-width: 360px;
}

.toast {
  background: var(--bg-card);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--text-primary);
  animation: toastSlide 300ms ease-out;
}

.toast.success { border-left: 3px solid var(--sea); }
.toast.success i { color: var(--sea); }
.toast.error { border-left: 3px solid var(--coral); }
.toast.error i { color: var(--coral); }
.toast.info { border-left: 3px solid var(--lavender); }
.toast.info i { color: var(--lavender); }

@keyframes toastSlide {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===================== 空状态 ===================== */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-tertiary);
}
.empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
.empty-state p { font-size: 14px; }

/* ===================== 动画 ===================== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.stagger-1 { animation-delay: 60ms; }
.stagger-2 { animation-delay: 120ms; }
.stagger-3 { animation-delay: 180ms; }
.stagger-4 { animation-delay: 240ms; }
.stagger-5 { animation-delay: 300ms; }
</style>
</head>

/**

 */
const ACHIEVEMENTS = [
  { id: 'first_learn', name: '初识手语', icon: '🌱', condition: s => s.learned >= 1 },

];

/**
 * 应用状态
 */
let appState = {
  learnedIds: [],       // 已学词汇ID列表
  favorites: [],        // 收藏词汇ID列表
  streak: 3,            // 连续学习天数
  challenges: 0,        // 完成挑战次数
  minutes: 0,           // 学习分钟数
  scenes: 0,            // 完成场景数
  currentCategory: '全部',
  learnProgress: {},    // 每个词汇的学习进度 { vocabId: stepIndex }
  lastStudyDate: null,
  morningStudy: false,
  nightStudy: false
};

/**
 * 学习模式当前状态
 */
let learnState = {
  vocabId: null,
  currentStep: 0,
  isPlaying: false,
  playInterval: null,
  speed: 1
};

/**
 * 挑战状态
 */
let challengeState = {
  questions: [],
  currentIndex: 0,
  score: 0,
  answered: false
};

/* ===================== 初始化 ===================== */

/** 应用初始化入口 */
function init() {
  loadData();
  renderAll();
  checkDailyStreak();
}

/** 从 localStorage 加载持久化数据 */
function loadData() {
  const saved = localStorage.getItem('silentbridge_data');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      appState = { ...appState, ...parsed };
    } catch (e) {
      console.warn('数据加载失败，使用默认状态');
    }
  }
}

/** 保存数据到 localStorage */
function saveData() {
  localStorage.setItem('silentbridge_data', JSON.stringify(appState));
}

/** 检查每日连续学习 streak */
function checkDailyStreak() {
  const today = new Date().toDateString();
  const last = appState.lastStudyDate;

  if (!last) return;

  const lastDate = new Date(last);
  const todayDate = new Date(today);
  const diffDays = Math.floor((todayDate - lastDate) / (1000 * 60 * 60 * 24));

  if (diffDays > 1) {
    // 断签
    appState.streak = 0;
    saveData();
    renderHome();
  }
}

/** 记录学习时间 */
function recordStudy() {
  const now = new Date();
  const hour = now.getHours();

  appState.lastStudyDate = now.toDateString();
  appState.minutes += 2;

  if (hour < 9) appState.morningStudy = true;
  if (hour >= 21) appState.nightStudy = true;

  saveData();
}

/** 渲染所有页面 */
function renderAll() {
  renderHome();
  renderVocab();
  renderScenes();
  renderProfile();
}

/* ===================== 页面切换 ===================== */

/**
 * 切换底部Tab页面
 * @param {string} tab - 目标页面标识
 */
function switchTab(tab) {
  // 更新Tab高亮
  document.querySelectorAll('.tab-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });

  // 切换页面视图
  document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
  const target = document.getElementById('page-' + tab);
  if (target) {
    target.classList.add('active');
    target.scrollTop = 0;
  }

  // 页面特定刷新
  if (tab === 'vocab') renderVocab();
  if (tab === 'challenge') initChallenge();
  if (tab === 'profile') renderProfile();
}

/* ===================== 首页渲染 ===================== */

/** 渲染首页内容 */
function renderHome() {
  const total = SIGN_VOCABULARY.length;
  const learned = appState.learnedIds.length;
  const percent = Math.round((learned / total) * 100);

  // 更新进度条
  const fill = document.getElementById('heroProgress');
  const text = document.getElementById('heroProgressText');
  if (fill) {
    setTimeout(() => { fill.style.width = percent + '%'; }, 100);
  }
  if (text) text.textContent = `${learned}/${total}`;

  // 统计数据
  document.getElementById('statLearned').textContent = learned;
  document.getElementById('statMinutes').textContent = appState.minutes;
  document.getElementById('statChallenges').textContent = appState.challenges;
  document.getElementById('streakCount').textContent = appState.streak;

  // 最近学习列表（取最后学习的5个）
  const recentIds = appState.learnedIds.slice(-5).reverse();
  const recentList = document.getElementById('recentList');

  if (recentIds.length === 0) {
    recentList.innerHTML = `
      <div class="empty-state" style="padding: 24px;">
        <i class="fas fa-hand-sparkles"></i>
        <p>还没有学习记录，去词汇库开始吧！</p>
      </div>`;
    return;
  }

  recentList.innerHTML = recentIds.map((id, i) => {
    const vocab = SIGN_VOCABULARY.find(v => v.id === id);
    if (!vocab) return '';
    const progress = appState.learnProgress[id] || 0;
    const percent = Math.round((progress / vocab.steps.length) * 100);
    const colors = ['var(--terracotta)', 'var(--sea)', 'var(--gold)', 'var(--lavender)', 'var(--coral)'];
    const color = colors[i % colors.length];

    return `
    <div class="recent-item" onclick="openLearn(${vocab.id})" style="animation: fadeUp 400ms ease-out ${i * 80}ms both;">
      <div class="recent-thumb">${vocab.emoji}</div>
      <div class="recent-info">
        <div class="recent-name">${escapeHtml(vocab.name)}</div>
        <div class="recent-meta">${escapeHtml(vocab.pinyin)} · ${escapeHtml(vocab.category)}</div>
      </div>
      <div class="recent-progress">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="16" fill="none" stroke="var(--border-subtle)" stroke-width="3"/>
          <circle cx="20" cy="20" r="16" fill="none" stroke="${color}" stroke-width="3"
            stroke-dasharray="${percent * 1.005} ${100 - percent * 1.005}"
            stroke-linecap="round"/>
        </svg>
        <div class="recent-progress-value">${percent}%</div>
      </div>
    </div>`;
  }).join('');
}

/* ===================== 词汇库渲染 ===================== */

/** 渲染词汇库页面 */
function renderVocab() {
  // 分类标签
  const categories = ['全部', ...new Set(SIGN_VOCABULARY.map(v => v.category))];
  const tabsContainer = document.getElementById('categoryTabs');
  tabsContainer.innerHTML = categories.map(cat => `
    <button class="cat-chip ${appState.currentCategory === cat ? 'active' : ''}" onclick="filterCategory('${cat}')">${cat}</button>
  `).join('');

  // 词汇网格
  const filtered = appState.currentCategory === '全部'
    ? SIGN_VOCABULARY
    : SIGN_VOCABULARY.filter(v => v.category === appState.currentCategory);

  document.getElementById('vocabCountText').textContent = `共 ${filtered.length} 个词汇`;

  const grid = document.getElementById('vocabGrid');
  grid.innerHTML = filtered.map((v, i) => `
    <div class="vocab-card ${appState.learnedIds.includes(v.id) ? 'learned' : ''}"
         onclick="openLearn(${v.id})"
         style="animation: fadeUp 400ms ease-out ${i * 50}ms both;">
      <div class="vocab-hand">${renderMiniHand(v.gesture)}</div>
      <div class="vocab-name">${escapeHtml(v.name)}</div>
      <div class="vocab-pinyin">${escapeHtml(v.pinyin)}</div>
    </div>
  `).join('');
}

/**
 * 渲染迷你手部示意（用于词汇卡片）
 * @param {string} gesture - 手势类型
 * @returns {string} SVG/HTML 字符串
 */
function renderMiniHand(gesture) {
  // 使用简化的emoji或图标表示
  const gestureEmojis = {
    wave: '👋', point: '☝️', peace: '✌️', thumbup: '👍',
    fist: '✊', open: '🖐️', ok: '👌', three: '3️⃣',
    four: '4️⃣', five: '🖐️', love: '❤️'
  };
  return `<div style="font-size: 36px; line-height: 60px;">${gestureEmojis[gesture] || '✋'}</div>`;
}

/** 按分类筛选词汇 */
function filterCategory(category) {
  appState.currentCategory = category;
  renderVocab();
}

/* ===================== 学习模式 ===================== */

/**
 * 打开学习模式弹窗
 * @param {number} vocabId - 词汇ID
 */
function openLearn(vocabId) {
  const vocab = SIGN_VOCABULARY.find(v => v.id === vocabId);
  if (!vocab) return;

  learnState.vocabId = vocabId;
  learnState.currentStep = appState.learnProgress[vocabId] || 0;
  learnState.isPlaying = false;
  if (learnState.playInterval) clearInterval(learnState.playInterval);

  document.getElementById('learnModalTitle').textContent = `学习：${vocab.name}`;
  renderLearnSteps();
  updateHandPose(vocab.gesture);
  openModal('learnModal');

  recordStudy();
}

/** 渲染学习步骤指示器 */
function renderLearnSteps() {
  const vocab = SIGN_VOCABULARY.find(v => v.id === learnState.vocabId);
  if (!vocab) return;

  const indicator = document.getElementById('stepIndicator');
  indicator.innerHTML = vocab.steps.map((_, i) => `
    <div class="step-dot ${i === learnState.currentStep ? 'active' : ''}"></div>
  `).join('');

  document.getElementById('stepLabel').textContent =
    `步骤 ${learnState.currentStep + 1}/${vocab.steps.length}：${vocab.steps[learnState.currentStep]}`;

  // 更新按钮状态
  document.getElementById('btnPrev').style.opacity = learnState.currentStep === 0 ? '0.3' : '1';
  document.getElementById('btnNext').style.opacity =
    learnState.currentStep >= vocab.steps.length - 1 ? '0.3' : '1';
}

/**
 * 更新手部姿态
 * @param {string} gesture - 手势类型
 */
function updateHandPose(gesture) {
  const hand = document.getElementById('learnHand');
  hand.className = 'hand-model';

  // 移除所有手势类
  const gestureClasses = ['hand-open', 'hand-fist', 'hand-point', 'hand-peace',
    'hand-thumbup', 'hand-ok', 'hand-three', 'hand-four', 'hand-five', 'hand-love', 'hand-wave'];
  gestureClasses.forEach(c => hand.classList.remove(c));

  // 添加新手势类
  hand.classList.add('hand-' + gesture);
}

/** 播放/暂停自动步骤 */
function togglePlay() {
  const vocab = SIGN_VOCABULARY.find(v => v.id === learnState.vocabId);
  if (!vocab) return;

  if (learnState.isPlaying) {
    // 暂停
    learnState.isPlaying = false;
    clearInterval(learnState.playInterval);
    document.getElementById('btnPlay').innerHTML = '<i class="fas fa-play"></i>';
  } else {
    // 播放
    learnState.isPlaying = true;
    document.getElementById('btnPlay').innerHTML = '<i class="fas fa-pause"></i>';

    const stepTime = 2000 / learnState.speed;
    learnState.playInterval = setInterval(() => {
      if (learnState.currentStep < vocab.steps.length - 1) {
        learnState.currentStep++;
        renderLearnSteps();
      } else {
        // 播放完毕
        learnState.isPlaying = false;
        clearInterval(learnState.playInterval);
        document.getElementById('btnPlay').innerHTML = '<i class="fas fa-redo"></i>';
        learnState.currentStep = 0;
      }
    }, stepTime);
  }
}

/** 上一步 */
function prevStep() {
  if (learnState.currentStep > 0) {
    learnState.currentStep--;
    renderLearnSteps();
  }
}

/** 下一步 */
function nextStep() {
  const vocab = SIGN_VOCABULARY.find(v => v.id === learnState.vocabId);
  if (!vocab) return;
  if (learnState.currentStep < vocab.steps.length - 1) {
    learnState.currentStep++;
    renderLearnSteps();
  }
}

/** 设置播放速度 */
function setSpeed(speed) {
  learnState.speed = speed;
  document.querySelectorAll('.learn-speed span').forEach(el => {
    el.classList.toggle('active', el.textContent === speed + 'x');
  });
}

/** 标记为已学会 */
function markLearned() {
  const vocab = SIGN_VOCABULARY.find(v => v.id === learnState.vocabId);
  if (!vocab) return;

  if (!appState.learnedIds.includes(vocab.id)) {
    appState.learnedIds.push(vocab.id);
  }

  appState.learnProgress[vocab.id] = vocab.steps.length;
  saveData();
  renderAll();
  closeModal('learnModal');
  showToast(`已学会「${vocab.name}」！`, 'success');
}

      </div>
      <div class="scene-words">
        ${scene.words.map(w => `<span class="scene-word">${escapeHtml(w)}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

/**
 * 打开场景对话弹窗
 * @param {number} sceneId - 场景ID
 */
function openScene(sceneId) {
  const scene = SCENES.find(s => s.id === sceneId);
  if (!scene) return;

  appState.scenes = Math.max(appState.scenes, sceneId);
  saveData();

  document.getElementById('sceneModalTitle').textContent = scene.title;

  const body = document.getElementById('sceneModalBody');
  body.innerHTML = scene.dialog.map((d, i) => `
    <div class="chat-bubble ${d.speaker}" style="animation-delay: ${i * 300}ms;">
      <div class="chat-avatar" style="background: ${d.speaker === 'self' ? 'var(--terracotta-dim)' : 'var(--sea-dim)'}; color: ${d.speaker === 'self' ? 'var(--terracotta)' : 'var(--sea)'};">
        <i class="fas ${d.speaker === 'self' ? 'fa-user' : 'fa-user-friends'}"></i>
      </div>
      <div>
        <div class="chat-content">${escapeHtml(d.text)}</div>
        ${d.sign ? `<div class="chat-sign" onclick="openLearnByName('${escapeHtml(d.sign)}')">👋 查看「${escapeHtml(d.sign)}」手势 <i class="fas fa-arrow-right" style="font-size: 10px;"></i></div>` : ''}
      </div>
    </div>
  `).join('');

  openModal('sceneModal');
  recordStudy();
}

/**
 * 通过名称打开学习模式
 * @param {string} name - 词汇名称
 */
function openLearnByName(name) {
  const vocab = SIGN_VOCABULARY.find(v => v.name === name);
  if (vocab) {
    closeModal('sceneModal');
    setTimeout(() => openLearn(vocab.id), 400);
  }
}

/* ===================== 每日挑战 ===================== */

/** 初始化挑战 */
function initChallenge() {
  // 生成5道随机题目
  const questions = [];
  const usedIds = new Set();

  for (let i = 0; i < 5; i++) {
    let vocab;
    do {
      vocab = SIGN_VOCABULARY[Math.floor(Math.random() * SIGN_VOCABULARY.length)];
    } while (usedIds.has(vocab.id));
    usedIds.add(vocab.id);

    // 生成选项（包含正确答案和3个干扰项）
    const options = [vocab];
    const others = SIGN_VOCABULARY.filter(v => v.id !== vocab.id);
    for (let j = 0; j < 3; j++) {
      const idx = Math.floor(Math.random() * others.length);
      options.push(others.splice(idx, 1)[0]);
    }
    // 打乱选项
    options.sort(() => Math.random() - 0.5);

    questions.push({
      vocab,
      options,
      answered: false,
      correct: false
    });
  }

  challengeState = {
    questions,
    currentIndex: 0,
    score: 0,
    answered: false
  };

  renderChallenge();
}

/** 渲染挑战题目 */
function renderChallenge() {
  const q = challengeState.questions[challengeState.currentIndex];
  const container = document.getElementById('challengeGame');

  document.getElementById('challengeProgressText').textContent =
    `第 ${challengeState.currentIndex + 1}/5 题 · 得分 ${challengeState.score}`;

  container.innerHTML = `
    <div class="challenge-question">这个手势代表什么意思？</div>
    <div class="challenge-hint">${q.vocab.emoji} ${escapeHtml(q.vocab.pinyin)}</div>
    <div style="font-size: 48px; margin: 16px 0;">${renderMiniHand(q.vocab.gesture)}</div>
    <div class="challenge-options" id="challengeOptions">
      ${q.options.map((opt, i) => `
        <button class="challenge-option" onclick="answerChallenge(${i})" id="opt${i}">${escapeHtml(opt.name)}</button>
      `).join('')}
    </div>
    <div class="challenge-result" id="challengeResult"></div>
    <button class="challenge-btn" id="challengeNextBtn" style="display: none; margin-top: 10px;" onclick="nextChallenge()">下一题 <i class="fas fa-arrow-right"></i></button>
  `;
}

/**
 * 回答挑战题目
 * @param {number} optionIndex - 选择的选项索引
 */
function answerChallenge(optionIndex) {
  const q = challengeState.questions[challengeState.currentIndex];
  if (q.answered) return;

  q.answered = true;
  const selected = q.options[optionIndex];
  const isCorrect = selected.id === q.vocab.id;
  q.correct = isCorrect;

  if (isCorrect) challengeState.score += 20;

  // 显示结果
  const resultEl = document.getElementById('challengeResult');
  resultEl.className = `challenge-result ${isCorrect ? 'correct' : 'wrong'} show`;
  resultEl.innerHTML = isCorrect
    ? '<i class="fas fa-check-circle"></i> 回答正确！'
    : `<i class="fas fa-times-circle"></i> 正确答案是「${escapeHtml(q.vocab.name)}」`;

  // 标记选项
  q.options.forEach((opt, i) => {
    const btn = document.getElementById('opt' + i);
    if (opt.id === q.vocab.id) {
      btn.classList.add('correct');
    } else if (i === optionIndex && !isCorrect) {
      btn.classList.add('wrong');
    }
    btn.disabled = true;
  });

  // 显示下一题按钮
  document.getElementById('challengeNextBtn').style.display = 'inline-flex';
}

/** 下一题 */
function nextChallenge() {
  if (challengeState.currentIndex < challengeState.questions.length - 1) {
    challengeState.currentIndex++;
    renderChallenge();
  } else {
    // 挑战结束
    finishChallenge();
  }
}

/** 完成挑战 */
function finishChallenge() {
  appState.challenges++;
  saveData();

  const container = document.getElementById('challengeGame');
  const isPerfect = challengeState.score === 100;

  container.innerHTML = `
    <div style="font-size: 64px; margin-bottom: 16px;">${isPerfect ? '🎉' : '👏'}</div>
    <div class="challenge-question">挑战完成！</div>
    <div style="font-size: 42px; font-family: var(--font-mono); font-weight: 700; color: var(--terracotta); margin: 12px 0;">${challengeState.score}</div>
    <div style="font-size: 14px; color: var(--text-secondary); margin-bottom: 20px;">
      ${isPerfect ? '完美通关！全部答对！' : '继续加油，手语学习需要持之以恒'}
    </div>
    <button class="challenge-btn" onclick="initChallenge()"><i class="fas fa-redo"></i> 再来一次</button>
  `;

  showToast(`挑战完成！得分 ${challengeState.score}`, 'success');
  renderHome();
}

/** 开始每日挑战 */
function startDailyChallenge() {
  switchTab('challenge');
}

/* ===================== 个人中心 ===================== */

/** 渲染个人中心 */
function renderProfile() {
  const learned = appState.learnedIds.length;
  const total = SIGN_VOCABULARY.length;
  const level = Math.floor(learned / 5) + 1;
  const levelNames = ['初级学员', '中级学员', '高级学员', '手语达人', '手语大师'];
  const levelName = levelNames[Math.min(level - 1, levelNames.length - 1)];

  document.getElementById('profileLevel').textContent = `${levelName} · LV.${level}`;

  // 成就徽章
  const grid = document.getElementById('achievementGrid');
  grid.innerHTML = ACHIEVEMENTS.map(a => {
    const unlocked = a.condition(appState);
    return `
      <div class="achievement-item ${unlocked ? '' : 'locked'}" title="${unlocked ? '已获得' : '未解锁'}">
        <div class="achievement-icon">${a.icon}</div>
        <div class="achievement-name">${a.name}</div>
      </div>
    `;
  }).join('');
}

/* ===================== 弹窗控制 ===================== */

/** 打开弹窗 */
function openModal(id) {
  document.getElementById(id).classList.add('visible');
  document.body.style.overflow = 'hidden';
}

/** 关闭弹窗 */
function closeModal(id) {
  document.getElementById(id).classList.remove('visible');
  document.body.style.overflow = '';

  // 清理学习状态
  if (id === 'learnModal') {
    learnState.isPlaying = false;
    if (learnState.playInterval) clearInterval(learnState.playInterval);
  }
}

// 点击遮罩关闭
['learnModal', 'sceneModal'].forEach(id => {
  document.getElementById(id)?.addEventListener('click', function(e) {
    if (e.target === this) closeModal(id);
  });
});

/* ===================== 工具函数 ===================== */

/**
 * 显示 Toast 提示
 * @param {string} message - 提示消息
 * @param {string} type - 提示类型
 */
function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle' };

  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${escapeHtml(message)}</span>`;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-20px)';
    setTimeout(() => toast.remove(), 300);
  }, 2200);
}

/**
 * HTML 转义防止 XSS
 * @param {string} str - 输入字符串
 * @returns {string} 安全字符串
 */
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/** 重置所有学习数据 */
function resetData() {
  if (!confirm('确定要重置所有学习数据吗？此操作不可恢复。')) return;

  appState = {
    learnedIds: [],
    favorites: [],
    streak: 0,
    challenges: 0,
    minutes: 0,
    scenes: 0,
    currentCategory: '全部',
    learnProgress: {},
    lastStudyDate: null,
    morningStudy: false,
    nightStudy: false
  };

  saveData();
  renderAll();
  showToast('数据已重置', 'info');
}

/* ===================== 启动 ===================== */
document.addEventListener('DOMContentLoaded', init);
</script>
