<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>约好了 — AI 日程与沟通助手</title>
<style>
  :root {
    --bg: #F7F5F2;
    --bg2: #FFFFFF;
    --ink: #2D2A26;
    --muted: #8C857E;
    --rule: #E3DDD6;
    --accent: #E07A5F;
    --accent2: #3D9B8C;
    --accent-light: rgba(224,122,95,0.08);
    --accent2-light: rgba(61,155,140,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Header */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--rule);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--ink);
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1.1rem;
  }
  .tag {
    font-size: 0.7rem;
    color: var(--accent);
    background: var(--accent-light);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-weight: 600;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 0.5rem;
    padding: 1rem 1.5rem;
    background: var(--bg2);
    border-bottom: 1px solid var(--rule);
    overflow-x: auto;
  }
  .tab {
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 0.4rem;
  }
  .tab:hover { background: var(--bg); color: var(--ink); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(224,122,95,0.3);
  }
  .tab.active.accent2 { background: var(--accent2); box-shadow: 0 2px 8px rgba(61,155,140,0.3); }
  .tab.active.accent3 { background: #C9A227; box-shadow: 0 2px 8px rgba(201,162,39,0.3); }

  /* Main Content */
  .main { max-width: 720px; margin: 0 auto; padding: 1.5rem; }

  /* Panel */
  .panel { display: none; }
  .panel.active { display: block; }

  /* Card */
  .card {
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1rem;
  }
  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 0.5rem;
  }

  /* Input Area */
  .input-area {
    width: 100%;
    min-height: 120px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1rem;
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    background: var(--bg2);
    color: var(--ink);
    transition: border-color 0.2s;
  }
  .input-area:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(224,122,95,0.1);
  }
  .input-area::placeholder { color: #B5AFA8; }

  /* Select */
  .select-row {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .select-row label {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    display: flex; align-items: center; gap: 0.3rem;
  }
  select {
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--rule);
    border-radius: 8px;
    font-size: 0.9rem;
    background: var(--bg2);
    color: var(--ink);
    cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  /* Button */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px rgba(224,122,95,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(224,122,95,0.4); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-secondary {
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--rule);
  }
  .btn-secondary:hover { background: var(--rule); }

  /* Result Card */
  .result-card {
    background: linear-gradient(135deg, var(--accent-light), var(--accent2-light));
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 1.5rem;
    margin-top: 1rem;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 0.75rem;
    display: flex; align-items: center; gap: 0.4rem;
  }

  /* Schedule Card */
  .schedule-item {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--rule);
  }
  .schedule-item:last-child { border-bottom: none; }
  .schedule-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .schedule-icon.time { background: rgba(224,122,95,0.12); }
  .schedule-icon.loc { background: rgba(61,155,140,0.12); }
  .schedule-icon.event { background: rgba(201,162,39,0.12); }
  .schedule-icon.prep { background: rgba(139,115,85,0.12); }
  .schedule-label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }
  .schedule-value {
    font-size: 0.95rem;
    color: var(--ink);
    font-weight: 500;
  }

  /* Reply Analysis */
  .risk-tag {
    display: inline-block;
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    margin: 0.2rem;
  }
  .risk-high { background: rgba(224,122,95,0.15); color: #C45A3F; }
  .risk-mid { background: rgba(201,162,39,0.15); color: #9A7D1A; }
  .risk-low { background: rgba(61,155,140,0.15); color: #2D7A6E; }

  .reply-version {
    background: var(--bg2);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1rem;
    margin: 0.75rem 0;
    position: relative;
  }
  .reply-version-label {
    position: absolute;
    top: -10px;
    left: 12px;
    background: var(--bg2);
    padding: 0 8px;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
  }
  .reply-text {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--ink);
  }
  .copy-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 0.3rem 0.6rem;
    font-size: 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--rule);
    background: var(--bg2);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Loading */
  .loading {
    display: none;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 0.75rem;
  }
  .loading.active { display: flex; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--rule);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tips */
  .tips {
    background: var(--bg2);
    border-left: 3px solid var(--accent2);
    padding: 0.75rem 1rem;
    border-radius: 0 8px 8px 0;
    margin-bottom: 1rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .tips strong { color: var(--accent2); }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
  }
  .empty-state-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.5;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: #fff;
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 600px) {
    .main { padding: 1rem; }
    .card { padding: 1rem; }
    .tabs { padding: 0.75rem 1rem; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-icon">&#9745;</div>
    <span>约好了</span>
  </div>
  <span class="tag">AI 日程与沟通助手</span>
</header>

<nav class="tabs">
  <button class="tab active" data-panel="schedule" onclick="switchTab(this)">
    &#128197; 聊天转日程
  </button>
  <button class="tab" data-panel="reply" onclick="switchTab(this)">
    &#9997; 得体回复检查
  </button>
  <button class="tab" data-panel="reschedule" onclick="switchTab(this)">
    &#128337; 改约/迟到沟通
  </button>
</nav>

<main class="main">

<!-- ===== 面板1：聊天转日程 ===== -->
<div class="panel active" id="panel-schedule">
  <div class="tips">
    <strong>提示：</strong>粘贴一段包含时间、地点、事件的聊天消息，AI 会自动提取关键信息并生成日程卡片。
  </div>

  <div class="card">
    <div class="card-title">&#128172; 粘贴聊天内容</div>
    <textarea class="input-area" id="scheduleInput" placeholder="例如：本周六下午2点在美术馆门口集合，记得带身份证。周日晚7点班级聚餐，地点是海底捞（中山路店），大家准时到！"></textarea>
    <button class="btn btn-primary" onclick="generateSchedule()">
      &#9889; 生成日程
    </button>
    <div class="loading" id="scheduleLoading">
      <div class="spinner"></div>
      <span>AI 正在分析聊天内容...</span>
    </div>
  </div>

  <div id="scheduleResult"></div>
</div>

<!-- ===== 面板2：得体回复检查 ===== -->
<div class="panel" id="panel-reply">
  <div class="tips">
    <strong>提示：</strong>输入你想发给老师、领导或朋友的回复，AI 会分析语气是否得体并给出优化建议。
  </div>

  <div class="card">
    <div class="card-title">&#128172; 输入原始回复</div>
    <div class="select-row">
      <label>沟通对象：</label>
      <select id="replyTarget">
        <option value="teacher">老师</option>
        <option value="boss">领导</option>
        <option value="friend">朋友</option>
        <option value="colleague">同事</option>
      </select>
      <label>语气风格：</label>
      <select id="replyStyle">
        <option value="formal">正式</option>
        <option value="gentle">温和</option>
        <option value="concise">简洁</option>
        <option value="sincere">诚恳</option>
      </select>
    </div>
    <textarea class="input-area" id="replyInput" placeholder="例如：老师，作业我晚一点交，昨天没写完。"></textarea>
    <button class="btn btn-primary" onclick="checkReply()">
      &#9889; 检查回复
    </button>
    <div class="loading" id="replyLoading">
      <div class="spinner"></div>
      <span>AI 正在分析语气...</span>
    </div>
  </div>

  <div id="replyResult"></div>
</div>

<!-- ===== 面板3：临时改约/迟到沟通 ===== -->
<div class="panel" id="panel-reschedule">
  <div class="tips">
    <strong>提示：</strong>描述你遇到的改约或迟到场景，AI 会分析对方感受并生成真诚、有补偿方案的回复。
  </div>

  <div class="card">
    <div class="card-title">&#128337; 描述场景</div>
    <div class="select-row">
      <label>场景类型：</label>
      <select id="rescheduleType">
        <option value="late">迟到</option>
        <option value="change">改约</option>
        <option value="cancel">取消</option>
        <option value="leave">请假</option>
      </select>
      <label>对方关系：</label>
      <select id="rescheduleRelation">
        <option value="friend">朋友</option>
        <option value="teacher">老师</option>
        <option value="boss">领导</option>
        <option value="colleague">同事</option>
      </select>
    </div>
    <textarea class="input-area" id="rescheduleInput" placeholder="例如：我今天可能要加班，朋友已经等我很久了，不知道怎么开口说会晚到。"></textarea>
    <button class="btn btn-primary" onclick="generateRescheduleReply()">
      &#9889; 生成回复
    </button>
    <div class="loading" id="rescheduleLoading">
      <div class="spinner"></div>
      <span>AI 正在分析场景...</span>
    </div>
  </div>

  <div id="rescheduleResult"></div>
</div>

</main>

<div class="toast" id="toast"></div>

<script>
// ===== Tab Switching =====
function switchTab(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
}

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== Copy =====
function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '已复制';
    showToast('已复制到剪贴板');
    setTimeout(() => btn.textContent = '复制', 1500);
  });
}

// ===== Schedule Generation =====
function generateSchedule() {
  const input = document.getElementById('scheduleInput').value.trim();
  if (!input) { showToast('请先粘贴聊天内容'); return; }

  const loading = document.getElementById('scheduleLoading');
  const result = document.getElementById('scheduleResult');
  loading.classList.add('active');
  result.innerHTML = '';

  setTimeout(() => {
    loading.classList.remove('active');
    const schedules = parseSchedule(input);
    if (schedules.length === 0) {
      result.innerHTML = '<div class="card"><div class="empty-state"><div class="empty-state-icon">&#128269;</div><p>未识别到明确的时间/地点信息，请尝试输入更具体的聊天内容。</p></div></div>';
      return;
    }
    schedules.forEach((s, i) => {
      result.innerHTML += renderScheduleCard(s, i + 1);
    });
  }, 1200 + Math.random() * 800);
}

function parseSchedule(text) {
  const schedules = [];
  // Split by common separators
  const segments = text.split(/[。！\n]+/).filter(s => s.trim().length > 5);

  segments.forEach(seg => {
    const time = extractTime(seg);
    const loc = extractLocation(seg);
    const event = extractEvent(seg);
    const prep = extractPrep(seg);

    if (time || loc || event) {
      schedules.push({ time: time || '待定', location: loc || '待定', event: event || '待定事项', prep: prep || '' });
    }
  });

  // If no segments matched, try whole text
  if (schedules.length === 0) {
    const time = extractTime(text);
    const loc = extractLocation(text);
    const event = extractEvent(text);
    const prep = extractPrep(text);
    if (time || loc || event) {
      schedules.push({ time: time || '待定', location: loc || '待定', event: event || '待定事项', prep: prep || '' });
    }
  }
  return schedules;
}

function extractTime(text) {
  const patterns = [
    /(本周[六日一二三四五]|今天|明天|后天|下周五|下周[六日一二三四五]).*?(上午|下午|晚上|早上)?\s*(\d{1,2})\s*[点:：]\s*(\d{1,2})?/,
    /(\d{1,2})\s*月\s*(\d{1,2})\s*日.*?([上下]午|晚上)?\s*(\d{1,2})\s*[点:：]/,
    /(今天|明天|后天)\s*([上下]午|晚上)?\s*(\d{1,2})\s*[点:：]/,
    /(\d{1,2}):(\d{2})/,
    /(周[六日一二三四五])/,
  ];
  for (let p of patterns) {
    const m = text.match(p);
    if (m) return m[0];
  }
  return '';
}

function extractLocation(text) {
  const patterns = [
    /在([\u4e00-\u9fa5]{2,8}(?:门口|店|馆|楼|室|中心|广场|大厦))/,
    /地点[是为：:]\s*([\u4e00-\u9fa5]{2,10})/,
    /([\u4e00-\u9fa5]{2,6}(?:餐厅|饭店|咖啡馆|会议室|教室|操场))/,
    /([\u4e00-\u9fa5]{2,8}路\d+号?)/,
  ];
  for (let p of patterns) {
    const m = text.match(p);
    if (m) return m[1] || m[0];
  }
  return '';
}

function extractEvent(text) {
  const patterns = [
    /([\u4e00-\u9fa5]{2,6}(?:集合|聚餐|会议|活动|上课|面试|约会|见面))/,
    /(交|提交|完成|准备|参加)([\u4e00-\u9fa5]{2,8})/,
  ];
  for (let p of patterns) {
    const m = text.match(p);
    if (m) return m[0];
  }
  // Fallback: first 6 chars as event
  return text.substring(0, 8).replace(/[，,、]/g, '');
}

function extractPrep(text) {
  const keywords = ['身份证', '学生证', '笔记本', '电脑', '材料', '文件', '礼物', '口罩', '雨伞', '充电宝', '准考证', '简历'];
  const found = keywords.filter(k => text.includes(k));
  return found.length > 0 ? '记得带：' + found.join('、') : '';
}

function renderScheduleCard(s, idx) {
  const remindTime = s.time.includes('下午') || s.time.includes('晚上') ? '提前30分钟提醒' : '提前1小时提醒';
  return `
    <div class="result-card">
      <div class="result-title">&#128197; 日程卡片 #${idx}</div>
      <div class="schedule-item">
        <div class="schedule-icon event">&#128227;</div>
        <div>
          <div class="schedule-label">事件</div>
          <div class="schedule-value">${s.event}</div>
        </div>
      </div>
      <div class="schedule-item">
        <div class="schedule-icon time">&#128336;</div>
        <div>
          <div class="schedule-label">时间</div>
          <div class="schedule-value">${s.time}</div>
        </div>
      </div>
      <div class="schedule-item">
        <div class="schedule-icon loc">&#128205;</div>
        <div>
          <div class="schedule-label">地点</div>
          <div class="schedule-value">${s.location}</div>
        </div>
      </div>
      ${s.prep ? `
      <div class="schedule-item">
        <div class="schedule-icon prep">&#128230;</div>
        <div>
          <div class="schedule-label">准备事项</div>
          <div class="schedule-value">${s.prep}</div>
        </div>
      </div>` : ''}
      <div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px dashed var(--rule);font-size:0.85rem;color:var(--muted);">
        &#128161; 提醒建议：${remindTime}，出发前检查交通状况
      </div>
    </div>
  `;
}

// ===== Reply Check =====
function checkReply() {
  const input = document.getElementById('replyInput').value.trim();
  if (!input) { showToast('请先输入回复内容'); return; }

  const target = document.getElementById('replyTarget').value;
  const style = document.getElementById('replyStyle').value;
  const loading = document.getElementById('replyLoading');
  const result = document.getElementById('replyResult');
  loading.classList.add('active');
  result.innerHTML = '';

  setTimeout(() => {
    loading.classList.remove('active');
    result.innerHTML = renderReplyAnalysis(input, target, style);
  }, 1200 + Math.random() * 800);
}

function renderReplyAnalysis(original, target, style) {
  const risks = analyzeRisks(original, target);
  const optimized = generateOptimizedReply(original, target, style);

  let riskHtml = '';
  if (risks.length > 0) {
    riskHtml = `<div style="margin-bottom:1rem;">
      <div class="schedule-label" style="margin-bottom:0.5rem;">&#9888; 潜在风险</div>
      ${risks.map(r => `<span class="risk-tag ${r.level}">${r.text}</span>`).join('')}
    </div>`;
  } else {
    riskHtml = `<div style="margin-bottom:1rem;color:var(--accent2);font-size:0.9rem;">

function analyzeRisks(text, target) {
  const risks = [];
  const riskWords = {
    teacher: ['没写完', '忘了', '不知道', '随便', '差不多', '就那样'],
    boss: ['没空', '不想', '随便', '再说吧', '不清楚', '不是我的'],
    friend: ['随便', '都行', '无所谓', '你定吧'],
    colleague: ['不关我事', '你找别人', '我没时间']
  };
  const words = riskWords[target] || riskWords.friend;
  words.forEach(w => {
    if (text.includes(w)) {
      risks.push({ text: `包含"${w}"，可能显得${target === 'teacher' ? '态度不够认真' : target === 'boss' ? '不够专业' : '敷衍'}`, level: 'risk-high' });
    }
  });

  if (text.length < 10) risks.push({ text: '回复过短，可能显得不够重视', level: 'risk-mid' });
  if (!text.includes('谢谢') && !text.includes('感谢') && (target === 'teacher' || target === 'boss')) {
    risks.push({ text: '缺少感谢用语', level: 'risk-low' });
  }
  if (text.includes('晚一点') || text.includes('稍后') || text.includes('明天')) {
    risks.push({ text: '时间表述模糊，建议给出具体时间', level: 'risk-mid' });
  }
  return risks;
}

      gentle: '老师您好，不好意思，因为[原因]，这次作业可能要晚一点交。我会尽量在[时间]前完成，麻烦老师了，谢谢！',
      concise: '老师好，因[原因]，作业预计[时间]提交，抱歉。',
      sincere: '老师您好，真的很抱歉，因为[原因]，这次没能按时完成。我会加班加点在[时间]前交上来，希望老师能谅解，谢谢老师！'
    },
    boss: {
      formal: '领导您好，关于[事项]，因[原因]，预计需要延至[时间]完成。我会全力推进，确保质量，如有需要随时汇报进展。',
      gentle: '领导好，不好意思，[事项]因为[原因]可能要推迟到[时间]。我会抓紧处理，有进展及时向您汇报。',
      concise: '领导，[事项]因[原因]预计[时间]完成，正在推进中。',
      sincere: '领导您好，非常抱歉，[事项]由于[原因]未能按期完成。我会全力赶工，争取[时间]前交付，给您添麻烦了。'
    },
    friend: {
      formal: '不好意思，因为[原因]，我可能要[时间]才能到/完成。真的很抱歉让你等了/麻烦了，下次我请你[补偿方式]！',
      gentle: '抱歉啊，[原因]，我得[时间]才能到。你别生气，等我到了请你喝奶茶！',
      concise: '抱歉，[原因]，[时间]到。',
      sincere: '真的很对不起，[原因]导致我要[时间]才能到。我知道让你等了很久，特别不好意思，今天这顿我请！'
    },
    colleague: {
      formal: '不好意思，因[原因]，[事项]预计[时间]完成。如有影响请随时沟通，我会尽快处理。',
      gentle: '抱歉，[原因]，[事项]可能要[时间]才能好。麻烦你再等等，我马上弄完。',
      concise: '抱歉，[原因]，[事项][时间]完成。',
      sincere: '不好意思，因为[原因]，[事项]要推迟到[时间]。给你添麻烦了，完成后我第一时间发你。'
    }
  };

  // Simple keyword-based replacement
  let tpl = templates[target]?.[style] || templates.friend.gentle;

  // Extract reason from original if possible
  let reason = '临时有事';
  if (original.includes('加班')) reason = '临时加班';
  else if (original.includes('生病')) reason = '身体不适';
  else if (original.includes('堵车')) reason = '路上堵车';
  else if (original.includes('没')) reason = original.match(/没[^，。]+/)?.[0] || '临时有事';

  let time = '稍后';
  if (original.includes('明天')) time = '明天';
  else if (original.includes('今晚')) time = '今晚';
  else if (original.includes('下午')) time = '今天下午';
  else if (original.includes('晚上')) time = '今晚';

  tpl = tpl.replace(/\[原因\]/g, reason).replace(/\[时间\]/g, time).replace(/\[事项\]/g, '这件事').replace(/\[补偿方式\]/g, '吃饭');

  return tpl;

function extractReason(input) {
  const reasons = ['临时加班', '身体不适', '路上堵车', '家里有急事', '突发状况', '工作太忙'];
  for (let r of reasons) {
    if (input.includes(r.substring(0, 2))) return r;
  }
  if (input.includes('加班')) return '临时加班';
  if (input.includes('生病') || input.includes('不舒服')) return '身体不适';
  if (input.includes('堵')) return '路上堵车';
  if (input.includes('急事')) return '家里有急事';
  return '临时有事';
}

function extractTimeFromInput(input) {
  const m = input.match(/(\d{1,2})\s*[点:：]\s*(\d{1,2})?/);
  if (m) return m[0];
  if (input.includes('半小时')) return '半小时';
  if (input.includes('一小时')) return '一小时';
  if (input.includes('晚点')) return '晚一点';
  return '';
}
