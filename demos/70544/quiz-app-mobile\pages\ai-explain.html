<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 解析</title>
    <style id="theme-vars">
/* QuizFlow 刷题 App - 品牌设计样式 */
/* 新丑风（Neobrutalism）：极客靛蓝 + 活力耀光橙 */

:root {
  --color-primary: #535BF2;
  --color-primary-light: #747BFF;
  --color-primary-dark: #3F43C6;
  --color-primary-50: rgba(83, 91, 242, 0.06);
  --color-primary-100: rgba(83, 91, 242, 0.12);
  --color-primary-200: rgba(83, 91, 242, 0.22);

  --color-bg: #F8FAFC;
  --color-bg-secondary: #F1F5F9;
  --color-bg-tertiary: #E2E8F0;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F8FAFC;
  --color-border: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #535BF2;

  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  --color-focus: #FF6F3D;
  --color-focus-light: rgba(255, 111, 61, 0.08);
  --color-focus-dark: #E24F1D;

  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
}

html.dark {
  --color-primary: #747BFF;
  --color-primary-light: #9CA1FF;
  --color-primary-dark: #535BF2;
  --color-primary-50: rgba(116, 123, 255, 0.12);
  --color-primary-100: rgba(116, 123, 255, 0.2);
  --color-primary-200: rgba(116, 123, 255, 0.35);

  --color-bg: #0B0F19;
  --color-bg-secondary: #111827;
  --color-bg-tertiary: #1F2937;
  --color-surface: #111827;
  --color-surface-hover: #1F2937;
  --color-border: #1F2937;
  --color-border-light: #162031;

  --color-text-primary: #F8FAFC;
  --color-text-secondary: #94A3B8;
  --color-text-tertiary: #64748B;
  --color-text-inverse: #0B0F19;
  --color-text-link: #747BFF;

  --state-success: #34D399;
  --state-warning: #FBBF24;
  --state-error: #F87171;
  --state-info: #60A5FA;

  --color-focus: #FF885E;
  --color-focus-light: rgba(255, 136, 94, 0.12);
  --color-focus-dark: #FF6F3D;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #F8FAFC;
      }
      .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #F8FAFC;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-[var(--color-bg)] text-[var(--color-text-primary)]">
    <main class="relative min-h-screen pb-36">

        <!-- 顶部导航栏 -->
        <header class="sticky top-0 z-30 border-b-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)]">
            <div class="flex items-center justify-between px-4 h-16">
                <button class="back-btn inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="返回">
                    <i data-lucide="chevron-left" class="h-5 w-5 stroke-[2.5]"></i>
                </button>
                <h1 class="text-sm font-black uppercase tracking-wider text-[var(--color-text-primary)]">AI 解析</h1>
                <div class="flex items-center gap-2">
                    <button id="theme-toggle" class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="切换主题">
                        <i data-lucide="sun" class="h-5 w-5 dark:hidden stroke-[2.5]"></i>
                        <i data-lucide="moon" class="h-5 w-5 hidden dark:block stroke-[2.5]"></i>
                    </button>
                    <button class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="用户">
                        <i data-lucide="user" class="h-5 w-5 stroke-[2.5]"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- 题目摘要 -->
        <section class="px-4 pt-4 pb-3">
            <div class="border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow p-3">
                <div class="flex items-center gap-2 mb-2">
                    <span class="inline-flex items-center justify-center w-7 h-7 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white text-xs font-black">3</span>
                    <span class="text-xs font-black uppercase tracking-wider text-[var(--color-text-secondary)]">当前题目</span>
                </div>
                <p class="text-sm font-bold leading-snug text-[var(--color-text-primary)]">在 JavaScript 中，以下关于 Promise 的说法，哪一项是正确的？</p>
            </div>
        </section>

        <!-- 快捷问题 -->
        <section class="px-4 pb-3">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button class="quick-ask shrink-0 px-3 py-1.5 text-[10px] font-black uppercase tracking-wider border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)]" data-question="为什么 A 是正确的？">为什么 A 正确</button>
                <button class="quick-ask shrink-0 px-3 py-1.5 text-[10px] font-black uppercase tracking-wider border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)]" data-question="其他选项为什么错？">其他选项错在哪</button>
                <button class="quick-ask shrink-0 px-3 py-1.5 text-[10px] font-black uppercase tracking-wider border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)]" data-question="给出一个实际代码示例">代码示例</button>
                <button class="quick-ask shrink-0 px-3 py-1.5 text-[10px] font-black uppercase tracking-wider border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)]" data-question="相关知识点拓展">知识拓展</button>
            </div>
        </section>

        <!-- 聊天区域 -->
        <section class="px-4 pb-4">
            <div id="chat-container" class="space-y-4">
                <div class="flex gap-3">
                    <div class="w-9 h-9 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] flex items-center justify-center text-[#0F172A] dark:text-[#0B0F19] shrink-0">
                        <i data-lucide="sparkles" class="w-5 h-5 stroke-[2.5]"></i>
                    </div>
                    <div class="flex-1 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow p-3">
                        <p class="text-xs font-black uppercase tracking-wider text-[var(--color-text-secondary)] mb-2">AI 解析</p>
                        <p class="text-sm font-bold leading-relaxed">正确答案是 <strong class="text-[var(--color-primary)]">A</strong>。Promise 一旦创建并开始执行，其内部状态就不可逆转，也无法从外部取消。</p>
                        <div class="mt-3 p-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)]">
                            <p class="text-[10px] font-mono font-bold uppercase tracking-wider text-[var(--color-text-secondary)] mb-1">关键点</p>
                            <ul class="text-xs font-bold space-y-1 list-disc list-inside">
                                <li>Promise 只有三种状态：pending、fulfilled、rejected</li>
                                <li>状态变化是单向且不可撤销的</li>
                                <li>没有原生 cancel 方法</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 底部输入区 -->
    <div class="fixed bottom-16 left-0 right-0 z-30 border-t-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)] p-3">
        <div class="flex gap-2">
            <input id="chat-input" type="text" placeholder="输入你的追问…" class="flex-1 px-3 py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-sm font-bold text-[var(--color-text-primary)] placeholder:text-[var(--color-text-tertiary)] outline-none" />
            <button id="send-btn" class="px-4 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="发送">
                <i data-lucide="send" class="w-5 h-5 stroke-[2.5]"></i>
            </button>
        </div>
    </div>

    <!-- 底部 Tab 导航 -->
    <nav class="fixed bottom-0 left-0 right-0 h-16 border-t-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)] flex items-center justify-around z-30 pb-[env(safe-area-inset-bottom,0px)]">
        <a href="home.html" data-tab="home" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="home" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">首页</span>
        </a>
        <a href="question-bank.html" data-tab="bank" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="book-open" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">题库</span>
        </a>
        <a href="quiz.html" data-tab="quiz" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="pen-line" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">刷题</span>
        </a>
        <a href="weekly-report.html" data-tab="report" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="bar-chart-3" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">统计</span>
        </a>
        <a href="#" data-tab="profile" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" onclick="showToast('功能开发中'); return false;">
            <i data-lucide="user" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">我的</span>
        </a>
    </nav>

    <script>
    (function() {
        /* 轻量 toast */
        window.showToast = function(message) {
            const existing = document.getElementById('quizflow-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'quizflow-toast';
            toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#0F172A] dark:bg-[#F8FAFC] text-white dark:text-[#0B0F19] text-xs font-black uppercase tracking-wider shadow-[4px_4px_0_0_#0F172A] dark:shadow-[4px_4px_0_0_#F8FAFC]';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        /* 底部 Tab 高亮 */
        function setActiveTab() {
            const currentPage = location.pathname.split('/').pop() || 'home.html';
            document.querySelectorAll('nav a[data-tab]').forEach(function(tab) {
                const href = tab.getAttribute('href') || '';
                const tabPage = href.split('/').pop();
                if (tabPage && tabPage === currentPage) {
                    tab.classList.remove('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                    tab.classList.add('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                } else {
                    tab.classList.remove('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                    tab.classList.add('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                }
            });
        }
        document.addEventListener('DOMContentLoaded', setActiveTab);

        const savedTheme = localStorage.getItem('quizflow-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(savedTheme);
        }

        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                const isDark = document.documentElement.classList.contains('dark');
                const next = isDark ? 'light' : 'dark';
                document.documentElement.classList.remove('light', 'dark');
                document.documentElement.classList.add(next);
                localStorage.setItem('quizflow-theme', next);
            });
        }

        // 接收父页面通过 postMessage 下发的主题切换指令
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'quizflow-theme') {
                const theme = e.data.theme;
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.classList.remove('light', 'dark');
                    document.documentElement.classList.add(theme);
                    localStorage.setItem('quizflow-theme', theme);
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
        });

        document.querySelectorAll('.back-btn').forEach(btn => {
            btn.addEventListener('click', () => { location.href = 'quiz.html'; });
        });

        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function createUserBubble(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex gap-3 flex-row-reverse';
            wrapper.innerHTML = `
                <div class="w-9 h-9 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] flex items-center justify-center text-white shrink-0">
                    <i data-lucide="user" class="w-5 h-5 stroke-[2.5]"></i>
                </div>
                <div class="flex-1 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] p-3">
                    <p class="text-sm font-bold text-[var(--color-text-primary)]">${text}</p>
                </div>
            `;
            return wrapper;
        }

        function createAiBubble(text) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex gap-3';
            wrapper.innerHTML = `
                <div class="w-9 h-9 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] flex items-center justify-center text-[#0F172A] dark:text-[#0B0F19] shrink-0">
                    <i data-lucide="sparkles" class="w-5 h-5 stroke-[2.5]"></i>
                </div>
                <div class="flex-1 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow p-3">
                    <p class="text-xs font-black uppercase tracking-wider text-[var(--color-text-secondary)] mb-1">AI 解析</p>
                    <p class="text-sm font-bold leading-relaxed">${text}</p>
                </div>
            `;
            return wrapper;
        }

        function sendMessage(text) {
            if (!text.trim()) return;
            chatContainer.appendChild(createUserBubble(text));
            chatInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                const replies = [
                    '这是一个很好的问题。核心在于 Promise 的设计哲学：状态一旦确定就不可变，这样可以避免竞态条件。',
                    '从规范角度看，Promise/A+ 明确要求状态只能由 pending 转为 fulfilled 或 rejected，且不可逆转。',
                    '如果你需要取消异步操作，可以考虑使用 AbortController 或封装可取消的 Promise 模式。'
                ];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                chatContainer.appendChild(createAiBubble(reply));
                chatContainer.scrollTop = chatContainer.scrollHeight;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }, 600);
        }

        sendBtn.addEventListener('click', () => sendMessage(chatInput.value));
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage(chatInput.value);
        });

        document.querySelectorAll('.quick-ask').forEach(btn => {
            btn.addEventListener('click', () => {
                sendMessage(btn.getAttribute('data-question'));
            });
        });

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    })();
    </script>
</body>
</html>
