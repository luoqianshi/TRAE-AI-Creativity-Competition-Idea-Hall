<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟专注</title>
    <style id="theme-vars">
/* QuizFlow 刷题 App - 品牌设计样式 */
/* 新丑风（Neobrutalism）：极客靛蓝 + 活力耀光橙 */

:root {
  --color-primary: #535BF2;
  --color-primary-light: #747BFF;
  --color-primary-dark: #3F43C6;
  --color-primary-50: rgba(83, 91, 242, 0.06);
  --color-primary-100: rgba(83, 91, 242, 0.12);
  --color-primary-200: rgba(83, 91, 242, 0.22);

  --color-bg: #F8FAFC;
  --color-bg-secondary: #F1F5F9;
  --color-bg-tertiary: #E2E8F0;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F8FAFC;
  --color-border: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #535BF2;

  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  --color-focus: #FF6F3D;
  --color-focus-light: rgba(255, 111, 61, 0.08);
  --color-focus-dark: #E24F1D;

  --heatmap-0: #F1F5F9;
  --heatmap-1: #C7D2FE;
  --heatmap-2: #818CF8;
  --heatmap-3: #4F46E5;
  --heatmap-4: #3730A3;

  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
}

html.dark {
  --color-primary: #747BFF;
  --color-primary-light: #9CA1FF;
  --color-primary-dark: #535BF2;
  --color-primary-50: rgba(116, 123, 255, 0.12);
  --color-primary-100: rgba(116, 123, 255, 0.2);
  --color-primary-200: rgba(116, 123, 255, 0.35);

  --color-bg: #0B0F19;
  --color-bg-secondary: #111827;
  --color-bg-tertiary: #1F2937;
  --color-surface: #111827;
  --color-surface-hover: #1F2937;
  --color-border: #1F2937;
  --color-border-light: #162031;

  --color-text-primary: #F8FAFC;
  --color-text-secondary: #94A3B8;
  --color-text-tertiary: #64748B;
  --color-text-inverse: #0B0F19;
  --color-text-link: #747BFF;

  --state-success: #34D399;
  --state-warning: #FBBF24;
  --state-error: #F87171;
  --state-info: #60A5FA;

  --color-focus: #FF885E;
  --color-focus-light: rgba(255, 136, 94, 0.12);
  --color-focus-dark: #FF6F3D;

  --heatmap-0: #111827;
  --heatmap-1: #1E293B;
  --heatmap-2: #312E81;
  --heatmap-3: #4338CA;
  --heatmap-4: #4F46E5;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #F8FAFC;
      }
      .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #F8FAFC;
      }

      #progress-ring {
        transition: stroke-dashoffset 1s linear;
      }
      body.rest-mode {
        background-color: #ECFDF5;
      }
      html.dark body.rest-mode {
        background-color: #064E3B;
      }
      body.rest-mode #progress-ring {
        stroke: var(--color-focus);
      }
      body.rest-mode #status-label {
        background: var(--color-focus);
      }
      body.rest-mode #status-label span:first-child {
        background: #0F172A;
      }
      html.dark body.rest-mode #status-label span:first-child {
        background: #F8FAFC;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-[var(--color-bg)] text-[var(--color-text-primary)]">
    <main class="relative min-h-screen pb-24">

        <!-- 顶部导航栏 -->
        <header class="sticky top-0 z-30 border-b-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)]">
            <div class="flex items-center justify-between px-4 h-16">
                <button class="back-btn inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="返回">
                    <i data-lucide="chevron-left" class="h-5 w-5 stroke-[2.5]"></i>
                </button>
                <h1 class="text-sm font-black uppercase tracking-wider text-[var(--color-text-primary)]">番茄钟专注</h1>
                <div class="flex items-center gap-2">
                    <button id="theme-toggle" class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="切换主题">
                        <i data-lucide="sun" class="h-5 w-5 dark:hidden stroke-[2.5]"></i>
                        <i data-lucide="moon" class="h-5 w-5 hidden dark:block stroke-[2.5]"></i>
                    </button>
                    <button class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="用户">
                        <i data-lucide="user" class="h-5 w-5 stroke-[2.5]"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="flex flex-col items-center px-4 pt-6 pb-8">

            <!-- 当前状态标签 -->
            <div id="status-label" class="mb-6 inline-flex items-center gap-2 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0B0F19] px-3 py-1 font-black text-xs uppercase tracking-wider brutalist-shadow-sm rotate-[-1deg]">
                <span class="h-2 w-2 bg-[#0F172A] dark:bg-[#0B0F19]"></span>
                <span id="status-text">专注中</span>
            </div>

            <!-- 中心大号计时器 + 圆形进度条 -->
            <div class="relative flex items-center justify-center mb-7 w-[260px] h-[260px] border-4 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow">
                <svg class="absolute" width="220" height="220" viewBox="0 0 220 220" style="transform: rotate(-90deg);">
                    <circle cx="110" cy="110" r="98" fill="none" stroke-width="10" stroke="var(--color-bg-tertiary)" />
                    <circle id="progress-ring" cx="110" cy="110" r="98" fill="none" stroke-width="10" stroke-linecap="butt" stroke="#535BF2" stroke-dasharray="615.75" stroke-dashoffset="0" />
                </svg>

                <div class="relative flex flex-col items-center justify-center">
                    <span id="timer-display" class="font-mono text-5xl font-black tracking-tighter text-[var(--color-text-primary)]">25:00</span>
                    <span id="timer-mode-label" class="mt-1 text-xs font-black uppercase tracking-wider text-[var(--color-text-secondary)]">专注模式</span>
                </div>
            </div>

            <!-- 模式切换 -->
            <div class="w-full max-w-xs mb-6 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] p-1 brutalist-shadow flex gap-1">
                <button id="mode-focus" class="mode-btn flex-1 py-2 text-center text-[10px] font-black uppercase tracking-wider border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0B0F19] shadow-[2px_2px_0px_0px_#0F172A] dark:shadow-[2px_2px_0px_0px_#F8FAFC] leading-tight">
                    25分钟专注
                </button>
                <button id="mode-short" class="mode-btn flex-1 py-2 text-center text-[10px] font-black uppercase tracking-wider border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] leading-tight">
                    5分钟短休
                </button>
                <button id="mode-long" class="mode-btn flex-1 py-2 text-center text-[10px] font-black uppercase tracking-wider border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] leading-tight">
                    15分钟长休
                </button>
            </div>

            <!-- 当前任务 -->
            <div class="w-full max-w-xs mb-8">
                <label class="block mb-1.5 text-xs font-black uppercase tracking-wider text-[var(--color-text-secondary)]">当前任务</label>
                <div class="flex border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow">
                    <input id="task-input" type="text" placeholder="输入或选择专注任务…" class="flex-1 px-3 py-2.5 bg-transparent outline-none text-sm font-bold text-[var(--color-text-primary)] placeholder:text-[var(--color-text-tertiary)]" />
                    <button id="task-select-btn" class="px-3 border-l-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white flex items-center justify-center active:translate-x-[2px] active:translate-y-[2px] transition-all cursor-pointer" aria-label="选择任务">
                        <i data-lucide="chevron-down" class="w-4 h-4 stroke-[2.5]"></i>
                    </button>
                </div>
                <div id="task-dropdown" class="hidden mt-2 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm">
                    <button class="task-option w-full text-left px-3 py-2 text-xs font-bold text-[var(--color-text-primary)] hover:bg-[var(--color-bg-secondary)] border-b-2 border-[#0F172A] dark:border-[#F8FAFC] last:border-b-0 cursor-pointer">JavaScript 基础刷题</button>
                    <button class="task-option w-full text-left px-3 py-2 text-xs font-bold text-[var(--color-text-primary)] hover:bg-[var(--color-bg-secondary)] border-b-2 border-[#0F172A] dark:border-[#F8FAFC] last:border-b-0 cursor-pointer">React 组件复习</button>
                    <button class="task-option w-full text-left px-3 py-2 text-xs font-bold text-[var(--color-text-primary)] hover:bg-[var(--color-bg-secondary)] border-b-2 border-[#0F172A] dark:border-[#F8FAFC] last:border-b-0 cursor-pointer">算法与数据结构</button>
                    <button class="task-option w-full text-left px-3 py-2 text-xs font-bold text-[var(--color-text-primary)] hover:bg-[var(--color-bg-secondary)] cursor-pointer">英语单词背诵</button>
                </div>
            </div>

            <!-- 控制按钮 -->
            <div class="flex items-center gap-4 mb-8">
                <button id="btn-reset" class="w-12 h-12 flex items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="重置">
                    <i data-lucide="rotate-ccw" class="w-5 h-5 stroke-[2.5]"></i>
                </button>

                <button id="btn-start" class="h-14 px-7 flex items-center gap-2 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0B0F19] font-black text-sm uppercase tracking-wider brutalist-shadow active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="开始专注">
                    <i data-lucide="play" class="w-5 h-5 stroke-[2.5]"></i>
                    <span id="btn-start-text">开始专注</span>
                </button>

                <button id="btn-skip" class="w-12 h-12 flex items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="跳过">
                    <i data-lucide="skip-forward" class="w-5 h-5 stroke-[2.5]"></i>
                </button>
            </div>

            <!-- 今日专注统计 -->
            <div class="w-full max-w-xs border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow p-4">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-black uppercase tracking-wider text-[var(--color-text-secondary)]">今日番茄</span>
                    <span id="stats-count" class="font-mono text-xs font-black text-[var(--color-primary)]">4 / 8</span>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] p-2 text-center">
                        <div class="text-[10px] font-black uppercase tracking-wider text-[var(--color-text-secondary)]">专注次数</div>
                        <div id="stat-sessions" class="font-mono text-xl font-black text-[var(--color-text-primary)]">4</div>
                    </div>
                    <div class="border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] p-2 text-center">
                        <div class="text-[10px] font-black uppercase tracking-wider text-[var(--color-text-secondary)]">总时长</div>
                        <div id="stat-minutes" class="font-mono text-xl font-black text-[var(--color-text-primary)]">100 min</div>
                    </div>
                </div>

                <div id="dots-container" class="flex items-center justify-center gap-2 flex-wrap">
                    <!-- JS 渲染 -->
                </div>
            </div>

        </div>

    </main>

    <!-- 底部 Tab 导航 -->
    <nav class="fixed bottom-0 left-0 right-0 h-16 border-t-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)] flex items-center justify-around z-30 pb-[env(safe-area-inset-bottom,0px)]">
        <a href="home.html" data-tab="home" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="home" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">首页</span>
        </a>
        <a href="question-bank.html" data-tab="bank" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="book-open" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">题库</span>
        </a>
        <a href="quiz.html" data-tab="quiz" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="pen-line" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">刷题</span>
        </a>
        <a href="weekly-report.html" data-tab="report" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="bar-chart-3" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">统计</span>
        </a>
        <a href="#" data-tab="profile" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" onclick="showToast('功能开发中'); return false;">
            <i data-lucide="user" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">我的</span>
        </a>
    </nav>

    <script>
    (function() {
        /* 轻量 toast */
        window.showToast = function(message) {
            const existing = document.getElementById('quizflow-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'quizflow-toast';
            toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#0F172A] dark:bg-[#F8FAFC] text-white dark:text-[#0B0F19] text-xs font-black uppercase tracking-wider shadow-[4px_4px_0_0_#0F172A] dark:shadow-[4px_4px_0_0_#F8FAFC]';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        /* 底部 Tab 高亮 */
        function setActiveTab() {
            const currentPage = location.pathname.split('/').pop() || 'home.html';
            document.querySelectorAll('nav a[data-tab]').forEach(function(tab) {
                const href = tab.getAttribute('href') || '';
                const tabPage = href.split('/').pop();
                if (tabPage && tabPage === currentPage) {
                    tab.classList.remove('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                    tab.classList.add('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                } else {
                    tab.classList.remove('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                    tab.classList.add('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                }
            });
        }
        document.addEventListener('DOMContentLoaded', setActiveTab);

        const savedTheme = localStorage.getItem('quizflow-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(savedTheme);
        }

        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                const isDark = document.documentElement.classList.contains('dark');
                const next = isDark ? 'light' : 'dark';
                document.documentElement.classList.remove('light', 'dark');
                document.documentElement.classList.add(next);
                localStorage.setItem('quizflow-theme', next);
            });
        }

        // 接收父页面通过 postMessage 下发的主题切换指令
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'quizflow-theme') {
                const theme = e.data.theme;
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.classList.remove('light', 'dark');
                    document.documentElement.classList.add(theme);
                    localStorage.setItem('quizflow-theme', theme);
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
        });

        document.querySelectorAll('.back-btn').forEach(btn => {
            btn.addEventListener('click', () => { location.href = 'home.html'; });
        });

        /* 番茄钟核心配置 */
        var FOCUS = 25 * 60;
        var SHORT_BREAK = 5 * 60;
        var LONG_BREAK = 15 * 60;
        var CIRCUMFERENCE = 2 * Math.PI * 98;

        var state = {
            mode: 'focus',
            totalSeconds: FOCUS,
            remainingSeconds: FOCUS,
            running: false,
            intervalId: null,
            completedPomodoros: 4,
            totalFocusMinutes: 100
        };

        var ring = document.getElementById('progress-ring');
        var display = document.getElementById('timer-display');
        var modeLabel = document.getElementById('timer-mode-label');
        var statusText = document.getElementById('status-text');
        var statusLabel = document.getElementById('status-label');
        var btnStart = document.getElementById('btn-start');
        var btnStartText = document.getElementById('btn-start-text');
        var btnReset = document.getElementById('btn-reset');
        var btnSkip = document.getElementById('btn-skip');
        var modeButtons = document.querySelectorAll('.mode-btn');
        var dotsContainer = document.getElementById('dots-container');
        var statSessions = document.getElementById('stat-sessions');
        var statMinutes = document.getElementById('stat-minutes');
        var statsCount = document.getElementById('stats-count');

        window.addEventListener('beforeunload', function() {
            if (state.intervalId) clearInterval(state.intervalId);
        });
        var taskDropdown = document.getElementById('task-dropdown');
        var taskInput = document.getElementById('task-input');
        var taskSelectBtn = document.getElementById('task-select-btn');

        function formatTime(sec) {
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function renderDots() {
            dotsContainer.innerHTML = '';
            for (var i = 0; i < 8; i++) {
                var dot = document.createElement('span');
                if (i < state.completedPomodoros) {
                    dot.className = 'w-3.5 h-3.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D]';
                } else {
                    dot.className = 'w-3.5 h-3.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-transparent';
                }
                dotsContainer.appendChild(dot);
            }
        }

        function updateStats() {
            statSessions.textContent = state.completedPomodoros;
            statMinutes.textContent = state.totalFocusMinutes + ' min';
            statsCount.textContent = state.completedPomodoros + ' / 8';
            renderDots();
        }

        function updateDisplay() {
            display.textContent = formatTime(state.remainingSeconds);
            var progress = 1 - (state.remainingSeconds / state.totalSeconds);
            var offset = CIRCUMFERENCE * (1 - progress);
            ring.style.strokeDashoffset = offset;
        }

        function setModeButtonStyles(activeBtn) {
            modeButtons.forEach(function(btn) {
                btn.classList.remove('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]', 'shadow-[2px_2px_0px_0px_#0F172A]');
                btn.classList.add('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
            });
            activeBtn.classList.remove('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
            activeBtn.classList.add('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]', 'shadow-[2px_2px_0px_0px_#0F172A]');
        }

        function setMode(mode) {
            state.mode = mode;
            state.running = false;
            if (state.intervalId) { clearInterval(state.intervalId); state.intervalId = null; }

            if (mode === 'focus') {
                state.totalSeconds = FOCUS;
                state.remainingSeconds = FOCUS;
                document.body.classList.remove('rest-mode');
                statusText.textContent = '专注中';
                modeLabel.textContent = '专注模式';
                btnStartText.textContent = '开始专注';
            } else if (mode === 'short') {
                state.totalSeconds = SHORT_BREAK;
                state.remainingSeconds = SHORT_BREAK;
                document.body.classList.add('rest-mode');
                statusText.textContent = '休息中';
                modeLabel.textContent = '短休息';
                btnStartText.textContent = '开始休息';
            } else {
                state.totalSeconds = LONG_BREAK;
                state.remainingSeconds = LONG_BREAK;
                document.body.classList.add('rest-mode');
                statusText.textContent = '休息中';
                modeLabel.textContent = '长休息';
                btnStartText.textContent = '开始休息';
            }

            var activeBtn = document.getElementById('mode-' + mode);
            setModeButtonStyles(activeBtn);

            btnStart.querySelector('i').setAttribute('data-lucide', 'play');
            if (typeof lucide !== 'undefined') lucide.createIcons();
            updateDisplay();
        }

        function tick() {
            if (state.remainingSeconds <= 0) {
                clearInterval(state.intervalId);
                state.intervalId = null;
                state.running = false;
                btnStartText.textContent = state.mode === 'focus' ? '开始专注' : '开始休息';
                btnStart.querySelector('i').setAttribute('data-lucide', 'play');
                if (typeof lucide !== 'undefined') lucide.createIcons();

                if (state.mode === 'focus') {
                    state.completedPomodoros = Math.min(state.completedPomodoros + 1, 8);
                    state.totalFocusMinutes += 25;
                    updateStats();
                }
                return;
            }
            state.remainingSeconds--;
            updateDisplay();
        }

        function toggleTimer() {
            if (state.running) {
                clearInterval(state.intervalId);
                state.intervalId = null;
                state.running = false;
                btnStartText.textContent = '继续';
                btnStart.querySelector('i').setAttribute('data-lucide', 'play');
            } else {
                state.intervalId = setInterval(tick, 1000);
                state.running = true;
                btnStartText.textContent = '暂停';
                btnStart.querySelector('i').setAttribute('data-lucide', 'pause');
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function resetTimer() {
            state.running = false;
            if (state.intervalId) { clearInterval(state.intervalId); state.intervalId = null; }
            state.remainingSeconds = state.totalSeconds;
            btnStartText.textContent = state.mode === 'focus' ? '开始专注' : '开始休息';
            btnStart.querySelector('i').setAttribute('data-lucide', 'play');
            if (typeof lucide !== 'undefined') lucide.createIcons();
            updateDisplay();
        }

        taskSelectBtn.addEventListener('click', function() {
            taskDropdown.classList.toggle('hidden');
        });

        document.querySelectorAll('.task-option').forEach(function(option) {
            option.addEventListener('click', function() {
                taskInput.value = option.textContent;
                taskDropdown.classList.add('hidden');
            });
        });

        btnStart.addEventListener('click', toggleTimer);
        btnReset.addEventListener('click', resetTimer);
        btnSkip.addEventListener('click', function() {
            state.remainingSeconds = 0;
            tick();
        });

        modeButtons.forEach(function(btn) {
            btn.addEventListener('click', function() {
                var mode = btn.id.replace('mode-', '');
                setMode(mode);
            });
        });

        ring.style.strokeDasharray = CIRCUMFERENCE;
        updateDisplay();
        updateStats();

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    })();
    </script>
</body>
</html>
