<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizFlow - 首页</title>
    <style id="theme-vars">
/* QuizFlow 刷题 App - 品牌设计样式 */
/* 新丑风（Neobrutalism）：极客靛蓝 + 活力耀光橙 */

:root {
  --color-primary: #535BF2;
  --color-primary-light: #747BFF;
  --color-primary-dark: #3F43C6;
  --color-primary-50: rgba(83, 91, 242, 0.06);
  --color-primary-100: rgba(83, 91, 242, 0.12);
  --color-primary-200: rgba(83, 91, 242, 0.22);

  --color-bg: #F8FAFC;
  --color-bg-secondary: #F1F5F9;
  --color-bg-tertiary: #E2E8F0;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F8FAFC;
  --color-border: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #535BF2;

  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  --color-focus: #FF6F3D;
  --color-focus-light: rgba(255, 111, 61, 0.08);
  --color-focus-dark: #E24F1D;

  --heatmap-0: #F1F5F9;
  --heatmap-1: #C7D2FE;
  --heatmap-2: #818CF8;
  --heatmap-3: #4F46E5;
  --heatmap-4: #3730A3;

  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
}

html.dark {
  --color-primary: #747BFF;
  --color-primary-light: #9CA1FF;
  --color-primary-dark: #535BF2;
  --color-primary-50: rgba(116, 123, 255, 0.12);
  --color-primary-100: rgba(116, 123, 255, 0.2);
  --color-primary-200: rgba(116, 123, 255, 0.35);

  --color-bg: #0B0F19;
  --color-bg-secondary: #111827;
  --color-bg-tertiary: #1F2937;
  --color-surface: #111827;
  --color-surface-hover: #1F2937;
  --color-border: #1F2937;
  --color-border-light: #162031;

  --color-text-primary: #F8FAFC;
  --color-text-secondary: #94A3B8;
  --color-text-tertiary: #64748B;
  --color-text-inverse: #0B0F19;
  --color-text-link: #747BFF;

  --state-success: #34D399;
  --state-warning: #FBBF24;
  --state-error: #F87171;
  --state-info: #60A5FA;

  --color-focus: #FF885E;
  --color-focus-light: rgba(255, 136, 94, 0.12);
  --color-focus-dark: #FF6F3D;

  --heatmap-0: #111827;
  --heatmap-1: #1E293B;
  --heatmap-2: #312E81;
  --heatmap-3: #4338CA;
  --heatmap-4: #4F46E5;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      /* 新丑风（Neobrutalism）硬阴影 */
      .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #F8FAFC;
      }
      .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #F8FAFC;
      }
      .brutalist-shadow-btn {
        box-shadow: 3px 3px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow-btn {
        box-shadow: 3px 3px 0px 0px #F8FAFC;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-[var(--color-bg)] text-[var(--color-text-primary)]">
    <main class="relative min-h-screen pb-24">

        <!-- 顶部导航栏 -->

                    <button class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="用户">

            <span class="text-[9px] font-black tracking-tighter">题库</span>

        <a href="quiz.html" data-tab="quiz" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="pen-line" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">刷题</span>
        </a>
        <a href="weekly-report.html" data-tab="report" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="bar-chart-3" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">统计</span>
        </a>
        <a href="#" data-tab="profile" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" onclick="showToast('功能开发中'); return false;">

    <script>
    (function() {
        /* 轻量 toast */
        window.showToast = function(message) {
            const existing = document.getElementById('quizflow-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'quizflow-toast';
            toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#0F172A] dark:bg-[#F8FAFC] text-white dark:text-[#0B0F19] text-xs font-black uppercase tracking-wider shadow-[4px_4px_0_0_#0F172A] dark:shadow-[4px_4px_0_0_#F8FAFC]';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        /* 底部 Tab 高亮 */
        function setActiveTab() {
            const currentPage = location.pathname.split('/').pop() || 'home.html';
            document.querySelectorAll('nav a[data-tab]').forEach(function(tab) {
                const href = tab.getAttribute('href') || '';
                const tabPage = href.split('/').pop();
                if (tabPage && tabPage === currentPage) {
                    tab.classList.remove('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                    tab.classList.add('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                } else {
                    tab.classList.remove('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                    tab.classList.add('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                }
            });
        }
        document.addEventListener('DOMContentLoaded', setActiveTab);
        /* 主题切换 */
        const savedTheme = localStorage.getItem('quizflow-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(savedTheme);
        }

        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                const isDark = document.documentElement.classList.contains('dark');
                const next = isDark ? 'light' : 'dark';
                document.documentElement.classList.remove('light', 'dark');
                document.documentElement.classList.add(next);
                localStorage.setItem('quizflow-theme', next);
            });
        }

        // 接收父页面通过 postMessage 下发的主题切换指令
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'quizflow-theme') {
                const theme = e.data.theme;
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.classList.remove('light', 'dark');
                    document.documentElement.classList.add(theme);
                    localStorage.setItem('quizflow-theme', theme);
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
        });

        const menuBtn = document.getElementById('menu-btn');
        if (menuBtn) {
            menuBtn.addEventListener('click', function() {
                showToast('菜单功能开发中');
            });
        }

        /* 初始化图标 */
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    })();
    </script>
</body>
</html>
