<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizFlow - 题库管理</title>
    <style id="theme-vars">
/* QuizFlow 刷题 App - 品牌设计样式 */
/* 现代极客风格：极客靛蓝 + 活力耀光橙 */

:root {
  --color-primary: #535BF2;
  --color-primary-light: #747BFF;
  --color-primary-dark: #3F43C6;
  --color-primary-50: rgba(83, 91, 242, 0.06);
  --color-primary-100: rgba(83, 91, 242, 0.12);
  --color-primary-200: rgba(83, 91, 242, 0.22);

  --color-bg: #F8FAFC;
  --color-bg-secondary: #F1F5F9;
  --color-bg-tertiary: #E2E8F0;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F8FAFC;
  --color-border: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #535BF2;

  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  --color-focus: #FF6F3D;
  --color-focus-light: rgba(255, 111, 61, 0.08);
  --color-focus-dark: #E24F1D;

  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;

  --radius-sm: 4px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.08);
}

html.dark {
  --color-primary: #747BFF;
  --color-primary-light: #9CA1FF;
  --color-primary-dark: #535BF2;
  --color-primary-50: rgba(116, 123, 255, 0.12);
  --color-primary-100: rgba(116, 123, 255, 0.2);
  --color-primary-200: rgba(116, 123, 255, 0.35);

  --color-bg: #0B0F19;
  --color-bg-secondary: #111827;
  --color-bg-tertiary: #1F2937;
  --color-surface: #111827;
  --color-surface-hover: #1F2937;
  --color-border: #1F2937;
  --color-border-light: #162031;

  --color-text-primary: #F8FAFC;
  --color-text-secondary: #94A3B8;
  --color-text-tertiary: #64748B;
  --color-text-inverse: #0B0F19;
  --color-text-link: #747BFF;

  --state-success: #34D399;
  --state-warning: #FBBF24;
  --state-error: #F87171;
  --state-info: #60A5FA;

  --color-focus: #FF885E;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline { --color-primary: var(--color-primary); --color-border: var(--color-border); }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .lucide { stroke-width: 2.5px !important; }
      .row-high-weight { position: relative; }
      .row-high-weight::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #FF6F3D; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--color-bg);">
    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-30 border-b-4 border-[#0F172A] bg-[var(--color-surface)] shadow-[0_4px_0_0_rgba(15,23,42,0.08)]">
        <div class="max-w-[1440px] mx-auto flex items-center justify-between px-6 h-16">
            <a href="dashboard.html" class="flex items-center gap-3 group">
                <div class="flex items-center justify-center w-10 h-10 border-2 border-[#0F172A] bg-[var(--color-primary)] text-[var(--color-text-inverse)] shadow-[3px_3px_0_0_#0F172A] group-hover:translate-x-[1px] group-hover:translate-y-[1px] group-hover:shadow-[2px_2px_0_0_#0F172A] transition-all cursor-pointer">
                    <i data-lucide="book-open" class="w-5 h-5 stroke-[2.5]"></i>
                </div>
                <span class="text-lg font-black tracking-tighter uppercase text-[#0F172A] dark:text-[#F8FAFC]">题库管理</span>
            </a>
            <div class="flex items-center gap-3">
                <button class="flex items-center justify-center w-10 h-10 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] shadow-[3px_3px_0_0_#0F172A] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[1px_1px_0_0_#0F172A] transition-all cursor-pointer" onclick="showToast('搜索功能开发中')" aria-label="搜索">
                    <i data-lucide="search" class="w-4 h-4 stroke-[2.5]"></i>
                </button>
                <button class="relative flex items-center justify-center w-10 h-10 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] shadow-[3px_3px_0_0_#0F172A] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[1px_1px_0_0_#0F172A] transition-all cursor-pointer" onclick="showToast('通知功能开发中')" aria-label="通知">
                    <i data-lucide="bell" class="w-4 h-4 stroke-[2.5]"></i>
                    <span class="absolute -top-1.5 -right-1.5 w-3.5 h-3.5 border border-[#0F172A] bg-[#FF6F3D] flex items-center justify-center text-[9px] font-black text-[#0F172A] dark:text-[#0F172A]">3</span>
                </button>
                <button id="theme-toggle" class="flex items-center justify-center w-10 h-10 border-2 border-[#0F172A] bg-[var(--color-primary)] text-[var(--color-text-inverse)] shadow-[3px_3px_0_0_#0F172A] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[1px_1px_0_0_#0F172A] transition-all cursor-pointer" aria-label="切换主题">
                    <i data-lucide="sun" class="w-4 h-4 stroke-[2.5] block dark:hidden"></i>
                    <i data-lucide="moon" class="w-4 h-4 stroke-[2.5] hidden dark:block"></i>
                </button>
                <div class="flex items-center justify-center w-10 h-10 border-2 border-[#0F172A] bg-[var(--color-focus)] text-[#0F172A] dark:text-[#0F172A] shadow-[3px_3px_0_0_#0F172A]">
                    <i data-lucide="user" class="w-5 h-5 stroke-[2.5]"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- 主体布局 -->
    <div class="max-w-[1440px] mx-auto flex" style="min-height: calc(100vh - 64px);">

        <!-- 左侧导航栏 (220px) -->
        <aside class="shrink-0 flex flex-col border-r-4 border-[#0F172A] bg-[var(--color-surface)]" style="width: 220px;">
            <div class="flex items-center gap-3 px-5 py-5 border-b-4 border-[#0F172A] bg-[var(--color-primary)]">
                <div class="flex items-center justify-center w-10 h-10 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[var(--color-primary)] shadow-[3px_3px_0_0_#0F172A]">
                    <i data-lucide="book-open" class="w-5 h-5 stroke-[2.5]"></i>
                </div>
                <span class="text-lg font-black tracking-tighter uppercase text-white">QuizFlow</span>
            </div>

            <nav class="flex-1 px-3 py-4 flex flex-col gap-2">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-3 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] text-sm font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all">
                    <i data-lucide="layout-dashboard" class="w-4 h-4 stroke-[2.5]"></i><span>数据总览</span>
                </a>
                <a href="bank-manage.html" class="flex items-center gap-3 px-3 py-3 border-2 border-[#0F172A] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0F172A] text-sm font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all">
                    <i data-lucide="book-open" class="w-4 h-4 stroke-[2.5]"></i><span>题库管理</span>
                </a>
                <a href="desktop-quiz.html" class="flex items-center gap-3 px-3 py-3 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] text-sm font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all">
                    <i data-lucide="pen-line" class="w-4 h-4 stroke-[2.5]"></i><span>刷题练习</span>
                </a>
                <a href="exam-manage.html" class="flex items-center gap-3 px-3 py-3 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] text-sm font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all">
                    <i data-lucide="file-check" class="w-4 h-4 stroke-[2.5]"></i><span>考试管理</span>
                </a>
                <a href="#" class="flex items-center gap-3 px-3 py-3 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] text-sm font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all" onclick="event.preventDefault(); showToast('设置功能开发中');">
                    <i data-lucide="settings" class="w-4 h-4 stroke-[2.5]"></i><span>设置</span>
                </a>
            </nav>

            <div class="px-3 py-4 border-t-4 border-[#0F172A]">
                <div class="flex items-center gap-3 border-2 border-[#0F172A] bg-[var(--color-surface)] p-3 shadow-[2px_2px_0_0_#0F172A]">
                    <div class="flex items-center justify-center w-10 h-10 border-2 border-[#0F172A] bg-[var(--color-primary)] text-[var(--color-text-inverse)] text-sm font-black">林</div>
                    <div class="min-w-0">
                        <div class="text-sm font-black truncate text-[#0F172A] dark:text-[#F8FAFC] uppercase tracking-tight">林同学</div>
                        <div class="text-xs font-mono font-bold truncate text-[#475569] dark:text-[#94A3B8]">连续学习 7 天</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 右侧主内容区 -->
        <div class="flex-1 flex flex-col min-w-0 bg-[var(--color-bg)]">
            <header class="flex items-center justify-between px-6 h-20 border-b-4 border-[#0F172A] bg-[var(--color-surface)] shrink-0">
                <div class="flex items-end gap-4">
                    <h1 class="text-2xl font-black tracking-tighter uppercase text-[#0F172A] dark:text-[#F8FAFC]">题库管理</h1>
                    <span class="px-2 py-0.5 bg-[#FF6F3D] text-[#0F172A] dark:text-[#0F172A] border-2 border-[#0F172A] text-xs font-black tracking-wider shadow-[2px_2px_0_0_#0F172A] -rotate-1">共 8 个题库</span>
                </div>
                <button class="inline-flex items-center gap-2 px-4 py-2.5 border-2 border-[#0F172A] bg-[#FF6F3D] text-xs font-black text-[#0F172A] dark:text-[#0F172A] uppercase tracking-wider shadow-[3px_3px_0_0_#0F172A] hover:translate-x-[1px] hover:translate-y-[1px] hover:shadow-[2px_2px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-[1px_1px_0_0_#0F172A] transition-all cursor-pointer" onclick="showToast('AI 导入题库：功能开发中')">
                    <i data-lucide="sparkles" class="w-4 h-4 stroke-[2.5]"></i>
                    AI 导入题库
                </button>
            </header>

            <!-- 批量操作工具栏 -->
            <div class="flex items-center gap-3 px-6 py-3 border-b-4 border-[#0F172A] bg-[var(--color-surface)] shrink-0">
                <span class="text-xs font-black uppercase tracking-wider text-[#475569] dark:text-[#94A3B8]">批量操作</span>
                <button onclick="showToast('导入题库：功能开发中')" class="inline-flex items-center gap-1.5 px-3 py-2 border-2 border-[#0F172A] bg-[var(--color-surface)] text-xs font-black text-[#0F172A] dark:text-[#F8FAFC] uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer"><i data-lucide="upload" class="w-3.5 h-3.5 stroke-[2.5]"></i>导入</button>
                <button onclick="showToast('导出题库：功能开发中')" class="inline-flex items-center gap-1.5 px-3 py-2 border-2 border-[#0F172A] bg-[var(--color-surface)] text-xs font-black text-[#0F172A] dark:text-[#F8FAFC] uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer"><i data-lucide="download" class="w-3.5 h-3.5 stroke-[2.5]"></i>导出</button>
                <button onclick="showToast('批量删除：功能开发中')" class="inline-flex items-center gap-1.5 px-3 py-2 border-2 border-[#0F172A] bg-[#EF4444] text-white text-xs font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer"><i data-lucide="trash-2" class="w-3.5 h-3.5 stroke-[2.5]"></i>删除</button>
                <div class="flex-1"></div>
                <button onclick="showToast('新建题库：功能开发中')" class="inline-flex items-center gap-1.5 px-3 py-2 border-2 border-[#0F172A] bg-[var(--color-primary)] text-white text-xs font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer"><i data-lucide="plus" class="w-3.5 h-3.5 stroke-[2.5]"></i>新建题库</button>
            </div>

            <!-- 筛选/搜索栏 -->
            <div class="flex flex-wrap items-center gap-4 px-6 py-4 border-b-4 border-[#0F172A] bg-[var(--color-surface)] shrink-0">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-black uppercase tracking-wider text-[#475569] dark:text-[#94A3B8]">分类</span>
                    <div class="flex items-center gap-2">
                        <button class="category-tab px-3 py-1.5 border-2 border-[#0F172A] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0F172A] font-black text-xs uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] active:translate-y-px active:shadow-none transition-all" data-category="all">全部</button>
                        <button class="category-tab px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] font-black text-xs uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-y-px active:shadow-none transition-all" data-category="math">数学</button>
                        <button class="category-tab px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] font-black text-xs uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-y-px active:shadow-none transition-all" data-category="english">英语</button>
                        <button class="category-tab px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] font-black text-xs uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-y-px active:shadow-none transition-all" data-category="cs">计算机</button>
                        <button class="category-tab px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] font-black text-xs uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-y-px active:shadow-none transition-all" data-category="civil">公务员</button>
                        <button class="category-tab px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-[#0F172A] dark:text-[#F8FAFC] font-black text-xs uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-y-px active:shadow-none transition-all" data-category="law">法考</button>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-xs font-black uppercase tracking-wider text-[#475569] dark:text-[#94A3B8]">排序</span>
                    <div class="relative">
                        <select class="appearance-none px-3 py-1.5 pr-8 border-2 border-[#0F172A] bg-[var(--color-surface)] font-black text-xs uppercase tracking-wider cursor-pointer shadow-[2px_2px_0_0_#0F172A] outline-none text-[#0F172A] dark:text-[#F8FAFC]">
                            <option>按权重</option><option>按进度</option><option>按创建时间</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    </div>
                </div>
                <div class="flex-1 min-w-[200px] max-w-sm ml-auto">
                    <div class="flex items-center gap-2 px-3 py-2 border-2 border-[#0F172A] bg-[var(--color-surface)] shadow-[2px_2px_0_0_#0F172A] focus-within:-translate-x-px focus-within:-translate-y-px focus-within:shadow-[3px_3px_0_0_#0F172A] transition-all">
                        <i data-lucide="search" class="w-4 h-4 stroke-[2.5] text-[#475569] dark:text-[#94A3B8]"></i>
                        <input type="text" placeholder="搜索题库名称..." class="flex-1 bg-transparent text-xs font-black uppercase tracking-wider outline-none min-w-0 placeholder:text-[#94A3B8] text-[#0F172A] dark:text-[#F8FAFC]">
                    </div>
                </div>
            </div>

            <!-- 题库表格区域 -->
            <div class="flex-1 overflow-auto px-6 py-5">
                <div class="border-4 border-[#0F172A] bg-[var(--color-surface)] shadow-[4px_4px_0_0_#0F172A] overflow-hidden">
                    <table class="w-full" style="table-layout: fixed;">
                        <thead>
                            <tr class="border-b-4 border-[#0F172A] bg-[var(--color-bg-secondary)]">
                                <th class="text-left px-4 py-3 text-[10px] font-mono font-black uppercase tracking-widest text-[#0F172A] dark:text-[#F8FAFC]" style="width: 5%;">权重</th>
                                <th class="text-left px-4 py-3 text-[10px] font-mono font-black uppercase tracking-widest text-[#0F172A] dark:text-[#F8FAFC]" style="width: 24%;">题库名称</th>
                                <th class="text-left px-4 py-3 text-[10px] font-mono font-black uppercase tracking-widest text-[#0F172A] dark:text-[#F8FAFC]" style="width: 10%;">分类</th>
                                <th class="text-left px-4 py-3 text-[10px] font-mono font-black uppercase tracking-widest text-[#0F172A] dark:text-[#F8FAFC]" style="width: 8%;">题目数</th>
                                <th class="text-left px-4 py-3 text-[10px] font-mono font-black uppercase tracking-widest text-[#0F172A] dark:text-[#F8FAFC]" style="width: 18%;">完成进度</th>
                                <th class="text-left px-4 py-3 text-[10px] font-mono font-black uppercase tracking-widest text-[#0F172A] dark:text-[#F8FAFC]" style="width: 8%;">正确率</th>
                                <th class="text-left px-4 py-3 text-[10px] font-mono font-black uppercase tracking-widest text-[#0F172A] dark:text-[#F8FAFC]" style="width: 12%;">最近练习</th>
                                <th class="text-right px-4 py-3 text-[10px] font-mono font-black uppercase tracking-widest text-[#0F172A] dark:text-[#F8FAFC]" style="width: 15%;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="bank-table-body">
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <div class="flex items-center justify-between mt-5">
                    <span class="text-xs font-mono font-bold text-[#475569] dark:text-[#94A3B8]">显示 1-8 条，共 8 条记录</span>
                    <div class="flex items-center gap-1">
                        <button class="px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-xs font-black text-[#475569] dark:text-[#94A3B8] shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" disabled>上一页</button>
                        <button class="px-3 py-1.5 border-2 border-[#0F172A] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0F172A] text-xs font-black shadow-[2px_2px_0_0_#0F172A]">1</button>
                        <button class="px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-xs font-black text-[#0F172A] dark:text-[#F8FAFC] shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">2</button>
                        <button class="px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-xs font-black text-[#0F172A] dark:text-[#F8FAFC] shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">3</button>
                        <button class="px-3 py-1.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-xs font-black text-[#0F172A] dark:text-[#F8FAFC] shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 border-2 border-[#0F172A] bg-[var(--color-surface)] text-sm font-black text-[#0F172A] dark:text-[#F8FAFC] shadow-[4px_4px_0_0_#0F172A] z-50 whitespace-nowrap';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        const banks = [
            { name: '高数期末复习', desc: '微积分、线性代数、概率论', cat: 'math', color: '#535BF2', text: 'white', count: 320, progress: 78, rate: 85, time: '今天 14:30', weight: 5 },
            { name: 'CET-6 核心词汇', desc: '六级高频词汇 2000 词', cat: 'english', color: '#F59E0B', text: 'black', count: 2000, progress: 45, rate: 72, time: '今天 10:15', weight: 4 },
            { name: '数据结构与算法', desc: '链表、树、图、排序算法', cat: 'cs', color: '#535BF2', text: 'white', count: 150, progress: 62, rate: 79, time: '昨天 20:45', weight: 4 },
            { name: '行测常识判断', desc: '政治、经济、法律、文化', cat: 'civil', color: '#FF6F3D', text: 'black', count: 500, progress: 30, rate: 58, time: '3天前', weight: 3 },
            { name: '民法总则', desc: '民法典总则编核心考点', cat: 'law', color: '#FF6F3D', text: 'black', count: 280, progress: 55, rate: 68, time: '2天前', weight: 3 },
            { name: '英语阅读理解 100 篇', desc: '考研英语真题阅读', cat: 'english', color: '#F59E0B', text: 'black', count: 100, progress: 12, rate: 65, time: '1周前', weight: 2 },
            { name: '计算机网络', desc: 'OSI、TCP/IP、路由协议', cat: 'cs', color: '#535BF2', text: 'white', count: 180, progress: 88, rate: 82, time: '昨天 09:20', weight: 3 },
            { name: '线性代数专项', desc: '矩阵、向量、特征值', cat: 'math', color: '#535BF2', text: 'white', count: 120, progress: 95, rate: 91, time: '今天 08:00', weight: 5 }
        ];

        function starSVG(filled) {
            const fill = filled ? '#0F172A' : 'none';
            const stroke = '#0F172A';
            return `<svg class="w-3 h-3" viewBox="0 0 20 20" fill="${fill}" stroke="${stroke}" stroke-width="1.5"><path d="M10 1.5l2.47 4.91 5.53.8-4 3.83.94 5.46L10 13.77l-4.94 2.73.94-5.46-4-3.83 5.53-.8z"/></svg>`;
        }

        function stars(weight) {
            return `<div class="inline-flex items-center gap-0.5 bg-[#FF6F3D] border border-[#0F172A] px-1 py-0.5" title="权重: ${weight} 星">${Array.from({length:5}).map((_,i)=>starSVG(i<weight)).join('')}</div>`;
        }

        function renderTable(category='all') {
            const tbody = document.getElementById('bank-table-body');
            tbody.innerHTML = '';
            banks.forEach(b => {
                if (category !== 'all' && b.cat !== category) return;
                const high = b.weight >= 4 ? 'row-high-weight' : '';
                const rateColor = b.rate >= 80 ? '#535BF2' : (b.rate >= 60 ? '#F59E0B' : '#EF4444');
                const tr = document.createElement('tr');
                tr.className = `border-b-2 border-[#0F172A] ${high} bg-[var(--color-surface)] hover:bg-[var(--color-bg-secondary)] dark:hover:bg-[#0B0F19] transition-colors`;
                tr.innerHTML = `
                    <td class="px-4 py-4">${stars(b.weight)}</td>
                    <td class="px-4 py-4">
                        <div class="text-sm font-black tracking-tight truncate text-[#0F172A] dark:text-[#F8FAFC]">${b.name}</div>
                        <div class="text-xs font-mono font-bold text-[#475569] dark:text-[#94A3B8] truncate mt-0.5">${b.desc}</div>
                    </td>
                    <td class="px-4 py-4"><span class="inline-flex items-center px-2 py-0.5 text-[10px] font-black uppercase tracking-wider border-2 border-[#0F172A]" style="background:${b.color};color:${b.text}">${{math:'数学',english:'英语',cs:'计算机',civil:'公务员',law:'法考'}[b.cat]}</span></td>
                    <td class="px-4 py-4"><span class="text-sm font-mono font-black whitespace-nowrap text-[#0F172A] dark:text-[#F8FAFC]">${b.count}</span></td>
                    <td class="px-4 py-4">
                        <div class="flex items-center gap-2">
                            <div class="flex-1 h-4 border-2 border-[#0F172A] bg-[var(--color-surface)] overflow-hidden">
                                <div class="h-full bg-[#535BF2]" style="width: ${b.progress}%;"></div>
                            </div>
                            <span class="text-xs font-mono font-black whitespace-nowrap text-[#0F172A] dark:text-[#F8FAFC]">${b.progress}%</span>
                        </div>
                    </td>
                    <td class="px-4 py-4"><span class="text-sm font-mono font-black whitespace-nowrap" style="color:${rateColor}">${b.rate}%</span></td>
                    <td class="px-4 py-4"><span class="text-xs font-mono font-bold whitespace-nowrap text-[#475569] dark:text-[#94A3B8]">${b.time}</span></td>
                    <td class="px-4 py-4">
                        <div class="flex items-center justify-end gap-2">
                            <button class="inline-flex items-center gap-1 px-2.5 py-1 border-2 border-[#0F172A] bg-[var(--color-surface)] font-black text-[10px] uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" title="编辑"><i data-lucide="pencil" class="w-3 h-3 stroke-[2.5]"></i>编辑</button>
                            <button class="inline-flex items-center gap-1 px-2.5 py-1 border-2 border-[#0F172A] bg-[var(--color-bg-secondary)] font-black text-[10px] uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" title="统计"><i data-lucide="bar-chart-2" class="w-3 h-3 stroke-[2.5]"></i>统计</button>
                            <button class="inline-flex items-center gap-1 px-2.5 py-1 border-2 border-[#0F172A] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0F172A] font-black text-[10px] uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] hover:-translate-x-px hover:-translate-y-px hover:shadow-[3px_3px_0_0_#0F172A] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" title="练习"><i data-lucide="play" class="w-3 h-3 stroke-[2.5]"></i>练习</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('quizflow-theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.remove('light');
                document.documentElement.classList.add('dark');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
            }

            document.getElementById('theme-toggle').addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                document.documentElement.classList.toggle('light', !isDark);
                localStorage.setItem('quizflow-theme', isDark ? 'dark' : 'light');
            });

            // 接收父页面通过 postMessage 下发的主题切换指令
            window.addEventListener('message', (e) => {
                if (e.data && e.data.type === 'quizflow-theme') {
                    const theme = e.data.theme;
                    if (theme === 'light' || theme === 'dark') {
                        document.documentElement.classList.remove('light', 'dark');
                        document.documentElement.classList.add(theme);
                        localStorage.setItem('quizflow-theme', theme);
                    }
                }
            });

            renderTable('all');

            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.category-tab').forEach(t => {
                        t.classList.remove('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0F172A]');
                        t.classList.add('bg-[var(--color-surface)]', 'text-[#0F172A]', 'dark:text-[#F8FAFC]');
                    });
                    tab.classList.remove('bg-[var(--color-surface)]', 'text-[#0F172A]', 'dark:text-[#F8FAFC]');
                    tab.classList.add('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0F172A]');
                    renderTable(tab.dataset.category);
                });
            });
        });
    </script>
</body>
</html>
