<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟考试</title>
    <style id="theme-vars">
/* QuizFlow 刷题 App - 品牌设计样式 */
/* 新丑风（Neobrutalism）：极客靛蓝 + 活力耀光橙 */

:root {
  --color-primary: #535BF2;
  --color-primary-light: #747BFF;
  --color-primary-dark: #3F43C6;
  --color-primary-50: rgba(83, 91, 242, 0.06);
  --color-primary-100: rgba(83, 91, 242, 0.12);
  --color-primary-200: rgba(83, 91, 242, 0.22);

  --color-bg: #F8FAFC;
  --color-bg-secondary: #F1F5F9;
  --color-bg-tertiary: #E2E8F0;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F8FAFC;
  --color-border: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #535BF2;

  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  --color-focus: #FF6F3D;
  --color-focus-light: rgba(255, 111, 61, 0.08);
  --color-focus-dark: #E24F1D;

  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
}

html.dark {
  --color-primary: #747BFF;
  --color-primary-light: #9CA1FF;
  --color-primary-dark: #535BF2;
  --color-primary-50: rgba(116, 123, 255, 0.12);
  --color-primary-100: rgba(116, 123, 255, 0.2);
  --color-primary-200: rgba(116, 123, 255, 0.35);

  --color-bg: #0B0F19;
  --color-bg-secondary: #111827;
  --color-bg-tertiary: #1F2937;
  --color-surface: #111827;
  --color-surface-hover: #1F2937;
  --color-border: #1F2937;
  --color-border-light: #162031;

  --color-text-primary: #F8FAFC;
  --color-text-secondary: #94A3B8;
  --color-text-tertiary: #64748B;
  --color-text-inverse: #0B0F19;
  --color-text-link: #747BFF;

  --state-success: #34D399;
  --state-warning: #FBBF24;
  --state-error: #F87171;
  --state-info: #60A5FA;

  --color-focus: #FF885E;
  --color-focus-light: rgba(255, 136, 94, 0.12);
  --color-focus-dark: #FF6F3D;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #F8FAFC;
      }
      .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #F8FAFC;
      }

      .question-card {
        transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
      }
      .question-card.slide-left {
        transform: translateX(-120%);
        opacity: 0;
      }
      .question-card.slide-right {
        transform: translateX(120%);
        opacity: 0;
      }
      .choice {
        transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease;
      }
      .choice:active {
        transform: scale(.97);
      }
      .shake {
        animation: shake .5s cubic-bezier(.36,.07,.19,.97) both;
      }
      @keyframes shake {
        10%, 90% { transform: translate3d(-1px,0,0); }
        20%, 80% { transform: translate3d(2px,0,0); }
        30%, 50%, 70% { transform: translate3d(-4px,0,0); }
        40%, 60% { transform: translate3d(4px,0,0); }
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-[var(--color-bg)] text-[var(--color-text-primary)]">
    <main class="relative min-h-screen pb-24">

        <!-- 顶部导航栏 -->
        <header class="sticky top-0 z-30 border-b-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)]">
            <div class="flex items-center justify-between px-4 h-16">
                <button class="back-btn inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="返回">
                    <i data-lucide="chevron-left" class="h-5 w-5 stroke-[2.5]"></i>
                </button>
                <div class="flex flex-col items-center">
                    <h1 class="text-sm font-black uppercase tracking-wider text-[var(--color-text-primary)]">模拟考试</h1>
                    <div class="flex items-center gap-1 text-[10px] font-black text-[var(--color-text-secondary)]">
                        <i data-lucide="clock" class="w-3 h-3 stroke-[2.5]"></i>
                        <span id="timer-text">45:00</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="theme-toggle" class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="切换主题">
                        <i data-lucide="sun" class="h-5 w-5 dark:hidden stroke-[2.5]"></i>
                        <i data-lucide="moon" class="h-5 w-5 hidden dark:block stroke-[2.5]"></i>
                    </button>
                    <button id="sheet-btn" class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="答题卡">
                        <i data-lucide="layout-grid" class="h-5 w-5 stroke-[2.5]"></i>
                    </button>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="px-4 pb-3">
                <div class="flex items-center justify-between mb-1.5 text-[10px] font-black uppercase tracking-wider">
                    <span class="text-[var(--color-text-secondary)]">答题进度</span>
                    <span class="text-[var(--color-primary)]"><span id="current-num">1</span> / <span id="total-num">30</span></span>
                </div>
                <div class="h-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] overflow-hidden">
                    <div id="progress-bar" class="h-full bg-[var(--color-primary)] border-r-2 border-[#0F172A] dark:border-[#F8FAFC]" style="width: 3.33%;"></div>
                </div>
            </div>
        </header>

        <!-- 题目区域 -->
        <section class="px-4 pt-4">
            <div class="border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow p-4 question-card" id="question-card">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="inline-flex items-center justify-center w-8 h-8 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white text-sm font-black shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC]" id="q-number">1</span>
                        <span class="px-2 py-0.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] text-[10px] font-black uppercase tracking-wider" id="q-type">单选题</span>
                        <span class="px-2 py-0.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0B0F19] text-[10px] font-black uppercase tracking-wider" id="q-score">2分</span>
                    </div>
                    <button id="flag-btn" class="flex items-center gap-1 px-2.5 py-1.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] text-[10px] font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                        <i data-lucide="flag" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                        <span>标记</span>
                    </button>
                </div>

                <h2 class="text-base font-black leading-snug mb-5" id="q-title">加载中…</h2>

                <div class="flex flex-col gap-3" id="choices-container">
                    <!-- JS 渲染 -->
                </div>
            </div>
        </section>

        <!-- 底部操作 -->
        <section class="px-4 pt-5 pb-6">
            <div class="flex items-center justify-between gap-3">
                <button id="prev-btn" class="flex-1 flex items-center justify-center gap-1.5 py-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-sm font-black text-[var(--color-text-primary)] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                    <i data-lucide="chevron-left" class="w-4 h-4 stroke-[2.5]"></i>
                    <span>上一题</span>
                </button>
                <button id="next-btn" class="flex-1 flex items-center justify-center gap-1.5 py-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-sm font-black text-[#0F172A] dark:text-[#0B0F19] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                    <span>下一题</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 stroke-[2.5]"></i>
                </button>
            </div>
            <button id="submit-btn" class="w-full mt-3 py-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white text-sm font-black uppercase tracking-wider shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                交卷
            </button>
        </section>

    </main>

    <!-- 底部 Tab 导航 -->
    <nav class="fixed bottom-0 left-0 right-0 h-16 border-t-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)] flex items-center justify-around z-30 pb-[env(safe-area-inset-bottom,0px)]">
        <a href="home.html" data-tab="home" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="home" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">首页</span>
        </a>
        <a href="question-bank.html" data-tab="bank" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="book-open" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">题库</span>
        </a>
        <a href="quiz.html" data-tab="quiz" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="pen-line" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">刷题</span>
        </a>
        <a href="weekly-report.html" data-tab="report" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="bar-chart-3" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">统计</span>
        </a>
        <a href="#" data-tab="profile" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" onclick="showToast('功能开发中'); return false;">
            <i data-lucide="user" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">我的</span>
        </a>
    </nav>

    <!-- 答题卡 -->
    <div id="answer-sheet" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-[#0F172A]/60 dark:bg-black/70" id="sheet-overlay"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-[var(--color-surface)] border-t-4 border-[#0F172A] dark:border-[#F8FAFC] p-4 max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-black uppercase tracking-wider">答题卡</h3>
                <button id="close-sheet" class="inline-flex h-9 w-9 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="关闭">
                    <i data-lucide="x" class="h-5 w-5 stroke-[2.5]"></i>
                </button>
            </div>
            <div class="flex items-center gap-4 mb-4 text-[10px] font-black uppercase tracking-wider">
                <span class="flex items-center gap-1"><span class="w-3 h-3 border border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)]"></span> 已答</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 border border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-focus)]"></span> 当前</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 border border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827]"></span> 未答</span>
            </div>
            <div class="grid grid-cols-6 gap-2 mb-4" id="sheet-grid"></div>
            <button id="sheet-submit" class="w-full py-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white text-sm font-black uppercase tracking-wider shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">去交卷</button>
        </div>
    </div>

    <!-- 交卷确认弹窗 -->
    <div id="submit-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-[#0F172A]/60 dark:bg-black/70" id="submit-overlay"></div>
        <div class="relative w-full max-w-sm border-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)] brutalist-shadow p-5 text-center">
            <div class="w-12 h-12 mx-auto mb-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] flex items-center justify-center text-[#0F172A] dark:text-[#0B0F19]">
                <i data-lucide="alert-circle" class="w-6 h-6 stroke-[2.5]"></i>
            </div>
            <h3 class="text-lg font-black mb-1">确认交卷？</h3>
            <p class="text-xs font-bold text-[var(--color-text-secondary)] mb-4">你还有 <span id="unanswered-count" class="text-[var(--color-primary)] font-black">0</span> 道题未作答</p>
            <div class="grid grid-cols-2 gap-3">
                <button id="cancel-submit" class="py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-sm font-black shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">继续答题</button>
                <button id="confirm-submit" class="py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-sm font-black text-[#0F172A] dark:text-[#0B0F19] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">确认交卷</button>
            </div>
        </div>
    </div>

    <!-- 成绩弹窗 -->
    <div id="score-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-[#0F172A]/70 dark:bg-black/80" id="score-overlay"></div>
        <div class="relative w-full max-w-sm border-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)] brutalist-shadow p-5 text-center">
            <div class="absolute -top-4 -right-2 w-10 h-10 bg-[#FF6F3D] border-2 border-[#0F172A] dark:border-[#F8FAFC] flex items-center justify-center text-[#0F172A] dark:text-[#0B0F19] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] rotate-[8deg]">
                <i data-lucide="trophy" class="w-5 h-5 stroke-[2.5]"></i>
            </div>
            <h3 class="text-sm font-black uppercase tracking-wider mb-3">考试成绩</h3>
            <div class="w-24 h-24 mx-auto mb-3 border-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white flex items-center justify-center shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC]">
                <span id="score-num" class="text-3xl font-black">86</span>
            </div>
            <p class="text-xs font-bold text-[var(--color-text-secondary)] mb-4">用时 <span id="score-time">32:15</span> · 答对 <span id="score-correct">26</span> / <span id="score-total">30</span></p>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] p-2">
                    <div class="text-[10px] font-black uppercase tracking-wider text-[var(--color-text-secondary)]">正确率</div>
                    <div id="score-accuracy" class="text-lg font-black">86.7%</div>
                </div>
                <div class="border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] p-2">
                    <div class="text-[10px] font-black uppercase tracking-wider text-[var(--color-text-secondary)]">排名</div>
                    <div class="text-lg font-black">Top 15%</div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button id="score-close" class="py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-sm font-black shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">返回首页</button>
                <button id="score-review" class="py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-sm font-black text-[#0F172A] dark:text-[#0B0F19] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">查看解析</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        /* 轻量 toast */
        window.showToast = function(message) {
            const existing = document.getElementById('quizflow-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'quizflow-toast';
            toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#0F172A] dark:bg-[#F8FAFC] text-white dark:text-[#0B0F19] text-xs font-black uppercase tracking-wider shadow-[4px_4px_0_0_#0F172A] dark:shadow-[4px_4px_0_0_#F8FAFC]';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        /* 底部 Tab 高亮 */
        function setActiveTab() {
            const currentPage = location.pathname.split('/').pop() || 'home.html';
            document.querySelectorAll('nav a[data-tab]').forEach(function(tab) {
                const href = tab.getAttribute('href') || '';
                const tabPage = href.split('/').pop();
                if (tabPage && tabPage === currentPage) {
                    tab.classList.remove('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                    tab.classList.add('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                } else {
                    tab.classList.remove('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                    tab.classList.add('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                }
            });
        }
        document.addEventListener('DOMContentLoaded', setActiveTab);

        const savedTheme = localStorage.getItem('quizflow-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(savedTheme);
        }

        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                const isDark = document.documentElement.classList.contains('dark');
                const next = isDark ? 'light' : 'dark';
                document.documentElement.classList.remove('light', 'dark');
                document.documentElement.classList.add(next);
                localStorage.setItem('quizflow-theme', next);
            });
        }

        // 接收父页面通过 postMessage 下发的主题切换指令
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'quizflow-theme') {
                const theme = e.data.theme;
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.classList.remove('light', 'dark');
                    document.documentElement.classList.add(theme);
                    localStorage.setItem('quizflow-theme', theme);
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
        });

        document.querySelectorAll('.back-btn').forEach(btn => {
            btn.addEventListener('click', () => { location.href = 'home.html'; });
        });

        /* 题库数据 */
        const questions = [
            { type:'单选题', score:2, title:'在 JavaScript 中，typeof null 的结果是？', choices:['"null"','"object"','"undefined"','"number"'], correct:1 },
            { type:'单选题', score:2, title:'CSS 中，哪个属性用于设置元素的堆叠顺序？', choices:['z-index','position','display','float'], correct:0 },
            { type:'单选题', score:2, title:'React 中用于状态管理的 Hook 是？', choices:['useEffect','useState','useRef','useMemo'], correct:1 },
            { type:'多选题', score:3, title:'以下哪些是 HTML5 新增的语义化标签？', choices:['&lt;div&gt;','&lt;section&gt;','&lt;article&gt;','&lt;header&gt;'], correct:[1,2,3] },
            { type:'单选题', score:2, title:'HTTP 状态码 404 表示？', choices:['服务器错误','请求成功','未找到资源','重定向'], correct:2 },
            { type:'单选题', score:2, title:'JavaScript 中，数组方法 map() 会？', choices:['修改原数组','返回新数组','过滤元素','排序数组'], correct:1 },
            { type:'单选题', score:2, title:'CSS 盒模型中，padding 是指？', choices:['外边距','内边距','边框','内容区域'], correct:1 },
            { type:'单选题', score:2, title:'Git 中用于保存当前工作进度的命令是？', choices:['git commit','git stash','git merge','git push'], correct:1 },
            { type:'单选题', score:2, title:'在 Vue 3 中，Composition API 的入口函数是？', choices:['setup()','data()','mounted()','methods()'], correct:0 },
            { type:'多选题', score:3, title:'以下哪些属于前端性能优化手段？', choices:['代码分割','图片懒加载','缓存策略','DOM 操作优化'], correct:[0,1,2,3] }
        ];

        const totalQuestions = 30;
        const examQuestions = [];
        for (let i = 0; i < totalQuestions; i++) {
            const q = questions[i % questions.length];
            examQuestions.push({ ...q, id: i + 1 });
        }

        let currentIndex = 0;
        let answers = new Array(totalQuestions).fill(null);
        let flagged = new Array(totalQuestions).fill(false);
        let timeLeft = 45 * 60;
        let timerInterval;

        const qNumber = document.getElementById('q-number');
        const qType = document.getElementById('q-type');
        const qScore = document.getElementById('q-score');
        const qTitle = document.getElementById('q-title');
        const choicesContainer = document.getElementById('choices-container');
        const questionCard = document.getElementById('question-card');
        const currentNum = document.getElementById('current-num');
        const totalNum = document.getElementById('total-num');
        const progressBar = document.getElementById('progress-bar');
        const timerText = document.getElementById('timer-text');
        const flagBtn = document.getElementById('flag-btn');
        const sheetGrid = document.getElementById('sheet-grid');

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.textContent = formatTime(timeLeft);
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showScore();
                }
            }, 1000);
        }
        window.addEventListener('beforeunload', function() {
            clearInterval(timerInterval);
        });

        function getAnswerLetter(index) {
            return String.fromCharCode(65 + index);
        }

        function renderQuestion(direction) {
            const q = examQuestions[currentIndex];

            questionCard.classList.add(direction === 'next' ? 'slide-left' : 'slide-right');

            setTimeout(() => {
                qNumber.textContent = q.id;
                qType.textContent = q.type;
                qScore.textContent = q.score + '分';
                qTitle.textContent = q.title;
                currentNum.textContent = q.id;
                progressBar.style.width = ((q.id / totalQuestions) * 100) + '%';

                choicesContainer.innerHTML = '';
                q.choices.forEach((choice, idx) => {
                    const label = document.createElement('label');
                    label.className = 'choice flex items-stretch border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer';
                    const isSelected = q.type === '多选题'
                        ? (answers[currentIndex] || []).includes(idx)
                        : answers[currentIndex] === idx;
                    if (isSelected) {
                        label.classList.remove('bg-white', 'dark:bg-[#111827]');
                        label.classList.add('bg-[var(--color-primary)]', '-translate-x-[2px]', '-translate-y-[2px]');
                    }

                    label.innerHTML = `
                        <div class="flex items-center justify-center w-10 shrink-0 border-r-2 border-[#0F172A] dark:border-[#F8FAFC] ${isSelected ? 'bg-[var(--color-primary-dark)]' : 'bg-[var(--color-bg-secondary)]'}">
                            <span class="text-sm font-black ${isSelected ? 'text-white' : 'text-[var(--color-text-primary)]'}">${getAnswerLetter(idx)}</span>
                        </div>
                        <div class="flex-1 flex items-center px-4 py-3.5 min-w-0">
                            <span class="text-sm font-bold ${isSelected ? 'text-white' : 'text-[var(--color-text-primary)]'}">${choice}</span>
                        </div>
                    `;
                    label.addEventListener('click', () => selectChoice(idx));
                    choicesContainer.appendChild(label);
                });

                updateFlagStyle();

                questionCard.classList.remove('slide-left', 'slide-right');
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }, 250);
        }

        function selectChoice(idx) {
            const q = examQuestions[currentIndex];
            if (q.type === '多选题') {
                if (!Array.isArray(answers[currentIndex])) answers[currentIndex] = [];
                const pos = answers[currentIndex].indexOf(idx);
                if (pos > -1) answers[currentIndex].splice(pos, 1);
                else answers[currentIndex].push(idx);
            } else {
                answers[currentIndex] = idx;
            }
            renderQuestion('same');
        }

        function updateFlagStyle() {
            if (flagged[currentIndex]) {
                flagBtn.classList.remove('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                flagBtn.classList.add('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
            } else {
                flagBtn.classList.remove('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                flagBtn.classList.add('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion('prev');
            } else {
                questionCard.classList.add('shake');
                setTimeout(() => questionCard.classList.remove('shake'), 500);
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (currentIndex < totalQuestions - 1) {
                currentIndex++;
                renderQuestion('next');
            } else {
                document.getElementById('answer-sheet').classList.remove('hidden');
                renderSheet();
            }
        });

        flagBtn.addEventListener('click', () => {
            flagged[currentIndex] = !flagged[currentIndex];
            updateFlagStyle();
        });

        function renderSheet() {
            sheetGrid.innerHTML = '';
            for (let i = 0; i < totalQuestions; i++) {
                const btn = document.createElement('button');
                btn.className = 'h-10 border-2 text-xs font-black transition-all cursor-pointer ';
                const isAnswered = Array.isArray(answers[i]) ? answers[i].length > 0 : answers[i] !== null;
                if (i === currentIndex) {
                    btn.className += 'border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0B0F19] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC]';
                } else if (isAnswered) {
                    btn.className += 'border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC]';
                } else {
                    btn.className += 'border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)]';
                }
                btn.textContent = i + 1;
                btn.addEventListener('click', () => {
                    currentIndex = i;
                    document.getElementById('answer-sheet').classList.add('hidden');
                    renderQuestion('same');
                });
                sheetGrid.appendChild(btn);
            }
        }

        document.getElementById('sheet-btn').addEventListener('click', () => {
            document.getElementById('answer-sheet').classList.remove('hidden');
            renderSheet();
        });
        document.getElementById('close-sheet').addEventListener('click', () => document.getElementById('answer-sheet').classList.add('hidden'));
        document.getElementById('sheet-overlay').addEventListener('click', () => document.getElementById('answer-sheet').classList.add('hidden'));
        document.getElementById('sheet-submit').addEventListener('click', () => {
            document.getElementById('answer-sheet').classList.add('hidden');
            openSubmitModal();
        });

        function openSubmitModal() {
            const unanswered = answers.filter(a => Array.isArray(a) ? a.length === 0 : a === null).length;
            document.getElementById('unanswered-count').textContent = unanswered;
            document.getElementById('submit-modal').classList.remove('hidden');
        }

        document.getElementById('submit-btn').addEventListener('click', openSubmitModal);
        document.getElementById('cancel-submit').addEventListener('click', () => document.getElementById('submit-modal').classList.add('hidden'));
        document.getElementById('submit-overlay').addEventListener('click', () => document.getElementById('submit-modal').classList.add('hidden'));
        document.getElementById('confirm-submit').addEventListener('click', () => {
            document.getElementById('submit-modal').classList.add('hidden');
            clearInterval(timerInterval);
            showScore();
        });

        function showScore() {
            let correctCount = 0;
            let totalScore = 0;
            let obtainedScore = 0;
            examQuestions.forEach((q, i) => {
                totalScore += q.score;
                const ans = answers[i];
                if (q.type === '多选题') {
                    if (Array.isArray(ans) && ans.length > 0 && JSON.stringify(ans.sort()) === JSON.stringify(q.correct.sort())) {
                        correctCount++;
                        obtainedScore += q.score;
                    }
                } else {
                    if (ans !== null && ans === q.correct) {
                        correctCount++;
                        obtainedScore += q.score;
                    }
                }
            });
            const accuracy = Math.round((correctCount / totalQuestions) * 1000) / 10;
            document.getElementById('score-num').textContent = Math.round((obtainedScore / totalScore) * 100);
            document.getElementById('score-time').textContent = formatTime(45 * 60 - timeLeft);
            document.getElementById('score-correct').textContent = correctCount;
            document.getElementById('score-total').textContent = totalQuestions;
            document.getElementById('score-accuracy').textContent = accuracy + '%';
            document.getElementById('score-modal').classList.remove('hidden');
        }

        document.getElementById('score-close').addEventListener('click', () => location.href = 'home.html');
        document.getElementById('score-review').addEventListener('click', () => showToast('查看解析功能开发中'));
        document.getElementById('score-overlay').addEventListener('click', () => document.getElementById('score-modal').classList.add('hidden'));

        totalNum.textContent = totalQuestions;
        startTimer();
        renderQuestion('next');

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    })();
    </script>
</body>
</html>
