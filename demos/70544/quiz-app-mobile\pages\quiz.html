<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>刷题模式</title>
    <style id="theme-vars">
/* QuizFlow 刷题 App - 品牌设计样式 */
/* 新丑风（Neobrutalism）：极客靛蓝 + 活力耀光橙 */

:root {
  --color-primary: #535BF2;
  --color-primary-light: #747BFF;
  --color-primary-dark: #3F43C6;
  --color-primary-50: rgba(83, 91, 242, 0.06);
  --color-primary-100: rgba(83, 91, 242, 0.12);
  --color-primary-200: rgba(83, 91, 242, 0.22);

  --color-bg: #F8FAFC;
  --color-bg-secondary: #F1F5F9;
  --color-bg-tertiary: #E2E8F0;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F8FAFC;
  --color-border: #E2E8F0;
  --color-border-light: #F1F5F9;

  --color-text-primary: #0F172A;
  --color-text-secondary: #475569;
  --color-text-tertiary: #94A3B8;
  --color-text-inverse: #FFFFFF;
  --color-text-link: #535BF2;

  --state-success: #10B981;
  --state-warning: #F59E0B;
  --state-error: #EF4444;
  --state-info: #3B82F6;

  --color-focus: #FF6F3D;
  --color-focus-light: rgba(255, 111, 61, 0.08);
  --color-focus-dark: #E24F1D;

  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
}

html.dark {
  --color-primary: #747BFF;
  --color-primary-light: #9CA1FF;
  --color-primary-dark: #535BF2;
  --color-primary-50: rgba(116, 123, 255, 0.12);
  --color-primary-100: rgba(116, 123, 255, 0.2);
  --color-primary-200: rgba(116, 123, 255, 0.35);

  --color-bg: #0B0F19;
  --color-bg-secondary: #111827;
  --color-bg-tertiary: #1F2937;
  --color-surface: #111827;
  --color-surface-hover: #1F2937;
  --color-border: #1F2937;
  --color-border-light: #162031;

  --color-text-primary: #F8FAFC;
  --color-text-secondary: #94A3B8;
  --color-text-tertiary: #64748B;
  --color-text-inverse: #0B0F19;
  --color-text-link: #747BFF;

  --state-success: #34D399;
  --state-warning: #FBBF24;
  --state-error: #F87171;
  --state-info: #60A5FA;

  --color-focus: #FF885E;
  --color-focus-light: rgba(255, 136, 94, 0.12);
  --color-focus-dark: #FF6F3D;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-bg); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }

      .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow {
        box-shadow: 4px 4px 0px 0px #F8FAFC;
      }
      .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow-sm {
        box-shadow: 2px 2px 0px 0px #F8FAFC;
      }
      .brutalist-shadow-btn {
        box-shadow: 3px 3px 0px 0px #0F172A;
      }
      .dark .brutalist-shadow-btn {
        box-shadow: 3px 3px 0px 0px #F8FAFC;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-[var(--color-bg)] text-[var(--color-text-primary)]">
    <main class="relative min-h-screen pb-24">

        <!-- 顶部导航栏 -->
        <header class="sticky top-0 z-30 border-b-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)]">
            <div class="flex items-center justify-between px-4 h-16">
                <button class="back-btn inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="返回">
                    <i data-lucide="chevron-left" class="h-5 w-5 stroke-[2.5]"></i>
                </button>
                <div class="flex flex-col items-center">
                    <h1 class="text-sm font-black uppercase tracking-wider text-[var(--color-text-primary)]">刷题模式</h1>
                    <div class="flex items-center gap-1 text-[10px] font-black text-[var(--color-text-secondary)]">
                        <i data-lucide="clock" class="w-3 h-3 stroke-[2.5]"></i>
                        <span id="timer">00:00</span>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="theme-toggle" class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="切换主题">
                        <i data-lucide="sun" class="h-5 w-5 dark:hidden stroke-[2.5]"></i>
                        <i data-lucide="moon" class="h-5 w-5 hidden dark:block stroke-[2.5]"></i>
                    </button>
                    <button id="open-answer-sheet" class="inline-flex h-10 w-10 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white brutalist-shadow-sm active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="答题卡">
                        <i data-lucide="layout-grid" class="h-5 w-5 stroke-[2.5]"></i>
                    </button>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="px-4 pb-3">
                <div class="flex items-center justify-between mb-1.5 text-[10px] font-black uppercase tracking-wider">
                    <span class="text-[var(--color-text-secondary)]">答题进度</span>
                    <span class="text-[var(--color-primary)]"><span id="current-progress">3</span> / <span id="total-progress">20</span></span>
                </div>
                <div class="h-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] overflow-hidden">
                    <div id="progress-bar" class="h-full bg-[var(--color-primary)] border-r-2 border-[#0F172A] dark:border-[#F8FAFC]" style="width: 15%;"></div>
                </div>
            </div>
        </header>

        <!-- 题目卡片 -->
        <section class="px-4 pt-4">
            <div class="border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] brutalist-shadow p-4">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <span class="inline-flex items-center justify-center w-8 h-8 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white text-sm font-black shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC]">3</span>
                        <span class="px-2 py-0.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] text-[10px] font-black uppercase tracking-wider">单选题</span>
                    </div>
                    <button id="flag-btn" class="flex items-center gap-1 px-2.5 py-1.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0B0F19] text-[10px] font-black uppercase tracking-wider shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                        <i data-lucide="flag" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                        <span>标记</span>
                    </button>
                </div>

                <h2 class="text-base font-black leading-snug mb-5">在 JavaScript 中，以下关于 Promise 的说法，哪一项是正确的？</h2>

                <div class="flex flex-col gap-3" id="options">
                    <label class="option-label flex items-stretch border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                        <div class="flex items-center justify-center w-10 shrink-0 border-r-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)]">
                            <span class="text-sm font-black text-[var(--color-text-primary)]">A</span>
                        </div>
                        <div class="flex-1 flex items-center px-4 py-3.5 min-w-0">
                            <span class="text-sm font-bold text-[var(--color-text-primary)]">Promise 一旦执行，无法取消</span>
                        </div>
                    </label>

                    <label class="option-label flex items-stretch border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                        <div class="flex items-center justify-center w-10 shrink-0 border-r-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)]">
                            <span class="text-sm font-black text-[var(--color-text-primary)]">B</span>
                        </div>
                        <div class="flex-1 flex items-center px-4 py-3.5 min-w-0">
                            <span class="text-sm font-bold text-[var(--color-text-primary)]">Promise.prototype.finally 只能接收成功的回调</span>
                        </div>
                    </label>

                    <label class="option-label flex items-stretch border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                        <div class="flex items-center justify-center w-10 shrink-0 border-r-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)]">
                            <span class="text-sm font-black text-[var(--color-text-primary)]">C</span>
                        </div>
                        <div class="flex-1 flex items-center px-4 py-3.5 min-w-0">
                            <span class="text-sm font-bold text-[var(--color-text-primary)]">Promise.resolve 返回的总是已 fulfilled 的 Promise</span>
                        </div>
                    </label>

                    <label class="option-label flex items-stretch border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                        <div class="flex items-center justify-center w-10 shrink-0 border-r-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)]">
                            <span class="text-sm font-black text-[var(--color-text-primary)]">D</span>
                        </div>
                        <div class="flex-1 flex items-center px-4 py-3.5 min-w-0">
                            <span class="text-sm font-bold text-[var(--color-text-primary)]">Promise 的 then 方法不能链式调用</span>
                        </div>
                    </label>
                </div>
            </div>
        </section>

        <!-- 底部操作栏 -->
        <section class="px-4 pt-5 pb-6">
            <div class="flex items-center justify-between gap-3">
                <button id="prev-btn" class="flex-1 flex items-center justify-center gap-1.5 py-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-sm font-black text-[var(--color-text-primary)] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                    <i data-lucide="chevron-left" class="w-4 h-4 stroke-[2.5]"></i>
                    <span>上一题</span>
                </button>
                <button id="explain-btn" class="flex-1 flex items-center justify-center gap-1.5 py-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-bg-secondary)] text-sm font-black text-[var(--color-text-primary)] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                    <i data-lucide="sparkles" class="w-4 h-4 stroke-[2.5]"></i>
                    <span>AI 解析</span>
                </button>
                <button id="next-btn" class="flex-1 flex items-center justify-center gap-1.5 py-3 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-sm font-black text-[#0F172A] dark:text-[#0B0F19] shadow-[3px_3px_0_0_#0F172A] dark:shadow-[3px_3px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
                    <span>下一题</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 stroke-[2.5]"></i>
                </button>
            </div>
        </section>

    </main>

    <!-- 底部 Tab 导航 -->
    <nav class="fixed bottom-0 left-0 right-0 h-16 border-t-4 border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-surface)] flex items-center justify-around z-30 pb-[env(safe-area-inset-bottom,0px)]">
        <a href="home.html" data-tab="home" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="home" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">首页</span>
        </a>
        <a href="question-bank.html" data-tab="bank" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="book-open" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">题库</span>
        </a>
        <a href="quiz.html" data-tab="quiz" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="pen-line" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">刷题</span>
        </a>
        <a href="weekly-report.html" data-tab="report" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer">
            <i data-lucide="bar-chart-3" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">统计</span>
        </a>
        <a href="#" data-tab="profile" class="flex flex-col items-center justify-center gap-1 w-14 h-14 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" onclick="showToast('功能开发中'); return false;">
            <i data-lucide="user" class="w-5 h-5 stroke-[2.5]"></i>
            <span class="text-[9px] font-black tracking-tighter">我的</span>
        </a>
    </nav>

    <!-- 答题卡弹窗 -->
    <div id="answer-sheet-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-[#0F172A]/60 dark:bg-black/70" id="answer-sheet-overlay"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-[var(--color-surface)] border-t-4 border-[#0F172A] dark:border-[#F8FAFC] p-4 max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-sm font-black uppercase tracking-wider">答题卡</h3>
                <button id="close-answer-sheet" class="inline-flex h-9 w-9 items-center justify-center border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all cursor-pointer" aria-label="关闭">
                    <i data-lucide="x" class="h-5 w-5 stroke-[2.5]"></i>
                </button>
            </div>
            <div class="flex items-center gap-4 mb-4 text-[10px] font-black uppercase tracking-wider">
                <span class="flex items-center gap-1"><span class="w-3 h-3 border border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)]"></span> 已答</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 border border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-focus)]"></span> 当前</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 border border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827]"></span> 未答</span>
            </div>
            <div class="grid grid-cols-5 gap-2" id="answer-grid">
                <!-- JS 生成 -->
            </div>
        </div>
    </div>

    <script>
    (function() {
        /* 轻量 toast */
        window.showToast = function(message) {
            const existing = document.getElementById('quizflow-toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.id = 'quizflow-toast';
            toast.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 border-2 border-[#0F172A] dark:border-[#F8FAFC] bg-[#0F172A] dark:bg-[#F8FAFC] text-white dark:text-[#0B0F19] text-xs font-black uppercase tracking-wider shadow-[4px_4px_0_0_#0F172A] dark:shadow-[4px_4px_0_0_#F8FAFC]';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        /* 底部 Tab 高亮 */
        function setActiveTab() {
            const currentPage = location.pathname.split('/').pop() || 'home.html';
            document.querySelectorAll('nav a[data-tab]').forEach(function(tab) {
                const href = tab.getAttribute('href') || '';
                const tabPage = href.split('/').pop();
                if (tabPage && tabPage === currentPage) {
                    tab.classList.remove('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                    tab.classList.add('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                } else {
                    tab.classList.remove('bg-[#FF6F3D]', 'text-[#0F172A]', 'dark:text-[#0B0F19]');
                    tab.classList.add('bg-white', 'dark:bg-[#111827]', 'text-[var(--color-text-primary)]');
                }
            });
        }
        document.addEventListener('DOMContentLoaded', setActiveTab);

        const savedTheme = localStorage.getItem('quizflow-theme');
        if (savedTheme === 'dark' || savedTheme === 'light') {
            document.documentElement.classList.remove('light', 'dark');
            document.documentElement.classList.add(savedTheme);
        }

        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', function() {
                const isDark = document.documentElement.classList.contains('dark');
                const next = isDark ? 'light' : 'dark';
                document.documentElement.classList.remove('light', 'dark');
                document.documentElement.classList.add(next);
                localStorage.setItem('quizflow-theme', next);
            });
        }

        // 接收父页面通过 postMessage 下发的主题切换指令
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'quizflow-theme') {
                const theme = e.data.theme;
                if (theme === 'light' || theme === 'dark') {
                    document.documentElement.classList.remove('light', 'dark');
                    document.documentElement.classList.add(theme);
                    localStorage.setItem('quizflow-theme', theme);
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
        });

        document.querySelectorAll('.back-btn').forEach(btn => {
            btn.addEventListener('click', () => { location.href = 'question-bank.html'; });
        });

        /* 计时器 */
        let seconds = 0;
        const timerEl = document.getElementById('timer');
        const timerInterval = setInterval(() => {
            seconds++;
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            if (timerEl) timerEl.textContent = m + ':' + s;
        }, 1000);
        window.addEventListener('beforeunload', function() {
            clearInterval(timerInterval);
        });

        /* 选项选择 */
        const options = document.querySelectorAll('.option-label');
        options.forEach(opt => {
            opt.addEventListener('click', () => {
                options.forEach(o => {
                    o.classList.remove('bg-[var(--color-primary)]', '-translate-x-[2px]', '-translate-y-[2px]');
                    o.classList.add('bg-white', 'dark:bg-[#111827]');
                    const letterBox = o.querySelector(':scope > div:first-child');
                    const letter = letterBox ? letterBox.querySelector('span') : null;
                    const textBox = o.querySelector(':scope > div:last-child');
                    const text = textBox ? textBox.querySelector('span') : null;
                    if (letterBox) {
                        letterBox.classList.remove('bg-[var(--color-primary-dark)]');
                        letterBox.classList.add('bg-[var(--color-bg-secondary)]');
                    }
                    if (letter) letter.classList.remove('text-white');
                    if (letter) letter.classList.add('text-[var(--color-text-primary)]');
                    if (text) text.classList.remove('text-white');
                    if (text) text.classList.add('text-[var(--color-text-primary)]');
                });
                opt.classList.remove('bg-white', 'dark:bg-[#111827]');
                opt.classList.add('bg-[var(--color-primary)]', '-translate-x-[2px]', '-translate-y-[2px]');
                const letterBox = opt.querySelector(':scope > div:first-child');
                const letter = letterBox ? letterBox.querySelector('span') : null;
                const textBox = opt.querySelector(':scope > div:last-child');
                const text = textBox ? textBox.querySelector('span') : null;
                if (letterBox) {
                    letterBox.classList.remove('bg-[var(--color-bg-secondary)]');
                    letterBox.classList.add('bg-[var(--color-primary-dark)]');
                }
                if (letter) {
                    letter.classList.remove('text-[var(--color-text-primary)]');
                    letter.classList.add('text-white');
                }
                if (text) {
                    text.classList.remove('text-[var(--color-text-primary)]');
                    text.classList.add('text-white');
                }
            });
        });

        /* 答题卡弹窗 */
        const modal = document.getElementById('answer-sheet-modal');
        const openBtn = document.getElementById('open-answer-sheet');
        const closeBtn = document.getElementById('close-answer-sheet');
        const overlay = document.getElementById('answer-sheet-overlay');
        const grid = document.getElementById('answer-grid');
        const total = 20;
        const answered = [1, 2, 3];
        const current = 3;

        for (let i = 1; i <= total; i++) {
            const btn = document.createElement('button');
            btn.className = 'h-10 border-2 text-xs font-black transition-all cursor-pointer ';
            if (i === current) {
                btn.className += 'border-[#0F172A] dark:border-[#F8FAFC] bg-[#FF6F3D] text-[#0F172A] dark:text-[#0B0F19] shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC]';
            } else if (answered.includes(i)) {
                btn.className += 'border-[#0F172A] dark:border-[#F8FAFC] bg-[var(--color-primary)] text-white shadow-[2px_2px_0_0_#0F172A] dark:shadow-[2px_2px_0_0_#F8FAFC]';
            } else {
                btn.className += 'border-[#0F172A] dark:border-[#F8FAFC] bg-white dark:bg-[#111827] text-[var(--color-text-primary)]';
            }
            btn.textContent = i;
            grid.appendChild(btn);
        }

        function openModal() { modal.classList.remove('hidden'); }
        function closeModal() { modal.classList.add('hidden'); }
        if (openBtn) openBtn.addEventListener('click', openModal);
        if (closeBtn) closeBtn.addEventListener('click', closeModal);
        if (overlay) overlay.addEventListener('click', closeModal);

        /* 按钮事件 */
        document.getElementById('flag-btn').addEventListener('click', () => showToast('标记功能开发中'));
        document.getElementById('prev-btn').addEventListener('click', () => alert('上一题'));
        document.getElementById('next-btn').addEventListener('click', () => alert('下一题'));
        document.getElementById('explain-btn').addEventListener('click', () => { location.href = 'ai-explain.html'; });

        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    })();
    </script>
</body>
</html>
