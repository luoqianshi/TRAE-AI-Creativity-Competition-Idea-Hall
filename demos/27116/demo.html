<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同管理系统 Demo</title>
  <!-- Ant Design CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5/dist/reset.css">
  <!-- React -->
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <!-- Ant Design JS -->
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/zh-cn.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd@5/dist/antd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif; background: #f0f2f5; }
    #root { height: 100vh; }
    
    /* 布局样式 */
    .layout { display: flex; height: 100vh; }
    .sider { width: 200px; background: #001529; color: #fff; transition: all 0.2s; overflow-y: auto; overflow-x: hidden; }
    .sider.collapsed { width: 80px; }
    .sider::-webkit-scrollbar { width: 6px; }
    .sider::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }
    .sider-header { height: 64px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .sider-header.collapsed-header { font-size: 14px; }
    
    /* 菜单样式 */
    .menu { padding: 8px 0; }
    .menu-item { padding: 12px 24px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; font-size: 14px; }
    .menu-item:hover { background: rgba(255,255,255,0.1); }
    .menu-item.active { background: #1890ff; }
    .menu-item.collapsed-item { padding: 12px; justify-content: center; font-size: 16px; }
    .submenu-title { padding: 12px 24px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    .submenu-title:hover { background: rgba(255,255,255,0.1); }
    .submenu-children { background: #000c17; }
    .submenu-children .menu-item { padding-left: 48px; font-size: 13px; }
    .menu-icon { font-size: 16px; }
    
    /* 主内容区 */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header { height: 64px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .collapse-btn { cursor: pointer; font-size: 18px; color: #666; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; color: #666; font-size: 14px; }
    .breadcrumb-separator { color: #999; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .user-info { display: flex; align-items: center; gap: 8px; color: #666; }
    .user-avatar { width: 32px; height: 32px; background: #1890ff; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    
    /* 内容区 */
    .content { flex: 1; padding: 16px 24px 24px; overflow: auto; background: #f0f2f5; }
    
    /* 列表页样式 */
    .list-container { background: #fff; border-radius: 2px; min-height: calc(100vh - 140px); }
    .tabs-area { padding: 0 16px; border-bottom: 1px solid #f0f0f0; }
    .tabs { display: flex; gap: 32px; }
    .tab-item { padding: 12px 0; cursor: pointer; font-size: 14px; color: #666; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-item:hover { color: #1890ff; }
    .tab-item.active { color: #1890ff; border-bottom-color: #1890ff; }
    
    /* 工具栏 */
    .toolbar { padding: 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; }
    .toolbar-left { display: flex; align-items: center; gap: 8px; }
    .toolbar-right { display: flex; align-items: center; gap: 8px; }
    .search-input { width: 200px; padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 2px; font-size: 14px; outline: none; transition: all 0.2s; }
    .search-input:focus { border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,0.2); }
    .search-input::placeholder { color: #bfbfbf; }
    .btn { padding: 6px 16px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; font-size: 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 4px; }
    .btn:hover { border-color: #1890ff; color: #1890ff; }
    .btn-primary { background: #1890ff; border-color: #1890ff; color: #fff; }
    .btn-primary:hover { background: #40a9ff; border-color: #40a9ff; }
    .btn-danger { color: #ff4d4f; border-color: #ff4d4f; }
    .btn-danger:hover { background: #ff4d4f; color: #fff; }
    .btn-link { border: none; background: transparent; color: #1890ff; padding: 4px 8px; }
    .btn-link:hover { color: #40a9ff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* 筛选区域 */
    .filter-area { padding: 16px; border-bottom: 1px solid #f0f0f0; background: #fafafa; }
    .filter-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .filter-item { display: flex; align-items: center; gap: 8px; }
    .filter-label { font-size: 14px; color: #666; min-width: 80px; }
    .filter-select { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 2px; font-size: 14px; min-width: 150px; background: #fff; cursor: pointer; }
    .filter-date { padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 2px; font-size: 14px; min-width: 150px; background: #fff; }
    .filter-actions { display: flex; gap: 8px; margin-left: auto; }
    
    /* 表格 */
    .table-wrapper { padding: 0 16px; }
    .ant-table { width: 100%; border-collapse: collapse; }
    .ant-table-thead { background: #fafafa; }
    .ant-table-thead > tr > th { padding: 16px 8px; font-weight: 600; color: #666; border-bottom: 1px solid #f0f0f0; text-align: left; font-size: 14px; }
    .ant-table-tbody > tr > td { padding: 16px 8px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .ant-table-tbody > tr:hover > td { background: #fafafa; }
    .ant-table-tbody > tr.selected > td { background: #e6f7ff; }
    .checkbox { width: 16px; height: 16px; cursor: pointer; }
    
    /* 状态标签 */
    .tag { display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 12px; line-height: 20px; }
    .tag-default { background: #fafafa; border: 1px solid #d9d9d9; color: #666; }
    .tag-processing { background: #e6f7ff; border: 1px solid #91d5ff; color: #1890ff; }
    .tag-success { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; }
    .tag-error { background: #fff2f0; border: 1px solid #ffccc7; color: #ff4d4f; }
    .tag-warning { background: #fffbe6; border: 1px solid #ffe58f; color: #faad14; }
    
    /* 分页 */
    .pagination-area { padding: 16px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; border-top: 1px solid #f0f0f0; }
    .pagination-total { font-size: 14px; color: #666; }
    .pagination-btns { display: flex; gap: 4px; }
    .page-btn { min-width: 32px; height: 32px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .page-btn:hover { border-color: #1890ff; color: #1890ff; }
    .page-btn.active { background: #1890ff; border-color: #1890ff; color: #fff; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-size-select { padding: 4px 8px; border: 1px solid #d9d9d9; border-radius: 2px; font-size: 14px; }
    
    /* 首页样式 */
    .home-container { padding: 24px; }
    .welcome-card { background: #fff; border-radius: 2px; padding: 40px; text-align: center; margin-bottom: 24px; }
    .welcome-title { font-size: 24px; color: #1890ff; margin-bottom: 12px; }
    .welcome-desc { color: #666; line-height: 1.8; font-size: 14px; }
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; }
    .stat-card { background: #fff; border-radius: 2px; padding: 24px; text-align: center; }
    .stat-icon { font-size: 40px; margin-bottom: 12px; }
    .stat-value { font-size: 28px; font-weight: 600; color: #1890ff; }
    .stat-label { font-size: 14px; color: #666; margin-top: 8px; }
    .stat-card.green .stat-value { color: #52c41a; }
    .stat-card.orange .stat-value { color: #faad14; }
    .stat-card.red .stat-value { color: #ff4d4f; }
    
    /* 快捷入口 */
    .quick-entry { background: #fff; border-radius: 2px; padding: 24px; }
    .quick-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .quick-item { padding: 16px; border: 1px solid #f0f0f0; border-radius: 2px; cursor: pointer; text-align: center; transition: all 0.2s; }
    .quick-item:hover { border-color: #1890ff; color: #1890ff; }
    .quick-item-icon { font-size: 24px; margin-bottom: 8px; }
    .quick-item-label { font-size: 14px; }
    
    /* 操作按钮 */
    .action-btn { color: #1890ff; cursor: pointer; font-size: 14px; margin-right: 8px; }
    .action-btn:hover { color: #40a9ff; }
    .action-btn.danger { color: #ff4d4f; }
    .action-btn.danger:hover { color: #ff7875; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // 菜单配置（与PRD目录一致）
    const menuConfig = [
      { key: 'home', label: '首页', icon: '🏠' },
      {
        key: 'basic',
        label: '基础数据管理',
        icon: '📦',
        children: [
          { key: 'basic-cooperation', label: '合作单位管理' },
          { key: 'basic-project', label: '项目管理' },
          { key: 'basic-budget', label: '预算管理' },
          { key: 'basic-dictionary', label: '数据字典管理' },
        ]
      },
      {
        key: 'bidding',
        label: '招标管理',
        icon: '📋',
        children: [
          { key: 'bidding-document', label: '招标文件' },
          { key: 'bidding-clarification', label: '答疑补遗文件' },
          { key: 'bidding-registration', label: '报名管理' },
          { key: 'bidding-evaluation', label: '评标结果' },
          { key: 'bidding-award', label: '中标通知' },
          { key: 'bidding-guarantee', label: '中标担保办理通知' },
          { key: 'bidding-deposit', label: '投标保证金退还' },
        ]
      },
      { key: 'template', label: '合同范本管理', icon: '📄' },
      {
        key: 'draft-approval',
        label: '合同起草与审批',
        icon: '📝',
        children: [
          { key: 'draft', label: '合同起草' },
          { key: 'approval', label: '合同审批' },
        ]
      },
      {
        key: 'change',
        label: '合同变更管理',
        icon: '🔄',
        children: [
          { key: 'change-contract', label: '合同变更' },
          { key: 'change-renewal', label: '合同续签' },
          { key: 'change-extension', label: '合同顺延' },
          { key: 'change-status', label: '合同状态调整' },
          { key: 'change-budget', label: '预算变更' },
        ]
      },
      {
        key: 'receipt',
        label: '收款管理',
        icon: '💰',
        children: [
          { key: 'receipt-plan', label: '收款计划' },
          { key: 'receipt-invoice', label: '合同开票' },
          { key: 'receipt-collection', label: '合同收款' },
        ]
      },
      {
        key: 'payment',
        label: '付款管理',
        icon: '💸',
        children: [
          { key: 'payment-plan', label: '付款计划' },
          { key: 'payment-execution', label: '合同付款' },
        ]
      },
      {
        key: 'deposit',
        label: '履约保证金管理',
        icon: '🔒',
        children: [
          { key: 'deposit-collection', label: '履约保证金收取' },
          { key: 'deposit-refund', label: '履约保证金退还' },
        ]
      },
      {
        key: 'warning',
        label: '预警与消息通知',
        icon: '🔔',
        children: [
          { key: 'warning-rules', label: '预警规则配置' },
          { key: 'warning-notifications', label: '消息通知中心' },
          { key: 'warning-dashboard', label: '首页预警看板' },
        ]
      },
      { key: 'report', label: '统计报表', icon: '📊' },
      { key: 'system', label: '系统管理与配置', icon: '⚙️' },
    ];

    // 状态映射
    const statusMap = {
      'draft': { label: '草稿', class: 'tag-default' },
      'pending': { label: '审批中', class: 'tag-processing' },
      'approved': { label: '已完成', class: 'tag-success' },
      'rejected': { label: '已驳回', class: 'tag-error' },
      'terminated': { label: '已终止', class: 'tag-warning' },
    };

    // Mock数据生成
    const generateMockData = (type, count = 15) => {
      const types = ['采购合同', '销售合同', '服务合同', '工程合同'];
      const depts = ['财务部', '采购部', '项目部', '市场部', '综合部'];
      const handlers = ['张三', '李四', '王五', '赵六', '钱七'];
      const statusKeys = ['draft', 'pending', 'approved', 'rejected', 'terminated'];
      
      const data = [];
      for (let i = 1; i <= count; i++) {
        const statusKey = statusKeys[Math.floor(Math.random() * statusKeys.length)];
        data.push({
          id: `${type.substring(0, 2).toUpperCase()}-${String(i).padStart(4, '0')}`,
          name: `${type}项目${i}号`,
          type: types[Math.floor(Math.random() * types.length)],
          status: statusKey,
          amount: Math.floor(Math.random() * 10000000) + 100000,
          dept: depts[Math.floor(Math.random() * depts.length)],
          handler: handlers[Math.floor(Math.random() * handlers.length)],
          createDate: `2026-0${Math.floor(Math.random() * 9) + 1}-${String(Math.floor(Math.random() * 28) + 1).padStart(2, '0')}`,
        });
      }
      return data;
    };

    // 各模块Mock数据
    const mockDataMap = {
      'basic-cooperation': generateMockData('合作单位', 20),
      'basic-project': generateMockData('项目', 18),
      'basic-budget': generateMockData('预算', 12),
      'basic-dictionary': generateMockData('数据字典', 8),
      'bidding-document': generateMockData('招标文件', 25),
      'bidding-clarification': generateMockData('答疑补遗', 15),
      'bidding-registration': generateMockData('报名', 30),
      'bidding-evaluation': generateMockData('评标', 20),
      'bidding-award': generateMockData('中标通知', 12),
      'bidding-guarantee': generateMockData('担保通知', 10),
      'bidding-deposit': generateMockData('保证金退还', 15),
      'template': generateMockData('范本', 35),
      'draft': generateMockData('合同起草', 28),
      'approval': generateMockData('合同审批', 22),
      'change-contract': generateMockData('合同变更', 15),
      'change-renewal': generateMockData('合同续签', 10),
      'change-extension': generateMockData('合同顺延', 8),
      'change-status': generateMockData('状态调整', 12),
      'change-budget': generateMockData('预算变更', 14),
      'receipt-plan': generateMockData('收款计划', 20),
      'receipt-invoice': generateMockData('合同开票', 18),
      'receipt-collection': generateMockData('合同收款', 25),
      'payment-plan': generateMockData('付款计划', 20),
      'payment-execution': generateMockData('合同付款', 15),
      'deposit-collection': generateMockData('保证金收取', 12),
      'deposit-refund': generateMockData('保证金退还', 10),
      'warning-rules': generateMockData('预警规则', 15),
      'warning-notifications': generateMockData('消息通知', 30),
      'warning-dashboard': generateMockData('预警看板', 20),
      'report': generateMockData('统计报表', 10),
      'system': generateMockData('系统配置', 12),
    };

    // 列表页组件
    const ListPage = ({ title, data }) => {
      const [currentPage, setCurrentPage] = React.useState(1);
      const [pageSize, setPageSize] = React.useState(10);
      const [searchText, setSearchText] = React.useState('');
      const [selectedRows, setSelectedRows] = React.useState([]);
      const [activeTab, setActiveTab] = React.useState('all');
      const [filterType, setFilterType] = React.useState('');
      const [filterStatus, setFilterStatus] = React.useState('');
      
      // 筛选数据
      const filteredData = data.filter(item => {
        if (searchText && !item.name.includes(searchText) && !item.id.includes(searchText)) return false;
        if (filterType && item.type !== filterType) return false;
        if (filterStatus && item.status !== filterStatus) return false;
        if (activeTab !== 'all' && item.status !== activeTab) return false;
        return true;
      });
      
      // 分页
      const totalPages = Math.ceil(filteredData.length / pageSize);
      const pageData = filteredData.slice((currentPage - 1) * pageSize, currentPage * pageSize);
      
      // 统计各状态数量
      const statusCounts = {
        all: filteredData.length,
        draft: filteredData.filter(d => d.status === 'draft').length,
        pending: filteredData.filter(d => d.status === 'pending').length,
        approved: filteredData.filter(d => d.status === 'approved').length,
        rejected: filteredData.filter(d => d.status === 'rejected').length,
      };
      
      // 全选/取消全选
      const handleSelectAll = (e) => {
        if (e.target.checked) {
          setSelectedRows(pageData.map(d => d.id));
        } else {
          setSelectedRows([]);
        }
      };
      
      // 单选
      const handleSelectRow = (id) => {
        if (selectedRows.includes(id)) {
          setSelectedRows(selectedRows.filter(r => r !== id));
        } else {
          setSelectedRows([...selectedRows, id]);
        }
      };

      return (
        <div className="list-container">
          {/* Tab区域 */}
          <div className="tabs-area">
            <div className="tabs">
              <div className={`tab-item ${activeTab === 'all' ? 'active' : ''}`} onClick={() => setActiveTab('all')}>
                全部 ({statusCounts.all})
              </div>
              <div className={`tab-item ${activeTab === 'draft' ? 'active' : ''}`} onClick={() => setActiveTab('draft')}>
                草稿 ({statusCounts.draft})
              </div>
              <div className={`tab-item ${activeTab === 'pending' ? 'active' : ''}`} onClick={() => setActiveTab('pending')}>
                审批中 ({statusCounts.pending})
              </div>
              <div className={`tab-item ${activeTab === 'approved' ? 'active' : ''}`} onClick={() => setActiveTab('approved')}>
                已完成 ({statusCounts.approved})
              </div>
            </div>
          </div>
          
          {/* 工具栏 */}
          <div className="toolbar">
            <div className="toolbar-left">
              <input 
                type="text" 
                className="search-input"
                placeholder="搜索编号/名称..."
                value={searchText}
                onChange={(e) => setSearchText(e.target.value)}
              />
              <button className="btn">筛选</button>
              <button className="btn" onClick={() => { setSearchText(''); setFilterType(''); setFilterStatus(''); }}>重置</button>
            </div>
            <div className="toolbar-right">
              <button className="btn btn-primary">+ 新建</button>
              <button className="btn btn-danger" disabled={selectedRows.length === 0}>删除 ({selectedRows.length})</button>
            </div>
          </div>
          
          {/* 筛选区域 */}
          <div className="filter-area">
            <div className="filter-row">
              <div className="filter-item">
                <span className="filter-label">合同类型：</span>
                <select className="filter-select" value={filterType} onChange={(e) => setFilterType(e.target.value)}>
                  <option value="">全部类型</option>
                  <option value="采购合同">采购合同</option>
                  <option value="销售合同">销售合同</option>
                  <option value="服务合同">服务合同</option>
                  <option value="工程合同">工程合同</option>
                </select>
              </div>
              <div className="filter-item">
                <span className="filter-label">单据状态：</span>
                <select className="filter-select" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                  <option value="">全部状态</option>
                  <option value="draft">草稿</option>
                  <option value="pending">审批中</option>
                  <option value="approved">已完成</option>
                  <option value="rejected">已驳回</option>
                  <option value="terminated">已终止</option>
                </select>
              </div>
              <div className="filter-item">
                <span className="filter-label">创建日期：</span>
                <input type="date" className="filter-date" />
              </div>
            </div>
          </div>
          
          {/* 表格 */}
          <div className="table-wrapper">
            <table className="ant-table">
              <thead className="ant-table-thead">
                <tr>
                  <th style={{ width: 40 }}>
                    <input type="checkbox" className="checkbox" onChange={handleSelectAll} />
                  </th>
                  <th>编号</th>
                  <th>名称</th>
                  <th>类型</th>
                  <th>金额(元)</th>
                  <th>部门</th>
                  <th>经办人</th>
                  <th>创建日期</th>
                  <th>单据状态</th>
                  <th style={{ width: 120 }}>操作</th>
                </tr>
              </thead>
              <tbody className="ant-table-tbody">
                {pageData.map(item => (
                  <tr key={item.id} className={selectedRows.includes(item.id) ? 'selected' : ''}>
                    <td>
                      <input 
                        type="checkbox" 
                        className="checkbox"
                        checked={selectedRows.includes(item.id)}
                        onChange={() => handleSelectRow(item.id)}
                      />
                    </td>
                    <td>{item.id}</td>
                    <td>{item.name}</td>
                    <td>{item.type}</td>
                    <td style={{ textAlign: 'right' }}>{item.amount.toLocaleString()}</td>
                    <td>{item.dept}</td>
                    <td>{item.handler}</td>
                    <td>{item.createDate}</td>
                    <td>
                      <span className={`tag ${statusMap[item.status].class}`}>
                        {statusMap[item.status].label}
                      </span>
                    </td>
                    <td>
                      <span className="action-btn">查看</span>
                      <span className="action-btn">编辑</span>
                      <span className="action-btn danger">删除</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          
          {/* 分页 */}
          <div className="pagination-area">
            <span className="pagination-total">共 {filteredData.length} 条</span>
            <select className="page-size-select" value={pageSize} onChange={(e) => { setPageSize(Number(e.target.value)); setCurrentPage(1); }}>
              <option value="10">10条/页</option>
              <option value="20">20条/页</option>
              <option value="50">50条/页</option>
            </select>
            <div className="pagination-btns">
              <button className="page-btn" disabled={currentPage === 1} onClick={() => setCurrentPage(1)}>«</button>
              <button className="page-btn" disabled={currentPage === 1} onClick={() => setCurrentPage(currentPage - 1)}>‹</button>
              <button className="page-btn active">{currentPage}</button>
              <button className="page-btn" disabled={currentPage === totalPages} onClick={() => setCurrentPage(currentPage + 1)}>›</button>
              <button className="page-btn" disabled={currentPage === totalPages} onClick={() => setCurrentPage(totalPages)}>»</button>
            </div>
          </div>
        </div>
      );
    };

    // 首页组件
    const HomePage = () => (
      <div className="home-container">
        <div className="welcome-card">
          <div className="welcome-title">🎉 合同管理系统 Demo</div>
          <div className="welcome-desc">
            本系统覆盖合同全生命周期管理，实现从招标到归档的全流程数字化管控。<br/>
            支持合同起草、审批、变更、收付款、履约保证金等核心业务管理。
          </div>
        </div>
        
        <div className="stats-row">
          <div className="stat-card">
            <div className="stat-icon">📋</div>
            <div className="stat-value">128</div>
            <div className="stat-label">合同总数</div>
          </div>
          <div className="stat-card orange">
            <div className="stat-icon">⏳</div>
            <div className="stat-value">56</div>
            <div className="stat-label">待审批</div>
          </div>
          <div className="stat-card green">
            <div className="stat-icon">💰</div>
            <div className="stat-value">32</div>
            <div className="stat-label">本月收款</div>
          </div>
          <div className="stat-card red">
            <div className="stat-icon">⚠️</div>
            <div className="stat-value">8</div>
            <div className="stat-label">预警事项</div>
          </div>
        </div>
        
        <div className="quick-entry">
          <div className="quick-title">快捷入口</div>
          <div className="quick-grid">
            <div className="quick-item">
              <div className="quick-item-icon">📝</div>
              <div className="quick-item-label">新建合同</div>
            </div>
            <div className="quick-item">
              <div className="quick-item-icon">📋</div>
              <div className="quick-item-label">招标管理</div>
            </div>
            <div className="quick-item">
              <div className="quick-item-icon">💰</div>
              <div className="quick-item-label">收款管理</div>
            </div>
            <div className="quick-item">
              <div className="quick-item-icon">📊</div>
              <div className="quick-item-label">统计报表</div>
            </div>
          </div>
        </div>
      </div>
    );

    // 主应用组件
    const App = () => {
      const [collapsed, setCollapsed] = React.useState(false);
      const [activeKey, setActiveKey] = React.useState('home');
      const [expandedKeys, setExpandedKeys] = React.useState(['basic', 'bidding', 'draft-approval', 'change', 'receipt', 'payment', 'deposit', 'warning']);

      // 获取面包屑
      const getBreadcrumb = () => {
        if (activeKey === 'home') return ['首页'];
        for (const item of menuConfig) {
          if (item.key === activeKey) return ['首页', item.label];
          if (item.children) {
            for (const child of item.children) {
              if (child.key === activeKey) return ['首页', item.label, child.label];
            }
          }
        }
        return ['首页'];
      };

      // 获取页面标题
      const getPageTitle = () => {
        for (const item of menuConfig) {
          if (item.key === activeKey) return item.label;
          if (item.children) {
            for (const child of item.children) {
              if (child.key === activeKey) return child.label;
            }
          }
        }
        return '首页';
      };

      // 渲染菜单项
      const renderMenuItem = (item) => (
        <div
          key={item.key}
          className={`menu-item ${activeKey === item.key ? 'active' : ''} ${collapsed ? 'collapsed-item' : ''}`}
          onClick={() => setActiveKey(item.key)}
          title={collapsed ? item.label : ''}
        >
          <span className="menu-icon">{item.icon}</span>
          {!collapsed && <span>{item.label}</span>}
        </div>
      );

      // 渲染子菜单
      const renderSubmenu = (item) => {
        const isExpanded = expandedKeys.includes(item.key);
        return (
          <div key={item.key}>
            <div
              className="submenu-title"
              onClick={() => {
                if (collapsed) return;
                setExpandedKeys(isExpanded 
                  ? expandedKeys.filter(k => k !== item.key)
                  : [...expandedKeys, item.key]
                );
              }}
            >
              <span>
                <span className="menu-icon">{item.icon}</span>
                {!collapsed && <span style={{ marginLeft: 10 }}>{item.label}</span>}
              </span>
              {!collapsed && <span style={{ fontSize: 12 }}>{isExpanded ? '▼' : '▶'}</span>}
            </div>
            {isExpanded && !collapsed && (
              <div className="submenu-children">
                {item.children.map(child => renderMenuItem(child))}
              </div>
            )}
          </div>
        );
      };

      const breadcrumb = getBreadcrumb();

      return (
        <div className="layout">
          {/* 侧边栏 */}
          <div className={`sider ${collapsed ? 'collapsed' : ''}`}>
            <div className={`sider-header ${collapsed ? 'collapsed-header' : ''}`}>
              {collapsed ? 'CMS' : '合同管理系统'}
            </div>
            <div className="menu">
              {menuConfig.map(item => 
                item.children ? renderSubmenu(item) : renderMenuItem(item)
              )}
            </div>
          </div>

          {/* 主内容区 */}
          <div className="main">
            <div className="header">
              <div className="header-left">
                <span className="collapse-btn" onClick={() => setCollapsed(!collapsed)}>
                  {collapsed ? '▶' : '◀'}
                </span>
                <div className="breadcrumb">
                  {breadcrumb.map((item, index) => (
                    <React.Fragment key={index}>
                      <span>{item}</span>
                      {index < breadcrumb.length - 1 && <span className="breadcrumb-separator">/</span>}
                    </React.Fragment>
                  ))}
                </div>
              </div>
              <div className="header-right">
                <span>🔔</span>
                <div className="user-info">
                  <div className="user-avatar">管</div>
                  <span>管理员</span>
                </div>
              </div>
            </div>
            <div className="content">
              {activeKey === 'home' 
                ? <HomePage />
                : <ListPage title={getPageTitle()} data={mockDataMap[activeKey] || []} />
              }
            </div>
          </div>
        </div>
      );
    };

    // 渲染应用
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
