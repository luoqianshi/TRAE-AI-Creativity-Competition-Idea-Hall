<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日工作汇报 - 独立单文件版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
  background: #FAF8F3;
  color: #1F1F1F;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:root {
  --bg: #FAF8F3;
  --surface: #FFFFFF;
  --border: #E8E4DC;
  --fg: #1F1F1F;
  --muted: #6B6B6B;
  --subtle: #9A9A9A;
  --accent: #3D5A80;
  --accent-dim: #5C7A9F;
  --success: #7A9E7E;
  --warning: #C97B63;
  --risk: #B85C5C;
  --change: #9C6ADE;
  --shadow: 0 1px 3px rgba(31,31,31,0.04), 0 1px 2px rgba(31,31,31,0.06);
  --shadow-hover: 0 4px 12px rgba(31,31,31,0.08), 0 2px 6px rgba(31,31,31,0.06);
}

.app { display: flex; height: 100vh; overflow: hidden; }

.sidebar {
  width: 240px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 0;
  flex-shrink: 0;
}
.sidebar-brand {
  padding: 0 20px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}
.sidebar-brand h1 {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.02em;
}
.sidebar-brand p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
  font-family: 'JetBrains Mono', monospace;
}
.sidebar-nav { list-style: none; padding: 0 12px; flex: 1; }
.sidebar-nav li { margin-bottom: 2px; }
.sidebar-nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 6px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s ease;
  cursor: pointer;
}
.sidebar-nav a:hover { background: #F5F2EC; color: var(--fg); }
.sidebar-nav a.active { background: var(--accent); color: #fff; }
.sidebar-nav a.active svg { color: #fff; }
.sidebar-nav svg { width: 18px; height: 18px; stroke-width: 2; flex-shrink: 0; color: var(--muted); }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  flex-shrink: 0;
}
.topbar-left h2 { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; }
.topbar-left .date-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
.topbar-right { display: flex; gap: 8px; align-items: center; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  font-family: inherit;
}
.btn:hover { background: #F5F2EC; border-color: var(--subtle); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-danger { background: var(--risk); border-color: var(--risk); color: #fff; }
.btn-danger:hover { background: #A04E4E; }

.content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* 看板 */
.kanban-page { display: flex; flex-direction: column; height: 100%; }
.kanban-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.kanban-header h2 { font-family: 'Fraunces', Georgia, serif; font-size: 22px; }

/* 风险/节点/逾期条 */
.risk-alert-bar { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.risk-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 4px;
  border: 1px solid var(--risk);
  background: rgba(184,92,92,0.06);
  color: var(--risk);
  font-size: 12px;
  font-weight: 500;
}
.risk-pill svg { width: 14px; height: 14px; }

.milestone-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: rgba(201,123,99,0.08);
  border: 1px solid var(--warning);
  border-radius: 6px;
  margin-bottom: 10px;
}
.milestone-bar-label { font-size: 12px; font-weight: 600; color: var(--warning); }
.milestone-pill {
  font-size: 12px;
  padding: 4px 10px;
  background: #fff;
  border: 1px solid var(--warning);
  border-radius: 4px;
  color: var(--warning);
}
.milestone-pill strong { font-family: 'JetBrains Mono', monospace; }

.overdue-bar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: rgba(184,92,92,0.08);
  border: 1px solid var(--risk);
  border-radius: 6px;
  margin-bottom: 10px;
}
.overdue-bar-label { font-size: 12px; font-weight: 600; color: var(--risk); }
.overdue-pill {
  font-size: 12px;
  padding: 4px 10px;
  background: #fff;
  border: 1px solid var(--risk);
  border-radius: 4px;
  color: var(--risk);
}

/* 看板主体 */
.kanban-board { display: flex; gap: 16px; flex: 1; overflow-x: auto; padding-bottom: 8px; }
.kanban-col {
  width: 300px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: #F5F2EC;
  border-radius: 8px;
  padding: 12px;
  border: 1px solid var(--border);
}
.kanban-col-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.kanban-col-title { font-weight: 600; font-size: 13px; }
.kanban-col-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  background: var(--surface);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.col-empty { text-align: center; color: var(--subtle); font-size: 12px; padding: 20px 0; }

/* 卡片 */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
  transition: all 0.2s ease;
  cursor: pointer;
  position: relative;
}
.card:hover { box-shadow: var(--shadow-hover); border-color: var(--subtle); }
.card-risk { border-color: var(--risk); box-shadow: 0 0 0 1px rgba(184,92,92,0.15); }
.card-change { border-color: var(--change); }
.card-overdue { border-color: var(--risk); border-width: 2px; }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.card-project { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); font-weight: 500; background: rgba(61,90,128,0.08); padding: 2px 6px; border-radius: 4px; }
.card-status { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
.badge-change { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; background: rgba(156,106,222,0.12); color: var(--change); }

.tag-communicating { background: #F0E6D2; color: #8C7A5B; }
.tag-designing { background: #E2E8F0; color: var(--accent); }
.tag-material { background: #FEF3C7; color: #92400E; }
.tag-done { background: #E6F4EA; color: #1E7E34; }
.tag-pending { background: #F3E8FF; color: #7C3AED; }

.card-content { font-size: 13px; line-height: 1.6; color: var(--fg); word-break: break-word; }
.card-change-reason {
  margin-top: 6px;
  padding: 6px 8px;
  background: rgba(156,106,222,0.06);
  border-left: 2px solid var(--change);
  font-size: 12px;
  color: var(--change);
  border-radius: 0 4px 4px 0;
}
.card-deadline {
  margin-top: 6px;
  font-size: 12px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}
.deadline-overdue { color: var(--risk); font-weight: 600; }

.card-meta {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--subtle);
  font-family: 'JetBrains Mono', monospace;
}
.card-actions {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.card:hover .card-actions { opacity: 1; }
.card-actions button {
  padding: 4px 8px;
  font-size: 11px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
}
.card-actions button:hover { background: #F5F2EC; color: var(--fg); }

.add-card-btn {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--subtle);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.add-card-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(61,90,128,0.04); }

.fab {
  position: fixed;
  bottom: 28px;
  right: 28px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(61,90,128,0.35);
  transition: all 0.2s ease;
  z-index: 100;
}
.fab:hover { transform: scale(1.05); background: var(--accent-dim); }
.fab svg { width: 24px; height: 24px; }

/* 模态框 */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(31,31,31,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
}
.modal {
  background: var(--surface);
  border-radius: 8px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 60px rgba(31,31,31,0.15);
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-family: 'Fraunces', Georgia, serif; font-size: 18px; }
.modal-close {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 16px;
}
.modal-close:hover { background: #F5F2EC; color: var(--fg); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}

/* 表单 */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  font-size: 13px;
  font-family: inherit;
  transition: border-color 0.2s ease;
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(61,90,128,0.08);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.form-check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.form-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.form-check label { font-size: 13px; color: var(--fg); cursor: pointer; text-transform: none; letter-spacing: 0; font-weight: 400; margin: 0; }

/* 项目卡片 */
.project-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.project-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  box-shadow: var(--shadow);
  transition: all 0.2s ease;
  cursor: pointer;
}
.project-card:hover { box-shadow: var(--shadow-hover); border-color: var(--subtle); transform: translateY(-1px); }
.project-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.project-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); font-weight: 600; }
.project-name { font-size: 15px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
.project-type { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.project-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.project-milestone {
  margin-top: 10px;
  padding: 6px 10px;
  background: #F5F2EC;
  border-radius: 4px;
  font-size: 12px;
  color: var(--muted);
}
.project-milestone.ms-warning { background: rgba(201,123,99,0.12); color: var(--warning); }
.project-milestone strong { font-family: 'JetBrains Mono', monospace; }

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
}
.status-normal { background: var(--success); }
.status-warning { background: var(--warning); }
.status-stalled { background: var(--risk); }
.status-done { background: var(--subtle); }

/* 项目详情页 */
.pd-header {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 24px;
  margin-bottom: 16px;
}
.pd-header-row { display: flex; justify-content: space-between; align-items: flex-start; }
.pd-code { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent); font-weight: 600; }
.pd-name { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; margin: 4px 0; }
.pd-type { font-size: 13px; color: var(--muted); }
.pd-actions { display: flex; gap: 8px; }
.pd-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--muted);
}
.pd-meta strong { color: var(--fg); font-weight: 600; margin-right: 6px; }
.pd-milestone { color: var(--warning); }

.pd-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
}
.pd-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  margin-bottom: 16px;
}
.pd-section-title {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--fg);
}
.pd-timeline { min-height: 200px; }
.timeline-scroll { overflow-x: auto; }
.timeline-canvas { position: relative; min-width: 100%; }
.timeline-axis { display: flex; border-bottom: 1px solid var(--border); }
.timeline-day { border-right: 1px solid #F5F2EC; }
.timeline-date-tick { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--subtle); padding: 4px 2px; }
.timeline-events { position: relative; height: 140px; margin-top: 8px; }
.timeline-event { position: absolute; top: 20px; display: flex; flex-direction: column; align-items: center; }
.timeline-event-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 8px;
  font-weight: 700;
}
.timeline-event-label {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
  max-width: 80px;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pd-list { display: flex; flex-direction: column; gap: 10px; }
.change-item, .risk-item {
  background: #F5F2EC;
  border-radius: 4px;
  padding: 10px 12px;
  font-size: 12px;
  border-left: 3px solid var(--change);
}
.risk-item { border-left-color: var(--risk); }
.risk-item.risk-overdue { background: rgba(184,92,92,0.08); }
.change-date, .risk-date { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
.change-content, .risk-content { color: var(--fg); }
.change-reason { margin-top: 4px; color: var(--change); font-style: italic; }
.risk-deadline { margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }
.risk-deadline.overdue { color: var(--risk); font-weight: 600; }
.empty-mini { color: var(--subtle); font-size: 12px; padding: 16px 0; text-align: center; }

.pd-cards { max-height: 600px; overflow-y: auto; }
.pd-date-group { margin-bottom: 16px; }
.pd-date-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
.pd-card-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 8px 0;
  cursor: pointer;
  border-bottom: 1px solid #F5F2EC;
}
.pd-card-item:hover { background: #F5F2EC; }
.pd-card-content { font-size: 13px; flex: 1; }

/* 时间线 */
.timeline-list { max-width: 900px; }
.timeline-date-group { margin-bottom: 24px; }
.timeline-date-label {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.timeline-card {
  display: flex;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.timeline-card.tl-change { background: rgba(156,106,222,0.04); padding: 12px; border-radius: 4px; border-bottom: none; margin-bottom: 6px; }
.timeline-card.tl-overdue { background: rgba(184,92,92,0.04); padding: 12px; border-radius: 4px; border-bottom: none; margin-bottom: 6px; }
.timeline-time { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--subtle); width: 60px; flex-shrink: 0; text-align: right; padding-top: 2px; }
.timeline-content { flex: 1; }
.timeline-content .card-project { margin-bottom: 4px; display: inline-block; }
.timeline-content .card-content { font-size: 13px; }
.overdue-text { color: var(--risk); font-weight: 600; }

/* 周报 */
.weekly-milestone-alert {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: rgba(201,123,99,0.08);
  border: 1px solid var(--warning);
  border-radius: 6px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--warning);
  font-weight: 500;
}
.weekly-ms-pill {
  font-size: 12px;
  padding: 4px 10px;
  background: #fff;
  border: 1px solid var(--warning);
  border-radius: 4px;
  color: var(--warning);
  font-weight: 400;
}
.weekly-ms-pill strong { font-family: 'JetBrains Mono', monospace; }

.weekly-editor { display: flex; gap: 20px; height: calc(100vh - 240px); }
.weekly-input, .weekly-preview {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  overflow-y: auto;
}
.weekly-input textarea {
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  resize: none;
  outline: none;
  color: var(--fg);
}
.weekly-preview { font-size: 13px; line-height: 1.7; }
.weekly-preview h1 { font-family: 'Fraunces', serif; font-size: 22px; margin-bottom: 16px; border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
.weekly-preview h2 { font-family: 'Fraunces', serif; font-size: 18px; margin: 20px 0 10px; color: var(--accent); }
.weekly-preview h3 { font-size: 15px; font-weight: 600; margin: 14px 0 8px; }
.weekly-preview ul { margin-left: 20px; margin-bottom: 12px; }

.weekly-preview .md-table {

}
.weekly-preview .md-table th, .weekly-preview .md-table td {

}

.dashboard-card h3 { font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 600; margin-bottom: 16px; }

.top5-list { list-style: none; }

}
.top5-list li:last-child { border-bottom: none; }
.top5-rank { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: var(--accent); width: 24px; }
.ms-pill {

  padding: 4px 10px;
  border-radius: 4px;
  background: #F5F2EC;
  font-size: 12px;

}
.ms-pill.ms-warning { background: rgba(201,123,99,0.12); color: var(--warning); }
.ms-pill.ms-overdue { background: rgba(184,92,92,0.12); color: var(--risk); }

.filter-bar select, .filter-bar input {

.filter-bar input { min-width: 240px; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--subtle); }
.empty-state h4 { font-size: 15px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

.hidden { display: none !important; }

@media (max-width: 900px) {

}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    const data = JSON.parse(raw);
    // v1 兼容：如果项目缺 customerName，则补字段
    if (data.projects.length && !data.projects[0].customerName) {
      data.projects = data.projects.map(p => ({
        ...p,
        customerName: p.name || p.customerName || '未命名',
        country: p.country || '',
        projectType: p.projectType || '',
      }));
    }
    return data;
  }
  const data = { projects: defaultProjects, cards: defaultCards, settings: { reporter: '解高生' }, meta: { hasSeenSample: false } };
  saveData(data);
  return data;
}
function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
function getData() { return loadData(); }

// ==================== 工具 ====================
function formatDate(d) { const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseDate(s) { return new Date(s+'T00:00:00'); }
function todayStr() { return formatDate(new Date()); }
function addDays(s, n) { const d=parseDate(s); d.setDate(d.getDate()+n); return formatDate(d); }
function weekRange(s) { const d=parseDate(s); const mon=new Date(d); mon.setDate(d.getDate()-d.getDay()+1); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return { start:formatDate(mon), end:formatDate(sun) }; }
function daysBetween(a, b) { const ms = parseDate(b) - parseDate(a); return Math.round(ms / 86400000); }

function colLabel(t) { return { advance:'推进', resolve:'解决', deliver:'产出', tomorrow:'明天' }[t]||t; }
function workTypeLabel(t) { return { doc:'文档', design:'设计', communication:'沟通', onsite:'现场' }[t]||t; }
function statusTagLabel(t) { return { communicating:'对接信息', designing:'设计中', material:'物料下发中', done:'已完成', pending:'待验证' }[t]||t; }
function stageLabel(s) { return { presale:'售前', design:'设计', production:'生产', acceptance:'验收', rd:'研发迭代' }[s]||s; }
function statusLabel(s) { return { normal:'正常', warning:'预警', stalled:'停滞', done:'已完成' }[s]||s; }
function statusDotClass(s) { return 'status-'+s; }
function tagClass(t) { return 'tag-'+t; }
function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escapeMd(s) { return s.replace(/[\\*_`\[\]]/g, '\\$&'); }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function renderKanban() {
  const data = getData();
  const date = currentDate;
  document.getElementById('page-date').textContent = date + ' ' + ['周日','周一','周二','周三','周四','周五','周六'][parseDate(date).getDay()];

  // 临近节点
  const milestones = getUpcomingMilestones(data.projects, 7);
  const milestoneBar = document.getElementById('milestone-summary');
  milestoneBar.innerHTML = milestones.length === 0 ? '' : `
    <div class="milestone-bar">
      <span class="milestone-bar-label">⚑ 本周临近节点</span>
      ${milestones.map(p => `<span class="milestone-pill">${p.code} · ${p.keyMilestoneName} <strong>${daysBetween(todayStr(), p.keyMilestone)}</strong> 天后</span>`).join('')}
    </div>
  `;

  // 逾期风险
  const overdue = getOverdueRisks(data.cards);
  const overdueBar = document.getElementById('overdue-summary');
  overdueBar.innerHTML = overdue.length === 0 ? '' : `
    <div class="overdue-bar">
      <span class="overdue-bar-label">⏰ 逾期未解决</span>
      ${overdue.map(c => {
        const proj = data.projects.find(p => p.id === c.projectId);
        return `<span class="overdue-pill">${proj?proj.code:''} · ${escapeHtml(c.content.slice(0, 20))}… 已超 ${Math.abs(daysBetween(c.expectedResolveDate, todayStr()))} 天</span>`;
      }).join('')}
    </div>
  `;

  // 项目预警
  const riskProjects = data.projects.filter(p => p.status === 'warning' || p.status === 'stalled');
  const riskBar = document.getElementById('risk-alert-bar');
  riskBar.innerHTML = riskProjects.length === 0 ? '' : riskProjects.map(p =>
    `<div class="risk-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>${p.code} · ${p.customerName}（${p.country}）${statusLabel(p.status)}</div>`
  ).join('');

  // 4 列卡片
  ['advance','resolve','deliver','tomorrow'].forEach(col => {
    const cards = data.cards.filter(c => c.workDate === date && c.columnType === col);
    document.getElementById('count-' + col).textContent = cards.length;
    document.getElementById('col-' + col).innerHTML = cards.map(c => renderCardHTML(c, data.projects)).join('') || `<div class="col-empty">暂无</div>`;
  });

  bindCardEvents();
}

function renderCardHTML(card, projects) {
  const proj = projects.find(p => p.id === card.projectId);
  const projLabel = proj ? `${proj.code}` : '未知';
  const overdue = card.expectedResolveDate && parseDate(card.expectedResolveDate) < parseDate(todayStr()) && card.statusTag !== 'done';
  return `
    <div class="card ${card.isRisk?'card-risk':''} ${card.isChange?'card-change':''} ${overdue?'card-overdue':''}" data-id="${card.id}">
      <div class="card-top">
        <span class="card-project">${projLabel}</span>
        <div style="display:flex; gap:4px; align-items:center;">
          ${card.isChange?'<span class="badge-change">变更</span>':''}
          <span class="card-status ${tagClass(card.statusTag)}">${statusTagLabel(card.statusTag)}</span>
        </div>
      </div>
      <div class="card-content">${escapeHtml(card.content)}</div>
      ${card.changeReason ? `<div class="card-change-reason">↻ ${escapeHtml(card.changeReason)}</div>` : ''}
      ${card.expectedResolveDate ? `<div class="card-deadline ${overdue?'deadline-overdue':''}">⏱ 期望完成：${card.expectedResolveDate}</div>` : ''}
      <div class="card-meta">

      </div>
    </div>
  `;
}

// ==================== 临近节点 & 逾期算法 ====================
function getUpcomingMilestones(projects, days = 7) {
  const now = todayStr();
  return projects
    .filter(p => p.keyMilestone && p.keyMilestone >= now && daysBetween(now, p.keyMilestone) <= days)
    .sort((a, b) => a.keyMilestone.localeCompare(b.keyMilestone));
}
function getOverdueRisks(cards) {
  const now = todayStr();
  return cards.filter(c => c.expectedResolveDate && c.expectedResolveDate < now && c.statusTag !== 'done');
}

function saveCard() {
  const data = getData();
  const id = document.getElementById('card-id').value || uid();
  const workDate = document.getElementById('card-date').value || currentDate;
  const card = {
    id, workDate,
    projectId: document.getElementById('card-project').value,
    columnType: document.getElementById('card-column').value,
    workType: document.getElementById('card-worktype').value,
    statusTag: document.getElementById('card-statustag').value,
    content: document.getElementById('card-content').value.trim(),
    minutes: parseInt(document.getElementById('card-minutes').value || '0'),
    isRisk: document.getElementById('card-risk').checked,
    isChange: document.getElementById('card-change').checked,
    changeReason: document.getElementById('card-change-reason').value.trim(),
    expectedResolveDate: document.getElementById('card-deadline').value || undefined,
    createdAt: editingCardId ? (data.cards.find(c => c.id === editingCardId)?.createdAt || Date.now()) : Date.now(),
  };
  if (!card.content) { alert('请填写成果内容'); return; }
  const idx = data.cards.findIndex(c => c.id === id);
  if (idx >= 0) data.cards[idx] = card; else data.cards.push(card);
  saveData(data);
  closeCardEditor();
  rerenderAll();
}
function deleteCard(id) {
  if (!confirm('确定删除？')) return;
  const data = getData();
  data.cards = data.cards.filter(c => c.id !== id);
  saveData(data);
  closeCardEditor();
  rerenderAll();
}

// ==================== 项目台账 ====================
function renderProjects() {
  const data = getData();
  const search = (document.getElementById('proj-search')?.value || '').toLowerCase();
  const statusFilter = document.getElementById('proj-filter-status')?.value || '';
  const stageFilter = document.getElementById('proj-filter-stage')?.value || '';

  let projects = data.projects.filter(p => {
    if (search && !(p.code.toLowerCase().includes(search) || p.customerName.toLowerCase().includes(search) || p.projectType.toLowerCase().includes(search))) return false;
    if (statusFilter && p.status !== statusFilter) return false;
    if (stageFilter && p.stage !== stageFilter) return false;
    return true;
  });

  const active = projects.filter(p => p.status !== 'done');
  const archived = projects.filter(p => p.status === 'done');
  const grid = document.getElementById('project-grid');
  const renderCard = p => {
    const ms = p.keyMilestone ? daysBetween(todayStr(), p.keyMilestone) : null;
    const msClass = ms !== null && ms >= 0 && ms <= 7 ? 'ms-warning' : '';
    return `
      <div class="project-card" data-id="${p.id}">
        <div class="project-card-header">
          <span class="project-code">${p.code}</span>
          <span class="status-dot ${statusDotClass(p.status)}"></span>
        </div>
        <div class="project-name">${p.customerName}（${p.country}）</div>
        <div class="project-type">${p.projectType}</div>
        <div class="project-meta">
          <span>阶段：${stageLabel(p.stage)}</span>
          <span>状态：${statusLabel(p.status)}</span>
          ${p.orabsModel ? `<span>型号：${p.orabsModel}</span>` : ''}
        </div>
        ${p.keyMilestone ? `<div class="project-milestone ${msClass}">⚑ ${p.keyMilestoneName} · ${p.keyMilestone}${ms !== null ? ` · 距今 <strong>${ms}</strong> 天` : ''}</div>` : ''}
      </div>
    `;
  };
  if (active.length === 0 && archived.length === 0) {
    grid.innerHTML = `<div class="empty-state"><h4>暂无项目</h4><p>试试清空筛选或新建项目</p></div>`;
  } else {
    let html = '';
    if (active.length > 0) html += `<div style="grid-column:1/-1; font-size:13px; font-weight:600; color:var(--muted); margin-top:4px;">进行中（${active.length}）</div>` + active.map(renderCard).join('');
    if (archived.length > 0) html += `<div style="grid-column:1/-1; font-size:13px; font-weight:600; color:var(--muted); margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">归档（${archived.length}）</div>` + archived.map(renderCard).join('');
    grid.innerHTML = html;
  }
  document.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', () => {
      currentProjectId = card.dataset.id;
      showPage('projectDetail');
    });
  });
}

    id, code: document.getElementById('proj-code').value.trim(),
    customerName: document.getElementById('proj-customer').value.trim(),

function deleteProject() {
  const id = document.getElementById('proj-id').value;
  if (!id) return;
  const data = getData();
  if (data.cards.some(c => c.projectId === id)) {
    if (!confirm('该项目下有工作卡片，删除项目将一并删除这些卡片。确定继续？')) return;
    data.cards = data.cards.filter(c => c.projectId !== id);
  }
  data.projects = data.projects.filter(p => p.id !== id);
  saveData(data);
  closeProjectEditor();
  renderProjects();
  if (currentPage === 'kanban') renderKanban();
}

        <div class="risk-item ${overdue?'risk-overdue':''}">
          <div class="risk-date">${c.workDate} · ${workTypeLabel(c.workType)}</div>
          <div class="risk-content">${escapeHtml(c.content)}</div>
          ${c.expectedResolveDate ? `<div class="risk-deadline ${overdue?'overdue':''}">⏱ 期望：${c.expectedResolveDate}${overdue ? '（已逾期）' : ''}</div>` : ''}
        </div>

  // 全部卡片
  const cardList = document.getElementById('pd-cards');
  const groups = {};
  cards.forEach(c => { (groups[c.workDate] = groups[c.workDate] || []).push(c); });
  cardList.innerHTML = Object.keys(groups).sort((a,b) => b.localeCompare(a)).map(date => `
    <div class="pd-date-group">
      <div class="pd-date-label">${date} ${['周日','周一','周二','周三','周四','周五','周六'][parseDate(date).getDay()]}</div>
      ${groups[date].map(c => `
        <div class="pd-card-item" data-id="${c.id}">
          <span class="card-status ${tagClass(c.statusTag)}">${statusTagLabel(c.statusTag)}</span>
          <div class="pd-card-content">${escapeHtml(c.content)}</div>
        </div>
      `).join('')}
    </div>
  `).join('');

  document.querySelectorAll('.pd-card-item').forEach(el => {
    el.addEventListener('click', () => openCardEditor(el.dataset.id));
  });
}

function renderProjectTimeline(proj, cards) {
  const container = document.getElementById('pd-timeline');
  if (cards.length === 0 && !proj.keyMilestone) {
    container.innerHTML = `<div class="empty-mini">暂无时间流记录</div>`;
    return;
  }
  // 取项目时间范围
  const dates = cards.map(c => c.workDate);
  if (proj.keyMilestone) dates.push(proj.keyMilestone);
  if (dates.length === 0) { container.innerHTML = `<div class="empty-mini">暂无时间流记录</div>`; return; }
  const minDate = dates.reduce((a, b) => a < b ? a : b);
  const maxDate = dates.reduce((a, b) => a > b ? a : b);
  // 横轴日期
  const days = [];
  let cur = minDate;
  while (cur <= maxDate) { days.push(cur); cur = addDays(cur, 1); }

  // 事件点
  const events = cards.map(c => ({ date: c.workDate, type: c.isChange ? 'change' : (c.isRisk ? 'risk' : 'card'), content: c.content, id: c.id }));
  if (proj.keyMilestone) events.push({ date: proj.keyMilestone, type: 'milestone', content: proj.keyMilestoneName || '关键节点' });

  const dayWidth = Math.max(40, Math.min(80, 600 / days.length));
  const width = days.length * dayWidth;

  container.innerHTML = `
    <div class="timeline-scroll">
      <div class="timeline-canvas" style="width:${width}px;">
        <div class="timeline-axis">
          ${days.map(d => {
            const showLabel = d.endsWith('-01') || d === days[0] || d === days[days.length-1];
            return `<div class="timeline-day" style="width:${dayWidth}px;"><div class="timeline-date-tick">${showLabel ? d.slice(5) : ''}</div></div>`;
          }).join('')}
        </div>
        <div class="timeline-events">
          ${events.map(e => {
            const offset = days.indexOf(e.date) * dayWidth + dayWidth/2;
            const color = e.type === 'milestone' ? 'var(--warning)' : e.type === 'change' ? 'var(--change)' : e.type === 'risk' ? 'var(--risk)' : 'var(--accent)';
            const shape = e.type === 'milestone' ? '◆' : e.type === 'change' ? '▲' : e.type === 'risk' ? '●' : '●';
            const size = e.type === 'milestone' ? 16 : 10;
            return `<div class="timeline-event" style="left:${offset}px;" title="${e.date}: ${escapeHtml(e.content)}"><div class="timeline-event-dot" style="background:${color}; width:${size}px; height:${size}px;">${shape}</div><div class="timeline-event-label">${e.type === 'milestone' ? e.content : e.content.slice(0, 8) + (e.content.length > 8 ? '…' : '')}</div></div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}

function renderWeekly() {
  const data = getData();
  const reporter = document.getElementById('weekly-reporter')?.value || '解高生';
  const rangeType = document.getElementById('weekly-range')?.value || 'week';
  let start, end = currentDate;
  if (rangeType === 'day') { start = currentDate; }
  else if (rangeType === '3days') { start = addDays(currentDate, -2); }
  else if (rangeType === 'week') { const r = weekRange(currentDate); start = r.start; end = r.end; }
  else if (rangeType === '2weeks') { start = addDays(currentDate, -13); }
  else if (rangeType === 'month') { const d = parseDate(currentDate); start = formatDate(new Date(d.getFullYear(), d.getMonth(), 1)); end = formatDate(new Date(d.getFullYear(), d.getMonth()+1, 0)); }

  const cards = data.cards.filter(c => c.workDate >= start && c.workDate <= end);
  const md = buildWeeklyMarkdown(start, end, cards, data.projects, reporter);
  document.getElementById('weekly-text').value = md;
  document.getElementById('weekly-preview').innerHTML = markdownToHtml(md);
  document.getElementById('weekly-range-label').textContent = `${start} ~ ${end}`;

  // 临近节点提示
  const ms = getUpcomingMilestones(data.projects, 7);
  const msAlert = document.getElementById('weekly-milestone-alert');
  msAlert.innerHTML = ms.length === 0 ? '' : `
    <div class="weekly-milestone-alert">
      <span>⚑</span> 本周临近节点：
      ${ms.map(p => `<span class="weekly-ms-pill">${p.code} · ${p.keyMilestoneName} <strong>${daysBetween(todayStr(), p.keyMilestone)}</strong> 天后</span>`).join('')}
    </div>
  `;
}

function buildWeeklyMarkdown(start, end, cards, projects, reporter) {
  let md = `# 周报（${start} ~ ${end}） 汇报人：${reporter}\n\n`;

  // 一、本周项目进度总结
  md += `## 一、本周项目进度总结\n\n`;
  md += `| 序号 | 项目编号 | 客户名称（国家/简称） | 项目类型/内容 | 当前进度关键节点 | 待跟进细节 |\n`;
  md += `|------|---------|----------------------|--------------|----------------|-----------|\n`;

  const projIds = [...new Set(cards.map(c => c.projectId))];
  if (projIds.length === 0) {
    md += `| - | - | - | - | 本周暂无记录 | - |\n`;
  } else {
    let idx = 1;
    projIds.forEach(pid => {
      const proj = projects.find(p => p.id === pid);
      if (!proj) return;
      const pcards = cards.filter(c => c.projectId === pid);
      const advanceText = pcards.filter(c => c.columnType === 'advance').map(c => c.content).join('；') || '—';
      const resolveText = pcards.filter(c => c.columnType === 'resolve').map(c => c.content).join('；') || '—';
      const deliverText = pcards.filter(c => c.columnType === 'deliver').map(c => c.content).join('；') || '—';
      const progress = [advanceText, resolveText, deliverText].filter(t => t !== '—').join('；') || '本周无成果记录';
      const followUp = pcards.filter(c => c.isRisk || c.isChange).map(c => c.content).join('；') || '—';
      md += `| ${idx} | ${proj.code} | ${proj.customerName}（${proj.country}） | ${proj.projectType} | ${progress.slice(0, 80)} | ${followUp.slice(0, 60)} |\n`;
      idx++;
    });
  }
  md += `\n`;

  // 二、待处理重点事项
  md += `## 二、待处理重点事项\n\n`;
  md += `| 序号 | 项目编号 | 客户名称 | 具体问题描述 | 当前行动/责任人 | 计划完成时间/依赖条件 |\n`;
  md += `|------|---------|---------|-------------|----------------|---------------------|\n`;

  const issues = cards.filter(c => c.isRisk || c.statusTag === 'pending');
  if (issues.length === 0) {
    md += `| - | - | - | 本周无 | - | - |\n`;
  } else {
    issues.forEach((c, i) => {
      const proj = projects.find(p => p.id === c.projectId);
      md += `| ${i+1} | ${proj?proj.code:'-'} | ${proj?proj.customerName:'-'} | ${escapeMd(c.content)} | ${c.isChange?`方案变更中`:`跟进中`} | ${c.expectedResolveDate || '尽快'} |\n`;
    });
  }
  md += `\n`;

  // 三、其他说明
  md += `## 三、其他说明（资源协调 / 风险提示）\n\n`;

  const changes = cards.filter(c => c.isChange);
  if (changes.length > 0) {
    md += `**方案变更**：\n`;
    changes.forEach(c => {
      const proj = projects.find(p => p.id === c.projectId);
      md += `- ${proj?proj.code:'-'}：${escapeMd(c.content)}${c.changeReason?'（原因：'+escapeMd(c.changeReason)+'）':''}\n`;
    });
    md += `\n`;
  }

  // 本周临近节点
  const ms = getUpcomingMilestones(projects, 7);
  if (ms.length > 0) {
    md += `**本周临近节点**：\n`;
    ms.forEach(p => {
      md += `- ${p.code} · ${p.keyMilestoneName}（${p.keyMilestone}，距今 ${daysBetween(todayStr(), p.keyMilestone)} 天）\n`;
    });
    md += `\n`;
  }

  // 资源协调
  const overdue = cards.filter(c => c.expectedResolveDate && parseDate(c.expectedResolveDate) < parseDate(todayStr()) && c.statusTag !== 'done');
  if (overdue.length > 0) {
    md += `**逾期未解决**：\n`;
    overdue.forEach(c => {
      const proj = projects.find(p => p.id === c.projectId);
      md += `- ${proj?proj.code:'-'}：${escapeMd(c.content)}（期望 ${c.expectedResolveDate}，已超 ${Math.abs(daysBetween(c.expectedResolveDate, todayStr()))} 天）\n`;
    });
    md += `\n`;
  }

  if (changes.length === 0 && ms.length === 0 && overdue.length === 0) {
    md += `- 本周运行平稳，无重大变更、节点或逾期事项。\n`;
  }

  return md;
}

function markdownToHtml(md) {
  let html = md
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
    .replace(/\n/gim, '<br>');
  // 简单表格转换
  const lines = md.split('\n');
  let inTable = false;
  let tableHtml = '';
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('|') && lines[i+1] && lines[i+1].startsWith('|---')) {
      inTable = true;
      const headers = line.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
      tableHtml = `<table class="md-table"><thead><tr>${headers}</tr></thead><tbody>`;
      i++;
      continue;
    }
    if (inTable && line.startsWith('|')) {
      const cells = line.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
      tableHtml += `<tr>${cells}</tr>`;
      continue;
    }
    if (inTable && !line.startsWith('|')) {
      inTable = false;
      out.push(tableHtml + '</tbody></table>');
      tableHtml = '';
    }
    out.push(line);
  }
  if (inTable) out.push(tableHtml + '</tbody></table>');
  let finalHtml = out.join('\n')
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
    .replace(/\n/gim, '<br>');
  return finalHtml;
}

function renderDashboard() {
  const data = getData();
  const end = currentDate;
  const start = addDays(end, -6);
  const cards = data.cards.filter(c => c.workDate >= start && c.workDate <= end);

  const counts = { advance:0, resolve:0, deliver:0, tomorrow:0 };
  cards.forEach(c => counts[c.columnType]++);
  const max = Math.max(1, counts.advance, counts.resolve, counts.deliver, counts.tomorrow);
  const colors = { advance:'var(--accent)', resolve:'var(--success)', deliver:'var(--warning)', tomorrow:'var(--subtle)' };
  document.getElementById('chart-bar').innerHTML = `<div style="display:flex; gap:20px; align-items:flex-end; justify-content:center; height:100%;">${['advance','resolve','deliver','tomorrow'].map(col => {
    const h = Math.round((counts[col]/max)*100);
    return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="width:40px; height:120px; background:#F5F2EC; border-radius:4px; position:relative; overflow:hidden;">
        <div style="position:absolute; bottom:0; left:0; right:0; height:${h}%; background:${colors[col]}; border-radius:4px;"></div>
      </div>
      <span style="font-size:11px; color:var(--muted);">${colLabel(col)}</span>
      <span style="font-family:monospace; font-size:14px; font-weight:600;">${counts[col]}</span>
    </div>`;
  }).join('')}</div>`;

  const top5 = [...cards].sort((a,b) => (b.isRisk?1:0)-(a.isRisk?1:0) || (b.statusTag==='done'?1:0)-(a.statusTag==='done'?1:0)).slice(0,5);

  // 节点倒计时
  const ms = data.projects.filter(p => p.keyMilestone).sort((a,b) => a.keyMilestone.localeCompare(b.keyMilestone));

}
