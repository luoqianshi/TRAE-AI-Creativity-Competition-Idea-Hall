<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能数学学习软件</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>智能数学学习软件</h1>
            <p>根据年级和成绩智能生成数学题目</p>
        </header>

        <nav class="main-nav">
            <button class="nav-btn active" onclick="switchMode('practice')">练习模式</button>
            <button class="nav-btn" onclick="switchMode('test')">测试模式</button>
            <button class="nav-btn" onclick="switchMode('wrong')">错题本</button>
            <button class="nav-btn" onclick="switchMode('analysis')">成绩分析</button>
        </nav>

        <div class="settings-panel">
            <div class="setting-item">
                <label>年级：</label>
                <select id="grade-select" onchange="updateDifficultyOptions()">
                    <option value="1">小学一年级</option>
                    <option value="2">小学二年级</option>
                    <option value="3">小学三年级</option>
                    <option value="4">小学四年级</option>
                    <option value="5">小学五年级</option>
                    <option value="6">小学六年级</option>
                    <option value="7">初中一年级</option>
                    <option value="8">初中二年级</option>
                    <option value="9">初中三年级</option>
                </select>
            </div>
            <div class="setting-item">
                <label>难度：</label>
                <select id="difficulty-select">
                    <option value="easy">简单</option>
                    <option value="medium" selected>中等</option>
                    <option value="hard">困难</option>
                </select>
            </div>
            <div class="setting-item">
                <label>题目数量：</label>
                <input type="number" id="question-count" value="10" min="1" max="50">
            </div>
            <div class="setting-item">
                <label>题目类型：</label>
                <select id="question-type">
                    <option value="all">全部类型</option>
                    <option value="choice">选择题</option>
                    <option value="fill">填空题</option>
                    <option value="calculate">计算题</option>
                    <option value="application">应用题</option>
                </select>
            </div>
        </div>

        <div id="practice-mode" class="mode-panel active">
            <div class="mode-header">
                <h2>练习模式</h2>
                <p>按正确率自动调整难度，适合日常练习</p>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="practice-progress"></div>
                <span id="practice-progress-text">0/10</span>
            </div>
            <div id="practice-question" class="question-container"></div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="generatePracticeQuestions()">开始练习</button>
                <button class="btn btn-secondary" onclick="nextPracticeQuestion()">下一题</button>
                <button class="btn btn-secondary" onclick="checkPracticeAnswer()">提交答案</button>
            </div>
            <div id="practice-feedback" class="feedback"></div>
        </div>

        <div id="test-mode" class="mode-panel">
            <div class="mode-header">
                <h2>测试模式</h2>
                <p>限时答题，模拟考试环境</p>
            </div>
            <div class="timer-display">
                <span class="timer-label">剩余时间：</span>
                <span class="timer-value" id="test-timer">05:00</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="test-progress"></div>
                <span id="test-progress-text">0/10</span>
            </div>
            <div id="test-question" class="question-container"></div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="startTest()">开始测试</button>
                <button class="btn btn-secondary" onclick="nextTestQuestion()">下一题</button>
                <button class="btn btn-danger" onclick="submitTest()">提交试卷</button>
            </div>
            <div id="test-result" class="result-panel"></div>
        </div>

        <div id="wrong-mode" class="mode-panel">
            <div class="mode-header">
                <h2>错题本</h2>
                <p>复习做错的题目，巩固知识</p>
            </div>
            <div id="wrong-list" class="wrong-list"></div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="reviewWrongQuestions()">开始复习</button>
                <button class="btn btn-danger" onclick="clearWrongQuestions()">清空错题</button>
            </div>
        </div>

        <div id="analysis-mode" class="mode-panel">
            <div class="mode-header">
                <h2>成绩分析</h2>
                <p>查看学习进度和统计数据</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="total-questions">0</div>
                    <div class="stat-label">总做题数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="correct-rate">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="avg-score">0</div>
                    <div class="stat-label">平均分数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="wrong-count">0</div>
                    <div class="stat-label">错题数</div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="progress-chart"></canvas>
            </div>
            <div class="history-list" id="history-list"></div>
        </div>

        <footer>
            <p>&copy; 2024 智能数学学习软件 | 助力学习，成就未来</p>
        </footer>
    </div>

    <script src="questionGenerator.js"></script>
    <script src="app.js"></script>
</body>
</html>
