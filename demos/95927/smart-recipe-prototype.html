<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 智能菜谱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }

        /* 顶部状态栏模拟 */
        .status-bar {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8E53 100%);
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 17px;
            font-weight: 600;
            position: relative;
            padding-top: env(safe-area-inset-top);
        }

        .status-bar .back-btn {
            position: absolute;
            left: 16px;
            font-size: 20px;
            cursor: pointer;
        }

        .status-bar .more-btn {
            position: absolute;
            right: 16px;
            font-size: 20px;
            cursor: pointer;
        }

        /* 头部区域 */
        .header {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8E53 100%);
            padding: 24px 20px 32px;
            color: white;
            text-align: center;
        }

        .header .logo {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
            font-weight: 300;
        }

        /* 主内容区 */
        .main-content {
            padding: 16px;
            padding-bottom: 40px;
        }

        /* 已选食材区 */
        .selected-section {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .selected-section .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .selected-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 32px;
        }

        .selected-tags .empty-tip {
            color: #999;
            font-size: 13px;
            padding: 4px 0;
        }

        .selected-tag {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8E53 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            animation: popIn 0.3s ease;
        }

        .selected-tag .remove {
            font-size: 16px;
            cursor: pointer;
            opacity: 0.9;
        }

        /* 手动输入 */
        .input-section {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-wrapper input {
            flex: 1;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #FF6B35;
        }

        .input-wrapper button {
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 食材分类 */
        .category-section {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .category-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: #f5f5f5;
            color: #666;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid transparent;
            user-select: none;
        }

        .tag:active {
            transform: scale(0.95);
        }

        .tag.selected {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8E53 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.35);
            border-color: transparent;
        }

        /* 生成按钮 */
        .generate-section {
            padding: 8px 0 16px;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #FF6B35 0%, #FF8E53 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .generate-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(255, 107, 53, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .generate-btn .sparkle {
            font-size: 20px;
        }

        /* AI 思考中 */
        .ai-thinking {
            display: none;
            background: white;
            border-radius: 16px;
            padding: 40px 20px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .ai-thinking.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .thinking-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .thinking-dots span {
            width: 12px;
            height: 12px;
            background: #FF6B35;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite both;
        }

        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        .ai-thinking p {
            color: #666;
            font-size: 15px;
        }

        .ai-thinking .thinking-detail {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
        }

        /* 结果区域 */
        .result-section {
            display: none;
        }

        .result-section.active {
            display: block;
            animation: fadeIn 0.6s ease;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .result-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #333;
        }

        .result-header .match-count {
            font-size: 13px;
            color: #FF6B35;
            font-weight: 600;
            background: rgba(255, 107, 53, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
        }

        /* 菜谱卡片 */
        .recipe-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: slideUp 0.5s ease both;
        }

        .recipe-card:nth-child(1) { animation-delay: 0.1s; }
        .recipe-card:nth-child(2) { animation-delay: 0.2s; }
        .recipe-card:nth-child(3) { animation-delay: 0.3s; }
        .recipe-card:nth-child(4) { animation-delay: 0.4s; }

        .recipe-card:active {
            transform: scale(0.98);
        }

        .recipe-header {
            display: flex;
            gap: 14px;
        }

        .recipe-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ffe8e0 0%, #ffd4c4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            flex-shrink: 0;
        }

        .recipe-info {
            flex: 1;
            min-width: 0;
        }

        .recipe-name {
            font-size: 17px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .recipe-tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        .recipe-tag.scene-quick { background: #e8f5e9; color: #4CAF50; }
        .recipe-tag.scene-meal { background: #fff3e0; color: #FF9800; }
        .recipe-tag.scene-diet { background: #e3f2fd; color: #2196F3; }
        .recipe-tag.scene-guest { background: #f3e5f5; color: #9C27B0; }

        .recipe-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #888;
        }

        .recipe-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .match-rate {
            margin-left: auto;
            color: #FF6B35;
            font-weight: 700;
            font-size: 14px;
        }

        /* 展开详情 */
        .recipe-detail {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed #eee;
        }

        .recipe-detail.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        .detail-section {
            margin-bottom: 14px;
        }

        .detail-section h4 {
            font-size: 14px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-section p, .detail-section li {
            font-size: 14px;
            color: #555;
            line-height: 1.8;
        }

        .detail-section ul {
            list-style: none;
            padding-left: 0;
        }

        .detail-section li {
            padding-left: 16px;
            position: relative;
        }

        .detail-section li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 6px;
            background: #FF6B35;
            border-radius: 50%;
        }

        .expand-hint {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            margin-top: 8px;
        }

        /* 动画 */
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 难度标识 */
        .difficulty-easy { color: #4CAF50; }
        .difficulty-medium { color: #FF9800; }
        .difficulty-hard { color: #f44336; }

        /* 底部安全区 */
        .safe-area-bottom {
            height: env(safe-area-inset-bottom);
        }
    </style>
</head>
<body>
    <!-- 模拟小程序状态栏 -->
    <div class="status-bar">
        <span class="back-btn">&#8249;</span>
        <span>AI 智能菜谱</span>
        <span class="more-btn">&#8942;</span>
    </div>

    <!-- 头部 -->
    <div class="header">
        <div class="logo">&#x1F373;</div>
        <h1>AI 智能菜谱</h1>
        <p>输入食材，AI 为你创意配餐</p>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <!-- 已选食材 -->
        <div class="selected-section">
            <div class="section-title">&#x1F4CB; 已选食材</div>
            <div class="selected-tags" id="selectedTags">
                <span class="empty-tip">请选择下方食材或手动输入</span>
            </div>
        </div>

        <!-- 手动输入 -->
        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="customInput" placeholder="输入其他食材，如：西兰花、鸡翅..." maxlength="20">
                <button onclick="addCustomIngredient()">添加</button>
            </div>
        </div>

        <!-- 食材分类 -->
        <div class="category-section">
            <div class="category-title">&#x1F345; 蔬菜类</div>
            <div class="category-tags" data-category="vegetable">
                <span class="tag" data-name="番茄">番茄</span>
                <span class="tag" data-name="土豆">土豆</span>
                <span class="tag" data-name="青椒">青椒</span>
                <span class="tag" data-name="黄瓜">黄瓜</span>
                <span class="tag" data-name="茄子">茄子</span>
                <span class="tag" data-name="白菜">白菜</span>
                <span class="tag" data-name="胡萝卜">胡萝卜</span>
                <span class="tag" data-name="洋葱">洋葱</span>
            </div>
        </div>

        <div class="category-section">
            <div class="category-title">&#x1F357; 肉类</div>
            <div class="category-tags" data-category="meat">
                <span class="tag" data-name="猪肉">猪肉</span>
                <span class="tag" data-name="牛肉">牛肉</span>
                <span class="tag" data-name="鸡肉">鸡肉</span>
                <span class="tag" data-name="鸡蛋">鸡蛋</span>
                <span class="tag" data-name="火腿">火腿</span>
                <span class="tag" data-name="排骨">排骨</span>
            </div>
        </div>

        <div class="category-section">
            <div class="category-title">&#x1F41F; 海鲜</div>
            <div class="category-tags" data-category="seafood">
                <span class="tag" data-name="虾">虾</span>
                <span class="tag" data-name="鱼">鱼</span>
                <span class="tag" data-name="蟹">蟹</span>
                <span class="tag" data-name="鱿鱼">鱿鱼</span>
                <span class="tag" data-name="蛤蜊">蛤蜊</span>
            </div>
        </div>

        <div class="category-section">
            <div class="category-title">&#x1F9C6; 豆制品</div>
            <div class="category-tags" data-category="tofu">
                <span class="tag" data-name="豆腐">豆腐</span>
                <span class="tag" data-name="豆干">豆干</span>
                <span class="tag" data-name="腐竹">腐竹</span>
                <span class="tag" data-name="豆腐皮">豆腐皮</span>
            </div>
        </div>

        <div class="category-section">
            <div class="category-title">&#x1F344; 菌菇</div>
            <div class="category-tags" data-category="mushroom">
                <span class="tag" data-name="香菇">香菇</span>
                <span class="tag" data-name="金针菇">金针菇</span>
                <span class="tag" data-name="平菇">平菇</span>
                <span class="tag" data-name="木耳">木耳</span>
            </div>
        </div>

        <div class="category-section">
            <div class="category-title">&#x1F35E; 主食</div>
            <div class="category-tags" data-category="staple">
                <span class="tag" data-name="米饭">米饭</span>
                <span class="tag" data-name="面条">面条</span>
                <span class="tag" data-name="馒头">馒头</span>
                <span class="tag" data-name="粉条">粉条</span>
                <span class="tag" data-name="饺子皮">饺子皮</span>
            </div>
        </div>

        <div class="category-section">
            <div class="category-title">&#x1F336; 调料/配菜</div>
            <div class="category-tags" data-category="seasoning">
                <span class="tag" data-name="葱">葱</span>
                <span class="tag" data-name="姜">姜</span>
                <span class="tag" data-name="蒜">蒜</span>
                <span class="tag" data-name="辣椒">辣椒</span>
                <span class="tag" data-name="香菜">香菜</span>
            </div>
        </div>

        <!-- 生成按钮 -->
        <div class="generate-section">
            <button class="generate-btn" id="generateBtn" onclick="generateRecipes()">
                <span class="sparkle">&#x2728;</span>
                <span>AI 生成菜谱</span>
            </button>
        </div>

        <!-- AI 思考中 -->
        <div class="ai-thinking" id="aiThinking">
            <div class="thinking-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p>AI 正在为你创意配餐...</p>
            <p class="thinking-detail">分析食材搭配 | 检索烹饪方案 | 优化制作步骤</p>
        </div>

        <!-- 结果区域 -->
        <div class="result-section" id="resultSection">
            <div class="result-header">
                <h3>&#x1F3C6; 为你推荐</h3>
                <span class="match-count" id="matchCount">匹配 3 道菜</span>
            </div>
            <div id="recipeList"></div>
        </div>

        <div class="safe-area-bottom"></div>
    </div>

    <script>
        // 已选食材集合
        let selectedIngredients = new Set();

        // 菜谱数据
        const recipes = [
            {
                id: 1,
                name: '番茄炒蛋',
                emoji: '&#x1F345;',
                ingredients: ['番茄', '鸡蛋', '葱', '糖'],

                tips: '牛肉选牛腩或牛腱子，炖出来更有口感。'

            {

                name: '麻婆豆腐',
                emoji: '&#x1F9C6;',
                ingredients: ['豆腐', '猪肉', '辣椒', '蒜', '葱', '姜'],
                scene: 'scene-meal',

            },
            {

            {

            {
                id: 7,

                steps: [

            },
            {
                id: 8,
                name: '红烧肉',
                emoji: '&#x1F962;',
                ingredients: ['猪肉', '葱', '姜', '蒜', '糖'],
                scene: 'scene-guest',
                sceneName: '宴客菜',
                time: '90 分钟',
                difficulty: 'hard',
                difficultyName: '困难',
                matchRate: 0,
                steps: [
                    '五花肉切块，冷水下锅焯水去血沫',

        // 标签点击事件
        document.querySelectorAll('.tag').forEach(tag => {
            tag.addEventListener('click', function() {
                const name = this.dataset.name;
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    selectedIngredients.delete(name);
                } else {
                    this.classList.add('selected');
                    selectedIngredients.add(name);
                }
                updateSelectedDisplay();
            });
        });

        // 回车添加食材
        document.getElementById('customInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addCustomIngredient();
            }
        });

        // 添加自定义食材
        function addCustomIngredient() {
            const input = document.getElementById('customInput');
            const name = input.value.trim();
            if (!name) return;
            if (selectedIngredients.has(name)) {
                input.value = '';
                return;
            }
            selectedIngredients.add(name);
            input.value = '';
            updateSelectedDisplay();
        }

        // 更新已选食材显示
        function updateSelectedDisplay() {
            const container = document.getElementById('selectedTags');
            if (selectedIngredients.size === 0) {
                container.innerHTML = '<span class="empty-tip">请选择下方食材或手动输入</span>';
                return;
            }
            container.innerHTML = '';
            selectedIngredients.forEach(name => {
                const tag = document.createElement('span');
                tag.className = 'selected-tag';
                tag.innerHTML = `${name} <span class="remove" onclick="removeIngredient('${name}')">&times;</span>`;
                container.appendChild(tag);
            });
        }

        // 移除食材
        function removeIngredient(name) {
            selectedIngredients.delete(name);
            // 同步取消标签选中状态
            document.querySelectorAll('.tag').forEach(tag => {
                if (tag.dataset.name === name) {
                    tag.classList.remove('selected');
                }
            });
            updateSelectedDisplay();
        }

        // 生成菜谱
        function generateRecipes() {
            if (selectedIngredients.size === 0) {
                alert('请先选择至少一种食材');
                return;
            }

            const btn = document.getElementById('generateBtn');
            const thinking = document.getElementById('aiThinking');
            const result = document.getElementById('resultSection');

            btn.disabled = true;
            thinking.classList.add('active');
            result.classList.remove('active');

            // 模拟 AI 思考时间
            setTimeout(() => {
                thinking.classList.remove('active');
                const matched = matchRecipes();
                renderRecipes(matched);
                result.classList.add('active');
                btn.disabled = false;

                // 滚动到结果区域
                result.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 1800);
        }

        // 匹配菜谱
        function matchRecipes() {
            const selected = Array.from(selectedIngredients);
            return recipes.map(recipe => {
                const matched = recipe.ingredients.filter(ing => selected.includes(ing));
                const rate = Math.round((matched.length / recipe.ingredients.length) * 100);
                return { ...recipe, matchRate: rate, matchedCount: matched.length };
            })
            .filter(r => r.matchedCount > 0)
            .sort((a, b) => b.matchRate - a.matchRate)
            .slice(0, 4);
        }

        // 渲染菜谱
        function renderRecipes(matchedRecipes) {
            const container = document.getElementById('recipeList');
            const countEl = document.getElementById('matchCount');

            countEl.textContent = `匹配 ${matchedRecipes.length} 道菜`;

            if (matchedRecipes.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">暂无完全匹配的菜谱，试试添加更多食材</div>';
                return;
            }

            container.innerHTML = matchedRecipes.map(recipe => `
                <div class="recipe-card" onclick="toggleDetail(${recipe.id})">
                    <div class="recipe-header">
                        <div class="recipe-image">${recipe.emoji}</div>
                        <div class="recipe-info">
                            <div class="recipe-name">${recipe.name}</div>
                            <div class="recipe-tags">
                                <span class="recipe-tag ${recipe.scene}">${recipe.sceneName}</span>
                            </div>
                            <div class="recipe-meta">
                                <span>&#x23F1; ${recipe.time}</span>
                                <span class="difficulty-${recipe.difficulty}">&#x2699; ${recipe.difficultyName}</span>
                                <span class="match-rate">${recipe.matchRate}% 匹配</span>
                            </div>
                        </div>
                    </div>
                    <div class="recipe-detail" id="detail-${recipe.id}">
                        <div class="detail-section">
                            <h4>&#x1F4DD; 所需食材</h4>
                            <p>${recipe.ingredients.join('、')}</p>
                        </div>
                        <div class="detail-section">
                            <h4>&#x1F373; 制作步骤</h4>
                            <ul>
                                ${recipe.steps.map(s => `<li>${s}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="detail-section">
                            <h4>&#x1F4A1; 小贴士</h4>
                            <p>${recipe.tips}</p>
                        </div>
                    </div>
                    <div class="expand-hint">点击${recipe.id % 2 === 0 ? '展开' : '收起'}查看详情 &#x25BC;</div>
                </div>
            `).join('');
        }

        // 切换详情展开
        function toggleDetail(id) {
            const detail = document.getElementById(`detail-${id}`);
            detail.classList.toggle('active');
            const card = detail.closest('.recipe-card');
            const hint = card.querySelector('.expand-hint');
            hint.textContent = detail.classList.contains('active') ? '点击收起详情 &#x25B2;' : '点击展开详情 &#x25BC;';
        }
    </script>
</body>
</html>
