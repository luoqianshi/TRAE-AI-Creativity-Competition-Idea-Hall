<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vault - 智能数字资产管家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 顶部导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: #111;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .navbar::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #00ff88, transparent 70%);
        }

        .logo {
            font-size: 1.3em;
            font-weight: 700;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7em;
            flex-shrink: 0;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            height: 36px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            padding: 0 15px 0 40px;
            color: #fff;
            font-size: 0.9em;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 0.9em;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-upload {
            background: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 8px 18px;
            font-size: 0.85em;
            cursor: pointer;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-upload:hover {
            background: #00ff88;
            color: #0a0a0a;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            clip-path: polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ===== 侧边栏 ===== */
        .sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 200px;
            height: calc(100vh - 60px);
            background: #0d0d0d;
            border-right: 1px solid #1a1a1a;
            padding: 15px 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #333;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, #00ff88, transparent 50%);
        }

        .sidebar-section {
            margin-bottom: 15px;
        }

        .sidebar-title {
            color: #666;
            font-size: 0.7em;
            padding: 8px 15px 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .category-item {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            color: #888;
            font-size: 0.9em;
        }

        .category-item:hover {
            color: #fff;
            background: rgba(0, 255, 136, 0.05);
        }

        .category-item.active {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .category-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: #00ff88;
        }

        .category-icon {
            font-size: 1em;
            flex-shrink: 0;
        }

        .category-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .category-count {
            font-size: 0.75em;
            color: #555;
            flex-shrink: 0;
        }

        .category-item.active .category-count {
            color: #00ff88;
        }

        /* 项目子分类 */
        .project-list {
            padding-left: 20px;
        }

        .project-item {
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
            font-size: 0.85em;
        }

        .project-item:hover {
            color: #aaa;
            background: rgba(0, 255, 136, 0.03);
        }

        .project-item.active {
            color: #00ff88;
        }

        .project-dot {
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* 新建项目按钮 */
        .new-project-btn {
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #555;
            font-size: 0.85em;
            transition: all 0.3s;
        }

        .new-project-btn:hover {
            color: #00ff88;
        }

        .new-project-btn span:first {
            font-size: 1em;
        }

        .sidebar-divider {
            height: 1px;
            background: #1a1a1a;
            margin: 10px 15px;
        }

        /* ===== 主内容区 ===== */
        .main-content {
            margin-left: 200px;
            margin-top: 60px;
            padding: 20px;
            min-height: calc(100vh - 60px);
        }

        .content-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .content-title {
            font-size: 1.2em;
            color: #fff;
            white-space: nowrap;
        }

        .content-title span {
            color: #00ff88;
        }

        .view-toggle {
            display: flex;
            gap: 8px;
        }

        .view-btn {
            background: #1a1a1a;
            border: none;
            color: #888;
            padding: 6px 14px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
        }

        .view-btn.active, .view-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        /* ===== 统计卡片 ===== */
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #111;
            border: 1px solid #1a1a1a;
            padding: 15px 20px;
            flex: 1;
            min-width: 120px;
            position: relative;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #00ff88, transparent 60%);
        }

        .stat-value {
            color: #00ff88;
            font-size: 1.5em;
            font-weight: 700;
        }

        .stat-label {
            color: #888;
            font-size: 0.8em;
            margin-top: 3px;
        }

        /* ===== 资产网格 ===== */
        .asset-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .asset-card {
            background: #111;
            border: 1px solid #1a1a1a;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
            max-width: 100%;
        }

        .asset-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #00ff88, transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .asset-card:hover::before {
            opacity: 1;
        }

        .asset-card:hover {
            border-color: #00ff88;
            transform: translateY(-2px);
        }

        .asset-thumb {
            width: 100%;
            height: 140px;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            position: relative;
            overflow: hidden;
        }

        .asset-thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .asset-type-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 255, 136, 0.9);
            color: #0a0a0a;
            padding: 3px 8px;
            font-size: 0.65em;
            font-weight: 600;
            clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
            white-space: nowrap;
        }

        .asset-info {
            padding: 12px;
        }

        .asset-name {
            color: #fff;
            font-size: 0.9em;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .asset-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .asset-tag {
            background: #1a1a1a;
            color: #888;
            padding: 2px 6px;
            font-size: 0.7em;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .asset-meta {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-top: 1px solid #1a1a1a;
            color: #555;
            font-size: 0.75em;
        }

        .asset-actions {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .asset-card {
            position: relative;
        }

        .asset-card:hover .asset-actions {
            opacity: 1;
        }

        .action-btn {
            width: 26px;
            height: 26px;
            background: rgba(17, 17, 17, 0.9);
            border: 1px solid #333;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8em;
        }

        .action-btn:hover {
            background: #00ff88;
            color: #0a0a0a;
            border-color: #00ff88;
        }

        /* ===== 列表视图 ===== */
        .asset-list {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .asset-list.active {
            display: flex;
        }

        .asset-grid.hidden {
            display: none;
        }

        .list-item {
            background: #111;
            border: 1px solid #1a1a1a;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .list-item:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        .list-thumb {
            width: 50px;
            height: 50px;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            flex-shrink: 0;
        }

        .list-info {
            flex: 1;
            min-width: 0;
        }

        .list-name {
            color: #fff;
            font-size: 0.95em;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .list-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .list-tag {
            background: #1a1a1a;
            color: #888;
            padding: 2px 6px;
            font-size: 0.7em;
        }

        .list-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 0.8em;
            flex-shrink: 0;
        }

        .list-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .list-item:hover .list-actions {
            opacity: 1;
        }

        /* ===== 上传弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #111;
            border: 1px solid #2a2a2a;
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #00ff88, transparent);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            color: #00ff88;
            font-size: 1.1em;
        }

        .modal-close {
            width: 28px;
            height: 28px;
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .modal-close:hover {
            border-color: #ff4757;
            color: #ff4757;
        }

        .modal-body {
            padding: 20px;
        }

        .upload-zone {
            border: 2px dashed #2a2a2a;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 18px;
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
        }

        .upload-zone:hover {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
        }

        .upload-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #888;
            font-size: 0.9em;
        }

        .upload-text span {
            color: #00ff88;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            color: #888;
            font-size: 0.8em;
            margin-bottom: 6px;
            display: block;
        }

        .form-select, .form-input {
            width: 100%;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 10px 12px;
            font-size: 0.9em;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            transition: border-color 0.3s;
        }

        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
            padding: 8px 18px;
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            font-size: 0.85em;
        }

        .btn-cancel:hover {
            border-color: #fff;
            color: #fff;
        }

        .btn-confirm {
            background: #00ff88;
            border: none;
            color: #0a0a0a;
            padding: 8px 18px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            font-size: 0.85em;
        }

        .btn-confirm:hover {
            background: #00cc6a;
        }

        /* ===== 详情弹窗 ===== */
        .detail-modal {
            max-width: 700px;
        }

        .detail-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            max-height: calc(90vh - 150px);
            overflow-y: auto;
        }

        .detail-preview {
            width: 100%;
            height: 200px;
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            position: relative;
            flex-shrink: 0;
        }

        .detail-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid #00ff88;
            opacity: 0.3;
            pointer-events: none;
        }

        .detail-info-box {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            padding: 15px;
        }

        .detail-info-box h3 {
            color: #00ff88;
            font-size: 0.85em;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1a1a1a;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.85em;
        }

        .detail-row-label {
            color: #888;
        }

        .detail-row-value {
            color: #fff;
        }

        .detail-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .detail-tag {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            padding: 4px 10px;
            font-size: 0.8em;
        }

        .detail-actions {
            display: flex;
            gap: 10px;
        }

        .detail-btn {
            flex: 1;
            background: transparent;
            border: 1px solid #2a2a2a;
            color: #888;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            font-size: 0.85em;
        }

        .detail-btn:hover {
            border-color: #00ff88;
            color: #00ff88;
        }

        .detail-btn.download {
            background: #00ff88;
            border-color: #00ff88;
            color: #0a0a0a;
        }

        .detail-btn.download:hover {
            background: #00cc6a;
        }

        /* ===== 版本历史 ===== */
        .version-list {
            max-height: 150px;
            overflow-y: auto;
        }

        .version-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .version-item:last-child {
            border-bottom: none;
        }

        .version-marker {
            width: 8px;
            height: 8px;
            background: #00ff88;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            flex-shrink: 0;
        }

        .version-info {
            flex: 1;
            min-width: 0;
        }

        .version-name {
            color: #fff;
            font-size: 0.85em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .version-date {
            color: #555;
            font-size: 0.75em;
        }

        .version-params {
            color: #888;
            font-size: 0.75em;
            background: #1a1a1a;
            padding: 2px 6px;
            flex-shrink: 0;
        }

        /* ===== 新建项目弹窗 ===== */
        .project-input {
            display: flex;
            gap: 10px;
            padding: 8px 15px;
        }

        .project-input .form-input {
            flex: 1;
            padding: 8px 12px;
        }

        .project-input .btn-confirm {
            padding: 8px 15px;
        }

        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: #888;
        }

        .empty-icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .empty-text {
            font-size: 1em;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 50px;
                padding: 10px 0;
            }
            
            .sidebar-title, .category-name, .category-count, .project-list, .new-project-btn, .sidebar-divider:not(:last-of-type) {
                display: none;
            }
            
            .category-item {
                justify-content: center;
                padding: 12px 8px;
            }
            
            .main-content {
                margin-left: 50px;
                padding: 15px;
            }
            
            .search-box {
                display: none;
            }
            
            .stats-bar {
                gap: 10px;
            }
            
            .stat-card {
                min-width: 100px;
                padding: 12px 15px;
            }

            .detail-modal {
                max-width: 95%;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon">V</div>
            AI Vault
        </div>
        
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="搜索资产名称、标签..." id="searchInput">
        </div>
        
        <div class="nav-actions">
            <button class="btn-upload" onclick="openUploadModal()">
                <span>⬆</span> 上传资产
            </button>
            <div class="user-avatar">👤</div>
        </div>
    </nav>

    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">资产分类</div>
            
            <div class="category-item active" onclick="filterByType('all')">
                <span class="category-icon">📦</span>
                <span class="category-name">全部资产</span>
                <span class="category-count">24</span>
            </div>
            
            <div class="category-item" onclick="filterByType('game')">
                <span class="category-icon">🎮</span>
                <span class="category-name">游戏资产</span>
                <span class="category-count">8</span>
            </div>
            
            <div class="category-item" onclick="filterByType('video')">
                <span class="category-icon">🎬</span>
                <span class="category-name">视频素材</span>
                <span class="category-count">6</span>
            </div>
            
            <div class="category-item" onclick="filterByType('image')">
                <span class="category-icon">🎨</span>
                <span class="category-name">图片资产</span>
                <span class="category-count">7</span>
            </div>
            
            <div class="category-item" onclick="filterByType('model')">
                <span class="category-icon">🤖</span>
                <span class="category-name">模型文件</span>
                <span class="category-count">3</span>
            </div>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
            <div class="sidebar-title">项目分类</div>
            
            <div class="project-list" id="projectList">
                <!-- 项目列表会通过JS动态生成 -->
            </div>

            <div class="new-project-btn" onclick="showNewProjectInput()">
                <span>+</span>
                <span style="font-size:0.85em;">新建项目</span>
            </div>

            <div class="project-input" id="newProjectInput" style="display:none;">
                <input type="text" class="form-input" placeholder="项目名称..." id="projectNameInput">
                <button class="btn-confirm" onclick="createProject()">添加</button>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 统计卡片 -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalAssets">24</div>
                <div class="stat-label">总资产数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">2.4 GB</div>
                <div class="stat-label">存储空间</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalVersions">48</div>
                <div class="stat-label">版本记录</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="weekNew">5</div>
                <div class="stat-label">本周新增</div>
            </div>
        </div>

        <!-- 内容头部 -->
        <div class="content-header">
            <h2 class="content-title" id="contentTitle">我的资产库 <span>// 全部资产</span></h2>
            <div class="view-toggle">
                <button class="view-btn active" onclick="setViewMode('grid')" id="gridBtn">网格</button>
                <button class="view-btn" onclick="setViewMode('list')" id="listBtn">列表</button>
            </div>
        </div>

        <!-- 资产网格 -->
        <div class="asset-grid" id="assetGrid">
            <!-- 资产卡片会通过JS动态生成 -->
        </div>

        <!-- 资产列表 -->
        <div class="asset-list" id="assetList">
            <!-- 资产列表会通过JS动态生成 -->
        </div>
    </main>

    <!-- 上传弹窗 -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">上传新资产</h3>
                <button class="modal-close" onclick="closeUploadModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="upload-zone" onclick="simulateUpload()">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击选择文件，或 <span>拖拽上传</span></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">资产类型</label>
                    <select class="form-select" id="assetType">
                        <option value="game">🎮 游戏资产</option>
                        <option value="video">🎬 视频素材</option>
                        <option value="image">🎨 图片资产</option>
                        <option value="model">🤖 模型文件</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">所属项目</label>
                    <select class="form-select" id="assetProject">
                        <option value="">无项目</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">资产名称</label>
                    <input type="text" class="form-input" id="assetName" placeholder="输入资产名称...">
                </div>
                
                <div class="form-group">
                    <label class="form-label">标签（用逗号分隔）</label>
                    <input type="text" class="form-input" id="assetTags" placeholder="例如: 角色,3D,战斗...">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeUploadModal()">取消</button>
                <button class="btn-confirm" onclick="confirmUpload()">确认上传</button>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal detail-modal">
            <div class="modal-header">
                <h3 class="modal-title" id="detailTitle">资产详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">✕</button>
            </div>
            <div class="detail-content">
                <div class="detail-preview" id="detailPreview">
                    <!-- 预览内容 -->
                </div>
                
                <div class="detail-info-box">
                    <h3>基本信息</h3>
                    <div class="detail-row">
                        <span class="detail-row-label">类型</span>
                        <span class="detail-row-value" id="detailType">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-row-label">大小</span>
                        <span class="detail-row-value" id="detailSize">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-row-label">所属项目</span>
                        <span class="detail-row-value" id="detailProject">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-row-label">创建时间</span>
                        <span class="detail-row-value" id="detailDate">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-row-label">更新时间</span>
                        <span class="detail-row-value" id="detailUpdate">-</span>
                    </div>
                    <div class="detail-tags" id="detailTags">
                        <!-- 标签 -->
                    </div>
                </div>
                
                <div class="detail-info-box">
                    <h3>版本历史</h3>
                    <div class="version-list" id="versionList">
                        <!-- 版本列表 -->
                    </div>
                </div>
                
                <div class="detail-actions">
                    <button class="detail-btn download" onclick="downloadAsset()">
                        <span>⬇</span> 下载
                    </button>
                    <button class="detail-btn" onclick="editAsset()">
                        <span>✎</span> 编辑
                    </button>
                    <button class="detail-btn" onclick="deleteAsset()">
                        <span>🗑</span> 删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock数据 - 带项目分类
        let projects = [
            { id: 'p1', name: '赛博朋克游戏', icon: '🎮' },
            { id: 'p2', name: '奇幻动画短片', icon: '🎬' },
            { id: 'p3', name: 'AI绘画集', icon: '🎨' }
        ];

        let mockAssets = [
            { id: 1, name: '赛博朋克角色_001', type: 'game', projectId: 'p1', tags: ['角色', '赛博朋克', '3D'], icon: '🤖', size: '45 MB', createdAt: '2026-06-10', updatedAt: '2026-06-14', versions: ['v1.0 原始版本', 'v1.1 优化材质', 'v2.0 添加动画'] },
            { id: 2, name: '森林场景背景', type: 'game', projectId: 'p1', tags: ['场景', '森林', '背景'], icon: '🌲', size: '128 MB', createdAt: '2026-06-08', updatedAt: '2026-06-12', versions: ['v1.0 基础场景', 'v1.5 添加光影'] },
            { id: 3, name: '魔法特效粒子', type: 'video', projectId: 'p2', tags: ['特效', '魔法', '粒子'], icon: '✨', size: '32 MB', createdAt: '2026-06-05', updatedAt: '2026-06-05', versions: ['v1.0'] },
            { id: 4, name: 'AI生成宣传片', type: 'video', projectId: 'p2', tags: ['视频', '宣传', 'AI'], icon: '🎬', size: '256 MB', createdAt: '2026-06-01', updatedAt: '2026-06-03', versions: ['v1.0 初稿', 'v2.0 最终版'] },
            { id: 5, name: '科幻城市插画', type: 'image', projectId: 'p3', tags: ['插画', '科幻', '城市'], icon: '🌆', size: '8 MB', createdAt: '2026-06-09', updatedAt: '2026-06-09', versions: ['v1.0'] },
            { id: 6, name: '游戏UI按钮组', type: 'image', projectId: 'p1', tags: ['UI', '按钮', '游戏'], icon: '🔘', size: '2 MB', createdAt: '2026-06-11', updatedAt: '2026-06-15', versions: ['v1.0 基础样式', 'v1.2 hover效果'] },
            { id: 7, name: '人物肖像合集', type: 'image', projectId: 'p3', tags: ['肖像', '人物', 'AI'], icon: '👤', size: '15 MB', createdAt: '2026-06-07', updatedAt: '2026-06-07', versions: ['v1.0'] },
            { id: 8, name: 'StableDiffusion模型', type: 'model', projectId: '', tags: ['模型', 'SD', 'AI'], icon: '🧠', size: '2.1 GB', createdAt: '2026-05-20', updatedAt: '2026-06-10', versions: ['v1.0', 'v1.5 微调版'] },
            { id: 9, name: '战斗动画序列', type: 'game', projectId: 'p1', tags: ['动画', '战斗', '角色'], icon: '⚔', size: '67 MB', createdAt: '2026-06-12', updatedAt: '2026-06-14', versions: ['v1.0'] },
            { id: 10, name: '星空背景视频', type: 'video', projectId: 'p2', tags: ['背景', '星空', '动态'], icon: '🌟', size: '89 MB', createdAt: '2026-06-06', updatedAt: '2026-06-08', versions: ['v1.0', 'v1.1 增强亮度'] },
            { id: 11, name: '机械战士3D模型', type: 'model', projectId: '', tags: ['3D', '机械', '战士'], icon: '🦾', size: '156 MB', createdAt: '2026-06-04', updatedAt: '2026-06-13', versions: ['v1.0 低模', 'v2.0 高模'] },
            { id: 12, name: '梦幻风景系列', type: 'image', projectId: 'p3', tags: ['风景', '梦幻', 'AI'], icon: '🌈', size: '22 MB', createdAt: '2026-06-13', updatedAt: '2026-06-13', versions: ['v1.0'] }
        ];

        let currentFilter = 'all';
        let currentProject = '';
        let currentViewMode = 'grid';
        let currentAsset = null;

        // 初始化渲染
        function renderProjects() {
            const projectList = document.getElementById('projectList');
            projectList.innerHTML = projects.map(p => `
                <div class="project-item ${currentProject === p.id ? 'active' : ''}" onclick="filterByProject('${p.id}')">
                    <span class="project-dot"></span>
                    <span>${p.icon} ${p.name}</span>
                </div>
            `).join('');
        }

        function renderAssets() {
            const grid = document.getElementById('assetGrid');
            const list = document.getElementById('assetList');
            let filtered = [...mockAssets];
            
            if (currentFilter !== 'all') {
                filtered = filtered.filter(a => a.type === currentFilter);
            }
            if (currentProject) {
                filtered = filtered.filter(a => a.projectId === currentProject);
            }
            
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(a => 
                    a.name.toLowerCase().includes(searchTerm) || 
                    a.tags.some(t => t.toLowerCase().includes(searchTerm))
                );
            }

            // 更新统计
            document.getElementById('totalAssets').textContent = filtered.length;
            document.getElementById('totalVersions').textContent = filtered.reduce((sum, a) => sum + a.versions.length, 0);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">没有找到匹配的资产</div>
                    </div>
                `;
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">没有找到匹配的资产</div>
                    </div>
                `;
                return;
            }

            // 网格视图
            grid.innerHTML = filtered.map(asset => `
                <div class="asset-card" onclick="openDetailModal(${asset.id})">
                    <div class="asset-thumb">
                        <span>${asset.icon}</span>
                        <span class="asset-type-badge">${getTypeName(asset.type)}</span>
                    </div>
                    <div class="asset-info">
                        <div class="asset-name">${asset.name}</div>
                        <div class="asset-tags">
                            ${asset.tags.slice(0, 2).map(t => `<span class="asset-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="asset-meta">
                        <span>${asset.size}</span>
                        <span>${asset.updatedAt}</span>
                    </div>
                    <div class="asset-actions">
                        <button class="action-btn" onclick="event.stopPropagation(); downloadAssetById(${asset.id})" title="下载">⬇</button>
                        <button class="action-btn" onclick="event.stopPropagation(); deleteAssetById(${asset.id})" title="删除">🗑</button>
                    </div>
                </div>
            `).join('');

            // 列表视图
            list.innerHTML = filtered.map(asset => `
                <div class="list-item" onclick="openDetailModal(${asset.id})">
                    <div class="list-thumb">${asset.icon}</div>
                    <div class="list-info">
                        <div class="list-name">${asset.name}</div>
                        <div class="list-tags">
                            ${asset.tags.map(t => `<span class="list-tag">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="list-meta">
                        <span>${asset.size}</span>
                        <span>${asset.updatedAt}</span>
                    </div>
                    <div class="list-actions">
                        <button class="action-btn" onclick="event.stopPropagation(); downloadAssetById(${asset.id})" title="下载">⬇</button>
                        <button class="action-btn" onclick="event.stopPropagation(); deleteAssetById(${asset.id})" title="删除">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function getTypeName(type) {
            const names = { game: '游戏', video: '视频', image: '图片', model: '模型' };
            return names[type] || type;
        }

        function getProjectName(projectId) {
            if (!projectId) return '无项目';
            const p = projects.find(pr => pr.id === projectId);
            return p ? p.name : '无项目';
        }

        // 视图切换
        function setViewMode(mode) {
            currentViewMode = mode;
            const grid = document.getElementById('assetGrid');
            const list = document.getElementById('assetList');
            const gridBtn = document.getElementById('gridBtn');
            const listBtn = document.getElementById('listBtn');
            
            if (mode === 'grid') {
                grid.classList.remove('hidden');
                list.classList.remove('active');
                gridBtn.classList.add('active');
                listBtn.classList.remove('active');
            } else {
                grid.classList.add('hidden');
                list.classList.add('active');
                gridBtn.classList.remove('active');
                listBtn.classList.add('active');
            }
        }

        // 筛选功能
        function filterByType(type) {
            currentFilter = type;
            currentProject = '';
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const titleMap = { all: '全部资产', game: '游戏资产', video: '视频素材', image: '图片资产', model: '模型文件' };
            document.getElementById('contentTitle').innerHTML = `我的资产库 <span>// ${titleMap[type]}</span>`;
            
            renderAssets();
        }

        function filterByProject(projectId) {
            currentProject = projectId;
            currentFilter = 'all';
            document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            const project = projects.find(p => p.id === projectId);
            document.getElementById('contentTitle').innerHTML = `我的资产库 <span>// ${project ? project.icon + ' ' + project.name : '全部资产'}</span>`;
            
            renderAssets();
        }

        // 新建项目
        function showNewProjectInput() {
            const inputDiv = document.getElementById('newProjectInput');
            const input = document.getElementById('projectNameInput');
            inputDiv.style.display = 'flex';
            input.focus();
        }

        function createProject() {
            const input = document.getElementById('projectNameInput');
            const name = input.value.trim();
            if (!name) {
                alert('请输入项目名称');
                return;
            }
            
            const icons = ['📁', '🎮', '🎬', '🎨', '🤖', '📦', '✨', '🌟'];
            const newProject = {
                id: 'p' + Date.now(),
                name: name,
                icon: icons[Math.floor(Math.random() * icons.length)]
            };
            
            projects.push(newProject);
            input.value = '';
            document.getElementById('newProjectInput').style.display = 'none';
            renderProjects();
            renderAssets();
            
            // 更新上传弹窗中的项目选择
            updateProjectSelect();
        }

        function updateProjectSelect() {
            const select = document.getElementById('assetProject');
            select.innerHTML = '<option value="">无项目</option>' + 
                projects.map(p => `<option value="${p.id}">${p.icon} ${p.name}</option>`).join('');
        }

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', renderAssets);

        // 弹窗控制
        function openUploadModal() {
            updateProjectSelect();
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            // 清空表单
            document.getElementById('assetName').value = '';
            document.getElementById('assetTags').value = '';
        }

        function openDetailModal(id) {
            currentAsset = mockAssets.find(a => a.id === id);
            if (!currentAsset) return;
            
            document.getElementById('detailModal').classList.add('active');
            document.getElementById('detailTitle').textContent = currentAsset.name;
            document.getElementById('detailPreview').innerHTML = `<span style="font-size:4em;">${currentAsset.icon}</span>`;
            document.getElementById('detailType').textContent = getTypeName(currentAsset.type);
            document.getElementById('detailSize').textContent = currentAsset.size;
            document.getElementById('detailProject').textContent = getProjectName(currentAsset.projectId);
            document.getElementById('detailDate').textContent = currentAsset.createdAt;
            document.getElementById('detailUpdate').textContent = currentAsset.updatedAt;
            document.getElementById('detailTags').innerHTML = currentAsset.tags.map(t => 
                `<span class="detail-tag">${t}</span>`
            ).join('');
            
            document.getElementById('versionList').innerHTML = currentAsset.versions.map((v, i) => `
                <div class="version-item">
                    <div class="version-marker"></div>
                    <div class="version-info">
                        <div class="version-name">${v}</div>
                        <div class="version-date">${currentAsset.createdAt}</div>
                    </div>
                    <span class="version-params">参数已记录</span>
                </div>
            `).join('');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // 模拟操作
        function simulateUpload() {
            alert('Demo演示：文件选择功能已触发！\n\n在真实产品中，这里会打开系统文件选择器。');
        }

        function confirmUpload() {
            const name = document.getElementById('assetName').value;
            const tagsStr = document.getElementById('assetTags').value;
            const type = document.getElementById('assetType').value;
            const projectId = document.getElementById('assetProject').value;
            
            if (!name) {
                alert('请输入资产名称');
                return;
            }
            
            const tags = tagsStr.split(',').map(t => t.trim()).filter(t => t);
            const icons = { game: '🎮', video: '🎬', image: '🎨', model: '🤖' };
            
            const newAsset = {
                id: Date.now(),
                name: name,
                type: type,
                projectId: projectId,
                tags: tags.length > 0 ? tags : ['未分类'],
                icon: icons[type] || '📦',
                size: Math.floor(Math.random() * 500) + ' MB',
                createdAt: new Date().toISOString().split('T')[0],
                updatedAt: new Date().toISOString().split('T')[0],
                versions: ['v1.0 初始版本']
            };
            
            mockAssets.unshift(newAsset);
            closeUploadModal();
            renderAssets();
            
            alert(`Demo演示：资产 "${name}" 已上传成功！`);
        }

        function downloadAsset() {
            alert(`Demo演示：正在下载 "${currentAsset.name}"\n\n在真实产品中，这里会开始下载文件。`);
        }

        function downloadAssetById(id) {
            const asset = mockAssets.find(a => a.id === id);
            alert(`Demo演示：正在下载 "${asset.name}"`);
        }

        function editAsset() {
            alert(`Demo演示：编辑功能\n\n在真实产品中，这里会打开编辑界面。`);
            closeDetailModal();
        }

        function deleteAsset() {
            if (confirm(`确定要删除资产 "${currentAsset.name}" 吗？`)) {
                mockAssets = mockAssets.filter(a => a.id !== currentAsset.id);
                closeDetailModal();
                renderAssets();
                alert(`Demo演示：已删除 "${currentAsset.name}"`);
            }
        }

        function deleteAssetById(id) {
            const asset = mockAssets.find(a => a.id === id);
            if (confirm(`确定要删除资产 "${asset.name}" 吗？`)) {
                mockAssets = mockAssets.filter(a => a.id !== id);
                renderAssets();
                alert(`Demo演示：已删除 "${asset.name}"`);
            }
        }

        // 初始化
        renderProjects();
        renderAssets();
    </script>
</body>
</html>
