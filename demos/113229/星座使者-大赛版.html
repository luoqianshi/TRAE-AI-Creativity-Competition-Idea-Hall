<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星座使者 - Constellation Messenger</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=ZCOOL+XiaoWei&family=Nunito:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1e 0%, #16213e 50%, #2d1b4e 100%);
            font-family: 'Nunito', 'ZCOOL XiaoWei', sans-serif;
            overflow: hidden;
        }
        #game-wrapper {
            position: relative;
            border-radius: 24px;
            overflow: hidden;
            box-shadow:
                0 25px 80px rgba(0,0,0,0.6),
                0 0 0 4px rgba(255, 215, 0, 0.6),
                0 0 0 8px rgba(123, 104, 238, 0.4),
                0 0 60px rgba(138, 43, 226, 0.3);
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="game-canvas" width="960" height="720"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const STATE = { START: 0, PLAY: 1, END: 2 };
        let gameState = STATE.START;

        // 12星座数据
        const ZODIAC_DATA = [
            { sym: '♈', name: '白羊座', en: 'Aries', elem: 'fire', elemName: '火象', date: '3.21-4.19',
              traits: ['热情', '勇敢', '直率'], likes: '🔥 热血冒险', keyword: '勇气' },
            { sym: '♉', name: '金牛座', en: 'Taurus', elem: 'earth', elemName: '土象', date: '4.20-5.20',
              traits: ['稳重', '务实', '忠诚'], likes: '🌿 实用自然', keyword: '坚韧' },
            { sym: '♊', name: '双子座', en: 'Gemini', elem: 'air', elemName: '风象', date: '5.21-6.21',
              traits: ['机智', '善变', '好奇'], likes: '📚 知识创意', keyword: '灵动' },
            { sym: '♋', name: '巨蟹座', en: 'Cancer', elem: 'water', elemName: '水象', date: '6.22-7.22',
              traits: ['温柔', '敏感', '顾家'], likes: '🌊 浪漫艺术', keyword: '守护' },
            { sym: '♌', name: '狮子座', en: 'Leo', elem: 'fire', elemName: '火象', date: '7.23-8.22',
              traits: ['自信', '慷慨', '领导'], likes: '🔥 热血冒险', keyword: '荣耀' },
            { sym: '♍', name: '处女座', en: 'Virgo', elem: 'earth', elemName: '土象', date: '8.23-9.22',
              traits: ['完美', '细致', '可靠'], likes: '🌿 实用自然', keyword: '纯净' },
            { sym: '♎', name: '天秤座', en: 'Libra', elem: 'air', elemName: '风象', date: '9.23-10.23',
              traits: ['优雅', '公正', '随和'], likes: '📚 知识创意', keyword: '平衡' },
            { sym: '♏', name: '天蝎座', en: 'Scorpio', elem: 'water', elemName: '水象', date: '10.24-11.22',
              traits: ['神秘', '执着', '深刻'], likes: '🌊 浪漫艺术', keyword: '蜕变' },
            { sym: '♐', name: '射手座', en: 'Sagittarius', elem: 'fire', elemName: '火象', date: '11.23-12.21',
              traits: ['乐观', '自由', '冒险'], likes: '🔥 热血冒险', keyword: '探索' },
            { sym: '♑', name: '摩羯座', en: 'Capricorn', elem: 'earth', elemName: '土象', date: '12.22-1.19',
              traits: ['坚韧', '责任', '传统'], likes: '🌿 实用自然', keyword: '攀登' },
            { sym: '♒', name: '水瓶座', en: 'Aquarius', elem: 'air', elemName: '风象', date: '1.20-2.18',
              traits: ['独特', '理性', '创新'], likes: '📚 知识创意', keyword: '未来' },
            { sym: '♓', name: '双鱼座', en: 'Pisces', elem: 'water', elemName: '水象', date: '2.19-3.20',
              traits: ['梦幻', '善良', '感性'], likes: '🌊 浪漫艺术', keyword: '幻想' }
        ];

        const ELEMENT_COLORS = {
            fire: '#ff6b6b', earth: '#7bed9f', air: '#70a1ff', water: '#ff69b4'
        };

        const ACTIONS = [
            { icon: '💬', name: '心灵对话', desc: '深度交流，拉近彼此距离', cost: 1, gain: 2, unlock: 0 },
            { icon: '🎁', name: '星辰献礼', desc: '送出礼物，契合喜好效果更佳', cost: 1, gain: 5, failGain: 1, unlock: 0 },
            { icon: '🔮', name: '星盘占卜', desc: '揭示星座喜好，获得星之指引', cost: 1, gain: 3, unlock: 0 },
            { icon: '🌙', name: '月下约会', desc: '共赴浪漫之约，好感度飙升', cost: 2, gain: 12, failGain: -4, unlock: 30 }
        ];

        const GIFT_TYPES = [
            { icon: '🔥', name: '热血冒险', elem: 'fire' },
            { icon: '🌿', name: '实用自然', elem: 'earth' },
            { icon: '📚', name: '知识创意', elem: 'air' },
            { icon: '🌊', name: '浪漫艺术', elem: 'water' }
        ];

        // 结局台词
        const ENDINGS = {
            '♈': '「在星河的尽头，愿与你一同燃烧炽热的灵魂。」——白羊座·勇气之誓',
            '♉': '「时间流转，唯有你的陪伴是我最坚实的依靠。」——金牛座·永恒誓言',
            '♊': '「千言万语，不及与你共度的每一个瞬间。」——双子座·心意相通',
            '♋': '「月光温柔，不及你眼中的海洋。」——巨蟹座·心之归宿',
            '♌': '「王座之上，愿与你共享万丈荣光。」——狮子座·王者之恋',
            '♍': '「在不完美的世界里，你是我最完美的存在。」——处女座·纯粹之心',
            '♎': '「天平两端，一端是我，一端是你。」——天秤座·命运平衡',
            '♏': '「深渊之中，你是我唯一的光。」——天蝎座·灵魂共鸣',
            '♐': '「向着星辰大海，你是我永远的方向。」——射手座·自由之翼',
            '♑': '「攀登万仞高峰，只为与你并肩。」——摩羯座·顶峰之约',
            '♒': '「跨越时空的维度，我终将遇见你。」——水瓶座·未来之约',
            '♓': '「在梦境与现实的边界，我们的故事永不落幕。」——双鱼座·星海童话'
        };

        // 游戏状态
        let zodiacs = [];
        let selZodiac = 0;
        let selAction = 0;
        let actions = 18;
        let actionsUsed = 0;
        let eventTimer = 0;
        let currentEvent = null;
        let particles = [];
        let floatTexts = [];
        let stars = [];
        let shootingStars = [];
        let zodiacOrbs = [];
        let affinityChange = 0;
        let affinityChangeTimer = 0;
        let selectedGift = 0;
        let showGiftSelect = false;

        function initGame() {
            zodiacs = ZODIAC_DATA.map(z => ({
                ...z,
                affinity: 0,
                maxAffinity: 100,
                revealed: false,
                unlocked: false,
                heartLevel: 0
            }));
            selZodiac = 0;
            selAction = 0;
            actions = 18;
            actionsUsed = 0;
            currentEvent = null;
            eventTimer = 0;
            particles = [];
            floatTexts = [];
            affinityChange = 0;
            affinityChangeTimer = 0;
            selectedGift = 0;
            showGiftSelect = false;
            initStars();
            initOrbs();
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 150; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.3 + 0.05,
                    op: Math.random() * 0.5 + 0.4,
                    twinkle: Math.random() * Math.PI * 2,
                    twinkleSpd: Math.random() * 0.03 + 0.01
                });
            }
        }

        function initOrbs() {
            zodiacOrbs = zodiacs.map((z, i) => ({
                x: 80 + (i % 3) * 60,
                y: 150 + Math.floor(i / 3) * 65,
                angle: Math.random() * Math.PI * 2,
                pulse: Math.random() * Math.PI * 2
            }));
        }

        function getLevel(a) {
            if (a >= 100) return { t: '灵魂共鸣', e: '✨', c: '#ffd700', stars: 5 };
            if (a >= 80) return { t: '心意相通', e: '💖', c: '#ff69b4', stars: 4 };
            if (a >= 55) return { t: '知心挚友', e: '💕', c: '#ff85c1', stars: 3 };
            if (a >= 30) return { t: '相识相知', e: '💛', c: '#ffd93d', stars: 2 };
            return { t: '初次相遇', e: '💙', c: '#70a1ff', stars: 1 };
        }

        function getTitle(n) {
            if (n >= 12) return '🌟 星海守护者';
            if (n >= 8) return '💫 星座大师';
            if (n >= 5) return '✨ 星辰使者';
            if (n >= 3) return '🌙 月光学徒';
            return '⭐ 初入星途';
        }

        function triggerEvent() {
            const events = [
                { t: '🌟 流星雨降临！全星座好感度+3！', type: 'allBonus', val: 3 },
                { t: `✨ ${zodiacs[selZodiac].name}今日心情极佳，互动效果翻倍！`, type: 'double', target: selZodiac },
                { t: '🔮 神秘力量涌动，行动机会+3！', type: 'addActions', val: 3 },
                { t: `💫 ${zodiacs[selZodiac].name}的守护星闪耀，好感度+5！`, type: 'bonus', val: 5, target: selZodiac }
            ];
            currentEvent = events[Math.floor(Math.random() * events.length)];

            if (currentEvent.type === 'allBonus') {
                for (let z of zodiacs) z.affinity = Math.min(100, z.affinity + currentEvent.val);
            } else if (currentEvent.type === 'addActions') {
                actions += currentEvent.val;
            } else if (currentEvent.type === 'bonus') {
                zodiacs[currentEvent.target].affinity = Math.min(100, zodiacs[currentEvent.target].affinity + currentEvent.val);
            }

            showFloat(currentEvent.t, W/2, 180, '#ffd700', 24);
            createParticles(W/2, 200, '#ffd700', 25);
            eventTimer = 300;
        }

        function doAction() {
            if (actions <= 0) {
                showFloat('行动机会已用完！', W/2, H/2, '#ff6b6b', 28);
                return;
            }

            const z = zodiacs[selZodiac];
            const action = ACTIONS[selAction];

            if (z.unlocked) {
                showFloat('该星座已达成灵魂共鸣！', W/2, H/2, '#ffd700', 24);
                return;
            }

            if (action.unlock > 0 && z.affinity < action.unlock) {
                showFloat(`需要好感度≥${action.unlock}才能解锁！`, W/2, H/2, '#ff6b6b', 22);
                return;
            }

            if (actions < action.cost) {
                showFloat('行动机会不足！', W/2, H/2, '#ff6b6b', 24);
                return;
            }

            // 如果是送礼，显示礼物选择
            if (selAction === 1 && !showGiftSelect) {
                showGiftSelect = true;
                selectedGift = 0;
                return;
            }

            actions -= action.cost;
            actionsUsed++;

            let gain = 0;
            let msg = '';
            let color = '#fff';

            switch (selAction) {
                case 0: // 聊天
                    gain = action.gain;
                    msg = `💬 ${z.name}很开心和你聊天~`;
                    color = '#7bed9f';
                    break;
                case 1: // 送礼
                    const gift = GIFT_TYPES[selectedGift];
                    if (gift.elem === z.elem) {
                        gain = action.gain;
                        msg = `🎁 ${z.name}非常喜欢${gift.icon}${gift.name}礼物！`;
                        color = '#ffd700';
                    } else {
                        gain = action.failGain;
                        msg = `🎁 ${z.name}收下了${gift.icon}礼物...似乎不太感兴趣`;
                        color = '#ffa502';
                    }
                    showGiftSelect = false;
                    break;
                case 2: // 占卜
                    gain = action.gain;
                    z.revealed = true;
                    msg = `🔮 星盘显示：${z.name}喜欢${z.likes}`;
                    color = '#9370db';
                    break;
                case 3: // 约会
                    if (Math.random() > 0.3) {
                        gain = action.gain;
                        msg = `🌙 约会非常成功！${z.name}度过了美好的夜晚~`;
                        color = '#ff69b4';
                    } else {
                        gain = action.failGain;
                        msg = `🌙 约会似乎不太顺利...${z.name}有些疲惫`;
                        color = '#ff6b6b';
                    }
                    break;
            }

            // 事件加成
            if (currentEvent && currentEvent.type === 'double' && currentEvent.target === selZodiac) {
                gain = Math.floor(gain * 2);
                msg += ' (效果翻倍!)';
            }

            z.affinity = Math.max(0, Math.min(100, z.affinity + gain));
            affinityChange = gain;
            affinityChangeTimer = 60;

            // 检查解锁
            if (z.affinity >= 100 && !z.unlocked) {
                z.unlocked = true;
                z.heartLevel = 5;
                msg = `✨ 恭喜！与${z.name}达成灵魂共鸣！✨`;
                color = '#ffd700';
                createParticles(W/2, H/2, '#ffd700', 40);
                actions += 3; // 奖励行动
            }

            // 每30好感奖励行动
            let oldLevel = Math.floor((z.affinity - gain) / 30);
            let newLevel = Math.floor(z.affinity / 30);
            if (newLevel > oldLevel && gain > 0) {
                actions += 2;
                showFloat('💫 好感突破！行动+2', W/2, H/2 - 50, '#ffd700', 20);
            }

            showFloat(msg, W/2, H/2, color, 20);
            createParticles(W/2, H/2, color, 12);

            // 触发随机事件
            if (actionsUsed > 0 && actionsUsed % 8 === 0 && !currentEvent) {
                setTimeout(triggerEvent, 800);
            }

            // 检查游戏结束
            if (actions <= 0) {
                setTimeout(() => {
                    gameState = STATE.END;
                }, 1500);
            }
        }

        function confirmGift() {
            doAction();
        }

        function showFloat(text, x, y, color, size=18) {
            const lines = text.split('\n');
            lines.forEach((line, i) => {
                floatTexts.push({ text: line, x, y: y + i * 26, color, life: 1, vy: -1, size });
            });
        }

        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = 1 + Math.random() * 5;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2,
                    size: 3 + Math.random() * 6,
                    color,
                    life: 1,
                    decay: 0.015 + Math.random() * 0.025,
                    type: Math.random() < 0.3 ? 'star' : 'circle'
                });
            }
        }

        function spawnShootingStar() {
            shootingStars.push({
                x: Math.random() * W,
                y: -20,
                vx: 4 + Math.random() * 3,
                vy: 2 + Math.random() * 2,
                len: 80 + Math.random() * 60,
                life: 1
            });
        }

        function update() {
            // 星星
            for (let s of stars) {
                s.y += s.speed;
                s.twinkle += s.twinkleSpd;
                if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
            }

            // 流星
            if (Math.random() < 0.005) spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                let ss = shootingStars[i];
                ss.x += ss.vx;
                ss.y += ss.vy;
                ss.life -= 0.008;
                if (ss.life <= 0 || ss.y > H || ss.x > W) shootingStars.splice(i, 1);
            }

            // 星球轨道
            for (let orb of zodiacOrbs) {
                orb.angle += 0.005;
                orb.pulse += 0.03;
            }

            // 粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.vx *= 0.99;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // 浮动文字
            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let f = floatTexts[i];
                f.y += f.vy;
                f.life -= 0.012;
                if (f.life <= 0) floatTexts.splice(i, 1);
            }

            // 事件计时
            if (eventTimer > 0) {
                eventTimer--;
                if (eventTimer <= 0) currentEvent = null;
            }

            if (affinityChangeTimer > 0) affinityChangeTimer--;
        }

        function draw() {
            // 背景
            let bg = ctx.createLinearGradient(0, 0, W, H);
            bg.addColorStop(0, '#0a0a1e');
            bg.addColorStop(0.4, '#16213e');
            bg.addColorStop(0.7, '#1a1a4e');
            bg.addColorStop(1, '#2d1b4e');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // 星云效果
            let nebula = ctx.createRadialGradient(W*0.7, H*0.3, 0, W*0.7, H*0.3, 400);
            nebula.addColorStop(0, 'rgba(138, 43, 226, 0.15)');
            nebula.addColorStop(1, 'transparent');
            ctx.fillStyle = nebula;
            ctx.fillRect(0, 0, W, H);

            let nebula2 = ctx.createRadialGradient(W*0.2, H*0.6, 0, W*0.2, H*0.6, 350);
            nebula2.addColorStop(0, 'rgba(65, 105, 225, 0.12)');
            nebula2.addColorStop(1, 'transparent');
            ctx.fillStyle = nebula2;
            ctx.fillRect(0, 0, W, H);

            // 星星
            for (let s of stars) {
                let tw = 0.6 + Math.sin(s.twinkle) * 0.4;
                ctx.globalAlpha = s.op * tw;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 流星
            for (let ss of shootingStars) {
                ctx.globalAlpha = ss.life;
                let grad = ctx.createLinearGradient(ss.x, ss.y, ss.x - ss.vx*ss.len/5, ss.y - ss.vy*ss.len/5);
                grad.addColorStop(0, 'rgba(255,255,255,0.9)');
                grad.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - ss.vx*ss.len/5, ss.y - ss.vy*ss.len/5);
                ctx.stroke();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(ss.x, ss.y, 2, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            if (gameState === STATE.START) {
                drawStart();
                return;
            }
            if (gameState === STATE.END) {
                drawGame();
                drawEnd();
                return;
            }

            drawGame();
        }

        function drawGame() {
            // 左侧星座列表
            drawZodiacList();

            // 右侧主显示区
            drawMainPanel();

            // 底部操作区
            drawActions();

            // 礼物选择弹窗
            if (showGiftSelect) drawGiftSelect();

            // 粒子和文字
            drawParticles();
            drawFloatTexts();

            // HUD
            drawHUD();

            // 事件横幅
            if (currentEvent && eventTimer > 0) {
                drawEventBanner();
            }
        }

        function drawZodiacList() {
            const px = 25, py = 90, pw = 200, ph = 560;

            // 面板
            ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.beginPath();
            ctx.roundRect(px, py, pw, ph, 18);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.25)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 标题
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 22px ZCOOL XiaoWei, serif';
            ctx.textAlign = 'center';
            ctx.fillText('✨ 黄道十二宫 ✨', px + pw/2, py + 35);

            // 12星座网格
            const cols = 3, rows = 4;
            const cw = (pw - 30) / cols;
            const ch = (ph - 70) / rows;

            for (let i = 0; i < 12; i++) {
                const z = zodiacs[i];
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = px + 15 + col * cw;
                const y = py + 55 + row * ch;
                const cxE = x + cw/2, cyE = y + ch/2;

                // 选中高亮
                if (i === selZodiac) {
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
                    ctx.beginPath();
                    ctx.roundRect(x + 2, y + 2, cw - 4, ch - 4, 12);
                    ctx.fill();

                    ctx.strokeStyle = '#ffd700';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.shadowColor = '#ffd700';
                    ctx.shadowBlur = 15;
                }

                // 解锁光环
                if (z.unlocked) {
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
                    ctx.beginPath();
                    ctx.arc(cxE, cyE - 8, 25, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 星座符号
                ctx.fillStyle = z.unlocked ? '#ffd700' : (i === selZodiac ? '#fff' : '#ccc');

        function drawParticles() {
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                if (p.type === 'star') {
                    drawStar(p.x, p.y, p.size * p.life);
                } else {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
        }

        function drawStar(x, y, s) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                let a = (i * Math.PI * 2) / 5 - Math.PI / 2;
                let px = Math.cos(a) * s;
                let py = Math.sin(a) * s;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
                let a2 = a + Math.PI / 5;
                ctx.lineTo(Math.cos(a2) * s * 0.4, Math.sin(a2) * s * 0.4);
            }
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (gameState === STATE.START) {
                initGame();
                gameState = STATE.PLAY;
                return;
            }

            if (gameState === STATE.END) {
                if (e.key.toLowerCase() === 'r') {
                    initGame();
                    gameState = STATE.PLAY;
                }
                return;
            }

            if (showGiftSelect) {
                if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    selectedGift = (selectedGift - 1 + 4) % 4;
                }
                if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    selectedGift = (selectedGift + 1) % 4;
                }
                if (e.key === ' ') {
                    confirmGift();
                    e.preventDefault();
                }
                if (e.key === 'Escape') {
                    showGiftSelect = false;
                }
                return;
            }

            if (e.key === 'ArrowLeft') {
                selZodiac = (selZodiac - 1 + 12) % 12;
                e.preventDefault();
            }
            if (e.key === 'ArrowRight') {
                selZodiac = (selZodiac + 1) % 12;
                e.preventDefault();
            }
            if (e.key === 'ArrowUp') {
                selAction = (selAction - 1 + ACTIONS.length) % ACTIONS.length;
                e.preventDefault();
            }
            if (e.key === 'ArrowDown') {
                selAction = (selAction + 1) % ACTIONS.length;
                e.preventDefault();
            }
            if (e.key === ' ') {
                doAction();
                e.preventDefault();
            }
            if (e.key.toLowerCase() === 'r') {
                initGame();
                gameState = STATE.PLAY;
            }
        });

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // 初始化
        zodiacs = ZODIAC_DATA.map(z => ({ ...z, affinity: 0, revealed: false, unlocked: false }));
        initStars();
        initOrbs();
        loop();
    </script>
</body>
</html>
