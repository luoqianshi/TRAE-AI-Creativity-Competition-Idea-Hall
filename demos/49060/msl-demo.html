<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSL - 多门店管理系统</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root {
  --primary:#1664FF;--primary-hover:rgba(22,100,255,0.8);--primary-active:#006EFF;
  --primary-bg-light:rgba(162,193,255,0.2);--primary-border-light:#A2C1FF;
  --text-1:#0C0D0E;--text-2:#42464E;--text-3:#737A87;--text-disabled:#C7CCD6;
  --bg-white:#FFFFFF;--bg-page:#F2F6FA;--bg-sidebar:#F6F8FA;--bg-hover:#F6F8FA;
  --border-1:#EAEDF1;--border-2:#DDE2E9;--border-3:#E1E4E8;
  --success-text:#00B365;--success-bg:#E8FFEA;--error-text:#F53F3F;--error-bg:#FDE2E2;
  --warning-text:#FF7D00;--warning-bg:#FFF3E5;
  --chart-line:#2E62F1;--chart-line-fill:rgba(46,98,241,0.1);
  --shadow-card:0 2px 6px 0 rgba(0,0,0,0.05);--shadow-topnav:0 2px 6px 0 rgba(0,0,0,0.05);
  --shadow-dropdown:0px 15px 35px -2px rgba(0,0,0,0.05),0px 5px 15px rgba(0,0,0,0.05);
  --shadow-modal:0 8px 40px rgba(0,0,0,0.12);--shadow-input:0 0 0 1px #DDE2E9;
  --shadow-input-focus:0 0 0 1px #1664FF,0 0 0 3px rgba(22,100,255,0.3);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",SimHei,Arial,Helvetica,sans-serif;
  --radius:4px;--radius-lg:8px;
  --height-lg:36px;--height-md:32px;--height-sm:28px;--height-xs:24px;
}
html,body{height:100%;font-family:var(--font);font-size:14px;color:var(--text-1);background:var(--bg-page)}
a{color:var(--primary);text-decoration:none;cursor:pointer}
a:hover{color:var(--primary-hover)}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;font-size:14px}
input,select,textarea{font-family:var(--font);font-size:14px;outline:none}
table{border-collapse:collapse;width:100%}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#C7CCD6;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* Button styles */
.btn-primary{background:var(--primary);color:#fff;height:var(--height-md);padding:0 16px;border-radius:var(--radius);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:background .15s}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:active{background:var(--primary-active)}
.btn-default{background:var(--bg-white);color:var(--text-1);height:var(--height-md);padding:0 16px;border-radius:var(--radius);font-size:14px;border:1px solid var(--border-2);display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:border-color .15s}
.btn-default:hover{border-color:var(--primary);color:var(--primary)}
.btn-text{background:transparent;color:var(--primary);height:auto;padding:0;font-size:13px;display:inline-flex;align-items:center;gap:4px;transition:opacity .15s}
.btn-text:hover{opacity:.8}
.btn-sm{height:var(--height-sm);padding:0 12px;font-size:13px}

/* Input style */
.input{height:var(--height-md);padding:0 12px;border:none;box-shadow:var(--shadow-input);border-radius:var(--radius);font-size:14px;color:var(--text-1);background:var(--bg-white);width:100%;transition:box-shadow .15s}
.input:focus{box-shadow:var(--shadow-input-focus)}
.input::placeholder{color:var(--text-disabled)}
.input-lg{height:var(--height-lg);padding:0 16px;font-size:15px}
textarea.input{height:auto;padding:8px 12px;resize:vertical}

/* Select wrapper */
.select-wrap{position:relative;display:inline-block}
.select-wrap::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);border:4px solid transparent;border-top:6px solid var(--text-3);pointer-events:none}
.select{height:var(--height-md);padding:0 32px 0 12px;border:none;box-shadow:var(--shadow-input);border-radius:var(--radius);font-size:14px;color:var(--text-1);background:var(--bg-white);appearance:none;-webkit-appearance:none;cursor:pointer;transition:box-shadow .15s}
.select:focus{box-shadow:var(--shadow-input-focus)}

/* Tag */
.tag{display:inline-flex;align-items:center;height:var(--height-xs);padding:0 8px;border-radius:var(--radius);font-size:12px;line-height:1}
.tag-success{background:var(--success-bg);color:var(--success-text)}
.tag-error{background:var(--error-bg);color:var(--error-text)}
.tag-warning{background:var(--warning-bg);color:var(--warning-text)}

/* Toast */
#toast-container{position:fixed;top:16px;right:16px;z-index:10000;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:var(--radius-lg);font-size:14px;color:#fff;box-shadow:var(--shadow-dropdown);animation:toastIn .25s ease;max-width:360px;display:flex;align-items:center;gap:8px}
.toast-success{background:#00B365}
.toast-error{background:#F53F3F}
.toast-warning{background:#FF7D00}
.toast-info{background:#1664FF}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
.modal{background:var(--bg-white);border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);width:520px;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;animation:scaleIn .2s ease}
.modal-header{padding:20px 24px 16px;font-size:16px;font-weight:600;color:var(--text-1);border-bottom:1px solid var(--border-1);display:flex;align-items:center;justify-content:space-between}
.modal-header .close-btn{background:none;font-size:18px;color:var(--text-3);width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);cursor:pointer}
.modal-header .close-btn:hover{background:var(--bg-hover);color:var(--text-1)}
.modal-body{padding:16px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:0 24px 20px;display:flex;justify-content:flex-end;gap:8px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}

/* Login View */
#login-view{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0a3d8f 0%,#1664FF 50%,#4d8eff 100%);position:relative;overflow:hidden}
#login-view::before{content:'';position:absolute;width:600px;height:600px;background:rgba(255,255,255,.03);border-radius:50%;top:-200px;right:-200px}
#login-view::after{content:'';position:absolute;width:400px;height:400px;background:rgba(255,255,255,.05);border-radius:50%;bottom:-100px;left:-100px}
.login-card{background:#fff;border-radius:var(--radius-lg);box-shadow:0 20px 60px rgba(0,0,0,.2);width:400px;padding:48px 40px;position:relative;z-index:1}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-size:28px;font-weight:700;color:var(--primary);letter-spacing:2px}
.login-logo p{font-size:13px;color:var(--text-3);margin-top:6px}
.login-form{display:flex;flex-direction:column;gap:16px}
.login-form .form-group{display:flex;flex-direction:column;gap:6px}
.login-form .form-group label{font-size:13px;color:var(--text-2);font-weight:500}
.demo-accounts{margin-top:20px;padding-top:20px;border-top:1px solid var(--border-1)}
.demo-accounts p{font-size:12px;color:var(--text-3);margin-bottom:10px}
.demo-account-btns{display:flex;gap:8px;flex-wrap:wrap}

/* Shop Selection View */
#shops-view{height:100vh;background:var(--bg-page);padding:40px;display:flex;flex-direction:column;align-items:center}
#shops-view .shops-header{text-align:center;margin-bottom:36px}
#shops-view .shops-header h1{font-size:24px;color:var(--text-1);margin-bottom:8px}
#shops-view .shops-header p{font-size:14px;color:var(--text-3)}
.shops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:100%;max-width:960px}
.shop-card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:24px;cursor:pointer;transition:box-shadow .2s,transform .15s;border:2px solid transparent}
.shop-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.1);transform:translateY(-2px);border-color:var(--primary-border-light)}
.shop-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.shop-card-header h3{font-size:16px;color:var(--text-1)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.active{background:var(--success-text)}
.status-dot.inactive{background:var(--text-disabled)}
.shop-card-address{font-size:13px;color:var(--text-3);margin-bottom:16px}
.shop-card-stats{display:flex;gap:16px}
.shop-card-stat{flex:1;padding:8px 0;border-radius:var(--radius);background:var(--bg-page)}
.shop-card-stat label{display:block;font-size:12px;color:var(--text-3);margin-bottom:4px}
.shop-card-stat span{font-size:14px;font-weight:600}
.shop-card-stat.income span{color:var(--success-text)}
.shop-card-stat.expense span{color:var(--error-text)}
.shop-card.disabled{opacity:.6;pointer-events:none}

/* Main Layout */
#app-layout{display:none;height:100vh;flex-direction:column}
.top-nav{height:48px;background:var(--bg-white);box-shadow:var(--shadow-topnav);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;position:relative;z-index:100}
.top-nav-left{display:flex;align-items:center;gap:12px}
.hamburger{width:24px;height:24px;display:flex;flex-direction:column;justify-content:center;gap:5px;cursor:pointer;padding:4px}
.hamburger span{display:block;width:16px;height:2px;background:var(--text-2);border-radius:1px;transition:all .2s}
.top-nav-logo{font-size:16px;font-weight:700;color:var(--primary);letter-spacing:1px}
.top-nav-right{display:flex;align-items:center;gap:16px}
.top-nav-search{position:relative}
.top-nav-search input{height:32px;width:200px;padding:0 12px 0 32px;box-shadow:var(--shadow-input);border-radius:16px;font-size:13px;background:var(--bg-page)}
.top-nav-search input:focus{box-shadow:var(--shadow-input-focus)}
.top-nav-search::before{content:'';position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;border:2px solid var(--text-disabled);border-radius:50%}
.top-nav-search::after{content:'';position:absolute;left:20px;top:calc(50% + 4px);width:5px;height:5px;background:var(--text-disabled);border-radius:0 0 2px 2px;transform:rotate(45deg)}
.notification-btn{position:relative;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;transition:background .15s;color:var(--text-3)}
.notification-btn:hover{background:var(--bg-hover)}
.notification-btn .badge{position:absolute;top:4px;right:4px;width:8px;height:8px;background:var(--error-text);border-radius:50%;border:1.5px solid #fff}
.top-nav-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600}
.main-body{display:flex;flex:1;overflow:hidden}
.sidebar{width:200px;background:var(--bg-sidebar);flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border-1)}
.sidebar-header{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border-1)}
.sidebar-header .shop-icon{width:32px;height:32px;border-radius:var(--radius);background:var(--primary-bg-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
.sidebar-header h3{font-size:14px;color:var(--text-1);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-menu{flex:1;padding:8px 0}
.menu-item{height:36px;display:flex;align-items:center;gap:10px;padding:0 16px;cursor:pointer;font-size:14px;color:var(--text-2);transition:all .15s;border-left:3px solid transparent;position:relative}
.menu-item:hover{background:var(--bg-hover);color:var(--text-1)}
.menu-item.active{background:rgba(22,100,255,0.06);color:var(--primary);border-left-color:var(--primary);font-weight:500}
.menu-item .icon{width:16px;text-align:center;font-size:14px}
.content-area{flex:1;overflow-y:auto;background:var(--bg-white);padding:20px 24px}
.view{display:none}
.view.active{display:block}

/* Dashboard */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:var(--bg-white);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:20px}
.stat-card .label{font-size:13px;color:var(--text-3);margin-bottom:8px}
.stat-card .value{font-size:24px;font-weight:700;color:var(--text-1)}
.stat-card .trend{font-size:12px;margin-top:4px;display:flex;align-items:center;gap:4px}
.stat-card .trend.up{color:var(--success-text)}
.stat-card .trend.down{color:var(--error-text)}
.chart-card{background:var(--bg-white);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:20px;margin-bottom:20px}
.chart-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.chart-card-header h3{font-size:15px;color:var(--text-1)}
.pill-group{display:flex;gap:4px;background:var(--bg-page);padding:3px;border-radius:20px}
.pill-btn{padding:4px 14px;border-radius:16px;font-size:13px;border:none;cursor:pointer;background:transparent;color:var(--text-3);transition:all .15s}
.pill-btn.active{background:rgba(162,193,255,0.2);color:var(--primary);border:1px solid var(--primary-border-light)}
.pill-btn:hover:not(.active){color:var(--text-1)}
.chart-canvas{width:100%;height:260px}
.transactions-list{background:var(--bg-white);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.transactions-list-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-1)}
.transactions-list-header h3{font-size:15px}
.tx-item{display:flex;align-items:center;padding:12px 20px;border-bottom:1px solid var(--border-1);transition:background .15s}
.tx-item:last-child{border-bottom:none}
.tx-item:hover{background:var(--bg-hover)}
.tx-item .tx-icon{width:36px;height:36px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:16px;margin-right:12px;flex-shrink:0}
.tx-item .tx-icon.income{background:var(--success-bg);color:var(--success-text)}
.tx-item .tx-icon.expense{background:var(--error-bg);color:var(--error-text)}
.tx-item .tx-info{flex:1;min-width:0}
.tx-item .tx-info .tx-desc{font-size:14px;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-item .tx-info .tx-time{font-size:12px;color:var(--text-3);margin-top:2px}
.tx-item .tx-amount{font-size:14px;font-weight:600;flex-shrink:0}
.tx-item .tx-amount.income{color:var(--success-text)}
.tx-item .tx-amount.expense{color:var(--error-text)}
.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.quick-action-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px;background:var(--bg-white);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);cursor:pointer;transition:all .2s;border:1px solid var(--border-1)}
.quick-action-btn:hover{border-color:var(--primary-border-light);box-shadow:0 4px 12px rgba(22,100,255,0.1);transform:translateY(-1px)}
.quick-action-btn .qa-icon{width:40px;height:40px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:18px}
.quick-action-btn .qa-label{font-size:13px;color:var(--text-2)}

/* Accounting */
.filter-bar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.filter-bar .select-wrap .select{min-width:140px}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.summary-item{padding:16px;border-radius:var(--radius-lg);border:1px solid var(--border-1)}
.summary-item .s-label{font-size:13px;color:var(--text-3)}
.summary-item .s-value{font-size:20px;font-weight:700;margin-top:6px}
.summary-item.income{border-left:3px solid var(--success-text)}
.summary-item.income .s-value{color:var(--success-text)}
.summary-item.expense{border-left:3px solid var(--error-text)}
.summary-item.expense .s-value{color:var(--error-text)}
.summary-item.balance{border-left:3px solid var(--primary)}
.summary-item.balance .s-value{color:var(--primary)}
.date-group{margin-bottom:20px}
.date-group-header{font-size:14px;font-weight:600;color:var(--text-2);padding:10px 0;border-bottom:1px solid var(--border-1);margin-bottom:0}
.data-table{width:100%;border:1px solid var(--border-1);border-radius:var(--radius-lg);overflow:hidden}
.data-table thead th{background:var(--bg-sidebar);font-size:13px;font-weight:500;color:var(--text-2);padding:10px 16px;text-align:left;border-bottom:1px solid var(--border-1);white-space:nowrap}
.data-table tbody td{padding:10px 16px;font-size:13px;color:var(--text-1);border-bottom:1px solid var(--border-1)}
.data-table tbody tr:hover{background:var(--bg-hover)}
.data-table tbody tr:last-child td{border-bottom:none}
.amount-positive{color:var(--success-text);font-weight:600}
.amount-negative{color:var(--error-text);font-weight:600}
.quick-amount-btns{display:flex;gap:6px;flex-wrap:wrap}
.quick-amount-btn{height:28px;padding:0 10px;border-radius:14px;font-size:12px;border:1px solid var(--border-2);background:var(--bg-white);color:var(--text-2);cursor:pointer;transition:all .15s}
.quick-amount-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg-light)}

/* Inventory */
.stock-warning{background:var(--warning-bg);color:var(--warning-text);font-size:12px;padding:2px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:3px}
.batch-bar{position:fixed;bottom:0;left:200px;right:0;height:52px;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:50;border-top:1px solid var(--border-1)}
.batch-progress{width:200px;height:6px;background:var(--bg-page);border-radius:3px;overflow:hidden}
.batch-progress-bar{height:100%;background:var(--primary);border-radius:3px;transition:width .3s ease}
.batch-info{font-size:13px;color:var(--text-2)}
.batch-actions{display:flex;gap:8px}
.stock-diff{font-weight:600}
.stock-diff.positive{color:var(--success-text)}
.stock-diff.negative{color:var(--error-text)}
.count-input{width:80px;text-align:center}
.highlight-row{background:#FFF9E6 !important}

/* Reports */
.period-tabs{display:flex;gap:0;border-bottom:2px solid var(--border-1);margin-bottom:20px}
.period-tab{padding:8px 20px;font-size:14px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;background:none}
.period-tab:hover{color:var(--text-1)}
.period-tab.active{color:var(--primary);border-bottom-color:var(--primary-active);font-weight:500}
.reports-charts{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:20px}
.donut-canvas{width:100%;height:260px}
.export-bar{display:flex;justify-content:flex-end;margin-bottom:16px}
</style>
</head>
<body>
<div id="toast-container"></div>

<!-- Login View -->
<div id="login-view">
  <div class="login-card">
    <div class="login-logo">
      <h1>MSL</h1>
      <p>多门店智能管理系统</p>
    </div>
    <div class="login-form">
      <div class="form-group">
        <label>邮箱</label>
        <input class="input input-lg" id="login-email" type="email" placeholder="请输入邮箱地址">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="input input-lg" id="login-password" type="password" placeholder="请输入密码">
      </div>
      <button class="btn-primary" style="height:40px;font-size:15px;margin-top:4px" onclick="doLogin()">登 录</button>
      <div class="demo-accounts">
        <p>演示账号（点击快速填入）：</p>
        <div class="demo-account-btns">
          <button class="btn-default btn-sm" onclick="fillLogin('zhangsan@demo.com')">张三</button>
          <button class="btn-default btn-sm" onclick="fillLogin('lisi@demo.com')">李四</button>
          <button class="btn-default btn-sm" onclick="fillLogin('wangwu@demo.com')">王五</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Shop Selection View -->
<div id="shops-view" style="display:none">
  <div class="shops-header">
    <h1>选择门店</h1>
    <p>请选择要管理的门店</p>
  </div>
  <div class="shops-grid" id="shops-grid"></div>
</div>

<!-- Main App Layout -->
<div id="app-layout">
  <div class="top-nav">
    <div class="top-nav-left">
      <div class="hamburger" onclick="toggleSidebar()"><span></span><span></span></div>
      <div class="top-nav-logo">MSL</div>
    </div>
    <div class="top-nav-right">

// Generate transactions
function genTransactions() {
  var txs = {};
  var now = new Date();
  var rng = function(seed){ var x = Math.sin(seed)*10000; return x - Math.floor(x); };
  var seed = 42;
  shops.forEach(function(shop){
    if(!shop.status || shop.status !== 'active') { shop._txs = []; return; }
    var list = [];
    var prods = products[shop.id] || [];
    for(var i=0;i<60;i++){
      seed++;
      var isIncome = rng(seed+i*7) > 0.4;
      var type = isIncome ? 'income' : 'expense';
      seed++; var dIdx = Math.floor(rng(seed+i*3)*descriptions[type].length);
      var desc = descriptions[type][dIdx];
      seed++; var aIdx = Math.floor(rng(seed+i*5)*accounts.length);
      var account = accounts[aIdx];
      seed++;
      var amount;
      if(type==='income' && prods.length>0){
        seed++; var pIdx = Math.floor(rng(seed+i*2)*prods.length);
        amount = prods[pIdx].price * (1 + Math.floor(rng(seed+i)*3));
      } else {
        amount = Math.floor(rng(seed+i*11)*8000)+100;
      }
      seed++;
      var daysAgo = Math.floor(rng(seed+i*13)*180);
      var hoursAgo = Math.floor(rng(seed+i*17)*12)+8;
      var d = new Date(now.getTime() - daysAgo*86400000 - (24-hoursAgo)*3600000);
      list.push({ id:'tx'+shop.id+i, type:type, desc:desc, amount:amount, account:account, date:d, shopId:shop.id });
    }
    list.sort(function(a,b){ return b.date - a.date; });
    shop._txs = list;
  });
  return txs;
}
genTransactions();

// Generate report data
function genReports() {
  var reports = {};
  shops.forEach(function(shop){
    if(!shop._txs || shop._txs.length===0) return;
    var monthly = {};
    shop._txs.forEach(function(tx){
      var key = tx.date.getFullYear()+'-'+String(tx.date.getMonth()+1).padStart(2,'0');
      if(!monthly[key]) monthly[key] = {income:0,expense:0,count:0};
      if(tx.type==='income') monthly[key].income += tx.amount;
      else monthly[key].expense += tx.amount;
      monthly[key].count++;
    });
    var arr = Object.keys(monthly).sort();
    shop._reports = arr.map(function(k){ return {month:k,income:monthly[k].income,expense:monthly[k].expense,count:monthly[k].count}; });
  });
}

function formatNum(n){ return n.toLocaleString('zh-CN'); }
function formatMoney(n){ return (n>=0?'+':'') + '\u00A5' + formatNum(n); }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDateTime(d){ return fmtDate(d)+' '+fmtTime(d); }
function todayKey(){ var n=new Date(); return fmtDate(n); }
function weekAgoKey(){ var d=new Date(); d.setDate(d.getDate()-6); return fmtDate(d); }
function monthKey(){ var n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); }
function getTodayStats(){
  var tk = todayKey();
  var inc=0,exp=0;
  (currentShop._txs||[]).forEach(function(tx){ if(fmtDate(tx.date)===tk){ if(tx.type==='income') inc+=tx.amount; else exp+=tx.amount; }});
  return {income:inc,expense:exp,balance:inc-exp};
}
function getMonthStats(){
  var mk = monthKey();
  var inc=0,exp=0;
  (currentShop._txs||[]).forEach(function(tx){ var k=fmtDate(tx.date).substring(0,7); if(k===mk){ if(tx.type==='income') inc+=tx.amount; else exp+=tx.amount; }});
  return {income:inc,expense:exp,balance:inc-exp};
}

function drawLineChart(days) {
  var canvas = document.getElementById('line-chart');
  if(!canvas) return;
  var rect = canvas.parentElement.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  canvas.width = (rect.width - 40) * dpr;
  canvas.height = 260 * dpr;
  canvas.style.width = (rect.width - 40) + 'px';
  canvas.style.height = '260px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var w = rect.width - 40, ht = 260;
  // gather data
  var data = [];
  var now = new Date();
  for(var i=days-1;i>=0;i--){
    var d = new Date(now.getTime()-i*86400000);
    var dk = fmtDate(d);
    var inc = 0;
    (currentShop._txs||[]).forEach(function(tx){ if(fmtDate(tx.date)===dk && tx.type==='income') inc+=tx.amount; });
    data.push({label: (d.getMonth()+1)+'/'+d.getDate(), value:inc});
  }
  var maxVal = 0;
  data.forEach(function(d){ if(d.value>maxVal) maxVal=d.value; });
  maxVal = Math.max(maxVal, 100);
  var pad = {top:20,right:20,bottom:30,left:60};
  var cw = w-pad.left-pad.right;
  var ch = ht-pad.top-pad.bottom;
  ctx.clearRect(0,0,w,ht);
  // grid
  ctx.strokeStyle = '#EAEDF1';
  ctx.lineWidth = 1;
  for(var j=0;j<5;j++){
    var y = pad.top + ch/4*j;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(w-pad.right,y); ctx.stroke();
    ctx.fillStyle = '#737A87'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText('\u00A5'+formatNum(Math.round(maxVal - maxVal/4*j)), pad.left-8, y+4);
  }
  // x labels
  var step = Math.max(1, Math.floor(data.length/7));
  data.forEach(function(d,i){
    if(i%step===0 || i===data.length-1){
      var x = pad.left + cw/(data.length-1)*i;
      ctx.fillStyle = '#737A87'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(d.label, x, ht-8);
    }
  });
  // line
  ctx.beginPath();
  ctx.strokeStyle = '#2E62F1';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  var points = [];
  data.forEach(function(d,i){
    var x = pad.left + cw/(data.length-1)*i;
    var y = pad.top + ch - (d.value/maxVal)*ch;
    points.push({x:x,y:y});
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // fill
  ctx.beginPath();
  ctx.moveTo(points[0].x, pad.top+ch);
  points.forEach(function(p){ ctx.lineTo(p.x,p.y); });
  ctx.lineTo(points[points.length-1].x, pad.top+ch);
  ctx.closePath();
  var grad = ctx.createLinearGradient(0,pad.top,0,pad.top+ch);
  grad.addColorStop(0,'rgba(46,98,241,0.15)');
  grad.addColorStop(1,'rgba(46,98,241,0.01)');
  ctx.fillStyle = grad;
  ctx.fill();
  // dots
  points.forEach(function(p){
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#2E62F1'; ctx.lineWidth = 2; ctx.stroke();
  });
}

function applyFilters() {
  var typeF = document.getElementById('filter-type') ? document.getElementById('filter-type').value : '';
  var accF = document.getElementById('filter-account') ? document.getElementById('filter-account').value : '';
  var perF = document.getElementById('filter-period') ? document.getElementById('filter-period').value : 'month';
  typeFilter = typeF; accountFilter = accF; periodFilter = perF;
  var txs = currentShop._txs || [];
  var now = new Date();
  var filtered = txs.filter(function(tx){
    if(typeF && tx.type !== typeF) return false;
    if(accF && tx.account !== accF) return false;
    if(perF === 'month'){
      var k = fmtDate(tx.date).substring(0,7);
      var mk = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
      if(k !== mk) return false;
    } else if(perF === 'week'){
      if(now.getTime() - tx.date.getTime() > 7*86400000) return false;
    }
    return true;
  });
  var container = document.getElementById('tx-table-container');
  if(!container) return;
  if(filtered.length === 0){
    container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-3)">暂无记录</div>';
    return;
  }
  // group by date
  var groups = {};
  filtered.forEach(function(tx){
    var dk = fmtDate(tx.date);
    if(!groups[dk]) groups[dk] = [];
    groups[dk].push(tx);
  });
  var h = '';
  var dates = Object.keys(groups).sort().reverse();
  dates.forEach(function(dk){
    h += '<div class="date-group"><div class="date-group-header">'+dk+'</div>';
    h += '<table class="data-table"><thead><tr><th>描述</th><th>类型</th><th>账户</th><th style="text-align:right">金额</th><th style="text-align:right">操作</th></tr></thead><tbody>';
    groups[dk].forEach(function(tx){
      var tc = tx.type==='income'?'tag-success':'tag-error';
      var tl = tx.type==='income'?'收入':'支出';
      var ac = tx.type==='income'?'amount-positive':'amount-negative';
      var sign = tx.type==='income'?'+':'-';
      h += '<tr><td>'+tx.desc+'</td><td><span class="tag '+tc+'">'+tl+'</span></td><td>'+tx.account+'</td><td style="text-align:right" class="'+ac+'">'+sign+'\u00A5'+formatNum(tx.amount)+'</td><td style="text-align:right"><a class="btn-text" onclick="Toast(\'已删除\',\'success\')">删除</a></td></tr>';
    });
    h += '</tbody></table></div>';
  });
  container.innerHTML = h;
}

function openAddRecord() {
  var mc = document.getElementById('modal-container');
  var h = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">';
  h += '<div class="modal-header"><span>新增记录</span><span class="close-btn" onclick="closeModal()">&times;</span></div>';
  h += '<div class="modal-body">';
  h += '<div style="display:flex;gap:8px;margin-bottom:16px">';
  h += '<button class="btn-primary" id="modal-type-income" onclick="setRecordType(\'income\')" style="flex:1">收入</button>';
  h += '<button class="btn-default" id="modal-type-expense" onclick="setRecordType(\'expense\')" style="flex:1">支出</button>';
  h += '</div>';
  h += '<div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-2);display:block;margin-bottom:6px">账户</label>';
  h += '<div class="select-wrap" style="width:100%"><select class="select" id="modal-account" style="width:100%">';
  accounts.forEach(function(a){ h+='<option value="'+a+'">'+a+'</option>'; });
  h += '</select></div></div>';
  h += '<div style="margin-bottom:12px"><label style="font-size:13px;color:var(--text-2);display:block;margin-bottom:6px">金额</label>';
  h += '<input class="input" id="modal-amount" type="number" placeholder="请输入金额" style="font-size:18px;font-weight:600;height:40px">';
  h += '<div class="quick-amount-btns" style="margin-top:8px">';
  [100,200,500,1000,2000,5000].forEach(function(n){
    h += '<button class="quick-amount-btn" onclick="document.getElementById(\'modal-amount\').value='+n+'">\u00A5'+n+'</button>';
  });
  h += '</div></div>';
  h += '<div style="margin-bottom:0"><label style="font-size:13px;color:var(--text-2);display:block;margin-bottom:6px">描述</label>';
  h += '<input class="input" id="modal-desc" placeholder="请输入描述"></div>';
  h += '</div>';
  h += '<div class="modal-footer"><button class="btn-default" onclick="closeModal()">取消</button><button class="btn-primary" onclick="saveRecord()">保存</button></div>';
  h += '</div></div>';
  mc.innerHTML = h;
}

var recordType = 'income';
function setRecordType(t) {
  recordType = t;
  var ei = document.getElementById('modal-type-income');
  var ee = document.getElementById('modal-type-expense');
  if(t==='income'){ ei.className='btn-primary'; ei.style.flex='1'; ee.className='btn-default'; ee.style.flex='1'; }
  else { ee.className='btn-primary'; ee.style.flex='1'; ei.className='btn-default'; ei.style.flex='1'; }
}

function saveRecord() {
  var amt = parseFloat(document.getElementById('modal-amount').value);
  var desc = document.getElementById('modal-desc').value.trim();
  var acc = document.getElementById('modal-account').value;
  if(!amt||amt<=0){ Toast('请输入有效金额','warning'); return; }
  if(!desc){ Toast('请输入描述','warning'); return; }
  var tx = { id:'tx-new-'+Date.now(), type:recordType, desc:desc, amount:amt, account:acc, date:new Date(), shopId:currentShop.id };
  currentShop._txs.unshift(tx);
  closeModal();
  Toast('记录已保存','success');
  if(currentView==='accounting') renderAccounting();
  else if(currentView==='dashboard') renderDashboard();
}

function closeModal() {
  document.getElementById('modal-container').innerHTML = '';
}

// ========== INVENTORY ==========
function renderInventory() {
  var v = document.getElementById('view-inventory');
  var prods = products[currentShop.id] || [];
  var h = '';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">';
  h += '<div style="display:flex;gap:8px">';
  h += '<button class="btn-primary" onclick="startBatchCount()">批量盘点</button>';
  h += '</div>';
  h += '<div style="font-size:13px;color:var(--text-3)">共 '+prods.length+' 个商品</div>';
  h += '</div>';
  h += '<table class="data-table"><thead><tr><th>商品名称</th><th>分类</th><th>单价</th><th>当前库存</th><th>状态</th><th style="text-align:right">操作</th></tr></thead><tbody>';
  prods.forEach(function(p,i){
    var warn = p.stock < 10;
    h += '<tr id="inv-row-'+i+'">';
    h += '<td><strong>'+p.name+'</strong></td>';
    h += '<td>'+p.category+'</td>';
    h += '<td>\u00A5'+formatNum(p.price)+'</td>';
    h += '<td>'+p.stock+'</td>';
    h += '<td>'+(warn?'<span class="stock-warning">\u26A0 库存不足</span>':'<span class="tag tag-success">正常</span>')+'</td>';
    h += '<td style="text-align:right"><a class="btn-text" onclick="openCountModal('+i+')">盘点</a></td>';
    h += '</tr>';
  });
  h += '</tbody></table>';
  v.innerHTML = h;
}

function openCountModal(idx) {
  var p = products[currentShop.id][idx];
  var mc = document.getElementById('modal-container');
  var diff = batchCounts[idx] !== undefined ? batchCounts[idx] - p.stock : 0;
  var h = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:400px">';
  h += '<div class="modal-header"><span>盘点 - '+p.name+'</span><span class="close-btn" onclick="closeModal()">&times;</span></div>';
  h += '<div class="modal-body">';
  h += '<div style="text-align:center;margin:20px 0">';
  h += '<div style="font-size:13px;color:var(--text-3);margin-bottom:8px">系统库存：'+p.stock+'</div>';
  h += '<input class="input count-input" id="count-value" type="number" value="'+p.stock+'" style="width:120px;height:48px;font-size:24px;text-align:center;font-weight:600">';
  h += '<div id="count-diff" style="margin-top:12px;font-size:14px;color:var(--text-3)">差异数：0</div>';
  h += '</div></div>';
  h += '<div class="modal-footer"><button class="btn-default" onclick="closeModal()">取消</button><button class="btn-primary" onclick="saveCount('+idx+')">确认</button></div>';
  h += '</div></div>';
  mc.innerHTML = h;
  setTimeout(function(){
    var inp = document.getElementById('count-value');
    if(inp){ inp.focus(); inp.select();
      inp.addEventListener('input', function(){
        var val = parseInt(this.value)||0;
        var d = val - p.stock;
        var el = document.getElementById('count-diff');
        if(el){
          if(d===0){ el.innerHTML='差异数：0'; el.style.color='var(--text-3)'; }
          else if(d>0){ el.innerHTML='差异数：+'+d+' (盘盈)'; el.style.color='var(--success-text)'; }
          else{ el.innerHTML='差异数：'+d+' (盘亏)'; el.style.color='var(--error-text)'; }
        }
      });
    }
  },100);
}

function saveCount(idx) {
  var val = parseInt(document.getElementById('count-value').value);
  var p = products[currentShop.id][idx];
  if(isNaN(val)||val<0){ Toast('请输入有效数量','warning'); return; }
  var diff = val - p.stock;
  p.stock = val;
  batchCounts[idx] = val;
  closeModal();
  Toast(p.name+' 盘点完成，差异：'+(diff>=0?'+':'')+diff, diff===0?'info':(diff>0?'success':'warning'));
  renderInventory();
}

// Batch Count
function startBatchCount() {
  batchMode = true;
  batchIndex = 0;
  batchCounts = {};
  renderInventory();
  showBatchBar();
  focusBatchRow(0);
}

function showBatchBar() {
  var bar = document.getElementById('batch-bar');
  var prods = products[currentShop.id] || [];
  var total = prods.length;
  bar.style.display = 'flex';
  var h = '<div class="batch-info">批量盘点 <strong>'+(batchIndex+1)+'</strong> / '+total+'</div>';
  h += '<div class="batch-progress"><div class="batch-progress-bar" id="batch-pbar" style="width:'+((batchIndex+1)/total*100)+'%"></div></div>';
  h += '<div class="batch-actions">';
  h += '<button class="btn-default btn-sm" onclick="endBatch()">结束盘点</button>';
  h += '<button class="btn-primary btn-sm" onclick="batchNext()">下一个 (Enter)</button>';
  h += '</div>';
  bar.innerHTML = h;
}

function focusBatchRow(idx) {
  var prods = products[currentShop.id] || [];
  if(idx >= prods.length){ endBatch(); return; }
  batchIndex = idx;
  // highlight row
  document.querySelectorAll('.highlight-row').forEach(function(r){ r.classList.remove('highlight-row'); });
  var row = document.getElementById('inv-row-'+idx);
  if(row){ row.classList.add('highlight-row'); row.scrollIntoView({behavior:'smooth',block:'center'}); }
  showBatchBar();
}

function batchNext() {
  var inp = document.getElementById('batch-input-active');
  if(inp){
    var val = parseInt(inp.value);
    var p = products[currentShop.id][batchIndex];
    if(!isNaN(val)){
      batchCounts[batchIndex] = val;
      p.stock = val;
    }
  }
  if(batchIndex + 1 >= products[currentShop.id].length){ endBatch(); return; }
  focusBatchRow(batchIndex + 1);
}

function endBatch() {
  batchMode = false;
  document.getElementById('batch-bar').style.display = 'none';
  document.querySelectorAll('.highlight-row').forEach(function(r){ r.classList.remove('highlight-row'); });
  var diffCount = 0;
  Object.keys(batchCounts).forEach(function(idx){
    var orig = products[currentShop.id][idx] ? products[currentShop.id][idx].stock : 0;
    if(batchCounts[idx] !== orig) diffCount++;
  });
  Toast('批量盘点完成，'+diffCount+' 项存在差异','success');
  renderInventory();
}

// Keyboard handler for batch
document.addEventListener('keydown', function(e){
  if(!batchMode) return;
  if(e.key === 'Enter'){ e.preventDefault(); batchNext(); }
});

// ========== REPORTS ==========
var reportPeriod = 'month';
function renderReports() {
  var v = document.getElementById('view-reports');
  var h = '';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">';
  h += '<div class="period-tabs" id="report-period-tabs">';
  ['today','week','month','year'].forEach(function(p){
    var labels = {today:'今日',week:'本周',month:'本月',year:'本年'};
    var cls = reportPeriod===p?' active':'';
    h += '<button class="period-tab'+cls+'" onclick="setReportPeriod(\''+p+'\')">'+labels[p]+'</button>';
  });
  h += '</div>';
  h += '<button class="btn-default" onclick="exportCSV()"><span style="margin-right:4px">&#8615;</span>导出CSV</button>';
  h += '</div>';
  h += '<div class="reports-charts">';
  h += '<div class="chart-card"><div class="chart-card-header"><h3>收支对比</h3></div><canvas id="bar-chart" class="chart-canvas"></canvas></div>';
  h += '<div class="chart-card"><div class="chart-card-header"><h3>收支比例</h3></div><canvas id="donut-chart" class="donut-canvas"></canvas></div>';
  h += '</div>';
  h += '<div class="chart-card"><div class="chart-card-header"><h3>数据明细</h3></div>';
  h += '<div id="report-table-container"></div></div>';
  v.innerHTML = h;
  setTimeout(function(){ drawBarChart(); drawDonutChart(); renderReportTable(); },50);
}

function setReportPeriod(p) {
  reportPeriod = p;
  renderReports();
}

function getReportData() {
  var txs = currentShop._txs || [];
  var now = new Date();
  var filtered = txs.filter(function(tx){
    if(reportPeriod==='today') return fmtDate(tx.date) === fmtDate(now);
    if(reportPeriod==='week') return now.getTime()-tx.date.getTime() < 7*86400000;
    if(reportPeriod==='month'){
      return fmtDate(tx.date).substring(0,7) === now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    }
    if(reportPeriod==='year') return tx.date.getFullYear() === now.getFullYear();
    return true;
  });
  return filtered;
}

function drawBarChart() {
  var canvas = document.getElementById('bar-chart');
  if(!canvas) return;
  var rect = canvas.parentElement.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  var w = rect.width - 40;
  canvas.width = w * dpr; canvas.height = 260 * dpr;
  canvas.style.width = w+'px'; canvas.style.height = '260px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var reports = currentShop._reports || [];
  var data = reports.slice(-6);
  if(data.length===0) data = [{month:'本月',income:0,expense:0}];
  var pad = {top:20,right:20,bottom:40,left:60};
  var cw = w-pad.left-pad.right;
  var ch = 260-pad.top-pad.bottom;
  ctx.clearRect(0,0,w,260);
  var maxVal = 0;
  data.forEach(function(d){ if(d.income>maxVal) maxVal=d.income; if(d.expense>maxVal) maxVal=d.expense; });
  maxVal = Math.max(maxVal,100);
  // grid
  ctx.strokeStyle = '#EAEDF1'; ctx.lineWidth = 1;
  for(var j=0;j<5;j++){
    var y = pad.top+ch/4*j;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(w-pad.right,y); ctx.stroke();
    ctx.fillStyle='#737A87'; ctx.font='11px sans-serif'; ctx.textAlign='right';
    ctx.fillText('\u00A5'+formatNum(Math.round(maxVal-maxVal/4*j)),pad.left-8,y+4);
  }
  var bw = Math.min(30, cw/data.length/3);
  var gap = cw/data.length;
  data.forEach(function(d,i){
    var x = pad.left + gap*i + gap/2;
    // income bar
    var hi = (d.income/maxVal)*ch;
    ctx.fillStyle = '#00B365';
    ctx.fillRect(x-bw-2, pad.top+ch-hi, bw, hi);
    // expense bar
    var he = (d.expense/maxVal)*ch;
    ctx.fillStyle = '#F53F3F';
    ctx.fillRect(x+2, pad.top+ch-he, bw, he);
    // label
    ctx.fillStyle='#737A87'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(d.month, x, 260-10);
  });
  // legend
  ctx.fillStyle='#00B365'; ctx.fillRect(w-150,pad.top,12,12);
  ctx.fillStyle='#42464E'; ctx.font='12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('收入',w-134,pad.top+10);
  ctx.fillStyle='#F53F3F'; ctx.fillRect(w-80,pad.top,12,12);
  ctx.fillStyle='#42464E'; ctx.fillText('支出',w-64,pad.top+10);
}

function drawDonutChart() {
  var canvas = document.getElementById('donut-chart');
  if(!canvas) return;
  var rect = canvas.parentElement.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  var w = rect.width - 40;
  canvas.width = w*dpr; canvas.height = 260*dpr;
  canvas.style.width = w+'px'; canvas.style.height = '260px';
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var data = getReportData();
  var income=0, expense=0;
  data.forEach(function(tx){ if(tx.type==='income') income+=tx.amount; else expense+=tx.amount; });
  var total = income+expense;
  if(total===0){ ctx.fillStyle='#C7CCD6'; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('暂无数据',w/2,130); return; }
  var cx = w/2, cy = 130, r = 80, inner = 50;
  // income arc
  var incAngle = (income/total)*Math.PI*2;
  ctx.beginPath(); ctx.arc(cx,cy,r, -Math.PI/2, -Math.PI/2+incAngle);
  ctx.arc(cx,cy,inner, -Math.PI/2+incAngle, -Math.PI/2, true);
  ctx.closePath(); ctx.fillStyle='#00B365'; ctx.fill();
  // expense arc
  ctx.beginPath(); ctx.arc(cx,cy,r, -Math.PI/2+incAngle, -Math.PI/2+Math.PI*2);
  ctx.arc(cx,cy,inner, -Math.PI/2+Math.PI*2, -Math.PI/2+incAngle, true);
  ctx.closePath(); ctx.fillStyle='#F53F3F'; ctx.fill();
  // center text
  ctx.fillStyle='#0C0D0E'; ctx.font='bold 18px sans-serif'; ctx.textAlign='center';
  ctx.fillText('\u00A5'+formatNum(total), cx, cy-2);
  ctx.fillStyle='#737A87'; ctx.font='12px sans-serif';
  ctx.fillText('总金额', cx, cy+16);
  // legend below
  ctx.fillStyle='#00B365'; ctx.fillRect(cx-60, cy+r+20, 10, 10);
  ctx.fillStyle='#42464E'; ctx.font='12px sans-serif'; ctx.textAlign='left';
  ctx.fillText('收入 \u00A5'+formatNum(income)+' ('+Math.round(income/total*100)+'%)', cx-46, cy+r+29);
  ctx.fillStyle='#F53F3F'; ctx.fillRect(cx-60, cy+r+40, 10, 10);
  ctx.fillStyle='#42464E';
  ctx.fillText('支出 \u00A5'+formatNum(expense)+' ('+Math.round(expense/total*100)+'%)', cx-46, cy+r+49);
}

function renderReportTable() {
  var data = getReportData();
  var container = document.getElementById('report-table-container');
  if(!container) return;
  if(data.length===0){ container.innerHTML='<div style="text-align:center;padding:40px;color:var(--text-3)">暂无数据</div>'; return; }
  var totalIncome=0, totalExpense=0;
  data.forEach(function(tx){ if(tx.type==='income') totalIncome+=tx.amount; else totalExpense+=tx.amount; });
  var h = '<table class="data-table"><thead><tr><th>日期</th><th>描述</th><th>类型</th><th>账户</th><th style="text-align:right">金额</th></tr></thead><tbody>';
  data.slice(0,20).forEach(function(tx){
    var tc = tx.type==='income'?'tag-success':'tag-error';
    var tl = tx.type==='income'?'收入':'支出';
    var ac = tx.type==='income'?'amount-positive':'amount-negative';
    var sign = tx.type==='income'?'+':'-';
    h += '<tr><td>'+fmtDate(tx.date)+'</td><td>'+tx.desc+'</td><td><span class="tag '+tc+'">'+tl+'</span></td><td>'+tx.account+'</td><td style="text-align:right" class="'+ac+'">'+sign+'\u00A5'+formatNum(tx.amount)+'</td></tr>';
  });
  h += '</tbody><tfoot><tr style="background:var(--bg-sidebar);font-weight:600"><td colspan="4" style="padding:10px 16px">合计</td>';
  h += '<td style="text-align:right;padding:10px 16px"><span class="amount-positive">+\u00A5'+formatNum(totalIncome)+'</span> / <span class="amount-negative">-\u00A5'+formatNum(totalExpense)+'</span></td>';
  h += '</tr></tfoot></table>';
  if(data.length>20) h += '<div style="text-align:center;padding:12px;font-size:13px;color:var(--text-3)">显示前20条，共'+data.length+'条记录</div>';
  container.innerHTML = h;
}

function exportCSV() {
  var data = getReportData();
  if(data.length===0){ Toast('无数据可导出','warning'); return; }
  var csv = '\uFEFF日期,描述,类型,账户,金额\n';
  data.forEach(function(tx){
    csv += fmtDate(tx.date)+','+tx.desc+','+(tx.type==='income'?'收入':'支出')+','+tx.account+','+(tx.type==='income'?'':'-')+tx.amount+'\n';
  });
  var blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'MSL报表_'+fmtDate(new Date())+'.csv';
  a.click(); URL.revokeObjectURL(url);
  Toast('CSV导出成功','success');
}

window.addEventListener('resize', function(){
  if(currentView==='dashboard') drawLineChart(7);
  else if(currentView==='reports'){ drawBarChart(); drawDonutChart(); }
});

// Enter key for login
document.getElementById('login-password').addEventListener('keydown', function(e){
  if(e.key==='Enter') doLogin();
});
