<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性格测试与职业推荐系统</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        .card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;display:none;animation:fadeIn .5s ease}
        .card.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;padding:35px 30px;text-align:center}
        .header h1{font-size:2em;margin-bottom:10px}
        .header p{font-size:1.05em;opacity:.9}
        .content{padding:35px 30px}
        .welcome-content{text-align:center}
        .welcome-icon{font-size:70px;margin-bottom:15px}
        .welcome-text{color:#666;font-size:1.05em;line-height:1.8;margin-bottom:25px}
        .btn{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;padding:14px 45px;font-size:1.05em;border-radius:30px;cursor:pointer;transition:transform .3s,box-shadow .3s}
        .btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(102,126,234,.4)}
        .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .progress-bar{background:#e0e0e0;height:10px;border-radius:5px;margin-bottom:25px;overflow:hidden}
        .progress-fill{background:linear-gradient(90deg,#667eea,#764ba2);height:100%;transition:width .3s ease;border-radius:5px}
        .question-text{font-size:1.25em;color:#333;margin-bottom:25px;line-height:1.6}
        .options{display:flex;flex-direction:column;gap:12px}
        .option{padding:18px 22px;border:2px solid #e0e0e0;border-radius:15px;cursor:pointer;transition:all .3s ease;font-size:1em;color:#555}
        .option:hover{border-color:#667eea;background:#f8f6ff}
        .option.selected{border-color:#667eea;background:linear-gradient(135deg,rgba(102,126,234,.1),rgba(118,75,162,.1));color:#667eea;font-weight:500}
        .nav-buttons{display:flex;justify-content:space-between;margin-top:25px}
        .btn-nav{padding:12px 28px;font-size:1em;border-radius:25px;cursor:pointer;transition:all .3s}
        .btn-prev{background:#e0e0e0;color:#666;border:none}
        .btn-prev:hover{background:#d0d0d0}
        .btn-next{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none}
        .btn-next:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4)}
        .result-header{text-align:center;padding:35px 30px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
        .mbti-type{font-size:3.5em;font-weight:bold;margin-bottom:8px}
        .type-name{font-size:1.6em;margin-bottom:12px}
        .type-desc{font-size:1.05em;opacity:.9;line-height:1.6}
        .result-content{padding:25px}
        .section-title{font-size:1.3em;color:#667eea;margin:25px 0 15px;padding-bottom:8px;border-bottom:2px solid #667eea}
        .career-card{background:linear-gradient(135deg,#f8f6ff 0%,#fff 100%);border-radius:15px;padding:22px;margin-bottom:22px;border:1px solid #e0e0e0}
        .career-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
        .career-name{font-size:1.2em;color:#333;font-weight:600}
        .match-badge{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:6px 18px;border-radius:20px;font-weight:600;font-size:.95em}
        .career-desc{color:#666;line-height:1.6;margin-bottom:15px;font-size:.95em}
        .majors-list{margin-bottom:15px}
        .majors-title{font-weight:600;color:#555;margin-bottom:8px;font-size:.95em}
        .major-tag{display:inline-flex;align-items:center;gap:4px;background:#667eea;color:#fff;padding:5px 12px;border-radius:15px;margin:4px 4px 4px 0;font-size:.88em}
        .major-tag .rank{background:rgba(255,255,255,.3);padding:1px 6px;border-radius:8px;font-size:.85em}
        .major-tag .rank-a{background:#ff6b6b}.major-tag .rank-b{background:#ffd93d;color:#333}
        .score-input-section{background:#f0eeff;border-radius:15px;padding:22px;margin-bottom:25px;border:2px dashed #667eea}
        .score-input-section h3{color:#667eea;margin-bottom:15px;font-size:1.1em}
        .input-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
        .input-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
        .input-group label{font-size:.85em;color:#666;font-weight:500}
        .input-group select,.input-group input{padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:.95em;outline:none;transition:border-color .3s}
        .input-group select:focus,.input-group input:focus{border-color:#667eea}
        .btn-search{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:10px 30px;border-radius:10px;cursor:pointer;font-size:1em;transition:all .3s;align-self:flex-end}
        .btn-search:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4)}
        .loading{text-align:center;padding:30px;color:#667eea;font-size:1.1em}
        .loading .spinner{display:inline-block;width:30px;height:30px;border:3px solid #e0e0e0;border-top-color:#667eea;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:10px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .risk-tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:.8em;font-weight:600;margin-left:8px}
        .risk-chong{background:#ff6b6b;color:#fff}
        .risk-wen{background:#ffd93d;color:#333}
        .risk-bao{background:#51cf66;color:#fff}
        .uni-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.88em}
        .uni-table th{background:#667eea;color:#fff;padding:10px 8px;text-align:left;font-weight:500;white-space:nowrap}
        .uni-table td{padding:10px 8px;border-bottom:1px solid #e0e0e0}
        .uni-table tr:hover{background:#f8f6ff}
        .uni-link{color:#667eea;text-decoration:none;font-weight:500}
        .uni-link:hover{text-decoration:underline}
        .level-tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.78em;font-weight:600;margin-right:4px}
        .level-985{background:#ff6b6b;color:#fff}
        .level-211{background:#ffd93d;color:#333}
        .level-syl{background:#51cf66;color:#fff}
        .level-pt{background:#adb5bd;color:#fff}
        .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
        .filter-bar select{padding:8px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:.88em;outline:none}
        .filter-bar select:focus{border-color:#667eea}
        .filter-bar label{font-size:.85em;color:#666;font-weight:500}
        .result-stats{background:#f0eeff;padding:12px 18px;border-radius:10px;margin-bottom:15px;display:flex;gap:20px;flex-wrap:wrap}
        .stat-item{text-align:center}
        .stat-num{font-size:1.5em;font-weight:700;color:#667eea}
        .stat-label{font-size:.8em;color:#888}
        .no-data{text-align:center;padding:20px;color:#999;font-style:italic}
        .footer{text-align:center;padding:18px;color:#999;font-size:.85em}
        .pagination{display:flex;justify-content:center;gap:8px;margin-top:15px}
        .pagination button{padding:6px 14px;border:1px solid #e0e0e0;border-radius:8px;cursor:pointer;background:#fff;font-size:.88em}
        .pagination button.active{background:#667eea;color:#fff;border-color:#667eea}
        .pagination button:disabled{opacity:.4;cursor:not-allowed}
        @media(max-width:768px){
            .header h1{font-size:1.5em}.mbti-type{font-size:2.8em}.content{padding:20px 15px}
            .question-text{font-size:1.05em}.uni-table{font-size:.78em}.uni-table th,.uni-table td{padding:6px 4px}
            .input-row{flex-direction:column}.career-header{flex-direction:column;align-items:flex-start}
        }
    </style>
</head>
<body>
<div class="container">
    <div id="welcome" class="card active">
        <div class="header"><h1>性格测试与职业推荐</h1><p>发现你的性格优势，找到适合你的职业道路</p></div>
        <div class="content welcome-content">
            <div class="welcome-icon">✨</div>
            <p class="welcome-text">本测试基于国际经典的 MBTI 性格理论，<br>通过 30 道精心设计的问题，<br>帮助你了解自己的性格类型，<br>并获得个性化的职业发展建议。</p>
            <p class="welcome-text">测试完成后可输入高考分数，<br>智能匹配可录取的院校专业（冲/稳/保）。</p>
            <button class="btn" onclick="startTest()">开始测试</button>
        </div>
    </div>
    <div id="test" class="card">
        <div class="header"><h1>性格测试</h1><p>请根据你的第一反应选择答案</p></div>
        <div class="content">
            <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
            <div id="questionText" class="question-text"></div>
            <div id="options" class="options"></div>
            <div class="nav-buttons">
                <button id="prevBtn" class="btn-nav btn-prev" onclick="prevQuestion()" style="visibility:hidden">← 上一题</button>
                <button id="nextBtn" class="btn-nav btn-next" onclick="nextQuestion()" disabled>下一题 →</button>
            </div>
        </div>
    </div>
    <div id="result" class="card">
        <div class="result-header">
            <div id="mbtiType" class="mbti-type"></div>
            <div id="typeName" class="type-name"></div>
            <div id="typeDesc" class="type-desc"></div>
        </div>
        <div class="result-content">
            <h2 class="section-title">推荐职业</h2>
            <div id="careersList"></div>
            <button class="btn" style="display:block;margin:25px auto 0" onclick="restartTest()">重新测试</button>
        </div>
        <div class="footer">本测试仅供参考，职业选择还需结合个人兴趣、能力等多方面因素</div>
    </div>
</div>

<script>
// ===== 30道MBTI测试题（优化版） =====
const questions = [
    // E-I 维度（外向 vs 内向）- 7题
    {dimension:"E-I",question:"在社交聚会中，你通常会：",options:[{text:"主动认识新朋友，享受热闹的社交氛围",value:"E"},{text:"与几个熟悉的朋友深入交流，或找个安静的角落",value:"I"}]},
    {dimension:"E-I",question:"经过一周的忙碌工作/学习后，你更期待周末：",options:[{text:"参加聚会、户外活动，与朋友共度时光",value:"E"},{text:"在家独处，看书、追剧或做自己喜欢的事",value:"I"}]},
    {dimension:"E-I",question:"在团队讨论中，你通常：",options:[{text:"积极发言，边说边想，享受思维碰撞",value:"E"},{text:"先倾听思考，有成熟想法时再表达",value:"I"}]},
    {dimension:"E-I",question:"你的能量来源更像是：",options:[{text:"与他人交流互动后感到充电和兴奋",value:"E"},{text:"独处静思后感到平静和充满力量",value:"I"}]},
    {dimension:"E-I",question:"面对一个需要演讲的场合，你的第一反应是：",options:[{text:"期待和兴奋，觉得这是展示自己的机会",value:"E"},{text:"有些紧张，更喜欢书面表达而非口头",value:"I"}]},
    {dimension:"E-I",question:"你理想的工作环境是：",options:[{text:"开放式办公室，可以随时与同事交流讨论",value:"E"},{text:"独立安静的私人空间，减少外界干扰",value:"I"}]},
    {dimension:"E-I",question:"当你遇到问题时，你更倾向于：",options:[{text:"立即找朋友或同事讨论，集思广益",value:"E"},{text:"先自己独立思考，理清思路后再求助",value:"I"}]},
    
    // S-N 维度（感觉 vs 直觉）- 7题
    {dimension:"S-N",question:"当你学习新知识时，你更注重：",options:[{text:"具体的步骤、实际案例和可操作的细节",value:"S"},{text:"整体概念、理论框架和未来的应用可能",value:"N"}]},
    {dimension:"S-N",question:"你更喜欢阅读哪类书籍：",options:[{text:"纪实文学、自传、历史或实用指南类",value:"S"},{text:"科幻小说、哲学、心理学或抽象概念类",value:"N"}]},
    {dimension:"S-N",question:"当朋友讲述一段经历时，你更关注：",options:[{text:"具体发生了什么、时间地点人物",value:"S"},{text:"这件事的意义、背后的隐喻和启示",value:"N"}]},
    {dimension:"S-N",question:"面对一个新挑战，你通常会：",options:[{text:"参考过去的成功经验，采用 proven 的方法",value:"S"},{text:"尝试创新的解决方案，探索新的可能性",value:"N"}]},
    {dimension:"S-N",question:"你更擅长并享受：",options:[{text:"按部就班地执行具体任务，关注细节",value:"S"},{text:"构思新点子，发现模式和未来趋势",value:"N"}]},
    {dimension:"S-N",question:"你更欣赏哪种类型的人：",options:[{text:"脚踏实地、注重实际、经验丰富的实干家",value:"S"},{text:"富有远见、思维跳跃、敢于突破的创新者",value:"N"}]},
    {dimension:"S-N",question:"在描述一个场景时，你更可能：",options:[{text:"详细描述看到的颜色、形状、具体细节",value:"S"},{text:"描述整体氛围、感受和联想",value:"N"}]},
    
    // T-F 维度（思考 vs 情感）- 8题
    {dimension:"T-F",question:"在做重要决定时，你更看重：",options:[{text:"逻辑分析、客观数据和利弊权衡",value:"T"},{text:"个人价值观、对他人的影响和内心感受",value:"F"}]},
    {dimension:"T-F",question:"当朋友向你倾诉感情困扰时，你通常会：",options:[{text:"帮助分析问题原因，提供解决建议",value:"T"},{text:"先给予情感支持和理解，倾听陪伴",value:"F"}]},
    {dimension:"T-F",question:"你认为在团队中更重要的是：",options:[{text:"任务完成的质量和效率，结果导向",value:"T"},{text:"团队成员的和谐关系，过程体验",value:"F"}]},
    {dimension:"T-F",question:"面对公平问题，你更认同：",options:[{text:"一视同仁，规则面前人人平等",value:"T"},{text:"因人而异，考虑每个人的特殊情况",value:"F"}]},
    {dimension:"T-F",question:"在争论中，你更倾向于：",options:[{text:"坚持逻辑正确的观点，即使可能得罪人",value:"T"},{text:"维护和谐关系，适当妥协避免冲突",value:"F"}]},
    {dimension:"T-F",question:"评价一个项目成功与否，你更看重：",options:[{text:"是否达到预期目标，数据指标如何",value:"T"},{text:"团队成员是否满意，过程是否愉快",value:"F"}]},
    {dimension:"T-F",question:"当你需要批评他人时，你更在意：",options:[{text:"批评内容是否准确、客观、有建设性",value:"T"},{text:"批评方式是否得体，是否会伤害对方感情",value:"F"}]},
    {dimension:"T-F",question:"你更认同哪种领导风格：",options:[{text:"理性决策、赏罚分明、以结果为导向",value:"T"},{text:"关怀下属、注重团队氛围、以人为本",value:"F"}]},
    
    // J-P 维度（判断 vs 知觉）- 8题
    {dimension:"J-P",question:"你更喜欢的工作方式是：",options:[{text:"制定详细计划，按计划有序执行",value:"J"},{text:"保持灵活，根据情况随机应变",value:"P"}]},
    {dimension:"J-P",question:"准备旅行时，你通常会：",options:[{text:"提前规划好每天的行程、酒店和交通",value:"J"},{text:"定个大方向，到了当地再决定具体安排",value:"P"}]},
    {dimension:"J-P",question:"面对截止日期，你的习惯是：",options:[{text:"提前开始，留出充足时间检查和修改",value:"J"},{text:"在deadline前集中精力冲刺完成",value:"P"}]},
    {dimension:"J-P",question:"你更认同哪种生活态度：",options:[{text:"今日事今日毕，喜欢完成任务的感觉",value:"J"},{text:"享受过程，计划赶不上变化很正常",value:"P"}]},
    {dimension:"J-P",question:"你的桌面/房间通常是：",options:[{text:"整洁有序，每样东西都有固定位置",value:"J"},{text:"有些凌乱，但我知道东西在哪里",value:"P"}]},
    {dimension:"J-P",question:"面对多个选项时，你更倾向于：",options:[{text:"尽快做出决定，然后专注执行",value:"J"},{text:"保持开放，收集更多信息后再决定",value:"P"}]},
    {dimension:"J-P",question:"你更喜欢的工作环境是：",options:[{text:"有明确的规则、流程和deadline",value:"J"},{text:"灵活自由，允许尝试和探索",value:"P"}]},
    {dimension:"J-P",question:"完成任务后，你更享受：",options:[{text:"按计划完成目标的成就感和掌控感",value:"J"},{text:"探索过程中发现新事物的兴奋感",value:"P"}]}
];

// ===== MBTI类型描述（优化版） =====
const mbtiDescriptions = {
    "INTJ":{name:"建筑师",desc:"你是富有远见的战略家，善于独立思考，追求系统和效率。你喜欢深入分析问题，制定长期规划，是天生的组织者和决策者。"},
    "INTP":{name:"逻辑学家",desc:"你是充满好奇心的思想家，热爱理论和抽象概念。你善于发现逻辑漏洞，追求真理，享受独自探索知识的过程。"},
    "ENTJ":{name:"指挥官",desc:"你是天生的领导者，自信果断，善于制定战略和激励团队。你目标导向，追求效率，能够将愿景转化为现实。"},
    "ENTP":{name:"辩论家",desc:"你是机智的创新者，思维敏捷，喜欢挑战传统观念。你善于发现可能性，享受脑力激荡，是天生的问题解决者。"},
    "INFJ":{name:"提倡者",desc:"你是理想主义的倡导者，富有同理心和洞察力。你关注他人成长，追求有意义的事业，是安静而有影响力的领导者。"},
    "INFP":{name:"调停者",desc:"你是富有诗意的梦想家，追求内心和谐与真实。你重视个人价值观，富有创造力，善于理解他人的情感需求。"},
    "ENFJ":{name:"主人公",desc:"你是充满魅力的激励者，善于理解他人并帮助他们成长。你热情洋溢，是天生的教练和团队建设者。"},
    "ENFP":{name:"竞选者",desc:"你是热情洋溢的创意者，充满想象力和可能性。你善于激励他人，追求自由和多样性，是生活的热情探索者。"},
    "ISTJ":{name:"物流师",desc:"你是可靠务实的组织者，注重细节和准确性。你遵守规则，责任心强，是值得信赖的执行者和守护者。"},
    "ISFJ":{name:"守卫者",desc:"你是温暖体贴的支持者，默默奉献，关注他人的实际需求。你有强烈的责任感，是传统和稳定的守护者。"},
    "ESTJ":{name:"总经理",desc:"你是高效务实的管理者，善于组织和执行。你重视传统和秩序，是天生的项目管理者和团队协调者。"},
    "ESFJ":{name:"执政官",desc:"你是热心肠的协调者，善于照顾他人，维护社交和谐。你重视传统和礼仪，是团队中的凝聚力量。"},
    "ISTP":{name:"鉴赏家",desc:"你是冷静理性的实验者，善于分析系统和解决问题。你喜欢动手实践，追求自由和独立，是危机中的冷静应对者。"},

function getLevelTags(f985, f211, dualClass) {
    let tags = [];
    if (f985 === "1") tags.push('<span class="level-tag level-985">985</span>');
    if (f211 === "1") tags.push('<span class="level-tag level-211">211</span>');
    if (dualClass === "1") tags.push('<span class="level-tag level-syl">双一流</span>');
    if (tags.length === 0) tags.push('<span class="level-tag level-pt">普通本科</span>');
    return tags.join('');
}

// ===== 冲稳保判断（优化版：差距控制在15分以内） =====
function getRiskLevel(userScore, minScore) {
    const diff = userScore - minScore;
    // 高分保底：用户分数比录取线高15分以上
    if (diff >= 15) return {text:"保底", cls:"risk-bao"};
    // 稳妥区间：用户分数在录取线±15分以内
    if (diff >= -15 && diff < 15) return {text:"稳妥", cls:"risk-wen"};
    // 冲刺区间：用户分数比录取线低15分以内（最多低15分）
    if (diff >= -30 && diff < -15) return {text:"冲刺", cls:"risk-chong"};
    // 差距太大，不显示
    return null;
}

// ===== 测试状态 =====
let currentQuestion = 0;
let answers = {};
let currentMBTI = '';

// ===== 测试逻辑 =====
function startTest() {
    document.getElementById('welcome').classList.remove('active');
    document.getElementById('test').classList.add('active');
    showQuestion();
}

function showQuestion() {
    const q = questions[currentQuestion];
    document.getElementById('progressFill').style.width = ((currentQuestion)/questions.length*100)+'%';
    document.getElementById('questionText').textContent = `${currentQuestion+1}/30  ${q.question}`;
    const oc = document.getElementById('options');
    oc.innerHTML = '';
    q.options.forEach(opt => {
        const el = document.createElement('div');
        el.className = 'option';
        el.textContent = opt.text;
        el.onclick = () => selectOption(opt.value);
        if (answers[q.dimension] === opt.value) el.classList.add('selected');
        oc.appendChild(el);
    });
    document.getElementById('prevBtn').style.visibility = currentQuestion > 0 ? 'visible' : 'hidden';
    document.getElementById('nextBtn').disabled = !answers[q.dimension];
    document.getElementById('nextBtn').textContent = currentQuestion === questions.length - 1 ? '查看结果' : '下一题 →';
}

function selectOption(value) {
    answers[questions[currentQuestion].dimension] = value;
    showQuestion();
}

function nextQuestion() {
    if (currentQuestion < questions.length - 1) { currentQuestion++; showQuestion(); }
    else showResult();
}

function prevQuestion() {
    if (currentQuestion > 0) { currentQuestion--; showQuestion(); }
}

function calculateMBTI() {
    let type = '';
    const dims = {'E-I':{E:0,I:0},'S-N':{S:0,N:0},'T-F':{T:0,F:0},'J-P':{J:0,P:0}};
    questions.forEach(q => { const a = answers[q.dimension]; if (a && dims[q.dimension]) dims[q.dimension][a]++; });
    ['E-I','S-N','T-F','J-P'].forEach(d => {
        const l = d.split('-');
        type += dims[d][l[0]] >= dims[d][l[1]] ? l[0] : l[1];
    });
    return type;
}

function searchUniversities(ci, majorKeywords) {
    const province = document.getElementById(`province_${ci}`).value;
    const score = parseInt(document.getElementById(`score_${ci}`).value);
    const kl = document.getElementById(`kl_${ci}`).value;
    const levelFilter = document.getElementById(`level_${ci}`).value;
    const resultArea = document.getElementById(`resultArea_${ci}`);

    if (!province || !score || !kl) {
        resultArea.innerHTML = '<div class="no-data">请先选择省份、科类并输入分数</div>';
        return;
    }

    resultArea.innerHTML = '<div class="loading"><div class="spinner"></div><br>正在匹配院校数据...</div>';

    // 解析专业关键词
    const keywords = majorKeywords.split(',').map(k => k.trim());
    
    // 从内置数据中匹配
    let allResults = [];
    
    // 辅助函数：检查专业名称是否匹配关键词（包括别名）
    function matchMajor(majorName, keyword) {
        const majorLower = majorName.toLowerCase();
        const keywordLower = keyword.toLowerCase();
        
        // 直接匹配
        if (majorLower.includes(keywordLower) || keywordLower.includes(majorLower)) {
            return true;
        }
        
        // 通过别名匹配
        if (majorAliasMap[majorName]) {
            for (const alias of majorAliasMap[majorName]) {
                if (alias.toLowerCase().includes(keywordLower) || keywordLower.includes(alias.toLowerCase())) {
                    return true;
                }
            }
        }
        
        // 反向别名匹配：检查关键词是否是某个专业的别名
        for (const [major, aliases] of Object.entries(majorAliasMap)) {
            for (const alias of aliases) {
                if (alias.toLowerCase() === keywordLower || keywordLower.includes(alias.toLowerCase())) {
                    if (majorLower.includes(major.toLowerCase()) || major.toLowerCase().includes(majorLower)) {
                        return true;
                    }
                }
            }
        }
        
        return false;
    }
    
    keywords.forEach(keyword => {
        // 查找匹配的专业数据
        Object.keys(universityScoresData).forEach(majorName => {
            if (matchMajor(majorName, keyword)) {
                const universities = universityScoresData[majorName];
                universities.forEach(uni => {
                    // 检查是否有该省数据
                    if (uni.scores && uni.scores[province]) {
                        const provScores = uni.scores[province];
                        // 支持新旧两种数据格式
                        let score2024, score2023, score2022;
                        
                        if (provScores[kl] && typeof provScores[kl] === 'object') {
                            // 新格式：包含近三年数据
                            score2024 = provScores[kl][2024];
                            score2023 = provScores[kl][2023];
                            score2022 = provScores[kl][2022];
                        } else if (typeof provScores[kl] === 'number') {
                            // 旧格式：只有2024年数据
                            score2024 = provScores[kl];
                            score2023 = provScores[kl] - 3; // 估算
                            score2022 = provScores[kl] - 5; // 估算
                        } else {
                            // 尝试其他科类
                            const altKl = kl === '理科' ? '文科' : '理科';
                            if (provScores[altKl]) {
                                if (typeof provScores[altKl] === 'object') {
                                    score2024 = provScores[altKl][2024];
                                    score2023 = provScores[altKl][2023];
                                    score2022 = provScores[altKl][2022];
                                } else {
                                    score2024 = provScores[altKl];
                                    score2023 = provScores[altKl] - 3;
                                    score2022 = provScores[altKl] - 5;
                                }
                            }
                        }
                        
                        if (!score2024) return;
                        
                        // 层次筛选
                        if (levelFilter === '985' && uni.f985 !== '1') return;
                        if (levelFilter === '211' && uni.f211 !== '1') return;
                        if (levelFilter === '双一流' && uni.dualClass !== '1') return;
                        if (levelFilter === '普通' && (uni.f985 === '1' || uni.f211 === '1')) return;
                        
                        const risk = getRiskLevel(score, score2024);
                        
                        // 只添加差距在30分以内的结果（冲刺最多低30分）
                        if (!risk) return;
                        
                        // 检查是否已存在（避免重复）
                        const exists = allResults.find(r => r.schoolId === uni.id && r.specialName === majorName);
                        if (!exists) {
                            allResults.push({
                                schoolName: uni.school,
                                schoolId: uni.id,
                                province: uni.p,
                                city: uni.c,
                                f985: uni.f985,
                                f211: uni.f211,
                                dualClass: uni.dualClass,
                                specialName: majorName,
                                batch: '本科批',
                                scores: {
                                    2024: score2024,
                                    2023: score2023 || score2024 - 3,
                                    2022: score2022 || score2024 - 5
                                },
                                risk: risk
                            });
                        }
                    }
                });
            }
        });
    });

    // 按2024年分数差排序（最接近用户分数的排在前面）
    allResults.sort((a, b) => Math.abs(score - a.scores[2024]) - Math.abs(score - b.scores[2024]));

    // 渲染结果
    renderResults(ci, allResults, score);
}

// ===== 渲染结果 =====
function renderResults(ci, allResults, score) {
    const resultArea = document.getElementById(`resultArea_${ci}`);
    
    const chongCount = allResults.filter(r => r.risk.text === '冲刺').length;
    const wenCount = allResults.filter(r => r.risk.text === '稳妥').length;
    const baoCount = allResults.filter(r => r.risk.text === '保底').length;

    let html = `
        <div class="result-stats">
            <div class="stat-item"><div class="stat-num">${allResults.length}</div><div class="stat-label">匹配结果</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#ff6b6b">${chongCount}</div><div class="stat-label">冲刺</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#f59f00">${wenCount}</div><div class="stat-label">稳妥</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#51cf66">${baoCount}</div><div class="stat-label">保底</div></div>
        </div>
        <div class="filter-bar">
            <label>快速筛选：</label>
            <select onchange="filterByRisk(this.value,${ci})" id="riskFilter_${ci}">
                <option value="">全部</option>
                <option value="冲刺">冲刺（低于分数线15-30分）</option>
                <option value="稳妥">稳妥（分数线±15分）</option>
                <option value="保底">保底（高于分数线15分以上）</option>
            </select>
        </div>
    `;

    if (allResults.length === 0) {
        html += '<div class="no-data">未找到匹配的院校数据。请尝试调整筛选条件或更换专业。<br><br>提示：本系统内置了热门专业的分数线数据，差距超过30分的院校已自动过滤。</div>';
    } else {
        html += `<table class="uni-table"><thead><tr>
            <th>院校名称</th><th>层次</th><th>所在地</th><th>专业</th>
            <th>2024</th><th>2023</th><th>2022</th><th>录取概率</th><th>详情</th>
        </tr></thead><tbody>`;

        allResults.forEach(r => {
            const gaokaoUrl = `https://www.gaokao.cn/school/${r.schoolId}`;
            const score2024 = r.scores[2024];
            const score2023 = r.scores[2023];
            const score2022 = r.scores[2022];
            html += `<tr>
                <td><strong>${r.schoolName}</strong></td>
                <td>${getLevelTags(r.f985, r.f211, r.dualClass)}</td>
                <td>${r.province} ${r.city}</td>
                <td>${r.specialName}</td>
                <td style="font-weight:700;color:${score >= score2024 ? '#27ae60' : '#e74c3c'}">${score2024}</td>
                <td style="color:#666">${score2023}</td>
                <td style="color:#666">${score2022}</td>
                <td><span class="risk-tag ${r.risk.cls}">${r.risk.text}</span></td>
                <td><a href="${gaokaoUrl}" target="_blank" class="uni-link">详情</a></td>
            </tr>`;
        });
        html += '</tbody></table>';
    }

    resultArea.innerHTML = html;
    window[`allResults_${ci}`] = allResults;
}

// ===== 风险筛选 =====
function filterByRisk(riskVal, ci) {
    const resultArea = document.getElementById(`resultArea_${ci}`);
    const allResults = window[`allResults_${ci}`] || [];
    const score = parseInt(document.getElementById(`score_${ci}`).value);
    
    let filtered = riskVal ? allResults.filter(r => r.risk.text === riskVal) : allResults;

    const chongCount = filtered.filter(r => r.risk.text === '冲刺').length;
    const wenCount = filtered.filter(r => r.risk.text === '稳妥').length;
    const baoCount = filtered.filter(r => r.risk.text === '保底').length;

    let html = `
        <div class="result-stats">
            <div class="stat-item"><div class="stat-num">${filtered.length}</div><div class="stat-label">匹配结果</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#ff6b6b">${chongCount}</div><div class="stat-label">冲刺</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#f59f00">${wenCount}</div><div class="stat-label">稳妥</div></div>
            <div class="stat-item"><div class="stat-num" style="color:#51cf66">${baoCount}</div><div class="stat-label">保底</div></div>
        </div>
        <div class="filter-bar">
            <label>快速筛选：</label>
            <select onchange="filterByRisk(this.value,${ci})" id="riskFilter_${ci}">
                <option value="">全部</option>
                <option value="冲刺" ${riskVal==='冲刺'?'selected':''}>冲刺（低于15-30分）</option>
                <option value="稳妥" ${riskVal==='稳妥'?'selected':''}>稳妥（±15分）</option>
                <option value="保底" ${riskVal==='保底'?'selected':''}>保底（高于15分）</option>
            </select>
        </div>
    `;

    if (filtered.length === 0) {
        html += '<div class="no-data">该筛选条件下无匹配结果</div>';
    } else {
        html += `<table class="uni-table"><thead><tr>
            <th>院校名称</th><th>层次</th><th>所在地</th><th>专业</th>
            <th>2024</th><th>2023</th><th>2022</th><th>录取概率</th><th>详情</th>
        </tr></thead><tbody>`;
        filtered.forEach(r => {
            const gaokaoUrl = `https://www.gaokao.cn/school/${r.schoolId}`;
            const score2024 = r.scores[2024];
            const score2023 = r.scores[2023];
            const score2022 = r.scores[2022];
            html += `<tr>
                <td><strong>${r.schoolName}</strong></td>
                <td>${getLevelTags(r.f985, r.f211, r.dualClass)}</td>
                <td>${r.province} ${r.city}</td>
                <td>${r.specialName}</td>
                <td style="font-weight:700;color:${score >= score2024 ? '#27ae60' : '#e74c3c'}">${score2024}</td>
                <td style="color:#666">${score2023}</td>
                <td style="color:#666">${score2022}</td>
                <td><span class="risk-tag ${r.risk.cls}">${r.risk.text}</span></td>
                <td><a href="${gaokaoUrl}" target="_blank" class="uni-link">详情</a></td>
            </tr>`;
        });
        html += '</tbody></table>';
    }
    resultArea.innerHTML = html;
}

    answers = {};
    currentMBTI = '';
    document.getElementById('result').classList.remove('active');
    document.getElementById('welcome').classList.add('active');
}
