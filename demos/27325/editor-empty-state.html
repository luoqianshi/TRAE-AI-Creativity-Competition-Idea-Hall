<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编辑器空状态 — PRD Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #008E6B;
      --green-800: #007A5C;
      --green-700: #46B065;
      --green-500: #81C570;
      --green-200: #DCECB5;
      --green-50: #FBFFF2;
      --bg: #FBFFF2;
      --bg-elevated: #FFFFFF;
      --bg-hover: #F3F8EC;
      --bg-active: #E8F3DE;
      --text: #1A3A2F;
      --text-secondary: #5A7A6A;
      --text-tertiary: #8AAA9A;
      --border: rgba(0, 142, 107, 0.08);
      --accent: #008E6B;
      --accent-hover: #007A5C;
      --accent-soft: rgba(0, 142, 107, 0.08);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 20px;
      --motion-fast: 200ms;
      --motion: 400ms;
      --motion-slow: 600ms;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
      --shadow-sm: 0 1px 4px rgba(0, 142, 107, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 142, 107, 0.06);
      --shadow-lg: 0 8px 32px rgba(0, 142, 107, 0.08);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    
    /* 编辑器容器 */
    .editor-container {
      width: 100%;
      max-width: 900px;
      background: var(--bg-elevated);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: fadeInUp var(--motion-slow) var(--ease-out);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* 编辑器头部 */
    .editor-header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .project-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .project-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.4));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .editor-actions {
      display: flex;
      gap: 8px;
    }
    
    .action-btn {
      height: 36px;
      padding: 0 16px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--motion-fast) var(--ease);
    }
    
    .action-btn:hover {
      border-color: var(--green-500);
      color: var(--text);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    
    .action-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    
    .action-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    
    /* 工具栏 */
    .toolbar {
      padding: 12px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .toolbar-btn {
      height: 32px;
      padding: 0 10px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--motion-fast) var(--ease);
    }
    
    .toolbar-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }
    
    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 6px;
    }
    
    .ai-btn {
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.6));
      color: var(--green-900);
      font-weight: 700;
      padding: 0 14px;
      border: 1px solid rgba(0, 142, 107, 0.15);
    }
    
    .ai-btn:hover {
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.9));
      color: var(--green-900);
      box-shadow: var(--shadow-sm);
    }
    
    .ai-btn .sparkle {
      display: flex;
      align-items: center;
      animation: sparkle 2s ease-in-out infinite;
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }
    
    /* 编辑器主体 */
    .editor-body {
      padding: 40px 32px;
      min-height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    /* 空状态 */
    .empty-state {
      text-align: center;
      max-width: 480px;
      animation: fadeIn var(--motion-slow) var(--ease-out);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .empty-icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.3));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      position: relative;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    .empty-icon::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 12px;
      background: radial-gradient(ellipse, rgba(0, 142, 107, 0.15), transparent);
      border-radius: 50%;
      animation: shadow 3s ease-in-out infinite;
    }
    
    @keyframes shadow {
      0%, 100% { 
        width: 80px;
        opacity: 0.6;
      }
      50% { 
        width: 60px;
        opacity: 0.3;
      }
    }
    
    .empty-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
    }
    
    .empty-description {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    
    /* AI 生成大纲按钮 */
    .ai-generate-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.8));
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      color: var(--green-900);
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease-spring);
      box-shadow: var(--shadow-md);
      position: relative;
      overflow: hidden;
    }
    
    .ai-generate-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.6s ease;
    }
    
    .ai-generate-btn:hover::before {
      left: 100%;
    }
    
    .ai-generate-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: var(--shadow-lg);
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 1));
    }
    
    .ai-generate-btn:active {
      transform: translateY(-2px) scale(1);
    }
    
    .ai-generate-btn .btn-icon {
      display: flex;
      align-items: center;
      animation: sparkle 2s ease-in-out infinite;
    }
    
    .ai-generate-btn .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    
    .ai-generate-btn .btn-title {
      font-size: 16px;
      font-weight: 700;
    }
    
    .ai-generate-btn .btn-subtitle {
      font-size: 12px;
      font-weight: 500;
      opacity: 0.8;
    }
    
    /* 快速开始选项 */
    .quick-start {
      margin-top: 40px;
      display: flex;
      gap: 12px;
    }
    
    .quick-option {
      padding: 12px 20px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .quick-option:hover {
      background: var(--bg-active);
      border-color: var(--green-500);
      color: var(--text);
      transform: translateY(-2px);
    }
    
    .quick-option .option-icon {
      display: flex;
      align-items: center;
    }
    
    /* 加载状态 */
    .loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    
    .loading-state.active {
      display: flex;
    }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 500;
    }
    
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="editor-container">
    <!-- 编辑器头部 -->
    <div class="editor-header">
      <div class="project-title">
        <div class="project-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></div>
        <span>用户管理系统 PRD</span>
      </div>
      <div class="editor-actions">
        <button class="action-btn">
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
          <span>预览</span>
        </button>
        <button class="action-btn primary">
          <span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span>
          <span>保存版本</span>
        </button>
      </div>
    </div>
    
    <!-- 工具栏 -->
    <div class="toolbar">
      <button class="toolbar-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"/></svg></span></button>
      <button class="toolbar-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></span></button>
      <button class="toolbar-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="m17 12 3-2v8"/></svg></span></button>
      <button class="toolbar-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1"/></svg></span></button>
      <button class="toolbar-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span></button>
      <button class="toolbar-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span></button>
      
      <div class="toolbar-divider"></div>
      
      <button class="toolbar-btn ai-btn">
        <span class="sparkle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></span>
        <span>AI</span>
        <span style="font-size:10px; opacity:0.7;">▼</span>
      </button>
      
      <div style="flex:1;"></div>
      
      <button class="toolbar-btn"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span></button>
    </div>
    
    <!-- 编辑器主体 -->
    <div class="editor-body">
      <!-- 空状态 -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/><path d="m15 5 3 3"/></svg></div>
        <h2 class="empty-title">开始编写你的产品需求文档</h2>
        <p class="empty-description">
          让 AI 帮你快速生成专业的 PRD 大纲，节省 80% 的编写时间
        </p>
        
        <button class="ai-generate-btn" id="generateBtn">
          <span class="btn-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></span>
          <span class="btn-text">
            <span class="btn-title">AI 生成大纲</span>
            <span class="btn-subtitle">基于项目信息智能生成</span>
          </span>
        </button>
        
        <div class="quick-start">
          <button class="quick-option">
            <span class="option-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg></span>
            <span>从模板开始</span>
          </button>
          <button class="quick-option">
            <span class="option-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
            <span>手动编写</span>
          </button>
        </div>
      </div>
      
      <!-- 加载状态 -->
      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <div class="loading-text">
          AI 正在生成大纲<span class="loading-dots"></span>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // 模拟 AI 生成大纲
    document.getElementById('generateBtn').addEventListener('click', function() {
      const emptyState = document.getElementById('emptyState');
      const loadingState = document.getElementById('loadingState');
      
      emptyState.style.display = 'none';
      loadingState.classList.add('active');
      
      // 模拟加载 3 秒后恢复
      setTimeout(() => {
        loadingState.classList.remove('active');
        emptyState.style.display = 'block';
      }, 3000);
    });
    
    // 快速开始选项点击效果
    document.querySelectorAll('.quick-option').forEach(option => {
      option.addEventListener('click', function() {
        this.style.transform = 'translateY(-2px) scale(0.98)';
        setTimeout(() => {
          this.style.transform = '';
        }, 200);
      });
    });
  </script>
</body>
</html>
