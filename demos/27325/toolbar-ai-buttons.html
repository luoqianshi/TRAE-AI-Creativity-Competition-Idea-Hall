<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具栏 AI 按钮组 — PRD Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #008E6B;
      --green-800: #007A5C;
      --green-700: #46B065;
      --green-500: #81C570;
      --green-200: #DCECB5;
      --green-50: #FBFFF2;
      --bg: #FBFFF2;
      --bg-elevated: #FFFFFF;
      --bg-hover: #F3F8EC;
      --bg-active: #E8F3DE;
      --text: #1A3A2F;
      --text-secondary: #5A7A6A;
      --text-tertiary: #8AAA9A;
      --border: rgba(0, 142, 107, 0.08);
      --accent: #008E6B;
      --accent-hover: #007A5C;
      --accent-soft: rgba(0, 142, 107, 0.08);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 20px;
      --motion-fast: 200ms;
      --motion: 400ms;
      --motion-slow: 600ms;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
      --shadow-sm: 0 1px 4px rgba(0, 142, 107, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 142, 107, 0.06);
      --shadow-lg: 0 8px 32px rgba(0, 142, 107, 0.08);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 40px;
    }
    
    .demo-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: -20px;
    }
    
    /* 工具栏容器 */
    .toolbar {
      width: 100%;
      max-width: 800px;
      background: var(--bg-elevated);
      border-radius: var(--radius);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    
    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 8px;
    }
    
    /* 工具栏按钮 */
    .toolbar-btn {
      height: 36px;
      padding: 0 12px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--motion-fast) var(--ease);
      white-space: nowrap;
      position: relative;
    }
    
    .toolbar-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }
    
    .toolbar-btn:active {
      transform: scale(0.96);
    }
    
    .toolbar-btn .icon {
      font-size: 16px;
      line-height: 1;
    }
    
    /* AI 主按钮 */
    .ai-btn {
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.6));
      color: var(--green-900);
      font-weight: 700;
      padding: 0 16px;
      border: 1px solid rgba(0, 142, 107, 0.15);
    }
    
    .ai-btn:hover {
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.9));
      color: var(--green-900);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    
    .ai-btn:active {
      transform: translateY(0) scale(0.98);
    }
    
    .ai-btn .sparkle {
      font-size: 14px;
      animation: sparkle 2s ease-in-out infinite;
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }
    
    /* AI 下拉菜单 */
    .ai-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 240px;
      background: var(--bg-elevated);
      border-radius: var(--radius);
      padding: 8px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      z-index: 100;
      animation: dropdownIn var(--motion-fast) var(--ease-spring);
      display: none;
    }
    
    .ai-dropdown.show {
      display: block;
    }
    
    @keyframes dropdownIn {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease);
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: var(--font);
    }
    
    .dropdown-item:hover {
      background: var(--bg-hover);
      transform: translateX(4px);
    }
    
    .dropdown-item .item-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .dropdown-item .item-text {
      flex: 1;
    }
    
    .dropdown-item .item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    
    .dropdown-item .item-desc {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }
    
    .dropdown-item .item-shortcut {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-tertiary);
      background: var(--bg-active);
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0;
    }
    
    /* 选中状态工具栏 */
    .selection-toolbar {
      width: 100%;
      max-width: 800px;
      background: var(--bg-elevated);
      border-radius: var(--radius);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      animation: selectionIn var(--motion-fast) var(--ease-spring);
    }
    
    @keyframes selectionIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .selection-info {
      font-size: 12px;
      color: var(--text-tertiary);
      padding: 0 12px;
      font-weight: 500;
      border-right: 1px solid var(--border);
      margin-right: 8px;
    }
    
    .selection-info strong {
      color: var(--accent);
      font-weight: 700;
    }
    
    /* 右键菜单 */
    .context-menu {
      width: 220px;
      background: var(--bg-elevated);
      border-radius: var(--radius);
      padding: 8px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    
    .context-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    
    .context-menu-item:hover {
      background: var(--bg-hover);
    }
    
    .context-menu-item .cm-icon {
      font-size: 14px;
      width: 20px;
      text-align: center;
    }
    
    .context-menu-item.ai-item {
      color: var(--accent);
      font-weight: 600;
    }
    
    .context-menu-item.ai-item .cm-icon {
      color: var(--accent);
    }
    
    .context-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }
    
    .context-submenu-label {
      font-size: 11px;
      color: var(--text-tertiary);
      padding: 6px 12px 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
