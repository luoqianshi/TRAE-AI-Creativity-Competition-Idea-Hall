<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 评分面板 — PRD Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Spring Fields 绿色系 */
      --green-900: #008E6B;
      --green-800: #007A5C;
      --green-700: #46B065;
      --green-500: #81C570;
      --green-200: #DCECB5;
      --green-50: #FBFFF2;
      
      /* 评分等级色 */
      --score-excellent: #008E6B;
      --score-good: #46B065;
      --score-fair: #D97706;
      --score-poor: #DC2626;
      
      /* 表面层级 */
      --bg: #FBFFF2;
      --bg-elevated: #FFFFFF;
      --bg-hover: #F3F8EC;
      --bg-active: #E8F3DE;
      
      /* 文字 */
      --text: #1A3A2F;
      --text-secondary: #5A7A6A;
      --text-tertiary: #8AAA9A;
      
      /* 边框 */
      --border: rgba(0, 142, 107, 0.08);
      
      /* 强调 */
      --accent: #008E6B;
      --accent-soft: rgba(0, 142, 107, 0.08);
      
      /* 圆角 */
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 20px;
      
      /* 动效 */
      --motion-fast: 200ms;
      --motion: 400ms;
      --motion-slow: 600ms;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      
      /* 字体 */
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
      
      /* 阴影 */
      --shadow-sm: 0 1px 4px rgba(0, 142, 107, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 142, 107, 0.06);
      --shadow-lg: 0 8px 32px rgba(0, 142, 107, 0.08);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    
    /* 评分面板容器 */
    .score-panel {
      width: 100%;
      max-width: 480px;
      background: var(--bg-elevated);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-lg);
      animation: fadeInUp var(--motion-slow) var(--ease-out);
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* 标题区 */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    
    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .panel-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.4));
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    
    .panel-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    
    .panel-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    
    .recheck-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .recheck-btn:hover {
      border-color: var(--green-500);
      color: var(--accent);
      background: var(--bg-hover);
    }
    
    /* 总分展示区 */
    .total-score-section {
      text-align: center;
      padding: 32px 0;
      margin-bottom: 32px;
      background: linear-gradient(135deg, var(--bg-hover), var(--bg-active));
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }
    
    .total-score-section::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 142, 107, 0.05) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }
    
    .score-circle {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
    }
    
    .score-circle svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }
    
    .score-circle-bg {
      fill: none;
      stroke: var(--border);
      stroke-width: 12;
    }
    
    .score-circle-progress {
      fill: none;
      stroke: var(--score-good);
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 440;
      stroke-dashoffset: 96.8; /* 440 - (440 * 0.78) = 96.8 */
      transition: stroke-dashoffset 1.5s var(--ease-out);
    }
    
    .score-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    
    .score-number {
      font-size: 48px;
      font-weight: 800;
      font-family: var(--font-mono);
      color: var(--score-good);
      line-height: 1;
    }
    
    .score-max {
      font-size: 16px;
      color: var(--text-tertiary);
      font-weight: 500;
      margin-top: 4px;
    }
    
    .score-grade {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    
    .score-description {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    
    /* 维度评分 */
    .dimensions-section {
      margin-bottom: 32px;
    }
    
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .dimension-item {
      margin-bottom: 20px;
    }
    
    .dimension-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .dimension-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .dimension-icon {
      display: flex;
      align-items: center;
      color: var(--text-secondary);
    }
    
    .dimension-score {
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--text);
    }
    
    .dimension-bar {
      height: 8px;
      background: var(--bg-active);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    
    .dimension-progress {
      height: 100%;
      border-radius: 4px;
      transition: width 1s var(--ease-out);
      position: relative;
      overflow: hidden;
    }
    
    .dimension-progress::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }
    
    .dimension-progress.excellent {
      background: var(--score-excellent);
    }
    
    .dimension-progress.good {
      background: var(--score-good);
    }
    
    .dimension-progress.fair {
      background: var(--score-fair);
    }
    
    .dimension-progress.poor {
      background: var(--score-poor);
    }
    
    /* 改进建议 */
    .suggestions-section {
      margin-bottom: 28px;
    }
    
    .suggestion-item {
      padding: 14px 18px;
      background: var(--bg-hover);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      border-left: 3px solid var(--accent);
      transition: all var(--motion-fast) var(--ease);
    }
    
    .suggestion-item:hover {
      background: var(--bg-active);
      transform: translateX(4px);
    }
    
    .suggestion-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    
    .suggestion-icon {
      font-size: 14px;
    }
    
    .suggestion-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    
    .suggestion-description {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    
    /* 底部操作区 */
    .panel-footer {
      display: flex;
      gap: 12px;
    }
    
    .btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-secondary);
    }
    
    .btn-secondary:hover {
      background: var(--bg-active);
      color: var(--text);
      transform: translateY(-2px);
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    
    .btn-primary:hover {
      background: var(--green-800);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
</head>
<body>
  <div class="score-panel">
    <!-- 标题区 -->
    <div class="panel-header">
      <div class="panel-title-group">
        <div class="panel-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg></div>
        <div>
          <div class="panel-title">质量评分</div>
          <div class="panel-subtitle">AI 综合评估 PRD 质量</div>
        </div>
      </div>
      <button class="recheck-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        <span>重新评估</span>
      </button>
    </div>
    
    <!-- 总分展示 -->
    <div class="total-score-section">
      <div class="score-circle">
        <svg viewBox="0 0 160 160">
          <circle class="score-circle-bg" cx="80" cy="80" r="70"></circle>
          <circle class="score-circle-progress" cx="80" cy="80" r="70"></circle>
        </svg>
        <div class="score-value">
          <div class="score-number">78</div>
          <div class="score-max">/ 100</div>
        </div>
      </div>
      <div class="score-grade">良好</div>
      <div class="score-description">
        文档结构完整，但在异常流程和性能指标方面需要补充
      </div>
    </div>
    
    <!-- 维度评分 -->
    <div class="dimensions-section">
      <div class="section-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        <span>各维度得分</span>
      </div>
      
      <div class="dimension-item">
        <div class="dimension-header">
          <div class="dimension-name">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
            <span>完整性</span>
          </div>
          <div class="dimension-score">82</div>
        </div>
        <div class="dimension-bar">
          <div class="dimension-progress good" style="width: 82%"></div>
        </div>
      </div>
      
      <div class="dimension-item">
        <div class="dimension-header">
          <div class="dimension-name">
            <svg class="dimension-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
            <span>清晰度</span>
          </div>
          <div class="dimension-score">75</div>
        </div>
        <div class="dimension-bar">
          <div class="dimension-progress good" style="width: 75%"></div>
        </div>
      </div>
      
      <div class="dimension-item">
        <div class="dimension-header">
          <div class="dimension-name">
            <svg class="dimension-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span>一致性</span>
          </div>
          <div class="dimension-score">80</div>
        </div>
        <div class="dimension-bar">
          <div class="dimension-progress good" style="width: 80%"></div>
        </div>
      </div>
      
      <div class="dimension-item">
        <div class="dimension-header">
          <div class="dimension-name">
            <svg class="dimension-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
            <span>可测试性</span>
          </div>
          <div class="dimension-score">65</div>
        </div>
        <div class="dimension-bar">
          <div class="dimension-progress fair" style="width: 65%"></div>
        </div>
      </div>
      
      <div class="dimension-item">
        <div class="dimension-header">
          <div class="dimension-name">
            <svg class="dimension-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>合规性</span>
          </div>
          <div class="dimension-score">70</div>
        </div>
        <div class="dimension-bar">
          <div class="dimension-progress fair" style="width: 70%"></div>
        </div>
      </div>
    </div>
    
    <!-- 改进建议 -->
    <div class="suggestions-section">
      <div class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
        <span>改进建议 (Top 3)</span>
      </div>
      
      <div class="suggestion-item">
        <div class="suggestion-header">
          <span style="font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:14px">1</span>
          <div class="suggestion-title">补充异常流程描述</div>
        </div>
        <div class="suggestion-description">
          为关键功能添加错误处理、边界条件和异常场景的说明
        </div>
      </div>
      
      <div class="suggestion-item">
        <div class="suggestion-header">
          <span style="font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:14px">2</span>
          <div class="suggestion-title">量化性能指标</div>
        </div>
        <div class="suggestion-description">
          将模糊的性能描述改为具体数值，如 "页面加载 < 2s"、"API 响应 < 500ms"
        </div>
      </div>
      
      <div class="suggestion-item">
        <div class="suggestion-header">
          <span style="font-family:var(--font-mono);font-weight:700;color:var(--accent);font-size:14px">3</span>
          <div class="suggestion-title">添加无障碍要求</div>
        </div>
        <div class="suggestion-description">
          说明是否需要支持 WCAG 标准、键盘导航、屏幕阅读器等
        </div>
      </div>
    </div>
    
    <!-- 底部操作 -->
    <div class="panel-footer">
      <button class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        <span>导出报告</span>
      </button>
      <button class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        <span>AI 一键优化</span>
      </button>
    </div>
  </div>
  
  <script>
    // 进度条动画
    setTimeout(() => {
      document.querySelectorAll('.dimension-progress').forEach(bar => {
        const width = bar.style.width;
        bar.style.width = '0%';
        setTimeout(() => {
          bar.style.width = width;
        }, 100);
      });
    }, 300);
    
    // 重新评估按钮效果
    document.querySelector('.recheck-btn').addEventListener('click', function() {
      const icon = this.querySelector('span');
      icon.style.display = 'inline-block';
      icon.style.animation = 'spin 0.8s linear';
      setTimeout(() => {
        icon.style.animation = '';
      }, 800);
    });
    
    // 添加旋转动画
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
