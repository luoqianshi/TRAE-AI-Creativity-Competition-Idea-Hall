<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新建项目 - PRD Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════
       Spring Fields Design Tokens
       ═══════════════════════════════════════════════════════════ */
    :root {
      --green-900: #008E6B;
      --green-700: #46B065;
      --green-500: #81C570;
      --green-200: #DCECB5;
      --green-50: #FBFFF2;

      --bg: #FBFFF2;
      --bg-elevated: #ffffff;
      --bg-hover: #F3F8EC;
      --bg-active: #E8F3DE;

      --text: #1a3a2f;
      --text-secondary: #5a7a6a;
      --text-tertiary: #8aaa9a;

      --border: rgba(0, 142, 107, 0.08);
      --border-light: rgba(0, 142, 107, 0.05);

      --accent: #008E6B;
      --accent-hover: #007a5c;
      --accent-soft: rgba(0, 142, 107, 0.08);

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 20px;

      --motion-fast: 200ms;
      --motion: 400ms;
      --motion-slow: 600ms;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      --shadow-sm: 0 1px 4px rgba(0, 142, 107, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 142, 107, 0.06);
      --shadow-lg: 0 8px 32px rgba(0, 142, 107, 0.08);
      --shadow-xl: 0 16px 48px rgba(0, 142, 107, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 背景环境光晕 */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(129, 197, 112, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════════════════
       动画关键帧
       ═══════════════════════════════════════════════════════════ */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ═══════════════════════════════════════════════════════════
       遮罩层
       ═══════════════════════════════════════════════════════════ */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 58, 47, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn var(--motion) var(--ease) forwards;
      z-index: 1000;
    }

    /* ═══════════════════════════════════════════════════════════
       弹窗容器（Double-Bezel）
       ═══════════════════════════════════════════════════════════ */
    .modal {
      position: relative;
      width: 100%;
      max-width: 520px;
      padding: 2px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.5));
      box-shadow: var(--shadow-xl);
      animation: scaleIn var(--motion) var(--ease-spring) forwards;
      z-index: 1;
    }

    .modal-inner {
      background: var(--bg-elevated);
      border-radius: calc(var(--radius-lg) - 2px);
      padding: 36px;
    }

    /* ═══════════════════════════════════════════════════════════
       弹窗头部
       ═══════════════════════════════════════════════════════════ */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      animation: slideUp var(--motion-slow) var(--ease-out) 100ms both;
    }

    .modal-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .btn-close {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--motion) var(--ease);
    }

    .btn-close:hover {
      background: var(--bg-hover);
      color: var(--text);
      transform: rotate(90deg);
    }

    /* ═══════════════════════════════════════════════════════════
       表单字段
       ═══════════════════════════════════════════════════════════ */
    .form-group {
      margin-bottom: 24px;
      animation: slideUp var(--motion-slow) var(--ease-out) both;
    }

    .form-group:nth-child(1) { animation-delay: 150ms; }
    .form-group:nth-child(2) { animation-delay: 220ms; }
    .form-group:nth-child(3) { animation-delay: 290ms; }
    .form-group:nth-child(4) { animation-delay: 360ms; }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .required {
      color: var(--green-700);
      margin-left: 2px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all var(--motion) var(--ease);
      box-shadow: var(--shadow-sm);
    }

    .form-input:focus {
      border-color: var(--green-500);
      box-shadow: 0 0 0 3px rgba(129, 197, 112, 0.15), var(--shadow-sm);
      transform: translateY(-1px);
    }

    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    .form-hint {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 6px;
    }

    /* ═══════════════════════════════════════════════════════════
       单选按钮组
       ═══════════════════════════════════════════════════════════ */
    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .radio-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--motion) var(--ease-spring);
      box-shadow: var(--shadow-sm);
    }

    .radio-item:hover {
      border-color: var(--green-500);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .radio-item.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .radio-item input[type="radio"] {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      transition: all var(--motion) var(--ease);
      flex-shrink: 0;
    }

    .radio-item input[type="radio"]:checked {
      border-color: var(--accent);
      border-width: 5px;
    }

    .radio-item.selected input[type="radio"] {
      border-color: var(--accent);
      border-width: 5px;
    }

    /* ═══════════════════════════════════════════════════════════
       文本域
       ═══════════════════════════════════════════════════════════ */
    .form-textarea {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      resize: vertical;
      min-height: 80px;
      transition: all var(--motion) var(--ease);
      box-shadow: var(--shadow-sm);
    }

    .form-textarea:focus {
      border-color: var(--green-500);
      box-shadow: 0 0 0 3px rgba(129, 197, 112, 0.15), var(--shadow-sm);
      transform: translateY(-1px);
    }

    .form-textarea::placeholder {
      color: var(--text-tertiary);
    }

    /* ═══════════════════════════════════════════════════════════
       弹窗底部
       ═══════════════════════════════════════════════════════════ */
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border-light);
      animation: slideUp var(--motion-slow) var(--ease-out) 430ms both;
    }

    .btn-secondary {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--motion) var(--ease);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--motion) var(--ease-spring);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px) scale(1.02);
      box-shadow: var(--shadow-lg);
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-primary svg {
      transition: transform var(--motion) var(--ease-spring);
    }

    .btn-primary:hover svg {
      transform: translateX(2px);
    }

    /* ═══════════════════════════════════════════════════════════
       响应式
       ═══════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .modal-inner {
        padding: 28px;
      }

      .modal-title {
        font-size: 22px;
      }

      .radio-group {
        flex-direction: column;
      }

      .radio-item {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="modal">
      <div class="modal-inner">
        <div class="modal-header">
          <h1 class="modal-title">新建项目</h1>
          <button class="btn-close" title="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>

        <form>
          <div class="form-group">
            <label class="form-label">
              项目名称 <span class="required">*</span>
            </label>
            <input type="text" class="form-input" placeholder="输入项目名称..." maxlength="100">
            <div class="form-hint">最多 100 个字符</div>
          </div>

          <div class="form-group">
            <label class="form-label">
              版本号 <span class="required">*</span>
            </label>
            <input type="text" class="form-input" placeholder="例如：1.0.0 或 v1">
            <div class="form-hint">手动输入版本号，如 1.0.0、v1、2.0-beta</div>
          </div>

          <div class="form-group">
            <label class="form-label">
              项目类型 <span class="required">*</span>
            </label>
            <div class="radio-group">
              <label class="radio-item selected">
                <input type="radio" name="projectType" value="Web 应用" checked>
                <span>Web 应用</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="projectType" value="SaaS">
                <span>SaaS</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="projectType" value="桌面端">
                <span>桌面端</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="projectType" value="移动端">
                <span>移动端</span>
              </label>
              <label class="radio-item">
                <input type="radio" name="projectType" value="其他">
                <span>其他</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">项目描述</label>
            <textarea class="form-textarea" placeholder="简要描述项目目标和范围（可选）..." rows="3"></textarea>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-secondary">取消</button>
            <button type="submit" class="btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              创建项目
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.radio-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.radio-item').forEach(i => i.classList.remove('selected'));
        this.classList.add('selected');
        const input = this.querySelector('input[type="radio"]');
        if (input) input.checked = true;
      });
    });
  </script>
</body>
</html>
