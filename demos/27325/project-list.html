<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目列表 - PRD Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════════════════════════
       Spring Fields Design Tokens
       ═══════════════════════════════════════════════════════════ */
    :root {
      --green-900: #008E6B;
      --green-700: #46B065;
      --green-500: #81C570;
      --green-200: #DCECB5;
      --green-50: #FBFFF2;

      --bg: #FBFFF2;
      --bg-elevated: #ffffff;
      --bg-hover: #F3F8EC;
      --bg-active: #E8F3DE;

      --text: #1a3a2f;
      --text-secondary: #5a7a6a;
      --text-tertiary: #8aaa9a;

      --border: rgba(0, 142, 107, 0.08);
      --border-light: rgba(0, 142, 107, 0.05);

      --accent: #008E6B;
      --accent-hover: #007a5c;
      --accent-soft: rgba(0, 142, 107, 0.08);

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 20px;

      --motion-fast: 200ms;
      --motion: 400ms;
      --motion-slow: 600ms;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      --shadow-sm: 0 1px 4px rgba(0, 142, 107, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 142, 107, 0.06);
      --shadow-lg: 0 8px 32px rgba(0, 142, 107, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
      overflow-x: hidden;
    }

    /* 微妙的环境光晕 */
    body::after {
      content: '';
      position: fixed;
      top: -20%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(129, 197, 112, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ═══════════════════════════════════════════════════════════
       入场动画关键帧
       ═══════════════════════════════════════════════════════════ */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ═══════════════════════════════════════════════════════════
       布局容器
       ═══════════════════════════════════════════════════════════ */
    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: 80px 48px;
      position: relative;
      z-index: 1;
      animation: fadeInUp var(--motion-slow) var(--ease-out) forwards;
    }

    /* ═══════════════════════════════════════════════════════════
       页面头部
       ═══════════════════════════════════════════════════════════ */
    .header {
      margin-bottom: 56px;
      animation: fadeInUp var(--motion-slow) var(--ease-out) 100ms both;
    }

    .brand-name {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .brand-desc {
      font-size: 17px;
      color: var(--text-secondary);
      font-weight: 400;
      max-width: 480px;
    }

    /* ═══════════════════════════════════════════════════════════
       操作栏
       ═══════════════════════════════════════════════════════════ */
    .action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      animation: fadeInUp var(--motion-slow) var(--ease-out) 200ms both;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all var(--motion) var(--ease-spring);
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-primary svg {
      transition: transform var(--motion) var(--ease-spring);
    }

    .btn-primary:hover svg {
      transform: rotate(90deg);
    }

    .project-count {
      font-size: 14px;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    /* ═══════════════════════════════════════════════════════════
       项目列表（Double-Bezel 卡片）
       ═══════════════════════════════════════════════════════════ */
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .project-card {
      position: relative;
      padding: 2px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.4));
      box-shadow: var(--shadow-sm);
      transition: all var(--motion) var(--ease-spring);
      animation: fadeInUp var(--motion-slow) var(--ease-out) both;
    }

    .project-card:nth-child(1) { animation-delay: 300ms; }
    .project-card:nth-child(2) { animation-delay: 380ms; }
    .project-card:nth-child(3) { animation-delay: 460ms; }
    .project-card:nth-child(4) { animation-delay: 540ms; }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .project-card-inner {
      background: var(--bg-elevated);
      border-radius: calc(var(--radius-lg) - 2px);
      padding: 24px 28px;
      cursor: pointer;
      transition: background var(--motion) var(--ease);
    }

    .project-card-inner:hover {
      background: var(--bg-hover);
    }

    .project-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .project-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .project-actions {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity var(--motion) var(--ease);
    }

    .project-card:hover .project-actions {
      opacity: 1;
    }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      color: var(--text-tertiary);
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--motion) var(--ease);
    }

    .btn-icon:hover {
      background: var(--bg-active);
      color: var(--text);
      transform: scale(1.1);
    }

    .project-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-tertiary);
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      letter-spacing: 0.01em;
    }

    .tag-version {
      color: var(--green-900);
      background: rgba(0, 142, 107, 0.08);
    }

    .tag-type {
      color: #6b8a3a;
      background: var(--green-200);
    }

    .meta-separator {
      color: var(--border);
    }

    /* [20260616-04] 拖拽排序样式 */
    .drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: var(--text-tertiary);
      cursor: grab;
      opacity: 0;
      transition: opacity var(--motion) var(--ease);
      margin-right: 12px;
    }

    .project-card:hover .drag-handle {
      opacity: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .project-card.dragging {
      opacity: 0.5;
      transform: scale(0.98);
    }

    .project-card.drag-over {
      border-top: 2px solid var(--accent);
    }

    .project-card.drag-over::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      animation: slideIn 0.2s var(--ease);
    }

    @keyframes slideIn {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    /* ═══════════════════════════════════════════════════════════
       空状态
       ═══════════════════════════════════════════════════════════ */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 120px 20px;
      text-align: center;
      animation: fadeInUp var(--motion-slow) var(--ease-out) 300ms both;
    }

    .empty-icon {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      background: var(--bg-hover);
      border-radius: var(--radius-lg);
    }

    .empty-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    .empty-desc {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 400px;
    }

    /* ═══════════════════════════════════════════════════════════
       响应式
       ═══════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .container {
        padding: 48px 24px;
      }

      .brand-name {
        font-size: 38px;
      }

      .project-card-inner {
        padding: 20px;
      }

      .project-title {
        font-size: 17px;
      }
    }
  </style>
</head>
