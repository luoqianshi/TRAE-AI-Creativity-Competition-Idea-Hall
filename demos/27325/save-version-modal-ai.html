<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保存版本弹窗（AI 功能）— PRD Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #008E6B;
      --green-800: #007A5C;
      --green-700: #46B065;
      --green-500: #81C570;
      --green-200: #DCECB5;
      --green-50: #FBFFF2;
      --bg: #FBFFF2;
      --bg-elevated: #FFFFFF;
      --bg-hover: #F3F8EC;
      --bg-active: #E8F3DE;
      --text: #1A3A2F;
      --text-secondary: #5A7A6A;
      --text-tertiary: #8AAA9A;
      --border: rgba(0, 142, 107, 0.08);
      --accent: #008E6B;
      --accent-hover: #007A5C;
      --accent-soft: rgba(0, 142, 107, 0.08);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 20px;
      --motion-fast: 200ms;
      --motion: 400ms;
      --motion-slow: 600ms;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', 'SF Mono', monospace;
      --shadow-sm: 0 1px 4px rgba(0, 142, 107, 0.04);
      --shadow-md: 0 4px 16px rgba(0, 142, 107, 0.06);
      --shadow-lg: 0 8px 32px rgba(0, 142, 107, 0.08);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }
    
    /* 弹窗容器 */
    .modal-overlay {
      width: 100%;
      max-width: 560px;
      background: var(--bg-elevated);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: var(--shadow-lg);
      animation: modalIn var(--motion-slow) var(--ease-spring);
    }
    
    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    /* 弹窗头部 */
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    
    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .modal-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--green-200), rgba(220, 236, 181, 0.4));
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    
    .modal-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    
    .close-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      font-size: 18px;
      transition: all var(--motion-fast) var(--ease);
    }
    
    .close-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
      transform: rotate(90deg);
    }
    
    /* 表单区 */
    .form-section {
      margin-bottom: 24px;
    }
    
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      display: block;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      transition: all var(--motion-fast) var(--ease);
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    
    .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elevated);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      resize: vertical;
      min-height: 100px;
      transition: all var(--motion-fast) var(--ease);
    }
    
    .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    
    /* AI 生成 Release Notes 区 */
    .ai-section {
      margin-bottom: 24px;
      padding: 20px;
      background: linear-gradient(135deg, var(--bg-hover), var(--bg-active));
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    
    .ai-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .ai-section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .ai-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--accent);
      color: white;
    }
    
    .ai-generate-btn {
      padding: 8px 16px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--motion-fast) var(--ease);
    }
    
    .ai-generate-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .ai-generate-btn:active {
      transform: translateY(0) scale(0.98);
    }
    
    .ai-generate-btn .sparkle {
      font-size: 14px;
      animation: sparkle 2s ease-in-out infinite;
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.2); }
    }
    
    /* Release Notes 预览 */
    .release-notes-preview {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    
    .release-notes-preview.show {
      display: block;
      animation: fadeIn var(--motion) var(--ease-out);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .release-notes-preview h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text);
    }
    
    .release-notes-preview h4 {
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }
    
    .release-notes-preview ul {
      list-style: none;
      padding-left: 0;
    }
    
    .release-notes-preview li {
      padding: 4px 0;
      padding-left: 20px;
      position: relative;
    }
    
    .release-notes-preview li::before {
      content: '•';
      position: absolute;
      left: 8px;
      color: var(--accent);
      font-weight: 700;
    }
    
    /* 加载状态 */
    .ai-loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    
    .ai-loading.show {
      display: flex;
    }
    
    .ai-loading .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* 变更影响预测 */
    .impact-prediction {
      margin-top: 16px;
      padding: 12px 16px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: none;
    }
    
    .impact-prediction.show {
      display: block;
      animation: fadeIn var(--motion) var(--ease-out);
    }
    
    .impact-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .impact-modules {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .module-tag {
      padding: 4px 10px;
      background: var(--bg-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .module-impact {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
    }
    
    .module-impact.high {
      background: rgba(220, 38, 38, 0.08);
      color: #DC2626;
    }
    
    .module-impact.medium {
      background: rgba(217, 119, 6, 0.08);
      color: #D97706;
    }
    
    .module-impact.low {
      background: rgba(0, 142, 107, 0.08);
      color: var(--accent);
    }
    
    /* 底部操作区 */
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    
    .btn {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--motion-fast) var(--ease);
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .btn-secondary {
      background: var(--bg-hover);
      color: var(--text-secondary);
    }
    
    .btn-secondary:hover {
      background: var(--bg-active);
      color: var(--text);
      transform: translateY(-2px);
    }
    
    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .btn-primary:active {
      transform: translateY(0) scale(0.98);
    }
  </style>
</head>
<body>
  <div class="modal-overlay">
    <!-- 弹窗头部 -->
    <div class="modal-header">
      <div class="modal-title-group">
        <div class="modal-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></div>
        <div>
          <div class="modal-title">保存新版本</div>
          <div class="modal-subtitle">为当前文档创建一个版本快照</div>
        </div>
      </div>
      <button class="close-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    
    <!-- 表单区 -->
    <div class="form-section">
      <label class="form-label">版本号</label>
      <input type="text" class="form-input" value="v1.1.0" placeholder="例如：v1.0.0">
    </div>
    
    <div class="form-section">
      <label class="form-label">版本说明（可选）</label>
      <textarea class="form-textarea" placeholder="描述本次版本的主要变更..."></textarea>
    </div>
    
    <!-- AI 生成 Release Notes -->
    <div class="ai-section">
      <div class="ai-section-header">
        <div class="ai-section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          <span>AI 生成发布说明</span>
          <span class="ai-badge">NEW</span>
        </div>
        <button class="ai-generate-btn" id="generateBtn">
          <span class="sparkle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></span>
          <span>生成</span>
        </button>
      </div>
      
      <!-- 加载状态 -->
      <div class="ai-loading" id="aiLoading">
        <div class="spinner"></div>
        <span>AI 正在分析变更内容...</span>
      </div>
      
      <!-- Release Notes 预览 -->
      <div class="release-notes-preview" id="releaseNotesPreview">
        <h3>Release Notes — v1.1.0</h3>
        <h4><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg> 新功能</h4>
        <ul>
          <li>新增用户管理模块，支持注册、登录、权限管理</li>
          <li>新增数据导出功能，支持 CSV 和 Excel 格式</li>
          <li>新增邮件通知系统，支持自定义通知模板</li>
        </ul>
        <h4><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> 改进</h4>
        <ul>
          <li>优化项目列表排序逻辑，默认按更新时间排序</li>
          <li>调整登录超时时间从 30 分钟改为 15 分钟</li>
        </ul>
        <h4><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> 移除</h4>
        <ul>
          <li>移除游客模式，所有用户需登录后访问</li>
        </ul>
      </div>
      
      <!-- 变更影响预测 -->
      <div class="impact-prediction" id="impactPrediction">
        <div class="impact-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          <span>变更影响预测</span>
        </div>
        <div class="impact-modules">
          <div class="module-tag">
            用户管理
            <span class="module-impact high">高</span>
          </div>
          <div class="module-tag">
            登录流程
            <span class="module-impact medium">中</span>
          </div>
          <div class="module-tag">
            数据导出
            <span class="module-impact low">低</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 底部操作 -->
    <div class="modal-footer">
      <button class="btn btn-secondary">取消</button>
      <button class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        <span>保存版本</span>
      </button>
    </div>
  </div>
  
  <script>
    // 模拟 AI 生成 Release Notes
    document.getElementById('generateBtn').addEventListener('click', function() {
      const btn = this;
      const loading = document.getElementById('aiLoading');
      const preview = document.getElementById('releaseNotesPreview');
      const impact = document.getElementById('impactPrediction');
      
      // 显示加载状态
      btn.style.display = 'none';
      loading.classList.add('show');
      preview.classList.remove('show');
      impact.classList.remove('show');
      
      // 模拟 AI 处理
      setTimeout(() => {
        loading.classList.remove('show');
        preview.classList.add('show');
        
        setTimeout(() => {
          impact.classList.add('show');
          btn.style.display = 'flex';
          btn.querySelector('span:last-child').textContent = '重新生成';
        }, 300);
      }, 2000);
    });
    
    // 关闭按钮效果
    document.querySelector('.close-btn').addEventListener('click', function() {
      this.style.transform = 'rotate(90deg) scale(0.9)';
      setTimeout(() => {
        this.style.transform = '';
      }, 200);
    });
  </script>
</body>
</html>
